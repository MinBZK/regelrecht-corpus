  - number: '79'
    text: |-
      1 Het UWV verhaalt op de overheidswerkgever tot wie de dienstbetrekking bestond uit hoofde waarvan de
      overheidswerknemer de in onderdeel a bedoelde uitkering ontvangt:

      a. de op grond van [hoofdstuk II][ref1] te betalen uitkering aan die overheidswerknemer,
      met uitzondering van de premie verschuldigd over een uitkering, als bedoeld in
      [artikel 24, tweede lid, van de Wet financiering sociale verzekeringen][ref2];

      b. de op grond van enige wet over de uitkering, bedoeld in onderdeel a, door het UWV verschuldigde premies
      of vergoedingen als bedoeld in [artikel 46 van de Zorgverzekeringswet][ref3] die niet op deze uitkering in
      mindering kunnen worden gebracht, met uitzondering van de premie verschuldigd over een uitkering, als bedoeld in
      [artikel 24, tweede lid, van de Wet financiering sociale verzekeringen][ref4];

      c. de vergoeding, bedoeld in [artikel 110 van de Wet financiering sociale verzekeringen][ref5], die betrekking
      heeft op de persoon die de in onderdeel a bedoelde uitkering ontving.

      2 Voor de toepassing van het eerste lid wordt onder uitkering niet verstaan de uitkering aan een persoon:

      a. voor wie een beschikking geldt als bedoeld in
      [artikel 4a van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref6] waarin hij met betrekking tot de, in
      de in het eerste lid bedoelde dienstbetrekking, verrichte soort van werkzaamheden wordt aangemerkt als zelfstandige
      als bedoeld in [artikel 4 van die wet][ref7];

      b. waarvan het de overheidswerkgever niet redelijkerwijs duidelijk kon zijn dat deze tot hem in een
      privaatrechtelijke of publiekrechtelijke dienstbetrekking stond;

      c. die hij op grond van deze wet ontvangt in de eerste dertien weken van ongeschiktheid tot het verrichten van zijn
      arbeid wegens ziekte, waarbij [artikel 20, zevende lid][ref8], van overeenkomstige toepassing is.

      3 Op het totaal van de bedragen die op de overheidswerkgever op grond van het eerste lid over enig tijdvak
      wordt verhaald, wordt in mindering gebracht hetgeen het UWV in dat tijdvak ontvangt door de toepassing van
      [artikel 36][ref9], onder aftrek van de daarop betrekking hebbende uitvoeringskosten, voorzover die toepassing
      betrekking heeft op uitkeringen en premies die eerder op grond van dat lid op de overheidswerkgever zijn verhaald.

      4 Indien hetgeen op grond van het tweede lid in mindering wordt gebracht het totaal van de bedragen die op de
      overheidswerkgever over het betrokken tijdvak wordt verhaald overtreft, wordt dat meerdere door het UWV betaald aan
      de overheidswerkgever.

      5 Indien de overheidswerkgever, bedoeld in het eerste lid, niet meer bestaat, wordt voor de toepassing van het
      eerste tot en met derde lid onder overheidswerkgever verstaan de rechtsopvolger van die overheidswerkgever. De
      eerste zin is niet van toepassing met betrekking tot de rechtsopvolger na faillissement.

      6 Het UWV kan de in het eerste lid bedoelde bedragen invorderen bij dwangbevel.

      7 Het UWV kan nadere regels stellen met betrekking tot het eerste tot en met derde lid en het vijfde lid.


