  - number: '6'
    text: |-
      1 Als dienstbetrekking wordt niet beschouwd de arbeidsverhouding van een persoon:

      a. die minister, staatssecretaris, commissaris van de Koning, burgemeester, Nationale ombudsman, substituut-
      ombudsman, lid van gedeputeerde staten, wethouder, waaronder begrepen een lid van het dagelijks bestuur van een
      deelgemeente, voorzitter van een waterschap of de Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint
      Eustatius en Saba, is;

      b. die als vrijwilliger werkzaamheden verricht als politiebeambte, alsmede van degene die als vrijwilliger al dan
      niet tegen loon werkzaamheden verricht bij de brandweer;

      c. die doorgaans op minder dan vier dagen per week uitsluitend of nagenoeg uitsluitend diensten verricht ten
      behoeve van het huishouden van de natuurlijke persoon tot wie hij in dienstbetrekking staat;

      d. die directeur-grootaandeelhouder is;

      e. indien degene met wie hij de arbeidsverhouding heeft, met betrekking tot die arbeidsverhouding op grond van
      [artikel 6a van de Wet op de loonbelasting 1964][ref1] niet als inhoudingsplichtige wordt beschouwd;

      f. die als vrijwilliger als bedoeld in [artikel 2, zesde lid, van de Wet op de loonbelasting 1964][ref2],
      uitsluitend vergoedingen of verstrekkingen als bedoeld in dat lid ontvangt met een gezamenlijke waarde van ten
      hoogste € 150 per maand en € 1 500 per kalenderjaar.

      2 Voor de toepassing van het eerste lid, onderdeel c, wordt onder het verrichten van diensten ten behoeve van een
      huishouden mede verstaan het verlenen van zorg aan de leden van dat huishouden.

      3 Het eerste lid is alleen van toepassing op de aldaar bedoelde arbeidsverhoudingen.

      4 Door Onze Minister worden, in overeenstemming met Onze Minister van Financiën, regels gesteld omtrent hetgeen
      onder directeur-grootaandeelhouder, bedoeld in het eerste lid, onderdeel *d*, wordt verstaan.

      5 Als dienstbetrekking wordt niet beschouwd de arbeidsverhouding van de overheidswerknemer, voor zover de
      overheidswerknemer als gevolg van de beëindiging van die arbeidsverhouding recht op wachtgeld heeft verkregen
      of verkrijgt. Onder wachtgeld als bedoeld in de eerste zin wordt verstaan: een wachtgeld in de zin van het
      [Rijkswachtgeldbesluit 1959][ref3], zoals dat luidde op 31 december 2000, of een soortgelijke uitkering van
      een overheidswerknemer op grond van ontslag of werkloosheid alsmede een wachtgeld of daarmee gelijkgestelde
      uitkering in de zin van de bij of krachtens de [Kaderwet militaire pensioenen][ref4] vastgestelde bepalingen, met
      uitzondering van een uitkering in verband met functioneel leeftijdsontslag of vrijwillig vervroegd uittreden.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel6a
