  - number: 42c
    text: |-
      1 De persoon die op de dag, onmiddellijk voorafgaande aan de eerste dag van werkloosheid, werknemer in de zin van
      deze wet was, wordt voor de toepassing van de [artikelen 42][ref1] en [42a][ref2] als werknemer in de zin van deze
      wet beschouwd gedurende de periode waarin hij:

      a. voor 1 januari 1987 als werknemer in de zin van de Werkloosheidswet of de [Wet Werkloosheidsvoorziening][ref3]
      zoals die wetten luidden op 31 december 1986 in dienstbetrekking heeft gestaan dan wel zijn militaire dienstplicht
      of in plaats daarvan vervangende dienst heeft vervuld;

      b. vanaf 1 januari 1987 een arbeidsverhouding had ter zake waarvan hem door het Rijk invaliditeitspensioen was
      verzekerd.

      2 Ten aanzien van de persoon, bedoeld in [artikel 17c, vierde lid][ref4], is het eerste lid, onderdeel a, van
      overeenkomstige toepassing.


