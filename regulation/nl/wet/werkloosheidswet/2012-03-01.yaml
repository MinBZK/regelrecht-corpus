  - number: '127'
    text: |-
      1 Onverminderd [artikel 127a][ref1], worden beschikkingen op grond van deze wet en de daarop berustende bepalingen
      gegeven binnen een redelijke termijn na ontvangst van de aanvraag.

      2 De redelijke termijn is in ieder geval verstreken wanneer binnen acht weken na ontvangst van de aanvraag geen
      beschikking is gegeven, noch een kennisgeving als bedoeld in het derde of vierde lid is gedaan.

      3 Indien een beschikking niet binnen de termijn van acht weken kan worden gegeven, wordt die termijn met een
      redelijke termijn verlengd en wordt de aanvrager daarvan schriftelijk in kennis gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel127a
    url: https://wetten.overheid.nl/BWBR0004045/2012-03-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 127a
        hoofdstuk: X
  - number: 127a
    text: |-
      1 Een aanvraag tot het geven van een beschikking over het verzekerd zijn op grond van deze wet kan door de
      werknemer uitsluitend bij het UWV worden ingediend. Het UWV geeft de beschikking binnen dertien weken na ontvangst
      van de aanvraag.

      2 Een beschikking over de betaling van een voorschot op grond van [artikel 31][ref1] of
      [4:95, eerste lid, van de Algemene wet bestuursrecht][ref2] wordt gegeven binnen vier weken na ontvangst van de
      aanvraag.

      3 Een beschikking op grond van [hoofdstuk IV][ref3] en de daarop berustende bepalingen wordt gegeven binnen zes
      maanden na ontvangst van de aanvraag.

      4 Indien een beschikking als bedoeld in het eerste, tweede of derde lid niet binnen de toepasselijke termijn kan
      worden gegeven, wordt dit schriftelijk aan de aanvrager medegedeeld onder vermelding van een zo kort mogelijke
      termijn waarbinnen de beschikking wel tegemoet kan worden gezien.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel495
      [ref3]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0004045/2012-03-01#Artikel127a
