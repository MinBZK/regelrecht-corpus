  - number: 76a
    text: |-
      1 Het UWV kan toestemming verlenen aan de werknemer, die recht heeft op een uitkering op grond van
      [hoofdstuk II][ref1], om op een proefplaats bij een werkgever gedurende maximaal drie maanden onbeloonde
      werkzaamheden te verrichten.

      2 Voor de werknemer, bedoeld in het eerste lid, blijft het recht op uitkering op grond van [hoofdstuk II][ref2]
      bestaan, onverminderd [artikel 20, eerste lid, aanhef en onderdeel e][ref3], gedurende de periode waarover
      toestemming is verleend tot het verrichten van die werkzaamheden.

      3 De onbeloonde werkzaamheden op een proefplaats zijn:

      a. werkzaamheden, waartoe de werknemer met zijn krachten en bekwaamheden in staat is;

      b. werkzaamheden, waarbij de werkgever, bij wie de proefplaatsing geschiedt, een aansprakelijkheids- en
      ongevallenverzekering ten behoeve van de werknemer heeft afgesloten;

      c. werkzaamheden, die de werknemer niet reeds eerder onbeloond op een proefplaats bij die werkgever of diens
      rechtsvoorganger heeft verricht; en

      d. werkzaamheden, waarbij er, naar het oordeel van het UWV, een reëel uitzicht is op een op de onbeloonde
      werkzaamheden aansluitende dienstbetrekking van dezelfde of grotere omvang voor ten minste 6 maanden.

      4 Indien de werkzaamheden, bedoeld in het eerste lid, wegens ziekte worden onderbroken, wordt de periode waarin een
      uitkering bij ziekte wordt ontvangen, voor de toepassing van dat lid buiten beschouwing gelaten.

      5 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de uitvoering van het eerste tot en met het
      vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0004045#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel20
