        hoofdstuk: III
  - number: '58'
    text: |-
      1 De persoon, die om toelating tot de vrijwillige werkloosheidsverzekering verzoekt, bepaalt bij de aanvang van de
      vrijwillige werkloosheidsverzekering de hoogte van het dagloon, met dien verstande dat dit niet meer kan bedragen
      dan:

      a. het bedrag, bedoeld in [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref1], met
      betrekking tot een loontijdvak van een dag eventueel verhoogd of verlaagd krachtens [artikel 18 van die wet][ref2];
      en

      b. het loon of het inkomen dat hij in geval van werkloosheid naar het oordeel van het UWV derft.

      2 Voor de vaststelling van de hoogte van het recht op uitkering op grond van de vrijwillige
      werkloosheidsverzekering wordt, zonodig in afwijking van [artikel 45][ref3] en de daarop berustende bepalingen,
      onder dagloon verstaan het in het eerste lid bedoelde dagloon.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel45
    url: https://wetten.overheid.nl/BWBR0004045/2012-03-01#Artikel58
