  - number: '11'
    text: |-
      1 Het UWV wordt als werkgever beschouwd in de gevallen waarin:

      a. ziekengeld wordt betaald op grond van de verplichte verzekering krachtens de [Ziektewet][ref1];

      b. uitkering wordt betaald op grond van de verplichte verzekering of [hoofdstuk IV van deze wet][ref2];

      c. uitkering wordt betaald op grond van de verplichte verzekering op grond van de
      [Wet werk en inkomen naar arbeidsvermogen][ref3] of de [Wet op de arbeidsongeschiktheidsverzekering][ref4];

      d. uitkering wordt betaald op grond van [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref5]
      aan de werknemer of gelijkgestelde, bedoeld in [artikel 3:6, eerste lid, van die wet][ref6];

      e. geen ziekengeld wordt betaald op grond van [artikel 29, eerste lid, van de Ziektewet][ref7] maar wel een toeslag
      op grond van de [Toeslagenwet][ref8].

      2 Ingeval het UWV de uitkering of toeslag, bedoeld in het eerste lid, vermeerderd met de daarover door de werkgever
      verschuldigde premies en de vergoeding, bedoeld in [artikel 46 van de Zorgverzekeringswet][ref9], betaalt aan
      de werkgever, bedoeld in [artikel 9][ref10], [10][ref11] of [12][ref12], teneinde deze uitkering door diens
      tussenkomst te doen uitbetalen, treedt voor de toepassing van het eerste lid, deze in de plaats van het UWV,
      onafhankelijk van het voortbestaan van de dienstbetrekking met die werkgever.

      3 Bij ministeriële regeling kunnen met betrekking tot de door de werkgever verschuldigde premies, bedoeld in het
      tweede lid, nadere en zonodig afwijkende regels worden gesteld.


