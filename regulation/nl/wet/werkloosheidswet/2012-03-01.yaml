  - number: '19'
    text: |-
      1 Geen recht op uitkering heeft de werknemer die:

      a. een uitkering ontvangt op grond van de [Ziektewet][ref1] of een uitkering die naar aard en strekking daarmee
      overeenkomt;

      b. een arbeidsongeschiktheidsuitkering dan wel een loongerelateerde uitkering van de werkhervattingsuitkering
      gedeeltelijk arbeidsgeschikten ontvangt op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref2];

      c. een uitkering ontvangt op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref3], berekend naar een
      arbeidsongeschiktheid van ten minste 80%, of een uitkering ontvangt die naar aard en strekking met die uitkering
      overeenkomt;

      d. een uitkering ontvangt op grond van [hoofdstuk III van de Wet arbeidsongeschiktheidsvoorziening militairen][ref4],
      berekend naar een arbeidsongeschiktheid van ten minste 80%, of een toelage op grond van dat hoofdstuk, die, al
      dan niet vermeerderd met de arbeidsongeschiktheidsuitkering, 70% of meer bedraagt van het dagloon waarnaar de
      arbeidsongeschiktheidsuitkering is of zou zijn berekend;

      e. buiten Nederland woont of verblijf houdt anders dan wegens vakantie;

      f. niet rechtmatig in Nederland verblijf houdt als bedoeld in [artikel 8 van de Vreemdelingenwet 2000][ref5];

      g. rechtens zijn vrijheid is ontnomen;

      h. zich onttrekt aan de tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel;

      i. de eerste dag van de maand waarin hij 65 jaar wordt heeft bereikt;

      j. op grond van [artikel 64 van de Wet financiering sociale verzekeringen][ref6] een ontheffing wegens
      gemoedsbezwaren heeft of wiens werkloosheid binnen 3 maanden na de datum van intrekking van een zodanige ontheffing
      is aangevangen;

      k. vakantie geniet;

      l. werkloos is ten gevolge van werkstaking of uitsluiting, tenzij voor de werknemer een ontheffing is verleend op
      grond van [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref7];

      m. een uitkering ontvangt op grond van de [Wet arbeid en zorg][ref8].

      2 Indien een uitkering als bedoeld in het eerste lid, onderdeel *a*, *b*, *c* of *d* niet wordt betaald wegens voor
      de werknemer geldende wachtdagen of wegens enig handelen of nalaten dat hem redelijkerwijs kan worden verweten,
      wordt het niet betalen daarvan voor de toepassing van het eerste lid gelijkgesteld met het ontvangen van die
      uitkering. Onder wachtdagen worden niet verstaan de eerste dertien weken van ongeschiktheid van de werknemer tot
      het verrichten van zijn arbeid wegens ziekte.

      3 Geen recht op uitkering heeft de werknemer over een dag waarop zijn arbeid wordt onderbroken uitsluitend doordat:

      a. deze dag voor hem als rustdag geldt;

      b. deze dag een nationale of algemeen erkende christelijke feestdag is, dan wel een kerkelijke feestdag, die ter
      plaatse waar de werknemer pleegt te werken, algemeen als zodanig wordt gevierd.

      4 Het eerste lid blijft buiten toepassing ten aanzien van de werknemer die uitsluitend uit hoofde van een andere
      dienstbetrekking dan de dienstbetrekking waaruit hij werkloos is geworden in een omstandigheid verkeert als bedoeld
      in het eerste lid.

      5 Bij ministeriële regeling kunnen regels worden gesteld:

      a. met betrekking tot het begrip vakantie genieten, bedoeld in het eerste lid, onderdeel k;

      b. met betrekking tot de vaststelling van de periode gedurende welke de werknemer, in afwijking van het eerste lid,
      onderdeel k, met behoud van zijn recht op uitkering vakantie kan genieten.

      6 Onze Minister is bevoegd voor gevallen waarin toepassing van het eerste lid, onderdeel a tot en met h, tot
      onbillijkheden zou kunnen leiden, regels te stellen op grond waarvan kan worden afgeweken van het bepaalde in die
      onderdelen.

      7 Het eerste lid, onderdeel g, is niet van toepassing op bij algemene maatregel van bestuur aan te wijzen
      categorieën personen waarbij tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel plaatsvindt
      buiten een penitentiaire inrichting, een inrichting voor verpleging van ter beschikking gestelden, of een
      inrichting als bedoeld in [artikel 1, onderdeel b, van de Beginselenwet justitiële jeugdinrichtingen][ref9].

      8 Het eerste lid, onderdeel b, is niet van toepassing op:

      a. de werknemer, bedoeld in [artikel 18, eerste lid][ref10];

      b. de werknemer wiens werkloosheid uitsluitend het gevolg is van verkorting van de werktijd waarvoor op grond van
      [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref11] ontheffing is verleend, en

      c. de werknemer wiens werkloosheid is ontstaan na het ontstaan van het recht op de loongerelateerde
      uitkering van de werkhervattingsuitkering gedeeltelijk arbeidsgeschikten op grond van de
      [Wet werk en inkomen naar arbeidsvermogen][ref12].

      9 In afwijking van het eerste lid, onderdeel e, blijft het recht op uitkering bestaan ten aanzien van de werknemer
      die buiten Nederland verblijf houdt anders dan wegens vakantie, indien hij gedurende dat verblijf meewerkt aan
      activiteiten die bevorderlijk zijn voor zijn inschakeling in de arbeid als bedoeld in de [hoofdstukken VI][ref13]
      en [XA][ref14], mits:

      a. die activiteiten niet langer duren dan zes maanden;

      b. die activiteiten blijkens een intentieverklaring een reëel uitzicht bieden op een aansluitende dienstbetrekking
      voor ten minste zes maanden;

      c. die activiteiten plaatsvinden in een lidstaat van de Europese Unie, in een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte of in Zwitserland; en

      d. het bedrag dat het Uitvoeringsinstituut werknemersverzekeringen is verschuldigd terzake van die activiteiten
      niet hoger is dan het op grond van [artikel 4.2, derde lid, van het Besluit SUWI][ref15] vastgestelde bedrag.

      10 Voor de toepassing van dit artikel wordt onder intentieverklaring verstaan: een ondertekende verklaring
      waarin de ondertekenaar aangeeft dat hij het voornemen heeft om een werknemer die meewerkt aan activiteiten die
      bevorderlijk zijn voor zijn inschakeling in de arbeid als bedoeld in de [hoofdstukken VI][ref16] en [XA][ref17], na
      afloop van die activiteiten in dienst te nemen.


