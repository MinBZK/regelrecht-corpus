  - number: '43'
    text: |-
      1 Telkens nadat het recht op uitkering na gehele eindiging van dat recht is herleefd op grond van
      [artikel 21][ref1], eindigt de uitkering zoveel later dan de in [artikel 42, eerste, tweede en derde lid][ref2],
      bedoelde periode als de periode tussen de eindiging en herleving van het recht op uitkering heeft geduurd.

      2 Voor de persoon, bedoeld in [artikel 29, tweede lid, onderdeel d, aanhef en onder 1°, van de Ziektewet][ref3]
      die eerder dan de eerste dag van de veertiende week van de ongeschiktheid tot het verrichten van zijn arbeid
      een uitkering ontvangt op grond van die wet wordt voor de vaststelling van de periode tussen de eindiging en de
      herleving van het recht op uitkering, de periode waarin het ziekengeld wordt uitbetaald tijdens de eerste 13 weken
      van ongeschiktheid tot het verrichten van zijn arbeid, buiten beschouwing gelaten.

      3 Voor de persoon, bedoeld in [artikel 29, tweede lid, onderdeel e of f, van de Ziektewet][ref4] worden voor de
      vaststelling van de periode tussen de eindiging en de herleving van het recht op uitkering, telkens nadat het recht
      op uitkering geheel is geëindigd wegens ziekte, de eerste dertien weken waarin de persoon een uitkering ontvangt op
      grond van de [Ziektewet][ref5] buiten beschouwing gelaten.

      4 Voor de bepaling van de periode van dertien weken bedoeld in het derde lid, worden perioden waarover een
      uitkering op grond van de [Ziektewet][ref6] wordt ontvangen samengeteld, indien zij elkaar met een onderbreking van
      minder dan vier weken opvolgen.

      5 [Artikel 19, tweede lid][ref7], is van toepassing op het tweede tot en met vierde lid.


