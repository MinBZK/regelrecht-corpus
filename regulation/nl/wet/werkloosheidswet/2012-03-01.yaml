  - number: '37'
    text: |-
      Ingeval het UWV een aan een overheidswerknemer toegekende uitkering op grond van deze
      wet, de [Ziektewet][ref1], de [Wet op de arbeidsongeschiktheidsverzekering][ref2] of
      [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref3], dan wel een toeslag op grond van de
      [Toeslagenwet][ref4] betaalt aan een overheidswerkgever met het oogmerk die uitkering of toeslag door diens
      tussenkomst te doen uitbetalen:

      a. wordt de bedoelde uitkering of toeslag niet vermeerderd met de daarover door de werkgever verschuldigde premie
      op grond van [artikel 24, tweede lid, van de Wet financiering sociale verzekeringen][ref5] en wordt die uitkering
      of toeslag verminderd met het door de overheidswerknemer of gewezen overheidswerknemer verschuldigde deel van de
      premie op grond van dat lid;

      b. treedt, in afwijking van [artikel 11, tweede lid][ref6],
      [artikel 10, derde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref7], en
      [artikel 11, derde lid, van de Ziektewet][ref8], voorzover die artikelleden betrekking hebben op de premie bedoeld
      in [artikel 24, tweede lid, van de Wet financiering sociale verzekeringen][ref9], de overheidswerkgever niet in de
      plaats van het UWV;

      c. wordt voor de inhouding, bedoeld in [artikel 32, eerste lid, van de Wet financiering sociale verzekeringen][ref10]
      onder loon niet verstaan de bedoelde uitkering of toeslag.


