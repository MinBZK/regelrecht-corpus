  - number: '63'
    text: |-
      1 De werknemer, wiens werkgever verkeert in een toestand als bedoeld in [artikel 61][ref1], is verplicht:

      a. indien geen tijdige betaling van loon, vakantiegeld of vakantiebijslag heeft plaatsgevonden, binnen een week na
      de dag waarop hij deze betaling normaal zou hebben ontvangen daarvan aangifte te doen bij het UWV; en

      b. binnen een week na de dag waarop het hem redelijkerwijs duidelijk moet zijn geweest dat zijn werkgever de
      bedragen, bedoeld in [artikel 61][ref2], niet heeft betaald, daarvan aangifte te doen bij het UWV.

      2 Indien de werknemer een verplichting hem op grond van het eerste lid opgelegd, niet of niet behoorlijk is
      nagekomen, weigert het Uitvoeringsinstituut werknemersverzekeringen de uitkering op grond van dit hoofdstuk
      tijdelijk of blijvend, geheel of gedeeltelijk.

      3 Indien het de werknemer voor de totstandkoming van de dienstbetrekking of voor een wijziging in de
      arbeidsvoorwaarden tijdens de dienstbetrekking redelijkerwijs duidelijk moet zijn geweest dat in verband met
      een toestand als bedoeld in [artikel 61][ref3], geen of slechts ten dele betaling zou plaatsvinden van loon,
      vakantiegeld, vakantiebijslag of aan derden verschuldigde bedragen in verband met de dienstbetrekking van de
      werknemer, is het tweede lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel61
