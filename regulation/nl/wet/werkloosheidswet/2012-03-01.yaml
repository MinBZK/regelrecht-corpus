  - number: 72a
    text: |-
      1 De overheidswerkgever heeft tot taak de inschakeling in de arbeid te bevorderen van:

      a. een persoon die uit hoofde van een dienstbetrekking als overheidswerknemer met die overheidswerkgever recht
      heeft op uitkering op grond van [hoofdstuk II][ref1];

      b. een overheidswerknemer die kan aantonen dat de dienstbetrekking binnen vier maanden zal eindigen en van wie
      naar het oordeel van het UWV redelijkerwijs valt aan te nemen dat hij recht zal hebben op een uitkering op grond
      van [hoofdstuk II][ref2].

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het ten behoeve
      van een persoon als bedoeld in het eerste lid sluiten van een individuele reïntegratieovereenkomst met een
      reïntegratiebedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukII
