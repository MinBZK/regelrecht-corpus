  - number: '80'
    text: |-
      1 Een beschikking tot verhaal van uitkering, premies of vergoeding als bedoeld in [artikel 79, eerste lid][ref1],
      wordt niet meer gegeven indien meer dan vijf jaren sedert het einde van het kalenderjaar zijn verstreken, waarin
      zij zijn betaald of afgedragen.

      2 Uitkering, premies of vergoeding, die niet zijn ingevorderd binnen tien jaren na het geven van de beschikking tot
      verhaal, worden niet meer ingevorderd.

      3 De rechtsvordering tot terugbetaling van een onverschuldigd betaald bedrag in verband met verhaal van uitkering,
      premies of vergoeding verjaart door verloop van vijf jaren sedert het einde van het kalenderjaar waarin de
      beschikking tot verhaal is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel79
    url: https://wetten.overheid.nl/BWBR0004045/2012-03-01#Artikel80
