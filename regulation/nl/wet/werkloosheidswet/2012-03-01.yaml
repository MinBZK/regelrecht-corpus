  - number: '67'
    text: |-
      Voor de toepassing van dit hoofdstuk wordt:

      a. onder loon verstaan: al hetgeen de werkgever in verband met de dienstbetrekking aan de werknemer rechtens
      verschuldigd is met uitzondering van vakantiegeld en vakantiebijslag;

      b. onder vakantiegeld en vakantiebijslag ook verstaan: vakantiebonnen, vakantiezegels en andere dergelijke
      waardepapieren; en

      c. onder werknemer ook verstaan: de persoon die uitsluitend omdat hij 65 jaar of ouder is niet als werknemer wordt
      beschouwd.
