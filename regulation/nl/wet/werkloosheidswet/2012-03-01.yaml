  - number: '38'
    text: |-
      1 Voor het in ontvangst nemen en het verlenen van kwijting voor de betaling van de uitkering, wordt een
      minderjarige met een meerderjarige gelijk gesteld.

      2 Indien de wettelijke vertegenwoordiger van de minderjarige zich schriftelijk bij het UWV verzet tegen betaling
      aan de minderjarige wordt de uitkering aan de wettelijke vertegenwoordiger betaald.
    url: https://wetten.overheid.nl/BWBR0004045/2012-03-01#Artikel38
  - number: '39'
    text: |-
      1 Indien degene aan wie een uitkering is toegekend, aanspraak heeft op verstrekking of vergoeding van zorg als
      bedoeld in de [Algemene Wet Bijzondere Ziektekosten][ref1] en op grond van [die wet][ref2] een bijdrage voor die
      zorg verschuldigd is, is het UWV bevoegd de uitkering tot het bedrag van die bijdrage in plaats van aan degene,
      aan wie de uitkering is toegekend, zonder diens machtiging uit te betalen aan het College voor zorgverzekeringen,
      genoemd in [artikel 58, eerste lid, van de Zorgverzekeringswet][ref3].

      2 Indien degene, aan wie een uitkering is toegekend, in een inrichting ter verpleging van geesteszieken of van
      zwakzinnigen is opgenomen en het UWV, van de desbetreffende inrichting of van het college van burgemeester en
      wethouders van de gemeente die de opnamekosten betaalt, het verzoek ontvangt om de uitkering aan die inrichting
      of die gemeente uit te betalen, is het UWV bevoegd dat verzoek zonder het stellen van andere voorwaarden in te
      willigen.

      3 Indien het eerste lid toepassing vindt, heeft de in het tweede lid bedoelde bevoegdheid betrekking op het
      gedeelte van de uitkering, dat niet aan het College voor zorgverzekeringen wordt uitbetaald.

      4 Een herziening van de uitkering op grond van het eerste lid als gevolg van een wijziging van de verschuldigde
      bijdrage vindt plaats zonder dat dit bij beschikking is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0002614
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel58
    url: https://wetten.overheid.nl/BWBR0004045/2012-03-01#Artikel39
