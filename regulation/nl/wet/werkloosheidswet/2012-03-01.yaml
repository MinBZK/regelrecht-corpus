  - number: '29'
    text: |-
      Bij een besluit tot herziening van de uitkering wordt mededeling gedaan van de herziening en, in een bijlage, van
      de op die herziening betrekking hebbende gewijzigde rechten en plichten van de werknemer.
    url: https://wetten.overheid.nl/BWBR0004045/2012-03-01#Artikel29
  - number: '30'
    text: |-
      1 Het UWV betaalt de uitkering waarop op grond van deze wet recht bestaat.

      2 Het UWV schort de betaling van de uitkering op of schorst de betaling, indien het op grond van duidelijke
      aanwijzingen van oordeel is of het gegronde vermoeden heeft, dat:

      a. het recht op uitkering niet of niet meer bestaat;

      b. recht op een lagere uitkering bestaat; of

      c. de werknemer een verplichting, hem op grond van de [artikelen 24][ref1], [25][ref2] of [26][ref3] opgelegd, niet
      is nagekomen.

      3 Indien een reïntegratiebedrijf aan het UWV heeft gemeld dat het gegronde vermoeden bestaat dat een persoon aan
      wie een uitkering op grond van deze wet is toegekend onvoldoende medewerking verleent aan de op hem betrekking
      hebbende werkzaamheden van het reïntegratiebedrijf, neemt het UWV een besluit omtrent de gehele of gedeeltelijke
      opschorting of schorsing van de betaling van de uitkering aan die persoon voor de duur van ten hoogste acht weken.

      4 Het UWV stelt het reïntegratiebedrijf in kennis van een besluit tot opschorting of schorsing als bedoeld in het
      derde lid.

      5 De uitkering wordt uitbetaald over 5 dagen per week.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel26
    url: https://wetten.overheid.nl/BWBR0004045/2012-03-01#Artikel30
