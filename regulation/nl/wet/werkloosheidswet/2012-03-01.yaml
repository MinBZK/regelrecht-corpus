    text: |-
      1 De [artikelen 42][ref1] en [17b][ref2], zoals deze luidden op de dag voor inwerkingtreding van de wet van
      4 november 2004 tot wijziging van de Werkloosheidswet en de Wet structuur uitvoeringsorganisatie werk en
      inkomen in verband met de vervanging van fictief arbeidsverleden door feitelijk arbeidsverleden en de beperking
      van het verzorgingsforfait Stb. 2004, 594, blijven van toepassing op een recht op uitkering waarbij de eerste
      werkloosheidsdag is gelegen voor of op die dag.

      2 In afwijking van de eerste zin van [artikel 17b, tweede lid][ref3], worden voor de toepassing van
      [artikel 17, aanhef en onderdeel b, onder 1°][ref4], niet reeds in aanmerking genomen kalenderjaren
      over de periode tot 1 januari 2005, waarin een persoon recht heeft op kinderbijslag op grond van
      [artikel 7 van de Algemene Kinderbijslagwet][ref5] of een andere gezinsbijslag als bedoeld in artikel 4, eerste
      lid, onderdeel h, van [verordening (EG) nr. 1408/71](31971R1408) van de Raad van de Europese Gemeenschap van 14
      juni 1971 betreffende de toepassing van socialezekerheidsregelingen op werknemers en zelfstandigen, alsmede op hun
      gezinsleden, die zich binnen de Gemeenschap verplaatsen (PbEG L 149) voor een tot zijn huishouden behorend kind
      dat bij de aanvang van dat kalenderjaar de leeftijd van vijf jaar niet heeft bereikt, gelijkgesteld met, en worden
      dergelijke kalenderjaren over de periode van 1 januari 2005 tot 1 januari 2007 voor drie kwart gelijkgesteld met,
      kalenderjaren waarin over 52 of meer dagen loon is ontvangen.


