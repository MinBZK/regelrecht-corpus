  - number: 130q
    text: |-
      De [artikelen 19][ref1], [20][ref2], [27][ref3], [43][ref4] en [79, tweede lid][ref5], en de daarop berustende
      bepalingen zoals deze luidden op de dag voor inwerkingtreding van artikel I, onderdeel EE, van de Wet wijziging
      WW-stelsel blijven van toepassing met betrekking tot een recht op uitkering van de persoon wiens eerste dag tot
      ongeschiktheid tot het verrichten van arbeid wegens ziekte is gelegen op of voor die dag.


