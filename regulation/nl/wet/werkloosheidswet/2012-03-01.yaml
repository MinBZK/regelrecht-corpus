  - number: 42b
    text: |-
      1 Indien het recht op uitkering geheel of gedeeltelijk is geëindigd en vervolgens een nieuw recht op uitkering
      is ontstaan, zonder dat aan de voorwaarde, bedoeld in [artikel 42, tweede lid][ref1], wordt voldaan, wordt met
      inachtneming van het tweede lid, de duur van dat nieuwe recht verlengd met de duur van de verlengde uitkering,
      bedoeld in [artikel 42, tweede lid][ref2], van het eerdere recht voorzover de werknemer hierover geen uitkering
      heeft ontvangen als gevolg van de eindiging van dat eerdere recht.

      2 Het eerste lid vindt geen toepassing voorzover het eerdere recht geheel of gedeeltelijk was geëindigd op grond
      van [artikel 20, eerste lid, onderdeel a, b, c of d][ref3], en op grond van [artikel 21][ref4] niet voor herleving
      in aanmerking zou zijn gekomen wegens het overschrijden van de in laatstgenoemd artikel bedoelde termijnen.


