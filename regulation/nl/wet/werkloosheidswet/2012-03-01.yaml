  - number: 130v
    text: |-
      De loonkostensubsidie die voor de dag van inwerkingtreding van de [Wet stimulering arbeidsparticipatie][ref1],
      op grond van het [Tijdelijk besluit brugbanen herbeoordeelden][ref2], is verstrekt aan een werkgever ten
      behoeve van een persoon die op de dag voor aanvang van die gesubsidieerde dienstbetrekking recht had op een
      uitkering op grond van deze wet en geen recht had op een arbeidsongeschiktheidsuitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref3], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref4]
      of de [Wet werk en arbeidsondersteuning jonggehandicapten][ref5], wordt aangemerkt als loonkostensubsidie als
      bedoeld in [artikel 78a][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0025045
      [ref2]: https://wetten.overheid.nl/BWBR0023551
