      - id: ref1
        bwb_id: BWBR0002614
      - id: ref2
        bwb_id: BWBR0002614
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '58'
  - number: '40'
    text: |-
      1 De uitkering is onvervreemdbaar en niet vatbaar voor verpanding of belening.

      2 Een machtiging tot het in ontvangst nemen van de uitkering, onder welke vorm of benaming ook verleend, is steeds
      herroepelijk.

      3 Elk beding, strijdig met het eerste of tweede lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0004045/2012-03-01#Artikel40
  - number: '41'
    text: |-
      De uitkering wordt niet betaald indien deze per week doorgaans minder bedraagt dan een achtste deel van het
      minimumloon.
    url: https://wetten.overheid.nl/BWBR0004045/2012-03-01#Artikel41
  - number: '42'
    text: |-
      1 De uitkeringsduur is drie maanden, te rekenen vanaf de eerste dag waarop het recht op uitkering is ontstaan.

      2 Indien de werknemer:

      a. aantoont in de periode van vijf kalenderjaren onmiddellijk voorafgaande aan het kalenderjaar waarin zijn eerste
      werkloosheidsdag is gelegen, in tenminste vier kalenderjaren over 52 of meer dagen per kalenderjaar loon te hebben
      ontvangen; of

      b. onmiddellijk voorafgaande aan of op zijn eerste dag van werkloosheid recht heeft op een uitkering op grond van
      een wet als genoemd in [artikel 19, eerste lid, onderdeel b, c, of d][ref1];

      wordt de uitkeringsduur verlengd met een maand voor ieder volledig kalenderjaar dat het arbeidsverleden de duur van
      drie kalenderjaren overstijgt, met dien verstande dat de totale uitkeringsduur maximaal 38 maanden bedraagt.

      3 Bij het vaststellen van de uitkeringsduur op grond van het eerste en tweede lid blijven perioden waarin recht op
      uitkering bestaat op grond van [artikel 18, eerste lid][ref2], buiten beschouwing.

      4 Het arbeidsverleden, bedoeld in het tweede lid, wordt berekend door samentelling van:

      a. het aantal kalenderjaren, vanaf en met inbegrip van 1998 tot en met het kalenderjaar onmiddellijk voorafgaande
      aan het kalenderjaar waarin zijn eerste werkloosheidsdag is gelegen, waarover de werknemer over 52 of meer dagen
      loon heeft ontvangen; en

      b. het aantal kalenderjaren vanaf en met inbegrip van het kalenderjaar waarin de werknemer zijn 18e verjaardag
      bereikte tot 1998.

      5 Een kalenderjaar wordt in aanmerking genomen bij de berekening, bedoeld in het vierde lid, onderdeel a, indien
      volgens de informatie, bedoeld in [artikel 33d van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3],
      de werknemer in dat kalenderjaar over 52 of meer dagen loon heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel33d
