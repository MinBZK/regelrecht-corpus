      1 De [artikelen 17a, eerste lid, onderdeel c][ref1], [17b, eerste lid, onderdeel a][ref2],
      [19, eerste lid, onderdeel m][ref3], [28, derde lid][ref4], [76, eerste lid][ref5], en de daarop berustende
      bepalingen, zoals die luidden op de dag voor inwerkingtreding van de wet van 23 december 2004 houdende
      wijziging van enkele socialeverzekeringswetten en enige andere wetten in verband met het aanbrengen van enige
      vereenvoudigingen, blijven van toepassing op de werknemer die voor de datum van inwerkingtreding van die wet:

      a. een voor hem, naar het oordeel van het UWV, noodzakelijke opleiding of scholing volgt, of

      b. een reïntegratie-uitkering als bedoeld in
      [artikel 23, eerste lid, van de Wet op de (re)integratie arbeidsgehandicapten][ref6], zoals dat artikel luidde op
      de dag voor de inwerkingtreding van de in de aanhef genoemde wet, ontvangt,

      voor de duur van die opleiding of scholing respectievelijk die reïntegratie-uitkering.

      2 In afwijking van [artikel 76a][ref7] blijven [artikel 130a][ref8] en het daarop berustende
      [Tijdelijk besluit proefplaatsing WW][ref9], zoals die luidden op de dag voor inwerkingtreding van de wet van
      23 december 2004 houdende wijziging van enkele socialeverzekeringswetten en enige andere wetten in verband met het
      aanbrengen van enige vereenvoudigingen, van toepassing op de werknemer die voor de datum van inwerkingtreding van
      die wet werkzaamheden verricht in het kader van het [Tijdelijk besluit proefplaatsing WW][ref10], voor de duur van
      die werkzaamheden.


