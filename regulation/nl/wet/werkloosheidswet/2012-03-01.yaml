  - number: '55'
    text: |-
      Toelating van een persoon tot de vrijwillige werkloosheidsverzekering vindt slechts plaats, indien hij zich
      tegelijkertijd vrijwillig verzekert op grond van de [Ziektewet][ref1]. De in de eerste zin opgenomen verplichting
      is niet van toepassing indien betrokkene bij ziekte, zwangerschap of bevalling, recht heeft op loon dan wel
      bezoldiging.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0004045/2012-03-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '56'
    text: |-
      De persoon die is toegelaten tot de vrijwillige werkloosheidsverzekering wordt voor de toepassing van deze wet voor
      de duur van die verzekering als werknemer beschouwd.
    url: https://wetten.overheid.nl/BWBR0004045/2012-03-01#Artikel56
  - number: 56a
    text: |-
      Het UWV beëindigt de vrijwillige werkloosheidsverzekering:

      a. op verzoek van de vrijwillig verzekerde met ingang van een door hem te bepalen datum;

      b. met ingang van de dag, waarop de termijn van vijf jaar, bedoeld in [artikel 53, eerste lid, onderdeel a][ref1],
      is verstreken;

      c. met ingang van de dag, waarop de werkzaamheden bedoeld in [artikel 53, eerste en tweede lid][ref2] worden
      beëindigd;

      d. met ingang van de dag waarop de vrijwillig verzekerde verplicht verzekerd wordt ingevolge deze wet;

      e. indien de verschuldigde premie over een periode van twee volle kalendermaanden niet, niet volledig of niet-
      tijdig is betaald; of

      f. indien niet langer wordt voldaan aan andere vereisten voor toelating tot de vrijwillige verzekering, bedoeld in
      [artikel 53, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel53
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel53
