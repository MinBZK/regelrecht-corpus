  - number: '27'
    text: |-
      1 Het UWV weigert de uitkering blijvend over het aantal uren waarover het recht op uitkering niet zou zijn
      ontstaan of zou zijn geëindigd, ter zake van het niet nakomen door de werknemer van een verplichting als bedoeld
      in [artikel 24, eerste lid, onderdeel a, of onderdeel b, onder 3°][ref1], tenzij het niet nakomen van de
      verplichting de werknemer niet in overwegende mate kan worden verweten. In dat geval weigert het UWV de uitkering
      niet over de volledige duur van de uitkering, doch over ten hoogste een periode van 26 weken over de helft van het
      aantal uren waarover het recht op uitkering zou zijn geëindigd of niet zou zijn ontstaan.

      2 Indien de werknemer een verplichting, hem op grond van [artikel 24, eerste lid, onderdeel b, onder 2°][ref2],
      opgelegd, niet is nagekomen, weigert het UWV de uitkering blijvend over het aantal uren waarover het recht op
      uitkering zou zijn geëindigd of niet zou zijn ontstaan:

      a. indien de werknemer de betreffende arbeid zou hebben aanvaard of verkregen; of

      b. indien, in plaats van [artikel 35aa, eerste lid, onderdeel b][ref3], [artikel 20, eerste lid, onderdeel b][ref4],
      van toepassing zou zijn geweest en de werknemer de betreffende arbeid zou hebben aanvaard of verkregen.

      3 Het UWV weigert de uitkering tijdelijk of blijvend, geheel of gedeeltelijk ter zake van
      het niet of niet behoorlijk nakomen door de werknemer van een verplichting als bedoeld in de
      [artikelen 24, eerste lid, onderdeel b, onder 1° of 4°, of vijfde lid][ref5], of [26][ref6],
      [artikel 55, tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref7] of
      [artikel 28, tweede lid, van de Wet werk en inkomen naar arbeidsvermogen][ref8], dan wel ter zake van het niet
      binnen de door het UWV daarvoor vastgestelde termijn nakomen door de werknemer van een verplichting als bedoeld
      in [artikel 25][ref9].

      4 Het UWV weigert de uitkering tijdelijk of blijvend, geheel of gedeeltelijk indien de verzekerde, bedoeld
      in de [Ziektewet][ref10], die gedurende de eerste dertien weken van zijn ongeschiktheid tot het verrichten
      van zijn arbeid wegens ziekte een uitkering ontvangt op grond van deze wet een verplichting voortvloeiend uit
      [artikel 45, eerste lid, van de Ziektewet][ref11] niet is nagekomen.

      5 Het opleggen van een maatregel op grond van het vierde lid blijft achterwege indien voor dezelfde gedraging een
      maatregel op grond van het eerste, tweede of derde lid kan worden opgelegd.

      6 Een maatregel als bedoeld in het derde of vierde lid wordt afgestemd op de ernst van de gedraging en de mate
      waarin de werknemer de gedraging verweten kan worden. Van het opleggen van een maatregel wordt in elk geval
      afgezien, indien elke vorm van verwijtbaarheid ontbreekt.

      7 Het UWV kan afzien van het opleggen van een maatregel als bedoeld in het derde of vierde lid en volstaan met het
      geven van een schriftelijke waarschuwing ter zake van het niet tijdig nakomen van een verplichting als bedoeld in
      [artikel 25][ref12], indien het niet tijdig nakomen van de verplichting, niet heeft geleid tot het ten onrechte of
      tot een te hoog bedrag verlenen van uitkering, of ter zake van het zich niet houden aan een voorschrift als bedoeld
      in [artikel 26, eerste lid, onderdelen b of d][ref13], tenzij het niet tijdig nakomen van de verplichting, of
      het zich niet houden aan de voorschriften, plaatsvindt binnen een periode van twee jaar te rekenen vanaf de datum
      waarop eerder aan de werknemer een zodanige waarschuwing is gegeven.

      8 Het UWV kan afzien van het opleggen van een maatregel indien daarvoor dringende redenen aanwezig zijn.

      9 Het opleggen van een maatregel blijft achterwege indien voor dezelfde gedraging een bestuurlijke boete als
      bedoeld in [artikel 27a][ref14] wordt opgelegd.

      10 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het derde,
      vierde en zesde lid.


