  - number: '34'
    text: |-
      1 Op de uitkering wordt inkomen geheel in mindering gebracht.

      2 Bij algemene maatregel van bestuur wordt bepaald wat onder inkomen als bedoeld in het eerste lid wordt verstaan.
    url: https://wetten.overheid.nl/BWBR0004045/2012-03-01#Artikel34
  - number: '35'
    text: |-
      De uitkering wordt niet betaald over perioden gelegen voor 26 weken voorafgaand aan de dag waarop de aanvraag om
      een uitkering werd ingediend. Het UWV is bevoegd in bijzondere gevallen af te wijken van de eerste zin.
    url: https://wetten.overheid.nl/BWBR0004045/2012-03-01#Artikel35
  - number: 35a
    text: |-
      Indien de werknemer deelneemt aan een voor hem naar het oordeel van het UWV noodzakelijke opleiding of scholing en
      het recht op uitkering op grond van [artikel 76][ref1] blijft bestaan, worden op de uitkering geheel in mindering
      gebracht de inkomsten uit of in verband met de opleiding of scholing voor zover zij meer bedragen dan een nader
      door Onze Minister vast te stellen bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel76
    url: https://wetten.overheid.nl/BWBR0004045/2012-03-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '76'
        hoofdstuk: VI
  - number: 35aa
    text: |-
      1 De uitkering wordt verminderd met 70% van het inkomen indien:

      a. de werknemer toestemming heeft verkregen van het UWV om werkzaamheden als bedoeld in
      [artikel 77a, eerste lid][ref1], te verrichten en het recht op uitkering op grond van het tweede lid van dat
      artikel blijft bestaan; of

      b. [artikel 20, zesde lid, onderdeel b, of negende lid][ref2], van toepassing is.

      2 Bij algemene maatregel van bestuur wordt bepaald wat onder inkomen als bedoeld in het eerste lid wordt verstaan.
      Daarbij kan tevens worden bepaald dat nader te bepalen inkomen dat gedeeltelijk, niet, of niet langer wordt genoten
      als gevolg van gewijzigde omstandigheden of enig handelen of nalaten van betrokkene in aanmerking wordt genomen
      alsof het wel volledig wordt genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel77a
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel20
    url: https://wetten.overheid.nl/BWBR0004045/2012-03-01#Artikel35aa
