  - number: '44'
    text: De uitkering op grond van dit hoofdstuk wordt berekend naar het dagloon.
    url: https://wetten.overheid.nl/BWBR0004045/2012-03-01#Artikel44
  - number: '45'
    text: |-
      1 Voor de berekening van de uitkering waarop op grond van dit hoofdstuk recht bestaat wordt als dagloon
      beschouwd 1/261 deel van het loon dat de werknemer in de periode van één jaar, die eindigt op de laatste
      dag van het aangiftetijdvak voorafgaande aan het aangiftetijdvak waarin het arbeidsurenverlies, bedoeld
      in [artikel 16, eerste lid][ref1], is ingetreden, verdiende, doch ten hoogste het bedrag, bedoeld in
      [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref2], met betrekking tot een loontijdvak
      van een dag.

      2 Bij of krachtens algemene maatregel van bestuur worden ten aanzien van de vaststelling van het dagloon, bedoeld
      in het eerste lid, en de herziening ervan nadere en zo nodig afwijkende regels gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel17
    url: https://wetten.overheid.nl/BWBR0004045/2012-03-01#Artikel45
