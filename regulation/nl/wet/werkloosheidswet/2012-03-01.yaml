  - number: '5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld, op grond waarvan eveneens als
      dienstbetrekking wordt beschouwd de arbeidsverhouding van de persoon die:

      a. als thuiswerker arbeid verricht;

      b. de in onderdeel *a* bedoelde persoon als hulp bij het verrichten van de arbeid bijstaat;

      c. als musicus of anderszins als artiest optreedt of als beroep een tak van sport beoefent; en

      d. tegen beloning persoonlijk arbeid verricht en wiens arbeidsverhouding niet reeds op grond van dit artikel en
      de [artikelen 3][ref1] en [4][ref2] als dienstbetrekking wordt beschouwd, doch hiermee maatschappelijk gelijk kan
      worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel4
