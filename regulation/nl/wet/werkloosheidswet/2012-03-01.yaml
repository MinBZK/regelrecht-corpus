    text: |-
      1 De artikelen [15][ref1], [16][ref2], [17][ref3], [17a][ref4], [17b][ref5], [17c][ref6], [18][ref7], [19][ref8],
      [23][ref9], [24][ref10], [27][ref11], [28][ref12], [35c][ref13], [42][ref14], [43][ref15], [47][ref16], 52a
      tot en met 52i, [72][ref17], [72a][ref18], [76][ref19], [76a][ref20], [77a][ref21], [79, eerste lid][ref22], en
      [130][ref23] en de daarop berustende bepalingen zoals deze luidden op de dag voor inwerkingtreding van artikel
      I, onderdeel J, van de Wet wijziging WW-stelsel blijven van toepassing met betrekking tot een recht op uitkering
      waarvan de eerste werkloosheidsdag is gelegen op of voor die dag.

      2 Indien dit een langere duur van het recht op uitkering ten gevolge heeft, blijven de [artikelen 42][ref24],
      [43][ref25], 52g en 52h, zoals die luidden op de dag voor inwerkingtreding van artikel I, onderdeel BB, van de in
      het eerste lid genoemde wet, tot vijf jaar na die dag, van toepassing met betrekking tot het recht op uitkering van
      de persoon die op of voor die dag recht op uitkering op grond van deze wet had, welk recht eindigt of is geëindigd
      op grond van het verrichten van werkzaamheden als werknemer, en die ter zake van de verrichte werkzaamheden na die
      dag een nieuw recht op uitkering krijgt.

      3 De [artikelen 16][ref26] en [31][ref27] en [hoofdstuk IV][ref28] en de daarop berustende bepalingen zoals deze
      luidden op de dag voor inwerkingtreding van artikel I, onderdeel H, onder 1, van de in het eerste lid genoemde wet
      blijven van toepassing met betrekking tot een recht op uitkering waarvan de eerste dag van de periode, bedoeld in
      [artikel 64, onderdeel a][ref29], zoals dat luidde op die dag, is gelegen op of voor die dag.

      4 De [artikelen 20][ref30] en [35][ref31] zoals deze luidden op de dag voor inwerkingtreding van artikel I,
      onderdeel O, onder 1, van de in het eerste lid genoemde wet blijven van toepassing op een verlies van arbeidsuren
      dat heeft plaatsgevonden op of voor die dag zolang er sprake is van aftrek van arbeidsinkomsten op grond van
      [artikel 35][ref32] zoals dat luidde op die dag.

      5 Het eerste lid is voor de toepassing van de [artikelen 24][ref33] en [27][ref34] niet van toepassing met
      betrekking tot een herleving van het recht op uitkering die heeft plaatsgevonden op of na 1 oktober 2006.


