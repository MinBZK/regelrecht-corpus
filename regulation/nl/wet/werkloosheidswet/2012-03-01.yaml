  - number: '66'
    text: |-
      1 De vorderingen van de werknemer en derden op de werkgever, bedoeld in [artikel 64, eerste lid][ref1], gaan over
      op het UWV, voorzover deze vorderingen door het UWV worden voldaan.

      2 Het UWV verhaalt de door werkgevers verschuldigde premies op grond van
      [Wet financiering sociale verzekeringen][ref2] over de uitkering, bedoeld in dit hoofdstuk, op de werkgever.

      3 De vorderingen van het UWV, bedoeld in het tweede lid, zijn bevoorrecht op alle goederen van de werkgever en gaan
      boven alle andere voorrechten met uitzondering van die van de [artikelen 287][ref3] en [288 onder a][ref4], alsmede
      die van [artikel 284 van Boek 3 van het Burgerlijk Wetboek][ref5].


