  - number: 77a
    text: |-
      1 Het UWV kan een werknemer toestemming verlenen om gedurende maximaal 26 kalenderweken werkzaamheden in de
      uitoefening van een bedrijf of in de zelfstandige uitoefening van een beroep te verrichten, indien:

      a. aannemelijk is dat de werknemer in de toekomst met die werkzaamheden structureel in zijn bestaan kan voorzien;

      b. de werkzaamheden nog geen aanvang hebben genomen;

      c. de werknemer recht heeft op uitkering op grond van [hoofdstuk II][ref1], anders dan op grond van
      [artikel 18][ref2];

      d. de werkloosheid van de werknemer niet uitsluitend een gevolg is van verkorting van de werktijd, waarvoor
      op grond van [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref3] ontheffing is
      verleend; en

      e. deze toestemming tijdens de uitkeringsduur niet eerder aan de werknemer is verleend.

      2 Voor de werknemer, bedoeld in het eerste lid, blijft, onverminderd
      [artikel 20, eerste lid, aanhef en onderdeel e][ref4], het recht op uitkering op grond van [hoofdstuk II][ref5]
      bestaan.

      3 De werknemer aan wie toestemming is verleend als bedoeld in het eerste lid wordt geacht werknemer te zijn en te
      blijven zolang die toestemming duurt.


