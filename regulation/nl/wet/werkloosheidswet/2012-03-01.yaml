  - number: 35b
    text: |-
      1 Indien de werknemer meer dan één recht op uitkering heeft, wordt, indien tenminste één van die rechten ontstaan
      is uit hoofde van een dienstbetrekking als overheidswerknemer, voor de toepassing van de [artikelen 34][ref1],
      [35a][ref2] en [35aa][ref3] een volgorde in aanmerking genomen bij de vermindering van de uitkering.

      2 Bij de toepassing van het eerste lid worden de inkomsten bij voorrang in mindering gebracht op de uitkering
      waarmee zij de meeste samenhang hebben.

      3 Een samenhang als bedoeld in het tweede lid wordt vastgesteld aan de hand van:

      a. de dienstbetrekkingen uit hoofde waarvan de werknemer recht op uitkering op grond van deze wet heeft en die
      waaruit of in verband waarmee de inkomsten worden ontvangen;

      b. de bedrijfstak of bedrijfstakken waarin de werknemer werkzaam was en die waaruit of in verband waarmee de
      inkomsten worden ontvangen.

      4 Indien geen samenhang kan worden vastgesteld, worden de inkomsten gelijkelijk in mindering gebracht op de
      verschillende uitkeringen. Indien bij de toepassing van de eerste zin een uitkering lager is dan het daarop in
      mindering te brengen bedrag, wordt hetgeen aldus niet in mindering kan worden gebracht in gelijke mate in mindering
      gebracht op de andere uitkeringen.

      5 Het UWV kan nadere regels stellen met betrekking tot het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel35a
