  - number: '130'
    text: |-
      1 Bij algemene maatregel van bestuur kan bij wijze van experiment, met het oog op het onderzoeken van mogelijkheden
      om deze wet met betrekking tot de inschakeling in de arbeid van werknemers die recht op uitkering hebben op grond
      van [hoofdstuk II][ref1], doeltreffender uit te voeren, worden afgeweken van het bepaalde bij of krachtens de
      [artikelen 24][ref2], [26][ref3] en [72 tot en met 78][ref4] van deze wet. Bij toepassing van de eerste zin wordt
      bij algemene maatregel van bestuur geregeld op welke wijze van welke artikelen wordt afgeweken.

      2 Een experiment als bedoeld in het eerste lid duurt ten hoogste vier jaar. Indien, voor een experiment is
      afgelopen, een voorstel van wet is ingediend bij de Staten-Generaal om het experiment om te zetten in een
      structurele wettelijke regeling, kan het experiment worden verlengd tot het tijdstip waarop het voorstel van wet in
      werking treedt. Het eerste lid, tweede zin, is van overeenkomstige toepassing.

      3 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de uitvoering van een experiment en
      voorzieningen worden getroffen voor zich gedurende een experiment voordoende onvoorziene gevallen.

      4 Onze Minister meldt aan de Staten-Generaal hoe het experiment in de praktijk is verlopen, alsmede zijn standpunt
      inzake de voortzetting ervan anders dan als experiment.

      5 De voordracht voor krachtens dit artikel vast te stellen algemene maatregelen van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel26
