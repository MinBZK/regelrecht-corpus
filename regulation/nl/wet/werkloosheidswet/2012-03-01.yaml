  - number: 26a
    text: |-
      1 De [artikelen 24, eerste lid, onderdeel b][ref1], en
      [26, eerste lid, onderdelen d tot en met g en k tot en met m][ref2], zijn niet van toepassing op de
      werknemer die blijkens een indicatiebeschikking of herindicatiebeschikking tot de doelgroep behoort van de
      [Wet sociale werkvoorziening][ref3].

      2 De [artikelen 19, eerste lid, onderdeel k][ref4],
      [26, eerste lid, onderdelen d tot en met g en i tot en met m][ref5], zijn niet van toepassing, en
      [artikel 24, eerste lid, onderdeel b, onder 1°, 2° en 4°][ref6], is van toepassing alsof het recht op uitkering
      is geëindigd, op de werknemer:

      a. op wie [artikel 35aa, eerste lid, onderdeel b][ref7], van toepassing is; en

      b. van wie de werkzaamheden als werknemer een zodanige omvang hebben dat een verlies van minder dan vijf of minder
      dan de helft van zijn arbeidsuren per kalenderweek zou resteren indien [artikel 20, eerste lid, onderdeel b][ref8],
      van toepassing zou zijn geweest.


