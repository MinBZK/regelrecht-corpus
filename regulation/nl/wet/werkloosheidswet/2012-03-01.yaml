  - number: '25'
    text: |-
      De werknemer is verplicht aan het UWV op zijn verzoek of onverwijld uit eigen beweging alle feiten en
      omstandigheden mede te delen, waarvan hem redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op
      het recht op uitkering, het geldend maken van het recht op uitkering, de hoogte of de duur van de uitkering, of
      op het bedrag van de uitkering dat aan de werknemer wordt betaald. Deze verplichting geldt niet, voor zover een
      recht op uitkering niet geldend kan worden gemaakt als gevolg van een blijvend gehele weigering. Deze verplichting
      geldt evenmin indien die feiten en omstandigheden door het UWV kunnen worden vastgesteld op grond van bij wettelijk
      voorschrift als authentiek aangemerkte gegevens of kunnen worden verkregen uit bij ministeriële regeling aan te
      wijzen administraties. Bij ministeriële regeling wordt bepaald voor welke gegevens de derde zin van toepassing is.
    url: https://wetten.overheid.nl/BWBR0004045/2012-03-01#Artikel25
  - number: '26'
    text: |-
      1 De werknemer is verplicht:

      a.

      b. binnen één week na het intreden van zijn werkloosheid bij het UWV een aanvraag om een uitkering in te dienen;

      c. de voorschriften op te volgen die het UWV ten behoeve van een doelmatige controle stelt;

      d. zich als werkzoekende bij het UWV te laten registreren en die registratie
      tijdig te doen verlengen, indien hem daartoe het recht toekomt op grond van
      [artikel 30b, derde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];

      e. mee te werken aan de activiteiten die bevorderlijk zijn voor zijn inschakeling in de arbeid, bedoeld in de
      [hoofdstukken VI][ref2] en [XA][ref3];

      f. mee te werken aan een scholing of opleiding die noodzakelijk wordt geacht voor
      zijn inschakeling in de arbeid, beschikbaar te zijn voor de voorzieningen, bedoeld in
      [artikel 7, eerste lid, onderdeel a, van de Wet werk en bijstand][ref4] en mee te werken aan het verkrijgen van
      die voorzieningen;

      g. mee te werken aan een voor hem gewenst onderzoek naar zijn arbeidsgeschiktheid door een arts, een psycholoog of
      een beroepskeuze-adviseur;

      h. te voldoen aan de andere voorwaarden die het UWV op grond van [artikel 101, tweede lid][ref5], stelt;

      i. de hem op grond van [hoofdstuk VI][ref6] opgelegde verplichtingen na te komen; en

      j. de voorschriften op te volgen die het UWV stelt in verband met het genieten van vakantie tijdens de duur van
      de uitkering;

      k. mee te werken aan het opstellen van de reïntegratievisie, bedoeld in
      [artikel 30a, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref7], en het
      reïntegratieplan, bedoeld in [artikel 30a, derde lid, van die wet][ref8];

      l. te voldoen aan de verplichtingen die zijn opgenomen in de reïntegratievisie, bedoeld in
      [artikel 30a, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref9], en het
      reïntegratieplan, bedoeld in [artikel 30a, derde lid, van die wet][ref10];

      m. bij deelname aan een re-integratietraject de reden van het niet naleven van zijn re-integratieverplichtingen
      onmiddellijk aan het re-integratiebedrijf mee te delen.

      2 Het UWV is bevoegd regels te stellen met betrekking tot het tijdstip van registratie, bedoeld in het eerste lid,
      onderdeel d.

      3 Onze Minister is bevoegd regels te stellen waarbij bepaalde groepen werknemers worden vrijgesteld van
      verplichtingen, hun op grond van het eerste lid, onderdelen d, f of g, opgelegd.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld op grond waarvan aan werknemers in
      individuele gevallen tijdelijk ontheffing kan worden verleend van verplichtingen, hun op grond van het eerste lid,
      onderdelen d, f of g, opgelegd.

      5 Voor de toepassing van het eerste lid, onderdelen e en f, en de [hoofdstukken VI][ref11] en [XA][ref12]
      wordt niet als arbeid beschouwd arbeid op grond van een dienstbetrekking als bedoeld in [hoofdstuk 2][ref13] of
      [3 van de Wet sociale werkvoorziening][ref14].


