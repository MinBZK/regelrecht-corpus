  - number: '98'
    text: In de uitvoering van deze wet wordt voorzien door het UWV.
    url: https://wetten.overheid.nl/BWBR0004045/2012-03-01#Artikel98
  - number: '99'
    text: De werknemer is verzekerd bij het UWV.
    url: https://wetten.overheid.nl/BWBR0004045/2012-03-01#Artikel99
  - number: '101'
    text: |-
      1 Het UWV stelt een uitkeringsreglement werkloosheidsverzekeringen vast.

      2 Onverminderd het elders in deze wet dienaangaande bepaalde, bevat het uitkeringsreglement bepalingen omtrent:

      a. voorschriften ten behoeve van een doelmatige controle, die ten aanzien van de werknemers moeten worden genomen;

      b. voorschriften met betrekking tot het genieten van vakantie tijdens de duur van de uitkering;

      c. voorschriften in verband met de betaling van de uitkering door tussenkomst van de werkgever, indien tijdens
      werkloosheid de dienstbetrekking voortduurt;

      d. andere voorwaarden, die aan het ontvangen van uitkering zijn verbonden;

      e. het betalen van een deel van de uitkering in de vorm van bijdragen aan sociale fondsen, waaronder begrepen
      bonnen, zegels en certificaten, die door het desbetreffende fonds worden uitgegeven of voorgeschreven; en

      f. samenloop van uitkering en inkomsten uit of in verband met arbeid.

      3 Het uitkeringsreglement mag geen bepalingen bevatten, welke strijdig zijn met deze wet en de daarop berustende
      bepalingen.
    url: https://wetten.overheid.nl/BWBR0004045/2012-03-01#Artikel101
  - number: '111'
    text: |-
      Tussen Onze Minister en Onze Minister van Financiën dient overeenstemming te bestaan omtrent te stellen regels als
      bedoeld in [artikel 12][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel12
