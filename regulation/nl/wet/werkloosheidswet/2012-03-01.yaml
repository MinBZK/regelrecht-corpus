  - number: '65'
    text: |-
      Voor de werknemer wiens recht op uitkering gedeeltelijk is geëindigd op grond van de overeenkomstige toepassing
      van [artikel 20, eerste lid, onderdeel a of b][ref1], bedraagt de uitkering de op grond van [artikel 64][ref2]
      vastgestelde uitkering, vermenigvuldigd met het aantal uren werkloosheid per kalenderweek, gedeeld door het
      aantal arbeidsuren in de dienstbetrekking met de werkgever, bedoeld in [artikel 61][ref3], voorafgaande aan het
      intreden van het verlies van arbeidsuren waarnaar zijn recht is berekend. Het aantal arbeidsuren voorafgaande
      aan het intreden van het verlies van arbeidsuren wordt bepaald met toepassing van [artikel 16][ref4]. Indien
      de dienstbetrekking met de werkgever, bedoeld in [artikel 61][ref5], is aangevangen in de periode van 26
      kalenderweken, bedoeld in [artikel 16, tweede lid][ref6], wordt daarbij het aantal hele kalenderweken in aanmerking
      genomen dat die dienstbetrekking in die periode heeft geduurd.


