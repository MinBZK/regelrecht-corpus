  - number: 22a
    text: |-
      1 Onverminderd het elders in deze wet bepaalde terzake van herziening of intrekking van een besluit tot toekenning
      van uitkering en terzake van weigering van uitkering, herziet het UWV een dergelijk besluit of trekt het dat in:

      a. indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 24][ref1], [25][ref2] of
      [26][ref3] heeft geleid tot het ten onrechte of tot een te hoog bedrag verlenen van uitkering;

      b. indien anderszins de uitkering ten onrechte of tot een te hoog bedrag is verleend;

      c. indien het niet of niet behoorlijk nakomen van de verplichting bedoeld in [artikel 25][ref4] ertoe leidt dat
      niet kan worden vastgesteld of nog recht op uitkering bestaat.

      2 Indien daarvoor dringende redenen aanwezig zijn kan het UWV besluiten geheel of gedeeltelijk van herziening of
      intrekking af te zien.


