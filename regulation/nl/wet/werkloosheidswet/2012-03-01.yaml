  - number: 17b
    text: |-
      1 Indien in de kalenderweek na het ontstaan van een recht op uitkering ter zake van gedeeltelijke werkloosheid
      uit een dienstbetrekking, een nieuw recht op uitkering ontstaat ter zake van toegenomen werkloosheid uit dezelfde
      dienstbetrekking, of een dienstbetrekking die voor eerstgenoemde dienstbetrekking in de plaats is gekomen, worden
      beide rechten samengevoegd tot een recht.

      2 Het eerste lid vindt geen toepassing met betrekking tot een recht dat reeds door samenvoeging van rechten is
      ontstaan.
    url: https://wetten.overheid.nl/BWBR0004045/2012-03-01#Artikel17b
  - number: 17c
    text: |-
      1 De persoon die op de dag, onmiddellijk voorafgaande aan de eerste dag van werkloosheid, werknemer in de zin van
      deze wet was en die in de periode van 36 weken, bedoeld in [artikel 17][ref1], gelegen vóór 1 januari 1987, arbeid
      heeft verricht als werknemer in de zin van de Werkloosheidswet of de [Wet Werkloosheidsvoorziening][ref2] zoals
      die wetten luidden op 31 december 1986, dan wel zijn militaire dienstplicht of in plaats daarvan vervangende dienst
      heeft vervuld, wordt met betrekking tot de weken waarin hij deze arbeid heeft verricht beschouwd als werknemer in
      de zin van deze wet.

      2 De persoon die op de dag, onmiddellijk voorafgaande aan de eerste dag van werkloosheid, werknemer in de zin van
      deze wet was en die in de periode van 36 weken, bedoeld in [artikel 17][ref3], vanaf 1 januari 1987, arbeid heeft
      verricht in een arbeidsverhouding ter zake waarvan hem door het Rijk invaliditeitspensioen is verzekerd, wordt met
      betrekking tot de weken waarin hij deze arbeid heeft verricht beschouwd als werknemer in de zin van deze wet.

      3 [Artikel 17a][ref4] is van overeenkomstige toepassing met betrekking tot het eerste en tweede lid.

      4 Ten aanzien van de persoon die op 31 december 1986 recht had op een uitkering op grond van de Algemene
      Arbeidsongeschiktheidswet of de [Wet op de arbeidsongeschiktheidsverzekering][ref5] of beide wetten, en die op
      het tijdstip waarop de arbeidsongeschiktheid intrad werknemer was in de zin van de Werkloosheidswet zoals die wet
      luidde op 31 december 1986, zijn het eerste en het derde lid van overeenkomstige toepassing.


