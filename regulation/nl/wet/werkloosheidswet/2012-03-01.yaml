  - number: '8'
    text: |-
      1 Een persoon wiens dienstbetrekking is geëindigd, behoudt de hoedanigheid van werknemer, voor zover hij geen
      werkzaamheden verricht uit hoofde waarvan hij op grond van deze wet niet als werknemer wordt beschouwd.

      2 Een persoon, wiens werknemerschap is geëindigd door het verrichten van werkzaamheden in de uitoefening van
      een bedrijf of in de zelfstandige uitoefening van een beroep, herkrijgt bij beëindiging van die werkzaamheden
      de hoedanigheid van werknemer, indien de werkzaamheden worden beëindigd binnen een periode die gelijk is aan de
      uitkeringsduur, danwel binnen anderhalf jaar, indien de uitkeringsduur korter is dan anderhalf jaar.

      3 Een persoon, wiens werknemerschap is geëindigd door het verrichten van werkzaamheden als lid van de Eerste Kamer
      der Staten-Generaal, van een vertegenwoordigend orgaan van een publiekrechtelijk lichaam, dat bij rechtstreekse
      verkiezing wordt samengesteld, of van een algemeen bestuur van een waterschap, herkrijgt bij beëindiging van die
      werkzaamheden de hoedanigheid van werknemer, voor zover die beëindiging plaatsvindt binnen het tijdvak van de bij
      de aanvang van die werkzaamheden voor die persoon nog geldende uitkeringsduur krachtens deze wet.

      4 Onverminderd het tweede en derde lid herkrijgt de persoon na afloop van de in het eerste lid bedoelde
      werkzaamheden de hoedanigheid van werknemer, indien deze niet langer hebben geduurd dan zes maanden.
    url: https://wetten.overheid.nl/BWBR0004045/2012-03-01#Artikel8
  - number: 8a
    text: |-
      Degene die op grond van de verplichte verzekering op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref1]
      of de [Wet op de arbeidsongeschiktheidsverzekering][ref2] een uitkering ontvangt verliest de hoedanigheid van
      werknemer indien hij niet in Nederland woont.


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0004045/2012-03-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0019057
      - id: ref2
        bwb_id: BWBR0002524
  - number: '9'
    text: |-
      Werkgever is de overheidswerkgever onderscheidenlijk de natuurlijke persoon tot wie of het lichaam tot welk een of
      meer natuurlijke personen in dienstbetrekking staan.
    url: https://wetten.overheid.nl/BWBR0004045/2012-03-01#Artikel9
  - number: '10'
    text: |-
      Als werkgever wordt beschouwd:

      a. in de gevallen, bedoeld in [artikel 4, eerste lid][ref1], onderdeel:

      *a en b:* de aanbesteder;

      *c en d:* degene, met wie de overeenkomst tot bemiddeling is gesloten;

      *f:* de exploitant of mede-exploitant van het vaartuig;

      *g:* Onze Minister van Defensie of Onze Minister;

      *h:* de coöperatie.

      b. in de gevallen, bedoeld in [artikel 5][ref2], onderdeel:

      *a:* de opdrachtgever;

      *b:* de thuiswerker;

      *c:* degene, met wie het optreden of de sportbeoefening is overeengekomen;

      *d:* degene, die bij de in [artikel 5][ref3] bedoelde algemene maatregel van bestuur als werkgever wordt
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel5
    url: https://wetten.overheid.nl/BWBR0004045/2012-03-01#Artikel10
