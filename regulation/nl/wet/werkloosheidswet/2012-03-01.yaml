  - number: '23'
    text: |-
      1 De intrekking of verlaging van een uitkering, die voortvloeit uit het door de werkgever ingesteld bezwaar of
      beroep, vindt niet eerder plaats dan de dag volgend op die waarop de beslissing op bezwaar is bekendgemaakt of de
      uitspraak is gedaan. De eerste zin is van overeenkomstige toepassing in geval van intrekking van het bezwaar of
      beroep omdat het UWV geheel of gedeeltelijk is tegemoet gekomen aan het bezwaar of beroep van de werkgever.

      2 Het eerste lid geldt niet, indien de uitkering door eigen schuld of toedoen van de werknemer ten onrechte of tot
      een te hoog bedrag is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004045/2012-03-01#Artikel23
  - number: '24'
    text: |-
      1 De werknemer voorkomt dat hij:

      a. verwijtbaar werkloos wordt;

      b. werkloos is of blijft, doordat hij:

      1°. in onvoldoende mate tracht passende arbeid te verkrijgen;

      2°. nalaat aangeboden passende arbeid te aanvaarden of door eigen toedoen geen passende arbeid verkrijgt;

      3°. door eigen toedoen geen passende arbeid behoudt; of

      4°. in verband met door hem te verrichten arbeid eisen stelt die het aanvaarden of verkrijgen van passende arbeid
      belemmeren.

      2 De werknemer is verwijtbaar werkloos geworden indien:

      a. aan de werkloosheid een dringende reden ten grondslag ligt in de zin van
      [artikel 678 van Boek 7 van het Burgerlijk Wetboek][ref1] en de werknemer terzake een verwijt kan worden gemaakt;

      b. de dienstbetrekking is beëindigd door of op verzoek van de werknemer zonder dat aan de voortzetting ervan
      zodanige bezwaren waren verbonden, dat deze voortzetting redelijkerwijs niet van hem kon worden gevergd.

      3 Als passende arbeid, bedoeld in het eerste lid, wordt beschouwd alle arbeid die voor de krachten en bekwaamheden
      van de werknemer is berekend, tenzij aanvaarding om redenen van lichamelijke, geestelijke of sociale aard niet
      van hem kan worden gevergd. Niet als passende arbeid wordt beschouwd arbeid op grond van een dienstbetrekking als
      bedoeld in [hoofdstuk 2][ref2] of [3 van de Wet sociale werkvoorziening][ref3].

      4 Bij algemene maatregel van bestuur worden nadere regels gesteld omtrent het begrip passende arbeid, bedoeld in
      het eerste en derde lid.

      5 De werknemer is verplicht zich zodanig te gedragen dat hij door zijn doen en laten het Algemeen
      Werkloosheidsfonds, het sectorfonds of het Uitvoeringsfonds voor de overheid niet benadeelt of zou kunnen
      benadelen. Onder benadeling in de zin van dit artikel is niet begrepen een gedraging als bedoeld in
      [artikel 25][ref4].

      6 Het niet voeren van verweer door de werknemer tegen of het instemmen van de werknemer met een beëindiging van de
      dienstbetrekking door of op verzoek van de werkgever leidt niet tot overtreding van de verplichtingen, bedoeld in
      het eerste lid, aanhef en onderdeel a, of het vijfde lid.

      7 Het tweede en zesde lid zijn van overeenkomstige toepassing met betrekking tot het eerste lid, onderdeel b,
      onder 3°, waarbij voor de overeenkomstige toepassing van het tweede lid, onderdeel b, voor «de dienstbetrekking is
      beëindigd» mede wordt gelezen: de arbeid is beëindigd of niet voortgezet.

      8 Onze Minister is bevoegd regels te stellen waarbij bepaalde groepen werknemers worden vrijgesteld van
      verplichtingen, hun op grond van het eerste lid, onderdeel b, onder 1°, 2° en 4°, opgelegd.

      9 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld op grond waarvan aan werknemers in
      individuele gevallen tijdelijk ontheffing kan worden verleend van verplichtingen, hun op grond van het eerste lid,
      onderdeel b, onder 1°, 2° of 4°, opgelegd.

      10 In afwijking van het zesde en zevende lid, is sprake van benadeling als bedoeld
      in het vijfde lid indien de werknemer tijdens het verlengde tijdvak, bedoeld in
      [artikel 25, negende lid, van de Wet werk en inkomen naar arbeidsvermogen][ref5], zonder deugdelijke grond heeft
      nagelaten verweer te voeren tegen of heeft ingestemd met een beëindiging van de dienstbetrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel678
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
