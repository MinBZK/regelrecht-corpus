  - number: '20'
    text: |-
      1 Het recht op uitkering eindigt:

      a. voor zover de werknemer zijn hoedanigheid van werknemer verliest;

      b. voor zover de werknemer niet langer werkloos is;

      c. indien ter zake van na het ontstaan van het recht verrichte arbeid een nieuw recht op uitkering is ontstaan,
      voor zover het aantal arbeidsuren waarnaar beide rechten samen zijn berekend, vermeerderd met het resterend aantal
      arbeidsuren per kalenderweek, groter is dan het aantal arbeidsuren, bedoeld in [artikel 16][ref1], voorafgaande aan
      het intreden van het verlies van arbeidsuren waarnaar het eerstgenoemde recht is berekend;

      d. zodra de werknemer geen recht op uitkering heeft op grond van [artikel 19][ref2];

      e. zodra de voor de werknemer geldende uitkeringsduur is verstreken;

      f. zodra de werknemer op wie het zesde lid, onderdeel b, van toepassing is, inkomsten geniet, die per week meer
      bedragen dan 87,5% van vijf maal 100/70 van de uitkering.

      2 Voor de werknemer op wie het eerste lid, onderdeel *a*, van toepassing is eindigt het recht op uitkering terzake
      van het aantal uren dat hij werkzaamheden verricht uit hoofde waarvan hij niet als werknemer in de zin van deze wet
      wordt beschouwd.

      3 Voor de werknemer op wie het eerste lid, onderdeel b, van toepassing is, eindigt het recht op uitkering ter zake
      van het aantal arbeidsuren dat hij arbeid als werknemer verricht dan wel ter zake van het aantal arbeidsuren dat
      hij minder beschikbaar is voor arbeid dan het aantal arbeidsuren dat hij heeft verloren.

      4 Zo nodig in afwijking van het derde lid eindigt het recht op uitkering geheel indien de werknemer:

      a. al dan niet opeenvolgend een zodanig aantal uren arbeid als werknemer verricht dat een verlies aan arbeidsuren
      resteert van minder dan vijf en minder dan de helft van zijn arbeidsuren, bedoeld in [artikel 16][ref3]; of

      b. beschikbaar is voor arbeid voor minder dan vijf en minder dan de helft van zijn arbeidsuren, bedoeld in
      [artikel 16][ref4].

      5 Bij ministeriële regeling kunnen regels worden gesteld omtrent:

      a. de berekening van het aantal arbeidsuren, bedoeld in het derde en vierde lid, ter zake waarvan het recht op
      uitkering eindigt. Deze regels hebben betrekking op het buiten beschouwing laten van uren waarin arbeid wordt
      verricht en de gelijkstelling van uren waarin geen arbeid is verricht met uren waarin arbeid wordt verricht; en

      b. het geheel of gedeeltelijk eindigen van een recht op uitkering bij samenloop van uitkeringen op grond van dit
      hoofdstuk.

      6 Het eerste lid, onderdeel b, is niet van toepassing:

      a. gedurende de eerste dertien weken van ongeschiktheid van de werknemer tot het verrichten van zijn arbeid wegens
      ziekte indien hij hierdoor niet beschikbaar is voor arbeid of minder beschikbaar is voor arbeid dan het aantal
      arbeidsuren dat hij heeft verloren; en

      b. op de werknemer, die ten minste 52 weken onafgebroken recht op uitkering heeft gehad, mits de werknemer
      werkzaamheden als werknemer gaat verrichten op een moment waarop sprake is van volledig verlies van zijn
      arbeidsuren terwijl geen recht bestaat op onverminderde doorbetaling van zijn loon over die uren.

      7 Voor de toepassing van het zesde lid, onderdeel a worden perioden van ongeschiktheid samengeteld, indien zij
      elkaar met een onderbreking van minder dan vier weken opvolgen of indien zij direct voorafgaan aan en aansluiten op
      een periode waarin uitkering in verband met zwangerschap of bevalling op grond van [artikel 3:7, eerste lid][ref5],
      [3:8][ref6] of [3:10, eerste lid, van de Wet arbeid en zorg][ref7] wordt genoten, tenzij de ongeschiktheid
      redelijkerwijs niet geacht kan worden voort te vloeien uit dezelfde oorzaak.

      8 Voor het bepalen van het tijdvak van 52 weken, bedoeld in het zesde lid, onderdeel b, worden perioden meegeteld
      waarin ten hoogste gedurende vier weken geen recht op uitkering bestaat.

      9 Het zesde lid, onderdeel b, is van overeenkomstige toepassing op de werknemer die, uit hoofde van de in dat
      onderdeel bedoelde werkzaamheden, in verband met ongeschiktheid ten gevolge van ziekte, zwangerschap of bevalling
      recht heeft op loon als bedoeld in [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref8], dan wel op
      bezoldiging of hetgeen daarmee overeenkomt als bedoeld in [artikel 76a, eerste lid, van de Ziektewet][ref9].

      10 Indien tijdens een recht op uitkering na toepassing van het zesde lid, onderdeel b, een nieuw recht op uitkering
      ontstaat, geldt voor toepassing van het zesde lid, onderdeel b, ten aanzien van dat nieuwe recht niet langer de
      voorwaarde dat de werknemer ten minste 52 weken onafgebroken recht op uitkering heeft gehad.

      11 Onder de uitkering, bedoeld in het eerste lid, onderdeel f, wordt verstaan de gezamenlijke
      uitkeringen indien sprake is van meerdere rechten op uitkering of indien sprake is van
      samenloop van het recht op uitkering met een recht op uitkering of arbeidsondersteuning
      op grond van de [Wet werk en arbeidsondersteuning jonggehandicapten][ref10], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref11], de [Wet werk en inkomen naar arbeidsvermogen][ref12] of de
      [Ziektewet][ref13].

      12 Indien de werknemer recht heeft op een uitkering als bedoeld in [artikel 19, eerste lid, onderdeel a][ref14],
      en het aantal arbeidsuren in de dienstbetrekking waaruit het recht op die uitkering voortvloeit in de kalenderweek
      voorafgaande aan de dag van het ontstaan van dat recht, gelet op het arbeidspatroon in die dienstbetrekking in
      de vier kalenderweken voorafgaand aan die dag, geen juist beeld geeft van dat arbeidspatroon, eindigt het recht
      op uitkering, in afwijking van het eerste lid, onderdeel d, voor het gemiddeld aantal arbeidsuren per week dat de
      werknemer in die dienstbetrekking arbeid heeft verricht in die vier kalenderweken.


