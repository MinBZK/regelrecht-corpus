  - number: '13'
    text: |-
      De werkgever is verplicht de werknemer de gelegenheid te geven tot het uitoefenen van de hem op grond van deze
      wet of de daarop berustende bepalingen toegekende bevoegdheden en tot het nakomen van de hem op grond van deze wet
      of de daarop berustende bepalingen opgelegde verplichtingen, voor zover de uitoefening van die bevoegdheden en de
      nakoming van die verplichtingen niet buiten de arbeidstijd kan geschieden.
    url: https://wetten.overheid.nl/BWBR0004045/2012-03-01#Artikel13
  - number: '14'
    text: |-
      1 Loon is het loon in de zin van [hoofdstuk 3 van de Wet financiering sociale verzekeringen][ref1].

      2 Minimumloon is het minimumloon per maand, bedoeld in [artikel 8, eerste lid, onderdeel ][ref2] of, indien
      het een werknemer jonger dan 23 jaar betreft, het voor zijn leeftijd geldende minimumloon per maand, bedoeld in
      [artikel 7, derde lid][ref3], en [artikel 8, derde lid, van genoemde wet][ref4], beide vermeerderd met de daarover
      berekende vakantietoeslag, bedoeld [in artikel 15 van die wet][ref5], en vervolgens gedeeld door 21,75.

      3 Loon, door verschillende personen te zamen onverdeeld ontvangen, wordt, voor zover niet blijkt van een andere
      verdeling, geacht door ieder van hen voor een gelijk deel te zijn ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
