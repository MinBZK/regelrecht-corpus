  - number: 27a
    text: |-
      1 Het UWV legt een bestuurlijke boete op van ten hoogste € 2 269 ter zake van het niet of niet behoorlijk nakomen
      door de werknemer van een verplichting als bedoeld in [artikel 25][ref1] van deze wet.

      2 Het UWV kan afzien van het opleggen van een bestuurlijke boete als bedoeld in het eerste lid en volstaan met het
      geven van een schriftelijke waarschuwing ter zake van het niet of niet behoorlijk nakomen door de werknemer van
      een verplichting als bedoeld in [artikel 25][ref2] van deze wet indien dit niet heeft geleid tot het ten onrechte
      of tot een te hoog bedrag verlenen van uitkering, tenzij het niet of niet behoorlijk nakomen van de verplichting
      plaatsvindt binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder aan de werknemer een zodanige
      waarschuwing is gegeven.

      3 Het UWV kan afzien van het opleggen van een bestuurlijke boete indien daarvoor dringende redenen aanwezig zijn.

      4 Degene aan wie een bestuurlijke boete is opgelegd is verplicht desgevraagd aan het Uitvoeringsinstituut
      werknemersverzekeringen de inlichtingen te verstrekken die voor de tenuitvoerlegging van de boete van belang zijn.

      5 Bij algemene maatregel van bestuur worden nadere regels gesteld over de hoogte van de bestuurlijke boete.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel25
