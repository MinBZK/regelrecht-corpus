  - number: '15'
    text: |-
      Met inachtneming van de [artikelen 16 tot en met 21][ref1] en de daarop berustende bepalingen heeft de werknemer
      die werkloos is recht op uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0004045/2012-03-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '16'
        hoofdstuk: II
        paragraaf: '1'
  - number: '16'
    text: |-
      1 Werkloos is de werknemer die:

      a. ten minste vijf of ten minste de helft van zijn arbeidsuren per kalenderweek heeft verloren, alsmede het recht
      op onverminderde doorbetaling van zijn loon over die uren; en

      b. beschikbaar is om arbeid te aanvaarden.

      2 Onder de in het eerste lid bedoelde arbeidsuren per kalenderweek wordt verstaan het aantal uren waarin de
      werknemer in de 26 kalenderweken onmiddellijk voorafgaande aan het intreden van zijn verlies van arbeidsuren
      gemiddeld per week als werknemer arbeid heeft verricht. Indien de werknemer minder dan vijf arbeidsuren per
      kalenderweek heeft verloren, wordt bij de bepaling van het aantal arbeidsuren, bedoeld in de eerste volzin, mede
      in aanmerking genomen het aantal uren waarin de werknemer in de 26 kalenderweken onmiddellijk voorafgaande aan het
      intreden van zijn verlies van arbeidsuren gemiddeld per week werkzaamheden heeft verricht uit hoofde waarvan hij
      niet als werknemer wordt beschouwd. Voor de vaststelling van de periode van 26 kalenderweken, bedoeld in de eerste
      en tweede zin, worden weken, tot een maximum van 78 weken, waarin de werknemer onbetaald verlof heeft genoten, niet
      in aanmerking genomen, tenzij dit leidt tot een lager aantal uren dan wanneer die weken wel in aanmerking zouden
      worden genomen.

      3 Met het recht op onverminderde doorbetaling van zijn loon, bedoeld in het eerste lid, worden gelijkgesteld
      de inkomsten waarop de werknemer recht heeft in verband met de beëindiging van de dienstbetrekking,
      tot aan het bedrag aan loon dat de werknemer zou hebben ontvangen indien de dienstbetrekking door
      opzegging met inachtneming van de rechtens geldende termijn zou zijn geëindigd. Onder inkomsten als
      bedoeld in de eerste zin wordt niet verstaan een door de rechter toegewezen vergoeding van proceskosten.
      Onder de rechtens geldende termijn, bedoeld in de eerste zin, wordt verstaan de termijn die de
      werkgever of de werknemer op grond van [artikel 672 van Boek 7 van het Burgerlijk Wetboek][ref1], de
      [artikelen 94 tot en met 97 van het Algemeen Rijksambtenarenreglement][ref2] of een overeenkomstige bepaling van
      een soortgelijke regeling ieder voor zich bij opzegging in acht behoort te nemen. In geval de dienstbetrekking
      is geëindigd met wederzijds goedvinden wordt onder de rechtens geldende termijn, bedoeld in de eerste zin,
      verstaan de termijn die de werkgever op grond van [artikel 672 van Boek 7 van het Burgerlijk Wetboek][ref3], de
      [artikelen 94 tot en met 97 van het Algemeen Rijksambtenarenreglement][ref4] of een overeenkomstige bepaling van
      een soortgelijke regeling bij opzegging in acht behoort te nemen. Het in de eerste zin bedoelde bedrag wordt:

      a. indien de dienstbetrekking door opzegging is geëindigd, toegerekend aan de periode onmiddellijk volgend op de
      datum waarop de dienstbetrekking is opgezegd;

      b. indien de dienstbetrekking is geëindigd door ontbinding, toegerekend aan de periode onmiddellijk volgend op de
      datum van de beschikking tot ontbinding;

      c. indien de dienstbetrekking is geëindigd met wederzijds goedvinden, toegerekend aan de periode onmiddellijk
      volgend op de datum waarop de beëindiging schriftelijk is overeengekomen, dan wel, bij gebrek aan een schriftelijke
      beëindigingsovereenkomst, aan de periode onmiddellijk volgend op het tijdstip waarop de dienstbetrekking is
      geëindigd.

      Indien de dienstbetrekking is geëindigd door ontbinding op verzoek van de werkgever, is
      [artikel 672 lid 4 van Boek 7 van het Burgerlijk Wetboek][ref5] van overeenkomstige toepassing.

      4 Het derde lid vindt geen toepassing indien de werkgever na het einde van de dienstbetrekking verkeert in een
      toestand als bedoeld in [artikel 61][ref6] en voorzover de werknemer als gevolg van die toestand de in het derde
      lid bedoelde inkomsten niet ontvangt.

      5 Bij algemene maatregel van bestuur kunnen met betrekking tot het eerste en het tweede lid regels worden gesteld:

      a. omtrent de berekening van het verlies van arbeidsuren bij een opeenvolgend verlies van arbeidsuren, waarbij
      andere perioden voor de berekening van het aantal gewerkte arbeidsuren in aanmerking kunnen worden genomen;

      b. waarbij voor bepaalde groepen werknemers een kortere of langere periode voor de berekening van het aantal
      gewerkte arbeidsuren geldt.

      6 Het UWV is bevoegd ten aanzien van groepen van werknemers die in de regel meer dan 50 uren per kalenderweek
      werken, bij verlies van arbeidsuren uit een dienstbetrekking, waarin over de laatste 26 kalenderweken onmiddellijk
      voorafgaande aan het intreden van het verlies van arbeidsuren gemiddeld meer dan 50 uren is gewerkt, voor de
      toepassing van het tweede lid te bepalen welk aantal uren ten hoogste in aanmerking wordt genomen.

      7 Bij ministeriële regeling kunnen voor de berekening van het aantal arbeidsuren, bedoeld in het tweede lid, regels
      worden gesteld omtrent de gelijkstelling van uren waarin geen arbeid is verricht met arbeidsuren en het buiten
      beschouwing laten van uren waarin arbeid is verricht.

      8 In afwijking van het eerste lid is tevens werkloos de werknemer die voldoet aan het eerste lid, onderdeel *a*,
      doch niet voldoet aan het eerste lid, onderdeel *b*, wegens het enkele feit dat hij voorafgaand aan of aansluitend
      op het arbeidsurenverlies deelneemt of gaat deelnemen aan een naar het oordeel van het UWV noodzakelijke opleiding
      of scholing, als bedoeld in [artikel 76][ref7]. Voor de toepassing van [artikel 16a, tweede lid][ref8], wordt een
      werknemer op wie de eerste volzin van toepassing is beschouwd als een werknemer die voldoet aan de voorwaarden van
      het eerste lid.

      9 In afwijking van het eerste lid is gedurende de periode dat de voor de werknemer rechtens geldende opzegtermijn
      langer duurt dan de opzegtermijn, bedoeld in [artikel 64, eerste lid, onderdeel b][ref9], tevens werkloos de
      werknemer die recht heeft op onverminderde doorbetaling van loon en waarvan de werkgever dit loon niet voldoet
      omdat hij verkeert in een toestand als bedoeld in [artikel 61][ref10].

      10 Indien bij een beoordeling als bedoeld in
      [artikel 6, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref11] is vastgesteld dat de werknemer
      voor een geringer aantal uren belastbaar is dan gezonde personen met soortgelijke opleiding en ervaring als bedoeld
      in [artikel 1 van die wet][ref12], doch minder dan 35% arbeidsongeschikt is, wordt onder de in het eerste lid
      bedoelde arbeidsuren per kalenderweek verstaan: het aantal uren dat die werknemer belastbaar is, tenzij dit leidt
      tot een hoger aantal uren.

      11 Voor de toepassing van deze wet en de daarop berustende bepalingen is de maandag de eerste dag van de
      kalenderweek.


