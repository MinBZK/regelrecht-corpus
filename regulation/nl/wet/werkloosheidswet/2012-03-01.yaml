  - number: '21'
    text: |-
      1 Indien het recht op uitkering op grond van [artikel 20, eerste lid, onderdeel a, b, c, d of f][ref1], geheel
      of gedeeltelijk is geëindigd en vervolgens de omstandigheid die tot dat eindigen heeft geleid heeft opgehouden te
      bestaan, herleeft het recht op uitkering met inachtneming van het tweede lid, de in [artikel 8][ref2] en het derde
      lid genoemde termijnen en de op grond van het vierde lid gestelde regels, voor zover geen nieuw recht op uitkering
      ingevolge dit hoofdstuk bestaat.

      2 In afwijking van het eerste lid herleeft een recht dat geheel geëindigd is niet, indien:

      a. het recht op uitkering dat zou herleven een omvang zou hebben van minder dan één arbeidsuur per kalenderweek;

      b. een nieuw recht op uitkering ingevolge dit hoofdstuk is ontstaan uit een volledige dienstbetrekking en het
      verschil tussen het geëindigde recht en het nieuwe recht minder dan vijf arbeidsuren per kalenderweek bedraagt;

      c. na de dag waarop het recht dat zou herleven geheel geëindigd is, een jaar is verstreken en het recht dat zou
      herleven een omvang zou hebben van minder dan vijf arbeidsuren per kalenderweek;

      d. [artikel 59, derde lid, van de Wet werk en inkomen naar arbeidsvermogen][ref3] toepassing heeft gevonden.

      3 Een recht op uitkering dat geheel of gedeeltelijk is geëindigd:

      a. wegens een omstandigheid als bedoeld in [artikel 19, eerste lid, onderdeel e, g, h of k][ref4]; of

      b. op grond van [artikel 20, eerste lid, onderdeel b][ref5], als gevolg van het niet kunnen voldoen aan de
      voorwaarde bedoeld in [artikel 16, eerste lid, onderdeel b][ref6], wegens andere omstandigheden dan ziekte of
      arbeidsongeschiktheid of het volgen van scholing of opleiding, terzake waarvan de werknemer een uitkering ontvangt
      als bedoeld in [artikel 19, eerste lid, onderdelen a, b, c of d][ref7]; of

      c. wegens een combinatie van de hier bedoelde omstandigheden, kan, ook indien deze omstandigheden zich
      aaneensluitend voordoen, slechts herleven indien de periode tussen de eindiging van het recht en het vervallen van
      de omstandigheid of omstandigheden als hier bedoeld niet langer is dan zes maanden.

      4 Bij ministeriële regeling kan worden geregeld dat het derde lid buiten toepassing blijft voor categorieën van
      werknemers.

      5 Indien het recht op uitkering op grond van [artikel 20, eerste lid, onderdeel d][ref8], juncto
      [artikel 19, eerste lid, onderdeel a][ref9], is geëindigd en vervolgens op grond van het eerste lid herleeft, is
      [artikel 16, tiende lid][ref10], van overeenkomstige toepassing.


