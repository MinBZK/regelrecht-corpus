  - number: '54'
    text: |-
      1 Het verzoek om toelating tot de vrijwillige werkloosheidsverzekering wordt ingediend bij het UWV.

      2 Het verzoek om toelating als bedoeld in het eerste lid moet worden ingediend:

      a. door de in [artikel 53, eerste lid, onderdeel a][ref1], bedoelde persoon: binnen dertien weken na de dag, waarop
      zijn werknemerschap is geëindigd;

      b. door de in [artikel 53, eerste lid, onderdeel b, c en e][ref2] bedoelde persoon: binnen dertien weken na de dag
      van zijn vertrek naar het buitenland dan wel, indien de in [artikel 53, eerste lid, onderdeel c][ref3], bedoelde
      werkzaamheden worden verricht in Nederland, binnen dertien weken na de dag waarop die werkzaamheden een aanvang
      hebben genomen;

      c. door de in [artikel 53, eerste lid, onderdeel d][ref4], bedoelde persoon: binnen dertien weken na de dag, waarop
      zijn werkzaamheden buiten Nederland een aanvang hebben genomen.

      3 Het UWV is bevoegd te verklaren dat een verzoek om toelating tot de vrijwillige werkloosheidsverzekering,
      ingediend na de ingevolge het tweede lid geldende termijn, tijdig is ingekomen, indien de persoon die het verzoek
      heeft gedaan, redelijkerwijs niet geacht kan worden in verzuim te zijn geweest.

      4 De vrijwillige werkloosheidsverzekering vangt aan:

      a. voor de in [artikel 53, eerste lid, onderdeel a][ref5], bedoelde persoon: op de dag na die, waarop zijn
      werknemerschap is geëindigd;

      b. voor de in [artikel 53, eerste lid, onderdeel b, c en e][ref6] bedoelde persoon: op de dag van zijn vertrek naar
      het buitenland dan wel, indien de in [artikel 53, eerste lid, onderdeel c][ref7], bedoelde werkzaamheden worden
      verricht in Nederland, op de dag waarop die werkzaamheden een aanvang hebben genomen;

      c. voor de in [artikel 53, eerste lid, onder d][ref8], bedoelde persoon: op de dag waarop zijn werkzaamheden een
      aanvang hebben genomen;

      d. voor de in [artikel 53, tweede lid][ref9], bedoelde persoon: op de dag van ontvangst van zijn verzoek om
      toelating.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel53
