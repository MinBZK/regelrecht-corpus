  - number: 130l
    text: |-
      1 Een aanvraag als bedoeld in [artikel 4 van het Tijdelijk besluit preventieve inzet sectorfondsen][ref1] van een
      werknemer als bedoeld in [artikel 3 van dat besluit][ref2] wordt vanaf 1 juli 2005 aangemerkt als een aanvraag om
      werkzaamheden waarmee de taak, bedoeld in [artikel 72, eerste lid onderdeel b][ref3], wordt uitgevoerd.

      2 Een traject als bedoeld in [artikel 4 van het Tijdelijk besluit preventieve inzet sectorfondsen][ref4]
      dat is aangevangen voor 1 juli 2005 wordt vanaf die datum aangemerkt als een traject, bedoeld in
      [artikel 72, eerste lid, onder b][ref5], met dien verstande dat de duur van het traject hierdoor niet wordt
      verlengd.

      3 De [artikelen 72][ref6] en [72a][ref7], zoals die luidden op de dag voor inwerkingtreding van de wet van
      16 juli 2005, houdende wijziging van de Werkloosheidswet in verband met het preventief inzetten van reïntegratie-
      instrumenten, het opdragen van de reïntegratietaak aan overheidswerkgevers, het ondersteunen van WAO-
      herbeoordeelden bij scholing, het subsidiëren van scholing in het kader van de WAJONG en enkele andere wijzigingen
      in wetten die de reïntegratie-instrumenten betreffen (Stb. 382), blijven van toepassing op de persoon, die recht
      heeft op uitkering op grond van hoofdstuk IIa of IIb en van wie de eerste werkloosheidsdag is gelegen voor 1 juli
      2005.

      4 In afwijking van het derde lid is [artikel 72a, vierde lid][ref8], zoals dat luidde op de dag voor
      inwerkingtreding van de in het derde lid genoemde wet, slechts van toepassing op door de overheidswerkgever gedane
      uitgaven die betrekking hebben op tot 1 juli 2006 verrichte activiteiten in verband met de inschakeling in het
      arbeidsproces van personen als bedoeld in [artikel 78a][ref9].


