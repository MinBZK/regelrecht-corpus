  - number: '17'
    text: |-
      Recht op uitkering ontstaat voor de werknemer indien hij in 36 weken onmiddellijk voorafgaande aan de eerste dag
      van werkloosheid in ten minste 26 weken als werknemer arbeid heeft verricht.
    url: https://wetten.overheid.nl/BWBR0004045/2012-03-01#Artikel17
  - number: 17a
    text: |-
      1 Voor de vaststelling van het in [artikel 17][ref1] bedoelde aantal van 36 weken worden niet in aanmerking genomen
      weken gedurende welke de werknemer:

      a. wegens ziekte of arbeidsongeschiktheid geen arbeid kon verrichten;

      b. werkzaamheden heeft verricht als bedoeld in [artikel 8][ref2] en hij op grond van dat artikel de hoedanigheid
      van werknemer heeft herkregen;

      c. wegens het genieten van onbetaald verlof geen arbeid heeft verricht, tot een maximum van 78 weken; of

      d. geen arbeid heeft verricht maar wel recht op uitkering heeft op grond van
      [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref3].

      2 Voor de vaststelling van het in [artikel 17][ref4] bedoelde aantal van 26 weken wordt de in een week verrichte
      arbeid slechts in aanmerking genomen, voor zover deze betrekking heeft op de dienstbetrekking waaruit de werknemer
      werkloos is geworden en op een of meer dienstbetrekkingen waarvoor eerstgenoemde dienstbetrekking in de plaats is
      gekomen, en voor zover deze niet reeds eerder heeft geleid tot het ontstaan van een recht op uitkering op grond van
      dit hoofdstuk of op grond van [hoofdstuk 7 van de Wet werk en inkomen naar arbeidsvermogen][ref5].

      3 Bij algemene maatregel van bestuur kan voor bepaalde groepen werknemers het in [artikel 17][ref6] bedoelde
      aantal van 36 weken hoger worden vastgesteld en het in dat onderdeel bedoelde aantal van 26 weken lager worden
      vastgesteld.

      4 Bij ministeriële regeling kunnen, zo nodig in afwijking van het tweede lid, regels worden gesteld omtrent de
      berekening van het in [artikel 17][ref7] bedoelde aantal van 26 weken. Deze regels hebben betrekking op:

      a. de gelijkstelling van weken waarin geen arbeid is verricht in de dienstbetrekking waaruit de werknemer werkloos
      is geworden met weken als bedoeld in [artikel 17][ref8];

      b. het meer keren in aanmerking nemen van weken waarin arbeid is verricht.


