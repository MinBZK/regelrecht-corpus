        bwb_id: BWBR0005537
        artikel: 8:69
  - number: 27g
    text: |-
      1 Het UWV verrekent de bestuurlijke boete met een uitkering op grond van deze wet, de [Ziektewet][ref1], de
      [Wet werk en inkomen naar arbeidsvermogen][ref2], de [Wet op de arbeidsongeschiktheidsverzekering][ref3],
      de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref4],
      de [Wet werk en arbeidsondersteuning jonggehandicapten][ref5], de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref6], de [Wet inkomensvoorziening oudere werklozen][ref7], de
      [Wet arbeid en zorg][ref8] of een toeslag op grond van de [Toeslagenwet][ref9], die de overtreder ontvangt.

      2 De Sociale verzekeringsbank onderscheidenlijk de gemeente betaalt het bedrag van de bestuurlijke boete, zonder
      dat daarvoor een machtiging nodig is, op zijn verzoek aan het UWV indien de overtreder een uitkering ontvangt op
      grond van de [Algemene Ouderdomswet][ref10], de [Algemene nabestaandenwet][ref11], de [Wet werk en bijstand][ref12],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref13] of de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref14].

      3 De in [artikel 479g van het Wetboek van Burgerlijke Rechtsvordering][ref15] aan de raad voor
      de kinderbescherming toegekende bevoegdheid komt gelijkelijk toe aan het UWV. Indien het UWV
      gebruik maakt van deze bevoegdheid, geschiedt de bekendmaking van het dwangbevel, in afwijking van
      [artikel 4:123, eerste lid, van de Algemene wet bestuursrecht][ref16], door middel van toezending per post aan
      degene aan wie de boete is opgelegd.

      4 Zolang de overtreder zijn verplichting, bedoeld in [artikel 27a, vierde lid][ref17], niet of niet behoorlijk
      nakomt:

      a. is het UWV in afwijking van [artikel 4.93, vierde lid, van de Algemene wet bestuursrecht][ref18] bevoegd tot
      verrekening van de bestuurlijke boete voor zover beslag op de vordering van de schuldeiser nietig zou zijn;

      b. geldt de beslagvrije voet, bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref19], in afwijking van
      [artikel 4:116 van de Algemene wet bestuursrecht][ref20], niet bij de invordering van een bestuurlijke boete bij
      dwangbevel.


