  - number: '22'
    text: |-
      1 Het UWV stelt op aanvraag vast of recht op uitkering bestaat.

      2 Een uitkering als bedoeld in [artikel 18][ref1] en een uitkering die verband houdt met een verleende ontheffing
      op grond van [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref2] worden betaald
      zonder dat dit bij beschikking is vastgesteld, indien redelijkerwijs mag worden aangenomen dat aan een beschikking
      geen behoefte bestaat.

      3 Een uitkering als bedoeld in het tweede lid wordt beëindigd zonder dat dit bij beschikking is vastgesteld, indien
      redelijkerwijs mag worden aangenomen dat aan een beschikking geen behoefte bestaat. Indien de belanghebbende binnen
      een redelijke termijn om een beschikking verzoekt, dan wordt deze zo spoedig mogelijk alsnog verstrekt.

      4 Het UWV betaalt de uitkering, bedoeld in het tweede lid, binnen zes weken na indiening van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002014#Artikel8
