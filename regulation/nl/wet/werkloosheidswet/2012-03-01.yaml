  - number: '12'
    text: |-
      Onze Minister is bevoegd, in afwijking van de [artikelen 9][ref1] en [10][ref2], andere dan de aldaar bedoelde
      personen of lichamen aan te wijzen als werkgever ten aanzien van de persoon die:

      a. krachtens overeenkomst met een ander tegen beloning geregeld zijn bemiddeling verleent tot het tot stand komen
      van overeenkomsten tussen daartoe door hem te bezoeken personen en een opdrachtgever van die ander;

      b. een thuiswerker als hulp bij het verrichten van de arbeid bijstaat;

      c. als musicus of anderszins als artiest optreedt dan wel als beroep een tak van sport beoefent.


