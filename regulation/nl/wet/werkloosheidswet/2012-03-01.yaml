  - number: 42a
    text: |-
      1 Voor de toepassing van [artikel 42][ref1] worden met dagen waarover loon is ontvangen, gelijkgesteld:

      a. dagen waarover recht bestond op een uitkering die naar aard en strekking overeenkomt met een uitkering
      op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref2] of met een uitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref3] voorzover de uitkering wordt toegekend naar een
      arbeidsongeschiktheid van ten minste 80% respectievelijk wordt toegekend over periodes waarin de persoon
      slechts in staat is om met arbeid ten hoogste 20% te verdienen van het maatmaninkomen, bedoeld in
      [artikel 1 van eerstgenoemde wet][ref4];

      b. dagen waarover een persoon een uitkering ontvangt op grond van
      [hoofdstuk III van de Wet arbeidsongeschiktheidsvoorziening militairen][ref5], berekend naar een
      arbeidsongeschiktheid van ten minste 80% of een toelage op grond van dat hoofdstuk, die al dan niet
      vermeerderd met de arbeidsongeschiktheidsuitkering 70% of meer bedraagt van het dagloon, waarnaar de
      arbeidsongeschiktheidsuitkering is of zou zijn berekend.

      2 Voor de toepassing van [artikel 42][ref6] worden niet reeds in aanmerking genomen kalenderjaren waarin een
      persoon recht heeft op kinderbijslag op grond van [artikel 7 van de Algemene Kinderbijslagwet][ref7] of een andere
      gezinsbijslag als bedoeld in artikel 4, eerste lid, onderdeel h, van [verordening (EG) nr. 1408/71](31971R1408) van
      de Raad van de Europese Gemeenschap van 14 juni 1971 betreffende de toepassing van socialezekerheidsregelingen op
      werknemers en zelfstandigen, alsmede op hun gezinsleden, die zich binnen de Gemeenschap verplaatsen (PbEG L 149)
      voor een tot zijn huishouden behorend kind dat bij de aanvang van dat kalenderjaar de leeftijd van vijf jaar niet
      heeft bereikt, voor de helft gelijkgesteld met kalenderjaren waarin over 52 of meer dagen loon is ontvangen. De in
      de eerste zin bedoelde persoon wordt aangemerkt als verzorgend persoon.

      3 Voor de toepassing van [artikel 42][ref8] worden niet reeds in aanmerking genomen kalenderjaren vanaf
      en met in begrip van een bij ministeriële regeling nader te bepalen kalenderjaar, waarin een persoon
      inkomsten ontvangt voor het verlenen van zorg op grond van een regeling voor persoonsgebonden budget, die
      is gegrond op [artikel 44, eerste lid, onderdeel b, van de Algemene Wet Bijzondere Ziektekosten][ref9]
      of op [artikel 5, eerste lid, van de Wet maatschappelijke ondersteuning][ref10] of die voldoet aan
      [artikel 14a van de Zorgverzekeringswet][ref11], voor de helft gelijkgesteld met kalenderjaren waarin
      over 52 of meer dagen loon is ontvangen, tenzij hij deze inkomsten ontvangt uit arbeid als bedoeld in
      [artikel 6, eerste lid, onderdeel e][ref12]. De eerste zin is uitsluitend van toepassing indien de in de eerste zin
      bedoelde persoon aantoont dat deze zorgverlening aan deze voorwaarden voldoet of heeft voldaan. Die persoon wordt
      aangemerkt als verzorgend persoon. Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot
      de uitvoering van dit lid.

      4 Het tweede en derde lid vinden geen toepassing indien de verzorgende persoon in een kalenderjaar voor een
      periode langer dan een half jaar als werknemer in de zin van een wettelijke regeling inzake werkloosheid
      recht heeft op een uitkering ter zake van werkloosheid of op de loongerelateerde uitkering op grond van
      [hoofdstuk 7 van de Wet werk en inkomen naar arbeidsvermogen][ref13].

      5 Voor de toepassing van het tweede lid wordt onder:

      a. een kind verstaan een eigen, aangehuwd of pleegkind;

      b. een pleegkind verstaan een kind dat als een eigen kind wordt onderhouden en opgevoed.

      6 Voor de toepassing van [artikel 42][ref14] worden dagen, tot een maximum van achttien maanden, waarover de
      werknemer onbetaald verlof heeft genoten, gelijkgesteld met dagen, waarover loon is ontvangen.

      7 Voor de toepassing van dit artikel en van [artikel 42][ref15] wordt niet als loon beschouwd een uitkering:

      a. op grond van deze wet, met uitzondering van een uitkering op grond van [hoofdstuk IV][ref16] van deze wet;

      b. op grond van [hoofdstuk 7 van de Wet werk en inkomen naar arbeidsvermogen][ref17], met uitzondering van een
      uitkering aan de persoon die slechts in staat is om met arbeid ten hoogste 20% te verdienen van het maatmaninkomen,
      bedoeld in [artikel 1 van die wet][ref18];

      c. op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref19], berekend naar een arbeidsongeschiktheid
      van minder dan 80%; of

      d. die naar aard en strekking overeenkomt met een uitkering als bedoeld in onderdeel a, b of c.

      8 Bij algemene maatregel van bestuur kunnen regels worden gesteld:

      a. ter vaststelling van het aantal dagen waarover loon is ontvangen, bedoeld in [artikel 42][ref20];

      b. op grond waarvan voor het bepalen van het aantal van 52 dagen, bedoeld in [artikel 42][ref21] dagen waarover,
      anders dan bedoeld in het zesde lid, geen loon is ontvangen, worden gelijkgesteld met dagen waarover loon is
      ontvangen.


