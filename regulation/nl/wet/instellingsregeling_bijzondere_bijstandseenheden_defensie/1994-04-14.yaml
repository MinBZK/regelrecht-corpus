regulatory_layer: WET
publication_date: '2006-12-22'
valid_from: '1994-04-14'
valid_to: '2006-12-31'
bwb_id: BWBR0006571
url: https://wetten.overheid.nl/BWBR0006571/1994-04-14
preamble:
  text: >-
    Gelet op artikel 60, eerste lid, van de Politiewet 1993;


    Besluiten:
  url: https://wetten.overheid.nl/BWBR0006571/1994-04-14#ArtikelAanhef
articles:
  - number: '1'
    text: >-
      Ten behoeve van het verlenen van bijstand aan de Nederlandse politie bij de daadwerkelijke bestrijding van zeer
      ernstige misdrijven, waarbij sprake is van direct levensbedreigende omstandigheden, zijn er twee bijzondere
      bijstandseenheden van het ministerie van Defensie: de bijzondere bijstandseenheid krijgsmacht en de bijzondere
      bijstandseenheid mariniers.
    url: https://wetten.overheid.nl/BWBR0006571/1994-04-14#Artikel1
  - number: '2'
    text: >-
      1 De bijzondere bijstandseenheid krijgsmacht bestaat uit militairen van de Koninklijke marechaussee en van andere
      onderdelen van de krijgsmacht.


      2 De leden van de bijzondere bijstandseenheid krijgsmacht zijn geoefend in het gebruik van een vuurwapen waarmee
      lange afstandsprecisievuur kan worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0006571/1994-04-14#Artikel2
  - number: '3'
    text: >-
      1 De bijzondere bijstandseenheid mariniers bestaat uit militairen van het Korps mariniers.


      2 De leden van de bijzondere bijstandseenheid mariniers zijn geoefend in het nabij gevecht.
    url: https://wetten.overheid.nl/BWBR0006571/1994-04-14#Artikel3
  - number: '4'
    text: >-
      Deze regeling treedt in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin zij wordt
      geplaatst en werkt terug tot en met 1 april 1994.
    url: https://wetten.overheid.nl/BWBR0006571/1994-04-14#Artikel4
  - number: '5'
    text: >-
      Deze regeling wordt aangehaald als:


      Instellingsregeling bijzondere bijstandseenheden Defensie.


      Deze regeling zal met de toelichting in de Staatscourant worden geplaatst en in het Algemeen Politieblad.
    url: https://wetten.overheid.nl/BWBR0006571/1994-04-14#Artikel5
