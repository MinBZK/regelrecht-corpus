  - number: 88a
    text: |-
      Deze wet is mede van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba, met inachtneming van het
      in dit hoofdstuk bepaalde.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel88a
  - number: 88b
    text: |-
      Voor de toepassing van deze wet in de openbare lichamen Bonaire, Sint Eustatius en Saba is de
      [Algemene wet op het binnentreden][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006763
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel88b
    references:
      - id: ref1
        bwb_id: BWBR0006763
  - number: 88c.1
    text: |-
      De personen en instanties die bij of krachtens de Wet op de telecommunicatievoorzieningen BES bevoegd zijn tot het
      verzorgen van telecommunicatieverkeer voor derden zijn verplicht medewerking te verlenen aan de uitvoering van de
      bijzondere bevoegdheden als bedoeld in de [artikelen 25][ref1], [28][ref2] en [29][ref3] van de wet, voor zover
      deze betrekking heeft op het aftappen of opnemen van telecommunicatie en het verstrekken van gegevens omtrent een
      gebruiker en het telecommunicatieverkeer met betrekking tot die gebruiker. Onder een gebruiker wordt in dit kader
      verstaan de natuurlijke of rechtspersoon die met de persoon of een instantie als bedoeld in de eerste volzin een
      overeenkomst is aangegaan met betrekking tot het verzorgen van telecommunicatieverkeer, alsmede de natuurlijke of
      rechtspersoon wiens telecommunicatieverkeer het betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0013409#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0013409#Artikel29
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel88c
    references:
      - id: ref1
