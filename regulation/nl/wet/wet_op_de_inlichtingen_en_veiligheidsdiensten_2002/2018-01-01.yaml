    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 1.c
    text: 'Onze betrokken Minister:'
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel1
  - number: 1.c.1°
    text: |-
      ten aanzien van de Algemene Inlichtingen- en Veiligheidsdienst: Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel1
  - number: 1.c.2°
    text: 'ten aanzien van de Militaire Inlichtingen- en Veiligheidsdienst: Onze Minister van Defensie;'
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel1
  - number: 1.c.3°
    text: 'ten aanzien van de coördinator: Onze Minister-President, Minister van Algemene Zaken;'
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel1
  - number: 1.d
    text: 'gegevens: persoonsgegevens en andere gegevens;'
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel1
  - number: 1.e
    text: |-
      persoonsgegevens: gegevens die betrekking hebben op een identificeerbare of geïdentificeerde, individuele
      natuurlijke persoon;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel1
  - number: 1.f
    text: |-
      gegevensverwerking of verwerking van gegevens: elke handeling of elk geheel van handelingen met betrekking
      tot gegevens, waaronder in ieder geval het verzamelen, vastleggen, ordenen, bewaren, bijwerken, wijzigen,
      opvragen, raadplegen, gebruiken, verstrekken door middel van doorzending, verspreiding of enige andere vorm
      van terbeschikkingstelling, samenbrengen, met elkaar in verband brengen, alsmede het afschermen, uitwissen of
      vernietigen van gegevens;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel1
  - number: 1.g
    text: |-
      commissie van toezicht: de commissie, bedoeld in [artikel 64][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel64
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '64'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '2'
    text: |-
      De diensten en de coördinator verrichten hun taak in gebondenheid aan de wet en in ondergeschiktheid aan Onze
      betrokken Minister.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel2
  - number: '3'
    text: |-
      Onze betrokken Ministers plegen regelmatig onderling overleg over hun beleid betreffende de diensten en de
      coördinatie van dat beleid. Andere dan Onze betrokken Ministers worden voor deelname aan het overleg uitgenodigd,
      indien dit, gelet op de door hen te behartigen belangen, noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel3
  - number: '4.1'
    text: Er is een coördinator van de inlichtingen- en veiligheidsdiensten.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel4
  - number: '4.2'
    text: De coördinator wordt op gemeenschappelijke voordracht van Onze betrokken Ministers bij koninklijk besluit benoemd.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel4
  - number: '4.3'
    text: |-
      De coördinator heeft tot taak om overeenkomstig de aanwijzingen van Onze Minister-President, Minister van Algemene
      Zaken, in overeenstemming met Onze overige betrokken Ministers:
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel4
  - number: 4.3.a
    text: |-
      het in [artikel 3][ref1] bedoelde overleg voor te bereiden;


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel3
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 4.3.b
    text: de uitvoering van de taken van de diensten te coördineren.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel4
  - number: '4.4'
    text: De coördinator stelt Onze betrokken Ministers in kennis van al hetgeen van belang kan zijn.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel4
  - number: '4.5'
    text: |-
      Op de verwerking van gegevens door de coördinator is [hoofdstuk 3][ref1] met uitzondering van paragraaf  3.2.2,
      alsmede [hoofdstuk 4][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0013409#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013409
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013409
        hoofdstuk: '4'
  - number: '5'
    text: |-
      De hoofden van de diensten verlenen de coördinator medewerking voor de uitoefening van zijn taak. Zij verschaffen
      hem daartoe alle nodige inlichtingen.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel5
  - number: '6.1'
    text: Er is een Algemene Inlichtingen- en Veiligheidsdienst.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel6
  - number: '6.2'
    text: 'De Algemene Inlichtingen- en Veiligheidsdienst heeft in het belang van de nationale veiligheid tot taak:'
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel6
  - number: 6.2.a
    text: |-
      het verrichten van onderzoek met betrekking tot organisaties en personen die door de doelen die zij nastreven,
      dan wel door hun activiteiten aanleiding geven tot het ernstige vermoeden dat zij een gevaar vormen voor het
      voortbestaan van de democratische rechtsorde, dan wel voor de veiligheid of voor andere gewichtige belangen van
      de staat;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel6
  - number: 6.2.b
    text: |-
      het verrichten van veiligheidsonderzoeken als bedoeld in de [Wet veiligheidsonderzoeken][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008277
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008277
  - number: 6.2.c
    text: |-
      het bevorderen van maatregelen ter bescherming van de onder a genoemde belangen, waaronder begrepen maatregelen ter
      beveiliging van gegevens waarvan de geheimhouding door de nationale veiligheid wordt geboden en van die onderdelen
      van de overheidsdienst en van het bedrijfsleven die naar het oordeel van Onze ter zake verantwoordelijke Ministers
      van vitaal belang zijn voor de instandhouding van het maatschappelijk leven;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel6
  - number: 6.2.d
    text: |-
      het verrichten van onderzoek betreffende andere landen ten aanzien van onderwerpen die door Onze Minister-
      President, Minister van Algemene Zaken, in overeenstemming met Onze betrokken Ministers zijn aangewezen;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel6
  - number: 6.2.e
    text: |-
      het opstellen van dreigings- en risicoanalyses op verzoek van Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties en Onze Minister van Veiligheid en Justitie gezamenlijk ten behoeve
      van de beveiliging van de personen, bedoeld in de [artikelen 4, derde lid, onderdeel b][ref1], en
      [42, eerste lid, onder c, van de Politiewet 2012][ref2] en de bewaking en de beveiliging van de objecten en de
      diensten die zijn aangewezen op grond van [artikel 16 van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel16
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '42'
      - id: ref3
        bwb_id: BWBR0031788
        artikel: '16'
  - number: 6a.1
    text: |-
      De dreigings- en risicoanalyses, bedoeld in [artikel 6, tweede lid, onderdeel e][ref1], worden opgesteld naar
