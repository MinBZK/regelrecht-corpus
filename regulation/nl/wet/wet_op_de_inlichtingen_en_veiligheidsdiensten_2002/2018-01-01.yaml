  - number: 6a.1.b
    text: |-
      degenen die belast zijn met de behartiging van de belangen van de personen, bedoeld in de
      [artikelen 4, derde lid, onder b][ref1], en [42, eerste lid, onder c, van de Politiewet 2012][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel42
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel6a
