  - number: '98.1'
    text: |-
      Op verzoeken om informatie op grond van de [Wet openbaarheid van bestuur][ref1] met betrekking tot door of ten
      behoeve van de diensten verwerkte gegevens die zijn ingediend voor de inwerkingtreding van deze wet, blijven de
      bepalingen van [die wet][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
      [ref2]: https://wetten.overheid.nl/BWBR0005252
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0005252
      - id: ref2
        bwb_id: BWBR0005252
  - number: '98.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing, indien het verzoeken om informatie betreft met betrekking tot
      gegevens verwerkt door de coördinator of door inlichtingen- en veiligheidsdiensten die zijn opgeheven.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel98
  - number: '99'
    text: |-
      [Artikel 34][ref1] is niet van toepassing met betrekking tot door de diensten uitgeoefende bijzondere
      bevoegdheden als bedoeld in [het eerste lid van dat artikel][ref2] die hebben plaatsgevonden voor het tijdstip van
      inwerkingtreding van [dat artikel][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0013409#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0013409#Artikel34
