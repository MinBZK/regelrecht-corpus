  - number: '103'
    text: |-
      De [Wet op de inlichtingen- en veiligheidsdiensten][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0004244
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0004244
  - number: '104'
    text: |-
      Na de inwerkingtreding van deze wet berust de Aanwijzingsregeling bijzondere dienst Koninklijke marechaussee op
      [artikel 60, tweede lid][ref1], van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel60
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '60'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '105.1'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel105
  - number: '105.2'
    text: |-
      Voor de bekendmaking van deze wet stelt Onze Minister-President, Minister van Algemene Zaken, de nummering van de
      artikelen, paragrafen en hoofdstukken van deze wet opnieuw vast, brengt hij de in deze wet voorkomende aanhalingen
      van artikelen, paragrafen en hoofdstukken daarmee in overeenstemming en vervangt hij de in deze wet voorkomende
      aanduiding «19..» door het jaartal van het Staatsblad waarin deze wet zal worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel105
  - number: '106'
    text: |-
      Deze wet wordt aangehaald als: Wet op de inlichtingen- en veiligheidsdiensten met vermelding van het jaartal van
      het Staatsblad waarin zij zal worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel106
