        paragraaf: '3.2'
  - number: 88c.2
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, Onze Minister van Defensie en Onze Minister van
      Economische Zaken gezamenlijk kunnen in bijzondere gevallen de personen en instanties, bedoeld in het eerste lid,
      ontheffing verlenen van de verplichting tot medewerking.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel88c
  - number: '89.1'
    text: |-
      Overtreding van de [artikelen 23, zevende lid][ref1], [24, derde lid][ref2], en [25, zevende lid][ref3], is
      strafbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0013409#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0013409#Artikel25
