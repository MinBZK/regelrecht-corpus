  - number: '8.1'
    text: |-
      Onze betrokken Ministers brengen jaarlijks voor 1 mei gelijktijdig aan beide kamers der Staten-Generaal
      een openbaar verslag uit van de wijze waarop de Algemene Inlichtingen- en Veiligheidsdienst en de Militaire
      Inlichtingen- en Veiligheidsdienst hun taken in het afgelopen kalenderjaar hebben verricht.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel8
  - number: '8.2'
    text: 'In het verslag wordt in ieder geval volledig overzicht gegeven van:'
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel8
  - number: 8.2.a
    text: de aandachtsgebieden waarop de dienst zijn activiteiten in het afgelopen jaar heeft gericht;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel8
  - number: 8.2.b
    text: de aandachtsgebieden waarop de dienst zijn activiteiten in het lopende jaar in ieder geval zal richten.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel8
  - number: '8.3'
    text: 'In het openbare jaarverslag blijft vermelding achterwege van in ieder geval de gegevens die zicht geven op:'
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel8
  - number: 8.3.a
    text: door de dienst aangewende middelen in concrete aangelegenheden;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel8
  - number: 8.3.b
    text: door de dienst aangewende geheime bronnen;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel8
  - number: 8.3.c
    text: het actuele kennisniveau van de dienst.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel8
  - number: '8.4'
    text: |-
      Onze betrokken Minister kan de gegevens, bedoeld in het derde lid, vertrouwelijk meedelen aan een of beide kamers
      der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel8
  - number: '8.5'
    text: |-
      Onverminderd de verplichting, bedoeld in het eerste lid, informeren Onze betrokken Ministers uit eigen beweging
      beide kamers der Staten-Generaal, indien daartoe aanleiding bestaat. Het derde en het vierde lid zijn van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel8
  - number: '9.1'
    text: De ambtenaren van de diensten bezitten geen bevoegdheid tot het opsporen van strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel9
  - number: '9.2'
    text: |-
      De in [artikel 60][ref1] bedoelde ambtenaren oefenen bij het verrichten van de daar bedoelde werkzaamheden geen
      bevoegdheden tot het opsporen van strafbare feiten uit.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel60
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '60'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '10.1'
    text: |-
      Het is de ambtenaar van een dienst verboden, anders dan in de uitoefening van zijn functie, te reizen naar dan wel
      te verblijven in:
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel10
  - number: 10.1.a
    text: een land waar feitelijk een gewapend conflict bestaat;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel10
  - number: 10.1.b
    text: |-
      door Onze betrokken Ministers gezamenlijk bij ministeriële regeling aangewezen landen waarin het verblijf door een
      ambtenaar van een dienst een bijzonder risico voor de nationale veiligheid kan opleveren.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel10
  - number: '10.2'
    text: |-
      Onze betrokken Minister kan ontheffing van het in het eerste lid bedoelde verbod verlenen, indien dringende
      persoonlijke of andere belangen van de betrokken ambtenaar dat vereisen en de veiligheid of andere gewichtige
      belangen van de staat zich daartegen niet verzetten.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel10
  - number: '10.3'
    text: |-
      [Dit artikel][ref1] is van overeenkomstige toepassing ten aanzien van de coördinator, de aan hem ondergeschikte
      ambtenaren en de krachtens [artikel 60, tweede lid][ref2], aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0013409#Artikel60
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0013409
        artikel: '60'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '11'
    text: |-
      Onze betrokken Minister kan ten aanzien van de organisatie, de werkwijze en het beheer van een dienst nadere regels
      stellen.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel11
  - number: '12.1'
    text: |-
      De diensten zijn bevoegd tot het verwerken van gegevens met inachtneming van de eisen die daaraan bij of krachtens
      deze wet of de [Wet veiligheidsonderzoeken][ref1] zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008277
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008277
  - number: '12.2'
    text: |-
      De verwerking van gegevens vindt slechts plaats voor een bepaald doel en slechts voor zover dat noodzakelijk is
      voor een goede uitvoering van deze wet of de [Wet veiligheidsonderzoeken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008277
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008277
  - number: '12.3'
    text: De verwerking van gegevens geschiedt in overeenstemming met de wet en op behoorlijke en zorgvuldige wijze.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel12
  - number: '12.4'
    text: |-
      De gegevens die in het kader van de taakuitvoering van de diensten worden verwerkt, zijn voorzien van een
      aanduiding omtrent de mate van betrouwbaarheid dan wel een verwijzing naar het document of de bron waaraan de
      gegevens zijn ontleend.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel12
  - number: '13.1'
    text: |-
      De verwerking van persoonsgegevens door de Algemene Inlichtingen- en Veiligheidsdienst kan slechts betrekking
      hebben op personen:
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel13
  - number: 13.1.a
    text: |-
      die aanleiding geven tot het ernstige vermoeden dat zij een gevaar vormen voor de democratische rechtsorde, dan wel
      voor de veiligheid of voor andere gewichtige belangen van de staat;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel13
  - number: 13.1.b
    text: die toestemming hebben verleend voor een veiligheidsonderzoek;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel13
  - number: 13.1.c
    text: omtrent wie dat noodzakelijk is in het kader van het onderzoek betreffende andere landen;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel13
  - number: 13.1.d
    text: over wie door een andere inlichtingen- of veiligheidsdienst gegevens zijn ingewonnen;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel13
  - number: 13.1.e
    text: wier gegevens noodzakelijk zijn ter ondersteuning van een goede taakuitvoering door de dienst;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel13
  - number: 13.1.f
    text: die werkzaam zijn of zijn geweest voor een dienst;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel13
  - number: 13.1.g
    text: |-
      omtrent wie dat noodzakelijk is in het kader van het opstellen van de dreigings- en risicoanalyses, bedoeld in
      [artikel 6, tweede lid, onderdeel e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel6
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '13.2'
    text: |-
      De verwerking van persoonsgegevens door de Militaire Inlichtingen- en Veiligheidsdienst kan slechts betrekking
      hebben op personen:
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel13
  - number: 13.2.a
    text: |-
      die aanleiding geven tot het ernstige vermoeden dat zij een gevaar vormen voor de veiligheid of de paraatheid van
      de krijgsmacht;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel13
  - number: 13.2.b
    text: die toestemming hebben verleend voor een veiligheidsonderzoek;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel13
  - number: 13.2.c
    text: omtrent wie dat noodzakelijk is in het kader van het onderzoek betreffende andere landen;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel13
  - number: 13.2.d
    text: over wie door een andere inlichtingen- of veiligheidsdienst gegevens zijn ingewonnen;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel13
  - number: 13.2.e
    text: wier gegevens noodzakelijk zijn ter ondersteuning van een goede taakuitvoering door de dienst;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel13
  - number: 13.2.f
    text: die werkzaam zijn of zijn geweest voor een dienst;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel13
  - number: 13.2.g
    text: |-
      omtrent wie dat noodzakelijk is in het kader van een onderzoek als bedoeld in
      [artikel 7, tweede lid, onderdeel a, sub 2°][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel7
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 13.2.h
    text: |-
      omtrent wie dat noodzakelijk is in het kader van het opstellen van de dreigingsanalyses, bedoeld in
      [artikel 7, tweede lid, onderdeel f][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel7
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 13.2.i
    text: |-
      omtrent wie dat noodzakelijk is in het kader van het opstellen van een analyse door de Militaire Inlichtingen-
      en Veiligheidsdienst, in opdracht van onze minister van Defensie, van potentiële dreigingen tegen een bij
      de krijgsmacht werkzaam persoon of een bij de krijgsmacht in gebruik zijnd object, welke niet ingevolge
      de [artikelen 4, derde lid, onderdeel b][ref1], en [42, eerste lid, onderdeel c][ref2], onderscheidenlijk
      [artikel 16 van de Politiewet 2012][ref3] is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel16
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '42'
      - id: ref3
        bwb_id: BWBR0031788
        artikel: '16'
  - number: '13.3'
    text: |-
      De verwerking van persoonsgegevens wegens iemands godsdienst of levensovertuiging, ras, gezondheid en seksuele
      leven vindt niet plaats.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel13
  - number: '13.4'
    text: |-
      De verwerking van persoonsgegevens die betrekking hebben op de in het derde lid bedoelde kenmerken vindt
      slechts plaats in aanvulling op de verwerking van andere gegevens en slechts voor zover dat voor het doel van de
      gegevensverwerking onvermijdelijk is.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel13
  - number: '14.1'
    text: |-
      [De artikelen 12][ref1], [13, eerste, derde en vierde lid][ref2], zijn tevens van toepassing op de verwerking
      van gegevens ten behoeve van de Algemene Inlichtingen- en Veiligheidsdienst door de ambtenaren, bedoeld in
      [artikel 60][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0013409#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0013409#Artikel60
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0013409
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref3
        bwb_id: BWBR0013409
        artikel: '60'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '14.2'
    text: |-
      De verwerking van gegevens, bedoeld in het eerste lid, ten behoeve van de Algemene Inlichtingen- en
      Veiligheidsdienst blijft strikt gescheiden van de verwerking van gegevens door de desbetreffende ambtenaren ten
      behoeve van andere doeleinden. Het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst kan daaromtrent nadere
      aanwijzingen geven.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel14
  - number: '14.3'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties draagt zorg voor de archiefbescheiden die verband
      houden met de gegevensverwerking ten behoeve van de Algemene Inlichtingen- en Veiligheidsdienst door de
      ambtenaren, bedoeld in [artikel 60][ref1], voor zover deze archiefbescheiden niet zijn overgebracht naar een
      rijksarchiefbewaarplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel60
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '60'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '15'
    text: 'De hoofden van de diensten dragen zorg voor:'
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel15
  - number: 15.a
    text: de geheimhouding van daarvoor in aanmerking komende gegevens;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel15
  - number: 15.b
    text: de geheimhouding van daarvoor in aanmerking komende bronnen waaruit gegevens afkomstig zijn;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel15
  - number: 15.c
    text: de veiligheid van de personen met wier medewerking gegevens worden verzameld.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel15
  - number: '16'
    text: 'De hoofden van de diensten dragen voorts zorg voor:'
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel16
  - number: 16.a
    text: de nodige voorzieningen ter bevordering van de juistheid en de volledigheid van de gegevens die worden verwerkt;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel16
  - number: 16.b
    text: |-
      de nodige voorzieningen van technische en organisatorische aard ter beveiliging van de gegevensverwerking tegen
      verlies of aantasting van gegevens alsmede tegen onbevoegde gegevensverwerking;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel16
  - number: 16.c
    text: |-
      de aanwijzing van personen die bij uitsluiting van anderen bevoegd zijn tot de bij de aanwijzing vermelde
      werkzaamheden in het kader van de verwerking van gegevens.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel16
  - number: '17.1'
    text: |-
      De diensten zijn bevoegd zich bij de uitvoering van hun taak, dan wel ter ondersteuning van een goede
      taakuitvoering, voor het verzamelen van gegevens te wenden tot:
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel17
  - number: 17.1.a
    text: bestuursorganen, ambtenaren en voorts een ieder die geacht wordt de benodigde gegevens te kunnen verstrekken;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel17
  - number: 17.1.b
    text: de verantwoordelijke voor een gegevensverwerking.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel17
  - number: '17.2'
    text: |-
      In het geval, bedoeld in het eerste lid, aanhef en onder b, is de daarmee belaste ambtenaar verplicht zich ten
      opzichte van de verantwoordelijke voor een gegevensverwerking te legitimeren aan de hand van een daartoe door het
      betrokken hoofd van een dienst verstrekt legitimatiebewijs.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel17
  - number: '17.3'
    text: |-
      De bij of krachtens de wet geldende voorschriften voor de verantwoordelijke voor een gegevensverwerking betreffende
      de verstrekking van zodanige gegevens zijn niet van toepassing op verstrekkingen gedaan ingevolge een verzoek als
      bedoeld in het eerste lid, aanhef en onder b.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel17
  - number: '18'
    text: |-
      Een bevoegdheid als bedoeld in deze paragraaf mag slechts worden uitgeoefend, voor zover dat noodzakelijk is voor
      de goede uitvoering van de taken, bedoeld in [artikel 6, tweede lid, onder a en d][ref1], en de taken, bedoeld in
      [artikel 7, tweede lid, onder a, c, en e][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0013409#Artikel7
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0013409
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '19.1'
    text: |-
      De uitoefening door een dienst van een bevoegdheid als bedoeld in deze paragraaf is slechts toegestaan, indien,
      voor zover bij deze paragraaf niet anders is bepaald, Onze betrokken Minister of namens deze het betrokken hoofd
      van een dienst daartoe toestemming heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel19
  - number: '19.2'
    text: |-
      Het hoofd van een dienst kan aan hem ondergeschikte ambtenaren bij schriftelijk besluit aanwijzen die de
      toestemming, bedoeld in het eerste lid, namens hem verlenen. Onze betrokken Minister wordt een afschrift van het
      besluit gezonden.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel19
  - number: '19.3'
    text: |-
      De toestemming wordt, voor zover bij of krachtens de wet niet anders is bepaald, verleend voor een periode van ten
      hoogste drie maanden en kan telkens op een daartoe strekkend verzoek worden verlengd voor eenzelfde periode.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel19
  - number: '20.1'
    text: 'De diensten zijn bevoegd tot:'
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel20
  - number: 20.1.a
    text: |-
      het observeren en in het kader daarvan vastleggen van gegevens betreffende gedragingen van natuurlijke personen of
      gegevens betreffende zaken, al dan niet met behulp van observatie- en registratiemiddelen;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel20
  - number: 20.1.b
    text: |-
      het volgen en in het kader daarvan vastleggen van gegevens betreffende natuurlijke personen of zaken, al dan niet
      met behulp van volgmiddelen, plaatsbepalingsapparatuur en registratiemiddelen.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel20
  - number: '20.2'
    text: |-
      De toepassing van observatie- en registratiemiddelen als bedoeld in het eerste lid, onder a, alsmede het aanbrengen
      van volgmiddelen, plaatsbepalingsapparatuur en registratiemiddelen als bedoeld in het eerste lid, onder b, door
      de Militaire Inlichtingen- en Veiligheidsdienst is, voor zover het gaat om de toepassing dan wel het aanbrengen
      daarvan in besloten plaatsen die niet in gebruik zijn van het Ministerie van Defensie slechts toegestaan, indien de
      toestemming daarvoor is verleend in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      dan wel, voor zover van toepassing, het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel20
  - number: '20.3'
    text: |-
      De toepassing van observatie- en registratiemiddelen, bedoeld in het eerste lid, onder a, binnen woningen is
      slechts toegestaan, indien daarvoor door Onze betrokken Minister schriftelijk toestemming is verleend aan het hoofd
      van de dienst. In het geval, bedoeld in het tweede lid, wordt, voor zover het woningen betreft, de toestemming
      verleend in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel20
  - number: '20.4'
    text: |-
      Het verzoek om toestemming als bedoeld in het derde lid wordt gedaan door het hoofd van de dienst en bevat ten
      minste:
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel20
  - number: 20.4.a
    text: het adres van de woning waarbinnen het middel dient te worden toegepast;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel20
  - number: 20.4.b
    text: een omschrijving van het soort middel dat wordt toegepast;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel20
  - number: 20.4.c
    text: de reden waarom de toepassing van het desbetreffende middel noodzakelijk wordt geacht.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel20
  - number: '21.1'
    text: 'De diensten zijn bevoegd tot:'
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel21
  - number: 21.1.a
    text: |-
      de inzet van natuurlijke personen, al dan niet onder dekmantel van een aangenomen identiteit of hoedanigheid, die
      onder verantwoordelijkheid en onder instructie van een dienst zijn belast met:
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel21
  - number: 21.1.a.1°
    text: |-
      het gericht gegevens verzamelen omtrent personen en organisaties die voor de taakuitvoering van een dienst van
      belang kunnen zijn;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel21
  - number: 21.1.a.2°
    text: het bevorderen of het treffen van maatregelen ter bescherming van door een dienst te behartigen belangen.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel21
  - number: 21.1.b
    text: het oprichten en de inzet van rechtspersonen ter ondersteuning van operationele activiteiten.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel21
  - number: '21.2'
    text: |-
      Onze betrokken Minister kan daarvoor in aanmerking komende bestuursorganen schriftelijk opdragen die medewerking te
      verlenen die noodzakelijk is om een natuurlijke persoon als bedoeld in het eerste lid, onderdeel a, van een aan te
      nemen identiteit te voorzien. De voor het bestuursorgaan geldende wettelijke voorschriften ter zake van de van deze
      verlangde werkzaamheden, blijven voor zover deze in de weg staan aan het verrichten van die werkzaamheden buiten
      toepassing.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel21
  - number: '21.3'
    text: |-
      De natuurlijke persoon, bedoeld in het eerste lid, onder a, kan bij instructie van de dienst tevens worden belast
      met het verrichten van handelingen die tot gevolg kunnen hebben dat medewerking wordt verleend aan het plegen van
      een strafbaar feit, dan wel een strafbaar feit wordt gepleegd. Een instructie als bedoeld in de eerste volzin wordt
      slechts gegeven, indien een goede taakuitvoering van de dienst dan wel de veiligheid van de betrokken natuurlijke
      persoon daartoe noodzaakt.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel21
  - number: '21.4'
    text: |-
      De natuurlijke persoon, bedoeld in het eerste lid, onder a, mag bij de uitvoering van de instructie door zijn
      optreden een persoon niet brengen tot ander handelen betreffende het beramen of plegen van strafbare feiten, dan
      waarop diens opzet reeds tevoren was gericht.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel21
  - number: '21.5'
    text: 'Bij de instructie, bedoeld in het derde lid, wordt aan de desbetreffende persoon aangegeven:'
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel21
  - number: 21.5.a
    text: |-
      onder welke omstandigheden deze ter uitvoering van de instructie handelingen mag verrichten die tot gevolg kunnen
      hebben dat medewerking wordt verleend aan het plegen van een strafbaar feit, dan wel een strafbaar feit wordt
      gepleegd;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel21
  - number: 21.5.b
    text: |-
      de wijze waarop aan de instructie uitvoering dient te worden gegeven, waaronder begrepen de aard van de
      handelingen, die door de desbetreffende persoon daarbij zullen mogen worden verricht, voor zover deze bij het geven
      van de instructie zijn te voorzien.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel21
  - number: '21.6'
    text: De instructie aan de natuurlijke persoon, bedoeld in het eerste lid, onder a, wordt schriftelijk vastgelegd.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel21
  - number: '21.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur, op voordracht van Onze betrokken Ministers en Onze Minister van
      Veiligheid en Justitie gezamenlijk, kunnen nadere regels worden gesteld met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel21
  - number: 21.7.a
    text: |-
      de voorwaarden waaronder en de gevallen waarin ter uitvoering van een instructie door een natuurlijke persoon
      als bedoeld in het eerste lid, onderdeel a, handelingen mogen worden verricht die tot gevolg kunnen hebben dat
      medewerking wordt verleend aan het plegen van een strafbaar feit, dan wel een strafbaar feit wordt gepleegd;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel21
  - number: 21.7.b
    text: de wijze waarop de uitoefening van de desbetreffende bevoegdheid wordt gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel21
  - number: '21.8'
    text: |-
      Met betrekking tot het oprichten van rechtspersonen als bedoeld in het eerste lid, onderdeel b, blijft
      [artikel 4.7, eerste lid, aanhef en onderdeel a, en het vierde lid, van de Comptabiliteitswet 2016][ref1] buiten
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel4
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '4'
  - number: '22.1'
    text: 'De diensten zijn bevoegd tot het, al dan niet met behulp van een technisch hulpmiddel:'
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel22
  - number: 22.1.a
    text: doorzoeken van besloten plaatsen;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel22
  - number: 22.1.b
    text: doorzoeken van gesloten voorwerpen;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel22
  - number: 22.1.c
    text: verrichten van onderzoek aan voorwerpen gericht op het vaststellen van de identiteit van een persoon.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel22
  - number: '22.2'
    text: |-
      De uitoefening van de bevoegdheid, bedoeld in het eerste lid, door de Militaire Inlichtingen- en Veiligheidsdienst
      buiten plaatsen in gebruik van het Ministerie van Defensie, is slechts toegestaan indien de toestemming daarvoor is
      verleend in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties dan wel, voor zover van
      toepassing, het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel22
  - number: '22.3'
    text: |-
      Indien dit noodzakelijk is voor het onderzoek van een dienst, kan een bij de toepassing van de bevoegdheid,
      bedoeld in het eerste lid, aangetroffen voorwerp voor een beperkte tijd door de desbetreffende dienst worden
      meegenomen, voor zover onderzoek van het desbetreffende voorwerp ter plaatse van de doorzoeking onmogelijk is en
      de daarmee beoogde verzameling van gegevens niet op een andere, minder ingrijpende wijze kan worden bewerkstelligd.
      De desbetreffende voorwerpen worden zo spoedig mogelijk teruggeplaatst, tenzij het belang van een goede
      taakuitoefening van de dienst zich daartegen verzet of met terugplaatsing geen redelijk belang wordt gediend.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel22
  - number: '22.4'
    text: |-
      Van de bevoegdheid, bedoeld in het eerste lid, onder a, mag, voor zover het woningen betreft, slechts gebruik
      worden gemaakt, indien daarvoor door Onze betrokken Minister schriftelijk toestemming is verleend aan het hoofd
      van de dienst. Uitoefening van de bevoegdheid, bedoeld in het eerste lid, onder a, door de Militaire Inlichtingen-
      en Veiligheidsdienst met betrekking tot woningen buiten plaatsen in gebruik van het Ministerie van Defensie,
      is slechts toegestaan, indien de toestemming daarvoor is verleend in overeenstemming met Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel22
  - number: '22.5'
    text: |-
      De toestemming, bedoeld in het vierde lid, wordt verleend voor een periode van ten hoogste drie dagen. De
      [Algemene termijnenwet][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: '22.6'
    text: |-
      Het verzoek om toestemming als bedoeld in het vierde lid wordt gedaan door het hoofd van de dienst en bevat ten
      minste:
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel22
  - number: 22.6.a
    text: het adres van de woning die dient te worden doorzocht, en
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel22
  - number: 22.6.b
    text: de reden waarom de woning dient te worden doorzocht.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel22
  - number: '23.1'
    text: |-
      De diensten zijn bevoegd tot het openen van brieven en andere geadresseerde zendingen, zonder goedvinden van de
      afzender of de geadresseerde, indien de rechtbank Den Haag daartoe, op verzoek van het hoofd van de dienst, een
      last heeft afgegeven.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel23
  - number: '23.2'
    text: |-
      Voor de uitoefening van de bevoegdheid, bedoeld in het eerste lid, is geen toestemming vereist als bedoeld in
      [artikel 19][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel19
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '23.3'
    text: |-
      Het verzoek, bedoeld in het eerste lid, door het hoofd van de Militaire Inlichtingen- en Veiligheidsdienst ten
      aanzien van brieven en andere geadresseerde zendingen, waarvan het adres van de afzender of de geadresseerde
      niet overeenstemt met een adres van een plaats in gebruik van het Ministerie van Defensie, wordt gedaan in
      overeenstemming met het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel23
  - number: '23.4'
    text: 'Het verzoek om een last, bedoeld in het eerste lid, bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel23
  - number: 23.4.a
    text: |-
      de naam en het adres van de persoon of instelling, van wie dan wel waarvan brieven of andere geadresseerde
      zendingen aan deze gericht dan wel van deze afkomstig, dienen te worden geopend;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel23
  - number: 23.4.b
    text: de reden waarom de brieven of andere geadresseerde zendingen dienen te worden geopend.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel23
  - number: '23.5'
    text: |-
      Een last wordt slechts afgegeven, indien dat noodzakelijk is voor een goede uitoefening van de aan de dienst
      opgedragen taak.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel23
  - number: '23.6'
    text: 'Een last, bedoeld in het eerste lid, wordt afgegeven:'
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel23
  - number: 23.6.a
    text: per brief of andere geadresseerde zending, indien deze reeds in het bezit van de dienst is;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel23
  - number: 23.6.b
    text: |-
      voor een daarbij te bepalen periode van ten hoogste drie maanden, indien het betreft het openen van brieven of
      andere geadresseerde zendingen die aan een in de last vermelde instelling van post dan wel vervoer zijn of worden
      toevertrouwd.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel23
  - number: '23.7'
    text: |-
      De instelling van post dan wel vervoer, bedoeld in het zesde lid, onder b, is gehouden de brieven en andere
      geadresseerde zendingen, waarop de last betrekking heeft, tegen ontvangstbewijs uit te leveren aan een door het
      hoofd van de dienst daartoe aangewezen ambtenaar van de dienst.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel23
  - number: '23.8'
    text: |-
      De ambtenaar is gehouden zich jegens de instelling van post dan wel vervoer te legitimeren aan de hand van een door
      het hoofd van de dienst verstrekt legitimatiebewijs.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel23
  - number: '23.9'
    text: |-
      De diensten dragen zorg dat een door een instelling van post of vervoer uitgeleverde brief of andere geadresseerde
      zending na onderzoek daarvan, onverwijld aan de desbetreffende instelling ter verzending terug wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel23
  - number: '24.1'
    text: |-
      De diensten zijn bevoegd tot het al dan niet met gebruikmaking van technische hulpmiddelen, valse signalen, valse
      sleutels of valse hoedanigheid, binnendringen in een geautomatiseerd werk. Tot de bevoegdheid, bedoeld in de eerste
      volzin, behoort tevens de bevoegdheid:
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel24
  - number: 24.1.a
    text: tot het doorbreken van enige beveiliging;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel24
  - number: 24.1.b
    text: |-
      tot het aanbrengen van technische voorzieningen teneinde versleuteling van gegevens opgeslagen of verwerkt in het
      geautomatiseerde werk ongedaan te maken;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel24
  - number: 24.1.c
    text: de gegevens opgeslagen of verwerkt in het geautomatiseerde werk over te nemen.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel24
  - number: '24.2'
    text: |-
      De uitoefening van de bevoegdheid, bedoeld in het eerste lid, door de Militaire Inlichtingen- en Veiligheidsdienst
      buiten plaatsen in gebruik van het Ministerie van Defensie is slechts toegestaan, indien de toestemming daarvoor is
      verleend in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties dan wel, voor zover van
      toepassing, het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel24
  - number: '24.3'
    text: |-
      Een ieder die kennis draagt ter zake van het ongedaan maken van de versleuteling van de gegevens opgeslagen of
      verwerkt in het geautomatiseerde werk als bedoeld in het eerste lid, is verplicht het hoofd van de dienst op diens
      schriftelijk verzoek alle noodzakelijke medewerking te verlenen om deze versleuteling ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel24
  - number: '25.1'
    text: |-
      De diensten zijn bevoegd tot het met een technisch hulpmiddel gericht aftappen, ontvangen, opnemen en afluisteren
      van elke vorm van gesprek, telecommunicatie of gegevensoverdracht door middel van een geautomatiseerd werk,
      ongeacht waar een en ander plaatsvindt. Tot de bevoegdheid, bedoeld in de eerste volzin, behoort tevens de
      bevoegdheid om versleuteling van de gesprekken, telecommunicatie of gegevensoverdracht ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel25
  - number: '25.2'
    text: |-
      De in het eerste lid bedoelde bevoegdheid mag slechts worden uitgeoefend, indien door Onze betrokken Minister
      daarvoor op een daartoe strekkend verzoek toestemming is verleend aan het hoofd van de dienst.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel25
  - number: '25.3'
    text: |-
      De uitoefening van de bevoegdheid, bedoeld in het eerste lid, door de Militaire Inlichtingen- en Veiligheidsdienst
      met betrekking tot gesprekken, telecommunicatie of gegevensoverdracht door middel van een geautomatiseerd werk,
      voor zover deze niet plaatsvindt op of met plaatsen in gebruik van het Ministerie van Defensie, is slechts
      toegestaan, indien de toestemming daarvoor is verleend in overeenstemming met Onze Minister van Binnenlandse Zaken
      en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel25
  - number: '25.4'
    text: |-
      Het verzoek om toestemming, bedoeld in het tweede en derde lid, wordt gedaan door het hoofd van de dienst en bevat
      ten minste:
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel25
  - number: 25.4.a
    text: |-
      een aanduiding van de bevoegdheid die de dienst wenst uit te oefenen en, voor zover van toepassing, het nummer,
      bedoeld in [artikel 1.1 van de Telecommunicatiewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel1
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '1'
  - number: 25.4.b
    text: |-
      gegevens betreffende de identiteit van de persoon dan wel de organisatie ten aanzien van wie onderscheidenlijk
      waarvan de uitoefening van de desbetreffende bevoegdheid wordt verlangd;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel25
  - number: 25.4.c
    text: de reden waarom uitoefening van de desbetreffende bevoegdheid wordt verlangd.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel25
  - number: '25.5'
    text: |-
      Indien bij het verzoek om toestemming het nummer, bedoeld in het vierde lid, onder a, nog niet bekend is, wordt
      de toestemming slechts verleend onder de voorwaarde dat de bevoegdheid slechts mag worden uitgeoefend, zodra het
      desbetreffende nummer bekend is. De diensten zijn bevoegd tot het gebruik van een technisch hulpmiddel waarmee het
      nummer, bedoeld in de eerste volzin, kan worden verkregen. De uitoefening van de bevoegdheid, bedoeld in de tweede
      volzin, door de Militaire Inlichtingen- en Veiligheidsdienst buiten plaatsen in gebruik van het Ministerie van
      Defensie geschiedt in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel25
  - number: '25.6'
    text: |-
      Indien bij het verzoek om toestemming de gegevens, bedoeld in het vierde lid, onder b, nog niet bekend zijn, wordt
      toestemming slechts verleend onder de voorwaarde de desbetreffende gegevens zo spoedig mogelijk aan te vullen.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel25
  - number: '25.7'
    text: |-
      Een ieder die kennis draagt ter zake van het ongedaan maken van de versleuteling van gesprekken, telecommunicatie
      of gegevensoverdracht als bedoeld in het eerste lid, is verplicht het hoofd van de dienst op diens schriftelijk
      verzoek alle noodzakelijke medewerking te verlenen om deze versleuteling ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel25
  - number: '25.8'
    text: |-
      Het derde lid is niet van toepassing ten aanzien van het gericht ontvangen en opnemen van niet-kabelgebonden
      telecommunicatie die zijn oorsprong of bestemming in andere landen heeft, aan de hand van een technisch kenmerk.
      Voor zover deze telecommunicatie betrekking heeft op militair berichtenverkeer is geen toestemming vereist als
      bedoeld in [de artikelen 19][ref1] en [25, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0013409#Artikel25
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0013409
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '26.1'
    text: |-
      De diensten zijn bevoegd tot het met een technisch hulpmiddel ontvangen en opnemen van niet-kabelgebonden
      telecommunicatie die zijn oorsprong of bestemming in andere landen heeft, aan de hand van een technisch kenmerk ter
      verkenning van de communicatie. De diensten zijn bevoegd om van daarbij ontvangen gegevens kennis te nemen. Tot de
      bevoegdheid, bedoeld in de eerste volzin, behoort tevens de bevoegdheid om versleuteling van de telecommunicatie
      ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel26
  - number: '26.2'
    text: |-
      Voor de uitoefening van de bevoegdheid, bedoeld in het eerste lid, is geen toestemming vereist als bedoeld in
      [artikel 19][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel19
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '26.3'
    text: |-
      Zodra door toepassing van de bevoegdheid, bedoeld in het eerste lid, de identiteit van de persoon of organisatie
      van wie onderscheidenlijk waarvan de telecommunicatie afkomstig is, is vastgesteld, kan daarvan aantekening worden
      gemaakt indien zulks noodzakelijk is voor de goede taakuitvoering door de dienst.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel26
  - number: '26.4'
    text: |-
      Zodra door toepassing van de bevoegdheid, bedoeld in het eerste lid, de identiteit van de persoon of de organisatie
      van wie onderscheidenlijk waarvan de telecommunicatie afkomstig is, is vastgesteld, wordt binnen twee dagen een
      verzoek om toestemming als bedoeld in [artikel 25, tweede lid][ref1], ingediend, indien het ontvangen en opnemen
      van de telecommunicatie van de desbetreffende persoon of organisatie noodzakelijk is voor een goede taakuitvoering
      door de dienst. Tot het moment van verlening van de toestemming, bedoeld in [artikel 25, tweede lid][ref2], wordt
      van de opgenomen telecommunicatie niet verder kennisgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0013409#Artikel25
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0013409
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '26.5'
    text: |-
      Indien het ontvangen en opnemen van de telecommunicatie van de desbetreffende persoon of organisatie niet
      noodzakelijk is voor een goede taakuitvoering door de dienst, worden de ingevolge het eerste lid ontvangen en
      opgenomen gegevens terstond vernietigd.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel26
  - number: '27.1'
    text: |-
      De diensten zijn bevoegd tot het met een technisch hulpmiddel ongericht ontvangen en opnemen van niet-kabelgebonden
      telecommunicatie. Tot de bevoegdheid, bedoeld in de eerste volzin, behoort tevens de bevoegdheid om versleuteling
      van de telecommunicatie ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel27
  - number: '27.2'
    text: |-
      Voor de uitoefening van de bevoegdheid, bedoeld in het eerste lid, is geen toestemming vereist als bedoeld in
      [artikel 19][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel19
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '27.3'
    text: |-
      De gegevens die door de uitoefening van de bevoegdheid, bedoeld in het eerste lid, zijn verzameld, kunnen door de
      diensten worden geselecteerd aan de hand van:
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel27
  - number: 27.3.a
    text: gegevens betreffende de identiteit van een persoon dan wel een organisatie;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel27
  - number: 27.3.b
    text: |-
      een nummer als bedoeld in [artikel 1.1 van de Telecommunicatiewet][ref1], dan wel enig technisch kenmerk;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel1
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '1'
  - number: 27.3.c
    text: aan een nader omschreven onderwerp gerelateerde trefwoorden.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel27
  - number: '27.4'
    text: |-
      De toestemming voor de selectie, bedoeld in het derde lid, onder a en b, wordt door Onze betrokken Minister op een
      daartoe strekkend verzoek verleend aan het hoofd van de dienst voor een periode van ten hoogste drie maanden en
      kan telkens op een daartoe strekkend verzoek worden verlengd. Het verzoek tot het verlenen van toestemming bevat
      ten minste:
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel27
  - number: 27.4.a
    text: de gegevens, bedoeld in het derde lid, onder a dan wel b, aan de hand waarvan de selectie zal plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel27
  - number: 27.4.b
    text: de reden waarom de selectie zal worden toegepast.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel27
  - number: '27.5'
    text: |-
      De toestemming voor de selectie aan de hand van trefwoorden, bedoeld in het derde lid, onder c, wordt door Onze
      betrokken Minister op een daartoe strekkend verzoek verleend aan het hoofd van de dienst voor een periode van ten
      hoogste een jaar en kan telkens op een daartoe strekkend verzoek worden verlengd. Het verzoek tot het verlenen van
      toestemming bevat ten minste:
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel27
  - number: 27.5.a
    text: een nauwkeurige omschrijving van het onderwerp;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel27
  - number: 27.5.b
    text: de reden waarom de selectie dient te worden toegepast.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel27
  - number: '27.6'
    text: |-
      Op de vaststelling van de aan de onderwerpen gerelateerde trefwoorden is [artikel 19][ref1] van toepassing, met
      dien verstande dat in het derde lid van dat artikel voor «drie maanden» wordt gelezen: een jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel19
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '27.7'
    text: |-
      Van een verleende toestemming als bedoeld in het vijfde lid wordt met opgave van het onderwerp alsmede de reden
      van selectie, vertrouwelijk mededeling gedaan aan een of beide kamers der Staten-Generaal alsmede aan de commissie
      van toezicht.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel27
  - number: '27.8'
    text: |-
      Voor zover de selectie, bedoeld in het derde lid, geschiedt door de Militaire Inlichtingen- en Veiligheidsdienst
      ten aanzien van telecommunicatie die haar oorsprong en bestemming in Nederland vindt, wordt de toestemming daarvoor
      verleend in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel27
  - number: '27.9'
    text: |-
      Gegevens die zijn verzameld door uitoefening van de bevoegdheid, bedoeld in het eerste lid, mogen, voor zover
      zij niet zijn geselecteerd, voor een periode van ten hoogste een jaar worden bewaard ten behoeve van een nadere
      selectie, met dien verstande dat deze:
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel27
  - number: 27.9.a
    text: |-
      slechts mag plaatsvinden in het kader van een onderzoek door een dienst op grond van een reden als bedoeld in het
      vierde lid, onder b, dan wel met betrekking tot een onderwerp als bedoeld in het vijfde lid, onder a, waarvoor op
      het moment van het ontvangen en opnemen van de desbetreffende gegevens toestemming was verleend, en
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel27
  - number: 27.9.b
    text: voor de goede uitoefening van het desbetreffende onderzoek dringend wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel27
  - number: '27.10'
    text: |-
      Het negende lid is van overeenkomstige toepassing op gegevens waarvan de versleuteling nog niet ongedaan is
      gemaakt, met dien verstande dat de periode, bedoeld in het negende lid, pas aanvangt met ingang van het moment
      waarop de versleuteling ongedaan is gemaakt.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel27
  - number: '28.1'
    text: |-
      De diensten zijn bevoegd zich te wenden tot de aanbieders van openbare telecommunicatienetwerken en openbare
      telecommunicatiediensten in de zin van de [Telecommunicatiewet][ref1] met het verzoek gegevens te verstrekken over
      een gebruiker en het telecommunicatieverkeer met betrekking tot die gebruiker. Het verzoek kan slechts betrekking
      hebben op gegevens die bij algemene maatregel van bestuur zijn aangewezen en kan zowel gegevens betreffen die ten
      tijde van het verzoek zijn verwerkt als gegevens die na het tijdstip van het verzoek worden verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0009950
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0009950
  - number: '28.2'
    text: |-
      Onder een gebruiker van telecommunicatie wordt in dit artikel verstaan de natuurlijke persoon of rechtspersoon
      die met de aanbieder een overeenkomst is aangegaan met betrekking tot het gebruik van een openbaar
      telecommunicatienetwerk of de levering van een openbare telecommunicatiedienst, alsmede de natuurlijke persoon
      of rechtspersoon die daadwerkelijk gebruik maakt van een openbaar telecommunicatienetwerk of een openbare
      telecommunicatiedienst.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel28
  - number: '28.3'
    text: |-
      Voor de uitoefening van de bevoegdheid, bedoeld in het eerste lid, eerste volzin, is geen toestemming vereist als
      bedoeld in [artikel 19][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel19
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '28.4'
    text: 'Het verzoek wordt schriftelijk gedaan door het hoofd van de desbetreffende dienst en bevat:'
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel28
  - number: 28.4.a
    text: |-
      het nummer, bedoeld in [artikel 1.1 van de Telecommunicatiewet][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel1
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '1'
  - number: 28.4.b
    text: |-
      gegevens betreffende de naam, alsmede de woon- of verblijfplaats van de persoon dan wel de vestigingsplaats van de
      organisatie van wie onderscheidenlijk waaraan het nummer, bedoeld onder a, toebehoort, en
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel28
  - number: 28.4.c
    text: de gegevens die verstrekt dienen te worden, alsmede
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel28
  - number: 28.4.d
    text: de periode waarover de gegevens moeten worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel28
  - number: '28.5'
    text: |-
      Voor zover het verzoek wordt gedaan door het hoofd van de Militaire Inlichtingen- en Veiligheidsdienst ten aanzien
      van een gebruiker en het telecommunicatieverkeer met betrekking tot die gebruiker en die gebruiker zich niet
      bevindt op een plaats in gebruik bij het Ministerie van Defensie, geschiedt dit in overeenstemming met het hoofd
      van de Algemene Inlichtingen- en Veiligheidsdienst.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel28
  - number: '28.6'
    text: |-
      Op de verstrekking van gegevens ingevolge een verzoek als bedoeld in het eerste lid is
      [artikel 17, derde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel17
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '29.1'
    text: |-
      De diensten zijn bevoegd zich te wenden tot de aanbieders van openbare telecommunicatienetwerken en openbare
      telecommunicatiediensten in de zin van de [Telecommunicatiewet][ref1] met het verzoek gegevens te verstrekken
      terzake van naam, adres, postcode, woonplaats, nummer en soort dienst van een gebruiker van telecommunicatie.


      [ref1]: https://wetten.overheid.nl/BWBR0009950
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0009950
  - number: '29.2'
    text: |-
      Onder een gebruiker van telecommunicatie wordt in dit artikel verstaan de natuurlijke persoon of rechtspersoon
      die met de aanbieder een overeenkomst is aangegaan met betrekking tot het gebruik van een openbaar
      telecommunicatienetwerk of de levering van een openbare telecommunicatiedienst, alsmede de natuurlijke persoon
      of rechtspersoon die daadwerkelijk gebruik maakt van een openbaar telecommunicatienetwerk of een openbare
      telecommunicatiedienst.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel29
  - number: '29.3'
    text: |-
      Voor de uitoefening van de bevoegdheid, bedoeld in het eerste lid, eerste volzin, is geen toestemming vereist als
      bedoeld in [artikel 19][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel19
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '29.4'
    text: Het verzoek wordt gedaan door of namens het hoofd van de desbetreffende dienst.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel29
  - number: '29.5'
    text: |-
      Indien de gegevens, bedoeld in het eerste lid, bij de aanbieder niet bekend zijn en zij nodig zijn voor de
      toepassing van [artikel 25][ref1] of [artikel 28][ref2] kan de dienst verzoeken dat de aanbieder de verzochte
      gegevens achterhaalt en verstrekt. De diensten zijn bevoegd tot het gebruik van een technisch hulpmiddel waarmee
      het nummer, bedoeld in het eerste lid, kan worden verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0013409#Artikel28
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0013409
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '29.6'
    text: |-
      Op de verstrekking van gegevens ingevolge een verzoek als bedoeld in het eerste of vijfde lid is
      [artikel 17, derde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel17
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '30.1'
    text: 'De diensten hebben toegang tot elke plaats, voor zover dat redelijkerwijs nodig is om:'
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel30
  - number: 30.1.a
    text: |-
      observatie- en registratiemiddelen als bedoeld in [artikel 20, eerste lid, onder a][ref1], aan te brengen;


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel20
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 30.1.b
    text: |-
      volgmiddelen, plaatsbepalingsapparatuur en registratiemiddelen als bedoeld in
      [artikel 20, eerste lid, onder b][ref1], aan te brengen;


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel20
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 30.1.c
    text: |-
      de bevoegdheid, bedoeld in [artikel 22, eerste lid, onder a][ref1], uit te oefenen;


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel22
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '22'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 30.1.d
    text: |-
      de bevoegdheid, bedoeld in [artikel 24][ref1], uit te oefenen;


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel24
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 30.1.e
    text: |-
      de bevoegdheid, bedoeld in [artikel 25][ref1], uit te oefenen;


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel25
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 30.1.f
    text: |-
      met betrekking tot de aldaar aanwezige telecommunicatie-apparatuur de gegevens te verzamelen die noodzakelijk zijn
      om de bevoegdheid, waarvoor overeenkomstig [artikel 25, zesde lid][ref1], toestemming is verleend, uit te kunnen
      oefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel25
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '30.2'
    text: |-
      Voor de uitoefening van de bevoegdheid, bedoeld in het eerste lid, is geen toestemming vereist als bedoeld in
      [artikel 19][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel19
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '30.3'
    text: |-
      De uitoefening van de bevoegdheid, bedoeld in het eerste lid, is slechts toegestaan door personen die daartoe door
      het hoofd van een dienst zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel30
  - number: '30.4'
    text: |-
      De [artikelen 1, eerste, tweede en derde lid][ref1], en
      [artikel 2, eerste lid, laatste volzin, van de Algemene wet op het binnentreden][ref2] zijn niet van
      toepassing. Onze betrokken Minister of namens deze het hoofd van een dienst is bevoegd tot het geven
      van een machtiging als bedoeld in [artikel 2 van de Algemene wet op het binnentreden][ref3]. In de
      gevallen, bedoeld in het eerste lid, onder a en c, geldt de ingevolge de desbetreffende artikelen gegeven
      toestemming met betrekking tot de bevoegdheidsuitoefening in woningen, tevens als machtiging in de zin van
      [artikel 2 van de Algemene wet op het binnentreden][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006763#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006763#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0006763#Artikel2
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006763
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0006763
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0006763
        artikel: '2'
  - number: '31.1'
    text: |-
      De uitoefening van een bevoegdheid als bedoeld in deze paragraaf is slechts geoorloofd, indien de daarmee beoogde
      verzameling van gegevens niet of niet tijdig kan geschieden door raadpleging van voor een ieder toegankelijke
      informatiebronnen of van informatiebronnen waarvoor aan de dienst een recht op kennisneming van de aldaar
      berustende gegevens is verleend.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel31
  - number: '31.2'
    text: |-
      Indien is besloten tot het verzamelen van gegevens door uitoefening van een of meer bevoegdheden als bedoeld
      in deze paragraaf, wordt slechts die bevoegdheid uitgeoefend, die gelet op de omstandigheden van het geval,
      waaronder de ernst van de bedreiging van de door een dienst te beschermen belangen, mede in vergelijking met andere
      beschikbare bevoegdheden voor de betrokkene het minste nadeel oplevert.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel31
  - number: '31.3'
    text: |-
      De uitoefening van een bevoegdheid blijft achterwege, indien de uitoefening ervan voor betrokkene een onevenredig
      nadeel in vergelijking met het daarbij na te streven doel oplevert.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel31
  - number: '31.4'
    text: De uitoefening van een bevoegdheid dient evenredig te zijn aan het daarmee beoogde doel.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel31
  - number: '32'
    text: |-
      De uitoefening van een bevoegdheid als bedoeld in deze paragraaf wordt onmiddellijk gestaakt, indien het doel
      waartoe de bevoegdheid is uitgeoefend is bereikt dan wel met de uitoefening van een minder ingrijpende bevoegdheid
      kan worden volstaan.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel32
  - number: '33'
    text: Van de uitoefening van een bevoegdheid als bedoeld in deze paragraaf wordt een schriftelijk verslag gemaakt.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel33
  - number: '34.1'
    text: |-
      Onze betrokken Minister onderzoekt vijf jaar na de beëindiging van de uitoefening van een
      bijzondere bevoegdheid als bedoeld in [de artikelen 23, eerste lid][ref1], [25, eerste lid][ref2],
      [27, derde lid, onderdelen a en b][ref3], alsmede [artikel 30, eerste lid][ref4], voor zover is binnengetreden in
      een woning zonder toestemming van de bewoner, en daarna telkens eenmaal per jaar, of de persoon ten aanzien van wie
      één van deze bijzondere bevoegdheden is uitgeoefend, daarvan verslag kan worden uitgebracht. Indien dit mogelijk
      is, geschiedt dit zo spoedig mogelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0013409#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0013409#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0013409#Artikel30
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0013409
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0013409
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref4
        bwb_id: BWBR0013409
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '34.2'
    text: |-
      Indien het uitbrengen van het verslag aan de persoon ten aanzien van wie de bijzondere bevoegdheden, bedoeld in
      het eerste lid, zijn uitgeoefend niet mogelijk is, wordt de commissie van toezicht hiervan op de hoogte gesteld. De
      mededeling aan de commissie gaat vergezeld van de motivering waarom het verslag niet kan worden uitgebracht.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel34
  - number: '34.3'
    text: 'Het verslag is schriftelijk en omvat uitsluitend:'
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel34
  - number: 34.3.a
    text: gegevens betreffende de identiteit van de betrokken persoon;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel34
  - number: 34.3.b
    text: |-
      een aanduiding van de bijzondere bevoegdheid als bedoeld in het eerste lid die ten aanzien van de betrokken persoon
      is uitgeoefend;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel34
  - number: 34.3.c
    text: |-
      de persoon of instantie die voor de uitoefening van de bijzondere bevoegdheid toestemming, machtiging dan wel last
      heeft verleend;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel34
  - number: 34.3.d
    text: de datum waarop voor de bevoegdheidsuitoefening toestemming, machtiging dan wel last is verleend;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel34
  - number: 34.3.e
    text: |-
      de periode gedurende welke de bevoegdheidsuitoefening heeft plaatsgevonden en, indien de uitoefening van de
      bevoegdheid betrekking had op het binnentreden van een woning zonder toestemming van de bewoner, een aanduiding van
      de woning waarin is binnengetreden.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel34
  - number: '34.4'
    text: |-
      Voor zover de bevoegdheidsuitoefening het binnentreden van een woning zonder toestemming van de bewoner betreft,
      blijft [artikel 10, tweede lid, van de Algemene wet op het binnentreden][ref1] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel10
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '10'
  - number: '34.5'
    text: |-
      De verplichting tot het uitbrengen van een verslag, bedoeld in het eerste lid, vervalt op het moment dat is
      vastgesteld dat zulks redelijkerwijs niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel34
  - number: '34.6'
    text: |-
      Het uitbrengen van een verslag aan de persoon wordt uitgesteld, indien de desbetreffende bijzondere bevoegdheid is
      uitgeoefend in het kader van een onderzoek, waaromtrent verstrekking van gegevens aan de betrokken persoon, indien
      deze op het moment van onderzoek een aanvraag als bedoeld in [artikel 47][ref1] zou hebben ingediend, ingevolge
      [artikel 53][ref2] zou moeten worden geweigerd.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0013409#Artikel53
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '47'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0013409
        artikel: '53'
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: '34.7'
    text: |-
      De verplichting tot onderzoek, bedoeld in het eerste lid, vervalt, indien het uitbrengen van een verslag omtrent de
      uitoefening van de desbetreffende bijzondere bevoegdheid naar redelijke verwachting ertoe leidt, dat:
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel34
  - number: 34.7.a
    text: bronnen van een dienst, daaronder begrepen inlichtingen- en veiligheidsdiensten van andere landen, worden onthuld;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel34
  - number: 34.7.b
    text: betrekkingen met andere landen en met internationale organisaties ernstig worden geschaad;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel34
  - number: 34.7.c
    text: |-
      een specifieke toepassing van een methode van een dienst of de identiteit van degene die de betrokken dienst
      behulpzaam is geweest bij de toepassing van de methode worden onthuld.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel34
  - number: '35'
    text: |-
      De verstrekking van door of ten behoeve van een dienst verwerkte gegevens aan een binnen de dienst of ingevolge
      [artikel 60][ref1] ten behoeve van de Algemene Inlichtingen- en Veiligheidsdienst werkzame ambtenaar vindt slechts
      plaats, voor zover dat noodzakelijk is voor een goede uitvoering van de aan de desbetreffende ambtenaar opgedragen
      taak.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel60
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '60'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '36.1'
    text: |-
      De diensten zijn in het kader van een goede taakuitvoering bevoegd om omtrent door of ten behoeve van de dienst
      verwerkte gegevens mededeling te doen aan:
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel36
  - number: 36.1.a
    text: Onze Ministers wie deze aangaan;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel36
  - number: 36.1.b
    text: andere bestuursorganen wie deze aangaan;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel36
  - number: 36.1.c
    text: andere personen of instanties wie deze aangaan;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel36
  - number: 36.1.d
    text: |-
      daarvoor in aanmerking komende inlichtingen- en veiligheidsdiensten van andere landen, alsmede andere daarvoor in
      aanmerking komende internationale beveiligings-, verbindingsinlichtingen- en inlichtingenorganen.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel36
  - number: '36.2'
    text: |-
      Een mededeling als bedoeld in het eerste lid geschiedt door Onze betrokken Minister, indien de aard van de
      mededeling daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel36
  - number: '36.3'
    text: |-
      Onverminderd de mededeling, bedoeld in het eerste lid, kan van door de diensten verwerkte gegevens voorts slechts
      mededeling worden gedaan in de gevallen voorzien bij deze wet.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel36
  - number: '37.1'
    text: |-
      De verstrekking van gegevens kan geschieden onder de voorwaarde dat degene aan wie de gegevens worden verstrekt,
      deze gegevens niet aan anderen mag verstrekken.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel37
  - number: '37.2'
    text: |-
      De voorwaarde, bedoeld in het eerste lid, wordt in ieder geval gesteld, indien gegevens worden verstrekt aan een
      instantie als bedoeld in [artikel 36, eerste lid, onder d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel36
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '37.3'
    text: |-
      Indien gegevens zijn verstrekt onder de voorwaarde dat deze niet aan anderen mogen worden verstrekt, kan door Onze
      betrokken Minister of namens deze het hoofd van de dienst alsnog toestemming worden verleend om deze aan andere
      personen of instanties te verstrekken. Aan de toestemming kunnen voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel37
  - number: '38.1'
    text: |-
      Indien bij de verwerking van gegevens door of ten behoeve van een dienst blijkt van gegevens die tevens van
      belang kunnen zijn voor de opsporing of vervolging van strafbare feiten, kan daarvan door Onze betrokken Minister
      of namens deze het hoofd van de dienst, onverminderd het geval dat daartoe een wettelijke verplichting bestaat,
      schriftelijk mededeling worden gedaan aan het daartoe aangewezen lid van het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel38
  - number: '38.2'
    text: |-
      In spoedeisende gevallen kan de mededeling, bedoeld in het eerste lid, mondeling geschieden. Onze betrokken
      Minister of namens deze het hoofd van de dienst bevestigt de desbetreffende mededeling zo spoedig mogelijk
      schriftelijk.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel38
  - number: '38.3'
    text: |-
      Op een daartoe strekkend verzoek van het daartoe aangewezen lid van het openbaar ministerie wordt inzage gegeven in
      alle aan de mededeling ten grondslag liggende gegevens die voor de beoordeling van de juistheid van de mededeling
      noodzakelijk zijn. De [artikelen 85][ref1] en [86][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0013409#Artikel86
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '85'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0013409
        artikel: '86'
        hoofdstuk: '7'
  - number: '39.1'
    text: |-
      Onverminderd het bepaalde in [artikel 38][ref1] kan voorts, indien bij de verwerking van gegevens door of ten
      behoeve van een dienst daarvan is gebleken, op grond van een dringende en gewichtige reden schriftelijk mededeling
      worden gedaan van gegevens aan bij of krachtens algemene maatregel van bestuur aangewezen personen of instanties
      die betrokken zijn bij de uitvoering van een publieke taak, voor zover deze gegevens tevens van belang kunnen zijn
      voor de behartiging van de aan hen in dat kader opgedragen belangen.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel38
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '38'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '39.2'
    text: |-
      [Artikel 40, tweede en derde lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel40
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '39.3'
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel39
  - number: '40.1'
    text: |-
      Persoonsgegevens worden door Onze betrokken Minister of namens deze het hoofd van de dienst schriftelijk
      medegedeeld, indien de persoon of instantie waaraan de desbetreffende mededeling wordt gedaan naar aanleiding van
      die mededeling jegens de desbetreffende persoon bevoegd is maatregelen te treffen.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel40
  - number: '40.2'
    text: |-
      In spoedeisende gevallen kan de mededeling, bedoeld in het eerste lid, mondeling geschieden. Onze betrokken
      Minister of namens deze het hoofd van de dienst bevestigt de desbetreffende mededeling zo spoedig mogelijk
      schriftelijk.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel40
  - number: '40.3'
    text: |-
      Onze betrokken Minister of namens deze het hoofd van de dienst kan aan een persoon of instantie inzage verlenen in
      de aan de mededeling ten grondslag liggende gegevens, voor zover dat voor de beoordeling van de juistheid van de
      mededeling noodzakelijk is. De [artikelen 85][ref1] en [86, tweede en derde lid][ref2], zijn van overeenkomstige
      toepassing op de personen en instanties waaraan inzage in de desbetreffende gegevens is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0013409#Artikel86
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '85'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0013409
        artikel: '86'
        hoofdstuk: '7'
  - number: '41.1'
    text: |-
      Verstrekking van persoonsgegevens waarvan de juistheid redelijkerwijs niet kan worden vastgesteld of die meer dan
      10 jaar geleden zijn verwerkt, terwijl ten aanzien van de desbetreffende persoon sindsdien geen nieuwe gegevens
      zijn verwerkt, vindt niet plaats.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel41
  - number: '41.2'
    text: 'In afwijking van het eerste lid kan over persoonsgegevens slechts mededeling worden gedaan aan:'
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel41
  - number: 41.2.a
    text: |-
      een dienst of een instantie, bedoeld in [artikel 36, eerste lid, onder d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel36
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 41.2.b
    text: instanties die zijn belast met de opsporing en vervolging van strafbare feiten;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel41
  - number: 41.2.c
    text: andere instanties in door Onze betrokken Minister te bepalen bijzondere gevallen.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel41
  - number: '41.3'
    text: |-
      Bij een mededeling als bedoeld in het tweede lid wordt de mate van betrouwbaarheid alsmede de ouderdom van
      de daaraan ten grondslag liggende gegevens vermeld. Indien met betrekking tot de desbetreffende gegevens een
      verklaring als bedoeld in [artikel 48, eerste lid][ref1], voorhanden is, wordt deze gelijktijdig verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel48
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '48'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '41.4'
    text: |-
      [Artikel 40, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel40
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '42'
    text: Van de verstrekking van persoonsgegevens wordt aantekening gehouden.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel42
  - number: '43.1'
    text: De gegevens die, gelet op het doel waarvoor zij worden verwerkt, hun betekenis hebben verloren, worden verwijderd.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel43
  - number: '43.2'
    text: |-
      Indien blijkt dat gegevens onjuist zijn of ten onrechte worden verwerkt, worden deze verbeterd onderscheidenlijk
      verwijderd. Onze betrokken Minister doet daarvan zo spoedig mogelijk mededeling aan hen wie hij de desbetreffende
      gegevens heeft verstrekt.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel43
  - number: '43.3'
    text: De verwijderde gegevens worden vernietigd, tenzij wettelijke regels omtrent bewaring daaraan in de weg staan.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel43
  - number: '43.4'
    text: |-
      Indien met betrekking tot de voor vernietiging in aanmerking komende gegevens een aanvraag als bedoeld in
      [artikel 47][ref1] is gedaan, wordt de vernietiging van de desbetreffende gegevens opgeschort tot ten minste het
      moment waarop op de aanvraag onherroepelijk is beslist. Voor zover de aanvraag om kennisneming is ingewilligd,
      worden de desbetreffende gegevens niet eerder vernietigd dan nadat de betrokkene van de desbetreffende gegevens
      overeenkomstig [artikel 47, tweede lid][ref2], kennis heeft kunnen nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0013409#Artikel47
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '47'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0013409
        artikel: '47'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '44.1'
    text: |-
      In afwijking van [artikel 12, eerste lid, van de Archiefwet 1995][ref1] worden slechts die archiefbescheiden,
      bedoeld in [artikel 1, aanhef, onderdeel c, onder 1°, 2° en 4°, van de Archiefwet 1995][ref2], naar een
      archiefbewaarplaats overgebracht die ouder zijn dan twintig jaar en waarvan door Onze betrokken Minister, na advies
      van de beheerder van die archiefbewaarplaats, is vastgesteld dat daaraan geen beperkingen aan de openbaarheid
      dienen te worden gesteld met het oog op het belang van de staat of van diens bondgenoten.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel1
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0007376
        artikel: '1'
  - number: '44.2'
    text: |-
      De in het eerste lid bedoelde beperkingen hebben geen betrekking op archiefbescheiden die ouder zijn dan
      vijfenzeventig jaar, tenzij Onze betrokken Minister, in overeenstemming met het gevoelen van de Ministerraad,
      anders beslist.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel44
  - number: '45'
    text: |-
      Onverminderd de kennisneming van op grond van [paragraaf 3.3][ref1]  verstrekte gegevens, kan van de gegevens
      verwerkt door of ten behoeve van een dienst slechts kennis worden genomen overeenkomstig de bepalingen van dit
      hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0013409
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '46'
    text: |-
      In dit hoofdstuk wordt onder document, bestuurlijke aangelegenheid, intern beraad, persoonlijke
      beleidsopvatting, ambtelijk of gemengd samengestelde adviescommissie verstaan, hetgeen daaronder in
      [artikel 1 van de Wet openbaarheid van bestuur][ref1] dan wel in de artikelen 1 en 12 van de Wet openbaarheid van
      bestuur BES wordt verstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel1
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '1'
  - number: '47.1'
    text: |-
      Onze betrokken Minister deelt een ieder op diens aanvraag zo spoedig mogelijk, doch uiterlijk binnen drie maanden
      mede of en, zo ja, welke hem betreffende persoonsgegevens door of ten behoeve van een dienst zijn verwerkt. Onze
      betrokken Minister kan zijn besluit voor ten hoogste vier weken verdagen. Van de verdaging wordt voor de afloop van
      de eerste termijn schriftelijk gemotiveerd mededeling gedaan aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel47
  - number: '47.2'
    text: |-
      Voor zover een aanvraag als bedoeld in het eerste lid wordt ingewilligd, stelt Onze betrokken Minister de aanvrager
      zo spoedig mogelijk, doch uiterlijk binnen vier weken na bekendmaking van zijn besluit in de gelegenheid van zijn
      gegevens kennis te nemen.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel47
  - number: '47.3'
    text: Onze betrokken Minister draagt zorg voor een deugdelijke vaststelling van de identiteit van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel47
  - number: '48.1'
    text: |-
      Degene die ingevolge [artikel 47][ref1] kennis heeft genomen van door of ten behoeve van een dienst omtrent
      hem verwerkte gegevens, kan daaromtrent een schriftelijke verklaring overleggen. Deze verklaring wordt bij de
      desbetreffende gegevens gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel47
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '47'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '48.2'
    text: |-
      Bij de kennisneming door betrokkene van de hem betreffende gegevens, wordt deze gewezen op het bepaalde in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel48
  - number: '48.3'
    text: De verklaring wordt gelijktijdig met de gegevens waarop deze betrekking heeft verwijderd en vernietigd.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel48
  - number: '49.1'
    text: |-
      In afwijking van [artikel 47][ref1] stelt het hoofd van een dienst een persoon werkzaam bij of ten behoeve van een
      dienst of werkzaam geweest bij of ten behoeve van een dienst op diens verzoek zo spoedig mogelijk, doch uiterlijk
      binnen vier weken na het verzoek, in de gelegenheid van zijn gegevens in de personeels- en salarisadministratie van
      de desbetreffende dienst kennis te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel47
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '47'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '49.2'
    text: Van inzage zijn uitgezonderd de gegevens die zicht kunnen geven op bronnen die geheim moeten worden gehouden.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel49
  - number: '49.3'
    text: |-
      Het hoofd van een dienst kan, in afwijking van [artikel 2:1, eerste lid, van de Algemene wet bestuursrecht][ref1],
      bepalen dat kennisneming van de gegevens slechts is voorbehouden aan de betrokken persoon persoonlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: '49.4'
    text: |-
      Degene die inzage heeft genomen van de hem betreffende gegevens, kan het hoofd van de dienst schriftelijk verzoeken
      deze te verbeteren, aan te vullen of te verwijderen, indien deze feitelijk onjuist zijn, voor het doel van de
      verwerking onvolledig of niet ter zake dienend zijn dan wel in strijd met een wettelijk voorschrift zijn verwerkt.
      Het verzoek behelst de aan te brengen wijzigingen.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel49
  - number: '49.5'
    text: |-
      Het hoofd van een dienst bericht de verzoeker binnen zes weken na ontvangst van het verzoek, bedoeld in het vierde
      lid, of dan wel in hoeverre hij daaraan voldoet.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel49
  - number: '49.6'
    text: |-
      [Artikel 56][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel56
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '56'
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: '50.1'
    text: |-
      [Artikel 47][ref1] is van overeenkomstige toepassing op een aanvraag met betrekking tot persoonsgegevens die zijn
      verwerkt door of ten behoeve van een dienst ten aanzien van een overleden echtgenoot, geregistreerd partner, kind
      of ouder van de aanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel47
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '47'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '50.2'
    text: 'In de aanvraag, bedoeld in het eerste lid, worden ten minste de volgende gegevens vermeld:'
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel50
  - number: 50.2.a
    text: naam en voorletters van de overledene;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel50
  - number: 50.2.b
    text: geboortedatum en geboorteplaats van de overledene;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel50
  - number: 50.2.c
    text: datum van overlijden en plaats van overlijden;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel50
  - number: 50.2.d
    text: de hoedanigheid van de overledene in relatie tot de aanvrager.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel50
  - number: '50.3'
    text: |-
      In de gevallen dat blijkt dat de aanvraag, bedoeld in het eerste lid, betrekking heeft op gegevens van een persoon
      die nog niet is overleden of op gegevens van een overleden persoon die niet de hoedanigheid van echtgenoot,
      geregistreerd partner, kind of ouder van de aanvrager heeft, wordt de aanvraag niet ontvankelijk verklaard.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel50
  - number: '51.1'
    text: |-
      Onze betrokken Minister deelt een ieder op diens aanvraag zo spoedig mogelijk, doch uiterlijk binnen drie
      maanden mede of kennis kan worden genomen van andere dan persoonsgegevens betreffende de in de aanvraag vermelde
      bestuurlijke aangelegenheid. Onze betrokken Minister kan zijn besluit voor ten hoogste vier weken verdagen. Van de
      verdaging wordt voor de afloop van de eerste termijn schriftelijk gemotiveerd mededeling gedaan aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel51
  - number: '51.2'
    text: |-
      Voor zover een aanvraag als bedoeld in het eerste lid wordt ingewilligd, stelt Onze betrokken Minister de
      aanvrager zo spoedig mogelijk doch uiterlijk binnen vier weken na bekendmaking van zijn besluit in kennis van de
      desbetreffende gegevens.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel51
  - number: '52.1'
    text: 'Onze betrokken Minister stelt de aanvrager in kennis van de desbetreffende gegevens door:'
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel52
  - number: 52.1.a
    text: |-
      het geven van een kopie van het document waarin de gegevens zijn neergelegd of door de letterlijke inhoud daarvan
      in andere vorm te verstrekken,
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel52
  - number: 52.1.b
    text: inzage van de inhoud van het desbetreffende document toe te staan,
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel52
  - number: 52.1.c
    text: een uittreksel of een samenvatting van de inhoud van het desbetreffende document te geven of
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel52
  - number: 52.1.d
    text: inlichtingen uit het desbetreffende document te verschaffen.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel52
  - number: '52.2'
    text: |-
      Bij het kiezen tussen de vormen van inkennisstelling houdt Onze betrokken Minister rekening met de voorkeur van de
      aanvrager en het belang van de dienst.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel52
  - number: '52.3'
    text: |-
      Voor het vervaardigen van kopieën van documenten en uittreksels of samenvattingen van de
      inhoud daarvan kan van de aanvrager een vergoeding worden gevraagd. De bij of krachtens
      [artikel 12 van de Wet openbaarheid van bestuur][ref1] dan wel artikel 14 van de Wet openbaarheid van bestuur BES
      gestelde regels zijn daarop van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel12
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '12'
  - number: '53.1'
    text: |-
      Een aanvraag als bedoeld in [artikel 47][ref1] wordt in ieder geval afgewezen, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel47
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '47'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 53.1.a
    text: 'betreffende de aanvrager in het kader van enig onderzoek gegevens zijn verwerkt, tenzij:'
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel53
  - number: 53.1.a.1°
    text: de desbetreffende gegevens meer dan 5 jaar geleden zijn verwerkt,
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel53
  - number: 53.1.a.2°
    text: |-
      met betrekking tot de aanvrager sindsdien geen nieuwe gegevens zijn verwerkt in verband met het onderzoek in het
      kader waarvan de desbetreffende gegevens zijn verwerkt, en
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel53
  - number: 53.1.a.3°
    text: de desbetreffende gegevens niet relevant zijn voor enig lopend onderzoek;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel53
  - number: 53.1.b
    text: betreffende de aanvrager geen gegevens zijn verwerkt.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel53
  - number: '53.2'
    text: |-
      Indien een aanvraag ingevolge het eerste lid wordt afgewezen, wordt bij de motivering van de afwijzing slechts in
      algemene termen gewezen op alle aldaar vermelde gronden voor de afwijzing.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel53
  - number: '54'
    text: |-
      [Artikel 53][ref1] is van overeenkomstige toepassing op een aanvraag als bedoeld in [artikel 50][ref2] met dien
      verstande dat in [artikel 53][ref3] voor «de aanvrager» wordt gelezen: de overleden persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0013409#Artikel50
      [ref3]: https://wetten.overheid.nl/BWBR0013409#Artikel53
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '53'
        hoofdstuk: '4'
        paragraaf: '4.5'
      - id: ref2
        bwb_id: BWBR0013409
        artikel: '50'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0013409
        artikel: '53'
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: '55.1'
    text: |-
      Een aanvraag als bedoeld in [artikel 51][ref1] wordt afgewezen, voor zover verstrekking van de gegevens waarop de
      aanvraag betrekking heeft:


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel51
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '51'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 55.1.a
    text: de eenheid van de Kroon in gevaar zou kunnen brengen;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel55
  - number: 55.1.b
    text: de nationale veiligheid zou kunnen schaden;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel55
  - number: 55.1.c
    text: |-
      bedrijfs- en fabricagegegevens betreft, die door natuurlijke personen of rechtspersonen vertrouwelijk aan de
      overheid zijn medegedeeld.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel55
  - number: '55.2'
    text: |-
      Een aanvraag wordt voorts afgewezen voor zover het belang van verstrekking van de gegevens waarop de aanvraag
      betrekking heeft, niet opweegt tegen de volgende belangen:
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel55
  - number: 55.2.a
    text: de betrekkingen van Nederland met andere landen en met internationale organisaties;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel55
  - number: 55.2.b
    text: de economische of financiële belangen van de staat, de andere publiekrechtelijke lichamen of bestuursorganen;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel55
  - number: 55.2.c
    text: de opsporing en vervolging van strafbare feiten;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel55
  - number: 55.2.d
    text: inspectie, controle en toezicht door of vanwege bestuursorganen;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel55
  - number: 55.2.e
    text: de eerbiediging van de persoonlijke levenssfeer;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel55
  - number: 55.2.f
    text: |-
      het belang, dat de persoon of organisatie waarop de gegevens betrekking hebben erbij heeft om als eerste kennis te
      kunnen nemen van de gegevens;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel55
  - number: 55.2.g
    text: |-
      het voorkomen van onevenredige bevoordeling of benadeling van bij de aangelegenheid betrokken natuurlijke personen
      of rechtspersonen dan wel derden.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel55
  - number: '55.3'
    text: |-
      Indien een aanvraag tot kennisneming wordt afgewezen wordt de commissie van toezicht hiervan op de hoogte gesteld.
      De mededeling aan de commissie gaat vergezeld van een motivering waarom het verzoek is afgewezen.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel55
  - number: '55.4'
    text: |-
      De voorgaande leden zijn van overeenkomstige toepassing op een aanvraag als bedoeld in [artikel 47][ref1]
      onderscheidenlijk [50][ref2], voor zover een dergelijke aanvraag niet wordt afgewezen ingevolge [artikel 53][ref3]
      onderscheidenlijk [54][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0013409#Artikel50
      [ref3]: https://wetten.overheid.nl/BWBR0013409#Artikel53
      [ref4]: https://wetten.overheid.nl/BWBR0013409#Artikel54
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '47'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0013409
        artikel: '50'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0013409
        artikel: '53'
        hoofdstuk: '4'
        paragraaf: '4.5'
      - id: ref4
        bwb_id: BWBR0013409
        artikel: '54'
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: '56.1'
    text: |-
      In het geval dat de aanvraag betrekking heeft op gegevens vervat in documenten, opgesteld ten behoeve van intern
      beraad, worden geen gegevens verstrekt over daarin opgenomen persoonlijke beleidsopvattingen.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel56
  - number: '56.2'
    text: |-
      Over persoonlijke beleidsopvattingen kunnen met het oog op een goede en democratische bestuursvoering gegevens
      worden verstrekt in niet tot personen herleidbare vorm. Indien degene die deze opvattingen heeft geuit of zich
      erachter heeft gesteld, daarmee heeft ingestemd, kunnen de gegevens in tot personen herleidbare vorm worden
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel56
  - number: '56.3'
    text: |-
      Met betrekking tot adviezen van een ambtelijke of gemengd samengestelde adviescommissie kan het verstrekken van
      gegevens over de daarin opgenomen persoonlijke beleidsopvattingen plaatsvinden, indien het voornemen daartoe
      door het bestuursorgaan dat het rechtstreeks aangaat aan de leden van de adviescommissie voor de aanvang van hun
      werkzaamheden kenbaar is gemaakt.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel56
  - number: '58.1'
    text: |-
      De Algemene Inlichtingen- en Veiligheidsdienst en de Militaire Inlichtingen- en Veiligheidsdienst verlenen elkaar
      zoveel mogelijk medewerking.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel58
  - number: '58.2'
    text: 'De medewerking, bedoeld in het eerste lid, bestaat in ieder geval uit:'
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel58
  - number: 58.2.a
    text: de verstrekking van gegevens;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel58
  - number: 58.2.b
    text: |-
      het verlenen van technische en andere vormen van ondersteuning in het kader van de toepassing van bijzondere
      bevoegdheden als bedoeld in paragraaf 3.2.2.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel58
  - number: '58.3'
    text: |-
      Een verzoek om medewerking als bedoeld in het tweede lid, onder b, wordt ondertekend door Onze betrokken Minister
      en omvat een nauwkeurige omschrijving van de verlangde werkzaamheden. Onze betrokken Minister die om de medewerking
      heeft verzocht, is verantwoordelijk voor de feitelijke uitvoering van de te verrichten werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel58
  - number: '59.1'
    text: |-
      De hoofden van de diensten dragen zorg voor het onderhouden van verbindingen met daarvoor in aanmerking komende
      inlichtingen- en veiligheidsdiensten van andere landen.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel59
  - number: '59.2'
    text: |-
      In het kader van het onderhouden van verbindingen als bedoeld in het eerste lid kunnen aan deze instanties gegevens
      worden verstrekt ten behoeve van door deze instanties te behartigen belangen, voor zover:
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel59
  - number: 59.2.a
    text: deze belangen niet onverenigbaar zijn met de belangen die de diensten hebben te behartigen, en
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel59
  - number: 59.2.b
    text: een goede taakuitvoering door de diensten zich niet tegen verstrekking verzet.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel59
  - number: '59.3'
    text: |-
      Op de verstrekking van gegevens als bedoeld in het tweede lid, zijn [de artikelen 37][ref1], [41][ref2] en
      [42][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0013409#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0013409#Artikel42
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0013409
        artikel: '41'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref3
        bwb_id: BWBR0013409
        artikel: '42'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '59.4'
    text: |-
      In het kader van het onderhouden van verbindingen als bedoeld in het eerste lid kunnen voorts op een daartoe
      strekkend schriftelijk verzoek aan deze instanties technische en andere vormen van ondersteuning worden verleend
      ten behoeve van door deze instanties te behartigen belangen, voor zover:
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel59
  - number: 59.4.a
    text: deze belangen niet onverenigbaar zijn met de belangen die de diensten hebben te behartigen, en
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel59
  - number: 59.4.b
    text: |-
      een goede taakuitvoering door de diensten zich niet tegen de verlening van de desbetreffende vorm van ondersteuning
      verzet.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel59
  - number: '59.5'
    text: |-
      Een verzoek om ondersteuning als bedoeld in het vierde lid dient ondertekend te zijn door de daartoe bevoegde
      autoriteit van deze instantie en omvat een nauwkeurige omschrijving van de verlangde vorm van ondersteuning alsmede
      de reden waarom de ondersteuning wenselijk wordt geacht. De verzochte ondersteuning wordt slechts verleend, indien
      daarvoor toestemming is verkregen van Onze betrokken Minister.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel59
  - number: '59.6'
    text: |-
      Onze betrokken Minister kan de bevoegdheid tot het verlenen van toestemming als bedoeld in het vijfde lid
      uitsluitend mandateren aan het hoofd van de dienst, voor zover het gaat om verzoeken met een spoedeisend karakter.
      Van een verleende toestemming door het hoofd van de dienst wordt Onze betrokken Minister terstond geïnformeerd.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel59
  - number: '60.1'
    text: |-
      De korpschef, de politiechef van een regionale eenheid, de commandant van de Koninklijke marechaussee, de
      directeur-generaal van de rijksbelastingdienst van het Ministerie van Financiën verrichten werkzaamheden ten
      behoeve van de Algemene Inlichtingen- en Veiligheidsdienst.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel60
  - number: '60.2'
    text: |-
      Onze Ministers onder wie de in het eerste lid genoemde ambtenaren ressorteren, onderscheidenlijk de korpschef en de
      korpsbeheerder van het politiekorps van Bonaire, Sint Eustatius en Saba wijzen in overeenstemming met Onze Minister
      van Binnenlandse Zaken en Koninkrijksrelaties ondergeschikten van deze ambtenaren aan tot de feitelijke uitvoering
      van en het toezicht op de aldaar bedoelde werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel60
  - number: '60.3'
    text: |-
      De in dit artikel bedoelde werkzaamheden worden verricht onder verantwoordelijkheid van Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties en overeenkomstig de aanwijzingen van het hoofd van de Algemene
      Inlichtingen- en Veiligheidsdienst.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel60
  - number: '60.4'
    text: |-
      Met betrekking tot het optreden van ambtenaren van politie ter uitvoering van de in dit artikel bedoelde
      werkzaamheden blijft [hoofdstuk 7 van de Politiewet 2012][ref1] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0031788
        hoofdstuk: '7'
  - number: '61.1'
    text: |-
      De leden van het openbaar ministerie doen, door tussenkomst van het College van procureurs-generaal dan wel, voor
      zover van toepassing, de procureur-generaal, bedoeld in de rijkswet openbare ministeries van Curaçao, van Sint
      Maarten en van Bonaire, Sint Eustatius en Saba, mededeling van de te hunner kennis gekomen gegevens die zij voor
      een dienst van belang achten, aan die dienst.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel61
  - number: '61.2'
    text: |-
      Steeds wanneer de vervulling van de taak van het openbaar ministerie en van een dienst daartoe aanleiding geeft,
      plegen een lid van het College van procureurs-generaal dan wel, voor zover van toepassing, de procureur-generaal,
      bedoeld in de rijkswet openbare ministeries van Curaçao, van Sint Maarten en van Bonaire, Sint Eustatius en Saba en
      het hoofd van de betrokken dienst overleg.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel61
  - number: '62'
    text: |-
      De ambtenaren van politie, de ambtenaren van de rijksbelastingdienst, bevoegd inzake de douane en de ambtenaren
      van de Koninklijke marechaussee doen mededeling van de te hunner kennis gekomen gegevens die voor een dienst van
      belang kunnen zijn, aan de in [artikel 60, eerste lid][ref1], bedoelde ambtenaar aan wie zij ondergeschikt zijn. In
      afwijking van de eerste zin vindt de mededeling van ambtenaren van politie die zijn tewerkgesteld bij een regionale
      eenheid plaats aan de politiechef van de desbetreffende regionale eenheid. De in artikel 60, eerste lid, bedoelde
      ambtenaar waaraan de mededeling is gedaan, zendt de gegevens aan die dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel60
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '60'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '63.1'
    text: |-
      De diensten zijn bevoegd op schriftelijk verzoek van het daartoe bevoegde gezag tot het verlenen van technische
      ondersteuning aan de met opsporing van strafbare feiten belaste instanties. [Artikel 58, derde lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel58
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '58'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '63.2'
    text: |-
      Onze betrokken Minister is bevoegd zich te wenden tot Onze Minister van Veiligheid en Justitie met het
      schriftelijke verzoek tot het verlenen van technische ondersteuning aan de betrokken dienst bij de uitvoering
      van diens taak door een of meerdere landelijke eenheden van de politie. [Artikel 58, derde lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel58
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '58'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '64.1'
    text: Er is een commissie van toezicht betreffende de inlichtingen- en veiligheidsdiensten.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel64
  - number: '64.2'
    text: 'De commissie van toezicht is belast met:'
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel64
  - number: 64.2.a
    text: |-
      het toezicht op de rechtmatigheid van de uitvoering van hetgeen bij of krachtens deze wet en de
      [Wet veiligheidsonderzoeken][ref1] is gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0008277
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0008277
  - number: 64.2.b
    text: |-
      het gevraagd en ongevraagd inlichten en adviseren van Onze betrokken Ministers aangaande de door de commissie
      geconstateerde bevindingen. Desgewenst kan de commissie onze betrokken Ministers vragen deze inlichtingen en
      adviezen ter kennis van een of beide kamers der Staten-Generaal te brengen, waarbij de werkwijze zoals beschreven
      in [artikel 79][ref1] van overeenkomstige toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel79
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '79'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 64.2.c
    text: het adviseren van Onze betrokken Ministers terzake van het onderzoeken en beoordelen van klachten;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel64
  - number: 64.2.d
    text: |-
      het ongevraagd adviseren van Onze betrokken Ministers terzake van de uitvoering van [artikel 34][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel34
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 64.2.e
    text: |-
      het toezicht op de toepassing van de bevoegdheid van
      [artikel 14, vierde lid, van de Rijkswet op het Nederlanderschap][ref1] door Onze Minister van Veiligheid en
      Justitie, waarbij in het bijzonder aandacht wordt geschonken aan de doelmatigheid en proportionaliteit van de
      toepassing van deze bevoegdheid.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel14
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '14'
  - number: '65.1'
    text: De commissie van toezicht bestaat uit drie leden, onder wie de voorzitter.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel65
  - number: '65.2'
    text: |-
      De leden worden benoemd bij koninklijk besluit op voordracht van Onze betrokken Ministers gezamenlijk voor een
      tijdvak van zes jaar en kunnen slechts eenmaal worden herbenoemd. Voor de benoeming van de leden wordt door de
      Tweede Kamer der Staten-Generaal per vacature een voordracht van drie personen gedaan waaruit Onze betrokken
      Ministers een keuze maken. Bij haar voordracht slaat de Tweede Kamer zodanig acht als haar dienstig voorkomt op
      een door de vice-president van de Raad van State, de president van de Hoge Raad der Nederlanden en de Nationale
      ombudsman gezamenlijk opgemaakte aanbevelingslijst van ten minste drie kandidaten per vacature.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel65
  - number: '65.3'
    text: Onze betrokken Ministers kunnen de Tweede Kamer verzoeken een nieuwe voordracht te doen.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel65
  - number: '65.4'
    text: |-
      Aan ten minste twee van de drie leden, onder wie de voorzitter, dient door een universiteit dan wel de Open
      Universiteit waarop de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] betrekking heeft, de
      graad Bachelor op het gebied van het recht en tevens de graad Master op het gebied van het recht te zijn verleend,
      dan wel dienen ten minste twee van de drie leden, onder wie de voorzitter, aan een universiteit dan wel de Open
      Universiteit waarop de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2] betrekking heeft, het
      doctoraat in de rechtsgeleerdheid of het recht om de titel meester te voeren te hebben verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0005682
      - id: ref2
        bwb_id: BWBR0005682
  - number: '65.5'
    text: |-
      Alvorens hun ambt te aanvaarden leggen de leden in handen van de Minister-President, Minister van Algemene Zaken,
      af:
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel65
  - number: 65.5.a
    text: |-
      de eed of verklaring en belofte dat zij tot het verkrijgen van hun benoeming rechtstreeks noch middellijk, onder
      welke naam of onder welk voorwendsel ook, aan iemand iets hebben gegeven of beloofd, alsmede dat zij om iets in hun
      ambt te doen of te laten rechtstreeks noch middellijk van iemand enig geschenk of enige belofte hebben aangenomen
      of zullen aannemen;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel65
  - number: 65.5.b
    text: |-
      de eed of belofte van trouw aan de [Grondwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '65.6'
    text: De leden dienen de Nederlandse nationaliteit te bezitten.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel65
  - number: '65.7'
    text: |-
      De leden vervullen geen betrekkingen waarvan de uitoefening ongewenst is met het oog op een goede vervulling van
      hun functie of op de handhaving van hun onpartijdigheid en onafhankelijkheid of van het vertrouwen daarin.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel65
  - number: '65.8'
    text: De betrekkingen van de leden worden door de voorzitter openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel65
  - number: '66'
    text: |-
      Aan de leden van de commissie van toezicht wordt bij koninklijk besluit, op voordracht van Onze betrokken Ministers
      gezamenlijk, ontslag verleend:
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel66
  - number: 66.a
    text: op verzoek van de betrokkene;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel66
  - number: 66.b
    text: wanneer de betrokkene uit hoofde van ziekten of gebreken blijvend ongeschikt is zijn functie te vervullen;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel66
  - number: 66.c
    text: |-
      bij de aanvaarding van een betrekking als bedoeld in [artikel 65, zevende lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel65
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '65'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 66.d
    text: bij het verlies van Nederlanderschap;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel66
  - number: 66.e
    text: |-
      wanneer betrokkene bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem
      bij zulk een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel66
  - number: 66.f
    text: |-
      wanneer betrokkene ingevolge onherroepelijk geworden rechterlijke uitspraak onder curatele is gesteld, in staat van
      faillissement is verklaard, surseance van betaling heeft verkregen of wegens schulden is gegijzeld;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel66
  - number: 66.g
    text: |-
      wanneer naar het oordeel van Onze betrokken Ministers gezamenlijk, gehoord de Tweede Kamer der Staten-Generaal,
      betrokkene door handelen of nalaten ernstig nadeel toebrengt aan het in hem te stellen vertrouwen.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel66
  - number: '67.1'
    text: |-
      Door Onze betrokken Ministers gezamenlijk wordt een lid van de commissie van toezicht op non-actief gesteld,
      ingeval:
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel67
  - number: 67.1.a
    text: hij zich in voorlopige hechtenis bevindt;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel67
  - number: 67.1.b
    text: |-
      hij bij een nog niet onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem bij
      zulk een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel67
  - number: 67.1.c
    text: |-
      hij onder curatele is gesteld, in staat van faillissement is verklaard, surseance van betaling heeft verkregen of
      wegens schulden is gegijzeld ingevolge een nog niet onherroepelijk geworden rechterlijke uitspraak.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel67
  - number: '67.2'
    text: |-
      Door Onze betrokken Ministers gezamenlijk kan een lid van de commissie op non-actief worden gesteld, indien hij
      wordt vervolgd wegens een misdrijf of indien er een ander ernstig vermoeden is voor het bestaan van feiten of
      omstandigheden die tot ontslag, anders dan op gronden vermeld in [artikel 66, onder b][ref1], zouden kunnen leiden.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel66
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '66'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '67.3'
    text: |-
      In het geval, bedoeld in het tweede lid, eindigt de non-activiteit na drie maanden. Door Onze betrokken Ministers
      gezamenlijk kan de non-activiteit telkens met ten hoogste drie maanden worden verlengd. De non-activiteit wordt
      door Onze betrokken Ministers gezamenlijk beëindigd zodra de grond voor non-activiteit is vervallen.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel67
  - number: '68'
    text: |-
      Bij algemene maatregel van bestuur worden de bezoldiging, de aanspraken in geval van ziekte, alsmede de overige
      rechten en plichten die betrekking hebben op de rechtspositie van de leden van de commissie van toezicht geregeld,
      voor zover daarin niet bij de wet is voorzien.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel68
  - number: '69.1'
    text: De commissie van toezicht beschikt te harer ondersteuning over een secretariaat.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel69
  - number: '69.2'
    text: |-
      De tot het secretariaat behorende personen worden bij koninklijk besluit op voordracht van Onze betrokken Ministers
      gezamenlijk, op aanbeveling van de voorzitter van de commissie benoemd, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel69
  - number: '69.3'
    text: |-
      Bij koninklijk besluit op voordracht van Onze betrokken Ministers gezamenlijk, kan worden bepaald in welke gevallen
      de tot het secretariaat behorende personen door de voorzitter van de commissie kunnen worden benoemd, geschorst
      en ontslagen.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel69
  - number: '70'
    text: |-
      Op de leden van de commissie van toezicht alsmede de tot het secretariaat behorende personen is
      [artikel 10, eerste en tweede lid][ref1], van overeenkomstige toepassing, met dien verstande dat de ontheffing,
      bedoeld in [het tweede lid][ref2], wordt verleend door Onze Minister-President, Minister van Algemene Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0013409#Artikel10
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0013409
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '71'
    text: |-
      De commissie van toezicht stelt voor haar werkzaamheden een reglement van orde op. Dit reglement wordt in de
      Staatscourant geplaatst.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel71
  - number: '72'
    text: De vergaderingen van de commissie van toezicht zijn niet openbaar.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel72
  - number: '73.1'
    text: |-
      Onze betrokken Ministers, de hoofden van de diensten, de coördinator en voorts een ieder die betrokken is bij
      de uitvoering van deze wet en de [Wet veiligheidsonderzoeken][ref1] verstrekken desgevraagd aan de commissie van
      toezicht alle inlichtingen en verlenen haar alle overige medewerking die zij voor een goede uitoefening van haar
      taak noodzakelijk acht. De commissie van toezicht wordt desgevraagd rechtstreekse toegang verleend tot de in het
      kader van de uitvoering van deze wet en de [Wet veiligheidsonderzoeken][ref2] verwerkte gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0008277
      [ref2]: https://wetten.overheid.nl/BWBR0008277
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0008277
      - id: ref2
        bwb_id: BWBR0008277
  - number: '73.2'
    text: |-
      Bij de verstrekking van inlichtingen als bedoeld in het eerste lid wordt, indien daartoe aanleiding bestaat,
      aangegeven welke inlichtingen in het belang van de nationale veiligheid ter uitsluitende kennisneming van de
      commissie van toezicht dienen te blijven.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel73
  - number: '74.1'
    text: |-
      De commissie van toezicht kan, indien zij dat voor een goede uitoefening van haar taak noodzakelijk acht,
      de personen, bedoeld in [artikel 73, eerste lid][ref1], en andere personen als getuige of als deskundige om
      inlichtingen verzoeken en deze oproepen om voor haar te verschijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel73
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '73'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '74.2'
    text: |-
      Het verzoek geschiedt schriftelijk en vermeldt zo veel als mogelijk de feiten waaromtrent door de getuige of de
      deskundige inlichtingen dienen te worden verstrekt. Indien de getuige of de deskundige is opgeroepen om voor de
      commissie te verschijnen, vermeldt het verzoek tevens de plaats en het tijdstip waarop deze zal worden gehoord en
      de gevolgen die zijn verbonden aan het niet verschijnen. De oproeping om te verschijnen geschiedt bij aangetekende
      brief of bij brief met ontvangstbevestiging.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel74
  - number: '74.3'
    text: |-
      De getuige of de deskundige is verplicht alle inlichtingen te verschaffen die de commissie van toezicht voor een
      goede taakuitoefening noodzakelijk acht en daartoe, indien de commissie van toezicht dat in haar verzoek heeft
      aangegeven, in persoon te verschijnen. De opgeroepene kan zich laten bijstaan door een raadsman.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel74
  - number: '74.4'
    text: |-
      De verplichting om voor de commissie te verschijnen geldt niet voor Onze betrokken Ministers. Wanneer een minister
      niet verschijnt, laat hij zich vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel74
  - number: '74.5'
    text: |-
      Indien een ambtenaar die betrokken is bij de uitvoering van deze wet ingevolge dit artikel als getuige of als
      deskundige optreedt is [artikel 86, tweede lid][ref1], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel86
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '86'
        hoofdstuk: '7'
  - number: '74.6'
    text: |-
      De commissie van toezicht kan bevelen dat personen die, hoewel wettelijk opgeroepen, niet zijn verschenen, door de
      openbare macht voor haar worden gebracht om aan hun verplichtingen te voldoen.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel74
  - number: '74.7'
    text: |-
      De getuige of de deskundige kan zich van het verstrekken van inlichtingen verschonen wegens ambts- of
      beroepsgeheim, doch alleen voor zover het inlichtingen betreft waarvan de wetenschap aan hem als zodanig is
      toevertrouwd.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel74
  - number: '75.1'
    text: |-
      De commissie van toezicht kan bevelen, dat getuigen niet zullen worden gehoord dan na het afleggen van de eed
      of belofte. De getuige legt in dat geval in handen van de voorzitter van de commissie van toezicht de eed of de
      belofte af, dat hij zal zeggen de gehele waarheid en niets dan de waarheid.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel75
  - number: '75.2'
    text: De deskundigen zijn verplicht hun taak onpartijdig en naar beste weten te verrichten.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel75
  - number: '76.1'
    text: |-
      De commissie van toezicht is bevoegd om, indien een goede taakuitvoering dat noodzakelijk maakt, bepaalde
      werkzaamheden aan deskundigen op te dragen.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel76
  - number: '76.2'
    text: |-
      De deskundige die zijn opdracht heeft aanvaard, is verplicht zijn taak onpartijdig en naar beste weten te
      verrichten.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel76
  - number: '77'
    text: |-
      De commissie van toezicht dan wel een daartoe door haar aangewezen lid is bevoegd alle plaatsen te betreden, met
      uitzondering van een woning zonder toestemming van de bewoner, voor zover dat voor de vervulling van haar taak
      redelijkerwijs nodig is. De commissie dan wel het aangewezen lid kan zich daarbij doen vergezellen van door de
      voorzitter aangewezen personen van het secretariaat, bedoeld in [artikel 69][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel69
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '69'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '78.1'
    text: |-
      In het kader van haar toezichthoudende taak, bedoeld in [artikel 64, tweede lid, onder a][ref1], is de commissie
      van toezicht bevoegd tot het verrichten van onderzoek naar de wijze waarop hetgeen bij of krachtens deze wet of de
      [Wet veiligheidsonderzoeken][ref2] is gesteld, is uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0008277
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '64'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0008277
  - number: '78.2'
    text: |-
      De commissie van toezicht kan voorts een onderzoek als bedoeld in het eerste lid verrichten op een daartoe
      strekkend verzoek van elk van de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel78
  - number: '78.3'
    text: |-
      Aan Onze betrokken Minister alsmede een of beide kamers der Staten-Generaal wordt van een voorgenomen onderzoek, zo
      nodig vertrouwelijk, mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel78
  - number: '79.1'
    text: |-
      De commissie van toezicht stelt naar aanleiding van het door haar verrichte onderzoek een toezichtsrapport op. Het
      toezichtsrapport is openbaar, met uitzondering van gegevens als bedoeld in [artikel 8, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel8
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '79.2'
    text: |-
      Alvorens het toezichtsrapport vast te stellen, stelt de commissie van toezicht Onze betrokken Minister in de
      gelegenheid binnen een door de commissie gestelde redelijke termijn op de in het toezichtsrapport opgenomen
      bevindingen te reageren.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel79
  - number: '79.3'
    text: |-
      Na ontvangst van de reactie van Onze betrokken Minister stelt de commissie van toezicht het toezichtsrapport
      vast. Zij kan naar aanleiding van haar bevindingen Onze betrokken Minister aanbevelingen doen met betrekking tot
      eventueel te treffen maatregelen.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel79
  - number: '79.4'
    text: Het toezichtsrapport wordt na vaststelling door de commissie van toezicht gezonden aan Onze betrokken Minister.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel79
  - number: '79.5'
    text: |-
      Onze betrokken Minister zendt het toezichtsrapport alsmede zijn reactie daarop binnen zes weken aan de beide
      kamers der Staten-Generaal. Vermelding van in ieder geval de gegevens, bedoeld in [artikel 8, derde lid][ref1],
      blijft daarbij achterwege. Deze gegevens kunnen ter vertrouwelijke kennisneming aan een of beide kamers der Staten-
      Generaal worden medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel8
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '80.1'
    text: |-
      De commissie van toezicht brengt jaarlijks voor 1 mei een openbaar verslag uit van haar werkzaamheden. Het verslag
      wordt aangeboden aan beide kamers der Staten-Generaal en aan Onze betrokken Ministers. Artikel 8, derde en vierde
      lid, zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel80
  - number: '80.2'
    text: Het openbare jaarverslag wordt algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel80
  - number: '81.1'
    text: |-
      Gegevens die door Onze betrokken Ministers, de hoofden van de diensten, de coördinator en andere bij de uitvoering
      van deze wet en de [Wet veiligheidsonderzoeken][ref1] betrokken ambtenaren ten behoeve van de taakuitoefening door
      de commissie van toezicht daaraan zijn verstrekt en aldaar berusten, zijn niet openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0008277
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0008277
  - number: '81.2'
    text: Verzoeken om kennisneming of openbaarmaking van deze gegevens worden geweigerd.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel81
  - number: '81.3'
    text: |-
      [Artikel 44][ref1] is van overeenkomstige toepassing op de archiefbescheiden die berusten bij de commissie van
      toezicht, met dien verstande dat voor Onze betrokken Minister wordt gelezen: Onze betrokken Minister wie het
      aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel44
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '44'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '82'
    text: |-
      [De artikelen 15][ref1] en [16][ref2] zijn van overeenkomstige toepassing op de commissie van toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0013409#Artikel16
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0013409
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '83.1'
    text: |-
      Een ieder heeft het recht bij de Nationale ombudsman een klacht in te dienen over het optreden of het vermeende
      optreden van Onze betrokken Ministers, de hoofden van de diensten, de coördinator, en de voor de diensten en
      de coördinator werkzame personen jegens een natuurlijke of rechtspersoon ter uitvoering van deze wet of de
      [Wet veiligheidsonderzoeken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008277
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0008277
  - number: '83.2'
    text: |-
      Alvorens een klacht in te dienen bij de Nationale ombudsman, stelt de klager Onze betrokken Minister wie het
      aangaat in kennis van de klacht en stelt hij deze in de gelegenheid diens zienswijze daarop te geven.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel83
  - number: '83.3'
    text: |-
      Onze betrokken Minister wint, alvorens zijn zienswijze als bedoeld in het tweede lid te geven, omtrent de klacht
      het advies in van de commissie van toezicht. [Afdeling 9.1.3 van de Algemene wet bestuursrecht][ref1] is van
      toepassing. In afwijking van [artikel 9:14, tweede lid, van de Algemene wet bestuursrecht][ref2] kan Onze betrokken
      Minister geen instructies geven aan de commissie van toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling9.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 9.1.3
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '9'
  - number: '83.4'
    text: |-
      In klachtprocedures waarbij Onze betrokken Minister, onder zijn verantwoordelijkheid werkzame personen of
      de commissie van toezicht ingevolge [artikel 9:31 van de Algemene wet bestuursrecht][ref1] worden verplicht
      tot het verstrekken van inlichtingen of het overleggen van stukken aan de Nationale ombudsman, blijft
      [artikel 9:31, vijfde en zesde lid, van die wet][ref2] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '9'
  - number: '83.5'
    text: |-
      Indien Onze betrokken Minister, onder zijn verantwoordelijkheid werkzame personen of de commissie van toezicht
      worden verplicht tot het overleggen van stukken, kan worden volstaan met het ter inzage geven van de desbetreffende
      stukken. Van de desbetreffende stukken mag op generlei wijze een afschrift worden vervaardigd.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel83
  - number: '84.1'
    text: |-
      De Nationale ombudsman deelt zijn oordeel omtrent de klacht schriftelijk en, voor zover de veiligheid dan wel
      andere gewichtige belangen van de staat zich daartegen niet verzetten, met redenen omkleed aan de klager mede.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel84
  - number: '84.2'
    text: |-
      De Nationale ombudsman deelt zijn oordeel omtrent de klacht schriftelijk mede aan Onze betrokken Minister. De
      Nationale ombudsman kan bij die mededeling met redenen omkleed de aanbevelingen doen die hij dienstig oordeelt. De
      Nationale ombudsman kan, indien de strekking van de aanbevelingen daartoe naar zijn oordeel aanleiding geeft, die
      ook aan de klager mededelen.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel84
  - number: '84.3'
    text: |-
      Onze betrokken Minister stelt de Nationale ombudsman binnen zes weken schriftelijk op de hoogte van de gevolgen die
      hij aan het oordeel alsmede aan de aanbevelingen verbindt.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel84
  - number: '84.4'
    text: |-
      Onze betrokken Minister zendt het oordeel van de Nationale ombudsman, diens aanbevelingen, alsmede de door Onze
      betrokken Minister daaraan te verbinden gevolgen aan een of beide kamers der Staten-Generaal. Vermelding van in
      ieder geval de gegevens, bedoeld in [artikel 8, derde lid][ref1], blijft daarbij achterwege. Deze gegevens kunnen
      ter vertrouwelijke kennisneming aan een of beide kamers der Staten-Generaal worden medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel8
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '85.1'
    text: |-
      Onverminderd de [artikelen 98 tot en met 98c van het Wetboek van Strafrecht][ref1] dan wel de artikelen 104 tot
      en met 104c van het Wetboek van Strafrecht BES, is een ieder die betrokken is bij de uitvoering van deze wet en
      daarbij de beschikking krijgt over gegevens waarvan hij het vertrouwelijke karakter kent of redelijkerwijs moet
      vermoeden, verplicht tot geheimhouding daarvan behoudens voor zover enig wettelijk voorschrift hem tot bekendmaking
      verplicht. Deze verplichting duurt voort, nadat het betrokken zijn bij de uitvoering van deze wet is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel98
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '98'
  - number: '85.2'
    text: |-
      [Artikel 272, tweede lid, van het Wetboek van Strafrecht][ref1] dan wel artikel 285, tweede lid, van het Wetboek
      van Strafrecht BES is niet van toepassing in geval van handelen of nalaten in strijd met de in het eerste lid
      omschreven verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel272
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '272'
  - number: '86.1'
    text: |-
      De verplichting tot geheimhouding van een ambtenaar die betrokken is bij de uitvoering van deze wet, geldt niet
      tegenover hem aan wie de ambtenaar middellijk of onmiddellijk ondergeschikt is, noch in zover hij door een boven
      hem gestelde van die verplichting is ontslagen.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel86
  - number: '86.2'
    text: |-
      De ambtenaar, bedoeld in het eerste lid, die krachtens een wettelijke bepaling verplicht wordt als getuige of
      deskundige op te treden, legt slechts een verklaring af omtrent datgene waartoe zijn verplichting tot geheimhouding
      zich uitstrekt, voor zover Onze betrokken Minister en Onze Minister van Veiligheid en Justitie gezamenlijk hem
      daartoe schriftelijk van de verplichting hebben ontheven. Daarbij wordt voor ambtenaren die in hun functie kennis
      hebben gekregen van gegevens die krachtens [artikel 36, eerste lid, onder a en b][ref1], door een dienst zijn
      verstrekt als: «Onze betrokken Minister» aangemerkt: Onze Minister onder wie de dienst ressorteert die de gegevens
      heeft verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel36
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '86.3'
    text: |-
      [Dit artikel][ref1] is van overeenkomstige toepassing in het geval dat het betrokken zijn bij de uitvoering van
      deze wet is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel86
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '86'
        hoofdstuk: '7'
  - number: '87.1'
    text: |-
      In bestuursrechtelijke procedures inzake de toepassing van deze wet of de Wet veiligheidsonderzoeken waarbij
      Onze betrokken Minister of de commissie van toezicht door de rechtbank onderscheidenlijk het Gerecht of
      het Hof ingevolge [artikel 8:27][ref1], [8:28][ref2] of [8:45 van de Algemene wet bestuursrecht][ref3]
      onderscheidenlijk artikel 23, 28 en 29 van de Wet administratieve rechtspraak BES wordt
      verplicht tot het verstrekken van inlichtingen dan wel het overleggen van stukken, blijft
      [artikel 8:29, derde tot en met vijfde lid, van de Algemene wet bestuursrecht][ref4] onderscheidenlijk artikel
      24, derde tot en met vijfde lid, van de Wet administratieve rechtspraak BES buiten toepassing. Indien Onze
      betrokken Minister of de commissie van toezicht de rechtbank onderscheidenlijk het Gerecht of het Hof meedeelt dat
      uitsluitend zij kennis zal mogen nemen van de inlichtingen onderscheidenlijk de stukken, kan de rechtbank slechts
      met toestemming van de andere partijen mede op grondslag van die inlichtingen of stukken uitspraak doen. Indien
      Onze betrokken Minister of de commissie van toezicht het verstrekken van inlichtingen of het overleggen van stukken
      weigert kan de rechtbank onderscheidenlijk het Gerecht of het Hof daaruit de gevolgtrekkingen maken die hen geraden
      voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '87.2'
    text: |-
      Indien door Onze betrokken Minister of de commissie van toezicht aan de rechtbank onderscheidenlijk het Gerecht
      of het Hof stukken dienen te worden overgelegd, kan worden volstaan met het ter inzage geven van de desbetreffende
      stukken. Van de desbetreffende stukken mag op generlei wijze een afschrift worden vervaardigd.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel87
  - number: '88'
    text: |-
      Indien ten behoeve van de beslissing op een tegen een besluit van Onze betrokken Minister ingediend bezwaarschrift,
      een adviescommissie als bedoeld in [artikel 7:13 van de Algemene wet bestuursrecht][ref1] is ingesteld, komt aan
      die commissie niet de bevoegdheid, bedoeld in [artikel 7:13, vierde lid, van de Algemene wet bestuursrecht][ref2]
      toe, voor zover deze betrekking heeft op de beslissing over de toepassing van
      [artikel 7:4, zesde lid, van de Algemene wet bestuursrecht][ref3]. De uitoefening van deze bevoegdheid blijft
      voorbehouden aan Onze betrokken Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel7
