preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging hebben genomen, dat het wenselijk is nieuwe regels te stellen betreffende de diensten
    die belast zijn met het verrichten van onderzoeken en het bevorderen van maatregelen in het belang van de
    staatsveiligheid alsmede van andere gewichtige belangen van de staat, de verwerking van gegevens door deze
    diensten, de inzage in de door deze diensten verwerkte gegevens, het toezicht en de behandeling van klachten,
    alsmede in verband daarmee enkele wetten te wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel1
  - number: 1.a
    text: 'dienst: de Algemene Inlichtingen- en Veiligheidsdienst of de Militaire Inlichtingen- en Veiligheidsdienst;'
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel1
  - number: 1.b
    text: |-
      coördinator: de functionaris, bedoeld in [artikel 4][ref1];


