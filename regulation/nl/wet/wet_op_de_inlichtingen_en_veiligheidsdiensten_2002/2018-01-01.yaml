  - number: '91'
    text: |-
      De [Algemene wet bestuursrecht][ref1] dan wel het van toepassing zijnde bestuursrecht in de openbare
      lichamen Bonaire, Sint Eustatius en Saba, waaronder in ieder geval het recht dat voorziet in de
      verplichting tot bekendmaking van besluiten alsmede in de mogelijkheid van bezwaar en beroep daartegen,
      is niet van toepassing op de voorbereiding, totstandkoming en tenuitvoerlegging van besluiten op grond
      van [artikel 6, tweede lid, onder d en e][ref2], [artikel 7, tweede lid, onder e en f][ref3], op grond
      van de [hoofdstukken 3][ref4] en [5][ref5] in het kader van de uitvoering van de taken, bedoeld in
      artikel 6, tweede lid, onder a, c, d en e, en artikel 7, tweede lid, onder a, c, d, e en f, alsmede
      [artikel 86, tweede lid, eerste volzin][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0013409#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0013409#Artikel7
