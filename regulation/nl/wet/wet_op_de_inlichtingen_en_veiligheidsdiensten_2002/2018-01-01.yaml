    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel6a
  - number: 6a.1.e
    text: de politie; of
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel6a
  - number: 6a.1.f
    text: het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0013409/2018-01-01#Artikel6a
  - number: 6a.2
    text: |-
      De Algemene Inlichtingen- en Veiligheidsdienst is slechts bevoegd gegevens te verzamelen ten behoeve van het
      opstellen van de dreigings- en risicoanalyses, bedoeld in [artikel 6, tweede lid, onderdeel e][ref1], indien de
      gegevens die op grond van het eerste lid zijn verstrekt dat noodzakelijk maken.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel6
