articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. minister: Minister van Landbouw, Natuur en Voedselkwaliteit;

      b. overlegorgaan: overlegorgaan bedoeld in [artikel 3][ref1];

      c. nationaal park: gebied zoals omschreven in het Structuurschema Groene Ruimte (Kamerstukken II 1992/93, 22 880,
      nr. 5, pagina 9).


      [ref1]: https://wetten.overheid.nl/BWBR0015721#Artikel3
    url: https://wetten.overheid.nl/BWBR0015721/2003-10-11#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0015721
        artikel: '3'
  - number: '2'
    text: |-
      Als nationaal park wordt aangewezen het natuurgebied Utrechtse Heuvelrug, zoals aangegeven op de kaart die als
      bijlage behoort bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0015721/2003-10-11#Artikel2
  - number: '3'
    text: Er is een overlegorgaan nationaal park Utrechtse Heuvelrug.
    url: https://wetten.overheid.nl/BWBR0015721/2003-10-11#Artikel3
  - number: '4'
    text: |-
      Het overlegorgaan heeft tot taak zorg te dragen voor de inrichting, het beheer en functioneren van het nationaal
      park Utrechtse Heuvelrug. Daartoe behoort onder meer:

      a. het actualiseren van het beheers- en inrichtingsplan bedoeld in [artikel 5][ref1];

      b. de onderlinge afstemming van alle voor de inrichting en beheer van belang zijnde activiteiten;

      c. het doen van voorstellen aan de minister voor de besteding en toekenning van de voor het nationale park
      Utrechtse Heuvelrug beschikbare middelen, onder meer in de vorm van een voortschrijdend meerjarenprogramma en een
      jaarlijks in te dienen bestedingenplan;

      d. de bevordering en coördinatie van voorlichting en educatie met betrekking tot het nationaal park Utrechtse
      Heuvelrug.


      [ref1]: https://wetten.overheid.nl/BWBR0015721#Artikel5
    url: https://wetten.overheid.nl/BWBR0015721/2003-10-11#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0015721
        artikel: '5'
  - number: '5'
    text: |-
      Het overlegorgaan voert zijn taak uit overeenkomstig het beheers- en inrichtingsplan voor het nationaal park
      Utrechtse Heuvelrug van 23 januari 2003 en met inachtneming van hetgeen te dien aanzien door de minister bij brief
      van 26 augustus 2003, kenmerk DN/2003/3690, is gesteld.
    url: https://wetten.overheid.nl/BWBR0015721/2003-10-11#Artikel5
  - number: '6'
    text: |-
      In het overlegorgaan hebben zitting:

      a. een door de minister te benoemen lid, tevens voorzitter;

      b. door de minister te benoemen leden, als vertegenwoordiger en op voordracht van onderscheidenlijk:

      1. de provincie Utrecht;

      2. de Stichting Het Utrechts Landschap;

      3. Staatsbosbeheer;

      4. de Vereniging Natuurmonumenten;

      5. de Stichting Natuur en Milieufederatie Utrecht;

      6. de gemeenten Amerongen, Maarn, Rhenen, Doorn, Leersum, Driebergen-Rijsenburg, Veenendaal en Woudenberg;

      7. de particuliere eigenaren;

      8. het waterschap Vallei en Eem en het hoogheemraadschap De Stichtse Rijnlanden;

      9. de recreatie-ondernemers;

      10. de agrarische gebruikers;

      11. het recreatieschap Utrechtse Heuvelrug, Vallei- en Kromme Rijngebied;

      12. het Consulentschap Natuur- en Milieueducatie;

      c. de directeur Noordwest van het Ministerie van Landbouw, Natuur en Voedselkwaliteit als vertegenwoordiger van
      de rijksoverheid.
    url: https://wetten.overheid.nl/BWBR0015721/2003-10-11#Artikel6
  - number: '7'
    text: |-
      1. Het secretariaat van het overlegorgaan berust bij een door de provincie Utrecht te benoemen ambtenaar in dienst
      bij deze provincie.

      2. Het overlegorgaan regelt de openbaarheid en de plaats van zijn vergadering, alsmede de overige aspecten van zijn
      inrichting en werkwijze.

      3. Het overlegorgaan brengt jaarlijks van zijn werkzaamheden en de daarmee samenhangende ontwikkelingen in het
      nationale park Utrechtse Heuvelrug verslag uit aan de minister.
    url: https://wetten.overheid.nl/BWBR0015721/2003-10-11#Artikel7
  - number: '8'
    text: |-
      Indien in het overlegorgaan belangrijke verschillen van inzicht blijken te bestaan, doet de voorzitter van het
      overlegorgaan daarvan mededeling aan de minister, die daarop de naar zijn oordeel nodige stappen onderneemt.
    url: https://wetten.overheid.nl/BWBR0015721/2003-10-11#Artikel8
  - number: '9'
    text: De Regeling aanwijzing nationaal park in oprichting Utrechtse Heuvelrug wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0015721/2003-10-11#Artikel9
  - number: '10'
    text: Deze regeling treedt in werking met ingang van 11 oktober 2003.
    url: https://wetten.overheid.nl/BWBR0015721/2003-10-11#Artikel10
  - number: '11'
    text: 'Deze regeling wordt aangehaald als: Regeling aanwijzing nationaal park Utrechtse Heuvelrug.'
    url: https://wetten.overheid.nl/BWBR0015721/2003-10-11#Artikel11
