        artikel: '3'
  - number: '5'
    text: |-
      1 De periode als bedoeld in [artikel 3, tweede lid, onder b][ref1], bedraagt:

      a. in geval van scannen ten hoogste zeven dagen;

      b. in geval van jammen ten hoogste 24 uur.

      2 Het afwijkend gebruik van de frequentieruimte geschiedt niet langer dan strikt noodzakelijk is voor het beoogde
      operationele doel. Het daarbij gebruikte vermogen is niet groter dan strikt noodzakelijk is voor het beoogde
      operationele doel.


      [ref1]: https://wetten.overheid.nl/BWBR0019509#Artikel3
    url: https://wetten.overheid.nl/BWBR0019509/2025-09-04#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019509
        artikel: '3'
  - number: '6'
    text: |-
      1 De apparatuur die wordt gebruikt voor het afwijkend gebruik van de frequentieruimte voldoet aan de volgende
      eisen:

      a. voorzover de apparatuur wordt gebruikt voor scannen is zij voorzien van een inrichting die de nummergegevens
      zodanig selecteert dat het selectieproces niet meer dan een plaatselijke, zeer geringe verandering van de
      functionaliteiten van het desbetreffende netwerk veroorzaakt;

      b. de apparatuur is voorzien van een inrichting waarmee het uitgezonden vermogen kan worden geregeld;

      c. de apparatuur is geregistreerd bij de Minister.

      2 De apparatuur waarmee een afwijkend gebruik van de frequentieruimte is toegestaan, wordt opgeslagen op een door
      de korpschef aangewezen centrale plaats bij een regionale of landelijke eenheid van de politie.
    url: https://wetten.overheid.nl/BWBR0019509/2025-09-04#Artikel6
  - number: '7'
    text: |-
      Met de in [artikel 6][ref1] bedoelde apparatuur wordt gelijkgesteld apparatuur die rechtmatig is vervaardigd of
      in de handel is gebracht in een andere lidstaat van de Europese Unie dan wel rechtmatig is vervaardigd in een
      staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een daartoe strekkend of mede daartoe
      strekkend Verdrag dat Nederland bindt, en die voldoet aan eisen die een beschermingsniveau bieden dat ten minste
      gelijkwaardig is aan het niveau dat met de nationale eisen wordt nagestreefd.


      [ref1]: https://wetten.overheid.nl/BWBR0019509#Artikel6
    url: https://wetten.overheid.nl/BWBR0019509/2025-09-04#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0019509
        artikel: '6'
  - number: '8'
    text: |-
      Bevoegd tot het bedienen van de apparatuur waarmee een afwijkend gebruik van de frequentieruimte kan plaatsvinden
      zijn de in [artikel 141, aanhef, onderdelen b en d][ref1], bedoelde opsporingsambtenaren die in het bezit zijn
      van een door de Minister van Veiligheid en Justitie aangewezen verklaring waaruit blijkt dat de desbetreffende
      opsporingsambtenaar voldoende kennis heeft van de juridische, technische en operationele aspecten van het gebruik
      van de apparatuur.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0019509/2025-09-04#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '9'
    text: |-
      1 De in [artikel 8][ref1] bedoelde opsporingsambtenaar maakt na het afwijkend gebruik van de frequentieruimte,
      proces-verbaal op. Het proces-verbaal vermeldt:

      a. de data en de tijdstippen waarop en de locaties waar de apparatuur is gebruikt;

      b. de vorm van afwijkend gebruik van de frequentieruimte die heeft plaatsgevonden en in geval van jammen, op welke
      wijze dit heeft plaatsgevonden;

      c. de tijdens het gebruik van de apparatuur gehanteerde instellingen en vermogens; en,

      d. de gegevens die door het gebruik van de apparatuur zijn verkregen.

      2 De opsporingsambtenaar brengt zo spoedig mogelijk, doch niet later dan zeven dagen na afloop van de in
      [artikel 3, tweede lid, onder b][ref2], bedoelde periode, schriftelijk verslag uit aan de Minister van de gegevens,
      bedoeld in het eerste lid, onder a tot en met c. Het verslag wordt door de Minister opgenomen in een daartoe aan te
      leggen centrale registratie.


      [ref1]: https://wetten.overheid.nl/BWBR0019509#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0019509#Artikel3
    url: https://wetten.overheid.nl/BWBR0019509/2025-09-04#Artikel9
