        artikel: '3.22'
  - number: '2'
    text: |-
      Voor een afwijkend gebruik van de frequentieruimte is geen ontheffing als bedoeld in
      [artikel 3.22, derde lid, van de wet][ref1] vereist voor zover de desbetreffende frequentieruimte ingevolge
      het frequentieplan als bedoeld in [artikel 3.1, eerste lid, van de wet][ref2] is bestemd voor openbare mobiele
      telecommunicatiediensten en wordt voldaan aan de [artikelen 3 tot en met 9 ][ref3]van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3.22
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3.1
      [ref3]: https://wetten.overheid.nl/BWBR0019509#Artikel3
    url: https://wetten.overheid.nl/BWBR0019509/2025-09-04#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3.22'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3.1'
      - id: ref3
        bwb_id: BWBR0019509
        artikel: '3'
  - number: '3'
    text: |-
      1 Aan een afwijkend gebruik van de frequentieruimte ligt een besluit van of namens de Minister van Veiligheid en
      Justitie ten grondslag. Indien de bevoegdheid tot het nemen van besluiten als hier bedoeld door de Minister van
      Veiligheid en Justitie is gemandateerd, wordt van het mandaatbesluit alsmede van wijzigingen daarvan, een afschrift
      gezonden aan de Minister.

      2 Het besluit, bedoeld in het eerste lid, eerste volzin, omvat ten minste de volgende gegevens:

      a. de naam van degene die het besluit heeft genomen, de datum en tijdstip waarop het besluit is genomen;

      b. de periode waarbinnen een afwijkend gebruik van de frequentieruimte mag plaatsvinden;

      c. de persoon of instantie aan wie de bevoegdheid tot een afwijkend gebruik van de frequentieruimte wordt verleend;

      d. welke vorm van afwijkend gebruik van de frequentieruimte er plaats mag vinden en in geval van jammen, op welke
      wijze dit mag plaats vinden;

      e. een zo nauwkeurig mogelijke aanduiding van de geografische locaties waar de apparatuur met behulp waarvan een
      afwijkend gebruik van de frequentieruimte kan plaatsvinden, mag worden ingezet.
    url: https://wetten.overheid.nl/BWBR0019509/2025-09-04#Artikel3
  - number: '4'
    text: |-
      1 Het besluit tot een afwijkend gebruik wordt door de Minister van Veiligheid en Justitie, of door de mandataris
      als bedoeld in [artikel 3, eerste lid][ref1], schriftelijk aan de Minister gemeld binnen uiterlijk 24 uur nadat het
      is genomen.

      2 Het besluit tot een afwijkend gebruik dat uit jammen bestaat, wordt door de Minister van Veiligheid en Justitie,
      of door de mandataris als bedoeld in [artikel 3, eerste lid][ref2], voorafgaand aan de tenuitvoerlegging in ieder
      geval mondeling aan de Minister gemeld.

      3 Bij de melding worden de gegevens, bedoeld in [artikel 3, tweede lid][ref3], verstrekt. Indien het afwijkend
      gebruik uit jammen bestaat worden daarbij, voorzover mogelijk, tevens de te hanteren vermogens van de te gebruiken
      apparatuur verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0019509#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0019509#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0019509#Artikel3
    url: https://wetten.overheid.nl/BWBR0019509/2025-09-04#Artikel4
    references:
      - id: ref1
