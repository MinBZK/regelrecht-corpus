  - number: '4'
    text: |-
      De uiterste periodes voor het in gebruik nemen van een productie-installatie op grond van
      [artikel 24, tweede lid, van de regeling][ref1], worden vastgesteld op:

      a. voor een productie-installatie voor de productie van hernieuwbare elektriciteit uit zonne-energie, bedoeld in
      [artikel 3, eerste lid, onderdelen a en b][ref2]: twee jaar na de datum van de beschikking tot subsidieverlening;

      b. voor een productie-installatie voor de productie van hernieuwbare elektriciteit uit zonne-energie, bedoeld in
      [artikel 3, eerste lid, onderdeel c][ref3]: drie jaar na de datum van de beschikking tot subsidieverlening;

      c. voor een productie-installatie voor de productie van hernieuwbare elektriciteit uit zonne-energie, bedoeld in
      [artikel 3, eerste lid, onderdelen d en e][ref4]: vier jaar na de datum van de beschikking tot subsidieverlening;

      d. voor een productie-installatie voor de productie van hernieuwbare elektriciteit uit windenergie, bedoeld in
      [artikel 3, eerste lid, onderdelen f en g][ref5]: drie jaar na de datum van de beschikking tot subsidieverlening;

      e. voor een productie-installatie voor de productie van hernieuwbare elektriciteit uit windenergie, bedoeld in
      [artikel 3, eerste lid, onderdeel h][ref6]: vier jaar na de datum van de beschikking tot subsidieverlening;

      f. voor een productie-installatie voor de productie van hernieuwbare elektriciteit uit waterkracht bedoeld in
      [artikel 3, eerste lid, onderdelen i en j][ref7]: drie jaar na de datum van de beschikking tot subsidieverlening.


