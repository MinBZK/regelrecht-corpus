preamble:
  text: |-
    Gelet op artikel 3 van de Kaderwet EZK- en LNV-subsidies en de artikelen 2, derde lid, 4, derde lid, 5, eerste lid,
    8, derde lid, 9, tweede lid, en 24, tweede lid, van de Subsidieregeling coöperatieve energieopwekking;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0049501/2024-04-02#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

        - *netlevering:* elektriciteit die op het elektriciteitsnet wordt ingevoed;
        - *netto P50-waarde vollasturen:* aantal vollasturen waarbij de verwachte jaarlijkse energieproductie voor een
      gegeven combinatie van een locatie en een productie-installatie die gebruik maakt van windenergie, is bepaald met
      een waarschijnlijkheid van 50%;
        - *niet-netlevering:* elektriciteit die op een installatie wordt ingevoed;
        - *regeling:* [Subsidieregeling coöperatieve energieopwekking][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044882
    url: https://wetten.overheid.nl/BWBR0049501/2024-04-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0044882
  - number: '2'
    text: |-
      1 Het subsidieplafond voor het verlenen van subsidie voor de productie van hernieuwbare elektriciteit op grond van
      [artikel 2, derde lid, van de regeling][ref1], die wordt aangevraagd in de periode van 2 april 2024, 09:00 uur, tot
      1 november 2024, 17:00 uur, wordt vastgesteld op € 100.000.000.

      2 Per categorie productie-installaties kan in de periode, bedoeld in het eerste lid, per locatie waarop de
      productie-installatie wordt aangebracht, ten hoogste één aanvraag worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0044882#Artikel2
    url: https://wetten.overheid.nl/BWBR0049501/2024-04-02#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0044882
        artikel: '2'
  - number: '3'
    text: |-
      1 Als categorieën productie-installaties waarvoor op grond van [artikel 2, derde lid, van de regeling][ref1] een
      aanvraag tot subsidieverlening kan worden ingediend, worden aangewezen:

      a. productie-installaties voor de productie van hernieuwbare elektriciteit uit zonne-energie uitsluitend
      met een of meer fotovoltaïsche zonnepanelen, die zijn aangesloten op het elektriciteitsnet met een
      kleinverbruikersaansluiting, met een totaal nominaal vermogen van ten minste 15 kWp en ten hoogste 100 kWp;

      b. productie-installaties voor de productie van hernieuwbare elektriciteit uit zonne-energie uitsluitend
      met een of meer fotovoltaïsche zonnepanelen, die zijn aangesloten op het elektriciteitsnet met een
      grootverbruikersaansluiting, met een totaal nominaal vermogen van ten minste 15 kWp tot ten hoogste 500 kWp;

      c. productie-installaties voor de productie van hernieuwbare elektriciteit uit zonne-energie uitsluitend met een of
      meer fotovoltaïsche zonnepanelen, die zijn aangesloten op het elektriciteitsnet met een grootverbruikersaansluiting
      en waarbij de zonnepanelen op of aan een gebouw zijn aangebracht, met een totaal nominaal vermogen van ten minste
      500 kWp en ten hoogste 6 MW;

      d. productie-installaties voor de productie van hernieuwbare elektriciteit uit zonne-energie uitsluitend met een of
      meer fotovoltaïsche zonnepanelen, die zijn aangesloten op het elektriciteitsnet met een grootverbruikersaansluiting
      en waarbij de zonnepanelen, niet op of aan een gebouw aangebracht, op water drijven, met een totaal nominaal
      vermogen van ten minste 500 kWp en ten hoogste 6 MWp;

      e. productie-installaties voor de productie van hernieuwbare elektriciteit uit zonne-energie uitsluitend met een of
      meer fotovoltaïsche zonnepanelen, die zijn aangesloten op het elektriciteitsnet met een grootverbruikersaansluiting
      en waarbij de zonnepanelen, niet op of aan een gebouw aangebracht, op land staan, met een totaal nominaal vermogen
      van ten minste 500 kWp en ten hoogste 6 MWp;

      f. productie-installaties voor de productie van hernieuwbare elektriciteit uit windenergie met een of meer
      windturbines, die zijn aangesloten op het elektriciteitsnet met een kleinverbruikersaansluiting, met een totaal
      nominaal vermogen van ten minste 15 kW en ten hoogste 100 kW;

      g. productie-installaties voor de productie van hernieuwbare elektriciteit uit windenergie met een of meer
      windturbines, die zijn aangesloten op het elektriciteitsnet met een grootverbruikersaansluiting, met een totaal
      nominaal vermogen van ten minste 15 kW en ten hoogste 1 MW, en die worden gerealiseerd op een locatie die
      overeenkomstig de lijst van gemeenten volgens de gemeentelijke indeling op 1 januari 2024, bedoeld in de bijlage,
      een windsnelheid heeft van:

      1°. ≥ 8,5 m/s;

      2°. ≥ 8,0 m/s en < 8,5 m/s;

      3°. ≥ 7,5 m/s en < 8,0 m/s;

      4°. ≥ 7,0 m/s en < 7,5 m/s;

      5°. ≥ 6,75 m/s en < 7,0 m/s; of

      6°. < 6,75 m/s;

      h. productie-installaties voor de productie van hernieuwbare elektriciteit uit windenergie met een of meer
      windturbines, die zijn aangesloten op het elektriciteitsnet met een grootverbruikersaansluiting, met een totaal
      nominaal vermogen hebben van ten minste 1 MW en ten hoogste 6 MW, en die worden gerealiseerd op een locatie die
      overeenkomstig de lijst van gemeenten volgens de gemeentelijke indeling op 1 januari 2024, bedoeld in de bijlage,
      een windsnelheid heeft van:

      1°. ≥ 8,5 m/s;

      2°. ≥ 8,0 m/s en < 8,5 m/s;

      3°. ≥ 7,5 m/s en < 8,0 m/s;

      4°. ≥ 7,0 m/s en < 7,5 m/s;

      5°. ≥ 6,75 m/s en < 7,0 m/s; of

      6°. < 6,75 m/s;

      i. productie-installaties voor de productie van hernieuwbare elektriciteit uit potentiële of kinetische energie van
      stromend water door hydro-mechanisch-elektrische omzetting, die zijn aangesloten op het elektriciteitsnet met een
      kleinverbruikersaansluiting, met een totaal nominaal vermogen van ten minste 15 kW en ten hoogste 100 kW;

      j. productie-installaties voor de productie van hernieuwbare elektriciteit uit potentiële of kinetische energie van
      stromend water door hydro-mechanisch-elektrische omzetting, die zijn aangesloten op het elektriciteitsnet met een
      grootverbruikersaansluiting, met een totaal nominaal vermogen van ten minste 15 kW en ten hoogste 150 kW.

      2 Het additioneel gecontracteerde terugleververmogen voor een productie-installatie voor de productie van
      hernieuwbare elektriciteit uit zonne-energie uitsluitend met een of meer fotovoltaïsche zonnepanelen, die zijn
      aangesloten op het elektriciteitsnet met een grootverbruikersaansluiting als bedoeld in het eerste lid, onderdelen
      b, c, d en e, bedraagt maximaal 50% van het piekvermogen van de zonnepanelen.


