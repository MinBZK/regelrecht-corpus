      Voor een categorie productie-installaties als bedoeld in de eerste en tweede kolom van onderstaande tabel wordt:

      a. het basisbedrag, bedoeld in [artikel 5, eerste lid, van de regeling][ref1], vastgesteld op het bedrag dat is
      opgenomen in de derde kolom van onderstaande tabel;

      b. het maximum aantal vollasturen, bedoeld in [artikel 4, derde lid, van de regeling][ref2], vastgesteld op het
      aantal dat is opgenomen in de vierde kolom van onderstaande tabel;

      c. de basiselektriciteitsprijs, bedoeld in [artikel 8, derde lid, van de regeling][ref3], vastgesteld op het bedrag
      dat is opgenomen in de vijfde kolom van onderstaande tabel;

      d. het voorlopige correctiebedrag, bedoeld in[ artikel 9, tweede lid, van de regeling][ref4], voor 2024 vastgesteld
      op het bedrag dat is opgenomen in de zesde kolom van onderstaande tabel.












