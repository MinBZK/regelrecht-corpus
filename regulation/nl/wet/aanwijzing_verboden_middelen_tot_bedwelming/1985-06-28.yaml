preamble:
  text: |-
    Gelet op artikel 2c, eerste lid, van de Visserijwet 1963 (Stb. 312);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0003790/1985-06-28#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Als middelen, bedoeld in [artikel 2c, eerste lid, van de Visserijwet 1963][ref1], waarmede het verboden is vis
      te bedwelmen, te verwonden of te doden, worden aangewezen: kokkelbonen, tjoekvisje, ongebluste kalk, dynamiet en
      andere vergiftigde bedwelmende en ontplofbare stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel2c
    url: https://wetten.overheid.nl/BWBR0003790/1985-06-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: 2c
  - number: '2'
    text: |-
      De beschikking van de Minister van Landbouw en Visserij van 21 april 1970. nr. J 950 (Stcrt. 81), wordt
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003790/1985-06-28#Artikel2
  - number: '3'
    text: Deze regeling wordt bekendgemaakt in de Nederlandse Staatscourant en treedt in werking met ingang van 1 juni 1985.
    url: https://wetten.overheid.nl/BWBR0003790/1985-06-28#Artikel3
