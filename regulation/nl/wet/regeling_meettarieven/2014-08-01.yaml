        artikel: '2'
        paragraaf: '1'
  - number: 4a.3
    text: |-
      Ten behoeve van de vaststelling, bedoeld in het eerste en tweede lid, stelt de Autoriteit Consument en
      Markt om de kapitaalkosten te kunnen bepalen voor elke netbeheerder de gestandaardiseerde activawaarde
      vast met betrekking tot de activiteiten, genoemd in [artikel 30a van de Elektriciteitswet 1998][ref1] en
      [artikel 81e, eerste lid, van de Gaswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel30a
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel81e
