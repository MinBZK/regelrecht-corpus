---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.5.4/schema/v0.5.4/schema.json
$id: regeling_meettarieven
regulatory_layer: WET
publication_date: '2013-03-28'
valid_from: '2014-08-01'
valid_to: '2025-12-31'
bwb_id: BWBR0028965
url: https://wetten.overheid.nl/BWBR0028965/2014-08-01
preamble:
  text: |-
    Gelet op de artikelen 40a van de Elektriciteitswet 1998 en artikel 81e, tweede lid, van de Gaswet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0028965/2014-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Het tarief, bedoeld in [artikel 30a van de Elektriciteitswet 1998][ref1], dat een netbeheerder in rekening brengt
      voor de meting van elektriciteit bij afnemers als bedoeld in [artikel 95a, eerste lid, van die wet][ref2], wordt
      berekend op basis van het tarief zoals dat voor die afnemers gold voor het voorafgaande kalenderjaar, gecorrigeerd
      met inflatie.

      2 De inflatie is de relatieve wijziging van de consumentenprijsindex (alle huishoudens), berekend uit het quotiënt
      van deze prijsindex, gepubliceerd in de vierde maand voorafgaand aan het kalenderjaar waarvoor het tarief geldt,
      en van deze prijsindex, gepubliceerd in de zestiende maand voorafgaande aan het kalenderjaar waarvoor het tarief
      geldt, zoals deze maandelijks wordt vastgesteld door het Centraal Bureau voor de Statistiek.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel30a
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0028965/2014-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 30a
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 95a
    machine_readable:
      execution:
        parameters:
          - name: tarief_vorig_jaar_elektriciteit
            type: amount
            required: true
            description: Tarief voor meting van elektriciteit uit het voorafgaande kalenderjaar
            type_spec:
              unit: eurocent
          - name: cpi_4e_maand
            type: number
            required: true
            description: Consumentenprijsindex (alle huishoudens) in de vierde maand voorafgaand aan het kalenderjaar waarvoor het tarief geldt
          - name: cpi_16e_maand
            type: number
            required: true
            description: Consumentenprijsindex (alle huishoudens) in de zestiende maand voorafgaand aan het kalenderjaar waarvoor het tarief geldt
        output:
          - name: elektriciteit_meettarief
            type: amount
            type_spec:
              unit: eurocent
            description: Tarief voor meting van elektriciteit, gecorrigeerd met inflatie
        actions:
          - output: elektriciteit_meettarief
            value:
              operation: MULTIPLY
              values:
                - $tarief_vorig_jaar_elektriciteit
                - operation: DIVIDE
                  values:
                    - $cpi_4e_maand
                    - $cpi_16e_maand
  - number: '2'
    text: |-
      1 Het tarief, bedoeld in [artikel 81e, eerste lid, van de Gaswet][ref1], dat een netbeheerder in rekening brengt
      voor de meting van gas bij afnemers als bedoeld in [artikel 43, eerste lid, van die wet][ref2] wordt berekend
      op basis van het tarief zoals dat voor die afnemers gold voor het voorafgaande kalenderjaar, gecorrigeerd met
      inflatie.

      2 De inflatie is de relatieve wijziging van de consumentenprijsindex (alle huishoudens), berekend uit het quotiënt
      van deze prijsindex, gepubliceerd in de vierde maand voorafgaand aan het kalenderjaar waarvoor het tarief geldt,
      en van deze prijsindex, gepubliceerd in de zestiende maand voorafgaande aan het kalenderjaar waarvoor het tarief
      geldt, zoals deze maandelijks wordt vastgesteld door het Centraal Bureau voor de Statistiek.

      3 In afwijking van het eerste lid wordt het tarief, bedoeld in [artikel 81e, eerste lid, van de Gaswet][ref3],
      dat een netbeheerder in het jaar 2012 in rekening brengt voor de meting van gas bij afnemers als bedoeld in
      [artikel 43, eerste lid, van die wet][ref4] berekend op basis van het gewogen gemiddelde van de tarieven van alle
      netbeheerders gezamenlijk, zoals die voor afnemers als bedoeld in artikel 43, eerste lid, van die wet golden voor
      het jaar 2005, gecorrigeerd met de relatieve wijziging van de consumentenprijsindex, berekend uit het quotiënt van
      deze prijsindex van augustus 2005 en die van augustus 2011.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel81e
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel81e
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel43
    url: https://wetten.overheid.nl/BWBR0028965/2014-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 81e
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '43'
      - id: ref3
        bwb_id: BWBR0011440
        artikel: 81e
      - id: ref4
        bwb_id: BWBR0011440
        artikel: '43'
    machine_readable:
      execution:
        parameters:
          - name: tarief_vorig_jaar_gas
            type: amount
            required: true
            description: Tarief voor meting van gas uit het voorafgaande kalenderjaar
            type_spec:
              unit: eurocent
          - name: cpi_4e_maand
            type: number
            required: true
            description: Consumentenprijsindex (alle huishoudens) in de vierde maand voorafgaand aan het kalenderjaar waarvoor het tarief geldt
          - name: cpi_16e_maand
            type: number
            required: true
            description: Consumentenprijsindex (alle huishoudens) in de zestiende maand voorafgaand aan het kalenderjaar waarvoor het tarief geldt
          - name: jaar
            type: number
            required: true
            description: Kalenderjaar waarvoor het tarief geldt
          - name: gewogen_gemiddelde_tarief_2005
            type: amount
            required: false
            description: Gewogen gemiddelde tarief van alle netbeheerders voor gas in 2005
            type_spec:
              unit: eurocent
          - name: cpi_augustus_2005
            type: number
            required: false
            description: Consumentenprijsindex (alle huishoudens) in augustus 2005
          - name: cpi_augustus_2011
            type: number
            required: false
            description: Consumentenprijsindex (alle huishoudens) in augustus 2011
        output:
          - name: gas_meettarief
            type: amount
            type_spec:
              unit: eurocent
            description: Tarief voor meting van gas, gecorrigeerd met inflatie
        actions:
          - output: gas_meettarief
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $jaar
                    value: 2012
                  then:
                    operation: MULTIPLY
                    values:
                      - $gewogen_gemiddelde_tarief_2005
                      - operation: DIVIDE
                        values:
                          - $cpi_augustus_2011
                          - $cpi_augustus_2005
              default:
                operation: MULTIPLY
                values:
                  - $tarief_vorig_jaar_gas
                  - operation: DIVIDE
                    values:
                      - $cpi_4e_maand
                      - $cpi_16e_maand
  - number: 4a
    text: |-
      1 Ten behoeve van de toepassing van [artikel 3, tweede lid][ref1], in enig jaar, stelt de Autoriteit Consument en
      Markt voor elk kalenderjaar vanaf 2011 tot en met het kalenderjaar voorafgaand aan de inwerkingtreding van artikel
      3 het opgetreden verschil tussen de inkomsten uit de overeenkomstig [artikel 1, eerste lid][ref2], vastgestelde
      tarieven en de kosten vast.

      2 Ten behoeve van de toepassing van [artikel 4, tweede lid][ref3], in enig jaar, stelt de Autoriteit Consument
      en Markt voor elk kalenderjaar vanaf 2012 tot en met het kalenderjaar voorafgaand aan de inwerkingtreding van
      artikel 4 het opgetreden verschil tussen de inkomsten uit de overeenkomstig [artikel 2, eerste of derde lid][ref4],
      vastgestelde tarieven en de kosten vast.

      3 Ten behoeve van de vaststelling, bedoeld in het eerste en tweede lid, stelt de Autoriteit Consument en
      Markt om de kapitaalkosten te kunnen bepalen voor elke netbeheerder de gestandaardiseerde activawaarde
      vast met betrekking tot de activiteiten, genoemd in [artikel 30a van de Elektriciteitswet 1998][ref5] en
      [artikel 81e, eerste lid, van de Gaswet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0028965#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028965#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0028965#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0028965#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0009755#Artikel30a
      [ref6]: https://wetten.overheid.nl/BWBR0011440#Artikel81e
    url: https://wetten.overheid.nl/BWBR0028965/2014-08-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0028965
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028965
        artikel: '1'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0028965
        artikel: '4'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0028965
        artikel: '2'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0009755
        artikel: 30a
      - id: ref6
        bwb_id: BWBR0011440
        artikel: 81e
    machine_readable:
      execution:
        parameters:
          - name: inkomsten_uit_tarieven
            type: amount
            required: true
            description: Inkomsten uit de vastgestelde tarieven
            type_spec:
              unit: eurocent
          - name: kosten
            type: amount
            required: true
            description: Kosten van de netbeheerder
            type_spec:
              unit: eurocent
        output:
          - name: verschil_inkomsten_kosten
            type: amount
            type_spec:
              unit: eurocent
            description: Verschil tussen inkomsten uit tarieven en kosten
        actions:
          - output: verschil_inkomsten_kosten
            value:
              operation: SUBTRACT
              values:
                - $inkomsten_uit_tarieven
                - $kosten
  - number: '5'
    text: |-
      1 [Artikel 1][ref1] treedt in werking met ingang van 1 januari 2011.

      2 [Artikel 2][ref2] treedt in werking met ingang van 1 januari 2012.

      3 [Artikel 4a][ref3] treedt in werking met ingang van 1 januari 2013.


      [ref1]: https://wetten.overheid.nl/BWBR0028965#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028965#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0028965#Artikel4a
    url: https://wetten.overheid.nl/BWBR0028965/2014-08-01#Artikel5
    references:
