        paragraaf: '1'
  - number: 4a.2
    text: |-
      Ten behoeve van de toepassing van [artikel 4, tweede lid][ref1], in enig jaar, stelt de Autoriteit Consument en
      Markt voor elk kalenderjaar vanaf 2012 tot en met het kalenderjaar voorafgaand aan de inwerkingtreding van artikel
      4 het opgetreden verschil tussen de inkomsten uit de overeenkomstig [artikel 2, eerste of derde lid][ref2],
      vastgestelde tarieven en de kosten vast.


      [ref1]: https://wetten.overheid.nl/BWBR0028965#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0028965#Artikel2
    url: https://wetten.overheid.nl/BWBR0028965/2014-08-01#Artikel4a
