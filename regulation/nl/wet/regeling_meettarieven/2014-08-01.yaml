preamble:
  text: |-
    Gelet op de artikelen 40a van de Elektriciteitswet 1998 en artikel 81e, tweede lid, van de Gaswet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0028965/2014-08-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Het tarief, bedoeld in [artikel 30a van de Elektriciteitswet 1998][ref1], dat een netbeheerder in rekening brengt
      voor de meting van elektriciteit bij afnemers als bedoeld in [artikel 95a, eerste lid, van die wet][ref2], wordt
      berekend op basis van het tarief zoals dat voor die afnemers gold voor het voorafgaande kalenderjaar, gecorrigeerd
      met inflatie.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel30a
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0028965/2014-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 30a
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 95a
  - number: '1.2'
    text: |-
      De inflatie is de relatieve wijziging van de consumentenprijsindex (alle huishoudens), berekend uit het quotiënt
      van deze prijsindex, gepubliceerd in de vierde maand voorafgaand aan het kalenderjaar waarvoor het tarief geldt,
      en van deze prijsindex, gepubliceerd in de zestiende maand voorafgaande aan het kalenderjaar waarvoor het tarief
      geldt, zoals deze maandelijks wordt vastgesteld door het Centraal Bureau voor de Statistiek.
    url: https://wetten.overheid.nl/BWBR0028965/2014-08-01#Artikel1
  - number: '2.1'
    text: |-
      Het tarief, bedoeld in [artikel 81e, eerste lid, van de Gaswet][ref1], dat een netbeheerder in rekening brengt voor
      de meting van gas bij afnemers als bedoeld in [artikel 43, eerste lid, van die wet][ref2] wordt berekend op basis
      van het tarief zoals dat voor die afnemers gold voor het voorafgaande kalenderjaar, gecorrigeerd met inflatie.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel81e
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel43
    url: https://wetten.overheid.nl/BWBR0028965/2014-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 81e
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '43'
  - number: '2.2'
    text: |-
      De inflatie is de relatieve wijziging van de consumentenprijsindex (alle huishoudens), berekend uit het quotiënt
      van deze prijsindex, gepubliceerd in de vierde maand voorafgaand aan het kalenderjaar waarvoor het tarief geldt,
      en van deze prijsindex, gepubliceerd in de zestiende maand voorafgaande aan het kalenderjaar waarvoor het tarief
      geldt, zoals deze maandelijks wordt vastgesteld door het Centraal Bureau voor de Statistiek.
    url: https://wetten.overheid.nl/BWBR0028965/2014-08-01#Artikel2
  - number: '2.3'
    text: |-
      In afwijking van het eerste lid wordt het tarief, bedoeld in [artikel 81e, eerste lid, van de Gaswet][ref1],
      dat een netbeheerder in het jaar 2012 in rekening brengt voor de meting van gas bij afnemers als bedoeld in
      [artikel 43, eerste lid, van die wet][ref2] berekend op basis van het gewogen gemiddelde van de tarieven van alle
      netbeheerders gezamenlijk, zoals die voor afnemers als bedoeld in artikel 43, eerste lid, van die wet golden voor
      het jaar 2005, gecorrigeerd met de relatieve wijziging van de consumentenprijsindex, berekend uit het quotiënt van
      deze prijsindex van augustus 2005 en die van augustus 2011.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel81e
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel43
    url: https://wetten.overheid.nl/BWBR0028965/2014-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 81e
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '43'
  - number: 4a.1
    text: |-
      Ten behoeve van de toepassing van [artikel 3, tweede lid][ref1], in enig jaar, stelt de Autoriteit Consument en
      Markt voor elk kalenderjaar vanaf 2011 tot en met het kalenderjaar voorafgaand aan de inwerkingtreding van artikel
      3 het opgetreden verschil tussen de inkomsten uit de overeenkomstig [artikel 1, eerste lid][ref2], vastgestelde
      tarieven en de kosten vast.


      [ref1]: https://wetten.overheid.nl/BWBR0028965#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028965#Artikel1
    url: https://wetten.overheid.nl/BWBR0028965/2014-08-01#Artikel4a
    references:
      - id: ref1
