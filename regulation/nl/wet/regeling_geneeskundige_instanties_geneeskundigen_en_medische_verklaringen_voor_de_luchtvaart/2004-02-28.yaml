        artikel: '32'
  - number: '2'
    text: |-
      1 De minister kan, met inachtname van artikel 2.4, zesde lid, van de wet, op aanvraag aan een geneeskundige
      instantie een eerste autorisatie afgeven, als deze:

      a. aan [artikel 4, onder a-l][ref1], voldoet,

      b. feitelijk een kwaliteitssysteem voor de interne organisatie volgens het ISO-9002 model in ontwikkeling heeft
      dat binnen achttien maanden operationeel zal zijn en binnen achttien maanden nadat een eventuele autorisatie
      heeft plaatsgevonden een ISO9002 certificaat, afgegeven door een door de Raad van Accreditatie voor ISO-9002
      certificaties geaccrediteerde certificeringsinstelling, indient, en

      c. de vergoeding voor de kosten van de handelingen ten behoeve van een aanvraag tot afgifte van een autorisatie,
      volgens het op het moment van de aanvraag geldende tarief, heeft voldaan.

      2 Een aanvraag tot het afgeven van een eerste autorisatie wordt, vergezeld van de in het aanvraagformulier
      verlangde bescheiden, gedaan op een door de minister verstrekt aanvraagformulier.

      3 Een autorisatie wordt voor een periode van ten hoogste drie jaar afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0010686#Artikel4
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel2
