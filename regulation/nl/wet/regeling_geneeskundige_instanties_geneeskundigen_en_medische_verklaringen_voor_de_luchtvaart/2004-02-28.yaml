      1 Houders van een op basis van artikel 2.4, zevende lid, van de wet ongeldige medische verklaring laten, als
      zij van mening zijn dat hun gezondheidstoestand weer zodanig is dat zij in staat zijn de werkzaamheden waarvoor
      hen een bewijs van bevoegdheid is verleend te verrichten, dit door een geautoriseerde geneeskundige instantie of
      geneeskundige beoordelen. Luchtverkeersleiders en AFISO’s doen dit via hun bedrijfsarts.

      2 De geautoriseerde geneeskundige instantie of geneeskundige vormt zich een oordeel, in het licht van de relevante
      medische eisen, keuringsmethoden en procedures bedoeld in [artikel 13, eerste lid][ref1], en [bijlage 2][ref2],
      tweede paragraaf, over de vraag of de gezondheidstoestand van de houder van de medische verklaring zodanig is,
      dat deze al dan niet in staat is de werkzaamheden, waarvoor hem een bewijs van bevoegdheid is verstrekt, weer te
      verrichten.

      3 De geautoriseerde geneeskundige instantie of geneeskundige meldt het oordeel onverwijld gemotiveerd aan de
      minister en aan de houder van de medische verklaring. De motivering bevat in ieder geval een verwijzing naar
      de relevante medische eisen, keuringsmethoden en procedures bedoeld in [artikel 13, eerste lid][ref3], en
      [bijlage 2][ref4], tweede paragraaf.


