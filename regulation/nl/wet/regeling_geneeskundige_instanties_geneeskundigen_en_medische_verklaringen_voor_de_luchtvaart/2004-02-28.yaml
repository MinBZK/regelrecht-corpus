    text: |-
      1 Als zwangerschap is geconstateerd melden houders van een medische verklaring dit onverwijld aan een
      geautoriseerde geneeskundige instantie of geneeskundige. Luchtverkeersleiders en AFISO’s doen dit via hun
      bedrijfsarts.

      2 De geautoriseerde geneeskundige instantie of geneeskundige vormt zich een oordeel, in het licht van de relevante
      medische eisen, keuringsmethoden en procedures bedoeld in [artikel 13, eerste lid][ref1], en [bijlage 2][ref2],
      tweede paragraaf, in hoeverre, voor welke periode en onder welke voorwaarden de gezondheidstoestand van de houder
      van de medische verklaring nog zodanig is, dat deze in staat is de werkzaamheden, waarvoor haar een bewijs van
      bevoegdheid is verstrekt, te verrichten.

      3 De geautoriseerde geneeskundige instantie of geneeskundige meldt het oordeel onverwijld gemotiveerd aan de
      minister en aan de houder van de medische verklaring. De motivering bevat in ieder geval een verwijzing naar
      de relevante medische eisen, keuringsmethoden en procedures bedoeld in [artikel 13, eerste lid][ref3], en
      [bijlage 2][ref4], tweede paragraaf.


