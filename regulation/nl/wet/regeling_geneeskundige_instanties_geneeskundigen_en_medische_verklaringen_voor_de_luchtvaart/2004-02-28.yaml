    text: |-
      1 De Adviescommissie hoort indien noodzakelijk de belanghebbenden binnen twee weken na ontvangst van het
      bezwaarschrift door de Adviescommissie.

      2 Het horen door de Adviescommissie kan door de voorzitter worden opgedragen aan drie of meer leden, die geen deel
      uitmaken van het Ministerie van Verkeer en Waterstaat en niet werkzaam zijn onder de verantwoordelijkheid van de
      minister.

      3 De in het tweede lid bedoelde leden van de Adviescommissie doen de overige leden binnen twee weken na het horen
      een verslag van het horen toekomen.

      4 De Adviescommissie brengt binnen vier weken na het eventuele horen van de belanghebbenden advies uit aan de
      minister.

      5 De Adviescommissie beslist over het uit te brengen advies met meerderheid van stemmen. Als de stemmen staken, is
      de stem van de voorzitter beslissend.

      6 Voor het uitbrengen van advies komt de Adviescommissie in plenaire zitting bij elkaar. Ieder lid van de
      Adviescommissie is in principe gerechtigd een stem uit te brengen over een uit te brengen advies. Als een of meer
      leden niet in de gelegenheid zijn om ter zitting te verschijnen, wordt gestemd bij meerderheid van stemmen van de
      aanwezige leden, met inachtneming van een quorum van drie leden.

      7 Leden van de Adviescommissie zullen niet deelnemen aan het horen van een persoon en geen stem uitbrengen voor het
      advies over een persoon, waarmee zij in een medische, persoonlijke of zakelijke relatie stonden of staan.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel22
  - number: '23'
    text: |-
      1 Aanvragers van een medische verklaring, of houders van een medische verklaring die werkzaamheden uitvoeren
      waarvoor hen een bewijs van bevoegdheid of bevoegdverklaring is verleend, zijn vrij van:

      a. enige afwijking, congenitaal of verworven,

      b. enige actieve, latente, acute of chronische invaliditeit, en

      c. enige wond, letsel of restverschijnselen van een operatie; zodanig dat het een mate van functionele uitval met
      zich mee kan brengen die interfereert met de veilige uitoefening van de werkzaamheden waarvoor hen een bewijs van
      bevoegdheid of bevoegdverklaring is verleend.

      2 Aanvragers van een medische verklaring, of houders van een medische verklaring die werkzaamheden uitvoeren
      waarvoor hen een bewijs van bevoegdheid of bevoegdverklaring is verleend, lijden niet aan enige ziekte of
      invaliditeit, welke hen waarschijnlijk plotseling onbekwaam zou maken om de werkzaamheden waarvoor hen een bewijs
      van bevoegdheid of bevoegdverklaring is verleend, veilig te verrichten.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel23
  - number: '24'
    text: |-
      1 Houders van een medische verklaring zullen de werkzaamheden waarvoor hen een bewijs van bevoegdheid of
      bevoegdverklaring is verleend niet uitvoeren, wanneer zij een al dan niet voorgeschreven medicatie of verdovend
      middel gebruiken, inclusief die welke gebruikt worden voor de behandeling van een ziekte of stoornis, als zij
      zich bewust zijn van enige bijwerking, die onverenigbaar is met de veilige uitoefening van de bevoegdheden van hun
      bewijs van bevoegdheid of bevoegdverklaring.

      2 Houders van een medische verklaring nemen in acht dat alle procedures, die het gebruik van een algemeen of
      spinaal anaestheticum noodzakelijk maken, ongeschiktheid ten gevolge zullen hebben gedurende tenminste 48 uur.

      3 Houders van een medische verklaring nemen in acht dat alle procedures die een topische of regionale anesthesie
      noodzakelijk maken, ongeschiktheid ten gevolge hebben gedurende tenminste 12 uur.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel24
  - number: '25'
    text: |-
      Houders van een medische verklaring leveren deze onverwijld in bij de minister in geval van:

      a. het verlopen van de medische verklaring, of

      b. ongeldigheid van de medische verklaring.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel25
  - number: '26'
    text: |-
      Een geneeskundige, verantwoordelijk voor het coördineren van de verwerking van keurings- en beoordelingsresultaten
      alsmede het accorderen en ondertekenen van rapporten, wordt toegang verleend tot de medische documentatie die
      berust bij de minister en die relevant is voor de medische keuringen en beoordelingen die de geneeskundige
      uitvoert, hetzij worden uitgevoerd bij de geautoriseerde geneeskundige instantie waar de geneeskundige werkzaam is,
      op basis van deze regeling.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel26
  - number: '27'
    text: Deze regeling treedt in werking met ingang van 1 oktober 1999.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel27
  - number: '28'
    text: |-
      Deze regeling wordt aangehaald als: Regeling geneeskundige instanties, geneeskundigen en medische verklaringen voor
      de luchtvaart.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel28
  - number: '29'
    text: |-
      De volgende regelingen en besluiten worden met betrekking tot vliegers en
      leerling vliegers van luchtvaartuigen in de categorie vliegtuigen zoals bedoeld in
      [artikel 2, tweede lid, van het Besluit Bewijzen van bevoegdheid voor de luchtvaart][ref1], niet van toepassing
      verklaard:

      a. Regeling van de Minister van Verkeer en Waterstaat van 22 juni 1998, nr. LI/848 Rijksluchtvaartdienst, houdende
      eisen inzake lichamelijke en geestelijke geschiktheid voor bewijzen van bevoegdheid en bevoegdverklaringen (Stcrt.
      1988, 137);

      b. Beschikking van de Minister van Verkeer en Waterstaat van 12 juni 1985, nr. LI/4455 houdende benoeming
      geneeskundige en aanwijzing geneeskundige instanties voor keuringen;

      c. Herkeuringsregeling burgerluchtvaart;

      d. Regeling van de Minister van Verkeer en Waterstaat van 24 mei 1988, nr. LI 3635, houdende aanwijzing Nationaal
      Lucht- en Ruimtevaartgeneeskundig Centrum voor herkeuringen, welke verband houden met het verkrijgen en behouden
      van zweefvliegbewijzen (Stcrt. 1988, 105);

      e. Regeling van de Directeur-Generaal van de Rijksluchtvaartdienst van 27 januari 1988, nr. LI/717, houdende regels
      voor het verlenen van vrijstelling van vliegmedische keuringen (Stcrt. 1988, 28).


