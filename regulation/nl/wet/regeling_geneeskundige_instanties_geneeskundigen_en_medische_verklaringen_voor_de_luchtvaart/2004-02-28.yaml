  - number: '8'
    text: |-
      Een autorisatie van een geneeskundige vervalt van rechtswege op de eerste dag van de maand nadat de geneeskundige
      de leeftijd van zeventig jaar heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel8
  - number: '9'
    text: |-
      Als een geautoriseerde geneeskundige zijn hoofdvestiging heeft in een niet-JAA Staat of een niet-Eurocontrol
      Staat is zijn bevoegdheid voor wat betreft keuringen klasse 1 of 2, onderscheidenlijk klasse 3, beperkt tot het
      verrichten van medische keuringen in het kader van een reguliere verlenging van een medische verklaring.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel9
  - number: '10'
    text: |-
      1 Om in aanmerking te kunnen komen voor een eerste afgifte of een verlenging van een medische verklaring, laat een
      persoon zich medisch keuren bij een geautoriseerde geneeskundige instantie respectievelijk geneeskundige.

      2 In afwijking van het eerste lid kan van het zich medisch laten keuren bij een geautoriseerde geneeskundige
      instantie respectievelijk geneeskundige worden afgezien, als het de verlenging van een medische verklaring klasse 2
      betreft, deze medische verklaring niet anders zal worden gebruikt dan in combinatie met een bewijs van bevoegdheid
      RPL(G) respectievelijk RPL(FB), en de betrokkene met gunstige uitslag een keuring heeft ondergaan die tenminste een
      gelijke geldigheidsduur heeft als de medische verklaring na verlenging, voor zover die keuring heeft plaatsgehad:

      a. volgens de ICAO-eisen elders in een ICAO-Staat voor de afgifte van een bewijs van bevoegdheid of medische
      verklaring, geldig voor zweefvliegtuigen, vliegtuigen, helikopters of ballonnen, respectievelijk voor de afgifte
      van een bewijs van bevoegdheid of medische verklaring, geldig voor vliegtuigen, helikopters of ballonnen; of

      b. in Nederland of elders voor een vliegende functie bij de krijgsmacht.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel10
  - number: '11'
    text: |-
      1 Keuringen klasse 1 en 3 worden uitgevoerd:

      a. bij een geautoriseerde geneeskundige instantie als het een keuring betreft ten behoeve van een voor het eerst af
      te geven medische verklaring, of

      b. bij een geautoriseerde geneeskundige instantie of geneeskundige als het een keuring betreft ten behoeve van een
      te verlengen medische verklaring.

      2 Keuringen klasse 2 worden bij een geautoriseerde geneeskundige instantie of geneeskundige uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel11
  - number: '12'
    text: |-
      1 De keurling voldoet, voorafgaand aan de keuring bij de geautoriseerde geneeskundige instantie of geneeskundige
      waar de keuring plaatsvindt, aan de volgende eisen:

      a toont zijn voorafgaande medische verklaring, voorzover van toepassing,

      b toont een geldig legitimatiebewijs,

      c verstrekt een waarheidsgetrouwe anamnese,

      a vult in en ondertekent een door de minister vastgesteld aanvraagformulier voor de afgifte van een medische
      verklaring, volgens de instructies zoals ontvangen bij de geautoriseerde geneeskundige instantie of geneeskundige,
      en

      e voldoet de door de geautoriseerde geneeskundige instantie of geneeskundige voor de minister te innen vergoeding
      voor de kosten van de handelingen ten behoeve van de aanvraag tot de afgifte of verlenging van een medische
      verklaring, volgens het op het moment van de aanvraag geldende tarief.

      2 Als de keurling niet aan het eerste lid voldoet, vindt geen medische keuring plaats en zal geen medische
      verklaring kunnen worden afgegeven door de minister.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel12
  - number: '13'
    text: |-
      1 De medische keuringen klasse 1, 2 en 3 worden uitgevoerd en de hieruit resulterende adviesrapportages aan de
      minister worden opgesteld met inachtneming van de medische eisen, voorgeschreven keuringsmethoden, voorgeschreven
      procedures, alsmede de eisen gesteld aan de adviesrapportage, zoals bedoeld in:

      a. JAR-FCL 3 subdeel B voor klasse 1, JAR-FCL 3 subdeel C voor klasse 2, alsmede appendix 1 bij deze regeling voor
      klasse 3, en

      b. bijlage 2 bij deze regeling.

      2 De geautoriseerde geneeskundige instantie of geneeskundige int de vergoeding voor de kosten van de handelingen
      ten behoeve van de aanvraag tot de afgifte of verlenging van een medische verklaring en draagt deze af aan de
      minister.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel13
  - number: 13a
    text: |-
      Ten behoeve van de eerste afgifte of de verlenging van een medische verklaring uitsluitend te gebruiken in
      combinatie met een bewijs van bevoegdheid RPL(G), worden in afwijking van [artikel 13, eerste lid][ref1],
      de medische keuringen klasse 2 en de hieruit resulterende adviesrapportages aan de minister uitgevoerd met
      inachtneming van de medische eisen en de procedure als opgenomen in [bijlage 4][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0010686#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0010686
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0010686
        artikel: '13'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0010686
  - number: '14'
    text: |-
      1 Als een houder van een medische verklaring klasse 1 of 3:

      a. deze meer dan vijf jaar heeft laten verlopen, wordt hij gekeurd als betrof het een eerste keuring voor een door
      de minister af te geven medische verklaring,

      b. deze meer dan negentig dagen maar minder dan vijf jaar heeft laten verlopen laat hij zich keuren bij een
      geautoriseerde geneeskundige instantie, of

      c. deze minder dan negentig dagen heeft laten verlopen gelden voor de houder geen bijzondere regels.

      2 Als een houder van een medische verklaring klasse 2:

      a. deze meer dan vijf jaar heeft laten verlopen, wordt hij gekeurd als betrof het een eerste keuring ten behoeve
      van een door de minister af te geven medische verklaring;

      b. deze minder dan vijf jaar heeft laten verlopen gelden voor de houder geen bijzondere regels.

      3 In de gevallen, bedoeld in het eerste lid, onderdeel a, of het eerste lid, onderdeel b, voor zover de houder
      van een medische verklaring deze langer dan twee jaar heeft laten verlopen, of het tweede lid onderdeel a, of
      het tweede lid onderdeel b, voor zover de houder van een medische verklaring deze langer dan een jaar heeft laten
      verlopen, vraagt de keurende geautoriseerde geneeskundige instantie onderscheidenlijk geneeskundige voorafgaand aan
      de medische keuring de medische gegevens van de keurling die berusten bij de minister op.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel14
  - number: '15'
    text: |-
      1 De minister kan, al dan niet onder beperkingen, een medische verklaring klasse 1, 2 of 3 afgeven of verlengen,
      als:.

      a. hij een aanvraagformulier daartoe heeft ontvangen,

      b. hij een adviesrapportage van een geautoriseerde geneeskundige instantie of geneeskundige daartoe heeft
      ontvangen,

      c. voldaan is aan [artikel 13, eerste lid][ref1], en

      d. de gezondheidstoestand van de aanvrager zodanig is dat met afgifte of verlenging de veiligheid niet in gevaar
      kan worden gebracht.

      2 Ten behoeve van het besluit als bedoeld in het eerste lid kan de minister:

      a. de keurende geautoriseerde geneeskundige instantie of geneeskundige opdragen nadere noodzakelijke gegevens aan
      te leveren of nader onderzoek te laten uitvoeren, of,

      b. nader onderzoek door een derde laten uitvoeren.

      3 Als de gekeurde alleen onder beperkingen in aanmerking zou kunnen komen voor een medische verklaring of een
      verlenging daarvan, geeft de minister slechts dan een medische verklaring af of verlengt deze slechts dan, nadat
      aandacht is geschonken aan:

      a. het eventuele medische gebrek van de gekeurde in relatie tot diens activiteiten,

      b. de vaardigheden en ervaring van de gekeurde voor wat betreft diens activiteiten,

      c. een praktische test, indien noodzakelijk, en

      d. de relevantie van het afgeven van een medische verklaring onder beperkingen.

      4 Als een medische verklaring of een verlenging daarvan alleen kan worden afgegeven onder oplegging van meer dan
      een beperking, geschiedt dit niet dan nadat de minister aandacht heeft besteed aan de som van de effecten van de
      betreffende beperking(en) of voorwaarde(n) op de vliegveiligheid.

      5 De minister kan onder meer de volgende beperkingen aan een af te geven of te verlengen medische verklaring
      verbinden, die als het beperkingen ten aanzien van een medische verklaring klasse 1 of 2 betreft ,worden aangevuld
      met de tussen haken geplaatste drieletter JAR-FCL codes:

      a. slechts geldig gedurende een in de medische verklaring aangegeven aantal maanden (TML);

      b. slechts geldig als een corrigerende bril of corrigerende contactlenzen, noodzakelijk voor een veilige
      uitoefening van de functie van de houder, worden gedragen (VDL);

      c. slechts geldig als een corrigerende bril of corrigerende contactlenzen bij de hand worden gehouden (VNL);

      d. slechts geldig als tijdens de uitoefening van een dienst corrigerende glazen worden gedragen welke geschikt zijn
      om de betreffende operationele taak uit te voeren;

      e. slechts geldig voor vluchten binnen het luchtruim van JAA-Staten (VCL);

      f. slechts geldig voor VFR-vluchten bij dag (VCL);

      g. slechts geldig als wordt geopereerd als of met een tweede vlieger (OML);

      h. slechts geldig als wordt geopereerd als tweede vlieger (OCL);

      i. slechts geldig als wordt geopereerd met een tweede vlieger, gekwalificeerd voor de betreffende klasse of het
      betreffende type luchtvaartuig, die de taak heeft om de gezagvoering over te nemen ingeval de houder van deze
      medische verklaring incapabel wordt, en in een luchtvaartuig met dubbele besturing (OSL);

      j. slechts geldig voor in de medische verklaring aangegeven vliegtuigtypen (OAL);

      k. slechts geldig als geen passagiers worden vervoerd (OPL);

      l. slechts geldig als een in de medische verklaring aangegeven prothese wordt gebruikt (APL);

      m. slechts geldig als een in de medische verklaring aangegeven soort handbesturing wordt gebruikt (AHL);

      n. slechts geldig als een in de medische verklaring aangegeven oogbescherming wordt gebruikt (AGL);

      o. variatie- ICAO Annex 1 PARA 1.2.4.8 (VAR); of

      p. slechts geldig in combinatie met een nationaal bewijs van bevoegdheid zonder JAA-status.

      In een medische verklaring kunnen voorts speciale instructies worden opgenomen.

      6 Als een medische verklaring onder beperkingen wordt afgegeven of verlengd, of als de afgifte of verlenging wordt
      geweigerd, geschiedt dit niet zonder dat dit met redenen omkleed wordt aangegeven aan de keurende geautoriseerde
      geneeskundige instantie of geneeskundige waar de voorafgaande keuring is verricht.

      7 Als de medische verklaring op grond van het vierde lid van dit artikel slechts geldig is gedurende een aantal
      maanden, kan de minister aangeven onder welke voorwaarden de geldigheid na het verlopen van het betreffende aantal
      maanden kan worden verlengd, hetzij voor wederom een beperkt aantal maanden, hetzij voor de rest van de geldigheid
      zoals deze zou hebben gegolden als in eerste instantie geen beperking was opgelegd.

      8 Een medische verklaring wordt niet afgegeven, voordat de vergoeding voor de handelingen ten behoeve van de
      aanvraag tot de afgifte of verlenging van een medische verklaring is voldaan.


