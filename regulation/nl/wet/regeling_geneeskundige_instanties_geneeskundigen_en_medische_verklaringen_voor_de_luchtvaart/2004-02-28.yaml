    text: |-
      1 De minister kan op aanvraag opnieuw een autorisatie afgeven, als de geneeskundige instantie:

      a. aan [artikel 4][ref1] voldoet, en

      b. de vergoeding voor de kosten van de handelingen ten behoeve van een aanvraag tot afgifte van een autorisatie,
      volgens het op het moment van de aanvraag geldende tarief, heeft voldaan.

      2 Een aanvraag tot het opnieuw afgeven van een autorisatie wordt, vergezeld van de in het aanvraagformulier
      verlangde bescheiden, gedaan op een door de minister verstrekt aanvraagformulier.


