    text: |-
      1 De minister kan, met inachtname van artikel 2.4, zesde lid, van de wet, op aanvraag aan een geneeskundige een
      eerste autorisatie afgeven voor het uitvoeren van medische keuringen klasse 1, 2 en 3, of klasse 2, als deze:

      a. aan [artikel 7 onder a-j][ref1] voldoet, en

      b. de vergoeding voor de kosten van de handelingen ten behoeve van een aanvraag tot afgifte van een autorisatie,
      volgens het op het moment van de aanvraag geldende tarief, heeft voldaan.

      c. de vergoeding voor de afgifte van een autorisatie, volgens het tarief genoemd in de Regeling tarieven voor de
      luchtvaart, heeft voldaan.

      2 Een aanvraag tot het afgeven van een eerste autorisatie wordt, vergezeld van de in het aanvraagformulier
      verlangde bescheiden, gedaan op een door de minister verstrekt aanvraagformulier.

      3 Een autorisatie wordt voor een periode van ten hoogste drie jaar afgegeven.


