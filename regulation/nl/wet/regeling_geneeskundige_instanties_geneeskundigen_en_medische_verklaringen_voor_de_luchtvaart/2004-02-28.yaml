  - number: B2:1
    text: |-
      Deze appendix wordt gelezen in samenhang met bijlage 2 van de Regeling geneeskundige instanties, geneeskundigen en
      medische verklaringen voor de luchtvaart.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel1
  - number: B2:2
    text: |-
      1 Een keurling wordt ongeschikt verklaard wanneer deze niet vrij is van elke aangeboren of verkregen
      cardiovasculaire afwijking die de veiligheid onder normale werkomstandigheden nadelig kan beïnvloeden of waardoor
      hij plotseling ongeschikt kan worden.

      2 Bij elke keuring wordt een standaard twaalf-afleidingen elektrocardiogram in rust gemaakt.

      3 Inspanningselektrocardiografie is uitsluitend geïndiceerd op klinische gronden, overeenkomstig het eerste lid van
      bijlage A.

      4 Om de risico analyse te vergemakkelijken wordt, met inachtneming van het tweede en derde lid van bijlage A, het
      cholesterol gehalte bepaald bij

      a. de initiële keuring en vervolgens;

      b. eens per zes jaar, tot de eerste keuring na het bereiken van de veertigjarige leeftijd en vervolgens;

      c. eens per vijf jaar.

      5 Een keurling met perifeer vaatlijden wordt ongeschikt verklaard, voor of na chirurgische behandeling, tenzij
      er geen significante functionele beschadiging bestaat en coronair lijden of significante atheromen elders zijn
      uitgesloten.

      6 Een keurling met een afwijking aan een van de hartkleppen wordt ongeschikt verklaard, tenzij

      a. het een gering hartklepgebrek betreft en

      b. met gunstig resultaat cardiologisch geëvalueerd is overeenkomstig het elfde lid van bijlage A.

      7 Een keurling waarbij een hartklep is vervangen of hersteld, wordt ongeschikt verklaard, tenzij deze met gunstig
      resultaat cardiologische geëvalueerd is overeenkomstig het twaalfde en dertiende lid van bijlage A.

      8 Een keurling die systematisch is behandeld met een anticoagulans wordt ongeschikt verklaard, tenzij deze
      gedurende korte tijd behandeld wordt overeenkomstig het veertiende lid van bijlage A.

      9 Een keurling met een afwijking van het pericard, myocard of endocard wordt ongeschikt verklaard, totdat uit
      cardiologische evaluatie overeenkomstig het vijftiende lid van bijlage A blijkt dat deze afwijking geen verhoogd
      risico inhoudt.

      10 Een keurling met een congenitaal hartgebrek, voor en na chirurgische behandeling, wordt ongeschikt verklaard,
      tenzij

      a. het een geringe afwijking betreft en

      b. met gunstig resultaat cardiologisch is onderzocht overeenkomstig het zestiende lid van bijlage A.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel2
  - number: B2:3
    text: |-
      1 De bloeddruk wordt opgenomen overeenkomstig de techniek vermeld in het vierde lid van bijlage A.

      2 Als de bloeddruk bij voortduring hoger is dan 160 mm Hg systolisch en 95 mm Hg diastolisch, met of zonder
      behandeling, wordt de keurling ongeschikt verklaard.

      3 a. Medicatie ter controle van de bloeddruk is overeenkomstig het vijfde lid van bijlage A en moet te verenigen
      zijn met de veilige uitoefening van de functie.

      b. Bij aanvang van de medicamenteuze behandeling wordt een luchtverkeersleider tijdelijk ongeschikt verklaard, tot
      dat duidelijk is dat de medicatie geen significante bijwerkingen heeft.

      4 Aanvragers met ernstige verschijnselen van orthostatische hypotensie worden ongeschikt verklaard.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel3
  - number: B2:4
    text: |-
      1 a. Een keurling waarbij een coronair afwijking verondersteld wordt, wordt verder onderzocht.

      b. Een keurling met een asymptomatische, geringe, coronair afwijking wordt geschikt verklaard, met inachtneming van
      het zesde lid van bijlage A.

      2 Een keurling met een symptomatisch coronair lijden wordt ongeschikt verklaard.

      3 Een keurling wordt ongeschikt verklaard na een myocard infarct, tenzij wordt voldaan aan het zevende lid van
      bijlage A.

      4 Een keurling waarbij een bevredigend herstel wordt aangetoond na coronaire by-pass chirurgie of vaatplastiek,
      wordt geschikt verklaard overeenkomstig het achtste lid van bijlage A.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel4
  - number: B2:5
    text: |-
      1 Een keurling met een significante verstoring van het atrium ritme, hetzij paroxysmaal of bij voortduring, wordt
      ongeschikt verklaard in afwachting van cardiologische evaluatie overeenkomstig het negende en tiende lid van
      bijlage A.

      2 Een keurling met een asymptomatische sinus bradycardie of tachycardie wordt geschikt verklaard als er geen
      significante afwijking aan ten grondslag ligt.

      3 Een keurling met tekenen van sinoatriële afwijkingen wordt alleen geschikt verklaard na een gunstige evaluatie
      overeenkomstig het negende en tiende lid van bijlage A.

      4 Een keurling met een asymptomatisch geïsoleerd uniform ventriculair ectopisch complex wordt geschikt verklaard,
      mits deze bij frequente complexen of complexen met een afwijkende vorm een volledige cardiologische evaluatie
      ondergaat overeenkomstig het negende lid van bijlage A.

      5 a. Wanneer er geen andere afwijkingen zijn, wordt een keurling met een incompleet bundel tak block of stabiele
      linker as deviatie geschikt verklaard.

      b. Een keurling met een compleet rechter of linker bundeltak blok wordt cardiologisch geëvalueerd wanneer dit blok
      zich voor de eerste maal voordoet, overeenkomstig het negende en tiende lid van bijlage A.

      6 Een keurling met ventriculaire prae-excitatie wordt ongeschikt verklaard tenzij, uit cardiologische evaluatie
      overeenkomstig het negende lid van bijlage A, blijkt dat de keurling geschikt is.

      7 Een keurling met een endocardiale pacemaker wordt ongeschikt verklaard tenzij, uit cardiologische evaluatie
      overeenkomstig het tiende lid van bijlage A, blijkt dat de keurling geschikt is.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel5
  - number: B2:6
    text: |-
      1 Een keurling met een afwijking van het ademhalingsstelsel, congenitaal of verkregen, waarvan een functiebeperking
      het gevolg is, die de veiligheid onder normale werkomstandigheden nadelig kan beïnvloeden of waardoor hij
      plotseling ongeschikt kan worden, wordt ongeschikt verklaard.

      2 Röntgenonderzoek van hart en longen in het anterior/posterior vlak is vereist, als het op klinische of
      epidemiologische gronden geïndiceerd is.

      3 a. Een longfunctietest wordt bij iedere keuring verricht overeenkomstig het eerste lid van bijlage B.

      b. Een keurling met een significant gestoorde longfunctie wordt beoordeeld overeenkomstig het eerste lid van
      bijlage B.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel6
  - number: B2:7
    text: |-
      1 Een keurling met een ernstige chronische obstructieve longziekte of ernstig emphyseem wordt ongeschikt verklaard.

      2 Een keurling met een reactieve luchtwegziekte of astma bronchiale die medicatie nodig heeft, wordt beoordeeld
      overeenkomstig het tweede lid van bijlage B.

      3 Een keurling met een actieve ontsteking van de ademhalingsorganen wordt tijdelijk ongeschikt verklaard.

      4 Een keurling met sarcoïdosis wordt ongeschikt verklaard, overeenkomstig het derde lid van bijlage B.

      5 Een keurling met een spontane pneumothorax wordt ongeschikt verklaard tenzij voldaan wordt aan het vierde lid van
      bijlage B.

      6 Een keurling die een grote thorax-operatie heeft ondergaan wordt ongeschikt verklaard gedurende minimaal drie
      maanden na de operatie en zolang als noodzakelijk is overeenkomstig het vijfde lid van bijlage B.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel7
  - number: B2:8
    text: |-
      Een keurling met een afwijking van het spijsverteringsstelsel of de adnexae, congenitaal of verkregen, waarvan
      een functiebeperking het gevolg is die de veiligheid onder normale werkomstandigheden nadelig kan beïnvloeden of
      waardoor hij plotseling ongeschikt kan worden, wordt ongeschikt verklaard.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel8
  - number: B2:9
    text: |-
      1 Een keurling met een aandoening van de spijsverteringsorganen die medicatie behoeft of met pancreatitis, wordt
      ongeschikt verklaard in afwachting van de resultaten van onderzoek overeenkomstig het eerste lid van bijlage C.

      2 Een keurling met multiple galstenen of één enkele symptomatische grote galsteen wordt ongeschikt verklaard totdat
      behandeling met succes heeft plaatsgevonden met inachtneming van het tweede lid van bijlage C.

      3 Een keurling, die bij de initiële keuring een acute of inflammatoire darmziekte heeft in de voorgeschiedenis
      of met een klinische diagnose van een acute of inflammatoire darmziekte, wordt ongeschikt verklaard, tenzij wordt
      voldaan aan het derde lid van bijlage C.

      4 Een keurling die een acute of inflammatoire darmziekte ontwikkelde, wordt beoordeeld overeenkomstig het derde lid
      van bijlage C.

      5 Een keurling mag geen breuken te hebben, die incapaciterende symptomen tot gevolg kunnen hebben.

      6 Een keurling met een nasleep van ziekte of chirurgisch ingrijpen in een deel van het spijsverteringsstelsel
      of haar adnexae, waarvan een plotselinge ongeschiktheid het gevolg kan zijn, in het bijzonder een obstructie
      veroorzaakt door strictuur of compressie, wordt ongeschikt verklaard.

      7 Een keurling die een operatie aan het spijsverteringsstelsel of haar adnexae heeft ondergaan waarbij totale of
      gedeeltelijke verwijdering of omleiding van deze organen heeft plaatsgehad, wordt ongeschikt verklaard gedurende
      minimaal drie maanden na de operatie of zolang als noodzakelijk is met inachtneming van het vierde lid van bijlage
      C.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel9
  - number: B2:10
    text: |-
      1 Een keurling met een structurele metabole, voedings- of endocriene afwijking, congenitaal of verkregen, waarvan
      een functiebeperking het gevolg is, die de veiligheid onder normale werkomstandigheden nadelig kan beïnvloeden of
      waardoor hij plotseling ongeschikt kan worden, wordt ongeschikt verklaard.

      2 Een keurling met een metabole, voedings- of endocriene disfunctie wordt beoordeeld overeenkomstig het eerste lid
      van bijlage D.

      3 Een keurling met diabetes mellitus wordt beoordeeld overeenkomstig het tweede en derde lid van bijlage D.

      4 Een keurling met een insuline-afhankelijke diabetes wordt ongeschikt verklaard.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel10
  - number: B2:11
    text: |-
      1 Een keurling met een hematologische afwijking, congenitaal of verkregen, waarvan een functiebeperking het
      gevolg is, die de veiligheid onder normale werkomstandigheden nadelig kan beïnvloeden of waardoor hij plotseling
      ongeschikt kan worden, wordt ongeschikt verklaard.

      2 Een keurling met significant vergrote lymfeklieren, lokaal of algemeen of met een bloedziekte wordt ongeschikt
      verklaard, met inachtneming van het eerste lid van bijlage E.

      3 a. Het hemoglobine gehalte wordt bij iedere medische keuring bepaald;

      b. Een keurling met een significante anemie wordt ongeschikt verklaard, met inachtneming van het tweede lid van
      bijlage E.

      4 Een keurling met sickle cell disease wordt ongeschikt verklaard, met inachtneming van het tweede lid van bijlage
      E.

      5 a. Een keurling met acute leukemie wordt ongeschikt verklaard;

      b. Een keurling van een initiële medische keuring met een chronische leukemie wordt ongeschikt verklaard.

      c. Voor tussentijdse beoordeling of herhalingskeuring geldt het derde lid van bijlage E.

      6 Een keurling met een significante miltvergroting wordt ongeschikt verklaard, met inachtneming van het vierde lid
      van bijlage E.

      7 Een keurling met een significante polycythemie wordt ongeschikt verklaard, met inachtneming van het vijfde lid
      van bijlage E.

      8 Een keurling met een stollingsstoornis wordt ongeschikt verklaard, met inachtneming van het zesde lid van bijlage
      E.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel11
  - number: B2:12
    text: |-
      1 Een keurling met een structurele afwijking of ziekte van het urineweg systeem of haar adnexae, congenitaal of
      verkregen, waarvan een functiebeperking het gevolg is, die de veiligheid onder normale werkomstandigheden nadelig
      kan beïnvloeden of waardoor hij plotseling ongeschikt kan worden, wordt ongeschikt verklaard.

      2 a. Een keurling met een nierziekte wordt ongeschikt verklaard;

      b. Urine-onderzoek maakt deel uit van elke keuring;

      c. In de urine mogen geen afwijkingen voorkomen, die een goede uitoefening van de operationele functie belemmeren;

      d. Bijzondere aandacht wordt besteed aan ziekten die de urinewegen en de geslachtsorganen betreffen, met
      inachtneming het eerste lid van bijlage F.

      3 Een keurling met een of meerdere stenen in de urinewegen wordt ongeschikt verklaard. Geschiktverklaring wordt
      overwogen met inachtneming van het tweede lid van bijlage F.

      4 a. Een keurling met een nasleep van ziekte of chirurgisch ingrijpen aan de nieren of een ander deel van het
      urogenitaal stelsel, die aanleiding kan geven tot plotselinge incapacitatie, in het bijzonder een obstructie
      veroorzaakt door strictuur of compressie, wordt ongeschikt verklaard;

      b. Een keurling met een status na een genezen nephrectomie zonder hypertensie of uremie kan geschikt verklaard
      worden, overeenkomstig het derde lid van bijlage F.

      5 Een keurling die een belangrijke operatie aan urogenitaal stelsel of haar adnexae heeft ondergaan waarbij totale
      of gedeeltelijke verwijdering of omleiding van deze organen heeft plaatsgehad, wordt ongeschikt verklaard gedurende
      minimaal drie maanden na de operatie of zolang als noodzakelijk is, met inachtneming van het derde en vierde lid
      van bijlage C en het vierde lid van bijlage F.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel12
  - number: B2:13
    text: |-
      1 Een keurling met een voorgeschiedenis of klinische diagnose van een sexueel overdraagbare ziekte of infectie,
      waarvan een functiebeperking het gevolg is, die de veiligheid onder normale werkomstandigheden nadelig kan
      beïnvloeden of waardoor hij plotseling ongeschikt kan worden, wordt ongeschikt verklaard.

      2 Bijzondere aandacht wordt besteed aan een voorgeschiedenis of klinische tekenen van:

      a. HIV positiviteit;

      b. verminderde functie van het immuun systeem;

      c. infectieuze hepatitis;

      d. syphilis;

      met inachtneming van bijlage G.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel13
  - number: B2:14
    text: |-
      1 Een keurling met een functionele of structurele gynaecologische of verloskundige aandoening, waarvan een
      functiebeperking het gevolg is, die de veiligheid onder normale werkomstandigheden nadelig kan beïnvloeden of
      waardoor zij plotseling ongeschikt kan worden, wordt ongeschikt verklaard.

      2 Een keurling met een voorgeschiedenis van ernstige menstruatie stoornissen die niet door behandeling te
      beïnvloeden zijn, wordt ongeschikt verklaard.

      3 a. Zwangerschap heeft tijdelijke ongeschikt verklaring tot gevolg. Als bij verloskundige evaluatie de
      zwangerschap volledig normaal blijkt te zijn, wordt de keurling geschikt verklaard tot het einde van de 36e week
      van de zwangerschap, overeenkomstig het eerste lid van bijlage H;

      b. Betrokkene kan haar taak als luchtverkeersleider weer uitoefenen nadat duidelijk is dat zij volledig hersteld is
      na de bevalling of beëindiging van de zwangerschap.

      4 Een keurling die een belangrijke gynaecologische operatie heeft ondergaan wordt ongeschikt verklaard gedurende
      minimaal drie maanden na de operatie of zolang als noodzakelijk is, met inachtneming van het tweede lid van bijlage
      H.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel14
  - number: B2:15
    text: |-
      1 Een keurling met een functionele of structurele afwijkingen van botten, gewrichten, spieren en pezen, congenitaal
      of verkregen, waarvan een functiebeperking het gevolg is, die de veiligheid onder normale werkomstandigheden
      nadelig kan beïnvloeden , of waardoor hij plotseling ongeschikt kan worden, wordt ongeschikt verklaard.

      2 De bouw en functie van het bewegingsapparaat moet voldoende zijn om onder normale werkomstandigheden zijn functie
      veilig uit te oefenen. Een keurling met onvoldoende functie van zijn bewegingsapparaat wordt ongeschikt verklaard
      met inachtneming van het eerste lid van bijlage I.

      3 Een keurling met een nasleep van ziekte, ongeval of een congenitale afwijking van de botten, gewrichten, spieren
      of pezen met of zonder chirurgische behandeling wordt beoordeeld overeenkomstig het eerste, tweede en derde lid van
      bijlage I.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel15
  - number: B2:16
    text: |-
      1 Een keurling met een medische voorgeschiedenis of klinische diagnose van enige psychiatrische ziekte of gebrek,
      acuut of chronisch, congenitaal of verkregen, waarvan een functiebeperking het gevolg is, die de veiligheid
      onder normale werkomstandigheden nadelig kan beïnvloeden of waardoor hij plotseling ongeschikt kan worden, wordt
      ongeschikt verklaard.

      2 Met inachtneming van bijlage J, wordt bijzondere aandacht besteed aan:

      a. psychose;

      b. persoonlijkheidsstoornissen, met name als deze ernstig genoeg zijn om te resulteren in onaangept gedrag;

      c. geestesgestoordheid en neurose;

      d. alcoholisme;

      e. gebruik of misbruik van psychotrope geneesmiddelen of andere stoffen met of zonder afhankelijkheid.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel16
  - number: B2:17
    text: |-
      1 Een keurling met een medische voorgeschiedenis of klinische diagnose van enige neurologische ziekte, acuut
      of chronisch, congenitaal of verkregen te hebben, waarvan een functiebeperking het gevolg is, die de veiligheid
      onder normale werkomstandigheden nadelig kan beïnvloeden of waardoor hij plotseling ongeschikt kan worden, wordt
      ongeschikt verklaard.

      2 Met inachtneming van bijlage K, wordt bijzondere aandacht besteed aan:

      a. progressieve ziekte van het zenuwstelsel;

      b. epilepsie en convulsieve storingen;

      c. aandoeningen met een sterke neiging tot cerebrale dysfunctie;

      d. bewustzijnsstoornissen en bewustzijnsverlies;

      e. schedel trauma.

      3 Electroëncephalografie wordt uitgevoerd bij de initiële keuring en als dit geïndiceerd wordt op klinische gronden
      of op grond van de voorgeschiedenis van de keurling.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel17
  - number: B2:18
    text: |-
      1 Een keurling met een afwijking van de functie van de ogen of hun adnexae of enige actieve pathologische
      aandoening, congenitaal of verkregen, acuut of chronisch, of enige nasleep van oogoperaties of trauma waarvan
      een functiebeperking het gevolg is, die de veiligheid onder normale werkomstandigheden nadelig kan beïnvloeden of
      waardoor hij plotseling ongeschikt kan worden, wordt ongeschikt verklaard, met inachtneming van het eerste lid van
      bijlage L.

      2 Een uitgebreid ophthalmologisch onderzoek wordt uitgevoerd bij de initiële keuring met inachtneming van het
      tweede lid van bijlage L.

      3 Een routine oogonderzoek maakt deel uit van alle keuringen, met inachtneming van het derde lid van bijlage L.

      4 Een uitgebreid oogonderzoek wordt verricht overeenkomstig de herhalingskeuring en tussentijdse beoordeling met
      inachtnemening van het vierde lid van bijlage L met de volgende tussenpozen:

      a. eens per zes jaar tot de eerste keuring na het bereiken van de veertigjarige leeftijd en vervolgens;

      b. eens per twee jaar.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel18
  - number: B2:19
    text: |-
      1 a. Een keurling met een gezichtsscherpte in de verte, met of zonder correctie, van 6/9 of beter in elk oog
      afzonderlijk wordt geschikt verklaard.

      b. Binoculair dient de gezichtsscherpte 6/6 of meer te bedragen (zie dit artikel lid 8).

      c. Er worden geen eisen gesteld aan de ongecorrigeerde minimale gezichtsscherpte.

      2 a. Refractie afwijking wordt gedefinieerd als het verschil met emmetropie in dioptrieën in de meest ametrope
      meridiaan.

      b. De refractie wordt bepaald volgens de standaard methode.

      c. De keurling wordt geschikt beschouwd als hij voldoet aan de volgende refractie-eisen:

      1º bij de initiële keuring mag de refractie afwijking niet meer dan ± 3 dioptrieën te bedragen met inachtneming van
      bijlage M;

      2º . bij herhalingskeuring, wordt een keurling met een refractie afwijking boven +3 en -5 dioptrieën, na uitgebreid
      ophtalmologisch onderzoek geschikt verklaard. Operationele beperkingen kunnen opgelegd worden;

      3º een keurling met een astigmatische component van meer dan 2.0 dioptrieën wordt ongeschikt verklaard;

      4º het verschil in refractie afwijking tussen beide ogen (anisometropie) mag niet meer dan 2.0 dioptrieën bedragen.

      d. De ontwikkeling van presbyopie wordt bij iedere keuring gevolgd.

      e. Een keurling wordt onderworpen aan een beeldschermtest met een afstand van 60 cm. De vereiste gezichtsscherpte
      wordt gemeten, zo nodig met de voorgeschreven correctie, en bedraagt 0,5 voor elk oog afzonderlijk.

      3 a. Een keurling met een significante stoornis in het binoculair zien wordt ongeschikt verklaard.

      b. Er worden geen eisen gesteld aan het diepte zien, met inachtneming van het derde lid van bijlage M.

      4 Een keurling met diplopie wordt ongeschikt verklaard.

      5 Een keurling met een abnormale convergentie wordt ongeschikt verklaard, met inachtneming van het vierde lid van
      bijlage M.

      6 Een keurling waarbij de oogspieren niet in evenwicht zijn, gemeten met de gebruikelijke correctie, als deze is
      voorgeschreven, met heteroforieën groter dan:

      a. - 1.0 prisma dioptrieën hyperforie op 6 meter;
        - 6.0 prisma dioptrieën esoforie op 6 meter;
        - 8.0 prisma dioptrieën exoforie op 6 meter, en

      b. - 1.0 prisma dioptrieën hyperforie op 33 cm;
        - 6.0 prisma dioptrieën esoforie op 33 cm;
        - 12.0 prisma dioptrieën exoforie op 33 cm.

      wordt ongeschikt verklaard, tenzij de fusiebreedte voldoende is om asthenope klachten en diplopie te voorkomen.

      7 Een keurling met een abnormaal gezichtsveld wordt ongeschikt verklaard, met inachtneming van het derde lid van
      bijlage M.

      8 Een keurling die alleen aan de visuseisen kan voldoen met behulp van correctie, wordt alleen geschikt verklaard
      als de corrigerende lenzen een optimale visus verschaffen en zij geschikt zijn voor operationeel gebruik.

      9 Als een keurling corrigerende lenzen voor operationeel gebruik nodig heeft, wordt deze alleen geschikt verklaard
      wanneer

      a. de corrigerende lenzen de keurling in staat te stellen aan de visuseisen te voldoen bij alle werkafstanden, en

      b. niet meer dan één paar lenzen volstaat om aan de visuseisen te voldoen.

      10 De keurling is er voor verantwoordelijk dat een reserveset van gelijkelijk corrigerende lenzen onder handbereik
      is bij het verrichten van de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel19
  - number: B2:20
    text: |-
      1 Normaal kleurenonderscheidingsvermogen wordt gedefinieerd als het vermogen de Ishihara test of de test op Nagel’s
      anomaloscoop als een normale trichromaat uit te voeren, met inachtneming van het eerste lid van bijlage N.

      2 a. Een keurling wordt geschikt verklaard wanneer deze een normaal kleuren-onderscheidingsvermogen heeft of
      ‘colour safe’ is;

      b. Een keurling die de Ishihara’s test onvoldoende doet kan als ‘colour safe’ beschouwd worden als hij uitgebreid
      kleurenonderzoek met een goedgekeurde methode voldoende doet met inachtneming van het tweede lid van bijlage N.

      3 Een keurling die de goedgekeurde kleurentest onvoldoende doet, wordt als ‘colour unsafe’ beschouwd en wordt
      ongeschikt verklaard.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel20
  - number: B2:21
    text: |-
      1 Een keurling met een afwijking in de functie van de oren, neus, sinussen of keel, inclusief mondholte en larynx,
      of actieve pathologie, congenitaal of verkregen, acuut of chronisch, of enige nasleep van chirurgisch ingrijpen of
      trauma, waarvan een functiebeperking het gevolg is, die de veiligheid onder normale werkomstandigheden nadelig kan
      beïnvloeden of waardoor hij plotseling ongeschikt kan worden, wordt ongeschikt verklaard.

      2 2. Een uitgebreid otorhinolaryngologisch onderzoek wordt verricht met inachtneming van het eerste en tweede lid
      van bijlage O bij:

      a. de initiële keuring en vervolgens;

      b. daarna eens per 6 jaar tot de eerste keuring na het bereiken van de veertigjarige leeftijd en vervolgens;

      c. eens per twee jaar.

      3 Een routine keel-neus- en ooronderzoek wordt bij elke keuring verricht, met inachtneming van bijlage O.

      4 Een keurling met een van de volgende ziekten of afwijkingen wordt ongeschikt verklaard:

      a. een actief ziekteproces, acuut of chronisch, van het binnen- of middenoor;

      b. een niet genezen perforatie of dysfunctie van het trommelvlies, met inachtneming van het derde lid van bijlage
      O;

      c. gestoorde vestibulair functie, met inachtneming van het vierde lid van bijlage O;

      d. significante passagestoornis in de neus, of gestoorde sinus-functie;

      e. significante misvorming of significante, acute of chronische infectie van de mondholte of bovenste luchtwegen;

      f. significante stem- of spraakstoornis.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel21
  - number: B2:22
    text: |-
      1 a. Het gehoor wordt bij elke keuring getest;

      b. De keurling die conversatiespraak niet met ieder oor afzonderlijk hoort op een afstand van 2 meter van de
      onderzoeker en met de rug naar de onderzoeker toegekeerd, wordt ongeschikt verklaard.

      2 Een audiogram wordt gemaakt met inachtneming van het eerste lid van bijlage P;

      a. bij de initiële keuring en vervolgens;

      b. eens per vier jaar tot het bereiken van de veertigjarige leeftijd en vervolgens;

      c. eens per twee jaar.

      3 a. Bij de initiële keuring mag er voor elk oor afzonderlijk, geen gehoorsverlies groter dan 20 dB(HL) bestaan op
      de frequenties 500, 1000 and 2000 Hz, of van meer dan 35 dB(HL) op 3000 Hz;

      b. Een keurling wiens gehoorsverlies binnen 5 dB van deze grenzen is, wordt tot het bereiken van de veertigjarige
      leeftijd ten minste eens per twee jaar en na het bereiken van de veertigjarige leeftijd ten minste eens per jaar
      getoetst op toon audiometrie.

      4 a. Bij een herhalingskeuring mag er voor elk oor afzonderlijk geen gehoorsverlies groter dan 35 dB zijn op de
      frequenties 500, 1000, en 2000 Hz, of groter dan 50 dB op 3000 Hz;

      b. Een keurling wiens gehoorsverlies binnen 5 dB van deze grenzen is op de onderzochte frequenties, wordt ten
      minste jaarlijks getoetst met behulp van toonaudiometrie.

      5 Bij vernieuwing of verlenging van de medische geschiktverklaring kan de keurling met hypoacusis geschikt
      verklaard worden als het spraakaudiogram een goede verstaanbaarheid aangeeft, met inachtneming van het tweede lid
      van bijlage P.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel22
  - number: B2:23
    text: |-
      1 a. Een keurling met een psychologische afwijking, met name een beperking in operationele vaardigheden of enige
      relevante persoonlijkheidstrek, waarvan een functiebeperking het gevolg is, die de veiligheid onder normale
      werkomstandigheden nadelig kan beïnvloeden of waardoor hij plotseling ongeschikt kan worden, wordt ongeschikt
      verklaard;

      b. Een psychologische evaluatie, overeenkomstig in het eerste lid van bijlage Q, is vereist als er twijfel bestaat
      over de geschiktheid of persoonlijkheid van een keurling, met inachtneming van het tweede lid van bijlage Q.

      2 Als een psychologische evaluatie noodzakelijk geacht wordt zal de keuringsinstelling gebruik maken van haar eigen
      psychologische afdeling.

      3 De psycholoog rapporteert aan de keuringsafdeling met zijn oordeel en advies.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel23
  - number: B2:24
    text: |-
      1 Een keurling wordt ongeschikt verklaard wanneer deze een dermatologische afwijking heeft, waarvan een
      functiebeperking het gevolg is, die de veiligheid onder normale werkomstandigheden nadelig kan beïnvloeden of
      waardoor hij plotseling ongeschikt kan worden.

      2 Met inachtneming van bijlage R wordt bijzondere aandacht besteed aan de volgende afwijkingen en ziekten:

      a. exogeen en endogeen eczeem;

      b. ernstige psoriasis;

      c. bacteriële infecties;

      d. geneesmiddel allergieën;

      e. bulleuze afwijkingen;

      f. maligne huidafwijkingen;

      g. urticaria.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel24
