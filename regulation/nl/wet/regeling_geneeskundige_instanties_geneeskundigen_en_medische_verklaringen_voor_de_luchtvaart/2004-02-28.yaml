  - number: 15a
    text: |-
      1 In afwijking van artikel 15, eerste lid, kan de minister, al dan niet onder beperkingen, een medische verklaring
      klasse 2 verlengen, als:

      a. hij een aanvraagformulier daartoe heeft ontvangen, en

      b. voldaan is aan artikel 10, tweede lid.

      2

      Een op basis van het eerste lid verlengde medische verklaring bevat in ieder geval de beperking `slechts geldig in
      combinatie met een bewijs van bevoegdheid RPL(G)' respectievelijk `slechts geldig in combinatie met een bewijs van
      bevoegdheid RPL(FB)'.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel15a
  - number: '16'
    text: |-
      1 De minister stelt het model van de medische verklaring vast.

      2 De medische verklaring omvat in ieder geval de volgende gegevens:

      a. referentienummer,

      b. klasse 1, 2 of 3,

      c. volledige naam, geboortedatum en nationaliteit van de houder,

      d. datum en plaats van de eerste keuring van de houder,

      e. datum en plaats van de laatste uitgebreide keuring van de houder,

      f. datum van de laatste electrocardiogram,

      g. datum van de laatste audiogram,

      h. beperkingen of voorwaarden waaronder de medische verklaring is afgegeven,

      i. datum van de keuring die ten grondslag ligt aan de medische verklaring,

      j. handtekening van de minister, en

      k. handtekening van de houder.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel16
  - number: '17'
    text: |-
      1 Als de houder van een medische verklaring zich tot 45 dagen voor het verstrijken van de termijn van geldigheid
      medisch laat keuren zal de geldigheidsduur van een af te geven verlengde medische verklaring worden gerekend vanaf
      de verloopdatum van de eerstgenoemde medische verklaring.

      2 Als de houder van een medische verklaring zich niet tot 45 dagen voor het verstrijken van de termijn van
      geldigheid medisch laat keuren zal de geldigheidsduur van een af te geven verlengde medische verklaring worden
      gerekend vanaf de datum van de door de aanvrager feitelijk ondergane keuring.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel17
  - number: '18'
    text: |-
      In het geval van:

      a. het bewustzijn van enige tussentijdse verslechtering van hun medische gesteldheid,

      b. een ernstige verwonding, of

      c. een ziekte van 21 dagen of langer;

      waardoor hun gezondheidstoestand zodanig is, dat zij niet meer in staat zijn de werkzaamheden, waarvoor een bewijs
      van bevoegdheid is verleend, te verrichten, melden houders van een medische verklaring dit onverwijld aan de
      minister. Luchtverkeersleiders en AFISO’s doen dit door tussenkomst van hun bedrijfsarts.
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel18
  - number: '19'
    text: |-
      1 Houders van een medische verklaring laten onverwijld door een geautoriseerde geneeskundige instantie of
      geneeskundige beoordelen of hun gezondheidstoestand nog zodanig is dat zij in staat zijn de werkzaamheden, waarvoor
      hen een bewijs van bevoegdheid is verleend, te verrichten, in het geval van:

      a. twijfel omtrent het gestelde in [artikel 18][ref1],

      b. een ziekenhuisopname van meer dan twaalf uur,

      c. een medische ingreep, al dan niet onder lokale of regionale verdoving of verdoving door middel van een
      ruggemergprik,

      d. het voorgeschreven zijn van regelmatig gebruik van medicijnen, of

      e. het voorgeschreven zijn van regelmatig gebruik van corrigerende bril, glazen of lenzen.

      Luchtverkeersleiders en AFISO’s doen dit door tussenkomst van hun bedrijfsarts.

      2 De geautoriseerde geneeskundige instantie of geneeskundige vormt zich een oordeel, in het licht van de relevante
      medische eisen, keuringsmethoden en procedures bedoeld in [artikel 13, eerste lid][ref2], en [bijlage 2][ref3],
      tweede paragraaf, over de vraag of de gezondheidstoestand van de houder van de medische verklaring zodanig is, dat
      deze al dan niet in staat is de werkzaamheden, waarvoor hem een bewijs van bevoegdheid is verstrekt, te verrichten.

      3 De geautoriseerde geneeskundige instantie of geneeskundige meldt het oordeel onverwijld gemotiveerd aan de
      minister en aan de houder van de medische verklaring. De motivering bevat in ieder geval een verwijzing naar
      de relevante medische eisen, keuringsmethoden en procedures bedoeld in [artikel 13, eerste lid][ref4], en
      [bijlage 2][ref5], tweede paragraaf.


