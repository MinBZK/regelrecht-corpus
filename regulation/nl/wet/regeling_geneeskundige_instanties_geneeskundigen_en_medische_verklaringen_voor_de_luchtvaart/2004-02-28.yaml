  - number: '7'
    text: |-
      Een geneeskundige kan een autorisatie verkrijgen wanneer hij voldoet aan de volgende eisen:

      a voorafgaand aan de autorisatie voldoende luchtvaartgeneeskundige training hebben ontvangen, alsmede voldoende
      praktische kennis van en ervaring met de manier waarop de bevoegdheden worden uitgeoefend waarvoor een medische
      verklaring noodzakelijk is hebben opgedaan, blijkend uit:

      1º. als het een autorisatie voor het uitvoeren van alleen keuringen klasse 2 betreft:

      a. het bezit van een certificaat van een instelling die de cursus ‘elementaire training in de
      luchtvaartgeneeskunde’, als in JAR-FCL 3.090 lid d sub 1 onder (i) en (ii), aanbiedt, aangevend dat onder de
      verantwoordelijkheid van die instelling de genoemde cursus met goed gevolg is doorlopen, en

      b. het met goed gevolg hebben doorlopen van een door de minister geaccordeerde adaptatiecursus: geneeskundige voor
      recreatieve luchtvaart, als in bijlage 1a bij deze regeling.

      2º. als het een autorisatie voor het uitvoeren van medische keuringen klasse 1, 2 en 3 betreft:

      a) het voldoen aan de eisen onder sub a1,

      b) het bezit van een certificaat van een instelling die de cursus ‘training in de luchtvaartgeneeskunde
      voor gevorderden’, als in JAR-FCL 3.090 lid d sub 2 onder (i) en (ii), aanbiedt, aangevend dat onder de
      verantwoordelijkheid van die instelling de genoemde cursus met goed gevolg is doorlopen, en

      c) het met goed gevolg hebben doorlopen van een door de minister geaccordeerde adaptatiecursus: geneeskundige voor
      luchtverkeersdienstverleners, als in bijlage 1b bij deze regeling,

      b gebruik maken van apparatuur, geschikt voor het uitvoeren van medische keuringen van de klasse waarvoor de
      autorisatie geldt,

      c keuringen uitvoeren en de hieruit resulterende adviesrapportages opstellen met inachtneming van
      [artikel 13, eerste lid][ref1], met een minimum van tien keuringen per jaar,

      c een keuring van elke klasse waarvoor de autorisatie geldt in principe binnen een dag afronden,

      d de op basis van deze Regeling te versturen rapporten of andere gegevens op een naar het oordeel van de minister
      noodzakelijke wijze versturen, met inachtneming van de Wet Persoonsregistratie, of werkzaam zijn binnen een
      geautoriseerde geneeskundige instantie,

      e zonodig het uitvoeren van tussentijdse beoordelingen en het melden van de hieruit resulterende oordelen
      zoals bedoeld in [artikel 19, tweede en derde lid][ref2], [artikel 20, tweede en derde lid][ref3],
      [artikel 21, tweede en derde lid][ref4],

      f als een opdracht, genoemd in [artikel 15, tweede lid onder a][ref5], wordt gegeven, hieraan gevolg geven,

      g [artikel 11][ref6], [artikel 13, tweede lid][ref7], en indien van toepassing [artikel 14][ref8] in acht nemen,

      h gedurende de autorisatieperiode minimaal twintig uur door de minister goedgekeurde herhalingstraining in de
      luchtvaartgeneeskunde, als in [bijlage 1c][ref9], volgen, en

      i in het bezit zijn van een geldig ISO-9002 certificaat voor de interne organisatie, afgegeven door een door de
      Raad van Accreditatie voor ISO-9002 certificaties geaccrediteerde certificeringsinstelling.


