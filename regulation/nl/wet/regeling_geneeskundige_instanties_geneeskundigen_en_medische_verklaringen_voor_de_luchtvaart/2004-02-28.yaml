  - number: '4'
    text: |-
      Een geneeskundige instantie kan een autorisatie verkrijgen wanneer hij voldoet aan de volgende eisen:

      a. een vestiging hebben binnen Nederland,

      b. behoren tot of samenwerken met een gevestigd medisch instituut of ziekenhuis,

      c. zich bezighouden met luchtvaartgeneeskunde en gerelateerde activiteiten,

      d. een geneeskundige in dienst hebben in een leidinggevende positie, die

      1. in het bezit is van een autorisatie voor keuringen van alle klassen, en 2° verantwoordelijk is voor het
      coördineren en accorderen van de verwerking vankeuringsresultaten en het accorderen en ondertekenen van
      adviesrapportages;

      e. gebruik maken van geneeskundigen voor het feitelijke keuren die voldoen aan de eisen als vervat in
      [artikel 7, onderdeel a, onder 2°][ref1],

      f. gebruik maken van apparatuur, geschikt voor het uitvoeren van keuringen klasse 1, 2 en 3,

      g. keuringen uitvoeren en de hieruit resulterende adviesrapportages opstellen met inachtneming van
      [artikel 13, eerste lid][ref2],

      h. als instantie een medische keuring van elke klasse in principe binnen een dag afronden,

      i. zonodig het uitvoeren van tussentijdse beoordelingen en het melden van de hieruit resulterende oordelen
      zoals bedoeld in [artikel 19, tweede en derde lid][ref3], [artikel 20, tweede en derde lid][ref4],
      [artikel 21, tweede en derde lid][ref5],

      j. als een opdracht, genoemd in [artikel 15, tweede lid onder a][ref6] , wordt gegeven, hieraan gevolg geven,

      k. [artikel 11][ref7], [artikel 13, tweede lid][ref8], en indien van toepassing [artikel 14][ref9] in acht nemen,

      l. de op basis van deze Regeling te versturen rapporten of andere gegevens op een naar het oordeel van de minister
      noodzakelijke wijze versturen, met inachtneming van de Wet Persoonsregistratie, en

      m. in het bezit zijn van een geldig ISO-9002 certificaat voor de interne organisatie, afgegeven door een door de
      Raad van Accreditatie voor ISO-9002 certificaties geaccrediteerde certificeringsinstelling.


