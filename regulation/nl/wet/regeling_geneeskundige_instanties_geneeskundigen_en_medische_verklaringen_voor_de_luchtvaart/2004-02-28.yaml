preamble:
  text: |-
    Gelet op de artikelen 30, 31, 32, 33, 34, 35 van het Besluit bewijzen van bevoegdheid voor de luchtvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            adviescommissie:

              commissie, bedoeld in
      [artikel 32, tweede lid, van het Besluit bewijzen van bevoegdheid voor de luchtvaart][ref1];



            b
            gevestigd medisch instituut:

              een organisatie met klinische onderzoeks- en trainings-faciliteiten die experts, waaronder
      luchtvaartmedische experts, beschikbaar heeft op het voor deze regeling relevante gebied van luchtvaartgeneeskunde
      en de daarbij gebruikte faciliteiten;



            c
             keuringen klasse 1:

              keuringen, uitgevoerd voorafgaand aan de beslissing van de minister over de afgifte van een medische
      verklaring klasse 1;



            d
            keuringen klasse 2:

              keuringen, uitgevoerd voorafgaand aan de beslissing van de minister over de afgifte van een medische
      verklaring klasse 2;



            e
             keuringen klasse 3:

              keuringen, uitgevoerd voorafgaand aan de beslissing van de minister over de afgifte van een medische
      verklaring klasse 3;



            f
             minister:

              minister van Verkeer en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel32
    url: https://wetten.overheid.nl/BWBR0010686/2004-02-28#Artikel1
