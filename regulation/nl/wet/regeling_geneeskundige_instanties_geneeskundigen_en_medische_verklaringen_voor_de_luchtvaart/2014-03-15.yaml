  - number: '10'
    text: |-
      Om in aanmerking te kunnen komen voor een eerste afgifte of een verlenging van een medische verklaring, laat een
      persoon zich medisch keuren bij een geautoriseerde geneeskundige instantie of geautoriseerde geneeskundige.
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel10
  - number: '11'
    text: 'Keuringen klasse 3 worden uitgevoerd:'
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel11
  - number: 11.a
    text: |-
      bij een geautoriseerde geneeskundige instantie als het een keuring betreft ten behoeve van een voor het eerst af te
      geven medische verklaring, of
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel11
  - number: 11.b
    text: |-
      bij een geautoriseerde geneeskundige instantie of geautoriseerde geneeskundige als het een keuring betreft ten
      behoeve van een te verlengen medische verklaring.
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel11
  - number: '12.1'
    text: |-
      De keurling voldoet, voorafgaand aan de keuring bij de geautoriseerde geneeskundige instantie of geautoriseerde
      geneeskundige waar de keuring plaatsvindt, aan de volgende eisen
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel12
  - number: 12.1.a
    text: MED.A.035 van verordening (EU) nr. 1178/2011;
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel12
  - number: 12.1.b
    text: |-
      vult in en ondertekent een door de minister verstrekt aanvraagformulier voor de afgifte van een medische
      verklaring, volgens de instructies zoals ontvangen bij de geautoriseerde geneeskundige instantie of geautoriseerde
      geneeskundige; en
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel12
  - number: 12.1.c
    text: |-
      voldoet de door de geautoriseerde geneeskundige instantie of geautoriseerde geneeskundige voor de minister te
      innen vergoeding voor de kosten van de handelingen ten behoeve van de aanvraag tot de afgifte of verlenging van een
      medische verklaring, volgens het op het moment van de aanvraag geldende tarief.
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel12
  - number: '12.2'
    text: |-
      Als de keurling niet aan het eerste lid voldoet, vindt geen medische keuring plaats en geeft de minister geen
      medische verklaring af.
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel12
  - number: '13.1'
    text: |-
      De medische keuring klasse 3 en de hieruit resulterende adviesrapportages aan de minister worden uitgevoerd en
      opgesteld met inachtneming van de medische eisen, voorgeschreven keuringsmethoden, voorgeschreven procedures,
      alsmede de eisen gesteld aan de adviesrapportage, bedoeld in [bijlage 2][ref1], appendix 1, bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0010686
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel13
