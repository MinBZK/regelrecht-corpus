        bwb_id: BWBR0010686
  - number: '13.2'
    text: |-
      De geautoriseerde geneeskundige instantie of geautoriseerde geneeskundige int de vergoeding voor de kosten van de
      handelingen ten behoeve van de aanvraag tot de afgifte of verlenging van een medische verklaring en draagt deze af
      aan de minister.
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel13
  - number: '14.1'
    text: 'Als een houder van een medische verklaring klasse 3:'
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel14
  - number: 14.1.a
    text: |-
      deze meer dan vijf jaar heeft laten verlopen, wordt hij gekeurd als betrof het een eerste keuring voor een door de
      minister af te geven medische verklaring,
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel14
  - number: 14.1.b
    text: |-
      deze meer dan negentig dagen maar minder dan vijf jaar heeft laten verlopen laat hij zich keuren bij een
      geautoriseerde geneeskundige instantie, of
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel14
  - number: 14.1.c
    text: deze minder dan negentig dagen heeft laten verlopen gelden voor de houder geen bijzondere regels.
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel14
  - number: '14.2'
    text: |-
      In de gevallen, bedoeld in het eerste lid, onderdeel a, of het eerste lid, onderdeel b, voor zover de houder
      van een medische verklaring deze langer dan twee jaar heeft laten verlopen, vraagt de keurende geautoriseerde
      geneeskundige instantie of geautoriseerde geneeskundige voorafgaand aan de medische keuring de medische gegevens
      van de keurling die berusten bij de minister op.
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel14
  - number: '15.1'
    text: De minister kan, al dan niet onder beperkingen, een medische verklaring klasse 3 afgeven of verlengen, als:.
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel15
  - number: 15.1.a
    text: |-
      hij een aanvraagformulier als bedoeld in [artikel 12, eerste lid, onderdeel d][ref1], daartoe heeft ontvangen,


      [ref1]: https://wetten.overheid.nl/BWBR0010686#Artikel12
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0010686
        artikel: '12'
        hoofdstuk: '4'
  - number: 15.1.b
    text: hij een adviesrapportage van een geautoriseerde geneeskundige instantie of geneeskundige daartoe heeft ontvangen,
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel15
  - number: 15.1.c
    text: |-
      voldaan is aan [artikel 13, eerste lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0010686#Artikel13
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0010686
        artikel: '13'
        hoofdstuk: '4'
  - number: 15.1.d
    text: |-
      de gezondheidstoestand van de aanvrager zodanig is dat met afgifte of verlenging de veiligheid niet in gevaar kan
      worden gebracht.
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel15
  - number: '15.2'
    text: 'Ten behoeve van het besluit als bedoeld in het eerste lid kan de minister:'
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel15
  - number: 15.2.a
    text: |-
      de keurende geautoriseerde geneeskundige instantie of geautoriseerde geneeskundige opdragen nadere noodzakelijke
      gegevens aan te leveren of nader onderzoek te laten uitvoeren, of,
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel15
  - number: 15.2.b
    text: nader onderzoek door een derde laten uitvoeren.
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel15
  - number: '15.3'
    text: |-
      Als de gekeurde alleen onder beperkingen in aanmerking zou kunnen komen voor een medische verklaring of een
      verlenging daarvan, geeft de minister slechts dan een medische verklaring af of verlengt deze slechts dan, nadat
      aandacht is geschonken aan:
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel15
  - number: 15.3.a
    text: het eventuele medische gebrek van de gekeurde in relatie tot diens activiteiten,
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel15
  - number: 15.3.b
    text: de vaardigheden en ervaring van de gekeurde voor wat betreft diens activiteiten,
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel15
  - number: 15.3.c
    text: een praktische test, indien noodzakelijk, en
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel15
  - number: 15.3.d
    text: de relevantie van het afgeven van een medische verklaring onder beperkingen.
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel15
  - number: '15.4'
    text: |-
      Als een medische verklaring of een verlenging daarvan alleen kan worden afgegeven onder oplegging van meer dan
      een beperking, geschiedt dit niet dan nadat de minister aandacht heeft besteed aan de som van de effecten van de
      betreffende beperking(en) of voorwaarde(n) op de vliegveiligheid.
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel15
  - number: '15.5'
    text: |-
      De minister kan onder meer de volgende beperkingen verbinden aan een af te geven of te verlengen medische
      verklaring klasse 3:
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel15
  - number: 15.5.a
    text: slechts geldig gedurende een in de medische verklaring aangegeven aantal maanden (TML);
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel15
  - number: 15.5.b
    text: |-
      slechts geldig als een corrigerende bril of corrigerende contactlenzen worden gedragen, alsmede een corrigerende
      bril in reserve wordt gehouden (VDL);
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel15
  - number: 15.5.c
    text: |-
      slechts geldig als een corrigerende bril met multifocale glazen wordt gedragen, alsmede een corrigerende bril in
      reserve wordt gehouden (VML);
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel15
  - number: 15.5.d
    text: |-
      slechts geldig als een corrigerende bril voor het zien op korte afstand bij de hand wordt gehouden, alsmede een
      corrigerende bril in reserve wordt gehouden (VNL);
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel15
  - number: 15.5.e
    text: bijzondere beperkingen zoals gespecificeerd (SSL);
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel15
  - number: 15.5.f
    text: vergt oogheelkundig onderzoek door een deskundige (RXO);
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel15
  - number: 15.5.g
    text: moet door de minister worden afgegeven (AMS);
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel15
  - number: 15.5.h
    text: speciale instructies – neem contact op voor nadere instructies van de minister (SIC).
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel15
  - number: '15.6'
    text: |-
      Als een medische verklaring onder beperkingen wordt afgegeven of verlengd, of als de afgifte of verlenging wordt
      geweigerd, geschiedt dit niet zonder dat dit met redenen omkleed wordt aangegeven aan de keurende geautoriseerde
      geneeskundige instantie of geautoriseerde geneeskundige waar de voorafgaande keuring is verricht.
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel15
  - number: '15.7'
    text: |-
      Als de medische verklaring op grond van het vierde lid van dit artikel slechts geldig is gedurende een aantal
      maanden, kan de minister aangeven onder welke voorwaarden de geldigheid na het verlopen van het betreffende aantal
      maanden kan worden verlengd, hetzij voor wederom een beperkt aantal maanden, hetzij voor de rest van de geldigheid
      zoals deze zou hebben gegolden als in eerste instantie geen beperking was opgelegd.
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel15
  - number: '15.8'
    text: |-
      Een medische verklaring wordt niet afgegeven, voordat de vergoeding voor de handelingen ten behoeve van de aanvraag
      tot de afgifte of verlenging van een medische verklaring is voldaan.
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel15
  - number: '16.1'
    text: De minister stelt het model van de medische verklaring vast.
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel16
  - number: '16.2'
    text: 'De medische verklaring omvat in ieder geval de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel16
  - number: 16.2.a
    text: referentienummer,
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel16
  - number: 16.2.b
    text: klasse 3,
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel16
  - number: 16.2.c
    text: volledige naam, geboortedatum en nationaliteit van de houder,
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel16
  - number: 16.2.d
    text: datum en plaats van de eerste keuring van de houder,
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel16
  - number: 16.2.e
    text: datum en plaats van de laatste uitgebreide keuring van de houder,
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel16
  - number: 16.2.f
    text: datum van de laatste electrocardiogram,
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel16
  - number: 16.2.g
    text: datum van de laatste audiogram,
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel16
  - number: 16.2.h
    text: beperkingen of voorwaarden waaronder de medische verklaring is afgegeven,
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel16
  - number: 16.2.i
    text: datum van de keuring die ten grondslag ligt aan de medische verklaring,
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel16
  - number: 16.2.j
    text: handtekening van de minister, en
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel16
  - number: 16.2.k
    text: handtekening van de houder.
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel16
  - number: '17.1'
    text: |-
      Als de houder van een medische verklaring zich tot 45 dagen voor het verstrijken van de termijn van geldigheid
      medisch laat keuren zal de geldigheidsduur van een af te geven verlengde medische verklaring worden gerekend vanaf
      de verloopdatum van de eerstgenoemde medische verklaring.
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel17
  - number: '17.2'
    text: |-
      Als de houder van een medische verklaring zich niet tot 45 dagen voor het verstrijken van de termijn van geldigheid
      medisch laat keuren zal de geldigheidsduur van een af te geven verlengde medische verklaring worden gerekend vanaf
      de datum van de door de aanvrager feitelijk ondergane keuring.
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel17
  - number: '18'
    text: 'In het geval van:'
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel18
  - number: 18.a
    text: het bewustzijn van enige tussentijdse verslechtering van hun medische gesteldheid,
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel18
  - number: 18.b
    text: een ernstige verwonding, of
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel18
  - number: 18.c
    text: een ziekte van 21 dagen of langer;
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel18
  - number: '19.1'
    text: |-
      Houders van een medische verklaring laten onverwijld door een geautoriseerde geneeskundige instantie of
      geautoriseerde geneeskundige beoordelen of hun gezondheidstoestand nog zodanig is dat zij in staat zijn de
      werkzaamheden, waarvoor hen een bewijs van bevoegdheid is verleend, te verrichten, in het geval van:
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel19
  - number: 19.1.a
    text: twijfel omtrent de geldigheid van de medische verklaring;
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel19
  - number: 19.1.b
    text: opname van meer dan twaalf uur in een ziekenhuis of vergelijkbare instelling;
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel19
  - number: 19.1.c
    text: |-
      een medische ingreep, al dan niet onder lokale of regionale verdoving of verdoving door middel van een
      ruggemergprik,
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel19
  - number: 19.1.d
    text: het voorgeschreven zijn van regelmatig gebruik van medicijnen, of
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel19
  - number: 19.1.e
    text: het voorgeschreven zijn van regelmatig gebruik van corrigerende bril, glazen of lenzen.
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel19
  - number: '19.2'
    text: |-
      De geautoriseerde geneeskundige instantie of geautoriseerde geneeskundige vormt zich een oordeel, in het licht
      van de relevante medische eisen, keuringsmethoden en procedures bedoeld in [artikel 13, eerste lid][ref1],
      en [bijlage 2][ref2], tweede paragraaf, over de vraag of de gezondheidstoestand van de houder van de medische
      verklaring zodanig is, dat deze al dan niet in staat is de werkzaamheden, waarvoor hem een bewijs van bevoegdheid
      is verstrekt, te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0010686#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0010686
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0010686
        artikel: '13'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0010686
  - number: '19.3'
    text: |-
      De geautoriseerde geneeskundige instantie of geautoriseerde geneeskundige meldt het oordeel onverwijld gemotiveerd
      aan de minister en aan de houder van de medische verklaring. De motivering bevat in ieder geval een verwijzing
      naar de relevante medische eisen, keuringsmethoden en procedures bedoeld in [artikel 13, eerste lid][ref1], en
      [bijlage 2][ref2], tweede paragraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0010686#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0010686
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0010686
        artikel: '13'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0010686
  - number: '20.1'
    text: |-
      Als een houdster van een medische verklaring constateert, dat zij zwanger is, meldt zij dit onverwijld aan een
      geautoriseerde geneeskundige instantie of geautoriseerde geneeskundige.
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel20
  - number: '20.2'
    text: |-
      De geautoriseerde geneeskundige instantie of geautoriseerde geneeskundige vormt zich een oordeel, in het licht
      van de relevante medische eisen, keuringsmethoden en procedures bedoeld in [artikel 13, eerste lid][ref1],
      en [bijlage 2][ref2], tweede paragraaf, in hoeverre, voor welke periode en onder welke voorwaarden de
      gezondheidstoestand van de houder van de medische verklaring nog zodanig is, dat deze in staat is de werkzaamheden,
      waarvoor haar een bewijs van bevoegdheid is verstrekt, te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0010686#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0010686
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0010686
        artikel: '13'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0010686
  - number: '20.3'
    text: |-
      De geautoriseerde geneeskundige instantie of geautoriseerde geneeskundige meldt het oordeel onverwijld gemotiveerd
      aan de minister en aan de houder van de medische verklaring. De motivering bevat in ieder geval een verwijzing
      naar de relevante medische eisen, keuringsmethoden en procedures bedoeld in [artikel 13, eerste lid][ref1], en
      [bijlage 2][ref2], tweede paragraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0010686#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0010686
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0010686
        artikel: '13'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0010686
  - number: '21.1'
    text: |-
      Houders van een op basis van artikel 2.4, zevende lid, van de wet ongeldige medische verklaring laten, als zij
      van mening zijn dat hun gezondheidstoestand weer zodanig is dat zij in staat zijn de werkzaamheden waarvoor hen
      een bewijs van bevoegdheid is verleend te verrichten, dit door een geautoriseerde geneeskundige instantie of
      geautoriseerde geneeskundige beoordelen.
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel21
  - number: '21.2'
    text: |-
      De geautoriseerde geneeskundige instantie of geautoriseerde geneeskundige vormt zich een oordeel, in het licht
      van de relevante medische eisen, keuringsmethoden en procedures bedoeld in [artikel 13, eerste lid][ref1], en
      [bijlage 2, tweede paragraaf][ref2], bij deze regeling over de vraag of de gezondheidstoestand van de houder van
      de medische verklaring zodanig is, dat deze al dan niet in staat is de werkzaamheden, waarvoor hem een bewijs van
      bevoegdheid is verstrekt, weer te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0010686#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0010686
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0010686
        artikel: '13'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0010686
  - number: '21.3'
    text: |-
      De geautoriseerde geneeskundige instantie of geautoriseerde geneeskundige meldt het oordeel onverwijld gemotiveerd
      aan de minister en aan de houder van de medische verklaring. De motivering bevat in ieder geval een verwijzing
      naar de relevante medische eisen, keuringsmethoden en procedures bedoeld in [artikel 13, eerste lid][ref1], en
      [bijlage 2, tweede paragraaf][ref2], bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0010686#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0010686
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0010686
        artikel: '13'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0010686
  - number: '22.1'
    text: |-
      De Adviescommissie hoort indien noodzakelijk de belanghebbenden binnen twee weken na ontvangst van het
      bezwaarschrift door de Adviescommissie.
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel22
  - number: '22.2'
    text: |-
      Het horen door de Adviescommissie kan door de voorzitter worden opgedragen aan drie of meer leden, die geen deel
      uitmaken van het Ministerie van Infrastructuur en Milieu en niet werkzaam zijn onder de verantwoordelijkheid van
      de minister.
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel22
  - number: '22.3'
    text: |-
      De in het tweede lid bedoelde leden van de Adviescommissie doen de overige leden binnen twee weken na het horen een
      verslag van het horen toekomen.
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel22
  - number: '22.4'
    text: |-
      De Adviescommissie brengt binnen vier weken na het eventuele horen van de belanghebbenden advies uit aan de
      minister.
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel22
  - number: '22.5'
    text: |-
      De Adviescommissie beslist over het uit te brengen advies met meerderheid van stemmen. Als de stemmen staken, is de
      stem van de voorzitter beslissend.
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel22
  - number: '22.6'
    text: De Adviescommissie kan een reglement van orde opstellen.
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel22
  - number: '22.7'
    text: |-
      Leden van de Adviescommissie zullen niet deelnemen aan het horen van een persoon en geen stem uitbrengen voor het
      advies over een persoon, waarmee zij in een medische, persoonlijke of zakelijke relatie stonden of staan.
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel22
  - number: '23.1'
    text: |-
      Aanvragers van een medische verklaring, of houders van een medische verklaring die werkzaamheden uitvoeren waarvoor
      hen een bewijs van bevoegdheid of bevoegdverklaring is verleend, zijn vrij van:
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel23
  - number: 23.1.a
    text: enige afwijking, congenitaal of verworven,
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel23
  - number: 23.1.b
    text: enige actieve, latente, acute of chronische invaliditeit, en
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel23
  - number: 23.1.c
    text: |-
      enige wond, letsel of restverschijnselen van een operatie; zodanig dat het een mate van functionele uitval met
      zich mee kan brengen die interfereert met de veilige uitoefening van de werkzaamheden waarvoor hen een bewijs van
      bevoegdheid of bevoegdverklaring is verleend.
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel23
  - number: '23.2'
    text: |-
      Aanvragers van een medische verklaring, of houders van een medische verklaring die werkzaamheden uitvoeren waarvoor
      hen een bewijs van bevoegdheid of bevoegdverklaring is verleend, lijden niet aan enige ziekte of invaliditeit,
      welke hen waarschijnlijk plotseling onbekwaam zou maken om de werkzaamheden waarvoor hen een bewijs van bevoegdheid
      of bevoegdverklaring is verleend, veilig te verrichten.
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel23
  - number: '24.1'
    text: |-
      Houders van een medische verklaring zullen de werkzaamheden waarvoor hen een bewijs van bevoegdheid of
      bevoegdverklaring is verleend niet uitvoeren, wanneer zij een al dan niet voorgeschreven medicatie of verdovend
      middel gebruiken, inclusief die welke gebruikt worden voor de behandeling van een ziekte of stoornis, als zij
      zich bewust zijn van enige bijwerking, die onverenigbaar is met de veilige uitoefening van de bevoegdheden van hun
      bewijs van bevoegdheid of bevoegdverklaring.
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel24
  - number: '24.2'
    text: |-
      Houders van een medische verklaring nemen in acht dat alle procedures, die het gebruik van een algemeen of spinaal
      anaestheticum noodzakelijk maken, ongeschiktheid ten gevolge zullen hebben gedurende tenminste 48 uur.
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel24
  - number: '24.3'
    text: |-
      Houders van een medische verklaring nemen in acht dat alle procedures die een topische of regionale anesthesie
      noodzakelijk maken, ongeschiktheid ten gevolge hebben gedurende tenminste 12 uur.
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel24
  - number: '25'
    text: 'Houders van een medische verklaring leveren deze onverwijld in bij de minister in geval van:'
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel25
  - number: 25.a
    text: het verlopen van de medische verklaring, of
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel25
  - number: 25.b
    text: ongeldigheid van de medische verklaring.
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel25
  - number: '26'
    text: |-
      Een geautoriseerde geneeskundige, verantwoordelijk voor het coördineren van de verwerking van keurings- en
      beoordelingsresultaten alsmede het accorderen en ondertekenen van rapporten, wordt toegang verleend tot de
      medische documentatie die berust bij de minister en die relevant is voor de medische keuringen en beoordelingen
      die die geneeskundige uitvoert, hetzij worden uitgevoerd bij de geautoriseerde geneeskundige instantie waar die
      geneeskundige werkzaam is, op basis van deze regeling.
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel26
  - number: '27'
    text: Deze regeling treedt in werking met ingang van 1 oktober 1999.
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel27
  - number: '28'
    text: |-
      Deze regeling wordt aangehaald als: Regeling geneeskundige instanties, geneeskundigen en medische verklaringen voor
      de luchtvaart.
    url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#Artikel28
