  text: |-
    Gelet op de artikelen 30, 31, 32, 33, 34, 35 van het Besluit bewijzen van bevoegdheid voor de luchtvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0010686/2014-03-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *adviescommissie:* commissie als bedoeld in
      [artikel 32 van het Besluit bewijzen van bevoegdheid voor de luchtvaart][ref1];
        - *gevestigd medisch instituut:* organisatie met klinische onderzoeks- en trainingsfaciliteiten die experts,
      waaronder luchtvaartmedische experts, beschikbaar heeft op het voor deze regeling relevante gebied van
      luchtvaartgeneeskunde en de daarbij gebruikte faciliteiten;
        - *keuring klasse 3:* keuring, uitgevoerd voorafgaand aan de beslissing van de minister over de afgifte van een
      medische verklaring klasse 3;
        - *minister:* Minister van Infrastructuur en Milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel32
