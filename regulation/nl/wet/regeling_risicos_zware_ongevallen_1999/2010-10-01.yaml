preamble:
  text: |-
    handelende in overeenstemming met de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties en de
    Staatssecretaris van Sociale Zaken en Werkgelegenheid, J. F. Hoogervorst;

    Gelet op de artikelen 5, vijfde lid, 10, tweede tot en met vierde lid, 21, tweede lid, en 29 van het Besluit
    risico’s zware ongevallen 1999;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a
            besluit:

              [Besluit risico’s zware ongevallen 1999][ref1];



            b
            veiligheidsbeheerssysteem:

              veiligheidsbeheerssysteem als bedoeld in [artikel 5, derde lid, van het besluit][ref2];



            c
            risico-analyse:

              risico-analyse als bedoeld in [bijlage III, eerste lid, onder o, bij het besluit][ref3];



            d
            stoffen:

              gevaarlijke stoffen als bedoeld in [artikel 1, onder b, van het besluit][ref4], alsmede andere stoffen die
      gevaar kunnen veroorzaken.


      [ref1]: https://wetten.overheid.nl/BWBR0010475
      [ref2]: https://wetten.overheid.nl/BWBR0010475#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0010475
      [ref4]: https://wetten.overheid.nl/BWBR0010475#Artikel1
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010475
      - id: ref2
        bwb_id: BWBR0010475
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0010475
      - id: ref4
        bwb_id: BWBR0010475
        artikel: '1'
  - number: '2'
    text: |-
      Bij de vastlegging van het beleid ter voorkoming van zware ongevallen en van de algemene doelstellingen
      en beginselen van het beleid inzake de beheersing van de risico’s van zware ongevallen, als bedoeld in
      [artikel 5, tweede lid, van het besluit][ref1], wordt een beschrijving gegeven van:


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel5
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010475
        artikel: '5'
  - number: 2.a
    text: in hoofdlijnen de aard en de omvang van de risico’s van zware ongevallen;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel2
  - number: 2.b
    text: |-
      de beginselen die ten grondslag liggen aan de inrichting van het veiligheidsbeheerssysteem, zodanig dat inzicht
      wordt geboden in de samenhang tussen het beleid en het veiligheidsbeheerssysteem;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel2
  - number: 2.c
    text: de criteria die worden toegepast bij de vaststelling van de risico’s van zware ongevallen;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel2
  - number: 2.d
    text: |-
      de beginselen die ten grondslag liggen aan de maatregelen die zijn getroffen ter voorkoming van zware ongevallen,
      zodanig dat inzicht wordt geboden in de samenhang tussen de getroffen maatregelen en de risico’s van zware
      ongevallen.
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel2
  - number: '3.1'
    text: |-
      De procedures voor de systematische identificatie van de ongewenste gebeurtenissen en de beoordeling van de
      risico’s van zware ongevallen als bedoeld in [bijlage II, onder c, bij het besluit][ref1] hebben betrekking op:


      [ref1]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010475
  - number: 3.1.a
    text: |-
      het verrichten van systematisch onderzoek naar de aan een installatie verbonden risico’s van een zwaar ongeval
      tijdens het ontwerp, de bouw, het gebruik en het onderhoud van de installatie, alsmede bij voorgenomen wijzigingen
      daarvan;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel3
  - number: 3.1.b
    text: de criteria voor het bepalen van de methode voor het onder a bedoelde onderzoek;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel3
  - number: 3.1.c
    text: de methode voor de beoordeling van de risico’s van zware ongevallen.
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel3
  - number: '3.2'
    text: De in het eerste lid, onder b, bedoelde onderzoeksmethode is afgestemd op de in dat lid, onder a, bedoelde fasen.
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel3
  - number: '3.3'
    text: |-
      De methode bedoeld in het eerste lid, onder c, is geschikt om vast te stellen welke maatregelen nodig zijn ter
      voorkoming van zware ongevallen of ter beperking van de gevolgen daarvan.
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel3
  - number: '4'
    text: |-
      Voor de beschrijving van de in de inrichting voorkomende stoffen bedoeld in
      [bijlage III, eerste lid, onder j, bij het besluit][ref1], kan worden volstaan met een opgave per stof van de
      chemische naam en het CAS-nummer, mits daaruit de fysisch-chemische eigenschappen en de gevaarseigenschappen van de
      betrokken stof kenbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010475
  - number: '5.1'
    text: |-
      De beschrijving van de scenario’s bedoeld in [bijlage III, eerste lid, onder k, bij het besluit][ref1], heeft
      betrekking op de onderdelen van installaties die de grootste risico’s van een zwaar ongeval met zich meebrengen.
      De identificatie van de betreffende onderdelen van de installaties vindt plaats op basis van een in het
      veiligheidsrapport beschreven methode.


      [ref1]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010475
  - number: '5.2'
    text: |-
      Bij de beschrijving van de in het eerste lid bedoelde scenario’s wordt ten minste beschouwd welk van de volgende
      voorvallen deze scenario’s op gang kunnen brengen: corrosie, erosie, externe belasting, impact, overdruk,
      onderdruk, lage temperatuur, hoge temperatuur, trillingen, menselijke fouten tijdens gebruik, wijziging of
      onderhoud.
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel5
  - number: '5.3'
    text: |-
      Van elk scenario dient aangegeven te worden wat de kwalitatieve waarschijnlijkheid en het effect is en welke
      maatregelen getroffen zijn om te voorkomen dat het scenario zich voordoet. Voorts wordt ter beoordeling van de
      aanvaardbaarheid van de risico’s en rekening houdend met de reeds getroffen maatregelen, een samenhangend inzicht
      geboden in:
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel5
  - number: 5.3.a
    text: de resterende kans dat een zwaar ongeval geschiedt;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel5
  - number: 5.3.b
    text: de ernst van de gevolgen die het ongeval in dat geval zal hebben;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel5
  - number: 5.3.c
    text: |-
      welke verdere maatregelen technisch mogelijk zijn om de kans op een zwaar ongeval verder te verkleinen tot een
      daarbij aan te geven niveau;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel5
  - number: 5.3.d
    text: een indicatie van de kosten die verbonden zouden zijn aan het treffen van maatregelen als bedoeld onder c.
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel5
  - number: '5.4'
    text: |-
      De scenario’s dienen zodanig gekozen te worden dat hieruit blijkt dat met het complete stelsel van aanwezige
      technische en organisatorische voorzieningen op adequate wijze de risico’s van zware ongevallen kunnen worden
      beheerst.
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel5
  - number: '6.1'
    text: 'Bij de uitvoering van een risico-analyse worden:'
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel6
  - number: 6.1.a
    text: |-
      de ingevolge [bijlage III, tweede lid, bij het besluit][ref1] in het veiligheidsrapport weer te
      geven resultaten berekend met gebruikmaking van de in het rapport opgenomen gegevens, bedoeld in
      __REF001___________________________________________________________________________________________________________
      __________________________________;


      [ref1]: https://wetten.overheid.nl/BWBR0010475
      [ref2]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010475
      - id: ref2
        bwb_id: BWBR0010475
  - number: 6.1.b
    text: |-
      de berekeningen, bedoeld onder a, uitgevoerd met toepassing van de rekenmethodiek Bevi, als bedoeld in
      [artikel 1, onderdeel I, van de Regeling externe veiligheid inrichtingen][ref1], en,


      [ref1]: https://wetten.overheid.nl/BWBR0017168#Artikel1
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0017168
        artikel: '1'
  - number: 6.1.c
    text: |-
      de ingevolge [bijlage III, tweede lid, onder b en c, bij het besluit][ref1] in het veiligheidsrapport weer te
      geven resultaten verkregen met gebruikmaking van de resultaten die overeenkomstig het tweede lid, onder a, van die
      bijlage zijn berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010475
  - number: '6.2'
    text: |-
      De [artikelen 8b][ref1], [8c][ref2] en [8d van de Regeling externe veiligheid inrichtingen][ref3] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017168#Artikel8b
      [ref2]: https://wetten.overheid.nl/BWBR0017168#Artikel8c
      [ref3]: https://wetten.overheid.nl/BWBR0017168#Artikel8d
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0017168
        artikel: 8b
      - id: ref2
        bwb_id: BWBR0017168
        artikel: 8c
      - id: ref3
        bwb_id: BWBR0017168
        artikel: 8d
  - number: '7'
    text: |-
      De risico-analyse wordt in het veiligheidsrapport weergegeven op de wijze, omschreven in de bij deze regeling
      behorende [bijlage A][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010579
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0010579
  - number: '8'
    text: |-
      Het veiligheidsrapport bevat voor zover het betreft de risico’s voor het milieu, bedoeld in
      [bijlage III, eerste lid, onder o, bij het besluit][ref1] de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0010475
  - number: 8.a
    text: |-
      een schatting van de kans dat belangrijke ongewenste effecten voor het milieu ten gevolge van een zwaar ongeval
      zich voordoen in het oppervlaktewater alsmede een schatting van de omvang van die effecten;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel8
  - number: 8.b
    text: een opsomming van de maatregelen die zijn genomen om de risico’s voor het milieu van zware ongevallen te beperken.
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel8
  - number: '9.1'
    text: |-
      Het bevoegd gezag kan op verzoek van degene die een inrichting drijft, als bedoeld in
      [artikel 8 van het besluit][ref1], besluiten dat het veiligheidsrapport geen betrekking behoeft te hebben op een
      in de inrichting of een onderdeel daarvan aanwezige gevaarlijke stof, indien hij ten genoegen van het bevoegd gezag
      aantoont dat de betrokken stof:


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel8
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0010475
        artikel: '8'
  - number: 9.1.a
    text: |-
      in een vaste vorm aanwezig is zodat zowel in normale als in redelijkerwijs voorzienbare bijzondere omstandigheden
      geen materie of energie kan vrijkomen die een gevaar van een zwaar ongeval kan opleveren,
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel9
  - number: 9.1.b
    text: |-
      zodanig is verpakt of omhuld en in een zodanige hoeveelheid aanwezig is dat het vrijkomen van de grootst mogelijke
      hoeveelheid, onder welke omstandigheid dan ook, geen gevaar van een zwaar ongeval kan opleveren,
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel9
  - number: 9.1.c
    text: |-
      in een zodanige hoeveelheid en op een zodanige afstand van andere gevaarlijke stoffen, die zich binnen of buiten
      de inrichting bevinden, aanwezig is, dat deze noch op zichzelf een gevaar van een zwaar ongeval kan opleveren, noch
      een zwaar ongeval kan veroorzaken waarbij andere gevaarlijke stoffen zijn betrokken, of
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel9
  - number: 9.1.d
    text: |-
      is ingedeeld in een of meer categorieën, genoemd in [bijlage I, deel 2, bij het besluit][ref1], doch geen gevaar
      van een zwaar ongeval kan opleveren.


      [ref1]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0010475
  - number: '9.2'
    text: Indien het bevoegd gezag met het verzoek instemt, wordt in het veiligheidsrapport naar zijn besluit verwezen.
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel9
  - number: '10.1'
    text: |-
      Een verzoek als bedoeld in [artikel 9][ref1] wordt ingediend ten minste zestien weken voordat een
      veiligheidsrapport krachtens [artikel 14][ref2] of [artikel 28 van het besluit][ref3] moet worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0010579#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0010475#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0010475#Artikel28
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0010579
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0010475
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0010475
        artikel: '28'
  - number: '10.2'
    text: |-
      Indien een veiligheidsrapport wordt ingediend bij een aanvraag als bedoeld in
      [artikel 6.15 van het Besluit omgevingsrecht][ref1] mag het verzoek tezamen worden ingediend met de aanvraag om
      een omgevingsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel6
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '6'
  - number: '10.3'
    text: |-
      Op de voorbereiding van het besluit op een verzoek als bedoeld in het eerste lid is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '10.4'
    text: Een veiligheidsrapport als bedoeld in het eerste lid wordt niet behandeld voordat op het verzoek is beslist.
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel10
  - number: '11.1'
    text: |-
      Een verzoek als bedoeld in [artikel 9][ref1] bevat de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0010579#Artikel9
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0010579
        artikel: '9'
  - number: 11.1.a
    text: de naam of de handelsnaam van degene die de inrichting drijft en zijn adres;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel11
  - number: 11.1.b
    text: het adres van de inrichting;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel11
  - number: 11.1.c
    text: |-
      de naam en de functie van de met de feitelijke leiding van de inrichting belaste persoon, indien deze een ander is
      dan degene die de inrichting drijft;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel11
  - number: 11.1.d
    text: |-
      een algemene beschrijving van de activiteiten die in de inrichting worden uitgeoefend en specifieke gegevens over
      het onderdeel of de installatie van de inrichting waarvoor het verzoek wordt gedaan;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel11
  - number: 11.1.e
    text: |-
      een gedetailleerde beschrijving van de onmiddellijke omgeving van de inrichting, voor zover die nodig is voor het
      nemen van de beslissing op het verzoek;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel11
  - number: 11.1.f
    text: 'een beschrijving van de gevaarlijke stof of de gevaarlijke stoffen waarvoor het verzoek wordt gedaan:'
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel11
  - number: 11.1.f.1º
    text: |-
      de aanduiding van de betrokken stof of stoffen: chemische naam, CAS-nummer, naam overeenkomstig de IUPAC-
      nomenclatuur en indeling;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel11
  - number: 11.1.f.2º
    text: |-
      de maximale hoeveelheid waarvoor een omgevingsvergunning als bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref1] vergunning is
      verleend dan wel, indien de vergunning hierin niet voorziet, de hoeveelheid behorend bij de vergunde maximale
      capaciteit van de inrichting;


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 11.1.f.3º
    text: de fysische, chemische, toxicologische en ecotoxicologische eigenschappen;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel11
  - number: 11.1.f.4º
    text: het fysisch en chemisch gedrag onder normale gebruiksomstandigheden en bij een voorzienbaar ongeval;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel11
  - number: 11.1.g
    text: |-
      gegevens waarmee de aanvrager aantoont dat aan ten minste een van de voorwaarden bedoeld in
      [artikel 9, eerste lid][ref1], is voldaan;


      [ref1]: https://wetten.overheid.nl/BWBR0010579#Artikel9
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0010579
        artikel: '9'
  - number: 11.1.h
    text: een aanduiding van de gegevens die niet in het veiligheidsrapport zullen worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel11
  - number: '11.2'
    text: |-
      De gegevens bedoeld in het eerste lid behoeven niet te worden verstrekt voor zover deze zijn opgenomen in een
      aanvraag om vergunning als bedoeld in [artikel 10, tweede lid][ref1], of in een kennisgeving als bedoeld in artikel
      26, eerste lid, van het besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0010579#Artikel10
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0010579
        artikel: '10'
  - number: '12.1'
    text: |-
      Het bevoegd gezag vermeldt in zijn besluit op een verzoek als bedoeld in [artikel 9][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0010579#Artikel9
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0010579
        artikel: '9'
  - number: 12.1.a
    text: de stoffen waarop het besluit betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel12
  - number: 12.1.b
    text: in welk onderdeel van de inrichting de betrokken stoffen zich bevinden;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel12
  - number: 12.1.c
    text: een aanduiding van de gegevens die niet behoeven te worden opgenomen in het veiligheidsrapport.
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel12
  - number: '12.2'
    text: Aan een besluit als bedoeld in het eerste lid kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel12
  - number: '13.1'
    text: |-
      De lijst van de in de inrichting aanwezige gevaarlijke stoffen, bedoeld in
      [artikel 21, eerste lid, van het besluit][ref1] wordt ten minste eenmaal per maand bijgewerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel21
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0010475
        artikel: '21'
  - number: '13.2'
    text: |-
      De in het eerste lid genoemde lijst vermeldt per gevaarlijke stof ten minste de chemische stofnaam of de
      handelsnaam.
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel13
  - number: '14.1'
    text: |-
      Degene die een inrichting drijft, draagt er zorg voor dat hulpverleningsdiensten van de overheid voor elke
      installatie direct toegang hebben tot ten minste de volgende actuele gegevens van de binnen de installatie
      aanwezige gevaarlijke stof of gevaarlijke stoffen:
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel14
  - number: 14.1.a
    text: de chemische stofnaam of handelsnaam;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel14
  - number: 14.1.b
    text: de maximaal aanwezige hoeveelheid;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel14
  - number: 14.1.c
    text: het CAS-nummer;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel14
  - number: 14.1.d
    text: het VN-nummer;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel14
  - number: 14.1.e
    text: het GI-nummer.
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel14
  - number: '14.2'
    text: |-
      Indien de gegevens, bedoeld in het eerste lid, onder c, d en e, niet bestaan, zijn onverminderd het eerste lid,
      onder a en b, ten minste actuele gegevens beschikbaar over:
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel14
  - number: 14.2.a
    text: het gevaar voor een explosie;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel14
  - number: 14.2.b
    text: het gevaar voor brand;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel14
  - number: 14.2.c
    text: het gevaar voor een toxische wolk.
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel14
  - number: '14.3'
    text: De gegevens, bedoeld in het eerste en tweede lid, zijn binnen de inrichting direct toegankelijk.
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel14
  - number: '15.1'
    text: |-
      Degene die een inrichting drijft, verstrekt zo spoedig mogelijk na een zwaar ongeval aan de door de Minister van
      Sociale Zaken en Werkgelegenheid aangewezen toezichthouder, gegevens betreffende:
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel15
  - number: 15.1.a
    text: datum, tijd, plaats en de omstandigheden van het ongeval;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel15
  - number: 15.1.b
    text: de daarbij betrokken gevaarlijke stoffen, alsmede de hoeveelheid daarvan;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel15
  - number: 15.1.c
    text: de gevolgen van het ongeval voor de werknemers, die zich op korte dan wel langere termijn kunnen voordoen;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel15
  - number: 15.1.d
    text: |-
      het aantal werknemers dat als gevolg van blootstelling aan een gevaarlijke stof is overleden, dan wel zodanig
      gewond is dat dit heeft geleid tot een opname in het ziekenhuis voor ten minste 24 uur;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel15
  - number: 15.1.e
    text: de ter bescherming van de werknemers voorgenomen en getroffen maatregelen en noodmaatregelen;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel15
  - number: 15.1.f
    text: |-
      de ter bescherming van de werknemers voorgenomen en getroffen maatregelen om herhaling van het ongeval te
      voorkomen;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel15
  - number: 15.1.g
    text: het bedrag van de materiële schade binnen de inrichting.
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel15
  - number: '15.2'
    text: |-
      Indien uit nader onderzoek gegevens naar voren komen die afwijken van de ingevolge het eerste lid verstrekte
      gegevens, en die wijziging kunnen brengen in de getrokken conclusies, worden die gegevens aanvullend verstrekt.
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel15
  - number: '15.3'
    text: |-
      De door de Minister van Sociale Zaken en Werkgelegenheid aangewezen toezichthouder ziet erop toe dat de
      maatregelen, bedoeld in het eerste lid, onder e en f, daadwerkelijk worden getroffen.
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel15
  - number: '15.4'
    text: |-
      Voorzover degene die de inrichting drijft de in dit artikel bedoelde gegevens reeds heeft verstrekt ter voldoening
      aan zijn verplichtingen ingevolge de [Wet algemene bepalingen omgevingsrecht][ref1], de [Wet milieubeheer][ref2]
      of de [Wet rampen en zware ongevallen][ref3], is daarmee voldaan aan de ingevolge dit artikel op hem rustende
      verplichting. In dat geval zendt het bestuursorgaan dat de betreffende gegevens heeft ontvangen, een afschrift
      daarvan aan de door de Minister van Sociale Zaken en Werkgelegenheid aangewezen toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0024779
      [ref2]: https://wetten.overheid.nl/BWBR0003245
      [ref3]: https://wetten.overheid.nl/BWBR0003765
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0024779
      - id: ref2
        bwb_id: BWBR0003245
      - id: ref3
        bwb_id: BWBR0003765
  - number: '16'
    text: |-
      [Artikel 1.12 van de Arbeidsomstandighedenregeling][ref1] vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel1
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '1'
  - number: '17'
    text: Deze regeling treedt in werking met ingang van 19 juli 1999.
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel17
  - number: '18'
    text: Deze regeling wordt aangehaald als Regeling risico’s zware ongevallen 1999.
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#Artikel18
  - number: BA:I.a
    text: |-
      een aanduiding van de onderdelen van de inrichting waarop de berekening van de resultaten, bedoeld in
      [bijlage III, tweede lid, bij het besluit][ref1], betrekking heeft; voorts dient de wijze waarop de selectie van de
      onderdelen van de inrichting tot stand is gekomen, op verzoek van het bevoegd gezag te worden toegelicht;


      [ref1]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#ArtikelI
    references:
      - id: ref1
        bwb_id: BWBR0010475
  - number: BA:I.b
    text: |-
      een aanduiding van alle van belang zijnde, mogelijke ontstekingsbronnen buiten de inrichting, indien de
      brandbaarheid van een in de inrichting aanwezige stof in een onderdeel van de inrichting de aanleiding is
      geweest voor de selectie van dat onderdeel overeenkomstig de Handleiding Risicoberekeningen, bedoeld in
      [artikel 1, onderdeel e, van de Regeling externe veiligheid inrichtingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017168#Artikel1
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#ArtikelI
    references:
      - id: ref1
        bwb_id: BWBR0017168
        artikel: '1'
  - number: BA:I.c
    text: |-
      een beschrijving van de bevolkingsdichtheid rond de inrichting, onder opgave van de wijze waarop deze beschrijving
      tot stand is gekomen;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#ArtikelI
  - number: BA:I.d
    text: |-
      een beschrijving van de weersomstandigheden ter plaatse, waaronder ten minste die van de windsnelheid, de
      windrichting en de Pasquilklasse.
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#ArtikelI
  - number: BA:II.a
    text: 'een overzicht van de uitgevoerde berekeningen, onder meer bevattende:'
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#ArtikelII
  - number: BA:II.a.1º
    text: |-
      een schatting van de kans dat een zwaar ongeval zich binnen de inrichting voordoet, en een schatting van de omvang
      van de gevolgen van dat ongeval buiten de inrichting, uitgedrukt in het aantal dodelijk getroffenen;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#ArtikelII
  - number: BA:II.a.2º
    text: |-
      de resultaten van de berekeningen, bedoeld in [bijlage III, tweede lid, onder b en c, bij het besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0010475
  - number: BA:II.a.3º
    text: |-
      een beschrijving van het gedrag van de bij een zwaar ongeval vrijkomende stoffen; deze dient ten minste te
      bevatten:
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#ArtikelII
  - number: BA:II.b
    text: |-
      . indien het bevoegd gezag van oordeel is dat de verstrekte gegevens onvoldoende zijn om de juistheid van de
      resultaten, bedoeld in [bijlage III, tweede lid, bij het besluit][ref1] te beoordelen, dient op verzoek van het
      bevoegd gezag het rapport bovendien te worden aangevuld met de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0010475
  - number: BA:II.b.1º
    text: de verspreiding van de desbetreffende stoffen in de omgeving als functie van tijd en plaats;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#ArtikelII
  - number: BA:II.b.2º
    text: de wijze waarop door de verspreiding van de stoffen personen dodelijk getroffen kunnen worden;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#ArtikelII
  - number: BA:II.b.3º
    text: |-
      de tussenresultaten van de berekeningen, bedoeld onder a, 1° en 2°; deze resultaten dienen voor de dag- en
      nachtsituatie afzonderlijk te worden weergegeven.
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#ArtikelII
  - number: BA:III.a
    text: |-
      een aanduiding van de fysische modellen die zijn gebruikt voor de berekening van de resultaten, bedoeld in bijlage
      III, tweede lid, bij het besluit; deze modellen dienen, indien van toepassing, in elk geval betrekking te hebben
      op: '- de uitstroming van een stof uit een installatieonderdeel,'
        - de verdampingssnelheid van die stof,
        - de verspreiding van de stof in de omgeving,
        - de warmtestraling bij brand,
        - de drukeffecten van explosies, en
        - de warmtestraling van een vuurbal bij een fysische explosie van het type ’BLEVE’;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#ArtikelIII
  - number: BA:III.b
    text: |-
      een aanduiding van de schademodellen die zijn gebruikt voor de berekening van de resultaten, bedoeld in
      [bijlage III, tweede lid, bij het besluit][ref1]; deze modellen dienen, voor zover van toepassing, betrekking te
      hebben op: - schade ten gevolge van een toxische gaswolk,
        - schade ten gevolge van een explosie, en
        - schade ten gevolge van warmtestraling. Een aanduiding als bedoeld onder a en b, kan bestaan uit verwijzingen naar
      literatuur waarin de modellen zijn beschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0010475
  - number: BA:IV.a
    text: |-
      een aanduiding van de parameterwaarden die in de berekeningen met behulp van de modellen, bedoeld in onderdeel
      III, zijn gebruikt; deze aanduiding kan bestaan uit verwijzingen naar literatuur waarin deze parameterwaarden zijn
      beschreven;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#ArtikelIV
  - number: BA:IV.b
    text: een aanduiding van de invoergegevens die voor de berekeningen zijn gebruikt;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#ArtikelIV
  - number: BA:IV.c
    text: |-
      indien het bevoegd gezag van oordeel is dat de verstrekte gegevens onvoldoende zijn om de juistheid van de
      berekening van de resultaten, bedoeld in [bijlage III, tweede lid, bij het besluit][ref1], te beoordelen, dient op
      verzoek van het bevoegd gezag in het rapport de keuze van de gebruikte parameterwaarden en invoergegevens te worden
      gemotiveerd.


      [ref1]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#ArtikelIV
    references:
      - id: ref1
        bwb_id: BWBR0010475
  - number: BA:V.a
    text: een aanduiding van de kans dat een zwaar ongeval optreedt;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#ArtikelV
  - number: BA:V.b
    text: een aanduiding van de kans dat het ongeval tot een fysisch effect leidt;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#ArtikelV
  - number: BA:V.c
    text: een aanduiding van de kans dat het fysische effect leidt tot acute sterfte van de mens;
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#ArtikelV
  - number: BA:V.d
    text: |-
      een beschrijving van de wijze waarop de kansen, bedoeld onder a, b en c, zijn bepaald; deze beschrijving dient te
      bestaan uit: - verwijzingen naar literatuur en databestanden;
        - elke andere methode die is gebruikt voor de vaststelling van de kansen; indien daarbij rekening is gehouden met
      de specifieke omstandigheden van de installatie en de inrichting, dienen deze te worden aangegeven.
    url: https://wetten.overheid.nl/BWBR0010579/2010-10-01#ArtikelV
