preamble:
  text: |-
    Gelet op artikel 12 van de Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0002296/1991-12-25#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De justitiële documentatiedienst verstrekt inlichtingen uit de algemene documentatieregisters aan:

      1. directeuren van van de stichtingen als bedoeld in artikel 4, eerste lid, van de Reclasseringsregeling 1986 (Stb.
      1);

      2. reclasseringswerkers als bedoeld in artikel 17, eerste lid, van de Reclasseringsregeling 1986;

      3. secretarissen van de raden voor de kinderbescherming, in die gevallen, waarin dit nodig is voor het voorbereiden
      van enig rapport of het uitoefenen van enig toezicht.
    url: https://wetten.overheid.nl/BWBR0002296/1991-12-25#Artikel1
