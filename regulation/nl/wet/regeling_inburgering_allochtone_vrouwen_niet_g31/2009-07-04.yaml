  text: |-
    Gelet op artikel 17, vijfde lid, van de Financiële-verhoudingswet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0019949/2009-07-04#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. Minister: de Minister voor Vreemdelingenzaken en Integratie;

      b. samenwerkingsverband: een centrumgemeente of een openbaar lichaam als bedoeld in
      [artikel 8 van de Wet gemeenschappelijke regelingen][ref1] waaraan de deelnemende gemeenten de hen ingevolge deze
      regeling toekomende rechten en de ingevolge deze regeling op hen rustende verplichtingen hebben overgedragen;

      c. college: het college van burgemeester en wethouders van een
      gemeente, niet zijnde een gemeente welke behoort tot de G31, bedoeld in
      [artikel 1, eerste lid, onderdeel b, van het Besluit brede doeluitkering sociaal, integratie en veiligheid][ref2];

      d. bestuur: het bestuur van een openbaar lichaam als bedoeld in
      [artikel 8 van de Wet gemeenschappelijke regelingen][ref3];

      e. allochtone vrouw: de vrouw die

      1°. behoort tot de eerste generatie niet-westerse allochtonen, dan wel de eerste generatie allochtonen afkomstig
      uit de voormalige Sovjet-Unie of voormalig Joegoslavië, en;

      2°. geen nieuwkomer is als bedoeld in de [Wet inburgering nieuwkomers][ref4], en;

      3°. geen inburgeringsprogramma voor oudkomers volgt op grond van het
      [Besluit brede doeluitkering sociaal, integratie en veiligheid][ref5], de
      [Regeling inburgering oudkomers 25 gemeenten 2005][ref6], de [Regeling inburgering oudkomers G25 2006][ref7] of de
      [Regeling inburgering oudkomers niet-G56 2006][ref8], en;

      4°. al voor langere tijd rechtmatig in Nederland verblijft, anders dan voor een tijdelijk doel als bepaald bij of
      krachtens de [Wet inburgering nieuwkomers][ref9], en;

      5°. algemene bijstand of een uitkering ontvangt op grond van de
      [Werkloosheidswet][ref10], de [Wet op de arbeidsongeschiktheidsverzekering][ref11], de
      [Wet inkomensvoorziening oudere en gedeeltelijke arbeidsongeschikte werkloze werknemers][ref12], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref13],
      de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref14], de
      [Wet arbeidsongeschiktheidsverzekering jonggehandicapten][ref15],
      de [Wet werk en inkomen naar arbeidsvermogen][ref16], de
      [Tijdelijke wet beperking inkomensgevolgen arbeidsongeschiktheidscriteria][ref17] of de
      [Tijdelijke regeling inkomensgevolgen herbeoordeelde arbeidsongeschikten][ref18], en aan wie in het kader van de
      uitvoering van voornoemde wetten of regelingen een voorziening is aangeboden gericht op arbeidsinschakeling, dan
      wel;

      6°. geen inkomsten uit tegenwoordige arbeid, algemene bijstand of uitkering geniet;

      f. categorie ‘uitkeringsgerechtigd’: de categorie, genoemd in onderdeel e, onder 5º;

      g. categorie ‘niet-werkend en niet-uitkeringsgerechtigd’: de categorie, genoemd in onderdeel e, onder 6º;

      h. bijdrage: de financiële bijdrage, bedoeld in [artikel 2][ref19];

      i. prognose: het aantal allochtone vrouwen, behorend tot de categorie ‘uitkeringsgerechtigd’, alsmede het aantal
      allochtone vrouwen, behorend tot de categorie ‘niet-werkend en niet-uitkeringsgerechtigd’ met wie het college of
      het bestuur naar de verwachting in het jaar 2006 een overeenkomst als bedoeld in [artikel 6][ref20] zal sluiten;

      j. inburgeringsvoorziening: de inburgeringsvoorziening, bedoeld in [artikel 4][ref21];

      k. inburgeringsexamen: het inburgeringsexamen, bedoeld in [artikel 5][ref22];

      l. IB-Groep: de Informatie Beheer Groep, genoemd in de [Wet verzelfstandiging Informatiseringsbank][ref23].


