  - number: '8'
    text: |-
      1 De Minister stelt de bijdrage vast aan de hand van de gegevens, bedoeld in [artikel 7][ref1].

      2 De bijdrage voor een gemeente of samenwerkingsverband bedraagt:

      a. € 1854 voor iedere allochtone vrouw, behorend tot de categorie ‘niet-werkend en niet-uitkeringsgerechtigd’,
      respectievelijk € 1271 voor iedere allochtone vrouw, behorend tot de categorie ‘uitkeringsgerechtigd’, met wie in
      2006 een overeenkomst is gesloten;

      b. € 4807 voor iedere allochtone vrouw, behorend tot de categorie ‘niet-werkend en niet-uitkeringsgerechtigd’,
      respectievelijk € 3294 voor iedere allochtone vrouw, behorend tot de categorie ‘uitkeringsgerechtigd’, die voor
      1 januari 2010 heeft deelgenomen aan het inburgeringsexamen.

      3 Het aantal allochtone vrouwen, behorend tot de categorie ‘niet-werkend en niet-uitkeringsgerechtigd’, alsmede het
      aantal allochtone vrouwen, behorend tot de categorie ‘uitkeringsgerechtigd’, dat de Minister bij het vaststellen
      van de bijdrage betrekt, kan de in de beschikking tot verlening van het voorschot genoemde aantallen allochtone
      vrouwen, per te onderscheiden categorie, niet overtreffen.

      4 De Minister stelt de bijdrage uiterlijk 1 oktober 2010 vast.

      5 De vastgestelde bijdrage wordt binnen zes maanden na de vaststelling ervan betaald.

      6 Indien het voorschot hoger is dan de vastgestelde bijdrage, kan de Minister het verschil terugvorderen.


