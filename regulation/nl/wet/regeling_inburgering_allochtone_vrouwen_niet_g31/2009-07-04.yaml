  - number: '2'
    text: |-
      1 De Minister kan aan een gemeente of een samenwerkingsverband, onder de in deze regeling genoemde voorwaarden,
      een bijdrage verlenen teneinde de gemeente of het samenwerkingsverband in staat te stellen allochtone vrouwen
      deel te laten nemen aan een inburgeringsvoorziening en deze inburgeringsvoorziening te laten afsluiten met het
      inburgeringsexamen.

      2 Het budget voor de bedragen, bedoeld in het eerste lid, bedraagt € 8.000.000. De Minister kan besluiten het
      budget te verhogen. De bijdrage wordt onder voorbehoud van autorisatie van de begrotingswetgever verleend en
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019949/2009-07-04#Artikel2
  - number: '3'
    text: |-
      1 Indien een gemeente of een samenwerkingsverband in aanmerking wenst te komen voor verlening van een bijdrage
      dient het college of het bestuur binnen drie weken na inwerkingtreding van deze regeling een aanvraag in, onder
      gebruikmaking van het in [bijlage 1][ref1] opgenomen formulier. De aanvraag gaat in ieder geval vergezeld van de
      prognose, welke ten minste 5 bedraagt.

      2 De Minister beoordeelt alle ingediende aanvragen en prognoses gezamenlijk en verleent per aanvraag een voorschot
      op de bijdrage aan de hand van het bepaalde in het derde en vierde lid.

      3 Indien het budget, bedoeld in [artikel 2, tweede lid][ref2], toereikend is om alle ingediende prognoses te
      honoreren, is de hoogte van het voorschot gelijk aan:

      a. € 4235 vermenigvuldigd met het deel van de prognose dat betrekking heeft op het aantal allochtone vrouwen,
      behorend tot de categorie ‘uitkeringsgerechtigd’, en:

      b. € 6180 vermenigvuldigd met het deel van de prognose dat betrekking heeft op het aantal allochtone vrouwen,
      behorend tot de categorie ‘niet-werkend en niet-uitkeringsgerechtigd’.

      4 Indien het budget, bedoeld in [artikel 2, tweede lid][ref3], niet toereikend is om alle ingediende prognoses te
      honoreren, bepaalt de Minister het relatieve aandeel van de ingediende prognose in het totaal van de prognoses,
      aan de hand waarvan de Minister vervolgens de ingediende prognose neerwaarts bijstelt, waarbij de neerwaarts
      bijgestelde prognose echter niet lager zal zijn dan 5. De hoogte van het voorschot wordt in dit geval vastgesteld
      aan de hand van de bedragen, genoemd in het derde lid, vermenigvuldigd met de neerwaarts bijgestelde prognose.

      5 De beschikking tot verlening van het voorschot wordt binnen tien weken na inwerkingtreding van deze regeling aan
      het college of het bestuur bekendgemaakt.


