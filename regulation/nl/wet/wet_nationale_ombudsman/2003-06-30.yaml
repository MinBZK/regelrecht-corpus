$id: wet_nationale_ombudsman
regulatory_layer: WET
publication_date: '2022-01-18'
valid_from: '2003-06-30'
bwb_id: BWBR0003372
url: https://wetten.overheid.nl/BWBR0003372/2003-06-30
articles:
  - number: '1'
    text: 'Deze wet verstaat onder:'
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel1
  - number: 1.a
    text: |-
      ombudsman: de Nationale ombudsman, bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel2
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '2'
        hoofdstuk: I
  - number: 1.b
    text: |-
      ambtenaar: een ambtenaar, een gewezen ambtenaar, een persoon met wie door een bestuursorgaan een
      arbeidsovereenkomst is gesloten naar burgerlijk recht, ook na beëindiging van de arbeidsovereenkomst, een
      dienstplichtig militair, ook na het einde van de dienstplicht, alsmede andere personen werkzaam onder de
      verantwoordelijkheid van het bestuursorgaan, ook na het beëindigen van de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel1
  - number: 1a.1
    text: 'Deze wet is van toepassing op de gedragingen van de volgende bestuursorganen:'
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel1a
  - number: 1a.1.a
    text: Onze Ministers;
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel1a
  - number: 1a.1.b
    text: |-
      bestuursorganen van provincies, gemeenten, waterschappen en gemeenschappelijke regelingen, die overeenkomstig
      [artikel 1b][ref1] zijn aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel1b
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: 1b
  - number: 1a.1.c
    text: |-
      bestuursorganen aan welke bij of krachtens wettelijk voorschrift een taak met betrekking tot de politie is
      opgedragen, voor zover het de uitoefening van die taak betreft;
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel1a
  - number: 1a.1.d
    text: |-
      bestuursorganen van provincies, gemeenten, waterschappen en gemeenschappelijke regelingen voor zover het de
      gedragingen van voor hen werkzame buitengewoon opsporingsambtenaren betreft;
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel1a
  - number: 1a.1.e
    text: andere bestuursorganen, voor zover niet bij algemene maatregel van bestuur uitgezonderd.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel1a
  - number: 1a.3
    text: |-
      In afwijking van het eerste lid is deze wet niet van toepassing op gedragingen van de Commissie gelijke
      behandeling, bedoeld in de [Algemene wet gelijke behandeling][ref1] .


      [ref1]: https://wetten.overheid.nl/BWBR0006502
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0006502
  - number: 1a.4
    text: |-
      Een gedraging van een ambtenaar, verricht in de uitoefening van zijn functie, wordt aangemerkt als een gedraging
      van het bestuursorgaan onder wiens verantwoordelijkheid hij werkzaam is.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel1a
  - number: 1b.1
    text: |-
      Bij ministerieel besluit worden de bestuursorganen van provincies, gemeenten, waterschappen en gemeenschappelijke
      regelingen aangewezen, waarop deze wet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel1b
  - number: 1b.2
    text: |-
      Een aanwijzing als bedoeld in het eerste lid geschiedt door Onze Minister van Binnenlandse Zaken op verzoek van het
      bestuur van de desbetreffende provincie, gemeente, gemeenschappelijke regeling of het desbetreffende waterschap.
      Op verzoek van of namens de provincies onderscheidenlijk de waterschappen geschiedt de aanwijzing van de provincies
      onderscheidenlijk de waterschappen gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel1b
  - number: 1b.3
    text: |-
      Het verzoek om aanwijzing wordt voor 1 juli van het jaar voorafgaand aan het jaar waarin de aanwijzing in moet gaan
      bij Onze Minister van Binnenlandse Zaken ingediend. Onze Minister van Binnenlandse Zaken bevestigt onverwijld de
      ontvangst van het verzoek.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel1b
  - number: 1b.4
    text: |-
      De aanwijzing van de daarvoor in aanmerking komende bestuursorganen geschiedt telkens met ingang van 1 januari van
      het desbetreffende jaar. Onze Minister van Binnenlandse Zaken kan in afwijking van de eerste volzin de aanwijzing
      van bestuursorganen op een ander tijdstip doen ingaan, indien omstandigheden van dringende aard daartoe nopen. Het
      aanwijzingsbesluit wordt in de Staatscourant bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel1b
  - number: 1b.5
    text: |-
      De aanwijzing geschiedt voor een periode van vier jaar. Deze periode wordt telkens met twee jaar verlengd, tenzij
      het bestuur van de desbetreffende provincie, gemeente, gemeenschappelijke regeling of het desbetreffende waterschap
      voor 1 januari van het jaar voorafgaand aan het jaar waarin de verlenging plaats zal vinden aan Onze Minister
      van Binnenlandse Zaken heeft verzocht de aanwijzing te beëindigen. Onze Minister van Binnenlandse Zaken bevestigt
      onverwijld de ontvangst van het verzoek. Van de beëindiging van de aanwijzing wordt door Onze Minister van
      Binnenlandse Zaken mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel1b
  - number: 1c.1
    text: |-
      De rechtspersoon waartoe het ingevolge [artikel 1b][ref1] aangewezen bestuursorgaan behoort, is een door Onze
      Minister van Binnenlandse Zaken vast te stellen vergoeding verschuldigd ter dekking van de kosten die zijn
      verbonden aan het beschikbaarstellen van de klachtvoorziening bij de Nationale ombudsman aan het desbetreffende
      bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel1b
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel1c
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: 1b
  - number: 1c.2
    text: 'Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel1c
  - number: 1c.2.a
    text: de berekening van de te betalen vergoeding;
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel1c
  - number: 1c.2.b
    text: de wijze van betaling van de verschuldigde vergoeding;
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel1c
  - number: 1c.2.c
    text: het tijdstip waarop de verschuldigde vergoeding dient te zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel1c
  - number: '2.1'
    text: Er is een Nationale ombudsman.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel2
  - number: '2.2'
    text: |-
      De ombudsman wordt benoemd door de Tweede Kamer der Staten-Generaal. Bij de benoeming slaat de Tweede Kamer zodanig
      acht op een aanbeveling, daartoe in gezamenlijk overleg opgemaakt door de vice-president van de Raad van State, de
      president van de Hoge Raad der Nederlanden en de president van de Algemene Rekenkamer en bevattende de namen van
      ten minste drie personen, als zij zal dienstig oordelen.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel2
  - number: '2.3'
    text: De benoeming geschiedt voor de duur van zes jaren.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel2
  - number: '2.4'
    text: |-
      Indien de Tweede Kamer voornemens is de ombudsman opnieuw te benoemen, kan zij bepalen dat het tweede lid, tweede
      volzin, buiten toepassing blijft.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel2
  - number: '2.5'
    text: |-
      Indien blijkt dat de Tweede Kamer niet tijdig tot de benoeming van een nieuwe ombudsman zal kunnen
      komen, voorziet de Tweede Kamer zo spoedig mogelijk in de waarneming van het ambt van ombudsman.
      [Artikel 10, vijfde tot en met zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel10
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '10'
        hoofdstuk: I
  - number: '3.1'
    text: |-
      De Tweede Kamer ontslaat de ombudsman met ingang van de eerstvolgende maand na die waarin hij de vijfenzestigjarige
      leeftijd bereikt.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel3
  - number: '3.2'
    text: 'De Tweede Kamer ontslaat de ombudsman voorts:'
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel3
  - number: 3.2.a
    text: op zijn verzoek;
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel3
  - number: 3.2.b
    text: wanneer hij uit hoofde van ziekten of gebreken blijvend ongeschikt is zijn functie te vervullen;
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel3
  - number: 3.2.c
    text: bij de aanvaarding van een ambt of betrekking bij deze wet onverenigbaar verklaard met het ambt van ombudsman;
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel3
  - number: 3.2.d
    text: bij het verlies van het Nederlanderschap;
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel3
  - number: 3.2.e
    text: |-
      wanneer hij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem bij zulk
      een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel3
  - number: 3.2.f
    text: |-
      wanneer hij ingevolge onherroepelijk geworden rechterlijke uitspraak onder curatele is gesteld, in staat van
      faillissement is verklaard, ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is
      verklaard, hij surséance van betaling heeft verkregen of wegens schulden is gegijzeld;
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel3
  - number: 3.2.g
    text: |-
      wanneer hij naar het oordeel van de Tweede Kamer door handelen of nalaten ernstig nadeel toebrengt aan het in hem
      te stellen vertrouwen.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel3
  - number: '4.1'
    text: 'De Tweede Kamer stelt de ombudsman op non-activiteit ingeval:'
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel4
  - number: 4.1.a
    text: hij zich in voorlopige hechtenis bevindt;
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel4
  - number: 4.1.b
    text: |-
      hij bij een nog niet onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem bij
      zulk een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel4
  - number: 4.1.c
    text: |-
      hij onder curatele is gesteld, in staat van faillissement is verklaard, ten aanzien van hem de
      schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, hij surséance van betaling heeft
      verkregen of wegens schulden is gegijzeld ingevolge een nog niet onherroepelijk geworden rechterlijke uitspraak.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel4
  - number: '4.2'
    text: |-
      De Tweede Kamer kan de ombudsman op non-activiteit stellen, indien tegen hem een gerechtelijk vooronderzoek ter
      zake van misdrijf wordt ingesteld of indien er een ander ernstig vermoeden is voor het bestaan van feiten of
      omstandigheden die tot ontslag, anders dan op gronden vermeld in [artikel 3, tweede lid onder ][ref1] zouden kunnen
      leiden.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel3
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '3'
        hoofdstuk: I
  - number: '4.3'
    text: |-
      In het geval, bedoeld in het tweede lid, eindigt de non-activiteit na drie maanden. De Tweede Kamer kan de
      maatregel echter telkens voor ten hoogste drie maanden verlengen.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel4
  - number: '4.4'
    text: De Tweede Kamer beëindigt de non-activiteit zodra de grond voor de maatregel is vervallen.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel4
  - number: '4.5'
    text: |-
      De Tweede Kamer kan bij de beslissing waarbij de ombudsman op non-activiteit wordt gesteld, bepalen dat tijdens de
      duur van de non-activiteit geen salaris of slechts een gedeelte van het salaris zal worden genoten, in het laatste
      geval onder aanwijzing van het gedeelte dat zal worden genoten.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel4
  - number: '4.6'
    text: |-
      Indien de non-activiteit anders dan door ontslag is geëindigd, kan de Tweede Kamer beslissen, dat het niet genoten
      salaris alsnog geheel of gedeeltelijk zal worden uitbetaald, in het laatste geval onder aanwijzing van het gedeelte
      dat zal worden uitbetaald.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel4
  - number: '5.1'
    text: 'De ombudsman kan niet bekleden:'
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel5
  - number: 5.1.a
    text: |-
      het lidmaatschap van publiekrechtelijke colleges waarvoor de keuze geschiedt bij krachtens wettelijk voorschrift
      uitgeschreven verkiezingen;
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel5
  - number: 5.1.b
    text: een openbare betrekking waaraan een vaste beloning of toelage is verbonden;
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel5
  - number: 5.1.c
    text: het lidmaatschap van vaste colleges van advies en bijstand aan de Regering;
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel5
  - number: 5.1.d
    text: het beroep of ambt van advocaat, procureur of notaris.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel5
  - number: '5.2'
    text: |-
      De ombudsman vervult geen betrekkingen waarvan de uitoefening ongewenst is met het oog op een goede vervulling van
      zijn ambt of op de handhaving van zijn onpartijdigheid en onafhankelijkheid of van het vertrouwen daarin.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel5
  - number: '6'
    text: |-
      De bepalingen van de [Algemene pensioenwet politieke ambtsdragers][ref1] zijn van overeenkomstige toepassing op
      de ombudsman, met dien verstande dat deze wordt gelijkgesteld met een lid van de Tweede Kamer der Staten-Generaal,
      doch de verrekening van de inkomsten plaatsvindt overeenkomstig artikel 9 van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002691
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002691
  - number: '7'
    text: |-
      Wij regelen bij algemene maatregel van bestuur de aanspraken in geval van ziekte, alsmede de overige rechten en
      verplichtingen van de ombudsman die deel uitmaken van zijn rechtspositie, voor zover niet bij de wet geregeld.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel7
  - number: '8'
    text: 'Alvorens zijn ambt te aanvaarden legt de ombudsman in de handen van de Voorzitter der Tweede Kamer af:'
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel8
  - number: 8.a
    text: |-
      de eed of verklaring en belofte dat hij tot het verkrijgen van zijn benoeming rechtstreeks noch middellijk, onder
      welke naam of onder welk voorwendsel ook, aan iemand iets heeft gegeven of beloofd, alsmede dat hij om iets in zijn
      ambt te doen of te laten rechtstreeks noch middellijk van iemand enig geschenk of enige belofte heeft aangenomen of
      zal aannemen;
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel8
  - number: 8.b
    text: |-
      de eed of belofte van trouw aan de [Grondwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '9.1'
    text: |-
      De Tweede Kamer benoemt op verzoek van de ombudsman zo nodig een of meer personen tot substituut-ombudsman. De
      ombudsman maakt daartoe een aanbeveling op, die de namen van ten minste drie personen bevat.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel9
  - number: '9.2'
    text: |-
      De benoeming van een substituut-ombudsman geschiedt voor de duur van de ambtstermijn van de ombudsman op wiens
      verzoek hij is benoemd. De Tweede Kamer kan op voordracht van de nieuwe ombudsman de ambtstermijn van een
      substituut-ombudsman verlengen voor de duur van ten hoogste zes maanden.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel9
  - number: '9.3'
    text: |-
      Indien de Tweede Kamer voornemens is een substituut-ombudsman opnieuw te benoemen, kan zij bepalen dat het eerste
      lid, tweede volzin, buiten toepassing blijft.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel9
  - number: '9.4'
    text: |-
      De[ artikelen 3 tot en met 8][ref1], [18 tot en met 24][ref2] en [27, vijfde lid][ref3], zijn van overeenkomstig
      toepassing op een substituut-ombudsman.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003372#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0003372#Artikel27
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '3'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003372
        artikel: '18'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003372
        artikel: '27'
        hoofdstuk: II
  - number: '9.5'
    text: De ombudsman regelt de werkzaamheden van een substituut-ombudsman.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel9
  - number: '9.6'
    text: |-
      De ombudsman kan bepalen dat de bevoegdheden, bedoeld in de[ artikelen 25][ref1], [26][ref2],
      [27, eerste tot en met vierde lid][ref3], en [28, derde lid][ref4], tevens worden uitgeoefend door een substituut-
      ombudsman. De ombudsman kan voor de uitoefening van die bevoegdheden richtlijnen vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0003372#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0003372#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0003372#Artikel28
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '25'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003372
        artikel: '26'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003372
        artikel: '27'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0003372
        artikel: '28'
        hoofdstuk: II
  - number: '10.1'
    text: |-
      De ombudsman regelt zijn vervanging door een substituut-ombudsman, voor het geval dat hij tijdelijk niet in staat
      is zijn ambt te vervullen.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel10
  - number: '10.2'
    text: |-
      Indien geen substituut-ombudsman aanwezig of beschikbaar is, voorziet de Tweede Kamer zo spoedig mogelijk in de
      vervanging van de ombudsman. In dat geval eindigt de vervanging wanneer de ombudsman weer in staat is zijn ambt te
      vervullen of, indien de ombudsman op non-activiteit is gesteld, op het tijdstip dat de non-activiteit eindigt.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel10
  - number: '10.3'
    text: |-
      Indien de ombudsman overlijdt of ingevolge [artikel 3][ref1] wordt ontslagen, blijven de substituut-ombudsmannen,
      in afwijking van het bepaalde in [artikel 9, tweede lid, eerste volzin][ref2], in functie tot het tijdstip waarop
      een nieuwe ombudsman in functie is getreden. De Tweede Kamer voorziet in dat geval zo spoedig mogelijk in de
      waarneming van het ambt van ombudsman door een substituut-ombudsman.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003372#Artikel9
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '3'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003372
        artikel: '9'
        hoofdstuk: I
  - number: '10.4'
    text: |-
      Indien geen substituut-ombudsman aanwezig of beschikbaar is, voorziet de Tweede Kamer zo spoedig mogelijk in de
      waarneming van het ambt van ombudsman.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel10
  - number: '10.5'
    text: De waarneming eindigt van rechtswege op het tijdstip waarop een nieuwe ombudsman in functie is getreden.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel10
  - number: '10.6'
    text: |-
      Op degene die krachtens het tweede of het vierde lid de ombudsman vervangt of het ambt van ombudsman waarneemt,
      zijn de[ artikelen 2, tweede lid, tweede volzin, derde en vierde lid][ref1], [3, eerste lid][ref2], [6][ref3] en
      [9][ref4] van deze wet niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003372#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003372#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0003372#Artikel9
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003372
        artikel: '3'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0003372
        artikel: '6'
        hoofdstuk: I
      - id: ref4
        bwb_id: BWBR0003372
        artikel: '9'
        hoofdstuk: I
  - number: '10.7'
    text: |-
      Indien de in het zesde lid bedoelde vervanger respectievelijk waarnemer een betrekking of lidmaatschap als bedoeld
      in [artikel 5, eerste lid, onderdelen ][ref1], bekleedt of gaat bekleden, is hij voor de duur van de vervanging
      respectievelijk de waarneming in die betrekking of dat lidmaatschap van rechtswege op non-activiteit gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel5
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '5'
        hoofdstuk: I
  - number: '11.1'
    text: Te zijner ondersteuning beschikt de ombudsman over een bureau.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel11
  - number: '11.2'
    text: |-
      De tot het bureau behorende personen worden door Ons op voordracht van de ombudsman benoemd, bevorderd, geschorst
      en ontslagen.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel11
  - number: '11.3'
    text: |-
      Wij bepalen in welke gevallen tot het bureau behorende personen door de ombudsman worden benoemd, bevorderd,
      geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel11
  - number: '12.1'
    text: |-
      Een ieder heeft het recht de ombudsman schriftelijk te verzoeken een onderzoek in te stellen naar de wijze
      waarop een bestuursorgaan zich in een bepaalde aangelegenheid jegens een natuurlijk persoon of rechtspersoon
      heeft gedragen, tenzij sedertdien meer dan een jaar is verstreken. Indien binnen een jaar nadat de gedraging
      plaatsvond die gedraging aan het oordeel van een rechterlijke instantie, dan wel ingevolge een wettelijk geregelde
      administratiefrechtelijke voorziening aan het oordeel van een andere instantie is onderworpen, eindigt de termijn
      een jaar na de datum waarop in die procedure een uitspraak is gedaan waartegen geen beroep meer openstaat, of de
      procedure op een andere wijze is geëindigd.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel12
  - number: '12.2'
    text: |-
      De verzoeker dient alvorens het verzoek te doen, over de gedraging een klacht in bij het betrokken bestuursorgaan,
      tenzij dit redelijkerwijs niet van hem kan worden gevergd. Indien de klacht binnen een jaar nadat de gedraging
      plaatsvond is ingediend, eindigt de in het eerste lid bedoelde termijn een jaar na de kennisgeving door het
      bestuursorgaan van de bevindingen van het onderzoek
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel12
  - number: '12.3'
    text: 'Het verzoekschrift dient te bevatten:'
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel12
  - number: 12.3.a
    text: de naam en het adres van de verzoeker;
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel12
  - number: 12.3.b
    text: |-
      zo duidelijk mogelijk, een omschrijving van de gedraging waarop het verzoekschrift betrekking heeft en mededeling
      wie zich aldus heeft gedragen en jegens wie de gedraging heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel12
  - number: 12.3.c
    text: de grieven met betrekking tot de gedraging;
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel12
  - number: 12.3.d
    text: |-
      de wijze waarop een klacht is ingediend en zo mogelijk de bevindingen van het onderzoek naar de klacht door het
      betrokken bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel12
  - number: '12.4'
    text: |-
      Indien het verzoekschrift in een vreemde taal is gesteld en een vertaling voor een goede behandeling van de klacht
      noodzakelijk is, kan de Nationale ombudsman besluiten het verzoekschrift niet in behandeling te nemen, mits de
      verzoeker de gelegenheid heeft gehad binnen een door de ombudsman gestelde termijn het verzoekschrift met een
      vertaling aan te vullen.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel12
  - number: '12.5'
    text: |-
      Tenzij [artikel 16][ref1] van toepassing is, is de ombudsman bevoegd en, tenzij [artikel 14][ref2] van toepassing
      is, ook verplicht aan een verzoek als bedoeld in het eerste lid gevolg te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003372#Artikel14
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '16'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003372
        artikel: '14'
        hoofdstuk: II
  - number: '13'
    text: |-
      Indien naar het oordeel van de ombudsman ten aanzien van de in het verzoekschrift bedoelde gedraging voor de
      verzoeker een wettelijk geregelde administratiefrechtelijke voorziening openstaat, verwijst hij hem onverwijld
      naar de bevoegde instantie en draagt hij het verzoekschrift, nadat daarop de datum van ontvangst is aangetekend,
      aan die instantie over. Voor de toepassing van de regeling waarop de openstaande voorziening berust, wordt het
      verzoekschrift beschouwd als te voldoen aan de in die regeling voorkomende bepalingen met betrekking tot de
      wijze van indiening en adressering en wordt voorts het tijdstip, waarop het verzoekschrift door de ombudsman
      is ontvangen, beschouwd als het tijdstip waarop de zaak bij de in die regeling bedoelde instantie aanhangig is
      gemaakt. Deze instantie stelt de verzoeker in de gelegenheid, binnen dertig dagen nadat zij hiervan mededeling
      heeft gedaan, zijn verzoekschrift overeenkomstig de voor die voorziening geldende regels aan te vullen of te
      wijzigen en voor zover nodig het voor behandeling verschuldigde recht te voldoen.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel13
  - number: '14'
    text: |-
      De ombudsman is niet verplicht een onderzoek als bedoeld in [artikel 12, eerste lid][ref1], in te stellen of voort
      te zetten, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel12
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '12'
        hoofdstuk: II
  - number: 14.a
    text: |-
      het verzoekschrift te laat is ingediend of niet voldoet aan de vereisten, vermeld in
      [artikel 12, derde en vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel12
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '12'
        hoofdstuk: II
  - number: 14.b
    text: het verzoek kennelijk ongegrond is;
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel14
  - number: 14.c
    text: het belang van de verzoeker of het gewicht van de gedraging kennelijk onvoldoende is;
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel14
  - number: 14.d
    text: de verzoeker een ander is dan degene jegens wie de gedraging heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel14
  - number: 14.e
    text: |-
      een verzoekschrift, dezelfde gedraging betreffende, bij hem, dan wel bij een tot de behandeling van
      verzoekschriften bevoegde commissie uit de Eerste of Tweede Kamer of uit de verenigde vergadering der Staten-
      Generaal, in behandeling is of - behoudens indien een nieuw feit of een nieuwe omstandigheid bekend is geworden en
      zulks tot een ander oordeel over de bedoelde gedraging zou hebben kunnen leiden - door hem is afgedaan of daarover
      door de betrokken commissie haar conclusie op een verzoekschrift aan de Eerste of Tweede Kamer dan wel de verenigde
      vergadering der Staten-Generaal is voorgesteld;
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel14
  - number: 14.f
    text: |-
      een verzoekschrift, dezelfde gedraging betreffende, ingevolge een wettelijk geregelde klachtvoorziening bij een
      onafhankelijke klachtinstantie in behandeling is of daardoor is afgedaan;
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel14
  - number: 14.g
    text: |-
      ten aanzien van de gedraging voor de verzoeker een wettelijk geregelde administratiefrechtelijke voorziening heeft
      opengestaan en hij daarvan geen gebruik heeft gemaakt;
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel14
  - number: 14.h
    text: |-
      ten aanzien van de gedraging anders dan ingevolge een wettelijk geregelde administratiefrechtelijke voorziening
      door een rechterlijke instantie uitspraak is gedaan;
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel14
  - number: 14.i
    text: |-
      niet is voldaan aan het vereiste van [artikel 12, tweede lid][ref1], tenzij van de verzoeker redelijkerwijs niet
      kan worden gevergd dat hij de uitkomst van de behandeling van de klacht door het bestuursorgaan verder afwacht;


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel12
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '12'
        hoofdstuk: II
  - number: 14.j
    text: |-
      en zolang ten aanzien van een gedraging van het bestuursorgaan die nauw samenhangt met het onderwerp van het
      verzoekschrift een procedure aanhangig is bij een rechterlijke instantie, dan wel ingevolge een wettelijk geregelde
      administratiefrechtelijke voorziening bij een andere instantie;
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel14
  - number: 14.k
    text: |-
      en zolang het verzoekschrift betrekking heeft op een gedraging die nauw samenhangt met een onderwerp, waaromtrent
      anders dan ingevolge een wettelijk geregelde administratiefrechtelijke voorziening een procedure bij een
      rechterlijke instantie aanhangig is.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel14
  - number: '15'
    text: |-
      Tenzij [artikel 16][ref1] van toepassing is, is de ombudsman bevoegd uit eigen beweging een onderzoek in te stellen
      naar de wijze waarop een bestuursorgaan zich in een bepaalde aangelegenheid heeft gedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel16
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '16'
        hoofdstuk: II
  - number: '16'
    text: |-
      De ombudsman is niet bevoegd een onderzoek als bedoeld in [artikel 12, eerste lid][ref1], of [artikel 15][ref2] in
      te stellen of voort te zetten:


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003372#Artikel15
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '12'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003372
        artikel: '15'
        hoofdstuk: II
  - number: 16.a
    text: |-
      indien de aangelegenheid behoort tot het algemeen regeringsbeleid, daaronder begrepen het algemeen beleid ter
      handhaving van de rechtsorde, of tot het algemeen beleid van het betrokken bestuursorgaan;
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel16
  - number: 16.b
    text: betreffende algemeen verbindende voorschriften;
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel16
  - number: 16.c
    text: |-
      zolang ten aanzien van de gedraging een wettelijk geregelde administratiefrechtelijke voorziening openstaat, tenzij
      [artikel 6:12 van de Algemene wet bestuursrecht][ref1] van toepassing is, of ingevolge een zodanige voorziening een
      procedure aanhangig is;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: 16.d
    text: |-
      zolang ten aanzien van de gedraging anders dan ingevolge een wettelijk geregelde administratiefrechtelijke
      voorziening een procedure bij een rechterlijke instantie aanhangig is, dan wel beroep openstaat tegen een uitspraak
      die in een zodanige procedure is gedaan;
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel16
  - number: 16.e
    text: |-
      indien ten aanzien van de gedraging ingevolge een wettelijk geregelde administratiefrechtelijke voorziening door
      een rechterlijke instantie uitspraak is gedaan;
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel16
  - number: 16.f
    text: |-
      in aangelegenheden betreffende belastingen en andere heffingen, indien ten aanzien van de gedraging een wettelijk
      geregelde administratiefrechtelijke voorziening heeft opengestaan;
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel16
  - number: 16.g
    text: ten aanzien van gedragingen waarop de rechterlijke macht toeziet.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel16
  - number: '17.1'
    text: |-
      Indien de ombudsman op grond van [artikel 14][ref1] of [artikel 16][ref2] geen gevolg geeft aan een
      verzoek tot het instellen van een onderzoek, dan wel het onderzoek niet voortzet, doet hij daarvan zo
      spoedig mogelijk schriftelijke mededeling aan de verzoeker onder vermelding van de redenen. In het geval
      dat hij een onderzoek niet voortzet doet hij de hiervoor bedoelde mededeling tevens aan het betrokken
      bestuursorgaan en, in voorkomend geval, aan de betrokken ambtenaar. Met het oog op het bepaalde in het
      derde lid neemt hij daarbij [artikel 19, vierde lid, laatste volzin][ref3], van deze wet en het bepaalde in
      [artikel 10 van de Wet openbaarheid van bestuur][ref4], in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003372#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003372#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '14'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003372
        artikel: '16'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003372
        artikel: '19'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '17.2'
    text: |-
      Indien de ombudsman op grond van [artikel 14, onderdeel i][ref1], geen gevolg geeft aan een verzoek tot onderzoek,
      dan wel het onderzoek niet voortzet, wijst hij verzoeker tevens op de mogelijkheid het betrokken bestuursorgaan, de
      betrokken instelling of dienst die, of het betrokken bedrijf dat onder verantwoordelijkheid van dat orgaan werkzaam
      is, dan wel de betrokken ambtenaar, alsnog van zijn grieven met betrekking tot de gedraging in kennis te stellen en
      in de gelegenheid te stellen zijn of haar zienswijze daarop te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel14
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '14'
        hoofdstuk: II
  - number: '17.3'
    text: |-
      De ombudsman geeft aan een ieder die daarom verzoekt, afschrift of uittreksel van de mededeling, bedoeld in het
      eerste lid. Met betrekking tot de daarvoor in rekening te brengen vergoedingen en met betrekking tot de kosteloze
      verstrekking is het bepaalde bij of krachtens de [Wet tarieven in burgerlijke zaken][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001852
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001852
  - number: '18.1'
    text: |-
      De ombudsman stelt het bestuursorgaan en degene, op wiens gedraging het onderzoek betrekking heeft, alsmede in het
      geval, bedoeld in [artikel 12, eerste lid][ref1], de verzoeker in de gelegenheid schriftelijk dan wel mondeling
      en al dan niet in elkaars tegenwoordigheid - een en ander ter beoordeling van de ombudsman - hun standpunt toe
      te lichten.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel12
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '12'
        hoofdstuk: II
  - number: '18.2'
    text: |-
      De betrokkenen kunnen zich doen vertegenwoordigen of doen bijstaan door een raadsman. De ombudsman kan weigeren
      bepaalde personen die van het verlenen van rechtsgeleerde hulp hun beroep maken en niet advocaat of procureur zijn,
      als vertegenwoordiger toe te laten.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel18
  - number: '19.1'
    text: |-
      Het bestuursorgaan, degene op wiens gedraging het onderzoek betrekking heeft, getuigen en de verzoeker verstrekken
      de ombudsman de inlichtingen die deze ten behoeve van een onderzoek behoeft en zijn op een daartoe strekkend
      verzoek verplicht daartoe voor hem te verschijnen. Gelijke verplichtingen rusten op ieder college, met dien
      verstande dat het college bepaalt wie zijner leden aan de verplichtingen zal voldoen, tenzij de ombudsman één of
      meer bepaalde leden aanwijst. Betrokkenen kunnen zich doen bijstaan door een raadsman.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel19
  - number: '19.2'
    text: |-
      De verplichting om voor de ombudsman te verschijnen geldt niet voor Onze Ministers. Wanneer een minister zelf niet
      verschijnt, laat hij zich vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel19
  - number: '19.3'
    text: |-
      Inlichtingen die betrekking hebben op het beleid, gevoerd onder de verantwoordelijkheid van een minister of een
      ander bestuursorgaan kan de ombudsman bij de daarbij betrokken ambtenaren slechts inwinnen door tussenkomst van de
      minister onderscheidenlijk dat orgaan.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel19
  - number: '19.4'
    text: |-
      De ingevolge het eerste lid opgeroepen personen kunnen zich van het verstrekken van inlichtingen verschonen
      wegens ambts- of beroepsgeheim, doch alleen voor zover betreft hetgeen waarvan de wetenschap aan hen als zodanig
      is toevertrouwd. Ambtenaren kunnen zich slechts met verwijzing naar de hun ingevolge de [Ambtenarenwet][ref1]
      onderscheidenlijk de [Militaire Ambtenarenwet 1931][ref2] en de [Politiewet 1993][ref3] opgelegde
      geheimhoudingsplicht verschonen voor zover het verstrekken van de verlangde inlichtingen in strijd is met enige
      andere wettelijke bepaling tot geheimhouding of met het belang van de Staat. De ombudsman kan ter staving van het
      beroep op het verschoningsrecht overlegging vragen van een bijzondere schriftelijke last van het orgaan, welks
      tussenkomst voor het verstrekken van inlichtingen in het derde lid is voorgeschreven. Dit orgaan kan bepalen,
      dat de geheimhoudingsplicht slechts wordt opgeheven met betrekking tot het verschaffen van inlichtingen aan de
      ombudsman onder de voorwaarde dat het geheime karakter daarvan wordt gehandhaafd.


      [ref1]: https://wetten.overheid.nl/BWBR0001947
      [ref2]: https://wetten.overheid.nl/BWBR0001952
      [ref3]: https://wetten.overheid.nl/BWBR0006299
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001947
      - id: ref2
        bwb_id: BWBR0001952
      - id: ref3
        bwb_id: BWBR0006299
  - number: '19.5'
    text: |-
      Het orgaan door welks tussenkomst de inlichtingen worden ingewonnen, kan zich bij het horen van de ambtenaren doen
      vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel19
  - number: '20.1'
    text: |-
      De ombudsman is bevoegd ten dienste van het onderzoek werkzaamheden aan deskundigen op te dragen. Hij is voorts
      bevoegd in het belang van het onderzoek deskundigen en tolken op te roepen. Zij die als deskundige of als tolk zijn
      opgeroepen, zijn verplicht voor de ombudsman te verschijnen en hun diensten als zodanig te verlenen.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel20
  - number: '20.2'
    text: |-
      Op deskundigen, tevens ambtenaren, zijn [het derde, vierde en vijfde lid van artikel 19][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel19
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '19'
        hoofdstuk: II
  - number: '20.3'
    text: |-
      De tolken en deskundigen zijn verplicht tot geheimhouding van hetgeen hun ter zake van hun dienstverlening ter
      kennis komt.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel20
  - number: '21.1'
    text: |-
      Oproepingen ingevolge de[ artikelen 19][ref1] en [20][ref2] geschieden bij aangetekende brief.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0003372#Artikel20
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '19'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003372
        artikel: '20'
        hoofdstuk: II
  - number: '21.2'
    text: |-
      De ombudsman kan bevelen, dat personen die, hoewel wettelijk opgeroepen, niet zijn verschenen, door de openbare
      macht voor hem worden gebracht om aan hun verplichtingen te voldoen.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel21
  - number: '22.1'
    text: |-
      De ombudsman kan bevelen, dat getuigen niet zullen worden gehoord en tolken niet tot de uitoefening van hun taak
      zullen worden toegelaten dan na het afleggen van eed of belofte.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel22
  - number: '22.2'
    text: |-
      Zij leggen in dat geval in handen van de ombudsman de eed of belofte af; indien zij worden gehoord als getuige:
      dat zij zullen zeggen de gehele waarheid en niets dan de waarheid; de tolken: dat zij hun plichten als tolk met
      nauwgezetheid zullen vervullen.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel22
  - number: '22.3'
    text: De deskundigen zijn verplicht hun taak onpartijdig en naar beste weten te verrichten.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel22
  - number: '23.1'
    text: |-
      De ingevolge deze wet opgeroepenen ontvangen desverlangd voor reis- en verblijfkosten alsmede wegens tijdverzuim en
      daarmede verband houdende noodzakelijke kosten, vergoeding uit ’s Rijks kas overeenkomstig het bij en krachtens de
      [Wet tarieven in burgerlijke zaken][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0001852
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001852
  - number: '23.2'
    text: |-
      Voor zover bij algemene maatregel van bestuur niet anders is bepaald, ontvangen de in het eerste lid bedoelde
      personen die in openbare dienst zijn geen vergoeding als bedoeld in het eerste lid, indien zij zijn opgeroepen in
      verband met hun taak als zodanig.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel23
  - number: '23.3'
    text: De ombudsman begroot de ingevolge dit artikel verschuldigde vergoeding.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel23
  - number: '24.1'
    text: |-
      Aan de ombudsman worden op diens schriftelijk verzoek ten behoeve van een onderzoek bescheiden, gebezigd bij
      de vervulling van de overheidstaak in de aangelegenheid waarop het onderzoek betrekking heeft, al dan niet in
      afschrift, overgelegd. [Artikel 19, derde en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel19
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '19'
        hoofdstuk: II
  - number: '24.2'
    text: |-
      De ombudsman kan, voor zover dit naar zijn oordeel ten behoeve van het onderzoek is vereist, zonder toestemming,
      met uitzondering van woningen, alle plaatsen betreden waar het bestuursorgaan, wiens gedraging onderzocht wordt,
      zijn taak verricht. Voor het betreden van woningen is toestemming van de bewoner vereist.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel24
  - number: '24.3'
    text: |-
      Onze Ministers kunnen aan de ombudsman het betreden van bepaalde plaatsen verbieden, indien dit naar hun oordeel de
      veiligheid van de staat zou schaden.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel24
  - number: '25.1'
    text: |-
      De ombudsman deelt, alvorens het onderzoek te beëindigen, zijn bevindingen schriftelijk mede aan het betrokken
      bestuursorgaan en, in voorkomend geval, aan de ambtenaar wiens gedraging voorwerp van onderzoek is geweest,
      alsmede, in het in [artikel 12, eerste lid][ref1], bedoelde geval aan de verzoeker.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel12
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '12'
        hoofdstuk: II
  - number: '25.2'
    text: |-
      De ombudsman stelt het bestuursorgaan, de ambtenaar en de verzoeker in de gelegenheid zich binnen een door hem te
      stellen termijn omtrent de bevindingen te uiten.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel25
  - number: '26.1'
    text: |-
      De ombudsman beoordeelt of het bestuursorgaan zich in de door hem onderzochte aangelegenheid al dan niet behoorlijk
      heeft gedragen.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel26
  - number: '26.2'
    text: |-
      Indien ten aanzien van de gedraging waarop het onderzoek van de ombudsman betrekking heeft anders dan ingevolge
      een wettelijk geregelde administratiefrechtelijke voorziening door een rechterlijke instantie uitspraak is gedaan,
      neemt de ombudsman de rechtsgronden waarop die uitspraak steunt of mede steunt, in acht.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel26
  - number: '27.1'
    text: |-
      Wanneer een onderzoek is afgesloten, stelt de ombudsman een rapport op, waarin hij zijn
      bevindingen en zijn oordeel weergeeft. Met het oog op het bepaalde in het vierde lid neemt
      hij daarbij [artikel 19, vierde lid, laatste volzin][ref1] van deze wet en het bepaalde in
      [artikel 10 van de Wet openbaarheid van bestuur][ref2], in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '19'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '27.2'
    text: |-
      De ombudsman zendt zijn rapport aan het betrokken bestuursorgaan en, in voorkomend geval, aan de ambtenaar wiens
      gedraging voorwerp van onderzoek is geweest. Indien het onderzoek berustte op een verzoekschrift als bedoeld in
      [artikel 12][ref1], zendt hij zijn rapport tevens aan de verzoeker.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel12
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '12'
        hoofdstuk: II
  - number: '27.3'
    text: |-
      Zo hij daartoe aanleiding ziet, kan de ombudsman aan het betrokken orgaan zijn zienswijze over eventueel te nemen
      maatregelen bekendmaken.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel27
  - number: '27.4'
    text: |-
      De ombudsman geeft aan een ieder die daarom verzoekt afschrift of uittreksel van een rapport als bedoeld in het
      eerste lid. Met betrekking tot de daarvoor in rekening te brengen vergoedingen en met betrekking tot kosteloze
      verstrekking is het bepaalde bij of krachtens de [Wet tarieven in burgerlijke zaken][ref1] van overeenkomstige
      toepassing. Tevens legt hij een zodanig rapport ter inzage op een door hem daarvoor aan te wijzen plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0001852
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0001852
  - number: '27.5'
    text: |-
      Voor het overige is de ombudsman verplicht tot geheimhouding van hetgeen hem bij de uitoefening van zijn taak is
      bekend geworden, voor zover dat uit de aard der zaak volgt.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel27
  - number: '28.1'
    text: |-
      De ombudsman zendt jaarlijks een verslag van zijn werkzaamheden aan de beide Kamers der Staten-Generaal en aan
      Onze Ministers. [Artikel 10 van de Wet openbaarheid van bestuur][ref1] is van overeenkomstige toepassing met dien
      verstande dat de ombudsman bij het verslag gegevens kan voegen, slechts ter vertrouwelijke kennisneming door de
      leden van de Staten-Generaal en Onze Ministers.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '28.2'
    text: Hij draagt er zorg voor dat het verslag openbaar wordt gemaakt en algemeen verkrijgbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel28
  - number: '28.3'
    text: |-
      De ombudsman kan ook dadelijk na het afsluiten van een onderzoek de beide Kamers der Staten-Generaal inlichten
      omtrent zijn bevindingen en oordeel, zo dikwijls hij de eerdere kennisneming daarvan voor de Kamers van belang acht
      of één der Kamers dit verzoekt.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel28
  - number: '29'
    text: |-
      De voordrachten voor door Ons te nemen besluiten ter uitvoering van deze wet worden Ons gedaan door Onze Minister
      van Binnenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel29
  - number: '30'
    text: |-
      [Artikel 12][ref1] vindt geen toepassing ten aanzien van gedragingen van de bij ministerieel besluit aangewezen
      bestuursorganen, bedoeld in [artikel 1b][ref2], die hebben plaatsgevonden voordat dat besluit in werking is
      getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003372#Artikel1b
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '12'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003372
        artikel: 1b
  - number: 30a
    text: |-
      Tot een jaar na inwerkingtreding van een besluit als bedoeld in [artikel 1a, eerste lid, onder e][ref1], dan wel
      na de beëindiging van een aanwijzing als bedoeld in [artikel 1b][ref2] kan met betrekking tot een gedraging van het
      desbetreffende bestuursorgaan die heeft plaatsgevonden:


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0003372#Artikel1b
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: 1a
      - id: ref2
        bwb_id: BWBR0003372
        artikel: 1b
  - number: 30a.a
    text: |-
      voordat het desbetreffende bestuursorgaan is uitgezonderd bij een besluit als bedoeld in
      [artikel 1a, eerste lid, onder e][ref1], dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel1a
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: 1a
  - number: 30a.b
    text: |-
      voordat de aanwijzing van het desbetreffende bestuursorgaan als bedoeld in [artikel 1b][ref1] is beëindigd, een
      verzoekschrift als bedoeld in [artikel 12][ref2] bij de Nationale ombudsman worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel1b
      [ref2]: https://wetten.overheid.nl/BWBR0003372#Artikel12
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: 1b
      - id: ref2
        bwb_id: BWBR0003372
        artikel: '12'
        hoofdstuk: II
  - number: '31'
    text: 'Deze wet kan worden aangehaald als: Wet Nationale ombudsman.'
    url: https://wetten.overheid.nl/BWBR0003372/2003-06-30#Artikel31
