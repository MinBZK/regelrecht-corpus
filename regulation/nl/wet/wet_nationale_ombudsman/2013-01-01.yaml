articles:
  - number: '1'
    text: 'Deze wet verstaat onder:'
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel1
  - number: 1.a
    text: |-
      ombudsman: de Nationale ombudsman, bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel2
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '2'
        hoofdstuk: II
  - number: 1.b
    text: |-
      *Kinderombudsman:* de als zodanig aangewezen substituut-ombudsman, bedoeld in [artikel 9, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel9
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '9'
        hoofdstuk: II
  - number: 1.c
    text: |-
      ambtenaar: een ambtenaar, een gewezen ambtenaar, een persoon met wie door een bestuursorgaan een
      arbeidsovereenkomst is gesloten naar burgerlijk recht, ook na beëindiging van de arbeidsovereenkomst, een
      dienstplichtig militair, ook na het einde van de dienstplicht, alsmede andere personen werkzaam onder de
      verantwoordelijkheid van het bestuursorgaan, ook na het beëindigen van de werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel1
  - number: 1.d
    text: 'openbare lichamen: openbare lichamen Bonaire, Sint Eustatius en Saba.'
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel1
  - number: 1a.1
    text: 'Deze wet is van toepassing op de gedragingen van de volgende bestuursorganen:'
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel1a
  - number: 1a.1.a
    text: Onze Ministers;
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel1a
  - number: 1a.1.b
    text: |-
      bestuursorganen van provincies, gemeenten, openbare lichamen, waterschappen en gemeenschappelijke regelingen,
      tenzij voor die bestuursorganen een eigen voorziening voor de behandeling van verzoekschriften is ingesteld op
      grond van respectievelijk [artikel 79q van de Provinciewet][ref1], [artikel 81p van de Gemeentewet][ref2], artikel
      107 van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba, [artikel 51b van de Waterschapswet][ref3] of
      [artikel 10, vierde lid, van de Wet gemeenschappelijke regelingen][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel79q
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel81p
      [ref3]: https://wetten.overheid.nl/BWBR0005108#Artikel51b
      [ref4]: https://wetten.overheid.nl/BWBR0003740#Artikel10
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 79q
      - id: ref2
        bwb_id: BWBR0005416
        artikel: 81p
      - id: ref3
        bwb_id: BWBR0005108
        artikel: 51b
      - id: ref4
        bwb_id: BWBR0003740
        artikel: '10'
  - number: 1a.1.c
    text: |-
      bestuursorganen aan welke bij of krachtens wettelijk voorschrift een taak met betrekking tot de politie is
      opgedragen, voor zover het de uitoefening van die taak betreft;
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel1a
  - number: 1a.1.d
    text: |-
      bestuursorganen van provincies, gemeenten, openbare lichamen, waterschappen en gemeenschappelijke regelingen voor
      zover het de gedragingen van voor hen werkzame buitengewoon opsporingsambtenaren betreft;
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel1a
  - number: 1a.1.e
    text: |-
      andere bestuursorganen, daaronder mede begrepen bestuursorganen in de openbare lichamen, voor zover niet bij
      algemene maatregel van bestuur uitgezonderd.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel1a
  - number: 1a.2
    text: |-
      Een gedraging van een ambtenaar, verricht in de uitoefening van zijn functie, wordt aangemerkt als een gedraging
      van het bestuursorgaan onder wiens verantwoordelijkheid hij werkzaam is.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel1a
  - number: 1a.3
    text: |-
      Op een gedraging van het College, genoemd in [artikel 1 van de Wet College voor de rechten van de mens][ref1],
      is deze wet slechts van toepassing voor zover het gaat om een gedraging van een ambtenaar die behoort tot het in
      [artikel 18 van die wet][ref2] bedoelde bureau.


      [ref1]: https://wetten.overheid.nl/BWBR0030733#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0030733#Artikel18
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0030733
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0030733
        artikel: '18'
  - number: 1b.1
    text: |-
      Indien de ombudsman een besluit als bedoeld in [artikel 79q, tweede of derde lid, van de Provinciewet][ref1],
      [artikel 81p, tweede of derde lid, van de Gemeentewet][ref2], artikel 107, tweede of derde lid, van de Wet openbare
      lichamen Bonaire, Sint Eustatius en Saba [artikel 51b, tweede of derde lid, van de Waterschapswet][ref3] of
      [artikel 10, vierde lid, van de Wet gemeenschappelijke regelingen][ref4] heeft ontvangen, bevestigt hij onverwijld
      de ontvangst daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel79q
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel81p
      [ref3]: https://wetten.overheid.nl/BWBR0005108#Artikel51b
      [ref4]: https://wetten.overheid.nl/BWBR0003740#Artikel10
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 79q
      - id: ref2
        bwb_id: BWBR0005416
        artikel: 81p
      - id: ref3
        bwb_id: BWBR0005108
        artikel: 51b
      - id: ref4
        bwb_id: BWBR0003740
        artikel: '10'
  - number: 1b.2
    text: |-
      De ombudsman registreert de provincies, gemeenten, openbare lichamen, waterschappen en gemeenschappelijke
      regelingen met een eigen voorziening als bedoeld in [artikel 1a, eerste lid, onder b][ref1]. Hij maakt deze
      registratie openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel1a
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: 1a
        hoofdstuk: I
  - number: 1c.1
    text: |-
      Provincies, gemeenten, openbare lichamen, waterschappen en gemeenschappelijke regelingen als bedoeld in
      [artikel 1a, eerste lid, onder b][ref1], zijn een vergoeding verschuldigd ter dekking van de kosten die zijn
      verbonden aan de behandeling van verzoekschriften ten aanzien van hun bestuursorganen door de ombudsman. Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt de vergoeding vast.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel1a
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel1c
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: 1a
        hoofdstuk: I
  - number: 1c.2
    text: 'Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel1c
  - number: 1c.2.a
    text: de berekening van de te betalen vergoeding;
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel1c
  - number: 1c.2.b
    text: de wijze van betaling van de verschuldigde vergoeding;
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel1c
  - number: 1c.2.c
    text: het tijdstip waarop de verschuldigde vergoeding dient te zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel1c
  - number: 1d
    text: |-
      De [artikelen 1b][ref1] en [1c][ref2] zijn niet van toepassing op de Kinderombudsman, voor zover die als zodanig
      optreedt.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel1b
      [ref2]: https://wetten.overheid.nl/BWBR0003372#Artikel1c
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel1d
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: 1b
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003372
        artikel: 1c
        hoofdstuk: I
  - number: '2.1'
    text: Er is een Nationale ombudsman.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel2
  - number: '2.2'
    text: |-
      De ombudsman wordt benoemd door de Tweede Kamer der Staten-Generaal. Bij de benoeming slaat de Tweede Kamer zodanig
      acht op een aanbeveling, daartoe in gezamenlijk overleg opgemaakt door de vice-president van de Raad van State, de
      president van de Hoge Raad der Nederlanden en de president van de Algemene Rekenkamer en bevattende de namen van
      ten minste drie personen, als zij zal dienstig oordelen.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel2
  - number: '2.3'
    text: De benoeming geschiedt voor de duur van zes jaren.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel2
  - number: '2.4'
    text: |-
      Indien de Tweede Kamer voornemens is de ombudsman opnieuw te benoemen, kan zij bepalen dat het tweede lid, tweede
      volzin, buiten toepassing blijft.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel2
  - number: '2.5'
    text: |-
      Indien blijkt dat de Tweede Kamer niet tijdig tot de benoeming van een nieuwe ombudsman zal kunnen
      komen, voorziet de Tweede Kamer zo spoedig mogelijk in de waarneming van het ambt van ombudsman.
      [Artikel 10, vijfde tot en met zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel10
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '10'
        hoofdstuk: II
  - number: '3.1'
    text: |-
      De Tweede Kamer ontslaat de ombudsman met ingang van de eerstvolgende maand na die waarin hij de zeventigjarige
      leeftijd bereikt.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel3
  - number: '3.2'
    text: 'De Tweede Kamer ontslaat de ombudsman voorts:'
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel3
  - number: 3.2.a
    text: op zijn verzoek;
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel3
  - number: 3.2.b
    text: wanneer hij uit hoofde van ziekten of gebreken blijvend ongeschikt is zijn functie te vervullen;
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel3
  - number: 3.2.c
    text: bij de aanvaarding van een ambt of betrekking bij deze wet onverenigbaar verklaard met het ambt van ombudsman;
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel3
  - number: 3.2.d
    text: bij het verlies van het Nederlanderschap;
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel3
  - number: 3.2.e
    text: |-
      wanneer hij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem bij zulk
      een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel3
  - number: 3.2.f
    text: |-
      wanneer hij ingevolge onherroepelijk geworden rechterlijke uitspraak onder curatele is gesteld, in staat van
      faillissement is verklaard, ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is
      verklaard, hij surseance van betaling heeft verkregen of wegens schulden is gegijzeld;
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel3
  - number: 3.2.g
    text: |-
      wanneer hij naar het oordeel van de Tweede Kamer door handelen of nalaten ernstig nadeel toebrengt aan het in hem
      te stellen vertrouwen.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel3
  - number: '4.1'
    text: 'De Tweede Kamer stelt de ombudsman op non-activiteit ingeval:'
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel4
  - number: 4.1.a
    text: hij zich in voorlopige hechtenis bevindt;
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel4
  - number: 4.1.b
    text: |-
      hij bij een nog niet onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem bij
      zulk een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel4
  - number: 4.1.c
    text: |-
      hij onder curatele is gesteld, in staat van faillissement is verklaard, ten aanzien van hem de
      schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, hij surseance van betaling heeft
      verkregen of wegens schulden is gegijzeld ingevolge een nog niet onherroepelijk geworden rechterlijke uitspraak.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel4
  - number: '4.2'
    text: |-
      De Tweede Kamer kan de ombudsman op non-activiteit stellen, indien hij wordt vervolgd wegens een misdrijf of indien
      er een ander ernstig vermoeden is voor het bestaan van feiten of omstandigheden die tot ontslag, anders dan op
      gronden vermeld in [artikel 3, tweede lid onder b][ref1], zouden kunnen leiden.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel3
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '3'
        hoofdstuk: II
  - number: '4.3'
    text: |-
      In het geval, bedoeld in het tweede lid, eindigt de non-activiteit na drie maanden. De Tweede Kamer kan de
      maatregel echter telkens voor ten hoogste drie maanden verlengen.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel4
  - number: '4.4'
    text: De Tweede Kamer beëindigt de non-activiteit zodra de grond voor de maatregel is vervallen.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel4
  - number: '4.5'
    text: |-
      De Tweede Kamer kan bij de beslissing waarbij de ombudsman op non-activiteit wordt gesteld, bepalen dat tijdens de
      duur van de non-activiteit geen salaris of slechts een gedeelte van het salaris zal worden genoten, in het laatste
      geval onder aanwijzing van het gedeelte dat zal worden genoten.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel4
  - number: '4.6'
    text: |-
      Indien de non-activiteit anders dan door ontslag is geëindigd, kan de Tweede Kamer beslissen, dat het niet genoten
      salaris alsnog geheel of gedeeltelijk zal worden uitbetaald, in het laatste geval onder aanwijzing van het gedeelte
      dat zal worden uitbetaald.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel4
  - number: '5.1'
    text: 'De ombudsman kan niet bekleden:'
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel5
  - number: 5.1.a
    text: |-
      het lidmaatschap van publiekrechtelijke colleges waarvoor de keuze geschiedt bij krachtens wettelijk voorschrift
      uitgeschreven verkiezingen;
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel5
  - number: 5.1.b
    text: een openbare betrekking waaraan een vaste beloning of toelage is verbonden;
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel5
  - number: 5.1.c
    text: het lidmaatschap van vaste colleges van advies en bijstand aan de Regering;
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel5
  - number: 5.1.d
    text: het beroep of ambt van advocaat of notaris.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel5
  - number: '5.2'
    text: |-
      De ombudsman vervult geen betrekkingen waarvan de uitoefening ongewenst is met het oog op een goede vervulling van
      zijn ambt of op de handhaving van zijn onpartijdigheid en onafhankelijkheid of van het vertrouwen daarin.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel5
  - number: '5.3'
    text: De betrekkingen die de ombudsman buiten zijn ambt vervult, worden door hem openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel5
  - number: '6'
    text: |-
      De bepalingen van de [Algemene pensioenwet politieke ambtsdragers][ref1] zijn van overeenkomstige toepassing op de
      ombudsman, met dien verstande dat deze wordt gelijkgesteld met een lid van de Tweede Kamer der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0002691
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002691
  - number: '8'
    text: 'Alvorens zijn ambt te aanvaarden legt de ombudsman in de handen van de Voorzitter der Tweede Kamer af:'
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel8
  - number: 8.a
    text: |-
      de eed of verklaring en belofte dat hij tot het verkrijgen van zijn benoeming rechtstreeks noch middellijk, onder
      welke naam of onder welk voorwendsel ook, aan iemand iets heeft gegeven of beloofd, alsmede dat hij om iets in zijn
      ambt te doen of te laten rechtstreeks noch middellijk van iemand enig geschenk of enige belofte heeft aangenomen of
      zal aannemen;
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel8
  - number: 8.b
    text: |-
      de eed of belofte van trouw aan de [Grondwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '9.1'
    text: |-
      De Tweede Kamer benoemt op verzoek van de ombudsman een of meer personen tot substituut-ombudsman en wijst daarbij
      de substituut-ombudsman aan die de functie van Kinderombudsman heeft. De ombudsman maakt daartoe een aanbeveling
      op, die de namen van ten minste drie personen bevat. Indien er geen Kinderombudsman is, draagt de ombudsman zo
      spoedig mogelijk zorg voor een verzoek als bedoeld in de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel9
  - number: '9.2'
    text: |-
      De benoeming van een substituut-ombudsman geschiedt voor de duur van de ambtstermijn van de ombudsman op wiens
      verzoek hij is benoemd, vermeerderd met een jaar.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel9
  - number: '9.3'
    text: |-
      Indien de Tweede Kamer voornemens is een substituut-ombudsman opnieuw te benoemen, kan zij bepalen dat het eerste
      lid, tweede volzin, buiten toepassing blijft.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel9
  - number: '9.4'
    text: |-
      De[ artikelen 3 tot en met 8][ref1], [15][ref2], en de [artikelen 9:21][ref3] en
      [9:30 tot en met 9:34 van de Algemene wet bestuursrecht][ref4], zijn van overeenkomstig toepassing op een
      substituut-ombudsman.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003372#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003372
        artikel: '15'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '9'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '9'
  - number: '9.5'
    text: De ombudsman regelt de werkzaamheden van een substituut-ombudsman.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel9
  - number: '9.6'
    text: |-
      De ombudsman kan bepalen dat de bevoegdheden, bedoeld in de [artikelen 16, derde lid][ref1], en de
      [artikelen 9:27][ref2], [9:35][ref3] en [9:36 van de Algemene wet bestuursrecht][ref4], tevens worden uitgeoefend
      door een substituut-ombudsman. De ombudsman kan voor de uitoefening van die bevoegdheden richtlijnen vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '16'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '9'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '9'
  - number: '10.1'
    text: |-
      De ombudsman regelt zijn vervanging door een substituut-ombudsman, voor het geval dat hij tijdelijk niet in staat
      is zijn ambt te vervullen. De ombudsman regelt tevens de vervanging van de Kinderombudsman door een substituut-
      ombudsman, voor het geval dat die tijdelijk niet in staat is zijn ambt te vervullen.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel10
  - number: '10.2'
    text: |-
      Indien geen substituut-ombudsman aanwezig of beschikbaar is, voorziet de Tweede Kamer zo spoedig mogelijk in
      de vervanging van de ombudsman of Kinderombudsman. In dat geval eindigt de vervanging wanneer de ombudsman
      of Kinderombudsman weer in staat is zijn ambt te vervullen of, indien de ombudsman of Kinderombudsman op non-
      activiteit is gesteld, op het tijdstip dat de non-activiteit eindigt.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel10
  - number: '10.3'
    text: |-
      Indien de ombudsman of Kinderombudsman overlijdt of ingevolge [artikel 3][ref1] wordt ontslagen, voorziet de Tweede
      Kamer zo spoedig mogelijk in de waarneming van het ambt van ombudsman of Kinderombudsman door een substituut-
      ombudsman.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel3
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '3'
        hoofdstuk: II
  - number: '10.4'
    text: |-
      Indien geen substituut-ombudsman aanwezig of beschikbaar is, voorziet de Tweede Kamer zo spoedig mogelijk in de
      waarneming van het ambt van ombudsman of Kinderombudsman.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel10
  - number: '10.5'
    text: |-
      De waarneming eindigt van rechtswege op het tijdstip waarop een nieuwe ombudsman of Kinderombudsman in functie
      is getreden.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel10
  - number: '10.6'
    text: |-
      Op degene die krachtens het tweede of het vierde lid de ombudsman of Kinderombudsman vervangt of het ambt van
      ombudsman of Kinderombudsman waarneemt, zijn de[ artikelen 2, tweede lid, tweede volzin, derde en vierde lid][ref1],
      [3, eerste lid][ref2], [6][ref3] en [9][ref4] van deze wet niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003372#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003372#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0003372#Artikel9
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003372
        artikel: '3'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003372
        artikel: '6'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0003372
        artikel: '9'
        hoofdstuk: II
  - number: '10.7'
    text: |-
      Indien de in het zesde lid bedoelde vervanger respectievelijk waarnemer een betrekking of lidmaatschap als
      bedoeld in [artikel 5, eerste lid, onderdelen b en c][ref1], bekleedt of gaat bekleden, is hij voor de duur van
      de vervanging respectievelijk de waarneming in die betrekking of dat lidmaatschap van rechtswege op non-activiteit
      gesteld. De bezoldiging voor die betrekking of dat lidmaatschap met inbegrip van eventuele toelagen blijft
      gedurende de periode van non-activiteit achterwege.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel5
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '5'
        hoofdstuk: II
  - number: '11.1'
    text: Te zijner ondersteuning beschikt de ombudsman over een bureau.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel11
  - number: '11.2'
    text: |-
      De tot het bureau behorende personen worden door Ons op voordracht van de ombudsman benoemd, bevorderd, geschorst
      en ontslagen.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel11
  - number: '11.3'
    text: |-
      Wij bepalen in welke gevallen tot het bureau behorende personen door de ombudsman worden benoemd, bevorderd,
      geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel11
  - number: 11a
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel11a
  - number: 11a.a
    text: 'jeugdige: een persoon die de meerderjarigheidsleeftijd nog niet heeft bereikt;'
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel11a
  - number: 11a.b
    text: |-
      kinderrechtenverdrag: het op 20 november 1989 te New York tot stand gekomen Verdrag inzake de rechten van het kind
      (Trb. 1990, 46);
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel11a
  - number: 11a.c
    text: 'rechten van jeugdigen: de rechten van jeugdigen, opgenomen in het kinderrechtenverdrag.'
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel11a
  - number: 11b.1
    text: |-
      De Kinderombudsman heeft tot taak te bevorderen dat de rechten van jeugdigen worden geëerbiedigd door
      bestuursorganen en door privaatrechtelijke organisaties.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel11b
  - number: 11b.2
    text: 'Hij doet dit in elk geval door:'
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel11b
  - number: 11b.2.a
    text: voor te lichten en informatie te geven over de rechten van jeugdigen;
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel11b
  - number: 11b.2.b
    text: |-
      gevraagd en ongevraagd advies te geven aan de regering en de beide Kamers der Staten-Generaal over wetgeving die en
      beleid dat de rechten van jeugdigen raakt;
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel11b
  - number: 11b.2.c
    text: |-
      het instellen van onderzoek naar de eerbiediging van de rechten van jeugdigen naar aanleiding van klachten of uit
      eigen beweging;
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel11b
  - number: 11b.2.d
    text: |-
      het toezicht houden op de wijze waarop klachten van jeugdigen of hun wettelijke vertegenwoordigers door de daartoe
      bevoegde instanties, niet zijnde de ombudsman, worden behandeld.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel11b
  - number: 11b.3
    text: |-
      Bij de uitvoering van zijn taken, houdt de Kinderombudsman zo veel mogelijk rekening met de mening van
      jeugdigen zelf overeenkomstig artikel 12 van het kinderrechtenverdrag, met de belangen van jeugdigen en met hun
      belevingswereld.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel11b
  - number: 11c.1
    text: 'Een ieder die meent dat een of meer rechten van jeugdigen niet geëerbiedigd worden door:'
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel11c
  - number: 11c.1.a
    text: |-
      een bestuursorgaan als bedoeld in [artikel 1a][ref1], met dien verstande dat, in afwijking van artikel 1a, eerste
      lid, onder b, daaronder mede worden begrepen bestuursorganen met een eigen voorziening voor de behandeling van
      verzoekschriften als bedoeld in artikel 1a, eerste lid, onder b;


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel1a
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel11c
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: 1a
        hoofdstuk: I
  - number: 11c.1.b
    text: 'een orgaan van een rechtspersoon, niet zijnde een bestuursorgaan, voor zover die:'
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel11c
  - number: 11c.1.b.1
    text: een bij of krachtens de wet geregelde taak ten aanzien van jeugdigen uitoefent; of
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel11c
  - number: 11c.1.b.2
    text: |-
      anderszins een taak ten aanzien van jeugdigen uitoefent op het terrein van het onderwijs, de jeugdzorg, de
      kinderopvang of de gezondheidszorg,
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel11c
  - number: 11c.2
    text: |-
      Een klacht over een bestuursorgaan als bedoeld in [artikel 1a][ref1], geldt als een verzoek als bedoeld in
      [artikel 9:18, eerste lid, van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel11c
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: 1a
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '9'
  - number: 11c.3
    text: |-
      Een gedraging van een medewerker van een rechtspersoon als bedoeld in het eerste lid, onder b, verricht in de
      uitoefening van zijn functie, wordt aangemerkt als een gedraging van die rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel11c
  - number: 11d.1
    text: |-
      Op de behandeling van klachten over en onderzoek uit eigen beweging naar bestuursorganen met een eigen voorziening
      voor de behandeling van verzoekschriften als bedoeld in [artikel 1a, eerste lid, onder b][ref1], en organen
      van rechtspersonen als bedoeld in [artikel 11c, eerste lid, onder b][ref2], door de Kinderombudsman zijn
      [artikel 15][ref3] alsmede [titel 9.2 van de Algemene wet bestuursrecht][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0003372#Artikel11c
      [ref3]: https://wetten.overheid.nl/BWBR0003372#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel11d
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: 1a
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003372
        artikel: 11c
        hoofdstuk: IIa
      - id: ref3
        bwb_id: BWBR0003372
        artikel: '15'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0005537
  - number: 11d.2
    text: |-
      In afwijking van [artikel 9:18, eerste lid, van de Algemene wet bestuursrecht][ref1], kan een klacht als
      bedoeld in [artikel 11c, eerste lid][ref2], mondeling worden ingediend. De [artikelen 9:23 onder a][ref3] en
      [9:28 van de Algemene wet bestuursrecht][ref4] zijn in dat geval niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003372#Artikel11c
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel11d
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0003372
        artikel: 11c
        hoofdstuk: IIa
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '9'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '9'
  - number: 11d.3
    text: |-
      In afwijking van [artikel 9:18, derde lid, van de Algemene wet bestuursrecht][ref1] is de
      Kinderombudsman niet verplicht een onderzoek in te stellen, indien de klacht een orgaan als bedoeld in
      [artikel 11c, eerste lid, onder b][ref2], betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003372#Artikel11c
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel11d
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0003372
        artikel: 11c
        hoofdstuk: IIa
  - number: 11d.4
    text: |-
      De in [artikel 9:33 van de Algemene wet bestuursrecht][ref1] bedoelde vergoeding van kosten vindt plaats ten
      laste van het Rijk indien het onderzoek betrekking heeft op een orgaan van een rechtspersoon als bedoeld in
      [artikel 11c, eerste lid, onder b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003372#Artikel11c
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel11d
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0003372
        artikel: 11c
        hoofdstuk: IIa
  - number: 11e.1
    text: |-
      De Kinderombudsman zendt jaarlijks een verslag van zijn werkzaamheden aan de beide Kamers der Staten-Generaal
      en aan Onze Ministers, alsmede aan andere bestuursorganen en privaatrechtelijke organisaties voor zover hij dat
      wenselijk acht. [Artikel 10 van de Wet openbaarheid van bestuur][ref1] is van overeenkomstige toepassing met dien
      verstande dat de Kinderombudsman bij het verslag gegevens kan voegen, slechts ter vertrouwelijke kennisneming door
      de leden van de Staten-Generaal en Onze Ministers.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel11e
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: 11e.2
    text: |-
      De Kinderombudsman draagt er zorg voor dat het verslag openbaar wordt gemaakt en algemeen verkrijgbaar wordt
      gesteld.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel11e
  - number: 11e.3
    text: |-
      De Kinderombudsman kan ook dadelijk na het afsluiten van een onderzoek de beide Kamers der Staten-Generaal en
      vertegenwoordigende organen van provincies en gemeenten inlichten omtrent zijn bevindingen, zo dikwijls hij de
      eerdere kennisneming daarvan voor het betreffende orgaan van belang acht of een orgaan als hiervoor bedoeld dit
      verzoekt.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel11e
  - number: '12'
    text: |-
      De ombudsman is niet verplicht een onderzoek als bedoeld in
      [artikel 9:18, eerste lid, van de Algemene wet bestuursrecht][ref1], in te stellen of voort te zetten indien een
      verzoekschrift, dezelfde gedraging betreffende, in behandeling is bij een tot de behandeling van verzoekschriften
      bevoegde commissie uit de Eerste of Tweede Kamer of uit de verenigde vergadering der Staten-Generaal of –
      behoudens indien een nieuw feit of een nieuwe omstandigheid bekend is geworden en zulks tot een ander oordeel
      over de bedoelde gedraging zou hebben kunnen leiden – daarover door de betrokken commissie haar conclusie op een
      verzoekschrift aan de Eerste of Tweede Kamer dan wel de verenigde vergadering der Staten-Generaal is voorgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '9'
  - number: '13'
    text: |-
      [Artikel 9:31, eerste lid, derde volzin, van de Algemene wet bestuursrecht][ref1] is niet van toepassing op Onze
      Ministers.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '9'
  - number: '14'
    text: |-
      Onze Ministers kunnen aan de ombudsman het betreden van bepaalde plaatsen verbieden, indien dit naar hun oordeel de
      veiligheid van de staat zou schaden.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel14
  - number: '15'
    text: |-
      De ombudsman kan bevelen dat personen die, hoewel wettelijk opgeroepen, niet zijn verschenen, door de openbare
      macht voor hem worden gebracht om aan hun verplichtingen te voldoen.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel15
  - number: '16.1'
    text: |-
      De ombudsman zendt jaarlijks een verslag van zijn werkzaamheden aan de beide Kamers der Staten-Generaal
      en aan Onze Ministers, alsmede aan de vertegenwoordigende organen van provincies, gemeenten openbare
      lichamen en waterschappen en aan de algemene besturen van gemeenschappelijke regelingen als bedoeld
      in [artikel 1a, eerste lid, onder b][ref1], voorzover de ombudsman ten aanzien van hun bestuursorganen
      verzoekschriften heeft behandeld. [Artikel 10 van de Wet openbaarheid van bestuur][ref2] is van overeenkomstige
      toepassing met dien verstande dat de ombudsman bij het verslag gegevens kan voegen, slechts ter vertrouwelijke
      kennisneming door de leden van de Staten-Generaal en Onze Ministers.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: 1a
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '16.2'
    text: De ombudsman draagt er zorg voor dat het verslag openbaar wordt gemaakt en algemeen verkrijgbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel16
  - number: '16.3'
    text: |-
      De ombudsman kan ook dadelijk na het afsluiten van een onderzoek de beide Kamers der Staten-Generaal,
      vertegenwoordigende organen van provincies, gemeenten openbare lichamen en waterschappen en algemene besturen
      van gemeenschappelijke regelingen inlichten omtrent zijn bevindingen en oordeel, zo dikwijls hij de eerdere
      kennisneming daarvan voor het betreffende orgaan van belang acht of een orgaan als hiervoor bedoeld dit verzoekt.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel16
  - number: '17'
    text: |-
      De voordrachten voor ter uitvoering van deze wet te nemen koninklijke besluiten worden gedaan door Onze Minister
      van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel17
  - number: '18'
    text: |-
      Indien provincies, gemeenten, openbare lichamen, waterschappen of gemeenschappelijke regelingen
      een eigen voorziening voor de behandeling van verzoekschriften hebben ingesteld als bedoeld in
      [artikel 1a, eerste lid, onder b][ref1], blijft de ombudsman bevoegd verzoekschriften ten aanzien van hun
      bestuursorganen te behandelen die voor de ingangsdatum van de eigen voorziening door hem zijn ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel1a
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: 1a
        hoofdstuk: I
  - number: '19'
    text: |-
      Tot een jaar na inwerkingtreding van een besluit als bedoeld in [artikel 1a, eerste lid, onder e][ref1], kan
      met betrekking tot een gedraging van het desbetreffende bestuursorgaan die heeft plaatsgevonden voordat het
      desbetreffende bestuursorgaan is uitgezonderd, een verzoekschrift bij de ombudsman worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel1a
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: 1a
        hoofdstuk: I
  - number: 19a.1
    text: |-
      In afwijking van [artikel 1a][ref1], is deze wet tot twee jaar na de inwerkingtreding van de Wet openbare lichamen
      Bonaire, Sint Eustatius en Saba alleen van toepassing op de gedragingen van de bestuursorganen van de openbare
      lichamen, voor zover de ombudsman hiertoe op een gezamenlijk verzoek van de eilandsraden van de openbare lichaam
      heeft besloten. De ombudsman kan daarbij een termijn bepalen waarop deze wet ten aanzien van de gedragingen van de
      bestuursorganen van de openbare lichamen van toepassing zal zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel1a
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: 1a
        hoofdstuk: I
  - number: 19a.2
    text: |-
      Een besluit als bedoeld in het eerste lid wordt bekend gemaakt in de Staatscourant en in de afkondigingsbladen van
      de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel19a
  - number: '20'
    text: 'Deze wet wordt aangehaald als: Wet Nationale ombudsman.'
    url: https://wetten.overheid.nl/BWBR0003372/2013-01-01#Artikel20
