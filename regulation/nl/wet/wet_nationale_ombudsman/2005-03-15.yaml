---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_nationale_ombudsman
regulatory_layer: WET
publication_date: '2022-01-18'
valid_from: '2005-03-15'
bwb_id: BWBR0003372
url: https://wetten.overheid.nl/BWBR0003372/2005-03-15
articles:
  - number: '1'
    text: 'Deze wet verstaat onder:'
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel1
  - number: 1.a
    text: |-
      ombudsman: de Nationale ombudsman, bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel2
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '2'
        hoofdstuk: II
  - number: 1.b
    text: |-
      ambtenaar: een ambtenaar, een gewezen ambtenaar, een persoon met wie door een bestuursorgaan een
      arbeidsovereenkomst is gesloten naar burgerlijk recht, ook na beëindiging van de arbeidsovereenkomst, een
      dienstplichtig militair, ook na het einde van de dienstplicht, alsmede andere personen werkzaam onder de
      verantwoordelijkheid van het bestuursorgaan, ook na het beëindigen van de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel1
  - number: 1a.1
    text: 'Deze wet is van toepassing op de gedragingen van de volgende bestuursorganen:'
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel1a
  - number: 1a.1.a
    text: Onze Ministers;
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel1a
  - number: 1a.1.b
    text: |-
      bestuursorganen van provincies, gemeenten, waterschappen en gemeenschappelijke regelingen, die overeenkomstig
      [artikel 1b][ref1] zijn aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel1b
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: 1b
        hoofdstuk: I
  - number: 1a.1.c
    text: |-
      bestuursorganen aan welke bij of krachtens wettelijk voorschrift een taak met betrekking tot de politie is
      opgedragen, voor zover het de uitoefening van die taak betreft;
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel1a
  - number: 1a.1.d
    text: |-
      bestuursorganen van provincies, gemeenten, waterschappen en gemeenschappelijke regelingen voor zover het de
      gedragingen van voor hen werkzame buitengewoon opsporingsambtenaren betreft;
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel1a
  - number: 1a.1.e
    text: andere bestuursorganen, voor zover niet bij algemene maatregel van bestuur uitgezonderd.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel1a
  - number: 1a.3
    text: |-
      In afwijking van het eerste lid is deze wet niet van toepassing op gedragingen van de Commissie gelijke
      behandeling, bedoeld in de [Algemene wet gelijke behandeling][ref1] .


      [ref1]: https://wetten.overheid.nl/BWBR0006502
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0006502
  - number: 1a.4
    text: |-
      Een gedraging van een ambtenaar, verricht in de uitoefening van zijn functie, wordt aangemerkt als een gedraging
      van het bestuursorgaan onder wiens verantwoordelijkheid hij werkzaam is.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel1a
  - number: 1b.1
    text: |-
      Bij ministerieel besluit worden de bestuursorganen van provincies, gemeenten, waterschappen en gemeenschappelijke
      regelingen aangewezen, waarop deze wet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel1b
  - number: 1b.2
    text: |-
      Een aanwijzing als bedoeld in het eerste lid geschiedt door Onze Minister van Binnenlandse Zaken op verzoek van het
      bestuur van de desbetreffende provincie, gemeente, gemeenschappelijke regeling of het desbetreffende waterschap.
      Op verzoek van of namens de provincies onderscheidenlijk de waterschappen geschiedt de aanwijzing van de provincies
      onderscheidenlijk de waterschappen gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel1b
  - number: 1b.3
    text: |-
      Het verzoek om aanwijzing wordt voor 1 juli van het jaar voorafgaand aan het jaar waarin de aanwijzing in moet gaan
      bij Onze Minister van Binnenlandse Zaken ingediend. Onze Minister van Binnenlandse Zaken bevestigt onverwijld de
      ontvangst van het verzoek.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel1b
  - number: 1b.4
    text: |-
      De aanwijzing van de daarvoor in aanmerking komende bestuursorganen geschiedt telkens met ingang van 1 januari van
      het desbetreffende jaar. Onze Minister van Binnenlandse Zaken kan in afwijking van de eerste volzin de aanwijzing
      van bestuursorganen op een ander tijdstip doen ingaan, indien omstandigheden van dringende aard daartoe nopen. Het
      aanwijzingsbesluit wordt in de Staatscourant bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel1b
  - number: 1b.5
    text: |-
      De aanwijzing geschiedt voor een periode van vier jaar. Deze periode wordt telkens met twee jaar verlengd, tenzij
      het bestuur van de desbetreffende provincie, gemeente, gemeenschappelijke regeling of het desbetreffende waterschap
      voor 1 januari van het jaar voorafgaand aan het jaar waarin de verlenging plaats zal vinden aan Onze Minister
      van Binnenlandse Zaken heeft verzocht de aanwijzing te beëindigen. Onze Minister van Binnenlandse Zaken bevestigt
      onverwijld de ontvangst van het verzoek. Van de beëindiging van de aanwijzing wordt door Onze Minister van
      Binnenlandse Zaken mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel1b
  - number: 1c.1
    text: |-
      De rechtspersoon waartoe het ingevolge [artikel 1b][ref1] aangewezen bestuursorgaan behoort, is een door Onze
      Minister van Binnenlandse Zaken vast te stellen vergoeding verschuldigd ter dekking van de kosten die zijn
      verbonden aan het beschikbaarstellen van de klachtvoorziening bij de Nationale ombudsman aan het desbetreffende
      bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel1b
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel1c
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: 1b
        hoofdstuk: I
  - number: 1c.2
    text: 'Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel1c
  - number: 1c.2.a
    text: de berekening van de te betalen vergoeding;
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel1c
  - number: 1c.2.b
    text: de wijze van betaling van de verschuldigde vergoeding;
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel1c
  - number: 1c.2.c
    text: het tijdstip waarop de verschuldigde vergoeding dient te zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel1c
  - number: '2.1'
    text: Er is een Nationale ombudsman.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel2
  - number: '2.2'
    text: |-
      De ombudsman wordt benoemd door de Tweede Kamer der Staten-Generaal. Bij de benoeming slaat de Tweede Kamer zodanig
      acht op een aanbeveling, daartoe in gezamenlijk overleg opgemaakt door de vice-president van de Raad van State, de
      president van de Hoge Raad der Nederlanden en de president van de Algemene Rekenkamer en bevattende de namen van
      ten minste drie personen, als zij zal dienstig oordelen.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel2
  - number: '2.3'
    text: De benoeming geschiedt voor de duur van zes jaren.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel2
  - number: '2.4'
    text: |-
      Indien de Tweede Kamer voornemens is de ombudsman opnieuw te benoemen, kan zij bepalen dat het tweede lid, tweede
      volzin, buiten toepassing blijft.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel2
  - number: '2.5'
    text: |-
      Indien blijkt dat de Tweede Kamer niet tijdig tot de benoeming van een nieuwe ombudsman zal kunnen
      komen, voorziet de Tweede Kamer zo spoedig mogelijk in de waarneming van het ambt van ombudsman.
      [Artikel 10, vijfde tot en met zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel10
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '10'
        hoofdstuk: II
  - number: '3.1'
    text: |-
      De Tweede Kamer ontslaat de ombudsman met ingang van de eerstvolgende maand na die waarin hij de vijfenzestigjarige
      leeftijd bereikt.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel3
  - number: '3.2'
    text: 'De Tweede Kamer ontslaat de ombudsman voorts:'
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel3
  - number: 3.2.a
    text: op zijn verzoek;
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel3
  - number: 3.2.b
    text: wanneer hij uit hoofde van ziekten of gebreken blijvend ongeschikt is zijn functie te vervullen;
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel3
  - number: 3.2.c
    text: bij de aanvaarding van een ambt of betrekking bij deze wet onverenigbaar verklaard met het ambt van ombudsman;
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel3
  - number: 3.2.d
    text: bij het verlies van het Nederlanderschap;
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel3
  - number: 3.2.e
    text: |-
      wanneer hij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem bij zulk
      een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel3
  - number: 3.2.f
    text: |-
      wanneer hij ingevolge onherroepelijk geworden rechterlijke uitspraak onder curatele is gesteld, in staat van
      faillissement is verklaard, ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is
      verklaard, hij surseance van betaling heeft verkregen of wegens schulden is gegijzeld;
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel3
  - number: 3.2.g
    text: |-
      wanneer hij naar het oordeel van de Tweede Kamer door handelen of nalaten ernstig nadeel toebrengt aan het in hem
      te stellen vertrouwen.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel3
  - number: '4.1'
    text: 'De Tweede Kamer stelt de ombudsman op non-activiteit ingeval:'
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel4
  - number: 4.1.a
    text: hij zich in voorlopige hechtenis bevindt;
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel4
  - number: 4.1.b
    text: |-
      hij bij een nog niet onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem bij
      zulk een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel4
  - number: 4.1.c
    text: |-
      hij onder curatele is gesteld, in staat van faillissement is verklaard, ten aanzien van hem de
      schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, hij surseance van betaling heeft
      verkregen of wegens schulden is gegijzeld ingevolge een nog niet onherroepelijk geworden rechterlijke uitspraak.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel4
  - number: '4.2'
    text: |-
      De Tweede Kamer kan de ombudsman op non-activiteit stellen, indien tegen hem een gerechtelijk vooronderzoek ter
      zake van misdrijf wordt ingesteld of indien er een ander ernstig vermoeden is voor het bestaan van feiten of
      omstandigheden die tot ontslag, anders dan op gronden vermeld in [artikel 3, tweede lid onder ][ref1] zouden kunnen
      leiden.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel3
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '3'
        hoofdstuk: II
  - number: '4.3'
    text: |-
      In het geval, bedoeld in het tweede lid, eindigt de non-activiteit na drie maanden. De Tweede Kamer kan de
      maatregel echter telkens voor ten hoogste drie maanden verlengen.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel4
  - number: '4.4'
    text: De Tweede Kamer beëindigt de non-activiteit zodra de grond voor de maatregel is vervallen.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel4
  - number: '4.5'
    text: |-
      De Tweede Kamer kan bij de beslissing waarbij de ombudsman op non-activiteit wordt gesteld, bepalen dat tijdens de
      duur van de non-activiteit geen salaris of slechts een gedeelte van het salaris zal worden genoten, in het laatste
      geval onder aanwijzing van het gedeelte dat zal worden genoten.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel4
  - number: '4.6'
    text: |-
      Indien de non-activiteit anders dan door ontslag is geëindigd, kan de Tweede Kamer beslissen, dat het niet genoten
      salaris alsnog geheel of gedeeltelijk zal worden uitbetaald, in het laatste geval onder aanwijzing van het gedeelte
      dat zal worden uitbetaald.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel4
  - number: '5.1'
    text: 'De ombudsman kan niet bekleden:'
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel5
  - number: 5.1.a
    text: |-
      het lidmaatschap van publiekrechtelijke colleges waarvoor de keuze geschiedt bij krachtens wettelijk voorschrift
      uitgeschreven verkiezingen;
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel5
  - number: 5.1.b
    text: een openbare betrekking waaraan een vaste beloning of toelage is verbonden;
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel5
  - number: 5.1.c
    text: het lidmaatschap van vaste colleges van advies en bijstand aan de Regering;
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel5
  - number: 5.1.d
    text: het beroep of ambt van advocaat, procureur of notaris.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel5
  - number: '5.2'
    text: |-
      De ombudsman vervult geen betrekkingen waarvan de uitoefening ongewenst is met het oog op een goede vervulling van
      zijn ambt of op de handhaving van zijn onpartijdigheid en onafhankelijkheid of van het vertrouwen daarin.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel5
  - number: '5.3'
    text: De betrekkingen die de ombudsman buiten zijn ambt vervult, worden door hem openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel5
  - number: '6'
    text: |-
      De bepalingen van de [Algemene pensioenwet politieke ambtsdragers][ref1] zijn van overeenkomstige toepassing op de
      ombudsman, met dien verstande dat deze wordt gelijkgesteld met een lid van de Tweede Kamer der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0002691
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002691
  - number: '7'
    text: |-
      Wij regelen bij algemene maatregel van bestuur de aanspraken in geval van ziekte, alsmede de overige rechten en
      verplichtingen van de ombudsman die deel uitmaken van zijn rechtspositie, voor zover niet bij de wet geregeld.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel7
  - number: '8'
    text: 'Alvorens zijn ambt te aanvaarden legt de ombudsman in de handen van de Voorzitter der Tweede Kamer af:'
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel8
  - number: 8.a
    text: |-
      de eed of verklaring en belofte dat hij tot het verkrijgen van zijn benoeming rechtstreeks noch middellijk, onder
      welke naam of onder welk voorwendsel ook, aan iemand iets heeft gegeven of beloofd, alsmede dat hij om iets in zijn
      ambt te doen of te laten rechtstreeks noch middellijk van iemand enig geschenk of enige belofte heeft aangenomen of
      zal aannemen;
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel8
  - number: 8.b
    text: |-
      de eed of belofte van trouw aan de [Grondwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '9.1'
    text: |-
      De Tweede Kamer benoemt op verzoek van de ombudsman zo nodig een of meer personen tot substituut-ombudsman. De
      ombudsman maakt daartoe een aanbeveling op, die de namen van ten minste drie personen bevat.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel9
  - number: '9.2'
    text: |-
      De benoeming van een substituut-ombudsman geschiedt voor de duur van de ambtstermijn van de ombudsman op wiens
      verzoek hij is benoemd, vermeerderd met een jaar.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel9
  - number: '9.3'
    text: |-
      Indien de Tweede Kamer voornemens is een substituut-ombudsman opnieuw te benoemen, kan zij bepalen dat het eerste
      lid, tweede volzin, buiten toepassing blijft.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel9
  - number: '9.4'
    text: |-
      De[ artikelen 3 tot en met 8][ref1], [15][ref2], en de [artikelen 9:21][ref3] en
      [9:30 tot en met 9:34 van de Algemene wet bestuursrecht][ref4], zijn van overeenkomstig toepassing op een
      substituut-ombudsman.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003372#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003372
        artikel: '15'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '9'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '9'
  - number: '9.5'
    text: De ombudsman regelt de werkzaamheden van een substituut-ombudsman.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel9
  - number: '9.6'
    text: |-
      De ombudsman kan bepalen dat de bevoegdheden, bedoeld in de [artikelen 16, derde lid][ref1], en de
      [artikelen 9:27][ref2], [9:35][ref3] en [9:36 van de Algemene wet bestuursrecht][ref4], tevens worden uitgeoefend
      door een substituut-ombudsman. De ombudsman kan voor de uitoefening van die bevoegdheden richtlijnen vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '16'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '9'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '9'
  - number: '10.1'
    text: |-
      De ombudsman regelt zijn vervanging door een substituut-ombudsman, voor het geval dat hij tijdelijk niet in staat
      is zijn ambt te vervullen.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel10
  - number: '10.2'
    text: |-
      Indien geen substituut-ombudsman aanwezig of beschikbaar is, voorziet de Tweede Kamer zo spoedig mogelijk in de
      vervanging van de ombudsman. In dat geval eindigt de vervanging wanneer de ombudsman weer in staat is zijn ambt te
      vervullen of, indien de ombudsman op non-activiteit is gesteld, op het tijdstip dat de non-activiteit eindigt.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel10
  - number: '10.3'
    text: |-
      Indien de ombudsman overlijdt of ingevolge [artikel 3][ref1] wordt ontslagen, voorziet de Tweede Kamer zo spoedig
      mogelijk in de waarneming van het ambt van ombudsman door een substituut-ombudsman.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel3
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '3'
        hoofdstuk: II
  - number: '10.4'
    text: |-
      Indien geen substituut-ombudsman aanwezig of beschikbaar is, voorziet de Tweede Kamer zo spoedig mogelijk in de
      waarneming van het ambt van ombudsman.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel10
  - number: '10.5'
    text: De waarneming eindigt van rechtswege op het tijdstip waarop een nieuwe ombudsman in functie is getreden.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel10
  - number: '10.6'
    text: |-
      Op degene die krachtens het tweede of het vierde lid de ombudsman vervangt of het ambt van ombudsman waarneemt,
      zijn de[ artikelen 2, tweede lid, tweede volzin, derde en vierde lid][ref1], [3, eerste lid][ref2], [6][ref3] en
      [9][ref4] van deze wet niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003372#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003372#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0003372#Artikel9
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003372
        artikel: '3'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003372
        artikel: '6'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0003372
        artikel: '9'
        hoofdstuk: II
  - number: '10.7'
    text: |-
      Indien de in het zesde lid bedoelde vervanger respectievelijk waarnemer een betrekking of lidmaatschap als bedoeld
      in [artikel 5, eerste lid, onderdelen ][ref1], bekleedt of gaat bekleden, is hij voor de duur van de vervanging
      respectievelijk de waarneming in die betrekking of dat lidmaatschap van rechtswege op non-activiteit gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel5
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '5'
        hoofdstuk: II
  - number: '11.1'
    text: Te zijner ondersteuning beschikt de ombudsman over een bureau.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel11
  - number: '11.2'
    text: |-
      De tot het bureau behorende personen worden door Ons op voordracht van de ombudsman benoemd, bevorderd, geschorst
      en ontslagen.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel11
  - number: '11.3'
    text: |-
      Wij bepalen in welke gevallen tot het bureau behorende personen door de ombudsman worden benoemd, bevorderd,
      geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel11
  - number: '12'
    text: |-
      De ombudsman is niet verplicht een onderzoek als bedoeld in
      [artikel 9:18, eerste lid, van de Algemene wet bestuursrecht][ref1], in te stellen of voort te zetten indien een
      verzoekschrift, dezelfde gedraging betreffende, in behandeling is bij een tot de behandeling van verzoekschriften
      bevoegde commissie uit de Eerste of Tweede Kamer of uit de verenigde vergadering der Staten-Generaal of –
      behoudens indien een nieuw feit of een nieuwe omstandigheid bekend is geworden en zulks tot een ander oordeel
      over de bedoelde gedraging zou hebben kunnen leiden – daarover door de betrokken commissie haar conclusie op een
      verzoekschrift aan de Eerste of Tweede Kamer dan wel de verenigde vergadering der Staten-Generaal is voorgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '9'
  - number: '13'
    text: |-
      [Artikel 9:31, eerste lid, derde volzin, van de Algemene wet bestuursrecht][ref1] is niet van toepassing op Onze
      Ministers.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '9'
  - number: '14'
    text: |-
      Onze Ministers kunnen aan de ombudsman het betreden van bepaalde plaatsen verbieden, indien dit naar hun oordeel de
      veiligheid van de staat zou schaden.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel14
  - number: '15'
    text: |-
      De ombudsman kan bevelen dat personen die, hoewel wettelijk opgeroepen, niet zijn verschenen, door de openbare
      macht voor hem worden gebracht om aan hun verplichtingen te voldoen.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel15
  - number: '16.1'
    text: |-
      De ombudsman zendt jaarlijks een verslag van zijn werkzaamheden aan de beide Kamers der Staten-Generaal en aan
      Onze Ministers, alsmede aan de vertegenwoordigende organen van provincies, gemeenten en waterschappen en aan
      de algemene besturen van gemeenschappelijke regelingen als bedoeld in [artikel 1a, eerste lid, onder b][ref1],
      voorzover de ombudsman ten aanzien van hun bestuursorganen verzoekschriften heeft behandeld.
      [Artikel 10 van de Wet openbaarheid van bestuur][ref2] is van overeenkomstige toepassing met dien verstande dat de
      ombudsman bij het verslag gegevens kan voegen, slechts ter vertrouwelijke kennisneming door de leden van de Staten-
      Generaal en Onze Ministers.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: 1a
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '16.2'
    text: De ombudsman draagt er zorg voor dat het verslag openbaar wordt gemaakt en algemeen verkrijgbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel16
  - number: '16.3'
    text: |-
      De ombudsman kan ook dadelijk na het afsluiten van een onderzoek de beide Kamers der Staten-Generaal,
      vertegenwoordigende organen van provincies, gemeenten en waterschappen en algemene besturen van gemeenschappelijke
      regelingen inlichten omtrent zijn bevindingen en oordeel, zo dikwijls hij de eerdere kennisneming daarvan voor het
      betreffende orgaan van belang acht of een orgaan als hiervoor bedoeld dit verzoekt.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel16
  - number: '17'
    text: |-
      De voordrachten voor ter uitvoering van deze wet te nemen koninklijke besluiten worden gedaan door Onze Minister
      van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel17
  - number: '18'
    text: |-
      Indien provincies, gemeenten, waterschappen of gemeenschappelijke regelingen een eigen voorziening voor de
      behandeling van verzoekschriften hebben ingesteld als bedoeld in [artikel 1a, eerste lid, onder b][ref1], blijft de
      ombudsman bevoegd verzoekschriften ten aanzien van hun bestuursorganen te behandelen die voor de ingangsdatum van
      de eigen voorziening door hem zijn ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel1a
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: 1a
        hoofdstuk: I
  - number: '19'
    text: |-
      Tot een jaar na inwerkingtreding van een besluit als bedoeld in [artikel 1a, eerste lid, onder e][ref1], kan
      met betrekking tot een gedraging van het desbetreffende bestuursorgaan die heeft plaatsgevonden voordat het
      desbetreffende bestuursorgaan is uitgezonderd, een verzoekschrift bij de ombudsman worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel1a
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: 1a
        hoofdstuk: I
  - number: '20'
    text: 'Deze wet wordt aangehaald als: Wet Nationale ombudsman.'
    url: https://wetten.overheid.nl/BWBR0003372/2005-03-15#Artikel20
