    text: |-
      Deze wet verstaat onder:

      a. ombudsman: de Nationale ombudsman, bedoeld in [artikel 2][ref1];

      b. *Kinderombudsman:* de als zodanig aangewezen substituut-ombudsman, bedoeld in [artikel 9, eerste lid][ref2];

      c. veteranenombudsman: de ombudsman voor zover hij optreedt als bedoeld in [hoofdstuk IIB][ref3], of de als zodanig
      aangewezen substituut-ombudsman bedoeld in [artikel 9, eerste lid][ref4];

      d. ambtenaar: een ambtenaar, een gewezen ambtenaar, personen genoemd in
      [artikel 3, onderdelen a, c, d, e en f, van de Ambtenarenwet 2017][ref5] en in
      [artikel 1, onderdeel b, onder 7°, van de Wet op de rechterlijke organisatie][ref6], ook na beëindiging van de
      aanstelling, alsmede andere personen werkzaam onder de verantwoordelijkheid van het bestuursorgaan, ook na het
      beëindigen van de werkzaamheden;

      e. openbare lichamen: openbare lichamen Bonaire, Sint Eustatius en Saba.


