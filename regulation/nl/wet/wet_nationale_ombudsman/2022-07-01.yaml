  - number: 1c
    text: |-
      1 Provincies, gemeenten, openbare lichamen, waterschappen en gemeenschappelijke regelingen als bedoeld in
      [artikel 1a, eerste lid, onder b][ref1], zijn een vergoeding verschuldigd ter dekking van de kosten die zijn
      verbonden aan de behandeling van verzoekschriften ten aanzien van hun bestuursorganen door de ombudsman. Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt de vergoeding vast.

      2 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent:

      a. de berekening van de te betalen vergoeding;

      b. de wijze van betaling van de verschuldigde vergoeding;

      c. het tijdstip waarop de verschuldigde vergoeding dient te zijn voldaan.


