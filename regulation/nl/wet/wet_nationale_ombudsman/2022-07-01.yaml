  - number: '2'
    text: |-
      1 Er is een Nationale ombudsman.

      2 De ombudsman wordt benoemd door de Tweede Kamer der Staten-Generaal. Bij de benoeming slaat de Tweede Kamer
      zodanig acht op een aanbeveling, daartoe in gezamenlijk overleg opgemaakt door de vice-president van de Raad van
      State, de president van de Hoge Raad der Nederlanden en de president van de Algemene Rekenkamer en bevattende de
      namen van ten minste drie personen, als zij zal dienstig oordelen.

      3 De benoeming geschiedt voor de duur van zes jaren.

      4 Indien de Tweede Kamer voornemens is de ombudsman opnieuw te benoemen, kan zij bepalen dat het tweede lid, tweede
      volzin, buiten toepassing blijft.

      5 Indien blijkt dat de Tweede Kamer niet tijdig tot de benoeming van een nieuwe ombudsman zal kunnen
      komen, voorziet de Tweede Kamer zo spoedig mogelijk in de waarneming van het ambt van ombudsman.
      [Artikel 10, vijfde tot en met zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel10
    url: https://wetten.overheid.nl/BWBR0003372/2022-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '10'
        hoofdstuk: II
  - number: '3'
    text: |-
      1 De Tweede Kamer ontslaat de ombudsman met ingang van de eerstvolgende maand na die waarin hij de zeventigjarige
      leeftijd bereikt.

      2 De Tweede Kamer ontslaat de ombudsman voorts:

      a. op zijn verzoek;

      b. wanneer hij uit hoofde van ziekten of gebreken blijvend ongeschikt is zijn functie te vervullen;

      c. bij de aanvaarding van een ambt of betrekking bij deze wet onverenigbaar verklaard met het ambt van ombudsman;

      d. bij het verlies van het Nederlanderschap;

      e. wanneer hij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem bij
      zulk een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;

      f. wanneer hij ingevolge onherroepelijk geworden rechterlijke uitspraak onder curatele is gesteld, in staat van
      faillissement is verklaard, ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is
      verklaard, hij surseance van betaling heeft verkregen of wegens schulden is gegijzeld;

      g. wanneer hij naar het oordeel van de Tweede Kamer door handelen of nalaten ernstig nadeel toebrengt aan het in
      hem te stellen vertrouwen.
    url: https://wetten.overheid.nl/BWBR0003372/2022-07-01#Artikel3
  - number: '4'
    text: |-
      1 De Tweede Kamer stelt de ombudsman op non-activiteit ingeval:

      a. hij zich in voorlopige hechtenis bevindt;

      b. hij bij een nog niet onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem
      bij zulk een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;

      c. hij onder curatele is gesteld, in staat van faillissement is verklaard, ten aanzien van hem de
      schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, hij surseance van betaling heeft
      verkregen of wegens schulden is gegijzeld ingevolge een nog niet onherroepelijk geworden rechterlijke uitspraak.

      2 De Tweede Kamer kan de ombudsman op non-activiteit stellen, indien hij wordt vervolgd wegens een misdrijf of
      indien er een ander ernstig vermoeden is voor het bestaan van feiten of omstandigheden die tot ontslag, anders dan
      op gronden vermeld in [artikel 3, tweede lid onder b][ref1], zouden kunnen leiden.

      3 In het geval, bedoeld in het tweede lid, eindigt de non-activiteit na drie maanden. De Tweede Kamer kan de
      maatregel echter telkens voor ten hoogste drie maanden verlengen.

      4 De Tweede Kamer beëindigt de non-activiteit zodra de grond voor de maatregel is vervallen.

      5 De Tweede Kamer kan bij de beslissing waarbij de ombudsman op non-activiteit wordt gesteld, bepalen dat tijdens
      de duur van de non-activiteit geen salaris of slechts een gedeelte van het salaris zal worden genoten, in het
      laatste geval onder aanwijzing van het gedeelte dat zal worden genoten.

      6 Indien de non-activiteit anders dan door ontslag is geëindigd, kan de Tweede Kamer beslissen, dat het niet
      genoten salaris alsnog geheel of gedeeltelijk zal worden uitbetaald, in het laatste geval onder aanwijzing van het
      gedeelte dat zal worden uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel3
    url: https://wetten.overheid.nl/BWBR0003372/2022-07-01#Artikel4
    references:
