  - number: 11h
    text: |-
      1 Een veteraan of namens deze, een relatie van een veteraan, die meent niet behoorlijk behandeld te zijn door:

      a. een bestuursorgaan als bedoeld in [artikel 1a][ref1];

      b. een orgaan van een rechtspersoon, niet zijnde een bestuursorgaan, voorzover die:

      1° . een bij of krachtens wet geregelde taak ten aanzien van veteranen uitoefent; of

      2° . anderszins een taak ten aanzien van veteranen uitoefent,

      kan een klacht indienen bij de Veteranenombudsman.

      2 Een klacht over een bestuursorgaan als bedoeld in [artikel 1a][ref2], geldt als een verzoek als bedoeld in
      [artikel 9:18, eerste lid, van de Algemene wet bestuursrecht][ref3].

      3 Een gedraging van een medewerker van een rechtspersoon als bedoeld in het eerste lid, onder b, verricht in de
      uitoefening van zijn functie, wordt aangemerkt als een gedraging van die rechtspersoon.


