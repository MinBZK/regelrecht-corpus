  - number: '10'
    text: |-
      1 De ombudsman regelt zijn vervanging door een substituut-ombudsman, voor het geval dat hij tijdelijk niet in staat
      is zijn ambt te vervullen. De ombudsman regelt tevens de vervanging van de Kinderombudsman of de Veteranenombudsman
      door een substituut-ombudsman, voor het geval dat die tijdelijk niet in staat is zijn ambt te vervullen.

      2 Indien geen substituut-ombudsman aanwezig of beschikbaar is, voorziet de Tweede Kamer zo spoedig mogelijk in de
      vervanging van de ombudsman, Kinderombudsman of Veteranenombudsman. In dat geval eindigt de vervanging wanneer de
      ombudsman, Kinderombudsman of Veteranenombudsman weer in staat is zijn ambt te vervullen of, indien de ombudsman,
      Kinderombudsman of Veteranenombudsman op non-activiteit is gesteld, op het tijdstip dat de non-activiteit eindigt.

      3 Indien de ombudsman, Kinderombudsman of Veteranenombudsman overlijdt of ingevolge [artikel 3][ref1]
      wordt ontslagen, voorziet de Tweede Kamer zo spoedig mogelijk in de waarneming van het ambt van ombudsman,
      Kinderombudsman of Veteranenombudsman door een substituut-ombudsman.

      4 Indien geen substituut-ombudsman aanwezig of beschikbaar is, voorziet de Tweede Kamer zo spoedig mogelijk in de
      waarneming van het ambt van ombudsman, Kinderombudsman of Veteranenombudsman.

      5 De waarneming eindigt van rechtswege op het tijdstip waarop een nieuwe ombudsman, Kinderombudsman of
      Veteranenombudsman in functie is getreden.

      6 Op degene die krachtens het tweede of het vierde lid de ombudsman, Kinderombudsman of Veteranenombudsman
      vervangt of het ambt van ombudsman, Kinderombudsman of Veteranenombudsman waarneemt, zijn
      de[ artikelen 2, tweede lid, tweede volzin, derde en vierde lid][ref2], [3, eerste lid][ref3], [6][ref4] en
      [9][ref5] van deze wet niet van toepassing.

      7 Indien de in het zesde lid bedoelde vervanger respectievelijk waarnemer een betrekking of lidmaatschap als
      bedoeld in [artikel 5, eerste lid, onderdelen b en c][ref6], bekleedt of gaat bekleden, is hij voor de duur van
      de vervanging respectievelijk de waarneming in die betrekking of dat lidmaatschap van rechtswege op non-activiteit
      gesteld. De bezoldiging voor die betrekking of dat lidmaatschap met inbegrip van eventuele toelagen blijft
      gedurende de periode van non-activiteit achterwege.


