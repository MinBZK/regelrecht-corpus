  - number: '11'
    text: |-
      1 Te zijner ondersteuning beschikt de ombudsman over een bureau.

      2 Op voordracht van de ombudsman wordt bij koninklijk besluit besloten tot het aangaan van een arbeidsovereenkomst
      met de tot het bureau behorende personen. Tot beëindiging van de arbeidsovereenkomst wordt bij koninklijk
      besluit op voordracht van de ombudsman besloten, tenzij de ombudsman de arbeidsovereenkomst opzegt op grond van
      [artikel 677 van Boek 7 van het Burgerlijk Wetboek][ref1].

      3 Bij koninklijk besluit wordt bepaald in welke gevallen het tweede lid niet van toepassing is.

      4 Ten aanzien van het tot het bureau van de ombudsman behorende personeel gelden de voor alle ambtenaren geldende
      arbeidsvoorwaarden die zijn opgenomen in de laatstelijk afgesloten collectieve arbeidsovereenkomst voor ambtenaren
      die krachtens een arbeidsovereenkomst met de Staat werkzaam zijn.

      5 Op verzoek van de ombudsman kunnen in de collectieve arbeidsovereenkomst, bedoeld in het vierde lid, andere
      arbeidsvoorwaarden voor het tot het bureau van de ombudsman behorende personeel worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel677
    url: https://wetten.overheid.nl/BWBR0003372/2022-07-01#Artikel11
