        bwb_id: BWBR0005537
        artikel: 9:31
  - number: '14'
    text: |-
      Onze Ministers kunnen aan de ombudsman het betreden van bepaalde plaatsen verbieden, indien dit naar hun oordeel de
      veiligheid van de staat zou schaden.
    url: https://wetten.overheid.nl/BWBR0003372/2022-07-01#Artikel14
  - number: '15'
    text: |-
      De ombudsman kan bevelen dat personen die, hoewel wettelijk opgeroepen, niet zijn verschenen, door de openbare
      macht voor hem worden gebracht om aan hun verplichtingen te voldoen.
    url: https://wetten.overheid.nl/BWBR0003372/2022-07-01#Artikel15
  - number: '16'
    text: |-
      1 De ombudsman zendt jaarlijks een verslag van zijn werkzaamheden aan de beide Kamers der Staten-Generaal
      en aan Onze Ministers, alsmede aan de vertegenwoordigende organen van provincies, gemeenten openbare
      lichamen en waterschappen en aan de algemene besturen van gemeenschappelijke regelingen als bedoeld
      in [artikel 1a, eerste lid, onder b][ref1], voorzover de ombudsman ten aanzien van hun bestuursorganen
      verzoekschriften heeft behandeld. [Artikel 5.1 van de Wet open overheid][ref2] is van overeenkomstige toepassing
      met dien verstande dat de ombudsman bij het verslag gegevens kan voegen, slechts ter vertrouwelijke kennisneming
      door de leden van de Staten-Generaal en Onze Ministers.

      2 De ombudsman draagt er zorg voor dat het verslag openbaar wordt gemaakt en algemeen verkrijgbaar wordt gesteld.

      3 De ombudsman kan ook dadelijk na het afsluiten van een onderzoek de beide Kamers der Staten-Generaal,
      vertegenwoordigende organen van provincies, gemeenten openbare lichamen en waterschappen en algemene besturen
      van gemeenschappelijke regelingen inlichten omtrent zijn bevindingen en oordeel, zo dikwijls hij de eerdere
      kennisneming daarvan voor het betreffende orgaan van belang acht of een orgaan als hiervoor bedoeld dit verzoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0045754#Artikel5.1
    url: https://wetten.overheid.nl/BWBR0003372/2022-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: 1a
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0045754
        artikel: '5.1'
  - number: '17'
    text: |-
      De voordrachten voor ter uitvoering van deze wet te nemen koninklijke besluiten worden gedaan door Onze Minister
      van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0003372/2022-07-01#Artikel17
  - number: '18'
    text: |-
      Indien provincies, gemeenten, openbare lichamen, waterschappen of gemeenschappelijke regelingen
      een eigen voorziening voor de behandeling van verzoekschriften hebben ingesteld als bedoeld in
      [artikel 1a, eerste lid, onder b][ref1], blijft de ombudsman bevoegd verzoekschriften ten aanzien van hun
      bestuursorganen te behandelen die voor de ingangsdatum van de eigen voorziening door hem zijn ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel1a
    url: https://wetten.overheid.nl/BWBR0003372/2022-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: 1a
        hoofdstuk: I
  - number: '19'
    text: |-
      Tot een jaar na inwerkingtreding van een besluit als bedoeld in [artikel 1a, eerste lid, onder e][ref1], kan
      met betrekking tot een gedraging van het desbetreffende bestuursorgaan die heeft plaatsgevonden voordat het
      desbetreffende bestuursorgaan is uitgezonderd, een verzoekschrift bij de ombudsman worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel1a
    url: https://wetten.overheid.nl/BWBR0003372/2022-07-01#Artikel19
    references:
      - id: ref1
