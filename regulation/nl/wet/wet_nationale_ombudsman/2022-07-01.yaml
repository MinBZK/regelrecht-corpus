  - number: 11e
    text: |-
      1 De Kinderombudsman zendt jaarlijks een verslag van zijn werkzaamheden aan de beide Kamers der Staten-Generaal
      en aan Onze Ministers, alsmede aan andere bestuursorganen en privaatrechtelijke organisaties voor zover hij dat
      wenselijk acht. [Artikel 5.1 van de Wet open overheid][ref1] is van overeenkomstige toepassing met dien verstande
      dat de Kinderombudsman bij het verslag gegevens kan voegen, slechts ter vertrouwelijke kennisneming door de leden
      van de Staten-Generaal en Onze Ministers.

      2 De Kinderombudsman draagt er zorg voor dat het verslag openbaar wordt gemaakt en algemeen verkrijgbaar wordt
      gesteld.

      3 De Kinderombudsman kan ook dadelijk na het afsluiten van een onderzoek de beide Kamers der Staten-Generaal en
      vertegenwoordigende organen van provincies en gemeenten inlichten omtrent zijn bevindingen, zo dikwijls hij de
      eerdere kennisneming daarvan voor het betreffende orgaan van belang acht of een orgaan als hiervoor bedoeld dit
      verzoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel5.1
    url: https://wetten.overheid.nl/BWBR0003372/2022-07-01#Artikel11e
