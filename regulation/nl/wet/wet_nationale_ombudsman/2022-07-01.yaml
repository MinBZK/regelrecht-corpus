        artikel: '3'
        hoofdstuk: II
  - number: '5'
    text: |-
      1 De ombudsman kan niet bekleden:

      a. het lidmaatschap van publiekrechtelijke colleges waarvoor de keuze geschiedt bij krachtens wettelijk voorschrift
      uitgeschreven verkiezingen;

      b. een openbare betrekking waaraan een vaste beloning of toelage is verbonden;

      c. het lidmaatschap van vaste colleges van advies en bijstand aan de Regering;

      d. het beroep of ambt van advocaat of notaris.

      2 De ombudsman vervult geen betrekkingen waarvan de uitoefening ongewenst is met het oog op een goede vervulling
      van zijn ambt of op de handhaving van zijn onpartijdigheid en onafhankelijkheid of van het vertrouwen daarin.

      3 De betrekkingen die de ombudsman buiten zijn ambt vervult, worden door hem openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0003372/2022-07-01#Artikel5
  - number: '6'
    text: |-
      De bepalingen van de [Algemene pensioen- en uitkeringswet politieke ambtsdragers][ref1] zijn van overeenkomstige
      toepassing op de ombudsman, met dien verstande dat deze wordt gelijkgesteld met een lid van de Tweede Kamer der
      Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0002691
    url: https://wetten.overheid.nl/BWBR0003372/2022-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002691
  - number: '8'
    text: |-
      Alvorens zijn ambt te aanvaarden legt de ombudsman in de handen van de Voorzitter der Tweede Kamer af:

      a. de eed of verklaring en belofte dat hij tot het verkrijgen van zijn benoeming rechtstreeks noch middellijk,
      onder welke naam of onder welk voorwendsel ook, aan iemand iets heeft gegeven of beloofd, alsmede dat hij om iets
      in zijn ambt te doen of te laten rechtstreeks noch middellijk van iemand enig geschenk of enige belofte heeft
      aangenomen of zal aannemen;

      b. de eed of belofte van trouw aan de [Grondwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0003372/2022-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '9'
    text: |-
      1 De Tweede Kamer benoemt op verzoek van de ombudsman een of meer personen tot substituut-ombudsman en wijst
      daarbij de substituut-ombudsman aan die de functie van Kinderombudsman of Veteranenombudsman heeft. De ombudsman
      maakt daartoe een aanbeveling op, die de namen van ten minste drie personen bevat. Indien er geen Kinderombudsman
      of Veteranenombudsman is, draagt de ombudsman zo spoedig mogelijk zorg voor een verzoek als bedoeld in de eerste
      volzin.

      2 De benoeming van een substituut-ombudsman geschiedt voor de duur van de ambtstermijn van de ombudsman op wiens
      verzoek hij is benoemd, vermeerderd met een jaar.

      3 Indien de Tweede Kamer voornemens is een substituut-ombudsman opnieuw te benoemen, kan zij bepalen dat het eerste
      lid, tweede volzin, buiten toepassing blijft.

      4 De[ artikelen 3 tot en met 8][ref1], [15][ref2], en de [artikelen 9:21][ref3] en
      [9:30 tot en met 9:34 van de Algemene wet bestuursrecht][ref4], zijn van overeenkomstig toepassing op een
      substituut-ombudsman.

      5 De ombudsman regelt de werkzaamheden van een substituut-ombudsman.

      6 De ombudsman kan bepalen dat de bevoegdheden, bedoeld in de [artikelen 16, derde lid][ref5], en de
      [artikelen 9:27][ref6], [9:35][ref7] en [9:36 van de Algemene wet bestuursrecht][ref8], tevens worden uitgeoefend
      door een substituut-ombudsman. De ombudsman kan voor de uitoefening van die bevoegdheden richtlijnen vaststellen.


