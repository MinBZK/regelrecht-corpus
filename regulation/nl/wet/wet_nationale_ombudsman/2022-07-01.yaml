        artikel: '5.1'
  - number: 11f
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *veteraan:* een veteraan als bedoeld in [artikel 1 van de Veteranenwet][ref1];
        - *relaties van een veteraan:* relaties als bedoeld in [artikel 1 van de Veteranenwet][ref2].


