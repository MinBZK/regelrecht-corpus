  - number: 11g
    text: |-
      1 De Veteranenombudsman is bevoegd:

      a. naar aanleiding van klachten of uit eigen beweging een onderzoek in te stellen naar de wijze waarop een
      instantie als bedoeld in [artikel 11h, eerste lid][ref1], zich in een bepaalde aangelegenheid heeft gedragen,
      tenzij [artikel 9:22 van de Algemene wet bestuursrecht][ref2] van toepassing is;

      b. gevraagd en ongevraagd advies te geven aan de regering en de beide Kamers der Staten-Generaal over de uitvoering
      van de [Veteranenwet][ref3] en over beleid dat een behoorlijke behandeling van Veteranen raakt;

      c. de wijze waarop klachten van veteranen of hun relaties door de daartoe bevoegde instanties, niet zijnde de
      ombudsman, worden behandeld te monitoren en te analyseren en de regering en de Tweede Kamer in te lichten over
      zijn bevindingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel11h
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel922
