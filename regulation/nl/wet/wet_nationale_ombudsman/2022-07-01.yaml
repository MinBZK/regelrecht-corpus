        artikel: '677'
  - number: 11a
    text: |-
      In dit hoofdstuk wordt verstaan onder:

      a. jeugdige: een persoon die de meerderjarigheidsleeftijd nog niet heeft bereikt;

      b. kinderrechtenverdrag: het op 20 november 1989 te New York tot stand gekomen Verdrag inzake de rechten van het
      kind (Trb. 1990, 46);

      c. rechten van jeugdigen: de rechten van jeugdigen, opgenomen in het kinderrechtenverdrag.
    url: https://wetten.overheid.nl/BWBR0003372/2022-07-01#Artikel11a
  - number: 11b
    text: |-
      1 De Kinderombudsman heeft tot taak te bevorderen dat de rechten van jeugdigen worden geëerbiedigd door
      bestuursorganen en door privaatrechtelijke organisaties.

      2 Hij doet dit in elk geval door:

      a. voor te lichten en informatie te geven over de rechten van jeugdigen;

      b. gevraagd en ongevraagd advies te geven aan de regering en de beide Kamers der Staten-Generaal over wetgeving die
      en beleid dat de rechten van jeugdigen raakt;

      c. het instellen van onderzoek naar de eerbiediging van de rechten van jeugdigen naar aanleiding van klachten of
      uit eigen beweging;

      d. het toezicht houden op de wijze waarop klachten van jeugdigen of hun wettelijke vertegenwoordigers door de
      daartoe bevoegde instanties, niet zijnde de ombudsman, worden behandeld.

      3 Bij de uitvoering van zijn taken, houdt de Kinderombudsman zo veel mogelijk rekening met de mening van
      jeugdigen zelf overeenkomstig artikel 12 van het kinderrechtenverdrag, met de belangen van jeugdigen en met hun
      belevingswereld.
    url: https://wetten.overheid.nl/BWBR0003372/2022-07-01#Artikel11b
  - number: 11c
    text: |-
      1 Een ieder die meent dat een of meer rechten van jeugdigen niet geëerbiedigd worden door:

      a. een bestuursorgaan als bedoeld in [artikel 1a][ref1], met dien verstande dat, in afwijking van artikel 1a,
      eerste lid, onder b, daaronder mede worden begrepen bestuursorganen met een eigen voorziening voor de behandeling
      van verzoekschriften als bedoeld in artikel 1a, eerste lid, onder b;

      b. een orgaan van een rechtspersoon, niet zijnde een bestuursorgaan, voor zover die:

      1° een bij of krachtens de wet geregelde taak ten aanzien van jeugdigen uitoefent; of

      2° anderszins een taak ten aanzien van jeugdigen uitoefent op het terrein van het onderwijs, de jeugdhulp, de
      kinderopvang of de gezondheidszorg,

      kan een klacht indienen bij de Kinderombudsman.

      2 Een klacht over een bestuursorgaan als bedoeld in [artikel 1a][ref2], geldt als een verzoek als bedoeld in
      [artikel 9:18, eerste lid, van de Algemene wet bestuursrecht][ref3].

      3 Een gedraging van een medewerker van een rechtspersoon als bedoeld in het eerste lid, onder b, verricht in de
      uitoefening van zijn functie, wordt aangemerkt als een gedraging van die rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0003372#Artikel1a
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel918
