  - number: 1b
    text: |-
      1 Indien de ombudsman een besluit als bedoeld in [artikel 79q, tweede of derde lid, van de Provinciewet][ref1],
      [artikel 81p, tweede of derde lid, van de Gemeentewet][ref2], artikel 107, tweede of derde lid, van de Wet openbare
      lichamen Bonaire, Sint Eustatius en Saba [artikel 51b, tweede of derde lid, van de Waterschapswet][ref3] of
      [artikel 10, vierde lid][ref4], [artikel 41, eerste lid, onder a][ref5], [artikel 50a, eerste lid, onder a][ref6],
      [artikel 52, eerste lid, onder a][ref7], [artikel 62, onder a][ref8], [artikel 74, eerste lid, onder a][ref9],
      [artikel 84, eerste lid, onder a][ref10], en [artikel 126, onder b, van de Wet gemeenschappelijke regelingen][ref11]
      heeft ontvangen, bevestigt hij onverwijld de ontvangst daarvan.

      2 De ombudsman registreert de provincies, gemeenten, openbare lichamen, waterschappen en gemeenschappelijke
      regelingen met een eigen voorziening als bedoeld in [artikel 1a, eerste lid, onder b][ref12]. Hij maakt deze
      registratie openbaar.


