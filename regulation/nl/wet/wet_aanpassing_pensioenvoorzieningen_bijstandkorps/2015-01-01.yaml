preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is maatregelen te treffen ten aanzien van pensioenen
    toegekend krachtens de wet van 25 mei 1962, Stb. 196, in verband met de interimregeling voor uit hoofde van
    invaliditeit gepensioneerde ambtenaren en in verband met de maatregelen tot aanpassing van de overheidspensioenen
    aan de algemene wijzigingen van het bezoldigingspeil, alsmede nieuwe regelen vast te stellen ten aanzien van
    de invloed op een pensioen krachtens de wet van 25 mei 1962, Stb. 196, van een pensioen krachtens de Algemene
    Ouderdomswet of een pensioen dan wel uitkering krachtens de Algemene Weduwen- en Wezenwet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002507/2015-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      a. pensioen: een pensioen, toegekend of geacht mede te zijn toegekend krachtens de wet van 25 mei 1962, *Stb.*
      196, houdende instelling van een Bijstandkorps van burgerlijke rijksambtenaren, dat bestemd is voor dienst in
      Nederlands-Nieuw-Guinea;

      b. pensioenreglement: het pensioenreglement, bedoeld in artikel 15 van de onder *a* genoemde wet;

      c. eigen pensioen: een pensioen als bedoeld in artikel 8 van het pensioenreglement;

      d. weduwenpensioen: een pensioen als bedoeld in artikel 10 van het pensioenreglement;

      e. wezenpensioen: een pensioen als bedoeld in artikel 11 van het pensioenreglement.
    url: https://wetten.overheid.nl/BWBR0002507/2015-01-01#Artikel1
  - number: '9'
    text: |-
      In deze afdeling wordt verstaan onder:

      a. pensioen: een pensioen als bedoeld in [artikel 1, onder a][ref1], met inbegrip van de daarop verleende
      toeslagen;

      b. ander pensioen: een pensioen, als bedoeld in artikel 16, tweede lid jo. vierde lid, van het pensioenreglement.

      c. algemeen ouderdomspensioen: een bruto ouderdomspensioen als bedoeld in de [Algemene Ouderdomswet][ref2] met
      inbegrip van de daarbij behorende vakantie-uitkering voorzover deze niet behoren tot de overlijdensuitkering
      krachtens die wet;

      d. algemeen weduwenpensioen en algemeen wezenpensioen: een weduwenpensioen of een tijdelijke weduwenuitkering
      onderscheidenlijk een wezenpensioen, als bedoeld in de Algemene Weduwen- en Wezenwet zoals die wet laatstelijk
      luidde.

      e. «algemene nabestaandenuitkering» en «algemene wezenuitkering»: uitkering op grond van de
      [Algemene nabestaandenwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002507#Artikel1
