  - number: '12'
    text: |-
      1 Indien het bedrag, dat tot grondslag heeft gestrekt voor de berekening van het eigen pensioen, dan wel, indien
      het pensioen is afgeleid van een eigen pensioen, het bedrag dat tot grondslag heeft gestrekt voor de berekening
      van dat eigen pensioen, vermeerderd met een percentage gelijk aan het percentage van de op dat pensioen bij of
      krachtens deze wet toegekende aanpassingstoeslag, lager is dan 7/66 maal het normbedrag bedoeld in het tweede lid,
      wordt het met toepassing van [artikel 11][ref1] berekende bedrag van de beperking vermenigvuldigd met een breuk,
      waarvan de teller het eerstbedoelde vermeerderde bedrag is en de noemer 7/66 maal het normbedrag. De uitkomst van
      deze vermenigvuldiging vormt in dat geval het bedrag van de beperking van het pensioen.

      2 Het normbedrag is het bedrag, bedoeld in [artikel J 12 van de Algemene burgerlijke pensioenwet](onbekend),
      zoals die luidde op 31 december 1995, welk bedrag met ingang van 1 januari 1996 bij ministeriële regeling
      wordt aangepast overeenkomstig de aanpassing van de pensioenen voor overheidswerknemers in de zin van
      [artikel 2 van de Wet privatisering ABP][ref2] die werkzaam zijn geweest in de sector Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0002507#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0007791#Artikel2
