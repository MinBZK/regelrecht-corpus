  - number: '10'
    text: |-
      Voor de toepassing van de bepalingen van deze afdeling geldt het volgende.

      a. Een pensioen wordt geacht te zijn berekend naar 8/5 maal de pensioendiensttijd, die voor de berekening van het
      pensioen in aanmerking is genomen, tot een maximum van veertig jaren.

      b. Indien in een pensioen een invaliditeitstoeslag, als bedoeld in de [Tweede Afdeling][ref1] is begrepen,
      wordt het pensioen geacht te zijn berekend naar 8/5 maal een met de som van pensioen en invaliditeitstoeslag
      overeenkomende pensioendiensttijd, tot een maximum van veertig jaren. De voorgaande volzin vindt overeenkomstige
      toepassing ten aanzien van weduwen- en wezenpensioenen, waarop krachtens [artikel 6, tweede lid][ref2], of artikel
      6, vierde lid, een toeslag is verleend.

      c. Een vol algemeen ouderdomspensioen wordt geacht betrekking te hebben op het tijdvak,
      liggende tussen de tijdstippen, waarop de rechthebbende op een eigen pensioen, dan wel degene
      aan wiens overlijden het recht op pensioen wordt ontleend, de aanvangsleeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref3], heeft bereikt en de pensioengerechtigde leeftijd,
      bedoeld in artikel 7a, eerste lid, van de Algemene Ouderdomswet, heeft of zou hebben bereikt. Buiten beschouwing
      wordt gelaten dat deel van vorenbedoeld tijdvak waarop betrekking heeft of geacht kan worden betrekking te hebben
      het bedrag van het algemeen ouderdomspensioen waarop aanspraak is verkregen door vrijwillige premiebetaling op
      grond van de [Algemene Ouderdomswet][ref4].

      d. De uitkering op grond van de [Algemene nabestaandenwet][ref5] wordt geacht betrekking te hebben op het tijdvak,
      liggende tussen de tijdstippen waarop degene, aan wiens overlijden het recht op pensioen wordt ontleend, de
      aanvangsleeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref6], heeft bereikt en de
      pensioengerechtigde leeftijd, bedoeld in artikel 7a, eerste lid, van de Algemene Ouderdomswet, heeft of zou hebben
      bereikt. Buiten beschouwing wordt gelaten dat deel van vorenbedoeld tijdvak waarover vrijwillige premiebetaling
      krachtens [hoofdstuk 5 van de Algemene nabestaandenwet][ref7] heeft plaatsgevonden.

      e. Als diensttijd wordt uitsluitend in aanmerking genomen de diensttijd gelegen tussen de tijdstippen waarop de
      rechthebbende op een eigen pensioen, dan wel degene aan wiens overlijden het recht op pensioen wordt ontleend,
      de aanvangsleeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref8], heeft bereikt en de
      pensioengerechtigde leeftijd, bedoeld in artikel 7a, eerste lid, van de Algemene Ouderdomswet, heeft of zou hebben
      bereikt.

      f. Diensttijd, waarnaar een pensioen geacht wordt te zijn berekend en die niet daadwerkelijk in dienstverhouding
      is doorgebracht, wordt geacht aan te sluiten bij het einde van de dienstverhouding waaraan het recht op pensioen
      is ontleend; voor zover dientengevolge deze diensttijd zich uitstrekt na het tijdstip waarop de pensioengerechtigde
      leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref9], is of zou worden bereikt wordt
      die diensttijd, te rekenen van dat tijdstip, geacht te zijn doorgebracht, voor zoveel mogelijk gedurende tijdvakken
      van onderbreking van de daadwerkelijk in dienstverhouding doorgebrachte tijd en voor het overige onmiddellijk voor
      de aanvang van de diensttijd waarnaar het pensioen is berekend.

      g. De vakantie-uitkeringen, bedoeld in de [Algemene Ouderdomswet][ref10] en de [Algemene nabestaandenwet][ref11],
      worden geacht op overeenkomstige wijze als het ouderdomspensioen, de uitkering op grond van de Algemene
      nabestaandenwet in termijnen te worden uitbetaald.


