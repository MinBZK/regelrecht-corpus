  - number: '18'
    text: |-
      Indien aanspraak bestaat op een weduwenpensioen of een wezenpensioen en tevens aanspraak bestaat op een
      ander pensioen of op een andere pensioenuitkering vindt het bepaalde in de [artikelen 14][ref1] en [15][ref2]
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002507#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002507#Artikel15
    url: https://wetten.overheid.nl/BWBR0002507/2015-01-01#Artikel18
