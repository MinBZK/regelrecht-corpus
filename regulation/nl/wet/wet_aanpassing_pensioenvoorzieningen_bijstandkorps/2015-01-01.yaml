  - number: '20'
    text: |-
      Indien zowel beperking van de uitbetaling van een pensioen krachtens het bepaalde in deze afdeling als krachtens
      het bepaalde in artikel 17 van het pensioenreglement moet plaatsvinden, vindt eerst de laatstgenoemde beperking
      plaats.
    url: https://wetten.overheid.nl/BWBR0002507/2015-01-01#Artikel20
  - number: '21'
    text: |-
      1 Indien een betrokkene een algemeen ouderdomspensioen, een algemene nabestaandenuitkering of een algemene
      wezenuitkering gaat genieten, of indien in het bedrag daarvan een wijziging wordt aangebracht op grond van
      persoonlijke omstandigheden van hemzelf, zijn echtgenoot of zijn kinderen, dan wel het genot van een algemene
      nabestaandenuitkering of een algemene wezenuitkering eindigt, is hij gehouden hiervan onverwijld kennis te geven
      aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.

      2 Indien de belanghebbende de in het vorige lid bedoelde kennisgeving niet onverwijld doet, gaat een vermindering
      van de beperking niet vroeger in dan een jaar voor de eerste dag van de maand waarin de kennisgeving wordt gedaan
      of waarin ambtshalve vermindering van de beperking plaatsvond.

      3 In bijzondere gevallen kan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties het vorige lid buiten
      toepassing laten.
    url: https://wetten.overheid.nl/BWBR0002507/2015-01-01#Artikel21
  - number: '22'
    text: |-
      Indien een algemeen ouderdomspensioen, een algemene nabestaandenuitkering of een algemene wezenuitkering wordt
      toegekend of herzien over een tijdvak, waarover reeds een pensioen werd uitbetaald, kan de Sociale verzekeringsbank
      hetgeen dientengevolge te veel aan pensioen werd genoten, ten behoeve van het Ministerie van Binnenlandse Zaken
      en Koninkrijksrelaties, inhouden op het algemeen ouderdomspensioen, het algemeen weduwenpensioen of het algemeen
      wezenpensioen, voor zover betrekking hebbende op evengenoemd tijdvak.
    url: https://wetten.overheid.nl/BWBR0002507/2015-01-01#Artikel22
  - number: '23'
    text: |-
      De bepalingen van deze afdeling blijven buiten toepassing ten aanzien van degenen, die op grond van gemoedsbezwaren
      hun aanspraak op algemeen ouderdomspensioen, of een uitkering op grond van de [Algemene nabestaandenwet][ref1] niet
      geldig maken.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002507/2015-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: '24'
    text: |-
      1 Ten aanzien van degene, die op 30 juni 1964 recht had zowel op pensioen als op algemeen ouderdomspensioen,
      algemeen weduwenpensioen of algemeen wezenpensioen en tengevolge van de bepalingen van deze wet minder aan pensioen
      inbegrepen de daarop vallende toeslagen zou ontvangen dan hem op 30 juni 1964 zou toekomen indien de voor het
      tijdstip van inwerkingtreding van deze wet geldende bepalingen van kracht waren gebleven, wordt de beperking
      met een zodanig bedrag verminderd, dat aan pensioen, inbegrepen de daarop vallende toeslagen, niet minder wordt
      ontvangen, dan op 30 juni 1964 het geval was.

      2 Ingeval het vorige lid is toegepast wordt voor volgende berekeningen van de beperking het pensioen geacht te zijn
      vermeerderd met het bedrag, waarmede de beperking ingevolge het vorige lid is verminderd.

      3 Met ingang van de dag waarop voor belanghebbende na 30 juni 1964 recht op een lager bedrag aan algemeen
      ouderdomspensioen, algemeen weduwenpensioen of algemeen wezenpensioen onderscheidenlijk op of na 1 juli 1996 aan
      een algemene nabestaandenuitkering, of een algemene wezenuitkering ontstaat, wordt het in het vorige lid bedoelde
      bedrag zodanig lager gesteld, alsof de omstandigheid die tot wijziging leidde reeds op 30 juni 1964 aanwezig was
      geweest.
    url: https://wetten.overheid.nl/BWBR0002507/2015-01-01#Artikel24
  - number: '25'
    text: |-
      Indien het bedrag, dat over enig tijdvak aan belanghebbende is betaald bij wijze van voorschot op het bedrag
      waarop krachtens deze wet over dat tijdvak recht bestaat, laatstgenoemd bedrag overtreft, wordt het meerdere niet
      teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0002507/2015-01-01#Artikel25
  - number: '26'
    text: |-
      Toeslagen op pensioenen, toegekend bij wijze van voorschot op door het voormalige gouvernement van Nederlands-
      Nieuw-Guinea voorgenomen regelingen vervallen.
    url: https://wetten.overheid.nl/BWBR0002507/2015-01-01#Artikel26
  - number: 26a
    text: |-
      1 Indien terzake van het genot van een eigen pensioen, toegekend met toepassing van artikel 8, eerste lid, sub
      IV of V van het pensioenreglement, een weduwenpensioen of een wezenonderstand premie wordt geheven krachtens de
      [Algemene Ouderdomswet][ref1] en de de[Algemene nabestaandenwet][ref2], wordt aan de rechthebbende daarvoor een
      vergoeding verleend.

      2 De in het eerste lid bedoelde vergoeding wordt voor de periode 1 januari 1986 tot 1 januari 1990 vastgesteld op
      het bedrag van de premie die ingevolge de [Algemene Ouderdomswet][ref3] en de Algemene Weduwen- en Wezenwet wordt
      geheven over de som van het eigen pensioen, weduwenpensioen of wezenonderstand en de vergoeding.

      3 De in het eerste lid bedoelde vergoeding bedraagt vanaf 1 januari 1990, 13,636% van het bruto pensioen. Bij elke
      wijziging van het inhoudingspercentage dient het vergoedingspercentage steeds te worden aangepast door middel van
      vermenigvuldiging met een breuk waarvan de teller het nieuwe inhoudingspercentage is en de noemer 15,55 is.

      4 Indien terzake van het genot van een eigen pensioen, niet toegekend met toepassing van artikel 8, eerste lid,
      sub IV of V van het pensioenreglement, premie wordt geheven krachtens de [Algemene Ouderdomswet][ref4] en de
      de[Algemene nabestaandenwet][ref5] is het bepaalde in het vorige lid van overeenkomstige toepassing, met dien
      verstande dat de vergoeding wordt vastgesteld op 69,6% van de bedoelde premie.

      5 De vorige leden zijn van overeenkomstige toepassing ten aanzien van personen, aan wie vrijstelling van premie-
      betaling ingevolge de [Algemene Ouderdomswet][ref6] of ingevolge de de[Algemene nabestaandenwet][ref7] is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0007795
      [ref3]: https://wetten.overheid.nl/BWBR0002221
