  - number: '19'
    text: |-
      Op schriftelijk verzoek van de weduwe, die aantoont, dat een rente of uitkering, als bedoeld in artikel 19, onder
      2e der Ongevallenwet 1921, artikel 40, onder 2e der Land- en Tuinbouwongevallenwet 1922, onderscheidenlijk artikel
      2, tweede lid, der Zeeongevallenwet 1919, daaronder begrepen de daarop verleende toe- en bijslagen anders dan
      ingevolge de Wet compensatie premie Algemene Ouderdomswet ongevallenrentetrekkers, is beperkt wegens samenloop met
      een algemene nabestaandenuitkering wordt het bedrag van die beperking in mindering gebracht op het bedrag van de
      beperking van het weduwenpensioen.
    url: https://wetten.overheid.nl/BWBR0002507/2015-01-01#Artikel19
  - number: 19a
    text: |-
      1 Indien recht is ontstaan op weduwepensioen of een wezenpensioen na 31 december 2000 heeft de weduwe die de
      pensioengerechtigde leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], nog niet
      heeft bereikt, onderscheidenlijk de wees, in afwijking van de Wet brutering overhevelingstoeslag lonen, recht op
      een toeslag ter grootte van 1,9% van dat pensioen, met een maximum van € 791,85 per jaar.

      2 Voor de toepassing van het bij of krachtens deze wet bepaalde wordt de toeslag krachtens dit artikel niet onder
      pensioen of uitkering begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002507/2015-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 19b
    text: |-
      1 Indien ter zake van het overlijden van een gepensioneerde recht op een weduwepensioen ontstaat, heeft de weduwe,
      recht op een toeslag voor de tijd die bij de berekening van het pensioen in aanmerking is genomen indien en
      voor zolang recht bestaat op een nabestaandenuitkering krachtens de [Algemene nabestaandenwet][ref1], die wordt
      verminderd wegens inkomen uit arbeid of overig inkomen als bedoeld in de Algemene nabestaandenwet.

      2 De toeslag, bedoeld in het eerste lid, bedraagt per pensioentellend jaar 2,5% van het verschil tussen
      75% van de krachtens de [artikelen 14][ref2] en [30 van de Algemene nabestaandenwet](onbekend) vastgestelde
      nabestaandenuitkering en het bedrag van de nabestaandenuitkering, zoals deze na toepassing van de vermindering,
      bedoeld in [artikel 18 van de Algemene nabestaandenwet][ref3] is vastgesteld. De toeslag bedraagt niet meer dan 75%
      van de krachtens de artikelen 14 en 30 van de Algemene nabestaandenwet vastgestelde nabestaandenuitkering en kan
      niet negatief zijn. De toeslag wordt telkens nader vastgesteld:

      a. aan de hand van de ontwikkelingen van de bedragen van de [Algemene nabestaandenwet][ref4];

      b. bij iedere nadere vaststelling van de hiervoor bedoelde nabestaandenuitkering krachtens
      [artikel 18 van de Algemene nabestaandenwet][ref5].

      3 Het recht op toeslag, bedoeld in het eerste lid, gaat in met ingang van de maand waarin wordt voldaan aan de
      voorwaarden voor dat recht.

      4 Het recht op de toeslag, bedoeld in het eerste lid, vervalt:

      a. met ingang van de eerste dag van de maand waarin de weduwe de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref6], bereikt;

      b. met ingang van de maand volgende op die waarin de weduwe hertrouwt, als partner wordt geregistreerd of
      aangemerkt, of als ongehuwd samenwonend als bedoeld in de [Algemene nabestaandenwet][ref7] wordt aangemerkt.

      5 Voor de toepassing van het bij of krachtens deze wet bepaalde wordt de toeslag krachtens dit artikel niet onder
      pensioen of uitkering begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel14
