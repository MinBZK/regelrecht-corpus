  - number: '16'
    text: |-
      Het wezenpensioen, waarop twee of meer volle wezen aanspraak hebben, wordt, indien het wezenpensioen als een
      eenheid is toegekend, voor de toepassing van de bepalingen van dit hoofdstuk geacht aan ieder van genoemde wezen te
      zijn toegekend tot een bedrag, gelijk aan dat wezenpensioen gedeeld door hun aantal.
    url: https://wetten.overheid.nl/BWBR0002507/2015-01-01#Artikel16
  - number: '17'
    text: |-
      1 Bij gelijktijdige aanspraak op een weduwepensioen, onderscheidenlijk een wezenpensioen en een algemene
      nabestaandenuitkering, onderscheidenlijk een algemene wezenuitkering wordt, voor zover de tijdvakken, waarop
      het pensioen en de algemene uitkering geacht worden betrekking te hebben, samenvallen, de betaling van het
      weduwepensioen, onderscheidenlijk het wezenpensioen iedere maand beperkt naar reden van 2 percent van de algemene
      nabestaandenuitkering, onderscheidenlijk de algemene wezenuitkering per samenvallend jaar.

      2 Indien aanspraak bestaat op een algemene nabestaandenuitkering op grond van
      [artikel 14, eerste lid, onderdeel a, van de Algemene nabestaandenwet][ref1], doch geen van de in evengenoemde
      bepaling bedoelde kinderen recht heeft op een wezenpensioen, wordt de beperking berekend naar de algemene
      nabestaandenuitkering die geldt voor degenen op wie [artikel 17, eerste lid, van de Algemene nabestaandenwet][ref2]
      toepassing vindt.

      3 Het bepaalde in [artikel 12][ref3] is van overeenkomstige toepassing.

      4 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan nadere regels stellen met betrekking tot de in de
      vorige leden bedoelde beperking te hanteren bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel14
