  - number: 19c
    text: |-
      1 Indien ter zake van het overlijden van een gepensioneerde recht op een weduwepensioen als
      bedoeld in deze regeling ontstaat, heeft de weduwe die op 1 januari 1998 de leeftijd van 55 jaar
      heeft bereikt in afwijking van [artikel 19b][ref1] recht op een toeslag voor de tijd die bij de
      berekening van het pensioen in aanmerking is genomen. Dit recht bestaat indien en voor zolang recht
      bestaat op een nabestaandenuitkering krachtens de [Algemene nabestaandenwet][ref2], die krachtens
      [artikel 67, derde of zesde lid, van de Algemene nabestaandenwet][ref3] vanaf 1 januari 1998 wordt verminderd
      wegens de omstandigheid dat de weduwe vanaf een tijdstip voor 1 juli 1996 met dezelfde persoon ononderbroken
      ongehuwd samenwoont.

      2 De toeslag, bedoeld in het eerste lid, bedraagt per pensioentellend jaar 2,5% van het verschil tussen
      75 % van de krachtens de [artikelen 14][ref4] en [30 van de Algemene nabestaandenwet][ref5] vastgestelde
      nabestaandenuitkering en de krachtens [artikel 67, derde of zesde lid, van de Algemene nabestaandenwet][ref6]
      verminderde nabestaandenuitkering. De toeslag bedraagt niet meer dan 75% van de krachtens de artikelen 14 en 30 van
      de Algemene nabestaandenwet vastgestelde nabestaandenuitkering. De toeslag wordt vanaf 1 januari 1998 vastgesteld
      met inachtneming van de bedragen vanaf die datum en wordt vervolgens telkens nader vastgesteld aan de hand van de
      ontwikkelingen van de bedragen van de [Algemene nabestaandenwet][ref7].

      3 Het recht op de toeslag, bedoeld in het eerste lid vervalt:

      a. met ingang van de eerste dag van de maand waarin de weduwe de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref8], bereikt;

      b. met ingang van de maand volgend op die waarin de weduwe trouwt of als partner wordt geregistreerd of aangemerkt;

      c. met ingang van de eerste dag van de maand waarin de vermindering van de nabestaandenuitkering, bedoeld in het
      eerste lid, ongedaan wordt gemaakt.

      4 Het [derde en vijfde lid van artikel 19b][ref9] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002507#Artikel19b
