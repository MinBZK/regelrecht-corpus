  - number: '14'
    text: |-
      1 Indien aanspraak bestaat of wordt geacht te bestaan op meer dan een pensioen en de tijdvakken, gedurende
      welke wordt geacht te zijn vervuld diensttijd, waarnaar die pensioenen worden geacht te zijn berekend, geheel
      of gedeeltelijk samenvallen, overschrijdt het totaal van de volgens de voorgaande artikelen voor elk pensioen
      berekende beperking - voor zover deze geacht kan worden betrekking te hebben op evenbedoelde samenvallende
      tijdvakken - niet het bedrag van het algemeen ouderdomspensioen dat geacht kan worden betrekking te hebben op
      meerbedoelde samenvallende tijdvakken.

      2 Indien een overschrijding als bedoeld in het vorige lid plaats zou vinden, wordt de voor ieder pensioen volgens
      de voorgaande artikelen berekende beperking, voor zover betrekking hebbende op samenvallende tijdvakken, als
      bedoeld in het vorige lid, verminderd tot een zodanig deel van het bedrag van het algemeen ouderdomspensioen,
      bedoeld aan het slot van het vorige lid, als elke onverminderde beperking zich verhoudt tot de som van die
      beperkingen.

      3 Indien het gezamenlijk bedrag van de beperking ook na toepassing van het vorige lid een bedrag gelijk aan 80
      percent van het volle algemeen ouderdomspensioen overschrijdt wordt deze overschrijding in mindering gebracht
      op elk van de beperkingen in de verhouding waarin het bedrag van elk van die beperkingen staat tot de som dier
      beperkingen.

      4 Indien aanspraak bestaat of geacht wordt te bestaan op een pensioen en tevens aanspraak op een ander pensioen
      bestaat of voor de toepassing van met dit hoofdstuk overeenkomende bepalingen van de regeling, waarop dat andere
      pensioen berust, geacht wordt te bestaan, vindt het bepaalde in de vorige leden overeenkomstige toepassing met dien
      verstande dat indien het betreft pensioenen, toegekend krachtens de Pensioenwet voor het personeel der Koninklijke
      marinereserve 1923 of de Pensioenwet voor het reserve-personeel der landmacht 1923, voor de toepassing van dit
      artikel niet als diensttijd geldt de tijd, welke krachtens de artikelen 15 van genoemde wetten met vier pro mille
      van de pensioengrondslag is vergolden.

      5 Op aanvraag van degene die aantoont dat aanspraak bestaat op een of meer pensioenen of andere pensioenen
      toekomende aan de echtgenoot wordt dit artikel overeenkomstig toegepast, zulks met ingang van de dag waarop
      bedoelde omstandigheid is opgetreden, doch niet eerder dan een jaar voor de eerste dag van de maand waarin de
      desbetreffende aanvraag werd ingediend. De aanvraag moet worden gericht tot de Stichting Administratie Indonesische
      Pensioenen.
    url: https://wetten.overheid.nl/BWBR0002507/2015-01-01#Artikel14
  - number: '15'
    text: |-
      1 Op schriftelijk verzoek van degene, die aantoont, dat uit hoofde van zijn aanspraak op algemeen ouderdomspensioen
      mede een vermindering plaats vindt van een andere pensioenuitkering, wordt, voor zover de tijdvakken, gedurende
      welke wordt geacht te zijn vervuld de diensttijd, waarnaar het pensioen en de andere pensioenuitkering worden
      geacht te zijn berekend, samenvallen, het bedrag van die vermindering voor zoveel mogelijk in mindering gebracht
      op het bedrag van de beperking van het pensioen, zulks met ingang van de dag waarop bedoelde omstandigheid is
      opgetreden, doch niet vroeger dan een jaar voor de eerste dag van de maand, waarin het desbetreffende verzoek werd
      ingediend.

      2 Ten aanzien van de vaststelling van het tijdvak, gedurende hetwelk wordt geacht te zijn vervuld diensttijd,
      terzake waarvan een andere pensioenuitkering is toegekend, is het bepaalde in [artikel 10 onder ][ref1] van
      overeenkomstige toepassing. Indien een pensioenuitkering niet of niet uitsluitend is berekend naar diensttijd,
      wordt deze geacht te zijn berekend naar een diensttijd, die zich verhoudt tot veertig jaren, zoals het bedrag
      van die pensioenuitkering zich verhoudt tot het bedrag van die uitkering, indien het zou zijn berekend naar een
      diensttijd van 40 jaren.

      3 Bij toepassing van het eerste lid wordt, ingeval aanspraak bestaat of wordt geacht te bestaan op meer dan een
      pensioen, het bedrag van de in dat lid bedoelde vermindering op de overeenkomstig de voorgaande artikelen berekende
      beperkingen dier pensioenen in mindering gebracht naar verhouding van de bedragen dier beperkingen.

      4 Indien de beperking van het pensioen reeds is verminderd krachtens het bepaalde in [artikel 12][ref2],
      vindt het eerste lid slechts toepassing voor zover zulks nodig is om te voorkomen, dat de som van evenbedoelde
      beperking en de vermindering, bedoeld in het eerste lid, zou overschrijden het bedrag van de beperking, indien
      [artikel 12][ref3] geen toepassing zou hebben gevonden. De voorgaande volzin is van overeenkomstige toepassing in
      het geval bedoeld in het derde lid.

      5 Indien de som van het bedrag, waarmee de uitbetaling van een pensioen ingevolge deze wet zou dienen te worden
      beperkt en het bedrag van de vermindering van een andere pensioenuitkering een bedrag gelijk aan 80 percent van het
      volle algemeen ouderdomspensioen zou overschrijden, wordt van deze overschrijding een deel in mindering gebracht
      op het bedrag van de beperking en wel in de verhouding waarin de diensttijd, waarnaar het pensioen wordt geacht te
      zijn berekend, staat tot het totaal van de diensttijden.

      6 Het eerste tot en met het vijfde lid is van overeenkomstige toepassing indien uit hoofde van aanspraak op
      algemeen ouderdomspensioen een vermindering plaatsvindt van een andere pensioenuitkering toekomend aan de
      echtgenoot van degene voor wie aanspraak bestaat of geacht wordt te bestaan op pensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0002507#Artikel10
