  - number: 9a
    text: |-
      Voor de toepassing van deze wet wordt onder het algemeen ouderdomspensioen van een rechthebbende die de
      pensioengerechtigde leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], reeds
      heeft bereikt mede begrepen het algemeen ouderdomspensioen waarop zijn echtgenoot recht heeft, tenzij het echtpaar
      duurzaam gescheiden leeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002507/2015-01-01#Artikel9a
