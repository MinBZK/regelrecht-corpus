  - number: '27'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties is bevoegd in bijzondere gevallen, waarin de toepassing
      van deze wet tot een naar zijn oordeel onredelijke uitkomst leidt, ten gunste van de belanghebbende een beslissing
      te nemen, die met de strekking van deze wet overeenkomt.
    url: https://wetten.overheid.nl/BWBR0002507/2015-01-01#Artikel27
  - number: 27a
    text: |-
      1 Indien degene die recht heeft op een pensioen, ingevolge het bepaalde bij of krachtens de
      [Wet langdurige zorg][ref1] een bijdrage verschuldigd is in de kosten van zorg, is Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties bevoegd het pensioen en de daarop verleende toeslagen tot ten hoogste het bedrag van
      die bijdrage in de plaats van aan de rechthebbende zonder diens machtiging uit te betalen aan het Zorginstituut
      Nederland, genoemd in [artikel 58, eerste lid, van de Zorgverzekeringswet][ref2].

      2 Artikel 10 van de wet van 25 mei 1962 (*Stb.* 196) is niet van toepassing op een ingevolge het vorige lid genomen
      beslissing.


      [ref1]: https://wetten.overheid.nl/BWBR0035917
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel58
    url: https://wetten.overheid.nl/BWBR0002507/2015-01-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0035917
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '58'
  - number: '29'
    text: |-
      1 Door de leden van het Bijstandkorps dient tenzij bij algemene maatregel van bestuur anders wordt bepaald, 8,5
      % van 87,5 % van de onverminderde maandelijke inkomsten, niet inbegrepen de kindertoelage, waarop zij als zodanig
      aanspraak hebben, aan 's Rijks Kas te worden bijgedragen, met dien verstande dat 2,5 % geldt als bijdrage voor het
      eigen pensioen en 6 % als bijdrage voor de weduwen- en wezenpensioenen.

      2 Ingeval inhouding van de in het eerste lid bedoelde bijdrage op de maandelijkse inkomsten van het lid van het
      Bijstandkorps niet mogelijk is, vindt verhaal daarvan plaats overeenkomstig het bepaalde in artikel 6 van het
      pensioenreglement, met dien verstande dat de bijdrage voor de weduwen- en wezenpensioenen tevens verhaalbaar is op
      het eigen pensioen.
    url: https://wetten.overheid.nl/BWBR0002507/2015-01-01#Artikel29
  - number: '30'
    text: |-
      1 Voor de toepassing van artikel 16, derde lid, van het pensioenreglement wordt na 31 december 1962 geen rekening
      gehouden met een beperking van de uitbetaling van een pensioen krachtens het bepaalde in de vierde afdeling.

      2 Met ingang van 1 januari 1995 wordt geen toepassing gegeven aan artikel 17 van het pensioenreglement.
    url: https://wetten.overheid.nl/BWBR0002507/2015-01-01#Artikel30
  - number: '32'
    text: Bij algemene maatregel van bestuur kunnen nadere regelen worden gesteld voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0002507/2015-01-01#Artikel32
  - number: '33'
    text: 'Deze wet kan worden aangehaald als: Wet aanpassing pensioenvoorzieningen Bijstandkorps.'
    url: https://wetten.overheid.nl/BWBR0002507/2015-01-01#Artikel33
  - number: '34'
    text: |-
      1 Deze wet treedt in werking met ingang van de tweede dag na die van uitgifte van het *Staatsblad* waarin zij wordt
      geplaatst en werkt, behoudens het bepaalde in het volgende lid, terug tot 1 januari 1963.

      2 [Artikel 28][ref1] werkt terug tot 1 oktober 1962; de [artikelen 7][ref2] en [29][ref3] werken terug tot 1
      januari 1964.


