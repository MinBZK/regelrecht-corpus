  - number: 19d
    text: |-
      Bij gelijktijdige aanspraak op meerdere pensioenen of uitkeringen waarop een naar aard en strekking soortgelijke
      toeslag wordt verleend als bedoeld in de [artikelen 19b][ref1] en [19c][ref2], wordt de in die artikelen bedoelde
      toeslag zodanig verminderd, dat het totaal van de toeslagen gelijk is aan de maximaal op grond van genoemde
      artikelen toe te kennen toeslag.


      [ref1]: https://wetten.overheid.nl/BWBR0002507#Artikel19b
      [ref2]: https://wetten.overheid.nl/BWBR0002507#Artikel19c
