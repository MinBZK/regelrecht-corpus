  - number: '11'
    text: |-
      1 Indien een tijdvak, waarop het algemeen ouderdomspensioen moet worden geacht betrekking te hebben, geheel of
      gedeeltelijk samenvalt met een tijdvak, gedurende hetwelk wordt geacht te zijn vervuld diensttijd, waarnaar een
      pensioen wordt geacht te zijn berekend, wordt voor iedere maand gedurende welke aanspraak bestaat op algemeen
      ouderdomspensioen en op pensioen, de uitbetaling van het pensioen beperkt.

      2 De beperking wordt gesteld op een bedrag gelijk aan het bedrag van het algemeen ouderdomspensioen dat geacht kan
      worden betrekking te hebben op het tijdvak, gedurende hetwelk wordt geacht te zijn vervuld diensttijd, waarnaar een
      pensioen wordt geacht te zijn berekend, met dien verstande, dat:

      a. indien een gehuwde vrouw die niet duurzaam gescheiden leeft van haar echtgenoot aanspraak heeft op een
      eigen pensioen, wordt uitgegaan van het algemeen ouderdomspensioen voor een ongehuwde, dan wel van het algemeen
      ouderdomspensioen voor een gehuwde als dit laatste pensioen minder bedraagt;

      b. indien het algemeen ouderdomspensioen is toegekend aan een ongehuwde die een kind heeft jonger dan 18 jaar,
      dat niet als eigen kind, aangehuwd kind of pleegkind tot het huishouden van een ander behoort en voor wie op grond
      van de Kinderbijslagwet kinderbijslag is ontvangen, wordt uitgegaan van een algemeen ouderdomspensioen van een
      ongehuwde pensioengerechtigde;

      c. de overlijdensuitkering die op grond van de [Algemene Ouderdomswet][ref1] is uitbetaald, buiten beschouwing
      wordt gelaten.

      3 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan nadere regels stellen met betrekking tot de in de
      vorige leden bedoelde beperking te hanteren bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0002507/2015-01-01#Artikel11
