  - number: 13b.1
    text: |-
      De burgemeester is bevoegd tot toepassing van bestuursdwang indien in voor het publiek toegankelijke lokalen en
      daarbij behorende erven een middel als bedoeld in [artikel 2][ref1] of 3 wordt verkocht, afgeleverd of verstrekt
      dan wel daartoe aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
  - number: 13b.2
    text: |-
      Het eerste lid is niet van toepassing indien de desbetreffende lokalen gebruikt worden ter uitoefening van de
      artsenijbereidkunst, de geneeskunst, de tandheelkunst of de diergeneeskunde door onderscheidenlijk apothekers,
      artsen, tandartsen en dierenartsen.
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel13b
  - number: 13b.3
    text: |-
      Indien de burgemeester op grond van het eerste lid een besluit tot sluiting van het desbetreffende lokaal of
      erf heeft genomen, doet hij het besluit zo spoedig mogelijk inschrijven in de openbare registers, bedoeld in
      [artikel 16 van Boek 3 van het Burgerlijk Wetboek][ref1]. [Artikel 24][ref2] van dat boek is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel24
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '24'
  - number: '14'
    text: Deze wet kan worden aangehaald onder de titel "Opiumwet".
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel14
  - number: '15'
    text: |-
      Deze wet treedt in werking met ingang van een door Ons te bepalen dag. Op dat tijdstip vervalt de wet van 4 oktober
      1919, *Stb.* nr. 592, houdende vaststelling van bepalingen, betreffende het opium en andere verdovende middelen,
      zoals deze wet gewijzigd is bij de wet van 29 juni 1925, *Stb.* nr. 308.
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel15
