---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: opiumwet
regulatory_layer: WET
publication_date: '2003-04-17'
valid_from: '2002-10-01'
bwb_id: BWBR0001941
url: https://wetten.overheid.nl/BWBR0001941/2002-10-01
preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien, of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het noodzakelijk is, de bepalingen betreffende het opium en andere
    verdoovende middelen in overeenstemming te brengen met de bepalingen van het op 19 Februari 1925 te Genève tusschen
    Nederland en andere Staten gesloten internationale opiumverdrag;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Volksgezondheid en Milieuhygiëne;'
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel1
  - number: 1.1.b
    text: |-
      substantie: stof van menselijke, dierlijke, plantaardige of chemische oorsprong, daaronder begrepen dieren,
      planten, delen van dieren of planten, alsmede micro-organismen;
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel1
  - number: 1.1.c
    text: 'preparaat: een vast of vloeibaar mengsel van substanties;'
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel1
  - number: 1.1.d
    text: 'middel: substantie of preparaat;'
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel1
  - number: 1.1.e
    text: |-
      Enkelvoudig Verdrag: het op 30 maart 1961 te New York tot stand gekomen Enkelvoudig Verdrag inzake verdovende
      middelen (*Trb.* 1963, 81), zoals gewijzigd bij het op 25 maart 1972 te Genève tot stand gekomen Protocol tot
      wijziging van dat verdrag (*Trb.* 1987, 90);
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel1
  - number: 1.1.f
    text: |-
      Psychotrope Stoffen Verdrag: het op 21 februari 1971 te Wenen tot stand gekomen Verdrag inzake psychotrope stoffen
      (*Trb.* 1989, 129).
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel1
  - number: '1.2'
    text: |-
      Voor toepassing van deze wet en de daarop berustende bepalingen worden de zouten van de substanties met die
      substanties gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel1
  - number: '1.3'
    text: Voor de toepassing van deze wet wordt onder vervaardigen begrepen raffineren en omzetten.
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel1
  - number: '1.4'
    text: |-
      Onder binnen het grondgebied van Nederland brengen van middelen, bedoeld in de [artikelen 2][ref1] en [3][ref2],
      is begrepen: het binnen het grondgebied van Nederland brengen van de voorwerpen of goederen, waarin die middelen
      verpakt of geborgen zijn en elke op het verder vervoer, de opslag, de aflevering, ontvangst of overdracht gerichte
      handeling, met betrekking tot die middelen, die binnen het grondgebied van Nederland zijn gebracht, of tot de
      voorwerpen of goederen, waarin die middelen verpakt of geborgen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '3'
  - number: '1.5'
    text: |-
      Onder buiten het grondgebied van Nederland brengen van middelen, bedoeld in de [artikelen 2][ref1] en [3][ref2],
      is begrepen: het buiten het grondgebied van Nederland brengen van de voorwerpen of goederen, waarin die middelen
      verpakt of geborgen zijn en het met bestemming naar het buitenland vervoeren, ten vervoer aannemen of ten vervoer
      aanbieden, het ten uitvoer dan wel ten wederuitvoer aangeven, daaronder begrepen het in kennis stellen van de
      wederuitvoer, in de zin van [verordening (EEG) nr. 2913/92](31992R2913) van de Raad van de Europese Gemeenschappen
      van 12 oktober 1992 tot vaststelling van het communautair douanewetboek (*PbEG* L 302) of het in, op of aan een
      naar het buitenland bestemd vaar-, voer- of luchtvaartuig aanwezig hebben van die middelen, of van die voorwerpen
      of goederen.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '3'
  - number: '2.1'
    text: |-
      Het is verboden de middelen, vermeld op de bij deze wet behorende lijst I, dan wel aangewezen krachtens het tweede
      of derde lid:
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel2
  - number: 2.1.A
    text: binnen of buiten het grondgebied van Nederland te brengen;
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel2
  - number: 2.1.B
    text: te bereiden, te bewerken, te verwerken, te verkopen, af te leveren, te verstrekken of te vervoeren;
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel2
  - number: 2.1.C
    text: aanwezig te hebben;
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel2
  - number: 2.1.D
    text: te vervaardigen.
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel2
  - number: '2.2'
    text: 'Bij algemene maatregel van bestuur kunnen worden aangewezen:'
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel2
  - number: 2.2.a
    text: |-
      bewustzijnsbeïnvloedende middelen, welke bij aanwending bij de mens kunnen leiden tot schade voor zijn gezondheid
      en schade voor de samenleving;
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel2
  - number: 2.2.b
    text: middelen, welke onder de werking van het Enkelvoudig Verdrag of van het Psychotrope Stoffen Verdrag zijn gebracht.
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel2
  - number: '2.3'
    text: |-
      Indien aanwijzing van een middel krachtens het tweede lid in overweging is, en naar het oordeel van Onze Minister
      een onverwijlde voorziening is vereist, kan aanwijzing geschieden bij besluit van Onze Minister. Dit besluit
      blijft, behoudens eerdere intrekking, van kracht, totdat de algemene maatregel van bestuur waarbij het betreffende
      middel wordt aangewezen, in werking treedt, doch uiterlijk tot een jaar na het in werking treden van het besluit.
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel2
  - number: '2.4'
    text: Een besluit ingevolge het derde lid wordt geplaatst in de Nederlandse Staatscourant.
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel2
  - number: '3.1'
    text: 'Het is verboden de middelen, vermeld op de bij deze wet behorende lijst II:'
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel3
  - number: 3.1.A
    text: binnen of buiten het grondgebied van Nederland te brengen;
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel3
  - number: 3.1.B
    text: te telen, te bereiden, te bewerken, te verwerken, te verkopen, af te leveren, te verstrekken of te vervoeren;
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel3
  - number: 3.1.C
    text: aanwezig te hebben;
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel3
  - number: 3.1.D
    text: te vervaardigen.
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel3
  - number: '3.2'
    text: |-
      Lijst II kan ten aanzien van middelen welke onder de werking van het Psychotrope Stoffen Verdrag zijn gebracht, bij
      algemene maatregel van bestuur worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel3
  - number: 3a.1
    text: |-
      Bij algemene maatregel van bestuur kunnen middelen en toepassingen worden aangewezen, waarvoor de in de
      [artikelen 2][ref1] en [3][ref2] omschreven verboden geheel of ten dele niet gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '3'
  - number: 3a.2
    text: |-
      Bij algemene maatregel van bestuur kunnen met betrekking tot de in de [artikelen 2][ref1] en [3][ref2] bedoelde
      middelen voorschriften worden gegeven om naleving van de bepalingen van het Enkelvoudig Verdrag en van het
      Psychotrope Stoffen Verdrag te verzekeren of om misbruik van die middelen te voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '3'
  - number: 3b.1
    text: |-
      Elke openbaarmaking, welke er kennelijk op is gericht de verkoop, aflevering of verstrekking van een middel als
      bedoeld in [artikel 2][ref1] of [artikel 3][ref2] te bevorderen, is verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '3'
  - number: 3b.2
    text: |-
      Het in het eerste lid vervatte verbod geldt niet ter zake van openbaarmaking in het kader van medische of
      wetenschappelijke voorlichting.
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel3b
  - number: '4.1'
    text: |-
      Het is verboden een middel als bedoeld in [artikel 2, eerste lid][ref1], of 3, voor te schrijven op recept, tenzij
      het middel daartoe, in het belang van de volksgezondheid, is aangewezen bij algemene maatregel van bestuur. Bij
      de maatregel kunnen voorschriften worden gesteld ter zake van het recept en het doel waarvoor een middel wordt
      voorgeschreven. Een krachtens de eerste volzin vastgestelde algemene maatregel van bestuur treedt niet eerder
      in werking dan acht weken na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing
      wordt onverwijld mededeling gedaan aan de beide kamers der Staten-Generaal. In het belang van de volksgezondheid
      kan, in afwijking van de eerste volzin, bij ministeriële regeling een middel worden aangewezen dat mag worden
      voorgeschreven op recept, zolang het middel tevens is aangewezen krachtens [artikel 2, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel2
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '2'
  - number: '4.2'
    text: |-
      Het bestellen van enig middel, in de [artikelen 2][ref1] en [3][ref2] bedoeld, door houders van een verlof,
      bedoeld in het [eerste lid van artikel 6][ref3], en door apothekers, apotheekhoudende artsen en dierenartsen,
      bedoeld in het [tweede lid van artikel 6][ref4], mag slechts geschieden met inachtneming van nader door Onze
      Minister te geven voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0001941#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0001941#Artikel6
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0001941
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0001941
        artikel: '6'
  - number: '4.3'
    text: |-
      Het is verboden ter verkrijging van enig middel, in de [artikelen 2][ref1] en [3][ref2] bedoeld:


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '3'
  - number: 4.3.a
    text: een vals of vervalst recept aan te bieden;
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel4
  - number: 4.3.b
    text: |-
      een recept aan te bieden, waarin een andere naam of een ander adres is vermeld dan de naam of het adres van degene
      te wiens behoeve het recept is voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel4
  - number: '4.4'
    text: |-
      Het is een persoon ten aanzien van wie een in [artikel 6, vijfde lid][ref1], bedoeld besluit geldt, verboden enig
      middel, in de [artikelen 2][ref2] en [3][ref3] bedoeld, voor te schrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0001941
        artikel: '3'
  - number: '5.1'
    text: |-
      Het verbod, gesteld in [artikel 2, eerste lid][ref1], A, en het verbod, gesteld in [artikel 3, eerste lid][ref2],
      A, is niet van toepassing in geval het brengen binnen of buiten het grondgebied van Nederland geschiedt met
      verlof van Onze Minister en met inachtneming van de door of vanwege Onze Minister te geven voorschriften. Deze
      voorschriften kunnen verschillen voor de onderscheidene middelen, in die artikelen bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '3'
  - number: '5.2'
    text: |-
      Voor een in het eerste lid bedoeld verlof kan een vergoeding worden geheven volgens een tarief, overeenkomstig bij
      algemene maatregel van bestuur te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel5
  - number: '6.1'
    text: |-
      Onverminderd de bij algemene maatregel van bestuur gestelde voorschriften ter zake van de aflevering van
      Opiumwetmiddelen op recept, is een verbod als bedoeld in artikel 2, eerste lid, onder B, C en D, en in
      [artikel 3, eerste lid, onder B, C en D][ref1], niet van toepassing voor zover Onze Minister schriftelijk verlof
      heeft gegeven tot het verrichten van een in die bepalingen bedoelde handeling. Voor een verlof kan een jaarlijkse
      vergoeding worden geheven volgens een tarief dat overeenkomstig bij algemene maatregel van bestuur te stellen
      regels wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '3'
  - number: '6.2'
    text: |-
      Een verbod als bedoeld in artikel 2, eerste lid, onder B en C, en in [artikel 3, eerste lid, onder B en C][ref1],
      is tevens niet van toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '3'
  - number: 6.2.a
    text: |-
      ten aanzien van gevestigde apothekers en apotheekhoudende artsen, indien zij krachtens
      [artikel 4, eerste lid][ref1], aangewezen middelen voor geneeskundige doeleinden bereiden, bewerken, verwerken,
      verkopen, afleveren, verstrekken, vervoeren of aanwezig hebben en deze werkzaamheden geschieden binnen de normale
      beroepsuitoefening;


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel4
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '4'
  - number: 6.2.b
    text: |-
      ten aanzien van dierenartsen, indien zij krachtens [artikel 4, eerste lid][ref1], aangewezen middelen voor
      diergeneeskundige doeleinden verkopen, afleveren, verstrekken, vervoeren of aanwezig hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel4
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '4'
  - number: '6.3'
    text: |-
      Onverlet de bij algemene maatregel van bestuur gegeven voorschriften, zijn de verboden, voor zoveel betreft het
      verstrekken en het vervoeren, gesteld in [artikel 2, eerste lid][ref1], B, en in [artikel 3, eerste lid][ref2],
      B, en de verboden, gesteld in [artikel 2, eerste lid][ref3], C, en in [artikel 3, eerste lid][ref4], C, mede niet
      van toepassing op bij vorenbedoelde maatregel aangewezen instellingen en op hen die aantonen dat zij de in dat
      artikel bedoelde middelen in de bevonden hoeveelheid tot uitoefening van de geneeskunst, de tandheelkunst, of van
      de diergeneeskunst dan wel voor eigen geneeskundig gebruik behoeven of krachtens wettelijk voorschrift in voorraad
      moeten hebben en langs wettige weg verkregen hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0001941
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0001941
        artikel: '3'
  - number: '6.4'
    text: |-
      De in de [artikelen 2][ref1] en [3][ref2] gestelde verboden met betrekking tot het vervoeren en het aanwezig
      hebben zijn mede niet van toepassing op hen die aantonen dat zij de middelen vervoeren in opdracht van een daartoe
      bevoegde.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '3'
  - number: '6.5'
    text: |-
      Indien een persoon bevoegd tot het afleveren onderscheidenlijk tot het voorschrijven van de in de artikelen
      2en [3][ref1] bedoelde middelen wegens het niet naleven van een krachtens dit artikel gegeven voorschrift bij
      herhaling is veroordeeld, kan Onze Minister, gehoord de door Ons aangewezen hoofdinspecteurs van het Staatstoezicht
      op de Volksgezondheid, bepalen dat het tweede onderscheidenlijk derde lid voor die persoon niet meer geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '3'
  - number: '6.6'
    text: |-
      Een beschikking als bedoeld in het vijfde lid, geldt voor een termijn van ten hoogste vier jaren. Van de
      beschikking wordt mededeling gedaan aan degenen die bevoegd zijn tot afleveren van de in de [artikelen 2][ref1] en
      [3][ref2] bedoelde middelen.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '3'
  - number: '7.1'
    text: |-
      Onze Minister kan een verlof als bedoeld in [artikel 6, eerste lid][ref1], slechts verlenen:


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel6
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '6'
  - number: 7.1.a
    text: |-
      aan personen of instellingen die ten genoegen van Onze Minister aantonen dat zij het verlof nodig hebben voor
      wetenschappelijke of instructieve doeleinden;
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel7
  - number: 7.1.b
    text: 'voorzover het belang van de volksgezondheid zulks vordert:'
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel7
  - number: 7.1.b.1°
    text: |-
      aan hen die in het bezit zijn van een uitsluitend tot het afleveren van geneesmiddelen verleende vergunning als
      bedoeld in [artikel 2, eerste lid, onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel2
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '2'
  - number: 7.1.b.2°
    text: |-
      aan hen die in het bezit zijn van een vergunning tot het bereiden van geneesmiddelen en het afleveren daarvan
      als bedoeld in [artikel 2, eerste lid, onder ][ref1] en ten genoegen van Onze Minister aantonen dat zij de in
      de [artikelen 2][ref2] en [3][ref3] bedoelde middelen zullen vervaardigen in uitsluitend daartoe aangewezen en
      nauwkeurig omschreven lokaliteiten;


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0001941
        artikel: '3'
  - number: 7.1.b.3°
    text: |-
      aan anderen, ten behoeve van de Staat, in geval van oorlog, oorlogsgevaar, daaraan verwante of daarmee verband
      houdende buitengewone omstandigheden.
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel7
  - number: 7.1.c
    text: |-
      voor zover het belang van de gezondheid van dieren zulks vordert aan hen die in het bezit zijn van een vergunning,
      bedoeld in [artikel 21, eerste lid, van de Diergeneesmiddelenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
  - number: '7.2'
    text: |-
      Een verlof kan worden verleend onder beperkingen. Aan een verlof kunnen voorschriften worden verbonden om
      naleving van de bepalingen van het Enkelvoudig Verdrag en van de bij of krachtens deze wet gestelde bepalingen te
      verzekeren, of om misbruik van de middelen, waarop een verlof betrekking heeft, te voorkomen.
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel7
  - number: '7.3'
    text: 'Een verlof kan worden ingetrokken indien:'
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel7
  - number: 7.3.a
    text: het belang van de volksgezondheid zulks vordert;
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel7
  - number: 7.3.b
    text: |-
      de houder van het verlof handelt in strijd met de bij of krachtens deze wet gegeven voorschriften of met de aan het
      verlof verbonden voorschriften.
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel7
  - number: '7.4'
    text: |-
      De intrekking geschiedt bij een beschikking van Onze Minister; daarbij kan een termijn worden gesteld, binnen
      welke de handelaar of de fabrikant zich van zijn vóór de intrekking op wettige wijze verkregen voorraad zal kunnen
      ontdoen met inachtneming van de voorschriften door Onze Minister te stellen.
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel7
  - number: 7a
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de ambtenaren van het
      Staatstoezicht op de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel7a
  - number: '8'
    text: |-
      Met het opsporen van de feiten, strafbaar gesteld in deze wet zijn, behalve de bij of krachtens
      [artikel 141 van het Wetboek van Strafvordering][ref1] aangewezen personen, belast de ambtenaren van de
      rijksbelastingdienst, bevoegd inzake douane.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '9.1'
    text: 'De opsporingsambtenaren hebben, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is, toegang:'
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel9
  - number: 9.1.a
    text: |-
      tot de vervoermiddelen, met inbegrip van woongedeelten, waarvan hun bekend is, of waarvan redelijkerwijze door hen
      kan worden vermoed, dat daarmede ingevoerd of vervoerd worden of dat daarin, daarop of daaraan bewaard worden of
      aanwezig zijn middelen, bedoeld in de [artikelen 2][ref1] of [3, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '3'
  - number: 9.1.b
    text: |-
      tot de plaatsen, waar een overtreding van deze wet gepleegd wordt of waar redelijkerwijze vermoed kan worden, dat
      zodanige overtreding gepleegd wordt.
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel9
  - number: '9.2'
    text: |-
      Zij zijn bevoegd een persoon, verdacht van een bij deze wet als misdrijf strafbaar gesteld feit, bij het bestaan
      van ernstige bezwaren tegen deze, aan de kleding te onderzoeken.
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel9
  - number: '9.3'
    text: |-
      Zij zijn te allen tijde bevoegd tot inbeslagneming van daarvoor vatbare voorwerpen. Zij kunnen daartoe hun
      uitlevering vorderen.
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel9
  - number: '9.4'
    text: |-
      De officier van justitie of de hulpofficier van justitie voor wie de verdachte wordt geleid of die zelf
      de verdachte heeft aangehouden is bevoegd een persoon die zojuist binnen het grondgebied van Nederland is
      binnengekomen of die op het punt staat dit grondgebied te verlaten, en die is aangehouden terzake van een bij deze
      wet als misdrijf strafbaar gesteld feit, een vordering te geven tot medewerking aan een urineonderzoek, gericht op
      het aantonen van de aanwezigheid in het lichaam van middelen als bedoeld in [artikel 2][ref1] of 3, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
  - number: '10.1'
    text: 'Hij die handelt in strijd met:'
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel10
  - number: 10.1.a
    text: |-
      een in [artikel 2, eerste lid][ref1], het in [artikel 3][ref2], of een in [artikel 4, derde of vierde lid][ref3],
      gegeven verbod;


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel3b
      [ref3]: https://wetten.overheid.nl/BWBR0001941#Artikel4
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: 3b
      - id: ref3
        bwb_id: BWBR0001941
        artikel: '4'
  - number: 10.1.b
    text: |-
      een der krachtens [artikel 3][ref1], [artikel 4, eerste of tweede lid][ref2], [artikel 5, eerste lid][ref3], of
      [artikel 6, tweede of derde lid][ref4], gegeven voorschriften;


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0001941#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0001941#Artikel6
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: 3a
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0001941
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0001941
        artikel: '6'
  - number: 10.1.c
    text: |-
      een der voorschriften verbonden aan een verlof als bedoeld in [artikel 6][ref1] of gesteld bij de beschikking tot
      intrekking als bedoeld in [artikel 7][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel7
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '7'
  - number: '10.2'
    text: |-
      Hij die opzettelijk handelt in strijd met het in [artikel 2, eerste lid, onder C][ref1], het in [artikel 3][ref2],
      of het in [artikel 4, derde lid][ref3], gegeven verbod, wordt gestraft met gevangenisstraf van ten hoogste vier
      jaren of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel3b
      [ref3]: https://wetten.overheid.nl/BWBR0001941#Artikel4
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: 3b
      - id: ref3
        bwb_id: BWBR0001941
        artikel: '4'
  - number: '10.3'
    text: |-
      Hij die opzettelijk handelt in strijd met het in [artikel 2, eerste lid, onder B of D][ref1], gegeven verbod, wordt
      gestraft met gevangenisstraf van ten hoogste acht jaren of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
  - number: '10.4'
    text: |-
      Hij die opzettelijk handelt in strijd met een in [artikel 2, eerste lid, onder A][ref1], gegeven verbod, wordt
      gestraft met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
  - number: '10.5'
    text: |-
      Indien het feit, bedoeld in het tweede onderscheidenlijk het vierde lid, betrekking heeft op een geringe
      hoeveelheid, bestemd voor eigen gebruik, wordt gevangenisstraf van ten hoogste een jaar of geldboete van de derde
      categorie opgelegd.
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel10
  - number: 10a.1
    text: |-
      Hij die om een feit, bedoeld in het [derde of vierde lid van artikel 10][ref1], voor te bereiden of te bevorderen:


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel10
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '10'
  - number: 10a.1.1°
    text: |-
      een ander tracht te bewegen om dat feit te plegen, te doen plegen, mede te plegen of uit te lokken, om daarbij
      behulpzaam te zijn of om daartoe gelegenheid, middelen of inlichtingen te verschaffen,
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel10a
  - number: 10a.1.2°
    text: zich of een ander gelegenheid, middelen of inlichtingen tot het plegen van dat feit tracht te verschaffen,
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel10a
  - number: 10a.1.3°
    text: |-
      voorwerpen, vervoermiddelen, stoffen, gelden of andere betaalmiddelen voorhanden heeft, waarvan hij weet of
      ernstige reden heeft om te vermoeden dat zij bestemd zijn tot het plegen van dat feit,
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel10a
  - number: 10a.2
    text: |-
      Niet strafbaar is hij die de in het eerste lid omschreven feiten begaat met betrekking tot het binnen of buiten het
      grondgebied van Nederland brengen van een geringe hoeveelheid, bestemd voor eigen gebruik.
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel10a
  - number: '11.1'
    text: |-
      Hij die handelt in strijd met een in [artikel 3][ref1] gegeven verbod, wordt gestraft met hechtenis van ten hoogste
      een maand of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '3'
  - number: '11.2'
    text: |-
      Hij die opzettelijk handelt in strijd met een in [artikel 3, eerste lid onder B, C of D][ref1], gegeven verbod,
      wordt gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '3'
  - number: '11.3'
    text: |-
      Hij die in de uitoefening van een beroep of bedrijf opzettelijk handelt in strijd met een in
      [artikel 3, eerste lid, onder B][ref1], gegeven verbod, wordt gestraft met gevangenisstraf van ten hoogste vier
      jaren of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '3'
  - number: '11.4'
    text: |-
      Hij die opzettelijk handelt in strijd met een in [artikel 3, eerste lid onder A][ref1], gegeven verbod, wordt
      gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '3'
  - number: '11.5'
    text: |-
      Het tweede lid is niet van toepassing, indien het feit betrekking heeft op een hoeveelheid van de in onderdeel b
      van de in [artikel 3, eerste lid][ref1], bedoelde lijst vermelde middelen van ten hoogste 30 gram.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '3'
  - number: '11.6'
    text: |-
      Het tweede en vierde lid zijn niet van toepassing, indien het feit betrekking heeft op een geringe hoeveelheid,
      bestemd voor eigen gebruik, van de in onderdeel a van de in [artikel 3, eerste lid][ref1], bedoelde lijst vermelde
      middelen.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '3'
  - number: '12'
    text: |-
      Indien de waarde der zaken, waarmee of met betrekking tot welke de feiten, strafbaar gesteld
      in de [artikelen 10, eerste, tweede, derde en vierde lid][ref1], [10a, eerste lid][ref2], en
      [11, tweede, derde en vierde lid][ref3], zijn begaan, of die geheel of gedeeltelijk door middel van die feiten zijn
      verkregen, hoger is dan het vierde gedeelte van het maximum der geldboete op die feiten gesteld, kan, ook indien
      het feit door een natuurlijke persoon is begaan, een geldboete van de naast hogere categorie worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0001941#Artikel11
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: 10a
      - id: ref3
        bwb_id: BWBR0001941
        artikel: '11'
  - number: '13.1'
    text: |-
      De in [artikel 10, eerste lid][ref1], en [artikel 11, eerste lid][ref2], strafbaar gestelde feiten zijn
      overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel11
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '11'
  - number: '13.2'
    text: |-
      De in artikel 10, tweede, derde, vierde en vijfde lid, in artikel 10*a*, eerste lid, en in artikel 11, tweede,
      derde en vierde lid, strafbaar gestelde feiten zijn misdrijven.
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel13
  - number: '13.3'
    text: 'De Nederlandse strafwet is toepasselijk op ieder die zich buiten Nederland schuldig maakt aan:'
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel13
  - number: 13.3.a
    text: |-
      een der in [artikel 10][ref1], strafbaar gestelde feiten voorzover die zijn gepleegd om het in
      [artikel 10, vierde lid][ref2], strafbaar gestelde feit voor te bereiden of te bevorderen, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel10
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: 10a
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '10'
  - number: 13.3.b
    text: |-
      poging tot of deelneming aan het in [artikel 10, vierde lid][ref1], strafbaar gestelde feit.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel10
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '10'
  - number: 13a
    text: |-
      Onverminderd het bepaalde in de [artikelen 33][ref1] tot en met [35][ref2] en [36][ref3] tot en met [36][ref4]
      worden de in de [artikelen 2][ref5] en [3][ref6] bedoelde middelen verbeurd of aan het verkeer onttrokken
      verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel36b
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel36d
      [ref5]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref6]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2002-10-01#Artikel13a
