preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien, of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het noodzakelijk is, de bepalingen betreffende het opium en andere
    verdoovende middelen in overeenstemming te brengen met de bepalingen van het op 19 Februari 1925 te Genève tusschen
    Nederland en andere Staten gesloten internationale opiumverdrag;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel1
  - number: 1.1.b
    text: |-
      substantie: stof van menselijke, dierlijke, plantaardige of chemische oorsprong, daaronder begrepen dieren,
      planten, delen van dieren of planten, alsmede micro-organismen;
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel1
  - number: 1.1.c
    text: 'preparaat: een vast of vloeibaar mengsel van substanties;'
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel1
  - number: 1.1.d
    text: 'middel: substantie of preparaat;'
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel1
  - number: 1.1.e
    text: |-
      Enkelvoudig Verdrag: het op 30 maart 1961 te New York tot stand gekomen Enkelvoudig Verdrag inzake verdovende
      middelen (*Trb.* 1963, 81), zoals gewijzigd bij het op 25 maart 1972 te Genève tot stand gekomen Protocol tot
      wijziging van dat verdrag (*Trb.* 1987, 90);
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel1
  - number: 1.1.f
    text: |-
      Psychotrope Stoffen Verdrag: het op 21 februari 1971 te Wenen tot stand gekomen Verdrag inzake psychotrope stoffen
      (*Trb.* 1989, 129);
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel1
  - number: 1.1.g
    text: |-
      Gemeenschappelijk optreden: het Gemeenschappelijk Optreden nr. 97/396/JBZ van 16 juni 1997 vastgesteld door de
      Raad van de Europese Unie op basis van artikel K.3 van het Verdrag betreffende de Europese Unie, betreffende de
      informatie-uitwisseling, risicoanalyse en controle van nieuwe synthetische drugs (PbEG L 167).
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel1
  - number: '1.2'
    text: |-
      Voor toepassing van deze wet en de daarop berustende bepalingen worden de zouten van de substanties met die
      substanties gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel1
  - number: '1.3'
    text: Voor de toepassing van deze wet wordt onder vervaardigen begrepen raffineren en omzetten.
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel1
  - number: '1.4'
    text: |-
      Onder binnen het grondgebied van Nederland brengen van middelen, bedoeld in de [artikelen 2][ref1] en [3][ref2],
      is begrepen: het binnen het grondgebied van Nederland brengen van de voorwerpen of goederen, waarin die middelen
      verpakt of geborgen zijn en elke op het verder vervoer, de opslag, de aflevering, ontvangst of overdracht gerichte
      handeling, met betrekking tot die middelen, die binnen het grondgebied van Nederland zijn gebracht, of tot de
      voorwerpen of goederen, waarin die middelen verpakt of geborgen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '3'
  - number: '1.5'
    text: |-
      Onder buiten het grondgebied van Nederland brengen van middelen, bedoeld in de [artikelen 2][ref1] en [3][ref2],
      is begrepen: het buiten het grondgebied van Nederland brengen van de voorwerpen of goederen, waarin die middelen
      verpakt of geborgen zijn en het met bestemming naar het buitenland vervoeren, ten vervoer aannemen of ten vervoer
      aanbieden, het ten uitvoer dan wel ten wederuitvoer aangeven, daaronder begrepen het in kennis stellen van de
      wederuitvoer, in de zin van [verordening (EEG) nr. 2913/92](31992R2913) van de Raad van de Europese Gemeenschappen
      van 12 oktober 1992 tot vaststelling van het communautair douanewetboek (*PbEG* L 302) of het in, op of aan een
      naar het buitenland bestemd vaar-, voer- of luchtvaartuig aanwezig hebben van die middelen, of van die voorwerpen
      of goederen.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel1
