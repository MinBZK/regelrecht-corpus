      [ref1]: https://wetten.overheid.nl/BWBR0001941
      [ref2]: https://wetten.overheid.nl/BWBR0001941
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001941
      - id: ref2
        bwb_id: BWBR0001941
  - number: 4.2.a
    text: |-
      beroepsbeoefenaren als bedoeld in [artikel 5, eerste lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel5
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '5'
  - number: 4.2.b
    text: |-
      instellingen en personen als bedoeld in [artikel 5, tweede lid en derde lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel5
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '5'
  - number: 4.2.c
    text: |-
      houders van een ontheffing als bedoeld in [artikel 6][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel6
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '6'
  - number: '4.3'
    text: |-
      Het is verboden ter verkrijging van enig middel, in [lijst I][ref1] en [II][ref2] bedoeld:


      [ref1]: https://wetten.overheid.nl/BWBR0001941
      [ref2]: https://wetten.overheid.nl/BWBR0001941
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001941
      - id: ref2
        bwb_id: BWBR0001941
  - number: 4.3.a
    text: een vals of vervalst recept aan te bieden;
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel4
  - number: 4.3.b
    text: |-
      een recept aan te bieden, waarin een andere naam of een ander adres is vermeld dan de naam of het adres van degene
      te wiens behoeve het recept is voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel4
  - number: '5.1'
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften gesteld ter zake van het afleveren van krachtens
      [artikel 4][ref1] aangewezen middelen. Onverminderd deze algemene maatregel van bestuur, is het verbod op het
      bereiden, bewerken, verwerken, verkopen, afleveren, verstrekken, vervoeren of aanwezig hebben van een middel
      bedoeld in [lijst I][ref2] of [II][ref3], niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001941
      [ref3]: https://wetten.overheid.nl/BWBR0001941
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0001941
      - id: ref3
        bwb_id: BWBR0001941
  - number: 5.1.a
    text: |-
      apothekers en apotheekhoudende artsen indien zij krachtens [artikel 4, eerste lid][ref1], aangewezen middelen voor
      geneeskundige doeleinden bereiden, bewerken, verwerken, verkopen, afleveren, verstrekken, vervoeren of aanwezig
      hebben en deze werkzaamheden geschieden binnen de normale beroepsuitoefening;


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel4
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '4'
  - number: 5.1.b
    text: |-
      dierenartsen, indien zij de krachtens [artikel 4][ref1] aangewezen middelen voor diergeneeskundige doeleinden
      verkopen, afleveren, verstrekken, vervoeren of aanwezig hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel4
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '4'
  - number: '5.2'
    text: |-
      De verboden inzake het verstrekken, vervoeren of aanwezig hebben van middelen als bedoeld in [lijst I][ref1] of
      [II][ref2], zijn voorts niet van toepassing op daartoe bij algemene maatregel van bestuur aangewezen instellingen
      en op hen die de desbetreffende middelen in de aanwezige hoeveelheid tot uitoefening van de geneeskunst, de
      tandheelkunde of de diergeneeskunde, dan wel voor eigen geneeskundig gebruik behoeven of krachtens wettelijk
      voorschrift in voorraad moeten hebben en langs wettige weg hebben verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0001941
      [ref2]: https://wetten.overheid.nl/BWBR0001941
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001941
      - id: ref2
        bwb_id: BWBR0001941
  - number: '5.3'
    text: |-
      Voorts kunnen, indien een noodtoestand als bedoeld in
      [artikel 1, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref1] is afgekondigd, bij koninklijk
      besluit, op voordracht van Onze Minister, andere instellingen of personen dan die, bedoeld in het eerste en tweede
      lid, worden aangewezen voor wie de verboden inzake het verstrekken, vervoeren of aanwezig hebben van middelen als
      bedoeld in [lijst I][ref2] of [II][ref3], niet van toepassing zijn. Deze aanwijzing kan worden beperkt tot bepaalde
      gebieden en bepaalde middelen. Voorts kunnen aan de aanwijzing nadere voorschriften worden verbonden. De aanwijzing
      vervalt van rechtswege indien de noodtoestand wordt beëindigd, en kan voorts worden ingetrokken bij koninklijk
      besluit, op voordracht van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001941
      [ref3]: https://wetten.overheid.nl/BWBR0001941
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001941
      - id: ref3
        bwb_id: BWBR0001941
  - number: '5.4'
    text: |-
      De verboden inzake het vervoeren of aanwezig hebben zijn bovendien niet van toepassing op hen die de middelen
      vervoeren of daartoe aanwezig hebben in opdracht van degene die tot zodanig vervoer bevoegd is.
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel5
  - number: '6.1'
    text: |-
      Onze Minister kan, met inachtneming van [artikel 8i, eerste lid][ref1], ontheffing verlenen van een verbod als
      bedoeld in [artikel 2][ref2] of [3][ref3]. Hij kan voorts een ontheffing verlengen, wijzigen, aanvullen of
      intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel8i
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: 8i
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0001941
        artikel: '3'
  - number: '6.2'
    text: |-
      Een ontheffing of een verlenging daarvan wordt verleend voor ten hoogste vijf jaren, met dien verstande dat een
      ontheffing van een verbod als bedoeld in [artikel 2, onder A][ref1], of [artikel 3, onder A][ref2], wordt verleend
      per geval en voor ten hoogste zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '3'
  - number: '6.3'
    text: |-
      Onze Minister stelt de aanvrager van een ontheffing of van een verlenging daarvan binnen drie maanden na ontvangst
      van de aanvraag in kennis van zijn beslissing.
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel6
  - number: '7.1'
    text: |-
      Voor de behandeling van een aanvraag voor een ontheffing of een wijziging, aanvulling of verlenging daarvan,
      kan een vergoeding worden geheven. Voor de behandeling van een aanvraag voor een ontheffing als bedoeld in
      [artikel 8i, tweede lid][ref1], is geen vergoeding verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel8i
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: 8i
  - number: '7.2'
    text: |-
      Voor een ontheffing kan jaarlijks een vergoeding worden geheven. Het eerste lid, tweede volzin, is van
      overeenkomstige toepassing met betrekking tot de jaarlijkse vergoeding.
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel7
  - number: '7.3'
    text: |-
      De hoogte van de vergoedingen, bedoeld in het eerste en tweede lid, wordt bij ministeriële regeling vastgesteld en
      kan per categorie van ontheffing verschillend worden vastgesteld. Indien een ontheffing voor een periode korter dan
      een jaar geldt, wordt de vergoeding, bedoeld in het tweede lid, naar evenredigheid op een lager bedrag vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel7
  - number: '8.1'
    text: |-
      Een ontheffing kan slechts worden verleend of verlengd indien de aanvrager ten genoegen van Onze Minister heeft
      aangetoond:
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8
  - number: 8.1.a
    text: dat daarmee het belang van de volksgezondheid of dat van de gezondheid van dieren wordt gediend;
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8
  - number: 8.1.b
    text: |-
      deze nodig te hebben voor het verrichten van wetenschappelijk of analytisch-chemisch onderzoek dan wel voor
      instructieve doeleinden, voor zover het belang van de volksgezondheid zich hier niet tegen verzet, of
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8
  - number: 8.1.c
    text: |-
      deze nodig te hebben voor het verrichten van een handeling als bedoeld in [artikel 2][ref1] of [3][ref2] krachtens
      een overeenkomst met:


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '3'
  - number: 8.1.c.1
    text: |-
      een ander aan wie krachtens [artikel 6, eerste lid][ref1], een ontheffing is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel6
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '6'
  - number: 8.1.c.2
    text: een apotheker of apotheekhoudende arts;
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8
  - number: 8.1.c.3
    text: een dierenarts;
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8
  - number: 8.1.c.4
    text: |-
      een instelling of persoon, aangewezen krachtens [artikel 5, tweede of derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel5
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '5'
  - number: 8.1.c.5
    text: |-
      een houder van een in een ander land verleende vergunning of ontheffing om de desbetreffende middelen in dat land
      in te voeren, voor zover het belang van de volksgezondheid zich hier niet tegen verzet.
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8
  - number: '8.2'
    text: |-
      Een ontheffing kan voorts worden verleend of verlengd indien de aanvrager deze nodig heeft voor het telen van
      cannabis krachtens een overeenkomst met Onze Minister.
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8
  - number: 8a.1
    text: |-
      Aan een ontheffing kunnen voorschriften worden verbonden om naleving van de bepalingen van het Enkelvoudig Verdrag
      en het Psychotrope Stoffen Verdrag en de bij of krachtens deze wet gestelde voorschriften te verzekeren, of om
      misbruik van een middel als bedoeld in [lijst I][ref1] of [II][ref2] te voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001941
      [ref2]: https://wetten.overheid.nl/BWBR0001941
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0001941
      - id: ref2
        bwb_id: BWBR0001941
  - number: 8a.2
    text: 'In de ontheffing wordt ten minste vermeld:'
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8a
  - number: 8a.2.a
    text: |-
      voor welke van de verboden, bedoeld in [artikel 2][ref1] of [3][ref2] zij wordt verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '3'
  - number: 8a.2.b
    text: voor welke doeleinden zij wordt verleend;
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8a
  - number: 8a.2.c
    text: op welk perceel of in welke lokaliteit de desbetreffende handelingen mogen plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8a
  - number: 8a.2.d
    text: de wijze van opslag;
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8a
  - number: 8a.2.e
    text: de wijze van beveiliging;
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8a
  - number: 8a.2.f
    text: de manier waarop de voorraadadministratie is ingericht.
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8a
  - number: 8b
    text: |-
      Een ontheffing of een verlenging daarvan wordt geweigerd indien de aanvrager ingevolge een onherroepelijk geworden
      rechterlijke uitspraak onder curatele is gesteld dan wel zijn goederen onder bewind zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8b
  - number: 8c.1
    text: |-
      Een ontheffing of een verlenging daarvan kan worden geweigerd in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8c
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: 8c.2
    text: |-
      Met het oog op toepassing van het eerste lid, kan het Bureau bevordering integriteitsbeoordelingen door het
      openbaar bestuur, bedoeld in [artikel 8 van de in het eerste lid genoemde wet][ref1], om een advies als bedoeld in
      [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8c
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: 8d
    text: 'Een ontheffing wordt ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8d
  - number: 8d.a
    text: op aanvraag van de houder van de ontheffing;
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8d
  - number: 8d.b
    text: indien het belang van de volksgezondheid dit vordert;
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8d
  - number: 8d.c
    text: |-
      indien naar het oordeel van Onze Minister de doeleinden waarvoor de ontheffing is verleend niet meer gerealiseerd
      kunnen worden;
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8d
  - number: 8d.d
    text: |-
      indien een krachtens [artikel 7, tweede lid][ref1], verschuldigde vergoeding niet binnen 30 dagen na heffing is
      voldaan en evenmin gevolg is gegeven aan de aanmaning van Onze Minister, gedaan na afloop van die termijn, om
      alsnog binnen acht dagen te betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel7
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8d
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '7'
  - number: 8e.1
    text: 'Een ontheffing kan worden ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8e
  - number: 8e.1.a
    text: indien de houder van de ontheffing handelt in strijd met een bij of krachtens deze wet gesteld voorschrift;
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8e
  - number: 8e.1.b
    text: |-
      in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8e
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: 8e.2
    text: |-
      Met het oog op toepassing van het eerste lid, onder b, kan het Bureau bevordering integriteitsbeoordelingen,
      bedoeld in [artikel 8 van de in het eerste lid, onder b, genoemde wet][ref1], om een advies als bedoeld in
      [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8e
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: 8f.1
    text: |-
      Degene wiens ontheffing wordt ingetrokken ontdoet zich van de middelen waarop de ontheffing betrekking heeft,
      gedurende het tijdvak, gelegen tussen de mededeling van de intrekking en de laatste dag waarop de ontheffing geldt.
      Hij ontdoet zich van die middelen hetzij door vernietiging, hetzij door overdracht aan personen, rechtspersonen
      daaronder begrepen, die bevoegd zijn tot het verrichten van handelingen als bedoeld in [artikel 2][ref1] of
      [3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8f
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '3'
  - number: 8f.2
    text: |-
      In afwijking van het eerste lid, ontdoet de houder van een ontheffing voor de teelt van hennep zich van de middelen
      waarop de ontheffing betrekking heeft, hetzij door vernietiging van die middelen, hetzij door overdracht daarvan
      aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8f
  - number: 8g
    text: 'Een ontheffing vervalt:'
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8g
  - number: 8g.a
    text: door het overlijden van de houder;
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8g
  - number: 8g.b
    text: |-
      indien ingevolge een onherroepelijk geworden rechterlijke uitspraak de houder van de ontheffing onder curatele is
      gesteld dan wel zijn goederen onder bewind zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8g
  - number: 8g.c
    text: |-
      indien de rechtspersoon aan wie de ontheffing is verleend, wordt ontbonden, fuseert en niet de verkrijgende
      rechtspersoon is, of wordt gesplitst.
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8g
  - number: 8h
    text: 'Onze Minister draagt ervoor zorg dat:'
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8h
  - number: 8h.a
    text: |-
      in Nederland voldoende hennep wordt geteeld voor wetenschappelijk onderzoek naar de geneeskundige toepassing van
      hennep, hasjiesj en hennepolie of voor de productie van geneesmiddelen;
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8h
  - number: 8h.b
    text: de geteelde hennep, bedoeld onder a, wordt gebruikt voor een onder a genoemd doel.
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8h
  - number: 8i.1
    text: |-
      Onze Minister verleent niet meer ontheffingen van het verbod tot teelt van hennep dan nodig is voor de in
      [artikel 8h][ref1] bedoelde doeleinden en voor de veredeling van hennep.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel8h
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8i
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: 8h
  - number: 8i.2
    text: |-
      Een ontheffing van het verbod op het telen van hennep dan wel tot het verwerken, bewerken of vervoeren van hennep,
      hasjiesj en hennepolie voor de in [artikel 8h][ref1] genoemde doeleinden, wordt slechts verleend aan degene met wie
      Onze Minister ter zake een overeenkomst tot het verrichten van zodanige handelingen aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel8h
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8i
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: 8h
  - number: 8i.3
    text: |-
      Een overeenkomst als bedoeld in het tweede lid eindigt van rechtswege met ingang van de datum waarop de aan de
      wederpartij verleende ontheffing wordt ingetrokken of vervalt.
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8i
  - number: 8i.4
    text: |-
      In een overeenkomst als bedoeld in het tweede lid, wordt in elk geval bepaald dat de wederpartij van Onze Minister
      de geteelde hennep binnen vier maanden na het oogsten uitsluitend aan hem verkoopt en aflevert en de overtollige
      hennep vernietigt.
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8i
  - number: 8i.5
    text: 'Onze Minister is met uitsluiting van anderen bevoegd hennep, hasjiesj en hennepolie:'
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8i
  - number: 8i.5.a
    text: binnen of buiten het grondgebied van Nederland te brengen;
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8i
  - number: 8i.5.b
    text: te verkopen en af te leveren;
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8i
  - number: 8i.5.c
    text: |-
      aanwezig te hebben, met uitzondering van de voorraden die worden beheerd door degenen die ontheffing hebben deze
      middelen te telen, te bewerken of te verwerken.
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8i
  - number: 8i.6
    text: |-
      Het vijfde lid is niet van toepassing voor zover toepassingen van hennep, hasjiesj of hennepolie krachtens
      [artikel 3c, eerste lid][ref1], zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel3c
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8i
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: 3c
  - number: 8j
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de ambtenaren van het
      Staatstoezicht op de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8j
  - number: 8k
    text: |-
      Met het opsporen van de in deze wet strafbaar gestelde feiten zijn, behalve de bij of krachtens
      [artikel 141 van het Wetboek van Strafvordering][ref1] aangewezen personen, belast de ambtenaren, bedoeld in
      [artikel 8j][ref2], en de ambtenaren van de rijksbelastingdienst, bevoegd inzake douane.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel8j
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel8k
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: 8j
  - number: '9.1'
    text: 'De opsporingsambtenaren hebben, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is, toegang:'
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel9
  - number: 9.1.a
    text: |-
      tot de vervoermiddelen, met inbegrip van woongedeelten, waarvan hun bekend is, of waarvan redelijkerwijze door hen
      kan worden vermoed, dat daarmede ingevoerd of vervoerd worden of dat daarin, daarop of daaraan bewaard worden of
      aanwezig zijn middelen als bedoeld in [lijst I][ref1] of [II][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0001941
      [ref2]: https://wetten.overheid.nl/BWBR0001941
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001941
      - id: ref2
        bwb_id: BWBR0001941
  - number: 9.1.b
    text: |-
      tot de plaatsen, waar een overtreding van deze wet gepleegd wordt of waar redelijkerwijze vermoed kan worden, dat
      zodanige overtreding gepleegd wordt.
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel9
  - number: '9.2'
    text: |-
      Zij zijn bevoegd een persoon, verdacht van een bij deze wet als misdrijf strafbaar gesteld feit, bij het bestaan
      van ernstige bezwaren tegen deze, aan de kleding te onderzoeken.
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel9
  - number: '9.3'
    text: |-
      Zij zijn te allen tijde bevoegd tot inbeslagneming van daarvoor vatbare voorwerpen. Zij kunnen daartoe hun
      uitlevering vorderen.
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel9
  - number: '9.4'
    text: |-
      De officier van justitie of de hulpofficier van justitie voor wie de verdachte wordt geleid of die zelf
      de verdachte heeft aangehouden is bevoegd een persoon die zojuist binnen het grondgebied van Nederland is
      binnengekomen of die op het punt staat dit grondgebied te verlaten, en die is aangehouden terzake van een bij deze
      wet als misdrijf strafbaar gesteld feit, een vordering te geven tot medewerking aan een urineonderzoek, gericht op
      het aantonen van de aanwezigheid in het lichaam van middelen als bedoeld in [lijst I][ref1] of [II][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001941
      [ref2]: https://wetten.overheid.nl/BWBR0001941
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001941
      - id: ref2
        bwb_id: BWBR0001941
  - number: 9a
    text: |-
      Onze Minister is bevoegd een bestuurlijke boete van ten hoogste € 33 500,– op te leggen ter zake van een gedraging
      die in strijd is met het bepaalde bij of krachtens [artikel 3c][ref1], [4, eerste of tweede lid][ref2], of
      [5, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel3c
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0001941#Artikel5
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: 3c
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0001941
        artikel: '5'
  - number: '10.1'
    text: 'Hij die handelt in strijd met:'
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel10
  - number: 10.1.a
    text: |-
      een in [artikel 2][ref1], het in [artikel 3b, eerste lid][ref2], of een in [artikel 4, derde lid][ref3], gegeven
      verbod;


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel3b
      [ref3]: https://wetten.overheid.nl/BWBR0001941#Artikel4
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: 3b
      - id: ref3
        bwb_id: BWBR0001941
        artikel: '4'
  - number: 10.1.b
    text: |-
      een krachtens [artikel 3c, tweede lid][ref1], of [artikel 4, eerste of tweede lid][ref2], gegeven voorschrift;


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel3c
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel4
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: 3c
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '4'
  - number: 10.1.c
    text: |-
      een krachtens [artikel 8a, eerste lid][ref1], aan een ontheffing verbonden voorschrift;


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel8a
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: 8a
  - number: '10.2'
    text: |-
      Hij die opzettelijk handelt in strijd met het in [artikel 3b, eerste lid][ref1], of het in
      [artikel 4, derde lid][ref2], gegeven verbod, wordt gestraft met gevangenisstraf van ten hoogste vier jaren of
      geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel4
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '4'
  - number: '10.3'
    text: |-
      Hij die opzettelijk handelt in strijd met het in [artikel 2 onder C][ref1], gegeven verbod wordt gestraft met
      gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
  - number: '10.4'
    text: |-
      Hij die opzettelijk handelt in strijd met het in [artikel 2 onder B of D][ref1], gegeven verbod, wordt gestraft met
      gevangenisstraf van ten hoogste acht jaren of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
  - number: '10.5'
    text: |-
      Hij die opzettelijk handelt in strijd met een in [artikel 2 onder A][ref1], gegeven verbod, wordt gestraft met
      gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
  - number: '10.6'
    text: |-
      Indien het feit, bedoeld in het tweede, derde onderscheidenlijk vijfde lid, betrekking heeft op een geringe
      hoeveelheid, bestemd voor eigen gebruik, wordt gevangenisstraf van ten hoogste een jaar of geldboete van de derde
      categorie opgelegd.
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel10
  - number: 10a.1
    text: |-
      Hij die om een feit, bedoeld in het [vierde of vijfde lid van artikel 10][ref1], voor te bereiden of te bevorderen:


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel10
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '10'
  - number: 10a.1.1°
    text: |-
      een ander tracht te bewegen om dat feit te plegen, te doen plegen, mede te plegen of uit te lokken, om daarbij
      behulpzaam te zijn of om daartoe gelegenheid, middelen of inlichtingen te verschaffen,
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel10a
  - number: 10a.1.2°
    text: zich of een ander gelegenheid, middelen of inlichtingen tot het plegen van dat feit tracht te verschaffen,
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel10a
  - number: 10a.1.3°
    text: |-
      voorwerpen, vervoermiddelen, stoffen, gelden of andere betaalmiddelen voorhanden heeft, waarvan hij weet of
      ernstige reden heeft om te vermoeden dat zij bestemd zijn tot het plegen van dat feit,
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel10a
  - number: 10a.2
    text: |-
      Niet strafbaar is hij die de in het eerste lid omschreven feiten begaat met betrekking tot het binnen of buiten het
      grondgebied van Nederland brengen van een geringe hoeveelheid, bestemd voor eigen gebruik.
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel10a
  - number: '11.1'
    text: |-
      Hij die handelt in strijd met een in [artikel 3][ref1] gegeven verbod, wordt gestraft met hechtenis van ten hoogste
      een maand of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '3'
  - number: '11.2'
    text: |-
      Hij die opzettelijk handelt in strijd met een in [artikel 3 onder B, C of D][ref1], gegeven verbod, wordt gestraft
      met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '3'
  - number: '11.3'
    text: |-
      Hij die in de uitoefening van een beroep of bedrijf opzettelijk handelt in strijd met een in
      [artikel 3, onder B][ref1], gegeven verbod, wordt gestraft met gevangenisstraf van ten hoogste zes jaren of
      geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '3'
  - number: '11.4'
    text: |-
      Hij die opzettelijk handelt in strijd met een in [artikel 3 onder A][ref1], gegeven verbod, wordt gestraft met
      gevangenisstraf van ten hoogste vier jaren of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '3'
  - number: '11.5'
    text: |-
      Indien een feit als bedoeld in het tweede of vierde lid, betrekking heeft op een grote hoeveelheid van een
      middel, wordt gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie opgelegd. Onder grote
      hoeveelheid wordt verstaan een hoeveelheid die meer bedraagt dan de bij algemene maatregel van bestuur bepaalde
      hoeveelheid van een middel.
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel11
  - number: '11.6'
    text: |-
      Het tweede lid is niet van toepassing, indien het feit betrekking heeft op een hoeveelheid van hennep of hasjiesj
      van ten hoogste 30 gram.
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel11
  - number: '11.7'
    text: |-
      Het tweede en vierde lid zijn niet van toepassing, indien het feit betrekking heeft op een geringe hoeveelheid,
      bestemd voor eigen gebruik, van de in [lijst II][ref1] vermelde middelen, met uitzondering van hennep en hasjiesj.


      [ref1]: https://wetten.overheid.nl/BWBR0001941
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001941
  - number: 11a.1
    text: |-
      Deelneming aan een organisatie die tot oogmerk heeft het plegen van een misdrijf als
      bedoeld in [artikel 10, derde, vierde en vijfde lid][ref1], [10a, eerste lid][ref2], of
      [11, derde, vierde en vijfde lid][ref3], wordt gestraft met gevangenisstraf van ten hoogste acht jaren of geldboete
      van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0001941#Artikel11
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: 10a
      - id: ref3
        bwb_id: BWBR0001941
        artikel: '11'
  - number: 11a.2
    text: |-
      [Artikel 140, derde en vierde lid, van het Wetboek van Strafrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel140
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '140'
  - number: '12'
    text: |-
      Indien de waarde van de zaken waarmee of met betrekking tot welke de feiten, strafbaar
      gesteld in de [artikelen 10, eerste tot en met vijfde lid][ref1], [10a, eerste lid][ref2],
      [11, tweede tot en met vijfde lid][ref3], en [11a][ref4] zijn begaan, of die geheel of gedeeltelijk door middel van
      die feiten zijn verkregen, hoger is dan het vierde gedeelte van het maximum van de geldboete op die feiten gesteld,
      kan, ook indien het feit door een natuurlijke persoon is begaan, een geldboete van de naast hogere categorie worden
      opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0001941#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0001941#Artikel11a
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: 10a
      - id: ref3
        bwb_id: BWBR0001941
        artikel: '11'
      - id: ref4
        bwb_id: BWBR0001941
        artikel: 11a
  - number: '13.1'
    text: |-
      De in [artikel 10, eerste lid][ref1], en [artikel 11, eerste lid][ref2], strafbaar gestelde feiten zijn
      overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel11
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '11'
  - number: '13.2'
    text: |-
      De in de [artikelen 10, tweede tot en met zesde lid][ref1], [10a, eerste lid][ref2],
      [11, tweede tot en met vijfde lid][ref3], en [11a][ref4] strafbaar gestelde feiten zijn misdrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0001941#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0001941#Artikel11a
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: 10a
      - id: ref3
        bwb_id: BWBR0001941
        artikel: '11'
      - id: ref4
        bwb_id: BWBR0001941
        artikel: 11a
  - number: '13.3'
    text: 'De Nederlandse strafwet is toepasselijk op ieder die zich buiten Nederland schuldig maakt aan:'
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel13
  - number: 13.3.a
    text: |-
      een der in [artikel 10a, eerste lid][ref1], strafbaar gestelde feiten voorzover die zijn gepleegd om het in
      [artikel 10, vijfde lid][ref2], strafbaar gestelde feit voor te bereiden of te bevorderen, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel10
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: 10a
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '10'
  - number: 13.3.b
    text: |-
      poging tot of deelneming aan het in [artikel 10, vijfde lid][ref1], strafbaar gestelde feit.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel10
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '10'
  - number: 13a
    text: |-
      Onverminderd het bepaalde in de [artikelen 33 tot en met 35][ref1] en [36][ref2] worden de in [lijst I][ref3] of
      [II][ref4] bedoelde middelen verbeurd of aan het verkeer onttrokken verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0001941
      [ref4]: https://wetten.overheid.nl/BWBR0001941
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '33'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '36'
      - id: ref3
        bwb_id: BWBR0001941
      - id: ref4
        bwb_id: BWBR0001941
  - number: 13b.1
    text: |-
      De burgemeester is bevoegd tot oplegging van een last onder bestuursdwang indien in woningen of lokalen dan wel
      in of op bij woningen of zodanige lokalen behorende erven een middel als bedoeld in [lijst I][ref1] of [II][ref2]
      wordt verkocht, afgeleverd of verstrekt dan wel daartoe aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0001941
      [ref2]: https://wetten.overheid.nl/BWBR0001941
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0001941
      - id: ref2
        bwb_id: BWBR0001941
  - number: 13b.2
    text: |-
      Het eerste lid is niet van toepassing indien woningen, lokalen of erven als bedoeld in het eerste lid, gebruikt
      worden ter uitoefening van de artsenijbereidkunst, de geneeskunst, de tandheelkunst of de diergeneeskunde door
      onderscheidenlijk apothekers, artsen, tandartsen of dierenartsen.
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel13b
  - number: '14'
    text: Deze wet kan worden aangehaald onder de titel "Opiumwet".
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel14
  - number: '15'
    text: |-
      Deze wet treedt in werking met ingang van een door Ons te bepalen dag. Op dat tijdstip vervalt de wet van 4 oktober
      1919, *Stb.* nr. 592, houdende vaststelling van bepalingen, betreffende het opium en andere verdovende middelen,
      zoals deze wet gewijzigd is bij de wet van 29 juni 1925, *Stb.* nr. 308.
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel15
