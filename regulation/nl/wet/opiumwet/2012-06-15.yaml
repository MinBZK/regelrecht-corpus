  - number: 3a.1
    text: |-
      Bij algemene maatregel van bestuur worden aan de bij deze wet behorende [lijst I][ref1] of [lijst II][ref2]
      middelen toegevoegd indien deze onder de werking van het Enkelvoudig Verdrag of het Psychotrope Stoffen Verdrag
      worden gebracht of uit hoofde van de uit het Gemeenschappelijk optreden voortvloeiende verplichting onder de
      werking van deze wet dienen te worden gebracht. Bij algemene maatregel van bestuur kunnen van [lijst I][ref3]
      of [II][ref4] middelen worden geschrapt indien deze aan de werking van de in de eerste volzin bedoelde verdragen
      worden onttrokken dan wel indien de in die volzin bedoelde verplichting uit hoofde van het Gemeenschappelijk
      optreden komt te vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0001941
      [ref2]: https://wetten.overheid.nl/BWBR0001941
      [ref3]: https://wetten.overheid.nl/BWBR0001941
      [ref4]: https://wetten.overheid.nl/BWBR0001941
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0001941
      - id: ref2
        bwb_id: BWBR0001941
      - id: ref3
        bwb_id: BWBR0001941
      - id: ref4
        bwb_id: BWBR0001941
  - number: 3a.2
    text: |-
      Bij algemene maatregel van bestuur kunnen aan [lijst I][ref1] of [lijst II][ref2] middelen worden toegevoegd indien
      is gebleken dat deze het bewustzijn van de mens beïnvloeden en bij gebruik door de mens kunnen leiden tot schade
      aan zijn gezondheid en schade voor de samenleving.


      [ref1]: https://wetten.overheid.nl/BWBR0001941
      [ref2]: https://wetten.overheid.nl/BWBR0001941
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0001941
      - id: ref2
        bwb_id: BWBR0001941
  - number: 3a.3
    text: |-
      Bij algemene maatregel van bestuur worden middelen die krachtens het tweede lid zijn toegevoegd, van
      [lijst I][ref1] of [lijst II][ref2] geschrapt indien is gebleken dat zij de in het tweede lid bedoelde
      eigenschappen niet of niet meer bezitten.


      [ref1]: https://wetten.overheid.nl/BWBR0001941
      [ref2]: https://wetten.overheid.nl/BWBR0001941
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0001941
      - id: ref2
        bwb_id: BWBR0001941
  - number: 3a.4
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het eerste, tweede en derde lid, wordt niet vastgesteld dan nadat
      vier weken zijn verstreken nadat het ontwerp van de maatregel is overgelegd aan de beide Kamers der Staten-Generaal
      en binnen die termijn niet door of namens een van beide Kamers de wens te kennen wordt gegeven dat het in het
      ontwerp van de maatregel geregelde onderwerp wordt geregeld bij wet.
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel3a
  - number: 3a.5
    text: |-
      Indien naar het oordeel van Onze Minister handelingen als bedoeld in [artikel 2][ref1] of [3][ref2] ten aanzien
      van een middel onverwijld moeten worden verboden en de totstandkoming van een algemene maatregel van bestuur als
      bedoeld in het eerste of tweede lid niet kan worden afgewacht, kan het middel daartoe bij ministeriële regeling
      worden aangewezen. Onze Minister draagt ervoor zorg dat tegelijk met de vaststelling van deze ministeriële regeling
      het ontwerp van een algemene maatregel van bestuur met dezelfde inhoud ter beoordeling aan de ministerraad wordt
      aangeboden. De ministeriële regeling blijft, behoudens eerdere intrekking, van kracht totdat de algemene maatregel
      van bestuur waarbij het betreffende middel wordt aangewezen in werking treedt, doch uiterlijk tot een jaar na het
      inwerkingtreden van de regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '3'
  - number: 3b.1
    text: |-
      Elke openbaarmaking, welke er kennelijk op is gericht de verkoop, aflevering of verstrekking van een middel als
      bedoeld in [artikel 2][ref1] of [artikel 3][ref2] te bevorderen, is verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '3'
  - number: 3b.2
    text: |-
      Het in het eerste lid vervatte verbod geldt niet ter zake van openbaarmaking in het kader van medische of
      wetenschappelijke voorlichting.
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel3b
  - number: 3c.1
    text: |-
      Bij algemene maatregel van bestuur kunnen middelen en toepassingen worden aangewezen waarvoor een in
      [artikel 2][ref1] of [3][ref2] omschreven verbod geheel of ten dele niet geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel3c
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '3'
  - number: 3c.2
    text: |-
      Bij algemene maatregel van bestuur kunnen met betrekking tot middelen als bedoeld in [lijst I][ref1] of [II][ref2]
      regels worden gesteld om naleving van de bepalingen van het Enkelvoudig Verdrag of het Psychotrope Stoffen Verdrag
      te verzekeren of om misbruik van die middelen te voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001941
      [ref2]: https://wetten.overheid.nl/BWBR0001941
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel3c
    references:
      - id: ref1
        bwb_id: BWBR0001941
      - id: ref2
        bwb_id: BWBR0001941
  - number: '4.1'
    text: |-
      Het is verboden een middel als bedoeld in [lijst I][ref1] of [II][ref2] voor te schrijven op recept, tenzij
      het middel daartoe, in het belang van de volksgezondheid, is aangewezen bij algemene maatregel van bestuur. Bij
      de maatregel kunnen voorschriften worden gesteld ter zake van het recept en het doel waarvoor een middel wordt
      voorgeschreven. Een krachtens de eerste volzin vastgestelde algemene maatregel van bestuur treedt niet eerder
      in werking dan acht weken na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing
      wordt onverwijld mededeling gedaan aan de beide kamers der Staten-Generaal. In het belang van de volksgezondheid
      kan, in afwijking van de eerste volzin, bij ministeriële regeling een middel worden aangewezen dat mag worden
      voorgeschreven op recept, zolang het middel tevens is aangewezen krachtens [artikel 3a, vijfde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001941
      [ref2]: https://wetten.overheid.nl/BWBR0001941
      [ref3]: https://wetten.overheid.nl/BWBR0001941#Artikel3a
    url: https://wetten.overheid.nl/BWBR0001941/2012-06-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001941
      - id: ref2
        bwb_id: BWBR0001941
      - id: ref3
        bwb_id: BWBR0001941
        artikel: 3a
