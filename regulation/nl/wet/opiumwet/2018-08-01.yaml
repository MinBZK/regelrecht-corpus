      1 Het is verboden een middel als bedoeld in [lijst I][ref1] of [II][ref2] voor te schrijven op recept, tenzij
      het middel daartoe, in het belang van de volksgezondheid, is aangewezen bij algemene maatregel van bestuur. Bij
      de maatregel kunnen voorschriften worden gesteld ter zake van het recept en het doel waarvoor een middel wordt
      voorgeschreven.

      Een krachtens de eerste volzin vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan acht
      weken na de datum van uitgifte van het Staatsblad waarin hij is geplaatst.

      Van de plaatsing wordt onverwijld mededeling gedaan aan de beide kamers der Staten-Generaal. In het belang
      van de volksgezondheid kan, in afwijking van de eerste volzin, bij ministeriële regeling een middel worden
      aangewezen dat mag worden voorgeschreven op recept, zolang het middel tevens is aangewezen krachtens
      [artikel 3a, vijfde lid][ref3].

      2 Het bestellen van een middel als bedoeld in [lijst I][ref4] of [II][ref5], door:

      a. beroepsbeoefenaren als bedoeld in [artikel 5, eerste lid][ref6],

      b. instellingen en personen als bedoeld in [artikel 5, tweede lid en derde lid][ref7], en

      c. houders van een ontheffing als bedoeld in [artikel 6][ref8],

      geschiedt met inachtneming van bij ministeriële regeling vastgestelde voorschriften.

      3 Het is verboden ter verkrijging van enig middel, in [lijst I][ref9] en [II][ref10] bedoeld:

      a. een vals of vervalst recept aan te bieden;

      b. een recept aan te bieden, waarin een andere naam of een ander adres is vermeld dan de naam of het adres van
      degene te wiens behoeve het recept is voorgeschreven.


