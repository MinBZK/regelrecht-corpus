  - number: '12'
    text: |-
      Indien de waarde van de zaken waarmee of met betrekking tot welke de feiten, strafbaar
      gesteld in de [artikelen 10, eerste tot en met vijfde lid][ref1], [10a, eerste lid][ref2],
      [11, tweede tot en met vijfde lid][ref3], [11a][ref4] en [11b][ref5] zijn begaan, of die geheel of gedeeltelijk
      door middel van die feiten zijn verkregen, hoger is dan het vierde gedeelte van het maximum van de geldboete op die
      feiten gesteld, kan, ook indien het feit door een natuurlijke persoon is begaan, een geldboete van de naast hogere
      categorie worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel10a
