    text: |-
      1 Hij die handelt in strijd met:

      a. een in [artikel 2][ref1], het in [artikel 3b, eerste lid][ref2], of een in [artikel 4, derde lid][ref3], gegeven
      verbod;

      b. een krachtens [artikel 3c, tweede lid][ref4], of [artikel 4, eerste of tweede lid][ref5], gegeven voorschrift;

      c. een krachtens [artikel 8a, eerste lid][ref6], aan een ontheffing verbonden voorschrift;

      wordt gestraft met hechtenis van ten hoogste zes maanden of geldboete van de vierde categorie.

      2 Hij die opzettelijk handelt in strijd met het in [artikel 3b, eerste lid][ref7], of het in
      [artikel 4, derde lid][ref8], gegeven verbod, wordt gestraft met gevangenisstraf van ten hoogste vier jaren of
      geldboete van de vijfde categorie.

      3 Hij die opzettelijk handelt in strijd met het in [artikel 2 onder C][ref9], gegeven verbod wordt gestraft met
      gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie.

      4 Hij die opzettelijk handelt in strijd met het in [artikel 2 onder B of D][ref10], gegeven verbod, wordt gestraft
      met gevangenisstraf van ten hoogste acht jaren of geldboete van de vijfde categorie.

      5 Hij die opzettelijk handelt in strijd met een in [artikel 2 onder A][ref11], gegeven verbod, wordt gestraft met
      gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie.

      6 Indien het feit, bedoeld in het tweede, derde onderscheidenlijk vijfde lid, betrekking heeft op een geringe
      hoeveelheid, bestemd voor eigen gebruik, wordt gevangenisstraf van ten hoogste een jaar of geldboete van de derde
      categorie opgelegd.


