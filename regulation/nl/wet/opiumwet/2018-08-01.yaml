  - number: 3a
    text: |-
      1 Bij algemene maatregel van bestuur worden aan de bij deze wet behorende [lijst I][ref1] of [lijst II][ref2]
      middelen toegevoegd indien deze onder de werking van het Enkelvoudig Verdrag of het Psychotrope Stoffen Verdrag
      worden gebracht of uit hoofde van de uit het Besluit 2005/387/JBZ voortvloeiende verplichting onder de werking van
      deze wet dienen te worden gebracht. Bij algemene maatregel van bestuur kunnen van [lijst I][ref3] of [II][ref4]
      middelen worden geschrapt indien deze aan de werking van de in de eerste volzin bedoelde verdragen worden
      onttrokken dan wel indien de in die volzin bedoelde verplichting uit hoofde van het Besluit 2005/387/JBZ komt te
      vervallen.

      2 Bij algemene maatregel van bestuur kunnen aan [lijst I][ref5] of [lijst II][ref6] middelen worden toegevoegd
      indien is gebleken dat deze het bewustzijn van de mens beïnvloeden en bij gebruik door de mens kunnen leiden tot
      schade aan zijn gezondheid en schade voor de samenleving.

      3 Bij algemene maatregel van bestuur worden middelen die krachtens het tweede lid zijn toegevoegd, van
      [lijst I][ref7] of [lijst II][ref8] geschrapt indien is gebleken dat zij de in het tweede lid bedoelde
      eigenschappen niet of niet meer bezitten.

      4 Een algemene maatregel van bestuur als bedoeld in het eerste, tweede en derde lid, wordt niet vastgesteld dan
      nadat vier weken zijn verstreken nadat het ontwerp van de maatregel is overgelegd aan de beide Kamers der Staten-
      Generaal en binnen die termijn niet door of namens een van beide Kamers de wens te kennen wordt gegeven dat het in
      het ontwerp van de maatregel geregelde onderwerp wordt geregeld bij wet.

      5 Indien naar het oordeel van Onze Minister handelingen als bedoeld in [artikel 2][ref9] of [3][ref10] ten aanzien
      van een middel onverwijld moeten worden verboden en de totstandkoming van een algemene maatregel van bestuur als
      bedoeld in het eerste of tweede lid niet kan worden afgewacht, kan het middel daartoe bij ministeriële regeling
      worden aangewezen. Onze Minister draagt ervoor zorg dat tegelijk met de vaststelling van deze ministeriële regeling
      het ontwerp van een algemene maatregel van bestuur met dezelfde inhoud ter beoordeling aan de ministerraad wordt
      aangeboden. De ministeriële regeling blijft, behoudens eerdere intrekking, van kracht totdat de algemene maatregel
      van bestuur waarbij het betreffende middel wordt aangewezen in werking treedt, doch uiterlijk tot een jaar na het
      inwerkingtreden van de regeling.


