  - number: '14'
    text: Deze wet kan worden aangehaald onder de titel "Opiumwet".
    url: https://wetten.overheid.nl/BWBR0001941/2018-08-01#Artikel14
  - number: '15'
    text: |-
      Deze wet treedt in werking met ingang van een door Ons te bepalen dag.

      Op dat tijdstip vervalt de wet van 4 oktober 1919, *Stb.* nr. 592, houdende vaststelling van bepalingen,
      betreffende het opium en andere verdovende middelen, zoals deze wet gewijzigd is bij de wet van 29 juni 1925,
      *Stb.* nr. 308.
    url: https://wetten.overheid.nl/BWBR0001941/2018-08-01#Artikel15
