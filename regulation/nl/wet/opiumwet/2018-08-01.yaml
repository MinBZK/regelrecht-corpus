      1 Onze Minister kan, met inachtneming van [artikel 8i, eerste lid][ref1], ontheffing verlenen van een verbod
      als bedoeld in [artikel 2][ref2] of [3][ref3]. Hij kan voorts een ontheffing verlengen, wijzigen, aanvullen of
      intrekken.

      2 Een ontheffing of een verlenging daarvan wordt verleend voor ten hoogste vijf jaren, met dien verstande dat een
      ontheffing van een verbod als bedoeld in [artikel 2, onder A][ref4], of [artikel 3, onder A][ref5], wordt verleend
      per geval en voor ten hoogste zes maanden.

      3 Onze Minister stelt de aanvrager van een ontheffing of van een verlenging daarvan binnen drie maanden na
      ontvangst van de aanvraag in kennis van zijn beslissing.


