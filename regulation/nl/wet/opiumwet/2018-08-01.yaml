preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien, of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het noodzakelijk is, de bepalingen betreffende het opium en andere
    verdoovende middelen in overeenstemming te brengen met de bepalingen van het op 19 Februari 1925 te Genève tusschen
    Nederland en andere Staten gesloten internationale opiumverdrag;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001941/2018-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;

      b. substantie: stof van menselijke, dierlijke, plantaardige of chemische oorsprong, daaronder begrepen dieren,
      planten, delen van dieren of planten, alsmede micro-organismen;

      c. preparaat: een vast of vloeibaar mengsel van substanties;

      d. middel: substantie of preparaat;

      e. Enkelvoudig Verdrag: het op 30 maart 1961 te New York tot stand gekomen Enkelvoudig Verdrag inzake verdovende
      middelen (*Trb.* 1963, 81), zoals gewijzigd bij het op 25 maart 1972 te Genève tot stand gekomen Protocol tot
      wijziging van dat verdrag (*Trb.* 1987, 90);

      f. Psychotrope Stoffen Verdrag: het op 21 februari 1971 te Wenen tot stand gekomen Verdrag inzake psychotrope
      stoffen (*Trb.* 1989, 129);

      g. Besluit 2005/387/JBZ: Besluit 2005/387/JBZ van de Raad van 10 mei 2005 inzake de uitwisseling van informatie, de
      risicobeoordeling en de controle ten aanzien van nieuwe psychoactieve stoffen (PbEU 2005, L 127);

      h. Verdrag tegen sluikhandel: het op 20 december 1988 tot stand gekomen Verdrag van de Verenigde Naties tegen de
      sluikhandel in verdovende middelen en psychotrope stoffen (Trb. 1989, 97);

      i. Verdrag ter uitvoering van artikel 17 van het Verdrag tegen sluikhandel: het op 31 januari 1995 te Straatsburg
      tot stand gekomen Verdrag inzake de sluikhandel over zee, ter uitvoering van artikel 17 van het Verdrag van de
      Verenigde Naties tegen de sluikhandel in verdovende middelen en psychotrope stoffen (Trb. 2010, 165 en 239).

      2 Voor toepassing van deze wet en de daarop berustende bepalingen worden de zouten van de substanties met die
      substanties gelijkgesteld.

      3 Voor de toepassing van deze wet wordt onder vervaardigen begrepen raffineren en omzetten.

      4 Onder binnen het grondgebied van Nederland brengen van middelen, bedoeld in de [artikelen 2][ref1] en [3][ref2],
      is begrepen: het binnen het grondgebied van Nederland brengen van de voorwerpen of goederen, waarin die middelen
      verpakt of geborgen zijn en elke op het verder vervoer, de opslag, de aflevering, ontvangst of overdracht gerichte
      handeling, met betrekking tot die middelen, die binnen het grondgebied van Nederland zijn gebracht, of tot de
      voorwerpen of goederen, waarin die middelen verpakt of geborgen zijn.

      5 Onder buiten het grondgebied van Nederland brengen van middelen, bedoeld in de [artikelen 2][ref3] en [3][ref4],
      is begrepen: het buiten het grondgebied van Nederland brengen van de voorwerpen of goederen, waarin die middelen
      verpakt of geborgen zijn en het met bestemming naar het buitenland vervoeren, ten vervoer aannemen of ten vervoer
      aanbieden, het ten uitvoer dan wel ten wederuitvoer aangeven, daaronder begrepen het doen van een summiere aangifte
      bij uitgaan of het in kennis stellen van de wederuitvoer, in de zin van Verordening (EU) nr. 952/2013 van het
      Europees Parlement en van de Raad van 9 oktober 2013 tot vaststelling van het douanewetboek van de Unie (PbEU 2013,
      L 269) of het in, op of aan een naar het buitenland bestemd vaar-, voer- of luchtvaartuig aanwezig hebben van die
      middelen, of van die voorwerpen of goederen.


