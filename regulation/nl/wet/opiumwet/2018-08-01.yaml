      1 Elke openbaarmaking, welke er kennelijk op is gericht de verkoop, aflevering of verstrekking van een middel als
      bedoeld in [artikel 2][ref1] of [artikel 3][ref2] te bevorderen, is verboden.

      2 Het in het eerste lid vervatte verbod geldt niet ter zake van openbaarmaking in het kader van medische of
      wetenschappelijke voorlichting.


