  - number: '11'
    text: |-
      1 Hij die handelt in strijd met een in [artikel 3][ref1] gegeven verbod, wordt gestraft met hechtenis van ten
      hoogste een maand of geldboete van de tweede categorie.

      2 Hij die opzettelijk handelt in strijd met een in [artikel 3 onder B, C of D][ref2], gegeven verbod, wordt
      gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie.

      3 Hij die in de uitoefening van een beroep of bedrijf opzettelijk handelt in strijd met een in
      [artikel 3, onder B][ref3], gegeven verbod, wordt gestraft met gevangenisstraf van ten hoogste zes jaren of
      geldboete van de vijfde categorie.

      4 Hij die opzettelijk handelt in strijd met een in [artikel 3 onder A][ref4], gegeven verbod, wordt gestraft met
      gevangenisstraf van ten hoogste vier jaren of geldboete van de vijfde categorie.

      5 Indien een feit als bedoeld in het tweede of vierde lid, betrekking heeft op een grote hoeveelheid van een
      middel, wordt gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie opgelegd. Onder grote
      hoeveelheid wordt verstaan een hoeveelheid die meer bedraagt dan de bij algemene maatregel van bestuur bepaalde
      hoeveelheid van een middel.

      6 Het tweede lid is niet van toepassing, indien het feit betrekking heeft op een hoeveelheid van hennep of hasjiesj
      van ten hoogste 30 gram.

      7 Het tweede en vierde lid zijn niet van toepassing, indien het feit betrekking heeft op een geringe hoeveelheid,
      bestemd voor eigen gebruik, van de in [lijst II][ref5] vermelde middelen, met uitzondering van hennep en hasjiesj.


