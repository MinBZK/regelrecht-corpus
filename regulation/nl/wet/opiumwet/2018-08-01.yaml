  - number: '7'
    text: |-
      1 Voor de behandeling van een aanvraag voor een ontheffing of een wijziging, aanvulling of verlenging daarvan,
      kan een vergoeding worden geheven. Voor de behandeling van een aanvraag voor een ontheffing als bedoeld in
      [artikel 8i, tweede lid][ref1], is geen vergoeding verschuldigd.

      2 Voor een ontheffing kan jaarlijks een vergoeding worden geheven. Het eerste lid, tweede volzin, is van
      overeenkomstige toepassing met betrekking tot de jaarlijkse vergoeding.

      3 De hoogte van de vergoedingen, bedoeld in het eerste en tweede lid, wordt bij ministeriële regeling vastgesteld
      en kan per categorie van ontheffing verschillend worden vastgesteld. Indien een ontheffing voor een periode
      korter dan een jaar geldt, wordt de vergoeding, bedoeld in het tweede lid, naar evenredigheid op een lager bedrag
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel8i
