  - number: 8f
    text: |-
      1 Degene wiens ontheffing wordt ingetrokken ontdoet zich van de middelen waarop de ontheffing betrekking heeft,
      gedurende het tijdvak, gelegen tussen de mededeling van de intrekking en de laatste dag waarop de ontheffing geldt.
      Hij ontdoet zich van die middelen hetzij door vernietiging, hetzij door overdracht aan personen, rechtspersonen
      daaronder begrepen, die bevoegd zijn tot het verrichten van handelingen als bedoeld in [artikel 2][ref1] of
      [3][ref2].

      2 In afwijking van het eerste lid, ontdoet de houder van een ontheffing voor de teelt van hennep zich van de
      middelen waarop de ontheffing betrekking heeft, hetzij door vernietiging van die middelen, hetzij door overdracht
      daarvan aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001941/2018-08-01#Artikel8f
