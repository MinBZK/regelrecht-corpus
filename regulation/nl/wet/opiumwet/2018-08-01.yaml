  - number: 3c
    text: |-
      1 Bij algemene maatregel van bestuur kunnen middelen en toepassingen worden aangewezen waarvoor een in
      [artikel 2][ref1] of [3][ref2] omschreven verbod geheel of ten dele niet geldt.

      2 Bij algemene maatregel van bestuur kunnen met betrekking tot middelen als bedoeld in [lijst I][ref3] of
      [II][ref4] regels worden gesteld om naleving van de bepalingen van het Enkelvoudig Verdrag of het Psychotrope
      Stoffen Verdrag te verzekeren of om misbruik van die middelen te voorkomen.


