  - number: 8a
    text: |-
      1 Aan een ontheffing kunnen voorschriften worden verbonden om naleving van de bepalingen van het Enkelvoudig
      Verdrag en het Psychotrope Stoffen Verdrag en de bij of krachtens deze wet gestelde voorschriften te verzekeren, of
      om misbruik van een middel als bedoeld in [lijst I][ref1] of [II][ref2] te voorkomen.

      2 In de ontheffing wordt ten minste vermeld:

      a. voor welke van de verboden, bedoeld in [artikel 2][ref3] of [3][ref4] zij wordt verleend;

      b. voor welke doeleinden zij wordt verleend;

      c. op welk perceel of in welke lokaliteit de desbetreffende handelingen mogen plaatsvinden;

      d. de wijze van opslag;

      e. de wijze van beveiliging;

      f. de manier waarop de voorraadadministratie is ingericht.


      [ref1]: https://wetten.overheid.nl/BWBR0001941
      [ref2]: https://wetten.overheid.nl/BWBR0001941
