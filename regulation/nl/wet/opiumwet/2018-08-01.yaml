        artikel: '3'
  - number: 8g
    text: |-
      Een ontheffing vervalt:

      a. door het overlijden van de houder;

      b. indien ingevolge een onherroepelijk geworden rechterlijke uitspraak de houder van de ontheffing onder curatele
      is gesteld dan wel zijn goederen onder bewind zijn gesteld;

      c. indien de rechtspersoon aan wie de ontheffing is verleend, wordt ontbonden, fuseert en niet de verkrijgende
      rechtspersoon is, of wordt gesplitst.
    url: https://wetten.overheid.nl/BWBR0001941/2018-08-01#Artikel8g
  - number: 8h
    text: |-
      Onze Minister draagt ervoor zorg dat:

      a. in Nederland voldoende hennep wordt geteeld voor wetenschappelijk onderzoek naar de geneeskundige toepassing van
      hennep, hasjiesj en hennepolie of voor de productie van geneesmiddelen;

      b. de geteelde hennep, bedoeld onder a, wordt gebruikt voor een onder a genoemd doel.
    url: https://wetten.overheid.nl/BWBR0001941/2018-08-01#Artikel8h
  - number: 8i
    text: |-
      1 Onze Minister verleent niet meer ontheffingen van het verbod tot teelt van hennep dan nodig is voor de in
      [artikel 8h][ref1] bedoelde doeleinden en voor de veredeling van hennep.

      2 Een ontheffing van het verbod op het telen van hennep dan wel tot het verwerken, bewerken of vervoeren van
      hennep, hasjiesj en hennepolie voor de in [artikel 8h][ref2] genoemde doeleinden, wordt slechts verleend aan degene
      met wie Onze Minister ter zake een overeenkomst tot het verrichten van zodanige handelingen aangaat.

      3 Een overeenkomst als bedoeld in het tweede lid eindigt van rechtswege met ingang van de datum waarop de aan de
      wederpartij verleende ontheffing wordt ingetrokken of vervalt.

      4 In een overeenkomst als bedoeld in het tweede lid, wordt in elk geval bepaald dat de wederpartij van Onze
      Minister de geteelde hennep binnen vier maanden na het oogsten uitsluitend aan hem verkoopt en aflevert en de
      overtollige hennep vernietigt.

      5 Onze Minister is met uitsluiting van anderen bevoegd hennep, hasjiesj en hennepolie:

      a. binnen of buiten het grondgebied van Nederland te brengen;

      b. te verkopen en af te leveren;

      c. aanwezig te hebben, met uitzondering van de voorraden die worden beheerd door degenen die ontheffing hebben deze
      middelen te telen, te bewerken of te verwerken.

      6 Het vijfde lid is niet van toepassing voor zover toepassingen van hennep, hasjiesj of hennepolie krachtens
      [artikel 3c, eerste lid][ref3], zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel8h
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel8h
      [ref3]: https://wetten.overheid.nl/BWBR0001941#Artikel3c
