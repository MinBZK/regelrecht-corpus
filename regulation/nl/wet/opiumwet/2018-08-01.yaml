  - number: 11a
    text: |-
      Hij die stoffen of voorwerpen bereidt, bewerkt, verwerkt, te koop aanbiedt, verkoopt, aflevert, verstrekt,
      vervoert, vervaardigt of voorhanden heeft dan wel vervoermiddelen, ruimten, gelden of andere betaalmiddelen
      voorhanden heeft of gegevens voorhanden heeft, waarvan hij weet of ernstige reden heeft om te vermoeden dat zij
      bestemd zijn tot het plegen van een van de in [artikel 11, derde en vijfde lid][ref1], strafbaar gestelde feiten,
      wordt gestraft met gevangenisstraf van ten hoogste drie jaar of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel11
    url: https://wetten.overheid.nl/BWBR0001941/2018-08-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '11'
  - number: 11b
    text: |-
      1 Deelneming aan een organisatie die tot oogmerk heeft het plegen van een misdrijf als bedoeld in
      [artikel 10, derde, vierde en vijfde lid][ref1], [10a, eerste lid][ref2], [11, derde, vierde en vijfde lid][ref3],
      of [11a][ref4], wordt gestraft met gevangenisstraf van ten hoogste acht jaren of geldboete van de vijfde categorie.

      2 [Artikel 140, derde en vierde lid, van het Wetboek van Strafrecht][ref5] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel10
