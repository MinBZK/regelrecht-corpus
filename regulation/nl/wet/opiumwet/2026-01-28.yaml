  - number: '8'
    text: |-
      1 Een ontheffing van een verbod als bedoeld in de [artikelen 2][ref1] of [3][ref2] kan slechts worden verleend of
      verlengd indien de aanvrager ten genoegen van Onze Minister heeft aangetoond:

      a. dat daarmee het belang van de volksgezondheid of dat van de diergezondheid wordt gediend;

      b. deze nodig te hebben voor het verrichten van wetenschappelijk of analytisch-chemisch onderzoek dan wel voor
      instructieve doeleinden, voor zover het belang van de volksgezondheid zich hier niet tegen verzet, of

      c. deze nodig te hebben voor het verrichten van een handeling als bedoeld in [artikel 2][ref3] of [3][ref4]
      krachtens een overeenkomst met:

      1. een ander aan wie krachtens [artikel 6, eerste lid][ref5], een ontheffing is verleend;

      2. een apotheker of apotheekhoudende arts;

      3. een dierenarts;

      4. een instelling of persoon, aangewezen krachtens [artikel 5, tweede of derde lid][ref6];

      5. een houder van een in een ander land verleende vergunning of ontheffing om de desbetreffende middelen in dat
      land in te voeren, voor zover het belang van de volksgezondheid zich hier niet tegen verzet;

      d. deze nodig hebben voor industriële doeleinden teneinde een product te realiseren dat voldoet aan de eisen
      gesteld bij of krachtens deze wet.

      2 Een ontheffing kan voorts worden verleend of verlengd indien de aanvrager deze nodig heeft voor het telen van
      cannabis krachtens een overeenkomst met Onze Minister.

      3 Een ontheffing van een verbod als bedoeld in [artikel 2a, eerste lid][ref7], kan slechts worden verleend indien
      de aanvrager ten genoegen van Onze Minister heeft aangetoond:

      a. dat daarmee het belang van de volksgezondheid of dat van de diergezondheid wordt gediend;

      b. deze nodig te hebben voor het verrichten van wetenschappelijk of analytisch-chemisch onderzoek dan wel voor
      instructieve doeleinden, voor zover het belang van de volksgezondheid zich hier niet tegen verzet; of

      c. deze nodig te hebben voor het verrichten van een handeling als bedoeld in [artikel 2a, eerste lid][ref8],
      krachtens een overeenkomst met:

      1. een ander aan wie krachtens [artikel 6, eerste lid][ref9], een ontheffing is verleend;

      2. een ander die in een ander land is gevestigd en die gerechtigd is de middelen in dat land in te voeren, voor
      zover het belang van de volksgezondheid zich hier niet tegen verzet;

      d. deze nodig te hebben voor industriële doeleinden teneinde een product te realiseren dat voldoet aan de eisen
      gesteld bij of krachtens deze wet.


