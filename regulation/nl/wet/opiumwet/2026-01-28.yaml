  - number: 13b
    text: |-
      1 De burgemeester is bevoegd tot oplegging van een last onder bestuursdwang indien in een woning of lokaal of op
      een daarbij behorend erf:

      a. een middel als bedoeld in [lijst I][ref1] of [II][ref2] dan wel aangewezen krachtens
      [artikel 3a, vijfde lid][ref3], of een substantie die deel uitmaakt van een stofgroep als
      bedoeld in [lijst IA][ref4] of een preparaat daarvan, met uitzondering van de middelen bedoeld in
      [artikel 2a, tweede lid][ref5], wordt verkocht, afgeleverd of verstrekt dan wel daartoe aanwezig is;

      b. een voorwerp of stof als bedoeld in [artikel 10a, eerste lid, onder 3°][ref6],
      [artikel 10c, eerste lid, onder 3°][ref7], of [artikel 11a][ref8] voorhanden is.

      2 Het eerste lid is niet van toepassing indien woningen, lokalen of erven als bedoeld in het eerste lid, gebruikt
      worden ter uitoefening van de artsenijbereidkunst, de geneeskunst, de tandheelkunst of de diergeneeskunde door
      onderscheidenlijk apothekers, artsen, tandartsen of dierenartsen.


