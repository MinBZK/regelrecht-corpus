  - number: 10c
    text: |-
      1 Hij die om het opzettelijk binnen of buiten het grondgebied van Nederland brengen, bereiden, bewerken, verwerken,
      verkopen, afleveren, verstrekken, vervoeren of vervaardigen van een substantie die deel uitmaakt van een stofgroep
      als bedoeld in de bij deze wet behorende [lijst IA][ref1] of een preparaat daarvan voor te bereiden of te
      bevorderen:

      1°. een ander tracht te bewegen om dat feit te plegen, te doen plegen, mede te plegen of uit te lokken, om daarbij
      behulpzaam te zijn of om daartoe gelegenheid, middelen of inlichtingen te verschaffen,

      2°. zich of een ander gelegenheid, middelen of inlichtingen tot het plegen van dat feit tracht te verschaffen,

      3°. voorwerpen, vervoermiddelen, stoffen, gelden of andere betaalmiddelen voorhanden heeft, waarvan hij weet
      of ernstige reden heeft om te vermoeden dat zij bestemd zijn tot het plegen van dat feit, wordt gestraft met
      gevangenisstraf van ten hoogste drie jaren of geldboete van de vijfde categorie.

      2 Niet strafbaar is hij die de in het eerste lid omschreven feiten begaat met betrekking tot het binnen of buiten
      het grondgebied van Nederland brengen van een geringe hoeveelheid, bestemd voor eigen gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0001941
    url: https://wetten.overheid.nl/BWBR0001941/2026-01-28#Artikel10c
