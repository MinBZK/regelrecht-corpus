        artikel: '10'
  - number: 10b
    text: |-
      1 Hij die handelt in strijd met een in [artikel 2a, eerste lid][ref1], gegeven verbod wordt gestraft met hechtenis
      van ten hoogste drie maanden of geldboete van de derde categorie.

      2 Hij die opzettelijk handelt in strijd met een in [artikel 2a, eerste lid][ref2], gegeven verbod wordt gestraft
      met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie.

      3 Indien het opzettelijk handelen in strijd met het in de [artikelen 2a, eerste lid, onderdelen A of C][ref3], en
      [3b, eerste lid][ref4], gegeven verbod betrekking heeft op een geringe hoeveelheid, bestemd voor eigen gebruik,
      wordt gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie opgelegd.


