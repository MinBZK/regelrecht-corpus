  - number: '12'
    text: |-
      Indien de waarde van de zaken waarmee of met betrekking tot welke de feiten, strafbaar gesteld in de
      [artikelen 10, eerste tot en met vijfde lid][ref1], [10a eerste lid][ref2], [10b][ref3], [10c][ref4],
      [11, tweede tot en met vijfde lid][ref5], [11a][ref6] en [11b][ref7] zijn begaan, of die geheel of gedeeltelijk
      door middel van die feiten zijn verkregen, hoger is dan het vierde gedeelte van het maximum van de geldboete op die
      feiten gesteld, kan, ook indien het feit door een natuurlijke persoon is begaan, een geldboete van de naast hogere
      categorie worden opgelegd.


