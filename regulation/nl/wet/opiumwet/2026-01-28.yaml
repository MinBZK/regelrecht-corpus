  - number: 10a
    text: |-
      1 Hij die om een feit, bedoeld in het [vierde of vijfde lid van artikel 10][ref1], voor te bereiden of te
      bevorderen:

      1°. een ander tracht te bewegen om dat feit te plegen, te doen plegen, mede te plegen of uit te lokken, om daarbij
      behulpzaam te zijn of om daartoe gelegenheid, middelen of inlichtingen te verschaffen,

      2°. zich of een ander gelegenheid, middelen of inlichtingen tot het plegen van dat feit tracht te verschaffen,

      3°. voorwerpen, vervoermiddelen, stoffen, gelden of andere betaalmiddelen voorhanden heeft, waarvan hij weet of
      ernstige reden heeft om te vermoeden dat zij bestemd zijn tot het plegen van dat feit,

      wordt gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie.

      2 Niet strafbaar is hij die de in het eerste lid omschreven feiten begaat met betrekking tot het binnen of buiten
      het grondgebied van Nederland brengen van een geringe hoeveelheid, bestemd voor eigen gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel10
    url: https://wetten.overheid.nl/BWBR0001941/2026-01-28#Artikel10a
