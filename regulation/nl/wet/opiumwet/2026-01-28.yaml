  - number: '5'
    text: |-
      1 Bij algemene maatregel van bestuur worden voorschriften gesteld ter zake van het afleveren van krachtens
      [artikel 4][ref1] aangewezen middelen. Onverminderd deze algemene maatregel van bestuur, is het verbod op het
      bereiden, bewerken, verwerken, verkopen, afleveren, verstrekken, vervoeren of aanwezig hebben van een middel
      bedoeld in [lijst I][ref2] of [II][ref3], niet van toepassing op:

      a. apothekers en apotheekhoudende artsen indien zij krachtens [artikel 4, eerste lid][ref4], aangewezen middelen
      voor geneeskundige doeleinden bereiden, bewerken, verwerken, verkopen, afleveren, verstrekken, vervoeren of
      aanwezig hebben en deze werkzaamheden geschieden binnen de normale beroepsuitoefening;

      b. dierenartsen, indien zij de krachtens [artikel 4][ref5] aangewezen middelen voor diergeneeskundige doeleinden
      verkopen, afleveren, verstrekken, vervoeren of aanwezig hebben.

      2 De verboden inzake het verstrekken, vervoeren of aanwezig hebben van middelen als bedoeld in [lijst I][ref6] of
      [II][ref7], zijn voorts niet van toepassing op daartoe bij algemene maatregel van bestuur aangewezen instellingen
      en op hen die de desbetreffende middelen in de aanwezige hoeveelheid tot uitoefening van de geneeskunst, de
      tandheelkunde of de diergeneeskunde, dan wel voor eigen geneeskundig gebruik behoeven of krachtens wettelijk
      voorschrift in voorraad moeten hebben en langs wettige weg hebben verkregen.

      3 Voorts kunnen, indien een noodtoestand als bedoeld in
      [artikel 1, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref8] is afgekondigd, bij koninklijk
      besluit, op voordracht van Onze Minister, andere instellingen of personen dan die, bedoeld in het eerste en tweede
      lid, worden aangewezen voor wie de verboden inzake het verstrekken, vervoeren of aanwezig hebben van middelen
      als bedoeld in [lijst I][ref9] of [II][ref10], niet van toepassing zijn. Deze aanwijzing kan worden beperkt tot
      bepaalde gebieden en bepaalde middelen. Voorts kunnen aan de aanwijzing nadere voorschriften worden verbonden.
      De aanwijzing vervalt van rechtswege indien de noodtoestand wordt beëindigd, en kan voorts worden ingetrokken bij
      koninklijk besluit, op voordracht van Onze Minister.

      4 De verboden inzake het vervoeren of aanwezig hebben zijn bovendien niet van toepassing op hen die de middelen
      vervoeren of daartoe aanwezig hebben in opdracht van degene die tot zodanig vervoer bevoegd is.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel4
