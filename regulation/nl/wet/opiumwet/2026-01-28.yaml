      Het is verboden een middel als bedoeld in de bij deze wet behorende [lijst I][ref1] dan wel aangewezen krachtens
      [artikel 3a, vijfde lid][ref2]:

      A. binnen of buiten het grondgebied van Nederland te brengen;

      B. te telen, te bereiden, te bewerken, te verwerken, te verkopen, af te leveren, te verstrekken of te vervoeren;

      C. aanwezig te hebben;

      D. te vervaardigen.


      [ref1]: https://wetten.overheid.nl/BWBR0001941
