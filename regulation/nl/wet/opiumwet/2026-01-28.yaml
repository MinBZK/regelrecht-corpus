  - number: 8b
    text: |-
      Een ontheffing of een verlenging daarvan wordt geweigerd indien de aanvrager ingevolge een onherroepelijk geworden
      rechterlijke uitspraak onder curatele is gesteld dan wel zijn goederen onder bewind zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0001941/2026-01-28#Artikel8b
  - number: 8c
    text: |-
      1 Een ontheffing of een verlenging daarvan kan worden geweigerd in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].

      2 Met het oog op toepassing van het eerste lid, kan het Bureau bevordering integriteitsbeoordelingen door het
      openbaar bestuur, bedoeld in [artikel 8 van de in het eerste lid genoemde wet][ref2], om een advies als bedoeld in
      [artikel 9 van die wet][ref3] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0013798#Artikel9
