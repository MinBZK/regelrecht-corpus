        artikel: 3c
  - number: 8j
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de ambtenaren van de
      Inspectie gezondheidszorg en jeugd.
    url: https://wetten.overheid.nl/BWBR0001941/2026-01-28#Artikel8j
  - number: 8k
    text: |-
      Met het opsporen van de in deze wet strafbaar gestelde feiten zijn, onverminderd [artikel 141][ref1] en
      [artikel 142, eerste lid, aanhef en onder a en b, van het Wetboek van Strafvordering][ref2], belast de ambtenaren,
      bedoeld in [artikel 8j][ref3], en de ambtenaren van de rijksbelastingdienst, bevoegd inzake douane.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel142
      [ref3]: https://wetten.overheid.nl/BWBR0001941#Artikel8j
    url: https://wetten.overheid.nl/BWBR0001941/2026-01-28#Artikel8k
