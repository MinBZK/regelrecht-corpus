  - number: 8d
    text: |-
      Een ontheffing wordt ingetrokken:

      a. op aanvraag van de houder van de ontheffing;

      b. indien het belang van de volksgezondheid dit vordert;

      c. indien naar het oordeel van Onze Minister de doeleinden waarvoor de ontheffing is verleend niet meer
      gerealiseerd kunnen worden;

      d. indien een krachtens [artikel 7, tweede lid][ref1], verschuldigde vergoeding niet binnen 30 dagen na heffing
      is voldaan en evenmin gevolg is gegeven aan de aanmaning van Onze Minister, gedaan na afloop van die termijn, om
      alsnog binnen acht dagen te betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel7
    url: https://wetten.overheid.nl/BWBR0001941/2026-01-28#Artikel8d
