  - number: 8e
    text: |-
      1 Een ontheffing kan worden ingetrokken:

      a. indien de houder van de ontheffing handelt in strijd met een bij of krachtens deze wet gesteld voorschrift;

      b. in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].

      2 Met het oog op toepassing van het eerste lid, onder b, kan het Bureau bevordering integriteitsbeoordelingen,
      bedoeld in [artikel 8 van de in het eerste lid, onder b, genoemde wet][ref2], om een advies als bedoeld in
      [artikel 9 van die wet][ref3] worden gevraagd.


