      1 Bij algemene maatregel van bestuur kunnen middelen en toepassingen worden aangewezen waarvoor een in de
      [artikelen 2][ref1], [2a, eerste lid][ref2], of [3][ref3] omschreven verbod geheel of ten dele niet geldt.

      2 Bij algemene maatregel van bestuur kunnen met betrekking tot middelen als bedoeld in [lijst I][ref4] of
