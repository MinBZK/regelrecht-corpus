  - number: 6a
    text: |-
      Onze Minister kan machtiging verlenen aan een bestuursorgaan tot afgifte op aanvraag van een schriftelijke
      verklaring inhoudende dat de aanvrager uitsluitend ten behoeve van zijn eigen geneeskundig gebruik een middel als
      bedoeld in [lijst I][ref1] of [II][ref2] mag vervoeren of aanwezig hebben.


