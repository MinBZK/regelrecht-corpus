  - number: 2a
    text: |-
      1 Het is verboden een substantie die deel uitmaakt van een stofgroep als bedoeld in de bij deze wet behorende
      [lijst IA][ref1] of een preparaat daarvan:

      A. binnen of buiten het grondgebied van Nederland te brengen;

      B. te bereiden, te bewerken, te verwerken, te verkopen, af te leveren, te verstrekken of te vervoeren;

      C. aanwezig te hebben;

      D. te vervaardigen.

      2 Het verbod in het eerste lid is niet van toepassing op:

      a. een geneesmiddel waarvoor een handelsvergunning is verleend als bedoeld in
      [artikel 40, eerste lid, van de Geneesmiddelenwet][ref2], of een geneesmiddel als bedoeld in artikel 40, derde lid,
      van die wet;

      b. een fabrikant als bedoeld in [artikel 1, eerste lid, onderdeel mm, van de Geneesmiddelenwet][ref3] of een
      groothandelaar als bedoeld in artikel 1, eerste lid, onderdeel nn, van die wet;

      c. een fabrikant of groothandelaar van werkzame stoffen die is geregistreerd als bedoeld in
      [artikel 38 van de Geneesmiddelenwet][ref4];

      d. een apotheker of huisarts die geneesmiddelen bereidt als bedoeld in
      [artikel 40, derde lid, onder a, van de Geneesmiddelenwet][ref5];

      e. een diergeneesmiddel waarvoor een vergunning is verleend voor het in de handel brengen krachtens
      [artikel 2.19 van de Wet dieren][ref6];

      f. een fabrikant aan wie krachtens [artikel 2.19 van de Wet dieren][ref7] een vergunning is verleend voor het
      vervaardigen van diergeneesmiddelen;

      g. een groothandel aan wie krachtens [artikel 2.19 van de Wet dieren][ref8] een vergunning is verleend voor de
      handel van diergeneesmiddelen;

      h. een geregistreerde stof genoemd in Bijlage I bij [Verordening (EG) nr. 273/2004](32004R0273) van het Europees
      Parlement en de Raad van 11 februari 2004 inzake drugsprecursoren (PbEU 2004, L 47);

      i. een geregistreerde stof genoemd in de Bijlage bij [Verordening (EG) nr. 111/2005](32005R0111) van de Raad van
      22 december 2004 houdende voorschriften voor het toezicht op de handel tussen de Gemeenschap en derde landen in
      drugsprecursoren (PbEU 2005, L 22); of

      j. een middel als bedoeld in de [artikelen 2][ref9] en [3][ref10].

      3 Een wijziging van Bijlage I bij [Verordening (EG) nr. 273/2004](32004R0273) van het Europees Parlement en de Raad
      van 11 februari 2004 inzake drugsprecursoren (PbEU 2004, L 47) of de Bijlage bij [Verordening (EG) nr. 111/2005]
      (32005R0111) van de Raad van 22 december 2004 houdende voorschriften voor het toezicht op de handel tussen de
      Gemeenschap en derde landen in drugsprecursoren (PbEU 2005, L 22) gaat voor toepassing van dit artikel gelden met
      ingang van de dag waarop aan de betrokken wijziging uitvoering moet zijn gegeven.


