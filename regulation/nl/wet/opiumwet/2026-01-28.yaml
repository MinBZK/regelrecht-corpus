        bwb_id: BWBR0001941
        artikel: 8j
  - number: '9'
    text: |-
      1 De opsporingsambtenaren, bedoeld in [artikel 8k][ref1], hebben, voor zover dat redelijkerwijs voor de vervulling
      van hun taak nodig is, toegang:

      a. tot de vervoermiddelen, met inbegrip van woongedeelten, waarvan hun bekend is, of waarvan redelijkerwijze door
      hen kan worden vermoed, dat daarmede ingevoerd of vervoerd worden of dat daarin, daarop of daaraan bewaard worden
      of aanwezig zijn middelen als bedoeld in [lijst I][ref2] of [II][ref3] of substanties die deel uitmaken van een
      stofgroep als bedoeld in [lijst IA][ref4] of de preparaten daarvan, met uitzondering van de middelen bedoeld in
      [artikel 2a, tweede lid][ref5];

      b. tot de plaatsen, waar een overtreding van deze wet gepleegd wordt of waar redelijkerwijze vermoed kan worden,
      dat zodanige overtreding gepleegd wordt.

      2 Zij zijn bevoegd een persoon, verdacht van een bij deze wet als misdrijf strafbaar gesteld feit, bij het bestaan
      van ernstige bezwaren tegen deze, aan de kleding te onderzoeken.

      3 Zij zijn te allen tijde bevoegd tot inbeslagneming van daarvoor vatbare voorwerpen. Zij kunnen daartoe hun
      uitlevering vorderen.

      4 De officier van justitie of de hulpofficier van justitie voor wie de verdachte wordt geleid of die zelf
      de verdachte heeft aangehouden is bevoegd een persoon die zojuist binnen het grondgebied van Nederland is
      binnengekomen of die op het punt staat dit grondgebied te verlaten, en die is aangehouden terzake van een bij deze
      wet als misdrijf strafbaar gesteld feit, een vordering te geven tot medewerking aan een urineonderzoek, gericht
      op het aantonen van de aanwezigheid in het lichaam van middelen als bedoeld in [lijst I][ref6] of [II][ref7] of
      substanties die deel uitmaken van een stofgroep als bedoeld in [lijst IA][ref8] of de preparaten daarvan, met
      uitzondering van de middelen bedoeld in [artikel 2a, tweede lid][ref9].

      5 Onze Minister van Landbouw, Natuur en Voedselkwaliteit is bevoegd desgevraagd met gebruikmaking van
      de door landbouwers op grond van de [artikelen 24][ref10] en [25 van de Landbouwwet][ref11] verstrekte
      informatie over de toestand van de door hen beteelde percelen en de naam van het gewas waarmee het perceel
      zal worden beteeld, gegevens waaronder persoonsgegevens te verstrekken met betrekking tot hennepteelt welke is
      aangewezen krachtens [artikel 3c][ref12] aan de opsporingsambtenaren, bedoeld in de [artikelen 141][ref13] en
      [142, eerste lid, aanhef en onder a en b, van het Wetboek van Strafvordering][ref14], ten behoeve van de opsporing
      van de bij of krachtens deze wet strafbaar gestelde feiten.


