  - number: '13'
    text: |-
      1 De in [artikel 10, eerste lid][ref1], [10b, eerste lid][ref2], en [artikel 11, eerste lid][ref3], strafbaar
      gestelde feiten zijn overtredingen.

      2 De in de [artikelen 10, tweede tot en met zesde lid][ref4], [10a, eerste lid][ref5], [10b, tweede lid][ref6],
      [10c][ref7], [11, tweede tot en met vijfde lid][ref8], [11a][ref9] en [11b][ref10] strafbaar gestelde feiten zijn
      misdrijven.

      3 De Nederlandse strafwet is toepasselijk op ieder die zich buiten Nederland schuldig maakt aan:

      a. een der in [artikel 10a, eerste lid][ref11], strafbaar gestelde feiten voorzover die zijn gepleegd om het in
      [artikel 10, vijfde lid][ref12], strafbaar gestelde feit voor te bereiden of te bevorderen, dan wel

      b. poging tot of deelneming aan het in [artikel 10, vijfde lid][ref13], strafbaar gestelde feit.

      4 De Nederlandse strafwet is toepasselijk op een der in [artikel 10, tweede tot en met vijfde lid][ref14],
      [artikel 10a eerste lid][ref15], [10b, tweede lid][ref16], [10c][ref17],
      [artikel 11, tweede tot en met vierde lid][ref18], en [artikel 11a][ref19] strafbaar gestelde feiten, indien het
      feit is gepleegd aan boord van een buitenlands vaartuig dan wel een vaartuig zonder nationaliteit of een daarmee
      gelijk gesteld vaartuig uit hoofde van het internationale recht, op open zee, en wordt opgetreden in het kader van
      de toepassing van het Verdrag ter uitvoering van artikel 17 van het Verdrag tegen sluikhandel.


