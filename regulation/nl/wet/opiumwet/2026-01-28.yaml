  - number: 13a
    text: |-
      1 Onverminderd het bepaalde in de [artikelen 33 tot en met 34][ref1]
      en [36b tot en met 36d van het Wetboek van Strafrecht][ref2] en
      [artikel 6:1:12 van het Wetboek van Strafvordering][ref3] worden de in [lijst I][ref4] of [II][ref5] bedoelde
      middelen of substanties die deel uitmaken van een stofgroep als bedoeld in [lijst IA][ref6] of de preparaten
      daarvan, met uitzondering van de middelen bedoeld in [artikel 2a, tweede lid][ref7], verbeurd of aan het verkeer
      onttrokken verklaard.

      2 Ontzetting van de in [artikel 28, eerste lid, onder 1°, 2° en 4°, van het Wetboek van Strafrecht][ref8],
      vermelde rechten kan worden uitgesproken bij veroordeling wegens een der in de
      [artikelen 10, tweede tot en met vijfde lid,][ref9][10a, eerste lid][ref10], [10b, tweede lid][ref11],
      [11, derde tot en met vijfde lid][ref12], en [11b, eerste lid][ref13], omschreven misdrijven en de schuldige kan
      worden ontzet van de uitoefening van het beroep waarin hij het misdrijf heeft gepleegd.


