        artikel: '1'
        hoofdstuk: '1'
        afdeling: '6'
  - number: 1.15.2
    text: |-
      De [Algemene wet inzake rijksbelastingen][ref1], met uitzondering van de [artikelen 63][ref2] en [67][ref3], is
      niet van toepassing met betrekking tot de uitvoering van het bepaalde in de [artikelen 1.12][ref4] en [1.13][ref5].
      Voor de toepassing van de artikelen 63 en 67 van de Algemene wet inzake rijksbelastingen betreffende de uitvoering
      van de artikelen 1.12 en 1.13 door Onze Minister of de door hem aangewezen ambtenaren, treedt Onze Minister in de
      plaats van Onze Minister van Financiën.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel63
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel67
      [ref4]: https://wetten.overheid.nl/BWBR0034553#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0034553#Artikel1
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.15
