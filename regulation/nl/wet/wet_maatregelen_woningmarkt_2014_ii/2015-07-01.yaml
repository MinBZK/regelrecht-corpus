preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om vanaf 2014, als onderdeel van de maatregelen
    om de woningmarkt in zowel het huur- als het koopsegment beter te laten functioneren, een heffing in te voeren
    voor verhuurders van woningen in de gereguleerde sector en een tariefsaanpassing aftrek kosten eigen woning in
    de inkomstenbelasting in te voeren waardoor het fiscale voordeel ter zake van de aftrek van dergelijke kosten
    voor zover deze tegen het tarief in de vierde schijf worden vergolden stapsgewijs wordt verkleind, alsmede om
    enkele onduidelijkheden, onbedoelde gevolgen en omissies als gevolg van de invoering van de aflossingseis in de
    inkomstenbelasting te herstellen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Onder de naam verhuurderheffing wordt een belasting geheven van de in [artikel 1.4][ref1] bedoelde
      belastingplichtigen.


      [ref1]: https://wetten.overheid.nl/BWBR0034553#Artikel1
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0034553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '2'
  - number: 1.2.1
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder: - *compensatie:* heffingsvermindering als
      bedoeld in [artikel 1.10][ref1];
        - *diensten van algemeen economisch belang:* diensten van algemeen economisch belang als bedoeld in: 1°. artikel
      106, tweede lid, van het Verdrag betreffende de werking van de Europese Unie, en 2°. het Besluit van de Europese
      Commissie van 20 december 2011 betreffende de toepassing van artikel 106, tweede lid, van het Verdrag betreffende
      de werking van de Europese Unie op staatssteun in de vorm van compensatie voor de openbare dienst, verleend aan
      bepaalde met het beheer van diensten van algemeen economisch belang belaste ondernemingen;
        - *groep:* de combinatie van rechtspersonen in het geval een rechtspersoon meer dan 50% onmiddellijk of middellijk
      deelname heeft: 1°. aan de leiding van een van die combinatie deel uitmakende andere rechtspersoon; 2°. aan het
      toezicht op die andere rechtspersoon, of 3°. in het kapitaal van die andere rechtspersoon;
        - *heffingsjaar:* kalenderjaar waarover de verhuurderheffing is verschuldigd;
        - *huurwoning:* in Nederland gelegen voor verhuur bestemde woning die ingevolge
      [artikel 16 van de Wet waardering onroerende zaken][ref2] als één onroerende zaak
      wordt aangemerkt en waarvan de huurprijs niet hoger is dan het bedrag, genoemd in
      [artikel 13, eerste lid, onderdeel a, van de Wet op de huurtoeslag][ref3], met uitzondering van een woning die
      wordt verhuurd in het kader van het hotel-, pension-, kamp- en vakantiebestedingsbedrijf aan personen die in die
      woning voor een korte periode verblijf houden;
        - *investeringskosten:* door de belastingplichtige betaalde investeringskosten die noodzakelijkerwijs voortvloeien
      uit het verrichten van de activiteiten, bedoeld in het tweede lid, onderdeel b, onder 1° tot en met 6°;
        - *Onze Minister:* Onze Minister voor Wonen en Rijksdienst;
        - *WOZ-waarde:* volgens [hoofdstuk IV van de Wet waardering onroerende zaken][ref4] voor een kalenderjaar
      vastgestelde waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0034553#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0008659#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.2
    references:
      - id: ref1
