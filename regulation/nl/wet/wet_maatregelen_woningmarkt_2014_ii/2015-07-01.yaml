  - number: '8.2'
    text: |-
      Na toepassing van de [artikelen 3.2][ref1], [3.4 tot en met 3.31][ref2] of [5.1 tot en met 5.29][ref3] worden de
      bedragen in kolom III van de tabel in [artikel 2.10, eerste lid, van de Wet inkomstenbelasting 2001][ref4] bij
      ministeriële regeling gewijzigd in de bedragen die na toepassing van die artikelen voortvloeien uit de aan het
      begin van de betreffende jaren in de kolommen I en II van die tabel vermelde bedragen en de in kolom IV van die
      tabel vermelde percentages. De eerste volzin is van overeenkomstige toepassing op de bedragen in kolom III van de
      tabel in [artikel 2.10a, eerste lid, van de Wet inkomstenbelasting 2001][ref5], op de bedragen in kolom III van de
      tabel in [artikel 20a, eerste lid, van de Wet op de loonbelasting 1964][ref6] en op de bedragen in kolom III van de
