        hoofdstuk: IV
  - number: 1.2.2
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt voorts verstaan onder: - *heffingsvermindering:*
      vermindering van de verhuurderheffing op grond van een definitieve investeringsverklaring;
        - *voorgenomen investering:* op of na 1 januari 2014 te verrichten activiteit die betreft: 1°. bouw van
      huurwoningen; 2°. grootschalige verbouw van huurwoningen; 3°. verbouw van niet voor bewoning bestemde ruimten
      tot huurwoningen; 4°. sloop van huurwoningen; 5°. kleinschalige verbouw van huurwoningen, of 6°. samenvoeging van
      huurwoningen teneinde een of meer huurwoningen te verkrijgen;
        - *voorlopige investeringsverklaring:* schriftelijke kennisgeving van Onze Minister aan de aanvrager, met gegevens
      over: 1°. de voorgenomen investering en 2°. het voorlopige bedrag aan heffingsvermindering met een berekening van
      dat bedrag;
        - *gerealiseerde investering:* activiteit die door de belastingplichtige is gerealiseerd ter uitvoering van een
      voorgenomen investering;
        - *definitieve investeringsverklaring:* schriftelijke kennisgeving van Onze Minister aan de belastingplichtige met
      gegevens over: 1°. de gerealiseerde investering en 2°. het bedrag aan heffingsvermindering met een berekening van
      dat bedrag.
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.2
  - number: '1.3'
    text: |-
      Indien er ter zake van een huurwoning meer dan één genothebbende krachtens eigendom, bezit of beperkt recht
      is, wordt voor de verhuurderheffing de huurwoning in aanmerking genomen bij degene aan wie de beschikking,
      bedoeld in [artikel 22 van de Wet waardering onroerende zaken][ref1], ter zake van die huurwoning op de voet van
      [artikel 24, derde en vierde lid, van die wet][ref2] is bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel24
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '24'
  - number: '1.4'
    text: |-
      Belastingplichtig voor de verhuurderheffing is de natuurlijke persoon, de rechtspersoon of de groep die bij aanvang
      van het kalenderjaar het genot krachtens eigendom, bezit of beperkt recht heeft van meer dan tien huurwoningen.
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.4
  - number: '1.5'
    text: De verhuurderheffing wordt geheven naar het belastbare bedrag.
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.5
  - number: '1.6'
    text: |-
      Het belastbare bedrag is de som van de WOZ-waarden van de huurwoningen waarvan de belastingplichtige bij aanvang
      van het kalenderjaar het genot krachtens eigendom, bezit of beperkt recht heeft, verminderd met tien maal de
      gemiddelde WOZ-waarde van die huurwoningen.
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.6
  - number: '1.7'
    text: De verhuurderheffing bedraagt 0,449% van het belastbare bedrag.
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.7
  - number: '1.8'
    text: De verhuurderheffing wordt verschuldigd op 1 januari van het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.8
  - number: 1.9.1
    text: De door een rechtspersoon of natuurlijke persoon verschuldigde verhuurderheffing wordt op aangifte voldaan.
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.9
  - number: 1.9.2
    text: |-
      De door een groep verschuldigde verhuurderheffing wordt namens de groep op aangifte voldaan door een van de
      rechtspersonen die onderdeel is van die groep. Daarbij vermeldt die rechtspersoon welke andere rechtspersonen
      onderdeel uitmaken van die groep, waarbij die andere rechtspersonen in afwijking van het eerste lid ontheven zijn
      van hun plicht tot het voldoen op aangifte.
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.9
  - number: 1.9.3
    text: |-
      De inspecteur kan een naheffingsaanslag ter zake van de door een groep verschuldigde verhuurderheffing opleggen aan
      een van de rechtspersonen die onderdeel uitmaken van die groep.
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.9
  - number: 1.9.4
    text: |-
      De ontvanger kan een naheffingsaanslag ter zake van de door een groep verschuldigde verhuurderheffing invorderen
      ten name van elk van de rechtspersonen die onderdeel uitmaken van die groep.
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.9
  - number: 1.9.5
    text: |-
      In afwijking van [artikel 10, tweede lid, tweede volzin, van de Algemene wet inzake rijksbelastingen][ref1] stelt
      de inspecteur de termijn voor het doen van aangifte zodanig vast dat deze niet eerder verstrijkt dan negen maanden
      na het tijdstip waarop de belastingschuld is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel10
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.9
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '10'
  - number: 1.9.6
    text: |-
      In afwijking van [artikel 19, derde lid, van de Algemene wet inzake rijksbelastingen][ref1] is de
      belastingplichtige gehouden de verhuurderheffing aan de ontvanger overeenkomstig de aangifte te betalen binnen
      negen maanden na het tijdstip waarop de belastingschuld is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel19
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.9
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '19'
  - number: 1.10.1
    text: |-
      De belastingplichtige die beschikt over een op zijn naam of, in het geval van een groep, op naam van een van
      de rechtspersonen die onderdeel uitmaakt van de groep afgegeven definitieve investeringsverklaring met een
      dagtekening in een kalenderjaar dat ten hoogste drie jaren voor het heffingsjaar ligt of voor 1 oktober in
      het heffingsjaar zelf, kan het bedrag van de verhuurderheffing verminderen met het in die verklaring opgenomen
      bedrag van de heffingsvermindering; in dat geval brengt de belastingplichtige het volledige in de definitieve
      investeringsverklaring genoemde bedrag van de heffingsvermindering in mindering voor zover dit niet hoger is dan
      het bedrag van de verhuurderheffing.
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.10
  - number: 1.10.2
    text: |-
      Indien het bedrag van de heffingsvermindering hoger is dan het bedrag van de verhuurderheffing, kan de
      belastingplichtige het deel van het bedrag van de heffingsvermindering in mindering brengen dat gelijk is aan de
      verhuurderheffing. De belastingplichtige kan het deel van het bedrag van de heffingsvermindering, dat hij in enig
      heffingsjaar niet op het bedrag van de verhuurderheffing in mindering heeft kunnen brengen, in mindering brengen op
      de over een volgend heffingsjaar verschuldigde verhuurderheffing, doch niet later dan in het heffingsjaar dat ten
      hoogste drie jaren ligt na het jaar van de dagtekening van de definitieve investeringsverklaring.
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.10
  - number: 1.11.1
    text: 'De heffingsvermindering bedraagt in geval van:'
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.11
  - number: 1.11.1.a
    text: 'bouw van huurwoningen: € 15.000 per gebouwde huurwoning;'
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.11
  - number: 1.11.1.b
    text: 'grootschalige verbouw van huurwoningen: € 15.000 per verbouwde huurwoning;'
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.11
  - number: 1.11.1.c
    text: 'verbouw van niet voor bewoning bestemde ruimten tot huurwoningen: € 10.000 per gerealiseerde huurwoning;'
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.11
  - number: 1.11.1.d
    text: 'sloop van huurwoningen: € 15.000 per gesloopte huurwoning;'
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.11
  - number: 1.11.1.e
    text: 'kleinschalige verbouw van huurwoningen: € 10.000 per verbouwde huurwoning en'
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.11
  - number: 1.11.1.f
    text: |-
      samenvoeging van huurwoningen teneinde een of meer huurwoningen te verkrijgen: € 15.000 per huurwoning waarmee het
      aantal huurwoningen door die samenvoeging is verminderd.
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.11
  - number: 1.11.2
    text: 'De heffingsvermindering is:'
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.11
  - number: 1.11.2.a
    text: |-
      met betrekking tot gerealiseerde investeringen als bedoeld in het eerste lid, onderdelen a, b en e, uitsluitend van
      toepassing in de deelgemeenten Charlois, Feijenoord en IJsselmonde van de gemeente Rotterdam, en
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.11
  - number: 1.11.2.b
    text: |-
      met betrekking tot gerealiseerde investeringen als bedoeld in het eerste lid, onderdelen d en f, uitsluitend van
      toepassing in de in onderdeel a genoemde deelgemeenten en in de gemeenten Appingedam, Beek, Bellingwedde, Brunssum,
      De Marne, Delfzijl, Eemsmond, Eijsden-Margraten, Gulpen-Wittem, Heerlen, Hulst, Kerkrade, Landgraaf, Loppersum,
      Maastricht, Meerssen, Menterwolde, Nuth, Oldambt, Onderbanken, Pekela, Schinnen, Simpelveld, Sittard-Geleen, Sluis,
      Stadskanaal, Stein, Terneuzen, Vaals, Valkenburg aan de Geul, Veendam, Vlagtwedde en Voerendaal.
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.11
  - number: 1.11.3
    text: |-
      Gerealiseerde investeringen worden voor de toepassing van de heffingsvermindering slechts
      in aanmerking genomen indien de investeringskosten voor de activiteiten, bedoeld in
      [artikel 1.2, tweede lid, onderdeel b, onder 3° en 5°][ref1], per huurwoning ten minste € 25.000 bedragen,
      en voor de activiteiten, bedoeld onder 1°, 2°, 4° en 6° van dat onderdeel, per huurwoning ten minste € 37.500
      bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0034553#Artikel1
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0034553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1'
  - number: 1.11.4
    text: |-
      Indien naar het oordeel van Onze Minister op enig tijdstip onvoldoende evenwicht bestaat of komt te bestaan tussen
      de heffingsverminderingen en het daarvoor in de rijksbegroting opgenomen bedrag, kunnen bij ministeriële regeling
      met ingang van 1 januari, 1 april, 1 juli of 1 oktober van enig jaar de in het eerste lid en derde lid genoemde
      bedragen worden verhoogd, verlaagd, dan wel op nihil worden gesteld. De nieuwe bedragen gelden voor voorlopige
      investeringsverklaringen waarvan de voorgenomen investering is aangemeld na het tijdstip waarop de ministeriële
      regeling in werking treedt.
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.11
  - number: 1.11.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het toepassingsbereik van
      de verschillende onderdelen van het eerste lid. Bij ministeriële regeling kan de begrenzing van de deelgemeenten,
      genoemd in het tweede lid, onderdeel a, nader worden aangeduid.
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.11
  - number: 1.12.1
    text: |-
      Een voorgenomen investering wordt uiterlijk op 31 december 2017 langs elektronische weg aangemeld bij Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.12
  - number: 1.12.2
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de inhoud van de aanmelding en welke gegevens daarbij
      worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.12
  - number: 1.12.3
    text: |-
      Onze Minister geeft met betrekking tot de aanmelding, bedoeld in het eerste lid, uitsluitend een voorlopige
      investeringsverklaring af indien:
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.12
  - number: 1.12.3.a
    text: de voorgenomen investering voldoet aan het daarover bij of krachtens deze wet bepaalde en
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.12
  - number: 1.12.3.b
    text: |-
      niet aannemelijk is dat ter verkrijging van die verklaring gegevens of bescheiden zijn verstrekt die zodanig
      onjuist of onvolledig zijn dat op de aanmelding een andere beslissing zou zijn genomen indien bij de beoordeling
      daarvan de juiste en volledige gegevens of bescheiden bekend zouden zijn geweest.
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.12
  - number: 1.12.4
    text: 'De voorlopige investeringsverklaring vervalt indien:'
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.12
  - number: 1.12.4.a
    text: |-
      een voorgenomen investering als bedoeld in [artikel 1.2, tweede lid, onderdeel b, onder 1°, 2° of 3°][ref1],
      niet binnen vijf jaar nadat deze overeenkomstig het bepaalde bij en krachtens het eerste en tweede lid is
      aangemeld, als investering is aangemeld, of


      [ref1]: https://wetten.overheid.nl/BWBR0034553#Artikel1
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.12
    references:
      - id: ref1
        bwb_id: BWBR0034553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1'
  - number: 1.12.4.b
    text: |-
      een voorgenomen investering als bedoeld in [artikel 1.2, tweede lid, onderdeel b, onder 4°, 5° of 6°][ref1],
      niet binnen drie jaar nadat deze overeenkomstig het bepaalde bij en krachtens het eerste en tweede lid is
      aangemeld, als investering is aangemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0034553#Artikel1
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.12
    references:
      - id: ref1
        bwb_id: BWBR0034553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1'
  - number: 1.12.5
    text: 'Onze Minister kan een voorlopige investeringsverklaring intrekken indien:'
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.12
  - number: 1.12.5.a
    text: de voorgenomen investering niet voldoet aan het daarover bij of krachtens deze wet bepaalde of
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.12
  - number: 1.12.5.b
    text: |-
      aannemelijk is dat ter verkrijging van die verklaring gegevens of bescheiden zijn verstrekt die zodanig onjuist of
      onvolledig zijn dat op de aanmelding een andere beslissing zou zijn genomen indien bij de beoordeling daarvan de
      juiste en volledige gegevens of bescheiden bekend zouden zijn geweest.
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.12
  - number: 1.12.6
    text: |-
      De voorlopige investeringsverklaring is een besluit in de zin van
      [artikel 1:3 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
  - number: 1.13.1
    text: |-
      Een gerealiseerde investering wordt langs elektronische weg aangemeld door de belastingplichtige bij Onze Minister.
      [Artikel 1.12, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0034553#Artikel1
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.13
    references:
      - id: ref1
        bwb_id: BWBR0034553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '6'
  - number: 1.13.2
    text: |-
      Onze Minister geeft met betrekking tot de aanmelding, bedoeld in het eerste lid, uitsluitend een definitieve
      investeringsverklaring af indien:
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.13
  - number: 1.13.2.a
    text: |-
      met betrekking tot de daarin opgenomen gerealiseerde investering een voorlopige investeringsverklaring is afgegeven
      en deze niet is vervallen of ingetrokken;
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.13
  - number: 1.13.2.b
    text: de gerealiseerde investering voldoet aan het daarover bij of krachtens deze wet bepaalde;
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.13
  - number: 1.13.2.c
    text: |-
      niet aannemelijk is dat ter verkrijging van die verklaring gegevens of bescheiden zijn verstrekt die zodanig
      onjuist of onvolledig zijn dat op de aanmelding een andere beslissing zou zijn genomen indien bij de beoordeling
      daarvan de juiste en volledige gegevens of bescheiden bekend zouden zijn geweest en
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.13
  - number: 1.13.2.d
    text: |-
      in geval sprake is van een gerealiseerde investering als bedoeld in
      [artikel 1.2, tweede lid, onderdeel b, onder 2° of 5°][ref1]: voor dezelfde huurwoning niet eerder een
      definitieve investeringsverklaring met betrekking tot een zodanige gerealiseerde investering is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0034553#Artikel1
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.13
    references:
      - id: ref1
        bwb_id: BWBR0034553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1'
  - number: 1.13.3
    text: |-
      Het in een definitieve investeringsverklaring opgenomen bedrag aan heffingsvermindering is niet hoger dan het
      bedrag dat ten aanzien van de voorgenomen investering is opgenomen in de voorlopige investeringsverklaring.
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.13
  - number: 1.13.4
    text: |-
      [Artikel 1.12, vijfde en zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0034553#Artikel1
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.13
    references:
      - id: ref1
        bwb_id: BWBR0034553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '6'
  - number: 1.14.1
    text: |-
      Als diensten van algemeen economisch belang zijn aan de belastingplichtige opgedragen de activiteiten, bedoeld in
      [artikel 1.2, tweede lid, onderdeel b, onder 1° tot en met 6°][ref1], juncto [artikel 1.11, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0034553#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0034553#Artikel1
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.14
    references:
      - id: ref1
        bwb_id: BWBR0034553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0034553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '6'
  - number: 1.14.2
    text: |-
      De belastingplichtige komt uitsluitend compensatie toe voor de activiteiten, genoemd in het eerste lid. Bij
      ministeriële regeling worden nadere voorschriften gegeven omtrent de compensatie.
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.14
  - number: 1.14.3
    text: De opdracht, bedoeld in het eerste lid, heeft een werkingsduur van vier jaar.
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.14
  - number: 1.14.4
    text: |-
      [Artikel 25d van de Mededingingswet][ref1] is niet van toepassing op de belastingplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25d
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.14
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 25d
  - number: 1.14.5
    text: |-
      De administratie, de jaarrekeningen en de jaarverslagen van de belastingplichtige worden met inachtneming van
      [artikel 25b, eerste lid, van de Mededingingswet ][ref1]ingericht. Bij ministeriële regeling worden nadere
      voorschriften gegeven omtrent de inrichting van de administratie, bedoeld in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25b
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.14
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 25b
  - number: 1.15.1
    text: |-
      Met het toezicht op de naleving van het bij of krachtens de [artikelen 1.12][ref1] en [1.13][ref2] bepaalde zijn
      belast de bij besluit van Onze Minister aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0034553#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0034553#Artikel1
    url: https://wetten.overheid.nl/BWBR0034553/2015-07-01#Artikel1.15
    references:
