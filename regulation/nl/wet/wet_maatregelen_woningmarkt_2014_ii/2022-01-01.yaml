  - number: 1.11.4
    text: |-
      Indien naar het oordeel van Onze Minister op enig tijdstip onvoldoende evenwicht bestaat of komt te bestaan tussen
      de heffingsverminderingen en het daarvoor in de rijksbegroting opgenomen bedrag, kunnen bij ministeriële regeling
      met ingang van de eerste dag van enige maand de in het eerste lid en derde lid genoemde bedragen worden verhoogd,
      verlaagd, dan wel op nihil worden gesteld. De nieuwe bedragen gelden voor voorlopige investeringsverklaringen
      waarvan de voorgenomen investering is aangemeld na het tijdstip waarop de ministeriële regeling in werking treedt.
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.11
  - number: 1.11.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het toepassingsbereik
      van de verschillende onderdelen van het eerste lid. Bij ministeriële regeling kan de begrenzing van de gebieden,
      genoemd in het tweede lid, onderdeel a, nader worden aangevuld, kunnen de gemeenten, bedoeld in het tweede
      lid, onderdelen b en c, de gemeenten, genoemd in [bijlage 1][ref1] bij deze wet, en de gemeenten, genoemd in
      [bijlage 2][ref2] bij deze wet, worden gewijzigd indien dit noodzakelijk is ten gevolge van een wijziging van de
      gemeentelijke indeling als bedoeld in [artikel 1, onderdeel b, van de Wet algemene regels herindeling][ref3], en
      kunnen gemeenten waarmee Onze Minister afspraken heeft gemaakt over de bouw van huurwoningen worden toegevoegd aan
      bijlage 2.


