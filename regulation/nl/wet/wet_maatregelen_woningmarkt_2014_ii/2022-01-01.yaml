      onjuist of onvolledig zijn dat op de aanmelding een andere beslissing zou zijn genomen indien bij de beoordeling
      daarvan de juiste en volledige gegevens of bescheiden bekend zouden zijn geweest.
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.12
  - number: 1.12.5
    text: 'De voorlopige investeringsverklaring vervalt indien:'
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.12
  - number: 1.12.5.a
    text: |-
      een voorgenomen investering als bedoeld in [artikel 1.2, tweede lid, onderdeel b, onder 1°, 2°, 3° of 4°][ref1],
      niet binnen vijf jaar nadat deze overeenkomstig het bepaalde bij en krachtens het eerste en tweede lid is
      aangemeld, als investering is aangemeld, of


      [ref1]: https://wetten.overheid.nl/BWBR0034553#Artikel1
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.12
    references:
      - id: ref1
        bwb_id: BWBR0034553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1'
  - number: 1.12.5.b
    text: |-
      een voorgenomen investering als bedoeld in [artikel 1.2, tweede lid, onderdeel b, onder 5°, 6°, 7° of 8°][ref1],
      niet binnen drie jaar nadat deze overeenkomstig het bepaalde bij en krachtens het eerste en tweede lid is
      aangemeld, als investering is aangemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0034553#Artikel1
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.12
    references:
      - id: ref1
        bwb_id: BWBR0034553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1'
  - number: 1.12.6
    text: 'Onze Minister kan een voorlopige investeringsverklaring intrekken indien:'
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.12
  - number: 1.12.6.a
    text: de voorgenomen investering niet voldoet aan het daarover bij of krachtens deze wet bepaalde of
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.12
  - number: 1.12.6.b
    text: |-
      aannemelijk is dat ter verkrijging van die verklaring gegevens of bescheiden zijn verstrekt die zodanig onjuist of
      onvolledig zijn dat op de aanmelding een andere beslissing zou zijn genomen indien bij de beoordeling daarvan de
      juiste en volledige gegevens of bescheiden bekend zouden zijn geweest.
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.12
  - number: 1.12.7
    text: |-
      De voorlopige investeringsverklaring is een besluit in de zin van
      [artikel 1:3 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
  - number: 1.12.8
    text: |-
      Voorgenomen investeringen binnen het grondgebied van de opgeheven gemeente Menterwolde die uiterlijk op 31 december
      2017 zijn aangemeld op grond van het eerste lid, kunnen na uitvoering aangemeld worden als gerealiseerde
      investering. Op deze investeringen zijn de bepalingen uit deze wet die van toepassing zijn op investeringen in de
      gemeenten, genoemd in [artikel 1.11, tweede lid, onderdeel b][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0034553#Artikel1
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.12
    references:
      - id: ref1
        bwb_id: BWBR0034553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '6'
  - number: 1.13.1
    text: |-
      Een gerealiseerde investering wordt langs elektronische weg aangemeld door de belastingplichtige bij Onze Minister.
      [Artikel 1.12, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0034553#Artikel1
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.13
    references:
      - id: ref1
        bwb_id: BWBR0034553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '6'
  - number: 1.13.2
    text: |-
      Onze Minister geeft met betrekking tot de aanmelding, bedoeld in het eerste lid, uitsluitend een definitieve
      investeringsverklaring af indien:
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.13
  - number: 1.13.2.a
    text: |-
      met betrekking tot de daarin opgenomen gerealiseerde investering een voorlopige investeringsverklaring is afgegeven
      en deze niet is vervallen of ingetrokken;
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.13
  - number: 1.13.2.b
    text: de gerealiseerde investering voldoet aan het daarover bij of krachtens deze wet bepaalde;
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.13
  - number: 1.13.2.c
    text: |-
      niet aannemelijk is dat ter verkrijging van die verklaring gegevens of bescheiden zijn verstrekt die zodanig
      onjuist of onvolledig zijn dat op de aanmelding een andere beslissing zou zijn genomen indien bij de beoordeling
      daarvan de juiste en volledige gegevens of bescheiden bekend zouden zijn geweest;
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.13
  - number: 1.13.2.d
    text: |-
      in geval sprake is van een gerealiseerde investering als bedoeld in
      [artikel 1.2, tweede lid, onderdeel b, onder 3° of 6°][ref1]: voor dezelfde huurwoning niet eerder een
      definitieve investeringsverklaring met betrekking tot een zodanige gerealiseerde investering is afgegeven; en


      [ref1]: https://wetten.overheid.nl/BWBR0034553#Artikel1
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.13
    references:
      - id: ref1
        bwb_id: BWBR0034553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1'
  - number: 1.13.2.e
    text: |-
      ingeval sprake is van een gerealiseerde investering als bedoeld in
      [artikel 1.2. tweede lid, onderdeel b, onder 8°][ref1]: voor dezelfde investering geen subsidie is vastgesteld
      voor de verbetering van de energieprestatie bij of krachtens de [Kaderwet overige BZK-subsidies][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0034553#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0019756
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.13
    references:
      - id: ref1
        bwb_id: BWBR0034553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0019756
  - number: 1.13.3
    text: |-
      Het in een definitieve investeringsverklaring opgenomen bedrag aan heffingsvermindering is niet hoger dan het
      bedrag dat ten aanzien van de voorgenomen investering is opgenomen in de voorlopige investeringsverklaring.
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.13
  - number: 1.13.4
    text: |-
      [Artikel 1.12, zesde en zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0034553#Artikel1
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.13
    references:
      - id: ref1
        bwb_id: BWBR0034553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '6'
  - number: 1.13.5
    text: |-
      In het besluit tot intrekking van een definitieve investeringsverklaring wordt het bedrag vermeld waarmee de
      heffingsvermindering wordt verminderd. Onze minister verstrekt het in dit lid bedoelde besluit aan de inspecteur,
      bedoeld in [artikel 2, derde lid, onderdeel b, van de Algemene wet inzake rijksbelastingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel2
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.13
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '2'
  - number: 1.14.1
    text: |-
      Als diensten van algemeen economisch belang zijn aan de belastingplichtige opgedragen de activiteiten, bedoeld in
      [artikel 1.2, tweede lid, onderdeel b, onder 1° tot en met 8°][ref1], juncto [artikel 1.11, tweede lid][ref2], en
      [artikel 1.6, tweede en vierde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0034553#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0034553#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0034553#Artikel1
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.14
    references:
      - id: ref1
        bwb_id: BWBR0034553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0034553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '6'
      - id: ref3
        bwb_id: BWBR0034553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '3'
  - number: 1.14.2
    text: |-
      De belastingplichtige komt uitsluitend compensatie toe voor de activiteiten, genoemd in het eerste lid. Bij
      ministeriële regeling worden nadere voorschriften gegeven omtrent de compensatie.
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.14
  - number: 1.14.3
    text: 'De opdracht, bedoeld in het eerste lid, heeft een werkingsduur van:'
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.14
  - number: 1.14.3.a
    text: |-
      tien jaar voor zover het activiteiten als bedoeld in
      [artikel 1.2, tweede lid, onderdeel b, onder 1° tot en met 7°][ref1], betreft;


      [ref1]: https://wetten.overheid.nl/BWBR0034553#Artikel1
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.14
    references:
      - id: ref1
        bwb_id: BWBR0034553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1'
  - number: 1.14.3.b
    text: |-
      tien jaar voor zover het een activiteit als bedoeld in [artikel 1.2, tweede lid, onderdeel b, onder 8°][ref1],
      betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0034553#Artikel1
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.14
    references:
      - id: ref1
        bwb_id: BWBR0034553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1'
  - number: 1.14.4
    text: |-
      [Artikel 25d van de Mededingingswet][ref1] is niet van toepassing op de belastingplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25d
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.14
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 25d
  - number: 1.14.5
    text: |-
      De administratie, de jaarrekeningen en de jaarverslagen van de belastingplichtige worden met inachtneming van
      [artikel 25b, eerste lid, van de Mededingingswet][ref1] ingericht. Bij ministeriële regeling worden nadere
      voorschriften gegeven omtrent de inrichting van de administratie, bedoeld in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25b
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.14
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 25b
  - number: 1.15.1
    text: |-
      Met het toezicht op de naleving van het bij of krachtens de [artikelen 1.6, tweede, vierde en achtste lid][ref1],
      [1.12][ref2] en [1.13][ref3] bepaalde zijn belast de bij besluit van Onze Minister aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0034553#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0034553#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0034553#Artikel1
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.15
    references:
      - id: ref1
        bwb_id: BWBR0034553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0034553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '6'
      - id: ref3
        bwb_id: BWBR0034553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '6'
  - number: 1.15.2
    text: |-
      De [Algemene wet inzake rijksbelastingen][ref1], met uitzondering van de [artikelen 63][ref2]
      en [67][ref3], is niet van toepassing met betrekking tot de uitvoering van het bepaalde in de
      [artikelen 1.6, tweede, vierde en achtste lid][ref4], [1.12][ref5] en [1.13][ref6]. Voor de toepassing van de
      artikelen 63 en 67 van de Algemene wet inzake rijksbelastingen betreffende de uitvoering van de artikelen 1.6,
      tweede, vierde en achtste lid, 1.12 en 1.13 door Onze Minister of de door hem aangewezen ambtenaren, treedt Onze
      Minister in de plaats van Onze Minister van Financiën.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel63
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel67
      [ref4]: https://wetten.overheid.nl/BWBR0034553#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0034553#Artikel1
      [ref6]: https://wetten.overheid.nl/BWBR0034553#Artikel1
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.15
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '63'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '67'
      - id: ref4
        bwb_id: BWBR0034553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '3'
      - id: ref5
        bwb_id: BWBR0034553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '6'
      - id: ref6
        bwb_id: BWBR0034553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '6'
  - number: 1.15.3
    text: |-
      De in de [artikelen 47][ref1], [47a][ref2], [47b][ref3], [48 tot en met 51][ref4] en
      [53, eerste en vierde lid, tot en met 56 van de Algemene wet inzake rijksbelastingen][ref5] jegens de inspecteur
      opgelegde verplichtingen gelden mede jegens de door Onze Minister met betrekking tot de toepassing van de
      [artikelen 1.6, tweede, vierde en achtste lid][ref6], [1.12][ref7] en [1.13][ref8] door op grond van het eerste lid
      aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel47a
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel47b
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel48
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel53
      [ref6]: https://wetten.overheid.nl/BWBR0034553#Artikel1
      [ref7]: https://wetten.overheid.nl/BWBR0034553#Artikel1
      [ref8]: https://wetten.overheid.nl/BWBR0034553#Artikel1
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.15
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '47'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 47a
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 47b
      - id: ref4
        bwb_id: BWBR0002320
        artikel: '48'
      - id: ref5
        bwb_id: BWBR0002320
        artikel: '53'
      - id: ref6
        bwb_id: BWBR0034553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '3'
      - id: ref7
        bwb_id: BWBR0034553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '6'
      - id: ref8
        bwb_id: BWBR0034553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '6'
  - number: 1.15.4
    text: |-
      De [artikelen 68][ref1], [69][ref2] en [72 van de Algemene wet inzake rijksbelastingen][ref3] zijn van
      overeenkomstige toepassing op het bepaalde in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel69
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel72
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.15
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '68'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '69'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '72'
  - number: '2.1'
    text: |-
      Indien [artikel 5.36 van de Omgevingswet][ref1] in werking treedt, komt
      [artikel 1.6, vierde lid, onderdeel a][ref2], op hetzelfde tijdstip te luiden:


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0034553#Artikel1
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0034553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '3'
  - number: 2.1.a
    text: |-
      hiervoor een omgevingsvergunning als bedoeld in artikel 5.36 van de Omgevingswet, voor een termijn van maximaal
      vijftien jaren, is verleend voor een tijdelijk bouwwerk;
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel2.1
  - number: '2.2'
    text: |-
      De termijn, bedoeld in [artikel 1.12, vijfde lid][ref1], die verstrijkt in de kalenderjaren 2020, 2021 of 2022
      wordt verlengd met een jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0034553#Artikel1
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0034553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '6'
  - number: '2.6'
    text: |-
      Met ingang van 1 januari 2024 wordt in [artikel 1.7][ref1] het genoemde percentage verhoogd met 0,001 procentpunt.


      [ref1]: https://wetten.overheid.nl/BWBR0034553#Artikel1
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0034553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '4'
  - number: '2.7'
    text: |-
      Met ingang van 1 januari 2037 wordt in [artikel 1.7][ref1] het genoemde percentage verlaagd met 0,001 procentpunt.


      [ref1]: https://wetten.overheid.nl/BWBR0034553#Artikel1
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0034553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '4'
  - number: 8.2a
    text: |-
      Onze Minister voor Wonen en Rijksdienst zendt in overeenstemming met Onze Minister van Financiën binnen 3 jaar na
      de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van
      [hoofdstuk 1][ref1] van deze wet in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0034553#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel8.2a
    references:
      - id: ref1
        bwb_id: BWBR0034553
        hoofdstuk: '1'
  - number: 8.3.1
    text: 'Deze wet treedt in werking met ingang van 1 januari 2014, met dien verstande dat:'
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel8.3
  - number: 8.3.1.a
    text: |-
      de [artikelen 3.1][ref1] en [4.1][ref2] terugwerken tot en met 1 januari 2013;


      [ref1]: https://wetten.overheid.nl/BWBR0034553#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0034553#Artikel4
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0034553
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0034553
        artikel: '4'
        hoofdstuk: '4'
  - number: 8.3.1.b
    text: |-
      [artikel 3.1, onderdeel A][ref1], eerst toepassing vindt nadat [artikel I van het Belastingplan 2014][ref2] en
      [artikel I van Overige fiscale maatregelen 2014][ref3] zijn toegepast;


      [ref1]: https://wetten.overheid.nl/BWBR0034553#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0034538#ArtikelI
      [ref3]: https://wetten.overheid.nl/BWBR0034526#ArtikelI
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0034553
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0034538
        artikel: I
