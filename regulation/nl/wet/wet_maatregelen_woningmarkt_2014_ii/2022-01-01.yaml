  - number: 1.2.2
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt voorts verstaan onder: - *heffingsvermindering:*
      vermindering van de verhuurderheffing op grond van een definitieve investeringsverklaring;
        - *voorgenomen investering:* te verrichten activiteit die betreft: 1°. bouw van
      huurwoningen waarvan de huurprijs gelijk of hoger is dan het bedrag, genoemd in
      [artikel 20, tweede lid, onderdeel a, van de Wet op de huurtoeslag][ref1]; 2°.
      bouw van huurwoningen waarvan de huurprijs lager is dan het bedrag, genoemd in
      [artikel 20, tweede lid, onderdeel a, van de Wet op de huurtoeslag][ref2]; 3°. grootschalige verbouw van
      huurwoningen; 4°. verbouw van niet voor bewoning bestemde ruimten tot huurwoningen; 5°. sloop van huurwoningen;
      6°. kleinschalige verbouw van huurwoningen; 7°. samenvoeging van huurwoningen teneinde een of meer huurwoningen te
      verkrijgen; of 8°. verduurzaming van huurwoningen;
        - *voorlopige investeringsverklaring:* schriftelijke kennisgeving van Onze Minister aan de aanvrager, met gegevens
      over: 1°. de voorgenomen investering en 2°. het voorlopige bedrag aan heffingsvermindering met een berekening van
      dat bedrag;
        - *gerealiseerde investering:* activiteit die door de belastingplichtige is gerealiseerd ter uitvoering van een
      voorgenomen investering;
        - *definitieve investeringsverklaring:* schriftelijke kennisgeving van Onze Minister aan de belastingplichtige met
      gegevens over: 1°. de gerealiseerde investering en 2°. het bedrag aan heffingsvermindering met een berekening van
      dat bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel20
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.2
