  - number: 1.2.3
    text: |-
      Het bedrag, bedoeld in het eerste lid, onderdeel h, wordt jaarlijks met ingang van elk kalenderjaar bij
      ministeriële regeling gewijzigd met het percentage waarmee het gemiddelde van de woningwaarden in het voorafgaande
      kalenderjaar gewijzigd is ten opzichte van het gemiddelde van die waarden in het daaraan voorafgaande kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.2
  - number: '1.4'
    text: |-
      Belastingplichtig voor de verhuurderheffing is de natuurlijke persoon, de rechtspersoon of de groep die bij aanvang
      van het kalenderjaar het genot krachtens eigendom, bezit of beperkt recht heeft van meer dan vijftig huurwoningen.
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.4
  - number: '1.5'
    text: De verhuurderheffing wordt geheven naar het belastbare bedrag.
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.5
  - number: 1.6.1
    text: |-
      Het belastbare bedrag is de som van de WOZ-waarden van de huurwoningen waarvan de belastingplichtige bij aanvang
      van het kalenderjaar het genot krachtens eigendom, bezit of beperkt recht heeft, verminderd, doch niet verder dan
      tot nihil, met vijftig maal de gemiddelde WOZ-waarde van die huurwoningen.
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.6
  - number: 1.6.2
    text: |-
      Van de huurwoningen, bedoeld in het eerste lid, zijn uitgezonderd de huurwoningen die de belastingplichtige
      in eigendom verwerft tussen 1 januari 2017 en 31 december 2021 voor zover de belastingplichtige een toegelaten
      instelling is als bedoeld in [artikel 1 van de Woningwet][ref1] en voor zover die huurwoningen:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
  - number: 1.6.2.a
    text: |-
      gelegen zijn in een gemeente als bedoeld in [artikel 1.11, tweede lid, onderdelen b en c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034553#Artikel1
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0034553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '6'
  - number: 1.6.2.b
    text: |-
      zijn opgenomen in een plan dat beoogt uitvoering te geven aan een activiteit in het kader van stedelijke
      vernieuwing als bedoeld in [artikel 1, eerste lid, van de Woningwet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
  - number: 1.6.2.c
    text: de belastingplichtige hiervoor een verklaring heeft van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.6
  - number: 1.6.3
    text: |-
      De uitzondering, bedoeld in het tweede lid, geldt voor een periode van twintig jaren nadat de huurwoning in
      eigendom is verworven.
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.6
  - number: 1.6.4
    text: |-
      Van de huurwoningen, bedoeld in het eerste lid, zijn voorts uitgezonderd de huurwoningen die de belastingplichtige
      realiseert in de periode van 1 januari 2020 tot en met 31 december 2024 voor zover:
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.6
  - number: 1.6.4.a
    text: |-
      hiervoor een omgevingsvergunning als bedoeld in
      [artikel 2.23a, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref1] met een termijn van maximaal
      vijftien jaren is verleend voor een tijdelijk bouwwerk;


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 1.6.4.b
    text: |-
      voor de bouw van die huurwoningen geen heffingsvermindering als bedoeld in
      [artikel 1.11, eerste lid, onderdeel o][ref1], is verleend; en


      [ref1]: https://wetten.overheid.nl/BWBR0034553#Artikel1
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0034553
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '6'
  - number: 1.6.4.c
    text: de belastingplichtige hiervoor een verklaring heeft van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.6
  - number: 1.6.5
    text: |-
      De uitzondering, bedoeld in het vierde lid, geldt voor een periode van vijftien jaren nadat de huurwoning is
      gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.6
  - number: 1.6.6
    text: 'Onze Minister kan overgaan tot intrekking van:'
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.6
  - number: 1.6.6.a
    text: |-
      een verklaring als bedoeld in het tweede lid, onderdeel c, indien niet wordt voldaan aan de voorwaarde, bedoeld in
      het tweede lid, onderdeel b;
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.6
  - number: 1.6.6.b
    text: |-
      een verklaring als bedoeld in het vierde lid, onderdeel c, indien niet wordt voldaan aan de voorwaarde, bedoeld in
      het vierde lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.6
  - number: 1.6.7
    text: |-
      De aanvraag om in aanmerking te komen voor de toepassing van de uitzondering, bedoeld in het tweede of vierde lid,
      wordt langs elektronische weg ingediend bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.6
  - number: 1.6.8
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de toepassing van het tweede,
      vierde en zesde lid, alsmede omtrent de aanvraag, bedoeld in het zevende lid.
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.6
  - number: 1.6a
    text: |-
      Voor de toepassing van de [artikelen 1.4][ref1] en [1.6][ref2] wordt een huurwoning waarvan het genot krachtens
      eigendom, bezit of beperkt recht wordt gedeeld door twee of meer natuurlijke personen, rechtspersonen of groepen,
      in aanmerking wordt genomen bij elk van deze natuurlijke personen, rechtspersonen of groepen, naar rato van de mate
      van de eigendom, onderscheidenlijk het bezit of het beperkt recht.


      [ref1]: https://wetten.overheid.nl/BWBR0034553#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0034553#Artikel1
    url: https://wetten.overheid.nl/BWBR0034553/2022-01-01#Artikel1.6a
    references:
      - id: ref1
