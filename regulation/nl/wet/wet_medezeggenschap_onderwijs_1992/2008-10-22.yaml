  - number: '27'
    text: |-
      1 Het bevoegd gezag kan een deelraad instellen voor:

      a. een school met ten minste 600 leerlingen, die deel uitmaakt van een scholengemeenschap voor voortgezet onderwijs
      of van een scholengemeenschap als bedoeld in [artikel 2.6 van de Wet educatie en beroepsonderwijs][ref1], en

      b. ten behoeve van de betrokkenen bij een of meer organisatorische eenheden van een instelling voor educatie en
      beroepsonderwijs als bedoeld in de [Wet educatie en beroepsonderwijs][ref2], dan wel indien geen organisatorische
      eenheden zijn ingesteld, ten behoeve van de betrokkenen bij een of meer beroepsopleidingen en opleidingen educatie,
      verbonden aan de instelling.

      2 Onverminderd het bepaalde in het eerste lid, wordt een deelraad in ieder geval ingesteld, indien de
      medezeggenschapsraad dit wenst.

      3 Een deelraad is bevoegd desgevraagd of uit eigen beweging advies uit te brengen aan de medezeggenschapsraad over
      aangelegenheden die het desbetreffende deel van de school of de scholengemeenschap in het bijzonder aangaan.

      4 [Artikel 3][ref3], tweede tot en met vijfde en zevende tot en met tiende lid, is van overeenkomstige toepassing.

      5 Volgens regels, vastgesteld in het medezeggenschapsreglement, kan de medezeggenschapsraad de uitoefening van een
      bevoegdheid op grond van de [artikelen 6][ref4] tot en met [9][ref5], dan wel op grond van het bepaalde in het
      medezeggenschapsreglement krachtens [artikel 15, tweede lid][ref6], overdragen aan een deelraad voor zover het een
      aangelegenheid betreft die het desbetreffende deel van de school of de scholengemeenschap in het bijzonder aangaat.

      6 Ten aanzien van de op grond van het vijfde lid aan de deelraad overgedragen bevoegdheden zijn de
      [artikelen 12][ref7] en [13][ref8] van overeenkomstige toepassing.


