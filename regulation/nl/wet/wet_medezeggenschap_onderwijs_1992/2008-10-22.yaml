  - number: '17'
    text: |-
      1 De geldigheidsduur van bijzondere advies- en instemmingsbevoegdheden die ingevolge de toepassing van artikel 15,
      tweede lid onderdelen *a* tot en met *d*, in het medezeggenschapsreglement zijn opgenomen, bedraagt ten hoogste
      twee jaren. Zodra de termijn van twee jaren is verstreken, gelden van rechtswege weer de bevoegdheden ingevolge de
      [artikelen 6][ref1] tot en met [9][ref2].

      2 De termijn, bedoeld in het eerste lid, kan telkens worden verlengd met ten hoogste twee jaren, indien het bevoegd
      gezag en ten minste twee derden van het aantal leden van de medezeggenschapsraad daartoe besluiten ten aanzien van
      alle of een aantal van de in het eerste lid eerste volzin, bedoelde bevoegdheden.

      3 Een besluit als bedoeld in het tweede lid, wordt in een gezamenlijke schriftelijke verklaring van bevoegd gezag
      en ten minste twee derden van het aantal leden van de medezeggenschapsraad vastgelegd. De verklaring vermeldt
      de duur van de verlengingsperiode en de bevoegdheden waarop de verlenging betrekking heeft. De verklaring wordt
      toegevoegd aan het medezeggenschapsreglement.


      [ref1]: https://wetten.overheid.nl/BWBR0005746#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005746#Artikel9
