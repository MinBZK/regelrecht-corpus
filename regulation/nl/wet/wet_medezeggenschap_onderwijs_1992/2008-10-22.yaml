        bwb_id: BWBR0005746
        artikel: '3'
  - number: '43'
    text: |-
      Een commissie voor geschillen als bedoeld in de Wet medezeggenschap onderwijs, geldt met ingang van de datum van
      inwerkingtreding van deze wet als commissie voor geschillen in de zin van deze wet.
    url: https://wetten.overheid.nl/BWBR0005746/2008-10-22#Artikel43
  - number: '44'
    text: |-
      De op de dag voor de datum van inwerkingtreding van deze wet nog niet besliste geschillen, door het bevoegd gezag
      van een school voorgelegd aan een commissie voor geschillen als bedoeld in de Wet medezeggenschap onderwijs, gelden
      met ingang van de datum van inwerkingtreding van deze wet als geschillen die krachtens deze wet aanhangig zijn bij
      een commissie voor geschillen in de zin van deze wet.
    url: https://wetten.overheid.nl/BWBR0005746/2008-10-22#Artikel44
  - number: '45'
    text: |-
      1 Indien aan een school nog geen medezeggenschapsraad is verbonden, wordt aan de school binnen een half jaar een
      voorlopige medezeggenschapsraad gekozen.

      2 Het aantal leden van de voorlopige raad bedraagt aan een school met minder dan 250 leerlingen 4 leden, met 250
      tot 750 leerlingen 8 leden, met 750 tot 1250 leerlingen 12 leden en met 1250 of meer leerlingen 16 leden.

      3 [Artikel 3, derde tot en met tiende lid][ref1], is van overeenkomstige toepassing op de voorlopige raad.

      4 Het bevoegd gezag legt binnen drie maanden na de verkiezing van de voorlopige raad een medezeggenschapsreglement
      als voorstel aan deze raad voor. Vervolgens spreekt de voorlopige raad zich, na overleg met het
      bevoegd gezag, binnen drie maanden over het voorstel uit. De [artikelen 14, tweede lid][ref2],
      [19, eerste lid aanhef en onderdeel b][ref3], en [21][ref4], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005746#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005746#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0005746#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0005746#Artikel21
    url: https://wetten.overheid.nl/BWBR0005746/2008-10-22#Artikel45
