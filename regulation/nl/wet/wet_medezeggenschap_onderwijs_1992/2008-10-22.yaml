  - number: '10'
    text: |-
      Indien het bevoegd gezag op grond van [artikel 8][ref1] of [artikel 9][ref2], dan wel op grond van het bepaalde in
      het medezeggenschapsreglement krachtens [artikel 15, tweede lid][ref3], voor een te nemen besluit de voorafgaande
      instemming van een deel van de medezeggenschapsraad behoeft, wordt het andere deel van de raad in de gelegenheid
      gesteld over het besluit advies uit te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005746#Artikel8
