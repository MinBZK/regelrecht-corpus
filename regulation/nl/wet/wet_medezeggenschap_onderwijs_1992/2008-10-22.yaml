  - number: '22'
    text: |-
      1 Indien het bevoegd gezag een besluit neemt waarbij het een advies van de medezeggenschapsraad, vereist ingevolge
      [artikel 7][ref1], dan wel ingevolge de toepassing van [artikel 15, tweede lid][ref2], niet of niet geheel volgt,
      wordt de uitvoering van het besluit opgeschort met zes weken, tenzij de raad tegen onmiddellijke uitvoering van het
      besluit geen bedenkingen heeft.

      2 De medezeggenschapsraad doet een verzoek als bedoeld in [artikel 19, eerste lid onderdeel c][ref3], binnen zes
      weken nadat het betrokken besluit door het bevoegd gezag is genomen, onder overlegging van de argumenten voor zijn
      advies en de argumenten voor zijn oordeel dat door het niet of niet geheel volgen van het advies de belangen van
      de school of van de raad ernstig worden geschaad. De commissie stelt het bevoegd gezag in de gelegenheid om zijn
      argumenten voor het niet of niet geheel volgen van het advies van de raad bij de commissie naar voren te brengen.

      De behandeling van het verzoek verlengt de opschorting, bedoeld in het eerste lid, niet.

      3 De commissie is bevoegd een bemiddelingsvoorstel aan het bevoegd gezag en de raad voor te leggen, tenzij
      het bevoegd gezag dan wel de raad te kennen geven daarop geen prijs te stellen. Indien de commissie van deze
      bevoegdheid geen gebruik maakt of indien haar voorstel niet de instemming verwerft van het bevoegd gezag alsmede
      de instemming van de raad, beoordeelt de commissie of het bevoegd gezag bij het niet of niet geheel volgen van het
      advies van de raad

      a. gehandeld heeft in strijd met het bepaalde bij of krachtens deze wet of met het medezeggenschapsreglement;

      b. onvoldoende gemotiveerd heeft waarom is afgeweken van het advies van de raad; of

      c. onzorgvuldig gehandeld heeft ten opzichte van de raad.

      De commissie doet vervolgens de bindende uitspraak of het betrokken besluit al dan niet in stand kan blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0005746#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005746#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0005746#Artikel19
    url: https://wetten.overheid.nl/BWBR0005746/2008-10-22#Artikel22
