  - number: '24'
    text: |-
      Indien in het medezeggenschapsreglement ingevolge de toepassing van [artikel 15, derde lid onderdeel d][ref1],
      geschillen worden aangegeven en indien het reglement van de commissie voor geschillen daarvoor de mogelijkheid
      biedt, kunnen deze geschillen aan de commissie worden voorgelegd overeenkomstig het daaromtrent bepaalde in het
      medezeggenschapsreglement.


      [ref1]: https://wetten.overheid.nl/BWBR0005746#Artikel15
    url: https://wetten.overheid.nl/BWBR0005746/2008-10-22#Artikel24
