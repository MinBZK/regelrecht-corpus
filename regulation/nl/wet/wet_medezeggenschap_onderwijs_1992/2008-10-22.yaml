  - number: '9'
    text: |-
      Het bevoegd gezag behoeft de voorafgaande instemming van het deel van de medezeggenschapsraad dat uit en door de
      ouders of de leerlingen is gekozen, voor elk door het bevoegd gezag te nemen besluit met betrekking tot de volgende
      aangelegenheden:

      a. regeling van de gevolgen voor de ouders of leerlingen van een besluit met betrekking tot een aangelegenheid als
      bedoeld in [artikel 7 onder a, d, e, f, g en o][ref1];

      b. de vaststelling of wijziging van de hoogte en de vaststelling of wijziging van de bestemming van de middelen
      die van de ouders of de leerlingen worden gevraagd zonder dat daartoe een wettelijke verplichting bestaat
      onderscheidenlijk zijn ontvangen op grond van een overeenkomst die door de ouders is aangegaan;.

      c. vaststelling of wijziging van het beleid met betrekking tot voorzieningen ten behoeve van de leerlingen;

      d. vaststelling van het leerlingenstatuut, bedoeld in [artikel 24][ref2] dan wel een mogelijk ouders- of
      leerlingenstatuut anders dan bedoeld in [artikel 24][ref3];

      e. de aanvaarding van materiële bijdragen of geldelijke bijdragen anders dan onder *b* bedoeld en niet gebaseerd
      op de onderwijswetgeving indien het bevoegd gezag daarbij verplichtingen op zich neemt waarmee de leerlingen
      binnen de schooltijden respectievelijk het onderwijs en tijdens de activiteiten die worden georganiseerd onder
      verantwoordelijkheid van het bevoegd gezag, alsmede tijdens het overblijven, zullen worden geconfronteerd;

      f. vaststelling of wijziging van de klachtenregeling;

      g. vaststelling van de onderwijstijd; en

      h. vaststelling of wijziging van de wijze waarop de overblijfvoorziening, bedoeld in
      [artikel 45 van de Wet op het primair onderwijs][ref4], wordt georganiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005746#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel24g
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel24g
      [ref4]: https://wetten.overheid.nl/BWBR0003420#Artikel45
