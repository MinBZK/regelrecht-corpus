    text: |-
      1 Een medezeggenschapsraad die op de dag voor de datum van inwerkingtreding van deze wet ingevolge artikel 4 van
      de Wet medezeggenschap onderwijs aan de school is verbonden, geldt dat medezeggenschapsraad in de zin van deze wet,
      totdat een medezeggenschapsraad aan de school is verbonden ingevolge [artikel 3][ref1] van deze wet. Indien van
      deze raad overige leden als bedoeld in artikel 4, derde lid, onderdeel c, van de Wet medezeggenschap onderwijs,
      deel uitmaken, hebben zij zitting in de raad met adviserende stem.

      2 Ten aanzien van een gemeenschappelijke raad, een geledingenraad, een gemeenschappelijke geledingenraad, of
      voorlopige raad, is het eerste lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005746#Artikel3
    url: https://wetten.overheid.nl/BWBR0005746/2008-10-22#Artikel42
