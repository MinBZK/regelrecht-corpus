  - number: '30'
    text: |-
      1 Indien bijzondere omstandigheden een goede toepassing van een of meer onderdelen van deze wet, niet zijnde
      de adviesbevoegdheid, bedoeld in [artikel 28, zesde lid][ref1], in een school of in een aantal scholen die door
      hetzelfde bevoegd gezag in stand worden gehouden, in de weg staan, kan Onze minister op verzoek van het bevoegd
      gezag toestaan, dat voor wat betreft een of meer onderdelen op door hem aangegeven wijze wordt afgeweken van het
      bepaalde in deze wet.

      2 Indien bijzondere omstandigheden als bedoeld in het eerste lid zich voordoen aan een categorie van scholen, kan
      bij algemene maatregel van bestuur worden afgeweken van het bepaalde in deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005746#Artikel28
