  - number: '13'
    text: |-
      1 De bevoegdheden op grond van de [artikelen 6 tot en met 10][ref1], dan wel op grond van het bepaalde in het
      medezeggenschapsreglement krachtens [artikel 15, tweede lid][ref2], zijn niet van toepassing, voor zover de
      desbetreffende aangelegenheid voor de school reeds inhoudelijk is geregeld in een bij of krachtens wet gegeven
      voorschrift. De bevoegdheden van het deel van de medezeggenschapsraad dat uit en door het personeel is gekozen,
      zijn niet van toepassing, voor zover de desbetreffende aangelegenheid voor de school reeds inhoudelijk is geregeld
      in een collectieve arbeidsovereenkomst.

      2 De bevoegdheden op grond van de [artikelen 6 tot en met 10][ref3], dan wel op grond van het bepaalde in het
      medezeggenschapsreglement krachtens [artikel 15, tweede lid][ref4], zijn niet van toepassing voor zover het
      betreft een aangelegenheid als bedoeld in [artikel 37, eerste lid, van de Wet op het primair onderwijs][ref5],
      [artikel 37, eerste lid, van de Wet op de expertisecentra][ref6],
      [artikel 40a, van de Wet op het voortgezet onderwijs][ref7],
      [artikel 3.2.1 van de Wet educatie en beroepsonderwijs][ref8] en
      [artikel 4a, tweede en derde lid, van de Experimentenwet onderwijs][ref9], voor zover het in deze leden bedoelde
      overleg niet besluit de aangelegenheid ter behandeling aan het personeelsdeel van de medezeggenschapsraad over
      te laten.


