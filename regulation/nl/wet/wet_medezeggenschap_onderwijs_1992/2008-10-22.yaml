  - number: '29'
    text: |-
      Indien meer scholen door hetzelfde bevoegd gezag in stand worden gehouden, geeft het bevoegd gezag gelegenheid
      tot het instellen van een gemeenschappelijke raad voor een geleding als bedoeld in [artikel 26][ref1]. Een
      dergelijke raad is bevoegd desgevraagd of eigener beweging advies uit te brengen aan de gemeenschappelijke
      medezeggenschapsraad dan wel de afzonderlijke medezeggenschapsraden van de betrokken scholen over aangelegenheden,
      die van gemeenschappelijk belang zijn en de desbetreffende geleding in het bijzonder aangaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005746#Artikel26
    url: https://wetten.overheid.nl/BWBR0005746/2008-10-22#Artikel29
