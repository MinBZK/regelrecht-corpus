      1 Het bevoegd gezag staat de medezeggenschapsraad het gebruik toe van de voorzieningen, waarover het kan beschikken
      en die de raad voor de vervulling van zijn taak redelijkerwijs nodig heeft.

      2 Het eerste lid is van overeenkomstige toepassing op de raden, bedoeld in de [artikelen 26][ref1] tot en met
