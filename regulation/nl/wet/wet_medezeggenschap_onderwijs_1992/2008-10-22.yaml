  - number: '4'
    text: |-
      De medezeggenschapsraad kiest uit zijn midden een voorzitter en een of meer plaatsvervangende voorzitters. De
      voorzitter, of bij diens verhindering een plaatsvervangende voorzitter, vertegenwoordigt de raad in rechte.
    url: https://wetten.overheid.nl/BWBR0005746/2008-10-22#Artikel4
  - number: '5'
    text: |-
      1 Het bevoegd gezag stelt de medezeggenschapsraad ten minste twee maal per jaar in de gelegenheid de algemene
      gang van zaken in de school met hem te bespreken. Het bevoegd gezag en de raad komen met elkaar bijeen, indien
      daarom onder opgave van redenen wordt verzocht door het bevoegd gezag, de raad of het deel van de raad, dat uit
      en door het personeel onderscheidenlijk uit en door de ouders of de leerlingen is gekozen. De besprekingen kunnen
      namens het bevoegd gezag worden gevoerd. Het bevoegd gezag kan, na overleg met de schoolleiding, een lid van de
      schoolleiding opdragen de besprekingen dan wel bepaalde besprekingen namens hem te voeren. Op verzoek van dit
      lid van de schoolleiding of op verzoek van de raad kan het bevoegd gezag dit lid ontheffen van de taak om een
      bespreking namens het bevoegd gezag te voeren.

      2 De raad is voorts bevoegd tot bespreking van alle aangelegenheden, de school betreffende. Hij is bevoegd over
      deze aangelegenheden aan het bevoegd gezag voorstellen te doen en standpunten kenbaar te maken. Het bevoegd gezag
      brengt op de voorstellen, bedoeld in de tweede volzin, binnen drie maanden een schriftelijke, met redenen omklede
      reactie uit aan de raad. Alvorens over te gaan tot het uitbrengen van de in de vorige volzin bedoelde reactie,
      stelt het bevoegd gezag de raad ten minste eenmaal in de gelegenheid met hem overleg te plegen over de voorstellen,
      bedoeld in de tweede volzin.

      3 De raad bevordert naar vermogen openheid, openbaarheid en onderling overleg in de school.

      4 De raad waakt voorts in de school in het algemeen tegen discriminatie op welke grond dan ook en bevordert
      gelijke behandeling in gelijke gevallen en in het bijzonder de gelijke behandeling van mannen en vrouwen alsmede de
      inschakeling van gehandicapten en allochtone werknemers.

      5 Het bevoegd gezag verstrekt de raad aan het begin van het schooljaar schriftelijk de basisgegevens met
      betrekking tot de samenstelling van het bevoegd gezag, de organisatie binnen de school, de taakverdeling tussen
      bevoegd gezag en schoolleiding en de hoofdpunten van het reeds vastgestelde beleid. Het bevoegd gezag stelt
      de medezeggenschapsraad onverwijld in kennis van voornemens met betrekking tot de aangelegenheden bedoeld in
      [artikel 6 onder a][ref1] en [artikel 7 onder a, d en e][ref2]. Voorts verschaft het bevoegd gezag de raad, al dan
      niet gevraagd, tijdig alle inlichtingen die deze voor de vervulling van zijn taak redelijkerwijze nodig heeft.

      6 Het bevoegd gezag verstrekt de raad:

      a. jaarlijks de begroting en bijbehorende beleidsvoornemens op financieel, organisatorisch en onderwijskundig
      gebied;

      b. jaarlijks voor 1 mei informatie over de berekening die ten grondslag ligt aan de middelen uit 's Rijks kas die
      worden toegerekend aan het bevoegd gezag;

      c. jaarlijks voor 1 juli een jaarverslag als bedoeld in [artikel 171 van de Wet op het primair onderwijs][ref3],
      [artikel 157 van de Wet op de expertisecentra][ref4], [artikel 106 van de Wet op het voortgezet onderwijs][ref5],
      of de [artikelen 2.5.3][ref6] en [2.5.4 van de Wet educatie en beroepsonderwijs][ref7].

      7 Indien bij een bepaalde vergadering of een onderdeel daarvan een persoonlijk belang van een van de leden van de
      raad in het geding is, kan de raad besluiten dat het betrokken lid aan die vergadering, of dat onderdeel daarvan,
      niet deelneemt. De raad besluit dan tevens dat de behandeling van de betreffende aangelegenheid in een besloten
      vergadering plaatsvindt.

      8 De raad doet jaarlijks schriftelijk verslag van zijn werkzaamheden en draagt er zorg voor dat alle bij de
      school betrokkenen van het verslag kennis kunnen nemen. De raad draagt er zorg voor dat de agenda’s en verslagen
      van de vergaderingen van de raad worden toegezonden aan het bevoegd gezag, aan de eventuele geledingenraden en
      deelraden, en aan de eventuele gemeenschappelijke medezeggenschapsraad, en ter inzage worden gelegd op een algemeen
      toegankelijke plaats op de school ten behoeve van belangstellenden. De raad stelt de eventuele geledingenraden
      ten minste eenmaal per jaar in de gelegenheid om over aangelegenheden die de betrokken geleding in het bijzonder
      aangaan, met hem overleg te voeren.

      9 Het bevoegd gezag draagt er zorg voor, dat de leden van de raad niet uit hoofde van hun lidmaatschap van de raad
      worden benadeeld in hun positie met betrekking tot de school. De eerste volzin is van overeenkomstige toepassing
      ten aanzien van kandidaatleden en voormalige leden.

      10 De beëindiging anders dan op eigen verzoek van de betrekking van een aan de school werkzame persoon mag geen
      verband houden met de kandidaatstelling voor het lidmaatschap, het lidmaatschap of het voormalig lidmaatschap van
      de betrokkene van de raad. Een beëindiging van de betrekking in strijd met het in dit lid bepaalde is nietig.


