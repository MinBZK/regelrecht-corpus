  - number: '8'
    text: |-
      1 Het bevoegd gezag behoeft de voorafgaande instemming van het deel van de medezeggenschapsraad dat uit en
      door het personeel is gekozen, voor elk door het bevoegd gezag te nemen besluit met betrekking tot de volgende
      aangelegenheden:

      a. regeling van de gevolgen voor het personeel van een besluit met betrekking tot een aangelegenheid als bedoeld in
      de [artikelen 7 onder a, d, e, f, g en o][ref1], en [9 onder d en e][ref2];

      b. vaststelling of wijziging van de samenstelling van de formatie in het volgende schooljaar;

      c. vaststelling of wijziging van regels met betrekking tot de nascholing van het personeel;

      d. vaststelling of wijziging van een mogelijk werkreglement voor het personeel en van de opzet en de inrichting
      van het werkoverleg, voor zover het besluit van algemene gelding is voor alle of een gehele categorie van
      personeelsleden;

      e. vaststelling of wijziging van de verlofregeling van het personeel;

      f. vaststelling of wijziging van een arbeids- en rusttijdenregeling van het personeel;

      g. vaststelling of wijziging van het beleid met betrekking tot de toekenning van salarissen, toelagen en
      gratificaties aan het personeel;

      h. vaststelling of wijziging van de taakverdeling respectievelijk de taakbelasting binnen het personeel, de
      schoolleiding daaronder niet begrepen;

      i. vaststelling of wijziging van het beleid met betrekking tot personeelsbeoordeling, functiebeloning en
      functiedifferentiatie;

      j. vaststelling of wijziging van het beleid met betrekking tot het overdragen van bekostiging; en

      k. vaststelling of wijziging van de klachtenregeling.

      2 Het bevoegd gezag van een speciale school voor basisonderwijs dat tevens bevoegd gezag is van een of meer
      basisscholen behoeft de voorafgaande instemming van het deel van de medezeggenschapsraad dat uit en door het
      personeel van eerstgenoemde school is gekozen voor elk door hem te nemen besluit met betrekking tot de inzet van de
      bekostiging die op grond van [artikel 120, vierde lid, van de Wet op het primair onderwijs][ref3] aan eerstgenoemde
      school is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005746#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005746#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel120
