preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Wet medezeggenschap onderwijs (Stb. 1981, 778) te
    vervangen door een nieuwe wet, aangezien de evaluatie van deze wet en de invoering van het formatiebudgetsysteem
    aanleiding geven tot aanzienlijke wijzigingen in de medezeggenschapsregeling die thans geldt voor het
    basisonderwijs, het speciaal onderwijs en voortgezet speciaal onderwijs, en het voortgezet onderwijs;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005746/2008-10-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Deze wet verstaat onder:

      a. "Onze Minister": Onze Minister van Onderwijs, Cultuur en Wetenschap en, voor wat betreft het landbouwonderwijs,
      Onze Minister van Landbouw, Natuur en Voedselkwaliteit;

      b. «school»: een openbare of uit de openbare kas bekostigde bijzondere basisschool of speciale school voor
      basisonderwijs als bedoeld in de [Wet op het primair onderwijs][ref1], een openbare of uit de openbare kas
      bekostigde bijzondere school voor speciaal onderwijs, voortgezet speciaal onderwijs of speciaal en voortgezet
      speciaal onderwijs, dan wel een openbare of uit de openbare kas bekostigde bijzondere instelling voor
      speciaal en voortgezet speciaal onderwijs, als bedoeld in de Wet op de expertisecentra, een openbare of uit
      de openbare kas bekostigde bijzondere school, cursus dan wel inrichting voor voortgezet onderwijs als bedoeld
      in de [Wet op het voortgezet onderwijs][ref2], een uit 's Rijks kas bekostigde instelling voor educatie en
      beroepsonderwijs als bedoeld in de [Wet educatie en beroepsonderwijs][ref3] en een openbare of uit de openbare kas
      bekostigde school als bedoeld in de [Experimentenwet onderwijs][ref4];

      c. "het bevoegd gezag": voor wat betreft

      1°. een gemeentelijke school: het college van burgemeester en wethouders, voor zover de raad niet anders bepaalt,
      en, indien de raad dit wenselijk oordeelt, met inachtneming van door hem te stellen regelen;

      2°. een andere openbare school:

        - het krachtens de desbetreffende gemeenschappelijke regeling bevoegde orgaan,
        - de openbare rechtspersoon, bedoeld in [artikel 47 van de Wet op het primair onderwijs][ref5],
      [artikel 50 van de Wet op de expertisecentra][ref6], of [artikel 42a van de Wet op het voortgezet onderwijs][ref7],
      of
        - de stichting, bedoeld in de [artikelen 17][ref8] of [48 van de Wet op het primair onderwijs][ref9],
      de [artikelen 28][ref10] of [51 van de Wet op de expertisecentra][ref11], of de [artikelen 42b][ref12]
      of [53c van de Wet op het voortgezet onderwijs][ref13];

      3°. een bijzondere school: het schoolbestuur;

      d. «leerlingen»: leerlingen in de zin van de [Wet op het primair onderwijs][ref14], de
      [Wet op de expertisecentra][ref15] en de [Wet op het voortgezet onderwijs][ref16] en deelnemers in de zin van de
      [Wet educatie en beroepsonderwijs][ref17];

      e. "ouders": de ouders, voogden en verzorgers van de leerlingen;

      f. «schoolleiding»: de directeur in de zin van de [Wet op het primair onderwijs][ref18] en de
      [Wet op de expertisecentra][ref19] en de rector, directeur of de leden van de centrale directie in de zin van de
      [Wet op het voortgezet onderwijs][ref20] en de [Wet educatie en beroepsonderwijs][ref21], alsmede de conrectoren of
      de adjunct-directeuren.

      2 In deze wet wordt onder personeel mede verstaan personeel van de school dat is benoemd in algemene dienst van het
      bevoegd gezag.


