  - number: '20'
    text: |-
      1 Indien aan een te nemen besluit van het bevoegd gezag de instemming, vereist ingevolge de [artikelen 6][ref1],
      [8][ref2] of [9][ref3] dan wel ingevolge de toepassing van [artikel 15, tweede lid][ref4], is onthouden, deelt
      het bevoegd gezag binnen drie maanden aan de medezeggenschapsraad mede, of het voorstel wordt ingetrokken dan wel
      wordt voorgelegd aan de commissie voor geschillen. Indien deze mededeling niet binnen drie maanden wordt gedaan,
      vervalt het voorstel.

      2 Het bevoegd gezag doet een verzoek als bedoeld in [artikel 19, eerste lid onderdeel ][ref5] overlegging van de
      door het bevoegd gezag gemaakte afweging van de belangen die daarbij voor het bevoegd gezag onderscheidenlijk de
      raad of het betrokken deel daarvan aan de orde zijn. De commissie stelt de raad of het betrokken deel daarvan in de
      gelegenheid om zijn argumenten voor het onthouden van zijn instemming bij de commissie naar voren te brengen.

      3 De commissie is bevoegd een bemiddelingsvoorstel aan het bevoegd gezag en de raad voor te leggen, tenzij het
      bevoegd gezag dan wel de raad of het betrokken deel daarvan te kennen geven daarop geen prijs te stellen. Indien
      de commissie van deze bevoegdheid geen gebruik maakt of indien haar voorstel niet de instemming verwerft van het
      bevoegd gezag alsmede de instemming van de raad of het betrokken deel daarvan, beoordeelt de commissie of het
      bevoegd gezag bij afweging van de betrokken belangen in redelijkheid tot zijn voorstel heeft kunnen komen. De
      uitspraak van de commissie is bindend voor het bevoegd gezag en de raad.


      [ref1]: https://wetten.overheid.nl/BWBR0005746#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005746#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005746#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0005746#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0005746#Artikel19
