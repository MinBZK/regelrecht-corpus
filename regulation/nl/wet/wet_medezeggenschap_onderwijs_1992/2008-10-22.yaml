  - number: '12'
    text: |-
      Indien een te nemen besluit ingevolge het bepaalde in [artikel 7][ref1], dan wel op grond van het bepaalde in het
      medezeggenschapsreglement krachtens [artikel 15, tweede lid][ref2], vooraf voor advies dient te worden voorgelegd
      aan de medezeggenschapsraad, draagt het bevoegd gezag er zorg voor dat:

      a. advies wordt gevraagd op een zodanig tijdstip, dat het advies van wezenlijke invloed kan zijn op de
      besluitvorming;

      b. de raad in de gelegenheid wordt gesteld met hem overleg te voeren voordat advies wordt uitgebracht;

      c. de raad zo spoedig mogelijk schriftelijk in kennis wordt gesteld van de wijze waarop aan het uitgebrachte advies
      gevolg wordt gegeven; en

      d. de raad, indien het bevoegd gezag het advies niet of niet geheel wil volgen, in de gelegenheid wordt gesteld
      nader overleg met hem te voeren alvorens het besluit definitief wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005746#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005746#Artikel15
