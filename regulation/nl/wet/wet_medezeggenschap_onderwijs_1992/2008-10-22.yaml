  - number: '2'
    text: |-
      De bij of krachtens deze wet gegeven voorschriften, voor zover zij de scholen betreffen, zijn regels voor het
      openbaar onderwijs en voorwaarden voor bekostiging van het bijzonder onderwijs.
    url: https://wetten.overheid.nl/BWBR0005746/2008-10-22#Artikel2
  - number: '3'
    text: |-
      1 Aan elke school is een medezeggenschapsraad verbonden.

      2 Het aantal leden van de raad bedraagt aan een school met minder dan 250 leerlingen ten hoogste 6 leden, met
      250 tot 750 leerlingen ten hoogste 10 leden, met 750 tot 1250 leerlingen ten hoogste 14 leden en met 1250 of meer
      leerlingen ten hoogste 18 leden.

      3 De raad bestaat uit

      a. leden die uit en door het personeel worden gekozen; en

      b. leden die uit en door de ouders of de leerlingen worden gekozen overeenkomstig het bepaalde in het vijfde lid.

      4 De aantallen leden, bedoeld in het derde lid onderdeel *a* en onderdeel *b*, zijn aan elkaar gelijk.

      5 De leden, bedoeld in het derde lid onderdeel *b*, worden gekozen

      a. uit en door de ouders, voor zover het betreft een basisschool of een speciale school voor basisonderwijs;

      b. uit en door de ouders, dan wel deels uit en door de ouders en deels uit en door de leerlingen die de leeftijd
      van dertien jaar hebben bereikt, voor zover het betreft een school voor speciaal onderwijs, een school voor
      speciaal en voortgezet speciaal onderwijs, dan wel een instelling voor speciaal en voortgezet speciaal onderwijs;

      c. deels uit en door de ouders en deels uit en door de leerlingen, voor zover het betreft een school voor
      voortgezet onderwijs, een school voor voortgezet speciaal onderwijs of een door Onze minister aangewezen inrichting
      voor voortgezet onderwijs;

      d. uit en door de leerlingen, dan wel deels uit en door de leerlingen en deels uit en door de
      ouders, voor zover het betreft een instelling voor educatie en beroepsonderwijs als bedoeld in de
      [Wet educatie en beroepsonderwijs][ref1];

      e. uit en door de leerlingen, voor zover het betreft een door Onze minister aangewezen inrichting voor voortgezet
      onderwijs.

      6 Aan een scholengemeenschap, een school voor speciaal en voortgezet speciaal onderwijs, een school voor speciaal
      onderwijs met daaraan verbonden een afdeling, een instelling voor speciaal en voortgezet speciaal onderwijs en
      een school voor voorbereidend beroepsonderwijs kan de verkiezing van de leden van de raad plaatsvinden volgens een
      stelsel, waarin de scholen die in de scholengemeenschap zijn verenigd, onderscheidenlijk de afdelingen waaruit de
      school bestaat, evenredig zijn vertegenwoordigd.

      7 Geen lid van de raad kunnen zijn voor wat betreft

        - een gemeentelijke school: zij die deel uitmaken van het college van burgemeester en wethouders
      dan wel van de raad, respectievelijk zij die deel uitmaken van een bestuurscommissie als bedoeld in
      [artikel 83 van de Gemeentewet][ref2], die belast is met het bestuur van de school;
        - een andere openbare school: zij die deel uitmaken van het krachtens de desbetreffende gemeenschappelijke regeling
      bevoegde orgaan;
        - een bijzondere school: zij die deel uitmaken van het schoolbestuur dan wel, indien de school uitgaat van een
      stichting of een vereniging, van het bestuur van de stichting of de vereniging.

      8 Een lid van de schoolleiding kan niet tevens lid zijn van de raad, indien hem is opgedragen om namens het bevoegd
      gezag op te treden in besprekingen als bedoeld in [artikel 5, eerste lid][ref3], dan wel in het overleg, bedoeld in
      [artikel 13, tweede lid][ref4].

      9 Kandidaten voor de verkiezing van het deel van de raad dat uit en door het personeel wordt gekozen, kunnen worden
      gesteld door personeelsleden en door organisaties van personeel. Kandidaten voor de verkiezing van het deel van de
      raad dat uit en door de ouders of de leerlingen wordt gekozen, kunnen worden gesteld door ouders of leerlingen en
      door organisaties van ouders of leerlingen.

      10 De verkiezing van de leden van de raad geschiedt bij geheime schriftelijke stemming.


