  - number: '18'
    text: |-
      1 Elke school is aangesloten bij een commissie voor geschillen. Een commissie als bedoeld in de vorige volzin
      strekt haar werkkring uit over ten minste 20 scholen. Onze minister kan het in de vorige zin bedoelde aantal
      scholen lager stellen.

      2 Een commissie voor geschillen bestaat uit 3 leden en 3 plaatsvervangende leden, waarvan een lid en een
      plaatsvervangend lid worden gekozen door de bevoegde gezagsorganen en een lid en een plaatsvervangend lid door
      de medezeggenschapsraden van de in het eerste lid bedoelde scholen. Deze twee leden kiezen het derde lid, tevens
      voorzitter, en diens plaatsvervanger.

      3 De leden en de plaatsvervangende leden mogen niet deel uitmaken van het bevoegd gezag of van de
      medezeggenschapsraad van een school, waarover de commissie haar werkkring uitstrekt.
    url: https://wetten.overheid.nl/BWBR0005746/2008-10-22#Artikel18
  - number: '19'
    text: |-
      1 Een commissie voor geschillen neemt kennis van de volgende geschillen:

      a. op verzoek van het bevoegd gezag, indien het bevoegd gezag ten aanzien van een te nemen, na overleg al dan niet
      gewijzigd, besluit dat ingevolge de [artikelen 6][ref1], [8][ref2] of [9][ref3] dan wel ingevolge de toepassing
      van [artikel 15, tweede lid][ref4], instemming behoeft, de vereiste instemming niet heeft verworven en het bevoegd
      gezag zijn voorstel wenst te handhaven;

      b. op verzoek van het bevoegd gezag of van de medezeggenschapsraad, indien het bevoegd gezag ten aanzien van de
      inhoud van het medezeggenschapsreglement voor zover aangegeven in [artikel 15, eerste of derde lid][ref5], geheel
      of gedeeltelijk niet de vereiste instemming heeft verworven;

      c. op verzoek van de medezeggenschapsraad, indien het bevoegd gezag een besluit heeft genomen waarover ingevolge
      [artikel 7][ref6] dan wel ingevolge de toepassing van [artikel 15, tweede lid][ref7], advies door de raad is
      uitgebracht, het bevoegd gezag daarbij het uitgebrachte advies niet of niet geheel volgt en de raad van oordeel is
      dat daardoor de belangen van de school of de belangen van de raad ernstig worden geschaad; en

      d. op verzoek van het bevoegd gezag of van de medezeggenschapsraad, indien het bevoegd gezag en de raad van
      mening verschillen over de interpretatie van het bepaalde bij of krachtens deze wet dan wel het bepaalde in het
      medezeggenschapsreglement.

      2 De commissie kan in haar reglement bepalen dat zij kennis neemt van andere geschillen tussen het bevoegd gezag en
      de raad dan bedoeld in het eerste lid. [Artikel 20, derde lid][ref8], is van overeenkomstige toepassing.

      3 Een uitspraak van een commissie voor geschillen van openbare scholen wordt voor de toepassing van
      [afdeling 7.1 van de Algemene wet bestuursrecht][ref9] gelijk gesteld met een uitspraak in administratief beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0005746#Artikel6
