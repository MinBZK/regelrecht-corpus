  - number: '14'
    text: |-
      1 Het bevoegd gezag stelt, met inachtneming van de voorschriften bij of krachtens deze wet, een
      medezeggenschapsreglement voor de school vast.

      2 Het bevoegd gezag legt het reglement, daaronder elke wijziging ervan mede begrepen, als voorstel aan de
      medezeggenschapsraad voor en stelt het slechts vast voor zover het voorstel de instemming van twee derden van het
      aantal leden van de raad heeft verworven.
    url: https://wetten.overheid.nl/BWBR0005746/2008-10-22#Artikel14
  - number: '15'
    text: |-
      1 In het reglement wordt in ieder geval geregeld:

      a. het aantal leden van de medezeggenschapsraad;

      b. aan de desbetreffende scholen, de wijze waarop toepassing wordt gegeven aan
      [artikel 3, vijfde lid onderdeel b onderscheidenlijk d][ref1];

      c. de wijze en organisatie van de verkiezingen van de leden van de raad;

      d. de zittingsduur van de leden van de raad;

      e. de wijze waarop wordt gewaarborgd dat de leden van de raad hun uit het lidmaatschap van de raad voortvloeiende
      verplichtingen nakomen;

      f. indien een lid van de schoolleiding is opgedragen om namens het bevoegd gezag op te treden in besprekingen met
      de raad, in welke gevallen op verzoek van de raad het bevoegd gezag zelf deze besprekingen met de raad voert;

      g. de wijze waarop het bevoegd gezag informatie verschaft aan de raad;

      h. de termijnen binnen welke tot instemming of onthouding van instemming dient te worden besloten, en de termijnen
      binnen welke advies dient te worden uitgebracht;

      i. indien een of meer deelraden zijn ingesteld, de bevoegdheden van de medezeggenschapsraad die aan de deelraden
      worden overgedragen;

      j. de mogelijkheid om de keuze te wijzigen voor het in de gemeenschappelijke medezeggenschapsraad vertegenwoordigen
      van afzonderlijke medezeggenschapsraden door middel van gemeenschappelijke vertegenwoordigers; en

      k. de procedure voor de beslechting van die geschillen tussen het bevoegd gezag en de raad, waarvoor deze wet niet
      in een geschillenregeling voorziet.

      2 In het reglement kan worden geregeld dat:

      a. de instemmingsbevoegdheid ten aanzien van een of meer van de aangelegenheden, bedoeld in [artikel 6][ref2],
      wordt omgezet in instemmingsbevoegdheid als bedoeld in [artikel 8][ref3] of [9][ref4], dan wel in
      adviesbevoegdheid als bedoeld in [artikel 7][ref5];

      b. de instemmingsbevoegdheid ten aanzien van een of meer van de aangelegenheden, bedoeld in [artikel 8][ref6],
      wordt omgezet in instemmingsbevoegdheid als bedoeld in [artikel 6][ref7] of [9][ref8], dan wel in
      adviesbevoegdheid als bedoeld in [artikel 7][ref9];

      c. de instemmingsbevoegdheid ten aanzien van een of meer van de aangelegenheden, bedoeld in [artikel 9][ref10],
      wordt omgezet in instemmingsbevoegdheid als bedoeld in [artikel 6][ref11] of [8][ref12], dan wel in
      adviesbevoegdheid als bedoeld in [artikel 7][ref13];

      d. de adviesbevoegdheid ten aanzien van een of meer van de aangelegenheden, bedoeld in [artikel 7][ref14], wordt
      omgezet in instemmingsbevoegdheid als bedoeld in [artikel 6][ref15], [8][ref16] of [9][ref17]; en

      e. door het bevoegd gezag te nemen besluiten met betrekking tot nader in het reglement te omschrijven
      aangelegenheden die niet reeds in de wet worden genoemd, instemming dan wel advies behoeven zoals bedoeld in de
      [artikelen 6][ref18] , [7][ref19], [8][ref20] of [9][ref21].

      3 In het reglement kan voorts worden geregeld:

      a. de voorwaarde dat leerlingen, die tot de school zijn toegelaten met toepassing
      van [artikel 58, eerste lid, van de Wet op het primair onderwijs][ref22],
      [artikel 60, eerste lid, van de Wet op de expertisecentra][ref23],
      [artikel 8.1.2, eerste lid, van de Wet educatie en beroepsonderwijs][ref24] of
      [artikel 48, eerste lid, van de Wet op het voortgezet onderwijs][ref25], alsmede hun ouders, slechts kandidaat
      kunnen worden gesteld voor verkiezing tot lid van de raad, indien zij hebben verklaard de grondslag en de
      doelstellingen van de school te respecteren;

      b. de toekenning aan de raad van een overeenkomstige bevoegdheid als bedoeld in
      [artikel 12, tweede lid, aanhef en onderdeel d, van de Algemene wet gelijke behandeling][ref26],
      in welk geval [artikel 21, tweede lid, van de Wet gelijke behandeling van mannen en vrouwen][ref27]
      van overeenkomstige toepassing is voor wat betreft het onderscheid, bedoeld in die wet of in
      [artikel 646 van Boek 7 van het Burgerlijk Wetboek][ref28].

      c. de toekenning aan de raad of aan het deel dat uit en door het personeel wordt gekozen, van de bevoegdheden
      inzake de arbeidsomstandigheden in de school, bedoeld in het zesde lid, voor zover deze niet betreffen te nemen
      besluiten van het bevoegd gezag als bedoeld in de [artikelen 6][ref29], [7][ref30], [8][ref31] en [9][ref32] en als
      bedoeld in het tweede lid, onderdeel e; en

      d. welke van de geschillen tussen het bevoegd gezag en de raad, waarvoor deze wet niet in een geschillenregeling
      voorziet, worden voorgelegd aan de commissie voor geschillen waarbij de school is aangesloten en wie het geschil
      aanhangig kan maken.

      4 De voorwaarde, bedoeld in het derde lid onderdeel *a*, kan slechts worden toegepast, indien zij door of namens
      het bevoegd gezag voorafgaand aan de toelating aan de betrokkenen bekend is gemaakt.

      5

      6 De bevoegdheden, bedoeld in het derde lid, onderdeel c, zijn de bevoegdheden die krachtens de
      [Arbeidsomstandighedenwet][ref33] en de algemene maatregel van bestuur op grond van [artikel 16 van die wet][ref34]
      aan de medezeggenschapsraad zijn toegekend.

      7 De regeling, bedoeld in het derde lid, onderdeel d, kan slechts worden toegepast, voor zover de commissie voor
      geschillen waarbij de school is aangesloten, in haar reglement daarvoor de mogelijkheid biedt.


