  - number: '7'
    text: |-
      De medezeggenschapsraad wordt vooraf in de gelegenheid gesteld om advies uit te brengen over elk door het bevoegd
      gezag te nemen besluit met betrekking tot in ieder geval de volgende aangelegenheden:

      a. verandering van de grondslag van de school;

      b. vaststelling of wijziging van de lesrooster in het voortgezet onderwijs;

      c. vaststelling of wijziging van de hoofdlijnen van het meerjarig financieel beleid voor de school, waaronder
      de voorgenomen bestemming van de middelen die door het bevoegd gezag ten behoeve van de school uit de
      openbare kas zijn toegekend of van anderen zijn ontvangen, met uitzondering van de middelen, bedoeld in
      [artikel 9, onderdelen b en e][ref1];

      d. beëindiging, belangrijke inkrimping of uitbreiding van de werkzaamheden van de school of van een belangrijk
      onderdeel daarvan, dan wel vaststelling of wijziging van het beleid ter zake;

      e. overdracht of omzetting van de school of van een onderdeel daarvan, respectievelijk fusie van de school met een
      andere school, dan wel vaststelling of wijziging van het beleid ter zake;

      f. het aangaan, verbreken of belangrijk wijzigen van een duurzame samenwerking met een andere instelling, dan wel
      vaststelling of wijziging van het beleid ter zake;

      g. deelneming of beëindiging van deelneming aan een onderwijskundig project of experiment, dan wel vaststelling of
      wijziging van het beleid ter zake;

      h. vaststelling of wijziging van het beleid met betrekking tot de organisatie van de school;

      i. vaststelling of wijziging van het beleid met betrekking tot de aanstelling en het ontslag van de schoolleiding
      en het overige personeel;

      j. aanstelling of ontslag van de schoolleiding;

      k. vaststelling of wijziging van de concrete taakverdeling binnen de schoolleiding, alsmede vaststelling of
      wijziging van het managementstatuut;

      l. vaststelling of wijziging van het beleid met betrekking tot de toelating en verwijdering van leerlingen;

      m. vaststelling of wijziging van het beleid met betrekking tot de toelating van studenten die elders in opleiding
      zijn voor een functie in het onderwijs;

      n. regeling van de vakantie;

      o. het oprichten van een centrale dienst;

      p. nieuwbouw of belangrijke verbouwing van de school;

      q. vaststelling of wijziging van het beleid met betrekking tot het onderhoud van de school;

      r. aansluiting bij een geschillencommissie; en

      s. vaststelling of wijziging van de wijze waarop de voorziening, bedoeld in
      [artikel 45, tweede lid, van de Wet op het primair onderwijs][ref2], wordt georganiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005746#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel45
