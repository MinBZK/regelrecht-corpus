      1 Het bevoegd gezag stelt de leden van de medezeggenschapsraad in de gelegenheid om gedurende een door dat bevoegd
      gezag en de raad gezamenlijk vast te stellen deel van de jaartaak de scholing te ontvangen die de leden van de
      raad voor de vervulling van hun taak nodig hebben. Het personeel van de school wordt in de gelegenheid gesteld deze
      scholing in werktijd en met behoud van salaris te ontvangen.

      2 Het deel van de jaartaak, bedoeld in het eerste lid, wordt vastgesteld op een zodanige omvang als redelijkerwijs
      noodzakelijk is voor de taakvervulling door de leden van de medezeggenschapsraad.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op de leden van de raden, bedoeld in de
      [artikelen 26][ref1] tot en met [29][ref2].


