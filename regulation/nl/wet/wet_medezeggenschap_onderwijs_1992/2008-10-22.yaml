  - number: '11'
    text: |-
      1 Een besluit met betrekking tot een aangelegenheid als bedoeld in [artikel 7 onder c][ref1], en
      [artikel 28, zesde lid, onder a][ref2], wordt niet genomen dan na afweging van in elk geval de onderwijskundige, de
      personele en de materiële belangen van de school of scholen, welke afweging schriftelijk in de motivering van het
      besluit tot uitdrukking wordt gebracht.

      2 Een besluit met betrekking tot een aangelegenheid als bedoeld in [artikel 8, eerste lid onder b, g, h en i][ref3],
      wordt genomen met inachtneming van in elk geval de besluiten tot vaststelling van het schoolplan, de hoofdlijnen
      van de bestemming van de financiële middelen en het organisatiebeleid van de school.

      3 Een besluit met betrekking tot een aangelegenheid als bedoeld in [artikel 8, eerste lid onder c][ref4], wordt
      genomen met inachtneming van in elk geval de onderwijskundige doelstellingen van de school en de vormgeving van het
      onderwijs zoals neergelegd in het schoolplan.

      4 Een besluit met betrekking tot de aangelegenheden waarnaar wordt verwezen in
      [artikel 8, eerste lid onder a][ref5], dan wel in [artikel 9 onder a][ref6], wordt niet ten uitvoer gelegd voordat
      een definitief besluit is genomen over de regeling van de gevolgen van dat besluit voor het personeel, dan wel voor
      de ouders of leerlingen als bedoeld in [artikel 8, eerste lid onder a][ref7], respectievelijk [9 onder a][ref8],
      tenzij dringende redenen in het belang van de school een eerdere tenuitvoerlegging noodzakelijk maken.

      5 Een besluit met betrekking tot een aangelegenheid als bedoeld in de [artikelen 7, onderdeel s][ref9], en
      [9, onderdeel h][ref10], wordt niet genomen dan na raadpleging van de ouders.


