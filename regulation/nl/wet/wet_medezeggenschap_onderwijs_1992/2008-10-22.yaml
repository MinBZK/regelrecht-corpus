  - number: '28'
    text: |-
      1 Indien het bevoegd gezag meer dan een school in stand houdt als bedoeld in de
      [Wet op het primair onderwijs][ref1], de [Wet op de expertisecentra][ref2], de
      [Wet op het voortgezet onderwijs][ref3] dan wel de [Wet educatie en beroepsonderwijs][ref4], stelt het bevoegd
      gezag per schoolsoort een gemeenschappelijke medezeggenschapsraad in. Het bevoegd gezag kan ten behoeve van
      scholen als bedoeld in de [Wet op het primair onderwijs][ref5] en de [Wet op de expertisecentra][ref6] één
      gemeenschappelijke medezeggenschapsraad instellen, indien de instemming van twee derden van de leden van de
      desbetreffende medezeggenschapsraden is verkregen. De gemeenschappelijke medezeggenschapsraad behandelt uitsluitend
      aangelegenheden die van gemeenschappelijk belang zijn voor de desbetreffende scholen.

      2 Iedere medezeggenschapsraad is vertegenwoordigd in een gemeenschappelijke medezeggenschapsraad.

      3 De leden van de raad worden gekozen uit en door de leden van de desbetreffende afzonderlijke
      medezeggenschapsraden en wel zo dat het aantal leden, gekozen uit personeel onderscheidenlijk uit ouders of
      leerlingen, elk de helft van het aantal leden van de raad bedraagt. De leden van de raad hebben zitting zolang zij
      lid zijn van één van de desbetreffende medezeggenschapsraden.

      4 Het bevoegd gezag stelt voor elke gemeenschappelijke medezeggenschapsraad een reglement vast. In het reglement
      wordt in ieder geval vastgelegd uit hoeveel leden de gemeenschappelijke medezeggenschapsraad bestaat en de
      wijze waarop de verkiezing door de medezeggenschapsraden geschiedt. Het reglement kan tevens bepalen dat voor
      de afzonderlijke medezeggenschapsraden gemeenschappelijke vertegenwoordigers in de raad worden gekozen als de
      desbetreffende afzonderlijke medezeggenschapsraden daartegen geen bezwaar hebben. Voorts worden in het reglement in
      ieder geval geregeld de onderwerpen, bedoeld in [artikel 15, eerste lid, onderdelen d tot en met h en j][ref7].

      5 De gemeenschappelijke medezeggenschapsraad legt in een bijlage bij het reglement de zaken van huishoudelijke aard
      voor de raad vast.

      6 De gemeenschappelijke medezeggenschapsraad wordt vooraf in de gelegenheid gesteld om advies uit te brengen over
      elk door het bevoegd gezag te nemen besluit met betrekking tot vaststelling of wijziging van:

      a. de hoofdlijnen van het meerjarig financieel beleid voor de desbetreffende scholen, waaronder

      1°. de voorgenomen bestemming van de middelen die aan het bevoegd gezag ten behoeve van elk van de scholen uit de
      openbare kas zijn toegerekend of van anderen zijn ontvangen, alsmede

      2°. de criteria die worden toegepast bij de verdeling van deze middelen over voorzieningen op bovenschools niveau
      en op schoolniveau, en

      b. het managementstatuut.

      7 Aan de gemeenschappelijke medezeggenschapsraad wordt de bevoegdheid, bedoeld in [artikel 5, zesde lid][ref8],
      overgedragen. Aan de gemeenschappelijke medezeggenschapsraad kunnen bijzondere bevoegdheden als bedoeld in de
      [artikelen 6 tot en met 9][ref9], of daarvan afwijkende bijzondere bevoegdheden ingevolge de toepassing van
      [artikel 15, tweede lid][ref10], worden overgedragen. De overdracht van deze bevoegdheden vereist de instemming
      van zowel het bevoegd gezag als van twee derden van de leden van de desbetreffende medezeggenschapsraden. De
      bevoegdheden die zijn overgedragen worden vastgelegd in het reglement.

      8 De gemeenschappelijke medezeggenschapsraad treedt in de plaats van de afzonderlijke medezeggenschapsraden ten
      aanzien van de uitoefening van de bevoegdheden, bedoeld in het zevende lid.

      9 Ten aanzien van de op grond van het achtste lid aan de gemeenschappelijke medezeggenschapsraad toekomende
      bevoegdheden, zijn de [artikelen 10 tot en met 13][ref11] van overeenkomstige toepassing.

      10 Het bevoegd gezag legt het reglement, daaronder elke wijziging ervan mede begrepen, als voorstel aan de
      gemeenschappelijke medezeggenschapsraad voor en stelt het slechts vast voor zover het voorstel de instemming
      van twee derden van het aantal leden van de gemeenschappelijk medezeggenschapsraad heeft verworven. Het
      instemmingsvereiste, bedoeld in de eerste volzin, heeft geen betrekking op de bevoegdheden die ingevolge het
      zevende lid zijn overgedragen.

      11 De [artikelen 4][ref12] en [19 tot en met 25][ref13] zijn van overeenkomstige toepassing.


