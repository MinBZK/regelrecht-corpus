        bwb_id: BWBR0005746
        artikel: '15'
  - number: '25'
    text: |-
      1 De medezeggenschapsraad kan in rechte optreden indien de vordering strekt tot naleving door het bevoegd gezag van
      de verplichtingen jegens de raad, voortvloeiend uit deze wet.

      2 Indien de burgerlijke rechter bevoegd is, neemt de kantonrechter kennis van de vordering.

      3 In afwijking van [artikel 237 van het Wetboek van Burgerlijke Rechtsvordering][ref1] en
      [artikel 8:75 van de Algemene wet bestuursrecht][ref2] kan de raad niet in de proceskosten worden veroordeeld.

      4 De raad treedt op verzoek van een geleding in de raad op, indien de rechten van die geleding specifiek aan de
      orde zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel237
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel875
    url: https://wetten.overheid.nl/BWBR0005746/2008-10-22#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '237'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 8:75
  - number: '26'
    text: |-
      1 Het bevoegd gezag stelt het personeel, de ouders en de leerlingen in de gelegenheid om desgewenst
      onderscheidenlijk een personeelsraad dan wel afzonderlijke raden voor het onderwijzend en onderwijsondersteunend
      personeel, een ouderraad en een leerlingenraad in te stellen. Een dergelijke raad is bevoegd desgevraagd of eigener
      beweging advies uit te brengen aan de medezeggenschapsraad met name over die aangelegenheden, die de desbetreffende
      geleding in het bijzonder aangaan.

      2 Op verzoek van een geledingenraad stelt de medezeggenschapsraad het bevoegd gezag in kennis van een schriftelijk
      advies als bedoeld in het eerste lid. [Artikel 5, tweede lid derde volzin][ref1], is ten aanzien van een dergelijk
      schriftelijk advies van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005746#Artikel5
