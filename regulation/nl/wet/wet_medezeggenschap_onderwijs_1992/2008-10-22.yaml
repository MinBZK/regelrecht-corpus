  - number: '16'
    text: |-
      1 De medezeggenschapsraad legt in een bijlage bij het medezeggenschapsreglement vast:

      a. zaken van huishoudelijke aard voor de raad; en

      b. de wijze waarop door het bevoegd gezag beschikbaar gestelde middelen voor de raad en de eventuele
      geledingenraden en deelraden worden verdeeld.

      2 Het bevoegd gezag vermeldt in een bijlage bij het medezeggenschapsreglement:

      a. de commissie voor geschillen waarbij de school is aangesloten;

      b. indien besprekingen als bedoeld in [artikel 5, eerste lid][ref1], namens het bevoegd gezag worden gevoerd, in
      welke gevallen en door wie dat geschiedt;

      c. indien een lid van de schoolleiding namens het bevoegd gezag optreedt in besprekingen als bedoeld in
      [artikel 5, eerste lid][ref2], in welke gevallen dat geschiedt, en in welke gevallen dit lid op zijn verzoek van
      die taak wordt ontheven;

      d. of een lid van de schoolleiding namens het bevoegd gezag optreedt in het overleg, bedoeld in
      [artikel 13, tweede lid][ref3]; en

      e. de wijze waarop het vervallen van het lidmaatschap van de medezeggenschapsraad van een lid van de
      schoolleiding dat is opgedragen om namens het bevoegd gezag op te treden in besprekingen als bedoeld in
      [artikel 5, eerste lid][ref4], dan wel in het overleg, bedoeld in [artikel 13, tweede lid][ref5], is geregeld.

      3 De bijlagen, bedoeld in het eerste en tweede lid, maken geen deel uit van het reglement.


      [ref1]: https://wetten.overheid.nl/BWBR0005746#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005746#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005746#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0005746#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005746#Artikel13
