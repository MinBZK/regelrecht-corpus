      1 Onverminderd het bepaalde in [artikel 39][ref1], blijven de instemmings- en adviesbevoegdheden ten aanzien van de
      bijzondere medezeggenschapsaangelegenheden, bedoeld in artikel 7 van de Wet medezeggenschap onderwijs, zoals deze
      ingevolge genoemde wet zijn vastgelegd in het medezeggenschapsreglement, van kracht tot en met 31 juli 1993.

      2 Indien toepassing wordt gegeven aan [artikel 15, tweede lid][ref2], en daaromtrent de vereiste overeenstemming
      wordt bereikt op een tijdstip, gelegen voor 31 juli 1993, kan het bevoegd gezag met instemming van twee derden van
      het aantal leden van de raad besluiten om het bepaalde in de [artikelen 6][ref3] tot en met [10][ref4] alsmede het
      bepaalde ingevolge [artikel 15, tweede lid][ref5], in werking te doen treden op een eerder tijdstip.

      3 Voor zover in het medezeggenschapsreglement, bedoeld in het eerste lid, instemmingsbevoegdheden zijn vastgelegd
      die niet terugkeren in de resultaten van het bepaalde in het tweede lid, blijft het eerste lid van kracht.


