  - number: '21'
    text: |-
      1 Voor zover aan een voorstel van het bevoegd gezag tot vaststelling of wijziging van het
      medezeggenschapsreglement, voor wat betreft onderwerpen als bedoeld in [artikel 15, eerste en derde lid][ref1],
      de instemming, vereist ingevolge [artikel 14, tweede lid][ref2], is onthouden, deelt het bevoegd gezag aan
      de medezeggenschapsraad dan wel de raad aan het bevoegd gezag binnen drie maanden mede, of het voorstel wordt
      voorgelegd aan de commissie voor geschillen. Indien een dergelijke mededeling niet binnen drie maanden wordt
      gedaan, vervalt het voorstel.

      2 Indien het bevoegd gezag een verzoek doet als bedoeld in [artikel 19, eerste lid onderdeel b][ref3], is
      [artikel 20, tweede lid][ref4], van overeenkomstige toepassing. Indien de raad een verzoek doet als bedoeld in
      [artikel 19, eerste lid onderdeel b][ref5], wordt het verzoek met redenen omkleed en stelt de commissie het bevoegd
      gezag in de gelegenheid om zijn argumenten voor handhaving van het voorstel bij de commissie naar voren te brengen.

      3 De commissie is bevoegd een bemiddelingsvoorstel aan het bevoegd gezag en de raad voor te leggen, tenzij
      het bevoegd gezag dan wel de raad te kennen geven daarop geen prijs te stellen. Indien de commissie van deze
      bevoegdheid geen gebruik maakt of indien haar voorstel niet de instemming verwerft van het bevoegd gezag alsmede
      de instemming van de raad, beoordeelt de commissie of het bevoegd gezag bij afweging van de betrokken belangen
      in redelijkheid tot zijn voorstel heeft kunnen komen. De commissie geeft, voor zover zij van oordeel is dat het
      bevoegd gezag bij afweging van de betrokken belangen niet in redelijkheid tot zijn voorstel heeft kunnen komen, in
      haar uitspraak aan hoe het voorstel dient te worden gewijzigd. Na de uitspraak van de commissie stelt het bevoegd
      gezag het medezeggenschapsreglement vast overeenkomstig de uitspraak van de commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0005746#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005746#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0005746#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0005746#Artikel20
      [ref5]: https://wetten.overheid.nl/BWBR0005746#Artikel19
