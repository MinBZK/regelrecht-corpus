      1 Binnen 4 maanden na de inwerkingtreding van deze wet legt het bevoegd gezag een voorstel van het reglement voor
      de medezeggenschap voor aan de medezeggenschapsraad. De raad spreekt zich binnen 4 maanden uit over het voorstel.
      Het bevoegd gezag stelt het reglement slechts vast voor zover het voorstel de instemming van twee derden van het
      aantal leden van de raad heeft verworven.

      2 Het medezeggenschapsreglement, bedoeld in de Wet medezeggenschap onderwijs, vervalt met ingang van 1 augustus
      1993, indien het bevoegd gezag niet met instemming van de raad bepaalt dat het geheel of gedeeltelijk op een eerder
      tijdstip vervalt. De eerste volzin is niet van toepassing op de advies- en instemmingsbevoegdheden, bedoeld in
      [artikel 41, eerste lid][ref1].


