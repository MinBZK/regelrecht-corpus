      1 Indien het bevoegd gezag van een school de bij of krachtens deze wet gegeven voorschriften niet nakomt, kan Onze
      minister besluiten dat de vergoeding uit de openbare kas geheel of gedeeltelijk wordt ingehouden.

      2 De vergoeding wordt wederom toegekend, indien Onze minister blijkt, dat de reden voor de toepassing van het
      eerste lid is vervallen.

      3 Afschrift van zijn beslissing zendt Onze minister aan gedeputeerde staten en aan burgemeester en wethouders,
      voor zover het een basisschool, een speciale school voor basisonderwijs of een school voor speciaal onderwijs,
      speciaal en voortgezet speciaal onderwijs of voortgezet speciaal onderwijs, dan wel een instelling voor speciaal en
      voortgezet speciaal onderwijs betreft.
