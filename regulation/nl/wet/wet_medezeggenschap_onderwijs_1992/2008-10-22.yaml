  - number: '31'
    text: |-
      1 Op gronden die verband houden met de godsdienstige of levensbeschouwelijke overtuiging die aan
      de school ten grondslag ligt, kan Onze minister op verzoek van het bevoegd gezag van een bijzondere
      school ontheffing verlenen van de voorschriften van deze wet, dan wel toestaan dat de leden bedoeld in
      [artikel 3, derde lid onderdeel b][ref1], voor zover het betreft een school voor voortgezet onderwijs, een school
      voor voortgezet speciaal onderwijs, een instelling voor speciaal en voortgezet speciaal onderwijs of een door Onze
      minister aangewezen inrichting voor voortgezet onderwijs, worden gekozen uit en door de ouders. Het bevoegd gezag
      toont bij zijn verzoek om ontheffing aan, dat dit verzoek wordt ondersteund door een meerderheid van twee derden
      zowel van het personeel van de school als van de bij de school betrokken ouders of leerlingen. Het bevoegd gezag
      toont bij zijn verzoek om de in de eerste volzin bedoelde toestemming aan dat dit verzoek wordt ondersteund door
      een meerderheid van twee derden zowel van het personeel van de school als van de bij de school betrokken ouders.

      2 Onze minister verklaart de ontheffing dan wel de toestemming vervallen, indien de gronden waarop zij berustte,
      niet meer aanwezig zijn dan wel indien zij niet meer wordt ondersteund door een meerderheid van twee derden van elk
      van de in het eerste lid bedoelde categorieën.

      3 Het bevoegd gezag doet elke vijf jaren aan Onze minister mededeling omtrent de stand van zaken met betrekking tot
      de gronden van de ontheffing dan wel de toestemming en de ondersteuning ervan.


      [ref1]: https://wetten.overheid.nl/BWBR0005746#Artikel3
