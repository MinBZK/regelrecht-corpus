  - number: '23'
    text: |-
      Op een verzoek als bedoeld in [artikel 19, eerste lid onderdeel d][ref1], doet de commissie de bindende
      uitspraak welke interpretatie aan het bepaalde bij of krachtens deze wet dan wel het bepaalde in het
      medezeggenschapsreglement dient te worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005746#Artikel19
    url: https://wetten.overheid.nl/BWBR0005746/2008-10-22#Artikel23
