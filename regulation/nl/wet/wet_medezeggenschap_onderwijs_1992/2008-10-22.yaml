  - number: '6'
    text: |-
      Het bevoegd gezag behoeft de voorafgaande instemming van de medezeggenschapsraad voor elk door het bevoegd gezag te
      nemen besluit met betrekking tot in ieder geval de volgende aangelegenheden:

      a. verandering van de onderwijskundige doelstellingen van de school;

      b. vaststelling of wijziging van het schoolplan dan wel het leerplan of de onderwijs- en examenregeling en het
      zorgplan;

      c. vaststelling of wijziging van een mogelijk schoolreglement;

      d. vaststelling van de schoolgids voor zover het niet betreft de vaststelling van de onderwijstijd;

      e. vaststelling of wijziging van het beleid met betrekking tot het verrichten door ouders van ondersteunende
      werkzaamheden ten behoeve van de school en het onderwijs;

      f. vaststelling of wijziging van regels op het gebied van de arbeidsomstandigheden;

      g. het doen van een verzoek tot afwijking als bedoeld in [artikel 30, eerste lid][ref1], van deze wet;

      h. vaststelling of wijziging van het bestuursreglement van een instelling voor educatie en beroepsonderwijs,
      alsmede indien [artikel 9.1.7, vierde lid, van de Wet educatie en beroepsonderwijs][ref2] van toepassing is, het
      desbetreffende deel van de statuten;

      i. vaststelling of wijziging van de model-onderwijsovereenkomst wat een instelling voor educatie en
      beroepsonderwijs betreft; en

      j. het doen van een aanvraag als bedoeld in [artikel 72a, eerste lid, van de Wet op het primair onderwijs][ref3] of
      [artikel 73a, eerste lid, van de Wet op de expertisecentra][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005746#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel9.1.7
