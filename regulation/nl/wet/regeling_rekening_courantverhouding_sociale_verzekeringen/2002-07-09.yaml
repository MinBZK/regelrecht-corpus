  - number: '7'
    text: |-
      Het College voor zorgverzekeringen is bevoegd een bedrag van ten hoogste 2,5 (tweeëneenhalf) miljoen euro buiten de
      rekening-courant te houden.
    url: https://wetten.overheid.nl/BWBR0009109/2002-07-09#Artikel7
  - number: '8'
    text: |-
      1 Deze regeling wordt aangehaald als: Regeling rekening-courantverhouding sociale verzekeringen.

      2 Zij treedt in werking met ingang van 1 januari 1998.

      3 Zij wordt in de Staatscourant geplaatst en wordt tevens opgenomen in het Handboek Financiële Informatie en
      Administratie Rijksoverheid (HAFIR) van het ministerie van Financiën.
    url: https://wetten.overheid.nl/BWBR0009109/2002-07-09#Artikel8
