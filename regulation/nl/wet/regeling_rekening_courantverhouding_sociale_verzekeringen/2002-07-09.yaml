        bwb_id: BWBR0009109
        artikel: '3'
  - number: '5'
    text: |-
      1 Over de dagelijkse credit-saldi van elk van de rekeningen-courant wordt door de minister een rente vergoed die
      gelijk is aan het 12-maands Aibor van de desbetreffende dag.

      2 Over de dagelijkse debet-saldi van elk van de rekeningen-courant wordt door de rekening-couranthouders een rente
      betaald die gelijk is aan het 1-maands Aibor.

      3 In afwijking van het bepaalde in het eerste lid wordt door de minister aan het UWV over het gedurende het
      gehele jaar aanwezige minimale creditsaldo van de rekening-courant ten behoeve van de financiële middelen van
      de gezamenlijke wachtgeldfondsen een rente vergoed die gelijk is aan het effectief rendement op staatsobligaties
      met een resterende looptijd van 5 tot 6 jaar verhoogd met 10 basispunten. Voor de dagsaldi die boven dit minimale
      creditsaldo uitkomen, wordt over die meerdere saldi een aanvullende rente berekend. Daarvoor is het bepaalde in het
      eerste lid van toepassing.

      4 De minister deelt de geldende rentepercentages schriftelijk aan de rekening-couranthouders mee.

      5 De rente wordt jaarlijks achteraf, met valuta-datum 31 december van het jaar waarop de renteberekening betrekking
      heeft, ten gunste respectievelijk ten laste van de rekeningen-courant geboekt. Daartoe stelt de minister een
      rentenota op.

      6 Het bepaalde in [artikel 4, tweede lid][ref1], is op een renteboeking niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009109#Artikel4
    url: https://wetten.overheid.nl/BWBR0009109/2002-07-09#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009109
        artikel: '4'
  - number: '6'
    text: |-
      1 De minister doet op werkdagen, niet later dan 15.30 uur, van de saldi en de mutaties in de saldi van de
      rekeningen-courant schriftelijk of electronisch mededeling aan de rekening-couranthouders.

      2 De rekening-couranthouders doen op werkdagen aan de minister:

      a. vóór 9.30 uur schriftelijk of electronisch een opdracht toekomen als bedoeld in [artikel 4, tweede lid][ref1],
      met daarbij een prognose van de kasopnamen en de kasafstortingen met betrekking tot de desbetreffende dag en de
      eerste drie daarop volgende werkdagen; een en ander conform het model ’Dagprognose’, opgenomen in bijlage 1 bij
      deze regeling;

      b. vóór 12.30 uur telefonisch of electronisch een overzicht toekomen van de bijschrijvingen als bedoeld in
      [artikel 3, onderdeel c][ref2].

      3 Voor aanvang van een kalenderjaar verstrekken de rekening-couranthouders met betrekking tot dat jaar een
      globale raming van de saldi van de rekeningen-courant en van de mutaties daarin, conform het model ’Jaarprognose’,
      opgenomen in bijlage 2 bij deze regeling.

      4 De in het derde lid bedoelde globale ramingen worden maandelijks geactualiseerd en worden uiterlijk op de
      eerste werkdag van de maand aan de minister verstrekt. Deze actualisering wordt verwerkt conform het model
      ’Maandprognose’, opgenomen in bijlage 3 bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009109#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009109#Artikel3
    url: https://wetten.overheid.nl/BWBR0009109/2002-07-09#Artikel6
