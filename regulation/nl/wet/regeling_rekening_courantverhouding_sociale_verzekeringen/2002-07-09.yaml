articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            de minister:

              de Minister van Financiën;



            b
            het UWV:

              Uitvoeringsinstituut werknemersverzekeringen;



            c
             een rekening-courant:

              een rekening in de centrale administratie van ’s Rijks schatkist bij het ministerie van Financiën op naam
      van een rekening-couranthouder, waarop dagelijks worden bijgehouden het geldelijk tegoed (positief of negatief) van
      de betrokken rekening-couranthouder bij het Rijk en de mutaties in het tegoed;



            d
             de rekening-couranthouder:

              de Sociale verzekeringsbank, het UWV of het College zorgverzekeringen, ieder voor zover het hem aangaat;



            e
            Aibor:

              het rentetarief dat dagelijks door De Nederlandsche Bank N.V. wordt berekend op basis van rentetarieven
      waartegen banken bereid zijn interbancair geld uit te lenen.
    url: https://wetten.overheid.nl/BWBR0009109/2002-07-09#Artikel1
  - number: '2'
    text: |-
      In de centrale administratie van ’s Rijks schatkist worden de volgende rekeningen-courant geopend:

      a. één rekening-courant op naam van de Sociale Verzekeringsbank ten behoeve van de financiële middelen van het
      Algemeen Kinderbijslagfonds, het Algemeen Ouderdomsfonds en het Algemeen Nabestaandenfonds;

      b. één of meer rekeningen-courant op naam van het UWV ten behoeve van de financiële middelen van de fondsen die het
      UWV beheert:

      c. één rekening-courant op naam van het College zorgverzekeringen ten behoeve van de financiële middelen van het
      Algemeen Fonds Bijzondere Ziektekosten en de Algemene Kas op grond van [artikel 1p van de Ziekenfondswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1p
    url: https://wetten.overheid.nl/BWBR0009109/2002-07-09#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 1p
  - number: '3'
    text: |-
      Ten gunste van de in [artikel 2][ref1] bedoelde rekeningen-courant worden in elk geval geboekt:

      a. de bijdragen van het Rijk aan de Algemene Kas en aan de fondsen die door de rekening-couranthouders worden
      beheerd;

      b. de afdrachten van de door de Rijksbelastingdienst geïnde premies aan de fondsen die door de rekening-
      couranthouders worden beheerd;

      c. de bijschrijvingen op het tegoed van ’s Rijks schatkist bij de Nederlandsche Bank N.V. door of ten behoeve van
      de rekening-couranthouders.


      [ref1]: https://wetten.overheid.nl/BWBR0009109#Artikel2
    url: https://wetten.overheid.nl/BWBR0009109/2002-07-09#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009109
        artikel: '2'
  - number: '4'
    text: |-
      1 Ten laste van de in [artikel 2][ref1] bedoelde rekeningen-courant worden in elk geval geboekt:

      a. de afdrachten door de rekening-couranthouders ten gunste van het tegoed dat een onderdeel van het Rijk of een
      derde bij ’s Rijks schatkist in rekening-courant aanhoudt;

      b. de eventuele terugbetalingen aan de Rijksbelastingdienst samenhangende met de afdrachten bedoeld in
      [artikel 3, onderdeel b][ref2];

      c. de afschrijvingen van het tegoed van ’s Rijks schatkist bij de Nederlandsche Bank N.V. door de rekening-
      couranthouders.

      2 Elke boeking ten laste van een rekening-courant vindt plaats nadat de rekening-couranthouder daartoe tijdig
      schriftelijk of electronisch een opdracht bij de minister heeft ingediend.

      3 De minister kan voorschrijven dat elke opdracht van een rekening-couranthouder schriftelijk of electronisch wordt
      ondertekend door twee daartoe bevoegde functionarissen van wie de handtekeningen vooraf bij hem zijn gedeponeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0009109#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009109#Artikel3
    url: https://wetten.overheid.nl/BWBR0009109/2002-07-09#Artikel4
    references:
