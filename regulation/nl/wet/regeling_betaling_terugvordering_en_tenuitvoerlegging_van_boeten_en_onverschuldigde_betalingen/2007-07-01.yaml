  - number: '2'
    text: |-
      Het UWV stelt de termijnen waarbinnen de vordering wordt verrekend of betaald vast met inachtneming van deze
      regeling.
    url: https://wetten.overheid.nl/BWBR0008082/2007-07-01#Artikel2
  - number: '3'
    text: |-
      Als de schuldenaar recht heeft op een nabetaling van het UWV, de Sociale Verzekeringsbank of een college van
      burgemeester en wethouders dient de vordering terstond te worden voldaan door verrekening met de nabetaling.

      Vervolgens wordt de vordering voor zover mogelijk voldaan door verrekening met een lopende uitkering. Als dit niet
      mogelijk is vindt aflossing plaats door betaling in termijnen door de schuldenaar.
    url: https://wetten.overheid.nl/BWBR0008082/2007-07-01#Artikel3
  - number: '4'
    text: |-
      1 Indien de vordering tot en met € 52 bedraagt, stelt het UWV de wijze waarop en de termijnen waarbinnen deze
      vordering moet worden voldaan vast, zonder de schuldenaar in de gelegenheid te stellen een voorstel te doen inzake
      de voldoening van de vordering.

      2 Het UWV kan de termijnen van betaling of verrekening vaststellen conform een met redenen omkleed voorstel van de
      schuldenaar, mits volgens dit voorstel de gehele vordering binnen 12 maanden wordt voldaan en de schuldenaar dit
      voorstel heeft gedaan binnen 6 weken nadat hem daartoe de gelegenheid is geboden door het UWV.
    url: https://wetten.overheid.nl/BWBR0008082/2007-07-01#Artikel4
  - number: '5'
    text: |-
      1 Onverminderd [artikel 4][ref1] stelt het UWV de aflossingstermijnen vast na overleg met de schuldenaar en met
      inachtneming van dit artikel, tenzij:

      a. het UWV de aflossingstermijnen heeft vastgesteld op voorstel van de schuldenaar, bedoeld in [artikel 4][ref2];

      b. de vordering een boete betreft;

      c. de onverschuldigde betaling het gevolg is van een gedraging waarvoor aan de schuldenaar een boete is opgelegd;
      of

      d. de onverschuldigde betaling het gevolg is van een gedraging waarvan het UWV aangifte heeft gedaan of waarvan
      proces-verbaal is opgemaakt en ingezonden.

      2 Onverminderd het bepaalde in [artikel 7][ref3] wordt de vordering geheel voldaan door middel van periodieke
      betalingen of verrekeningen gedurende 36 maanden te rekenen vanaf de dag waarop het UWV aan de schuldenaar
      kennis heeft gegeven van de vaststelling van de termijnen. De aflossingstermijn is ter hoogte van de volledige
      aflossingscapaciteit hetgeen een betaling gedurende minder dan 36 maanden met zich mee kan brengen.

      3 In afwijking van het tweede lid, tweede zin, wordt op verzoek van de schuldenaar ten minste
      de halve aflossingscapaciteit toegepast onder de voorwaarde dat de vordering geheel wordt
      voldaan gedurende 36 maanden te rekenen vanaf de dag dat het UWV aan de schuldenaar kennis heeft
      gegeven van de termijnen. De schuldenaar wordt erop gewezen dat ambtshalve kwijtschelding als
      bedoeld in de [artikelen 36, derde lid, van de WW][ref4], [33, derde lid, van de ZW][ref5],
      [57, derde lid, van de WAO][ref6], [63, derde lid, van de WAZ][ref7],[ 55, derde lid, van de Wajong][ref8],
      [20, derde lid, van de TW][ref9],[ 77, derde lid, van de Wet WIA][ref10], of [artikel 3:16][ref11],
      [artikel 3:27 WAZO][ref12], niet mogelijk is.

      4 Indien de schuldenaar voorstelt om hogere periodieke betalingen te doen dan het bedrag, bedoeld in het tweede
      lid, stelt het UWV de termijnen conform dit voorstel vast.

      5 Indien de schuldenaar, bij aanwending van zijn volledige aflossingscapaciteit, de vordering niet binnen 36
      maanden volledig zal kunnen voldoen, wendt hij zijn vermogen aan zodat een zodanig gedeelte van de vordering binnen
      6 weken, nadat het UWV aan de schuldenaar kennis heeft gegeven van de vaststelling van de termijnen, wordt voldaan,
      dat hij de resterende vordering binnen 36 maanden kan voldoen.

      Indien echter de schuldenaar ten genoegen van het UWV zekerheid stelt voor aflossing van de gehele vordering binnen
      36 maanden, nadat de vaststelling van de termijnen hem bekend is gemaakt, behoeft de schuldenaar zijn vermogen niet
      aan te wenden.

      6 De periodieke betaling of verrekening wordt gesteld op de volledige aflossingscapaciteit verminderd met 5 % van
      de bijstandsnorm indien

      a. de schuldenaar met aanwending van zijn volledige aflossingscapaciteit en vermogen niet in staat is de vordering
      binnen 36 maanden te voldoen en

      b. periodieke betaling of verrekening gedurende 60 maanden van het aldus verkregen bedrag leidt tot een grotere
      aflossing dan betaling of verrekening gedurende 36 maanden van het op grond van het tweede en derde lid verkregen
      bedrag.


