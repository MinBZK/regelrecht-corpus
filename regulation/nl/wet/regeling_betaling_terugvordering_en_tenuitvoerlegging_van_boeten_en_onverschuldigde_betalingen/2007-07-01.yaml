  - number: '6'
    text: |-
      1 Dit artikel is van toepassing indien de vordering

      a. een boete betreft;

      b. het gevolg is van het niet nakomen van de inlichtingenverplichting dan wel van een gedraging waarvan het UWV
      aangifte heeft gedaan of waarvan proces-verbaal is opgemaakt en ingezonden.

      2 Het UWV stelt de aflossingstermijnen zodanig vast dat gebruik wordt gemaakt van de volledige aflossingscapaciteit
      van de schuldenaar, onverminderd het bepaalde in [artikel 7][ref1], tenzij het UWV de termijnen heeft vastgesteld
      conform het bepaalde in [artikel 4][ref2].

      3 Indien de schuldenaar voorstelt om hogere betalingen te doen dan het bedrag ingevolge het tweede lid, stelt het
      UWV de termijnen conform dit voorstel vast.

      4 Indien de schuldenaar de vordering niet binnen 12 maanden volledig zal kunnen voldoen, wendt hij zijn vermogen
      aan zodat een zodanig gedeelte van de vordering binnen 6 weken, nadat het UWV aan de schuldenaar kennis heeft
      gegeven van de vaststelling van de termijnen, wordt voldaan, dat hij de resterende vordering binnen 12 maanden
      kan voldoen.

      Indien echter de schuldenaar ten genoegen van het UWV zekerheid stelt voor aflossing van de gehele vordering binnen
      12 maanden, nadat de vaststelling van de termijnen hem bekend is gemaakt, behoeft de schuldenaar zijn vermogen niet
      aan te wenden.

      5 Onverminderd het bepaalde in [artikel 8][ref3] stelt het UWV de termijnen waarbinnen wordt verrekend of moet
      worden betaald vast over een periode van meer dan 12 maanden indien de schuldenaar, ook na aanwending van zijn
      vermogen, niet in staat is om de vordering binnen 12 maanden te voldoen.


