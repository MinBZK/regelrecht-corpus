articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. WW: [Werkloosheidswet][ref1];

      b. ZW: [Ziektewet][ref2];

      c. WAO: [Wet op de arbeidsongeschiktheidsverzekering][ref3];

      d. WAZ: [Wet op de arbeidsongeschiktheidsverzekering zelfstandigen][ref4];

      e. WAZO: [Wet arbeid en zorg][ref5];

      f. Wajong: [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref6],

      g. Wet WIA: [Wet werk en inkomen naar arbeidsvermogen][ref7];

      h. TW: [Toeslagenwet][ref8];

      i. schuldenaar: degene aan wie een boete is opgelegd of van wie een bedrag wordt teruggevorderd;

      j. boete: een boete als bedoeld in het eerste lid van de [artikelen 27a van de WW][ref9], [45a van de ZW][ref10],
      [29a van de WAO][ref11], [48 van de WAZ][ref12],[ 3:16][ref13] en [3:27 van de WAZO][ref14],
      [40 van de Wajong][ref15] en [91 van de Wet WIA][ref16] en [14a van de TW][ref17];

      k. vordering: het bedrag dat wordt teruggevorderd op grond van de [artikelen 36 van de WW][ref18],
      [33 van de ZW][ref19], [57 van de WAO][ref20], [63 van de WAZ][ref21], [3:16][ref22] en [3:27 van de WAZO][ref23],
      [55 van de Wajong][ref24], [77 van de Wet WIA][ref25] of [20 van de TW][ref26] of het bedrag dat als boete is
      opgelegd.

      l. wettelijke rente en de kosten van invordering: de wettelijke rente en de op de invordering betrekking
      hebbende kosten, bedoeld in het zesde lid van de [artikelen 27g van de WW][ref27], [45g van de ZW][ref28],
      [29g van de WAO][ref29],[ 54 van de WAZ][ref30], [3:16][ref31] en [3:27 van de WAZO][ref32],
      [46 van de Wajong][ref33], [96 van de Wet WIA][ref34] en [14g van de TW][ref35];

      m. aflossingscapaciteit: het deel van het inkomen van de schuldenaar dat met inachtneming van de beslagvrije voet,
      bedoeld in de artikelen[ 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref36], kan worden
      aangewend voor betaling of verrekening van de vordering;

      n. vermogen: vermogensrechten, onroerende en roerende zaken, niet zijnde gebruikelijke huisraad, waarvan de
      dagwaarde per zaak € 1 134 of meer bedraagt.

      o. inlichtingenverplichting: de verplichting, bedoeld in de
      [artikelen 25 van de WW][ref37],[ 31, eerste lid][ref38], en[ 49 van de ZW][ref39], [80 van de WAO][ref40],
      [70 van de WAZ][ref41], [3:16][ref42] en [3:27 van de WAZO][ref43], [62 van de Wajong][ref44],
      [27 van de Wet WIA][ref45] en [12 van de TW][ref46];

      p. bijstandsnorm: de voor de schuldenaar op grond van de in [Hoofdstuk 3, paragraaf 3.2][ref47]
      en[ paragraaf 3.3, genoemde artikelen van de Wet werk en bijstand][ref48] geldende bijstandsnorm;

      q. UWV: Uitvoeringsinstituut werknemersverzekeringen, genoemd in hoofdstuk 5 van de Wet structuur
      uitvoeringsorganisatie werknemersverzekeringen;

      r. aflossingstermijn: termijn waarbinnen de vordering wordt verrekend of betaald.


