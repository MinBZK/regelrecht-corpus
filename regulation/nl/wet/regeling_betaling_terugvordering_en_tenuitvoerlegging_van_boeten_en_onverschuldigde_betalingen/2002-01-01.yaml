$id: regeling_betaling_terugvordering_en_tenuitvoerlegging_van_boeten_en_onverschuldigde_betalingen
regulatory_layer: WET
publication_date: '2009-06-29'
valid_from: '2002-01-01'
bwb_id: BWBR0008082
url: https://wetten.overheid.nl/BWBR0008082/2002-01-01
preamble:
  text: >-
    Gelet op het bepaalde in de artikelen 27c, derde lid, van de Werkloosheidswet, 36b van de Werkloosheidswet, 33b van
    de Ziektewet, 45c, derde lid, van de Ziektewet, 29c, derde lid, van de Wet op de arbeidsongeschiktheidsverzekering,
    57b van de Wet op de arbeidsongeschiktheidsverzekering, 20c, derde lid, Algemene Arbeidsongeschiktheidswet, 48b van
    de Algemene Arbeidsongeschiktheidswet, 14c, derde lid, van de Toeslagenwet en 20b van de Toeslagenwet;


    Besluit:
  url: https://wetten.overheid.nl/BWBR0008082/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: >-
      In dit besluit wordt verstaan onder:


      a. WW: Werkloosheidswet;


      b. ZW: Ziektewet;


      c. WAO: Wet op de arbeidsongeschiktheidsverzekering;


      d. WAZ: de Wet op de arbeidsongeschiktheidsverzekering zelfstandigen


      e. Wajong: Wet op arbeidsongeschiktheidsvoorziening jonggehandicapten,


      f. TW: Toeslagenwet;


      g. schuldenaar: degene aan wie een boete is opgelegd of van wie een bedrag wordt teruggevorderd;


      h. boete: een boete als bedoeld in het eerste lid van de artikelen 27a van de WW, 45a van de ZW, 29a van de WAO, 48
      van de WAZ, 40 van de Wajong en 14a van de TW;


      i. vordering: het bedrag dat wordt teruggevorderd op grond van de artikelen 36 van de WW, 33 van de ZW, 57 van de
      WAO, 63 van de WAZ, 55 van de Wajong of 20 van de TW of het bedrag dat als boete is opgelegd.


      j. wettelijke rente en de kosten van invordering: de wettelijke rente en de op de invordering betrekking hebbende
      kosten, bedoeld in het zevende lid van de artikelen 27g van de WW, 45g van de ZW, 29g van de WAO, 54 van de WAZ, 46
      van de Wajong en 14g van de TW;


      k. aflossingscapaciteit: het deel van het inkomen van de schuldenaar dat met inachtneming van de beslagvrije voet,
      bedoeld in de artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering, kan worden aangewend
      voor betaling of verrekening van de vordering;


      Indien de schuldenaar is gehuwd, wordt het tot de gemeenschap behorende inkomen van de echtgenoot tot het inkomen
      gerekend. De beslagvrije voet wordt dan niet verminderd met het inkomen van de echtgenoot.


      l. vermogen: vermogensrechten, onroerende en roerende zaken waarvan de dagwaarde per zaak € 1 134 of meer bedraagt.
      De gebruikelijke huisraad valt niet onder vermogen;


      m. inlichtingenplicht: de verplichting, bedoeld in de artikelen 25 van de WW, 31, eerste lid, van de ZW, 49 van de
      ZW, 80 van de WAO, 70 van de WAZ 62 van de Wajong en 12 van de TW.


      n. bijstandsnorm: de voor de schuldenaar op grond van artikel 29 t/m 33 van de Algemene bijstandswet geldende
      bijstandsnorm.
    url: https://wetten.overheid.nl/BWBR0008082/2002-01-01#Artikel1
  - number: '2'
    text: >-
      Het Landelijk instituut sociale verzekeringen stelt de termijnen waarbinnen de vordering wordt verrekend of betaald
      vast met inachtneming van dit besluit.
    url: https://wetten.overheid.nl/BWBR0008082/2002-01-01#Artikel2
  - number: '3'
    text: >-
      Als de schuldenaar recht heeft op een nabetaling van het Landelijk instituut sociale verzekeringen, de Sociale
      Verzekeringsbank of een gemeente dient de vordering terstond te worden voldaan door verrekening met de nabetaling.


      Vervolgens wordt de vordering voor zover mogelijk voldaan door verrekening met een lopende uitkering. Als dit niet
      mogelijk is vindt aflossing plaats door betaling in termijnen door de schuldenaar.
    url: https://wetten.overheid.nl/BWBR0008082/2002-01-01#Artikel3
  - number: '4'
    text: >-
      1 Indien de vordering tot en met € 45 bedraagt, stelt het Landelijk instituut sociale verzekeringen de wijze waarop
      en de termijnen waarbinnen deze vordering moet worden voldaan vast, zonder de schuldenaar in de gelegenheid te
      stellen een voorstel te doen inzake de voldoening van de vordering.


      2 Het Landelijk instituut sociale verzekeringen kan de termijnen van betaling of verrekening vaststellen conform
      een met redenen omkleed voorstel van de schuldenaar, mits volgens dit voorstel de gehele vordering binnen 12
      maanden wordt voldaan en de schuldenaar dit voorstel heeft gedaan binnen 6 weken nadat hem daartoe de gelegenheid
      is geboden door het Landelijk instituut sociale verzekeringen.
    url: https://wetten.overheid.nl/BWBR0008082/2002-01-01#Artikel4
  - number: '5'
    text: >-
      1 Dit artikel is van toepassing op vorderingen uitgezonderd


      a. indien het Landelijk instituut sociale verzekeringen de termijnen heeft vastgesteld op voorstel van de
      schuldenaar conform artikel 4


      b. de boete


      c. indien de onverschuldigde betaling het gevolg is van een gedraging waarvoor aan de schuldenaar een boete is
      opgelegd


      d. de onverschuldigde betaling het gevolg is van een gedraging waarvan de bedrijfsvereniging aangifte heeft gedaan
      of waarvan proces-verbaal is opgemaakt en ingezonden.


      2 Het Landelijk instituut sociale verzekeringen stelt de termijnen van aflossing vast na overleg met de schuldenaar
      en met inachtneming van de navolgende leden.


      3 Onverminderd het bepaalde in artikel 7 wordt de vordering geheel voldaan door middel van periodieke betalingen
      of verrekeningen gedurende 36 maanden te rekenen vanaf de dag waarop de bedrijfsvereniging aan de schuldenaar
      kennis heeft gegeven van de vaststelling van de termijnen. De periodieke betaling of verrekening is ter hoogte van
      tenminste de halve en ten hoogste de volledige aflossingscapaciteit hetgeen een betaling gedurende minder dan 36
      maanden met zich mee kan brengen.


      4 Indien de schuldenaar voorstelt om hogere periodieke betalingen te doen dan het bedrag ingevolge het derde lid,
      stelt het Landelijk instituut sociale verzekeringen de termijnen conform dit voorstel vast.


      5 Indien de schuldenaar, bij aanwending van zijn volledige aflossingscapaciteit, de vordering niet binnen 36
      maanden volledig zal kunnen voldoen, wendt hij zijn vermogen aan zodat een zodanig gedeelte van de vordering
      binnen 6 weken, nadat het Landelijk instituut sociale verzekeringen aan de schuldenaar kennis heeft gegeven van de
      vaststelling van de termijnen, wordt voldaan, dat hij de resterende vordering binnen 36 maanden kan voldoen.


      Indien echter de schuldenaar ten genoegen van het Landelijk instituut sociale verzekeringen zekerheid stelt voor
      aflossing van de gehele vordering binnen 36 maanden, nadat de vaststelling van de termijnen hem bekend is gemaakt,
      behoeft de schuldenaar zijn vermogen niet aan te wenden.


      6 De periodieke betaling of verrekening wordt gesteld op de volledige aflossingscapaciteit verminderd met 5 % van
      de bijstandsnorm indien


      a. de schuldenaar met aanwending van zijn volledige aflossingscapaciteit en vermogen niet in staat is de vordering
      binnen 36 maanden te voldoen en


      b. periodieke betaling of verrekening gedurende 60 maanden van het aldus verkregen bedrag leidt tot een grotere
      aflossing dan betaling of verrekening gedurende 36 maanden van het op grond van de leden 3 en 4 verkregen bedrag.
    url: https://wetten.overheid.nl/BWBR0008082/2002-01-01#Artikel5
  - number: '6'
    text: >-
      1 Dit artikel is van toepassing indien de vordering


      a. een boete betreft;


      b. het gevolg is van het niet nakomen van de inlichtingenplicht dan wel van een gedraging waarvan het Landelijk
      instituut sociale verzekeringen aangifte heeft gedaan of waarvan proces-verbaal is opgemaakt en ingezonden. Indien
      echter besloten wordt om geen boete op te leggen is vanaf dat moment artikel 5 van toepassing.


      2 Het Landelijk instituut sociale verzekeringen stelt de termijnen van aflossing zodanig vast dat gebruik wordt
      gemaakt van de volledige aflossingscapaciteit van de schuldenaar, onverminderd het bepaalde in artikel 7, tenzij
      het Landelijk instituut sociale verzekeringen de termijnen op voorstel van de schuldenaar heeft vastgesteld conform
      het bepaalde in artikel 4.


      3 Indien de schuldenaar voorstelt om hogere betalingen te doen dan het bedrag ingevolge het tweede lid, stelt het
      Landelijk instituut sociale verzekeringen de termijnen conform dit voorstel vast.


      4 Indien de schuldenaar de vordering niet binnen 12 maanden volledig zal kunnen voldoen, wendt hij zijn vermogen
      aan zodat een zodanig gedeelte van de vordering binnen 6 weken, nadat het Landelijk instituut sociale verzekeringen
      aan de schuldenaar kennis heeft gegeven van de vaststelling van de termijnen, wordt voldaan, dat hij de resterende
      vordering binnen 12 maanden kan voldoen.


      Indien echter de schuldenaar ten genoegen van het Landelijk instituut sociale verzekeringen zekerheid stelt voor
      aflossing van de gehele vordering binnen 12 maanden, nadat de vaststelling van de termijnen hem bekend is gemaakt,
      behoeft de schuldenaar zijn vermogen niet aan te wenden.


      5 Onverminderd het bepaalde in artikel 8 stelt het Landelijk instituut sociale verzekeringen de termijnen
      waarbinnen wordt verrekend of moet worden betaald vast over een periode van meer dan 12 maanden indien de
      schuldenaar, ook na aanwending van zijn vermogen, niet in staat is om de vordering binnen 12 maanden te voldoen.
    url: https://wetten.overheid.nl/BWBR0008082/2002-01-01#Artikel6
  - number: '7'
    text: >-
      1 Indien de schuldenaar een betalingsregeling heeft getroffen met één of meer derden die beschikken over een
      executoriale titel, kan het Landelijk instituut sociale verzekeringen rekening houden met deze betalingsregelingen
      bij de vaststelling van de termijn of termijnen waarbinnen wordt verrekend of betaald. Het bedrag van de
      verrekening of betaling wordt in elk geval niet gesteld op een lager bedrag dan het aandeel waarop het
      Landelijk instituut sociale verzekeringen aanspraak zou kunnen maken bij verrekening met een lopende uitkering
      respectievelijk executoriaal beslag door het Landelijk instituut sociale verzekeringen op loon, sociale uitkeringen
      of andere periodieke betalingen, indien door deze derden beslag zou zijn gelegd. Het Landelijk instituut sociale
      verzekeringen is bevoegd om een schuldeiser, met wie de schuldenaar, tenminste één jaar voor de beslissing tot
      terugvordering is afgegeven, een betalingsregeling is overeengekomen, gelijk te stellen met een schuldeiser die in
      het bezit is van een executoriale titel.


      2 In afwijking van het eerste lid wordt op de aflossingscapaciteit in mindering gebracht de betaalde bijdrage tot €
      113 per persoon in


      a. levensonderhoud van de ex-echtgenoot;


      b. de kosten van verzorging en opvoeding van minderjarige kinderen die niet tot het huishouden behoren;


      c. levensonderhoud en studie van meerderjarige kinderen tot 27 jaar.


      3 Indien het Landelijk instituut sociale verzekeringen zijn medewerking verleent aan een gerechtelijk of
      buitengerechtelijk akkoord ter sanering van de schulden van de schuldenaar kan, in afwijking van het eerste en
      tweede lid, worden ingestemd met een ander aandeel in de aflossingscapaciteit en het betrekken van vorderingen van
      andere schuldeisers in de vaststelling van dit aandeel, indien


      a. de vordering van het Landelijk instituut sociale verzekeringen tenminste zal worden voldaan naar evenredigheid
      met vorderingen van schuldeisers met gelijke rang en het te ontvangen deel van de vordering van het Landelijk
      instituut sociale verzekeringen van tenminste dezelfde omvang is als kan worden verkregen indien een saneringsplan
      als bedoeld in artikel 343 van de Faillissementswet wordt vastgesteld en


      b. het Landelijk instituut sociale verzekeringen noch in uitkeringspercentage noch in tempo van betaling wordt
      achtergesteld bij gelijkbevoorrechte schuldeisers en


      c. redelijkerwijs mag worden aangenomen dat de schuldenaar, afgezien van de daarvoor te vervullen formaliteiten, in
      aanmerking zou komen voor de toepassing van de schuldsaneringsregeling natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0008082/2002-01-01#Artikel7
  - number: '8'
    text: |-
      Onverminderd het bepaalde in de [artikelen 5][ref1] en [7][ref2], wordt de periodieke betaling of verrekening
      gesteld op de volledige aflossingscapaciteit verminderd met 5 % van de bijstandsnorm, indien de schuldenaar de
      vordering na vijf jaar niet volledig heeft voldaan met inachtneming van de conform de vorige artikelen vastgestelde
      termijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0008082#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008082#Artikel7
    url: https://wetten.overheid.nl/BWBR0008082/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008082
        artikel: '5'
        paragraaf: II
      - id: ref2
        bwb_id: BWBR0008082
        artikel: '7'
        paragraaf: II
  - number: '9'
    text: >-
      Indien de schuldenaar op enig tijdstip niet volgens de vastgestelde termijnen betaalt, wordt de vordering
      opeisbaar.
    url: https://wetten.overheid.nl/BWBR0008082/2002-01-01#Artikel9
  - number: '10'
    text: >-
      Indien de schuldenaar de verplichting, bedoeld in de artikelen 36, vierde lid, van de WW, 33, vierde lid, van de
      ZW, 57, vierde lid, van de WAO, 63, vijfde lid, van de WAZ, 55, vierde lid, van de Wajong, 20, vierde lid, van de
      TW, 27a, vierde lid, van de WW, 45a, vierde lid, van de ZW, 29a, vierde lid, van de WAO, 48, vierde lid, van de
      WAZ, 40, vierde lid, van de Wajong of 14a, vierde lid, van de TW, niet nakomt, wordt de vordering opeisbaar.
    url: https://wetten.overheid.nl/BWBR0008082/2002-01-01#Artikel10
  - number: '11'
    text: >-
      Het Landelijk instituut sociale verzekeringen kan de vastgestelde termijnen herzien wegens gewijzigde
      omstandigheden met inachtneming van dit besluit.
    url: https://wetten.overheid.nl/BWBR0008082/2002-01-01#Artikel11
  - number: '12'
    text: >-
      1 De wettelijke rente en de kosten van invordering zijn verschuldigd vanaf het tijdstip dat de termijn is
      verstreken waarbinnen volgens het besluit van het Landelijk instituut sociale verzekeringen moest worden betaald.


      2 De op de invordering betrekking hebbende kosten bedragen:


      a. 15 % van de resterende vordering, doch ten minste € 45 en ten hoogste € 681 alsmede


      b. de kosten van betekening en gerechtelijke tenuitvoerlegging, zoals vastgesteld bij of krachtens de Wet tarieven
      in burgerlijke zaken.
    url: https://wetten.overheid.nl/BWBR0008082/2002-01-01#Artikel12
  - number: '13'
    text: >-
      1 Tenzij de schuldenaar een andere vordering aanwijst wordt een betaling die zou kunnen worden toegerekend aan twee
      of meerdere vorderingen, op de eerste plaats toegerekend aan een verschuldigde boete.


      2 Zijn er vervolgens nog meerdere vorderingen waarop de toerekening zou kunnen plaatsvinden, dan wordt deze
      op de eerste plaats toegerekend aan de oudste. Zijn de vorderingen even oud, dan geschiedt de toerekening naar
      evenredigheid.


      3 Betaling op een bepaalde vordering strekt eerst in mindering van de kosten, vervolgens de verschenen rente en
      tenslotte de hoofdsom en de lopende rente.
    url: https://wetten.overheid.nl/BWBR0008082/2002-01-01#Artikel13
  - number: '14'
    text: >-
      In geval de toepassing van dit besluit leidt tot een kennelijke hardheid is het Landelijk instituut sociale
      verzekeringen bevoegd van het gestelde in dit besluit af te wijken.
    url: https://wetten.overheid.nl/BWBR0008082/2002-01-01#Artikel14
  - number: '15'
    text: Dit besluit is niet van toepassing op de in artikel 62 van de WAO geregelde loonkostensubsidie.
    url: https://wetten.overheid.nl/BWBR0008082/2002-01-01#Artikel15
  - number: '16'
    text: >-
      Indien het bij koninklijke boodschap van 21 september 1994 ingediende voorstel van wet houdende wijziging van
      de sociale zekerheidswetten in verband met de nadere vaststelling van een stelsel van administratieve sancties,
      alsook tot wijziging van de daarin vervatte regels tot terugvordering van ten onrechte betaalde uitkering en
      de invordering daarvan (Wet boeten, maatregelen en terug- en invordering sociale zekerheid; Kamerstukken II,
      1994/1995, nr. 23 909) tot wet wordt verheven en in werking treedt, treedt dit besluit op hetzelfde tijdstip in
      werking. Indien dit besluit na inwerkingtreding van genoemde wet wordt bekend gemaakt in de Staatscourant, treedt
      dit besluit in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0008082/2002-01-01#Artikel16
  - number: '17'
    text: >-
      Dit besluit wordt aangehaald als: Besluit Tica inzake betaling, terugvordering en tenuitvoerlegging van boeten en
      onverschuldigd betaalde uitkering.
    url: https://wetten.overheid.nl/BWBR0008082/2002-01-01#Artikel17
