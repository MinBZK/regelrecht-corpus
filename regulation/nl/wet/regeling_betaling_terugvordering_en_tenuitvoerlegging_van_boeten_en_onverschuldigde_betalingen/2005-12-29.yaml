  - number: 1.r
    text: 'aflossingstermijn: termijn waarbinnen de vordering wordt verrekend of betaald.'
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel1
  - number: '2'
    text: |-
      Het UWV stelt de termijnen waarbinnen de vordering wordt verrekend of betaald vast met inachtneming van deze
      regeling.
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel2
  - number: '3'
    text: |-
      Als de schuldenaar recht heeft op een nabetaling van het UWV, de Sociale Verzekeringsbank of een gemeente dient de
      vordering terstond te worden voldaan door verrekening met de nabetaling. Vervolgens wordt de vordering voor zover
      mogelijk voldaan door verrekening met een lopende uitkering. Als dit niet mogelijk is vindt aflossing plaats door
      betaling in termijnen door de schuldenaar.
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel3
  - number: '4.1'
    text: |-
      Indien de vordering tot en met € 45 bedraagt, stelt het UWV de wijze waarop en de termijnen waarbinnen deze
      vordering moet worden voldaan vast, zonder de schuldenaar in de gelegenheid te stellen een voorstel te doen inzake
      de voldoening van de vordering.
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel4
  - number: '4.2'
    text: |-
      Het UWV kan de termijnen van betaling of verrekening vaststellen conform een met redenen omkleed voorstel van de
      schuldenaar, mits volgens dit voorstel de gehele vordering binnen 12 maanden wordt voldaan en de schuldenaar dit
      voorstel heeft gedaan binnen 6 weken nadat hem daartoe de gelegenheid is geboden door het UWV.
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel4
  - number: '5.1'
    text: |-
      Onverminderd [artikel 4][ref1] stelt het UWV de aflossingstermijnen vast na overleg met de schuldenaar en met
      inachtneming van dit artikel, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0008082#Artikel4
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008082
        artikel: '4'
        paragraaf: II
  - number: 5.1.a
    text: |-
      het UWV de aflossingstermijnen heeft vastgesteld op voorstel van de schuldenaar, bedoeld in [artikel 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008082#Artikel4
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008082
        artikel: '4'
        paragraaf: II
  - number: 5.1.b
    text: de vordering een boete betreft;
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel5
  - number: 5.1.c
    text: de onverschuldigde betaling het gevolg is van een gedraging waarvoor aan de schuldenaar een boete is opgelegd; of
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel5
  - number: 5.1.d
    text: |-
      de onverschuldigde betaling het gevolg is van een gedraging waarvan het UWV aangifte heeft gedaan of waarvan
      proces-verbaal is opgemaakt en ingezonden.
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel5
  - number: '5.2'
    text: |-
      Onverminderd het bepaalde in [artikel 7][ref1] wordt de vordering geheel voldaan door middel van periodieke
      betalingen of verrekeningen gedurende 36 maanden te rekenen vanaf de dag waarop het UWV aan de schuldenaar
      kennis heeft gegeven van de vaststelling van de termijnen. De aflossingstermijn is ter hoogte van de volledige
      aflossingscapaciteit hetgeen een betaling gedurende minder dan 36 maanden met zich mee kan brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0008082#Artikel7
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008082
        artikel: '7'
        paragraaf: II
  - number: '5.3'
    text: |-
      In afwijking van het tweede lid, tweede zin, wordt op verzoek van de schuldenaar ten minste de
      halve aflossingscapaciteit toegepast onder de voorwaarde dat de vordering geheel wordt voldaan
      gedurende 36 maanden te rekenen vanaf de dag dat het UWV aan de schuldenaar kennis heeft
      gegeven van de termijnen. De schuldenaar wordt erop gewezen dat ambtshalve kwijtschelding als
      bedoeld in de [artikelen 36, derde lid, van de WW][ref1], [33, derde lid, van de ZW][ref2],
      [57, derde lid, van de WAO][ref3], [63, derde lid, van de WAZ][ref4],[ 55, derde lid, van de Wajong][ref5],
      [20, derde lid, van de TW][ref6],[ 77, derde lid, van de Wet WIA][ref7], of [artikel 3:16][ref8],
      [artikel 3:27 WAZO][ref9], niet mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel57
      [ref4]: https://wetten.overheid.nl/BWBR0008656#Artikel63
      [ref5]: https://wetten.overheid.nl/BWBR0008657#Artikel55
      [ref6]: https://wetten.overheid.nl/BWBR0004043#Artikel20
      [ref7]: https://wetten.overheid.nl/BWBR0019057#Artikel77
      [ref8]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref9]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '36'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '33'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '57'
      - id: ref4
        bwb_id: BWBR0008656
        artikel: '63'
      - id: ref5
        bwb_id: BWBR0008657
        artikel: '55'
      - id: ref6
        bwb_id: BWBR0004043
        artikel: '20'
      - id: ref7
        bwb_id: BWBR0019057
        artikel: '77'
      - id: ref8
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref9
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '5.4'
    text: |-
      Indien de schuldenaar voorstelt om hogere periodieke betalingen te doen dan het bedrag, bedoeld in het tweede lid,
      stelt het UWV de termijnen conform dit voorstel vast.
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel5
  - number: '5.5'
    text: |-
      Indien de schuldenaar, bij aanwending van zijn volledige aflossingscapaciteit, de vordering niet binnen 36 maanden
      volledig zal kunnen voldoen, wendt hij zijn vermogen aan zodat een zodanig gedeelte van de vordering binnen 6
      weken, nadat het UWV aan de schuldenaar kennis heeft gegeven van de vaststelling van de termijnen, wordt voldaan,
      dat hij de resterende vordering binnen 36 maanden kan voldoen. Indien echter de schuldenaar ten genoegen van
      het UWV zekerheid stelt voor aflossing van de gehele vordering binnen 36 maanden, nadat de vaststelling van de
      termijnen hem bekend is gemaakt, behoeft de schuldenaar zijn vermogen niet aan te wenden.
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel5
  - number: '5.6'
    text: |-
      De periodieke betaling of verrekening wordt gesteld op de volledige aflossingscapaciteit verminderd met 5 % van de
      bijstandsnorm indien
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel5
  - number: 5.6.a
    text: |-
      de schuldenaar met aanwending van zijn volledige aflossingscapaciteit en vermogen niet in staat is de vordering
      binnen 36 maanden te voldoen en
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel5
  - number: 5.6.b
    text: |-
      periodieke betaling of verrekening gedurende 60 maanden van het aldus verkregen bedrag leidt tot een grotere
      aflossing dan betaling of verrekening gedurende 36 maanden van het op grond van het tweede en derde lid verkregen
      bedrag.
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel5
  - number: '6.1'
    text: Dit artikel is van toepassing indien de vordering
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel6
  - number: 6.1.a
    text: een boete betreft;
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel6
  - number: 6.1.b
    text: |-
      het gevolg is van het niet nakomen van de inlichtingenverplichting dan wel van een gedraging waarvan het UWV
      aangifte heeft gedaan of waarvan proces-verbaal is opgemaakt en ingezonden.
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel6
  - number: '6.2'
    text: |-
      Het UWV stelt de aflossingstermijnen zodanig vast dat gebruik wordt gemaakt van de volledige aflossingscapaciteit
      van de schuldenaar, onverminderd het bepaalde in [artikel 7][ref1], tenzij het UWV de termijnen heeft vastgesteld
      conform het bepaalde in [artikel 4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008082#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008082#Artikel4
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008082
        artikel: '7'
        paragraaf: II
      - id: ref2
        bwb_id: BWBR0008082
        artikel: '4'
        paragraaf: II
  - number: '6.3'
    text: |-
      Indien de schuldenaar voorstelt om hogere betalingen te doen dan het bedrag ingevolge het tweede lid, stelt het UWV
      de termijnen conform dit voorstel vast.
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel6
  - number: '6.4'
    text: |-
      Indien de schuldenaar de vordering niet binnen 12 maanden volledig zal kunnen voldoen, wendt hij zijn vermogen aan
      zodat een zodanig gedeelte van de vordering binnen 6 weken, nadat het UWV aan de schuldenaar kennis heeft gegeven
      van de vaststelling van de termijnen, wordt voldaan, dat hij de resterende vordering binnen 12 maanden kan voldoen.
      Indien echter de schuldenaar ten genoegen van het UWV zekerheid stelt voor aflossing van de gehele vordering binnen
      12 maanden, nadat de vaststelling van de termijnen hem bekend is gemaakt, behoeft de schuldenaar zijn vermogen niet
      aan te wenden.
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel6
  - number: '6.5'
    text: |-
      Onverminderd het bepaalde in [artikel 8][ref1] stelt het UWV de termijnen waarbinnen wordt verrekend of moet worden
      betaald vast over een periode van meer dan 12 maanden indien de schuldenaar, ook na aanwending van zijn vermogen,
      niet in staat is om de vordering binnen 12 maanden te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0008082#Artikel8
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008082
        artikel: '8'
        paragraaf: II
  - number: '7.1'
    text: |-
      Indien de schuldenaar een betalingsregeling heeft getroffen met één of meer derden die beschikken over een
      executoriale titel, kan het UWV rekening houden met deze betalingsregelingen bij de vaststelling van de termijn
      of termijnen waarbinnen wordt verrekend of betaald. Het bedrag van de verrekening of betaling wordt in elk geval
      niet gesteld op een lager bedrag dan het aandeel waarop het UWV aanspraak zou kunnen maken bij verrekening met
      een lopende uitkering respectievelijk executoriaal beslag door het UWV op loon, sociale uitkeringen of andere
      periodieke betalingen, indien door deze derden beslag zou zijn gelegd. Het UWV is bevoegd om een schuldeiser, met
      wie de schuldenaar, tenminste één jaar voor de beslissing tot terugvordering is afgegeven, een betalingsregeling is
      overeengekomen, gelijk te stellen met een schuldeiser die in het bezit is van een executoriale titel.
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel7
  - number: '7.2'
    text: |-
      In afwijking van het eerste lid wordt op de aflossingscapaciteit in mindering gebracht de betaalde bijdrage tot €
      113 per persoon in
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel7
  - number: 7.2.a
    text: levensonderhoud van de ex-echtgenoot;
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel7
  - number: 7.2.b
    text: de kosten van verzorging en opvoeding van minderjarige kinderen die niet tot het huishouden behoren;
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel7
  - number: 7.2.c
    text: levensonderhoud en studie van meerderjarige kinderen tot 27 jaar.
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel7
  - number: '7.3'
    text: |-
      Indien het UWV zijn medewerking verleent aan een gerechtelijk of buitengerechtelijk akkoord ter sanering van de
      schulden van de schuldenaar kan, in afwijking van het eerste en tweede lid, worden ingestemd met een ander aandeel
      in de aflossingscapaciteit en het betrekken van vorderingen van andere schuldeisers in de vaststelling van dit
      aandeel, indien
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel7
  - number: 7.3.a
    text: |-
      de vordering van het UWV tenminste zal worden voldaan naar evenredigheid met vorderingen van schuldeisers met
      gelijke rang en het te ontvangen deel van de vordering van het UWV van tenminste dezelfde omvang is als kan worden
      verkregen indien een saneringsplan als bedoeld in [artikel 343 van de Faillissementswet][ref1] wordt vastgesteld en


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel343
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '343'
  - number: 7.3.b
    text: |-
      het UWV noch in uitkeringspercentage noch in tempo van betaling wordt achtergesteld bij gelijkbevoorrechte
      schuldeisers en
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel7
  - number: 7.3.c
    text: |-
      redelijkerwijs mag worden aangenomen dat de schuldenaar, afgezien van de daarvoor te vervullen formaliteiten, in
      aanmerking zou komen voor de toepassing van de schuldsaneringsregeling natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel7
  - number: '8'
    text: |-
      Onverminderd het bepaalde in de [artikelen 5][ref1] en [7][ref2], wordt de periodieke betaling of verrekening
      gesteld op de volledige aflossingscapaciteit verminderd met 5 % van de bijstandsnorm, indien de schuldenaar de
      vordering na vijf jaar niet volledig heeft voldaan met inachtneming van de conform de vorige artikelen vastgestelde
      termijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0008082#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008082#Artikel7
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008082
        artikel: '5'
        paragraaf: II
      - id: ref2
        bwb_id: BWBR0008082
        artikel: '7'
        paragraaf: II
  - number: '9'
    text: |-
      Indien de schuldenaar op enig tijdstip niet volgens de vastgestelde termijnen betaalt, wordt de vordering
      opeisbaar.
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel9
  - number: '10'
    text: |-
      Indien de schuldenaar de verplichting, bedoeld in de [artikelen 27a, vijfde lid][ref1], of
      [36, zesde lid, van de WW][ref2], [33, zesde lid][ref3], of [45a, vijfde lid, van de ZW][ref4],
      [29a, vijfde lid][ref5], of [57, zesde lid, van de WAO][ref6], [77 , zesde lid][ref7], of
      [91, vijfde lid, van de Wet WIA][ref8],[ 48, vijfde lid][ref9], of [63, zesde lid, van de WAZ][ref10],
      [3:16][ref11] en [3:27 van de WAZO][ref12], [40, vijfde lid][ref13], of [55, zesde lid, van de Wajong][ref14] of
      [14a, vijfde lid][ref15], of [20, zesde lid, van de TW][ref16], niet nakomt, wordt de vordering opeisbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel27a
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel33
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel45a
      [ref5]: https://wetten.overheid.nl/BWBR0002524#Artikel29a
