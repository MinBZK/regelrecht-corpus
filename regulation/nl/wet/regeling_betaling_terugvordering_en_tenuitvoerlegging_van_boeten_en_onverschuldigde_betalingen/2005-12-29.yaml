      [ref10]: https://wetten.overheid.nl/BWBR0008656#Artikel63
      [ref11]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref12]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref13]: https://wetten.overheid.nl/BWBR0008657#Artikel40
      [ref14]: https://wetten.overheid.nl/BWBR0008657#Artikel55
      [ref15]: https://wetten.overheid.nl/BWBR0004043#Artikel14a
      [ref16]: https://wetten.overheid.nl/BWBR0004043#Artikel20
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel10
