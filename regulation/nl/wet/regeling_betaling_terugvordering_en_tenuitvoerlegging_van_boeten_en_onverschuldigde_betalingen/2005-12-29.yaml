  - number: '11'
    text: |-
      Het UWV kan de vastgestelde aflossingstermijnen herzien wegens gewijzigde omstandigheden met inachtneming van deze
      regeling.
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel11
  - number: '12.1'
    text: |-
      De wettelijke rente en de kosten van invordering zijn verschuldigd vanaf het tijdstip dat de termijn is verstreken
      waarbinnen volgens het besluit van het UWV moest worden betaald.
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel12
  - number: '12.2'
    text: 'De op de invordering betrekking hebbende kosten bedragen:'
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel12
  - number: 12.2.a
    text: 15 % van de resterende vordering, doch ten minste € 45 en ten hoogste € 681 alsmede
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel12
  - number: 12.2.b
    text: |-
      de kosten van betekening en gerechtelijke tenuitvoerlegging, zoals vastgesteld bij of krachtens de
      [Wet tarieven in burgerlijke zaken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001852
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001852
  - number: '13.1'
    text: |-
      Tenzij de schuldenaar een andere vordering aanwijst wordt een betaling die zou kunnen worden toegerekend aan twee
      of meerdere vorderingen, op de eerste plaats toegerekend aan een verschuldigde boete.
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel13
  - number: '13.2'
    text: |-
      Zijn er vervolgens nog meerdere vorderingen waarop de toerekening zou kunnen plaatsvinden, dan wordt deze op
      de eerste plaats toegerekend aan de oudste. Zijn de vorderingen even oud, dan geschiedt de toerekening naar
      evenredigheid.
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel13
  - number: '13.3'
    text: |-
      Betaling op een bepaalde vordering strekt eerst in mindering van de kosten, vervolgens de verschenen rente en
      tenslotte de hoofdsom en de lopende rente.
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel13
  - number: '14'
    text: |-
      In geval de toepassing van deze regeling leidt tot een kennelijke hardheid is het UWV bevoegd van het gestelde in
      deze regeling af te wijken.
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel14
  - number: '15'
    text: |-
      Indien het bij koninklijke boodschap van 21 september 1994 ingediende voorstel van wet houdende wijziging van
      de sociale zekerheidswetten in verband met de nadere vaststelling van een stelsel van administratieve sancties,
      alsook tot wijziging van de daarin vervatte regels tot terugvordering van ten onrechte betaalde uitkering en de
      invordering daarvan ([Wet boeten, maatregelen en terug- en invordering sociale zekerheid][ref1]; Kamerstukken II,
      1994/1995, nr. 23 909) tot wet wordt verheven en in werking treedt, treedt deze regeling op hetzelfde tijdstip
      in werking. Indien deze regeling na inwerkingtreding van genoemde wet wordt bekend gemaakt in de Staatscourant,
      treedt deze regeling in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin het wordt
      geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0008015
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008015
  - number: '16'
    text: |-
      Deze regeling wordt aangehaald als: Regeling betaling, terugvordering en tenuitvoerlegging van boeten en
      onverschuldigde betalingen.
    url: https://wetten.overheid.nl/BWBR0008082/2005-12-29#Artikel16
