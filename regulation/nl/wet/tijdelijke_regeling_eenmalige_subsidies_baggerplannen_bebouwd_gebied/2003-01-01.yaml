$id: tijdelijke_regeling_eenmalige_subsidies_baggerplannen_bebouwd_gebied
regulatory_layer: WET
publication_date: '2003-12-11'
valid_from: '2003-01-01'
valid_to: '2004-12-31'
bwb_id: BWBR0011515
url: https://wetten.overheid.nl/BWBR0011515/2003-01-01
preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Gelet op artikel 17, vijfde lid, van de Financiële-verhoudingswet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0011515/2003-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *de Minister:* de Minister van Verkeer en Waterstaat;

      b. *de gemeente:* de gemeente binnen wiens grondgebied het plangebied is gelegen;

      c. *het waterschap:* het waterschap dat voor het boven het plangebied dan wel boven een gedeelte daarvan gelegen
      oppervlaktewater belast is met het waterkwaliteitsbeheer, waterkwantiteitsbeheer of het vaarwegbeheer;

      d. *het plangebied:* de bodems, binnen het grondgebied van de gemeente, van de binnen de bebouwde kom gelegen
      oppervlaktewateren of van oppervlaktewateren waarvoor de gemeente belast is met het vaarwegbeheer;

      e. *baggerplan:*een na 1 januari 2000 gereedgekomen plan voor het gehele plangebied dan wel voor het gedeelte
      daarvan dat binnen het gebied van het waterschap is gelegen, dat ziet op het uitbaggeren van tot het plangebied
      behorende bodems voor het onderhoud van de waterhuishoudings- en vaarwegfunctie en dat is opgesteld in
      overeenstemming met de bij deze regeling behorende bijlage I.
    url: https://wetten.overheid.nl/BWBR0011515/2003-01-01#Artikel1
  - number: '2'
    text: |-
      De Minister kan ter stimulering van de totstandkoming van een baggerplan aan de gemeente of het waterschap een
      eenmalige subsidie verlenen als tegemoetkoming in de kosten van totstandkoming daarvan.
    url: https://wetten.overheid.nl/BWBR0011515/2003-01-01#Artikel2
  - number: '3'
    text: |-
      1 Het subsidieplafond voor het op grond van deze regeling verstrekken van subsidies bedraagt € 6.715.947,00.

      2 De Minister verdeelt het op basis van het eerste lid beschikbare bedrag in de volgorde van ontvangst van
      de aanvragen, met dien verstande dat indien een aanvrager niet heeft voldaan aan de in artikel 5 opgenomen
      voorschriften voor het in behandeling nemen van de aanvraag en met toepassing van artikel 4:5 van de Algemene
      wet bestuursrecht de gelegenheid heeft gehad de aanvraag aan te vullen, de dag waarop de aanvraag voldoet aan de
      wettelijke voorschriften met betrekking tot die verdeling als datum van ontvangst geldt.
    url: https://wetten.overheid.nl/BWBR0011515/2003-01-01#Artikel3
  - number: '4'
    text: |-
      1 De subsidie bedraagt 50 procent van de kosten die rechtstreeks aan de totstandkoming van het baggerplan zijn toe
      te rekenen.

      2 In afwijking van het eerste lid bedraagt de subsidie:

      a. ter zake van het baggerplan voor het gehele plangebied ten hoogste het bedrag dat in deel A, van de bij deze
      regeling behorende bijlage II bij de gemeente is vermeld;

      b. ter zake van het baggerplan voor het gedeelte van het plangebied, dat binnen het gebied van het waterschap is
      gelegen, ten hoogste het door de gemeente in overeenstemming met de betrokken waterschappen aan het waterschap
      toegerekende gedeelte van het bedrag dat in deel A, van de bij deze regeling behorende bijlage II bij de gemeente
      is vermeld.
    url: https://wetten.overheid.nl/BWBR0011515/2003-01-01#Artikel4
  - number: '5'
    text: |-
      1 De aanvraag wordt ingediend door de gemeente dan wel het waterschap die onderscheidenlijk dat het baggerplan
      heeft vastgesteld.

      2 De aanvraag door een gemeente heeft betrekking op een baggerplan voor het gehele plangebied. De aanvraag door het
      waterschap heeft betrekking op een baggerplan op het plangebied voorzover dat binnen het gebied van het waterschap
      is gelegen.

      3 3. De aanvraag, gericht aan de Minister, wordt in het jaar 2000 uiterlijk op 1 oktober van dat jaar en in de
      jaren 2001, 2002, 2003 en 2004 uiterlijk op 1 september van die jaren ingediend bij de Hoofdingenieur- Directeur
      van het Rijksinstituut voor Integraal Zoetwaterbeheer en Afvalwaterbehandeling.

      4 De aanvraag bevat, onder bijvoeging van het baggerplan:

      a. een specificatie van de kosten van de totstandkoming van het baggerplan;

      b. het bedrag van de subsidie die wordt aangevraagd;

      c. de verklaring van de aanvrager dat het baggerplan in overleg met de betrokken gemeente en met het betrokken
      waterschap dan wel met de betrokken waterschappen is opgesteld;

      d. indien het baggerplan betrekking heeft op het gedeelte van het plangebied dat in het gebied van het waterschap
      is gelegen, het door de gemeente in overeenstemming met de waterschappen in het plangebied vastgestelde verdeling
      van het in onderdeel A van de bij deze regeling behorende bijlage II bij de gemeente vermelde bedrag, over de
      waterschappen.
    url: https://wetten.overheid.nl/BWBR0011515/2003-01-01#Artikel5
  - number: '6'
    text: |-
      1 De subsidie wordt in ieder geval geweigerd: a. indien de aanvraag niet voldoet aan het in artikel 5 bepaalde; b.
      voorzover het subsidieplafond, bedoeld in artikel 3, eerste lid, wordt overschreden; c. voorzover voor het gehele
      plangebied dan wel voor het binnen het gebied van het waterschap gelegen gedeelte van het plangebied een eerder
      gereed gekomen baggerplan is opgesteld ter zake waarvan voor het tijdstip van de bekendmaking van de beschikking
      tot subsidievaststelling reeds een subsidie op grond van deze regeling is verstrekt.

      2 De beschikking tot subsidievaststelling vermeldt het bedrag van de subsidie en het baggerplan waarvoor de
      subsidie wordt vastgesteld.

      3 De Minister beslist binnen acht weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0011515/2003-01-01#Artikel6
  - number: '7'
    text: |-
      1 Betaling van het bedrag van de vastgestelde subsidie geschiedt uiterlijk vier weken na de bekendmaking van de
      beschikking tot subsidievaststelling.

      2 In afwijking van het eerste lid geschiedt de betaling van het totale bedrag aan in het jaar 2000 vastgestelde
      subsidies voorzover dat ƒ 2.940.000 te boven gaat, uiterlijk op 1 februari 2001.

      3 In afwijking van het eerste en tweede lid geschiedt de betaling van het totale bedrag aan in het jaar 2000
      vastgestelde doch niet in dat jaar betaalde subsidies en aan in het jaar 2001 vastgestelde subsidies, voorzover dat
      € 2.237.136,00 te boven gaat, uiterlijk op 1 februari 2002.

      4 De betaling van de vastgestelde subsidies geschiedt in de volgorde van data van de bekendmaking van de
      beschikkingen tot subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0011515/2003-01-01#Artikel7
  - number: '8'
    text: |-
      De subsidieontvanger verleent medewerking aan onderzoek naar de werking van deze regeling, verricht door de
      Minister of door de Algemene Rekenkamer. De subsidieontvanger verstrekt voor het alle voor het onderzoek gevraagde
      gegevens en inlichtingen, overlegt de voor het onderzoek gevraagde boeken en bescheiden en andere gegevensdragers
      en verleent de voor het onderzoek gevorderde inzage in boeken, bescheiden en andere gegevensdragers.
    url: https://wetten.overheid.nl/BWBR0011515/2003-01-01#Artikel8
  - number: '9'
    text: |-
      De bij deze regeling behorende bijlagen I en II liggen ter inzage bij het Directoraat-Generaal Water van het
      Ministerie van Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0011515/2003-01-01#Artikel9
  - number: '10'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin zij wordt
      geplaatst en vervalt met ingang van 1 januari 2003.
    url: https://wetten.overheid.nl/BWBR0011515/2003-01-01#Artikel10
  - number: '11'
    text: 'Deze regeling wordt aangehaald als: Tijdelijke regeling eenmalige subsidies baggerplannen bebouwd gebied.'
    url: https://wetten.overheid.nl/BWBR0011515/2003-01-01#Artikel11
