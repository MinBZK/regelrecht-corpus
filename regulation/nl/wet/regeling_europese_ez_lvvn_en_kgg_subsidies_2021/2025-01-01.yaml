  - number: 5.5.3
    text: |-
      1 Onverminderd [artikel 1.2.][ref1], wordt geen subsidie verstrekt voor zover de landbouwer van overheidswege een
      andere bijdrage ontvangt voor de premie, bedoeld in [artikel 5.5.2., eerste lid][ref2].

      2 Geen subsidie wordt verstrekt indien de landbouwer zijn open teelt niet tegen alle ongunstige
      weersomstandigheden, bedoeld in [artikel 5.5.12.][ref3], heeft verzekerd.

      3 Geen subsidie wordt verstrekt ten behoeve van de premie die wordt betaald voor een brede weersverzekering van de
      open teelt op landbouwareaal dat is gelegen buiten Nederland.

      4 De minister beslist afwijzend op een aanvraag om subsidie, indien:

      a. de landbouwer niet voldoet aan [artikel 5.5.2., derde lid][ref4];

      b. de landbouwer niet voldoet aan de eisen die gelden voor een actieve landbouwer als bedoeld in
      [artikel 5 van de Uitvoeringsregeling GLB 2023][ref5];

      c. de landbouwer ofwel in het geval hij een volmacht heeft verleend als bedoeld in [artikel 5.5.8.][ref6], het
      deel van de premie dat overeenkomt met de gehele premie verminderd met de aangevraagde subsidie op grond van
      deze regeling, ofwel indien de landbouwer geen volmacht heeft verleend als bedoeld in [artikel 5.5.8.][ref7], de
      volledige premie, niet vóór 1 november van het jaar van de aanvraag heeft betaald, of,

      d. geen toestemming als bedoeld in [artikel 5.5.7., onderdelen d en e][ref8], is gegeven.


