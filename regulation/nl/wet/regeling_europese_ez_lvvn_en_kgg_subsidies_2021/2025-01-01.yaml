  - number: 5.7.34
    text: |-
      1 De minister beslist afwijzend op een aanvraag indien:

      a. de aanvrager niet beschikt over voor het demonstratieproject gekwalificeerde en geregeld opgeleide personen;

      b. na toepassing van [artikel 5.7.35][ref1] op één van de onderdelen a tot en met e van het eerste lid van dat
      artikel minder dan drie punten zijn toegekend;

      c. de aanvrager een producentengroepering of -organisatie is die een landbouwer verplicht lid te zijn van de
      groepering of organisatie om deel te kunnen nemen aan het project;

      d. het project niet past binnen de onderwerpen van [artikel 5.7.28, tweede lid][ref2];

      e. aan de aanvrager, bedoeld in [artikel 5.7.28, eerste lid, onderdeel a of b][ref3], al eerder subsidie is
      verstrekt voor een demonstratieproject op grond van deze titel of voor kennisoverdracht door demonstratiebedrijven
      op basis van [titel 2.4 van de Regeling nationale EZK- en LNV-subsidies][ref4] en van de desbetreffende
      demonstratieprojecten of activiteiten de realisatietermijn nog niet is verstreken.

      2 De aanvrager, bedoeld in [artikel 5.7.28, eerste lid, onderdeel a of b][ref5], kan voor maximaal een aanvraag
      subsidie toegewezen krijgen en de aanvrager, bedoeld in [artikel 5.7.28, eerste lid, onderdeel c][ref6], kan voor
      maximaal twee aanvragen subsidie toegewezen krijgen.


