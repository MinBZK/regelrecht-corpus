  - number: 5.5.2
    text: |-
      1 Een landbouwer kan subsidie aanvragen in de vorm van een financiële bijdrage voor de premie ten behoeve van de
      brede weersverzekering.

      2 De landbouwer die in aanmerking wil komen voor de subsidie, bedoeld in het eerste lid, maakt voor de aanvraag
      gebruik van het beschrijvingsbiljet, bedoeld in [artikel 24, eerste lid, van de Landbouwwet][ref1] en de daarop
      gebaseerde door de minister vastgestelde regeling.

      3 De landbouwer legt vóór 1 november van het jaar waarin hij de aanvraag, bedoeld in het tweede lid, indient, de in
      [artikel 5.5.7][ref2]. genoemde gegevens over.

      4 De landbouwer is van de verplichting, bedoeld in het vierde lid, vrijgesteld voor zover de bewijsstukken vóór het
      verstrijken van de in dat lid genoemde termijn door de verzekeraar worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0045685#Artikel5.5.7
