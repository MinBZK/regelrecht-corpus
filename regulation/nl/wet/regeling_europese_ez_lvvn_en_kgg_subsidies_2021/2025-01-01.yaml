    text: |-
      De Minister beslist afwijzend op een aanvraag tot subsidieverlening indien het project onvoldoende bijdraagt aan
      de realisatie van het in [artikel 4.3.1][ref1] bedoelde Rijksbeleid of de subsidieaanvrager niet in aanmerking komt
      voor subsidie op grond van [paragraaf 4.2][ref2].


