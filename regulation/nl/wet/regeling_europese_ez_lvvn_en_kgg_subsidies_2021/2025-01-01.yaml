  - number: '1.2'
    text: |-
      Onverminderd artikel 63, negende lid, van [verordening 2021/1060](32960R2021) en artikel 36 van [verordening
      2021/2116](32116R2021), wordt, indien reeds door een bestuursorgaan of de Europese Commissie subsidie is verstrekt
      voor de subsidiabele kosten of een deel daarvan, slechts een zodanig bedrag aan subsidie verstrekt dat het totale
      bedrag aan subsidies niet meer bedraagt dan het bedrag dat volgens de toepasselijke Europese verordeningen is
      toegestaan.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel1.2
  - number: '1.3'
    text: |-
      1 Voor zover zij direct verbonden zijn met de uitvoering van de desbetreffende subsidiabele activiteit, komen als
      subsidiabele kosten in aanmerking:

      a. loonkosten inclusief overheadkosten;

      b. de kosten van door een subsidieontvanger verrichte eigen arbeid;

      c. bijdragen in natura als bedoeld in artikel 67, eerste lid, van [verordening 2021/1060](32960R2021);

      d. afschrijvingskosten als bedoeld in artikel 67, tweede lid, van [verordening 2021/1060](32960R2021); en

      e. andere kosten waarvoor een factuur of document met gelijkwaardige bewijskracht kan worden overlegd.

      2 Vóór indiening van de aanvraag door de subsidieontvanger gemaakte kosten komen niet voor subsidie in aanmerking.

      3 De subsidiabele kosten, bedoeld in het eerste lid, worden in aanmerking genomen met inbegrip van de BTW, indien
      de subsidieontvanger die de kosten heeft gemaakt, de BTW niet in aftrek kan brengen.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel1.3
  - number: 1.3a
    text: |-
      1 De loonkosten worden berekend:

      a. door het aantal aan het project bestede uren te vermenigvuldigen met een vast uurtarief van € 55;

      b. als een vast percentage van een maandtarief van € 7.800 per werknemer bij een voltijd dienstverband van 1.720
      uur per jaar, of een evenredig deel daarvan bij een deeltijd dienstverband, overeenkomstig het vooraf vastgestelde
      vaste percentage van de tijd dat de werknemer per maand aan het project heeft gewerkt, zonder de verplichting om
      een afzonderlijk arbeidstijdregistratiesysteem op te zetten;

      c. door de kosten, bedoeld in [artikel 1.3, eerste lid, aanhef en onderdelen c, d en e][ref1], te vermenigvuldigen
      met 0,23, onder de voorwaarden, genoemd in artikel 55, eerste lid, van [verordening 2021/1060](32960R2021).

      2 De kosten van de door een subsidieontvanger verrichte eigen arbeid ten behoeve van het project worden berekend
      door het aantal uren dat de betrokken persoon ten behoeve van het project heeft gemaakt te vermenigvuldigen met een
      vast uurtarief van € 55.

      3 Binnen een project wordt de berekeningsmethode, bedoeld in het eerste lid, onderdeel c, niet gecombineerd met de
      berekeningsmethode, bedoeld in het tweede lid.

      4 De subsidieontvanger stelt een document op met vermelding van de namen van de werknemers en de vaste percentages,
      bedoeld in het eerste lid, aanhef en onderdeel b.

      5 Indien een vast uurtarief wordt gehanteerd, kan het totale aantal voor een bepaald jaar te subsidiëren uren:

      a. indien gebruik wordt gemaakt een vast uurtarief als bedoeld in het eerste lid, onderdeel a, per werknemer
      niet meer bedragen dan 1.720 uren bij een voltijd dienstverband of een evenredig deel daarvan bij een deeltijd
      dienstverband;

      b. indien gebruik wordt gemaakt van een vast uurtarief als bedoeld in het tweede lid voor eigen arbeid, niet meer
      bedragen dan 1.720 uren.


