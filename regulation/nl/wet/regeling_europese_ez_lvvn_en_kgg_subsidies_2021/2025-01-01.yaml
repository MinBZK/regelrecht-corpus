      1 Subsidiabel zijn uitgaven voor organische onkruidwerende materialen ten behoeve van gewasbescherming door het
      bevorderen van weerbare teelt en verminderde afhankelijkheid van middelen.

      2 In het geval van biologisch afbreekbare folie bestemd voor onkruidbestrijding komen alleen de specifieke
      kosten voor biologisch afbreekbare folie in vergelijking met conventionele kunststoffolie in aanmerking voor
      ondersteuning.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.102
  - number: 5.3.103
    text: |-
      1 Uitgaven voor de bestrijding van ziekten en plagen zijn subsidiabel. In het geval van middelen voor biologische
      of geïntegreerde gewasbescherming zijn de volgende kosten subsidiabel:

      a. macrobiologische bestrijders en nematoden, die zijn toegelaten op grond van de
      [Regeling natuurbescherming][ref1];

      b. microbiologische bestrijders die zijn toegelaten op grond van de
      [Wet gewasbeschermingsmiddelen en biociden][ref2];

      c. overige gewasbeschermingsmiddelen van natuurlijke oorsprong die zijn toegelaten op grond van de
      [Wet gewasbeschermingsmiddelen en biociden][ref3];

      d. middelen voor feromoonverwarring die zijn toegelaten op grond van de
      [Wet gewasbeschermingsmiddelen en biociden][ref4];

      e. feromonen als lokstof;

      f. kalkmelk voor de fruitteelt;

      g. organismen, voeding en middelen voor dosering ter ondersteuning van biologische gewasbescherming;

      h. natuurlijke vijanden waarvoor een ontheffing van de minister geldt;

      i. natuurlijke vijanden waarvoor het College voor de toelating van gewasbeschermingsmiddelen en biociden een
      ‘dringend vereiste’ vergunning heeft afgegeven; en

      j. gewasbeschermingsmiddelen met laagrisico stoffen of basisstoffen die zijn toegelaten door het College Toelating
      Gewasbeschermingsmiddelen en voorzien zijn van N-nummer;

      2 In het geval van biologische gewasbeschermingsmiddelen zijn de volgende kosten subsidiabel:

      a. een scoutbox voor automatische detectie en diagnose van plagen;

      b. de kosten voor de scoutbox-softwarelicentie;

      c. sporenfilters voor de champignonteelt;

      d. vangplaten en rollertraps; en

      e. zaaizaad Tagetes als aaltjesbestrijders.

      3 Niet subsidiabel zijn:

      a. gewasbescherming van conventionele, niet natuurlijke oorsprong;

      b. toeslag voor behandelingskosten doorbelast door leveranciers of plantenkwekers; en

      c. ondersteunende materialen zoals afdichtingsmateriaal ten behoeve van het afdichten van champignoncellen.


      [ref1]: https://wetten.overheid.nl/BWBR0038668
      [ref2]: https://wetten.overheid.nl/BWBR0021670
