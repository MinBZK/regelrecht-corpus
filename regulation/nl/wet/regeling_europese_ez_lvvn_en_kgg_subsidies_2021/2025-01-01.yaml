  - number: 5.1.2
    text: |-
      1 In afwijking van de [artikelen 1.3a][ref1] en [1.3c][ref2], kiest de aanvrager voor de berekening van de
      subsidiabele kosten uit één van de volgende drie berekeningswijzen:

      a. berekening subsidiabele kosten zonder forfait, opgenomen in [artikel 5.1.3][ref3];

      b. berekening subsidiabele kosten met forfait voor arbeidskosten, opgenomen in [artikel 5.1.3a][ref4]; dan wel

      c. berekening subsidiabele kosten met forfait voor overige kosten, opgenomen in [artikel 5.1.3b][ref5].

      2 Het aantal uren gebruikt in de berekening, bedoeld in [artikel 5.1.3, eerste en tweede lid][ref6] en
      [artikel 5.1.3b, tweede en derde lid][ref7], wordt aan de hand van schriftelijke bewijsstukken verantwoord.

      3 Indien een uurtarief wordt gehanteerd, als bedoeld in
      [artikel 5.1.3, eerste lid, onderdeel a, subonderdeel 1° en onderdeel b][ref8] en
      [artikel 5.1.3b, derde lid][ref9], kan het totale aantal voor een bepaald jaar te subsidiëren uren in het geval
      van arbeidskosten per werknemer niet meer bedragen dan 1.372 uren bij een voltijd dienstverband of een evenredig
      deel daarvan bij een deeltijd dienstverband en in het geval van eigen arbeid per werknemer niet meer bedragen dan
      1.720 uren.

      4 De [artikelen 5.1.3 tot en met 5.1.3b][ref10] zijn niet van toepassing op [paragraaf 3 van titel 5.2][ref11],
      de [titels 5.3][ref12] en [5.5][ref13], de [paragrafen 5.7.3 tot en met 5.7.6][ref14], [5.7.8][ref15] en
      [5.7.9][ref16] van [titel 5.7][ref17], [paragraaf 5.8.2][ref18] van [titel 5.8][ref19] en [titel 5.9][ref20].


