        artikel: '2.9'
        hoofdstuk: '2'
  - number: 5.2.46
    text: |-
      1 De uitgavenposten, bedoeld in [artikel 5.2.45, derde lid][ref1], die in het operationeel programma zijn opgenomen
      voor de jaren na het eerste jaar van het operationeel programma worden voor de desbetreffende jaren jaarlijks,
      bij de aanvraag tot subsidieverlening voor het volgende jaar, onderbouwd door middel van minimaal drie onderling
      vergelijkbare kostenbegrotingen per uitgavenpost.

      2 In afwijking van [artikel 5.2.45, derde lid][ref2], en het eerste lid, kan een begroting voor een uitgavenpost
      voor een activiteit waarvan de uitgaven in een uitvoeringsjaar worden geraamd op minder dan € 25.000 worden
      onderbouwd aan de hand van een enkele kostenbegroting.

      3 Indien een uitgavenpost voor een activiteit aantoonbaar door slechts een enkele of ten hoogste twee
      partijen kan worden uitgevoerd of begroot, wordt een begroting, in afwijking van het eerste lid en
      [artikel 5.2.45, tweede en derde lid][ref3], onderbouwd met de beschikbare kostenbegroting(en).

      4 Indien een begroting voor een uitgavenpost wordt onderbouwd aan de hand van meerdere kostenbegrotingen wordt de
      keuze voor de in de begroting opgenomen kostenbegroting voldoende gemotiveerd.

      5 De verplichting tot het overleggen van kostenbegrotingen en de daaruit voortvloeiende eis om de keuze voor een
      bepaalde kostenbegroting te motiveren is niet van toepassing op:

      a. personeelskosten, bedoeld in [paragraaf 3.2][ref4] van deze afdeling; en

      b. de uitgaven, bedoeld in de [artikelen 5.3.179 tot en met 5.3.186][ref5].

      6 De minister kan besluiten dat de verplichting tot het overleggen van kostenbegrotingen en de daaruit
      voortvloeiende eis om de keuze voor een bepaalde kostenbegroting te motiveren, wordt verlegd naar een entiteit die
      op grond van een uitbestedingsovereenkomst namens een of meer producentenorganisaties zelfstandig een activiteit of
      uitgavenpost onder hun beheer uitvoert of laat uitvoeren.


