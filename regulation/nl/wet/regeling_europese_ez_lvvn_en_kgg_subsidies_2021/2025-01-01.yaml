    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel3.4.10
  - number: 3.5.1
    text: |-
      1 De Minister verstrekt op aanvraag subsidie voor de uitvoering van een innovatief project ter ondersteuning van
      innovatieve producten, processen of uitrusting in de visserij, dat past binnen het doel van het versterken van
      economisch, sociaal en ecologisch duurzame visserijactiviteiten, bedoeld in artikel 14, eerste lid, onderdeel a,
      van [verordening 2021/1139](33039R2021).

      2 Subsidie wordt verstrekt aan:

      a. een visserijonderneming;

      b. een visserijorganisatie;

      c. een kennisinstelling; of

      d. deelnemers in een samenwerkingsverband.

      3 Aan een samenwerkingsverband kan een marktdeelnemer als bedoeld in artikel 4, eerste lid, onderdeel 30,
      van [verordening 1380/2013](32013R1380) deelnemen en neemt in ieder geval een visserijorganisatie, een
      visserijonderneming of een kennisinstelling deel.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel3.5.1
  - number: 3.5.2
    text: De subsidie bedraagt 75 procent van de subsidiabele kosten, tot een maximum van € 500.000 per project.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel3.5.2
  - number: 3.5.3
    text: De Minister verdeelt het subsidieplafond op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel3.5.3
  - number: 3.5.4
    text: |-
      1 Met de uitvoering van het project wordt gestart na de datum van indiening van de subsidieaanvraag en uiterlijk
      binnen twaalf maanden na de subsidieverlening.

      2 De termijn, bedoeld in [artikel 2.11, tweede lid, onderdeel b][ref1], is 36 maanden na subsidieverlening.

      3 De Minister kan op verzoek van de subsidieontvanger ontheffing verlenen van de verplichtingen, bedoeld in het
      eerste en tweede lid, indien de subsidieontvanger binnen twaalf maanden na subsidieverlening niet de noodzakelijke
      vergunningen, ontheffingen en toestemmingen bezit en dit hem niet is aan te rekenen.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel2.11
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel3.5.4
