  - number: 5.3.79
    text: |-
      1 Uitgaven voor investeringen in innovatieve apparatuur op basis van niet-chemische methoden ten behoeve van
      gewasbescherming door het bevorderen van weerbare teelt zijn subsidiabel.

      2 Als innovatieve gewasbeschermingsapparatuur op basis van niet-chemische methoden zijn onder meer subsidiabel:

      a. apparatuur en bijbehorende regelsystemen voor UV-licht ter bestrijding van schimmelziekten;

      b. precisie mechanische onkruidbestrijdingsapparatuur en bijbehorende besturingssystemen voor toepassing van niet-
      chemische methoden;

      c. elektrochemische waterdesinfectie, inclusief bijbehorende spuit, tegen micro-organismen; en

      d. transportsystemen voor het verplaatsen van UV-belichtingsapparatuur naar de volgende rij of afdeling, mits
      onderdeel van de investering.

      3 Niet subsidiabel zijn:

      a. standaard agrarische apparatuur en onderdelen, zoals een tractor, gereedschapsdrager, motor en cabine;

      b. thermische apparatuur;

      c. kokend watertechnieken; en

      d. standaard afvoerwaterzuivering voor het recirculeren van water in de pro-oogstfase.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.79
  - number: 5.3.80
    text: |-
      1 De aankoop van investeringen voor lage emissie apparatuur is subsidiabel.

      2 Subsidiabel zijn:

      a. apparatuur en bijbehorende besturingssystemen voor precisietoepassingstechnieken zoals voor bodemherbiciden in
      rijen-zaaiingstechniek; en

      b. transportsystemen voor het verplaatsen van spuitrobots naar de volgende rij of afdeling, mits het onderdeel is
      van de investering.

      3 GPS systemen in het kader van de precisielandbouwtechnieken zijn subsidiabel indien de GPS systemen aantoonbaar
      worden ingezet voor:

      a. precisiezaaien of planten;

      b. precisietoediening van meststoffen en gewasbeschermingsmiddelen; of

      c. precisie mechanische onkruidbestrijding.

      4 Niet subsidiabel zijn standaard agrarische apparatuur en onderdelen, zoals een tractor, gereedschapsdrager, motor
      en cabine.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.80
  - number: 5.3.81
    text: |-
      1 Uitgaven voor investeringen in installaties ten behoeve van het zuiveren van water van gewasbeschermingsmiddelen
      voorafgaand aan lozing zijn subsidiabel:

      a. indien de lozing voldoet aan de bepalingen die zijn vastgelegd in het Activiteitenbesluit milieubeheer; of

      b. indien het bevoegd gezag heeft bepaald, dat de verplichting om water dat gewasbeschermingsmiddelen bevat
      voorafgaand aan het lozen door een zuiveringsvoorziening te leiden die ten minste 95% van de werkzame stoffen die
      bestaan uit organische verbindingen uit het afvalwater verwijdert, voor de desbetreffende inrichting niet geldt; of

      c. indien het een zuiveringsinstallatie betreft die meer dan 95% van de werkzame stoffen die bestaan uit organische
      verbindingen uit het afvalwater verwijdert.

      2 De volgende investeringen zijn subsidiabel:

      a. waterzuiveringsapparatuur en bijbehorende controlesystemen;

      b. helofytenfilters;

      c. biofilters; en

      d. maatregelen om uitstoot van landbouwproducten te voorkomen (puntbelasting).

      3 Niet subsidiabel zijn investeringen in standaard waterzuivering.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.81
  - number: 5.3.82
    text: |-
      1 Uitgaven voor investeringen in installaties ten behoeve van het zuiveren van water van ongewenste concentraties
      zouten, zoals natrium, chloride, stikstof en fosfaat, al dan niet voorafgaand lozing zijn subsidiabel, indien:

      a. de lozing voldoet aan de bepalingen die zijn vastgelegd in het Activiteitenbesluit milieu;

      b. het bevoegd gezag heeft bepaald, dat de verplichting om water dat gewasbeschermingsmiddelen bevat voorafgaand
      aan het lozen door een zuiveringsvoorziening te leiden die ten minste 95% van de werkzame stoffen die bestaan uit
      organische verbindingen uit het afvalwater verwijdert, voor de desbetreffende inrichting niet geldt; of

      c. indien het een zuiveringsinstallatie betreft die meer dan de wettelijk vereiste hoeveelheid stikstof en fosfaat
      uit het afvalwater verwijdert.

      2 De volgende investeringen zijn subsidiabel:

      a. waterzuiveringsapparatuur en bijbehorende controlesystemen;

      b. helofytenfilters;

      c. biofilters; en

      d. maatregelen om uitstoot van landbouwproducten te voorkomen (puntbelasting).

      3 Niet subsidiabel zijn investeringen in standaard waterzuivering.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.82
  - number: 5.3.83
    text: |-
      Uitgaven voor investeringen ter bestrijding van ziekten en plagen zijn subsidiabel. In het geval van biologische of
      geïntegreerde gewasbescherming en bijbehorende apparatuur zijn de volgende kosten subsidiabel:

      a. drones, indien voorzien van detectie;

      b. verblazingsapparatuur voor het effectief doseren van natuurlijke vijanden;

      c. een scoutbox voor automatische detectie en diagnose van plagen; en

      d. vliegenlampen.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.83
