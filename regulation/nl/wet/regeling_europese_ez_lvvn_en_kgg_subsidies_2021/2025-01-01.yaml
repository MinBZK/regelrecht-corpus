    text: |-
      1 Uitgaven van de producentenorganisatie ten behoeve van de bundeling van productstromen zijn subsidiabel, indien
      het gaat om investeringen in:

      a. sorteer- en verpakcentra;

      b. distributiecentra;

      c. verwerkingscentra;

      d. fustopslag; en

      e. dockboards.

      2 De investeringen voldoen aan de kwalificatie ‘Excellent’ en scoren minimaal 60% op de categorie ‘Energie’,
      volgens BREEAM-NL.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.95
  - number: 5.3.96
    text: |-
