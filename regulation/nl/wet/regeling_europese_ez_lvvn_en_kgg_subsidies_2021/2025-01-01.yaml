  - number: 5.8.4.1
    text: |-
      1 De Minister verstrekt op aanvraag aan een samenwerkingsverband subsidie voor een project gericht op het in
      overgangsgebieden N2000 reduceren van ammoniakemissie door extensivering van melkveehouderijbedrijven.

      2 Een project ondersteunt acties die bijdragen aan de interventietypes, bedoeld in artikel 77 van [verordening
      2021/2115](32115R2021), en aan de specifieke doelstellingen, bedoeld in artikel 6, eerste lid, onderdelen e en f,
      en tweede lid, van [verordening 2021/2115](32115R2021).

      3 Voor zover aan het samenwerkingsverband anderen dan landbouwers deelnemen en de subsidie niet hoofdzakelijk
      ten goede komt aan de landbouwsector bevat de subsidie, bedoeld in het eerste lid, staatssteun en wordt zij
      gerechtvaardigd door artikel 59 van de landbouwvrijstellingsverordening.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.8.4.1
  - number: 5.8.4.2
    text: |-
      1 De hoogte van de subsidie bedraagt ten minste € 125.000.

      2 De subsidie bedraagt 100% van de subsidiabele kosten, met dien verstande dat de subsidiabele kosten, bedoeld in
      [artikel 5.8.4.3, eerste lid, onderdelen a tot en met e][ref1], niet meer dan 25% van de totale subsidiabele kosten
      bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel5.8.4.3
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.8.4.2
    references:
      - id: ref1
        bwb_id: BWBR0045685
        artikel: 5.8.4.3
        hoofdstuk: '5'
        paragraaf: 5.8.4
  - number: 5.8.4.3
    text: |-
      1 Voor subsidie komen in aanmerking kosten die verband houden met alle aspecten van de samenwerking ten behoeve van
      de uitvoering van het project, overeenkomstig de tabel van [Bijlage 3][ref1] en voor zover deze zien op:

      a. kosten voor uitwerking plan;

      b. kosten voor bedrijfsplannen;

      c. kosten voor het begeleiden en uitvoeren van bedrijfsplannen en van de uitwerking;

      d. kosten voor communicatie;

      e. kosten voor rapportage;

      f. kosten voor een beheermaatregel extensiveren.

      2 De aanvrager berekent de subsidiabele kosten overeenkomstig [artikel 5.1.3a][ref2].

      3 In afwijking van het vorige lid en [artikel 5.1.2][ref3] worden de kosten voor de beheermaatregelen,
      bedoeld in het eerste lid 1, onderdeel f, bepaald op basis van de vaste vergoedingen opgenomen in
      [bijlage 3, onderdeel 6b][ref4].

      4 Voor subsidie komen niet in aanmerking: kosten voor vrijwilligers.


      [ref1]: https://wetten.overheid.nl/BWBR0045685
      [ref2]: https://wetten.overheid.nl/BWBR0045685#Artikel5.1.3a
      [ref3]: https://wetten.overheid.nl/BWBR0045685#Artikel5.1.2
      [ref4]: https://wetten.overheid.nl/BWBR0045685
