  - number: 5.5.14
    text: |-
      1 In afwijking van [artikel 5.5.10., eerste lid, onderdeel d][ref1], mag de schade worden vastgesteld op basis van
      een rekenmodel.

      2 Het rekenmodel wordt tezamen met de verzekeringsvoorwaarden goedgekeurd door de minister.

      3 De minister keurt het rekenmodel uitsluitend goed indien de verzekeraar aantoont dat de uitkomsten van het
      rekenmodel vergelijkbaar zijn met een schadebeoordeling door een schade-expert. Het rekenmodel bevat daartoe ten
      minste de noodzakelijke gegevens om de schade vast te kunnen stellen aan de hand van bedrijfsspecifieke gegevens
      van het landbouwbedrijf zoals het gewas en de grondsoort op perceelsniveau en de feitelijke weersomstandigheid die
      de schade veroorzaakt.

      4 De verzekeraar onderzoekt elk gebruik van het rekenmodel met behulp van een steekproef. De resultaten worden ter
      beschikking gehouden van de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel5.5.10
