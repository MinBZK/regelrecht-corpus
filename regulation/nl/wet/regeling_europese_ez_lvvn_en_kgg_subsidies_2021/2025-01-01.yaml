  - number: 5.3.65
    text: |-
      In het kader van uitgaven voor educatieve bijeenkomsten zijn uitsluitend subsidiabel:

      a. de door de organisatie van de educatieve bijeenkomst in rekening gebrachte kosten voor deelname van leden,
