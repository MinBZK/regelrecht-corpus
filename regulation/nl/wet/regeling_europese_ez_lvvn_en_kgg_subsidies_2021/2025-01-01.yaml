    text: |-
      1 De minister verstrekt op aanvraag subsidie aan kennisinstellingen, onderzoeksorganisaties en instellingen in het
      groen beroepsonderwijs voor projecten op het gebied van kennisontwikkeling en kennisverspreiding die activiteiten
      omvatten betreffende goede imkerpraktijken of de bijengezondheid en de doorwerking naar de praktijk verbeteren.

      2 De projecten ondersteunen activiteiten die bijdragen aan de interventietypes, bedoeld in artikel 55, eerste lid
      onderdelen a en e, van [verordening 2021/2115](32115R2021), en de specifieke doelstellingen, bedoeld in artikel 6,
      eerste lid, onderdelen c en f, van [verordening 2021/2115](32115R2021).

      3 Onverminderd [artikel 2.9, eerste lid][ref1], wordt een aanvraag om subsidie ingediend met gebruikmaking van een
      door de minister beschikbaar gesteld format.


