  - number: 5.3.180
    text: |-
      1 Uitgaven van de producentenorganisatie voor het groen oogsten van producten als bedoeld in artikel 47, tweede
      lid, onderdeel g, van [verordening 2021/2115](32115R2021) zijn subsidiabel.

      2 Uitgaven voor het groen oogsten van percelen beplant met appelbomen of perenbomen jonger dan twee jaar, zijn
      niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.180
  - number: 5.3.181
    text: |-
      1 Uitgaven van de producentenorganisatie voor het niet oogsten van producten als bedoeld in artikel 47, tweede lid,
      onderdeel h, van [verordening 2021/2115](32115R2021) zijn subsidiabel.

      2 Uitgaven voor het niet oogsten van percelen beplant met appelbomen of perenbomen jonger dan twee jaar, zijn niet
      subsidiabel.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.181
  - number: 5.3.182
    text: |-
      1 Een voorafgaande melding als bedoeld in artikel 17, zesde lid, van [verordening 2022/126](32026R2022), wordt
      elektronisch ingediend bij de Minister.

      2 In de melding wordt het door de minister toegekende registratienummer van het toepasselijke perceel
      of de registratienummers van de toepasselijke percelen, zoals vermeld op het formulier, bedoeld in de
      [Regeling landbouwtelling en gecombineerde opgave][ref1] zoals die geldt op het moment waarop de melding wordt
      gedaan, opgegeven.

      3 Ten behoeve van de melding maakt de producentenorganisatie of unie van producentenorganisaties gebruik van een
      door de minister beschikbaar gesteld middel.

      4 Indien de melding plaatsvindt voor 0:00 uur, vindt de controle op areaal en kwaliteit uiterlijk de derde werkdag
      plaats of informeert de minister de producentenorganisatie dat er geen controle zal plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0046363
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.182
    references:
      - id: ref1
        bwb_id: BWBR0046363
  - number: 5.3.183
    text: |-
      1 Voor de toepassing van artikel 17, achtste lid, onderdeel e, van [verordening 2022/126](32026R2022), wordt de
      vergoeding voor producten waarvoor de normale oogst reeds begonnen is, maar die een langere oogstperiode hebben
      dan een maand, beperkt tot de resterende oogstcapaciteit indien de resterende oogstperiode minder bedraagt dan
      zes weken.

      2 De resterende oogstcapaciteit wordt door de producentenorganisatie ten genoegen van de minister bepaald aan de
      hand van:

      a. afleverbonnen van de planten;

      b. de normale productiecyclus van een gewas; en

      c. de oorspronkelijk geplande ruimdatum.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.183
  - number: 5.3.184
    text: |-
      1 De producentenorganisatie voert het vernietigde gewas, indien van toepassing, of het groen geoogste product af.

      2 Als toegestane bestemmingen voor afvoer worden aangewezen:

      a. afvalverwerkers; en

      b. veehouders ten behoeve van vervoedering.

      3 Afvalverwerkers beschikken over een geldige milieuvergunning.

      4 Producentenorganisaties sluiten schriftelijke overeenkomsten met afnemers en transporteurs van de in het eerste
      lid bedoelde gewassen en producten met gebruikmaking van een door de minister beschikbaar gesteld model, waarin de
      afnemers en transporteurs worden verplicht:

      a. tot naleving van de voorwaarden uit artikel 28, tweede lid, van [verordening 2022/126](32026R2022), inclusief
      het voeren van een aparte voorraadboekhouding voor de betrokken concrete acties;

      b. bij ontvangst van de gewassen en producten de daarbij behorende door de minister ter beschikking gestelde
      vrachtbrief te ondertekenen; en

      c. de vrachtbrief en de overeenkomst met de producentenorganisatie gedurende tenminste 7 kalenderjaren, volgend op
      het kalenderjaar waarin het verkoopseizoen eindigt, te bewaren.

      5 In aanvulling op het vierde lid worden ontvangers van de gewassen en producten verplicht om deze gewassen en
      producten:

      a. een niet voor menselijke consumptie geschikte bestemming te geven die:

      1°. de normale afzet van de betrokken productie niet in de weg staat; en

      2°. geen negatieve ecologische of fytosanitaire gevolgen heeft als bedoeld in artikel 17, achtste lid, onderdeel c,
      van [verordening 2022/126](32026R2022); en

      b. bij ontvangst per vracht te wegen en de weegbrieven gedurende tenminste 7 kalenderjaren, volgend op het
      kalenderjaar waarin het verkoopseizoen eindigt, te bewaren.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.184
  - number: 5.3.185
    text: |-
      1 Uitgaven voor premies ten behoeve van een oogst- en productieverzekering als bedoeld in artikel 47, tweede lid,
      onderdeel i, van [verordening 2021/2115](32115R2021) en artikel 18 van [verordening 2022/126](32026R2022) zijn
      subsidiabel voor zover de producentenorganisatie deze actie heeft opengesteld aan al haar leden.

      2 Uitgaven zijn slechts subsidiabel indien zij betrekking hebben op het deel van de polis dat betrekking heeft op
      gewasschade als gevolg van natuurrampen, ongunstige weersomstandigheden, ziekten of plagen.

      3 Assurantiebelasting en polis- of andere soortgelijke kosten zijn niet subsidiabel.

      4 Bij de aanvraag tot subsidievaststelling wordt door de producentenorganisatie aan de Minister, met gebruikmaking
      van een door de minister beschikbaar gesteld middel, in geval van de uitgaven informatie overlegd over de
      verzekering en de daaraan deelnemende leden.

      5 Overeenkomstig artikel 18, tweede alinea, van [verordening 2022/126](32026R2022) hebben oogst- en
      productieverzekeringen geen betrekking op verzekeringsuitkeringen die meer dan 100% van het door de producent
      geleden inkomensverlies dekken, inclusief vergoedingen die de producent ontvangt op grond van andere steun- of
      verzekeringsregelingen voor het verzekerde risico.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.185
  - number: 5.3.186
    text: |-
      1 Uitgaven van personeelskosten en reis- en verblijfkosten voor begeleiding van andere producentenorganisaties
      en unies van producentenorganisaties die op grond van [verordening 1308/2013](32013R1308) zijn erkend of uitgaven
      voor coaching van individuele producenten, als bedoeld in artikel 47, tweede lid onderdeel j, van [verordening
      2021/2115](32115R2021) zijn subsidiabel indien voldaan is aan de voorwaarden uit artikel 13 van [verordening
      2022/126](32026R2022).

      2 Uitgaven zijn subsidiabel indien de activiteiten, bedoeld in het eerste lid, uitvoering geven aan de in artikel
      13, eerste lid, onderdelen a tot en met c, van [verordening 2022/126](32026R2022) bedoelde doelen.

      3 Voor de reis- en verblijfkosten gelden de voorwaarden van [artikel 5.2.74][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel5.2.74
