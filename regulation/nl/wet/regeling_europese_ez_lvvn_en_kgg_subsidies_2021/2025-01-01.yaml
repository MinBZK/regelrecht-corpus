  - number: 5.2.45
    text: |-
      1 In afwijking van [artikel 2.9, vijfde lid][ref1], wordt per project de volgende informatie verstrekt;

      a. een omschrijving van welke sectorale doelstellingen worden nagestreefd;

      b. een omschrijving van het project;

      c. een omschrijving en onderbouwing van de meetbare uitgangssituatie van dit project ten aanzien van de sectorale
      doelstellingen;

      d. een omschrijving en onderbouwing van het verwachte meetbare resultaat van dit project ten aanzien van de
      sectorale doelstellingen;

      e. de subsidiabele activiteiten die in het kader van het project worden ingezet om de resultaten van de
      producentenorganisatie te realiseren;

      f. de looptijd; en

      g. een beschrijving van het tijdpad en mijlpalen.

      2 De informatie over de voorgestelde activiteiten waarmee de realisatie van de sectorale doelstelling wordt
      nagestreefd bevat per subsidiabele activiteit de volgende onderdelen:

      a. een omschrijving van de activiteit; en

      b. een onderbouwing van de subsidiabiliteit van de activiteit en de bijbehorende uitgavenposten;

      3 Per uitvoeringsjaar van het operationeel programma wordt, indien de minister daarom verzoekt, een begroting voor
      de activiteit aan de minister verstrekt en onderbouwd aan de hand van:

      a. minimaal drie onderling vergelijkbare kostenbegrotingen per uitgavenpost voor uitgavenposten die betrekking
      hebben op het eerste jaar van het operationeel programma; en

      b. minimaal één kostenbegroting per uitgavenpost voor uitgavenposten die betrekking hebben op de volgende jaren van
      het operationeel programma.

      4 De looptijd van een project, bedoeld in het eerste lid, is ten hoogste zeven jaar. Indien de looptijd van
      het project aan het einde van het operationeel programma nog niet is afgelopen kan het project in een volgend
      operationeel programma worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel2.9
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.45
    references:
      - id: ref1
