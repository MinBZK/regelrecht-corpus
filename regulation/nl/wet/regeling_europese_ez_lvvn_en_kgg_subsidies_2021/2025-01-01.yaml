  - number: 5.2.50
    text: |-
      1 Een producentenorganisatie meldt onverwijld iedere wijziging van een operationeel programma.

      2 Een wijziging van een operationeel programma gedurende het jaar betreft de toekomst en kan betrekking hebben op:

      a. het toevoegen van nieuwe uitgavenposten aan bestaande activiteiten of van nieuwe activiteiten aan bestaande
      projecten opgenomen in een goedgekeurd operationeel programma, indien deze noodzakelijk is om de resultaten van het
      project te behalen;

      b. het verhogen van het jaarbedrag van het actiefonds;

      c. het niet of niet geheel uitvoeren van een project, activiteit of uitgavenpost.

      3 De producentenorganisatie geeft ten aanzien van de melding van wijzigingen als bedoeld in het tweede lid,
      onderdelen a en b, gemotiveerd aan:

      a. hoe het begrote bedrag tot stand gekomen is;

      b. waarom deze wijziging noodzakelijk is; en

      c. wat de gevolgen van deze wijziging zijn voor de uitvoering en de begroting van het operationeel programma.

      4 In aanvulling op het tweede lid geeft de producentenorganisatie ten aanzien van wijzigingen als bedoeld in
      het tweede lid, onderdeel a, gemotiveerd aan indien het een nieuwe activiteit of uitgavenpost betreft, hoe deze
      bijdraagt aan het project.

      5 Op een wijziging als bedoeld in het tweede lid, onderdeel a, is [artikel 5.2.45, derde lid][ref1], alsmede
      [artikel 5.2.46, tweede tot en met zesde lid][ref2], van overeenkomstige toepassing.

      6 Een producentenorganisatie kan onmiddellijk na het indienen van een verzoek tot wijziging, onder de voorwaarde
      dat dit voor eigen rekening en risico gebeurt, aanvangen met het doorvoeren van de wijziging.

      7 De producentenorganisatie geeft ten aanzien van de melding van wijzigingen als bedoeld in het
      tweede lid, onderdeel c, gemotiveerd aan wat de gevolgen van deze wijziging zijn voor de uitvoering
      en de begroting van het operationeel programma en de meetbare resultaten en mijlpalen, bedoeld in
      [artikel 5.2.45, eerste lid, onderdelen d en g][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel5.2.45
      [ref2]: https://wetten.overheid.nl/BWBR0045685#Artikel5.2.46
