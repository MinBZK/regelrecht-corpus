  - number: 5.3.42
    text: |-
      1 Uitgaven van de producentenorganisatie ten behoeve van de versterking van de verticale samenwerking en integratie
      in de keten door beleggingen in aandelen zijn subsidiabel indien het gaat om uitgaven voor investeringen of
      kapitaal van ondernemingen en indien deze investeringen rechtstreeks bijdragen tot de verwezenlijking van de
      doelstellingen van het operationele programma.

      2 De producentenorganisatie toont bij de aanvraag tot subsidieverlening dan wel bij wijziging van een operationeel
      programma als bedoeld in [artikel 5.2.50][ref1] aan dat een due diligence onderzoek is uitgevoerd, of een daarmee
      vergelijkbaar onderzoek.

      3 Niet subsidiabel zijn kosten voor de overname van teeltbedrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel5.2.50
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.42
    references:
      - id: ref1
        bwb_id: BWBR0045685
        artikel: 5.2.50
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: 5.2.3
  - number: 5.3.43
    text: |-
      1 Uitgaven van de producentenorganisatie ten behoeve van marktonderzoek,

      marktontwikkeling en marketing, inclusief personeelskosten, zijn subsidiabel indien het gaat om:

      a. consumentenonderzoek en aankoop van marktdata en paneldata;

      b. het testen van een product door middel van technische metingen op voor de markt relevante producteigenschappen;

      c. onderzoek naar het onderhouden van schap of retail positionering;

      d. productmarktanalyses;

      e. marktonderzoek;

      f. het doen van marktonderzoek door middel van pop-up stores;

      g. verkoopbevordering van merken en handelsnamen; en

      h. afzetbeleid en marktstrategie, voor zover niet gericht op de interne organisatie van de producentenorganisatie;

      2 Onderzoeken naar verwerkte producten zijn slechts subsidiabel indien dit onderzoek betrekking heeft op producten
      die bestemd zijn voor de food-markt.

      3 Onder marktstrategie wordt verstaan samenwerking in de keten, reclame, innovatie en planning van het
      productaanbod.

      4 Uitgaven voor activiteiten gericht op het bepalen van een markstrategie zijn subsidiabel voor zover deze
      betrekking hebben op het:

      a. samenstellen van een innovatief, concurrerend en formulegericht assortiment per productgroep;

      b. behouden van klanten of nieuwe klanten werven door acquisitieactiviteiten;

      c. bepalen van de ontwikkeling, de productie, de marketing en het in de markt zetten van een product en het
      analyseren van de resultaten met het oog op de commerciële lange termijn doelen;

      d. bepalen van de marktstrategie door middel van marketingplannen en het ervoor zorgen dat deze strategie wordt
      geïmplementeerd en nageleefd; of

      e. onderzoek naar alle factoren op alle verschillende (potentiële) markten die de vraag naar een product
      beïnvloeden, onder meer wat betreft trends, klanttevredenheid, de onderliggende behoeften van klanten en het imago
      van de sector.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.43
  - number: 5.3.44
    text: |-
      Uitgaven van de producentenorganisatie voor het opzetten of ontwikkelen van ICT-systemen ten behoeve van
      innovatieve bezorgsystemen binnen de producentenorganisatie, inclusief personeelskosten, zijn subsidiabel indien
      het gaat om uitgaven voor:

      a. ontwikkeling en inzet van nieuwe informatiedragers, zoals stickers, QR codes, barcodes, chips, of andere nieuwe
      vormen; en

      b. verbetering van uitwisseling van data en digitale infrastructuur tussen diverse keten partijen.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.44
  - number: 5.3.45
    text: |-
      1 Uitgaven van de producentenorganisatie voor personeelskosten en externe diensten ten behoeve van voorraadbeheer
      en distributie, het ontwerpen, bouwen en implementeren van ICT systemen voor logistieke planning zijn subsidiabel.

      2 Bij de indiening van het operationeel programma overlegt de producentenorganisatie aan de Minister:

      a. een begroting van het aantal uren per taak of functie; en

      b. een omschrijving van de taken en functies.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.45
  - number: 5.3.46
    text: |-
      1 Uitgaven van producentenorganisaties voor ICT systemen voor markt en afzet, inclusief personeelskosten, zijn
      subsidiabel indien het gaat om de kosten van de benodigde aanpassingen van het systeem en de interface, inclusief
      de benodigde aanpassingen ten behoeve van de werking van de interface, met:

      a. een aanvoerregistratiesysteem;

      b. een verkoopsysteem;

      c. een verladingssysteem;

      d. een orderregistratiesysteem; of

      e. een facturatiesysteem.

      2 Uitgaven zijn alleen subsidiabel indien zij voldoen aan de algemene voorschriften voor ICT, bedoeld in
      [paragraaf 4.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.46
    references:
