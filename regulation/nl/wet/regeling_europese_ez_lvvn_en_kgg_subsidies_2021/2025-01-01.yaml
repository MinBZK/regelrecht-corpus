  - number: 5.7.19
    text: |-
      1 Een opleidingsvoucher wordt door de minister aan een bedrijfsadviseur op aanvraag verstrekt voor het volgen van
      de Opleiding bedrijfscoach stikstof in de landbouw, de Opleiding bedrijfscoach Natuurinclusief ondernemen in de
      landbouw of de Opleiding bedrijfscoach precisielandbouw bij een kennisinstelling.

      2 De bedrijfsadviseur vermeldt bij de aanvraag een aangewezen kennisinstelling naar keuze die deze erkende
      opleiding geeft.

      3 De opleidingsvoucher wordt overgedragen aan de kennisinstelling, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.7.19
  - number: 5.7.20
    text: |-
      De minister bepaalt op volgorde van binnenkomst aan welke bedrijfsadviseurs binnen het subsidieplafond
      opleidingsvouchers worden verstrekt, uitgaande van de maximumwaarde per voucher.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.7.20
  - number: 5.7.21
    text: |-
      De minister beslist afwijzend op een aanvraag indien aan de aanvrager al eerder een voucher als bedoeld in
      [artikel 5.7.19][ref1] of [titel 2.4 van de Regeling nationale EZK- en LNV-subsidies][ref2] is toegekend in
      hetzelfde kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel5.7.19
      [ref2]: https://wetten.overheid.nl/BWBR0035474
