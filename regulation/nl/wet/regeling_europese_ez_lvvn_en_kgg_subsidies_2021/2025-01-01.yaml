  - number: 5.7.36
    text: |-
      1 Onverminderd [artikel 2.9][ref1], bevat een aanvraag voor subsidie, als bedoeld in [artikel 5.7.28][ref2], ten
      minste:

      a. gegevens over de aanvrager, waaronder contactgegevens, het BTW nummer en het KvK nummer waaronder zijn
      onderneming geregistreerd is bij de Kamer van Koophandel;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. gegevens van de landbouwers die geen aanvrager zijn en deelnemen in de groep van samenwerkende landbouwers;

      d. het projectplan, waarin onder meer zijn opgenomen de activiteiten waarvoor subsidie wordt aangevraagd, de
      doelstellingen van het project, beoogde doelgroep, de start- en einddatum, uitgangssituatie van het bedrijf op de
      vijf of meer onderwerpen van duurzame landbouw, waaronder stikstof, de groepssamenstelling de totale kosten, de
      omvang van de gevraagde subsidie en een samenvatting van het project.

      2 De aanvrager werkt eraan mee dat informatie over de demonstratieprojecten, waaraan subsidie wordt verstrekt,
      wordt gedeeld op Groen Kennisnet.

      3 Op verzoek van de minister werkt de aanvrager mee aan centrale projectcommunicatie.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel2.9
      [ref2]: https://wetten.overheid.nl/BWBR0045685#Artikel5.7.28
