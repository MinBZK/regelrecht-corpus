  - number: 5.1.4
    text: |-
      1 In aanvulling op [artikel 2.9, derde lid][ref1], bevat de aanvraag om subsidie het BTW-nummer van de
      subsidieontvanger en, indien van toepassing, de naam van de moedermaatschappij of iedere dochteronderneming met het
      daarbij behorende BTW-nummer.

      2 In aanvulling op [artikel 2.9, vijfde lid, onderdeel a, subonderdeel 5°][ref2], moet een aanvraag om subsidie
      bij een samenwerkingsverband ook vergezeld gaan van een bewijsstuk waaruit blijkt dat de penvoerder bevoegd is de
      betaling te ontvangen.


