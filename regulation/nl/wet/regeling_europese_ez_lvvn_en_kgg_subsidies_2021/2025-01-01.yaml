  - number: 3.4.1
    text: |-
      1 De Minister verstrekt op aanvraag subsidie voor de uitvoering van een innovatief project dat past binnen het
      doel van bevordering van duurzame aquacultuuractiviteiten, bedoeld in artikel 26, eerste lid, onderdeel a, van
      [verordening 2021/1139](33039R2021).

      2 Subsidie wordt verstrekt aan:

      a. een aquacultuuronderneming;

      b. een aquacultuurorganisatie;

      c. een kennisinstelling; of

      d. deelnemers in een samenwerkingsverband.

      3 Aan een samenwerkingsverband kan een marktdeelnemer als bedoeld in artikel 4, eerste lid, onderdeel 30,
      van [verordening 1380/2013](32013R1380) deelnemen en neemt in ieder geval een aquacultuurorganisatie, een
      aquacultuuronderneming of een kennisinstelling deel.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel3.4.1
  - number: 3.4.2
    text: De subsidie bedraagt 75 procent van de subsidiabele kosten, tot een maximum van € 500.000 per project.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel3.4.2
  - number: 3.4.3
    text: De Minister verdeelt het subsidieplafond op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel3.4.3
  - number: 3.4.4
    text: |-
      1 Met de uitvoering van het project wordt gestart na de datum van indiening van de subsidieaanvraag en uiterlijk
      binnen twaalf maanden na de subsidieverlening.

      2 De termijn, bedoeld in [artikel 2.11, tweede lid, onderdeel b][ref1], is 36 maanden na subsidieverlening.

      3 De Minister kan op verzoek van de subsidieontvanger ontheffing verlenen van de verplichtingen, bedoeld in het
      eerste en tweede lid, indien de subsidieontvanger binnen twaalf maanden na subsidieverlening niet de noodzakelijke
      vergunningen, ontheffingen en toestemmingen bezit en dit hem niet is aan te rekenen.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel2.11
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel3.4.4
    references:
      - id: ref1
        bwb_id: BWBR0045685
        artikel: '2.11'
        hoofdstuk: '2'
  - number: 3.4.5
    text: |-
      Onverminderd de [artikelen 2.11][ref1] en [3.1.3][ref2] beslist de Minister afwijzend op een aanvraag tot
      subsidieverlening, indien:

      a. de subsidiabele kosten minder dan € 150.000 bedragen;

      b. aan [artikel 3.4.6, eerste lid, onderdeel a, b of d][ref3], minder dan 6 punten zijn toegekend;

      c. het project niet bijdraagt aan de kweek of teelt van voor menselijke consumptie geschikte aquacultuurproducten;

      d. het project verband houdt met de kweek van genetisch gemodificeerde organismen als bedoeld in
      [artikel 1.1 van het Besluit genetisch gemodificeerde organismen milieubeheer 2013][ref4];

      e. het project gericht is op dieren die niet mogen worden gehouden;

      f. het project gericht is op aquacultuurproducten die op grond van [Verordening (EG) nr. 853/2004](32004R0853) van
      het Europees Parlement en de Raad van 29 april 2004 houdende vaststelling van specifieke hygiënevoorschriften voor
      levensmiddelen van dierlijke oorsprong (PbEU 2004, L 226) niet op de markt gebracht mogen worden;

      g. bij het project geen kennisinstelling wordt betrokken.


