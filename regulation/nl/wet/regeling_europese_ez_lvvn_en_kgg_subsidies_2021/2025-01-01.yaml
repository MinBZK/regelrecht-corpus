        bwb_id: BWBR0045685
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 5.3.47
    text: |-
      Uitgaven van de producentenorganisatie ten behoeve van het ontwerpen, bouwen en implementeren van ICT systemen voor
      customer relationship management systemen, inclusief personeelskosten, zijn subsidiabel.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.47
  - number: 5.3.48
    text: |-
      1 Uitgaven van de producentenorganisatie voor personeel en externe diensten in het kader van investeringen, ten
      behoeve van de bundeling van productstromen zijn subsidiabel indien het gaat om:

      a. de kosten van bouwkundig advies;

      b. de kosten van bouwbegeleiding;

      c. de kosten van projectmanagement;

      d. de kosten van onafhankelijk toezicht op uitvoering van een project;

      e. de kosten van haalbaarheidsstudies;

      f. juridische advieskosten; of

      g. reis- en verblijfkosten.

      2 Uitgaven als bedoeld in het eerste lid, onderdeel g, zijn niet subsidiabel indien het gaat om reis- en
      verblijfkosten voor het personeel van de producentenorganisatie of een dochteronderneming of haar leden.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.48
  - number: 5.3.49
    text: |-
      Uitgaven van de producentenorganisatie voor activiteiten ten behoeve van fusies en overnames of ten behoeve van de
      oprichting van unies van producentenorganisaties zijn subsidiabel, indien het gaat om:

      a. de juridische en advieskosten; en

      b. de kosten van haalbaarheidsstudies.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.49
  - number: 5.3.50
    text: |-
      In het kader van uitgaven voor educatieve bijeenkomsten zijn uitsluitend subsidiabel:

      a. de door de organisatie van de educatieve bijeenkomst in rekening gebrachte kosten voor deelname van leden,
      medewerkers van leden en medewerkers van de producentenorganisatie of dochterondernemingen; en

      b. de kosten van inhuur van externe deskundigen.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.50
  - number: 5.3.51
    text: |-
      De activiteiten die zijn opgenomen in deze paragraaf kunnen worden ingezet in het kader van projecten ter
      realisatie van de sectorale doelstelling verbetering van het concurrentievermogen, bedoeld in artikel 46, aanhef en
      onderdeel c, van [verordening 2021/2115](32115R2021).
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.51
  - number: 5.3.52
    text: |-
      1 Uitgaven van de producentenorganisatie in investeringen ten behoeve van ICT-toepassingen zijn subsidiabel. Indien
      het gaat om de volgende activiteiten in opdracht van en ten behoeve van de producentenorganisatie:

      a. De aanschaf en het ontwerpen, bouwen en implementeren van ICT-systemen;

      b. De aanschaf van camera’s en andere sensoren om een proces te automatiseren;

      c. aanschaf van hardware, software en interfaces; en

      d. datamanagement systemen.

      2 Uitgaven voor ICT zijn subsidiabel indien de producentenorganisatie op verzoek van de minister op basis van een
      offerte kan aantonen dat het ICT systeem uitsluitend bestemd is voor gekozen subsidiabele activiteiten.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.52
  - number: 5.3.53
    text: |-
      1 Uitgaven van de producentenorganisatie voor overige kosten of personeelskosten ten behoeve van ICT-toepassingen
      zijn subsidiabel. Het gaat om de aanschaf en het ontwerpen, bouwen en implementeren van ICT-systemen in opdracht
      van en ten behoeve van de producentenorganisatie:

      2 Uitgaven voor ICT zijn subsidiabel indien de producentenorganisatie op verzoek van de minister op basis van een
      offerte (inclusief specificatie van uren, taken en functies) kan aantonen dat de ICT uitgaven uitsluitend bestemd
      zijn voor gekozen subsidiabele activiteiten.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.53
  - number: 5.3.54
    text: |-
      1 Als uitgaven van de producentenorganisatie voor investeringen ten behoeve van automatisering van de teelt zijn
      onder meer subsidiabel:

      a. oogstrobots, plukrobots en innovatieve technieken die autonoom functioneren en leiden tot meer efficiency bij de
      producenten; en

      b. cameratechnieken voor scannen voor prognoses, oogsten en gewasbehandelingen.

      2 Niet subsidiabel zijn uitgaven voor technieken die breed worden toegepast en gangbaar zijn.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.54
  - number: 5.3.55
    text: |-
      1 Investeringen van producentenorganisaties ten behoeve van voorraadbeheer en distributie door de keten zijn
      subsidiabel indien het gaat om ICT systemen voor logistieke planning en voor zover zij tot doel hebben:

      a. kwaliteitsverbetering van het proces, inclusief de werking van koeling in de keten;

      b. tracking and tracing van producten, inclusief het volgen van kratten of bakken hogerop in de keten, mits het ten
      behoeve van de producentenorganisatie is;

      c. koppeling van vraag aan aanbod; of

      d. efficiencyverbetering.

      2 Onder de uitgaven vallen kosten voor de interfaces van ICT systemen voor logistieke planning, inclusief de
      benodigde aanpassingen ten behoeve van de werking van de interfaces, met:

      a. een aanvoerregistratiesysteem;

      b. een verkoopsysteem;

      c. het verladingssysteem;

      d. een orderregistratiesysteem; of

      e. een facturatiesysteem.

      3 Uitgaven op locatie van de leden van de producentenorganisatie zijn slechts subsidiabel indien de
      producentenorganisatie kan aantonen dat zij integraal onderdeel uitmaken van het systeem voor logistieke planning
      van de producentenorganisatie.

      4 Uitgaven zijn alleen subsidiabel indien zij voldoen aan de algemene voorschriften voor ICT, bedoeld in
      [paragraaf 4.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.55
    references:
      - id: ref1
        bwb_id: BWBR0045685
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 5.3.56
    text: |-
