  - number: 5.6.4
    text: |-
      1 De hoogte van de subsidie bedraagt minimaal € 125.000 en maximaal € 500.000.

      2 In afwijking van het eerste lid bedraagt de subsidie voor een project dat gericht is op de categorie, bedoeld in
      [artikel 5.6.2, zesde lid, onderdeel a][ref1], minimaal € 25.000 en maximaal € 125.000.

      3 De varkenshouders die deelnemen aan de operationele groep, bedoeld in [artikel 5.6.2, tweede lid][ref2],
      ontvangen samen ten minste 60% van het totale subsidiebedrag.

      4 De hoogte van de subsidie bedraagt:

      a. Indien gebruik wordt gemaakt van de berekeningswijze, benoemd in
      [artikel 5.1.2, eerste lid, onderdelen a en b][ref3]:

      1°. 40% van de subsidiabele kosten voor investeringen;

      2°. 100% van de overige subsidiabele kosten;

      b. Indien gebruik wordt gemaakt van de berekeningswijze, benoemd in [artikel 5.1.2, eerste lid, onderdeel c][ref4],
      100% van de subsidiabele kosten.

      5 De hoogte van de subsidie voor de aankoop van landbouwgrond bedraagt ten hoogste 10% van de totale subsidiabele
      kosten van het project.


