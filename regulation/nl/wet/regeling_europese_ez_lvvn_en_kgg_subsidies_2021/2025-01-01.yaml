  - number: 5.9.7
    text: |-
      1 De subsidieontvanger verleent medewerking aan een evaluatie van de effecten van deze subsidie, voor zover deze
      medewerking redelijkerwijs van hem verlangd kan worden.

      2 De subsidieontvanger zet het landbouwbedrijf, behoudens overmacht of uitzonderlijke omstandigheden, minimaal vijf
      jaar voort en meldt binnen een termijn van 14 dagen aan de minister indien er sprake is van omstandigheden waardoor
      deze het bedrijf niet meer kan voortzetten dan wel de activiteiten beschreven in het bedrijfsplan niet meer kan
      uitvoeren.

      3 De verplichtingen, bedoeld in het eerste en het tweede lid, gelden gedurende vijf jaar na de datum van
      subsidieverstrekking.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.9.7
  - number: 5.9.8
    text: |-
      Op de subsidie, bedoeld in [artikel 5.9.2, eerste lid][ref1], zijn de regels inzake een subsidie lager dan 25.000
      euro, bedoeld in [artikel 5.1.9, eerste lid, onderdeel a, en tweede en derde lid][ref2], van toepassing.


