  - number: 3.5.5
    text: |-
      Onverminderd de [artikelen 2.11][ref1] en [3.1.3][ref2] beslist de Minister afwijzend op een aanvraag tot
      subsidieverlening, indien:

      a. de subsidiabele kosten minder dan € 250.000 bedragen of, indien het aangevraagde project uitsluitend betrekking
      heeft op binnenvisserij of kustvisserij, minder dan € 100.000 bedragen;

      b. aan [artikel 3.5.6, eerste lid, onderdeel a, c of d][ref3], minder dan 6 punten zijn toegekend;

      c. bij het project geen kennisinstelling wordt betrokken;

      d. bij het project sprake is van verhoging van de brutotonnage van een vissersvaartuig als bedoeld in artikel 19,
      derde lid, onderdeel c, van [verordening 2021/1139](33039R2021).


