  - number: 5.3.197
    text: |-
      Het jaarverslag over de uitvoering van operationele programma’s dat samen met de aanvraag tot subsidievaststelling
      wordt ingediend bevat ten aanzien van de tijdens het voorgaande uitvoeringsjaar uitgevoerde operationele programma:

      a. een beschrijving van de geplande en daadwerkelijke uitgevoerde werkzaamheden voor het betreffende jaar per
      activiteit;

      b. een motivering van afwijkingen tussen geplande en daadwerkelijke uitgevoerde werkzaamheden;

      c. een beschrijving per activiteit van de geplande en daadwerkelijk bereikte realisatie voor het betreffende jaar
      ten aanzien van de sectorale doelstellingen.

      d. een motivering van afwijkingen tussen geplande en de daadwerkelijk bereikte realisatie; en

      e. een beschrijving van de maatregelen die de producentenorganisatie neemt om alsnog de doelstellingen te kunnen
      bereiken.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.197
  - number: 5.3.198
    text: |-
      1 De producentenorganisatie of unie van producentenorganisaties overlegt gelijktijdig met het jaarverslag over het
      voorlaatste jaar van de looptijd van het operationeel programma een evaluatie van het operationele programma met
      gebruikmaking van een door de minister beschikbaar gesteld middel.

      2 De evaluatie bevat in ieder geval de volgende onderdelen:

      a. een beschrijving van de geplande en daadwerkelijke gedurende de looptijd van het operationeel programma
      uitgevoerde projecten en activiteiten;

      b. een motivering van afwijkingen tussen geplande en daadwerkelijke uitgevoerde projecten en activiteiten;

      c. een beschrijving per project en activiteit van de geplande en gedurende de looptijd van het operationeel
      programma daadwerkelijk bereikte realisatie van de in het goedgekeurde operationele programma vastgestelde
      verwachte meetbare kwantificeerbaar resultaat;

      d. motivering van afwijkingen tussen geplande en de daadwerkelijk kwantificeerbaar bereikte realisatie, bedoeld in
      onderdeel c;

      e. een beschrijving van de kwantificeerbare bijdrage die de uitvoering van het operationeel programma
      gedurende haar looptijd geleverd heeft aan de realisatie van het operationeel programma, met name de sectorale
      doelstellingen;

      f. een beschrijving van de begrote en daadwerkelijke benutting van het actiefonds gedurende de looptijd van het
      operationeel programma;

      g. een motivering van afwijkingen tussen begrote en de daadwerkelijk bereikte benutting van het actiefonds; en

      h. een beschrijving van de wijzigingen van het operationele programma als gevolg van de afwijkingen, bedoeld in
      onderdelen b, d en f.

      3 Indien de looptijd van een operationeel programma is verlengd door middel van een wijziging van het operationeel
      programma behoeft de evaluatie slechts éénmaal te worden uitgevoerd.

      4 Als onderdeel van de evaluatie beschrijft de producentenorganisatie welke lessen te trekken zijn om toekomstige
      operationele programma’s te verbeteren en welke wijzigingen in het lopende operationele programma moeten worden
      aangebracht.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.198
  - number: 5.3.198a
    text: |-
      1 De producentenorganisatie overlegt bij de aanvraag tot gedeeltelijke betaling of de aanvraag tot
      subsidievaststelling in voorkomend geval gegevens aan de Minister over:

      a. het aantal deelnemers dat aan de actie heeft deelgenomen;

      b. het aantal leden en de identificatie van de leden die aan de actie hebben deelgenomen; en

      c. de geïnstalleerde jaarlijkse capaciteit van het duurzaam productiemiddel, per duurzaam productiemiddel
      uitgedrukt in Megawatt;

      d. het aantal hectares en de toepasselijke percelen waarop de actie is uitgevoerd, in voorkomend geval uitgesplitst
      naar arealen die SKAL zijn gecertificeerd en naar arealen die in omschakeling zijn; en

      e. Het volume en het percentage waterbesparing per duurzaam productiemiddel.

      2 De producentenorganisatie overlegt de informatie door middel van een door de Minister ter beschikking gesteld
      model.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.198a
  - number: 5.3.199
    text: |-
      1 Een investering in een duurzaam productiemiddel die in het operationeel programma direct voorafgaande aan het
      eerste operationeel programma dat wordt goedgekeurd onder [verordening 2021/2115](32115R2021) is opgenomen en in
      tranches ten laste van het actiefonds werd gebracht, kan worden opgenomen in het eerste operationele programma dat
      wordt goedgekeurd onder [verordening 2021/2115](32115R2021).

      2 Projecten die zijn opgenomen in het operationeel programma direct voorafgaande aan het eerste
      operationeel programma dat wordt goedgekeurd onder [verordening 2021/2115](32115R2021) en op grond van
      [artikel 51, zesde lid van de Regeling uitvoering GMO groenten en fruit 2018][ref1] een looptijd hadden die de
      looptijd van het operationeel programma overschrijdt, kunnen worden ingebracht in het eerste operationele programma
      dat wordt goedgekeurd onder [verordening 2021/2115](32115R2021).

      3 De tranches, bedoeld in het eerste lid, hoeven niet te worden ingediend in het kader van een project.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel51
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.199
    references:
      - id: ref1
        bwb_id: BWBR0041140
        artikel: '51'
  - number: 5.3.200
    text: |-
      Deze titel vervalt met ingang van 17 oktober 2027, met dien verstande dat deze van toepassing blijft op subsidies
      die voor die datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.200
  - number: 5.3.201
    text: |-
      De Regeling uitvoering GMO groenten en fruit 2018 wordt ingetrokken, met dien verstande dat deze van toepassing
      blijft op operationele programma’s die voldoen aan artikel 5, zesde lid, onderdeel c, van [verordening 2021/2117]
      (32117R2021). Voor deze operationele programma’s zijn de artikelen met betrekking tot erkenningen in deel 2 van de
      Regeling uitvoering GMO groenten en fruit 2018 niet langer van toepassing en gelden de artikelen met betrekking tot
      erkenningen in afdeling 5.2.1.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.201
  - number: 5.4.1
    text: |-
      1 In deze titel wordt verstaan onder:

        - *instelling in het groen beroepsonderwijs:* instelling als bedoeld in
      [artikel 1.1.1 van de Wet educatie en beroepsonderwijs][ref1] die beroepsonderwijs als bedoeld
      in [artikel 1.2.1, tweede lid, van die wet][ref2], aanbiedt in het opleidingsdomein genoemd in
      [artikel 2, onderdeel p, van de Regeling vaststelling kwalificatiedossiers en opleidingsdomeinen 2016][ref3];
        - *kennisinstelling:* a. in onderdeel a, b, g of h van de [bijlage behorende bij de Wet op het hoger onderwijs
      en wetenschappelijk onderzoek](onbekend) genoemde instelling voor hoger onderwijs; b. andere dan in onderdeel a
      bedoelde geheel of gedeeltelijk, meerjarig door de overheid gefinancierde onderzoeksorganisatie zonder winstoogmerk
      die activiteiten verricht met als doel de algemene wetenschappelijke of technische kennis uit te breiden; c. geheel
      of gedeeltelijk, meerjarig door een andere lidstaat van de Europese Unie gefinancierde: 1°. openbare instelling
      voor hoger onderwijs; 2°. onderzoeksorganisatie zonder winstoogmerk die activiteiten verricht met als doel de
      algemene wetenschappelijke en technische kennis uit te breiden; d. rechtspersoon ten aanzien waarvan een instelling
      als bedoeld in onderdeel a, b of c, direct of indirect: 1°. meer dan de helft van het geplaatste kapitaal
      verschaft; 2°. volledig aansprakelijk vennoot is; of 3°. overwegende zeggenschap heeft; e. onderzoeksorganisatie
      zonder winstoogmerk met eigen medewerkers in loondienst, die tot doel heeft via het structureel doen van eigen
      onderzoek en het ontwikkelen en testen van technische toepassingen door haar medewerkers, de technologische kennis
      op een specifiek terrein te bevorderen, die geen instelling is als bedoeld in de onderdelen a tot en met d;
        - *onderzoeksorganisatie:* organisatie voor onderzoek en kennisverspreiding als bedoeld in artikel 2, onderdeel
      83, van de algemene groepsvrijstellingsverordening en paragraaf 1.3, onderdeel ee, van de Kaderregeling betreffende
      staatssteun voor onderzoek, ontwikkeling en innovatie (2014/C 198/01);
        - *uitvoeringsjaar:* van 1 juli tot en met 30 juni.

      2 In afwijking van het eerste lid loopt het eerste uitvoeringsjaar van 1 januari tot en met 30 juni 2023.


