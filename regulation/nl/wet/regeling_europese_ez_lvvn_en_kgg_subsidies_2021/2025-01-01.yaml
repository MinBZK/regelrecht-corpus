    text: |-
      De specifieke kosten voor de aanschaf van biostimulanten in het kader van geïntegreerde gewasbescherming zijn
      subsidiabel indien de biostimulanten voldoen aan de voorwaarden uit [verordening 2019/1009](32909R2019) en voorzien
      zijn van CE-markering.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.105
  - number: 5.3.106
    text: |-
      1 Uitgaven voor biologisch uitgangsmateriaal en niet-chemisch behandelde zaden van gangbare oorsprong zijn
      subsidiabel indien zij door de Stichting Skal, bedoeld in [artikel 1 van het Landbouwkwaliteitsbesluit 2007][ref1],
      of een andere erkende instantie overeenkomstig Hoofdstuk V van [verordening 2018/848](32748R2018) dan wel een op
      grond van artikel 46 van [verordening 2018/848](32748R2018) erkende instantie, gecertificeerd zijn.

      2 Voor de uitgaven, bedoeld in het eerste lid, geldt een forfaitair tarief van 25%.

      3 De producentenorganisatie beschikt over:

      a. een factuur en een afleverbon met vermelding van Skalnummer en ‘eko’ of ‘bio’;

      b. het Skal certificaat van de leverancier of een lijst van Skal-gecertificeerde leveranciers en Skal-nummers; of

      c. het certificaat van de leverancier afgegeven door een andere dan Skal erkende instantie, bedoeld in het eerste
      lid.

      4 Niet subsidiabel is niet-biologisch teeltmateriaal, met uitzondering van alle vrijstellingen die Skal heeft
      verstrekt en goedgekeurd voor algemeen teeltmateriaal in de nationale bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0022535#Artikel1
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.106
