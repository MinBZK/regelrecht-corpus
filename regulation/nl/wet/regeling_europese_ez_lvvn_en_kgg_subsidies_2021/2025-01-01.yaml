  - number: 3.6.11
    text: |-
      Deze titel vervalt met ingang van 1 januari 2028, met dien verstande dat deze van toepassing blijft op subsidies
      die voor die datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel3.6.11
  - number: 4.1.1
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *auditautoriteit:* door de Minister aangewezen autoriteit als bedoeld in artikel 71, eerste lid, van [verordening
      2021/1060](32960R2021);
        - *financieringsinstrument:* financieringsinstrument als bedoeld in artikel 58, eerste lid, van [verordening
      2021/1060](32960R2021);
        - *programmasubsidie:* subsidie die wordt verstrekt aan een autoriteit van een grensoverschrijdend programma ten
      behoeve van het financieren van projecten die binnen dat grensoverschrijdende programma vallen.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel4.1.1
  - number: 4.1.2
    text: Dit hoofdstuk vervalt met ingang van 1 juli 2027.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel4.1.2
  - number: 4.2.1
    text: |-
      1 De beheerautoriteit verstrekt subsidie voor activiteiten passend binnen het programma waarvoor de
      beheerautoriteit is aangewezen.

      2 Een subsidie als bedoeld in het eerste lid kan worden verstrekt in de vorm van een bijdrage aan een
      financieringsinstrument.

      3 Indien wordt gekozen voor het verstrekken van subsidie in de vorm van een bijdrage aan een
      financieringsinstrument zijn de [artikelen 1.3][ref1], [1.3a][ref2], [1.3b][ref3], [1.3c][ref4], [1.3d][ref5],
      [4.2.5][ref6], [4.2.6][ref7], [4.2.8][ref8], [4.2.9][ref9] en [4.2.10][ref10] niet van toepassing.


