  - number: 3.1.1
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *aquacultuur:* aquacultuur als bedoeld in artikel 4, eerste lid, onderdeel 25, van [verordening 1380/2013]
      (https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32013R1380);
        - *aquacultuuronderneming:* onderneming die zich bezighoudt met de kweek of teelt van aquacultuurproducten;
        - *aquacultuurorganisatie:* organisatie waarvan uit de statuten blijkt dat zij het collectief belang van
      aquacultuurondernemingen behartigt;
        - *aquacultuurproducten:* aquacultuurproducten als bedoeld in artikel 4, eerste lid, onderdeel 34, van
      [verordening](https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32013R1380) 1380/2013;
        - *verordening 1380/2013:* [Verordening (EU) nr. 1380/2013](32013R1380) van het Europees Parlement en de Raad van
      11 december 2013 inzake het gemeenschappelijk visserijbeleid, tot wijziging van Verordeningen (EG) nr. 1954/2003 en
      (EG) nr. 1224/2009 van de Raad en tot intrekking van Verordeningen (EG) nr. 2371/2002 en (EG) nr. 639/2004 van de
      Raad en Besluit 2004/585/EG van de Raad (PbEU 2013, L 354);
        - *visserijonderneming:* onderneming die zich bezighoudt met visserijactiviteiten;
        - *visserijorganisatie:* organisatie waarvan uit de statuten blijkt dat zij het collectief belang van vissers of
      visserijondernemingen behartigt;
        - *visserijproducten:* visserijproducten als bedoeld in artikel 4, eerste lid, onderdeel 29, van [verordening]
      (https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32013R1380) 1380/2013;
        - *vissersvaartuig:* vissersvaartuig dat is geregistreerd in het register, bedoeld in
      [artikel 4 van het Besluit registratie vissersvaartuigen 1998][ref1].


