    text: |-
      De minister verdeelt de subsidieplafonds voor de categorieën, bedoeld in
      [artikel 5.6.2., zesde lid, onderdelen a, b, c en d][ref1], op volgorde van rangschikking van de aanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel5.6.2
