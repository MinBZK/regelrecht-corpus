  - number: '2.11'
    text: |-
      1 De minister beslist afwijzend op een aanvraag om subsidie indien de aanvraag niet voldoet aan de bij deze
      regeling, bij [verordening 2021/1060](32960R2021), bij [verordening 2021/1139](33039R2021), bij [verordening
      2021/2115](32115R2021) of bij [verordening 2021/2116](32116R2021) gestelde regels.

      2 De minister beslist afwijzend op een aanvraag om subsidie voor zover:

      a. onvoldoende vertrouwen bestaat dat de betrokkenen de activiteiten kunnen financieren;

      b. het onaannemelijk wordt geacht dat de activiteiten binnen een bij deze regeling gestelde termijn kunnen worden
      voltooid;

      c. de activiteiten voor het indienen van de subsidieaanvraag zijn voltooid;

      d. de activiteiten onvoldoende bijdragen aan de doelstellingen van de subsidie;

      e. de activiteiten zouden neerkomen op een verplaatsing van productiecapaciteit als bedoeld in artikel 65, eerste
      lid, onderdeel a, van [verordening 2021/1060](32960R2021);

      f. een verzoek is ingediend bij de rechtbank tot:

      1°. het op de subsidieaanvrager, of indien aanvragers van subsidie samenwerken in een samenwerkingsverband, op een
      van de deelnemers van het samenwerkingsverband, van toepassing verklaren van de schuldsaneringsregeling natuurlijke
      personen als bedoeld in [artikel 284, eerste lid, van de Faillissementswet][ref1];

      2°. verlening van surseance van betaling als bedoeld in [artikel 214, eerste lid, van de Faillissementswet][ref2]
      aan de subsidieaanvrager, of indien aanvragers van subsidie samenwerken in een samenwerkingsverband, aan een van de
      deelnemers van het samenwerkingsverband; of

      3°. faillietverklaring als bedoeld in [artikel 1, eerste lid, van de Faillissementswet][ref3] van de
      subsidieaanvrager, of indien aanvragers van subsidie samenwerken in een samenwerkingsverband, van een van de
      deelnemers van het samenwerkingsverband;

      g. de subsidie bestemd is voor:

      1°. een rechtspersoon of natuurlijke persoon tegen wie een bevel tot terugvordering uitstaat als bedoeld in
      artikel 1, vierde lid, onderdeel a, van de algemene groepsvrijstellingsverordening, artikel 1, vijfde lid,
      aanhef, van de visserijvrijstellingsverordening en artikel 1, vierde lid, aanhef en onderdeel a, van de
      landbouwvrijstellingsverordening; of

      2°. een onderneming in moeilijkheden als bedoeld in artikel 2, onderdeel 18, van de algemene
      groepsvrijstellingsverordening, artikel 2, onderdeel 29, van de visserijvrijstellingsverordening en artikel 2,
      onderdeel 59, van de landbouwvrijstellingsverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel284
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel214
      [ref3]: https://wetten.overheid.nl/BWBR0001860#Artikel1
