  - number: 4.2.2
    text: |-
      1 De beheerautoriteit stelt een subsidieplafond of meerdere deelplafonds ter uitvoering van deze regeling vast,
      alsmede de wijze van verdeling van het beschikbare bedrag onder het desbetreffende plafond.

      2 De beheerautoriteit kan een beschikbaar subsidiebedrag bestemmen voor een of meer financieringsinstrumenten.

      3 De beheerautoriteit maakt de criteria en procedures, bedoeld in artikel 73, eerste lid, van [verordening
      2021/1060](32960R2021), die worden gehanteerd binnen de wijze van verdeling, bedoeld in het eerste lid, bekend.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel4.2.2
  - number: 4.2.3
    text: |-
      1 Een aanvraag om subsidie wordt ingediend met gebruikmaking van een middel dat door de beheerautoriteit
      beschikbaar wordt gesteld.

      2 De beheerautoriteit kan bepalen dat een aanvraag om subsidie vergezeld gaat van een advies dat de
      beheerautoriteit op basis van een vooraanmelding aan de aanvrager heeft uitgebracht.

      3 De vooraanmelding bevat een voorlopige opgave van de gewenste te subsidiëren activiteiten en van de wijze waarop
      aan de toepasselijke voorschriften naar verwachting zal kunnen worden voldaan.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel4.2.3
  - number: 4.2.4
    text: |-
      1 De beheerautoriteit geeft binnen 26 weken een beschikking op een aanvraag om subsidie.

      2 Indien een beschikbaar subsidiebedrag wordt verdeeld op basis van rangschikking als bedoeld in
      [artikel 4.2.8, onderdeel b][ref1], begint de termijn, bedoeld in het eerste lid, op de eerste dag na afloop van
      de aanvraagperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel4.2.8
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel4.2.4
