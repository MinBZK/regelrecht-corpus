  - number: 5.8.3.10
    text: |-
      1 Er wordt ambtshalve een voorschot verstrekt dat 20% van de verleende subsidie bedraagt.

      2 Er kunnen deelbetalingen worden verstrekt. Een deelbetaling bedraagt ten minste € 50.000. Een deelbetaling kan
      maximaal twee keer per jaar worden aangevraagd.

      3 De subsidieontvanger dient een aanvraag voor een deelbetaling in, onder bijvoeging van de in
      [artikel 5.8.3.9, vierde lid, onder a, b en c][ref1], bedoelde facturen en documenten, na afloop van de uitvoering
      van een product of activiteit, bedoeld in [bijlage 3][ref2].

      4 Onverminderd [artikel 5.1.8][ref3] bedragen de deelbetalingen en het voorschot samen ten hoogste 90% van de
      verleende subsidie.


