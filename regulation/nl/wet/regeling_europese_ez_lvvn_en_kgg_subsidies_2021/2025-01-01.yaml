        paragraaf: '4.2'
  - number: 4.2.5
    text: |-
      1 Kosten als bedoeld in [artikel 1.3, eerste lid, aanhef en onderdeel e][ref1], kunnen niet worden vergoed indien
      het factuurbedrag lager is dan € 250, exclusief BTW.

      2 De subsidie voor de kosten, bedoeld in [artikel 1.3, eerste lid, aanhef en onderdeel e][ref2], waarvoor een
      factuur wordt ingediend met een factuurbedrag van € 250 of meer, exclusief BTW, wordt verhoogd met een opslag van 1
      procent ter dekking van de kosten, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel1.3
      [ref2]: https://wetten.overheid.nl/BWBR0045685#Artikel1.3
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel4.2.5
