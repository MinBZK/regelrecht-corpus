  - number: 1.3e
    text: |-
      De subsidiabele kosten van bijdragen in natura in de vorm van onbetaalde arbeid die in Nederland wordt verricht,
      bedragen € 157 per dag, of een evenredig deel daarvan bij een inzet minder dan acht uur per dag.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel1.3e
  - number: '1.4'
    text: |-
      Onverminderd artikel 64, eerste lid, van [verordening 2021/1060](32960R2021) komen de volgende kosten niet als
      subsidiabele kosten als bedoeld in [artikel 1.3, aanhef en onderdeel d][ref1], in aanmerking:

      a. administratieve en financiële sancties en boetes;

      b. winstopslagen binnen een groep of samenwerkingsverband;

      c. fooien en geschenken;

      d. representatiekosten en -vergoedingen;

      e. kosten van personeelsactiviteiten;

      f. kosten van overboekingen en annuleringen;

      g. gratificaties en bonussen; en

      h. kosten van outplacementtrajecten.


