  - number: '1.5'
    text: |-
      Indien toepassing wordt gegeven aan [artikel 4:57 van de Algemene wet bestuursrecht][ref1],
      [artikel 7 van de Kaderwet EZK- en LNV-subsidies][ref2] of in geval van terugvordering op grond van [verordening
      2021/1060](32960R2021), [verordening 2021/1058](32958R2021), [verordening 2021/1139](33039R2021), [verordening
      2021/1059](32959R2021) of [verordening 2021/2116](32116R2021), worden terug te vorderen bedragen vermeerderd
      met de wettelijke rente, bedoeld in [artikel 120, eerste lid, van Boek 6 van het Burgerlijk Wetboek][ref3], die
      wordt berekend over de periode vanaf de datum van het verstrijken van de termijn waarbinnen terugbetaling door de
      subsidieontvanger moet plaatsvinden en de datum van terugbetaling door de subsidieontvanger.


