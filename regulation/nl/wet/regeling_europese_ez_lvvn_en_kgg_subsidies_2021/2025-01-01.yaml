  - number: 3.1.3
    text: |-
      De minister beslist afwijzend op een aanvraag om subsidie, voor zover:

      a. de subsidieaanvrager niet-ontvankelijk is voor steun op grond van het bepaalde bij of krachtens artikel 11 van
      [verordening 2021/1139](33039R2021); of

      b. de activiteiten waarvoor subsidie wordt gevraagd niet subsidiabel zijn op grond van artikel 13 van de
      [verordening 2021/1139](33039R2021).
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel3.1.3
  - number: 3.1.4
    text: |-
      Onverminderd [artikel 2.9][ref1] bevat een aanvraag om subsidie in ieder geval:

      a. indien de subsidieaanvrager een natuurlijke persoon is, het burgerservicenummer;

      b. gegevens waaruit blijkt dat de subsidieaanvrager beschikt over de nodige financiële middelen en mechanismen,
      bedoeld in artikel 73, tweede lid, onderdeel d, van [verordening 2021/1060](32960R2021), om de exploitatie- en
      onderhoudskosten te dekken van het project of de investering waarvoor subsidie wordt aangevraagd uit te kunnen
      voeren;

      c. een verklaring dat de subsidieaanvrager niet niet-ontvankelijk is voor steun op grond van het bepaalde bij of
      krachtens artikel 11, eerste en derde lid, van [verordening 2021/1139](33039R2021);

      d. gegevens met betrekking tot het project of de investering waarvoor subsidie wordt aangevraagd om monitoring,
      evaluatie en rapportage aan de Europese Commissie, zoals bedoeld in de artikelen 42, eerste lid, 43 en 49, derde
      lid, van [verordening 2021/1060](32960R2021), mogelijk te maken;

      e. voor zover ten tijde van de aanvraag om subsidie bekend is dat de aanvrager een opdracht wil verlenen als
      bedoeld in [artikel 3.1.7, tweede lid][ref2], kopieën van de opgevraagde offertes, waarmee de kosten waarvoor
      subsidie wordt aangevraagd, onderbouwd worden;

      f. voor zover ten tijde van de aanvraag om subsidie bekend is dat een aanvrager een opdracht wil verlenen als
      bedoeld in [artikel 3.1.7, vijfde lid][ref3], gegevens over de gevolgde procedure en de gunningsbeslissing, bedoeld
      in artikel 3.1.7, zesde lid; en

      g. in voorkomend geval, kopieën van documenten waaruit blijkt dat voor activiteiten die zijn aangewezen krachtens
      [artikel 16.43, eerste lid, onderdelen a en b, van de Omgevingswet][ref4] voorafgaand aan de uitvoering van
      het plan, programma of project een milieueffectrapportage is gemaakt of door het bevoegd gezag een beoordeling
      is uitgevoerd of sprake is van aanzienlijke milieueffecten of aan het bevoegd gezag, in voorkomend geval, een
      mededeling van een voornemen is gedaan als bedoeld in [artikel 16.45, eerste lid, van de Omgevingswet][ref5];

      h. indien de aanvraag wordt ingediend voor een project waarvoor een vissersvaartuig wordt ingezet of voor een
      project dat ziet op het ontwikkelen van producten, processen of uitrusting die bedoeld zijn voor, al dan niet
      uiteindelijke, toepassing op een vissersvaartuig, een bevestiging van de Minister van Infrastructuur en Waterstaat
      dat deze een meldingsformulier van het project heeft ontvangen van de aanvrager.


