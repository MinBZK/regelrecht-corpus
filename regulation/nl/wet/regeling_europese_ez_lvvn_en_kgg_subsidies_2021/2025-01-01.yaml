      Onverminderd de [artikelen 2.11][ref1] en [3.1.3][ref2] beslist de minister afwijzend op een aanvraag tot
      subsidieverlening, indien:

      a. de subsidiabele kosten minder dan € 150.000 bedragen;

      b. aan [artikel 3.6.8, eerste lid, onderdeel a of b][ref3], minder dan 6 punten zijn toegekend;

