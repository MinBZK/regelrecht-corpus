  - number: 4.2.7
    text: |-
      1 De beheerautoriteit beslist afwijzend op een aanvraag indien:

      a. het project niet voldoet aan deze regeling, [verordening 2021/1060](32960R2021) of [verordening
      2021/1058](32958R2021), of gelet op de wijze van verdeling van het beschikbare bedrag, bedoeld in
      [artikel 4.2.2, eerste lid][ref1], of de criteria en procedures, bedoeld in artikel 4.2.2, derde lid, niet voor
      subsidie in aanmerking komt;

      b. het project niet voldoende bijdraagt aan de verwezenlijking van de specifieke doelstellingen binnen het
      programma of het gedeelte van het programma waarvoor het subsidieplafond of het deelplafond beschikbaar is gesteld;

      c. de aanvrager niet heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van de aanvraag
      op de uiterste datum van indiening in het geval van verdeling op basis van rangschikking als bedoeld in
      [artikel 4.2.8, onderdeel b][ref2];

      d. de subsidie bestemd is voor:

      1°. een onderneming tegen wie een bevel tot terugvordering uitstaat als bedoeld in artikel 1, vierde lid, aanhef en
      onderdeel a, van de algemene groepsvrijstellingsverordening; of

      2°. een onderneming in moeilijkheden als bedoeld in artikel 2, onderdeel 18, van de algemene
      groepsvrijstellingsverordening, tenzij steun gerechtvaardigd wordt door [verordening (EU) 2023/2831](32023R2831)
      van de Commissie van 13 december 2023 betreffende de toepassing van de artikelen 107 en 108 van het Verdrag
      betreffende de werking van de Europese Unie op de-minimissteun of door regels voor tijdelijke staatssteun die zijn
      vastgesteld om in te spelen op uitzonderlijke omstandigheden.

      2 De beheerautoriteit kan geheel of gedeeltelijk afwijzend beslissen op een aanvraag indien blijkt dat de beoogde
      financiering door de overige financiers geheel of gedeeltelijk niet zal worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel4.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0045685#Artikel4.2.8
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel4.2.7
