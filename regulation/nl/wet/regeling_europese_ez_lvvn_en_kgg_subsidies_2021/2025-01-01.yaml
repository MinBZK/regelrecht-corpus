      Voor zover zij direct verbonden zijn aan de uitvoering van de subsidiabele activiteiten als bedoeld in
      [artikel 3.2.2, eerste lid][ref1], komen als subsidiabele kosten in aanmerking:

      a. de kosten voor de aankoop, bouw en plaatsing van een mosselzaadinvanginstallatie; en

