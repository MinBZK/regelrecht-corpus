  - number: 5.1.1
    text: |-
      1 In dit hoofdstuk wordt verstaan onder:

        - *arbeidskosten:* de subsidiabele kosten, bedoeld in [artikel 1.3, eerste lid, onderdelen a en b][ref1];
        - *ELGF:* Europees Landbouwgarantiefonds, bedoeld in artikel 4, onderdeel a, van [verordening (EU) 2021/2116]
      (32116R2021);
        - *interventie:* interventie als bedoeld in artikel 3, derde lid, van [verordening 2021/2115](32115R2021);
        - *interventietype:* interventietype als bedoeld in artikel 47 van [verordening 2021/2115](32115R2021);
        - *investering:* investering in vaste of immateriële activa die worden aangewend voor de productie van goederen
      en diensten en die leidt tot een stijging van de waarde of de rentabiliteit van het landbouwbedrijf of een andere
      onderneming;
        - *jonge landbouwer:* landbouwer die jonger is dan 40 jaar op 31 december van het jaar waarin de steun wordt
      aangevraagd, die bedrijfshoofd is en beschikt over de vereiste passende opleiding of vaardigheden;
        - *kostenbegroting:* actuele offerte voor de concreet geplande aanschaf of dienst, dan wel een taxatierapport op
      basis van de marktwaarde, dan wel een officiële actuele prijslijst van leveranciers, dan wel een factuur uit een
      voorgaande periode voor eenzelfde soort geplande uitgavenpost, dan wel een vergelijkbaar document;
        - *landbouwer:* een natuurlijke of rechtspersoon die een landbouwactiviteit verricht als bedoeld in artikel 3,
      eerste lid, van [verordening 2021/2115](32115R2021);
        - *landbouwproducten:* voortbrengselen van bodem, veeteelt en visserij alsmede de producten in eerste graad van
      bewerking welke met de genoemde voortbrengselen rechtstreeks verband houden, zoals vermeld in artikel 38 en bijlage
      II van het Verdrag van de werking van de Europese Unie (VWEU);
        - *overige kosten:* de subsidiabele kosten, bedoeld in [artikel 1.3, eerste lid, onderdelen c, d en e][ref2];
        - *plattelandsinterventies:* interventies als bedoeld in artikel 69 van [verordening 2021/2115](32115R2021);
        - *sectorale interventies:* interventies als bedoeld in artikel 42 van [verordening 2021/2115](32115R2021);
        - *verordening 2022/126:* Gedelegeerde [Verordening (EU) 2022/126](32026R2022) van de Commissie van 7 december 2021
      tot aanvulling van [Verordening (EU) 2021/2115](32115R2021) van het Europees Parlement en de Raad met aanvullende
      eisen voor bepaalde interventietypes die de lidstaten in het kader van die verordening in hun strategisch GLB-
      plan voor de periode 2023-2027 uitwerken, alsmede regels voor het aandeel in het kader van norm 1 inzake een goede
      landbouw- en milieuconditie (GLMC) (PbEU 2022, L 20);
        - *voorschot:* een voorschot als bedoeld in artikel 44 van [verordening 2021/2116](32116R2021), inhoudende een
      betaling aan de subsidieontvanger, vooruitlopend op het verrichten van een activiteit en uiterlijk totdat een
      deelbetaling wordt uitbetaald;
        - *werkgeverslasten:* loonkosten die voor rekening van de werkgever komen, waaronder vakantie-uitkeringen,
      pensioen- en sociale verzekeringspremies.

      2 In [titel 5.2][ref3] en [5.3][ref4] wordt verstaan onder:

        - *aanvoerprognose:* opgave door een lid van een producentenorganisatie van de hoeveelheid en aard van de producten
      die het lid in een door de producentenorganisatie te bepalen tijdvak bij de producentenorganisatie verwacht aan
      te voeren;
        - *accountant:* accountant die is ingeschreven in het accountantsregister, bedoeld in
      [artikel 36, eerste lid, van de Wet op het Accountantsberoep][ref5];
        - *actiefonds:* actiefonds als bedoeld in artikel 51 van [verordening 2021/2115](32115R2021);
        - *activiteit:* een actie of een door een producentenorganisatie in haar operationeel programma opgenomen
      interventie;
        - *areaalenquête:* inventarisatie van een door een lid van de producentenorganisatie beteeld areaal en de door dit
      lid geteelde producten;
        - *bijproduct:* een product, als bedoeld in artikel 31, derde lid, van [verordening 2022/126](32026R2022), dat
      resulteert uit de bereiding van een groente- of fruitproduct en dat een positieve economische waarde heeft, doch
      niet het belangrijkste beoogde product is;
        - *biologische productie:* biologische productie als bedoeld in [verordening 2018/848](32748R2018);
        - *denatureren:* ongeschikt maken voor menselijke consumptie;
        - *dochteronderneming:* dochteronderneming als bedoeld in artikel 31, zevende lid, van [verordening 2022/126]
      (32026R2022) en een entiteit binnen een keten van dochterondernemingen als bedoeld in punt 5 van bijlage III van
      [verordening 2022/126](32026R2022);
        - *erkenningsaanvraag:* een verzoek om erkenning als bedoeld in artikel 154, eerste lid, van [verordening
      1308/2013](32013R1308);
        - *erkenningsbesluit:* besluit van de minister inzake de erkenning van een producentenorganisatie als bedoeld in
      artikel 154, vierde lid, van [verordening 1308/2013](32013R1308);
        - *forfaitair standaardtarief:* vast of maximaal bedrag per eenheid, al dan niet uitgedrukt als percentage, dat
      wordt gebruikt om de te declareren bedragen vast te stellen en vooraf is vastgesteld op grond van artikel 44,
      tweede lid, van [verordening 2021/2115](32115R2021);
        - *gedeeltelijke betaling:* betaling op aanvraag van het gedeelte van de subsidie dat overeenkomt met de reeds
      in het kader van het operationele programma bestede bedragen dat niet meer dan 80% van het deel van de steun dat
      overeenkomt met de bedragen die in het kader van het operationeel programma reeds zijn besteed voor de betrokken
      periode bedraagt;
        - *goederenlogistiek:* het verzamelen, ophalen, sorteren, opslaan, verpakken, transporteren en distribueren van
      het product;
        - *investering in een duurzaam productiemiddel:* investering in materiële of immateriële activa, als bedoeld in
      artikel 11 van [verordening 2022/126](https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32791R2017), voor
      productiemiddelen die niet gedurende één productieproces volledig worden verbruikt;
        - *lid:* aangesloten producent als bedoeld in artikel 2, onderdeel b, van [verordening 2017/891](32791R2017);
        - *niet-producerend lid:* lid van de producentenorganisatie dat meer dan één teeltseizoen geen producten teelt
      waarvoor de producentenorganisatie is erkend;
        - *operationeel programma:* operationeel programma als bedoeld in artikel 50 van [verordening 2021/2115]
      (32115R2021);
        - *producentenorganisatie:* door de minister erkende producentenorganisatie als bedoeld in artikel 152 van
      [verordening 1308/2013](32013R1308);
        - *producten die vallen onder de sector groenten en fruit:* producten die vallen onder de sector groenten en fruit
      als bedoeld in bijlage I, deel IX, van [verordening 1308/2013](32013R1308) waarvoor de producentenorganisatie is
      erkend en die binnen de Unie door leden zijn geproduceerd;
        - *productie voor eigen rekening en risico:* degene voor wiens rekening en risico wordt geteeld draagt de risico’s
      die samenhangen met de teelt en de opbrengst en is daarmee de eigenaar van het product ongeacht of hier een
      verkooptransactie aan vooraf is gegaan. In beginsel is dit de producent voor wiens rekening tevens de winsten en
      eventuele verliezen komen;
        - *project:* samenhangend geheel van activiteiten die subsidiabel zijn gesteld in deze regeling ter realisatie van
      één of meer sectorale doelstellingen die door een producentenorganisatie worden nagestreefd met haar operationeel
      programma;
        - *restproduct:* een product dat niet aan de in artikel 76 van [verordening 2013/1308](33208R2013) bedoelde
      handelsnormen voldoet dan wel een bijproduct dat resulteert uit de voorbereidingen en wordt gebruikt als input
      voor verwerking;
        - *sectorale doelstelling:* sectorale doelstelling als bedoeld in artikel 46 van [verordening 2021/2115]
      (32115R2021);
        - *SWOT analyse:* bedrijfskundig model dat intern de sterktes en zwaktes en in de omgeving de kansen en
      bedreigingen analyseert;
        - *tranches:* bedragen als bedoeld in artikel 11, tweede lid, van [verordening 2022/126](32026R2022);
        - *tussentijdse wijziging:* een wijziging van het operationeel programma in de loop van het jaar;
        - *uitgavenpost:* samenstel van uitgaven die gezamenlijk aan dezelfde criteria voldoen om binnen een activiteit bij
      te dragen aan het concrete sectorale doelstelling van een project;
        - *uitvoeringsjaar:* jaar van uitvoering van een operationeel programma;
        - *unie van producentenorganisaties:* unie van erkende producentenorganisaties als bedoeld in artikel 156 van
      [verordening 1308/2013](32013R1308);
        - *verbonden partijen:* marktpartijen die economisch, organisatorisch, financieel of juridisch verbonden zijn en
      waarbij sprake kan zijn van beïnvloeding van de ene partij door de andere partij;
        - *verkoper:* natuurlijke of rechtspersoon die door een producentenorganisatie is belast met de verkoop
      van producten van de leden van de producentenorganisatie of van de producentenorganisatie zelf waarvoor de
      producentenorganisatie is erkend;
        - *verordening 2017/891:* gedelegeerde [verordening (EU) nr. 2017/891](32791R2017) van de Commissie van 13 maart
      2017 tot aanvulling van Verordening (EU) nr. 1308/2013 van het Europees Parlement en de Raad wat betreft de
      sectoren groenten en fruit en verwerkte groenten en fruit en tot aanvulling van Verordening (EU) nr. 1306/2013
      van het Europees Parlement en de Raad wat betreft de in deze sectoren toe te passen sancties en tot wijziging van
      Uitvoeringsverordening (EU) nr. 543/2011 van de Commissie (PbEU 2017, L 138);
        - *verordening 1308/2013:* [Verordening (EU) nr. 1308/2013](32013R1308) van het Europees Parlement en de Raad van
      17 december 2013 tot vaststelling van een gemeenschappelijke ordening van de markten voor landbouwproducten en tot
      intrekking van de Verordeningen (EEG) nr. 922/72, (EEG) nr. 234/79, (EG) nr. 1037/2001en (EG) nr. 1234/2007van de
      Raad (PbEU 2013, L 347);
        - *verordening 1144/2014:* [Verordening (EU) nr. 1144/2014](32014R1144) van het Europees Parlement en de Raad
      van 22 oktober 2014 inzake voorlichtings- en afzetbevorderingsacties betreffende landbouwproducten uitgevoerd
      op de interne markt en in derde landen en tot intrekking van Verordening (EG) nr. 3/2008 van de Raad (PbEU 2014,
      L 317/56);
        - *verordening 2018/848:* [Verordening (EU) nr. 2018/848](32748R2018) van het Europees Parlement en de Raad van
      30 mei 2018 inzake de biologische productie en de etikettering van biologische producten en tot intrekking van
      Verordening (EG) nr. 834/2007 van de Raad (PbEU 2018, L 15);
        - *verordening 2019/2009:* [Verordening (EU) 2019/1009](32909R2019) van het Europees Parlement en de Raad van
      5 juni 2019 tot vaststelling van voorschriften inzake het op de markt aanbieden van EU-bemestingsproducten en
      tot wijziging van de [Verordeningen (EG) nr. 1069/2009](32009R1069) en (EG) nr. [1107/2009](32009R1107) en tot
      intrekking van Verordening (EG) nr. [2003/2003](32003R2003) (PbEU 2019, L 170);
        - *voorbereiding:* voorbereidende activiteiten zoals schoonmaken, snijden, schillen, bijsnijden en drogen van
      groenten en fruit, zonder dat ze in verwerkte groenten en fruit worden omgezet;
        - *waarde afgezette productie:* waarde van de afgezette productie van een producentenorganisatie als bedoeld in
      artikel 31 van [verordening 2022/126](32026R2022).


