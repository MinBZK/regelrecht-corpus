  - number: 5.8.4.4
    text: De Minister verdeelt het subsidieplafond op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.8.4.4
  - number: 5.8.4.5
    text: |-
      1 Met de uitvoering van het project wordt uiterlijk binnen twee maanden na de subsidieverlening gestart.

      2 Het project is uiterlijk op 31 december 2028 afgerond.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.8.4.5
  - number: 5.8.4.6
    text: |-
      Onverminderd [artikel 2.11][ref1] beslist de Minister afwijzend op een aanvraag voor subsidieverlening indien:

      a. de ligging van de deelnemende percelen van het samenwerkingsverband voor meer dan 50% is beoogd buiten een
      overgangsgebied N2000;

      b. aan een aanvraag minder dan 2,5 punten zijn toegekend voor effectiviteit;

      c. de gezamenlijke deelnemende percelen van het samenwerkingsverband een oppervlakte betreffen van minder dan 200
      hectare;

      d. een melkveehouderijbedrijf deelneemt aan meer dan één samenwerkingsverband dat op grond van deze paragraaf een
      subsidieaanvraag indient;

      e. een deelnemer aan het samenwerkingsverband, niet zijnde een landbouwer, een onderneming is die geen kleine,
      middelgrote of micro-onderneming is als bedoeld in artikel 1, onderdeel a, van de landbouwvrijstellingsverordening;

      f. er geen sprake is van een nieuwe samenwerkingsvorm of het verrichten van nieuwe activiteiten door een bestaande
      samenwerkingsvorm;

      g. op basis van de aanvraag minder dan 21 punten zijn behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel2.11
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.8.4.6
    references:
      - id: ref1
        bwb_id: BWBR0045685
        artikel: '2.11'
        hoofdstuk: '2'
  - number: 5.8.4.7
    text: |-
      1 De Minister kent aan het uitvoeren van een project gericht op de reductie van ammoniakemissie in de
      overgangsgebieden N2000 door extensivering van melkveehouderijbedrijven een hoger aantal punten toe naarmate:

      a. de mate van effectiviteit hoger is;

      b. de haalbaarheid hoger is;

      c. de mate van efficiëntie hoger is; en

      d. de mate van urgentie hoger is.

      2 Het aantal punten bedraagt per onderdeel van het eerste lid ten hoogste 5 en minimaal 1.

      3 De wegingsfactoren voor het eerste lid, onderdelen a, b, c en d bedragen respectievelijk 4, 1, 1 en 1.

      4 Indien aan twee of meer aanvragen een gelijk totaal aantal punten is toegekend, rangschikt de Minister een
      aanvraag hoger naarmate meer punten zijn toegekend voor een rangschikkingscriterium met een hogere wegingsfactor.

      5 De score voor de mate van urgentie, bedoeld in het eerste lid, onderdeel d, wordt per stikstofgevoelig Natura
      2000 gebied bepaald overeenkomstig [bijlage 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045685
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.8.4.7
    references:
      - id: ref1
        bwb_id: BWBR0045685
  - number: 5.8.4.8
    text: |-
      1 De subsidieontvanger maakt de resultaten van het project openbaar via het EIP-netwerk, bedoeld in artikel 154 van
      [Verordening 2021/2115](32115R2021), en andere geëigende netwerken.

      2 De activiteiten ter uitvoering van maatregelen op percelen voldoen aan de volgende voorwaarden:

      a. uitvoering vindt plaats op landbouwareaal;

      b. de subsidieontvanger doet uiterlijk twee weken voor aanvang van de activiteit in
      [onderdeel 6b, van bijlage 3][ref1] een opgave van deze activiteit op perceelsniveau in een door de Minister
      beschikbaar gesteld registratiesysteem;

      3 De subsidieontvanger verleent medewerking aan monitoring en evaluatie van de effecten van de uitgevoerde
      activiteiten voor zover deze medewerking redelijkerwijs van de subsidieontvanger verlangd kan worden.

      4 De verplichting tot medewerking, bedoeld in het derde lid, geldt gedurende vijf jaar na de datum van de
      beschikking tot subsidievaststelling.


      [ref1]: https://wetten.overheid.nl/BWBR0045685
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.8.4.8
    references:
      - id: ref1
        bwb_id: BWBR0045685
  - number: 5.8.4.9
    text: |-
      1 Onverminderd [artikel 2.9][ref1] bevat de aanvraag ten minste de volgende gegevens:

      a. een intekening door de aanvrager op de beschikbaar gestelde digitale omgevingskaart met daarin aangegeven de
      percelen waar het samenwerkingsverband de activiteiten wil uitvoeren;

      b. een beschrijving van de beoogde activiteiten die door het samenwerkingsverband uitgevoerd gaan worden en een
      begroting van de kosten van die activiteiten volgens de omschrijving in [bijlage 3][ref2];

      c. een berekening van de beoogde dierexcretie, uitgedrukt in kilogrammen stikstof per hectare per bedrijf, na
      uitvoering van het project;

      d. een toelichting op de haalbaarheid van het project in relatie tot de kennis en ervaring met extensieve
      melkveehouderijbedrijven;

      e. een beschrijving van de mogelijke omgevingseffecten en uitkomsten van de afstemming met regionale overheden en
      relevante gebiedspartijen;

      f. een beschrijving van welke percelen van welke bedrijven meedoen.

      2 Onverminderd [artikel 2.18][ref3] dient de subsidieontvanger uiterlijk 1 april 2026 een tussenrapportage
      in bij de Minister. Deze tussenrapportage bevat een overzicht van de uitgevoerde activiteiten en de behaalde
      deelresultaten na het eerste beheerjaar in 2025.

      3 Onverminderd [artikel 2.19, vierde en vijfde lid][ref4], gaat de aanvraag tot subsidievaststelling vergezeld van:

      a. een factuur en een betaalbewijs van alle kosten bedoeld in [bijlage 3, onderdelen 1 tot en met 4][ref5];

      b. documenten met daarin informatie per melkveehouderijbedrijf over de jaarlijkse totale dierexcretie per bedrijf
      en een intekening op de beschikbaar gestelde digitale omgevingskaart waaruit blijkt dat het gehele bedrijf voor
      meer dan 50% ligt binnen overgangsgebied N2000.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel2.9
      [ref2]: https://wetten.overheid.nl/BWBR0045685
      [ref3]: https://wetten.overheid.nl/BWBR0045685#Artikel2.18
      [ref4]: https://wetten.overheid.nl/BWBR0045685#Artikel2.19
      [ref5]: https://wetten.overheid.nl/BWBR0045685
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.8.4.9
