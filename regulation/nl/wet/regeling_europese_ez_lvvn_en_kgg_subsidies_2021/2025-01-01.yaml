  - number: 5.3.77
    text: |-
      1 Uitgaven voor investeringen in apparatuur en andere benodigdheden voor het gebruik van reststromen, zoals CO-,
      aardwarmte- en restwarmtenetwerken en biogas, op teeltbedrijven zijn subsidiabel.

      2 Subsidiabel zijn:

      a. installaties, waaronder interconnectoren en transportpijplijnen, benodigd voor het gebruik van energie en CO uit
      reststromen van derden;

      b. kosten die verband houden met het aansluiten van het lid, de producentenorganisatie of dochteronderneming op de
      bron van de leverancier; en

      c. in het geval van CO, ook de kosten in verband met voorzieningen voor de (tijdelijke) opslag van CO op het
      teeltbedrijf.

      3 Niet subsidiabel zijn de uitgaven:

      a. voor voorzieningen voor de distributie en regulering van warmte en CO in de kas; en

      b. die verband houden met een vergistingsinstallatie op het bedrijf en biobranders voor de productie van restwarmte
      en biobrandstoffen.

      4 De producentenorganisatie overlegt bij de aanvraag tot subsidievaststelling aan de minister voor de uitgaven,
      bedoeld in het eerste lid, het leveringscontract tussen de producentenorganisatie, haar dochteronderneming of het
      lid en de leverancier.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.77
  - number: 5.3.78
    text: |-
      1 Uitgaven voor investeringen in het kader van verbetering van energie-efficiëntie door toepassing van
      energiebesparende technieken zijn subsidiabel.

      2 Subsidiabel zijn:

      a. apparatuur voor energieopslag en -uitwisselingssystemen, zoals energiebesparende warmtepompen, warmtewisselaars,
      waterhoudende grondlagen voor warmte- en koudebuffering en aquathermie;

      b. apparatuur voor gesloten en semi-gesloten kassystemen, zoals energiebesparende ventilatie-, luchtbehandeling- en
      hogedrukvernevelingssystemen, energiebesparende tweede schermen en innovatieve energiebesparende en isolerende dak-
      en gevelsystemen zoals airmix ventilatoren;

      c. apparatuur voor het energiezuinig drogen en opslaan van producten zoals CO-propaankoeling; en

      d. andere energie-efficiënte apparatuur, die voldoet aan de voorschriften in
      [titel 2.3 van de Regeling nationale EZK- en LNV-subsidies][ref1].

      3 In het geval van gesloten en semi-gesloten kassystemen zijn de volgende kassystemen in het kader van een
      totaalconcept subsidiabel:

      a. buitenluchtaanzuiging in combinatie met een tweede beweegbaar energiescherm;

      b. energiebesparend ventilatiesysteem met warmteterugwinning of voorverwarming;

      c. luchtbehandelingssystemen ter ontvochtiging van lucht (ontvochtingsinstallaties);

      d. hogedrukvernevelingsysteem met een adiabatische koeling waarbij de druppelgrootte 5 tot maximaal 15 micron
      bedraagt;

      e. gevelschermen die een energiebesparing realiseren van ten minste 40% wanneer het scherm gesloten is;

      f. warmte-uitwisselingsysteem;

      g. warmtepomp;

      h. waterhoudende lagen voor warmte- en koudebuffering; en

      i. tweede energiescherm, dat een energiebesparing van ten minste 45% oplevert wanneer het scherm gesloten is.

      4 In het geval van energiebesparende en isolerende dak- en gevelsystemen voor nieuwe kassen zijn de volgende
      voorwaarden van toepassing:

      a. het materiaal is van dubbelglas en licht doorlatend (diffuus gecoat); of

      b. het materiaal is dubbel gelaagd met een combinatie van glas en hoge kwaliteitsfilm en doorschijnend (diffuus
      gecoat); en

      c. In het geval van dubbele beglazing, alleen de aanvullende uitgaven die verband houden met dubbele beglazing ten
      opzichte van enkele beglazing subsidiabel.

      5 In het geval van energiebesparende en isolerende dak- en gevelsystemen voor bestaande kassen zijn de volgende
      voorwaarden van toepassing:

      a. het materiaal heeft betere doorschijnende eigenschappen dan enkele beglazing en is doorschijnend;

      b. het systeem bestaat uit plastic panelen, dubbelglas panelen of dubbel fluorpolymeer (EFTE) film met een
      optionele overdrukventilatie ventilator om folies van elkaar te scheiden en de isolatie te verbeteren;

      c. het systeem bestaat uit isolatiemateriaal waarbij de som van de warmteweerstand van de lagen (R=∑(Rm)=∑d/λ)
      toeneemt met ten minste 1,50 m2K/W in vergelijking met de oude situatie; en

      d. alleen de aanvullende uitgaven voor de geïsoleerde oppervlakte zijn subsidiabel.

      6 In het geval van energie efficiënte droog- en opslagmethoden, zijn de volgende voorwaarden van toepassing:

      a. de apparatuur is bedoeld voor de korte en lange termijn bewaring van producten; en

      b. de uitgaven voor meet- en controleapparatuur zijn subsidiabel.

      7 De volgende investeringen zijn niet subsidiabel:

      a. warmte buffer boiler tank;

      b. warmte buffer tank;

      c. eerste energieschermen;

      d. verduisteringsschermen;

      e. zonwerende materialen;

      f. rookgas afvoer en bijbehorende meetapparatuur;

      g. de vervanging van een tweede scherm;

      h. aanpassingen aan de kas die noodzakelijk zijn om de investering, bedoeld in het eerste lid, te realiseren.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
