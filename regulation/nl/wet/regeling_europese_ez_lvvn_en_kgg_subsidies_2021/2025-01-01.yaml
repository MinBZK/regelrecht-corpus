  - number: 5.5.8
    text: |-
      1 De betaling van de subsidie, bedoeld in [artikel 5.5.2.][ref1], geschiedt overeenkomstig
      [artikel 4:89, vierde lid, van de Algemene wet bestuursrecht][ref2] en overeenkomstig een door de landbouwer
      daartoe verstrekte volmacht als bedoeld in [titel 3 van Boek 3 van het Burgerlijk Wetboek][ref3], aan de
      verzekeraar met wie de landbouwer de brede weersverzekering heeft gesloten.

      2 Bij gebreke van een volmacht als bedoeld in het eerste lid vindt betaling plaats door bijschrijving op een door
      de landbouwer opgegeven bankrekening.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel5.5.2
