  - number: 3.4.9
    text: |-
      Indien de aanvraag om subsidievaststelling wordt ingediend door een aquacultuuronderneming, een
      aquacultuurorganisatie of een samenwerkingsverband waaraan geen kennisinstelling deelneemt, bevat de aanvraag
      tot subsidievaststelling onverminderd de [artikelen 2.19][ref1] en [3.1.6][ref2] een verklaring van de
      kennisinstelling, bedoeld in [artikel 3.4.8, onderdeel b][ref3], dat zij de in dat onderdeel bedoelde rol heeft
