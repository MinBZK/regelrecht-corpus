    text: |-
      Uitgaven van voedingsclaims, zoals het vermelden van gezondheidswaarden van groenten en fruit producten om de afzet
      te bevorderen, zijn subsidiabel indien het gaat om:

      a. kosten met betrekking tot onderzoek voor de onderbouwing van de voedingsclaim en de vastlegging; of

