    text: |-
      1 De kennisinstelling, onderzoeksorganisatie of instelling in het groen beroepsonderwijs houdt ter onderbouwing
      van de gewerkte uren, bedoeld in artikel 23, eerste lid, derde alinea, van [verordening 2022/126](32026R2022), een
      volledige urenadministratie bij.

      2 Op verzoek van de Minister overlegt de kennisinstelling, onderzoeksorganisatie of instelling in het groen
      beroepsonderwijs de urenregistratie en de urenadministratie.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.4.5a
  - number: 5.4.6
    text: |-
      1 Uitgaven voor kilometers gereden met de eigen auto door medewerkers van de begunstigde zijn subsidiabel indien:

      a. de kilometers zijn gemaakt in het kader van een in project opgenomen activiteit;

      b. de vergoedingen daadwerkelijk aan de medewerker zijn uitbetaald; en

      c. de vergoeding maximaal € 0,21 per kilometer bedraagt.

      2 Uitgaven voor vliegtickets voor buitenlandse dienstreizen, plaatsbewijzen voor het openbaar vervoer en tickets
      voor veerboten zijn subsidiabel op basis van de economy class prijzen van deze tickets of plaatsbewijzen.

      3 Begunstigden kunnen voor uitgaven voor verblijfkosten voor dienstreizen en excursies in binnenland en in EU-
      lidstaten door medewerkers vergoedingen declareren voor de daadwerkelijk gemaakte kosten binnen de maxima van
      hoofdstuk 10 van de CAO-Rijk.

      4 Kosten voor auto’s in eigendom van of geleased dan wel gehuurd door de begunstigde zijn niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.4.6
