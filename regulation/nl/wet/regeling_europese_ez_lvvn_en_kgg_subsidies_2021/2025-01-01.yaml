        hoofdstuk: '2'
  - number: 3.6.10
    text: |-
      Onverminderd de [artikelen 2.9][ref1] en [3.1.4][ref2] gaat een aanvraag tot subsidieverlening vergezeld van de
      volgende gegevens:

      a. indien de aanvraag wordt ingediend door een visserijorganisatie, aquacultuurorganisatie, brancheorganisatie,
      een vereniging als bedoeld in [artikel 3.6.2, tweede lid, onderdeel d][ref3], of een samenwerkingsverband waarin
      een visserijorganisatie of aquacultuurorganisatie, brancheorganisatie of een vereniging deelneemt: een kopie van de
      statuten van de visserijorganisatie, aquacultuurorganisatie, brancheorganisatie of vereniging;

      b. gegevens waaruit blijkt dat een onderneming als bedoeld in [artikel 3.6.2, tweede lid, onderdeel a of e][ref4],
      mkb is;

      c. indien de aanvraag wordt ingediend voor een project waarvoor een of meer vissersvaartuigen wordt of worden
      ingezet, voor elk vissersvaartuig het nummer waaronder het geregistreerd staat in het register, bedoeld in
      [artikel 4 van het Besluit registratie vissersvaartuigen 1998][ref5].


