  - number: 5.8.2.1
    text: |-
      1 De Minister verstrekt op aanvraag subsidie voor het oprichten van een nieuw samenwerkingsverband en het opstellen
      van een nieuw gebiedsplan in veenweidegebieden of in overgangsgebieden N2000 ten minste gericht op reductie van CO-
      emissie in veenweidegebieden of reductie van ammoniakemissie in overgangsgebieden N2000 of veenweidegebieden. De
      subsidie wordt verstrekt aan de penvoerder van het samenwerkingsverband in oprichting.

      2 Voor zover aan het samenwerkingsverband anderen dan landbouwers deelnemen en de subsidie niet hoofdzakelijk
      ten goede komt aan de landbouwsector bevat de subsidie, bedoeld in het eerste lid, staatssteun en wordt zij
      gerechtvaardigd door artikel 59 van de landbouwvrijstellingsverordening.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.8.2.1
  - number: 5.8.2.2
    text: |-
      1 De hoogte van de subsidie bedraagt ten minste € 25.000 en ten hoogste € 40.000.

      2 De subsidie bedraagt 100% van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.8.2.2
  - number: 5.8.2.3
    text: |-
      1 Voor subsidie komen in aanmerking:

      a) kosten van studies van het betrokken gebied en kosten van haalbaarheidsstudies;

      b) kosten voor het werven van deelnemers;

      c) kosten voor het netwerken om het gebiedsplan goed te definiëren;

      d) kosten voor het opstellen van een gebiedsplan of een samenwerkingsovereenkomst;

      e) kosten voor projectmanagement of projectadministratie.

      2 Voor subsidie komen niet in aanmerking: kosten voor vrijwilligers.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.8.2.3
  - number: 5.8.2.4
    text: De Minister verdeelt het subsidieplafond op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.8.2.4
  - number: 5.8.2.5
    text: |-
      1 Met de uitvoering van het project wordt uiterlijk binnen twee maanden na de subsidieverlening gestart.

      2 Het project is uiterlijk twee jaar na de subsidieverlening afgerond.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.8.2.5
  - number: 5.8.2.6
    text: |-
      Onverminderd [artikel 2.11][ref1] beslist de Minister afwijzend op een aanvraag voor subsidieverlening indien:

      a. er geen sprake is van een nieuwe samenwerkingsvorm of het verrichten van nieuwe activiteiten door een bestaande
      samenwerkingsvorm;

      b. de ligging van het gebied waarop het beoogde samenwerkingsverband of gebiedsplan zich richt voor meer dan 50% is
      gelegen buiten een veenweidegebied of overgangsgebied N2000;

      c. het beoogde gebied waar het plan betrekking op heeft een oppervlakte betreft van minder dan 200 hectare;

      d. aan een aanvraag minder dan 21 punten zijn toegekend;

      e. een deelnemer aan het samenwerkingsverband, niet zijnde een landbouwer, een onderneming is die geen kleine,
      middelgrote of micro-onderneming is als bedoeld in artikel 1, onderdeel a, van de landbouwvrijstellingsverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel2.11
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.8.2.6
