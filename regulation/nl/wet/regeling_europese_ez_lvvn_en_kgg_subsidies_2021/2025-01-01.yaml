  - number: '1.6'
    text: |-
      De bevoegde autoriteit stelt beleidsregels vast voor de toepassing van financiële correcties als bedoeld in artikel
      103, eerste lid, van [verordening 2021/1060](32960R2021) of artikel 57 van [verordening 2021/2116](32116R2021)
      en voor het opleggen van sancties als bedoeld in artikel 59, eerste lid, onderdeel d, van [verordening 2021/2116]
      (32116R2021).
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel1.6
  - number: '1.7'
    text: |-
      De subsidieontvanger, of in geval van een samenwerkingsverband de penvoerder, doet onverwijld schriftelijk
      mededeling aan de beheerautoriteit van de indiening bij de rechtbank van een verzoek tot het op de
      subsidieontvanger, of in geval van een samenwerkingsverband op een deelnemer aan het samenwerkingsverband,
      van toepassing verklaren van de schuldsaneringsregeling natuurlijke personen, of tot verlening van surseance
      van betaling aan de subsidieontvanger, of in geval van een samenwerkingsverband aan een deelnemer in het
      samenwerkingsverband, of tot faillietverklaring van de subsidieontvanger, of in geval van een samenwerkingsverband
      van een deelnemer in het samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel1.7
  - number: '1.8'
    text: |-
      1 Indien subsidie wordt verstrekt voor een activiteit als bedoeld in artikel 65, eerste lid, van
      [verordening 2021/1060](32960R2021), wordt de beschikking tot subsidievaststelling onverminderd
      [artikel 4:49 van de Algemene wet bestuursrecht][ref1] ingetrokken of ten nadele van de subsidieontvanger gewijzigd
      indien binnen vijf jaar te rekenen vanaf de datum van de laatste betaling aan de begunstigde, of in voorkomend
      geval binnen een in de voorschriften betreffende staatssteun gestelde termijn, een van de volgende gebeurtenissen
      op de activiteit van toepassing is:

      a. beëindiging of verplaatsing van een productiecapaciteit als bedoeld in artikel 65, eerste lid, onderdeel a, van
      [verordening 2021/1060](32960R2021);

      b. eigendomsoverdracht van een infrastructuurvoorziening waardoor een onderneming of een overheidsinstantie een
      onrechtmatig voordeel behaalt als bedoeld in artikel 65, eerste lid, onderdeel b, van [verordening 2021/1060]
      (32960R2021); of

      c. een substantiële verandering in de aard, de doelstellingen of de uitvoeringsvoorwaarden van de activiteit
      waardoor de oorspronkelijke doelstellingen dreigen te worden ondermijnd als bedoeld in artikel 65, eerste lid,
      onderdeel c, van [verordening 2021/1060](32960R2021).

      2 Het eerste lid is van overeenkomstige toepassing op een activiteit als bedoeld in artikel 65, tweede lid, van
      [verordening 2021/1060](32960R2021) die is onderworpen aan een verplichting tot behoud van de investering krachtens
      de op die investering van toepassing zijnde voorschriften betreffende staatssteun.

      3 De in het eerste lid vastgestelde termijn van vijf jaar wordt in geval van het behoud van investeringen of van
      door het mkb gecreëerde werkgelegenheid, verkort tot drie jaar.

      4 Dit artikel is van overeenkomstige toepassing op subsidie verstrekt op grond van [verordening 2021/2115]
      (32115R2021), voor zover het investeringen in infrastructuur of productieve investeringen betreft.


