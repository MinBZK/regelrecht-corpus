  - number: 5.1.11
    text: |-
      1 In dit hoofdstuk kan worden bepaald dat de regels inzake een subsidie lager dan € 25.000 van toepassing zijn op
      een subsidie van € 25.000 of meer of dat de regels inzake een subsidie van € 25.000 tot € 125.000 van toepassing
      zijn op subsidies van € 125.000 of meer.

      2 In dit hoofdstuk kan worden bepaald dat de regels inzake een subsidie van € 25.000 of meer van toepassing zijn op
      een subsidie lager dan € 25.000 of dat de regels inzake een subsidie van € 125.000 of meer van toepassing zijn op
      subsidies van € 25.000 tot € 125.000.
