      1 Uitgaven van de producentenorganisatie ten behoeve van fytosanitaire maatregelen zijn subsidiabel indien het gaat
      om investeringen zoals:

      a. aanschaf van plastic pallets ten behoeve van het tegengaan van de verspreiding van organismen die plantenziekten
      kunnen veroorzaken;

      b. traps;

      c. toegangspoorten;

      d. hygiënestations en -sluizen; of

      e. insectengaas.

      2 Uitgaven zijn niet subsidiabel indien het gaat om investeringen:

      a. in reinigingsinstallaties die niet primair gericht zijn op fytosanitaire doelen;

      b. in fustwasinstallaties die niet primair gericht zijn op fytosanitaire doelen;

      c. in installaties en apparatuur voor conditionering van champignon- en witloftrekcellen;

      d. in voorzieningen voor gekoeld of geconditioneerd transport op het teeltbedrijf;

      e. in droogsystemen voor aanzuiging van buitenlucht voor knoflook;

      f. in vogel- en wildafweer; of

      g. investeringen die de producentenorganisatie doet om te voldoen aan de voorwaarden vankwaliteitskeurmerken,
      tenzij bedoeld voor overgang van gangbaar naar biologische teelt.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.131
