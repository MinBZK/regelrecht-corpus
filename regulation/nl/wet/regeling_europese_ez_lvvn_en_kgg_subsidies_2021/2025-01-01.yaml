  - number: 5.3.7
    text: |-
      De activiteiten die zijn opgenomen in [paragraaf 2 tot en met paragraaf 12 van afdeling 5.3.2][ref1] kunnen worden
      ingezet in het kader van projecten ter realisatie van de sectorale doelstellingen.


