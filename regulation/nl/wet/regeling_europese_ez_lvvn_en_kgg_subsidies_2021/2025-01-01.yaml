    text: |-
      Onverminderd de [artikelen 2.9][ref1] en [3.1.4][ref2], gaat een aanvraag tot subsidieverlening vergezeld van de
      volgende gegevens:

      a. een investeringsplan met daarin een beschrijving van de investering;

      b. een begroting van de kosten voor aankoop, bouw en plaatsing van die installatie, en indien van toepassing, de
      kosten voor aanpassingen aan een vissersvaartuig;

      c. gegevens waarmee de subsidieaanvrager kan aantonen dat de aanvrager mkb is; en

      d. een onderbouwing van de kosten voor aankoop, bouw en plaatsing van de mosselzaadinvanginstallatie, en indien de
      aanvraag betrekking heeft op subsidie voor de kosten als bedoeld in [artikel 3.2.4, aanhef en onderdeel b][ref3],
      een onderbouwing van de kosten voor het aanpassen van een vissersvaartuig.


