  - number: 5.3.143
    text: |-
      Uitgaven van voedingsclaims, zoals het vermelden van gezondheidswaarden van groenten en fruit producten om de afzet
      te bevorderen, zijn subsidiabel indien het gaat om:

      a. kosten met betrekking tot onderzoek voor de onderbouwing van de voedingsclaim en de vastlegging; of

      b. indien van toepassing, certificeringskosten.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.143
  - number: 5.3.144
    text: |-
      1 Uitgaven voor deelname aan certificeringssystemen om een keurmerk te verkrijgen zijn subsidiabel indien:

      a. het certificeringssysteem bindende voorwaarden omvat met betrekking tot productiemethoden;

      b. de naleving van de voorwaarden, bedoeld in onderdeel a, het onderwerp zijn van een onafhankelijke controle door
      gekwalificeerde personen of organen; en

      c. het gaat om de volgende uitgaven voor:

      1°. advies, audits, certificering en lidmaatschapskosten;

      2°. personeelskosten in verband met de certificeringssystemen;

      3°. het ontwikkelen van materialen voor certificeringssystemen; en

      4°. de kosten van ontwikkeling en verbeteren van ICT-systemen en registratiemodules met betrekking tot
      certificeringssystemen.

      2 Subsidiabel zijn:

      a. Nationale en internationale algemene certificeringssystemen en specifieke certificeringssystemen (zoals van de
      producentenorganisatie zelf of van retailers) op het gebied van kwaliteit en voedselveiligheid;

      b. biologische certificeringssystemen; en

      c. certificeringssystemen op het gebied van duurzaamheid en Maatschappelijk Verantwoord Ondernemen (MVO).

      3 Voor biologische certificeringssystemen, als bedoeld in het tweede lid, onderdeel b, zijn subsidiabel uitgaven
      voor:

      a. biologische certificeringssystemen in de EU gebaseerd op [verordening 2018/848](32748R2018) inzake de
      biologische productie en de etikettering van biologische producten, waaronder Skal;

      b. uitgaven voor op grond van [Verordening 2018/848](32748R2018) als equivalent erkende biologische
      certificeringssystemen in derde landen; en

      c. lidmaatschapskosten van Skal.

      4 Niet subsidiabel zijn:

      a. uitgaven voor certificering van groenlabelkassen; en

      b. de aanschaf van materialen.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.144
  - number: 5.3.145
    text: |-
      1 Uitgaven van de producentenorganisatie voor activiteiten ten behoeve van het optimaliseren van de
      productkwaliteit in de keten zijn subsidiabel, inclusief personeelskosten, indien het gaat om uitgaven voor:

      a. het verhogen van de houdbaarheid van de producten;

      b. voedselveiligheid, met name residumonitoring, inclusief bladmonsters in het kader van keurmerken als bedoeld
      in [artikel 5.3.144, tweede lid][ref1] en productmonsters, watermonsters voor microbiologisch onderzoek en
      fytosanitaire controles;

      c. kwaliteitszorgsystemen, indien het gaat om:

      1°. uitgaven voor de inhuur van gekwalificeerde externe diensten bestemd voor begeleiding en audits van
      kwaliteitszorgsystemen;

      2°. uitgaven voor de inhuur van gekwalificeerde externe diensten bestemd voor productcontroles;

      3°. uitgaven voor certificering; of

      4°. lidmaatschapskosten;

      d. het verhogen van de fysieke productkwaliteit;

      e. het vergroten van de duurzaamheid van het product en van het productieproces;

      f. het ontwikkelen en verbeteren van ICT en registratiemodules; of

      g. software van conditioneringssystemen ten behoeve van lange of korte bewaring van producten waarbij
      productieplanning het doel is.

      2 Niet subsidiabel zijn uitgaven voor:

      a. certificering van meet- en weegapparatuur

      b. aanschaf van bedrijfskleding;

      c. materialen voor certificeringssystemen;

      d. het schoonmaken van bedrijfsruimten;

      e. aanschaf van Global Location Number (GLN) codes in het kader van GlobalGAP;

      f. investeringen als bedoeld in het eerste lid, voor zover deze normale landbouwpraktijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel5.3.144
