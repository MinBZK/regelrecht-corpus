  - number: 5.5.5
    text: De minister verdeelt het subsidieplafond evenredig over de ingediende aanvragen.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.5.5
  - number: 5.5.6
    text: |-
      De minister beslist op een aanvraag als bedoeld in [artikel 5.5.2., eerste lid][ref1], uiterlijk op 15 mei volgend
      op het jaar van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel5.5.2
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.5.6
    references:
      - id: ref1
        bwb_id: BWBR0045685
        artikel: 5.5.2
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 5.5.7
    text: |-
      De landbouwer verstrekt de volgende gegevens aan de minister:

      a. het polisnummer van de brede weersverzekering;

      b. de naam van de verzekeraar met wie de brede weersverzekering is afgesloten en een kopie van de
      verzekeringspolis;

      c. een bewijs van betaling van het deel van de premie, bedoeld in [artikel 5.5.3., vierde lid, onderdeel c][ref1];

      d. toestemming aan de minister om perceelsgegevens uit te wisselen met de verzekeraar ten behoeve van de controle
      op de naleving van deze regeling;

      e. gegevens waaruit blijkt dat de landbouwer is ingeschreven in het handelsregister, bedoeld in
      [artikel 2 van de Handelsregisterwet 2007][ref2], en

      f. een verklaring dat de landbouwer zich niet meer dan één keer verzekert voor dezelfde schade.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel5.5.3
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel2
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.5.7
