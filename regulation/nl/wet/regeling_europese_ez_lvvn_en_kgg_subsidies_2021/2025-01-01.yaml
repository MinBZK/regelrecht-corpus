    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel3.2.12
  - number: 3.3.1
    text: |-
      In deze paragraaf wordt verstaan onder:

        - *CE-markering:* markering als bedoeld in besluit nr. 768/2008/EG van de het Europees Parlement en de Raad van
      de Europese Unie van 9 juli 2008 betreffende een gemeenschappelijk kader voor het verhandelen van producten en tot
      intrekking van Besluit 93/465/Eeg van de Raad (PbEU L 218/82);
        - *CFR-nummer:* CFR (common fleet register)-nummer als bedoeld in artikel 2, onderdeel l, van
      [Uitvoeringsverordening (EU) 2017/218](32118R2017) van de Commissie van 6 februari 2017 inzake het
      vissersvlootregister van de Unie (PbEU 2017, L 34);
        - *SCR-katalysator:* nabehandelingssysteem voor selectieve katalytische reductie.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel3.3.1
  - number: 3.3.2
    text: |-
      1 De Minister verstrekt op aanvraag subsidie aan een visserijonderneming voor de volgende activiteiten:

      a. de aankoop en installatie van een SCR-katalysator voor een vissersvaartuig ten behoeve van de reeds ingebouwde
      motor, voor zover dit leidt tot een vermindering van de uitstoot van stikstofoxiden met ten minste 60 procent van
      de norm die wordt gesteld aan een motor met vergelijkbaar vermogen met een type goedkeuring CCR2;

      b. het laten opstellen van een rapport door een erkend meetbedrijf of een gecertificeerd meetbedrijf waarin de
      meetresultaten van emissies van de motor na uitvoering van de in onderdeel a, bedoelde maatregelen in de praktijk
      zijn weergegeven, voorafgaand aan de aanvraag tot subsidievaststelling. De metingen worden uitgevoerd conform de
      norm ISO 8178, testcyclus E3 of D2.

      2 Per vissersvaartuig kan één aanvraag worden ingediend.

      3 Subsidie kan slechts worden aangevraagd door een visserijonderneming die op het moment van indiening van de
      aanvraag een vissersvaartuig in eigendom heeft.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel3.3.2
  - number: 3.3.3
    text: De subsidie bedraagt 50 procent van de subsidiabele kosten, tot een maximum van € 51.000 per vissersvaartuig.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel3.3.3
  - number: 3.3.4
    text: |-
