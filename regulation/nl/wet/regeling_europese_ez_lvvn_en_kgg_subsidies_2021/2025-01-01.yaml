  - number: 5.6.6
    text: |-
      1 Onverminderd [artikel 2.11][ref1] beslist de minister afwijzend op een aanvraag voor subsidieverlening indien:

      a. het project niet nieuw is voor een deelnemer aan een operationele groep als bedoeld in
      [artikel 5.6.2, eerste lid][ref2];

      b. aan een aanvraag minder dan 30 punten zijn toegekend op grond van [artikel 5.6.8][ref3];

      c. met de uitvoering van het project, niet zijnde de uitvoering van voorbereidingsactiviteiten, bedoeld in
      [artikel 5.6.3, eerste lid, onderdeel a][ref4], is gestart voordat de aanvraag om subsidie is ingediend.

      2 Onverminderd het eerste lid, beslist de minister afwijzend op een aanvraag voor subsidieverlening van een project
      dat gericht is op de categorie, bedoeld in [artikel 5.6.2, zesde lid, onderdeel b][ref5], indien:

      a. een varkenshouder die produceert volgens de biologische productiewijze of een varkenshouder die in het jaar
      voorafgaand aan het tijdstip van aanvraag varkens met hele staarten op de markt heeft gebracht, deelneemt aan de
      operationele groep, bedoeld in [artikel 5.6.2, tweede lid][ref6];

      b. niet is gebleken dat passende maatregelen zijn getroffen ter voorkoming van staartbijten en andere
      gedragsstoornissen, als bedoeld in [artikel 2.3, onderdeel b, onder 3, van het Besluit diergeneeskundigen][ref7];

      c. het project start met minder dan vijf tomen biggen per deelnemer aan de operationele groep die biggen houdt.


