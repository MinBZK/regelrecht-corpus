    text: |-
      In het kader van uitgaven voor educatieve bijeenkomsten zijn uitsluitend subsidiabel:

      a. de door de organisatie van de educatieve bijeenkomst in rekening gebrachte kosten voor deelname van leden,
      medewerkers van leden en medewerkers van de producentenorganisatie of dochterondernemingen; en

      b. de kosten van inhuur van externe deskundigen.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.165
  - number: 5.3.166
    text: |-
      De activiteiten die zijn opgenomen in deze paragraaf kunnen worden ingezet in het kader van projecten ter
      realisatie van de sectorale doelstelling verhoging van de consumptie van producten van de sector groenten en fruit,
      bedoeld in artikel 46, aanhef en onderdeel i, van [verordening 2021/2115](32115R2021).
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.166
  - number: 5.3.167
    text: |-
      1 Uitgaven van de producentenorganisatie ten behoeve van generieke afzetbevordering, inclusief personeelskosten
      en voorlichtingsacties gericht op het verhogen van bewustzijn van de voordelen van de consumptie van groenten en
      fruit, zijn subsidiabel indien het gaat om uitgaven voor:

      a. generieke promotie op consumentenbeurzen;

      b. generieke promotie tijdens publieksevenementen;

      c. generieke promotie in het kader van duurzaam telen;

      d. generieke promotie gericht op doelgroepen;

      e. sectorpromotie en PR-campagnes;

      f. het opzetten of verbeteren van websites en sociale media, indien het gaat om:

      1°. het registreren van een domeinnaam;

      2°. het bouwen van een website;

      3°. het uitbreiden van een bestaande website met aantoonbaar nieuwe elementen; en

      4°. het laten verzorgen van content door een professionele externe organisatie.

      2 Niet subsidiabel zijn uitgaven voor:

      a. activiteiten op het gebied van verkoop van producten;

      b. activiteiten op het gebied van gezamenlijke verkoopbevordering waarvan de kosten mede worden gedragen door een
      afnemer;

      c. de kosten van producten in het geval van het gratis verstrekken van product;

      d. abonnementen bij providers, hosting van serverruimte, communicatie met het web;

      e. uitgaven voor sponsoring; en

      f. uitgaven, waaronder personeelskosten, die worden gemaakt ten behoeve van de aanvraag voor goedkeuring en
      uitvoering van promotieprogramma’s in het kader van [verordening 1144/2014](32014R1144).

      3 De producentenorganisatie voorziet afzetbevorderingsmateriaal van het embleem van de Unie en van de vermelding
      ‘Gefinancierd door de Europese Unie’, bedoeld in artikel 14, tweede lid, van [verordening 2022/126](32026R2022).
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.167
  - number: 5.3.168
    text: |-
      1 Uitgaven van de producentenorganisatie, inclusief personeelskosten, ten behoeve van marketing en
      verkoopbevordering van merken en handelsnamen van de producentenorganisatie, dochterondernemingen zijn subsidiabel
      indien het gaat om uitgaven voor:

      a. promotie van merken of handelsnamen op consumentenbeurzen;

      b. promotie van merken of handelsnamen op publieksevenementen;

      c. promotie van merken of handelsnamen in het kader van duurzaam telen;

      d. promotie van merken of handelsnamen gericht op doelgroepen;

      e. sectorpromotie en PR-campagnes;

      f. het opzetten of verbeteren van websites en sociale media, indien het gaat om:

      1°. het registreren van een domeinnaam;

      2°. het bouwen van een website;

      3°. het uitbreiden van een bestaande website met aantoonbaar nieuwe elementen; en

      4°. het laten verzorgen van content door een professionele externe organisatie.

      g. het opstellen en uitvoeren van plannen voor accountmanagement of categorymanagement; of

      h. het laten uitvoeren van onderzoek op het gebied van afzetbeleid, voor zover niet gericht op de interne
      organisatie van de producentenorganisatie.

      2 Niet subsidiabel zijn uitgaven voor:

      a. de aankoop van een merk;

      b. activiteiten ten behoeve van een merk waarvan de licentie gehuurd of geleased is;

      c. activiteiten op het gebied van verkoop van producten;

      d. uitgaven voor gezamenlijke verkoopbevordering, waarvan de kosten mede worden gedragen door een afnemer;

      e. de kosten van producten in het geval van het gratis verstrekken van product;

      f. abonnementen bij providers, hosting van serverruimte, communicatie met het web, het updaten van bestaande
      websites, personeelskosten ten behoeve van berichtgeving in het kader van social media;

      g. uitgaven voor sponsoring; en

      h. PR-activiteiten richting potentiële leden van een producentenorganisatie.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.168
  - number: 5.3.169
    text: |-
      1 Uitgaven van de producentenorganisatie voor reclameactiviteiten en reclameartikelen voor producten waarvoor de
      producentenorganisatie is erkend, inclusief personeelskosten, zijn subsidiabel als het gaat om uitgaven voor:

      a. advertenties in magazines of kranten;

      b. promotie in een blad of magazine van supermarkten, indien:

      1°. in het blad of magazine duidelijk vermeld is dat de producentenorganisatie de afzender is; en

      2°. er geen logo of verwijzing naar de supermarkt in de advertentie is opgenomen;

      c. ontwikkelingskosten van de lay-out en extra kosten van reclamedrukwerk op verpakkingen of etiketten,
      steekkaarten of wikkels voor zover gebruikt bij tijdelijke acties;

      d. toonbankdisplays, flyers of folders, gadgets, belettering, aangekochte producten voor standaankleding;

      e. billboards, radioreclame, tv-reclame, banners op websites;

      f. kookdemonstraties;

      g. bedrijfsrondleidingen, gericht op afnemers of potentiële afnemers, bij een producentenorganisatie of lid van de
      producentenorganisatie, een open dag, opening of jubileum, met uitzondering van verstrekte consumpties; of

      h. deelname aan beurzen, indien deze beurzen gericht zijn op afnemers van de producentenorganisatie, met
      uitzondering van verstrekte consumpties.

      2 Reclameacties en reclameartikelen waarvan de kosten mede worden gedragen door een afnemer zijn niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.169
  - number: 5.3.170
    text: |-
      In het kader van uitgaven voor educatieve bijeenkomsten zijn uitsluitend subsidiabel:

      a. de door de organisatie van de educatieve bijeenkomst in rekening gebrachte kosten voor deelname van leden,
      medewerkers van leden en medewerkers van de producentenorganisatie of dochterondernemingen; en

      b. de kosten van inhuur van externe deskundigen.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.170
  - number: 5.3.171
    text: |-
      De activiteiten die zijn opgenomen in deze paragraaf kunnen worden ingezet in het kader van projecten ter
      realisatie van de sectorale doelstelling crisispreventie en risicobeheer, bedoeld in artikel 46, aanhef en
      onderdeel j, van [verordening 2021/2115](32115R2021).
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.171
  - number: 5.3.172
    text: |-
      1 Producentenorganisaties die een operationeel programma ten uitvoer leggen kunnen een onderling fonds als bedoeld
      in artikel 47, tweede lid, onderdeel a van [verordening 2021/2115](32115R2021) oprichten.

      2 De vulling van het onderlinge fonds is subsidiabel.

      3 De aanvulling van het onderlinge fonds uit het actiefonds na uitkering van vergoedingen aan een of meer leden is
      subsidiabel indien aan de volgende voorwaarden is voldaan:

      a. De vergoeding is uitgekeerd ter compensatie van:

      1°. een daling van het gemiddelde inkomen van het lid als gevolg van ongunstige marktomstandigheden met meer dan
      20%, waarbij het gemiddelde inkomen wordt berekend op basis van de waarde van de door het lid afgezette productie
      over de drie voorafgaande jaren; of

      2°. de stijging van de prijzen van grondstoffen met meer dan 20% over de drie voorafgaande jaren zonder dat deze
      prijsstijging heeft geleid tot een evenredige toename van de waarde van de afgezette productie van het lid;

      3°. een daling van het gemiddelde inkomen van het lid als gevolg van het rooien van gewas als gevolg van ziekten en
      plagen met meer dan 20%, waarbij het gemiddelde inkomen wordt berekend op basis van de waarde van de door het lid
      afgezette productie over de drie voorafgaande jaren; en

      b. de vergoeding heeft niet meer bedragen dan 70% van het inkomensverlies van het betreffende lid.

      4 De ongunstige marktomstandigheden, fytosanitaire noodzaak of stijging van de grondstofprijzen worden door de
      producentenorganisatie gemotiveerd en gedocumenteerd.

      5 Een onderling fonds wordt opgericht door middel van een notariële akte, waarin in ieder geval is bepaald:

      a. de gevallen waarin en de voorwaarden waaronder het onderlinge fonds in overeenstemming met artikel 47, tweede
      lid, onderdeel a) van [verordening 2115/2021](32021R2115) uitkeert;

      b. de wijze waarop het onderlinge fonds wordt beheerd, inclusief sancties bij niet naleving van de voorwaarden door
      de leden en terugbetaling uit het fonds na minimaal 5 jaren.

      c. de wijze waarop het onderlinge fonds wordt gevuld, en

      d. de wijze waarop uitkeringen plaats zullen vinden.

      6 Het voornemen tot het oprichten van het fonds en de ontwerp akte, bedoeld in het vijfde lid, worden door de
      algemene vergadering goedgekeurd.

      7 Indien de bijdragen aan of de uitkering uit het onderlinge fonds gedifferentieerd worden, wordt deze
      differentiatie in de notariële akte vastgelegd.

      8 Het vermogen van het onderlinge fonds wordt afgezonderd van overige financiële middelen van de
      producentenorganisatie. Hiertoe wordt in ieder geval een aparte bankrekening gebruikt.

      9 Uitgaven, inclusief personeelskosten, die gepaard gaan met het oprichten van het onderlinge fonds zijn
      subsidiabel binnen de voorwaarden en maxima uit artikel 15, tweede en derde lid, van [verordening 2022/126]
      (32026R2022) en hebben betrekking op het beheer van het fonds, waaronder uitgaven voor externe kosten zoals kosten
      voor de notaris, de accountant of de bank.

      10 Uitkering van vergoedingen als bedoeld in het derde lid is slechts mogelijk indien voor de betreffende
      ongunstige marktomstandigheden, fytosanitaire noodzaak of stijging van de prijzen van grondstoffen geen andere
      activiteiten uit de [artikelen 5.3.173 tot en met 5.3.184][ref1] worden ingezet.

      11 Over het beheer van het onderlinge fonds wordt een verklaring van een externe accountant verstrekt, volgens een
      door de minister vastgesteld format.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel5.3.173
