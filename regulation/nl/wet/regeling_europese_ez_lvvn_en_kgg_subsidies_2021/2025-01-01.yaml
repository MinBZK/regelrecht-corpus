        hoofdstuk: '2'
  - number: 3.4.8
    text: |-
      Onverminderd de [artikelen 2.9][ref1] en [3.1.4][ref2] gaat een aanvraag tot subsidieverlening vergezeld van de
      volgende gegevens:

      a. een verklaring van de subsidieaanvrager of van de penvoerder van het samenwerkingsverband, dat
      het project geen verband houdt met de kweek van genetisch gemodificeerde organismen als bedoeld in
      [artikel 1.1 van het Besluit genetisch gemodificeerde organismen milieubeheer 2013][ref3];

      b. indien de aanvraag om subsidie wordt ingediend door een aquacultuuronderneming, een aquacultuurorganisatie of
      een samenwerkingsverband waaraan geen kennisinstelling deelneemt:

      1°. een beschrijving waaruit blijkt hoe de actieve betrokkenheid van een kennisinstelling bij een project wordt
      geborgd;

      2°. een verklaring van de kennisinstelling waaruit blijkt dat deze bereid is om actief betrokken te zijn,
      overeenkomstig de beschrijving, bedoeld onder 1°, en om de resultaten van het project te valideren;

      c. indien de aanvraag wordt ingediend door een aquacultuurorganisatie of door een samenwerkingsverband waarin een
      aquacultuurorganisatie deelneemt, een kopie van de statuten van de aquacultuurorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel2.9
      [ref2]: https://wetten.overheid.nl/BWBR0045685#Artikel3.1.4
      [ref3]: https://wetten.overheid.nl/BWBR0035090#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel3.4.8
