      1 De minister stelt de door de lidstaten vast te stellen maximale subsidiebedragen, bedoeld in artikel 26, van
      [verordening 2022/126](32026R2022), vast.

      2 De minister stelt de door de lidstaten vast te stellen vervoerskosten, bedoeld in artikel 25 van [verordening
      2022/126](32026R2022), vast.
