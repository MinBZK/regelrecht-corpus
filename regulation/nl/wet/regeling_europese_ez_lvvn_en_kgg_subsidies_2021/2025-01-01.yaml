  - number: 5.8.3.12
    text: |-
      De Minister kan voor een beoordeling van de juistheid van de informatie die is verstrekt bij de indiening
      van aanvragen, wijzigingsverzoeken en betalingsverzoeken op grond van deze paragraaf gebruik maken van de
      daarvoor noodzakelijke gegevens die zijn opgenomen in voor de Minister beschikbare registraties op grond van de
      [Meststoffenwet][ref1], de [Wet dieren][ref2], de [Landbouwwet][ref3], [Verordening (EU) 2016/429](32016R0429)
      van het Europees Parlement en de Raad van 9 maart 2016 betreffende overdraagbare dierziekten en tot wijziging en
      intrekking van bepaalde handelingen op het gebied van diergezondheid (‘diergezondheidswetgeving’) (Pb EU 2016,
      L84) en Gedelegeerde [verordening (EU) 2019/2035](32019R2035) van de Commissie van 28 juni 2019 tot aanvulling van
      [Verordening (EU) 2016/429](32016R0429) van het Europees Parlement en de Raad wat betreft regels voor inrichtingen
      waar landdieren worden gehouden en broederijen, alsmede voor de traceerbaarheid van bepaalde gehouden landdieren en
      broedeieren (Pb EU 2019, L 314).


      [ref1]: https://wetten.overheid.nl/BWBR0004054
      [ref2]: https://wetten.overheid.nl/BWBR0030250
      [ref3]: https://wetten.overheid.nl/BWBR0002252
