  - number: 5.7.22
    text: De bedrijfsadviseur draagt de voucher over aan de in de aanvraag opgenomen kennisinstelling.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.7.22
  - number: 5.7.23
    text: |-
      Subsidie wordt verstrekt aan een kennisinstelling die een opleiding heeft verstrekt aan een bedrijfsadviseur en in
      verband daarmee een geldige voucher overlegt.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.7.23
  - number: 5.7.24
    text: De subsidie bedraagt ten hoogste 50% van de subsidiabele kosten en niet meer dan € 1.250,– per voucher.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.7.24
  - number: 5.7.25
    text: |-
      Voor subsidie komen in aanmerking:

      a. personeelskosten van de opleiders;

      b. rechtstreeks met het opleidingsproject verband houdende operationele kosten, met uitzondering van kosten voor de
      ontwikkeling van lesmateriaal ten behoeve van de kennisoverdracht.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.7.25
  - number: 5.7.26
    text: |-
      1 Een aanvraag voor subsidie wordt na afloop van de opleiding door de kennisinstelling ingediend.

      2 De aanvraag moet binnen een jaar na de dagtekening van de aan de bedrijfsadviseur verstrekte voucher zijn
      ontvangen.

      3 Op een voor het einde van de termijn, bedoeld in het tweede lid, daartoe ingediend verzoek kan de minister
      besluiten deze termijn eenmalig te verlengen met ten hoogste zes maanden.

      4 Indien de aanvraag niet binnen de termijn, bedoeld in het tweede lid, door de minister is ontvangen, vervalt de
      voucher van rechtswege.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.7.26
  - number: 5.7.27
    text: |-
      De subsidies, bedoeld in de [artikelen 5.7.19][ref1] en [5.7.23][ref2], bevatten staatssteun en worden
      gerechtvaardigd door artikel 31 van de algemene groepsvrijstellingsverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel5.7.19
      [ref2]: https://wetten.overheid.nl/BWBR0045685#Artikel5.7.23
