  - number: 5.2.47
    text: |-
      1 Het operationeel programma, de aanvraag tot subsidieverlening voor het volgende uitvoeringsjaar of wijzigingen
      voor de volgende jaren worden door de algemene vergadering van de producentenorganisatie goedgekeurd.

      2 Het operationeel programma, de aanvraag tot subsidieverlening voor het volgende uitvoeringsjaar of een wijziging
      voor de volgende jaren dat aan de algemene ledenvergadering ter goedkeuring is voorgelegd bevatten informatie over:

      a. de inhoud van de projecten door middel van een samenvatting;

      b. de bedragen per project;

      c. welke investeringen van € 150.000 en hoger op locatie van de producentenorganisatie of unie van
      producentenorganisaties of een dochteronderneming zijn voorgenomen;

      d. welke investeringen van € 100.000 en hoger op andere locaties zijn voorgenomen, onder vermelding van bij welk
      lid van de producentenorganisatie de investering is gedaan.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.47
  - number: 5.2.48
    text: |-
      1 De producentenorganisatie of unie van producentenorganisaties dient het operationele programma in met
      gebruikmaking van een door de minister beschikbaar gesteld middel.

      2 De producentenorganisatie of unie van producentenorganisaties dient het meerjarige operationeel programma in
      tussen 1 augustus en 1 oktober om 12:00 uur van het jaar dat voorafgaat aan het eerste uitvoeringsjaar van het
      operationeel programma.

      3 Een producentenorganisatie of unie van producentenorganisaties dient een aanvraag tot subsidieverlening jaarlijks
      in tussen 1 augustus en 1 oktober om 12:00 uur.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.48
  - number: 5.2.49
    text: |-
      1 Een wijziging van een operationeel programma voor de volgende jaren kan betrekking hebben op:

      a. een wijziging in de meerjarenbegroting voor de volgende uitvoeringsjaren van het operationeel programma;

      b. het toevoegen of laten vervallen van uitgavenposten voor activiteiten opgenomen in een goedgekeurd operationeel
      programma;

      c. het toevoegen van sectorale doelstellingen, projecten of activiteiten aan het operationele programma voor de
      volgende jaren;

      d. het laten vervallen van projecten of activiteiten in het operationele programma voor de volgende jaren;

      e. het jaarbedrag van het actiefonds;

      f. de looptijd van het operationele programma; of

      g. het wijzigen van het verwachte meetbare resultaat van een project ten aanzien van de sectorale doelstellingen,
      bedoeld in [artikel 5.2.45, eerste lid, onderdeel d][ref1], indien sprake is van een verbetering van het meetbare
      resultaat.

      2 Een verzoek tot wijziging als bedoeld in het eerste lid wordt tussen 1 augustus en 1 oktober om 12:00 uur
      ingediend met gebruikmaking van een door de minister beschikbaar gesteld middel.

      3 Op een wijziging als bedoeld in het eerste lid, onderdelen b en c, zijn de [artikelen 5.2.45][ref2] en
      [5.2.46 ][ref3]van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel5.2.45
      [ref2]: https://wetten.overheid.nl/BWBR0045685#Artikel5.2.45
      [ref3]: https://wetten.overheid.nl/BWBR0045685#Artikel5.2.46
