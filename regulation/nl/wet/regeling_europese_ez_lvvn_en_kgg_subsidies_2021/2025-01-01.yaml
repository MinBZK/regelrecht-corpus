    text: |-
      1 In afwijking van [artikel 2.12][ref1], geeft de minister een beschikking op een aanvraag tot subsidieverlening
      binnen 13 weken na indiening van de aanvraag.

      2 In afwijking van [artikel 2.21, eerste lid][ref2], geeft de Minister de beschikking tot subsidievaststelling
      binnen 22 weken na ontvangst van de aanvraag daartoe dan wel binnen 22 weken nadat de voor het indienen geldende
      termijn is verstreken.


