    text: |-
      1 In aanvulling op [artikel 2.19, vierde lid][ref1], kan in dit hoofdstuk worden bepaald dat ingeval het verleende
      subsidiebedrag € 125.000 of meer bedraagt bij een aanvraag tot subsidievaststelling een subsidieontvanger wordt
      verplicht tot het aanleveren van een:

      a. een controleverklaring van een accountant of accountant-administratieconsulent als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2], waaruit blijkt dat met de aanvraag wordt
      voldaan aan de voorschriften bedoeld in [artikel 4:45 van de Algemene wet bestuursrecht][ref3]; of

      b. een rapport van feitelijke bevindingen van een accountant of accountant-administratieconsulent over de in
      [artikel 4:45 van de Algemene wet bestuursrecht][ref4] bedoelde voorschriften.

      2 Indien een controleverklaring of een rapport van feitelijke bevindingen wordt vereist kan de minister nadere
      regels stellen ten aanzien van de gewenste reikwijdte, het object en de diepgang van de controle.


