  - number: '2.15'
    text: |-
      1 Onverminderd [artikel 1.7][ref1] doet de subsidieontvanger of, indien subsidieontvangers samenwerken in een
      samenwerkingsverband, de penvoerder onverwijld schriftelijk mededeling aan de minister zodra aannemelijk is dat:

      a. de subsidiabele activiteiten niet, niet tijdig of niet geheel zullen worden verricht, of

      b. niet, niet tijdig of niet geheel aan de aan de subsidie verbonden verplichtingen zal worden voldaan.

      2 De subsidieontvanger of, indien subsidieontvangers samenwerken in een samenwerkingsverband, de penvoerder
      meldt vervreemding van de onderneming waaraan subsidie is verleend of van grond waarop een activiteit waarvoor
      subsidie is verleend betrekking heeft, zo spoedig mogelijk en uiterlijk op de dag van daadwerkelijke vervreemding,
      schriftelijk aan de minister.

      3 De subsidieontvanger is verplicht om het materiaal, bedoeld in artikel 49, zesde lid, van [verordening 2021/1060]
      (32960R2021) of bijlage III, deel 1, punt 1.7, van [verordening 2022/129](32029R2022), op verzoek van de minister
      ter beschikking te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel1.7
