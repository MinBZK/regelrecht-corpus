      1 Uitgaven voor investeringen om een nieuw product of nieuw concept in de keten te borgen door deze onder te
      brengen in een certificeringssysteem zijn subsidiabel.

      2 Niet subsidiabel zijn uitgaven voor investeringen in ICT voorzieningen ten behoeve van:

      a. tracking en tracing systemen indien het gaat om de registraties van productherkomst, ziekten, plagen, middelen
      of meststoffen; of

      b. het laten functioneren van oogstkarren, weeginstallaties of kantelinstallaties.
