  - number: '2.12'
    text: |-
      1 Indien het subsidieplafond wordt verdeeld op volgorde van rangschikking van de aanvragen, geeft de minister een
      beschikking op een aanvraag om subsidie binnen 22 weken na de laatste dag van de periode waarin aanvragen kunnen
      worden ingediend.

      2 Indien het subsidieplafond wordt verdeeld op volgorde van binnenkomst van de aanvragen, geeft de minister een
      beschikking op een aanvraag om subsidie binnen 13 weken na ontvangst van de aanvraag.

      3 De minister geeft een beschikking op een aanvraag om subsidie binnen 13 weken na de laatste dag van de periode
      waarin aanvragen kunnen worden ingediend, indien:

      a. het subsidieplafond evenredig wordt verdeeld over de ingediende aanvragen;

      b. het subsidieplafond wordt verdeeld door loting.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel2.12
  - number: '2.13'
    text: |-
      Indien de subsidie wordt verleend aan deelnemers in een samenwerkingsverband, verzendt de minister de beschikkingen
      tot subsidieverlening aan de penvoerder.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel2.13
  - number: '2.14'
    text: |-
      1 Indien in deze regeling is bepaald dat er een deelbetaling voor gemaakte kosten wordt verstrekt, bedraagt de
      deelbetaling ten hoogste 90% van de verleende subsidie.

      2 Een deelbetaling wordt verstrekt op aanvraag. De aanvraag wordt ingediend met gebruikmaking van een middel, dat
      door de Minister beschikbaar wordt gesteld.

      3 De Minister geeft een beschikking op een aanvraag tot verlening van een deelbetaling binnen tachtig dagen na
      ontvangst van die aanvraag.

      4 Indien subsidieontvangers samenwerken in een samenwerkingsverband, wordt een deelbetaling aangevraagd door de
      penvoerder.

      5 Een deelbetaling wordt verstrekt voor de gemaakte kosten, bedoeld in
      [artikel 1.3, eerste lid, aanhef en onderdelen a tot en met e][ref1], of op basis van de verrichte prestatie.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel1.3
