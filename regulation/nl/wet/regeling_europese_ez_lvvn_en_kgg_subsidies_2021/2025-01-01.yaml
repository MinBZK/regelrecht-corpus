      berekend op basis van een door de Minister goedgekeurde integrale kostensystematiek als bedoeld in
      [artikel 12, eerste lid, van het Kaderbesluit nationale EZK- en LNV-subsidies][ref2].

      2 Indien op grond van het eerste lid wordt gekozen voor de integrale kostensystematiek,
      zijn [artikel 12, derde lid, van het Kaderbesluit nationale EZK- en LNV subsidies][ref3] en
      [artikel 1.2, eerste lid, van de Regeling nationale EZK- en LNV-subsidies][ref4], van overeenkomstige toepassing.


