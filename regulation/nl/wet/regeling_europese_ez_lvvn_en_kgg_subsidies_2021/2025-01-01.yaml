  - number: 5.2.37
    text: |-
      De waarde van de afgezette productie die is gerealiseerd door verkoop van producten van aangesloten producenten die
      op 1 januari van het uitvoeringsjaar waarvoor de waarde van de afgezette productie wordt berekend niet meer bij de
      producentenorganisatie zijn aangesloten, wordt aantoonbaar uit de waarde van de afgezette productie verwijderd.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.37
  - number: 5.2.38
    text: |-
      1 Producentenorganisaties overleggen jaarlijks, gelijktijdig met de aanvraag tot subsidieverlening, bedoeld
      in [artikel 5.2.48][ref1], aan de minister de voorlopige opgave van de waarde van de afgezette productie, met
      gebruikmaking van een door de minister beschikbaar gesteld middel.

      2 Producentenorganisaties overleggen jaarlijks uiterlijk op 1 oktober gedurende het uitvoeringsjaar aan de minister
      de definitieve opgave van de afgezette productie met gebruikmaking van een door de minister beschikbaar gesteld
      middel.

      3 Producentenorganisaties met een operationeel programma laten een extern accountant een controle uitvoeren en
      een controleverklaring over de juistheid van de in het tweede lid bedoelde opgave van de waarde van de afgezette
      productie opstellen, met gebruikmaking van een door de minister beschikbaar gesteld model. Deze verklaring wordt
      bij de in het tweede lid genoemde opgave gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel5.2.48
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.38
    references:
      - id: ref1
        bwb_id: BWBR0045685
        artikel: 5.2.48
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: 5.2.3
  - number: 5.2.39
    text: |-
      1 De systematiek van berekening van de financiële bijdragen aan het actiefonds, bedoeld in artikel 51, eerste
      lid, onderdeel a, van [verordening 2021/2115](32115R2021), wordt door de producentenorganisatie of unie van
      producentenorganisaties vastgelegd in haar statuten.

      2 Het besluit van de producentenorganisatie of unie van producentenorganisaties tot vaststelling van de financiële
      bijdragen aan het actiefonds, bedoeld in artikel 51, eerste lid, onderdeel a, van [verordening 2021/2115]
      (32115R2021), wordt voorafgaand aan het uitvoeringsjaar goedgekeurd door de algemene vergadering van de
      producentenorganisatie of unie van producentenorganisaties.

      3 Indien in een jaar sprake is van een tekort van het actiefonds, kunnen tot en met het indienen van de aanvraag
      tot subsidievaststelling financiële bijdragen als bedoeld in artikel 51, eerste lid, onderdeel a, van [verordening
      2021/2115](32115R2021), in het actiefonds worden gestort.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.39
  - number: 5.2.40
    text: |-
      1 Door de producentenorganisatie of unie van producentenorganisaties wordt voor het actiefonds:

      a. een aparte bankrekening geopend;

      b. een aparte grootboekrekening gereserveerd; of

      c. een aparte kostenplaats aangemaakt.

      2 De afsluiting van het rapportagejaar in de administratie van de kostenplaats, grootboekrekening of bankrekening
      van het actiefonds van de producentenorganisatie of unie van producentenorganisaties sluit direct aan op de
      jaarrapportage.

      3 Het saldo van de eigen bijdragen van leden aan het actiefonds van de producentenorganisatie of unie van
      producentenorganisaties is op het moment van indienen van de aanvraag tot subsidievaststelling groter dan of gelijk
      aan nul.

      4 De producentenorganisatie of unie van producentenorganisaties laat een extern accountant een controle uitvoeren
      en, met gebruikmaking van een door de minister beschikbaar gesteld model, een controleverklaring afleggen over:

      a. de juistheid van de in het tweede lid bedoelde afsluiting; en

      b. de naleving van de voorschriften inzake het beheer van het actiefonds bedoeld in deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.40
  - number: 5.2.41
    text: |-
      De producentenorganisatie of unie van producentenorganisaties informeert jaarlijks na afloop van het
      uitvoeringsjaar haar leden in een algemene vergadering over de realisatie van het operationeel programma gedurende
      het voorgaande uitvoeringsjaar, in het bijzonder voor wat betreft:

      a. de bedragen die per project over het uitvoeringsjaar zijn gerealiseerd;

      b. welke investeringen van € 150.000 en hoger gedurende het uitvoeringsjaar op locatie van de
      producentenorganisatie of de unie van producentenorganisaties of een dochteronderneming zijn gerealiseerd; en

      c. welke investeringen van € 100.000 en hoger gedurende het uitvoeringsjaar op andere locaties zijn gerealiseerd,
      onder vermelding van het adres van de locaties.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.41
  - number: 5.2.42
    text: |-
      1 Producentenorganisaties streven met hun operationeel programma overeenkomstig artikel 50, derde lid, van
      [verordening 2021/2115](32115R2021) minimaal de sectorale doelstellingen, bedoeld in artikel 46, aanhef en
      onderdelen b, e en f, van [verordening 2021/2115](32115R2021), na.

      2 Producentenorganisaties kunnen met hun operationeel programma tevens de sectorale doelstellingen, bedoeld in
      artikel 46, aanhef en onderdelen a, c, d, en g tot en met k, van [verordening 2021/2115](32115R2021), nastreven.

      3 Een operationeel programma van een unie van producentenorganisaties voldoet overeenkomstig artikel 50, zesde lid,
      aanhef en onderdeel b, van [verordening 2021/2115](32115R2021) aan de volgende voorwaarden:

      a. een operationeel programma van een unie van producentenorganisaties mag niet dezelfde interventies bevatten als
      een operationeel programma van de aangesloten organisaties; en

      b. interventies en overeenkomstige financiële bijdragen worden vermeld in het operationeel programma van elke
      aangesloten organisatie.

      4 Een operationeel programma voldoet overeenkomstig artikel 50, zevende lid, van [verordening 2021/2115]
      (32115R2021) aan de volgende voorwaarden:

      a. ten minste 15% van de uitgaven heeft betrekking op interventies in verband met de sectorale doelstellingen,
      bedoeld in artikel 46, onderdelen e en f, van [verordening 2021/2115](32115R2021);

      b. ten minste drie acties houden verband met de sectorale doelstellingen, bedoeld in artikel 46, onderdelen e en f,
      van [verordening 2021/2115](32115R2021);

      c. ten minste 2% van de uitgaven heeft betrekking op interventies in verband met de sectorale doelstelling, bedoeld
      in artikel 46, onderdeel d, van [verordening 2021/2115](32115R2021); en

      d. de uitgaven voor interventies in het kader van sectorale interventietypes als bedoeld in artikel 47, tweede
      lid, onderdelen f, g en h, van [verordening 2021/2115](32115R2021) bedragen niet meer dan één derde van de totale
      uitgaven.

      5 Operationele programma’s worden uitgevoerd in jaarperioden die lopen van 1 januari tot en met 31 december.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.42
  - number: 5.2.43
    text: |-
      1 Onverminderd [artikel 2.9][ref1] bevat een operationeel programma:

      a. de visie van de producentenorganisatie voor de toekomst van de producentenorganisatie; en

      b. een verklaring dat zij geen risico van dubbele financiering uit fondsen van de Unie meebrengen.

      2 In de visie van de producentenorganisatie is ten minste een beschrijving opgenomen van het toekomstbeeld dat
      de producentenorganisatie nastreeft en aan het einde van de looptijd van het operationeel programma wil hebben
      gerealiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel2.9
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.43
    references:
      - id: ref1
        bwb_id: BWBR0045685
        artikel: '2.9'
        hoofdstuk: '2'
  - number: 5.2.44
    text: |-
      1 Onverminderd [artikel 2.9][ref1] bevat een operationeel programma een actuele SWOT analyse waarin tenminste:

      a. een beschrijving en een verifieerbare onderbouwing is opgenomen van de sterke en zwakke punten van de
      producentenorganisatie; en

      b. een beschrijving en een verifieerbare onderbouwing is opgenomen van de kansen en bedreigingen voor
      de producentenorganisatie bij het realiseren van de sectorale doelstellingen en de visie, bedoeld in
      [artikel 5.2.43][ref2], van de producentenorganisatie.

      2 Uit de SWOT analyse volgen de sectorale doelstellingen die de producentenorganisatie met haar operationeel
      programma wil nastreven.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel2.9
      [ref2]: https://wetten.overheid.nl/BWBR0045685#Artikel5.2.43
