  - number: 5.3.194a
    text: |-
      Facturen en betaalbewijzen zijn op naam gesteld van de producentenorganisatie, de unie van producentenorganisaties
      of een dochteronderneming.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.194a
  - number: 5.3.195
    text: |-
      1 Producentenorganisaties laten een extern accountant de juistheid van de aanvraag tot subsidievaststelling
      controleren en laten de aanvraag tot subsidievaststelling door de accountant waarmerken.

      2 De accountant stelt op basis van de door hem uitgevoerde controle een controleverklaring op met gebruikmaking van
      een door de minister beschikbaar gesteld model, alsmede een verslag van de verrichte werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.195
  - number: 5.3.196
    text: |-
      1 In afwijking van de [artikelen 2.14][ref1] en [5.1.8][ref2] kan een producentenorganisatie de Minister tussen
      15 mei en 15 juni om 12:00 uur of tussen 15 september en 15 oktober om 12:00 uur van enig jaar verzoeken om een
      betaling van ten hoogste 80% van de reeds gerealiseerde uitgaven in het kader van het operationele programma en nog
      niet aan de producentenorganisatie betaalde bedragen.

      2 Ter onderbouwing van het verzoek om gedeeltelijke betaling overlegt de producentenorganisatie de volgende
      bewijsstukken aan de Minister:

      a. een rapportage, met gebruikmaking van een door de minister beschikbaar gesteld middel, over de bij het verzoek
      betrokken periode; en

      b. een detailstaat declaratie.

      3 Een verzoek om gedeeltelijke betaling wordt ten aanzien van overheadkosten als bedoeld in artikel 23, derde
      lid van [verordening 2022/126](32026R2022) slechts gedaan voor het gedeelte van het forfait naar rato van de
      gerealiseerde uitgaven over de betrokken periode.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel2.14
      [ref2]: https://wetten.overheid.nl/BWBR0045685#Artikel5.1.8
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.196
