      voor watersystemen.

      2 Niet subsidiabel zijn:

      a. bodem- en materiaalsterilisatie in de kas; en

      b. vliesdoeken.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.96
