  - number: 5.7.4
    text: |-
      1 De subsidie bedraagt ten hoogste 80% van de subsidiabele kosten.

      2 De subsidie bedraagt ten minste € 50.000,– en ten hoogste € 200.000,– per project.

      3 De minister verdeelt per openstelling het subsidieplafond op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.7.4
  - number: 5.7.5
    text: |-
      1 De minister verleent ten hoogste tweemaal per jaar een deelbetaling.

      2 De aanvraag tot deelbetaling bedraagt ten minste 25% of € 12.500 van de verleende subsidie.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.7.5
  - number: 5.7.6
    text: |-
      1 Met de uitvoering van de op grond van deze paragraaf gesubsidieerde activiteiten wordt gestart binnen drie
      maanden na de subsidieverlening.

      2 De termijn, bedoeld in [artikel 2.11, tweede lid, onderdeel b][ref1], bedraagt drie jaar na de subsidieverlening.


