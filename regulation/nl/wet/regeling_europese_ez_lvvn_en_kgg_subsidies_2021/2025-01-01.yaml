  - number: 5.7.45
    text: |-
      Deze titel vervalt met ingang van 31 december 2027 met dien verstande dat deze van toepassing blijft op subsidies
      die voor die datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.7.45
  - number: 5.8.1
    text: |-
      In deze titel wordt verstaan onder:

        - *blijvend grasland:* hetgeen daaronder wordt verstaan in
      [artikel 1, eerste lid, van de Uitvoeringsregeling GLB 2023][ref1];
        - *dierexcretie:* stikstofexcretie per dier per jaar als bedoeld in de in
      [Bijlage D van de Uitvoeringsregeling Meststoffenwet][ref2] uitgewerkte excretieforfaits;
        - *grasland op landbouwareaal:* blijvend grasland, tijdelijk grasland of natuurlijk grasland met
      landbouwactiviteiten;
        - *grondeigenaar:* natuurlijk persoon of rechtspersoon die grond in eigendom heeft;
        - *landbouwareaal:* hetgeen daaronder wordt verstaan in
      [artikel 1, eerste lid, van de Uitvoeringsregeling GLB 2023][ref3];
        - *melk- en kalfkoeien:* koeien (bos taurus) die ten minste éénmaal hebben gekalfd en die worden gehouden
      voor de productie van melk voor menselijke consumptie of verwerking of voor de fokkerij van runderen voor de
      melkveehouderij, ook als ze drooggezet zijn om een kalf te krijgen, of worden vetgemest en in de mesttijd worden
      gemolken;
        - *melkveehouderijbedrijf:* agrarisch bedrijf met minimaal 80% aan grasland op landbouwareaal voor de
      melkveehouderij waarbij minimaal 70% van de dierexcretie van melk- en kalfkoeien afkomstig is en waarbij de
      gemiddelde dierexcretie van het bedrijf minimaal 50 kilogram stikstof per hectare bedraagt;
        - *Minister:* Minister voor Natuur en Stikstof;
        - *overgangsgebieden N2000:* landbouwareaal in stikstofgevoelige Natura 2000 gebieden als vermeld in
      [bijlage 2][ref4] en in een zone van maximaal 2.500 m rond een stikstofgevoelig Natura 2000 gebied;
        - *samenwerkingsverband:* samenwerkingsverband dat bestaat uit ten minste twee actoren waarvan minimaal een
      landbouwer samen met ten minste een andere landbouwer, grondeigenaar, landbouworganisatie, collectief, natuur- en
      landschapsorganisatie of een andere natuurlijk- of rechtspersoon met uitzondering van overheden;
        - *stikstofhoudende kunstmest:* anorganische meststoffen waarbij de droge stof meer dan 0,5% aan stikstof bevat;
        - *veenweidegebied:* veengrond als bedoeld in artikel 1, eerste lid, onderdeel n, van de [Meststoffenwet][ref5]
      in de provincies Fryslân, Noord-Holland, Zuid-Holland, Utrecht en in de provincie Groningen in de gemeenten
      Groningen, Midden-Groningen en Westerkwartier en in de provincie Overijssel in de gemeenten Kampen, Staphorst,
      Steenwijkerland, Zwartewaterland en Zwolle.


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018989
