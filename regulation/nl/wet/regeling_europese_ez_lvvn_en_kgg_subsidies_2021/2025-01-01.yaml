  - number: 5.4.11
    text: |-
      1 De subsidieontvanger verleent medewerking aan een evaluatie van de effecten van de op grond van deze titel
      gesubsidieerde activiteiten, voor zover deze medewerking redelijkerwijs van hem verlangd kan worden.

      2 De verplichting, bedoeld in het eerste lid, geldt gedurende vijf jaar na de datum van de beschikking tot
      subsidievaststelling.

      3 De subsidieontvanger dient jaarlijks, tussen 1 juli en 1 augustus om 12:00 uur, een tussenrapportage in bij
      de minister met gebruikmaking van een door de minister beschikbaar gesteld format. Deze tussenrapportage heeft
      betrekking op het voorgaande uitvoeringsjaar en bevat een overzicht van de uitgevoerde activiteiten, de behaalde
      deelresultaten en een verantwoording van de gedane uitgaven.

      4 In afwijking van [artikel 2.19, eerste lid][ref1], dient de subsidieontvanger een aanvraag tot
      subsidievaststelling gelijktijdig in met de tussenrapportage, bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel2.19
