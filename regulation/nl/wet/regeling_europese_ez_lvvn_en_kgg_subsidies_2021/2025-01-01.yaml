      1 Uitgaven van de producentenorganisatie voor specifieke advies en begeleiding ten behoeve van de geïntegreerde
      teelt, inclusief personeelskosten, zijn subsidiabel indien het onder meer gaat om:

      a. gewasbeoordeling;

      b. biologische gewasbescherming;

      c. watermanagement;

      d. bemesting en reduceren mineralengebruik;

      e. klimaataansturing; of

      f. energiereductie.

      2 Uitgaven die betrekking hebben op de begeleiding voor de teelt van witlofpennen zijn niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.31
  - number: 5.3.32
    text: |-
      Uitgaven van de producentenorganisatie voor specifieke advies en begeleiding ten behoeve van de biologische teelt,
      inclusief personeelskosten, zijn subsidiabel indien:

      a. het onder meer gaat om:

      1°. biologische teelt;

      2°. bodemvruchtbaarheid;

      3°. biologische bemesting;

      4°. compostering;

      5°. vruchtwisseling;

      6°. rassenkeuze;

      7°. biologische bestrijding en biologisch evenwicht; of

      8°. biologische teelttechniek;

      b. voldaan is aan de bij of krachtens [verordening 2018/848](32748R2018) en [verordening 889/2008](32008R0889)
      gestelde voorschriften; en

      c. deelnemende leden van de producentenorganisatie beschikken over een geldig Skal certificaat of een bevestiging
      van Stichting Skal of een andere erkende instantie overeenkomstig Hoofdstuk V van [verordening 2018/848]
      (32748R2018) dan wel een op grond van artikel 46 van [verordening 2018/848](32748R2018) erkende instantie, dat het
      bedrijf van het lid in omschakeling is naar biologische productie.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.32
  - number: 5.3.33
    text: |-
      1 Uitgaven van de producentenorganisatie voor algemeen advies en begeleiding ten behoeve van de teelt, inclusief
      personeelskosten, zijn subsidiabel indien het onder meer gaat om:

      a. gewasbeoordeling;

      b. gewasbescherming;

      c. watermanagement;

      d. bemesting; of

      e. klimaataansturing.

      2 Uitgaven die betrekking hebben op de begeleiding voor de teelt van witlofpennen zijn niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.33
  - number: 5.3.34
    text: |-
      1 Uitgaven van de producentenorganisatie of een dochteronderneming voor opleidingen van leden die telers zijn,
      medewerkers van de producentenorganisatie of een dochteronderneming en medewerkers van leden die telers zijn om te
      komen tot een verhoging van de kwalificatie van het personeel of het versterken van de interne professionalisering
      zijn subsidiabel, inclusief personeelskosten, indien het gaat om uitgaven voor:

      a. deelname aan opleidingen, trainingen en bijeenkomsten;

      b. trainers of externe deskundigen;

      c. educatieve bijeenkomsten; en

      d. cursusmateriaal.

      2 Opleidingen als bedoeld in het eerste lid kunnen betrekking hebben op de volgende gebieden:

      a. de afzet van de markt;

      b. logistiek;

      c. kwaliteit;

      d. milieubescherming;

      e. teelttechniek;

      f. crisispreventie en risicobeheer; en

      g. fytosanitair bewustzijn.

      3 Niet subsidiabel zijn uitgaven voor:

      a. zaalhuur; en

      b. opleidingen ten behoeve van het verwerven van algemene kennis en vaardigheden.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.34
  - number: 5.3.35
    text: |-
      In het kader van uitgaven voor educatieve bijeenkomsten zijn uitsluitend subsidiabel:

      a. de door de organisatie van de educatieve bijeenkomst in rekening gebrachte kosten voor deelname van leden,
      medewerkers van leden en medewerkers van de producentenorganisatie of dochterondernemingen; en

      b. de kosten van inhuur van externe deskundigen.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.35
  - number: 5.3.35a
    text: |-
      1 Uitgaven ter voorkoming van ziekten en plagen zijn subsidiabel. Het gaat om:

      a. insectengaas; en

      b. autoclipper kapmachine voor gebruik in de kas om het risico op het doden van nuttige insecten te voorkomen.

      2 Niet subsidiabel zijn:

      a. bodem- en materiaalsterilisatie in de kas; en

      b. vliesdoeken.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.35a
