  - number: 5.3.8
    text: |-
      Uitgaven van de producentenorganisatie voor activiteiten ter realisatie van een sectorale doelstelling zijn
      subsidiabel, indien wordt voldaan aan [afdeling 5.2.3, paragraaf 3][ref1] en deze afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Hoofdstuk5
