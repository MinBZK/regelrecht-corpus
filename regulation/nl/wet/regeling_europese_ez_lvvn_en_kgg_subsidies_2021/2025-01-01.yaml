articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *algemene groepsvrijstellingsverordening:* [verordening (EU) nr. 651/2014](32014R0651) van de Commissie van
      17 juni 2014 waarbij bepaalde categorieën steun op grond van de artikelen 107 en 108 van het Verdrag met de interne
      markt verenigbaar worden verklaard (PbEU 2014, L 187);
        - *beheerautoriteit:* door de minister als zodanig aangewezen autoriteit;
        - *bevoegde autoriteit:* minister of beheerautoriteit;
        - *deelbetaling:* betaling aan de subsidieontvanger, vooruitlopend op de subsidievaststelling, op basis van
      gemaakte kosten of een verrichte prestatie;
        - *Elfpo:* Europees Landbouwfonds voor plattelandsontwikkeling, bedoeld in artikel 4, onderdeel b, van [verordening
      (EU) 2021/2116](32116R2021);
        - *groep:* groep als bedoeld in [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1];
        - *kennisinstelling:* a. in onderdeel a, b, g of h van de [bijlage behorende bij de Wet op het hoger onderwijs
      en wetenschappelijk onderzoek](onbekend) genoemde instelling voor hoger onderwijs en een academisch ziekenhuis
      als bedoeld in onderdeel j van de bijlage behorende bij die wet; b. andere dan in onderdeel a bedoelde geheel of
      gedeeltelijk, meerjarig door de overheid gefinancierde onderzoeksorganisatie zonder winstoogmerk die activiteiten
      verricht met als doel de algemene wetenschappelijke of technische kennis uit te breiden; c. geheel of gedeeltelijk,
      meerjarig door een andere lidstaat van de Europese Unie gefinancierde: 1°. openbare instelling voor hoger onderwijs
      of een daaraan verbonden ziekenhuis gelijkwaardig aan een instelling respectievelijk academisch ziekenhuis als
      bedoeld in onderdeel a; 2°. onderzoeksorganisatie zonder winstoogmerk die activiteiten verricht met als doel de
      algemene wetenschappelijke en technische kennis uit te breiden; d. onderzoeksorganisatie zonder winstoogmerk met
      eigen medewerkers in loondienst, die tot doel heeft via het structureel doen van eigen onderzoek en het ontwikkelen
      en testen van technische toepassingen door haar medewerkers, de technologische kennis op een specifiek terrein te
      bevorderen, die geen instelling is als bedoeld in onderdelen a tot en met c;
        - *laatste betaling:* laatste betaling door de bevoegde autoriteit aan de begunstigde van het bedrag of een deel
      van het bedrag, genoemd in de beschikking tot subsidievaststelling;
        - *minister:* a. Minister van Economische Zaken en Klimaat, voor zover het een subsidie als
      bedoeld in [artikel 2 van de Kaderwet EZK- en LNV-subsidies][ref2] betreft; of b. Minister
      van Landbouw, Natuur en Voedselkwaliteit, voor zover het een subsidie als bedoeld in
      [artikel 2a van de Kaderwet EZK- en LNV-subsidies][ref3] betreft;
        - *mkb:* onderneming als omschreven in Aanbeveling 2003/361/EG van de Europese Commissie van 6 mei 2003 betreffende
      de definitie van kleine, middelgrote en micro-ondernemingen (PbEU 2003, L 124);
        - *onderneming:* iedere eenheid, ongeacht haar rechtsvorm of wijze van financiering, die een economische activiteit
      uitoefent;
        - *penvoerder:* de door een samenwerkingsverband aangewezen penvoerende persoon of penvoerende organisatie die
      deelneemt aan het samenwerkingsverband;
        - *samenwerkingsverband:* verband dat geen rechtspersoonlijkheid bezit, niet zijnde een vennootschap, bestaand
      uit ten minste twee niet in een groep verbonden deelnemers, dat is opgericht ten behoeve van de uitvoering van
      activiteiten;
        - *verordening 2021/1058:* [Verordening (EU) 2021/1058](32958R2021) van het Europees Parlement en de Raad van
      24 juni 2021 inzake het Europees Fonds voor regionale ontwikkeling en het Cohesiefonds (PbEU 2021, L 231);
        - *verordening 2021/1059:* [Verordening (EU) 2021/1059](32959R2021) van het Europees Parlement en de Raad
      betreffende specifieke bepalingen voor de doelstelling ‘Europese territoriale samenwerking’ (Interreg) ondersteund
      door het Europees Fonds voor regionale ontwikkeling en door externe financieringsinstrumenten (PbEU 2021, L 231);
        - *verordening 2021/1060:* [Verordening (EU) 2021/1060](32960R2021) van het Europees Parlement en de Raad van
      24 juni 2021 houdende gemeenschappelijke bepalingen inzake het Europees Fonds voor regionale ontwikkeling, het
      Europees Sociaal Fonds Plus, het Cohesiefonds, het Fonds voor een rechtvaardige transitie en het Europees Fonds
      voor maritieme zaken, visserij en aquacultuur en de financiële regels voor die fondsen en voor het Fonds voor
      asiel, migratie en integratie, het Fonds voor interne veiligheid en het Instrument voor financiële steun voor
      grensbeheer en visumbeleid (PbEU 2021, L 231);
        - *verordening 2021/1139:* [Verordening (EU) 2021/1139](33039R2021) van het Europees Parlement en de Raad van
      7 juli 2021 tot oprichting van het Europees Fonds voor maritieme zaken, visserij en aquacultuur en tot wijziging
      van [Verordening (EU) 2017/1004](32904R2017) (PbEU 2021, L 247);
        - *verordening 2021/2115:* [Verordening (EU) 2021/2115](32115R2021) van het Europees Parlement en de Raad van
      2 december 2021 tot vaststelling van voorschriften inzake steun voor de strategische plannen die de lidstaten
      in het kader van het gemeenschappelijk landbouwbeleid opstellen (strategische GLB-plannen) en die uit het
      Europees Landbouwgarantiefonds (ELGF) en het Europees Landbouwfonds voor plattelandsontwikkeling (Elfpo) worden
      gefinancierd, en tot intrekking van Verordeningen (EU) nr. 1305/2013 en (EU) nr. 1307/2013 (PbEU 2021, L 435);
        - *verordening 2021/2116:* [Verordening (EU) 2021/2116](32116R2021) van het Europees Parlement en de Raad van
      2 december 2021 inzake de financiering, het beheer en de monitoring van het gemeenschappelijk landbouwbeleid en tot
      intrekking van Verordening (EU) nr. 1306/2013 (PbEU 2021, L 435);
        - *verordening 2022/129:* Uitvoerings[verordening (EU) 2022/129](32029R2022) van de Commissie van 21 december
      2021 tot vaststelling van regels voor interventietypes voor oliehoudende zaden, katoen en bijproducten van de
      wijnbereiding krachtens [Verordening (EU) 2021/2115](32115R2021) van het Europees Parlement en de Raad en voor de
      vereisten inzake informatie, bekendheid en zichtbaarheid aangaande steun van de Unie en de strategische GLB-plannen
      (PbEU 2022, L 20).


