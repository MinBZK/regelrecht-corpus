  - number: 5.2.73
    text: |-
      1 Uitgaven voor de inhuur van externen zijn subsidiabel, indien de voor uitvoering van een activiteit benodigde
      kennis of capaciteit bij een producentenorganisatie niet voldoende aanwezig is.

      2 Producentenorganisaties geven in het operationeel programma aan welke specifieke taken aan externe diensten
      worden uitbesteed.

      3 De minister kan een producentenorganisatie, ten behoeve van de beoordeling van de subsidiabiliteit van uitgaven
      voor de inhuur van externen, verzoeken om aanvullende informatie en bewijsstukken te overleggen.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.73
  - number: 5.2.74
    text: |-
      1 Uitgaven voor kilometers gereden met de eigen auto door leden en medewerkers van de producentenorganisatie zijn
      subsidiabel indien:

      a. deze leden en medewerkers in het operationeel programma zijn opgenomen;

      b. de kilometers zijn gemaakt in het kader van een in het operationeel programma opgenomen activiteit;

      c. de vergoedingen daadwerkelijk aan de medewerker of het lid zijn uitbetaald;

      d. de vergoeding bedraagt per kilometer maximaal de overeenkomstig hoofdstuk 10 van de CAO-Rijk vastgestelde hoge
      reiskostenvergoeding; en

      e. er een deugdelijke kilometeradministratie is bijgehouden.

      2 Uitgaven voor vliegtickets voor buitenlandse dienstreizen, plaatsbewijzen voor het openbaar vervoer en tickets
      voor veerboten zijn subsidiabel op basis van de economy class prijzen van deze tickets of plaatsbewijzen.

      3 Producentenorganisaties kunnen voor uitgaven voor verblijfkosten voor dienstreizen en excursies in binnenland en
      EU-lidstaten door medewerkers en aangesloten leden vergoedingen verstrekken voor de daadwerkelijk gemaakte kosten
      binnen de maxima van hoofdstuk 10 van de CAO-Rijk.

      4 Kosten voor auto’s in eigendom van of geleased dan wel gehuurd door de producentenorganisatie zijn niet
      subsidiabel.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.74
  - number: 5.2.75
    text: |-
      1 Uitgaven voor overige kosten op het gebied van ICT zijn subsidiabel voor zover deze ICT voorzieningen
      ondersteunend zijn voor subsidiabele activiteiten en op grond van offertes kunnen worden toegerekend aan deze
      activiteiten.

      2 Uitgaven voor licenties en voor abonnementen voor software applicaties zijn subsidiabel indien het uitgaven voor
      subsidiabele applicaties en modules betreft.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.75
  - number: 5.2.76
    text: |-
      Uitgaven voor licenties voor het gebruik van zaden en plantgoed van nieuwe rassen die zijn opgenomen in het
      operationeel programma van een producentenorganisatie zijn subsidiabel, indien de bedoelde rassen:

      a. toegelaten zijn door de Stichting Nederlandse Algemene Kwaliteitsdienst voor de Tuinbouw;

      b. ingeschreven staan in het Nederlandse rassenregister van de Raad voor de plantenrassen; of

      c. ingeschreven staan bij een keuringsinstantie van een andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.76
  - number: 5.2.77
    text: |-
      1 Uitgaven in het kader van educatie bijeenkomsten zijn subsidiabel.

      2 Niet subsidiabel zijn uitgaven voor zaalhuur.

      3 Bij de indiening van het operationeel programma verstrekt de producentenorganisatie in geval van educatieve
      bijeenkomsten aan de minister een beschrijving van:

      a. onderwerp(en) en leerdoel(en) van de bijeenkomst;

      b. het programma met een specificatie van de onderdelen en gehanteerde werkvormen;

      c. aantal bijeenkomsten met vermelding van de data en de duur per bijeenkomst; en

      d. de kosten van de bijeenkomst.

      4 Bij de aanvraag tot subsidievaststelling verstrekt de producentenorganisatie in geval van educatieve
      bijeenkomsten aan de Minister:

      a. een deelnemerslijst; en

      b. een aanwezigheidsregistratie per bijeenkomst per deelnemer voorzien van een handtekening van de deelnemer.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.77
  - number: 5.3.1
    text: |-
      1 [Titel 5.1 tot en met titel 5.3][ref1] zijn van toepassing op de producten van de sector groenten en fruit,
      bedoeld in artikel 1, tweede lid, onderdeel i, van [verordening 1308/2013](32013R1308) en op dergelijke producten
      die uitsluitend zijn bestemd om te worden verwerkt.

      2 [Titel 5.1 tot en met titel 5.3][ref2] zijn van toepassing op:

      a. operationele programma’s die op of na 1 januari 2023 starten;

      b. operationele programma’s als bedoeld in artikel 5, zesde lid, onderdelen a en b, van [verordening 2021/2117]
      (32117R2021).

      3 De minister verstrekt per uitvoeringsjaar op aanvraag subsidie aan een erkende producentenorganisatie van de
      sector groenten en fruit voor het uitvoeren van een door de minister goedgekeurd operationeel programma. Deze
      subsidie betreft de financiële steun, bedoeld in artikel 52 van [verordening 2021/2115](32115R2021).


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0045685#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.1
    references:
      - id: ref1
        bwb_id: BWBR0045685
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0045685
        hoofdstuk: '5'
  - number: 5.3.2
    text: |-
      De hoogte van de subsidie wordt per producentenorganisatie bepaald overeenkomstig artikel 52 van [verordening
      2021/2115](32115R2021).
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.2
  - number: 5.3.3
    text: |-
      Voor subsidie komen in aanmerking kosten die op grond van [afdeling 5.3.2][ref1] subsidiabel worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.3
