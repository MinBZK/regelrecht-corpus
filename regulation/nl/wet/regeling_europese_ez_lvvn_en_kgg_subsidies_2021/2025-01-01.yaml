  - number: 5.7.41
    text: De subsidie bedraagt ten hoogste 80% van de subsidiabele kosten en niet meer dan € 6.000,– per voucher.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.7.41
  - number: 5.7.42
    text: |-
      Voor subsidie voor het opstellen van een bedrijfsplan komen niet in aanmerking kosten die de erkende
      bedrijfsadviseur maakt voor de inhuur van personen die organisatorisch of financieel niet onafhankelijk zijn van de
      landbouwer waaraan het advies is verstrekt.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.7.42
  - number: 5.7.43
    text: |-
      1 Een aanvraag voor subsidie wordt ingediend na afloop van het opstellen van een bedrijfsplan door een erkende
      bedrijfsadviseur.

      2 De aanvraag moet binnen een jaar zijn ontvangen na de dagtekening van een aan de landbouwer verstrekte voucher,
      op een voor het einde van de termijn daartoe ingediend verzoek kan de minister besluiten deze termijn eenmalig te
      verlengen met ten hoogste zes maanden.

      3 Indien de aanvraag niet door de minister is ontvangen binnen de termijn, bedoeld in het tweede lid, vervalt de
      voucher van rechtswege.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.7.43
  - number: 5.7.44
    text: |-
      De minister beslist afwijzend op een aanvraag voor subsidie voor het opstellen van een bedrijfsplan indien:

      a. het opstellen van een bedrijfsplan in groepsverband heeft plaatsgevonden aan meer dan één landbouwer;

      b. het niet ingaat op minimaal vijf van de volgende onderwerpen, waarvan emissiereductie stikstof één van de
      onderwerpen moet zijn:

      1°. emissiereductie stikstof;

      2°. emissiereductie gebruik gewasbeschermingsmiddelen en toepassing geïntegreerde gewasbescherming;

      3°. emissiereductie broeikasgassen;

      4°. emissiereductie nitraat en andere meststoffen;

      5°. vergroten biodiversiteit;

      6°. versterken duurzaam bodembeheer;

      7°. verhogen aandeel circulair veevoergebruik;

      8°. verbeteren dierenwelzijn, diergezondheid;

      c. het bedrijfsplan geen uitgewerkte beschrijving van de onderdelen 1 tot en met 5 bevat met betrekking tot:

      1°. de aard en omvang van het huidige bedrijf inclusief SWOT-analyse;

      2°. de beoogde en onderbouwde vermarkting van de meerwaarde van de omschakeling (producten / diensten, markten,
      doelgroepen, promotie, ketenpartners, verdienmodel);

      3°. welke maatregelen of investeringen er door het bedrijf per onderwerp worden voorgesteld;

      4°. de maatregelen en investeringen, en de uitwerking daarvan, in een reële en zo mogelijk sluitende begroting voor
      de exploitatie, investeringen, financiering en liquiditeit;

      5°. de (juridische) haalbaarheid van het initiatief en indien er belemmeringen zijn om het plan te realiseren, hoe
      hiervoor ondersteuning of oplossingsrichtingen kunnen worden geboden;

      d. de adviseur niet overeenkomstig [artikel 38, tweede lid, van de Uitvoeringsregeling GLB 2023][ref1] is erkend in
      het kader van het bedrijfsadviseringssysteem;

      e. de erkende bedrijfsadviseur financieel niet onafhankelijk is van de aanvrager;

      f. de erkende bedrijfsadviseur niet deskundig of onvoldoende betrouwbaar is;

      g. ten behoeve van een agrarische onderneming al in de afgelopen 3 kalenderjaren van een bedrijfsplanvoucher
      gebruik is gemaakt op basis van deze titel of [titel 2.4 van de Regeling nationale EZK- en LNV-subsidies][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0047444#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0035474
