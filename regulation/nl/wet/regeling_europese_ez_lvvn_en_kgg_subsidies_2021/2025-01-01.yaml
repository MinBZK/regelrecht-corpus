  - number: 5.3.66
    text: |-
      De activiteiten die zijn opgenomen in deze paragraaf kunnen, indien ze voldoen aan de algemene voorwaarden uit
      deze paragraaf, worden ingezet in het kader van projecten ter realisatie van de sectorale doelstelling onderzoek
      naar en ontwikkeling van duurzame productiemethoden, bedoeld in artikel 46, aanhef en onderdeel d, van [verordening
      2021/2115](32115R2021).
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.66
  - number: 5.3.67
    text: |-
      1 Uitgaven van de producentenorganisatie voor onderzoek en ontwikkeling zijn subsidiabel indien onderzoek en
      ontwikkeling voldoet aan de volgende voorwaarden:

      a. het is innovatief, moet voor de producentenorganisatie nieuw zijn en op de markt is er nog geen oplossing
      voorhanden;

      b. het onderzoek en de resultaten moeten ten gunste van de producentenorganisatie en haar leden komen en mogen niet
      commercieel geëxploiteerd worden door derden gedurende een periode van 5 jaar; en

      c. initiatief, opdracht en aansturing moeten bij de producentenorganisatie liggen.

      2 Niet subsidiabel zijn:

      a. bijdragen aan sectoronderzoek of samenwerking met private maatschappelijke organisaties; en

      b. uitgaven in aanvulling op andere publieke financiering (PPS) of financiering via AVV.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.67
  - number: 5.3.68
    text: |-
      Uitgaven van de producentenorganisatie voor onderzoek en ontwikkeling zijn subsidiabel, indien het gaat om
      onderzoeken op gebieden zoals:

      a. afzet;

      b. logistiek;

      c. kwaliteit;

      d. milieu, duurzaamheid en klimaat;

      e. teelttechniek;

      f. gewasbescherming;

      g. techniek; en

      h. waterkwaliteit.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.68
  - number: 5.3.69
    text: |-
      Uitgaven van de producentenorganisatie voor soorten onderzoek en ontwikkeling zijn subsidiabel indien het gaat om:

      a. (Toegepast) onderzoek in de experimentele fase;

      b. Praktijkonderzoek in het kader van de ontwikkeling van nieuwe producten, producteigenschappen, technieken;

      c. eerste uitrol in de praktijk op experimentele basis; of

      d. ad hoc onderzoek in verband met ziekten en plagen.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.69
  - number: 5.3.70
    text: |-
      Uitgaven voor onderzoek door de producentenorganisatie zijn niet subsidiabel indien het gaat om kosten voor:

      a. een product dat uitontwikkeld is;

      b. een product dat al op de markt gebracht is;

      c. gederfde inkomsten en opbrengsten;

      d. voorbereidingskosten projectvoorstel;

      e. marktonderzoek;

      f. samenwerking met niet erkende producentenorganisaties, waarbij erkende producentenorganisaties geen meerderheid
      vormen en de kosten niet naar rato verdeeld zijn.

      g. algemene investeringen zoals kassen en normale bedrijfsuitrusting;

      h. routinematige ontwikkeling, kopiëren, imiteren of reverse-engineering van bestaande technologie en het invoeren
      en implementeren van bestaande applicaties bij de ontwikkeling van technisch nieuwe programmatuur; of

      i. producten die niet bestemd zijn voor menselijke consumptie.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.70
  - number: 5.3.71
    text: |-
      1 Bij ieder onderzoek wordt een projectvoorstel gevoegd, met gebruikmaking van een door de minister beschikbaar
      gesteld middel.

      2 Het projectvoorstel voor onderzoek en ontwikkeling, bedoeld in het eerste lid, bevat in ieder geval de volgende
      onderdelen:

      a. een beschrijving van het op te lossen knelpunt met onderbouwing dat er op de markt nog geen oplossing voorhanden
      is;

      b. een omschrijving van het doel;

      c. een oplossingsrichting en een beschrijving van het gewenste resultaat;

      d. een omschrijving aan welke sectorale doelstelling(en) het project bijdraagt;

      e. een omschrijving van aan wie de resultaten ten goede komen

      f. een planning;

      g. een begroting;

      h. een omschrijving van wie het onderzoek of de ontwikkeling uitvoert; en

      i. wie de opdrachtgever is.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.71
  - number: 5.3.71a
    text: |-
      1 [Artikel 5.2.50][ref1] is niet van toepassing op het bepaalde in deze paragraaf, indien de wijzigingen geen
      betrekking hebben op het doel, het gewenste resultaat en de bijdrage aan de sectorale doelstellingen, bedoeld in
      [artikel 5.3.71, tweede lid, onderdelen b, c en d][ref2].

      2 Wijzigingen als bedoeld in het eerste lid rapporteert en motiveert de producentenorganisatie jaarlijks op het
      moment van indienen van de aanvraag tot subsidievaststelling over het voorafgaande jaar, met gebruikmaking van een
      door de minister beschikbaar gesteld middel.


