  - number: 4.4.3
    text: |-
      1 De ontvanger van een programmasubsidie als bedoeld in [artikel 4.4.1][ref1] financiert geen projecten ten laste
      van de programmasubsidie, bedoeld in artikel 4.4.1 zonder voorafgaande schriftelijke instemming van de Minister.

      2 De Minister onthoudt de instemming of wijst een aanvraag als bedoeld in [artikel 4.4.1][ref2] af, indien het
      project niet in voldoende mate bijdraagt aan tenminste een van de volgende aspecten:

      a. de realisatie van nationale beleidsdoelen op het gebied van innovatie en de transities naar een koolstofarme,
      circulaire, economie;

      b. verbeteren van de aansluiting tussen onderwijs en arbeidsmarkt of arbeidsmobiliteit;

      c. economische structuurversterking binnen economische sectoren of in het programmagebied.

      3 Het tweede lid is niet van toepassing op Rijkscofinanciering voor technische bijstand.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel4.4.1
      [ref2]: https://wetten.overheid.nl/BWBR0045685#Artikel4.4.1
