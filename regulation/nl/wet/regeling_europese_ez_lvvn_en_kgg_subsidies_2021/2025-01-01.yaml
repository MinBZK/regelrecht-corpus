  - number: 3.4.6
    text: |-
      1 De Minister kent aan een aanvraag om subsidie een hoger aantal punten toe naarmate:

      a. het aangevraagd project een meer innovatief karakter heeft;

      b. het aangevraagd project meer economisch of technisch perspectief heeft op toepassing op praktijkschaal;

      c. de economische of technische haalbaarheid van het aangevraagd project hoger is;

      d. het aangevraagd project een grotere bijdrage levert aan de ecologische verduurzaming van de aquacultuur, zijnde
      dat het project:

      1°. bijdraagt aan het verminderen van afval;

      2°. in het geval van viskweekprojecten bijdraagt aan aantoonbaar en significante verbetering van dierenwelzijn;

      3°. rekening houdt met de natuurlijke leefomgeving en ecosystemen;

      4°. bijdraagt aan efficiënter grondstof- en energieverbruik.

      2 Het aantal punten bedraagt per onderdeel van het eerste lid ten hoogste 10.

      3 Voor het totaal aantal punten is de wegingsfactor voor onderdelen a, b, c en d respectievelijk, 20%, 20%, 20%
      en 40%.

      4 De Minister rangschikt de aanvragen waarop niet afwijzend is beslist hoger naarmate in totaal meer punten aan het
      project zijn toegekend.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel3.4.6
  - number: 3.4.7
    text: |-
      1 Er kan een deelbetaling worden verstrekt.

      2 Een aanvraag tot deelbetalingverlening wordt in ieder geval ingediend tegelijkertijd met een tussenrapportage als
      bedoeld in [artikel 2.18, eerste lid][ref1].

      3 Onverminderd het tweede lid kan een aanvraag tot deelbetalingverlening op een ander moment worden ingediend. In
      dat geval gaat de aanvraag vergezeld van een beschrijving van de voortgang van het project.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel2.18
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel3.4.7
