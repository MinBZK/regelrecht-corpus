  - number: 5.4.8
    text: |-
      De termijn, bedoeld in [artikel 2.11, tweede lid, onderdeel b][ref1], is twee jaar na subsidieverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel2.11
