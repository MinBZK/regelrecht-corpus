  - number: 5.8.3.1
    text: |-
      1 De Minister verstrekt op aanvraag subsidie aan een samenwerkingsverband voor het uitvoeren van projecten gericht
      op het in veenweidegebieden reduceren van CO-emissie uit percelen door het verhogen van de grondwaterstand in
      percelen grasland op landbouwareaal en op niet-landbouwareaal, bij voorkeur zoveel mogelijk in één of meerdere
      peilvakken, al dan niet in combinatie met maatregelen gericht op het reduceren van ammoniakemissie door
      extensivering van melkveehouderijbedrijven.

      2 Een project ondersteunt actie die bijdraagt aan de interventietypes, bedoeld in artikel 77 van [verordening
      2021/2115](32115R2021), en aan de specifieke doelstellingen, bedoeld in artikel 6, eerste lid, onderdelen d, e en
      f, en tweede lid, van [verordening 2021/2115](32115R2021).

      3 Voor zover aan het samenwerkingsverband anderen dan landbouwers deelnemen en de subsidie niet hoofdzakelijk
      ten goede komt aan de landbouwsector bevat de subsidie, bedoeld in het eerste lid, staatssteun en wordt zij
      gerechtvaardigd door artikel 59 van de landbouwvrijstellingsverordening.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.8.3.1
  - number: 5.8.3.2
    text: |-
      1 De hoogte van de subsidie bedraagt ten minste € 125.000.

      2 De subsidie bedraagt 100% van de subsidiabele kosten, met dien verstande dat de subsidiabele kosten, bedoeld in
      [artikel 5.8.3.3, eerste lid, onderdelen a tot en met e][ref1], niet meer dan 25% van de totale subsidiabele kosten
      bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel5.8.3.3
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.8.3.2
