  - number: 5.4.9
    text: |-
      Onverminderd [artikel 2.11][ref1], beslist de minister afwijzend op een aanvraag voor subsidieverlening indien een
      aanvraag minder dan 30 punten behaalt op basis van de rangschikking, bedoeld in [artikel 5.4.10][ref2].


