        artikel: 4.2.10
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.2.9
    text: |-
      1 Indien wordt gekozen voor verdeling op volgorde van ontvangst als bedoeld in [artikel 4.2.8, onderdeel a][ref1],
      komt de eerst ontvangen aanvraag het eerst voor subsidie in aanmerking.

      2 Indien een aanvrager niet heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van de
      aanvraag en met toepassing van [artikel 4:5 van de Algemene wet bestuursrecht][ref2] de gelegenheid heeft gehad de
      aanvraag aan te vullen, geldt met betrekking tot de verdeling de dag waarop de aanvraag voldoet aan de wettelijke
      voorschriften als datum van ontvangst.

      3 Indien de beheerautoriteit op de dag dat het subsidieplafond wordt bereikt meer dan een aanvraag ontvangt, stelt
      zij de onderlinge rangschikking van die aanvragen vast door middel van loting.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel4.2.8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel4.2.9
    references:
      - id: ref1
        bwb_id: BWBR0045685
        artikel: 4.2.8
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:5
  - number: 4.2.10
    text: |-
      1 Indien wordt gekozen voor verdeling op volgorde van rangschikking van de aanvragen als bedoeld in
      [artikel 4.2.8, onderdeel b][ref1], komt de aanvraag die naar het oordeel van de beheerautoriteit in de hoogste
      mate aan de rangschikkingscriteria voldoet het eerst voor subsidie in aanmerking.

      2 Voor zover het subsidieplafond dreigt te worden overschreden, stelt de beheerautoriteit de onderlinge
      rangschikking van die aanvragen die bij de beoordeling gelijk zijn gerangschikt vast door middel van loting.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel4.2.8
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel4.2.10
    references:
      - id: ref1
        bwb_id: BWBR0045685
        artikel: 4.2.8
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.2.11
    text: |-
      De subsidieontvanger voert het project uit overeenkomstig het projectplan waarop de subsidieverlening betrekking
      heeft en voltooit het uiterlijk op het bij de verlening bepaalde tijdstip.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel4.2.11
  - number: 4.2.12
    text: |-
      Een wijziging van een project waarvoor subsidie wordt verstrekt, betreffende

      a. de subsidieontvanger;

      b. de uit te voeren activiteiten of de te realiseren doelstellingen;

      c. de financiering van het project; of

      d. de planning of looptijd,

      behoeft de goedkeuring van de beheerautoriteit.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel4.2.12
  - number: 4.2.13
    text: |-
      De subsidieontvanger doet onverwijld schriftelijk melding aan de beheerautoriteit zodra aannemelijk is dat:

      a. de activiteiten waarvoor subsidie is verleend niet, niet tijdig of niet geheel zullen worden verricht; of

      b. niet, niet tijdig of niet geheel aan de aan de subsidie verbonden verplichtingen zal worden voldaan.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel4.2.13
  - number: 4.2.14
    text: |-
      De subsidieontvanger voert een administratie die zodanig is ingericht dat daaruit te allen tijde op eenvoudige
      en duidelijke wijze alle door hem gemaakte en betaalde kosten kunnen worden afgelezen en gespecificeerd, met dien
      verstande dat ter zake van de kosten, bedoeld in de [artikelen 1.3a, eerste lid, onderdeel a, en tweede lid][ref1],
      [1.3c, eerste lid, onderdeel a][ref2], en [1.3e][ref3], een door middel van een inzichtelijke tijdschrijving
      controleerbare urenverantwoording per werknemer aanwezig dient te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel1.3a
      [ref2]: https://wetten.overheid.nl/BWBR0045685#Artikel1.3c
      [ref3]: https://wetten.overheid.nl/BWBR0045685#Artikel1.3e
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel4.2.14
    references:
      - id: ref1
        bwb_id: BWBR0045685
        artikel: 1.3a
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0045685
        artikel: 1.3c
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0045685
        artikel: 1.3e
        hoofdstuk: '1'
  - number: 4.2.15
    text: |-
      1 De beheerautoriteit verbindt verplichtingen aan de subsidie.

      2 De beheerautoriteit verbindt zodanig verplichtingen aan de subsidie dat de subsidieontvanger aan de
      auditautoriteit de medewerking verleent die zij voor haar taakvervulling nodig heeft.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel4.2.15
  - number: 4.2.16
    text: |-
      Een aanvraag tot subsidievaststelling wordt ingediend met gebruikmaking van een middel dat door de beheerautoriteit
      beschikbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel4.2.16
  - number: 4.2.17
    text: De beheerautoriteit geeft binnen 26 weken een beschikking op een aanvraag tot subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel4.2.17
  - number: 4.2.18
    text: |-
      De overeenstemming van op algemeen aanvaarde gegevensdragers bewaarde documenten met de originele documenten wordt
      vastgesteld overeenkomstig de procedure opgenomen in [bijlage 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045685
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel4.2.18
