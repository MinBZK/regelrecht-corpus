        hoofdstuk: '2'
  - number: 5.8.2.7
    text: |-
      1 De Minister kent aan een aanvraag gericht op het voorbereiden van een plan en het vormen van een
      samenwerkingsverband een hoger aantal punten toe naarmate:

      a. de mate van effectiviteit hoger is;

      b. de haalbaarheid hoger is;

      c. de mate van efficiëntie hoger is; en

      d. de mate van urgentie hoger is.

      2 Het aantal punten bedraagt per onderdeel van het eerste lid, ten hoogste 5 en ten minste 1.

      3 De wegingsfactoren voor het eerste lid, onderdelen a, b, c en d, bedragen respectievelijk 4, 1, 1 en 1.

      4 Indien aan twee of meer aanvragen een gelijk totaal aantal punten is toegekend, rangschikt de Minister een
      aanvraag hoger naarmate meer punten zijn toegekend voor een rangschikkingscriterium met een hogere wegingsfactor.

      5 De score voor de mate van urgentie, bedoeld in het eerste lid, onderdeel d, wordt per stikstofgevoelig Natura
      2000 gebied bepaald overeenkomstig [bijlage 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045685
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.8.2.7
    references:
      - id: ref1
        bwb_id: BWBR0045685
  - number: 5.8.2.8
    text: |-
      1 Onverminderd [artikel 2.9][ref1] bevat de aanvraag tot subsidieverlening de volgende gegevens:

      a. een intekening door de aanvrager op de beschikbaar gestelde digitale omgevingskaart met daarin aangegeven
      de ligging van het gebied waarbinnen het samenwerkingsverband beoogd is of de ligging van het gebied waarop het
      beoogde gebiedsplan zich richt;

      b. een beschrijving van de organisatiestructuur van het beoogde samenwerkingsverband waaronder de rollen en
      verantwoordelijkheden van de deelnemers;

      c. een beschrijving van de opgaven waaraan gewerkt gaat worden door het beoogde samenwerkingsverband of in het
      beoogde gebiedsplan;

      d. op de in onderdeel a. bedoelde digitale omgevingskaart wordt aangegeven welke percelen van welke deelnemers aan
      het samenwerkingsverband meedoen;

      e. offertes horend bij de in [artikel 5.8.2.3][ref2] bedoelde subsidiabele kosten.

      2 Onverminderd [artikel 2.18][ref3] dient de subsidieontvanger uiterlijk een jaar na de beschikking tot
      subsidieverlening een tussenrapportage in bij de Minister.

      3 Onverminderd [artikel 2.19][ref4] gaat de aanvraag tot subsidievaststelling vergezeld van documenten met daarin
      het resultaat van het project, zoals het uiteindelijke samenwerkingsverband en het uiteindelijke gebiedsplan,
      gericht op de opgave in het gebied met beschrijving van de partijen, of een rapportage van het proces.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel2.9
      [ref2]: https://wetten.overheid.nl/BWBR0045685#Artikel5.8.2.3
