        hoofdstuk: '5'
  - number: 5.6.8
    text: |-
      1 De minister kent aan een aanvraag, op basis van het bijbehorende projectplan, een hoger aantal punten toe
      naarmate:

      a. de mate van effectiviteit hoger is;

      b. de haalbaarheid hoger is;

      c. de mate van efficiëntie van uitvoering hoger is; en

      d. de mate van innovatie hoger is.

      2 Het aantal punten dat wordt gegeven bedraagt per onderdeel van het eerste lid ten hoogste 5.

      3 Voor de rangschikking van een aanvraag voor een project dat bijdraagt aan de categorie, bedoeld in
      [artikel 5.6.2, zesde lid, onderdelen a en b][ref1], wordt het aantal punten gegeven voor het eerste lid,
      onderdelen a, b, c, en d, vermenigvuldigd met onderscheidenlijk de wegingsfactoren 4, 3, 1 en 2.

      4 Voor de rangschikking van een aanvraag voor een project dat bijdraagt aan de doelstelling, bedoeld in
      [artikel 5.6.2, zesde lid, onderdeel c][ref2], wordt het aantal punten gegeven voor het eerste lid, onderdelen a,
      b, c en d, vermenigvuldigd met onderscheidenlijk de wegingsfactoren 3, 4, 1 en 2.

      5 Voor de rangschikking van een aanvraag voor een project dat bijdraagt aan de doelstelling, bedoeld in
      [artikel 5.6.2, zesde lid, onderdeel d][ref3], wordt het aantal punten gegeven voor het eerste lid, onderdelen a,
      b, c en d, vermenigvuldigd met onderscheidenlijk de wegingsfactoren 3, 2, 1 en 4.

      6 Voor de rangschikking van een aanvraag voor een project dat bijdraagt aan de doelstelling, bedoeld in
      [artikel 5.6.2, zesde lid, onderdeel e][ref4], wordt het aantal punten gegeven voor het eerste lid, onderdelen a,
      b, c en d, vermenigvuldigd met onderscheidenlijk de wegingsfactoren 4, 2, 1 en 3.

      7 De minister rangschikt de aanvragen waarop niet afwijzend is beslist hoger naarmate in totaal meer punten aan het
      project zijn toegekend.

      8 Indien aan twee of meer aanvragen binnen een categorie, bedoeld in [artikel 5.6.2, zesde lid][ref5], in totaal
      een gelijk aantal punten is toegekend, rangschikt de minister een aanvraag hoger naarmate meer punten zijn
      toegekend voor een rangschikkingscriterium met een hogere wegingsfactor.


