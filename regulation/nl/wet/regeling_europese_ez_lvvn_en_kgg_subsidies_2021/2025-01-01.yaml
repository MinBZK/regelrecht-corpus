  - number: 5.7.7
    text: |-
      Onverminderd [artikel 2.11][ref1], beslist de minister afwijzend op een aanvraag voor subsidieverlening indien:

      a. een aanvraag minder dan 3 punten behaalt op één van de afzonderlijke rangschikkingscriteria, bedoeld in
      [artikel 5.7.8][ref2];

      b. de aanvrager een producentengroepering of -organisatie is die een landbouwer verplicht lid te zijn van de
      groepering of organisatie om deel te kunnen nemen aan het project; of

      c. het project niet past binnen de onderwerpen van [artikel 5.7.2, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel2.11
      [ref2]: https://wetten.overheid.nl/BWBR0045685#Artikel5.7.8
