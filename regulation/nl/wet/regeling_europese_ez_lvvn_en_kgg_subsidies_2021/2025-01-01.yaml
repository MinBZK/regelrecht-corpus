    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.157
  - number: 5.3.158
    text: |-
      1 Uitgaven van de producentenorganisatie ten behoeve van marktonderzoek, marktontwikkeling en marketing, inclusief
      personeelskosten, zijn subsidiabel indien het gaat om:

      a. consumentenonderzoek en aankoop van marktdata en paneldata;

      b. het testen van een product door middel van technische metingen op voor de markt relevante producteigenschappen;

      c. onderzoek naar het onderhouden van schap of retail positionering;

      d. productmarktanalyses;

      e. marktonderzoek;

      f. het doen van marktonderzoek door middel van pop-up stores;

      g. verkoopbevordering van merken en handelsnamen; en

      h. afzetbeleid en marktstrategie, voor zover niet gericht op de interne organisatie van de producentenorganisatie;

      2 Onderzoeken naar verwerkte producten zijn slechts subsidiabel indien dit onderzoek betrekking heeft op producten
      die bestemd zijn voor de food-markt.

      3 Onder marktstrategie wordt verstaan samenwerking in de keten, reclame, innovatie en planning van het
      productaanbod.

      4 Uitgaven voor activiteiten gericht op het bepalen van een markstrategie zijn subsidiabel voor zover deze
      betrekking hebben op het:

      a. samenstellen van een innovatief, concurrerend en formulegericht assortiment per productgroep;

      b. behouden van klanten of nieuwe klanten werven door acquisitieactiviteiten;

      c. bepalen van de ontwikkeling, de productie, de marketing en het in de markt zetten van een product en het
      analyseren van de resultaten met het oog op de commerciële lange termijn doelen;

      d. bepalen van de marktstrategie door middel van marketingplannen en het ervoor zorgen dat deze strategie wordt
      geïmplementeerd en nageleefd; of

      e. onderzoek naar alle factoren op alle verschillende (potentiële) markten die de vraag naar een product
      beïnvloeden, onder meer wat betreft trends, klanttevredenheid, de onderliggende behoeften van klanten en het imago
      van de sector.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.158
  - number: 5.3.159
    text: |-
      1 Uitgaven van de producentenorganisatie ten behoeve van de verbetering van concepten rondom verse, bewerkte en
      verwerkte producten, inclusief personeelskosten, zijn subsidiabel indien het gaat om:

      a. conceptontwikkeling op het gebied van duurzaamheid, gezondheid en gemak;

      b. ontwikkeling van nieuwe verpakkingen;

      c. nieuwe verwerkte producten ten behoeve van de foodmarket; en

      d. ontwikkeling van ondersteunende voedingsproducten en niet voedingsproducten ten behoeve van bewerkte en
      verwerkte producten.

      2 Uitgaven als bedoeld in het eerste lid, onderdeel b, voor verse producten, en onderdeel d, zijn slechts
      subsidiabel indien deze rechtstreeks bijdragen aan het kwaliteitsbehoud.

      3 Uitgaven als bedoeld in het eerste lid, onderdelen c en d, zijn slechts subsidiabel indien het verwerkte
      product dat de producentenorganisatie met behulp van de activiteiten, bedoeld in het eerste lid, onderdelen c en
      d, produceert:

      a. direct, zonder verdere verwerking, door consumenten kan worden geconsumeerd; en

      b. niet wordt verwerkt in ingrediënten ten behoeve van de voedselindustrie.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.159
  - number: 5.3.160
    text: |-
      1 Uitgaven van de producentenorganisatie ten behoeve van generieke afzetbevordering, en voorlichtingsacties
      gericht op het verhogen van bewustzijn van de voordelen van de consumptie van groenten en fruit, zijn subsidiabel,
      inclusief personeelskosten, indien het gaat om uitgaven voor:

      a. generieke promotie op beurzen;

      b. generieke promotie tijdens publieksevenementen;

      c. generieke promotie in het kader van duurzaam telen;

      d. generieke promotie gericht op doelgroepen;

      e. sectorpromotie en PR-campagnes; of

      f. het opzetten of verbeteren van websites en sociale media, indien het gaat om:

      1°. het registreren van een domeinnaam;

      2°. het bouwen van een website;

      3°. het uitbreiden van een bestaande website met aantoonbaar nieuwe elementen; en

      4°. het laten verzorgen van content door een professionele externe organisatie.

      2 Niet subsidiabel zijn uitgaven voor:

      a. activiteiten op het gebied van verkoop van producten;

      b. activiteiten op het gebied van gezamenlijke verkoopbevordering waarvan de kosten mede worden gedragen door een
      afnemer;

      c. de kosten van producten in het geval van het gratis verstrekken van product;

      d. abonnementen bij providers, hosting van serverruimte, communicatie met het web;

      e. uitgaven voor sponsoring; en

      f. uitgaven, waaronder personeelskosten, die worden gemaakt ten behoeve van de aanvraag voor goedkeuring en
      uitvoering van promotieprogramma’s in het kader van [verordening 1144/2014](32014R1144).

      3 De producentenorganisatie voorziet afzetbevorderingsmateriaal van het embleem van de Unie en van de vermelding
      ‘Gefinancierd door de Europese Unie’, bedoeld in artikel 14, tweede lid, van [verordening 2022/126](32026R2022).
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.160
  - number: 5.3.161
    text: |-
      1 Uitgaven van de producentenorganisatie, inclusief personeelskosten, ten behoeve van marketing en
      verkoopbevordering van merken en handelsnamen van de producentenorganisatie, dochterondernemingen zijn subsidiabel
      indien het gaat om uitgaven voor:

      a. promotie van merken of handelsnamen op consumentenbeurzen;

      b. promotie van merken of handelsnamen op publieksevenementen;

      c. promotie van merken of handelsnamen in het kader van duurzaam telen;

      d. promotie van merken of handelsnamen gericht op doelgroepen;

      e. sectorpromotie en PR-campagnes;

      f. het opzetten of verbeteren van websites en sociale media, indien het gaat om:

      1°. het registreren van een domeinnaam;

      2°. het bouwen van een website;

      3°. het uitbreiden van een bestaande website met aantoonbaar nieuwe elementen; en

      4°. het laten verzorgen van content door een professionele externe organisatie.

      g. het opstellen en uitvoeren van plannen voor accountmanagement of categorymanagement; of

      h. het laten uitvoeren van onderzoek op het gebied van afzetbeleid, voor zover niet gericht op de interne
      organisatie van de producentenorganisatie.

      2 Niet subsidiabel zijn uitgaven voor:

      a. de aankoop van een merk;

      b. activiteiten ten behoeve van een merk waarvan de licentie gehuurd of geleased is;

      c. activiteiten op het gebied van verkoop van producten;

      d. uitgaven voor gezamenlijke verkoopbevordering, waarvan de kosten mede worden gedragen door een afnemer;

      e. de kosten van producten in het geval van het gratis verstrekken van product;

      f. abonnementen bij providers, hosting van serverruimte, communicatie met het web, het updaten van bestaande
      websites, personeelskosten ten behoeve van berichtgeving in het kader van social media;

      g. uitgaven voor sponsoring; en

      h. PR-activiteiten richting potentiële leden van een producentenorganisatie.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.161
  - number: 5.3.162
    text: |-
      1 Uitgaven van de producentenorganisatie voor reclameactiviteiten en reclameartikelen voor producten waarvoor de
      producentenorganisatie is erkend, inclusief personeelskosten, zijn subsidiabel als het gaat om uitgaven voor:

      a. advertenties in magazines of kranten;

      b. promotie in een blad of magazine van supermarkten, indien:

      1°. in het blad of magazine duidelijk vermeld is dat de producentenorganisatie de afzender is; en

      2°. er geen logo of verwijzing naar de supermarkt in de advertentie is opgenomen;

      c. ontwikkelingskosten van de lay-out en extra kosten van reclamedrukwerk op verpakkingen of etiketten,
      steekkaarten of wikkels voor zover gebruikt bij tijdelijke acties;

      d. toonbankdisplays, flyers of folders, gadgets, belettering, aangekochte producten voor standaankleding;

      e. billboards, radioreclame, tv-reclame, banners op websites;

      f. kookdemonstraties;

      g. bedrijfsrondleidingen, gericht op afnemers of potentiële afnemers, bij een producentenorganisatie of lid van de
      producentenorganisatie, een open dag, opening of jubileum, met uitzondering van verstrekte consumpties; of

      h. deelname aan beurzen, indien deze beurzen gericht zijn op afnemers van de producentenorganisatie, met
      uitzondering van verstrekte consumpties.

      2 Reclameacties en reclameartikelen waarvan de kosten mede worden gedragen door een afnemer zijn niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.162
  - number: 5.3.163
    text: |-
      1 Uitgaven van de producentenorganisatie of een dochteronderneming voor activiteiten ten behoeve van versterking
      van de professionalisering van de producentenorganisatie of een dochteronderneming richting de markt, inclusief
      personeelskosten, zijn subsidiabel, indien het gaat om de kosten van opleidingen voor personeel of lidtelers voor
      activiteiten van de producentenorganisatie of een dochteronderneming op het gebied van afzet.

      2 Uitgaven voor opleiding en advies ten behoeve van het verwerven van algemene kennis en vaardigheden zijn niet
      subsidiabel.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.163
