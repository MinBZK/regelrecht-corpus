  - number: 5.1.7
    text: |-
      1 Indien in dit hoofdstuk is bepaald dat er een voorschot wordt verstrekt voordat een project wordt uitgevoerd, kan
      de minister ambtshalve een voorschot als bedoeld in artikel 44 van [verordening 2021/2116](32116R2021) verstrekken.

      2 Het voorschot bedraagt ten hoogste:

      a. 50% van de verleende subsidie voor plattelandsinterventies als bedoeld in de artikelen 73 en 77 van [verordening
      2021/2115](32115R2021);

      b. 75% van de verleende subsidie voor plattelandsinterventies als bedoeld in artikel 65, tweede lid, van
      [verordening 2021/2116](32116R2021).

      3 Het voorschot wordt ambtshalve verstrekt binnen twee weken na de datum van de beschikking tot subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.1.7
  - number: 5.1.8
    text: |-
      In afwijking van [artikel 2.14, eerste lid][ref1], bedraagt een deelbetaling ten hoogste 90% van de verleende
      subsidie minus eventueel verstrekte voorschotten.


