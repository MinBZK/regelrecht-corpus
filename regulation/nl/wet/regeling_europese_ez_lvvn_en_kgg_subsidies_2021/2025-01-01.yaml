  - number: 3.6.1
    text: |-
      In deze paragraaf wordt verstaan onder:

        - *algemeen nut beogende instelling:* een instelling als bedoeld in
      [artikel 5b, eerste lid, van de Algemene wet inzake rijksbelastingen][ref1];
        - *brancheorganisatie:* organisatie van marktdeelnemers die is opgericht overeenkomstig artikel 11 van [verordening
      1379/2013](32013R1379);
        - *verordening 1379/2013:* [Verordening (EU) nr. 1379/2013](32013R1379) van het Europees Parlement en de Raad van
      11 december 2013 houdende een gemeenschappelijke marktordening voor visserijproducenten en aquacultuurproducten,
      tot wijziging van [Verordeningen (EG) nr. 1184/2006](32006R1184) en [(EG) nr. 1224/2009](32009R1224) van de Raad en
      tot intrekking van [Verordening (EG) nr. 104/2000](32000R0104) van de Raad (PbEU 2013, L 354);
        - *verwerking en afzet:* alle handelingen, met inbegrip van de behandeling, de bewerking, de productie en de
      distributie, tussen het moment van de aanlanding of oogst en de fase van het eindproduct.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel5b
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel3.6.1
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 5b
  - number: 3.6.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie voor de uitvoering van een project ter ondersteuning van processen in
      verwerking en afzet van visserij- en aquacultuurproducten dat past binnen het doel van het bevorderen van de afzet,
      de kwaliteit en de toegevoegde waarde van visserij- en aquacultuurproducten en de verwerking en afzet van die
      producten, bedoeld in artikel 26, eerste lid, onderdeel b, van [verordening 2021/1139](33039R2021).

      2 Subsidie wordt verstrekt aan:

      a. een onderneming die actief is in de verwerking en afzet van visserij- of aquacultuurproducten;

      b. een visserij- of aquacultuurorganisatie;

      c. een brancheorganisatie;

      d. een vereniging van ondernemingen als bedoeld in onderdelen a of e;

      e. een visserij- of aquacultuuronderneming;

      f. een kennisinstelling;

      g. een algemeen nut beogende instelling;

      h. deelnemers in een samenwerkingsverband.

      3 Aan een samenwerkingsverband kan een onderneming in de detailhandel, bedoeld in artikel 5, onderdeel g, van
      [verordening 1379/2013](32013R1379), deelnemen en neemt in ieder geval een partij als bedoeld in het tweede lid,
      onderdelen a tot en met g, deel.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel3.6.2
  - number: 3.6.3
    text: De subsidie bedraagt 50 procent van de subsidiabele kosten, tot een maximum van € 400.000 per project.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel3.6.3
