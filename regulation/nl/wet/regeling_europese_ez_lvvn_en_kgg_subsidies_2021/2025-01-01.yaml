  - number: 5.2.35
    text: |-
      1 De waarde van de afgezette productie van aangesloten producenten die zijn toegetreden tot de
      producentenorganisatie gedurende de referentieperiode, bedoeld in [artikel 5.2.33][ref1], kan in aanmerking worden
      genomen door bij de bepaling van de waarde van de afgezette productie uit te gaan van:

      a. de vanaf de datum van toetreding bij de producentenorganisatie gerealiseerde waarde van de afgezette productie;
      en

      b. de waarde die is gerealiseerd voorafgaand aan de toetreding tot de producentenorganisatie, bedoeld in
      [artikel 5.2.36][ref2].

      2 Indien voor een aangesloten producent of producentenorganisatie de onderdelen a en b uit het eerste lid in
      combinatie worden toegepast, wordt dubbeltelling uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel5.2.33
      [ref2]: https://wetten.overheid.nl/BWBR0045685#Artikel5.2.36
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.35
    references:
      - id: ref1
