    text: |-
      Onverminderd [artikel 2.19][ref1], bevat de aanvraag tot subsidievaststelling:

      a. gegevens met betrekking tot het halen van de doelstellingen en prioriteiten van het project of de investering
      waarvoor subsidie is aangevraagd;

      b. voor zover van toepassing en voor zover deze nog niet zijn aangeleverd bij de aanvraag om
      subsidie of een aanvraag tot deelbetalingverlening, kopieën van opgevraagde offertes als bedoeld in
      [artikel 3.1.7, tweede lid][ref2], en de relevante redenen voor een op basis van deze offertes genomen
      gunningsbeslissing;

      c. voor zover van toepassing en voor zover deze nog niet zijn aangeleverd bij de aanvraag om subsidie of een
      aanvraag tot deelbetalingverlening, gegevens over de gevolgde procedure en de gunningsbeslissing, bedoeld in
      [artikel 3.1.7, vijfde lid][ref3];

      d. gegevens die aantonen welke communicatieactiviteiten als bedoeld in
      [artikel 2.9, vijfde lid, onderdeel a, onder 6°][ref4], zijn uitgevoerd; en

      e. voor zover van toepassing en direct verbonden met de uitvoering van de subsidiabele activiteit, een overzicht
      van de gereden kilometers met een voertuig, niet zijnde het openbaar vervoer, en de reden van de gemaakte reis.


