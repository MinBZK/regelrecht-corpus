  - number: 1.3c
    text: |-
      1 In afwijking van [artikel 1.3a][ref1] kunnen de kosten, bedoeld in
      [artikel 1.3, eerste lid, aanhef en onderdelen a en b][ref2], worden berekend met inbegrip van de kosten, bedoeld
      in onderdelen c tot en met e van dat artikellid:

      a. door het aantal aan het project bestede uren te vermenigvuldigen met een vast uurtarief van € 67; of

      b. als een vast percentage van een maandtarief van € 9.600 per werknemer bij een voltijd dienstverband van 1.720
      uur per jaar, of een evenredig deel daarvan bij een deeltijd dienstverband, overeenkomstig het vooraf vastgestelde
      vaste percentage van de tijd dat de werknemer per maand aan het project heeft gewerkt, zonder de verplichting om
      een afzonderlijk arbeidstijdregistratiesysteem op te zetten.

      2 De subsidieontvanger stelt een document op met vermelding van de namen van de werknemers en de vaste percentages,
      bedoeld in het eerste lid, aanhef en onderdeel b.

      3 Indien een vast uurtarief, bedoeld in het eerste lid, onderdeel a, wordt gehanteerd, kan het totale aantal voor
      een bepaald jaar per werknemer gedeclareerde uren niet meer bedragen dan 1.720 uren bij een voltijd dienstverband
      of een evenredig deel daarvan bij een deeltijd dienstverband.


