  - number: 5.2.30
    text: |-
      1 Alle artikelen uit [afdeling 5.2.1, §1 tot en met §3][ref1], zijn van overeenkomstige toepassing, tenzij
      de aangesloten producentenorganisaties zelf invulling aan de betreffende artikelen hebben gegeven, waarvan
      in ieder geval de [artikelen 5.2.1][ref2], [5.2.4][ref3], [5.2.6][ref4], [5.2.7][ref5], [5.2.14][ref6],
      [5.2.15][ref7], [5.2.19][ref8], [5.2.26][ref9] en [5.2.27][ref10] van overeenkomstige toepassing zijn op unies
      van producentenorganisaties.

      2 Alle artikelen uit [titel 5.1][ref11] en [afdeling 5.2.2 tot en met afdeling 5.3.5][ref12] zijn van
      overeenkomstige toepassing, tenzij voor de unie van producentenorganisaties een afwijkende regeling is opgenomen.


