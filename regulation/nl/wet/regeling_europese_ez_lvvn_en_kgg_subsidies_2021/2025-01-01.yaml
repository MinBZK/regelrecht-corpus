  - number: 5.2.51
    text: |-
      De uitgaven, bedoeld in deze paragraaf, zijn subsidiabel indien zij op grond van [afdeling 5.3.2][ref1] subsidiabel
      worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.51
    references:
      - id: ref1
        bwb_id: BWBR0045685
        hoofdstuk: '5'
        afdeling: 5.3.2
  - number: 5.2.52
    text: |-
      Onder personeelskosten als bedoeld in artikel 23, eerste lid, en punt 5 van bijlage III van [verordening 2022/126]
      (32026R2022) worden verstaan:

      a. de loonkosten voor personeel in dienst van:

      1°. de producentenorganisatie; of

      2°. een dochteronderneming;

      b. de kosten voor het inhuren van gedetacheerd personeel en uitzendkrachten ingehuurd door de in onderdeel a
      genoemde ondernemingen; en

      c. de arbeidskosten van:

      1°. een lid, indien het lid een natuurlijk persoon is; of

      2°. de eigenaar of directeur van een lid, indien het lid een rechtspersoon is.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.52
  - number: 5.2.53
    text: |-
      1 Voor de kosten, bedoeld in [artikel 5.2.52, onderdeel c][ref1], geldt een forfaitair uurtarief van € 40.

      2 Wanneer een lid van een producentenorganisatie meerdere eigenaren of directeuren heeft, geeft de
      producentenorganisatie bij de indiening van het operationeel programma aan welke eigenaar of directeur de
      activiteiten zal uitvoeren en welke personeelskosten daarvoor worden opgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel5.2.52
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.53
    references:
      - id: ref1
        bwb_id: BWBR0045685
        artikel: 5.2.52
        hoofdstuk: '5'
        paragraaf: '3'
        afdeling: 5.2.3
  - number: 5.2.54
    text: |-
      1 De producentenorganisatie houdt ter onderbouwing van de personeelskosten, bedoeld in artikel 23, eerste lid,
      derde alinea, van [verordening 2022/126](32026R2022), een volledige urenadministratie bij.

      2 Op verzoek van de minister overlegt de producentenorganisatie de urenregistratie en de urenadministratie, bedoeld
      in het eerste lid.

      3 De urenadministratie, bedoeld in het eerste lid:

      a. wordt bijgehouden gedurende het hele uitvoeringsjaar of voor de duur van de arbeidsovereenkomst van de
      medewerker wiens inzet wordt toegerekend aan een project;

      b. omvat alle uren waarvoor de betreffende medewerker een arbeidscontract heeft, waaronder de uren die niet worden
      toegerekend aan projecten;

      c. bevat een korte en duidelijke omschrijving van ter uitvoering van de projecten verrichte werkzaamheden; en

      d. wordt uitgesplitst naar:

      1°. het aantal uren besteed per afzonderlijke subsidiabel project;

      2°. het totale aantal uren besteed aan niet subsidiabele projecten; en

      3°. afwezigheidsuren zoals ziekte en verlof.

      4 Het aantal uren dat in de aanvraag voor een gedeeltelijke betaling of in de aanvraag tot subsidievaststelling per
      activiteit worden aangevraagd overschrijdt niet het aantal uren verleend in de beschikking tot subsidieverlening of
      een goedkeuring naar aanleiding van een onverwijlde melding van een wijziging van een operationeel programma, als
      bedoeld in [artikel 5.2.50, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel5.2.50
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.54
    references:
      - id: ref1
        bwb_id: BWBR0045685
        artikel: 5.2.50
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: 5.2.3
  - number: 5.2.55
    text: |-
      1 De producentenorganisatie berekent en onderbouwt de loonkosten, bedoeld in [artikel 5.2.52, onderdeel a][ref1],
      van de subsidiabele activiteiten aan de hand van uurtarieven op basis van het jaarsalaris van de desbetreffende
      medewerkers.

      2 In het uurtarief, bedoeld in het eerste lid, kan worden opgenomen:

      a. het contractueel of bij CAO overeengekomen brutoloon;

      b. een bij contract of CAO overeengekomen niet winstafhankelijke dertiende maand;

      c. een onregelmatigheidstoeslag;

      d. een ploegentoeslag;

      e. het werkgeversdeel sociale verzekeringswetten;

      f. de voor rekening van de werkgever komende kosten voor de ziektekostenverzekering;

      g. het werkgeversdeel pensioen en vervroegde uittreding; of

      h. dotaties aan pensioenvoorzieningen voor zover onderbouwd kan worden dat hier rechtens afdwingbare verplichtingen
      tegenover staan.

      3 Ten behoeve van de berekening van het uurtarief wordt:

      a. overeenkomstig artikel 23, eerste lid, vierde alinea, van [verordening 2022/126](32026R2022) het jaarsalaris
      gedeeld door 1.720 uren; of

      b. in geval van een niet volledig gewerkt jaar of medewerkers die werkzaam zijn in deeltijd het in onderdeel a
      genoemde aantal van 1.720 uren naar rato toegepast.

      4 Overwerktoeslagen worden niet het in het uurtarief opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel5.2.52
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.55
    references:
      - id: ref1
        bwb_id: BWBR0045685
        artikel: 5.2.52
        hoofdstuk: '5'
        paragraaf: '3'
        afdeling: 5.2.3
  - number: 5.2.56
    text: |-
      1 De producentenorganisatie toont de investering in een duurzaam productiemiddel aan de hand van facturen of
      afleverbonnen aan en verstrekt deze onverwijld aan de Minister, indien de minister daar om verzoekt.

      2 Uit de facturen of afleverbonnen blijkt de datum van verwerving van het activum of de datum waarop het activum
      ter beschikking van de begunstigde wordt gesteld, bedoeld in artikel 11, eerste lid aanhef en onderdeel b, van
      [verordening 2022/126](32026R2022).
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.56
  - number: 5.2.57
    text: |-
      1 Ter uitvoering van artikel 24 van [verordening 2022/126](32026R2022) toont de producentenorganisatie het gebruik
      van een duurzaam productiemiddel aan met behulp van een gebruiksadministratie per productiemiddel, tenzij de
      producentenorganisatie het gebruik van het productiemiddel op andere wijze aantoont ten genoegen van de Minister.

      2 De producentenorganisatie geeft bij de indiening van het operationeel programma aan op welke wijze de
      gebruiksadministratie gevoerd gaat worden.

      3 Uit de gebruiksadministratie blijkt dat het gebruik ten behoeve van producten die vallen onder de sector groenten
      en fruit meer bedraagt dan 50% van het totale gebruik.

      4 Indien een lid aan de hand van zijn administratie kan aantonen dat er in zijn bedrijf geen producten van derden
      worden verhandeld, dan kan worden volstaan met een schriftelijke verklaring van het lid.

      5 Op verzoek van de minister overlegt de producentenorganisatie de gebruiksadministratie, of de in het vierde lid
      bedoelde administratie of verklaring.

      6 De minister kan de gebruiksadministratie, of de in het vierde lid bedoelde administratie of verklaring, opvragen
      gedurende de instandhoudingstermijn bedoeld in [artikel 5.2.63][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel5.2.63
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.57
    references:
      - id: ref1
        bwb_id: BWBR0045685
        artikel: 5.2.63
        hoofdstuk: '5'
        paragraaf: '3'
        afdeling: 5.2.3
  - number: 5.2.58
    text: |-
      1 Advieskosten en kosten voor onderzoek zijn subsidiabel indien ze zijn opgenomen in de totaalfactuur van de
      investering en het bedrijfseconomisch gebruikelijk is om deze te activeren.

      2 De in het eerste lid bedoelde kosten zijn niet subsidiabel als investering in een duurzaam productiemiddel indien
      er een aparte factuur is.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.58
  - number: 5.2.59
    text: |-
      1 In het geval van nieuwbouw of verbouw zijn investeringen in elementaire voorzieningen als afwateringssystemen,
      riolering, aansluiting op waterleiding en aansluiting op systemen voor datacommunicatie, die worden gezien als
      onmisbare elementen op het bedrijf van een lid, producentenorganisatie of een dochteronderneming subsidiabel.

      2 Uitgaven voor de ingebruikname van een duurzaam productiemiddel en de bijkomende kosten van installatie en
      montage, waarvan het fiscaal en bedrijfseconomisch gebruikelijk is dat deze worden geactiveerd, zijn als onderdeel
      van het duurzaam productiemiddel subsidiabel.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.59
  - number: 5.2.60
    text: |-
      1 Uitgaven voor nieuwbouw en verbouw zijn subsidiabel indien het gaat om:

      a. nieuwbouw of verbouw van gebouwen die eigendom zijn van de producentenorganisatie of dochteronderneming; en

      b. nieuwbouw of verbouw die bijdraagt aan de sectorale doelstellingen zoals opgenomen in het project.

      2 De producentenorganisatie onderbouwt bij de indiening van het operationeel programma en de aanvraag tot
      subsidievaststelling over het voorafgaande jaar, bedoeld in [artikel 5.3.193][ref1], de subsidiabele uitgaven,
      bedoeld in het eerste lid, aan de hand van:

      a. bouwtekeningen, die aangeven welk deel van de uitgaven subsidiabele ruimten en subsidiabele elementen betreft;
      en

      b. een uitsplitsing, met gebruikmaking van een door de minister beschikbaar gesteld middel, van subsidiabele en
      niet subsidiabele ruimten en elementen en bijbehorende uitgaven.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel5.3.193
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.60
    references:
      - id: ref1
        bwb_id: BWBR0045685
        artikel: 5.3.193
        hoofdstuk: '5'
        afdeling: 5.3.3
  - number: 5.2.61
    text: |-
      1 De aankoop van onbebouwde grond, bedoeld in punt 6 van bijlage III van [verordening 2022/126](32026R2022), is
      subsidiabel indien deze grond daadwerkelijk wordt aangewend voor de realisatie van in het operationeel programma
      opgenomen investeringen.

      2 De aankoop van grond die wordt gebruikt voor onderdelen van investeringen is subsidiabel indien deze wordt
      aangewend voor nieuwbouw of verbouw, als bedoeld in [artikel 5.2.60][ref1].

      3 De producentenorganisatie toont aan de hand van bouwtekeningen of plattegronden aan welke delen van de grond
      worden aangewend voor in het operationeel programma opgenomen subsidiabele investeringen.

      4 De producentenorganisatie gebruikt de grond binnen de looptijd van het project voor realisatie van de investering
      waarvoor de grond is aangekocht.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel5.2.60
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.61
    references:
      - id: ref1
        bwb_id: BWBR0045685
        artikel: 5.2.60
        hoofdstuk: '5'
        paragraaf: '3'
        afdeling: 5.2.3
  - number: 5.2.62
    text: |-
      1 Een duurzaam productiemiddel, met uitzondering van bomen en meerjarige planten, is eigendom van de
      producentenorganisatie, unie van productenorganisaties of een dochteronderneming.

      2 Een duurzaam productiemiddel die worden gefinancierd door meerdere erkende producentenorganisaties of
      unies van producentenorganisaties is subsidiabel naar rato van het aandeel in de financiering van elk van die
      producentenorganisaties of unies van producentenorganisaties.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.62
  - number: 5.2.63
    text: |-
      1 Ter uitvoering van artikel 11, eerste lid, onderdeel b, van [verordening 2022/126](32026R2022) behoudt de
      eigenaar het eigendom en bezit van een duurzaam productiemiddel tot ten minste vijf jaar vanaf het moment waarop
      het duurzaam productiemiddel ter beschikking is gesteld.

      2 Indien de producentenorganisatie of unie van producentenorganisaties aantoont dat de gebruikelijke fiscale
      afschrijvingsperiode van een investering in een duurzaam productiemiddel korter is dan de periode, bedoeld in het
      eerste lid, blijft een duurzaam productiemiddel tot het einde van de fiscale afschrijvingsperiode in eigendom en
      bezit van de eigenaar.

      3 In afwijking van het eerste en tweede lid wordt de opbrengst van bomen en meerjarige planten, geleverd aan de
      producentenorganisatie, unie van producentenorganisaties of dochteronderneming:

      a. tot ten minste vijf jaar vanaf het moment waarop het duurzaam productiemiddel ter beschikking is gesteld; of

      b. indien de producentenorganisatie of unie van producentenorganisaties aantoont dat de fiscale
      afschrijvingsperiode van de boom of meerjarige plant korter is dan de periode, bedoeld in onderdeel a, tot ten
      minste het einde van de fiscale afschrijvingsperiode.

      4 Indien een producentenorganisatie, unie van producentenorganisaties of een dochteronderneming daarvan de eigenaar
      is van een duurzaam productiemiddel en een lid van de producentenorganisatie of de unie van producentenorganisaties
      de houder is van dat duurzaam productiemiddel, geldt de termijn, bedoeld in het eerste, tweede of derde lid,
      slechts voor het eigendom van het duurzaam productiemiddel.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.63
  - number: 5.2.64
    text: |-
      1 Indien, binnen de termijn bedoeld in [artikel 5.2.63][ref1], een lid de producentenorganisatie verlaat of een
      producentenorganisatie de unie van producentenorganisaties verlaat, wordt een duurzaam productiemiddel dat op het
      terrein van het lid of van de producentenorganisaties of een dochteronderneming daarvan is geplaatst, herplaatst of
      vordert de producentenorganisatie of unie van producentenorganisaties binnen twee maanden na datum van uittreding
      de restwaarde van het duurzaam productiemiddel terug en stort deze in het actiefonds.

      2 In geval van herplaatsing van een duurzaam productiemiddel dat is gefinancierd met behulp van het actiefonds van
      een producentenorganisatie wordt het op het terrein van het uittredende lid geplaatste duurzaam productiemiddel
      herplaatst op een locatie van de producentenorganisatie, een dochteronderneming, of een lid.

      3 In geval van herplaatsing van een duurzaam productiemiddel dat is gefinancierd met behulp van het actiefonds
      van een unie van producentenorganisaties wordt het duurzaam productiemiddel herplaatst op een locatie van de unie
      van producentenorganisaties, een aangesloten producentenorganisatie, een dochteronderneming of een lid van een
      aangesloten producentenorganisatie.

      4 De restwaarde wordt bepaald naar evenredigheid van het aantal volledige maanden dat resteert tot het einde van de
      periode, bedoeld in [artikel 5.2.63][ref2].

      5 Indien de producentenorganisatie of unie van producentenorganisaties in het jaar waarin de restwaarde in het
      actiefonds wordt gestort en in de twee daaropvolgende jaren geen operationeel programma heeft, wordt het gedeelte
      van de restwaarde waarvoor Uniesteun is betaald door de minister gerecupereerd.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel5.2.63
      [ref2]: https://wetten.overheid.nl/BWBR0045685#Artikel5.2.63
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.64
