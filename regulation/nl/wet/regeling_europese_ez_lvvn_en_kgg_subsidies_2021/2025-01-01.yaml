    text: De subsidie bedraagt ten minste € 125.000 en ten hoogste € 200.000 per project.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.4.3
  - number: 5.4.4
    text: |-
      1 De minister verleent eenmaal per uitvoeringsjaar een betaling.

      2 De betaling bedraagt per uitvoeringsjaar ten hoogste € 80.000.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.4.4
  - number: 5.4.5
    text: |-
      1 Voor subsidie komen uitsluitend kosten als bedoeld in artikel 22, derde lid, artikel 23 en bijlage III van
      [verordening 2022/126](32026R2022) in aanmerking ten behoeve van het project voor zover zij direct verbonden zijn
      met de uitvoering van de desbetreffende subsidiabele activiteit.

      2 De aanvrager berekent de subsidiabele kosten overeenkomstig
      [artikel 5.1.3, eerste lid, onderdeel a, en tweede en derde lid][ref1].

      3 In afwijking van het tweede lid kunnen kennisinstellingen de integrale kostensystematiek, bedoeld in
      [artikel 1.3b][ref2], hanteren.

      4 Als andere kosten als bedoeld in [artikel 1.3, onderdeel d][ref3], komen in aanmerking:

      a. Reis- en verblijfkosten overeenkomstig de voorwaarden in [artikel 5.4.6][ref4];

      b. Aanschaf van materialen overeenkomstig bijlage III, punt 7, van [verordening 2022/126](32026R2022);

      c. Kosten derden, voor zover deze derden niet betrokken zijn bij de rangschikking van de aanvragen.

      5 De uitgavenposten, bedoeld in het vierde lid, onderdelen b en c, worden onderbouwd door middel van drie onderling
      vergelijkbare kostenbegrotingen.

      6 In afwijking van het vijfde lid kan een begroting voor een uitgavenpost voor een activiteit waarvan de uitgaven
      in een uitvoeringsjaar worden geraamd op minder dan € 25.000 worden onderbouwd aan de hand van een enkele
      kostenbegroting.

      7 Indien een uitgavenpost voor een activiteit aantoonbaar door slechts een enkele of ten hoogste twee partijen kan
      worden uitgevoerd of begroot, wordt een begroting, in afwijking van het vijfde lid, onderbouwd met de beschikbare
      kostenbegroting of kostenbegrotingen.

      8 Indien een begroting voor een uitgavenpost wordt onderbouwd aan de hand van meerdere kostenbegrotingen wordt de
      economisch meest voordelige kostenbegroting gekozen. De keuze voor de in de begroting opgenomen kostenbegroting
      wordt voldoende gemotiveerd.


