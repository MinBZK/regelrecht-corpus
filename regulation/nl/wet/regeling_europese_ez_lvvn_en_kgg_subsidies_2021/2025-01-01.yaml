      1 Als producten als bedoeld in artikel 47, tweede lid, onderdelen g en h, van [verordening 2021/2115](32115R2021)
      worden aangewezen:

      a. tomaten met GN code 0702 00 00;

      b. niet-scherpsmakende pepers (paprika’s) met GN code 0709 60 10;

      c. bloemkool en broccoli met GN code 0704 10 00;

      d. komkommers met GN code 0707 00 05;

      e. appelen met GN code 0808 10;

      f. peren met GN code 0808 30; en

      g. aardbeien met GN code 0810 10.

      h. aubergines met GN code 0709 30.

      2 In het geval van een crisis kan de minister besluiten om uitgaven voor het groen oogsten en niet oogsten van
      producten als bedoeld in [artikelen 5.3.179 tot en met 5.3.184][ref1] ook voor andere producten subsidiabel te
      stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel5.3.179
