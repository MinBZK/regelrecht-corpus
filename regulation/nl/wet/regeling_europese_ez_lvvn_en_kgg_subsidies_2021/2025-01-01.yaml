    text: |-
      Onverminderd de [artikelen 2.9][ref1] en [3.1.4][ref2] gaat een aanvraag tot subsidieverlening vergezeld van de
      volgende gegevens:

      a. indien de aanvraag om subsidie wordt ingediend door een visserijonderneming, een visserijorganisatie of een
      samenwerkingsverband waaraan geen kennisinstelling deelneemt:

      1°. een beschrijving waaruit blijkt hoe de actieve betrokkenheid van een kennisinstelling bij een project wordt
      geborgd;

      2°. een verklaring van de kennisinstelling waaruit blijkt dat deze bereid is om actief betrokken te zijn,
      overeenkomstig de beschrijving, bedoeld onder 1°, en om de resultaten van het project te valideren;

      b. indien de aanvraag wordt ingediend door een visserijorganisatie of door een samenwerkingsverband waarin een
      visserijorganisatie deelneemt, een kopie van de statuten van de visserijorganisatie;

      c. indien de aanvraag wordt ingediend voor een project waarvoor een of meer vissersvaartuigen wordt of worden
      ingezet, voor elk vissersvaartuig het nummer waaronder het geregistreerd staat in het register, bedoeld in
      [artikel 4 van het Besluit registratie vissersvaartuigen 1998][ref3].


