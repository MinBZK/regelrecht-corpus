  - number: 5.7.28
    text: |-
      1 De minister verstrekt op aanvraag subsidie voor kennisoverdracht over de omschakeling naar duurzame landbouw in
      de vorm van demonstratieprojecten aan:

      a. een individuele landbouwer die een aanvraag indient voor een demonstratieproject om zelf demonstratiebedrijf en
      daarmee aanbieder van kennisoverdracht en voorlichting te willen zijn;

      b. een landbouwer die een aanvraag indient voor zichzelf en maximaal twee andere landbouwers die allen
      demonstratiebedrijf willen zijn;

      c. een onderneming niet zijnde een landbouwer die als penvoerder een aanvraag indient voor een demonstratieproject
      voor minimaal twee en maximaal drie landbouwers die allen demonstratiebedrijf willen zijn.

      2 De omschakeling naar duurzame landbouw, bedoeld in het eerste lid, heeft betrekking op minimaal vijf van de
      volgende onderwerpen, waarvan emissiereductie stikstof één van de vijf onderwerpen moet zijn:

      a. emissiereductie stikstof;

      b. emissiereductie gewasbeschermingsmiddelen en toepassing van geïntegreerde gewasbescherming;

      c. emissiereductie broeikasgassen;

      d. emissiereductie nitraat en andere meststoffen;

      e. vergroten biodiversiteit;

      f. versterken duurzaam bodembeheer;

      g. verhogen aandeel circulair veevoergebruik;

      h. verbeteren dierenwelzijn en diergezondheid.

      3 De subsidie, bedoeld in het eerste lid, wordt niet verstrekt aan:

      a. een onderneming die gewasbeschermingsmiddelen, diervoeders, landbouwmechanisatieproducten of meststoffen
      verkoopt;

      b. een onderneming die in een groep verbonden is aan een onderneming die producten als bedoeld in onderdeel a
      verkoopt.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.7.28
  - number: 5.7.29
    text: |-
      1 De subsidie bedraagt 100% van de subsidiabele kosten.

      2 De subsidie bedraagt ten minste € 75.000,– en ten hoogste € 360.000,– per demonstratieproject.

      3 De subsidie bedraagt ten minste € 75.000,– en ten hoogste € 120.000 per demonstratiebedrijf in drie jaar.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.7.29
  - number: 5.7.30
    text: |-
      1 De minister verleent ten hoogste tweemaal per jaar een deelbetaling.

      2 De aanvraag tot deelbetaling bedraagt ten minste 25% of € 25.000 van de verleende subsidie.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.7.30
  - number: 5.7.31
    text: |-
      1 In afwijking van [artikel 1.4, onderdeel d][ref1], komen voor subsidie in aanmerking kosten van de uitvoering
      van voorlichtings- en demonstratieactiviteiten, met inbegrip van kosten voor het verzamelen en analyseren van
      data noodzakelijk voor de demonstratie over het effect van duurzame maatregelen en toepassingen, kosten voor de
      inrichting van ontvangstruimte en materiaalkosten ten behoeve van deze activiteiten door de aanvragers.

      2 Voor subsidie komen niet in aanmerking kosten voor de ontwikkeling, aanschaf of aanleg van middelen ten behoeve
      van demonstratieprojecten in verband met investeringen ten behoeve van de omschakelmaatregelen.

      3 De subsidieontvanger berekent de subsidiabele kosten overeenkomstig
      [artikel 5.1.3, eerste lid, onderdeel a en tweede lid en derde lid][ref2], overeenkomstig [artikel 5.1.3a][ref3] of
      overeenkomstig [artikel 5.1.3b, tweede en vierde lid][ref4].


