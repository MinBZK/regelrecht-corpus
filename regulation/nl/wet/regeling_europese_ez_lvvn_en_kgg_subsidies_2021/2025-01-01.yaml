  - number: 5.3.9
    text: |-
      1 De activiteiten in [paragraaf 6][ref1] en [7][ref2] van deze afdeling dragen bij aan
      agromilieuklimaatdoelstellingen, als bedoeld in artikel 12 van [verordening 2022/126](32026R2022), indien:

      a. de producentenorganisatie het verwachte voordeel en extra effect van de interventie in verband met
      agromilieuklimaatdoelstellingen ex ante aantoont, overeenkomstig artikel 12, tweede lid, van [verordening 2022/126]
      (32026R2022); en

      b. de producentenorganisatie een herzieningsclausule, als bedoeld in artikel 12, vijfde lid, van [verordening
      2022/126](32026R2022), opneemt in haar operationeel programma.

      2 In aanvulling op het eerste lid toont de producentenorganisatie in het geval van een investering in een duurzaam
      productiemiddel een reductie van ten minste 15% op verbruik aan ten opzichte van de daarvoor bestaande situatie
      van:

      a. het gebruik van productiemiddelen die niet-hernieuwbare natuurlijke hulpbronnen zijn, zoals water of fossiele
      brandstof, of een mogelijke bron van milieuvervuiling zijn, zoals meststoffen, gewasbeschermingsmiddelen of
      bepaalde soorten energiebronnen;

      b. de uitstoot van lucht-, bodem- of waterverontreinigende stoffen in het productieproces, of

      c. de productie van afval, waaronder afvalwater in het productieproces.

      3 Het tweede lid is niet van toepassing:

      a. voor zover het meststoffen en gewasbeschermingsmiddelen betreft in het geval van biologische productie; of

      b. in het geval van een investering in een duurzaam productiemiddel als bedoeld in de [artikelen 5.3.91][ref3],
      [5.3.94][ref4], [5.3.95][ref5], [5.3.97][ref6], [5.3.124][ref7] en [5.3.125][ref8].

      4 In het geval van activiteiten als bedoeld in de [artikelen 5.3.82][ref9], [5.3.86][ref10], [5.3.87][ref11],
      [5.3.88][ref12], [5.3.92][ref13], [5.3.93][ref14], [5.3.133][ref15] en [5.3.134][ref16] moet de daadwerkelijke
      waterbesparing worden aangetoond.


