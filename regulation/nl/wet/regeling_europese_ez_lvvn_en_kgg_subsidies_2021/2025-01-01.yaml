  - number: '2.19'
    text: |-
      1 De subsidieontvanger, of indien subsidieontvangers samenwerken in een samenwerkingsverband de penvoerder, dient
      een aanvraag tot subsidievaststelling in uiterlijk dertien weken na het tijdstip waarop de activiteiten moeten
      zijn voltooid.

      2 De aanvraag wordt ingediend met gebruikmaking van een middel dat door de minister beschikbaar wordt gesteld.

      3 Bij een aanvraag tot subsidievaststelling wordt in voorkomend geval mededeling gedaan van andere inkomsten,
      waaronder subsidies, waarmee de activiteit waarop de subsidie betrekking heeft is gefinancierd.

      4 De aanvraag tot subsidievaststelling bevat in ieder geval:

      a. gegevens over de subsidieontvanger, waaronder de naam, het adres en het door de minister toegekende
      referentienummer;

      b. gegevens over de hoogte van de gemaakte subsidiabele kosten of over de verrichte prestatie; en

      c. gegevens die aantonen dat de communicatieactiviteiten, bedoeld in
      [artikel 2.9, vijfde lid, onderdeel a, subonderdeel 6°][ref1], zijn uitgevoerd.

      5 Een aanvraag tot subsidievaststelling gaat vergezeld van een eindverslag indien de beschikking tot
      subsidieverlening betrekking heeft op een projectplan. Het eindverslag bevat ten minste:

      a. een samenvatting van het project;

      b. een beschrijving van de activiteiten die in het kader van het project zijn verricht;

      c. een evaluatie van de mate waarin de activiteiten hebben bijgedragen aan de doelstellingen, omschreven in het
      projectplan waarop de beschikking tot subsidieverlening betrekking heeft;

      d. de kennis en informatie die met het project zijn opgedaan; en

      e. de wijze waarop de kennis en informatie, bedoeld in onderdeel c, openbaar is of zal worden gemaakt, indien in
      deze regeling is bepaald dat openbaarmaking plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel2.9
