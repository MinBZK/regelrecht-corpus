  - number: 5.2.26
    text: |-
      1 Een erkenning kan op verzoek van de producentenorganisatie worden gewijzigd of beëindigd met ingang van
      1 januari.

      2 De producentenorganisatie dient een verzoek tot wijziging van de erkenning in uiterlijk op 1 september
      voorafgaand aan het jaar met ingang waarvan wijziging van de erkenning wordt gevraagd.

      3 De producentenorganisatie dient een verzoek tot beëindiging van de erkenning in uiterlijk op 1 december
      voorafgaand aan het jaar met ingang waarvan beëindiging van de erkenning wordt gevraagd.

      4 Een lijst met de namen en contactgegevens van alle in Nederland erkende producentenorganisaties wordt
      gepubliceerd op de website van de Rijksdienst voor Ondernemend Nederland. Deze lijst wordt jaarlijks
      geactualiseerd.

      5 In afwijking van het eerste lid en het derde kan een erkenning op verzoek van de producentenorganisatie die geen
      operationeel programma uitvoert, op ieder moment worden beëindigd. Het verzoek tot beëindiging van de erkenning kan
      op ieder moment worden ingediend.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.26
  - number: 5.2.27
    text: |-
      1 De producentenorganisatie informeert de minister onverwijld over:

      a. wijzigingen in de statuten en het huishoudelijk reglement;

      b. wijzigingen in de organisatiestructuur; en

      c. voornemens tot fusie of samenwerking.

      2 Bij de melding van de wijzigingen, bedoeld in het eerste lid, onderdeel a, overlegt de producentenorganisatie in
      ieder geval de gewijzigde statuten of het gewijzigde huishoudelijk reglement.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.27
  - number: 5.2.28
    text: |-
      1 De producentenorganisatie overlegt jaarlijks voor 1 maart aan de Minister:

      a. de verslagen van de in het afgelopen boekjaar gehouden algemene vergaderingen;

      b. een ledenlijst per 1 januari van het lopende jaar, met gebruikmaking van een door de minister beschikbaar
      gesteld middel inclusief vermelding van de niet-producerende leden, nieuwe leden en leden die gedurende
      het vorige jaar zijn uitgetreden, onder vermelding van de datum van uittreding, alsook van de leden waarop
      [artikel 5.2.4, vijfde lid][ref1], van toepassing is; en

      c. een parafenlijst van tekenbevoegde personen binnen de producentenorganisatie.

      2 De producentenorganisatie overlegt jaarlijks uiterlijk op 1 juni, met gebruikmaking van een door de minister
      beschikbaar gesteld middel, aan de minister een samenvattend overzicht van:

      a. de door de leden op grond van [artikel 5.2.11, derde lid, onderdeel a, onder 1° tot en met 4°][ref2], aan de
      producentenorganisatie verstrekte informatie;

      b. het areaal van de leden van de producentenorganisatie;

      c. de door de leden van de producentenorganisatie geteelde gewassen;

      d. de hoeveelheden en waarden van een product waarvoor aan de leden een toestemming op grond van artikel 12 van
      [verordening 2017/891](32791R2017) is verleend; en

      e. de omzet van de producentenorganisatie.

      3 De producentenorganisatie overlegt jaarlijks uiterlijk op 1 oktober de jaarrekening over het laatste
      uitvoeringsjaar, voorzien van een controleverklaring van een extern accountant.

      4 De verplichting om een controleverklaring van een extern accountant te overleggen als bedoeld in het
      derde lid is niet van toepassing op een producentenorganisatie die een rechtspersoon is als bedoeld in
      [artikel 396, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel5.2.4
      [ref2]: https://wetten.overheid.nl/BWBR0045685#Artikel5.2.11
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel396
