  - number: 5.5.1
    text: |-
      In deze titel wordt verstaan onder:

        - *brede weersverzekering:* goedgekeurde verzekering als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref1] tegen de financiële gevolgen van ongunstige
      weersomstandigheden in open teelten;
        - *landbouwer:* natuurlijke of rechtspersoon of een groep natuurlijke of rechtspersonen die een minimumniveau aan
      landbouwactiviteiten uitvoert;
        - *open teelten:* open teelten van de sectoren akkerbouw, vollegrondsgroententeelt, bollenteelt, sierteelt,
      fruitteelt en boomkwekerij;
        - *premie:* premie, bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref2];
        - *schade-expert:* deskundige op het gebied van schade die de gedragscode van expertiseorganisaties van het Verbond
      van Verzekeraars of een daarmee gelijk te stellen gedragscode in acht neemt;
        - *verzekeraar:* verzekeraar, bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref3];
        - *verzekeringspolis:* bewijs van verzekering tussen landbouwer en verzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel11
