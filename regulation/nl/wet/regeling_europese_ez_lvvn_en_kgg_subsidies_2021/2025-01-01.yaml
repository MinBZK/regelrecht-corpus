  - number: 5.9.1
    text: |-
      In deze titel wordt verstaan onder:

        - *bedrijfsplan:* plan voor de ontwikkeling van een bedrijf van een jonge landbouwer en het bijdragen aan het
      bereiken van de specifieke doelstellingen, bedoeld in artikel 6, eerste lid, onderdelen d, e en f, en tweede lid,
      van [verordening 2021/2115](32115R2021);
        - *gedeeltelijke overname:* een overname waarbij een jonge landbouwer een bedrijf niet volledig maar wel voor meer
      dan vijftig procent economisch en juridisch in eigendom krijgt door meer dan vijftig procent van de overnamesom
      te financieren;
        - *generatievernieuwing:* het bevorderen van agrarisch ondernemerschap door jonge landbouwers als bedoeld in de
      artikelen 6, eerste lid, onder g, en 75, eerste lid, van [verordening 2021/2115](32115R2021);
        - *standaardverdiencapaciteit:* het in Nederland gehanteerde kengetal dat een maatstaf is voor de toegevoegde
      waarde van een bedrijf doordat het de vergoeding weergeeft van arbeid en kapitaal op basis van standaarden,
      ongeacht wie arbeid of kapitaal levert;
        - *vestiging:* het volledig of gedeeltelijk starten of overnemen van een landbouwbedrijf door een jonge landbouwer
      als bedrijfshoofd op basis van een gedateerd en ondertekend overnamedocument;
        - *volledige overname:* een overname waarbij een jonge landbouwer een bedrijf volledig economisch en juridisch in
      eigendom krijgt.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.9.1
  - number: 5.9.2
    text: |-
      De minister verstrekt op aanvraag subsidie aan een jonge landbouwer vanwege de vestiging van een bedrijf, ter
      bevordering van generatievernieuwing in de landbouw.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.9.2
  - number: 5.9.3
    text: De hoogte van de subsidie bedraagt € 80.000.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.9.3
  - number: 5.9.4
    text: De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.9.4
  - number: 5.9.5
    text: |-
      1 Onverminderd [artikel 2.11][ref1] beslist de minister afwijzend op een aanvraag indien:

      a) de jonge landbouwer op 31 december van het aanvraagjaar een leeftijd heeft van jonger dan 16 jaar of ouder dan
      39 jaar;

      b) de jonge landbouwer niet beschikt over een passende opleiding of passende vaardigheden;

      c) het landbouwbedrijf waar de jonge landbouwer bedrijfshoofd van is, niet is ingeschreven in het Handelsregister,
      bedoeld in [artikel 2 van de Handelsregisterwet 2007][ref2], waarbij bij de inschrijving een verkorte omschrijving
      van de landbouwactiviteit is vermeld en de daarbij behorende code van de Standaard Bedrijfsindeling (SBI) beginnend
      met de cijfers 011, 012, 013, 014, 015, 016 of 1051, voor zover minimaal 50 procent van de melk die wordt verwerkt
      op het eigen melkveebedrijf geproduceerd wordt;

      d) de standaardverdiencapaciteit van het bedrijf waar de jonge landbouwer bedrijfshoofd van is, niet minimaal
      15.000 euro bedraagt;

      e) de jonge landbouwer geen bedrijfshoofd is op de datum van indiening van de aanvraag;

      f) de vestiging van het bedrijf heeft plaats gevonden voor 1 januari 2023;

      g) aan de jonge landbouwer of vanwege de vestiging van het bedrijf reeds subsidie is verstrekt op grond van
      [artikel 5.9.2][ref3].

      2 Een jonge landbouwer beschikt over een passende opleiding of passende vaardigheden als bedoeld in het eerste lid,
      onderdeel b, indien deze beschikt over:

      a) een diploma of een getuigschrift van een opleiding landbouw, tuinbouw of aanverwant op het niveau middelbaar
      beroepsonderwijs of hoger onderwijs; of

      b) een bewijs van ten minste twee jaar aantoonbare ervaring met land- en tuinbouwproductie, op het tijdstip van de
      subsidieaanvraag, tellend vanaf het moment dat de leeftijd van 16 jaar is bereikt, aangevuld met een diploma of een
      getuigschrift van een cursus op het gebied van bedrijfsovername of agrarische bedrijfsvoering.

      3 Een jonge landbouwer is bedrijfshoofd als bedoeld in het eerste lid, onderdeel e, indien deze op de datum van
      indiening van de aanvraag:

      a) als natuurlijk persoon een landbouwbedrijf in eigen naam uitoefent; of

      b) doorslaggevende zeggenschap heeft in een landbouwbedrijf; en

      c) als natuurlijk persoon daadwerkelijke langdurige zeggenschap heeft in een landbouwbedrijf als bedoeld in
      [artikel 16 van de Uitvoeringsregeling GLB 2023][ref4], zonder dat de datum, bedoeld in artikel 16, tweede lid, van
      die regeling, hierbij van toepassing is; en

      d) minimaal het aantal uren per kalenderjaar, als vermeld in
      [artikel 3.6, eerste lid, aanhef, van de Wet inkomstenbelasting 2021][ref5], werkzaam is in het bedrijf.

      4 Van doorslaggevende zeggenschap als bedoeld in het derde lid, onderdeel b, is sprake, ingeval een jonge
      landbouwer:

      a) het bedrijf als eenmanszaak voert;

      b) met meer dan 50 procent van het eigen vermogen van het landbouwbedrijf bij schriftelijke overeenkomst deelneemt
      in een maatschap of vennootschap onder firma; of

      c) meer dan 50 procent van de aandelen bezit in geval van een naamloze vennootschap of besloten vennootschap.

      5 Indien aan het landbouwbedrijf meerdere jonge landbouwers als bedrijfshoofd deelnemen, dan hebben zij ten minste
      gezamenlijk de vereiste daadwerkelijke langdurige zeggenschap en doorslaggevende zeggenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel2.11
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0045685#Artikel5.9.2
      [ref4]: https://wetten.overheid.nl/BWBR0047444#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0011353#Artikel3.6
