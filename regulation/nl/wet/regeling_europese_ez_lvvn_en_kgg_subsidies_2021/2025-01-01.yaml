        paragraaf: 5.8.3
  - number: 5.8.3.3
    text: |-
      1 Voor subsidie komen in aanmerking kosten die verband houden met alle aspecten van de samenwerking ten behoeve van
      de uitvoering van het project, overeenkomstig de tabel van [bijlage 3][ref1] en voor zover deze zien op:

      a. kosten voor de uitwerking van het plan;

      b. kosten voor bedrijfsplannen;

      c. kosten voor het begeleiden en uitvoeren van bedrijfsplannen en van de uitwerking;

      d. kosten voor communicatie;

      e. kosten voor rapportage;

      f. kosten voor de aanschaf en het plaatsen van waterinfiltratiesystemen;

      g. kosten voor de aanschaf en het plaatsen van digitale grondwaterpeilbuizen;

      h. kosten voor beheermaatregelen.

      2 De aanvrager berekent de subsidiabele kosten overeenkomstig [artikel 5.1.3a][ref2].

      3 In afwijking van het vorige lid en [artikel 5.1.2][ref3] worden de kosten voor de beheermaatregelen,
      bedoeld in het eerste lid, onderdeel h, bepaald op basis van de vaste vergoedingen opgenomen in
      [bijlage 3, onderdeel 6][ref4].

      4 Voor subsidie komen niet in aanmerking: kosten voor vrijwilligers.


