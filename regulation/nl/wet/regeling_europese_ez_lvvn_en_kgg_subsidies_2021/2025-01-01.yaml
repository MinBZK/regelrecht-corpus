  - number: 4.4.2
    text: |-
      1 Het subsidieplafond voor subsidies als bedoeld in [artikel 4.4.1][ref1] is voor de gehele programmaperiode:

      a. voor het programma Interreg Duitsland – Nederland € 25.706.117;

      b. voor het programma Interreg Maas-Rijn € 4.336.389;

      c. voor het programma Interreg Vlaanderen-Nederland € 18.957.494.

      2 De Minister maakt de in het eerste lid bedoelde subsidieplafonds op verzoek van de beheerautoriteiten in
      voorschotten over naar de beheerautoriteiten.

      3 Rentebaten over een voorschot worden op dezelfde wijze besteed als de programmasubsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel4.4.1
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel4.4.2
