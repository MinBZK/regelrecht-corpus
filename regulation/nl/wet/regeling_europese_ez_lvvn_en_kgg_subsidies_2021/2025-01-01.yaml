  - number: 5.3.4
    text: |-
      1 In afwijking van [artikel 2.4][ref1] verdeelt de Minister het subsidieplafond overeenkomstig de voorschriften in
      artikel 52 van [verordening 2021/2115](32115R2021).

      2 Op aanvraag van een producentenorganisatie wordt het vastgestelde maximum percentage aan financiële EU-steun
      verhoogd voor een operationeel programma of een gedeelte daarvan, indien wordt voldaan aan artikel 52, vierde,
      vijfde of zesde lid van [verordening 2021/2115](32115R2021).


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel2.4
