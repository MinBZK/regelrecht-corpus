  - number: 5.1.3
    text: |-
      1 Voor de berekening van de arbeidskosten kiest de aanvrager uit één van de volgende berekeningswijzen:

      a. de arbeidskosten kunnen worden berekend door:

      1°. in het geval van eigen arbeid, het aantal aan het project bestede uren te vermenigvuldigen met een uurtarief
      van € 50,–;

      2°. in het geval van loonkosten, een per medewerker bepaald individueel uurtarief, berekend overeenkomstig het
      tweede lid, te vermenigvuldigen met het aantal door de medewerker aan het project bestede uren, waarna dat bedrag
      met 15% wordt vermeerderd voor overhead;

      b. de arbeidskosten kunnen worden berekend door het aantal aan het project bestede uren te vermenigvuldigen met de
      volgende uurtarieven:

      1°. € 44,– voor de arbeidskosten van een projectmedewerker;

      2°. € 50,– voor de arbeidskosten van een landbouwer;

      3°. € 78,– voor de arbeidskosten van een adviseur;

      4°. € 88,– voor de arbeidskosten van een projectleider.

      2 Het uurtarief, bedoeld in het eerste lid, onderdeel a, onder 2°, wordt berekend door het bruto jaarloon,
      vermeerderd met 44,2% voor werkgeverslasten, te delen door 1.720 uur op basis van een 40-urige werkweek, of in
      geval van een niet volledig gewerkt jaar of medewerkers die werkzaam zijn in deeltijd een naar rato toegepast
      aantal uren.

      3 Voor de berekening van overige kosten, wordt een factuur of een document met gelijkwaardige bewijskracht
      overlegd.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.1.3
  - number: 5.1.3a
    text: |-
      1 De arbeidskosten worden berekend door de overige kosten te vermenigvuldigen met 0,23.

      2 De overige kosten worden berekend door een factuur of een document met gelijkwaardige bewijskracht te overleggen.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.1.3a
  - number: 5.1.3b
    text: |-
      1 Voor de berekening van de subsidiabele kosten kiest de aanvrager uit één van de berekeningswijzen genoemd in het
      tweede of derde lid.

      2 De subsidiabele kosten kunnen worden berekend door:

      a. in het geval van arbeidskosten, het aantal aan het project bestede uren te vermenigvuldigen met:

      1°. voor eigen arbeid, een uurtarief van € 43;

      2°. voor loonkosten, een per medewerker bepaald individueel uurtarief, berekend overeenkomstig
      [artikel 5.1.3, tweede lid][ref1]; en

      b. de in onderdeel a berekende arbeidskosten te vermenigvuldigen met 0,4 voor de overige kosten.

      3 De subsidiabele kosten kunnen worden berekend door het aantal aan het project bestede uren te vermenigvuldigen
      met de volgende uurtarieven:

      1°. € 54,– voor de arbeidskosten van een projectmedewerker;

      2°. € 60,– voor de arbeidskosten van een landbouwer;

      3°. € 95,– voor de arbeidskosten van een adviseur;

      4°. € 107,– voor de arbeidskosten van een projectleider/ expert.

      4 Indien deelnemers aan een samenwerkingsverband het tweede lid van dit artikel toepassen voor de berekening
      van de subsidiabele kosten, worden de overige kosten van een kennisinstelling die gebruik maakt van de integrale
      kostensystematiek, bedoeld in [artikel 1.3b, eerste lid][ref2], niet toegerekend aan het project.

      5 Indien investeringskosten of meerdere percentages van de subsidiabele kosten onderdeel kunnen zijn van de
      berekening van de hoogte van de subsidie, maakt de aanvrager geen gebruik van de berekeningswijze, bedoeld in het
      tweede lid, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel5.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0045685#Artikel1.3b
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.1.3b
