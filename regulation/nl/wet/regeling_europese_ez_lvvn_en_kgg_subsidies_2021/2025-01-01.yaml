  - number: 5.6.10
    text: |-
      1 Onverminderd [artikel 2.9][ref1] wordt de aanvraag ingediend met gebruikmaking van een format dat door de
      minister beschikbaar wordt gesteld en neemt de penvoerder in het bij de aanvraag gevoegde het projectplan op:

      a. de startdatum van het project;

      b. de te verwachten resultaten;

      c. de beoogde activiteiten voor de kennisverspreiding van de resultaten met gebruik van de hiertoe geëigende
      netwerken;

      d. de mogelijke risico’s en randvoorwaarden;

      e. de mogelijke negatieve omgevingseffecten;

      f. een beschrijving van de rol en de taken van de bij de uitvoering van het plan betrokken partijen; en

      g. een beschrijving van de innovativiteit ten opzichte van bestaande initiatieven.

      2 Onverminderd het eerste lid neemt de penvoerder in het projectplan van een project dat gericht is op de
      categorie, bedoeld in [artikel 5.6.2, zesde lid, onderdeel b][ref2], op:

      a. gegevens die aantonen dat in het jaar voorafgaand aan de aanvraag passende maatregelen
      zijn getroffen ter voorkoming van staartbijten en andere gedragsstoornissen, als bedoeld in
      [artikel 2.3, onderdeel b, onder 3, van het Besluit diergeneeskundigen][ref3];

      b. een beschrijving van de wijze waarop is voldaan aan [artikel 2.22 van het Besluit houders van dieren][ref4];

      c. gegevens die aantonen dat het risico op staartbijten relatief laag is of aannemelijk maken dat dit risico
      relatief laag zal zijn als gevolg van het project;

      d. het aandeel grootvee-eenheden, bedoeld in [artikel 1 van de Uitvoeringsregeling GLB 2023][ref5], die deelnemen
      aan het project.

      3 Onverminderd het eerste lid onderbouwt de penvoerder in het projectplan van een project dat gericht is op
      de categorie, bedoeld in [artikel 5.6.2, zesde lid, onderdeel a][ref6], dat het project niet bijdraagt aan een
      vervroegd pensioen van landbouwers.

      4 De penvoerder maakt een samenvatting en de resultaten van het project openbaar via de geëigende netwerken,
      bedoeld in het eerste lid, onderdeel c.

      5 Onverminderd [artikel 2.18][ref7], dient de penvoerder jaarlijks en bij de aanvraag van een deelbetaling een
      tussenrapportage in bij de minister. Deze tussenrapportage bevat een overzicht van de uitgevoerde activiteiten en
      de behaalde deelresultaten.

      6 Onverminderd het derde lid en de [artikelen 2.18, eerste lid][ref8] en [2.19, vijfde lid][ref9], bevatten een
      tussenrapportage en eindverslag de volgende gegevens:

      a. het aantal personen dat van advies, opleiding, kennisuitwisseling of deelname aan de operationele groep heeft
      geprofiteerd om betere duurzame economische, sociale, milieu en klimaatprestaties en prestaties op het gebied van
      hulpbronnenefficiëntie te leveren;

      b. in het geval van een project als bedoeld in het tweede lid, de staartlengte van en schade aan staarten bij de
      varkens die onderdeel zijn van het project, zoals geregistreerd door de deskundige, bedoeld in het zevende lid.

      7 Een project als bedoeld in het tweede lid wordt begeleid door een dierenarts of andere deskundige op het
      gebied van het verminderen van het verwijderen van een deel van staarten vanuit het oogpunt van diergezondheid
      en dierenwelzijn. Ten behoeve van deze begeleiding bezoekt deze deskundige de varkenshouders die deelnemen aan
      het project elke twee maanden vanaf de start van het project en registreert de schade aan staarten van varkens.
      Deelnemende varkenshouders verlenen hieraan hun medewerking.


