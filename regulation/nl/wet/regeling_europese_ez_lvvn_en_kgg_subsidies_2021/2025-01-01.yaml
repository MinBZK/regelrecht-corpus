  - number: '2.8'
    text: |-
      1 De minister kan een adviescommissie instellen.

      2 Een adviescommissie heeft tot taak de minister op zijn verzoek te adviseren omtrent aanvragen om subsidie.

      3 De adviezen van een adviescommissie gaan vergezeld van een deugdelijke motivering.

      4 Een adviescommissie bestaat uit een voorzitter en een aantal leden. De leden zijn deskundig op het terrein waarop
      de adviescommissie een taak heeft. De voorzitter en de leden zijn geen ambtenaren, werkzaam bij het Ministerie
      van Landbouw, Natuur en Voedselkwaliteit of andere ministeries die voor de subsidie verantwoordelijk zijn of
      medeverantwoordelijk zijn.

      5 Bij de instelling van een adviescommissie worden de periode waarvoor de voorzitter en de leden worden benoemd en
      het aantal leden vastgesteld.

      6 De voorzitter en de leden worden door de minister benoemd en ontslagen. Zij zijn telkens opnieuw benoembaar voor
      de termijn, bedoeld in het vijfde lid.

      7 Een adviescommissie stelt haar eigen werkwijze schriftelijk vast.

      8 Een lid van een adviescommissie neemt geen deel aan de voorbereiding en vaststelling van een advies, indien hij
      een persoonlijk belang heeft bij de beschikking op de aanvraag.

      9 De minister kan waarnemers aanwijzen, die het recht hebben de vergaderingen van een adviescommissie bij te wonen.

      10 In het secretariaat van een adviescommissie wordt door de minister voorzien.

      11 Het beheer van de bescheiden betreffende de werkzaamheden van een adviescommissie geschiedt op overeenkomstige
      wijze als bij het Ministerie van Landbouw, Natuur en Voedselkwaliteit. De bescheiden worden na beëindiging van de
      werkzaamheden van een adviescommissie bewaard in het archief van dat ministerie.

      12 Een adviescommissie verstrekt desgevraagd aan de minister de voor de uitoefening van zijn taak benodigde
      inlichtingen. De minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de
      vervulling van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel2.8
  - number: '2.9'
    text: |-
      1 Een aanvraag om subsidie wordt ingediend met gebruikmaking van een middel, dat door de minister beschikbaar wordt
      gesteld.

      2 Bij een aanvraag om subsidie wordt in voorkomend geval mededeling gedaan van andere inkomsten, waaronder
      subsidies, waarmee de activiteit waarop de subsidie betrekking heeft wordt of zal worden gefinancierd.

      3 Een aanvraag om subsidie bevat in ieder geval gegevens over de subsidieaanvrager, waaronder de naam van de
      natuurlijke persoon, de rechtspersoon of publieke instelling, het adres, e-mailadres en rekeningnummer.

      4 In aanvulling op het derde lid, bevat de aanvraag om subsidie, indien de subsidieaanvrager een rechtspersoon
      betreft, het nummer waarmee de rechtspersoon geregistreerd is bij de Kamer van Koophandel en het post- en
      bezoekadres.

      5 Een aanvraag om subsidie voor een project gaat vergezeld van een projectplan, waarin ten minste zijn opgenomen:

      a. een beschrijving van het project, waaronder:

      1°. een samenvatting van het project;

      2°. de doelstellingen van het project;

      3°. een probleemanalyse waaruit onder andere de noodzaak van het project en de noodzaak van de ter uitvoering
      daarvan te maken kosten blijken;

      4°. de activiteiten en wijze van uitvoering daarvan;

      5°. voor zover van toepassing, een overzicht van de aan het samenwerkingsverband deelnemende partijen en de
      verdeling van verantwoordelijkheden, bevoegdheden en financiële verplichtingen van de deelnemers, alsmede een
      bewijsstuk waaruit blijkt dat de penvoerder bevoegd is om namens de deelnemers aan het samenwerkingsverband te
      handelen;

      6°. een beschrijving van de communicatieactiviteiten, bedoeld in artikel 50, eerste lid, aanhef en onderdelen
      a tot en met e, van [verordening 2021/1060](32960R2021) of, voor zover het activiteiten in het kader van het
      Elfpo betreft, in bijlage III, deel 2, van [verordening 2022/129](32029R2022), die de subsidieontvanger of het
      samenwerkingsverband wil gaan ondernemen;

      b. informatie waaruit blijkt in hoeverre het project bijdraagt aan de doeleinden waarvoor subsidie wordt verstrekt;

      c. een begroting voor het project, die een meerjarenbegroting is met liquiditeitsplanning per jaar voor zover het
      project langer dan een jaar duurt, met een toelichting daarop;

      d. criteria voor het toetsen van de resultaten van het project; en

      e. de verwachte realisatietermijn, met een beschrijving van het tijdpad en mijlpalen indien de termijn langer dan
      een jaar is.

      6 Indien aanvragers van subsidie samenwerken in een samenwerkingsverband, dient de penvoerder namens hen een
      aanvraag in.

      7 Indien een aanvraag om subsidie op grond van deze regeling niet vergezeld gaat van een projectplan, is het vijfde
      lid, onderdeel a, subonderdeel 6°, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel2.9
  - number: '2.10'
    text: |-
      Onverminderd [artikel 1.4][ref1] komen in geval van een samenwerkingsverband kosten die een deelnemer van het
      samenwerkingsverband in rekening brengt bij een andere deelnemer van het samenwerkingsverband niet voor subsidie
      in aanmerking.


