  - number: 4.4.1
    text: |-
      De Minister verstrekt op aanvraag een programmasubsidie voor de programma’s, bedoeld in
      [artikel 4.4.2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel4.4.2
