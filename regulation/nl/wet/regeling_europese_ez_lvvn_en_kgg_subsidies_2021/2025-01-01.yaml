      1 Als uitgaven van de producentenorganisatie voor investeringen ten behoeve van automatisering van de teelt zijn
      subsidiabel:

      a. robots en innovatieve technieken die autonoom functioneren en leiden tot meer efficiency op de
      producentenbedrijven;

      b. cameratechnieken voor scannen voor prognoses, detectie van ziekten en plagen, oogsten en gewasbehandelingen.

      2 Niet subsidiabel zijn uitgaven voor technieken die breed worden toegepast en gangbaar zijn.
