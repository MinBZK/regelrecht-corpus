  - number: 5.3.174
    text: |-
      1 Producentenorganisaties die producten uit de markt willen nemen, melden dit vooraf bij de Minister, door middel
      van een door de minister voorgeschreven middel.

      2 Een melding als bedoeld in het eerste lid betreft een massa van ten hoogste 30.000 kilogram.

      3 Indien de melding plaats vindt voor 0:00 uur, vindt de controle op hoeveelheid en kwaliteit uiterlijk de derde
      werkdag plaats of informeert de minister de producentenorganisatie dat er geen controle zal plaatsvinden.

      4 De uit de markt genomen producten worden bij controle in dusdanige verpakking aangeboden dat controle mogelijk
      is en in elk geval niet in een verpakking met een omvang groter dan 1 kubieke meter en een gewicht van meer dan
      300 kg.

      5 In afwijking van het vierde lid worden de producten, bedoeld in
      [artikel 5.3.173, tweede lid, onderdelen a en g][ref1], in elk geval niet aangeboden in verpakkingen van meer dan
      25 kg.

      6 Een producentenorganisatie toont aan dat bij het indienen van een melding van het uit de markt nemen ten
      behoeve van gratis verstrekking als bedoeld in [artikel 5.3.173, vierde lid, onderdeel c][ref2], de afname
      door de liefdadigheidsinstelling of -organisatie verzekerd is. Op verzoek van de minister overlegt de
      producentenorganisatie hiertoe schriftelijke bewijsstukken.


