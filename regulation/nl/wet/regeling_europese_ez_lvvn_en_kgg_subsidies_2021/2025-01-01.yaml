  - number: 5.2.65
    text: |-
      1 In aanvulling op artikel 11, negende lid, van [verordening 2022/126](32026R2022) worden, indien het eigendom van
      een investering teniet gaat als gevolg van een oorzaak waarvoor de producentenorganisatie een uitkering van een
      verzekeraar ontvangt en deze uitkering niet wordt aangewend voor de vervanging van de betreffende investering, de
      verzekeringspenningen teruggestort in het Europees Landbouwgarantiefonds.

      2 Het eerste lid is niet van toepassing indien het op grond van artikel 11, negende lid, van [verordening 2022/126]
      (32026R2022) berekende bedrag van terugvordering lager is dan het in het eerste lid bedoelde bedrag. In dat geval
      wordt het berekende bedrag teruggestort in het Europees Landbouwgarantiefonds.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.65
  - number: 5.2.66
    text: |-
      1 Een investering in een duurzaam productiemiddel kan eenmalig of in tranches worden opgenomen in de aanvraag voor
      een gedeeltelijke betaling of in de aanvraag tot subsidievaststelling.

      2 De tranches betreffen identieke bedragen die één keer ten aanzien van een uitvoeringsjaar worden opgenomen in de
      aanvraag voor een gedeeltelijke betaling of in de aanvraag tot subsidievaststelling.

      3 Indien een producentenorganisatie of unie van producentenorganisaties uitgaven voor een investering in een
      duurzaam productiemiddel in identieke tranches in de aanvraag voor een gedeeltelijke betaling of in de aanvraag tot
      subsidievaststelling opneemt, is op het moment van de aanvraag voor een gedeeltelijke betaling of de aanvraag tot
      subsidievaststelling de laatste factuur ontvangen en betaald.

      4 De datum waarop het duurzaam productiemiddel ter beschikking is gesteld aan de producentenorganisatie valt in het
      uitvoeringsjaar waarop de gedeeltelijke betaling, of de aanvraag tot subsidievaststelling, betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.66
  - number: 5.2.67
    text: |-
      1 Een duurzaam productiemiddel kan ten laste van het actiefonds worden gebracht gedurende maximaal 5 jaar. Deze
      periode start vanaf het moment waarop het duurzaam productiemiddel ter beschikking van de begunstigde is gesteld
      als bedoeld in artikel 11, eerste lid, onderdeel b, van [verordening 2022/126](32026R2022).

      2 Een investering in een duurzaam productiemiddel kan ook voor het volgende operationele programma in aanmerking
      worden genomen, indien de periode, bedoeld in [artikel 5.2.63][ref1], langer is dan de looptijd van het
      operationele programma.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel5.2.63
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.67
    references:
      - id: ref1
        bwb_id: BWBR0045685
        artikel: 5.2.63
        hoofdstuk: '5'
        paragraaf: '3'
        afdeling: 5.2.3
  - number: 5.2.68
    text: |-
      1 Een tweedehands duurzaam productiemiddel, als bedoeld in punt 7 van bijlage III van [verordening 2022/126]
      (32026R2022), is subsidiabel indien het aanschafbedrag hoger is dan € 10.000.

      2 Een tweedehands duurzaam productiemiddel dat bij een aangesloten producent, een daaraan verbonden partij of een
      rechtspersoon, als bedoeld in [artikel 5.2.3, tweede lid][ref1], is aangeschaft is niet subsidiabel indien dit
      duurzaam productiemiddel vervolgens bij deze of een andere aangesloten producent of een rechtspersoon als bedoeld
      in artikel 5.2.3, tweede lid, wordt geplaatst.

      3 Dit artikel, uitgezonderd het eerste lid, is van overeenkomstige toepassing op investeringen die worden gehuurd
      of geleased.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel5.2.3
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.68
    references:
      - id: ref1
        bwb_id: BWBR0045685
        artikel: 5.2.3
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: 5.2.1
  - number: 5.2.69
    text: |-
      1 Een investering in een duurzaam productiemiddel op het terrein van ICT is subsidiabel indien het gaat om:

      a. hardware die:

      1°. een integraal onderdeel uitmaakt van subsidiabele installaties; of

      2°. ondersteunend is voor subsidiabele activiteiten en op grond van offertes kan worden toegerekend aan deze
      activiteiten; of

      b. software applicaties die ondersteunend zijn voor subsidiabele activiteiten en op grond van offertes kan worden
      toegerekend aan deze activiteiten.

      2 Bij de indiening van het operationeel programma wordt een onderbouwd plan overlegd met daarin:

      a. een gedetailleerde beschrijving van het project;

      b. een begroting van de investeringskosten;

      c. een definiëring van de onderdelen van de investeringskosten;

      d. een verdeling van de subsidiabele en niet-subsidiabele kosten met bijbehorende begrote bedragen; en

      e. een gedetailleerde beschrijving van de functionaliteit van de verschillende onderdelen door de leverancier.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.69
  - number: 5.2.70
    text: |-
      Uitgaven voor investeringen in uitgangsmateriaal van rassen van meerjarige gewassen en licenties voor het gebruik
      van zaden en plantgoed van nieuwe rassen van meerjarige gewassen die zijn opgenomen in het operationeel programma
      van een producentenorganisatie zijn subsidiabel, indien de bedoelde rassen:

      a. toegelaten zijn door de Stichting Nederlandse Algemene Kwaliteitsdienst voor de Tuinbouw;

      b. ingeschreven staan in het Nederlandse rassenregister van de Raad voor de plantenrassen; of

      c. ingeschreven staan bij een keuringsinstantie van een andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.70
  - number: 5.2.71
    text: |-
      Producentenorganisaties houden voor alle investeringen in duurzame productiemiddelen die zijn opgenomen in een
      lopend operationeel programma, met gebruikmaking van een door de minister beschikbaar gesteld middel, een actueel
      register bij.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.71
  - number: 5.2.72
    text: |-
      1 Uitgaven voor huur en lease als economisch verantwoord alternatief voor de koop van een investering in een
      duurzaam productiemiddel zijn gedurende de termijn, bedoeld in [artikel 5.2.63][ref1], subsidiabel overeenkomstig
      punt 8 van bijlage III van [verordening 2022/126](32026R2022), voor zover koop van het duurzaam productiemiddel
      subsidiabel zou zijn.

      2 De [artikelen 5.2.57][ref2] en [5.2.62, tweede lid][ref3], zijn van overeenkomstige toepassing op uitgaven als
      bedoeld in het eerste lid.

      3 De producentenorganisatie overlegt onverwijld, indien de minister daarom verzoekt, voor uitgaven, bedoeld in het
      eerste lid, een schriftelijke overeenkomst.

      4 Uit de overeenkomst blijkt in ieder geval de datum van verwerving van het activum of vanaf de datum waarop het
      activum ter beschikking van de begunstigde wordt gesteld, bedoeld in artikel 11, eerste lid, onderdeel b, van
      [verordening 2022/126](32026R2022).


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel5.2.63
      [ref2]: https://wetten.overheid.nl/BWBR0045685#Artikel5.2.57
      [ref3]: https://wetten.overheid.nl/BWBR0045685#Artikel5.2.62
