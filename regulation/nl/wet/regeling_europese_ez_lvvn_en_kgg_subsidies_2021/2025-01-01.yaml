  - number: 5.3.187
    text: |-
      1 Uitgaven van de producentenorganisatie, inclusief personeelskosten, die gerelateerd zijn aan de in artikel 47,
      tweede lid, onderdeel k van [verordening 2021/2115](32115R2021) bedoelde uitvoering en het beheer van sanitaire en
      fytosanitaire voorschriften van derde landen op het grondgebied van de Europese Unie om de toegang tot de markten
      van derde landen te vergemakkelijken, zijn subsidiabel.

      2 Indien de producentenorganisatie in het kader van fytosanitaire protocollen met derde landen uitgaven moet doen
      als bedoeld in [artikel 5.3.103][ref1], geldt in afwijking van [artikel 5.3.104, eerste lid][ref2], dat de kosten
      volledig subsidiabel zijn.


