  - number: 5.1.5
    text: |-
      Onverminderd [artikel 7, vierde lid, van de Kaderwet EZK- en LNV-subsidies][ref1] worden ingeval een subsidie
      wordt verstrekt aan een samenwerkingsverband, onverschuldigde betaalde subsidiebedragen overeenkomstig
