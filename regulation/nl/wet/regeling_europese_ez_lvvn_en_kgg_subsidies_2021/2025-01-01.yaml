  - number: 5.7.37
    text: |-
      1 Een bedrijfsplanvoucher wordt door de minister op aanvraag verstrekt aan een landbouwer voor het verkrijgen van
      een bedrijfsplan.

      2 De landbouwer vermeldt bij de aanvraag een erkende bedrijfsadviseur uit het bedrijfsadviseringssysteem, naar
      keuze, geregistreerd in tenminste een van de volgende aandachtsgebieden in het Bedrijfsadviseringssysteem: E3
      bedrijfsopvolging, (bedrijfsovername & bedrijfsplannen) of E4 verdienvermogen.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.7.37
  - number: 5.7.38
    text: |-
      De minister bepaalt op volgorde van binnenkomst aan welke landbouwers, binnen het subsidieplafond voor
      bedrijfsplanvouchers, vouchers worden verstrekt, uitgaande van de waarde per voucher.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.7.38
  - number: 5.7.39
    text: |-
      De landbouwer draagt de door de minister verstrekte voucher over aan de in de aanvraag opgenomen erkende
      bedrijfsadviseur.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.7.39
  - number: 5.7.40
    text: |-
      Subsidie wordt verstrekt aan een erkende bedrijfsadviseur die ten behoeve van een landbouwer een bedrijfsplan heeft
      opgesteld met daarin minimaal vijf onderwerpen, bedoeld in [5.7.44, onderdeel b][ref1], waarop het bedrijfsplan
      gericht zal zijn en in verband daarmee een geldige voucher overlegt.


