    text: |-
      1 De subsidieontvanger draagt er zorg voor dat een situatie als bedoeld in artikel 11, eerste lid, onderdeel a, b,
      of c van [verordening 2021/1139](33039R2021) zich niet voordoet gedurende ten minste vijf jaar na de datum van de
      laatste betaling.

      2 Indien de subsidieontvanger subsidie aanwendt voor het verlenen van een opdracht waarbij de totale kosten bij één
      opdrachtnemer hoger zullen zijn dan € 25.000, vraagt hij voorafgaand aan de opdrachtverlening drie offertes op bij
      van elkaar onafhankelijke aanbieders.

      3 De subsidieontvanger gunt de opdracht, bedoeld in het tweede lid, aan de aanbieder met de economisch meest
      voordelige offerte.

      4 De minister kan op verzoek van de subsidieontvanger of de penvoerder ontheffing verlenen van de verplichting,
      bedoeld in het tweede lid. Aan de ontheffing kunnen voorschriften worden verbonden.

      5 Het tweede lid is niet van toepassing indien de subsidieontvanger die subsidie wil aanwenden voor het verlenen
      van een opdracht een aanbestedende dienst is als bedoeld in [artikel 1.1 van de Aanbestedingswet 2012][ref1] en de
      opdracht die hij wil verlenen op grond van de [Aanbestedingswet 2012][ref2] moet worden aanbesteed.

      6 Indien het vijfde lid van toepassing is, stelt de subsidieontvanger of de penvoerder de minister op de hoogte van
      de gevolgde procedure en de gunningsbeslissing, overeenkomstig [artikel 2.130 van de Aanbestedingswet 2012][ref3].

      7 Het tweede lid is niet van toepassing indien de subsidie wordt aangewend voor het verlenen van een opdracht aan
      een kennisinstelling.

      8 De subsidieontvanger verleent de Europese Audit Autoriteit, de Europese Commissie of de Europese Rekenkamer alle
      medewerking die deze redelijkerwijs kan vorderen bij de uitoefening van zijn taken.


