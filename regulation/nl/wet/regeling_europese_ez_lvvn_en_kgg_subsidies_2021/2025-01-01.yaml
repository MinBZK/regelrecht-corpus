    text: |-
      1 Uitgaven voor investeringen voor detectie en diagnosesystemen ten behoeve van precisietoediening in verband met
      geïntegreerde gewasbescherming zijn subsidiabel.

      2 Uitgaven als bedoeld in het eerste lid zijn onder meer:

      a. monitorings- en waarschuwingssystemen; en

      b. beslissingsondersteuningssystemen.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.84
