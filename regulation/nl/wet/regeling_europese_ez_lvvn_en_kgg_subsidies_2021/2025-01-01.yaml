        artikel: '1'
  - number: 5.3.107
    text: |-
      1 Als uitgaven voor de specifieke kosten van aankoop van duurzame meststoffen en compost zijn subsidiabel:

      a. mest en compost afkomstig van door SKAL gecertificeerde biologische landbouwbedrijven;

      b. meststoffen verkregen uit opgewerkte dierlijke mest en compost;

      2 De producentenorganisatie toont de biologische oorsprong van mest en compost bij de aanvraag tot
      subsidievaststelling aan door middel van:

      a. een factuur en een afleverbon met vermelding van Skalnummer van het betrokken landbouwbedrijf en ‘eko’ of ‘bio’;

      b. het Skal certificaat van het betrokken landbouwbedrijf of een lijst van Skal-gecertificeerde landbouwbedrijven
      en Skal-nummers; en

      c. een opgave per deelnemende producent van:

      1°. het areaal gewassen waarvoor de producentenorganisatie is erkend;

      2°. de hoeveelheid en het type mest of compost; en

      3°. de opgevoerde kosten.

      3 De uitgaven van de producentenorganisatie, bedoeld in het eerste lid, voor geconcentreerde handelsmeststoffen
      zijn niet subsidiabel.

      4 Mest en compost afkomstig van door SKAL gecertificeerde biologische landbouwbedrijven, bedoeld in het eerste lid
      onderdeel a, is slechts subsidiabel voor zover deze is bestemd voor een SKAL gecertificeerd lid.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.107
  - number: 5.3.108
    text: |-
      Uitgaven ten behoeve van duurzaam bodembeheer zijn subsidiabel indien het gaat om uitgaven voor de aanschaf van
      groenbemesters.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.108
  - number: 5.3.109
    text: |-
      De specifieke kosten voor biologisch afbreekbare bevestigingsmaterialen, zoals biologisch afbreekbare clips en
      biologisch afbreekbaar touw, zijn subsidiabel.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.109
  - number: 5.3.111
    text: |-
      1 Uitgaven om een nieuw product of nieuw concept in de keten te borgen door deze onder te brengen in een
      certificeringssysteem, inclusief personeelskosten, zijn subsidiabel.

      2 Niet subsidiabel zijn uitgaven van de producentenorganisatie:

      a. voor onderhoudsabonnementen;

      b. voor de aanschaf van een Global Location Number (GLN);

      c. om aan keurmerken te voldoen;

      d. voor ICT voorzieningen:

      1°. voor tracking en tracing systemen indien het gaat om de registraties van productherkomst, ziekten, plagen,
      middelen of meststoffen; of

      2°. het laten functioneren van oogstkarren, weeginstallaties of kantelinstallaties.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.111
  - number: 5.3.112
    text: |-
      1 Uitgaven van de producentenorganisatie voor personeel en externe diensten in het kader van investeringen ten
      behoeve van de bundeling van productstromen zijn subsidiabel indien het gaat om:

      a. de kosten van bouwkundig advies;

      b. de kosten van bouwbegeleiding;

      c. de kosten van projectmanagement;

      d. de kosten van onafhankelijk toezicht op uitvoering van een project;

      e. de kosten van haalbaarheidsstudies;

      f. juridische advieskosten; of

      g. reis- en verblijfkosten.

      2 Uitgaven als bedoeld in het eerste lid, onderdeel g, zijn niet subsidiabel indien het gaat om reis- en
      verblijfkosten voor het personeel van de producentenorganisatie of haar leden.

      3 De investeringen voldoen aan de kwalificatie ‘Excellent’ en scoren minimaal 60% op de categorie ‘Energie’,
      volgens BREEAM-NL.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.112
  - number: 5.3.113
    text: |-
      1 Uitgaven van de producentenorganisatie of een dochteronderneming voor opleidingen van leden die teler zijn,
      medewerkers van de producentenorganisatie en medewerkers van leden die telers zijn om te komen tot een verhoging
      van de kwalificatie van het personeel of het versterken van de interne professionalisering zijn subsidiabel,
      inclusief personeelskosten indien het gaat om uitgaven voor:

      a. deelname aan opleidingen, trainingen en bijeenkomsten;

      b. trainers of externe deskundigen;

      c. educatieve bijeenkomsten; en

      d. cursusmateriaal.

      2 Opleidingen als bedoeld in het eerste lid kunnen betrekking hebben op de volgende gebieden:

      a. de afzet van de markt;

      b. logistiek;

      c. kwaliteit;

      d. milieubescherming;

      e. teelttechniek;

      f. crisispreventie en risicobeheer; en

      g. fytosanitair bewustzijn.

      3 Niet subsidiabel zijn uitgaven voor:

      a. zaalhuur; en

      b. opleidingen ten behoeve van het verwerven van algemene kennis en vaardigheden.

      4 Bij de aanvraag tot subsidievaststelling verstrekt de producentenorganisatie in geval van educatieve
      bijeenkomsten als bedoeld in het eerste lid, onderdeel c, aan de Minister:

      a. een deelnemerslijst; en

      b. een aanwezigheidsregistratie per bijeenkomst per deelnemer voorzien van een handtekening van de deelnemer.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.113
  - number: 5.3.114
    text: |-
      1 Uitgaven van de producentenorganisatie voor specifieke advies en begeleiding ten behoeve van de geïntegreerde
      teelt en bijdragen aan de agromilieuklimaatdoelstellingen, inclusief personeelskosten, zijn subsidiabel indien het
      onder meer gaat om:

      a. gewasbeoordeling;

      b. biologische gewasbescherming;

      c. watermanagement;

      d. bemesting en reduceren mineralengebruik;

      e. klimaataansturing; of

      f. energiereductie.

      2 Uitgaven die betrekking hebben op de begeleiding voor de teelt van witlofpennen zijn niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.114
  - number: 5.3.115
    text: |-
      Uitgaven van de producentenorganisatie voor specifieke advies en begeleiding ten behoeve van de biologische teelt
      en bijdragen aan de agromilieuklimaatdoelstellingen, inclusief personeelskosten, zijn subsidiabel indien:

      a. het onder meer gaat om:

      1°. biologische teelt;

      2°. bodemvruchtbaarheid;

      3°. biologische bemesting;

      4°. compostering;

      5°. vruchtwisseling;

      6°. rassenkeuze;

      7°. biologische bestrijding en biologisch evenwicht; of

      8°. biologische teelttechniek;

      b. voldaan is aan de bij of krachtens [verordening 2018/848](32748R2018) en [verordening 889/2008](32008R0889)
      gestelde voorschriften; en

      c. deelnemende leden van de producentenorganisatie beschikken over een geldig Skal certificaat of een bevestiging
      van Stichting Skal dat het bedrijf van het lid in omschakeling is naar biologische productie.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.115
  - number: 5.3.116
    text: |-
      1 Uitgaven voor het opstellen van berekeningen ten aanzien van duurzaamheidsindicatoren zoals een CO voetafdruk en
      een levenscyclusanalyse, inclusief personeelskosten, ten behoeve van de tuinbouw zijn subsidiabel.

      2 Subsidiabele uitgaven zijn:

      a. registratie en verslaglegging van indicatoren op locaties van de producentenorganisatie of aangesloten
      producenten;

      b. licenties voor benodigde software;

      c. advieskosten;

      d. kosten van externe audits; en

      e. kosten van communicatie ten behoeve van de CO voetafdruk en levenscyclusanalyse.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.116
  - number: 5.3.117
    text: |-
      In het kader van uitgaven voor educatieve bijeenkomsten zijn uitsluitend subsidiabel:

      a. de door de organisatie van de educatieve bijeenkomst in rekening gebrachte kosten voor deelname van leden,
      medewerkers van leden en medewerkers van de producentenorganisatie of dochterondernemingen; en

      b. de kosten van inhuur van externe deskundigen.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.117
  - number: 5.3.118
    text: |-
      De activiteiten die zijn opgenomen in deze paragraaf kunnen worden ingezet in het kader van projecten ter
      realisatie van de sectorale doelstelling bijdragen tot matiging van en aanpassing aan klimaatverandering, bedoeld
      in artikel 46, aanhef en onderdeel f, van [verordening 2021/2115](32115R2021).
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.118
  - number: 5.3.119
    text: |-
      1 Uitgaven voor investeringen in duurzame energie zijn subsidiabel indien het gaat om onder meer:

      a. zonnepanelen;

      b. zonnecollectoren;

      c. windmolens;

      d. aardwarmte;

      e. losse batterijen voor tijdelijke opslag van energie ten behoeve van eerder aangeschafte zonnepanelen.

      2 In het geval van investeringen genoemd in het eerste lid zijn in combinatie met deze investeringen subsidiabel:

      a. de kosten verbonden aan het aansluiten van het lid, de producentenorganisatie of de dochteronderneming op een
      geothermische bron;

      b. in het geval van zonnepanelen en zonnecollectoren de kosten in verband met de aanpassing van het gebouw van de
      producentenorganisatie, een lid of een dochteronderneming, en het ondersteuningsmateriaal;

      c. de kosten verbonden aan het transformatorstation van het lid, de producentenorganisatie of dochteronderneming
      met aansluiting op een extern transformatorstation van de energieleveranciers en met het versterken van de
      verbinding voor hernieuwbare energie; en

      d. batterijen voor tijdelijke opslag van energie.

      3 Niet subsidiabel zijn uitgaven voor:

      a. warmte-krachtkoppeling installaties of de revisie daarvan; en

      b. biobrandstofbranders.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.119
  - number: 5.3.120
    text: |-
      1 Uitgaven voor investeringen in apparatuur en andere benodigdheden voor het gebruik van reststromen, zoals CO-,
      aardwarmte- en restwarmtenetwerken en biogas, op teeltbedrijven zijn subsidiabel.

      2 Subsidiabel zijn:

      a. installaties, waaronder interconnectoren en transportpijplijnen, benodigd voor het gebruik van energie en CO uit
      reststromen van derden;

      b. kosten die verband houden met het aansluiten van het lid, de producentenorganisatie of dochteronderneming op de
      bron van de leverancier; en

      c. in het geval van CO, ook de kosten in verband met voorzieningen voor de (tijdelijke) opslag van CO op het
      teeltbedrijf. Bijvoorbeeld na aanvoer door vrachtauto’s of om uitval/storingen bij netwerken op te vangen.

      3 Niet subsidiabel zijn de uitgaven:

      a. voor voorzieningen voor de distributie en regulering van warmte en CO in de kas; en

      b. die verband houden met een vergistingsinstallatie op het bedrijf en biobranders voor de productie van restwarmte
      en biobrandstoffen.

      4 De producentenorganisatie overlegt bij de aanvraag tot subsidievaststelling aan de minister voor de uitgaven,
      bedoeld in het eerste lid, het leveringscontract tussen de producentenorganisatie, haar dochteronderneming of het
      lid en de leverancier.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.120
  - number: 5.3.121
    text: |-
      1 Uitgaven voor investeringen in het kader van verbetering van energie-efficiëntie door toepassing van
      energiebesparende technieken zijn subsidiabel.

      2 Subsidiabel zijn:

      a. apparatuur voor energieopslag en -uitwisselingssystemen, zoals energiebesparende warmtepompen, warmtewisselaars,
      waterhoudende grondlagen voor warmte- en koudebuffering en aquathermie;

      b. apparatuur voor gesloten en semi-gesloten kassystemen, zoals energiebesparende ventilatie-, luchtbehandeling- en
      hogedrukvernevelingssystemen, energiebesparende tweede schermen en innovatieve energiebesparende en isolerende dak-
      en gevelsystemen zoals airmix ventilatoren;

      c. apparatuur voor het energiezuinig drogen en opslaan van producten zoals CO-propaankoeling;

      d. andere energie-efficiënte apparatuur, die voldoet aan voorschriften in
      [titel 2.3 van de Regeling nationale EZK- en LNV-subsidies][ref1]; en

      e. technieken voor het ontvochtigen van kaslucht.

      3 In het geval van gesloten en semi-gesloten kassystemen zijn de volgende kassystemen in het kader van een
      totaalconcept subsidiabel:

      a. buitenluchtaanzuiging in combinatie met een tweede beweegbaar energiescherm;

      b. energiebesparend ventilatiesysteem met warmteterugwinning of voorverwarming;

      c. luchtbehandelingssystemen ter ontvochtiging van lucht (ontvochtingsinstallaties);

      d. hogedrukvernevelingsysteem met een adiabatische koeling waarbij de druppelgrootte 5 tot maximaal 15 micron
      bedraagt;

      e. gevelschermen die een energiebesparing realiseren van ten minste 40 procent wanneer het scherm gesloten is;

      f. warmte-uitwisselingsysteem;

      g. warmtepomp;

      h. waterhoudende lagen voor warmte- en koudebuffering; en

      i. tweede energiescherm, dat een energiebesparing van ten minste 45 procent oplevert wanneer het scherm gesloten
      is.

      4 In het geval van energiebesparende en isolerende dak- en gevelsystemen voor nieuwe kassen zijn de volgende
      voorwaarden van toepassing:

      a. het materiaal is van dubbelglas en licht doorlatend (diffuus gecoat); of

      b. het materiaal is dubbel gelaagd met een combinatie van glas en hoge kwaliteitsfilm en doorschijnend (diffuus
      gecoat); en

      c. in het geval van dubbele beglazing zijn alleen de aanvullende uitgaven die verband houden met dubbele beglazing
      ten opzichte van enkele beglazing subsidiabel.

      5 In het geval van energiebesparende en isolerende dak- en gevelsystemen voor bestaande kassen zijn de volgende
      voorwaarden van toepassing:

      a. het materiaal heeft betere doorschijnende eigenschappen dan enkele beglazing en is doorschijnend;

      b. het systeem bestaat uit plastic panelen, dubbelglas panelen of dubbel fluorpolymeer (EFTE) film met een
      optionele overdrukventilatie ventilator om folies van elkaar te scheiden en de isolatie te verbeteren;

      c. het systeem bestaat uit isolatiemateriaal waarbij de som van de warmteweerstand van de lagen (R=∑(Rm)=∑d/λ)
      toeneemt met ten minste 1,50 m2K/W in vergelijking met de oude situatie; en

      d. alleen de aanvullende uitgaven voor de geïsoleerde oppervlakte zijn subsidiabel.

      6 In het geval van energie efficiënte droog- en opslagmethoden, zijn de volgende voorwaarden van toepassing:

      a. de apparatuur is bedoeld voor de korte en lange termijn bewaring van producten; en

      b. de uitgaven voor meet- en controleapparatuur zijn subsidiabel.

      7 De volgende investeringen zijn niet subsidiabel:

      a. warmte buffer boiler tank;

      b. warmte buffer tank;

      c. eerste energieschermen;

      d. verduisteringsschermen;

      e. zonwerende materialen;

      f. rookgas afvoer en bijbehorende meetapparatuur;

      g. de vervanging van een tweede scherm;

      h. aanpassingen aan de kas die noodzakelijk zijn om de investering, bedoeld in het eerste lid, te realiseren.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
