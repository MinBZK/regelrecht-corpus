  - number: 5.7.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een onderneming, niet zijnde een landbouwer, voor uitwisseling
      van kennis en verspreiding van informatie bij projecten waarbij de focus ligt bij de bescherming van natuur, milieu
      en klimaat, teneinde bij te dragen aan een van of meer van de doelstellingen, bedoeld in artikel 6, eerste en
      tweede lid, van [verordening 2021/2115](32115R2021); de uitwisseling van kennis en verspreiding van informatie kan
      onder meer gebeuren in de vorm van de uitvoering van trainingen, workshops, coaching, voorlichtingsactiviteiten en
      demonstratieactiviteiten en komt ten goede aan een groep van samenwerkende landbouwers.

      2 De projecten ondersteunen acties die bijdragen aan de interventietypes, bedoeld in artikel 78, van [verordening
      2021/2115](32115R2021), en aan de specifieke doelstellingen, bedoeld in artikel 6, eerste en tweede lid van
      [verordening 2021/2115](32115R2021), relevante acties ter bevordering van innovatie, scholing en advisering, en
      andere vormen van uitwisseling van kennis en verspreiding van informatie, en hebben een of meer van de volgende
      onderwerpen:

      a. kringlooplandbouw:

      1°. (stikstof)emissie en hergebruik nutriënten;

      2°. gezonde bodem, water en teeltsystemen;

      3°. weerbare teeltsystemen en geïntegreerde gewasbescherming;

      4°. circulair gebruik van gewassen, grondstoffen en nieuwe plantaardige eiwitbronnen;

      5°. natuurinclusieve landbouw;

      6°. precisielandbouw;

      b. duurzaam ondernemerschap:

      1°. persoonlijke ontwikkeling van ondernemers en hun bedrijf;

      2°. horizontale samenwerking;

      3°. bedrijfsopvolging;

      4°. duurzaam verdienvermogen.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.7.2
  - number: 5.7.3
    text: |-
      1 Voor subsidie komen in aanmerking kosten van de organisatie en uitvoering van trainingen, workshops, coaching,
      voorlichtingsacties en demonstratieactiviteiten ter bevordering van innovatie, scholing, advisering en andere
      vormen van uitwisseling van kennis en verspreiding van informatie als bedoeld in artikel 78, tweede lid, van
      [verordening 2021/2115](32115R2021).

      2 Voor subsidie komen niet in aanmerking kosten voor de ontwikkeling van lesmateriaal ten behoeve van de
      kennisoverdracht.

      3 De subsidieontvanger berekent de subsidiabele kosten overeenkomstig
      [artikel 5.1.3, eerste lid, onderdeel a en tweede lid en derde lid][ref1], overeenkomstig [artikel 5.1.3a][ref2] of
      overeenkomstig [artikel 5.1.3b, tweede en vierde lid][ref3].

      4 In afwijking van het derde lid kunnen kennisinstellingen de integrale kostensystematiek, bedoeld in
      [artikel 1.3b][ref4], hanteren.


