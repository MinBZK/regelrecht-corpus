  - number: 5.6.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan de operationele groep voor een project dat bestaat uit het
      ontwikkelen van innovatieve initiatieven die bijdragen aan de transitie naar een duurzame en toekomstbestendige
      landbouw en de uitwisseling van kennis hierover.

      2 In afwijking van het eerste lid, verstrekt de minister enkel subsidie voor een project dat is gericht op de
      categorie, bedoeld in het zesde lid, onderdeel b, aan een operationele groep die bestaat uit ten minste vijf
      varkenshouders, een slachterij en een afzetkanaal van producten uit de varkenshouderij. Een varkenshouder die
      varkens, niet zijnde biggen, of enkel biggen houdt, kan enkel deelnemen aan een operationele groep indien de eerste
      type houder biggen afneemt van de laatste type houder en beide houders deelnemen aan dezelfde operationele groep.

      3 In afwijking van het eerste lid, verstrekt de minister enkel subsidie voor een project dat is gericht op de
      categorie, bedoeld in het zesde lid, onderdeel a, aan een operationele groep die bestaat uit ten minste één
      potentiële jonge landbouwer.

      4 Het project bestaat uit:

      a. de voorbereiding op de uitvoering van het projectplan, en

      b. de uitvoering van het projectplan.

      5 Het project draagt bij aan een of meer van de doelstellingen bedoeld in artikel 6, eerste lid, en aan de
      doelstelling, bedoeld in artikel 6, tweede lid, van [verordening 2021/2115](32115R2021).

      6 Het project is gericht op één van de volgende categorieën van activiteiten:

      a. Het behouden van jonge landbouwers en het aantrekken van potentiële jonge landbouwers om te kiezen voor het
      agrarisch ondernemerschap;

      b. Het minder toepassen van het verwijderen van een deel van de staart bij biggen in de varkenshouderij in de in
      [artikel 2.3, onderdeel b, van het Besluit diergeneeskundigen][ref1], bedoelde situatie en naar aanleiding hiervan
      het opdoen van ervaring voor het opstellen van een nieuwe ecoregeling als bedoeld in artikel 31 van [verordening
      2021/2115](32115R2021);

      c. Het uitwerken van een ontwerp voor het opzetten van een gebiedsgerichte fieldlab;

      d. Het ontwikkelen van andere innovaties die bijdragen aan de doelstellingen, bedoeld in het vijfde lid;

      e. Het op orde brengen van digitale randvoorwaarden om digitale innovaties in de agrarische bedrijfsvoering te
      kunnen uitwerken of implementeren, om bij te dragen aan het versterken en versnellen van de groene transitie door
      middel van een grotere inzet van digitalisering voor een duurzame landbouw- en voedselketen en een robuuste natuur.

      7 Voor zover aan de operationele groep anderen dan landbouwers deelnemen bevat de subsidie, bedoeld in het eerste
      lid, staatssteun en wordt zij gerechtvaardigd door artikel 40 van de landbouwvrijstellingsverordening.

      8 In afwijking van het eerste lid verstrekt de minister enkel subsidie voor een project dat is gericht op de
      categorie, bedoeld in het zesde lid, onderdeel e, aan een operationele groep die bestaat uit ten minste drie
      partijen, waaronder één gegevenshouder, één gebruiker en één gegevensontvanger waarbij tenminste één van deze
      partijen tevens landbouwer is.


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel2.3
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.6.2
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '2.3'
  - number: 5.6.3
    text: |-
      1 Voor subsidie komen uitsluitend kosten ten behoeve van het project in aanmerking voor zover deze zien op:

      a. in afwijking van [artikel 1.3, tweede lid][ref1], voorbereidingskosten, bestaande uit de oprichting van een
      operationele groep en het gezamenlijk formuleren van een projectplan, de volgende activiteiten:

      1°. het werven van de deelnemers;

      2°. het netwerken om het project goed te definiëren;

      3°. het opstellen van een projectplan en de samenwerkingsovereenkomst;

      4°. projectmanagement en projectadministratie;

      b. uitvoeringskosten, de volgende activiteiten:

      1°. coördinatie van de operationele groep;

      2°. operationele activiteiten die direct verbonden zijn aan de uitvoering van het project;

      3°. projectmanagement en projectadministratie;

      c. tijdens de projectduur gemaakte kosten voor investeringen, voor:

      1°. bouw of verbetering van onroerende zaken;

      2°. verwerving of leasing van onroerende zaken:

      3°. indien het project gericht is op de categorie, bedoeld in [artikel 5.6.2., zesde lid, onderdeel a][ref2], de
      aankoop van grond;

      4°. de koop of huurkoop van nieuwe machines en installaties tot maximaal de marktwaarde van de activa;

      5°. indien het project is gericht op de categorie, bedoeld in [artikel 5.6.2, zesde lid, onderdeel d of e][ref3],
      de koop of huurkoop van software en digitale hardware en bijbehorende licenties.

      2 In afwijking van het eerste lid komen de kosten, bedoeld in het eerste lid, onderdeel c, niet voor subsidie in
      aanmerking indien het project gericht is op de categorie, bedoeld in [artikel 5.6.2, zesde lid, onderdeel c][ref4].

      3 In afwijking van [artikel 1.3, tweede lid][ref5], komen de kosten, bedoeld in het eerste lid, onderdeel a, voor
      subsidie in aanmerking indien deze maximaal één jaar voorafgaand aan de datum van indiening van de aanvraag voor
      subsidie en niet eerder dan 1 januari 2023 zijn gemaakt.

      4 De aanvrager berekent de subsidiabele kosten overeenkomstig
      [artikel 5.1.3., eerste lid, onderdeel a en tweede lid en derde lid][ref6], overeenkomstig [artikel 5.1.3a][ref7].
      of overeenkomstig [artikel 5.1.3b., tweede en vierde lid][ref8].

      5 In afwijking van het vierde lid kunnen kennisinstellingen de integrale kostensystematiek, bedoeld in
      [artikel 1.3b][ref9], hanteren.


