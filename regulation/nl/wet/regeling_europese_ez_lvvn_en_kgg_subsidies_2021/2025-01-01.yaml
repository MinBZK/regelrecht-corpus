  - number: 3.6.8
    text: |-
      1 De minister kent aan een aanvraag om subsidie een hoger aantal punten toe naarmate het aangevraagde project:

      a. een grotere bijdrage levert aan de verduurzaming van verwerking en afzet van visserij- of aquacultuurproducten
      door verkorting van de ketens, verdere verwaarding of efficiëntieverbeteringen;

      b. een grotere bijdrage levert aan het verbeteren van de informatievoorziening, door productinformatie of het
      bewustzijn van de consument;

      c. voor een breder aantal marktdeelnemers als bedoeld in artikel 4, eerste lid, onderdeel 30, van [verordening
      1380/2013](32013R1380) van waarde is.

      2 Het aantal punten bedraagt per onderdeel van het eerste lid ten hoogste 10.

      3 Voor het totaal aantal punten is de wegingsfactor voor de onderdelen a, b en c respectievelijk 35%, 35% en 30%.

      4 De minister rangschikt de aanvragen waarop niet afwijzend is beslist hoger naarmate in totaal meer punten aan het
      project zijn toegekend.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel3.6.8
  - number: 3.6.9
    text: |-
      1 Er kan een deelbetaling worden verstrekt.

      2 Een aanvraag tot deelbetaling wordt in ieder geval ingediend tegelijkertijd met een tussenrapportage als bedoeld
      in [artikel 2.18, eerste lid][ref1].

      3 Onverminderd het tweede lid kan een aanvraag tot deelbetaling op een ander moment worden ingediend. In dat geval
      gaat de aanvraag vergezeld van een beschrijving van de voortgang van het project.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel2.18
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel3.6.9
