    text: |-
      1 Uitgaven van de producentenorganisatie voor investeringen in fertigatie in het kader van
      precisiebemestingstechnieken zijn subsidiabel, indien het gaat om een volledige investering in fertigatie, die
      bestemd is voor besparing en het gereguleerd doseren van water en meststoffen aan gewassen in vollegrondsgroente-
      en fruitteelt;

      2 Onder een investering in fertigatie wordt verstaan:

      a. een waterafgiftesysteem op het perceel, waaronder de waterpomp, verdeelleidingen en druppelleidingen, die niet
      uitsluitend worden gebruikt voor het geven van water;

      b. een regeleenheid

      c. vochtmeetapparatuur;

      d. apparatuur voor het bepalen van het mineralengehalte en pH; of

      e. voorzieningen voor dosering en menging van meststoffen.

      3 Investeringen in een waterafgiftesysteem zijn niet subsidiabel indien het investeringen betreft in:

      a. fertigatie in teeltsystemen los van de grond;

      b. de aanleg van een waterbron; of

      c. aanvoerleidingen naar het te fertigeren perceel.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.133
  - number: 5.3.134
    text: |-
      1 Uitgaven van de producentenorganisatie voor investeringen bij substraatteelt ter verbetering van de
      waterkwaliteit bij de bron zijn subsidiabel indien bedoeld om de emissie van (vervuild) recirculatiewater te
      voorkomen.

      2 Een producentenorganisatie die uitgaven voor investeringen, bedoeld in het eerste lid, in haar operationeel
      programma opneemt, beschikt over een technische specificatie van de leverancier van het systeem of een erkende
      deskundige ten behoeve van de onderbouwing van de te bereiken verbetering van de waterkwaliteit.

      3 Uitgaven voor afdekzeilen van bassins en silo’s voor wateropslag zijn niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.134
