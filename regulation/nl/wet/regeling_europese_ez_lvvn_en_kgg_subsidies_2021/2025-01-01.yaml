  - number: 5.9.6
    text: |-
      1 Onverminderd [artikel 2.9][ref1], wordt de subsidie aangevraagd door het bedrijf, waarvan de jonge landbouwer het
      bedrijfshoofd is en bevat de aanvraag tot subsidieverlening ten minste de volgende gegevens:

      a) een door alle betrokken partijen ondertekend document waaruit blijkt dat de overname of vestiging na
      1 januari 2023 is gerealiseerd, dan wel een kopie van de notariële akte van overdracht van aandelen of van de
      oprichting van de vennootschap en het aandelenregister of de door alle maten of vennoten ondertekende maatschaps-
      onderscheidenlijk vennootschapsakte met vermelding van alle maten of vennoten;

      b) een door de jonge landbouwer ondertekend bedrijfsplan en een verklaring dat het bedrijfsplan actueel is en
      voldoet aan de vereisten van het tweede lid;

      c) een opgave van de gegevens ten behoeve van de berekening van de standaardverdiencapaciteit van het bedrijf, of
      bij gebreke hiervan een inschatting daarvan;

      d) het btw-nummer van de jonge landbouwer en indien van toepassing, de naam van de moedermaatschappij en
      dochtermaatschappij met de daarbij behorende btw-nummers;

      e) gegevens over de genderidentificatie van de jonge landbouwer, met het oog op de doelstelling van artikel 6,
      eerste lid, onderdeel h, van [verordening 2021/2115](32115R2021);

      f) een verklaring dat de jonge landbouwer beschikt over passende opleiding- of vaardigheden;

      g) een verklaring van toestemming aan de minister voor gebruik van de meegestuurde bedrijfsplannen voor statistisch
      onderzoek en analyse op niet tot een individueel bedrijf herleidbaar niveau.

      2 Het bij de aanvraag in te dienen bedrijfsplan bevat ten minste:

      a) de vermelding van een meerjarige periode na de aanvraagdatum waarop het bedrijfsplan zich richt;

      b) een situatieschets van het landbouwbedrijf op het moment van overname of de start;

      c) de gewenste ontwikkeling van het landbouwbedrijf, waaronder in ieder geval vermelding van de te behalen
      mijlpalen voor de komende vijf jaar;

      d) een beschrijving van de kostenposten waaraan de subsidie zal worden besteed;

      e) een beschrijving van de wijze waarop de subsidie bijdraagt aan de versterking van de veerkracht van het bedrijf;

      f) een beschrijving van de aspecten in het bedrijfsplan die bijdragen aan de specifieke doelen opgenomen in artikel
      6 van [Verordening 2021/2115](32115R2021) met betrekking tot klimaatverandering en duurzame energie, efficiënt
      beheer van natuurlijke hulpbronnen en bescherming van de biodiversiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel2.9
