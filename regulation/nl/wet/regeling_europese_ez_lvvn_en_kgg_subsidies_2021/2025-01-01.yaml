    text: |-
      1 Uitgaven voor detectie en diagnosesystemen, inclusief personeelskosten, ten behoeve van precisietoediening in
      verband met geïntegreerde gewasbescherming zijn subsidiabel.

      2 De uitgaven, bedoeld in het eerste lid, zijn onder meer gewas-, water- en bodemanalyses.

      3 In afwijking van het eerste lid zijn gewas-, water en bodemanalyses om de hoeveelheid nutriënten te bepalen niet
      subsidiabel.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.99
  - number: 5.3.100
    text: |-
      1 Uitgaven voor deelname aan certificeringssystemen om een keurmerk te verkrijgen zijn subsidiabel indien:

      a. het certificeringssysteem bindende voorwaarden omvat met betrekking tot productiemethoden;

      b. de naleving van de voorwaarden, bedoeld in onderdeel a, het onderwerp zijn van een onafhankelijke controle door
      gekwalificeerde personen of organen; en

      c. het gaat om de volgende uitgaven voor:

      1°. advies, audits, certificering en lidmaatschapskosten;

      2°. personeelskosten in verband met de certificeringssystemen;

      3°. het ontwikkelen van materialen voor certificeringssystemen; en

      4°. de kosten van ontwikkeling en verbeteren van ICT-systemen en registratiemodules met betrekking tot
      certificeringssystemen.

      2 Subsidiabel zijn:

      a. Nationale en internationale algemene certificeringssystemen en specifieke certificeringssystemen (zoals van de
      producentenorganisatie zelf of van retailers) op het gebied van kwaliteit en voedselveiligheid;

      b. biologische certificeringssystemen; en

      c. certificeringssystemen op het gebied van duurzaamheid en Maatschappelijk Verantwoord Ondernemen (MVO), die
      bijdragen aan de agromilieuklimaatdoelstellingen.

      3 Voor biologische certificeringssystemen als bedoeld in het tweede lid onderdeel b, zijn subsidiabel uitgaven
      voor:

      a. biologische certificeringssystemen in de EU gebaseerd op [verordening 2018/848](32748R2018) inzake de
      biologische productie en de etikettering van biologische producten, waaronder Skal;

      b. uitgaven voor op grond van [Verordening 2018/848](32748R2018) als equivalent erkende biologische
      certificeringssystemen in derde landen; en

      c. lidmaatschapskosten van Skal.

      4 Niet subsidiabel zijn:

      a. uitgaven voor certificering van groenlabelkassen; en

      b. de aanschaf van materialen.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.100
