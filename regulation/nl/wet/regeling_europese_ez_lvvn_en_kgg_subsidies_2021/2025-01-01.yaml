  - number: 5.3.173
    text: |-
      1 Uitgaven van de producentenorganisatie voor het uit de markt nemen van producten bedoeld in artikel 47, tweede
      lid, onderdeel f, van [verordening 2021/2115](32115R2021) zijn subsidiabel.

      2 Als relevante producten voor het uit de markt nemen als bedoeld in artikel 47, tweede lid, onderdeel f, van
      [verordening 2021/2115](32115R2021) worden aangewezen:

      a. tomaten met GN code 0702 00 00;

      b. niet-scherpsmakende pepers (paprika’s) met GN code 0709 60 10;

      c. bloemkool en broccoli met GN code 0704 10 00;

      d. komkommers met GN code 0707 00 05;

      e. appelen met GN code 0808 10;

      f. peren met GN code 0808 30;

      g. aardbeien met GN code 0810 10; en

      h. aubergines met GN code 0709 30.

      3 In het geval van een crisis kan de minister besluiten om het uit de markt nemen van producten als bedoeld in
      artikel 47, tweede lid, onderdeel f, van [verordening 2021/2115](32115R2021) ook voor andere producten open te
      stellen.

      4 Als toegestane bestemmingen als bedoeld in artikel 27, eerste lid, van [verordening 2022/126](32026R2022) worden
      aangewezen:

      a. afvoer naar de afvalverwerkende industrie, nadat het product is gedenatureerd en daarmee niet meer voor
      voedingsdoeleinden op de markt kan komen;

      b. afvoer naar veehouders ten behoeve van vervoedering, nadat het product is gedenatureerd en daarmee niet meer
      voor voedingsdoeleinden op de markt kan komen; en

      c. gratis verstrekking, als bedoeld in artikel 47, tweede lid, onderdeel f van [verordening 2021/2115](32115R2021),
      aan liefdadigheidsinstellingen of -organisaties als bedoeld in [artikel 5.3.176, eerste lid][ref1].

      5 Het vierde lid, onderdelen a en b, zijn alleen van toepassing op bederfelijke producten die zonder koeling niet
      duurzaam kunnen worden opgeslagen in het normale handelsstadium van die producten, als bedoeld in artikel 19,
      tweede alinea, van [verordening 2022/126](32026R2022).

      6 Afvalverwerkers beschikken over een geldige milieuvergunning.

      7 Afnemers van producten die uit de markt genomen zijn mogen geen vergoeding betalen voor het uit de markt genomen
      product.


