  - number: 5.2.25
    text: |-
      Indien de minister op grond van [artikel 5.2.24 derde lid][ref1], aanvullende bewijsstukken opvraagt wordt de
      in artikel 154, vierde lid, van [verordening 1308/2013](32013R1308) bedoelde termijn opgeschort tot de verzochte
      aanvullende bewijsstukken door de producentenorganisatie aan de minister zijn overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel5.2.24
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.25
