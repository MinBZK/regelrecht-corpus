  - number: 5.1.9
    text: |-
      1 Indien een subsidie wordt verleend van minder dan € 25.000, wordt:

      a. direct een beschikking tot subsidievaststelling gegeven, of

      b. de subsidie ambtshalve vastgesteld.

      In aanvulling op [artikel 2.12][ref1] vermeldt de beschikking tot subsidieverlening de datum waarop de activiteiten
      uiterlijk moeten zijn verricht en de datum waarop de subsidie uiterlijk ambtshalve wordt vastgesteld.

      2 Indien de subsidie minder bedraagt dan € 25.000 zijn de [artikelen 2.18][ref2] en [2.19][ref3] niet van
      toepassing.

      3 Op een subsidie bedoeld in het eerste lid, onderdeel a, is [artikel 2.15, eerste en tweede lid][ref4], niet van
      toepassing.

      4 Indien de subsidie minder bedraagt dan € 25.000 is de subsidieontvanger verplicht om desgevraagd, op door de
      minister van tevoren in de beschikking of in dit hoofdstuk aangegeven wijze, aan te tonen dat de activiteiten
      waarvoor de subsidie is verleend, zijn verricht en dat is voldaan aan de aan de subsidie verbonden verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel2.12
