    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.6.12
  - number: 5.7.1
    text: |-
      In deze titel wordt verstaan onder:

        - *bedrijfsadviseringssysteem:* een bedrijfsadviseringssysteem als bedoeld in de [artikelen 37][ref1] en
      [38 van de Uitvoeringsregeling GLB 2023][ref2];
        - *bedrijfsadviseur:* een adviseur die landbouwers adviseert;
        - *demonstratiebedrijf:* het agrarisch bedrijf van een landbouwer dat een demonstratieproject verzorgt;
        - *demonstratieproject:* een project dat wordt verzorgd door een demonstratiebedrijf en is bedoeld om landbouwers
      te inspireren en te laten zien hoe bestaande en bewezen omschakelmaatregelen gericht op verduurzaming van de
      landbouw in de praktijk kunnen worden toegepast in de eigen landbouwpraktijk;
        - *dierlijke meststoffen:* dierlijke meststoffen als bedoeld in
      [artikel 1, eerste lid, onderdeel c, van de Meststoffenwet][ref3];
        - *diervoeders:* diervoeders als bedoeld in artikel 3, vierde lid, van [Verordening (EG) nr. 178/2002](32002R0178)
      van het Europees Parlement en de Raad van 28 januari 2002 tot vaststelling van de algemene beginselen en
      voorschriften van de levensmiddelenwetgeving, tot oprichting van een Europese Autoriteit voor voedselveiligheid en
      tot vaststelling van procedures voor voedselveiligheidsaangelegenheden (PbEG 2002, L 31);
        - *dierwaardige veehouderij:* veehouderij die voldoet aan de zes leidende principes bedoeld in het advies van de
      Raad voor Dierenaangelegenheden van 18 november 2021, te weten: 1) erkenning intrinsieke waarde van het dier, 2)
      goede voeding, 3) goede omgeving, 4) goede gezondheid, 5) natuurlijk gedrag en 6) positieve emotionele toestand van
      het dier;
        - *erkende bedrijfsadviseur:* bedrijfsadviseur die: a. overeenkomstig
      [artikel 38, tweede lid, van de Uitvoeringsregeling GLB 2023][ref4] is erkend in het
      kader van het bedrijfsadviseringssysteem; en b. naar het oordeel van een op grond van
      [artikel 38, eerste lid, van de Uitvoeringsregeling GLB 2023][ref5] aangewezen beroepsorganisatie:
      1°. beschikt over actuele kennis over ten minste één van de onderwerpen, bedoeld in
      [artikel 5.7.10, eerste lid, onderdeel a][ref6]; 2°. niet werkzaam is bij een onderneming die landbouwproducten,
      gewasbeschermingsmiddelen, diervoeders, landbouwmechanisatieproducten of meststoffen verkoopt of een onderneming
      die in een groep verbonden is aan een onderneming die deze producten verkoopt; 3°. in staat is landbouwers op
      strategisch en tactisch niveau te adviseren;
        - *geïntegreerde gewasbescherming:* geïntegreerde gewasbescherming als bedoeld in
      [artikel 1, eerste lid, van de Wet gewasbeschermingsmiddelen en biociden][ref7];
        - *gewasbeschermingsmiddel:* gewasbeschermingsmiddel als bedoeld in artikel 2, eerste lid, van [Verordening (EG)
      Nr. 1107/2009](32009R1107) van het Europees Parlement en de Raad van 21 oktober 2009 betreffende het op de markt
      brengen van gewasbeschermingsmiddelen en tot intrekking van de [Richtlijnen 79/117/EEG](31979L0117) en [91/414/EEG]
      (31991L0414) van de Raad (PbEU 2009, L 309);
        - *kennisinstelling:* de volgende in de [bijlage van de Wet op het hoger onderwijs en wetenschappelijk onderzoek]
      (onbekend) genoemde instellingen voor hoger onderwijs: – De openbare universiteit te Wageningen; – Aeres
      Hogeschool, uitgaande van de Stichting Aeres Groep; – HAS Green Academy, uitgaande van de Stichting HAS Opleidingen
      te ’s-Hertogenbosch; – Van Hall Larenstein, uitgaande van de Stichting Van Hall Larenstein; – Hogeschool INHOLLAND,
      uitgaande van de Stichting Hoger Onderwijs Nederland;
        - *meststoffen:* meststoffen als bedoeld in [artikel 1, eerste lid, onderdeel d, van de Meststoffenwet][ref8];
        - *Opleiding bedrijfscoach Natuurinclusief ondernemen in de landbouw:* de Opleiding bedrijfscoach Natuurinclusief
      ondernemen in de landbouw, ontwikkeld in 2022 door de openbare universiteit te Wageningen, HAS Green Academy, Aeres
      Hogeschool, Van Hall Larenstein en Hogeschool INHOLLAND;
        - *Opleiding bedrijfscoach precisielandbouw:* de Opleiding bedrijfscoach precisielandbouw, ontwikkeld in 2022 door
      de openbare universiteit te Wageningen, HAS Green Academy, Aeres Hogeschool, Van Hall Larenstein en Hogeschool
      INHOLLAND;
        - *Opleiding bedrijfscoach stikstof in de landbouw:* de Opleiding bedrijfscoach stikstof in de landbouw, ontwikkeld
      in 2020 door de openbare universiteit te Wageningen, HAS Green Academy, Aeres Hogeschool, Van Hall Larenstein en
      Hogeschool INHOLLAND;
        - *Verdiepingscursus Natuurinclusief ondernemen in de landbouw:* de Verdiepingscursus Natuurinclusief ondernemen in
      de landbouw, ontwikkeld in 2022 door de openbare universiteit te Wageningen, HAS Green Academy, Aeres Hogeschool,
      Van Hall Larenstein en Hogeschool INHOLLAND;
        - *Verdiepingscursus precisielandbouw:* de Verdiepingscursus precisielandbouw, ontwikkeld in 2022 door de openbare
      universiteit te Wageningen, HAS Green Academy, Aeres Hogeschool, Van Hall Larenstein en Hogeschool INHOLLAND;
        - *Verdiepingscursus stikstof in de landbouw:* de Verdiepingscursus stikstof in de landbouw, ontwikkeld in 2020
      door de openbare universiteit te Wageningen, HAS Green Academy, Aeres Hogeschool, Van Hall Larenstein en Hogeschool
      INHOLLAND.


