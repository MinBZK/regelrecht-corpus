  - number: 5.1.12
    text: |-
      1 Over de periode van 16 oktober (jaar t-1) tot en met 15 oktober (jaar t) worden de gegevens openbaar gemaakt
      over de subsidies en andere steunbedragen van het ELGF met betrekking tot sectorale interventies en het Elfpo voor
      toepassing van artikel 98, tweede tot en met vierde lid, van [verordening 2021/2116](32116R2021).

      2 De in het eerste lid bedoelde gegevens worden ontleend aan de financiële administratie van RVO ten behoeve van
      het ELGF met betrekking tot sectorale interventies en het Elfpo.

      3 De gegevens, bedoeld in het eerste lid, worden uiterlijk 31 mei (jaar t+1) openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.1.12
  - number: 5.1.12a
    text: |-
