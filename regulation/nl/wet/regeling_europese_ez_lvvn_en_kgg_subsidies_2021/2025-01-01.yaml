  - number: 5.6.1
    text: |-
      In deze titel wordt verstaan onder:

        - *EIP:* Europees Innovatiepartnerschap voor de productiviteit en duurzaamheid in de landbouw als bedoeld in
      artikel 127 van [verordening 2021/2115](32115R2021);
        - *gebiedsgerichte fieldlab:* een fysieke praktijkomgeving waar nationale en regionale overheden, bedrijven,
      onderwijsinstellingen en kennisinstellingen in een regionaal netwerk samenkomen om gebiedsgericht nieuwe
      technologische en sociale innovaties te ontwikkelen, ermee te experimenten, te demonstreren, ervan te leren, op te
      schalen, te implementeren of onderzoek naar te doen;
        - *gebruiker:* een natuurlijke of rechtspersoon als bedoeld in artikel 2, twaalfde lid van [verordening 2023/2854]
      (32854R2023);
        - *gegevenshouder:* een natuurlijke of rechtspersoon als bedoeld in artikel 2, dertiende lid van [verordening
      2023/2854](32854R2023);
        - *gegevensontvanger:* een natuurlijke of rechtspersoon als bedoeld in artikel 2, veertiende lid van [verordening
      2023/2854](32854R2023);
        - *innovatie:* vernieuwing die gebruikt wordt in de praktijk;
        - *operationele groep:* samenwerkingsverband dat deel uitmaakt van een EIP en bestaat uit minimaal twee actoren,
      waarvan minimaal één landbouwer, en dat is gericht op het ontwikkelen, valideren en verfijnen van innovaties;
        - *potentiële jonge landbouwer:* jonge landbouwer die niet hoeft te voldoen aan het vereiste van bedrijfshoofd,
      bedoeld in de begripsbepaling van ‘jonge landbouwer’ in [artikel 5.1.1., eerste lid][ref1];
        - *verordening 2023/2854:* [Verordening (EU) 2023/2854](32023R2854) van het Europees Parlement en de Raad van
      13 december 2023 betreffende geharmoniseerde regels inzake eerlijke toegang tot en eerlijk gebruik van data en tot
      wijziging van [Verordening (EU) 2017/2394](32017R2394) en [Richtlijn (EU) 2020/182](32020L0182).


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel5.1.1
