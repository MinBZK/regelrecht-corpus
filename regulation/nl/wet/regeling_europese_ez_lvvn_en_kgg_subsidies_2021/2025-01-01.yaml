  - number: 4.2.6
    text: |-
      1 Indien subsidie wordt aangevraagd voor projecten waarvan de totale kostprijs niet meer dan € 200.000 bedraagt,
      wordt de subsidie verleend met gebruikmaking van eenheidskosten of vaste bedragen als bedoeld in artikel 53,
      tweede lid, van [verordening 2021/1060](32960R2021) en kan de subsidie worden vastgesteld op basis van een
      ontwerpbegroting als bedoeld in artikel 53, derde lid, aanhef en onderdeel b, van [verordening 2021/1060]
      (32960R2021).

      2 De [artikelen 1.3a][ref1], [1.3b][ref2], [1.3c][ref3] en [1.3d][ref4] zijn niet van toepassing, indien de
      subsidie wordt verleend met gebruikmaking van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel1.3a
      [ref2]: https://wetten.overheid.nl/BWBR0045685#Artikel1.3b
      [ref3]: https://wetten.overheid.nl/BWBR0045685#Artikel1.3c
      [ref4]: https://wetten.overheid.nl/BWBR0045685#Artikel1.3d
