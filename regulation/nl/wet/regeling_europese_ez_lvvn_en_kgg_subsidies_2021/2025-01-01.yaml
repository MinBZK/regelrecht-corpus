  - number: 4.2.8
    text: |-
      Behoudens de bijdrage aan een financieringsinstrument als bedoeld in [artikel 4.2.2, tweede lid][ref1], verdeelt de
      beheerautoriteit een beschikbaar subsidiebedrag:

      a. op volgorde van ontvangst van de aanvragen, overeenkomstig [artikel 4.2.9][ref2]; of

      b. op basis van rangschikking van de aanvragen, overeenkomstig [artikel 4.2.10][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel4.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0045685#Artikel4.2.9
      [ref3]: https://wetten.overheid.nl/BWBR0045685#Artikel4.2.10
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel4.2.8
    references:
      - id: ref1
        bwb_id: BWBR0045685
        artikel: 4.2.2
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0045685
        artikel: 4.2.9
