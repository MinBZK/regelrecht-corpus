  - number: 5.7.35
    text: |-
      1 De minister kent aan een project een hoger aantal punten toe naarmate:

      a. de uitgangssituatie van de landbouwer(s) bij indiening bijdraagt aan minimaal vijf van de onderwerpen in
      [artikel 5.7.28, tweede lid][ref1];

      b. de impact van het demonstratieproject groter is voor de doelgroep;

      c. de motivatie en combinatie van de aanvrager en eventueel andere betrokkenen bij het demonstratieproject beter
      is;

      d. de kwaliteit van het projectplan hoger is;

      e. de kosteneffectiviteit van het demonstratieproject hoger is.

      2 Het aantal punten bedraagt per onderdeel van het eerste lid ten hoogste vijf punten.

      3 Voor de rangschikking wordt het aantal punten gegeven voor het eerste lid, onderdelen a en b, vermenigvuldigd
      met twee.

      4 De minister rangschikt de aanvragen waarop niet afwijzend is beslist hoger naarmate in totaal meer punten aan het
      project zijn toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel5.7.28
