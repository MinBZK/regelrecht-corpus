        artikel: 5.2.36
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: 5.2.2
  - number: 5.2.36
    text: |-
      1 Voor het bepalen van de waarde van de afgezette productie die is gerealiseerd voorafgaand aan de toetreding tot
      de producentenorganisatie kan de producentenorganisatie gebruik maken van:

      a. de opgave van een andere producentenorganisatie, indien de nieuw toegetreden aangesloten producent
      voorafgaand aan zijn lidmaatschap bij de nieuwe producentenorganisatie in de gehele referentieperiode, bedoeld in
      [artikel 5.2.33][ref1], of gedeeltelijk gedurende die periode was aangesloten en daarop reeds een controle door een
      extern accountant heeft plaats gevonden;

      b. een opgave van de aangesloten producent van de waarden van de afgezette productie van de producten waarvoor de
      producent bij de producentenorganisatie is aangesloten.

      2 Bij de opgave, bedoeld in het eerste lid, onderdeel b, wordt eveneens opgave gedaan van eerdere lidmaatschappen,
      met ingang van de referentieperiode, bedoeld in [artikel 5.2.33][ref2], bij de producentenorganisatie.

      3 Bij de opgave, bedoeld in het eerste lid, onderdeel b, wordt een controleverklaring of rapportage naar aanleiding
      van een COS 4400 onderzoek van een extern accountant overgelegd waarin wordt bevestigd dat de waarden die zijn
      opgegeven:

      a. juist zijn;

      b. gerealiseerd zijn door de verkoop van producten waarvoor de producentenorganisatie is erkend;

      c. producten betreffen die voor eigen rekening en risico door de betreffende producent binnen het grondgebied van
      de Europese Unie zijn geproduceerd; en

      d. geen BTW en transportkosten bevatten.

      4 In de controleverklaring of rapportage wordt tevens bevestigd dat de opgave, bedoeld in het tweede lid, juist is.

      5 Indien de opgave van de afgezette productie, bedoeld in het eerste lid, onderdeel a, afkomstig is van een
      producentenorganisatie die gevestigd is in een andere lidstaat omvat die opgave tevens een schriftelijke verklaring
      dat de waarde niet eerder aan een subsidieaanvraag ten grondslag heeft gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel5.2.33
      [ref2]: https://wetten.overheid.nl/BWBR0045685#Artikel5.2.33
