      2 Een aanvraag tot deelbetaling bedraagt minimaal 25% van de verleende subsidie en ten minste € 50.000 van de
      verleende subsidie. Een deelbetaling kan maximaal twee keer per jaar worden aangevraagd.

      3 Onverminderd de [artikelen 5.1.7, tweede lid][ref1], en [5.1.8][ref2] bedragen de deelbetalingen en het voorschot
      samen ten hoogste 90% van de verleende subsidie.


