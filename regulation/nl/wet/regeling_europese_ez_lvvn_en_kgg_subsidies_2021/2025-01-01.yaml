  - number: 5.2.32
    text: |-
      De erkenning van een producentenorganisatie wordt met ingang van het tijdstip van verstrijken van de termijn zoals
      vastgelegd in het aanmaningsbesluit, bedoeld in artikel 59, eerste lid, van [verordening 2017/891](32791R2017),
      van rechtswege opgeschort, tenzij de minister voor het verstrijken van deze termijn schriftelijk aan de
      producentenorganisatie heeft medegedeeld dat de niet-naleving van de erkenningscriteria tijdig is gecorrigeerd.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.32
  - number: 5.2.33
    text: |-
      Voor iedere producentenorganisatie is de referentieperiode voor het bepalen van de waarde van de afgezette
      productie, bedoeld in artikel 32, eerste lid, van [verordening 2022/126](32026R2022), het kalenderjaar twee jaar
      voorafgaande aan het uitvoeringsjaar van het operationeel programma.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.2.33
  - number: 5.2.34
    text: |-
      1 Producten zijn geproduceerd door de producentenorganisatie, wanneer de productie voor eigen rekening en risico
      van de producentenorganisatie of de daarbij aangesloten producenten op het grondgebied van de Europese Unie heeft
      plaatsgevonden

      2 Verkoop van nog niet geoogste producten valt onder productie van leden van de producentenorganisatie en wordt in
      de waarde van de afgezette productie opgenomen, mits de verkoop via de producentenorganisatie is gelopen en het de
      eerste verkoop betreft waarbij het product van eigenaar verandert.

      3 Verkoop van door aangesloten producenten of door de producentenorganisatie aangekochte producten valt niet onder
      de waarde van de afgezette productie van de leden van de producentenorganisatie, ook niet als deze producten als
      halfgewas zijn aangekocht. In uitzonderlijke gevallen kan de minister besluiten om de aangekochte producten onder
      de productie van de leden van de producentenorganisatie te laten vallen indien deze productie voor eigen rekening
      en risico van het betreffende lid heeft plaatsgevonden.

      4 De producentenorganisatie controleert de naleving van het eerste onderscheidenlijk tweede lid.

      5 Ter uitvoering van artikel 31, zesde lid, van [verordening 2022/126](32026R2022) omvat de waarde van de
      afgezette productie in het stadium ‘af producentenorganisatie’ de aan de afnemer gefactureerde kosten van
      verpakkingsmateriaal, eenmalig fust, huur van meermalig fust en de verpakking waarin of pallet waarop het product
      ter verkoop wordt aangeboden.

      6 In de waarde van de afgezette productie worden geen transportkosten opgenomen, ongeacht of deze kosten betrekking
      hebben op intern of extern transport en ongeacht of deze op de verkoopfactuur zijn vermeld.

      7 Ter uitvoering van artikel 31, negende lid, van [verordening 2022/126](32026R2022) mogen vergoedingen worden
      meegeteld die in de referentieperiode, bedoeld in [artikel 5.2.33][ref1], in het kader van oogstverzekeringsacties
      of door de producentenorganisatie beheerde acties, bedoeld in [artikel 5.3.172][ref2], zijn uitgekeerd aan de
      producentenorganisatie of haar leden.

      8 In de waarde van de afgezette productie worden geen debiteuren opgenomen die op het tijdstip van definitieve
      opgave van de waarde van de afgezette productie, bedoeld in [artikel 5.2.38, tweede lid][ref3], nog openstaan.

      9 Terugbetalingen aan afnemers worden uit de waarde van de afgezette productie gehaald op het moment dat
      creditering in de boekhouding van de producentenorganisatie gebruikelijk is.

      10 In de waarde van de afgezette productie wordt niet de waarde opgenomen van verkopen die hebben plaatsgevonden
      aan een lid of aan het lid verbonden partijen, indien het betreffende lid deze producten zelf heeft geproduceerd.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel5.2.33
      [ref2]: https://wetten.overheid.nl/BWBR0045685#Artikel5.3.172
      [ref3]: https://wetten.overheid.nl/BWBR0045685#Artikel5.2.38
