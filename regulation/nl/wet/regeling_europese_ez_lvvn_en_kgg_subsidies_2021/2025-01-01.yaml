  - number: '2.16'
    text: |-
      1 Indien de beschikking tot subsidieverlening betrekking heeft op een projectplan, voert de subsidieontvanger de
      activiteiten uit overeenkomstig dit projectplan.

      2 De minister kan voor het vertragen of het essentieel wijzigen van de wijze van uitvoering van de activiteiten op
      voorafgaand verzoek van de subsidieontvanger of, indien subsidieontvangers samenwerken in een samenwerkingsverband,
      de penvoerder ontheffing verlenen van de verplichting, bedoeld in het eerste lid, tenzij hierdoor afbreuk wordt
      gedaan aan de activiteit waarvoor subsidie is verleend, de doelstelling van de subsidie of de voorwaarden van de
      subsidieverstrekking.

      3 Aan de in het tweede lid genoemde ontheffing kunnen voorschriften worden verbonden.

      4 Voor de toepassing van het tweede lid geldt de voorwaarde dat door de ontheffing geen afbreuk wordt gedaan aan de
      activiteit waarvoor subsidie is verleend, het doel van de subsidie of de voorwaarden van de subsidieverstrekking,
      niet, indien aan de verplichting, bedoeld in het eerste lid, niet kan worden voldaan uitsluitend als direct gevolg
      van de crisis in verband met COVID-19.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel2.16
  - number: '2.17'
    text: |-
      1 De subsidieontvanger of, indien subsidieontvangers samenwerken in een samenwerkingsverband, de penvoerder voert
      een zodanige administratie dat daaruit te allen tijde op eenvoudige en duidelijke wijze is af te leiden:

      a. de aard, inhoud en voortgang van de verrichte activiteiten;

      b. dat de communicatieactiviteiten, bedoeld in [artikel 2.9, vijfde lid, onderdeel a, subonderdeel 6°][ref1],
      worden uitgevoerd;

      c. het aantal eenheden dat per kostendrager is besteed aan activiteiten die voor subsidie in aanmerking komen; en

      d. in geval loonkosten, eigen arbeid of bijdragen in natura als bedoeld in [artikel 1.3e][ref2] subsidiabel zijn en
      deze kosten niet worden berekend door overige subsidiabele kosten te vermenigvuldigen met een bepaalde factor, het
      aantal uren dat per persoon is besteed aan activiteiten die voor subsidie in aanmerking komen.

      2 De administratie wordt ten minste vijf jaar na de datum van de laatste betaling van de minister aan de
      subsidieontvanger bewaard.

      3 In geval van een gerechtelijke procedure wordt de administratie ten minste tien jaar na de datum van de
      afhandeling van de gerechtelijke procedure bewaard.


