  - number: 1.3d
    text: |-
      1 De berekeningsmethoden, bedoeld in [artikel 1.3a][ref1] en [1.3b, eerste lid][ref2], kunnen niet worden
      gecombineerd met de berekeningsmethoden, bedoeld in [artikel 1.3c][ref3], binnen een project.

      2 Indien een subsidieontvanger de integrale kostensystematiek, bedoeld in [artikel 1.3b, eerste lid][ref4],
      hanteert binnen een project, kunnen het vaste uurtarief en het vaste percentage, bedoeld in
      [artikel 1.3c, eerste lid][ref5], gehanteerd worden door, indien van toepassing, de andere subsidieontvangers
      binnen hetzelfde project.

      3 Indien de in het tweede lid bedoelde combinatie binnen een project wordt toegepast, kunnen de kosten, bedoeld
      in [artikel 1.3, eerste lid, aanhef en onderdelen c tot en met e][ref6], niet apart worden toegerekend aan het
      project.


