    text: |-
      Uitgaven voor activiteiten ten behoeve van professionalisering van de producentenorganisatie richting de markt
      zijn subsidiabel, indien het gaat om de kosten van inhuur van externe deskundigen voor activiteiten van de
      producentenorganisatie op het gebied van afzet.
