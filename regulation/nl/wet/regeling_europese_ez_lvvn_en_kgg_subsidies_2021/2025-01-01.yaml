  - number: 5.3.188
    text: |-
      Uitgaven van de producentenorganisatie, inclusief personeelskosten, voor communicatieacties gericht op bewustmaking
      en het informeren van consumenten, als bedoeld in artikel 47, tweede lid, onderdeel l van [verordening 2021/2115]
      (32115R2021) zijn subsidiabel.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.188
  - number: 5.3.189
    text: |-
      De activiteiten die zijn opgenomen in deze paragraaf kunnen worden ingezet in het kader van projecten
      ter realisatie van de sectorale doelstelling verbetering van de arbeidsvoorwaarden en handhaving van de
      werkgeversverplichtingen en van de vereisten voor gezondheid en veiligheid op het werk, bedoeld in artikel 46,
      aanhef en onderdeel k, van [verordening 2021/2115](32115R2021).
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.189
  - number: 5.3.190
    text: |-
      1 Uitgaven van de producentenorganisatie voor een investering in een duurzaam productiemiddel ten behoeve van de
      bescherming van de gezondheid van medewerkers op de locatie van de producentenorganisatie, een dochteronderneming
      of een lid in geval van een uitbraak van besmettelijke humane ziekten is subsidiabel.

      2 Investeringen, bedoeld in het eerste lid, zijn onder meer speciale voorzieningen zoals schermen of technische
      aanpassingen.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.190
  - number: 5.3.191
    text: |-
      1 Uitgaven van de producentenorganisatie, inclusief personeelskosten, ten behoeve van bescherming van de gezondheid
      van medewerkers op de locatie van de producentenorganisatie, een dochteronderneming of een lid in geval van een
      uitbraak van besmettelijke humane ziekten zijn subsidiabel.

      2 Uitgaven, bedoeld in het eerste lid, zijn onder meer de inhuur van hygiënediensten.

      3 Niet subsidiabel zijn onder meer uitgaven voor:

      a. persoonlijke hygiëne zoals mondkapjes, handschoenen, zeep, beschermende kleding;

      b. bloed- of speekseltesten;

      c. hygiënemaatregelen in ruimten die niet gerelateerd zijn aan de teelt, bewerking of verkoop van producten.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.191
  - number: 5.3.192
    text: |-
      Indien een uitgave afwijkt van de in het operationele programma opgenomen begroting voor een uitgavenpost, wordt
      deze afwijking bij de aanvraag tot subsidievaststelling over het voorafgaande jaar voldoende gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.192
  - number: 5.3.193
    text: |-
      De producentenorganisatie dient tussen 1 februari en 1 april om 12:00 uur een aanvraag tot subsidievaststelling
      over het voorafgaande jaar in, vergezeld van een overzicht van de per project en activiteit gevraagde subsidie en
      de detailstaat declaratie in, met gebruikmaking van een door de minister beschikbaar gesteld middel.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.193
  - number: 5.3.194
    text: |-
      1 Uitgaven als bedoeld in [afdeling 5.2.3, paragraaf 3][ref1], en [afdeling 5.3.2][ref2] worden opgenomen in de
      aanvraag voor een gedeeltelijke betaling of aanvraag tot subsidievaststelling voor het uitvoeringsjaar waarin de
      activiteit wordt uitgevoerd, tenzij in afdeling 5.2.3, paragraaf 3 en afdeling 5.3.2 anders wordt bepaald.

      2 In afwijking van het eerste lid kunnen uitgaven als bedoeld in [afdeling 5.2.3, paragraaf 3][ref3] en
      [afdeling 5.3.2][ref4] worden betaald in de periode van 1 januari tot en met 31 maart van het jaar volgend op het
      uitvoeringsjaar waarin de activiteit wordt uitgevoerd, indien de uitgaven in die periode in het actiefonds worden
      verwerkt.

      3 Crediteringen en creditfacturen worden in mindering gebracht op de hoogte van de financiële steun in de aanvraag
      tot gedeeltelijke betaling of aanvraag tot subsidievaststelling.

      4 Crediteringen en creditfacturen die na indiening van een aanvraag tot gedeeltelijke betaling of na afloop van de
      aanvraag tot subsidievaststelling worden ontvangen worden onverwijld gemeld aan de minister.


