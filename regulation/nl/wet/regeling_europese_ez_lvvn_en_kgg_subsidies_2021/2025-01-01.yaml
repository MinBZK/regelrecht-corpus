  - number: 5.4.10
    text: |-
      1 De minister kent aan een aanvraag, op basis van het bijbehorende projectplan, een hoger aantal punten toe aan de
      hand van de volgende criteria:

      a. de mate van inhoudelijke diepgang, waaraan ten hoogste de volgende punten worden toegekend:

      1°. de doelstellingen zijn toepasselijk en duidelijk omschreven: ten hoogste 5 punten;

      2°. het voorstel bouwt voldoende voort op wetenschappelijke kennis: ten hoogste 16 punten;

      3°. de voorgestelde methode of aanpak om de doelstellingen te bereiken is duidelijk omschreven en realistisch: ten
      hoogste 5 punten;

      4°. de kwaliteit van de kennisinstelling of onderzoeksorganisatie is voldoende of er is voldoende kennis aanwezig
      bij de verschillende deelnemers waaronder medewerkers, projectcoördinatoren en partners: ten hoogste 5 punten;

      5°. het voorstel is voldoende creatief en heeft voldoende stimulerend potentieel: ten hoogste 5 punten;

      b. de mate van relevantie voor de imkerpraktijk en potentiële impact van de activiteiten voor de imkerpraktijk,
      waaraan ten hoogste 45 punten worden toegekend;

      c. de kwaliteit en efficiëntie van het voorstel, waaraan ten hoogste de volgende punten worden toegekend:

      1°. de kwaliteit en effectiviteit van het werkplan, inclusief de mate waarin de mensen en middelen worden ingezet,
      zijn voldoende om de doelstellingen en producten te realiseren: ten hoogste 2 punten;

      2°. de managementstructuren en procedures zijn voldoende, inclusief risico’s, ethische kwesties en omgang met
      gegevens om de activiteiten uit te voeren: ten hoogste 1 punt;

      3°. de complementariteit van de deelnemers is voldoende zodat de onderzoeksgroep of het samenwerkingsverband de
      noodzakelijke expertise kan leveren: ten hoogste 2 punten;

      4°. de rolverdeling in het voorstel is duidelijk omschreven: ten hoogste 2 punten;

      5°. de budgettering van het projectplan is voldoende: ten hoogste 2 punten.

      2 Het aantal punten dat wordt behaald, betreft het totaal van de punten die op grond van de onderdelen a, b en c
      van het eerste lid worden toegekend. Het maximum aantal punten is 90.

      3 De minister rangschikt de aanvragen waarop niet afwijzend is beslist hoger naarmate in totaal meer punten aan het
      project zijn toegekend.

      4 In afwijking van [artikel 2.6, tweede lid][ref1], rangschikt de minister indien aan twee of meer aanvragen
      in totaal een gelijk aantal punten is toegekend, een aanvraag hoger naarmate meer punten zijn toegekend aan
      respectievelijk onderdeel a en b van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel2.6
