  - number: 5.3.10
    text: |-
      De activiteiten die zijn opgenomen in deze paragraaf kunnen worden ingezet in het kader van projecten ter
      realisatie van de sectorale doelstelling productieplanning en -organisatie, bedoeld in artikel 46, aanhef en
      onderdeel a, van [verordening 2021/2115](32115R2021).
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.10
  - number: 5.3.11
    text: |-
      1 Uitgaven voor de aanschaf van LED belichtingsinstallaties zijn subsidiabel indien de belichtingsinstallatie
      voldoet aan:

      a. de voorwaarden gesteld in [titel 2.3 van de Regeling nationale EZK- en LNV-subsidies][ref1] inzake energie-
      efficiëntie glastuinbouw; en

      b. de voorwaarde dat de energie, die voor de belichtingsinstallatie wordt gebruikt, een duurzaam karakter
      heeft of wordt opgewekt met behulp van een warmtekrachtkoppelingsinstallatie. Dit geldt gedurende de gehele
      instandhoudingstermijn, als bedoeld in [artikel 5.2.63, eerste lid][ref2].

      2 Niet subsidiabel zijn:

      a. uitgaven voor schermen ten behoeve van lichtafscherming en verwijderingsbijdragen;

      b. uitgaven voor belichtingsinstallaties met andere dan LED verlichting, zoals SON-T;

      c. uitgaven voor cyclische belichting;

      d. uitgaven voor de vervanging van bestaande LED belichtingsinstallaties of onderdelen daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
      [ref2]: https://wetten.overheid.nl/BWBR0045685#Artikel5.2.63
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.11
    references:
      - id: ref1
        bwb_id: BWBR0035474
      - id: ref2
        bwb_id: BWBR0045685
        artikel: 5.2.63
        hoofdstuk: '5'
        paragraaf: '3'
        afdeling: 5.2.3
  - number: 5.3.12
    text: |-
      1 Uitgaven van de producentenorganisatie ten behoeve van het optimaliseren van de productkwaliteit in de keten zijn
      subsidiabel indien het gaat om investeringen ten behoeve van:

      a. het verhogen van de houdbaarheid van de producten;

      b. voedselveiligheid;

      c. kwaliteitszorgsystemen;

      d. het verhogen van de fysieke productkwaliteit; en

      e. lange en korte bewaring in koelhuizen, koelcellen, koelinstallaties, vriescellen.

      2 Investeringen als bedoeld in het eerste lid zijn niet subsidiabel voor zover deze normale landbouwpraktijk zijn.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.12
  - number: 5.3.13
    text: |-
      Investeringen van de producentenorganisatie voor de aanschaf van systemen voor aanvoerprognoses, aanvoerregistratie
      en areaalenquêtes zijn subsidiabel onder de volgende voorwaarden:

      a. indien het gaat om systemen, artificiële intelligentie of algoritmen in het kader van deze systemen of indien
      het gaat om aanpassingen in deze systemen en interfaces; en

      b. mits de systemen bij de producentenorganisatie en bij haar leden met elkaar kunnen communiceren.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.13
  - number: 5.3.14
    text: |-
      1 Investeringen van producentenorganisaties ten behoeve van voorraadbeheer en distributie door de keten zijn
      subsidiabel indien het gaat om het ontwerpen, bouwen en implementeren van ICT systemen voor logistieke planning en
      voor zover zij tot doel hebben:

      a. kwaliteitsverbetering van het proces, inclusief ICT-systeem voor werking koeling in de keten;

      b. tracking and tracing van producten, inclusief ICT-systemen voor het volgen van kratten of bakken hogerop in de
      keten, mits het ten behoeve van de producentenorganisatie is;

      c. koppeling van vraag aan aanbod; of

      d. efficiencyverbetering.

      2 Onder de uitgaven vallen kosten voor de interface van ICT systemen voor logistieke planning, inclusief de
      benodigde aanpassingen ten behoeve van de werking van de interface, met:

      a. een aanvoerregistratiesysteem;

      b. een verkoopsysteem;

      c. het verladingssysteem;

      d. een orderregistratiesysteem; of

      e. een facturatiesysteem.

      3 Uitgaven op locatie van de leden van de producentenorganisatie zijn slechts subsidiabel indien de
      producentenorganisatie kan aantonen dat zij integraal onderdeel uitmaken van het systeem voor logistieke planning
      van de producentenorganisatie.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.14
  - number: 5.3.15
    text: |-
      1 Uitgaven van de producentenorganisatie voor investeringen in conditioneringssystemen ten behoeve van bewaring van
      producten zijn subsidiabel.

      2 Niet subsidiabel zijn uitgaven voor:

      a. installaties of apparatuur voor conditionering van champignon- en witloftrekcellen; en

      b. droogsystemen voor de aanzuiging van buitenlucht ten behoeve van knoflook.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.15
  - number: 5.3.16
    text: |-
      1 Uitgaven van de producentenorganisatie zijn subsidiabel indien:

      a. het gaat om investeringen in gecombineerde oogst-, sorteer- en verpakkingssystemen, waaronder apparatuur,
      bestemd voor het reinigen, sorteren, wegen of verpakken van de geteelde gewassen; en

      b. de investeringen gebruikt worden direct na de oogstfase in het veld of in de kas.

      2 In geval van een geïntegreerd systeem met een oogstmachine zijn de meerkosten van de toegevoegde functies ten
      opzichte van een vergelijkbare oogstmachine zonder extra functies subsidiabel.

      3 Investeringen in aparte oogstsystemen en tractoren zijn niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.16
  - number: 5.3.17
    text: |-
      1 Uitgaven van de producentenorganisatie ten behoeve van fytosanitaire doelen zijn subsidiabel indien het gaat om
      investeringen zoals:

      a. plastic pallets ten behoeve van het tegengaan van de verspreiding van organismen die plantenziekten kunnen
      veroorzaken;

      b. traps;

      c. toegangspoorten;

      d. hygiënestations en -sluizen;

      e. insectengaas;

      f. wasmachines;

      g. reinigingsinstallaties, mits voor fytosanitaire doeleinden; en

      h. fustwasinstallaties, mits voor fytosanitaire doeleinden.

      2 Uitgaven zijn niet subsidiabel indien het gaat om investeringen, die niet primair gericht zijn op fytosanitaire
      doelen zoals:

      a. installaties en apparatuur voor conditionering van champignon- en witloftrekcellen;

      b. voorzieningen voor gekoeld of geconditioneerd transport op het teeltbedrijf;

      c. droogsystemen voor aanzuiging van buitenlucht voor knoflook;

      d. vogel- en wildafweer; en

      e. investeringen die de producentenorganisatie doet om te voldoen aan de voorwaarden van kwaliteitskeurmerken,
      tenzij bedoeld voor overgang van gangbaar naar biologische teelt.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.17
  - number: 5.3.18
    text: |-
      1 Uitgaven van producentenorganisaties voor investeringen in ICT systemen voor customer relationship management
      zijn subsidiabel.

      2 Onder de uitgaven vallen kosten voor de interface van de ICT systemen voor customer relationship management,
      inclusief de benodigde aanpassingen ten behoeve van de werking van de interface, met:

      a. een aanvoerregistratiesysteem;

      b. een verkoopsysteem;

      c. het verladingssysteem;

      d. een orderregistratiesysteem; of

      e. een facturatiesysteem.

      3 Uitgaven op locatie van de leden van de producentenorganisatie zijn slechts subsidiabel indien de
      producentenorganisatie kan aantonen dat zij integraal onderdeel uitmaken van het ICT systeem voor customer
      relationship management van de producentenorganisatie.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.18
  - number: 5.3.19
    text: |-
      1 Uitgaven van producentenorganisaties voor investeringen in ICT systemen voor markt en afzet zijn subsidiabel
      indien het systeem tot doel heeft:

      a. kwaliteitsverbetering van het proces van productieplanning;

      b. koppeling van vraag aan aanbod; of

      c. efficiencyverbetering.

      2 De producentenorganisatie overlegt jaarlijks bij de aanvraag tot subsidievaststelling aan de minister een
      overzicht van het aantal systemen, en het aantal aansluitingen van haar klanten op deze systemen.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.19
  - number: 5.3.20
    text: |-
      Investeringen van de producentenorganisatie voor het opzetten of ontwikkelen van ICT-systemen ten behoeve van
      innovatieve bezorgsystemen binnen de producentenorganisatie zijn subsidiabel indien het gaat om uitgaven voor:

      a. ontwikkeling en inzet van nieuwe informatiedragers, zoals stickers, QR codes, barcodes, chips, of andere nieuwe
      vormen; en

      b. verbetering van uitwisseling van data en digitale infrastructuur tussen diverse keten partijen.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.20
  - number: 5.3.21
    text: |-
      Subsidiabel zijn uitgaven voor investeringen ter preventie van voedselverspilling door uitval in de keten of
      de aantasting van de productkwaliteit verderop in de keten, zoals het ver-of bewerken van groenten en fruit ten
      behoeve van menselijke consumptie om verspilling te voorkomen
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.3.21
  - number: 5.3.22
    text: |-
      Indien dit noodzakelijk is voor het functioneren van de LED-belichtingsinstallatie, bedoeld in
      [artikel 5.3.11, eerste lid][ref1], zijn uitgaven van de producentenorganisatie voor de aansluiting van een extern
      trafostation van het energiebedrijf of de verzwaring van de netkoppeling op de warmte-krachtkoppelingsinstallatie,
      inclusief personeelskosten, subsidiabel.


