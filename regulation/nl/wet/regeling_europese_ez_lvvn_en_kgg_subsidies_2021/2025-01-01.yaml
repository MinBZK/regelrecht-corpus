        bwb_id: BWBR0045685
  - number: 4.3.1
    text: |-
      De Minister verstrekt op aanvraag subsidie aan degene die een project tot stand brengt dat past in een programma
      en dat bijdraagt aan de realisatie van nationale beleidsdoelen op het gebied van innovatie of de transitie naar een
      koolstofarme of circulaire economie.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel4.3.1
  - number: 4.3.2
    text: |-
      1 Het subsidieplafond voor subsidies als bedoeld in [artikel 4.3.1][ref1] is voor de gehele programmaperiode:

      a. voor programma EFRO 2021-2027 Noord-Nederland: € 19.475.579;

      b. voor programma EFRO 2021-2027 Oost-Nederland: € 22.946.144;

      c. voor programma EFRO 2021-2027 Zuid-Nederland: € 19.640.087;

      d. voor programma EFRO 2021-2027 West-Nederland: € 37.352.960.

      2 Het voor de cofinanciering beschikbare bedrag wordt in jaarlijkse tranches beschikbaar gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel4.3.1
