  - number: 5.8.3.7
    text: |-
      1 De Minister kent aan het uitvoeren van een project gericht op de reductie van CO-emissie uit percelen in
      veenweidegebieden een hoger aantal punten toe naarmate:

      a. de mate van effectiviteit hoger is;

      b. de haalbaarheid hoger is;

      c. de mate van efficiëntie hoger is;

      d. de mate van urgentie hoger is.

      2 Het aantal punten bedraagt per onderdeel van het eerste lid ten hoogste 5 en minimaal 1.

      3 De wegingsfactoren voor het eerste lid, onderdelen a, b, c en d bedragen respectievelijk 4, 1, 1 en 1.

      4 Indien aan twee of meer aanvragen een gelijk totaal aantal punten is toegekend, rangschikt de Minister een
      aanvraag hoger naarmate meer punten zijn toegekend voor een rangschikkingscriterium met een hogere wegingsfactor.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.8.3.7
  - number: 5.8.3.8
    text: |-
      1 De subsidieontvanger maakt de resultaten van het project openbaar via het EIP-netwerk, bedoeld in artikel 154 van
      [verordening 2021/2115](32115R2021), en andere geëigende netwerken.

      2 De subsidieontvanger:

      a. draagt er zorg voor dat de uitvoering van de maatregelen plaatsvindt op landbouwareaal of op grasland in een
      veenweidegebied;

      b. doet uiterlijk twee weken voor aanvang van de activiteit, bedoeld in [onderdeel 6 van bijlage 3][ref1], een
      opgave van deze activiteit op perceelsniveau in een door de Minister beschikbaar gesteld registratiesysteem.

      3 De subsidieontvanger verleent medewerking aan monitoring en evaluatie van de effecten van de uitgevoerde
      activiteiten voor zover deze medewerking redelijkerwijs van de subsidieontvanger verlangd kan worden.

      4 Vanaf twee maanden na aanleg van de grondwaterpeilbuizen meet de subsidieontvanger dagelijks digitaal de hoogte
      van de grondwaterstand in de grondwaterpeilbuizen.

      5 De subsidieontvanger verstrekt met ingang van twee maanden na de aanleg van de grondwaterpeilbuizen digitaal de
      digitale data die verkregen zijn uit deze metingen met gebruikmaking van een door de Minister beschikbaar gesteld
      middel.

      6 De verplichtingen, bedoeld in het derde, vierde en vijfde lid, gelden gedurende vijf jaar na de datum van de
      beschikking tot subsidievaststelling.


      [ref1]: https://wetten.overheid.nl/BWBR0045685
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.8.3.8
    references:
      - id: ref1
        bwb_id: BWBR0045685
  - number: 5.8.3.9
    text: |-
      1 Onverminderd [artikel 2.9][ref1] bevat de aanvraag voor subsidieverlening ten minste de volgende gegevens:

      a. een intekening door de aanvrager op de beschikbaar gestelde digitale omgevingskaart met daarin aangegeven de
      percelen waar het samenwerkingsverband de activiteiten wil uitvoeren;

      b. een beschrijving van de beoogde activiteiten die door het samenwerkingsverband uitgevoerd worden en een
      begroting van de kosten van die activiteiten volgens de omschrijving in [bijlage 3][ref2];

      c. een berekening van de huidige gemiddelde CO-emissie per hectare per jaar (referentie) op de percelen veengrond
      conform de rekenregels van SOMERS, zoals vermeld op de website van het Nationaal Onderzoeksprogramma Broeikasgassen
      Veenweiden en met gebruikmaking van de digitale kaart, bedoeld in onderdeel a;

      d. een berekening van de gemiddelde CO-emissie per hectare per jaar op de percelen veengrond na
      uitvoeren van het project, waarbij op de percelen veengrond met de beoogde activiteiten, bedoeld in de
      [onderdelen 5a en 6a van bijlage 3][ref3], de rekenregels van SOMERS worden toegepast en gebruik gemaakt wordt van
      de digitale kaart, bedoeld in onderdeel a;

      e. een toelichting op de haalbaarheid van het project met daarin verwerkt de uitkomsten van de afstemming ter zake
      met het desbetreffende waterschap;

      f. een beschrijving van de mogelijke omgevingseffecten;

      g. een verduidelijking van de keuze van het samenwerkingsverband welke percelen van welke bedrijven of welke gehele
      melkveehouderijbedrijven meedoen.

      2 Onverminderd [artikel 2.9, vijfde lid][ref4], bevat het projectplan tevens een inhoudelijke beschrijving van
      de uit te voeren activiteiten in het samenwerkingsverband en op het niveau van een deelnemend bedrijf of een
      grondeigenaar, overeenkomstig de omschrijving opgenomen in [punt 1 van bijlage 3][ref5].

      3 Onverminderd [artikel 2.18][ref6] dient de subsidieontvanger uiterlijk 1 april 2026 een tussenrapportage
      in bij de Minister. Deze tussenrapportage bevat een overzicht van de uitgevoerde activiteiten en de behaalde
      deelresultaten na het eerste beheerjaar in 2025.

      4 Onverminderd [artikel 2.19, vierde en vijfde lid][ref7], gaat de aanvraag tot subsidievaststelling vergezeld van:

      a. een factuur en een betaalbewijs van alle kosten bedoeld in [bijlage 3, onderdelen 1 tot en met 5][ref8];

      b. documenten met daarin de hoogte van het peil, uitgedrukt in centimeters ten opzichte van het Normaal
      Amsterdamse Peil, rondom de percelen die aan de beheermaatregel geringere drooglegging, bedoeld in
      [bijlage 3, onderdeel 6a][ref9], hebben meegedaan voor de maanden april tot en met september van dat
      jaar, inclusief een intekening op de beschikbaar gestelde digitale omgevingskaart van de percelen van het
      samenwerkingsverband met per perceel veengrond de CO-emissie per hectare vermeld;

      c. documenten met daarin informatie per melkveehouderijbedrijf over de jaarlijkse totale dierexcretie per bedrijf,
      voor zover de activiteit extensivering, bedoeld in [bijlage 3, onderdeel 6b][ref10], jaarlijks is uitgevoerd,
      inclusief een jaarlijkse intekening op de beschikbaar gestelde digitale omgevingskaart waaruit blijkt dat het
      gehele bedrijf voor meer dan 50% ligt binnen overgangsgebied N2000 of binnen veenweidegebied;

      d. documenten met daarin informatie over de wijze van plaatsing van de investering, voor zover het
      investeringsproject betrekking heeft op een investering in een of meer waterinfiltratiesystemen als bedoeld in
      [bijlage 3, onderdeel 5a][ref11]:

      1°. een intekening op de beschikbaar gestelde digitale omgevingskaart van de percelen veengrond waarop de
      investering of investeringen geplaatst zijn;

      2°. gegevens over de diepte van de ligging van de buizen van het desbetreffende waterinfiltratiesysteem in
      centimeters, ten opzichte van het Normaal Amsterdamse Peil;

      3°. gegevens over de afstand tussen de buizen van het desbetreffende waterinfiltratiesysteem in meters; en

      4°. bij de aanleg van drukdrainage wordt uitgegaan van het medium scenario in het rekenmodel SOMERS;

      e. de GPS-coördinaten van de aangelegde digitale grondwaterpeilbuizen;

      f. een verklaring van de aanvrager waaruit volgt dat gedurende vijf jaar na de datum van de subsidievaststelling
      voldaan zal worden aan de verplichtingen, bedoeld in [artikel 5.8.3.8, vierde en vijfde lid][ref12], voor
      zover het investeringsproject betrekking heeft op een investering in grondwaterpeilbuizen als bedoeld in
      [bijlage 3, onderdeel 5b][ref13].


