  - number: 5.3.8a
    text: |-
      1 Geen subsidie wordt verstrekt voor investeringen in een duurzaam productiemiddel
      of overige kosten waartoe de producentenorganisatie, een dochteronderneming of lid
      verplicht is volgens [artikel 5.15 van het Besluit activiteiten leefomgeving][ref1] of
      [artikel 3.84 van het Besluit bouwwerken leefomgeving][ref2].

      2 De producentenorganisatie overlegt de gegevens en bescheiden, die in het kader van [artikel 5.15a][ref3]
      of [5.15b van het Besluit activiteiten leefomgeving][ref4] en indien van toepassing ook
      [artikel 3.84a, eerste lid, van het Besluit bouwwerken leefomgeving][ref5], aan het bevoegd gezag zijn verstrekt,
      onverwijld aan de minister, indien de minister daar om verzoekt.

      3 De producentenorganisatie is verplicht na de verstrekking van de subsidie een wijziging van de gegevens en
      bescheiden, bedoeld in het tweede lid, onverwijld aan de minister te melden.

      4 Dit artikel is van toepassing op investeringen in een duurzaam productiemiddel of overige kosten waarvan de datum
      van verwerking van het activum of de datum waarop het activum ter beschikking van de begunstigde wordt gesteld
      later is dan 31 december 2024.


