    text: De Minister verdeelt het subsidieplafond op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.8.3.4
  - number: 5.8.3.5
    text: |-
      1 Met de uitvoering van het project wordt uiterlijk binnen twee maanden na de subsidieverlening gestart.

      2 Het project is uiterlijk op 31 december 2028 afgerond.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.8.3.5
  - number: 5.8.3.6
    text: |-
      Onverminderd [artikel 2.11][ref1] beslist de Minister afwijzend op een aanvraag voor subsidieverlening indien:

      a. de beoogde percelen voor meer dan 50% van het areaal buiten een veenweidegebied liggen;

      b. de gemiddelde CO-emissie per hectare per jaar op de percelen veengrond na uitvoeren van het project, bedoeld in
      [artikel 5.8.3.9, eerste lid, onderdeel d][ref2], is berekend op meer dan gemiddeld 10,0 ton CO emissie per hectare
      per jaar;

      c. de te realiseren emissiereductie bij vergelijking van de berekening, bedoeld in
      [artikel 5.8.3.9, eerste lid, onderdeel c][ref3], met de berekening, bedoeld in onderdeel d van dat artikel:

      1. minder dan 5% bedraagt in geval de huidige gemiddelde CO-emissie per hectare per jaar, bedoeld in
      [artikel 5.8.3.9, eerste lid, onderdeel c][ref4], minder is dan 10,0 ton CO emissie per hectare per jaar;

      2. minder dan 10% bedraagt in overige gevallen;

      d. de gezamenlijke percelen van het samenwerkingsverband een kleinere oppervlakte betreffen dan 200 hectare;

      e. in geval van een projectplan van een samenwerkingsverband waaraan een melkveehouderijbedrijf in
      een veenweidegebied deelneemt om ammoniakemissie te reduceren, niet al het landbouwareaal van het
      melkveehouderijbedrijf meedoet aan het samenwerkingsverband;

      f. een deelnemer aan het samenwerkingsverband, niet zijnde een landbouwer, een onderneming is die geen kleine,
      middelgrote of micro-onderneming is als bedoeld in artikel 1, onderdeel a, van de landbouwvrijstellingsverordening;

      g. er geen sprake is van een nieuwe samenwerkingsvorm of het verrichten van nieuwe activiteiten door een bestaande
      samenwerkingsvorm;

      h. aan een aanvraag minder dan 21 punten zijn behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel2.11
      [ref2]: https://wetten.overheid.nl/BWBR0045685#Artikel5.8.3.9
