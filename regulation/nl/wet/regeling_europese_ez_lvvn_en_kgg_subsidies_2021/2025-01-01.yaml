  - number: 5.7.10
    text: |-
      1 Een adviesvoucher wordt door de minister op aanvraag verstrekt aan een landbouwer voor het verkrijgen van een
      bedrijfsspecifiek bedrijfsadvies over één van de volgende aandachtsgebieden:

      a. kringlooplandbouw:

      1°. (stikstof)emissie en hergebruik nutriënten;

      2°. gezonde bodem, water en teeltsystemen;

      3°. weerbare teeltsystemen en geïntegreerde gewasbescherming;

      4°. circulair gebruik van gewassen, grondstoffen en nieuwe plantaardige eiwitbronnen;

      5°. natuurinclusieve landbouw;

      6°. precisielandbouw;

      b. duurzaam ondernemerschap:

      1°. persoonlijke ontwikkeling van ondernemers en hun bedrijf;

      2°. horizontale samenwerking;

      3°. bedrijfsopvolging;

      4°. duurzaam verdienvermogen.

      2 De landbouwer vermeldt bij de aanvraag:

      a. de bedrijfsspecifieke adviesvraag die hij in het kader van het bedrijfsadvies wil stellen;

      b. op welk aandachtsgebied, genoemd in het eerste lid, het bedrijfsadvies gericht zal zijn;

      c. een erkende bedrijfsadviseur, die in het bedrijfsadviseringssysteem is geregistreerd, naar keuze, voor dat
      specifieke aandachtsgebied.

      3 Aan de in het tweede lid, onderdeel c, genoemde erkende bedrijfsadviseur wordt de verstrekte voucher
      overgedragen.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.7.10
  - number: 5.7.11
    text: |-
      1 Een cursusvoucher wordt door de minister op aanvraag verstrekt aan een landbouwer voor het volgen van de
      Verdiepingscursus ‘stikstof in de landbouw’, de Verdiepingscursus Natuurinclusief ondernemen in de landbouw of de
      Verdiepingscursus precisielandbouw.

      2 De landbouwer vermeldt bij de aanvraag een aangewezen kennisinstelling naar keuze die deze erkende cursus geeft.

      3 Aan de in het tweede lid genoemde kennisinstelling wordt de verstrekte voucher overgedragen.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.7.11
  - number: 5.7.12
    text: |-
      De minister bepaalt op volgorde van binnenkomst aan welke landbouwers, binnen het subsidieplafond voor
      adviesvouchers of binnen het subsidieplafond voor cursusvouchers, vouchers worden verstrekt, uitgaande van de
      (maximum)waarde per voucher.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.7.12
  - number: 5.7.13
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. aan de aanvrager van een adviesvoucher al eerder een adviesvoucher is toegekend in hetzelfde kalenderjaar op
      basis van deze titel of op basis van [titel 2.4 van de Regeling nationale EZK- en LNV-subsidies][ref1];

      b. ten behoeve van een agrarische onderneming al eerder in het hetzelfde kalenderjaar van een adviesvoucher gebruik
      is gemaakt;

      c. aan de aanvrager van een cursusvoucher al eerder een cursusvoucher is toegekend in hetzelfde kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.7.13
    references:
      - id: ref1
        bwb_id: BWBR0035474
  - number: 5.7.14
    text: |-
      Subsidie wordt verstrekt aan een erkende bedrijfsadviseur die een advies heeft verstrekt of een aangewezen
      kennisinstelling die een cursus heeft uitgevoerd ten behoeve van een landbouwer en in verband daarmee een geldige
      voucher overlegt.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.7.14
  - number: 5.7.15
    text: |-
      1 De subsidie bedraagt ten hoogste 80% van de subsidiabele kosten en niet meer dan € 1.500,– per adviesvoucher.

      2 De subsidie bedraagt ten hoogste 100% van de subsidiabele kosten en niet meer dan € 800,– per cursusvoucher.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.7.15
  - number: 5.7.16
    text: |-
      1 Voor subsidie voor het geven van advies komen in aanmerking kosten van advies als bedoeld in artikel 78, tweede
      lid, van [verordening 2021/2115](32115R2021).

      2 Voor subsidie voor het geven van advies komen niet in aanmerking kosten die de erkende bedrijfsadviseur maakt
      voor de inhuur van personen die organisatorisch of financieel niet onafhankelijk zijn van de landbouwer waaraan het
      advies is verstrekt.

      3 Voor subsidie voor de uitvoering van de cursus komen in aanmerking kosten van de beroepsopleiding, waaronder
      cursussen ten behoeve van scholing als bedoeld in artikel 78, tweede lid, van [verordening 2021/2115](32115R2021).
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.7.16
  - number: 5.7.17
    text: |-
      1 Een aanvraag voor subsidie wordt na afloop van de uitvoering van het advies of de cursus door de kennisinstelling
      of de erkende bedrijfsadviseur ingediend.

      2 De aanvraag moet binnen een jaar zijn ontvangen na de dagtekening van een aan de landbouwer verstrekte voucher.

      3 Op een voor het einde van de termijn, bedoeld in het tweede lid, daartoe ingediend verzoek kan de minister
      besluiten deze termijn eenmalig te verlengen met ten hoogste zes maanden.

      4 Indien de aanvraag niet door de minister is ontvangen binnen de termijn, bedoeld in het tweede lid, vervalt de
      voucher van rechtswege.
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.7.17
  - number: 5.7.18
    text: |-
      Onverminderd [artikel 2.11][ref1] beslist de minister afwijzend op een aanvraag voor subsidie voor het geven van
      advies indien:

      a. de adviseur niet overeenkomstig [artikel 38, tweede lid, van de Uitvoeringsregeling GLB 2023][ref2] is erkend in
      het kader van het bedrijfsadviseringssysteem;

      b. advisering in een groepsverband heeft plaatsgevonden;

      c. de advisering niet hoofdzakelijk was gericht op het in de aanvraag vermelde onderwerp;

      d. de erkende bedrijfsadviseur financieel niet onafhankelijk is van de aanvrager waardoor het te verstrekken advies
      niet onpartijdig is in de zin van artikel 15, derde lid, van [verordening 2021/2115](32115R2021);

      e. de erkende bedrijfsadviseur niet toereikend gekwalificeerd of voldoende opgeleid is of sprake is van
      belangenconflicten als bedoeld in artikel 15, derde lid, van [verordening 2021/2115](32115R2021);

      f. de erkende bedrijfsadviseur niet deskundig is op het onderwerp, bedoeld in [artikel 5.7.10, eerste lid][ref3],
      waarop de advisering is gericht; of

      g. het advies niet in gaat op tenminste de volgende elementen:

      1°. de adviesbehoefte van de landbouwer met betrekking tot het gekozen aandachtsgebied;

      2°. de specifieke bedrijfssituatie van de landbouwer;

      3°. de probleemanalyse;

      4°. de beoogde impact van het advies.


      [ref1]: https://wetten.overheid.nl/BWBR0045685#Artikel2.11
      [ref2]: https://wetten.overheid.nl/BWBR0047444#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0045685#Artikel5.7.10
    url: https://wetten.overheid.nl/BWBR0045685/2025-01-01#Artikel5.7.18
