      1 Uitgaven van de producentenorganisatie, inclusief personeelskosten, voor licenties voor het exclusieve recht op
      het gebruik van zaden en plantgoed zijn subsidiabel.

      2 Uitgaven voor een volledige overname van een licentie en de kosten van aankoop van het zaad en het plantgoed zijn
      niet subsidiabel.

      3 De producentenorganisatie evalueert voor het einde van de looptijd van het operationeel programma hoe de
      producentenorganisatie zich in de markt met het betreffende ras heeft onderscheiden.
