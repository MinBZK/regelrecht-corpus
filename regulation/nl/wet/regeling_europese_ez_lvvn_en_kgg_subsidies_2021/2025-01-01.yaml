      1 Uitgaven van de producentenorganisatie ten behoeve van het exclusieve gebruik van rassen of variëteiten zijn
      subsidiabel indien gaat om de aanschaf van:

      a. bomen of meerjarig plantmateriaal; of

      b. kruisbestuivers die nodig zijn voor de aanplant van nieuw in het operationeel programma op te nemen bomen en
      meerjarige planten.

      2 Uitgaven voor de aankoop van meerjarig plantmateriaal en bomen zijn evenwel slechts subsidiabel indien:

      a. er gedurende meerdere jaren van de bomen en planten geoogst wordt; en

      b. het gaat om de uitgaven voor de initiële aanplant.

      3 De producentenorganisatie evalueert voor het einde van de looptijd van het operationeel programma hoe de
      producentenorganisatie zich in de markt met het betreffende ras heeft onderscheiden.
