articles:
  - number: '1'
    text: |-
      Het monitoringsprogramma bedoeld in
      [artikel 13, eerste lid, van het Besluit kwaliteitseisen en monitoring water 2009][ref1], bestaat voor de
      stroomgebieddistricten, genoemd in [artikel 1.2, eerste lid, van de Waterwet][ref2], uit de volgende documenten:

      a. ‘Draaiboek monitoring grondwater KRW’, oktober 2013, vastgesteld in het Cluster monitoring van het ministerie
      van Infrastructuur en Milieu, rapportage en evaluatie op 5 december 2013;

      b. ‘Protocol voor toestand- en trendbeoordeling van grondwaterlichamen KRW’, 2019, vastgesteld in het Cluster
      monitoring, rapportage en evaluatie van het Ministerie van Infrastructuur en Waterstaat op 10 oktober 2019;

      c. ‘Referenties en maatlatten voor natuurlijke watertypen voor de Kaderrichtlijn Water 2021-2027’, STOWA rapport
      2018-49;

      d. ‘Omschrijving MEP en maatlatten voor sloten en kanalen voor de Kaderrichtlijn Water 2021-2027’, STOWA rapport
      2018-50;

      e. ‘Handreiking KRW-doelen’, STOWA rapport 2018-15, vastgesteld in de Stuurgroep Water van het Ministerie van
      Infrastructuur en Waterstaat op 4 april 2018;

      f. ‘Protocol monitoring en toestandsbeoordeling oppervlaktewaterlichamen KRW’, vastgesteld in het Cluster
      monitoring, rapportage en evaluatie van het Ministerie van Infrastructuur en Waterstaat op 23 april 2020;

      g. ‘Databestand ‘4.monitoringprogramma_owl’ op [www.waterkwaliteitsportaal.nl](onbekend);

      h. de [bijlage bij de Regeling monitoring kaderrichtlijn water](onbekend);

      i. 'Protocol voor monitoring en toetsing drinkwaterbronnen KRW', vastgesteld in het Programmateam Water van het
      ministerie van Infrastructuur en Milieu op 17 september 2015;

      j. 'Protocol voor monitoring en toetsing schelpdierwateren', vastgesteld in het Programmateam Water van het
      ministerie van Infrastructuur en Milieu op 17 september 2015.


