$id: regeling_grenswaarden_voor_chloroform_in_afvalwater
regulatory_layer: WET
publication_date: '2020-12-03'
valid_from: '2009-12-22'
bwb_id: BWBR0005480
url: https://wetten.overheid.nl/BWBR0005480/2009-12-22
preamble:
  text: |-
    Overwegende, dat het noodzakelijk is grenswaarden vast te stellen voor chloroform voorkomend in afvalwater dat
    in oppervlaktewateren wordt gebracht ter uitvoering van de richtlijn van de Raad van de Europese Gemeenschappen
    van 16 juni 1988, tot wijziging van bijlage II van Richtlijn 86/280/EEG betreffende grenswaarden en
    kwaliteitsdoelstellingen voor lozingen van bepaalde onder lijst I van de bijlage van Richtlijn 76/464/EEG vallende
    gevaarlijke stoffen, 88/347/EEG (PbEG L 158);

    Gelet op artikel 1a, derde lid, van de Wet verontreiniging oppervlaktewateren (Stb. 1981, 573);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0005480/2009-12-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a
            chloroform:

              de chemische verbinding CHCl (Cas nr. 67-66-3);



            b
            verwerken van chloroform:

              elk industrieel proces waarbij chloroform of chloroform bevattende stoffen worden geproduceerd, omgezet of
      gebruikt, of waarbij chloroform of chloroform bevattende stoffen vrijkomen;



            c
            lozen:

              brengen van:
              stoffen in een oppervlaktewaterlichaam;
      afvalwater of andere afvalstoffen in een openbaar hemelwaterstelsel, een openbaar ontwateringstelsel, een openbaar
      vuilwaterriool of een andere voorziening voor de inzameling en het transport van afvalwater, of
      stoffen op een zuiveringtechnisch werk met behulp van een werk niet zijnde een voorziening voor de inzameling en
      het transport van afvalwater;



            d
            bestaand bedrijf:

              bedrijf dat chloroform verwerkt, dat op 24 juni 1989 in werking is en waarvan de capaciteit voor het
      verwerken van chloroform na 24 juni 1989 niet aanzienlijk is uitgebreid;



            e
            nieuw bedrijf:

              bedrijf dat chloroform verwerkt en geen bestaand bedrijf is;



            f
            bijlage I:

              bij deze regeling behorende [bijlage I][ref1];



            g
            bijlage II:

              bij deze regeling behorende [bijlage II][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005480
      [ref2]: https://wetten.overheid.nl/BWBR0005480
    url: https://wetten.overheid.nl/BWBR0005480/2009-12-22#Artikel1
    references:
      - id: ref1
