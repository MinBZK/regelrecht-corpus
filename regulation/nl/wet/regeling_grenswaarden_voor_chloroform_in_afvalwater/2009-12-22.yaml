        bwb_id: BWBR0005480
  - number: 1a
    text: |-
      Deze regeling berust op [artikel 6.3 van het Waterbesluit][ref1] en [artikel 8.40, eerste lid][ref2], in samenhang
      met [artikel 21.6, zesde lid, van de Wet milieubeheer][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0026872#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel21
    url: https://wetten.overheid.nl/BWBR0005480/2009-12-22#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0026872
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '21'
  - number: '2'
    text: |-
      Voor een nieuw bedrijf gelden, als de hoogst toelaatbare gewichtshoeveelheid en concentratie chloroform voorkomend
      in afvalwater dat wordt geloosd, de grenswaarden die overeenkomen met de waarden die het resultaat zijn van
      toepassing van de beste bestaande technieken, met dien verstande dat voor een nieuw bedrijf behorende tot een van
      de in bijlage I genoemde bedrijfstakken, die gewichtshoeveelheid en concentratie in ieder geval niet hoger is dan
      de in die bijlage opgenomen grenswaarde die op de betrokken bedrijfstak van toepassing is.
    url: https://wetten.overheid.nl/BWBR0005480/2009-12-22#Artikel2
  - number: '3'
    text: |-
      Voor een bestaand bedrijf gelden als de hoogst toelaatbare gewichtshoeveelheid en concentratie chloroform
      voorkomend in afvalwater dat wordt geloosd:
    url: https://wetten.overheid.nl/BWBR0005480/2009-12-22#Artikel3
  - number: 3.a
    text: |-
      indien dat bedrijf behoort tot een van de in bijlage I genoemde bedrijfstakken: de in die bijlage voor die
      bedrijfstak opgenomen grenswaarde;
    url: https://wetten.overheid.nl/BWBR0005480/2009-12-22#Artikel3
  - number: 3.b
    text: |-
      indien dat bedrijf niet behoort tot een in bijlage I genoemde bedrijfstak: de grenswaarden die op 31 december 1989
      overeenkomen met de waarden die het resultaat zijn van de toepassing van de beste bestaande technieken.
    url: https://wetten.overheid.nl/BWBR0005480/2009-12-22#Artikel3
  - number: '4'
    text: |-
      De wijze van meting van de gewichtshoeveelheid en concentratie chloroform, bedoeld in de artikelen 2 en 3, dient
      ten minste te voldoen aan de in bijlage II daaraan gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0005480/2009-12-22#Artikel4
  - number: '5'
    text: |-
      De Regeling van de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 12 december 1988,
      houdende regelen met betrekking tot grenswaarden voor chloroform (Stb. 589) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005480/2009-12-22#Artikel5
  - number: '6'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de datum van uitgifte van het Staatsblad waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0005480/2009-12-22#Artikel6
  - number: '7'
    text: 'Deze regeling kan worden aangehaald als: Regeling grenswaarden voor chloroform in afvalwater.'
    url: https://wetten.overheid.nl/BWBR0005480/2009-12-22#Artikel7
