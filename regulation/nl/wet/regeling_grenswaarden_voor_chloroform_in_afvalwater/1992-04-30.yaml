$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.3/schema.json
$id: regeling_grenswaarden_voor_chloroform_in_afvalwater
regulatory_layer: WET
publication_date: '2020-12-03'
valid_from: '1992-04-30'
bwb_id: BWBR0005480
url: https://wetten.overheid.nl/BWBR0005480/1992-04-30
preamble:
  text: |-
    Overwegende, dat het noodzakelijk is grenswaarden vast te stellen voor chloroform voorkomend in afvalwater dat
    in oppervlaktewateren wordt gebracht ter uitvoering van de richtlijn van de Raad van de Europese Gemeenschappen
    van 16 juni 1988, tot wijziging van bijlage II van Richtlijn 86/280/EEG betreffende grenswaarden en
    kwaliteitsdoelstellingen voor lozingen van bepaalde onder lijst I van de bijlage van Richtlijn 76/464/EEG vallende
    gevaarlijke stoffen, 88/347/EEG (PbEG L 158);

    Gelet op artikel 1a, derde lid, van de Wet verontreiniging oppervlaktewateren (Stb. 1981, 573);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0005480/1992-04-30#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            chloroform:

              de chemische verbinding CHCl (Cas nr. 67-66-3);



            b
            verwerken van chloroform:

              elk industrieel proces waarbij chloroform of chloroform bevattende stoffen worden geproduceerd, omgezet of
      gebruikt, of waarbij chloroform of chloroform bevattende stoffen vrijkomen;



            g
            bestaand bedrijf:

              bedrijf dat chloroform verwerkt, dat op 24 juni 1989 in werking is en waarvan de capaciteit voor het
      verwerken van chloroform na 24 juni 1989 niet aanzienlijk is uitgebreid;



            h
            nieuw bedrijf:

              bedrijf dat chloroform verwerkt en geen bestaand bedrijf is;



            i
            bijlage I:

              bij deze regeling behorende bijlage I;



            j
            bijlage II:

              bij deze regeling behorende bijlage II.
    url: https://wetten.overheid.nl/BWBR0005480/1992-04-30#Artikel1
  - number: '2'
    text: |-
      Voor een nieuw bedrijf gelden, als de hoogst toelaatbare gewichtshoeveelheid en concentratie chloroform voorkomend
      in afvalwater dat in oppervlaktewateren wordt gebracht, de grenswaarden die overeenkomen met de waarden die het
      resultaat zijn van toepassing van de beste bestaande technieken, met dien verstande dat voor een nieuw bedrijf
      behorende tot een van de in bijlage I genoemde bedrijfstakken, die gewichtshoeveelheid en concentratie in ieder
      geval niet hoger is dan de in die bijlage opgenomen grenswaarde die op de betrokken bedrijfstak van toepassing is.
    url: https://wetten.overheid.nl/BWBR0005480/1992-04-30#Artikel2
  - number: '3'
    text: |-
      Voor een bestaand bedrijf gelden als de hoogst toelaatbare gewichtshoeveelheid en concentratie chloroform
      voorkomend in afvalwater dat in oppervlaktewateren wordt gebracht:

      a. indien dat bedrijf behoort tot een van de in bijlage I genoemde bedrijfstakken: de in die bijlage voor die
      bedrijfstak opgenomen grenswaarde;

      b. indien dat bedrijf niet behoort tot een in bijlage I genoemde bedrijfstak: de grenswaarden die op 31 december
      1989 overeenkomen met de waarden die het resultaat zijn van de toepassing van de beste bestaande technieken.
    url: https://wetten.overheid.nl/BWBR0005480/1992-04-30#Artikel3
  - number: '4'
    text: |-
      De wijze van meting van de gewichtshoeveelheid en concentratie chloroform, bedoeld in de artikelen 2 en 3, dient
      ten minste te voldoen aan de in bijlage II daaraan gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0005480/1992-04-30#Artikel4
  - number: '5'
    text: |-
      De Regeling van de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 12 december 1988,
      houdende regelen met betrekking tot grenswaarden voor chloroform (Stb. 589) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005480/1992-04-30#Artikel5
  - number: '6'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de datum van uitgifte van het Staatsblad waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0005480/1992-04-30#Artikel6
  - number: '7'
    text: 'Deze regeling kan worden aangehaald als: Regeling grenswaarden voor chloroform in afvalwater.'
    url: https://wetten.overheid.nl/BWBR0005480/1992-04-30#Artikel7
