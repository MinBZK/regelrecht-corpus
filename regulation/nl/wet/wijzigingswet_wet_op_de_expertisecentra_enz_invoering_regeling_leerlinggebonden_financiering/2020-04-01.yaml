  - number: VII
    text: |-
      1 Voor de op 31 juli 2002 bestaande scholen of afdelingen voor meervoudig gehandicapte kinderen waaraan
      onderwijs en begeleiding wordt gegeven aan kinderen met een andere combinatie van handicaps dan die op basis
      van [artikel 2, vijfde lid, van de Wet op de expertisecentra][ref1], zijn vastgesteld, stelt Onze minister van
      Onderwijs, Cultuur en Wetenschappen expertisebekostiging vast.

      2 Bij beschikking wordt door Onze minister van Onderwijs, Cultuur en Wetenschappen, uitgaande van de bekostiging
      voor het schooljaar 2001–2002 ten behoeve van de leerlingen, bedoeld in het eerste lid, de expertisebekostiging
      vastgesteld.

      3 Het bevoegd gezag van de school of afdeling waarvoor expertisebekostiging beschikbaar is, stelt vast aan welke
      criteria de leerlingen moeten voldoen die op basis van de expertisebekostiging onderwijs en begeleiding kunnen
      ontvangen.

      4 De school rapporteert jaarlijks over de besteding van de expertisebekostiging aan Onze minister van Onderwijs,
      Cultuur en Wetenschap.

      5 Voor de vaststelling van de bedragen ingevolge het Gemeentefonds blijft voor het aantal meervoudig gehandicapte
      leerlingen dat op 31 juli 2002 was ingeschreven bij een van de in het eerste lid bedoelde scholen en afdelingen
      de leerlingenmaatstaf die voor die leerlingen op die datum gold, gehandhaafd. De in de eerste volzin bedoelde
      leerlingen worden in het kader van de leerlingenmaatstaf slechts in één categorie meegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
