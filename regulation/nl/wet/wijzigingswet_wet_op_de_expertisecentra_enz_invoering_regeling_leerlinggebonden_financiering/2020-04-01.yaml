  - number: XIV
    text: |-
      Het op 1 augustus 1997 gestarte experiment met betrekking tot het onderwijs aan gehandicapte leerlingen in de
      gemeente Almere wordt met behoud van de doelstellingen, de organisatorische uitwerking daarvan en minimaal de
      daarbij behorende bekostiging aangepast aan deze wet.
    url: https://wetten.overheid.nl/BWBR0014350/2020-04-01#ArtikelXIV
  - number: XVI
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen, onderdelen daarvan of leden van artikelen, bedoeld in onderdelen, verschillend kan worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0014350/2020-04-01#ArtikelXVI
