preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is voor leerlingen met een handicap een leerlinggebonden
    financiering in te voeren en regionale expertisecentra te vormen en dat het in verband daarmee gewenst is een
    aantal wijzigingen aan te brengen in de Wet op de expertisecentra, de Wet op het primair onderwijs en de Wet op het
    voortgezet onderwijs;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0014350/2020-04-01#ArtikelAanhef
