  - number: VIII
    text: |-
      1 Onze minister kan besluiten dat een afdeling voor zeer moeilijk lerende kinderen die op de dag voorafgaand aan
      de inwerkingtreding van deze wet, is verbonden aan een speciale school voor basisonderwijs al dan niet tezamen met
      een of meer andere van zulke afdelingen, met ingang van de datum van inwerkingtreding van deze wet wordt omgezet
      in een school voor zeer moeilijk lerende kinderen indien op 1 oktober 1999 het aantal leerlingen van de afdeling of
      afdelingen tezamen 60 of meer bedroeg.

      2 Onze minister kan besluiten een afdeling voor zeer moeilijk lerende kinderen die is verbonden aan een speciale
      school voor basisonderwijs en die op 1 oktober 1999 minder dan 60 maar ten minste 25 leerlingen had, om te
      zetten in een school voor zeer moeilijk lerende kinderen, indien de afdeling in het gebied van het regionaal
      expertisecentrum de enige voorziening voor onderwijs aan zeer moeilijk lerende kinderen is van de richting.

      3 Onze minister kan besluiten dat een afdeling voor zeer moeilijk lerende kinderen die op de dag voorafgaand
      aan de inwerkingtreding van deze wet, is verbonden aan een speciale school voor basisonderwijs en die op 1
      oktober 1999 minder dan 25 leerlingen had, wordt omgezet in een nevenvestiging van een school voor zeer moeilijk
      lerende kinderen in het gebied van het regionaal expertisecentrum. Voor de nevenvestiging, bedoeld in de eerste
      volzin, wordt een garantiebekostiging vastgesteld. [Artikel 58 van de Wet op de expertisecentra][ref1] is van
      overeenkomstige toepassing.

      4 Binnen twee maanden na inwerkingtreding van deze wet kunnen de afdelingen Onze minister verzoeken om een
      omzetting als bedoeld in het eerste, tweede of derde lid. Zij melden daartoe het aantal leerlingen van de afdeling
      op 1 oktober 1999 en de naam en het adres van het bevoegd gezag van de afdeling en van het nieuwe bevoegd gezag.
      Onze minister besluit binnen 4 weken na de indiening van het verzoek of een afdeling of afdelingen wordt of worden
      omgezet in een school of een nevenvestiging.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel58
