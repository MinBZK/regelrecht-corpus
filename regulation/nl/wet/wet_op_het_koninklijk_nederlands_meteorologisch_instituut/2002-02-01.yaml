---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_het_koninklijk_nederlands_meteorologisch_instituut
regulatory_layer: WET
publication_date: '2008-12-23'
valid_from: '2002-02-01'
bwb_id: BWBR0012952
url: https://wetten.overheid.nl/BWBR0012952/2002-02-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is bij wet de taken van het Koninklijk Nederlands
    Meteorologisch Instituut te regelen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel1
  - number: 1.b
    text: 'KNMI: Koninklijk Nederlands Meteorologisch Instituut;'
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel1
  - number: 1.c
    text: 'hoofddirecteur: hoofddirecteur van het KNMI;'
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel1
  - number: 1.d
    text: |-
      algemeen weerbericht: algemeen weerbericht als bedoeld in [artikel 5, tweede en vijfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012952#Artikel5
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012952
        artikel: '5'
        hoofdstuk: '3'
  - number: 1.e
    text: |-
      luchtvaartmeteorologische inlichtingen: inlichtingen ten behoeve van het luchtverkeer, bedoeld in
      [artikel 1.1, eerste lid, onder l, van de Wet luchtvaart][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel1
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '1'
  - number: 1.f
    text: |-
      KNMI-gegevens: door het KNMI uit eigen waarneming of in internationaal verband verkregen gegevens met betrekking
      tot meteorologische en andere geofysische feiten en omstandigheden, uitgezonderd de luchtvaartmeteorologische
      inlichtingen en het algemeen weerbericht;
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel1
  - number: 1.g
    text: 'onderzoek: wetenschappelijk onderzoek op het terrein van de meteorologie en andere geofysische terreinen.'
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel1
  - number: '2.1'
    text: Er is een KNMI, dat ressorteert onder Onze Minister.
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel2
  - number: '2.2'
    text: De leiding van het KNMI berust bij de hoofddirecteur. Onze Minister benoemt, schorst en ontslaat de hoofddirecteur.
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel2
  - number: '3.1'
    text: 'Het KNMI heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel3
  - number: 3.1.a
    text: het beschikbaar maken, houden en stellen van een algemeen weerbericht voor de Nederlandse samenleving;
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel3
  - number: 3.1.b
    text: het beschikbaar maken, houden en stellen van KNMI-gegevens;
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel3
  - number: 3.1.c
    text: het beschikbaar maken, houden en stellen van luchtvaartmeteorologische inlichtingen;
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel3
  - number: 3.1.d
    text: het verrichten van onderzoek;
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel3
  - number: 3.1.e
    text: het adviseren van Onze Minister op het terrein van de meteorologie en andere geofysische terreinen;
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel3
  - number: 3.1.f
    text: deel te nemen in internationale organisaties op het terrein van de meteorologie en andere geofysische terreinen;
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel3
  - number: 3.1.g
    text: het onderhouden van de nationale infrastructuur voor de meteorologie en andere geofysische terreinen.
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel3
  - number: '3.2'
    text: |-
      Bij regeling van Onze Minister kunnen op het terrein van de meteorologie en andere geofysische terreinen nadere
      regels worden gesteld inzake de inhoud en reikwijdte van de in het eerste lid genoemde taken.
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel3
  - number: '4'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld inzake het vaststellen van een onderzoeksprogramma, een
      onderzoeksplan, een jaarplan en een jaarverslag.
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel4
  - number: '5.1'
    text: |-
      De hoofddirecteur stelt het algemeen weerbericht om niet beschikbaar aan natuurlijke en rechtspersonen die in
      Nederland beroepsmatig of bedrijfsmatig weersinformatie via openbare media en communicatiekanalen verspreiden.
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel5
  - number: '5.2'
    text: |-
      Tot het algemeen weerbericht behoren, voor zover betrekking hebbend op of gevolgen hebbend voor Nederland of de
      Noordzee:
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel5
  - number: 5.2.a
    text: actuele meteorologische waarnemingen;
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel5
  - number: 5.2.b
    text: een beschrijving van de weersgesteldheid, waarbij onder a bedoelde waarnemingen zijn geïnterpreteerd;
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel5
  - number: 5.2.c
    text: de weersverwachtingen voor vandaag;
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel5
  - number: 5.2.d
    text: weersverwachtingen voor de middellange termijn;
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel5
  - number: 5.2.e
    text: berichten inzake de zonkrachtverwachting;
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel5
  - number: 5.2.f
    text: weerberichten ten behoeve van de scheepvaart in de Nederlandse kustwateren, de Waddenzee en het IJsselmeer;
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel5
  - number: 5.2.g
    text: weerberichten voor de Noordzee;
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel5
  - number: 5.2.h
    text: waarschuwingen ten behoeve van de scheepvaart;
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel5
  - number: 5.2.i
    text: waarschuwingen ten behoeve van het wegverkeer;
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel5
  - number: 5.2.j
    text: waarschuwingen voor extreme weersomstandigheden;
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel5
  - number: 5.2.k
    text: berichten bij calamiteiten waarbij het weer een belangrijke rol speelt
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel5
  - number: '5.3'
    text: |-
      Voor zover zich relevante verschillen in het weer boven Nederland of de Noordzee voordoen, kan een regionale
      detaillering in de berichtgeving worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel5
  - number: '5.4'
    text: |-
      Waarschuwingen, berichten bij calamiteiten waarbij het weer een belangrijke rol speelt en verdere
      weersverwachtingen waarbij de veiligheid in het geding is, worden voorzover het KNMI over de relevante gegevens
      beschikt en deze redelijkerwijs heeft kunnen omzetten in een algemeen weerbericht, terstond beschikbaar gesteld.
      Overige onderdelen van het algemeen weerbericht worden, behoudens indien zich geen significante weersontwikkelingen
      voordoen, ten minste 3-uurlijks beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel5
  - number: '5.5'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld inzake de inhoud en de beschikbaarheid van het algemeen
      weerbericht. Hierbij wordt rekening gehouden met de actuele stand van wetenschap en techniek.
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel5
  - number: '6.1'
    text: |-
      Desgevraagd worden KNMI-gegevens beschikbaar gesteld. De beschikbaarstelling geschiedt voorzover het betreft
      een afnemer niet behorend tot de Staat, in de vorm van een overeenkomst waarin afspraken worden gemaakt over
      beschikbaarstelling en gebruik van die gegevens.
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel6
  - number: '6.2'
    text: 'Bij regeling van Onze Minister:'
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel6
  - number: 6.2.a
    text: |-
      worden de gevallen waarin een prijs verschuldigd is voor de beschikbaarstelling en het gebruik van KNMI-gegevens
      vastgesteld;
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel6
  - number: 6.2.b
    text: |-
      worden de grondslagen voor de berekening van de prijs vastgesteld waarbij ten aanzien van de beschikbaarstelling
      van KNMI-gegevens wordt uitgegaan van de integrale kosten van de beschikbaarstelling en ten aanzien van het gebruik
      van die gegevens van een prijs die strekt tot een bijdrage in de kosten van de productie van de KNMI-gegevens,
      tenzij uit internationale verplichtingen anders voortvloeit, en
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel6
  - number: 6.2.c
    text: |-
      kunnen andere regels inzake de inhoud van de overeenkomst en regels voor de voor het sluiten ervan benodigde
      informatie en bescheiden worden gesteld.
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel6
  - number: '6.3'
    text: |-
      De regels, bedoeld in het tweede lid, kunnen verschillen al naar gelang het soort gebruik van de KNMI-gegevens of
      de soort afnemer.
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel6
  - number: '7.1'
    text: |-
      Onze Minister stelt beleidsregels in een catalogus vast welke beschikbare KNMI-gegevens beschrijft met vermelding
      van de hoogte van de prijs voor de beschikbaarstelling en voor het gebruik alsmede de voorwaarden voor de
      beschikbaarstelling.
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel7
  - number: '7.2'
    text: De catalogus wordt ter inzage gelegd bij het KNMI. Hiervan doet Onze Minister mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel7
  - number: '8'
    text: |-
      De hoofddirecteur stelt de luchtvaartmeteorologische inlichtingen op een bij regeling van Onze Minister in
      overeenstemming met Onze Minister van Defensie te bepalen wijze beschikbaar. In die regeling worden tevens regels
      gesteld inzake de inhoud van deze inlichtingen, de luchtvaartterreinen waarop de beschikbaarstelling betrekking
      heeft, de perioden van beschikbaarstelling en de categorieën van gebruikers.
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel8
  - number: '9.1'
    text: |-
      De hoofddirecteur draagt zorg voor openbaarmaking van de resultaten van het onderzoek uiterlijk een jaar nadat de
      resultaten tot stand zijn gekomen.
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel9
  - number: '9.2'
    text: |-
      Indien bij de totstandkoming van het onderzoek vertrouwelijke gegevens zijn gebruikt, worden de
      onderzoeksresultaten gesplitst in een gedeelte dat niet direct herleidbaar is tot de vertrouwelijke gegevens en een
      gedeelte dat hiertoe wel herleidbaar is. In afwijking van het eerste lid, wordt alleen het gedeelte dat niet direct
      herleidbaar is tot de vertrouwelijke gegevens, openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel9
  - number: '9.3'
    text: |-
      De resultaten van het onderzoek voorzover niet direct herleidbaar tot de vertrouwelijke gegevens, worden openbaar
      gemaakt door deze:
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel9
  - number: 9.3.a
    text: op te nemen in een algemeen verkrijgbare uitgave;
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel9
  - number: 9.3.b
    text: op te nemen in een vanwege het KNMI algemeen verkrijgbaar gestelde periodiek, of
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel9
  - number: 9.3.c
    text: ter inzage te leggen bij het KNMI, in kopie te verstrekken of uit te lenen.
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel9
  - number: '10.1'
    text: |-
      Het KNMI kan, voorzover het past in het onderzoeksprogramma en het onderzoeksplan, bedoeld in [artikel 4][ref1],
      onderzoek in opdracht van derden verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0012952#Artikel4
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012952
        artikel: '4'
        hoofdstuk: '2'
  - number: '10.2'
    text: De kosten van het onderzoek worden integraal doorberekend aan de opdrachtgever.
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel10
  - number: '10.3'
    text: 'Voor onderzoeken als bedoeld in het eerste lid wordt een gescheiden boekhouding bijgehouden, waarin:'
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel10
  - number: 10.3.a
    text: de interne rekening voor die onderzoeken gescheiden is van die voor de overige activiteiten;
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel10
  - number: 10.3.b
    text: |-
      alle kosten en opbrengsten van die onderzoeken, op grond van consequent toegepaste en objectief te rechtvaardigen
      beginselen inzake kostprijsadministratie, worden toegerekend;
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel10
  - number: 10.3.c
    text: |-
      de beginselen inzake kostprijsadministratie volgens welke de gescheiden boekhouding wordt gevoerd, duidelijk zijn
      vastgelegd.
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel10
  - number: '10.4'
    text: |-
      Bij regeling van Onze Minister worden nadere regels gesteld inzake de aan het onderzoek verbonden kosten die worden
      doorberekend en inzake de administratie van de kosten die aan de doorberekening ten grondslag liggen.
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel10
  - number: '11.1'
    text: Er is een KNMI-raad.
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel11
  - number: '11.2'
    text: De raad heeft tot taak het wetenschappelijk niveau van het KNMI te bewaken en daarover te rapporteren.
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel11
  - number: '11.3'
    text: |-
      De raad bestaat uit minimaal vijf en maximaal negen door Onze Minister voor vier jaar op grond van bekwaamheid te
      benoemen leden, waaronder de voorzitter. Herbenoeming kan éénmaal en voor ten hoogste vier jaar plaatshebben.
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel11
  - number: '11.4'
    text: |-
      De leden van de raad worden op eigen aanvraag door Onze Minister ontslagen. Zij kunnen voorts door Onze Minister
      worden geschorst en ontslagen wegens ongeschiktheid, onbekwaamheid of op andere zwaarwegende gronden.
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel11
  - number: '11.5'
    text: |-
      Bij regeling van Onze Minister worden nadere regels gesteld met betrekking tot de rechtspositie van de leden van de
      KNMI-raad.
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel11
  - number: '12'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet, en vervolgens telkens na vijf jaar, aan
      de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk. Hiertoe behoort
      in ieder geval de mate van toegankelijkheid van het algemeen weerbericht.
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel12
  - number: '13'
    text: Het Reglement voor het Koninklijk Nederlands Meteorologisch Instituut wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel13
  - number: '15'
    text: |-
      Deze wet treedt in werking met ingang van de eerste dag van de derde kalendermaand na de datum van uitgifte van het
      Staatsblad waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel15
  - number: '16'
    text: 'Deze wet wordt aangehaald als: Wet op het Koninklijk Nederlands Meteorologisch Instituut.'
    url: https://wetten.overheid.nl/BWBR0012952/2002-02-01#Artikel16
