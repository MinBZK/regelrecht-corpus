  - number: '2'
    text: |-
      1 Er is een KNMI, dat ressorteert onder Onze Minister.

      2 De leiding van het KNMI berust bij de hoofddirecteur. Onze Minister benoemt, schorst en ontslaat de
      hoofddirecteur.
    url: https://wetten.overheid.nl/BWBR0012952/2015-07-18#Artikel2
  - number: '3'
    text: |-
      1 Het KNMI heeft tot taak:

      a. het beschikbaar maken, houden en stellen van een algemeen weerbericht voor de Nederlandse samenleving;

      b. het beschikbaar maken, houden en stellen van KNMI-gegevens;

      c. het beschikbaar maken, houden en stellen van luchtvaartmeteorologische inlichtingen;

      d. het verrichten van onderzoek;

      e. het adviseren van Onze Minister op het terrein van de meteorologie en andere geofysische terreinen;

      f. deel te nemen in internationale organisaties op het terrein van de meteorologie en andere geofysische terreinen;

      g. het onderhouden van de nationale infrastructuur voor de meteorologie en andere geofysische terreinen,

      h. het ten behoeve van de openbare lichamen Bonaire, Sint Eustatius en Saba op exclusieve basis beschikbaar maken,
      houden en stellen van luchtvaartmeteorologische inlichtingen, en

      i. andere door Onze Minister aangewezen taken ten aanzien van de openbare lichamen Bonaire, Sint Eustatius en Saba
      op het terrein van de meteorologie en andere geofysische terreinen.

      2 Bij regeling van Onze Minister kunnen nadere regels worden gesteld inzake de inhoud en reikwijdte van de in het
      eerste lid genoemde taken.
    url: https://wetten.overheid.nl/BWBR0012952/2015-07-18#Artikel3
  - number: 3a
    text: |-
      1 Het KNMI kan, onverminderd zijn verantwoordelijkheid voor het uitvoeren van de ingevolge [artikel 1a][ref1]
      en [artikel 3, eerste lid][ref2], aan hem opgedragen taken ten aanzien van de openbare lichamen Bonaire, Sint
      Eustatius en Saba, na schriftelijke instemming van Onze Minister, voor de uitvoering gebruik maken van een andere
      dienstverlener of, voor zover het betreft de taak bedoeld in artikel 3, eerste lid, onderdeel h, van de diensten
      van een andere verlener van meteorologische diensten voor luchtvaartnavigatie.

      2 Gronden waarop instemming als bedoeld in het eerste lid kan worden onthouden zijn:

      a. het niet voldoen of niet kunnen voldoen door de verlener van wiens diensten gebruik zal worden gemaakt aan de
      bij regeling van Onze Minister gestelde eisen inzake het toezicht op de dienstverlener of inzake zijn bekwaamheid
      of geschiktheid;

      b. strijd met het recht, of

      c. strijd met het belang van een veilig, ordelijk en vlot verloop van het luchtverkeer voor zover het betreft de
      taak bedoeld in [artikel 3, eerste lid, onderdeel h][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0012952#Artikel1a
