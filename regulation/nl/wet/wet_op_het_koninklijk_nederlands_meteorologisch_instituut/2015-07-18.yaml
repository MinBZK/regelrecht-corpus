  - number: '4'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld inzake het vaststellen van een onderzoeksprogramma, een
      onderzoeksplan, een jaarplan en een jaarverslag.
    url: https://wetten.overheid.nl/BWBR0012952/2015-07-18#Artikel4
  - number: '5'
    text: |-
      1 De hoofddirecteur stelt het algemeen weerbericht om niet beschikbaar aan natuurlijke en rechtspersonen die in
      Nederland beroepsmatig of bedrijfsmatig weersinformatie via openbare media en communicatiekanalen verspreiden.

      2 Tot het algemeen weerbericht behoren, voor zover betrekking hebbend op of gevolgen hebbend voor Nederland of
      de Noordzee:

      a. actuele meteorologische waarnemingen;

      b. een beschrijving van de weersgesteldheid, waarbij onder a bedoelde waarnemingen zijn geïnterpreteerd;

      c. de weersverwachtingen voor vandaag;

      d. weersverwachtingen voor de middellange termijn;

      e. berichten inzake de zonkrachtverwachting;

      f. weerberichten ten behoeve van de scheepvaart in de Nederlandse kustwateren, de Waddenzee en het IJsselmeer;

      g. weerberichten voor de Noordzee;

      h. waarschuwingen ten behoeve van de scheepvaart;

      i. waarschuwingen ten behoeve van het wegverkeer;

      j. waarschuwingen voor extreme weersomstandigheden;

      k. berichten bij calamiteiten waarbij het weer een belangrijke rol speelt

      3 Voor zover zich relevante verschillen in het weer boven Nederland of de Noordzee voordoen, kan een regionale
      detaillering in de berichtgeving worden aangebracht.

      4 Waarschuwingen, berichten bij calamiteiten waarbij het weer een belangrijke rol speelt en verdere
      weersverwachtingen waarbij de veiligheid in het geding is, worden voorzover het KNMI over de relevante gegevens
      beschikt en deze redelijkerwijs heeft kunnen omzetten in een algemeen weerbericht, terstond beschikbaar gesteld.
      Overige onderdelen van het algemeen weerbericht worden, behoudens indien zich geen significante weersontwikkelingen
      voordoen, ten minste 3-uurlijks beschikbaar gesteld.

      5 Bij regeling van Onze Minister worden regels gesteld inzake de inhoud en de beschikbaarheid van het algemeen
      weerbericht. Hierbij wordt rekening gehouden met de actuele stand van wetenschap en techniek.
    url: https://wetten.overheid.nl/BWBR0012952/2015-07-18#Artikel5
  - number: '6'
    text: |-
      1 KNMI-gegevens die door het KNMI zijn verkregen uit eigen waarneming, worden op verzoek beschikbaar gesteld.

      2 Het KNMI kan aanvullende dienstverlening overeenkomen.

      3 Bij regeling van Onze Minister kunnen voor de beschikbaarstelling en het gebruik van KNMI-gegevens regels worden
      vastgesteld, met betrekking tot:

      a. de mogelijkheid van het afgeven van licenties;

      b. de vaststelling van licentietarieven;

      c. overige aspecten van het afsluiten en de inhoud van overeenkomsten, waaronder de benodigde informatie en
      bescheiden.
    url: https://wetten.overheid.nl/BWBR0012952/2015-07-18#Artikel6
  - number: '7'
    text: |-
      1 Onze Minister stelt beleidsregels in een catalogus vast welke beschikbare KNMI-gegevens beschrijft met
      vermelding van de hoogte van de prijs voor de beschikbaarstelling en voor het gebruik alsmede de voorwaarden voor
      de beschikbaarstelling.

      2 De catalogus wordt ter inzage gelegd bij het KNMI. Hiervan doet Onze Minister mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0012952/2015-07-18#Artikel7
  - number: '8'
    text: |-
      1 Het KNMI wordt aangewezen als verlener van meteorologische diensten voor de luchtvaartnavigatie, als bedoeld in
      artikel 9, eerste lid, van de verordening (EG) nr. 550/2004 van het Europees Parlement en de Raad van de Europese
      Unie van 10 maart 2004 betreffende de verlening van luchtvaartnavigatiediensten in het gemeenschappelijk Europees
      luchtruim (PbEU L 96).

      2 Het KNMI draagt zorg voor het regelmatig raadplegen van gebruikers van meteorologische diensten voor de
      luchtvaartnavigatie omtrent de kostengrondslag en het vergoedingenbeleid van die dienstverlening. De raadpleging
      kan tevens op verzoek van de gebruikers plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0012952/2015-07-18#Artikel8
  - number: 8a
    text: |-
      1 Het KNMI kan, onverminderd zijn verantwoordelijkheid voor het verlenen van de diensten, bedoeld in
      [artikel 8][ref1], na schriftelijke instemming van Onze Minister gebruikmaken van de diensten van een
      andere verlener van meteorologische diensten voor luchtvaartnavigatie voor het uitvoeren van de in
      [artikel 3, eerste lid, onderdeel c][ref2], bedoelde taak.

      2 Gronden waarop instemming als bedoeld in het eerste lid kan worden onthouden zijn:

      a. het niet voldoen of niet kunnen voldoen door de verlener van wiens diensten gebruik zal worden gemaakt aan de
      op grond van [artikel 5.14d, derde lid, van de Wet luchtvaart][ref3] aan het certificaat van het KNMI gestelde
      beperkingen en voorschriften;

      b. strijd met het belang van een veilig, ordelijk en vlot verloop van het luchtverkeer; of

      c. strijd met het recht.


      [ref1]: https://wetten.overheid.nl/BWBR0012952#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0012952#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel5.14d
    url: https://wetten.overheid.nl/BWBR0012952/2015-07-18#Artikel8a
    references:
