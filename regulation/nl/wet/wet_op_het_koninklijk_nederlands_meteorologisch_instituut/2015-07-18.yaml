preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is bij wet de taken van het Koninklijk Nederlands
    Meteorologisch Instituut te regelen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0012952/2015-07-18#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Verkeer en Waterstaat;

      b. KNMI: Koninklijk Nederlands Meteorologisch Instituut;

      c. hoofddirecteur: hoofddirecteur van het KNMI;

      d. algemeen weerbericht: algemeen weerbericht als bedoeld in [artikel 5, tweede en vijfde lid][ref1];

      e. luchtvaartmeteorologische inlichtingen: inlichtingen ten behoeve van het luchtverkeer, bedoeld in
      [artikel 1.1, eerste lid, van de Wet luchtvaart][ref2];

      f. KNMI-gegevens: door het KNMI uit eigen waarneming of in internationaal verband verkregen gegevens met betrekking
      tot meteorologische en andere geofysische feiten en omstandigheden, uitgezonderd de luchtvaartmeteorologische
      inlichtingen en het algemeen weerbericht;

      g. onderzoek: wetenschappelijk onderzoek op het terrein van de meteorologie en andere geofysische terreinen.


      [ref1]: https://wetten.overheid.nl/BWBR0012952#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel1.1
