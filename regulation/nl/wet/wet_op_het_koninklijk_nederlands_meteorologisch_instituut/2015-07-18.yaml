  - number: '11'
    text: |-
      1 Er is een KNMI-raad.

      2 De raad heeft tot taak het wetenschappelijk niveau van het KNMI te bewaken en daarover te rapporteren.

      3 De raad bestaat uit minimaal vijf en maximaal negen door Onze Minister voor vier jaar op grond van bekwaamheid te
      benoemen leden, waaronder de voorzitter. Herbenoeming kan éénmaal en voor ten hoogste vier jaar plaatshebben.

      4 De leden van de raad worden op eigen aanvraag door Onze Minister ontslagen. Zij kunnen voorts door Onze Minister
      worden geschorst en ontslagen wegens ongeschiktheid, onbekwaamheid of op andere zwaarwegende gronden.

      5 Bij regeling van Onze Minister worden nadere regels gesteld met betrekking tot de rechtspositie van de leden van
      de KNMI-raad.
    url: https://wetten.overheid.nl/BWBR0012952/2015-07-18#Artikel11
  - number: '12'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet, en vervolgens telkens na vijf jaar, aan
      de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk. Hiertoe behoort
      in ieder geval de mate van toegankelijkheid van het algemeen weerbericht.
    url: https://wetten.overheid.nl/BWBR0012952/2015-07-18#Artikel12
  - number: '13'
    text: Het Reglement voor het Koninklijk Nederlands Meteorologisch Instituut wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012952/2015-07-18#Artikel13
