        artikel: 5.14d
  - number: 8b
    text: |-
      De hoofddirecteur stelt de luchtvaartmeteorologische inlichtingen op een bij regeling van Onze Minister in
      overeenstemming met Onze Minister van Defensie te bepalen wijze beschikbaar. In die regeling worden tevens regels
      gesteld inzake de inhoud van deze inlichtingen, de luchtvaartterreinen waarop de beschikbaarstelling betrekking
      heeft, de perioden van beschikbaarstelling en de categorieën van gebruikers.
    url: https://wetten.overheid.nl/BWBR0012952/2015-07-18#Artikel8b
  - number: '9'
    text: |-
      1 De hoofddirecteur draagt zorg voor openbaarmaking van de resultaten van het onderzoek uiterlijk een jaar nadat de
      resultaten tot stand zijn gekomen.

      2 Indien bij de totstandkoming van het onderzoek vertrouwelijke gegevens zijn gebruikt, worden de
      onderzoeksresultaten gesplitst in een gedeelte dat niet direct herleidbaar is tot de vertrouwelijke gegevens en een
      gedeelte dat hiertoe wel herleidbaar is. In afwijking van het eerste lid, wordt alleen het gedeelte dat niet direct
      herleidbaar is tot de vertrouwelijke gegevens, openbaar gemaakt.

      3 De resultaten van het onderzoek voorzover niet direct herleidbaar tot de vertrouwelijke gegevens, worden openbaar
      gemaakt door deze:

      a. op te nemen in een algemeen verkrijgbare uitgave;

      b. op te nemen in een vanwege het KNMI algemeen verkrijgbaar gestelde periodiek, of

      c. ter inzage te leggen bij het KNMI, in kopie te verstrekken of uit te lenen.
    url: https://wetten.overheid.nl/BWBR0012952/2015-07-18#Artikel9
  - number: '10'
    text: |-
      1 Het KNMI kan, voorzover het past in het onderzoeksprogramma en het onderzoeksplan, bedoeld in [artikel 4][ref1],
      onderzoek in opdracht van derden verrichten.

      2 De kosten van het onderzoek worden integraal doorberekend aan de opdrachtgever.

      3 Voor onderzoeken als bedoeld in het eerste lid wordt een gescheiden boekhouding bijgehouden, waarin:

      a. de interne rekening voor die onderzoeken gescheiden is van die voor de overige activiteiten;

      b. alle kosten en opbrengsten van die onderzoeken, op grond van consequent toegepaste en objectief te
      rechtvaardigen beginselen inzake kostprijsadministratie, worden toegerekend;

      c. de beginselen inzake kostprijsadministratie volgens welke de gescheiden boekhouding wordt gevoerd, duidelijk
      zijn vastgelegd.

      4 Bij regeling van Onze Minister worden nadere regels gesteld inzake de aan het onderzoek verbonden kosten die
      worden doorberekend en inzake de administratie van de kosten die aan de doorberekening ten grondslag liggen.


      [ref1]: https://wetten.overheid.nl/BWBR0012952#Artikel4
    url: https://wetten.overheid.nl/BWBR0012952/2015-07-18#Artikel10
