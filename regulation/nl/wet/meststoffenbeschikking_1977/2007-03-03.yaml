  - number: '6'
    text: |-
      Toegestaan is:

      a. de cijfers, bedoeld in [artikel 4, onder 2][ref1], aan te vullen met de cijfers voor magnesiumoxyde,
      natriumoxyde en/of zwavelzuuranhydride, mits de laatstbedoelde cijfers tussen haakjes worden vermeld;

      b. ten aanzien van patentkali en kaliumsulfaat de vermelding ‘chloorarm’, mits het chloorgehalte niet meer dan
      3% bedraagt;

      c. ten aanzien van NPK-, NK- of PK-meststoffen en samengestelde meststoffen de vermelding ‘chloorarm’ mits het
      chloorgehalte niet meer bedraagt dan 2%;

      d. ten aanzien van ammoniumnitraatureumoplossing, oplossingen van stikstofmeststoffen, oplossingen van NPK-,
      NP-, NK- en PK-meststoffen en suspensies van NPK-, NP-, NK- en PK-meststoffen, die ureum bevatten de aanduiding
      ‘biureetarm’, mits het biureetgehalte niet meer bedraagt dan 0,2%;

      e. voor de in Hoofdstuk I, onder G, van de lijst bedoelde vloeibare meststoffen die bestemd zijn voor verstuiving
      op bladeren, de vermelding van het gehalte aan oplosbaar calciumoxyde (CaO), mits dit gehalte ten minste 8%
      bedraagt.

      f. bij vloeibare meststoffen, vermelding van de volume-aanduiding en/of het gehalte aan waardegevende bestanddelen
      uitgedrukt in het bij benadering gelijkwaardige gewicht per volume-eenheid (kilogrammen per 100 liter of grammen
      per liter).

      g. ten aanzien van organische bodemverbeterende middelen het gewicht en/of de volumeaanduiding; indien het gewicht
      wordt aangegeven dient te worden vermeld hetzij het bruto- en tarragewicht, hetzij het netto-gewicht;

      h. vermelding van het merk, gebruikelijke handelsbenaming en specifieke gegevens betreffende de wijze van gebruik,
      opslag en behandeling van de meststof mits deze niet in tegenspraak zijn met de in de [artikelen 4][ref2] en
      [7][ref3] bedoelde vermeldingen


      [ref1]: https://wetten.overheid.nl/BWBR0003122#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003122#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003122#Artikel7
