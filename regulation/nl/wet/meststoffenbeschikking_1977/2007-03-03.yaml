  - number: '10'
    text: |-
      1 Het is, behoudens het in de volgende leden bepaalde, toegestaan op de verpakking, het etiket, de label of het
      begeleidend document van meststoffen, vermeld in Hoofdstuk I van de lijst, bij de type-aanduiding de vermelding
      EG-MESTSTOF in hoofddrukletters te plaatsen, indien de meststoffen voldoen aan de in deze beschikking en de lijst
      gestelde eisen.

      2 Het in het eerste lid bepaalde geldt niet voor wat betreft onderstaande, in Hoofdstuk I van in de lijst vermelde
      meststoffen:

      a. van de in onderdeel A genoemde stikstofmeststoffen: beendermeel, diermeel, galaliet in poedervorm, hoornmeel,
      ledermeel, verenmeel, vismeel, wolafval of bijprodukt van de bewerking van vellen, bloedmeel voor meststof,
      cacaodoppen, moutscheuten, meel van koeken van oliehoudende zaden, waaruit olie gewonnen is, salmiak, vloeibare
      ammoniak, gemengde stikstofmeststof, en ureum met zwavel omhuld;

      b. van de in onderdeel B genoemde fosfaatmeststoffen: ontlijmd beendermeel voor meststof;

      c. van de in onderdeel C genoemde kalimeststoffen: ruw kalinatriumzout;

      d. de in onderdeel D genoemde meststoffen met twee of drie van de waardegevende bestanddelen stikstof,
      fosforzuuranhydride en kaliumoxyde;

      e. de in onderdeel F genoemde samengestelde meststoffen;

      f. van de in onderdeel J genoemde spoorelementmeststoffen: koperslakkenbloem.

      3 Het in het eerste lid bepaalde geldt voorts niet indien de aanduiding, bedoeld in [artikel 6, onder b][ref1],
      wordt vermeld of een garantie, als bedoeld in [artikel 7, onder b en c, de subonderdelen 1, 2, 4, 5, 6 en 7][ref2]
      wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003122#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003122#Artikel7
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel10
