  text: |-
    Gelet op de artikelen 2, 3, 4, 5 en 6 van het Meststoffenbesluit 1977 (Stb. 459),

    Besluit:
  url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Met de in deze beschikking vermelde gehalten en getallen worden bedoeld de gehalten en getallen, zoals deze
      worden gevonden door toepassing van de methoden van onderzoek welke worden vastgesteld door de Minister van
      Landbouw, Natuurbeheer en Visserij.

      2 Voor de toepassing van deze beschikking wordt verstaan onder:



              a

                *fosforzuuranhydride:*


                het gehalte aan fosfor uitgedrukt als fosforpentoxyde;



              b

                *fosforzuuranhydride, uitsluitend oplosbaar in mineraalzuur:*


                het gehalte dat verkregen wordt door het gehalte aan fosforzuuranhydride, oplosbaar in mineraalzuur, te
      verminderen met het gehalte aan fosforzuuranhydride oplosbaar in het voor de betrokken meststof toegelaten ander
      oplosmiddel;



              c

                *kaliumoxyde:*


                het gehalte aan kalium uitgedrukt als kaliumoxyde;



              d

                *magnesiumoxyde:*


                het gehalte aan magnesium, uitgedrukt als magnesiumoxyde;



              e

                *zwavelzuuranhydride:*


                het gehalte aan zwavel, uitgedrukt als zwavelzuuranhydride, afkomstig van het sulfaatanion;



              f

                *natriumoxyde:*


                het gehalte aan natrium, uitgedrukt als natriumoxyde;



              g

                *neutraliserende waarde:*


                het getal dat aangeeft het aantal milliliters zoutzuur 0.357 n, dat geneutraliseerd wordt door 1 gram van
      de stof;



              h

                *organische stof:*


                het gehalte aan organische stof dat verkregen wordt door toepassing van de methode met
      trichloorazijnzuur;



              i

                *basenequivalent:*


                het getal, berekend in kilogram calciumoxyde per 100 kg meststof, dat de waarde van de uiteindelijke
      reactie van de meststof na toevoeging aan de bodem aangeeft, rekening houdend met alle bestanddelen van die
      meststof. Is de waarde van dit getal lager dan –5, dan is de meststof ‘zuurwerkend’, is het hoger dan +5, dan is
      zij ‘basischwerkend’; in de overige gevallen is zij ‘neutraalwerkend’.




      3 De eisen in kolom c van hoofdstuk II van bijlage 1 bij deze regeling, gesteld aan de fijnheid, zijn uitgedrukt op
      de droge stof.
