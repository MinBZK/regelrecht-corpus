    text: |-
      Als lijst van meststoffen bedoeld in [artikel 2 van het Meststoffenbesluit 1977][ref1] wordt vastgesteld de lijst
      welke als [bijlage I][ref2] bij deze beschikking is gevoegd, hierna te noemen de lijst.


      [ref1]: https://wetten.overheid.nl/BWBR0003115#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003122
