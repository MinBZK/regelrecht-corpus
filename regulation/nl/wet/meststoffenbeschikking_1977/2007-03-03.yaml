    text: |-
      Als aanduidingen en vermeldingen, bedoeld in [artikel 4, onder a, van het Meststoffenbesluit 1977][ref1], worden
      hierbij voorgeschreven:

      1. de typeaanduidingen dan wel ten miste één der typeaanduidingen, welke is of zijn aangegeven in kolom a van de
      lijst;

      2. Indien het NPK-, NP-, NK- of PK-meststoffen, oplossingen van NPK-, NP-, NK- of PK-meststoffen, suspensies
      van NPK-, NP-, NK- of PK-meststoffen, os samengestelde meststoffen betreft, na de type-aanduiding drie of
      twee onderling van elkaar gescheiden cijfers, die de gehalten aan de waardegevende bestanddelen stikstof,
      fosforzuuranhydride of kaliumoxyde aanduiden voor zover deze bestanddelen in de type-aanduiding zijn vermeld en in
      de volgorde als door de type-aanduiding wordt aangegeven;

      3. de naam ‘meststof’, de naam ‘kalkmeststof’ of de naam ‘organisch bodemverbeterend middel’ al naar gelang de
      meststof is genoemd in hoofdstuk I, hoofdstuk II of hoofdstuk III van de lijst en voor zover deze namen niet reeds
      in de betreffende typeaanduidingen of in de vermelding bedoeld in [artikel 10][ref2] voorkomen;

      4. de in kolom d van de lijst voor de meststof aangegeven garanties, uitgedrukt op de aldaar aangegeven wijze, met
      uitzondering van die welke aldaar zijn vermeld onder het opschrift ‘facultatief’;

      5. voor alle meststoffen met uitzondering van organische bodemverbeterende middelen hetzij het bruto- en
      tarragewicht hetzij het netto-gewicht;

      6. de naam, de handelsnaam of het merk, alsmede het adres van de binnen het grondgebied van de lidstaten van de
      Europese Gemeenschappen gevestigde producent, importeur of wederverkoper;

      7. voor de in hoofdstuk I, onder G, van de lijst bedoelde vloeibare meststoffen, een gebruiksaanwijzing welke in
      elk geval betrekking heeft op de temperatuur waarbij deze meststoffen moeten worden opgeslagen, en het voorkomen
      van ongevallen tijdens opslag;

      8. indien bij de in hoofdstuk 1, met uitzondering van de onder H van de lijst bedoelde meststoffen, een garantie
      wordt gegeven voor magnesiumoxyde, natriumoxyde en/of zwavelzuuranhydride, een aanvulling van de type-aanduiding
      met de vermelding ‘bevat’ gevolgd door de naam van elk van de aanwezige elementen of het scheikundig symbool
      daarvoor;

      9. voor de in hoofdstuk I, met uitzondering van de onder J, van de lijst bedoelde meststoffen, het gehalte aan één
      of meer van de spoorelementen boor, kobalt, koper, ijzer, mangaan, molybdeen of zink, indien deze spoorelementen
      zijn toegevoegd en aanwezig zijn in hoeveelheden die ten minste gelijk zijn aan de in de bij deze beschikking
      behorende [bijlage III][ref3] genoemde minimumwaarden voor de daarbij aangegeven bestemming;

      10. indien bij de in hoofdstuk I, met uitzondering van de onder J van de lijst bedoelde meststoffen een garantie
      wordt gegeven voor een of meer spoorelementen, een aanvulling van de type-aanduiding met een van de volgende
      vermeldingen:

        - ‘met spoorelement(en)’, of
        - ‘met …’ gevolgd door de naam van elk van de aanwezige spoorelementen of het chemisch symbool daarvoor, in
      alfabetische volgorde B, Co, Cu, Fe, Mn, Mo, Zn;

      11. indien een meststof een spoorelement bevat, dat chemisch gebonden is aan een organisch molecuul, een garantie
      voor dat gehalte, gevolgd door het woord ‘chelaatvormer’ met de naam of afkorting van een van de volgende zuren en
      hun natrium, kalium en ammoniumzouten:

        - Ethyleendiaminetetra-azijnzuur EDTA
        - Diëthyleentriaminepenta-azijnzuur DTPA
        - Ethyleendiaminedi (2-hydroxyfenyl) azijnzuur EDDHA
        - 2-Hydroxyethyleendiaminetriazijnzuur HEDTA
        - Ethyleendiaminedi (2-hydroxy-4-methylfenyl)-azijnzuur EDDHMA
        - Ethyleendiaminedi (5-carboxy-2-hydroxyfenyl)-azijnzuur EDDCHA

      de garantie dient te worden gegeven onmiddellijk na het in water oplosbare gehalte;

      12. voor de in hoofdstuk I, onder J, van de lijst bedoelde spoorelementmeststoffen, onder de verplichte of
      facultatieve aanduiding de vermelding:

      Alleen te gebruiken in geval van gebleken behoefte. De benodigde doses mogen niet worden overschreden;

      13. bij het vervoeren en verkopen van meststoffen met spoorelementen of op basis van spoorelementen, een
      dosisaanduiding en een gebruiksaanwijzing, die passen bij de bodemgesteldheid en de teelt waarvoor de meststof
      wordt gebruikt en die duidelijk gescheiden zijn van de overige verplichte vermeldingen.

      14. bij de in hoofdstuk I, onder J, van de lijst bedoelde spoorelementstoffen in chelaatvorm, een aanduiding
      op welk pH-traject de stabiliteit van de fractie is gewaarborgd; deze voorwaarde geldt niet voor mengsels van
      spoorelementen.


