  - number: '8'
    text: |-
      1 Gegarandeerde gehalten van elk bestanddeel alsmede van de vormen of oplosbaarheden moeten, tenzij in deze
      beschikking of in de lijst anders is bepaald, zijn aangegeven in gewichtsprocenten, uitgedrukt in één geheel getal
      of in één getal met één decimaal. Wanneer de meststof verschillende aan te geven bestanddelen bevat, moeten de
      gehalten worden vermeld met als volgorde: N, PO, KO, CaO, MgO, NaO en SO. Wanneer in een meststof verschillende
      spoorelementen aanwezig zijn, moeten zij worden vermeld in alfabetische volgorde van hun chemische symbolen: B, Co,
      Cu, Fe, Mn, Mo, Zn.

      2 De gegarandeerde getallen voor hoedanigheden moeten tenzij in deze beschikking of in de lijst anders is bepaald,
      worden uitgedrukt in één geheel getal of in een getal met één decimaal.

      3 Het gegarandeerde gehalte aan calcium, magnesium of calcium en magnesium in zuurbindende vorm, uitgedrukt als
      calciumcarbonaat moet worden aangegeven in één geheel getal.

      4 De neutraliserende waarde en het basenequivalent moeten worden aangegeven in één geheel getal.

      5 Het gegarandeerde gehalte aan spoorelementen moet worden aangegeven in:

        - hetzij één getal met één decimaal bij meststoffen met één spoorelement als bedoeld in hoofdstuk I, onder J, van
      de lijst
        - hetzij één getal met een aantal decimalen dat voor elk element overeenkomt met het aantal decimalen genoemd in
      hoofdstuk I, onder J.2, kolom c, van de lijst, dan wel met het aantal decimalen genoemd in de bij deze beschikking
      behorende [Bijlage III][ref1].

      6 Bij de in de vorige leden bedoelde getallen zijn toevoegingen zoals ‘circa’ en ‘plus minus’ (±) niet toegestaan.

      7 De verplichte of toegestane vermelding van gehalten of getallen geldt als een door de verkoper gegeven garantie.


      [ref1]: https://wetten.overheid.nl/BWBR0003122
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel8
    references:
