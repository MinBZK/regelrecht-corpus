  - number: '3'
    text: |-
      De eisen waaraan een meststof bij het vervoeren en verkopen moet voldoen zijn:

      a. de meststof moet verkeren in een voor de praktijk bruikbare toestand en moet gelijkmatig van samenstelling zijn;

      b. de meststof mag geen schadelijke bestanddelen bevatten in zodanige hoeveelheden, dat zij bij een juist gebruik
      een nadelige invloed op de gewassen of de gezondheid van mens of dier kan uitoefenen;

      c. de meststof moet overeenkomen met de daarvoor in kolom b gegeven omschrijving;

      d. de meststof moet voldoen aan de in kolom c van de lijst bij die meststof vermelde eisen;

      e. de meststof moet van zodanige samenstelling zijn dat aan de gegeven garanties is voldaan, behoudens de
      overeenkomstig [artikel 9][ref1] toegestane speling;

      f. de meststoffen bedoeld in hoofdstuk I, onder J, van de lijst, moeten zijn verpakt.

      g. de meststoffen bedoeld in hoofdstuk I, van de lijst, moeten doeltreffende waardegevende bestanddelen bevatten,
      die zijn afgestemd op de behoeften van een bepaalde teelt of op de groeivoorwaarden van bepaalde teelten.


      [ref1]: https://wetten.overheid.nl/BWBR0003122#Artikel9
