  - number: '11'
    text: |-
      1 De aanduidingen en vermeldingen, als bedoeld in de [artikelen 4][ref1], [5][ref2],
      [6 onder a, b, c, d, e, f en g, 7 en 10, eerste lid][ref3], moeten duidelijk gescheiden zijn van de aanduidingen en
      vermeldingen, als bedoeld in [artikel 6, onder h][ref4].

      2 De in het voorgaande lid bedoelde aanduidingen en vermeldingen moeten voorts gescheiden zijn van andere
      aanduidingen en vermeldingen, die op de verpakking voorkomen.


