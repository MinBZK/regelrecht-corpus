  - number: '9'
    text: |-
      Voor de toepassing van deze beschikking worden op de garanties, welke ingevolge deze beschikking moeten of mogen
      worden gegeven als spelingen toegestaan, de spelingen welke zijn vermeld in [bijlage II][ref1], met dien verstande
      dat:

      a. het in de meststof aanwezige gehalte niet lager mag zijn dan de volgens deze beschikking of de lijst vereiste
      minimum gehalten of getallen, onderscheidenlijk niet hoger mag zijn dan de vereiste maximum gehalten of getallen;

      b. het tekort op een gegarandeerd gehalte aan een waardegevend bestanddeel niet kan worden gecompenseerd door een
      teveel op een gegarandeerd gehalte aan een ander waardegevend bestanddeel noch door een tekort op een gegarandeerd
      gehalte aan een waardeverminderend bestanddeel;

      een teveel op een gegarandeerd gehalte aan een waardeverminderend bestanddeel niet kan worden gecompenseerd door
      een tekort op een gehalte aan een ander waardeverminderend bestanddeel noch door een teveel op een gegarandeerd
      gehalte aan een waardegevend bestanddeel.


      [ref1]: https://wetten.overheid.nl/BWBR0003122
