  - number: '12'
    text: |-
      1 Indien een meststof is verpakt moet de verpakking op een zodanige wijze zijn gesloten, dat bij het openen de
      sluiting, de verzegeling of de verpakking zelf onherstelbaar wordt beschadigd.

      2 Klepzakken worden geacht gesloten te zijn op de in het vorige lid bedoelde wijze.

      3 Indien de sluiting geschiedt door middel van een zegel of plombeerlood moet hierop de naam, de handelsnaam of het
      merk van de persoon, bedoeld in [artikel 4, onder 6][ref1], worden aangebracht.

      4 Indien gebruik wordt gemaakt van een aan de verpakking bevestigde label moet deze deel uitmaken van de sluiting
      of verzegeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003122#Artikel4
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel12
