---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: meststoffenbeschikking_1977
regulatory_layer: WET
publication_date: '2005-10-11'
valid_from: '2007-03-03'
bwb_id: BWBR0003122
url: https://wetten.overheid.nl/BWBR0003122/2007-03-03
preamble:
  text: |-
    Gelet op de artikelen 2, 3, 4, 5 en 6 van het Meststoffenbesluit 1977 (Stb. 459),

    Besluit:
  url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Met de in deze beschikking vermelde gehalten en getallen worden bedoeld de gehalten en getallen, zoals deze worden
      gevonden door toepassing van de methoden van onderzoek welke worden vastgesteld door de Minister van Landbouw,
      Natuurbeheer en Visserij.
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van deze beschikking wordt verstaan onder:

              a

                *fosforzuuranhydride:*


                het gehalte aan fosfor uitgedrukt als fosforpentoxyde;



              b

                *fosforzuuranhydride, uitsluitend oplosbaar in mineraalzuur:*


                het gehalte dat verkregen wordt door het gehalte aan fosforzuuranhydride, oplosbaar in mineraalzuur, te
      verminderen met het gehalte aan fosforzuuranhydride oplosbaar in het voor de betrokken meststof toegelaten ander
      oplosmiddel;



              c

                *kaliumoxyde:*


                het gehalte aan kalium uitgedrukt als kaliumoxyde;



              d

                *magnesiumoxyde:*


                het gehalte aan magnesium, uitgedrukt als magnesiumoxyde;



              e

                *zwavelzuuranhydride:*


                het gehalte aan zwavel, uitgedrukt als zwavelzuuranhydride, afkomstig van het sulfaatanion;



              f

                *natriumoxyde:*


                het gehalte aan natrium, uitgedrukt als natriumoxyde;



              g

                *neutraliserende waarde:*


                het getal dat aangeeft het aantal milliliters zoutzuur 0.357 n, dat geneutraliseerd wordt door 1 gram van
      de stof;



              h

                *organische stof:*


                het gehalte aan organische stof dat verkregen wordt door toepassing van de methode met
      trichloorazijnzuur;



              i

                *basenequivalent:*


                het getal, berekend in kilogram calciumoxyde per 100 kg meststof, dat de waarde van de uiteindelijke
      reactie van de meststof na toevoeging aan de bodem aangeeft, rekening houdend met alle bestanddelen van die
      meststof. Is de waarde van dit getal lager dan –5, dan is de meststof ‘zuurwerkend’, is het hoger dan +5, dan is
      zij ‘basischwerkend’; in de overige gevallen is zij ‘neutraalwerkend’.
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel1
  - number: '1.3'
    text: |-
      De eisen in kolom c van hoofdstuk II van bijlage 1 bij deze regeling, gesteld aan de fijnheid, zijn uitgedrukt op
      de droge stof.
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel1
  - number: '2'
    text: |-
      Als lijst van meststoffen bedoeld in [artikel 2 van het Meststoffenbesluit 1977][ref1] wordt vastgesteld de lijst
      welke als [bijlage I][ref2] bij deze beschikking is gevoegd, hierna te noemen de lijst.


      [ref1]: https://wetten.overheid.nl/BWBR0003115#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003122
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003115
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003122
  - number: '3'
    text: 'De eisen waaraan een meststof bij het vervoeren en verkopen moet voldoen zijn:'
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel3
  - number: 3.a
    text: de meststof moet verkeren in een voor de praktijk bruikbare toestand en moet gelijkmatig van samenstelling zijn;
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel3
  - number: 3.b
    text: |-
      de meststof mag geen schadelijke bestanddelen bevatten in zodanige hoeveelheden, dat zij bij een juist gebruik een
      nadelige invloed op de gewassen of de gezondheid van mens of dier kan uitoefenen;
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel3
  - number: 3.c
    text: de meststof moet overeenkomen met de daarvoor in kolom b gegeven omschrijving;
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel3
  - number: 3.d
    text: de meststof moet voldoen aan de in kolom c van de lijst bij die meststof vermelde eisen;
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel3
  - number: 3.e
    text: |-
      de meststof moet van zodanige samenstelling zijn dat aan de gegeven garanties is voldaan, behoudens de
      overeenkomstig [artikel 9][ref1] toegestane speling;


      [ref1]: https://wetten.overheid.nl/BWBR0003122#Artikel9
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003122
        artikel: '9'
  - number: 3.f
    text: de meststoffen bedoeld in hoofdstuk I, onder J, van de lijst, moeten zijn verpakt.
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel3
  - number: 3.g
    text: |-
      de meststoffen bedoeld in hoofdstuk I, van de lijst, moeten doeltreffende waardegevende bestanddelen bevatten, die
      zijn afgestemd op de behoeften van een bepaalde teelt of op de groeivoorwaarden van bepaalde teelten.
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel3
  - number: '4'
    text: |-
      Als aanduidingen en vermeldingen, bedoeld in [artikel 4, onder a, van het Meststoffenbesluit 1977][ref1], worden
      hierbij voorgeschreven:


      [ref1]: https://wetten.overheid.nl/BWBR0003115#Artikel4
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003115
        artikel: '4'
  - number: '4.1'
    text: |-
      de typeaanduidingen dan wel ten miste één der typeaanduidingen, welke is of zijn aangegeven in kolom a van de
      lijst;
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel4
  - number: '4.2'
    text: |-
      Indien het NPK-, NP-, NK- of PK-meststoffen, oplossingen van NPK-, NP-, NK- of PK-meststoffen, suspensies van NPK-,
      NP-, NK- of PK-meststoffen, os samengestelde meststoffen betreft, na de type-aanduiding drie of twee onderling
      van elkaar gescheiden cijfers, die de gehalten aan de waardegevende bestanddelen stikstof, fosforzuuranhydride of
      kaliumoxyde aanduiden voor zover deze bestanddelen in de type-aanduiding zijn vermeld en in de volgorde als door de
      type-aanduiding wordt aangegeven;
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel4
  - number: '4.3'
    text: |-
      de naam ‘meststof’, de naam ‘kalkmeststof’ of de naam ‘organisch bodemverbeterend middel’ al naar gelang de
      meststof is genoemd in hoofdstuk I, hoofdstuk II of hoofdstuk III van de lijst en voor zover deze namen niet reeds
      in de betreffende typeaanduidingen of in de vermelding bedoeld in [artikel 10][ref1] voorkomen;


      [ref1]: https://wetten.overheid.nl/BWBR0003122#Artikel10
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003122
        artikel: '10'
  - number: '4.4'
    text: |-
      de in kolom d van de lijst voor de meststof aangegeven garanties, uitgedrukt op de aldaar aangegeven wijze, met
      uitzondering van die welke aldaar zijn vermeld onder het opschrift ‘facultatief’;
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel4
  - number: '4.5'
    text: |-
      voor alle meststoffen met uitzondering van organische bodemverbeterende middelen hetzij het bruto- en tarragewicht
      hetzij het netto-gewicht;
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel4
  - number: '4.6'
    text: |-
      de naam, de handelsnaam of het merk, alsmede het adres van de binnen het grondgebied van de lidstaten van de
      Europese Gemeenschappen gevestigde producent, importeur of wederverkoper;
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel4
  - number: '4.7'
    text: |-
      voor de in hoofdstuk I, onder G, van de lijst bedoelde vloeibare meststoffen, een gebruiksaanwijzing welke in elk
      geval betrekking heeft op de temperatuur waarbij deze meststoffen moeten worden opgeslagen, en het voorkomen van
      ongevallen tijdens opslag;
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel4
  - number: '4.8'
    text: |-
      indien bij de in hoofdstuk 1, met uitzondering van de onder H van de lijst bedoelde meststoffen, een garantie wordt
      gegeven voor magnesiumoxyde, natriumoxyde en/of zwavelzuuranhydride, een aanvulling van de type-aanduiding met de
      vermelding ‘bevat’ gevolgd door de naam van elk van de aanwezige elementen of het scheikundig symbool daarvoor;
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel4
  - number: '4.9'
    text: |-
      voor de in hoofdstuk I, met uitzondering van de onder J, van de lijst bedoelde meststoffen, het gehalte aan één of
      meer van de spoorelementen boor, kobalt, koper, ijzer, mangaan, molybdeen of zink, indien deze spoorelementen zijn
      toegevoegd en aanwezig zijn in hoeveelheden die ten minste gelijk zijn aan de in de bij deze beschikking behorende
      [bijlage III][ref1] genoemde minimumwaarden voor de daarbij aangegeven bestemming;


      [ref1]: https://wetten.overheid.nl/BWBR0003122
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003122
  - number: '4.10'
    text: |-
      indien bij de in hoofdstuk I, met uitzondering van de onder J van de lijst bedoelde meststoffen een garantie
      wordt gegeven voor een of meer spoorelementen, een aanvulling van de type-aanduiding met een van de volgende
      vermeldingen: '- ‘met spoorelement(en)’, of'
        - ‘met …’ gevolgd door de naam van elk van de aanwezige spoorelementen of het chemisch symbool daarvoor, in
      alfabetische volgorde B, Co, Cu, Fe, Mn, Mo, Zn;
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel4
  - number: '4.11'
    text: |-
      indien een meststof een spoorelement bevat, dat chemisch gebonden is aan een organisch molecuul, een garantie voor
      dat gehalte, gevolgd door het woord ‘chelaatvormer’ met de naam of afkorting van een van de volgende zuren en hun
      natrium, kalium en ammoniumzouten: - Ethyleendiaminetetra-azijnzuur EDTA
        - Diëthyleentriaminepenta-azijnzuur DTPA
        - Ethyleendiaminedi (2-hydroxyfenyl) azijnzuur EDDHA
        - 2-Hydroxyethyleendiaminetriazijnzuur HEDTA
        - Ethyleendiaminedi (2-hydroxy-4-methylfenyl)-azijnzuur EDDHMA
        - Ethyleendiaminedi (5-carboxy-2-hydroxyfenyl)-azijnzuur EDDCHA de garantie dient te worden gegeven onmiddellijk na
      het in water oplosbare gehalte;
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel4
  - number: '4.12'
    text: |-
      voor de in hoofdstuk I, onder J, van de lijst bedoelde spoorelementmeststoffen, onder de verplichte of facultatieve
      aanduiding de vermelding: Alleen te gebruiken in geval van gebleken behoefte. De benodigde doses mogen niet worden
      overschreden;
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel4
  - number: '4.13'
    text: |-
      bij het vervoeren en verkopen van meststoffen met spoorelementen of op basis van spoorelementen, een
      dosisaanduiding en een gebruiksaanwijzing, die passen bij de bodemgesteldheid en de teelt waarvoor de meststof
      wordt gebruikt en die duidelijk gescheiden zijn van de overige verplichte vermeldingen.
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel4
  - number: '4.14'
    text: |-
      bij de in hoofdstuk I, onder J, van de lijst bedoelde spoorelementstoffen in chelaatvorm, een aanduiding op
      welk pH-traject de stabiliteit van de fractie is gewaarborgd; deze voorwaarde geldt niet voor mengsels van
      spoorelementen.
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel4
  - number: '5.1'
    text: |-
      Indien aan een organisch bodemverbeterend middel, genoemd in hoofdstuk III van de lijst een of meer
      van de in hoofdstuk I onder A, B, C, D of E van de lijst genoemde meststoffen, met uitzondering van
      natuurfosfaat, gedeeltelijk ontsloten natuurfosfaat en aluminiumcalciumfosfaat, is toegevoegd dient aan de in
      [artikel 4, onder 1°][ref1], bedoelde typeaanduiding het woord ‘verrijkt’ te worden toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003122#Artikel4
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003122
        artikel: '4'
  - number: '5.2'
    text: |-
      In het geval bedoeld in het vorige lid, dienen behalve de garanties bedoeld in [artikel 4, onder 4°][ref1], te
      worden vermeld de garantie of garanties, genoemd in [artikel 7, onder d][ref2], al naar gelang van het bestanddeel
      of de bestanddelen, waarop de toevoeging betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003122#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003122#Artikel7
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003122
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0003122
        artikel: '7'
  - number: '6'
    text: 'Toegestaan is:'
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel6
  - number: 6.a
    text: |-
      de cijfers, bedoeld in [artikel 4, onder 2][ref1], aan te vullen met de cijfers voor magnesiumoxyde, natriumoxyde
      en/of zwavelzuuranhydride, mits de laatstbedoelde cijfers tussen haakjes worden vermeld;


      [ref1]: https://wetten.overheid.nl/BWBR0003122#Artikel4
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003122
        artikel: '4'
  - number: 6.b
    text: |-
      ten aanzien van patentkali en kaliumsulfaat de vermelding ‘chloorarm’, mits het chloorgehalte niet meer dan 3%
      bedraagt;
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel6
  - number: 6.c
    text: |-
      ten aanzien van NPK-, NK- of PK-meststoffen en samengestelde meststoffen de vermelding ‘chloorarm’ mits het
      chloorgehalte niet meer bedraagt dan 2%;
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel6
  - number: 6.d
    text: |-
      ten aanzien van ammoniumnitraatureumoplossing, oplossingen van stikstofmeststoffen, oplossingen van NPK-, NP-,
      NK- en PK-meststoffen en suspensies van NPK-, NP-, NK- en PK-meststoffen, die ureum bevatten de aanduiding
      ‘biureetarm’, mits het biureetgehalte niet meer bedraagt dan 0,2%;
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel6
  - number: 6.e
    text: |-
      voor de in Hoofdstuk I, onder G, van de lijst bedoelde vloeibare meststoffen die bestemd zijn voor verstuiving op
      bladeren, de vermelding van het gehalte aan oplosbaar calciumoxyde (CaO), mits dit gehalte ten minste 8% bedraagt.
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel6
  - number: 6.f
    text: |-
      bij vloeibare meststoffen, vermelding van de volume-aanduiding en/of het gehalte aan waardegevende bestanddelen
      uitgedrukt in het bij benadering gelijkwaardige gewicht per volume-eenheid (kilogrammen per 100 liter of grammen
      per liter).
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel6
  - number: 6.g
    text: |-
      ten aanzien van organische bodemverbeterende middelen het gewicht en/of de volumeaanduiding; indien het gewicht
      wordt aangegeven dient te worden vermeld hetzij het bruto- en tarragewicht, hetzij het netto-gewicht;
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel6
  - number: 6.h
    text: |-
      vermelding van het merk, gebruikelijke handelsbenaming en specifieke gegevens betreffende de wijze van gebruik,
      opslag en behandeling van de meststof mits deze niet in tegenspraak zijn met de in de [artikelen 4][ref1] en
      [7][ref2] bedoelde vermeldingen


      [ref1]: https://wetten.overheid.nl/BWBR0003122#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003122#Artikel7
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003122
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0003122
        artikel: '7'
  - number: '7'
    text: |-
      Toegestaan is vermelding van de volgende garanties uitgedrukt op de hierna of in kolom d van de lijst aangegeven
      wijze:
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel7
  - number: 7.a
    text: |-
      *ten aanzien van alle in de lijst genoemde meststoffen:* - de in kolom d van de lijst onder het opschrift
      ‘Facultatief’ voor de meststof aangegeven garanties;
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel7
  - number: 7.b
    text: '*ten aanzien van alle in de lijst genoemde meststoffen:* - een garantie voor het gehalte aan vocht;'
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel7
  - number: 7.c
    text: '*ten aanzien van de in hoofdstuk I van de lijst genoemde meststoffen:*'
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel7
  - number: 7.c.1
    text: |-
      een garantie voor het gehalte aan calcium (Ca), oplosbaar in mineraalzuur, mits dit gehalte ten minste 4%
      bedraagt en daarbij wordt vermeld het woord ‘basenequivalent’ met het daarvoor gegarandeerd getal gevolgd door de
      aanduiding ‘zuurwerkend’, ‘basischwerkend’ of ‘neutraalwerkend’ al naar gelang een van deze aanduidingen volgens
      [artikel 1, tweede lid, onder i][ref1], van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0003122#Artikel1
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003122
        artikel: '1'
  - number: 7.c.2
    text: |-
      een garantie voor het gehalte aan calcium, magnesium of calcium en magnesium, in zuurbindende vorm, uitgedrukt
      als calciumcarbonaat, mits deze bestanddelen aanwezig zijn in één of meer van de vormen calciumoxyde,
      calciumhydroxyde, calciumcarbonaat en/of analoge magnesiumverbindingen, dit gehalte ten minste 10% bedraagt
      en daarbij wordt vermeld het woord ‘basenequivalent’ met het daarvoor gegarandeerde getal gevolgd door de
      aanduiding ‘zuurwerkend’, ‘basischwerkend’ of ‘neutraalwerkend’, al naar gelang een van deze aanduidingen volgens
      [artikel 1, tweede lid, onder i][ref1], van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0003122#Artikel1
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003122
        artikel: '1'
  - number: 7.c.3
    text: |-
      een garantie voor het gehalte aan magnesiumoxyde (MgO) en/of naltriumoxyde (Na/O) en/of zwavelzuuranhydride (SO)
      mits de gehalte voor magnesiumoxyde tenminste 2%, voor natriumoxyde ten minste 3% en voor zavelzuuranhydride ten
      minste 5% bedragen. Deze gehalten dienen elk op een van de volgende wijzen te worden aangegeven: - totaal gehalte;
        - indien volledig oplosbaar in water, alleen het in water oplosbare gehalte;
        - totaal gehalte en het gehalte oplosbaar in water, wanneer ten minste een kwart van het totaal gehalte oplosbaar
      is in water.
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel7
  - number: 7.c.4
    text: |-
      uitgezonderd ten aanzien van thomasmeel en andere meststoffen op basis van thomasmeel: een garantie voor het
      gewichtspercentage aan korrels met een doorsnede tussen 1 en 3 mm, tussen 2 en 4 mm of tussen 3 en 5 mm, mits
      dit percentage ten minste 80 bedraagt; ten aanzien van thomasmeel en andere meststoffen op basis van thomasmeel:
      een garantie voor het gewichtspercentage aan korrels met een doorsnee tussen 0,3 en 3 mm, mits dit percentage ten
      minste 80 bedraagt.
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel7
  - number: 7.d
    text: |-
      ten aanzien van de in hoofdstuk I, van de lijst bedoelde meststoffen, waarbij de spoorelementen gebruikelijke
      bestanddelen zijn van de grondstoffen die voor toevoeging van de hoofdbestanddelen en van de secundaire
      bestanddelen worden gebruikt:
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel7
  - number: 7.d.1
    text: |-
      een garantie voor het gehalte aan borium (B), kobalt (Co), koper (Cu), ijzer (Fe), mangaan (Mn), molybdeen (Mo)
      en/of zink (Zn), mits voldaan wordt aan het gestelde in [artikel 4, onderdeel 9][ref1]. Indien een garantie wordt
      gegeven dienen de gehalten van de respectievelijke aanwezige spoorelementen op één van de volgende wijzen te worden
      aangegeven: '- totaal gehalte en het gehalte oplosbaar in water, wanneer ten minste de helft van het totaal gehalte'
      oplosbaar is in water;
        - indien volledig oplosbaar in water, alleen het in water oplosbare gehalte;


      [ref1]: https://wetten.overheid.nl/BWBR0003122#Artikel4
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003122
        artikel: '4'
  - number: 7.d.2
    text: Het gehalte aan spoorelementen moet worden vermeld met de volledige benaming en het chemisch symbool.
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel7
  - number: 7.e
    text: 'ten aanzien van de organische bodemverbeterende middelen genoemd in hoofdstuk III van de lijst:'
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel7
  - number: 7.e.1
    text: |-
      een garantie voor het gehalte aan stikstof totaal (N) aanwezig in één of meer van de volgende vormen, te weten:
      ammoniumstikstof, nitraatstikstof, ureumstikstof, cyaanamidestikstof en/of organisch gebonden stikstof mits dit
      gehalte ten minste 0,5% bedraagt; daarbij moet tevens een garantie worden gegeven voor het gehalte van elk der
      bindingsvormen waarvan ten minste 0,5% aanwezig is;
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel7
  - number: 7.e.2
    text: |-
      een garantie voor het gehalte aan fosforzuuranhydride (PO) oplosbaar in water, in water en neutraal
      ammoniumcitraat, in neutraal ammoniumcitraat, in 2% citroenzuur of in mineraalzuur, met aanduiding van de aard van
      de oplosbaarheid, mits dit gehalte ten minste 0,5% bedraagt;
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel7
  - number: 7.e.3
    text: een garantie voor het gehalte aan kaliumoxyde (KO), oplosbaar in water, mits dit gehalte ten minste 0,5% bedraagt.
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel7
  - number: '8.1'
    text: |-
      Gegarandeerde gehalten van elk bestanddeel alsmede van de vormen of oplosbaarheden moeten, tenzij in deze
      beschikking of in de lijst anders is bepaald, zijn aangegeven in gewichtsprocenten, uitgedrukt in één geheel getal
      of in één getal met één decimaal. Wanneer de meststof verschillende aan te geven bestanddelen bevat, moeten de
      gehalten worden vermeld met als volgorde: N, PO, KO, CaO, MgO, NaO en SO. Wanneer in een meststof verschillende
      spoorelementen aanwezig zijn, moeten zij worden vermeld in alfabetische volgorde van hun chemische symbolen: B, Co,
      Cu, Fe, Mn, Mo, Zn.
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel8
  - number: '8.2'
    text: |-
      De gegarandeerde getallen voor hoedanigheden moeten tenzij in deze beschikking of in de lijst anders is bepaald,
      worden uitgedrukt in één geheel getal of in een getal met één decimaal.
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel8
  - number: '8.3'
    text: |-
      Het gegarandeerde gehalte aan calcium, magnesium of calcium en magnesium in zuurbindende vorm, uitgedrukt als
      calciumcarbonaat moet worden aangegeven in één geheel getal.
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel8
  - number: '8.4'
    text: De neutraliserende waarde en het basenequivalent moeten worden aangegeven in één geheel getal.
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel8
  - number: '8.5'
    text: |-
      Het gegarandeerde gehalte aan spoorelementen moet worden aangegeven in: - hetzij één getal met één decimaal bij
      meststoffen met één spoorelement als bedoeld in hoofdstuk I, onder J, van de lijst
        - hetzij één getal met een aantal decimalen dat voor elk element overeenkomt met het aantal decimalen genoemd in
      hoofdstuk I, onder J.2, kolom c, van de lijst, dan wel met het aantal decimalen genoemd in de bij deze beschikking
      behorende [Bijlage III][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003122
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003122
  - number: '8.6'
    text: Bij de in de vorige leden bedoelde getallen zijn toevoegingen zoals ‘circa’ en ‘plus minus’ (±) niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel8
  - number: '8.7'
    text: De verplichte of toegestane vermelding van gehalten of getallen geldt als een door de verkoper gegeven garantie.
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel8
  - number: '9'
    text: |-
      Voor de toepassing van deze beschikking worden op de garanties, welke ingevolge deze beschikking moeten of mogen
      worden gegeven als spelingen toegestaan, de spelingen welke zijn vermeld in [bijlage II][ref1], met dien verstande
      dat:


      [ref1]: https://wetten.overheid.nl/BWBR0003122
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003122
  - number: 9.a
    text: |-
      het in de meststof aanwezige gehalte niet lager mag zijn dan de volgens deze beschikking of de lijst vereiste
      minimum gehalten of getallen, onderscheidenlijk niet hoger mag zijn dan de vereiste maximum gehalten of getallen;
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel9
  - number: 9.b
    text: |-
      het tekort op een gegarandeerd gehalte aan een waardegevend bestanddeel niet kan worden gecompenseerd door een
      teveel op een gegarandeerd gehalte aan een ander waardegevend bestanddeel noch door een tekort op een gegarandeerd
      gehalte aan een waardeverminderend bestanddeel; een teveel op een gegarandeerd gehalte aan een waardeverminderend
      bestanddeel niet kan worden gecompenseerd door een tekort op een gehalte aan een ander waardeverminderend
      bestanddeel noch door een teveel op een gegarandeerd gehalte aan een waardegevend bestanddeel.
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel9
  - number: '10.1'
    text: |-
      Het is, behoudens het in de volgende leden bepaalde, toegestaan op de verpakking, het etiket, de label of het
      begeleidend document van meststoffen, vermeld in Hoofdstuk I van de lijst, bij de type-aanduiding de vermelding
      EG-MESTSTOF in hoofddrukletters te plaatsen, indien de meststoffen voldoen aan de in deze beschikking en de lijst
      gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel10
  - number: '10.2'
    text: |-
      Het in het eerste lid bepaalde geldt niet voor wat betreft onderstaande, in Hoofdstuk I van in de lijst vermelde
      meststoffen:
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel10
  - number: 10.2.a
    text: |-
      van de in onderdeel A genoemde stikstofmeststoffen: beendermeel, diermeel, galaliet in poedervorm, hoornmeel,
      ledermeel, verenmeel, vismeel, wolafval of bijprodukt van de bewerking van vellen, bloedmeel voor meststof,
      cacaodoppen, moutscheuten, meel van koeken van oliehoudende zaden, waaruit olie gewonnen is, salmiak, vloeibare
      ammoniak, gemengde stikstofmeststof, en ureum met zwavel omhuld;
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel10
  - number: 10.2.b
    text: 'van de in onderdeel B genoemde fosfaatmeststoffen: ontlijmd beendermeel voor meststof;'
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel10
  - number: 10.2.c
    text: 'van de in onderdeel C genoemde kalimeststoffen: ruw kalinatriumzout;'
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel10
  - number: 10.2.d
    text: |-
      de in onderdeel D genoemde meststoffen met twee of drie van de waardegevende bestanddelen stikstof,
      fosforzuuranhydride en kaliumoxyde;
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel10
  - number: 10.2.e
    text: de in onderdeel F genoemde samengestelde meststoffen;
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel10
  - number: 10.2.f
    text: 'van de in onderdeel J genoemde spoorelementmeststoffen: koperslakkenbloem.'
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel10
  - number: '10.3'
    text: |-
      Het in het eerste lid bepaalde geldt voorts niet indien de aanduiding, bedoeld in [artikel 6, onder b][ref1], wordt
      vermeld of een garantie, als bedoeld in [artikel 7, onder b en c, de subonderdelen 1, 2, 4, 5, 6 en 7][ref2] wordt
      gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003122#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003122#Artikel7
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003122
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0003122
        artikel: '7'
  - number: '11.1'
    text: |-
      De aanduidingen en vermeldingen, als bedoeld in de [artikelen 4][ref1], [5][ref2],
      [6 onder a, b, c, d, e, f en g, 7 en 10, eerste lid][ref3], moeten duidelijk gescheiden zijn van de aanduidingen en
      vermeldingen, als bedoeld in [artikel 6, onder h][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003122#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003122#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0003122#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0003122#Artikel6
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003122
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0003122
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0003122
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0003122
        artikel: '6'
  - number: '11.2'
    text: |-
      De in het voorgaande lid bedoelde aanduidingen en vermeldingen moeten voorts gescheiden zijn van andere
      aanduidingen en vermeldingen, die op de verpakking voorkomen.
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel11
  - number: '12.1'
    text: |-
      Indien een meststof is verpakt moet de verpakking op een zodanige wijze zijn gesloten, dat bij het openen de
      sluiting, de verzegeling of de verpakking zelf onherstelbaar wordt beschadigd.
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel12
  - number: '12.2'
    text: Klepzakken worden geacht gesloten te zijn op de in het vorige lid bedoelde wijze.
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel12
  - number: '12.3'
    text: |-
      Indien de sluiting geschiedt door middel van een zegel of plombeerlood moet hierop de naam, de handelsnaam of het
      merk van de persoon, bedoeld in [artikel 4, onder 6][ref1], worden aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003122#Artikel4
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003122
        artikel: '4'
  - number: '12.4'
    text: |-
      Indien gebruik wordt gemaakt van een aan de verpakking bevestigde label moet deze deel uitmaken van de sluiting
      of verzegeling.
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel12
  - number: 12a
    text: |-
      Het vervoeren en verkopen van meststoffen ten aanzien waarvan niet voldaan is aan het bij deze beschikking bepaalde
      is tot 1 juli 1979 nog toegestaan, voor zover ten aanzien van die meststoffen is voldaan aan de bepalingen gesteld
      bij of krachtens het Meststoffenbesluit 1951, zoals deze luidden op 17 december 1977.
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel12a
  - number: '13'
    text: De Meststoffenbeschikking 1970 (Stcrt. 78) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel13
  - number: '14.1'
    text: 'Deze beschikking kan worden aangehaald als: ‘Meststoffenbeschikking 1977’.'
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel14
  - number: '14.2'
    text: Zij treedt in werking met ingang van 18 december 1977.
    url: https://wetten.overheid.nl/BWBR0003122/2007-03-03#Artikel14
