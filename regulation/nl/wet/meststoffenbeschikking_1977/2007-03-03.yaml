  - number: '7'
    text: |-
      Toegestaan is vermelding van de volgende garanties uitgedrukt op de hierna of in kolom d van de lijst aangegeven
      wijze:

      a. *ten aanzien van alle in de lijst genoemde meststoffen:*

        - de in kolom d van de lijst onder het opschrift ‘Facultatief’ voor de meststof aangegeven garanties;

      b. *ten aanzien van alle in de lijst genoemde meststoffen:*

        - een garantie voor het gehalte aan vocht;

      c. *ten aanzien van de in hoofdstuk I van de lijst genoemde meststoffen:*

      1. een garantie voor het gehalte aan calcium (Ca), oplosbaar in mineraalzuur, mits dit gehalte ten minste 4%
      bedraagt en daarbij wordt vermeld het woord ‘basenequivalent’ met het daarvoor gegarandeerd getal gevolgd door de
      aanduiding ‘zuurwerkend’, ‘basischwerkend’ of ‘neutraalwerkend’ al naar gelang een van deze aanduidingen volgens
      [artikel 1, tweede lid, onder i][ref1], van toepassing is;

      2. een garantie voor het gehalte aan calcium, magnesium of calcium en magnesium, in zuurbindende vorm,
      uitgedrukt als calciumcarbonaat, mits deze bestanddelen aanwezig zijn in één of meer van de vormen calciumoxyde,
      calciumhydroxyde, calciumcarbonaat en/of analoge magnesiumverbindingen, dit gehalte ten minste 10% bedraagt
      en daarbij wordt vermeld het woord ‘basenequivalent’ met het daarvoor gegarandeerde getal gevolgd door de
      aanduiding ‘zuurwerkend’, ‘basischwerkend’ of ‘neutraalwerkend’, al naar gelang een van deze aanduidingen volgens
      [artikel 1, tweede lid, onder i][ref2], van toepassing is;

      3. een garantie voor het gehalte aan magnesiumoxyde (MgO) en/of naltriumoxyde (Na/O) en/of zwavelzuuranhydride (SO)
      mits de gehalte voor magnesiumoxyde tenminste 2%, voor natriumoxyde ten minste 3% en voor zavelzuuranhydride ten
      minste 5% bedragen. Deze gehalten dienen elk op een van de volgende wijzen te worden aangegeven:

        - totaal gehalte;
        - indien volledig oplosbaar in water, alleen het in water oplosbare gehalte;
        - totaal gehalte en het gehalte oplosbaar in water, wanneer ten minste een kwart van het totaal gehalte oplosbaar
      is in water.

      4. uitgezonderd ten aanzien van thomasmeel en andere meststoffen op basis van thomasmeel:

      een garantie voor het gewichtspercentage aan korrels met een doorsnede tussen 1 en 3 mm, tussen 2 en 4 mm of tussen
      3 en 5 mm, mits dit percentage ten minste 80 bedraagt;

      ten aanzien van thomasmeel en andere meststoffen op basis van thomasmeel:

      een garantie voor het gewichtspercentage aan korrels met een doorsnee tussen 0,3 en 3 mm, mits dit percentage ten
      minste 80 bedraagt.

      d. ten aanzien van de in hoofdstuk I, van de lijst bedoelde meststoffen, waarbij de spoorelementen gebruikelijke
      bestanddelen zijn van de grondstoffen die voor toevoeging van de hoofdbestanddelen en van de secundaire
      bestanddelen worden gebruikt:

      1. een garantie voor het gehalte aan borium (B), kobalt (Co), koper (Cu), ijzer (Fe), mangaan (Mn), molybdeen (Mo)
      en/of zink (Zn), mits voldaan wordt aan het gestelde in [artikel 4, onderdeel 9][ref3].

      Indien een garantie wordt gegeven dienen de gehalten van de respectievelijke aanwezige spoorelementen op één van de
      volgende wijzen te worden aangegeven:

        - totaal gehalte en het gehalte oplosbaar in water, wanneer ten minste de helft van het totaal gehalte oplosbaar is
      in water;
        - indien volledig oplosbaar in water, alleen het in water oplosbare gehalte;

      2. Het gehalte aan spoorelementen moet worden vermeld met de volledige benaming en het chemisch symbool.

      e. ten aanzien van de organische bodemverbeterende middelen genoemd in hoofdstuk III van de lijst:

      1. een garantie voor het gehalte aan stikstof totaal (N) aanwezig in één of meer van de volgende vormen, te weten:
      ammoniumstikstof, nitraatstikstof, ureumstikstof, cyaanamidestikstof en/of organisch gebonden stikstof mits dit
      gehalte ten minste 0,5% bedraagt; daarbij moet tevens een garantie worden gegeven voor het gehalte van elk der
      bindingsvormen waarvan ten minste 0,5% aanwezig is;

      2. een garantie voor het gehalte aan fosforzuuranhydride (PO) oplosbaar in water, in water en neutraal
      ammoniumcitraat, in neutraal ammoniumcitraat, in 2% citroenzuur of in mineraalzuur, met aanduiding van de aard van
      de oplosbaarheid, mits dit gehalte ten minste 0,5% bedraagt;

      3. een garantie voor het gehalte aan kaliumoxyde (KO), oplosbaar in water, mits dit gehalte ten minste 0,5%
      bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0003122#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003122#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0003122#Artikel4
