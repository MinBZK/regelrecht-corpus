---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.5.4/schema/v0.5.4/schema.json
$id: wet_gemeentelijke_schuldhulpverlening
regulatory_layer: WET
publication_date: '2026-02-03'
valid_from: '2026-07-01'
bwb_id: BWBR0031331
url: https://wetten.overheid.nl/BWBR0031331/2026-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is gemeenten een wettelijke taak te geven met betrekking
    tot schuldhulpverlening;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0031331/2026-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *cliënt:* persoon aan wie op grond van deze wet schuldhulpverlening wordt gegeven;
        - *college:* college van burgemeester en wethouders;
        - *inwoner:* degene die als ingezetene in de basisregistratie personen is ingeschreven;
        - *Onze Minister:* Onze Minister van Sociale Zaken en Werkgelegenheid;
        - *schuldhulpverlening:* het ondersteunen bij het vinden van een adequate oplossing gericht op de aflossing van
      schulden indien redelijkerwijs is te voorzien dat een natuurlijke persoon niet zal kunnen voortgaan met het betalen
      van zijn schulden of indien hij in de toestand verkeert dat hij heeft opgehouden te betalen, alsmede de nazorg.
    url: https://wetten.overheid.nl/BWBR0031331/2026-07-01#Artikel1
  - number: '2'
    text: |-
      1 De gemeenteraad stelt een plan vast dat richting geeft aan de integrale schuldhulpverlening aan de inwoners van
      zijn gemeente.

      2 De gemeenteraad stelt het plan telkens voor een periode van ten hoogste vier jaren vast. Het plan kan tussentijds
      gewijzigd worden.

      3 Het plan bevat de hoofdzaken van het door de gemeente te voeren beleid betreffende integrale schuldhulpverlening
      en het voorkomen dat inwoners schulden aangaan die ze niet kunnen betalen.

      4 In het plan wordt in ieder geval aangegeven:

      a. welke resultaten de gemeente in de door het plan bestreken periode wenst te behalen;

      b. welke maatregelen de gemeenteraad en het college nemen om de kwaliteit te borgen van de wijze waarop de
      integrale schuldhulpverlening wordt uitgevoerd;

      c. hoe de samenwerking met schuldeisers, waaronder verhuurders van tot bewoning bestemde onroerende zaken,
      zorgverzekeraars, water- en energiebedrijven, wordt vormgegeven;

      d. het maximaal aantal weken dat de gemeente nastreeft met betrekking tot de in [artikel 4, eerste lid][ref1],
      genoemde periode, en

      e. hoe schuldhulpverlening aan gezinnen met inwonende minderjarige kinderen wordt vormgegeven.

      5 In het plan kan de gemeenteraad aangeven onder welke voorwaarden het college de cliënt verplicht te beschikken
      over een basisbetaalrekening als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031331#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel11
    url: https://wetten.overheid.nl/BWBR0031331/2026-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0031331
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: 1:1
    machine_readable:
      execution:
        parameters:
          - name: plan_startdatum
            type: date
            required: true
            description: Datum waarop het plan door de gemeenteraad is vastgesteld (art. 2 lid 2)
        output:
          - name: maximale_einddatum_plan
            type: date
            description: Uiterste einddatum van het schuldhulpverleningsplan (ten hoogste vier jaren na startdatum, art. 2 lid 2)
        actions:
          - output: maximale_einddatum_plan
            value:
              operation: DATE_ADD
              date: $plan_startdatum
              years: 4
  - number: '3'
    text: |-
      1 Het college heeft tot taak en voert daarbij het plan, bedoeld in [artikel 2, eerste lid][ref1], uit, om:

      a. schuldhulpverlening aan de inwoners van zijn gemeente te geven;

      b. een inwoner een aanbod te doen tot een eerste gesprek als bedoeld in [artikel 4, eerste lid][ref2], als een bij
      of krachtens algemene maatregel van bestuur te bepalen signaal van schuldeisers is ontvangen door het college over
      betalingsachterstanden, dat een goede indicatie vormt voor meer schulden.

      2 Het college kan schuldhulpverlening in ieder geval weigeren in geval een inwoner al eerder gebruik heeft gemaakt
      van schuldhulpverlening.

      3 Het college kan schuldhulpverlening in ieder geval weigeren in geval een inwoner fraude heeft gepleegd die
      financiële benadeling van een bestuursorgaan tot gevolg heeft en die inwoner in verband daarmee onherroepelijk
      strafrechtelijk is veroordeeld of een onherroepelijke bestuurlijke sanctie, die beoogt leed toe te voegen, is
      opgelegd.

      4 Een vreemdeling kan voor het verlenen van schuldhulpverlening slechts in aanmerking
      komen indien hij een ingezetene is die rechtmatig in Nederland verblijf houdt in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref3].

      5 In bijzondere omstandigheden kan het college, zo nodig in overleg met het college van een andere gemeente, ook
      schuldhulpverlening aan een persoon geven als die geen inwoner is. Voor de toepassing van deze wet wordt deze
      persoon gelijkgesteld met een inwoner.


      [ref1]: https://wetten.overheid.nl/BWBR0031331#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0031331#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0031331/2026-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0031331
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0031331
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '8'
    machine_readable:
      execution:
        parameters:
          - name: eerder_gebruik_schuldhulpverlening
            type: boolean
            required: true
            description: Of de inwoner eerder gebruik heeft gemaakt van schuldhulpverlening (art. 3 lid 2)
          - name: fraude_met_financieel_nadeel
            type: boolean
            required: true
            description: Of de inwoner fraude heeft gepleegd met financiële benadeling van een bestuursorgaan (art. 3 lid 3)
          - name: onherroepelijke_sanctie_opgelegd
            type: boolean
            required: true
            description: Of een onherroepelijke strafrechtelijke veroordeling of bestuurlijke sanctie is opgelegd i.v.m. de fraude (art. 3 lid 3)
          - name: is_vreemdeling
            type: boolean
            required: true
            description: Of de betrokkene een vreemdeling is
          - name: rechtmatig_verblijf_art8_a_t_m_e_en_l
            type: boolean
            required: true
            description: Of de vreemdeling rechtmatig in Nederland verblijft op grond van art. 8 onderdelen a t/m e en l Vreemdelingenwet 2000
        output:
          - name: weigeringsgrond_eerder_gebruik
            type: boolean
            description: Weigeringsgrond aanwezig op grond van eerder gebruik schuldhulpverlening (art. 3 lid 2)
          - name: weigeringsgrond_fraude
            type: boolean
            description: Weigeringsgrond aanwezig op grond van fraude met onherroepelijke veroordeling of sanctie (art. 3 lid 3)
          - name: vreemdeling_in_aanmerking
            type: boolean
            description: Of een vreemdeling in aanmerking kan komen voor schuldhulpverlening op grond van verblijfsstatus (art. 3 lid 4)
        actions:
          - output: weigeringsgrond_eerder_gebruik
            value:
              operation: EQUALS
              subject: $eerder_gebruik_schuldhulpverlening
              value: true
          - output: weigeringsgrond_fraude
            value:
              operation: AND
              conditions:
                - operation: EQUALS
                  subject: $fraude_met_financieel_nadeel
                  value: true
                - operation: EQUALS
                  subject: $onherroepelijke_sanctie_opgelegd
                  value: true
          - output: vreemdeling_in_aanmerking
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $is_vreemdeling
                    value: true
                  then:
                    operation: EQUALS
                    subject: $rechtmatig_verblijf_art8_a_t_m_e_en_l
                    value: true
              default: true
  - number: 3a
    text: |-
      Het college kan de uitvoering van deze wet, behoudens de vaststelling van de rechten en plichten van de inwoner
      en de daarvoor noodzakelijke beoordeling van zijn omstandigheden, door derden laten verrichten. Het college
      kan bedoelde vaststelling en beoordeling mandateren aan een organisatie of instelling, die zich blijkens haar
      doelstelling of werkzaamheden richt op schuldhulpverlening.
    url: https://wetten.overheid.nl/BWBR0031331/2026-07-01#Artikel3a
  - number: '4'
    text: |-
      1 Het eerste gesprek waarin de schriftelijke of mondelinge hulpvraag wordt vastgesteld, vindt plaats binnen vier
      weken nadat:

      a. een inwoner zich tot het college wendt voor schuldhulpverlening; of

      b. het college een signaal als bedoeld in [artikel 3, eerste lid, onderdeel b][ref1], heeft ontvangen, in het geval
      de inwoner het aanbod heeft geaccepteerd.

      2 Indien er sprake is van een bedreigende situatie vindt binnen drie werkdagen het eerste gesprek plaats
      waarin de hulpvraag wordt vastgesteld. Onder bedreigende situatie wordt verstaan gedwongen woningontruiming,
      beëindiging van de levering van gas, elektriciteit, stadsverwarming of water of opzegging dan wel ontbinding van
      de zorgverzekering.

      3 Het college geeft de inwoner inzicht in het aantal weken tussen het eerste gesprek waarin de hulpvraag wordt
      vastgesteld en het bereiken van het resultaat.


      [ref1]: https://wetten.overheid.nl/BWBR0031331#Artikel3
    url: https://wetten.overheid.nl/BWBR0031331/2026-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0031331
        artikel: '3'
    machine_readable:
      untranslatables:
        - construct: "binnen drie werkdagen"
          reason: "Werkdagen (working days) calculation requires excluding weekends and public holidays, which is not supported as an engine operation"
          suggestion: "Add WORKDAY_ADD operation to engine, or provide a public holiday calendar data source"
          legal_text_excerpt: "Indien er sprake is van een bedreigende situatie vindt binnen drie werkdagen het eerste gesprek plaats"
          accepted: false
      execution:
        parameters:
          - name: aanmeld_datum
            type: date
            required: true
            description: Datum waarop de inwoner zich tot het college wendt voor schuldhulpverlening, of datum waarop inwoner het signaalaanbod accepteert (art. 4 lid 1)
          - name: gedwongen_woningontruiming
            type: boolean
            required: true
            description: Of er dreiging is van gedwongen woningontruiming (art. 4 lid 2)
          - name: beeindiging_levering_energie_of_water
            type: boolean
            required: true
            description: Of er sprake is van beëindiging van de levering van gas, elektriciteit, stadsverwarming of water (art. 4 lid 2)
          - name: opzegging_of_ontbinding_zorgverzekering
            type: boolean
            required: true
            description: Of er sprake is van opzegging dan wel ontbinding van de zorgverzekering (art. 4 lid 2)
        output:
          - name: uiterste_datum_eerste_gesprek
            type: date
            description: Uiterste datum voor het eerste gesprek bij normale procedure (4 weken na aanmeld_datum, art. 4 lid 1)
          - name: is_bedreigende_situatie
            type: boolean
            description: Of er sprake is van een bedreigende situatie in de zin van art. 4 lid 2 (activeert verkorte termijn van drie werkdagen)
        actions:
          - output: uiterste_datum_eerste_gesprek
            value:
              operation: DATE_ADD
              date: $aanmeld_datum
              weeks: 4
          - output: is_bedreigende_situatie
            value:
              operation: OR
              conditions:
                - operation: EQUALS
                  subject: $gedwongen_woningontruiming
                  value: true
                - operation: EQUALS
                  subject: $beeindiging_levering_energie_of_water
                  value: true
                - operation: EQUALS
                  subject: $opzegging_of_ontbinding_zorgverzekering
                  value: true
  - number: 4a
    text: |-
      1 Na het eerste gesprek, bedoeld in [artikel 4, eerste lid][ref1], wordt een beschikking afgegeven, inhoudende:

      a. het plan van aanpak; of

      b. een weigering tot schuldhulpverlening.

      2 In afwijking van het eerste lid kan een beschikking achterwege blijven als in het eerste gesprek door de inwoner
      wordt aangegeven af te zien van verdere schuldhulpverlening.

      3 De beschikking, bedoeld in het eerste lid, wordt gegeven binnen een bij gemeentelijke verordening te bepalen
      termijn. Deze termijn bedraagt maximaal acht weken.

      4 Aan een beschikking als bedoeld in het eerste lid, onderdeel a, kunnen voorwaarden worden verbonden.

      5 In het plan van aanpak wordt ten minste de beslagvrije voet, bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref2], in acht genomen.

      6 Als er redenen zijn om de schuldhulpverlening tussentijds te beëindigen, wordt een beschikking tot beëindiging
      van de schuldhulpverlening afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0031331#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
    url: https://wetten.overheid.nl/BWBR0031331/2026-07-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0031331
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475c
    machine_readable:
      open_terms:
        - id: beslistermijn_weken
          type: number
          required: true
          delegated_to: gemeenteraad
          delegation_type: GEMEENTELIJKE_VERORDENING
          legal_basis: artikel 4a, derde lid, Wet gemeentelijke schuldhulpverlening
      execution:
        produces:
          legal_character: BESCHIKKING
        parameters:
          - name: inwoner_ziet_af_van_hulp
            type: boolean
            required: true
            description: Of de inwoner in het eerste gesprek heeft aangegeven af te zien van verdere schuldhulpverlening (art. 4a lid 2)
        output:
          - name: beschikking_vereist
            type: boolean
            description: Of een beschikking afgegeven moet worden na het eerste gesprek (art. 4a lid 1 jo. lid 2)
          - name: maximale_beslistermijn_weken
            type: number
            description: De door de gemeentelijke verordening bepaalde beslistermijn in weken (max 8 weken, art. 4a lid 3)
          - name: beslistermijn_toegestaan
            type: boolean
            description: Of de gemeentelijk bepaalde beslistermijn de wettelijke maximumtermijn van 8 weken niet overschrijdt (art. 4a lid 3)
        actions:
          - output: beschikking_vereist
            value:
              operation: NOT
              value: $inwoner_ziet_af_van_hulp
          - output: maximale_beslistermijn_weken
            value: $beslistermijn_weken
          - output: beslistermijn_toegestaan
            value:
              operation: LESS_THAN_OR_EQUAL
              subject: $beslistermijn_weken
              value: 8
  - number: '5'
    text: |-
      1 Het college kan de rechtbank verzoeken een afkoelingsperiode af te kondigen, waarin elke bevoegdheid van de
      schuldeiser tot verhaal op de goederen van de cliënt en tot opeising van goederen die zich in de macht van de
      cliënt bevinden niet kan worden uitgeoefend, voor een periode van maximaal zes maanden.

      2 Een afkoelingsperiode als bedoeld in het eerste lid wordt slechts afgekondigd indien deze periode noodzakelijk
      is in het kader van schuldhulpverlening en indien is voldaan aan bij algemene maatregel van bestuur gestelde nadere
      voorwaarden.

      3 Bij algemene maatregel van bestuur kunnen verplichtingen worden aangewezen die door de cliënt tijdens de
      afkoelingsperiode, bedoeld in het eerste lid, worden nagekomen.
    url: https://wetten.overheid.nl/BWBR0031331/2026-07-01#Artikel5
    machine_readable:
      definitions:
        MAXIMALE_AFKOELINGSPERIODE_MAANDEN:
          value: 6
          description: Maximale duur van de afkoelingsperiode in maanden (art. 5 lid 1)
      execution:
        parameters:
          - name: startdatum_afkoelingsperiode
            type: date
            required: true
            description: Datum waarop de afkoelingsperiode ingaat
        output:
          - name: maximale_einddatum_afkoelingsperiode
            type: date
            description: Uiterste einddatum van de afkoelingsperiode (maximaal 6 maanden na startdatum, art. 5 lid 1)
        actions:
          - output: maximale_einddatum_afkoelingsperiode
            value:
              operation: DATE_ADD
              date: $startdatum_afkoelingsperiode
              months: 6
  - number: '6'
    text: |-
      De cliënt doet aan het college op verzoek of onverwijld uit eigen beweging mededeling van alle feiten en
      omstandigheden waarvan hem redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op de op hem van
      toepassing zijnde schuldhulpverlening of voor de uitvoering van deze wet, voor zover gegevens over deze feiten en
      omstandigheden niet door het college kunnen worden verkregen.
    url: https://wetten.overheid.nl/BWBR0031331/2026-07-01#Artikel6
  - number: '7'
    text: |-
      1 De cliënt is verplicht aan het college desgevraagd de medewerking te verlenen die redelijkerwijs nodig is voor de
      uitvoering van deze wet.

      2 Het college stelt bij de uitvoering van deze wet de identiteit van de cliënt vast aan de hand van een document
      als bedoeld in [artikel 1, eerste lid, onder 1° tot en met 4°, van de Wet op de identificatieplicht][ref1].

      3 Een ieder is verplicht aan het college desgevraagd een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref2] terstond ter inzage te verstrekken, voor zover dit
      redelijkerwijs nodig is voor de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0031331/2026-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '8'
    text: |-
      1 Bestuursorganen en andere bij algemene maatregel van bestuur aangewezen personen en instanties verstrekken onder
      te bepalen voorwaarden aan het college de gegevens en inlichtingen waarvan kennisneming van belang kan zijn voor de
      uitvoering van deze wet.

      2 Het college verstrekt onder bij algemene maatregel van bestuur te bepalen voorwaarden aan bestuursorganen en aan
      bij algemene maatregel van bestuur aan te wijzen instanties gegevens voortvloeiende uit de uitvoering van deze wet,
      die deze bestuursorganen en instanties behoeven in verband met uitoefening van hun taak en dienstverlening.

      3 Het vragen en het verstrekken van gegevens door het college aan en door de in het eerste en tweede lid bedoelde
      bestuursorganen en instanties kan geschieden door tussenkomst van het Bureau Informatiediensten Nederland, bedoeld
      in [artikel 63 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].

      4 Bij algemene maatregel van bestuur kunnen regels worden gesteld over de wijze van gegevensuitwisseling en de
      kosten, die daarbij in rekening kunnen worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel63
    url: https://wetten.overheid.nl/BWBR0031331/2026-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '63'
  - number: 8a
    text: |-
      Het college is bevoegd tot het verwerken van persoonsgegevens, waaronder persoonsgegevens over
      gezondheid als bedoeld in artikel 4, onderdeel 15, van de Algemene verordening gegevensbescherming en
      persoonsgegevens van strafrechtelijke aard voor zover noodzakelijk voor de uitvoering van de taak, bedoeld in
      [artikel 3, eerste lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031331#Artikel3
    url: https://wetten.overheid.nl/BWBR0031331/2026-07-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0031331
        artikel: '3'
  - number: 8b
    text: |-
      1 Het college is bevoegd tot het verwerken van persoonsgegevens van de inwoner voor zover die gegevens noodzakelijk
      zijn voor de uitvoering van de taak, bedoeld in [artikel 3, eerste lid, onderdeel b][ref1].

      2 Onder noodzakelijke gegevens wordt verstaan de gegevens uit de basisregistratie personen en gegevens die
      noodzakelijk zijn om de signalen, bedoeld in de [artikelen 3, eerste lid, onderdeel b][ref2], of [10][ref3], te
      verwerken.


      [ref1]: https://wetten.overheid.nl/BWBR0031331#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0031331#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0031331#Artikel10
    url: https://wetten.overheid.nl/BWBR0031331/2026-07-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0031331
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0031331
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0031331
        artikel: '10'
  - number: 8c
    text: |-
      Het college gebruikt het burgerservicenummer, bedoeld in
      [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref1] van een inwoner bij het
      verwerken van persoonsgegevens als bedoeld in de [artikelen 8a][ref2] en [8b][ref3] met het doel te waarborgen dat
      de in het kader van de uitvoering van deze wet te verwerken persoonsgegevens op die inwoner betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0031331#Artikel8a
      [ref3]: https://wetten.overheid.nl/BWBR0031331#Artikel8b
    url: https://wetten.overheid.nl/BWBR0031331/2026-07-01#Artikel8c
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0031331
        artikel: 8a
      - id: ref3
        bwb_id: BWBR0031331
        artikel: 8b
  - number: 8d
    text: |-
      Het college is bevoegd persoonsgegevens van de inwoner, die het college heeft verkregen voor de
      uitvoering van de taken die bij of krachtens de [Jeugdwet][ref1], de [Participatiewet][ref2] of de
      [Wet maatschappelijke ondersteuning 2015][ref3] aan het college zijn opgedragen, ook te verwerken als dat
      noodzakelijk is voor de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0034925
      [ref2]: https://wetten.overheid.nl/BWBR0015703
      [ref3]: https://wetten.overheid.nl/BWBR0035362
    url: https://wetten.overheid.nl/BWBR0031331/2026-07-01#Artikel8d
    references:
      - id: ref1
        bwb_id: BWBR0034925
      - id: ref2
        bwb_id: BWBR0015703
      - id: ref3
        bwb_id: BWBR0035362
  - number: '9'
    text: |-
      1 Het college verstrekt Onze Minister, kosteloos, de gegevens en inlichtingen die hij voor de statistiek,
      informatievoorziening en beleidsvorming met betrekking tot deze wet nodig heeft.

      2 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de informatie die het college verstrekt
      en de wijze waarop het college de gegevens verzamelt en verstrekt, waarbij kan worden bepaald dat categorieën van
      gemeenten bepaalde gegevens en inlichtingen niet hoeven te verzamelen en te verstrekken.
    url: https://wetten.overheid.nl/BWBR0031331/2026-07-01#Artikel9
  - number: '10'
    text: |-
      1 In afwijking van [artikel 3, eerste lid, onderdeel b][ref1], kan bij ministeriële regeling voor de duur van
      maximaal vijf jaren een signaal van een schuldeiser over betalingsachterstanden, die een betere indicatie vormen
      voor meer schulden, worden aangewezen, waarna bij ontvangst daarvan door bij die regeling aangewezen gemeenten, het
      college uit eigen beweging een eerste gesprek aanbiedt als bedoeld in [artikel 4, eerste lid][ref2].

      2 Als toepassing is gegeven aan het eerste lid kunnen in afwijking van [artikel 8, eerste lid][ref3], bij
      ministeriële regeling personen en instanties worden aangewezen die een signaal over betalingsachterstanden aan
      het college verstrekken en zijn artikel 8, tweede tot en met vierde lid van overeenkomstige toepassing met dien
      verstande dat waar « bij algemene maatregel van bestuur» staat gelezen wordt «bij ministeriële regeling».


      [ref1]: https://wetten.overheid.nl/BWBR0031331#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0031331#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0031331#Artikel8
    url: https://wetten.overheid.nl/BWBR0031331/2026-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0031331
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0031331
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0031331
        artikel: '8'
    machine_readable:
      definitions:
        MAXIMALE_DUUR_AANWIJZING_JAREN:
          value: 5
          description: Maximale duur van de aanwijzing van experimentele signalen in jaren (art. 10 lid 1)
      execution:
        parameters:
          - name: aanwijzing_startdatum
            type: date
            required: true
            description: Datum waarop de ministeriële regeling betreffende de aanwijzing van het experimentele signaal in werking treedt (art. 10 lid 1)
        output:
          - name: maximale_einddatum_aanwijzing
            type: date
            description: Uiterste einddatum van de experimentele aanwijzing van het signaal (maximaal vijf jaren na startdatum, art. 10 lid 1)
        actions:
          - output: maximale_einddatum_aanwijzing
            value:
              operation: DATE_ADD
              date: $aanwijzing_startdatum
              years: 5
  - number: '12'
    text: |-
      Onze Minister zendt binnen vier jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0031331/2026-07-01#Artikel12
  - number: '13'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0031331/2026-07-01#Artikel13
  - number: '14'
    text: 'Deze wet wordt aangehaald als: Wet gemeentelijke schuldhulpverlening.'
    url: https://wetten.overheid.nl/BWBR0031331/2026-07-01#Artikel14
