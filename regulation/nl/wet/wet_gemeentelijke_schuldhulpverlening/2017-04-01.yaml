---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_gemeentelijke_schuldhulpverlening
regulatory_layer: WET
publication_date: '2026-02-03'
valid_from: '2017-04-01'
bwb_id: BWBR0031331
url: https://wetten.overheid.nl/BWBR0031331/2017-04-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is gemeenten een wettelijke taak te geven met betrekking
    tot schuldhulpverlening;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0031331/2017-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *college:* college van burgemeester en
      wethouders;
        - *inwoner:* degene die als ingezetene in de basisregistratie personen is ingeschreven;
        - *Onze Minister:* Onze Minister van Sociale Zaken en Werkgelegenheid;
        - *schuldhulpverlening:* het ondersteunen bij het vinden van een adequate oplossing gericht op de aflossing van
      schulden indien redelijkerwijs is te voorzien dat een natuurlijke persoon niet zal kunnen voortgaan met het betalen
      van zijn schulden of indien hij in de toestand verkeert dat hij heeft opgehouden te betalen, alsmede de nazorg;
        - *verzoeker:* persoon die zich tot het college heeft gewend voor schuldhulpverlening.
    url: https://wetten.overheid.nl/BWBR0031331/2017-04-01#Artikel1
  - number: '2.1'
    text: |-
      De gemeenteraad stelt een plan vast dat richting geeft aan de integrale schuldhulpverlening aan de inwoners van
      zijn gemeente.
    url: https://wetten.overheid.nl/BWBR0031331/2017-04-01#Artikel2
  - number: '2.2'
    text: |-
      De gemeenteraad stelt het plan telkens voor een periode van ten hoogste vier jaren vast. Het plan kan tussentijds
      gewijzigd worden.
    url: https://wetten.overheid.nl/BWBR0031331/2017-04-01#Artikel2
  - number: '2.3'
    text: |-
      Het plan bevat de hoofdzaken van het door de gemeente te voeren beleid betreffende integrale schuldhulpverlening en
      het voorkomen dat personen schulden aangaan die ze niet kunnen betalen.
    url: https://wetten.overheid.nl/BWBR0031331/2017-04-01#Artikel2
  - number: '2.4'
    text: 'In het plan wordt in ieder geval aangegeven:'
    url: https://wetten.overheid.nl/BWBR0031331/2017-04-01#Artikel2
  - number: 2.4.a
    text: welke resultaten de gemeente in de door het plan bestreken periode wenst te behalen;
    url: https://wetten.overheid.nl/BWBR0031331/2017-04-01#Artikel2
  - number: 2.4.b
    text: |-
      welke maatregelen de gemeenteraad en het college nemen om de kwaliteit te borgen van de wijze waarop de integrale
      schuldhulpverlening wordt uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0031331/2017-04-01#Artikel2
  - number: 2.4.c
    text: |-
      het maximaal aantal weken dat de gemeente nastreeft met betrekking tot de in [artikel 4, eerste lid][ref1],
      genoemde periode, en


      [ref1]: https://wetten.overheid.nl/BWBR0031331#Artikel4
    url: https://wetten.overheid.nl/BWBR0031331/2017-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0031331
        artikel: '4'
  - number: 2.4.d
    text: hoe schuldhulpverlening aan gezinnen met inwonende minderjarige kinderen wordt vormgegeven.
    url: https://wetten.overheid.nl/BWBR0031331/2017-04-01#Artikel2
  - number: '2.5'
    text: |-
      In het plan kan de gemeenteraad aangeven onder welke voorwaarden het college de verzoeker verplicht te beschikken
      over een basisbetaalrekening als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0031331/2017-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '3.1'
    text: |-
      Het college is verantwoordelijk voor de schuldhulpverlening aan de inwoners van zijn gemeente en voert daarbij het
      plan, bedoeld in [artikel 2, eerste lid][ref1], uit.


      [ref1]: https://wetten.overheid.nl/BWBR0031331#Artikel2
    url: https://wetten.overheid.nl/BWBR0031331/2017-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0031331
        artikel: '2'
  - number: '3.2'
    text: |-
      Het college kan schuldhulpverlening in ieder geval weigeren in geval een persoon al eerder gebruik heeft gemaakt
      van schuldhulpverlening.
    url: https://wetten.overheid.nl/BWBR0031331/2017-04-01#Artikel3
  - number: '3.3'
    text: |-
      Het college kan schuldhulpverlening in ieder geval weigeren in geval een persoon fraude heeft gepleegd die
      financiële benadeling van een bestuursorgaan tot gevolg heeft en die persoon in verband daarmee onherroepelijk
      strafrechtelijk is veroordeeld of een onherroepelijke bestuurlijke sanctie, die beoogt leed toe te voegen, is
      opgelegd.
    url: https://wetten.overheid.nl/BWBR0031331/2017-04-01#Artikel3
  - number: '3.4'
    text: |-
      Een vreemdeling kan voor het verlenen van schuldhulpverlening slechts in aanmerking komen
      indien hij een ingezetene is die rechtmatig in Nederland verblijf houdt in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0031331/2017-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '4.1'
    text: |-
      Indien een persoon zich tot het college wendt voor schuldhulpverlening vindt binnen vier weken het eerste gesprek
      plaats waarin de hulpvraag wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0031331/2017-04-01#Artikel4
  - number: '4.2'
    text: |-
      Indien er sprake is van een bedreigende situatie vindt binnen drie werkdagen het eerste gesprek plaats waarin de
      hulpvraag wordt vastgesteld. Onder bedreigende situatie wordt verstaan gedwongen woningontruiming, beëindiging
      van de levering van gas, elektriciteit, stadsverwarming of water of opzegging dan wel ontbinding van de
      zorgverzekering.
    url: https://wetten.overheid.nl/BWBR0031331/2017-04-01#Artikel4
  - number: '4.3'
    text: |-
      Het college geeft de verzoeker inzicht in het aantal weken tussen het eerste gesprek waarin de hulpvraag wordt
      vastgesteld en het bereiken van het resultaat.
    url: https://wetten.overheid.nl/BWBR0031331/2017-04-01#Artikel4
  - number: '5.1'
    text: |-
      Het college kan de rechtbank verzoeken een afkoelingsperiode af te kondigen, waarin elke bevoegdheid van de
      schuldeiser tot verhaal op de goederen van de schuldenaar en tot opeising van goederen die zich in de macht van de
      schuldenaar bevinden niet kan worden uitgeoefend, voor een periode van maximaal zes maanden.
    url: https://wetten.overheid.nl/BWBR0031331/2017-04-01#Artikel5
  - number: '5.2'
    text: |-
      Een afkoelingsperiode als bedoeld in het eerste lid wordt slechts afgekondigd indien deze periode noodzakelijk is
      in het kader van schuldhulpverlening en indien is voldaan aan bij algemene maatregel van bestuur gestelde nadere
      voorwaarden.
    url: https://wetten.overheid.nl/BWBR0031331/2017-04-01#Artikel5
  - number: '5.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen verplichtingen worden aangewezen die door de schuldenaar tijdens de
      afkoelingsperiode, bedoeld in het eerste lid, worden nagekomen.
    url: https://wetten.overheid.nl/BWBR0031331/2017-04-01#Artikel5
  - number: '6'
    text: |-
      De verzoeker doet aan het college op verzoek of onverwijld uit eigen beweging mededeling van alle feiten en
      omstandigheden waarvan hem redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op de op hem van
      toepassing zijnde schuldhulpverlening of voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0031331/2017-04-01#Artikel6
  - number: '7.1'
    text: |-
      De verzoeker is verplicht aan het college desgevraagd de medewerking te verlenen die redelijkerwijs nodig is voor
      de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0031331/2017-04-01#Artikel7
  - number: '7.2'
    text: |-
      Het college stelt bij de uitvoering van deze wet de identiteit van de persoon,
      bedoeld in het eerste lid, vast aan de hand van een document als bedoeld in
      [artikel 1, eerste lid, onder 1° tot en met 3°, van de Wet op de identificatieplicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0031331/2017-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '7.3'
    text: |-
      Een ieder is verplicht aan het college desgevraagd een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] terstond ter inzage te verstrekken, voor zover dit
      redelijkerwijs nodig is voor de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0031331/2017-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '8.1'
    text: |-
      Bestuursorganen en andere bij algemene maatregel van bestuur aangewezen personen en instanties verstrekken aan het
      college de gegevens en inlichtingen waarvan kennisneming van belang kan zijn voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0031331/2017-04-01#Artikel8
  - number: '8.2'
    text: |-
      Het college kan onder bij algemene maatregel van bestuur te bepalen voorwaarden aan bestuursorganen en aan bij
      algemene maatregel van bestuur aan te wijzen instanties gegevens verstrekken voortvloeiende uit de uitvoering
      van deze wet, die deze bestuursorganen en instanties behoeven in verband met uitoefening van hun taak en
      dienstverlening.
    url: https://wetten.overheid.nl/BWBR0031331/2017-04-01#Artikel8
  - number: '8.3'
    text: |-
      Het vragen en het verstrekken van gegevens door het college aan en door de in het eerste en tweede lid
      bedoelde bestuursorganen en instanties kan geschieden door tussenkomst van het Inlichtingenbureau, bedoeld in
      [artikel 63 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel63
    url: https://wetten.overheid.nl/BWBR0031331/2017-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '63'
  - number: '8.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over de wijze van gegevensuitwisseling en de
      kosten, die daarbij in rekening kunnen worden gebracht.
    url: https://wetten.overheid.nl/BWBR0031331/2017-04-01#Artikel8
  - number: '9.1'
    text: |-
      Het college verstrekt Onze Minister, kosteloos, de gegevens en inlichtingen die hij voor de statistiek,
      informatievoorziening en beleidsvorming met betrekking tot deze wet nodig heeft.
    url: https://wetten.overheid.nl/BWBR0031331/2017-04-01#Artikel9
  - number: '9.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de informatie die het college verstrekt
      en de wijze waarop het college de gegevens verzamelt en verstrekt, waarbij kan worden bepaald dat categorieën van
      gemeenten bepaalde gegevens en inlichtingen niet hoeven te verzamelen en te verstrekken.
    url: https://wetten.overheid.nl/BWBR0031331/2017-04-01#Artikel9
  - number: '12'
    text: |-
      Onze Minister zendt binnen vier jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0031331/2017-04-01#Artikel12
  - number: '13'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0031331/2017-04-01#Artikel13
  - number: '14'
    text: 'Deze wet wordt aangehaald als: Wet gemeentelijke schuldhulpverlening.'
    url: https://wetten.overheid.nl/BWBR0031331/2017-04-01#Artikel14
