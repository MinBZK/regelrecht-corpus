---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_gemeentelijke_schuldhulpverlening
regulatory_layer: WET
publication_date: '2026-02-03'
valid_from: '2021-01-01'
bwb_id: BWBR0031331
url: https://wetten.overheid.nl/BWBR0031331/2021-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is gemeenten een wettelijke taak te geven met betrekking
    tot schuldhulpverlening;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *cliënt:* persoon aan wie op grond van deze
      wet schuldhulpverlening wordt gegeven;
        - *college:* college van burgemeester en wethouders;
        - *inwoner:* degene die als ingezetene in de basisregistratie personen is ingeschreven;
        - *Onze Minister:* Onze Minister van Sociale Zaken en Werkgelegenheid;
        - *schuldhulpverlening:* het ondersteunen bij het vinden van een adequate oplossing gericht op de aflossing van
      schulden indien redelijkerwijs is te voorzien dat een natuurlijke persoon niet zal kunnen voortgaan met het betalen
      van zijn schulden of indien hij in de toestand verkeert dat hij heeft opgehouden te betalen, alsmede de nazorg.
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel1
  - number: '2.1'
    text: |-
      De gemeenteraad stelt een plan vast dat richting geeft aan de integrale schuldhulpverlening aan de inwoners van
      zijn gemeente.
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel2
  - number: '2.2'
    text: |-
      De gemeenteraad stelt het plan telkens voor een periode van ten hoogste vier jaren vast. Het plan kan tussentijds
      gewijzigd worden.
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel2
  - number: '2.3'
    text: |-
      Het plan bevat de hoofdzaken van het door de gemeente te voeren beleid betreffende integrale schuldhulpverlening en
      het voorkomen dat inwoners schulden aangaan die ze niet kunnen betalen.
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel2
  - number: '2.4'
    text: 'In het plan wordt in ieder geval aangegeven:'
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel2
  - number: 2.4.a
    text: welke resultaten de gemeente in de door het plan bestreken periode wenst te behalen;
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel2
  - number: 2.4.b
    text: |-
      welke maatregelen de gemeenteraad en het college nemen om de kwaliteit te borgen van de wijze waarop de integrale
      schuldhulpverlening wordt uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel2
  - number: 2.4.c
    text: |-
      hoe de samenwerking met schuldeisers, waaronder verhuurders van tot bewoning bestemde onroerende zaken,
      zorgverzekeraars, water- en energiebedrijven, wordt vormgegeven;
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel2
  - number: 2.4.d
    text: |-
      het maximaal aantal weken dat de gemeente nastreeft met betrekking tot de in [artikel 4, eerste lid][ref1],
      genoemde periode, en


      [ref1]: https://wetten.overheid.nl/BWBR0031331#Artikel4
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0031331
        artikel: '4'
  - number: 2.4.e
    text: hoe schuldhulpverlening aan gezinnen met inwonende minderjarige kinderen wordt vormgegeven.
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel2
  - number: '2.5'
    text: |-
      In het plan kan de gemeenteraad aangeven onder welke voorwaarden het college de cliënt verplicht te beschikken over
      een basisbetaalrekening als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '3.1'
    text: |-
      Het college heeft tot taak en voert daarbij het plan, bedoeld in [artikel 2, eerste lid][ref1], uit, om:


      [ref1]: https://wetten.overheid.nl/BWBR0031331#Artikel2
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0031331
        artikel: '2'
  - number: 3.1.a
    text: schuldhulpverlening aan de inwoners van zijn gemeente te geven;
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel3
  - number: 3.1.b
    text: |-
      een inwoner een aanbod te doen tot een eerste gesprek als bedoeld in [artikel 4, eerste lid][ref1], als een bij
      of krachtens algemene maatregel van bestuur te bepalen signaal van schuldeisers is ontvangen door het college over
      betalingsachterstanden, dat een goede indicatie vormt voor meer schulden.


      [ref1]: https://wetten.overheid.nl/BWBR0031331#Artikel4
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0031331
        artikel: '4'
  - number: '3.2'
    text: |-
      Het college kan schuldhulpverlening in ieder geval weigeren in geval een inwoner al eerder gebruik heeft gemaakt
      van schuldhulpverlening.
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel3
  - number: '3.3'
    text: |-
      Het college kan schuldhulpverlening in ieder geval weigeren in geval een inwoner fraude heeft gepleegd die
      financiële benadeling van een bestuursorgaan tot gevolg heeft en die inwoner in verband daarmee onherroepelijk
      strafrechtelijk is veroordeeld of een onherroepelijke bestuurlijke sanctie, die beoogt leed toe te voegen, is
      opgelegd.
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel3
  - number: '3.4'
    text: |-
      Een vreemdeling kan voor het verlenen van schuldhulpverlening slechts in aanmerking komen
      indien hij een ingezetene is die rechtmatig in Nederland verblijf houdt in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '3.5'
    text: |-
      In bijzondere omstandigheden kan het college, zo nodig in overleg met het college van een andere gemeente, ook
      schuldhulpverlening aan een persoon geven als die geen inwoner is. Voor de toepassing van deze wet wordt deze
      persoon gelijkgesteld met een inwoner.
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel3
  - number: 3a
    text: |-
      Het college kan de uitvoering van deze wet, behoudens de vaststelling van de rechten en plichten van de inwoner
      en de daarvoor noodzakelijke beoordeling van zijn omstandigheden, door derden laten verrichten. Het college
      kan bedoelde vaststelling en beoordeling mandateren aan een organisatie of instelling, die zich blijkens haar
      doelstelling of werkzaamheden richt op schuldhulpverlening.
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel3a
  - number: '4.1'
    text: |-
      Het eerste gesprek waarin de schriftelijke of mondelinge hulpvraag wordt vastgesteld, vindt plaats binnen vier
      weken nadat:
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel4
  - number: 4.1.a
    text: een inwoner zich tot het college wendt voor schuldhulpverlening; of
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel4
  - number: 4.1.b
    text: |-
      het college een signaal als bedoeld in [artikel 3, eerste lid, onderdeel b][ref1], heeft ontvangen, in het geval de
      inwoner het aanbod heeft geaccepteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0031331#Artikel3
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0031331
        artikel: '3'
  - number: '4.2'
    text: |-
      Indien er sprake is van een bedreigende situatie vindt binnen drie werkdagen het eerste gesprek plaats waarin de
      hulpvraag wordt vastgesteld. Onder bedreigende situatie wordt verstaan gedwongen woningontruiming, beëindiging
      van de levering van gas, elektriciteit, stadsverwarming of water of opzegging dan wel ontbinding van de
      zorgverzekering.
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel4
  - number: '4.3'
    text: |-
      Het college geeft de inwoner inzicht in het aantal weken tussen het eerste gesprek waarin de hulpvraag wordt
      vastgesteld en het bereiken van het resultaat.
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel4
  - number: 4a.1
    text: |-
      Na het eerste gesprek, bedoeld in [artikel 4, eerste lid][ref1], wordt een beschikking afgegeven, inhoudende:


      [ref1]: https://wetten.overheid.nl/BWBR0031331#Artikel4
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0031331
        artikel: '4'
  - number: 4a.1.a
    text: het plan van aanpak; of
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel4a
  - number: 4a.1.b
    text: een weigering tot schuldhulpverlening.
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel4a
  - number: 4a.2
    text: |-
      In afwijking van het eerste lid kan een beschikking achterwege blijven als in het eerste gesprek door de inwoner
      wordt aangegeven af te zien van verdere schuldhulpverlening.
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel4a
  - number: 4a.3
    text: |-
      De beschikking, bedoeld in het eerste lid, wordt gegeven binnen een bij gemeentelijke verordening te bepalen
      termijn. Deze termijn bedraagt maximaal acht weken.
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel4a
  - number: 4a.4
    text: Aan een beschikking als bedoeld in het eerste lid, onderdeel a, kunnen voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel4a
  - number: 4a.5
    text: |-
      In het plan van aanpak wordt ten minste de beslagvrije voet, bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref1], in acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
  - number: 4a.6
    text: |-
      Als er redenen zijn om de schuldhulpverlening tussentijds te beëindigen, wordt een beschikking tot beëindiging van
      de schuldhulpverlening afgegeven.
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel4a
  - number: '5.1'
    text: |-
      Het college kan de rechtbank verzoeken een afkoelingsperiode af te kondigen, waarin elke bevoegdheid van de
      schuldeiser tot verhaal op de goederen van de cliënt en tot opeising van goederen die zich in de macht van de
      cliënt bevinden niet kan worden uitgeoefend, voor een periode van maximaal zes maanden.
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel5
  - number: '5.2'
    text: |-
      Een afkoelingsperiode als bedoeld in het eerste lid wordt slechts afgekondigd indien deze periode noodzakelijk is
      in het kader van schuldhulpverlening en indien is voldaan aan bij algemene maatregel van bestuur gestelde nadere
      voorwaarden.
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel5
  - number: '5.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen verplichtingen worden aangewezen die door de cliënt tijdens de
      afkoelingsperiode, bedoeld in het eerste lid, worden nagekomen.
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel5
  - number: '6'
    text: |-
      De cliënt doet aan het college op verzoek of onverwijld uit eigen beweging mededeling van alle feiten en
      omstandigheden waarvan hem redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op de op hem van
      toepassing zijnde schuldhulpverlening of voor de uitvoering van deze wet, voor zover gegevens over deze feiten en
      omstandigheden niet door het college kunnen worden verkregen.
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel6
  - number: '7.1'
    text: |-
      De cliënt is verplicht aan het college desgevraagd de medewerking te verlenen die redelijkerwijs nodig is voor de
      uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel7
  - number: '7.2'
    text: |-
      Het college stelt bij de uitvoering van deze wet de identiteit van de cliënt vast aan de hand van een document als
      bedoeld in [artikel 1, eerste lid, onder 1° tot en met 3°, van de Wet op de identificatieplicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '7.3'
    text: |-
      Een ieder is verplicht aan het college desgevraagd een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] terstond ter inzage te verstrekken, voor zover dit
      redelijkerwijs nodig is voor de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '8.1'
    text: |-
      Bestuursorganen en andere bij algemene maatregel van bestuur aangewezen personen en instanties verstrekken onder
      te bepalen voorwaarden aan het college de gegevens en inlichtingen waarvan kennisneming van belang kan zijn voor de
      uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel8
  - number: '8.2'
    text: |-
      Het college kan onder bij algemene maatregel van bestuur te bepalen voorwaarden aan bestuursorganen en aan bij
      algemene maatregel van bestuur aan te wijzen instanties gegevens verstrekken voortvloeiende uit de uitvoering
      van deze wet, die deze bestuursorganen en instanties behoeven in verband met uitoefening van hun taak en
      dienstverlening.
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel8
  - number: '8.3'
    text: |-
      Het vragen en het verstrekken van gegevens door het college aan en door de in het eerste en tweede lid
      bedoelde bestuursorganen en instanties kan geschieden door tussenkomst van het Inlichtingenbureau, bedoeld in
      [artikel 63 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel63
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '63'
  - number: '8.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over de wijze van gegevensuitwisseling en de
      kosten, die daarbij in rekening kunnen worden gebracht.
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel8
  - number: 8a
    text: |-
      Het college is bevoegd tot het verwerken van persoonsgegevens, waaronder persoonsgegevens over
      gezondheid als bedoeld in artikel 4, onderdeel 15, van de Algemene verordening gegevensbescherming en
      persoonsgegevens van strafrechtelijke aard voor zover noodzakelijk voor de uitvoering van de taak, bedoeld in
      [artikel 3, eerste lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031331#Artikel3
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0031331
        artikel: '3'
  - number: 8b.1
    text: |-
      Het college is bevoegd tot het verwerken van persoonsgegevens van de inwoner voor zover die gegevens noodzakelijk
      zijn voor de uitvoering van de taak, bedoeld in [artikel 3, eerste lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031331#Artikel3
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0031331
        artikel: '3'
  - number: 8b.2
    text: |-
      Onder noodzakelijke gegevens wordt verstaan de gegevens uit de basisregistratie personen en gegevens die
      noodzakelijk zijn om de signalen, bedoeld in de [artikelen 3, eerste lid, onderdeel b][ref1], of [10][ref2], te
      verwerken.


      [ref1]: https://wetten.overheid.nl/BWBR0031331#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0031331#Artikel10
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0031331
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0031331
        artikel: '10'
  - number: 8c
    text: |-
      Het college gebruikt het burgerservicenummer, bedoeld in
      [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref1] van een inwoner bij het
      verwerken van persoonsgegevens als bedoeld in de [artikelen 8a][ref2] en [8b][ref3] met het doel te waarborgen dat
      de in het kader van de uitvoering van deze wet te verwerken persoonsgegevens op die inwoner betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0031331#Artikel8a
      [ref3]: https://wetten.overheid.nl/BWBR0031331#Artikel8b
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel8c
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0031331
        artikel: 8a
      - id: ref3
        bwb_id: BWBR0031331
        artikel: 8b
  - number: 8d
    text: |-
      Het college is bevoegd persoonsgegevens van de inwoner, die het college heeft verkregen voor de
      uitvoering van de taken die bij of krachtens de [Jeugdwet][ref1], de [Participatiewet][ref2] of de
      [Wet maatschappelijke ondersteuning 2015][ref3] aan het college zijn opgedragen, ook te verwerken als dat
      noodzakelijk is voor de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0034925
      [ref2]: https://wetten.overheid.nl/BWBR0015703
      [ref3]: https://wetten.overheid.nl/BWBR0035362
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel8d
    references:
      - id: ref1
        bwb_id: BWBR0034925
      - id: ref2
        bwb_id: BWBR0015703
      - id: ref3
        bwb_id: BWBR0035362
  - number: '9.1'
    text: |-
      Het college verstrekt Onze Minister, kosteloos, de gegevens en inlichtingen die hij voor de statistiek,
      informatievoorziening en beleidsvorming met betrekking tot deze wet nodig heeft.
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel9
  - number: '9.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de informatie die het college verstrekt
      en de wijze waarop het college de gegevens verzamelt en verstrekt, waarbij kan worden bepaald dat categorieën van
      gemeenten bepaalde gegevens en inlichtingen niet hoeven te verzamelen en te verstrekken.
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel9
  - number: '10.1'
    text: |-
      In afwijking van [artikel 3, eerste lid, onderdeel b][ref1], kan bij ministeriële regeling voor de duur van
      maximaal vijf jaren een signaal van een schuldeiser over betalingsachterstanden, die een betere indicatie vormen
      voor meer schulden, worden aangewezen, waarna bij ontvangst daarvan door bij die regeling aangewezen gemeenten, het
      college uit eigen beweging een eerste gesprek aanbiedt als bedoeld in [artikel 4, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031331#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0031331#Artikel4
    url: https://wetten.overheid.nl/BWBR0031331/2021-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0031331
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0031331
        artikel: '4'
  - number: '10.2'
    text: |-
      Als toepassing is gegeven aan het eerste lid kunnen in afwijking van [artikel 8, eerste lid][ref1], bij
      ministeriële regeling personen en instanties worden aangewezen die een signaal over betalingsachterstanden aan
      het college verstrekken en zijn artikel 8, tweede tot en met vierde lid van overeenkomstige toepassing met dien
      verstande dat waar « bij algemene maatregel van bestuur» staat gelezen wordt «bij ministeriële regeling».


      [ref1]: https://wetten.overheid.nl/BWBR0031331#Artikel8
