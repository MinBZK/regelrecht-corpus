preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is in verband met de uitvoering van de verordening (EU)
    nr. 98/2013 van het Europees Parlement en de Raad van 15 januari 2013, over het op de markt brengen en het gebruik
    van precursoren voor explosieven (PbEU 2013, L 39) bij de wet regels te stellen ten aanzien van het aanbieden,
    binnenbrengen, voorhanden hebben en gebruiken van stoffen of mengsels die kunnen worden misbruikt voor de illegale
    vervaardiging van explosieven, ten aanzien van vergunningverlening aan particulieren daaromtrent alsmede ten
    aanzien van het toezicht op de naleving en de handhaving van de bepalingen van de verordening;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0037995/2021-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *aanbieden:* aanbieden als bedoeld in artikel 3, punt vier, van de verordening;
        - *gebruik:* gebruik als bedoeld in artikel 3, punt zes, van de verordening;
        - *gereguleerde precursor voor explosieven:* een precursor voor explosieven als bedoeld in artikel 3, punt dertien,
      van de verordening;
        - *marktdeelnemer:* marktdeelnemer als bedoeld in artikel 3, punt tien, van de verordening;
        - *onlinemarktplaats:* onlinemarktplaats als bedoeld in artikel 3, punt 11, van de verordening;
        - *Onze Minister:* Onze Minister van Justitie en Veiligheid;
        - *particulier:* een particulier als bedoeld in artikel 3, punt acht, van de verordening;
        - *persoonsgegevens, verwerking van persoonsgegevens, onderscheidenlijk verantwoordelijke:* hetgeen daaronder wordt
      verstaan in artikel 4, aanhef en onder 1, 2 en 7, van de Algemene verordening gegevensbescherming;
        - *precursor voor explosieven waarvoor een beperking geldt:* een precursor voor explosieven waarvoor een beperking
      geldt als bedoeld in artikel 3, punt twaalf, van de verordening, alsmede een krachtens artikel 2, tweede lid, van
      deze wet daartoe aangewezen precursor voor explosieven;
        - *precursor voor explosieven waarvoor een meldplicht geldt:* precursor voor explosieven waarvoor een meldplicht
      geldt als bedoeld in artikel 9, eerste, tweede, en vierde tot en met zesde lid, van de verordening, alsmede een
      krachtens artikel 2, tweede lid, van deze wet daartoe aangewezen precursor voor explosieven;
        - *vergunning:* een vergunning als bedoeld in artikel 5, derde lid, van de verordening;
        - *verordening:* Verordening (EU) 2019/1148 van het Europees Parlement en de Raad van 20 juni 2019 over het op de
      markt brengen en het gebruik van precursoren voor explosieven, tot wijziging van Verordening (EG) nr. 1907/2006 en
      tot intrekking van Verordening (EU) nr. 98/2013 (PbEU 2019, L 186).
    url: https://wetten.overheid.nl/BWBR0037995/2021-07-01#Artikel1
  - number: '2'
    text: |-
      1 Deze wet is van toepassing op precursoren voor explosieven waarvoor een beperking geldt en precursoren voor
      explosieven waarvoor een meldplicht geldt.

      2 Bij regeling van Onze Minister en Onze Minister van Infrastructuur en Waterstaat kunnen precursoren voor
      explosieven waarvoor een beperking geldt en precursoren voor explosieven waarvoor een meldplicht geldt worden
      aangewezen die, in aanvulling op de stoffen bedoeld in de bijlagen I en II behorende bij de verordening, vallen
      onder de werking van deze wet. Daarbij kunnen lagere grenswaarden worden vastgesteld dan de grenswaarden voor de
      stoffen die zijn vermeld in de bijlage I behorende bij de verordening en kunnen grenswaarden worden vastgesteld
      waarboven een in bijlage II behorende bij de verordening vermelde stof onderworpen is aan de beperkingen die gelden
      voor precursoren voor explosieven waarvoor een beperking geldt.
    url: https://wetten.overheid.nl/BWBR0037995/2021-07-01#Artikel2
  - number: '3'
    text: |-
      1 Het is verboden te handelen in strijd met artikel 5, eerste lid, van de verordening.

      2 Het verbod is niet van toepassing indien de particulier over een vergunning beschikt.
    url: https://wetten.overheid.nl/BWBR0037995/2021-07-01#Artikel3
  - number: '4'
    text: |-
      1 Onze Minister is bevoegd een vergunning te verlenen, te weigeren, te schorsen, in te trekken en daaraan
      voorschriften en beperkingen te verbinden.

      2 De vergunning is persoonlijk en niet overdraagbaar.

      3 De vergunning wordt voor de duur van maximaal twee jaar verleend.

      4 Aan de vergunning kunnen voorschriften en beperkingen worden verbonden met betrekking tot:

      a. het gebruik van de precursor voor explosieven;

      b. te nemen veiligheidsmaatregelen voor onder meer vervoer, opslag en gebruik van de precursor voor explosieven,
      onder meer ter voorkoming van gebruik door anderen dan de aanvrager;

      c. te nemen maatregelen bij verdwijning of diefstal van de precursor voor explosieven; of

      d. de door de aanvrager te bewaren gegevens en bescheiden van de aankoop van de precursor voor explosieven.

      5 Het is verboden te handelen in strijd met de voorschriften en beperkingen, bedoeld in het vierde lid.

      6 Bij regeling van Onze Minister en Onze Minister van Infrastructuur en Waterstaat kunnen modellen worden
      vastgesteld van de vergunning alsmede van andere ter uitvoering van de wet te gebruiken bescheiden.
    url: https://wetten.overheid.nl/BWBR0037995/2021-07-01#Artikel4
  - number: '5'
    text: |-
      1 Naast de gegevens, bedoeld in [artikel 4:2 van de Algemene wet bestuursrecht][ref1], worden bij de aanvraag ten
      minste verstrekt:

      a. het telefoonnummer van de aanvrager;

      b. zijn e-mailadres;

      c. het nummer van zijn identiteitsbewijs;

      d. het adres waar de precursor voor explosieven zal worden opgeslagen dan wel zal worden gebruikt indien dat niet
      gelijk is aan het woonadres;

      e. een verklaring omtrent het gedrag van de aanvrager als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref2], die niet meer dan twee maanden oud is.

      2 Bij regeling van Onze Minister en Onze Minister van Infrastructuur en Waterstaat worden regels gesteld over:

      a. de plaats waar de aanvraag wordt ingediend;

      b. de wijze waarop de aanvraag wordt ingediend, en

      c. welke bescheiden en gegevens in aanvulling op de gegevens, bedoeld in het eerste lid, bij de aanvraag worden
      verstrekt.

      3 Bij regeling van Onze Minister en Onze Minister van Infrastructuur en Waterstaat kan worden bepaald dat voor de
      behandeling van een aanvraag om een vergunning een kostendekkende vergoeding is verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0037995/2021-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:2
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '28'
  - number: '6'
    text: |-
      1 Onverminderd artikel 6, eerste en tweede lid, van de verordening, betrekt Onze Minister bij zijn besluit een
      vergunning te verlenen of het voorgenomen gebruik niet in strijd is met de wet en naar het oordeel van Onze
      Minister proportioneel is om het voorgenomen doel te bereiken.

      2 Onverminderd artikel 6, tweede lid, van de verordening wordt de vergunning niet verleend indien dat noodzakelijk
      is ter bescherming van wezenlijke veiligheidsbelangen of om redenen van openbare orde. Bij regeling van Onze
      Minister en Onze Minister van Infrastructuur en Waterstaat worden regels gesteld over de toepassing van de eerste
      volzin.
    url: https://wetten.overheid.nl/BWBR0037995/2021-07-01#Artikel6
  - number: '7'
    text: |-
      1 De houder van een vergunning licht Onze Minister zo spoedig mogelijk in over wijzigingen van de gegevens en
      bescheiden die bij de aanvraag van de vergunning zijn verstrekt.

      2 De vergunning kan worden geschorst of ingetrokken, indien:

      a. niet langer aan de voorwaarden voor afgifte van de vergunning wordt voldaan;

      b. de vergunning is verstrekt op grond van onjuiste of onvolledige gegevens;

      c. de voorschriften van of beperkingen aan de vergunning niet in acht zijn genomen; of

      d. niet is voldaan aan het eerste lid dan wel een vordering als bedoeld in
      [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1].

      3 In de situatie, bedoeld in artikel 6, vijfde lid, laatste zin, van de verordening, treedt een
      besluit tot schorsing of intrekking van de vergunning in werking op de dag dat het is genomen.
      [Artikel 3:40 van de Algemene wet bestuursrecht][ref2] blijft in zoverre buiten toepassing. De bekendmaking van de
      schorsing of intrekking vindt onverwijld plaats zodra voormelde situatie zich niet langer voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel520
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel340
    url: https://wetten.overheid.nl/BWBR0037995/2021-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 5:20
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 3:40
  - number: '8'
    text: |-
      1 Het is verboden te handelen in strijd met de artikelen 7 en 8 van de verordening en de regels, bedoeld in het
      tweede lid.

      2 Bij regeling van Onze Minister en Onze Minister van Infrastructuur en Waterstaat worden regels gesteld over
      de wijze waarop marktdeelnemers gereguleerde precursoren voor explosieven aanbieden, en over de wijze waarop
      onlinemarktplaatsen hun gebruikers informeren over de verplichtingen ingevolge de verordening. Daarbij worden in
      elk geval regels gesteld over de verificaties die marktdeelnemers uitvoeren bij het aanbieden van precursoren voor
      explosieven waarvoor een beperking geldt.
    url: https://wetten.overheid.nl/BWBR0037995/2021-07-01#Artikel8
  - number: '9'
    text: |-
      1 Het is verboden te handelen in strijd met artikel 9, eerste, tweede, en vierde tot en met zesde lid, van de
      verordening.

      2 Artikel 9, eerste, tweede, en vierde tot en met zesde lid, van de verordening is van toepassing op de krachtens
      [artikel 2, tweede lid][ref1], van deze wet aangewezen precursoren.

      3 Bij regeling van Onze Minister en Onze Minister van Infrastructuur en Waterstaat worden regels gesteld over de in
      het eerste en tweede lid bedoelde meldingen en procedures.

      4 Het is verboden te handelen in strijd met de regels, bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0037995#Artikel2
    url: https://wetten.overheid.nl/BWBR0037995/2021-07-01#Artikel9
    references:
