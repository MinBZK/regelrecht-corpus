  - number: '13'
    text: |-
      1 Onze Minister, of een krachtens deze wet of bij de [Algemene Douanewet][ref1] aangewezen toezichthouder, ontvangt
      de persoonsgegevens, bedoeld in [artikel 5, eerste lid][ref2], dan wel andere gegevens of bescheiden ten behoeve
      van een doelmatige en doeltreffende uitvoering van deze wet, van:

      a. de korpschef, bedoeld in [artikel 27 van de Politiewet 2012][ref3], dan wel

      b. de commandant van de Koninklijke marechaussee ten behoeve van de goede uitoefening van de politietaak, bedoeld
      in [artikel 4 van de Politiewet 2012][ref4].

      2 Andere bestuursorganen zijn bevoegd uit eigen beweging en desgevraagd verplicht aan Onze Minister,
      onderscheidenlijk een krachtens deze wet of bij de [Algemene Douanewet][ref5] aangewezen toezichthouder, de
      persoonsgegevens, bedoeld in [artikel 5, eerste lid][ref6], dan wel andere gegevens of bescheiden te verstrekken
      die noodzakelijk zijn voor de uitvoering van en het toezicht op de naleving van deze wet.


