preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is in verband met de uitvoering van de verordening (EU)
    nr. 98/2013 van het Europees Parlement en de Raad van 15 januari 2013, over het op de markt brengen en het gebruik
    van precursoren voor explosieven (PbEU 2013, L 39) bij de wet regels te stellen ten aanzien van het aanbieden,
    binnenbrengen, voorhanden hebben en gebruiken van stoffen of mengsels die kunnen worden misbruikt voor de illegale
    vervaardiging van explosieven, ten aanzien van vergunningverlening aan particulieren daaromtrent alsmede ten
    aanzien van het toezicht op de naleving en de handhaving van de bepalingen van de verordening;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0037995/2018-07-28#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *aanbieden:* aanbieden als bedoeld in artikel 3, punt vier, van de verordening;
        - *binnenbrengen:* binnenbrengen als bedoeld in artikel 3, punt vijf, van de verordening;
        - *gebruik:* gebruik als bedoeld in artikel 3, punt zes, van de verordening;
        - *marktdeelnemer:* marktdeelnemer als bedoeld in artikel 3, punt negen, van de verordening;
        - *Onze Minister:* Onze Minister van Veiligheid en Justitie;
        - *particulier:* een particulier als bedoeld in artikel 3, punt zeven, van de verordening;
        - *persoonsgegevens, verwerking van persoonsgegevens, onderscheidenlijk verwerkingsverantwoordelijke:* hetgeen
      daaronder wordt verstaan in artikel 4, aanhef en onder 1, 2 en 7, van de Algemene verordening gegevensbescherming;
        - *precursor voor explosieven waarvoor een beperking geldt:* een precursor voor explosieven waarvoor een beperking
      geldt als bedoeld in artikel 3, punt tien, van de verordening, alsmede een krachtens artikel 2, tweede lid, daartoe
      aangewezen precursor voor explosieven;
        - *precursor voor explosieven waarvoor een meldplicht geldt:* precursor voor explosieven waarvoor een meldplicht
      geldt als bedoeld in artikel 9, eerste, derde en vierde lid, van de verordening, alsmede een krachtens artikel 2,
      tweede lid, daartoe aangewezen precursor voor explosieven;
        - *verdachte transactie:* verdachte transactie als bedoeld in artikel 3, punt acht, van de verordening;
        - *de verordening:* de verordening (EU) nr. 98/2013 van het Europees Parlement en de Raad van 15 januari 2013 over
      het op de markt brengen en het gebruik van precursoren voor explosieven (PbEU 2013, L 39).
    url: https://wetten.overheid.nl/BWBR0037995/2018-07-28#Artikel1
  - number: '2'
    text: |-
      1 Deze wet is van toepassing op precursoren voor explosieven waarvoor een beperking geldt en precursoren voor
      explosieven waarvoor een meldplicht geldt.

      2 Bij regeling van Onze Minister en Onze Minister van Infrastructuur en Milieu kunnen precursoren voor explosieven
      waarvoor een beperking geldt en precursoren voor explosieven waarvoor een meldplicht geldt worden aangewezen die,
      in aanvulling op de stoffen bedoeld in de bijlagen I en II behorende bij de verordening, vallen onder de werking
      van deze wet. Daarbij kunnen lagere grenswaarden worden vastgesteld dan de grenswaarden voor de stoffen die zijn
      vermeld in de bijlage I behorende bij de verordening en kunnen maximumconcentraties worden vastgesteld voor de
      stoffen die zijn vermeld in de bijlage II behorende bij de verordening.
    url: https://wetten.overheid.nl/BWBR0037995/2018-07-28#Artikel2
  - number: '3'
    text: |-
      1 Het is verboden precursoren voor explosieven waarvoor een beperking geldt aan te bieden aan een particulier.

      2 Het is een particulier verboden precursoren voor explosieven waarvoor een beperking geldt binnen te brengen op
      het grondgebied van Nederland, in bezit te houden of te gebruiken.

      3 De verboden, bedoeld in het eerste en tweede lid, zijn niet van toepassing indien de particulier over een
      vergunning beschikt.
    url: https://wetten.overheid.nl/BWBR0037995/2018-07-28#Artikel3
  - number: '4'
    text: |-
      1 Onze Minister is bevoegd een vergunning als bedoeld in [artikel 3, derde lid][ref1], te verlenen, te weigeren, te
      schorsen, in te trekken en daaraan voorschriften te verbinden.

      2 De vergunning is niet overdraagbaar.

      3 De vergunning wordt voor de duur van maximaal twee jaar verleend.

      4 Aan de vergunning kunnen voorschriften worden verbonden met betrekking tot:

      a. het gebruik van de precursor voor explosieven waarvoor een beperking geldt;

      b. te nemen veiligheidsmaatregelen voor onder meer vervoer, opslag en gebruik van de precursor voor explosieven
      waarvoor een beperking geldt, onder meer ter voorkoming van gebruik door anderen dan de aanvrager;

      c. te nemen maatregelen bij verdwijning of diefstal van de precursor voor explosieven waarvoor een beperking geldt;
      of

      d. de door de aanvrager te bewaren gegevens en bescheiden van de aankoop van de precursor voor explosieven waarvoor
      een beperking geldt.

      5 Het is verboden te handelen in strijd met de voorschriften, bedoeld in het vierde lid.

      6 Bij regeling van Onze Minister en Onze Minister van Infrastructuur en Milieu kunnen modellen worden vastgesteld
      van de vergunning alsmede van andere ter uitvoering van de wet te gebruiken bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0037995#Artikel3
    url: https://wetten.overheid.nl/BWBR0037995/2018-07-28#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0037995
        artikel: '3'
  - number: '5'
    text: |-
      1 Naast de gegevens, bedoeld in [artikel 4:2 van de Algemene wet bestuursrecht][ref1], worden bij de aanvraag ten
      minste verstrekt:

      a. het telefoonnummer van de aanvrager;

      b. zijn e-mailadres;

      c. het nummer van zijn identiteitsbewijs;

      d. het adres waar de precursor voor explosieven zal worden opgeslagen dan wel zal worden gebruikt indien dat niet
      gelijk is aan het woonadres.

      2 Bij regeling van Onze Minister en Onze Minister van Infrastructuur en Milieu worden regels gesteld over:

      a. de plaats waar de aanvraag wordt ingediend;

      b. de wijze waarop de aanvraag wordt ingediend, en

      c. welke bescheiden en gegevens in aanvulling op de gegevens, bedoeld in het eerste lid, bij de aanvraag worden
      verstrekt.

      3 Bij regeling van Onze Minister en Onze Minister van Infrastructuur en Milieu kan worden bepaald dat voor de
      behandeling van een aanvraag om een vergunning een kostendekkende vergoeding is verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel42
    url: https://wetten.overheid.nl/BWBR0037995/2018-07-28#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:2
  - number: '6'
    text: |-
      1 Onze Minister verleent een vergunning als bedoeld in [artikel 3, derde lid][ref1], indien:

      a. de aanvrager de gegevens, bedoeld in [artikel 5, eerste lid][ref2], en de bij ministeriële regeling vastgestelde
      bescheiden en informatie bedoeld in artikel 5, tweede lid, onderdeel c, heeft overgelegd;

      b. de aanvrager een verklaring omtrent het gedrag heeft overgelegd als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref3] welke niet meer dan twee maanden oud is;

      c. er naar het oordeel van Onze Minister geen redelijk alternatief voorhanden is voor het voorgenomen gebruik van
      de precursor voor explosieven waarvoor een beperking geldt, waarmee een vergelijkbaar effect wordt bereikt;

      d. de aanvraag niet ziet op gebruik in de uitoefening van een beroep, het voorgenomen gebruik niet in strijd is met
      de wet en het voorgenomen gebruik naar het oordeel van Onze Minister proportioneel is om het voorgenomen doel te
      bereiken; en

      e. geen vermoeden bestaat dat de precursor voor explosieven waarvoor een beperking geldt door de aanvrager voor een
      ander doel zal worden gebruikt dan het voorgenomen doel.

      2 De vergunning wordt niet verleend indien dat noodzakelijk is ter bescherming van wezenlijke veiligheidsbelangen
      of om redenen van openbare orde. Bij regeling van Onze Minister en Onze Minister van Infrastructuur en Milieu
      worden regels gegeven over de toepassing van de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0037995#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037995#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0037995/2018-07-28#Artikel6
    references:
      - id: ref1
