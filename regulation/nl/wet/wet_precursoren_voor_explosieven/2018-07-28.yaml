        artikel: '28'
  - number: '7'
    text: |-
      1 De houder van een vergunning licht Onze Minister zo spoedig mogelijk in over wijzigingen van de gegevens en
      bescheiden die bij de aanvraag van de vergunning zijn verstrekt.

      2 De vergunning kan worden geschorst of ingetrokken, indien:

      a. niet langer aan de voorwaarden voor afgifte van de vergunning wordt voldaan;

      b. de vergunning is verstrekt op grond van onjuiste of onvolledige gegevens;

      c. de voorschriften van de vergunning niet in acht zijn genomen; of

      d. niet is voldaan aan het eerste lid dan wel een vordering als bedoeld in
      [artikel 5:20 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel520
    url: https://wetten.overheid.nl/BWBR0037995/2018-07-28#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 5:20
  - number: '8'
    text: |-
      1 Het is verboden te handelen in strijd met voorschriften gesteld bij artikel 5 van de verordening en de regels,
      bedoeld in het tweede lid.

      2 Bij regeling van Onze Minister en Onze Minister van Infrastructuur en Milieu worden regels gesteld over de wijze
      waarop marktdeelnemers precursoren voor explosieven waarvoor een beperking geldt aanbieden aan particulieren,
      waaronder in elk geval regels over de vormgeving van de etiketten, bedoeld in artikel 5 van de verordening en
      over de controles die marktdeelnemers toepassen bij het aanbieden van precursoren voor explosieven waarvoor een
      beperking geldt.
    url: https://wetten.overheid.nl/BWBR0037995/2018-07-28#Artikel8
  - number: '9'
    text: |-
      1 Het is verboden te handelen in strijd met voorschriften gesteld bij artikel 9, eerste, derde en vierde lid, van
      de verordening.

      2 Artikel 9, eerste, derde en vierde lid, van de verordening is van toepassing op de melding van de op grond van
      [artikel 2, tweede lid][ref1], aangewezen precursoren.

      3 Bij regeling van Onze Minister en Onze Minister van Infrastructuur en Milieu worden regels gesteld over de in het
      eerste en tweede lid bedoelde melding.

      4 Het is verboden te handelen in strijd met de regels, bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0037995#Artikel2
    url: https://wetten.overheid.nl/BWBR0037995/2018-07-28#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0037995
        artikel: '2'
  - number: '10'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij de verordening, of van het bepaalde bij of krachtens deze
      wet, zijn belast de bij besluit van Onze Minister aangewezen ambtenaren. Onze Minister kan aan deze ambtenaren
      algemene en bijzondere aanwijzingen geven omtrent de uitvoering van het toezicht.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0037995/2018-07-28#Artikel10
  - number: '11'
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder dwangsom ter handhaving van de bij of krachtens deze wet
      gestelde verbodsbepalingen en verplichtingen en van de verordening.
    url: https://wetten.overheid.nl/BWBR0037995/2018-07-28#Artikel11
  - number: '12'
    text: |-
      1 Onze Minister, of een krachtens deze wet of bij de [Algemene Douanewet][ref1] aangewezen toezichthouder,
      verstrekt op verzoek van de korpschef, bedoeld in [artikel 27 van de Politiewet 2012][ref2], de persoonsgegevens
      bedoeld in [artikel 5, eerste lid][ref3], dan wel andere gegevens of bescheiden ten behoeve van de goede uitvoering
      van de politietaak, bedoeld in de [artikelen 3][ref4] en [4, eerste lid, van de Politiewet 2012][ref5].

      2 Onze Minister, of een krachtens deze wet of bij de [Algemene Douanewet][ref6] aangewezen toezichthouder,
      verstrekt op verzoek van de commandant van de Koninklijke marechaussee de persoonsgegevens bedoeld in
      [artikel 5, eerste lid][ref7], dan wel andere gegevens of bescheiden ten behoeve van de goede uitvoering van de
      politietaak door de Koninklijke marechaussee als bedoeld in [artikel 4 van de Politiewet 2012][ref8].


