  - number: '14'
    text: |-
      1 Ten behoeve van de doelmatige en doeltreffende uitvoering van deze wet worden persoonsgegevens verwerkt. Onze
      Minister is de verwerkingsverantwoordelijke.

      2 De persoonsgegevens, bedoeld in [artikel 5, eerste lid][ref1], en de bescheiden en gegevens die op grond van
      artikel 5, tweede lid, onderdeel c, zijn verstrekt, worden drie jaar bewaard, ook indien de vergunning wordt
      geweigerd.

      3 De persoonsgegevens dan wel andere gegevens of bescheiden die door de op grond van [artikel 10][ref2] en
      [16][ref3] met het toezicht belaste ambtenaren verkregen zijn bij de uitoefening van hun taak, worden maximaal vijf
      jaar bewaard.


