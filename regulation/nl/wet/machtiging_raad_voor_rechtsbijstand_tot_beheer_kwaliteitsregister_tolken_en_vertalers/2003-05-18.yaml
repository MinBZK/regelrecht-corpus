articles:
  - number: '1'
    text: >-
      De Raad voor rechtsbijstand te 's-Hertogenbosch wordt gemachtigd tot het beheer van het landelijk
      kwaliteitsregister tolken en vertalers.
    url: https://wetten.overheid.nl/BWBR0015070/2003-05-18#Artikel1
  - number: '2'
    text: >-
      De Raad voor de rechtsbijstand kan het beheer van het landelijk kwaliteitsregister tolken en vertalers opdragen aan
      een of meer van zijn medewerkers.
    url: https://wetten.overheid.nl/BWBR0015070/2003-05-18#Artikel2
  - number: '3'
    text: >-
      Deze regeling treedt in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin zij wordt
      geplaatst en werkt terug tot en met 1 mei 2002 en vervalt op een door de Minister van Justitie te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0015070/2003-05-18#Artikel3
