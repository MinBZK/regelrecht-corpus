  text: |-
    Gelet op artikel 56, derde lid, juncto de artikelen 11, 17, 18 en 19 van richtlijn nr. 2005/36/EG van het Europees
    Parlement en de Raad van de Europese Unie van 7 september 2005 betreffende de erkenning van beroepskwalificaties
    (PbEU L 255), en artikel 28, aanhef en onder a, van de Wet op de kamers van koophandel en fabrieken 1997;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0022642/2014-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0022642/2014-01-01#Artikel1
  - number: 1.a
    text: |-
      richtlijn: richtlijn nr. 2005/36/EG van het Europees Parlement en de Raad van de Europese Unie van 7 september 2005
      betreffende de erkenning van beroepskwalificaties (PbEU L 255);
    url: https://wetten.overheid.nl/BWBR0022642/2014-01-01#Artikel1
  - number: 1.b
    text: |-
      Kamer: de Kamer van Koophandel, bedoeld in [artikel 2 van de Wet op de Kamer van Koophandel][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034331#Artikel2
    url: https://wetten.overheid.nl/BWBR0022642/2014-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0034331
        artikel: '2'
  - number: '2.1'
    text: |-
      Als instantie, bevoegd tot het op verzoek afgeven van een verklaring van daadwerkelijke en geoorloofde uitoefening
      in Nederland van een van de in Bijlage IV van de richtlijn vermelde werkzaamheden, wordt aangewezen de kamer in het
      gebied waarin de werkzaamheden van de aanvrager geheel of in hoofdzaak hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0022642/2014-01-01#Artikel2
  - number: '2.2'
    text: |-
      In afwijking van het eerste lid kan een kamer in het gebied waarin de werkzaamheden van de aanvrager geheel of in
      hoofdzaak hebben plaatsgevonden de verklaring laten afgeven door een andere kamer indien bij eerstgenoemde kamer
      slechts incidenteel verzoeken om de in het eerste lid bedoelde verklaringen worden ingediend.
    url: https://wetten.overheid.nl/BWBR0022642/2014-01-01#Artikel2
  - number: '3.1'
    text: |-
      Een verklaring wordt uitsluitend afgegeven indien de aanvrager voldoet aan een van de in de artikelen 17, 18 en 19
      van de richtlijn genoemde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0022642/2014-01-01#Artikel3
  - number: '3.2'
    text: |-
      De in het eerste lid bedoelde verklaring bevat een opgave van de feiten op grond waarvan zij wordt afgegeven,
      overeenkomstig het model, opgenomen in bijlage 1 bij de bekendmaking van de Commissie betreffende bewijzen,
      verklaringen en documenten die zijn voorgeschreven in de tot en met 1 juni 1973 door de Raad vastgestelde
      richtlijnen op het gebied van de vrijheid van vestiging en het vrij verrichten van diensten en betrekking hebben op
        - de betrouwbaarheid,
        - het feit dat er geen faillissement heeft plaatsgehad,
        - de aard en de duur van de in de landen van herkomst uitgeoefende beroepswerkzaamheden (PbEG C 81).
    url: https://wetten.overheid.nl/BWBR0022642/2014-01-01#Artikel3
  - number: '4'
    text: |-
      Een verklaring, verleend op grond van de [Aanwijzingsregeling vestiging in de EU][ref1], wordt aangemerkt als een
      verklaring als bedoeld in [artikel 3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012577
      [ref2]: https://wetten.overheid.nl/BWBR0022642#Artikel3
    url: https://wetten.overheid.nl/BWBR0022642/2014-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012577
      - id: ref2
        bwb_id: BWBR0022642
        artikel: '3'
  - number: '5'
    text: |-
      De [Aanwijzingsregeling vestiging in de EU][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0012577
    url: https://wetten.overheid.nl/BWBR0022642/2014-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012577
  - number: '6'
    text: Deze regeling treedt in werking met ingang van 20 oktober 2007.
    url: https://wetten.overheid.nl/BWBR0022642/2014-01-01#Artikel6
  - number: '7'
    text: 'Deze regeling wordt aangehaald als: Aanwijzingsregeling vestiging in de EU 2007.'
    url: https://wetten.overheid.nl/BWBR0022642/2014-01-01#Artikel7
