  - number: 2a
    text: |-
      Voor de toepassing van de hoofdstukken III, IV en V, titel 3, en de daarop berustende bepalingen wordt in zoverre
      in afwijking van [artikel 1, eerste lid, onderdeel w, van de wet][ref1] onder de tot het bedrijf behorende
      oppervlakte natuurterrein ook gerekend natuurterrein dat daadwerkelijk bij het bedrijf in het kader van een normale
      bedrijfsvoering in gebruik is en ter zake waarvan overeenkomstig [artikel 3][ref2] een grondgebruiksverklaring is
      opgesteld en bij de Dienst Regelingen is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009251#Artikel3
    url: https://wetten.overheid.nl/BWBR0009251/2005-07-06#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0009251
        artikel: '3'
  - number: '3'
    text: |-
      1 De grondgebruiksverklaring wordt gesteld op het formulier, bedoeld in
      [artikel 5d, eerste lid, van de Regeling administratieve verplichtingen Meststoffenwet][ref1] dat overeenkomstig
      de daarbij aangegeven wijze, volledig en naar waarheid wordt ingevuld en door zowel de gebruiker als de eigenaar,
      onderscheidenlijk de erfpachter, vruchtgebruiker of pachter van de desbetreffende grond wordt ondertekend.

      2 De gebruiker van de grond dient het formulier binnen dertig dagen na de datum waarop de grond blijkens het
      ingevulde formulier in gebruik is genomen in bij de Dienst Regelingen.

      3 Indien het formulier niet binnen de in het tweede lid genoemde termijn is ingediend, geldt als datum waarop de
      grond in gebruik is genomen de datum die is gelegen dertig dagen vóór de datum waarop het formulier door de Dienst
      Regelingen is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0009228#Artikel5d
    url: https://wetten.overheid.nl/BWBR0009251/2005-07-06#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009228
        artikel: 5d
  - number: '6'
    text: 'Deze regeling wordt aangehaald als: Regeling landbouwgrond en natuurterrein Meststoffenwet.'
    url: https://wetten.overheid.nl/BWBR0009251/2005-07-06#Artikel6
  - number: '7'
    text: Deze regeling treedt in werking met ingang van 1 januari 1998.
