  - number: 1a
    text: |-
      Als grond waarop bosbouw wordt uitgeoefend die aan bij ministeriële regeling gestelde regels voldoet als bedoeld in
      [artikel 1, eerste lid, onderdeel p, van de wet][ref1] wordt aangemerkt grond met een houtopstand die valt onder de
      vrijstelling, bedoeld in de [Regeling meldings- en herplantplicht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003518
    url: https://wetten.overheid.nl/BWBR0009251/2005-07-06#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003518
  - number: 1b
    text: |-
      Als beheer als bedoeld in [artikel 1, eerste lid, onderdeel v, van de wet][ref1] en
      [artikel 1, eerste lid, onderdeel d, van het Besluit gebruik meststoffen][ref2] dat aan bij ministeriële regeling
      gestelde regels voldoet, wordt aangemerkt beheer dat het gebruik van dierlijke meststoffen of beweiding toestaat en
      dat tevens beheer is:

      a. als bedoeld in de [Subsidieregeling natuurbeheer 2000][ref3],

      b. dat is vastgesteld krachtens de [Natuurbeschermingswet][ref4], of

      c. dat is gericht op de instandhouding van natuurwaarden en tot stand is gekomen met instemming van de Minister van
      Landbouw, Natuur en Voedselkwaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009066#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0010999
      [ref4]: https://wetten.overheid.nl/BWBR0002611
