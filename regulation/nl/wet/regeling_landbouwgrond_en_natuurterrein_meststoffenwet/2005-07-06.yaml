  text: |-
    in overeenstemming met de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Gelet op de artikelen 13al, onderdeel a, en 25a van de Meststoffenwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009251/2005-07-06#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:



              a)
               wet:

                [Meststoffenwet][ref1];



              b)
              Vlaamse Mestbank:

                afdeling Mestbank van de bij decreet van 21 december 1988 opgerichte Vlaamse Landmaatschappij;



              c)
              grondgebruiksverklaring:

                verklaring betreffende landbouwgrond die anders dan op grond van de gebruikstitels
      genoemd in [artikel 1, eerste lid, onderdeel q, en derde lid, van de wet][ref2] bij het bedrijf in
      gebruik is of betreffende natuurterrein dat anders dan op grond van de gebruikstitels genoemd in
      [artikel 1, eerste lid, onderdeel w, van de wet][ref3] bij het bedrijf in gebruik is.



              d)
              Dienst Regelingen:

                Dienst Regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;



              e)
              gebruiker:

                persoon of rechtspersoon die, of samenwerkingsverband van personen of rechtspersonen dat een bedrijf
      voert ten aanzien waarvan een heffing wordt geheven als bedoeld in [artikel 14][ref4] of [22 van de wet][ref5]
      en die, onderscheidenlijk dat, landbouwgrond als bedoeld in [artikel 2][ref6] of natuurterrein als bedoeld in
      [artikel 2a][ref7] in gebruik heeft.




      2 Deze regeling berust op [artikel 1, eerste lid, onderdelen p en v, van de wet][ref8] en op
      [artikel 1, eerste lid, onderdeel d, van het Besluit gebruik meststoffen][ref9] voor zover het betreft de
      [artikelen 1][ref10], [1a][ref11] en [1b][ref12], en op [artikel 1a, tweede lid, van de wet][ref13] voor zover het
      betreft de [artikelen 1][ref14], [2][ref15], [2a][ref16] en [3][ref17].


