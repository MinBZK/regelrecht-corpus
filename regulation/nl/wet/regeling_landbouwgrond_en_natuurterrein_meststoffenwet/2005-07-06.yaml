  - number: '2'
    text: |-
      Voor de toepassing van ‘de hoofdstukken III, IV en V, titel 3, en de daarop berustende bepalingen wordt, in zoverre
      in afwijking van [artikel 1, eerste lid, onderdeel q, en derde lid, van de wet, onder][ref1] de tot het bedrijf
      behorende oppervlakte landbouwgrond ook gerekend:

      a. in België of Duitsland, binnen 25 kilometer van de grens met Nederland gelegen landbouwgrond, die daadwerkelijk
      in het kader van een normale bedrijfsvoering bij het bedrijf in gebruik is en die:

      1º indien die grond in België is gelegen, tot het bedrijf behoort ingevolge eigendom of tot het bedrijf behoort
      blijkens registratie bij de Dienst Regelingen ingevolge artikel 2.2a van de Regeling keuring en handel dierlijke
      producten en registratie bij de Vlaamse Mestbank ingevolge artikel 30 van het Besluit van de Vlaamse regering van
      20 december 1995 tot uitvoering van sommige artikelen van het decreet van 23 januari 1991 inzake de bescherming van
      het leefmilieu tegen de verontreiniging door meststoffen, en

      2º indien die grond in Duitsland is gelegen, tot het bedrijf behoort ingevolge eigendom of ingevolge een in
      Duitsland geregistreerde pachtovereenkomst;

      b. landbouwgrond die daadwerkelijk in het kader van een normale bedrijfsvoering bij het bedrijf in gebruik is en
      die tijdelijk in gebruik is gegeven overeenkomstig:

      1º [artikel 189][ref2] of [201 van de Landinrichtingswet][ref3],

      2º [artikel 46, vierde lid][ref4], of [81 van de Reconstructiewet Midden-Delfland][ref5], of

      3º [artikel 28, vierde lid][ref6], of
      [85 van de Herinrichtingswet Oost-Groningen en de Gronings-Drentse Veenkoloniën][ref7];

      c. landbouwgrond die daadwerkelijk in het kader van een normale bedrijfsvoering bij het bedrijf in gebruik is
      en ter zake waarvan overeenkomstig [artikel 3][ref8] een grondgebruiksverklaring is opgesteld en bij de Dienst
      Regelingen is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel1
