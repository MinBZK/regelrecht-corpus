articles:
  - number: '1'
    text: |-
      In het kader van deze regeling wordt verstaan onder Dienst Speciale Interventies, hierna te noemen DSI, de
      eigenstandige organisatie van de DSI met daarbij inbegrepen de eenheden die onder operationele aansturing van de
      commandant interventie DSI kunnen worden ingezet.
    url: https://wetten.overheid.nl/BWBR0020016/2013-01-01#Artikel1
  - number: '2'
    text: |-
      Er is een Afstemmingsoverleg voor het stelsel van speciale eenheden, in samenhang met de DSI, hierna te noemen
      het Afstemmingsoverleg.
    url: https://wetten.overheid.nl/BWBR0020016/2013-01-01#Artikel2
  - number: '3'
    text: |-
      1 Het Afstemmingsoverleg is een afstemmingsorgaan, zonder operationele taken, dat aan de betrokken ministers
      adviseert over het beleid en het beheer ten aanzien van het stelsel van speciale eenheden.

      2 De advisering heeft in ieder geval betrekking op:

      a. de beleidsvoorbereiding en -vorming, ten aanzien van de DSI, hetgeen o.a. omvat het beleid ten aanzien van:

        - de personele vulling van de DSI;
        - de opleiding en training van het personeel van de DSI;
        - de inzetcriteria van de DSI;
        - de ondersteuning van de DSI door middelen die niet organiek binnen de DSI zijn ingebracht;
        - de systematiek van evaluatie en auditing;

      b. de vast te stellen begroting van de DSI en overige diensten en onderdelen voor zover van belang voor het
      stelsel;

      c. de vast te stellen jaarplannen van (de eenheden binnen) de DSI;

      d. de vast te stellen beleidsplannen ten aanzien van de DSI;

      e. de vast te stellen jaarverslagen van de DSI;

      f. de afstemming bij de beheercyclus van (de betrokken eenheden binnen) binnen het stelsel;

      g. de voorbereiding en actualisering van de ministeriële regelingen betrekking hebbende op de DSI.
    url: https://wetten.overheid.nl/BWBR0020016/2013-01-01#Artikel3
  - number: '4'
    text: |-
      1 Het Afstemmingsoverleg komt periodiek, tenminste 3 maal per jaar, bijeen;

      2 De advisering aan de betrokken ministers vindt primair plaats op grond van de beoordeling en accordering van de
      opgestelde jaarverslagen en jaar- en beleidsplannen;

      3 Het Afstemmingsoverleg kan, met inachtneming van de bepalingen van dit besluit, haar werkwijze en de taken van
      het secretariaat naar eigen inzicht regelen.
    url: https://wetten.overheid.nl/BWBR0020016/2013-01-01#Artikel4
  - number: '5'
    text: |-
      1 De voorzitter van het overleg is de Coördinator Bewaken en Beveiligen van de Nationaal Coördinator
      Terrorismebestrijding en Veiligheid. Het overleg is voorts samengesteld uit een vertegenwoordiger van:

      a. de korpschef van de politie;

      b. het Directoraat-generaal Politie van het ministerie van Veiligheid en Justitie,

      c. de Directie Juridische Zaken van het ministerie van Defensie;

      d. de Defensiestaf van het ministerie van Defensie en

      e. het landelijk parket van het Openbaar Ministerie.

      2 Het hoofd DSI neemt deel aan het overleg;

      3 Het secretariaat van de commissie berust bij de Nationaal Coördinator Terrorismebestrijding en Veiligheid.
    url: https://wetten.overheid.nl/BWBR0020016/2013-01-01#Artikel5
  - number: '6'
    text: |-
      1 De confidentiële regeling van de Minister van Justitie (nr. R45/99 d.d. 6 juni 2005) houdende instelling van de
      Begeleidingscommissie ten behoeve van de bijzondere bijstandseenheden (BELCOM-BBE) wordt met inwerkingtreding van
      deze regeling ingetrokken;

      2 Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0020016/2013-01-01#Artikel6
  - number: '7'
    text: 'Deze regeling wordt aangehaald als: Instellingsregeling Afstemmingsoverleg stelsel van speciale eenheden.'
    url: https://wetten.overheid.nl/BWBR0020016/2013-01-01#Artikel7
