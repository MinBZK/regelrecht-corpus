        artikel: '19'
  - number: 32a
    text: |-
      1 [Artikel 20 van Boek 2][ref1], zoals dat luidde voor inwerkingtreding van artikel I van de Wet van 23 juni
      2021, tot wijziging van Boek 2 van het Burgerlijk Wetboek ter verruiming van de mogelijkheden tot het verbieden
      van rechtspersonen (Stb. 310), blijft van toepassing ten aanzien van een procedure bij de civiele rechter waarbij
      voor de datum van inwerkingtreding van *dat artikel* een verzoek bij de rechter is ingediend, een beroep bij het
      gerechtshof is ingediend of een verzoek bij de Hoge Raad is ingediend.

      2 [Artikel 20 van Boek 2][ref2], zoals dat luidde voor inwerkingtreding van artikel I van de Wet van 23 juni 2021,
      tot wijziging van Boek 2 van het Burgerlijk Wetboek ter verruiming van de mogelijkheden tot het verbieden van
      rechtspersonen (Stb. 310), blijft tot een bij *koninklijk besluit te bepalen tijdstip* van toepassing ten aanzien
      van politieke partijen alsmede hun neveninstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel20
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '20'
  - number: '33'
    text: |-
      [Artikel 21 van Boek 2][ref1] is mede van toepassing indien de ontbinding van de rechtspersoon is verzocht of
      gevorderd voor het tijdstip van in werking treden van [Boek 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0003045
  - number: '34'
    text: |-
      Het verzoek, bedoeld in [artikel 22 van Boek 2][ref1], kan ook worden gedaan indien de rechtspersoon is ontbonden
      vóór het tijdstip van in werking treden van [Boek 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0003045
  - number: '35'
    text: |-
      1 [Artikel 23 lid 3 van Boek 2][ref1] is mede van toepassing, indien de vereffening van een voor het tijdstip van
      in werking treden van [Boek 2][ref2] ontbonden rechtspersoon geschiedt door niet bij een rechterlijke uitspraak
      benoemde vereffenaars.

      2 [ Artikel 23 laatste lid, van Boek 2][ref3] is mede van toepassing indien de vereffening voor het tijdstip van in
      werking treden van [Boek 2][ref4] is voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0003045
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0003045
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '23'
      - id: ref4
        bwb_id: BWBR0003045
  - number: '36'
    text: |-
      [Artikel 25 van Boek 2][ref1] is mede van toepassing indien de duur is verstreken voor het tijdstip van in werking
      treden van [Boek 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel36
