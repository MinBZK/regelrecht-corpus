  - number: '52'
    text: |-
      1 Ten aanzien van een op het tijdstip van in werking treden van [Boek 2][ref1] bestaande naamloze vennootschap
      of besloten vennootschap met beperkte aansprakelijkheid zijn, tenzij de statuten anders bepalen, de
      [artikelen 105 lid 4][ref2], [119][ref3], [120 leden 1 en 3][ref4], [216 lid 4][ref5], [229][ref6] en
      [230 leden 1 en 3 van Boek 2][ref7] niet van toepassing op feiten die zijn voorgevallen voordat hetzij drie jaren
      na dat tijdstip zijn verstreken hetzij de statuten zijn gewijzigd in verband met een omzetting als bedoeld in de
      [artikelen 72][ref8] of [180 van Boek 2][ref9].

      2 Een opgaaf, voor het tijdstip van inwerkingtreding der wet gedaan ter nakoming van [artikel 52c, eerste
      lid, van het Wetboek van Koophandel](onbekend), geldt voor de toepassing van [artikelen 154][ref10] en
      [264 van Boek 2][ref11] als een opgaaf gedaan krachtens [artikel 153, lid 1][ref12], onderscheidenlijk
      [artikel 263, lid 1 van Boek 2][ref13].

      3 Ten aanzien van een naamloze vennootschap of besloten vennootschap met beperkte aansprakelijkheid waarop
      ingevolge artikel XVIII van de Wet van 2 juli 1928 (*Stb.* 216) of artikel VI van de Wet van 3 mei 1971
      ( *Stb.* 286) voor het tijdstip van in werking treden van [Boek 2](onbekend)[artikel 48a, tweede lid, van het
      Wetboek van Koophandel](onbekend) niet van toepassing of van overeenkomstige toepassing was, is na dat tijdstip
      [artikel 133, lid 2][ref14], onderscheidenlijk [243 lid 2 van Boek 2][ref15] niet van toepassing noch van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel105
