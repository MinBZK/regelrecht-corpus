        artikel: '86'
  - number: '90'
    text: |-
      Levering van een recht als bedoeld in artikel 668 eerste lid van het Burgerlijk Wetboek zoals dit vóór het tijdstip
      van het in werking treden van de wet gold, en voltooid vóór dat tijdstip, werkt jegens een persoon tegen wie het
      moet worden uitgeoefend en ten aanzien van wie vóór dit tijdstip volgens artikel 668 tweede lid de overdracht nog
      geen gevolg had, slechts nadat zij hem overeenkomstig [artikel 94 van Boek 3][ref1] is medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel94
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '94'
  - number: '91'
    text: |-
      1 Voor de levering van een registergoed kan in plaats van een notariële akte een onderhandse akte worden gebezigd,
      indien die akte is opgesteld en mede-ondertekend door een persoon, bedoeld in lid 4, en deze persoon dit in
      het slot der akte heeft verklaard of dit in een door hem ondertekende verklaring aan de voet van de akte heeft
      bevestigd.

      2 Lid 1 is van overeenkomstige toepassing op de akten, bedoeld in de [artikelen 195 lid 1 van Boek 3][ref1],
      [31 lid 1][ref2] en [93 lid 2 van Boek 5][ref3], [250][ref4] en [252 lid 2 van Boek 6][ref5] en
      [800 van Boek 8][ref6].

      3 Een persoon als bedoeld in lid 4 kan de bevoegdheden uitoefenen en de verplichtingen vervullen die bij de
      [titels 1][ref7] en [12 van Boek 7][ref8] aan de notaris zijn toegekend of opgedragen.

      4 Als een persoon, bedoeld in de leden 1 en 3, geldt degene op wie artikel II van de Wet van 28 juni 1956, *Stb.*
      376, tot aan het in werking treden van de wet van toepassing was.

      5 Onze Minister van Justitie kan uit hoofde van het belang van het rechtsverkeer de bevoegdheid van zulk een
      persoon schorsen en intrekken; schorsing en intrekking worden in de *Nederlandse Staatscourant* bekendgemaakt.

      6 De voorwaarden en beperkingen, krachtens artikel II tweede lid van de Wet van 28 juni 1956, *Stb.* 376, destijds
      bij de ministeriële aanwijzing van een persoon gesteld, blijven van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel195
      [ref2]: https://wetten.overheid.nl/BWBR0005288#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0005288#Artikel93
      [ref4]: https://wetten.overheid.nl/BWBR0005289#Artikel250
      [ref5]: https://wetten.overheid.nl/BWBR0005289#Artikel252
      [ref6]: https://wetten.overheid.nl/BWBR0005034#Artikel800
      [ref7]: https://wetten.overheid.nl/BWBR0005290
      [ref8]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel91
