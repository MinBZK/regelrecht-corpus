      - id: ref2
        bwb_id: BWBR0003045
        artikel: '294'
  - number: '56'
    text: |-
      Het fonds waarop van toepassing is de
      [Wet tot invoering van een leeftijdsgrens voor het notarisambt en oprichting van een notarieel pensioenfonds][ref1]
      (Wet van 16 september 1954, *Stb.* 407), is vanaf het tijdstip van in werking treden van [Boek 2][ref2] een
      stichting.


      [ref1]: https://wetten.overheid.nl/BWBR0002143
      [ref2]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002143
      - id: ref2
        bwb_id: BWBR0003045
  - number: '57'
    text: |-
      1 Ontbreekt een notariële akte van oprichting van een in de [artikelen 53-56][ref1] genoemde
      stichting, dan wel van een kerkelijke stichting of voldoet die akte niet aan de vereisten van
      [artikel 286 lid 2, eerste en derde zin, en de leden 3 en 4 van Boek 2][ref2], dan is het bestuur verplicht alsnog
      een notariële akte te doen verlijden die aan deze vereisten voldoet. Een authentiek afschrift van deze akte moet
      door het bestuur worden neergelegd ten kantore van het register bedoeld in [artikel 289 lid 1 van Boek 2][ref3].

      2 Iedere bestuurder is voor een rechtshandeling, waardoor hij een zodanige stichting verbindt, naast de stichting
      hoofdelijk aansprakelijk, indien de rechtshandeling wordt verricht nadat drie jaren sedert het tijdstip van in
      werking treden van [Boek 2][ref4] zijn verstreken en voordat aan het eerste lid is voldaan.

      3 Indien aan de eerste zin van het eerste lid niet is voldaan en drie jaren na het tijdstip van in werking treden
      van [Boek 2][ref5] zijn verstreken, kan de stichting op verzoek van het openbaar ministerie door een beschikking
      van de rechtbank worden ontbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002565#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel286
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel289
      [ref4]: https://wetten.overheid.nl/BWBR0003045
      [ref5]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0002565
        artikel: '53'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '286'
      - id: ref3
