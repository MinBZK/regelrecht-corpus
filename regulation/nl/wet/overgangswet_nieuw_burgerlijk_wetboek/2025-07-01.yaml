  - number: '66'
    text: |-
      1 Gedingen, waarin de inleidende dagvaarding is betekend dan wel het inleidende verzoekschrift is ingediend voor
      het tijdstip van in werking treden van [Boek 2][ref1], worden geheel afgedaan met toepassing van de voorschriften
      van procesrechtelijke aard, die voor dat tijdstip golden.

      2 Het in het vorige lid bepaalde geldt ook voor de afdoening van een eis of verzoek, in het geding bij wege van
      reconventie gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
