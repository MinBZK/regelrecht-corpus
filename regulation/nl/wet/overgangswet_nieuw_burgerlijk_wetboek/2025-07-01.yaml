  - number: '46'
    text: |-
      De [artikelen 48][ref1] en [58 van Boek 2][ref2] zijn niet van toepassing op het jaarverslag en de rekening en
      verantwoording over een boekjaar dat voor het tijdstip van in werking treden van [Boek 2][ref3] is verstreken.


