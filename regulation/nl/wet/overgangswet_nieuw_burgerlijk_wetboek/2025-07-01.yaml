        artikel: '29'
      - id: ref2
        bwb_id: BWBR0003045
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '27'
      - id: ref4
        bwb_id: BWBR0003045
  - number: '41'
    text: |-
      1 Voor een vereniging waarvan de statuten voor het tijdstip van in werking treden van [Boek 2][ref1] zijn
      opgenomen in een of meer notariële akten en die volgens [artikel 53 van Boek 2][ref2] geen coöperatieve vereniging
      of onderlinge waarborgmaatschappij is en ook niet is erkend krachtens de Wet van 22 april 1855, *Stb.* 32, tot
      regeling en beperking der uitoefening van het regt van vereeniging en vergadering gelden de volgende bepalingen.

      2 [Artikel 29 lid 4 van Boek 2][ref3] vindt geen toepassing ten aanzien van rechtshandelingen, verricht voordat
      drie jaren sedert het in werking treden van [Boek 2][ref4] zijn verstreken.

      3 [Artikel 27 lid 6 van Boek 2][ref5] is eerst van toepassing nadat drie jaren sedert het in werking treden van
      [Boek 2][ref6] zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel53
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0003045
      [ref5]: https://wetten.overheid.nl/BWBR0003045#Artikel27
      [ref6]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel41
