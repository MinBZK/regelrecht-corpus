  - number: '22'
    text: |-
      1 [Titel 17 van Boek 1][ref1] is, voor zover bij de wet niet anders is bepaald, van het tijdstip van het in werking
      treden van [Boek 1][ref2] af mede van toepassing op verplichtingen tot en rechten op levensonderhoud, die vóór dat
      tijdstip bij overeenkomst waren geregeld of waren vastgesteld door een uitspraak van de rechter, die hetzij vóór
      dat tijdstip, hetzij, bij gebreke van verzet, hoger beroep of beroep in cassatie, na dat tijdstip in kracht van
      gewijsde is gegaan.

      2 Op vorderingen tot het verstrekken van levensonderhoud, ten aanzien waarvan op het tijdstip van in werking treden
      van [Boek 1][ref3] nog niet is beslist bij een uitspraak van de rechter, die in kracht van gewijsde is gegaan, is
      [titel 17 van Boek 1][ref4] van dat tijdstip af van toepassing, met dien verstande dat over een tijdvak, gelegen
      vóór het tijdstip, niet een hoger bedrag kan worden toegewezen dan naar het gedurende dat tijdvak geldende recht
      geoorloofd was.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
      [ref2]: https://wetten.overheid.nl/BWBR0002656
      [ref3]: https://wetten.overheid.nl/BWBR0002656
      [ref4]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002656
      - id: ref2
        bwb_id: BWBR0002656
      - id: ref3
        bwb_id: BWBR0002656
      - id: ref4
        bwb_id: BWBR0002656
  - number: '23'
    text: |-
      1 Indien verplichtingen tot en rechten op levensonderhoud van grootouders jegens kleinkinderen of van kleinkinderen
      jegens grootouders vóór het tijdstip van in werking treden van [Boek 1][ref1] bij overeenkomst waren geregeld of
      door een uitspraak van de rechter, die in kracht van gewijsde is gegaan, waren vastgesteld, blijven zij ook na
      dat tijdstip in stand, met dien verstande dat op verzoeken tot wijziging van deze rechten en verplichtingen van
      toepassing blijft het recht, geldende ten tijde van hun regeling of vaststelling.

      2 Het vorige lid is van overeenkomstige toepassing op verplichtingen tot en rechten op levensonderhoud van
      schoonouders jegens behuwdkinderen of van behuwdkinderen jegens schoonouders, die niet in overeenstemming zijn met
      het in [artikel 396 van Boek 1][ref2] bepaalde.

      3 Uitspraken van de rechter, gedaan vóór het tijdstip van in werking treden van [Boek 1][ref3], die, bij gebreke
      van hoger beroep of beroep in cassatie, na dat tijdstip in kracht van gewijsde gaan, blijven in stand.

      4 Onverminderd het in [artikel 401 van Boek 1][ref4] bepaalde, kunnen de tot levensonderhoud verplichten, in de
      vorige leden bedoeld, de rechter verzoeken de verplichting tot het verstrekken van levensonderhoud op te heffen met
      ingang van een door de rechter te bepalen tijdstip. Dit tijdstip kan niet vroeger worden gesteld dan zes maanden na
      dat van in werking treden van [Boek 1][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002656
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel396
      [ref3]: https://wetten.overheid.nl/BWBR0002656
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel401
      [ref5]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel23
