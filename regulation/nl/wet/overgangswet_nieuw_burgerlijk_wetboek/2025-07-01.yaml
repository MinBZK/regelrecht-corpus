  - number: '12'
    text: |-
      1 Met betrekking tot inschrijvingen in het huwelijksgoederenregister, vóór het tijdstip van in werking treden
      van [Boek 1][ref1] gedaan, van bepalingen in huwelijkse voorwaarden blijft het tot dat tijdstip geldende
      [artikel 207 lid 1 van het Burgerlijk Wetboek][ref2] van toepassing. Wordt evenwel na dat tijdstip een wijziging
      van die bepalingen ingeschreven, dan is na deze inschrijving [artikel 116 van Boek 1][ref3] op alle bepalingen in
      de huwelijkse voorwaarden van de betrokken echtgenoten van toepassing.

      2 [ Artikel 116 van Boek 1][ref4] is van toepassing op vóór het tijdstip van in werking treden van [Boek 1][ref5]
      gemaakte bepalingen in huwelijkse voorwaarden, die niet vóór dat tijdstip overeenkomstig het tot dat tijdstip
      geldende artikel 207 lid 1 van het Burgerlijk Wetboek in het huwelijksgoederenregister zijn ingeschreven.

      3 [ Artikel 120 lid 2 van Boek 1][ref6] is ook van toepassing op bepalingen in vóór het tijdstip van in werking
      treden van [Boek 1][ref7] tijdens het huwelijk gemaakte of gewijzigde huwelijkse voorwaarden, die niet vóór
      dat tijdstip overeenkomstig het tot dat tijdstip geldende artikel 207 lid 1 van het Burgerlijk Wetboek in het
      huwelijksgoederenregister zijn ingeschreven.

      4 De [artikelen 118][ref8] en [120 lid 1 van Boek 1][ref9] zijn van toepassing op het maken of wijzigen van
      huwelijkse voorwaarden, plaatsvindend na het tijdstip van in werking treden van [Boek 1][ref10], ook indien het
      huwelijk vóór dat tijdstip was voltrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
