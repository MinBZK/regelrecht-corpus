  - number: 190a
    text: |-
      [Afdeling 2B van titel 5 van Boek 6][ref1] en de daarmee samenhangende wijzigingen of invoegingen van
      de [artikelen 5][ref2], [6][ref3], [7][ref4], [9][ref5], [11][ref6], [13][ref7], [19a][ref8] en
      [67 van Boek 7][ref9] door de [Implementatiewet richtlijn consumentenrechten][ref10] (Stb. 2014, 140) zijn niet van
      toepassing op overeenkomsten die voor het tijdstip van het in werking treden van deze wet zijn gesloten. Op deze
      overeenkomsten blijft de tevoren geldende [afdeling 9A van titel 1 van Boek 7 van het Burgerlijk Wetboek][ref11]
      van toepassing.


