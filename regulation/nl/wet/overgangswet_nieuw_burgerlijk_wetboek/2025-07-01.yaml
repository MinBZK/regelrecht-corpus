preamble:
  text: |-
    Wij JULIANA, Bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het eerste boek van het Burgerlijk Wetboek te vervangen
    door Boek 1 van het nieuwe Burgerlijk Wetboek en, in verband daarmede, dit boek alsmede het tweede, derde en vierde
    boek en de slotbepaling van het Burgerlijk Wetboek, het Wetboek van Burgerlijke Rechtsvordering, het Wetboek van
    Strafrecht, het Wetboek van Strafvordering en andere wetten te wijzigen, en overgangsbepalingen vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg dert Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#ArtikelAanhef
articles:
  - number: Inleidende bepaling
    text: |-
      De in deze wet zonder nadere aanduiding aangehaalde bepalingen zijn bepalingen van de nieuwe boeken van het
      Burgerlijk Wetboek.
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#ArtikelInleidende_bepaling
  - number: '1'
    text: |-
      1 [Artikel 4 lid 4 van Boek 1][ref1] is ook van toepassing op aanhangige of nog in te dienen verzoeken tot
      wijziging van voornamen, verkregen vóór het tijdstip van in werking treden van [Boek 1][ref2], met dien verstande
      dat de bevoegdheid van de rechter wordt beoordeeld naar de wet, geldende op het tijdstip van indiening van het
      verzoek.

      2 [ Artikel 4 lid 2 van Boek 1][ref3] is ook van toepassing, indien wijziging wordt verzocht van voornamen,
      verkregen vóór het tijdstip van in werking treden van [Boek 1][ref4].


