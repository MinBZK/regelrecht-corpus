    text: |-
      Na het tijdstip van in werking treden van [Boek 1][ref1] zijn de tevoren geldende artikelen 236-240a, 899a en 949-
      949b van het Burgerlijk Wetboek slechts van toepassing, indien hetzij de hertrouwde echtgenoot, hetzij de nieuwe
      echtgenoot vóór dat tijdstip is overleden.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
