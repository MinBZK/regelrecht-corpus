        artikel: '89'
  - number: 119a
    text: |-
      1 In afwijking van [artikel 68a][ref1] en [artikel 74, leden 2 tot en met 4][ref2], blijven voor
      een rechtsvordering die strekt tot bescherming van gelijksoortige belangen als bedoeld in de
      [artikelen 305a tot en met 305d van Boek 3][ref3] en die is ingesteld voor 1 januari 2020 de voorwaarden van
      toepassing die golden voor die datum.

      2 In afwijking van [artikel 68a][ref4], blijven voor een rechtsvordering die strekt tot bescherming van
      gelijksoortige belangen als bedoeld in de [artikelen 305a tot en met 305d van Boek 3][ref5] en die is ingesteld
      op of na 1 januari 2020 de voorwaarden van toepassing die golden voor die datum voor zover de rechtsvordering
      betrekking heeft op een gebeurtenis of gebeurtenissen die heeft of hebben plaatsgevonden voor 15 november 2016.

      3 Lid 2 is niet van toepassing op een rechtsvordering die strekt tot bescherming van een belang als bedoeld
      in artikel 2, eerste lid, van [Richtlijn (EU) 2020/1828](32020L1828) van het Europees Parlement en de Raad
      van 25 november 2020 betreffende representatieve vorderingen ter bescherming van de collectieve belangen van
      consumenten en tot intrekking van [Richtlijn 2009/22/EG](32009L0022) (PbEU 2020, L 409) en die is ingesteld op of
      na 25 juni 2023.

      4 De wijzigingen van de [artikelen 305a][ref6] en [305c van Boek 3][ref7] door de
      [Implementatiewet richtlijn representatieve vorderingen voor consumenten][ref8] zijn niet van toepassing op
      rechtsvorderingen die voor 25 juni 2023 zijn ingesteld. Op deze rechtsvorderingen blijven de voor die datum
      geldende artikelen 305a en 305c van Boek 3 van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002565#Artikel68a
      [ref2]: https://wetten.overheid.nl/BWBR0002565#Artikel74
