  - number: '8'
    text: |-
      1 Na het tijdstip van in werking treden van [Boek 1][ref1] kan de nietigverklaring van een vóór dat tijdstip
      aangegaan huwelijk niet langer worden gevorderd op een grond die de wet niet meer kent, of door personen die de wet
      tot het instellen van zulk een vordering niet langer bevoegd acht.

      2 De nietigverklaring van een vóór het tijdstip van in werking treden van [Boek 1][ref2] aangegaan huwelijk kan
      wegens het niet bereikt hebben van de vereiste ouderdom slechts worden gevorderd door de echtgenoot die de vereiste
      leeftijd miste, en door het openbaar ministerie.

      3 Het in de vorige leden bepaalde is ook van toepassing, indien de rechtsvordering is ingesteld vóór het in het
      eerste lid genoemde tijdstip en de nietigverklaring niet vóór dat tijdstip is uitgesproken.

      4 Indien het vonnis waarbij een huwelijk wordt nietig verklaard, na het in het eerste lid genoemde tijdstip in
      kracht van gewijsde gaat, is [artikel 77 van Boek 1][ref3] van toepassing, ook al was de rechtsvordering ingesteld
      vóór dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
      [ref2]: https://wetten.overheid.nl/BWBR0002656
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel77
