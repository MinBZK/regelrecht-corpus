        afdeling: '3'
  - number: 190aa
    text: |-
      1 [Afdeling 2ab van titel 5][ref1] is niet van toepassing op e-handelsdiensten die voor het tijdstip van
      inwerkingtreding van die afdeling zijn verricht.

      2 Dienstverleners als bedoeld in [artikel 230fa van Boek 6][ref2] kunnen tot en met 27 juni 2030 hun diensten
      blijven verrichten met gebruikmaking van de producten die zij vóór 28 juni 2030 al rechtmatig gebruikten bij het
      verlenen van vergelijkbare diensten.

      3 Dienstverleningsovereenkomsten die door middel van e-handelsdiensten gesloten zijn vóór 28 juni 2025 kunnen
      ongewijzigd doorlopen totdat zij verstrijken, evenwel uiterlijk tot vijf jaar na die datum.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Afdeling2ab
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel230fa
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel190aa
