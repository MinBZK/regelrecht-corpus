  - number: '253'
    text: |-
      1 Op voortbewegingswerktuigen en andere machinerieën die tot aan het tijdstip van het in werking treden
      van [Boek 8][ref1] nog geen bestanddeel van een schip waren en aan een ander dan de eigenaar van het schip
      toebehoorden, wordt [artikel 1 lid 3 van Boek 8][ref2] niet van toepassing.

      2 Zaken die tot aan het in werking treden van [Boek 8][ref3] als scheepstoebehoren met hypotheek
      waren bezwaard, blijven nadien daarmede belast, indien zij geen scheepstoebehoren in de zin van
      [artikel 1 lid 4 van Boek 8][ref4] worden, zolang zij voldoen aan de omschrijving van het tevoren geldende
      [artikel 309 derde lid van het Wetboek van Koophandel][ref5].

      3 Zaken die tot aan het tijdstip van het in werking treden van [Boek 8][ref6] scheepstoebehoren waren en als
      zodanig waren begrepen in een beslag of executie, blijven, ook nadat zij zelfstandig zijn geworden, daaronder
      begrepen en gelden, zolang beslag en executie duren, tot aan de levering aan de koper als scheepstoebehoren.

      4 Het bepaalde in [artikel 1 lid 5 van Boek 8][ref7] wordt drie maanden na het in werking treden van [Boek 8][ref8]
      van toepassing op bedingen die voordien reeds tussen partijen bestonden, alsook ten aanzien van zaken die door het
      in werking treden van Boek 8 scheepstoebehoren worden.


      [ref1]: https://wetten.overheid.nl/BWBR0005034
