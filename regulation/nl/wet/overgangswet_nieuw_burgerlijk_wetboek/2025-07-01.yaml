  - number: '50'
    text: |-
      Zolang de statutaire naam van een naamloze vennootschap, opgericht voor het in werking treden van de Wet van 2 juli
      1928 (*Stb.* 216), niet in overeenstemming is met [artikel 66 lid 2 van Boek 2][ref1] worden de letters N.V. aan de
      naam toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel66
