        artikel: '289'
      - id: ref4
        bwb_id: BWBR0003045
      - id: ref5
        bwb_id: BWBR0003045
  - number: '58'
    text: |-
      1 De instellingen bedoeld in de Koninklijke besluiten van 26 december 1818, *Stb.* 48, 2 december 1823, *Stb.* 49,
      en 12 februari 1829, *Stb.* 3, zijn stichtingen vanaf het tijdstip van in werking treden van [Boek 2][ref1].

      2 Het bestuur van een in het eerste lid genoemde stichting is verplicht een notariële akte te laten verlijden
      waarin de statuten zijn opgenomen.

      3 De notaris verlijdt deze akte niet voordat Onze Minister van Onderwijs en Wetenschappen heeft verklaard geen
      bezwaar te hebben tegen de in de akte op te nemen statuten.

      4 De akte moet voldoen aan de vereisten van
      [artikel 286, lid 2, eerste en derde zin, en de leden 3 en 4 van Boek 2][ref2]. De tweede zin van
      [artikel 57, lid 1][ref3], en de leden 2 en 3 van dat artikel zijn van overeenkomstige toepassing.

      5 Totdat aan de verplichting van het tweede lid is voldaan blijven op de stichting van toepassing de in het eerste
      lid genoemde Koninklijke besluiten, met uitzondering, voor zover op bestuurders betrekking hebbend, van artikel 1,
      tweede zin, artikel 15, tweede lid, en artikel 26 van het Koninklijk besluit van 2 december 1823.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel286
      [ref3]: https://wetten.overheid.nl/BWBR0002565#Artikel57
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '286'
      - id: ref3
        bwb_id: BWBR0002565
        artikel: '57'
  - number: '59'
    text: |-
      Bij de inschrijving in het register bedoeld in [artikel 289 lid 1 van Boek 2][ref1] van een op het tijdstip van
      in werking treden van [Boek 2][ref2] bestaande stichting die is ingeschreven in het openbaar centraal register
      bedoeld in artikel 7 lid 1 van de Wet op stichtingen, leggen de bestuurders een authentiek afschrift van de akte
      van oprichting dan wel een gewaarmerkt exemplaar van de statuten ten kantore van het register neer.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel289
      [ref2]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '289'
      - id: ref2
        bwb_id: BWBR0003045
  - number: '60'
    text: |-
      [Artikel 289 lid 4 van Boek 2][ref1] vindt op de bestuurders van een stichting, als bedoeld in [artikel 57][ref2],
      [58][ref3] of [59][ref4] geen toepassing ten aanzien van rechtshandelingen, verricht voordat drie jaren sedert het
      in werking treden van [Boek 2][ref5] zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel289
      [ref2]: https://wetten.overheid.nl/BWBR0002565#Artikel57
      [ref3]: https://wetten.overheid.nl/BWBR0002565#Artikel58
      [ref4]: https://wetten.overheid.nl/BWBR0002565#Artikel59
      [ref5]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '289'
      - id: ref2
        bwb_id: BWBR0002565
        artikel: '57'
      - id: ref3
        bwb_id: BWBR0002565
        artikel: '58'
      - id: ref4
        bwb_id: BWBR0002565
        artikel: '59'
      - id: ref5
        bwb_id: BWBR0003045
  - number: '61'
    text: |-
      Op een stichting ten aanzien waarvan artikel 25 van de Wet op stichtingen van toepassing was doch niet is
      nageleefd, is [artikel 57][ref1] van overeenkomstige toepassing, met dien verstande, dat de hoofdelijke
      aansprakelijkheid als bedoeld in het tweede lid ook bestaat voor rechtshandelingen, verricht binnen drie jaren na
      het tijdstip van in werking treden van [Boek 2][ref2], en dat de ontbinding als bedoeld in het derde lid ook binnen
      die termijn kan worden gevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0002565#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0002565
        artikel: '57'
      - id: ref2
        bwb_id: BWBR0003045
  - number: '62'
    text: |-
      Een op het tijdstip van in werking treden van [Boek 2][ref1] als rechtspersoon optredend lichaam dat na 1 januari
      1957 is opgericht en waarop de Wet op stichtingen van toepassing was, doch waarvan de akte van oprichting niet
      voldoet aan de vereisten van artikel 3 leden 2 en 3 van die wet, is vanaf dat tijdstip een stichting.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: '63'
    text: |-
      Ten aanzien van op het tijdstip van in werking treden van [Boek 2][ref1] bestaande stichtingen zijn, tenzij de
      statuten anders bepalen, de [artikelen 291 lid 2][ref2] en [292 leden 1-3 van Boek 2][ref3] niet van toepassing op
      feiten die zijn voorgevallen voordat drie jaren na dat tijdstip zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel291
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel292
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '291'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '292'
  - number: '64'
    text: |-
      Ten aanzien van een coöperatieve vereniging en een onderlinge waarborgmaatschappij, waarop de Wet op de
      jaarrekening van ondernemingen niet van toepassing was, is [titel 6 van Boek 2][ref1] niet van toepassing op de
      jaarrekening die betrekking heeft op een boekjaar dat voor het tijdstip van in werking treden van [Boek 2][ref2]
      is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0003045
  - number: '65'
    text: |-
      1 Ten aanzien van een op het tijdstip van in werking treden van [Boek 2](onbekend) bestaande naamloze vennootschap,
      besloten vennootschap met beperkte aansprakelijkheid, coöperatieve vereniging of onderlinge waarborgmaatschappij,
      waarvan geen onderneming in het Handelsregister is ingeschreven bij de Kamer van Koophandel in welker rechtsgebied
      de statutaire zetel gevestigd is, blijft gedurende drie jaren na dat tijdstip de omstandigheid dat de rechtspersoon
      niet is ingeschreven, buiten beschouwing bij de toepassing van [artikel 5 leden 2 en 4 van Boek 2][ref1] en de
      artikelen 31 en 34 van de Handelsregisterwet.

      2 Wegens het ontbreken van de in [artikel 57 van Boek 2][ref2] in verband met [artikel 29 lid 4 van Boek 2][ref3]
      of de in [artikel 69 lid 2][ref4] of [artikel 180 lid 2 van Boek 2][ref5] bedoelde inschrijving in het
      Handelsregister van een in het eerste lid bedoelde rechtspersoon ontstaat geen aansprakelijkheid van een bestuurder
      als in die bepalingen bedoeld, indien de onderneming van die rechtspersoon op het tijdstip van in werking treden
      van [Boek 2][ref6] in het Handelsregister was ingeschreven.

      3 Ten aanzien van een in het eerste lid bedoelde naamloze vennootschap of besloten vennootschap met beperkte
      aansprakelijkheid wordt in afwijking van de [artikelen 77][ref7] en [188 van Boek 2][ref8] in de [titels 3][ref9]
      en [4 van dat boek][ref10] onder het kantoor van het Handelsregister verstaan het kantoor waar de onderneming van
      de vennootschap volgens het Handelsregister gevestigd is totdat hetzij de inschrijving van de rechtspersoon is
      geschied hetzij drie jaren na het in werking treden van [Boek 2][ref11] zijn verstreken.


