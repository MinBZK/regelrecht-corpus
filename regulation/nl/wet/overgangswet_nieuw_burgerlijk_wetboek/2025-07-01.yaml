      - id: ref2
        bwb_id: BWBR0002656
  - number: '25'
    text: |-
      Ingeval vóór het tijdstip van in werking treden van [Boek 1][ref1] een bewindvoerder over de goederen van een
      afwezige is benoemd, blijft ook na dat tijdstip op de rechtsgevolgen daarvan het ten tijde van de benoeming
      geldende recht van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002656
  - number: '26'
    text: |-
      1 Ingeval vóór het tijdstip van in werking treden van [Boek 1][ref1] een verklaring van vermoedelijk overlijden is
      uitgesproken, blijft ook na dat tijdstip op de rechtsgevolgen daarvan het voordien geldende recht van toepassing.

      2 Indien in een geding tot het verkrijgen van een verklaring van vermoedelijk overlijden het inleidende
      verzoekschrift is ingediend doch nog geen einduitspraak is gedaan vóór het tijdstip van in werking treden van
      [Boek 1][ref2], zijn de [artikelen 413-425 van Boek 1][ref3], alsmede de desbetreffende bepalingen van het
      [Wetboek van Burgerlijke Rechtsvordering][ref4] van toepassing, te beginnen met de eerste na dat tijdstip volgende
      uitspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
      [ref2]: https://wetten.overheid.nl/BWBR0002656
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel413
      [ref4]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002656
