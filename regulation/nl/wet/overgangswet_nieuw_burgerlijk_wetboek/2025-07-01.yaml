  - number: '18'
    text: |-
      1 Een kind dat, naar de vóór het tijdstip van in werking treden van [Boek 1][ref1] geldende voorschriften, met
      zijn moeder niet in burgerlijke betrekkingen stond, staat van dat tijdstip af van rechtswege onder voogdij van de
      moeder, mits deze daartoe op dat tijdstip bevoegd is en tenzij voordien een ander tot voogd benoemd was.

      2 De moeder van een kind, als in het eerste lid bedoeld, die op het aldaar genoemde tijdstip onbevoegd was tot de
      voogdij over het kind, verkrijgt deze voogdij van rechtswege, indien deze openstaat op het tijdstip, waarop zij
      daartoe bevoegd wordt.

      3 Indien op het in het eerste lid genoemde tijdstip de voogdij niet openstaat, kan de tot de voogdij
      bevoegde moeder de kantonrechter verzoeken haar tot voogdes te benoemen; op een zodanig verzoek is
      [artikel 287 leden 4 en 5 van Boek 1][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel287
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel18
