        artikel: '254'
  - number: '194'
    text: |-
      Van het tijdstip van het in werking treden van de wet af is [artikel 257][ref1] van toepassing op een
      ondergeschikte wiens gedraging vóór dat tijdstip tot aansprakelijkheid heeft geleid.


      [ref1]: https://wetten.overheid.nl/BWBR0002565#Artikel257
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel194
    references:
