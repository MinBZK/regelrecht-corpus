        artikel: '81'
  - number: 85a
    text: |-
      De nietigheid, bedoeld in [artikel 83, derde lid, tweede zin, van Boek 3 van het Burgerlijk Wetboek][ref1]
      geldt, in afwijking van [artikel 79][ref2], voor bestaande bedingen vanaf drie maanden na het tijdstip van
      inwerkingtreding van de [Wet opheffing verpandingsverboden][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0002565#Artikel79
