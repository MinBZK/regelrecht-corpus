      [artikel 10 van de Uitvoeringswet huurprijzen woonruimte][ref7] geldende maximale huurprijs die lager is dan het
      bedrag, genoemd in [artikel 13, eerste lid, onder a, van de Wet op de huurtoeslag][ref8].


