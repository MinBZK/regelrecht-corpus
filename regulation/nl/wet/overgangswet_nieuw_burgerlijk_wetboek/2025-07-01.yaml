  - number: '42'
    text: |-
      1 Ontbreekt een notariële akte van oprichting van een op het tijdstip van in werking treden van
      [Boek 2][ref1] bestaande vereniging die op grond van [artikel 53 van Boek 2][ref2] een coöperatieve
      vereniging of onderlinge waarborgmaatschappij is, of voldoet die akte niet aan de vereisten van
      [artikel 27 lid 2, eerste zin, en de leden 3 en 4][ref3], en van [artikel 54 lid 2 van Boek 2][ref4], dan is de
      vereniging verplicht alsnog een notariële akte te doen verlijden die aan deze vereisten voldoet.

      2 Deze notariële akte moet worden bekendgemaakt op de wijze, door [titel 2 van Boek 2][ref5] voorgeschreven voor
      een akte van oprichting.

      3 Iedere bestuurder is voor een rechtshandeling, waardoor hij een in het eerste lid bedoelde vereniging verbindt,
      naast de vereniging hoofdelijk aansprakelijk, indien de rechtshandeling wordt verricht nadat drie jaren sedert
      het tijdstip van in werking treden van [Boek 2][ref6] zijn verstreken en voordat aan het eerste en tweede lid is
      voldaan.

      4 Indien aan het eerste lid niet is voldaan en drie jaren na het tijdstip van in werking treden van [Boek 2][ref7]
      zijn verstreken, kan de vereniging op verzoek van het openbaar ministerie door een beschikking van de rechtbank
      worden ontbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel53
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel54
      [ref5]: https://wetten.overheid.nl/BWBR0003045
      [ref6]: https://wetten.overheid.nl/BWBR0003045
      [ref7]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel42
    references:
