      - id: ref2
        bwb_id: BWBR0003045
  - number: '30'
    text: |-
      Vanaf het tijdstip van in werking treden van [Boek 2][ref1] zijn de bepalingen van dit boek die de gevolgen regelen
      van gebreken in de oprichtingshandeling van een rechtspersoon, mede van toepassing op een lichaam dat ten tijde van
      het in werking treden van Boek 2 als rechtspersoon optreedt.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: '31'
    text: |-
      [Artikel 5 leden 2 en 4 van Boek 2][ref1] is gedurende drie jaren na het tijdstip van in werking treden van
      [Boek 2][ref2] niet van toepassing ten aanzien van een niet overeenkomstig de bepalingen van Boek 2 ingeschreven:

      a. vereniging die op dat tijdstip bestaat en niet een coöperatieve vereniging of onderlinge waarborgmaatschappij
      is;

      b. rechtspersoon die vanaf dat tijdstip ingevolge [artikel 48][ref3] of [49][ref4] een onderlinge
      waarborgmaatschappij is;

      c. stichting die op dat tijdstip bestaat en is ingeschreven in het openbaar centraal register bedoeld in artikel 7
      lid 1 van de Wet op stichtingen;

      d. rechtspersoon die vanaf dat tijdstip ingevolge de [artikelen 53-56][ref5] of [58][ref6] een stichting is.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003045
      [ref3]: https://wetten.overheid.nl/BWBR0002565#Artikel48
      [ref4]: https://wetten.overheid.nl/BWBR0002565#Artikel49
      [ref5]: https://wetten.overheid.nl/BWBR0002565#Artikel53
      [ref6]: https://wetten.overheid.nl/BWBR0002565#Artikel58
