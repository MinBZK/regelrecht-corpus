        artikel: '27'
  - number: '156'
    text: |-
      Uitbreiding van de territoriale zee na het in werking treden van de wet zal niet tot gevolg hebben dat de eigendom
      van haar bodem de alsdan daarmede duurzaam verenigde gebouwen en werken zal gaan omvatten.
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel156
  - number: '157'
    text: |-
      Van drie jaren na het tijdstip van het in werking treden van de wet af bepalen de [artikelen 29][ref1] en
      [34 van Boek 5][ref2] wie alsdan eigenaar is van de stroken grond langs de oeverlijn van een water, tenzij
      vóór dat tijdstip de grens bij delimitatieovereenkomst is vastgelegd of nadien [artikel 31 van Boek 5][ref3]
      toepassing heeft gevonden, dan wel een vordering tot vastlegging als bedoeld in [artikel 32 van dat Boek][ref4] is
      ingesteld. [Artikel 30 van Boek 5][ref5] is van overeenkomstige toepassing op de vastlegging van een grens door een
      delimitatieovereenkomst die vóór het in werking treden van de wet is gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0005288#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0005288#Artikel31
      [ref4]: https://wetten.overheid.nl/BWBR0005288#Artikel32
      [ref5]: https://wetten.overheid.nl/BWBR0005288#Artikel30
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0005288
        artikel: '34'
      - id: ref3
        bwb_id: BWBR0005288
        artikel: '31'
      - id: ref4
        bwb_id: BWBR0005288
        artikel: '32'
      - id: ref5
        bwb_id: BWBR0005288
        artikel: '30'
  - number: '158'
    text: |-
      [Artikel 35 van Boek 5][ref1] is niet van toepassing op uitbreiding van een duin ten gevolge van overstuiving door
      de wind vóór het in werking treden van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel35
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '35'
  - number: '159'
    text: |-
      Van haar in werking treden af, doch alleen voor het vervolg, gelden de bepalingen der wet voor de verplichtingen
      uit het burenrecht.
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel159
  - number: '160'
    text: |-
      Het in werking treden van de wet brengt geen wijziging in de rechten, bevoegdheden en verplichtingen met betrekking
      tot een buurweg welke voordien is ontstaan; [artikel 24 lid 1 van Boek 3][ref1] is niet van toepassing op de
      bestemming tot zulk een buurweg.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel24
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '24'
  - number: '161'
    text: |-
      De eigenaar van een erf is, tenzij een beperkt recht iets anders meebrengt, verplicht op vordering van een
      nabuur de ten tijde van het in werking treden van de wet bestaande toestand in overeenstemming te brengen met
      hetgeen waarop die nabuur nadien op grond van [titel 4 van Boek 5][ref1] aanspraak kan maken. Is die toestand
      echter in overeenstemming met het voordien geldende recht, dan kan de eigenaar van het erf verlangen dat de
      wijziging niet wordt aangebracht dan op kosten van de nabuur en tegen vooraf door deze te betalen of te verzekeren
      schadevergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0005288
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel161
    references:
      - id: ref1
        bwb_id: BWBR0005288
  - number: '162'
    text: |-
      Bij het in werking treden van de wet bestaat mandeligheid, indien alsdan reeds is voldaan aan de vereisten
      die [artikel 60 van Boek 5][ref1] aan het ontstaan daarvan stelt. Op dat tijdstip is een scheidsmuur, een
      hek of een heg gemeenschappelijk eigendom en mandelig, indien alsdan aan de vereisten daarvoor volgens
      [artikel 62 van Boek 5][ref2] is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0005288#Artikel62
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel162
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '60'
      - id: ref2
        bwb_id: BWBR0005288
        artikel: '62'
  - number: '163'
    text: |-
      Indien vóór het in werking treden van de wet een erfdienstbaarheid door bestemming of herleving is ontstaan, kan
      dit ontstaan worden ingeschreven in de openbare registers, bedoeld in [afdeling 2 van titel 1 van Boek 3][ref1].
      Op het ontbreken van de inschrijving en op inschrijfbare feiten die vóór het in werking treden van de
      wet zijn voorgevallen, en die betreffen rechten die niet uit de openbare registers kenbaar zijn, is
      [artikel 24 lid 1 van Boek 3][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel24
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '24'
  - number: '164'
    text: |-
      Indien een erf vóór het in werking treden van de wet aan twee of meer personen, hetzij als deelgenoten, hetzij als
      eigenaars van verschillende gedeelten daarvan, toebehoort, wordt [artikel 77 lid 1 van Boek 5][ref1] op hen van
      toepassing met betrekking tot geldelijke verplichtingen die na het in werking treden van de wet ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel77
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '77'
  - number: '165'
    text: |-
      Een erfdienstbaarheid die op het tijdstip van het in werking treden van de wet reeds bestond, kan niet uit hoofde
      van [artikel 78 van Boek 5][ref1] worden opgeheven. In geval van een vordering tot wijziging houdt de rechter geen
      rekening met omstandigheden die zich vóór dat tijdstip hebben voorgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel78
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel165
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '78'
  - number: '166'
    text: |-
      Op een erfpacht, aangevangen vóór het tijdstip van het in werking treden van de wet, blijft artikel 766 van het
      vóór dat tijdstip geldende Burgerlijk Wetboek van overeenkomstige toepassing; de opzegging moet echter bij exploit
      geschieden.
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel166
  - number: '167'
    text: |-
      Een erfpachter kan een erfpacht die op het tijdstip van het in werking treden van de wet bestaat, slechts opzeggen
      voor zover hij naar het voordien geldende recht tot opzegging of eenzijdige afstand zou zijn bevoegd geweest.
      [Artikel 88 van Boek 5][ref1] is van toepassing, behalve voor zover een andere termijn voor de opzegging of afstand
      was bedongen.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel88
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel167
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '88'
  - number: '168'
    text: |-
      Indien een erfpacht vóór het in werking treden van de wet aan twee of meer personen, hetzij als deelgenoten,
      hetzij als eigenaars van verschillende gedeelten van de zaak, toebehoort, wordt [artikel 92 lid 1 van Boek 5][ref1]
      voor het eerst van toepassing met betrekking tot de eerste canon die na het in werking treden van de wet wordt
      verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel92
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel168
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '92'
  - number: '169'
    text: |-
      Een erfpacht die op het tijdstip van het in werking treden van de wet reeds bestond, kan niet uit hoofde van
      [artikel 97 lid 1 van Boek 5][ref1] worden opgeheven. In geval van een vordering tot wijziging houdt de rechter
      geen rekening met omstandigheden die zich vóór dit tijdstip hebben voorgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel97
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel169
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '97'
  - number: '170'
    text: |-
      [Artikel 99 van Boek 5][ref1] is niet van toepassing op een erfpacht die ten tijde van het in werking treden van de
      wet bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel99
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '99'
  - number: '171'
    text: |-
      De [artikelen 166-169][ref1] zijn van overeenkomstige toepassing op een recht van opstal in dezelfde gevallen
      waarin die artikelen op een recht van erfpacht van toepassing zijn en voor zover het opstalrecht aan de daar
      bedoelde regels voor erfpacht is onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0002565#Artikel166
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0002565
        artikel: '166'
  - number: '172'
    text: |-
      1 [Artikel 110 van Boek 5][ref1] is, te rekenen vanaf het in werking treden van de wet, mede van toepassing op een
      splitsing die voordien heeft plaatsgevonden.

      2 Voor zover de bepalingen van de akte van splitsing in appartementsrechten, het reglement bedoeld in
      [artikel 111 onder ][ref2] daaronder begrepen, van een vereniging van eigenaars op het tijdstip van in werking
      treden van de wet afwijken van het bepaalde in [afdeling 2 van titel 9 van dat boek][ref3], is dat laatste
      gedurende drie jaren na dat tijdstip niet van toepassing op die vereniging van eigenaars.

      3 Op de vereffening van het vermogen van een vereniging van eigenaars, die nog niet is voltooid op het tijdstip
      van het in werking treden van de wet, zijn de [artikelen 23-24 van Boek 2 van het Burgerlijk Wetboek][ref4] met
      inachtneming van [artikel 147 leden 2-4 van Boek 5][ref5] van toepassing, behalve voor zover dat zou nopen tot
      het ongedaan maken van alsdan reeds in overeenstemming met het voordien geldend recht getroffen maatregelen. De
      wet wordt niet van toepassing ten aanzien van onderwerpen waaromtrent vóór haar in werking treden een rechterlijke
      uitspraak is gevraagd.

      4 Op een splitsing die heeft plaatsgevonden voor het tijdstip waarop de wet in werking treedt, is
      [artikel 113 lid 1, tweede zin, van Boek 5][ref6] niet van toepassing.

      5 Op een splitsing die heeft plaatsgevonden voor het tijdstip waarop de wet in werking treedt, is
      [artikel 118a van Boek 5][ref7] gedurende drie jaren na dat tijdstip niet van toepassing.

      6 Op verenigingen van eigenaars die op het tijdstip van het in werking treden van de wet niet het in
      [artikel 126 lid 1, tweede volzin, van Boek 5][ref8], bedoelde reservefonds in stand houden, is die bepaling
      gedurende drie jaren na dat tijdstip niet van toepassing.

      7 Op verenigingen van eigenaars die op het tijdstip van het in werking treden
      van de [Wet verbetering functioneren verenigingen van eigenaars][ref9] niet de in
      [artikel 126 lid 2 en lid 3 van Boek 5][ref10] bedoelde jaarlijkse reservering ten behoeve van het reservefonds
      doen, is die bepaling gedurende drie jaren na dat tijdstip niet van toepassing.

      8 Op de rechtsverhouding tussen verenigingen van eigenaars en derden die voor het tijdstip van het in werking
      treden van de [Wet verbetering functioneren verenigingen van eigenaars][ref11] een overeenkomst van geldlening
      hebben gesloten, blijven de [artikelen 113 leden 5 en 6][ref12], [122 lid 2, tweede volzin][ref13], van toepassing
      zoals deze luidden voor inwerkingtreding van die wet.

      9 Op een splitsing die heeft plaatsgevonden voor het tijdstip van het in werking treden van de
      [leden 1–3 van artikel 139 van Boek 5][ref14], zoals deze leden zijn gewijzigd bij de Wet van 19 februari 2005,
      houdende wijziging van [titel 5.9 (Appartementsrechten][ref15] (Stb. 89), is het in die leden bepaalde gedurende
      drie jaren na dat tijdstip niet van toepassing.


