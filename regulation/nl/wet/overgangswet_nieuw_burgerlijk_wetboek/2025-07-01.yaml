    text: |-
      1 De [artikelen 928][ref1], [931][ref2], [950][ref3], [952][ref4], [963 leden 5 en 6][ref5] en
      [966 lid 4 van Boek 7][ref6] zijn niet van toepassing op overeenkomsten van verzekering die vóór het tijdstip van
      het in werking treden van de wet zijn gesloten. Indien de voorwaarden van de overeenkomst door de verzekeraar met
      het oog op het in werking treden van de wet dan wel op of na het tijdstip van het in werking treden van de wet
      zijn gewijzigd, is het in de eerste zin bepaalde voor de [leden 5 en 6 van artikel 963 van Boek 7][ref7] niet van
      toepassing op nadien genomen maatregelen als bedoeld in [artikel 957 van Boek 7][ref8].

      2 De [artikelen 929][ref9] en [930 van Boek 7][ref10] zijn niet van toepassing op overeenkomsten van verzekering
      die vóór het tijdstip van het in werking treden van de wet zijn gesloten, indien de verzekeraar zich tegenover
      de verzekerde binnen een jaar nadat dit tijdstip is verstreken erop beroept dat aan de mededelingsplicht van
      [artikel 251 van het Wetboek van Koophandel][ref11] niet is voldaan.

      3 De [artikelen 935][ref12], [936 leden 2 tot en met 6][ref13] en [937 van Boek 7][ref14] zijn niet van toepassing
      met betrekking tot een uitkering die vóór het tijdstip van het in werking treden van de wet verschuldigd is
      geworden.

      4 [Artikel 940 lid 1 onderscheidenlijk lid 2 van Boek 7][ref15] is van toepassing indien een periode als in die
      leden bedoeld eindigt na het tijdstip van het in werking treden van de wet.

      5 [Artikel 948 van Boek 7][ref16] is niet van toepassing indien een overgang van het risico vóór het tijdstip van
      het in werking treden van de wet heeft plaatsgevonden.

      6 [Artikel 954 van Boek 7][ref17] is niet van toepassing voorzover een uitkering vóór het tijdstip van het in
      werking treden van de wet is voldaan.

      7 Ter zake van schade die door meer dan een verzekering wordt gedekt kan de verzekeraar wiens
      verzekering vóór het tijdstip van het in werking treden van de wet is gesloten niet op de voet van
      [artikel 961 lid 1, eerste zin, van Boek 7][ref18] worden aangesproken dan voorzover zulks ook op grond van
      het tevoren geldende recht mogelijk was geweest. De eerste zin lijdt uitzondering indien de voorwaarden van de
      overeenkomst door de verzekeraar met het oog op het in werking treden van de wet dan wel op of na het tijdstip van
      het in werking treden van de wet zijn gewijzigd, doch slechts voorzover het risico zich nadien heeft verwezenlijkt.

      8 [Artikel 962 lid 3 van Boek 7][ref19] is niet van toepassing indien het risico zich vóór het tijdstip van het in
      werking treden van de wet heeft verwezenlijkt.

      9 Op verzekeringen tegen gevaren van brand die vóór het tijdstip van het in werking treden van de wet zijn
      gesloten, blijft het tevoren geldende [artikel 293 van het Wetboek van Koophandel][ref20] ook na dit tijdstip van
      toepassing.

      10 Indien vóór het tijdstip van het in werking treden van de wet tegen een verzekeraar een rechtsvordering tot het
      doen van een uitkering is ontstaan, is [artikel 942 lid 3 van Boek 7][ref21] slechts van toepassing indien na dat
      tijdstip een daad van onderhandeling plaatsvindt.


