  - number: '271'
    text: |-
      1 De [artikelen 35][ref1], [36][ref2], [39][ref3], [40][ref4] en
      [41 van Boek 10,][ref5] zoals die luidden voor inwerkingtreding van de
      __REF005___________________________________________________________________________________________________________
      ______________________, blijven van toepassing voor het bepalen van het toepasselijke recht op rechtsbetrekkingen
      tussen de echtgenoten, indien deze rechtsbetrekkingen op of na 1 januari 1994 maar voor 29 januari 2019 bestonden.

      2 Het opschrift van [Titel 3, Afdeling 3][ref7], en de [artikelen 42 tot en met 48][ref8],
      [50][ref9], [51][ref10], [52 van Boek 10][ref11], zoals die luidden voor inwerkingtreding van de
      __REF005___________________________________________________________________________________________________________
      _______________________, blijven van toepassing op het huwelijksvermogensregime van echtgenoten, die op of
      na 1 september 1992 maar voor 29 januari 2019 in het huwelijk zijn getreden, tenzij deze echtgenoten op of na
      29 januari 2019 het op hun huwelijksvermogensstelsel toepasselijke recht bepalen.

      3 De [artikelen 64][ref13], [65][ref14], [67][ref15], [68][ref16] en
      [69 van Boek 10][ref17], zoals die luidden voor inwerkingtreding van de
      __REF005___________________________________________________________________________________________________________
      _______________________, blijven van toepassing op rechtsbetrekkingen tussen de partners die voor 29 januari
      2019 een geregistreerd partnerschap zijn aangegaan, tenzij deze partners op of na 29 januari 2019 het op de
      vermogensrechtelijke gevolgen van hun geregistreerd partnerschap toepasselijke recht bepalen.

      4 Het opschrift van [Titel 4, Afdeling 4][ref19], en de [artikelen 70 tot en met 82][ref20],
      [84 van Boek 10][ref21], zoals die luidden voor inwerkingtreding van de
      __REF003___________________________________________________________________________________________________________
      _______________________, blijven van toepassing op het vermogensregime van partners die voor 29 januari
      2019 een geregistreerd partnerschap zijn aangegaan, tenzij deze partners op of na 29 januari 2019 het op de
      vermogensrechtelijke gevolgen van hun geregistreerd partnerschap toepasselijke recht bepalen.


