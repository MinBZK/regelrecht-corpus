        artikel: '258'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '259'
  - number: '196'
    text: |-
      1 Op overeenkomsten van koop en ruil die vóór het tijdstip van het in werking treden van de wet zijn gesloten,
      wordt [titel 1 van Boek 7][ref1] een jaar na dat tijdstip van toepassing.

      2 In afwijking van lid 1 worden de bepalingen van [titel 1 van Boek 7][ref2] omtrent consumentenkoop niet van
      toepassing op een consumentenkoop die vóór dat tijdstip is gesloten.

      3 In afwijking van de leden 1 en 2 is [titel 1 van Boek 7][ref3] van toepassing op de gevolgen van niet
      nakoming in het geval dat een der partijen na het in werking treden van de wet in de nakoming van een van
      haar verbintenissen tekortschiet, tenzij dat tekortschieten een voortzetting van een eerdere tekortkoming is.
      [Afdeling 8 van titel 1 van Boek 7][ref4] is van toepassing op het recht van reclame dat na het in werking treden
      van de wet wordt uitgeoefend; is het voordien uitgeoefend, dan blijft het tevoren geldende recht daarop van
      toepassing.

      4 [Artikel 7][ref5] is slechts van toepassing op de gevolgen van toezending van een zaak of verrichting van een
      dienst die na het in werking treden van de wet geschiedt.

      5 [Artikel 6a van Boek 7][ref6] is niet van toepassing in geval van een consumentenkoop die vóór het in werking
      treden van de wet is gesloten.

      6 In afwijking van [artikel 79][ref7] kan een beding op grond van strijd met [artikel 25 lid 2 van Boek 7][ref8]
      worden vernietigd nadat een jaar na het tijdstip van het in werking treden van de wet is verstreken; deze
      vernietiging heeft evenwel geen werking ten aanzien van zaken die vóór het verstrijken van deze termijn aan de
      verkoper zijn geleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0005290
      [ref2]: https://wetten.overheid.nl/BWBR0005290
      [ref3]: https://wetten.overheid.nl/BWBR0005290
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Afdeling8
