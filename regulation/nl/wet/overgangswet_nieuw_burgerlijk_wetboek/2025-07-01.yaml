  - number: 196a
    text: |-
      De wijzigingen in [titel 1 van Boek 7][ref1] door de
      [Implementatiewet richtlijnen verkoop goederen en levering digitale inhoud][ref2] Stb. 2022, 164 zijn niet van
      toepassing op een consumentenkoop als bedoeld in [artikel 5a lid 2][ref3] die vóór inwerkingtreding van die wet
      is gesloten. Op deze overeenkomsten blijft de tevoren geldende titel 1 van Boek 7 van het Burgerlijk Wetboek van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290
      [ref2]: https://wetten.overheid.nl/BWBR0046592
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel5a
