        artikel: '220'
  - number: 208a
    text: |-
      [Artikel 221 van Boek 7][ref1] is niet van toepassing op huurovereenkomsten die voor het tijdstip van het in
      werking treden van [titel 4 van Boek 7][ref2] zijn gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel221
      [ref2]: https://wetten.overheid.nl/BWBR0005290
