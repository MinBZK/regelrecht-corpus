      - id: ref1
        bwb_id: BWBR0002656
  - number: '17'
    text: |-
      1 [Artikel 224 van Boek 1][ref1] is niet van toepassing op erkenningen, vóór het tijdstip van in werking treden van
      [Boek 1][ref2] gedaan.

      2 De [artikelen 225][ref3] en [226 van Boek 1][ref4] zijn mede van toepassing op erkenningen, vóór het in het
      eerste lid genoemde tijdstip gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel224
      [ref2]: https://wetten.overheid.nl/BWBR0002656
