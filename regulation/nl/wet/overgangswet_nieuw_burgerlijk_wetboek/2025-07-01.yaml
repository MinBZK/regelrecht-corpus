    text: |-
      1 Met betrekking tot inschrijvingen in het huwelijksgoederenregister, vóór het tijdstip van in werking treden van
      [Boek 1][ref1] gedaan, als bedoeld in de tot dat tijdstip geldende [artikelen 163][ref2], [165][ref3], [180][ref4],
      [185][ref5], [186][ref6], [300][ref7] en [304][ref8] van het Burgerlijk Wetboek, blijven die artikelen van
      toepassing.

      2 Met betrekking tot inschrijvingen in het huwelijksgoederenregister als bedoeld in de [artikelen 86][ref9],
      [90][ref10], [104][ref11], [105][ref12], [110][ref13], [112][ref14], [189][ref15] en [196 van Boek 1][ref16], die
      pas na het tijdstip van in werking treden van [Boek 1][ref17] geschieden, zijn die artikelen van toepassing, ook
      wanneer de rechterlijke uitspraak vóór dat tijdstip is gedaan, de akte van afstand een vóór dat tijdstip ontbonden
      gemeenschap van goederen betreft, de eis tot opheffing van de gemeenschap van goederen vóór dat tijdstip is
      ingesteld, of de verzoening vóór dat tijdstip heeft plaatsgehad.

      3 Ingeval een vóór het tijdstip van in werking treden van [Boek 1][ref18] aangevangen wettelijke termijn voor
      de inschrijving van een akte van afstand van een gemeenschap van goederen op dat tijdstip nog lopende is, is
      [artikel 106 van Boek 1][ref19] mede van toepassing.


