  - number: 189b
    text: |-
      Voor zover het betreft een inbreuk als bedoeld in [artikel 193k van Boek 6][ref1] op [artikel 6][ref2] of
      [24 van de Mededingingswet][ref3] zijn [artikel 193r van Boek 6][ref4] en de [artikelen 44a, derde lid][ref5],
      [161a][ref6] en [844 tot en met 850 van het Wetboek van Burgerlijke Rechtsvordering][ref7] slechts van toepassing
      op die zaken die bij de rechter aanhangig zijn gemaakt na het tijdstip van inwerkingtreding van artikel II van de
      Wet van 6 april 2022 wijziging van de Mededingingswet in verband met het expliciteren van de uitsluiting van het
      kartelverbod van gedragingen in het kader van het gemeenschappelijke landbouw- en visserijbeleid, en wijziging
      van Boek 6 van het Burgerlijk Wetboek en de Overgangswet nieuw Burgerlijk Wetboek in verband met de nationale
      toepassing van de mogelijkheid tot privaatrechtelijke handhaving van het mededingingsrecht (Stb. 2022, 159).


