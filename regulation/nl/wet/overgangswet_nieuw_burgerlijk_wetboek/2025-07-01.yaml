  - number: '254'
    text: |-
      1 Voor de levering van een in het register teboekstaand binnenschip of een beperkt recht daarop kan in de plaats
      van een notariële akte een onderhandse akte worden gebezigd, indien die akte is opgesteld en mede-ondertekend door
      een door Onze Minister van Justitie aangewezen persoon als bedoeld in lid 3 en deze persoon dit in het slot der
      akte heeft verklaard of dit in een door hem ondertekende verklaring aan de voet van de akte heeft bevestigd.

      2 Lid 1 is van overeenkomstige toepassing op akten bedoeld in [artikel 800 van Boek 8][ref1].

      3 Personen die voor 1 april 1991 door de arrondissementsrechtbank beëdigd zijn als makelaar in binnenschepen,
      worden op hun daartoe binnen een jaar na inwerkingtreding van deze wet gedaan verzoek aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel800
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel254
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '800'
  - number: '255'
    text: |-
      [Artikel 160 lid 1 van Boek 8][ref1] wordt drie maanden na het tijdstip van het in werking treden van dat
      [Boek][ref2] van toepassing op een, op dat tijdstip bestaande, rederij als omschreven in het tevoren geldende
      [artikel 323 van het Wetboek van Koophandel][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel160
      [ref2]: https://wetten.overheid.nl/BWBR0005034
      [ref3]: https://wetten.overheid.nl/BWBR0001838#Artikel323
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel255
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '160'
      - id: ref2
        bwb_id: BWBR0005034
      - id: ref3
        bwb_id: BWBR0001838
        artikel: '323'
  - number: '256'
    text: |-
      De aanvaring welke heeft plaats gehad vóór het in werking treden van [Boek 8][ref1] wordt beheerst door het
      vroegere recht. Hetzelfde geldt voor schade die door een schip is veroorzaakt, indien het ongeval vóór het in
      werking treden van Boek 8 heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005034
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel256
    references:
      - id: ref1
        bwb_id: BWBR0005034
  - number: 256a
    text: |-
      De wet tot wijziging van Boek 8 van het Burgerlijk Wetboek, Boek 8 van het Burgerlijk Wetboek BES en de Wet
      bestrijding maritieme ongevallen in verband met de schrapping van de beperking van aansprakelijkheid voor
      vorderingen inzake wrakopruiming is slechts van toepassing ten aanzien van aansprakelijkheid voortvloeiende uit een
      maritiem ongeval dat zich na de inwerkingtreding van die wet heeft voorgedaan.
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel256a
  - number: '257'
    text: |-
      Op een hulpverlening die vóór het in werking treden van [Boek 8][ref1] is aangevangen, is het vroegere recht van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel257
    references:
      - id: ref1
        bwb_id: BWBR0005034
  - number: '258'
    text: |-
      1 De verjaring en het verval van een rechtsvordering waarvan de termijn werd bepaald door het
      [Wetboek van Koophandel][ref1], de Wet Overeenkomst Wegvervoer of de Wet Overeenkomst Binnenlands Openbaar
      personenvervoer, blijft door het vroegere recht beheerst, indien de termijn vóór het in werking treden van
      [Boek 8][ref2] is aangevangen.

      2 De [artikelen 201][ref3] en [791 van Boek 8][ref4], zoals deze artikelen zijn gewijzigd bij de Aanpassingswet
      Boek 8, worden, indien de daar genoemde termijnen vóór 1 januari 1992 zijn aangevangen, met ingang van 1 april 1992
      van toepassing op de termijnen van verjaring van de eigendom van in de openbare registers teboekstaande zee- en
      binnenschepen, alsmede op die van verjaring der in die artikelen genoemde beperkte rechten daarop. Deze termijnen
      worden geacht niet vóór 1 april 1992 te zijn voltooid.

      3 De verkrijging van een teboekstaand luchtvaartuig door verjaring, waarvan de termijn werd bepaald door de Wet
      teboekgestelde Luchtvaartuigen, blijft door die wet beheerst, indien de termijn vóór het in werking treden van
      [titel 15 van Boek 8][ref5] is aangevangen.


      [ref1]: https://wetten.overheid.nl/BWBR0001838
      [ref2]: https://wetten.overheid.nl/BWBR0005034
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel201
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel791
      [ref5]: https://wetten.overheid.nl/BWBR0005034
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel258
