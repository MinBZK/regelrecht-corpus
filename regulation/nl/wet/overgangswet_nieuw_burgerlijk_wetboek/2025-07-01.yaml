        bwb_id: BWBR0002565
        artikel: '257'
  - number: '195'
    text: |-
      In geval van een vordering tot wijziging of ontbinding van een overeenkomst als bedoeld in de [artikelen 258][ref1]
      en [259 van Boek 6][ref2] houdt de rechter bij de toepassing van die artikelen geen rekening met een wijziging in
      de omstandigheden die zich vóór het in werking treden van de wet heeft voorgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel258
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel259
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel195
