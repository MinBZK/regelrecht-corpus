        bwb_id: BWBR0005289
        afdeling: '3'
  - number: 191a
    text: |-
      [Artikel 236, onderdeel t, van Boek 6][ref1] is niet van toepassing op een in de algemene voorwaarden voorkomend
      beding bij een overeenkomst gesloten voor het tijdstip van inwerkingtreding van die bepaling.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel236
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel191a
