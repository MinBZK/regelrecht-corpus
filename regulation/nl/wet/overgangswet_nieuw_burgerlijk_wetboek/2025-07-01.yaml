      1 [Artikel 7 leden 1-4 van Boek 1][ref1] is ook van toepassing op aanhangige of nog in te dienen verzoeken
      tot wijziging of vaststelling van namen van personen, geboren vóór het tijdstip van in werking treden van
      [Boek 1][ref2].

      2 [Artikel 7 leden 3 en 4 van Boek 1][ref3] is bovendien van toepassing ingeval de wijziging of vaststelling van de
      geslachtsnaam heeft plaatsgevonden vóór het tijdstip van in werking treden van [Boek 1][ref4].

      3 [Artikel 7 lid 5 van Boek 1][ref5] en de daarin bedoelde algemene maatregel van bestuur zijn niet van toepassing
      op verzoeken, ingediend vóór het tijdstip van in werking treden van [Boek 1][ref6].


