        artikel: '310'
  - number: '120'
    text: |-
      Over het tijdvak vóór het in werking treden van de wet wordt een verjaring waarop de wet van toepassing is, geacht
      te zijn gestuit door een oorzaak die volgens het tevoren geldende recht stuiting tot gevolg had.
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel120
  - number: '121'
    text: |-
      1 In afwijking van [artikel 73][ref1] worden aanvang en duur van een verjaringstermijn door de wet bepaald in de
      gevallen waarin de verjaring overeenkomstig [artikel 320 van Boek 3][ref2] bij of binnen een jaar na het in werking
      treden van de wet wordt verlengd.

      2 De artikelen 2023-2029 van het Burgerlijk Wetboek, zoals die tot aan het in werking treden van de wet golden,
      blijven gedurende een jaar nadien van toepassing op de gevallen waarin zij totdien toepasselijk waren, tenzij er
      een grond tot verlenging der verjaring overeenkomstig [artikel 321 van Boek 3][ref3] bestaat. Na afloop van dat
      jaar wordt de verjaring geacht nimmer geschorst te zijn geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0002565#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel320
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel321
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0002565
        artikel: '73'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '320'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '321'
  - number: '122'
    text: |-
      Van het tijdstip van het in werking treden der wet af geldt [artikel 323 leden 1 en 2 van Boek 3][ref1], voor zover
      een pand- of hypotheekrecht niet reeds eerder teniet was gegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel323
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '323'
  - number: '123'
    text: |-
      Vanaf een jaar na het verstrijken van het tijdstip van het in werking treden der wet gelden de
      [artikelen 324][ref1] en [325 van Boek 3][ref2] mede, indien de in artikel 324 bedoelde rechterlijke of arbitrale
      uitspraak vóór dat tijdstip is gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel324
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel325
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '324'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '325'
  - number: '124'
    text: |-
      Artikel 2010 van het Burgerlijk Wetboek, zoals dat tevoren gold, blijft van toepassing indien na het in werking
      treden van de wet een beroep wordt gedaan op verjaring ingevolge een van de tevoren geldende artikelen 2005 tot en
      met 2008 van het Burgerlijk Wetboek.
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel124
  - number: '125'
    text: |-
      [Artikel 5 van Boek 4][ref1] is van overeenkomstige toepassing op schulden die terzake van een nalatenschap onder
      het tevoren geldende recht zijn ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel5
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '5'
  - number: '126'
    text: |-
      1 [Afdeling 2 van titel 3 van Boek 4][ref1] is uitsluitend van toepassing indien de erflater na het in werking
      treden van [de wet][ref2] is overleden.

      2 Artikel 899b van Boek 4 van het Burgerlijk Wetboek, zoals dat tot aan het tijdstip van het in werking treden van
      [de wet][ref3] gold, blijft nadien van toepassing met betrekking tot nalatenschappen die vóór dat tijdstip zijn
      opengevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0002761
      [ref3]: https://wetten.overheid.nl/BWBR0002761
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0002761
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002761
      - id: ref3
        bwb_id: BWBR0002761
  - number: '127'
    text: |-
      De bepalingen omtrent nietigheid en vernietigbaarheid van het tevoren geldende recht zijn, onverminderd het in
      [artikel 79][ref1] bepaalde, niet van toepassing op een uiterste wilsbeschikking die vóór het tijdstip van het
      inwerking treden van [de wet][ref2] is gemaakt door iemand die na dat tijdstip overlijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0002565#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0002761
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0002565
        artikel: '79'
      - id: ref2
        bwb_id: BWBR0002761
  - number: '128'
    text: |-
      1 Is de nalatenschap voor het in werking treden van de wet opengevallen, dan kan een legitimaris zijn bevoegdheden
      uitsluitend overeenkomstig het tevoren geldende recht uitoefenen.

      2 Degene die tot aan het tijdstip van het in werking treden van de wet volgens het tevoren geldende recht zijn
      bevoegdheden als legitimaris kon uitoefenen, behoudt die bevoegdheden gedurende een jaar nadien, indien de erflater
      ten minste vier jaren vóór dat tijdstip is overleden. Is de nalatenschap later, doch vóór het in werking treden van
      de wet opengevallen, dan behoudt de legitimaris zijn bevoegdheden totdat sedert het overlijden van de erflater vijf
      jaren zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel128
  - number: '129'
    text: |-
      1 Indien een erflater voor het in werking treden van de wet ten behoeve van zijn niet van tafel en bed gescheiden
      echtgenoot of zijn geregistreerde partner een uiterste wilsbeschikking heeft gemaakt en de nalatenschap nadien
      is opengevallen, is de vordering van een legitimaris, voor zover deze ten laste zou komen van de echtgenoot
      of geregistreerde partner, eerst opeisbaar na diens overlijden. Hetzelfde geldt in het geval van een uiterste
      wilsbeschikking ten behoeve van een andere levensgezel, indien deze met de erflater een gemeenschappelijke
      huishouding voerde.

      2 Het eerste lid is niet van toepassing voor zover uit de uiterste wilsbeschikking anders valt af te leiden.

      De [artikelen 87 leden 5 en 6][ref1] en [88 van Boek 4][ref2] zijn mede van toepassing.

      3 Op een verdeling gemaakt met toepassing van artikel 1167 van Boek 4 van het Burgerlijk Wetboek,
      zoals dat gold tot aan het tijdstip van het in werking treden van de wet, is na dat tijdstip
      [artikel 186 lid 1 van Boek 3 van het Burgerlijk Wetboek][ref3] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel88
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel186
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '87'
      - id: ref2
        bwb_id: BWBR0002761
        artikel: '88'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '186'
  - number: '130'
    text: |-
      1 De artikelen [119 tot en met 123][ref1], [125][ref2] en [130 lid 3 van Boek 4][ref3] zijn mede van toepassing op
      een nalatenschap die vóór het tijdstip van het in werking treden van de wet is opengevallen, indien op dat tijdstip
      nog schulden der nalatenschap, anders dan tot periodieke betalingen, onvoldaan zijn.

      2 [Artikel 124 van Boek 4][ref4] is mede van toepassing op een nalatenschap die vóór het tijdstip van het in
      werking treden van de wet is opengevallen, voor zover het de vruchten betreft die na dat tijdstip zijn geïnd.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel119
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel125
      [ref3]: https://wetten.overheid.nl/BWBR0002761#Artikel130
      [ref4]: https://wetten.overheid.nl/BWBR0002761#Artikel124
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '119'
      - id: ref2
        bwb_id: BWBR0002761
        artikel: '125'
      - id: ref3
        bwb_id: BWBR0002761
        artikel: '130'
      - id: ref4
        bwb_id: BWBR0002761
        artikel: '124'
  - number: '131'
    text: |-
      Ingeval voor het tijdstip van het in werking treden van [de wet][ref1] een beding is gemaakt dat een goed van
      een niet van tafel en bed gescheiden echtgenoot of van een geregistreerde partner onder opschortende voorwaarde
      of onder opschortende tijdsbepaling zonder redelijke tegenprestatie op de andere echtgenoot of geregistreerde
      partner overgaat of kan overgaan, en dit beding na bedoeld tijdstip wordt toegepast in geval van overlijden van
      degene aan wie het goed toebehoort, is de vordering van een legitimaris, voor zover deze ten laste zou komen van
      de verkrijgende echtgenoot of geregistreerde partner, eerst opeisbaar na diens overlijden. Hetzelfde geldt in
      geval van zodanig beding ten behoeve van een andere levensgezel, mits deze met degene aan wie het goed toebehoort
      een gemeenschappelijke huishouding voerde en het beding bij notarieel verleden samenlevingsovereenkomst of andere
      notariële akte was gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002761
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0002761
  - number: '132'
    text: |-
      De [artikelen 137 tot en met 139 van Boek 4][ref1] zijn mede van toepassing op een making over de hand, die is
      vervat in een vóór het in werking treden van de wet gemaakte uiterste wil. Op een making als bedoeld in artikel
      928 van Boek 4 van het Burgerlijk Wetboek, zoals dat voor het tijdstip van het in werking treden van [de wet][ref2]
      gold, blijft artikel 1036 van Boek 4 van het Burgerlijk Wetboek, zoals dat voor het tijdstip van het in werking
      treden van [de wet][ref3] gold, evenwel van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel137
      [ref2]: https://wetten.overheid.nl/BWBR0002761
      [ref3]: https://wetten.overheid.nl/BWBR0002761
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '137'
      - id: ref2
        bwb_id: BWBR0002761
      - id: ref3
        bwb_id: BWBR0002761
  - number: '133'
    text: |-
      Op de benoeming van een uitvoerder van uiterste wilsbeschikkingen, gedaan voor het tijdstip van het in
      werking treden van de wet, is vanaf dat tijdstip of, indien de executele nadien aanvangt, vanaf dit latere
      tijdstip, [afdeling 6 van titel 5 van Boek 4][ref1] van toepassing, tenzij aan de uitvoerder van de uiterste
      wilsbeschikkingen het recht van inbezitneming der nalatenschapsgoederen niet is toegekend, en behoudens voor zover
      bij de benoeming regelingen zijn getroffen die van [afdeling 6 van titel 5 van Boek 4][ref2] afwijken.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Afdeling6
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Afdeling6
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0002761
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0002761
        afdeling: '6'
  - number: '134'
    text: |-
      Op een testamentair bewind, ingesteld bij een uiterste wil die is opgemaakt voor het tijdstip van het in werking
      treden van de wet, is vanaf dat tijdstip of, indien het bewind nadien van kracht wordt, vanaf dit latere tijdstip
      [afdeling 7 van titel 5 van Boek 4][ref1] van toepassing, behoudens voor zover bepalingen in de uiterste wil
      daarvan afwijken.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Afdeling7
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0002761
        afdeling: '7'
  - number: '135'
    text: |-
      Bij het in werking treden van [de wet][ref1] volgen de erfgenamen van rechtswege een voordien overleden erflater op
      in zijn voor overgang vatbare rechten en in zijn bezit en houderschap, en worden zij van rechtswege schuldenaar van
      zijn schulden die niet met zijn dood zijn tenietgegaan, een en ander voor zover dat rechtsgevolg niet reeds eerder
      was ingetreden.


      [ref1]: https://wetten.overheid.nl/BWBR0002761
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0002761
  - number: '136'
    text: |-
      Degene die tot aan het tijdstip van het in werking treden van [de wet][ref1] ingevolge artikel 1070 van Boek 4 van
      het Burgerlijk Wetboek zoals dat voordien gold, een recht van beraad heeft, behoudt dit totdat de daarvoor gestelde
      termijn is verstreken. Voor verlenging van de termijn is [artikel 185 lid 3 van Boek 4][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002761
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel185
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0002761
      - id: ref2
        bwb_id: BWBR0002761
        artikel: '185'
  - number: '137'
    text: |-
      1 Op de vereffening van een nalatenschap die vóór het tijdstip van het in werking treden van de wet is aangevangen,
      zijn de bepalingen van [afdeling 3 van titel 6 van Boek 4][ref1] nadien zoveel mogelijk van toepassing.

      2 [Afdeling 3 van titel 6 van Boek 4][ref2] is van dat tijdstip af eveneens zoveel mogelijk van overeenkomstige
      toepassing op een voordien aangevangen afwikkeling van een nalatenschap:

      a. nadat de erfgenamen overeenkomstig het tevoren geldende artikel 1078, onder 1 slot, van Boek 4 van het
      Burgerlijk Wetboek de daartoe behorende goederen aan de beschikking der schuldeisers en legatarissen hebben
      overgelaten;

      b. na aanvaarding door schuldeisers van de erfgenamen volgens het tevoren geldende artikel 1107 van Boek 4 van het
      Burgerlijk Wetboek;

      c. na boedelafscheiding volgens het tevoren geldende artikel 1153 van Boek 4 van het Burgerlijk Wetboek;

      d. die onbeheerd was, overeenkomstig de regels van de tevoren geldende artikelen 1172 tot en met 1176 van Boek 4
      van het Burgerlijk Wetboek;

      e. waarop het tevoren geldende artikel 1081, tweede lid, van Boek 4 van het Burgerlijk Wetboek toepassing heeft
      gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Afdeling3
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Afdeling3
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0002761
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002761
        afdeling: '3'
  - number: '138'
    text: |-
      Heeft een wettelijke vertegenwoordiger van een erfgenaam, of een door de rechter benoemde vereffenaar van een
      nalatenschap dan wel een ander die in de gevallen, bedoeld in [artikel 137 lid 2][ref1], met de afwikkeling
      daarvan belast was, aan de schuldeisers van de nalatenschap schade toegebracht doordat hij vóór het tijdstip
      van het in werking treden van de wet opzettelijk daartoe behorende goederen aan het verhaal van de schuldeisers
      heeft onttrokken, dan is [artikel 212 van Boek 4][ref2] van toepassing of overeenkomstige toepassing, indien de
      vereffening of afwikkeling van die nalatenschap op dat tijdstip nog niet is voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0002565#Artikel137
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel212
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0002565
        artikel: '137'
      - id: ref2
        bwb_id: BWBR0002761
        artikel: '212'
  - number: '139'
    text: |-
      In geval voor het in werking treden van [de wet][ref1] een door [de wet][ref2] geroepen erfgenaam in de
      nederdalende lijn bij een gift of in een uiterste wil niet is ontheven van zijn verplichting tot inbreng van de
      gedane gift, blijft deze, behoudens indien de erflater nadien anders mocht hebben beslist, ook na dat tijdstip
      daartoe verplicht.


      [ref1]: https://wetten.overheid.nl/BWBR0002761
      [ref2]: https://wetten.overheid.nl/BWBR0002761
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0002761
      - id: ref2
        bwb_id: BWBR0002761
  - number: '150'
    text: |-
      1 Op het tijdstip van het in werking treden van de wet nog bestaande zakelijke rechten, die niet waren geregeld in
      het Burgerlijk Wetboek zoals dat voordien gold en die krachtens artikel 1 van de Wet van 16 mei 1829, *Stb.* 29,
      zijn gehandhaafd, worden registergoederen.

      2 Het bestaan van een recht als bedoeld in lid 1 kan worden ingeschreven in de openbare registers, bedoeld in
      [afdeling 2 van titel 1 van Boek 3][ref1]. Op het ontbreken van de inschrijving en op inschrijfbare feiten die vóór
      het in werking treden van de wet zijn voorgevallen, en die betreffen rechten die niet uit de openbare registers
      kenbaar zijn, is [artikel 24 lid 1 van Boek 3][ref2] niet van toepassing.

      3 Op deze rechten, alsmede op grondrenten en rechten van beklemming en van altijddurende beklemming blijven de
      regels van toepassing die voor hen golden vóór het in werking treden van de wet, voor zover uit de bepalingen
      omtrent registergoederen niet anders voortvloeit.

      4 Een recht van aanwas geldt als eigendom van de bodem waarop het rust; degene die tot aan het in werking treden
      van de wet eigenaar van de stroom boven die bodem was, verkrijgt een beperkt recht op de bodem, dat de hem voordien
      toekomende bevoegdheden met betrekking tot de stroom inhoudt.

      5 De overige in dit artikel bedoelde rechten gelden met inachtneming van hun bijzondere aard als beperkte rechten
      op de zaak waarop zij rusten.

      6 De rechter kan op vordering van de eigenaar van de zaak waarop in dit artikel bedoeld beperkt recht rust, de
      inhoud van dat recht wijzigen, indien het ongewijzigd voortbestaan in strijd is met het algemeen belang, alsook op
      grond van omstandigheden welke van dien aard zijn dat naar maatstaven van redelijkheid en billijkheid ongewijzigde
      instandhouding niet van de eigenaar kan worden gevergd. De rechter kan de vordering toewijzen onder door hem te
      stellen voorwaarden; hij houdt geen rekening met omstandigheden die zich vóór het in werking treden van de wet
      hebben voorgedaan.

      7 De leden 1-5 gelden niet voor grafrechten, zoals geregeld in de [Wet op de lijkbezorging][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0005009
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel150
    references:
