  - number: '28'
    text: |-
      1 Gedingen inzake de voorlopige ondertoezichtstelling of ondertoezichtstelling van een minderjarige,
      de ontzetting uit en de ontheffing van het gezag of de voogdij, met inbegrip van schorsingen,
      waarin het inleidende verzoekschrift is ingediend vóór het tijdstip van in werking treden van
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      _, worden geheel afgedaan met toepassing van het recht dat voor dat tijdstip gold.

      2 Na de inwerkingtreding van
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      _:

      a. worden beschikkingen waarin de ontzetting uit of de ontheffing van het gezag dan wel voogdij is uitgesproken
      aangemerkt als beschikkingen waarin het gezag of de voogdij is beëindigd, als bedoeld in [artikel 266][ref3]
      respectievelijk [artikelen 327][ref4] en [328 van Boek 1 van het Burgerlijk Wetboek][ref5];

      b. geldt, voor de uithuisplaatsing van een minderjarige die onder toezicht is gesteld, het vereiste van
      [artikel 265a van Boek 1 van het Burgerlijk Wetboek][ref6] pas vanaf het moment dat de ondertoezichtstelling voor
      het eerst verlengd wordt.


