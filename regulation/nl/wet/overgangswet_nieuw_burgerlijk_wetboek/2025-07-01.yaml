  - number: '198'
    text: |-
      1 De [artikelen 48a–48e][ref1] en [48g van Boek 7][ref2] zijn niet van toepassing op overeenkomsten die vóór het
      tijdstip van het in werking treden van deze bepalingen zijn gesloten.

      2 [Artikel 48f van Boek 7][ref3] is van toepassing vanaf het tijdstip waarop het in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel48a
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel48g
