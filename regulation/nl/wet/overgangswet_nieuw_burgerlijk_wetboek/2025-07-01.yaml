        artikel: '69'
  - number: '76'
    text: |-
      Zaken die tot aan het tijdstip van het in werking treden van de wet onroerend door bestemming waren en als zodanig
      waren begrepen in een beslag of executie, blijven, indien de wet hen als roerend aanmerkt, ook nadien daaronder
      begrepen en gelden als onroerend zolang het beslag of de executie duurt, doch slechts tot aan de levering aan de
      koper.
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel76
  - number: '77'
    text: |-
      Op roerende zaken die tot aan het tijdstip van het in werking treden van de wet onroerend door bestemming waren
      en als zodanig aan hypotheek waren onderworpen, rust van dat tijdstip af een pandrecht. Het pandrecht komt na
      dat tijdstip mede te rusten op roerende zaken die als onroerend door bestemming onder het tevoren geldende recht
      aan die hypotheek zouden zijn onderworpen. Met betrekking tot de zaken, in de eerste en tweede zin genoemd, wordt
      geacht het in [artikel 254 lid 1 van Boek 3][ref1] bedoelde beding te zijn gemaakt. Het pandrecht op de in de
      eerste zin bedoelde zaken werkt tegen de, vóór het in werking treden van de wet ontstane, rechten en vorderingen,
      waartegen de hypotheek kon worden ingeroepen; met betrekking tot de rangorde geldt het als gevestigd op het
      tijdstip waarop de zaak met hypotheek werd belast.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel254
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '254'
  - number: '78'
    text: |-
      1 Feiten die op het tijdstip van het in werking treden van de wet kenbaar zijn uit de openbare
      registers voor registergoederen uit een in- of overschrijving voordien of uit een voordien door de
      bewaarder geplaatste aantekening, gelden voor de toepassing van de wet als feiten die overeenkomstig
      [afdeling 2 van titel 1 van Boek 3][ref1] zijn ingeschreven, tenzij die feiten nadien niet meer hadden kunnen
      worden ingeschreven.

      2 [ Artikel 21 van Boek 3][ref2] heeft geen invloed op de rangorde van rechten die reeds vóór het in werking treden
      der wet bestonden.

      3 De [artikelen 24 lid 1][ref3], [25][ref4] en [26 van Boek 3][ref5] worden eerst drie jaren na het tijdstip van
      het in werking treden van de wet van toepassing met betrekking tot een voor inschrijving vatbaar feit dat vóór dat
      tijdstip is geschied.

      4 Op het ontbreken van de inschrijving van de vóór 1 januari 1950 plaatsgevonden hebbende aanleg van een
      net als bedoeld in [artikel 20 lid 2 van Boek 5][ref6] dat op het tijdstip van het in werking treden van die
      bepaling nog niet is verwijderd en op inschrijfbare feiten die vóór het in werking treden van die bepaling
      zijn voorgevallen, en die betreffen netten waarvan de aanleg niet uit de openbare registers kenbaar is, is
      [artikel 24 lid 1 van Boek 3][ref7] niet van toepassing.

      5 Met betrekking tot een net als bedoeld in [artikel 20 lid 2 van Boek 5][ref8], dat vóór 1 februari 2007
      is aangelegd, begint de in het derde lid bedoelde termijn van drie jaren te lopen vanaf het tijdstip waarop
      [artikel 155a][ref9] in werking is getreden.


