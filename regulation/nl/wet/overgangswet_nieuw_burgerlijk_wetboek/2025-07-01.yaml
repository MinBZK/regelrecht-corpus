  - number: '79'
    text: |-
      Tenzij anders is bepaald, wordt een rechtshandeling die is verricht voordat de wet daarop van toepassing wordt,
      niet nietig of vernietigbaar ten gevolge van een omstandigheid die de wet, in tegenstelling tot het tevoren
      geldende recht, aanmerkt als een grond van nietigheid of vernietigbaarheid.
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel79
  - number: '80'
    text: |-
      1 Een rechtshandeling die vernietigbaar was tot aan het tijdstip waarop de wet op haar van toepassing wordt, kan
      van dat tijdstip af niet langer worden vernietigd op grond van het gebrek dat haar tevoren aankleefde, indien de
      wet een zodanig gebrek niet aanmerkt als een grond van vernietigbaarheid.

      2 Een rechtshandeling als bedoeld in lid 1, wordt op het daar genoemde tijdstip met terugwerkende kracht nietig,
      indien de wet een rechtshandeling met hetzelfde gebrek als nietig aanmerkt.
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel80
  - number: '81'
    text: |-
      1 Een nietige rechtshandeling wordt op het tijdstip waarop de wet op haar van toepassing wordt, met terugwerkende
      kracht tot een onaantastbare bekrachtigd, indien zij heeft voldaan aan de vereisten die de wet voor een zodanige
      rechtshandeling stelt.

      2 Een tevoren nietige rechtshandeling geldt van dat tijdstip af als vernietigbaar, indien de wet het gebrek dat
      haar aankleeft, als grond van vernietigbaarheid aanmerkt. [Artikel 73a lid 1][ref1] is alsdan niet van toepassing
      indien het tevoren geldende recht een beroep op de nietigheid niet aan een bepaalde termijn bond.

      3 De vorige leden gelden slechts, indien alle onmiddellijk belanghebbenden die zich op de nietigheid hadden kunnen
      beroepen, de handeling voordien als geldig hebben aangemerkt. Inmiddels verkregen rechten van derden behoeven aan
      bekrachtiging niet in de weg te staan, mits zij worden geëerbiedigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002565#Artikel73a
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0002565
        artikel: 73a
  - number: '82'
    text: |-
      Voor de toepassing van [artikel 52 lid 1 onder d van Boek 3][ref1] wordt onder een bevoegdheid tot inroeping van
      een vernietigingsgrond begrepen de bevoegdheid tot het inroepen van een soortgelijke vernietigingsgrond, welke
      iemand reeds toekwam volgens het recht dat vóór het toepasselijk worden der wet gold.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel52
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '52'
  - number: '83'
    text: |-
      [Artikel 62 lid 2 van Boek 3][ref1] wordt één jaar na het tijdstip van het in werking treden van de wet van
      toepassing op een volmacht die op dat tijdstip bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel62
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel83
    references:
      - id: ref1
