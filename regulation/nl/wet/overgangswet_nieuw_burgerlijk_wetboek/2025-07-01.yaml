  - number: '193'
    text: |-
      De [artikelen 253 lid 2][ref1] en [254-256 van Boek 6][ref2] gelden niet voor een beding ten behoeve van een derde,
      dat op het tijdstip van het in werking treden van de wet reeds bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel253
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel254
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel193
