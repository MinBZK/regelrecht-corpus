  - number: '16'
    text: |-
      Een natuurlijk kind dat vóór het tijdstip van in werking treden van [Boek 1][ref1] door de echtgenoot van de moeder
      is erkend, hetzij staande het huwelijk met de moeder hetzij na ontbinding van het huwelijk door de dood van de
      moeder, wordt van rechtswege gewettigd; de wettiging werkt van het tijdstip van in werking treden van Boek 1 af.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel16
