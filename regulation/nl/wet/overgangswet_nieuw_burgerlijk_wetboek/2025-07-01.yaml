  - number: '184'
    text: |-
      [Artikel 130 van Boek 6][ref1] geldt niet met betrekking tot een vordering die vóór het tijdstip van in werking
      treden van de wet op een ander was overgegaan, of waarop vóór dat tijdstip beslag was gelegd dan wel een beperkt
      recht gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel130
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel184
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '130'
  - number: '185'
    text: |-
      Tenzij uit de tussen partijen bestaande rechtsverhouding anders voortvloeit, worden de geldvorderingen en
      geldschulden die vóór het tijdstip van het in werking treden van de wet zijn opgenomen in een rekening als bedoeld
      in [artikel 140 van Boek 6][ref1], aangemerkt als op dat tijdstip verrekend voor zover dat nog niet eerder was
      geschied, in de volgorde waarin zij voor schuldvergelijking krachtens het voordien geldende recht waren vatbaar
      geworden; van dat tijdstip af is alleen het saldo verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel140
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel185
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '140'
  - number: '186'
    text: |-
      De bevoegdheid tot tenuitvoerlegging van een executoriale titel terzake van een vordering en haar nevenrechten
      komt van het tijdstip van het in werking treden van de wet toe aan degene op wie de vordering vóór dat tijdstip is
      overgegaan, tenzij de vorige rechthebbende reeds maatregelen tot uitoefening van zijn bevoegdheid heeft genomen.
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel186
  - number: '187'
    text: |-
      Het tevoren geldende artikel 1438, aanhef en onder 2°, van het Burgerlijk Wetboek is ook na het in werking treden
      van de wet van toepassing, indien de koop voordien is gesloten. De hypotheken van schuldeisers in wier rechten de
      koper is gesubrogeerd, blijven in stand, voor zover dit voor de uitoefening van die rechten door de koper nodig is.
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel187
  - number: '188'
    text: |-
      De [artikelen 151][ref1] en [152 van Boek 6][ref2] zijn niet van toepassing op een subrogatie na het in werking
      treden van de wet, indien tevoren eveneens reeds subrogatie terzake van dezelfde vordering heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel151
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel152
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel188
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '151'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '152'
  - number: '189'
    text: |-
      Indien vóór het tijdstip van het in werking treden van de wet een rechtshandeling onder ontbindende voorwaarde
      is verricht, die naar het toen geldende recht het tenietgaan van een verbintenis door vermenging tot gevolg heeft
      gehad, doet de vervulling van de voorwaarde na dat tijdstip de verbintenis herleven.
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel189
  - number: 189a
    text: |-
      1 [Artikel 174, derde lid, van Boek 6][ref1], zoals dat is komen te luiden na de inwerkingtreding van de
      [Mijnbouwwet][ref2], is niet van toepassing indien de gebeurtenis waardoor de schade is veroorzaakt voor de
      inwerkingtreding van de [Mijnbouwwet][ref3] heeft plaatsgevonden.

      2 [Artikel 177, vierde lid, van Boek 6][ref4], zoals dat is komen te luiden na de inwerkingtreding van de
      [Mijnbouwwet][ref5], is niet van toepassing indien de schade bekend is geworden voor de inwerkingtreding van de
      [Mijnbouwwet][ref6].


