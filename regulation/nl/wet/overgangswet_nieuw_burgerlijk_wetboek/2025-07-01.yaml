  - number: 198a
    text: |-
      [Titel 1A van Boek 7][ref1] is niet van toepassing op overeenkomsten die vóór het inwerkingtreden van deze titel
      zijn gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel198a
