  - number: 200_bis
    text: |-
      [Afdeling 2 van titel 2A][ref1] en de [titels 2B][ref2] en [2C][ref3] zijn niet van toepassing op overeenkomsten
      die voor het tijdstip van het inwerkingtreden van die afdeling en die titels zijn gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0005290
      [ref3]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel200
