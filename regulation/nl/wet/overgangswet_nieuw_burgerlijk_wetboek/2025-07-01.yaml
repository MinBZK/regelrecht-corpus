  - number: '176'
    text: |-
      Is een prestatie die aan twee of meer schuldeisers is verschuldigd, vóór het tijdstip van het in werking treden van
      de wet nog niet geheel of ten dele betaald, dan is [afdeling 3 van titel 1 van Boek 6][ref1] daarop van toepassing,
      tenzij vóór dat tijdstip betaling is gevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Afdeling3
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel176
    references:
      - id: ref1
        bwb_id: BWBR0005289
        afdeling: '3'
  - number: '177'
    text: |-
      Het in werking treden van de wet doet de vorderingen bedoeld in de [artikelen 33][ref1], [36][ref2] en
      [42 van Boek 6][ref3] ontstaan, indien alsdan aan de in die artikelen gestelde vereisten is voldaan en het tevoren
      geldende recht niet een zodanige vordering toekende. De termijn van verjaring van die vorderingen wordt gerekend
      te zijn begonnen op het tijdstip waarop de in die artikelen bedoelde vereisten waren vervuld, doch hij wordt niet
      voltooid voordat een jaar na het in werking treden is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0005289#Artikel42
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel177
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '33'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '36'
      - id: ref3
        bwb_id: BWBR0005289
        artikel: '42'
  - number: '178'
    text: |-
      [Artikel 41, aanhef en onderdeel b, van Boek 6][ref1] geldt niet voor verbintenissen tot aflevering van een naar
      de soort bepaalde zaak, die voortvloeien uit een rechtsbetrekking welke vóór het in werking treden van de wet is
      ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel41
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel178
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '41'
  - number: '179'
    text: |-
      [Artikel 50 lid 1 van Boek 6][ref1] geldt niet, indien vóór het in werking treden van de wet niet meer dan twee
      achtereenvolgende kwitanties zijn afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel50
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel179
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '50'
  - number: '180'
    text: |-
      De wet bepaalt van haar in werking treden af of een bevoegdheid tot opschorting van de nakoming van een
      verbintenis, een retentierecht daaronder begrepen, bestaat.
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel180
  - number: '181'
    text: |-
      Op een aanbod van gerede betaling of een bewaargeving, verricht vóór het in werking treden van de
      wet en met inachtneming van de toen geldende artikelen 1440-1448 van het Burgerlijk Wetboek, zijn de
      [artikelen 66-71 van Boek 6][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel66
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel181
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '66'
  - number: '182'
    text: |-
      Indien een schuldenaar vóór het in werking treden van de wet in de nakoming van zijn verbintenis is
      tekortgeschoten, is op de gevolgen van de tekortkoming de wet niet van toepassing, ook niet indien de tekortkoming
      nadien wordt voortgezet.
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel182
  - number: '183'
    text: |-
      [Artikel 83 van Boek 6][ref1] is niet van toepassing op het verstrijken van een termijn als bedoeld onder *a* van
      dat artikel, die voortvloeit uit een rechtsverhouding welke vóór het tijdstip van het in werking treden van de wet
      is ontstaan, noch op het niet nakomen van een op dat tijdstip bestaande verbintenis als bedoeld in onderdeel *b*
      van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel83
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel183
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '83'
  - number: 183a
    text: |-
      De [artikelen 96 lid 4][ref1], [119a leden 4 en 5][ref2] en [119b van Boek 6][ref3] zijn niet van toepassing op
      overeenkomsten die vóór het tijdstip van het in werking treden van deze bepalingen zijn gesloten.


