    text: |-
      1 [Artikel 59 lid 1 van Boek 2][ref1] is niet van toepassing op overeenkomsten die zijn gesloten voor het tijdstip
      van in werking treden van [Boek 2][ref2].

      2 [ Artikel 62 onder a van Boek 2][ref3] is niet van toepassing op overeenkomsten van verzekering die zijn gesloten
      voor het tijdstip van in werking treden van [Boek 2][ref4].


