  - number: '86'
    text: |-
      1 Op het tijdstip van het in werking treden van de wet gaat een goed dat voor verpanding vatbaar is en aan een
      ander tot zekerheid is overgedragen, over op degene te wiens laste de zekerheid is gesteld, en wordt het belast met
      pandrecht ten behoeve van de voormalige eigenaar tot zekerheid.

      2 Van het in lid 1 genoemde tijdstip af heeft het pandrecht de gevolgen van een pandrecht dat naar zijn strekking
      overeenkomt met de eigendom tot zekerheid zoals die totdien bestond.

      3 Het pandrecht werkt tegen de, vóór het in werking treden van de wet ontstane, rechten op het goed en vorderingen,
      waartegen de eigendom tot zekerheid kon worden ingeroepen. Het geldt met betrekking tot de rangorde als gevestigd
      op het tijdstip waarop het goed in eigendom tot zekerheid is overgegaan.

      4 De schuldeiser aan wie de rechten uit een levensverzekering met afkoopwaarde tot zekerheid waren overgedragen,
      kan van het tijdstip van het in werking treden van de wet af als pandhouder die verzekering belenen ter hoogte van
      zijn opeisbare vordering tot aan die waarde op de bij de verzekeraar gebruikelijke voorwaarden.

      5 De leden 1-4 zijn niet van toepassing, indien aan de schuldenaar de uitwinning van het tot zekerheid overgedragen
      goed was aangezegd. Is de schuldeiser zes maanden na dat tijdstip nog niet tot de uitwinning overgegaan, dan worden
      die leden alsdan van toepassing. Verkeert de schuldenaar op het genoemde tijdstip in staat van faillissement, dan
      worden die leden eerst na afloop daarvan toepasselijk, indien de eigendom tot zekerheid is blijven bestaan.

      6 Overeengekomen bedingen worden op het pandrecht van overeenkomstige toepassing, ongeacht of zij aan een na het
      in werking treden van de wet gevestigd pandrecht kunnen worden verbonden, met uitzondering van bedingen die worden
      uitgesloten door de [artikelen 249-253 van Boek 3][ref1].

      7 Van het in werking treden van de wet af wordt een alsdan bestaande verbintenis strekkende tot overdracht van
      een voor verpanding vatbaar goed tot zekerheid, aangemerkt als een verbintenis tot vestiging van een pandrecht.
      Levering bij voorbaat tot de overdracht van een zodanig goed tot zekerheid, die vóór dat tijdstip is geschied,
      geldt nadien als levering bij voorbaat tot vestiging van pandrecht daarop.

      8 De partijen bij een overeenkomst die tot overdracht van goederen tot zekerheid verplicht, zijn desverlangd jegens
      elkaar gehouden tot medewerking aan aanpassing van die overeenkomst aan de bepalingen van titel 3.9 van Boek 3.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel249
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '249'
  - number: 86a
    text: |-
      Is vóór het tijdstip van het in werking treden van de wet een goed ter uitvoering van een voorwaardelijke
      verbintenis geleverd, dan geldt het als onder dezelfde voorwaarde verkregen.
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel86a
  - number: '87'
    text: |-
      Op de rechtsverhouding tussen degene die op het tijdstip van het in werking treden van de wet nog voor een bepaalde
      tijd rechthebbende op een goed is, en hem die na hem verkrijgt, zijn de bepalingen omtrent verbintenissen en
      bevoegdheden welke uit vruchtgebruik voortvloeien, van overeenkomstige toepassing, voor zover de aard of inhoud van
      die rechtsverhouding zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel87
  - number: '88'
    text: |-
      1 [Artikel 86 van Boek 3][ref1] geldt gedurende een jaar na het tijdstip van het in werking treden van de wet niet
      voor zaken als bedoeld in het tevoren geldende artikel 2014 eerste lid van het Burgerlijk Wetboek welke vóór dat
      tijdstip waren ontvreemd. Na afloop van dat jaar wordt artikel 86 lid 3 van Boek 3 op die zaken van toepassing;
      alsdan vervalt de in artikel 2014 tweede lid bedoelde bevoegdheid tot terugvordering van de zaken, genoemd onder
      *a* en *b* van die bepaling. Vóór de ontvreemding op een zaak gevestigde beperkte rechten vervallen door haar
      overgang op de verkrijger.

      2 Artikel 637 van het Burgerlijk Wetboek, zoals dat tot aan het tijdstip van het in werking treden der wet gold,
      blijft van toepassing met betrekking tot een ontvreemde of verloren zaak die vóór dat tijdstip door een koper te
      goeder trouw op een jaar- of een andere markt of op een openbare veiling is verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel86
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '86'
  - number: '89'
    text: |-
      1 Indien vóór het in werking treden van de wet een eigendomsvoorbehoud is bedongen met betrekking tot
      een zaak die voor verpanding vatbaar is, wordt de eigendom omgezet in een pandrecht overeenkomstig
      [artikel 237 van Boek 3][ref1], voor zover het eigendomsvoorbehoud strekt tot zekerheid van voldoening van andere
      vorderingen dan die genoemd in [artikel 92 lid 2, eerste zin, van dat boek][ref2].

      2 Van het in werking treden van de wet af geldt een alsdan bestaande verbintenis tot levering betreffende
      goederen onder eigendomsvoorbehoud als een zodanige verbintenis onder voorbehoud van een pandrecht overeenkomstig
      [artikel 237 van Boek 3][ref3], voor zover het eigendomsvoorbehoud strekt tot zekerheid van voldoening van andere
      vorderingen dan die genoemd in [artikel 92 lid 2, eerste zin, van dat boek][ref4].

      3 De leden 2, 3, 5, 6 en 8 van [artikel 86][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel237
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel92
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel237
      [ref4]: https://wetten.overheid.nl/BWBR0005291#Artikel92
      [ref5]: https://wetten.overheid.nl/BWBR0002565#Artikel86
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel89
