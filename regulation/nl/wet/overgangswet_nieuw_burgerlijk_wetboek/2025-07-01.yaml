      - id: ref1
        bwb_id: BWBR0003045
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0003045
  - number: '37'
    text: |-
      1 Een op het tijdstip van in werking treden van [Boek 2][ref1] bestaande vereniging die geen rechtspersoon was,
      bezit van dat tijdstip af rechtspersoonlijkheid.

      2 Goederen die op dat tijdstip aan de vereniging zouden toebehoren, indien zij, toen het goed te haren behoeve werd
      verkregen, reeds rechtspersoon was geweest, gaan bij het in werking treden van [Boek 2][ref2] van rechtswege op
      haar over.

      3 Rechtshandelingen die voor het tijdstip van in werking treden van [Boek 2][ref3] door of jegens de bestuurders
      van de vereniging in hun hoedanigheid binnen de grenzen van hun bevoegdheid jegens, onderscheidenlijk door
      derden zijn verricht, worden vanaf dat tijdstip aangemerkt als rechtshandelingen van, onderscheidenlijk jegens de
      vereniging, onverminderd de aansprakelijkheid voor de uit die rechtshandelingen voortspruitende verbintenissen van
      hen die daarvoor reeds aansprakelijk waren.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045
      [ref3]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0003045
      - id: ref3
        bwb_id: BWBR0003045
  - number: '38'
    text: |-
      Vanaf het tijdstip van in werking treden van [Boek 2][ref1] staat een vereniging die krachtens de wet van 22 april
      1855, *Stb.* 32, tot regeling en beperking der uitoefening van het regt van vereeniging en vergadering is erkend of
      waarvan de statuten voor dat tijdstip zijn opgenomen in een of meer notariële akten, gelijk met een vereniging die
      is opgericht bij een notariële akte.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: '39'
    text: |-
      1 Op een ten tijde van het in werking treden van [Boek 2][ref1] reeds rechtspersoonlijkheid bezittende vereniging
      waarvoor het vorige artikel niet geldt, is [artikel 30 van Boek 2][ref2] eerst van toepassing nadat drie jaren
      sedert het tijdstip van in werking treden van Boek 2 zijn verstreken.

      2 Ook is gedurende die tijd [artikel 43 lid 5 van Boek 2][ref3] op een zodanige vereniging niet van toepassing,
      zolang de vereniging haar statuten niet overeenkomstig [artikel 28 van Boek 2][ref4] heeft doen opnemen in een
      notariële akte.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel43
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel28
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '30'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '43'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '28'
  - number: '40'
    text: |-
      1 Voor een vereniging die is erkend krachtens de Wet van 22 april 1855, *Stb.* 32, tot regeling en beperking
      der uitoefening van het regt van vereeniging en vergadering en die geen coöperatieve vereniging of onderlinge
      waarborgmaatschappij is, gelden de volgende bepalingen.

      2 [Artikel 29 lid 4 van Boek 2][ref1] vindt geen toepassing ten aanzien van rechtshandelingen, verricht voordat
      drie jaren sedert het in werking treden van [Boek 2][ref2] zijn verstreken.

      3 [Artikel 27 lid 6 van Boek 2][ref3] is op de vereniging van toepassing nadat de statuten der vereniging na het
      tijdstip van in werking treden van [Boek 2][ref4] zijn gewijzigd, doch niet eerder dan drie jaren na dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0003045
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel40
    references:
      - id: ref1
