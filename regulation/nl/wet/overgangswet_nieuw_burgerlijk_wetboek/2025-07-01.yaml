      1 De [afdelingen 1][ref1] en [2 van titel 14 van Boek 7][ref2] zijn niet van toepassing op een borgtocht die ten
      tijde van het in werking treden van de wet reeds bestaat.

      2 [Afdeling 3 van titel 14 van Boek 7][ref3] blijft buiten toepassing op de gevolgen van de borgtocht tussen de
      hoofdschuldenaar en de borg en tussen borgen en voor de verbintenis aansprakelijke niet-schuldenaren onderling,
