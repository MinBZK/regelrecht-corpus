    text: |-
      1 De [artikelen 16-20][ref1] en [22-25 van Boek 1][ref2] zijn uitsluitend van toepassing op akten van de
      burgerlijke stand, op te maken na het tijdstip van in werking treden van [Boek 1][ref3].

      2 [ Artikel 21 van Boek 1][ref4] is uitsluitend van toepassing op brieven van wettiging, besluiten houdende
      wijziging of vaststelling van namen, buiten de burgerlijke stand opgemaakte authentieke akten van erkenning van
      een onwettig kind en rechterlijke uitspraken, die gedagtekend zijn na het tijdstip van in werking treden van
      [Boek 1][ref5].

      3 [ Artikel 23 van Boek 1][ref6] is echter mede van toepassing op het opmaken van kantmeldingen, te plaatsen op
      akten van de burgerlijke stand die vóór het tijdstip van in werking treden van [Boek 1][ref7] zijn opgemaakt.

      4 Kantmeldingen ter zake van akten, opgemaakt vóór het tijdstip van in werking treden van [Boek 1][ref8], die
      vóór dat tijdstip voorgeschreven of gebruikelijk waren, zullen op akten van de burgerlijke stand worden geplaatst,
      ongeacht of deze laatste voor of na dat tijdstip zijn opgemaakt.

      5 De [artikelen 26-28 van Boek 1][ref9] zijn ook van toepassing op akten van de burgerlijke stand die vóór het
      tijdstip van in werking treden van [Boek 1][ref10] zijn opgemaakt.

      6 [ Artikel 29 van Boek 1][ref11] is niet van toepassing op verzoeken en vorderingen, ingediend of gedaan vóór het
      tijdstip van in werking treden van [Boek 1][ref12].


