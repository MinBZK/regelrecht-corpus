  - number: '13'
    text: |-
      1 [Artikel 130 van Boek 1][ref1] is ook van toepassing ten aanzien van huwelijkse voorwaarden die vóór het tijdstip
      van in werking treden van [Boek 1][ref2] zijn tot stand gekomen.

      2 Op gemeenschappen van winst en verlies en van vruchten en inkomsten, overeengekomen vóór het tijdstip van in
      werking treden van [Boek 1][ref3], blijven ook na dat tijdstip de tevoren geldende artikelen 210-222 van het
      Burgerlijk Wetboek van toepassing, voor zover van die voorschriften niet bij huwelijkse voorwaarden uitdrukkelijk
      of door de aard der bedingen is afgeweken.

      3 Op deelgenootschappen, bestaande op het tijdstip van in werking treden van [Boek 1][ref4], zijn van dat tijdstip
      af de voorschriften van [afdeling 2 van titel 8 van Boek 1][ref5] van toepassing, voor zover niet bij huwelijkse
      voorwaarden uitdrukkelijk of door de aard der bedingen een van die voorschriften afwijkende regeling is getroffen,
      met dien verstande dat het bewijs van de in [artikel 143 onder a van Boek 1][ref6] bedoelde waarde van een bij het
      aangaan van een deelgenootschap aanwezig goed dat in de akte van huwelijkse voorwaarden of een daaraan vastgehechte
      staat was vermeld zonder opgave van de waarde, door alle middelen rechtens kan worden geleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0002656
