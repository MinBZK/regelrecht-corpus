  - number: '24'
    text: |-
      Het tevoren geldende artikel 344*c* van het Burgerlijk Wetboek en de desbetreffende tevoren geldende bepalingen der
      artikelen 344*d*-344*f* en van het [Wetboek van Burgerlijke Rechtsvordering][ref1] zijn ook na het tijdstip van in
      werking treden van [Boek 1][ref2] van toepassing, indien de bevalling vóór dat tijdstip heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
      [ref2]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel24
    references:
