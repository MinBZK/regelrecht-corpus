        artikel: '73'
  - number: '74'
    text: |-
      1 Het van toepassing worden van de wet heeft geen gevolg voor de bevoegdheid van de rechter voor wie voordien een
      geding is aangevangen, noch voor de aard van dat geding en voor de rechtsmiddelen tegen de uitspraak.

      2 In gedingen als bedoeld in lid 1 bepaalt de rechter op verzoek van een der partijen of ambtshalve een termijn
      waarbinnen partijen de gelegenheid wordt geboden hun stellingen en conclusies voor zover nodig aan te passen
      aan de wet of aan deze of een der volgende titels. Stelt de rechter partijen tot een zodanige aanpassing in de
      gelegenheid, dan staat tegen die beslissing geen rechtsmiddel open; wijst de rechter een daartoe strekkend verzoek
      af, dan staat een rechtsmiddel daartegen slechts gelijktijdig met de einduitspraak open.

      3 Het tevoren geldende recht blijft van toepassing, indien een geding als bedoeld in lid 1, in hoogste feitelijke
      instantie in staat van wijzen verkeert op het tijdstip waarop de wet van toepassing wordt, tenzij de rechter tot
      voortzetting van het geding beslist.

      4 In een geding ter zake van een cassatieberoep tegen een, vóór het van toepassing worden van de wet tot stand
      gekomen, uitspraak blijft het voordien geldende recht van toepasing. Dit geldt mede voor de verdere behandeling van
      de zaak door het recht waarnaar na cassatie is verwezen, tenzij de zaak als gevolg van de cassatie door dat gerecht
      in haar geheel opnieuw moet worden behandeld.
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel74
  - number: '75'
    text: |-
      1 De wet blijft, ook buiten de in deze en de volgende titels geregelde gevallen, buiten toepassing in zaken van
      overgangsrecht, indien de gelijkenis met zulke gevallen daartoe noopt of indien de toepassing onder de gegeven
      omstandigheden naar maatstaven van redelijkheid en billijkheid onaanvaardbaar zou zijn.

      2 Van de [artikelen 69-73a][ref1] wordt, behalve in de volgende titels, afgeweken op dezelfde gronden als in het
      vorige lid aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002565#Artikel69
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel75
