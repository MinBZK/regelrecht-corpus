  - number: 208c
    text: |-
      Indien de huurder voor het in werking treden van [titel 4 van Boek 7][ref1] is overleden, maar op het tijdstip van
      die inwerkingtreding nog geen zes maanden na dit overlijden waren verstreken en de termijn van zes maanden, bedoeld
      in [artikel 229 lid 2 van Boek 7][ref2], binnen drie maanden na het tijdstip van die inwerkingtreding zou aflopen,
      wordt die termijn verlengd tot drie maanden na dit tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0005290
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel229
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel208c
