  - number: '5'
    text: |-
      1 De [artikelen 10-12][ref1] en [14 van Boek 1][ref2] zijn van het tijdstip van in werking treden van
      [Boek 1][ref3] af ook van toepassing, indien de feiten die volgens deze regelen de verkrijging of het verlies van
      een woonplaats bepalen, zijn voorgevallen vóór dat tijdstip.

      2 Op een vóór dat tijdstip gekozen woonplaats blijft het tot dat tijdstip geldende
      [artikel 81 van het Burgerlijk Wetboek][ref4] van toepassing.


