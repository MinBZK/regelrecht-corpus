  - number: '53'
    text: |-
      1 Een pensioen- of spaarfonds waarop de [Pensioen- en spaarfondsenwet][ref1] van toepassing is en dat op het
      tijdstip van in werking treden van [Boek 2][ref2] reeds rechtspersoon was en niet een vereniging, een onderlinge
      waarborgmaatschappij, een naamloze vennootschap of een besloten vennootschap met beperkte aansprakelijkheid is, is
      van dat tijdstip af een stichting.

      2 Indien de statuten en reglementen van een pensioen- en spaarfonds op een daartoe aan Onze Minister van Sociale
      Zaken en Volksgezondheid voor het tijdstip van in werking treden van [Boek 2][ref3] gedaan verzoek na dat tijdstip
      worden goedgekeurd, wordt het fonds, indien het ten tijde van de goedkeuring niet reeds rechtspersoon was, daardoor
      een stichting.


      [ref1]: https://wetten.overheid.nl/BWBR0002089
      [ref2]: https://wetten.overheid.nl/BWBR0003045
      [ref3]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel53
