        bwb_id: BWBR0002656
        artikel: '413'
      - id: ref4
        bwb_id: BWBR0001827
  - number: '27'
    text: |-
      1 Gedingen, waarin de inleidende dagvaarding is betekend dan wel het inleidende verzoekschrift of het eerste, door
      de president van de rechtbank te behandelen, verzoekschrift is ingediend vóór het tijdstip van in werking treden
      van [Boek 1][ref1], worden geheel afgedaan met toepassing van de voorschriften van procesrechtelijke aard, die vóór
      dat tijdstip golden, zulks behoudens het in het vorige artikel bepaalde.

      2 Het in het vorige lid bepaalde geldt ook voor de afdoening van een eis of verzoek, in het geding bij wege van
      reconventie gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel27
