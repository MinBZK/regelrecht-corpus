    text: |-
      1 Op overeenkomsten van aanneming van werk die vóór het tijdstip van het in werking treden van
      [titel 12 van Boek 7][ref1] zijn gesloten, wordt deze titel drie jaren na dat tijdstip van toepassing.

      2 In afwijking van lid 1 worden de bepalingen van [afdeling 2 van titel 12 van Boek 7][ref2] niet van toepassing op
      een overeenkomst van aanneming van werk die vóór dat tijdstip is gesloten.

      3 In afwijking van de leden 1 en 2 is [titel 12 van Boek 7][ref3] van toepassing op de gevolgen van niet nakoming
      in het geval dat een der partijen na het in werking treden van deze titel in de nakoming van een van haar
      verbintenissen tekortschiet, tenzij dat tekortschieten een voortzetting van een eerdere tekortkoming is.


