  - number: '55'
    text: |-
      1 Een instelling, waarvan het vermogen bestaat uit goederen, als bedoeld zijn in artikel 1 van de Wet van 29
      oktober 1892 (*Stb.* 240), is vanaf het tijdstip van in werking treden van [Boek 2][ref1] een stichting.

      2 De rechtbank kan in afwijking van [artikel 294, lid 2, van Boek 2][ref2] ook wijziging brengen in het doel of de
      doelomschrijving van een in het vorige lid genoemde stichting, indien de statuten die wijziging hebben uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel294
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel55
    references:
      - id: ref1
