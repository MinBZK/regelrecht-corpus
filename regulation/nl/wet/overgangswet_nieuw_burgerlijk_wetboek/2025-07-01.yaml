  - number: 119c
    text: |-
      [Artikel 310 lid 5 van Boek 3][ref1] is van toepassing op schadeveroorzakende gebeurtenissen die vanaf 1 februari
      2004 hebben plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel310
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel119c
