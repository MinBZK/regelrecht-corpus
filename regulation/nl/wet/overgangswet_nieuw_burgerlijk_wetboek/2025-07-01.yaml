  - number: '152'
    text: |-
      De verplichting genoemd in [artikel 13 van Boek 5][ref1] geldt niet, indien de schat langer dan een jaar vóór het
      in werking treden van de wet is ontdekt.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel13
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '13'
  - number: '153'
    text: |-
      Op het tijdstip van het in werking treden van de wet verliest degene die totdien eigenaar van een zaak was, de
      eigendom daarvan, indien de in [artikel 19 van Boek 5][ref1] genoemde feiten op dat tijdstip waren voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel19
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '19'
  - number: '154'
    text: |-
      Van het tijdstip van het in werking treden van de wet af is degene die totdien eigenaar van een water was, eigenaar
      van de bodem onder dat water. Een beperkt recht op zulk een water komt alsdan op die bodem te rusten.
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel154
  - number: '155'
    text: |-
      1 [Artikel 20, lid 2, van Boek 5][ref1] is, te rekenen vanaf het tijdstip van het in werking treden van dit lid,
      mede van toepassing op een net dat voordien is aangelegd dan wel op dat tijdstip wordt aangelegd.

      2 Indien een partij op wiens kosten een net in zijn grond is aangelegd en ten behoeve van wie dit net wordt
      gebruikt binnen twee jaren na het tijdstip van het in werking treden van de wet houdende wijziging van de
      Telecommunicatiewet in verband met een herziening van het nationale beleid ten aanzien van de aanleg van kabels ten
      dienste van openbare elektronische communicatienetwerken (Stb. 2007, 16), een eis heeft ingeleid ter vaststelling
      van de eigendom van dat net en die partij dit feit heeft doen inschrijven in de openbare registers als bedoeld
      in [artikel 16 van Boek 3 van het Burgerlijk Wetboek][ref2], is [artikel 20, lid 2, van Boek 5][ref3] niet van
      toepassing, totdat op deze eis onherroepelijk is beslist of deze eis is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0005288#Artikel20
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel155
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '16'
      - id: ref3
        bwb_id: BWBR0005288
        artikel: '20'
  - number: 155a
    text: |-
      1 Degene die zich op 1 februari 2007 als eigenaar gedroeg, is bevoegd de aanleg van een net als bedoeld in
      [artikel 17 lid 1 onder k van Boek 3][ref1] te doen inschrijven in de openbare registers en dat net als eigenaar
      over te dragen en te bezwaren.

      2 Indien de inschrijving in de openbare registers in de Nederlandse Staatscourant en in een landelijk dagblad is
      gepubliceerd, vervalt de bevoegdheid van derden om het net of een recht daarop op te eisen na één jaar te rekenen
      vanaf de aanvang van de dag volgend op de dag van de laatste van deze publicaties tenzij de derde binnen deze
      termijn een dagvaarding betreffende een door hem ingestelde vordering als bedoeld in [artikel 27 van Boek 3][ref2]
      heeft doen inschrijven in de openbare registers. Een recht van derden op schadevergoeding, indien daarvoor grond
      is, blijft in stand.

      3 Gedurende drie maanden te rekenen vanaf de aanvang van de dag volgend op de dag van de laatste van de in het
      tweede lid bedoelde publicaties is het net niet vatbaar voor overdracht en bezwaring. Wel kunnen derden gedurende
      deze termijn een dagvaarding als bedoeld in het tweede lid of een exploot als bedoeld in het vijfde lid in de
      openbare registers doen inschrijven.

      4 Aan degene die na het verstrijken van de in het derde lid bedoelde termijn door overdracht of bezwaring een
      zakelijk recht op het net verkrijgt, kunnen geen rechten van derden worden tegengeworpen, tenzij de derde vóór de
      overdracht of bezwaring een dagvaarding als bedoeld in het tweede lid of een exploot als bedoeld in het vijfde lid
      heeft doen inschrijven of de verkrijger het recht van de derde kende.

      5 Een exploot als bedoeld in het derde en vierde lid wordt gedaan aan degene die de in het eerste lid bedoelde
      inschrijving verkreeg en houdt in dat de derde zich het recht voorbehoudt om binnen de in het tweede lid bedoelde
      termijn van een jaar een dagvaarding als in dat lid bedoeld in de openbare registers te doen inschrijven.

      6 De publicaties bedoeld in lid 2 kunnen worden ingeschreven in de openbare registers.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel27
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel155a
    references:
