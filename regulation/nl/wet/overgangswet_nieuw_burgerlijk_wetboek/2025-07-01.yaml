  - number: '173'
    text: |-
      1 Is voor de al dan niet toepasselijkheid van de bepalingen der wet omtrent aansprakelijkheid en schadevergoeding
      beslissend, of een schade vóór of na het in werking treden van de wet is ontstaan, en blijkt dit niet, dan is
      beslissend, of de schade voor of na het in werking treden van de wet is bekend geworden.

      2 De aansprakelijkheid voor schade die is ontstaan of bekend geworden na het in werking treden van de wet, wordt,
      ook met betrekking tot haar omvang, naar het tevoren geldende recht beoordeeld, indien die schade voortspruit
      uit dezelfde gebeurtenis als een eerdere door de benadeelde geleden schade waarop dat recht van toepassing was.
      Hetzelfde geldt voor de aansprakelijkheid wegens iemands overlijden na het tijdstip van het in werking treden van
      de wet als gevolg van letsel vóór dat tijdstip is ontstaan.
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel173
  - number: '174'
    text: |-
      De omzetting van een natuurlijke verbintenis in een rechtens afdwingbare bij een uiterste wilsbeschikking is niet
      aan de vereisten van [artikel 5 van Boek 6][ref1] onderworpen, indien deze beschikking vóór het in werking treden
      van de wet is gemaakt, doch nadien tot uitvoering komt.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel5
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel174
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '5'
  - number: '175'
    text: |-
      1 De [artikelen 10-13 van Boek 6][ref1] blijven buiten toepassing, indien vóór het in werking treden van de wet
      een schuld, al dan niet met de kosten, ten laste van een hoofdelijke schuldenaar of een derde geheel of ten dele is
      gedelgd voor meer dan het gedeelte dat hem aangaat.

      2 De [artikelen 6-9][ref2] en [14 van Boek 6][ref3] zijn niet van toepassing op een vóór het in werking treden van
      de wet tot stand gekomen borgtocht of bedongen gebondenheid als hoofdelijk medeschuldenaar wie de schuld in zijn
      verhouding tot de hoofdschuldenaar niet aangaat.

      3 Degene die door het tevoren geldende recht naast een ander aansprakelijk werd gesteld en aan wie deswege op die
      ander een verhaalsrecht toekwam, kan dat verhaalsrecht ook uitoefenen, indien zijn schuld pas na het in werking
      treden van de wet te zijnen laste wordt voldaan en de wet hem geen verhaalsrecht toekent.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005289#Artikel14
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel175
