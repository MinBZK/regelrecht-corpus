        artikel: '62'
  - number: '85'
    text: |-
      [Artikel 81 lid 3 van Boek 3][ref1] geldt mede ten aanzien van beperkte rechten die vóór het in werking treden van
      de wet reeds door afstand en vermenging waren tenietgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel81
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel85
