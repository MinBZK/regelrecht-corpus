  - number: '92'
    text: |-
      De termijnen genoemd in [artikel 99 van Boek 3][ref1], lopen bij het toepasselijk worden van dat artikel op
      goederen die tevoren krachtens artikel 2000 van het Burgerlijk Wetboek niet door verjaring konden worden verkregen,
      vanaf de stuiting van de verjaring van een rechtsvordering tot beëindiging van het bezit, indien zulk een stuiting
      voordien had plaats gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel99
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '99'
  - number: '93'
    text: |-
      [Artikel 105 van Boek 3][ref1] wordt één jaar na het tijdstip van het in werking treden van de wet van toepassing
      met betrekking tot degene die alsdan een goed bezit, indien de verjaring van de rechtsvordering tot beëindiging van
      dat bezit is voltooid; hij wordt geacht dat goed niet vóórdien te hebben verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel105
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '105'
  - number: '94'
    text: |-
      Indien een rechthebbende op het tijdstip van het in werking treden van de wet van zijn beperkte recht geen gebruik
      maakte en de termijn na afloop waarvan het dientengevolge geheel of ten dele teniet kon gaan, nog liep, wordt
      [artikel 106 van Boek 3][ref1] een jaar na dat tijdstip van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel106
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '106'
  - number: '95'
    text: |-
      Bezit en houderschap worden verkregen en verloren op het tijdstip van het in werking treden van de wet, indien de
      vereisten die de bepalingen van [titel 5 van Boek 3][ref1] daarvoor stellen, reeds vóór dat tijdstip waren vervuld,
      doch het toen geldende recht aan de vervulling niet die gevolgen verbond. Op de verplichtingen die uit bezit en
      houderschap voortvloeien, is van dat tijdstip af, doch alleen voor het vervolg, de wet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0005291
  - number: '96'
    text: |-
      [Artikel 122 van Boek 3][ref1] vindt mede toepassing met betrekking tot het bezit en het houderschap in het tijdvak
      dat aan het in werking treden van de wet is voorafgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel122
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '122'
  - number: '100'
    text: |-
      [Artikel 177 lid 3][ref1] geldt niet voor een recht van pand of hypotheek dat vóór het in werking treden van de wet
      is gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002565#Artikel177
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0002565
        artikel: '177'
  - number: '101'
    text: |-
      Van het tijdstip van haar in werking treden af is de wet van toepassing op de handelingen met betrekking tot
      verdeling van een gemeenschap, voor zover die nog niet is voltooid en uitsluitend voor het vervolg, behalve indien
      dit zou nopen tot het ongedaan maken van alsdan reeds in overeenstemming met het voordien geldend recht getroffen
      maatregelen. De wet wordt niet van toepassing ten aanzien van de onderwerpen waaromtrent vóór het in werking treden
      van de wet een rechterlijke uitspraak is gevraagd.
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel101
  - number: '102'
    text: |-
      Van het tijdstip van het in werking treden der wet af is [artikel 181 van Boek 3][ref1] van toepassing op een
      onzijdig persoon die is benoemd krachtens artikel 1117 van het Burgerlijk Wetboek zoals dat voordien gold, evenwel
      met handhaving van de voor hem geldende beloning.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel181
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '181'
  - number: '103'
    text: |-
      [Artikel 194 lid 2 van Boek 3][ref1] is niet van toepassing op een in [artikel 189 lid 2 van Boek 3][ref2] bedoelde
      gemeenschap die op het tijdstip van het in werking treden van de wet reeds bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel194
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel189
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '194'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '189'
  - number: '104'
    text: |-
      Artikel 804 van het Burgerlijk Wetboek, zoals dat tot aan het in werking treden van de wet gold, blijft
      van toepassing met betrekking tot de verbruikbare zaken, die waren begrepen onder een voordien aangevangen
      vruchtgebruik.
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel104
  - number: '105'
    text: |-
      [Artikel 204 lid 2 van Boek 3][ref1] is van toepassing op een bewind dat ten tijde van het in werking treden van de
      wet bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel204
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '204'
  - number: '106'
    text: |-
      [Artikel 221 van Boek 3][ref1] is van toepassing op een vruchtgebruik dat op het tijdstip van het in werking treden
      van de wet bestaat, ook indien op dat tijdstip de vruchtgebruiker reeds in ernstige mate in de nakoming van zijn
      verplichtingen is tekortgeschoten.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel221
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '221'
  - number: '108'
    text: |-
      [Artikel 244 van Boek 3][ref1] geldt voor een pandrecht dat vóór het tijdstip van het in werking treden der wet is
      gevestigd zonder beperking tot de daar vermelde termijn van drie jaren. De vorige zin is mede van toepassing op een
      pandrecht dat overeenkomstig [artikel 86][ref2] of [artikel 89][ref3] door omzetting van eigendom is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel244
      [ref2]: https://wetten.overheid.nl/BWBR0002565#Artikel86
      [ref3]: https://wetten.overheid.nl/BWBR0002565#Artikel89
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '244'
      - id: ref2
        bwb_id: BWBR0002565
        artikel: '86'
      - id: ref3
        bwb_id: BWBR0002565
        artikel: '89'
  - number: '109'
    text: |-
      [Artikel 248 leden 1 en 3 van Boek 3][ref1] is van overeenkomstige toepassing op verzuim van een pandgever die niet
      tevens de schuldenaar is, in de nakoming van de verplichtingen die hij vóór het in werking treden van de wet op
      zich heeft genomen, voor zover niet [artikel 233 van Boek 3][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel248
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel233
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '248'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '233'
  - number: '110'
    text: |-
      De [artikelen 249-252 van boek 3][ref1] zijn niet van toepassing op de uitwinning van een pand, indien vóór het
      tijdstip van het in werking treden van de wet aan de pandgever de uitwinning van het pand reeds was aangezegd.
      [Artikel 253 van Boek 3][ref2] is van toepassing, indien eerst na dit tijdstip het pand wordt verkocht of aan de
      pandhouder verblijft.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel249
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel253
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '249'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '253'
  - number: '111'
    text: |-
      Artikel 1205, tweede lid, van het Burgerlijk Wetboek, zoals dat tot aan het tijdstip van het in werking treden van
      de wet gold, blijft van toepassing ten aanzien van schulden die op dat tijdstip bestaan.
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel111
  - number: '112'
    text: |-
      De houders van certificaten als bedoeld in [artikel 259 van Boek 3][ref1], welke op het tijdstip van het in werking
      treden van de wet reeds bestaan, verkrijgen op dat tijdstip een pandrecht overeenkomstig de leden 2 en 3 van dat
      artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel259
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '259'
  - number: '113'
    text: |-
      Indien op het tijdstip van het in werking treden van de wet sinds de overschrijving in de openbare registers van
      een leveringsakte wegens koop of een akte van scheiding nog geen acht vrije dagen zijn verstreken, blijven de
      artikelen 1227 en 1228 van het Burgerlijk Wetboek, zoals die voordien golden, van toepassing.
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel113
  - number: '114'
    text: |-
      Artikel 1229 van het Burgerlijk Wetboek, zoals dat vóór het tijdstip van het in werking treden van de wet gold,
      blijft van toepassing op bedongen rente over een vordering tot zekerheid waarvan vóór dat tijdstip hypotheek was
      gevestigd.
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel114
  - number: 114a
    text: |-
      De [artikelen 264][ref1], [267][ref2], [267a][ref3] en [268][ref4], zoals gewijzigd of ingevoerd bij
      de [Wet van 1 oktober 2014][ref5] (Stb. 2014, 352), zijn niet van toepassing op de executie van een
      registergoed, een aandeel daarin of een beperkt recht daarop, waarvan de aanzegging overeenkomstig
      [artikel 544 van het Wetboek van Burgerlijke Rechtsvordering][ref6] heeft plaatsgevonden voor de inwerkingtreding
      van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel264
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel267
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel267a
      [ref4]: https://wetten.overheid.nl/BWBR0005291#Artikel268
      [ref5]: https://wetten.overheid.nl/BWBR0035637
      [ref6]: https://wetten.overheid.nl/BWBR0001827#Artikel544
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel114a
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '264'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '267'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: 267a
      - id: ref4
        bwb_id: BWBR0005291
        artikel: '268'
      - id: ref5
        bwb_id: BWBR0035637
      - id: ref6
        bwb_id: BWBR0001827
        artikel: '544'
  - number: '115'
    text: |-
      1 Op een beding als bedoeld in het tevoren geldende artikel 1230 van het Burgerlijk Wetboek dat vóór het tijdstip
      van het in werking treden van de wet is gemaakt, zijn de [leden 4-8 van artikel 264 van Boek 3][ref1] gedurende een
      termijn van drie jaren niet van toepassing.

      2 [Artikel 266 van Boek 3][ref2] is gedurende een termijn van drie jaren van het tijdstip van het in werking treden
      van de wet af niet van toepassing op een hypotheek die vóór dat tijdstip is gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel264
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel266
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '264'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '266'
  - number: '116'
    text: |-
      Indien een hypotheekhouder vóór het tijdstip van het in werking treden van de wet aan een notaris opdracht heeft
      gegeven tot de voorbereiding van een openbare verkoop overeenkomstig artikel 1223 tweede lid van het Burgerlijk
      Wetboek zoals dat voordien luidde, blijft het toen geldende recht op die verkoop van toepassing; zo alsdan de
      toewijzing ingevolge verkoop na dit tijdstip geschiedt, zijn de [artikelen 270-273 van Boek 3][ref1] echter wel
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel270
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '270'
  - number: '117'
    text: |-
      1 De bepalingen van de wet omtrent de rangorde waarin vorderingen uit de opbrengst van een goed moeten worden
      voldaan, gelden, behoudens het elders bepaalde, mede met betrekking tot vorderingen die op het tijdstip van het in
      werking treden van de wet bestaan.

      2 De wet is niet van toepassing op de rangorde bij de verdeling van de opbrengst van een goed dat op het tijdstip
      van haar in werking treden reeds ten behoeve van het verhaal is verkocht, noch op die bij de verdeling van hetgeen
      op een vordering op dat tijdstip reeds is geïnd.

      3 Het in werking treden van de wet heeft voor de dan bestaande vorderingen geen gevolg ten aanzien van de werking
      van een surséance van betaling, die voordien aan de schuldenaar voorlopig is verleend.

      4 De wet is niet van toepassing op de rang van vorderingen op een in staat van faillissement
      verklaarde schuldenaar, indien zij in werking treedt nadat de rechter-commissaris overeenkomstig
      [artikel 108 der Faillissementswet][ref1] de dag heeft bepaald waarop die vorderingen uiterlijk ter verificatie
      moeten zijn ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel108
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '108'
  - number: '118'
    text: |-
      [Artikel 283 van Boek 3][ref1] is niet van toepassing met betrekking tot een vordering tot vergoeding die op het
      tijdstip van het in werking treden van de wet bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel283
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '283'
  - number: '119'
    text: |-
      Afschaffing van voorrechten op bepaalde goederen door het in werking treden van de wet heeft geen gevolg voor
      een voorrecht dat voordien reeds krachtens artikel 1185 onder 3° van het Burgerlijk Wetboek, zoals dat tevoren
      gold, aan een vordering was verbonden. De voordien geldende artikelen 1190 en 1192*a* van het Burgerlijk
      Wetboek blijven van toepassing. Het voorrecht heeft voorrang boven een pandrecht dat is gevestigd overeenkomstig
      [artikel 237 van Boek 3][ref1], of dat, ingevolge [artikel 86 lid 2][ref2] of [89 lid 1][ref3], de gevolgen van een
      zodanig pandrecht heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel237
      [ref2]: https://wetten.overheid.nl/BWBR0002565#Artikel86
      [ref3]: https://wetten.overheid.nl/BWBR0002565#Artikel89
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '237'
