  - number: '29'
    text: |-
      1 Ten aanzien van rechtspersonen die op het tijdstip van in werking treden van
      [Boek 2 (Rechtspersonen) van het Burgerlijk Wetboek][ref1] bestaan, zijn, voor zover niet anders is bepaald, dit
      boek en de bij de hoofdstukken 2-4 van de Invoeringswet Boek 2 nieuw B.W. vastgestelde bepalingen van toepassing op
      feiten die na dat tijdstip voorvallen.

      2 Onder bestaande rechtspersonen zijn lichamen die door het in werking treden van [Boek 2][ref2]
      rechtspersoonlijkheid verkrijgen, begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel29
    references:
