      1 De [artikelen 248 lid 3 en 4][ref1] en [255a van Boek 7][ref2] zijn met ingang van het tijdstip van
      inwerkingtreding van de [Wet maximering huurprijsverhogingen geliberaliseerde huurovereenkomsten][ref3] van
      toepassing op de op dat tijdstip bestaande huurovereenkomsten.

