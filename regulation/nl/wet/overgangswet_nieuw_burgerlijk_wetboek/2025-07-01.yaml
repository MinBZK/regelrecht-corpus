  - number: '191'
    text: |-
      1 [Afdeling 3 van titel 5 van Boek 6][ref1] is op algemene voorwaarden die op het tijdstip van het in werking
      treden van de wet reeds door een partij in haar overeenkomsten worden gebruikt, van toepassing nadat een jaar
      na dit tijdstip is verstreken. Gedurende die termijn is de wet evenmin van toepassing op wijzigingen in die
      voorwaarden na het in werking treden van de wet.

      2 In afwijking van [artikel 79][ref2] kan een beding in algemene voorwaarden deel uitmaken van een overeenkomst, na
      het verstrijken van het in lid 1 bedoelde tijdvak overeenkomstig [afdeling 3 van titel 5 van Boek 6][ref3] worden
      vernietigd; deze vernietiging heeft evenwel geen werking over het tijdvak voordat die afdeling van toepassing is
      geworden, tenzij het beding toen reeds vernietigbaar of nietig was.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Afdeling3
      [ref2]: https://wetten.overheid.nl/BWBR0002565#Artikel79
      [ref3]: https://wetten.overheid.nl/BWBR0005289#Afdeling3
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel191
    references:
