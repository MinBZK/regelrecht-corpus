  - number: '68'
    text: In de volgende artikelen worden onder "de wet" verstaan de in werking getreden bepalingen van de Boeken 3-10.
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel68
  - number: 68a
    text: |-
      1 Van het tijdstip van haar in werking treden af is de wet van toepassing, indien op dat tijdstip is voldaan aan
      de door de wet voor het intreden van een rechtsgevolg gestelde vereisten, tenzij uit de volgende artikelen iets
      anders voortvloeit.

      2 Voor zover en zolang op grond van de volgende artikelen de wet niet van toepassing is, blijft het vóór haar in
      werking treden geldende recht van toepassing.
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel68a
  - number: '69'
    text: |-
      Wanneer de wet van toepassing wordt, heeft dat niet tot gevolg dat alsdan:

      a. iemand het vermogensrecht verliest dat hij onder het tevoren geldende recht had verkregen;

      b. een schuld op een ander overgaat;

      c. het bedrag van een vordering wordt gewijzigd;

      d. een vorderingsrecht ontstaat, indien alle feiten die de wet daarvoor vereist, reeds voordien waren voltooid;

      e. een goed met een beperkt recht wordt belast.
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel69
  - number: '71'
    text: |-
      Een beding dat naar een vóór het in werking treden van de wet geldend wetsartikel verwijst of de zakelijke inhoud
      van zo’n artikel weergeeft, wordt geacht een verwijzing naar of een weergave van de wet in te houden, tenzij zulks
      niet in overeenstemming zou zijn met de strekking van het beding.
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel71
  - number: '72'
    text: |-
      1 Indien de wet een verjarings- of vervaltermijn op korter dan een jaar stelt, en die termijn overeenkomstig het in
      de wet bepaalde vóór het tijdstip van haar in werking treden zou aanvangen, dan wordt deze aanvang verschoven naar
      het tijdstip van het in werking treden van de wet.

      2 Strekt de termijn tot vervanging van een termijn die door het tevoren geldende recht werd gesteld, dan eindigt de
      nieuwe termijn uiterlijk op het tijdstip waarop de vervangen termijn zou zijn voltooid.
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel72
  - number: '73'
    text: |-
      1 Indien de wet een verjarings- of vervaltermijn op een jaar of langer stelt, en die termijn overeenkomstig het
      in de wet bepaalde vóór het tijdstip van haar in werking treden aanvangt, dan is het in de wet bepaalde omtrent
      aanvang, duur en aard van die termijn tot een jaar na dat tijdstip niet van toepassing.

      2 De nieuwe termijn wordt geacht niet vóór afloop van dat jaar te zijn voltooid.
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel73
  - number: 73a
    text: |-
      1 In afwijking van de [artikelen 72][ref1] en [73][ref2] kan een bevoegdheid die de wet toekent, niet meer worden
      uitgeoefend, indien de daarvoor bij de wet gestelde termijn reeds op het tijdstip van haar in werking treden is
      verstreken en een bevoegdheid van gelijke aard onder het tevoren geldende recht niet bestond.

      2 Was de termijn waarbinnen volgens het tevoren geldende recht een recht of bevoegdheid moest zijn uitgeoefend,
      reeds verstreken op het in lid 1 bedoelde tijdstip, dan brengt de wet die een recht of bevoegdheid van gelijke aard
      toekent, in het rechtsgevolg van de verjaring of het verval geen verandering.


      [ref1]: https://wetten.overheid.nl/BWBR0002565#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0002565#Artikel73
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel73a
