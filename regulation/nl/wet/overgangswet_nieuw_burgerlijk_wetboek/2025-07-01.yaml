  - number: '151'
    text: |-
      1 De [artikelen 5-12 van Boek 5][ref1] gelden van het tijdstip van het in werking treden der wet af met betrekking
      tot roerende zaken die iemand vóór dat tijdstip als onbeheerd heeft gevonden en tot zich genomen.

      2 De verplichtingen van de vinder bedoeld in [artikel 5 lid 1 van Boek 5][ref2] gelden evenwel niet met betrekking
      tot niet kostbare zaken die de vinder langer dan een jaar vóór dat tijdstip heeft gevonden en tot zich genomen.

      3 Een jaar na het tijdstip van het in werking treden van de wet verkrijgt de vinder die de zaak alsdan in zijn
      macht heeft, de eigendom daarvan, indien hij vóór het genoemde tijdstip de in [artikel 5 lid 1 van Boek 3][ref3]
      omschreven aangifte of mededeling heeft gedaan of deze ingevolge het vorige lid achterwege mocht laten; ten aanzien
      van de vinder geldt hetzelfde, indien een gemeente de zaak in haar macht heeft.

      4 [Artikel 86 van Boek 3][ref4] geldt gedurende een jaar na het in werking treden van de wet niet voor zaken als
      bedoeld in het tevoren geldende artikel 2014 eerste lid van het Burgerlijk Wetboek welke vóór dat tijdstip waren
      verloren, behalve indien zij tijdens dat jaar overeenkomstig titel 2 van Boek 5 door de burgemeester van een
      gemeente zijn verkocht of aan een derde zijn overgedragen. Na afloop van dat jaar vervalt de in artikel 2014 tweede
      lid bedoelde bevoegdheid tot terugvordering van verloren zaken. Vóór het verlies op een zaak gevestigde beperkte
      rechten vervallen door haar overgang op de verkrijger.

      5 De rechtspositie van de vinder die vóór het tijdstip van het in werking treden van de wet overeenkomstig
      [artikel 7 van Boek 5][ref5] heeft gehandeld, gaat op dat tijdstip met de daaraan verbonden verplichtingen over op
      degene aan wie hij de zaak heeft afgegeven; een recht op beloning ontstaat niet.

      6 De leden 1-5 zijn niet van toepassing op gevonden voorwerpen waarmee reeds vóór het in werking treden van de
      wet is gehandeld overeenkomstig de [Wet op de strandvonderij][ref6], het Algemeen Reglement voor het vervoer op de
      spoorwegen of het Postbesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005288#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005291#Artikel86
      [ref5]: https://wetten.overheid.nl/BWBR0005288#Artikel7
      [ref6]: https://wetten.overheid.nl/BWBR0001951
