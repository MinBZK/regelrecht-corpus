      1 Ten aanzien van een gemeenschap van goederen, ontstaan vóór het tijdstip van in werking treden van
      [Boek 1][ref1], zijn de [artikelen 94-98][ref2], [100][ref3], [102 lid 2][ref4], [103 leden 4-6][ref5],
      [104][ref6], [106][ref7], [108][ref8], [109][ref9] en [112 van Boek 1][ref10] alleen van toepassing op feiten,
      voorgevallen na dat tijdstip.

      2 Het tot het tijdstip van in werking treden van [Boek 1 geldende artikel 179, tweede lid][ref11], van het
      Burgerlijk Wetboek blijft van toepassing ten aanzien van goederen die vóór dat tijdstip zijn verkregen.


