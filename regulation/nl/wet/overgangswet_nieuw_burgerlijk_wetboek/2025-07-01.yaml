  - number: '270'
    text: |-
      [Artikel 56 van Boek 10][ref1] is slechts van toepassing op ontbinding van het huwelijk of scheiding van tafel en
      bed die is verzocht na het tijdstip van inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0030068#Artikel56
