        bwb_id: BWBR0005289
        artikel: '236'
  - number: '192'
    text: |-
      [Artikel 78][ref1] geldt niet voor een beding als bedoeld in [artikel 252 van Boek 6][ref2] dat op het
      tijdstip van het in werking treden van de wet uit de openbare registers kenbaar is; de rechtsgevolgen die
      [artikel 252 van Boek 6][ref3] en [afdeling 2 van titel 1 van Boek 3][ref4] aan inschrijving in de openbare
      registers verbinden, komen slechts toe aan inschrijving na dit tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0002565#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel252
      [ref3]: https://wetten.overheid.nl/BWBR0005289#Artikel252
      [ref4]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel192
