  - number: '208'
    text: |-
      [Artikel 220 lid 2 van Boek 7][ref1] is niet van toepassing, indien het door dit lid vereiste redelijke voorstel
      onder het voorafgaande recht is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel220
