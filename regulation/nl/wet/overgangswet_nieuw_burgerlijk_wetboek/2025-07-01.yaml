  - number: '20'
    text: |-
      1 De bepalingen van het Burgerlijk Wetboek omtrent de handelingsonbekwaamheid van onder curatele gestelden,
      zoals deze bepalingen op het tijdstip van in werking treden van [Boek 1][ref1] komen te luiden, zijn op
      de rechtshandelingen die onder curatele gestelden na dat tijdstip verrichten van toepassing, ook al is hun
      curatelestelling uitgesproken met toepassing van het vóór dat tijdstip geldende recht.

      2 Op rechtshandelingen, verricht vóór het in het vorige lid genoemde tijdstip, is ook na dat tijdstip van
      toepassing het bepaalde in de voordien geldende artikelen 501 en 502 van het Burgerlijk Wetboek.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002656
  - number: '21'
    text: |-
      1 Na het tijdstip van in werking treden van [Boek 1][ref1] kan onder curatelestelling slechts worden uitgesproken
      op grond van een der in [artikel 378 van Boek 1][ref2] genoemde omstandigheden, ook al is het verzoek of de
      vordering vóór dat tijdstip gedaan.

      2 [ Artikel 390 van Boek 1][ref3] is van toepassing wanneer de uitspraak na het tijdstip van in werking treden van
      [Boek 1][ref4] is gedaan, ook al was zij reeds vóór dat tijdstip verzocht of gevorderd.

      3 Ingeval vóór het tijdstip van in werking treden van [Boek 1][ref5] krachtens het toen geldende
      artikel 495 van het Burgerlijk Wetboek een provisionele bewindvoerder is benoemd, is het in
      [artikel 380 leden 2 en 3 van Boek 1][ref6] bepaalde slechts van toepassing na wijziging van deze uitspraak met
      overeenkomstige toepassing van artikel 380 lid 4 van Boek 1.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel378
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel390
      [ref4]: https://wetten.overheid.nl/BWBR0002656
      [ref5]: https://wetten.overheid.nl/BWBR0002656
      [ref6]: https://wetten.overheid.nl/BWBR0002656#Artikel380
