  - number: 197a
    text: |-
      [Titel 1AA van Boek 7][ref1] is van toepassing op overeenkomsten voor de levering van digitale inhoud en digitale
      diensten die vóór het inwerkingtreden van deze titel zijn gesloten, met uitzondering van artikel 7:50al en 7:50am.


      [ref1]: https://wetten.overheid.nl/BWBR0005290
