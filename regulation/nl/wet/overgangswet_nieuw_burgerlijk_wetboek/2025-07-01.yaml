      - id: ref2
        bwb_id: BWBR0002761
        afdeling: '7'
  - number: '205'
    text: |-
      Procedures inzake overeenkomsten van huur en verhuur, waarin de inleidende dagvaarding is betekend dan wel het
      inleidende verzoekschrift is ingediend voor het tijdstip van in werking treden van [titel 4 van Boek 7][ref1],
      worden, met inbegrip van een eis die in het geding bij wijze van reconventie is of wordt gedaan, beheerst door het
      recht dat voor dat tijdstip gold.


      [ref1]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel205
    references:
      - id: ref1
        bwb_id: BWBR0005290
  - number: '206'
    text: |-
      Bepalingen die tot nietigheid of vernietigbaarheid van een beding in een huurovereenkomst leiden, zijn met
      ingang van het tijdstip van in werking treden van [titel 4 van Boek 7][ref1] van toepassing op de op dat tijdstip
      bestaande huurovereenkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel206
    references:
      - id: ref1
        bwb_id: BWBR0005290
  - number: 206a
    text: |-
      [Artikel 215 van Boek 7][ref1] is, voor zover het veranderingen en toevoegingen aan de buitenzijde van gehuurde
      woonruimte betreft, niet van toepassing op huurovereenkomsten die voor het tijdstip van het in werking treden van
      [titel 4 van Boek 7][ref2] zijn gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel215
      [ref2]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel206a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '215'
      - id: ref2
        bwb_id: BWBR0005290
  - number: '207'
    text: |-
      Voorzover het veranderingen van de inrichting of de gedaante van het gehuurde betreft, waartoe de huurder
      slechts met toestemming van de verhuurder bevoegd is, is [artikel 215 van Boek 7][ref1] van toepassing, indien de
      verhuurder op het tijdstip van het in werking treden van [titel 4 van Boek 7][ref2] een verzoek van de huurder om
      die toestemming te geven nog niet heeft beantwoord, mits dit verzoek niet langer dan drie maanden voor dat tijdstip
      is gedaan. In dat geval begint de in [artikel 215 lid 2][ref3] bedoelde termijn pas op het tijdstip van die
      inwerkingtreding te lopen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel215
