  - number: '190'
    text: |-
      Wordt bij het ontstaan van een vordering uit onverschuldigde betaling of ongerechtvaardigde verrijking de
      rechtsverhouding tussen partijen beheerst door het recht dat vóór het in werking treden van de wet gold, dan worden
      de [afdelingen 2][ref1] en [3 van titel 4 van Boek 6][ref2] daarop niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Afdeling3
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel190
