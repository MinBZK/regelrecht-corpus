    text: |-
      1 Ten aanzien van de persoon wiens eerste dag van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte
      is gelegen voor 1 januari 2004 blijven de [artikelen 629, leden 1 tot en met 9 en lid 11][ref1], [629a][ref2] en
      [670, met uitzondering van lid 1, van Boek 7][ref3] van toepassing, zoals deze luidden op 31 december 2003, en
      blijft [artikel 658b van Boek 7][ref4] buiten toepassing.

      2 Voor de bepaling van de eerste dag van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte, bedoeld
      in het eerste lid, worden perioden van ongeschiktheid tot werken geacht eenzelfde, niet onderbroken periode van
      ongeschiktheid te vormen, indien zij elkaar met een onderbreking van minder dan vier weken opvolgen of indien
      zij direct voorafgaan aan en aansluiten op een periode waarin zwangerschaps- of bevallingsverlof wordt genoten
      overeenkomstig [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref5], tenzij de ongeschiktheid
      redelijkerwijs niet geacht kan worden voort te vloeien uit dezelfde oorzaak.


