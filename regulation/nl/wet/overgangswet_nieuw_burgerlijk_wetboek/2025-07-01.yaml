  - number: '43'
    text: |-
      Op de coöperatieve vereniging die op het tijdstip van in werking treden van [Boek 2][ref1] de letters W.A. in haar
      naam voert is het voor dat tijdstip geldende recht betreffende de aansprakelijkheid van de leden voor het tekort
      van de vereniging van toepassing indien zij voor dat tijdstip is ontbonden, of, indien zij wordt ontbonden door
      haar insolventie ingevolge een voor dat tijdstip uitgesproken faillissement.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: '44'
    text: |-
      1 Op de coöperatieve vereniging of onderlinge waarborgmaatschappij die op het tijdstip van in werking treden
      van [Boek 2][ref1] niet de letters W.A. of U.A. in haar naam voert blijft, totdat zij haar naam overeenkomstig
      [artikel 42 lid 1][ref2] heeft gewijzigd, het voor dat tijdstip geldende recht betreffende de aansprakelijkheid van
      de leden en de oud-leden van toepassing.

      2 Wordt de vereniging ontbonden of failliet verklaard nadat drie jaren sedert het in werking treden van deze
      wet zijn verlopen en voordat zij haar naam overeenkomstig [artikel 42 lid 1][ref3] heeft gewijzigd, dan is
      [artikel 55 van Boek 2][ref4] van toepassing op de aansprakelijkheid van de leden en de oud-leden tegenover de
      vereffenaars.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0002565#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0002565#Artikel42
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel55
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0002565
        artikel: '42'
      - id: ref3
        bwb_id: BWBR0002565
        artikel: '42'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '55'
  - number: '45'
    text: |-
      Ten aanzien van op het tijdstip van in werking treden van [Boek 2][ref1] bestaande verenigingen zijn, tenzij de
      statuten anders bepalen, de [artikelen 33][ref2], [34][ref3], [35][ref4], [36 lid 1, eerste zin en lid 3][ref5],
      [37][ref6], [38][ref7], [39][ref8], [43 lid 1][ref9], [44][ref10], [45 leden 1-3][ref11], [46][ref12],
      [47 leden 1, 2 en 5][ref13], [49][ref14] en [62 onder b van Boek 2][ref15] niet van toepassing op feiten die zijn
      voorgevallen voordat drie jaren na dat tijdstip zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel34
