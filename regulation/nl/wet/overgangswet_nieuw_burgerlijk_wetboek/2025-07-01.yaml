        artikel: 5a
  - number: '197'
    text: |-
      De [artikelen 2][ref1], [3][ref2], [8][ref3] en [26 leden 3-5 van Boek 7][ref4] zijn niet van toepassing op
      koopovereenkomsten die vóór het tijdstip van het in werking treden van deze bepalingen zijn gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel3
