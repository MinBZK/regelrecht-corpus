  - number: 119b
    text: |-
      1 Ter zake van de rechtsvordering tot vergoeding van schade die een gevolg is van verontreiniging van lucht, water
      of bodem, eindigt de termijn van vijf jaren bedoeld in [artikel 310 lid 1 van Boek 3][ref1] niet vóór 1 januari
      1997.

      2 In afwijking van [artikel 73][ref2] is [artikel 310 lid 2 van Boek 3][ref3] van toepassing vanaf het tijdstip
      waarop het in werking treedt.

      3 Wat voor de gebeurtenissen bedoeld in [artikel 310 lid 3 van Boek 3][ref4] is bepaald, geldt ook indien de
      gebeurtenis is aangevangen of voorgevallen vóór het tijdstip waarop dat lid in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel310
