  - number: '251'
    text: |-
      De overeenkomsten van vervoer en die tot het doen vervoeren van goederen, alsmede andere overeenkomsten tot het
      ter beschikking stellen van een schip worden beheerst door het vroegere recht, indien zij zijn gesloten vóór het
      tijdstip van het in werking treden van [Boek 8][ref1]. Hetzelfde geldt voor de wettelijke rechten en bevoegdheden
      die een derde aan een vervoerdocument kan ontlenen en de wettelijke verplichtingen die met betrekking daartoe op
      hem rusten, indien dat document vóór dat tijdstip is uitgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005034
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel251
    references:
      - id: ref1
        bwb_id: BWBR0005034
  - number: 251a
    text: |-
      De overeenkomsten van vervoer van goederen uitsluitend over spoorwegen worden beheerst door het vroegere recht,
      indien zij zijn gesloten vóór het tijdstip van het in werking treden van de wet tot vaststelling en invoering van
      [titel 8.18 (overeenkomst van goederenvervoer over spoorwegen) van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005034
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel251a
    references:
      - id: ref1
        bwb_id: BWBR0005034
  - number: '252'
    text: |-
      1 De bepalingen van [Boek 8][ref1] omtrent de rangorde waarin vorderingen uit de opbrengst van een goed moeten
      worden voldaan, gelden mede met betrekking tot vorderingen die bestaan op het tijdstip waarop dat Boek in werking
      treedt.

      2 Het vroegere recht is echter van toepassing op de rangorde bij de verdeling van een goed dat op het tijdstip van
      in werking treden van [Boek 8][ref2] reeds ten behoeve van het verhaal is verkocht, en op de verdeling van hetgeen
      op een vordering op dat tijdstip reeds is geïnd.

      3 Het vroegere recht is eveneens van toepassing op de rang van vorderingen op een in staat van faillissement
      verklaarde schuldenaar, indien [Boek 8][ref3] in werking treedt nadat de rechter-commissaris overeenkomstig
      [artikel 108 der Faillissementswet][ref4] de dag heeft bepaald waarop die vorderingen uiterlijk ter verificatie
      moeten zijn ingediend.

      4 Het in werking treden van [Boek 8][ref5] heeft voor de dan bestaande vorderingen geen gevolg ten aanzien van de
      werking van een surséance van betaling, die voordien aan de schuldenaar voorlopig is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005034
      [ref2]: https://wetten.overheid.nl/BWBR0005034
      [ref3]: https://wetten.overheid.nl/BWBR0005034
      [ref4]: https://wetten.overheid.nl/BWBR0001860#Artikel108
      [ref5]: https://wetten.overheid.nl/BWBR0005034
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel252
