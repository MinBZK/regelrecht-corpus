  - number: '200'
    text: |-
      [Titel 2D][ref1] is niet van toepassing op overeenkomsten die voor het in werking treden van die titel zijn
      gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel200
    references:
      - id: ref1
        bwb_id: BWBR0005290
  - number: '201'
    text: |-
      Op een bewind ingesteld in verband met de [elfde titel van Boek 7A van het Burgerlijk Wetboek](onbekend), zoals
      deze tot aan het tijdstip van het in werking treden van [de wet][ref1] gold, is vanaf het tijdstip van het in
      werking treden van de wet [afdeling 7 van titel 5 van Boek 4][ref2] van overeenkomstige toepassing, behoudens voor
      zover daarvan bij het bewind afwijkende regelingen zijn getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002761
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Afdeling7
    url: https://wetten.overheid.nl/BWBR0002565/2025-07-01#Artikel201
