  - number: '199'
    text: |-
      1 De bepalingen van [afdeling 9A van titel 1 van Boek 7][ref1] zoals die golden tot de inwerkingtreding van de
      [Implementatiewet richtlijn consumentenrechten][ref2] (Stb. 2014, 140) zijn niet van toepassing op overeenkomsten
      die vóór het tijdstip van het in werking treden van die bepalingen zijn gesloten.

      2 In afwijking van lid 1 zijn de [artikelen 46c lid 1][ref3], [46g][ref4] en [46h van Boek 7][ref5] zoals die
      golden tot de inwerkingtreding van de [Implementatiewet richtlijn consumentenrechten][ref6] (Stb. 2014, 140) van
      toepassing vanaf het tijdstip waarop zij in werking treden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Afdeling9A
      [ref2]: https://wetten.overheid.nl/BWBR0035034
