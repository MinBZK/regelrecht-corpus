  - number: '32'
    text: |-
      1 Ontbinding van een op het tijdstip van in werking treden van [Boek 2][ref1] bestaande rechtspersoon op grond van
      [artikel 19 van Boek 2][ref2] kan niet worden gevorderd voordat drie jaren na dat tijdstip zijn verstreken.

      2 Het vorige lid geldt niet voor stichtingen waarop de Wet op stichtingen van toepassing was.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel19
