  - number: '3'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0041161/2019-08-01#Artikel3
  - number: '4'
    text: 'Deze wet wordt aangehaald als: Wet gedeeltelijk verbod gezichtsbedekkende kleding.'
    url: https://wetten.overheid.nl/BWBR0041161/2019-08-01#Artikel4
