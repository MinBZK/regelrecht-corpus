preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een wettelijk verbod in te stellen op het dragen van
    gezichtsbedekkende kleding in het openbaar vervoer en in gebouwen en bijbehorende erven van onderwijsinstellingen,
    overheidsinstellingen en zorginstellingen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0041161/2019-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Het is verboden om in het openbaar vervoer en in gebouwen en bijbehorende erven van onderwijsinstellingen,
      overheidsinstellingen en zorginstellingen kleding te dragen die het gezicht geheel bedekt of zodanig bedekt dat
      alleen de ogen onbedekt zijn, dan wel onherkenbaar maakt.

      2 Het eerste lid is niet van toepassing, voor zover kleding als bedoeld in dat lid:

      a. wordt gedragen door cliënten, patiënten of hun bezoekers in residentiële delen van zorginstellingen,

      b. noodzakelijk is ter bescherming van het lichaam in verband met de gezondheid of de veiligheid,

      c. noodzakelijk is in verband met eisen die aan de uitoefening van een beroep of de beoefening van een sport worden
      gesteld, of

      d. passend is in verband met het deelnemen aan een feestelijke of een culturele activiteit.

      3 In afwijking van het eerste lid kan het bevoegd gezag van een zorginstelling toestaan dat kleding als bedoeld in
      dat lid in niet-residentiële delen van de zorginstelling wordt gedragen door cliënten of patiënten die daar voor
      onbepaalde tijd verblijven, of hun bezoekers.
    url: https://wetten.overheid.nl/BWBR0041161/2019-08-01#Artikel1
  - number: '2'
    text: |-
      1 Degene die handelt in strijd met [artikel 1, eerste lid][ref1], wordt gestraft met een geldboete van de eerste
      categorie.

      2 Het in het eerste lid strafbaar gestelde feit is een overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0041161#Artikel1
    url: https://wetten.overheid.nl/BWBR0041161/2019-08-01#Artikel2
