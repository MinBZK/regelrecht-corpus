    text: |-
      een elektrisch aangedreven gesloten warmtepomp met een COP-waarde van ten minste 2,3 en een nominaal thermisch
      vermogen van ten minste 500 kWth, waarbij het aantal subsidiabele vollasturen ten hoogste 8.000 vollasturen per
      jaar bedraagt;
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel75
  - number: 75.1.b
    text: |-
      een elektrisch aangedreven gesloten warmtepomp met een COP-waarde van ten minste 2,3 en een nominaal thermisch
      vermogen van ten minste 500 kWth waarbij het aantal subsidiabele vollasturen ten hoogste 3.000 vollasturen per
      jaar bedraagt;
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel75
  - number: 75.1.c
    text: |-
      een elektrisch aangedreven open warmtepomp met een COP-waarde van ten minste 2,3 en ten hoogste 12,0 en een
      nominaal thermisch vermogen van ten minste 500 kWth, waarbij het aantal subsidiabele vollasturen ten hoogste 8.000
      vollasturen per jaar bedraagt; of
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel75
  - number: 75.1.d
    text: |-
      een elektrisch aangedreven open warmtepomp met een COP-waarde van ten minste 2,3 en ten hoogste 12,0 en een
      nominaal thermisch vermogen van ten minste 500 kWth waarbij het aantal subsidiabele vollasturen ten hoogste 3.000
      vollasturen per jaar bedraagt.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel75
  - number: '75.2'
    text: |-
      De productie-installatie produceert warmte die op dezelfde locatie wordt gebruikt voor een industriële toepassing,
      niet zijnde tuinbouw, en levert geen koude.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel75
  - number: '75.3'
    text: |-
      De feitelijke productie van een productie-installatie als bedoeld in het eerste lid, onderdelen b en d, bedraagt
      ten hoogste 4.000 productie-uren per jaar.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel75
  - number: '76.1'
    text: |-
      De subsidie, bedoeld in [artikel 75, eerste lid][ref1], wordt voor een periode van twaalf jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0046631#Artikel75
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0046631
        artikel: '75'
        paragraaf: 3.4.7
  - number: '76.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie binnen vier jaar na de datum van inwerkingtreding van de
      beschikking tot subsidieverlening in gebruik.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel76
  - number: '76.3'
    text: |-
      De subsidieontvanger draagt er zorg voor dat de opgewekte koolstofdioxide-arme warmte die voor subsidie in
      aanmerking komt, wordt aangewend als nuttig aangewende koolstofdioxide-arme warmte.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel76
  - number: '77.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van koolstofdioxide-arme warmte geproduceerd door
      een productie-installatie met een thermisch vermogen van ten minste 2 MWth, waarmee restwarmte wordt uitgekoppeld
      en naar een andere locatie wordt getransporteerd, waarbij ten minste de warmtewisselaar bij de uitkoppeling nieuw
      is, en:
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel77
  - number: 77.1.a
    text: |-
      de warmte wordt opgewaardeerd met een nieuwe warmtepomp met een nominaal thermisch vermogen van ten minste 500
      kWth en een COP-waarde van ten minste 3,0 en transport plaatsvindt met behulp van een transportleiding met een
      verhouding van kilometer nieuw aan te leggen transportleiding per MWth outputvermogen van de productie-installatie
      en andere op de transportleiding invoedende installaties van:
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel77
  - number: 77.1.a.1°
    text: ≥ 0,10 en < 0,20;
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel77
  - number: 77.1.a.2°
    text: ≥ 0,20 en < 0,30;
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel77
  - number: 77.1.a.3°
    text: ≥ 0,30 en < 0,40;
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel77
  - number: 77.1.a.4°
    text: ≥ 0,40; of
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel77
  - number: 77.1.b
    text: |-
      de warmte niet wordt opgewaardeerd en transport plaatsvindt met behulp van een transportleiding met een verhouding
      van kilometer nieuw aan te leggen transportleiding per MWth outputvermogen van de productie-installatie en andere
      op de transportleiding invoedende installaties van:
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel77
  - number: 77.1.b.1°
    text: ≥ 0,10 en < 0,20;
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel77
  - number: 77.1.b.2°
    text: ≥ 0,20 en < 0,30;
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel77
  - number: 77.1.b.3°
    text: ≥ 0,30 en < 0,40;
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel77
  - number: 77.1.b.4°
    text: ≥ 0,40.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel77
  - number: '77.2'
    text: De levering van stoom wordt uitgesloten van subsidie.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel77
  - number: '78.1'
    text: |-
      De subsidie, bedoeld in [artikel 77, eerste lid][ref1], wordt voor een periode van vijftien jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0046631#Artikel77
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0046631
        artikel: '77'
        paragraaf: 3.4.8
  - number: '78.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie binnen vier jaar na de datum van inwerkingtreding van de
      beschikking tot subsidieverlening in gebruik.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel78
  - number: '78.3'
    text: |-
      De subsidieontvanger draagt er zorg voor dat de opgewekte koolstofdioxide-arme warmte die voor subsidie in
      aanmerking komt, wordt aangewend als nuttig aangewende koolstofdioxide-arme warmte.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel78
  - number: '79.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van waterstof geproduceerd door een productie-
      installatie die waterstof produceert met behulp van elektrolyse met een nominale capaciteit van ten minste 500
      kW met:
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel79
  - number: 79.1.a
    text: een aansluiting op het elektriciteitsnet; of
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel79
  - number: 79.1.b
    text: |-
      een directe aansluiting op een productie-installatie die elektriciteit produceert met behulp van windenergie of een
      productie-installatie die elektriciteit produceert uit zonlicht door middel van fotovoltaïsche zonnepanelen.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel79
  - number: '79.2'
    text: |-
      De productie-installatie is in staat om, terwijl deze gereed is voor gebruik, minder dan 1% elektriciteit te
      verbruiken van het maximale vermogen van de productie-installatie.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel79
  - number: '79.3'
    text: |-
      De feitelijke productie van een productie-installatie als bedoeld in het eerste lid, onderdeel a, bedraagt ten
      hoogste 5.000 productie-uren per jaar.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel79
  - number: '79.4'
    text: 'De subsidie, bedoeld in het eerste lid, aanhef en onderdeel b, wordt niet verstrekt indien:'
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel79
  - number: 79.4.a
    text: |-
      voor de productie van de geleverde elektriciteit van een productie-installatie die elektriciteit produceert met
      behulp van windenergie, of een productie-installatie die elektriciteit produceert uit door middel van zonne-energie
      subsidie is of wordt verstrekt; of
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel79
  - number: 79.4.b
    text: |-
      de door de productie-installatie gebruikte elektriciteit niet is geproduceerd door de productie-installatie voor
      hernieuwbare elektriciteit die met de directe lijn is aangesloten.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel79
  - number: '80.1'
    text: |-
      De subsidie, bedoeld in [artikel 79, eerste lid][ref1], wordt voor een periode van vijftien jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0046631#Artikel79
