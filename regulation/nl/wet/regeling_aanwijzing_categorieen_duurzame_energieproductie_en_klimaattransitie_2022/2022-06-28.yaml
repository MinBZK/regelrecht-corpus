  - number: '39'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte geproduceerd door een
      productie-installatie die ingrijpend wordt gerenoveerd en waarmee:

      a. uitsluitend door middel van allesvergisting hernieuwbare warmte wordt geproduceerd, waarvoor reeds subsidie
      op grond van het [Besluit SDE][ref1] is verstrekt en waarvoor op het moment van aanvraag ten minste negen jaar
      voordien de subsidieperiode is aangevangen;

      b. uitsluitend door middel van allesvergisting hernieuwbare elektriciteit en hernieuwbare warmte wordt
      geproduceerd, waarvoor reeds subsidie op grond van het [Besluit SDE][ref2] is verstrekt en waarvoor op het moment
      van aanvraag ten minste negen jaar voordien de subsidieperiode is aangevangen;

      c. uitsluitend door middel van monomestvergisting met een vermogen kleiner dan of gelijk aan 400 kW hernieuwbare
      warmte wordt geproduceerd, waarvoor reeds subsidie op grond van het [Besluit SDE][ref3] is verstrekt en waarvoor op
      het moment van aanvraag ten minste negen jaar voordien de subsidieperiode is aangevangen; of

      d. uitsluitend door middel van monomestvergisting met een vermogen kleiner dan of gelijk aan 400 kW
      hernieuwbare elektriciteit en hernieuwbare warmte wordt geproduceerd, waarvoor reeds subsidie op grond van
      het [Besluit SDE][ref4] is verstrekt en waarvoor op het moment van aanvraag ten minste negen jaar voordien de
      subsidieperiode is aangevangen.


