        bwb_id: BWBR0046631
        artikel: '23'
        paragraaf: 3.1.7
  - number: '24.5'
    text: |-
      [Artikel 3, eerste lid, van de algemene uitvoeringsregeling][ref1]
      is niet van toepassing op een productie-installatie als bedoeld in
      __REF001___________________________________________________________________________________________________________
      ___________.


