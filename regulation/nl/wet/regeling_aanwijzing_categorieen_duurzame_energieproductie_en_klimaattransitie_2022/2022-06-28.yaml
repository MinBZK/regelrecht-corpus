  - number: '91.4'
    text: |-
      In afwijking van de fasebedragen, genoemd in de derde, vierde, vijfde, zesde of zevende kolom van de tabel
      in het tweede lid, geldt voor de productie-installaties, bedoeld in de [artikelen 85, eerste lid][ref1],
      [87, eerste lid][ref2], en [89, eerste lid][ref3], het fasebedrag in euro per 1.000 kg broeikasgas in vier
      decimalen dat door de aanvrager bij de aanvraag in een fase is ingediend, indien dat bedrag per 1.000 kg
      broeikasgas lager is dan het fasebedrag, genoemd in de respectievelijke derde, vierde, vijfde, zesde of zevende
      kolom van de tabel in het tweede lid, dat van toepassing is voor de fase waarin de aanvraag is ingediend.


