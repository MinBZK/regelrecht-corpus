  - number: 85.1.a.2°
    text: vloeibaar transport van koolstofdioxide, en ten minste de vervloeiingsinstallatie nieuw is; of
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel85
  - number: 85.1.a.3°
    text: vloeibaar transport van koolstofdioxide;
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel85
  - number: 85.1.b
    text: |-
      het aantal subsidiabele vollasturen ten hoogste 8.000 vollasturen per jaar bedraagt, de koolstofdioxide wordt
      afgevangen die ontstaat bij een op het moment van indienen van de aanvraag bestaand proces, en gebruik wordt
      gemaakt van:
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel85
  - number: 85.1.b.1°
    text: gasvormig transport van koolstofdioxide door een buisleiding, en ten minste de compressor nieuw is; of
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel85
  - number: 85.1.b.2°
    text: vloeibaar transport van koolstofdioxide, en ten minste de vervloeiingsinstallatie nieuw is;
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel85
  - number: 85.1.c
    text: |-
      de koolstofdioxide wordt afgevangen die ontstaat bij een op het moment van indienen van de aanvraag bestaand
      proces, en gebruik wordt gemaakt van:
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel85
  - number: 85.1.c.1°
    text: |-
      gasvormig transport van koolstofdioxide door een buisleiding en ten minste de installatie voor de afvang van
      koolstofdioxide en de compressor nieuw zijn; of
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel85
  - number: 85.1.c.2°
    text: |-
      vloeibaar transport van koolstofdioxide, en ten minste de installatie voor de afvang van koolstofdioxide en de
      vervloeiingsinstallatie nieuw zijn;
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel85
