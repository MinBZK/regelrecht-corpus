  - number: '63'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent die broeikasgas vermindert door:

      a. een productie-installatie, bestaande uit één of meer doubletten, waarmee koolstofdioxide-arme warmte wordt
      geproduceerd uitsluitend door middel van één of meer geothermische bronnen met een diepte van ten minste 500 meter
      en kleiner dan 1.500 meter, waarbij de warmte wordt opgewaardeerd met een compressiewarmtepomp met een COP-waarde
      van ten minste 3,0 en met een nominaal thermisch vermogen van ten minste 500 kWth;

      b. een productie-installatie, bestaande uit één of meer doubletten, waarmee koolstofdioxide-arme warmte wordt
      geproduceerd uitsluitend door middel van één of meer geothermische bronnen met een diepte van ten minste 500 meter
      en kleiner dan 1.500 meter, waarbij de warmte wordt opgewaardeerd met een compressiewarmtepomp met een COP-waarde
      van ten minste 3,0 en met een nominaal thermisch vermogen van ten minste 500 kWth en de warmte wordt aangewend voor
      de verwarming van gebouwde omgeving; of

      c. een productie-installatie, bestaande uit één of meer doubletten, waarmee koolstofdioxide-arme warmte wordt
      geproduceerd uitsluitend door middel van één of meer geothermische bronnen met een diepte van ten minste 1.500
      meter, waarbij de warmte wordt opgewaardeerd met een compressiewarmtepomp met een COP-waarde van ten minste 3,0 en
      met een nominaal thermisch vermogen van ten minste 500 kWth en waarbij alle geproduceerde warmte wordt toegepast in
      een verwarmingssysteem met een aanvoertemperatuur aan de gebruikerszijde van ten minste 90 °C in het stookseizoen
      en de warmte wordt aangewend voor de verwarming van gebouwde omgeving.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel63
