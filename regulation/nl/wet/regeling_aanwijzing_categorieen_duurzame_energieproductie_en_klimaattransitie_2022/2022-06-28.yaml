    text: |-
      De subsidieontvanger draagt er zorg voor dat wordt aangetoond dat de gebruikte biomassa voldoet aan de
      duurzaamheids- en broeikasgasemissiereductiecriteria, bedoeld in artikel 29, eerste lid, van de [richtlijn (EU)
