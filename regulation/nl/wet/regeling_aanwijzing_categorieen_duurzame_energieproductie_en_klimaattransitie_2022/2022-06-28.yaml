articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *algemene uitvoeringsregeling:*
      [Algemene uitvoeringsregeling stimulering duurzame energieproductie en klimaattransitie][ref1];
        - *allesvergisting:* biologische afbraakreacties van biomassa als bedoeld in de NTA 8003:2017, met uitzondering van
      de nummers 400, 410, 420, 500, 550 tot en met 559, waarvan de biogasopbrengst van de ingaande stroom ten minste 25
      Nm3 aardgasequivalent per ton bedraagt;
        - *beschermingszone:* beschermingszone als bedoeld in appendix B bij
      [bijlage I bij de Regeling veiligheid primaire waterkeringen 2017][ref2];
        - *besluit:* [Besluit stimulering duurzame energieproductie en klimaattransitie][ref3];
        - *Besluit SDE:* [Besluit stimulering duurzame energieproductie][ref4], zoals dit luidde op 31 oktober 2020;
        - *biosyngas:* mengsel van gassen dat is geproduceerd door vergassing van biomassa en dat geen nadere bewerking tot
      methaan heeft ondergaan;
        - *COP-waarde:* coëfficiënt van prestatie uitgedrukt in de hoeveelheid afgegeven warmte aan de condensorzijde per
      hoeveelheid opgenomen elektriciteit;
        - *doublet:* combinatie van naast elkaar liggende diepboringen die ten minste bestaat uit één productieput en één
      injectieput;
        - *geavanceerde hernieuwbare brandstof:* biobrandstof als bedoeld in artikel 2, onderdeel 33, van [richtlijn (EU)
      2018/2001](32018L2001) van het Europees Parlement en de Raad van 11 december 2018 ter bevordering van het gebruik
      van energie uit hernieuwbare bronnen (PbEU 2018, L 328) en geproduceerd uit grondstoffen als bedoeld in deel A van
      bijlage IX bij die richtlijn;
        - *gebouw:* bouwwerk dat een voor mensen toegankelijke overdekte geheel of gedeeltelijk met wanden omsloten ruimte
      vormt, niet zijnde een bouwwerk dat bedoeld is om voor een periode van ten hoogste vijftien jaar op een bepaalde
      plaats aanwezig te zijn;
        - *ketel:* installatie waarin brandstof wordt verstookt waarbij de verbrandingswarmte met een warmtewisselaar wordt
      overgedragen aan een vloeistof;
        - *monomestvergisting:* biologische afbraakreacties van uitsluitend vaste en vloeibare uitwerpselen van dieren;
        - *minister:* Minister voor Klimaat en Energie;
        - *netto P50-waarde vollasturen:* aantal vollasturen waarbij de verwachte jaarlijkse energieproductie voor een
      gegeven combinatie van locatie en productie-installatie voor de productie van hernieuwbare elektriciteit met behulp
      van windenergie is bepaald met een waarschijnlijkheid van 50%;
        - *nominaal elektrisch rendement:* uitkomst van de deling van het nominaal elektrisch vermogen en; a. de som van
      het nominaal elektrisch vermogen en nominaal warmtevermogen in het geval van gecombineerde opwekking met behulp van
      een verbrandingsmotor; en b. het nominaal warmtevermogen van de ketel in het geval van gecombineerde opwekking met
      behulp van een stoomturbine of een organische rankinecyclus;
        - *nominaal vermogen:* maximale vermogen van een productie-installatie dat onder nominale condities benut kan
      worden voor de productie van hernieuwbare elektriciteit, hernieuwbare warmte, nuttig aangewende koolstofdioxide-
      arme warmte of hernieuwbaar gas en dat door de leverancier wordt gegarandeerd bij continu gebruik, waarbij in het
      geval van geothermische productie-installaties het nominaal vermogen is bepaald met een waarschijnlijkheid van ten
      minste 50%;
        - *NTA 8003:2017:* Nederlandse Technische Afspraak 8003, Classificatie van biomassa voor energietoepassing,
      uitgegeven door de Stichting Nederlands Normalisatie-instituut, zoals deze luidde op 30 november 2017;
        - *nuttig aangewende warmte:* nuttig aangewende warmte als bedoeld in
      [artikel 1 van de Regeling garanties van oorsprong en certificaten van oorsprong][ref5];
        - *nuttig aangewende koolstofdioxide:* nuttig aangewende koolstofdioxide als bedoeld in
      [artikel 1 van de algemene uitvoeringsregeling][ref6];
        - *nuttig aangewende koolstofdioxide-arme warmte:* nuttig aangewende koolstofdioxide-arme warmte als bedoeld in
      [artikel 1 van de algemene uitvoeringsregeling][ref7];
        - *primaire waterkering:* primaire waterkering als bedoeld in appendix B bij
      [bijlage I bij de Regeling veiligheid primaire waterkeringen 2017][ref8];
        - *productie-uren:* som van de tijdsperioden waarin een productie-installatie in deellast of op vol vermogen
      produceert;
        - *restwarmte:* onvermijdelijke thermische energie die als bijproduct in de bedrijfsvoering van een onderneming
      wordt opgewekt en die zonder nuttige aanwending ongebruikt terecht zou komen in lucht of water en die op het moment
      van indienen van de aanvraag niet nuttig wordt aangewend;
        - *richtlijn (EU) 2018/2001:* [richtlijn nr. (EU) 2018/2001](32018L2001) van het Europees Parlement en de Raad van
      11 december 2018 ter bevordering van het gebruik van energie uit hernieuwbare bronnen (PbEU 2018, L 328);
        - *SBI-code:* code, opgenomen in de Standaard Bedrijfs Indeling 2008, Versie 2018, Update 2021;
        - *stadsverwarming:* warmtelevering aan een warmtenet als bedoeld in
      [artikel 1, eerste lid, van de Warmtewet][ref9], waarbij door een producent de warmte voor ruimteverwarming en
      warmtapwatervoorzieningen van gebouwen wordt geleverd;
        - *thermische conversie van vaste of vloeibare biomassa:* omzetting van vaste of vloeibare biomassa door: a.
      verbranding; b. een andere thermische behandeling dan bedoeld onder a in het geval de producten daarvan vervolgens
      worden verbrand; of c. de verbranding van producten die voortkomen uit thermische behandeling;
        - *valhoogte:* verschil in waterpeil voor en achter een productie-installatie voor de productie van hernieuwbare
      elektriciteit door waterkracht waarbij het nominaal vermogen wordt benut;
        - *verwarming van gebouwde omgeving:* stadsverwarming of ruimteverwarming en warmtapwatervoorzieningen in een
      gebouw, niet zijnde een kas, waarbij de producent de warmte rechtstreeks levert aan dat gebouw;
        - *voorliggende waterkering:* voorliggende waterkeringen als genoemd in de paragrafen 5.2.4 tot en met 5.7.4 van
      [bijlage I bij de Regeling veiligheid primaire waterkeringen 2017][ref10];
        - *waterstaatswerk:* waterstaatswerk als bedoeld in appendix B bij
      [bijlage I bij de Regeling veiligheid primaire waterkeringen 2017][ref11];
        - *zeewering of zachte zeewering van Maasvlakte 2:* harde zeewering en zachte zeewering van Maasvlakte 2 als
      bedoeld in bijlage 1 bij de concessie aan het Havenbedrijf Rotterdam N.V. te Rotterdam, bij koninklijk besluit van
      23 mei 2008, nr. 08.001524.


