  - number: '89.3'
    text: |-
      Een productie-installatie als bedoeld in het eerste lid, aanhef en onderdeel a, subonderdelen 1° of 2°,
      onderdeel c, subonderdelen 1° of 2°, onderdeel d, subonderdelen 1° of 2°, onderdeel e, subonderdelen 1°
