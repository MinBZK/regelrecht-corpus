      beschikking tot subsidieverlening in gebruik.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel42
  - number: '42.3'
    text: |-
      De subsidieontvanger draagt er zorg voor dat de opgewekte hernieuwbare warmte die voor subsidie in aanmerking komt,
      wordt aangewend als nuttig aangewende warmte.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel42
  - number: '42.4'
    text: |-
      De subsidieaanvrager maakt aannemelijk dat de voorgestelde aanpassingen een verbetering van 25% inhouden ten
      opzichte van de gemiddelde productie van het jaar voorafgaande aan de aanvraag, of, wanneer de producent minder dan
      een jaar produceert, ten opzichte van de totale gemiddelde productie tot het moment van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel42
  - number: '42.5'
    text: |-
      De subsidieontvanger draagt er zorg voor dat wordt aangetoond dat de in een installatie voor de opwekking van
      warmte of gecombineerde opwekking van warmte en elektriciteit met een totaal nominaal thermisch ingangsvermogen
      gelijk aan of groter dan 2 MW gebruikte biomassa voldoet aan de broeikasgasemissiereductiecriteria bedoeld in
      artikel 29, eerste lid, van de [richtlijn (EU) 2018/2001](32018L2001).
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel42
  - number: '43'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte of hernieuwbare elektriciteit
      en hernieuwbare warmte geproduceerd door een productie-installatie voor de productie van hernieuwbare warmte of
      hernieuwbare elektriciteit en hernieuwbare warmte door middel van verbranding van vloeibare biomassa als bedoeld
      in de nummers 512, 514, 517, 518, 543, 545, 550 tot en met 579, 587, 594, 595 en 800 tot en met 809 van de NTA
      8003:2017, met een brander in een ketel, met een nominaal thermisch vermogen gelijk aan of groter dan 0,5 MWth en
      een nominaal elektrisch vermogen kleiner dan of gelijk aan 100 MW.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel43
  - number: '44.1'
    text: |-
      De subsidie, bedoeld in [artikel 43][ref1], wordt voor een periode van twaalf jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0046631#Artikel43
