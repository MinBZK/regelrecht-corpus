    text: |-
      1 Als te renoveren productie-installaties waarvoor subsidie kan worden verstrekt als bedoeld in
      [artikel 3, eerste lid, onderdeel c, en derde lid, onderdeel c, van het besluit][ref1] worden aangewezen:

      a. productie-installaties waarmee hernieuwbare elektriciteit wordt geproduceerd als bedoeld in
      [artikel 11, onderdeel c][ref2]; en

      b. productie-installaties waarmee hernieuwbare warmte of hernieuwbare elektriciteit en hernieuwbare warmte uit
      biomassa wordt geproduceerd als bedoeld in [artikel 57, eerste lid][ref3].

      2 Als productie-installaties die als bedoeld in [artikel 3, tweede lid, onderdeel a, van het besluit][ref4] worden
      aangewezen:

      a. productie-installaties waarmee hernieuwbaar gas door biomassa wordt geproduceerd als bedoeld in
      [artikel 27][ref5];

      b. productie-installaties waarmee hernieuwbare warmte of hernieuwbare elektriciteit en hernieuwbare warmte uit
      biomassa wordt geproduceerd als bedoeld in [artikel 39][ref6];

      c. productie-installaties waarmee hernieuwbare warmte of hernieuwbare elektriciteit en hernieuwbare warmte uit
      biomassa wordt geproduceerd als bedoeld in de [artikelen 43][ref7] en [57, eerste lid][ref8];

      d. productie-installaties waarmee broeikasgas wordt verminderd als bedoeld
      in [artikel 85, eerste lid, onderdelen c tot en met g][ref9], indien
      deze worden gecombineerd met een productie-installatie als bedoeld in
      __REF001___________________________________________________________________________________________________________
      ______________ of in
      __REF002___________________________________________________________________________________________________________
      ____________________________________________; en

      e. productie-installaties waarmee broeikasgas wordt verminderd als bedoeld
      in [artikel 87, eerste lid, onderdelen c tot en met h][ref12], indien
      deze worden gecombineerd met een productie-installatie als bedoeld in
      __REF001___________________________________________________________________________________________________________
      __________________________.

      3 Als te renoveren productie-installaties waarvoor subsidie kan worden verstrekt als bedoeld in
      [artikel 3, tweede lid, onderdeel c, van het besluit][ref14] worden aangewezen:

      a. productie-installaties waarmee hernieuwbaar gas door biomassa wordt geproduceerd als bedoeld in
      [artikel 27][ref15]; en

      b. productie-installaties waarmee hernieuwbare warmte of hernieuwbare elektriciteit en hernieuwbare warmte uit
      biomassa wordt geproduceerd als bedoeld in [artikel 39][ref16].

      4 Als productie-installaties waarvoor subsidie wordt verstrekt indien deze geheel of deels bestaat uit gebruikte
      materialen als bedoeld in [artikel 3, vierde lid, van het besluit][ref17] worden aangewezen:

      a. productie-installaties waarmee hernieuwbare elektriciteit wordt geproduceerd als bedoeld in
      [artikel 11, onderdeel c][ref18];

      b. productie-installaties waarmee hernieuwbaar gas wordt geproduceerd als bedoeld in de [artikelen 25][ref19],
      [27][ref20], [29, eerste lid][ref21], [31][ref22] en [33][ref23];

      c. productie-installaties waarmee hernieuwbare warmte, hernieuwbare elektriciteit of hernieuwbare
      elektriciteit en hernieuwbare warmte wordt geproduceerd als bedoeld in de [artikelen 37][ref24], [39][ref25],
      [41, eerste lid][ref26], [43][ref27], [45][ref28], [47][ref29], [49][ref30], [51][ref31], [53][ref32], [55][ref33],
      [57, eerste lid][ref34], en [61, onderdeel e][ref35];

      d. productie-installaties waarmee koolstofdioxide-arme warmte wordt geproduceerd als bedoeld in
      [artikel 77, eerste lid][ref36];

      e. productie-installaties waarmee koolstofdioxide wordt afgevangen en permanent opgeslagen als bedoeld in
      [artikelen 85, eerste lid][ref37], en [87, eerste lid][ref38]; en

      f. productie-installaties waarmee koolstofdioxide wordt afgevangen en gebruikt als bedoeld in
      [artikel 89, eerste lid][ref39].


