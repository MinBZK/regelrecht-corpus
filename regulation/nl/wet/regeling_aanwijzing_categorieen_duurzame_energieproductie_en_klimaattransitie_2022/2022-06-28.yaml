    text: |-
      1 Een subsidie als bedoeld in de
      __REF000___________________________________________________________________________________________________________
      _________,
      [87, eerste lid, onderdeel a, subonderdeel 2°, onderdeel b, subonderdeel 2°, en onderdelen c tot en met h][ref2],
      en [89, eerste lid, onderdelen a tot en met f][ref3], of een subsidie van meer dan € 400.000.000,– wordt verleend
      onder de volgende opschortende voorwaarden:

      a. binnen twee weken na afgifte van de betreffende beschikking tot subsidieverlening is een uitvoeringsovereenkomst
      tot stand gekomen tussen de Staat en de subsidieontvanger;

      b. de subsidieontvanger heeft binnen vier weken na afgifte van de beschikking tot subsidieverlening aangetoond dat
      een bankgarantie als bedoeld in artikel 2, eerste lid, van de uitvoeringsovereenkomst is afgegeven.

      2 Voor het opstellen van een uitvoeringsovereenkomst als bedoeld in het eerste lid wordt gebruik gemaakt van het in
      [bijlage 1][ref4] opgenomen model.

      3 Het eerste lid is niet van toepassing op een productie-installatie als bedoeld in
      [artikel 9b, eerste lid, onderdeel a, van de Elektriciteitswet 1998][ref5].

      4 Indien voor dezelfde periode, of gedeeltelijk voor dezelfde periode, meer beschikkingen zijn afgegeven
      voor dezelfde productie-installatie en dezelfde soort hernieuwbare energie, worden voor de toepassing
      van het eerste lid bij elkaar opgeteld de subsidies die de subsidieontvanger ontvangt, bedoeld in
      [artikel 48, eerste lid, van het besluit][ref6] of het Besluit SDE, van die beschikkingen waarvan de periode
      waarover subsidie wordt verstrekt, nog niet is aangevangen.

      5 Het eerste lid is van overeenkomstige toepassing indien sprake is van een combinatie van twee subsidies als
      bedoeld in de [artikelen 85, tweede tot en met zevende lid][ref7], [87, tweede tot en met zevende lid][ref8] en
      [89, tweede tot en met vierde lid][ref9], waardoor in totaal meer dan € 400.000.000,– aan subsidie wordt verleend.


