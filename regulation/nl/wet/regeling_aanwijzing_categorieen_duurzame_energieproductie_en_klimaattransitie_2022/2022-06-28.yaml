        paragraaf: 3.2.4
  - number: '33'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbaar gas, niet zijnde biosyngas,
      geproduceerd door een productie-installatie voor de productie van hernieuwbaar gas door middel van vergassing,
      waarbij ten minste de vergasser nieuw is, uit:

      a. biomassa als bedoeld in de NTA 8003:2017; of

      b. biomassa als bedoeld in de NTA 8003:2017, met uitzondering van B-Hout als bedoeld in nummers 100, 150, 170 tot
      en met 179 van de NTA 8003:2017.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel33
  - number: '34'
    text: |-
      1 De subsidie, bedoeld in [artikel 33][ref1], wordt voor een periode van twaalf jaar verstrekt.

      2 De subsidieontvanger neemt de productie-installatie binnen vier jaar na de datum van inwerkingtreding van de
      beschikking tot subsidieverlening in gebruik.

      3 De subsidieontvanger draagt er zorg voor dat ten minste 97% van de energetische waarde van de jaarlijks in de
      productie-installatie gebruikte brandstof biogeen is.

      4 De subsidieontvanger draagt er zorg voor dat wordt aangetoond dat de gebruikte vloeibare biomassa, dan wel de
      in een installatie met een totaal nominaal thermisch vermogen van de gasopwaardeerinstallatie gelijk aan of groter
      dan 2 MW gebruikte overige biomassa voldoet aan de duurzaamheids- en broeikasgasemissiereductiecriteria, bedoeld in
      artikel 29, eerste lid, van de [richtlijn (EU) 2018/2001](32018L2001).


      [ref1]: https://wetten.overheid.nl/BWBR0046631#Artikel33
