      De minister verstrekt op aanvraag subsidie aan een producent van koolstofdioxide-arme warmte geproduceerd door
      een productie-installatie voor de productie van koolstofdioxide-arme warmte door middel van elektriciteit in een
      hybride glasoven met een elektrisch aansluitvermogen van ten minste 500 kWe, en waarbij het elektrisch vermogen van
      de hybride glasoven ten minste 80% bedraagt van het nominaal thermisch vermogen van de hybride glasoven.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel83
  - number: '84.1'
    text: |-
