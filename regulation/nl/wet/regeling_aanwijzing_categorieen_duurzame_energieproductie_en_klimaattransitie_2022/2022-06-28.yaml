      vermogen:
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel61
  - number: 61.d.1°
    text: kleiner dan of gelijk aan 12 MWth;
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel61
  - number: 61.d.2°
    text: van ten minste 12 MWth tot ten hoogste 20 MWth; of
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel61
  - number: 61.d.3°
    text: groter dan 20 MWth;
