    text: |-
      1 Het subsidieplafond bedraagt € 13.000.000.000 voor het verlenen van subsidies die worden aangevraagd in de
      periode van 28 juni 2022, 09:00 uur, tot 6 oktober 2022, 17:00 uur, voor:

      a. de productie van hernieuwbare elektriciteit op grond van [artikel 11][ref1], [13][ref2], [15, eerste lid][ref3],
      [17, eerste lid][ref4], [19, eerste lid][ref5], [21, eerste lid][ref6], of [23, eerste lid][ref7];

      b. de productie van hernieuwbaar gas op grond van [artikel 25][ref8], [27][ref9], [29, eerste lid][ref10],
      [31][ref11] of [33][ref12];

      c. de productie van hernieuwbare warmte of al dan niet gecombineerde opwekking van hernieuwbare
      elektriciteit en hernieuwbare warmte op grond van [artikel 35, eerste lid][ref13], [37][ref14], [39][ref15],
      [41, eerste lid][ref16], [43][ref17], [45][ref18], [47][ref19], [49][ref20], [51][ref21], [53][ref22], [55][ref23],
      [57, eerste lid][ref24], [59, eerste lid][ref25], of [61][ref26]; of

      d. de vermindering van broeikasgas op grond van [artikel 63][ref27], [65][ref28], [67, eerste lid][ref29],
      [69, eerste lid][ref30], [71, eerste lid][ref31], [73, eerste lid][ref32], [75, eerste lid][ref33],
      [77, eerste lid][ref34], [79, eerste lid][ref35], [81, eerste lid][ref36], [83][ref37], [85, eerste lid][ref38],
      [87, eerste lid][ref39], of [89, eerste lid][ref40].

      2 De minister verdeelt het subsidieplafond op volgorde van ontvangst van de aanvragen.

      3 Per categorie productie-installaties kan in de periode, genoemd in het eerste lid, per adres waarop een
      productie-installatie wordt geplaatst maximaal één aanvraag worden ingediend.


