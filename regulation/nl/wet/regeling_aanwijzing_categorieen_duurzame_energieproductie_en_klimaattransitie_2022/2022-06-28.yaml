    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbaar gas geproduceerd door een productie-
      installatie voor de productie van hernieuwbaar gas uit biogas dat vrijkomt ten gevolge van een biologische
      afbraakreactie van gisting van zuiveringsslib, waarbij ten minste de opwerkinstallatie waarmee biogas op
      aardgaskwaliteit wordt gebracht, nieuw is.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel31
  - number: '32'
    text: |-
      1 De subsidie, bedoeld in [artikel 31][ref1], wordt voor een periode van twaalf jaar verstrekt.

      2 De subsidieontvanger neemt de productie-installatie binnen vier jaar na de datum van inwerkingtreding van de
      beschikking tot subsidieverlening in gebruik.

      3 De subsidieontvanger draagt er zorg voor dat wordt aangetoond dat de in de productie-installatie met een totaal
      nominaal thermisch uitgangsvermogen van de gasopwaardeerinstallatie gelijk aan of groter dan 2 MW gebruikte
      biomassa voldoet aan de broeikasgasemissiereductiecriteria, bedoeld in artikel 29, eerste lid, van de [richtlijn
      (EU) 2018/2001](32018L2001).


      [ref1]: https://wetten.overheid.nl/BWBR0046631#Artikel31
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel32
