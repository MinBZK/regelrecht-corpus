    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte of hernieuwbare
      elektriciteit en hernieuwbare warmte geproduceerd door een productie-installatie voor de productie van hernieuwbare
      warmte of hernieuwbare elektriciteit en hernieuwbare warmte uitsluitend door middel van thermische conversie
      van vaste of vloeibare biomassa als bedoeld in de NTA 8003:2017, met uitzondering van biomassa als bedoeld in de
      nummers 100, 150, 170 tot en met 179 van de NTA 8003:2017, waarvoor reeds subsidie op grond van het Besluit SDE is
      verstrekt en waarvoor op het moment van aanvraag ten minste negen jaar voordien de subsidieperiode is aangevangen
      in een ketel met een nominaal thermisch vermogen:

      a. gelijk aan of groter dan 0,5 MWth en kleiner dan 5 MWth; of

      b. van ten minste 5 MWth.

      2 De biomassa die in de productie-installatie, bedoeld in het eerste lid, wordt toegepast, is voor ten minste 97%
      van de energetische waarde biogeen.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel57
  - number: '58'
    text: |-
      1 De subsidie, bedoeld in [artikel 57, eerste lid][ref1], wordt voor een periode van twaalf jaar verstrekt.

      2 De subsidieontvanger neemt de productie-installatie binnen vier jaar na de datum van inwerkingtreding van de
      beschikking tot subsidieverlening in gebruik.

      3 De subsidieontvanger draagt er zorg voor dat de opgewekte hernieuwbare warmte die voor subsidie in aanmerking
      komt, wordt aangewend als nuttig aangewende warmte.

      4 De subsidieontvanger draagt er zorg voor dat wordt aangetoond dat de gebruikte vloeibare biomassa, dan wel de in
      een installatie met een totaal nominaal thermisch ingangsvermogen gelijk aan of groter dan 20 MW gebruikte vaste
      biomassa, voldoet aan de duurzaamheids- en broeikasgasemissiereductiecriteria, bedoeld in artikel 29, eerste lid,
      van de [richtlijn (EU) 2018/2001](32018L2001).

      5 Als gebruik wordt gemaakt van houtige biomassa als bedoeld in de nummers 100 tot en met 199 van de NTA 8003:2017,
      draagt de subsidieontvanger er zorg voor dat de geproduceerde warmte wordt toegepast in een verwarmingssysteem met
      een aanvoertemperatuur aan de gebruikerszijde van ten minste 100 °C in het stookseizoen of in een stoomsysteem.


