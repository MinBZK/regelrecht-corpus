  - number: '90.1'
    text: |-
      De subsidie, bedoeld in [artikel 89, eerste lid][ref1], wordt voor een periode van vijftien jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0046631#Artikel89
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0046631
        artikel: '89'
        paragraaf: 3.4.14
  - number: '90.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie binnen zes jaar na de datum van inwerkingtreding van de
      beschikking tot subsidieverlening in gebruik.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel90
  - number: '91.1'
    text: 'Voor de fase, genoemd in de eerste kolom van onderstaande tabel, wordt:'
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel91
  - number: 91.1.a
    text: |-
      de periode waarbinnen de aanvragen ontvangen moeten zijn, vastgesteld van de datum, genoemd in de tweede kolom van
      onderstaande tabel, tot de datum, genoemd in de tweede kolom van onderstaande tabel, van de daarop volgende fase;
      de vijfde fase sluit op 6 oktober 2022, 17:00 uur;
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel91
  - number: 91.1.b
    text: |-
