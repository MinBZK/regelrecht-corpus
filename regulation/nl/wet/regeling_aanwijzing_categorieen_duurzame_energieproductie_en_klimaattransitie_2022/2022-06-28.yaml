  - number: '29'
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbaar gas geproduceerd door een
      productie-installatie voor de productie van hernieuwbaar gas uit biogas dat vrijkomt ten gevolge van een
      biologische afbraakreactie van gisting van zuiveringsslib waarbij:

      a. verbeteringen zijn uitgevoerd in het productieproces waarna er per ton slib sprake is van ten minste 25% meer
      biogasproductie ten opzichte van voor de verbetering; en

      b. ten minste de installatiedelen die verantwoordelijk zijn voor de aanvullende productie van biogas nieuw zijn.

      2 De installatiedelen die verantwoordelijk zijn voor de aanvullende productie, worden niet in gebruik genomen voor
      de subsidie is aangevraagd.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel29
  - number: '30'
    text: |-
      1 De subsidie, bedoeld in [artikel 29, eerste lid][ref1], wordt voor een periode van twaalf jaar verstrekt.

      2 De subsidieontvanger neemt de productie-installatie binnen vier jaar na de datum van inwerkingtreding van de
      beschikking tot subsidieverlening in gebruik.

      3 De subsidieaanvrager maakt aannemelijk dat de voorgestelde aanpassingen een verbetering van 25% inhouden ten
      opzichte van de gemiddelde productie van het jaar voorafgaande aan de aanvraag, of, wanneer hij minder dan een jaar
      produceert, ten opzichte van de totale gemiddelde productie tot het moment van de aanvraag.

      4 De subsidieontvanger draagt er zorg voor dat wordt aangetoond dat de in de productie-installatie met een totaal
      nominaal thermisch vermogen van de gasopwaardeerinstallatie gelijk aan of groter dan 2 MW gebruikte biomassa
      voldoet aan het broeikasgasemissiereductiecriterium, bedoeld in artikel 29, eerste lid, van de [richtlijn (EU)
      2018/2001](32018L2001).


      [ref1]: https://wetten.overheid.nl/BWBR0046631#Artikel29
