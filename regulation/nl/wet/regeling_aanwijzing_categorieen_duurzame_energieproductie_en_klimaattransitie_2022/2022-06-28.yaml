    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel5
  - number: '5.2'
    text: |-
      Voor het opstellen van een uitvoeringsovereenkomst als bedoeld in het eerste lid wordt gebruik gemaakt van het in
      [bijlage 1][ref1] opgenomen model.


      [ref1]: https://wetten.overheid.nl/BWBR0046631
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0046631
  - number: '5.3'
    text: |-
      Het eerste lid is niet van toepassing op een productie-installatie als bedoeld in
      [artikel 9b, eerste lid, onderdeel a, van de Elektriciteitswet 1998][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel9b
