      c. het aantal subsidiabele vollasturen ten hoogste 6.000 vollasturen per jaar bedraagt en de productie-installatie
      uitsluitend warmte levert voor verwarming van gebouwde omgeving; of

      d. het aantal subsidiabele vollasturen ten hoogste 3.500 vollasturen per jaar bedraagt en de productie-installatie
      beschikt over een seizoensopslag voor warmte.
