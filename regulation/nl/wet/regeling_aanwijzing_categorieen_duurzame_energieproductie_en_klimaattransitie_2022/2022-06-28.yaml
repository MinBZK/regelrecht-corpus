    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een producent van waterstof geproduceerd door een productie-
      installatie die waterstof produceert met behulp van elektrolyse met een nominale capaciteit van ten minste 500
      kW met:

      a. een aansluiting op het elektriciteitsnet; of

      b. een directe aansluiting op een productie-installatie die elektriciteit produceert met behulp van windenergie of
      een productie-installatie die elektriciteit produceert uit zonlicht door middel van fotovoltaïsche zonnepanelen.

      2 De productie-installatie is in staat om, terwijl deze gereed is voor gebruik, minder dan 1% elektriciteit te
      verbruiken van het maximale vermogen van de productie-installatie.

      3 De feitelijke productie van een productie-installatie als bedoeld in het eerste lid, onderdeel a, bedraagt ten
      hoogste 5.000 productie-uren per jaar.

      4 De subsidie, bedoeld in het eerste lid, aanhef en onderdeel b, wordt niet verstrekt indien:

      a. voor de productie van de geleverde elektriciteit van een productie-installatie die elektriciteit produceert met
      behulp van windenergie, of een productie-installatie die elektriciteit produceert uit door middel van zonne-energie
      subsidie is of wordt verstrekt; of

      b. de door de productie-installatie gebruikte elektriciteit niet is geproduceerd door de productie-installatie voor
      hernieuwbare elektriciteit die met de directe lijn is aangesloten.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel79
