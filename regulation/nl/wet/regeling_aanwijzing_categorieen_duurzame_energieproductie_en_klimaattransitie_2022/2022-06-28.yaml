  - number: '92.1'
    text: |-
      Het rangschikkingsbedrag, bedoeld voor de vergelijking van de fasebedragen op grond van
      [artikel 58, tweede lid, van het besluit][ref1], wordt berekend volgens de formule in het tweede lid en voor de
      uitdrukking in euro per 1.000 kg vermindering van broeikasgas vermenigvuldigd met de factor 1.000 en afgerond op
      drie decimalen.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel58
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0022735
        artikel: '58'
  - number: '92.2'
    text: 'De formule voor de berekening van het rangschikkingsbedrag luidt:'
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel92
  - number: 92.2.a
    text: |-
      voor productie-installaties voor de productie van hernieuwbare elektriciteit, hernieuwbaar gas, hernieuwbare warmte
      of hernieuwbare warmte en hernieuwbare elektriciteit: het quotiënt van het verschil tussen het fasebedrag waarvoor
      de aanvrager de aanvraag heeft ingediend en de langetermijnenergieprijs als vastgesteld in de derde kolom van de in
      dit lid opgenomen tabel, en de omrekenfactor als vastgesteld in de vierde kolom van de in dit lid opgenomen tabel;
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel92
  - number: 92.2.b
    text: |-
      voor productie-installaties voor vermindering van broeikasgas: het quotiënt van het verschil tussen het fasebedrag
      waarvoor de aanvrager de aanvraag heeft ingediend en het langetermijnbroeikasgasbedrag als vastgesteld in de derde
      kolom van de in dit lid opgenomen tabel, en de omrekenfactor als vastgesteld in de vierde kolom van de in dit lid
      opgenomen tabel.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel92
