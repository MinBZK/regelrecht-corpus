  - number: '27'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbaar gas geproduceerd door een productie-
      installatie die ingrijpend wordt gerenoveerd en waarmee:

      a. uitsluitend door middel van allesvergisting hernieuwbaar gas wordt geproduceerd met een productie-installatie,
      waarvoor reeds subsidie op grond van het [Besluit SDE][ref1] is verstrekt als productie-installatie voor de
      productie van hernieuwbare elektriciteit of hernieuwbare warmte en waarvoor op het moment van aanvraag ten minste
      negen jaar voordien de subsidieperiode is aangevangen;

      b. uitsluitend door middel van allesvergisting hernieuwbaar gas wordt geproduceerd, waarvoor reeds subsidie op
      grond van het [Besluit SDE][ref2] is verstrekt als productie-installatie voor de productie van hernieuwbaar gas en
      waarvoor op het moment van aanvraag ten minste negen jaar voordien de subsidieperiode is aangevangen;

      c. uitsluitend door middel van monomestvergisting met een vermogen kleiner dan of gelijk aan 400 kW hernieuwbaar
      gas wordt geproduceerd, waarvoor reeds subsidie op grond van het [Besluit SDE][ref3] is verstrekt als productie-
      installaties voor de productie van hernieuwbare elektriciteit of hernieuwbare warmte en waarvoor op het moment van
      aanvraag ten minste negen jaar voordien de subsidieperiode is aangevangen; of

      d. uitsluitend door middel van monomestvergisting met een vermogen kleiner dan of gelijk aan 400 kW hernieuwbaar
      gas wordt geproduceerd, waarvoor reeds subsidie op grond van het [Besluit SDE][ref4] is verstrekt als productie-
      installaties voor de productie van hernieuwbaar gas en waarvoor op het moment van aanvraag ten minste negen jaar
      voordien de subsidieperiode is aangevangen.


