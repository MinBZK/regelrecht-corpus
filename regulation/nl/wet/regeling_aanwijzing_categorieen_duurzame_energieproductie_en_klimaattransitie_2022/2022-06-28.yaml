    text: |-
      De subsidieontvanger draagt er zorg voor dat wordt aangetoond dat de in een installatie voor de opwekking
      van warmte of gecombineerde opwekking van warmte en elektriciteit met een totaal nominaal thermisch
      ingangsvermogen gelijk aan of groter dan 2 MW gebruikte biomassa voldoet aan de duurzaamheids- en
      broeikasgasemissiereductiecriteria, bedoeld in artikel 29, eerste lid, van de [richtlijn (EU) 2018/2001]
      (32018L2001).
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel38
  - number: '39'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte geproduceerd door een
      productie-installatie die ingrijpend wordt gerenoveerd en waarmee:
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel39
  - number: 39.a
    text: |-
      uitsluitend door middel van allesvergisting hernieuwbare warmte wordt geproduceerd, waarvoor reeds subsidie
      op grond van het [Besluit SDE][ref1] is verstrekt en waarvoor op het moment van aanvraag ten minste negen jaar
      voordien de subsidieperiode is aangevangen;


      [ref1]: https://wetten.overheid.nl/BWBR0022735
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0022735
  - number: 39.b
    text: |-
      uitsluitend door middel van allesvergisting hernieuwbare elektriciteit en hernieuwbare warmte wordt geproduceerd,
      waarvoor reeds subsidie op grond van het [Besluit SDE][ref1] is verstrekt en waarvoor op het moment van aanvraag
      ten minste negen jaar voordien de subsidieperiode is aangevangen;


      [ref1]: https://wetten.overheid.nl/BWBR0022735
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0022735
  - number: 39.c
    text: |-
      uitsluitend door middel van monomestvergisting met een vermogen kleiner dan of gelijk aan 400 kW hernieuwbare
      warmte wordt geproduceerd, waarvoor reeds subsidie op grond van het [Besluit SDE][ref1] is verstrekt en waarvoor op
      het moment van aanvraag ten minste negen jaar voordien de subsidieperiode is aangevangen; of


      [ref1]: https://wetten.overheid.nl/BWBR0022735
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0022735
  - number: 39.d
    text: |-
      uitsluitend door middel van monomestvergisting met een vermogen kleiner dan of gelijk aan 400 kW hernieuwbare
      elektriciteit en hernieuwbare warmte wordt geproduceerd, waarvoor reeds subsidie op grond van het
      [Besluit SDE][ref1] is verstrekt en waarvoor op het moment van aanvraag ten minste negen jaar voordien de
