      wordt aangewend voor de verwarming van gebouwde omgeving en waarbij het aantal vollasturen ten hoogste 5.000 uur
      bedraagt;
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel61
  - number: 61.d
    text: |-
