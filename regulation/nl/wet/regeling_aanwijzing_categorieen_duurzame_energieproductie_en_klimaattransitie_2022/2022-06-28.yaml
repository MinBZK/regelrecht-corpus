      na de datum van inwerkingtreding van de beschikking tot subsidieverlening in gebruik.

      3 De subsidieontvanger neemt de productie-installatie, bedoeld in [artikel 63, onderdelen b en c][ref3], binnen zes
      jaar na de datum van inwerkingtreding van de beschikking tot subsidieverlening in gebruik.

      4 De subsidieontvanger draagt er zorg voor dat de opgewekte koolstofdioxide-arme warmte die voor subsidie in
