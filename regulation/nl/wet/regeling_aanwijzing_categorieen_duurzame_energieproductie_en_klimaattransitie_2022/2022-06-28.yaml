      1 De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit geproduceerd door
      een productie-installatie voor de productie van hernieuwbare elektriciteit uit zonlicht uitsluitend door middel
      van fotovoltaïsche zonnepanelen, die is aangesloten op een elektriciteitsnet via een aansluiting met een totale
      maximale doorlaatwaarde van meer dan 3*80 A en:

      a. waarbij de zonnepanelen op of aan een gebouw zijn aangebracht, met een totaal nominaal vermogen:

      1°. gelijk aan of groter dan 15 kWp en kleiner dan 1 MWp; of

      2°. gelijk aan of groter dan 1 MWp;

      b. waarbij de zonnepanelen, niet op of aan een gebouw aangebracht, op water drijven, met een totaal nominaal
      vermogen;

      1°. gelijk aan of groter dan 15 kWp en kleiner dan 1 MWp; of

      2°. gelijk aan of groter dan 1 MWp;

      c. waarbij de zonnepanelen, niet op of aan een gebouw aangebracht, op land staan, met een totaal nominaal vermogen;

      1°. gelijk aan of groter dan 15 kWp en kleiner dan 1 MWp;

      2°. gelijk aan of groter dan 1 MWp en kleiner dan 15 MWp; of

      3°. gelijk aan of groter dan 15 MWp;

      d. waarbij de zonnepanelen automatisch met de stand van de zon meebewegen door middel van een zonvolgsysteem, met
      een totaal nominaal vermogen:

      1°. gelijk aan of groter dan 1 MWp en kleiner dan 15 MWp en waarbij de zonnepanelen, niet op of aan een gebouw
      aangebracht, op land staan;

      2°. gelijk aan of groter dan 15 MWp en waarbij de zonnepanelen, niet op of aan een gebouw aangebracht, op land
      staan; of

      3°. gelijk aan of groter dan 1 MWp en waarbij de zonnepanelen, niet op of aan een gebouw aangebracht, op water
      drijven.

      2 Voor de werking van dit artikel wordt onder gebouw tevens verstaan een aan de grond gebonden overkapping voor van
      het tegen weersinvloeden beschermd parkeren van voertuigen.

      3 Het additioneel gecontracteerde terugleververmogen voor een productie-installatie als bedoeld in het eerste
      lid, onderdeel a, subonderdeel 2°, onderdeel b, subonderdeel 2°, en onderdeel c, subonderdelen 2° en 3°, bedraagt
      maximaal 50% van het piekvermogen van de zonnepanelen.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel23
