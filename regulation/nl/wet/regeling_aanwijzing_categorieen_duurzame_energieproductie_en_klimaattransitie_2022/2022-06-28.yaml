  - number: '91.3'
    text: |-
      In afwijking van de fasebedragen, genoemd in de derde, vierde, vijfde, zesde en zevende kolom van de
      tabel in het tweede lid, geldt voor de productie-installaties, bedoeld in de [artikelen 11][ref1],
      [13][ref2], [15, eerste lid][ref3], [17, eerste lid][ref4], [19, eerste lid][ref5], [21, eerste lid][ref6],
      [23, eerste lid][ref7], [25][ref8], [27][ref9], [29, eerste lid][ref10], [31][ref11], [33][ref12],
      [35, eerste lid][ref13], [37][ref14], [39][ref15], [41, eerste lid][ref16], [43][ref17], [45][ref18],
      [47][ref19], [49][ref20], [51][ref21], [53][ref22], [55][ref23], [57, eerste lid][ref24], [59, eerste lid][ref25],
      [61][ref26], [63][ref27], [65][ref28], [67, eerste lid][ref29], [69, eerste lid][ref30], [71, eerste lid][ref31],
      [73, eerste lid][ref32], [75, eerste lid][ref33], [77, eerste lid][ref34], [79, eerste lid][ref35],
      [81, eerste lid][ref36] en [83][ref37], het fasebedrag in euro per kWh in vier decimalen dat door de aanvrager bij
      de aanvraag in een fase is ingediend, indien dat bedrag per kWh lager is dan het fasebedrag dat van toepassing is
      voor de fase waarin de aanvraag is ingediend.


