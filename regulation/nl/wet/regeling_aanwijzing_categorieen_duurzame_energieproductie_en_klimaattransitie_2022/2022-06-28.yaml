  - number: '11'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit geproduceerd
      door een productie-installatie waarmee door hydro-mechanisch-elektrische omzetting hernieuwbare elektriciteit
      wordt geproduceerd uit potentiële of kinetische energie van stromend water dat niet specifiek voor de
      elektriciteitsproductie omhoog is gepompt:
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel11
  - number: 11.a
    text: in installaties met een valhoogte kleiner dan 50 centimeter;
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel11
  - number: 11.b
    text: in installaties met een valhoogte gelijk aan of groter dan 50 centimeter; of
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel11
  - number: 11.c
    text: |-
      in installaties met een valhoogte gelijk aan of groter dan 50 centimeter, die ingrijpend zijn gerenoveerd en
      waarbij ten minste de turbines nieuw zijn.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel11
  - number: '12.1'
    text: |-
      De subsidie, bedoeld in [artikel 11][ref1], wordt voor een periode van vijftien jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0046631#Artikel11
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0046631
        artikel: '11'
        paragraaf: 3.1.1
  - number: '12.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie binnen vier jaar na de datum van inwerkingtreding van de
      beschikking tot subsidieverlening in gebruik.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel12
