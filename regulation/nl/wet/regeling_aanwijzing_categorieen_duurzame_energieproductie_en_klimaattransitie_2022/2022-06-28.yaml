  - number: '35'
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte geproduceerd door een
      productie-installatie die uitsluitend voorziet in de productie van hernieuwbare warmte uit zonne-energie met een
      totaal thermisch vermogen:

      a. gelijk aan of groter dan 140 kWth en kleiner dan 1 MWth; of

      b. gelijk aan of groter dan 1 MWth.

      2 Er wordt uitsluitend gebruik gemaakt van afgedekte collectoren waarvan de transparante isolerende laag, niet
      zijnde beglazing van kassen of fotovoltaïsche zonnepanelen, een geïntegreerd geheel vormt met de collector van een
      collectorsysteem of met collectoren waarbij het zonlicht met externe spiegels of lenzen wordt geconcentreerd.

      3 Het vermogen in kWth van de productie-installatie wordt berekend door de apertuuroppervlakte van de afgedekte
      collectoren of het aangestraalde oppervlakte van de spiegels of lenzen voor het concentreren van zonlicht in
      vierkante meter te vermenigvuldigen met een factor 0,7.

      4 De subsidie wordt niet verstrekt indien reeds op basis van
      [artikel 4.5.2. van de Regeling nationale EZK- en LNV-subsidies][ref1] subsidie is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.5.2
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 4.5.2
  - number: '36'
    text: |-
      1 De subsidie, bedoeld in [artikel 35, eerste lid][ref1], wordt voor een periode van vijftien jaar verstrekt.

      2 De subsidieontvanger neemt de productie-installatie binnen drie jaar na de datum van inwerkingtreding van de
      beschikking tot subsidieverlening in gebruik.

      3 De subsidieontvanger draagt er zorg voor dat de opgewekte hernieuwbare warmte die voor subsidie in aanmerking
      komt, wordt aangewend als nuttig aangewende warmte.


      [ref1]: https://wetten.overheid.nl/BWBR0046631#Artikel35
