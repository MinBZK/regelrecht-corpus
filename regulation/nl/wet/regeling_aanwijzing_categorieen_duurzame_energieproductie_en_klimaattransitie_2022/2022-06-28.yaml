    text: |-
      1 Als productie-installaties waarvoor het aantal kWh kan worden opgeteld als bedoeld in
      [artikel 32, zesde lid, van het besluit][ref1] worden aangewezen productie-installaties waarmee hernieuwbaar
      gas wordt geproduceerd als bedoeld in de [artikelen 25][ref2], [27][ref3], [29, eerste lid][ref4], [31][ref5] en
      [33][ref6].

      2 Als productie-installaties waarvoor de producent kan aantonen dat hij hernieuwbaar gas heeft geproduceerd
      waarmee hernieuwbare warmte of hernieuwbare warmte en hernieuwbare elektriciteit is geproduceerd, als bedoeld in
      [artikel 32, zevende lid, van het besluit][ref7] worden productie-installaties aangewezen waarmee hernieuwbare
      warmte, hernieuwbare elektriciteit of hernieuwbare elektriciteit en hernieuwbare warmte wordt geproduceerd als
      bedoeld in de [artikelen 37][ref8], [39][ref9] en [41, eerste lid][ref10].


