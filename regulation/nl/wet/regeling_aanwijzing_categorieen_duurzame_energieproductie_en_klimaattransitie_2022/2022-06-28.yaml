      een broeikasgasinstallatie als bedoeld in [artikel 16.5 van de Wet milieubeheer][ref1] in een ondergronds
      opslagvoorkomen voor koolstofdioxide, waarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
  - number: 85.1.a
    text: |-
      het aantal subsidiabele vollasturen ten hoogste 4.000 vollasturen per jaar bedraagt, de koolstofdioxide wordt
      afgevangen die ontstaat bij een op het moment van indienen van de aanvraag bestaand proces, en gebruik wordt
      gemaakt van:
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel85
  - number: 85.1.a.1°
    text: gasvormig transport van koolstofdioxide door een buisleiding, en ten minste de compressor nieuw is;
