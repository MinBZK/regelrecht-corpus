    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel69
  - number: 69.2.b
    text: een warmtepomp met een COP-waarde van ten minste 5,0 en een nominaal thermisch vermogen van ten minste 500 kWth.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel69
  - number: '69.3'
