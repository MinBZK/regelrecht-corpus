    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel46
  - number: '46.5'
    text: |-
      De subsidieontvanger draagt er zorg voor dat wordt aangetoond dat de gebruikte vloeibare biomassa voldoet aan de
      duurzaamheids- en broeikasgasemissiereductiecriteria, bedoeld in artikel 29, eerste lid, van de [richtlijn (EU)
      2018/2001](32018L2001).
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel46
  - number: '46.6'
    text: |-
      Als gebruik wordt gemaakt van houtige biomassa als bedoeld in de nummers 100 tot en met 199 van de NTA 8003:2017,
      draagt de subsidieontvanger er zorg voor dat de geproduceerde warmte wordt toegepast in een verwarmingssysteem met
      een aanvoertemperatuur aan de gebruikerszijde van ten minste 100 °C in het stookseizoen of in een stoomsysteem.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel46
  - number: '47'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte, of hernieuwbare elektriciteit
      en hernieuwbare warmte geproduceerd door een productie-installatie voor de productie van hernieuwbare warmte, of
      hernieuwbare elektriciteit en hernieuwbare warmte, uitsluitend door middel van thermische conversie van vaste of
      vloeibare biomassa als bedoeld in de NTA 8003:2017, met uitzondering van biomassa als bedoeld in de nummers 100,
      150, 170 tot en met 179 van de NTA 8003:2017, met een nominaal thermisch vermogen gelijk aan of groter dan 5 MWth,
      waarbij ten minste de ketel nieuw is en waarbij het aantal subsidiabele vollasturen:
