  - number: 19.2.a
    text: |-
      het nominaal en te realiseren vermogen per windturbine ten opzichte van de te vervangen windturbine ten minste 1 MW
      toeneemt; of
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel19
  - number: 19.2.b
    text: |-
      de te vervangen windturbine op het moment van vervanging ten minste vijftien jaar op die locatie in gebruik is
      geweest en op het moment van indienen van de aanvraag ten minste dertien jaar geleden in gebruik is genomen.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel19
  - number: '20.1'
    text: |-
      De subsidie, bedoeld in [artikel 19, eerste lid][ref1], wordt voor een periode van vijftien jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0046631#Artikel19
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0046631
        artikel: '19'
        paragraaf: 3.1.5
  - number: '20.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie binnen vier jaar na de datum van inwerkingtreding van de
      beschikking tot subsidieverlening in gebruik.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel20
  - number: '21.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit geproduceerd door een
      productie-installatie voor de productie van hernieuwbare elektriciteit met behulp van windenergie;
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel21
  - number: 21.1.a
    text: |-
      waarvan de fundering volledig in het water van een meer van minimaal één vierkante kilometer staat, waarbij het
      hart van de fundering op een afstand van ten minste 25 meter van de waterkant staat; en
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel21
  - number: 21.1.b
    text: |-
      die is aangesloten op een elektriciteitsnet met een aansluiting met een totale maximale doorlaatwaarde van meer dan
      3*80 A.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel21
  - number: '21.2'
    text: |-
      Indien de productie-installatie wordt opgericht op een locatie waar op het moment van indienen van de aanvraag een
      windturbine staat of heeft gestaan, verstrekt de minister de subsidie uitsluitend indien:
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel21
  - number: 21.2.a
    text: |-
      het nominaal en te realiseren vermogen per windturbine ten opzichte van de te vervangen windturbine ten minste 1 MW
      toeneemt; of
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel21
  - number: 21.2.b
    text: |-
      de te vervangen windturbine op het moment van vervanging ten minste vijftien jaar op die locatie in gebruik is
      geweest en op het moment van indienen van de aanvraag ten minste dertien jaar geleden in gebruik is genomen.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel21
  - number: '22.1'
    text: |-
      De subsidie, bedoeld in [artikel 21, eerste lid][ref1], wordt voor een periode van vijftien jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0046631#Artikel21
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0046631
        artikel: '21'
        paragraaf: 3.1.6
  - number: '22.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie binnen vier jaar na de datum van inwerkingtreding van de
      beschikking tot subsidieverlening in gebruik.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel22
  - number: '23.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit geproduceerd door
      een productie-installatie voor de productie van hernieuwbare elektriciteit uit zonlicht uitsluitend door middel
      van fotovoltaïsche zonnepanelen, die is aangesloten op een elektriciteitsnet via een aansluiting met een totale
      maximale doorlaatwaarde van meer dan 3*80 A en:
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel23
  - number: 23.1.a
    text: 'waarbij de zonnepanelen op of aan een gebouw zijn aangebracht, met een totaal nominaal vermogen:'
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel23
  - number: 23.1.a.1°
    text: gelijk aan of groter dan 15 kWp en kleiner dan 1 MWp; of
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel23
  - number: 23.1.a.2°
    text: gelijk aan of groter dan 1 MWp;
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel23
  - number: 23.1.b
    text: waarbij de zonnepanelen, niet op of aan een gebouw aangebracht, op water drijven, met een totaal nominaal vermogen;
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel23
  - number: 23.1.b.1°
    text: gelijk aan of groter dan 15 kWp en kleiner dan 1 MWp; of
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel23
  - number: 23.1.b.2°
    text: gelijk aan of groter dan 1 MWp;
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel23
  - number: 23.1.c
    text: waarbij de zonnepanelen, niet op of aan een gebouw aangebracht, op land staan, met een totaal nominaal vermogen;
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel23
  - number: 23.1.c.1°
    text: gelijk aan of groter dan 15 kWp en kleiner dan 1 MWp;
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel23
  - number: 23.1.c.2°
    text: gelijk aan of groter dan 1 MWp en kleiner dan 15 MWp; of
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel23
  - number: 23.1.c.3°
    text: gelijk aan of groter dan 15 MWp;
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel23
  - number: 23.1.d
    text: |-
      waarbij de zonnepanelen automatisch met de stand van de zon meebewegen door middel van een zonvolgsysteem, met een
      totaal nominaal vermogen:
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel23
  - number: 23.1.d.1°
    text: |-
      gelijk aan of groter dan 1 MWp en kleiner dan 15 MWp en waarbij de zonnepanelen, niet op of aan een gebouw
      aangebracht, op land staan;
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel23
  - number: 23.1.d.2°
    text: |-
      gelijk aan of groter dan 15 MWp en waarbij de zonnepanelen, niet op of aan een gebouw aangebracht, op land staan;
      of
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel23
  - number: 23.1.d.3°
    text: gelijk aan of groter dan 1 MWp en waarbij de zonnepanelen, niet op of aan een gebouw aangebracht, op water drijven.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel23
  - number: '23.2'
    text: |-
      Voor de werking van dit artikel wordt onder gebouw tevens verstaan een aan de grond gebonden overkapping voor van
      het tegen weersinvloeden beschermd parkeren van voertuigen.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel23
  - number: '23.3'
    text: |-
      Het additioneel gecontracteerde terugleververmogen voor een productie-installatie als bedoeld in het eerste lid,
      onderdeel a, subonderdeel 2°, onderdeel b, subonderdeel 2°, en onderdeel c, subonderdelen 2° en 3°, bedraagt
      maximaal 50% van het piekvermogen van de zonnepanelen.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel23
  - number: '24.1'
    text: |-
      De subsidie, bedoeld in [artikel 23, eerste lid][ref1], wordt voor een periode van vijftien jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0046631#Artikel23
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0046631
        artikel: '23'
        paragraaf: 3.1.7
  - number: '24.2'
    text: |-
