  - number: '93'
    text: |-
      Voor een productie-installatie als bedoeld in het in de eerste kolom van onderstaande tabel genoemde artikel wordt:

      a. het basisbedrag voor subsidie, bedoeld in [artikel 11, eerste lid, van het besluit][ref1], vastgesteld op het in
      de derde kolom genoemde bedrag;

      b. voor de productie van hernieuwbare elektriciteit het maximaal aantal vollasturen, bedoeld in
      [artikel 15, vijfde lid, van het besluit][ref2], vastgesteld op het in de vierde kolom van onderstaande tabel
      genoemde aantal uren;

      c. voor de productie van hernieuwbare elektriciteit de basiselektriciteitsprijs, bedoeld in
      [artikel 12, eerste lid, van het besluit][ref3], vastgesteld op het in de vijfde kolom van onderstaande tabel
      genoemde bedrag; en

      d. de correctie op het basisbedrag voor subsidie voor 2022 vastgesteld op:

      1°. voor de elektriciteitsprijs, bedoeld in [artikel 14, eerste lid, onderdeel a, van het besluit][ref4], het in de
      zesde kolom genoemde bedrag;

      2°. voor de waarde van de garanties van oorsprong, bedoeld in
      [artikel 14, eerste lid, onderdeel b, van het besluit][ref5], het in de zevende kolom genoemde bedrag; en

      3° voor andere correcties als bedoeld in [artikel 14, eerste lid, onderdeel c, van het besluit][ref6] op € 0 per
      kWh.













