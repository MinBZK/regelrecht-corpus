    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel40
  - number: '40.4'
    text: |-
      De subsidieontvanger draagt er zorg voor dat wordt aangetoond dat de in een installatie met een totaal nominaal
      thermisch ingangsvermogen gelijk aan of groter dan 2 MW gebruikte biomassa voldoet aan de duurzaamheids-
      en broeikasgasemissiereductiecriteria, bedoeld in artikel 29, eerste lid, van de [richtlijn (EU) 2018/2001]
      (32018L2001).
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel40
  - number: '41.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte of hernieuwbare elektriciteit
      en hernieuwbare warmte geproduceerd door een productie-installatie voor de productie van hernieuwbare warmte
      of hernieuwbare elektriciteit en hernieuwbare warmte uit biogas dat vrijkomt ten gevolge van een biologische
      afbraakreactie van gisting van zuiveringsslib waarbij er verbeteringen zijn uitgevoerd in het productieproces
      waarna er per ton slib sprake is van ten minste 25% meer biogasproductie ten opzichte van voor de verbetering:
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel41
  - number: 41.1.a
    text: |-
      waarmee hernieuwbare warmte wordt geproduceerd, waarbij ten minste de installatie-onderdelen die verantwoordelijk
      zijn voor de meerproductie nieuw zijn; of
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel41
  - number: 41.1.b
    text: |-
      waarmee hernieuwbare warmte en hernieuwbare elektriciteit wordt geproduceerd, waarbij ten minste de installatie-
      onderdelen die verantwoordelijk zijn voor de meerproductie, nieuw zijn.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel41
  - number: '41.2'
    text: |-
      De installatiedelen die verantwoordelijk zijn voor de meerproductie, worden niet in gebruik genomen voordat de
      subsidie is aangevraagd.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel41
  - number: '42.1'
    text: |-
      De subsidie, bedoeld in [artikel 41, eerste lid][ref1], wordt voor een periode van twaalf jaar verstrekt.


