  - number: '10'
    text: |-
      Als productie-installaties waarvoor een gebundelde aanvraag kan worden ingediend als bedoeld in
      [artikel 56, tweede lid, van het besluit][ref1] worden aangewezen:

      a. productie-installaties waarmee hernieuwbare elektriciteit wordt geproduceerd als bedoeld in de
      [artikelen 15, eerste lid][ref2], [17, eerste lid][ref3], [19, eerste lid][ref4], en [21, eerste lid][ref5];

      b. productie-installaties waarmee hernieuwbaar gas wordt geproduceerd als bedoeld in de [artikelen 25][ref6] en
      [27][ref7];

      c. productie-installatie waarmee hernieuwbare warmte, hernieuwbare elektriciteit of hernieuwbare elektriciteit en
      hernieuwbare warmte wordt geproduceerd als bedoeld in de [artikelen 37][ref8] en [39][ref9];

      d. productie-installaties waarmee koolstofdioxide wordt afgevangen en permanent opgeslagen als bedoeld in
      [artikelen 85, eerste lid][ref10], en [87, eerste lid][ref11]; en

      e. productie-installaties waarmee koolstofdioxide wordt afgevangen en gebruikt als bedoeld in
      [artikel 89, eerste lid][ref12].


