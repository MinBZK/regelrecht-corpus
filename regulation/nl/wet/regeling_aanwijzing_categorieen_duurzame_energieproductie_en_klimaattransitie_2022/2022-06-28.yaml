  - number: 4.1.a
    text: |-
      geen toestemming van de eigenaar van de beoogde locatie en geen gedoogplichtbeschikking op grond van
      [artikel 2, vijfde lid][ref1], of [3, tweede lid, van de Belemmeringenwet Privaatrecht][ref2] voor de beoogde
      locatie kan worden overgelegd voor het plaatsen van de productie-installatie op de beoogde locatie;


      [ref1]: https://wetten.overheid.nl/BWBR0001936#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001936#Artikel3
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel4
