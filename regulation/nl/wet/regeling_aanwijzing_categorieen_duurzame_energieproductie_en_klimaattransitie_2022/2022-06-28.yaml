  - number: '61'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte geproduceerd door:

      a. een productie-installatie bestaande uit één of meer doubletten, waarmee hernieuwbare warmte wordt geproduceerd
      uitsluitend door middel van één of meer geothermische bronnen met een diepte van ten minste 1.500 meter met een
      thermisch vermogen:

      1°. kleiner dan of gelijk aan 12 MWth;

      2°. van ten minste 12 MWth tot ten hoogste 20 MWth; of

      3°. groter dan 20 MWth;

      b. een productie-installatie, bestaande uit één of meer doubletten, waarmee uitsluitend door middel van één of
      meer geothermische bronnen met een diepte van ten minste 1.500 meter hernieuwbare warmte wordt geproduceerd die
      wordt aangewend voor de verwarming van gebouwde omgeving en waarbij het aantal vollasturen ten hoogste 3.500 uur
      bedraagt;

      c. een productie-installatie, bestaande uit één of meer doubletten, waarmee uitsluitend door middel van één of
      meer geothermische bronnen met een diepte van ten minste 1.500 meter hernieuwbare warmte wordt geproduceerd die
      wordt aangewend voor de verwarming van gebouwde omgeving en waarbij het aantal vollasturen ten hoogste 5.000 uur
      bedraagt;

      d. een productie-installatie bestaande uit één of meer doubletten, waarmee hernieuwbare warmte wordt geproduceerd,
      gebruikmakend van ten minste één olie- of gasput met een diepte van ten minste 1.500 meter met een thermisch
      vermogen:

      1°. kleiner dan of gelijk aan 12 MWth;

      2°. van ten minste 12 MWth tot ten hoogste 20 MWth; of

      3°. groter dan 20 MWth;

      e. een productie-installatie als bedoeld in de onderdelen a en d, waarvoor op het moment van aanvragen reeds een
      subsidie is verleend op grond van het besluit of het [Besluit SDE][ref1], die wordt uitgebreid met ten minste één
      aanvullende put met een diepte van ten minste 1.500 meter; of

      f. een productie-installatie, bestaande uit één of meer doubletten, waarmee hernieuwbare warmte wordt geproduceerd
      uitsluitend door middel van één of meer geothermische bronnen met een diepte van ten minste 4.000 meter.


      [ref1]: https://wetten.overheid.nl/BWBR0022735
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0022735
