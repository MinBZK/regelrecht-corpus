      1 De minister verstrekt op aanvraag subsidie aan een producent van koolstofdioxide-arme warmte geproduceerd door
      een productie-installatie voor de productie van warmte uit zonne-energie en buitenluchtwarmte door middel van
      zonnecollectoren die warmte en stroom produceren, waarbij de warmte wordt aangewend voor de verwarming van gebouwde
      omgeving.

      2 De productie-installatie maakt gebruik van een water-water-warmtepomp met een minimaal nominaal thermisch
      vermogen van 500 kWth en een COP-waarde van ten minste 3,0, waarbij de oppervlakte aan fotovoltaïsch-thermische
      panelen minimaal 1,2 m2 per kWth aan nominaal thermisch vermogen van de warmtepomp bedraagt.
