    text: |-
      De subsidieontvanger neemt een productie-installatie als bedoeld in
      [artikel 23, eerste lid, onderdeel a, subonderdeel 2°][ref1], binnen drie jaar na de datum van inwerkingtreding
      van de beschikking tot subsidieverlening in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0046631#Artikel23
