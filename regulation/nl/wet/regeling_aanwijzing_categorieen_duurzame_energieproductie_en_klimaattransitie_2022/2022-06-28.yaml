      bijproduct afkomstig van door subsidieontvangers uitgevoerde economische activiteiten met SBI-code 06, 08 tot en
      met 33, 352, 353 of 38; of
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel3
  - number: 3.1.b.2°
    text: |-
      door subsidieontvangers uitgevoerde economische activiteiten met SBI-code 35111 indien het de productie van
      elektriciteit door een warmtekrachtcentrale betreft die hoofdzakelijk wordt gestookt op aardgas bij economische
      activiteiten met andere SBI-codes dan SBI-code 06, 08 tot en met 33, 352, 353 of 38.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel3
  - number: '3.2'
    text: |-
      Indien bij een subsidie als bedoeld in het eerste lid de koolstofdioxide deels afkomstig is als bijproduct van een
      activiteit als bedoeld in het eerste lid, onderdeel a, en deels van een activiteit als bedoeld in het eerste lid,
      onderdeel b, wordt alle koolstofdioxide toegerekend:
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel3
  - number: 3.2.a
    text: aan de maximale vermindering van broeikasgas in kg, bedoeld in het eerste lid, onderdeel b; en vervolgens
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel3
  - number: 3.2.b
    text: aan de maximale vermindering van broeikasgas, bedoeld in het eerste lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel3
  - number: '3.3'
    text: |-
      De maximale vermindering van broeikasgas die in aanmerking komt voor subsidies voor de productie van geavanceerde
      hernieuwbare brandstof op grond van [artikel 81, eerste lid][ref1], die worden aangevraagd in de periode, genoemd
      in [artikel 2, eerste lid][ref2], komt overeen met 7.100.000.000 kWh, gerekend voor de hele looptijd van de
      subsidies.


      [ref1]: https://wetten.overheid.nl/BWBR0046631#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0046631#Artikel2
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0046631
        artikel: '81'
        paragraaf: 3.4.10
      - id: ref2
        bwb_id: BWBR0046631
        artikel: '2'
        paragraaf: '2'
  - number: '3.4'
    text: |-
      De maximale productie in kWh die in aanmerking komt voor subsidies voor de productie van hernieuwbare
      elektriciteit uit zonne-energie of windenergie op grond van [artikel 15, eerste lid][ref1], [17, eerste lid][ref2],
      [19, eerste lid][ref3], [21, eerste lid][ref4], of [23, eerste lid][ref5], die worden aangevraagd in de periode,
      genoemd in [artikel 2, eerste lid][ref6], komt overeen met 37.500.000.000 kWh, gerekend voor de hele looptijd van
      de subsidies.


      [ref1]: https://wetten.overheid.nl/BWBR0046631#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0046631#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0046631#Artikel19
