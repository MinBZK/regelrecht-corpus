  - number: '3'
    text: |-
      1 De maximale vermindering van broeikasgas in kg die in aanmerking komt voor subsidies voor de afvang en permanente
      opslag van koolstofdioxide op grond van [artikelen 85, eerste lid][ref1], en [87, eerste lid][ref2], die worden
      aangevraagd in de periode, genoemd in [artikel 2, eerste lid][ref3], bedraagt, gerekend voor de hele looptijd van
      die subsidies:

      a. 79.500.000.000 kg voor de koolstofdioxide afkomstig van door subsidieontvangers uitgevoerde economische
      activiteiten met:

      1°. SBI-code 35111 indien het de productie van elektriciteit door een warmtekrachtcentrale betreft die
      hoofdzakelijk wordt gestookt op aardgas bij economische activiteiten met SBI-code 06, 08 tot en met 33, 352, 353
      of 38:

      2°. SBI-code 06, 08 tot en met 33, 352, 353 of 38; en

      b. 45.000.000.000 kg voor de koolstofdioxide afkomstig van:

      1°. economische activiteiten met SBI-code 351, waarbij de koolstofdioxide vrijkomt bij de verbranding van een
      bijproduct afkomstig van door subsidieontvangers uitgevoerde economische activiteiten met SBI-code 06, 08 tot en
      met 33, 352, 353 of 38; of

      2°. door subsidieontvangers uitgevoerde economische activiteiten met SBI-code 35111 indien het de productie van
      elektriciteit door een warmtekrachtcentrale betreft die hoofdzakelijk wordt gestookt op aardgas bij economische
      activiteiten met andere SBI-codes dan SBI-code 06, 08 tot en met 33, 352, 353 of 38.

      2 Indien bij een subsidie als bedoeld in het eerste lid de koolstofdioxide deels afkomstig is als bijproduct van
      een activiteit als bedoeld in het eerste lid, onderdeel a, en deels van een activiteit als bedoeld in het eerste
      lid, onderdeel b, wordt alle koolstofdioxide toegerekend:

      a. aan de maximale vermindering van broeikasgas in kg, bedoeld in het eerste lid, onderdeel b; en vervolgens

      b. aan de maximale vermindering van broeikasgas, bedoeld in het eerste lid, onderdeel a.

      3 De maximale vermindering van broeikasgas die in aanmerking komt voor subsidies voor de productie van geavanceerde
      hernieuwbare brandstof op grond van [artikel 81, eerste lid][ref4], die worden aangevraagd in de periode, genoemd
      in [artikel 2, eerste lid][ref5], komt overeen met 7.100.000.000 kWh, gerekend voor de hele looptijd van de
      subsidies.

      4 De maximale productie in kWh die in aanmerking komt voor subsidies voor de productie van hernieuwbare
      elektriciteit uit zonne-energie of windenergie op grond van [artikel 15, eerste lid][ref6], [17, eerste lid][ref7],
      [19, eerste lid][ref8], [21, eerste lid][ref9], of [23, eerste lid][ref10], die worden aangevraagd in de periode,
      genoemd in [artikel 2, eerste lid][ref11], komt overeen met 37.500.000.000 kWh, gerekend voor de hele looptijd van
      de subsidies.


