  - number: '69'
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een producent van koolstofdioxide-arme warmte geproduceerd door
      een productie-installatie voor de productie van warmte uit zonne-energie die integraal onderdeel uitmaakt van een
      nieuwe tuinbouwkas.

      2 De productie-installatie maakt gebruik van:

      a. een optisch en zonvolgend systeem waarbij zonlicht wordt geconcentreerd op collectorbuizen met een thermisch
      vermogen dat ten minste vier keer het nominaal thermisch vermogen van de warmtepomp bedraagt; en

      b. een warmtepomp met een COP-waarde van ten minste 5,0 en een nominaal thermisch vermogen van ten minste 500 kWth.

      3 De productie-installatie heeft een seizoensopslag van warmte.

      4 De productie-installatie wordt niet gebruikt voor koudelevering.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel69
  - number: '70'
    text: |-
      1 De subsidie, bedoeld in [artikel 69, eerste lid][ref1], wordt voor een periode van vijftien jaar verstrekt.

      2 De subsidieontvanger neemt de productie-installatie binnen vier jaar na de datum van inwerkingtreding van de
      beschikking tot subsidieverlening in gebruik.

      3 De subsidieontvanger draagt er zorg voor dat de opgewekte koolstofdioxide-arme warmte die voor subsidie in
      aanmerking komt, wordt aangewend als nuttig aangewende koolstofdioxide-arme warmte.


