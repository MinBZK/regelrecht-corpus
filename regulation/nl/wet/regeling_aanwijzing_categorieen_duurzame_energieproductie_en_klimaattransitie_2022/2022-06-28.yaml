    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel44
  - number: '45'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte of hernieuwbare elektriciteit
      en hernieuwbare warmte geproduceerd door een productie-installatie voor de productie van warmte of hernieuwbare
      elektriciteit en hernieuwbare warmte door middel van verbranding van vaste of vloeibare biomassa als bedoeld in
      de NTA 8003:2017, met uitzondering van biomassa als bedoeld in de nummers 100, 150, 170 tot en met 179 van de NTA
