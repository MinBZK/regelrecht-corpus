      1 De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit geproduceerd door een
      productie-installatie voor de productie van hernieuwbare elektriciteit met behulp van windenergie, niet zijnde een
      productie-installatie voor de productie van hernieuwbare elektriciteit met behulp van windenergie als bedoeld in de
      [artikelen 17][ref1], [19][ref2] en [21][ref3];

      a. die is aangesloten op een elektriciteitsnet met een aansluiting met een totale maximale doorlaatwaarde van meer
      dan 3*80 A; en

      b. die wordt gerealiseerd op een locatie die overeenkomstig de lijst van gemeenten volgens de gemeentelijke
      indeling op 1 januari 2022, bedoeld in [bijlage 2][ref4], een windsnelheid heeft van:

      1°. ≥ 8,5 m/s;

      2°. ≥ 8,0 en < 8,5 m/s;

      3°. ≥ 7,5 en < 8,0 m/s;

      4°. ≥ 7,0 en < 7,5 m/s;

      5°. ≥ 6,75 en < 7,0 m/s; of

      6°. < 6,75 m/s.

      2 De productie-installatie is niet opgericht in de territoriale zee of in de Nederlandse exclusieve economische
      zone.

      3 Indien de productie-installatie wordt opgericht op een locatie waar op het moment van het indienen van de
      aanvraag een windturbine staat of heeft gestaan, verstrekt de minister de subsidie uitsluitend indien:

      a. het nominaal en te realiseren vermogen per windturbine ten opzichte van de te vervangen windturbine ten minste 1
      MW toeneemt; of

      b. de te vervangen windturbine op het moment van vervanging ten minste vijftien jaar op die locatie in gebruik is
      geweest en op het moment van het indienen van de aanvraag ten minste dertien jaar geleden in gebruik is genomen.


