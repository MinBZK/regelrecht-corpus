        artikel: '11'
        paragraaf: 3.1.1
  - number: '13'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit geproduceerd door
      een productie-installatie waarmee hernieuwbare elektriciteit wordt gegenereerd door middel van het verschil in
      zoutconcentratie tussen twee watermassa’s.
