  - number: '37'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte, hernieuwbare elektriciteit of
      hernieuwbare elektriciteit en hernieuwbare warmte geproduceerd door een productie-installatie waarmee:

      a. hernieuwbare warmte wordt geproduceerd door middel van allesvergisting, waarbij ten minste de vergister nieuw
      is;

      b. hernieuwbare elektriciteit en hernieuwbare warmte worden geproduceerd door middel van allesvergisting, waarbij
      ten minste de vergister nieuw is en waarbij het nominaal elektrisch rendement ten minste 20% bedraagt;

      c. hernieuwbare warmte wordt geproduceerd door middel van monomestvergisting, met een vermogen groter dan 400 kW en
      waarbij ten minste de vergister nieuw is;

      d. hernieuwbare elektriciteit en hernieuwbare warmte worden geproduceerd door middel van monomestvergisting, met
      een vermogen groter dan 400 kW, voor elektrisch en thermisch vermogen samen, en waarbij ten minste de vergister
      nieuw is en waarbij het nominaal elektrisch rendement ten minste 20% bedraagt;

      e. hernieuwbare warmte wordt geproduceerd door middel van monomestvergisting, met een vermogen kleiner dan of
      gelijk aan 400 kW, en waarbij ten minste de vergister nieuw is; of

      f. hernieuwbare elektriciteit en hernieuwbare warmte worden geproduceerd door middel van monomestvergisting, met
      een vermogen kleiner dan of gelijk aan 400 kW, voor elektrisch en thermisch vermogen samen, waarbij ten minste de
      vergister nieuw is en waarbij het nominaal elektrisch rendement ten minste 20% bedraagt.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel37
  - number: '38'
    text: |-
      1 De subsidie, bedoeld in [artikel 37][ref1], wordt voor een periode van twaalf jaar verstrekt.

      2 De subsidieontvanger neemt de productie-installatie binnen vier jaar na de datum van inwerkingtreding van de
      beschikking tot subsidieverlening in gebruik.

      3 De subsidieontvanger draagt er zorg voor dat de opgewekte hernieuwbare warmte die voor subsidie in aanmerking
      komt, wordt aangewend als nuttig aangewende warmte.

      4 De subsidieontvanger draagt er zorg voor dat wordt aangetoond dat de in een installatie voor de
      opwekking van warmte of gecombineerde opwekking van warmte en elektriciteit met een totaal nominaal
      thermisch ingangsvermogen gelijk aan of groter dan 2 MW gebruikte biomassa voldoet aan de duurzaamheids-
      en broeikasgasemissiereductiecriteria, bedoeld in artikel 29, eerste lid, van de [richtlijn (EU) 2018/2001]
      (32018L2001).


      [ref1]: https://wetten.overheid.nl/BWBR0046631#Artikel37
