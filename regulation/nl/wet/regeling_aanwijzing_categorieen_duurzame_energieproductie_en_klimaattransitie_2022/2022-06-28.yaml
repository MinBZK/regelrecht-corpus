  - number: '80.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie binnen vier jaar na de datum van inwerkingtreding van de
      beschikking tot subsidieverlening in gebruik.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel80
  - number: '81.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van geavanceerde hernieuwbare brandstof die wordt
      geproduceerd door een productie-installatie waarmee:
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel81
  - number: 81.1.a
    text: |-
      bioethanol wordt geproduceerd uit vaste lignocellulosehoudende biomassa, waarvan maximaal 50% B-Hout is als bedoeld
      in nummers 170 tot en met 179 van de NTA 8003:2017;
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel81
  - number: 81.1.b
    text: |-
      biomethanol wordt geproduceerd uit vaste lignocellulosehoudende biomassa, waarvan maximaal 50% B-Hout is als
      bedoeld in nummers 170 tot en met 179 van de NTA 8003:2017;
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel81
  - number: 81.1.c
    text: bioLNG wordt geproduceerd door middel van monomestvergisting;
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel81
  - number: 81.1.d
    text: bioLNG wordt geproduceerd door middel van allesvergisting; of
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel81
  - number: 81.1.e
    text: |-
      diesel- en benzinevervangers worden geproduceerd uit vaste lignocellulosehoudende biomassa, waarvan maximaal 50% B-
      Hout is als bedoeld in nummers 170 tot en met 179 van de NTA 8003:2017.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel81
  - number: '81.2'
    text: |-
      De geavanceerde hernieuwbare brandstof wordt in Nederland wordt geleverd aan wegvoertuigen of
      binnenvaartschepen en wordt ingeboekt in het register hernieuwbare energie vervoer, bedoeld in
      [paragraaf 9.7.5 van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Paragraaf9.7.5
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0003245
        paragraaf: 9.7.5
  - number: '81.3'
    text: |-
      De productie-installatie, bedoeld in het eerste lid, onderdelen c en d, maakt uitsluitend gebruik van grondstoffen
      als bedoeld in deel A van bijlage IX bij de [richtlijn (EU) 2018/2001](32018L2001).
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel81
  - number: '81.4'
    text: |-
      De productie-installatie, bedoeld in het eerste lid, onderdelen a, b en e, maakt uitsluitend gebruik van vaste
      grondstoffen als bedoeld onder o) met uitzondering van zwart residuloog, bruin residuloog, vezelslib, lignine en
      tallolie, en q) van deel A van Bijlage IX bij de [richtlijn (EU) 2018/2001](32018L2001).
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel81
  - number: '82.1'
    text: |-
      De subsidie, bedoeld in [artikel 81, eerste lid, onderdelen a, b en e][ref1], wordt voor een periode van vijftien
      jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0046631#Artikel81
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel82
