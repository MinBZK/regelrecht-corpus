      vervloeiingsinstallatie nieuw zijn;
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel89
  - number: 89.1.g
    text: 'de koolstofdioxide wordt afgevangen bij een biomassaverbrandingsinstallatie, en gebruik wordt gemaakt van:'
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel89
  - number: 89.1.g.1°
    text: |-
      gasvormig transport van koolstofdioxide door een transportleiding, en ten minste de installatie voor de afvang van
      koolstofdioxide nieuw is; of
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel89
  - number: 89.1.g.2°
    text: |-
      vloeibaar transport van koolstofdioxide, en ten minste de installatie voor de afvang van koolstofdioxide en de
      vervloeiingsinstallatie nieuw zijn.
    url: https://wetten.overheid.nl/BWBR0046631/2022-06-28#Artikel89
  - number: '89.2'
    text: |-
      Een productie-installatie als bedoeld in het eerste lid, aanhef en onderdeel a,
      c, d, e, f of g, kan worden gecombineerd met een productie-installatie als bedoeld
      in [artikel 85, eerste lid, aanhef en onderdeel a, subonderdeel 1°][ref1] of
      [artikel 87, eerste lid, aanhef en onderdeel a, subonderdeel 1°][ref2].


