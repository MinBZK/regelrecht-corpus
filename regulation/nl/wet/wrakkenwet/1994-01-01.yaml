preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het noodig is wettelijke bepalingen vast te stellen omtrent de
    opruiming van vaartuigen en andere voorwerpen, in openbare wateren gestrand, gezonken of aan den grond geraakt of
    op of in waterkeeringen of andere waterstaatswerken vastgeraakt;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001963/1994-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Vaartuigen, overblijfselen van vaartuigen en alle andere voorwerpen in openbare wateren gestrand, gezonken of aan
      den grond geraakt, of vastgeraakt op of in waterkeeringen of andere waterstaatswerken, kunnen door den beheerder
      van het water of dien van het waterstaatswerk worden opgeruimd, zonder dat deze door belanghebbenden bij het
      vaartuig, of het opgeruimde voorwerp dan wel de zaken aan boord van of in of op het voorwerp aansprakelijk kan
      worden gesteld voor door die opruiming aan hen toegebrachte schade.

      2 Als openbare wateren onder beheer van het Rijk worden in deze wet mede aangemerkt de territoriale wateren.

      3 Onder waterkeeringen worden in deze wet begrepen alle daarin of daaraan gelegen kunstwerken.

      4 Waar in het eerste lid sprake is van waterkeeringen of andere waterstaatswerken, worden slechts bedoeld die,
      welke onder beheer van het Rijk, eene provincie, eene gemeente, een waterschap, veenschap of veenpolder staan.
    url: https://wetten.overheid.nl/BWBR0001963/1994-01-01#Artikel1
  - number: '2'
    text: |-
      1 Van het besluit van de beheerder dat opruiming noodzakelijk is, wordt ter plaatse waar het vaartuig of ander op
      te ruimen voorwerp zich bevindt of anders in de naaste omgeving daarvan mededeling gedaan, met herinnering aan het
      verbod in het tweede lid van dit artikel omschreven. Voorts wordt van dit besluit zo mogelijk mededeling gedaan aan
      de schipper of andere vertegenwoordiger van belanghebbenden.

      2 Zoodra de mededeling is geschied, is het verboden van het vaartuig of voorwerp zaken te verwijderen zonder
      vergunning van of namens den beheerder; deze vergunning wordt niet geweigerd met betrekking tot lijfgoed, beddegoed
      en scheepspapieren.

      3 Het verbod vervalt, indien naar genoegen van den beheerder zekerheid is gesteld voor de voldoening van de ter
      zake van opruiming te maken kosten.

      4 Onder de kosten ter zake van opruiming zijn in deze wet onder meer die tot mededeling, als in het eerste lid
      bedoeld, alsmede die tot berging, verlichting, bewaking en vervoer begrepen.
    url: https://wetten.overheid.nl/BWBR0001963/1994-01-01#Artikel2
  - number: '3'
    text: |-
      1 Van het tijdstip, waarop door den beheerder tot opruiming zal worden overgegaan, wordt door of namens hem in
      een of meer nieuwsbladen kennisgeving gedaan, en wel ten minste tweemaal vierentwintig uren te voren, tenzij de
      beheerder onverwijlde opruiming noodzakelijk acht, in welk geval de kennisgeving zoo spoedig mogelijk wordt gedaan,
      met vermelding der redenen, welke de onverwijlde opruiming noodzakelijk maken of gemaakt hebben.

      2 De kennisgeving bevat, zo zij de opruiming van een vaartuig geldt, zo mogelijk opgaaf van de naam van schipper en
      vaartuig, en van de aard der op te ruimen voorwerpen.
    url: https://wetten.overheid.nl/BWBR0001963/1994-01-01#Artikel3
  - number: '4'
    text: |-
      Het verblijf op of de toegang tot het vaartuig of ander voorwerp zonder vergunning van of namens den beheerder is
      verboden van het tijdstip af, waarop de in het vorige artikel bedoelde kennisgeving is geschied, of van den aanvang
      der opruiming af, indien de opruiming is aangevangen of voltooid, voordat de kennisgeving heeft plaats gehad.
    url: https://wetten.overheid.nl/BWBR0001963/1994-01-01#Artikel4
  - number: '5'
    text: |-
      Al hetgeen bij de opruiming wordt geborgen, wordt tegen voldoening van de ter zake van de opruiming gemaakte kosten
      of tegen het stellen van zekerheid voor de voldoening daarvan aan belanghebbenden, die zich daartoe aanmelden,
      afgegeven.
    url: https://wetten.overheid.nl/BWBR0001963/1994-01-01#Artikel5
  - number: '6'
    text: |-
      Indien belanghebbenden zich niet aanmelden, doch in gebreke blijven binnen een door de beheerder te stellen termijn
      de in [artikel 5][ref1] bedoelde kosten te voldoen of voor de voldoening daarvan zekerheid te stellen, is de
      beheerder bevoegd het geborgene te verkopen.


      [ref1]: https://wetten.overheid.nl/BWBR0001963#Artikel5
    url: https://wetten.overheid.nl/BWBR0001963/1994-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001963
        artikel: '5'
  - number: '7'
    text: |-
      Het geborgene wordt aan belanghebbenden afgegeven in geval zij voor de verkoop de kosten ter zake van opruiming en
      verkoop aan de beheerder voldoen.
    url: https://wetten.overheid.nl/BWBR0001963/1994-01-01#Artikel7
  - number: '8'
    text: De beheerder kan niet aansprakelijk worden gesteld voor afgifte van het geborgene aan een onbevoegde.
    url: https://wetten.overheid.nl/BWBR0001963/1994-01-01#Artikel8
  - number: '10'
    text: |-
      De kosten, krachtens deze wet gemaakt, komen, voor zooveel zij niet door belanghebbenden zijn terugbetaald, of uit
      de opbrengst van het krachtens [artikel 6][ref1] verkochte kunnen worden gekweten, ten laste van den beheerder,
      onverminderd diens bevoegdheid om de krachtens dit artikel te zijnen laste komende kosten te verhalen op dengene,
      die volgens de wet daarvoor aansprakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0001963#Artikel6
    url: https://wetten.overheid.nl/BWBR0001963/1994-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001963
        artikel: '6'
  - number: '11'
    text: |-
      Handelingen in strijd met het bepaalde in het [tweede lid van artikel 2][ref1] en het bepaalde in [artikel 4][ref2]
      worden aangemerkt als overtredingen en gestraft met een geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001963#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001963#Artikel4
    url: https://wetten.overheid.nl/BWBR0001963/1994-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001963
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001963
        artikel: '4'
  - number: '12'
    text: |-
      Met het tijdstip van de inwerkingtreding van deze wet vervalt de wet van 23 Juli 1885 (*Staatsblad* n°. 151). Zij
      blijft intusschen van toepassing op die opruimingen, ten aanzien van welke reeds vóór de inwerkingtreding dezer wet
      artikel 2 der wet van 23 Juli 1885 toepassing heeft gevonden.
    url: https://wetten.overheid.nl/BWBR0001963/1994-01-01#Artikel12
  - number: 12a
    text: |-
      De [artikelen 5][ref1] tot en met [9][ref2], zoals deze luiden voor de wijziging van deze artikelen ingevolge de
      wet van 22 mei 1991, *Stb.* 394 blijven van kracht ten aanzien van opruimingen die voor de inwerkingtreding van
      deze wet zijn verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0001963#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0001963#Artikel9
    url: https://wetten.overheid.nl/BWBR0001963/1994-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0001963
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0001963
        artikel: '9'
  - number: '13'
    text: Deze wet kan worden aangehaald onder den naam "Wrakkenwet".
    url: https://wetten.overheid.nl/BWBR0001963/1994-01-01#Artikel13
