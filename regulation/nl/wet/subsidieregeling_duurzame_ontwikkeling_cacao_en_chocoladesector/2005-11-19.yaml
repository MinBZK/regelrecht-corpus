---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: subsidieregeling_duurzame_ontwikkeling_cacao_en_chocoladesector
regulatory_layer: WET
publication_date: '2008-01-28'
valid_from: '2005-11-19'
bwb_id: BWBR0016140
url: https://wetten.overheid.nl/BWBR0016140/2005-11-19
preamble:
  text: |-
    Gelet op de artikelen 2 en 4 van de Kaderwet LNV-subsidies; Na overleg met het Hoofdproductschap Akkerbouw;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel1
  - number: 1.a
    text: 'minister: minister van Landbouw, Natuur en Voedselkwaliteit;'
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel1
  - number: 1.b
    text: 'HPA: Hoofdproductschap Akkerbouw;'
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel1
  - number: 1.c
    text: 'producten: cacaobonen, cacaoproducten en chocoladeproducten;'
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel1
  - number: 1.d
    text: 'cacaosector: productie, be- en verwerking, handel, distributie en opslag van cacaobonen en cacaoproducten;'
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel1
  - number: 1.e
    text: 'chocoladesector: productie, be- en verwerking, handel, distributie en opslag van chocoladeproducten;'
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel1
  - number: 1.f
    text: 'sector: cacaosector en chocoladesector;'
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel1
  - number: 1.g
    text: |-
      duurzame ontwikkeling: ontwikkeling die voorziet in de behoeften van vandaag, zonder daarbij het vermogen van
      toekomstige generaties om in hun behoeften te voorzien, in gevaar te brengen.
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel1
  - number: 1.h
    text: |-
      capaciteits- en institutionele opbouw: totstandkoming van algemeen beschikbare voorzieningen voor de waarborging
      van voedselkwaliteit alsmede de daarmee verband houdende kennisontwikkeling en kennisoverdracht;
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel1
  - number: 1.i
    text: 'oorspronglanden: cacao-exporterende landen als bedoeld in bijlage A bij de Internationale cacao-overeenkomst 2001;'
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel1
  - number: '2.1'
    text: |-
      De minister kan op aanvraag subsidie verstrekken aan natuurlijke personen, rechtspersonen of samenwerkingsverbanden
      van rechtspersonen ter zake van activiteiten die de duurzame ontwikkeling van de sector stimuleren en die leiden
      tot:
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel2
  - number: 2.1.a
    text: capaciteits- en institutionele opbouw in oorspronglanden;
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel2
  - number: 2.1.b
    text: |-
      systeem, proces of productinnovaties die leiden tot een versterking van de economische structuur van de sector of
      een verbetering van de kwaliteit van producten, met name ten aanzien van de voedselkwaliteit;
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel2
  - number: 2.1.c
    text: een beter welzijn voor werknemers en hun familie die in een oorsprongland werkzaam zijn in de sector, of
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel2
  - number: 2.1.d
    text: een geringere milieubelasting van de sector.
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel2
  - number: '2.2'
    text: |-
      Voor subsidie komen uitsluitend activiteiten of combinaties van activiteiten uit de volgende categorieën in
      aanmerking:
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel2
  - number: 2.2.a
    text: onderzoek en ontwikkeling;
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel2
  - number: 2.2.b
    text: algemene voorlichting;
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel2
  - number: 2.2.c
    text: opleiding, training en technische assistentie;
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel2
  - number: 2.2.d
    text: investeringen.
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel2
  - number: '3.1'
    text: |-
      Als subsidiabele kosten worden uitsluitend in aanmerking genomen de volgende, door de aanvrager aan te tonen
      kosten, voor zover zij noodzakelijk zijn voor en rechtstreeks zijn toe te rekenen aan een of meer categorieën
      van activiteiten bedoeld in [artikel 2, tweede lid][ref1], waarop de beschikking tot subsidieverlening betrekking
      heeft:


      [ref1]: https://wetten.overheid.nl/BWBR0016140#Artikel2
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0016140
        artikel: '2'
        paragraaf: II
  - number: 3.1.a
    text: de aan derden verschuldigde gemaakte en betaalde kosten;
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel3
  - number: 3.1.b
    text: |-
      loonkosten, die worden gemaakt en betaald door de subsidieaanvrager, berekend op basis van het brutojaarloon
      volgens de verzamelloonlijst van de betrokken medewerkers, exclusief volledige winstafhankelijke uitkeringen,
      verhoogd met de wettelijke of op grond van een collectieve arbeidsovereenkomst verschuldigde opslagen voor sociale
      lasten, met een maximum van 1600 productieve uren per medewerker per jaar;
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel3
  - number: 3.1.c
    text: reis- en verblijfkosten;
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel3
  - number: 3.1.d
    text: de bouw, verwerving, verbetering of inrichting van onroerende goederen, niet zijnde grond;
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel3
  - number: 3.1.e
    text: de gemaakte en betaalde kosten van aangeschafte machines en apparatuur, en
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel3
  - number: 3.1.f
    text: de gemaakte en betaalde kosten van verbruikte materialen en hulpmiddelen.
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel3
  - number: '3.2'
    text: Bij de in het eerste lid bedoelde kosten worden financieringskosten buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel3
  - number: '4'
    text: 'Geen subsidie wordt verleend:'
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel4
  - number: 4.a
    text: indien de subsidie zou moeten worden aangemerkt als staatssteun als bedoeld in artikel 87 van het EU-Verdrag;
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel4
  - number: 4.b
    text: |-
      indien de subsidieverlening ertoe zou leiden dat het bedrag, genoemd in [artikel 5][ref1], voor meer dan 40%
      besteed wordt aan: - één van de in [artikel 2, eerste lid][ref2], bedoelde doelen;
        - activiteiten in één oorsprongland.


      [ref1]: https://wetten.overheid.nl/BWBR0016140#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0016140#Artikel2
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0016140
        artikel: '5'
        paragraaf: II
      - id: ref2
        bwb_id: BWBR0016140
        artikel: '2'
        paragraaf: II
  - number: 4.c
    text: |-
      voor in [artikel 2][ref1] bedoelde activiteiten waarmee een begin van uitvoering is gemaakt alvorens de ontvangst
      van een aanvraag tot subsidieverlening schriftelijk aan de aanvrager is bevestigd;


      [ref1]: https://wetten.overheid.nl/BWBR0016140#Artikel2
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0016140
        artikel: '2'
        paragraaf: II
  - number: 4.d
    text: indien de op aanvraag te verlenen subsidie niet ten minste € 50.000,– bedraagt, en
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel4
  - number: 4.e
    text: |-
      voor in [artikel 2][ref1] bedoelde activiteiten, waarvoor door een bestuursorgaan reeds subsidie is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0016140#Artikel2
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0016140
        artikel: '2'
        paragraaf: II
  - number: '5'
    text: Het subsidieplafond van deze regeling bedraagt € 12.000.000.
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel5
  - number: '6.1'
    text: De subsidie bedraagt maximaal 75% van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel6
  - number: '6.2'
    text: De subsidie bedraagt per aanvrager maximaal € 2.000.000.
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel6
  - number: '7.1'
    text: De aanvraag tot subsidieverlening wordt ingediend bij het HPA.
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel7
  - number: '7.2'
    text: 'De aanvraag tot subsidieverlening gaat ten minste vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel7
  - number: 7.2.a
    text: |-
      een projectplan, dat bestaat uit een beschrijving van de doelstellingen en achtergronden van het project, het
      geheel van activiteiten, waarvoor geheel of gedeeltelijk subsidie wordt aangevraagd, een tijdsplanning van de
      activiteiten en de wijze van uitvoering;
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel7
  - number: 7.2.b
    text: een begroting van de kosten en een opgave van de financieringswijze van het project, en
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel7
  - number: 7.2.c
    text: |-
      in voorkomend geval, indien het project in een samenwerkingsverband wordt uitgevoerd, het
      samenwerkingsovereenkomst, met daarin tenminste een overzicht van de aan het samenwerkingsverband deelnemende
      natuurlijke en rechtspersonen alsmede van de verdeling van de bevoegdheden, verantwoordelijkheden en financiële
      verplichtingen tussen de verschillende deelnemers.
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel7
  - number: '8.1'
    text: De aanvraag tot subsidieverlening kan worden ingediend vanaf 1 januari 2004 tot en met 31 december 2007.
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel8
  - number: '8.2'
    text: |-
      De minister kan besluiten dat vanaf een door hem te bepalen tijdstip, voor bepaalde of voor onbepaalde tijd, geen
      aanvragen kunnen worden ingediend en doet daarvan mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel8
  - number: '9.1'
    text: |-
      De aanvragen tot subsidieverlening worden behandeld op volgorde van binnenkomst, met dien verstande dat wanneer de
      aanvrager krachtens [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad de aanvraag
      aan te vullen, de dag waarop de aanvraag is aangevuld voor de toepassing van dit artikel geldt als datum van
      ontvangst.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '9.2'
    text: |-
      Indien door toewijzing van subsidieaanvragen met dezelfde datum van ontvangst het subsidieplafond als bedoeld
      in [artikel 5][ref1] zou worden overschreden, geschiedt de toewijzing volgens een rangschikking van de
      subsidieaanvragen, waarbij telkenmale de hoogst gerangschikte subsidieaanvraag het eerste voor toewijzing in
      aanmerking komt. De rangschikking vindt plaats volgens loting, die geschiedt door een door de minister aan te
      wijzen notaris.


      [ref1]: https://wetten.overheid.nl/BWBR0016140#Artikel5
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0016140
        artikel: '5'
        paragraaf: II
  - number: '10.1'
    text: |-
      Er is een begeleidingscommissie, die tot taak heeft de minister te adviseren over de ingediende aanvragen tot
      subsidieverlening, aanvragen tot voorschotverlening en aanvragen tot subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel10
  - number: '10.2'
    text: 'De minister benoemt in de begeleidingscommissie:'
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel10
  - number: 10.2.a
    text: twee leden afkomstig uit de cacaosector;
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel10
  - number: 10.2.b
    text: twee leden afkomstig uit de chocoladesector;
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel10
  - number: 10.2.c
    text: één lid, zijnde een ambtenaar werkzaam bij het ministerie van Landbouw, Natuur en Voedselkwaliteit, en
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel10
  - number: 10.2.d
    text: |-
      een voorzitter, niet afkomstig uit de cacao- of chocoladesector en niet werkzaam bij het ministerie van Landbouw,
      Natuur en Voedselkwaliteit.
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel10
  - number: '10.3'
    text: De benoemingsduur van de voorzitter en de leden bedraagt 4 jaar.
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel10
  - number: '10.4'
    text: De begeleidingscommissie stelt haar werkwijze vast.
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel10
  - number: '11'
    text: 'De subsidieontvanger voert de activiteit uit:'
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel11
  - number: 11.a
    text: overeenkomstig de aanvraag waarop de beschikking tot subsidieverlening betrekking heeft, en
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel11
  - number: 11.b
    text: |-
      binnen 12 maanden na ontvangst van de beschikking tot subsidieverlening of in de gevallen dat in de beschikking tot
      subsidieverlening een andere termijn is genoemd, binnen deze termijn.
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel11
  - number: '12.1'
    text: |-
      De minister kan de subsidieontvanger op diens aanvraag ten hoogste 80% van het verleende subsidiebedrag en ten
      hoogste een maal per zes maanden voorschotten verlenen.
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel12
  - number: '12.2'
    text: |-
      De aanvraag tot voorschotverlening wordt ingediend bij het HPA en gaat vergezeld van een overzicht van de
      liquiditeitsbehoefte.
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel12
  - number: '12.3'
    text: De beschikking tot voorschotverlening vermeldt het bedrag van het voorschot.
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel12
  - number: '12.4'
    text: De minister kan voorschriften en voorwaarden verbinden aan de beschikking tot voorschotverlening.
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel12
  - number: '13.1'
    text: |-
      De aanvraag tot subsidievaststelling wordt binnen 15 maanden na ontvangst van de beschikking tot subsidieverlening
      ingediend bij het HPA.
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel13
  - number: '13.2'
    text: |-
      Indien toepassing wordt gegeven aan [artikel 11, onderdeel b, laatste volzin][ref1], wordt de aanvraag tot
      subsidievaststelling binnen de op grond van dit artikel vastgestelde termijn ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0016140#Artikel11
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0016140
        artikel: '11'
        paragraaf: IV
  - number: '13.3'
    text: 'De aanvraag tot subsidievaststelling gaat ten minste vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel13
  - number: 13.3.a
    text: |-
      Schriftelijke bewijsstukken waaruit blijkt dat de in [artikel 3, eerste lid][ref1], bedoelde kosten zijn
      daadwerkelijk zijn gemaakt en betaald;


      [ref1]: https://wetten.overheid.nl/BWBR0016140#Artikel3
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0016140
        artikel: '3'
        paragraaf: II
  - number: 13.3.b
    text: schriftelijke bewijsstukken waaruit kan worden opgemaakt dat de activiteit daadwerkelijk verricht is.
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel13
  - number: '14'
    text: |-
      Indien de beschikking tot subsidievaststelling is ingetrokken, betaalt de subsidieontvanger op eerste vordering van
      de minister de onverschuldigd betaalde subsidiebedragen en voorschotten terug, vermeerderd met de wettelijke rente
      over de periode van de datum van intrekking tot het tijdstip van algehele voldoening.
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel14
  - number: '15'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel15
  - number: '16'
    text: 'Deze regeling wordt aangehaald als: Subsidieregeling duurzame ontwikkeling cacao- en chocoladesector.'
    url: https://wetten.overheid.nl/BWBR0016140/2005-11-19#Artikel16
