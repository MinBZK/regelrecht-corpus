$id: veteranenwet
regulatory_layer: WET
publication_date: '2019-05-16'
valid_from: '2020-01-01'
bwb_id: BWBR0031401
url: https://wetten.overheid.nl/BWBR0031401/2020-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging hebben genomen dat veteranen het Koninkrijk der Nederlanden als militair hebben
    gediend onder oorlogsomstandigheden dan wel door deelname aan een missie ter handhaving of bevordering van de
    internationale rechtsorde;

    dat de erkenning door de Nederlandse samenleving van de verdiensten van veteranen en van de mogelijke gevolgen van
    de inzet als militair voor hun gezondheid, als ook de waardering die aan veteranen op grond van hun verdiensten
    toekomt, moeten worden bevorderd;

    dat de bijzondere zorg die veteranen en hun relaties in verband met de inzet als militair nodig hebben, moet worden
    gewaarborgd;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goed gevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *Onze Minister:* Onze Minister van Defensie;
        - *militair:* de militair ambtenaar in werkelijke dienst als bedoeld in
      [artikel 1, eerste lid, onder b, van de Wet ambtenaren defensie][ref1], waaronder mede begrepen de met militair
      beroepspersoneel gelijkgestelde geestelijke verzorgers;
        - *veteraan:* de militair, de gewezen militair, of de gewezen dienstplichtige, van de Nederlandse krijgsmacht,
      dan wel van het Koninklijk Nederlandsch Indisch Leger, alsmede degene die behoorde tot het vaarplichtig
      koopvaardijpersoneel, die het Koninkrijk der Nederlanden heeft gediend onder oorlogsomstandigheden dan wel heeft
      deelgenomen aan een missie ter handhaving of bevordering van de internationale rechtsorde voor zover deze missie
      bij regeling van Onze Minister is aangewezen;
        - *inzet:* het dienen als militair onder oorlogsomstandigheden dan wel het deelnemen als militair aan een missie
      als bedoeld onder c;
        - *relatie:* de echtgenoot, geregistreerde partner of andere levensgezel en bloed- en aanverwanten in de eerste of
      tweede graad van de veteraan;
        - *materiële zorg:* de aanspraken van de veteraan op grond van een wettelijk voorschrift op bezoldiging dan wel op
      uitkeringen en voorzieningen in verband met werkloosheid, ziekte, arbeidsongeschiktheid, invaliditeit of overlijden
      als gevolg van de uitoefening van de militaire dienst onder de omstandigheden of bij een missie als bedoeld onder
      c;
        - *persoonsgegevens, verwerking, verwerkingsverantwoordelijke:* hetgeen daaronder wordt verstaan in artikel 4,
      onderdelen 1, 2 en 7, van de Algemene verordening gegevensbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel1
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001952
        artikel: '1'
  - number: '2.1'
    text: |-
      Onze Minister voert een beleid dat is gericht op het bevorderen van erkenning van de verdiensten van veteranen, van
      erkenning van de mogelijke gevolgen van de inzet voor hun gezondheid en van waardering die veteranen op grond van
      hun verdiensten toekomt.
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel2
  - number: '2.2'
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld in ieder geval betreffende:'
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel2
  - number: 2.2.a
    text: |-
      het faciliteren van publieke en private initiatieven op het gebied van erkenning van en waardering voor veteranen,
      waaronder de Nederlandse veteranendag;
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel2
  - number: 2.2.b
    text: |-
      de wijze waarop veteranen in staat worden gesteld om zich als zodanig te onderscheiden door middel van onder meer
      de veteranenpas en het draaginsigne veteranen;
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel2
  - number: 2.2.c
    text: het faciliteren van de deelname van veteranen en hun relaties aan bijeenkomsten en reünies.
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel2
  - number: '3.1'
    text: |-
      Onze Minister heeft een zorgplicht voor militairen die worden ingezet. Deze zorgplicht houdt in dat militairen en
      hun relaties goed worden voorbereid op de inzet en goed worden begeleid tijdens de inzet.
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel3
  - number: '3.2'
    text: |-
      Ter uitvoering van de in het eerste lid genoemde zorgplicht worden bij of krachtens algemene maatregel van bestuur
      regels gesteld betreffende:
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel3
  - number: 3.2.a
    text: het bepalen van de uitzendgeschiktheid van militairen;
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel3
  - number: 3.2.b
    text: het voorbereiden van militairen op de daadwerkelijke inzet;
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel3
  - number: 3.2.c
    text: het voorzien in sociaal medische begeleiding van militairen tijdens de inzet;
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel3
  - number: 3.2.d
    text: het begeleiden van de relaties van militairen tijdens de inzet;
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel3
  - number: 3.2.e
    text: het informeren van militairen en hun relaties over gezondheidsrisico’s van de inzet;
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel3
  - number: 3.2.f
    text: het informeren van militairen en hun relaties over de zorg die voor hen beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel3
  - number: '4.1'
    text: |-
      Onze Minister heeft een zorgplicht voor veteranen die zijn ingezet. Deze zorgplicht houdt in dat veteranen en hun
      relaties goed worden begeleid na afloop van de inzet.
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel4
  - number: '4.2'
    text: |-
      Ter uitvoering van de in het eerste lid genoemde zorgplicht worden bij of krachtens algemene maatregel van bestuur
      regels gesteld betreffende:
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel4
  - number: 4.2.a
    text: het voorzien in sociaal medische begeleiding van veteranen en hun relaties na afloop van de inzet;
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel4
  - number: 4.2.b
    text: |-
      het ondersteunen van de veteraan bij het vinden van een andere betrekking indien ontslag als militair aan de orde
      is;
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel4
  - number: 4.2.c
    text: het organiseren van bijeenkomsten voor veteranen en hun relaties in het kader van nazorg;
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel4
  - number: 4.2.d
    text: het faciliteren van de deelname van veteranen en hun relaties aan bijeenkomsten in het kader van nazorg.
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel4
  - number: '5.1'
    text: |-
      Onze Minister heeft een bijzondere zorgplicht voor veteranen die als gevolg van de inzet zorg nodig hebben. Deze
      zorgplicht houdt in dat veteranen en hun relaties worden bijgestaan bij hun revalidatie en re-integratie en bij het
      verkrijgen van materiële zorg, maatschappelijke ondersteuning of geestelijke gezondheidszorg.
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel5
  - number: '5.2'
    text: |-
      Ter uitvoering van de in het eerste lid genoemde zorgplicht worden bij of krachtens algemene maatregel van bestuur
      regels gesteld betreffende:
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel5
  - number: 5.2.a
    text: het inrichten van de revalidatie en de re-integratie van veteranen en hun relaties;
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel5
  - number: 5.2.b
    text: het begeleiden van veteranen en hun relaties bij het verkrijgen van materiële zorg;
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel5
  - number: 5.2.c
    text: |-
      het begeleiden van veteranen en hun relaties bij het verkrijgen van maatschappelijke ondersteuning of geestelijke
      gezondheidszorg.
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel5
  - number: '6'
    text: |-
      De zorgplichten, bedoeld in de [artikelen 3][ref1], [4 ][ref2]en [5][ref3], laten de materiële zorg op grond van
      wettelijke voorschriften in verband met werkloosheid, ziekte, arbeidsongeschiktheid, invaliditeit en overlijden, op
      grond van de [Wet ambtenaren defensie][ref4] of de [Kaderwet militaire pensioenen][ref5] en de zorg op het gebied
      van maatschappelijke ondersteuning en geestelijke gezondheidszorg onverlet en liggen in het verlengde daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0031401#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0031401#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0031401#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0001952
      [ref5]: https://wetten.overheid.nl/BWBR0011955
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0031401
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0031401
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0031401
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0001952
      - id: ref5
        bwb_id: BWBR0011955
  - number: '7.1'
    text: |-
      Onze Minister treft voor de veteraan een passende inkomensvoorziening voor de duur die nodig is in verband met de
      revalidatie, re-integratie en de begeleiding van de veteraan als bedoeld in [artikel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031401#Artikel5
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0031401
        artikel: '5'
  - number: '7.2'
    text: |-
      Ter uitvoering van de in het eerste lid genoemde inkomensvoorziening worden bij of krachtens algemene maatregel van
      bestuur regels gesteld betreffende:
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel7
  - number: 7.2.a
    text: de voorwaarden waaraan de veteraan moet voldoen om voor de inkomensvoorziening in aanmerking te komen;
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel7
  - number: 7.2.b
    text: |-
      het bepalen van de hoogte van de inkomensvoorziening, waarbij wordt uitgegaan van een uitkering van 80% van
      het bedrag van de inkomsten die hij in het jaar voorafgaande aan zijn aanmelding bij het loket, bedoeld in
      [artikel 8, tweede lid, onder c][ref1], uit hoofde van zijn beroep of bedrijf gebruikelijk zou hebben kunnen
      genieten;


      [ref1]: https://wetten.overheid.nl/BWBR0031401#Artikel8
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0031401
        artikel: '8'
  - number: 7.2.c
    text: de verrekening van andere inkomsten met de inkomensvoorziening.
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel7
  - number: '8.1'
    text: |-
      Onze Minister bevordert vanwege de bijzondere zorgplicht, bedoeld in [artikel 5][ref1], de samenwerking tussen
      de bij de revalidatie en re-integratie en de materiële zorg betrokken uitvoeringsinstanties en de bij de
      maatschappelijke ondersteuning en geestelijke gezondheidszorg betrokken zorginstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0031401#Artikel5
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0031401
        artikel: '5'
  - number: '8.2'
    text: |-
      Na overleg met Onze Minister van Sociale Zaken en Werkgelegenheid en Onze Minister van Volksgezondheid, Welzijn en
      Sport worden bij of krachtens algemene maatregel van bestuur regels gesteld betreffende:
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel8
  - number: 8.2.a
    text: |-
      het inrichten van de samenwerking tussen de bij de revalidatie en re-integratie en de materiële zorg betrokken
      uitvoeringsinstanties en de bij de maatschappelijke ondersteuning en geestelijke gezondheidszorg betrokken
      zorginstellingen;
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel8
  - number: 8.2.b
    text: |-
      het waar mogelijk gezamenlijk verzorgen van de aanvraag, beoordeling, toekenning en uitbetaling van uitkeringen,
      pensioenen en voorzieningen in verband met ziekte, arbeidsongeschiktheid en invaliditeit;
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel8
  - number: 8.2.c
    text: |-
      het organiseren van de toegang tot de revalidatie en re-integratie en de materiële zorg en de maatschappelijke
      ondersteuning en geestelijke gezondheidszorg door het oprichten van een loket voor veteranen en hun relaties;
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel8
  - number: 8.2.d
    text: |-
      het toewijzen van zorgcoördinatoren ten behoeve van de persoonlijke begeleiding van de veteraan en zijn relaties
      bij de revalidatie en re-integratie, materiële zorg, maatschappelijke ondersteuning en geestelijke gezondheidszorg.
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel8
  - number: '9.1'
    text: |-
      Ten behoeve van de identificatie van veteranen en van de mogelijkheid tot het informeren van veteranen
      over de toepassing van de [artikelen 2 tot en met 8][ref1] en ten behoeve van wetenschappelijk onderzoek
      worden, persoonsgegevens van veteranen verwerkt in het veteranenregistratiesysteem. Onze Minister is
      verwerkingsverantwoordelijke voor deze verwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0031401#Artikel2
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0031401
        artikel: '2'
  - number: '9.2'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de inrichting en het beheer
      van het veteranenregistratiesysteem en de mogelijkheid van verstrekking van persoonsgegevens aan derden die
      activiteiten verrichten in het kader van erkenning en waardering voor veteranen.
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel9
  - number: '10'
    text: |-
      Onze Minister bevordert wetenschappelijk onderzoek naar aandoeningen die gerelateerd kunnen zijn aan de uitoefening
      van de dienst onder omstandigheden en bij een missie als bedoeld in [artikel 1, onder c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031401#Artikel1
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0031401
        artikel: '1'
  - number: '13'
    text: |-
      De voordracht voor een krachtens deze wet vast te stellen algemene maatregel van bestuur wordt niet eerder gedaan
      dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel13
  - number: '14'
    text: |-
      Onze Minister zendt binnen twee jaar na de inwerkingtreding van deze wet, en vervolgens telkens na twee jaar, aan
      de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel14
  - number: '15'
    text: 'Deze wet wordt aangehaald als: Veteranenwet.'
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel15
  - number: '16'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0031401/2020-01-01#Artikel16
