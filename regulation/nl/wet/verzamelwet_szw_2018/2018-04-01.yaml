preamble:
  text: >-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.


    Allen die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het wenselijk is om enige wijzigingen aan te brengen in de wetgeving van
    het Ministerie van Sociale Zaken en Werkgelegenheid;


    Zo is het dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-Generaal,
    hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0040370/2018-04-01#ArtikelAanhef
articles:
  - number: XXXVI
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld, en kunnen terugwerken
      tot en met een in dat besluit te bepalen tijdstip, dat voor de verschillende artikelen of onderdelen
      daarvan verschillend kan worden vastgesteld. In dat besluit wordt zo nodig toepassing gegeven aan
      [artikel 12, eerste lid, van de Wet raadgevend referendum][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel12
    url: https://wetten.overheid.nl/BWBR0040370/2018-04-01#ArtikelXXXVI
