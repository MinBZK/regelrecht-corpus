  - number: '16'
    text: |-
      De minister kan bij de beschikking tot subsidieverlening bepalen dat ambtshalve voorschotten worden verleend, en,
      indien voorschotten worden verleend, aangeven hoe deze voorschotten worden berekend.
    url: https://wetten.overheid.nl/BWBR0029245/2010-12-25#Artikel16
  - number: '17'
    text: |-
      1 De subsidieontvanger dient zijn aanvraag om subsidievaststelling in uiterlijk dertien weken na het tijdstip
      waarop de activiteiten moeten zijn voltooid.

      2 De aanvraag wordt ingediend met gebruikmaking van het formulier dat als [bijlage 3][ref1] bij de regeling is
      gevoegd.

      3 De aanvraag gaat, overeenkomstig in het formulier is vermeld, vergezeld van de in het formulier aangegeven
      bescheiden.


