      conventionele installatie met dezelfde effectieve energieproductiecapaciteit.

      2 De investeringskosten zijn de rechtstreeks aan het RES-project toe te rekenen kosten voor grond, installaties en
      apparatuur. De investeringskosten kunnen eveneens betrekking hebben op technologieoverdracht en knowhowlicenties
      mits aan de voorwaarden, genoemd in artikel 3, vierde lid, van het NER-besluit is voldaan.

      3 De in het eerste lid bedoelde exploitatiekosten en -baten worden berekend met toepassing van artikel 3, vijfde
      lid, van het NER-besluit.
    url: https://wetten.overheid.nl/BWBR0029245/2010-12-25#Artikel21
