preamble:
  text: |-
    Gelet op artikel 3 Kaderwet EZ-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0029245/2010-12-25#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *CCS-project:* een samenhangend geheel van activiteiten dat: a. gericht is op het milieutechnisch veilig
      afvangen, transporteren en geologisch opslaan van CO, b. valt onder één van de categorieën, bedoeld in bijlage 1,
      onderdeel A, onder I, van het NER-besluit en c. voldoet aan de eisen, bedoeld in artikel 6, eerste lid, onderdeel
      b, van het NER-besluit;
        - *EERP:* [verordening (EG) nr. 663/2009](32009R0663) van het Europees Parlement en de Raad van 13 juli 2009
      houdende vaststelling van een programma om het economisch herstel te bevorderen via financiële bijstand van de
      Gemeenschap aan projecten op het gebied van energie (PbEU 2009, L 200);
        - *ETS-richtlijn:* [richtlijn nr. 2003/87/EG](32003L0087) van het Europees Parlement en de Raad van 13 oktober 2003
      tot vaststelling van en regeling voor de handel in broeikasgasemissierechten binnen de Gemeenschap en tot wijziging
      van [Richtlijn 96/61/EG](31996L0061) van de Raad (PbEU 2003, L 275);
        - *minister:* de Minister van Economische Zaken, Landbouw en Innovatie;
        - *NER-besluit:* besluit 2010/670/EU van de Commissie van 3 november 2010 tot vaststelling van criteria en
      maatregelen voor de financiering van commerciële demonstratieprojecten ter bevordering van de milieutechnisch
      veilige afvang en geologische opslag van CO, alsook voor demonstratieprojecten ter bevordering van innovatieve
      technologieën voor hernieuwbare energie in het kader van de bij [Richtlijn 2003/87/EG](32003L0087) van het Europees
      Parlement en de Raad vastgestelde regeling voor de handel in broeikasgasemissierechten binnen de Gemeenschap (PbEU
      2010, L 290);
        - *ondernemer:* een natuurlijke persoon, een rechtspersoon, een vennootschap of een hiermee gelijk te stellen
      entiteit, die een onderneming in stand houdt, niet zijnde een rechtspersoon die krachtens publiekrecht is
      ingesteld;
        - *onderneming:* iedere eenheid, ongeacht haar rechtsvorm of wijze van financiering, die een economische activiteit
      uitoefent;
        - *penvoerder:* de door het samenwerkingsverband aangewezen penvoerende persoon of organisatie;
        - *procedureverordening:* [verordening (EG) nr. 659/1999](31999R0659) van de Raad van 22 maart 1999 tot
      vaststelling van nadere bepalingen voor de toepassing van artikel 93 van het EG-verdrag (PbEG 1999, L 83);
        - *RES-project:* een samenhangend geheel van activiteiten dat: a. gericht is op het ontwikkelen en toepassen van
      nieuwe technologieën voor hernieuwbare energie; b. valt onder één van de categorieën bedoeld in artikel 6, eerste
      lid, onderdeel a, van het NER-besluit; c. voldoet aan de eisen, bedoeld in artikel 6, eerste lid, onderdeel b, van
      het NER-besluit; d. innovatief is, als bedoeld in artikel 6, eerste lid, onderdeel c, van het NER-besluit en e.
      waarvan de totale projectkosten ten minste € 50.000.000,– bedragen.
        - *samenwerkingsverband:* een geen rechtspersoonlijkheid bezittend verband, bestaande uit ten minste twee niet in
      een groep verbonden deelnemers, dat is opgericht ten behoeve van de uitvoering van activiteiten, niet zijnde een
      vennootschap;
        - *toekenningsbesluit:* het besluit van de Europese Commissie bedoeld in artikel 5, vijfde lid, van het NER-
      besluit.
    url: https://wetten.overheid.nl/BWBR0029245/2010-12-25#Artikel1
  - number: '2'
    text: |-
      1. De minister verstrekt op aanvraag subsidie aan een ondernemer die of aan een deelnemer in een
      samenwerkingsverband dat een CCS-project uitvoert in Nederland, op het Nederlandse continentale plat of in de
      Nederlandse exclusieve economische zone.
    url: https://wetten.overheid.nl/BWBR0029245/2010-12-25#Artikel2
  - number: '3'
    text: |-
      1 De subsidie bedraagt 50% van de subsidiabele kosten.

      2 De subsidie bedraagt maximaal 15% van de 300 miljoen beschikbare emissierechten, uitgedrukt in een bedrag in
      Euro.
    url: https://wetten.overheid.nl/BWBR0029245/2010-12-25#Artikel3
  - number: '4'
    text: |-
      Indien reeds door de Europese Commissie subsidie op grond van de EERP is verstrekt voor de subsidiabele kosten of
      een deel daarvan, wordt slechts een zodanig bedrag aan subsidie verstrekt dat het totale bedrag aan subsidies op
      grond van de EERP en op grond van deze regeling niet meer bedraagt dan 50% van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0029245/2010-12-25#Artikel4
  - number: '5'
    text: |-
      1 De subsidiabele kosten zijn de investeringskosten van een CCS-project verminderd met de netto contante waarde
      volgens de best mogelijk schatting van de exploitatiekosten en -baten uit de toepassing van de afvang en opslag CO
      in de eerste tien exploitatiejaren.

      2 De investeringskosten zijn de rechtstreeks aan het CCS-project toe te rekenen kosten voor grond, installaties, en
      apparatuur. De investeringskosten kunnen eveneens betrekking hebben op technologieoverdracht en knowhowlicenties,
      mits aan de voorwaarden, genoemd in artikel 3, vierde lid, van het NER-besluit is voldaan.

      3 De in het eerste lid bedoelde exploitatiekosten en -baten van het CCS-project worden berekend met toepassing van
      artikel 3, vijfde lid, van het NER-besluit.
    url: https://wetten.overheid.nl/BWBR0029245/2010-12-25#Artikel5
  - number: '6'
    text: |-
      1 Het subsidieplafond bedraagt het totale bedrag dat op basis van het toekenningsbesluit voor Nederland beschikbaar
      is voor CCS-projecten.

      2 De minister verdeelt het subsidieplafond overeenkomstig het toekenningsbesluit.
    url: https://wetten.overheid.nl/BWBR0029245/2010-12-25#Artikel6
  - number: '7'
    text: |-
      1 Een aanvraag om subsidie wordt uiterlijk 9 februari 2011 ingediend met gebruikmaking van een formulier dat als
      [bijlage 1][ref1] bij deze regeling is gevoegd.

      2 De aanvraag wordt in de Engelse taal gedaan.

      3 De aanvraag gaat, overeenkomstig in het formulier is vermeld, vergezeld van de in het formulier aangegeven
      bescheiden.

      4 Bij de aanvraag worden in ieder geval de gegevens, bedoeld in artikel 5, derde lid, tweede alinea, onderdeel a
      tot en met d, van het NER-besluit, verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0029245
    url: https://wetten.overheid.nl/BWBR0029245/2010-12-25#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0029245
  - number: '8'
    text: |-
      Indien aanvragers van subsidie samenwerken in een samenwerkingsverband, dienen zij hun aanvraag in via een
      penvoerder.
    url: https://wetten.overheid.nl/BWBR0029245/2010-12-25#Artikel8
  - number: '9'
    text: |-
      1 De minister beslist afwijzend op een aanvraag om subsidie indien de aanvraag niet voldoet aan:

      a. deze paragraaf;

      b. de vereisten, bedoeld in bijlage I, onderdeel B, bij het NER-besluit.

      2 De minister beslist afwijzend op een aanvraag indien:

      a. onvoldoende vertrouwen bestaat dat de aanvrager het CCS-project naar behoren kan uitvoeren;

      b. onvoldoende vertrouwen bestaat dat de aanvrager voldoende financiële draagkracht en stabiliteit kan waarborgen;

      c. onvoldoende vertrouwen bestaat in de haalbaarheid van het CCS-project.
    url: https://wetten.overheid.nl/BWBR0029245/2010-12-25#Artikel9
  - number: '10'
    text: |-
      1 De minister dient de aanvragen waarop op grond van [artikel 9][ref1] niet afwijzend is beslist, op basis van
      artikel 5, derde lid, van het NER-besluit in bij de Europese Investeringsbank.

      2 De minister beslist afwijzend op een aanvraag om subsidie indien een aanvraag als bedoeld in het eerste lid, op
      grond van een toekenningsbesluit niet voor financiering uit hoofde van het NER-besluit in aanmerking komt.


      [ref1]: https://wetten.overheid.nl/BWBR0029245#Artikel9
    url: https://wetten.overheid.nl/BWBR0029245/2010-12-25#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0029245
        artikel: '9'
        paragraaf: '2'
  - number: '11'
    text: |-
      De minister geeft een beschikking op een aanvraag om subsidie binnen zeventien weken nadat duidelijk is of een CCS-
      project uit hoofde van het NER-besluit wordt gefinancierd op grond van een voorwaardelijk toekenningsbesluit.
    url: https://wetten.overheid.nl/BWBR0029245/2010-12-25#Artikel11
  - number: '12'
    text: |-
      Indien uit andere hoofde subsidie wordt verstrekt als cofinanciering aan een CCS-project wordt de subsidie verleend
      onder de ontbindende voorwaarde dat de Europese Commissie overeenkomstig artikel 4, tweede en derde lid, van de
      procedureverordening bij beschikking heeft vastgesteld dat de cofinanciering geen steun vormt dan wel verenigbaar
      is met de gemeenschappelijke markt en de door de Europese Commissie aan de beschikking verbonden voorwaarden
      bedoeld in artikel 7, vierde lid, van de Procedureverordening zijn toegepast.
    url: https://wetten.overheid.nl/BWBR0029245/2010-12-25#Artikel12
  - number: '13'
    text: |-
      De subsidie wordt verleend onder de ontbindende voorwaarde dat het toekenningsbesluit voor het CCS-project
      rechtskracht heeft.
    url: https://wetten.overheid.nl/BWBR0029245/2010-12-25#Artikel13
  - number: '14'
    text: |-
      De subsidieontvanger deelt de kennis betreffende de in bijlage II bij het NER-besluit bedoelde elementen
      overeenkomstig artikel 12 van het NER-besluit.
    url: https://wetten.overheid.nl/BWBR0029245/2010-12-25#Artikel14
  - number: '15'
    text: |-
      De verplichtingen, bedoeld in [artikel 36][ref1], [37][ref2], [38][ref3], [39][ref4], [40][ref5], [41][ref6] en
      [43 van het Kaderbesluit EZ-subsidies][ref7] zijn van overeenkomstige toepassing.


