    text: |-
      De vervoerder van varkens voldoet aan artikel 12, eerste lid, onderdeel a, eerste gedachtestreepje, en derde lid,
      van richtlijn nr. 64/432/EEG.
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel4.1a
  - number: '4.2'
    text: |-
      Als bewijsstuk, bedoeld in [artikel 2.4, eerste lid, onderdeel a][ref1], wordt met het oog op het anders dan in
      doorvoer buiten Nederland brengen van varkens, bestemd voor een lid-staat, vastgesteld het gezondheidscertificaat
      dat op grond van artikel 5, eerste lid, van [richtlijn 64/432/EEG](31964L0432) voor de desbetreffende soort varkens
      is voorgeschreven, met dien verstande dat ter zake van het gezondheidscertificaat voor fok- en gebruiksvarkens
      de verklaring in paragraaf V, onderdeel b, eerste gedachtenstreepje, van bijlage F, van [richtlijn 64/432/EEG]
      (31964L0432) vervalt.


