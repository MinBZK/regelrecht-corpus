  - number: 7a.1
    text: |-
      1 Een partij gaffelantilopen, herten, muskusherten, dwergherten, giraffen, okapi’s, eeltpotigen, nijlpaarden,
      pecari’s, neushoorns, tapirs, olifanten en holhoornigen niet zijnde runderen, geiten en schapen is afkomstig
      uit een derde land dat voorkomt op een krachtens artikel 3, eerste lid, van [richtlijn 2004/68/EG](32004L0068)
      vastgestelde lijst.

      2 Het in het eerste lid bedoelde derde land biedt de in artikel 7 van [richtlijn 2004/68/EG](32004L0068) gegeven
      garanties en de partij dieren, bedoeld in het eerste lid, voldoet, voor zover van toepassing, aan de krachtens
      artikel 6, eerste lid, van [richtlijn 2004/68/EG](32004L0068) vastgestelde veterinairrechtelijke voorschriften,
      tenzij krachtens artikel 8 van [richtlijn 2004/68/EG](32004L0068) specifieke bepalingen zijn vastgesteld, in welk
      geval deze gelden.

      3 Een partij dieren als bedoeld in het eerste lid gaat vergezeld van een veterinair certificaat als bedoeld in
      artikel 11, eerste lid, van [richtlijn 2004/68/EG](32004L0068).

      4 Een partij dieren als bedoeld in het eerste lid, voldoet, voor zover van toepassing, aan de krachtens artikel 13
      van [richtlijn 2004/68/EG](32004L0068) vastgestelde uitvoeringsbepalingen.
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel7a.1
  - number: '8.1'
    text: |-
      Onverminderd [artikel 1.1][ref1] wordt, voor zover niet uitdrukkelijk anders is bepaald, in dit hoofdstuk verstaan
      onder:

        - *lagomorfen:* lagomorfen die zijn bestemd voor een lid-staat die een gezondheidscertificaat als bedoeld in
      artikel 9, tweede lid, van richtlijn 92/65/EEG eist;


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel8.1
    references:
