  - number: '2.26'
    text: |-
      1 De ontvanger geeft van elke aanvoer van een partij kennis aan de VWA. De kennisgeving geschiedt tussen 08.00 uur
      en 17.00 uur en ten laatste op de dag, niet zijnde een zaterdag, zondag of algemeen erkende feestdag, voorafgaande
      aan de dag van aankomst op de plaats van bestemming. Bij de kennisgeving wordt de plaats en het vermoedelijke
      tijdstip van aankomst alsmede de hoeveelheid en de soort dieren of producten opgegeven.

      2 Het eerste lid geldt niet voor de aanvoer van geregistreerde paarden als bedoeld in
      [artikel 5.1 van hoofdstuk 5][ref1].

      3 Indien het runderen of varkens betreft, die niet op een bepaald bedrijf geboren zijn en niet gedurende de laatste
      dertig dagen op het grondgebied van de lid-staat van verzending verbleven hebben, voegt de ontvanger de partij
      eerst aan het beslag op zijn bedrijf toe, nadat de dierenarts, verantwoordelijk voor de toevoeging aan dit beslag,
      heeft geconstateerd dat de dieren de gezondheidsstatus van dit beslag niet in gevaar kunnen brengen.

      4 Desverlangd biedt de ontvanger de aangevoerde partij aan de keuringsdierenarts ten onderzoek aan en overlegt
      hij hem:

      a. het certificaat of document, genoemd in de [derde afdeling van de hoofdstukken 3 tot en met 11][ref2], en de
      documenten, bedoeld in [artikel 2.22, tweede lid, onderdeel a][ref3], of

      b. de documenten, bedoeld in [artikel 2.22, vierde lid, onderdeel a of b][ref4].

      5 De ontvanger bewaart de in het vierde lid bedoelde certificaten of documenten ten minste zes maanden vanaf de
      datum van aanvoer van de partij.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel5.1
      [ref2]: https://wetten.overheid.nl/BWBR0007049#Hoofdstuk3
