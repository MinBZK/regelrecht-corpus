  - number: '2.36'
    text: |-
      Indien de dieren bestemd zijn voor een derde land:

      a. is door de minister vooraf toestemming verleend voor het brengen van de dieren in Nederland;

      b. is, indien het vervoer over het grondgebied van een of meer lid-staten zal plaatsvinden, door de bevoegde
      centrale autoriteit van die lid-staat of lid-staten toestemming verleend voor dit vervoer, en

      c. wordt door de importeur aan de keuringsdierenarts aangetoond dat het eerste derde land waarnaar de dieren worden
      vervoerd de verplichting op zich neemt de dieren, waarvan het toelaat dat zij op zijn grondgebied worden gebracht,
      in geen geval te weigeren of terug te zenden.
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel2.36
  - number: '2.37'
    text: |-
      1 Indien de dieren zijn verzonden vanuit een derde land waarvoor de geharmoniseerde veterinairrechtelijke
      voorschriften nog niet op grond van de veterinairrechtelijke regelgeving van de Raad van de Europese Unie of
      de Commissie van de Europese Gemeenschappen zijn vastgesteld, wordt voldaan aan artikel 8, onderdeel A, tweede
      lid, eerste, derde, vierde en vijfde gedachtenstreepje, van [richtlijn 91/496/EEG](31991L0496) en worden fok- en
      gebruiksdieren overeenkomstig artikel 10, eerste lid, eerste tot en met derde gedachtenstreepje en met inachtneming
      van de bijzondere waarborgen, bedoeld in artikel 10, eerste lid, tweede alinea, van [richtlijn 91/496/EEG]
      (31991L0496), in tijdelijke afzondering geplaatst.

      2 Het vervoer van de dieren naar een in artikel 10, eerste lid, tweede gedachtenstreepje, van richtlijn 91/496/EEG,
      bedoeld quarantainestation, vindt rechtstreeks en onder veterinair toezicht plaats.
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel2.37
  - number: '2.38'
    text: |-
      Met betrekking tot de partij is door de minister een Gemeenschappelijk veterinair document van binnenkomst als
      bedoeld in [verordening 282/2004/EG](32004R0282) afgegeven.
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel2.38
  - number: '2.39'
    text: |-
      1 Noch op grond van artikel 18, eerste lid, eerste gedachtenstreepje, van [richtlijn 91/496/EEG](31991L0496), noch
      op grond van andere regelgeving van de Raad van de Europese Unie of de Commissie van de Europese Gemeenschappen
      tot wering of bestrijding van besmettelijke dierziekten, zijn maatregelen genomen, houdende de instelling van een
      verbod om de betrokken dieren in de gebieden waarop het Verdrag betreffende de Europese Unie van toepassing is dan
      wel in Nederland te brengen.

      2 Ten aanzien van een partij is, in voorkomend geval, voldaan aan de op grond van artikel 18, eerste lid, tweede
      gedachtenstreepje, van [richtlijn 91/496/EEG](31991L0496) dan wel op grond van andere regelgeving van de Europese
      Gemeenschap vastgestelde bijzondere voorschriften.
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel2.39
  - number: '2.40'
    text: |-
      Indien de dieren voor een lid-staat dan wel een derde land zijn bestemd en tijdens het vervoer over Nederlands
      grondgebied zijn gestorven of afgemaakt, worden de kadavers vernietigd volgens de ter zake geldende wettelijke
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel2.40
  - number: '2.41'
    text: |-
      1 Tijdens het vervoer vanaf de erkende inspectiepost gaat de partij vergezeld van een afschrift van het
      certificaat, genoemd in [afdeling 4 van de hoofdstukken 3 tot en met 8][ref1] of in [afdeling 4a][ref2]
      of [afdeling 4b van hoofdstuk 8][ref3], van het aldaar bedoelde document en van het reisschema, genoemd in
      [afdeling 4 van de hoofdstukken 3][ref4], [4][ref5], [5][ref6] en [7][ref7], alsmede van een afschrift van de
      zoötechnische documenten die bij of krachtens het [Fokkerijbesluit][ref8] zijn voorgeschreven voor het brengen
      in Nederland van raszuivere dieren of hybride varkens die via Nederland voor het eerst in de gebieden waarop het
      [Verdrag betreffende de Europese Unie](onbekend) van toepassing is worden gebracht, alsmede van het document,
      bedoeld in artikel 7, eerste lid, tweede gedachtenstreepje, van [richtlijn 91/496/EEG](31991L0496).

      2 Indien de partij bestemd is voor een derde land vindt het vervoer over Nederlands grondgebied plaats onder
      douanetoezicht.


