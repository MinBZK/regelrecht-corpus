  - number: '2.24'
    text: |-
      1 Indien de partij bestemd is voor Nederland, gaat de partij tot en met de ontvangst door de ontvanger vergezeld
      van het certificaat of document, genoemd in de [derde afdeling van de hoofdstukken 3 tot en met 11][ref1], en van
      de documenten, bedoeld in [artikel 2.22, tweede lid, onderdeel a][ref2], dan wel van de documenten, bedoeld in
      [artikel 2.22, vierde lid, onderdeel a of b][ref3].

      2 Indien de partij bestemd is voor een lid-staat, gaat zij tijdens het vervoer naar de plaats waar
      zij weer buiten Nederland wordt gebracht, vergezeld van het certificaat of document, genoemd in de
      [derde afdeling van de hoofdstukken 3 tot en met 11][ref4], en van de documenten, artikel 22, vierde lid, onderdeel
      a of b.

      3 Indien de partij bestemd is voor een derde land, gaat zij tijdens het vervoer naar de plaats waar zij weer buiten
      Nederland wordt gebracht, vergezeld van de certificaten of documenten, bedoeld in [artikel 2.22, derde lid][ref5],
      dan wel van de documenten, [artikel 2.22, vierde lid, onderdeel c][ref6].


