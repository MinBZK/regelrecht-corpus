  - number: '2.51'
    text: |-
      1 Indien wordt vermoed of geconstateerd dat in de partij verwekkers van ziekten, zoönosen of andere aandoeningen
      aanwezig zijn of dat de producten afkomstig zijn uit een met een epidemische dierziekte besmet gebied, kan de
      minister, indien hij de aanwezigheid van verwekkers van ziekten, zoönosen of andere aandoeningen vermoedt, gelasten
      dat de producten voor rekening van verzender of diens gemachtigde, dan wel de afnemer, in tijdelijke afzondering
      worden geplaatst, dan wel worden, zonder vergoeding van Staatswege en:

      a. voor rekening van de verzender of diens gemachtigde, al naar gelang de minister daaromtrent heeft besloten en
      met inachtneming van de aanwijzingen van de keuringsdierenarts, de producten vernietigd, of

      b. voor rekening van de afnemer, al naar gelang de minister daaromtrent heeft besloten en met inachtneming van
      aanwijzingen van de keuringsdierenarts, voor andere doeleinden gebruikt dan waarvoor ze zijn bestemd.

      2 Indien aan de hand van de op grond van deze regeling uitgevoerde controles wordt vastgesteld dat een voor
      Nederland of een lidstaat bestemd product niet voldoet aan de op grond van deze regeling voor dat product gestelde
      voorschriften of dat een onregelmatigheid is begaan, besluit de minister in overleg met de belanghebbende bij de
      lading:

      a. dat het product in ieder geval binnen 60 dagen nadat is geconstateerd dat niet aan de onderhavige regeling
      wordt voldaan vanuit de inspectiepost met hetzelfde vervoermiddel wordt teruggezonden naar een derde land indien
      veterinairrechtelijke of gezondheidsredenen zich daar niet tegen verzetten;

      b. indien terugzending als bedoeld in onderdeel a onmogelijk is of de in dat onderdeel bedoelde termijn is
      verstreken, dat de partij wordt vernietigd overeenkomstig het bepaalde in artikel 17, tweede lid, onderdeel b, van
      [richtlijn 97/78/EG](31997L0078);

      c. dat de partij voor andere doeleinden dan de menselijke consumptie wordt gebruikt.

      3 Indien een partij in Nederland is gebracht zonder dat, voorzover van toepassing, die partij is onderworpen
      aan de in [artikel 2.44][ref1] bedoelde controles, besluit de minister dat de partij overeenkomstig het tweede
      lid, onderdeel b, wordt vernietigd of wordt teruggezonden naar een derde land indien veterinairrechtelijke of
      gezondheidsredenen zich daar niet tegen verzetten.

      4 In afwachting van de terugzending of de vernietiging van een partij als bedoeld in het tweede en derde lid, wordt
      de partij onder toezicht van de keuringsdierenarts in tijdelijke afzondering geplaatst en opgeslagen.

      5 Alle kosten die in verband met de in het tweede, derde en vierde lid bedoelde maatregelen worden gemaakt, komen
      ten laste van de belanghebbende bij de lading.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.44
