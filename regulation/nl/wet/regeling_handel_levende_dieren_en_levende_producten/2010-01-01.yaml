    text: |-
      1 Uit een derde land afkomstige, in Nederland gebrachte en voor Nederland bestemde slurfdieren of evenhoevigen,
      niet zijnde runderen, varkens, schapen of geiten, worden, voor zover zij kennelijk bestemd zijn voor fok-,
      gebruiks- of mestdoeleinden, rechtstreeks naar het bedrijf van bestemming vervoerd en aan het beslag van het
      bedrijf van bestemming toegevoegd.

      2 De in het eerste lid bedoelde dieren mogen gedurende een periode van ten minste 30 dagen, te rekenen vanaf de
      dag waarop de dieren op het bedrijf van bestemming zijn binnengebracht, het bedrijf niet verlaten, behoudens de
      rechtstreekse afvoer naar een in Nederland gelegen slachthuis.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op dieren als bedoeld in het eerste lid, die zijn
      bestemd voor dierentuinen, pretparken, wildparken en jachtgebieden.
