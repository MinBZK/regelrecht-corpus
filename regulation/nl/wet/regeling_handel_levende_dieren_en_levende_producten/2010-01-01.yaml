  - number: '4.8'
    text: |-
      1 Een partij varkens is afkomstig uit een derde land dat voorkomt op een krachtens artikel 3, eerste lid, van
      [richtlijn 2004/68/EG](32004L0068) vastgestelde lijst.

      2 Het in het eerste lid bedoelde derde land biedt de in artikel 7 van [richtlijn 2004/68/EG](32004L0068) gegeven
      garanties en de partij varkens voldoet, voor zover van toepassing, aan de krachtens artikel 6, eerste lid, van
      [richtlijn 2004/68/EG](32004L0068) vastgestelde veterinairrechtelijke voorschriften, tenzij krachtens artikel 8 van
      [richtlijn 2004/68/EG](32004L0068) specifieke bepalingen zijn vastgesteld, in welk geval die gelden.

      3 Een partij varkens gaat vergezeld van een veterinair certificaat als bedoeld in artikel 11, eerste lid, van
      [richtlijn 2004/68/EG](32004L0068).

      4 Een partij varkens voldoet, voor zover van toepassing, aan de krachtens artikel 13 van [richtlijn 2004/68/EG]
      (32004L0068) vastgestelde uitvoeringsbepalingen.
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel4.8
  - number: 4.8b
    text: |-
      1 In Nederland gebrachte en voor Nederland bestemde fok- en gebruiksvarkens worden rechtstreeks naar het bedrijf
      van bestemming vervoerd en aan het beslag op het bedrijf van bestemming toegevoegd nadat de voor dat bedrijf
      verantwoordelijke dierenarts heeft geconstateerd dat deze varkens geen bedreiging vormen voor de gezondheidsstatus.

      2 Behoudens wanneer de in het eerste lid bedoelde varkens bij aankomst op het bedrijf van bestemming terstond
      ten genoegen van de officiële dierenarts op zodanige wijze afgezonderd worden gehouden van reeds op dat bedrijf
      aanwezige dieren zodat ieder contact tussen de betrokken varkens en de overige op dat bedrijf aanwezige dieren is
      uitgesloten, mogen gedurende een periode van 30 dagen te rekenen vanaf de dag waarop de in het eerste lid bedoelde
      varkens op het bedrijf van bestemming zijn binnengebracht geen dieren van het bedrijf worden afgevoerd, behoudens
      de rechtstreekse afvoer naar een in Nederland gelegen slachthuis.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op varkens, afkomstig uit derde landen, die zijn
      bestemd voor dierentuinen, pretparken, wildparken en jachtgebieden.

      4 In Nederland gebrachte fok- en gebruiksvarkens, bestemd voor een lidstaat, worden zo snel
      mogelijk naar de Lidstaat van bestemming vervoerd en gaan vergezeld van de documenten, bedoeld in
      [artikel 2.22, vierde lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.22
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel4.8b
    references:
