  - number: 2.35a
    text: |-
      1 In afwijking in zoverre van [artikel 2.35, tweede lid][ref1], kan de belanghebbende bij de lading de melding van
      de aanvoer van een partij, bedoeld in [artikel 2.35, tweede lid][ref2], op elektronische wijze verrichten, mits de
      minister daarmee heeft ingestemd.

      2 De minister kan aan zijn instemming, bedoeld in het eerste lid, voorwaarden stellen en nadere voorschriften
      verbinden.

      3 De minister kan zijn instemming, bedoeld in het eerste lid in, intrekken, indien de belanghebbende bij de lading:

      a. niet meer voldoet aan de voorwaarden, bedoeld in het tweede lid, of

      b. niet voldoet aan de nadere voorschriften, bedoeld in het tweede lid.

      4 Het melden van de aanvoer, bedoeld in het eerste lid, geschiedt via een daarvoor bestemd elektronisch systeem met
      behulp van een door de minister beschikbaar gestelde toegang.

      5 De minister kan een elektronische aanmelding weigeren, indien deze niet overeenkomstig
      [artikel 2.35, tweede lid][ref3], is ingediend.

      6 [Artikel 20a, vijfde tot en met tiende lid, van de Regeling invoer, uitvoer en verkeer van planten][ref4] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.35
