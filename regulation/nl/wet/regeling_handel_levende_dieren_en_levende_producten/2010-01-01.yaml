  - number: '7.3'
    text: |-
      Op grond van het onderzoek, bedoeld in [artikel 2.5][ref1], is gebleken dat voldaan wordt aan:

      a. de artikelen 3, vijfde lid, 4, eerste, tweede en derde lid, 4 bis, eerste lid, en 4 ter, tweede en derde lid,
      van [richtlijn 91/68/EEG](31991L0068);

      b. bijlage A, hoofdstuk 1, punt D, van [richtlijn 91/68/EEG](31991L0068), indien het fokschapen en -geiten
      of mestschapen en -geiten betreft die bestemd zijn om in een officieel brucellosevrije schapenhouderij of
      geitenhouderij, bedoeld in artikel 2, vierde lid, van [richtlijn 91/68/EEG](31991L0068), te worden opgenomen;

      c. bijlage A, hoofdstuk 2, punt D, van [richtlijn 91/68/EEG](31991L0068), indien het fokschapen en -geiten of
      mestschapen en -geiten betreft die bestemd zijn om in een brucellosevrije schapenhouderij of geitenhouderij,
      bedoeld in artikel 2, vijfde lid, van [richtlijn 91/68/EEG](31991L0068), te worden te worden opgenomen;

      d. artikel 6 van [richtlijn 91/68/EEG](31991L0068), indien het fokschapen of -geiten betreft;

      e. de algemene of aanvullende garanties, bedoeld in artikel 8, tweede lid, van [richtlijn 91/68/EEG](31991L0068);

      f. voor zover van toepassing, de artikelen 4 ter, vierde lid, 4 quater, eerste, tweede en derde lid, onderdeel b,
      van [richtlijn 91/68/EEG](31991L0068), indien het slachtschapen of -geiten betreft;

      g. voor zover van toepassing, artikel 4 quater, derde lid, onderdeel a, van [richtlijn 91/68/EEG](31991L0068),
      indien het slachtschapen betreft, met dien verstande dat:

      1. het verzamelcentrum, bedoeld in artikel 4 quater, derde lid, onderdeel a, van [richtlijn 91/68/EEG](31991L0068),
      een schapenverzamelcentrum is;

      2. het officiële veterinaire document, bedoeld in artikel 4 quater, derde lid, onderdeel a, onder iii, van
      [richtlijn 91/68/EEG](31991L0068), wordt afgegeven door de officiële dierenarts;

      h. bijlage VIII, hoofdstuk A, deel I, onder a, van [verordening (EG) nr. 999/2001](32001R0999), indien het
      fokschapen of -geiten betreft;

      i. artikel 2, eerste en tweede lid, van verordening (EG) 546/2006, indien het schapen of geiten betreft die worden
      verzonden naar een in de bijlage bij die verordening genoemde lidstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.5
