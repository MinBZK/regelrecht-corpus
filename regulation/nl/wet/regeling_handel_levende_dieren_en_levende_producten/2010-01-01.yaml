  - number: '6.6'
    text: |-
      Indien een partij die is verzonden vanuit een lid-staat en bestemd is voor Nederland of een lid-staat, gaat zij
      vergezeld van het gezondheidscertificaat dat op grond van artikel 17 van [richtlijn 90/539/EEG](31990L0539) voor
      de desbetreffende soort pluimvee of broedeieren is voorgeschreven, met dien verstande dat, indien de partij bestemd
      is voor Zweden, in afwachting van de met betrekking tot infectieuze bronchitis gestelde algemene of beperkte
      aanvullende garanties, bedoeld in artikel 13, tweede lid, van [richtlijn 90/539/EEG](31990L0539) en van de met
      betrekking tot infectieuze rhinotracheïtis van de kalkoen, swollen head-syndrome, infectieuze laryngotrageïtis
      (ILT), EDS 76 en vogelpokken gestelde algemene of beperkte aanvullende garanties, bedoeld in artikel 14, tweede
      lid, van laatstgenoemde richtlijn, uit het gezondheidscertificaat blijkt dat wordt voldaan aan de voorschriften die
      Zweden stelt met betrekking tot genoemde ziekten.
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel6.6
  - number: '6.7'
    text: |-
      1 Pluimvee is en broedeieren zijn verzonden vanuit een derde land of een deel van een derde land dat is
      geplaatst op een lijst, opgenomen in een krachtens artikel 21, eerste lid, van richtlijn 90/539/EEG vastgestelde
      communautaire uitvoeringsmaatregel.

      2 Pluimvee is en broedeieren zijn afkomstig van koppels die voorafgaand aan de verzending gedurende een periode,
      voorgeschreven bij een krachtens artikel 23, eerste lid, onderdeel a, van richtlijn 90/539/EEG vastgestelde
      communautaire uitvoeringsmaatregel, op een grondgebied van een derde land, of in een deel daarvan, als bedoeld in
      het eerste lid, hebben verbleven.

      3 Pluimvee voldoet en broedeieren voldoen in voorkomend geval aan veterinairrechtelijke voorschriften, gesteld
      bij een krachtens artikel 23, eerste lid, onderdeel b, van richtlijn 90/539/EEG vastgestelde communautaire
      uitvoeringsmaatregel.

      4 Pluimvee gaat en broedeieren gaan vergezeld van een certificaat:

      a. dat voldoet aan:

      1°. artikel 24, eerste lid, van richtlijn 90/539/EEG, en

      2°. de eisen, opgenomen in een krachtens artikel 24, tweede lid, van richtlijn 90/539/EEG vastgestelde
      communautaire uitvoeringsmaatregel;

      b. waaruit, voor zover het pluimvee is of de broedeieren zijn bestemd voor Finland of Zweden, blijkt dat ten
      minste is voldaan aan de voorschriften die gelden voor de invoer uit lid-staten van pluimvee, onderscheidenlijk
      broedeieren, in Finland, onderscheidenlijk Zweden.

      5 De bestemming van pluimvee en broedeieren is in voorkomend geval toegestaan op grond van een krachtens artikel
      26, eerste lid, van richtlijn 90/539/EEG vastgestelde communautaire uitvoeringsmaatregel.

      6 Pluimvee wordt en broedeieren en eendagskuikens worden in quarantaine of in afzondering gehouden voor zover
      dit is bepaald bij een krachtens een artikel 26, tweede lid, van richtlijn 90/539/EEG vastgestelde communautaire
      uitvoeringsmaatregel, gedurende een bij die maatregel bepaalde periode.

      7 Pluimvee voldoet en broedeieren voldoen in voorkomend geval aan de bepalingen, gesteld bij een krachtens artikel
      27bis van richtlijn 90/539/EEG vastgestelde communautaire uitvoeringsmaatregel.

      8 Aan het pluimvee zijn geen stoffen toegediend die ingevolge artikel 3, onderdeel a, van richtlijn 96/22/EG niet
      aan pluimvee mogen worden toegediend, tenzij aan de voorwaarden van artikel 11 van voornoemde richtlijn is voldaan.

      9 Onverminderd het bepaalde in het eerste tot en met het zevende lid, voldoen pluimvee en broedeieren aan de
      voorschriften van verordening (EG) nr. 798/2008 die niet strekken ter uitvoering van de in het eerste tot en met
      zevende lid genoemde artikelen van richtlijn nr. 90/539/EEG.

      10 De minister is de bevoegde autoriteit, bedoeld in verordening (EG) nr. 798/2008.
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel6.7
  - number: '6.8'
    text: |-
      1 Een inrichting als bedoeld in [artikel 6.3, eerste lid, onderdeel e][ref1], wordt door de minister voor de
      toepassing van deze regeling erkend indien:

      a. een volledig ingevulde, ondertekende en gedagtekende aanvraag voor een erkenning bij de VWA is ingediend, en

      b. uit een door de keuringsdierenarts ingesteld onderzoek is gebleken dat:

      1) de inrichting voldoet aan de voorschriften, gesteld in de [bijlage van de Verordening productie van en handel
      in broedeieren en levend pluimvee 2003](onbekend) van het Produktschap voor Pluimvee en Eieren alsmede aan
      eventuele daarop betrekking hebbende uitvoeringsbesluiten welke krachtens artikel 9 van voornoemde verordening
      zijn vastgesteld;

      2) de ondernemer die de inrichting drijft op grond van
      [artikel 3, tweede lid, van de in onderdeel a, bedoelde verordening][ref2], bij het Produktschap voor
      Pluimvee en Eieren is geregistreerd op grond van artikel 2 van de Verordening identificatie en registratie van
      pluimveebedrijven, broedeieren en levend pluimvee (PPE) 2005;

      3) de ondernemer die de inrichting drijft een administratie voert waaruit de gegevens kunnen worden afgeleid die
      nodig zijn om de bevoegde dierenarts en de keuringsdierenarts in staat te stellen de gezondheidssituatie in de
      inrichting permanent te volgen;

      4) in de inrichting alleen pluimvee aanwezig is;

      5) gewaarborgd is, dat de keuringsdierenarts en de bevoegde dierenarts in verband met de door hen in het kader
      van [richtlijn 90/539/EEG](31990L0539) uit te oefenen taken, toegang tot de inrichting hebben en aan hen alle
      medewerking zal worden verleend en alle inlichtingen zullen worden verstrekt, die zij ter uitoefening van deze
      taken nodig achten.

      2 Een erkenning als bedoeld in het eerste lid wordt door de minister voor bepaalde tijd ingetrokken in de gevallen,
      bedoeld in bijlage II, hoofdstuk IV, punt I van [richtlijn 90/539/EEG](31990L0539).

      3 Een erkenning als bedoeld in het eerste lid wordt door de minister ingetrokken in de gevallen, bedoeld in bijlage
      II, hoofdstuk IV, punt 2 van de richtlijn.

      4 Een erkenning kan, nadat zij door de minister is ingetrokken, opnieuw worden verleend, onder de voorwaarden,
      bedoeld in bijlage II, hoofdstuk IV, punt 3 van de richtlijn.

      5 De minister kan tot het intrekken van de erkenning voor bepaalde tijd dan wel tot intrekking van de erkenning
      overgaan, in het geval bedoeld in bijlage II, hoofdstuk III, punt D, van [richtlijn 90/539/EEG](31990L0539).


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel6.3
      [ref2]: https://wetten.overheid.nl/BWBR0014954#Artikel2
