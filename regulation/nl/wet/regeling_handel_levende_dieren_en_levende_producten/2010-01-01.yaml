        artikel: '1.1'
        hoofdstuk: '1'
  - number: '5.2'
    text: |-
      1 Als bewijsstuk, bedoeld in [artikel 2.4, eerste lid, onderdeel a][ref1], wordt met het oog op het anders dan in
      doorvoer buiten Nederland brengen van paardachtigen, bestemd voor een lid-staat, vastgesteld:

      a. het identificatiedocument, vergezeld van de verklaring met betrekking tot de gezondheid, bedoeld in bijlage B
      van [richtlijn 90/426](31990L0426) indien het geregistreerde paarden betreft;

      b. het identificatiedocument vergezeld van het gezondheidscertificaat bedoeld in bijlage C van [richtlijn 90/426/
      EEG](31990L0426) indien het fok en gebruikspaarden betreft;

      c. het gezondheidscertificaat bedoeld in bijlage C van [richtlijn 90/426/EEG](31990L0426) indien het slachtpaarden
      betreft;

      2 Indien aan paardachtigen diergeneesmiddelen zijn toegediend die allyltrenbolon of ß-agonisten bevatten en de
      dieren binnen de wachttermijn worden verhandeld, zijn op de documenten bedoeld in het eerste lid, aard en datum van
      de behandeling vermeld.


