  - number: '9.5'
    text: |-
      1 Indien een partij die is verzonden vanuit een lid-staat en bestemd is voor Nederland of een lid-staat, gaat zij
      vergezeld van:

      a. het gezondheidscertificaat dat op grond van artikel 6, eerste lid, van [richtlijn 88/407/EEG](31988L0407) is
      voorgeschreven, indien het rundersperma betreft, met inachtneming van artikel 2, tweede lid, van [richtlijn nr.
      2003/43/EG](32003L0043);

      b. het gezondheidscertificaat dat op grond van artikel 6, eerste lid, van [richtlijn 90/429/EEG](31990L0429) is
      voorgeschreven, indien het varkenssperma betreft, of

      c. het gezondheidscertificaat dat op grond van artikel 11, tweede lid, vierde gedachtenstreepje, van [richtlijn
      92/65/EEG](31992L0065) is voorgeschreven indien het sperma van schapen, geiten en paardachtigen betreft.

      2 De partij voldoet aan bijlage VIII, hoofdstuk A, deel I, onder d, van [verordening (EG) nr. 999/2001]
      (32001R0999), indien het sperma van schapen of geiten betreft.
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel9.5
  - number: '9.6'
    text: |-
      1 De partij is verzonden vanuit een derde land of een deel van een derde land, dat is vermeld op de lijst:

      a. bedoeld in artikel 8, eerste lid, van [richtlijn 88/407/EEG](31988L0407), indien het rundersperma betreft;

      b. bedoeld in artikel 7, eerste lid, van [richtlijn 90/429/EEG](31990L0429), indien het varkenssperma betreft;

      c. . die voor sperma van paardachtigen is vastgesteld in bijlage I bij beschikking 2004/211/EG, met dien verstande
      dat sperma van paardachtigen ook mag zijn verzonden vanuit een land waaruit de definitieve invoer als bedoeld in
      artikel 4 van beschikking 2004/211/EG van geregistreerde paarden en fok- en gebruikspaarden is toegestaan, of

      d. bedoeld in artikel 17, tweede lid, onderdeel a, van [richtlijn 92/65/EEG](31992L0065), indien het sperma van
      schapen of geiten betreft, met dien verstande dat, indien vorenbedoelde lijst nog niet is vastgesteld, de partij
      uit geen enkel derde land mag zijn verzonden, indien zij voor Nederland is bestemd, en de partij is verzonden
      vanuit een derde land of een deel van een derde land, van waaruit de lid-staat van bestemming de invoer toestaat,
      indien zij voor een lid-staat is bestemd.

      2 De partij is afkomstig van een spermacentrum, een spermaopslagcentrum of een erkend centrum, erkende instelling,
      erkend instituut of erkend winstation dat is vermeld op de lijst, bedoeld in:

      a. artikel 9, eerste lid, van [richtlijn 88/407/EEG](31988L0407), indien het rundersperma betreft, met inachtneming
      van artikel 2, tweede lid, van [richtlijn nr. 2003/43/EG](32003L0043);

      b. artikel 8, eerste lid, van [richtlijn 90/429/EEG](31990L0429), indien het varkenssperma betreft, of

      c. artikel 17, derde lid, onderdeel b, van [richtlijn 92/65/EEG](31992L0065), indien het sperma van schapen, geiten
      of paardachtigen betreft.

      3 De partij gaat vergezeld van het gezondheidscertificaat dat op grond van:

      a. artikel 11 van richtlijn 88/407/EEG is voorgeschreven, indien het rundersperma betreft;

      b. artikel 10 van richtlijn 90/429/EEG is voorgeschreven, indien het varkenssperma betreft, of

      c. artikel 17, tweede lid, onderdeel b, van [richtlijn 92/65/EEG](31992L0065) is voorgeschreven, indien het sperma
      van schapen, geiten of paardachtigen betreft, dan wel, indien vorenbedoeld gezondheidscertificaat nog niet is
      vastgesteld, en:

        - de partij voor Nederland is bestemd, de partij vergezeld gaat van een certificaat dat een verklaring van de
      officiële dierenarts behelst dat het sperma verkregen, behandeld en opgeslagen is op een wijze die tenminste
      gelijkwaardig is aan hetgeen hieromtrent op grond artikel 11, tweede lid, eerste tot en met derde gedachtenstreepje
      van [richtlijn 92/65/EEG](31992L0065) geldt en dat voldaan is aan de voorschriften voor het brengen in Nederland
      van vorenbedoeld sperma uit derde landen op grond van [hoofdstuk 2][ref1] van de onderhavige regeling;
        - de partij voor een lid-staat is bestemd, de partij vergezeld gaat van het certificaat dat door de lid-staat van
      bestemming wordt geëist.

      4 De partij voldoet aan:

      a. de voorschriften die voor sperma van paardachtigen zijn vastgelegd in het gezondheidscertificaat, bedoeld in
      het derde lid, aanhef en onderdeel c, en aan de artikelen 4 en 7 van beschikking 2004/211/EG, indien het sperma van
      paardachtigen betreft, of

      b. bijlage IX, hoofdstuk H, van [verordening (EG) nr. 999/2001](32001R0999) indien het sperma van schapen of geiten
      betreft;

      c. de voorschriften, opgenomen in artikel 10 van richtlijn 88/407/EEG en in voorkomend geval in de krachtens dat
      artikel vastgestelde communautaire uitvoeringsmaatregelen, indien het rundersperma betreft;

      d. de voorschriften, opgenomen in artikel 9 van richtlijn 90/429/EEG en in voorkomend geval in de krachtens dat
      artikel vastgestelde communautaire uitvoeringsmaatregelen, indien het varkenssperma betreft.


