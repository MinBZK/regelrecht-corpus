  - number: '2.6'
    text: |-
      Runderen, varkens alsmede schapen en geiten zijn geïdentificeerd en geregistreerd overeenkomstig hetgeen
      hieromtrent in de [tweede afdeling van de hoofdstukken 3][ref1], [4][ref2] en [7][ref3] is gesteld,
      geregistreerde paarden en fok- en gebruikspaarden, bedoeld in [artikel 5.1][ref4], zijn geïdentificeerd
      overeenkomstig hetgeen hieromtrent in de [tweede afdeling van hoofdstuk 5][ref5] is gesteld, honden en katten
      zijn geïdentificeerd overeenkomstig hetgeen hieromtrent in de [tweede afdeling van hoofdstuk 8][ref6] is gesteld
      en de overige dieren zijn geïdentificeerd en geregistreerd overeenkomstig artikel 3, eerste lid, onderdeel c, van
      [richtlijn 90/425/EEG](31990L0425).


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0007049#Hoofdstuk4
