  - number: '6.5'
    text: |-
      1 Op grond van het onderzoek, bedoeld in [artikel 2.5][ref1], is gebleken dat, indien het een partij van minder dan
      20 stuks betreft voldaan wordt aan [artikel 6.3, eerste lid, onderdelen h en i][ref2] en tweede lid en aan artikel
      11, tweede lid, van [richtlijn 90/539/EEG](31990L0539).

      2 Het eerste lid is niet van toepassing op loopvogels of broedeieren daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0007049#Artikel6.3
