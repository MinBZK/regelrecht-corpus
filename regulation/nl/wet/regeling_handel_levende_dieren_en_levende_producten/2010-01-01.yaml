        bwb_id: BWBR0007049
        artikel: '1.1'
        hoofdstuk: '1'
  - number: '8.2'
    text: |-
      Als bewijsstuk, bedoeld in [artikel 2.4, onderdeel a][ref1], wordt met het oog op het anders dan in doorvoer buiten
      Nederland brengen van apen, hoefdieren, bijen, honden, katten, fretten en lagomorfen bestemd voor een lid-staat
      vastgesteld:

      a. het certificaat dat op grond van artikel 5, eerste lid, van [richtlijn 92/65/EEG](31992L0065) is voorgeschreven,
      indien het apen betreft;

      b. het certificaat dat op grond van artikel 6, onderdeel A, eerste lid, onderdeel e, van [richtlijn 92/65/EEG]
      (31992L0065) is voorgeschreven, indien het hoefdieren betreft;

      c. het gezondheidscertificaat dat op grond van artikel 8, onderdeel b, van [richtlijn 92/65/EEG](31992L0065) is
      voorgeschreven, indien het bijen betreft;

      d. het gezondheidscertificaat dat op grond van artikel 9, tweede lid, van [richtlijn 92/65/EEG](31992L0065) is
      voorgeschreven, indien het lagomorfen betreft, of;

      e. het paspoort en het certificaat, bedoeld in artikel 10, tweede lid, van [richtlijn 92/65/EEG](31992L0065),
      indien:

      1°. het fretten betreft;

      2°. het honden of katten betreft, bestemd voor andere lidstaten dan het Verenigd Koninkrijk, Ierland, Malta of
      Zweden;

      f. het paspoort en het certificaat, bedoeld in artikel 10, derde lid, van [richtlijn 92/65/EEG](31992L0065), indien
      het honden of katten betreft, bestemd voor het Verenigd Koninkrijk, Ierland, Malta of Zweden.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0007049
        artikel: '2.4'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: '8.3'
    text: |-
      1 Op grond van het onderzoek, bedoeld in [artikel 2.5][ref1], is gebleken dat:

      a. indien honden, katten, fretten en lagomorfen afkomstig zijn van een handelszaak die permanent of incidenteel
      deze dieren in zijn bezit heeft, deze handelszaak is geregistreerd overeenkomstig [artikel 8.7][ref2], en

      b. de apen, hoefdieren, bijen, honden, katten, fretten en lagomorfen afkomstig zijn van bedrijven of, indien
      het honden, katten en lagomorfen betreft, van handelszaken die voldoen aan artikel 4 van [richtlijn 92/65/EEG]
      (31992L0065).

      2 Onverminderd het eerste lid, is op grond van het onderzoek, bedoeld in [artikel 2.5][ref3], gebleken, dat:

      a. indien het apen betreft, deze afkomstig zijn van een instelling, instituut of centrum dat is erkend
      overeenkomstig [artikel 8.6][ref4] en bestemd zijn voor een door de bevoegde autoriteit van de lid-staat van
      bestemming overeenkomstig bijlage C van [richtlijn 92/65/EEG](31992L0065) erkende instelling, erkend instituut of
      erkend centrum en dat, in voorkomend geval, voldaan is aan de algemene of beperkte aanvullende garanties, bedoeld
      in artikel 14, tweede lid, en artikel 15, tweede lid, van [richtlijn 92/65/EEG](31992L0065);

      b. indien het hoefdieren betreft:

      1. de hoefdieren niet in het kader van een programma voor de uitroeiïng van een besmettelijke dierziekte dienen te
      worden geruimd;

      2. de hoefdieren niet zijn ingeënt tegen mond- en klauwzeer en, in voorkomend geval, voldoen aan de voorschriften
      die ter bestrijding van mond- en klauwzeer gelden;

      3. de hoefdieren afkomstig zijn van een bedrijf als bedoeld in artikel 3, tweede lid, onderdelen b en c, van
      [richtlijn 64/432/EEG](31964L0432), ten aanzien waarvan geen veterinairrechtelijke maatregelen ter uitvoering van
      [richtlijn nr. 2003/85/EG](32003L0085) van de Raad van de Europese Unie van 29 september 2003 tot vaststelling
      van communautaire maatregelen voor de bestrijding van mond- en klauwzeer, tot intrekking van [Richtlijn 85/511/
      EEG](31985L0511) en van de Beschikkingen 89/531/EEG en 91/665/EEG, en tot wijziging van [Richtlijn 92/46/
      EEG](31992L0046) (PbEG L 306), [Richtlijn 2001/89/EG](32001L0089) van de Raad van 23 oktober 2001 betreffende
      maatregelen van de Gemeenschap ter bestrijding van klassieke varkenspest (PbEG L 316/5) of [richtlijn 91/68/
      EEG](31991L0068) van de Raad van de Europese Gemeenschappen van 28 januari 1991 inzake veterinairrechtelijke
      voorschriften voor het intracommunautaire handelsverkeer in schapen en geiten (PbEG L 46) gelden, en waar
      deze dieren vanaf hun geboorte of gedurende de laatste 30 dagen voorafgaand aan de verzending permanent hebben
      verbleven;

      4. indien hoefdieren vanuit een derde land, al dan niet via het grondgebied van een lid-staat, in Nederland zijn
      gebracht:

        - deze afkomstig zijn uit een derde land of een deel van een derde land, dat voor de betrokken diersoort is vermeld
      op de lijst van deel 1 van bijlage 1 bij beschikking 79/542/EEG, met dien verstande dat, voor zover het niet-
      gedomesticeerde dieren betreft als bedoeld in artikel 1, tweede alinea, van beschikking 79/542/EEG, zij afkomstig
      zijn uit een derde land of een deel van een derde land van waaruit de lidstaat van bestemming de invoer toestaat;
        - deze afkomstig zijn van een officieel tuberculosevrij en een officieel brucellosevrij of een brucellosevrij
      beslag als bedoeld in artikel 2 van [richtlijn 64/432/EEG](31964L0432) van de Raad van de Europese Gemeenschappen
      van 26 juni 1964 inzake veterinairrechtelijke vraagstukken op het gebied van het intracommunautaire handelverkeer
      in runderen en varkens (PbEG L 121) of in artikel 2 van [richtlijn 91/68/EEG](31991L0068) van de Raad van de
      Europese Gemeenschappen van 28 januari 1991 inzake veterinairrechtelijke voorschriften voor het intracommunautaire
      handelsverkeer in schapen en geiten (PbEG L 46) en dat is voldaan aan artikel 3, tweede lid, onderdelen c, d, f,
      g en h van [richtlijn 64/432/EEG](31964L0432) van de Raad van de Europese Gemeenschappen van 26 juni 1964 inzake
      veterinairrechtelijke vraagstukken op het gebied van het intracommunautaire handelsverkeer in runderen en varkens
      (PbEG L 121) of aan de [artikelen 7.3][ref5] en [7.4 van hoofdstuk 7][ref6] van deze regeling;
        - deze, indien zij niet afkomstig zijn van een beslag als bedoeld in het eerste gedachtenstreepje, afkomstig zijn
      van een bedrijf waar gedurende de laatste 42 dagen voorafgaande aan de verzending van de dieren geen enkel geval
      van brucellose en tuberculose is geconstateerd en waar de herkauwers gedurende de laatste 30 dagen voorafgaande aan
      de verzending van de dieren negatief hebben gereageerd op een brucellose- en tuberculosetest conform de, voor zover
      van toepassing, krachtens artikel 6, onderdeel A, vierde lid, vastgestelde testvoorschriften en criteria dan wel,
      bij gebreke daaraan, de daarvoor geldende nationale voorschriften;
        - in voorkomend geval, voldaan is aan de algemene of beperkte aanvullende garanties, bedoeld in artikel 14, tweede
      lid, en artikel 15, tweede lid, van [richtlijn 92/65/EEG](31992L0065), of indien het hoefdieren, tevens zijnde
      suidae betreft, is gebleken dat:
        - voldaan is aan artikel 6, onder A, derde lid, van [richtlijn 92/65/EEG](31992L0065), met dien verstande dat
      de relevante veterinairrechtelijke eisen voor varkens van [richtlijn 64/432/EEG](31964L0432) van de Raad van
      de Europese Gemeenschappen van 26 juni 1964 inzake veterinairrechtelijke vraagstukken op het gebied van het
      intracommunautaire handelverkeer in runderen en varkens (PbEG L 121) als bedoeld in artikel 6, onder A, derde lid,
      onderdeel c, de voorschriften zijn zoals neergelegd in de [artikelen 4.3][ref7] en [4.4 van hoofdstuk 4][ref8] van
      deze regeling;

      c. indien het bijen betreft, deze niet afkomstig zijn uit:

        - een gebied waarbinnen bestrijdingsmaatregelen vanwege amerikaans vuilbroed gelden;
        - een gebied waarbinnen 30 dagen of korter geleden, voorafgaand aan de dag van afgifte van het
      gezondheidscertificaat, bedoeld in [artikel 8.2, onderdeel c][ref9], dergelijke bestrijdingsmaatregelen van kracht
      zijn geweest, en, in voorkomend geval, is voldaan aan de algemene of beperkte aanvullende garanties, bedoeld in
      artikel 14, tweede lid, en artikel 15, tweede lid, van [richtlijn 92/65/EEG](31992L0065);

      d. indien het lagomorfen betreft, voldaan is aan artikel 9, eerste lid, van [richtlijn 92/65/EEG](31992L0065),
      en, in voorkomend geval aan de algemene of beperkte aanvullende garanties, bedoeld in artikel 14, tweede lid, en
      artikel 15, tweede lid, van [richtlijn 92/65/EEG](31992L0065), met dien verstande dat tevens voldaan is aan artikel
      9, derde lid, van [richtlijn 92/65/EEG](31992L0065), indien de lagomorfen voor Ierland of het Verenigd Koninkrijk
      zijn bestemd en door deze lid-staten de verklaring als bedoeld in dat artikellid wordt verlangd;

      e. indien het fretten betreft voldaan is aan artikel 10, tweede lid, van [richtlijn 92/65/EEG](31992L0065);

      f. indien het honden of katten betreft, bestemd voor een andere lidstaat dan het Verenigd Koninkrijk, Ierland,
      Malta of Zweden, voldaan is aan artikel 10, tweede lid, van [richtlijn 92/65/EEG](31992L0065);

      g. indien het honden of katten betreft, bestemd voor het Verenigd Koninkrijk, Ierland, Malta of Zweden, voldaan is
      aan artikel 10, derde lid, van [richtlijn 92/65/EEG](31992L0065).


