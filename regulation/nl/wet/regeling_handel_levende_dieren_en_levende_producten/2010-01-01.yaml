  - number: '10.1'
    text: |-
      Onverminderd [artikel 1.1.][ref1] wordt in dit hoofdstuk verstaan onder:




              *richtlijn 89/556/EEG:*


              richtlijn van de Raad van de Europese Gemeenschappen van 25 september 1989 tot vaststelling van
      veterinairrechtelijke voorschriften voor het intracommunautaire handelsverkeer in embryo's van als huisdier
      gehouden runderen en de invoer daarvan uit derde landen (PbEG L 302);




              *runderembryo:*


              eerste ontwikkelingsstadium van een als huisdier gehouden rund, dat geschikt is voor transplantatie naar
      een ontvangerdier, dat niet is verkregen door transfer van celkernen en dat, voor-zover afkomstig uit lid-staten na
      31 december 1990 is verzameld, behandeld en opgeslagen;




              *embryo van varkens, schapen, geiten of paardachtigen:*


              eerste ontwikkelingsstadium van als huisdier gehouden varkens, schapen, geiten of paardachtigen, dat
      geschikt is voor transplantatie naar een ontvangerdier en dat niet is verkregen door transfer van celkernen;




              *teamdierenarts:*


              dierenarts die overeenkomstig bijlage A van [richtlijn 89/556/EEG](31989L0556) verantwoordelijk is voor het
      toezicht op een runderembryoteam;




              *runderembryoteam:*


              overeenkomstig [artikel 10.9][ref2] erkende groep technici of organisatievorm onder toezicht van een
      teamdierenarts, bevoegd om runderembryo's te verzamelen, te behandelen of op te slaan;




              *runderembryo-produktieteam:*


              runderembryoteam, erkend overeenkomstig [artikel 10.9][ref3] voor de bevruchting in vitro;




              *embryoteam:*


              overeenkomstig [artikel 10.11][ref4] erkende groep technici of organisatievorm, bevoegd om embryo's van
      schapen, geiten, varkens of paardachtigen te verzamelen, te behandelen of op te slaan;




              *instelling, instituut of centrum:*


              instelling, instituut of centrum als bedoeld in artikel 2, eerste lid, onderdeel c, van [richtlijn 92/65/
      EEG](31992L0065).


