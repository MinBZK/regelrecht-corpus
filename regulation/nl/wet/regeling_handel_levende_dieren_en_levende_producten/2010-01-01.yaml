  - number: '2.59'
    text: |-
      Er wordt voldaan aan de [artikelen 2.44 tot en met 2.50f][ref1], met dien verstande dat:

        - de staten, niet zijnde lid-staten, die partij zijn bij het EER-Verdrag voor de toepassing van deze artikelen
      worden aangemerkt als derde landen;
        - het certificaat, bedoeld in [artikel 2.44, derde lid, onderdeel a][ref2], het certificaat of document, genoemd
      in de [derde afdeling van hoofdstuk 6][ref3], de [derde][ref4] of [vierde afdeling van de hoofdstukken 9][ref5] en
      [10][ref6] dan wel de [vierde afdeling van hoofdstuk 11][ref7] is;
        - het originele document, bedoeld in [artikel 2.44, derde lid, onderdeel a][ref8], [artikel 2.45][ref9],
      [artikel 2.47][ref10] en [artikel 2.49, derde lid][ref11], het document, genoemd in
      [artikel 2.58, onderdeel b][ref12], is;
        - de zoötechnische documenten, bedoeld in [artikel 2.44, derde lid, onderdeel b][ref13], de zoötechnische
      documenten zijn die bij of krachtens het [Fokkerijbesluit][ref14] zijn voorgeschreven voor het brengen in Nederland
      van producten van raszuivere dieren en hybride varkens, die zijn verzonden vanuit een lid-staat, dan wel indien
      het sperma van schapen, geiten of paardachtigen, embryo's van varkens, schapen, geiten of paardachtigen dan wel
      eicellen betreft, de zoötechnische documenten die bij of krachtens het [Fokkerijbesluit][ref15] zijn voorgeschreven
      voor het brengen in Nederland van producten van raszuivere dieren die via Nederland voor het eerst in de gebieden
      waarop het Verdrag betreffende de Europese Unie van toepassing is worden gebracht, en
        - bij aankomst op de inspectiepost, slechts op verzoek van de keuringsdierenarts de producten aan hem ten
      onderzoek worden aangeboden en het in het tweede gedachtenstreepje bedoelde certificaat of document, het in
      [artikel 2.58, onderdeel b][ref16], genoemde document alsmede de in het vierde gedachtenstreepje bedoelde
      zoötechnische documenten aan hem worden overgelegd.


