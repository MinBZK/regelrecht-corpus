  - number: '2.42'
    text: |-
      1 Indien wordt vermoed of geconstateerd dat er verwekkers van ziekten, zoönosen, of andere aandoeningen, bedoeld in
      artikel 8, eerste lid, onderdeel a, van [richtlijn 90/425/EEG](31990L0425), aanwezig zijn, kan de minister, indien
      hij de aanwezigheid van verwekkers van ziekten, zoönosen of andere aandoeningen vermoedt, gelasten dat de dieren
      in tijdelijke afzondering worden geplaatst, dan wel worden de dieren gedood of vernietigd, al naar gelang hetgeen
      de keuringsdierenarts daaromtrent heeft besloten, met inachtneming van diens aanwijzingen, zonder vergoeding van
      Staatswege en voor rekening van de importeur of diens gemachtigde.

      2 Indien wordt vermoed of geconstateerd dat niet is voldaan aan de overige voorschriften van de onderhavige
      regeling of dat de dieren afkomstig zijn uit een met een epidemische dierziekte besmet gebied, worden de dieren,
      zonder vergoeding van Staatswege en voor rekening van de importeur of diens gemachtigde, al naar gelang de minister
      daaromtrent heeft besloten en met inachtneming van de aanwijzingen van de keuringsdierenarts:

      a. ondergebracht, gevoerd, gedrenkt en verzorgd;

      b. in tijdelijke afzondering geplaatst;

      c. doorgestuurd naar een derde land;

      d. geslacht, dan wel

      e. gedood en vernietigd.
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel2.42
  - number: '2.43'
    text: |-
      1 Het verbod, bedoeld in [artikel 2.1, tweede lid, derde gedachtenstreepje][ref1], geldt, niet ter zake van het
      brengen in Nederland van producten die via Nederland voor het eerst in de gebieden waarop het Verdrag betreffende
      de Europese Unie van toepassing is worden gebracht en zijn verzonden vanuit een derde land of een deel van een
      derde land, mits wordt voldaan aan, voor zover van toepassing, de [artikelen 2.44 tot en met 2.50b][ref2] en:

      a. voor zover de producten bestemd zijn voor Nederland of een lid-staat:

        - [afdeling 4 van hoofdstuk 6][ref3], indien het broedeieren betreft;
        - [afdeling 4 van hoofdstuk 9][ref4], indien het sperma betreft;
        - [afdeling 4 van hoofdstuk 10][ref5], indien het embryo's betreft;
        - [afdeling 4 van hoofdstuk 11][ref6], indien het eicellen betreft;

      b. voor zover de producten bestemd zijn voor een derde land, de betrokken partij vergezeld gaat van een bij die
      partij behorend origineel document, dat is gesteld in de Nederlandse, Duitse, Franse of Engelse taal, waaruit
      tenminste de oorsprong van de partij alsmede de bestemming hiervan kan worden afgeleid.

      2 Het verbod, bedoeld in [artikel 2.1, tweede lid, derde gedachtenstreepje][ref7], geldt niet terzake van het via
      Nederland in de Europese Gemeenschap binnenbrengen van producten die door een derde land zijn geweigerd en vanuit
      het grondgebied van de Europese Gemeenschap naar het betrokken land zijn verzonden, mits:

      a. wordt voldaan aan de [artikelen 2.44, eerste, tweede, vijfde en achtste lid][ref8], [2.45a][ref9],
      [2.46, eerste lid][ref10], [2.49, eerste, tweede en vijfde lid][ref11], alsmede aan artikel 15, eerste lid,
      onderdeel a, van [richtlijn 97/78/EG](31997L0078), en

      b. indien de producten naar het betrokken derde land zijn verzonden vanuit een lid-staat, de in minister vooraf
      toestemming heeft verleend voor het binnenbrengen van de producten en de bevoegde autoriteit van de lid-staat
      die het in artikel 15, eerste lid, onderdeel a, van [richtlijn 97/78/EG](31997L0078) bedoelde certificaat heeft
      afgegeven met terugname van de partij in de lid-staat instemt.


