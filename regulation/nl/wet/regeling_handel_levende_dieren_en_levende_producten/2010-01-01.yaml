  - number: '5.6'
    text: Geregistreerde paarden en fok- en gebruikspaarden zijn geïdentificeerd door middel van het identificatiedocument.
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel5.6
  - number: '5.7'
    text: |-
      1 Indien een partij die is verzonden vanuit een lid-staat en bestemd is voor Nederland of een lid-staat, gaat zij
      vergezeld van:

      a. het identificatiedocument, vergezeld van de verklaring met betrekking tot de gezondheid, bedoeld in bijlage B
      van [richtlijn 90/426](31990L0426) indien het geregistreerde paarden betreft;

      b. het identificatiedocument vergezeld van het gezondheidscertificaat bedoeld in bijlage C van [richtlijn 90/426/
      EEG](31990L0426) indien het fok en gebruikspaarden betreft;

      c. het gezondheidscertificaat bedoeld in bijlage C van [richtlijn 90/426/EEG](31990L0426) indien het slachtpaarden
      betreft.

      2 Indien aan de partij diergeneesmiddelen zijn toegediend die allyltrenbolon of ß-agonisten bevatten en de partij
      binnen de wachttermijn wordt verhandeld, zijn op de documenten bedoeld in het eerste lid, aard en datum van de
      behandeling vermeld.
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel5.7
  - number: '5.8'
    text: |-
      1 De partij paardachtigen is afkomstig uit een derde land of een deel van een derde land dat voorkomt op een
      krachtens artikel 12, eerste lid, van [richtlijn 90/426/EEG](31990L0426) vastgestelde lijst en voldoet, voor zover
      van toepassing, aan de voor dat land krachtens artikel 12, vierde lid, van [richtlijn 90/426/EEG](31990L0426)
      vastgestelde speciale invoervoorwaarden.

      2 De partij paardachtigen voldoet, voor zover van toepassing, aan de krachtens artikel 12, derde lid, van
      [richtlijn 90/426/EEG](31990L0426) voor diergezondheidsdoeleinden vastgestelde lijsten en gaat vergezeld van een
      gezondheidscertificaat als bedoeld in artikel 12, derde lid, van [richtlijn 90/426/EEG](31990L0426).

      3 De partij paardachtigen gaat vergezeld van een certificaat als bedoeld in artikel 16 van [richtlijn 90/426/EEG]
      (31990L0426), met dien verstande dat, indien de partij bestemd is voor Zweden, uit het certificaat blijkt dat is
      voldaan aan de voorschriften die Zweden stelt met betrekking tot de invoer van dieren uit landen die tegen mond- en
      klauwzeer inenten.

      4 Aan de partij paardachtigen zijn geen stoffen toegediend die ingevolge artikel 3, onderdeel a, van [richtlijn
      96/22/EG](31996L0022) niet aan paardachtigen mogen worden toegediend, tenzij aan de voorwaarden ingevolge artikel
      11 van genoemde richtlijn is voldaan. Indien aan de partij diergeneesmiddelen zijn toegediend die allyltrenbolon of
      [bèta]-agonisten bevatten, en de partij binnen de wachttermijn wordt verhandeld, zijn op de documenten, bedoeld in
      het derde lid, aard en datum van de behandeling vermeld.

      5 De partij paardachtigen voldoet, voor zover van toepassing, aan de bijzondere voorwaarden, gesteld
      in een krachtens artikel 19, onderdeel i of ii, van richtlijn nr. 90/426/EEG vastgestelde communautaire
      uitvoeringsmaatregel.
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel5.8
  - number: '5.10'
    text: |-
      In Nederland gebrachte slachtpaarden, bestemd voor Nederland, worden rechtstreeks vervoerd naar en geslacht in
      een slachthuis.
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel5.10
  - number: '6.1'
    text: |-
      Onverminderd [artikel 1.1][ref1] wordt in dit hoofdstuk verstaan onder:




              *richtlijn 90/539/EEG:*


              richtlijn van de Raad van de Europese Gemeenschappen van 15 oktober 1990 tot vaststelling van
      veterinairrechtelijke voorschriften voor het intracommunautaire handelsverkeer en de invoer uit derde landen van
      pluimvee en broedeieren (PbEG L 303);




              *dierenarts:*


              degene die krachtens de Wet op het wetenschappelijk onderwijs de hoedanigheid van dierenarts heeft
      verkregen;



            bevoegde dierenarts:

              dierenarts die door de Minister is belast met het uitvoeren van een aantal uit [richtlijn 90/539/EEG]
      (31990L0539) voortvloeiende taken;




              *eendagskuikens:*


              pluimvee dat nog geen 72 uur oud is en dat, met uitzondering van muskuseenden (Cairina moschata) of
      kruisingen daarvan, nog niet is gevoerd;




              *fokpluimvee:*


              pluimvee van 72 uur en ouder, bestemd voor de produktie van broedeieren;




              *gebruikspluimvee:*


              pluimvee van 72 uur en ouder, bestemd om te worden opgefokt voor de produktie van vlees of van voor
      consumptie bestemde eieren of om in het wild te worden uitgezet;




              *slachtpluimvee:*


              pluimvee dat rechtstreeks naar het slachthuis wordt gevoerd om daar zo snel mogelijk, doch uiterlijk 72 uur
      na aankomst, te worden geslacht;




              *inrichting:*


              voorziening of deel van een voorziening die, onderscheidenlijk dat, zich:
              indien behorend tot een fokbedrijf, toelegt op de produktie van broedeieren, bestemd voor de produktie
      van fokpluimvee;
      indien behorend tot het vermeerderingsbedrijf, toelegt op de produktie van broedeieren, bestemd voor de produktie
      van gebruikspluimvee;
      indien behorend tot het opfokbedrijf voor fokpluimvee, toelegt op het opfokken van fokpluimvee tot het
      voortplantingsstadium en indien behorend tot het opfokbedrijf voor legpluimvee, toelegt op het opfokken van
      legkippen tot het legstadium;
      indien behorend tot de kuikenbroederij, toelegt op het inleggen en uitbroeden van broedeieren en het afleveren
      van eendagskuikens;




              *beschikking 2003/644/EG:*


              beschikking (EG) nr. 2003/644 van de Commissie van de Europese Gemeenschappen van 8 september 2003 (PbEU
      L 228) tot vaststelling van aanvullende garanties ten aanzien van Salmonellae voor de verzending naar Finland en
      Zweden van vermeerderingspluimvee en van voor vermeerderings- of voor gebruikskoppels bestemde eendagskuikens.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel6.1
    references:
