        paragraaf: '1'
        afdeling: '4'
  - number: '4.9'
    text: |-
      In Nederland gebrachte slachtvarkens, bestemd voor Nederland, worden rechtstreeks vervoerd naar en geslacht in
      een slachthuis.
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel4.9
  - number: '4.10'
    text: |-
      Een handelaar wordt door de minister slechts erkend indien voldaan wordt aan artikel 13, eerste lid, onderdelen a
      en b van [richtlijn 64/432/EEG](31964L0432).
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel4.10
  - number: '5.1'
    text: |-
      Onverminderd [artikel 1.1][ref1], wordt in dit hoofdstuk verstaan onder:




              *richtlijn 90/426/EEG:*


              richtlijn van de Raad van de Europese Gemeenschappen van 26 juni 1990 tot vaststelling van
      veterinairrechtelijke voorschriften voor het verkeer van paardachtigen en de invoer van paardachtigen uit derde
      landen (PbEG L 224);




              *richtlijn 90/427/EEG:*


              richtlijn van de Raad van de Europese Gemeenschappen van 26 juni 1990 tot vaststelling van zoötechnische en
      genealogische voorschriften voor het intracommunautaire handelsverkeer in paardachtigen (PbEG L 224);




              *beschikking 93/623/EEG:*


              beschikking (EEG) nr. 93/623 van de Commissie van de Europese Gemeenschappen van 20 oktober 1993 (PbEG
      1993, L 298) tot vaststelling van het identificatiedocument (paspoort) dat geregistreerde paardachtigen moet
      vergezellen;



            beschikking 2000/68/EG:

              beschikking (EG) nr. 2000/68 van de Commissie van de Europese Gemeenschappen van 22 december 1999 (PbEG
      2000, L 23) houdende wijziging van Beschikking 93/623/EEG en tot vaststelling van de identificatievoorschriften
      voor als fok- en gebruiksdier gehouden paardachtigen;




              *identificatiedocument:*


              document als bedoeld in beschikking 93/623/EEG en beschikking 2000/68/EG ten behoeve van de identificatie
      van respectievelijk geregistreerde paarden en fok- en gebruikspaarden, dat is afgegeven door het bestuur van het
      Productschap Vee en Vlees op grond van artikel 6 van de Verordening identificatie en registratie paardachtigen
      (PVV) 2004.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel5.1
    references:
