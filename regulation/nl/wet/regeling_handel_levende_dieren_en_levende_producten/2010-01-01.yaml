  - number: '11.3'
    text: |-
      Op grond van het onderzoek, bedoeld in [artikel 2.5][ref1], is gebleken dat:

      a. de eicellen verkregen zijn door een erkend team bij vrouwelijke donordieren die voldoen aan bijlage D, hoofdstuk
      IV, van [richtlijn 92/65/EEG](31992L0065) en vervolgens in een aangepast laboratorium zijn behandeld;

      b. de eicellen zijn behandeld en opgeslagen overeenkomstig bijlage D, hoofdstuk III, van [richtlijn 92/65/EEG]
      (31992L0065);

      c. het voor de inseminatie van de in onderdeel a bedoelde vrouwelijke donordieren gebruikte sperma voldoet aan
      [artikel 9.3, onderdeel c][ref2], en [artikel 9.4, onderdeel c][ref3], en

      d. artikel 2, derde lid, van verordening (EG) 546/2006, indien het eicellen van schapen of geiten betreft die
      worden verzonden naar een in de bijlage bij die verordening genoemde lidstaat.


