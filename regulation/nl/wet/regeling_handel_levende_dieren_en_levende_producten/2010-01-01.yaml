  - number: '9.8'
    text: |-
      1 Sperma van schapen, geiten of paardachtigen als bedoeld in artikel 13, eerste lid, van [richtlijn 92/65/EEG]
      (31992L0065) gaat vergezeld van het in artikel 13, eerste lid, van [richtlijn 92/65/EEG](31992L0065) bedoelde
      vervoersdocument, dan wel, indien het sperma is verzonden vanuit een derde land en via het grondgebied van een
      lid-staat in Nederland wordt gebracht van de documenten, bedoeld in artikel 10, eerste lid, eerste en tweede
      gedachtenstreepje, van [richtlijn 90/675/EEG](31990L0675).

      2 De documenten, bedoeld in het eerste lid, zijn opgesteld en afgegeven in overeenstemming met de regelgeving van
      de Raad van de Europese Unie of de Commissie van de Europese Gemeenschappen, volledig ingevuld, gedagtekend en
      ondertekend, terwijl de geldigheidsduur ervan niet is verstreken.
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel9.8
  - number: '9.9'
    text: |-
      1 Onverminderd [artikel 2.32][ref1] worden, indien rundersperma of varkenssperma bestemd is voor Nederland dan
      wel een lid-staat en ervan wordt verdacht te zijn aangetast door of te zijn besmet met ziektekiemen, teneinde met
      zekerheid vast te stellen of het verdachte sperma al dan niet is aangetast door of besmet met ziektekiemen, door de
      minister de nodige maatregelen genomen die afzondering van het sperma kunnen inhouden.

      2 In het in het eerste lid bedoelde geval staat de minister, voor zover daartegen uit oogpunt van de diergezondheid
      geen bezwaren bestaan, op verzoek van de afzender of diens gemachtigde, toe, dat het sperma wordt teruggezonden,
      met dien verstande dat voor zover het rundersperma of diepgevroren varkenssperma betreft betreft binnen 30 dagen
      en indien het vers varkenssperma betreft binnen 24 uur na het betreffende besluit dient te blijken dat de bevoegde
      instantie van het land van verzending de terugzending toestaat.

      3 Het sperma dient gedurende de in het tweede lid bedoelde periode op een door de minister te bepalen wijze te
      worden opgeslagen.

      4 Indien de terugzending van het sperma niet binnen de in het tweede lid bedoelde tijdsduur wordt toegestaan,
      wordt, indien de minister hiertoe besluit het sperma vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.32
