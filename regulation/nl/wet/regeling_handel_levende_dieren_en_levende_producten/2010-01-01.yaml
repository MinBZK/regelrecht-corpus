  - number: '2.46'
    text: |-
      1 Met betrekking tot de partij is door de minister een certificaat afgegeven als bedoeld in artikel 5, eerste lid,
      van [richtlijn 97/78/EG](31997L0078).

      2 Onverminderd het eerste lid is met betrekking tot de voor Nederland of een lidstaat bestemde partij door de
      minister een gewaarmerkt afschrift als bedoeld in artikel 7, vierde lid, van [richtlijn 97/78/EG](31997L0078),
      afgegeven.

      3 Indien de partij in de inspectiepost in meerdere delen is gesplitst, geldt het eerste lid voor elk van de
      deelpartijen.
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel2.46
  - number: '2.47'
    text: |-
      1 Terzake van een partij producten die zich aan boord bevindt van een vliegtuig of schip dat bij vervoer tussen
      twee derde landen op Nederlands grondgebied landt of aanlegt, overlegt de belanghebbende bij de lading aan de
      keuringsdierenarts, desgevraagd het originele document, bedoeld in [artikel 2.43, eerste lid, onderdeel b][ref1].

      2 Indien de in het eerste lid bedoelde partij van het ene vliegtuig of schip in het andere wordt overgeladen,
      stelt de belanghebbende bij de lading de keuringsdierenarts hiervan in kennis en overlegt hij hem desgevraagd het
      originele document, bedoeld in [artikel 2.43, eerste lid, onderdeel b][ref2].

      3 In de in het eerste en tweede lid bedoelde gevallen gaat de desbetreffende partij bij verzending naar het derde
      land vergezeld van het originele document, bedoeld in [artikel 2.43, eerste lid, onderdeel b][ref3].


