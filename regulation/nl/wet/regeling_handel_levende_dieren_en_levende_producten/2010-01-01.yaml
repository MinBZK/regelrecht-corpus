  - number: '10.4'
    text: |-
      1 Op grond van het onderzoek, bedoeld in [artikel 2.5][ref1], is gebleken dat, indien het een partij embryo's van
      varkens, schapen, geiten of paardachtigen betreft:

      a. de embryo's verkregen zijn door een embryoteam bij vrouwelijke donordieren die voldoen aan bijlage D, hoofdstuk
      IV, van [richtlijn 92/65/EEG](31992L0065) en vervolgens in een aangepast laboratorium zijn behandeld;

      b. de embryo's zijn behandeld en opgeslagen overeenkomstig bijlage D, hoofdstuk III, van [richtlijn 92/65/EEG]
      (31992L0065), en

      c. het voor de inseminatie van de in onderdeel a bedoelde vrouwelijke donordieren gebruikte sperma voldoet aan
      [artikel 9.3, onderdeel c][ref2], en [artikel 9.4, onderdeel c][ref3].

      2 Onverminderd het eerste lid is op grond van het onderzoek, bedoeld in [artikel 2.5][ref4], gebleken dat de partij
      embryo’s voldoet aan bijlage VIII, hoofdstuk A, deel I, punt d, van [verordening (EG) nr. 999/2001](32001R0999)
      indien het embryo’s van schapen of geiten betreffen artikel 2, derde lid, van verordening (EG) 546/2006, indien
      het embryo’s van schapen of geiten betreft die worden verzonden naar een in de bijlage bij die verordening genoemde
      lidstaat.


