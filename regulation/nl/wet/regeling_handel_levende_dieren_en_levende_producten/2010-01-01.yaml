    text: |-
      1 Indien het vogels betreft, bestemd voor een lid-staat, geldt dat:

      a. de vogels afkomstig zijn van een bedrijf waar gedurende de laatste 30 dagen voorafgaande aan de verzending geen
      aviaire influenza is gediagnosticeerd;

      b. de vogels afkomstig zijn van een bedrijf of uit een gebied ten aanzien waarvan geen beperkingen gelden uit
      hoofde van de maatregelen ter bestrijding van de ziekte van Newcastle;

      c. indien het vogels betreft die vanuit een derde land, al dan niet via het grondgebied van een lid-staat, in
      Nederland zijn gebracht, de vogels overeenkomstig artikel 10, eerste lid, derde gedachtenstreepje, van [richtlijn
      91/496/EEG](31991L0496) en met inachtneming van de bijzondere waarborgen, bedoeld in artikel 10, eerste lid, tweede
      alinea, van [richtlijn 91/496/EEG](31991L0496), in tijdelijke afzondering zijn geplaatst op het bedrijf waar zij na
      toelating in de gebieden waarop het Verdrag betreffende de Europese Unie van toepassing is, zijn binnengebracht.

      2 Onverminderd het eerste lid, geldt indien het papegaaiachtigen betreft, bovendien dat:

      a. de papegaaiachtigen niet afkomstig zijn van een bedrijf of in contact zijn geweest met dieren van een bedrijf
      waar op het tijdstip van verzending psittacose (Chlamydia psittaci) is gediagnosticeerd;

      b. de papegaaiachtigen niet afkomstig zijn van een bedrijf of in contact zijn geweest met dieren van een bedrijf
      waar in een periode van twee maanden voorafgaand aan het tijdstip van verzending het laatste geval van psittacose
      (Chlamidia psittaci) is gediagnosticeerd en is behandeld overeenkomstig de voorschriften van de Commissie van de
      Europese Gemeenschappen of de Raad van de Europese Unie, bedoeld in artikel 7, onder A, tweede lid, onderdeel a,
      van [richtlijn 92/65/EEG](31992L0065), voor zover die voorschriften zijn vastgesteld;

      c. de papegaaiachtigen geïdentificeerd zijn overeenkomstig hetgeen hieromtrent in de beschikking van de Commissie
      van de Europese Gemeenschappen of de Raad van de Europese Unie, bedoeld in artikel 7, onder A, tweede lid,
      onderdeel b, van [richtlijn 92/65/EEG](31992L0065) is bepaald, met dien verstande dat zolang deze beschikking
      nog niet is vastgesteld, de papegaaiachtigen zodanig geïdentificeerd zijn dat het bedrijf van oorsprong of van
      tijdelijk verblijf is terug te vinden.

      3 Indien het nertsen en vossen betreft geldt, dat voldaan is aan artikel 10, eerste lid, van [richtlijn 92/65/
      EEG](31992L0065) en, indien het nertsen betreft, in voorkomend geval, aan de algemene of beperkte aanvullende
      garanties, bedoeld in artikel 14, tweede lid, en artikel 15, tweede lid, van [richtlijn 92/65/EEG](31992L0065).

      4 Indien het lagomorfen betreft die zijn bestemd voor een lid-staat, die geen gezondheidscertificaat als bedoeld in
      artikel 9, tweede lid, van [richtlijn 92/65/EEG](31992L0065) eist, geldt, dat wordt voldaan aan artikel 9, eerste
      lid, van [richtlijn 92/65/EEG](31992L0065) alsmede, in voorkomend geval, aan de algemene of beperkte aanvullende
      garanties, bedoeld in artikel 14, tweede lid, en artikel 15, tweede lid, van [richtlijn 92/65/EEG](31992L0065).

      5 Indien het dieren als bedoeld in artikel 13, eerste lid, van [richtlijn 92/65/EEG](31992L0065) betreft, geldt
      dat zij afkomstig zijn van een instelling, instituut of centrum dat is erkend overeenkomstig [artikel 8.6][ref1] en
      dat zij bestemd zijn voor een door de bevoegde autoriteit van het land van bestemming overeenkomstig bijlage C, van
      [richtlijn 92/65/EEG](31992L0065) erkende instelling, erkend instituut of erkend centrum.


