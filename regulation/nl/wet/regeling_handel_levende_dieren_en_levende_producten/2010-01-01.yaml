  - number: '2.25'
    text: |-
      1 Indien de partij in Nederland wordt gebracht via een erkende inspectiepost worden:

      a. het certificaat of document, genoemd in de [derde afdeling van de hoofdstukken 3 tot en met 11][ref1], en de
      documenten, bedoeld in [artikel 2.22, tweede lid, onderdeel a][ref2];

      b. de certificaten of documenten, bedoeld in [artikel 2.22, derde lid][ref3], of

      c. de documenten, bedoeld in [artikel 2.22, vierde lid][ref4], desverlangd, door de handelaar overgelegd aan de
      keuringsdierenarts.

      2 Het eerste lid is niet van toepassing indien:

      a. de partij rechtstreeks via een geregelde lijndienst vanuit een inspectiepost wordt vervoerd naar een andere op
      het grondgebied van de Europese Gemeenschap gelegen plaats;

      b. de partij is verzonden vanuit een derde land en bestemd is voor een derde land.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Hoofdstuk3
