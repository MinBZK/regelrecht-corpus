    text: |-
      Als bewijsstuk, bedoeld in [artikel 2.4, onderdeel a][ref1], wordt met het oog op het anders dan in doorvoer buiten
      Nederland brengen van een partij eicellen, bestemd voor een lid-staat, vastgesteld het gezondheidscertificaat
      dat op grond van artikel 11, derde lid, derde gedachtenstreepje, van [richtlijn 92/65/EEG](31992L0065) is
      voorgeschreven indien het eicellen van schapen, geiten, varkens en paardachtigen betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.4
