  - number: 8.5k
    text: |-
      1 De partij bijen of hommels bevat per koninginnekast één koningin met maximaal twintig voedsters.

      2 De partij bijen of hommels is verzonden vanuit een derde land of een deel van een derde land, dat is vermeld op
      de lijst, bedoeld in artikel 1, eerste lid, eerste gedachtestreepje, van beschikking (EG) nr. 2003/881.

      3 Ingeval de partij bijen of hommels afkomstig is uit een derde land is invoer alleen toegestaan indien op het
      volledige gebied van dat derde land een aangifteplicht bestaat voor Amerikaans vuilbroed, de kleine bijenkastkever
      en Tropilaelapsmijt.

      4 Ingeval de partij bijen of hommels afkomstig is uit een in deel 2 van bijlage III bij beschikking (EG)
      nr. 2003/881 opgenomen geografisch en epidemiologisch geïsoleerd deel van een derde land, is in afwijking van het
      derde lid alleen de invoer van partijen uit dat deel van het derde land toegestaan.

      5 De partij bijen of hommels gaat vergezeld van het gezondheidscertificaat, bedoeld in artikel 1, eerste lid,
      tweede gedachtestreepje, van beschikking (EG) nr. 2003/881, en voldoet aan de in het gezondheidscertificaat
      genoemde garanties.

      6 Na het vervoer naar de op het gezondheidscertificaat, bedoeld in het derde lid, aangegeven bestemming worden
      de kasten onder officieel toezicht van de VWA geplaatst en worden de koninginnen overgebracht naar nieuwe kasten
      voordat ze in contact met plaatselijke volken worden gebracht.

      7 De kasten, de voedsters en het andere materiaal, die uit het derde land van oorsprong met de koninginnen zijn
      meegestuurd, worden voor onderzoek op de aanwezigheid van de kleine bijenkastkever en de Tropilaelapsmijt naar een
      laboratorium gestuurd.

      8 Na afronding van het onderzoek, bedoeld in het vijfde lid, worden de kasten, de voedsters en het andere materiaal
      vernietigd.

      9 Indien uit het onderzoek, bedoeld in het vijfde lid, een negatief resultaat blijkt, wordt het officiële toezicht,
      bedoeld in het vierde lid, beëindigd.
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel8.5k
  - number: 8.5l
    text: |-
      1 In afwijking van [artikel 8.5k][ref1] bevat een partij hommels per bergingsmiddel een enkel volk met maximaal 200
      volwassen hommels.

      2 De partij hommels is verzonden vanuit een derde land of een deel van een derde land dat is vermeld op de lijst,
      bedoeld in artikel 1, eerste lid, eerste gedachtestreepje, van beschikking (EG) nr. 2003/881.

      3 De partij hommels gaat vergezeld van het gezondheidscertificaat, bedoeld in artikel 2 van beschikking (EG) nr.
      2003/881, en voldoet aan de in het gezondheidscertificaat genoemde garanties.

      4 Gedurende of onmiddellijk na afloop van de levensduur van het volk wordt het bergingsmiddel en al het materiaal
      dat uit het derde land van oorsprong met de hommels is meegestuurd, vernietigd.


