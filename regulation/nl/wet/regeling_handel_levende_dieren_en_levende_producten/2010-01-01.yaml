      vóór 14.00 uur op de tweede werkdag voorafgaand aan het tijdstip van de voorgenomen uitvoer aangevraagd bij de
      VWA op een daartoe beschikbaar gesteld aanvraagformulier. Per aanvraagformulier kan slechts voor één partij een
