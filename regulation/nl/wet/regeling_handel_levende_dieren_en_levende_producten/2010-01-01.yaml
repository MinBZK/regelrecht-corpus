  - number: '2.31'
    text: |-
      Indien dieren tijdens het vervoer naar de plaats van bestemming in Nederland dan wel naar de plaats waar zij weer
      buiten Nederland worden gebracht, zijn gestorven of afgemaakt, zijn de kadavers vernietigd volgens de ter zake
      geldende wettelijke voorschriften.
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel2.31
  - number: '2.32'
    text: |-
      1 Indien wordt vermoed of geconstateerd dat er verwekkers van ziekten, zoönosen, of andere aandoeningen, bedoeld
      in artikel 8, eerste lid, onderdeel a, van [richtlijn 90/425/EEG](31990L0425), aanwezig zijn of dat de dieren
      of producten afkomstig zijn uit een met een epidemische dierziekte besmet gebied, worden, zonder vergoeding
      van Staatswege en voor rekening van de verzender, diens gemachtigde of degene die met de zorg van de dieren
      of de producten is belast, al naar gelang de minister daaromtrent heeft besloten en met inachtneming van diens
      aanwijzingen:

      a. de dieren, met inachtneming van artikel 6, van [richtlijn 90/425/EEG](31990L0425), in tijdelijke afzondering
      geplaatst, of

      b. de dieren of producten gedood of vernietigd.

      2 Onverminderd het eerste lid worden, indien niet wordt voldaan aan de onderhavige regeling dan wel in de gevallen
      bedoeld in artikel 2, tweede lid, van beschikking nr. 93/444/EEG, zonder vergoeding van Staatswege en voor rekening
      van de verzender, diens gemachtigde of degene die met de zorg voor de dieren of producten is belast, al naar gelang
      de minister daaromtrent heeft besloten en met inachtneming van de aanwijzingen van de keuringsdierenarts.:

      a. de dieren of producten onder toezicht van de keuringsdierenarts geplaatst;

      b. de dieren geslacht;

      c. de producten vernietigd, of

      d. de dieren of producten teruggezonden naar de Lid-Staat van verzending, mits deze hiervoor toestemming verleent.

      3 Tenzij hygiënische of veterinairrechtelijke voorschriften zich hiertegen verzetten, laat de minister de keuze
      tussen de in het tweede lid bedoelde maatregelen aan de verzender of diens gemachtigde.
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel2.32
  - number: '2.33'
    text: |-
      Het verbod, bedoeld in [artikel 2.1, tweede lid, derde gedachtenstreepje][ref1], geldt niet ter zake van het
      brengen in Nederland van dieren die via Nederland voor het eerst in de gebieden waarop het [Verdrag betreffende de
      Europese Unie](onbekend) van toepassing is worden gebracht en zijn verzonden vanuit een derde land of een deel van
      een derde land, mits voldaan wordt aan, voor zover van toepassing, verordening 282/2004/EG, verordening 318/2007 en
      de [artikelen 2.35 tot en met 2.41][ref2] en aan:

        - [afdeling 4 van hoofdstuk 3][ref3], indien het runderen betreft;
        - [afdeling 4 van hoofdstuk 4][ref4], indien het varkens betreft;
        - [afdeling 4 van hoofdstuk 5][ref5], indien het paardachtigen betreft;
        - [afdeling 4 van hoofdstuk 6][ref6], indien het pluimvee betreft;
        - [afdeling 4 van hoofdstuk 7][ref7], indien het schapen of geiten betreft;
        - [artikel 7a.1][ref8] van [hoofdstuk 7a][ref9], indien het gaffelantilopen, herten, muskusherten, dwergherten,
      giraffen, okapi’s, eeltpotigen, nijlpaarden, pecari’s, neushoorns, tapirs, olifanten en holhoornigen niet zijnde
      runderen, geiten en schapen betreft;
        - [afdeling 4 van hoofdstuk 8][ref10], indien het dieren, niet zijnde runderen, varkens, paardachtigen, pluimvee,
      schapen, geiten of vogels betreft;
        - [afdeling 4b, van hoofdstuk 8][ref11], indien het bijen of hommels betreft, afkomstig uit een derde land.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.1
