  - number: '2.22'
    text: |-
      1 Het verbod, bedoeld in [artikel 2.1, tweede lid, eerste gedachtenstreepje][ref1], geldt niet ter zake van het
      brengen in Nederland van dieren en producten die zijn verzonden vanuit een lid-staat dan wel zijn verzonden vanuit
      een derde land en via het grondgebied van een lid-staat in Nederland worden gebracht, mits voldaan wordt aan, voor
      zover van toepassing, het tweede tot en met het vierde lid, en de [artikelen 2.23 tot en met 2.31][ref2].

      2 Indien de dieren of producten zijn verzonden vanuit een lid-staat en bestemd zijn voor Nederland of een lid-
      staat:

      a. gaan raszuivere dieren, hybride varkens en producten hiervan vergezeld van de zoötechnische documenten die bij
      of krachtens het Fokkerijbesluit zijn voorgeschreven voor het brengen in Nederland van raszuivere dieren, hybride
      varkens en hun producten die zijn verzonden vanuit een lid-staat;

      b. wordt voldaan aan:

        - [afdeling 3 van hoofdstuk 3][ref3], indien het runderen betreft;
        - [afdeling 3 van hoofdstuk 4][ref4], indien het varkens betreft;
        - [afdeling 3 van hoofdstuk 5][ref5], indien het paardachtigen betreft;
        - [afdeling 3 van hoofdstuk 6][ref6], indien het pluimvee en broedeieren betreft;
        - [afdeling 3 van hoofdstuk 7][ref7], indien het schapen en geiten betreft;
        - [afdeling 3 van hoofdstuk 8][ref8], indien het apen, hoefdieren, bijen, honden, katten en lagomorfen met
      gezondheidscertificaat betreft;
        - [afdeling 3 van hoofdstuk 9][ref9], indien het sperma betreft;
        - [afdeling 3 van hoofdstuk 10][ref10], indien het embryo's betreft, en
        - [afdeling 3 van hoofdstuk 11][ref11], indien het eicellen betreft.

      3 Indien de dieren of producten zijn verzonden vanuit een lid-staat en bestemd zijn voor
      een derde land, gaat de partij vergezeld van het certificaat of document, genoemd in de
      [derde afdeling van de hoofdstukken 3 tot en met 11][ref12], dat, indien het dieren betreft, ten-minste
      bestemd is voor slachtdieren, alsmede van de veterinaire documenten of certificaten, die aan de veterinaire
      voorschriften van het derde land van bestemming voldoen, tenzij op het certificaat of document, genoemd in de
      [derde afdeling van de hoofdstukken 3 tot en met 11][ref13], de vermelding ‘Dieren of producten voor uitvoer naar
      (naam van het derde land)’ voorkomt, waarbij de naam van het derde land van bestemming als het gedeelte tussen
      haakjes is opgenomen.

      4 Indien de dieren of producten zijn verzonden vanuit een derde land en via het grondgebied van een lid-staat in
      Nederland worden gebracht, gaat de partij vergezeld van:

      a. het Gemeenschappelijke veterinaire document van binnenkomst, bedoeld in [verordening 282/2004/EG](32004R0282),
      alsmede het document, onderscheidenlijk de documenten, bedoeld in artikel 7, eerste lid, eerste gedachtestreepje,
      van [richtlijn 91/496/EEG](31991L0496), indien het dieren betreft;

      b. indien het producten bestemd voor Nederland of een lid-staat betreft, een Gemeenschappelijk veterinair document
      van binnenkomst als bedoeld in [verordening 136/2004/EG](32004R0136) en van een gewaarmerkt afschrift als bedoeld
      in artikel 7, vierde lid, van [richtlijn 97/78/EG](31997L0078);

      c. indien het producten bestemd voor een derde land betreft, een bij de partij behorend document, waaruit tenminste
      de oorsprong van de partij en de verdere bestemming hiervan kan worden afgeleid, en van een Gemeenschappelijk
      veterinair document van binnenkomst als bedoeld in [verordening 136/2004/EG](32004R0136), waarin is aangegeven
      langs welke grensinspectiepost de partij de Gemeenschap verlaat.

      5 Het eerste lid is niet van toepassing op vee, niet zijnde paarden niet bestemd voor de slacht, afkomstig uit
      België.


