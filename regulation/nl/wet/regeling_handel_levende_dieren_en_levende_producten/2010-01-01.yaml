  - number: '9.3'
    text: |-
      Op grond van het onderzoek, bedoeld in [artikel 2.5][ref1], is gebleken dat voldaan wordt aan:

      a. artikel 3, onderdelen b en c, van [richtlijn 88/407/EEG](31988L0407), indien het rundersperma betreft, met
      inachtneming van artikel 2, tweede lid, van [richtlijn nr. 2003/43/EG](32003L0043);

      b. artikel 3, onderdelen b en c, van [richtlijn 90/429/EEG](31990L0429), indien het varkenssperma betreft;

      c. artikel 11, tweede lid, tweede en derde gedachtestreepje, en derde lid, tweede alinea van [richtlijn 92/65/EEG]
      (31992L0065), indien het sperma van paardachtigen betreft, of

      d. artikel 11, tweede lid, tweede en derde gedachtestreepje, en derde lid, tweede alinea van [richtlijn 92/65/EEG]
      (31992L0065) en bijlage VIII, hoofdstuk A, deel I, onder d, van [verordening (EG) nr. 999/2001](32001R0999) indien
      het sperma van schapen of geiten betreft artikel 2, derde lid, van verordening (EG) 546/2006, indien het sperma van
      schapen of geiten betreft dat wordt verzonden naar een in de bijlage bij die verordening genoemde lidstaat .


