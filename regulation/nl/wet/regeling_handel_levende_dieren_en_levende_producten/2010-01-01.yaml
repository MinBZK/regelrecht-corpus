        afdeling: '6'
  - number: 2.50f
    text: |-
      1 Degene die om inslag dan wel opslag in, of uitslag uit een van de in [artikel 2.50][ref1] genoemde opslagruimten
      verzoekt, voldoet de kosten voor keuringen en controles welke de VWA bij de inslag, opslag of uitslag verricht.

      2 De in het eerste lid bedoelde kosten betreffen de kosten die in rechtstreeks verband staan met deze keuringen
      en controles.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.50
