  - number: '9.7'
    text: |-
      Sperma van schapen, geiten of paardachtigen als bedoeld in artikel 13, eerste lid, van [richtlijn 92/65/EEG]
      (31992L0065):

      a. gaat vergezeld van het vervoersdocument, dat op grond van artikel 13, eerste lid, van [richtlijn 92/65/EEG]
      (31992L0065) is voorgeschreven;

      b. is afkomstig van een instelling, instituut of centrum dat is erkend overeenkomstig [artikel 9.11][ref1] en is
      bestemd voor een door de bevoegde autoriteit van het land van bestemming overeenkomstig bijlage C van [richtlijn
      92/65/EEG](31992L0065) erkende instelling, erkend instituut of erkend centrum.


