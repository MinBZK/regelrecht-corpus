  - number: 11a.1
    text: |-
      In dit hoofdstuk wordt onder communautaire vrijwaringsmaatregel verstaan verordening, richtlijn of beschikking als
      bedoeld in artikel 249 van het Verdrag tot oprichting van de Europese Gemeenschap vastgesteld krachtens artikel
      18 van [richtlijn nr. 91/496/EEG](31991L0496), artikel 22 van [richtlijn nr. 97/78/EG](31997L0078) of artikel 18,
      tweede alinea, van [verordening (EG) nr. 998/2003](32003R0998).
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel11a.1
  - number: 11a.2
    text: |-
      Het is verboden dieren, broedeieren, sperma, embryo’s en eicellen vanuit een derde land, of een deel daarvan, in
      Nederland te brengen ingeval op grond van een communautaire vrijwaringsmaatregel voor lidstaten een verplichting
      geldt om:

      a. de invoer van de desbetreffende diersoort, dan wel het desbetreffende product, uit het desbetreffende land of
      een deel daarvan te schorsen;

      b. bijzondere voorwaarden aan de invoer van desbetreffende dieren, dan wel producten uit het desbetreffende
      land of een deel daarvan te stellen, indien niet is voldaan aan de bij deze communautaire vrijwaringsmaatregel
      voorgeschreven voorwaarden.
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel11a.2
  - number: 11a.3
    text: |-
      1 De bevoegde autoriteit, bedoeld in een communautaire vrijwaringsmaatregel, is de minister.

      2 In afwijking van het eerste lid is, ingeval een communautaire vrijwaringsmaatregel de bevoegde autoriteit een
      taak opdraagt die niet bestaat in het nemen van een besluit, de bevoegde autoriteit de Voedsel en Waren Autoriteit.

      3 De officiële dierenarts, bedoeld in een communautaire vrijwaringsmaatregel, is een dierenarts, verbonden aan de
      Voedsel- en Warenautoriteit.
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel11a.3
  - number: 11a.4
    text: |-
      Een communautaire vrijwaringsmaatregel, of een wijziging daarvan, treedt voor de toepassing van deze regeling in
      werking met ingang van de dag waarop daaraan uiterlijk uitvoering moet zijn gegeven, of bij gebreke daarvan, de dag
      waarop de maatregel is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel11a.4
  - number: '12.1'
    text: |-
