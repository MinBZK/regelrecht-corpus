  - number: '2.58'
    text: |-
      Het verbod, bedoeld in [artikel 2.1, tweede lid, eerste en tweede gedachtenstreepje][ref1], voor zover dit
      betrekking heeft op het brengen in Nederland van producten uit staten, niet zijnde lid-staten, die partij zijn bij
      het EER-Verdrag, geldt niet, mits voldaan wordt aan [artikel 2.59][ref2] en:

      a. voor zover de producten bestemd zijn voor Nederland of een lid-staat, aan:

        - [afdeling 3 van hoofdstuk 6][ref3], indien het broedeieren betreft;
        - [afdeling 3 van hoofdstuk 9][ref4], indien het rundersperma of varkenssperma betreft;
        - [afdeling 4 van hoofdstuk 9][ref5], indien het sperma van schapen, geiten of paardachtigen betreft;
        - [afdeling 3 van hoofdstuk 10][ref6], indien het runderembryo's betreft;
        - [afdeling 4 van hoofdstuk 10][ref7], indien het embryo's van varkens, schapen, geiten of paardachtigen betreft;
        - [afdeling 4 van hoofdstuk 11][ref8], indien het eicellen betreft;

      b. voor zover de producten bestemd zijn voor een derde land of een staat, niet zijnde een lid-staat, die partij is
      bij het EER-Verdrag, de betrokken partij vergezeld gaat van een bij die partij behorend origineel document, dat is
      gesteld in de Nederlandse, Duitse, Franse of Engelse taal, waaruit tenminste de oorsprong van de partij alsmede de
      bestemming daarvan kan worden afgeleid.


