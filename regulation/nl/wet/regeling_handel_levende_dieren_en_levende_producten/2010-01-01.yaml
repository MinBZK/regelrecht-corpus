  - number: '2.54'
    text: |-
      Noch op grond van regelgeving van de Toezichthoudende Autoriteit van de EVA, noch op grond van het EER-Verdrag
      geldt een verbod om de dieren of producten vanuit Nederland in een staat, niet zijnde een lid-staat, die partij is
      bij het EER-Verdrag te brengen.
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel2.54
  - number: '2.55'
    text: |-
      Indien de partij op grond van het onderzoek, bedoeld in [artikel 2.53][ref1], geschikt is bevonden om anders dan
      in doorvoer buiten Nederland te worden gebracht, wordt zij onmiddellijk na het onderzoek, langs de kortste weg naar
      het transportmiddel vervoerd, waarmee zij buiten Nederland zal worden gebracht en wordt zij zo spoedig mogelijk,
      rechtstreeks, buiten Nederland gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.53
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel2.55
    references:
      - id: ref1
        bwb_id: BWBR0007049
        artikel: '2.53'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '7'
  - number: '2.56'
    text: |-
      1 Het verbod, bedoeld in [artikel 2.1, tweede lid, eerste en tweede gedachtenstreepje][ref1], voor zover dit
      betrekking heeft op het brengen in Nederland van dieren uit staten, niet zijnde lid-staten, die partij zijn bij het
      EER-Verdrag, geldt niet, mits voldaan wordt aan [artikel 2.57][ref2] en aan:

      a. [afdeling 3 van hoofdstuk 3][ref3], met uitzondering van [artikel 3.7, eerste lid][ref4], indien het runderen
      betreft;

      b. [afdeling 3 van hoofdstuk 4][ref5], met uitzondering van [artikel 4.7, eerste lid][ref6], indien het varkens
      betreft;

      c. [afdeling 3 van hoofdstuk 5][ref7], indien het paardachtigen betreft;

      d. [afdeling 3 van hoofdstuk 6][ref8], indien het pluimvee betreft;

      e. [afdeling 3 van hoofdstuk 7][ref9], indien het schapen en geiten betreft;

      f. [artikel 7a.1][ref10] van hoofdstuk 7a, indien het gaffelantilopen, herten, muskusherten, dwergherten, giraffen,
      okapi’s, eeltpotigen, nijlpaarden, pecari’s, neushoorns, tapirs, olifanten en holhoornigen niet zijnde runderen,
      geiten en schapen betreft;

      g. [afdeling 4 van hoofdstuk 8][ref11], indien het apen, hoefdieren, bijen, honden, katten, lagomorfen, vogels,
      fretten, nertsen en vossen betreft.

      2 Het verbod, bedoeld in [artikel 2.1, tweede lid, eerste en tweede gedachtenstreepje][ref12], voor zover dit
      betrekking heeft op het brengen in Nederland van dieren uit staten, niet zijnde lid-staten, die partij zijn bij het
      EER-Verdrag, geldt niet, mits voldaan wordt aan de [artikelen 2.39][ref13] en [2.40][ref14] en:

      a. de dieren zijn aangevoerd met een vliegtuig of een schip en met een vliegtuig, onderscheidenlijk een schip het
      Nederlands grondgebied rechtstreeks via dezelfde luchthaven, onderscheidenlijk haven van aanvoer weer verlaten;

      b. de eerstvolgende bestemming blijkens de bij de partij behorende documenten een derde land of een staat, niet
      zijnde een lid-staat, die partij is bij het EER-Verdrag is, en

      c. de dieren tussentijds niet in contact komen met andere dieren en, indien zij tussentijds het transportmiddel
      verlaten, het daartoe door de keuringsdierenarts aangewezen terrein niet verlaten, mits het voornemen om de dieren
      in Nederland te brengen tijdig bij de VWA is gemeld.


