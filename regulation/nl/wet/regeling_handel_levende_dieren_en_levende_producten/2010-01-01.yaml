  - number: '2.17'
    text: |-
      Het bewijsstuk, bedoeld in [artikel 2.16, eerste lid, onderdeel a, eerste gedachtenstreepje][ref1], wordt slechts
      afgegeven, indien op grond van een van Rijkswege ingesteld onderzoek, dat onmiddellijk vóór het brengen van
      de partij buiten Nederland heeft plaatsgevonden, is gebleken dat voldaan wordt aan de [artikelen 2.19][ref2],
      [2.20, tweede lid][ref3], en [2.21][ref4], en dat tenminste wordt voldaan aan hetgeen in:

        - de [artikelen 3.3][ref5] en [3.4 van afdeling 2 van hoofdstuk 3][ref6], indien het runderen betreft;
        - de [artikelen 4.3][ref7] en [4.4 van afdeling 2 van hoofdstuk 4][ref8], indien het varkens betreft;
        - de [artikelen 5.3][ref9] en [5.4 van afdeling 2 van hoofdstuk 5][ref10], indien het paardachtigen betreft;
        - de [artikelen 7.3][ref11] en [7.4 van afdeling 2 van hoofdstuk 7][ref12], indien het schapen en geiten betreft,
      voor slachtdieren is bepaald.


