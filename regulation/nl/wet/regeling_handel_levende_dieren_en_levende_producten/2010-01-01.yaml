  - number: '3.1'
    text: |-
      1 Onverminderd [artikel 1.1][ref1] wordt in dit hoofdstuk verstaan onder:




                *richtlijn 64/432/EEG:*


                richtlijn van de Raad van de Europese Gemeenschappen van 26 juni 1964 inzake veterinairrechtelijke
      vraagstukken op het gebied van het intracommunautaire handelsverkeer in runderen en varkens (PbEG L 121);




                *runderen:*


                runderen, de soorten Bison bison en Bubalus bubalus daaronder begrepen;




                *slachtrunderen:*


                runderen die kennelijk bestemd zijn om te worden geslacht;




                *fok- en gebruiksrunderen:*


                runderen, niet zijnde slachtrunderen, die kennelijk bestemd zijn voor de fokkerij, voor de melk- en
      vleesproductie of die als trekkracht worden gebruikt of die bestemd zijn voor tentoonstellingen en manifestaties,
      culturele en sportieve manifestaties daarvan uitgezonderd;



              paspoort:

                document dat is opgesteld en afgegeven in overeenstemming met artikel 6 van [verordening 1760/2000/
      EG](32000R1760) en met de op basis van artikel 10 van [verordening 1760/2000/EG](32000R1760) vastgestelde
      voorschriften.



              beslag:

                op een bedrijf als een afzonderlijke epidemiologische eenheid gehouden rund of groep runderen met dien
      verstande dat wanneer er meerdere beslagen op een bedrijf zijn elk beslag een afzonderlijke epidemiologische
      eenheid vormt met eenzelfde gezondheidsstatus;



              handelaar:

                natuurlijke of rechtspersoon die al dan niet rechtstreeks runderen voor handelsdoeleinden koopt en
      verkoopt, een regelmatige omzetsnelheid heeft en die de runderen uiterlijk 30 dagen na aankoop doorverkoopt of van
      de ene bedrijfsruimte naar de andere, waarvan hij geen eigenaar is, verplaatst en voldoet aan [artikel 3.15][ref2];



              blokperiode:

                tijdseenheid van maximaal 144 uur te rekenen vanaf het tijdstip van eerste verzameling op een
      verzamelcentrum dan wel, indien een verzamelcentrum beschikt over meerdere epidemiologische bedrijfseenheden, te
      rekenen vanaf het tijdstip van eerste verzameling in een epidemiologische bedrijfseenheid;



              eerste verzameling:

                eerste aanvoer van runderen op een verzamelcentrum nadat deze is ontvolkt, gereinigd en ontsmet dan wel,
      indien een verzamelcentrum beschikt over meerdere epidemiologische bedrijfseenheden, eerste aanvoer van runderen op
      een epidemiologische bedrijfseenheid nadat deze is ontvolkt, gereinigd en ontsmet;



              aanbieder:

                exploitant, eigenaar of diens vertegenwoordiger van een verzamelcentrum;



              epidemiologische bedrijfseenheid:

                stalruimte op een verzamelcentrum ten behoeve van de huisvesting van een beslag dat zodanig is gesitueerd
      dat geen contact met de overige op het verzamelcentrum aanwezige beslagen mogelijk is, met dien verstande dat
      wanneer meerdere epidemiologische bedrijfseenheden zijn ondergebracht in één gebouw de voor elke epidemiologische
      bedrijfseenheid bestemde ruimte fysiek door middel van geheel gesloten wanden gescheiden is van de voor de overige
      epidemiologische bedrijfseenheden bestemde ruimten en over een afzonderlijke laad- en losplaats beschikt die fysiek
      gescheiden is van eventueel aangrenzende laad- en losplaatsen.




      2 In het eerste lid wordt voor de toepassing van [afdeling 6][ref3] in de begripsomschrijvingen van blokperiode,
      epidemiologische bedrijfseenheid, eerste verzameling en aanbieder onder ‘verzamelcentrum’ mede verstaan: de
      bedrijfsruimte, bedoeld in [artikel 3.15, tweede lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0007049#Artikel3.15
      [ref3]: https://wetten.overheid.nl/BWBR0007049#Hoofdstuk3
      [ref4]: https://wetten.overheid.nl/BWBR0007049#Artikel3.15
