  - number: '2.20'
    text: |-
      1 Indien de partij via het grondgebied van een lid-staat naar een derde land wordt gebracht, vindt het vervoer van
      de partij over Nederlands grondgebied onder douanetoezicht plaats.

      2 Tijdens het vervoer over Nederlands grondgebied zijn de dieren of producten niet in aanraking gekomen met andere
      dieren of producten.
