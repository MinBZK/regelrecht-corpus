  - number: 7.1a
    text: |-
      De vervoerder van schapen of geiten voldoet aan van artikel 8 quater, eerste lid, onderdeel a, eerste
      gedachtestreepje, en derde lid, van richtlijn nr. 91/68/EEG.
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel7.1a
  - number: '7.2'
    text: |-
      Als bewijsstuk, bedoeld in [artikel 2.4, eerste lid, onderdeel a][ref1], wordt met het oog op het anders dan in
      doorvoer buiten Nederland brengen van een partij schapen of geiten, bestemd voor een lid-staat, vastgesteld het
      gezondheidscertificaat dat op grond van artikel 9 van [richtlijn 91/68/EEG](31991L0068) voor de desbetreffende
      soort schapen of geiten is voorgeschreven, met dien verstande dat voor het buiten Nederland brengen van een partij
      schapen of geiten, bestemd voor staten die partij zijn bij het EER-Verdrag, op vorenbedoeld gezondheidscertificaat
      niet behoeft te zijn aangegeven of de dieren afkomstig zijn uit of zijn aangekocht in derde landen.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel7.2
