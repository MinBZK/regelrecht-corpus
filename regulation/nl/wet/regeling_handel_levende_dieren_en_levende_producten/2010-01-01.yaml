  - number: '6.9'
    text: |-
      1 Pluimvee en broedeieren dat, onderscheidenlijk die in Nederland is, onderscheidenlijk zijn gebracht en voor
      Nederland of een lid-staat is, onderscheidenlijk zijn bestemd, worden vervoerd overeenkomstig de artikelen 15 en 16
      van [richtlijn 90/539/EEG](31990L0539).

      2 Pluimvee en broedeieren dat, onderscheidenlijk die via Nederland voor het eerst gebracht worden in de gebieden
      waarop het Verdrag betreffende de Europese Unie van toepassing is, is, onderscheidenlijk zijn verzonden vanuit een
      derde land of een deel van een derde land en voor Nederland is, onderscheidenlijk zijn bestemd, worden onmiddellijk
      en rechtstreeks, onder ambtelijke verzegeling en zonder uit-, bij- of overlading, van de erkende inspectiepost naar
      het bedrijf van bestemming dan wel het in [artikel 6.10][ref1] bedoelde slachthuis vervoerd.

      3 De verbreking van de in het tweede lid bedoelde verzegeling geschiedt door een ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel6.10
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel6.9
    references:
      - id: ref1
        bwb_id: BWBR0007049
        artikel: '6.10'
        hoofdstuk: '6'
        afdeling: '5'
  - number: '6.10'
    text: |-
      In Nederland gebracht slachtpluimvee, bestemd voor Nederland, wordt zo spoedig mogelijk maar in ieder geval binnen
      72 uur na aankomst op een overeenkomstig artikel 4, tweede lid, van van [verordening (EG) nr. 853/2004](32004R0853)
      van het Europees Parlement en de Raad van de Europese Unie van 29 april 2004 houdende vaststelling van specifieke
      hygiënevoorschriften voor levensmiddelen van dierlijke oorsprong (PbEU L 139 en L 226) erkend slachthuis, zondagen
      en officieel erkende feestdagen niet meegerekend, geslacht.
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel6.10
  - number: '6.11'
    text: |-
      1 De kosten die voortvloeien uit het houden als bedoeld in onderdeel II, onder 1 en 2, van Bijlage VIII,
      onderscheidenlijk het houden als bedoeld in onderdeel II, onder 2 en 3, van Bijlage IX bij verordening (EG) nr.
      798/2008, van ingevoerd fok- en gebruikspluimvee, ingevoerde fok- en gebruiksloopvogels, of van eendagskuikens of
      ingevoerde broedeieren van de in dit lid bedoelde dieren, komen voor rekening van de afzender, de geadresseerde of
      hun gemachtigde.

      2 Indien tijdens de periode, bedoeld in onderdeel II, onder 1, sub a en b, en onder 2, van Bijlage VIII,
      onderscheidenlijk de periode, bedoeld in onderdeel II, onder 2, sub a en b, en onder 3, van Bijlage IX bij
      verordening (EG) nr. 798/2008, de ziekte van Newcastle of aviaire influenza uitbreekt onder het in Nederland
      gebrachte fok- en gebruikspluimvee, de in Nederland gebrachte fok- en gebruiksloopvogels, de eendagskuikens van
      de in dit lid bedoelde dieren, het pluimvee dat voortkomt onderscheidenlijk de loopvogels die voortkomen uit de in
      Nederland gebrachte broedeieren, of onder de niet in Nederland gebrachte dieren die de in het eerste lid bedoelde
      ingevoerde broedeieren hebben gelegd, draagt de eigenaar, houder of hoeder van die dieren onderscheidenlijk
      broedeieren alle dieren onderscheidenlijk alle broedeieren onmiddellijk aan de ambtenaar ter vernietiging over,
      waarbij de kosten van de vernietiging voor rekening van de eigenaar, houder of hoeder zijn.

      3 De eigenaar, houder of hoeder van het overeenkomstig verordening (EG) nr. 798/2008 in Nederland gebrachte fok-
      en gebruikspluimvee, de in Nederland gebrachte fok- en gebruiksloopvogels, de eendagskuikens van de in dit lid
      bedoelde dieren, of het pluimvee dat voortkomt uit de in Nederland gebrachte broedeieren, dat onderscheidenlijk die
      bij aankomst op het bedrijf van bestemming dan wel tijdens de in het tweede lid bedoelde periode zijn gestorven,
      stuurt deze dieren, met inachtneming van de door de toezichthoudende ambtenaar gegeven aanwijzingen, naar een naar
      het oordeel van onze Minister voldoende toegerust laboratorium ten behoeve van onderzoek.

      4 De in onderdeel II, onder 1, van Bijlage VIII bij verordening (EG) nr. 798/2008 bedoelde tests worden, voor zover
      deze betrekking hebben op aviaire influenza of Newcastle disease, uitgevoerd bij het Centraal Veterinair Instituut,
      te Lelystad.

      5 De ondernemer bewaart de testuitslagen van de in het vierde lid bedoelde tests gedurende een periode van drie
      jaren op zijn bedrijf en legt, op verzoek van een ambtenaar, de desbetreffende uitslagen over.
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel6.11
  - number: '7.1'
    text: |-
      Onverminderd [artikel 1.1][ref1] wordt in dit hoofdstuk verstaan onder:




              *richtlijn 91/68/EEG:*


              richtlijn van de Raad van de Europese Gemeenschappen van 28 januari 1991 inzake veterinairrechtelijke
      voorschriften voor het intracommunautaire handelsverkeer in schapen en geiten (PbEG L 46);




              *slachtschapen en -geiten:*


              schapen en geiten, bestemd om hetzij rechtstreeks hetzij via een schapen- of geitenverzamelcentrum naar een
      slachthuis te worden geleid om daar te worden geslacht;



            fokschapen en -geiten:

              schapen en geiten, bestemd om rechtstreeks, voor fok- en gebruiksdoeleinden, naar de plaats van bestemming
      te worden vervoerd;



            mestschapen en -geiten:

              schapen en geiten, bestemd om rechtstreeks naar de plaats van bestemming te worden vervoerd, om te worden
      vetgemest voor de slacht;



            schapenverzamelcentrum:

              schapenverzamelcentrum dat op grond van [artikel 2.63, vierde lid][ref2], is erkend;



            geitenverzamelcentrum:

              geitenverzamelcentrum dat op grond van [artikel 2.63, vierde lid][ref3], is erkend;



            handelaar:

              natuurlijke of rechtspersoon die al dan niet rechtstreeks dieren koopt en verkoopt voor handelsdoeleinden,
      die een omzetsnelheid heeft en die de dieren uiterlijk 29 dagen na aankoop doorverkoopt of verplaatst van de ene
      bedrijfsruimte naar de andere of rechtstreeks naar een slachthuis waarvan hij geen eigenaar is en die voldoet aan
      [artikel 7.9][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0007049#Artikel2.63
      [ref3]: https://wetten.overheid.nl/BWBR0007049#Artikel2.63
      [ref4]: https://wetten.overheid.nl/BWBR0007049#Artikel7.9
