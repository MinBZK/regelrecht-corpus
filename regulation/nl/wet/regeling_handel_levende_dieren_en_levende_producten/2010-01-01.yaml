preamble:
  text: |-
    Gelet op Richtlijn nr. 90/425/EEG van de Raad van de Europese Gemeenschappen van 26 juni 1990 inzake veterinaire
    en zoötechnische controles in het intracommunautaire handelsverkeer in bepaalde levende dieren en producten in
    het vooruitzicht van de totstandbrenging van de interne markt (PbEG L 224), Richtlijn nr. 90/675/EEG van de Raad
    van de Europese Gemeenschappen van 10 december 1990 tot vaststelling van de beginselen voor de organisatie van
    de veterinaire controles voor producten uit derde landen die in de Gemeenschap worden binnengebracht (PbEG L
    373), Richtlijn nr. 91/496/EEG van de Raad van de Europese Gemeenschappen van 15 juli 1991 tot vaststelling van
    de beginselen voor de organisatie van de veterinaire controles voor dieren uit derde landen die in de Gemeenschap
    worden binnengebracht en tot wijziging van de Richtlijnen 89/662/EEG, 90/425/EEG en 90/675/EEG (PbEG L 268),
    Richtlijn nr. 64/432/EEG van de Raad van de Europese Gemeenschappen van 26 juni 1964 inzake veterinairrechtelijke
    vraagstukken op het gebied van het intracommunautaire handelsverkeer in runderen en varkens (PbEG L 121), Richtlijn
    nr. 72/462/EEG van de Raad van de Europese Gemeenschappen van 12 december 1972 inzake gezondheidsvraagstukken
    en veterinairrechtelijke vraagstukken bij de invoer van runderen, varkens, schapen, geiten, van vers vlees
    of van vleesproducten uit derde landen (PbEG L 302), Richtlijn nr. 90/426/EEG van de Raad van de Europese
    Gemeenschappen van 26 juni 1990 tot vaststelling van veterinairrechtelijke voorschriften voor het verkeer van
    paardachtigen en de invoer van paardachtigen uit derde landen (PbEG L 224), Richtlijn nr. 90/539/EEG van de Raad
    van de Europese Gemeenschappen van 15 oktober 1990 tot vaststelling van veterinairrechtelijke voorschriften voor
    het intracommunautaire handelsverkeer en de invoer uit derde landen van pluimvee en broedeieren (PbEG L 303),
    Richtlijn nr. 91/68/EEG van de Raad van de Europese Gemeenschappen van 28 januari 1991 inzake veterinairrechtelijke
    voorschriften voor het intracommunautaire handelsverkeer in schapen en geiten (PbEG L 46), Richtlijn nr. 88/407/
    EEG van de Raad van de Europese Gemeenschappen van 14 juni 1988 tot vaststelling van de veterinairrechtelijke
    voorschriften van toepassing op het intracommunautaire handelsverkeer in sperma van runderen en de invoer daarvan
    (PbEG L 194), Richtlijn nr. 90/429/EEG van de Raad van de Europese Gemeenschappen van 26 juni 1990 tot vaststelling
    van de veterinairrechtelijke voorschriften van toepassing op het intracommunautaire handelsverkeer in sperma van
    varkens en de invoer daarvan (PbEG L 224), Richtlijn 89/556/EEG van de Raad van de Europese Gemeenschappen van 25
    september 1989 tot vaststelling van veterinairrechtelijke voorschriften voor het intracommunautaire handelsverkeer
    in embryo's van als huisdier gehouden runderen en de invoer daarvan uit derde landen (PbEG L 320), Richtlijn nr.
    92/65/EEG van de Raad van de Europese Gemeenschappen van 13 juli 1992 tot vaststelling van de veterinairrechtelijke
    voorschriften voor het handelsverkeer en de invoer in de Gemeenschap van dieren, sperma, eicellen en embryo's
    waarvoor ten aanzien van de veterinairrechtelijke voorschriften geen specifieke communautaire regelgeving als
    bedoeld in bijlage A, onder I, van Richtlijn 90/425/EEG geldt (PbEG L 268), Richtlijn nr. 94/28/EG van de Raad
    van de Europese Unie van 23 juni 1994 tot vaststelling van de beginselen inzake de zoötechnische en genealogische
    voorschriften voor de invoer uit derde landen van dieren, alsmede van sperma, eicellen en embryo's en tot wijziging
    van Richtlijn 77/504/EEG betreffende raszuivere fokrunderen (PbEG L 178) en Richtlijn nr. 94/42/EG van de Raad van
    de Europese Unie van 27 juli 1994 tot wijziging en bijwerking van Richtlijn 64/432/EEG inzake veterinairrechtelijke
    vraagstukken op het gebied van het intracommunautaire handelsverkeer in runderen en varkens (PbEG L 201) alsmede op
    de daarop gebaseerde regelgeving van de Commissie van de Europese Gemeenschappen en op de Overeenkomst betreffende
    de Europese Economische Ruimte (Trb. 1992, 132);

    Gelet op de artikelen 10, 11, 12, 13, 77, 81, 94, eerste lid, 107 en 108 van de Gezondheids- en welzijnswet voor
    dieren, op artikel 19 van de Landbouwwet, op artikel 2 van het Besluit uitvoer dieren en producten van dierlijke
    oorsprong en op de artikelen 2, 4 en 8 van het Besluit inzake het in de handel brengen van dieren en producten en
    de toepassing van maatregelen met betrekking tot in Nederland gebrachte dieren en producten;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      1 In deze regeling wordt verstaan onder:




                *wet:*


                [Gezondheids- en welzijnswet voor dieren][ref1];




                *minister:*


                Minister van Landbouw, Natuur en Voedselkwaliteit;




                *EER-Verdrag:*


                Overeenkomst betreffende de Europese Economische Ruimte;




                *richtlijn 90/425/EEG:*


                richtlijn van de Raad van de Europese Gemeenschappen van 26 juni 1990 inzake veterinaire en zoötechnische
      controles in het intracommunautaire handelsverkeer in bepaalde levende dieren en producten in het vooruitzicht van
      de totstandbrenging van de interne markt (PbEG L 224);




                *richtlijn 91/496/EEG:*


                richtlijn van de Raad van de Europese Gemeenschappen van 15 juli 1991 tot vaststelling van de beginselen
      voor de organisatie van de veterinaire controles voor dieren uit derde landen die in de Gemeenschap worden
      binnengebracht en tot wijziging van de [Richtlijnen 89/662/EEG](31989L0662), [90/425/EEG](31990L0425) en [90/675/
      EEG](31990L0675) (PbEG L 268);




                *richtlijn 92/65/EEG:*


                richtlijn van de Raad van de Europese Gemeenschappen van 13 juli 1992 tot vaststelling van
      veterinairrechtelijke voorschriften voor het handelsverkeer en de invoer in de Gemeenschap van dieren, sperma,
      eicellen en embryo's waarvoor ten aanzien van de veterinairrechtelijke voorschriften geen specifieke communautaire
      regelgeving als bedoeld in bijlage A, onder I, van [Richtlijn 90/425/EEG](31990L0425) geldt (PbEG L 268);




                [richtlijn 96/22/EG](31996L0022):

                [richtlijn (EG) nr. 96/22](31996L0022) van de Raad van de Europese Gemeenschappen van 29 april 1996
      betreffende het gebruik, in de veehouderij, van bepaalde stoffen met thyreostatische werking, alsmede van ß-
      agonisten en tot intrekking van de [Richtlijnen 81/602/EEG](31981L0602), [88/146/EEG](31988L0146) en [88/299/EEG]
      (31988L0299) (PbEG L 125);




                [richtlijn 97/78/EG](31997L0078):

                [richtlijn nr. 97/78/EG](31997L0078) van de Raad van de Europese Unie van 18 december 1997 tot
      vaststelling van de beginselen voor de organisatie van de veterinaire controles voor producten die uit derde landen
      in de Gemeenschap worden binnengebracht (PbEG, L 24);




                [richtlijn 2004/68/EG](32004L0068):

                [richtlijn nr. 2004/68/EG](32004L0068) van de Raad van de Europese Unie van 26 april 2004 tot
      vaststelling van veterinairrechtelijke voorschriften voor de invoer in en de doorvoer via de Gemeenschap van
      bepaalde levende hoefdieren tot wijziging van de [Richtlijnen 90/426/EEG](31990L0426) en [92/65/EEG](31992L0065) en
      tot intrekking van [Richtlijn 72/462/EEG](31972L0462) (PbEU L 139);



              richtlijn 2008/71/EG:

                richtlijn nr. 2008/71/EG van de Raad van de Europese Unie van 15 juli 2008 met betrekking tot de
      identificatie en registratie van varkens (PbEU L 213);



              beschikking 79/542/EEG:

                beschikking (EG) nr. 79/542 van de Raad van de Europese Gemeenschappen van 21 december 1976
      tot vaststelling van een lijst van derde landen of delen van derde landen, alsmede tot vaststelling van
      veterinairrechtelijke voorschriften, gezondheidsvoorschriften en voorschriften inzake de veterinaire certificering
      voor de invoer in de Gemeenschap van levende dieren en vers vlees daarvan (PbEU 2004, L 73);




                *beschikking 93/444/EEG:*


                beschikking van de Commissie van de Europese Gemeenschappen van 2 juli 1993 houdende
      toepassingsbepalingen inzake het intracommunautaire handelsverkeer van bepaalde levende dieren en producten die
      bestemd zijn voor uitvoer naar derde landen (PbEG L 208);



              beschikking 2000/571/EG:

                beschikking van de Commissie van de Europese Gemeenschappen van 8 september 2000 tot vaststelling van
      de methoden voor de veterinaire controles van producten uit derde landen die bestemd zijn voor een vrije zone, een
      vrij entrepot, een douane-entrepot of een handelaar die levert aan grensoverschrijdende zeevervoermiddelen (PbEG
      L 240);



              beschikking 2003/881/EG:

                beschikking nr. 2003/881/EG van de Commissie van de Europese Gemeenschappen van 11 december 2003
      betreffende de veterinairrechtelijke voorschriften en de certificeringsvoorwaarden voor de invoer van bijen en
      hommels (Apis mellifera & Bombus spp.) uit bepaalde derde landen en tot intrekking van beschikking 2000/462/EG
      (PbEU L 328);



              beschikking 2004/211/EG:

                beschikking (EG) nr. 2004/211 van de Commissie van de Europese Gemeenschappen van 6 januari 2004
      (PbEU L 73) tot vaststelling van de lijst van derde landen en delen van hun grondgebied waaruit de lidstaten de
      invoer toestaan van levende paardachtigen en sperma, eicellen en embryo’s van paarden en tot wijziging van de
      Beschikkingen 93/195/EEG en 94/63/EG;




                [verordening 1760/2000/EG](32000R1760):

                [verordening (EG) nr. 1760/2000](32000R1760) van de Commissie van de Europese Gemeenschappen van 17
      juli 2000 (PbEG L 204) tot vaststelling van een identificatie- en registratieregeling voor runderen en inzake de
      etikettering van rundvlees en rundvleesproducten en tot intrekking van [verordening nr. 820/97](31997R0820) van de
      Raad van de Europese Unie;




                *verordening (EG) nr. 999/2001:*


                [verordening (EG) nr. 999/2001](32001R0999) van het Europees Parlement en de Raad van de Europese Unie
      van 22 mei 2001 houdende vaststelling van voorschriften inzake preventie, bestrijding en uitroeiing van bepaalde
      overdraagbare spongiforme encefalopathieën (PbEG L 147);




                [verordening 282/2004/EG](32004R0282):

                [Verordening (EG) nr. 282/2004](32004R0282) van de Commissie van de Europese Gemeenschappen van 18
      februari 2004 betreffende de vaststelling van een document voor de aangifte en de veterinaire controle van uit
      derde landen afkomstige dieren die in de Gemeenschap worden binnengebracht (PbEU L 49);



              verordening 318/2007:

                Verordening (EG) nr. 318/2007 van de Commissie van de Europese Gemeenschappen van 23 maart 2007 tot
      vaststelling van de veterinairrechtelijke voorschriften voor de invoer van bepaalde vogels in de Gemeenschap en de
      desbetreffende quarantainevoorschriften (PbEU L 84);




                [verordening (EG) nr. 998/2003](32003R0998):

                [verordening (EG) nr. 998/2003](32003R0998) van het Europees Parlement en de Raad van de Europese Unie
      van 26 mei 2003 inzake veterinairrechtelijke voorschriften voor het niet-commerciële verkeer van gezelschapsdieren
      en houdende wijziging van [richtlijn 92/65/EEG](31992L0065) van de Raad (PbEU L 146);



              verordening (EG) 546/2006:

                verordening (EG) nr. 546/2006 van de Commissie van de Europese Gemeenschappen van 31 maart 2006 ter
      uitvoering van Verordening (EG) nr. 999/2001 van het Europees Parlement en de Raad wat betreft de nationale
      scrapiebestrijdingsprogramma’s en aanvullende garanties, tot afwijking van bepaalde voorschriften van Beschikking
      2003/100/EG en tot intrekking van Verordening (EG) nr. 1874/2003 (PbEU L 94);



              verordening (EG) 1/2005:

                verordening (EG) nr. 1/2005 van de Raad van de Europese Unie van 22 december 2004 inzake de bescherming
      van dieren tijdens het vervoer en daarmee samenhangende activiteiten en tot wijziging van de Richtlijnen 64/432/EEG
      en 93/119/EG en van Verordening (EG) nr. 1255/97 (PbEU L 3);



              verordening (EG) nr. 798/2008:

                verordening (EG) nr. 798/2008 van de Commissie van de Europese Gemeenschappen van 8 augustus
      2008 tot vaststelling van een lijst van derde landen, gebieden, zones of compartimenten waaruit pluimvee en
      pluimveeproducten mogen worden ingevoerd in en doorgevoerd door de Gemeenschap, en van de voorschriften inzake
      veterinaire certificering (PbEU L 226);



              communautaire uitvoeringsmaatregel:

                verordening, richtlijn of beschikking als bedoeld in artikel 249 van het Verdrag tot oprichting van de
      Europese Gemeenschap, vastgesteld krachtens een richtlijn of verordening met betrekking tot veterinairrechtelijke
      eisen inzake de handel in levende dieren, of levende dierlijke producten;



              VWA:

                Voedsel en Waren Autoriteit;




                *ambtenaar:*


                ambtenaar, bedoeld in [artikel 114, eerste of tweede lid van de wet][ref2];




                *keuringsdierenarts:*


                dierenarts verbonden aan de VWA;




                *officiële dierenarts:*


                door de bevoegde centrale autoriteit van het land van verzending aangewezen dierenarts;




                *lid-staat:*


                staat, niet zijnde Nederland, die als lid deel uitmaakt van de Europese Unie; staat die partij is bij het
      EER-Verdrag: Noorwegen;




                *derde land:*


                land, niet zijnde Nederland en niet zijnde een lid-staat of een andere staat die partij is bij het EER-
      Verdrag;




                *punt van uitgang:*


                douanekantoor van uitgang, of in een lid-staat gelegen plaats als bedoeld in artikel 1, tweede lid,
      onderdeel a, van beschikking 93/444/EEG, van waaruit dieren of producten rechtstreeks naar het derde land van
      bestemming worden vervoerd;




                *pluimvee:*


                kippen, kalkoenen, parelhoenders, eenden, ganzen, kwartels, fazanten, patrijzen, loopvogels (Ratites) en
      duiven, die in gevangenschap worden opgefokt of gehouden voor de fokkerij, voor de produktie van vlees of van voor
      consumptie bestemde eieren of om in het wild te worden uitgezet;




                *apen:*


                apen, bedoeld in artikel 5 van [richtlijn 92/65/EEG](31992L0065);




                *hoefdieren:*


                hoefdieren, bedoeld in artikel 6, onder A, eerste tot en met derde lid, van [richtlijn 92/65/EEG]
      (31992L0065);




                *vogels:*


                vogels, bedoeld in artikel 7, onder A, eerste en tweede lid, van [richtlijn 92/65/EEG](31992L0065);




                *bijen:*


                bijen, bedoeld in artikel 8 van [richtlijn 92/65/EEG](31992L0065);




                *lagomorfen met gezondheidscertificaat:*


                lagomorfen die zijn bestemd voor een lid-staat die een gezondheidscertificaat als bedoeld in artikel 9,
      tweede lid, van [richtlijn 92/65/EEG](31992L0065) eist;




                *lagomorfen zonder gezondheidscertificaat:*


                lagomorfen die zijn bestemd voor Nederland dan wel voor een lid-staat die geen gezondheidscertificaat als
      bedoeld in artikel 9, tweede lid, van [richtlijn 92/65/EEG](31992L0065) eist;




                *dieren:*


                vee, pluimvee alsmede dieren bedoeld in
      __REF002___________________________________________________________________________________________________________
      _;




                *dieren als bedoeld in artikel 13, eerste lid, van richtlijn 92/65/EEG:*


                dieren, die vatbaar zijn voor de in bijlage A bij [richtlijn 92/65/EEG](31992L0065) genoemde ziekten,
      dan wel dieren die vatbaar zijn voor ziekten, waarvoor de lid-staat van bestemming op grond van regelgeving van de
      Raad van de Europese Unie of de Commissie van de Europese Gemeenschappen aanvullende garanties, als bedoeld in de
      artikelen 14 en 15, van [richtlijn 92/65/EEG](31992L0065) mag stellen;




                *producten als bedoeld in artikel 13, eerste lid, van richtlijn 92/65/EEG:*


                producten van dieren als bedoeld in artikel 13, eerste lid, van [richtlijn 92/65/EEG](31992L0065);




                *paardachtigen:*


                als huisdier gehouden of in het wild levende paarden, zebra’s, ezels of kruisingen daarvan;



              geregistreerde paarden:

                paardachtigen die in een stamboek zijn ingeschreven, dan wel in een stamboek zijn geregistreerd of in
      aanmerking komen om te worden ingeschreven overeenkomstig de krachtens artikel 4, tweede lid, onderdeel b, van
      [richtlijn 90/427/EEG](31990L0427) vastgestelde voorschriften en die zijn geïdentificeerd door middel van een
      hippisch paspoort;



              slachtpaarden:

                paardachtigen die zijn bestemd om rechtstreeks dan wel via een verzamelcentrum naar een slachthuis te
      worden gebracht om daar te worden geslacht;



              fok- en gebruikspaarden:

                paardachtigen, niet zijnde geregistreerde paarden en slachtpaarden;




                *slachtdieren:*


                dieren die kennelijk bestemd zijn om te worden geslacht;




                *broedeieren:*


                eieren van pluimvee, bestemd om te worden bebroed;




                *sperma:*


                rundersperma, varkenssperma alsmede sperma van schapen, geiten en eenhoevige dieren als bedoeld in
      [artikel 9.1][ref4];




                *embryo's:*


                runderembryo's en embryo's van varkens, schapen, geiten en eenhoevige dieren als bedoeld in
      [artikel 10.1][ref5];




                *eicellen:*


                eicellen van varkens, schapen, geiten en eenhoevige dieren;




                *producten:*


                sperma, eicellen, embryo's en broedeieren;




                *inspectiepost:*


                op Nederlands grondgebied gelegen inspectiepost aan de grens die voldoet aan de bij of krachtens artikel
      6 van [richtlijn 91/496/EEG](31991L0496) dan wel bij of krachtens artikel 6 van [richtlijn 97/78/EG](31997L0078)
      gestelde voorschriften en uit dien hoofde overeenkomstig artikel 6 van [richtlijn 91/496/EEG](31991L0496),
      onderscheidenlijk artikel 6 van [richtlijn 97/78/EG](31997L0078) is aangewezen en erkend voor de controle van
      bepaalde soorten dieren of producten;




                *douane-entrepot:*


                opslagruimte als bedoeld in [Verordening (EEG) nr. 2913/92](31992R2913) van de Raad van de Europese
      Gemeenschappen van 12 oktober 1992 (PbEG L 302);




                *vrij entrepot:*


                opslagruimte als bedoeld in [Verordening (EEG) nr. 2913/92](31992R2913) van de Raad van de Europese
      Gemeenschappen van 12 oktober 1992 (PbEG L 302);




                *ruimte voor tijdelijke opslag:*


                opslagruimte als bedoeld in artikel 185 van de [Verordening (EEG) nr. 2454/93](31993R2454) van de
      Commissie van de Europese Gemeenschappen van 2 juli 1993 (PbEG L 302);




                *bedrijf:*


                op Nederlands grondgebied gelegen landbouwbedrijf of handelaarsstal, waar gewoonlijk dieren, niet zijnde
      paardachtigen, worden gehouden of gefokt alsmede op Nederlands grondgebied gelegen landbouwbedrijf of entrainement,
      stal, iedere ruimte of iedere inrichting waar gewoonlijk paardachtigen worden gehouden of gefokt, ongeacht hun
      gebruik;




                *instelling, instituut of centrum:*


                instelling, instituut of centrum als bedoeld in artikel 2, eerste lid, onderdeel c, van [richtlijn 92/65/
      EEG](31992L0065);




                *verzamelcentrum:*


                plaats, met inbegrip van bedrijven of markten, waar dieren afkomstig van verschillende bedrijven van
      oorsprong worden samengebracht met het oogmerk om een voor het handelsverkeer bestemde partij te vormen;




                *partij:*


                hoeveelheid dieren of producten van dezelfde soort, waarvoor eenzelfde certificaat of document zoals
      voorgeschreven in deze regeling geldt, die met hetzelfde vervoermiddel wordt vervoerd en afkomstig is uit hetzelfde
      land of gedeelte van een land;




                *importeur:*


                natuurlijke persoon of rechtspersoon die een partij met het oog op het brengen in Nederland bij een
      erkende inspectiepost ten onderzoek aanbiedt, dan wel diens gemachtigde;



              belanghebbende bij de lading:

                belanghebbende bij de lading als bedoeld in artikel 2, tweede lid, onderdeel e, van [richtlijn 97/78/
      EG](31997L0078);




                *handelaar:*


                elke natuurlijke persoon of rechtspersoon die een partij met het oog op de verhandeling onder zich heeft,
      dan wel diens gemachtigde;




                *raszuiver:*


                ingeschreven in:
                een stamboek als bedoeld in artikel 1 van [Richtlijn nr. 77/504/EEG](31977L0504) van de Raad van de
      Europese Gemeenschappen van 25 juli 1977 betreffende raszuivere fokrunderen (PbEG L 206), artikel 1 van [Richtlijn
      nr. 88/661/EEG](31988L0661) van de Raad van de Europese Gemeenschappen van 19 december 1988 betreffende de
      zoötechnische normen die gelden voor fokvarkens (PbEG L 382), artikel 2 van [Richtlijn nr. 89/361/EEG](31989L0361)
      van de Raad van de Europese Gemeenschappen van 30 mei 1989 betreffende raszuivere fokschapen en -geiten (PbEG L
      153) of artikel 2 van [Richtlijn nr. 90/427/EEG](31990L0427) van de Raad van de Europese Gemeenschappen van 26 juni
      1990 tot vaststelling van zoötechnische en genealogische voorschriften in het intracommunautaire handelsverkeer in
      paardachtigen (PbEG L 224);
      een stamboek of register als bedoeld in artikel 1 van [Richtlijn nr. 91/174/EEG](31991L0174) van de Raad van de
      Europese Gemeenschappen van 25 maart 1991 inzake zoötechnische en genealogische voorschriften voor de handel in
      rasdieren en tot wijziging van de [Richtlijnen 77/504/EEG](31977L0504) en [90/425/EEG](31990L0425) (PbEG L 85), of
      een stamboek of register als bedoeld in artikel 4, eerste gedachtenstreepje, van [Richtlijn nr. 94/28/EG]
      (31994L0028) van de Raad van de Europese Unie van 23 juni 1994 tot vaststelling van de beginselen inzake de
      zoötechnische en genealogische voorschriften voor de invoer uit derde landen van dieren, alsmede van sperma,
      eicellen en embryo's en tot wijziging van [Richtlijn 77/504/EEG](31977L0504) betreffende raszuivere fokrunderen
      (PbEG L 178), dan wel, zolang de lijst, bedoeld in artikel 3, eerste lid, van deze richtlijn nog niet is
      vastgesteld, in een stamboek of register in een derde land;




                *hybride:*


                ingeschreven in:
                een register als bedoeld in artikel 1 van [Richtlijn nr. 88/661/EEG](31988L0661) van de Raad van de
      Europese Gemeenschappen van 19 december 1988 betreffende de zoötechnische normen die gelden voor fokvarkens (PbEG
      L 382);
      een register als bedoeld in artikel 4, eerste gedachtenstreepje, van [Richtlijn nr. 94/28/EG](31994L0028) van
      de Raad van de Europese Unie van 23 juni 1994 tot vaststelling van de beginselen inzake de zoötechnische en
      genealogische voorschriften voor de invoer uit derde landen van dieren, alsmede van sperma, eicellen en embryo's
      en tot wijziging van [Richtlijn 77/504/EEG](31977L0504) betreffende raszuivere fokrunderen (PbEG L 178), dan wel,
      zolang de lijst, bedoeld in artikel 3, eerste lid, van deze richtlijn nog niet is vastgesteld, in een register in
      een derde land;



              werkelijke kosten:

                de kosten die betrekking hebben op de administratiekosten, de loonkosten en de sociale premies van de met
      de onderzoeken en keuringen belaste personen van de RVV als mede de kosten van laboratoriumonderzoek.




      2 In afwijking van het eerste lid wordt voor de toepassing van de [afdelingen 2][ref6], [3][ref7], [4][ref8] en
      [7 van hoofdstuk 2][ref9], onder dieren verstaan vee, pluimvee, apen, hoefdieren, bijen, honden, katten, fretten en
      lagomorfen met gezondheidscertificaat.

      3 Voor de toepassing van de [afdelingen 5][ref10] en [6 van hoofdstuk 2][ref11] worden onder dieren mede verstaan
      de dieren, bedoeld in artikel 13, eerste lid, van [richtlijn 92/65/EEG](31992L0065) en worden onder producten mede
      verstaan de producten, bedoeld in artikel 13, eerste lid, van [richtlijn 92/65/EEG](31992L0065).

      4 Voor de toepassing van [hoofdstuk 2][ref12] wordt onder ‘keuringsdierenarts’ mede verstaan degene die namens de
      keuringsdierenarts onder diens gezag en verantwoordelijkheid optreedt.

      5 Voor de toepassing van de [artikelen 3.13][ref13], [4.8][ref14], [7.7][ref15] en [7a.1][ref16] wordt, zolang de
      daarin vermelde lijsten, garanties, voorschriften, specifieke bepalingen of uitvoeringsbepalingen nog niet zijn
      vastgesteld, daaronder begrepen, voor zover van toepassing, de lijsten, garanties, voorschriften, bepalingen of
      uitvoeringsbepalingen van beschikking 79/542/EEG.


