        artikel: '1.1'
        hoofdstuk: '1'
  - number: '6.2'
    text: |-
      1 Als bewijsstuk, bedoeld in [artikel 2.4, eerste lid, onderdeel a][ref1], wordt met het oog op het anders dan in
      doorvoer buiten Nederland brengen van pluimvee, bestemd voor een lid-staat, vastgesteld het gezondheidscertificaat
      dat op grond van artikel 17 van [richtlijn 90/539/EEG](31990L0539) voor de desbetreffende soort pluimvee is
      voorgeschreven.

      2 Indien het pluimvee bestemd is voor Finland of Zweden is, voor zover van toepassing, voldaan aan artikel 3,
      eerste lid, van beschikking 2003/644/EG of artikel 5, eerste lid, van beschikking 2003/644/EG.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel6.2
    references:
