  - number: '8.4'
    text: |-
      1 Indien een partij is verzonden vanuit een lid-staat en bestemd is voor Nederland of een lid-staat, gaat zij
      vergezeld van:

      a. het certificaat dat op grond van artikel 5, eerste lid, van [richtlijn 92/65/EEG](31992L0065) is voorgeschreven,
      indien het apen betreft;

      b. het certificaat dat op grond van artikel 6, onderdeel A, eerste lid, onderdeel e, van [richtlijn 92/65/EEG]
      (31992L0065) is voorgeschreven, indien het hoefdieren betreft;

      c. het gezondheidscertificaat dat op grond van artikel 8, onderdeel b, van [richtlijn 92/65/EEG](31992L0065) is
      voorgeschreven, indien het bijen betreft of

      d. het gezondheidscertificaat dat op grond van artikel 9, tweede lid, van [richtlijn 92/65/EEG](31992L0065) is
      voorgeschreven, indien het lagomorfen betreft.

      2 Indien fretten worden verzonden vanuit een lidstaat en bestemd zijn voor Nederland of een lidstaat, voldoen zij
      aan artikel 10, tweede lid, van [richtlijn 92/65/EEG](31992L0065).

      3 Indien honden of katten worden verzonden vanuit een lidstaat en bestemd zijn voor Nederland of een lidstaat,
      voldoen zij aan:

      a. artikel 10, tweede lid, van [richtlijn 92/65/EEG](31992L0065), indien het honden of katten betreft, bestemd voor
      andere lidstaten dan het Verenigd Koninkrijk, Ierland, Malta of Zweden;

      b. artikel 10, derde lid, van [richtlijn 92/65/EEG](31992L0065) is, indien het honden of katten betreft, bestemd
      voor het Verenigd Koninkrijk, Ierland, Malta of Zweden.
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel8.4
  - number: '8.5'
    text: |-
      1 De partij dieren, niet zijnde dieren als bedoeld in bijlage I bij [richtlijn 2004/68/EG](32004L0068), is
      verzonden vanuit een derde land of deel van een derde land dat voor de betrokken diersoort is vermeld op de lijst,
      bedoeld in artikel 17, tweede lid, onderdeel a, van [richtlijn 92/65/EEG](31992L0065), dan wel indien die lijst
      voor de betrokken diersoort nog niet is vastgesteld, het brengen in Nederland van die dieren:

      a. voor zover zij zijn bestemd voor Nederland, is toegestaan vanuit een derde land of een deel van een derde
      land**op grond van de onderhavige regeling;

      b. voor zover zij zijn bestemd voor een lidstaat, is toegestaan vanuit een derde land of een deel van een derde
      land waaruit de lidstaat de invoer toestaat.

      2 De partij dieren, niet zijnde dieren als bedoeld in bijlage I bij [richtlijn 2004/68/EG](32004L0068), gaat
      vergezeld van het gezondheidscertificaat, bedoeld in artikel 17, tweede lid, onderdeel b, van [richtlijn 92/65/EEG]
      (31992L0065), dan wel indien dat gezondheidscertificaat voor de betrokken diersoort nog niet is vastgesteld, gaan
      de dieren vergezeld van:

      a. voor zover zij zijn bestemd voor Nederland, een certificaat dat een verklaring bevat van de officiële dierenarts
      dat is voldaan aan hoofdstuk II van [richtlijn 92/65/EEG](31992L0065), alsmede, indien het apen, hoefdieren,
      honden, katten en lagomorfen betreft, aan de voorschriften voor het brengen in Nederland van de betrokken dieren
      uit derde landen op grond van [hoofdstuk 2][ref1] van de onderhavige regeling;

      b. voor zover zij zijn bestemd voor een lidstaat, een certificaat dat een verklaring bevat van de officiële
      dierenarts dat is voldaan aan de voorschriften van de lidstaat van bestemming.

      3 Indien de partij dieren, niet zijnde dieren als bedoeld in bijlage I bij [richtlijn 2004/68/EG](32004L0068),
      is bestemd voor Finland of Zweden, blijkt uit de in het tweede lid bedoelde certificaten dat de partij ten minste
      voldoet aan de voorschriften die gelden met betrekking tot de invoer van de betrokken dieren in Finland of Zweden
      uit lidstaten.

      4 Aan de partij landbouwhuisdieren, bedoeld in artikel 1 van [richtlijn 96/22/EG](31996L0022), zijn geen stoffen
      toegediend, die ingevolge artikel 3, onderdeel a, van die richtlijn niet aan landbouwhuisdieren mogen worden
      toegediend, tenzij aan de voorwaarden ingevolge artikel 11 van genoemde richtlijn is voldaan.

      5 Dit artikel is niet van toepassing op het brengen in Nederland van bijen, hommels of vogels uit derde landen.

      6 Ten aanzien van honden, katten of fretten wordt, onverminderd het eerste en tweede lid, voldaan aan artikel 16,
      tweede en derde alinea, van [richtlijn 92/65/EEG](31992L0065).


