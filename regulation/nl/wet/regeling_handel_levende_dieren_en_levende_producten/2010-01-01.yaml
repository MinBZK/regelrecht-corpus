  - number: 2.50b
    text: |-
      Opslag van een partij die bestemd is voor een derde land en die niet voldoet aan de in deze regeling voor het
      desbetreffende product gestelde voorschriften voor het brengen op Nederlands grondgebied, vindt slechts plaats
      in een op grond van [artikel 2.50c, derde lid][ref1], erkend douane-entrepot of vrij entrepot, mits de minister,
      hiervoor toestemming heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.50c
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel2.50b
    references:
      - id: ref1
        bwb_id: BWBR0007049
        artikel: 2.50c
        hoofdstuk: '2'
        paragraaf: 2a
        afdeling: '6'
  - number: 2.50c
    text: |-
      1 Een douane-entrepot, ruimte voor tijdelijke opslag, dan wel vrij entrepot als bedoeld in [artikel 2.50a][ref1]
      wordt slechts geregistreerd, indien de opslagfaciliteit:

      a. voor zover van toepassing, op grond van de betrokken regelgeving is erkend voor de opslag van de betrokken
      producten;

      b. beschikt over een geldige vergunning als bedoeld in artikel 100 van [Verordening (EEG) nr. 2913/92](31992R2913)
      van de Raad van de Europese Gemeenschappen van 12 oktober 1992 (PbEG L 302), een goedkeuring als bedoeld in artikel
      185 van [Verordening (EEG) nr. 2454/93](31993R2454) van de Commissie van de Europese Gemeenschappen van 2 juli 1993
      (PbEG L 253), onderscheidenlijk een vergunning als bedoeld in artikel 603, lid 3, van laatstgenoemde verordening;

      c. beschikt over geschikte lokalen die uitsluitend worden gebruikt door de keuringsdierenarts en de onder zijn
      verantwoordelijkheid werkzame personen;

      d. ten behoeve van de VWA over de volgende voorzieningen beschikt die om niet ter beschikking worden gesteld:

      1º. indien de keuringsdierenarts of de onder zijn verantwoordelijkheid werkzame personen gewoonlijk meer dan 2 uur
      per dag op de opslagfaciliteit aanwezig zijn:

        - een afsluitbare ruimte met een afsluitbare kast, een bureau, stoelen en de door de VWS gewenste
      telecommunicatiemiddelen;
        - een kleedruimte met wasgelegenheid en toilet;
        - indien gewoonlijk meer dan vier medewerkers van de VWA aanwezig zijn, een verblijfruimte ingericht met voldoende
      stoelen en tafels;

      2º. Indien de keuringsdierenarts of de onder zijn verantwoordelijkheid werkzame personen gewoonlijk minder dan 2
      uur per dag op de opslagfaciliteit aanwezig zijn:

        - een afsluitbare kast;
        - de door de VWA gewenste telecommunicatiemiddelen.

      2 In een douane-entrepot, ruimte voor tijdelijke opslag, dan wel vrij entrepot als bedoeld in
      [artikel 2.50a][ref2]:

      a. is iedere partij gedurende de opslag voorzien van een gesloten verpakking en duidelijk geïdentificeerd door
      middel van het nummer van het bij de partij behorende certificaat, bedoeld in [artikel 2.46, eerste lid][ref3];

      b. zijn uitsluitend partijen als bedoeld in [artikel 2.50a][ref4] opgeslagen.

      3 Erkenning van een douane-entrepot of vrij entrepot als bedoeld in [artikel 2.50b][ref5] vindt slechts plaats,
      indien het entrepot:

      a. beschikt over een geldige vergunning als bedoeld in artikel 100 van [Verordening (EEG) nr. 2913/92](31992R2913)
      van de Raad van de Europese Gemeenschappen van 12 oktober 1992 (PbEG L 302), onderscheidenlijk een vergunning als
      bedoeld in artikel 603, lid 3, van [Verordening (EEG) nr. 2454/93](31993R2454) van de Commissie van de Europese
      Gemeenschappen van 2 juli 1993 (PbEG L 253);

      b. voor zover van toepassing, op grond van de betrokken regelgeving is erkend voor de opslag van de betrokken
      producten, dan wel, indien voor de opslag van de betrokken producten geen voorschriften voor de erkenning van
      inrichtingen gelden, aan hoofdstuk I van bijlage II bij verordening (EG) nr. 852/2004 van het Europees Parlement en
      de Raad van de Europese Unie van 29 april 2004 inzake levensmiddelenhygiëne (PbEU L 226);

      c. beschikt over geschikte lokalen die uitsluitend worden gebruikt door de keuringsdierenarts en de onder zijn
      verantwoordelijkheid werkzame personen;

      d. kan worden afgesloten met een ambtelijk slot, en

      e. ten behoeve van de VWA over de in het eerste lid, onderdeel d, genoemde voorzieningen beschikt die om niet ter
      beschikking worden gesteld.

      4 In een douane-entrepot of vrij entrepot waar producten als bedoeld in [artikel 2.50b][ref6] zijn opgeslagen:

      a. is iedere partij bij inslag en gedurende de opslag voorzien van een gesloten verpakking met daarop een
      vermelding van het land van oorsprong en de aard van het product en duidelijk geïdentificeerd door middel van het
      nummer van het bij de partij behorende certificaat, bedoeld in [artikel 2.46, eerste lid][ref7];

      b. zijn partijen als bedoeld in [artikel 2.50b][ref8] onderling ruimtelijk van elkaar opgeslagen en zijn, indien
      in dat entrepot tevens partijen als bedoeld in [artikel 2.50a, eerste lid][ref9], zijn opgeslagen, die partijen in
      andere lokalen opgeslagen dan partijen als bedoeld in [artikel 2.50b][ref10];

      c. ondergaat een partij als bedoeld in [artikel 2.50b][ref11] geen andere vorm van goederenbehandeling dan die
      welke noodzakelijk is voor de opslag of voor splitsing van de partij in meerdere partijen zonder wijziging van
      de verpakking;

      d. is iedere partij, bedoeld in [artikel 2.50b][ref12], bij uitslag voorzien van een gesloten verpakking met daarop
      een vermelding van het land van oorsprong en de aard van het product.

      5 De exploitant of de eigenaar, dan wel diens vertegenwoordiger van een douane-entrepot, ruimte voor tijdelijke
      opslag, dan wel vrij entrepot draagt er zorg voor dat:

      a. een boekhouding wordt gevoerd waarin dagelijks aantekening wordt gemaakt van de partijen die de opslagfaciliteit
      binnenkomen en verlaten, en waarmee de keuringsdierenarts op enig moment een overzicht kan worden geboden van de in
      het entrepot opgeslagen partijen;

      b. van iedere ingeslagen partij het certificaat, bedoeld in [artikel 2.46, eerste lid][ref13], gedurende drie jaren
      na uitslag wordt bewaard;

      c. het entrepot voldoet aan het eerste, onderscheidenlijk derde lid;

      d. in de opslagfaciliteit opgeslagen partijen voldoen aan het tweede, onderscheidenlijk vierde lid;

      e. indien het een douane-entrepot of een vrij entrepot als bedoeld in [artikel 2.50b][ref14] betreft, de toegang
      van het entrepot duidelijk wordt voorzien van de vermelding ‘vrij entrepot, uitsluitend bestemd voor de opslag van
      niet-EG-waardige producten van dierlijke oorsprong’, en

      f. de keuringsdierenarts alle medewerking wordt verleend die deze redelijkerwijs voor de vervulling van zijn taken
      in het kader van de inslag, opslag of uitslag van partijen noodzakelijk acht en dat diens aanwijzingen ter zake
      door het personeel van de opslagfaciliteit worden opgevolgd.

      6 Een douane-entrepot, ruimte voor tijdelijke opslag of vrij entrepot staat onder permanente controle van de
      keuringsdierenarts.


