  - number: '3.4'
    text: |-
      Onverminderd [artikel 3.3][ref1], is op grond van het onderzoek, bedoeld in [artikel 2.5][ref2], gebleken dat:

      a. indien de runderen verblijven op een verzamelcentrum:

        - dit centrum voldoet aan
      __REF000___________________________________________________________________________________________________________
      __________ en is erkend;
        - de runderen voldoen aan artikel 11, eerste lid, onderdeel e, van [richtlijn 64/432/EEG](31964L0432);
        - hiervan aantekening is gemaakt op het gezondheidscertificaat, bedoeld in [artikel 3.2][ref4];

      b. indien de runderen zijn aangekocht bij een handelaar:

        - deze handelaar voldoet aan [artikel 3.15, eerste lid][ref5], en uit dien hoofde is erkend overeenkomstig
      [artikel 3.15, eerste lid][ref6];
        - de runderen voldoen aan artikel 13, eerste lid, onderdeel a, van [richtlijn 64/432/EEG](31964L0432);
        - voor zover van toepassing, de bedrijfsruimte van de handelaar voldoet aan de [artikelen 3.15, tweede lid][ref7],
      en [3.17, tweede lid][ref8], en uit dien hoofde is erkend overeenkomstig [artikel 3.15 tweede lid][ref9]; – hiervan
      aantekening is gemaakt op het gezondheidscertificaat, bedoeld in [artikel 3.2][ref10];

      c. indien de vervoersafstand meer dan 50 km bedraagt:

        - de runderen worden vervoerd door een vervoerder waaraan een vergunning is verleend als bedoeld in artikel 10 of
      artikel 11 van verordening (EG) 1/2005;
        - hiervan aantekening is gemaakt op het gezondheidscertificaat, bedoeld in [artikel 3.2][ref11].

      d. indien de runderen zijn aangekocht op een bedrijf waarop fok- en gebruiksrunderen zijn binnengebracht
      afkomstig uit derde landen, deze fok- en gebruiksrunderen overeenkomstig [artikel 3.13c, eerste lid][ref12], aan
      het beslag zijn toegevoegd dan wel gedurende een periode van 30 dagen te rekenen vanaf de dag waarop de fok- en
      gebruiksrunderen op het bedrijf zijn binnengebracht overeenkomstig [artikel 3.13, tweede lid][ref13], afgezonderd
      worden gehouden van de op dat bedrijf aanwezige dieren;

      e. in voorkomend geval, de runderen voldoen aan de met betrekking tot de in bijlage E (II) van [richtlijn
      64/432/EEG](31964L0432) vermelde ziekten gestelde aanvullende garanties, bedoeld in artikel 9, tweede lid,
      en in artikel 10, tweede lid, van [richtlijn 64/432/EEG](31964L0432) en hiervan aantekening is gemaakt op het
      gezondheidscertificaat, bedoeld in [artikel 3.2][ref14].


