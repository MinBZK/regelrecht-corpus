  - number: '2.53'
    text: |-
      Het bewijsstuk, bedoeld in [artikel 2.52][ref1], wordt slechts afgegeven indien op grond van een van Rijkswege
      ingesteld onderzoek is gebleken dat voldaan wordt aan, voor zover van toepassing, de [artikelen 2.54][ref2] en
      [2.55][ref3] en aan:

      a. de [artikelen 3.3][ref4] en [3.4 van afdeling 2 van hoofdstuk 3][ref5], indien het runderen betreft;

      b. de [artikelen 4.3][ref6] en [4.4 van afdeling 2 van hoofdstuk 4][ref7], indien het varkens betreft;

      c. de [artikelen 5.3][ref8] en [5.4 van afdeling 2 van hoofdstuk 5][ref9], indien het paardachtigen betreft;

      d. voor zover van toepassing de [artikelen 6.3][ref10], [6.4][ref11] of
      [6.5 van afdeling 2 van hoofdstuk 6][ref12], indien het pluimvee of broedeieren betreft;

      e. de [artikelen 7.3][ref13] en [7.4 van afdeling 2 van hoofdstuk 7][ref14], indien het schapen of geiten betreft;

      f. de [artikelen 9.3, onderdelen a of b][ref15] en [9.4, onderdeel a, van afdeling 2 van hoofdstuk 9][ref16],
      indien het rundersperma, respectievelijk varkenssperma betreft;

      g. [artikel 10.3 van afdeling 2 van hoofdstuk 10][ref17], indien het runderembryo's betreft.


