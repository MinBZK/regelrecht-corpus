  - number: '8.6'
    text: |-
      1 Een instelling, instituut of centrum wordt door de minister voor de toepassing van deze regeling erkend indien
      uit een door de keuringsdierenarts ingesteld onderzoek is gebleken dat de instelling, het instituut of het centrum
      voldoet aan bijlage C, punt 1 en 2, van [richtlijn 92/65/EEG](31992L0065).

      2 Een erkenning als bedoeld in het eerste lid wordt door de minister voor bepaalde tijd ingetrokken in het geval,
      bedoeld in bijlage C, punt 6, onder a, van [richtlijn 92/65/EEG](31992L0065).

      3 Een erkenning als bedoeld in het eerste lid wordt door de minister ingetrokken indien na aangifte van verdenking
      op een van de ziekten vermeld in de bijlagen A en B van [richtlijn 92/65/EEG](31992L0065) het laboratoriumonderzoek
      voor de verwekkers van vorenbedoelde ziekten positieve resultaten hebben gegeven.

      4 Een erkenning als bedoeld in het eerste lid wordt, nadat zij door de minister voor bepaalde tijd is ingetrokken,
      opnieuw verleend, indien na aangifte van verdenking op een van de ziekten vermeld in de bijlagen A en B van
      [richtlijn 92/65/EEG](31992L0065) het laboratoriumonderzoek voor de verwekkers van vorenbedoelde ziekten negatieve
      resultaten hebben gegeven.

      5 Een erkenning als bedoeld in het eerste lid wordt, nadat zij door de minister is ingetrokken, opnieuw verleend,
      indien na de uitroeiïng van de besmettingshaarden, opnieuw wordt voldaan aan punt 1, met uitzondering van onderdeel
      f, van bijlage C van [richtlijn 92/65/EEG](31992L0065) wordt voldaan.
