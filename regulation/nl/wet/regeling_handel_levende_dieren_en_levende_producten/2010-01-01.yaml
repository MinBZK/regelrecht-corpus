  - number: '9.4'
    text: |-
      Onverminderd [artikel 9.3][ref1] is op grond van het onderzoek, bedoeld in [artikel 2.5][ref2], gebleken dat:

      a. het rundersperma is verkregen, behandeld en opgeslagen in een runderspermawincentrum dat is erkend
      overeenkomstig [artikel 9 van het Besluit eisen dierlijk sperma en spermawincentra][ref3] of is opgeslagen in
      een runderspermaopslagcentrum dat is erkend overeenkomstig [artikel 9.10a][ref4], met inachtneming van artikel 2,
      tweede lid, van richtlijn nr. 2003/43/EG;

      b. het varkenssperma is verkregen en behandeld in een varkensspermawincentrum dat is erkend overeenkomstig
      [artikel 3 van het Besluit eisen dierlijk sperma en spermawincentra][ref5];

      c. het sperma van schapen, geiten of paardachtigen is verkregen en behandeld in een wincentrum of -station dat is
      erkend overeenkomstig [artikel 9.10, eerste lid, onderdeel a][ref6], of

      d. indien het sperma van schapen of geiten betreft, het sperma is verkregen en behandeld in een bedrijf dat voldoet
      aan de voorschriften die in [Richtlijn nr. 91/68/EEG](31991L0068) van de Raad van de Europese Gemeenschappen van
      28 januari 1991 inzake veterinairrechtelijke voorschriften voor het intracommunautaire handelsverkeer in schapen en
      geiten (PbEG L 46) daaromtrent zijn gesteld.


