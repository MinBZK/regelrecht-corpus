    text: |-
      Een partij als bedoeld in [artikel 2.43, tweede lid][ref1], wordt na het verlaten van de inspectiepost in
      verzegelde en lekvrije voertuigen of containers rechtstreeks vervoerd naar de inrichting van oorsprong waar het
      certificaat, bedoeld in [artikel 2.43, tweede lid, onderdeel b][ref2], is afgegeven.


