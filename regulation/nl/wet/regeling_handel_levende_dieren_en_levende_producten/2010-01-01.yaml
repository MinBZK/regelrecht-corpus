      - id: ref2
        bwb_id: BWBR0007049
        artikel: '2.4'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: '2.10'
    text: |-
      De dieren of producten behoeven niet in het kader van een programma tot uitroeiïng van niet in bijlage C bij
      [richtlijn 90/425/EEG](31990L0425) vermelde ziekten te worden vernietigd en er geldt ook overigens geen verbod om
      de desbetreffende dieren of producten in Nederland in de handel te brengen.
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel2.10
  - number: '2.11'
    text: |-
      De partij wordt vervoerd met daarvoor geschikte vervoermiddelen die voorafgaand aan het vervoer van de betreffende
      partij zijn gereinigd en ontsmet.
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel2.11
  - number: '2.12'
    text: |-
      De handelaar is ingeschreven in het in [artikel 2.62, eerste lid][ref1], bedoelde register, terwijl die
      inschrijving niet is getroffen door een beslissing als bedoeld in [artikel 2.62, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.62
      [ref2]: https://wetten.overheid.nl/BWBR0007049#Artikel2.62
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel2.12
    references:
