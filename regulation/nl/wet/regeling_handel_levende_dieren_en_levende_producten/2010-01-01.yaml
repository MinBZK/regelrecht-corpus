  - number: '10.3'
    text: |-
      Op grond van het onderzoek, bedoeld in [artikel 2.5][ref1], is gebleken dat, indien het een partij runderembryo's
      betreft:

      a. de bevruchting door kunstmatige inseminatie of in vitro is geschied, met sperma van een donorstier uit een
      spermacentrum dat door de minister, overeenkomstig [artikel 9.10, eerste lid, onderdeel a, subonderdeel 1][ref2],
      is erkend voor de winning, behandeling en opslag van rundersperma of met overeenkomstig [hoofdstuk 9][ref3],
      ingevoerd rundersperma;

      b. in geval van bevruchting in vitro, deze bevruchting is geschied door een runderembryoproduktieteam;

      c. de runderembryo's zijn verzameld bij runderen die voldoen aan bijlage B van [richtlijn 89/556/EEG](31989L0556);

      d. de runderembryo's door een runderembryoteam zijn verzameld, behandeld, opgeslagen en vervoerd overeenkomstig
      bijlage A, hoofdstuk II, van [richtlijn 89/556/EEG](31989L0556), met dien verstande dat de opslag heeft
      plaatsgevonden in overeenkomstig [artikel 10.10][ref4] erkende opslaglokalen en

      e. door de keuringsdierenarts een verklaring is ontvangen van de teamdierenarts dat het runderembryoteam
      overeenkomstig het bepaalde in onderdeel d heeft gehandeld.


