  - number: '10.5'
    text: |-
      1 Indien een partij die is verzonden vanuit een lid-staat en bestemd is voor Nederland of een lid-staat, gaat zij
      vergezeld van:

      a. het gezondheidscertificaat dat op grond van artikel 6 van [richtlijn 89/556/EEG](31989L0556) is voorgeschreven,
      indien het runderembryo's betreft, of

      b. het gezondheidscertificaat dat op grond van artikel 11, derde lid, derde gedachtenstreepje, van [richtlijn
      92/65/EEG](31992L0065) is voorgeschreven indien het embryo's van schapen, geiten, varkens en paardachtigen betreft.

      2 De partij voldoet aan bijlage VIII, hoofdstuk A, deel I, punt d, van [verordening (EG) nr. 999/2001](32001R0999)
      indien het embryo’s van schapen of geiten betreft.
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel10.5
  - number: '10.6'
    text: |-
      1 De partij is verzonden vanuit een derde land of een deel van een derde land, dat is vermeld op de lijst:

      a. bedoeld in artikel 7, eerste lid, van [richtlijn 89/556/EEG](31989L0556), indien het runderembryo's betreft;

      b. die voor embryo’s van paardachtigen is vastgesteld in bijlage I bij beschikking 2004/211/EG, met dien verstande
      dat eicellen van paardachtigen ook mag zijn verzonden vanuit een land waaruit de definitieve invoer als bedoeld in
      artikel 5 van beschikking 2004/211/EG van geregistreerde paarden en fok- en gebruikspaarden is toegestaan, of

      c. bedoeld in artikel 17, tweede lid, onderdeel a, van [richtlijn 92/65/EEG](31992L0065), indien het sperma van
      varkens, schapen of geiten betreft, met dien verstande dat, indien vorenbedoelde lijst nog niet is vastgesteld,
      de partij uit geen enkel derde land mag zijn verzonden, indien zij voor Nederland is bestemd, en de partij is
      verzonden vanuit een derde land of een deel van een derde land van waaruit de lid-staat van bestemming de invoer
      toestaat, indien zij voor een lid-staat is bestemd.

      2 De partij is verzameld, behandeld en opgeslagen door een runderembryoteam of embryoteam dat is vermeld op de
      lijst, bedoeld in:

      a. artikel 8, eerste lid, van [richtlijn 89/556/EEG](31989L0556), indien het runderembryo's betreft, of

      b. artikel 17, derde lid, onderdeel b, van [richtlijn 92/65/EEG](31992L0065), indien het embryo's van varkens,
      schapen, geiten of paardachtigen betreft.

      3 De partij gaat vergezeld van het gezondheidscertificaat dat op grond van:

      a. artikel 10 van [richtlijn 89/556/EEG](31989L0556) is voorgeschreven, indien het runderembryo's betreft, of

      b. artikel 17, tweede lid, onderdeel b, van [richtlijn 92/65/EEG](31992L0065) is voorgeschreven, indien het
      embryo's van varkens, schapen, geiten of paardachtigen betreft, dan wel, indien vorenbedoeld gezondheidscertificaat
      nog niet is vastgesteld, en:

        - de partij voor Nederland is bestemd, de partij vergezeld gaat van een certificaat dat een verklarig van de
      officiële dierenarts behelst dat de embryo's verkregen, behandeld en opgeslagen zijn op een wijze die tenminste
      gelijkwaardig is aan hetgeen hieromtrent op grond van artikel 11, derde lid, eerste en tweede gedachtenstreepje
      van [richtlijn 92/65/EEG](31992L0065) geldt, dat voldaan is aan artikel 11, derde lid, tweede alinea van [richtlijn
      92/65/EEG](31992L0065) en aan de voorschriften voor het brengen in Nederland van vorenbedoelde embryo's uit derde
      landen op grond van [hoofdstuk 2][ref1] van de onderhavige regeling;
        - de partij voor een lid-staat is bestemd, de partij vergezeld gaat van het certificaat dat door de lid-staat van
      bestemming wordt geëist.

      4 De partij voldoet aan:

      a. de voorwaarden die zijn vastgesteld in en, in voorkomend geval, krachtens artikel 9 van [richtlijn 89/556/EEG]
      (31989L0556), indien het runderembryo’s betreft, of

      b. de voorwaarden die zijn vastgelegd in het gezondheidscertificaat, bedoeld in het derde lid, aanhef en onderdeel
      b, en aan artikel 5 van beschikking 2004/211/EG, indien het embryo’s van paardachtigen betreft, of

      c. bijlage IX, hoofdstuk H, van [verordening (EG) nr. 999/2001](32001R0999) indien het embryo’s van schapen of
      geiten betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Hoofdstuk2
