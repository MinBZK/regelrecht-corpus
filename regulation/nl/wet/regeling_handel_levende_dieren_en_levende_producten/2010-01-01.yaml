  - number: '2.29'
    text: |-
      1 Op grond van de regelgeving van de Raad van de Europese Unie of de Commissie van de Europese Gemeenschappen
      zijn geen maatregelen genomen, houdende de instelling van een verbod om de dieren of producten uit de betrokken
      lid-staat uit te voeren of houdende de machtiging tot de instelling van een verbod om de betreffende dieren of
      producten in Nederland te brengen, noch is de lid-staat van verzending ingevolge deze regelgeving gehouden de
      afgifte van de certificaten of vervoersdocumenten, zulks in verband met het brengen in Nederland op te schorten.

      2 Ingevolge de regelgeving van de lid-staat van verzending is er geen verbod om de betrokken partij op het
      grondgebied van die lid-staat in de handel te brengen.

      3 Ten aanzien van een partij is, in voorkomend geval, voldaan aan de ingevolge artikel 10, derde lid, van
      [richtlijn 90/425/EEG](31990L0425) vastgestelde regelgeving van de Europese Gemeenschap of aan de regelgeving van
      de lid-staat van verzending zelf, in geval van een uitbraak van een epidemische dierziekte in de lid-staat van
      verzending.
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel2.29
  - number: '2.30'
    text: |-
      1 Indien uit de certificaten of documenten, bedoeld in [artikel 2.24, derde lid][ref1], blijkt dat de partij vanuit
      Nederland rechtstreeks naar het derde land wordt gebracht, wordt zij buiten Nederland gebracht via het punt van
      uitgang dat op het certificaat of document, genoemd in de [derde afdeling][ref2] van de [hoofdstukken 3][ref3] tot
      en met [11][ref4], is vermeld.

      2 Indien uit de certificaten of documenten, bedoeld in [artikel 2.22, derde lid][ref5], dan wel de documenten,
      bedoeld in [artikel 2.22, vierde lid][ref6], blijkt dat de partij is verzonden:

      a. vanuit een lid-staat en bestemd is voor een derde land;

      b. vanuit een derde land, bestemd is voor een derde land en via het grondgebied van een lid-staat in Nederland
      wordt gebracht;

      vindt het vervoer naar de plaats waar de partij weer buiten Nederland wordt gebracht onder douanetoezicht plaats.

      3 Indien producten zijn verzonden uit een derde land en via het grondgebied van een lid-staat in Nederland worden
      gebracht, zijn de [artikelen 2.50a][ref7] en [2.50b][ref8] van overeenkomstige toepassing, met dien verstande dat
      de documenten, bedoeld in [artikel 2.50c, tweede lid en vierde lid][ref9], voor de toepassing van deze afdeling de
      certificaten zijn, bedoeld in [artikel 2.22, vierde lid][ref10]..


