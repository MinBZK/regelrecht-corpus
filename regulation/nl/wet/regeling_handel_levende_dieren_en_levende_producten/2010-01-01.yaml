  - number: '1.2'
    text: |-
      1 De bevoegde autoriteit, bedoeld in een communautaire uitvoeringsmaatregel, is de minister.

      2 In afwijking van het eerste lid is, ingeval een communautaire uitvoeringsmaatregel de bevoegde autoriteit een
      taak opdraagt die niet bestaat in het nemen van een besluit, de bevoegde autoriteit de Voedsel en Waren Autoriteit.

      3 De officiële dierenarts, bedoeld in een communautaire uitvoeringsmaatregel, is een dierenarts, verbonden aan de
      Voedsel en Waren Autoriteit.

      4 Een communautaire uitvoeringsmaatregel, of een wijziging daarvan, treedt voor de toepassing van deze regeling in
      werking met ingang van de dag waarop daaraan uiterlijk uitvoering moet zijn gegeven, of bij gebreke daarvan, de dag
      waarop de maatregel is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel1.2
  - number: '2.1'
    text: |-
      1 Het anders dan in doorvoer buiten Nederland brengen van:

        - duiven en loopvogels, bestemd voor een lid-staat, bestemd om via het grondgebied van een lid-staat naar een derde
      land te worden gebracht dan wel bestemd voor een staat niet zijnde een lid-staat die partij is bij het EER-Verdrag;
        - apen, hoefdieren, bijen, honden, katten, fretten en lagomorfen met gezondheidscertificaat en van producten,
      bestemd voor een lid-staat dan wel bestemd om via het grondgebied van een lid-staat naar een derde land te worden
      gebracht en van rundersperma, varkenssperma, runderembryo's en broedeieren, bestemd voor een staat, niet zijnde een
      lid-staat, die partij is bij het EER-Verdrag, of
        - vogels, nertsen en vossen, lagomorfen zonder gezondheidscertificaat alsmede van de dieren en producten, bedoeld
      in artikel 13, eerste lid, van [richtlijn 92/65/EEG](31992L0065), bestemd voor een lid-staat, en
        - producten, genoemd in artikel 1, eerste alinea, van [richtlijn 92/65/EEG](31992L0065), niet zijnde sperma,
      eicellen, embryo's en broedeieren, bestemd voor een lid-staat is verboden.

      2 Het brengen in Nederland van:

        - vee, pluimvee, apen, hoefdieren, bijen, honden, katten, fretten en lagomorfen met gezondheidscertificaat en van
      producten, verzonden vanuit een lid-staat of een andere staat die partij is bij het EER-Verdrag dan wel vanuit een
      derde land en via het grondgebied van een lid-staat in Nederland worden gebracht;
        - vogels, nertsen en vossen, lagomorfen zonder gezondheidscertificaat alsmede van de dieren en producten, bedoeld
      in artikel 13, eerste lid, van [richtlijn 92/65/EEG](31992L0065), die zijn verzonden vanuit een lid-staat of een
      andere staat die partij is bij het EER-Verdrag dan wel vanuit een derde land en via het grondgebied van een lid-
      staat in Nederland worden gebracht en bestemd zijn voor Nederland, een lid-staat of een andere staat die partij is
      bij het EER-Verdrag;
        - dieren en producten, die zijn verzonden vanuit een derde land en via Nederland voor het eerst in de gebieden
      waarop het Verdrag betreffende de Europese Unie van toepassing is worden gebracht,
        - entstoffen en
        - producten, genoemd in artikel 1, eerste alinea, van [richtlijn 92/65/EEG](31992L0065), niet zijnde sperma,
      eicellen, embryo's en broedeieren, is verboden.
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel2.1
  - number: '2.2'
    text: |-
      1 Van het verbod, bedoeld in [artikel 77, eerste lid, van de wet][ref1], wordt vrijstelling verleend voor de
      rechtstreekse uitvoer naar derde landen van pluimvee en van vee, niet zijnde runderen, varkens, schapen, geiten en
      paardachtigen en voor de uitvoer naar een staat, niet zijnde een lid-staat, die partij is bij het EER-verdrag, van
      vee, niet zijnde runderen, varkens, schapen, geiten, en paardachtigen.

      2 Onverminderd het eerste lid wordt van de verboden, bedoeld in [artikel 77, eerste lid, van de wet][ref2] en in
      __REF001___________________________________________________________________________________________________________
      _________________, vrijstelling verleend:

        - voor wat het anders dan in doorvoer buiten Nederland brengen van dieren of producten betreft, die niet voldoen
      aan de van toepassing zijnde communautaire voorschriften en die zijn bestemd om via het grondgebied van een lid-
      staat naar een derde land te worden gebracht, en
        - voor wat het brengen in Nederland van dieren of producten betreft, die niet voldoen aan de van toepassing zijnde
      communautaire voorschriften en die zijn bestemd om via het grondgebied van een lid-staat naar een derde land te
      worden gebracht, op voorwaarde dat de minister en de bevoegde autoriteit van de lid-staat van doorvoer vooraf
      toestemming hebben gegeven voor het vervoer van de dieren of producten over Nederlands grondgebied, respectievelijk
      het grondgebied van de lid-staat van doorvoer.

      3 Onverminderd het tweede lid wordt van de verboden, bedoeld
      in [artikel 2.1, eerste lid, derde gedachtenstreepje][ref4] en
      [artikel 2.1, tweede lid, tweede gedachtenstreepje][ref5], vrijstelling verleend, op voorwaarde dat:

      a. in het geval, bedoeld in [artikel 2.1, eerste lid, derde gedachtenstreepje][ref6], voldaan is aan
      [afdeling 6 van hoofdstuk 8][ref7], [afdeling 5 van hoofdstuk 9][ref8], [afdeling 5 van hoofdstuk 10][ref9],
      respectievelijk [afdeling 5 van hoofdstuk 11][ref10];

      b. in het geval, bedoeld in [artikel 2.1, tweede lid, tweede gedachtenstreepje][ref11], voldaan is aan
      [afdeling 7 van hoofdstuk 8][ref12], [afdeling 6 van hoofdstuk 9][ref13], [afdeling 6 van hoofdstuk 10][ref14],
      respectievelijk [afdeling 6 van hoofdstuk 11][ref15], één en ander indien de vogels, nertsen en vossen, lagomorfen
      zonder gezondheidscertificaat alsmede de dieren en producten, bedoeld in artikel 13, eerste lid, van [richtlijn
      92/65/EEG](31992L0065) zijn verzonden vanuit een lid-staat dan wel vanuit een derde land en via het grondgebied van
      een lid-staat in Nederland worden gebracht.

      4 Onverminderd het tweede lid wordt van het verbod, bedoeld in [artikel 2.1, eerste en tweede lid][ref16],
      vrijstelling verleend voor het zonder handelsoogmerk anders dan in doorvoer buiten Nederland en in Nederland
      brengen van honden, katten of fretten, bedoeld in [verordening (EG) nr. 2160/2003](32003R2160), indien is voldaan
      aan [afdeling 8 van hoofdstuk 8][ref17].

      5 Onverminderd het tweede en derde lid wordt van het verbod, bedoeld in
      [artikel 2.1, tweede lid, eerste gedachtenstreepje][ref18], vrijstelling verleend terzake van de doorvoer door
      Baarle-Nassau van:

      a. vee, dat door veehouders, gevestigd in de in Nederland gelegen enclaves van de Belgische gemeente Baarle-
      Hertog, is aangekocht van dan wel verkocht aan in België gevestigde personen en dat ter levering van België naar
      vorenbedoelde enclaves, onderscheidenlijk van deze enclaves naar België wordt vervoerd;

      b. vee, dat van de in onderdeel a bedoelde enclaves naar België wordt vervoerd ter beweiding of beakkering van
      landerijen aldaar of dat na deze beweiding of beakkering van België naar vorenbedoelde enclaves wordt teruggevoerd,
      daaronder begrepen de dieren, welke gedurende het laatste jaar in België uit dit vee zijn geboren.

      6 Onverminderd de voorgaande leden wordt van de verboden, bedoeld in [artikel 2.1, eerste en tweede lid][ref19],
      en in [artikel 77, eerste lid van de wet][ref20], vrijstelling verleend voor het anders dan in doorvoer buiten
      Nederland brengen en het in Nederland brengen van pluimvee, dat bestemd is voor tentoonstellingen, concoursen of
      wedstrijden.


