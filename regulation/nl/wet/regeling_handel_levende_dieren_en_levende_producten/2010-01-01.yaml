  - number: '2.50'
    text: |-
      Degene die voornemens is een partij producten in te slaan in of uit te slaan uit een douane-entrepot, een ruimte
      voor tijdelijke opslag of een vrij entrepot geeft hiervan uiterlijk tot 14.00 uur op de werkdag voorafgaand aan de
      dag van in- of uitslag melding aan de VWA binnen wiens kring de opslagfaciliteit is gelegen, onder vermelding van
      de naam en het adres van de opslagfaciliteit, de dag van in- of uitslag en de aard en hoeveelheid van de producten.
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel2.50
  - number: 2.50a
    text: |-
      1 Opslag van een partij die bestemd is:

      a. voor Nederland of een derde land en die voldoet aan de in deze regeling voor het desbetreffende product gesteld
      voorschriften voor het brengen op Nederlands grondgebied, of

      b. voor een lidstaat en die voldoet aan de voorschriften terzake van het brengen van het desbetreffende product op
      het grondgebied van de betreffende lidstaat,

      vindt plaats in een op grond van [artikel 2.50c, eerste lid][ref1], geregistreerd douane-entrepot,
      geregistreerde ruimte voor tijdelijke opslag, dan wel geregistreerd vrij entrepot, dan wel in een op grond van
      [artikel 2.50b][ref2], erkend douane-entrepot of erkend vrij entrepot, mits dat erkend douane-entrepot of erkend
      vrij entrepot beschikt over lokalen waarin de in dit artikellid bedoelde producten gescheiden van de in het tweede
      lid bedoelde producten kunnen worden opgeslagen.

      2 De in het eerste bedoelde opslag, alsmede de opslag, bedoeld in [artikel 2.50b][ref3], vindt slecht plaats indien
      de belanghebbende bij de lading voorafgaand aan de opslag heeft voldaan aan artikel 12, eerste lid, eerste zin, van
      [richtlijn 97/78/EG](31997L0078), met dien verstande dat de bevoegde autoriteit als bedoeld in artikel 12, eerste
      lid, eerste zijn, van [richtlijn 97/78/EG](31997L0078) de minister is.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.50c
      [ref2]: https://wetten.overheid.nl/BWBR0007049#Artikel2.50b
      [ref3]: https://wetten.overheid.nl/BWBR0007049#Artikel2.50b
