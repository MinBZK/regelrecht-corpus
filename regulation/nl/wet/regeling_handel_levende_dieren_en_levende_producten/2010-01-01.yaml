  - number: '2.3'
    text: |-
      1 Van [artikel 77, tweede lid, van de wet][ref1] en
      [artikel 2 van het Besluit uitvoer dieren en producten van dierlijke oorsprong][ref2] wordt vrijstelling verleend,
      voor zover het betreft het voorzien zijn van de dieren, onderscheidenlijk van de zending, van een of meer merken
      die zijn afgegeven op grond van een van Rijkswege ingesteld onderzoek.

      2 Van [artikel 2 van het Besluit uitvoer dieren en producten van dierlijke oorsprong][ref3] wordt vrijstelling
      verleend, voor zover het betreft het vergezeld gaan van de zending vogels, nertsen, vossen, lagomorfen zonder
      gezondheidscertificaat en dieren en producten, bedoeld in artikel 13, eerste lid, van [richtlijn 92/65/EEG]
      (31992L0065) van een of meer bewijsstukken die zijn afgegeven op grond van een van Rijkswege ingesteld onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel77
