  - number: 4.7b
    text: |-
      1 Indien varkens bijeen worden gebracht op een erkend varkensverzamelcentrum dient te worden voldaan aan de
      volgende voorwaarden:

      a. de aanbieder van de varkens stelt de VWA overeenkomstig
      __REF000___________________________________________________________________________________________________________
      __________ voorafgaand aan de aanvoer op het varkensverzamelcentrum door middel van een daartoe verstrekt
      aanvraagformulier in kennis van de voorgenomen aanvoer;

      b. de minister heeft de aanbieder niet schriftelijk in kennis gesteld tegen de aanvoer bezwaar te hebben.

      2 Indien de varkens bijeen worden gebracht ten behoeve van de export dient tevens te worden voldaan aan de volgende
      voorwaarden:

      a. er is voldaan aan artikel 3, tweede lid, onderdelen b, c en d, en artikel 4 van richtlijn nr. 64/432/EEG, en

      b. voorzover de varkens fok- en gebruiksvarkens zijn, hebben de varkens ten minste 30 dagen vóór aanvoer op het
      varkensverzamelcentrum, of, ingeval de varkens minder dan 30 dagen oud zijn, sinds de geboorte op het bedrijf van
      herkomst verbleven.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel41
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel4.7b
