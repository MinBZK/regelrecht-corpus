        paragraaf: '2'
        afdeling: '8'
      - id: ref2
        bwb_id: BWBR0007049
        artikel: '2.62'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '8'
  - number: '2.13'
    text: |-
      1 Op grond van de regelgeving van de Raad van de Europese Unie of de Commissie van de Europese Gemeenschappen geldt
      geen verbod om de dieren of producten anders dan in doorvoer buiten Nederland te brengen.

      2 De verzending van de dieren of producten is in overeenstemming met op grond van artikel 10, vierde lid, van
      [richtlijn 90/425/EEG](31990L0425) door de Commissie van de Europese Gemeenschappen vastgestelde maatregelen.
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel2.13
  - number: '2.14'
    text: |-
      Raszuivere dieren, hybride varkens en producten hiervan gaan vergezeld van de zoötechnische documenten die bij of
      krachtens het [Fokkerijbesluit][ref1] zijn voorgeschreven voor het anders dan in doorvoer buiten Nederland brengen
      van raszuivere dieren, hybride varkens en producten hiervan, bestemd voor een lid-staat.


      [ref1]: https://wetten.overheid.nl/BWBR0006862
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0006862
  - number: '2.15'
    text: |-
      Indien de partij op grond van het onderzoek, bedoeld in [artikel 2.5][ref1], geschikt is bevonden om anders dan in
      doorvoer buiten Nederland te worden gebracht, wordt zij onmiddellijk na het onderzoek, langs de kortste weg naar
      het transportmiddel vervoerd, waarmee zij buiten Nederland zal worden gebracht en wordt zij zo spoedig mogelijk,
      rechtstreeks, buiten Nederland gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.5
    url: https://wetten.overheid.nl/BWBR0007049/2010-01-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0007049
        artikel: '2.5'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: '2.16'
    text: |-
      1 De verboden, bedoeld in [artikel 77, eerste lid, van de wet][ref1], en in
      [artikel 2.1, eerste lid, eerste en tweede gedachtenstreepje][ref2], voor zover deze betrekking hebben op het
      anders dan in doorvoer buiten Nederland brengen van dieren of producten, bestemd voor een derde land, gelden niet,
      indien:

      a. - runderen, varkens, schapen, geiten en paardachtigen vergezeld gaan van een bewijsstuk dat een
      verklaring van de minister bevat, dat tenminste wordt voldaan aan hetgeen in: 1. de [artikelen 3.3][ref3]
      en [3.4 van afdeling 2 van hoofdstuk 3][ref4], indien het runderen betreft; 2. de [artikelen 4.3][ref5]
      en [4.4 van afdeling 2 van hoofdstuk 4][ref6], indien het varkens betreft; 3. de [artikelen 5.3][ref7] en
      [5.4 van afdeling 2 van hoofdstuk 5][ref8], indien het paardachtigen betreft; 4. de [artikelen 7.3][ref9] en
      [7.4 van afdeling 2 van hoofdstuk 7][ref10], indien het schapen of geiten betreft, voor slachtdieren is bepaald,
      in het geval dat de runderen, de varkens, de paardachtigen, het pluimvee, respectievelijk de schapen en geiten,
      rechtstreeks vanuit Nederland naar een derde land worden gebracht;
        - dieren of producten vergezeld gaan van het bewijsstuk, bedoeld in [artikel 2.4, onderdeel a][ref11], dat,
      indien het dieren betreft, tenminste bestemd is voor slachtdieren, alsmede van een bewijsstuk, bestaande uit
      het veterinaire document of certificaat, dat aan de veterinaire voorschriften van het derde land van bestemming
      voldoet, tenzij de VWA niet over die voorschriften beschikt, in welk geval op het bewijsstuk, bedoeld in
      [artikel 2.4, onderdeel a][ref12], de vermelding ‘Dieren of producten voor uitvoer naar (naam van het derde land)’
      is opgenomen, waarbij de naam van het derde land van bestemming als het gedeelte tussen haakjes is ingevuld),
      indien de dieren of producten via het grondgebied van een lid-staat naar een derde land worden gebracht;

      b. de bewijsstukken, bedoeld in onderdeel a, volledig zijn ingevuld, gedagtekend en ondertekend, terwijl de
      geldigheidsduur ervan niet is verstreken.

      2 Indien de dieren of producten via het grondgebied van een lid-staat naar een derde land worden gebracht, geldt
      ter zake van het bewijsstuk, bedoeld in [artikel 2.4, onderdeel a][ref13], dat:

        - het in overeenstemming met de regelgeving van de Raad van de Europese Unie of de Commissie van de Europese
      Gemeenschappen is opgesteld;
        - daarop, in voorkomend geval, de gelijkwaardige, bijkomende waarborgen zijn opgenomen, bedoeld in artikel 3,
      eerste lid, onderdeel e, subonderdeel iv, van [richtlijn 90/425/EEG](31990L0425), voor zover deze waarborgen
      betrekking hebben op slachtdieren;
        - het in de Nederlandse taal en in tenminste in één van de talen van de lid-staat waar zich het punt van uitgang
      bevindt, is gesteld;
        - daarop het punt van uitgang als plaats van bestemming is vermeld;
        - daarop als ontvanger is vermeld, met naam en adres, de ontvanger bij het punt van uitgang, als bedoeld in artikel
      4, tweede gedachtenstreepje, van beschikking 93/444/EEG.


