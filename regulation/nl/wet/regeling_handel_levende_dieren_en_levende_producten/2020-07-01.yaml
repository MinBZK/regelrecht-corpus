  - number: '2.22'
    text: |-
      1 Het verbod, bedoeld in [artikel 2.1, tweede lid, eerste gedachtenstreepje][ref1], geldt niet ter zake van
      het brengen in Nederland van dieren en producten die zijn verzonden vanuit een lid-staat dan wel zijn verzonden
      vanuit een derde land en via het grondgebied van een lid-staat in Nederland worden gebracht, mits voldaan wordt
      aan, voor zover van toepassing, het tweede en derde lid, de [artikelen 2.23][ref2], [2.24][ref3] en [2.30][ref4]
      en verordening (EU) 2017/625 en de daarop gebaseerde gedelegeerde handelingen en uitvoeringshandelingen van de
      Europese Commissie.

      2 Indien de dieren of producten zijn verzonden vanuit een lid-staat en bestemd zijn voor Nederland of een lid-staat
      wordt voldaan aan:

        - [afdeling 3 van hoofdstuk 3][ref5], indien het runderen betreft;
        - [afdeling 3 van hoofdstuk 4][ref6], indien het varkens betreft;
        - [afdeling 3 van hoofdstuk 5][ref7], indien het paardachtigen betreft;
        - [afdeling 3 van hoofdstuk 6][ref8], indien het pluimvee en broedeieren betreft;
        - [afdeling 3 van hoofdstuk 7][ref9], indien het schapen en geiten betreft;
        - [afdeling 3 van hoofdstuk 8][ref10], indien het apen, hoefdieren, bijen, honden, katten en lagomorfen met
      gezondheidscertificaat betreft;
        - [afdeling 3 van hoofdstuk 9][ref11], indien het sperma betreft;
        - [afdeling 3 van hoofdstuk 10][ref12], indien het embryo's betreft, en
        - [afdeling 3 van hoofdstuk 11][ref13], indien het eicellen betreft.

      3 Indien de dieren of producten zijn verzonden vanuit een lidstaat en bestemd zijn voor een derde land, gaat de
      partij vergezeld van:

      a. het certificaat of document, bedoeld in de derde afdeling van de [hoofdstukken 3 tot en met 11][ref14], dat,
      indien het dieren betreft, ten minste bestemd is voor slachtdieren, en

      b. de veterinaire documenten of certificaten die aan de veterinaire voorschriften van het derde land van bestemming
      voldoen, tenzij op het certificaat of document, bedoeld in het eerste lid, de vermelding ‘Dieren of producten voor
      uitvoer naar (naam van derde land)’ voorkomt, waarbij de naam van het derde land van bestemming als het gedeelte
      tussen haakjes is opgenomen.

      4 Indien de dieren of producten zijn verzonden vanuit een derde land en via het grondgebied van een lid-staat in
      Nederland worden gebracht, en indien het producten voor een derde land betreft, gaat de partij vergezeld van, een
      bij de partij behorend document, waaruit tenminste de oorsprong van de partij en de verdere bestemming hiervan
      kan worden afgeleid, en van een gemeenschappelijk gezondheidsdocument van binnenkomst als bedoeld in artikel 56
      van [verordening 2017/625](32525R2017), waarin is aangegeven langs welk punt van uitgang de partij de Gemeenschap
      verlaat.

      5 Het eerste lid is niet van toepassing op vee, niet zijnde paarden niet bestemd voor de slacht, afkomstig uit
      België.


