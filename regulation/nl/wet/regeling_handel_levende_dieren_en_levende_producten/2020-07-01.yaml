  - number: '3.5'
    text: |-
      De runderen zijn geïdentificeerd en geregistreerd overeenkomstig het bij of krachtens het
      [Besluit identificatie en registratie van dieren][ref1] bepaalde en gaan, voor zover de runderen bestemd zijn
      voor een lidstaat zonder een door de Europese Commissie op grond van artikel 5, tweede alinea, van [verordening
      1760/2000](32000R1760) erkend gegevensuitwisselingssysteem dan wel via het grondgebied van een dergelijke lidstaat
      naar een derde land worden gebracht, vergezeld van een paspoort.


      [ref1]: https://wetten.overheid.nl/BWBR0009019
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0009019
  - number: '3.6'
    text: |-
      1 Indien een partij is verzonden vanuit een lidstaat en bestemd is voor Nederland of een lidstaat, gaat zij
      vergezeld van het gezondheidscertificaat dat op grond van artikel 5, eerste lid, van [richtlijn 64/432/EEG]
      (31964L0432) voor de desbetreffende soort runderen is voorgeschreven, met dien verstande dat indien de partij
      bestemd is voor een lidstaat, in voorkomend geval, uit het gezondheidscertificaat blijkt dat, voldaan wordt
      aan de met betrekking tot de in bijlage E (II) van [richtlijn 64/432/EEG](31964L0432) vermelde ziekten gestelde
      aanvullende garanties, bedoeld in artikel 9, tweede lid, en in artikel 10, tweede lid, van [richtlijn 64/432/EEG]
      (31964L0432).

      2 Het gezondheidscertificaat, bedoeld in het eerste lid, gaat, indien een partij is verzonden vanuit een lidstaat
      en via een verzamelcentrum, als bedoeld in [artikel 3.7, derde lid][ref1], in Nederland is binnengebracht en
      bestemd is voor een lidstaat, vergezeld van een tweede certificaat, als bedoeld in artikel 5, vijfde lid, van
      [richtlijn 64/432/EEG](31964L0432), dat vanaf het verzamelcentrum gedurende het vervoer naar de plaats waar de
      partij buiten Nederland wordt gebracht, is gehecht aan het gezondheidscertificaat, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel3.7
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0007049
        artikel: '3.7'
        hoofdstuk: '3'
        afdeling: '3'
  - number: '3.7'
    text: |-
      1 Indien een partij is bestemd voor Nederland of voor een Lidstaat komt de partij tot de plaats van bestemming
      respectievelijk tot de plaats waar de partij buiten Nederland wordt gebracht niet in aanraking met andere
      evenhoevige dieren die niet over dezelfde gezondheidsstatus beschikken. Fok- en gebruiksrunderen komen tot de
      plaats van bestemming respectievelijk tot de plaats waar zij de buiten Nederland worden gebracht eveneens niet in
      aanraking met slachtrunderen.

      2 De in het eerste lid bedoelde partij wordt vervoerd in een vervoermiddel dat voldoet aan artikel 4, tweede lid,
      van [richtlijn 64/432/EEG](31964L0432).

      3 Indien een partij via een verzamelcentrum in Nederland wordt binnengebracht, vindt zulks plaats in een
      overeenkomstig [artikel 2.63, eerste lid][ref1], erkend verzamelcentrum.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.63
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel3.7
