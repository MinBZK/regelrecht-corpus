  - number: 8.6b
    text: |-
      1 Een quarantainevoorziening als bedoeld in artikel 3, onderdeel e, van verordening (EU) nr. 139/2013 of
      quarantainestation als bedoeld in artikel 3, onderdeel f, van verordening (EU) nr. 139/2013 wordt op aanvraag
      door de minister voor de toepassing van deze regeling erkend indien uit een door de keuringsdierenarts ingesteld
      onderzoek is gebleken dat de quarantainevoorziening of het quarantainestation voldoet aan bijlage IV, hoofdstukken
      1 en 2, van verordening (EU) nr. 139/2013.

      2 De in het eerste lid bedoelde erkenning wordt door de minister ingetrokken indien niet langer wordt voldaan aan
      bijlage IV, hoofdstukken 1 en 2, van verordening (EU) nr. 139/2013.
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel8.6b
  - number: '8.7'
    text: |-
      1 De minister houdt een register bij van handelszaken die permanent of incidenteel honden, katten, fretten of
      lagomorfen in zijn bezit heeft.

      2 Een handelszaak wordt slechts ingeschreven in het in het eerste lid bedoelde register, indien degene die voor
      deze handelszaak verantwoordelijk is:

      a. een administratie voert waarin tenminste de leveringen van de honden, katten, fretten of lagomorfen en de
      verdere bestemming hiervan zijn vermeld en alle op die dieren betrekking hebbende bescheiden zijn opgenomen;

      b. vorenbedoelde administratie tenminste drie jaren bewaart;

      c. artikel 4 van [richtlijn 92/65/EEG](31992L0065) naleeft;

      d. over voor het vervoer van de in het eerste lid bedoelde dieren geschikte vervoermiddelen beschikt.

      3 Indien de handelaar zich niet aan de in het tweede lid bedoelde voorschriften houdt, kan de minister beslissen
      dat zijn inschrijving in het in het eerste lid bedoelde register wordt doorgehaald dan wel niet wordt erkend.
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel8.7
  - number: '8.8'
    text: |-
      1 Indien vogels, lagomorfen die zijn bestemd voor een lid-staat, die geen gezondheidscertificaat als bedoeld
      in artikel 9, tweede lid, eist, alsmede nertsen en vossen afkomstig zijn van een handelszaak die permanent of
      incidenteel deze dieren in zijn bezit heeft, is deze handelszaak geregistreerd overeenkomstig [artikel 8.7][ref1].

      2 Vogels, lagomorfen die zijn bestemd voor een lid-staat, die geen gezondheidscertificaat als bedoeld in artikel
      9, tweede lid, van [richtlijn 92/65/EEG](31992L0065) eist, alsmede nertsen en vossen zijn afkomstig van een
      bedrijf waarop regelmatig een controle door de ambtenaren wordt verricht, teneinde na te gaan of aan de onderhavige
      regeling wordt voldaan en dat voldoet aan artikel 4 van [richtlijn 92/65/EEG](31992L0065).

      3 Vogels, niet zijnde papegaaiachtigen, vossen, nertsen en lagomorfen die zijn bestemd voor een lid-staat, die
      geen gezondheidscertificaat als bedoeld in artikel 9, tweede lid, van [richtlijn 92/65/EEG](31992L0065) eist, gaan
      vergezeld van de verklaring, bedoeld in artikel 4, vierde gedachtenstreepje, van [richtlijn 92/65/EEG](31992L0065).

      4 Papegaaiachtigen gaan vergezeld van het handelsdocument, bedoeld in artikel 7, onder A, tweede lid, onderdeel c,
      van [richtlijn 92/65/EEG](31992L0065).

      5 Dieren, als bedoeld in artikel 12 eerste lid, van [richtlijn 92/65/EEG](31992L0065), gaan vergezeld van het in
      artikel 13, eerste lid, van [richtlijn 92/65/EEG](31992L0065) bedoelde vervoersdocument.

      6 De verklaring, bedoeld in het derde lid, het handelsdocument, bedoeld in het vierde lid, en het vervoersdocument,
      bedoeld in het vijfde lid, zijn opgesteld en afgegeven in overeenstemming met de regelgeving van de Raad van
      de Europese Unie of de Commissie van de Europese Gemeenschappen, volledig ingevuld, gedagtekend en ondertekend,
      terwijl de geldigheidsduur ervan niet is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel8.7
