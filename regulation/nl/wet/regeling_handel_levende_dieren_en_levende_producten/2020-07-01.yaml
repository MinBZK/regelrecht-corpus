preamble:
  text: |-
    Gelet op Richtlijn nr. 90/425/EEG van de Raad van de Europese Gemeenschappen van 26 juni 1990 inzake veterinaire
    en zoötechnische controles in het intracommunautaire handelsverkeer in bepaalde levende dieren en producten in
    het vooruitzicht van de totstandbrenging van de interne markt (PbEG L 224), Richtlijn nr. 90/675/EEG van de Raad
    van de Europese Gemeenschappen van 10 december 1990 tot vaststelling van de beginselen voor de organisatie van
    de veterinaire controles voor producten uit derde landen die in de Gemeenschap worden binnengebracht (PbEG L
    373), Richtlijn nr. 91/496/EEG van de Raad van de Europese Gemeenschappen van 15 juli 1991 tot vaststelling van
    de beginselen voor de organisatie van de veterinaire controles voor dieren uit derde landen die in de Gemeenschap
    worden binnengebracht en tot wijziging van de Richtlijnen 89/662/EEG, 90/425/EEG en 90/675/EEG (PbEG L 268),
    Richtlijn nr. 64/432/EEG van de Raad van de Europese Gemeenschappen van 26 juni 1964 inzake veterinairrechtelijke
    vraagstukken op het gebied van het intracommunautaire handelsverkeer in runderen en varkens (PbEG L 121), Richtlijn
    nr. 72/462/EEG van de Raad van de Europese Gemeenschappen van 12 december 1972 inzake gezondheidsvraagstukken
    en veterinairrechtelijke vraagstukken bij de invoer van runderen, varkens, schapen, geiten, van vers vlees
    of van vleesproducten uit derde landen (PbEG L 302), Richtlijn nr. 90/426/EEG van de Raad van de Europese
    Gemeenschappen van 26 juni 1990 tot vaststelling van veterinairrechtelijke voorschriften voor het verkeer van
    paardachtigen en de invoer van paardachtigen uit derde landen (PbEG L 224), Richtlijn nr. 90/539/EEG van de Raad
    van de Europese Gemeenschappen van 15 oktober 1990 tot vaststelling van veterinairrechtelijke voorschriften voor
    het intracommunautaire handelsverkeer en de invoer uit derde landen van pluimvee en broedeieren (PbEG L 303),
    Richtlijn nr. 91/68/EEG van de Raad van de Europese Gemeenschappen van 28 januari 1991 inzake veterinairrechtelijke
    voorschriften voor het intracommunautaire handelsverkeer in schapen en geiten (PbEG L 46), Richtlijn nr. 88/407/
    EEG van de Raad van de Europese Gemeenschappen van 14 juni 1988 tot vaststelling van de veterinairrechtelijke
    voorschriften van toepassing op het intracommunautaire handelsverkeer in sperma van runderen en de invoer daarvan
    (PbEG L 194), Richtlijn nr. 90/429/EEG van de Raad van de Europese Gemeenschappen van 26 juni 1990 tot vaststelling
    van de veterinairrechtelijke voorschriften van toepassing op het intracommunautaire handelsverkeer in sperma van
    varkens en de invoer daarvan (PbEG L 224), Richtlijn 89/556/EEG van de Raad van de Europese Gemeenschappen van 25
    september 1989 tot vaststelling van veterinairrechtelijke voorschriften voor het intracommunautaire handelsverkeer
    in embryo's van als huisdier gehouden runderen en de invoer daarvan uit derde landen (PbEG L 320), Richtlijn nr.
    92/65/EEG van de Raad van de Europese Gemeenschappen van 13 juli 1992 tot vaststelling van de veterinairrechtelijke
    voorschriften voor het handelsverkeer en de invoer in de Gemeenschap van dieren, sperma, eicellen en embryo's
    waarvoor ten aanzien van de veterinairrechtelijke voorschriften geen specifieke communautaire regelgeving als
    bedoeld in bijlage A, onder I, van Richtlijn 90/425/EEG geldt (PbEG L 268), Richtlijn nr. 94/28/EG van de Raad
    van de Europese Unie van 23 juni 1994 tot vaststelling van de beginselen inzake de zoötechnische en genealogische
    voorschriften voor de invoer uit derde landen van dieren, alsmede van sperma, eicellen en embryo's en tot wijziging
    van Richtlijn 77/504/EEG betreffende raszuivere fokrunderen (PbEG L 178) en Richtlijn nr. 94/42/EG van de Raad van
    de Europese Unie van 27 juli 1994 tot wijziging en bijwerking van Richtlijn 64/432/EEG inzake veterinairrechtelijke
    vraagstukken op het gebied van het intracommunautaire handelsverkeer in runderen en varkens (PbEG L 201) alsmede op
    de daarop gebaseerde regelgeving van de Commissie van de Europese Gemeenschappen en op de Overeenkomst betreffende
    de Europese Economische Ruimte (Trb. 1992, 132);

    Gelet op de artikelen 10, 11, 12, 13, 77, 81, 94, eerste lid, 107 en 108 van de Gezondheids- en welzijnswet voor
    dieren, op artikel 19 van de Landbouwwet, op artikel 2 van het Besluit uitvoer dieren en producten van dierlijke
    oorsprong en op de artikelen 2, 4 en 8 van het Besluit inzake het in de handel brengen van dieren en producten en
    de toepassing van maatregelen met betrekking tot in Nederland gebrachte dieren en producten;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      1 In deze regeling wordt verstaan onder:

        - *wet:* [Gezondheids- en welzijnswet voor dieren](onbekend);
        - *minister:* Minister van Landbouw, Natuur en Voedselkwaliteit;
        - *EER-Verdrag:* Overeenkomst betreffende de Europese Economische Ruimte;
        - *richtlijn 91/496/EEG:* richtlijn van de Raad van de Europese Gemeenschappen van 15 juli 1991 tot vaststelling
      van de beginselen voor de organisatie van de veterinaire controles voor dieren uit derde landen die in de
      Gemeenschap worden binnengebracht en tot wijziging van de [Richtlijnen 89/662/EEG](31989L0662), [90/425/EEG]
      (31990L0425) en [90/675/EEG](31990L0675) (PbEG L 268);
        - *richtlijn 92/65/EEG:* richtlijn van de Raad van de Europese Gemeenschappen van 13 juli 1992 tot vaststelling
      van veterinairrechtelijke voorschriften voor het handelsverkeer en de invoer in de Gemeenschap van dieren, sperma,
      eicellen en embryo's waarvoor ten aanzien van de veterinairrechtelijke voorschriften geen specifieke communautaire
      regelgeving als bedoeld in bijlage A, onder I, van [Richtlijn 90/425/EEG](31990L0425) geldt (PbEG L 268);
        - [richtlijn 96/22/EG](31996L0022): [richtlijn (EG) nr. 96/22](31996L0022) van de Raad van de Europese
      Gemeenschappen van 29 april 1996 betreffende het gebruik, in de veehouderij, van bepaalde stoffen met
      thyreostatische werking, alsmede van ß-agonisten en tot intrekking van de [Richtlijnen 81/602/EEG](31981L0602),
      [88/146/EEG](31988L0146) en [88/299/EEG](31988L0299) (PbEG L 125);
        - [richtlijn 2004/68/EG](32004L0068): [richtlijn nr. 2004/68/EG](32004L0068) van de Raad van de Europese Unie van
      26 april 2004 tot vaststelling van veterinairrechtelijke voorschriften voor de invoer in en de doorvoer via de
      Gemeenschap van bepaalde levende hoefdieren tot wijziging van de [Richtlijnen 90/426/EEG](31990L0426) en [92/65/
      EEG](31992L0065) en tot intrekking van [Richtlijn 72/462/EEG](31972L0462) (PbEU L 139);
        - *richtlijn 2008/71/EG:* richtlijn nr. 2008/71/EG van de Raad van de Europese Unie van 15 juli 2008 met betrekking
      tot de identificatie en registratie van varkens (PbEU L 213);
        - *beschikking 2007/25/EG:* beschikking van de Commissie van 22 december 2006 tot vaststelling van bepaalde
      beschermende maatregelen in verband met hoogpathogene aviaire influenza en het verkeer van gezelschapsvogels die
      hun eigenaar vergezellen (PbEU 2007 L 8);
        - uitvoeringsverordening (EU) 2018/659: uitvoeringsverordening (EU) 2018/659 van de Commissie van 12 april 2018
      betreffende de voorschriften voor het binnenbrengen in de Unie van levende paardachtigen en sperma, eicellen en
      embryo's van paardachtigen (PbEU L 110);
        - [verordening 1760/2000/EG](32000R1760): [verordening (EG) nr. 1760/2000](32000R1760) van de Commissie
      van de Europese Gemeenschappen van 17 juli 2000 (PbEG L 204) tot vaststelling van een identificatie- en
      registratieregeling voor runderen en inzake de etikettering van rundvlees en rundvleesproducten en tot intrekking
      van [verordening nr. 820/97](31997R0820) van de Raad van de Europese Unie;
        - *verordening (EG) nr. 999/2001:* [verordening (EG) nr. 999/2001](32001R0999) van het Europees Parlement en de
      Raad van de Europese Unie van 22 mei 2001 houdende vaststelling van voorschriften inzake preventie, bestrijding en
      uitroeiing van bepaalde overdraagbare spongiforme encefalopathieën (PbEG L 147);
        - *verordening (EG) 1/2005:* verordening (EG) nr. 1/2005 van de Raad van de Europese Unie van 22 december 2004
      inzake de bescherming van dieren tijdens het vervoer en daarmee samenhangende activiteiten en tot wijziging van de
      Richtlijnen 64/432/EEG en 93/119/EG en van Verordening (EG) nr. 1255/97 (PbEU L 3);
        - *verordening (EG) nr. 798/2008:* verordening (EG) nr. 798/2008 van de Commissie van de Europese Gemeenschappen
      van 8 augustus 2008 tot vaststelling van een lijst van derde landen, gebieden, zones of compartimenten waaruit
      pluimvee en pluimveeproducten mogen worden ingevoerd in en doorgevoerd door de Gemeenschap, en van de voorschriften
      inzake veterinaire certificering (PbEU L 226);
        - *verordening (EU) nr. 206/2010:* verordening (EU) nr. 206/2010 van de Europese Commissie van 12 maart 2010 tot
      vaststelling van lijsten van derde landen en gebieden of delen daarvan, waaruit bepaalde dieren en vers vlees in de
      Europese Unie mogen worden binnengebracht, en van de voorschriften inzake veterinaire certificering (PbEU L 73);
        - *verordening (EU) nr. 139/2013:* verordening (EU) nr. 139/2013 van de Europese Commissie van 7 januari 2013
      tot vaststelling van de veterinairrechtelijke voorschriften voor de invoer van bepaalde vogels in de Unie en de
      desbetreffende quarantainevoorschriften (PbEU L 47);
        - *Verordening (EU) nr. 576/2013:* verordening (EU) nr. 576/2013 van het Europees Parlement en de Raad van 12 juni
      2013 betreffende het niet-commerciële verkeer van gezelschapsdieren en tot intrekking van Verordening (EG) nr.
      998/2003 (PbEU L 178);
        - *communautaire uitvoeringsmaatregel:* verordening, richtlijn of beschikking als bedoeld in artikel 288 van
      het Verdrag betreffende de werking van de Europese Unie, vastgesteld krachtens een richtlijn of verordening met
      betrekking tot veterinairrechtelijke eisen inzake de handel in levende dieren, of levende dierlijke producten;
        - *NVWA:* Nederlandse Voedsel- en Warenautoriteit;
        - *ambtenaar:* ambtenaar, bedoeld in [artikel 114, eerste of tweede lid van de wet][ref1];
        - *keuringsdierenarts:* dierenarts verbonden aan de NVWA;
        - *officiële dierenarts:* door de bevoegde centrale autoriteit van het land van verzending aangewezen dierenarts;
        - *lid-staat:* staat, niet zijnde Nederland, die als lid deel uitmaakt van de Europese Unie; staat die partij is
      bij het EER-Verdrag: Noorwegen;
        - *derde land:* land, niet zijnde Nederland en niet zijnde een lid-staat of een andere staat die partij is bij het
      EER-Verdrag;
        - *punt van uitgang:* douanekantoor van uitgang van waaruit dieren of producten rechtstreeks naar het derde land
      van bestemming worden vervoerd;
        - *pluimvee:* kippen, kalkoenen, parelhoenders, eenden, ganzen, kwartels, fazanten, patrijzen, loopvogels (Ratites)
      en duiven, die in gevangenschap worden opgefokt of gehouden voor de fokkerij, voor de produktie van vlees of van
      voor consumptie bestemde eieren of om in het wild te worden uitgezet;
        - *apen:* apen, bedoeld in artikel 5 van [richtlijn 92/65/EEG](31992L0065);
        - *hoefdieren:* hoefdieren, bedoeld in artikel 6, onder A, eerste tot en met derde lid, van [richtlijn 92/65/EEG]
      (31992L0065);
        - *vogels:* vogels, bedoeld in artikel 7, onder A, eerste en tweede lid, van [richtlijn 92/65/EEG](31992L0065);
        - *bijen:* bijen, bedoeld in artikel 8 van [richtlijn 92/65/EEG](31992L0065);
        - *lagomorfen met gezondheidscertificaat:* lagomorfen die zijn bestemd voor een lid-staat die een
      gezondheidscertificaat als bedoeld in artikel 9, tweede lid, van [richtlijn 92/65/EEG](31992L0065) eist;
        - *lagomorfen zonder gezondheidscertificaat:* lagomorfen die zijn bestemd voor Nederland dan wel voor een lid-staat
      die geen gezondheidscertificaat als bedoeld in artikel 9, tweede lid, van [richtlijn 92/65/EEG](31992L0065) eist;
        - *dieren:* vee, pluimvee alsmede dieren bedoeld in
      __REF001___________________________________________________________________________________________________________
      _;
        - *dieren als bedoeld in artikel 13, eerste lid, van richtlijn 92/65/EEG:* dieren, die vatbaar zijn voor de in
      bijlage A bij [richtlijn 92/65/EEG](31992L0065) genoemde ziekten, dan wel dieren die vatbaar zijn voor ziekten,
      waarvoor de lid-staat van bestemming op grond van regelgeving van de Raad van de Europese Unie of de Commissie van
      de Europese Gemeenschappen aanvullende garanties, als bedoeld in de artikelen 14 en 15, van [richtlijn 92/65/EEG]
      (31992L0065) mag stellen;
        - *producten als bedoeld in artikel 13, eerste lid, van richtlijn 92/65/EEG:* producten van dieren als bedoeld in
      artikel 13, eerste lid, van [richtlijn 92/65/EEG](31992L0065);
        - *paardachtigen:* als huisdier gehouden of in het wild levende paarden, zebra’s, ezels of kruisingen daarvan;
        - *geregistreerde paarden:* paardachtigen die ingeschreven of geregistreerd zijn en in aanmerking komen voor
      inschrijving in de hoofdsectie van een stamboek, overeenkomstig verordening (EU) 2016/1012 van het Europees
      Parlement en de Raad van 8 juni 2016 betreffende de zoötechnische en genealogische voorwaarden voor het
      fokken van, de handel in en de binnenkomst in de Unie van raszuivere fokdieren, hybride fokvarkens en levende
      producten daarvan en tot wijziging van Verordening (EU) nr. 652/2014, de [Richtlijnen 89/608/EEG](31989L0608) en
      [90/425/EEG](31990L0425) van de Raad en tot intrekking van bepaalde handelingen op het gebied van dierfokkerij
      (‘Fokkerijverordening’) (PbEU 2016, L 171);
        - *slachtpaarden:* paardachtigen die zijn bestemd om rechtstreeks dan wel via een verzamelcentrum naar een
      slachthuis te worden gebracht om daar te worden geslacht;
        - *fok- en gebruikspaarden:* paardachtigen, niet zijnde geregistreerde paarden en slachtpaarden;
        - *slachtdieren:* dieren die kennelijk bestemd zijn om te worden geslacht;
        - *broedeieren:* eieren van pluimvee, bestemd om te worden bebroed;
        - *sperma:* rundersperma, varkenssperma alsmede sperma van schapen, geiten en eenhoevige dieren als bedoeld in
      [artikel 9.1][ref3];
        - *embryo's:* runderembryo's en embryo's van varkens, schapen, geiten en eenhoevige dieren als bedoeld in
      [artikel 10.1][ref4];
        - *eicellen:* eicellen van varkens, schapen, geiten en eenhoevige dieren;
        - *producten:* sperma, eicellen, embryo's en broedeieren;
        - *grenscontrolepost:* grenscontrolepost als bedoeld in artikel 3, onderdeel 38, van [verordening 2017/625]
      (32525R2017);
        - *douane-entrepot:* opslagruimte als bedoeld in Verordening (EU) nr. 952/2013 van het Europees Parlement en van de
      Raad van 9 oktober 2013 tot vaststelling van het douanewetboek van de Unie (PbEU 2013, L 269);
        - *ruimte voor tijdelijke opslag:* opslagruimte als bedoeld in artikel 147, eerste lid, van Verordening (EU) nr.
      952/2013 van het Europees Parlement en van de Raad van 9 oktober 2013 tot vaststelling van het douanewetboek van de
      Unie (PbEU 2013, L 269);
        - *bedrijf:* op Nederlands grondgebied gelegen landbouwbedrijf of handelaarsstal, waar gewoonlijk dieren, niet
      zijnde paardachtigen, worden gehouden of gefokt alsmede op Nederlands grondgebied gelegen landbouwbedrijf of
      entrainement, stal, iedere ruimte of iedere inrichting waar gewoonlijk paardachtigen worden gehouden of gefokt,
      ongeacht hun gebruik;
        - *instelling, instituut of centrum:* instelling, instituut of centrum als bedoeld in artikel 2, eerste lid,
      onderdeel c, van [richtlijn 92/65/EEG](31992L0065);
        - *verzamelcentrum:*plaats, met inbegrip van bedrijven of markten, waar dieren afkomstig van verschillende
      bedrijven van oorsprong worden samengebracht met het oogmerk om een voor het handelsverkeer bestemde partij te
      vormen;
        - *partij:* hoeveelheid dieren of producten van dezelfde soort, waarvoor eenzelfde certificaat of document zoals
      voorgeschreven in deze regeling geldt, die met hetzelfde vervoermiddel wordt vervoerd en afkomstig is uit hetzelfde
      land of gedeelte van een land;
        - *importeur:* natuurlijke persoon of rechtspersoon die een partij met het oog op het brengen in Nederland bij een
      erkende inspectiepost ten onderzoek aanbiedt, dan wel diens gemachtigde;
        - *belanghebbende bij de lading:* belanghebbende bij de lading als bedoeld in artikel 2, tweede lid, onderdeel e,
      van [richtlijn 97/78/EG](31997L0078);
        - *handelaar:* elke natuurlijke persoon of rechtspersoon die een partij met het oog op de verhandeling onder zich
      heeft, dan wel diens gemachtigde;
        - *werkelijke kosten:* de kosten die betrekking hebben op de administratiekosten, de loonkosten en de
      sociale premies van de met de onderzoeken en keuringen belaste personen van de RVV als mede de kosten van
      laboratoriumonderzoek;
        - *richtlijn 64/432/EEG:* richtlijn van de Raad van de Europese Gemeenschappen van 26 juni 1964 inzake
      veterinairrechtelijke vraagstukken op het gebied van het intracommunautaire handelsverkeer in runderen en varkens
      (PbEG L 121);
        - *verordening (EU) 2017/625:* verordening (EU) 2017/625 van het Europees Parlement en de Raad van 15 maart
      2017 betreffende officiële controles en andere officiële activiteiten die worden uitgevoerd om de toepassing
      van de levensmiddelen- en diervoederwetgeving en van de voorschriften inzake diergezondheid, dierenwelzijn,
      plantgezondheid en gewasbeschermingsmiddelen te waarborgen, tot wijziging van de [Verordeningen (EG) nr. 999/2001]
      (32001R0999), [(EG) nr. 396/2005](32005R0396), [(EG) nr. 1069/2009](32009R1069), [(EG) nr. 1107/2009](32009R1107),
      (EU) [nr. 1151/2012](32012R1151), (EU) [nr. 652/2014](32014R0652), (EU) [2016/429](32329R2016) en (EU) [2016/2031]
      (32031R2016) van het Europees Parlement en de Raad, de Verordeningen [(EG) nr. 1/2005](32005R0001) en [(EG) nr.
      1099/2009](32009R1099) van de Raad en de Richtlijnen [98/58/EG](31958R0098), [1999/74/EG](31974R1999), [2007/43/
      EG](31943R2007), [2008/119/EG](32019R2008) en [2008/120/EG](32020R2008) van de Raad, en tot intrekking van de
      Verordeningen [(EG) nr. 854/2004](32004R0854) en [(EG) nr. 882/2004](32004R0882) van het Europees Parlement en
      de Raad, de Richtlijnen [89/608/EEG](32508R0089), [89/662/EEG](32562R0089), [90/425/EEG](32325R0090), [91/496/
      EEG](32396R0091), [96/23/EG](31923R0096), [96/93/EG](31993R0096) en [97/78/EG](31978R0097) van de Raad en Besluit
      [92/438/EEG](32338R0092) van de Raad (verordening officiële controles) (PbEU L 95);
        - *uitvoeringsverordening (EU) 2019/1013:* uitvoeringsverordening (EU) 2019/1013 van de Commissie van 16 april
      2019 betreffende de voorafgaande kennisgeving van zendingen van bepaalde categorieën dieren en goederen die de Unie
      binnenkomen (PbEU L 165);
        - *gedelegeerde verordening (EU) 2019/1602:* gedelegeerde verordening (EU) 2019/1602 van de Commissie van
      23 april 2019 tot aanvulling van Verordening (EU) 2017/625 van het Europees Parlement en de Raad betreffende het
      gemeenschappelijk gezondheidsdocument van binnenkomst dat zendingen van dieren en goederen tot hun bestemming
      vergezelt (PbEU L 250);
        - *gedelegeerde verordening (EU) 2019/1666:* gedelegeerde verordening (EU) 2019/1666 van de Commissie van 24 juni
      2019 tot aanvulling van Verordening (EU) 2017/625 van het Europees Parlement en de Raad wat betreft de voorwaarden
      voor de monitoring van het vervoer en de aankomst van zendingen van bepaalde goederen van de grenscontrolepost van
      aankomst tot de inrichting op de plaats van bestemming in de Unie (PbEU L 255);
        - *gedelegeerde verordening (EU) 2019/625:* gedelegeerde verordening (EU) 2019/625 van de Commissie van 4 maart
      2019 tot aanvulling van Verordening (EU) 2017/625 van het Europees Parlement en de Raad wat betreft voorwaarden
      voor de binnenkomst in de Unie van zendingen van bepaalde voor menselijke consumptie bestemde dieren en goederen
      (PbEU L 313);
        - *uitvoeringsverordening (EU) 2019/1715:* uitvoeringsverordening (EU) 2019/1715 van de Commissie van 30 september
      2019 tot vaststelling van regels inzake de werking van het informatiemanagementsysteem voor officiële controles en
      de systeemcomponenten ervan (de Imsoc-verordening) (PbEU L 261);
        - *uitvoeringsverordening (EU) 2019/1973:* uitvoeringsverordening (EU) 2019/1793 van de Commissie van 22 oktober
      2019 betreffende de tijdelijke verhoging van de officiële controles en noodmaatregelen met betrekking tot de
      binnenkomst in de Unie van bepaalde goederen uit bepaalde derde landen tot uitvoering van de Verordeningen (EU)
      2017/625 en (EG) nr. 178/2002 van het Europees Parlement en de Raad, en tot intrekking van de [Verordeningen
      (EG) nr. 669/2009](32009R0669)), (EU) [nr. 884/2014](32014R0884), (EU) [2015/175](32075R2015), (EU) [2017/186]
      (32086R2017) en (EU) [2018/1660](33560R2018) van de Commissie (PbEU L 11);
        - *gedelegeerde verordening (EU) 2019/2122:* gedelegeerde verordening (EU) 2019/2122 van de Commissie van
      10 oktober 2019 tot aanvulling van Verordening (EU) 2017/625 van het Europees Parlement en de Raad wat betreft
      bepaalde categorieën dieren en goederen die van officiële controles aan grenscontroleposten zijn vrijgesteld, en
      specifieke controles van de persoonlijke bagage van passagiers en van kleine zendingen goederen die aan natuurlijke
      personen worden gezonden en niet bestemd zijn om in de handel te worden gebracht en tot wijziging van Verordening
      (EU) nr. 142/2011 van de Commissie (PbEU L 321);
        - *gedelegeerde verordening (EU) 2019/2124:* gedelegeerde verordening (EU) 2019/2124 van de Commissie van
      10 oktober 2019 tot aanvulling van Verordening (EU) 2017/625 van het Europees Parlement en de Raad wat betreft
      voorschriften voor officiële controles van zendingen van dieren en goederen bij doorvoer, overlading en verder
      vervoer door de Unie, tot wijziging van de [Verordeningen (EG) nr. 798/2008](32008R0798), [(EG) nr. 1251/2008]
      (32008R1251), [(EG) nr. 119/2009](32009R0119), (EU) [nr. 206/2010](32010R0206), (EU) [nr. 605/2010](32010R0605),
      (EU) [nr. 142/2011](32011R0142) en (EU) [nr. 28/2012](32012R0028) van de Commissie, Uitvoeringsverordening (EU)
      [2016/759](32659R2016) van de Commissie, en Beschikking [2007/777/EG](32677R2007) van de Commissie (PbEU L 321);
        - *gedelegeerde verordening (EU) 2019/2125:* gedelegeerde verordening (EU) 2019/2125 van de Commissie van
      10 oktober 2019 tot aanvulling van Verordening (EU) 2017/625 van het Europees Parlement en de Raad wat betreft
      regels voor de uitvoering van specifieke officiële controles van houten verpakkingsmateriaal, de kennisgeving van
      bepaalde zendingen en de te nemen maatregelen in geval van niet-naleving (PbEU L 321);
        - *uitvoeringsverordening (EU) 2019/2128:* uitvoeringsverordening (EU) 2019/2128 van de Commissie van 12 november
      2019 tot vaststelling van het model van officieel certificaat en van de regels voor de afgifte van officiële
      certificaten voor goederen die worden geleverd aan vaartuigen die de Unie verlaten en bestemd zijn voor
      bevoorrading van een schip of voor consumptie door de bemanning en passagiers, of aan een militaire basis van de
      NAVO of de Verenigde Staten van Amerika (PbEU L 321).

      2 In afwijking van het eerste lid wordt voor de toepassing van de [afdelingen 2][ref5], [3][ref6], [4][ref7] en
      [7 van hoofdstuk 2][ref8], onder dieren verstaan vee, pluimvee, apen, hoefdieren, bijen, honden, katten, fretten en
      lagomorfen met gezondheidscertificaat.

      3 Voor de toepassing van de [afdelingen 5][ref9] en [6 van hoofdstuk 2][ref10] worden onder dieren mede verstaan
      de dieren, bedoeld in artikel 13, eerste lid, van [richtlijn 92/65/EEG](31992L0065) en worden onder producten mede
      verstaan de producten, bedoeld in artikel 13, eerste lid, van [richtlijn 92/65/EEG](31992L0065).

      4 Voor de toepassing van [hoofdstuk 2][ref11] wordt onder ‘keuringsdierenarts’ mede verstaan degene die namens de
      keuringsdierenarts onder diens gezag en verantwoordelijkheid optreedt.

      5 Voor de toepassing van de [artikelen 3.13][ref12], [4.8][ref13], [7.7][ref14] en [7a.1][ref15] wordt, zolang de
      daarin vermelde lijsten, garanties, voorschriften, specifieke bepalingen of uitvoeringsbepalingen nog niet zijn
      vastgesteld, daaronder begrepen, voor zover van toepassing, de lijsten, garanties, voorschriften, bepalingen of
      uitvoeringsbepalingen van beschikking 79/542/EEG.


