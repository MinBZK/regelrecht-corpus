  - number: '7.4'
    text: |-
      De schapen of geiten behoeven niet in het kader van een programma tot uitroeiing van in bijlage B, rubriek I, van
      [richtlijn 91/68/EEG](31991L0068) genoemde ziekten te worden geruimd.
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel7.4
  - number: '7.5'
    text: |-
      De schapen en geiten zijn geïdentificeerd en geregistreerd overeenkomstig het bij of krachtens het
      [Besluit identificatie en registratie van dieren][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0009019
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0009019
  - number: '7.6'
    text: |-
      Indien een partij is verzonden vanuit een lid-staat en bestemd is voor Nederland of een lid-staat, gaat zij
      vergezeld van het gezondheidscertificaat dat op grond van artikel 9 van [richtlijn 91/68/EEG](31991L0068) voor de
      desbetreffende soort schapen of geiten is voorgeschreven, met dien verstande dat:

      a. voor het binnen Nederland brengen van een partij schapen of geiten, vanuit staten, niet zijnde lid-staten die
      partij zijn bij het EER-Verdrag, op vorenbedoeld gezondheidscertificaat niet behoeft te zijn aangegeven of de
      dieren afkomstig zijn uit of zijn aangekocht in derde landen;

      b. wordt voldaan aan de algemene of aanvullende garanties, bedoeld in artikel 8, tweede lid, van [richtlijn 91/68/
      EEG](31991L0068);

      c. voldaan wordt aan, voor zover van toepassing, artikel 4 ter, derde en vierde lid, artikel 4 quater, derde lid,
      onderdelen a en b, onder ii, van [richtlijn 91/68/EEG](31991L0068) en, indien het slachtschapen of -geiten betreft
      die via een schapen- of geitenverzamelcentrum worden vervoerd, aan artikel 4 quater, derde lid, onderdeel b, onder
      i, van [richtlijn 91/68/EEG](31991L0068);

      d. voldaan wordt aan bijlage VIII, hoofdstuk A, afdeling A, onderdeel 4.1, onderdeel a, van [verordening (EG) nr.
      999/2001](32001R0999), indien het fokschapen of -geiten betreft.
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel7.6
  - number: 7.6a
    text: |-
      Indien een partij schapen of geiten is bestemd voor Nederland of voor een lidstaat komt de partij tot de plaats
      van bestemming, respectievelijk tot de plaats waar de partij buiten Nederland wordt gebracht, geen enkel moment in
      aanraking met andere evenhoevige dieren die niet over dezelfde gezondheidsstatus beschikken.
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel7.6a
  - number: 7.6b
    text: |-
      Een vervoerder van een partij schapen of geiten voldoet aan artikel 8 quater, eerste tot en met vierde lid, van
      [richtlijn 91/68/EEG](31991L0068).
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel7.6b
  - number: '7.7'
    text: |-
      1 Een partij schapen of geiten is afkomstig uit een derde land dat voorkomt op een krachtens artikel 3, eerste lid,
      van [richtlijn 2004/68/EG](32004L0068) vastgestelde lijst.

      2 Het in het eerste lid bedoelde derde land biedt de in artikel 7 van [richtlijn 2004/68/EG](32004L0068) gegeven
      garanties en de partij schapen of geiten voldoet, voor zover van toepassing, aan de krachtens artikel 6, eerste
      lid, van [richtlijn 2004/68/EG](32004L0068) vastgestelde veterinairrechtelijke voorschriften, tenzij krachtens
      artikel 8 van [richtlijn 2004/68/EG](32004L0068) specifieke bepalingen zijn vastgesteld, in welk geval die gelden.

      3 Een partij schapen of geiten gaat vergezeld van een veterinair certificaat als bedoeld in artikel 11, eerste lid,
      van [richtlijn 2004/68/EG](32004L0068).

      4 Een partij schapen of geiten voldoet, voor zover van toepassing, aan de krachtens artikel 13 van [richtlijn
      2004/68/EG](32004L0068) vastgestelde uitvoeringsbepalingen.

      5 Een partij schapen of geiten voldoet, voor zover van toepassing, aan de voorwaarden van bijlage IX, hoofdstuk E,
      van verordening (EG) nr. 999/2001.
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel7.7
  - number: 7.7a
    text: |-
      1 Uit een derde land afkomstige, in Nederland gebrachte fokschapen en -geiten en mestschapen en -geiten, bestemd
      voor Nederland, worden rechtstreeks naar het bedrijf van bestemming vervoerd en aan het beslag op het bedrijf van
      bestemming toegevoegd.

      2 De in het eerste lid bedoelde schapen en geiten mogen gedurende een periode van ten minste 30 dagen, te rekenen
      vanaf de dag waarop de schapen en geiten op het bedrijf van bestemming zijn binnengebracht, het bedrijf niet
      verlaten, behoudens de rechtstreekse afvoer naar een in Nederland gelegen slachthuis.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op schapen en geiten, afkomstig uit derde landen,
      die zijn bestemd voor dierentuinen, pretparken, wildparken en jachtgebieden.
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel7.7a
  - number: '7.8'
    text: |-
      1 In Nederland gebrachte slachtschapen of -geiten, bestemd voor Nederland, worden rechtstreeks vervoerd naar en
      geslacht in een slachthuis.

      2 In afwijking van het eerste lid mogen slachtschapen of -geiten afkomstig uit een lidstaat passeren via één
      schapen- of geitenverzamelcentrum, mits is voldaan aan artikel 4 quater, derde lid, onderdeel b, onder i, van
      [richtlijn 91/68/EEG](31991L0068).
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel7.8
  - number: '7.9'
    text: |-
      1 Een handelaar wordt door de minister erkend indien:

        - voldaan is aan artikel 8 ter, eerste lid, onderdelen a en b, van [richtlijn 91/68/EEG](31991L0068);
        - voor zover van toepassing, zijn bedrijfsruimte voldoet aan het tweede lid en aan artikel 8 ter, eerste lid,
      onderdeel c, tweede gedachtestreepje, van [richtlijn 91/68/EEG](31991L0068).

      2 Elke bedrijfsruimte die door een handelaar beroepshalve wordt gebruikt, staat onder toezicht
      van de ambtenaren en wordt door de minister slechts erkend en geregistreerd indien is voldaan
      aan de in de de [artikelen 21, vierde lid][ref1], [24][ref2], [47][ref3], [48][ref4], en
