  - number: 9.10c
    text: |-
      1 De keuringsdierenarts is belast met de in Bijlage A, Hoofdstuk II, punt 2, onderdeel b, van richtlijn 88/407/EEG
      en de in Bijlage D, Hoofdstuk I, onderdeel II, subonderdeel 2, punt 2.4, van richtlijn 92/65/EEG bedoelde controle.

      2 De eigenaar of de exploitant van een spermaopslagcentrum dan wel diens vertegenwoordiger draagt er zorg voor dat
      de keuringsdierenarts alle medewerking wordt verleend die deze redelijkerwijs voor de vervulling van zijn taken in
      het kader van de in het eerste lid bedoelde controle noodzakelijk acht en dat diens aanwijzingen ter zake door de
      dierenarts en het personeel van het centrum worden opgevolgd.

      3 De minister trekt de verleende erkenning in, indien de keuringsdierenarts heeft geconstateerd dat de in
      [artikel 9.10a, eerste lid][ref1], bedoelde voorschriften niet worden nageleefd dan wel dat niet voldaan wordt aan
      het tweede of zesde lid, doch niet dan nadat gedurende een redelijke termijn gelegenheid is gegeven de voor het
      behoud van de erkenning noodzakelijke voorzieningen te treffen.

      4 Indien de erkenning ingevolge dit artikel is ingetrokken, kan de minister gelasten dat het in de door hem vast te
      stellen periode direct voorafgaand aan de intrekking opgeslagen sperma, in tijdelijke afzondering wordt geplaatst
      dan wel wordt vernietigd, met inachtneming van diens aanwijzingen, zonder vergoeding van Staatswege en voor
      rekening van de exploitant van het spermaopslagcentrum.

      5 Voor een spermaopslagcentrum waarvan de erkenning is ingetrokken of waarvan een aanvraag voor het
      verlenen van de erkenning is afgewezen, worden bij een hernieuwde erkenningsaanvraag de gegevens, bedoeld in
      [artikel 9.10a, derde lid][ref2], opnieuw verstrekt en wordt tevens aangetoond dat de omstandigheden welke tot de
      intrekking dan wel de afwijzing hebben geleid, zijn opgeheven.

      6 Een erkend spermaopslagcentrum stelt de minister in kennis van elke wijziging van de bij de oorspronkelijke
      aanvraag verstrekte gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel9.10a
      [ref2]: https://wetten.overheid.nl/BWBR0007049#Artikel9.10a
