  - number: '2.20'
    text: |-
      Indien de partij via het grondgebied van een lid-staat naar een derde land wordt gebracht, vindt het vervoer van de
      partij over Nederlands grondgebied onder douanetoezicht plaats.
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel2.20
  - number: '2.21'
    text: |-
      [Artikel 2.15][ref1] is van overeenkomstige toepassing.


