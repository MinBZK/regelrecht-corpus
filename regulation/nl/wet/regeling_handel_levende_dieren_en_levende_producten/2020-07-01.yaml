  - number: '2.18'
    text: |-
      De bewijsstukken, bedoeld in [artikel 2.16, eerste lid, onderdeel b][ref1], worden slechts afgegeven, indien op
      grond van een van Rijkswege ingesteld onderzoek is gebleken dat voldaan wordt aan de [artikelen 2.20][ref2] en
      [2.21][ref3] en aan:

        - de [artikelen 3.3][ref4] en [3.4 van afdeling 2 van hoofdstuk 3][ref5], indien het runderen betreft;
        - de [artikelen 4.3][ref6] en [4.4 van afdeling 2 van hoofdstuk 4][ref7], indien het varkens betreft;
        - de [artikelen 5.3][ref8] en [5.4 van afdeling 2 van hoofdstuk 5][ref9], indien het paardachtigen betreft;
        - voor zover van toepassing, de [artikelen 6.3][ref10], [6.4][ref11] of
      [6.5 van afdeling 2 van hoofdstuk 6][ref12], indien het pluimvee en broedeieren betreft;
        - de [artikelen 7.3][ref13] en [7.4 van afdeling 2][ref14] alsmede
      [artikel 7.6 van afdeling 3 van hoofdstuk 7][ref15], indien het schapen of geiten betreft;
        - [artikel 8.3 van afdeling 2 van hoofdstuk 8][ref16], indien het apen, hoefdieren, bijen, honden, katten en
      lagomorfen met gezondheidscertificaat betreft;
        - de [artikelen 9.3][ref17] en [9.4 van afdeling 2 van hoofdstuk 9][ref18], indien het sperma betreft;
        - de [artikelen 10.3][ref19] of [10.4 van afdeling 2 hoofdstuk 10][ref20], indien het embryo's betreft;
        - [artikel 11.3 van afdeling 2 van hoofdstuk 11][ref21], indien het eicellen betreft, met dien verstande dat;
        - indien het dieren betreft, tenminste wordt voldaan aan hetgeen in vorenbedoelde artikelen voor slachtdieren is
      bepaald, en
        - het veterinaire document of certificaat, dat aan de veterinaire voorschriften van het derde land van bestemming
      voldoet, slechts wordt afgegeven indien aan de voorschriften van het derde land van bestemming wordt voldaan.


