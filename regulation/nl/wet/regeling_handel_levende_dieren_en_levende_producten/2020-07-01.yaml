      1 Op grond van het onderzoek, bedoeld in [artikel 2.5][ref1], is gebleken dat voldaan wordt aan:

      a. artikel 3, tweede lid, onderdelen a, b en d, van [richtlijn 64/432/EEG](31964L0432);

