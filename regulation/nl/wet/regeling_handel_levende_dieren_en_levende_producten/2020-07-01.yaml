  - number: 9.10d
    text: |-
      1 Bij de aanvraag tot erkenning van een spermacentrum voor schapen of geiten worden de volgende gegevens verstrekt:

      a. de naam, het adres en de vestigingsplaats van het spermacentrum;

      b. het aan het spermacentrum krachtens het [Besluit identificatie en registratie van dieren][ref1] uitgegeven uniek
      bedrijfsnummer;

      c. een plattegrond van kadastrale eenheden waarop het spermacentrum is gesitueerd, waarbij is aangegeven:

        - de afscheiding ten opzichte van de directe omgeving;
        - de afstand en de aard van de omliggende bedrijven, en
        - de ligging van de in Bijlage D, Hoofdstuk I, onderdeel I, subonderdeel 1, punt 1.2, van richtlijn 92/65/EEG,
      bedoelde ruimten en voorzieningen;

      d. voor zover de in het vorige onderdeel, bedoelde voorzieningen niet zijn gelegen op de kadastrale eenheden waarop
      het spermacentrum is gesitueerd, de naam, het adres en de vestigingsplaats van deze voorzieningen, en

      e. de naam van de dierenarts van het spermacentrum.

      2 De erkenning wordt door de minister verleend, nadat uit een door de keuringsdierenarts ingesteld onderzoek is
      gebleken, dat voldaan wordt aan de in [artikel 9.10, eerste lid, onderdeel a, subonderdeel 3][ref2], bedoelde
      voorschriften.

      3 De minister trekt de verleende erkenning in, indien de keuringsdierenarts heeft geconstateerd dat de in
      [artikel 9.10, eerste lid, onderdeel a, subonderdeel 3][ref3], bedoelde voorschriften niet worden nageleefd dan wel
      dat niet voldaan wordt aan [artikel 9.10e][ref4] of aan het vijfde lid, doch niet dan nadat gedurende een redelijke
      termijn gelegenheid is gegeven de voor het behoud van de erkenning noodzakelijke voorzieningen te treffen.

      4 Een spermacentrum voor schapen of geiten waarvan de erkenning werd ingetrokken of waarvan een aanvraag voor
      het opnieuw verlenen van de erkenning werd afgewezen en dat weer voor erkenning in aanmerking wenst te komen,
      moet opnieuw een aanvraag indienen, de gegevens, bedoeld in het eerste lid opnieuw verstrekken en tevens kunnen
      aantonen, dat de omstandigheden welke tot de intrekking dan wel de afwijzing hebben geleid, zijn opgeheven.

      5 Een erkend spermacentrum voor schapen of geiten stelt de minister in kennis van elke wijziging van de bij de
      oorspronkelijke aanvraag verstrekte gegevens.


