        bwb_id: BWBR0007049
        artikel: 11c.3
        hoofdstuk: 11c
        afdeling: '2'
  - number: 11c.8
    text: |-
      Het inplanten van een transponder door een ander dan een dierenarts, bedoeld in artikel 18 van verordening (EU)
      nr. 576/2013, is toegestaan aan degene die beroepsmatig met een zekere regelmaat transponders inbrengt.
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel11c.8
  - number: '13.1'
    text: |-
      De Regeling in- en doorvoer vee, veeproducten e.d., de Regeling doorvoer vee 1992, de Regeling wederinvoer vee
      1992, de Regeling invoer vee 1992, de Regeling in- en doorvoer sperma van runderen 1992, de Regeling in- en
      doorvoer embryo's van runderen 1993, de Regeling in- en doorvoer sperma van varkens 1993, de Regeling in- en
      doorvoer papagaaien en papagaaiachtigen 1977, de Regeling invoer levende en dode vossen, de Regeling in en doorvoer
      levende konijnen 1984, de Regeling in- en doorvoer nertsen 1977, de Regeling in- en doorvoer honden en katten, de
      Regeling in-, uit- en doorvoer circusdieren 1971, de Regeling in-, door- en vervoer pluimvee, vogels en broedeieren
      1992, de Regeling in- en doorvoer levende dieren en producten 1993, de Regeling uitvoer vee 1974, de Beschikking
      vervoer sperma van runderen, de Beschikking vervoer diepgevroren sperma van runderen, de Beschikking vervoer
      embryo's van runderen, de Beschikking vervoer sperma van varkens, de Regeling vervoer levende dieren en producten
      1993, en de Beschikking vervoer pluimvee en broedeieren, de Beschikking vervoer geregistreerde paardachtigen en de
      Regeling voorschriften slachtkalveren worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel13.1
  - number: 13.1a
    text: |-
      Deze regeling berust mede op de [artikelen 30][ref1] en [105 van de Gezondheids- en welzijnswet voor dieren][ref2]
      en de [artikelen 4][ref3] en [5 van het Besluit uitvoering verordening officiële controles diergezondheid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel105
      [ref3]: https://wetten.overheid.nl/BWBR0042383#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0042383#Artikel5
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel13.1a
