  - number: '2.56'
    text: |-
      Het verbod, bedoeld in [artikel 2.1, tweede lid, eerste en tweede gedachtenstreepje][ref1], voor zover dit
      betrekking heeft op het brengen in Nederland van dieren uit staten, niet zijnde lid-staten, die partij zijn bij
      het EER-Verdrag, geldt niet, mits voldaan wordt aan [artikel 2.57][ref2], verordening (EU) 2017/625 en de daarop
      gebaseerde gedelegeerde handelingen en uitvoeringshandelingen van de Europese Commissie en aan:

      a. [afdeling 3 van hoofdstuk 3][ref3], met uitzondering van [artikel 3.7, eerste lid][ref4], indien het runderen
      betreft;

      b. [afdeling 3 van hoofdstuk 4][ref5], met uitzondering van [artikel 4.7, eerste lid][ref6], indien het varkens
      betreft;

      c. [afdeling 3 van hoofdstuk 5][ref7], indien het paardachtigen betreft;

      d. [afdeling 3 van hoofdstuk 6][ref8], indien het pluimvee betreft;

      e. [afdeling 3 van hoofdstuk 7][ref9], indien het schapen en geiten betreft;

      f. [artikel 7a.1][ref10] van hoofdstuk 7a, indien het gaffelantilopen, herten, muskusherten, dwergherten, giraffen,
      okapi’s, eeltpotigen, nijlpaarden, pecari’s, neushoorns, tapirs, olifanten en holhoornigen niet zijnde runderen,
      geiten en schapen betreft;

      g. [afdeling 4 van hoofdstuk 8][ref11], indien het apen, hoefdieren, bijen, honden, katten, lagomorfen, vogels,
      fretten, nertsen en vossen betreft.


