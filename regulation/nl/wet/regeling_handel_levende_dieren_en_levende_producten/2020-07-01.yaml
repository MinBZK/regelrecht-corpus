  - number: '2.24'
    text: |-
      Indien de partij bestemd is voor een derde land, gaat zij tijdens het vervoer naar de plaats waar zij weer buiten
      Nederland wordt gebracht, vergezeld van de certificaten of documenten, bedoeld in [artikel 2.22, derde lid][ref1],
      dan wel van de documenten, bedoeld in artikel 2.22, vierde lid.


