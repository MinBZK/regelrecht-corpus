    text: |-
      Op grond van het onderzoek, bedoeld in [artikel 2.5][ref1], is gebleken dat:

      a. voldaan wordt aan artikel 4, eerste tot en met derde en vijfde lid, van richtlijn nr. 2009/156/EG, en

      b. dat de paardachtigen niet afkomstig zijn van het grondgebied of een deel van het grondgebied van Nederland
      waarvoor in verband met paardepest beperkende maatregelen gelden, of

      c. indien de paardachtigen afkomstig zijn van het grondgebied of een deel van het grondgebied van Nederland
      waarvoor in verband met paardepest beperkende maatregelen gelden, voldaan wordt aan artikel 5, vijfde lid, van
      richtlijn nr. 2009/156/EG.


