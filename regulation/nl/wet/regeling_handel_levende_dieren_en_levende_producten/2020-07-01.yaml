  - number: '5.1'
    text: |-
      Onverminderd [artikel 1.1][ref1], wordt in dit hoofdstuk verstaan onder:

        - *richtlijn nr. 2009/156/EG:* richtlijn nr. 2009/156/EG van de Raad van de Europese Unie van 30 november 2009
      tot vaststelling van veterinairrechtelijke voorschriften voor het verkeer van paardachtigen en de invoer van
      paardachtigen uit derde landen (*PbEU L 192*);
        - *Verordening (EU) nr. 262/2015:* Uitvoeringsverordening (EU) nr. 262/2015 van de Commissie van 17 februari
      2015 tot vaststelling van voorschriften overeenkomstig de Richtlijnen 90/427/EEG en 2009/156/EG van de Raad met
      betrekking tot de methoden voor de identificatie van paardachtigen (verordening paardenpaspoort) (PbEU 2015 L
      59/1);
        - *identificatiedocument:* identificatiedocument als bedoeld in artikel 7, eerste lid, van Verordening (EU) nr.
      262/2015.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel1.1
