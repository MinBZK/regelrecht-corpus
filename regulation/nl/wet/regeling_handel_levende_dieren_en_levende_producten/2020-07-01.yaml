  - number: '6.3'
    text: |-
      1 Op grond van het onderzoek, bedoeld in [artikel 2.5][ref1], is gebleken dat:

      a. voldaan wordt aan artikel 8 van richtlijn nr. 2009/158/EG, indien het broedeieren betreft;

      b. voldaan wordt aan artikel 9 van richtlijn nr. 2009/158/EG, indien het eendagskuikens betreft;

      c. voldaan wordt aan artikel 10 van richtlijn nr. 2009/158/EG, indien het fok- en gebruikspluimvee betreft;

      d. voldaan wordt aan artikel 11 van richtlijn nr. 2009/158/EG, indien het slachtpluimvee betreft;

      e. de broedeieren, de eendagskuikens en het fok- en gebruikspluimvee afkomstig zijn van een op grond van
      [artikel 6.8][ref2] erkende inrichting die voldoet aan artikel 6, onderdeel a, onder ii) en iii), van richtlijn
      nr. 2009/158/EG;

      f. de broedeieren, de eendagskuikens en het fok- en gebruikspluimvee voldoen aan artikel 6, onderdeel b, van
      richtlijn nr. 2009/158/EG;

      g. het vervoer van het pluimvee of de broedeieren plaatsvindt overeenkomstig de artikelen 18 en 19 van richtlijn
      nr. 2009/158/EG;

      h. indien het vervoer van het pluimvee of de broedeieren plaatsvindt naar lid-staten of gebieden van lid-staten
      waarvan de status ten aanzien van de ziekte van Newcastle op grond van artikel 12, tweede lid, van richtlijn
      nr. 2009/158/EG door de Europese Commissie is vastgesteld, is voldaan aan artikel 12, eerste lid, van richtlijn
      nr. 2009/158/EG of aan de op grond van artikel 12, tweede lid, van richtlijn nr. 2009/158/EG vastgestelde
      communautaire maatregelen;

      i. in voorkomend geval, is voldaan aan de krachtens de artikelen 16 en 17 van richtlijn nr. 2009/158/EG gestelde
      voorschriften.

      2 Het eerste lid is niet van toepassing wanneer het een partij pluimvee of broedeieren, niet zijnde loopvogels of
      broedeieren daarvan, betreft van minder dan twintig stuks.


