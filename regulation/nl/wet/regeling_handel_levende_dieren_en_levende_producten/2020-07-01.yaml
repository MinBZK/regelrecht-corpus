  - number: 11c.5
    text: |-
      1 In aanvulling op artikel 22, eerste en tweede lid, van verordening (EU) nr. 576/2013, vermeldt de gemachtigde
      dierenarts bij de afgifte van een identificatiedocument in rubriek XII van het identificatiedocument:

      a. het land van geboorte van het dier, en

      b. indien van toepassing, de unieke alfanumerieke code van eerder voor het dier afgegeven identificatiedocumenten.

      2 De termijn, bedoeld in artikel 22, derde lid, van verordening (EU) nr. 576/2013, bedraagt drie jaar.
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel11c.5
  - number: 11c.6
    text: |-
      1 Het is verboden blanco identificatiedocumenten voorhanden te hebben.

      2 Het verbod, bedoeld in het eerste lid, geldt niet voor:

      a. gemachtigde dierenartsen als bedoeld in [artikel 11c.3, eerste lid][ref1], en

      b. erkende uitgevers als bedoeld in [artikel 11c.4, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel11c.3
      [ref2]: https://wetten.overheid.nl/BWBR0007049#Artikel11c.4
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel11c.6
    references:
