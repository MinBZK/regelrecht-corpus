      1 Embryo’s van varkens, schapen, geiten of eenhoevige dieren als bedoeld in artikel 13, eerste lid, van [richtlijn
      92/65/EEG](31992L0065) gaan vergezeld van het in artikel 13, eerste lid, van [richtlijn 92/65/EEG](31992L0065)
      bedoelde vervoersdocument.

      2 De documenten, bedoeld in het eerste lid, zijn opgesteld en afgegeven in overeenstemming met de regelgeving van
      de Raad van de Europese Unie of de Europese Commissie, volledig ingevuld, gedagtekend en ondertekend, terwijl de
