  - number: '11.7'
    text: |-
      1 Eicellen als bedoeld in artikel 13, eerste lid, van [richtlijn 92/65/EEG](31992L0065) gaan vergezeld van het in
      artikel 13, eerste lid, van [richtlijn 92/65/EEG](31992L0065) bedoelde vervoersdocument.

      2 De documenten, bedoeld in het eerste lid, zijn opgesteld en afgegeven in overeenstemming met de regelgeving van
      de Raad van de Europese Unie of de Europese Commissie, volledig ingevuld, gedagtekend en ondertekend, terwijl de
      geldigheidsduur ervan niet is verstreken.
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel11.7
  - number: 11a.1
    text: |-
      In dit hoofdstuk wordt onder communautaire vrijwaringsmaatregel verstaan verordening, richtlijn of beschikking als
      bedoeld in artikel 288 van het Verdrag betreffende de werking van de Europese Unie met betrekking tot dieren of
      levende dierlijke producten.
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel11a.1
  - number: 11a.2
    text: |-
      Het is verboden dieren, broedeieren, sperma, embryo’s en eicellen vanuit een lidstaat of een derde land, of een
      deel daarvan, in Nederland te brengen ingeval op grond van een communautaire vrijwaringsmaatregel voor lidstaten
      een verplichting geldt om:

      a. het binnenbrengen van de desbetreffende diersoort, dan wel het desbetreffende product, uit het desbetreffende
      land of een deel daarvan te schorsen;

      b. bijzondere voorwaarden aan de het binnenbrengen van desbetreffende dieren, dan wel producten uit het
      desbetreffende land of een deel daarvan te stellen, indien niet is voldaan aan de bij deze communautaire
      vrijwaringsmaatregel voorgeschreven voorwaarden.
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel11a.2
  - number: 11a.3
    text: |-
      1 De bevoegde autoriteit, bedoeld in een communautaire vrijwaringsmaatregel, is de minister.

      2 In afwijking van het eerste lid is, ingeval een communautaire vrijwaringsmaatregel de bevoegde autoriteit een
      taak opdraagt die niet bestaat in het nemen van een besluit, de bevoegde autoriteit de NVWA.

      3 De officiële dierenarts, bedoeld in een communautaire vrijwaringsmaatregel, is een dierenarts, verbonden aan
      de NVWA.
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel11a.3
  - number: 11a.4
    text: |-
      Een communautaire vrijwaringsmaatregel, of een wijziging daarvan, treedt voor de toepassing van deze regeling in
      werking met ingang van de dag waarop daaraan uiterlijk uitvoering moet zijn gegeven, of bij gebreke daarvan, de dag
      waarop de maatregel is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel11a.4
  - number: 11b.1
    text: |-
      Een partij bijensperma of eicellen van bijen wordt, voor zover nodig in afwijking van
      [artikel 2.1, tweede lid][ref1], onder de volgende voorwaarden in Nederland gebracht:

      a. de partij bijensperma of eicellen van bijen is verzonden vanuit:

      1° een derde land of een deel van een derde land, dat is vermeld op de lijst, bedoeld in artikel 7, eerste of
      tweede lid, van verordening (EU) nr. 206/2010, of

      2° een lid-staat, waarin de partij bijensperma of eicellen van bijen rechtmatig in de handel is gebracht en die
      voldoet aan eisen die een beschermingsniveau bieden dat ten minste gelijkwaardig is aan het niveau dat met de
      nationale eisen wordt nagestreefd;

      b. de partij gaat vergezeld van het gezondheidscertificaat afgegeven door een officiële dierenarts, opgenomen in
      [bijlage 2][ref2] bij deze regeling, tenzij ze reeds vergezeld gaat van een gezondheidscertificaat als bedoeld in
      artikel 13, eerste lid, van richtlijn 92/65/EEG;

      c. het verpakkingsmateriaal van de partij bijensperma en eicellen wordt onderzocht door de NVWA op ziekten en
      parasieten;

      d. totdat het onderzoek is afgerond, worden bijensperma en eicellen van bijen slechts gebruikt in afgesloten
      bijenkasten.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0007049
