  - number: '9.13'
    text: |-
      Een erkende quarantainevoorziening voldoet aan de volgende eisen:

      a. de quarantaineruimte is zodanig omheind, dat vrije toegang tot de quarantaineruimte niet mogelijk is;

      b. voor het personeel en de bezoekers is een hygiënesluis aanwezig die zodanig gesitueerd is, dat zij deze passeren
      alvorens zij de quarantaineruimte betreden. De hygiënesluis is voorzien van omkleed- en douchefaciliteiten. Schone
      bedrijfskleding en laarzen zijn in de hygiënesluis aanwezig;

      c. de quarantainevoorziening beschikt over:

        - een stalruimte voor de dagelijkse huisvesting en verzorging van de bokken of de rammen die op efficiënte wijze
      fysiek is afgesloten van de overige ruimten van de quarantainevoorziening;
        - een voorziening voor de reiniging en ontsmetting van de gebruikte materialen, en
        - voor ontoegankelijke ruimten voor de opslag van stro, voer, kleding en medicijnen;

      d. de eigenaar of exploitant van de quarantainevoorziening dan wel diens vertegenwoordiger draagt ervoor zorg dat
      het personeel en de bezoekers zich douchen en zich kleden met schone bedrijfskleding en laarzen voordat zij de
      quarantainevoorziening betreden;

      e. de quarantainevoorziening beschikt over een door de keuringsdierenarts vanuit één plaats op de
      quarantainevoorziening te raadplegen register dat dagelijks wordt bijgehouden en dat zodanig is ingericht, dat
      daaruit te allen tijde op eenvoudige wijze met betrekking tot elke ram of bok kan worden afgeleid:

        - het krachtens het [Besluit identificatie en registratie van dieren][ref1] toegekende identificatienummer;
        - gegevens inzake de uitgevoerde vaccinaties;
        - gegevens uit het ziekte/gezondheidsdossier;
        - de datum van toelating op de quarantaineruimte;
        - het beslag of bedrijf van waaruit de bok of ram afkomstig is, en
        - de gegevens, waaronder de laboratoriumuitslagen, onder vermelding van de datum, betreffende de in Bijlage D,
      Hoofdstuk II, onderdeel II, subonderdeel 1, punt 1.4 en 1.5, van richtlijn 92/65/EEG voorgeschreven tests, en

      f. de keuringsdierenarts wordt in verband met het door hem uit te oefenen toezicht op de naleving van onderdeel a
      tot en met g, praktisch in de gelegenheid gesteld de werkzaamheden van de quarantaineruimte te controleren.


      [ref1]: https://wetten.overheid.nl/BWBR0009019
