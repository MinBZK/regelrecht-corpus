  - number: 9.10a
    text: |-
      1 Een runderspermaopslagcentrum wordt door de minister erkend, indien uit een door de keuringsdierenarts ingesteld
      onderzoek is gebleken, dat het runderspermaopslagcentrum voldoet aan Bijlage A, Hoofdstuk I, punt 2, en Hoofdstuk
      II, punt 2, de overige relevante bepalingen van [richtlijn 88/407/EEG](31988L0407) en [artikel 9.10b][ref1].

      2 Een spermaopslagcentrum voor geiten, schapen of paardachtigen wordt door de minister erkend, indien uit een door
      de keuringsdierenarts ingesteld onderzoek is gebleken, dat het spermaopslagcentrum voldoet aan Bijlage D, Hoofdstuk
      1, onderdeel I, subonderdeel 2 en Hoofdstuk 1, onderdeel II, subonderdeel 2, de overige relevante bepalingen van
      richtlijn 92/65/EEG en [artikel 9.10 b][ref2].

      3 Een aanvraag tot erkenning wordt ingediend bij de minister.

      4 Bij een aanvraag om erkenning van een spermaopslagcentrum worden de volgende gegevens verstrekt:

      a. de naam, het adres en de vestigingsplaats van het spermaopslagcentrum;

      b. een plattegrond van het spermaopslagcentrum, waarbij de functies van de verschillende ruimten binnen het centrum
      zijn aangegeven;

      c. de naam van de dierenarts van het spermaopslagcentrum.

      5 Aan een erkend spermaopslagcentrum wordt door de minister in verband met de erkenning een registratienummer
      toegekend.

      6 Als in een spermaopslagcentrum voor geiten, schapen of paardachtigen niet uitsluitend sperma van één diersoort,
      dat is gewonnen in overeenkomstig [artikel 9.10, eerste lid, onderdeel a, subonderdeel 3][ref3], erkende
      spermacentra, wordt opgeslagen, of als er overeenkomstig richtlijn 92/65/EEG embryo’s worden opgeslagen, wordt
      aan het spermaopslagcentrum voor elke diersoort waarvan sperma in het centrum wordt opgeslagen een apart nummer
      toegekend.


