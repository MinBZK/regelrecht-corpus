    text: |-
      1 Indien een partij die is verzonden vanuit een lid-staat en bestemd is voor Nederland of een lid-staat, gaat zij
      vergezeld van:

      a. het gezondheidscertificaat dat op grond van artikel 6 van [richtlijn 89/556/EEG](31989L0556) is voorgeschreven,
      indien het runderembryo's betreft, of

      b. het gezondheidscertificaat dat op grond van artikel 11, derde lid, derde gedachtenstreepje, van [richtlijn
      92/65/EEG](31992L0065) is voorgeschreven indien het embryo's van schapen, geiten, varkens en paardachtigen betreft.

      2 De partij voldoet aan bijlage VIII, hoofdstuk A, afdeling A, onderdeel 4.2, van [verordening (EG) nr. 999/2001]
      (32001R0999) indien het embryo’s van schapen of geiten betreft.
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel10.5
  - number: '10.6'
    text: |-
      1 De partij is verzonden vanuit een derde land of een deel van een derde land, dat is vermeld op de lijst:

      a. bedoeld in artikel 7, eerste lid, van [richtlijn 89/556/EEG](31989L0556), indien het runderembryo's betreft;

      b. die voor embryo’s van paardachtigen is vastgesteld in bijlage I bij uitvoeringsverordening (EU) 2018/659, als de
      zending voldoet aan de voorwaarden, bedoeld in artikel 5 van uitvoeringsverordening (EU) 2018/659, of

      c. bedoeld in artikel 17, tweede lid, onderdeel a, van [richtlijn 92/65/EEG](31992L0065), indien het sperma van
      varkens, schapen of geiten betreft, met dien verstande dat, indien vorenbedoelde lijst nog niet is vastgesteld,
      de partij uit geen enkel derde land mag zijn verzonden, indien zij voor Nederland is bestemd, en de partij is
      verzonden vanuit een derde land of een deel van een derde land van waaruit de lid-staat van bestemming de invoer
      toestaat, indien zij voor een lid-staat is bestemd.

      2 De partij is verzameld, behandeld en opgeslagen door een runderembryoteam of embryoteam dat is vermeld op de
      lijst, bedoeld in:

      a. artikel 8, eerste lid, van [richtlijn 89/556/EEG](31989L0556), indien het runderembryo's betreft, of

      b. artikel 17, derde lid, onderdeel b, van [richtlijn 92/65/EEG](31992L0065), indien het embryo's van varkens,
      schapen, geiten of paardachtigen betreft.

      3 De partij gaat vergezeld van het gezondheidscertificaat dat op grond van:

      a. artikel 10 van [richtlijn 89/556/EEG](31989L0556) is voorgeschreven, indien het runderembryo's betreft, of

      b. artikel 17, tweede lid, onderdeel b, van richtlijn 92/65/EEG is voorgeschreven, indien het embryo’s van varkens,
      schapen, geiten of paardachtigen betreft.

      4 De partij voldoet aan:

      a. de voorwaarden die zijn vastgesteld in en, in voorkomend geval, krachtens artikel 9 van [richtlijn 89/556/EEG]
      (31989L0556), indien het runderembryo’s betreft, of

      b. de voorwaarden die zijn vastgelegd in het gezondheidscertificaat, bedoeld in het derde lid, onderdeel b, en in
      voorkomend geval overige krachtens artikel 17, derde lid, artikel 18, eerste lid en artikel 19 van richtlijn 92/65/
      EEG vastgestelde communautaire uitvoeringsmaatregelen, indien het embryo’s van paardachtigen betreft, of

      c. bijlage IX, Hoofdstuk H, van verordening (EG) nr. 999/2001 en in voorkomend geval overige krachtens
      artikel 17, derde lid, artikel 18, eerste lid en artikel 19 van richtlijn 92/65/EEG vastgestelde communautaire
      uitvoeringsmaatregelen, indien het embryo’s van schapen of geiten betreft.
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel10.6
  - number: '10.7'
    text: |-
      Embryo's van varkens, schapen, geiten of paardachtigen als bedoeld in artikel 13, eerste lid, van [richtlijn 92/65/
      EEG](31992L0065):

      a. gaan vergezeld van het vervoersdocument, dat op grond van artikel 13, eerste lid, van [richtlijn 92/65/EEG]
      (31992L0065) is voorgeschreven;

      b. zijn afkomstig van een instelling, instituut of centrum dat is erkend overeenkomstig [artikel 9.11][ref1]
      en zijn bestemd voor een door de bevoegde autoriteit van het land van bestemming overeenkomstig bijlage C van
      [richtlijn 92/65/EEG](31992L0065) erkende instelling, erkend instituut of erkend centrum.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel9.11
