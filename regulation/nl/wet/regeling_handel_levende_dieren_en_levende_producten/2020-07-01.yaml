  - number: '2.54'
    text: |-
      Noch op grond van regelgeving van de Toezichthoudende Autoriteit van de EVA, noch op grond van het EER-Verdrag
      geldt een verbod om de dieren of producten vanuit Nederland in een staat, niet zijnde een lid-staat, die partij is
      bij het EER-Verdrag te brengen.
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel2.54
  - number: '2.55'
    text: |-
      Indien de partij op grond van het onderzoek, bedoeld in [artikel 2.53][ref1], geschikt is bevonden om anders dan
      in doorvoer buiten Nederland te worden gebracht, wordt zij onmiddellijk na het onderzoek, langs de kortste weg naar
      het transportmiddel vervoerd, waarmee zij buiten Nederland zal worden gebracht en wordt zij zo spoedig mogelijk,
      rechtstreeks, buiten Nederland gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.53
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel2.55
