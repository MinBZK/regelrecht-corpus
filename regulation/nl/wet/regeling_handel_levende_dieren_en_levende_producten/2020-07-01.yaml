  - number: 9.10b
    text: |-
      1 Ten behoeve van het toezicht, bedoeld in Bijlage A, Hoofdstuk II, punt 2, van richtlijn 88/407/EEG en in Bijlage
      D, Hoofdstuk I, onderdeel II, subonderdeel 2, van richtlijn 92/65/EEG, voorziet de eigenaar of exploitant van een
      runderspermaopslagcentrum of spermaopslagcentrum geiten, schapen of paardachtigen dan wel diens vertegenwoordiger
      in het opstellen van:

      a. voorschriften inzake:

        - de reiniging en ontsmetting van de apparatuur die in contact komt met sperma;
        - de herkomst van sperma;
        - het opslaan van sperma;
        - de reiniging en ontsmetting van de in het zesde lid bedoelde ruimten en voorzieningen;
        - de toegang tot de in het zesde lid bedoelde ruimten, en
        - de wijze van kleding van het personeel;

      b. een protocol, waarin voor de in het zevende lid bedoelde ruimten en voorzieningen, de werkprocessen
      chronologisch en gedetailleerd beschreven zijn, en

      c. een kwaliteitsbeheersingsplan, waarin ter waarborging van een correcte uitvoering en registratie van de in
      onderdeel b bedoelde processen, de in acht te nemen werkwijzen chronologisch en gedetailleerd zijn vastgelegd.

      2 De eigenaar of exploitant van een spermaopslagcentrum dan wel diens vertegenwoordiger zorgt dat het personeel
      zijn werkzaamheden verricht overeenkomstig de wettelijke bepalingen en de daarop gebaseerde interne procedures
      en voorschriften, draagt er zorg voor dat de dierenarts van het centrum toeziet op een correcte uitvoering van de
      werkzaamheden door het personeel en geeft de dierenarts van het centrum de hiervoor benodigde instructies.

      3 Van permanent toezicht van een dierenarts van het spermaopslagcentrum als bedoeld in Bijlage A, Hoofdstuk I,
      punt 2, onderdeel a, van richtlijn 88/408/EEG of in Bijlage D, Hoofdstuk I, onderdeel I, subonderdeel 2, punt
      b, van richtlijn 92/65/EEG is sprake, indien die dierenarts overeenkomstig de krachtens dit artikel goedgekeurde
      procedures en protocollen erop toeziet, dat de voorschriften van richtlijn 88/407/EEG onderscheidenlijk van
      richtlijn 92/65/EEG in acht worden genomen en dat door betrokkenen de krachtens het derde lid goedgekeurde
      procedures en protocollen correct worden uitgevoerd.

      4 Aan Bijlage A, hoofdstuk I, punt 2, onderdeel b, van richtlijn 88/407/EEG en Bijlage D, Hoofdstuk I, onderdeel 1,
      subonderdeel 2, punt d, van richtlijn 92/65/EEG is voldaan, indien het spermaopslagcentrum zodanig is ingericht dat
      vrije toegang tot het spermaopslagcentrum niet mogelijk is.

      5 De eigenaar of exploitant van een spermaopslagcentrum dan wel diens vertegenwoordiger draagt ervoor zorg dat het
      personeel zich kleedt met schone bedrijfskleding voordat het de opslag- of distributieruimte betreedt.

      6 Aan Bijlage A, Hoofdstuk I, punt 2, onderdeel c, van richtlijn 88/407/EEG en Bijlage D, Hoofdstuk I, onderdeel
      I, subonderdeel 2, punt e, van richtlijn 92/65/EEG is voldaan, indien het spermaopslagcentrum de beschikking heeft
      over:

      a. een voorziening voor de reiniging en ontsmetting van de gebruikte materialen;

      b. een voorziening voor de opslag van kleding alsmede voor de bij de opslag van sperma te gebruiken materialen;

      c. een ruimte voor de opslag en distributie van sperma, die op efficiënte wijze van de overige ruimten binnen het
      opslagcentrum is geïsoleerd.

      7 Het spermaopslagcentrum beschikt ten behoeve van het toezicht, bedoeld in Bijlage A, Hoofdstuk II, punt 2,
      onderdeel a, van richtlijn 88/407/EEG of Bijlage D, Hoofdstuk I, onderdeel I, subonderdeel 2, punt b, van richtlijn
      92/65/EEG, over een door de keuringsdierenarts vanuit één plaats op het spermaopslagcentrum te raadplegen register
      dat dagelijks wordt bijgehouden en dat zodanig is ingericht, dat daaruit te allen tijde de in Bijlage A, Hoofdstuk
      II, punt, onderdeel a, van richtlijn 88/407/EEG onderscheidenlijk de in Bijlage D, Hoofdstuk I, onderdeel II,
      subonderdeel 2, punt 2.1 c), van richtlijn 92/65/EEG genoemde gegevens op eenvoudige wijze kunnen worden afgeleid.
      De gegevens worden bewaard gedurende de aanwezigheid van het sperma op het spermaopslagcentrum en tot drie jaar
      nadat het sperma van het spermaopslagcentrum is afgevoerd.

      8 Ten behoeve van het toezicht, bedoeld in Bijlage A, Hoofdstuk II, punt 2, onderdeel e, onder vi, van richtlijn
      88/407/EEG en in Bijlage D, Hoofdstuk I, onderdeel II, subonderdeel 2, punt 2.2 f), van richtlijn 92/65/EEG, zijn
      op de verpakking van elke afzonderlijke dosis sperma onuitwisbaar de navolgende gegevens vermeld:

      a. de datum waarop het sperma is verkregen;

      b. het ras en het krachtens het [Besluit identificatie en registratie van dieren][ref1] aan de donor toegekende
      registratienummer en

      c. het registratienummer van het spermawincentrum.

      9 Het in een runderspermaopslagcentrum opgeslagen rundersperma voldoet aan Bijlage A, Hoofdstuk I, punt 2, en
      Hoofdstuk II, punt 2, en Bijlage C van richtlijn 88/407/EEG. Het in een spermaopslagcentrum voor geiten, schapen
      of paarden opgeslagen sperma voldoet aan Bijlage D, Hoofdstuk I, onderdeel I, subonderdeel 2 alsmede Hoofdstuk I,
      onderdeel II, subonderdeel 2 en Hoofdstuk III, onderdeel I.


      [ref1]: https://wetten.overheid.nl/BWBR0009019
