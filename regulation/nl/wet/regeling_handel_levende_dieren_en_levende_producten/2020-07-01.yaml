  - number: 9.10e
    text: |-
      1 Ten behoeve van het toezicht, bedoeld in Bijlage D, Hoofdstuk I, onderdeel II, van richtlijn 92/65/EEG, heeft de
      eigenaar of exploitant van een spermacentrum voor schapen of geiten dan wel diens vertegenwoordiger voorzien in het
      opstellen van:

      a. voorschriften inzake:

        - de reiniging en ontsmetting van de apparatuur die bij het verkrijgen en behandelen in contact komt met het sperma
      of met het donordier;
        - het winnen, bewerken en opslaan van sperma;
        - de reiniging en ontsmetting van de in Bijlage D, Hoofdstuk I, onderdeel I, van richtlijn 92/65/EEG, bedoelde
      ruimten en voorzieningen;
        - de toegang tot de in Bijlage D, Hoofdstuk I, onderdeel I, van richtlijn 92/65/EEG, bedoelde werkruimten, en
        - de wijze van kleding van personeel en bezoekers;

      b. een productieprotocol, waarin voor de in Bijlage D, Hoofdstuk I, onderdeel I, van richtlijn 92/65/EEG, bedoelde
      ruimten en voorzieningen, de productieprocessen chronologisch en gedetailleerd beschreven zijn, en

      c. een kwaliteitsbeheersingsplan, waarin ter waarborging van een correcte uitvoering en registratie van de in
      onderdeel b bedoelde productieprocessen, de in acht te nemen werkwijzen chronologisch en gedetailleerd zijn
      vastgelegd.

      2 De eigenaar of de exploitant van een spermacentrum voor schapen of geiten dan wel diens vertegenwoordiger zorgt
      dat het personeel zijn werkzaamheden verricht overeenkomstig de wettelijke bepalingen en daarop gebaseerde interne
      procedures en voorschriften, draagt er zorg voor dat de dierenarts van het spermacentrum toeziet op een correcte
      uitvoering van de werkzaamheden door het personeel en geeft de dierenarts van het spermacentrum de hiervoor
      benodigde instructies.

      3 Van toezicht van een dierenarts van het spermacentrum als bedoeld in Bijlage D, Hoofdstuk I, onderdeel
      I, subonderdeel 1, punt 1.2, van richtlijn 92/65/EEG is sprake, indien die dierenarts overeenkomstig de
      krachtens dit artikel vastgestelde procedures en protocollen erop toeziet dat de voorschriften bedoeld in
      [artikel 9.10, eerste lid, onderdeel a, subonderdeel 3][ref1], in acht worden genomen en dat door betrokkenen de
      krachtens het eerste lid vastgestelde procedures en protocollen correct worden uitgevoerd.

      4 Het spermacentrum voor schapen of geiten beschikt ten behoeve van het toezicht, bedoeld in Bijlage D, Hoofdstuk
      I, onderdeel II, subonderdeel 1, punt 1.2, van richtlijn 92/65/EEG, over een door de keuringsdierenarts vanuit één
      plaats op het spermacentrum te raadplegen register dat dagelijks wordt bijgehouden en dat zodanig is ingericht, dat
      daaruit te allen tijde op eenvoudige wijze met betrekking tot elk dier kan worden afgeleid:

      a. het ras;

      b. de geboortedatum;

      c. het identificatienummer;

      d. de gegevens inzake de uitgevoerde vaccinaties;

      e. de gegevens uit het ziekte/gezondheidsdossier;

      f. de datum van toelating op het spermacentrum;

      g. het beslag of het bedrijf van herkomst;

      h. de verplaatsingen, onder vermelding van de datum van aankomst in of vertrek uit het spermacentrum, en

      i. de gegevens, waaronder de laboratoriumuitslagen, onder vermelding van de datum, betreffende in Bijlage D,
      Hoofdstuk II, onderdeel II, van richtlijn 92/65/EEG voorgeschreven tests.

      5 De in het vierde lid bedoelde gegevens worden 3 jaar bewaard.

      6 Aan Bijlage D, Hoofdstuk I, onderdeel II, subonderdeel 1, punt 1.2, onderdeel h, van richtlijn 92/65/EEG is
      voldaan, indien op de verpakking van iedere dosis sperma onuitwisbaar de navolgende gegevens zijn vermeld:

      a. de datum waarop het sperma is verkregen;

      b. de identiteit van de ram of de bok waarvan het sperma is gewonnen, en

      c. het registratienummer van het spermacentrum.

      7 De eigenaar of exploitant van een spermacentrum voor schapen of geiten dan wel diens vertegenwoordiger beschikt
      over een vanuit één plaats op het spermacentrum te raadplegen register, dat dagelijks wordt bijgehouden en
      dat zodanig is ingericht, dat daaruit op elk moment op eenvoudige wijze met betrekking elke winning kan worden
      afgeleid:

      a. het aan de winning toegekende identificatienummer;

      b. de datum van de winning en behandeling;

      c. de eventuele calamiteiten die zich bij de winning hebben voorgedaan.

      d. het identificatienummer van de ram of de bok waarvan het sperma is gewonnen, en

      e. het aantal doses waarin de winning is verdeeld.

      De gegevens worden bewaard tot drie jaar nadat de laatste dosis van de betrokken winning van het spermacentrum
      is afgevoerd.

      8 De eigenaar of de exploitant van een spermacentrum voor schapen of geiten dan wel diens vertegenwoordiger
      beschikt over een administratie waarmee de keuringsdierenarts op elk moment een overzicht kan worden geboden van
      het sperma dat in het spermacentrum gewonnen dan wel opgeslagen is, en die de tracering van contacten tussen het
      spermacentrum met inseminatoren, dierenartsen, vervoerders, handelaren en gebruikers van het sperma inzichtelijk
      maakt.

      9 De in het zevende lid bedoelde administratie is zodanig ingericht, dat daaruit op elk moment op eenvoudige wijze
      met betrekking tot elke transactie kan worden afgeleid:

      a. de datum van de transactie;

      b. het identificatienummer van het betrokken sperma;

      c. het ontvangen of afgeleverde aantal doses sperma;

      d. naam en adres van de ontvanger of de leverancier;

      e. het spermacentrum waar het sperma gewonnen is, en

      f. indien het buiten Nederland gewonnen sperma betreft, het nummer van het gezondheidscertificaat, bedoeld in
      [artikel 9.5, onderdeel c][ref2], of in [artikel 9.6, derde lid, onderdeel c][ref3], alsmede de datum waarop dit
      sperma binnen Nederland is gebracht.

      10 Voor zover het sperma op het spermacentrum is geïnsemineerd, is de in het zevende lid bedoelde administratie
      is zodanig ingericht, dat daaruit op elk moment op eenvoudige wijze met betrekking tot elke inseminatie kan worden
      afgeleid:

      a. de datum van de inseminatie;

      b. het identificatienummer van het betrokken sperma, en

      c. het identificatienummer van het geïnsemineerde dier.

      11 De in het negende en tiende lid bedoelde gegevens worden bewaard tot drie jaar nadat het betrokken sperma van
      het spermacentrum is afgevoerd respectievelijk op het spermacentrum is geïnsemineerd.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel9.10
      [ref2]: https://wetten.overheid.nl/BWBR0007049#Artikel9.5
      [ref3]: https://wetten.overheid.nl/BWBR0007049#Artikel9.6
