  - number: 3.7a
    text: |-
      1 Indien een partij is verzonden vanuit een lidstaat zonder een door de Europese Commissie op grond van artikel
      5, tweede alinea, van [verordening 1760/2000](32000R1760) erkend gegevensuitwisselingssysteem en bestemd is voor
      Nederland gaan de runderen tot en met de ontvangst door de ontvanger vergezeld van een paspoort.

      2 Indien een partij is verzonden vanuit een lidstaat zonder een door de Europese Commissie op grond van artikel
      5, tweede alinea, van [verordening 1760/2000](32000R1760) erkend gegevensuitwisselingssysteem en bestemd is voor
      een lidstaat gaan de runderen tijdens het vervoer naar de plaats waar zij weer buiten Nederland worden gebracht,
      vergezeld van een paspoort.

      3 De ontvanger plaatst zijn handtekening in het paspoort en zendt het paspoort, in voorkomend geval nadat
      onderzoek, voorgeschreven in verordening (EU) 2017/625 of daarop gebaseerde EU-verordeningen of EU-besluiten
      heeft plaatsgevonden, in overeenkomstig het krachtens het [Besluit identificatie en registratie van dieren][ref1]
      bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0009019
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel3.7a
