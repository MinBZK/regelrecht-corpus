        artikel: 11c.4
        hoofdstuk: 11c
        afdeling: '3'
  - number: 11c.7
    text: |-
      1 Het is verboden blanco identificatiedocumenten te verstrekken aan anderen dan gemachtigde dierenartsen als
      bedoeld in [artikel 11c.3, eerste lid][ref1].

      2 Indien een gemachtigde dierenarts een blanco identificatiedocument verstrekt aan een andere gemachtigde
      dierenarts, houdt de verstrekkende gemachtigde dierenarts een administratie bij met de naam en contactgegevens
      van de ontvangende gemachtigde dierenarts onder vermelding van de unieke alfanumerieke code van het verstrekte
      identificatiedocument.

      3 De administratie, bedoeld in het tweede lid, wordt ten minste drie jaar bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel11c.3
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel11c.7
