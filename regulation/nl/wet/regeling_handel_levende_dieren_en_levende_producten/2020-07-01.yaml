  - number: '8.2'
    text: |-
      Als bewijsstuk, bedoeld in [artikel 2.4, onderdeel a][ref1], wordt met het oog op het anders dan in doorvoer buiten
      Nederland brengen van apen, hoefdieren, bijen, honden, katten, fretten en lagomorfen bestemd voor een lid-staat
      vastgesteld:

      a. het certificaat dat op grond van artikel 5, eerste lid, van [richtlijn 92/65/EEG](31992L0065) is voorgeschreven,
      indien het apen betreft;

      b. het certificaat dat op grond van artikel 6, onderdeel A, eerste lid, onderdeel e, van [richtlijn 92/65/EEG]
      (31992L0065) is voorgeschreven, indien het hoefdieren betreft;

      c. het gezondheidscertificaat dat op grond van artikel 8, onderdeel b, van [richtlijn 92/65/EEG](31992L0065) is
      voorgeschreven, indien het bijen betreft;

      d. het gezondheidscertificaat dat op grond van artikel 9, tweede lid, van [richtlijn 92/65/EEG](31992L0065) is
      voorgeschreven, indien het lagomorfen betreft, of;

      e. het identificatiedocument en het certificaat, bedoeld in artikel 10, tweede lid, van richtlijn 92/65/EEG, indien
      het honden, katten of fretten betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel8.2
