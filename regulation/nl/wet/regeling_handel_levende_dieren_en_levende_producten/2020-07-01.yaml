  - number: '3.2'
    text: |-
      Als bewijsstuk, bedoeld in [artikel 2.4, eerste lid, onderdeel a][ref1], wordt met het oog op het anders dan in
      doorvoer buiten Nederland brengen van runderen, bestemd voor een lid-staat, vastgesteld het gezondheidscertificaat
      dat op grond van artikel 5, eerste lid, van [richtlijn 64/432/EEG](31964L0432) voor de desbetreffende soort
      runderen is voorgeschreven.


