      tuberculinatie niet is vereist;
        - de in artikel 6, tweede lid, onderdeel b, van [richtlijn 64/432/EEG](31964L0432) bedoelde serumagglutinatietest
      niet is vereist, en
        - de in artikel 6, tweede lid, onderdeel c, van [richtlijn 64/432/EEG](31964L0432) bedoelde test niet is vereist en

      e. artikel 6, derde lid, van [richtlijn 64/432/EEG](31964L0432), indien het slachtrunderen betreft;

      f. de voorwaarden uit bijlage VIII, hoofdstuk D, van verordening (EG) nr. 999/2001.

      2 In zoverre in afwijking van het eerste lid, onderdeel d, aanhef, en van artikel 6, eerste lid,
