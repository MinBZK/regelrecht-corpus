      Eicellen als bedoeld in artikel 13, eerste lid, van [richtlijn 92/65/EEG](31992L0065):

      a. gaan vergezeld van het vervoersdocument, dat op grond van artikel 13, eerste lid, van [richtlijn 92/65/EEG]
