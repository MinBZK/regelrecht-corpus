  - number: '9.9'
    text: |-
      1 Indien rundersperma of varkenssperma bestemd is voor Nederland dan wel een lid-staat en ervan wordt verdacht
      te zijn aangetast door of te zijn besmet met ziektekiemen, worden teneinde met zekerheid vast te stellen of het
      verdachte sperma al dan niet is aangetast door of besmet met ziektekiemen, door de minister de nodige maatregelen
      genomen die afzondering van het sperma kunnen inhouden.

      2 In het in het eerste lid bedoelde geval staat de minister, voor zover daartegen uit oogpunt van de diergezondheid
      geen bezwaren bestaan, op verzoek van de afzender of diens gemachtigde, toe, dat het sperma wordt teruggezonden,
      met dien verstande dat voor zover het rundersperma of diepgevroren varkenssperma betreft betreft binnen 30 dagen
      en indien het vers varkenssperma betreft binnen 24 uur na het betreffende besluit dient te blijken dat de bevoegde
      instantie van het land van verzending de terugzending toestaat.

      3 Het sperma dient gedurende de in het tweede lid bedoelde periode op een door de minister te bepalen wijze te
      worden opgeslagen.

      4 Indien de terugzending van het sperma niet binnen de in het tweede lid bedoelde tijdsduur wordt toegestaan,
      wordt, indien de minister hiertoe besluit het sperma vernietigd.
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel9.9
  - number: '9.10'
    text: |-
      1 Een spermacentrum wordt door de minister voor de toepassing van deze regeling erkend indien:

      a. uit een door de keuringsdierenarts ingesteld onderzoek is gebleken dat:

      1° het spermacentrum voldoet aan bijlage D van richtlijn 92/65/EEG en aan de ter uitvoering van deze richtlijn
      krachtens [artikel 15 van het Besluit eisen dierlijk sperma en spermawincentra][ref1] gestelde regels, indien het
      sperma van paardachtigen betreft, of

      2° het spermacentrum voldoet aan bijlage D van richtlijn 92/65/EEG, indien het sperma van schapen en geiten
      betreft, en

      b. de keuringsdierenarts in verband met het door hem uit te oefenen toezicht op de naleving van onderdeel a,
      praktisch in de gelegenheid wordt gesteld de werkzaamheden van de spermacentra te controleren.

      2 Aan een erkend spermacentrum wordt in verband met de erkenning een registratienummer toegekend.


