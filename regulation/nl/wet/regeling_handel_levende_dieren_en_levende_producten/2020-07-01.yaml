  - number: 11c.1
    text: |-
      Onverminderd [artikel 1.1][ref1], wordt in dit hoofdstuk verstaan onder:

        - *blanco identificatiedocument:* identificatiedocument dat nog niet is voorzien van de gegevens, bedoeld in
      artikel 22, eerste en tweede lid, van verordening (EU) nr. 576/2013;
        - *identificatiedocument:* identificatiedocument als bedoeld in artikel 3, onderdeel f, van verordening (EU)
      nr. 576/2013;
        - *transponder:* transponder als bedoeld in artikel 3, onderdeel e, van verordening (EU) nr. 576/2013;
        - *uitgever:* uitgever van blanco identificatiedocumenten;
        - *unieke alfanumerieke code:* unieke alfanumerieke code als bedoeld in artikel 21, derde lid, van verordening
      (EU) nr. 576/2013.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel11c.1
    references:
      - id: ref1
        bwb_id: BWBR0007049
        artikel: '1.1'
        hoofdstuk: '1'
  - number: 11c.2
    text: |-
      Als voorschriften als bedoeld in [artikel 81b van de wet][ref1] worden aangewezen de artikelen 5, vierde lid, 6,
      10, 11, derde lid, 17, eerste lid, 19, eerste lid, 21, 22, eerste tot en met derde lid, 23, tweede lid, 33, tweede
      lid, 34, tweede lid, en 36, eerste lid, van verordening (EU) nr. 576/2013.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel81b
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel11c.2
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: 81b
  - number: 11c.3
    text: |-
      1 De gemachtigde dierenarts, bedoeld in artikel 3, onderdeel g, van verordening (EU) nr. 576/2013, is een
      dierenarts die is geregistreerd overeenkomstig [artikel 4.3, eerste lid, van de Wet dieren][ref1].

      2 Het punt van binnenkomst voor reizigers, bedoeld in artikel 3, onderdeel k, van verordening (EU) nr. 576/2013, is
      een grenscontrolepost of douanekantoor als bedoeld in [artikel 1:3 van de Algemene douaneregeling][ref2].

      3 In afwijking van het tweede lid kunnen geregistreerde militaire, speur- of reddingshonden via een ander punt van
      binnenkomst in Nederland worden gebracht, indien:

      a. de minister hiervoor een vergunning heeft verleend, en

      b. de honden bij een punt van binnenkomst als bedoeld in het vijfde lid zijn onderworpen aan documenten- en
      identiteitscontroles als bedoeld in artikel 34, tweede lid, van verordening (EU) nr. 576/2013.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4.3
      [ref2]: https://wetten.overheid.nl/BWBR0024291#Artikel13
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel11c.3
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '4.3'
      - id: ref2
        bwb_id: BWBR0024291
        artikel: 1:3
  - number: 11c.4
    text: |-
      1 Blanco identificatiedocumenten worden uitsluitend uitgegeven door erkende uitgevers en worden elk voorzien van
      een unieke alfanumerieke code die door de minister aan hen is verstrekt.

      2 Blanco identificatiedocumenten voldoen aan de voorschriften die zijn gesteld bij of krachtens artikel 21 van
      verordening (EU) nr. 576/2013.

      3 Bij de aanvraag tot erkenning verstrekt de uitgever aan de minister:

      a. de naam, het adres en de vestigingsplaats van de uitgever, en

      b. een model van de uit te geven identificatiedocumenten.

      4 De minister erkent een uitgever indien het model van de uit te geven blanco identificatiedocumenten, bedoeld
      in het tweede lid, onderdeel b, voldoet aan de voorschriften die zijn gesteld bij of krachtens artikel 21 van
      verordening (EU) nr. 576/2013.
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel11c.4
  - number: 11c.4a
    text: |-
      1 Erkende uitgevers houden een administratie bij van de naam en contactgegevens van gemachtigde dierenartsen aan
      wie zij blanco identificatiedocumenten uitgeven onder vermelding van de unieke alfanumerieke code van de uitgegeven
      blanco identificatiedocumenten.

      2 De administratie, bedoeld in het eerste lid, wordt ten minste drie jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel11c.4a
  - number: 11c.4b
    text: |-
      1 De minister kan een erkenning als bedoeld in [artikel 11c.4][ref1] schorsen voor een door hem te bepalen termijn
      indien een uitgever niet voldoet aan één of meer voorschriften als bedoeld in de [artikelen 11c.2][ref2], 11c.4,
      [11c.4a][ref3], en [11c.7][ref4].

      2 De uitgever wiens erkenning door de minister is geschorst verschaft de minister onverwijld een overzicht van:

      a. de unieke alfanumerieke codes die door de minister aan de uitgever zijn verstrekt, en nog niet zijn gebruikt
      voor de productie van identificatiedocumenten, en

      b. de blanco identificatiedocumenten die de uitgever reeds heeft geproduceerd of laten produceren, en nog niet
      heeft uitgegeven aan gemachtigde dierenartsen, onder vermelding van de unieke alfanumerieke code van de blanco
      identificatiedocumenten.

      3 De minister kan een erkenning als bedoeld [artikel 11c.4, derde lid][ref5], intrekken indien de uitgever
      tijdens de schorsingstermijn niet voldoet aan de voorschriften, bedoeld in het tweede lid, of na afloop van de
      schorsingstermijn niet heeft aangetoond dat hij voldoet aan de voorschriften, bedoeld in het eerste lid.

      4 De uitgever wiens erkenning door de minister is ingetrokken verstrekt de blanco identificatiedocumenten, bedoeld
      in het tweede lid, onderdeel b, onverwijld aan de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel11c.4
      [ref2]: https://wetten.overheid.nl/BWBR0007049#Artikel11c.2
      [ref3]: https://wetten.overheid.nl/BWBR0007049#Artikel11c.4a
      [ref4]: https://wetten.overheid.nl/BWBR0007049#Artikel11c.7
      [ref5]: https://wetten.overheid.nl/BWBR0007049#Artikel11c.4
