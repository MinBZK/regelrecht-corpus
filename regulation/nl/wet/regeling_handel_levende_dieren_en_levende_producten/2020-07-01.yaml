  - number: '4.6'
    text: |-
      Indien een partij is verzonden vanuit een lidstaat en bestemd is voor Nederland of een lidstaat, gaat zij vergezeld
      van het gezondheidscertificaat dat op grond van artikel 5, eerste lid, van [richtlijn 64/432/EEG](31964L0432) voor
      de desbetreffende soort varkens is voorgeschreven, met dien verstande dat, indien de partij bestemd is voor een
      Lid- Staat, in voorkomend geval, uit het gezondheidscertificaat blijkt dat voldaan wordt aan de met betrekking
      tot de in bijlage E (II) van [richtlijn 64/432/EEG](31964L0432) vermelde ziekten gestelde aanvullende garanties,
      bedoeld in artikel 9, tweede lid, en in artikel 10, tweede lid, van [richtlijn 64/432/EEG](31964L0432).
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel4.6
  - number: '4.7'
    text: |-
      1 Indien een partij is bestemd voor Nederland of voor een Lidstaat komt de partij tot de plaats van bestemming
      respectievelijk tot de plaats waar de partij buiten Nederland wordt gebracht niet in aanraking met andere
      evenhoevige dieren die niet over dezelfde gezondheidsstatus beschikken.

      2 De in het eerste lid bedoelde partij wordt vervoerd in een vervoermiddel dat voldoet aan artikel 4, tweede lid,
      van [richtlijn 64/432/EEG](31964L0432).

      3 Het binnen Nederland brengen van varkens als bedoeld in [artikel 4.6, eerste lid][ref1], kan plaatsvinden via
      een varkensverzamelcentrum.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel4.6
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel4.7
