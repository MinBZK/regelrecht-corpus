  - number: 8.5m
    text: |-
      1 Uit een derde land afkomstige, in Nederland gebrachte en voor Nederland bestemde slurfdieren of evenhoevigen,
      niet zijnde runderen, varkens, schapen of geiten, worden, voor zover zij kennelijk bestemd zijn voor fok-,
      gebruiks- of mestdoeleinden, rechtstreeks naar het bedrijf van bestemming vervoerd en aan het beslag van het
      bedrijf van bestemming toegevoegd.

      2 De in het eerste lid bedoelde dieren mogen gedurende een periode van ten minste 30 dagen, te rekenen vanaf de
      dag waarop de dieren op het bedrijf van bestemming zijn binnengebracht, het bedrijf niet verlaten, behoudens de
      rechtstreekse afvoer naar een in Nederland gelegen slachthuis.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op dieren als bedoeld in het eerste lid, die zijn
      bestemd voor dierentuinen, pretparken, wildparken en jachtgebieden.
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel8.5m
  - number: 8.5n
    text: |-
      Uit een derde land afkomstige, in Nederland gebrachte en voor Nederland bestemde slurfdieren of evenhoevigen, niet
      zijnde runderen, varkens, schapen of geiten, worden, voor zover zij kennelijk bestemd zijn om te worden geslacht,
      rechtstreeks vervoerd naar het slachthuis van bestemming, waar zij binnen vijf werkdagen worden geslacht.
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel8.5n
  - number: '8.6'
    text: |-
      1 Een instelling, instituut of centrum wordt door de minister voor de toepassing van deze regeling erkend indien
      uit een door de keuringsdierenarts ingesteld onderzoek is gebleken dat de instelling, het instituut of het centrum
      voldoet aan bijlage C, punt 1 en 2, van [richtlijn 92/65/EEG](31992L0065).

      2 Een erkenning als bedoeld in het eerste lid wordt door de minister voor bepaalde tijd ingetrokken in het geval,
      bedoeld in bijlage C, punt 6, onder a, van [richtlijn 92/65/EEG](31992L0065).

      3 Een erkenning als bedoeld in het eerste lid wordt door de minister ingetrokken indien na aangifte van verdenking
      op een van de ziekten vermeld in de bijlagen A en B van [richtlijn 92/65/EEG](31992L0065) het laboratoriumonderzoek
      voor de verwekkers van vorenbedoelde ziekten positieve resultaten hebben gegeven.

      4 Een erkenning als bedoeld in het eerste lid wordt, nadat zij door de minister voor bepaalde tijd is ingetrokken,
      opnieuw verleend, indien na aangifte van verdenking op een van de ziekten vermeld in de bijlagen A en B van
      [richtlijn 92/65/EEG](31992L0065) het laboratoriumonderzoek voor de verwekkers van vorenbedoelde ziekten negatieve
      resultaten hebben gegeven.

      5 Een erkenning als bedoeld in het eerste lid wordt, nadat zij door de minister is ingetrokken, opnieuw verleend,
      indien na de uitroeiïng van de besmettingshaarden, opnieuw wordt voldaan aan punt 1, met uitzondering van onderdeel
      f, van bijlage C van [richtlijn 92/65/EEG](31992L0065) wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel8.6
  - number: 8.6a
    text: |-
      1 Dieren worden uitsluitend gebracht binnen of buiten erkende instellingen, instituten of centra als bedoeld in
      [artikel 8.6, eerste lid][ref1], indien zij afkomstig zijn van onderscheidenlijk bestemd zijn voor andere erkende
      instellingen, instituten of centra.

      2 In afwijking van het eerste lid kunnen dieren die niet afkomstig zijn van andere erkende instellingen, instituten
      of centra worden gebracht binnen erkende instellingen, instituten of centra, indien:

      a. de dieren, niet zijnde apen, ten minste 30 dagen in quarantaine worden geplaatst voordat zij aan het bestaande
      dierenbestand worden toegevoegd, of

      b. indien het apen betreft, een vergunning is aangevraagd en verkregen van de minister, en de
      quarantainevoorschriften, bedoeld in bijlage C, punt 3, tweede alinea, van [richtlijn 92/65/EEG](31992L0065), in
      acht worden genomen.

      3 In afwijking van het eerste lid kunnen dieren, niet zijnde apen, worden gebracht buiten erkende instellingen,
      instituten of centra, indien zij:

      a. niet bestemd zijn voor een lidstaat, of

      b. bestemd zijn voor een lidstaat, en

      1°. niet vatbaar zijn voor de ziekten, genoemd in bijlage A of bijlage B, van [richtlijn 92/65/EEG](31992L0065); of

      2°. vergezeld gaan van het certificaat, bedoeld in bijlage E van [richtlijn 92/65/EEG](31992L0065), indien zij
      vatbaar zijn voor de ziekten, genoemd in bijlage A, of, indien de lidstaat van bestemming in aanmerking komt voor
      de garanties, bedoeld in de artikelen 14 en 15 van [richtlijn 92/65/EEG](31992L0065), in bijlage B, van [richtlijn
      92/65/EEG](31992L0065).

      4 In afwijking van het eerste lid kunnen apen worden gebracht buiten erkende instellingen, instituten of centra,
      indien zij niet bestemd zijn voor een lidstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel8.6
