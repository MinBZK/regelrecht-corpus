  - number: '9.12'
    text: |-
      1 Een quarantainevoorziening voor donorrammen en donorbokken als bedoeld in bijlage D, hoofdstuk II, onderdeel
      II, subonderdeel 1 van richtlijn 92/65/2010, wordt door de minister voor de toepassing van deze regeling
      erkend indien uit een door de keuringsdierenarts ingesteld onderzoek is gebleken dat de voorziening voldoet aan
      [artikel 9.13][ref1].

      2 Aan een erkende quarantainevoorziening wordt in verband met de erkenning een registratienummer toegekend.

      3 Bij de aanvraag om erkenning van een quarantainevoorziening worden de volgende gegevens verstrekt:

      a. de naam, het adres en de vestigingsplaats van de quarantainevoorziening;

      b. het aan de quarantainevoorziening krachtens het Besluit identificatie en registratie van dieren uitgegeven uniek
      bedrijfsnummer;

      c. een plattegrond van kadastrale eenheden waarop de quarantainevoorziening is gesitueerd, waarbij is aangegeven:

        - afscheiding ten opzichte van de directe omgeving;
        - afstand en aard van de omliggende bedrijven, en

      d. de naam van de aan de quarantaineruimte verbonden dierenarts.

      4 De minister trekt de verleende erkenning in, indien de keuringsdierenarts heeft geconstateerd dat de van
      toepassing zijnde voorschriften van [artikel 9.13][ref2] niet worden nageleefd, doch niet dan nadat gedurende
      een redelijke termijn gelegenheid is gegeven, de voor het behoud van de erkenning noodzakelijke voorzieningen te
      treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel9.13
      [ref2]: https://wetten.overheid.nl/BWBR0007049#Artikel9.13
