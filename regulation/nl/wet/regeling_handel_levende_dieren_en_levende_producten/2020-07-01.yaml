      1 Sperma van schapen, geiten of eenhoevige dieren als bedoeld in artikel 13, eerste lid, van [richtlijn 92/65/
      EEG](31992L0065) gaat vergezeld van het in artikel 13, eerste lid, van [richtlijn 92/65/EEG](31992L0065) bedoelde
