  - number: '2.17'
    text: |-
      Het bewijsstuk, bedoeld in [artikel 2.16, eerste lid, onderdeel a][ref1], wordt slechts afgegeven, indien op grond
      van een van Rijkswege ingesteld onderzoek, dat onmiddellijk vóór het brengen van de partij buiten Nederland heeft
      plaatsgevonden, is gebleken dat voldaan aan de [artikelen 2.20][ref2] en [2.21][ref3], en dat tenminste wordt
      voldaan aan hetgeen in:

        - de [artikelen 3.3][ref4] en [3.4 van afdeling 2 van hoofdstuk 3][ref5], indien het runderen betreft;
        - de [artikelen 4.3][ref6] en [4.4 van afdeling 2 van hoofdstuk 4][ref7], indien het varkens betreft;
        - de [artikelen 5.3][ref8] en [5.4 van afdeling 2 van hoofdstuk 5][ref9], indien het paardachtigen betreft;
        - de [artikelen 6.3 tot en met 6.5 van afdeling 2, van hoofdstuk 6][ref10], indien het pluimvee betreft;
        - de [artikelen 7.3][ref11] en [7.4 van afdeling 2 van hoofdstuk 7][ref12], indien het schapen en geiten betreft,
      voor slachtdieren is bepaald.


