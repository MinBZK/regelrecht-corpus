    text: |-
      Indien een partij die is verzonden vanuit een lid-staat en bestemd is voor Nederland of een lid-staat, gaat zij
      vergezeld van het gezondheidscertificaat dat op grond van artikel 11, derde lid, derde gedachtenstreepje, van
      [richtlijn 92/65](31992L0065) is voorgeschreven indien het eicellen van schapen, geiten, varkens en paardachtigen
      betreft.
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel11.4
  - number: '11.5'
    text: |-
      1 De partij is verzonden vanuit een derde land of een deel van een derde land, dat is vermeld op:

      a. de lijst die voor eicellen van paardachtigen is vastgesteld in bijlage I bij uitvoeringsverordening (EU)
      2018/659, als de zending voldoet aan de voorwaarden, bedoeld in artikel 5 van uitvoeringsverordening (EU) 2018/659,
      of

      b. de lijst, bedoeld in artikel 17, tweede lid, onderdeel a, van [richtlijn 92/65/EEG](31992L0065), indien het
      eicellen van varkens, schapen of geiten betreft, met dien verstande dat, indien vorenbedoelde lijst nog niet is
      vastgesteld, de partij is verzonden vanuit een derde land of een deel van een derde land van waaruit de lid-staat
      van bestemming de invoer toestaat, indien zij voor een lid-staat is bestemd.

      2 De partij is verzameld, behandeld en opgeslagen door een erkend team dat is vermeld op de lijst, bedoeld in
      artikel 17, derde lid, onderdeel b, van [richtlijn 92/65/EEG](31992L0065).

      3 De partij gaat vergezeld van het gezondheidscertificaat dat op grond van artikel 17, tweede lid, onderdeel b, van
      [richtlijn 92/65/EEG](31992L0065) is voorgeschreven, dan wel, indien vorenbedoeld gezondheidscertificaat nog niet
      is vastgesteld, en:

        - de partij voor Nederland is bestemd, de partij vergezeld gaat van een certificaat dat een verklaring van de
      officiële dierenarts behelst dat de eicellen zijn verkregen, behandeld en opgeslagen op een wijze die tenminste
      gelijkwaardig is aan hetgeen hieromtrent op grond van artikel 11, derde lid, eerste en tweede gedachtenstreepje
      van [richtlijn 92/65/EEG](31992L0065) geldt, dat voldaan is aan artikel 11, derde lid, tweede alinea van [richtlijn
      92/65/EEG](31992L0065) en aan de voorschriften voor het brengen in Nederland van vorenbedoelde eicellen uit derde
      landen op grond van [hoofdstuk 2][ref1] van de onderhavige regeling;
        - de partij voor een lid-staat is bestemd, de partij vergezeld gaat van het certificaat dat door de lid-staat van
      bestemming wordt geëist.

      4 De partij voldoet aan:

      a. de voorwaarden die zijn vastgelegd in het gezondheidscertificaat, bedoeld in het derde lid en in voorkomend
      geval overige krachtens artikel 17, derde lid, artikel 18, eerste lid en artikel 19 van richtlijn 92/65/EEG
      vastgestelde communautaire uitvoeringsmaatregelen, indien het eicellen van paardachtigen betreft, of

      b. de voorwaarden die zijn vastgelegd in het gezondheidscertificaat, bedoeld in het derde lid en in voorkomend
      geval overige krachtens artikel 17, derde lid, artikel 18, eerste lid en artikel 19 van richtlijn 92/65/EEG
      vastgestelde communautaire uitvoeringsmaatregelen, indien het eicellen van schapen of geiten betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Hoofdstuk2
