  - number: '4.4'
    text: |-
      Onverminderd [artikel 4.3][ref1]. is op grond van het onderzoek, bedoeld in [artikel 2.5][ref2], gebleken dat:

      a. indien de varkens zijn aangekocht op een verzamelcentrum:

        - de varkens voldoen aan artikel 11, eerste lid, onderdeel e, van [richtlijn 64/432/EEG](31964L0432);
        - hiervan aantekening is gemaakt op het gezondheidscertificaat, bedoeld in [artikel 4.2][ref3];

      b. indien de varkens zijn aangekocht bij een handelaar:

        - deze handelaar voldoet aan [artikel 4.10][ref4] en uit dien hoofde overeenkomstig [artikel 4.10][ref5] is erkend;
        - de varkens voldoen aan artikel 13, eerste lid, onderdeel a, van [richtlijn 64/432/EEG](31964L0432);
        - hiervan aantekening is gemaakt op het gezondheidscertificaat, bedoeld in [artikel 4.2][ref6];

      c. indien de vervoersafstand meer dan 50 km bedraagt:

        - de varkens worden vervoerd door een vervoerder waaraan een vergunning is verleend als bedoeld in artikel 10 of
      artikel 11 van verordening (EG) nr. 1/2005;
        - hiervan aantekening is gemaakt op het gezondheidscertificaat, bedoeld in [artikel 4.2][ref7];

      d. indien de varkens zijn aangekocht op een bedrijf waarop fok- en gebruiksvarkens zijn binnengebracht afkomstig
      uit derde landen, deze fok- en gebruiksvarkens overeenkomstig [artikel 4.8b, eerste lid][ref8], aan het beslag zijn
      toegevoegd dan wel gedurende een periode van 30 dagen te rekenen vanaf de dag waarop de fok- en gebruiksvarkens op
      het bedrijf zijn binnengebracht overeenkomstig [artikel 4.8b, tweede lid][ref9], afgezonderd worden gehouden van de
      op dat bedrijf aanwezige dieren;

      e.

      f. de varkens niet worden vervoerd in een vervoermiddel, als bedoeld in
      __REF000___________________________________________________________________________________________________________
      _______________________, waarmee kennelijk varkens zijn of zullen worden vervoerd, tenzij dit vervoermiddel voldoet
      aan genoemde regeling;

      g. in voorkomend geval, de varkens voldoen aan de met betrekking tot de in bijlage E (II) van [richtlijn
      64/432/EEG](31964L0432) vermelde ziekten gestelde aanvullende garanties, bedoeld in artikel 9, tweede lid,
      en in artikel 10, tweede lid, van [richtlijn 64/432/EEG](31964L0432) en hiervan aantekening is gemaakt op het
      gezondheidscertificaat, bedoeld in [artikel 4.2][ref11].


