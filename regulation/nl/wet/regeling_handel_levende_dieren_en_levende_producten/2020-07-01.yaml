    text: |-
      Een partij runderen of varkens worden door de ontvanger eerst aan het beslag op zijn bedrijf toegevoegd,
      nadat de dierenarts, verantwoordelijk voor de toevoeging aan dit beslag, heeft geconstateerd dat de dieren de
      gezondheidsstatus van dit beslag niet in gevaar kunnen brengen.
