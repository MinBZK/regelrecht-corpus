  - number: 7.3a
    text: |-
      Onverminderd [artikel 7.3][ref1] is op grond van het onderzoek, bedoeld in [artikel 2.5][ref2], gebleken dat:

      a. indien de schapen of geiten verblijven op een schapen-, respectievelijk geitenverzamelcentrum:

        - de schapen of geiten voldoen aan artikel 8 bis, eerste lid, onderdeel e, van [richtlijn 91/68/EG](31991L0068), en
        - hiervan aantekening is gemaakt in het gezondheidscertificaat, bedoeld in [artikel 7.2][ref3];

      b. indien de schapen of geiten aangekocht zijn bij een handelaar:

        - deze handelaar voldoet aan [artikel 7.9, eerste lid][ref4], en uit dien hoofde is erkend overeenkomstig
      [artikel 7.9, eerste lid][ref5];
        - de schapen of geiten voldoen aan artikel 8 ter, eerste lid, onderdeel a, van [richtlijn 91/68/EEG](31991L0068);
        - voor zover van toepassing, de bedrijfsruimte van de handelaar voldoet aan artikel [7.9, tweede lid][ref6], en uit
      dien hoofde is erkend overeenkomstig [artikel 7.9, tweede lid][ref7], en
        - hiervan aantekening is gemaakt in het gezondheidscertificaat, bedoeld in [artikel 7.2][ref8].


