  - number: '2.16'
    text: |-
      1 De verboden, bedoeld in [artikel 77, eerste lid, van de wet][ref1], en in
      [artikel 2.1, eerste lid, eerste en tweede gedachtestreepje][ref2], voor zover deze betrekking hebben op het anders
      dan in doorvoer buiten Nederland brengen van dieren of producten, bestemd voor een derde land, gelden niet, indien:

      a. een partij runderen, varkens, schapen, geiten, paardachtigen of pluimvee, die rechtstreeks vanuit Nederland naar
      een derde land wordt gebracht, vergezeld gaat van een bewijsstuk dat een verklaring van de minister bevat dat ten
      minste wordt voldaan aan hetgeen voor slachtdieren is bepaald in de artikelen:

      1°. [3.3][ref3] en [3.4][ref4], indien het runderen betreft;

      2°. [4.3][ref5] en [4.4][ref6], indien het varkens betreft;

      3°. [5.3][ref7] en [5.4][ref8], indien het paardachtigen betreft;

      4°. [6.3 tot en met 6.5][ref9], indien het pluimvee betreft;

      5°. [7.3][ref10] en [7.4][ref11], indien het schapen of geiten betreft;

      b. een partij dieren of producten die vanuit Nederland via het grondgebied van een lidstaat naar een derde land
      wordt gebracht vergezeld gaat van:

      1°. het bewijsstuk, bedoeld in [artikel 2.4, eerste lid, onderdeel a][ref12], dat, indien het dieren betreft, ten
      minste bestemd is voor slachtdieren; en

      2°. een bewijsstuk bestaande uit het veterinaire document of certificaat dat aan de veterinaire voorschriften
      van het land van bestemming voldoet, tenzij de NVWA niet over die voorschriften beschikt, in welk geval op het
      bewijsstuk, bedoeld in [artikel 2.4, eerste lid, onderdeel a][ref13], de vermelding ‘Dieren of producten voor
      uitvoer naar (naam van het derde land)’ is opgenomen, waarbij de naam van het derde land van bestemming als het
      gedeelte tussen haakjes is opgenomen;

      c. de bewijsstukken, bedoeld in de onderdelen a en b, volledig zijn ingevuld, gedagtekend en ondertekend, terwijl
      de geldigheidsduur ervan niet is verstreken.

      2 Indien de dieren of producten via het grondgebied van een lid-staat naar een derde land worden gebracht, geldt
      ter zake van het bewijsstuk, bedoeld in [artikel 2.4, eerste lid, onderdeel a][ref14], dat:

        - het in overeenstemming met de regelgeving van de Raad van de Europese Unie of de Commissie van de Europese
      Gemeenschappen is opgesteld;
        - daarop, in voorkomend geval, de gelijkwaardige, bijkomende waarborgen zijn opgenomen, bedoeld in artikel 9 van
      [richtlijn 64/432/EEG](31964L0432), voor zover deze waarborgen betrekking hebben op slachtdieren;
        - het in de Nederlandse taal en in tenminste in één van de talen van de lid-staat waar zich het punt van uitgang
      bevindt, is gesteld;
        - daarop het punt van uitgang als plaats van bestemming is vermeld;
        - daarop als ontvanger is vermeld, met naam en adres, de ontvanger bij het punt van uitgang.


