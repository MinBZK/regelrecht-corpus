  - number: '3.13'
    text: |-
      1 Een partij runderen is afkomstig uit een derde land dat voorkomt op een krachtens artikel 3, eerste lid, van
      [richtlijn 2004/68/EG](32004L0068) vastgestelde lijst.

      2 Het in het eerste lid bedoelde derde land biedt de in artikel 7 van [richtlijn 2004/68/EG](32004L0068) gegeven
      garanties en de partij runderen voldoet, voor zover van toepassing, aan de krachtens artikel 6, eerste lid, van
      [richtlijn 2004/68/EG](32004L0068) vastgestelde veterinairrechtelijke voorschriften, tenzij krachtens artikel 8 van
      [richtlijn 2004/68/EG](32004L0068) specifieke bepalingen zijn vastgesteld, in welk geval die gelden.

      3 Een partij runderen gaat vergezeld van een veterinair certificaat als bedoeld in artikel 11, eerste lid, van
      [richtlijn 2004/68/EG](32004L0068).

      4 Een partij runderen voldoet, voor zover van toepassing, aan de krachtens artikel 13 van [richtlijn 2004/68/EG]
      (32004L0068) vastgestelde uitvoeringsbepalingen.

      5 Onverminderd het derde lid is met betrekking tot de partij voldaan aan bijlage IX, hoofdstuk B, van [verordening
      (EG) nr. 999/2001](32001R0999).
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel3.13
  - number: 3.13c
    text: |-
      1 In Nederland gebrachte en voor Nederland bestemde fok- en gebruiksrunderen worden rechtstreeks naar het bedrijf
      van bestemming vervoerd en aan het beslag op het bedrijf van bestemming toegevoegd nadat de voor dat bedrijf
      verantwoordelijke dierenarts heeft geconstateerd dat deze runderen geen bedreiging vormen voor de gezondheidsstatus
      van dat bedrijf.

      2 Runderen afkomstig uit derde landen mogen, behoudens wanneer de in het eerste lid bedoelde runderen bij aankomst
      op het bedrijf van bestemming terstond ten genoege van de officiële dierenarts op zodanige wijze afgezonderd worden
      gehouden van reeds op dat bedrijf aanwezige dieren zodat ieder contact tussen de betrokken runderen en de overige
      op dat bedrijf aanwezige dieren is uitgesloten, gedurende een periode van 30 dagen, te rekenen vanaf de dag waarop
      de in het eerste lid bedoelde runderen op het bedrijf van bestemming zijn binnengebracht, niet van het bedrijf
      worden afgevoerd, behoudens de rechtstreekse afvoer naar een in Nederland gelegen slachthuis.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op runderen, afkomstig uit derde landen, die zijn
      bestemd voor dierentuinen, pretparken, wildparken en jachtgebieden.

      4 Runderen die binnen Nederland worden gebracht, worden per vervoerseenheid rechtstreeks vervoerd naar en
      afgeleverd op één bedrijf van bestemming.

      5 Het vierde lid is niet van toepassing ingeval runderen rechtstreeks worden vervoerd naar een lidstaat of derde
      land.

      6 In Nederland gebrachte fok- en gebruiksrunderen, bestemd voor een Lidstaat, worden zo snel mogelijk naar de
      Lidstaat van bestemming vervoerd en gaan vergezeld van de documenten, bedoeld in artikel 50, tweede lid, artikel
      56, derde, onderdeel b, en het vijfde lid, en artikel 58 van verordening (EU) 2017/625.
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel3.13c
  - number: '3.14'
    text: |-
      In Nederland gebrachte slachtrunderen, bestemd voor Nederland, worden:

        - indien het slachtrunderen betreft die afkomstig zijn uit een lid-staat, rechtstreeks vervoerd naar en
      onmiddellijk geslacht in een slachthuis dan wel
        - indien het slachtrunderen betreft die afkomstig zijn uit een lid-staat, rechtstreeks vervoerd naar een erkend
      runderverzamelcentrum en vervolgens rechtstreeks vervoerd naar een slachthuis.
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel3.14
  - number: '3.15'
    text: |-
      1 Een handelaar wordt door de minister slechts erkend indien: -voldaan wordt aan artikel 13, eerste lid, onderdelen
      a, en b, van [richtlijn 64/432/EEG](31964L0432) en voor zover van toepassing aan artikel 13, eerste lid, onderdeel
      c van [richtlijn 64/432/EEG](31964L0432); -voor zover van toepassing, zijn bedrijfsruimte voldoet aan het bepaalde
      in het tweede lid.

      2 Elke bedrijfsruimte die door een handelaar beroepshalve wordt gebruikt, staat onder
      toezicht van de ambtenaren en wordt door de minister slechts erkend en geregistreerd in een
      register indien voldaan wordt aan de in de [artikelen 21, eerste lid][ref1], [23][ref2] en
      __REF002___________________________________________________________________________________________________________
      ________________ met betrekking tot voor verzamelplaatsen voor runderen gestelde eisen, met dien verstande dat
      in afwijking van [onderdeel 2 van bijlage 1][ref4] bij deze regeling de bedrijfsruimte deel kan uitmaken van een
      bedrijf waar runderen en pluimvee zijn gehuisvest, doch waarbij de voor handelsdoeleinden bestemde beslagen in een
      epidemiologische eenheid gescheiden worden gehouden van de door de handelaar op zijn bedrijf gehouden niet voor
      handelsdoeleinden bestemde beslagen, zodanig dat geen enkel contact tussen deze beslagen mogelijk is.


