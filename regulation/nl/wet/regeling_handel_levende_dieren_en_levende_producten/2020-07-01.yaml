      1 Een runderembryoteam of een runderembryoproduktieteam wordt door de minister voor de toepassing van deze regeling
      erkend indien:

      a. uit een door de keuringsdierenarts ingesteld onderzoek is gebleken dat het runderembryoteam of het
      runderembryoproduktieteam voldoet aan het voor een dergelijk team bepaalde in bijlage A, hoofdstuk I, van
      [richtlijn 89/556/EEG](31989L0556), en aan de overige relevante bepalingen van [richtlijn 89/556/EEG](31989L0556);

      b. de keuringsdierenarts in verband met het door hem uit te oefenen toezicht op de naleving van onderdeel a,
      praktisch in de gelegenheid wordt gesteld de werkzaamheden van de teams te controleren;

      2 De teamdierenarts draagt er zorg voor dat elke belangrijke wijziging in de organisatie van de teams of in de
      laboratoria en de apparatuur waarover zij beschikken, ter kennis van de keuringsdierenarts wordt gebracht.

      3 Een erkenning als bedoeld in het eerste lid, wordt door de minister ingetrokken indien:

      a. de teamdierenarts wordt vervangen;

      b. zich in de organisatie van het embryoteam of embryoproduktieteam of in de laboratoria en de apparatuur waarover
      het beschikt, belangrijke wijzigingen voordoen, of

      c. blijkt dat niet meer wordt voldaan aan het eerste lid.

      4 Aan een erkend runderembryoteam of runderembryoproduktieteam wordt in verband met de erkenning een
      registratienummer toegekend.
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel10.9
  - number: '10.10'
    text: |-
      1 Een lokaal voor de opslag van runderembryo's, bedoeld in bijlage A, hoofdstuk II, van [richtlijn 89/556/EEG]
      (31989L0556), wordt door de minister voor de toepassing van deze regeling erkend, indien:

      a. uit een door de keuringsdierenarts ingesteld onderzoek is gebleken dat:

      1º. het lokaal voldoet aan de relevante bepalingen van bijlage A van [richtlijn 89/556/EEG](31989L0556), en

      2º. een sluitende administratie overeenkomstig [richtlijn 89/556/EEG](31989L0556) wordt gevoerd;

      b. de keuringsdierenarts in verband met het door hem uit te oefenen toezicht op de naleving van onderdeel a,
      toegang tot het lokaal, alsmede tot de gevoerde administratie heeft.

      2 Een erkenning als bedoeld in het eerste lid, wordt door de minister ingetrokken indien niet meer wordt voldaan
      aan het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel10.10
  - number: 10.10a
    text: |-
      1 De opslagruimte, bedoeld in bijlage D, Hoofdstuk I, onderdeel III, subonderdeel 1, punt 1.9, van richtlijn 92/65/
      EEG, mag voor de opslag van sperma worden gebruikt mits dat sperma:

      a. voldoet aan de voorschriften van de richtlijn 92/65/EEG voor schapen en geiten dan wel paardachtigen, of van
      richtlijn 90/429/EEG van de Raad van 26 juni 1990 tot vaststelling van de veterinairrechtelijke voorschriften van
      toepassing op het intracommunautaire handelsverkeer in sperma van varkens en de invoer daarvan voor varkens;

      b. voor eigen gebruik door het embryoteam of embryoproductieteam wordt opgeslagen in afzonderlijke recipiënten in
      de ruimte voor de opslag van goedgekeurde embryo’s.

      2 Als van de mogelijkheid bedoeld in het eerste lid gebruik wordt gemaakt, moet de keuringsdierenarts hiervan in
      kennis worden gesteld.
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel10.10a
  - number: '10.11'
    text: |-
      1 Een embryoteam of embryoproductieteam wordt door de minister voor de toepassing van deze regeling erkend, indien:

      a. uit een door de keuringsdierenarts ingesteld onderzoek is gebleken dat het team voldoet aan de eisen die zijn
      opgenomen in Bijlage D, hoofdstuk I, onderdeel III, van richtlijn 92/65/EEG,

      b. de keuringsdierenarts in verband met het door hem uit te oefenen toezicht op de naleving door de teams van
      bijlage D, hoofdstuk III, van [richtlijn 92/65/EEG](31992L0065), praktisch in de gelegenheid wordt gesteld de
      werkzaamheden van het team te controleren.

      2 De teamdierenarts draagt er zorg voor dat elke belangrijke wijziging in de organisatie van de teams of in de
      laboratoria en de apparatuur waarover zij beschikken, ter kennis van de keuringsdierenarts wordt gebracht.

      3 Een erkenning als bedoeld in het eerste lid, wordt door de minister ingetrokken indien:

      a. de teamdierenarts wordt vervangen;

      b. zich in de organisatie van het embryoteam of embryoproductieteam of in de laboratoria en apparatuur waarover het
      beschikt, belangrijke wijzigingen voordoen, of

      c. blijkt dat niet meer wordt voldaan aan het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel10.11
  - number: '10.12'
    text: |-
      De teamdierenarts van een embryoteam of embryoproductieteam stelt als sprake is van winning en bewerking van
      eicellen, eierstokken en andere weefsels voor gebruik bij in-vitrofertilisatie of in-vitrokweek voor de productie
      van embryo's, de minister in kennis van het bedrijf of de bedrijven van oorsprong van de donordieren.
    url: https://wetten.overheid.nl/BWBR0007049/2020-07-01#Artikel10.12
