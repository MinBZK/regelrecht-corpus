  - number: '2.43'
    text: |-
      Het verbod, bedoeld in [artikel 2.1, tweede lid, derde gedachtenstreepje][ref1], geldt, niet ter zake van het
      brengen in Nederland van producten die via Nederland voor het eerst in de gebieden waarop het Verdrag betreffende
      de Europese Unie van toepassing is worden gebracht en zijn verzonden vanuit een derde land of een deel van een
      derde land, mits wordt voldaan aan verordening (EU) 2017/625 en de daarop gebaseerde gedelegeerde handelingen en
      uitvoeringshandelingen van de Europese Commissie en:

      voor zover de producten bestemd zijn voor Nederland of een lid-staat:

        - [afdeling 4 van hoofdstuk 6][ref2], indien het broedeieren betreft;
        - [afdeling 4 van hoofdstuk 9][ref3], indien het sperma betreft;
        - [afdeling 4 van hoofdstuk 10][ref4], indien het embryo's betreft;
        - [afdeling 4 van hoofdstuk 11][ref5], indien het eicellen betreft;


