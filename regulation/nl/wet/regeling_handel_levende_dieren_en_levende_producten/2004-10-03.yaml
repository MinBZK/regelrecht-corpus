  - number: '2.27'
    text: |-
      De dieren zijn geïdentificeerd en geregistreerd overeenkomstig artikel 3, eerste lid, onderdeel c, van [richtlijn
      90/425/EEG](31990L0425) en, voor zover van toepassing, [richtlijn 92/102/EEG](31992L0102) en [verordening
      1760/2000/EG](32000R1760).
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel2.27
  - number: '2.28'
    text: |-
      1 Indien de partij bestemd is voor Nederland dan wel een lid-staat, is de handelaar ingeschreven in het in
      [artikel 2.62, eerste lid][ref1], bedoelde register, terwijl die inschrijving niet is getroffen door een beslissing
      als bedoeld in [artikel 2.62, derde lid][ref2].

      2 Het eerste lid geldt tevens voor de handelaar die in Nederland bij het punt van uitgang bij de doorvoer van de
      partij naar een derde land betrokken is.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.62
      [ref2]: https://wetten.overheid.nl/BWBR0007049#Artikel2.62
