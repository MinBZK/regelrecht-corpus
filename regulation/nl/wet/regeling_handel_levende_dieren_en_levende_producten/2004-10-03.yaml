  - number: '2.52'
    text: |-
      1 De verboden, bedoeld in artikel 77, eerste lid, van de wet, en in artikel 2.1, eerste lid, eerste en tweede
      gedachtenstreepje, voor zover deze betrekking hebben op het anders dan in doorvoer buiten Nederland brengen van
      dieren of producten, bestemd voor een staat, niet zijnde een lid-staat, die partij is bij het EER-Verdrag, gelden
      niet indien:

      a. de dieren en producten vergezeld gaan van het bewijsstuk genoemd in:

        - artikel 3.2 van afdeling 2 van hoofdstuk 3, indien het runderen betreft;
        - artikel 4.2 van afdeling 2 van hoofdstuk 4, indien het varkens betreft;
        - artikel 5.2 van afdeling 2 van hoofdstuk 5, indien het eenhoevige dieren betreft;
        - artikel 6.2 van afdeling 2 van hoofdstuk 6, indien het pluimvee en broedeieren betreft;
        - artikel 7.2 van afdeling 2 van hoofdstuk 7, indien het schapen of geiten betreft;
        - artikel 9.2, onderdeel a of b, van afdeling 2 van hoofdstuk 9, indien het rundersperma, respectievelijk
      varkenssperma betreft;
        - artikel 10.2, onderdeel a, van afdeling 2 van hoofdstuk 10, indien het runderembryo's betreft;

      b. het bewijsstuk, bedoeld in onderdeel a, is opgesteld en afgegeven in overeenstemming met het EER-Verdrag,
      volledig is ingevuld, gedagtekend en ondertekend, terwijl de geldigheidsduur ervan niet is verstreken.

      2 De in het eerste lid bedoelde bewijsstukken worden afgegeven door de minister.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel2.52
  - number: '2.53'
    text: |-
      Het bewijsstuk, bedoeld in artikel 2.52, wordt slechts afgegeven indien op grond van een van Rijkswege ingesteld
      onderzoek is gebleken dat voldaan wordt aan, voor zover van toepassing, de artikelen 2.54 en 2.55 en aan:

      a. de artikelen 3.3 en 3.4 van afdeling 2 van hoofdstuk 3, indien het runderen betreft;

      b. de artikelen 4.3 en 4.4 van afdeling 2 van hoofdstuk 4, indien het varkens betreft;

      c. de artikelen 5.3 en 5.4 van afdeling 2 van hoofdstuk 5, indien het eenhoevige dieren betreft;

      d. voor zover van toepassing de artikelen 6.3, 6.4 of 6.5 van afdeling 2 van hoofdstuk 6, indien het pluimvee of
      broedeieren betreft;

      e. de artikelen 7.3 en 7.4 van afdeling 2 van hoofdstuk 7, indien het schapen of geiten betreft;

      f. de artikelen 9.3, onderdelen a of b en 9.4, onderdeel a, van afdeling 2 van hoofdstuk 9, indien het
      rundersperma, respectievelijk varkenssperma betreft;

      g. artikel 10.3 van afdeling 2 van hoofdstuk 10, indien het runderembryo's betreft.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel2.53
  - number: '2.54'
    text: |-
      Noch op grond van regelgeving van de Toezichthoudende Autoriteit van de EVA, noch op grond van het EER-Verdrag
      geldt een verbod om de dieren of producten vanuit Nederland in een staat, niet zijnde een lid-staat, die partij is
      bij het EER-Verdrag te brengen.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel2.54
  - number: '2.55'
    text: |-
      Indien de partij op grond van het onderzoek, bedoeld in [artikel 2.53][ref1], geschikt is bevonden om anders dan
      in doorvoer buiten Nederland te worden gebracht, wordt zij onmiddellijk na het onderzoek, langs de kortste weg naar
      het transportmiddel vervoerd, waarmee zij buiten Nederland zal worden gebracht en wordt zij zo spoedig mogelijk,
      rechtstreeks, buiten Nederland gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.53
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel2.55
