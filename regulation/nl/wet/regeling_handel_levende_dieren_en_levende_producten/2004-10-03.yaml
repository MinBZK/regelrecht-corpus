        afdeling: '2'
  - number: '9.3'
    text: |-
      Op grond van het onderzoek, bedoeld in [artikel 2.5][ref1], is gebleken dat voldaan wordt aan:

      a. artikel 3, onderdelen b en c, van [richtlijn 88/407/EEG](31988L0407), indien het rundersperma betreft, met
      inachtneming van artikel 2, tweede lid, van [richtlijn nr. 2003/43/EG](32003L0043);

      b. artikel 3, onderdelen b en c, van [richtlijn 90/429/EEG](31990L0429), indien het varkenssperma betreft, of

      c. artikel 11, tweede lid, tweede en derde gedachtenstreepje, en derde lid, tweede alinea, van [richtlijn 92/65/
      EEG](31992L0065), indien het sperma van schapen, geiten of eenhoevige dieren betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.5
