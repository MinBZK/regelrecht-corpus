  - number: '9.11'
    text: |-
      1 Een instelling, instituut of centrum wordt door de minister voor de toepassing van deze regeling erkend indien
      uit een door de keuringsdierenarts ingesteld onderzoek is gebleken dat de instelling, het instituut of het
      centrum voldoet aan bijlage C, punt 1 en 2, en aan artikel 13, tweede lid, onderdeel a van [richtlijn 92/65/EEG]
      (31992L0065).

      2 Een erkenning als bedoeld in het eerste lid wordt door de minister voor bepaalde tijd ingetrokken in het geval,
      bedoeld in bijlage C, punt 3, onder a, van [richtlijn 92/65/EEG](31992L0065).

      3 Een erkenning als bedoeld in het eerste lid wordt door de minister ingetrokken, indien na aangifte van verdenking
      op één van de ziekten vermeld in de bijlagen A en B van [richtlijn 92/65/EEG](31992L0065) het laboratoriumonderzoek
      voor de verwekkers van vorenbedoelde ziekten positieve resultaten hebben gegeven.

      4 Een erkenning als bedoeld in het eerste lid wordt, nadat zij door de minister voor bepaalde tijd is ingetrokken,
      opnieuw verleend, indien na aangifte van verdenking op een van de ziekten vermeld in de bijlagen A en B van
      [richtlijn 92/65/EEG](31992L0065) het laboratoriumonderzoek voor de verwekkers van vorenbedoelde ziekten negatieve
      resultaten hebben gegeven.

      5 Een erkenning als bedoeld in het eerste lid wordt, nadat zij door de minister is ingetrokken, opnieuw verleend,
      indien na de uitroeiing van de besmettingshaarden, opnieuw wordt voldaan aan punt 1, met uitzondering van onderdeel
      f, van bijlage C van [richtlijn 92/65/EEG](31992L0065).
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel9.11
  - number: '10.1'
    text: |-
      Onverminderd artikel 1.1. wordt in dit hoofdstuk verstaan onder:




              *richtlijn 89/556/EEG:*


              richtlijn van de Raad van de Europese Gemeenschappen van 25 september 1989 tot vaststelling van
      veterinairrechtelijke voorschriften voor het intracommunautaire handelsverkeer in embryo's van als huisdier
      gehouden runderen en de invoer daarvan uit derde landen (PbEG L 302);




              *runderembryo:*


              eerste ontwikkelingsstadium van een als huisdier gehouden rund, dat geschikt is voor transplantatie naar
      een ontvangerdier, dat niet is verkregen door transfer van celkernen en dat, voor-zover afkomstig uit lid-staten na
      31 december 1990 is verzameld, behandeld en opgeslagen;




              *embryo van varkens, schapen, geiten of eenhoevige dieren:*


              eerste ontwikkelingsstadium van als huisdier gehouden varkens, schapen, geiten of eenhoevige dieren, dat
      geschikt is voor transplantatie naar een ontvangerdier en dat niet is verkregen door transfer van celkernen;




              *teamdierenarts:*


              dierenarts die overeenkomstig bijlage A van [richtlijn 89/556/EEG](31989L0556) verantwoordelijk is voor het
      toezicht op een runderembryoteam;




              *runderembryoteam:*


              overeenkomstig artikel 10.9 erkende groep technici of organisatievorm onder toezicht van een
      teamdierenarts, bevoegd om runderembryo's te verzamelen, te behandelen of op te slaan;




              *runderembryo-produktieteam:*


              runderembryoteam, erkend overeenkomstig artikel 10.9 voor de bevruchting in vitro;




              *embryoteam:*


              overeenkomstig artikel 10.11 erkende groep technici of organisatievorm, bevoegd om embryo's van schapen,
      geiten, varkens of eenhoevige dieren te verzamelen, te behandelen of op te slaan;




              *instelling, instituut of centrum:*


              instelling, instituut of centrum als bedoeld in artikel 2, eerste lid, onderdeel c, van [richtlijn 92/65/
      EEG](31992L0065).
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel10.1
  - number: '10.2'
    text: |-
      Als bewijsstuk, bedoeld in artikel 2.4, onderdeel a, wordt met het oog op het anders dan in doorvoer buiten
      Nederland brengen van een partij embryo's, bestemd voor een lid-staat, vastgesteld:

      a. het gezondheidscertificaat dat op grond van artikel 6 van [richtlijn 89/556/EEG](31989L0556) is voorgeschreven,
      indien het runderembryo's betreft, of

      b. het gezondheidscertificaat dat op grond van artikel 11, derde lid, derde gedachtenstreepje, van [richtlijn
      92/65/EEG](31992L0065) is voorgeschreven indien het embryo's van schapen, geiten, varkens en eenhoevige dieren
      betreft.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel10.2
  - number: '10.3'
    text: |-
      Op grond van het onderzoek, bedoeld in [artikel 2.5][ref1], is gebleken dat, indien het een partij runderembryo's
      betreft:

      a. de bevruchting door kunstmatige inseminatie of in vitro is geschied, met sperma van een donorstier uit een
      spermacentrum dat door de minister, overeenkomstig [artikel 9.10, eerste lid, onderdeel a, subonderdeel 1][ref2],
      is erkend voor de winning, behandeling en opslag van rundersperma of met overeenkomstig [hoofdstuk 9][ref3],
      ingevoerd rundersperma;

      b. in geval van bevruchting in vitro, deze bevruchting is geschied door een runderembryoproduktieteam;

      c. de runderembryo's zijn verzameld bij runderen die voldoen aan bijlage B van [richtlijn 89/556/EEG](31989L0556);

      d. de runderembryo's door een runderembryoteam zijn verzameld, behandeld, opgeslagen en vervoerd overeenkomstig
      bijlage A, hoofdstuk II, van [richtlijn 89/556/EEG](31989L0556), met dien verstande dat de opslag heeft
      plaatsgevonden in overeenkomstig [artikel 10.10][ref4] erkende opslaglokalen en

      e. door de keuringsdierenarts een verklaring is ontvangen van de teamdierenarts dat het runderembryoteam
      overeenkomstig het bepaalde in onderdeel d heeft gehandeld.


