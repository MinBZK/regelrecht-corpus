  - number: '3.4'
    text: |-
      Onverminderd [artikel 3.3][ref1], is op grond van het onderzoek, bedoeld in [artikel 2.5][ref2], gebleken dat:

      a. indien de runderen verblijven op een verzamelcentrum:

        - dit centrum voldoet aan de artikelen 9c tot en met 9g van de Regeling betreffende het bijeenbrengen van dieren
      2000 en erkend is overeenkomstig artikel 9b van voornoemde regeling;
        - de runderen voldoen aan artikel 11, eerste lid, onderdeel e, van [richtlijn 64/432/EEG](31964L0432);
        - hiervan aantekening is gemaakt op het gezondheidscertificaat, bedoeld in [artikel 3.2][ref3];

      b. indien de runderen zijn aangekocht bij een handelaar:

        - deze handelaar voldoet aan [artikel 3.15, eerste lid][ref4], en uit dien hoofde is erkend overeenkomstig
      [artikel 3.15, eerste lid][ref5];
        - de runderen voldoen aan artikel 13, eerste lid, onderdeel a, van [richtlijn 64/432/EEG](31964L0432);
        - voor zover van toepassing, de bedrijfsruimte van de handelaar voldoet aan de [artikelen 3.15, tweede lid][ref6],
      en [3.17, tweede lid][ref7], en uit dien hoofde is erkend overeenkomstig [artikel 3.15 tweede lid][ref8],; –
      hiervan aantekening is gemaakt op het gezondheidscertificaat, bedoeld in [artikel 3.2][ref9].;

      c. indien de vervoersafstand meer dan 50 km bedraagt:

        - de runderen worden vervoerd door een op grond van artikel 8 van het Besluit dierenvervoer erkende vervoerder;
        - hiervan aantekening is gemaakt op het gezondheidscertificaat, bedoeld in [artikel 3.2][ref10].

      d. indien de runderen zijn aangekocht op een bedrijf waarop fok- en gebruiksrunderen zijn binnengebracht
      afkomstig uit derde landen, deze fok- en gebruiksrunderen overeenkomstig [artikel 3.13c, eerste lid][ref11], aan
      het beslag zijn toegevoegd dan wel gedurende een periode van 30 dagen te rekenen vanaf de dag waarop de fok- en
      gebruiksrunderen op het bedrijf zijn binnengebracht overeenkomstig [artikel 3.13, tweede lid][ref12], afgezonderd
      worden gehouden van de op dat bedrijf aanwezige dieren;

      e. in voorkomend geval, de runderen voldoen aan de met betrekking tot de in bijlage E (II) van [richtlijn
      64/432/EEG](31964L0432) vermelde ziekten gestelde aanvullende garanties, bedoeld in artikel 9, tweede lid,
      en in artikel 10, tweede lid, van [richtlijn 64/432/EEG](31964L0432) en hiervan aantekening is gemaakt op het
      gezondheidscertificaat, bedoeld in [artikel 3.2][ref13].

      f. elk rund overeenkomstig het bepaalde bij of krachtens de Verordening zelfcontrole op het verbod gebruik van
      bepaalde stoffen van het Productschap Vee en Vlees is aangeboden.


