        artikel: '2.5'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: '2.16'
    text: |-
      1 De verboden, bedoeld in artikel 77, eerste lid, van de wet, en in
      [artikel 2.1, eerste lid, eerste en tweede gedachtenstreepje][ref1], voor zover deze betrekking hebben op het
      anders dan in doorvoer buiten Nederland brengen van dieren of producten, bestemd voor een derde land, gelden niet,
      indien:

      a. - runderen, varkens, schapen, geiten en eenhoevige dieren vergezeld gaan van een bewijsstuk dat een verklaring
      van de minister bevat, dat tenminste wordt voldaan aan hetgeen in: 1. de [artikelen 3.3][ref2] en [3.4][ref3] van
      [afdeling 2][ref4] van [hoofdstuk 3][ref5], indien het runderen betreft; 2. de [artikelen 4.3][ref6] en [4.4][ref7]
      van [afdeling 2][ref8] van [hoofdstuk 4][ref9], indien het varkens betreft; 3. de [artikelen 5.3][ref10] en
      [5.4][ref11] van [afdeling 2][ref12] van [hoofdstuk 5][ref13], indien het eenhoevige dieren betreft; 4. de
      [artikelen 7.3][ref14] en [7.4][ref15] van [afdeling 2][ref16] van [hoofdstuk 7][ref17], indien het schapen of
      geiten betreft, voor slachtdieren is bepaald, in het geval dat de runderen, de varkens, de eenhoevige dieren, het
      pluimvee, respectievelijk de schapen en geiten, rechtstreeks vanuit Nederland naar een derde land worden gebracht;
        - dieren of producten vergezeld gaan van het bewijsstuk, bedoeld in [artikel 2.4, onderdeel a][ref18], dat,
      indien het dieren betreft, tenminste bestemd is voor slachtdieren, alsmede van een bewijsstuk, bestaande uit
      het veterinaire document of certificaat, dat aan de veterinaire voorschriften van het derde land van bestemming
      voldoet, tenzij de VWA niet over die voorschriften beschikt, in welk geval op het bewijsstuk, bedoeld in
      [artikel 2.4, onderdeel a][ref19], de vermelding ‘Dieren of producten voor uitvoer naar (naam van het derde land)’
      is opgenomen, waarbij de naam van het derde land van bestemming als het gedeelte tussen haakjes is ingevuld),
      indien de dieren of producten via het grondgebied van een lid-staat naar een derde land worden gebracht;

      b. de bewijsstukken, bedoeld in onderdeel a, volledig zijn ingevuld, gedagtekend en ondertekend, terwijl de
      geldigheidsduur ervan niet is verstreken.

      2 Indien de dieren of producten via het grondgebied van een lid-staat naar een derde land worden gebracht, geldt
      ter zake van het bewijsstuk, bedoeld in [artikel 2.4, onderdeel a][ref20], dat:

        - het in overeenstemming met de regelgeving van de Raad van de Europese Unie of de Commissie van de Europese
      Gemeenschappen is opgesteld;
        - daarop, in voorkomend geval, de gelijkwaardige, bijkomende waarborgen zijn opgenomen, bedoeld in artikel 3,
      eerste lid, onderdeel e, subonderdeel iv, van [richtlijn 90/425/EEG](31990L0425), voor zover deze waarborgen
      betrekking hebben op slachtdieren;
        - het in de Nederlandse taal en in tenminste in één van de talen van de lid-staat waar zich het punt van uitgang
      bevindt, is gesteld;
        - daarop het punt van uitgang als plaats van bestemming is vermeld;
        - daarop als ontvanger is vermeld, met naam en adres, de ontvanger bij het punt van uitgang, als bedoeld in artikel
      4, tweede gedachtenstreepje, van beschikking 93/444/EEG.


