  - number: 8.5d
    text: |-
      Indien tijdens de in [artikel 8.5b, derde lid][ref1], bedoelde quarantaineperiode wordt vermoed dat een of meer
      vogels met aviaire influenza of Newcastle disease besmet zijn, worden de vogels in de quarantainevoorziening
      respectievelijk de quarantaine-eenheid ten behoeve van virologisch onderzoek bemonsterd overeenkomstig bijlage C,
      punt 2, van beschikking 2000/666/EG en worden deze monsters onderzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel8.5b
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel8.5d
