  - number: '2.44'
    text: |-
      1 Elke partij wordt aangevoerd via een inspectiepost.

      2 De melding van de aanvoer van een partij vindt plaats aan de VWA overeenkomstig artikel 2, eerste tot en met
      derde lid, van [verordening 136/2004/EG](32004R0136).

      3 Bij de aankomst op de inspectiepost wordt de keuringsdierenarts overgelegd:

      a. het originele certificaat, bedoeld in [afdeling 4][ref1] van de [hoofdstukken 6][ref2], [9][ref3], [10][ref4]
      en [11][ref5], onderscheidenlijk het originele document, bedoeld in [artikel 2.43, onderdeel b][ref6];

      b. indien het producten van raszuivere dieren of hybride varkens betreft, de zoötechnische documenten die
      bij of krachtens het [Fokkerijbesluit][ref7] zijn voorgeschreven voor het brengen in Nederland van producten
      van raszuivere dieren en hybride varkens die via Nederland voor het eerst in de gebieden waarop het [Verdrag
      betreffende de Europese Unie](onbekend) van toepassing is worden gebracht.

      4 Ten aanzien van het in het derde lid bedoelde originele certificaat of document alsmede de aldaar bedoelde
      zoötechnische documenten geldt dat:

      a. de geldigheidsduur ervan niet is verstreken;

      b. zij, voor zover van toepassing, in overeenstemming met de voor het desbetreffende produkt geldende regelgeving
      van de Raad van de Europese Unie of de Commissie van de Europese Gemeenschappen zijn opgesteld en afgegeven,
      volledig ingevuld, gedagtekend en ondertekend.

      5 De partij wordt bij aankomst op de inspectiepost ter onderzoek aangeboden aan de keuringsdierenarts.

      6 De keuringsdierenarts onderwerpt de voor Nederland of een lidstaat bestemde partij in de inspectiepost aan een
      documentencontrole, een overeenstemmingscontrole en een materiële controle overeenkomstig artikel 4, derde en
      vierde lid, van [richtlijn 97/78/EG](31997L0078). In de gevallen bedoeld in artikel 10, eerste en derde lid, van
      [richtlijn 97/78/EG](31997L0078), is de keuringsdierenarts bevoegd om niet elke partij aan een materiële controle
      te onderwerpen.

      7 De controles, bedoeld in het zesde lid, worden niet verricht indien de in dat lid bedoelde partij via een haven
      of luchthaven op Nederlands grondgebied wordt gebracht en vanuit die haven of luchthaven over zee of door de
      lucht naar de haven of luchthaven van bestemming wordt vervoerd, mits de haven of luchthaven van bestemming over
      een inspectiepost of, indien het een haven of luchthaven in een lidstaat betreft, over een grensinspectiepost als
      bedoeld in artikel 2, tweede lid, onderdeel g, van [richtlijn 97/78/EG](31997L0078) beschikt. Indien de partij in
      de eerstgenoemde haven of luchthaven wordt gelost of wordt opgeslagen en daarbij de krachtens artikel 9, eerste
      lid, onderdeel b, onder i, van [richtlijn 97/78/EG](31997L0078) vastgestelde minimale periode wordt overschreden,
      wordt de partij in de inspectiepost onderworpen aan een documentencontrole. Zolang de in de vorige zin bedoelde
      minimale periode niet is vastgesteld, bedraagt deze periode 7 dagen indien de partij in een haven wordt gelost of
      opgeslagen, of 24 uur, indien de partij in een luchthaven wordt gelost op opgeslagen.

      8 De keuringsdierenarts onderwerpt een partij als bedoeld in [artikel 2.43, tweede lid][ref8], in de inspectiepost
      aan een documentencontrole en een overeenstemmingscontrole overeenkomstig artikel 4, derde en vierde lid, van
      [richtlijn 97/78/EG](31997L0078).

      9 De keuringsdierenarts onderwerpt de voor een derde land bestemde partij in de inspectiepost aan een
      documentencontrole en een overeenstemmingscontrole overeenkomstig artikel 4, derde en vierde lid, van [richtlijn
      97/78/EG](31997L0078).

      10 De keuringsdierenarts is bevoegd de controles, bedoeld in het negende lid, achterwege te laten, indien de in
      dat lid bedoelde partij via een haven of luchthaven op Nederlands grondgebied wordt gebracht en vanuit die haven
      of luchthaven over zee of door de lucht naar een haven of luchthaven in een derde land wordt aangevoerd en, indien
      de partij in de eerstgenoemde haven of luchthaven wordt gelost of wordt opgeslagen, daarbij de krachtens artikel
      9, eerste lid, onderdeel b, onder i, van [richtlijn 97/78/EG](31997L0078) vastgestelde minimale periode niet wordt
      overschreden. Zolang de in de vorige zin bedoelde minimale periode niet is vastgesteld, bedraagt deze 7 dagen
      indien de partij in een haven wordt gelost of opgeslagen, of 24 uur, indien de partij in een luchthaven wordt
      gelost op opgeslagen.

      11 Het zesde en negende lid zijn van overeenkomstige toepassing op een in die leden bedoelde partij die op
      het grondgebied van de Europese Gemeenschap wordt opgeslagen in een van de in [artikel 2.50][ref9] genoemde
      opslagruimten.

      12 Onverminderd het zesde tot en met elfde lid, verricht de keuringsdierenarts indien er naar zijn oordeel gevaar
      bestaat dat de gezondheid van mens of dier wordt bedreigd of in in de artikelen 14, eerste lid, en 20, eerste lid,
      van [richtlijn 97/78/EG](31997L0078) bedoelde gevallen voorts alle door hem passend geachte veterinaire controles.


