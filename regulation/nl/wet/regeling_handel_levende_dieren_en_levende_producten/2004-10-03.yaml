  - number: 8.5b
    text: |-
      1 De partij vogels wordt van de inspectiepost, in door de keuringsdierenarts verzegelde, kooien of kratten,
      rechtstreeks, zonder verwisseling van de inhoud van de kratten of kooien, vervoerd naar een erkende
      quarantainevoorziening of naar een erkend quarantainestation, die, onderscheidenlijk dat, is opgenomen in de in
      artikel 2, punt 5, van beschikking 2000/666/EG bedoelde lijst, waar de vogels in quarantaine worden geplaatst.

      2 Papegaaiachtigen worden bij aankomst in de in het eerste lid bedoelde quarantainevoorziening respectievelijk
      het quarantainestation individueel geïdentificeerd overeenkomstig bijlage B, hoofdstuk 2, onder B, van beschikking
      2000/666/EG.

      3 Onverminderd [artikel 8.5g][ref1] worden de in het eerste lid bedoelde vogels ten minste 30 dagen in quarantaine
      gehouden.

      4 De in het eerste lid bedoelde vogels worden niet eerder uit quarantaine ontslagen dan nadat de minister daarvoor
      schriftelijk toestemming heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel8.5g
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel8.5b
