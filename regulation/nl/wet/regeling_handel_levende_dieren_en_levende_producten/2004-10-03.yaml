  - number: '3.3'
    text: |-
      1 Op grond van het onderzoek, bedoeld in [artikel 2.5][ref1], is gebleken dat voldaan wordt aan:

      a. artikel 3, tweede lid, onderdelen a, b en d, van [richtlijn 64/432/EEG](31964L0432);

      b. artikel 4, eerste en tweede lid, van [richtlijn 64/432/EEG](31964L0432);

      c. artikel 5, eerste lid, van [richtlijn 64/432/EEG](31964L0432);

      d. artikel 6, eerste en tweede lid, onderdelen a, b, c, en d, van [richtlijn 63/432/EEG](31963L0432), indien het
      foks- of gebruiksrunderen betreft, met dien verstande dat:

        - de in artikel 6, tweede lid, onderdeel a, van [richtlijn 64/432/EEG](31964L0432) bedoelde intradermale
      tuberculinatie niet is vereist;
        - de in artikel 6, tweede lid, onderdeel b, van [richtlijn 64/432/EEG](31964L0432) bedoelde serumagglutinatietest
      niet is vereist, en
        - de in artikel 6, tweede lid, onderdeel c, van [richtlijn 64/432/EEG](31964L0432) bedoelde test niet is vereist en

      e. artikel 6, derde lid, van [richtlijn 64/432/EEG](31964L0432), indien het slachtrunderen betreft.

      2 In zoverre in afwijking van het eerste lid, onderdeel d, aanhef, en van artikel 6, eerste lid,
      eerste gedachte-streepje, tweede alinea, van [richtlijn 64/432/EEG](31964L0432), en onverminderd
      [artikel 9e van de Regeling betreffende het bijeenbrengen van dieren 2000][ref2] is het toegestaan fokrunderen,
      die via een op grond van [artikel 9b van de Regeling betreffende het bijeenbrengen van dieren 2000][ref3] erkend
      runderverzamelcentrum buiten Nederland gebracht worden en bestemd zijn voor een derde land, voor een periode van
      ten hoogste 30 dagen op voornoemd erkend runderverzamelcentrum bijeen te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0011441#Artikel9e
      [ref3]: https://wetten.overheid.nl/BWBR0011441#Artikel9b
