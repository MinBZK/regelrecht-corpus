  - number: '3.14'
    text: |-
      1 In Nederland gebrachte slachtrunderen, bestemd voor Nederland, worden:

        - rechtstreeks vervoerd naar en onmiddellijk geslacht in een overeenkomstig [artikel 2.64][ref1] toegelaten
      slachthuis dan wel
        - rechtstreeks vervoerd naar een overeenkomstig artikel 9b van de Regeling betreffende het bijeenbrengen van dieren
      2000 erkend runderverzamelcentrum en vervolgens rechtstreeks vervoerd naar een overeenkomstig [artikel 2.64][ref2]
      toegelaten slachthuis.

      2 Indien de slachtrunderen van oorsprong zijn uit een land waarvoor ingevolge de Europese regelgeving in verband
      met mond- en klauwzeer beperkende maatregelen gelden ten aanzien van de invoer van runderen in de Gemeenschap
      dan wel van oorsprong zijn uit een land waarvoor op basis van Beschikking nr. 98/372/EG (PbEG L170) garanties
      worden gesteld ten aanzien van mond- en klauwzeer, geschiedt het vervoer en de slacht, bedoeld in het eerste lid,
      gescheiden van andere dieren en worden de runderen, alvorens te worden geslacht, bemonsterd overeenkomstig de
      aanwijzingen van de keuringsdierenarts.

      3 De karkassen van de ingevolge het tweede lid geslachte runderen worden, onverminderd het omtrent het slachten
      van runderen bepaalde bij of krachtens de [Vleeskeuringswet][ref3] of de [Veewet][ref4], in afwachting van de
      uitslag van het onderzoek van de ingevolge het tweede lid, genomen monsters, overeenkomstig de aanwijzingen van de
      betrokken keuringsdierenarts gescheiden opgeslagen in een daartoe door de betrokken keuringsdierenarts aangewezen
      koel- of vriesfaciliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.64
      [ref2]: https://wetten.overheid.nl/BWBR0007049#Artikel2.64
      [ref3]: https://wetten.overheid.nl/BWBR0001896
      [ref4]: https://wetten.overheid.nl/BWBR0001900
