  - number: '3.15'
    text: |-
      1 Een handelaar wordt door de minister slechts erkend indien: -voldaan wordt aan artikel 13, eerste lid, onderdelen
      a, en b, van [richtlijn 64/432/EEG](31964L0432) en voor zover van toepassing aan artikel 13, eerste lid, onderdeel
      c van [richtlijn 64/432/EEG](31964L0432); -voor zover van toepassing, zijn bedrijfsruimte voldoet aan het bepaalde
      in het tweede lid;

      2 Elke bedrijfsruimte die door een handelaar beroepshalve wordt gebruikt, staat onder toezicht van de ambtenaren
      en wordt door de minister slechts erkend en geregistreerd in een register indien voldaan wordt aan de in de
      artikelen 9a tot en met 9j van de Regeling betreffende het bijeenbrengen van dieren 2000 met betrekking tot voor
      verzamelplaatsen voor runderen gestelde eisen, met dien verstande dat in afwijking van onderdeel 2 van de bijlage
      bij het onderhavige hoofdstuk de bedrijfsruimte deel kan uitmaken van een bedrijf waar runderen en pluimvee zijn
      gehuisvest, doch waarbij de voor handelsdoeleinden bestemde beslagen in een epidemiologische bedrijfseenheid
      gescheiden worden gehouden van de door de handelaar op zijn bedrijf gehouden niet voor handelsdoeleinden bestemde
      beslagen, zodanig dat geen enkel contact tussen deze beslagen mogelijk is.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel3.15
  - number: '4.1'
    text: |-
      Onverminderd [artikel 1.1][ref1] wordt in dit hoofdstuk verstaan onder:




              *richtlijn 64/432/EEG:*


              richtlijn van de Raad van de Europese Gemeenschappen van 26 juni 1964 inzake veterinairrechtelijke
      vraagstukken op het gebied van het intracommunautaire handelsverkeer in runderen en varkens (PbEG L 121);




              *richtlijn 72/462/EEG:*


              richtlijn van de Raad van de Europese Gemeenschappen van 12 december 1972 inzake gezondheidsvraagstukken
      en veterinairrechtelijke vraagstukken bij de invoer van runderen, varkens, schapen en geiten, van vers vlees of van
      vleesproducten uit derde landen (PbEG L 302);




              *richtlijn 92/102/EEG:*


              richtlijn van de Raad van de Europese Gemeenschappen van 27 november 1992 met betrekking tot de
      identificatie en registratie van dieren (PbEG L 355);




              *slachtvarkens:*


              varkens die kennelijk bestemd zijn om te worden geslacht;



            fok- en gebruiksvarkens:

              varkens, niet zijnde slachtvarkens, die kennelijk bestemd zijn voor de fokkerij, voor de vleesproductie
      of die bestemd zijn voor tentoonstellingen en manifestaties, culturele en sportieve manifestaties daarvan
      uitgezonderd;



             beslag:

              op een bedrijf als een afzonderlijke epidemiologische eenheid gehouden varken of groep varkens met dien
      verstande dat wanneer er meerdere beslagen op een bedrijf zijn elk beslag een afzonderlijke eenheid vormt met
      eenzelfde gezondheidsstatus;



            handelaar:

              natuurlijke of rechtspersoon die al dan niet rechtstreeks varkens voor handelsdoeleinden koopt en verkoopt,
      een regelmatige omzetsnelheid heeft en die de varkens uiterlijk 30 dagen na aankoop doorverkoopt of van de ene
      bedrijfsruimte naar de andere, waarvan hij geen eigenaar is, verplaatst en voldoet aan [artikel 4.10][ref2];




              *varkensverzamelcentrum:*


              varkensverzamelcentrum dat op grond van artikel 4 van de Regeling betreffende het bijeenbrengen van dieren
      2000 erkend is.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0007049#Artikel4.10
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel4.1
