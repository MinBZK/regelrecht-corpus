  - number: 8.5h
    text: |-
      De virologische en serologische onderzoeken van de ingevolge deze afdeling genomen monsters en virusisolaten worden
      overeenkomstig bijlage C. punten 3 en 4, van beschikking 2000/666/EG uitgevoerd in het Instituut voor Dierhouderij
      en Diergezondheid te Lelystad.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel8.5h
  - number: 8.5i
    text: |-
      1 Alle uit deze afdeling voortvloeiende quarantainekosten zijn voor rekening van de importeur.

      2 De kosten voor keuringen en controle welke de VWA bij in quarantaine geplaatste vogels verricht betreffen de
      kosten die in rechtstreeks verband staan met deze keuringen en controles.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel8.5i
  - number: 8.5j
    text: |-
      Een erkende quarantainevoorziening of een erkend quarantainestation voldoet aan de eisen opgenomen in bijlage B,
      hoofdstuk 2, onder A, van beschikking 2000/666/EG.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel8.5j
  - number: 8.5k
    text: |-
      1 De partij bijen of hommels bevat per koninginnekast één koningin met maximaal twintig voedsters.

      2 De partij bijen of hommels is verzonden vanuit een derde land of een deel van een derde land, dat is vermeld op
      de lijst, bedoeld in artikel 1, eerste lid, eerste gedachtestreepje, van beschikking (EG) nr. 2003/881.

      3 De partij bijen of hommels gaat vergezeld van het gezondheidscertificaat, bedoeld in artikel 1, eerste lid,
      tweede gedachtestreepje, van beschikking (EG) nr. 2003/881, en voldoet aan de in het gezondheidscertificaat
      genoemde garanties.

      4 Na het vervoer naar de op het gezondheidscertificaat, bedoeld in het derde lid, aangegeven bestemming worden
      de kasten onder officieel toezicht van de VWA geplaatst en worden de koninginnen overgebracht naar nieuwe kasten
      voordat ze in contact met plaatselijke volken worden gebracht.

      5 De kasten, de voedsters en het andere materiaal, die uit het derde land van oorsprong met de koninginnen zijn
      meegestuurd, worden voor onderzoek op de aanwezigheid van de kleine bijenkastkever en de Tropilaelapsmijt naar een
      laboratorium gestuurd.

      6 Na afronding van het onderzoek, bedoeld in het vijfde lid, worden de kasten, de voedsters en het andere materiaal
      vernietigd.

      7 Indien uit het onderzoek, bedoeld in het vijfde lid, een negatief resultaat blijkt, wordt het officiële toezicht,
      bedoeld in het vierde lid, beëindigd.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel8.5k
  - number: 8.5l
    text: |-
      1 In afwijking van [artikel 8.5k][ref1] bevat een partij hommels per bergingsmiddel een enkel volk met maximaal 200
      volwassen hommels.

      2 De partij hommels is verzonden vanuit een derde land of een deel van een derde land dat is vermeld op de lijst,
      bedoeld in artikel 1, eerste lid, eerste gedachtestreepje, van beschikking (EG) nr. 2003/881.

      3 De partij hommels gaat vergezeld van het gezondheidscertificaat, bedoeld in artikel 2 van beschikking (EG) nr.
      2003/881, en voldoet aan de in het gezondheidscertificaat genoemde garanties.

      4 Gedurende of onmiddellijk na afloop van de levensduur van het volk wordt het bergingsmiddel en al het materiaal
      dat uit het derde land van oorsprong met de hommels is meegestuurd, vernietigd.


