  - number: '10.4'
    text: |-
      Op grond van het onderzoek, bedoeld in artikel 2.5, is gebleken dat, indien het een partij embryo's van varkens,
      schapen, geiten of eenhoevige dieren betreft:

      a. de embryo's verkregen zijn door een embryoteam bij vrouwelijke donordieren die voldoen aan bijlage D, hoofdstuk
      IV, van [richtlijn 92/65/EEG](31992L0065) en vervolgens in een aangepast laboratorium zijn behandeld;

      b. de embryo's zijn behandeld en opgeslagen overeenkomstig bijlage D, hoofdstuk III, van [richtlijn 92/65/EEG]
      (31992L0065), en

      c. het voor de inseminatie van de in onderdeel a bedoelde vrouwelijke donordieren gebruikte sperma voldoet aan
      artikel 9.3, onderdeel c, en artikel 9.4, onderdeel c.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel10.4
  - number: '10.5'
    text: |-
      Indien een partij die is verzonden vanuit een lid-staat en bestemd is voor Nederland of een lid-staat, gaat zij
      vergezeld van:

      a. het gezondheidscertificaat dat op grond van artikel 6 van [richtlijn 89/556/EEG](31989L0556) is voorgeschreven,
      indien het runderembryo's betreft, of

      b. het gezondheidscertificaat dat op grond van artikel 11, derde lid, derde gedachtenstreepje, van [richtlijn
      92/65/EEG](31992L0065) is voorgeschreven indien het embryo's van schapen, geiten, varkens en eenhoevige dieren
      betreft.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel10.5
  - number: '10.6'
    text: |-
      1 De partij is verzonden vanuit een derde land of een deel van een derde land, dat is vermeld op de lijst, bedoeld
      in:

      a. artikel 7, eerste lid, van [richtlijn 89/556/EEG](31989L0556), indien het runderembryo's betreft;

      b. artikel 17, tweede lid, onderdeel a, van [richtlijn 92/65/EEG](31992L0065), indien het embryo's van varkens,
      schapen, geiten of eenhoevige dieren betreft, met dien verstande dat, indien vorenbedoelde lijst nog niet is
      vastgesteld, de partij uit geen enkel derde land mag zijn verzonden, indien zij voor Nederland is bestemd, en de
      partij is verzonden vanuit een derde land of een deel van een derde land van waaruit de lid-staat van bestemming de
      invoer toestaat, indien zij voor een lid-staat is bestemd.

      2 De partij is verzameld, behandeld en opgeslagen door een runderembryoteam of embryoteam dat is vermeld op de
      lijst, bedoeld in:

      a. artikel 8, eerste lid, van [richtlijn 89/556/EEG](31989L0556), indien het runderembryo's betreft, of

      b. artikel 17, derde lid, onderdeel a, van [richtlijn 92/65/EEG](31992L0065), indien het embryo's van varkens,
      schapen, geiten of eenhoevige dieren betreft.

      3 De partij gaat vergezeld van het gezondheidscertificaat dat op grond van:

      a. artikel 10 van [richtlijn 89/556/EEG](31989L0556) is voorgeschreven, indien het runderembryo's betreft, of

      b. artikel 17, tweede lid, onderdeel b, van [richtlijn 92/65/EEG](31992L0065) is voorgeschreven, indien
      het embryo's van varkens, schapen, geiten of eenhoevige dieren betreft, dan wel, indien vorenbedoeld
      gezondheidscertificaat nog niet is vastgesteld, en:

        - de partij voor Nederland is bestemd, de partij vergezeld gaat van een certificaat dat een verklarig van de
      officiële dierenarts behelst dat de embryo's verkregen, behandeld en opgeslagen zijn op een wijze die tenminste
      gelijkwaardig is aan hetgeen hieromtrent op grond van artikel 11, derde lid, eerste en tweede gedachtenstreepje
      van [richtlijn 92/65/EEG](31992L0065) geldt, dat voldaan is aan artikel 11, derde lid, tweede alinea van [richtlijn
      92/65/EEG](31992L0065) en aan de voorschriften voor het brengen in Nederland van vorenbedoelde embryo's uit derde
      landen op grond van [hoofdstuk 2][ref1] van de onderhavige regeling;
        - de partij voor een lid-staat is bestemd, de partij vergezeld gaat van het certificaat dat door de lid-staat van
      bestemming wordt geëist.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Hoofdstuk2
