  - number: '2.7'
    text: |-
      De dieren of producten zijn afkomstig van een bedrijf, centrum of instelling, waarop regelmatig een controle door
      de keuringsdierenarts wordt verricht, teneinde na te gaan of aan de onderhavige regeling wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel2.7
  - number: '2.8'
    text: |-
      De dieren of producten zijn niet afkomstig van een bedrijf, centrum, instelling, zone of gebied, bedoeld in artikel
      3, eerste lid, onderdeel e, subonderdelen i tot en met iv, van [richtlijn 90/425/EEG](31990L0425).
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel2.8
  - number: '2.9'
    text: |-
      1 Het bewijsstuk, bedoeld in [artikel 2.4, onderdeel a][ref1], vergezeld de partij tot de plaats van bestemming.

      2 Indien de dieren of producten naar meer dan één bestemming worden vervoerd gaat elke partij vergezeld van het
      bewijsstuk, bedoeld in [artikel 2.4, onderdeel a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.4
      [ref2]: https://wetten.overheid.nl/BWBR0007049#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0007049
        artikel: '2.4'
