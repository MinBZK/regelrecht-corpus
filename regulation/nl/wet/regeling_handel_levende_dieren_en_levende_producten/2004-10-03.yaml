  - number: '11.4'
    text: |-
      Indien een partij die is verzonden vanuit een lid-staat en bestemd is voor Nederland of een lid-staat, gaat zij
      vergezeld van het gezondheidscertificaat dat op grond van artikel 11, derde lid, derde gedachtenstreepje, van
      [richtlijn 92/65](31992L0065) is voorgeschreven indien het eicellen van schapen, geiten, varkens en eenhoevige
      dieren betreft.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel11.4
  - number: '11.5'
    text: |-
      1 De partij is verzonden vanuit een derde land of een deel van een derde land, dat is vermeld op de lijst, bedoeld
      in artikel 17, tweede lid, onderdeel a, van [richtlijn 92/65/EEG](31992L0065), met dien verstande dat, indien
      vorenbedoelde lijst nog niet is vastgesteld, de partij uit geen enkel derde land mag zijn verzonden, indien zij
      voor Nederland is bestemd, en de partij is verzonden vanuit een derde land of een deel van een derde land van
      waaruit de lid-staat van bestemming de invoer toestaat, indien zij voor een lid-staat is bestemd.

      2 De partij is verzameld, behandeld en opgeslagen door een erkend team dat is vermeld op de lijst, bedoeld in
      artikel 17, derde lid, onderdeel a, van [richtlijn 92/65/EEG](31992L0065).

      3 De partij gaat vergezeld van het gezondheidscertificaat dat op grond van artikel 17, tweede lid, onderdeel b, van
      [richtlijn 92/65/EEG](31992L0065) is voorgeschreven, dan wel, indien vorenbedoeld gezondheidscertificaat nog niet
      is vastgesteld, en:

        - de partij voor Nederland is bestemd, de partij vergezeld gaat van een certificaat dat een verklaring van de
      officiële dierenarts behelst dat de eicellen zijn verkregen, behandeld en opgeslagen op een wijze die tenminste
      gelijkwaardig is aan hetgeen hieromtrent op grond van artikel 11, derde lid, eerste en tweede gedachtenstreepje
      van [richtlijn 92/65/EEG](31992L0065) geldt, dat voldaan is aan artikel 11, derde lid, tweede alinea van [richtlijn
      92/65/EEG](31992L0065) en aan de voorschriften voor het brengen in Nederland van vorenbedoelde eicellen uit derde
      landen op grond van [hoofdstuk 2][ref1] van de onderhavige regeling;
        - de partij voor een lid-staat is bestemd, de partij vergezeld gaat van het certificaat dat door de lid-staat van
      bestemming wordt geëist.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel11.5
    references:
      - id: ref1
        bwb_id: BWBR0007049
        hoofdstuk: '2'
  - number: '11.6'
    text: |-
      Eicellen als bedoeld in artikel 13, eerste lid, van [richtlijn 92/65/EEG](31992L0065):

      a. gaan vergezeld van het vervoersdocument, dat op grond van artikel 13, eerste lid, van [richtlijn 92/65/EEG]
      (31992L0065) is voorgeschreven;

      b. zijn afkomstig van een instelling, instituut of centrum dat is erkend overeenkomstig [artikel 9.11][ref1]
      en zijn bestemd voor een door de bevoegde autoriteit van het land van bestemming overeenkomstig bijlage C van
      [richtlijn 92/65/EEG](31992L0065) erkende instelling, erkend instituut of erkend centrum.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel9.11
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel11.6
    references:
      - id: ref1
        bwb_id: BWBR0007049
        artikel: '9.11'
        hoofdstuk: '9'
        afdeling: '7'
  - number: '11.7'
    text: |-
      1 Eicellen als bedoeld in artikel 13, eerste lid, van [richtlijn 92/65/EEG](31992L0065) gaan vergezeld van het
      in artikel 13, eerste lid, van [richtlijn 92/65/EEG](31992L0065) bedoelde vervoersdocument, dan wel, indien
      de eicellen zijn verzonden vanuit een derde land en via het grondgebied van een lid-staat in Nederland worden
      gebracht, van de documenten, bedoeld in artikel 10, eerste lid, eerste en tweede gedachtenstreepje, van [richtlijn
      90/675/EEG](31990L0675).

      2 De documenten, bedoeld in het eerste lid, zijn opgesteld en afgegeven in overeenstemming met de regelgeving van
      de Raad van de Europese Unie of de Commissie van de Europese Gemeenschappen, volledig ingevuld, gedagtekend en
      ondertekend, terwijl de geldigdheidsduur ervan niet is verstreken.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel11.7
  - number: '12.1'
    text: |-
      1 Ter uitvoering van artikel 81, tweede tot en met vierde lid, van de wet wordt medewerking gevorderd van het
      bestuur van het Produktschap voor Pluimvee en Eieren.

      2 De gevorderde medewerking bestaat in het bij verordening stellen van nadere regelen ter zake van het verlenen van
      een officiële erkenning van inrichtingen als bedoeld in artikel 6.3, onderdeel e, van deze regeling.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel12.1
  - number: '13.1'
    text: |-
      De Regeling in- en doorvoer vee, veeproducten e.d., de Regeling doorvoer vee 1992, de Regeling wederinvoer vee
      1992, de Regeling invoer vee 1992, de Regeling in- en doorvoer sperma van runderen 1992, de Regeling in- en
      doorvoer embryo's van runderen 1993, de Regeling in- en doorvoer sperma van varkens 1993, de Regeling in- en
      doorvoer papagaaien en papagaaiachtigen 1977, de Regeling invoer levende en dode vossen, de Regeling in en doorvoer
      levende konijnen 1984, de Regeling in- en doorvoer nertsen 1977, de Regeling in- en doorvoer honden en katten, de
      Regeling in-, uit- en doorvoer circusdieren 1971, de Regeling in-, door- en vervoer pluimvee, vogels en broedeieren
      1992, de Regeling in- en doorvoer levende dieren en producten 1993, de Regeling uitvoer vee 1974, de Beschikking
      vervoer sperma van runderen, de Beschikking vervoer diepgevroren sperma van runderen, de Beschikking vervoer
      embryo's van runderen, de Beschikking vervoer sperma van varkens, de Regeling vervoer levende dieren en producten
      1993, en de Beschikking vervoer pluimvee en broedeieren, de Beschikking vervoer geregistreerde paardachtigen en de
      Regeling voorschriften slachtkalveren worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel13.1
  - number: 13.1a
    text: |-
      Deze regeling berust mede op de [artikelen 30](onbekend) en [105 van de Gezondheids- en welzijnswet voor dieren]
      (onbekend).
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel13.1a
  - number: '13.2'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel13.2
  - number: '13.3'
    text: |-
      Deze regeling wordt aangehaald als: Regeling handel levende dieren en levende producten.

      Deze regeling wordt met de toelichting in de Staatscourant geplaatst.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel13.3
