    text: |-
      1 Een handelaar wordt door de minister erkend indien:

        - voldaan is aan artikel 8 ter, eerste lid, onderdelen a en b, van [richtlijn 91/68/EEG](31991L0068);
        - voor zover van toepassing, zijn bedrijfsruimte voldoet aan het tweede lid en aan artikel 8 ter, eerste lid,
      onderdeel c, tweede gedachtestreepje, van [richtlijn 91/68/EEG](31991L0068).

      2 Elke bedrijfsruimte die door een handelaar beroepshalve wordt gebruikt, staat onder toezicht van de
      ambtenaren en wordt door de minister slechts erkend en geregistreerd indien is voldaan aan de in de
      [artikelen 9l tot en met 9p van de Regeling betreffende het bijeenbrengen van dieren 2000][ref1] met betrekking tot
      voor verzamelplaatsen voor schapen en geiten gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0011441#Artikel9l
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel7.9
