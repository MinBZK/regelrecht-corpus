  - number: 8.5c
    text: |-
      1 Nadat de vogels overeenkomstig [artikel 8.5b, eerste lid][ref1], in quarantaine zijn geplaatst, wordt het
      overeenkomstig bijlage C, punt 1, van beschikking 2000/666/EG beschreven onderzoek van de vogels of, indien van
      toepassing, de verklikkerkuikens uitgevoerd.

      2 Indien tijdens de quarantaine gebruik wordt gemaakt van verklikkerkuikens, gelden de voorschriften, bedoeld in
      artikel 4, tweede lid, van beschikking 2000/666/EG.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel8.5b
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel8.5c
    references:
