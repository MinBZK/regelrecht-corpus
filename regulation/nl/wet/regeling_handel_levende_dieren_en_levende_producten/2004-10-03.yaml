  - number: 2.50e
    text: |-
      Uitslag van een partij producten die niet voldoet aan de in deze regeling voor desbetreffende producten gestelde
      voorschriften voor het brengen op Nederlands grondgebied uit een opslagruimte als bedoeld in [artikel 2.50b][ref1],
      is slechts toegestaan indien de partij bestemd is:

      a. voor een derde land en elders geen opslag van de partij plaatsvindt;

      b. om te worden vernietigd, met inachtneming van artikel 12, zevende lid, derde gedachtenstreepje, van [richtlijn
      97/78/EG](31997L0078).


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.50b
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel2.50e
