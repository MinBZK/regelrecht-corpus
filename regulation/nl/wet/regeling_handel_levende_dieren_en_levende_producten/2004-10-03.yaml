  - number: '2.34'
    text: |-
      Het verbod, bedoeld in [artikel 2.1, tweede lid, derde gedachtenstreepje][ref1], geldt niet ter zake van het in
      Nederland brengen van dieren die via Nederland voor het eerst in de gebieden waarop het [Verdrag betreffende de
      Europese Unie](onbekend) van toepassing is worden gebracht on:

      a. zijn verzonden vanuit een derde land of deel van een derde land;

      b. zijn aangevoerd met een vliegtuig of een schip en met een vliegtuig, onderscheidenlijk een schip het Nederlandse
      grondgebied rechtstreeks via dezelfde luchthaven, onderscheidenlijk haven van aanvoer weer verlaten;

      c. waarvan de eerst volgende bestemming blijkens de bij de partij behorende documenten een derde land is, en

      d. zij tussentijds niet in contact komen met andere dieren en, indien zij tussentijds het transportmiddel verlaten,
      het daartoe door de keuringsdierenarts aangewezen terrein niet verlaten,

      mits het voornemen om de dieren in Nederland te brengen tijdig bij de VWA is gemeld en, voor zover van toepassing,
      voldaan wordt aan de [artikelen 2.39][ref2] en [2.40][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0007049#Artikel2.39
      [ref3]: https://wetten.overheid.nl/BWBR0007049#Artikel2.40
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel2.34
