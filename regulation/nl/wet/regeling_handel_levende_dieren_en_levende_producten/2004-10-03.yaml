  - number: '4.9'
    text: |-
      1 In Nederland gebrachte slachtvarkens, bestemd voor Nederland, worden rechtstreeks vervoerd naar en geslacht in
      een overeenkomstig [artikel 2.64][ref1] toegelaten slachthuis.

      2 [Artikel 3.14, tweede en derde lid][ref2], is van overeenkomstige toepassing op in Nederland gebrachte
      slachtvarkens, als bedoeld in het eerste lid, van oorsprong uit een land waarvoor ingevolge de Europese regelgeving
      in verband met mond- en klauwzeer of klassieke varkenspest of Afrikaanse varkenspest beperkende maatregelen gelden
      ten aanzien van de invoer van varkens in de Gemeenschap, dan wel van oorsprong uit een land waarvoor op basis van
      Beschikking nr. 98/372/EG (PbEG L170) garanties worden gesteld ten aanzien van mond- en klauwzeer.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.64
      [ref2]: https://wetten.overheid.nl/BWBR0007049#Artikel3.14
