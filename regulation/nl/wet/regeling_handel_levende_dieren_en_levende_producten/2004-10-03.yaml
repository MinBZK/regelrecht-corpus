  - number: 4.4a
    text: |-
      1 In afwijking van de artikelen 6, 8 en 9 van de Regeling betreffende het bijeenbrengen van dieren 2000 en
      onverminderd de artikelen 4.2, 4.3 en 4.4 kan het gezondheidscertificaat, bedoeld in artikel 4.2, op een
      varkensverzamelcentrum afgegeven worden voor varkens, die afkomstig zijn van één bedrijf, mits:

      a. de varkens die op het terrein van het varkensverzamelcentrum worden gebracht dezelfde gezondheidsstatus hebben
      als de varkens die aanwezig zijn op het varkensverzamelcentrum;

      b. geen aanvoer van fok- en gebruiksvarkens plaatsvindt op het moment dat slachtvarkens op het
      varkensverzamelcentrum aanwezig zijn en geen aanvoer van slachtvarkens plaatsvindt op het moment dat fok- en
      gebruiksvarkens op het varkensverzamelcentrum aanwezig zijn;

      c. de varkens niet in contact komen met andere, op het varkensverzamelcentrum aanwezige varkens;

      d. de varkens op een zodanig overdekt deel van het terrein van het varkensverzamelcentrum, dat onder alle
      klimatologische omstandigheden een afdoende reiniging en ontsmetting mogelijk is, voor een korte periode worden
      uitgeladen teneinde de keuringsdierenarts in de gelegenheid te stellen de gezondheidstoestand van de varkens te
      beoordelen, waarna de varkens meteen en uitsluitend in hetzelfde vervoermiddel en in dezelfde compartimenten van
      het vervoermiddel worden ingeladen;

      e. de varkens niet worden gebracht binnen de overdekte stalruimte waar krachtens de Regeling betreffende het
      bijeenbrengen van dieren 2000 varkens worden verzameld;

      f. het deel van het terrein van het varkensverzamelcentrum, waar het in- en uitladen als bedoeld in onderdeel c
      geschiedt, na het inladen van de varkens wordt gereinigd en ontsmet met één of meer installaties, die water leveren
      van voldoende druk voor een deugdelijke en efficiënte reiniging en ontsmetting.

      2 Artikel 6, eerste lid, van de Regeling inzake hygiënevoorschriften besmettelijke dierziekten 2000 is niet van
      toepassing bij het uitladen van varkens, bedoeld in het eerste lid.

      3 Het in- en uitladen van varkens als bedoeld in het eerste lid, onderdeel c, geschiedt op een zodanige wijze dat
      de hoek van de laadklep van het vervoermiddel en de plaats waar de varkens voor een korte periode worden uitgeladen
      ten hoogste twintig graden bedraagt indien het vervoermiddel in horizontale stand is geplaatst.

      4 Indien ingevolge artikel 59, tweede lid, onderdeel e, van de wet en artikel 6, eerste lid, van het Besluit
      dierenvervoer 1994 voor het vervoer van varkens geen gezondheidscertificaat wordt afgegeven, is het toegestaan
      deze varkens rechtstreeks af te voeren naar een in Nederland gelegen slachthuis, dan wel toe te voegen
      aan de overeenkomstig de Regeling betreffende het bijeenbrengen van dieren 2000 verzamelde varkens op het
      varkensverzamelcentrum in welk geval het herkomstbedrijf van de toegevoegde varkens wordt meegeteld bij het aantal
      herkomstbedrijven als bedoeld in artikel 6, eerste lid, onderdeel f, van de Regeling betreffende het bijeenbrengen
      van dieren 2000, met dien verstande dat het maximum van 50 herkomstbedrijven niet mag worden overschreden.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel4.4a
  - number: '4.5'
    text: |-
      De varkens zijn geïdentificeerd en geregistreerd overeenkomstig het bij of krachtens het
      [Besluit identificatie en registratie van dieren][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0009019
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0009019
  - number: '4.6'
    text: |-
      1 Indien een partij is verzonden vanuit een lidstaat en bestemd is voor Nederland of een lidstaat, gaat zij
      vergezeld van het gezondheidscertificaat dat op grond van artikel 5, eerste lid, van [richtlijn 64/432/EEG]
      (31964L0432) voor de desbetreffende soort varkens is voorgeschreven, met dien verstande dat, indien de partij
      bestemd is voor een Lid- Staat, in voorkomend geval, uit het gezondheidscertificaat blijkt dat voldaan wordt
      aan de met betrekking tot de in bijlage E (II) van [richtlijn 64/432/EEG](31964L0432) vermelde ziekten gestelde
      aanvullende garanties, bedoeld in artikel 9, tweede lid, en in artikel 10, tweede lid, van [richtlijn 64/432/EEG]
      (31964L0432).

      2 Het gezondheidscertificaat, bedoeld in het eerste lid, is aangevuld met een verklaring van de officiële
      dierenarts dat is voldaan aan [richtlijn 91/628/EEG](31991L0628) en gaat bij reizen van meer dan acht uur vergezeld
      van een reisschema als bedoeld in artikel 5, A, tweede lid, onderdeel b, van [richtlijn 91/628/EEG](31991L0628) dat
      gedurende de reis gehecht is aan het gezondheidscertificaat, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel4.6
  - number: '4.7'
    text: |-
      1 Indien een partij is bestemd voor Nederland of voor een Lidstaat komt de partij tot de plaats van bestemming
      respectievelijk tot de plaats waar de partij buiten Nederland wordt gebracht niet in aanraking met andere
      evenhoevige dieren die niet over dezelfde gezondheidsstatus beschikken.

      2 De in het eerste lid bedoelde partij wordt vervoerd in een vervoermiddel dat voldoet aan artikel 4, tweede lid,
      van [richtlijn 64/432/EEG](31964L0432).

      3 Het binnen Nederland brengen van varkens als bedoeld in [artikel 4.6, eerste lid][ref1], kan plaatsvinden via
      een varkensverzamelcentrum.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel4.6
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0007049
        artikel: '4.6'
        hoofdstuk: '4'
        afdeling: '3'
  - number: '4.8'
    text: |-
      1 De partij is verzonden vanuit een derde land of een deel van een derde land, dat is vermeld op de lijsten,
      bedoeld in de artikelen 3, eerste lid, en 6, derde lid, onderdeel a, van [richtlijn 72/462/EEG](31972L0462).

      2 De partij gaat vergezeld van het gezondheidscertificaat dat op grond van artikel 11 van [richtlijn 72/462/EEG]
      (31972L0462) voor de desbetreffende soort varkens is voorgeschreven.

      3 Het gezondheidscertificaat, bedoeld in het tweede lid, is aangevuld met een verklaring van de officiële
      dierenarts dat voldaan is aan [richtlijn 91/628/EEG](31991L0628) en gaat vergezeld van:

      a. een document waaruit blijkt dat voldaan is aan artikel 11, tweede lid, eerste gedachtenstreepje, van genoemde
      richtlijn;

      b. een reisschema als bedoeld in artikel 11, tweede lid, tweede gedachtestreepje, van genoemde richtlijn.

      4 Aan de partij zijn geen stoffen toegediend die ingevolge artikel 3, onderdeel a, van [richtlijn 96/22/EG]
      (31996L0022) niet aan varkens mogen worden toegediend, tenzij aan de voorwaarden ingevolge artikel 11 van genoemde
      richtlijn is voldaan.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel4.8
  - number: 4.8a
    text: |-
      [Artikel 3.13b][ref1] is van overeenkomstige toepassing op in Nederland gebrachte fok- en gebruiksvarkens bestemd
      voor Nederland en van oorsprong uit een land waarvoor ingevolge de Europese regelgeving in verband met mond- en
      klauwzeer of klassieke varkenspest of Afrikaanse varkenspest beperkende maatregelen gelden ten aanzien van de
      invoer van varkens in de Gemeenschap, dan wel van oorsprong uit een land waarvoor op basis van Beschikking nr.
      98/372/EG (PbEG L170) garanties worden gesteld ten aanzien van mond- en klauwzeer.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel3.13b
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel4.8a
    references:
      - id: ref1
        bwb_id: BWBR0007049
        artikel: 3.13b
        hoofdstuk: '3'
        afdeling: 4a
  - number: 4.8b
    text: |-
      1 Onverminderd het bepaalde in [artikel 4.8a][ref1] worden in Nederland gebrachte fok- en gebuiksvarkens, bestemd
      voor Nederland, rechtstreeks naar het bedrijf van bestemming vervoerd en aan het beslag op het bedrijf van
      bestemming toegevoegd nadat de voor dat bedrijf verantwoordelijke dierenarts heeft geconstateerd dat deze varkens
      geen bedreiging vormen voor de gezondheidsstatus.

      2 Behoudens wanneer de in het eerste lid bedoelde varkens bij aankomst op het bedrijf van bestemming terstond
      ten genoegen van de officiële dierenarts op zodanige wijze afgezonderd worden gehouden van reeds op dat bedrijf
      aanwezige dieren zodat ieder contact tussen de betrokken varkens en de overige op dat bedrijf aanwezige dieren is
      uitgesloten, mogen gedurende een periode van 30 dagen te rekenen vanaf de dag waarop de in het eerste lid bedoelde
      varkens op het bedrijf van bestemming zijn binnengebracht geen dieren van het bedrijf worden afgevoerd, behoudens
      de rechtstreekse afvoer naar een in Nederland gelegen slachthuis.

      3 In Nederland gebrachte fok- en gebruiksvarkens, bestemd voor een lidstaat, worden zo snel
      mogelijk naar de Lidstaat van bestemming vervoerd en gaan vergezeld van de documenten, bedoeld in
      [artikel 2.22, vierde lid, onderdeel a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel4.8a
      [ref2]: https://wetten.overheid.nl/BWBR0007049#Artikel2.22
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel4.8b
