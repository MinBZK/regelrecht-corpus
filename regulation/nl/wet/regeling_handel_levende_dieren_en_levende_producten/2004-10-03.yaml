  - number: 8.5f
    text: |-
      1 In zoverre in afwijking van [artikel 8.5e, eerste lid][ref1], kan, wanneer bij een of meer vogels of de daarbij
      geplaatste verklikkerkuikens Newcastle disease wordt vastgesteld, de minister besluiten dat de betrokken vogels
      niet behoeven te worden gedood en vernietigd, indien uit virologisch onderzoek van overeenkomstig het tweede lid
      genomen monsters een negatief resultaat blijkt.

      2 Ten minste 30 dagen nadat het laatste zieke dier is gestorven of hersteld worden overeenkomstig bijlage C, punt
      1, onder B, monsters genomen van alle vogels van de zending indien deze minder dan 60 dieren telt, of, indien het
      een grotere zending betreft, van 60 vogels.

      3 Bij toepassing van het eerste lid:

      a. mogen de betrokken vogels het quarantainestation uitsluitend verlaten nadat uit de genomen monsters een negatief
      resultaat blijkt en ten vroegste 60 dagen nadat de klinische symptomen van Newcastle disease zijn verdwenen, en

      b. wordt al het mogelijk besmet materiaal en afval, alsmede het afval dat wordt geproduceerd gedurende de in
      onderdeel a bedoelde periode van 60 dagen, onder toezicht van de keuringsdierenarts op zodanige wijze vernietigd
      dat het Newcastle diseasevirus met zekerheid geïnactiveerd is.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel8.5e
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel8.5f
