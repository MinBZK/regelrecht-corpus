  - number: '2.35'
    text: |-
      1 De dieren zijn geïdentificeerd en worden aangevoerd via een inspectiepost.

      2 De melding van de aanvoer van een partij vindt plaats aan de VWA overeenkomstig artikel 1, eerste tot en met
      derde lid, van [verordening 282/2004/EG](32004R0282).

      3 De dieren worden bij aankomst op de inspectiepost ten onderzoek aangeboden aan de keuringsdierenarts, waarbij aan
      hem wordt overgelegd:

      a. het certificaat en het document, genoemd in [afdeling 4 van de hoofdstukken 3 tot en met 8][ref1]
      of in [afdeling 4a][ref2] of [afdeling 4b van hoofdstuk 8][ref3], alsmede het reisschema, genoemd in
      [afdeling 4 van de hoofdstukken 3][ref4], [4][ref5], [5][ref6] en [7][ref7];

      b. indien het raszuivere dieren of hybride varkens betreft, de zoötechnische documenten die bij of krachtens het
      [Fokkerijbesluit][ref8] zijn voorgeschreven voor het brengen in Nederland van raszuivere dieren en hybride varkens
      die via Nederland voor het eerst in de gebieden waarop het [Verdrag betreffende de Europese Unie](onbekend) van
      toepassing is worden gebracht.

      4 Het certificaat, genoemd in [afdeling vier van de hoofdstukken 3 tot en met 8][ref9] of in [afdeling 4a][ref10]
      of [afdeling 4b van hoofdstuk 8][ref11], en de zoötechnische documenten die bij of krachtens het
      [Fokkerijbesluit][ref12] zijn voorgeschreven voor het brengen in Nederland van raszuivere dieren en hybride
      varkens die via Nederland voor het eerst in de gebieden waarop het [Verdrag betreffende de Europese Unie](onbekend)
      van toepassing is worden gebracht zijn originelen, waarvan de geldigheidsduur niet is verstreken. Zij zijn in
      overeenstemming met de regelgeving van de Raad van de Europese Unie of de Commissie van de Europese Gemeenschappen
      afgegeven, volledig ingevuld, gedagtekend en ondertekend.


