  - number: '2.18'
    text: |-
      De bewijsstukken, bedoeld in artikel 2.16, eerste lid, onderdeel a, tweede gedachtenstreepje, worden slechts
      afgegeven, indien op grond van een van Rijkswege ingesteld onderzoek is gebleken dat voldaan wordt aan de artikelen
      2.19, 2.20, 2.21 en aan:

        - de artikelen 3.3 en 3.4 van afdeling 2 van hoofdstuk 3, indien het runderen betreft;
        - de artikelen 4.3 en 4.4 van afdeling 2 van hoofdstuk 4, indien het varkens betreft;
        - de artikelen 5.3 en 5.4 van afdeling 2 van hoofdstuk 5, indien het eenhoevige dieren betreft;
        - voor zover van toepassing, de artikelen 6.3, 6.4 of 6.5 van afdeling 2 van hoofdstuk 6, indien het pluimvee en
      broedeieren betreft;
        - de artikelen 7.3 en 7.4 van afdeling 2 alsmede artikel 7.6 van afdeling 3 van hoofdstuk 7, indien het schapen of
      geiten betreft;
        - artikel 8.3 van afdeling 2 van hoofdstuk 8, indien het apen, hoefdieren, bijen, honden, katten en lagomorfen met
      gezondheidscertificaat betreft;
        - de artikelen 9.3 en 9.4 van afdeling 2 van hoofdstuk 9, indien het sperma betreft;
        - de artikelen 10.3 of 10.4 van afdeling 2 hoofdstuk 10, indien het embryo's betreft;
        - artikel 11.3 van afdeling 2 van hoofdstuk 11, indien het eicellen betreft, met dien verstande dat;
        - indien het dieren betreft, tenminste wordt voldaan aan hetgeen in vorenbedoelde artikelen voor slachtdieren is
      bepaald, en
        - het veterinaire document of certificaat, dat aan de veterinaire voorschriften van het derde land van bestemming
      voldoet, slechts wordt afgegeven indien aan de voorschriften van het derde land van bestemming wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel2.18
  - number: '2.19'
    text: |-
      Runderen, varkens, schapen en geiten, zijn geïdentificeerd en geregistreerd overeenkomstig hetgeen hieromtrent in
      de [tweede afdeling van de hoofdstukken 3][ref1], [4][ref2] en [7][ref3] is gesteld, geregistreerde paarden en
      fok- en gebruikspaarden, bedoeld in [artikel 5.1][ref4], zijn geïdentificeerd overeenkomstig hetgeen hieromtrent in
      de [tweede afdeling van hoofdstuk 5][ref5] is gesteld, honden en katten zijn geïdentificeerd overeenkomstig hetgeen
      hieromtrent in de [tweede afdeling van hoofdstuk 8][ref6] is gesteld en de overige dieren zijn geïdentificeerd en
      geregistreerd overeenkomstig artikel 3, eerste lid, onderdeel c, van [richtlijn 90/425/EEG](31990L0425).


