  - number: '2.22'
    text: |-
      1 Het verbod, bedoeld in artikel 2.1, tweede lid, eerste gedachtenstreepje, geldt niet ter zake van het brengen in
      Nederland van dieren en producten die zijn verzonden vanuit een lid-staat dan wel zijn verzonden vanuit een derde
      land en via het grondgebied van een lid-staat in Nederland worden gebracht, mits voldaan wordt aan, voor zover van
      toepassing, het tweede tot en met het vierde lid, en de artikelen 2.23 tot en met 2.31.

      2 Indien de dieren of producten zijn verzonden vanuit een lid-staat en bestemd zijn voor Nederland of een lid-
      staat:

      a. gaan raszuivere dieren, hybride varkens en producten hiervan vergezeld van de zoötechnische documenten die bij
      of krachtens het Fokkerijbesluit zijn voorgeschreven voor het brengen in Nederland van raszuivere dieren, hybride
      varkens en hun producten die zijn verzonden vanuit een lid-staat;

      b. wordt voldaan aan:

        - afdeling 3 van hoofdstuk 3, indien het runderen betreft;
        - afdeling 3 van hoofdstuk 4, indien het varkens betreft;
        - afdeling 3 van hoofdstuk 5, indien het eenhoevige dieren betreft;
        - afdeling 3 van hoofdstuk 6, indien het pluimvee en broedeieren betreft;
        - afdeling 3 van hoofdstuk 7, indien het schapen en geiten betreft;
        - afdeling 3 van hoofdstuk 8, indien het apen, hoefdieren, bijen, honden, katten en lagomorfen met
      gezondheidscertificaat betreft;
        - afdeling 3 van hoofdstuk 9, indien het sperma betreft;
        - afdeling 3 van hoofdstuk 10, indien het embryo's betreft, en
        - afdeling 3 van hoofdstuk 11, indien het eicellen betreft.

      3 Indien de dieren of producten zijn verzonden vanuit een lid-staat en bestemd zijn voor een derde land, gaat de
      partij vergezeld van het certificaat of document, genoemd in de derde afdeling van de hoofdstukken 3 tot en met
      11, dat, indien het dieren betreft, ten-minste bestemd is voor slachtdieren, alsmede van de veterinaire documenten
      of certificaten, die aan de veterinaire voorschriften van het derde land van bestemming voldoen, tenzij op het
      certificaat of document, genoemd in de derde afdeling van de hoofdstukken 3 tot en met 11, de vermelding ‘Dieren of
      producten voor uitvoer naar (naam van het derde land)’ voorkomt, waarbij de naam van het derde land van bestemming
      als het gedeelte tussen haakjes is opgenomen.

      4 Indien de dieren of producten zijn verzonden vanuit een derde land en via het grondgebied van een lid-staat in
      Nederland worden gebracht, gaat de partij vergezeld van:

      a. het Gemeenschappelijke veterinaire document van binnenkomst, bedoeld in [verordening 282/2004/EG](32004R0282),
      alsmede het document, onderscheidenlijk de documenten, bedoeld in artikel 7, eerste lid, eerste gedachtestreepje,
      van [richtlijn 91/496/EEG](31991L0496), indien het dieren betreft;

      b. indien het producten bestemd voor Nederland of een lid-staat betreft, een Gemeenschappelijk veterinair document
      van binnenkomst als bedoeld in [verordening 136/2004/EG](32004R0136) en van een gewaarmerkt afschrift als bedoeld
      in artikel 7, vierde lid, van [richtlijn 97/78/EG](31997L0078);

      c. indien het producten bestemd voor een derde land betreft, een bij de partij behorend document, waaruit tenminste
      de oorsprong van de partij en de verdere bestemming hiervan kan worden afgeleid, en van een Gemeenschappelijk
      veterinair document van binnenkomst als bedoeld in [verordening 136/2004/EG](32004R0136), waarin is aangegeven
      langs welke grensinspectiepost de partij de Gemeenschap verlaat.

      5 Het eerste lid is niet van toepassing op vee, niet zijnde paarden niet bestemd voor de slacht, afkomstig uit
      België.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel2.22
  - number: '2.23'
    text: |-
      1 Het certificaat of document, genoemd in de [derde afdeling van de hoofdstukken 3 tot en met 11][ref1], alsmede
      de certificaten of documenten, bedoeld in [artikel 2.22, tweede lid, onderdeel a, derde en vierde lid][ref2], zijn,
      met uitzondering van de documenten, bedoeld in artikel 7, eerste lid, eerste gedachtenstreepje, van [richtlijn
      91/496/EEG](31991L0496), originelen, waarvan de geldigheidsduur niet is verstreken. Zij zijn in overeenstemming
      met de regelgeving van de Raad van de Europese Unie of de Commissie van de Europese Gemeenschappen opgesteld en
      afgegeven, volledig ingevuld, gedagtekend en ondertekend.

      2 Indien de dieren of producten zijn verzonden vanuit een lid-staat en bestemd zijn voor een derde
      land geldt, onverminderd het eerste lid, ter zake van het certificaat of document, genoemd in de
      [derde afdeling van de hoofdstukken 3 tot en met 11][ref3], dat:

        - daarop, in voorkomend geval, de gelijkwaardige, bijkomende waarborgen zijn opgenomen, bedoeld in artikel 3,
      eerste lid, onderdeel e, subonderdeel IV, van [richtlijn 90/425/EEG](31990L0425), voor zover deze waarborgen
      betrekking hebben op slachtdieren;
        - het in tenminste één van de talen van de lid-staat van oorsprong is gesteld en in de Nederlandse taal of, indien
      de partij bestemd is om te worden doorgevoerd via een andere lid-staat, tevens in één van de talen van de lid-staat
      waar zich het punt van uitgang bevindt;
        - daarop het punt van uitgang als de plaats van bestemming is vermeld;
        - daarop als ontvanger is vermeld, met naam en adres, de handelaar die in Nederland bij het punt van uitgang bij de
      doorvoer van de partij betrokken is, dan wel, in geval de partij bestemd is om te worden doorgevoerd via een andere
      lid-staat, de ontvanger bij het punt van uitgang, bedoeld in artikel 4, tweede gedachtenstreepje, van beschikking
      93/444/EEG.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0007049#Artikel2.22
      [ref3]: https://wetten.overheid.nl/BWBR0007049#Hoofdstuk3
