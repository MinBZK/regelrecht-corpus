  - number: '9.5'
    text: |-
      Indien een partij die is verzonden vanuit een lid-staat en bestemd is voor Nederland of een lid-staat, gaat zij
      vergezeld van:

      a. het gezondheidscertificaat dat op grond van artikel 6, eerste lid, van [richtlijn 88/407/EEG](31988L0407) is
      voorgeschreven, indien het rundersperma betreft, met inachtneming van artikel 2, tweede lid, van [richtlijn nr.
      2003/43/EG](32003L0043);

      b. het gezondheidscertificaat dat op grond van artikel 6, eerste lid, van [richtlijn 90/429/EEG](31990L0429) is
      voorgeschreven, indien het varkenssperma betreft, of

      c. het gezondheidscertificaat dat op grond van artikel 11, tweede lid, vierde gedachtenstreepje, van [richtlijn
      92/65/EEG](31992L0065) is voorgeschreven indien het sperma van schapen, geiten en eenhoevige dieren betreft.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel9.5
  - number: '9.6'
    text: |-
      1 De partij is verzonden vanuit een derde land of een deel van een derde land, dat is vermeld op de lijst, bedoeld
      in:

      a. artikel 8, eerste lid, van [richtlijn 88/407/EEG](31988L0407), indien het rundersperma betreft;

      b. artikel 7, eerste lid, van [richtlijn 90/429/EEG](31990L0429), indien het varkenssperma betreft, of

      c. artikel 17, tweede lid, onderdeel a, van [richtlijn 92/65/EEG](31992L0065), indien het sperma van schapen,
      geiten of eenhoevige dieren betreft, met dien verstande dat, indien vorenbedoelde lijst nog niet is vastgesteld,
      de partij uit geen enkel derde land mag zijn verzonden, indien zij voor Nederland is bestemd, en de partij is
      verzonden vanuit een derde land of een deel van een derde land, van waaruit de lid-staat van bestemming de invoer
      toestaat, indien zij voor een lid-staat is bestemd.

      2 De partij is afkomstig van een spermacentrum, een spermaopslagcentrum of een erkend centrum, erkende instelling,
      erkend instituut of erkend winstation dat is vermeld op de lijst, bedoeld in:

      a. artikel 9, eerste lid, van [richtlijn 88/407/EEG](31988L0407), indien het rundersperma betreft, met inachtneming
      van artikel 2, tweede lid, van [richtlijn nr. 2003/43/EG](32003L0043);

      b. artikel 8, eerste lid, van [richtlijn 90/429/EEG](31990L0429), indien het varkenssperma betreft, of

      c. artikel 17, derde lid, onderdeel a, van [richtlijn 92/65/EEG](31992L0065), indien het sperma van schapen, geiten
      of eenhoevige dieren betreft.

      3 De partij gaat vergezeld van het gezondheidscertificaat dat op grond van:

      a. artikel 11, eerste lid, van [richtlijn 88/407/EEG](31988L0407) is voorgeschreven, indien het rundersperma
      betreft;

      b. artikel 10, eerste lid, van [richtlijn 90/429/EEG](31990L0429) is voorgeschreven, indien het varkenssperma
      betreft, of

      c. artikel 17, tweede lid, onderdeel b, van [richtlijn 92/65/EEG](31992L0065) is voorgeschreven, indien het sperma
      van schapen, geiten of eenhoevige dieren betreft, dan wel, indien vorenbedoeld gezondheidscertificaat nog niet is
      vastgesteld, en:

        - de partij voor Nederland is bestemd, de partij vergezeld gaat van een certificaat dat een verklaring van de
      officiële dierenarts behelst dat het sperma verkregen, behandeld en opgeslagen is op een wijze die tenminste
      gelijkwaardig is aan hetgeen hieromtrent op grond artikel 11, tweede lid, eerste tot en met derde gedachtenstreepje
      van [richtlijn 92/65/EEG](31992L0065) geldt en dat voldaan is aan de voorschriften voor het brengen in Nederland
      van vorenbedoeld sperma uit derde landen op grond van hoofdstuk 2 van de onderhavige regeling;
        - de partij voor een lid-staat is bestemd, de partij vergezeld gaat van het certificaat dat door de lid-staat van
      bestemming wordt geëist.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel9.6
  - number: '9.7'
    text: |-
      Sperma van schapen, geiten of eenhoevige dieren als bedoeld in artikel 13, eerste lid, van [richtlijn 92/65/EEG]
      (31992L0065):

      a. gaat vergezeld van het vervoersdocument, dat op grond van artikel 13, eerste lid, van [richtlijn 92/65/EEG]
      (31992L0065) is voorgeschreven;

      b. is afkomstig van een instelling, instituut of centrum dat is erkend overeenkomstig artikel 9.11 en is bestemd
      voor een door de bevoegde autoriteit van het land van bestemming overeenkomstig bijlage C van [richtlijn 92/65/EEG]
      (31992L0065) erkende instelling, erkend instituut of erkend centrum.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel9.7
  - number: '9.8'
    text: |-
      1 Sperma van schapen, geiten of eenhoevige dieren als bedoeld in artikel 13, eerste lid, van [richtlijn 92/65/
      EEG](31992L0065) gaat vergezeld van het in artikel 13, eerste lid, van [richtlijn 92/65/EEG](31992L0065) bedoelde
      vervoersdocument, dan wel, indien het sperma is verzonden vanuit een derde land en via het grondgebied van een
      lid-staat in Nederland wordt gebracht van de documenten, bedoeld in artikel 10, eerste lid, eerste en tweede
      gedachtenstreepje, van [richtlijn 90/675/EEG](31990L0675).

      2 De documenten, bedoeld in het eerste lid, zijn opgesteld en afgegeven in overeenstemming met de regelgeving van
      de Raad van de Europese Unie of de Commissie van de Europese Gemeenschappen, volledig ingevuld, gedagtekend en
      ondertekend, terwijl de geldigheidsduur ervan niet is verstreken.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel9.8
  - number: '9.9'
    text: |-
      1 Onverminderd [artikel 2.32][ref1] worden, indien rundersperma of varkenssperma bestemd is voor Nederland dan
      wel een lid-staat en ervan wordt verdacht te zijn aangetast door of te zijn besmet met ziektekiemen, teneinde met
      zekerheid vast te stellen of het verdachte sperma al dan niet is aangetast door of besmet met ziektekiemen, door de
      minister de nodige maatregelen genomen die afzondering van het sperma kunnen inhouden.

      2 In het in het eerste lid bedoelde geval staat de minister, voor zover daartegen uit oogpunt van de diergezondheid
      geen bezwaren bestaan, op verzoek van de afzender of diens gemachtigde, toe, dat het sperma wordt teruggezonden,
      met dien verstande dat voor zover het rundersperma of diepgevroren varkenssperma betreft betreft binnen 30 dagen
      en indien het vers varkenssperma betreft binnen 24 uur na het betreffende besluit dient te blijken dat de bevoegde
      instantie van het land van verzending de terugzending toestaat.

      3 Het sperma dient gedurende de in het tweede lid bedoelde periode op een door de minister te bepalen wijze te
      worden opgeslagen.

      4 Indien de terugzending van het sperma niet binnen de in het tweede lid bedoelde tijdsduur wordt toegestaan,
      wordt, indien de minister hiertoe besluit het sperma vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.32
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel9.9
    references:
      - id: ref1
        bwb_id: BWBR0007049
        artikel: '2.32'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '4'
  - number: '9.10'
    text: |-
      1 Een wincentrum of -station wordt door de minister voor de toepassing van deze regeling erkend indien:

      a. uit een door de keuringsdierenarts ingesteld onderzoek is gebleken dat:

      1° het wincentrum of -station voldoet aan bijlage D van richtlijn 92/65/EEG en aan de ter uitvoering van deze
      richtlijn krachtens [artikel 15 van het Besluit eisen dierlijk sperma en spermawincentra][ref1] gestelde regels,
      indien het sperma van eenhoevige dieren betreft, of

      2° het wincentrum of -station voldoet aan bijlage D van richtlijn 92/65/EEG, indien het sperma van schapen en
      geiten betreft, en

      b. de keuringsdierenarts in verband met het door hem uit te oefenen toezicht op de naleving van onderdeel a,
      praktisch in de gelegenheid wordt gesteld de werkzaamheden van de wincentra of -stations te controleren.

      2 Aan een erkend wincentrum of -station wordt in verband met de erkenning een registratienummer toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0010619#Artikel15
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel9.10
    references:
      - id: ref1
        bwb_id: BWBR0010619
        artikel: '15'
  - number: 9.10a
    text: |-
      1 Een runderspermaopslagcentrum wordt door de minister erkend, indien uit een door de keuringsdierenarts ingesteld
      onderzoek is gebleken, dat het runderspermaopslagcentrum voldoet aan Bijlage A, Hoofdstuk I, punt 2, en Hoofdstuk
      II, punt 2, de overige relevante bepalingen van [richtlijn 88/407/EEG](31988L0407) en [artikel 9.10b][ref1].

      2 Een aanvraag tot erkenning wordt ingediend bij de minister.

      3 Bij een aanvraag om erkenning van een runderspermaopslagcentrum worden de volgende gegevens verstrekt:

      a. de naam, het adres en de vestigingsplaats van het runderspermaopslagcentrum;

      b. een plattegrond van het runderspermaopslagcentrum, waarbij de functies van de verschillende ruimten binnen het
      centrum zijn aangegeven;

      c. de naam van de dierenarts van het runderspermaopslagcentrum.

      4 Aan een erkend runderspermaopslagcentrum wordt door de minister in verband met de erkenning een registratienummer
      toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel9.10b
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel9.10a
