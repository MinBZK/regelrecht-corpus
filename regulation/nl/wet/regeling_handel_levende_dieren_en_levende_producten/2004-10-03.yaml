  - number: 2.50d
    text: |-
      1 Een registratie als douane-entrepot, ruimte voor tijdelijke opslag of vrij entrepot als bedoeld in
      [artikel 2.50a][ref1] wordt door de minister verleend nadat uit een door de keuringsdierenarts ingesteld onderzoek
      is gebleken dat aan de voorschriften van [artikel 2.50c, eerste lid][ref2], is voldaan.

      2 In afwijking van het eerste lid is een opslagfaciliteit als bedoeld in dat lid tot en met 31 december 1997
      geregistreerd, indien de eigenaar of exploitant ten genoegen van de minister kan aantonen dat de opslag faciliteit
      op 1 juli 1997 over een geldige vergunning als bedoeld in [artikel 2.50c, eerste lid, onderdeel b][ref3], beschikte
      of in die faciliteit op laatstgenoemde datum partijen als bedoeld in [artikel 2.50a][ref4] waren opgeslagen.

      3 Een erkenning als douane-entrepot of vrij entrepot als bedoeld in [artikel 2.50b][ref5] wordt door de minister
      verleend nadat uit een door de keuringsdierenarts ingesteld onderzoek is gebleken dat aan de voorschriften van
      [artikel 2.50c, derde lid][ref6], is voldaan.

      4 In afwijking van het derde lid is een opslagfaciliteit als bedoeld in dat lid tot en met 31 december 1997
      geregistreerd, indien de eigenaar of exploitant ten genoegen van de minister kan aantonen dat in die faciliteit op
      1 juli 1997 partijen als bedoeld in [artikel 2.50b][ref7] waren opgeslagen.

      5 De aanvraag voor een registratie erkenning wordt ingediend bij de VWA op een daartoe bestemd formulier.

      6 Aan een opslagfaciliteit die op grond van dit artikel is geregistreerd of erkend, wordt een registratie
      onderscheidenlijk erkenningsnummer toegekend.

      7 De minister schort een op grond van het eerste, onderscheidenlijk derde lid verleende registratie of
      erkenning, dan wel een erkenning als bedoeld in het tweede, onderscheidenlijk vierde lid tijdelijk op, indien de
      keuringsdierenarts heeft geconstateerd dat de op de betrokken opslagfaciliteit van toepassing zijnde voorschriften
      van [artikel 2.50c, tweede, vierde of vijfde lid][ref8], niet worden nageleefd.

      8 Indien blijkt dat de exploitant of de eigenaar, dan wel diens vertegenwoordiger van de opslagfaciliteit de
      geconstateerde gebreken na opschorting niet alsnog binnen een daartoe gestelde termijn heeft verholpen, trekt de
      minister de registratie of erkenning in.

      9 De minister trekt een op grond van het eerste, onderscheidenlijk derde lid verleende registratie of erkenning
      in, indien de keuringsdierenarts heeft geconstateerd dat de op de betrokken opslagfaciliteit van toepassing zijnde
      voorschriften van [artikel 2.50c, eerste of derde lid][ref9], niet worden nageleefd.

      10 Opschorting en intrekking als bedoeld in het zevende, onderscheidenlijk negende lid geschiedt niet dan na
      voorafgaande waarschuwing en na het verstrijken van een daarbij te stellen termijn, waarbinnen alsnog aan de
      betrokken voorschriften dient te zijn voldaan.


