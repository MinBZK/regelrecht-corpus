  - number: '2.5'
    text: |-
      Het bewijsstuk, bedoeld in [artikel 2.4, onderdeel a][ref1], wordt slechts afgegeven indien op grond van
      een van Rijkswege ingesteld onderzoek is gebleken dat voldaan wordt aan, voor zover van toepassing, de
      [artikelen 2.6 tot en met 2.15][ref2], en aan:

      a. de [artikelen 3.3][ref3] en [3.4][ref4] van afdeling 2 van hoofdstuk 3, indien het runderen betreft;

      b. de [artikelen 4.3][ref5] en [4.4][ref6] van afdeling 2 van hoofdstuk 4, indien het varkens betreft;

      c. de [artikelen 5.3][ref7] en [5.4][ref8] van afdeling 2 van hoofdstuk 5, indien het eenhoevige dieren betreft;

      d. voor zover van toepassing de [artikelen 6.3][ref9], [6.4][ref10] of [6.5][ref11] van afdeling 2 van hoofdstuk 6,
      indien het pluimvee of broedeieren betreft;

      e. de [artikelen 7.3][ref12] en [7.4][ref13] van afdeling 2 van hoofdstuk 7, indien het schapen of geiten betreft;

      f. [artikel 8.3][ref14] van afdeling 2 van hoofdstuk 8, indien het apen, hoefdieren, bijen, honden, katten, fretten
      en lagomorfen met gezondheidscertificaat betreft;

      g. de [artikelen 9.3][ref15] en [9.4][ref16] van afdeling 2 van hoofdstuk 9, indien het sperma betreft;

      h. de [artikelen 10.3][ref17] of [10.4][ref18] van afdeling 2 van hoofdstuk 10, indien het embryo's betreft;

      i. [artikel 11.3][ref19] van afdeling 2 van hoofdstuk 11, indien het eicellen betreft.


