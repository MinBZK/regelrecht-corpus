  - number: '8.4'
    text: |-
      1 Indien een partij is verzonden vanuit een lid-staat en bestemd is voor Nederland of een lid-staat, gaat zij
      vergezeld van:

      a. het certificaat dat op grond van artikel 5, eerste lid, van [richtlijn 92/65/EEG](31992L0065) is voorgeschreven,
      indien het apen betreft;

      b. het certificaat dat op grond van artikel 6, onderdeel A, eerste lid, subonderdeel f, van [richtlijn 92/65/EEG]
      (31992L0065) is voorgeschreven, indien het hoefdieren betreft;

      c. het gezondheidscertificaat dat op grond van artikel 8, onderdeel b, van [richtlijn 92/65/EEG](31992L0065) is
      voorgeschreven, indien het bijen betreft of

      d. het gezondheidscertificaat dat op grond van artikel 9, tweede lid, van [richtlijn 92/65/EEG](31992L0065) is
      voorgeschreven, indien het lagomorfen betreft.

      2 Het certificaat, bedoeld in het eerste lid, onderdelen a, b en e, alsmede het gezondheidscertificaat, bedoeld in
      het eerste lid, onderdelen c en d, zijn aangevuld met een verklaring van de officiële dierenarts dat voldaan is aan
      [richtlijn 91/628/EEG](31991L0628).

      3 Indien fretten worden verzonden vanuit een lidstaat en bestemd zijn voor Nederland of een lidstaat, voldoen zij
      aan artikel 10, tweede lid, van [richtlijn 92/65/EEG](31992L0065).

      4 Indien honden of katten worden verzonden vanuit een lidstaat en bestemd zijn voor Nederland of een lidstaat,
      voldoen zij aan:

      a. artikel 10, tweede lid, van [richtlijn 92/65/EEG](31992L0065), indien het honden of katten betreft, bestemd voor
      andere lidstaten dan het Verenigd Koninkrijk, Ierland of Zweden;

      b. artikel 10, derde lid, van [richtlijn 92/65/EEG](31992L0065) is, indien het honden of katten betreft, bestemd
      voor het Verenigd Koninkrijk, Ierland of Zweden.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel8.4
  - number: '8.5'
    text: |-
      1 De partij is verzonden vanuit een derde land of een deel van een derde land, dat is vermeld op de lijst, bedoeld
      in artikel 17, tweede lid, onderdeel a, van [richtlijn 92/65/EEG](31992L0065), met dien verstande dat, indien
      vorenbedoelde lijst nog niet is vastgesteld:

      a. het brengen in Nederland van een partij uit een derde land of een deel van een derde land is toegestaan;

      b. de partij bestemd is voor een lid-staat, vanuit een derde land of een deel van een derde land, waaruit de lid-
      staat van bestemming de invoer toestaat.

      2 De partij gaat vergezeld van het gezondheidscertificaat, bedoeld in artikel 17, tweede lid, onderdeel b, van
      [richtlijn 92/65/EEG](31992L0065), dan wel, indien vorenbedoeld gezondheidscertificaat nog niet is vastgesteld, en

      a. de partij bestemd is voor Nederland, van een certificaat dat een verklaring behelst van de officiële dierenarts
      dat voldaan is aan hoofdstuk II van [richtlijn 92/65/EEG](31992L0065) alsmede, indien het apen, hoefdieren, honden,
      katten, fretten en lagomorfen betreft, aan de voorschriften voor het brengen in Nederland van de desbetreffende
      dieren uit derde landen op grond van [hoofdstuk 2][ref1] van de onderhavige regeling;

      b. de partij bestemd is voor een lid-staat, van een certificaat dat een verklaring behelst van de officiële
      dierenarts dat voldaan is aan de voorschriften van de lid-staat van bestemming.

      3 Indien de partij bestemd is voor Finland of Zweden blijkt uit de in het tweede lid, bedoelde certificaten, dat de
      partij tenminste voldoet aan de voorschriften die gelden met betrekking tot de invoer in Finland of Zweden van de
      desbetreffende dieren uit lid-staten.

      4 Het gezondheidscertificaat, bedoeld in de aanhef van het tweede lid, en de certificaten, bedoeld in het tweede
      lid, onderdelen a en b, zijn aangevuld met een verklaring van de officiële dierenarts dat voldaan is aan [richtlijn
      91/628/EEG](31991L0628) en gaan vergezeld van een document waaruit blijkt dat voldaan is aan artikel 11, tweede
      lid, van genoemde richtlijn.

      5 Aan de partij landbouwhuisdieren als bedoeld in artikel 1 van [richtlijn 96/22/EG](31996L0022), zijn geen
      stoffen toegediend die ingevolge artikel 3, onderdeel a, van die richtlijn niet aan landbouwhuisdieren mogen worden
      toegediend, tenzij aan de voorwaarden ingevolge artikel 11 van genoemde richtlijn is voldaan.

      6 Dit artikel is niet van toepassing op het brengen in Nederland van bijen, hommels of vogels uit derde landen.

      7 Ten aanzien van honden, katten of fretten, wordt, onverminderd het eerste, tweede en vierde lid, voldaan aan
      artikel 16, tweede en derde alinea, van [richtlijn 92/65/EEG](31992L0065).


