  - number: '2.4'
    text: |-
      1 De verboden, bedoeld in [artikel 77, eerste lid, van de wet][ref1], en in
      [artikel 2.1, eerste lid, eerste en tweede gedachtenstreepje][ref2], voor zover deze betrekking hebben op het
      anders dan in doorvoer buiten Nederland brengen van dieren of producten, bestemd voor een lid-staat, gelden niet,
      indien:

      a. de dieren en producten vergezeld gaan van het bewijsstuk genoemd in:

        - [artikel 3.2][ref3] van afdeling 2 van hoofdstuk 3, indien het runderen betreft;
        - [artikel 4.2][ref4] van afdeling 2 van hoofdstuk 4, indien het varkens betreft;
        - [artikel 5.2][ref5] van afdeling 2 van hoofdstuk 5, indien het eenhoevige dieren betreft;
        - [artikel 6.2][ref6] van afdeling 2 van hoofdstuk 6, indien het pluimvee en broedeieren betreft;
        - [artikel 7.2][ref7] van afdeling 2 van hoofdstuk 7, indien het schapen of geiten betreft;
        - [artikel 8.2][ref8] van afdeling 2 van hoofdstuk 8, indien het apen, hoefdieren, bijen, honden, katten, fretten
      en lagomorfen met gezondheidscertificaat, betreft;
        - [artikel 9.2][ref9] van afdeling 2 van hoofdstuk 9, indien het sperma betreft;
        - [artikel 10.2][ref10] van afdeling 2 van hoofdstuk 10, indien het embryo's betreft;
        - [artikel 11.2][ref11] van afdeling 2 van hoofdstuk 11, indien het eicellen betreft;

      b. het bewijsstuk, bedoeld in onderdeel a, is opgesteld en afgegeven in overeenstemming met de regelgeving van
      de Raad van de Europese Unie of de Commissie van de Europese Gemeenschappen, volledig is ingevuld, gedagtekend en
      ondertekend, terwijl de geldigheidsduur ervan niet is verstreken.

      2 De in het eerste lid bedoelde bewijsstukken worden afgegeven door de minister.


