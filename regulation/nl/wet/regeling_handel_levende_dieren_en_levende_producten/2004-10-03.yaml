  - number: 8.5g
    text: |-
      Indien tijdens de in [artikel 8.5b, derde lid][ref1], bedoelde quarantaineperiode bij papegaaiachtigen besmetting
      met Chlamydia psittaci wordt vermoed of vastgesteld, : besluit de minister dat alle vogels van de desbetreffende
      partij worden behandeld met een door de minister aan te wijzen methode en is de in [artikel 8b, derde lid][ref2],
      bedoelde quarantaineperiode verlengd met ten minste twee maanden, te rekenen vanaf het laatst vastgestelde of
      vermoede geval van besmetting.


