  - number: 9.10b
    text: |-
      1 Ten behoeve van het toezicht, bedoeld in Bijlage A, Hoofdstuk II, punt 2, van [richtlijn 88/407/EEG](31988L0407),
      voorziet de eigenaar of exploitant van een runderspermaopslagcentrum dan wel diens vertegenwoordiger in het
      opstellen van:

      a. voorschriften inzake:

        - de reiniging en ontsmetting van de apparatuur die in contact komt met sperma;
        - de herkomst van sperma;
        - het opslaan van sperma;
        - de reiniging en ontsmetting van de in het zevende lid bedoelde ruimten en voorzieningen;
        - de toegang tot de in het zevende lid bedoelde ruimten, en
        - de wijze van kleding van het personeel;

      b. een protocol, waarin voor de in het zevende lid bedoelde ruimten en voorzieningen, de werkprocessen
      chronologisch en gedetailleerd beschreven zijn, en

      c. een kwaliteitsbeheersingsplan, waarin ter waarborging van een correcte uitvoering en registratie van de in
      onderdeel b bedoelde processen, de in acht te nemen werkwijzen chronologisch en gedetailleerd zijn vastgelegd.

      2 De eigenaar of exploitant van een runderspermaopslagcentrum dan wel diens vertegenwoordiger zorgt dat het
      personeel zijn werkzaamheden verricht overeenkomstig de wettelijke bepalingen en de daarop gebaseerde interne
      procedures en voorschriften, draagt er zorg voor dat de dierenarts van het centrum toeziet op een correcte
      uitvoering van de werkzaamheden door het personeel en geeft de dierenarts van het centrum de hiervoor benodigde
      instructies.

      3 De in het eerste lid bedoelde voorschriften, procedures en protocollen en de wijzigingen daarvan, behoeven de
      goedkeuring van de minister.

      4 Van permanent toezicht van een dierenarts van het runderspermaopslagcentrum als bedoeld in Bijlage A, Hoofdstuk
      I, punt 2, onderdeel a, van [richtlijn 88/408/EEG](31988L0408) is sprake, indien die dierenarts overeenkomstig de
      krachtens het derde lid goedgekeurde procedures en protocollen erop toeziet, dat de voorschriften van [richtlijn
      88/407/EEG](31988L0407) in acht worden genomen en dat door betrokkenen de krachtens het derde lid goedgekeurde
      procedures en protocollen correct worden uitgevoerd.

      5 Aan Bijlage A, hoofdstuk I, punt 2, onderdeel b, van [richtlijn 88/407/EEG](31988L0407) is voldaan, indien het
      runderspermaopslagcentrum zodanig is ingericht dat vrije toegang tot het runderspermaopslagcentrum niet mogelijk
      is.

      6 De eigenaar of exploitant van een runderspermaopslagcentrum dan wel diens vertegenwoordiger draagt ervoor zorg
      dat het personeel zich kleedt met schone bedrijfskleding voordat het de opslag- of distributieruimte betreedt.

      7 Aan Bijlage A, Hoofdstuk I, punt 2, onderdeel c, van [richtlijn 88/407/EEG](31988L0407) is voldaan, indien het
      runderspermaopslagcentrum de beschikking heeft over:

      a. een voorziening voor de reiniging en ontsmetting van de gebruikte materialen;

      b. een voorziening voor de opslag van kleding alsmede voor de bij de opslag van sperma te gebruiken materialen;

      c. een ruimte voor de opslag en distributie van sperma, die op efficiënte wijze van de overige ruimten binnen het
      runderspermaopslagcentrum is geïsoleerd.

      8 Het runderspermaopslagcentrum beschikt ten behoeve van het toezicht, bedoeld in Bijlage A, Hoofdstuk II, punt
      2, onderdeel a, van [richtlijn 88/407/EEG](31988L0407), over een door de keuringsdierenarts vanuit één plaats op
      het runderspermaopslagcentrum te raadplegen register dat dagelijks wordt bijgehouden en dat zodanig is ingericht,
      dat daaruit te allen tijde de in Bijlage A, Hoofdstuk II, punt 2, onderdeel a, van [richtlijn 88/407/EEG]
      (31988L0407), genoemde gegevens op eenvoudige wijze kunnen worden afgeleid. De gegevens worden bewaard gedurende de
      aanwezigheid van het rundersperma op het runderspermaopslagcentrum en tot drie jaar nadat het rundersperma van het
      runderspermaopslagcentrum is afgevoerd.

      9 Ten behoeve van het toezicht, bedoeld in Bijlage A, Hoofdstuk II, punt 2, onderdeel e, onder vi, van [richtlijn
      88/407/EEG](31988L0407) zijn op de verpakking van elke afzonderlijke dosis sperma onuitwisbaar de navolgende
      gegevens vermeld:

      a. de datum waarop het sperma is verkregen;

      b. het ras en het krachtens het [Besluit identificatie en registratie van dieren][ref1] aan de stier waarvan het
      sperma is gewonnen, toegekende registratienummer en

      c. het registratienummer van het runderspermawincentrum.

      10 Het in een runderspemaopslagcentrum opgeslagen rundersperma voldoet aan Bijlage A, Hoofdstuk I, punt 2, en
      Hoofdstuk II, punt 2, en Bijlage C van [richtlijn 88/407/EEG](31988L0407).


      [ref1]: https://wetten.overheid.nl/BWBR0009019
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel9.10b
