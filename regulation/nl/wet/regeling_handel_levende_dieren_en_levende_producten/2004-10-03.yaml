  - number: '7.4'
    text: |-
      De schapen of geiten behoeven niet in het kader van een programma tot uitroeiing van in bijlage B, rubriek I, van
      [richtlijn 91/68/EEG](31991L0068) genoemde ziekten te worden geruimd.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel7.4
  - number: '7.5'
    text: |-
      De schapen en geiten zijn geïdentificeerd en geregistreerd overeenkomstig het bij of krachtens het Besluit
      identificatie en registratie van dieren bepaalde.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel7.5
  - number: '7.6'
    text: |-
      1 Indien een partij is verzonden vanuit een lid-staat en bestemd is voor Nederland of een lid-staat, gaat zij
      vergezeld van het gezondheidscertificaat dat op grond van artikel 9 van [richtlijn 91/68/EEG](31991L0068) voor de
      desbetreffende soort schapen of geiten is voorgeschreven, aangevuld met een verklaring van de officiële dierenarts
      dat voldaan is aan [richtlijn 91/628/EEG](31991L0628), met dien verstande dat:

      a. voor het binnen Nederland brengen van een partij schapen of geiten, vanuit staten, niet zijnde lid-staten die
      partij zijn bij het EER-Verdrag, op vorenbedoeld gezondheidscertificaat niet behoeft te zijn aangegeven of de
      dieren afkomstig zijn uit of zijn aangekocht in derde landen;

      b. indien de partij bestemd is voor Zweden, in afwachting van de met betrekking tot paratuberculose en
      besmettelijke agalactie gestelde algemene of beperkte aanvullende garanties, bedoeld in artikel 8, tweede lid, van
      [richtlijn 91/68/EEG](31991L0068), uit het gezondheidscertificaat blijkt dat wordt voldaan aan de voorschriften die
      Zweden stelt met betrekking tot paratuberculose en besmettelijke agalactie;

      c. voldaan wordt aan, voor zover van toepassing, artikel 4 ter, derde en vierde lid, artikel 4 quater, derde lid,
      onderdelen a en b, onder ii, van [richtlijn 91/68/EEG](31991L0068) en, indien het slachtschapen of -geiten betreft
      die via een schapen- of geitenverzamelcentrum worden vervoerd, aan artikel 4 quater, derde lid, onderdeel b, onder
      i, van [richtlijn 91/68/EEG](31991L0068);

      d. bijlage VIII, hoofdstuk A, deel I, onder a, van [verordening 999/2001/EG](32001R0999), indien het fokschapen of
      -geiten betreft.

      2 De partij gaat bij reizen van meer dan acht uur vergezeld van een reisschema als bedoeld in artikel 5,
      A, tweede lid, onderdeel b, van [richtlijn 91/628/EEG](31991L0628) dat gedurende de reis gehecht is aan het
      gezondheidscertificaat, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel7.6
  - number: 7.6a
    text: |-
      Indien een partij schapen of geiten is bestemd voor Nederland of voor een lidstaat komt de partij tot de plaats
      van bestemming, respectievelijk tot de plaats waar de partij buiten Nederland wordt gebracht, geen enkel moment in
      aanraking met andere evenhoevige dieren die niet over dezelfde gezondheidsstatus beschikken.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel7.6a
  - number: 7.6b
    text: |-
      Een vervoerder van een partij schapen of geiten voldoet aan artikel 8 quater, eerste tot en met vierde lid, van
      [richtlijn 91/68/EEG](31991L0068).
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel7.6b
  - number: '7.7'
    text: |-
      1 De partij is verzonden vanuit een derde land of een deel van een derde land, dat is vermeld op de lijsten,
      bedoeld in de artikelen 3, eerste lid, en 6, derde lid, onderdeel a, van [richtlijn 72/462/EEG](31972L0462).

      2 De partij gaat vergezeld van het gezondheidscertificaat dat op grond van artikel 11 van [richtlijn 72/462/
      EEG](31972L0462) met inachtneming van bijlage IX, hoofdstuk E, van [verordening 999/2001/EG](32001R0999) voor de
      desbetreffende soort schapen of geiten is voorgeschreven, met dien verstande dat, indien de partij bestemd is voor
      Zweden, uit het gezondheidscertificaat blijkt, dat voldaan is aan de voorschriften die Zweden stelt met betrekking
      tot de invoer van dieren uit landen die tegen mond- en klauwzeer inenten en dat overigens tenminste is voldaan aan
      de voorschriften die gelden met betrekking tot de invoer in Zweden van schapen en geiten uit lid-staten.

      3 Het gezondheidscertificaat, bedoeld in het tweede lid, is aangevuld met een verklaring van de officiële
      dierenarts dat is voldaan aan [richtlijn 91/628/EEG](31991L0628) en gaat vergezeld van:

      a. een document waaruit blijkt dat is voldaan aan artikel 11, tweede lid, eerste gedachtestreepje, van genoemde
      richtlijn;

      b. een reisschema als bedoeld in artikel 11, tweede lid, tweede gedachtestreepje, van genoemde richtlijn.

      4 Aan de partij zijn geen stoffen toegediend die ingevolge artikel 3, onderdeel a, van [richtlijn 96/22/EG]
      (31996L0022) niet aan schapen of geiten mogen worden toegediend, tenzij aan de voorwaarden ingevolge artikel 11 van
      genoemde richtlijn is voldaan.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel7.7
  - number: 7.7a
    text: |-
      [Artikel 3.13b][ref1] is van overeenkomstige toepassing op in Nederland gebrachte fokschapen en -geiten, bestemd
      voor Nederland en van oorsprong uit een land waarvoor ingevolge de Europese regelgeving in verband met mond-
      en klauwzeer beperkende maatregelen gelden ten aanzien van de invoer van schapen en geiten in de Gemeenschap en
      bestemd zijn voor Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel3.13b
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel7.7a
    references:
      - id: ref1
        bwb_id: BWBR0007049
        artikel: 3.13b
        hoofdstuk: '3'
        afdeling: 4a
  - number: '7.8'
    text: |-
      1 In Nederland gebrachte slachtschapen of -geiten, bestemd voor Nederland, worden rechtstreeks vervoerd naar en
      geslacht in een overeenkomstig [artikel 2.64][ref1] toegelaten slachthuis.

      2 In afwijking van het eerste lid mogen slachtschapen of -geiten afkomstig uit een lidstaat passeren via één
      schapen- of geitenverzamelcentrum, mits is voldaan aan artikel 4 quater, derde lid, onderdeel b, onder i, van
      [richtlijn 91/68/EEG](31991L0068).

      3 [Artikel 3.14, tweede en derde lid][ref2], is van overeenkomstige toepassing op slacht-schapen of geiten als
      bedoeld in het eerste lid, van oorsprong uit een land waarvoor ingevolge de Europese regelgeving in verband met
      mond- en klauwzeer beperkende maatregelen gelden ten aanzien van de invoer van schapen en geiten in de Gemeenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.64
