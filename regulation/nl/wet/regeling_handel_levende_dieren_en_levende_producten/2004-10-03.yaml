  - number: 8.5e
    text: |-
      1 Indien tijdens de in [artikel 8.5b, derde lid][ref1], bedoelde quarantaineperiode wordt geconstateerd dat een
      of meer vogels of verklikkerkuikens met aviaire influenza of Newcastle disease besmet zijn, worden alle vogels
      in de quarantainevoorziening of de betreffende quarantaine-eenheid onmiddellijk aan de ambtenaar ter doding en
      vernietiging overgedragen, waarna de quarantainevoorziening respectievelijk de quarantaine-eenheid volledig wordt
      gereinigd en ontsmet.

      2 Ten vroegste 21 dagen na de in het eerste lid bedoelde reiniging en ontsmetting van de quarantaine-eenheid
      worden in het quarantainestation de verklikkerkuikens die zich in de andere quarantaine-eenheden van het
      quarantainestation bevinden bemonsterd ten behoeve van serologisch onderzoek of, indien geen verklikkerkuikens
      worden gebruikt, worden in die quarantaine-eenheden de vogels tussen de zevende en de vijftiende dag na de in
      het eerste lid bedoelde reiniging en ontsmetting ten behoeve van virologisch onderzoek bemonsterd overeenkomstig
      bijlage C, punt 1, onder B, van beschikking 2000/666/EG.

      3 De in het tweede lid bedoelde vogels mogen het quarantainestation uitsluitend verlaten indien uit onderzoek van
      de in dat lid bedoelde monsters een negatief resultaat blijkt.

      4 Tot 21 dagen na de in het eerste lid bedoelde reiniging en ontsmetting worden geen vogels in de
      quarantainevoorziening of quarantaine-eenheid binnengebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel8.5b
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel8.5e
