  - number: '2.58'
    text: |-
      Het verbod, bedoeld in artikel 2.1, tweede lid, eerste en tweede gedachtenstreepje, voor zover dit betrekking heeft
      op het brengen in Nederland van producten uit staten, niet zijnde lid-staten, die partij zijn bij het EER-Verdrag,
      geldt niet, mits voldaan wordt aan artikel 2.59 en:

      a. voor zover de producten bestemd zijn voor Nederland of een lid-staat, aan:

        - afdeling 3 van hoofdstuk 6, indien het broedeieren betreft;
        - afdeling 3 van hoofdstuk 9, indien het rundersperma of varkenssperma betreft;
        - afdeling 4 van hoofdstuk 9, indien het sperma van schapen, geiten of eenhoevige dieren betreft;
        - afdeling 3 van hoofdstuk 10, indien het runderembryo's betreft;
        - afdeling 4 van hoofdstuk 10, indien het embryo's van varkens, schapen, geiten of eenhoevige dieren betreft;
        - afdeling 4 van hoofdstuk 11, indien het eicellen betreft;

      b. voor zover de producten bestemd zijn voor een derde land of een staat, niet zijnde een lid-staat, die partij is
      bij het EER-Verdrag, de betrokken partij vergezeld gaat van een bij die partij behorend origineel document, dat is
      gesteld in de Nederlandse, Duitse, Franse of Engelse taal, waaruit tenminste de oorsprong van de partij alsmede de
      bestemming daarvan kan worden afgeleid.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel2.58
  - number: '2.59'
    text: |-
      Er wordt voldaan aan de artikelen 2.44 tot en met 2.50f, met dien verstande dat:

        - de staten, niet zijnde lid-staten, die partij zijn bij het EER-Verdrag voor de toepassing van deze artikelen
      worden aangemerkt als derde landen;
        - het certificaat, bedoeld in artikel 2.44, derde lid, onderdeel a, het certificaat of document, genoemd in de
      derde afdeling van hoofdstuk 6, de derde of vierde afdeling van de hoofdstukken 9 en 10 dan wel de vierde afdeling
      van hoofdstuk 11 is;
        - het originele document, bedoeld in artikel 2.44, derde lid, onderdeel a, artikel 2.45, artikel 2.47 en artikel
      2.49, derde lid, het document, genoemd in artikel 2.58, onderdeel b, is;
        - de zoötechnische documenten, bedoeld in artikel 2.44, derde lid, onderdeel b, de zoötechnische documenten zijn
      die bij of krachtens het Fokkerijbesluit zijn voorgeschreven voor het brengen in Nederland van producten van
      raszuivere dieren en hybride varkens, die zijn verzonden vanuit een lid-staat, dan wel indien het sperma van
      schapen, geiten of eenhoevige dieren, embryo's van varkens, schapen, geiten of eenhoevige dieren dan wel eicellen
      betreft, de zoötechnische documenten die bij of krachtens het Fokkerijbesluit zijn voorgeschreven voor het brengen
      in Nederland van producten van raszuivere dieren die via Nederland voor het eerst in de gebieden waarop het Verdrag
      betreffende de Europese Unie van toepassing is worden gebracht, en
        - bij aankomst op de inspectiepost, slechts op verzoek van de keuringsdierenarts de producten aan hem ten onderzoek
      worden aangeboden en het in het tweede gedachtenstreepje bedoelde certificaat of document, het in artikel 2.58,
      onderdeel b, genoemde document alsmede de in het vierde gedachtenstreepje bedoelde zoötechnische documenten aan hem
      worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel2.59
  - number: 2.59a
    text: |-
      Het verbod, bedoeld in [artikel 2.1, tweede lid, vijfde gedachtenstreepje][ref1], voorzover dit betrekking heeft op
      het brengen in Nederland van producten, genoemd in artikel 1, eerste alinea van [richtlijn 92/65/EEG](31992L0065),
      niet zijnde sperma, eicellen, embryo's en broedeieren, uit staten, niet zijnde lid-staten, die partij zijn bij het
      EER-Verdrag en de producten zijn bestemd voor een lid-staat, een andere staat die partij is bij het EER-Verdrag dan
      wel een derde land, geldt niet, mits de betrokken partij voldoet aan de voorschriften van het land van bestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel2.59a
