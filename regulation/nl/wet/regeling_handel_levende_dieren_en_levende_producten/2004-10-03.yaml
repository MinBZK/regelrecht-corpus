  - number: '2.62'
    text: |-
      1 De minister houdt een register van handelaren bij. Hij gebruikt daartoe een eigen register dan wel maakt daartoe
      gebruik van een door een andere instantie beheerd register.

      2 Een handelaar wordt door de minister slechts ingeschreven in het in het eerste lid bedoelde eigen register en
      de inschrijving van een handelaar in het in het eerste lid bedoelde register, dat door een andere instantie wordt
      beheerd, wordt voor de toepassing van deze regeling slechts erkend:

      a. indien hij een administratie voert waarin tenminste de leveringen van dieren of producten en de verdere
      bestemming hiervan zijn vermeld en alle op die dieren of producten betrekking hebbende bescheiden zijn opgenomen;

      b. indien hij de vorenbedoelde administratie tenminste drie jaren bewaart;

      c. hij er zorg voor draagt dat elke partij vergezeld gaat van de voorgeschreven certificaten of documenten en dat
      de dieren, waarvan hij blijkens de daarbij behorende certificaten of documenten niet tevens de ontvanger is, bij de
      afvoer van zijn bedrijf en tijdens het vervoer overeenkomstig deze regeling zijn geïdentificeerd;

      d. meldt nalatigheden en onregelmatigheden met betrekking tot een levering van een partij onmiddellijk aan de VWA
      en houdt de betrokken dieren of producten in afzondering totdat door de minister, zonodig na een onderzoek van de
      dieren of producten is beslist.

      3 Indien een handelaar zich niet aan de in het tweede lid bedoelde voorschriften houdt, kan de directeur van de
      rijksdienst beslissen dat zijn inschrijving in het in het eerste lid bedoelde eigen register wordt doorgehaald dan
      wel de inschrijving in het in het eerste lid bedoelde register, dat door een andere instantie wordt beheerd, niet
      wordt erkend.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel2.62
  - number: '2.63'
    text: |-
      1 Een verzamelcentrum voor vee, niet zijnde runderen, varkens, schapen of geiten wordt door de minister erkend,
      indien wordt voldaan aan de volgende eisen:

      a. het verzamelcentrum maakt geen deel uit van onderscheidenlijk:

        - een bedrijf waar vee is gehuisvest, met dien verstande dat het verzamelcentrum niet zodanig is gelegen bij een
      of meer bedrijven waar vee is gehuisvest, dat door het ontbreken van een afscheiding, naar het oordeel van de
      directeur minister gevaar voor besmetting ontstaat;
        - een slachthuis;

      b. het verzamelcentrum is gemakkelijk bereikbaar via verharde wegen;

      c. het terrein waarop het in- en uitladen van het vee plaatsvindt is zodanig bestraat of op een andere wijze van
      een verharde terreinbedekking voorzien, dat voldoende reiniging en ontsmetting kan plaatsvinden;

      d. het in- en uitlaadterrein heeft een dusdanige oppervlakte dat de los- en laadwerkzaamheden ongehinderd kunnen
      plaatsvinden;

      e. op het terrein is een reinigings- en ontsmettingsinrichting aanwezig welke water levert van voldoende druk voor
      de reiniging en ontsmetting van vervoermiddelen;

      f. de in- en uitlaadruimten zijn zodanig van elkaar gescheiden dat contact tussen aankomend en vertrekkend vee
      is uitgesloten;

      g. op verzamelcentra, waarvan tegelijkertijd meerdere veesoorten worden uitgevoerd, zijn dusdanige voorzieningen
      aanwezig dat deze veesoorten gescheiden in ruimte opgesteld kunnen worden;

      h. van de totale op het verzamelcentrum aanwezige stalruimte is minimaal 50% voorzien van een gesloten dakbedekking
      en windkerende zijwanden;

      i. het vloeroppervlak van de stalruimte en de wanden van de binnenstalruimte bestaan, voor zover niet hoger dan 2,5
      meter boven het vloeroppervlak geheel, en voor zover hoger dan 2,5 meter boven het vloeroppervlak tot een hoogte
      van 2,5 meter, uit voor water ondoordringbaar materiaal, bij voorkeur uit beton of metselsteen. Het gebruik van
      houten stalafscheidingen is niet toegestaan;

      j. in de onmiddellijke nabijheid van de uitlaadruimte is een aparte afsluitbare stalling voor afgekeurde dieren
      aanwezig;

      k. op het verzamelcentrum is een geschikte voorziening aanwezig voor de opslag van mest;

      l. in de nabijheid van de stalruimte is een afsluitbare voorziening aanwezig voor de opslag van kadavers;

      m. het in- en uitladen kan efficiënt en ongestoord plaatsvinden door middel van een deugdelijke laadbrug, lift
      of loopbrug;

      n. de binnenstalruimte is zodanig verlicht door middel van kunst- of daglicht dat de keuringshandelingen ongestoord
      kunnen plaatsvinden;

      o. op het verzamelcentrum is ten behoeve van de keuringsambtenaar een afsluitbare ruimte aanwezig, ingericht met
      een bureau of tafel alsmede voorzien van een telefoon;

      p. het verzamelcentrum wordt telkens na gebruik, gereinigd en ontsmet overeenkomstig de door de minister gestelde
      voorwaarden.

      2 Een verzamelcentrum voor runderen wordt door de Minister erkend indien voldaan is aan het geen hieromtrent in
      artikel 9b van de Regeling betreffende het bijeenbrengen van dieren 2000 is gesteld.

      3 Een verzamelcentrum voor varkens wordt door de minister erkend indien voldaan is aan hetgeen hieromtrent in
      artikel 5 van de Regeling betreffende het bijeenbrengen van dieren 2000 is gesteld.

      4 Een verzamelcentrum voor schapen of geiten wordt door de Minister erkend indien voldaan wordt aan hetgeen
      hieromtrent in artikel 91 van de Regeling betreffende het bijeenbrengen van dieren 2000 is gesteld.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel2.63
  - number: '2.64'
    text: |-
      1 Een slachthuis als bedoeld in de [artikelen 3.14][ref1] van [hoofdstuk 3][ref2], 4.9 van [hoofdstuk 4][ref3],
      5.10 van [hoofdstuk 5][ref4] en 7.8 van [hoofdstuk 7][ref5], wordt door de minister slechts toegelaten indien:

      a. het voorzien is van een afsluitbare gelegenheid tot opstalling van de slachtdieren met een zodanige capaciteit,
      dat de voor het slachthuis bestemde partijen in Nederland gebrachte slachtdieren daarin geheel gestald en verzorgd
      kunnen worden;

      b. het voorzien is van voldoende voorzieningen voor het reinigen en ontsmetten van vervoermiddelen;

      c. het zodanig is ingericht en geoutilleerd, dat gewaarborgd is dat de in onderdeel a bedoelde dieren het
      terrein van het slachthuis niet meer verlaten en alle dieren zo spoedig mogelijk doch uiterlijk binnen 5 dagen
      – zaterdagen, zondagen en officieel erkende feestdagen niet meegerekend – na aankomst aldaar op hygiënisch
      verantwoorde wijze worden geslacht, en

      d. het onder zodanig toezicht van ambtenaren als bedoeld in artikel 114, eerste of tweede lid, van de wet staat,
      dat gewaarborgd is dat uitlading, stalling en slachting van de in onderdeel a bedoelde dieren steeds onder dat
      toezicht plaatsvinden.

      2 De toelating, bedoeld in het eerste lid, wordt verleend voor runderen, varkens, eenhoevige dieren of schapen en
      geiten dan wel voor meer van de vorenbedoelde veesoorten.

      3 De toelating, bedoeld in het eerste lid, kan worden ingetrokken indien:

      a. het slachthuis niet meer voldoet aan het eerste lid;

      b. naar het slachthuis vervoerde slachtdieren, bedoeld in het eerste lid, onderdeel a, aldaar niet binnen de in dat
      lid, onderdeel c, genoemde termijn zijn geslacht.

      4 De toelating van de slachthuizen als bedoeld in de Regeling toelating slachthuizen 1993 geldt als een toelating
      als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel3.14
