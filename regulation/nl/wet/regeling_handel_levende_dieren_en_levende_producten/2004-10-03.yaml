  - number: '4.2'
    text: |-
      Als bewijsstuk, bedoeld in [artikel 2.4, onderdeel a][ref1], wordt met het oog op het anders dan in doorvoer
      buiten Nederland brengen van varkens, bestemd voor een lid-staat, vastgesteld het gezondheidscertificaat dat op
      grond van artikel 5, eerste lid, van [richtlijn 64/432/EEG](31964L0432) voor de desbetreffende soort runderen
      is voorgeschreven, met dien verstande dat ter zake van het gezondheidscertificaat voor fok- en gebruiksvarkens
      de verklaring in paragraaf V, onderdeel b, eerste gedachtenstreepje, van bijlage F, van [richtlijn 64/432/EEG]
      (31964L0432) vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0007049
        artikel: '2.4'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: '4.3'
    text: |-
      Op grond van het onderzoek, bedoeld in [artikel 2.5][ref1], is gebleken dat voldaan wordt aan:

      a. artikel 3, tweede lid, onderdelen a, b en d, van [richtlijn 64/432/EEG](31964L0432);

      b. artikel 4, eerste en tweede lid, van [richtlijn 64/432/EEG](31964L0432);

      c. artikel 5, eerste lid, van [richtlijn 64/432/EEG](31964L0432) en

      d. artikel 6, eerste lid, van [richtlijn 64/432/EEG](31964L0432), indien het fok- of gebruiksvarkens betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.5
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0007049
        artikel: '2.5'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: '4.4'
    text: |-
      Onverminderd [artikel 4.3][ref1]. is op grond van het onderzoek, bedoeld in [artikel 2.5][ref2], gebleken dat:

      a. indien de varkens zijn aangekocht op een verzamelcentrum:

        - de varkens voldoen aan artikel 11, eerste lid, onderdeel e, van [richtlijn 64/432/EEG](31964L0432);
        - hiervan aantekening is gemaakt op het gezondheidscertificaat, bedoeld in [artikel 4.2][ref3].

      b. indien de varkens zijn aangekocht bij een handelaar:

        - deze handelaar voldoet aan [artikel 4.10][ref4] en uit dien hoofde overeenkomstig [artikel 4.10][ref5] is erkend;
        - de varkens voldoen aan artikel 13, eerste lid, onderdeel a, van [richtlijn 64/432/EEG](31964L0432);
        - hiervan aantekening is gemaakt op het gezondheidscertificaat, bedoeld in [artikel 4.2][ref6].

      c. indien de vervoersafstand meer dan 50 km bedraagt:

        - de varkens worden vervoerd door een op grond van artikel 8 van het Besluit dierenvervoer erkende vervoerder;
        - hiervan aantekening is gemaakt op het gezondheidscertificaat, bedoeld in [artikel 4.2][ref7].

      d. indien de varkens zijn aangekocht op een bedrijf waarop fok- en gebruiksvarkens zijn binnengebracht afkomstig
      uit derde landen, deze fok- en gebruiksvarkens overeenkomstig [artikel 4.8b, eerste lid][ref8], aan het beslag zijn
      toegevoegd dan wel gedurende een periode van 30 dagen te rekenen vanaf de dag waarop de fok- en gebruiksvarkens op
      het bedrijf zijn binnengebracht overeenkomstig [artikel 4.8b, tweede lid][ref9], afgezonderd worden gehouden van de
      op dat bedrijf aanwezige dieren.

      e. de varkens vergezeld gaan van de verklaring, bedoeld in
      [artikel 2 van de Regeling bedrijfscontrole dierziekten 1993][ref10];

      f. de varkens niet worden vervoerd in een vervoermiddel, als bedoeld in artikel 1, eerste lid, onderdeel a, van
      de Regeling inzake hygiënevoorschriften besmettelijke dierziekten 2000, waarmee kennelijk varkens zijn of zullen
      worden vervoerd, tenzij dit vervoermiddel voldoet aan genoemde regeling;

      g. in voorkomend geval, de varkens voldoen aan de met betrekking tot de in bijlage E (II) van [richtlijn
      64/432/EEG](31964L0432) vermelde ziekten gestelde aanvullende garanties, bedoeld in artikel 9, tweede lid,
      en in Artikel 10, tweede lid, van [richtlijn 64/432/EEG](31964L0432) en hiervan aantekening is gemaakt op het
      gezondheidscertificaat, bedoeld in [artikel 3.2][ref11].;


