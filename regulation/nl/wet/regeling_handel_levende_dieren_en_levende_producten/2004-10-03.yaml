        artikel: '3.7'
        hoofdstuk: '3'
        afdeling: '3'
  - number: '3.7'
    text: |-
      1 Indien een partij is bestemd voor Nederland of voor een Lidstaat komt de partij tot de plaats van bestemming
      respectievelijk tot de plaats waar de partij buiten Nederland wordt gebracht niet in aanraking met andere
      evenhoevige dieren die niet over dezelfde gezondheidsstatus beschikken. Fok- en gebruiksrunderen komen tot de
      plaats van bestemming respectievelijk tot de plaats waar zij de buiten Nederland worden gebracht eveneens niet in
      aanraking met slachtrunderen.

      2 De in het eerste lid bedoelde partij wordt vervoerd in een vervoermiddel dat voldoet aan artikel 4, tweede lid,
      van [richtlijn 64/432/EEG](31964L0432).

      3 Indien een partij via een verzamelcentrum in Nederland wordt binnengebracht, vindt zulks plaats in een
      overeenkomstig [artikel 2.63, tweede lid][ref1], erkend verzamelcentrum.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.63
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0007049
        artikel: '2.63'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '8'
  - number: 3.7a
    text: |-
      1 Indien een partij is verzonden vanuit een lidstaat en bestemd is voor Nederland gaan de runderen tot en met de
      ontvangst door de ontvanger vergezeld van een paspoort.

      2 Indien een partij is verzonden vanuit een lidstaat en bestemd is voor een lidstaat gaan de runderen tijdens het
      vervoer naar de plaats waar zij weer buiten Nederland worden gebracht, vergezeld van een paspoort.

      3 De ontvanger plaatst zijn handtekening in het paspoort en zendt het paspoort, in voorkomend geval nadat het
      onderzoek, bedoeld in [artikel 2.26, vierde lid][ref1] heeft plaatsgevonden, in overeenkomstig het krachtens het
      [Besluit identificatie en registratie van dieren][ref2] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.26
      [ref2]: https://wetten.overheid.nl/BWBR0009019
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel3.7a
    references:
      - id: ref1
        bwb_id: BWBR0007049
        artikel: '2.26'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0009019
  - number: '3.13'
    text: |-
      1 De partij is verzonden vanuit een derde land of een deel van een derde land, dat is vermeld op de lijsten,
      bedoeld in de artikelen 3, eerste lid, en 6, derde lid, onderdeel a, van [richtlijn 72/462/EEG](31972L0462).

      2 De partij gaat vergezeld van het gezondheidscertificaat dat op grond van artikel 11 van [richtlijn 72/462/EEG]
      (31972L0462) voor de desbetreffende soort runderen is voorgeschreven, met dien verstande dat, indien de partij
      bestemd is voor Zweden, uit het gezondheidscertificaat blijkt dat voldaan is aan de voorschriften die Zweden stelt
      met betrekking tot de invoer van dieren uit landen die tegen mond- en klauwzeer inenten en dat overigens tenminste
      is voldaan aan de voorschriften die gelden met betrekking tot de invoer in Zweden van runderen uit lid-staten.

      3 Het gezondheidscertificaat, bedoeld in het tweede lid, is aangevuld met een verklaring van de officiële
      dierenarts dat voldaan is aan [richtlijn 91/628/EEG](31991L0628) en gaat vergezeld van:

      a. een document waaruit blijkt dat voldaan is aan artikel 11, tweede lid, eerste gedachtenstreepje, van genoemde
      richtlijn;

      b. een reisschema als bedoeld in artikel 11, tweede lid, tweede gedachtestreepje, van genoemde richtlijn.

      4 De runderen zijn niet afkomstig uit Zwitserland.

      5 Aan de runderen zijn geen stoffen toegediend die ingevolge artikel 3, onderdeel a, van [richtlijn 96/22/EG]
      (31996L0022) niet aan runderen mogen worden toegediend, tenzij aan de voorwaarden ingevolge artikel 11 van genoemde
      richtlijn is voldaan.

      6 Onverminderd het tweede lid is met betrekking tot de partij voldaan aan bijlage XI, hoofdstuk D, punt 2 of 3, van
      [verordening 999/2001/EG](32001R0999).
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel3.13
  - number: 3.13a
    text: |-
      Het is verboden runderen die afkomstig zijn uit Zwitserland en in Nederland zijn gebracht, van het bedrijf waar
      zij zich bevinden naar elders te vervoeren, tenzij met toestemming van de minister naar een door hem aangewezen
      slachthuis. De minister kan aan een zodanige toestemming voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel3.13a
  - number: 3.13b
    text: |-
      1 In Nederland gebrachte fok- en gebruiksrunderen, bestemd voor Nederland en van oorsprong uit een land waarvoor
      ingevolge de Europese regelgeving in verband met mond- en klauwzeer beperkende maatregelen gelden ten aanzien
      van de invoer van runderen in de Gemeenschap dan wel van oorsprong uit een land waarvoor op basis van Beschikking
      nr. 98/372/EG (PbEG L170) garanties worden gesteld ten aanzien van mond- en klauwzeer, worden rechtstreeks
      en gescheiden van andere dieren vervoerd naar een leegstaand bedrijf dat geschikt is voor het houden van de
      betrokken runderen, dan wel indien een dergelijk bedrijf in redelijkheid niet beschikbaar is, naar het bedrijf
      van bestemming.

      2 Bij aankomst op het bedrijf worden de in het eerste lid bedoelde runderen terstond op zodanige wijze afgezonderd
      gehouden van reeds op het bedrijf aanwezige dieren dat ieder contact tussen de betrokken runderen en de overige
      dieren is uitgesloten.

      3 De in het eerste lid bedoelde runderen worden door een keuringsdierenarts bemonsterd.

      4 De betrokken runderen mogen, zonder toestemming van de minister, niet van het bedrijf worden afgevoerd alvorens
      de uitslag van het onderzoek van de monsters door de minister is medegedeeld.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel3.13b
  - number: 3.13c
    text: |-
      1 Onverminderd het bepaalde in de [artikelen 3.13a][ref1] en [3.13b][ref2] worden in Nederland gebrachte fok- en
      gebruiksrunderen, bestemd voor Nederland, rechtstreeks naar het bedrijf van bestemming vervoerd en aan het beslag
      op het bedrijf van bestemming toegevoegd nadat de voor dat bedrijf verantwoordelijke dierenarts heeft geconstateerd
      dat deze runderen geen bedreiging vormen voor de gezondheidsstatus van dat bedrijf.

      2 Behoudens wanneer de in het eerste lid bedoelde runderen bij aankomst op het bedrijf van bestemming terstond
      ten genoege van de officiële dierenarts op zodanige wijze afgezonderd worden gehouden van reeds op dat bedrijf
      aanwezige dieren zodat ieder contact tussen de betrokken runderen en de overige op dat bedrijf aanwezige dieren is
      uitgesloten, mogen, voorzover de runderen afkomstig zijn uit een derde land gedurende een periode van 30 dagen en
      voorzover de runderen niet afkomstig zijn uit een derde land gedurende een periode van 21 dagen, te rekenen vanaf
      de dag waarop de in het eerste lid bedoelde runderen op het bedrijf van bestemming zijn binnengebracht, geen dieren
      van het bedrijf worden afgevoerd, behoudens de rechtstreekse afvoer naar een in Nederland gelegen slachthuis.

      3 In Nederland gebrachte fok- en gebruiksrunderen, bestemd voor een Lidstaat, worden zo snel
      mogelijk naar de Lidstaat van bestemming vervoerd en gaan vergezeld van de documenten, bedoeld in
      [artikel 2.22, vierde lid, onderdeel a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel3.13a
      [ref2]: https://wetten.overheid.nl/BWBR0007049#Artikel3.13b
      [ref3]: https://wetten.overheid.nl/BWBR0007049#Artikel2.22
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel3.13c
