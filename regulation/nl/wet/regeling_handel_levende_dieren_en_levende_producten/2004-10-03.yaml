  - number: '2.57'
    text: |-
      Er wordt voldaan aan de [artikelen 2.35 tot en met 2.41][ref1], met dien verstande dat:

        - de staten, niet zijnde lid-staten, die partij zijn bij het EER-Verdrag voor de toepassing van deze artikelen
      worden aangemerkt als derde landen;
        - het certificaat, bedoeld in [artikel 2.35, derde lid, onderdeel a, en vierde lid][ref2],
      en in [artikel 2.41, eerste lid][ref3], het certificaat of document, genoemd in de
      [derde afdeling van de hoofdstukken 3 tot en met 7][ref4] en in de [vierde afdeling van hoofdstuk 8][ref5] is, met
      dien verstande dat dit certificaat of document niet behoeft te zijn aangevuld met een verklaring van de officiële
      dierenarts dat voldaan is aan [richtlijn 91/628/EEG](31991L0628);
        - de zoötechnische documenten, bedoeld in [artikel 2.35, derde lid, onderdeel b, en vierde lid][ref6], en in
      [artikel 2.41, eerste lid][ref7], de zoötechnische documenten zijn die bij of krachtens het [Fokkerijbesluit][ref8]
      zijn voorgeschreven voor het brengen in Nederland van raszuivere dieren of hybride varkens die zijn verzonden
      vanuit een lid-staat, dan wel, indien het apen, hoefdieren, bijen, honden, katten, lagomorfen, vogels, fretten,
      nertsen en vossen betreft, de zoötechnische documenten zijn die bij of krachtens het [Fokkerijbesluit][ref9] zijn
      voorgeschreven voor het brengen in Nederland van raszuivere dieren die via Nederland voor het eerst in de gebieden
      waarvoor het Verdrag betreffende de Europese Unie van toepassing is worden gebracht, en
        - bij aankomst op de inspectiepost, slechts op verzoek van de keuringsdierenarts de dieren aan hem ten onderzoek
      worden aangeboden en het in het tweede gedachtenstreepje bedoelde certificaat of document, alsmede de in het derde
      gedachtenstreepje bedoelde zoötechnische documenten aan hem worden overgelegd.


