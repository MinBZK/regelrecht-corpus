  - number: '4.10'
    text: |-
      Een handelaar wordt door de minister slechts erkend indien voldaan wordt aan artikel 13, eerste lid, onderdelen a
      en b van [richtlijn 64/432/EEG](31964L0432).
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel4.10
  - number: '5.1'
    text: |-
      Onverminderd [artikel 1.1][ref1], wordt in dit hoofdstuk verstaan onder:




              *richtlijn 90/426/EEG:*


              richtlijn van de Raad van de Europese Gemeenschappen van 26 juni 1990 tot vaststelling van
      veterinairrechtelijke voorschriften voor het verkeer van paardachtigen en de invoer van paardachtigen uit derde
      landen (PbEG L 224);




              *richtlijn 90/427/EEG:*


              richtlijn van de Raad van de Europese Gemeenschappen van 26 juni 1990 tot vaststelling van zoötechnische en
      genealogische voorschriften voor het intracommunautaire handelsverkeer in paardachtigen (PbEG L 224);




              *beschikking 93/623/EEG:*


              beschikking (EEG) nr. 93/623 van de Commissie van de Europese Gemeenschappen van 20 oktober 1993 (PbEG
      1993, L 298) tot vaststelling van het identificatiedocument (paspoort) dat geregistreerde paardachtigen moet
      vergezellen;



            beschikking 2000/68/EG:

              beschikking (EG) nr. 2000/68 van de Commissie van de Europese Gemeenschappen van 22 december 1999 (PbEG
      2000, L 23) houdende wijziging van Beschikking 93/623/EEG en tot vaststelling van de identificatievoorschriften
      voor als fok- en gebruiksdier gehouden paardachtigen;




              *geregistreerde paarden:*


              eenhoevige dieren die in een stamboek zijn ingeschreven, dan wel in een stamboek zijn geregistreerd of
      in aanmerking komen om te worden ingeschreven overeenkomstig de krachtens artikel 4, tweede lid, onderdeel b,
      van [richtlijn 90/427/EEG](31990L0427) vastgestelde voorschriften en die zijn geïdentificeerd door middel van een
      hippisch paspoort;




              *slachtpaarden:*


              eenhoevige dieren die zijn bestemd om rechtstreeks dan wel via een verzamelcentrum naar een slachthuis te
      worden gebracht om daar te worden geslacht;




              *fok- en gebruikspaarden:*


              eenhoevige dieren, niet zijnde geregistreerde paarden en slachtpaarden;




              *identificatiedocument:*


              document als bedoeld in beschikking 93/623/EEG en beschikking 2000/68/EG ten behoeve van de identificatie
      van respectievelijk geregistreerde paarden en fok- en gebruikspaarden, dat is afgegeven door het bestuur van het
      Productschap Vee en Vlees op grond van artikel 6 van de Verordening identificatie en registratie paardachtigen
      (PVV) 2004.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0007049
        artikel: '1.1'
        hoofdstuk: '1'
  - number: '5.2'
    text: |-
      1 Als bewijsstuk, bedoeld in [artikel 2.4, onderdeel a][ref1], wordt met het oog op het anders dan in doorvoer
      buiten Nederland brengen van eenhoevige dieren, bestemd voor een lid-staat, vastgesteld:

      a. het identificatiedocument, vergezeld van de verklaring met betrekking tot de gezondheid, bedoeld in bijlage B
      van [richtlijn 90/426](31990L0426) indien het geregistreerde paarden betreft;

      b. het identificatiedocument vergezeld van het gezondheidscertificaat bedoeld in bijlage C van [richtlijn 90/426/
      EEG](31990L0426) indien het fok en gebruikspaarden betreft;

      c. het gezondheidscertificaat bedoeld in bijlage C van [richtlijn 90/426/EEG](31990L0426) indien het slachtpaarden
      betreft;

      2 Indien aan eenhoevige dieren diergeneesmiddelen zijn toegediend die allyltrenbolon of ß-agonisten bevatten en de
      dieren binnen de wachttermijn worden verhandeld, zijn op de documenten bedoeld in het eerste lid, aard en datum van
      de behandeling vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel5.2
    references:
