  - number: '6.3'
    text: |-
      1 Op grond van het onderzoek, bedoeld in [artikel 2.5][ref1], is gebleken dat:

      a. voldaan wordt aan artikel 7 van [richtlijn 90/539/EEG](31990L0539), indien het broedeieren betreft;

      b. voldaan wordt aan artikel 8 van [richtlijn 90/539/EEG](31990L0539), indien het eendagskuikens betreft;

      c. voldaan wordt aan artikel 9 van [richtlijn 90/539/EEG](31990L0539), indien het fok- en gebruikspluimvee betreft;

      d. voldaan wordt aan artikel 10 van [richtlijn 90/539/EEG](31990L0539), indien het slachtpluimvee betreft;

      e. de broedeieren, de eendagskuikens en het fok- en gebruikspluimvee afkomstig zijn van een op grond van
      [artikel 6.8][ref2] erkende inrichting die voldoet aan artikel 6, eerste lid, onderdelen b en c van [richtlijn
      90/539/EEG](31990L0539);

      f. de broedeieren, de eendagskuikens en het fok- en gebruikspluimvee voldoen aan artikel 6, tweede lid, van
      [richtlijn 90/539/EEG](31990L0539);

      g. het vervoer van het pluimvee of de broedeieren plaatsvindt overeenkomstig de artikelen 15 en 16 van [richtlijn
      90/539/EEG](31990L0539);

      h. indien het vervoer van het pluimvee of de broedeieren plaatsvindt naar lid-staten of gebieden van lid-staten
      waarvan de status ten aanzien van de ziekte van Newcastle op grond van artikel 12, tweede lid, van [richtlijn
      90/539/EEG](31990L0539) door de Commissie van de Europese Gemeenschappen is vastgesteld, is voldaan aan artikel 12,
      eerste lid, van [richtlijn 90/539/EEG](31990L0539);

      i. in voorkomend geval, is voldaan aan de krachtens de artikelen 13 en 14 van [richtlijn 90/539/EEG](31990L0539)
      gestelde voorschriften, met dien verstande dat indien de partij bestemd is voor Zweden, in afwachting van de met
      betrekking tot infectieuze bronchitis gestelde algemene of beperkte aanvullende garanties, bedoeld in artikel 13,
      tweede lid, van [richtlijn 90/539/EEG](31990L0539) en van de met betrekking tot infectieuze rhinotracheïtis van
      de kalkoen, swollen head-syndrome, infectieuze laryngotrageïtis (ILT), EDS 76 en vogelpokken gestelde algemene of
      beperkte aanvullende garanties, bedoeld in artikel 14, tweede lid, van laatstgenoemde richtlijn, wordt voldaan aan
      de voorschriften die Zweden stelt met betrekking tot genoemde ziekten.

      2 Het eerste lid is niet van toepassing wanneer het een partij pluimvee of broedeieren, niet zijnde loopvogels of
      broedeieren daarvan, betreft van minder dan twintig stuks.

      3 Onverminderd het eerste lid, is op grond van het onderzoek, bedoeld in [artikel 2.5][ref3] gebleken dat, indien
      het pluimvee bestemd is voor Finland of Zweden, voldaan wordt aan de op grond van de artikelen 9bis en 9ter van
      [richtlijn 90/539/EEG](31990L0539) vastgestelde algemene of beperkte aanvullende garanties en dat slachtpluimvee,
      wat salmonella betreft en voor serotypen waar pluimvee vatbaar voor is, in de inrichting van oorsprong is
      onderworpen aan een steekproefsgewijze microbiologische test volgens de voorschriften, bedoeld in artikel 10ter,
      eerste lid, van [richtlijn 90/539/EEG](31990L0539) en met inachtneming van het derde lid van voornoemd artikel.


