  - number: '8.1'
    text: |-
      Onverminderd artikel 1.1 wordt, voor zover niet uitdrukkelijk anders is bepaald, in dit hoofdstuk verstaan onder:




              *beschikking 79/542/EEG:*


              beschikking van de Raad van de Europese Gemeenschappen van 21 december 1979 tot vaststelling van een lijst
      van derde landen waaruit de Lid-Staten de invoer van runderen, varkens, paardachtigen, schapen en geiten, vers
      vlees en vleesproducten toestaan (PbEG L 146);
              instelling,



            beschikking 2000/666/EG:

              beschikking 2000/666/EG van de Commissie van de Europese Gemeenschappen van 16 oktober 2000 tot
      vaststelling van de veterinairrechtelijke voorschriften en de voorschriften inzake veterinaire certificering voor
      de invoer van vogels, met uitzondering van pluimvee, alsmede van quarantainevoorschriften;



            beschikking (EG) nr. 2003/881:

              beschikking (EG) nr. 2003/881 van de Commissie van de Europese Gemeenschappen van 11 december 2003 (PbEU L
      328) betreffende de veterinairrechtelijke voorschriften en de certificeringsvoorwaarden voor de invoer van bijen en
      hommels (Apis mellifera & Bombus spp.) uit bepaalde derde landen en tot intrekking van beschikking 2000/462/EG;




              *instituut of centrum:*


              instelling, instituut of centrum als bedoeld in artikel 2, eerste lid, onderdeel c, van [richtlijn 92/65/
      EEG](31992L0065);




              *lagomorfen:*


              lagomorfen die zijn bestemd voor een lid-staat die een gezondheidscertificaat als bedoeld in artikel 9,
      tweede lid, van [richtlijn 92/65/EEG](31992L0065) eist;



            quarantainevoorziening:

              een gebouw dat zich, de epizoötische kenmerken van Newcastle disease en aviaire influenza inzake
      verspreiding door de lucht in aanmerking genomen, op ten minste 200 meter afstand bevindt van pluimveebedrijven of
      van andere voorzieningen waar vogels worden gehouden, waar ingevoerde vogels in quarantaine worden gehouden volgens
      het ‘all in all out’-beginsel;



            quarantainestation:

              een gebouw bestaand uit een aantal functioneel en materieel van elkaar afgescheiden eenheden, elk
      uitsluitend vogels bevattend die tot dezelfde partij behoren en dezelfde gezondheidsstatus hebben en daardoor als
      epizoötiologische eenheid te beschouwen zijn, waar ingevoerde vogels in quarantaine worden gehouden volgens het
      ‘all in all out’-beginsel en dat zich, de epizoötische kenmerken van Newcastle disease en aviaire influenza inzake
      verspreiding door de lucht in aanmerking genomen, op ten minste 200 meter afstand bevindt van pluimveebedrijven of
      van andere voorzieningen waar vogels worden gehouden;



            verklikkerkuikens:

              kuikens die als hulpmiddel voor diagnosedoeleinden in het kader van de quarantaine worden gebruikt.
