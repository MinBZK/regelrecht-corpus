  - number: '2.61'
    text: |-
      Het in [artikel 2.5][ref1], [2.17][ref2], [2.18][ref3] en [2.53][ref4] bedoelde onderzoek geschiedt niet op
      zondagen en algemeen erkende feestdagen. Op maandag tot en met vrijdag geschiedt dit onderzoek uitsluitend tussen
      6.00 uur en 18.00 uur en op zaterdag tussen 06.00 uur en 12.00 uur op een door de keuringsdierenarts, na overleg
      met de betrokken aanvrager te bepalen tijdstip doch niet vóór zonsopgang en na zonsondergang, tenzij op de plaats
      van onderzoek – ter beoordeling van de keuringsdierenarts – een zodanige verlichting aanwezig is, dat het onderzoek
      naar behoren kan plaatsvinden.


