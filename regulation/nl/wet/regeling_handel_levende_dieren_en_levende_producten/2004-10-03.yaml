  - number: '2.48'
    text: |-
      1 Noch op grond van artikel 22, eerste lid eerste gedachtenstreepje, van [richtlijn 97/78/EG](31997L0078), noch
      op grond van andere regelgeving van de Europese Gemeenschap zijn maatregelen genomen houdende instelling van een
      verbod om de betrokken producten op het grondgebied van de Europese Gemeenschap, dan wel op het grondgebied van
      Nederland te brengen.

      2 Ten aanzien van de partij is, in voorkomend geval, voldaan aan de op grond van artikel 22, eerste lid, tweede
      en derde gedachtenstreepje van [richtlijn 97/78/EG](31997L0078), dan wel op grond van andere regelgeving van de
      Europese Gemeenschap vastgestelde bijzondere voorschriften.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel2.48
  - number: '2.49'
    text: |-
      1 De partij producten die voor Nederland is bestemd, gaat tijdens het vervoer over Nederlands grondgebied
      vanaf de erkende inspectiepost naar de plaats van bestemming vergezeld van het certificaat, bedoeld in
      [artikel 2.46, eerste lid][ref1], en het gewaarmerkt afschrift als bedoeld in [artikel 2.46, tweede lid][ref2].

      2 De partij producten die voor een lid-staat is bestemd, gaat tijdens het vervoer over Nederlands grondgebied
      vanaf de erkende inspectiepost vergezeld van het certificaat, bedoeld in [artikel 2.46, eerste lid][ref3], en het
      gewaarmerkt afschrift, bedoeld in [artikel 2.46, tweede lid][ref4].

      3 De partij producten die voor een derde land is bestemd, gaat tijdens het vervoer over Nederlands grondgebied vanaf
      de inspectiepost vergezeld van het originele document, bedoeld in [artikel 2.43, eerste lid, onderdeel b][ref5],
      alsmede van het certificaat, bedoeld in [artikel 2.46, eerste lid][ref6].

      4 De partij, bestemd voor een derde land, die:

      a. in een vrij entrepot of douane-entrepot in Nederland moet worden opgeslagen en die niet aan de in deze regeling
      voor het desbetreffende produkt gestelde voorschriften voor het brengen op Nederlands grondgebied voldoet;

      b. in een vrij entrepot of douane-entrepot in een lid-staat moet worden opgeslagen en die niet aan van toepassing
      zijnde voorschriften voor het brengen van de producten in de betreffende lid-staat voldoet, wordt onder
      douanetoezicht vervoerd, in een gesloten, geïdentificeerd lekvrij en verzegeld vervoermiddel, dat, indien het
      vervoer over land heeft plaatsgevonden, voorafgaand aan elk nieuw vervoer over Nederlands grondgebied onder
      toezicht van de keuringsdierenarts wordt gereinigd en ontsmet.

      5 Een partij als bedoeld in [artikel 2.43, tweede lid][ref7], gaat vanaf de inspectiepost tijdens het vervoer
      over Nederlands grondgebied vergezeld van de in artikel 15, eerste lid, onderdeel a, van [richtlijn 97/78/EG]
      (31997L0078) genoemde documenten en van het certificaat als bedoeld in [artikel 2.46, eerste lid][ref8]..


