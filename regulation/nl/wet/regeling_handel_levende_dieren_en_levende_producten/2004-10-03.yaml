  - number: '5.6'
    text: Geregistreerde paarden en fok- en gebruikspaarden zijn geïdentificeerd door middel van het identificatiedocument.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel5.6
  - number: '5.7'
    text: |-
      1 Indien een partij die is verzonden vanuit een lid-staat en bestemd is voor Nederland of een lid-staat, gaat zij
      vergezeld van:

      a. het identificatiedocument, vergezeld van de verklaring met betrekking tot de gezondheid, bedoeld in bijlage B
      van [richtlijn 90/426](31990L0426) indien het geregistreerde paarden betreft;

      b. het identificatiedocument vergezeld van het gezondheidscertificaat bedoeld in bijlage C van [richtlijn 90/426/
      EEG](31990L0426) indien het fok en gebruikspaarden betreft;

      c. het gezondheidscertificaat bedoeld in bijlage C van [richtlijn 90/426/EEG](31990L0426) indien het slachtpaarden
      betreft.

      2 De verklaring met betrekking tot de gezondheid, bedoeld in het eerste lid, onderdeel a, en het
      gezondheidscertificaat, bedoeld in het eerste lid, onderdelen b en c, zijn aangevuld met een verklaring van de
      officiële dierenarts dat voldaan is aan [richtlijn 91/628/EEG](31991L0628).

      3 De partij gaat bij reizen van meer dan 8 uur tevens vergezeld van een reisschema als bedoeld in artikel 5,
      A, tweede lid, onderdeel b, van [richtlijn 91/628/EEG](31991L0628) dat gedurende de reis is gehecht aan het
      gezondheidscertificaat, bedoeld in het eerste lid, onderdeel b en c..

      4 Indien aan de partij diergeneesmiddelen zijn toegediend die allyltrenbolon of ß-agonisten bevatten en de partij
      binnen de wachttermijn wordt verhandeld, zijn op de documenten bedoeld in het eerste lid, aard en datum van de
      behandeling vermeld.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel5.7
  - number: '5.8'
    text: |-
      1 De partij is verzonden vanuit een derde land of een deel van een derde land, dat is vermeld op de lijst bedoeld
      in artikel 12, eerste lid, van [richtlijn 90/426/EEG](31990L0426).

      2 De partij gaat vergezeld van het certificaat dat op grond van artikel 16 van [richtlijn 90/426/EEG](31990L0426)
      voor de desbetreffende soort eenhoevige dieren is voorgeschreven, met dien verstande dat, indien de partij bestemd
      is voor Zweden, uit het gezondheidscertificaat blijkt dat voldaan is aan de voorschriften die Zweden stelt met
      betrekking tot de invoer van dieren uit landen die tegen mond- en klauwzeer inenten.

      3 Het gezondheidscertificaat, bedoeld in het tweede lid, is aangevuld met een verklaring van de officiële
      dierenarts dat voldaan is aan [richtlijn 91/628/EEG](31991L0628) en gaat vergezeld van:

      4 Aan de partij zijn geen stoffen toegediend die ingevolge artikel 3, onderdeel a, van [richtlijn 96/22/EG]
      (31996L0022) niet aan eenhoevige dieren mogen worden toegediend, tenzij aan de voorwaarden ingevolge artikel 11
      van genoemde richtlijn is voldaan. Indien aan de partij diergeneesmiddelen zijn toegediend die allyltrenbolon of
      ß-agonisten bevatten, en de partij binnen de wachttermijn wordt verhandeld, zijn op de documenten bedoeld in het
      tweede lid, aard en datum van de behandeling vermeld.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel5.8
  - number: '5.10'
    text: |-
      In Nederland gebrachte slachtpaarden, bestemd voor Nederland, worden rechtstreeks vervoerd naar en geslacht in een
      overeenkomstig [artikel 2.64][ref1] toegelaten slachthuis.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.64
