        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: '5.4'
    text: |-
      Indien gebleken is dat slachtpaarden voldoen aan [artikel 5.3][ref1] worden zij zonodig van een merk voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel5.3
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0007049
        artikel: '5.3'
        hoofdstuk: '5'
        afdeling: '2'
  - number: '5.5'
    text: |-
      1 Onverminderd [artikel 2.15][ref1] moeten de eenhoevige dieren zo spoedig mogelijk, rechtstreeks dan wel via een
      verzamelcentrum dat is erkend overeenkomstig [artikel 2.63][ref2], van het bedrijf van herkomst naar de plaats van
      bestemming worden vervoerd.

      2 Onverminderd [artikel 2.11][ref3] worden de eenhoevige dieren vervoerd overeenkomstig artikel 7, eerste lid, van
      [richtlijn 90/426/EEG](31990L0426).


