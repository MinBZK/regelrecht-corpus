  - number: '2.13'
    text: |-
      Op grond van de regelgeving van de Raad van de Europese Unie of de Commissie van de Europese Gemeenschappen geldt
      geen verbod om de dieren of producten anders dan in doorvoer buiten Nederland te brengen.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel2.13
  - number: '2.14'
    text: |-
      Raszuivere dieren, hybride varkens en producten hiervan gaan vergezeld van de zoötechnische documenten die bij of
      krachtens het [Fokkerijbesluit][ref1] zijn voorgeschreven voor het anders dan in doorvoer buiten Nederland brengen
      van raszuivere dieren, hybride varkens en producten hiervan, bestemd voor een lid-staat.


      [ref1]: https://wetten.overheid.nl/BWBR0006862
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0006862
  - number: '2.15'
    text: |-
      Indien de partij op grond van het onderzoek, bedoeld in [artikel 2.5][ref1], geschikt is bevonden om anders dan in
      doorvoer buiten Nederland te worden gebracht, wordt zij onmiddellijk na het onderzoek, langs de kortste weg naar
      het transportmiddel vervoerd, waarmee zij buiten Nederland zal worden gebracht en wordt zij zo spoedig mogelijk,
      rechtstreeks, buiten Nederland gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.5
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel2.15
