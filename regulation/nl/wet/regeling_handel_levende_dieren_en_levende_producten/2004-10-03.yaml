  - number: 8.5a
    text: |-
      1 De partij vogels is verzonden vanuit een derde land, dat is vermeld op de lijst, bedoeld in bijlage D van
      beschikking 2000/666/EG en is afkomstig van een bedrijf dat door de bevoegde instantie van het derde land is
      geregistreerd.

      2 De partij vogels gaat vergezeld van het diergezondheidscertificaat als bedoeld in artikel 2, punt 2, van
      beschikking 2000/666/EG.

      3 De partij vogels wordt aangevoerd in kratten of kooien die, per krat of kooi, zijn geïdentificeerd met een
      identificatienummer dat overeenstemt met het identificatienummer dat is vermeld op het gezondheidscertificaat als
      bedoeld in het tweede lid.

      4 Onverminderd [artikel 2.35][ref1] legt de importeur voordat de partij vogels op de inspectiepost wordt aangevoerd
      per e-mail of per fax aan de inspectiepost over een in de Nederlandse taal opgestelde, schriftelijke verklaring
      van de exploitant van de erkende quarantainevoorziening of erkend quarantainestation, die onderscheidenlijk dat is
      opgenomen in de in artikel 2, punt 5, van beschikking 2000/666/EG bedoelde lijst, waarin tenminste staat vermeld:

        - dat de partij vogels in voornoemde quarantainevoorziening onderscheidenlijk erkend quarantainestation wordt
      opgenomen, alsmede
        - de naam, het adres en het erkenningsnummer van voornoemde quarantainevoorziening onderscheidenlijk erkend
      quarantainestation.

      5 De partij vogels mag de inspectiepost niet eerder verlaten dan nadat de verklaring, bedoeld in het vierde lid,
      door de importeur of diens vertegenwoordiger is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.35
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel8.5a
