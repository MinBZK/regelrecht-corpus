  - number: '8.10'
    text: |-
      1 Vogels, niet zijnde papegaaiachtigen, vossen, nertsen en lagomorfen die zijn bestemd voor Nederland of een lid-
      staat, die geen gezondheidscertificaat als bedoeld in artikel 9, tweede lid, van [richtlijn 92/65/EEG](31992L0065)
      eist, gaan vergezeld van de verklaring, bedoeld in artikel 4, vierde gedachtenstreepje, van [richtlijn 92/65/EEG]
      (31992L0065).

      2 Papegaaiachtigen gaan vergezeld van het handelsdocument, bedoeld in artikel 7, onder A, tweede lid, onderdeel c,
      van [richtlijn 92/65/EEG](31992L0065).

      3 Dieren als bedoeld in artikel 13, eerste lid, van [richtlijn 92/65/EEG](31992L0065) gaan vergezeld van het in
      artikel 13, eerste lid, van [richtlijn 92/65/EEG](31992L0065) bedoelde vervoersdocument.

      4 De verklaring, bedoeld in het eerste lid, het handelsdocument, bedoeld in het tweede lid, en het
      vervoersdocument, bedoeld in het derde lid, zijn opgesteld en afgegeven in overeenstemming met de regelgeving van
      de Raad van de Europese Unie of de Commissie van de Europese Gemeenschappen, volledig ingevuld, gedagtekend en
      ondertekend, terwijl de geldigheidsduur ervan niet is verstreken.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel8.10
  - number: '8.11'
    text: |-
      Indien de vogels, nertsen, vossen, lagomorfen die zijn bestemd voor Nederland of een lid-staat, die geen
      gezondheidscertificaat als bedoeld in artikel 9, tweede lid, van [richtlijn 92/65/EEG](31992L0065) eist dan wel de
      dieren, bedoeld in artikel 13, eerste lid, van [richtlijn 92/65/EEG](31992L0065) zijn verzonden vanuit een derde
      land en via het grondgebied van een lid-staat in Nederland worden gebracht, gaan zij vergezeld van de documenten,
      bedoeld in artikel 7, eerste lid, eerste en tweede gedachtenstreepje, van [richtlijn 91/496/EEG](31991L0496).
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel8.11
  - number: '8.12'
    text: |-
      Indien honden, katten of fretten zonder handelsoogmerk anders dan in doorvoer buiten Nederland of in Nederland
      worden gebracht voldoen zij, voor zover van toepassing, aan:

      a. artikel 4 van [verordening (EG) 998/2003](32003R0998);

      b. artikel 5, eerste lid, van [verordening (EG) nr. 998/2003](32003R0998);

      c. artikel 6, eerste en tweede lid, van [verordening (EG) nr. 998/2003](32003R0998);

      d. artikel 8, eerste en tweede lid, van [verordening (EG) nr. 998/2003](32003R0998), tenzij is voldaan aan artikel
      8, derde lid, onderdeel a, b of c van [verordening (EG) nr. 998/2003](32003R0998) en, indien van toepassing, de
      vereisten vastgesteld door de Commissie van de Europese Gemeenschappen op grond van artikel 8, derde lid, onderdeel
      a of c van [verordening (EG) nr. 998/2003](32003R0998);

      e. artikel 14 van [verordening (EG) nr. 998/2003](32003R0998);

      f. de vereisten vastgesteld door de Commissie van de Europese Gemeenschappen op grond van artikel 17 van
      [verordening (EG) nr. 998/2003](32003R0998), en

      g. de vereisten vastgesteld door de Commissie van de Europese Gemeenschappen op grond van artikel 18 van
      [verordening (EG) nr. 998/2003](32003R0998).
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel8.12
  - number: '8.13'
    text: |-
      De minister is de bevoegde autoriteit, bedoeld in artikel 5, eerste lid, onderdeel b, artikel 6, eerste en tweede
      lid, tweede gedachtestreepje, en artikel 14 van [verordening (EG) 998/2003](32003R0998).
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel8.13
  - number: '8.14'
    text: |-
      1 Het in artikel 5, eerste lid, van [verordening (EG) nr. 998/2003](32003R0998) bedoelde paspoort, dat in Nederland
      wordt uitgegeven, wordt door de minister erkend, indien het paspoort voldoet aan de vereisten die zijn vastgesteld
      door de Commissie van de Europese Gemeenschappen op grond van artikel 17 van [verordening (EG) nr. 998/2003]
      (32003R0998).

      2 De producent van het paspoort plaatst, overeenkomstig de op grond van artikel 17 van [verordening (EG) nr.
      998/2003](32003R0998) door de Commissie van de Europese Gemeenschappen vastgestelde vereisten, op de omslag van het
      paspoort het door de minister verstrekte unieke nummer.

      3 Een verzoek tot erkenning van een paspoort, bedoeld in het eerste lid, wordt aangevraagd bij de VWA.

      4 De dierenarts, bedoeld in artikel 5, eerste lid, onderdeel b, artikel 6, eerste lid, tweede gedachtestreepje, en
      in artikel 15 van [verordening (EG) nr. 998/2003](32003R0998), is een dierenarts die overeenkomstig de [artikelen
      9](onbekend) en [10 van de Wet op de uitoefening van de diergeneeskunde 1990](onbekend) is geregistreerd.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel8.14
  - number: '8.15'
    text: |-
      1 Indien honden, katten of fretten vanuit een lidstaat zonder handelsoogmerk in Nederland worden gebracht, jonger
      zijn dan drie maanden en niet zijn gevaccineerd, voldoen zij aan de voorwaarden, bedoeld in artikel 5, tweede lid,
      van [verordening (EG) nr. 998/2003](32003R0998).

      2 Op verzoek van de minister verklaart de eigenaar of houder van de honden, katten of fretten dat is voldaan aan
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel8.15
  - number: '9.1'
    text: |-
      Onverminderd [artikel 1.1.][ref1] wordt in dit hoofdstuk verstaan onder:




              *richtlijn 88/407/EEG:*


              richtlijn van de Raad van de Europese Gemeenschappen van 14 juni 1988 tot vaststelling van de
      veterinairrechtelijke voorschriften van toepassing op het intracommunautaire handelsverkeer in sperma van runderen
      en de invoer daarvan (PbEG L 194);




              *richtlijn 90/429/EEG:*


              richtlijn van de Raad van de Europese Gemeenschappen van 26 juni 1990 tot vaststelling van de
      veterinairrechtelijke voorschriften van toepassing op het intracommunautaire handelsverkeer in sperma van varkens
      en de invoer daarvan (PbEG L 224);




              *richtlijn nr. 2003/43/EG:*


              [richtlijn nr. 2003/43/EG](32003L0043) van de Raad van de Europese Unie van 26 mei 2003 houdende wijziging
      van [richtlijn 88/407/EEG](31988L0407) tot vaststelling van de veterinairrechtelijke voorschriften van toepassing
      op het intracommunautaire handelsverkeer in diepgevroren sperma van runderen en de invoer daarvan (PbEU L143);




              *rundersperma:*


              bewerkt of verdund ejaculaat van als landbouw-huisdier gehouden runderen dat, voor zover afkomstig uit lid-
      staten, na 31 december 1989 aldaar is verkregen en behandeld;




              *varkenssperma:*


              onbewerkt, bewerkt of verdund ejaculaat van als landbouwhuisdier gehouden varkens dat, voor zover afkomstig
      uit lid-staten, na 30 december 1991 is verkregen en behandeld;




              *sperma van schapen, geiten of eenhoevige dieren:*


              onbewerkt, bewerkt of verdund ejaculaat van als huisdier gehouden schapen, geiten of eenhoevige dieren;




              *instelling, instituut of centrum:*


              instelling, instituut of centrum als bedoeld in artikel 2, eerste lid, onderdeel c, van [richtlijn 92/65/
      EEG](31992L0065);




              *runderspermaopslagcentrum:*


              inrichting waar rundersperma wordt opgeslagen dat bestemd is voor kunstmatige inseminatie.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0007049
        artikel: '1.1'
        hoofdstuk: '1'
  - number: '9.2'
    text: |-
      Als bewijsstuk, bedoeld in [artikel 2.4, onderdeel a][ref1], wordt met het oog op het anders dan in doorvoer buiten
      Nederland brengen van een partij sperma, bestemd voor een lid-staat, vastgesteld:

      a. het gezondheidscertificaat dat op grond van artikel 6, eerste lid, van [richtlijn 88/407/EEG](31988L0407) is
      voorgeschreven, indien het rundersperma betreft, met inachtneming van artikel 2, tweede lid, van [richtlijn nr.
      2003/43/EG](32003L0043);

      b. het gezondheidscertificaat dat op grond van artikel 6, eerste lid, van [richtlijn 90/429/EEG](31990L0429) is
      voorgeschreven, indien het varkenssperma betreft, of

      c. het gezondheidscertificaat dat op grond van artikel 11, tweede lid, vierde gedachtenstreepje, van [richtlijn
      92/65/EEG](31992L0065) is voorgeschreven indien het sperma van schapen, geiten en eenhoevige dieren betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.4
