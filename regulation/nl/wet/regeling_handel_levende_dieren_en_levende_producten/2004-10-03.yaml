  - number: '6.6'
    text: |-
      1 Indien een partij die is verzonden vanuit een lid-staat en bestemd is voor Nederland of een lid-staat, gaat zij
      vergezeld van het gezondheidscertificaat dat op grond van artikel 17 van [richtlijn 90/539/EEG](31990L0539) voor
      de desbetreffende soort pluimvee of broedeieren is voorgeschreven, met dien verstande dat, indien de partij bestemd
      is voor Zweden, in afwachting van de met betrekking tot infectieuze bronchitis gestelde algemene of beperkte
      aanvullende garanties, bedoeld in artikel 13, tweede lid, van [richtlijn 90/539/EEG](31990L0539) en van de met
      betrekking tot infectieuze rhinotracheïtis van de kalkoen, swollen head-syndrome, infectieuze laryngotrageïtis
      (ILT), EDS 76 en vogelpokken gestelde algemene of beperkte aanvullende garanties, bedoeld in artikel 14, tweede
      lid, van laatstgenoemde richtlijn, uit het gezondheidscertificaat blijkt dat wordt voldaan aan de voorschriften die
      Zweden stelt met betrekking tot genoemde ziekten.

      2 Het gezondheidscertificaat, bedoeld in het eerste lid, is, indien het pluimvee betreft, aangevuld met een
      verklaring van de officiële dierenarts dat voldaan is aan [richtlijn 91/628/EEG](31991L0628).
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel6.6
  - number: '6.7'
    text: |-
      1 Pluimvee of broedeieren, niet zijnde loopvogels of broedeieren daarvan, is onderscheidenlijk zijn verzonden
      vanuit een derde land of een deel van een derde land, dat is vermeld op de lijst, bedoeld in bijlage I van
      beschikking 95/233/EG.

      2 Loopvogels of de broedeieren daarvan zijn verzonden vanuit een derde land of een deel van een derde land dat is
      vermeld op de lijst, bedoeld in bijlage II van beschikking 95/233/EG.

      3 Loopvogels of de broedeieren daarvan worden na invoer in quarantaine geplaatst.

      4 Pluimvee of broedeieren, niet zijnde loopvogels of broedeieren daarvan, in partijen van minder dan twintig stuks
      is onderscheidenlijk zijn verzonden uit een derde land, dat is vermeld op de lijst, bedoeld in bijlage III van
      beschikking 95/233/EG. De betrokken partijen worden na invoer in isolatie of quarantaine geplaatst, gedurende een
      door de toezichthoudend ambtenaar vast te stellen periode.

      5 Pluimvee of broedeieren, niet zijnde loopvogels of broedeieren daarvan, gaan vergezeld van het relevante
      gezondheidscertificaat als bedoeld in bijlage I beschikking 96/482/EG.

      6 Indien pluimvee of broedeieren is onderscheidenlijk zijn bestemd voor Finland of Zweden blijkt uit de in het
      tweede lid bedoelde certificaten, dat tenminste is voldaan aan de voorschriften die gelden met betrekking tot de
      invoer in Finland of Zweden van pluimvee en broedeieren uit Lid-Staten.

      7 De certificaten, bedoeld in het vijfde lid, zijn, indien het pluimvee betreft, aangevuld met een verklaring van
      de officiële dierenarts dat voldaan is aan [richtlijn 91/628/EEG](31991L0628) en gaan vergezeld van een document
      waaruit blijkt dat voldaan is aan artikel 11, tweede lid, van genoemde richtlijn.

      8 Aan het pluimvee zijn geen stoffen toegediend die ingevolge artikel 3, onderdeel a, van [richtlijn 96/22/EG]
      (31996L0022) niet aan pluimvee mogen worden toegediend, tenzij aan de voorwaarden ingevolge artikel 11 van genoemde
      richtlijn is voldaan.

      9 Dit artikel is niet van toepassing op het brengen in Nederland van specifieke pathogenen vrije eieren uit derde
      landen.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel6.7
  - number: 6.7a
    text: |-
      1 Specifieke pathogenen vrije eieren zijn verzonden vanuit een derde land of een deel van een derde land, dat is
      vermeld op de lijst, bedoeld in artikel 2, eerste lid, van beschikking (EG) nr. 2001/393.

      2 Specifieke pathogenen vrije eieren gaan vergezeld van het gezondheidscertificaat, bedoeld in artikel 2, eerste
      lid, van beschikking (EG) nr. 2001/393, en voldoen aan de in het gezondheidscertificaat vermelde vereisten.

      3 Specifieke pathogenen vrije eieren voldoen aan artikel 2, tweede lid, van beschikking (EG) nr. 2001/393.

      4 Resterende eieren, het verpakkingsmateriaal en resten van eieren of eierproducten moeten na gebruik worden
      verbrand of behandeld.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel6.7a
  - number: '6.8'
    text: |-
      1 Een inrichting als bedoeld in artikel 6.3, eerste lid, onderdeel e, wordt door de minister voor de toepassing van
      deze regeling erkend indien:

      a. een volledig ingevulde, ondertekende en gedagtekende aanvraag voor een erkenning bij de VWA is ingediend, en

      b. uit een door de keuringsdierenarts ingesteld onderzoek is gebleken dat:

      1) de inrichting voldoet aan de voorschriften, gesteld in de bijlage van de Verordening produktie van en handel
      in broedeieren en levend pluimvee 1992 van het Produktschap voor Pluimvee en Eieren alsmede aan eventuele daarop
      betrekking hebbende uitvoeringsbesluiten welke krachtens artikel 9 van voornoemde verordening zijn vastgesteld;

      2) de ondernemer die de inrichting drijft op grond van artikel 3, tweede lid, van de in onderdeel a, bedoelde
      verordening, bij het Produktschap voor Pluimvee en Eieren is geregistreerd;

      3) de ondernemer die de inrichting drijft een administratie voert waaruit de gegevens kunnen worden afgeleid die
      nodig zijn om de bevoegde dierenarts en de keuringsdierenarts in staat te stellen de gezondheidssituatie in de
      inrichting permanent te volgen;

      4) in de inrichting alleen pluimvee aanwezig is;

      5) gewaarborgd is, dat de keuringsdierenarts en de bevoegde dierenarts in verband met de door hen in het kader
      van [richtlijn 90/539/EEG](31990L0539) uit te oefenen taken, toegang tot de inrichting hebben en aan hen alle
      medewerking zal worden verleend en alle inlichtingen zullen worden verstrekt, die zij ter uitoefening van deze
      taken nodig achten.

      2 Een erkenning als bedoeld in het eerste lid wordt door de minister voor bepaalde tijd ingetrokken in de gevallen,
      bedoeld in bijlage II, hoofdstuk IV, punt I van [richtlijn 90/539/EEG](31990L0539).

      3 Een erkenning als bedoeld in het eerste lid wordt door de minister ingetrokken in de gevallen, bedoeld in bijlage
      II, hoofdstuk IV, punt 2 van de richtlijn.

      4 Een erkenning kan, nadat zij door de minister is ingetrokken, opnieuw worden verleend, onder de voorwaarden,
      bedoeld in bijlage II, hoofdstuk IV, punt 3 van de richtlijn.

      5 De minister kan tot het intrekken van de erkenning voor bepaalde tijd dan wel tot intrekking van de erkenning
      overgaan, in het geval bedoeld in bijlage II, hoofdstuk III, punt D, van [richtlijn 90/539/EEG](31990L0539).
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel6.8
  - number: '6.9'
    text: |-
      1 Pluimvee en broedeieren dat, onderscheidenlijk die in Nederland is, onderscheidenlijk zijn gebracht en voor
      Nederland of een lid-staat is, onderscheidenlijk zijn bestemd, worden vervoerd overeenkomstig de artikelen 15 en 16
      van [richtlijn 90/539/EEG](31990L0539).

      2 Pluimvee en broedeieren dat, onderscheidenlijk die via Nederland voor het eerst gebracht worden in de gebieden
      waarop het Verdrag betreffende de Europese Unie van toepassing is, is, onderscheidenlijk zijn verzonden vanuit een
      derde land of een deel van een derde land en voor Nederland is, onderscheidenlijk zijn bestemd, worden onmiddellijk
      en rechtstreeks, onder ambtelijke verzegeling en zonder uit-, bij- of overlading, van de erkende inspectiepost naar
      het bedrijf van bestemming dan wel het in [artikel 6.10][ref1] bedoelde slachthuis vervoerd.

      3 De verbreking van de in het tweede lid bedoelde verzegeling geschiedt door een ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel6.10
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel6.9
    references:
      - id: ref1
        bwb_id: BWBR0007049
        artikel: '6.10'
        hoofdstuk: '6'
        afdeling: '5'
  - number: '6.10'
    text: |-
      In Nederland gebracht slachtpluimvee, bestemd voor Nederland, wordt zo spoedig mogelijk maar in ieder geval binnen
      72 uur na aankomst op een overeenkomstig artikel 4.16 van de Regeling keuring en handel dierlijke producten erkend
      slachthuis, zondagen en officieel erkende feestdagen niet meegerekend, geslacht.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel6.10
  - number: '6.11'
    text: |-
      1 Fok- en gebruikspluimvee en eendagskuikens dat, onderscheidenlijk die, zijn verzonden vanuit een derde land of
      een deel van een derde land en voor Nederland bestemd is onderscheidenlijk zijn, wordt onderscheidenlijk worden op
      het bedrijf van bestemming, gedurende zes weken na de datum van aankomst in afzondering gehouden, onder toezicht
      van de ambtenaren.

      2 Van broedeieren, die zijn verzonden vanuit een derde land of een deel van een derde land en voor Nederland
      bestemd zijn, afkomstig pluimvee wordt gedurende drie weken vanaf de dag van het uitbroeden in afzondering gehouden
      op het bedrijf onderscheidenlijk bedrijven van bestemming waarnaar de kuikens na het uitbroeden zijn verzonden.

      3 Gedurende de in het eerste en tweede lid bedoelde perioden en gedurende het uitbroeden wordt het in het eerste
      lid bedoelde pluimvee, onderscheidenlijk de in het tweede lid bedoelde broedeieren en daaruit afkomstig pluimvee,
      gescheiden gehouden van reeds op de bedrijven aanwezig pluimvee, onderscheidenlijk broedeieren.

      4 In afwijking van het derde lid mag het in het eerste lid bedoelde pluimvee, onderscheidenlijk mogen de
      in het tweede lid bedoelde broedeieren in ruimten worden geplaatst waar reeds pluimvee, onderscheidenlijk
      broedeieren aanwezig is, onderscheidenlijk zijn, met dien verstande dat de in het eerste en tweede lid bedoelde
      afzonderingsperioden een aanvang nemen nadat het laatst binnen Nederland gebrachte pluimvee, onderscheidenlijk
      broedei in die ruimte is geplaatst.

      5 De kosten die voortvloeien uit de tijdelijke afzondering, bedoeld in het eerste en tweede lid komen voor rekening
      van de afzender, de geadresseerde of hun gemachtigde.

      6 Indien tijdens de afzonderingsperiode, bedoeld in het eerste of tweede lid, onder het in Nederland gebrachte
      fok- en gebruikspluimvee, onder de in Nederland gebrachte eendagskuikens of onder het uit in Nederland gebrachte
      broedeieren afkomstig pluimvee de ziekte van Newcastle of aviaire influenza uitbreekt, draagt de eigenaar, houder
      of hoeder van die dieren alle dieren onmiddellijk aan de ambtenaar ter vernietiging over, waarbij de kosten van de
      vernietiging voor rekening van de eigenaar, houder of hoeder zijn.

      7 De eigenaar, houder of hoeder van dieren, die bij aankomst op het bedrijf van bestemming dan wel tijdens de
      periode van afzondering, bedoeld in het eerste en tweede lid, zijn gestorven, stuurt deze dieren, met inachtneming
      van de door de toezichthoudende ambtenaar gegeven aanwijzingen, naar een naar het oordeel van onze Minister
      voldoende toegerust laboratorium ten behoeve van onderzoek.

      8 In afwijking van het eerste lid wordt de periode van zes weken verkort tot 21 dagen indien het foks-
      en gebruikspluimvee, bedoeld in het eerste lid, na invoer met gunstig resultaat is onderzocht volgens de
      bemonsterings- en testprocedures voor Newcastle disease en aviaire influenza als bedoeld in bijlage III van
      Beschikking 96/482/EG.

      De monsters worden overeenkomstig deze testprocedure bij het Central Institute for Animal Disease Control,
      gevestigd te Lelystad, getest op de aanwezigheid van Newcastle disease en aviaire influenza.

      9 De ondernemer bewaart de testuitslagen van de in het achtste lid bedoelde onderzoeken gedurende een periode van
      drie jaren op zijn bedrijf en legt, op verzoek van een ambtenaar, de uitslagen van de in het achtste lid bedoelde
      onderzoeken over.

      10 Dit artikel is niet van toepassing op loopvogels en broedeieren daarvan, alsmede pluimvee en broedeieren, niet
      zijnde loopvogels en broedeieren daarvan, in partijen van minder dan twintig stuks.
    url: https://wetten.overheid.nl/BWBR0007049/2004-10-03#Artikel6.11
  - number: '7.1'
    text: |-
      Onverminderd [artikel 1.1][ref1] wordt in dit hoofdstuk verstaan onder:




              *richtlijn 91/68/EEG:*


              richtlijn van de Raad van de Europese Gemeenschappen van 28 januari 1991 inzake veterinairrechtelijke
      voorschriften voor het intracommunautaire handelsverkeer in schapen en geiten (PbEG L 46);




              *slachtschapen en -geiten:*


              schapen en geiten, bestemd om hetzij rechtstreeks hetzij via een schapen- of geitenverzamelcentrum naar een
      slachthuis te worden geleid om daar te worden geslacht;



            fokschapen en -geiten:

              schapen en geiten, bestemd om rechtstreeks, voor fok- en gebruiksdoeleinden, naar de plaats van bestemming
      te worden vervoerd;



            mestschapen en -geiten:

              schapen en geiten, bestemd om rechtstreeks naar de plaats van bestemming te worden vervoerd, om te worden
      vetgemest voor de slacht;



            schapenverzamelcentrum:

              schapenverzamelcentrum dat op grond van [artikel 2.63, vierde lid][ref2], is erkend;



            geitenverzamelcentrum:

              geitenverzamelcentrum dat op grond van [artikel 2.63, vierde lid][ref3], is erkend;



            handelaar:

              natuurlijke of rechtspersoon die al dan niet rechtstreeks dieren koopt en verkoopt voor handelsdoeleinden,
      die een omzetsnelheid heeft en die de dieren uiterlijk 29 dagen na aankoop doorverkoopt of verplaatst van de ene
      bedrijfsruimte naar de andere of rechtstreeks naar een slachthuis waarvan hij geen eigenaar is en die voldoet aan
      [artikel 7.9][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0007049#Artikel2.63
      [ref3]: https://wetten.overheid.nl/BWBR0007049#Artikel2.63
      [ref4]: https://wetten.overheid.nl/BWBR0007049#Artikel7.9
