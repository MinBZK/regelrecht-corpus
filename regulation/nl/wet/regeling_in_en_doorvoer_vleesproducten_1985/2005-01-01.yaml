  - number: 5a
    text: |-
      In afwijking van hetgeen in de [artikelen 5][ref1] en [6][ref2] is bepaald ten aanzien van de voor de
      onderscheiden vleesproducten of andere producten van dierlijke oorsprong uit derde landen voorgeschreven
      gezondheidscertificaten, mag een partij afkomstig uit Nieuw-Zeeland eveneens vergezeld gaan van een op de partij
      betrekking hebbend(e):

      a. dier- en volksgezondheidscertificaat zoals dat op 31 december 1996 voor het betrokken product was
      voorgeschreven, of

      b. met ingang van de datum van inwerkingtreding van de Overeenkomst van 17 december 1996 tussen de Europese
      Gemeenschap en Nieuw-Zeeland inzake sanitaire maatregelen voor de handel in levende dieren en dierlijke producten
      (PbEG 1997, L 57), een gezondheidscertificaat zoals dat ingevolge de regelgeving van de Europese Gemeenschap
      ter uitvoering van die Overeenkomst is vastgesteld en dat een verklaring als bedoeld in bijlage VII van die
      Overeenkomst bevat, met dien verstande dat indien een vleesproduct enkel op het gebied van de volksgezondheid, dan
      wel enkel op het gebied van de diergezondheid als gelijkwaardig is erkend, aanvullend een dier- onderscheidenlijk
      volksgezondheidscertificaat als bedoeld in [artikel 5][ref3] of 6 is bijgevoegd.


