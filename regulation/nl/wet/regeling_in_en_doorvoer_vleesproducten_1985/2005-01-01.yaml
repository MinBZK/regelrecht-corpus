  - number: '2'
    text: |-
      1 Deze regeling is niet van toepassing op:

      a. vleesproducten als bedoeld in artikel 1 van [verordening (EG) nr. 745/2004](32004R0745) van de Commissie van de
      Europese Gemeenschappen van 16 april 2004 tot vaststelling van maatregelen betreffende de invoer van producten van
      dierlijke oorsprong voor persoonlijke consumptie (PbEU L 122), voor zover door reizigers in de Europese Gemeenschap
      binnengebracht of aan particulieren in de Europese Gemeenschap toegezonden, en

      b. producten als bedoeld in artikel 16, eerste lid, van [richtlijn 97/78/EG](31997L0078),
      met dien verstande dat onder commerciële monsters als bedoeld in artikel 16, eerste lid,
      onderdeel a, van [richtlijn 97/78/EG](31997L0078) wordt verstaan handelsmonsters als bedoeld in
      [artikel 1.1, eerste lid, van de Regeling keuring en handel dierlijke producten][ref1], en, mits met inachtneming
      van artikel 8 van [verordening 136/2004/EG](32004R0136), wordt voldaan aan artikel 16, eerste lid, van [richtlijn
      97/78/EG](31997L0078).

      2 Producten als bedoeld in artikel 16, eerste lid, onderdelen e en f, van [richtlijn 97/78/EG](31997L0078) worden
      aangevoerd via een inspectiepost.

      3 Tenzij met de Minister anders is overeengekomen, geeft de belanghebbende bij de lading van de aanvoer als
      bedoeld in het tweede lid tenminste 24 uur voor de aankomst schriftelijk kennis aan de VWA, onder opgave van het
      vermoedelijke tijdstip van aankomst, van de hoeveelheid, van de herkomst en van de soort producten.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel1.1
