  - number: 6b
    text: |-
      1 De partij producten, afkomstig uit lid-staten, moet, tot en met de ontvangst door de handelaar, voldoen aan de
      voorwaarden, gesteld in de de [artikelen 4][ref1], [4a][ref2] en [6][ref3], voor zover deze betrekking hebben op
      de invoer van producten uit lid-staten.

      2 De handelaar moet zijn ingeschreven in een register dat wordt bijgehouden door de Minister, terwijl die
      registratie niet is getroffen door een beslissing als bedoeld in [artikel 6c, tweede lid][ref4].

      3 Krachtens de regelgeving van de Europese Gemeenschappen zijn geen maatregelen genomen, houdende instelling van
      een verbod om de betreffende partij producten uit de betrokken lid-staat in te voeren of houdende de machtiging
      tot instelling van een verbod om de betreffende partij producten in Nederland in te voeren, noch is de lid-staat
      van verzending ingevolge die regelgeving gehouden de afgifte van de certificaten of vervoersdocumenten, zulks in
      verband met de invoer in Nederland, op te schorten.

      4 Ingevolge de regelgeving van de lid-staat van verzending is er geen verbod om de betrokken partij producten op
      het grondgebied van die lid-staat in de handel te brengen.

      5 De in de de [artikelen 4][ref5], [4a][ref6] en [6][ref7] bedoelde certificaten en documenten zijn, met
      uitzondering van de documenten, bedoeld in artikel 7, vierde lid, van [richtlijn 97/78/EG](31997L0078), originelen
      waarvan de geldigheidsduur niet is verstreken. Zij zijn in overeenstemming met de regelgeving van de Europese
      Gemeenschappen afgegeven en volledig ingevuld, gedagtekend en ondertekend in de Nederlandse, Engelse, Franse of
      Duitse taal.

      6 Ten aanzien van de partij producten is, in voorkomend geval, voldaan aan de ingevolge artikel 9 van [richtlijn
      89/662/EEG](31989L0662) vastgestelde regelgeving van de Europese Gemeenschap of van de lid-staat van verzending
      zelf, in geval van een uitbraak van een epidemische dierziekte in de lid-staat van verzending.

      7 Indien de zending vlees in Nederland wordt gebracht via een erkende inspectiepost, worden de in de
      [artikelen 2][ref8] en [6a, eerste lid][ref9], bedoelde certificaten of documenten, desverlangd door de handelaar
      overgelegd aan de ambtenaar.

      8 Het zevende lid geldt niet, indien de partij rechtstreeks via een geregelde lijndienst vanuit een erkende
      inspectiepost wordt vervoerd naar een andere op het grondgebied van de Europese Gemeenschap gelegen plaats.


