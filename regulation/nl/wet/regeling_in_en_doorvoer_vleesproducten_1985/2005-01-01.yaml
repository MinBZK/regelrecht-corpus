  - number: '3'
    text: De in- en doorvoer van producten is verboden.
    url: https://wetten.overheid.nl/BWBR0003776/2005-01-01#Artikel3
  - number: '4'
    text: |-
      1 Het in [artikel 3][ref1] gestelde verbod geldt niet voor uit een lidstaat afkomstige vleesproducten:

      a. die voldoen aan de artikelen 3 en 4 van [richtlijn 77/99/EEG](31977L0099) en ten bewijze daarvan vergezeld gaan
      van:

        - een begeleidend handelsdocument overeenkomstig artikel 3, onderdeel A, sub 9, onder b, punt i, van [richtlijn
      77/99/EEG](31977L0099), dan wel
        - indien het om producten gaat die zijn verkregen van vlees afkomstig uit een slachthuis dat is gelegen in
      een gebied of een zone waarvoor om veterinairrechtelijke redenen beperkingen gelden, of van vlees als bedoeld
      in artikel 6 van [richtlijn 64/433/EEG](31964L0433), dan wel om producten die voor een andere Lid-Staat zijn
      bestemd na doorvoer via een derde land in een met een loodje verzegeld vervoermiddel, een keuringscertificaat
      overeenkomstig bijlage D, behorend bij richtlijn 77/99/EEG, met dien verstande echter dat, in afwijking hiervan
        - voor zover het betreft producten als bedoeld in het tweede subonderdeel in hermetisch gesloten recipiënten die
      de in de hoofdstuk VIII, punt B, van bijlage B, behorend bij richtlijn 77/99/EEG, bedoelde behandeling hebben
      ondergaan, als bewijsstuk wordt aangewezen het in het eerste subonderdeel bedoelde handelsdocument;

      b.

      c. die bedoeld zijn in de Richtlijn van de Raad van de Europese Gemeenschappen van 12 april 1983, nr. 83/201/
      EEG (PbEG L 112), houdende afwijking van [Richtlijn 77/99/EEG](31977L0099) van de Raad ten aanzien van sommige
      producten die andere levensmiddelen bevatten en die voor een gering percentage uit vlees of vleesproducten
      zijn samengesteld, en die voorzien zijn van een keurmerk als bedoeld in artikel 5 van [richtlijn 83/201/EEG]
      (31983L0201);

      d. mits voldaan is aan [verordening 136/2004/EG](32004R0136) en de [artikelen 6b tot en met 6e][ref2].

      2 Het eerste lid is van overeenkomstige toepassing op Noorwegen, met dien verstande dat in onderdeel d wordt
      gelezen: mits is voldaan aan het bepaalde in de [artikelen 6f tot en met 6j][ref3].


