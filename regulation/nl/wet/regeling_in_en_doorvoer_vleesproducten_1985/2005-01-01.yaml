  - number: 6a
    text: |-
      Het in [artikel 3][ref1] gesteld verbod geldt voorts niet voor de doorvoer van producten bestemd voor een derde
      land, mits

      a. de partij producten vergezeld gaat van een bij de partij behorend document, waaruit, indien de partij afkomstig
      is uit een derde land, tenminste de oorsprong van de zending kan worden afgeleid en, indien de partij via het
      grondgebied van een lid-staat naar Nederland is verzonden, tevens, voorzover van toepassing, wordt voldaan aan
      [verordening 136/2004/EG](32004R0136) en de [artikelen 6h][ref2] en [6j][ref3];

      b. voorzover de partij afkomstig is uit een derde land en rechtstreeks naar Nederland is verzonden, voorzover van
      toepassing, tevens is voldaan aan [verordening 136/2004/EG](32004R0136) en de [artikelen 6f][ref4], [6g][ref5],
      en [6i][ref6].


