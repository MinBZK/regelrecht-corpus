        artikel: 6f
        paragraaf: '5'
  - number: 6j
    text: |-
      1 Bij het vervoer op Nederlands grondgebied in het kader van doorvoer van een uit derde landen afkomstige partij
      producten, die via het grondgebied van een lid-staat naar Nederland is verzonden, naar een derde land, moet de
      partij producten vergezeld gaan van het document, bedoeld in [artikel 6a][ref1], en van een Gemeenschappelijk
      veterinair document van binnenkomst als bedoeld in [verordening 282/2004/EG](32004R0282), waarin is aangegeven
      langs welke grensinspectiepost als bedoeld in artikel 2, tweede lid, onderdeel g, van [richtlijn 97/78/EG]
      (31997L0078) de partij producten de Europese Gemeenschap verlaat.

      2 Het vervoer van de in het eerste lid bedoeld partij producten geschiedt onder douanetoezicht tot op de plaats
      waar het Nederlands grondgebied wordt verlaten in verzegelde voertuigen of verzegelde containers en zonder
      splitsing of, tenzij de partij overeenkomstig het derde lid wordt opgeslagen, lossing van de partij.

      3 Op de in het eerste lid bedoelde partij producten zijn de [artikelen 2.23][ref2], [2.23a][ref3], [2.23c][ref4]
      en [2.23e van de Regeling keuring en handel dierlijke producten][ref5] van overeenkomstige toepassing, met dien
      verstande opslag in een van de in [artikel 2.23a][ref6] genoemde opslagruimten is toegestaan, mits elders geen
      opslag heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003776#Artikel6a
