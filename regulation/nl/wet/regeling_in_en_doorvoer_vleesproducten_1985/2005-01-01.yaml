  - number: '6'
    text: |-
      1 Het in [artikel 3][ref1] gestelde verbod geldt voorts niet voor andere producten van dierlijke oorsprong die
      afkomstig zijn uit een lid-staat of Noorwegen en die vergezeld gaan van een handelsdocument of certificaat als
      bedoeld in artikel 3, onderdeel A, subonderdeel 9, onder b, van [richtlijn 77/99/EEG](31977L0099), waaruit blijkt
      dat is voldaan aan die richtlijn, mits is voldaan aan:

      a. de [artikelen 6b tot en met 6e][ref2], indien de producten afkomstig zijn uit een lid-staat, dan wel

      b. [verordening 136/2004/EG](32004R0136) en de [artikelen 6f tot en met 6j][ref3], indien de producten afkomstig
      zijn uit Noorwegen.

      2 Het in [artikel 3][ref4] gestelde verbod geldt, mits is voldaan aan [verordening 136/2004/EG](32004R0136) en de
      [artikelen 6f tot en met 6j][ref5], voorts niet voor een partij reuzel of gesmolten vet, bestemd voor menselijke
      consumptie, die:

      a. afkomstig is uit een derde land of gedeelte van een derde land, niet zijnde Noorwegen, van waaruit het brengen
      op het grondgebied van de Europese Gemeenschap van vers vlees van de betrokken diersoort is toegestaan op grond van
      beschikking nr. 79/452/EEG van de Commissie van de Europese Gemeenschappen van 21 december 1976 tot vaststelling
      van een lijst van derde landen waaruit de Lid-Staten de invoer van runderen, varkens, paardachtigen, schapen en
      geiten, vers vlees en vleesproducten toestaan (PbEG L 146), en

      b. zodra ter zake door de Commissie van de Europese Gemeenschappen een beschikking op grond van artikel 10, tweede
      lid, van [richtlijn 92/118/EEG](31992L0118) is genomen, vergezeld gaat van een veterinairrechtelijk certificaat,
      overeenkomstig een in die beschikking opgenomen model, en voldoet aan de eisen, bedoeld in dat model.

      3 Het in [artikel 3][ref6] gestelde verbod geldt, mits is voldaan aan [verordening 136/2004/EG](32004R0136) en de
      [artikelen 6f tot en met 6j][ref7], voorts niet voor gedroogde, gezouten of geblancheerde darmen, blazen of magen,
      afkomstig uit een derde land of gedeelte van een derde land, niet zijnde Noorwegen, van waaruit het brengen op het
      grondgebied van de Europese Gemeenschap is toegestaan op grond van beschikking (EG) nr. 2003/779 van de Commissie
      van de Europese Gemeenschappen van 31 oktober 2003 (PbEU L 285) tot vaststelling van de veterinairrechtelijke
      voorschriften en de voorschriften inzake veterinaire certificering voor de invoer van darmen van dieren uit derde
      landen, mits de partij vergezeld gaat van het gezondheidscertificaat, bedoeld in die beschikking.

      4 Het in [artikel 3][ref8] gestelde verbod geldt, mits is voldaan aan [verordening 136/2004/EG](32004R0136) en
      de [artikelen 6f tot en met 6j][ref9], voorts niet voor een partij uit een derde land, niet zijnde Noorwegen,
      afkomstige, verwerkte dierlijke eiwitten, bestemd voor menselijke voeding, die:

      a. vergezeld gaat van het gezondheidscertificaat, bedoeld in hoofdstuk 6, onderdeel I, subonderdeel B, onder 1, van
      bijlage I van [richtlijn 92/118/EEG](31992L0118), dat de aldaar bedoelde verklaringen bevat en

      b. overigens voldoet aan hetgeen omtrent de invoer uit derde landen is bepaald in het hoofdstuk, bedoeld in
      onderdeel a.


