  - number: 6k
    text: |-
      1 Indien wordt vermoed of geconstateerd dat in de zending verwekkers van ziekten, zoönosen of andere aandoeningen
      aanwezig zijn of dat de zending afkomstig is uit een met een epidemische dierziekte besmet gebied, kan de Minister
      gelasten dat de zending overeenkomstig zijn aanwijzingen in tijdelijke afzondering wordt geplaatst, dan wel wordt
      de zending vernietigd of voor andere doeleinden gebruikt dan waarvoor ze zijn bestemd, al naar gelang de Minister
      daaromtrent heeft besloten en met inachtneming van diens aanwijzingen.

      2 Indien aan de hand van de op grond van deze regeling uitgevoerde controles wordt vastgesteld dat een voor
      Nederland of een lidstaat bestemd product niet voldoet aan de op grond van deze regeling voor dat product gestelde
      voorschriften of dat een onregelmatigheid is begaan, besluit de Minister in overleg met de belanghebbende bij de
      lading:

      a. dat het product in ieder geval binnen 60 dagen nadat is geconstateerd dat niet aan de onderhavige regeling wordt
      voldaan vanuit de grensinspectiepost met hetzelfde vervoermiddel wordt teruggezonden naar een derde land indien
      veterinairrechtelijke of gezondheidsredenen zich daar niet tegen verzetten;

      b. indien terugzending als bedoeld in onderdeel a onmogelijk is of de in dat onderdeel bedoelde termijn is
      verstreken, dat de partij wordt vernietigd overeenkomstig het bepaalde in artikel 17, tweede lid, onderdeel b, van
      [richtlijn 97/78/EG](31997L0078);

      c. dat de partij voor andere doeleinden dan de menselijke consumptie wordt gebruikt.

      3 Indien een partij in Nederland is gebracht zonder dat, voorzover van toepassing, die partij is onderworpen
      aan de in [artikel 6f][ref1] bedoelde controles, besluit de Minister dat de partij overeenkomstig het tweede
      lid, onderdeel b, wordt vernietigd of wordt teruggezonden naar een derde land indien veterinairrechtelijke of
      gezondheidsredenen zich daar niet tegen verzetten.

      4 In afwachting van de terugzending of de vernietiging van een partij als bedoeld in het eerste, tweede en derde
      lid wordt de partij onder toezicht van de ambtenaar in tijdelijke afzondering geplaatst en opgeslagen.

      5 Alle kosten die in verband met de in dit artikel bedoelde maatregelen worden gemaakt, komen ten laste van de
      belanghebbende bij de lading.


      [ref1]: https://wetten.overheid.nl/BWBR0003776#Artikel6f
    url: https://wetten.overheid.nl/BWBR0003776/2005-01-01#Artikel6k
