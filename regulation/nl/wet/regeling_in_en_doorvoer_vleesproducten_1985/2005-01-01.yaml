  - number: 6c
    text: |-
      1 De handelaar die overeenkomstig het bepaalde in [artikel 6b, tweede lid][ref1], is geregistreerd, moet:

      a. tenzij met de Minister anders is overeengekomen, van elke aanvoer van een partij producten, bedoeld in
      [artikel 6b, eerste lid][ref2], tussen 08.00 uur en 17.00 uur en ten laatste op de dag, niet zijnde een zaterdag,
      zondag of algemeen erkende feestdag voorafgaande aan de dag van aankomst op de plaats waar de handelaar de partij
      producten ontvangt, kennisgeven of doen kennisgeven aan de VWA, onder opgave van deze plaats, het vermoedelijke
      tijdstip van aankomst alsmede van de hoeveelheid en de soort producten;

      b. de instructies van de ambtenaar in verband met een veterinairrechtelijke controle opvolgen en is
      desgevraagd verplicht de aangevoerde partij producten aan de ambtenaar ten onderzoek aan te bieden en de in de
      [artikelen 4][ref3], [4a][ref4] en [6][ref5] bedoelde, voor invoer uit lid-staten voorgeschreven, documenten
      te overleggen alsmede om alle medewerking te verlenen en alle inlichtingen te verstrekken die voor deze controle
      noodzakelijk worden geacht;

      c. een administratie voeren waarin ten minste de leveringen van producten en de eventuele verdere bestemming van
      de producten zijn vermeld en waarin alle op de partijen producten betrekking hebbende bescheiden, en met name de in
      onderdeel b bedoelde documenten, zijn opgenomen;

      d. de vorenbedoelde administratie gedurende ten minste drie jaren bewaren;

      e. voorafgaand aan de ontvangst, onderscheidenlijk de verdere verdeling of verhandeling van elke partij producten,
      nagaan of aan de voorwaarden, gesteld in de [artikelen 4][ref6], [4a][ref7] en [6][ref8], voor zover deze
      betrekking hebben op de invoer van producten uit lid-staten, is voldaan;

      f. nalatigheden en onregelmatigheden met betrekking tot een levering van een partij producten onmiddellijk melden
      aan de VWA.

      2 Indien een handelaar zijn in het eerste lid bedoelde verplichtingen niet nakomt, of in strijd handelt met
      [artikel 5:20 van de Algemene wet bestuursrecht][ref9], kan de staatssecretaris van Landbouw, Natuurbeheer en
      Visserij beslissen dat zijn in [artikel 7b, tweede lid][ref10], bedoelde registratie wordt doorgehaald dan wel niet
      wordt erkend.


