    text: |-
      In deze regeling wordt verstaan onder:




              *Minister:*


              Minister van Landbouw, Natuurbeheer en Visserij;




              *ambtenaar:*


              ambtenaar als bedoeld in [artikel 114, tweede lid, van de Gezondheids- en welzijnswet voor dieren][ref1];



            officiële dierenarts:

              door de bevoegde centrale autoriteit van het land van verzending aangewezen dierenarts;




              [richtlijn 80/215/EEG](31980L0215):

              richtlijn van de Raad van de Europese Gemeenschappen van 28 januari 1980 inzake veterinairrechtelijke
      vraagstukken op het gebied van het intracommunautaire handelsverkeer in vleesproducten (PbEG L 47);.




              [richtlijn 89/662/EEG](31989L0662):

              richtlijn van de Raad van de Europese Gemeenschappen van 11 december 1989 inzake veterinaire controles
      in het intracommunautaire handelsverkeer in het vooruitzicht van de totstandbrenging van de interne markt (PbEG
      L 395);




              [richtlijn 97/78/EG](31997L0078):

              [richtlijn nr. 97/78/EG](31997L0078) van de Raad van de Europese Unie van 18 december 1997 tot vaststelling
      van de beginselen voor de organisatie van de veterinaire controles voor producten die uit derde landen in de
      Gemeenschap worden binnengebracht (PbEG 1998, L 24);




              *verordening 999/2001/EG:*


              [verordening (EG) nr. 999/2001](32001R0999) van het Europees Parlement en de Raad van de Europese Unie
      van 22 mei 2001 houdende vaststelling van voorschriften inzake preventie, bestrijding en uitroeiing van bepaalde
      overdraagbare spongiforme encefalopathieën (PbEG L 147);




              *verordening 136/2004/EG:*


              [verordening (EG) nr. 136/2004](32004R0136) van de Commissie van de Europese Gemeenschappen van 22 januari
      2004 tot vaststelling van procedures voor de veterinaire controles in de grensinspectieposten van de Gemeenschap
      bij het binnenbrengen van producten uit derde landen (PbEU L 21);



            inspectiepost:

              op Nederlands grondgebied gelegen inspectiepost aan de grens die voldoet aan de bij of krachtens artikel
      6 van [richtlijn 97/78/EG](31997L0078) gestelde voorschriften en uit dien hoofde overeenkomstig dat artikel is
      aangewezen en erkend voor de controle van bepaalde soorten producten; belanghebbende bij de lading: belanghebbende
      bij de lading als bedoeld in artikel 2, tweede lid, onderdeel e, van [richtlijn 97/78/EG](31997L0078);



            lid-staat:

              staat, niet zijnde Nederland, die als lid deel uitmaakt van de Europese Gemeenschappen;



            derde land:

              land, niet zijnde Nederland en niet zijnde een lid-staat;



            partij:

              hoeveelheid producten van dezelfde aard waarvoor eenzelfde certificaat of document, voor zover dit op grond
      van de onderhavige regeling is voorgeschreven, geldt, die met hetzelfde vervoermiddel wordt vervoerd en afkomstig
      is uit hetzelfde derde land of gedeelte van een derde land;



            handelaar:

              elke natuurlijke persoon of rechtspersoon, zijnde de eerste ontvanger op Nederlands grondgebied van een
      partij producten afkomstig uit een lid-staat.




              *richtlijn 77/99/EEG:*


              richtlijn van de Raad van de Europese Gemeenschappen betreffende de gezondheidsvoorschriften voor de
      produktie en het in de handel brengen van vleesproducten en bepaalde andere producten van dierlijke oorsprong (PbEG
      1977, L 26 en PbEG 1992, L 57);




              *vleesproducten:*


              vleesproducten als bedoeld in artikel 2, onderdeel a, aanhef, van [richtlijn 77/99/EEG](31977L0099),
      niet zijnde vlees onderscheidenlijk producten als bedoeld in [artikel 2, onderdeel a, sub i][ref2] en ii, van die
      richtlijn;




              *andere producten van dierlijke oorsprong:*


              producten als bedoeld in artikel 2, onderdeel b, van [richtlijn 77/99/EEG](31977L0099).



             producten:

              vleesproducten of andere producten van dierlijke oorsprong;




              *VWA:*


              Voedsel en Waren Autoriteit, ingesteld bij besluit van de Minister van Volksgezondheid, Welzijn en Sport
      van 8 juli 2002 (Stcrt. 127);



            douane-entrepot:

              opslagruimte als bedoeld in [verordening (EEG) nr. 2503/88](31988R2503) van de Raad van de Europese
      Gemeenschappen van 25 juli 1988 betreffende de douane-entrepots (PbEG L 225);



            vrij entrepot:

              opslagruimte als bedoeld in artikel 1, vierde lid, onder b, van [verordening (EEG) nr. 2504/88](31988R2504)
      van de Raad van de Europese Gemeenschappen van 25 juli 1988 betreffende de vrije zones en de vrije entrepots (PbEG
      L 225);



            ruimte voor tijdelijke opslag:

              opslagruimte als bedoeld in [verordening (EEG) nr. 4151/88](31988R4151) van de Raad van de Europese
      Gemeenschappen van 21 december 1988 tot vaststelling van de bepalingen die van toepassing zijn op goederen die het
      douanegebied van de Gemeenschap worden binnengebracht (PbEG L 367);



            beschikking 93/242/EEG:

              beschikking van de Commissie van de Europese Gemeenschappen van 30 april 1993 inzake de invoer in de
      Gemeenschap van bepaalde levende dieren en producten daarvan uit bepaalde Europese landen, met betrekking tot mond-
      en klauwzeer (PbEG L 110).




              [richtlijn 91/495/EEG](31991L0495):

              richtlijn van de Raad van de Europese Gemeenschappen van 27 november 1991 inzake gezondheidsvoorschriften
      en veterinairrechtelijke voorschriften voor de produktie en het in de handel brengen van konijnevlees en vlees van
      gekweekt wild (PbEG L 268);




              [richtlijn 92/45/EEG](31992L0045):

              richtlijn van de Raad van de Europese Gemeenschappen van 16 juni 1992 betreffende de
      gezondheidsvoorschriften en veterinairrechtelijke voorschriften voor het doden van vrij wild en het in de handel
      brengen van vlees van vrij wild (PbEG L 268);




              [richtlijn 92/118/EEG](31992L0118):

              richtlijn van de Raad van de Europese Gemeenschappen van 17 december 1992 tot vaststelling van de
      veterinairrechtelijke en de gezondheidsvoorschriften voor het handelsverkeer en de invoer in de Gemeenschap van
      producten waarvoor ten aanzien van deze voorschriften geen specifieke communautaire wetgeving geldt als bedoeld in
      bijlage A, hoofdstuk I, van [richtlijn 89/662/EEG](31989L0662), en, wat ziekteverwekkers betreft, van [richtlijn
      90/425/EEG](31990L0425) (PbEG 1993, L 62);



            beschikking 94/86/EG:

              beschikking van de Commissie van de Europese Gemeenschappen van 16 februari 1994 tot vaststelling van de
      voorlopige lijst van derde landen waaruit de Lid-Staten de [invoer van vlees][ref3] van vrij wild toestaan (PbEG
      L 44);



            beschikking 95/357/EG:

              beschikking van de Commissie van de Europese Gemeenschappen van 26 juli 1995 tot vaststelling van de lijst
      van inspectieposten aan de grens die zijn erkend voor de veterinaire controles van producten en dieren uit derde
      landen, tot vaststelling van uitvoeringsbepalingen inzake de door de veterinaire deskundigen van de Commissie te
      verrichten controles en tot intrekking van Beschikking 94/24/EG (PbEG L 211);



             beschikking 96/105/EG:

              beschikking van de Commissie van de Europese Gemeenschappen van 29 januari 1996 inzake nieuwe
      overgangsmaatregelen om de overgang naar de bij [Richtlijn 90/675/EEG](31990L0675) van de Raad vastgestelde
      regeling inzake veterinaire controles te vergemakkelijken (PbEG L 24);



             beschikking 97/41/EG:

              beschikking van de Commissie van de Europese Gemeenschappen van 18 december 1996 tot vaststelling van de
      gezondheidsvoorschriften en het gezondheidscertificaat voor de invoer uit derde landen van vleesproducten die zijn
      verkregen met vlees van pluimvee, vlees van gekweekt wild vlees van vrij wild en konijnenvlees (PbEG L 17);



            beschikking 97/222/EG:

              beschikking (EG) nr. 97/222 van de Commissie van de Europese Gemeenschappen van 28 februari 1997 tot
      vaststelling van de lijst van derde landen waaruit de lidstaten de invoer toestaan van vleesproducten (PbEG L 89);



            beschikking 2004/280/EG:

              Beschikking (EG) nr. 2004/280 van de Commissie van de Europese Gemeenschappen van 19 maart 2004 tot
      vaststelling van overgangsmaatregelen voor het in de handel brengen van bepaalde producten van dierlijke oorsprong,
      verkregen in Tsjechië, Estland, Cyprus, Letland, Litouwen, Hongarije, Malta, Polen, Slovenië en Slowakije (PbEU
      L 87);



            vers vlees:

              alle voor menselijke consumptie geschikte delen van vee als bedoeld in [artikel 66 van de Veewet][ref4],
      niet zijnde gekweekt wild, die geen behandeling hebben ondergaan ter bevordering van de houdbaarheid, tenzij het
      een koelbehandeling betreft;



            konijnen:

              tamme konijnen;



            konijnevlees:

              alle voor menselijke consumptie geschikte delen van konijnen;



            hazen:

              tamme hazen;



            hazevlees:

              alle voor menselijke consumptie geschikte delen van hazen;



            vlees van gekweekt wild:

              alle voor menselijke consumptie geschikte delen van gekweekt wild;



            gekweekt wild:

              landzoogdieren als bedoeld in artikel 2, onderdeel 3, van [richtlijn 91/495/EEG](31991L0495), niet zijnde
      konijnen of hazen;



            vrij wild:

              landzoogdieren en vogels als bedoeld in artikel 2, eerste lid, onderdeel a, van [richtlijn 92/45/EEG]
      (31992L0045);



            vlees van vrij wild:

              alle voor menselijke consumptie geschikte delen van vrij wild.


