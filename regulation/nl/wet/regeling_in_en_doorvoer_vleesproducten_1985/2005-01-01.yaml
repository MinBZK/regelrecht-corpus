  - number: 4a
    text: |-
      In afwijking van [artikel 4, eerste lid, aanhef en onderdeel a][ref1], mogen vleesproducten van vrij wild, gekweekt
      wild, konijnen of hazen die afkomstig zijn uit Tsjechië, Estland, Cyprus, Letland, Litouwen, Hongarije, Malta,
      Polen, Slovenië of Slowakije en vóór 1 mei 2004 zijn verkregen in een inrichting die erkend was voor uitvoer naar
      de Europese Gemeenschap, tot en met 30 april 2005 voorzien zijn van het keurmerk, bedoeld in artikel 3, onderdeel
      a, van beschikking 2004/280/EG, mits het certificaat of document dat de vleesproducten vergezelt, door de bevoegde
      autoriteiten van het land van herkomst is voorzien van de verklaring: ‘Vóór 1 mei 2004 geproduceerd overeenkomstig
      Beschikking 2004/280/EG van de Commissie.’


      [ref1]: https://wetten.overheid.nl/BWBR0003776#Artikel4
    url: https://wetten.overheid.nl/BWBR0003776/2005-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0003776
        artikel: '4'
        paragraaf: '2'
  - number: '5'
    text: |-
      1 Het in [artikel 3][ref1] gestelde verbod geldt, mits is voldaan aan [verordening 136/2004/EG](32004R0136) en
      de [artikelen 6f tot en met 6j][ref2], niet voor de in- en doorvoer van een partij vleesproducten vervaardigd
      van vers vlees, vlees van vrij of gekweekt wild, dan wel vlees van konijnen of tamme hazen, die afkomstig zijn
      uit een derde land of gedeelte van een derde land dat voor de betrokken diersoort waarvan het vlees afkomstig is,
      staat vermeld op de lijst, opgenomen in de bijlagen I en II bij beschikking 97/222/EG, en die voldoet aan de in
      voornoemde beschikking opgenomen eisen ten aanzien van het derde land respectievelijk gedeelte van het derde land
      van herkomst.

      2 Een partij vleesproducten als bedoeld in het eerste lid gaat vergezeld van een op de partij betrekking hebbend
      gezondheidscertificaat waarvan het model overeenstemt met het model, vastgesteld in de bijlage bij beschikking
      97/221/EG, en voldoet aan de voorwaarden en eisen die in voornoemde beschikking en in vorenbedoeld certificaat
      zijn opgenomen.

      3 Een partij vleesproducten als bedoeld in het eerste lid gaat bovendien, voor zover zij afkomstig zijn van vlees
      van vrij of gekweekt wild, dan wel vlees van konijnen of tamme hazen, vergezeld van een op de partij betrekking
      hebbend gezondheidscertificaat waarvan het model overeenstemt met het model, vastgesteld in de bijlage bij
      beschikking 97/41/EG, en voldoet aan de voorwaarden en eisen die in voornoemde beschikking en in vorenbedoeld
      certificaat zijn opgenomen.

      4 Het gezondheidscertificaat, bedoeld in het tweede lid, voldoet, voor zover van toepassing, aan bijlage XI,
      hoofdstuk D, punt 4, van [verordening 999/2001/EG](32001R0999).

      5 Een partij vleesproducten als bedoeld in het derde lid, is afkomstig uit een inrichting die, zodra deze is
      vastgesteld en in werking getreden, voorkomt op de voor de betrokken vleesproducten uit het betrokken land van
      herkomst geldende voorlopige lijst van inrichtingen als bedoeld in beschikking 95/408/EG van de Raad van de
      Europese Unie van 22 juni 1995 tot vaststelling van voorschriften voor het opstellen voor een overgangsperiode
      van voorlopige lijsten van inrichtingen in derde landen waaruit de lid-staten bepaalde producten van dierlijke
      oorsprong, visserijproducten en levende tweekleppige weekdieren mogen invoeren (PbEG L 243), die alsdan ter inzage
      ligt in de bibliotheek van het Ministerie van Landbouw, Natuurbeheer en Visserij Den Haag, met dien verstande
      dat indien bij de vaststelling van voornoemde lijst is voorzien in overgangsbepalingen de vleesproducten met
      inachtneming van die bepalingen afkomstig mogen zijn uit een inrichting die voldoet aan de voorschriften van
      hoofdstuk 1 van bijlage II van [richtlijn 92/118/EEG](31992L0118).

      6 Onverminderd het tweede tot en met vierde lid is, zolang de voorschriften voor het op het grondgebied van de
      Europese Gemeenschap brengen van vleesproducten vanuit derde landen niet of slechts gedeeltelijk ingevolge de
      regelgeving van de Europese Gemeenschap zijn vastgesteld, de doorvoer van vleesproducten die zijn bestemd voor een
      lid-staat, slechts toegestaan indien is voldaan aan de voorschriften van de lid-staat van bestemming.

      7 De vleesproducten zijn niet verkregen van of met vlees van landbouwhuisdieren als bedoeld in artikel 1 van
      [richtlijn 96/22/EG](31996L0022) van de Raad van de Europese Gemeenschappen van 29 april 1996 betreffende het
      gebruik, in de veehouderij, van bepaalde stoffen met thyreostatische werking, alsmede van ß-agonisten en tot
      intrekking van de [Richtlijnen 81/602/EEG](31981L0602), [88/146/EEG](31988L0146) en [88/299/EEG](31988L0299)
      (PbEG L 125), waaraan stoffen of producten zijn toegediend die ingevolge artikel 3, onderdeel a, van die richtlijn
      niet aan landbouwhuisdieren mogen worden toegediend, tenzij aan de voorwaarden ingevolge artikel 11 van genoemde
      richtlijn is voldaan.


