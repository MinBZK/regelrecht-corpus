  - number: 6f
    text: |-
      1 De partij producten, afkomstig uit een derde land, die rechtstreeks uit dat derde land in Nederland wordt in- of
      doorgevoerd, wordt aangevoerd via een inspectiepost.

      2 De melding van de aanvoer van een partij vindt plaats aan de VWA overeenkomstig artikel 2 van [verordening
      136/2004/EG](32004R0136).

      3 Bij de aankomst op de inspectiepost wordt de ambtenaar door de belanghebbende bij de lading het op grond van
      [artikel 4, eerste lid][ref1], alsmede de [artikelen 5 tot en met 6a][ref2], voor de in- en doorvoer van producten
      afkomstig uit derde landen voorgeschreven document ter beschikking gesteld.

      4 De partij producten wordt door de belanghebbende bij de lading bij aankomst op de inspectiepost ter onderzoek
      aangeboden aan de Minister.

      5 De in het derde lid bedoeld documenten zijn originelen waarvan de geldigheidsduur niet is verstreken. Zij zijn,
      voorzover van toepassing, in overeenstemming met de regelgeving van de Europese Gemeenschap opgesteld en afgegeven,
      volledig ingevuld, gedagtekend en ondertekend.

      6 Op de in het eerste lid bedoelde partij producten zijn de [artikelen 2.17, zesde tot en met twaalfde lid][ref3],
      en [2.17a tot en met 2.23m, van de Regeling keuring en handel dierlijke producten][ref4] van overeenkomstige
      toepassing.

      7 Voor de toepassing van de in het zesde lid bedoelde artikelen wordt voor ‘keuringsdierenarts’ gelezen: Minister.

      8 Indien de in het eerste lid bedoelde partij bestaat uit vleesproducten vervaardigd van vlees van runderen,
      schapen of geiten of bestaat uit gezouten, gedroogde of verhitte darmen afkomstig van betreffende dieren, is
      voldaan aan bijlage XI, hoofdstuk A, punt 15, van [verordening 999/2001/EG](32001R0999).

      9 Indien de in het eerste lid bedoeld partij bestaat uit producten als bedoeld in artikel 2, onderdeel b, van
      [richtlijn 77/99/EG](31977L0099), vervaardigd van vlees afkomstig van runderen, schapen of geiten, is voldaan aan
      bijlage XI, hoofdstuk A, punt 15, van [verordening 999/2001/EG](32001R0999).


      [ref1]: https://wetten.overheid.nl/BWBR0003776#Artikel4
