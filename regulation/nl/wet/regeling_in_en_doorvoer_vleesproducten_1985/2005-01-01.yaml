  - number: 6l
    text: |-
      De Minister van Landbouw, Natuurbeheer en Visserij kan ontheffing verlenen van het in [artikel 3][ref1] gestelde
      verbod.

      Aan een ontheffing kunnen voorschriften worden verbonden. Een ontheffing kan onder beperkingen worden verleend.


