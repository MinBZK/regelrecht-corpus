  - number: 6d
    text: |-
      Bij het vervoer op Nederlands grondgebied in het kader van doorvoer van een uit de lid-staten afkomstige partij
      producten, naar een lid-staat moet de partij producten voldoen aan de op de doorvoer van producten afkomstig uit
      lid-staten betrekking hebbende voorwaarden, gesteld in de [artikelen 4][ref1], [4a][ref2] en [6][ref3].


