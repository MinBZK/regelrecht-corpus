  - number: 6i
    text: |-
      1 Bij de in- of doorvoer van een partij producten die door een derde land zijn geweigerd en vanuit het grondgebied
      van de Europese Gemeenschap naar het betrokken derde land zijn verzonden, wordt voldaan aan:

      a. [artikel 6f, eerste, tweede en vierde lid][ref1];

      b. artikel 15, eerste lid, onderdeel a, van [richtlijn 97/78/EG](31997L0078).

      2 Op de in het eerste lid bedoelde partij producten zijn de artikelen 2.17, achtste en twaalfde lid, 2.18a, 2.19,
      eerste lid, en 2.22, eerste, tweede, vijfde en zesde lid, van de Regeling keuring en handel dierlijke producten van
      overeenkomstige toepassing.

      3 Indien de in het eerste lid bedoelde partij producten naar het derde land is verzonden vanuit een lid-staat,
      heeft de Minister vooraf toestemming verleend voor het binnenbrengen van de producten en heeft de bevoegde
      autoriteit van de lid-staat die het in artikel 15, eerste lid, onderdeel a, van [richtlijn 97/78/EG](31997L0078)
      bedoelde certificaat heeft afgegeven met de terugname van de partij ingestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0003776#Artikel6f
    url: https://wetten.overheid.nl/BWBR0003776/2005-01-01#Artikel6i
    references:
