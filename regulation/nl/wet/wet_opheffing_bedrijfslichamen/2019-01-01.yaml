  - number: XLII
    text: |-
      1 Op grond van [artikel 127, eerste lid, van de Wet op de bedrijfsorganisatie][ref1] uitgevaardigde dwangbevelen
      behouden hun rechtskracht. Artikel 127, vierde, vijfde en zesde lid, van de Wet op de bedrijfsorganisatie zoals dat
      luidde onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van [artikel II, onderdeel D][ref2], van deze
      wet, is van toepassing.

      2 Onze Minister kan de bedragen die onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van
      [artikel II, onderdeel D][ref3], van deze wet ter zake van heffingen aan een bedrijfslichaam waren verschuldigd
      en waarvoor nog geen dwangbevel als bedoeld in het eerste lid was uitgevaardigd, en de bedragen die krachtens
      [artikel XLI, tweede, derde of vierde lid][ref4], zijn verschuldigd, verhoogd met de kosten van de invordering, bij
      dwangbevel invorderen. [Artikel 127, derde, vierde, vijfde en zesde lid, van de Wet op de bedrijfsorganisatie][ref5]
      zoals dat luidde onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van artikel II, onderdeel D, van
      deze wet, is van toepassing, met dien verstande dat in plaats van «het betrokken bedrijfslichaam» wordt gelezen:
      Onze Minister van Landbouw, Natuur en Voedselkwaliteit.

      3 Aanmaningen verzonden door de bedrijfslichamen worden met ingang van het tijdstip van inwerkingtreding van
      [artikel II, onderdeel D][ref6], van deze wet beschouwd als aanmaningen verzonden door Onze Minister.


