  - number: XLVII
    text: |-
      Indien na de beëindiging van de vereffening van het vermogen van een bedrijfslichaam een batig saldo resteert,
      draagt Onze Minister er zorg voor dat het saldo een bestemming krijgt die ten nutte komt van het deel van het
      bedrijfsleven dat betrokken was bij het desbetreffende bedrijfslichaam.
    url: https://wetten.overheid.nl/BWBR0036083/2019-01-01#ArtikelXLVII
  - number: XLVIII
    text: |-
      1 De tuchtgerechten van de bedrijfslichamen blijven in functie voor de afhandeling van, en voor de duur van, zaken
      die overtredingen betreffen waarvoor een berechtingsrapport is opgemaakt voor het tijdstip van inwerkingtreding van
      [artikel II, onderdeel D][ref1], van deze wet.

      2 Op de tuchtgerechten van de bedrijfslichamen, de behandeling van zaken als bedoeld in het eerste lid
      en het hoger beroep tegen uitspraken van de tuchtgerechten van bedrijfslichamen in zaken als bedoeld in
      het eerste lid, is met ingang van het tijdstip van inwerkingtreding van [artikel X][ref2] van deze wet
      de [Wet tuchtrechtspraak bedrijfsorganisatie 2004][ref3] van toepassing zoals die wet luidde onmiddellijk
      voorafgaand aan het tijdstip dat die wet werd ingetrokken, met dien verstande dat voor de toepassing van de Wet
      tuchtrechtspraak bedrijfsorganisatie 2004 in die gevallen:

      a. in plaats van «de voorzitter van het bedrijfslichaam die de vordering aanhangig heeft gemaakt» wordt gelezen:
      Onze Minister van Landbouw, Natuur en Voedselkwaliteit;

      b. in plaats van «het bedrijfslichaam» wordt gelezen: Onze Minister van Landbouw, Natuur en Voedselkwaliteit;

      c. in plaats van «het bestuur van het betrokken bedrijfslichaam» wordt gelezen: Onze Minister van Landbouw, Natuur
      en Voedselkwaliteit;

      d. in plaats van «het betrokken bedrijfslichaam» wordt gelezen: Onze Minister van Landbouw, Natuur en
      Voedselkwaliteit;

      e. in plaats van «de voorzitter van het bedrijfslichaam» wordt gelezen: Onze Minister van Landbouw, Natuur en
      Voedselkwaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0036083#ArtikelII
      [ref2]: https://wetten.overheid.nl/BWBR0036083#ArtikelX
