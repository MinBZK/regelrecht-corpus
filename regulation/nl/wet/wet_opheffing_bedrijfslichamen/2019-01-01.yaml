  - number: L
    text: |-
      Indien door een bedrijfslichaam voorafgaand aan het tijdstip van inwerkingtreding van
      [artikel II, onderdeel D][ref1], van deze wet een beschikking tot subsidieverlening is gegeven en voor de
      desbetreffende subsidie nog geen beschikking tot subsidievaststelling is gegeven, is Onze Minister bevoegd de
      beschikking tot subsidievaststelling te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0036083#ArtikelII
    url: https://wetten.overheid.nl/BWBR0036083/2019-01-01#ArtikelL
    references:
      - id: ref1
        bwb_id: BWBR0036083
        artikel: II
        hoofdstuk: '2'
  - number: LI
    text: |-
      Dwangsommen als bedoeld in [artikel 4:17 van de Algemene wet bestuursrecht][ref1], waarvoor Onze Minister
      binnen zes weken na het tijdstip van inwerkingtreding van [artikel II, onderdeel D][ref2], van deze wet een
      ingebrekestelling ontvangt, komen ten laste van het vermogen van het bedrijfslichaam indien op het tijdstip van
      inwerkingtreding van artikel II, onderdeel D, van deze wet de beschikking door het bedrijfslichaam niet tijdig was
      gegeven en het verbeuren van de dwangsom aan het bedrijfslichaam te wijten is.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel417
      [ref2]: https://wetten.overheid.nl/BWBR0036083#ArtikelII
    url: https://wetten.overheid.nl/BWBR0036083/2019-01-01#ArtikelLI
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:17
      - id: ref2
        bwb_id: BWBR0036083
        artikel: II
        hoofdstuk: '2'
  - number: LII
    text: |-
      Het [Besluit opheffing Landbouwschap][ref1], zoals dat luidde onmiddellijk voorafgaand aan het tijdstip van
      inwerkingtreding van [artikel II, onderdeel D][ref2], van deze wet blijft van toepassing op de vereffening van
      het vermogen van het Landbouwschap tot het tijdstip waarop de in [artikel 9, vierde lid, van dat besluit][ref3]
      bedoelde openbare kennisgeving is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011674
      [ref2]: https://wetten.overheid.nl/BWBR0036083#ArtikelII
      [ref3]: https://wetten.overheid.nl/BWBR0011674#Artikel9
    url: https://wetten.overheid.nl/BWBR0036083/2019-01-01#ArtikelLII
    references:
