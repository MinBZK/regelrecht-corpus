  - number: XLIX
    text: |-
      1 In wettelijke procedures en rechtsgedingen, waarbij een bedrijfslichaam is betrokken, treedt op het tijdstip
      van inwerkingtreding van [artikel II, onderdeel D][ref1], van deze wet Onze Minister in de plaats van het
      bedrijfslichaam.

      2 Onze Minister treedt voorts in de plaats van de bedrijfslichamen in wettelijke procedures en rechtsgedingen die
      aanvangen na het tijdstip van inwerkingtreding van [artikel II, onderdeel D][ref2], van deze wet.

      3 In zaken waarin voor het tijdstip van inwerkingtreding van [artikel II, onderdeel D][ref3], van deze wet aan de
      Nationale ombudsman is verzocht een onderzoek te doen dan wel de Nationale ombudsman een onderzoek heeft ingesteld
      naar een gedraging die kan worden toegerekend aan een bedrijfslichaam, treedt Onze Minister op dat tijdstip als
      bestuursorgaan in de zin van de [Wet Nationale ombudsman][ref4] in de plaats van het bedrijfslichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0036083#ArtikelII
      [ref2]: https://wetten.overheid.nl/BWBR0036083#ArtikelII
      [ref3]: https://wetten.overheid.nl/BWBR0036083#ArtikelII
      [ref4]: https://wetten.overheid.nl/BWBR0003372
    url: https://wetten.overheid.nl/BWBR0036083/2019-01-01#ArtikelXLIX
