  - number: XXXVIII
    text: |-
      1 Indien krachtens [artikel XXXVII, eerste lid][ref1], baten van de in dat lid, onderdelen c, g, i en
      k, bedoelde bedrijfslichamen overgaan die krachtens een heffing zijn verkregen met het oog op het weren
      of bestrijden van dierziekten, zoönosen of ziekteverschijnselen, worden die baten op het in artikel
      XXXVII, eerste lid, bedoelde tijdstip geboekt op de rekening van het Diergezondheidsfonds, bedoeld in
      [artikel 95a van de Gezondheids- en welzijnswet voor dieren][ref2], voor zover Onze Minister op dat tijdstip regels
      heeft gesteld omtrent het weren of bestrijden van de desbetreffende dierziekte, zoönose of ziekteverschijnsel.

      2 De in het eerste lid bedoelde baten worden uitsluitend benut ten behoeve van het verrichten van betalingen en
      het uitkeren van tegemoetkomingen uit het Diergezondheidsfonds die verband houden met dierziekten, zoönosen of
      ziekteverschijnselen waarvoor die middelen door de betrokken bedrijfslichamen waren bestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0036083#ArtikelXXXVII
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel95a
