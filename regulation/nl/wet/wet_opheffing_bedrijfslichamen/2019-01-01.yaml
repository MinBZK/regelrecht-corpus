    text: |-
      De [Wet van 3 april 1999 tot wijziging van de Wet op de bedrijfsorganisatie en enige andere wetten][ref1] (Stb.
      1999, 253) wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0010389
