  - number: LVIIIa
    text: |-
      Onze Minister van Landbouw, Natuur en Voedselkwaliteit zendt binnen vijf jaar na de inwerkingtreding van
      [artikel II, onderdeel D][ref1], van deze wet aan de Staten-Generaal een verslag over de doeltreffendheid en de
      effecten van deze wet in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0036083#ArtikelII
    url: https://wetten.overheid.nl/BWBR0036083/2019-01-01#ArtikelLVIIIa
