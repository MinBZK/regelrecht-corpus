  - number: XL
    text: |-
      De kosten van de vereffening van het vermogen van een bedrijfslichaam komen ten laste van het vermogen van het
      desbetreffende bedrijfslichaam.
    url: https://wetten.overheid.nl/BWBR0036083/2019-01-01#ArtikelXL
  - number: XLI
    text: |-
      1 De door bedrijfslichamen vastgestelde verordeningen met betrekking tot het vaststellen en opleggen
      van heffingen, die van kracht waren onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van
      [artikel II, onderdeel D][ref1], van deze wet, blijven van kracht totdat de vereffening van het vermogen van het
      desbetreffende bedrijfslichaam is beëindigd.

      2 Na de inwerkingtreding van [artikel II, onderdeel D][ref2], van deze wet oefent Onze Minister de bevoegdheden uit
      tot het opleggen van heffingen die het krachtens de verordening daartoe bevoegde orgaan van het bedrijfslichaam op
      grond van een verordening als bedoeld in het eerste lid toekwamen met dien verstande dat geen heffing kan worden
      opgelegd voor een feit dat heeft plaatsgehad of een periode die is gelegen na het tijdstip van inwerkingtreding van
      artikel II, onderdeel D, van deze wet.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op door bedrijfslichamen vastgestelde verordeningen
      met betrekking tot het vaststellen en opleggen van heffingen die na het tijdstip van inwerkingtreding van
      [artikel II, onderdeel D][ref3], van deze wet door de sociaaleconomische Raad zijn goedgekeurd.

      4 Indien het vermogen van een bedrijfslichaam onvoldoende is om de schulden van het bedrijfslichaam te voldoen,
      kan bij ministeriële regeling aan ondernemingen welke ingevolge het instellingsbesluit van het bedrijfslichaam
      zoals dat luidde op het tijdstip van inwerkingtreding van [artikel II, onderdeel D][ref4], van deze wet onder de
      werkingssfeer van het betrokken bedrijfslichaam vielen, een heffing wordt opgelegd.

      5 In een krachtens het vierde lid vast te stellen regeling kan worden bepaald dat voor daarbij aan te wijzen
      categorieën van ondernemingen verschillende bedragen worden vastgesteld.

      6 Een ministeriële regeling als bedoeld in het vierde lid kan niet worden vastgesteld na beëindiging van de
      vereffening van het vermogen van het desbetreffende bedrijfslichaam.


