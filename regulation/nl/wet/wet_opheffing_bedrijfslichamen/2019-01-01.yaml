preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, met inachtneming van artikel 134, eerste lid, van de Grondwet, dat het
    wenselijk is de bedrijfslichamen op te heffen en taken van de bedrijfslichamen te beleggen bij de centrale
    overheid;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-Generaal
    hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0036083/2019-01-01#ArtikelAanhef
articles:
  - number: I
    text: |-
      Voor de toepassing van de [hoofdstukken 4 tot en met 6][ref1] wordt verstaan onder:

        - *bedrijfslichaam:* bedrijfslichaam als bedoeld in
      [artikel 66, vierde lid, van de Wet op de bedrijfsorganisatie][ref2], zoals dat artikel luidde onmiddellijk
      voorafgaand aan de inwerkingtreding van [artikel II, onderdeel D][ref3], van deze wet;
        - *Onze Minister:* Onze Minister van Landbouw, Natuur en Voedselkwaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0036083#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel66
