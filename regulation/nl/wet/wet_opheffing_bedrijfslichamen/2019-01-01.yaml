  - number: XXXIX
    text: |-
      1 Onze Minister is belast met de vereffening van het vermogen van de in [artikel XXXVII, eerste lid][ref1],
      genoemde bedrijfslichamen.

      2 Het vermogen van ieder bedrijfslichaam wordt afzonderlijk vereffend.

      3 Onze Minister is bevoegd alle rechtshandelingen te verrichten met het oog op de vereffening van het vermogen
      van een bedrijfslichaam, waaronder het vervreemden van onroerende en roerende zaken en het voldoen en innen van
      vorderingen.

      4 Rechtsvorderingen welke tot het vermogen van het bedrijfslichaam behorende rechten of verplichtingen tot
      onderwerp hebben, worden ingesteld door Onze Minister onderscheidenlijk tegen de staat.


      [ref1]: https://wetten.overheid.nl/BWBR0036083#ArtikelXXXVII
