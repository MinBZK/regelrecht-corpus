  - number: LIV
    text: |-
      In [artikel XVIII][ref1] wordt tot 1 januari 2018 voor «benoemd door de daartoe bij reglement aangewezen
      organisaties» gelezen: benoemd door de daartoe bij reglement aangewezen organisaties of, voor zover daarin bij
      reglement nog niet is voorzien, een door Onze Minister aangewezen organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0036083#ArtikelXVIII
    url: https://wetten.overheid.nl/BWBR0036083/2019-01-01#ArtikelLIV
