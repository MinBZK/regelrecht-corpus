        artikel: II
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0011674
        artikel: '9'
  - number: LIII
    text: |-
      De [artikelen 126, zevende lid][ref1], [128][ref2], [133][ref3] en [134 van de Wet op de bedrijfsorganisatie][ref4]
      zoals die luidden onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van artikel II, onderdeel D, van
      deze wet blijven van toepassing op door de bedrijfslichamen voorafgaand aan dat tijdstip vastgestelde verordeningen
      met betrekking tot het vaststellen en opleggen van heffingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel126
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel128
