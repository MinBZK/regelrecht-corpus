  - number: XLIII
    text: |-
      1 Binnen zes maanden na het tijdstip van inwerkingtreding van [artikel II, onderdeel D][ref1],
      van deze wet, stelt Onze Minister voor ieder bedrijfslichaam de rekening der inkomsten en uitgaven
      vast over de periode onmiddellijk voorafgaand aan de opheffing waarover niet met toepassing van
      [artikel 124 van de Wet op de bedrijfsorganisatie][ref2] die rekening is vastgesteld.

      2 Alvorens Onze Minister de rekening der inkomsten en uitgaven vaststelt, legt hij een ontwerp daarvan voor
      onderzoek voor aan een onafhankelijke accountant die is ingeschreven in het accountantsregister, bedoeld in
      [artikel 36 van de Wet op het accountantsberoep][ref3]. Het onderzoek wordt niet opgedragen aan de accountant die
      laatstelijk de interne accountant van het desbetreffende bedrijfslichaam is geweest.

      3 De accountant verricht zijn onderzoek met overeenkomstige toepassing van de voorschriften in de
      [Verordening financiën bedrijfslichamen 2011][ref4] met betrekking tot de jaarrekening en geeft de uitslag
      van zijn onderzoek weer in een controleverklaring omtrent de getrouwheid van de inkomsten en uitgaven.
      [Artikel XL][ref5] is van overeenkomstige toepassing op de kosten van de werkzaamheden van de accountant.

      4 Onze Minister stelt de rekening der inkomsten en uitgaven van een bedrijfslichaam niet eerder vast dan nadat hij
      kennis heeft kunnen nemen van de verklaring van de accountant.

      5 Onze Minister legt de rekening en de controleverklaring van de accountant ter inzage op het Ministerie van
      Landbouw, Natuur en Voedselkwaliteit en doet daarvan mededeling in de Staatscourant.

      6 De in het vierde lid bedoelde vaststelling strekt tot décharge van het dagelijks bestuur van het desbetreffende
      bedrijfslichaam, behoudens in geval van later gebleken valsheid in bewijsstukken of andere onregelmatigheden.


