        artikel: XVIII
        hoofdstuk: '3'
        paragraaf: '6'
  - number: LV
    text: |-
      1 Archiefbescheiden van de bedrijfslichamen betreffende zaken die op grond van deze wet worden behartigd door Onze
      Minister, worden overgedragen aan Onze Minister, voor zover zij niet overeenkomstig de [Archiefwet 1995][ref1] zijn
      overgebracht naar een archiefbewaarplaats.

      2 Archiefbescheiden van de bedrijfslichamen betreffende zaken die betrekking hebben op taken en werkzaamheden
      van een bedrijfslichaam welke op het tijdstip van inwerkingtreding van [artikel II, onderdeel D][ref2], van deze
      wet zijn beëindigd, worden overgedragen aan Onze Minister. Indien zij ingevolge de [Archiefwet 1995][ref3] voor
      blijvende bewaring in aanmerking komen worden zij, zo nodig door tussenkomst van Onze Minister, overeenkomstig de
      Archiefwet 1995 overgebracht naar een archiefbewaarplaats.

      3 Onze Minister is met ingang van het tijdstip van inwerkingtreding van [artikel II, onderdeel D][ref4], van
      deze wet zorgdrager voor de archiefbescheiden die door de bedrijfslichamen ter beschikking zijn gesteld aan
      privaatrechtelijke rechtspersonen.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
      [ref2]: https://wetten.overheid.nl/BWBR0036083#ArtikelII
      [ref3]: https://wetten.overheid.nl/BWBR0007376
      [ref4]: https://wetten.overheid.nl/BWBR0036083#ArtikelII
    url: https://wetten.overheid.nl/BWBR0036083/2019-01-01#ArtikelLV
