  - number: XXXVII
    text: |-
      1 Op het tijdstip van inwerkingtreding van [artikel II, onderdeel D][ref1], van deze wet gaan alle
      vermogensbestanddelen van het:

      a. Hoofdproductschap Akkerbouw,

      b. Productschap Akkerbouw,

      c. Productschap Diervoeder,

      d. Productschap Wijn;

      e. Productschap Dranken,

      f. Productschap Margarine, Vetten en Oliën,

      g. Productschap Pluimvee en Eieren,

      h. Productschap Tuinbouw,

      i. Productschap Vee en Vlees,

      j. Productschap Vis,

      k. Productschap Zuivel,

      l. Hoofdbedrijfschap voor de Agrarische Groothandel,

      m. Hoofdbedrijfschap Ambachten,

      n. Hoofdbedrijfschap Detailhandel,

      o. Bedrijfschap Afbouw,

      p. Bosschap,

      q. Bedrijfschap Horeca en Catering,

      onder algemene titel over op de staat zonder dat daarvoor een akte of betekening nodig is.

      2 De in het eerste lid bedoelde overgang geschiedt in de vorm van een afgezonderd vermogen per bedrijfslichaam.

      3 Ingeval krachtens het eerste lid registergoederen overgaan, doet Onze Minister de
      overgang van die registergoederen onverwijld inschrijven in de openbare registers,
      bedoeld in [afdeling 2 van titel I van Boek 3 van het Burgerlijk Wetboek][ref2].
      [Artikel 24, eerste lid, van Boek 3 van het Burgerlijk Wetboek][ref3] is niet van toepassing.

      4 Ingeval krachtens het eerste lid rechten en verplichtingen uit arbeidsovereenkomsten naar
      burgerlijk recht overgaan, gaan die overeenkomsten ongewijzigd over als rechtsverhouding
      naar burgerlijk recht. De betrokken werknemers worden niet aangemerkt als overheidswerknemer
      als bedoeld in [artikel 1, onderdeel n, van de Wet privatisering ABP][ref4] of
      [artikel 1, onderdeel j, van de Werkloosheidswet][ref5] en de staat wordt ten aanzien van die werknemers niet
      aangemerkt als overheidswerkgever als bedoeld in artikel 1, onderdeel m, van de Wet privatisering ABP of artikel 1,
      onderdeel i, van de Werkloosheidswet.

      5 In afwijking van het bepaalde bij of krachtens de [Comptabiliteitswet 2001][ref6] worden de in het eerste
      lid bedoelde vermogensbestanddelen, voor zover het liquide middelen betreft, op een rekening buiten het
      begrotingsverband van het Rijk geboekt.

      6 Vorderingen op en van een bedrijfslichaam komen uitsluitend ten laste onderscheidenlijk ten gunste van het
      vermogen van het desbetreffende bedrijfslichaam.


