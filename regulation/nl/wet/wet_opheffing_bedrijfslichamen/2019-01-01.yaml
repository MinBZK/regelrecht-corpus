  - number: XLIV
    text: |-
      Terstond na de in [artikel XLIII][ref1] bedoelde vaststelling van de rekening der inkomsten en uitgaven stelt Onze
      Minister een boedelbeschrijving op van het desbetreffende bedrijfslichaam. Onze Minister legt de boedelbeschrijving
      ter inzage op het Ministerie van Landbouw, Natuur en Voedselkwaliteit en doet daarvan mededeling in de
      Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0036083#ArtikelXLIII
