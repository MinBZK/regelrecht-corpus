regulatory_layer: WET
publication_date: '2012-11-16'
valid_from: '2013-01-01'
bwb_id: BWBR0032225
url: https://wetten.overheid.nl/BWBR0032225/2013-01-01
preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is de Wet personenvervoer 2000 aan te passen opdat
    het mogelijk wordt voor een plusregio die de gemeente Amsterdam, ’s-Gravenhage, Rotterdam of Utrecht omvat, een
    concessie voor het openbaar vervoer te verlenen zonder dat daartoe een aanbesteding is gehouden;


    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0032225/2013-01-01#ArtikelAanhef
articles:
  - number: IA
    text: 'Deze wet wordt aangehaald als: Wet aanbestedingsvrijheid OV grote steden.'
    url: https://wetten.overheid.nl/BWBR0032225/2013-01-01#ArtikelIA
  - number: II
    text: >-
      Deze wet treedt in werking met ingang van de eerste dag van de tweede kalendermaand na de datum van uitgifte van
      het Staatsblad waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0032225/2013-01-01#ArtikelII
