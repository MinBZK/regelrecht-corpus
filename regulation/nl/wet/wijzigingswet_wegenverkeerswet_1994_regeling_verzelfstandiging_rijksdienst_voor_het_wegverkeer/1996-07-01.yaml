  - number: VI
    text: |-
      Onze Minister zendt binnen vijf jaar na inwerkingtreding van artikel 4*a*, en vervolgens telkens na vier jaar,
      aan de Staten-Generaal een verslag over de doeltreffendheid en doelmatigheid van het functioneren van de Dienst
      Wegverkeer, waarbij in ieder geval aan de orde komen de rechtsvorm van de dienst, het arbeidsvoorwaardenregime
      en het proces van afstoten van taken naar de marktsector. De Dienst Wegverkeer is gehouden aan deze evaluatie
      medewerking te verlenen.
    url: https://wetten.overheid.nl/BWBR0007978/1996-07-01#ArtikelVI
  - number: XV
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip. De tekst van de
      [Wegenverkeerswet 1994][ref1] wordt door Onze Minister van Justitie in het *Staatsblad* geplaatst.


