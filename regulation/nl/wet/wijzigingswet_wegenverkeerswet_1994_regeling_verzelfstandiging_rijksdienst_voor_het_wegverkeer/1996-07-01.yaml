        artikel: 4o
  - number: III
    text: |-
      1 Onze Minister bepaalt in overeenstemming met Onze Minister van Financiën welke vermogensbestanddelen van de Staat
      worden toebedeeld aan de Dienst Wegverkeer.

      2 De in het eerste lid bedoelde vermogensbestanddelen gaan met ingang van de datum van inwerkingtreding van deze
      wet onder algemene titel over op de Dienst Wegverkeer tegen een door Onze Minister in overeenstemming met Onze
      Minister van Financiën te bepalen waarde.

      3 Ten aanzien van de in het eerste lid bedoelde vermogensbestanddelen welke in openbare registers te boek zijn
      gesteld, zal verandering van de tenaamstelling in die registers plaatsvinden. De daartoe nodige opgaven worden door
      de zorg van Onze Minister van Financiën aan de bewaarders van de desbetreffende registers gedaan.

      4 Ter zake van de verkrijging door de Dienst Wegverkeer van de vermogensbestanddelen, bedoeld in het tweede lid,
      blijft de heffing van overdrachtsbelasting achterwege.

      5 Archiefbescheiden van de Rijksdienst voor het Wegverkeer gaan met ingang van de datum van inwerkingtreding van
      deze wet over naar de Dienst Wegverkeer, met uitzondering van de archiefbescheiden die zijn vermeld op een door
      Onze Minister en de Rijksdienst voor het Wegverkeer tezamen vastgestelde lijst.
    url: https://wetten.overheid.nl/BWBR0007978/1996-07-01#ArtikelIII
  - number: IV
    text: |-
      1 Bij de eerste samenstelling van de raad van toezicht geschiedt de benoeming van twee leden voor een periode van
      twee jaren.

      2 Bij de eerste samenstelling van de raad van toezicht benoemt Onze Minister, in tegenstelling tot het bepaalde in
      artikel 4j, derde lid, de voorzitter van de raad van toezicht, zonder dat hij de raad hoort.
    url: https://wetten.overheid.nl/BWBR0007978/1996-07-01#ArtikelIV
  - number: V
    text: |-
      1 In afwijking van de artikelen 4*b*, eerste lid, aanhef en onderdeel *n*, en 4*l*, tweede lid, aanhef en onderdeel
      *b*, van de [Wegenverkeerswet 1994][ref1] stelt Onze Minister de tarieven vast die zullen gelden met ingang van het
      tijdstip van inwerkingtreding van deze wet.

      2 Onverminderd [artikel 4][ref2] omvat het in artikel 48, eerste lid, van die wet bedoelde tarief voor de aanvraag
      van een bij algemene maatregel van bestuur aan te wijzen deel van een kentekenbewijs, tot 5 jaar na het tijdstip
      van inwerkingtreding van deze wet, mede een bij ministeriële regeling vastgesteld bedrag dat strekt ter dekking van
      kosten van overige aan de Dienst Wegverkeer opgedragen taken, voor zover de tarieven voor deze overige taken niet
      alle met de uitoefening van de taak gemoeide kosten dekken. De voor deze taken vastgestelde tarieven worden in de
      genoemde periode geleidelijk verhoogd tot kostendekkend niveau.

      3 In wettelijke procedures en rechtsgedingen, waarbij de Rijksdienst voor het Wegverkeer is betrokken, treedt met
      ingang van de datum van inwerkingtreding van deze wet de Dienst Wegverkeer in de plaats van de Staat dan wel Onze
      Minister.

      4 In zaken waarin voor het tijdstip van inwerkingtreding van deze wet op grond van
      [artikel 12 van de Wet Nationale ombudsman][ref3] aan de Nationale ombudsman is verzocht een onderzoek te doen dan
      wel de Nationale ombudsman op grond van artikel 15 van die wet een onderzoek heeft ingesteld naar een gedraging
      die kan worden toegerekend aan de Rijksdienst voor het Wegverkeer, treedt de Dienst Wegverkeer op dat tijdstip als
      bestuursorgaan in de zin van de [Wet Nationale ombudsman][ref4] in de plaats van Onze Minister.


