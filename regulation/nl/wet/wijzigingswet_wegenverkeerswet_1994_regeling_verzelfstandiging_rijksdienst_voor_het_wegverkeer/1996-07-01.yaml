preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging hebben genomen, dat het wenselijk is de Rijksdienst voor het Wegverkeer te verzelfstandigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007978/1996-07-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      1 Met ingang van de datum van inwerkingtreding van deze wet zijn de ambtenaren van het Ministerie van Verkeer en
      Waterstaat, van wie de naam is vermeld op een door Onze Minister en de Rijksdienst voor het Wegverkeer tezamen
      vastgestelde lijst, van rechtswege in dienst van de Dienst Wegverkeer.

      2 Tot het moment waarop de directie van de Dienst Wegverkeer krachtens [artikel 4][ref1] terzake een reglement
      heeft vastgesteld, geldt voor de in het eerste lid bedoelde ambtenaren een rechtspositie die gelijk is aan die
      welke gold direct vóór het moment van overgang bij het Ministerie van Verkeer en Waterstaat. De voorschriften en
      reglementen die betrekking hebben op de rechtspositie zoals die luiden op de dag voor de verzelfstandiging, zijn
      van overeenkomstige toepassing op het personeel dat op de dag van de verzelfstandiging van rechtswege in dienst zal
      treden van de Dienst Wegverkeer, met dien verstande dat daar waar in de huidige voorschriften en reglementen staat
      vermeld dan wel wordt bedoeld «Minister of Kroon dan wel een door deze als zodanig aangewezen autoriteit» gelezen
      dient te worden «directie of raad van toezicht».

      3 Indien ter zake van de totstandkoming van de Dienst Wegverkeer een sociaal beleidskader geldt, kan bij die
      regeling zonodig worden afgeweken van het bepaalde in het tweede lid.

      4 De verplichtingen die voortvloeien uit het sociaal beleidskader gaan over op de Dienst Wegverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4o
    url: https://wetten.overheid.nl/BWBR0007978/1996-07-01#ArtikelII
    references:
