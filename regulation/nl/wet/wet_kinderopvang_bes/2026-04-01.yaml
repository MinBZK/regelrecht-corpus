  - number: '3.17'
    text: |-
      1 Onze Minister voor Primair en Voortgezet Onderwijs verleent het expertisecentrum onderwijszorg subsidie voor de
      uitvoering van de taken, bedoeld in [artikel 2.18, eerste lid][ref1].

      2 Bij regeling van Onze Minister voor Primair en Voortgezet Onderwijs kunnen regels worden gesteld over het
      verlenen van de subsidie.

      3 [Artikel 69, derde lid, van de Wet primair onderwijs BES][ref2] is van overeenkomstige toepassing op de
      subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0049771#Artikel2.18
