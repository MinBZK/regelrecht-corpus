  - number: '2.13'
    text: |-
      Indien een gastouder op enigerlei wijze bekend is geworden dat een persoon van 18 jaar of ouder die structureel
      aanwezig is op een locatie waar gastouderopvang plaatsvindt zich mogelijk schuldig maakt of heeft gemaakt aan een
      misdrijf tegen de zeden als bedoeld in [Titel XIV van het Wetboek van Strafrecht BES][ref1] of mishandeling als
      bedoeld in [Titel XX van het Wetboek van Strafrecht BES][ref2], treedt de gastouder onverwijld in overleg met een
      deskundige als bedoeld in [artikel 2.10a, eerste lid][ref3].


