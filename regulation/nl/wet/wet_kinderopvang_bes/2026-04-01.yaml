  - number: '4.1'
    text: |-
      Bij ministeriële regeling worden regels gesteld over de administratie van gegevens door een houder van een
      kindercentrum of voorziening voor gastouderopvang en de bewaartermijn van die gegevens.
    url: https://wetten.overheid.nl/BWBR0049771/2026-04-01#Artikel4.1
  - number: '4.2'
    text: |-
      1 Een houder van een kindercentrum of gastouder verstrekt uit eigen beweging of op verzoek van Onze Minister
      onverwijld alle gegevens en inlichtingen die noodzakelijk zijn voor de vaststelling of de betaling van de
      kinderopvangvergoeding, of die tot wijzigingen leiden in de hoogte daarvan, waaronder in ieder geval:

      a. persoonsgegevens van de ouder, de partner van de ouder en het kind, waaronder een administratienummer of ID-
      nummer;

      b.

      2 De gevraagde gegevens en inlichtingen worden op een door Onze Minister aangegeven wijze en binnen een door Onze
      Minister gestelde termijn verstrekt.

      3 Indien de gegevens of inlichtingen niet op tijd zijn verstrekt, maant Onze Minister de houder van het
      kindercentrum of de gastouder aan onder het stellen van een nadere termijn om alsnog de gevraagde gegevens en
      inlichtingen te verstrekken.
    url: https://wetten.overheid.nl/BWBR0049771/2026-04-01#Artikel4.2
  - number: '4.3'
    text: |-
      1 De ouder en de partner van de ouder verstrekken uit eigen beweging of op verzoek van Onze Minister onverwijld
      alle gegevens en inlichtingen, waaronder persoonsgegevens van de ouder, de partner en het kind, die:

      a. noodzakelijk zijn voor de vaststelling en de hoogte van de kinderopvangvergoeding, voor zover die gegevens
      betrekking hebben op [artikel 3.2, eerste lid, onderdelen e, f en g, en vierde lid][ref1];

      b.

      c. aanleiding kunnen geven tot wijziging van de kinderopvangvergoeding.

      2 De gevraagde gegevens en inlichtingen worden op een door Onze Minister aangegeven wijze en binnen een door Onze
      Minister te stellen termijn verstrekt.

      3 Indien de gegevens of inlichtingen niet op tijd zijn verstrekt, maant Onze Minister de ouder en de partner van de
      ouder aan onder het stellen van een nadere termijn om alsnog de gevraagde gegevens en inlichtingen te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0049771#Artikel3.2
    url: https://wetten.overheid.nl/BWBR0049771/2026-04-01#Artikel4.3
