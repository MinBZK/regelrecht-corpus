  - number: '4.5'
    text: |-
      1 Onze Minister, het bestuurscollege en andere, bij algemene maatregel van bestuur aan te wijzen
      instanties, zijn bevoegd uit eigen beweging en verplicht desgevraagd aan Onze Minister en op grond van de
      [artikelen 5.1, eerste lid][ref1], of [184 van het Wetboek van strafvordering BES][ref2] aangewezen ambtenaren
      kosteloos alle gegevens en inlichtingen te verstrekken die noodzakelijk zijn voor:

      a. het toezicht op de naleving van het bepaalde bij of krachtens deze wet of de uitoefening van de taken, bedoeld
      in [artikel 2.18][ref3]; of

      b. de opsporing van bij of krachtens deze wet strafbaar gestelde feiten.

      2 Onze Minister en op grond van de [artikelen 5.1, eerste lid][ref4], of
      [184 van het Wetboek van strafvordering BES][ref5] aangewezen ambtenaren verstrekken andere instanties kosteloos
      alle gegevens en inlichtingen, die zijn verkregen door de uitvoering of het toezicht op de naleving van het
      bepaalde bij of krachtens deze wet of de uitoefening van de taken, bedoeld in [artikel 2.18][ref6], welke
      noodzakelijk zijn voor de uitvoering van hun wettelijke taak en indien dit noodzakelijk is ten behoeve van een
      samenwerkingsverband tussen twee of meer van de voornoemde instanties.

      3 Onze Minister, het bestuurscollege, op grond van [artikel 4.4, tweede lid, onderdeel c][ref7],
      aangewezen instanties en op grond van de [artikelen 5.1, eerste lid][ref8], of
      [184 van het Wetboek van strafvordering BES][ref9] aangewezen ambtenaren kunnen bij het verwerken van
      persoonsgegevens gebruik maken van een administratienummer of ID-nummer.


