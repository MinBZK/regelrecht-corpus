        artikel: '5.3'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '5.11'
    text: |-
      1 Het bestuurscollege kan de vergunning schorsen of intrekken, indien sprake is van herhaaldelijke overtreding
      van bij of krachtens deze wet gestelde regels, waardoor de kwaliteit van de kinderopvang of de veiligheid of
      de gezondheid van de kinderen of het personeel zodanig in het geding is dat geen sprake is van verantwoorde
      kinderopvang als bedoeld in de [artikelen 2.4, eerste lid][ref1], of [2.6, eerste lid][ref2].

      2

      3 Onze Minister kan het bestuurscollege adviseren over schorsing of intrekking als bedoeld in het eerste of tweede
      lid en stuurt de betrokken houder of gastouder een afschrift van dat advies.

      4 Indien het bestuurscollege het advies van Onze Minister niet opvolgt, informeert het bestuurscollege Onze
      Minister over dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0049771#Artikel2.4
      [ref2]: https://wetten.overheid.nl/BWBR0049771#Artikel2.6
