    text: |-
      1 Onze Minister voert in elk geval eenmaal per jaar overleg met de bestuurscolleges van de openbare lichamen
      en de op grond van [artikel 5.1, eerste lid][ref1], aangewezen ambtenaren over het functioneren van het
      kinderopvangstelsel.

      2 Alle partijen werken mee aan de totstandkoming en naleving van de afspraken.


