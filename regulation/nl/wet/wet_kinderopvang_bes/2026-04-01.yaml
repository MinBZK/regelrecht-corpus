  - number: '2.17'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent voorwaarden voor het aanbieden van
      plusopvang door een houder van een kindercentrum of een gastouder, waarbij onderscheid kan worden gemaakt tussen
      dagopvang, buitenschoolse opvang en flexibele opvang en tussen de openbare lichamen, die betrekking kunnen hebben
      op:

      a. de minimale opleidingseisen, scholingseisen en ervaringseisen voor beroepskrachten of gastouders;

      b. de inzet van beroepskrachten in opleiding en stagiairs;

      c. het aantal beroepskrachten in relatie tot het aantal kinderen per leeftijdscategorie;

      d. de groepsgrootte en de herkenbaarheid van ruimtes en personen;

      e. het pedagogisch beleid en de pedagogische praktijk;

      f. de accommodatie en de inrichting van de ruimte die bestemd is voor kinderopvang; en

      g. de beschikbare ruimte voor kinderen.
    url: https://wetten.overheid.nl/BWBR0049771/2026-04-01#Artikel2.17
  - number: '2.18'
    text: |-
      1 Het expertisecentrum onderwijszorg draagt zorg voor deskundige ondersteuning bij de opvang van kinderen met
      mogelijk een extra ondersteuningsbehoefte, waaronder in elk geval de volgende taken worden verstaan:

      a. het adviseren over het begeleidingsplan, bedoeld in [artikel 2.4, tweede lid, onderdeel g][ref1], en
      [artikel 2.6, tweede lid, onderdeel c][ref2];

      b. het verrichten van diagnostiek ten behoeve van kinderen met mogelijk een extra ondersteuningsbehoefte;

      c. het adviseren aan de verlener van pedagogische ondersteuning en advies als bedoeld in
      [artikel 2.3, vierde lid][ref3];

      d. het adviseren, bedoeld in [artikel 2.1, vijfde lid, onderdeel b][ref4];

      e. het begeleiden van kinderen met een extra ondersteuningsbehoefte naar een plusopvang;

      f. het begeleiden van kinderen met een extra ondersteuningsbehoefte bij de doorstroom naar het basisonderwijs; en

      g. het op aanvraag vaststellen dat een kind een extra ondersteuningsbehoefte heeft, daardoor in aanmerking komt
      voor plaatsing in een plusopvang en welke extra ondersteuning voor het kind nodig is.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de taken, bedoeld in het
      eerste lid.


