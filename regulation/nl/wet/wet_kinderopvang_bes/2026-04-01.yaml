  - number: '2.15'
    text: |-
      1 Met als doel de bevordering van een goede doorstroom van kinderen naar het basisonderwijs, verwerken een houder
      van een kindercentrum en een gastouder persoonsgegevens over het ontwikkelproces van het kind.

      2 De gegevens, bedoeld in het eerste lid, worden bewaard gedurende twee jaar nadat het kind het kindercentrum of de
      gastouderopvang heeft verlaten.

      3 Indien de ouders daarmee instemmen, vindt bij de overgang van een kind van het kindercentrum of de gastouder
      naar het basisonderwijs een gesprek plaats tussen de beroepskracht van de kinderopvang dan wel de gastouder en de
      leerkracht van de basisschool, waarbij zo mogelijk de ouders van het kind aanwezig zijn.

      4 Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de gegevensverwerking, bedoeld
      in het eerste en derde lid, die betrekking kunnen hebben op:

      a. de te verwerken gegevens;

      b. de gevallen waarin in ieder geval gegevens worden verwerkt;

      c. de wijze van verwerking van de gegevens;

      d. het elektronische gegevensverkeer en de daarbij te gebruiken elektronische infrastructuur; en

      e. de eisen die aan de gegevensverwerking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0049771/2026-04-01#Artikel2.15
  - number: '2.16'
    text: |-
      1 Het bestuurscollege draagt er zorg voor dat ten minste tweemaal jaarlijks overleg plaatsvindt en draagt zorg voor
      het maken van afspraken:

      a. met de houders van kindercentra en gastouders op Bonaire, Sint Eustatius of Saba over de wijze waarop zo groot
      mogelijke deelname van kinderen aan kinderopvang wordt bevorderd;

      b. met de houders van kindercentra en gastouders en met de bevoegde gezagsorganen van de basisscholen op Bonaire,
      Sint Eustatius of Saba over de organisatie van een doorlopende ontwikkel- en leerlijn van kinderopvang naar
      basisonderwijs;

      c. met de houders van kindercentra en gastouders, het expertisecentrum onderwijszorg en de verlener van
      pedagogische ondersteuning en advies als bedoeld in [artikel 2.3, vierde lid][ref1], op Bonaire, Sint Eustatius of
      Saba over de wijze waarop wordt bevorderd dat het kinderopvangstelsel toegankelijk is voor kinderen met een extra
      ondersteuningsbehoefte.

      2 Alle partijen werken mee aan de totstandkoming van de afspraken.


      [ref1]: https://wetten.overheid.nl/BWBR0049771#Artikel2.3
