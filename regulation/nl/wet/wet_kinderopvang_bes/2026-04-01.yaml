  - number: '5.12'
    text: |-
      1 Degene die opzettelijk de [artikelen 2.1][ref1], [2.3][ref2], [2.4][ref3], [2.5][ref4], [2.6][ref5],
      [2.8][ref6], [2.11][ref7], [2.12][ref8], [2.13][ref9], [2.17][ref10], [3.15][ref11], [4.2][ref12] of [4.3][ref13]
      overtreedt, wordt gestraft met een gevangenisstraf van ten hoogste twee jaren, een geldboete van de vierde
      categorie, bedoeld in [artikel 27, vierde lid, van het Wetboek van Strafrecht BES][ref14], of met beide straffen.

      2 Degene die de [artikelen 2.1][ref15], [2.3][ref16], [2.4][ref17], [2.5][ref18], [2.6][ref19], [2.8][ref20],
      [2.11][ref21], [2.12][ref22], [2.13][ref23], [2.17][ref24], [3.15][ref25], [4.2][ref26] of [4.3][ref27] overtreedt,
      wordt gestraft met hechtenis van ten hoogste zes maanden, een geldboete van de vierde categorie, bedoeld in
      [artikel 27, vierde lid, van het Wetboek van Strafrecht BES][ref28], of met beide straffen.

      3 De in het eerste lid strafbaar gestelde feiten zijn misdrijven. De in het tweede lid strafbaar gestelde feiten
      zijn overtredingen.

      4 [Artikel 27, zevende en achtste lid, van het Wetboek van Strafrecht BES][ref29] is van overeenkomstige
      toepassing.


