  - number: '2.19'
    text: |-
      1 Gelet op [artikel 21, eerste lid, onderdeel a, van de Wet bescherming persoonsgegevens BES][ref1] is het verbod
      om persoonsgegevens betreffende iemands gezondheid te verwerken niet van toepassing op de verwerking door:

      a. de verlener van pedagogische ondersteuning en advies als bedoeld in [artikel 2.3, vierde lid][ref2], voor zover
      de verwerking noodzakelijk is voor het bieden van die pedagogische ondersteuning en advies;

      b. het expertisecentrum onderwijszorg, voor zover de verwerking noodzakelijk is ter uitvoering van de taken,
      bedoeld in [artikel 2.18, eerste lid][ref3];

      c. de houder van een kindercentrum of de gastouder, voor zover de verwerking noodzakelijk is voor de opvang van een
      kind met een extra ondersteuningsbehoefte of het vaststellen van extra ondersteuningsbehoefte.

      2 De natuurlijke personen of rechtspersonen, bedoeld in het eerste lid, kunnen persoonsgegevens betreffende iemands
      gezondheid aan elkaar verstrekken, voor zover die verstrekking noodzakelijk is voor een in dat lid omschreven doel.

      3 Het verbod, bedoeld in het eerste lid, is niet van toepassing op de verstrekking van persoonsgegevens betreffende
      iemands gezondheid door de houder van een kindercentrum, de gastouder of het expertisecentrum onderwijszorg aan:

      a. een school waar basisonderwijs wordt gegeven, voor zover de verstrekking noodzakelijk is voor de bevordering van
      een goede doorstroom van kinderen met een extra ondersteuningsbehoefte naar het basisonderwijs;

      b. een zorgaanbieder als bedoeld in
      __REF000___________________________________________________________________________________________________________
      _____, voor zover de verstrekking noodzakelijk is voor het bieden van specialistische ondersteuning bij de opvang
      van kinderen met een extra ondersteuningsbehoefte.

      4 De verwerking, bedoeld in het eerste, tweede en derde lid, geschiedt niet eerder dan nadat de ouders hiermee
      hebben ingestemd.

      5 Bij algemene maatregel van bestuur worden nadere regels gesteld over gegevensverwerking als bedoeld in dit
      artikel, die betrekking kunnen hebben op:

      a. de te verwerken gegevens;

      b. de gevallen waarin in ieder geval gegevens worden verwerkt;

      c. de wijze van verwerking van de gegevens en inlichtingen;

      d. het elektronische gegevensverkeer en de daarbij te gebruiken elektronische infrastructuur; en

      e. de eisen die aan de gegevensverwerking worden gesteld.


