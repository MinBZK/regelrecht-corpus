  - number: '4.6'
    text: |-
      1 Onze Minister is bevoegd gegevens en inlichtingen te verstrekken aan het bestuurscollege, voor zover die gegevens
      en inlichtingen noodzakelijk zijn voor de uitvoering van de [hoofdstukken 2][ref1], [3][ref2] of [5][ref3].

      2 Ambtenaren aangewezen op grond van de [artikelen 5.1, eerste lid][ref4], of
      [184 van het Wetboek van strafvordering BES][ref5] zijn bevoegd de gegevens en inlichtingen die zij verkrijgen
      van Onze Minister te verstrekken aan het bestuurscollege, indien dat noodzakelijk is voor de uitvoering van
      [hoofdstuk 2][ref6].


