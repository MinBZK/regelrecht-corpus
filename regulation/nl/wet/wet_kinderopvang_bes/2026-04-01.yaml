    text: |-
      De [artikelen 4:89 tot en met 4:102][ref1], [4:104 tot en met 4:108][ref2],
      [4:110 tot en met 4:117][ref3], [4:119][ref4], [4:120, eerste en derde lid][ref5], en
      [4:121 tot en met 4:125 van de Algemene wet bestuursrecht][ref6] zijn van overeenkomstige toepassing op de
      aanmaning en invordering van een last onder dwangsom of bestuurlijke boete als bedoeld in [artikel 5.6][ref7]
      respectievelijk [artikel 5.7][ref8], met dien verstande dat moet worden gelezen voor:

      a. de in [artikel 4:93, derde lid, van die wet][ref9] opgenomen verwijzing naar
      [artikel 129, eerste en tweede lid, van Boek 6 van het Burgerlijk Wetboek][ref10]:
      [artikel 129, eerste en tweede lid, van Boek 6 van het Burgerlijk Wetboek BES][ref11];

      b. de in [artikel 4:98, eerste lid, van die wet][ref12] opgenomen verwijzing naar de
      [artikelen 119, eerste en tweede lid][ref13], en [120, eerste lid, van Boek 6 van het Burgerlijk Wetboek][ref14]:
      de [artikelen 119, eerste en tweede lid][ref15], en [120 van Boek 6 van het Burgerlijk Wetboek BES][ref16];

      c. de in [artikel 4:98, derde lid, van die wet][ref17] opgenomen verwijzing
      naar [artikel 125 van Boek 6 van het Burgerlijk Wetboek][ref18]:
      [artikel 125 van Boek 6 van het Burgerlijk Wetboek BES][ref19];

      d. de in [artikel 4:105, eerste lid, van die wet][ref20] opgenomen verwijzing naar
      [artikel 316, eerste en tweede lid, van Boek 3 van het Burgerlijk Wetboek][ref21]:
      [artikel 316, eerste en tweede lid, van Boek 3 van het Burgerlijk Wetboek BES][ref22];

      e. de in [artikel 4:110, derde lid, van die wet][ref23] opgenomen
      verwijzing naar [artikel 324 van Boek 3 van het Burgerlijk Wetboek][ref24]:
      [artikel 324 van Boek 3 van het Burgerlijk Wetboek BES][ref25];

      f. de in de [artikelen 4:116][ref26] en [4:123, eerste lid, van die wet][ref27] opgenomen verwijzing naar het
      [Wetboek van Burgerlijke Rechtsvordering][ref28]: het [Wetboek van Burgerlijke Rechtsvordering BES][ref29];

      g. de in [artikel 4:123, tweede lid][ref30], opgenomen verwijzing naar de [artikelen 438][ref31]
      en [438a van het Wetboek van Burgerlijke Rechtsvordering][ref32]: de [artikelen 438][ref33] en
      [438a van het Wetboek van Burgerlijke Rechtsvordering BES][ref34].


