  - number: 6.4a
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0049771/2026-04-01#Artikel6.4a
  - number: '6.5'
    text: |-
      1 Exploitatievergunningen die zijn verleend, verlengd of gewijzigd op grond van de Eilandsverordening
      Kinderopvang Bonaire 2020, de Basis Eilandsverordening Kinderopvang St. Eustatius (AB 2019, nr. 19) of
      de Basis Eilandsverordening Kinderopvang (AB 2020, nr. 2) berusten na de inwerkingtreding van deze wet op
      [artikel 2.1, eerste lid, onderdeel a][ref1].

      2 De op het tijdstip van inwerkingtreding van deze wet aanhangige aanvragen voor verlening, verlenging of wijziging
      van een exploitatievergunning als bedoeld in het eerste lid, zijn aanhangig in de staat waarin zij zich op dat
      moment bevinden en worden vanaf het tijdstip van inwerkingtreding van deze wet overeenkomstig het bepaalde bij en
      krachtens deze wet behandeld.

      3 De op het tijdstip van inwerkingtreding van deze wet aanhangige bezwaarschriften die betrekking hebben op het
      nemen van een besluit als bedoeld in het eerste lid, zijn aanhangig in de staat waarin zij zich op dat moment
      bevinden en worden overeenkomstig de bepalingen van de verordeningen, bedoeld in het eerste lid, behandeld en
      beslist.

      4 De op het tijdstip van inwerkingtreding van deze wet aanhangige zaken bij het Gerecht in eerste aanleg van
      Bonaire, Sint Eustatius en Saba of het Gemeenschappelijk Hof van Justitie van Aruba, Curaçao, Sint Maarten en van
      Bonaire, Sint Eustatius en Saba die betrekking hebben op het nemen van een besluit als bedoeld in het eerste lid,
      zijn aanhangig in de staat waarin zij zich op dat moment bevinden en worden overeenkomstig de bepalingen van de
      verordeningen, bedoeld in het eerste lid, behandeld en beslist.


