  - number: '5.4'
    text: |-
      1 Een op grond van [artikel 5.1, eerste lid][ref1], aangewezen ambtenaar legt het oordeel en bevindingen naar
      aanleiding van een onderzoek als bedoeld in [artikel 5.3, tweede lid][ref2], vast in een inspectierapport.

      2 Alvorens een rapport vast te stellen naar aanleiding van een onderzoek betreffende de naleving van
      [hoofdstuk 2][ref3], wordt de houder of gastouder in de gelegenheid gesteld van het ontwerprapport kennis te nemen
      en daarover overleg te voeren.

      3 Indien in het overleg geen overeenstemming is bereikt over de door de houder of gastouder gewenste wijzigingen
      van het ontwerprapport, wordt de zienswijze van de houder of gastouder in een bijlage bij het inspectierapport
      opgenomen.

      4 De op grond van [artikel 5.1, eerste lid][ref4], aangewezen ambtenaar zendt het inspectierapport na vaststelling
      daarvan onverwijld aan de houder of gastouder.

      5 Een inspectierapport naar aanleiding van een onderzoek betreffende de naleving van [hoofdstuk 2][ref5] wordt:

      a. in de derde week na vaststelling daarvan openbaar gemaakt; en

      b. nadat het openbaar is gemaakt op verzoek verstrekt, waarbij een vergoeding van de daaraan verbonden kosten in
      rekening kan worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0049771#Artikel5.1
