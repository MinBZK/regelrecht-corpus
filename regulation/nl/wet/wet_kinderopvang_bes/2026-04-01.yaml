  - number: '2.14'
    text: |-
      1 Een houder van een kindercentrum of een gastouder informeert de ouders wier kinderen in het kindercentrum worden
      opgevangen en eenieder die daarom verzoekt over het te voeren beleid als bedoeld in deze paragraaf.

      2 Een houder van een kindercentrum of een gastouder informeert over een inspectierapport als bedoeld in
      [artikel 5.4][ref1]:

      a. de ouders van de kinderen die in dat kindercentrum of die gastouderopvang worden opgevangen, en

      b. de personen werkzaam bij een rechtspersoon waarmee de houder dat kindercentrum exploiteert.

      3 Het informeren, bedoeld in het tweede lid, vindt plaats doordat:

      a. de houder of gastouder het inspectierapport zo spoedig mogelijk na ontvangst op zijn website plaatst zodanig dat
      het rapport voor de ouders en de personen werkzaam bij de onderneming gemakkelijk vindbaar is;

      b. indien de houder geen eigen website heeft, ter inzage legt op een voor de ouders en de personen werkzaam bij de
      rechtspersoon toegankelijke plaats.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de informatie die
      de houder van een kindercentrum of gastouder beschikbaar stelt aan een ouder.


      [ref1]: https://wetten.overheid.nl/BWBR0049771#Artikel5.4
