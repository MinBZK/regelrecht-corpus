  - number: '6.2'
    text: |-
      Onze Minister kan, voor zover het belang van de veiligheid of de gezondheid van de
      kinderen of personeel zich daartegen niet verzet, van het bepaalde bij of krachtens de
      [artikelen 2.4, vierde lid, onderdelen b, c, d, e, h, i en k][ref1], [2.6, vijfde lid, onderdeel a][ref2],
      [2.17, onderdelen a, b, c, d, e en g][ref3], [3.3][ref4], [3.4][ref5] en [3.11][ref6] vrijstelling of ontheffing
      verlenen, indien als gevolg van een calamiteit niet aan die voorschriften kan worden voldaan.


