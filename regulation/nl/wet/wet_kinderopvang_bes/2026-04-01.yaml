  - number: '2.6'
    text: |-
      1 Een gastouder:

      a. organiseert de werkzaamheden op zodanige wijze;

      b. voorziet de opvang zowel kwalitatief als kwantitatief zodanig van materieel;

      c. voert een zodanig pedagogisch, gezondheids-, veiligheids- en educatief beleid;

      dat een en ander redelijkerwijs leidt tot verantwoorde kinderopvang.

      2 Ter uitvoering van het eerste lid besteedt een gastouder in ieder geval aantoonbaar aandacht aan:

      a. het dagritme en een gevarieerd activiteitenprogramma;

      b. de opleidingseisen, scholingseisen en ervaringseisen waaraan de gastouder moet voldoen;

      c. het volgen van de ontwikkeling van kinderen en het signaleren van bijzonderheden, waaronder door middel van een
      begeleidingsplan indien bijzonderheden worden gesignaleerd;

      d. het voorkomen van ontwikkel- en leerachterstanden door het programma af te stemmen op wat kinderen nodig hebben;

      e. de groepsgrootte.

      3 Een gastouder maakt gebruik van de begeleiding en ondersteuning voor het aanbieden van verantwoorde kinderopvang
      zoals wordt aangeboden door het bestuurscollege.

      4 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de voorwaarden voor
      verantwoorde kinderopvang bij een gastouder, die betrekking kunnen hebben op:

      a. veiligheid en gezondheid;

      b. de minimale opleidingseisen, scholingseisen en ervaringseisen waaraan de gastouder voldoet;

      c. het volgen van de ontwikkeling van kinderen en het signaleren van bijzonderheden, waaronder door middel van een
      begeleidingsplan indien bijzonderheden worden gesignaleerd;

      d. het activiteitenprogramma;

      e. de groepsgrootte.

      5 Bij of krachtens eilandsverordening kunnen nadere regels worden gesteld omtrent de voorwaarden voor
      gastouderopvang, met betrekking tot:

      a. de accommodatie, de beschikbare ruimte voor kinderen en de inrichting van de ruimte die bestemd is voor
      gastouderopvang;

      b. lokale partners met wie de gastouder afspraken maakt ten behoeve van de optimale ontwikkeling van kinderen;

      c. gezonde voeding;

      d. het taalniveau van de gastouder;

      e. aanvullende opleidingseisen, scholingseisen en ervaringseisen voor de gastouder;

      f. het pedagogisch beleid en de pedagogische praktijk;

      g. het dagritme.
    url: https://wetten.overheid.nl/BWBR0049771/2026-04-01#Artikel2.6
  - number: '2.7'
    text: |-
      1 Bij kinderopvang in een kindercentrum of gastouderopvang wordt als voertaal gebruikt:

      a. op Bonaire: Nederlands of Papiaments;

      b. op Sint Eustatius en Saba: Engels of Nederlands.

      2 In afwijking van het eerste lid kan mede een andere taal als voertaal worden gebruikt, indien de herkomst van de
      kinderen in specifieke omstandigheden daartoe noodzaakt.
    url: https://wetten.overheid.nl/BWBR0049771/2026-04-01#Artikel2.7
  - number: '2.8'
    text: |-
      1 In het bezit van een verklaring omtrent het gedrag zijn:

      a. de houder of voorgenomen houder van een kindercentrum, zijnde de directeur en bestuurders, en de gastouder of
      voorgenomen gastouder;

      b. de personen die in dienst zijn van de houder of met een uitzendorganisatie tijdens opvanguren werkzaam zijn, dan
      wel zullen zijn, op de locatie waar de houder een kindercentrum exploiteert en waar kinderen worden opgevangen;

      c. de personen die op basis van een andere overeenkomst met de houder structureel tijdens opvanguren werkzaam zijn
      of zullen zijn op de locatie waar de houder een kindercentrum exploiteert en waar kinderen worden opgevangen;

      d. de personen die op vrijwillige basis structureel tijdens opvanguren werkzaam zijn of zullen zijn op de locatie
      van waar de houder een kindercentrum exploiteert en waar kinderen worden opgevangen;

      e. de personen van 18 jaar en ouder die structureel aanwezig zijn op de locatie waar gastouderopvang plaatsvindt;
      en

      f. de personen die uit hoofde van hun functie toegang hebben of zullen hebben tot informatie over de kinderen die
      worden opgevangen.

      2 De verklaring omtrent het gedrag is op het tijdstip van overlegging aan de houder van het kindercentrum of de
      gastouder niet ouder dan drie maanden en wordt tweejaarlijks geactualiseerd.

      3 Het tijdstip van overlegging van een verklaring omtrent het gedrag ligt voor de aanvang van de werkzaamheden
      of het structureel aanwezig zijn op een locatie van een kindercentrum dan wel een locatie waar gastouderopvang
      plaatsvindt.

      4 Indien een toezichthouder redelijkerwijs mag vermoeden dat een persoon van twaalf jaar of ouder die ten tijde van
      de opvang aanwezig is in het kindercentrum of aanwezig is op het adres waar opvang door de gastouder plaatsvindt
      niet zou voldoen aan de eisen voor het afgeven van een verklaring omtrent het gedrag, verlangt de toezichthouder
      dat de houder van het kindercentrum of gastouder een verklaring omtrent het gedrag overlegt met betrekking tot die
      persoon binnen een door de toezichthouder vast te stellen termijn. Binnen die termijn is die persoon in het bezit
      van een verklaring omtrent het gedrag en legt de houder of gastouder die verklaring omtrent het gedrag over aan de
      toezichthouder. Een verklaring omtrent het gedrag is op het moment van overlegging niet ouder dan drie maanden.

      5 Een houder van een kindercentrum of gastouder bewaart de verklaringen omtrent gedrag gedurende drie jaar.
    url: https://wetten.overheid.nl/BWBR0049771/2026-04-01#Artikel2.8
  - number: '2.9'
    text: |-
      1 De houder van een kindercentrum stelt een klachtenprocedure voor ouders in.

      2 Het bestuurscollege zorgt ervoor dat ouders bij een onafhankelijke organisatie terecht kunnen voor advies over en
      begeleiding en bemiddeling bij een klachtenprocedure.

      3 Bij of krachtens eilandsverordening worden regels gesteld met betrekking tot:

      a. het instellen van een klachtenprocedure in een kindercentrum;

      b. de organisatie en de uitoefening van de taken, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0049771/2026-04-01#Artikel2.9
  - number: '2.10'
    text: |-
      1 Een houder van een kindercentrum stelt een oudercommissie in die tot taak heeft hem te adviseren.

      2 De verplichting tot het instellen van een oudercommissie, bedoeld in het eerste lid, geldt niet indien:

      a. het een kindercentrum betreft waar maximaal 50 kinderen worden opgevangen;

      b. de houder zich aantoonbaar voldoende heeft ingespannen om een oudercommissie in te stellen.

      3 Bij of krachtens eilandsverordening worden nadere regels gesteld met betrekking tot het instellen van een
      oudercommissie van een kindercentrum.
    url: https://wetten.overheid.nl/BWBR0049771/2026-04-01#Artikel2.10
  - number: 2.10a
    text: |-
      1 Onze Minister wijst een of meer natuurlijke personen of rechtspersonen aan als deskundige ten behoeve van de
      volgende personen die geconfronteerd worden of op enigerlei wijze bekend worden met een vermoeden van een misdrijf
      tegen de zeden als bedoeld in [Titel XIV van het Wetboek van Strafrecht BES][ref1] of mishandeling als bedoeld in
      [Titel XX van het Wetboek van Strafrecht BES][ref2], gepleegd door een houder van een kindercentrum, een gastouder,
      een persoon die bij een kindercentrum of gastouder werkzaam is of een persoon die structureel aanwezig is op een
      locatie waar gastouderopvang plaatsvindt:

      a. een houder van een kindercentrum;

      b. een gastouder;

      c. bij een kindercentrum of gastouder werkzaam persoon; of

      d. op een locatie waar gastouderopvang plaatsvindt structureel aanwezig persoon van 18 jaar of ouder.

      2 De deskundige heeft ten behoeve van de in het eerste lid, onderdelen a tot en met d, genoemde personen de
      volgende taken:

      a. het fungeren als aanspreekpunt;

      b. het adviseren over eventueel te nemen stappen;

      c. het bijstaan bij het nemen van stappen gericht op het zoeken naar een oplossing; en

      d. het desgevraagd begeleiden bij het indienen van een klacht of het doen van aangifte.

      3 De deskundige is, voor zover het misdrijven als bedoeld in het eerste lid betreft, vrijgesteld van
      de verplichting tot het doen van aangifte als bedoeld in de [artikelen 198, eerste lid][ref3], en
      [200, eerste lid, van het Wetboek van Strafvordering BES][ref4].

      4 De deskundige is verplicht tot geheimhouding van hetgeen de deskundige in de uitoefening van diens functie is
      toevertrouwd door een persoon als bedoeld in het eerste lid, onderdelen a tot en met d.

      5 Gelet op [artikel 23, eerste lid, onderdeel e, van de Wet bescherming persoonsgegevens BES][ref5] is het verbod
      om bijzondere persoonsgegevens als bedoeld in [artikel 16 van die wet][ref6] te verwerken niet van toepassing
      op de verwerking door de deskundige met betrekking tot de personen, bedoeld in het eerste lid, voor zover de
      verwerking noodzakelijk is voor de uitvoering van de taken, bedoeld in het tweede lid, of de bevoegdheid, bedoeld
      in het zevende lid.

      6 De deskundige verstrekt geen persoonsgegevens aan derden.

      7 In afwijking van het zesde lid is de deskundige bevoegd een opsporingsambtenaar als bedoeld in
      [artikel 1 van het Wetboek van Strafvordering BES][ref7] in kennis te stellen van een geval of vermoeden van een
      geval van een misdrijf als bedoeld in het eerste lid:

      a. in het belang van een kind dat gebruik maakt van kinderopvang; of

      b. indien de ernst van de situatie waarop de melding betrekking heeft daartoe aanleiding geeft.

      8 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de
      deskundige, waaronder de onafhankelijkheid en deskundigheid van de deskundige en voorschriften die aan de
      aanwijzing als deskundige worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0028570
      [ref2]: https://wetten.overheid.nl/BWBR0028570
