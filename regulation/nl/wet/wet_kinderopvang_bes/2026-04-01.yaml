  - number: '1.2'
    text: Deze wet is van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0049771/2026-04-01#Artikel1.2
  - number: '2.1'
    text: |-
      1 Het is verboden zonder vergunning van het bestuurscollege:

      a. een kindercentrum of een gastouderopvang te exploiteren; of

      b.

      2 Een aanvraag voor een vergunning of een verlenging of wijziging daarvan wordt door de houder van een
      kindercentrum of gastouder ingediend bij het bestuurscollege.

      3

      4 Het bestuurscollege stelt een kwaliteitscommissie in, die adviseert over het al dan niet verlenen van een
      vergunning, verlenging of wijziging daarvan.

      5 Ten behoeve van de advisering, bedoeld in het vierde lid, verzoekt het bestuurscollege:

      a. een op grond van [artikel 5.1, eerste lid][ref1], aangewezen ambtenaar te onderzoeken of de exploitatie
      redelijkerwijs zal plaatsvinden in overeenstemming met de bij of krachtens deze wet gestelde regels, bedoeld in dit
      hoofdstuk; en

      b.

      6 Bij of krachtens eilandsverordening worden nadere regels gesteld met betrekking tot:

      a. de aanvraag en registratie van een vergunning, verlenging of wijziging daarvan;

      b. het onderzoek, bedoeld in het vijfde lid;

      c. de kwaliteitscommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0049771#Artikel5.1
