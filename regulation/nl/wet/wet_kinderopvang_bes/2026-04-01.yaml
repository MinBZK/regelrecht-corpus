  - number: '5.10'
    text: |-
      1 Onze Minister kan een kindercentrum of gastouderopvang onmiddellijk geheel of gedeeltelijk sluiten gedurende
      een door Onze Minister te bepalen periode, indien en zolang uit een onderzoek als bedoeld in [artikel 5.3][ref1]
      blijkt dat de houder van het kindercentrum of de gastouder niet aan de bij of krachtens deze wet gegeven
      voorschriften voldoet en daardoor sprake is van een direct en ernstig gevaar voor de fysieke of sociale veiligheid
      of de gezondheid van personen.

      2 Bij toepassing van het eerste lid informeert Onze Minister het bestuurscollege.


      [ref1]: https://wetten.overheid.nl/BWBR0049771#Artikel5.3
    url: https://wetten.overheid.nl/BWBR0049771/2026-04-01#Artikel5.10
