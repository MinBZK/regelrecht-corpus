  - number: '5.13'
    text: |-
      1 Onze Minister kan mandaat verlenen van de bevoegdheid tot:

      a. het opleggen van een last onder dwangsom als bedoeld in [artikel 5.6][ref1];

      b. het opleggen van een bestuurlijke boete als bedoeld in [artikel 5.7][ref2];

      c. het opleggen van een tijdelijk verbod tot exploitatie als bedoeld in [artikel 5.10][ref3].

      2 Onze Minister kan machtiging verlenen tot het opstellen van een advies inzake het schorsen of intrekken van een
      vergunning als bedoeld in [artikel 5.11, eerste of tweede lid][ref4].


