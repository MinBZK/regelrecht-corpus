  - number: '2.11'
    text: |-
      1 Indien de houder van een kindercentrum op enigerlei wijze bekend is geworden dat een bij zijn
      rechtspersoon werkzaam persoon zich mogelijk schuldig maakt of heeft gemaakt aan een misdrijf tegen de
      zeden als bedoeld in [Titel XIV van het Wetboek van Strafrecht BES][ref1] of mishandeling als bedoeld in
      [Titel XX van het Wetboek van Strafrecht BES][ref2] jegens een kind van een ouder die gebruik maakt van
      de door hem geboden kinderopvang, treedt de houder onverwijld in overleg met een deskundige als bedoeld in
      [artikel 2.10a, eerste lid][ref3].

      2 Indien uit het overleg, bedoeld in het eerste lid, wordt geconcludeerd dat sprake is van een redelijk
      vermoeden dat de desbetreffende persoon zich schuldig heeft gemaakt aan een misdrijf als bedoeld in het eerste
      lid, doet de houder van een kindercentrum onverwijld aangifte bij een opsporingsambtenaar als bedoeld in
      [artikel 1 van het Wetboek van Strafvordering BES][ref4], en stelt de houder een deskundige als bedoeld in
      [artikel 2.10a, eerste lid][ref5], hiervan onverwijld in kennis.

      3 Indien een bij de rechtspersoon van de houder van een kindercentrum werkzaam persoon op enigerlei wijze bekend
      is geworden dat een ander ten behoeve van de rechtspersoon van die houder werkzaam persoon zich mogelijk schuldig
      maakt of heeft gemaakt aan een misdrijf als bedoeld in het eerste lid jegens een kind van een ouder die gebruik
      maakt van de door de houder van een kindercentrum geboden kinderopvang, stelt hij de houder van dat kindercentrum
      daarvan onverwijld in kennis.

      4 Indien toepassing van het derde lid ertoe zou leiden dat degene die van het vermoeden op de hoogte moet worden
      gesteld dezelfde persoon is als degene die zich mogelijk schuldig maakt of heeft gemaakt aan een misdrijf als
      bedoeld in het eerste lid, is [artikel 2.12, eerste en tweede lid][ref6], van overeenkomstige toepassing.

      5 De houder van een kindercentrum bevordert de kennis en het gebruik van de handelwijze, bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0028570
      [ref2]: https://wetten.overheid.nl/BWBR0028570
