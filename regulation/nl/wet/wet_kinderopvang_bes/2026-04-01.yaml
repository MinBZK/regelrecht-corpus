  - number: '5.3'
    text: |-
      1 Het bestuurscollege verstrekt op verzoek van een op grond van [artikel 5.1, eerste lid][ref1], aangewezen
      ambtenaar een overzicht van alle houders van kindercentra en gastouders waaraan een exploitatievergunning is
      verleend.

      2 Een op grond van [artikel 5.1, eerste lid][ref2], aangewezen ambtenaar onderzoekt in redelijkheid de
      overeenstemming met de bij of krachtens deze wet gestelde regels bij iedere houder van een kindercentrum en
      gastouder die een exploitatievergunning hebben:

      a. jaarlijks met betrekking tot de exploitatie; en

      b. eens per drie jaar voor wat betreft de financiële administratie.

      3 Naast het onderzoek kan als daar aanleiding toe is incidenteel onderzoek worden verricht naar de naleving door
      een houder van een kindercentrum of een gastouder van de bij of krachtens deze wet gestelde regels.

      4 Indien tijdens een onderzoek tekortkomingen zijn geconstateerd kunnen nadien een of meer nadere onderzoeken
      worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0049771#Artikel5.1
      [ref2]: https://wetten.overheid.nl/BWBR0049771#Artikel5.1
    url: https://wetten.overheid.nl/BWBR0049771/2026-04-01#Artikel5.3
