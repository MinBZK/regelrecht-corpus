  - number: '4.4'
    text: |-
      1 Onze Minister verwerkt de gegevens, bedoeld in dit artikel, met het oog op het besluiten over het verstrekken van
      een kinderopvangvergoeding, de betaling van een kinderopvangvergoeding.

      2 De hieronder vermelde instanties of personen verstrekken Onze Minister de gegevens en inlichtingen waarvan de
      kennisneming noodzakelijk is voor de uitvoering van deze wet:

      a. het bestuurscollege, voor zover de gegevens en inlichtingen betrekking hebben op de uitvoering van
      [artikel 3.2, eerste lid, onderdelen a, e en f][ref1];

      b. op grond van de [artikelen 5.1, eerste lid][ref2], of [184 van het Wetboek van strafvordering BES][ref3],
      aangewezen ambtenaren, voor zover de gegevens en inlichtingen betrekking hebben op het toezicht op de naleving van
      [hoofdstuk 3][ref4] of opsporing van een voorschrift van hoofdstuk 3 dat als strafbaar feit is aangemerkt;

      c. andere, bij algemene maatregel van bestuur aan te wijzen instanties die gehouden zijn gegevens aan Onze Minister
      te verstrekken waarvan de kennisneming noodzakelijk is voor de in het eerste lid genoemde doelen.


      [ref1]: https://wetten.overheid.nl/BWBR0049771#Artikel3.2
      [ref2]: https://wetten.overheid.nl/BWBR0049771#Artikel5.1
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel184
      [ref4]: https://wetten.overheid.nl/BWBR0049771#Hoofdstuk3
