  - number: '3.1'
    text: |-
      De ouder en diens partner die tevens ouder is, hebben voor de toepassing van dit hoofdstuk en de daarop berustende
      bepalingen een gezamenlijke aanspraak.
    url: https://wetten.overheid.nl/BWBR0049771/2026-04-01#Artikel3.1
  - number: '3.2'
    text: |-
      1 Onze Minister verstrekt op aanvraag een kinderopvangvergoeding aan een houder van een kindercentrum of een
      gastouder voor de kosten van dagopvang, buitenschoolse opvang van een kind in dat kindercentrum of die voorziening
      voor gastouderopvang, indien:

      a. aan die houder of gastouder een exploitatievergunning is verleend;

      b. een kinderopvangovereenkomst is gesloten en gedurende de duur van de overeenkomst gebruik wordt gemaakt van
      kinderopvang;

      c. de houder of de gastouder maandelijks de ouderbijdrage in rekening brengt;

      d. bij de ouder geen bijdrage in rekening wordt gebracht anders dan de ouderbijdrage;

      e. de ouder en het kind als ingezetene staan ingeschreven bij het openbaar lichaam waar de kinderopvang
      plaatsvindt;

      f.

      g. het structurele kinderopvang betreft.

      2 Een aanvraag als bedoeld in het eerste lid kan betrekking hebben op de volgende periode:

      a. voor dagopvang tot en met de laatste dag van de maand waarin het kind vier jaar wordt;

      b. voor buitenschoolse opvang vanaf de eerste dag na de maand waarin het kind vier jaar is geworden tot en met de
      laatste dag van de maand waarin het kind naar het voortgezet onderwijs gaat.

      3 Onze Minister kan een kinderopvangvergoeding verstrekken voor de opvang van een kind waarbij niet is voldaan
      aan het eerste lid, onderdeel e, of het tweede lid, indien het bestuurscollege dat in het belang van het kind
      adviseert.

      4 Het eerste lid is niet van toepassing, indien de ouder of de partner van de ouder van het kind gastouder is en de
      kinderopvangvergoeding wordt aangevraagd voor de kosten van gastouderopvang door die ouder of partner.

      5 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de onderwerpen, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0049771/2026-04-01#Artikel3.2
  - number: '3.3'
    text: |-
      1 De kinderopvangvergoeding wordt verstrekt met ingang van de dag waarop de kinderopvang start.

      2 In afwijking van het eerste lid, wordt de kinderopvangvergoeding niet eerder verstrekt dan met ingang van het
      volgende kwartaal, indien de kinderopvangovereenkomst is gesloten na een bij algemene maatregel van bestuur te
      bepalen datum.

      3 Onze Minister kan de kinderopvangvergoeding beëindigen met ingang van de eerste dag van de maand nadat:

      a. niet langer aan de voorwaarden, bedoeld in [artikel 3.2][ref1], wordt voldaan;

      b. de kinderopvangovereenkomst is opgezegd; of

      c. de ouderbijdrage gedurende drie aaneengesloten maanden niet is betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0049771#Artikel3.2
    url: https://wetten.overheid.nl/BWBR0049771/2026-04-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0049771
        artikel: '3.2'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '3.4'
    text: |-
      1 De kinderopvangvergoeding wordt verstrekt per dagdeel dat een kind op grond van de kinderopvangovereenkomst
      aanwezig is, tot een maximum van:

      a. twee per dag en 40 per maand voor dagopvang;

      b. een per dag en 20 per maand, of, tijdens schoolvakanties of ingeroosterde of structurele onderwijsvrije
      doordeweekse dagen in het primair onderwijs, twee per dag en 40 per maand voor buitenschoolse opvang;

      c. het totale aantal dagdelen waarop op basis van de exploitatievergunning kinderen kunnen worden opgevangen.

      2

      3
    url: https://wetten.overheid.nl/BWBR0049771/2026-04-01#Artikel3.4
  - number: '3.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de kinderopvangvergoeding, die
      betrekking kunnen hebben op:

      a. de hoogte van de kinderopvangvergoeding, die per openbaar lichaam kan verschillen en onder meer afhankelijk kan
      zijn van:

      1°. de opvangsoort;

      2°. het kostenniveau in het openbaar lichaam;

      3°. de leeftijd van het kind; en

      4°.

      b. indexering van de kinderopvangvergoeding.
    url: https://wetten.overheid.nl/BWBR0049771/2026-04-01#Artikel3.5
  - number: '3.6'
    text: |-
      1 Bij ministeriële regeling wordt bepaald welke gegevens door de houder van een kindercentrum of gastouder bij een
      aanvraag als bedoeld in [artikel 3.2, eerste lid][ref1], worden verstrekt.

      2 Onze Minister geeft de houder van het kindercentrum of de gastouder binnen acht weken na de dag van ontvangst
      van de aanvraag een beschikking omtrent de kinderopvangvergoeding. Onze Minister stelt de ouder in kennis van de
      beschikking, indien deze geheel of gedeeltelijk afwijzend luidt.

      3 Indien Onze Minister voor de beoordeling van een aanvraag nadere informatie nodig acht, kan de termijn, bedoeld
      in het tweede lid, met acht weken worden verlengd. Onze Minister stelt de aanvrager van de verlenging in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0049771#Artikel3.2
    url: https://wetten.overheid.nl/BWBR0049771/2026-04-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0049771
        artikel: '3.2'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '3.7'
    text: |-
      1 Onze Minister kan op verzoek van een houder van een kindercentrum of gastouder een voorschot op de
      kinderopvangvergoeding verstrekken.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de verstrekking van een voorschot.

      3 Bij ministeriële regeling wordt bepaald welke gegevens door de houder van een kindercentrum of gastouder bij een
      verzoek als bedoeld in het eerste lid worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0049771/2026-04-01#Artikel3.7
  - number: '3.8'
    text: |-
      1 Onze Minister kan een beschikking omtrent een kinderopvangvergoeding wijzigen of intrekken:

      a. indien een wijziging is opgetreden in de gegevens, bedoeld in [artikel 4.2, eerste lid][ref1];

      b. op grond van feiten of omstandigheden waarvan Onze Minister bij de verstrekking van de kinderopvangvergoeding
      redelijkerwijs niet op de hoogte kon zijn en op grond waarvan de kinderopvangvergoeding vermoedelijk op een te hoog
      bedrag is vastgesteld; of

      c. indien de kinderopvangvergoeding op een te hoog bedrag is vastgesteld en de houder van het kindercentrum, de
      gastouder of de ouder dit wist of behoorde te weten.

      2 Een beschikking wordt slechts ingetrokken, indien op grond van de gewijzigde gegevens niet langer recht op een
      kinderopvangvergoeding bestaat.

      3 Een beschikking omtrent een kinderopvangvergoeding wordt niet meer gewijzigd of ingetrokken, indien vijf jaren
      zijn verstreken na de datum waarop de kinderopvangvergoeding is betaald.

      4 Indien een kinderopvangvergoeding als gevolg van een wijziging of intrekking geheel of gedeeltelijk
      onverschuldigd is betaald, kan de kinderopvangvergoeding worden teruggevorderd voor zover die onverschuldigd is
      betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0049771#Artikel4.2
    url: https://wetten.overheid.nl/BWBR0049771/2026-04-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0049771
        artikel: '4.2'
        hoofdstuk: '4'
  - number: '3.9'
    text: |-
      1 Onze Minister kan de uitbetaling van de kinderopvangvergoeding geheel of gedeeltelijk opschorten voor een periode
      van acht weken, indien redelijkerwijs wordt vermoed dat de kinderopvangvergoeding ten onrechte of tot een te hoog
      bedrag wordt verstrekt.

      2 De belanghebbenden worden van de opschorting in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0049771/2026-04-01#Artikel3.9
  - number: '3.10'
    text: |-
      1 Onze Minister kan een door een houder van het kindercentrum of een gastouder verschuldigd bedrag verrekenen
      met de kinderopvangvergoeding of het voorschot daarop voor een volgende periode die op grond van deze wet aan die
      houder of gastouder wordt verstrekt.

      2 De verrekening vindt niet eerder plaats dan zes weken na de dagtekening van de beschikking tot terugvordering,
      tenzij het verschuldigde bedrag:

      a. als voorschot is verstrekt;

      b. wordt verrekend met de betaling van een volgend voorschot; en

      c. volgt uit het verschil tussen het verzoek tot verstrekking van het voorschot, bedoeld in onderdeel a, en nadien
      door de houder of gastouder aan Onze Minister verstrekte informatie over het aantal ingeschreven kinderen of per
      kind de leeftijd, de dagdelen of de soort kinderopvang.

      3 Onze Minister kan een door een houder van een kindercentrum of een gastouder te ontvangen bedrag verrekenen met
      een bestuurlijke boete als bedoeld in [artikel 5.7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0049771#Artikel5.7
    url: https://wetten.overheid.nl/BWBR0049771/2026-04-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0049771
        artikel: '5.7'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '3.11'
    text: |-
      1 Voor de kosten van kinderopvang waarvoor een kinderopvangvergoeding wordt verstrekt betaalt de ouder een
      ouderbijdrage.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de berekeningswijze en de hoogte van
      de ouderbijdrage per dagdeel, waarbij rekening wordt gehouden met de soort kinderopvang.
    url: https://wetten.overheid.nl/BWBR0049771/2026-04-01#Artikel3.11
  - number: '3.12'
    text: |-
      1 De houder van het kindercentrum of de gastouder brengt de maandelijkse ouderbijdrage in rekening aan de ouder,
      waarbij rekening wordt gehouden met:

      a. de soort kinderopvang; en

      b. de mate waarin van kinderopvang gebruik wordt gemaakt.

      2 De ouder betaalt de ouderbijdrage aan de houder van het kindercentrum of de gastouder.

      3 De houder van het kindercentrum of de gastouder spant zich jegens de ouder in de in rekening gebrachte
      ouderbijdrage daadwerkelijk te innen.
    url: https://wetten.overheid.nl/BWBR0049771/2026-04-01#Artikel3.12
  - number: '3.13'
    text: |-
      1 In afwijking van [artikel 3.12, tweede lid][ref1], kan het bestuurscollege de ouderbijdrage voldoen aan de
      houder van het kindercentrum of de gastouder, indien de ouder de ouderbijdrage niet kan betalen.

      2 Bij eilandsbesluit worden nadere regels gesteld met betrekking tot de voorwaarden waaronder het bestuurscollege
      de ouderbijdrage betaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0049771#Artikel3.12
    url: https://wetten.overheid.nl/BWBR0049771/2026-04-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0049771
        artikel: '3.12'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '3.14'
    text: |-
      De financiële middelen tot dekking van de uitgaven van de ingevolge deze wet uit te keren kinderopvangvergoeding
      zijn de middelen die Onze Minister daarvoor op de begroting heeft opgenomen en de middelen die de openbare lichamen
      daarvoor ter beschikking stellen.
    url: https://wetten.overheid.nl/BWBR0049771/2026-04-01#Artikel3.14
  - number: '3.15'
    text: |-
      Indien een houder van een kindercentrum of voorziening voor gastouderopvang een kind opvangt waarvoor geen
      kinderopvangvergoeding wordt verstrekt en wel voor andere kinderen kinderopvangvergoeding ontvangt, brengt die
      houder bij degene die de kinderopvangovereenkomst is aangegaan kosten in rekening die ten minste gelijk zijn aan de
      kinderopvangvergoeding die Onze Minister per maand voor de opvang van dat kind zou hebben verstrekt.
    url: https://wetten.overheid.nl/BWBR0049771/2026-04-01#Artikel3.15
  - number: '3.16'
    text: |-
      1 Onze Minister kan op aanvraag een aanvullende tegemoetkoming verstrekken aan een houder van een kindercentrum of
      een gastouder voor de extra kosten van plusopvang, indien die kosten:

      a. worden gemaakt om te voldoen aan de voorwaarden voor plusopvang, bedoeld in [artikel 2.17][ref1]; en

      b. betrekking hebben op de inzet van beroepskrachten, de accommodatie of de ruimtes binnen dat kindercentrum of die
      voorziening voor gastouderopvang.

      2 Onze Minister verzoekt het bestuurscollege te adviseren over de aanvraag, bedoeld in het eerste lid.

      3 Onze Minister kan een beschikking omtrent de aanvullende tegemoetkoming voor plusopvang tot vijf jaren na
      betaling wijzigen of intrekken:

      a. indien een wijziging is opgetreden in de gegevens, bedoeld in [artikel 4.2, eerste lid][ref2];

      b. op grond van feiten of omstandigheden waarvan Onze Minister bij de verstrekking redelijkerwijs niet op de hoogte
      kon zijn en op grond waarvan de tegemoetkoming vermoedelijk op een te hoog bedrag is vastgesteld; of

      c. indien de tegemoetkoming op een te hoog bedrag is vastgesteld en de houder van het kindercentrum of de gastouder
      dit wist of behoorde te weten.

      4 Indien de aanvullende tegemoetkoming voor plusopvang als gevolg van een wijziging of intrekking geheel of
      gedeeltelijk onverschuldigd is betaald, kan de tegemoetkoming worden teruggevorderd voor zover die onverschuldigd
      is betaald.

      5 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de aanvullende tegemoetkoming
      voor plusopvang, die betrekking kunnen hebben op:

      a. de voorwaarden voor toekenning van de tegemoetkoming;

      b. de hoogte van de tegemoetkoming en de duur en frequentie van de betaling daarvan, die per openbaar lichaam
      kunnen verschillen en onder meer afhankelijk kunnen zijn van:

      1°. de opvangsoort;

      2°. het kostenniveau in het openbaar lichaam;

      3°. de extra ondersteuningsbehoefte van het kind;

      4°. het aantal en het niveau van opleiding, scholing en ervaring van de beroepskrachten;

      c. indexering van de tegemoetkoming.

      6 Bij ministeriële regeling wordt bepaald welke gegevens bij een aanvraag als bedoeld in het eerste lid worden
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0049771#Artikel2.17
      [ref2]: https://wetten.overheid.nl/BWBR0049771#Artikel4.2
