  - number: '5.5'
    text: |-
      1 Indien de ernst van de overtreding of de omstandigheden waaronder zij is begaan daartoe aanleiding geven, wordt
      zij aan het openbaar ministerie voorgelegd.

      2 Indien ter zake van een overtreding aan de overtreder een bestuurlijke boete is opgelegd of Onze Minister heeft
      beslist dat voor de overtreding geen bestuurlijke boete zal worden opgelegd en dat schriftelijk aan de overtreder
      is medegedeeld, heeft dit dezelfde rechtsgevolgen als een kennisgeving van niet verdere vervolging als bedoeld in
      [artikel 279, eerste lid, van het Wetboek van Strafvordering BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel279
    url: https://wetten.overheid.nl/BWBR0049771/2026-04-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '279'
  - number: '5.6'
    text: |-
      Onze Minister kan in geval van overtreding van het bepaalde bij of krachtens deze wet de overtreder een last onder
      dwangsom opleggen, die ertoe strekt de overtreding ongedaan te maken of verdere overtreding te voorkomen.
    url: https://wetten.overheid.nl/BWBR0049771/2026-04-01#Artikel5.6
  - number: '5.7'
    text: |-
      1 Onze Minister kan een overtreder van het bepaalde bij of krachtens [artikel 2.16, tweede lid][ref1],
      een bestuurlijke boete opleggen van ten hoogste het bedrag van de tweede categorie, bedoeld in
      [artikel 27, vierde lid, van het Wetboek van Strafrecht BES][ref2].

      2 Onze Minister kan een overtreder van het bepaalde bij of krachtens de
      [artikelen 2.1, eerste lid][ref3], [2.3 tot en met 2.15][ref4], [2.17][ref5], [3.15][ref6]
      of [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref7], in samenhang met
      [artikel 5.2, eerste lid][ref8], een bestuurlijke boete opleggen van ten hoogste het bedrag van de vierde
      categorie, bedoeld in [artikel 27, vierde lid, van het Wetboek van Strafrecht BES][ref9].

      3 In afwijking van het tweede lid kan Onze Minister in geval van opzettelijke overtreding van het bepaalde bij of
      krachtens de in het tweede lid genoemde artikelen de overtreder een bestuurlijke boete opleggen van ten hoogste het
      bedrag van de vijfde categorie, bedoeld in [artikel 27, vierde lid, van het Wetboek van Strafrecht BES][ref10].

      4 Onze Minister kan een overtreder van het bepaalde bij of krachtens [artikel 4.2][ref11] of het bepaalde
      krachtens [artikel 4.7][ref12] over gegevensverstrekking door de houder van een kindercentrum of de gastouder een
      bestuurlijke boete opleggen van ten hoogste:

      a. het bedrag dat ten onrechte of tot een te hoog bedrag aan kinderopvangvergoeding is ontvangen, tot ten hoogste
      het bedrag van de vijfde categorie, bedoeld in [artikel 27, vierde lid, van het Wetboek van Strafrecht BES][ref13];
      of

      b. indien de overtreding niet heeft geleid tot een bedrag dat ten onrechte of tot een te hoog
      bedrag aan kinderopvangvergoeding is ontvangen, het bedrag van de derde categorie, bedoeld in
      [artikel 27, vierde lid, van het Wetboek van Strafrecht BES][ref14].

      5 Onze Minister kan een overtreder van het bepaalde bij of krachtens [artikel 4.3][ref15] of het bepaalde
      krachtens [artikel 4.7][ref16] over gegevensverstrekking door de ouder of de partner van de ouder een bestuurlijke
      boete opleggen van ten hoogste:

      a. het verschil tussen de onterecht verstrekte kinderopvangvergoeding en de betaalde
      ouderbijdrage, tot ten hoogste het bedrag van de vijfde categorie, bedoeld in
      [artikel 27, vierde lid, van het Wetboek van Strafrecht BES][ref17]; of

      b. indien de overtreding niet heeft geleid tot een verschil als bedoeld in onderdeel a, het bedrag van de tweede
      categorie, bedoeld in [artikel 27, vierde lid, van het Wetboek van Strafrecht BES][ref18].

      6 [Artikel 27, zevende en achtste lid, van het Wetboek van Strafrecht BES][ref19] is van overeenkomstige
      toepassing.


