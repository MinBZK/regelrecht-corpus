  - number: '5.8'
    text: |-
      1 [Titel 5.1 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing op de oplegging van een
      last onder dwangsom of een bestuurlijke boete als bedoeld [artikel 5.6][ref2] respectievelijk [artikel 5.7][ref3],
      met dien verstande dat voor de in [artikel 5:1, derde lid, tweede volzin, van de Algemene wet bestuursrecht][ref4]
      opgenomen verwijzing naar [artikel 51, tweede en derde lid, van het Wetboek van Strafrecht][ref5] gelezen moet
      worden: [artikel 53, tweede en derde lid, van het Wetboek van Strafrecht BES][ref6].

      2 [Afdeling 5.3.2][ref7] en [artikel 5:49, tweede lid, van de Algemene wet bestuursrecht][ref8] is van
      overeenkomstige toepassing op een last onder dwangsom als bedoeld in [artikel 5.6][ref9].

      3 De [artikelen 5:40 tot en met 5:52][ref10] en
      [5:53, tweede en derde lid, van de Algemene wet bestuursrecht][ref11] zijn van overeenkomstige toepassing op een
      bestuurlijke boete als bedoeld in [artikel 5.7][ref12], met dien verstande dat:

      a. voor de in [artikel 5:46, vierde lid, van die wet][ref13] opgenomen verwijzing naar
      [artikel 1, tweede lid, van het Wetboek van Strafrecht][ref14] gelezen moet worden:
      [artikel 1, tweede lid, van het Wetboek van Strafrecht BES][ref15];

      b. voor de in [artikel 5:47 van die wet][ref16] opgenomen verwijzing naar
      [artikel 12i van het Wetboek van strafvordering][ref17] gelezen moet worden:
      [artikel 25 van het Wetboek van Strafvordering BES][ref18];

      c. voor de in [artikel 5:48 van die wet][ref19] opgenomen verwijzing naar
      [artikel 152 van het Wetboek van Strafvordering][ref20] gelezen moet worden:
      [artikel 186 van het Wetboek van Strafvordering BES][ref21].


