preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, gelet op de grote armoedeproblematiek en achterstandenproblematiek
    op het terrein van ontwikkelen en leren en het belang om de kwaliteit van kinderopvang in Caribisch Nederland te
    verbeteren, wenselijk is om regels te stellen over kinderopvang op Bonaire, Sint Eustatius en Saba;

    Zo is het dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-Generaal,
    hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0049771/2026-04-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *beroepskracht:* persoon van 18 jaar of ouder die werkzaam is bij een kindercentrum, bezoldigd is en belast is
      met de verzorging, de opvoeding en het bijdragen aan de ontwikkeling van kinderen;
        - *beroepskracht in opleiding:* degene die in dienst van de houder van een kindercentrum en ten behoeve van het
      praktijkdeel van de opleiding belast is met de verzorging, de opvoeding en het bijdragen aan de ontwikkeling van
      kinderen bij een kindercentrum;
        - *bestuurscollege:* bestuurscollege als bedoeld in
      [artikel 36 van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1];
        - *buitenschoolse opvang:* kinderopvang voor kinderen in de leeftijd dat ze naar het basisonderwijs kunnen gaan,
      waarbij opvang wordt geboden voor of na de dagelijkse schooltijd evenals gedurende vrije dagen of middagen en in
      schoolvakanties;
        - *dagdeel:* periode van ten minste vier aaneengesloten uren in de ochtend, middag, avond of nacht;
        - *dagopvang:* kinderopvangopvang voor kinderen in de leeftijd van 0 tot en met de leeftijd dat ze naar het
      basisonderwijs kunnen gaan, waarbij opvang overdag wordt geboden;
        - *expertisecentrum onderwijszorg:* rechtspersoon als genoemd in
      [artikel 28, eerste lid, van de Wet primair onderwijs BES][ref2];
        - *exploitatievergunning:* door het openbaar lichaam verleende vergunning voor het exploiteren van een
      kindercentrum of gastouderopvang;
        - *gastouder:* degene van achttien jaar of ouder die gastouderopvang biedt;
        - *gastouderopvang:* kinderopvang in een gezinssituatie die betrekking heeft op gelijktijdige opvang van ten
      hoogste zes kinderen, waaronder begrepen de bloedverwant of aanverwant in de neergaande lijn van de gastouder
      of zijn partner die de leeftijd van tien jaar nog niet heeft bereikt, waarbij de opvang plaatsvindt: a. op het
      woonadres van de gastouder, dan wel b. op het woonadres van een van de ouders van de kinderen voor wie de gastouder
      opvang biedt;
        - *houder:* natuurlijk persoon van achttien jaar of ouder of rechtspersoon die een kindercentrum exploiteert;
        - *kind:* persoon als bedoeld in [artikel 3 van de Wet kinderbijslagvoorziening BES][ref3];
        - *kindercentrum:* voorziening waar kinderopvang plaatsvindt, niet zijnde gastouderopvang;
        - *kinderopvang:* bedrijfsmatig of anders dan om niet verzorgen, opvoeden en bijdragen aan de ontwikkeling van
      kinderen tot de eerste dag van de maand waarop het voortgezet onderwijs voor die kinderen begint;
        - *kinderopvangovereenkomst:* schriftelijke overeenkomst tussen de ouder en de houder van het kindercentrum of de
      gastouder over de opvang van een kind van de ouder in dat kindercentrum of door die gastouder;
        - *kinderopvangvergoeding:* vergoeding voor de kosten van kinderopvang als bedoeld in [artikel 3.2][ref4];
        - *Onze Minister:* Onze Minister voor Armoedebeleid, Participatie en Pensioenen;
        - *openbaar lichaam:* openbaar lichaam Bonaire, Sint Eustatius of Saba;
        - *ouder:* bloed- of aanverwant in opgaande lijn of pleegouder van een kind als bedoeld in
      [artikel 3 van de Wet kinderbijslagvoorziening BES][ref5];
        - *ouderbijdrage:* bijdrage als bedoeld in [artikel 3.11, eerste lid][ref6];
        - *stagiair:* degene die een opleiding volgt, waarvan het praktijkdeel een beperkt deel van de totale studieduur
      is, belast is met werkzaamheden bij de houder ten behoeve van het praktijkdeel van de opleiding en geen
      beroepskracht in opleiding is;
        - *verklaring omtrent het gedrag:* verklaring omtrent het gedrag, afgegeven volgens de
      [Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag BES][ref7];
        - *programma voor voorschoolse educatie:* programma dat gericht is op het verbeteren van de voorwaarden voor het
      met succes instromen in het basisonderwijs voor kinderen die nog niet tot het onderwijs kunnen worden toegelaten.


