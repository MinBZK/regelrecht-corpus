  - number: '2.2'
    text: |-
      1 Opvang door een houder van een kindercentrum of een gastouder geschiedt op basis van een
      kinderopvangovereenkomst.

      2 Een houder van een kindercentrum of een gastouder sluit een kinderopvangovereenkomst met een ouder die daarom
      verzoekt, tenzij sprake is van een bij algemene maatregel van bestuur aan te wijzen omstandigheid.

      3 Indien geen kinderopvangovereenkomst tot stand komt of de kinderopvangovereenkomst wordt opgezegd omdat de houder
      van het kindercentrum of de gastouder weigert het kind op te vangen, kan de ouder zich voor bemiddeling wenden tot
      de onafhankelijke organisatie, bedoeld in [artikel 2.9, tweede lid][ref1].

      4 Bij ministeriële regeling worden regels gesteld met betrekking tot de inhoud van de kinderopvangovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0049771#Artikel2.9
