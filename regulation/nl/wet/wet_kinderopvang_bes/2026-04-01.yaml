  - number: '2.3'
    text: |-
      1 Een houder van een kindercentrum of gastouder biedt verantwoorde kinderopvang, waaronder wordt verstaan:

      a. het in een veilige en gezonde omgeving bieden van emotionele veiligheid aan kinderen;

      b. het bevorderen van de persoonlijke en sociale competentie van kinderen;

      c. de socialisatie van kinderen door overdracht van algemeen aanvaarde waarden en normen;

      d. het spelenderwijs en doelgericht stimuleren van taalvaardigheden, rekenvaardigheden, motorische vaardigheden en
      sociaal-emotionele vaardigheden ten behoeve van een doorlopend ontwikkelingsproces voor kinderen.

      2 De houder van een kindercentrum of gastouder draagt er zorg voor dat de uitvoering van het pedagogisch beleid en
      het veiligheids- en gezondheidsbeleid, bedoeld in het eerste lid, schriftelijk is vastgelegd en wordt geëvalueerd
      en waar nodig bijgesteld.

      3 Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de in het eerste lid genoemde
      aspecten van verantwoorde kinderopvang.

      4 Het bestuurscollege draagt zorg voor begeleiding en ondersteuning aan de houder van een kindercentrum of
      gastouder bij het aanbieden van verantwoorde kinderopvang, waaronder pedagogische ondersteuning en advies.

      5 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de onderwerpen en taken
      waarover het bestuurscollege voor begeleiding en ondersteuning aan de houder van een kindercentrum of gastouder
      of pedagogische ondersteuning en advies zorgdraagt, waarbij onderscheid kan worden gemaakt tussen de openbare
      lichamen.
    url: https://wetten.overheid.nl/BWBR0049771/2026-04-01#Artikel2.3
  - number: '2.4'
    text: |-
      1 Een houder van een kindercentrum:

      a. organiseert de kinderopvang op zodanige wijze;

      b. voorziet het kindercentrum zowel kwalitatief als kwantitatief zodanig van personeel en materieel;

      c. draagt zorg voor een zodanige verantwoordelijkheidstoedeling; en

      d. voert een zodanig pedagogisch, veiligheids-, gezondheids-, educatief en organisatiebeleid;

      dat een en ander redelijkerwijs leidt tot verantwoorde kinderopvang.

      2 Ter uitvoering van het eerste lid besteedt een houder van het kindercentrum in ieder geval aantoonbaar aandacht
      aan:

      a. het aantal beroepskrachten in relatie tot het aantal kinderen per leeftijdscategorie;

      b. de groepsgrootte;

      c. het dagritme en een gevarieerd activiteitenprogramma;

      d. de herkenbaarheid van ruimtes en personen;

      e. de opleidingseisen, scholingseisen en ervaringseisen waaraan beroepskrachten voldoen;

      f. de voorwaarden waaronder en de mate waarin beroepskrachten in opleiding en stagiairs kunnen worden belast met de
      verzorging, opvoeding en bijdrage aan de ontwikkeling van kinderen;

      g. het volgen van de ontwikkeling van kinderen en het signaleren van bijzonderheden, waaronder door middel van een
      begeleidingsplan indien bijzonderheden worden gesignaleerd;

      h. het voorkomen van ontwikkel- en leerachterstanden door het programma af te stemmen op wat kinderen nodig hebben.

      3 Een houder van een kindercentrum past een programma voor voorschoolse educatie toe bij kinderen die gebruikmaken
      van dagopvang.

      4 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de voorwaarden voor
      verantwoorde kinderopvang bij een kindercentrum waarbij onderscheid kan worden gemaakt tussen dagopvang,
      buitenschoolse opvang, die betrekking kunnen hebben op:

      a. de veiligheid en de gezondheid;

      b. de minimale opleidingseisen, scholingseisen en ervaringseisen voor beroepskrachten;

      c. de inzet van beroepskrachten in opleiding en stagiairs;

      d. het aantal beroepskrachten in relatie tot het aantal kinderen per leeftijdscategorie;

      e. de groepsgrootte, en de herkenbaarheid van ruimtes en personen;

      f. het pedagogisch beleid en de pedagogische praktijk;

      g. het educatieve beleid in het kader van het voorkomen en bestrijden van ontwikkel- en leerachterstanden,
      waaronder voorschoolse educatie;

      h. de accommodatie en de inrichting van de ruimte die bestemd is voor kinderopvang;

      i. de beschikbare ruimte voor kinderen;

      j. kwaliteitszorg en de professionele kwaliteitscultuur;

      k. het dagritme en het gevarieerde activiteitenprogramma;

      l. het volgen van de ontwikkeling van kinderen en het signaleren van bijzonderheden, waaronder door middel van een
      begeleidingsplan indien bijzonderheden worden gesignaleerd.

      5 Bij of krachtens eilandsverordening worden nadere regels gesteld omtrent de voorwaarden voor kinderopvang, die
      betrekking kunnen hebben op:

      a. het taalniveau van een beroepskracht;

      b. aanvullende opleidingseisen, scholingseisen en ervaringseisen voor een beroepskracht;

      c. gezonde voeding;

      d. lokale partners met wie de houder van een kindercentrum afspraken maakt ten behoeve van de optimale ontwikkeling
      van kinderen.
    url: https://wetten.overheid.nl/BWBR0049771/2026-04-01#Artikel2.4
  - number: '2.5'
    text: |-
      Gastouderopvang wordt niet geboden door degene:

      a. van wie een of meer kinderen onderworpen zijn aan ondertoezichtstelling of voorlopige
      ondertoezichtstelling als bedoeld in [artikel 254 van Boek 1 van het Burgerlijk Wetboek BES][ref1],
      die met betrekking tot een of meer van zijn kinderen is ontheven uit het ouderlijk gezag als bedoeld in
      [artikel 266 van Boek 1 van het Burgerlijk Wetboek BES][ref2] of die met betrekking tot een of meer van zijn
      kinderen is ontzet van het gezag als bedoeld in [artikel 269 van Boek 1 van het Burgerlijk Wetboek BES][ref3]; of

      b. die ten behoeve van de opvang van kinderen in enigerlei vorm personeel in dienst heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel254
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel266
      [ref3]: https://wetten.overheid.nl/BWBR0028743#Artikel269
