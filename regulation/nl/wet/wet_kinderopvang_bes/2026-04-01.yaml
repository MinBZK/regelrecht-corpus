  - number: '6.3'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen voor een periode van ten hoogste vier jaar kindercentra of gastouders
      worden aangewezen waarbij experimenten kunnen worden uitgevoerd, die ten doel hebben:

      a. de totstandkoming van innovatieve kinderopvang mogelijk te maken;

      b. de kwaliteit van kinderopvang te verbeteren;

      c. de kwaliteitseisen omtrent huisvesting passender te maken voor de Caribische context;

      d. de doorstroom van de kinderopvang naar het basisonderwijs te versoepelen;

      e. de samenwerking tussen kinderopvangorganisaties en scholen waar basisonderwijs wordt gegeven te versoepelen; of

      f. de efficiëntie van het financieringsstelsel te verbeteren.

      2 Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent:

      a. de kwaliteit van de op grond van het eerste lid aan te wijzen vormen van kinderopvang;

      b. het toezicht op de naleving van de regels over de kwaliteit, bedoeld in het eerste lid, onderdeel a;

      c. de financiering van de kinderopvang;

      d. de duur van het experiment.

      3 Bij de in het eerste en tweede lid bedoelde regels kan worden afgeweken van [artikel 1.1, eerste lid][ref1], wat
      betreft de begrippen «kinderopvang», «dagopvang», «buitenschoolse opvang» en «gastouderopvang», alsmede van de bij
      of krachtens [hoofdstuk 2][ref2] gestelde regels.

      4 Bij of krachtens algemene maatregel van bestuur kunnen voorwaarden worden gesteld voor de deelname aan een
      experiment.

      5 Bij algemene maatregel van bestuur kan een experiment als bedoeld in het eerste lid na afloop van de looptijd
      worden voortgezet tot een structurele regeling is getroffen, maar niet langer dan twee jaren. Het eerste tot en met
      vierde lid zijn van overeenkomstige toepassing.

      6 Onze Minister zendt negen maanden voor het einde van de werkingsduur van een algemene maatregel van bestuur
      als bedoeld in het eerste lid aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van
      het experiment in de praktijk, alsmede een standpunt inzake de voortzetting van die maatregel anders dan als
      experiment.

      7 De houder van een kindercentrum of de gastouder die deelneemt aan een experiment en de ouder die bij een
      experiment betrokken is, verstrekken desgevraagd aan Onze Minister alle voor de evaluatie van dat experiment
      benodigde gegevens en inlichtingen.

      8 Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven over welke gegevens, bedoeld in het
      zevende lid, worden verstrekt en over de wijze van verstrekking van deze gegevens.


