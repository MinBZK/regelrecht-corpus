  - number: '4.7'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld over gegevensverstrekking als bedoeld in dit
      hoofdstuk, die betrekking kunnen hebben op:

      a. de te verwerken gegevens;

      b. de gevallen waarin in ieder geval gegevens worden verstrekt;

      c. de wijze van verstrekking van de gegevens en inlichtingen;

      d. het elektronische gegevensverkeer en de daarbij te gebruiken elektronische infrastructuur; en

      e. de eisen die aan de gegevensverstrekking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0049771/2026-04-01#Artikel4.7
  - number: '4.8'
    text: |-
      Onze Minister informeert het bestuurscollege, indien Onze Minister een houder van een kindercentrum of een
      gastouder een bestuurlijke maatregel oplegt die van dien aard is dat de continuïteit van de kinderopvang in het
      geding kan zijn.
    url: https://wetten.overheid.nl/BWBR0049771/2026-04-01#Artikel4.8
  - number: '5.1'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0049771/2026-04-01#Artikel5.1
  - number: '5.2'
    text: |-
      1 [Titel 5.2 van de Algemene wet bestuursrecht][ref1] is van toepassing, met uitzondering
      van de [artikelen 5:18][ref2] en [5:19][ref3], met dien verstande dat voor de
      in [artikel 5:16a van de Algemene wet bestuursrecht][ref4] opgenomen verwijzing
      naar [artikel 1 van de Wet op de identificatieplicht][ref5] gelezen moet worden:
      [artikel 2 van de Wet identificatieplicht BES][ref6].

      2 Voor zover een kindercentrum of een gastouderopvang in een woning is gevestigd, is een op grond van
      [artikel 5.1, eerste lid][ref7], aangewezen ambtenaar bevoegd zonder toestemming van de bewoner in die woning
      binnen te treden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
