  - number: '2.12'
    text: |-
      1 Indien een bij de rechtspersoon van de houder van een kindercentrum werkzame persoon op enigerlei wijze bekend
      is geworden dat de natuurlijke persoon die tevens houder is van een kindercentrum zich mogelijk schuldig maakt of
      heeft gemaakt aan een misdrijf tegen de zeden als bedoeld in [Titel XIV van het Wetboek van Strafrecht BES][ref1]
      of mishandeling als bedoeld in [Titel XX van het Wetboek van Strafrecht BES][ref2] jegens een kind van een ouder
      die gebruik maakt van de door die houder geboden kinderopvang kan degene in overleg treden met een deskundige als
      bedoeld in [artikel 2.10a, eerste lid][ref3].

      2 Indien sprake is van een redelijk vermoeden dat de houder zich schuldig heeft gemaakt aan een
      misdrijf als bedoeld in het eerste lid, doet de persoon die werkzaam is bij rechtspersoon van
      de houder van een kindercentrum onverwijld aangifte bij een opsporingsambtenaar als bedoeld in
      [artikel 1 van het Wetboek van Strafvordering BES][ref4].

      3 De houder van een kindercentrum bevordert de kennis en het gebruik van de handelwijze, bedoeld in dit artikel.


