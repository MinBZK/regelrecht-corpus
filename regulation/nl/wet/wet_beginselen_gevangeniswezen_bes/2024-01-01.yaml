---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_beginselen_gevangeniswezen_bes
regulatory_layer: WET
publication_date: '2010-09-01'
valid_from: '2024-01-01'
bwb_id: BWBR0028596
url: https://wetten.overheid.nl/BWBR0028596/2024-01-01
articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze wet wordt verstaan onder: - *Onze Minister:* Onze Minister van Justitie;
        - *gedetineerden:* de personen, ingesloten in een gevangenis, een huis van bewaring of in een door Onze Minister
      aangewezen instelling;
        - *onveroordeelden:* de personen, niet krachtens veroordeling tot straf of maatregel, ingesloten in een van de
      gestichten, bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028596#Artikel2
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028596
        artikel: '2'
        hoofdstuk: II
  - number: '2'
    text: |-
      De gestichten of afdelingen van de gestichten worden onderscheiden in gevangenissen, huizen van bewaring en door
      Onze Minister aangewezen instellingen.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel2
  - number: '3.1'
    text: |-
      Onze Minister wijst de gestichten of afdelingen van gestichten aan, die bestemd zijn voor gevangenis, huis van
      bewaring en een door Onze Minister aangewezen instelling.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel3
  - number: '3.2'
    text: |-
      Voor de opneming van vrouwelijke gedetineerden worden afzonderlijke gestichten of afdelingen van gestichten
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel3
  - number: '3.3'
    text: |-
      Onze Minister kan huizen van bewaring en in bijzondere gevallen andere gestichten aanwijzen, waarin zowel mannen
      als vrouwen worden opgenomen. In die gevallen worden mannen en vrouwen gescheiden ondergebracht.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel3
  - number: '4.1'
    text: |-
      In de gevangenissen wordt, behoudens het bepaalde in [artikel 11][ref1] en het bepaalde in
      [artikel 29 van het Wetboek van Strafrecht BES][ref2], uitsluitend de gevangenisstraf ten uitvoer gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028596#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel29
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028596
        artikel: '11'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '29'
  - number: '4.2'
    text: |-
      In bijzondere gevallen kan Onze Minister hechtenis en militaire detentie, vervangende hechtenis en militaire
      detentie daaronder begrepen, in een gevangenis ten uitvoer doen leggen.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel4
  - number: '5.1'
    text: 'De huizen van bewaring zijn bestemd:'
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel5
  - number: 5.1.a
    text: tot opneming van hen, die de straffen van hechtenis of van militaire detentie moeten ondergaan;
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel5
  - number: 5.1.b
    text: |-
      tot opneming van alle anderen, aan wie krachtens rechterlijke beslissing of door het openbaar gezag rechtens
      hun vrijheid is ontnomen, voor zover geen andere plaats voor hen is bestemd of voor zolang opname in de voor hen
      bestemde plaats niet mogelijk is;
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel5
  - number: 5.1.c
    text: tot verblijf voor doortrekkende gedetineerden.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel5
  - number: '5.2'
    text: |-
      In de huizen van bewaring kunnen ook degenen worden opgenomen, die tot gevangenisstraf veroordeeld zijn en wier
      straftijd niet meer dan acht maanden bedraagt.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel5
  - number: '5.3'
    text: |-
      Onze Minister kan, indien dit door een openbaar belang vereist wordt, bepalen dat veroordeelden in
      [artikel 4][ref1] bedoeld, tijdelijk in een huis van bewaring worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028596#Artikel4
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028596
        artikel: '4'
        hoofdstuk: II
  - number: '6'
    text: 'De door Onze Minister aangewezen instellingen zijn bestemd tot opneming van:'
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel6
  - number: 6.a
    text: |-
      hen, wier plaatsing in een instelling op grond van
      [artikel 39 van het Eerste Boek van het Wetboek van Strafrecht BES][ref1] moet volgen, indien niet tevens hun
      plaatsing in een psychiatrisch ziekenhuis is gelast, dan wel zodanige plaatsing door verlof of ontslag werd
      onderbroken of beëindigd;


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel39
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '39'
  - number: 6.b
    text: onveroordeelden, naar wier geestvermogens volgens wettelijke regeling een onderzoek noodzakelijk wordt geacht;
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel6
  - number: 6.c
    text: |-
      de gedetineerden, die tot gevangenisstraf veroordeeld zijn, doch die op grond van de gebrekkige ontwikkeling of
      ziekelijke stoornis van hun geestvermogens voor verblijf of verder verblijf in een gevangenis of huis van bewaring
      ongeschikt gebleken zijn of wier observatie noodzakelijk wordt geacht, een en ander volgens bij ministeriële
      regeling te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel6
  - number: '7'
    text: |-
      Onze Minister wijst een of meer gevangenissen aan, waarvan afdelingen in het bijzonder bestemd zijn voor de
      opneming van mannelijke tot gevangenisstraf veroordeelden, die de leeftijd van eenentwintig jaren nog niet hebben
      bereikt.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel7
  - number: '8'
    text: |-
      Onze Minister wijst een of meer gevangenissen aan, waarvan afdelingen in het bijzonder bestemd worden voor de
      opneming van mannelijke tot gevangenisstraf veroordeelden, niet in aanmerking komende voor plaatsing in een van de
      in [artikel 7][ref1] genoemde afdelingen, wier werkelijke straftijd niet meer dan acht maanden bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0028596#Artikel7
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028596
        artikel: '7'
        hoofdstuk: III
  - number: '9'
    text: |-
      Onze Minister wijst een of meer gevangenissen aan, waarvan afdelingen in het bijzonder bestemd worden voor de
      opneming van mannelijke tot gevangenisstraf veroordeelden, niet in aanmerking komende voor plaatsing in een* van de
      in [artikel 7][ref1] bedoelde afdelingen, wier werkelijke straftijd meer dan acht maanden bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0028596#Artikel7
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028596
        artikel: '7'
        hoofdstuk: III
  - number: '10'
    text: |-
      Onze Minister wijst een of meer gevangenissen aan, waarvan afdelingen in het bijzonder bestemd worden
      voor de opneming van mannelijke tot gevangenisstraf veroordeelden, die meer dan de helft van een opgelegde
      onvoorwaardelijke straf van tenminste drie jaren hebben doorgebracht in een andere afdeling van een gevangenis of
      huis van bewaring.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel10
  - number: '11'
    text: |-
      Onze Minister wijst een of meer gevangenissen aan, waarvan afdelingen in het bijzonder bestemd worden voor de
      opneming van gedetineerden uit alle kategorieën, die tijdelijk een regime met intensieve persoonlijke begeleiding
      behoeven.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel11
  - number: '12'
    text: |-
      Omtrent de wijze, waarop de tot gevangenisstraf veroordeelden over de verschillende gevangenissen worden verdeeld,
      worden bij algemene maatregel van bestuur nadere regelen gegeven.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel12
  - number: '13'
    text: |-
      Het opperbeheer van de gestichten berust bij Onze Minister, die voor elk gesticht of elke afdeling daarvan een
      huishoudelijk reglement vaststelt.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel13
  - number: '14'
    text: |-
      Het beheer van ieder gesticht berust bij de direkteur of een hoofd op wie het in deze wet omtrent de direkteur
      bepaalde van toepassing is.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel14
  - number: '15'
    text: Het personeel van de gestichten wordt door Onze Minister benoemd, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel15
  - number: '16.1'
    text: Bij ieder gesticht is een Commissie van Toezicht, waarvan de leden door Onze Minister worden benoemd en ontslagen.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel16
  - number: '16.2'
    text: 'De Commissie van Toezicht heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel16
  - number: 16.2.a
    text: |-
      toezicht te houden op de wijze van tenuitvoerlegging van de vrijheidsbeneming in het gesticht of afdelingen
      daarvan;
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel16
  - number: 16.2.b
    text: kennis te nemen van door de gedetineerden naar voren gebrachte grieven;
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel16
  - number: 16.2.c
    text: |-
      zorg te dragen voor de behandeling van klaagschriften ingevolge het bepaalde in [Hoofdstuk XII][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028596#HoofdstukXII
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028596
        hoofdstuk: XII
  - number: 16.2.d
    text: |-
      aan Onze Minister, de direkteur of het hoofd van een gesticht, al dan niet uit eigen beweging, advies en
      inlichtingen te geven omtrent het in onderdeel a gestelde.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel16
  - number: '16.3'
    text: |-
      De Commissie van Toezicht stelt zich door persoonlijk contact met de gedetineerden regelmatig op de hoogte van
      onder hen levende wensen en gevoelens. Bij toerbeurt treedt één van haar leden hiertoe op als maandcommissaris.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel16
  - number: '16.4'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld omtrent de bevoegdheden, de samenstelling en de werkwijze
      van de Commissie van Toezicht, de benoeming en het ontslag van haar leden alsmede over de werkzaamheden van de
      maandcommissaris.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel16
  - number: '17'
    text: |-
      Met handhaving van het karakter van de vrijheidsstraf of vrijheidsbenemende maatregel, wordt de tenuitvoerlegging
      hiervan mede dienstbaar gemaakt aan de voorbereiding van de terugkeer van de gedetineerden in de maatschappij.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel17
  - number: '18.1'
    text: |-
      De onveroordeelden worden aan geen andere beperkingen onderworpen dan die welke voor het doel van hun opsluiting of
      in het belang van de handhaving van de orde of de veiligheid in het gesticht noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel18
  - number: '18.2'
    text: Hun regime wordt, naar de beginselen van deze wet, geregeld bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel18
  - number: '19.1'
    text: |-
      Onze Minister kan in de huishoudelijke reglementen van gestichten of afdelingen van gestichten bepalen, dat de
      bevolking door de direkteur in groepen zal worden ingedeeld.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel19
  - number: '19.2'
    text: Het regime in de verschillende groepen kan verschillend zijn.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel19
  - number: '20.1'
    text: Onveroordeelden worden bij voorkeur niet met veroordeelde gedetineerden in een vertrek geplaatst.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel20
  - number: '20.2'
    text: |-
      Mannelijke gedetineerden beneden de eenentwintig jaren worden bij voorkeur afgezonderd van de volwassen
      gedetineerden.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel20
  - number: '21'
    text: |-
      Onverminderd het bepaalde in [artikel 19, tweede lid][ref1], kunnen bij ministeriële regeling regels worden gesteld
      met betrekking tot het toestaan van individuele voorrechten.


      [ref1]: https://wetten.overheid.nl/BWBR0028596#Artikel19
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0028596
        artikel: '19'
        hoofdstuk: V
  - number: '22'
    text: |-
      De tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel in een gesticht vindt plaats in
      algehele of in beperkte gemeenschap, dan wel in afzondering.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel22
  - number: '23.1'
    text: |-
      De tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel in een gesticht vindt als regel plaats
      in gemeenschap.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel23
  - number: '23.2'
    text: |-
      De directeur kan de gedetineerde op zijn verzoek dan wel ambtshalve de vrijheidsstraf of de vrijheidsbenemende
      maatregel in afzondering laten ondergaan indien de veiligheid, orde of goede gang van zaken in het gesticht
      daartoe, naar zijn oordeel, bepaaldelijk aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel23
  - number: '23.3'
    text: |-
      Indien de directeur ambtshalve besluit de gedetineerde de vrijheidsstraf of de vrijheidsbenemende maatregel in
      afzondering te laten ondergaan, dan wel indien hij een daartoe strekkend verzoek van de gedetineerde afwijst,
      geschiedt dat schriftelijk en met redenen omkleed. Daarbij wijst hij de gedetineerde op de mogelijkheid van beklag
      als bedoeld in [artikel 40][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028596#Artikel40
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028596
        artikel: '40'
        hoofdstuk: XII
  - number: '24.1'
    text: |-
      De direkteur draagt zorg voor de beschikbaarheid van arbeid voor de gedetineerden, voor zover de aard van de
      detentie zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel24
  - number: '24.2'
    text: |-
      Volwassen gedetineerden die tot een vrijheidsstraf (vervangende hechtenis en militaire detentie daaronder begrepen)
      zijn veroordeeld zijn verplicht de hen opgedragen arbeid te verrichten.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel24
  - number: '24.3'
    text: |-
      Onveroordeelden zijn niet tot arbeid verplicht. Indien zij verklaard hebben aan de arbeid te willen deelnemen,
      worden zij op gelijke voet als de in het tweede lid bedoelde gedetineerden daartoe in de gelegenheid gesteld.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel24
  - number: '25'
    text: |-
      De arbeid zal zich bij voorkeur uitstrekken tot het verrichten van de huisdienst en tot het vervaardigen van
      voorwerpen voor de overheidsdienst en objecten van algemeen nut.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel25
  - number: '26.1'
    text: |-
      Het aan de gedetineerden toe te kennen arbeidsloon wordt door Onze Minister vastgesteld. Een deel daarvan wordt
      bestemd voor de uitgaanskas. Het overige deel blijft onder bewaring van de direkteur, doch staat ter beschikking
      van de gedetineerden volgens nader bij ministeriële regeling te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel26
  - number: '26.2'
    text: De onveroordeelden kunnen over het arbeidsloon beschikken volgens bij ministeriële regeling vast te stellen regels.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel26
  - number: '27.1'
    text: Het door de gedetineerden verdiende arbeidsloon is hun eigendom.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel27
  - number: '27.2'
    text: |-
      Moedwillig of door achteloosheid door gedetineerden tijdens de detentie aan ’s Rijks eigendommen toegebrachte
      schade kan zowel op de uitgaanskas als op het overige gedeelte van het arbeidsloon worden verhaald. Voor het
      overige is de uitgaanskas onvervreemdbaar en niet vatbaar voor beslag.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel27
  - number: '28'
    text: |-
      De wijze waarop de uitgaanskas aan de gedetineerden na hun invrijheidstelling wordt uitgekeerd, wordt bij of
      krachtens algemene maatregel van bestuur geregeld.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel28
  - number: '29'
    text: |-
      De arbeidstijd wordt bij huishoudelijk regelement van de gestichten of afdelingen vastgesteld, zoveel mogelijk
      overeenkomstig die welke gebruikelijk is in het vrije bedrijf.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel29
  - number: '30'
    text: |-
      De arbeid zal zoveel mogelijk mede dienstbaar worden gemaakt aan het onderhouden, vergroten of verwerven van
      vakbekwaamheid.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel30
  - number: '31'
    text: |-
      Het behoort tot de taak van de direkteur te bevorderen, dat de gedetineerden de te hunnen behoeve gehouden
      godsdienstoefeningen en bezinningssamenkomsten kunnen bijwonen.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel31
  - number: '32.1'
    text: De gedetineerden worden in de gelegenheid gesteld godsdienstonderwijs te ontvangen.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel32
  - number: '32.2'
    text: Zij worden bovendien in de gelegenheid gesteld persoonlijk kontakt met geestelijke verzorgers te onderhouden.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel32
  - number: 32a.1
    text: |-
      De gedetineerde wordt toegestaan zich door een aan het gesticht verbonden arts of diens vervanger te laten
      onderzoeken en behandelen.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel32a
  - number: 32a.2
    text: |-
      De gedetineerde wordt toegestaan om zich voor eigen rekening door een arts van zijn keuze te laten onderzoeken
      en behandelen.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel32a
  - number: 32a.3
    text: 'De directeur draagt zorg dat de aan het gesticht verbonden arts of diens vervanger:'
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel32a
  - number: 32a.3.a
    text: regelmatig beschikbaar is voor het houden van een spreekuur;
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel32a
  - number: 32a.3.b
    text: |-
      op andere tijdstippen beschikbaar is, indien dit in het belang van de gezondheid van de gedetineerde noodzakelijk
      is;
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel32a
  - number: 32a.3.c
    text: |-
      de gedetineerden die hiervoor in aanmerking komen onderzoekt op hun geschiktheid voor deelname aan arbeid, sport of
      een andere activiteit.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel32a
  - number: 32a.4
    text: 'De directeur draagt zorg voor:'
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel32a
  - number: 32a.4.a
    text: |-
      de verstrekking van de door de aan het gesticht verbonden arts of diens vervanger voorgeschreven medicijnen en
      diëten;
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel32a
  - number: 32a.4.b
    text: de behandeling van de gedetineerde op aanwijzing van de aan het gesticht verbonden arts of diens vervanger;
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel32a
  - number: 32a.4.c
    text: |-
      de overbrenging van de gedetineerde naar een ziekenhuis dan wel een andere instelling, indien de onder b bedoelde
      behandeling aldaar plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel32a
  - number: 32a.5
    text: |-
      Bij algemene maatregel van bestuur kunnen regels gesteld worden inzake het klagen over beslissingen die ten aanzien
      van gedetineerden zijn genomen door de aan het gesticht verbonden arts of diens plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel32a
  - number: '33'
    text: |-
      Het behoort tot de taak van de direkteur de gedetineerden te helpen bij het zoeken naar een oplossing van de
      maatschappelijke moeilijkheden, die met het feit van hun detentie of met de omstandigheden, die tot het plegen van
      het strafbare feit hebben geleid, in verband staan.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel33
  - number: '34'
    text: |-
      De gedetineerden worden in de gelegenheid gesteld gebruik te maken van de in het gesticht aanwezige mogelijkheden
      tot onderwijs, vorming en rekreatie.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel34
  - number: '35'
    text: |-
      Aan gedetineerden, voor wie zulks wenselijk wordt geacht, wordt zoveel mogelijk aanvullend schoolonderricht
      gegeven.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel35
  - number: '36.1'
    text: |-
      In de gestichten of afdelingen van de gestichten kunnen door de direkteur, of bij zijn afwezigheid, belet of
      ontstentenis door zijn plaatsvervanger, de navolgende disciplinaire straffen worden opgelegd wegens het begaan van
      feiten, die onverenigbaar zijn met een goede orde en tucht:
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel36
  - number: 36.1.a
    text: opsluiting in de strafcel;
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel36
  - number: 36.1.b
    text: onthouding van bezoek, van het schrijven of ontvangen van brieven of beperking van andere rechten en gunsten;
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel36
  - number: 36.1.c
    text: geldboete tot een bedrag van ten hoogste het zakgeld van de gedetineerde over twee weken;
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel36
  - number: 36.1.d
    text: berisping.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel36
  - number: '36.2'
    text: |-
      De straf, bedoeld in het eerste lid, onderdeel a, kan voor ten hoogste twee weken, en die, bedoeld in het eerste
      lid, onderdeel b, voor ten hoogste vier weken, worden opgelegd. Zij kunnen tezamen worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel36
  - number: '37.1'
    text: Geen straf wordt opgelegd dan nadat de overtreder door hem, die de straf oplegt, is gehoord.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37
  - number: '37.2'
    text: |-
      Aan de gestrafte wordt binnen 24 uur na de strafoplegging een schriftelijke met redenen omklede mededeling
      uitgereikt, waarin tevens melding wordt gemaakt van de mogelijkheid van beklag bij de Commissie van Toezicht
      alsmede van de wijze waarop en de termijn waarbinnen dit beklag moet worden gedaan.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37
  - number: 37a.1
    text: |-
      De gedetineerde is verplicht de aanwijzingen die hem door de directeur in het belang van de veiligheid, orde of
      goede gang van zaken in het gesticht dan wel anderszins in het belang van de dienst worden gegeven, stipt op te
      volgen.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37a
  - number: 37a.2
    text: |-
      De gedetineerde kan worden verplicht in het gesticht en tijdens verblijf buiten het gesticht een door de directeur
      afgegeven legitimatiebewijs, voorzien van een daartoe van de gedetineerde gemaakte pasfoto, bij zich te dragen en
      op verlangen van de daartoe bevoegde personen te tonen.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37a
  - number: 37b.1
    text: |-
      De gedetineerde onthoudt zich van gedragingen die onverenigbaar zijn met de veiligheid, orde, goede gang van zaken
      en tucht.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37b
  - number: 37b.2
    text: 'Als onverenigbaar met de veiligheid, orde, goede gang van zaken en tucht wordt in ieder geval beschouwd:'
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37b
  - number: 37b.2.a
    text: het zich gedragen in strijd met het bij of krachtens enig wettelijk voorschrift bepaalde;
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37b
  - number: 37b.2.b
    text: het roken in een werkplaats zonder toestemming van de chef daarvan;
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37b
  - number: 37b.2.c
    text: het gebruik van onzedelijke of opruiende taal;
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37b
  - number: 37b.2.d
    text: het verstoren van de rust;
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37b
  - number: 37b.2.e
    text: het om geld spelen;
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37b
  - number: 37b.2.f
    text: het bij zich hebben van andere middelen om vuur te maken dan een aansteker of lucifers;
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37b
  - number: 37b.2.g
    text: het verhandelen, verruilen, lenen of weggeven van goederen tussen gedetineerden;
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37b
  - number: 37b.2.h
    text: het aanwezig hebben of gebruiken van alcoholhoudende drank;
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37b
  - number: 37b.2.i
    text: het zich bevinden elders dan in de aangewezen celruimtes, afdelingen, werkplaatsen en andere ruimten;
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37b
  - number: 37b.2.j
    text: het veroorzaken van of deelnemen aan ongeregeldheden;
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37b
  - number: 37b.2.k
    text: het pogen zich te onttrekken aan de vrijheidsbeneming.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37b
  - number: 37c.1
    text: |-
      De directeur kan, telkens wanneer dit naar oordeel noodzakelijk is, de gedetineerde aan het lichaam en zijn kleding
      onderzoeken en eventuele handbagage doen onderzoeken op voorwerpen die uit een oogpunt van veiligheid, orde of
      goede gang van zaken in het gesticht niet aanwezig mogen zijn. Het onderzoek aan kleding en lichaam wordt op een
      besloten plaats en, voor zover mogelijk, door personen van hetzelfde geslacht als de gedetineerde verricht.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37c
  - number: 37c.2
    text: De directeur kan alle vertrekken waarin gedetineerden verblijven, regelmatig doen onderzoeken.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37c
  - number: 37c.3
    text: |-
      Indien bij een onderzoek als bedoeld in het eerste of tweede lid voorwerpen worden aangetroffen die in verband met
      de veiligheid, orde en goede gang van zaken niet in het bezit van de gedetineerde mogen zijn, en voor zover het
      onderzoek betrekking heeft op de openingen of holten van het lichaam van de gedetineerden, deze voorwerpen zonder
      het gebruik van hulpmiddelen daaruit kunnen worden verwijderd, is de directeur bevoegd deze in beslag te nemen. Hij
      draagt zorg dat deze voorwerpen, hetzij onder afgifte van een bewijs van ontvangst ten behoeve van de gedetineerde
      op diens kosten worden bewaard, hetzij met toestemming van de gedetineerde worden vernietigd, hetzij aan een
      opsporingsambtenaar ter hand worden gesteld met het oog op de voorkoming en opsporing van strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37c
  - number: 37d.1
    text: |-
      De directeur kan, telkens wanneer dit naar oordeel noodzakelijk is, een persoon die het gesticht bezoekt, aan
      kleding en eventuele handbagage doen onderzoeken op voorwerpen die uit een oogpunt van veiligheid, orde of goede
      gang van zaken in het gesticht niet aanwezig mogen zijn. [Artikel 37c, eerste lid, tweede volzin][ref1], is van
      overeenkomstige toepassing. De bij een onderzoek aangetroffen voorwerpen kunnen in verband met de veiligheid, orde
      en goede gang van zaken in het gesticht terstond in bewaring worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028596#Artikel37c
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37d
    references:
      - id: ref1
        bwb_id: BWBR0028596
        artikel: 37c
        hoofdstuk: X
  - number: 37d.2
    text: |-
      Indien het gesticht beschikt over een detectiepoort zijn de bezoekers verplicht daarvan gebruik te maken, tenzij de
      directeur anders beslist.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37d
  - number: 37d.3
    text: |-
      In de gevallen waarin geen gestichtsmedewerker aanwezig is bij het bezoek, kan de directeur op grond van de
      veiligheid, orde of goede gang van zaken in het gesticht beslissen tot het afluisteren van de gesprekken tussen
      de gedetineerde en het bezoek. De gedetineerde en het bezoek worden daarvan vooraf door de directeur in kennis
      gesteld.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37d
  - number: 37e.1
    text: |-
      De directeur kan, indien dit noodzakelijk is in het belang van de orde, veiligheid en goede gang van zaken in het
      gesticht dan wel in verband met de beslissing tot plaatsing of overplaatsing dan wel in verband met het verlenen
      van verlof, een gedetineerde verplichten urine af te staan ten behoeve van onderzoek van die urine op aanwezigheid
      van gedragbeïnvloedende middelen.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37e
  - number: 37e.2
    text: |-
      Onze Minister stelt nadere regels omtrent de wijze van uitvoering van het urineonderzoek. Deze regels betreffen
      in elk geval het recht van de gedetineerde om de uitslag te vernemen en om voor eigen rekening een hernieuwd
      onderzoek van de afgestane urine te laten plaatsvinden. [Artikel 37c, eerste lid, tweede volzin][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028596#Artikel37c
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37e
    references:
      - id: ref1
        bwb_id: BWBR0028596
        artikel: 37c
        hoofdstuk: X
  - number: 37f.1
    text: |-
      De directeur kan bepalen dat een gedetineerde in het lichaam wordt onderzocht, indien dit noodzakelijk is ter
      afwending van ernstig gevaar voor de handhaving van de openbare orde of de veiligheid in het gesticht dan wel voor
      de gezondheid van de gedetineerde. Het onderzoek in het lichaam wordt verricht door een arts of, in diens opdracht,
      door een verpleegkundige.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37f
  - number: 37f.2
    text: |-
      Een medewerker van het gesticht waar de gedetineerde verblijft, kan indien onverwijlde tenuitvoerlegging geboden
      is, een beslissing als bedoeld in het eerste lid nemen.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37f
  - number: 37f.3
    text: |-
      Indien bij het onderzoek in het lichaam voorwerpen worden aangetroffen die niet in het bezit van de gedetineerde
      mogen zijn, en deze voorwerpen door de arts of de verpleegkundige uit het lichaam kunnen worden verwijderd, is de
      directeur bevoegd deze in beslag te nemen. [Artikel 37c, derde lid, laatste volzin][ref1] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028596#Artikel37c
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37f
    references:
      - id: ref1
        bwb_id: BWBR0028596
        artikel: 37c
        hoofdstuk: X
  - number: 37g.1
    text: |-
      De directeur kan een gedetineerde verplichten te gedogen dat ten aanzien van hem een bepaalde geneeskundige
      handeling wordt verricht, indien die handeling naar het oordeel van een arts volstrekt noodzakelijk is ter
      afwending van gevaar voor de gezondheid of veiligheid van de gedetineerde of van anderen. De handeling wordt
      verricht door een arts of, in diens opdracht, door een verpleegkundige.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37g
  - number: 37g.2
    text: Bij algemene maatregel van bestuur kunnen nadere regels worden gegeven omtrent de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37g
  - number: 37h.1
    text: |-
      De directeur is bevoegd, indien de veiligheid, orde of goede gang van zaken in het gesticht dit naar zijn oordeel
      bepaaldelijk noodzakelijk maakt, ten aanzien van een bepaalde gedetineerde af te wijken van een aan deze bij of
      krachtens deze wet toegekend recht.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37h
  - number: 37h.2
    text: |-
      De directeur stelt de gedetineerde onverwijld schriftelijk van zijn beslissing in kennis. Daarbij wijst hij de
      gedetineerde op de mogelijkheid om de zaak voor te leggen aan de maandcommissaris, bedoeld in [artikel 16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028596#Artikel16
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37h
    references:
      - id: ref1
        bwb_id: BWBR0028596
        artikel: '16'
        hoofdstuk: IV
  - number: 37i.1
    text: |-
      Indien zich in het gesticht ernstige ongeregeldheden voordoen of zich dreigen voor te doen, neemt de directeur alle
      maatregelen die redelijkerwijs noodzakelijk zijn voor het herstel of de handhaving van de veiligheid, orde of goede
      gang van zaken in het gesticht.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37i
  - number: 37i.2
    text: |-
      De directeur is in het geval, bedoeld in het eerste lid, bevoegd de bij of krachtens deze wet toegekende rechten
      van allen die zich in het gesticht bevinden, op te schorten of te beperken. Hij stelt Onze Minister daarvan
      onverwijld op de hoogte.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37i
  - number: 37i.3
    text: |-
      De opschorting of beperking, bedoeld in het tweede lid, is gedurende maximaal driemaal vierentwintig uur van
      kracht. Deze periode kan telkens met eenzelfde maximum duur worden verlengd door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37i
  - number: 37j
    text: |-
      Indien de officier van justitie of de rechter-commissaris maatregelen heeft bevolen in het belang van
      strafrechtelijk onderzoek ten aanzien van een onveroordeelde voert de directeur die maatregelen onverwijld uit.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37j
  - number: 37k.1
    text: |-
      De directeur is bevoegd jegens een gedetineerde geweld te gebruiken dan wel vrijheidsbeperkende middelen aan te
      wenden, voor zover dit noodzakelijk is met het oog op een van de volgende belangen;
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37k
  - number: 37k.1.a
    text: de handhaving van de veiligheid, orde of goede gang van zaken in het gesticht;
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37k
  - number: 37k.1.b
    text: de uitvoering van een door de directeur genomen beslissing;
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37k
  - number: 37k.1.c
    text: de voorkoming van het zich onttrekken door de gedetineerde aan het op hem uitgeoefende toezicht;
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37k
  - number: 37k.1.d
    text: |-
      de uitvoering van een ingevolge het [Wetboek van Strafvordering BES][ref1] door de officier van justitie of de
      rechter-commissaris genomen beslissing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37k
    references:
      - id: ref1
        bwb_id: BWBR0028681
  - number: 37k.2
    text: |-
      De daartoe door de directeur aangewezen medewerkers zijn bevoegd jegens een gedetineerde geweld te gebruiken of
      vrijheidsbeperkende middelen aan te wenden met het oog op een van de volgende belangen:
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37k
  - number: 37k.2.a
    text: de uitvoering van een door hem genomen beslissing;
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37k
  - number: 37k.2.b
    text: de voorkoming van het zich onttrekken van de gedetineerde aan het op hem uitgeoefende toezicht.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37k
  - number: 37k.3
    text: |-
      Aan het gebruik van geweld gaat zo mogelijk een waarschuwing vooraf. Degene die geweld heeft gebruikt, maakt
      hiervan onverwijld een schriftelijk verslag en doet dit verslag onverwijld de directeur toekomen.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37k
  - number: 37k.4
    text: Onze Minister stelt nadere regels omtrent het gebruik van geweld en de aanwending van vrijheidsbeperkende middelen.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37k
  - number: 37l
    text: |-
      De bevoegdheden, ingevolge dit hoofdstuk toegekend aan de directeur, kunnen bij zijn afwezigheid, belet of
      ontstentenis tevens worden uitgeoefend door zijn plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel37l
  - number: '38'
    text: |-
      In bijzondere gevallen kan Onze Minister bepalen, dat de tenuitvoerlegging van een vrijheidsstraf gedurende een
      tijdvak van ten hoogste drie maanden wordt onderbroken.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel38
  - number: '39.1'
    text: |-
      Een gedetineerde kan, naar bij ministeriële regeling vast te stellen regels, vergund worden tijdelijk het gesticht
      te verlaten.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel39
  - number: '39.2'
    text: |-
      De in het eerste lid bedoelde nadere regels betreffen in elk geval de criteria waaraan een gedetineerde moet
      voldoen om voor het verlof in aanmerking te komen, de bevoegdheid tot en de wijze van verlening, weigering,
      beperking en intrekking alsmede de duur en frequentie van het verlof en de voorwaarden die aan het verlof kunnen
      worden verbonden.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel39
  - number: '39.3'
    text: |-
      Het verlaten van het gesticht, bedoeld in het eerste lid, schort de tenuitvoerlegging van de vrijheidsstraf of
      vrijheidsbenemende maatregel niet op.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel39
  - number: '40.1'
    text: 'Een gedetineerde kan beklag doen over:'
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel40
  - number: 40.1.a
    text: de op hem toegepaste beslissing tot plaatsing in afzondering;
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel40
  - number: 40.1.b
    text: een hem betreffende beslissing tot oplegging van een disciplinaire straf;
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel40
  - number: 40.1.c
    text: |-
      een hem betreffende beslissing tot weigering van een verzoek als bedoeld in [artikel 23][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028596#Artikel23
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0028596
        artikel: '23'
        hoofdstuk: V
  - number: 40.1.d
    text: het geweld dat jegens hem is gebruikt dan wel over de vrijheidsbeperkende maatregel die jegens hem is aangewend.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel40
  - number: '40.2'
    text: De gedetineerde die beklag wenst te doen wordt daartoe onverwijld in de gelegenheid gesteld.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel40
  - number: '41.1'
    text: |-
      Het beklag wordt schriftelijk gedaan bij de Commissie van Toezicht bij het gesticht waar de gedetineerde ten tijde
      van het geven van de beslissing verbleef.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel41
  - number: '41.2'
    text: |-
      Het beklag moet worden gedaan uiterlijk op de derde dag na die waarop de gedetineerde kennis heeft gekregen van de
      beslissing waarover hij zich wenst te beklagen.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel41
  - number: '41.3'
    text: |-
      Een na afloop van de in het tweede lid genoemde termijn ingediend klaagschrift is niettemin ontvankelijk, indien
      blijkt, dat de gedetineerde het beklag zo spoedig heeft gedaan als redelijkerwijs van hem kon worden verlangd.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel41
  - number: '42.1'
    text: Het klaagschrift wordt behandeld door een door de Commissie van Toezicht uit haar midden benoemde beklagcommissie.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel42
  - number: '42.2'
    text: |-
      De samenstelling van de beklagcommissie, alsmede de wijze van behandeling van het klaagschrift worden bij algemene
      maatregel van bestuur nader geregeld.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel42
  - number: '43.1'
    text: |-
      Hangende de uitspraak op het klaagschrift kan de beklagcommissie op verzoek van de klager, na de direkteur
      te hebben gehoord, de tenuitvoerlegging van de beslissing waarop het klaagschrift betrekking heeft geheel of
      gedeeltelijk schorsen.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel43
  - number: '43.2'
    text: De beklagcommissie doet hiervan onverwijld mededeling aan de direkteur en de klager.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel43
  - number: '44.1'
    text: |-
      De beklagcommissie doet zo spoedig mogelijk, doch in ieder geval binnen een termijn van twee weken, te rekenen
      vanaf de datum waarop het klaagschrift is ontvangen, uitspraak in eerste en laatste instantie.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel44
  - number: '44.2'
    text: |-
      De uitspraak strekt tot gehele of gedeeltelijke niet-ontvankelijkverklaring, ongegrondverklaring, dan wel
      gegrondverklaring van het beklag.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel44
  - number: '44.3'
    text: |-
      De beklagcommissie verklaart het beklag gegrond en vernietigt de beslissing waarover is geklaagd geheel of
      gedeeltelijk, indien zij van oordeel is dat deze:
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel44
  - number: 44.3.a
    text: in strijd is met een in het gesticht of de afdeling van het gesticht geldend voorschrift, dan wel
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel44
  - number: 44.3.b
    text: bij afweging van alle in aanmerking komende belangen en omstandigheden onredelijk of onbillijk moet worden geacht.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel44
  - number: '44.4'
    text: 'Bij toepassing van het derde lid kan de beklagcommissie:'
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel44
  - number: 44.4.a
    text: |-
      de direkteur, zo nodig onder het stellen van een termijn, opdragen een nieuwe beslissing te nemen met inachtneming
      van haar uitspraak;
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel44
  - number: 44.4.b
    text: bepalen dat haar uitspraak in de plaats treedt van de vernietigde beslissing;
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel44
  - number: 44.4.c
    text: volstaan met de gehele of gedeeltelijke vernietiging.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel44
  - number: '44.5'
    text: |-
      Indien het derde lid toepassing vindt, worden de gevolgen van de vernietigde beslissing, voor zover mogelijk, door
      de direkteur ongedaan gemaakt, dan wel in overeenstemming gebracht met de uitspraak van de beklagcommissie.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel44
  - number: '44.6'
    text: |-
      Voor zover de in het vijfde lid bedoelde gevolgen niet meer ongedaan te maken zijn, bepaalt de beklagcommissie,
      na de direkteur te hebben gehoord, of enige compensatie aan de klager geboden is. In bijzondere gevallen kan aan
      de klager een naar redelijkheid en billijkheid te bepalen geldelijke tegemoetkoming worden toegekend. Bij algemene
      maatregel van bestuur kan het bedrag worden vastgesteld dat ten hoogste kan worden uitgekeerd.
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel44
  - number: '45'
    text: |-
      Op de beslissingen met betrekking tot medische verzorging, veiligheid, orde
      of goede gang van zaken die voor het tijdstip van transitie, bedoeld in
      [artikel 1, onder a, van de Invoeringswet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1] zijn genomen
      door de daartoe bevoegde personen van een gesticht is deze wet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel1
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: '1'
  - number: '46'
    text: 'Deze wet wordt aangehaald als: Wet beginselen gevangeniswezen BES.'
    url: https://wetten.overheid.nl/BWBR0028596/2024-01-01#Artikel46
