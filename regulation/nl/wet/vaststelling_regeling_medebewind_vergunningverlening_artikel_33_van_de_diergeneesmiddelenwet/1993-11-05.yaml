preamble:
  text: |-
    Gelet op richtlijn nr. 90/167/EEG van de Raad van de Europese Gemeenschappen van 26 maart 1990 tot vaststelling van
    de voorwaarden voor de bereiding, het in de handel brengen en het gebruik van diervoeders met medicinale werking
    (PbEG L 92) en op artikel 34 van de Diergeneesmiddelenwet;

    Gezien het advies van de Vereniging van Fabrikanten en Importeurs van Diergeneesmiddelen in Nederland (Fidin) en de
    Vereniging van Nederlandse Fabrikanten van Veevoedertoezeggingen (Nefato);

