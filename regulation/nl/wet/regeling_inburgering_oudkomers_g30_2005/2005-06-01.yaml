    De Minister voor Vreemdelingenzaken en Integratie,

    Handelende in overeenstemming met de Minister voor Bestuurlijke Vernieuwing en Koninkrijksrelaties;

    Gelet op de artikelen 6, tweede lid, en 14 van het Besluit brede doeluitkering sociaal, integratie en veiligheid;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0018320/2005-06-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. Minister: de Minister voor Vreemdelingenzaken en Integratie;

      b. Besluit: het [Besluit brede doeluitkering sociaal, integratie en veiligheid][ref1];

      c. Uitvoeringsregeling: de [Uitvoeringsregeling brede doeluitkering sociaal, integratie en veiligheid][ref2];

      d. gemeente: een gemeente als bedoeld in [artikel 1, aanhef en onder b, van het Besluit][ref3];

      e. gemeentebestuur: het college van burgemeester en wethouders van een gemeente, als bedoeld in
      [artikel 1, aanhef en onder b van het Besluit][ref4];

      f. oudkomer: een oudkomer als bedoeld in [artikel 1, aanhef en onder i, van het Besluit][ref5];

      g. traject: een traject dat de oudkomer volgt waarbij het onderdeel Nederlands als tweede taal wordt gekoppeld aan
      onderdelen voor het bereiken van werk, toegang tot beroepsonderwijs, opvoedingsondersteuning of sociale activering;

      h. prognose: het aantal oudkomers dat naar de verwachting van het gemeentebestuur een traject zal starten in 2005.


