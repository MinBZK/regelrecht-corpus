  - number: '2'
    text: |-
      Deze regeling heeft ten doel:

      a. te bevorderen dat oudkomers die in een maatschappelijke achterstandssituatie verkeren, waaronder in het
      bijzonder diegenen die behoren tot de groep werklozen, opvoeders of geestelijke bedienaren, deelnemen aan een
      traject en dit traject afronden teneinde hun maatschappelijke positie te verbeteren; en

      b. te bevorderen dat gemeenten aan oudkomers een traject aanbieden.
    url: https://wetten.overheid.nl/BWBR0018320/2005-06-01#Artikel2
  - number: '3'
    text: |-
      Het gemeentebestuur verstrekt binnen acht weken na inwerkingtreding van deze regeling aan de Minister een
      prognose conform het in [bijlage 2][ref1] opgenomen model indien het gemeentebestuur in aanmerking wenst
      te komen voor verlening van een aandeel in de middelen voor de inburgering van oudkomers als bedoeld in
      [artikel 10 van het Besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018320
      [ref2]: https://wetten.overheid.nl/BWBR0018238#Artikel10
    url: https://wetten.overheid.nl/BWBR0018320/2005-06-01#Artikel3
    references:
