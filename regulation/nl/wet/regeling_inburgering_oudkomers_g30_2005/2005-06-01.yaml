  - number: '5'
    text: |-
      1 Het gemeentebestuur sluit een overeenkomst met de oudkomer die een traject zal aanvangen.

      2 Een traject omvat tenminste 300 contacturen.

      3 De overeenkomst bevat tenminste bepalingen met betrekking tot:

      a. het doel van het traject;

      b. de onderdelen van het traject;

      c. het aantal lesuren van het traject;

      d. de aard en de omvang van de individuele begeleiding;

      e. de verplichtingen van het gemeentebestuur;

      f. de verplichtingen van de oudkomer;

      g. de informatieoverdracht tussen het gemeentebestuur, de instellingen betrokken bij het aanbieden van het traject
      en de oudkomer over de voortgang van die oudkomer in het traject;

      h. de gevolgen welke zijn verbonden aan niet-nakoming van de overeenkomst door de oudkomer.

      4 Het gemeentebestuur sluit op grond van deze regeling met een oudkomer slechts één overeenkomst.
    url: https://wetten.overheid.nl/BWBR0018320/2005-06-01#Artikel5
  - number: '6'
    text: |-
      1 Het gemeentebestuur waaraan ingevolge [artikel 13 van de Uitvoeringsregeling][ref1] een voorschot op het
      inburgeringsdeel is verleend, draagt er zorg voor dat de oudkomer met wie een overeenkomst als bedoeld in
      [artikel 5][ref2] is gesloten een begintoets en een eindtoets aflegt aan de hand waarvan het niveau Nederlands als
      tweede taal van de oudkomer wordt vastgesteld.

      2 Voor de begintoets en de eindtoets, bedoeld in het eerste lid, wordt uitsluitend gebruik gemaakt van de hierna
      volgende combinaties van toetsen:

      a. de Intaketoets NT2 als begintoets met de NT2-Profieltoets, NT2-Cat of Itemdito als eindtoets; of

      b. de Intaketoets Alfabetisering NT2 als begintoets met de NT2-Profieltoets Alfabetisering als eindtoets.


      [ref1]: https://wetten.overheid.nl/BWBR0018516#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0018320#Artikel5
