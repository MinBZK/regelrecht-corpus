        artikel: '10'
  - number: '4'
    text: |-
      1 De Minister stelt de factor T als bedoeld in [artikel 13, eerste lid, van de Uitvoeringsregeling][ref1] vast
      binnen tien weken na inwerkingtreding van deze regeling.

      2 In bijlage 1 van deze regeling is een indicatie opgenomen van het aantal in 2005 in te burgeren aantal oudkomers
      per gemeente. Dit aantal is berekend naar evenredigheid van het totaal van de in alle gemeenten woonachtige leden
      van etnische minderheidsgroepen uit de eerste generatie die behoren tot de groep niet-westerse allochtonen.

      3 De hoogte van de factor T voor een gemeente is afhankelijk van de prognose en wordt als volgt berekend:

      a. indien de prognose gelijk is aan het aantal oudkomers als genoemd in [bijlage 1, vierde kolom][ref2], is de
      factor T het in de vierde kolom genoemde getal;

      b. indien de prognose lager is dan het in de [bijlage 1, vierde kolom][ref3], genoemde aantal oudkomers, wordt de
      hoogte van de factor T naar evenredigheid verlaagd;

      c. indien de prognose hoger is dan het in de [bijlage 1, vierde kolom][ref4], genoemde aantal oudkomers, wordt de
      hoogte van de factor T:

      1°. in het geval het beschikbare budget toereikend is, naar evenredigheid verhoogd;

      2°. in het geval het beschikbare budget niet toereikend is, vastgesteld conform het in de vierde kolom genoemde
      getal, welk getal wordt verhoogd met een getal dat afhankelijk is van de verdeling van de resterende middelen uit
      het beschikbare budget naar evenredigheid van het aantal oudkomers als genoemd in [bijlage 1, vierde kolom][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0018516#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0018320
