preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een definitieve regeling betreffende de Mijnraad vast
    te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002707/1997-02-21#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:

      delfstoffen:

      a. met betrekking tot het gebied, waarop de wet van 21 april 1810 (*Bulletin des Lois* 285) van toepassing is,
      delfstoffen als bedoeld in artikel 2 van die wet;

      b. met betrekking tot het continentaal plat als bedoeld in
      [artikel 1, eerste lid, van de Mijnwet continentaal plat][ref1] (*Stb.* 1965, 428) delfstoffen als in dat lid
      bedoeld;

      Onze Minister: Onze Minister van Economische Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel1
    url: https://wetten.overheid.nl/BWBR0002707/1997-02-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002504
        artikel: '1'
  - number: '2'
    text: |-
      1 Er is een Mijnraad. Deze heeft zijn zetel te 's-Gravenhage.

      2 De Mijnraad heeft tot taak Onze Minister in de bij wet bepaalde gevallen of desgevraagd te adviseren over door
      Onze Minister te geven beschikkingen, voor zover deze betrekking hebben op de opsporing of winning van delfstoffen.
      De Mijnraad heeft voorts tot taak Onze Minister desgevraagd de inlichtingen te verstrekken die nodig zijn voor de
      beoordeling van de uitvoerbaarheid van voorgenomen wettelijke voorschriften en algemene beleidsvoornemens, voor
      zover deze betrekking hebben op de opsporing of winning van delfstoffen.

      3 De raad brengt jaarlijks aan Onze Minister verslag uit omtrent zijn werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0002707/1997-02-21#Artikel2
  - number: '3'
    text: |-
      1 De Mijnraad bestaat uit ten hoogste tien leden, die telkens voor vier jaar door Ons worden benoemd.

      2 Hij, die tot lid is benoemd ter vervulling van een tussentijds opengevallen plaats, treedt af op het tijdstip,
      waarop degene, in wiens plaats hij is benoemd, moest aftreden.

      3 De voorzitter wordt door Ons uit de leden van de raad aangewezen.

      4 De raad wijst uit zijn midden een plaatsvervangend voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0002707/1997-02-21#Artikel3
  - number: '4'
    text: De Mijnraad heeft een secretariaat, dat bestaat uit een of meer door Onze Minister aan te wijzen personen.
    url: https://wetten.overheid.nl/BWBR0002707/1997-02-21#Artikel4
  - number: '5'
    text: |-
      Onze Minister kan zich al dan niet op verzoek van de Mijnraad in diens vergaderingen door een of meer door hem aan
      te wijzen ambtenaren laten vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0002707/1997-02-21#Artikel5
  - number: '6'
    text: |-
      De leden van de Mijnraad onthouden zich van medestemmen over een advies, indien dit een zaak betreft, waarbij zij
      persoonlijk belang hebben.
    url: https://wetten.overheid.nl/BWBR0002707/1997-02-21#Artikel6
  - number: '8'
    text: |-
      1 De Mijnraad stelt tot regeling van zijn werkzaamheden een reglement van orde vast.

      2 Het in het eerste lid bedoelde reglement, alsmede de daarin aangebrachte wijzigingen, treden niet in werking, dan
      nadat zij door Onze Minister zijn goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0002707/1997-02-21#Artikel8
  - number: '9'
    text: |-
      1 De leden van de Mijnraad, die op grond van het Koninklijk besluit van 24 april 1967 (*Stb.* 246), houdende een
      voorlopige nieuwe regeling betreffende de Mijnraad en intrekking van het Koninklijk besluit van 25 april 1913
      (*Stb.* 139), betreffende het Staatsmijnbedrijf in Limburg en de Mijnraad, zijn benoemd en op het tijdstip van
      het in werking treden van deze wet in de raad zitting hebben, blijven lid van de raad tot het tijdstip, waarop de
      termijn, waarvoor zij krachtens dat besluit zijn benoemd, is verstreken.

      2 Het op grond van het in het eerste lid bedoelde besluit als voorzitter aangewezen lid wordt geacht krachtens
      [artikel 3, derde lid][ref1], als voorzitter te zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002707#Artikel3
    url: https://wetten.overheid.nl/BWBR0002707/1997-02-21#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002707
        artikel: '3'
  - number: '10'
    text: Deze wet treedt in werking met ingang van 18 mei 1970.
    url: https://wetten.overheid.nl/BWBR0002707/1997-02-21#Artikel10
