preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het gewenst is de instellingen voor hoger beroepsonderwijs grotere
    beslissingsbevoegdheid ten aanzien van de huisvestingsvoorzieningen te verschaffen;

    dat in verband met de overdracht van de beslissingsbevoegdheid ten aanzien van de huisvesting voor het hoger
    beroepsonderwijs een verrekening met het Rijk moet plaatsvinden ten aanzien van de bestaande huisvesting van de
    instellingen voor hoger beroepsonderwijs;

    dat in verband daarmee wijziging van de Wet op het hoger onderwijs en wetenschappelijk onderzoek (Stb. 1992, 593)
    wenselijk is;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006250/2005-08-03#ArtikelAanhef
articles:
  - number: IV
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin zij wordt
      geplaatst, met uitzondering van [artikel I, onder D][ref1], voor zover het betreft artikel 2.17, dat in werking
      treedt met ingang van 1 januari 1994.


