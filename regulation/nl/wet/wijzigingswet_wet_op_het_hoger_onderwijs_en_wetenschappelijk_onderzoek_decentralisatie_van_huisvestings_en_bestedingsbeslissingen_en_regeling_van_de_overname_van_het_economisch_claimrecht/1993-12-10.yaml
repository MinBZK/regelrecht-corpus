preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het gewenst is de instellingen voor hoger beroepsonderwijs grotere
    beslissingsbevoegdheid ten aanzien van de huisvestingsvoorzieningen te verschaffen;

    dat in verband met de overdracht van de beslissingsbevoegdheid ten aanzien van de huisvesting voor het hoger
    beroepsonderwijs een verrekening met het Rijk moet plaatsvinden ten aanzien van de bestaande huisvesting van de
    instellingen voor hoger beroepsonderwijs;

    dat in verband daarmee wijziging van de Wet op het hoger onderwijs en wetenschappelijk onderzoek (Stb. 1992, 593)
    wenselijk is;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006250/1993-12-10#ArtikelAanhef
articles:
  - number: II.1
    text: |-
      Het instellingsbestuur betaalt ter zake van de gebouwen en terreinen, waarvoor bij de aankoop, de stichting of
      de ingebruikneming een Rijksbijdrage is verleend, een door Onze minister vast te stellen bedrag aan het Rijk. Het
      bedrag, bedoeld in de eerste volzin, wordt uiterlijk op 31 december 1993 voldaan.
    url: https://wetten.overheid.nl/BWBR0006250/1993-12-10#ArtikelII
  - number: II.2
    text: |-
      De hoogte van het bedrag bedoeld in het eerste lid, is afhankelijk van de normatief vastgestelde waarde van de
      gebouwen op basis van de afschrijving van de gemiddelde vervangingswaarde en de normatief vastgestelde waarde van
      de terreinen op basis van de bebouwingsmogelijkheden. De afschrijving van de gemiddelde vervangingswaarde van de
      gebouwen geschiedt zodanig dat de gemiddelde jaarlijkse leenlast, uitgaande van 50% annuïtaire en 50% lineaire
      leningen, over de resterende afschrijvingstermijn gelijk is aan de gemiddelde jaarlijkse leenlast voor een nieuw
      gebouw, dat in 30 jaar wordt afgeschreven.
    url: https://wetten.overheid.nl/BWBR0006250/1993-12-10#ArtikelII
  - number: II.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt een algemene berekeningswijze vastgesteld op de grondslag
      waarvan het bedrag, bedoeld in het eerste lid, wordt berekend. Bij de vaststelling van het bedrag wordt in
      ieder geval rekening gehouden met afgekochte erfpacht, op het moment van inwerkingtreding van deze wet bestaande
      verplichtingen terzake van nieuwbouw en eigen bijdragen.
    url: https://wetten.overheid.nl/BWBR0006250/1993-12-10#ArtikelII
  - number: II.4
    text: |-
      Tegen een besluit van Onze minister jegens een bepaalde instelling op grond van dit artikel, kan iedere natuurlijke
      persoon of rechtspersoon die door het besluit rechtstreeks in zijn belang getroffen, binnen 30 dagen nadat het
      besluit ter kennis van het bevoegd gezag is gebracht, bij de Kroon in beroep komen.
    url: https://wetten.overheid.nl/BWBR0006250/1993-12-10#ArtikelII
  - number: II.5
    text: |-
      Onze minister legt het ontwerp van een algemene maatregel van bestuur als bedoeld in het derde lid voor aan de
      Eerste en Tweede Kamer der Staten-Generaal. De voordracht voor die algemene maatregel van bestuur wordt niet gedaan
      dan nadat dertig dagen na die voorlegging zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0006250/1993-12-10#ArtikelII
  - number: III
    text: |-
      Onze minister stelt ten laste van de Rijksbegroting een bedrag van 55 miljoen gulden aan de instellingen ter
      beschikking dat uiterlijk op 31 december 1993 in het fonds wordt gestort.
    url: https://wetten.overheid.nl/BWBR0006250/1993-12-10#ArtikelIII
  - number: IV
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin zij wordt
      geplaatst, met uitzondering van [artikel I, onder D][ref1], voor zover het betreft artikel 2.17, dat in werking
      treedt met ingang van 1 januari 1994.


      [ref1]: https://wetten.overheid.nl/BWBR0006250#ArtikelI
