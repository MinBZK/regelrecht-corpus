preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om, in overeenstemming met de artikelen 129, vierde
    lid, en 132, vijfde lid, in samenhang met artikel 132a, tweede lid, van de Grondwet, alsmede artikel 232 van
    de Wet openbare lichamen Bonaire, Sint Eustatius en Saba, voorzieningen te treffen in verband met de grove
    taakverwaarlozing van het bestuur van het openbaar lichaam Sint Eustatius;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0040611/2018-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder: - *bestuurscollege, eilandgriffier, eilandsecretaris,
      eilandsraad, eilandgedeputeerden onderscheidenlijk gezaghebber:* bestuurscollege, eilandgriffier,
      eilandsecretaris, eilandsraad, eilandgedeputeerden onderscheidenlijk gezaghebber als bedoeld in de
      [Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1], van het openbaar lichaam Sint Eustatius;
        - *Onze Minister:* Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - *regeringscommissaris:* de regeringscommissaris, bedoeld in [artikel 2, tweede lid][ref2];
        - *plaatsvervangend regeringscommissaris:* de plaatsvervangend regeringscommissaris, bedoeld in
      [artikel 2, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028142
      [ref2]: https://wetten.overheid.nl/BWBR0040611#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0040611#Artikel2
    url: https://wetten.overheid.nl/BWBR0040611/2018-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028142
      - id: ref2
        bwb_id: BWBR0040611
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0040611
        artikel: '2'
  - number: '2.1'
    text: |-
      In afwijking van [hoofdstuk III van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1] is de
      eilandsraad ontbonden, zijn de eilandgedeputeerden van hun functies ontheven en is de waarnemend gezaghebber eervol
      ontslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0040611/2018-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028142
        hoofdstuk: III
  - number: '2.2'
    text: |-
      In afwijking van [hoofdstuk III van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1] worden op
      voordracht van Onze Minister bij koninklijk besluit, in overeenstemming met het gevoelen van de ministerraad,
      een regeringscommissaris en een plaatsvervangend regeringscommissaris voor het openbaar lichaam Sint Eustatius
      benoemd voor de periode die eindigt op de dag, bedoeld in de aanhef van [artikel 13, derde lid][ref2]. Indien de
      regeringscommissaris of de plaatsvervangend regeringscommissaris tussentijds vervangen moet worden, geschiedt dit
      op voordracht van Onze Minister bij koninklijk besluit, in overeenstemming met het gevoelen van de ministerraad.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0040611#Artikel13
    url: https://wetten.overheid.nl/BWBR0040611/2018-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028142
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0040611
        artikel: '13'
  - number: '2.3'
    text: |-
      De plaatsvervangend regeringscommissaris heeft tot taak de regeringscommissaris te ondersteunen en op diens verzoek
      in de waarneming van diens ambt te voorzien.
    url: https://wetten.overheid.nl/BWBR0040611/2018-08-01#Artikel2
  - number: '2.4'
    text: |-
      De [artikelen 74][ref1], [75][ref2], [77 tot en met 80][ref3], [82 tot en met 87][ref4] en
      [89 van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref5] en de daarop berustende bepalingen zijn van
      overeenkomstige toepassing op de regeringscommissaris en de plaatsvervangend regeringscommissaris.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel75
      [ref3]: https://wetten.overheid.nl/BWBR0028142#Artikel77
      [ref4]: https://wetten.overheid.nl/BWBR0028142#Artikel82
      [ref5]: https://wetten.overheid.nl/BWBR0028142#Artikel89
    url: https://wetten.overheid.nl/BWBR0040611/2018-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '74'
      - id: ref2
        bwb_id: BWBR0028142
        artikel: '75'
      - id: ref3
        bwb_id: BWBR0028142
        artikel: '77'
      - id: ref4
        bwb_id: BWBR0028142
        artikel: '82'
      - id: ref5
        bwb_id: BWBR0028142
        artikel: '89'
  - number: '2.5'
    text: |-
      De bezoldiging, bedoeld in
      [artikel 78, eerste lid, van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1], en tegemoetkomingen,
      vergoedingen en andere voorzieningen als bedoeld in het tweede lid van dat artikel, worden voor de
      regeringscommissaris en de plaatsvervangend regeringscommissaris vastgesteld door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel78
    url: https://wetten.overheid.nl/BWBR0040611/2018-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '78'
  - number: '2.6'
    text: |-
      In afwijking van de [artikelen 124, eerste lid][ref1], en
      [130 tot en met 135 van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref2] is de waarnemend
      eilandgriffier eervol ontslagen. Na de dag, bedoeld in de aanhef van [artikel 13, derde lid][ref3], benoemt
      de eilandsraad zo spoedig mogelijk een nieuwe eilandgriffier. Tot het tijdstip met ingang waarvan de nieuwe
      eilandgriffier is benoemd blijft de medeondertekening, bedoeld in artikel 34 van die wet, achterwege en vervult de
      eilandsecretaris de taak, bedoeld in [artikel 94f van die wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel124
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel130
      [ref3]: https://wetten.overheid.nl/BWBR0040611#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0028142#Artikel94f
    url: https://wetten.overheid.nl/BWBR0040611/2018-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '124'
      - id: ref2
        bwb_id: BWBR0028142
        artikel: '130'
      - id: ref3
        bwb_id: BWBR0040611
        artikel: '13'
      - id: ref4
        bwb_id: BWBR0028142
        artikel: 94f
  - number: '3.1'
    text: |-
      De regeringscommissaris oefent bij het openbaar lichaam Sint Eustatius alle taken en bevoegdheden uit die bij of
      krachtens de Wet openbare lichamen Bonaire, Sint Eustatius en Saba of enige andere wet aan de eilandsraad, het
      bestuurscollege of de gezaghebber zijn opgedragen.
    url: https://wetten.overheid.nl/BWBR0040611/2018-08-01#Artikel3
  - number: '3.2'
    text: |-
      Besluiten die de regeringscommissaris in de plaats van de eilandsraad, het bestuurscollege of de gezaghebber neemt,
      worden geacht afkomstig te zijn van die organen.
    url: https://wetten.overheid.nl/BWBR0040611/2018-08-01#Artikel3
  - number: '3.3'
    text: |-
      Indien ter uitvoering van wetten of andere vanwege het Rijk vastgestelde voorschriften door de eilandsraad, het
      bestuurscollege of de gezaghebber moet worden medegewerkt, geschiedt dit in het openbaar lichaam Sint Eustatius
      door de regeringscommissaris.
    url: https://wetten.overheid.nl/BWBR0040611/2018-08-01#Artikel3
  - number: '3.4'
    text: |-
      Onverminderd zijn overige wettelijke taken draagt de regeringscommissaris zorg voor het bevorderen van de
      omstandigheden waaronder het bestuur van het openbaar lichaam Sint Eustatius in de toekomst naar behoren zal kunnen
      functioneren, onder meer door zijn kennis over de inrichting en werking van de lokale democratie over te dragen aan
      hen die willen bijdragen aan het bestuur van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0040611/2018-08-01#Artikel3
  - number: '4.1'
    text: De regeringscommissaris is verantwoording verschuldigd aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0040611/2018-08-01#Artikel4
  - number: '4.2'
    text: |-
      Onze Minister kan de regeringscommissaris de nodige algemene en bijzondere aanwijzingen geven met betrekking tot
      zijn taken en bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0040611/2018-08-01#Artikel4
  - number: '4.3'
    text: De regeringscommissaris verstrekt Onze Minister desgevraagd alle inlichtingen.
    url: https://wetten.overheid.nl/BWBR0040611/2018-08-01#Artikel4
  - number: '4.4'
    text: De voorgaande leden zijn van overeenkomstige toepassing op de plaatsvervangend regeringscommissaris.
    url: https://wetten.overheid.nl/BWBR0040611/2018-08-01#Artikel4
  - number: '5'
    text: |-
      De regeringscommissaris stelt een maatschappelijke raad van advies in die hem gevraagd en ongevraagd adviseert over
      de in de lokale samenleving bestaande opvattingen ten aanzien van bestuurlijke aangelegenheden, waarbij hij zorg
      draagt voor een representatieve samenstelling.
    url: https://wetten.overheid.nl/BWBR0040611/2018-08-01#Artikel5
  - number: '6.1'
    text: |-
      De Rijksvertegenwoordiger oefent zijn taken en bevoegdheden op grond van de
      [Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1] niet uit ten aanzien van het openbaar lichaam Sint
      Eustatius. Goedkeuring of toestemming van de Rijksvertegenwoordiger als bedoeld in die wet is ten aanzien van het
      openbaar lichaam Sint Eustatius niet vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0028142
    url: https://wetten.overheid.nl/BWBR0040611/2018-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028142
  - number: '6.2'
    text: |-
      De regeringscommissaris en de plaatsvervangend regeringscommissaris leggen de eed of de verklaring en belofte,
      bedoeld in [artikel 77 van die wet][ref1], af ten overstaan van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel77
    url: https://wetten.overheid.nl/BWBR0040611/2018-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '77'
  - number: '6.3'
    text: |-
      Voor de overeenkomstige toepassing van de [artikelen 16, tweede lid][ref1], [49 tot en met 52][ref2],
      [85, tweede lid][ref3], en [86 van die wet][ref4] op de regeringscommissaris en de plaatsvervangend
      regeringscommissaris wordt voor «de Rijksvertegenwoordiger» gelezen: Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0028142#Artikel85
      [ref4]: https://wetten.overheid.nl/BWBR0028142#Artikel86
    url: https://wetten.overheid.nl/BWBR0040611/2018-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0028142
        artikel: '49'
      - id: ref3
        bwb_id: BWBR0028142
        artikel: '85'
      - id: ref4
        bwb_id: BWBR0028142
        artikel: '86'
  - number: '7.1'
    text: |-
      De [artikelen 9 tot en met 12][ref1] en
      [17 tot en met 39 van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref2] gelden niet ten
      aanzien van het openbaar lichaam Sint Eustatius.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028151#Artikel17
    url: https://wetten.overheid.nl/BWBR0040611/2018-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0028151
        artikel: '17'
  - number: '7.2'
    text: |-
      In afwijking van [artikel 13, tweede lid, van die wet][ref1] kunnen de gerealiseerde en geraamde bedragen van
      voorgaande begrotingsjaren buiten beschouwing worden gelaten in de begroting voor het begrotingsjaar 2018. In dat
      geval worden die gegevens opgenomen in de begroting voor het begrotingsjaar 2019.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel13
    url: https://wetten.overheid.nl/BWBR0040611/2018-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '13'
  - number: '7.3'
    text: |-
      Alvorens de begroting vast te stellen legt de regeringscommissaris de ontwerpbegroting gedurende een maand
      ter inzage en draagt hij er zorg voor dat deze algemeen verkrijgbaar is. Van de terinzagelegging en de
      verkrijgbaarstelling wordt openbaar kennis gegeven.
    url: https://wetten.overheid.nl/BWBR0040611/2018-08-01#Artikel7
  - number: '8.1'
    text: |-
      Indien de omstandigheden zodanig zijn gewijzigd dat mag worden verwacht dat het bestuur van het openbaar lichaam
      Sint Eustatius zijn taken zelf naar behoren kan vervullen, wordt op voordracht van Onze Minister bij koninklijk
      besluit, in overeenstemming met het gevoelen van de ministerraad, bepaald dat in het openbaar lichaam Sint
      Eustatius verkiezingen voor de eilandsraad zullen plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0040611/2018-08-01#Artikel8
  - number: '8.2'
    text: |-
      Indien niet vóór 1 december 2018 een besluit als bedoeld in het eerste lid is bekendgemaakt, blijven
      de eerstvolgende reguliere verkiezingen voor de eilandsraad in afwijking van de [Kieswet][ref1] in
      het openbaar lichaam Sint Eustatius achterwege. In dat geval worden op voordracht van Onze Minister
      bij koninklijk besluit, in overeenstemming met het gevoelen van de ministerraad, met inachtneming van
      [artikel J 1 van die wet][ref2] een nieuwe dag van kandidaatstelling en dag van stemming bepaald, waarbij kan
      worden afgeweken van [artikel F 1, eerste lid, van die wet][ref3] en de in de [artikelen G 1, achtste lid][ref4],
      [G 2, achtste lid][ref5], [G 3, eerste lid][ref6], [G 4, derde lid][ref7], en [G 5, tweede lid, van die wet][ref8]
      bedoelde termijnen inzake registratie van aanduidingen van politieke groeperingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
      [ref2]: https://wetten.overheid.nl/BWBR0004627
      [ref3]: https://wetten.overheid.nl/BWBR0004627
      [ref4]: https://wetten.overheid.nl/BWBR0004627
      [ref5]: https://wetten.overheid.nl/BWBR0004627
      [ref6]: https://wetten.overheid.nl/BWBR0004627
      [ref7]: https://wetten.overheid.nl/BWBR0004627
      [ref8]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0040611/2018-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004627
      - id: ref2
        bwb_id: BWBR0004627
      - id: ref3
        bwb_id: BWBR0004627
      - id: ref4
        bwb_id: BWBR0004627
      - id: ref5
        bwb_id: BWBR0004627
      - id: ref6
        bwb_id: BWBR0004627
      - id: ref7
        bwb_id: BWBR0004627
      - id: ref8
        bwb_id: BWBR0004627
  - number: '8.3'
    text: De dag van kandidaatstelling, bedoeld in het tweede lid, is uiterlijk maandag 1 februari 2021.
    url: https://wetten.overheid.nl/BWBR0040611/2018-08-01#Artikel8
  - number: '8.4'
    text: |-
      Na de eerstvolgende verkiezingen voor de eilandsraad in het openbaar lichaam Sint Eustatius geschiedt in
      afwijking van [artikel V 4 van de Kieswet][ref1] het onderzoek van de geloofsbrieven van de benoemde leden van de
      eilandsraad, bedoeld in dat artikel, door die leden.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelV_4
    url: https://wetten.overheid.nl/BWBR0040611/2018-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: V_4
  - number: '8.5'
    text: |-
      In de gevallen, bedoeld in het tweede lid en [artikel 9, tweede lid][ref1], worden in afwijking van
      [artikel Ya 24 van de Kieswet][ref2] in het openbaar lichaam Sint Eustatius een of meer stembureaus en een
      hoofdstembureau ingesteld voor de verkiezing van de leden van het kiescollege voor de Eerste Kamer, bedoeld in
      [§ 3a van hoofdstuk Ya van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0040611#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004627
      [ref3]: https://wetten.overheid.nl/BWBR0004627#Paragraaf3a
    url: https://wetten.overheid.nl/BWBR0040611/2018-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0040611
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0004627
      - id: ref3
        bwb_id: BWBR0004627
        paragraaf: 3a
  - number: '9.1'
    text: |-
      De zittingsperiode van de leden van de ingevolge [artikel 8][ref1] gekozen eilandsraad en van de door die
      eilandsraad benoemde eilandgedeputeerden eindigt tegelijk met de zittingsperiode van de leden van de eilandsraden
      van de openbare lichamen Bonaire en Saba die op de dag van de verkiezingen zitting hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0040611#Artikel8
    url: https://wetten.overheid.nl/BWBR0040611/2018-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0040611
        artikel: '8'
  - number: '9.2'
    text: |-
      Indien de datum waarop overeenkomstig [artikel 8, vierde lid][ref1], de benoemde leden tot de eilandsraad zijn
      toegelaten valt binnen twee jaar voor de datum van de reguliere eilandsraadsverkiezingen, blijven deze verkiezingen
      in het openbaar lichaam Sint Eustatius achterwege. De zittingsperiode van de leden van de ingevolge artikel 8
      gekozen eilandsraad en van de door die eilandsraad benoemde eilandgedeputeerden eindigt in dat geval tegelijk met
      de zittingsperiode van de leden van de eilandsraden van de openbare lichamen Bonaire en Saba die volgt op de eerste
      reguliere eilandsraadsverkiezingen na de dag van kandidaatstelling, bedoeld in artikel 8, tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0040611#Artikel8
    url: https://wetten.overheid.nl/BWBR0040611/2018-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0040611
        artikel: '8'
  - number: '10'
    text: |-
      De gezaghebber neemt alle maatregelen die noodzakelijk zijn ter voorkoming van vernietiging van documenten die
      berusten bij het eilandsbestuur. Onze Minister kan hem daartoe aanwijzingen geven.
    url: https://wetten.overheid.nl/BWBR0040611/2018-08-01#Artikel10
  - number: '12'
    text: |-
      Op deze wet is de [Wet raadgevend referendum][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0036443
    url: https://wetten.overheid.nl/BWBR0040611/2018-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0036443
  - number: '13.1'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst en werkt terug tot en met het moment van bekrachtiging van het voorstel van deze wet.
    url: https://wetten.overheid.nl/BWBR0040611/2018-08-01#Artikel13
  - number: '13.2'
    text: |-
      In afwijking van het eerste lid werkt [artikel 10][ref1] terug tot en met het tijdstip waarop het voorstel van deze
      wet is ingediend bij de Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0040611#Artikel10
    url: https://wetten.overheid.nl/BWBR0040611/2018-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0040611
        artikel: '10'
  - number: '13.3'
    text: |-
      Deze wet vervalt met ingang van de dag na de datum waarop overeenkomstig [artikel 8, vierde lid][ref1], de benoemde
      leden tot de eilandsraad zijn toegelaten, met uitzondering van:


      [ref1]: https://wetten.overheid.nl/BWBR0040611#Artikel8
    url: https://wetten.overheid.nl/BWBR0040611/2018-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0040611
        artikel: '8'
