---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_bescherming_bedrijfsgeheimen
regulatory_layer: WET
publication_date: '2023-02-03'
valid_from: '2023-02-18'
bwb_id: BWBR0041459
url: https://wetten.overheid.nl/BWBR0041459/2023-02-18
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is regels vast te stellen ter implementatie van
    Richtlijn 2016/943/EU van het Europees Parlement en de Raad van 8 juni 2016 betreffende de bescherming van niet-
    openbaar gemaakte knowhow en bedrijfsinformatie (bedrijfsgeheimen) tegen het onrechtmatig verkrijgen, gebruiken en
    openbaar maken daarvan (PbEU 2016, L157);

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder: - *bedrijfsgeheim:* informatie die aan de volgende voorwaarden voldoet: a. zij
      is geheim in die zin dat zij, in haar geheel dan wel in de juiste samenstelling en ordening van haar bestanddelen,
      niet algemeen bekend is bij of gemakkelijk toegankelijk is voor degenen binnen de kringen die zich gewoonlijk
      bezighouden met dergelijke informatie; b. zij bezit handelswaarde omdat zij geheim is, en c. zij is door degene
      die daar rechtmatig over beschikt, onderworpen aan redelijke maatregelen, gezien de omstandigheden, om deze geheim
      te houden;
        - *houder van het bedrijfsgeheim:* iedere natuurlijke persoon of rechtspersoon die rechtmatig over een
      bedrijfsgeheim beschikt;
        - *inbreukmakende goederen:* goederen waarvan het ontwerp, de kenmerken, de werking, het productieproces of het
      in de handel brengen aanzienlijk voordeel heeft of hebben bij bedrijfsgeheimen die onrechtmatig zijn verkregen,
      gebruikt of openbaar gemaakt;
        - *inbreukmaker:* iedere natuurlijke persoon of rechtspersoon die een bedrijfsgeheim onrechtmatig heeft verkregen,
      gebruikt of openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel1
  - number: '2.1'
    text: |-
      Het verkrijgen van een bedrijfsgeheim zonder de toestemming van de houder van het bedrijfsgeheim is onrechtmatig
      wanneer het bedrijfsgeheim is verkregen door middel van:
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel2
  - number: 2.1.a
    text: |-
      onbevoegde toegang tot of het zich onbevoegd toe-eigenen of kopiëren van documenten, voorwerpen, substanties,
      materialen of elektronische bestanden waarover de houder van het bedrijfsgeheim rechtmatig beschikt en die het
      bedrijfsgeheim bevatten of waaruit het bedrijfsgeheim kan worden afgeleid;
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel2
  - number: 2.1.b
    text: andere gedragingen die, gezien de omstandigheden, worden beschouwd als strijdig met eerlijke handelspraktijken.
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel2
  - number: '2.2'
    text: |-
      Het gebruiken of openbaar maken van een bedrijfsgeheim is onrechtmatig wanneer het bedrijfsgeheim zonder de
      toestemming van de houder van het bedrijfsgeheim wordt gebruikt of openbaar gemaakt door een natuurlijke persoon of
      rechtspersoon die:
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel2
  - number: 2.2.a
    text: het bedrijfsgeheim op onrechtmatige wijze heeft verkregen;
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel2
  - number: 2.2.b
    text: |-
      inbreuk maakt op een geheimhoudingsovereenkomst of een andere verplichting tot het niet openbaar maken van het
      bedrijfsgeheim, of
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel2
  - number: 2.2.c
    text: inbreuk maakt op een contractuele of andere verplichting tot beperking van het gebruik van het bedrijfsgeheim.
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel2
  - number: '2.3'
    text: |-
      Het verkrijgen, gebruiken of openbaar maken van een bedrijfsgeheim is ook onrechtmatig wanneer een natuurlijke
      persoon of rechtspersoon op het moment van het verkrijgen, gebruiken, of openbaar maken, wist, of gezien
      de omstandigheden, had moeten weten dat het bedrijfsgeheim direct of indirect werd verkregen van een andere
      natuurlijke persoon of rechtspersoon die het bedrijfsgeheim op een onrechtmatige manier gebruikte of openbaar
      maakte als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel2
  - number: '2.4'
    text: |-
      Het produceren, aanbieden of in de handel brengen van inbreukmakende goederen, of de invoer, uitvoer of opslag
      van inbreukmakende goederen voor die doeleinden, wordt ook als een onrechtmatig gebruik van een bedrijfsgeheim
      beschouwd wanneer de natuurlijke persoon of rechtspersoon die dergelijke activiteiten uitvoert, wist of, gezien de
      omstandigheden, had moeten weten dat het bedrijfsgeheim onrechtmatig werd gebruikt.
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel2
  - number: '3.1'
    text: 'Als het onrechtmatig verkrijgen van een bedrijfsgeheim wordt niet beschouwd het verkrijgen door middel van:'
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel3
  - number: 3.1.a
    text: onafhankelijke ontdekking of onafhankelijk ontwerp;
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel3
  - number: 3.1.b
    text: |-
      observatie, onderzoek, demontage of testen van een product of voorwerp dat ter beschikking van het publiek is
      gesteld of dat op een rechtmatige manier in het bezit is van degene die de informatie verwerft en die niet gebonden
      is aan een rechtsgeldige verplichting het verkrijgen van het bedrijfsgeheim te beperken;
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel3
  - number: 3.1.c
    text: |-
      uitoefening van het recht van werknemers of vertegenwoordigers daarvan op informatie en raadpleging in
      overeenstemming met het recht van de Europese Unie of met bepalingen bij of krachtens de wet of met nationale
      praktijken, of
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel3
  - number: 3.1.d
    text: iedere andere praktijk die, gezien de omstandigheden, in overeenstemming is met eerlijke handelspraktijken.
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel3
  - number: '3.2'
    text: |-
      Als het onrechtmatig verkrijgen, gebruiken of openbaar maken van een bedrijfsgeheim wordt niet beschouwd het
      verkrijgen, gebruiken of openbaar maken dat op grond van het recht van de Europese Unie of bepalingen bij of
      krachtens de wet vereist of toegestaan is.
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel3
  - number: '4'
    text: |-
      De rechter wijst een vordering of verzoek om toepassing van de maatregelen en procedures in het kader van deze wet
      af wanneer het verkrijgen, gebruiken of openbaar maken van het bedrijfsgeheim plaatsvond in een van de volgende
      gevallen:
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel4
  - number: 4.a
    text: |-
      het uitoefenen van het recht op vrijheid van meningsuiting en van informatie als bedoeld in artikel 11 van
      het Handvest van de grondrechten van de Europese Unie, met inbegrip van de eerbiediging van de vrijheid en het
      pluralisme van de media;
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel4
  - number: 4.b
    text: |-
      het onthullen van wangedrag, fouten of illegale activiteiten, op voorwaarde dat de inbreukmaker
      handelde met het oog op de bescherming van het algemeen belang, zoals onder andere bedoeld in
      [artikel 1, onderdeel d, subonderdeel 2, van de Wet bescherming klokkenluiders][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037852#Artikel1
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0037852
        artikel: '1'
  - number: 4.c
    text: |-
      het openbaar maken van het bedrijfsgeheim door werknemers aan hun vertegenwoordigers in het kader van de
      rechtmatige uitoefening van hun vertegenwoordigende functies overeenkomstig met het recht van de Europese Unie
      of met bepalingen bij of krachtens de wet, op voorwaarde dat deze openbaarmaking noodzakelijk was voor deze
      uitoefening;
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel4
  - number: 4.d
    text: |-
      met het oog op een rechtmatig belang dat wordt beschermd ingevolge het recht van de Europese Unie of bij of
      krachtens de wet.
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel4
  - number: '5.1'
    text: |-
      De voorzieningenrechter kan op vordering van de houder van het bedrijfsgeheim jegens de vermeende inbreukmaker de
      volgende voorlopige maatregelen bevelen:
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel5
  - number: 5.1.a
    text: de staking van of het verbod op het gebruik of op de openbaarmaking van het bedrijfsgeheim;
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel5
  - number: 5.1.b
    text: |-
      het verbod om inbreukmakende goederen te produceren, aan te bieden, in de handel te brengen of te gebruiken, of om
      inbreukmakende goederen voor deze doeleinden in te voeren, uit te voeren of op te slaan.
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel5
  - number: '5.2'
    text: |-
      De houder van het bedrijfsgeheim kan voorts verzoeken om verlof tot beslaglegging op de vermeende inbreukmakende
      goederen of hij kan de afgifte van dergelijke goederen vorderen, met inbegrip van ingevoerde goederen, om te
      voorkomen dat deze in de handel worden gebracht of zich in het handelsverkeer bevinden. De bepalingen van het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] betreffende beslaglegging en executie tot afgifte van roerende
      zaken zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '5.3'
    text: |-
      De voorzieningenrechter kan op vordering van de houder van het bedrijfsgeheim tijdelijke voortzetting van de
      vermeende inbreuk toestaan onder de voorwaarde dat zekerheid wordt gesteld voor schadeloosstelling van de houder
      van het bedrijfsgeheim. Het openbaar maken van een bedrijfsgeheim in ruil voor het stellen van zekerheden is niet
      toegestaan.
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel5
  - number: '6.1'
    text: |-
      De rechter kan op vordering van de houder van het bedrijfsgeheim de volgende maatregelen jegens de inbreukmaker
      bevelen:
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel6
  - number: 6.1.a
    text: |-
      de staking van of het verbod op het onrechtmatig gebruik of op de onrechtmatige openbaarmaking van het
      bedrijfsgeheim;
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel6
  - number: 6.1.b
    text: |-
      het verbod om inbreukmakende goederen te produceren, aan te bieden, in de handel te brengen of te gebruiken, of om
      inbreukmakende goederen voor deze doeleinden in te voeren, uit te voeren of op te slaan;
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel6
  - number: 6.1.c
    text: het terugroepen van de inbreukmakende goederen van de markt;
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel6
  - number: 6.1.d
    text: het ontdoen van de inbreukmakende goederen van hun inbreukmakende hoedanigheid;
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel6
  - number: 6.1.e
    text: |-
      de vernietiging van de inbreukmakende goederen of het uit de handel nemen ervan, op voorwaarde dat het uit de
      handel nemen geen afbreuk doet aan de bescherming van het bedrijfsgeheim;
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel6
  - number: 6.1.f
    text: |-
      gehele of gedeeltelijke vernietiging van de documenten, voorwerpen, substanties, materialen of elektronische
      bestanden die op onrechtmatige wijze het bedrijfsgeheim bevatten of de gehele of gedeeltelijke overhandiging
      daarvan aan de houder van het bedrijfsgeheim.
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel6
  - number: '6.2'
    text: |-
      De maatregelen, bedoeld in het eerste lid, onderdelen c tot en met f, worden op kosten van de inbreukmaker
      uitgevoerd, tenzij bijzondere redenen dit beletten.
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel6
  - number: '7.1'
    text: |-
      De rechter houdt bij de beslissing over een vordering krachtens [artikel 5, eerste lid][ref1], of
      [artikel 6, eerste lid][ref2], of over een verzoek krachtens artikel 5, tweede lid, en bij het beoordelen van de
      evenredigheid ervan, rekening met de specifieke omstandigheden van het geval, met inbegrip van:


      [ref1]: https://wetten.overheid.nl/BWBR0041459#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0041459#Artikel6
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0041459
        artikel: '5'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0041459
        artikel: '6'
        hoofdstuk: '3'
  - number: 7.1.a
    text: de waarde en andere specifieke kenmerken van het bedrijfsgeheim;
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel7
  - number: 7.1.b
    text: de maatregelen die zijn genomen om het bedrijfsgeheim te beschermen;
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel7
  - number: 7.1.c
    text: de handelwijze van de inbreukmaker bij het verkrijgen, gebruiken of openbaar maken van het bedrijfsgeheim;
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel7
  - number: 7.1.d
    text: de effecten van het onrechtmatig gebruiken of openbaar maken van het bedrijfsgeheim;
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel7
  - number: 7.1.e
    text: |-
      de rechtmatige belangen van de partijen en de mogelijke effecten van het bevelen of afwijzen van de maatregelen
      voor de partijen;
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel7
  - number: 7.1.f
    text: de rechtmatige belangen van derden;
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel7
  - number: 7.1.g
    text: het algemeen belang, en
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel7
  - number: 7.1.h
    text: de bescherming van grondrechten.
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel7
  - number: '7.2'
    text: |-
      Wanneer de rechter de looptijd van de staking of het verbod, bedoeld in
      [artikel 6, eerste lid, onderdeel a en b][ref1], beperkt, moet deze looptijd lang genoeg zijn om de handels- en
      economische voordelen teniet te doen die de inbreukmaker zou hebben kunnen halen uit het onrechtmatig verkrijgen,
      gebruiken of openbaar maken van het bedrijfsgeheim.


      [ref1]: https://wetten.overheid.nl/BWBR0041459#Artikel6
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0041459
        artikel: '6'
        hoofdstuk: '3'
  - number: '7.3'
    text: |-
      Op vordering van de persoon jegens wie een maatregel, bedoeld in [artikel 6, eerste lid, onder a en b][ref1], is
      genomen, kan deze maatregel worden ingetrokken of anderszins buiten werking worden gesteld indien er geen sprake
      meer is van een bedrijfsgeheim op gronden die niet aan die persoon kunnen worden toegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0041459#Artikel6
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0041459
        artikel: '6'
        hoofdstuk: '3'
  - number: '7.4'
    text: |-
      Op vordering van de persoon jegens wie een maatregel, bedoeld in [artikel 6, eerste lid][ref1], kan worden genomen,
      kan de rechter deze persoon bevelen om in plaats van de toepassing van deze maatregel een schadevergoeding te
      betalen aan de houder van het bedrijfsgeheim indien aan de volgende voorwaarden wordt voldaan:


      [ref1]: https://wetten.overheid.nl/BWBR0041459#Artikel6
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0041459
        artikel: '6'
        hoofdstuk: '3'
  - number: 7.4.a
    text: |-
      op het moment van het gebruiken of openbaar maken wist deze persoon niet of had hij onder de omstandigheden niet
      hoeven weten dat het bedrijfsgeheim werd verkregen van een andere natuurlijke persoon of rechtspersoon die het
      bedrijfsgeheim op een onrechtmatige manier gebruikte of openbaar maakte;
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel7
  - number: 7.4.b
    text: de uitvoering van de maatregelen zou deze persoon onevenredige schade toebrengen, en
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel7
  - number: 7.4.c
    text: de schadevergoeding aan de benadeelde partij is redelijk en billijk.
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel7
  - number: '7.5'
    text: |-
      De schadevergoeding, bedoeld in het vierde lid, bedraagt niet meer dan het bedrag van de royalty’s of vergoedingen
      dat verschuldigd was geweest indien die persoon toestemming had gevraagd om het desbetreffende bedrijfsgeheim te
      gebruiken, voor de periode waarin het gebruik van het bedrijfsgeheim verboden had kunnen worden.
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel7
  - number: '8.1'
    text: |-
      De houder van het bedrijfsgeheim kan schadevergoeding vorderen van een inbreukmaker die wist of had moeten weten
      dat hij onrechtmatig een bedrijfsgeheim verkreeg, gebruikte of openbaar maakte.
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel8
  - number: '8.2'
    text: In passende gevallen kan de rechter de schadevergoeding vaststellen als een forfaitair bedrag.
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel8
  - number: '9.1'
    text: |-
      De rechter kan op vordering van de houder van het bedrijfsgeheim gelasten dat op kosten van de inbreukmaker
      passende maatregelen worden getroffen tot verspreiding van informatie over de uitspraak.
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel9
  - number: '9.2'
    text: |-
      De rechter houdt bij de beslissing over een bevel tot een in het eerste lid bedoelde maatregel en bij de
      beoordeling van de evenredigheid ervan rekening met:
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel9
  - number: 9.2.a
    text: de waarde van het bedrijfsgeheim;
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel9
  - number: 9.2.b
    text: de handelwijze van de inbreukmaker bij het verkrijgen, gebruiken of het openbaar maken van het bedrijfsgeheim;
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel9
  - number: 9.2.c
    text: de effecten van het onrechtmatig gebruiken of openbaar maken van het bedrijfsgeheim;
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel9
  - number: 9.2.d
    text: de kans dat de inbreukmaker het bedrijfsgeheim op een onrechtmatige manier blijft gebruiken of openbaar maken, en
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel9
  - number: 9.2.e
    text: |-
      de mogelijkheid dat informatie over de inbreukmaker kan leiden tot het identificeren van een natuurlijk persoon,
      en indien dit het geval is, of de bekendmaking van deze informatie gerechtvaardigd is in het licht van de mogelijke
      schade die de maatregel kan veroorzaken voor de persoonlijke levenssfeer en reputatie van de inbreukmaker.
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel9
  - number: '12'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel12
  - number: '13'
    text: 'Deze wet wordt aangehaald als: Wet bescherming bedrijfsgeheimen.'
    url: https://wetten.overheid.nl/BWBR0041459/2023-02-18#Artikel13
