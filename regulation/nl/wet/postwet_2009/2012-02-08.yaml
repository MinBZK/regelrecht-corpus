  - number: '40'
    text: |-
      1 Voorzover bij de uitoefening van bevoegdheden van het college begrippen worden uitgelegd die worden gehanteerd
      bij de toepassing van [artikel 24 van de Mededingingswet][ref1], geschiedt de uitoefening van die bevoegdheden
      door het college in overeenstemming met de door de raad van bestuur van de mededingingsautoriteit vastgestelde
      richtlijnen. Van die richtlijnen doet de raad van bestuur van de mededingingsautoriteit mededeling in de
      Staatscourant.

      2 Het college en de raad van bestuur van de mededingingsautoriteit maken in het belang van een effectieve en
      efficiënte besluitvorming gezamenlijk afspraken over de wijze van behandeling van aangelegenheden van wederzijds
      belang.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel24
