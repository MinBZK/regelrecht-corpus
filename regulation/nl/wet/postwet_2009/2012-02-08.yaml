  - number: '44'
    text: |-
      1 In het belang van de goede uitvoering van deze wet wordt door het college een register van de registraties
      bijgehouden.

      2 Het register ligt voor eenieder kosteloos ter inzage op een door het college te bepalen plaats. De gegevens uit
      het register zijn kosteloos op elektronische wijze te raadplegen.

      3 Het college brengt het register in overeenstemming met de wijzigingen die voortvloeien uit
      [artikel 42, vierde lid][ref1], en [artikel 43, tweede lid][ref2].

      4 Het college kan de gegevens met betrekking tot de registratie wijzigen indien dit noodzakelijk is om feitelijke
      onjuistheden van eenvoudige aard weg te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0025572#Artikel43
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel44
