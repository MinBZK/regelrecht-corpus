      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. *postrichtlijn of -verordening:* een richtlijn, onderscheidenlijk verordening, van het Europees Parlement en
      de Raad van de Europese Unie die geheel of gedeeltelijk berust op de artikelen 47, 52, 55 of 95 van het Verdrag
      tot oprichting van de Europese Gemeenschap, betrekking heeft op de postsector en regels stelt over de economische
      activiteiten in die sector, de belangen van afnemers, geschilbeslechting, de infrastructuur, de interne markt,
      de kwaliteit, de handel, de mededinging, de universele dienstverlening, technische eisen of het verschaffen van
      informatie;

      b. *gedelegeerde richtlijn, verordening of beschikking:* een richtlijn, verordening, onderscheidenlijk beschikking,
      van de Commissie van de Europese Gemeenschappen die berust op een postrichtlijn of -verordening;

      c. *liberalisatierichtlijn:* een richtlijn van de Commissie van de Europese Gemeenschappen die berust op artikel
      86, derde lid, van het Verdrag tot oprichting van de Europese Gemeenschap en regels stelt met betrekking tot de
      postsector.

      2 In deze wet wordt onder «wet» mede verstaan: een krachtens [artikel 66, vijfde lid, onderdeel b][ref1],
      aangewezen voorschrift uit een postverordening of een gedelegeerde verordening.


