  - number: '17'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de universele postdienst. Deze
      regels kunnen betrekking hebben op:

      a. de onderscheiden postvervoerdiensten;

      b. de soorten poststukken waarop de universele postdienst betrekking heeft;

      c. de kwaliteit van de postvervoerdiensten, bedoeld in onderdeel a, die voor de verschillende postvervoerdiensten
      verschillend kan worden vastgesteld;

      d. de goede postale dienstverlening;

      e. de wijze waarop poststukken aan een verlener van de universele postdienst worden aangeboden.

      2 De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel17
  - number: '18'
    text: |-
      1 Een verlener van de universele postdienst verzorgt binnen Nederland en van of naar gebieden buiten Nederland de
      universele postdienst.

      2 De verplichting, bedoeld in het eerste lid, geldt alleen indien poststukken zijn aangeboden aan een verlener van
      de universele postdienst in overeenstemming met de regels, bedoeld in [artikel 17, eerste lid, onderdeel e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel17
