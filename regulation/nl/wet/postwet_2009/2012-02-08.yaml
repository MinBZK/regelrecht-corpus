  - number: '71'
    text: |-
      1 Bij toepassing van [artikel 14 van de Wet buitengewone bevoegdheden burgerlijk gezag][ref1] is een verlener van
      de universele postdienst verplicht de krachtens het [eerste lid van genoemd artikel][ref2] aangewezen autoriteiten
      alle medewerking te verlenen, daaronder begrepen het uitvoeren van door die autoriteiten gegeven opdrachten.

      2 Bij toepassing van [artikel 31 van de Oorlogswet voor Nederland][ref3] is een verlener van de universele
      postdienst verplicht het militair gezag of een orgaan als bedoeld in het [tweede lid van genoemd artikel][ref4]
      alle medewerking te verlenen, daaronder begrepen het uitvoeren van door dat gezag of dat orgaan gegeven opdrachten.


