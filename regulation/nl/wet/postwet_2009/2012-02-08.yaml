    text: |-
      1 Het college is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de bij of krachtens deze
      wet gestelde verplichtingen, met uitzondering van de verplichtingen bij of krachtens [hoofdstuk 11][ref1].

      2 Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de bij of krachtens
      [hoofdstuk 11][ref2] gestelde verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Hoofdstuk11
