  - number: '72'
    text: |-
      Onze Minister geeft aan een verlener van de universele postdienst voorschriften ten aanzien van de door deze
      te nemen organisatorische en personele maatregelen met betrekking tot de voorbereiding van de uitvoering van de
      universele postdienst in buitengewone omstandigheden als bedoeld in [artikel 68][ref1] en de door deze daarover aan
      Onze Minister te verstrekken informatie. Onze Minister bepaalt in die voorschriften welke kosten van de uitvoering
      redelijkerwijs ten laste van een verlener van de universele postdienst komen.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel68
