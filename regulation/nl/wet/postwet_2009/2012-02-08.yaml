  - number: '45'
    text: |-
      1 Het college verstrekt zo spoedig mogelijk na de registratie, bedoeld in [artikel 42, derde lid][ref1], aan het
      postvervoerbedrijf een schriftelijke verklaring waaruit blijkt dat de mededeling, bedoeld in [artikel 41][ref2],
      aan het college is gedaan.

      2 Het college verstrekt binnen een week na ontvangst van een daartoe strekkend schriftelijk verzoek van een
      postvervoerbedrijf een verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0025572#Artikel41
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel45
