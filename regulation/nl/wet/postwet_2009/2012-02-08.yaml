  - number: '49'
    text: |-
      1 Het college kan in geval van overtreding van een bindende aanwijzing als bedoeld in
      [artikel 47, eerste lid][ref1], alsmede overtreding van het bepaalde bij of krachtens de [artikelen 4][ref2],
      [5][ref3], [8][ref4], [9][ref5], [10][ref6], [12][ref7], [13][ref8], [16, vijfde lid][ref9],
      [18][ref10], [19][ref11], [22][ref12], [23][ref13], [24][ref14], [26][ref15], [27][ref16],
      [28][ref17], [31, vierde lid][ref18], [32][ref19], [35][ref20], [36][ref21], [39, derde lid][ref22],
      [41][ref23], [59][ref24], [61][ref25], [63, tweede lid][ref26], en [64][ref27] van deze wet, alsmede
      [artikel 5:20 van de Algemene wet bestuursrecht][ref28] de overtreder per overtreding een bestuurlijke boete
      opleggen van ten hoogste € 450 000 of, indien dat meer is, 10% van de relevante netto-omzet van de onderneming
      in Nederland.

      2 Onze Minister kan in geval van overtreding van een bindende aanwijzing als bedoeld in
      [artikel 47, tweede lid][ref29], alsmede overtreding van het bepaalde bij of krachtens [hoofdstuk 11][ref30] de
      overtreder per overtreding een bestuurlijke boete opleggen van ten hoogste € 450 000 of, indien dat meer is, 10%
      van de relevante netto-omzet van de onderneming in Nederland.

      3 De berekening van de netto-omzet, bedoeld in het eerste en het tweede lid,

      a. geschiedt op de voet van [artikel 377, zesde lid, van Boek 2 van het Burgerlijk Wetboek][ref31];

      b. betreft het boekjaar voorafgaande aan de beschikking, bedoeld in het eerste en het tweede lid;

      c. is beperkt tot de omzet die betrekking heeft op de postvervoerdiensten, bedoeld in
      [artikel 2, eerste lid, onderdeel d][ref32].


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel47
