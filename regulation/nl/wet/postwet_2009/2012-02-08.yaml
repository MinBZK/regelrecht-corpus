      2 De bij besluit van Onze Minister aangewezen ambtenaren zijn belast met het toezicht op de naleving van het
      bepaalde bij of krachtens [hoofdstuk 11][ref2]. Van het besluit wordt mededeling gedaan door plaatsing in de
