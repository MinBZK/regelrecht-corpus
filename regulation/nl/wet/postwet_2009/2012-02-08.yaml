  - number: '28'
    text: |-
      1 Een verlener van de universele postdienst kan, met het oog op de doelmatige wijze van uitvoeren van de universele
      postdienst, in de algemene voorwaarden regels stellen over de verpakking en adressering van poststukken.

      2 Indien de algemene voorwaarden van een verlener van de universele postdienst bepalingen bevatten over het gebruik
      van een postcode, zorgt hij ervoor dat afzenders kosteloos en op eenvoudige wijze de bij een adres behorende
      postcode kunnen verkrijgen.
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel28
  - number: '29'
    text: |-
      1 Een verlener van de universele postdienst is voor schade als gevolg van verlies, beschadiging of vertraagde
      aflevering van binnenlandse poststukken slechts aansprakelijk indien door de afzender gebruik wordt gemaakt van
      een wijze van vervoer waarbij een poststuk volgens daartoe in de algemene voorwaarden van het postvervoerbedrijf te
      stellen regels wordt geregistreerd.

      2 De aansprakelijkheid bedoeld in het eerste lid bestaat niet indien de schade uitsluitend het gevolg is van een of
      meer van de volgende omstandigheden:

      a. de aard of een gebrek van het vervoerde zelf;

      b. onvoldoende verpakking van het vervoerde door een ander dan een verlener van de universele postdienst of diens
      ondergeschikten;

      c. een oorzaak die aan de afzender kan worden toegerekend;

      d. een oorlogshandeling of een gewapend conflict;

      e. aanhouding op last van daartoe bevoegd gezag.

      3 Vorderingen kunnen slechts worden ingediend door de afzender. Indien de schade is geleden door een ander dan de
      afzender, is de afzender van rechtswege bevoegd ten behoeve van die ander, hetzij op eigen naam hetzij als diens
      vertegenwoordiger, de vordering in te stellen.

      4 Bij algemene maatregel van bestuur worden bedragen vastgesteld waarboven de aansprakelijkheid, bedoeld in het
      eerste lid, zich niet uitstrekt, waarbij de hoogte van de afzonderlijke bedragen kan worden bepaald naar gelang van
      onder meer de soorten van registratie alsmede naar gelang van de aard en de waarde van een poststuk.

      5 Een verlener van de universele postdienst kan zich niet beroepen op een uit de voorgaande leden van dit artikel
      voortvloeiende uitsluiting of beperking van zijn aansprakelijkheid voor zover de schade is ontstaan uit zijn eigen
      handelen of nalaten, geschied hetzij met het opzet die schade te veroorzaken, hetzij roekeloos en met de wetenschap
      dat die schade er waarschijnlijk uit zou voortvloeien.

      6 Ter zake van het postvervoer van of naar gebieden buiten Nederland is een verlener van de universele postdienst
      slechts aansprakelijk overeenkomstig de bepalingen van de akten van de Wereldpostunie dan wel andere voor Nederland
      bindende verdragen of besluiten van volkenrechtelijke organisaties.

      7 Nietig is ieder beding, waarbij van dit artikel wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel29
  - number: '30'
    text: |-
      1 Een verlener van de universele postdienst meldt uiterlijk drie maanden voor de afloop van het kalenderjaar aan
      het college dat in het daaropvolgende kalenderjaar nettokosten worden verwacht voor de uitvoering van de universele
      postdienst. Daarbij wordt aangegeven hoe hoog de voor dat kalenderjaar verwachte nettokosten zullen zijn.

      2 De nettokosten zijn de kosten die een verlener van de universele postdienst voor de aan hem opgedragen universele
      postdiensten maakt waartegenover door toepassing van de regels, bedoeld in [artikel 25][ref1], geen vergoeding
      staat, verminderd met andere op geld waardeerbare voordelen die verband houden met de verlening van de universele
      postdienst, waaronder begrepen immateriële voordelen.

      3 Een postvervoerbedrijf dat ingevolge het eerste lid nettokosten heeft aangekondigd, kan binnen een half jaar
      na afloop van het kalenderjaar waarin de nettokosten zijn ontstaan, bij het college een aanvraag indienen om
      vergoeding van de in het afgelopen kalenderjaar gemaakte nettokosten.

      4 Een vergoeding wordt slechts toegekend voorzover naar het oordeel van het college het bestaan en de hoogte van de
      nettokosten voldoende is aangetoond.

      5 Bij ministeriële regeling kunnen regels worden gesteld over de berekening van de nettokosten, bedoeld in het
      tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel25
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '25'
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: '31'
    text: |-
      1 De vergoeding aan een universele postdienstverlener wordt omgeslagen over alle postvervoerbedrijven, met
      uitzondering van de postvervoerbedrijven die voldoen aan bij ministeriële regeling te bepalen criteria met
      betrekking tot de relevante omzet van een postvervoerbedrijf in Nederland.

      2 Bij ministeriële regeling wordt de wijze van berekening van de vergoeding vastgesteld aan de hand van de
      relevante netto-omzet van een postvervoerbedrijf in Nederland.

      3 Het college doet aan een postvervoerbedrijf mededeling van het door hem verschuldigde bedrag.

      4 Een postvervoerbedrijf is verplicht binnen een daarbij te bepalen termijn de door het college vastgestelde
      vergoeding te betalen aan de desbetreffende verlener van de universele postdienst.
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel31
  - number: '32'
    text: |-
      1 Een verlener van de universele postdienst is gehouden bij de uitvoering van de op hem rustende verplichtingen
      terzake van de universele postdienst van of naar gebieden buiten Nederland de voor Nederland bindende
      verplichtingen na te komen die voortvloeien uit de akten van de Wereldpostunie dan wel uit andere verdragen of
      besluiten van volkenrechtelijke organisaties.

      2 Een verlener van de universele postdienst is gerechtigd voor de toepassing van akten van de Wereldpostunie op te
      treden als Nederlandse postadministratie.

      3 Onze Minister geeft in overeenstemming met Onze Minister van Buitenlandse Zaken bij ministeriële regeling
      voorschriften welke strekken tot:

      a. het waarborgen van een goede toepassing van het eerste lid;

      b. het verlenen van de nodige medewerking aan Onze Minister en Onze Minister van Buitenlandse Zaken bij de
      voorbereiding van verdragen en besluiten als bedoeld in het eerste lid en het in verband daarmee te voeren
      internationale overleg.
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel32
  - number: '33'
    text: |-
      1 Het college verzamelt, analyseert en bewerkt systematisch inlichtingen en gegevens met betrekking tot de werking
      van de nationale markt voor postvervoerdiensten.

      2 Het college zendt jaarlijks een verslag van zijn bevindingen aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel33
  - number: '34'
    text: |-
      De gemeenteraad kan voor de plaatsing van brievenbussen aan de openbare weg regels stellen, tenzij door het stellen
      van regels:

      a. de verlener van de universele postdienst de universele postdienst niet kan verrichten;

      b. postvervoerbedrijven, niet zijnde een verlener van de universele postdienst, hun diensten niet onder voor deze
      bedrijven vergelijkbare voorwaarden kunnen aanbieden.
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel34
  - number: '35'
    text: De afbeelding van de Koning op een postzegel of postzegelafdruk behoeft Diens goedkeuring.
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel35
  - number: '36'
    text: |-
      1 Het is aan andere postvervoerbedrijven dan verleners van de universele postdienst verboden postzegels of
      postzegelafdrukken te vervaardigen, te verspreiden of ter verspreiding in voorraad te hebben met daarop de
      vermelding «Nederland».

      2 Het is verboden zegels, zegelafdrukken, stempelafdrukken of aanduidingen op zodanige wijze te bezigen, dat zij
      ten onrechte de indruk kunnen wekken, dat de bescheiden of voorwerpen, waarop zij voorkomen, door een verlener van
      de universele postdienst behandeld of van een verlener van de universele postdienst afkomstig zijn.
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel36
  - number: '37'
    text: |-
      1 Het college is belast met het toezicht op de naleving van het bepaalde bij of krachtens deze wet, met
      uitzondering van [hoofdstuk 11][ref1].

      2 De bij besluit van het college aangewezen ambtenaren zijn belast met het toezicht op de naleving van het bepaalde
      bij of krachtens deze wet, met uitzondering van [hoofdstuk 11][ref2]. Van het besluit wordt mededeling gedaan door
      plaatsing in de Staatscourant.


