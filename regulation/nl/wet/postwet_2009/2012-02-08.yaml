        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '19'
    text: |-
      1 Een verlener van de universele postdienst weigert de uitvoering van de universele postdienst indien dit strijdig
      is met de wet of gevaar oplevert voor personen of zaken.

      2 Een verlener van de universele postdienst kan de uitvoering van de universele postdienst weigeren indien dit
      strijdig is met de eisen die met het oog op een doelmatig postvervoer in zijn algemene voorwaarden zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel19
  - number: '20'
    text: |-
      1 Bij ministeriële regeling worden regels omtrent plaats, afmetingen en andere hoedanigheden van de voor aflevering
      van poststukken bestemde brievenbussen vastgesteld.

      2 Een verlener van de universele postdienst kan poststukken die naar hun aard en omvang in aanmerking komen
      voor aflevering in een brievenbus, als onbestelbaar aanmerken indien het opgegeven adres niet beschikt over een
      brievenbus die voldoet aan de regels, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel20
  - number: '21'
    text: |-
      Een verlener van de universele postdienst kan gedeelten van de universele postdienst door anderen onder zijn
      verantwoordelijkheid doen uitvoeren.
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel21
  - number: '22'
    text: |-
      1 Een verlener van de universele postdienst brengt een boekhoudkundige scheiding aan tussen de kosten en
      opbrengsten van de universele postdienst en de kosten en opbrengsten van andere activiteiten.

      2 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de inrichting van de boekhouding en de
      wijze van toerekening van de kosten van de universele postdienst.
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel22
  - number: '23'
    text: |-
      1 Een verlener van de universele postdienst verstrekt jaarlijks aan het college een rapportage over de uitvoering
      van de universele postdienst. Deze rapportage bevat de resultaten van regelmatige metingen van de kwaliteit van
      de universele postdienstverlening en de hierbij behorende kwaliteitsnormen, alsmede een overzicht van de kosten en
      opbrengsten van de universele postdienstverlening, bedoeld in [artikel 22, eerste lid][ref1].

      2 Bij ministeriële regeling worden nadere regels gesteld over de rapportage. Deze regels kunnen betrekking hebben
      op de inrichting van de rapportage, op de metingen, bedoeld in het eerste lid, alsmede op de op te nemen financiële
      gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel22
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '22'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '24'
    text: |-
      1 Een verlener van de universele postdienst stelt voorwaarden en tarieven vast voor de onderscheiden
      postvervoerdiensten binnen de universele postdienst en maakt deze bekend.

      2 De tarieven zijn uniform en op de kosten gebaseerd.

      3 De voorwaarden en tarieven zijn non-discriminatoir en transparant.
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel24
  - number: '25'
    text: |-
      1 Bij ministeriële regeling, gehoord het college, wordt bepaald:

      a. met welk percentage de tarieven voor de universele postdienst jaarlijks gemiddeld ten hoogste mogen worden
      gewijzigd;

      b. op welke wijze de jaarlijks gemiddelde wijziging, bedoeld in onderdeel a, wordt vastgesteld.

      2 Bij ministeriële regeling kan, gehoord het college, voor een afzonderlijk jaar een ander percentage dan bedoeld
      in het eerste lid worden vastgesteld indien dit noodzakelijk is om te voldoen aan het vereiste dat de tarieven op
      de kosten gebaseerd zijn.

      3 Met inachtneming van bij ministeriële regeling te stellen regels worden, in afwijking van het eerste en tweede
      lid, zes maanden na inwerkingtreding van dit artikel de tarieven voor de te onderscheiden postvervoerdiensten
      binnen de universele postdienst gebaseerd op de daadwerkelijke kosten van de universele postdienst en een redelijk
      rendement. Bij de ministeriële regeling, bedoeld in de eerste volzin, kan worden bepaald dat de tarieven voor de
      onderscheiden postvervoerdiensten binnen de universele postdienst in enig ander jaar kunnen worden aangepast op
      basis van de daadwerkelijke kosten van de universele postdienst en een redelijk rendement.

      4 Het eerste en het tweede lid zijn van overeenkomstige toepassing op de tarieven, bedoeld in het derde lid.

      5 In afwijking van de [artikelen 24][ref1] en [27][ref2] worden de tarieven, bedoeld in het derde lid, door het
      college vastgesteld.

      6 Bij de ministeriële regeling, bedoeld in het derde lid, worden regels vastgesteld met betrekking tot de elementen
      van de tarieven, de wijze van berekening van de tarieven en de toerekening van de kosten.

      7 Het college brengt advies uit over de ministeriële regeling, bedoeld in het derde lid.

      8 Het ontwerp voor een krachtens het derde lid vast te stellen ministeriële regeling en het advies van het college
      worden gelijktijdig aan beide kamers der Staten-Generaal overgelegd. De ministeriële regeling wordt niet eerder
      vastgesteld dan vier weken na de overlegging van het ontwerp.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0025572#Artikel27
