    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. *Onze Minister:* Onze Minister van Economische Zaken, Landbouw en Innovatie;

      b. *college:* het college, genoemd in
      [artikel 2 van de Wet Onafhankelijke post- en telecommunicatieautoriteit][ref1];

      c. *raad van bestuur van de mededingingsautoriteit:* de raad van bestuur van de Nederlandse Mededingingsautoriteit,
      genoemd in [artikel 2, eerste lid, van de Mededingingswet][ref2];

      d. *akten van de Wereldpostunie:* de op 10 juli 1964 te Wenen tot stand gekomen Constitutie van de Wereldpostunie
      (Trb. 1965, 170) en de daarbij behorende voor Nederland bindende verdragen, reglementen en protocollen (Trb. 1965,
      170 en Trb. 2002, 205);

      e. *bestuurlijke boete:* de bestraffende sanctie, inhoudende een onvoorwaardelijke verplichting tot betaling van
      een geldsom;

      f. *overtreding:* een gedraging die in strijd is met het bepaalde bij of krachtens enig wettelijk voorschrift;

      g. *overtreder:* degene die de overtreding pleegt of medepleegt.

      2 Bij besluit van Onze Minister kunnen de vindplaatsen, bedoeld in het eerste lid, onderdeel d, worden gewijzigd.
      Van dit besluit wordt mededeling gedaan door plaatsing in de Staatscourant.


