    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. *brief:* de op een fysieke drager aangebrachte geadresseerde schriftelijke mededelingen;

      b. *poststuk:* een brief of een ander bij algemene maatregel van bestuur aangewezen geadresseerd stuk;

      c. *postvervoer:* het geheel van handelingen dat bedrijfsmatig wordt verricht teneinde poststukken af te leveren;

      d. *postvervoerdienst:* een of meer van de handelingen, bedoeld in onderdeel c;

      e. *postvervoerbedrijf:* eenieder die postvervoerdiensten aanbiedt;

      f. *universele postdienst:* de universele postdienst, bedoeld in de [artikelen 16][ref1] en [17][ref2];

      g. *verlener van de universele postdienst:* een postvervoerbedrijf dat ingevolge [artikel 15, eerste lid][ref3],
      is aangewezen;

      h. *postbus:* een in een gebouw aanwezige afgesloten ruimte die bestemd is voor de aflevering van de voor de
      gebruiker daarvan bestemde poststukken;

      i. *afzender:* eenieder die een poststuk ten vervoer aanbiedt aan een postvervoerbedrijf;

      j. *postcodesysteem:* een algemeen gebruikt adrescodesysteem voor een efficiënte postbezorging.

      2 In afwijking van het eerste lid, onderdeel c, wordt onder postvervoer niet verstaan:

      a. het vervoer van afzonderlijk geregistreerde exprespost waarover tussen afzender en vervoerbedrijf afzonderlijke
      overeenkomsten zijn gesloten over het tijdvak of tijdstip van bestellen, over de leveringszekerheid en over de
      aansprakelijkheid;

      b. het vervoer, dat wordt verricht onder verantwoordelijkheid van de afzender, van poststukken die kennelijk
      bestemd zijn om op een met een postvervoerbedrijf afgesproken plaats te worden overgedragen aan dat
      postvervoerbedrijf, teneinde de poststukken door dat postvervoerbedrijf op de afzonderlijke adressen te laten
      bezorgen.


