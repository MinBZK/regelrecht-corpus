  - number: '16'
    text: |-
      1 De universele postdienst betreft het postvervoer binnen Nederland van ten minste de volgende poststukken:

      a. brieven die elk afzonderlijk ten hoogste twee kilogram wegen;

      b. pakketten die elk afzonderlijk ten hoogste tien kilogram wegen;

      c. poststukken die in hoofdzaak tekst bevatten in voor blinden bestemde tekens die elk afzonderlijk ten hoogste
      zeven kilogram wegen.

      2 De universele postdienst betreft het postvervoer van of naar gebieden buiten Nederland van ten minste de volgende
      poststukken:

      a. brieven die elk afzonderlijk ten hoogste twee kilogram wegen;

      b. boeken die elk afzonderlijk ten hoogste vijf kilogram wegen;

      c. pakketten die elk afzonderlijk ten hoogste twintig kilogram wegen;

      d. poststukken die in hoofdzaak tekst bevatten in voor blinden bestemde tekens en die elk afzonderlijk ten hoogste
      zeven kilogram wegen.

      3 De universele postdienst omvat binnen Nederland ten minste de volgende postvervoerdiensten:

      a. vervoer van aangetekende poststukken;

      b. vervoer van poststukken met aangegeven waarde;

      c. de uitreiking van het gerechtelijk schrijven, bedoeld in de [artikelen 585, tweede lid][ref1], en
      [587, eerste lid, van het Wetboek van Strafvordering][ref2].

      4 Onder de universele postdienst vallen bij postvervoer van en naar gebieden buiten Nederland ten minste de
      postvervoerdiensten, opgenomen in de akten van de Wereldpostunie.

      5 Een verlener van de universele postdienst haalt ten minste zes dagen per week poststukken op uit de voor het
      publiek bestemde brievenbussen dan wel uit andere daartoe bestemde inrichtingen, en voert ten minste zes dagen per
      week overal in Nederland een bestelling uit.

      6 Een verlener van de universele postdienst zorgt ervoor dat de brieven, die overeenkomstig de daartoe gestelde
      voorwaarden aan hem worden aangeboden voor postvervoer binnen Nederland met de standaard overnight service,
      per kalenderjaar in ten minste gemiddeld 95% van de gevallen worden besteld op de dag, niet zijnde een zon- of
      officiële feestdag, volgend op de dag van aanbieding.

      7 De verlener van de universele postdienst zorgt ervoor dat het net van dienstverleningspunten voor het aanbieden
      van postzendingen en voor het verrichten van andere met het postvervoer samenhangende handelingen ten minste 2000
      dienstverleningspunten omvat, waarvan ten minste 902 met een volledig assortiment aan diensten. Bovendien zorgt de
      verlener van de universele postdienst ervoor dat dit net voldoet aan de volgende spreidingsmaatstaven:

      a. de spreiding over Nederland van dienstverleningspunten met een volledig assortiment van diensten resulteert in
      een beschikbaarheid van een volledig assortiment van diensten binnen een straal van vijf kilometer voor ten minste
      95% van de inwoners;

      b. de spreiding van dienstverleningspunten met een volledig assortiment van diensten buiten woonkernen met meer
      dan 5000 inwoners resulteert in een beschikbaarheid van een volledig assortiment van diensten binnen een straal van
      5 kilometer voor ten minste 85% van de betrokken inwoners.

      8 De verlener van de universele postdienst zorgt ervoor dat in woonkernen met meer dan 5000 inwoners binnen een
      straal van 500 meter een voor het publiek bestemde brievenbus is om voor postvervoer bestemde poststukken aan te
      bieden. Buiten deze woonkernen zorgt de verlener van de universele postdienst ervoor dat binnen een straal van 2500
      meter voor het publiek bestemde brievenbussen zijn.

      9 Indien het gestelde in het achtste lid redelijkerwijs niet haalbaar is, draagt de verlener van de universele
      postdienst er zorg voor dat bij de bestelling gelegenheid wordt geboden om daartoe geschikte postzendingen ten
      vervoer aan te bieden.


