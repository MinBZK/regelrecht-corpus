      1 Het college kan bindende aanwijzingen geven in verband met de naleving van het bepaalde bij of krachtens deze
      wet, met uitzondering van [hoofdstuk 11][ref1].

      2 Onze Minister kan bindende aanwijzingen geven in verband met de naleving van het bepaalde bij of krachtens
      [hoofdstuk 11][ref2].

      3 Een beschikking als bedoeld in het eerste of tweede lid, wordt gepubliceerd in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Hoofdstuk11
