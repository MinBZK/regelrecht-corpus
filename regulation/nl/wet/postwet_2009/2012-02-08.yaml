  - number: '4'
    text: |-
      Een postvervoerbedrijf zorgt ervoor dat bij de uitvoering van postvervoerdiensten het grondwettelijk briefgeheim
      niet wordt geschonden.
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel4
  - number: '5'
    text: |-
      Gesloten poststukken die in het kader van postvervoerdiensten als onbestelbaar zijn aan te merken en niet aan de
      afzender kunnen worden teruggegeven, kunnen slechts worden geopend op last van de kantonrechter te ’s-Gravenhage,
      zulks uitsluitend ter opsporing van de voor teruggave of aflevering nodige gegevens omtrent de afzender of de
      geadresseerde.
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel5
  - number: '6'
    text: |-
      Beslag op poststukken welke in het kader van postvervoerdiensten aan een postvervoerbedrijf zijn toevertrouwd, is
      slechts toegelaten in de gevallen dat de wet een zodanig beslag uitdrukkelijk regelt.
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel6
  - number: '7'
    text: |-
      1 Een postvervoerbedrijf voorziet in een procedure voor de behandeling van klachten van afzenders en ontvangers
      over de door hem uitgevoerde postvervoerdiensten.

      2 Bij ministeriële regeling kunnen regels worden gesteld over de procedure, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel7
  - number: '8'
    text: |-
      Bij algemene maatregel van bestuur kunnen voorschriften worden gesteld over in acht te nemen arbeidsvoorwaarden
      indien:

      a. tegen sociaal onaanvaardbare arbeidsvoorwaarden arbeid wordt verricht,

      b. er sprake is van een tijdelijk zich tot de postsector beperkend probleem, en

      c. voor zover het probleem niet kan worden opgelost door aanpassing van algemeen geldende voorschriften of bij
      overeenkomst tussen de desbetreffende werkgever en vertegenwoordigers van werknemersorganisaties.
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel8
  - number: '9'
    text: |-
      1 Indien een postvervoerbedrijf, dat beschikt over een netwerk waarmee poststukken op ten minste vijf dagen
      per week kunnen worden bezorgd op alle adressen in Nederland, met gebruikmaking van dat netwerk postvervoer
      verricht tegen speciale voorwaarden en tarieven, verricht hij dit postvervoer voor andere postvervoerbedrijven
      tegen non-discriminatoire en transparante voorwaarden en tarieven ten opzichte van andere afzenders en andere
      postvervoerbedrijven. Onder andere postvervoerbedrijven vallen ook groepsmaatschappijen die in een groep verbonden
      zijn in de zin van [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] met het postvervoerbedrijf dat
      beschikt over een netwerk als bedoeld in de eerste volzin.

      2 Indien blijkt dat op de nationale postmarkt of een onderdeel daarvan daadwerkelijke concurrentie ontbreekt,
      kunnen bij algemene maatregel van bestuur nadere regels worden gesteld met betrekking tot de voorwaarden en
      tarieven die worden gehanteerd bij het verrichten van postvervoerdiensten tegen speciale voorwaarden en tarieven
      door postvervoerbedrijven die over een netwerk beschikken als bedoeld in het eerste lid.

      3 Een postvervoerbedrijf als bedoeld in het eerste lid zorgt ervoor dat de geldende speciale voorwaarden en
      tarieven voor eenieder kenbaar zijn.

      4 Bij ministeriële regeling kunnen in aanvulling op het eerste lid regels worden gesteld over het verlenen van
      toegang tot het in dat lid bedoelde netwerk. Deze regels kunnen inhouden dat:

      a. een postvervoerbedrijf, dat beschikt over een dergelijk netwerk, op verzoek van bij die regeling aan te wijzen
      categorieën derden toegang verleent tot dat netwerk tegen redelijke, transparante en non-discriminatoire tarieven
      en voorwaarden, voor zover een bedrijfsmatige en op continuïteit gerichte exploitatie van het netwerk dit toelaat;

      b. het in onderdeel a bedoelde postvervoerbedrijf er zorg voor draagt dat de geldende voorwaarden en tarieven als
      bedoeld in dat onderdeel voor eenieder kenbaar zijn.

      5 Het college brengt uiterlijk een jaar na de inwerkingtreding van dit artikel aan Onze Minister verslag uit over
      de doeltreffendheid en effecten in de praktijk van het eerste lid en verstrekt daarbij advies over de wenselijkheid
      om toepassing te geven aan het vierde lid. Onze Minister zendt het verslag, vergezeld van zijn bevindingen, aan de
      Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
