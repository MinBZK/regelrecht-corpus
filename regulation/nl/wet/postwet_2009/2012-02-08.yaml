  - number: '39'
    text: |-
      1 Het college kan van een ieder de gegevens en inlichtingen verlangen die hij nodig heeft voor de juiste uitvoering
      van de hem bij of krachtens deze wet en de [Wet Onafhankelijke post- en telecommunicatieautoriteit][ref1]
      opgedragen taken.

      2 Onze Minister kan van een ieder de gegevens en inlichtingen verlangen die hij nodig heeft voor de juiste
      uitvoering van de hem bij of krachtens deze wet opgedragen taken.

      3 Degene aan wie een verzoek is gedaan om gegevens en inlichtingen te verstrekken, is verplicht binnen een
      door het college respectievelijk Onze Minister gestelde redelijke termijn alle medewerking te verlenen die deze
      redelijkerwijs kan vorderen bij de uitoefening van zijn bevoegdheden.

      4 Gegevens en inlichtingen welke in verband met enige werkzaamheid ten behoeve van de uitvoering van deze wet zijn
      verkregen, mogen uitsluitend voor de toepassing van deze wet en de [Mededingingswet][ref2] worden gebruikt.

      5 Met inachtneming van een goede vervulling van zijn toezichthoudende taken ingevolge deze wet draagt het college
      er zorg voor dat het verzamelen van de gegevens of inlichtingen, bedoeld in het eerste lid, op zodanige wijze
      geschiedt dat de daaruit voortvloeiende administratieve lasten voor postvervoerbedrijven of andere bedrijven en
      instellingen zo laag mogelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008807
      [ref2]: https://wetten.overheid.nl/BWBR0008691
