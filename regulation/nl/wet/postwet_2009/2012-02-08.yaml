  - number: '41'
    text: |-
      Een postvervoerbedrijf deelt aan het college in ieder geval de naam, het adres, de vestigingsplaats en een
      beschrijving van de aangeboden postvervoerdiensten mee.
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel41
  - number: '42'
    text: |-
      1 Het college stelt vast welke andere gegevens dan genoemd in [artikel 41][ref1] bij de mededeling aan het college
      worden overgelegd, alsmede de wijze waarop de mededeling wordt gedaan.

      2 De gegevens, bedoeld [artikel 41][ref2] en het eerste lid, worden slechts verzameld ten behoeve van de goede
      uitvoering van deze wet.

      3 Het college registreert het postvervoerbedrijf na ontvangst van de in [artikel 41][ref3] bedoelde mededeling en
      de daarbij behorende gegevens.

      4 Een postvervoerbedrijf geeft wijzigingen van de gegevens, bedoeld in [artikel 41][ref4] en het eerste lid,
      onverwijld aan het college door.


