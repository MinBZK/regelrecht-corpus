  - number: '55'
    text: |-
      1 Een beschikking waarbij een last onder dwangsom dan wel een bestuurlijke boete als bedoeld in [artikel 49][ref1]
      wordt opgelegd wordt, nadat zij bekend is gemaakt, ter inzage gelegd bij het college respectievelijk Onze Minister.

      2 Van de beschikking wordt mededeling gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel49
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '49'
        hoofdstuk: '7'
        paragraaf: '7.5'
  - number: '56'
    text: Verzet schorst de tenuitvoerlegging van een dwangbevel dat strekt tot invordering van de bestuurlijke boete.
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel56
  - number: '57'
    text: |-
      De te betalen geldsom van de door het college opgelegde bestuurlijke boete, de verbeurde dwangsommen bij een door
      het college opgelegde last en de als gevolg van die boete en dwangsom verschuldigde wettelijke rente, komen toe aan
      de Staat.
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel57
  - number: '58'
    text: |-
      1 Indien tussen postvervoerbedrijven, tussen een postvervoerbedrijf en iemand die postbussen exploiteert, tussen
      een postvervoerbedrijf en iemand die een systeem met adresgegevens als bedoeld in [artikel 11][ref1] exploiteert
      of beheert of tussen een postvervoerbedrijf en iemand die een postcodesysteem exploiteert of beheert een geschil
      is ontstaan inzake de nakoming van de verplichtingen bedoeld in [hoofdstuk 3][ref2], beslecht het college op
      aanvraag van een bij dat geschil betrokken partij het geschil voor zover naar het oordeel van het college verdere
      onderhandelingen redelijkerwijs niet meer zullen leiden tot overeenstemming.

      2 Het college is onbevoegd tot het beslechten van een op grond van het eerste lid voorgelegd geschil indien de bij
      dat geschil betrokken partijen het college verzoeken het geschil niet langer te beslechten.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0025572#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '11'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0025572
        hoofdstuk: '3'
  - number: '59'
    text: |-
      1 Op vordering van het college verstrekken de bij een geschil betrokken partijen binnen een door het college te
      bepalen redelijke termijn aan het college alle gegevens die relevant zijn voor de beoordeling van het geschil.

      2 De bij het geschil betrokken partijen zijn verplicht binnen de door het college gestelde redelijke termijn alle
      medewerking te verlenen die deze redelijkerwijs kan vorderen ten behoeve van de beoordeling van het geschil.
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel59
  - number: '60'
    text: |-
      1 Het college beslist op een aanvraag als bedoeld in [artikel 58, eerste lid][ref1], binnen zeventien weken na
      ontvangst van de aanvraag.

      2 In uitzonderlijke gevallen kan het college de termijn, bedoeld in het eerste lid, met ten hoogste acht weken
      verlengen. Het college stelt de betrokken postvervoerbedrijven hiervan in kennis en geeft de termijn aan waarbinnen
      het college het geschil zal beslechten.

      3 Het college kan in spoedeisende gevallen een voorlopig besluit nemen dat tussen de betrokken postvervoerbedrijven
      geldt tot het definitieve besluit van het college in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel58
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '58'
        hoofdstuk: '8'
  - number: '61'
    text: |-
      Een postvervoerbedrijf volgt het door het college op grond van [artikel 60][ref1] genomen besluit op. Het college
      kan daarbij een termijn stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel60
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '60'
        hoofdstuk: '8'
  - number: '62'
    text: |-
      Het college doet mededeling in de Staatscourant van een besluit als bedoeld in [artikel 60][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel60
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '60'
        hoofdstuk: '8'
  - number: '63'
    text: |-
      1 Indien een partij door het college in het gelijk wordt gesteld en hij voor het beslechten van een geschil een
      vergoeding aan het college verschuldigd is, kan het college bepalen dat die vergoeding door de bij het geschil
      betrokken andere partij wordt vergoed.

      2 Een bij een geschil betrokken partij volgt de door het college op grond van het eerste lid gegeven voorschriften
      op. Het college kan daarbij termijnen stellen.
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel63
  - number: '64'
    text: |-
      1 Postvervoerbedrijven zijn ter dekking van de kosten die verband houden met de werkzaamheden van het college ter
      uitvoering van deze wet, jaarlijks een vergoeding verschuldigd.

      2 Van de vergoeding zijn uitgezonderd de kosten verbonden aan de behandeling van bezwaar- en beroepschriften.

      3 Van de verplichting, bedoeld in het eerste lid, zijn uitgezonderd bedrijven die voldoen aan een bij algemene
      maatregel van bestuur vast te stellen criterium met betrekking tot de relevante omzet van een postvervoerbedrijf
      in Nederland.
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel64
  - number: '65'
    text: |-
      1 Onze Minister stelt de hoogte van de vergoeding, bedoeld in [artikel 64, eerste lid][ref1], vast.

      2 Bij of krachtens algemene maatregel van bestuur worden nadere regels nadere gesteld over de vergoeding,
      bedoeld in [artikel 64][ref2]. Deze regels kunnen mede betrekking hebben op de wijze waarop de vergoeding wordt
      vastgesteld, geheven en ingevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0025572#Artikel64
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '64'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0025572
        artikel: '64'
        hoofdstuk: '9'
  - number: '66'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen ter implementatie van postrichtlijnen en
      liberalisatierichtlijnen regels worden gesteld.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ter implementatie van een bindende
      overeenkomst tussen de Europese Gemeenschap en een derde land of een internationale organisatie die betrekking
      heeft op een onderwerp dat wordt bestreken door een postrichtlijn ofverordening.

      3 Bij ministeriële regeling kunnen voor een goede uitvoering van postverordeningen en gedelegeerde verordeningen
      regels worden gesteld.

      4 Bij ministeriële regeling kunnen ter implementatie van gedelegeerde richtlijnen regels worden gesteld.

      5 Bij de regels, bedoeld in het eerste tot en met vierde lid, kunnen:

      a. taken worden opgedragen en bevoegdheden worden verleend aan het college, en

      b. voorschriften uit een postverordening of gedelegeerde verordening worden aangewezen waarop door het college
      aangewezen ambtenaren toezicht houden of die het college kan toepassen door besluiten te nemen.
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel66
  - number: '67'
    text: |-
      In bijzondere omstandigheden in verband met de handhaving van de internationale rechtsorde of met de internationale
      betrekkingen is Onze Minister bevoegd om in overeenstemming met Onze Minister van Buitenlandse Zaken aan een
      verlener van de universele postdienst en zo nodig aan een ander postvervoerbedrijf aanwijzingen te geven met
      betrekking tot het postvervoer van of naar gebieden buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel67
  - number: '68'
    text: |-
      1 Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kan, ingeval buitengewone omstandigheden dit
      noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President, voor het gehele land of een
      deel daarvan [artikel 70][ref3] in werking worden gesteld.

      2 Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepaling.

      3 Wordt het voorstel van wet door de Staten-Generaal verworpen, dan wordt bij koninklijk besluit, op voordracht van
      Onze Minister-President, de bepaling die ingevolge het eerste lid in werking is gesteld, onverwijld buiten werking
      gesteld.

      4 Bij koninklijk besluit, op voordracht van Onze Minister-President, wordt de bepaling die ingevolge het eerste lid
      in werking is gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.

      5 Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.

      6 Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het Staatsblad.


