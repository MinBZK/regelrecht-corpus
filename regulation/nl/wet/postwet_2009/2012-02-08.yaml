  - number: '10'
    text: |-
      1 Een ieder die een postcodesysteem beheert of exploiteert is verplicht binnen redelijke termijn en tegen
      kostengeoriënteerde tarieven een ieder uit dit systeem combinaties van adressen en postcodes ter beschikking te
      stellen die voor postbezorging nodig zijn.

      2 Een ieder die een postcodesysteem exploiteert of beheert, is verplicht een jaar voor de beëindiging van dit
      systeem, deze beëindiging aan te kondigen.
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel10
  - number: '11'
    text: |-
      Een ieder die een systeem met adresgegevens, betreffende de verhuisgegevens van een geadresseerde of de gegevens
      over het tijdelijk stopzetten van de postbezorging op verzoek van de geadresseerde, exploiteert of beheert
      is verplicht binnen redelijke termijn en tegen redelijke, objectief gerechtvaardigde, transparante en non-
      discriminatoire voorwaarden en tarieven de voor doelmatige postbezorging benodigde gegevens uit dit systeem aan
      postvervoerbedrijven te verstrekken.
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel11
  - number: '12'
    text: |-
      1 Indien een poststuk terecht komt in de poststroom van een ander postvervoerbedrijf dan het postvervoerbedrijf
      waaraan het poststuk door de afzender is aangeboden, geschiedt de afhandeling binnen redelijke termijn en tegen
      redelijke, objectief gerechtvaardigde, transparante en non-discriminatoire voorwaarden en tarieven.

      2 Postvervoerbedrijven maken afspraken voor de afhandeling van gevallen als bedoeld in het eerste lid.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel12
  - number: '13'
    text: |-
      Een ieder die postbussen exploiteert, is verplicht aan postvervoerbedrijven toegang te verlenen tot zijn postbussen
      tegen redelijke, objectief gerechtvaardigde, transparante en non-discriminatoire voorwaarden en tarieven.
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel13
  - number: '14'
    text: |-
      Dit hoofdstuk is van toepassing op de verlener van de universele postdienst voor zover deze postvervoerdiensten
      verricht die tot de universele postdienst behoren.
    url: https://wetten.overheid.nl/BWBR0025572/2012-02-08#Artikel14
  - number: '15'
    text: |-
      1 Onze Minister wijst op basis van een transparante selectieprocedure voor onbepaalde tijd een postvervoerbedrijf
      aan dat belast is met de universele postdienst of een gedeelte hiervan.

      2 Onze Minister kan een aanwijzing geheel of gedeeltelijk intrekken indien:

      a. de goede uitvoering van de universele postdienst of een gedeelte hiervan niet meer gewaarborgd is;

      b. een verlener van de universele postdienst overeenkomstig [artikel 30, eerste lid][ref1], heeft aangegeven dat de
      uitvoering van deze dienst nettokosten zal opleveren;

      c. het aangewezen postvervoerbedrijf daarom verzoekt;

      d. een ander postvervoerbedrijf te kennen heeft gegeven de universele postdienst uit te willen voeren.

      3 Onze Minister maakt het voornemen om de aanwijzing geheel of gedeeltelijk in te trekken aan het aangewezen
      postvervoerbedrijf bekend en doet hiervan mededeling in de Staatscourant.

      4 De aanwijzing wordt niet ingetrokken vóórdat is voorzien in een aanwijzing van een postvervoerbedrijf voor de
      universele postdienst of het gedeelte van de universele postdienst waarop de aanwijzing die wordt ingetrokken,
      betrekking heeft.

      5 Een postvervoerbedrijf waarvan de aanwijzing wordt ingetrokken, is verplicht deel te nemen aan de
      selectieprocedure.

      6 Een aanwijzing wordt niet gegeven aan een aanvrager die naar verwachting de universele dienst niet naar behoren
      zal kunnen verzorgen.

      7 Bij algemene maatregel van bestuur worden nadere regels gesteld over de selectieprocedure.

      8 De voordracht voor een krachtens het zevende lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel30
