      [ref17]: https://wetten.overheid.nl/BWBR0025572#Artikel41
      [ref18]: https://wetten.overheid.nl/BWBR0025572#Artikel61
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel49
    references:
