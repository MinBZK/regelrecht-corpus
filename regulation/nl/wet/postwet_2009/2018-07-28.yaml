  - number: '49.2'
    text: |-
      Onze Minister kan in geval van overtreding van een zelfstandige last als bedoeld in [artikel 47, tweede lid][ref1],
      alsmede overtreding van het bepaalde bij of krachtens [hoofdstuk 11][ref2] de overtreder per overtreding een
      bestuurlijke boete opleggen van ten hoogste € 900.000 of, indien dat meer is, 10% van de omzet van de onderneming
      in Nederland. [Artikel 12o van de Instellingswet Autoriteit Consument en Markt][ref3] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0025572#Hoofdstuk11
      [ref3]: https://wetten.overheid.nl/BWBR0033043#Artikel12o
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '47'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref2
        bwb_id: BWBR0025572
        hoofdstuk: '11'
      - id: ref3
        bwb_id: BWBR0033043
        artikel: 12o
  - number: '49.3'
    text: |-
      De bestuurlijke boete die ingevolge het eerste en tweede lid ten hoogste kan worden opgelegd wordt verhoogd met
      100%, indien binnen een tijdvak van vijf jaar voorafgaand aan de dagtekening van het van de overtreding opgemaakte
      rapport, bedoeld in [artikel 5:48, eerste lid, van de Algemene wet bestuursrecht][ref1], een aan die overtreder
      voor een eerdere overtreding van eenzelfde of een soortgelijk wettelijk voorschrift opgelegde bestuurlijke boete
      onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '55.1'
    text: |-
      Een beschikking waarbij een bestuurlijke boete als bedoeld in [artikel 49, tweede lid][ref1], wordt opgelegd of
      waarbij op basis van [artikel 48, tweede lid][ref2], een last onder dwangsom wordt opgelegd wordt, nadat zij bekend
      is gemaakt, ter inzage gelegd bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0025572#Artikel48
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '49'
        hoofdstuk: '7'
        paragraaf: '7.5'
      - id: ref2
        bwb_id: BWBR0025572
        artikel: '48'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: '55.2'
    text: Van de beschikking wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel55
  - number: '56'
    text: |-
      Verzet schorst de tenuitvoerlegging van een dwangbevel dat strekt tot invordering van een door Onze Minister
      opgelegde bestuurlijke boete.
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel56
  - number: '58.1'
    text: |-
      Indien tussen postvervoerbedrijven, tussen een postvervoerbedrijf en iemand die postbussen exploiteert, tussen
      een postvervoerbedrijf en iemand die een systeem met adresgegevens als bedoeld in [artikel 11][ref1] exploiteert
      of beheert of tussen een postvervoerbedrijf en iemand die een postcodesysteem exploiteert of beheert een geschil
      is ontstaan inzake de nakoming van de verplichtingen bedoeld in de [hoofdstukken 3][ref2] en [3a][ref3], beslecht
      de Autoriteit Consument en Markt op aanvraag van een bij dat geschil betrokken partij het geschil voor zover naar
      het oordeel van de Autoriteit Consument en Markt verdere onderhandelingen redelijkerwijs niet meer zullen leiden
      tot overeenstemming.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0025572#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0025572#Hoofdstuk3a
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '11'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0025572
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0025572
        hoofdstuk: 3a
  - number: '58.2'
    text: |-
      Onder een geschil als bedoeld in het eerste lid, wordt mede verstaan een geschil inzake de vraag of, indien de
      in dat lid bedoelde postvervoerbedrijven, natuurlijke of rechtspersonen een overeenkomst hebben gesloten op basis
      van een bij of krachtens de [hoofdstukken 3][ref1] en [3a][ref2] van deze wet, een op een of meer van hen rustende
      verplichting, de ter zake daarvan tussen hen bestaande verbintenissen, of de wijze waarop die verbintenissen worden
      nagekomen strijdig zijn, onderscheidenlijk strijdig is met het bij of krachtens deze wet bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0025572#Hoofdstuk3a
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0025572
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0025572
        hoofdstuk: 3a
  - number: '58.3'
    text: |-
      De Autoriteit Consument en Markt is onbevoegd tot het beslechten van een op grond van het eerste lid voorgelegd
      geschil indien de bij dat geschil betrokken partijen de Autoriteit Consument en Markt verzoeken het geschil niet
      langer te beslechten.
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel58
  - number: '60.1'
    text: |-
      De Autoriteit Consument en Markt beslist op een aanvraag als bedoeld in [artikel 58, eerste lid][ref1], binnen vier
      maanden na ontvangst van de aanvraag. [Artikel 4:15 van de Algemene wet bestuursrecht][ref2] is van overeenkomstige
      toepassing indien de Autoriteit Consument en Markt aan een andere partij dan de aanvrager om gegevens verzoekt met
      het oog op het te nemen besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '58'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '60.2'
    text: |-
      In uitzonderlijke gevallen kan de Autoriteit Consument en Markt de termijn, bedoeld in het eerste lid, met ten
      hoogste twee maanden verlengen. De Autoriteit Consument en Markt stelt de betrokken postvervoerbedrijven hiervan in
      kennis en geeft de termijn aan waarbinnen de Autoriteit Consument en Markt het geschil zal beslechten.
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel60
  - number: '60.3'
    text: |-
      De Autoriteit Consument en Markt kan in spoedeisende gevallen een voorlopig besluit nemen dat tussen de betrokken
      postvervoerbedrijven geldt tot het definitieve besluit van de Autoriteit Consument en Markt in werking treedt.
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel60
  - number: '61'
    text: |-
      Een postvervoerbedrijf volgt het door de Autoriteit Consument en Markt op grond van [artikel 60][ref1] genomen
      besluit op. De Autoriteit Consument en Markt kan daarbij een termijn stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel60
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '60'
        hoofdstuk: '8'
  - number: '62'
    text: |-
      De Autoriteit Consument en Markt doet mededeling in de Staatscourant van een besluit als bedoeld in
      [artikel 60][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel60
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '60'
        hoofdstuk: '8'
  - number: '66.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter implementatie van postrichtlijnen en
      liberalisatierichtlijnen regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel66
  - number: '66.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ter implementatie van een bindende
      overeenkomst tussen de Europese Unie en een derde land of een internationale organisatie die betrekking heeft op
      een onderwerp dat wordt bestreken door een postrichtlijn ofverordening.
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel66
  - number: '66.3'
    text: |-
      Bij ministeriële regeling kunnen voor een goede uitvoering van postverordeningen en gedelegeerde verordeningen
      regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel66
  - number: '66.4'
    text: Bij ministeriële regeling kunnen ter implementatie van gedelegeerde richtlijnen regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel66
  - number: '66.5'
    text: 'Bij de regels, bedoeld in het eerste tot en met vierde lid, kunnen:'
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel66
  - number: 66.5.a
    text: taken worden opgedragen en bevoegdheden worden verleend aan de Autoriteit Consument en Markt, en
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel66
  - number: 66.5.b
    text: |-
      voorschriften uit een postverordening of gedelegeerde verordening worden aangewezen waarop door de Autoriteit
      Consument en Markt aangewezen ambtenaren toezicht houden of die de Autoriteit Consument en Markt kan toepassen door
      besluiten te nemen.
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel66
  - number: '67'
    text: |-
      In bijzondere omstandigheden in verband met de handhaving van de internationale rechtsorde of met de internationale
      betrekkingen is Onze Minister bevoegd om in overeenstemming met Onze Minister van Buitenlandse Zaken aan een
      verlener van de universele postdienst en zo nodig aan een ander postvervoerbedrijf aanwijzingen te geven met
      betrekking tot het postvervoer van of naar gebieden buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel67
  - number: '68.1'
    text: |-
      Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kan, ingeval buitengewone omstandigheden dit
      noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President, voor het gehele land of een
      deel daarvan [artikel 70][ref3] in werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0025572#Artikel70
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0025572
        artikel: '70'
        hoofdstuk: '11'
  - number: '68.2'
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepaling.
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel68
  - number: '68.3'
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan wordt bij koninklijk besluit, op voordracht van
      Onze Minister-President, de bepaling die ingevolge het eerste lid in werking is gesteld, onverwijld buiten werking
      gesteld.
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel68
  - number: '68.4'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, wordt de bepaling die ingevolge het eerste lid
      in werking is gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel68
  - number: '68.5'
    text: |-
      Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel68
  - number: '68.6'
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het Staatsblad.
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel68
  - number: '69'
    text: |-
      In geval voor Nederland of een gedeelte daarvan, op grond van de [artikelen 7, eerste lid][ref1],
      of [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2], bepalingen uit
      de [Oorlogswet voor Nederland][ref3] in werking zijn gesteld, oefent Onze Minister de in
      [artikel 70, eerste lid][ref4], bedoelde bevoegdheid uit in overeenstemming met Onze Minister van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0007983
      [ref4]: https://wetten.overheid.nl/BWBR0025572#Artikel70
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0007983
      - id: ref4
        bwb_id: BWBR0025572
        artikel: '70'
        hoofdstuk: '11'
  - number: '70.1'
    text: |-
      Onze Minister is bevoegd een verlener van de universele postdienst en zo nodig een ander postvervoerbedrijf
      bindende aanwijzingen te geven met betrekking tot het postvervoer naar, van of in het gebied waarvoor een besluit
      als bedoeld in [artikel 68][ref1] van kracht is.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel68
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '68'
        hoofdstuk: '11'
  - number: '70.2'
    text: |-
      Onze Minister kan bij toepassing van het eerste lid afwijken van de verplichtingen die op grond van deze wet op een
      verlener van de universele postdienst rusten.
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel70
  - number: '70.3'
    text: |-
      Een verlener van de universele postdienst kan aan exploitanten van openbare vervoermiddelen de verplichting
      opleggen mee te werken aan het postvervoer van aan de verlener van de universele postdienst ter vervoer aangeboden
      poststukken. De verlener van de universele postdienst kan in verband hiermee aanwijzingen geven aan de exploitanten
      van openbare vervoermiddelen.
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel70
  - number: '70.4'
    text: |-
      Indien een verlener van de universele postdienst of een exploitant van openbare vervoermiddelen als gevolg van
      aanwijzingen gegeven op grond van het eerste onderscheidenlijk het derde lid, onevenredig financieel nadeel
      ondervindt, kent Onze Minister de betrokkene een naar billijkheid te bepalen vergoeding toe.
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel70
  - number: '71.1'
    text: |-
      Bij toepassing van [artikel 14 van de Wet buitengewone bevoegdheden burgerlijk gezag][ref1] is een verlener van
      de universele postdienst verplicht de krachtens het [eerste lid van genoemd artikel][ref2] aangewezen autoriteiten
      alle medewerking te verlenen, daaronder begrepen het uitvoeren van door die autoriteiten gegeven opdrachten.


      [ref1]: https://wetten.overheid.nl/BWBR0007982#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0007982#Artikel14
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0007982
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0007982
        artikel: '14'
  - number: '71.2'
    text: |-
      Bij toepassing van [artikel 31 van de Oorlogswet voor Nederland][ref1] is een verlener van de universele postdienst
      verplicht het militair gezag of een orgaan als bedoeld in het [tweede lid van genoemd artikel][ref2] alle
      medewerking te verlenen, daaronder begrepen het uitvoeren van door dat gezag of dat orgaan gegeven opdrachten.


      [ref1]: https://wetten.overheid.nl/BWBR0007983#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0007983#Artikel31
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0007983
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0007983
        artikel: '31'
  - number: '72'
    text: |-
      Onze Minister geeft aan een verlener van de universele postdienst voorschriften ten aanzien van de door deze
      te nemen organisatorische en personele maatregelen met betrekking tot de voorbereiding van de uitvoering van de
      universele postdienst in buitengewone omstandigheden als bedoeld in [artikel 68][ref1] en de door deze daarover aan
      Onze Minister te verstrekken informatie. Onze Minister bepaalt in die voorschriften welke kosten van de uitvoering
      redelijkerwijs ten laste van een verlener van de universele postdienst komen.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel68
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '68'
        hoofdstuk: '11'
  - number: '84'
    text: |-
      In afwijking van [artikel 15, eerste lid][ref1], wordt met ingang van het tijdstip van inwerkingtreding van
      [artikel 15, eerste lid][ref2], een bij besluit van Onze Minister te bepalen rechtspersoon aangewezen als verlener
      van de universele postdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0025572#Artikel15
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '15'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0025572
        artikel: '15'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '86'
    text: |-
      De [Machtigingswet Koninklijke PTT Nederland NV][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0004422
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0004422
  - number: '87'
    text: |-
      De [Postwet][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0004423
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0004423
  - number: '88.1'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel88
  - number: '88.2'
    text: |-
      De voordracht voor het koninklijk besluit bedoeld in het eerste lid wordt niet eerder gedaan dan vier weken nadat
      het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel88
  - number: '89.1'
    text: Artikel 8 vervalt op een bij koninklijk besluit te bepalen datum.
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel89
  - number: '89.2'
    text: |-
      De voordracht voor het koninklijk besluit bedoeld in het eerste lid wordt niet eerder gedaan dan vier weken nadat
      het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel89
  - number: '90'
    text: |-
      Deze wet wordt aangehaald als: Postwet met vermelding van het jaartal van het Staatsblad waarin zij zal worden
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0025572/2018-07-28#Artikel90
