  - number: '49.2'
    text: |-
      Onze Minister kan in geval van overtreding van een bindende aanwijzing als bedoeld in
      [artikel 47, tweede lid][ref1], alsmede overtreding van het bepaalde bij of krachtens [hoofdstuk 11][ref2] de
      overtreder per overtreding een bestuurlijke boete opleggen van ten hoogste € 450 000 of, indien dat meer is, 10%
      van de relevante netto-omzet van de onderneming in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0025572#Hoofdstuk11
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '47'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref2
        bwb_id: BWBR0025572
        hoofdstuk: '11'
  - number: '49.3'
    text: |-
      Bij de vaststelling van de hoogte van boete houdt het college respectievelijk Onze Minister in ieder geval rekening
      met de aard, de ernst en de duur van de overtreding.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel49
  - number: '49.4'
    text: De berekening van de netto-omzet, bedoeld in het eerste en het tweede lid,
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel49
  - number: 49.4.a
    text: |-
      geschiedt op de voet van [artikel 377, zesde lid, van Boek 2 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel377
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '377'
  - number: 49.4.b
    text: betreft het boekjaar voorafgaande aan de beschikking, bedoeld in het eerste en het tweede lid;
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel49
  - number: 49.4.c
    text: |-
      is beperkt tot de omzet die betrekking heeft op de postvervoerdiensten, bedoeld in
      [artikel 2, eerste lid, onderdeel d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel2
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: '50.1'
    text: |-
      Het college respectievelijk Onze Minister legt geen bestuurlijke boete op voor zover de overtreding niet aan de
      overtreder kan worden verweten.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel50
  - number: '50.2'
    text: |-
      De bevoegdheid tot het opleggen van een bestuurlijke boete vervalt vijf jaren nadat de overtreding heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel50
  - number: '50.3'
    text: |-
      Indien tegen de bestuurlijke boete bezwaar wordt gemaakt of beroep wordt ingesteld, wordt de vervaltermijn
      opgeschort tot onherroepelijk op het bezwaar onderscheidenlijk het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel50
  - number: '51.1'
    text: |-
      Indien het college respectievelijk Onze Minister vaststelt dat een overtreding als bedoeld in [artikel 49][ref1] is
      begaan, maakt hij daarvan een rapport op.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel49
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '49'
        hoofdstuk: '7'
        paragraaf: '7.5'
  - number: '51.2'
    text: 'Het rapport is gedagtekend en vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel51
  - number: 51.2.a
    text: de naam van de overtreder,
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel51
  - number: 51.2.b
    text: de overtreding alsmede het overtreden voorschrift, en
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel51
  - number: 51.2.c
    text: zo nodig een aanduiding van de plaats waar en het tijdstip waarop de overtreding is geconstateerd.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel51
  - number: '51.3'
    text: Het college respectievelijk Onze Minister zendt een afschrift van het rapport aan de overtreder.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel51
  - number: '52.1'
    text: |-
      Indien aan een handeling van het college respectievelijk Onze Minister redelijkerwijs de gevolgtrekking kan worden
      verbonden dat aan de overtreder een bestuurlijke boete zal worden opgelegd, is er geen verplichting meer van de
      zijde van die overtreder om ten behoeve van deze oplegging een verklaring omtrent de overtreding af te leggen.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel52
  - number: '52.2'
    text: De overtreder wordt hierop gewezen alvorens hem mondeling wordt gevraagd inlichtingen te verstrekken.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel52
  - number: '53.1'
    text: |-
      Het college respectievelijk Onze Minister stelt de overtreder desgevraagd in de gelegenheid de gegevens waarop het
      voornemen tot het opleggen van een bestuurlijke boete berust, in te zien en daarvan afschriften te vervaardigen.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel53
  - number: '53.2'
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] wordt de overtreder steeds in de
      gelegenheid gesteld zijn zienswijze naar voren te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
  - number: '53.3'
    text: |-
      Indien blijkt dat de verdediging van de overtreder dit redelijkerwijs vergt, draagt het college respectievelijk
      Onze Minister er zo veel mogelijk zorg voor dat de in het eerste lid bedoelde gegevens aan de overtreder worden
      medegedeeld in een voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel53
  - number: '54.1'
    text: |-
      Het college respectievelijk Onze Minister beslist omtrent het opleggen van een bestuurlijke boete binnen dertien
      weken na de dagtekening van het rapport.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel54
  - number: '54.2'
    text: |-
      Mandaat tot het opleggen van een bestuurlijke boete wordt niet verleend aan degene die van de overtreding een
      rapport heeft opgemaakt.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel54
  - number: '54.3'
    text: 'In de beschikking tot oplegging van een last onder dwangsom of een bestuurlijke boete wordt in ieder geval vermeld:'
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel54
  - number: 54.3.a
    text: 'indien een last onder dwangsom wordt opgelegd:'
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel54
  - number: 54.3.a.1°
    text: de naam van de overtreder, en
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel54
  - number: 54.3.a.2°
    text: de inhoud van de last en de termijn waarvoor deze geldt;
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel54
  - number: 54.3.b
    text: 'indien een bestuurlijke boete wordt opgelegd:'
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel54
  - number: 54.3.b.1°
    text: de naam van de overtreder, en
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel54
  - number: 54.3.b.2°
    text: het bedrag van de boete;
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel54
  - number: 54.3.c
    text: |-
      de overtreding ter zake waarvan de last of de bestuurlijke boete wordt opgelegd alsmede het overtreden wettelijk
      voorschrift.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel54
  - number: '55.1'
    text: |-
      Een beschikking als bedoeld in [artikel 54][ref1] wordt, nadat zij bekend is gemaakt, ter inzage gelegd bij het
      college respectievelijk Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel54
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '54'
        hoofdstuk: '7'
        paragraaf: '7.5'
  - number: '55.2'
    text: Van de beschikking wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel55
  - number: '56.1'
    text: |-
      Een bestuurlijke boete wordt betaald binnen zes weken nadat de beschikking waarbij de boete is opgelegd, in werking
      is getreden.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel56
  - number: '56.2'
    text: |-
      De boete wordt vermeerderd met de wettelijke rente, te rekenen zes weken vanaf de datum waarop de beschikking
      bekend is gemaakt.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel56
  - number: '56.3'
    text: |-
      Indien niet is betaald binnen de in het eerste lid genoemde termijn, wordt degene die de boete is verschuldigd
      schriftelijk bevolen binnen twee weken alsnog het bedrag van de boete, verhoogd met de krachtens het tweede lid
      verschuldigde rente en de kosten van de aanmaning, te betalen.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel56
  - number: '56.4'
    text: |-
      De werking van een beschikking als bedoeld in het eerste lid wordt opgeschort totdat de beroepstermijn is
      verstreken of, indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel56
  - number: '57.1'
    text: |-
      Bij gebreke van betaling binnen de in [artikel 56, derde lid][ref1], bedoelde termijn van twee weken kan het
      college respectievelijk Onze Minister de verschuldigde boete, verhoogd met de op de aanmaning en invordering
      betrekking hebbende kosten, invorderen bij dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel56
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '56'
        hoofdstuk: '7'
        paragraaf: '7.5'
  - number: '57.2'
    text: |-
      Het dwangbevel wordt op kosten van degene die de boete is verschuldigd bij deurwaardersexploit betekend en levert
      een executoriale titel op in de zin van [Boek 2 van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '57.3'
    text: Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van de staat.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel57
  - number: '57.4'
    text: |-
      Het verzet schorst de tenuitvoerlegging. Op verzoek van de staat kan de rechter de schorsing van de
      tenuitvoerlegging opheffen.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel57
  - number: '58.1'
    text: |-
      Indien tussen postvervoerbedrijven, tussen een postvervoerbedrijf en iemand die postbussen exploiteert, tussen
      een postvervoerbedrijf en iemand die een systeem met adresgegevens als bedoeld in [artikel 11][ref1] exploiteert
      of beheert of tussen een postvervoerbedrijf en iemand die een postcodesysteem exploiteert of beheert een geschil
      is ontstaan inzake de nakoming van de verplichtingen bedoeld in [hoofdstuk 3][ref2], beslecht het college op
      aanvraag van een bij dat geschil betrokken partij het geschil voor zover naar het oordeel van het college verdere
      onderhandelingen redelijkerwijs niet meer zullen leiden tot overeenstemming.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0025572#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '11'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0025572
        hoofdstuk: '3'
  - number: '58.2'
    text: |-
      Het college is onbevoegd tot het beslechten van een op grond van het eerste lid voorgelegd geschil indien de bij
      dat geschil betrokken partijen het college verzoeken het geschil niet langer te beslechten.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel58
  - number: '59.1'
    text: |-
      Op vordering van het college verstrekken de bij een geschil betrokken partijen binnen een door het college te
      bepalen redelijke termijn aan het college alle gegevens die relevant zijn voor de beoordeling van het geschil.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel59
  - number: '59.2'
    text: |-
      De bij het geschil betrokken partijen zijn verplicht binnen de door het college gestelde redelijke termijn alle
      medewerking te verlenen die deze redelijkerwijs kan vorderen ten behoeve van de beoordeling van het geschil.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel59
  - number: '60.1'
    text: |-
      Het college beslist op een aanvraag als bedoeld in [artikel 58, eerste lid][ref1], binnen zeventien weken na
      ontvangst van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel58
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '58'
        hoofdstuk: '8'
  - number: '60.2'
    text: |-
      In uitzonderlijke gevallen kan het college de termijn, bedoeld in het eerste lid, met ten hoogste acht weken
      verlengen. Het college stelt de betrokken postvervoerbedrijven hiervan in kennis en geeft de termijn aan waarbinnen
      het college het geschil zal beslechten.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel60
  - number: '60.3'
    text: |-
      Het college kan in spoedeisende gevallen een voorlopig besluit nemen dat tussen de betrokken postvervoerbedrijven
      geldt tot het definitieve besluit van het college in werking treedt.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel60
  - number: '61'
    text: |-
      Een postvervoerbedrijf volgt het door het college op grond van [artikel 60][ref1] genomen besluit op. Het college
      kan daarbij een termijn stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel60
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '60'
        hoofdstuk: '8'
  - number: '62'
    text: |-
      Het college doet mededeling in de Staatscourant van een besluit als bedoeld in [artikel 60][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel60
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '60'
        hoofdstuk: '8'
  - number: '63.1'
    text: |-
      Indien een partij door het college in het gelijk wordt gesteld en hij voor het beslechten van een geschil een
      vergoeding aan het college verschuldigd is, kan het college bepalen dat die vergoeding door de bij het geschil
      betrokken andere partij wordt vergoed.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel63
  - number: '63.2'
    text: |-
      Een bij een geschil betrokken partij volgt de door het college op grond van het eerste lid gegeven voorschriften
      op. Het college kan daarbij termijnen stellen.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel63
  - number: '64.1'
    text: |-
      Postvervoerbedrijven zijn ter dekking van de kosten die verband houden met de werkzaamheden van het college ter
      uitvoering van deze wet, jaarlijks een vergoeding verschuldigd.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel64
  - number: '64.2'
    text: Van de vergoeding zijn uitgezonderd de kosten verbonden aan de behandeling van bezwaar- en beroepschriften.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel64
  - number: '64.3'
    text: |-
      Van de verplichting, bedoeld in het eerste lid, zijn uitgezonderd bedrijven die voldoen aan een bij algemene
      maatregel van bestuur vast te stellen criterium met betrekking tot de relevante omzet van een postvervoerbedrijf
      in Nederland.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel64
  - number: '65.1'
    text: |-
      Onze Minister stelt de hoogte van de vergoeding, bedoeld in [artikel 64, eerste lid][ref1], vast.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel64
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '64'
        hoofdstuk: '9'
  - number: '65.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels nadere gesteld over de vergoeding, bedoeld in
      [artikel 64][ref1]. Deze regels kunnen mede betrekking hebben op de wijze waarop de vergoeding wordt vastgesteld,
      geheven en ingevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel64
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '64'
        hoofdstuk: '9'
  - number: '66.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter implementatie van postrichtlijnen en
      liberalisatierichtlijnen regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel66
  - number: '66.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ter implementatie van een bindende
      overeenkomst tussen de Europese Gemeenschap en een derde land of een internationale organisatie die betrekking
      heeft op een onderwerp dat wordt bestreken door een postrichtlijn ofverordening.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel66
  - number: '66.3'
    text: |-
      Bij ministeriële regeling kunnen voor een goede uitvoering van postverordeningen en gedelegeerde verordeningen
      regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel66
  - number: '66.4'
    text: Bij ministeriële regeling kunnen ter implementatie van gedelegeerde richtlijnen regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel66
  - number: '66.5'
    text: 'Bij de regels, bedoeld in het eerste tot en met vierde lid, kunnen:'
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel66
  - number: 66.5.a
    text: taken worden opgedragen en bevoegdheden worden verleend aan het college, en
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel66
  - number: 66.5.b
    text: |-
      voorschriften uit een postverordening of gedelegeerde verordening worden aangewezen waarop door het college
      aangewezen ambtenaren toezicht houden of die het college kan toepassen door besluiten te nemen.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel66
  - number: '67'
    text: |-
      In bijzondere omstandigheden in verband met de handhaving van de internationale rechtsorde of met de internationale
      betrekkingen is Onze Minister bevoegd om in overeenstemming met Onze Minister van Buitenlandse Zaken aan een
      verlener van de universele postdienst en zo nodig aan een ander postvervoerbedrijf aanwijzingen te geven met
      betrekking tot het postvervoer van of naar gebieden buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel67
  - number: '68.1'
    text: |-
      Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kan, ingeval buitengewone omstandigheden dit
      noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President, voor het gehele land of een
      deel daarvan [artikel 70][ref3] in werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0025572#Artikel70
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0025572
        artikel: '70'
        hoofdstuk: '11'
  - number: '68.2'
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepaling.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel68
  - number: '68.3'
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan wordt bij koninklijk besluit, op voordracht van
      Onze Minister-President, de bepaling die ingevolge het eerste lid in werking is gesteld, onverwijld buiten werking
      gesteld.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel68
  - number: '68.4'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, wordt de bepaling die ingevolge het eerste lid
      in werking is gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel68
  - number: '68.5'
    text: |-
      Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel68
  - number: '68.6'
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het Staatsblad.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel68
  - number: '69'
    text: |-
      In geval voor Nederland of een gedeelte daarvan, op grond van de [artikelen 7, eerste lid][ref1],
      of [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2], bepalingen uit
      de [Oorlogswet voor Nederland][ref3] in werking zijn gesteld, oefent Onze Minister de in
      [artikel 70, eerste lid][ref4], bedoelde bevoegdheid uit in overeenstemming met Onze Minister van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0007983
      [ref4]: https://wetten.overheid.nl/BWBR0025572#Artikel70
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0007983
      - id: ref4
        bwb_id: BWBR0025572
        artikel: '70'
        hoofdstuk: '11'
  - number: '71.1'
    text: |-
      Bij toepassing van [artikel 14 van de Wet buitengewone bevoegdheden burgerlijk gezag][ref1] is een verlener van
      de universele postdienst verplicht de krachtens het [eerste lid van genoemd artikel][ref2] aangewezen autoriteiten
      alle medewerking te verlenen, daaronder begrepen het uitvoeren van door die autoriteiten gegeven opdrachten.


      [ref1]: https://wetten.overheid.nl/BWBR0007982#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0007982#Artikel14
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0007982
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0007982
        artikel: '14'
  - number: '71.2'
    text: |-
      Bij toepassing van [artikel 31 van de Oorlogswet voor Nederland][ref1] is een verlener van de universele postdienst
      verplicht het militair gezag of een orgaan als bedoeld in het [tweede lid van genoemd artikel][ref2] alle
      medewerking te verlenen, daaronder begrepen het uitvoeren van door dat gezag of dat orgaan gegeven opdrachten.


      [ref1]: https://wetten.overheid.nl/BWBR0007983#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0007983#Artikel31
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0007983
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0007983
        artikel: '31'
  - number: '72'
    text: |-
      Onze Minister geeft aan een verlener van de universele postdienst voorschriften ten aanzien van de door deze
      te nemen organisatorische en personele maatregelen met betrekking tot de voorbereiding van de uitvoering van de
      universele postdienst in buitengewone omstandigheden als bedoeld in [artikel 68][ref1] en de door deze daarover aan
      Onze Minister te verstrekken informatie. Onze Minister bepaalt in die voorschriften welke kosten van de uitvoering
      redelijkerwijs ten laste van een verlener van de universele postdienst komen.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel68
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '68'
        hoofdstuk: '11'
  - number: '73'
    text: |-
      In afwijking van [artikel 8:7 van de Algemene wet bestuursrecht][ref1] is voor beroep tegen besluiten op grond van
      deze wet de rechtbank te Rotterdam bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '84'
    text: |-
      In afwijking van [artikel 15, eerste lid][ref1], wordt met ingang van het tijdstip van inwerkingtreding van
      [artikel 15, eerste lid][ref2], een bij besluit van Onze Minister te bepalen rechtspersoon aangewezen als verlener
      van de universele postdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0025572#Artikel15
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '15'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0025572
        artikel: '15'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '85'
    text: |-
      Onze Minister zendt binnen vier jaar na de inwerkingtreding van deze wet en vervolgens telkens na vier jaar aan de
      Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel85
  - number: '86'
    text: |-
      De [Machtigingswet Koninklijke PTT Nederland NV][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0004422
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0004422
  - number: '87'
    text: |-
      De [Postwet][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0004423
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0004423
  - number: '88.1'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel88
  - number: '88.2'
    text: |-
      De voordracht voor het koninklijk besluit bedoeld in het eerste lid wordt niet eerder gedaan dan vier weken nadat
      het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel88
  - number: '90'
    text: |-
      Deze wet wordt aangehaald als: Postwet met vermelding van het jaartal van het Staatsblad waarin zij zal worden
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0025572/2009-04-01#Artikel90
