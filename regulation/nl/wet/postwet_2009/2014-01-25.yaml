  - number: '47.3'
    text: Een beschikking als bedoeld in het eerste of tweede lid, wordt gepubliceerd in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel47
  - number: '48.1'
    text: |-
      De Autoriteit Consument en Markt is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van
      de bij of krachtens deze wet gestelde verplichtingen, met uitzondering van de verplichtingen bij of krachtens
      [hoofdstuk 11][ref1].


