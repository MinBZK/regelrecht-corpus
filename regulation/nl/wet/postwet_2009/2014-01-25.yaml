  - number: '49.2'
    text: |-
      Onze Minister kan in geval van overtreding van een bindende aanwijzing als bedoeld in
      [artikel 47, tweede lid][ref1], alsmede overtreding van het bepaalde bij of krachtens [hoofdstuk 11][ref2] de
      overtreder per overtreding een bestuurlijke boete opleggen van ten hoogste € 450 000 of, indien dat meer is, 10%
      van de relevante netto-omzet van de onderneming in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0025572#Hoofdstuk11
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel49
