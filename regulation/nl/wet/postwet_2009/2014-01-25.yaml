---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: postwet_2009
regulatory_layer: WET
publication_date: '2021-10-27'
valid_from: '2014-01-25'
bwb_id: BWBR0025572
url: https://wetten.overheid.nl/BWBR0025572/2014-01-25
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, rekening houdend met richtlijn 97/67/EG van het Europees Parlement
    en de Raad van de Europese Unie van 15 december 1997 betreffende gemeenschappelijke regels voor de ontwikkeling van
    de interne markt voor postdiensten in de Gemeenschap en de verbetering van de kwaliteit van de dienst (PbEG 1998 L
    15), wenselijk is de bepalingen met betrekking tot het postvervoer aan te passen aan een volledig geliberaliseerde
    markt voor postdiensten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel1
  - number: 1.1.a
    text: '*Onze Minister:* Onze Minister van Economische Zaken;'
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel1
  - number: 1.1.b
    text: |-
      *Autoriteit Consument en Markt:* de Autoriteit Consument en Markt, genoemd in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel2
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: '2'
  - number: 1.1.d
    text: |-
      *akten van de Wereldpostunie:* de op 10 juli 1964 te Wenen tot stand gekomen Constitutie van de Wereldpostunie
      (Trb. 1965, 170) en de daarbij behorende voor Nederland bindende verdragen, reglementen en protocollen (Trb. 1965,
      170 en Trb. 2002, 205);
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel1
  - number: 1.1.e
    text: |-
      *bestuurlijke boete:* de bestraffende sanctie, inhoudende een onvoorwaardelijke verplichting tot betaling van een
      geldsom;
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel1
  - number: 1.1.f
    text: '*overtreding:* een gedraging die in strijd is met het bepaalde bij of krachtens enig wettelijk voorschrift;'
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel1
  - number: 1.1.g
    text: '*overtreder:* degene die de overtreding pleegt of medepleegt.'
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel1
  - number: '1.2'
    text: |-
      Bij besluit van Onze Minister kunnen de vindplaatsen, bedoeld in het eerste lid, onderdeel d, worden gewijzigd. Van
      dit besluit wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel1
  - number: '2.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel2
  - number: 2.1.a
    text: '*brief:* de op een fysieke drager aangebrachte geadresseerde schriftelijke mededelingen;'
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel2
  - number: 2.1.b
    text: '*poststuk:* een brief of een ander bij algemene maatregel van bestuur aangewezen geadresseerd stuk;'
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel2
  - number: 2.1.c
    text: '*postvervoer:* het geheel van handelingen dat bedrijfsmatig wordt verricht teneinde poststukken af te leveren;'
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel2
  - number: 2.1.d
    text: '*postvervoerdienst:* een of meer van de handelingen, bedoeld in onderdeel c;'
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel2
  - number: 2.1.e
    text: '*postvervoerbedrijf:* eenieder die postvervoerdiensten aanbiedt;'
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel2
  - number: 2.1.f
    text: |-
      *universele postdienst:* de universele postdienst, bedoeld in de [artikelen 16][ref1] en [17][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0025572#Artikel17
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '16'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0025572
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 2.1.g
    text: |-
      *verlener van de universele postdienst:* een postvervoerbedrijf dat ingevolge [artikel 15, eerste lid][ref1], is
      aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel15
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '15'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 2.1.h
    text: |-
      *postbus:* een in een gebouw aanwezige afgesloten ruimte die bestemd is voor de aflevering van de voor de gebruiker
      daarvan bestemde poststukken;
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel2
  - number: 2.1.i
    text: '*afzender:* eenieder die een poststuk ten vervoer aanbiedt aan een postvervoerbedrijf;'
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel2
  - number: 2.1.j
    text: '*postcodesysteem:* een algemeen gebruikt adrescodesysteem voor een efficiënte postbezorging;'
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel2
  - number: 2.1.k
    text: |-
      *postbezorger:* een ieder die in opdracht van een postvervoerbedrijf of met instemming van een postvervoerbedrijf
      voor dat postvervoerbedrijf brieven, geadresseerde tijdschriften en geadresseerde dagbladen op afzonderlijke
      adressen aflevert;
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel2
  - number: 2.1.l
    text: '*postvervoernetwerk:* netwerk waarmee postvervoer wordt verricht;'
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel2
  - number: 2.1.m
    text: |-
      *bijbehorende faciliteiten:* bij een postvervoernetwerk of een postvervoerdienst behorende diensten, fysieke
      infrastructuren en andere faciliteiten of elementen die het aanbieden van diensten via dat netwerk of die dienst
      mogelijk maken of ondersteunen;
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel2
  - number: 2.1.n
    text: |-
      *toegang:* het aan een ander postvervoerbedrijf beschikbaar stellen van onderdelen van het postvervoernetwerk
      en bijbehorende faciliteiten onder voorwaarden ten behoeve van het aanbieden van postvervoerdiensten door dat
      postvervoerbedrijf;
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel2
  - number: 2.1.o
    text: |-
      *eindgebruiker:* natuurlijke persoon of rechtspersoon die van een postvervoerdienst gebruik maakt of wil gaan maken
      en die niet zelf postvervoerdiensten aanbiedt;
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel2
  - number: 2.1.p
    text: |-
      *rouwbrief:* brief als bedoeld in [artikel 16, eerste lid, onderdeel a, of tweede lid, onderdeel a][ref1],
      waarmee wordt kennis gegeven van het overlijden van een natuurlijke persoon, voor zover die brief wordt aangeboden
      overeenkomstig de door een verlener van de universele postdienst gepubliceerde voorwaarden;


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel16
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '16'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 2.1.q
    text: |-
      *medische brief:* brief als bedoeld in [artikel 16, eerste lid, onderdeel a, of tweede lid, onderdeel a][ref1], met
      een diagnostisch monster van menselijk celmateriaal, voor zover die brief wordt aangeboden overeenkomstig de door
      een verlener van de universele postdienst gepubliceerde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel16
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '16'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '2.2'
    text: 'In afwijking van het eerste lid, onderdeel c, wordt onder postvervoer niet verstaan:'
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel2
  - number: 2.2.a
    text: |-
      het vervoer van afzonderlijk geregistreerde exprespost waarover tussen afzender en vervoerbedrijf afzonderlijke
      overeenkomsten zijn gesloten over het tijdvak of tijdstip van bestellen, over de leveringszekerheid en over de
      aansprakelijkheid;
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel2
  - number: 2.2.b
    text: |-
      het vervoer, dat wordt verricht onder verantwoordelijkheid van de afzender, van poststukken die kennelijk bestemd
      zijn om op een met een postvervoerbedrijf afgesproken plaats te worden overgedragen aan dat postvervoerbedrijf,
      teneinde de poststukken door dat postvervoerbedrijf op de afzonderlijke adressen te laten bezorgen.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel2
  - number: '3.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel3
  - number: 3.1.a
    text: |-
      *postrichtlijn of -verordening:* een richtlijn, onderscheidenlijk verordening, van het Europees Parlement en de
      Raad van de Europese Unie die geheel of gedeeltelijk berust op de artikelen 47, 52, 55 of 95 van het Verdrag tot
      oprichting van de Europese Gemeenschap, betrekking heeft op de postsector en regels stelt over de economische
      activiteiten in die sector, de belangen van afnemers, geschilbeslechting, de infrastructuur, de interne markt,
      de kwaliteit, de handel, de mededinging, de universele dienstverlening, technische eisen of het verschaffen van
      informatie;
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel3
  - number: 3.1.b
    text: |-
      *gedelegeerde richtlijn, verordening of beschikking:* een richtlijn, verordening, onderscheidenlijk beschikking,
      van de Commissie van de Europese Gemeenschappen die berust op een postrichtlijn of -verordening;
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel3
  - number: 3.1.c
    text: |-
      *liberalisatierichtlijn:* een richtlijn van de Commissie van de Europese Gemeenschappen die berust op artikel
      86, derde lid, van het Verdrag tot oprichting van de Europese Gemeenschap en regels stelt met betrekking tot de
      postsector.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel3
  - number: '3.2'
    text: |-
      In deze wet wordt onder «wet» mede verstaan: een krachtens [artikel 66, vijfde lid, onderdeel b][ref1], aangewezen
      voorschrift uit een postverordening of een gedelegeerde verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel66
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '66'
        hoofdstuk: '10'
  - number: '4'
    text: |-
      Een postvervoerbedrijf zorgt ervoor dat bij de uitvoering van postvervoerdiensten het grondwettelijk briefgeheim
      niet wordt geschonden.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel4
  - number: '5'
    text: |-
      Gesloten poststukken die in het kader van postvervoerdiensten als onbestelbaar zijn aan te merken en niet aan de
      afzender kunnen worden teruggegeven, kunnen slechts worden geopend op last van de kantonrechter te ’s-Gravenhage,
      zulks uitsluitend ter opsporing van de voor teruggave of aflevering nodige gegevens omtrent de afzender of de
      geadresseerde.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel5
  - number: '6'
    text: |-
      Beslag op poststukken welke in het kader van postvervoerdiensten aan een postvervoerbedrijf zijn toevertrouwd, is
      slechts toegelaten in de gevallen dat de wet een zodanig beslag uitdrukkelijk regelt.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel6
  - number: '7.1'
    text: |-
      Een postvervoerbedrijf voorziet in een procedure voor de behandeling van klachten van afzenders en ontvangers over
      de door hem uitgevoerde postvervoerdiensten.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel7
  - number: '7.2'
    text: Bij ministeriële regeling kunnen regels worden gesteld over de procedure, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel7
  - number: '8'
    text: |-
      Een postvervoerbedrijf heeft met een bij algemene maatregel van bestuur te bepalen minimumpercentage van de
      postbezorgers die voor hem postvervoer verrichten een arbeidsovereenkomst. Bij algemene maatregel van bestuur wordt
      de datum bepaald met ingang waarvan een postvervoerbedrijf aan een minimumpercentage moet voldoen. De toepassing
      van een minimumpercentage kan daarbij worden beperkt tot bepaalde categorieën postvervoerbedrijven of bepaalde
      omstandigheden.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel8
  - number: '9.1'
    text: |-
      Indien een postvervoerbedrijf, dat beschikt over een netwerk waarmee poststukken op ten minste vijf dagen
      per week kunnen worden bezorgd op alle adressen in Nederland, met gebruikmaking van dat netwerk postvervoer
      verricht tegen speciale voorwaarden en tarieven, verricht hij dit postvervoer voor andere postvervoerbedrijven
      tegen non-discriminatoire en transparante voorwaarden en tarieven ten opzichte van andere afzenders en andere
      postvervoerbedrijven. Onder andere postvervoerbedrijven vallen ook groepsmaatschappijen die in een groep verbonden
      zijn in de zin van [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] met het postvervoerbedrijf dat
      beschikt over een netwerk als bedoeld in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: '9.2'
    text: |-
      Indien blijkt dat op de nationale postmarkt of een onderdeel daarvan daadwerkelijke concurrentie ontbreekt, kunnen
      bij algemene maatregel van bestuur nadere regels worden gesteld met betrekking tot de voorwaarden en tarieven
      die worden gehanteerd bij het verrichten van postvervoerdiensten tegen speciale voorwaarden en tarieven door
      postvervoerbedrijven die over een netwerk beschikken als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel9
  - number: '9.3'
    text: |-
      Een postvervoerbedrijf als bedoeld in het eerste lid zorgt ervoor dat de geldende speciale voorwaarden en tarieven
      voor eenieder kenbaar zijn.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel9
  - number: '9.4'
    text: |-
      Bij ministeriële regeling kunnen in aanvulling op het eerste lid regels worden gesteld over het verlenen van
      toegang tot het in dat lid bedoelde netwerk. Deze regels kunnen inhouden dat:
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel9
  - number: 9.4.a
    text: |-
      een postvervoerbedrijf, dat beschikt over een dergelijk netwerk, op verzoek van bij die regeling aan te wijzen
      categorieën derden toegang verleent tot dat netwerk tegen redelijke, transparante en non-discriminatoire tarieven
      en voorwaarden, voor zover een bedrijfsmatige en op continuïteit gerichte exploitatie van het netwerk dit toelaat;
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel9
  - number: 9.4.b
    text: |-
      het in onderdeel a bedoelde postvervoerbedrijf er zorg voor draagt dat de geldende voorwaarden en tarieven als
      bedoeld in dat onderdeel voor eenieder kenbaar zijn.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel9
  - number: '9.5'
    text: |-
      De Autoriteit Consument en Markt brengt uiterlijk een jaar na de inwerkingtreding van dit artikel aan Onze Minister
      verslag uit over de doeltreffendheid en effecten in de praktijk van het eerste lid en verstrekt daarbij advies over
      de wenselijkheid om toepassing te geven aan het vierde lid. Onze Minister zendt het verslag, vergezeld van zijn
      bevindingen, aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel9
  - number: '10.1'
    text: |-
      Een ieder die een postcodesysteem beheert of exploiteert is verplicht binnen redelijke termijn en tegen
      kostengeoriënteerde tarieven een ieder uit dit systeem combinaties van adressen en postcodes ter beschikking te
      stellen die voor postbezorging nodig zijn.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel10
  - number: '10.2'
    text: |-
      Een ieder die een postcodesysteem exploiteert of beheert, is verplicht een jaar voor de beëindiging van dit
      systeem, deze beëindiging aan te kondigen.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel10
  - number: '11'
    text: |-
      Een ieder die een systeem met adresgegevens, betreffende de verhuisgegevens van een geadresseerde of de gegevens
      over het tijdelijk stopzetten van de postbezorging op verzoek van de geadresseerde, exploiteert of beheert
      is verplicht binnen redelijke termijn en tegen redelijke, objectief gerechtvaardigde, transparante en non-
      discriminatoire voorwaarden en tarieven de voor doelmatige postbezorging benodigde gegevens uit dit systeem aan
      postvervoerbedrijven te verstrekken.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel11
  - number: '12.1'
    text: |-
      Indien een poststuk terecht komt in de poststroom van een ander postvervoerbedrijf dan het postvervoerbedrijf
      waaraan het poststuk door de afzender is aangeboden, geschiedt de afhandeling binnen redelijke termijn en tegen
      redelijke, objectief gerechtvaardigde, transparante en non-discriminatoire voorwaarden en tarieven.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel12
  - number: '12.2'
    text: Postvervoerbedrijven maken afspraken voor de afhandeling van gevallen als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel12
  - number: '12.3'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel12
  - number: '13'
    text: |-
      Een ieder die postbussen exploiteert, is verplicht aan postvervoerbedrijven toegang te verlenen tot zijn postbussen
      tegen redelijke, objectief gerechtvaardigde, transparante en non-discriminatoire voorwaarden en tarieven.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13
  - number: 13a
    text: |-
      Onder een postvervoerbedrijf dat beschikt over aanmerkelijke marktmacht wordt verstaan een postvervoerbedrijf
      dat alleen of tezamen met andere ondernemingen beschikt over een economische kracht op een in overeenstemming met
      de beginselen van het algemene Europese mededingingsrecht afgebakende markt voor postvervoerdiensten die het in
      staat stelt zich op deze markt in belangrijke mate onafhankelijk van zijn concurrenten, klanten en uiteindelijk
      consumenten te gedragen.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13a
  - number: 13b.1
    text: |-
      Indien de Autoriteit Consument en Markt op basis van een marktanalyse van oordeel is dat een postvervoerbedrijf
      beschikt over aanmerkelijke marktmacht kan zij dat postvervoerbedrijf een verplichting als bedoeld in de
      [artikelen 13e tot en met 13k][ref1] opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel13e
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: 13e
        hoofdstuk: 3a
  - number: 13b.2
    text: |-
      De Autoriteit Consument en Markt kan de verplichtingen, bedoeld in de [artikelen 13e tot en met 13k][ref1], niet
      opleggen aan de verlener van de universele postdienst met betrekking tot postvervoerdiensten die bij of krachtens
      de [artikelen 16][ref2] en [17][ref3] deel uitmaken van de universele postdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel13e
      [ref2]: https://wetten.overheid.nl/BWBR0025572#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0025572#Artikel17
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: 13e
        hoofdstuk: 3a
      - id: ref2
        bwb_id: BWBR0025572
        artikel: '16'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref3
        bwb_id: BWBR0025572
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 13b.3
    text: |-
      De Autoriteit Consument en Markt neemt bij het opleggen van de verplichtingen, bedoeld in de
      [artikelen 13e tot en met 13k][ref1] de eisen van proportionaliteit in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel13e
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: 13e
        hoofdstuk: 3a
  - number: 13c.1
    text: |-
      Uiterlijk binnen drie jaar nadat een besluit als bedoeld in [artikel 13b, eerste lid][ref1], in werking is getreden
      of in stand is gehouden, besluit de Autoriteit Consument en Markt op basis van een marktanalyse of de verplichting
      in stand blijft, gewijzigd wordt of wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel13b
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13c
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: 13b
        hoofdstuk: 3a
  - number: 13c.2
    text: |-
      De Autoriteit Consument en Markt trekt de verplichting, bedoeld in de [artikelen 13e tot en met 13k][ref1] in
      ieder geval in, indien de Autoriteit Consument en Markt van oordeel is dat een postvervoerbedrijf niet meer over
      aanmerkelijke marktmacht beschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel13e
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13c
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: 13e
        hoofdstuk: 3a
  - number: 13d.1
    text: |-
      Op de voorbereiding van een besluit als bedoeld in [artikel 13b, eerste li][ref1]d, of [13c][ref2] is de
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel13b
      [ref2]: https://wetten.overheid.nl/BWBR0025572#Artikel13c
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13d
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: 13b
        hoofdstuk: 3a
      - id: ref2
        bwb_id: BWBR0025572
        artikel: 13c
        hoofdstuk: 3a
      - id: ref3
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 13d.2
    text: |-
      In afwijking van het eerste lid kan de Autoriteit Consument en Markt besluiten om de in het eerste lid bedoelde
      procedure niet toe te passen:
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13d
  - number: 13d.2.a
    text: indien het besluit geen aanzienlijke gevolgen heeft voor de desbetreffende markt,
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13d
  - number: 13d.2.b
    text: |-
      in uitzonderlijke omstandigheden indien de vereiste spoed zich verzet tegen de toepassing van de procedure,
      teneinde de concurrentie te waarborgen of de belangen van de gebruikers te beschermen.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13d
  - number: 13d.3
    text: |-
      Een besluit als bedoeld in [artikel 13b][ref1] dat wordt genomen met toepassing van onderdeel b geldt voor een
      periode van maximaal 26 weken.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel13b
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13d
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: 13b
        hoofdstuk: 3a
  - number: 13d.4
    text: |-
      Indien het een besluit op aanvraag betreft, is [artikel 3.18, derde lid, van de Algemene wet bestuursrecht][ref1]
      niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13d
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 13d.5
    text: |-
      Van een besluit als bedoeld in de[ artikelen 13b][ref1] of [13c][ref2] of het tweede lid wordt door
      de Autoriteit Consument en Markt mededeling gedaan in de Staatscourant. Van gegevens als bedoeld in
      [artikel 10, eerste lid, onderdeel c, van de Wet openbaarheid van bestuur][ref3] wordt geen mededeling gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel13b
      [ref2]: https://wetten.overheid.nl/BWBR0025572#Artikel13c
      [ref3]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13d
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: 13b
        hoofdstuk: 3a
      - id: ref2
        bwb_id: BWBR0025572
        artikel: 13c
        hoofdstuk: 3a
      - id: ref3
        bwb_id: BWBR0005252
        artikel: '10'
  - number: 13e.1
    text: |-
      De Autoriteit Consument en Markt kan de verplichting opleggen om te voldoen aan redelijke verzoeken tot door haar
      te bepalen vormen van toegang.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13e
  - number: 13e.2
    text: |-
      Indien de Autoriteit Consument en Markt de verplichting, bedoeld in het eerste lid, oplegt, verleent het
      desbetreffende postvervoerbedrijf toegang onder gelijke omstandigheden onder gelijke voorwaarden, met dien
      verstande dat het postvervoerbedrijf in ieder geval gelijke voorwaarden toepast als die welke onder gelijke
      omstandigheden gelden voor haarzelf, haar dochterondernemingen of haar partnerondernemingen.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13e
  - number: 13e.3
    text: |-
      De Autoriteit Consument en Markt kan aan de verplichting, bedoeld in het eerste lid, voorschriften verbinden
      betreffende billijkheid, redelijkheid en opportuniteit.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13e
  - number: 13e.4
    text: |-
      Indien dit nodig is om toegang mogelijk te maken, kan de Autoriteit Consument en Markt technische of operationele
      voorschriften vaststellen die een postvervoerbedrijf dat toegang moet verlenen of een postvervoerbedrijf dat
      toegang heeft gekregen, in acht neemt.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13e
  - number: 13f.1
    text: |-
      De Autoriteit Consument en Markt kan voor door haar te bepalen vormen van toegang een verplichting opleggen
      betreffende de hiervoor te berekenen tarieven of de kostentoerekening indien naar het oordeel van de Autoriteit
      Consument en Markt uit een marktanalyse blijkt dat het betrokken postvervoerbedrijf doordat het beschikt over
      aanmerkelijke marktmacht de tarieven op een buitensporig hoog peil kan handhaven of de marges kan uithollen.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13f
  - number: 13f.2
    text: |-
      Een verplichting als bedoeld in het eerste lid kan inhouden dat voor toegang een kostengeoriënteerd
      tarief moet worden gerekend of dat een door de Autoriteit Consument en Markt te bepalen of goed te keuren
      kostentoerekeningsysteem moet worden gehanteerd.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13f
  - number: 13f.3
    text: |-
      Indien de Autoriteit Consument en Markt een postvervoerbedrijf heeft verplicht om voor toegang een
      kostengeoriënteerd tarief te rekenen, toont het bedrijf aan dat zijn tarieven werkelijk kostengeoriënteerd zijn.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13f
  - number: 13f.4
    text: De Autoriteit Consument en Markt kan aan een verplichting als bedoeld in het eerste lid voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13f
  - number: 13f.5
    text: |-
      Indien een verplichting tot het opstellen van een kostentoerekeningsysteem is opgelegd, maakt het
      postvervoerbedrijf, met inachtneming van de door de Autoriteit Consument en Markt gegeven voorschriften, op
      genoegzame wijze een beschrijving van het systeem bekend die ten minste de hoofdcategorieën bevat waarin de kosten
      worden ingedeeld en de voor de toerekening van de kosten toegepaste regels.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13f
  - number: 13f.6
    text: |-
      De Autoriteit Consument en Markt of een door haar aan te wijzen onafhankelijke deskundige onderzoekt jaarlijks of
      het postvervoerbedrijf in overeenstemming met de opgelegde verplichting heeft gehandeld.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13f
  - number: 13g.1
    text: |-
      De Autoriteit Consument en Markt kan de verplichting opleggen om door haar nader te bepalen informatie bekend te
      maken op een door haar te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13g
  - number: 13g.2
    text: |-
      De Autoriteit Consument en Markt kan de verplichting opleggen om een referentieaanbod bekend te maken waarin een
      omschrijving is opgenomen van door haar te bepalen vormen van toegang. Het referentieaanbod is opgesplitst naar de
      door de Autoriteit Consument en Markt onderscheiden vormen van toegang en de daarbij gehanteerde tarieven en andere
      voorwaarden.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13g
  - number: 13g.3
    text: |-
      Aan een verplichting als bedoeld in het eerste of tweede lid kan de Autoriteit Consument en Markt voorschriften
      verbinden met betrekking tot de mate van detaillering en de wijze van bekendmaking.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13g
  - number: 13h.1
    text: |-
      De Autoriteit Consument en Markt kan de verplichting opleggen om een gescheiden boekhouding te voeren waarin de
      opbrengsten en de kosten van de door haar te bepalen postvervoerdiensten die het postvervoerbedrijf aanbiedt aan
      de onderneming zelf, aan andere postvervoerbedrijven of aan eindgebruikers, gescheiden zijn van die van de door het
      postvervoerbedrijf verrichte overige activiteiten.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13h
  - number: 13h.2
    text: |-
      Aan de verplichting tot het voeren van een gescheiden boekhouding als bedoeld in het eerste lid, kan de Autoriteit
      Consument en Markt voorschriften verbinden met betrekking tot de methode van inrichting van de boekhouding, de
      mate van detaillering en het aan de Autoriteit Consument en Markt verstrekken van boekhoudkundige documenten met
      inbegrip van gegevens over van derden ontvangen inkomsten.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13h
  - number: 13i.1
    text: |-
      De Autoriteit Consument en Markt kan de verplichting opleggen om bij de levering van door haar te bepalen
      postvervoerdiensten aan andere postvervoerbedrijven of eindgebruikers:
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13i
  - number: 13i.1.a
    text: een door haar te bepalen postvervoerdienst los te leveren van andere diensten;
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13i
  - number: 13i.1.b
    text: deze andere postvervoerbedrijven en eindgebruikers in gelijke gevallen gelijk te behandelen;
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13i
  - number: 13i.1.c
    text: een redelijk kwaliteitsniveau te garanderen.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13i
  - number: 13i.2
    text: |-
      Aan een verplichting als bedoeld in het eerste lid kunnen door de Autoriteit Consument en Markt nadere
      voorschriften worden verbonden die nodig zijn voor een goede uitvoering van die verplichtingen.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13i
  - number: 13j.1
    text: |-
      Voor door haar te bepalen postvervoerdiensten aan eindgebruikers kan de Autoriteit Consument en Markt
      verplichtingen opleggen betreffende het beheersen van de hiervoor te rekenen tarieven of de kostentoerekening.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13j
  - number: 13j.2
    text: |-
      [Artikel 13f, tweede tot en met vijfde lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel13f
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13j
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: 13f
        hoofdstuk: 3a
  - number: 13j.3
    text: |-
      Aan een verplichting als bedoeld in het eerste lid kunnen door de Autoriteit Consument en Markt nadere
      voorschriften worden verbonden die nodig zijn voor een goede uitvoering van die verplichtingen.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13j
  - number: 13k.1
    text: |-
      Indien de Autoriteit Consument en Markt een verplichting als bedoeld in [artikel 13j][ref1] oplegt of in
      stand houdt, kan zij tevens de verplichting opleggen om invoering van nieuwe of gewijzigde tarieven voor
      postvervoerdiensten aan eindgebruikers niet plaats te laten vinden dan nadat zij deze tarieven heeft goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel13j
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13k
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: 13j
        hoofdstuk: 3a
  - number: 13k.2
    text: |-
      De Autoriteit Consument en Markt beoordeelt binnen drie weken na ontvangst van een verzoek tot goedkeuring,
      of het nieuwe of gewijzigde tarief in overeenstemming is met de opgelegde of in stand gehouden verplichting,
      bedoeld in [artikel 13j, eerste lid][ref1]. Indien gegevens als bedoeld in het zevende lid, ontbreken wordt het
      postvervoerbedrijf binnen drie dagen na ontvangst van het verzoek, hiervan op de hoogte gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel13j
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13k
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: 13j
        hoofdstuk: 3a
  - number: 13k.3
    text: |-
      De Autoriteit Consument en Markt kan de termijn, bedoeld in het tweede lid, eerste volzin, eenmaal met drie weken
      verlengen. Zij doet hiervan schriftelijk mededeling aan het postvervoerbedrijf dat het verzoek heeft ingediend.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13k
  - number: 13k.4
    text: |-
      Indien de Autoriteit Consument en Markt van oordeel is dat het nieuwe of gewijzigde tarief in overeenstemming
      is met de opgelegde of in stand gehouden verplichting, bedoeld in [artikel 13j, eerste lid][ref1], keurt zij de
      invoering hiervan goed.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel13j
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13k
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: 13j
        hoofdstuk: 3a
  - number: 13k.5
    text: |-
      Indien de Autoriteit Consument en Markt van oordeel is dat het nieuwe of gewijzigde tarief niet in overeenstemming
      is met de verplichting, bedoeld in [artikel 13j, eerste lid][ref1], doet zij hiervan mededeling aan het
      desbetreffende postvervoerbedrijf. Zij deelt hierbij mede op welke punten niet voldaan is aan de verplichting,
      bedoeld in artikel 13j, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel13j
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13k
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: 13j
        hoofdstuk: 3a
  - number: 13k.6
    text: |-
      Het postvervoerbedrijf deelt de Autoriteit Consument en Markt binnen vier weken na de datum van de mededeling,
      bedoeld in het vijfde lid, schriftelijk mede in hoeverre het nieuwe of gewijzigde tarief wordt aangepast aan
      de mededeling van de Autoriteit Consument en Markt. De Autoriteit Consument en Markt beoordeelt binnen drie
      weken na ontvangst van de mededeling van het postvervoerbedrijf, bedoeld in de eerste volzin, op het verzoek
      tot goedkeuring, of het nieuwe of gewijzigde tarief in overeenstemming is met de opgelegde of in stand gehouden
      verplichting, bedoeld in [artikel 13j, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel13j
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13k
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: 13j
        hoofdstuk: 3a
  - number: 13k.7
    text: |-
      Uiterlijk op het tijdstip waarop de Autoriteit Consument en Markt een verplichting als bedoeld in
      [artikel 13j][ref1] oplegt of in stand houdt, in werking treedt, stelt zij vast welke gegevens door de
      desbetreffende onderneming bij een verzoek als bedoeld in het tweede lid overgelegd moeten worden, en in welke vorm
      deze gegevens worden ingediend. De Autoriteit Consument en Markt doet hiervan mededeling aan het desbetreffende
      postvervoerbedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel13j
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel13k
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: 13j
        hoofdstuk: 3a
  - number: '14'
    text: |-
      Dit hoofdstuk is van toepassing op de verlener van de universele postdienst voor zover deze postvervoerdiensten
      verricht die tot de universele postdienst behoren.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel14
  - number: '15.1'
    text: |-
      Onze Minister wijst op basis van een transparante selectieprocedure voor onbepaalde tijd een postvervoerbedrijf aan
      dat belast is met de universele postdienst of een gedeelte hiervan.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel15
  - number: '15.2'
    text: 'Onze Minister kan een aanwijzing geheel of gedeeltelijk intrekken indien:'
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel15
  - number: 15.2.a
    text: de goede uitvoering van de universele postdienst of een gedeelte hiervan niet meer gewaarborgd is;
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel15
  - number: 15.2.b
    text: |-
      een verlener van de universele postdienst overeenkomstig [artikel 30, eerste lid][ref1], heeft aangegeven dat de
      uitvoering van deze dienst nettokosten zal opleveren;


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel30
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '30'
        hoofdstuk: '4'
        paragraaf: '4.7'
  - number: 15.2.c
    text: het aangewezen postvervoerbedrijf daarom verzoekt;
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel15
  - number: 15.2.d
    text: een ander postvervoerbedrijf te kennen heeft gegeven de universele postdienst uit te willen voeren.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel15
  - number: '15.3'
    text: |-
      Onze Minister maakt het voornemen om de aanwijzing geheel of gedeeltelijk in te trekken aan het aangewezen
      postvervoerbedrijf bekend en doet hiervan mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel15
  - number: '15.4'
    text: |-
      De aanwijzing wordt niet ingetrokken vóórdat is voorzien in een aanwijzing van een postvervoerbedrijf voor de
      universele postdienst of het gedeelte van de universele postdienst waarop de aanwijzing die wordt ingetrokken,
      betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel15
  - number: '15.5'
    text: |-
      Een postvervoerbedrijf waarvan de aanwijzing wordt ingetrokken, is verplicht deel te nemen aan de
      selectieprocedure.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel15
  - number: '15.6'
    text: |-
      Een aanwijzing wordt niet gegeven aan een aanvrager die naar verwachting de universele dienst niet naar behoren zal
      kunnen verzorgen.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel15
  - number: '15.7'
    text: Bij algemene maatregel van bestuur worden nadere regels gesteld over de selectieprocedure.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel15
  - number: '15.8'
    text: |-
      De voordracht voor een krachtens het zevende lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel15
  - number: '16.1'
    text: 'De universele postdienst betreft het postvervoer binnen Nederland van ten minste de volgende poststukken:'
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel16
  - number: 16.1.a
    text: brieven die elk afzonderlijk ten hoogste twee kilogram wegen;
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel16
  - number: 16.1.b
    text: pakketten die elk afzonderlijk ten hoogste tien kilogram wegen;
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel16
  - number: 16.1.c
    text: |-
      poststukken die in hoofdzaak tekst bevatten in voor blinden bestemde tekens die elk afzonderlijk ten hoogste zeven
      kilogram wegen.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel16
  - number: '16.2'
    text: |-
      De universele postdienst betreft het postvervoer van of naar gebieden buiten Nederland van ten minste de volgende
      poststukken:
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel16
  - number: 16.2.a
    text: brieven die elk afzonderlijk ten hoogste twee kilogram wegen;
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel16
  - number: 16.2.b
    text: boeken die elk afzonderlijk ten hoogste vijf kilogram wegen;
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel16
  - number: 16.2.c
    text: pakketten die elk afzonderlijk ten hoogste twintig kilogram wegen;
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel16
  - number: 16.2.d
    text: |-
      poststukken die in hoofdzaak tekst bevatten in voor blinden bestemde tekens en die elk afzonderlijk ten hoogste
      zeven kilogram wegen.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel16
  - number: '16.3'
    text: 'De universele postdienst omvat binnen Nederland ten minste de volgende postvervoerdiensten:'
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel16
  - number: 16.3.a
    text: vervoer van aangetekende poststukken;
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel16
  - number: 16.3.b
    text: vervoer van poststukken met aangegeven waarde;
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel16
  - number: 16.3.c
    text: |-
      de uitreiking van het gerechtelijk schrijven, bedoeld in de [artikelen 585, tweede lid][ref1], en
      [587, eerste lid, van het Wetboek van Strafvordering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel585
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel587
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '585'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '587'
  - number: '16.4'
    text: |-
      Onder de universele postdienst vallen bij postvervoer van en naar gebieden buiten Nederland ten minste de
      postvervoerdiensten, opgenomen in de akten van de Wereldpostunie.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel16
  - number: '16.5'
    text: |-
      Een verlener van de universele postdienst haalt ten minste vijf dagen per week poststukken op uit de voor het
      publiek bestemde brievenbussen dan wel uit andere daartoe bestemde inrichtingen, en voert ten minste vijf dagen per
      week overal in Nederland een bestelling uit, met dien verstande dat hij ten minste zes dagen per week rouwbrieven
      en medische brieven ophaalt uit daartoe bestemde inrichtingen, en ten minste zes dagen per week overal in Nederland
      een bestelling uitvoert van rouwbrieven en medische brieven.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel16
  - number: '16.6'
    text: |-
      Een verlener van de universele postdienst zorgt ervoor dat de brieven, die overeenkomstig de daartoe gestelde
      voorwaarden aan hem worden aangeboden voor postvervoer binnen Nederland met de standaard overnight service, per
      kalenderjaar in ten minste gemiddeld 95% van de gevallen worden besteld op de dag, niet zijnde een zon- of maandag
      of officiële feestdag, volgend op de dag van aanbieding, met dien verstande dat rouwbrieven en medische brieven
      per kalenderjaar in ten minste gemiddeld 95% van de gevallen worden besteld op de dag, niet zijnde een zon-, of
      officiële feestdag, volgend op de dag van aanbieding.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel16
  - number: '16.7'
    text: |-
      De verlener van de universele postdienst zorgt ervoor dat het net van dienstverleningspunten voor het aanbieden
      van postzendingen en voor het verrichten van andere met het postvervoer samenhangende handelingen ten minste 2000
      dienstverleningspunten omvat, waarvan ten minste 902 met een volledig assortiment aan diensten. Bovendien zorgt de
      verlener van de universele postdienst ervoor dat dit net voldoet aan de volgende spreidingsmaatstaven:
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel16
  - number: 16.7.a
    text: |-
      de spreiding over Nederland van dienstverleningspunten met een volledig assortiment van diensten resulteert in een
      beschikbaarheid van een volledig assortiment van diensten binnen een straal van vijf kilometer voor ten minste 95%
      van de inwoners;
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel16
  - number: 16.7.b
    text: |-
      de spreiding van dienstverleningspunten met een volledig assortiment van diensten buiten woonkernen met meer dan
      5000 inwoners resulteert in een beschikbaarheid van een volledig assortiment van diensten binnen een straal van
      5 kilometer voor ten minste 85% van de betrokken inwoners.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel16
  - number: '16.8'
    text: |-
      De verlener van de universele postdienst zorgt ervoor dat in woonkernen met meer dan 5000 inwoners binnen een
      straal van 500 meter een voor het publiek bestemde brievenbus is om voor postvervoer bestemde poststukken aan te
      bieden. Buiten deze woonkernen zorgt de verlener van de universele postdienst ervoor dat binnen een straal van 2500
      meter voor het publiek bestemde brievenbussen zijn.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel16
  - number: '16.9'
    text: |-
      Indien het gestelde in het achtste lid redelijkerwijs niet haalbaar is, draagt de verlener van de universele
      postdienst er zorg voor dat bij de bestelling gelegenheid wordt geboden om daartoe geschikte postzendingen ten
      vervoer aan te bieden.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel16
  - number: '17.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de universele postdienst. Deze
      regels kunnen betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel17
  - number: 17.1.a
    text: de onderscheiden postvervoerdiensten;
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel17
  - number: 17.1.b
    text: de soorten poststukken waarop de universele postdienst betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel17
  - number: 17.1.c
    text: |-
      de kwaliteit van de postvervoerdiensten, bedoeld in onderdeel a, die voor de verschillende postvervoerdiensten
      verschillend kan worden vastgesteld;
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel17
  - number: 17.1.d
    text: de goede postale dienstverlening;
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel17
  - number: 17.1.e
    text: de wijze waarop poststukken aan een verlener van de universele postdienst worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel17
  - number: '17.2'
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel17
  - number: '18.1'
    text: |-
      Een verlener van de universele postdienst verzorgt binnen Nederland en van of naar gebieden buiten Nederland de
      universele postdienst.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel18
  - number: '18.2'
    text: |-
      De verplichting, bedoeld in het eerste lid, geldt alleen indien poststukken zijn aangeboden aan een verlener van de
      universele postdienst in overeenstemming met de regels, bedoeld in [artikel 17, eerste lid, onderdeel e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel17
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '19.1'
    text: |-
      Een verlener van de universele postdienst weigert de uitvoering van de universele postdienst indien dit strijdig is
      met de wet of gevaar oplevert voor personen of zaken.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel19
  - number: '19.2'
    text: |-
      Een verlener van de universele postdienst kan de uitvoering van de universele postdienst weigeren indien dit
      strijdig is met de eisen die met het oog op een doelmatig postvervoer in zijn algemene voorwaarden zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel19
  - number: '20.1'
    text: |-
      Bij ministeriële regeling worden regels omtrent plaats, afmetingen en andere hoedanigheden van de voor aflevering
      van poststukken bestemde brievenbussen vastgesteld.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel20
  - number: '20.2'
    text: |-
      Een verlener van de universele postdienst kan poststukken die naar hun aard en omvang in aanmerking komen voor
      aflevering in een brievenbus, als onbestelbaar aanmerken indien het opgegeven adres niet beschikt over een
      brievenbus die voldoet aan de regels, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel20
  - number: '21.1'
    text: |-
      Een verlener van de universele postdienst kan gedeelten van de universele postdienst door anderen onder zijn
      verantwoordelijkheid doen uitvoeren.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel21
  - number: '21.2'
    text: |-
      Een verlener van de universele postdienst rekent de kosten die anderen in rekening brengen voor het uitvoeren
      van gedeelten van de universele postdienst slechts toe aan de universele postdienst voor zover die kosten
      overeenkomstig de op grond van de [artikelen 22, derde lid][ref1], en [25, zesde lid][ref2], vastgestelde regels
      zijn toe te rekenen aan de universele postdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0025572#Artikel25
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '22'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref2
        bwb_id: BWBR0025572
        artikel: '25'
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: '21.3'
    text: |-
      Een verlener van de universele postdienst maakt de toerekening van de kosten van anderen, bedoeld in het tweede
      lid, inzichtelijk voor ieder gedeelte van de universele postdienst dat hij door anderen laat uitvoeren.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel21
  - number: '21.4'
    text: |-
      Een verlener van de universele postdienst die gedeelten van de universele postdienst door anderen laat uitvoeren
      waarborgt de volledige en juiste uitvoering van de door de anderen uitgevoerde gedeelten van de universele
      postdienst.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel21
  - number: '22.1'
    text: |-
      Een verlener van de universele postdienst brengt een boekhoudkundige scheiding aan tussen de kosten en opbrengsten
      van de universele postdienst en de kosten en opbrengsten van andere activiteiten.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel22
  - number: '22.2'
    text: |-
      Een verlener van de universele dienst maakt de toerekening van de kosten en opbrengsten van de universele
      postdienst en de kosten en opbrengsten van andere activiteiten inzichtelijk aan de Autoriteit Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel22
  - number: '22.3'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de inrichting van de boekhouding en de
      wijze van toerekening van de kosten van de universele postdienst, alsmede over de wijze waarop een verlener van de
      universele dienst de in het tweede lid bedoelde toerekening van kosten en opbrengsten inzichtelijk maakt.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel22
  - number: '23.1'
    text: |-
      Een verlener van de universele postdienst verstrekt jaarlijks aan de Autoriteit Consument en Markt een rapportage
      over de uitvoering van de universele postdienst. Deze rapportage bevat de resultaten van regelmatige metingen van
      de kwaliteit van de universele postdienstverlening en de hierbij behorende kwaliteitsnormen, alsmede een overzicht
      van de kosten en opbrengsten van de universele postdienstverlening, bedoeld in [artikel 22, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel22
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '22'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '23.2'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over de rapportage. Deze regels kunnen betrekking hebben op
      de inrichting van de rapportage, op de metingen, bedoeld in het eerste lid, alsmede op de op te nemen financiële
      gegevens.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel23
  - number: '24.1'
    text: |-
      Een verlener van de universele postdienst stelt voorwaarden en tarieven vast voor de onderscheiden
      postvervoerdiensten binnen de universele postdienst en maakt deze bekend.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel24
  - number: '24.2'
    text: De tarieven zijn uniform en op de kosten gebaseerd.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel24
  - number: '24.3'
    text: De voorwaarden en tarieven zijn non-discriminatoir en transparant.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel24
  - number: '25.1'
    text: 'Bij ministeriële regeling, gehoord de Autoriteit Consument en Markt, wordt bepaald:'
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel25
  - number: 25.1.a
    text: |-
      met welk percentage de tarieven voor de universele postdienst jaarlijks gemiddeld ten hoogste mogen worden
      gewijzigd;
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel25
  - number: 25.1.b
    text: op welke wijze de jaarlijks gemiddelde wijziging, bedoeld in onderdeel a, wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel25
  - number: '25.2'
    text: |-
      Bij ministeriële regeling kan, gehoord de Autoriteit Consument en Markt, voor een afzonderlijk jaar een ander
      percentage dan bedoeld in het eerste lid worden vastgesteld indien dit noodzakelijk is om te voldoen aan het
      vereiste dat de tarieven op de kosten gebaseerd zijn.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel25
  - number: '25.3'
    text: |-
      Met inachtneming van bij ministeriële regeling te stellen regels worden, in afwijking van het eerste en tweede lid,
      zes maanden na inwerkingtreding van dit artikel de tarieven voor de te onderscheiden postvervoerdiensten binnen de
      universele postdienst gebaseerd op de daadwerkelijke kosten van de universele postdienst en een redelijk rendement.
      Bij de ministeriële regeling, bedoeld in de eerste volzin, kan worden bepaald dat de tarieven voor de onderscheiden
      postvervoerdiensten binnen de universele postdienst in enig ander jaar kunnen worden aangepast op basis van de
      daadwerkelijke kosten van de universele postdienst en een redelijk rendement.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel25
  - number: '25.4'
    text: Het eerste en het tweede lid zijn van overeenkomstige toepassing op de tarieven, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel25
  - number: '25.5'
    text: |-
      In afwijking van de [artikelen 24][ref1] en [27][ref2] worden de tarieven, bedoeld in het derde lid, door de
      Autoriteit Consument en Markt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0025572#Artikel27
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '4.5'
      - id: ref2
        bwb_id: BWBR0025572
        artikel: '27'
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: '25.6'
    text: |-
      Bij de ministeriële regeling, bedoeld in het derde lid, worden regels vastgesteld met betrekking tot de elementen
      van de tarieven, de wijze van berekening van de tarieven en de toerekening van de kosten.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel25
  - number: '25.7'
    text: De Autoriteit Consument en Markt brengt advies uit over de ministeriële regeling, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel25
  - number: '25.8'
    text: |-
      Het ontwerp voor een krachtens het derde lid vast te stellen ministeriële regeling en het advies van de Autoriteit
      Consument en Markt worden gelijktijdig aan beide kamers der Staten-Generaal overgelegd. De ministeriële regeling
      wordt niet eerder vastgesteld dan vier weken na de overlegging van het ontwerp.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel25
  - number: '26'
    text: |-
      In afwijking van de [artikelen 24][ref1] en [25][ref2] worden de kosten van het vervoer van poststukken die in
      hoofdzaak tekst bevatten in voor blinden bestemde tekens en die elk afzonderlijk ten hoogste zeven kilogram wegen
      door de verlener van de universele postdienst gedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0025572#Artikel25
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '4.5'
      - id: ref2
        bwb_id: BWBR0025572
        artikel: '25'
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: '27.1'
    text: |-
      De tarieven, bedoeld in [artikel 24][ref1], en de wijzigingen hiervan worden niet eerder vastgesteld dan
      een maand na het tijdstip waarop zij aan de Autoriteit Consument en Markt zijn toegezonden ter toetsing aan
      [artikel 24, tweede en derde lid][ref2], en aan het bepaalde krachtens [artikel 25][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0025572#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0025572#Artikel25
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '4.5'
      - id: ref2
        bwb_id: BWBR0025572
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '4.5'
      - id: ref3
        bwb_id: BWBR0025572
        artikel: '25'
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: '27.2'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gegeven over de procedure van de toetsing, alsmede over de
      wijze en het tijdstip van de toetsing aan [artikel 24][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel24
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: '28.1'
    text: |-
      Een verlener van de universele postdienst kan, met het oog op de doelmatige wijze van uitvoeren van de universele
      postdienst, in de algemene voorwaarden regels stellen over de verpakking en adressering van poststukken.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel28
  - number: '28.2'
    text: |-
      Indien de algemene voorwaarden van een verlener van de universele postdienst bepalingen bevatten over het gebruik
      van een postcode, zorgt hij ervoor dat afzenders kosteloos en op eenvoudige wijze de bij een adres behorende
      postcode kunnen verkrijgen.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel28
  - number: '29.1'
    text: |-
      Een verlener van de universele postdienst is voor schade als gevolg van verlies, beschadiging of vertraagde
      aflevering van binnenlandse poststukken slechts aansprakelijk indien door de afzender gebruik wordt gemaakt van
      een wijze van vervoer waarbij een poststuk volgens daartoe in de algemene voorwaarden van het postvervoerbedrijf te
      stellen regels wordt geregistreerd.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel29
  - number: '29.2'
    text: |-
      De aansprakelijkheid bedoeld in het eerste lid bestaat niet indien de schade uitsluitend het gevolg is van een of
      meer van de volgende omstandigheden:
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel29
  - number: 29.2.a
    text: de aard of een gebrek van het vervoerde zelf;
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel29
  - number: 29.2.b
    text: |-
      onvoldoende verpakking van het vervoerde door een ander dan een verlener van de universele postdienst of diens
      ondergeschikten;
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel29
  - number: 29.2.c
    text: een oorzaak die aan de afzender kan worden toegerekend;
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel29
  - number: 29.2.d
    text: een oorlogshandeling of een gewapend conflict;
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel29
  - number: 29.2.e
    text: aanhouding op last van daartoe bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel29
  - number: '29.3'
    text: |-
      Vorderingen kunnen slechts worden ingediend door de afzender. Indien de schade is geleden door een ander dan de
      afzender, is de afzender van rechtswege bevoegd ten behoeve van die ander, hetzij op eigen naam hetzij als diens
      vertegenwoordiger, de vordering in te stellen.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel29
  - number: '29.4'
    text: |-
      Bij algemene maatregel van bestuur worden bedragen vastgesteld waarboven de aansprakelijkheid, bedoeld in het
      eerste lid, zich niet uitstrekt, waarbij de hoogte van de afzonderlijke bedragen kan worden bepaald naar gelang van
      onder meer de soorten van registratie alsmede naar gelang van de aard en de waarde van een poststuk.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel29
  - number: '29.5'
    text: |-
      Een verlener van de universele postdienst kan zich niet beroepen op een uit de voorgaande leden van dit artikel
      voortvloeiende uitsluiting of beperking van zijn aansprakelijkheid voor zover de schade is ontstaan uit zijn eigen
      handelen of nalaten, geschied hetzij met het opzet die schade te veroorzaken, hetzij roekeloos en met de wetenschap
      dat die schade er waarschijnlijk uit zou voortvloeien.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel29
  - number: '29.6'
    text: |-
      Ter zake van het postvervoer van of naar gebieden buiten Nederland is een verlener van de universele postdienst
      slechts aansprakelijk overeenkomstig de bepalingen van de akten van de Wereldpostunie dan wel andere voor Nederland
      bindende verdragen of besluiten van volkenrechtelijke organisaties.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel29
  - number: '29.7'
    text: Nietig is ieder beding, waarbij van dit artikel wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel29
  - number: '30.1'
    text: |-
      Een verlener van de universele postdienst meldt uiterlijk drie maanden voor de afloop van het kalenderjaar aan de
      Autoriteit Consument en Markt dat in het daaropvolgende kalenderjaar nettokosten worden verwacht voor de uitvoering
      van de universele postdienst. Daarbij wordt aangegeven hoe hoog de voor dat kalenderjaar verwachte nettokosten
      zullen zijn.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel30
  - number: '30.2'
    text: |-
      De nettokosten zijn de kosten die een verlener van de universele postdienst voor de aan hem opgedragen universele
      postdiensten maakt waartegenover door toepassing van de regels, bedoeld in [artikel 25][ref1], geen vergoeding
      staat, verminderd met andere op geld waardeerbare voordelen die verband houden met de verlening van de universele
      postdienst, waaronder begrepen immateriële voordelen.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel25
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '25'
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: '30.3'
    text: |-
      Een postvervoerbedrijf dat ingevolge het eerste lid nettokosten heeft aangekondigd, kan binnen een half jaar na
      afloop van het kalenderjaar waarin de nettokosten zijn ontstaan, bij de Autoriteit Consument en Markt een aanvraag
      indienen om vergoeding van de in het afgelopen kalenderjaar gemaakte nettokosten.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel30
  - number: '30.4'
    text: |-
      Een vergoeding wordt slechts toegekend voorzover naar het oordeel van de Autoriteit Consument en Markt het bestaan
      en de hoogte van de nettokosten voldoende is aangetoond.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel30
  - number: '30.5'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de berekening van de nettokosten, bedoeld in het tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel30
  - number: '31.1'
    text: |-
      De vergoeding aan een universele postdienstverlener wordt omgeslagen over alle postvervoerbedrijven, met
      uitzondering van de postvervoerbedrijven die voldoen aan bij ministeriële regeling te bepalen criteria met
      betrekking tot de relevante omzet van een postvervoerbedrijf in Nederland.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel31
  - number: '31.2'
    text: |-
      Bij ministeriële regeling wordt de wijze van berekening van de vergoeding vastgesteld aan de hand van de relevante
      netto-omzet van een postvervoerbedrijf in Nederland.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel31
  - number: '31.3'
    text: De Autoriteit Consument en Markt doet aan een postvervoerbedrijf mededeling van het door hem verschuldigde bedrag.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel31
  - number: '31.4'
    text: |-
      Een postvervoerbedrijf is verplicht binnen een daarbij te bepalen termijn de door de Autoriteit Consument en Markt
      vastgestelde vergoeding te betalen aan de desbetreffende verlener van de universele postdienst.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel31
  - number: '32.1'
    text: |-
      Een verlener van de universele postdienst is gehouden bij de uitvoering van de op hem rustende verplichtingen
      terzake van de universele postdienst van of naar gebieden buiten Nederland de voor Nederland bindende
      verplichtingen na te komen die voortvloeien uit de akten van de Wereldpostunie dan wel uit andere verdragen of
      besluiten van volkenrechtelijke organisaties.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel32
  - number: '32.2'
    text: |-
      Een verlener van de universele postdienst is gerechtigd voor de toepassing van akten van de Wereldpostunie op te
      treden als Nederlandse postadministratie.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel32
  - number: '32.3'
    text: |-
      Onze Minister geeft in overeenstemming met Onze Minister van Buitenlandse Zaken bij ministeriële regeling
      voorschriften welke strekken tot:
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel32
  - number: 32.3.a
    text: het waarborgen van een goede toepassing van het eerste lid;
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel32
  - number: 32.3.b
    text: |-
      het verlenen van de nodige medewerking aan Onze Minister en Onze Minister van Buitenlandse Zaken bij de
      voorbereiding van verdragen en besluiten als bedoeld in het eerste lid en het in verband daarmee te voeren
      internationale overleg.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel32
  - number: '33.1'
    text: |-
      De Autoriteit Consument en Markt verzamelt, analyseert en bewerkt systematisch inlichtingen en gegevens met
      betrekking tot de werking van de nationale markt voor postvervoerdiensten.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel33
  - number: '33.2'
    text: De Autoriteit Consument en Markt zendt jaarlijks een verslag van haar bevindingen aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel33
  - number: '34'
    text: |-
      De gemeenteraad kan voor de plaatsing van brievenbussen aan de openbare weg regels stellen, tenzij door het stellen
      van regels:
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel34
  - number: 34.a
    text: de verlener van de universele postdienst de universele postdienst niet kan verrichten;
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel34
  - number: 34.b
    text: |-
      postvervoerbedrijven, niet zijnde een verlener van de universele postdienst, hun diensten niet onder voor deze
      bedrijven vergelijkbare voorwaarden kunnen aanbieden.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel34
  - number: '35'
    text: De afbeelding van de Koning op een postzegel of postzegelafdruk behoeft Diens goedkeuring.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel35
  - number: '36.1'
    text: |-
      Het is aan andere postvervoerbedrijven dan verleners van de universele postdienst verboden postzegels of
      postzegelafdrukken te vervaardigen, te verspreiden of ter verspreiding in voorraad te hebben met daarop de
      vermelding «Nederland».
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel36
  - number: '36.2'
    text: |-
      Het is verboden zegels, zegelafdrukken, stempelafdrukken of aanduidingen op zodanige wijze te bezigen, dat zij ten
      onrechte de indruk kunnen wekken, dat de bescheiden of voorwerpen, waarop zij voorkomen, door een verlener van de
      universele postdienst behandeld of van een verlener van de universele postdienst afkomstig zijn.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel36
  - number: '37.1'
    text: |-
      De Autoriteit Consument en Markt is belast met het toezicht op de naleving van het bepaalde bij of krachtens deze
      wet, met uitzondering van [hoofdstuk 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Hoofdstuk11
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0025572
        hoofdstuk: '11'
  - number: '37.2'
    text: |-
      De bij besluit van de Autoriteit Consument en Markt aangewezen ambtenaren zijn belast met het toezicht op de
      naleving van het bepaalde bij of krachtens deze wet, met uitzondering van [hoofdstuk 11][ref1]. Van het besluit
      wordt mededeling gedaan door plaatsing in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Hoofdstuk11
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0025572
        hoofdstuk: '11'
  - number: '38.1'
    text: |-
      Onze Minister is belast met het toezicht op de naleving van het bepaalde bij of krachtens [hoofdstuk 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Hoofdstuk11
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0025572
        hoofdstuk: '11'
  - number: '38.2'
    text: |-
      De bij besluit van Onze Minister aangewezen ambtenaren zijn belast met het toezicht op de naleving van het bepaalde
      bij of krachtens [hoofdstuk 11][ref1]. Van het besluit wordt mededeling gedaan door plaatsing in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Hoofdstuk11
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0025572
        hoofdstuk: '11'
  - number: '39.1'
    text: |-
      Een ieder verstrekt de Autoriteit Consument en Markt desgevraagd de gegevens en inlichtingen en verschaft hem
      desgevraagd inzage in de gegevens en bescheiden die redelijkerwijs nodig zijn voor de uitvoering van hem bij of
      krachtens deze wet opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel39
  - number: '39.2'
    text: |-
      Onze Minister kan van een ieder de gegevens en inlichtingen verlangen die hij nodig heeft voor de juiste uitvoering
      van de hem bij of krachtens deze wet opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel39
  - number: '39.3'
    text: |-
      Degene aan wie een verzoek is gedaan om gegevens en inlichtingen te verstrekken, is verplicht binnen een door de
      Autoriteit Consument en Markt respectievelijk Onze Minister gestelde redelijke termijn alle medewerking te verlenen
      die deze redelijkerwijs kan vorderen bij de uitoefening van haar respectievelijk zijn bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel39
  - number: '39.4'
    text: |-
      Gegevens en inlichtingen welke door Onze Minister in verband met enige werkzaamheid ten behoeve van de uitvoering
      van deze wet zijn verkregen, mogen uitsluitend voor de toepassing van deze wet en de [Mededingingswet][ref1] worden
      gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0008691
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0008691
  - number: '39.5'
    text: |-
      Met inachtneming van een goede vervulling van haar toezichthoudende taken ingevolge deze wet draagt de Autoriteit
      Consument en Markt er zorg voor dat het verzamelen van de gegevens of inlichtingen, bedoeld in het eerste lid, op
      zodanige wijze geschiedt dat de daaruit voortvloeiende administratieve lasten voor postvervoerbedrijven of andere
      bedrijven en instellingen zo laag mogelijk zijn.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel39
  - number: '40'
    text: |-
      Voor zover bij de uitoefening van bevoegdheden op grond van het bepaalde bij of krachtens deze wet begrippen
      worden uitgelegd die worden gehanteerd bij de toepassing van [artikel 24 van de Mededingingswet][ref1], geschiedt
      de uitoefening van die bevoegdheden op een wijze die in overeenstemming is met de wijze waarop toepassing wordt
      gegeven aan artikel 24 van de Mededingingswet.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel24
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '24'
  - number: '41'
    text: |-
      Een postvervoerbedrijf deelt aan de Autoriteit Consument en Markt in ieder geval de naam, het adres, de
      vestigingsplaats en een beschrijving van de aangeboden postvervoerdiensten mee.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel41
  - number: '42.1'
    text: |-
      De Autoriteit Consument en Markt stelt vast welke andere gegevens dan genoemd in [artikel 41][ref1] bij de
      mededeling aan de Autoriteit Consument en Markt worden overgelegd, alsmede de wijze waarop de mededeling wordt
      gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel41
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '41'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '42.2'
    text: |-
      De gegevens, bedoeld [artikel 41][ref1] en het eerste lid, worden slechts verzameld ten behoeve van de goede
      uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel41
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '41'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '42.3'
    text: |-
      De Autoriteit Consument en Markt registreert het postvervoerbedrijf na ontvangst van de in [artikel 41][ref1]
      bedoelde mededeling en de daarbij behorende gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel41
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '41'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '42.4'
    text: |-
      Een postvervoerbedrijf geeft wijzigingen van de gegevens, bedoeld in [artikel 41][ref1] en het eerste lid,
      onverwijld aan de Autoriteit Consument en Markt door.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel41
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '41'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '43.1'
    text: |-
      De Autoriteit Consument en Markt gaat niet over tot registratie als bedoeld in [artikel 42, derde lid][ref1],
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel42
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '42'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 43.1.a
    text: de mededeling geen betrekking heeft op het postvervoerbedrijf, of
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel43
  - number: 43.1.b
    text: |-
      de op grond van [artikel 41][ref1] en [42, eerste lid][ref2], te overleggen gegevens niet, onvolledig, of niet
      juist zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0025572#Artikel42
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '41'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0025572
        artikel: '42'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '43.2'
    text: De Autoriteit Consument en Markt beëindigt de registratie indien de grond voor registratie is vervallen.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel43
  - number: '44.1'
    text: |-
      In het belang van de goede uitvoering van deze wet wordt door de Autoriteit Consument en Markt een register van de
      registraties bijgehouden.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel44
  - number: '44.2'
    text: |-
      Het register ligt voor eenieder kosteloos ter inzage op een door de Autoriteit Consument en Markt te bepalen
      plaats. De gegevens uit het register zijn kosteloos op elektronische wijze te raadplegen.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel44
  - number: '44.3'
    text: |-
      De Autoriteit Consument en Markt brengt het register in overeenstemming met de wijzigingen die voortvloeien uit
      [artikel 42, vierde lid][ref1], en [artikel 43, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0025572#Artikel43
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '42'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0025572
        artikel: '43'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '44.4'
    text: |-
      De Autoriteit Consument en Markt kan de gegevens met betrekking tot de registratie wijzigen indien dit noodzakelijk
      is om feitelijke onjuistheden van eenvoudige aard weg te nemen.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel44
  - number: '45.1'
    text: |-
      De Autoriteit Consument en Markt verstrekt zo spoedig mogelijk na de registratie, bedoeld in
      [artikel 42, derde lid][ref1], aan het postvervoerbedrijf een schriftelijke verklaring waaruit blijkt dat de
      mededeling, bedoeld in [artikel 41][ref2], aan de Autoriteit Consument en Markt is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0025572#Artikel41
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '42'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0025572
        artikel: '41'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '45.2'
    text: |-
      De Autoriteit Consument en Markt verstrekt binnen een week na ontvangst van een daartoe strekkend schriftelijk
      verzoek van een postvervoerbedrijf een verklaring.
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel45
  - number: '46'
    text: |-
      De Autoriteit Consument en Markt is verantwoordelijke in de zin van
      [artikel 1, onderdeel d, van de Wet bescherming persoonsgegevens][ref1] voor de gegevensverzameling, bedoeld in
      [artikel 42, tweede lid][ref2], en voor het register, bedoeld in [artikel 44, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0025572#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0025572#Artikel44
