  - number: '47.1'
    text: |-
      De Autoriteit Consument en Markt kan bindende aanwijzingen geven in verband met de naleving van het bepaalde bij of
      krachtens deze wet, met uitzondering van [hoofdstuk 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Hoofdstuk11
    url: https://wetten.overheid.nl/BWBR0025572/2014-01-25#Artikel47
