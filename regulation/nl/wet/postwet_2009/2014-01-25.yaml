  - number: '49.1'
    text: |-
      De Autoriteit Consument en Markt kan in geval van overtreding van een bindende aanwijzing als bedoeld in
      [artikel 47, eerste lid][ref1], alsmede overtreding van het bepaalde bij of krachtens de [artikelen 4][ref2],
      [5][ref3], [8][ref4], [9][ref5], [10][ref6], [12][ref7], [13][ref8], [13b tot en met 13k][ref9],
      [16, vijfde tot en met negende lid][ref10], [18][ref11], [19][ref12], [22][ref13], [23][ref14], [24][ref15],
      [26][ref16], [27][ref17], [28][ref18], [31, vierde lid][ref19], [32][ref20], [35][ref21], [36][ref22],
      [39, eerste en derde lid][ref23], [41][ref24], [59][ref25], [61][ref26], [63, tweede lid][ref27], en [64][ref28]
      van deze wet, alsmede [artikel 5:20 van de Algemene wet bestuursrecht][ref29] de overtreder per overtreding een
      bestuurlijke boete opleggen van ten hoogste € 450 000 of, indien dat meer is, 10% van de relevante netto-omzet van
      de onderneming in Nederland.


