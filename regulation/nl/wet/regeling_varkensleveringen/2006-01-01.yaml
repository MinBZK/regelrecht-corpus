  - number: '1.2'
    text: Deze regeling berust mede op artikel 36 van het Uitvoeringsbesluit Meststoffenwet.
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel1
  - number: '2'
    text: 'De minister wijst op aanvraag van de exploitant diens varkenshouderijbedrijf aan als een A-bedrijf, indien:'
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel2
  - number: 2.a
    text: op het varkenshouderijbedrijf vrouwelijke varkens worden gehouden voor het bedrijfsmatig produceren van biggen;
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel2
  - number: 2.b
    text: |-
      varkens die op het varkenshouderijbedrijf worden aangevoerd, worden gehuisvest in een van de rest van het
      varkenshouderijbedrijf afgescheiden toevoegstal, waarvan inrichting en gebruik voldoen aan de in bijlage I bij
      deze regeling opgenomen voorschriften, totdat uit een door een dierenarts na vier weken na aanvoer overeenkomstig
      [bijlage II][ref1] uitgevoerd serologisch onderzoek blijkt dat in de toevoegstal geen varkens zijn aangetroffen
      waarvan het bloed antilichamen tegen klassieke varkenspest bevat;


      [ref1]: https://wetten.overheid.nl/BWBR0011101
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011101
  - number: 2.c
    text: |-
      bij het ontbreken van een toevoegstal als bedoeld in onderdeel b, tot zes weken na de laatste aanvoer van varkens
      geen varkens worden afgevoerd anders dan, hetzij rechtstreeks, hetzij via een verzamelcentrum, naar het slachthuis;
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel2
  - number: 2.d
    text: |-
      op het varkenshouderijbedrijf een voorziening voor reiniging en
      ontsmetting van vervoermiddelen voor varkens aanwezig is als bedoeld in
      __REF000___________________________________________________________________________________________________________
      _______________________;


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel59
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '59'
  - number: 2.e
    text: |-
      de exploitant van het varkenshouderijbedrijf [artikel 67, tweede lid][ref1], en
      __REF001___________________________________________________________________________________________________________
      __________ naleeft;


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0018397#Artikel79
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '67'
      - id: ref2
        bwb_id: BWBR0018397
        artikel: '79'
  - number: 2.f
    text: |-
      de exploitant voldoet aan alle, de herkomst van de op het varkenshouderijbedrijf aanwezige varkens betreffende,
      krachtens [artikel 96 van de wet][ref1] gestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel96
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '96'
  - number: 2.g
    text: |-
      op het varkenshouderijbedrijf een douche aanwezig is, die is gelegen in de onmiddellijke nabijheid van de ingang
      van het varkenshouderijbedrijf en waarvan bezoekers van het varkenshouderijbedrijf voorafgaand aan het betreden van
      de stallen gebruik maken;
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel2
  - number: 2.h
    text: |-
      het varkenshouderijbedrijf is voorzien van een erfafscheiding waardoor het betreden van het varkenshouderijbedrijf
      zonder de medewerking van de exploitant niet mogelijk is;
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel2
  - number: 2.i
    text: |-
      de exploitant van het varkenshouderijbedrijf de gegevens met betrekking tot groepsmedicatie in het logboek, bedoeld
      in [artikel 40, tweede lid, van de Diergeneesmiddelenwet][ref1] vastlegt;


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel40
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '40'
  - number: 2.j
    text: |-
      de exploitant van het varkenshouderijbedrijf, in geval van medicatie, de varkens die de medicatie hebben ondergaan
      niet eerder van het varkenshouderijbedrijf afvoert of doet afvoeren dan na twee weken na het beëindigen van de
      medicatie;
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel2
  - number: 2.k
    text: |-
      de exploitant van het varkenshouderijbedrijf bij de aanvraag en vervolgens eenmaal per vier weken een verklaring
      van een dierenarts overlegt waarin deze verklaart dat het in [bijlage II][ref1] bepaalde aantal op het
      varkenshouderijbedrijf aanwezige varkens met een gewicht van ten minste 30 kg serologisch is onderzocht en dat geen
      varkens zijn aangetroffen waarvan het bloed antilichamen tegen klassieke varkenspest bevat, en


      [ref1]: https://wetten.overheid.nl/BWBR0011101
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011101
  - number: 2.l
    text: |-
      de exploitant van het varkenshouderijbedrijf bij de aanvraag en vervolgens met een tussenpoos van vier maanden
      een volgens het model in [bijlage III][ref1] opgesteld bedrijfsrapport overlegt van een geaccrediteerde
      keuringsinstantie waaruit blijkt dat het varkenshouderijbedrijf is getoetst aan de in de onderdelen a tot en met j
      gestelde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0011101
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011101
  - number: '3'
    text: |-
      De minister wijst op aanvraag van de exploitant diens varkenshouderijbedrijf aan als een B-bedrijf, indien op het
      varkenshouderijbedrijf vrouwelijke varkens worden gehouden voor het bedrijfsmatig produceren van biggen.
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel3
  - number: '4'
    text: De minister wijst op aanvraag van de exploitant diens varkenshouderijbedrijf aan als een C-bedrijf, indien
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel4
  - number: 4.a
    text: |-
      het varkenshouderijbedrijf voldoet aan [artikel 2, onderdelen d tot en met k][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0011101#Artikel2
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011101
        artikel: '2'
        hoofdstuk: '2'
  - number: 4.b
    text: |-
      de exploitant van het varkenshouderijbedrijf bij de aanvraag en vervolgens met een tussenpose van
      vier maanden een volgens het model in [bijlage III][ref1] opgesteld bedrijfsrapport overlegt van een
      geaccrediteerde keuringsinstantie waaruit blijkt dat het varkenshouderijbedrijf is getoetst aan de in
      [artikel 2, onderdelen d tot en met j][ref2], gestelde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0011101
      [ref2]: https://wetten.overheid.nl/BWBR0011101#Artikel2
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011101
      - id: ref2
        bwb_id: BWBR0011101
        artikel: '2'
        hoofdstuk: '2'
  - number: '5.1'
    text: |-
      De minister kan de aanwijzing als A-bedrijf, B-bedrijf of C-bedrijf met onmiddellijke ingang schorsen voor een
      bepaalde termijn, indien:
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel5
  - number: 5.1.a
    text: |-
      het varkenshouderijbedrijf niet voldoet aan de eisen, bedoeld in de [artikelen 2][ref1], [3][ref2],
      onderscheidenlijk [4][ref3], en veterinaire belangen de schorsing rechtvaardigen, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0011101#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011101#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011101#Artikel4
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011101
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0011101
        artikel: '3'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0011101
        artikel: '4'
        hoofdstuk: '2'
  - number: 5.1.b
    text: |-
      blijkt dat in een periode van twaalf maanden de exploitant van een varkenshouderijbedrijf meer dan eenmaal
      varkens van het varkenshouderijbedrijf afvoert of doet afvoeren, dan wel op het varkenshouderijbedrijf ontvangt of
      aanvoert, zonder dat wordt voldaan aan de [artikelen 9][ref1], [10][ref2], onderscheidenlijk [11][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011101#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011101#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0011101#Artikel11
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011101
        artikel: '9'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0011101
        artikel: '10'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0011101
        artikel: '11'
        hoofdstuk: '3'
  - number: '5.2'
    text: |-
      De minister kan de schorsing, bedoeld in het eerste lid, onderdeel a, telkens verlengen voor een termijn van ten
      hoogste vier weken.
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel5
  - number: '5.3'
    text: |-
      In geval van schorsing van de aanwijzing, bedoeld in het eerste lid, zijn de [artikelen 9][ref1], [10][ref2] en
      [11][ref3] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011101#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011101#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0011101#Artikel11
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011101
        artikel: '9'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0011101
        artikel: '10'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0011101
        artikel: '11'
        hoofdstuk: '3'
  - number: '5.4'
    text: 'De minister kan de aanwijzing als A-bedrijf, B-bedrijf of C-bedrijf intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel5
  - number: 5.4.a
    text: |-
      blijkt dat het varkenshouderijbedrijf niet voldoet aan de eisen, bedoeld in de [artikelen 2][ref1], [3][ref2],
      onderscheidenlijk [4][ref3], terwijl de exploitant van het varkenshouderijbedrijf in de gelegenheid is gesteld
      binnen een bepaalde termijn alsnog aan de eisen te voldoen en deze termijn inmiddels is verstreken, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0011101#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011101#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011101#Artikel4
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011101
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0011101
        artikel: '3'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0011101
        artikel: '4'
        hoofdstuk: '2'
  - number: 5.4.b
    text: |-
      na afloop van de schorsing, bedoeld in het eerste lid, aanhef en onderdeel a, blijkt dat het varkenshouderijbedrijf
      nog steeds niet voldoet aan de eisen, bedoeld in de [artikelen 2][ref1], [3][ref2], onderscheidenlijk [4][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0011101#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011101#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011101#Artikel4
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011101
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0011101
        artikel: '3'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0011101
        artikel: '4'
        hoofdstuk: '2'
  - number: 5.4.c
    text: |-
      blijkt dat in een periode van twaalf maanden na het besluit tot schorsen, bedoeld in het eerste lid, aanhef en
      onderdeel b, de exploitant van een varkenshouderijbedrijf opnieuw varkens van het varkenshouderijbedrijf afvoert
      of doet afvoeren, dan wel op het varkenshouderijbedrijf ontvangt of aanvoert, zonder dat wordt voldaan aan de
      [artikelen 9][ref1], [10][ref2], onderscheidenlijk [11][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011101#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011101#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0011101#Artikel11
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011101
        artikel: '9'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0011101
        artikel: '10'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0011101
        artikel: '11'
        hoofdstuk: '3'
  - number: '6'
    text: |-
      Aanvragen, verklaringen en bedrijfsrapporten als bedoeld in de [artikelen 2][ref1], [3][ref2] en [4][ref3] worden
      ingediend bij het I&RVL.


      [ref1]: https://wetten.overheid.nl/BWBR0011101#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011101#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011101#Artikel4
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011101
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0011101
        artikel: '3'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0011101
        artikel: '4'
        hoofdstuk: '2'
  - number: '7'
    text: |-
      Het is de exploitant van een varkenshouderijbedrijf verboden een of meer varkens te vervoeren van of naar, af te
      voeren of te doen afvoeren van een varkenshouderijbedrijf of een verzamelcentrum, dan wel te ontvangen of aan te
      voeren op een varkenshouderijbedrijf.
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel7
  - number: '8'
    text: |-
      Het verbod, bedoeld in [artikel 7][ref1], is niet van toepassing op het vervoeren, afvoeren of doen afvoeren van:


      [ref1]: https://wetten.overheid.nl/BWBR0011101#Artikel7
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011101
        artikel: '7'
        hoofdstuk: '3'
  - number: 8.a
    text: |-
      een of meer varkens van een varkenshouderijbedrijf naar een slachthuis, hetzij rechtstreeks, hetzij via
      een verzamelcentrum, mits de varkens zijn gemerkt als slachtvarkens en uit het vervoersdocument, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ________________________ blijkt dat sprake is van vervoer van slachtdieren;


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel74
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '74'
  - number: 8.b
    text: een of meer mannelijke varkens van een varkenshouderijbedrijf naar een quarantaineruimte;
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel8
  - number: 8.c
    text: een of meer varkens van een varkenshouderijbedrijf naar een onderzoeksinstituut;
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel8
  - number: 8.d
    text: |-
      ten hoogste vier varkens per levering van een varkenshouderijbedrijf naar een locatie waar varkens worden gehouden
      voor recreatieve of educatieve doeleinden, of
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel8
  - number: 8.e
    text: |-
      een of meer varkens van een varkenshouderijbedrijf, niet zijnde een D-bedrijf, naar een varkenshouderijbedrijf
      buiten Nederland, hetzij rechtstreeks, hetzij via een verzamelcentrum.
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel8
  - number: 8a
    text: |-
      Indien voor het vervoer van varkens naar een lidstaat of een derde land, nadat deze reeds van een
      varkenshouderijbedrijf zijn afgevoerd, ingevolge [artikel 59, tweede lid, onderdeel e, van de wet][ref1] in
      samenhang met [artikel 6, eerste lid, van het Besluit dierenvervoer 1994][ref2] geen certificaat wordt afgegeven,
      is het de exploitant van het varkenshouderijbedrijf van herkomst in afwijking van [artikel 7][ref3] toegestaan,
      deze varkens op de dag dat dit certificaat geweigerd wordt weer op zijn bedrijf te ontvangen of aan te voeren en,
      na gedeeltelijk lossing, de niet geloste varkens vervolgens wederom van zijn bedrijf te vervoeren, af te voeren of
      te doen afvoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0006990#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0011101#Artikel7
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '59'
      - id: ref2
        bwb_id: BWBR0006990
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0011101
        artikel: '7'
        hoofdstuk: '3'
  - number: '9.1'
    text: |-
      In afwijking van [artikel 7][ref1] is het de exploitant van een A-bedrijf toegestaan een of meer varkens naar dat
      bedrijf te vervoeren of te doen vervoeren en op dat bedrijf aan te voeren en te ontvangen, voorzover:


      [ref1]: https://wetten.overheid.nl/BWBR0011101#Artikel7
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011101
        artikel: '7'
        hoofdstuk: '3'
  - number: 9.1.a
    text: |-
      vrouwelijke varkens worden aangevoerd afkomstig van ten hoogste één A-bedrijf, C-bedrijf of varkenshouderijbedrijf
      buiten Nederland;
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel9
  - number: 9.1.b
    text: |-
      mannelijke varkens worden aangevoerd afkomstig van ten hoogste één A-bedrijf, C-bedrijf, varkenshouderijbedrijf
      buiten Nederland, spermawincentrum of quarantaineruimte;
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel9
  - number: 9.1.c
    text: |-
      in een periode van ten minste zes weken voorafgaand aan de dag van aanvoer geen varkens op het A-bedrijf zijn
      aangevoerd, en
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel9
  - number: 9.1.d
    text: |-
      de aangevoerde varkens na aanvoer worden gehouden in een toevoegstal als bedoeld in [artikel 2, onderdeel b][ref1],
      totdat uit het in [artikel 2, onderdeel b][ref2], bedoelde serologisch onderzoek blijkt dat geen varkens zijn
      aangetroffen waarvan het bloed antilichamen tegen klassieke varkenspest bevat, dan wel binnen zes weken na aanvoer
      geen varkens worden afgevoerd anders dan rechtstreeks naar een slachthuis.


      [ref1]: https://wetten.overheid.nl/BWBR0011101#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011101#Artikel2
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011101
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0011101
        artikel: '2'
        hoofdstuk: '2'
  - number: '9.2'
    text: |-
      In afwijking van [artikel 7][ref1] is het de exploitant van een A-bedrijf toegestaan een of meer varkens van dat
      bedrijf te vervoeren, doen vervoeren, af te voeren of te doen afvoeren, voorzover:


      [ref1]: https://wetten.overheid.nl/BWBR0011101#Artikel7
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011101
        artikel: '7'
        hoofdstuk: '3'
  - number: 9.2.a
    text: varkens worden afgevoerd naar A-bedrijven, B-bedrijven, D-bedrijven, of
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel9
  - number: 9.2.b
    text: varkens worden afgevoerd naar ten hoogste één cluster.
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel9
  - number: '9.3'
    text: |-
      De exploitant van het A-bedrijf kan in een periode van twaalf maanden eenmaal een ander aanvoeradres kiezen ter
      vervanging van het aanvoeradres, bedoeld in het eerste lid, onderdeel a, onderscheidenlijk b.
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel9
  - number: '10.1'
    text: |-
      In afwijking van [artikel 7][ref1] is het de exploitant van een B-bedrijf toegestaan een of meer varkens naar dat
      bedrijf te vervoeren of te doen vervoeren en op dat bedrijf aan te voeren en te ontvangen, voorzover:


      [ref1]: https://wetten.overheid.nl/BWBR0011101#Artikel7
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011101
        artikel: '7'
        hoofdstuk: '3'
  - number: 10.1.a
    text: |-
      vrouwelijke varkens worden aangevoerd afkomstig van ten hoogste één A-bedrijf, C-bedrijf of varkenshouderijbedrijf
      buiten Nederland;
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel10
  - number: 10.1.b
    text: |-
      mannelijke varkens worden aangevoerd afkomstig van ten hoogste één A-bedrijf, C-bedrijf, varkenshouderijbedrijf
      buiten Nederland, spermawincentrum of quarantaineruimte;
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel10
  - number: 10.1.c
    text: de aan te voeren varkens een gewicht hebben van ten minste 25 kg per dier, en
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel10
  - number: 10.1.d
    text: de periode tussen het aanvoeren van varkens ten minste zes weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel10
  - number: '10.2'
    text: |-
      In afwijking van [artikel 7][ref1] is het de exploitant van een B-bedrijf toegestaan een of meer varkens van dat
      bedrijf te vervoeren, doen vervoeren, af te voeren of te doen afvoeren, voorzover in een periode van vier weken
      slechts varkens worden afgevoerd naar ten hoogste vier D-bedrijven en in een periode van twaalf maanden slechts
      varkens worden afgevoerd naar ten hoogste twaalf D-bedrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0011101#Artikel7
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011101
        artikel: '7'
        hoofdstuk: '3'
  - number: '10.3'
    text: |-
      Indien de exploitant van een B-bedrijf varkens vervoert, doet vervoeren, afvoert of doet afvoeren naar een D-
      bedrijf waarop in een periode van drie weken voorafgaand aan de dag van afvoer van het B-bedrijf op enig tijdstip
      geen varkens aanwezig waren en de stallen op dat tijdstip zijn gereinigd en ontsmet, terwijl in een periode van
      twee maanden voor dat tijdstip geen varkens op het D-bedrijf zijn aangevoerd, is deze levering in afwijking van
      [artikel 7][ref1] toegestaan, zonder dat deze levering wordt begrepen in de op grond van het tweede lid toegestane
      leveringen.


      [ref1]: https://wetten.overheid.nl/BWBR0011101#Artikel7
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011101
        artikel: '7'
        hoofdstuk: '3'
  - number: '10.4'
    text: |-
      De exploitant van het B-bedrijf kan in een periode van twaalf maanden eenmaal een ander aanvoeradres kiezen ter
      vervanging van het aanvoeradres, bedoeld in het eerste lid, onderdeel a, onderscheidenlijk b.
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel10
  - number: '10.5'
    text: |-
      Het afvoeren van varkens van een B-bedrijf overeenkomstig het tweede of derde lid is slechts toegestaan voor op het
      B-bedrijf geboren varkens met een gewicht van ten hoogste 35 kg.
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel10
  - number: '11.1'
    text: |-
      In afwijking van [artikel 7][ref1] is het de exploitant van een C-bedrijf toegestaan een of meer varkens naar dat
      bedrijf te vervoeren of te doen vervoeren en op dat bedrijf aan te voeren en te ontvangen, voorzover varkens worden
      aangevoerd afkomstig van ten hoogste één A-bedrijf of varkenshouderijbedrijf buiten Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0011101#Artikel7
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011101
        artikel: '7'
        hoofdstuk: '3'
  - number: '11.2'
    text: |-
      In afwijking van [artikel 7][ref1] is het de exploitant van een C-bedrijf toegestaan een of meer varkens van dat
      bedrijf te vervoeren, doen vervoeren, af te voeren of te doen afvoeren, voorzover: a. varkens worden afgevoerd
      naar een A-bedrijf, of b. in een periode van twaalf maanden slechts varkens worden afgevoerd naar ten hoogste 30 B-
      bedrijven en D-bedrijven gezamenlijk, dan wel 1e. wanneer het C-bedrijf deel uitmaakt van een cluster van twee C-
      bedrijven, in een periode van twaalf maanden door het cluster slechts varkens worden afgevoerd naar ten hoogste
      26 B-bedrijven en D-bedrijven gezamenlijk; 2e. wanneer het C-bedrijf deel uitmaakt van een cluster van drie C-
      bedrijven, in een periode van twaalf maanden door het cluster slechts varkens worden afgevoerd naar ten hoogste 22
      B-bedrijven en D-bedrijven gezamenlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0011101#Artikel7
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011101
        artikel: '7'
        hoofdstuk: '3'
  - number: '11.3'
    text: |-
      Het afvoeren van varkens van een C-bedrijf naar een D-bedrijf overeenkomstig het tweede lid is slechts toegestaan
      voor varkens met een gewicht van ten minste 80 kg.
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel11
  - number: '11.4'
    text: |-
      De exploitant van een A-bedrijf doet bij de aanvraag, bedoeld in [artikel 2][ref1], opgave van de samenstelling
      van het cluster als bedoeld in [artikel 9, tweede lid, onderdeel b][ref2]. De exploitanten van de betreffende C-
      bedrijven medeondertekenen deze opgave. De opgave bevat de verdeling onder de betreffende C-bedrijven van het
      aantal afvoeradressen, bedoeld in het tweede lid, onderdeel b, onder 1e of 2e. Het is de exploitant van een C-
      bedrijf slechts toegestaan een of meer varkens van dat bedrijf te vervoeren, doen vervoeren, af te voeren of
      te doen afvoeren, als bedoeld in het tweede lid, onderdeel b, onder 1e of 2e, indien daarmee het aantal bij de
      verdeling aan dat bedrijf toebedeelde afleveradressen niet wordt overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0011101#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011101#Artikel9
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011101
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0011101
        artikel: '9'
        hoofdstuk: '3'
  - number: '11.5'
    text: |-
      De samenstelling van een cluster en de verdeling van het aantal afvoeradressen kunnen in een periode van twaalf
      maanden eenmaal worden gewijzigd. Een wijziging van de samenstelling van het cluster en de verdeling van het
      aantal afvoeradressen wordt bij het I&RVL gemeld voorafgaand aan de toepassing van de wijziging. De melding wordt
      ondertekend door de exploitanten van het A-bedrijf en de betreffende C-bedrijven.
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel11
  - number: '12.1'
    text: |-
      In afwijking van [artikel 7][ref1] is het de exploitant van een D-bedrijf toegestaan een of meer varkens naar dat
      bedrijf te vervoeren of te doen vervoeren en op dat bedrijf aan te voeren en te ontvangen, voorzover in een periode
      van de zestien weken slechts varkens worden aangevoerd, afkomstig van ten hoogste drie A-bedrijven, B-bedrijven,
      C-bedrijven, varkenshouderijbedrijven buiten Nederland of verzamelcentra gezamenlijk, waarvan ten hoogste één
      verzamelcentrum.


      [ref1]: https://wetten.overheid.nl/BWBR0011101#Artikel7
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011101
        artikel: '7'
        hoofdstuk: '3'
  - number: '12.2'
    text: |-
      Indien op het D-bedrijf in een periode van drie weken voorafgaand aan de dag van aanvoer op enig tijdstip geen
      varkens aanwezig waren en de stallen op dat tijdstip zijn gereinigd en ontsmet, terwijl in een periode van twee
      maanden voor dat tijdstip geen varkens op het D-bedrijf zijn aangevoerd, is het in afwijking van het eerste lid de
      exploitant van een D-bedrijf toegestaan een of meer varkens naar dat bedrijf te vervoeren of te doen vervoeren en
      op dat bedrijf aan te voeren en te ontvangen, voorzover in een periode van de zestien weken slechts varkens worden
      aangevoerd, afkomstig van ten hoogste zes A-bedrijven, B-bedrijven, C-bedrijven, varkenshouderijbedrijven buiten
      Nederland of verzamelcentra gezamenlijk, waarvan ten hoogste één verzamelcentrum.
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel12
  - number: '13.1'
    text: |-
      Het verbod, bedoeld in [artikel 7][ref1], is niet van toepassing op het, hetzij rechtstreeks, hetzij via een
      Nederlands verzamelcentrum, aanvoeren en ontvangen op een varkenshouderijbedrijf van een of meer varkens afkomstig
      van een varkenshouderijbedrijf of verzamelcentrum buiten Nederland, voorzover:


      [ref1]: https://wetten.overheid.nl/BWBR0011101#Artikel7
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011101
        artikel: '7'
        hoofdstuk: '3'
  - number: 13.1.a
    text: |-
      de varkens voldoen aan alle van toepassing zijnde communautaire en overige internationale veterinaire
      voorschriften;
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel13
  - number: 13.1.b
    text: |-
      de exploitant van het varkenshouderijbedrijf waarop de varkens worden ontvangen, ten minste één werkdag vóór de
      periode van 48 uur waarbinnen de voorgenomen ontvangst zal plaatsvinden, die voorgenomen ontvangst bij het I&RVL
      meldt, door middel van een per fax verzonden door het I&RVL verstrekt volledig ingevuld formulier, dan wel via het
      voice response systeem van het I&RVL, dan wel, indien het I&RVL met deze wijze van melden vooraf heeft ingestemd,
      via electronische data interchange;
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel13
  - number: 13.1.c
    text: |-
      bij de melding als bedoeld in onderdeel b de gegevens worden verstrekt die moeten zijn opgenomen in het
      gezondheidscertificaat van bijlage F, model 2, van [richtlijn nr. 64/432/EEG](31964L0432) van de Raad
      van de Europese Gemeenschappen van 26 juni 1964 inzake veterinairrechtelijke vraagstukken op het gebied
      van het intracommunautaire handelsverkeer in runderen en varkens (PbEG L 121), dan wel artikel 11 van
      [richtlijn nr. 72/462/EEG](31972L0462) van de Raad van de Europese Gemeenschappen van 12 december 1972 inzake
      gezondheidsvraagstukken en veterinairrechtelijke vraagstukken bij de invoer van runderen, varkens, schapen en
      geiten, van vers vlees of vleesprodukten uit derde landen (PbEG L 302);
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel13
  - number: 13.1.d
    text: |-
      de exploitant van het varkenshouderijbedrijf medewerking verleent aan bestemmingscontrole van de varkens op
      zijn bedrijf overeenkomstig artikel 5 van [richtlijn nr. 90/425/EEG](31990L0425) van de Raad van de Europese
      Gemeenschappen van 26 juni 1990 inzake veterinaire en zoötechnische controles in het intracommunautair
      handelsverkeer in bepaalde levende dieren en produkten in het vooruitzicht van de totstandbrenging van de interne
      markt (PbEG L 224);
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel13
  - number: 13.1.e
    text: |-
      de varkens geen onderdeel hebben gevormd van een beslag dat in een periode van een jaar voorafgaand aan de
      ontvangst van de varkens vanuit Nederland buiten Nederland is gebracht.
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel13
  - number: '13.2'
    text: |-
      Een levering als bedoeld in het eerste lid wordt in mindering gebracht op het aantal op grond van de
      [artikelen 9, eerste lid][ref1], [10, eerste lid][ref2], [11, eerste lid][ref3], onderscheidenlijk [12][ref4] op
      een varkenshouderijbedrijf toegestane leveringen.


      [ref1]: https://wetten.overheid.nl/BWBR0011101#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011101#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0011101#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0011101#Artikel12
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011101
        artikel: '9'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0011101
        artikel: '10'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0011101
        artikel: '11'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0011101
        artikel: '12'
        hoofdstuk: '3'
  - number: '13.3'
    text: |-
      Op een levering als bedoeld in het eerste lid zijn de [artikelen 9, eerste lid, onderdelen c en d][ref1] en
      [10, eerste lid, onderdelen c en d][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011101#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011101#Artikel10
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011101
        artikel: '9'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0011101
        artikel: '10'
        hoofdstuk: '3'
  - number: '14'
    text: |-
      Leveringen van varkens door of aan een varkenshouderijbedrijf of aan een verzamelcentrum waarvan
      de exploitatie nadien blijvend is gestaakt, worden niet begrepen onder de op grond van de
      [artikelen 9, eerste lid, onderdelen a en b][ref1], [10, eerste lid, onderdelen a en b, en tweede lid][ref2],
      [11, eerste lid, en tweede lid, onderdeel b][ref3], en [12, eerste en tweede lid][ref4], toegestane leveringen,
      indien door de levering door of aan het bedrijf waarvan de exploitatie blijvend is gestaakt het in genoemde
      artikelen opgenomen maximum aantal toegestane leveringen wordt bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0011101#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011101#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0011101#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0011101#Artikel12
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0011101
        artikel: '9'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0011101
        artikel: '10'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0011101
        artikel: '11'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0011101
        artikel: '12'
        hoofdstuk: '3'
  - number: '15.1'
    text: |-
      In afwijking van [artikel 7][ref1] is het de exploitant toegestaan een of meer vrouwelijke varkens die worden
      gehouden voor het bedrijfsmatig produceren van biggen van zijn varkenshouderijbedrijf te vervoeren, doen vervoeren,
      af te voeren of te doen afvoeren, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011101#Artikel7
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0011101
        artikel: '7'
        hoofdstuk: '3'
  - number: 15.1.a
    text: de exploitant van het varkenshouderijbedrijf zijn bedrijf beëindigt;
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel15
  - number: 15.1.b
    text: de vrouwelijke varkens worden afgevoerd naar ten hoogste twee A-bedrijven, B-bedrijven of D-bedrijven;
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel15
  - number: 15.1.c
    text: zes weken voorafgaand aan het afvoeren geen varkens op het varkenshouderijbedrijf zijn aangevoerd, en
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel15
  - number: 15.1.d
    text: |-
      uiterlijk twee weken vóór de datum waarop de varkens worden afgevoerd uit een door een dierenarts uitgevoerd
      serologisch onderzoek op ten minste twaalf op het varkenshouderijbedrijf aanwezige vrouwelijke varkens blijkt dat
      de aanwezige varkens niet zijn besmet met klassieke varkenspest.
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel15
  - number: '15.2'
    text: |-
      Bij toepassing van het eerste lid is het in afwijking van [artikel 7][ref1], de exploitanten van de A-bedrijven, B-
      bedrijven of D-bedrijven, bedoeld in het eerste lid, onderdeel b, toegestaan de vrouwelijke varkens te ontvangen en
      aan te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0011101#Artikel7
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0011101
        artikel: '7'
        hoofdstuk: '3'
  - number: '16.1'
    text: |-
      De exploitant van het varkenshouderijbedrijf waarvan varkens worden afgevoerd, meldt ten minste één werkdag vóór
      de periode van 48 uur waarbinnen de voorgenomen levering zal plaatsvinden, die voorgenomen levering bij het I&RVL,
      door middel van een per fax verzonden door het I&RVL verstrekt volledig ingevuld formulier, dan wel via het voice
      response systeem van het I&RVL, dan wel, indien het I&RVL met deze wijze van melden vooraf heeft ingestemd, via
      electronische data interchange.
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel16
  - number: '16.2'
    text: |-
      De exploitant van het varkenshouderijbedrijf waarvan varkens worden afgevoerd, dan wel diens vervoerder, toont
      tijdens het vervoer op eerste vordering van een op grond van [artikel 114, eerste lid, van de wet][ref1] aangewezen
      toezichthouder de bevestigde melding levering varkens, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel114
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '114'
  - number: '16.3'
    text: |-
      Indien de melding, bedoeld in het eerste lid, betrekking heeft op de levering van varkens aan een D-
      bedrijf als bedoeld in [artikel 10, derde lid][ref1], onderscheidenlijk een D-bedrijf als bedoeld in
      [artikel 12, tweede lid][ref2], gaat de melding vergezeld van een door een geaccrediteerde keuringsinstantie
      opgesteld rapport waaruit blijkt dat het D-bedrijf voldoet aan [artikel 10, derde lid][ref3]. Bij ontbreken van een
      rapport van een geaccrediteerde keuringsinstantie geldt de melding als een melding ten behoeve van het vervoer van
      varkens, bedoeld in [artikel 10, tweede lid][ref4], onderscheidenlijk [artikel 12, eerste lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0011101#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011101#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0011101#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0011101#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0011101#Artikel12
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011101
        artikel: '10'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0011101
        artikel: '12'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0011101
        artikel: '10'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0011101
        artikel: '10'
        hoofdstuk: '3'
      - id: ref5
        bwb_id: BWBR0011101
        artikel: '12'
        hoofdstuk: '3'
  - number: '16.4'
    text: |-
      De bevestigde melding levering varkens wordt door de ontvanger van de varkens op het varkenshouderijbedrijf bewaard
      tot zes maanden na de datum waarop de varkens op het varkenshouderijbedrijf zijn ontvangen.
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel16
  - number: '16.5'
    text: |-
      De exploitant van het varkenshouderijbedrijf die bij het I&RVL een voorgenomen levering heeft gemeld, zendt de
      bevestigde melding levering varkens binnen één week aan het I&RVL terug, indien de levering waarop de melding
      betrekking heeft niet heeft plaats gehad, dan wel indien het aantal geleverde varkens afwijkt van het gemelde
      aantal. De exploitant doet daarbij opgave van het feitelijk geleverde aantal varkens.
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel16
  - number: '16.6'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op het vervoer, de afvoer, de ontvangst en de aflevering van
      varkens, bedoeld in [artikel 8, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011101#Artikel8
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011101
        artikel: '8'
        hoofdstuk: '3'
  - number: '16.7'
    text: |-
      In afwijking van het eerste lid geschiedt de melding bij aanvoer van varkens uit het buitenland, door de exploitant
      van het varkenshouderijbedrijf waarheen varkens worden aangevoerd. Het tweede lid is niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel16
  - number: '16.8'
    text: |-
      Het eerste en het tweede lid zijn niet van toepassing op het wederom vervoeren, afvoeren of doen afvoeren van de
      niet geloste varkens als bedoeld in [artikel 8a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011101#Artikel8a
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011101
        artikel: 8a
        hoofdstuk: '3'
  - number: '17.1'
    text: |-
      De exploitant van een varkenshouderijbedrijf weigert de ontvangst van varkens indien bij de aanvoer een bevestigde
      melding levering varkens met betrekking tot deze aanvoer ontbreekt.
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel17
  - number: '17.2'
    text: |-
      Een vervoerder weigert het vervoer van de varkens indien een bevestigde melding levering varkens met betrekking
      tot dit vervoer ontbreekt, tenzij de varkens zijn gemerkt als slachtvarkens en uit het vervoersdocument, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ________________________ blijkt dat sprake is van vervoer van slachtvarkens.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel74
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '74'
  - number: '17.3'
    text: |-
      De exploitant van een verzamelcentrum weigert de ontvangst van varkens indien een
      bevestigde melding levering varkens met betrekking tot deze aanvoer ontbreekt, tenzij
      de varkens zijn gemerkt als slachtvarkens en uit het vervoersdocument, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ________________________ blijkt dat sprake is van vervoer van slachtvarkens.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel74
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '74'
  - number: '20'
    text: De Regeling vervoersbeperkingen varkens wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel20
  - number: '1'
    text: |-
      Deze regeling treedt in werking met ingang van de eerste dag van de derde maand na de dagtekening van de
      Staatscourant waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel21
  - number: '2'
    text: |-
      In afwijking van het eerste lid treden de [artikelen 2][ref1], [3][ref2], [4][ref3], [11, vierde lid][ref4],
      [18][ref5] en [19, eerste, vierde en zesde lid][ref6], in werking met ingang van de eerste dag na de dagtekening
      van de Staatscourant waarin zij wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0011101#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011101#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011101#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0011101#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0011101#Artikel18
      [ref6]: https://wetten.overheid.nl/BWBR0011101#Artikel19
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0011101
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0011101
        artikel: '3'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0011101
        artikel: '4'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0011101
        artikel: '11'
        hoofdstuk: '3'
      - id: ref5
        bwb_id: BWBR0011101
        artikel: '18'
        hoofdstuk: '5'
      - id: ref6
        bwb_id: BWBR0011101
        artikel: '19'
        hoofdstuk: '5'
  - number: '22'
    text: 'Deze regeling wordt aangehaald als: Regeling varkensleveringen.'
    url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#Artikel22
