preamble:
  text: |-
    Gelet op artikel 14, eerste lid, van richtlijn nr. 64/432/EEG van de Raad van de Europese Gemeenschappen van 26
    juni 1964 inzake veterinairrechtelijke vraagstukken op het gebied van het intracommunautaire handelsverkeer in
    runderen en varkens (PbEG L 121);

    Gelet op de artikelen 17, eerste lid, 18 en 30, eerste lid, van de Gezondheids- en welzijnswet voor dieren;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0011101/2006-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

              a

                *minister:*


                Minister van Landbouw, Natuurbeheer en Visserij;



              b

                *wet:*


                [Gezondheids- en welzijnswet voor dieren][ref1];



              c

                *varkenshouderijbedrijf:*


                locatie van een landbouwbedrijf, niet zijnde een spermawincentrum of een quarantaineruimte, waar, anders
      dan voor recreatieve of educatieve doeleinden, een of meer varkens worden gehouden dan wel een locatie die voor het
      zodanig houden bestemd is;



              d

                *spermawincentrum:*


                spermawincentrum dat is erkend krachtens artikel 5 van [richtlijn nr. 90/429/EEG](31990L0429) van de Raad
      van de Europese Gemeenschappen van 26 juni 1990 tot vaststelling van de veterinairrechtelijke voorschriften van
      toepassing op het intracommunautaire handelsverkeer in sperma van varkens en de invoer daarvan (PbEG L 224) dan wel
      krachtens [artikel 3, eerste lid, van het Besluit eisen dierlijk sperma en spermawincentra][ref2];



              e

                *quarantaineruimte:*


                afzonderingsruimte die is erkend krachtens bijlage B, hoofdstuk 1, artikel 1, onderdeel a,
      van [richtlijn nr. 90/429/EEG](31990L0429) van de Raad van de Europese Gemeenschappen van 26 juni 1990
      tot vaststelling van de veterinairrechtelijke voorschriften van toepassing op het intracommunautaire
      handelsverkeer in sperma van varkens en de invoer daarvan (PbEG L 224) dan wel krachtens
      [artikel 3 van het Besluit eisen dierlijk sperma en spermawincentra][ref3];



              f

                *A-bedrijf:*


                varkenshouderijbedrijf dat krachtens [artikel 2][ref4] is aangewezen als A-bedrijf;



              g

                *B-bedrijf:*


                varkenshouderijbedrijf dat krachtens [artikel 3][ref5] is aangewezen als B-bedrijf;



              h

                *C-bedrijf:*


                varkenshouderijbedrijf dat krachtens [artikel 4][ref6] is aangewezen als C-bedrijf;



              i

                *D-bedrijf:*


                varkenshouderijbedrijf dat niet is aangewezen als een A-bedrijf, een B-bedrijf of een C-bedrijf;



              j

                *geaccrediteerde keuringsinstantie:*


                keuringsinstantie, waarvan
                door de Nederlandse Raad voor Accreditatie of een gelijkwaardige buitenlandse instantie is verklaard
      dat de keuringsinstantie voldoet aan de criteria van EN 45004 en ISO 17020 en de relevante criteria van ISO
      9001/9002, voorzover deze verklaring betrekking heeft op het opstellen van de in [artikel 2, onderdeel l][ref7],
      [artikel 4, onderdeel b][ref8], of [artikel 16, derde lid][ref9], genoemde rapporten, dan wel,
      door de Nederlandse Raad voor Accreditatie of een gelijkwaardige buitenlandse instantie is verklaard dat de
      keuringsinstantie voldoet aan de criteria van EN 45004 en ISO 17020 en de relevante criteria van ISO 9001/9002,
      voorzover deze verklaring betrekking heeft op verrichtingen in de veehouderij, en de keuringsinstantie aan de
      Nederlandse Raad voor Accreditatie of een gelijkwaardige buitenlandse instantie heeft verzocht te verklaren dat
      de keuringsinstantie aan genoemde criteria voldoet met betrekking tot de in [artikel 2, onderdeel l][ref10],
      [artikel 4, onderdeel b][ref11], of [artikel 16, derde lid][ref12], genoemde rapporten en dit verzoek niet is
      afgewezen;



              k

                *I&RVL:*


                Identificatie & Registratiebureau Varkensleveringen te Deventer;



              l

                *onderzoeksinstituut:*


                instituut als bedoeld in [artikel 8 van de Wet op de dierproeven][ref13], niet zijnde een A-bedrijf, B-
      bedrijf of C-bedrijf;



              m

                *verzamelcentrum:*


                verzamelcentrum voor varkens dat is erkend krachtens artikel 11 van [richtlijn nr. 64/432/EEG]
      (31964L0432) van de Raad van de Europese Gemeenschappen van 26 juni 1964 inzake veterinairrechtelijke vraagstukken
      op het gebied van het intracommunautaire handelsverkeer in runderen en varkens (PbEG L 121);



              n

                *cluster:*


                combinatie van ten hoogste drie C-bedrijven, overeenkomstig de opgave van
      [artikel 11, vierde lid][ref14];



              o

                *bevestigde melding levering varkens:*


                door het I&RVL afgegeven ontvangstbevestiging van een overeenkomstig [artikel 16, eerste lid][ref15],
      ingediende melding van een voorgenomen levering van varkens.


