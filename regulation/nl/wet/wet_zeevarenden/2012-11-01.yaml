  - number: 48c.2
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de inhoud van de verklaring naleving maritieme
      arbeid deel I voor verschillende categorieën van schepen, waarbij een opsomming wordt voorgeschreven van alle in
      het eerste lid bedoelde eisen die op de desbetreffende schepen van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel48c
  - number: 48c.3
    text: 'Bij ministeriële regeling worden regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel48c
  - number: 48c.3.a
    text: |-
      de onderzoeken waaraan schepen zijn onderworpen ter verkrijging en verlenging van een certificaat maritieme arbeid
      of tijdens de geldigheidsduur daarvan, alsmede de inhoud van die onderzoeken en de frequentie waarmee zij worden
      verricht;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel48c
  - number: 48c.3.b
    text: de registratie van de bij de inspectie verzamelde onderzoeksgegevens;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel48c
  - number: 48c.3.c
    text: de geldigheid van het certificaat maritieme arbeid en de verlenging van de geldigheidsduur daarvan;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel48c
  - number: 48c.3.d
    text: de voorwaarden voor afgifte van tijdelijke of voorlopige certificaten maritieme arbeid.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel48c
  - number: 48c.4
    text: 'Bij ministeriële regeling worden regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel48c
  - number: 48c.4.a
    text: de bij een aanvraag als bedoeld in het eerste lid te verstrekken gegevens en te overleggen bescheiden; en
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel48c
  - number: 48c.4.b
    text: de modellen van het certificaat maritieme arbeid en het voorlopige certificaat maritieme arbeid.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel48c
  - number: 48c.5
    text: |-
      Op verzoek van de scheepsbeheerder geeft Onze Minister voor schepen kleiner dan 500 GT overeenkomstig het bepaalde
      bij of krachtens dit artikel een certificaat maritieme arbeid af.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel48c
  - number: 48c.6
    text: Het bepaalde bij of krachtens dit artikel is niet van toepassing op vissersvaartuigen.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel48c
  - number: 48d.1
    text: |-
      De door Onze Minister aangewezen ambtenaren zijn belast met het verrichten van onderzoeken als bedoeld in
      [artikel 48c, derde lid, onderdeel a][ref1]. Deze onderzoeken kunnen tevens geheel of ten dele worden verricht door
      daartoe door Onze Minister aangewezen rechtspersonen.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel48c
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel48d
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: 48c
        hoofdstuk: 4B
  - number: 48d.2
    text: Aan een aanwijzing als bedoeld in het eerste lid kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel48d
  - number: 48d.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de aanwijzing van natuurlijke
      personen of rechtspersonen krachtens het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel48d
  - number: 48d.4
    text: |-
      Onze Minister kan slechts door hem erkende rechtspersonen aanwijzen. Bij ministeriële regeling worden regels
      gesteld met betrekking tot de wijze van erkenning, de voorwaarden voor erkenning, de intrekking van de erkenning
      indien niet meer aan deze voorwaarden wordt voldaan, en de bekendmaking van een erkenning of intrekking van een
      erkenning.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel48d
  - number: 48e.1
    text: 'Een certificaat maritieme arbeid vervalt, indien:'
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel48e
  - number: 48e.1.a
    text: |-
      een deel van het schip wordt verbouwd waarvoor krachtens [artikel 48][ref1] gestelde eisen gelden, of in de
      inrichting of de uitrusting waarvoor krachtens artikel 48 gestelde voorschriften gelden, ingrijpende wijzigingen
      worden aangebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel48
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel48e
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '48'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 48e.1.b
    text: het schip een buitenlands schip wordt;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel48e
  - number: 48e.1.c
    text: het tijdvak waarvoor het certificaat geldt, is verstreken;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel48e
  - number: 48e.1.d
    text: |-
      de tijdens de geldigheidsduur van het certificaat verplicht gestelde onderzoeken als bedoeld in
      [artikel 48c, derde lid][ref1], niet of niet tijdig hebben plaatsgevonden, behoudens in bij ministeriële regeling
      omschreven bijzondere gevallen;


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel48c
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel48e
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: 48c
        hoofdstuk: 4B
  - number: 48e.1.e
    text: |-
      het schip van naam verandert of een ander letterteken of nummer krijgt, of het schip niet langer wordt beheerd door
      de scheepsbeheerder vermeld op het certificaat maritieme arbeid.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel48e
  - number: 48e.2
    text: 'Onze Minister kan een certificaat intrekken, wanneer blijkt dat:'
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel48e
  - number: 48e.2.a
    text: |-
      de bouw, de inrichting of de uitrusting van het schip waarvoor krachtens [artikel 48][ref1] gestelde voorschriften
      gelden, in belangrijke mate afwijkt van de gegevens van het certificaat;


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel48
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel48e
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '48'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 48e.2.b
    text: |-
      het schip of de scheepsbeheerder niet langer voldoet aan de in [artikel 48c, eerste lid][ref1], bedoelde
      voorschriften of aan de voor het desbetreffende schip afgegeven verklaring naleving maritieme arbeid en de vereiste
      corrigerende maatregelen niet zijn getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel48c
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel48e
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: 48c
        hoofdstuk: 4B
  - number: 48e.3
    text: |-
      Bij ministeriële regeling kan worden bepaald dat certificaten in bij die regeling te bepalen gevallen bovendien
      vervallen, wanneer het schip aan zijn oorspronkelijke bestemming wordt onttrokken.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel48e
  - number: 48e.4
    text: De scheepsbeheerder zendt een vervallen of ingetrokken certificaat zo spoedig mogelijk aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel48e
  - number: '49.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de ambtenaren van de
      Inspectie Verkeer en Waterstaat, alsmede de bij besluit van Onze Minister aangewezen ambtenaren of andere personen.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel49
  - number: '49.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel49
  - number: '50'
    text: |-
      De in [artikel 49, eerste lid][ref1], bedoelde toezichthouder is bevoegd ter uitoefening van zijn bevoegdheden
      ingevolge deze wet elke plaats te betreden, met inbegrip van woongedeelten van schepen.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel49
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '49'
        hoofdstuk: '5'
  - number: '51.1'
    text: |-
      De in [artikel 49, eerste lid][ref1], bedoelde toezichthouder is bevoegd zaken en schepen te onderzoeken
      met betrekking waartoe hij een toezichthoudende taak heeft. Deze bevoegdheid strekt zich uit tot de in
      [artikel 50][ref2] bedoelde plaatsen.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel50
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '49'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: '50'
        hoofdstuk: '5'
  - number: '51.2'
    text: |-
      Hij is bevoegd met het oog op de uitoefening van deze bevoegdheden, in geval van gegrond vermoeden dat in strijd
      wordt gehandeld met enige verplichting ingevolge deze wet, van de kapitein van een schip te vorderen dat deze het
      schip gaande houdt dan wel naar een door hem aangewezen veilige ligplaats of ankerplaats brengt.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel51
  - number: '52.1'
    text: |-
      Een ambtenaar van de Inspectie Verkeer en Waterstaat is bevoegd een schip aan te houden, indien er voorafgaand aan
      het vertrek naar zee
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel52
  - number: 52.1.a
    text: geen bemanningscertificaat voor het schip is afgegeven of het bemanningscertificaat ongeldig is;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel52
  - number: 52.1.b
    text: de door hem aangetroffen bemanning niet ten minste in overeenstemming is met het bemanningscertificaat; of
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel52
  - number: 52.1.c
    text: |-
      van het schip kennelijk een ander gebruik wordt of zal worden gemaakt dan overeenkomstig de beperkingen of
      voorwaarden vermeld in het bemanningscertificaat.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel52
  - number: '52.2'
    text: |-
      De ambtenaar van de Inspectie Verkeer en Waterstaat is eveneens bevoegd een
      schip aan te houden, indien de toezichthouder dan wel de inspecteur, bedoeld in
      [artikel 1:3, eerste lid, onderdeel c, van de Algemene douanewet][ref1] de toegang tot het schip wordt geweigerd of
      indien geen medewerking aan diens onderzoek wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: '52.3'
    text: De aanhouding wordt opgeheven, zodra de reden voor de aanhouding is komen te vervallen.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel52
  - number: '53.1'
    text: |-
      De ambtenaar van de Inspectie Verkeer en Waterstaat stelt Onze Minister onverwijld in kennis van de aanhouding en
      van de redenen voor de aanhouding.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel53
  - number: '53.2'
    text: |-
      Van een besluit tot aanhouding van een schip of tot opheffing van de aanhouding wordt voorts de betrokken ambtenaar
      van de rijksbelastingdienst, bevoegd inzake douane, in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel53
  - number: '53.3'
    text: |-
      De in het tweede lid bedoelde ambtenaar verleent geen expeditie voor het betrokken schip indien hij een mededeling
      van aanhouding heeft ontvangen en zolang hij geen mededeling van opheffing heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel53
  - number: '54'
    text: Onze Minister kan de aan de toezichthouder toekomende bevoegdheden beperken.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel54
  - number: '55'
    text: 'Met het opsporen van feiten, die bij of krachtens deze wet strafbaar zijn gesteld, zijn belast:'
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55
  - number: 55.a
    text: |-
      de bij of krachtens [artikel 141 Wetboek van Strafvordering][ref1] aangewezen personen;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 55.b
    text: de ambtenaren van de Inspectie Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55
  - number: 55a.1
    text: |-
      De kapitein en de scheepsofficieren zijn aan tuchtrechtspraak onderworpen terzake van enig handelen of nalaten in
      strijd met de zorg die zij als een goed zeeman in acht behoren te nemen ten opzichte van de opvarenden, het schip,
      de lading, het milieu of het scheepvaartverkeer.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55a
  - number: 55a.2
    text: |-
      De tuchtrechtspraak in eerste aanleg wordt uitgeoefend door het tuchtcollege voor de scheepvaart. Het tuchtcollege
      voor de scheepvaart is gevestigd te Amsterdam.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55a
  - number: 55a.3
    text: |-
      De tuchtrechtspraak in hoger beroep wordt uitgeoefend door het College van Beroep voor het bedrijfsleven. Het
      College van Beroep voor het bedrijfsleven beslist in hoogste ressort.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55a
  - number: 55b.1
    text: |-
      Het tuchtcollege bestaat uit een voorzitter, twee plaatsvervangende voorzitters, acht leden en zestien
      plaatsvervangende leden. Zij worden door Onze Minister benoemd voor een periode van vier jaren en zijn terstond
      herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55b
  - number: 55b.2
    text: De voorzitter en de twee plaatsvervangende voorzitters zijn personen
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55b
  - number: 55b.2.a
    text: |-
      aan wie op grond van het afsluitend examen van een opleiding in het wetenschappelijk onderwijs door een universiteit
      dan wel de Open Universiteit, waarop de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] betrekking
      heeft, de graad van Bachelor op het gebied van het recht en tevens de graad van Master op het gebied van het recht
      is verleend, of


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55b
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 55b.2.b
    text: |-
      die op grond van het afsluitend examen van een opleiding op het gebied van het recht aan een universiteit dan wel
      de Open Universiteit, waarop de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] betrekking heeft,
      het recht hebben verkregen om de titel meester te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55b
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 55b.3
    text: |-
      Vier leden en vier plaatsvervangende leden hebben gedurende de aan hun benoeming voorafgaande periode van
      tien jaren ten minste vijf jaren als kapitein of als scheepsofficier aan boord van een ander schip dan een
      vissersvaartuig gevaren.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55b
  - number: 55b.4
    text: |-
      Vier leden en vier plaatsvervangende leden hebben gedurende de aan hun benoeming voorafgaande periode van tien
      jaren ten minste vijf jaren als schipper of als scheepsofficier aan boord van een vissersvaartuig gevaren.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55b
  - number: 55b.5
    text: 'Voorts worden als plaatsvervangend lid benoemd:'
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55b
  - number: 55b.5.a
    text: twee reders;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55b
  - number: 55b.5.b
    text: twee waterbouwkundigen;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55b
  - number: 55b.5.c
    text: twee registerloodsen;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55b
  - number: 55b.5.d
    text: twee hydrografen.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55b
  - number: 55b.6
    text: |-
      Onze Minister verleent aan de voorzitter, de plaatsvervangende voorzitters, de leden en de plaatsvervangende leden
      in elk geval ontslag met ingang van de maand, volgende op die waarin zij de leeftijd van zeventig jaren hebben
      bereikt, en op eigen verzoek tussentijds.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55b
  - number: 55c.1
    text: |-
      Tussen de voorzitter, de plaatsvervangende voorzitters, de leden, en de plaatsvervangende leden van het
      tuchtcollege mag geen nauwe persoonlijke of zakelijke betrekking bestaan.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55c
  - number: 55c.2
    text: |-
      Voor de aanvang van hun werkzaamheden leggen zij in handen van de president van het College van Beroep voor
      het bedrijfsleven de eed of belofte af. Het formulier voor de eed of belofte wordt bij ministeriële regeling
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55c
  - number: 55d.1
    text: |-
      Het voor de leden van de rechterlijke macht bepaalde in de [artikelen 46c, tweede lid][ref1],
      [46d, tweede lid][ref2], [46f][ref3], [46g, eerste en tweede lid][ref4],
      [46i, eerste lid, aanhef en onderdelen a en b, en tweede lid][ref5],
      [46l, eerste lid, aanhef en onderdeel a][ref6], [46m][ref7], [46o][ref8] en
      [46p, eerste tot en met vijfde lid, van de Wet rechtspositie rechterlijke ambtenaren][ref9] is van overeenkomstige
      toepassing ten aanzien van de voorzitter, de plaatsvervangende voorzitters, de leden en de plaatsvervangende leden
      van het tuchtcollege.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46d
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46f
      [ref4]: https://wetten.overheid.nl/BWBR0008365#Artikel46g
      [ref5]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref6]: https://wetten.overheid.nl/BWBR0008365#Artikel46l
      [ref7]: https://wetten.overheid.nl/BWBR0008365#Artikel46m
      [ref8]: https://wetten.overheid.nl/BWBR0008365#Artikel46o
      [ref9]: https://wetten.overheid.nl/BWBR0008365#Artikel46p
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55d
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46c
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46d
      - id: ref3
        bwb_id: BWBR0008365
        artikel: 46f
      - id: ref4
        bwb_id: BWBR0008365
        artikel: 46g
      - id: ref5
        bwb_id: BWBR0008365
        artikel: 46i
      - id: ref6
        bwb_id: BWBR0008365
        artikel: 46l
      - id: ref7
        bwb_id: BWBR0008365
        artikel: 46m
      - id: ref8
        bwb_id: BWBR0008365
        artikel: 46o
      - id: ref9
        bwb_id: BWBR0008365
        artikel: 46p
  - number: 55d.2
    text: |-
      De [artikelen 13a][ref1], [13b, uitgezonderd het eerste lid, onderdelen b en c, en vierde lid][ref2], en
      [13c tot en met 13g van de Wet op de rechterlijke organisatie][ref3] zijn van overeenkomstige toepassing ten
      aanzien van gedragingen van de voorzitter, de plaatsvervangende voorzitters, de leden en de plaatsvervangende leden
      van het tuchtcollege, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel13a
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel13b
      [ref3]: https://wetten.overheid.nl/BWBR0001830#Artikel13c
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55d
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: 13a
      - id: ref2
        bwb_id: BWBR0001830
        artikel: 13b
      - id: ref3
        bwb_id: BWBR0001830
        artikel: 13c
  - number: 55d.2.a
    text: |-
      voor de overeenkomstige toepassing van die artikelen onder «het betrokken gerechtsbestuur» wordt verstaan: de
      voorzitter van het tuchtcollege; en
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55d
  - number: 55d.2.b
    text: |-
      de procureur-generaal niet verplicht is aan het verzoek, bedoeld in [artikel 13a][ref1], te voldoen, indien de
      verzoeker redelijkerwijs onvoldoende belang heeft bij een onderzoek als bedoeld in datzelfde artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel13a
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55d
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: 13a
  - number: 55e
    text: |-
      De voorzitter, de plaatsvervangende voorzitters, de leden en de plaatsvervangende leden van het tuchtcollege
      ontvangen een bij ministeriële regeling vast te stellen vacatiegeld, alsmede een vergoeding van reis- en
      verblijfkosten en van verdere verschotten.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55e
  - number: 55f.1
    text: Het tuchtcollege heeft een secretaris en een plaatsvervangend secretaris
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55f
  - number: 55f.1.a
    text: |-
      aan wie op grond van het afsluitend examen van een opleiding in het wetenschappelijk onderwijs door een universiteit
      dan wel de Open Universiteit, waarop de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] betrekking
      heeft, de graad van Bachelor op het gebied van het recht en tevens de graad van Master op het gebied van het recht
      is verleend, of


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55f
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 55f.1.b
    text: |-
      die op grond van het afsluitend examen van een opleiding op het gebied van het recht aan een universiteit dan wel
      de Open Universiteit, waarop de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] betrekking heeft,
      het recht heeft verkregen om de titel meester te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55f
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 55f.2
    text: De secretaris en de plaatsvervangend secretaris worden door Onze Minister benoemd, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55f
  - number: 55g.1
    text: |-
      De voorzitter, de leden en de secretaris, alsmede hun plaatsvervangers, mogen zich niet op enige wijze inlaten met
      partijen of hun raadslieden of gemachtigden over enige zaak die bij het tuchtcollege voor de scheepvaart aanhangig
      is, of waarvan zij weten of kunnen vermoeden dat deze bij het tuchtcollege voor de scheepvaart aanhangig zal worden
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55g
  - number: 55g.2
    text: |-
      Zij zijn verplicht tot geheimhouding van de gegevens waarover zij bij de uitoefening van hun taak de beschikking
      krijgen en waarvan zij het vertrouwelijk karakter kennen of redelijkerwijs moeten vermoeden, behoudens voorzover
      enig wettelijk voorschrift hen tot mededeling verplicht of uit hun taak de noodzaak tot mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55g
  - number: 55g.3
    text: Zij zijn verplicht tot geheimhouding van hetgeen in de raadkamer over aanhangige zaken is geuit.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55g
  - number: 55h.1
    text: |-
      Een zaak wordt in eerste aanleg bij het tuchtcollege aanhangig gemaakt op verzoek van Onze Minister of door een
      klacht van een belanghebbende. Daarnaast is het tuchtcollege bevoegd om uit eigen beweging een zaak aanhangig te
      maken.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55h
  - number: 55h.2
    text: |-
      Een verzoek en een klacht worden schriftelijk of elektronisch en met redenen omkleed ingediend bij de voorzitter
      van het tuchtcollege. Een klacht van een belanghebbende vermeldt de naam, het adres en de woonplaats van de klager.
      Een verzoek en een klacht bevatten voorts ten minste de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55h
  - number: 55h.2.a
    text: |-
      de naam en, voor zover bekend, het adres en de woonplaats van de kapitein of de scheepsofficier op wie het verzoek
      of de klacht betrekking heeft, en indien het verzoek of de klacht betrekking heeft op een scheepsofficier, de
      functie aan boord van het schip die de scheepsofficier ten tijde van de gewraakte gedraging vervulde;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55h
  - number: 55h.2.b
    text: |-
      de naam en, voor zover bekend, het type van het schip, aan boord waarvan de gewraakte gedraging heeft plaats
      gevonden;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55h
  - number: 55h.2.c
    text: een omschrijving van de gedraging, waarop het verzoek of de klacht betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55h
  - number: 55h.2.d
    text: de bezwaren die tegen de gewraakte gedraging zijn gerezen.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55h
  - number: 55h.3
    text: |-
      Indien de klager daarom verzoekt, is de secretaris van het tuchtcollege hem behulpzaam bij het formuleren van de
      klacht.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55h
  - number: 55h.4
    text: |-
      Het tuchtcollege neemt een verzoek of een klacht niet in behandeling indien de gedraging waarop het verzoek of de
      klacht betrekking heeft meer dan twee jaren voor de indiening van het verzoek of de klacht heeft plaats gevonden.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55h
  - number: 55i.1
    text: |-
      De voorzitter kan besluiten tot het instellen van een vooronderzoek, in welk geval hij de uitvoering van
      het vooronderzoek opdraagt aan een of meer leden of plaatsvervangende leden of aan de secretaris of de
      plaatsvervangende secretaris van het tuchtcollege.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55i
  - number: 55i.2
    text: 'Degene die het vooronderzoek verricht is bevoegd:'
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55i
  - number: 55i.2.a
    text: |-
      voor het verrichten van onderzoek ter plaatse elke plaats te betreden die hij noodzakelijk acht, zo nodig met
      behulp van de sterke arm, met uitzondering van een woning zonder toestemming van de bewoner;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55i
  - number: 55i.2.b
    text: |-
      kennis te nemen van alle schriftelijke stukken en gegevens in geautomatiseerde werken die zich aan boord bevinden,
      waarvan hij kennisneming in het belang van het onderzoek acht, en daarvan afschriften te maken;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55i
  - number: 55i.2.c
    text: de klager, alsmede de betrokken kapitein of scheepsofficier te horen;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55i
  - number: 55i.2.d
    text: |-
      getuigen en deskundigen te horen, waarbij het bepaalde in [artikel 55o, vijfde, zesde en zevende lid][ref1], van
      overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel55o
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55i
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: 55o
        hoofdstuk: 5A
        paragraaf: '3'
  - number: 55i.3
    text: |-
      Degene die het vooronderzoek heeft verricht neemt geen deel aan de behandeling van de zaak ter zitting van het
      tuchtcollege.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55i
  - number: 55j.1
    text: |-
      De voorzitter kan een verzoek of een klacht na een summier onderzoek terstond afwijzen bij een met redenen omklede
      beslissing indien hij van oordeel is dat de klager kennelijk niet ontvankelijk is, dan wel het verzoek of de klacht
      kennelijk ongegrond is.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55j
  - number: 55j.2
    text: |-
      De secretaris zendt onverwijld een afschrift van de schriftelijke beslissing van de voorzitter aan Onze Minister en
      aan de klager.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55j
  - number: 55j.3
    text: |-
      Onze Minister en de klager kunnen binnen twee weken na de dag van verzending van de beslissing van de voorzitter
      tot afwijzing van een verzoek of een klacht hiertegen schriftelijk of elektronisch verzet doen bij het
      tuchtcollege. Ten gevolge van het verzet vervalt de beslissing van de voorzitter.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55j
  - number: 55j.4
    text: |-
      Indien de voorzitter van oordeel is dat een verzoek of een klacht vatbaar is voor een minnelijke schikking, roept
      hij Onze Minister of de klager alsmede de betrokken kapitein of scheepsofficier op teneinde een zodanige schikking
      te beproeven. Indien een minnelijke schikking is getroffen, wordt het verzoek of de klacht ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55j
  - number: 55j.5
    text: |-
      De voorzitter brengt verzoeken en klachten die niet door hem zijn afgewezen of niet in der minne zijn geschikt,
      onverwijld ter kennis van het tuchtcollege.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55j
  - number: 55k.1
    text: |-
      Aan de behandeling van een zaak ter zitting van het tuchtcollege nemen vijf leden deel, te weten de voorzitter of
      een van zijn plaatsvervangers, alsmede:
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55k
  - number: 55k.1.a
    text: |-
      de vier leden, bedoeld in [artikel 55b, derde lid][ref1], indien het verzoek of de klacht betrekking heeft
      op de kapitein of een scheepsofficier van een ander schip dan een vissersvaartuig, met de mogelijkheid van
      plaatsvervanging, of


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel55b
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55k
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: 55b
        hoofdstuk: 5A
        paragraaf: '2'
  - number: 55k.1.b
    text: |-
      de vier leden, bedoeld in [artikel 55b, vierde lid][ref1], indien het verzoek of de klacht betrekking heeft op de
      schipper of een scheepsofficier van een vissersvaartuig, met de mogelijkheid van plaatsvervanging.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel55b
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55k
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: 55b
        hoofdstuk: 5A
        paragraaf: '2'
  - number: 55k.2
    text: |-
      De voorzitter kan, indien de zaak het vereist, bepalen dat aan de behandeling van die zaak ter zitting van het
      tuchtcollege, een of twee plaatsvervangende leden als bedoeld in [artikel 55b, vijfde lid][ref1], deelnemen in
      plaats van de in het eerste lid, onder a en b voor behandeling aangewezen leden. De plaatsvervangende leden,
      bedoeld in de eerste volzin, brengen geen stem uit bij het nemen van een beslissing. In geval van staking van
      stemmen is de stem van de voorzitter of zijn plaatsvervanger beslissend.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel55b
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55k
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: 55b
        hoofdstuk: 5A
        paragraaf: '2'
  - number: 55k.3
    text: |-
      De voorzitter kan, indien een zaak hem daartoe geschikt voorkomt, bepalen dat aan de behandeling van die zaak ter
      zitting van het tuchtcollege, in afwijking van het bepaalde in het eerste lid, drie leden deelnemen, te weten de
      voorzitter of een van zijn plaatsvervangers, alsmede twee van de vier leden, bedoeld in het eerste lid onder a
      of b.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55k
  - number: 55k.4
    text: |-
      Bij de behandeling van een zaak ter zitting van het tuchtcollege naverzet als bedoeld in
      [artikel 55j, derde lid][ref1], wordt de voorzitter vervangen door een van zijn plaatsvervangers.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel55j
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55k
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: 55j
        hoofdstuk: 5A
        paragraaf: '3'
  - number: 55l.1
    text: |-
      De voorzitter en de leden, alsmede hun plaatsvervangers, kunnen zich verschonen en kunnen worden gewraakt indien
      er te hunnen aanzien feiten of omstandigheden bestaan, waardoor de onpartijdigheid van het tuchtcollege schade zou
      kunnen lijden.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55l
  - number: 55l.2
    text: |-
      De overige leden van het tuchtcollege beslissen zo spoedig mogelijk over een verzoek tot verschoning of wraking van
      hun medelid. Bij staking van stemmen wordt het verzoek tot verschoning of wraking toegewezen.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55l
  - number: 55m.1
    text: |-
      Zodra het tuchtcollege een verzoek of een klacht in behandeling heeft genomen, zendt de secretaris een afschrift
      van het verzoek of van de klacht aan de betrokken kapitein of scheepsofficier.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55m
  - number: 55m.2
    text: |-
      Wanneer het tuchtcollege uit eigen beweging een tuchtzaak aanhangig maakt, deelt de secretaris dit schriftelijk
      mede aan de betrokken kapitein of scheepsofficier onder vermelding van de gewraakte gedraging en van de bezwaren
      die tegen deze gedraging zijn gerezen.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55m
  - number: 55m.3
    text: |-
      De betrokken kapitein of scheepsofficier kan binnen zes weken na de dag van verzending van het afschrift van het
      verzoek of van de klacht, als bedoeld in het eerste lid, of van de schriftelijke mededeling, als bedoeld in het
      tweede lid, schriftelijk of elektronisch een verweerschrift indienen. De voorzitter kan deze termijn op verzoek van
      de betrokken kapitein of scheepsofficier verlengen.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55m
  - number: 55m.4
    text: |-
      De secretaris zendt een afschrift van het verweerschrift aan degene die het verzoek of de klacht bij de voorzitter
      heeft ingediend.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55m
  - number: 55n.1
    text: |-
      De voorzitter bepaalt het tijdstip voor de mondelinge behandeling van de zaak ter zitting. De secretaris roept
      degene die het verzoek of de klacht heeft ingediend en de betrokken kapitein of scheepsofficier ten minste twee
      weken van tevoren bij aangetekende brief op voor de zitting. De betrokken kapitein of scheepsofficier is verplicht
      aan de oproeping gevolg te geven.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55n
  - number: 55n.2
    text: |-
      Indien de betrokken kapitein of scheepsofficier op de oproeping niet ter zitting verschijnt, kan het tuchtcollege
      de officier van justitie verzoeken de betrokkene te dagvaarden. Hij is verplicht na dagvaarding te verschijnen.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55n
  - number: 55n.3
    text: |-
      Indien de betrokken kapitein of scheepsofficier op de dagvaarding niet ter zitting verschijnt, kan het
      tuchtcollege de officier van justitie verzoeken de betrokkene te dagvaarden, met bevel tot medebrenging.
      [Artikel 556 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel556
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55n
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '556'
  - number: 55n.4
    text: |-
      Degene die het verzoek of de klacht heeft ingediend kan zich ter zitting door een daartoe gemachtigde doen
      vertegenwoordigen of zich door een raadsman doen bijstaan.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55n
  - number: 55n.5
    text: De betrokken kapitein of scheepsofficier kan zich door een raadsman doen bijstaan.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55n
  - number: 55n.6
    text: |-
      Het tuchtcollege kan weigeren bepaalde personen die geen advocaat zijn, als raadsman of als gemachtigde ter zitting
      toe te laten. Bij een zodanige weigering houdt het tuchtcollege de zaak tot een volgende zitting aan.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55n
  - number: 55n.7
    text: |-
      Het tuchtcollege stelt de betrokken kapitein of scheepsofficier en zijn raadsman ten minste twee weken voor de
      zitting in de gelegenheid om van alle op de zaak betrekking hebbende stukken kennis te nemen.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55n
  - number: 55n.8
    text: |-
      Het tuchtcollege behandelt de zaak in een openbare zitting. Het tuchtcollege kan om gewichtige redenen bepalen dat
      de behandeling geheel of gedeeltelijk met gesloten deuren zal plaats vinden.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55n
  - number: 55n.9
    text: |-
      De secretaris maakt van het verhandelde ter zitting een proces-verbaal op dat door de voorzitter en de secretaris
      wordt ondertekend.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55n
  - number: 55o.1
    text: |-
      Het tuchtcollege kan getuigen en deskundigen voor de zitting oproepen en horen. De leden en de buitengewone leden
      van de Onderzoeksraad voor veiligheid, de algemeen secretaris en de medewerkers van het bureau van de raad, alsmede
      de door Onze Minister wie het aangaat op verzoek van de raad aangewezen deskundigen kunnen door het tuchtcollege
      niet als getuige of deskundige worden opgeroepen.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55o
  - number: 55o.2
    text: |-
      De secretaris roept getuigen en deskundigen bij aangetekende brief voor de zitting op. Ieder die als getuige of
      deskundige door het tuchtcollege is opgeroepen, is verplicht aan die oproeping gevolg te geven.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55o
  - number: 55o.3
    text: |-
      Indien een getuige of deskundige op de oproeping niet ter zitting verschijnt, doet de officier van justitie hem op
      verzoek van het tuchtcollege dagvaarden. Hij is verplicht na dagvaarding te verschijnen.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55o
  - number: 55o.4
    text: |-
      Indien een getuige of deskundige op de dagvaarding niet ter zitting verschijnt, doet de officier
      van justitie hem op verzoek van het tuchtcollege andermaal dagvaarden, met bevel tot medebrenging.
      [Artikel 556 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel556
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55o
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '556'
  - number: 55o.5
    text: |-
      De voorzitter beëdigt getuigen om de gehele waarheid en niets dan de waarheid te zeggen. Getuigen zijn verplicht op
      de gestelde vragen te antwoorden.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55o
  - number: 55o.6
    text: |-
      De voorzitter beëdigt deskundigen om hun taak naar geweten te vervullen. Deskundigen zijn verplicht de door het
      tuchtcollege gevorderde diensten te bewijzen.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55o
  - number: 55o.7
    text: |-
      Ten aanzien van de getuigen en deskundigen zijn de
      [artikelen 217 tot en met 219 van het Wetboek van Strafvordering][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel217
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55o
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '217'
  - number: 55o.8
    text: |-
      De getuigen en deskundigen ontvangen desgevraagd op vertoon van hun oproep of dagvaarding een door
      de voorzitter vast te stellen schadeloosstelling overeenkomstig het bepaalde bij of krachtens de
      [Wet tarieven in strafzaken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002406
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55o
    references:
      - id: ref1
        bwb_id: BWBR0002406
  - number: 55p.1
    text: |-
      Het tuchtcollege kan, indien het van oordeel is dat een tegen een kapitein of een scheepsofficier gerezen bezwaar
      gegrond is, een of meer van de volgende tuchtmaatregelen opleggen:
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55p
  - number: 55p.1.a
    text: waarschuwing;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55p
  - number: 55p.1.b
    text: berisping;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55p
  - number: 55p.1.c
    text: geldboete van ten hoogste € 4 500;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55p
  - number: 55p.1.d
    text: schorsing van de vaarbevoegdheid voor een periode van ten hoogste twee jaren.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55p
  - number: 55p.2
    text: |-
      Bij het opleggen van een of meer van de in het eerste lid genoemde tuchtmaatregelen kan het tuchtcollege tevens
      bepalen dat zijn beslissing, al dan niet met vermelding van de gronden waarop zij berust, in een of meer in de
      beslissing aangewezen tijdschriften of nieuwsbladen openbaar zal worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55p
  - number: 55p.3
    text: |-
      Bij het opleggen van een geldboete bepaalt het tuchtcollege de termijn of de termijnen, waarbinnen de geldboete
      moet worden voldaan. De te betalen geldsommen komen toe aan de Staat. Betaling van de geldsom geschiedt aan Onze
      Minister. Voor de toepassing van [titel 4.4 van de Algemene wet bestuursrecht][ref1] wordt de uitspraak van het
      tuchtcollege aangemerkt als een beschikking als bedoeld in [artikel 4:86 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55p
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 55p.4
    text: |-
      Bij het opleggen van de tuchtmaatregelen, genoemd in het eerste lid, onder c en d, kan het tuchtcollege bepalen dat
      deze geheel of ten dele niet zullen worden ten uitvoer gelegd, tenzij het tuchtcollege bij een latere beslissing
      anders mocht bepalen op grond van het feit dat de betrokken kapitein of scheepsofficier zich voor het einde van
      een bij die oplegging te bepalen proeftijd van ten hoogste twee jaren heeft gedragen in strijd met de zorg die hij
      als een goed zeeman in acht behoort te nemen ten opzichte van de opvarenden, het schip, de lading, het milieu of
      het scheepvaartverkeer.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55p
  - number: 55p.5
    text: |-
      De tuchtmaatregelen, genoemd in het eerste lid onder c en d, en de bijkomende maatregel van openbaarmaking, genoemd
      in het tweede lid, kunnen eerst worden ten uitvoer gelegd nadat de beslissing van het tuchtcollege onherroepelijk
      is geworden.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55p
  - number: 55q.1
    text: |-
      De beslissing van het tuchtcollege berust op een deugdelijke motivering. Zij wordt in een openbare zitting
      uitgesproken. Indien de betrokken kapitein of scheepsofficier niet ter zitting is verschenen, kan het tuchtcollege
      bij verstek uitspraak doen.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55q
  - number: 55q.2
    text: 'De secretaris zendt onverwijld een afschrift van de schriftelijke beslissing van het tuchtcollege:'
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55q
  - number: 55q.2.a
    text: bij aangetekende brief aan de betrokken kapitein of scheepsofficier;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55q
  - number: 55q.2.b
    text: bij gewone brief aan Onze Minister;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55q
  - number: 55q.2.c
    text: bij gewone brief aan de klager.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55q
  - number: 55q.3
    text: |-
      Indien het tuchtcollege in zijn uitspraak een schorsing van de vaarbevoegdheid heeft opgelegd, deelt de secretaris
      in zijn aangetekende brief aan de betrokken kapitein of scheepsofficier mede: de datum waarop de schorsing
      ingaat, de verplichting om zijn vaarbevoegdheidsbewijs vóór die datum in te leveren bij het in [artikel 65][ref1]
      genoemde Centraal register bemanningsgegevens, alsmede de gevolgen van het niet tijdig inleveren van het
      vaarbevoegdheidsbewijs op grond van het vierde lid. De secretaris zendt een afschrift van de schriftelijke
      beslissing van het tuchtcollege alsmede van de aangetekende brief aan de betrokken kapitein of scheepsofficier
      tevens ter registratie aan het Centraal register bemanningsgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel65
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55q
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '65'
        hoofdstuk: '7'
        paragraaf: '5'
  - number: 55q.4
    text: |-
      Indien de betrokken kapitein of scheepsofficier zijn vaarbevoegdheidsbewijs niet tijdig bij het Centraal register
      bemanningsgegevens inlevert, wordt de periode van schorsing van de vaarbevoegdheid van rechtswege verlengd met de
      termijn die is verstreken tussen de datum waarop de schorsing ingaat en de datum waarop het vaarbevoegdheidsbewijs
      daadwerkelijk is ingeleverd.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55q
  - number: 55q.5
    text: |-
      Zodra de periode van schorsing is verstreken geeft het Centraal register bemanningsgegevens het
      vaarbevoegdheidsbewijs terug aan de betrokken kapitein of scheepsofficier.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55q
  - number: 55r
    text: |-
      Tegen een beslissing van het tuchtcollege kan binnen zes weken na de dag van de verzending van de in
      [artikel 55q, tweede lid][ref1], bedoelde brief hoger beroep worden ingesteld bij het College van Beroep voor het
      bedrijfsleven:


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel55q
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55r
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: 55q
        hoofdstuk: 5A
        paragraaf: '3'
  - number: 55r.a
    text: |-
      door de betrokken kapitein of scheepsofficier indien het verzoek of de klacht geheel of ten dele gegrond is
      verklaard;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55r
  - number: 55r.b
    text: door Onze Minister;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55r
  - number: 55r.c
    text: door de klager indien zijn klacht geheel of ten dele ongegrond is verklaard.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55r
  - number: 55s.1
    text: |-
      Het hoger beroep wordt ingesteld bij beroepschrift. Bij het beroepschrift wordt overgelegd een afschrift van de
      schriftelijke beslissing van het tuchtcollege, waartegen het hoger beroep is gericht.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55s
  - number: 55s.2
    text: |-
      De griffier van het College van Beroep voor het bedrijfsleven zendt binnen een week na ontvangst van het
      beroepschrift een afschrift daarvan aan de betrokken kapitein of scheepsofficier, aan Onze Minister en aan de
      klager, voor zover het hoger beroep niet door hen is ingesteld, alsmede aan het tuchtcollege, en indien het
      tuchtcollege in zijn uitspraak een schorsing van de vaarbevoegdheid heeft opgelegd, tevens ter registratie aan het
      Centraal register bemanningsgegevens.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55s
  - number: 55s.3
    text: |-
      Het tuchtcollege zendt binnen drie weken na ontvangst van het afschrift van het beroepschrift alle stukken die op
      de zaak betrekking hebben aan de griffier van het College van Beroep voor het bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55s
  - number: 55s.4
    text: |-
      Het College van Beroep voor het bedrijfsleven behandelt de zaak opnieuw in volle omvang. Op de
      behandeling in hoger beroep zijn de [artikelen 55j, eerste, tweede en derde lid][ref1], [55l][ref2],
      [55m, eerste, derde en vierde lid][ref3], en [55n tot en met 55q][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel55j
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel55l
      [ref3]: https://wetten.overheid.nl/BWBR0009124#Artikel55m
      [ref4]: https://wetten.overheid.nl/BWBR0009124#Artikel55n
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55s
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: 55j
        hoofdstuk: 5A
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: 55l
        hoofdstuk: 5A
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0009124
        artikel: 55m
        hoofdstuk: 5A
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0009124
        artikel: 55n
        hoofdstuk: 5A
        paragraaf: '3'
  - number: 55t.1
    text: |-
      Het College van Beroep voor het bedrijfsleven kan op verzoek van een kapitein of een scheepsofficier aan wie een
      tuchtmaatregel is opgelegd een onherroepelijk geworden beslissing van het tuchtcollege of van het College van
      Beroep voor het bedrijfsleven herzien op grond van feiten of omstandigheden die:
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55t
  - number: 55t.1.a
    text: |-
      het tuchtcollege of het College van Beroep voor het bedrijfsleven bij de behandeling van de zaak ter zitting niet
      bekend waren en redelijkerwijs niet bekend konden zijn, en die
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55t
  - number: 55t.1.b
    text: |-
      indien zij het tuchtcollege of het College van Beroep voor het bedrijfsleven bij de behandeling van de zaak ter
      zitting wel bekend zouden zijn geweest, tot een andere beslissing zouden hebben kunnen leiden.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55t
  - number: 55t.2
    text: |-
      Op de behandeling van het verzoek tot herziening zijn de [artikelen 55j, eerste, tweede en derde lid][ref1],
      [55l][ref2], [55m, eerste, derde en vierde lid][ref3], en [55n tot en met 55q][ref4] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel55j
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel55l
      [ref3]: https://wetten.overheid.nl/BWBR0009124#Artikel55m
