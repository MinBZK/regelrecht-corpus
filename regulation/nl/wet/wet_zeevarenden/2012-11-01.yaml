  - number: '78.1'
    text: |-
      Een wijziging van de bemanningsrichtlijn gaat voor de toepassing van deze wet gelden met ingang van de dag waarop
      aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de
      Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel78
  - number: '78.2'
    text: |-
      Bij ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, kunnen de benaming van de
      bemanningsrichtlijn en de verwijzing naar onderdelen daarvan worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel78
  - number: '79.2'
    text: |-
