$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_zeevarenden
regulatory_layer: WET
publication_date: '2004-03-30'
valid_from: '2012-11-01'
bwb_id: BWBR0009124
url: https://wetten.overheid.nl/BWBR0009124/2012-11-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe bepalingen vast te stellen voor het bemannen van
    Nederlandse zeeschepen;

    Gelet op het op 7 juli 1978 te Londen tot stand gekomen Internationale Verdrag betreffende de normen voor
    zeevarenden inzake opleiding, diplomering en wachtdienst, 1978 (Trb. 1981, 144), alsmede op Richtlijn nr. 94/58/
    EG van de Raad van de Europese Unie van 22 november 1994 inzake het minimumopleidingsniveau van zeevarenden (PbEG
    L 319);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Infrastructuur en Milieu;'
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel1
  - number: 1.1.b
    text: |-
      Nederlands schip: een schip dat op grond van Nederlandse rechtsregels gerechtigd is de vlag van het Koninkrijk
      te voeren;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel1
  - number: 1.1.c
    text: |-
      vissersvaartuig: een Nederlands schip dat bestemd is of gebezigd wordt voor het bedrijfsmatig vangen van vis of van
      andere levende rijkdommen van de zee;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel1
  - number: 1.1.d
    text: |-
      zeilschip: een Nederlands schip dat bestemd en ingericht is om hoofdzakelijk door middel van zeilen te worden
      voortbewogen;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel1
  - number: 1.1.e
    text: |-
      pleziervaartuig: een Nederlands schip dat uitsluitend anders dan in de uitoefening van een beroep of bedrijf wordt
      gebruikt;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel1
  - number: 1.1.f
    text: 'zeilvaart: de bedrijfsmatige vaart met zeilschepen op zee;'
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel1
  - number: 1.1.g
    text: |-
      scheepslengte: tenzij anders bepaald, 96 procent van de totale lengte op een waterlijn op 85 procent van de
      kleinste holte gemeten vanaf de kiellijn, of de lengte van de voorzijde van de voorsteven tot de hartlijn van de
      roerkoning op die waterlijn, indien deze lengte groter is; bij vissersvaartuigen die met een stuurlast ontworpen
      zijn, moet de waterlijn waarop deze lengte gemeten wordt, evenwijdig aan de ontwerplastlijn worden genomen;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel1
  - number: 1.1.h
    text: 'kapitein: de gezagvoerder van een Nederlands schip;'
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel1
  - number: 1.1.i
    text: |-
      scheepsofficier: een lid van de bemanning, niet zijnde de kapitein, die aan boord van een Nederlands schip een
      functie als stuurman, werktuigkundige, maritiem officier of radio-operator vervult;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel1
  - number: 1.1.j
    text: 'opvarende: een ieder die zich gedurende de vaart aan boord van het schip bevindt;'
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel1
  - number: 1.1.k
    text: |-
      bemanning: de kapitein, de scheepsofficieren, de scheepsgezellen, en de overige zeevarenden die in de monsterrol
      worden genoemd;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel1
  - number: 1.1.l
    text: |-
      scheepsbeheerder: de eigenaar of de rompbevrachter van een schip, of een vennootschap als bedoeld in
      [artikel 311, derde lid, van het Wetboek van Koophandel][ref1] aan wie de eigenaar de verantwoordelijkheid voor
      de exploitatie van het schip heeft overgedragen, of indien het een vissersvaartuig betreft, de natuurlijke persoon
      of rechtspersoon aan wie de eigenaar de verantwoordelijkheid voor de exploitatie van het vissersvaartuig heeft
      overgedragen;


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel311
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '311'
  - number: 1.1.m
    text: |-
      de ambtenaren van de Inspectie Verkeer en Waterstaat: de door Onze Minister aangewezen ambtenaren van de Inspectie
      Verkeer en Waterstaat;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel1
  - number: 1.1.n
    text: |-
      vaarbevoegdheid: de bevoegdheid om in een of meer functies waarvoor in deze wet beroepsvereisten zijn gesteld, aan
      boord van een schip dienst te doen;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel1
  - number: 1.1.o
    text: 'vaarbevoegdheidsbewijs: een door Onze Minister afgegeven document waaruit de vaarbevoegdheid blijkt;'
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel1
  - number: 1.1.p
    text: |-
      bemanningsplan: een voorstel van de scheepsbeheerder, houdende het aantal bemanningsleden met hun functies aan
      boord waarmee de scheepsbeheerder het betrokken schip minimaal wenst te bemannen;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel1
  - number: 1.1.q
    text: |-
      bemanningscertificaat: een door Onze Minister afgegeven certificaat, houdende het minimumaantal bemanningsleden met
      hun functies aan boord van het betrokken schip;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel1
  - number: 1.1.r
    text: |-
      beroepsvereisten: de krachtens deze wet gestelde vereisten ten aanzien van de kennis, het inzicht en de
      vaardigheden voor een functie aan boord of voor werkzaamheden waarop deze wet van toepassing is;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel1
  - number: 1.1.s
    text: |-
      geneeskundige verklaring van geschiktheid voor de zeevaart: een verklaring als bedoeld in [artikel 40][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel40
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '40'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 1.1.t
    text: |-
      tuchtcollege: het tuchtcollege voor de scheepvaart als bedoeld in [artikel 55a, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel55a
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: 55a
        hoofdstuk: 5A
        paragraaf: '1'
  - number: 1.1.u
    text: |-
      verwerking van persoonsgegevens: hetgeen daaronder wordt verstaan in de [Wet bescherming persoonsgegevens][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: 1.1.v
    text: |-
      verantwoordelijke: hetgeen daaronder wordt verstaan in de [Wet bescherming persoonsgegevens][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: 1.1.w
    text: |-
      bewijs van beroepsbekwaamheid: elk geldig document dat is afgegeven door of onder de verantwoordelijkheid
      van de bevoegde autoriteit van een lidstaat van de Europese Unie, een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, in overeenstemming met artikel 5 van de
      bemanningsrichtlijn en de in de daarbij behorende bijlage I vastgestelde vereisten;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel1
  - number: 1.1.x
    text: |-
      bemanningsrichtlijn: richtlijn nr. 2008/106/EG van het Europees Parlement en de Raad van de Europese Unie van
      19 november 2008 inzake het minimum opleidingsniveau van zeevarenden (PbEU L 323);
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel1
  - number: 1.1.y
    text: |-
      Maritiem Arbeidsverdrag: het op 23 februari 2006 in Genève tot stand gekomen Maritiem Arbeidsverdrag, 2006
      (Trb. 2007, 93) en de bij dat verdrag behorende bindende protocollen en aanhangselen;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel1
  - number: 1.1.z
    text: 'zeevarende: de natuurlijke persoon die in enige hoedanigheid werkzaamheden verricht aan boord van een schip;'
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel1
  - number: 1.1.aa
    text: 'visser: een zeevarende werkzaam op een vissersvaartuig;'
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel1
  - number: 1.1.ab
    text: |-
      certificaat maritieme arbeid: het certificaat, bedoeld in voorschrift 5.1.3, derde lid, van het Maritiem
      Arbeidsverdrag;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel1
  - number: 1.1.ac
    text: |-
      verklaring naleving maritieme arbeid: de verklaring, bedoeld in norm A 5.1.3, tiende lid, van het Maritiem
      Arbeidsverdrag, bestaande uit deel I en deel II;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel1
  - number: 1.1.ad
    text: |-
      internationale reis: een reis tussen twee verschillende landen of tussen havens in een ander land, waarbij een
      gebied voor welks buitenlandse betrekkingen een buiten dat gebied zetelende regering verantwoordelijk is of waarvan
      de Verenigde Naties het besturend lichaam zijn, mede als een afzonderlijk land wordt aangemerkt, en waarbij een
      transatlantische reis tussen delen van het Koninkrijk met een internationale reis gelijk wordt gesteld;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel1
  - number: 1.1.ae
    text: |-
      IMO-nummer: het scheepsidentificatienummer, bedoeld in voorschrift XI-1/3 van het op 1 november 1974 te Londen tot
      stand gekomen Verdrag voor de beveiliging van mensenlevens op zee (Trb. 1976, 157).
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel1
  - number: '1.2'
    text: |-
      Bij regeling van Onze Minister kunnen, na overleg met de betrokken organisaties van scheepsbeheerders en
      zeevarenden, categorieën van personen worden aangewezen die in afwijking van het eerste lid, onderdeel z, niet
      worden aangemerkt als zeevarenden.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel1
  - number: '2.1'
    text: |-
      Het bepaalde bij of krachtens deze wet is van toepassing ten aanzien van Nederlandse schepen, voor zover ten
      aanzien van vissersvaartuigen niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel2
  - number: '2.2'
    text: 'Deze wet is niet van toepassing ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel2
  - number: 2.2.a
    text: |-
      schepen die uitsluitend varen op Nederlandse binnenwateren of wateren binnen, of dicht grenzend aan beschutte
      wateren of gebieden waar Nederlandse havenvoorschriften gelden;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel2
  - number: 2.2.b
    text: onbemande schepen die niet van middelen tot werktuiglijke voortstuwing zijn voorzien;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel2
  - number: 2.2.c
    text: oorlogsschepen en marinehulpschepen;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel2
  - number: 2.2.d
    text: reddingsvaartuigen;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel2
  - number: 2.2.e
    text: onoverdekte vissersvaartuigen die in de regel niet buiten het zicht van de Nederlandse kust worden gebracht, en
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel2
  - number: 2.2.f
    text: pleziervaartuigen.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel2
  - number: '2.3'
    text: |-
      Het bepaalde bij of krachtens [hoofdstuk 4B][ref1], en [hoofdstuk 7, paragrafen 8][ref2] en [9][ref3], is niet van
      toepassing op niet commercieel gebruikte schepen.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Hoofdstuk4B
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Hoofdstuk7
      [ref3]: https://wetten.overheid.nl/BWBR0009124#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009124
        hoofdstuk: 4B
      - id: ref2
        bwb_id: BWBR0009124
        hoofdstuk: '7'
        paragraaf: '8'
      - id: ref3
        bwb_id: BWBR0009124
        hoofdstuk: '7'
        paragraaf: '9'
  - number: '2.4'
    text: |-
      Voor de toepassing van het derde lid kunnen bij ministeriële regeling nadere regels worden gesteld en kan
      nader worden bepaald welke categorieën van schepen in ieder geval vallen onder de in het derde lid bedoelde
      uitzonderingen.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel2
  - number: '2.5'
    text: |-
      Bij regeling van Onze Minister kunnen na overleg met de betrokken organisaties van scheepsbeheerders en zeevarenden
      categorieën van schepen worden aangewezen waarop het bepaalde bij of krachtens deze wet geheel of gedeeltelijk niet
      van toepassing is.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel2
  - number: '2.6'
    text: |-
      Bij regeling van Onze Minister kan na overleg met de betrokken organisaties van scheepsbeheerders en zeevarenden,
      voor categorieën schepen van minder dan 200 GT die geen internationale reizen maken, worden bepaald dat van het
      bepaalde bij of krachtens deze wet onder daarbij te stellen regels vrijstelling wordt verleend.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel2
  - number: '3.1'
    text: De zorg voor het bemannen van een schip met inachtneming van deze wet berust bij de scheepsbeheerder.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel3
  - number: '3.2'
    text: |-
      De scheepsbeheerder verschaft de kapitein de middelen die hem in staat stellen om aan zijn verplichtingen ingevolge
      deze wet te voldoen.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel3
  - number: '3.3'
    text: |-
      De scheepsbeheerder houdt, ten behoeve van de met het toezicht op de naleving van deze wet belaste autoriteiten,
      per schip van elk daarop dienstdoend bemanningslid een overzicht bij van ten minste het volgende:
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel3
  - number: 3.3.a
    text: de opleiding;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel3
  - number: 3.3.b
    text: de ervaring;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel3
  - number: 3.3.c
    text: de vakbekwaamheid;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel3
  - number: 3.3.d
    text: de medische geschiktheid.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel3
  - number: '3.4'
    text: |-
      Ter uitvoering van de in het derde lid bedoelde verplichting worden persoonsgegevens betreffende de gezondheid
      verwerkt. De verwerking van deze gegevens vindt plaats teneinde te kunnen beoordelen of de bemanning van de door
      de scheepsbeheerder beheerde schepen voldoet aan de wettelijke vereisten betreffende de lichamelijke en geestelijke
      geschiktheid. De scheepsbeheerder is verantwoordelijke voor deze verwerking.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel3
  - number: '4.1'
    text: |-
      De scheepsbeheerder bemant een schip zodanig dat redelijkerwijs alle werkzaamheden aan boord, met inachtneming van
      de geldende arbeids- en rusttijden, en gelet op de bedrijfsvoering, de risico’s op zee en van de lading, zonder
      gevaar voor de opvarenden, het schip, de lading, het milieu of het scheepvaartverkeer kunnen worden verricht.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel4
  - number: '4.2'
    text: |-
      De scheepsbeheerder zorgt ervoor dat de bemanningsleden bij hun tewerkstelling aan boord vertrouwd zijn met hun
      specifieke taken en met alle regelingen, procedures aan boord en de kenmerken van het schip, die verband houden met
      hun taken zowel onder normale omstandigheden als in noodsituaties.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel4
  - number: '4.3'
    text: |-
      De kapitein en de scheepsofficieren gedragen zich aan boord ten opzichte van de opvarenden, het schip, de lading,
      het milieu en het scheepvaartverkeer zoals het een goed zeeman betaamt.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel4
  - number: '4.4'
    text: |-
      De kapitein zorgt ervoor dat de bemanning van het schip te allen tijde berekend is voor het verrichten van de
      werkzaamheden aan boord.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel4
  - number: '5.1'
    text: Een schip is voorzien van een geldig bemanningscertificaat, afgegeven door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel5
  - number: '5.2'
    text: Een schip is ten minste bemand overeenkomstig het bemanningscertificaat.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel5
  - number: '6.1'
    text: |-
      Op het bemanningscertificaat worden de kenmerken van het schip en, zo nodig, de bijzonderheden ten aanzien van het
      gebruik van het schip in relatie tot de bemanning vermeld.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel6
  - number: '6.2'
    text: Een bemanningscertificaat wordt in tweevoud voor een bepaalde periode van ten hoogste vijf jaren afgegeven.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel6
  - number: '6.3'
    text: |-
      De kapitein draagt er zorg voor dat een van de exemplaren van het geldige bemanningscertificaat op een duidelijk
      zichtbare plaats aan boord van het schip wordt opgehangen.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel6
  - number: '7.1'
    text: |-
      De scheepsbeheerder dient voor elk schip afzonderlijk een aanvraag voor een bemanningscertificaat in bij Onze
      Minister, en voegt daarbij een bemanningsplan voor het betrokken schip.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel7
  - number: '7.2'
    text: De scheepsbeheerder kan voor een schip meer dan een bemanningssamenstelling voorstellen.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel7
  - number: '7.3'
    text: Bij ministeriële regeling wordt bepaald welke gegevens ten minste in het bemanningsplan worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel7
  - number: '8.1'
    text: Onze Minister neemt een besluit over elk van de ingediende bemanningssamenstellingen.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel8
  - number: '8.2'
    text: |-
      Onze Minister besluit tot afgifte van een bemanningscertificaat voor het betrokken schip, indien naar zijn oordeel
      met de voorgestelde bemanningssamenstelling
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel8
  - number: 8.2.a
    text: de veiligheid van het schip en de veilige en milieuverantwoorde vaart zijn gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel8
  - number: 8.2.b
    text: de voor de bemanning geldende normen voor arbeids- en rusttijden niet worden overschreden;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel8
  - number: 8.2.c
    text: |-
      ook overigens aan de vereisten, bedoeld in [artikel 4, eerste lid][ref1], kan worden voldaan; en


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel4
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 8.2.d
    text: |-
      wordt voldaan aan het krachtens [artikel 64][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel64
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '64'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: '8.3'
    text: De scheepsbeheerder verstrekt desgevraagd nadere inlichtingen over het bemanningsplan.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel8
  - number: '8.4'
    text: Onze Minister kan de kapitein raadplegen alvorens te besluiten omtrent de afgifte van een bemanningscertificaat.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel8
  - number: '8.5'
    text: |-
      Onze Minister stelt ambtshalve de bemanningssamenstelling van het betrokken schip vast en geeft dienovereenkomstig
      een bemanningscertificaat af, indien hij van oordeel is, dat met de bemanningssamenstelling die door de
      scheepsbeheerder wordt voorgesteld niet of niet geheel kan worden voldaan aan het tweede lid, onderdelen a tot en
      met d.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel8
  - number: '8.6'
    text: |-
      De scheepsbeheerder verschaft de kapitein een afschrift van het bemanningsplan, dat is voorzien van de
      eventuele aanvullende gegevens die zijn verstrekt op grond van het derde lid, en dat behoort bij het geldige
      bemanningscertificaat.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel8
  - number: '9'
    text: |-
      Indien voor een schip meer dan een bemanningssamenstelling geldt, worden alle bemanningssamenstellingen duidelijk
      onderscheiden in het bemanningscertificaat opgenomen.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel9
  - number: '10'
    text: 'De kapitein tekent in het scheepsdagboek aan:'
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel10
  - number: 10.a
    text: |-
      volgens welke bemanningssamenstelling het schip is bemand, indien in het bemanningscertificaat meer dan een
      samenstelling is opgenomen; en
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel10
  - number: 10.b
    text: de feiten of omstandigheden die niet in overeenstemming zijn met de gegevens van het bemanningsplan.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel10
  - number: '11.1'
    text: |-
      De scheepsbeheerder meldt aan Onze Minister alle wijzigingen van de gegevens van het bemanningsplan die hij
      voornemens is door te voeren.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel11
  - number: '11.2'
    text: |-
      Op grond van de nieuwe gegevens beslist Onze Minister of de bemanningssamenstelling overeenkomstig het geldige
      bemanningscertificaat kan worden gehandhaafd. Zo nodig geeft hij een nieuw bemanningscertificaat af.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel11
  - number: '12.1'
    text: |-
      Indien de omstandigheden daartoe aanleiding geven bij de toepassing van [artikel 4, derde lid][ref1], verzoekt
      de kapitein de scheepsbeheerder gemotiveerd hem voor een bepaald tijdstip de benodigde aanvullende middelen te
      verschaffen. Een mondeling verzoek wordt zo spoedig mogelijk schriftelijk bevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel4
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '12.2'
    text: |-
      Indien de scheepsbeheerder niet tijdig of geen gevolg geeft aan het verzoek, bedoeld in het eerste lid, stelt de
      kapitein Onze Minister daarvan schriftelijk in kennis.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel12
  - number: '13'
    text: Onze Minister trekt het bemanningscertificaat in, indien is gebleken dat
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel13
  - number: 13.a
    text: |-
      het bemanningsplan onjuiste of onvolledige gegevens bevat, zodanig dat op grond van de juiste of volledige gegevens
      dit bemanningscertificaat niet zou zijn afgegeven, dan wel
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel13
  - number: 13.b
    text: |-
      het schip in strijd met de gegevens in het bemanningscertificaat wordt gebruikt en dit afwijkende gebruik naar zijn
      redelijk oordeel een andere bemanningssamenstelling noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel13
  - number: '14.1'
    text: |-
      Onverminderd [artikel 8, vijfde lid][ref1], geeft Onze Minister voor het schip ambtshalve een nieuw
      bemanningscertificaat af voor een andere bemanningssamenstelling dan waarmee het schip op grond van het laatst
      afgegeven bemanningscertificaat is bemand, indien hem is gebleken dat het voldoen aan de eisen, gesteld in
      [artikel 8, tweede lid][ref2], met dat certificaat niet langer gewaarborgd is.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel8
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '14.2'
    text: |-
      In het geval, bedoeld in het eerste lid, nodigt Onze Minister de scheepsbeheerder uit een nieuw bemanningsplan in
      te dienen.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel14
  - number: '15.1'
    text: |-
      Nadat een nieuw bemanningscertificaat voor een schip is afgegeven wordt het oude bemanningscertificaat zo spoedig
      mogelijk aan Onze Minister gezonden.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel15
  - number: '15.2'
    text: De scheepsbeheerder draagt er zorg voor dat aan het eerste lid wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel15
  - number: '16'
    text: |-
      Onze Minister kan, met inachtneming van bij algemene maatregel van bestuur te stellen regels, voor een bepaald
      schip en voor een periode van ten hoogste zes maanden, ontheffing verlenen van de in [artikel 5, tweede lid][ref1],
      bedoelde verplichting om het schip overeenkomstig het bemanningscertificaat te bemannen.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel5
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '17.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven met betrekking tot de
      samenstelling van de bemanning voor verschillende categorieën vissersvaartuigen.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel17
  - number: '17.2'
    text: |-
      Deze paragraaf is niet van toepassing op vissersvaartuigen met een scheepslengte van minder dan 45 meter, met
      uitzondering van de [artikelen 5][ref1], [6][ref2], [13, aanhef en onderdeel b][ref3], [15][ref4], [16][ref5]
      en [17][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0009124#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0009124#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0009124#Artikel16
      [ref6]: https://wetten.overheid.nl/BWBR0009124#Artikel17
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009124
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0009124
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0009124
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0009124
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '17.3'
    text: De scheepsbeheerder dient per vissersvaartuig een aanvraag in voor een bemanningscertificaat bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel17
  - number: '17.4'
    text: Bij ministeriële regeling wordt bepaald welke gegevens bij de aanvraag worden ingediend.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel17
  - number: '18.1'
    text: |-
      Een ieder die aan boord van een schip een functie vervult waarvoor krachtens deze wet eisen zijn gesteld, is in het
      bezit van een geldig vaarbevoegdheidsbewijs voor die functie.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel18
  - number: '18.2'
    text: 'De vaarbevoegdheden, die op de in het eerste lid bedoelde vaarbevoegdheidsbewijzen kunnen worden aangetekend, zijn:'
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel18
  - number: 18.2.a
    text: |-
      kapitein alle schepen eerste stuurman alle schepen wachtstuurman alle schepen kapitein kleine schepen eerste
      stuurman kleine schepen
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel18
  - number: 18.2.b
    text: |-
      hoofdwerktuigkundige alle schepen tweede werktuigkundige alle schepen wachtwerktuigkundige alle schepen
      hoofdwerktuigkundige kleine schepen tweede werktuigkundige kleine schepen
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel18
  - number: 18.2.c
    text: eerste maritiem officier eerste maritiem officier kleine schepen maritiem officier maritiem officier kleine schepen
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel18
  - number: 18.2.d
    text: |-
      schipper zeevisvaart plaatsvervangend schipper zeevisvaart stuurman-werktuigkundige zeevisvaart stuurman
      zeevisvaart werktuigkundige zeevisvaart
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel18
  - number: 18.2.e
    text: radio-operator
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel18
  - number: 18.2.f
    text: gezel.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel18
  - number: '18.3'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald welke de onderlinge rangorde is van de in het tweede lid genoemde
      vaarbevoegdheden.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel18
  - number: '18.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald welke beperkingen of aanvullingen mogen worden
      aangebracht op een vaarbevoegdheidsbewijs in verband met de aard van de lading, het soort schip of het vaargebied.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel18
  - number: '18.5'
    text: |-
      Bij algemene maatregel van bestuur worden de vaarbevoegdheden, genoemd in het tweede lid, onderdeel d, nader
      onderscheiden naar scheepslengte, voortstuwingsvermogen of vaargebied.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel18
  - number: '18.6'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald welke specifieke beperkingen gelden voor de vaarbevoegdheden
      waarop houders van bijzondere verklaringen van geschiktheid en bekwaamheid of diploma's, afgegeven voor de datum
      van inwerkingtreding van deze wet, recht hebben.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel18
  - number: '19.1'
    text: 'Bij of krachtens algemene maatregel van bestuur worden:'
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel19
  - number: 19.1.a
    text: |-
      voor de verkrijging van de vaarbevoegdheden, genoemd in [artikel 18, tweede lid][ref1], vastgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel18
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 19.1.a.1°
    text: de beroepsvereisten;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel19
  - number: 19.1.a.2°
    text: de opgedane ervaring;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel19
  - number: 19.1.a.3°
    text: de eisen van medische geschiktheid, en
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel19
  - number: 19.1.a.4°
    text: de wijze waarop wordt beoordeeld of wordt voldaan aan de onder ten 1° en ten 2° bedoelde eisen;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel19
  - number: 19.1.b
    text: |-
      de geldigheidsduur van het vaarbevoegdheidsbewijs, alsmede de wijze van eerste afgifte, vervanging of vernieuwing
      van het vaarbevoegdheidsbewijs geregeld;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel19
  - number: 19.1.c
    text: 'de grenzen bepaald van de schepen, waarop de volgende vaarbevoegdheden mogen worden uitgeoefend:'
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel19
  - number: 19.1.c.1°
    text: kapitein kleine schepen;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel19
  - number: 19.1.c.2°
    text: eerste stuurman kleine schepen;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel19
  - number: 19.1.c.3°
    text: hoofdwerktuigkundige kleine schepen;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel19
  - number: 19.1.c.4°
    text: tweede werktuigkundige kleine schepen;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel19
  - number: 19.1.c.5°
    text: eerste maritiem officier kleine schepen, en
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel19
  - number: 19.1.c.6°
    text: maritiem officier kleine schepen.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel19
  - number: '19.2'
    text: 'Aan de voor de afgifte van een vaarbevoegdheidsbewijs benodigde beroepsvereisten kan worden voldaan door:'
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel19
  - number: 19.2.a
    text: |-
      het met goed gevolg hebben afgelegd van het afsluitend examen van een aan een op grond van de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] bekostigde of aangewezen hogeschool verbonden
      opleiding voor een nautisch beroep dan wel het met goed gevolg hebben afgelegd van het examen van een nautische
      beroepsopleiding waarvoor op grond van de [Wet educatie en beroepsonderwijs][ref2] eindtermen zijn vastgesteld, of


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005682
      - id: ref2
        bwb_id: BWBR0007625
  - number: 19.2.b
    text: het hebben gevolgd van een door Onze Minister erkende opleiding.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel19
  - number: '19.3'
    text: 'Bij ministeriële regeling worden regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel19
  - number: 19.3.a
    text: de aanvraag voor de in het tweede lid bedoelde erkenning;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel19
  - number: 19.3.b
    text: de intrekking van de erkenning.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel19
  - number: '19.4'
    text: |-
      Onze Minister stelt de criteria vast op grond waarvan een aanvraag voor de in het tweede lid bedoelde erkenning
      wordt beoordeeld.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel19
  - number: '20.1'
    text: |-
      Onze Minister besluit tot afgifte van een vaarbevoegdheidsbewijs wanneer de aanvrager voldoet aan de eisen, bedoeld
      in [artikel 19, eerste lid, aanhef en onderdeel a, ten 1°, ten 2° en ten 3°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel19
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '20.2'
    text: |-
      Bij ministeriële regeling wordt bepaald welke bescheiden worden overgelegd bij de aanvraag van een
      vaarbevoegdheidsbewijs.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel20
  - number: '20.3'
    text: |-
      Onze Minister vergewist zich ervan dat een persoon de Nederlandse nationaliteit bezit, dan wel de nationaliteit
      van een van de staten, bedoeld in [artikel 30][ref1], alvorens aan deze een van de vaarbevoegdheden als kapitein,
      onderscheidenlijk schipper, af te geven die zijn genoemd in [artikel 18, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel18
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '30'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '21'
    text: |-
      Bij ministeriële regeling kan worden bepaald voor welke bij internationale regeling aangewezen bijzondere
      functies of werkzaamheden het bezit van een certificaat of enig ander document voorgeschreven is, alsmede welke
      beroepsvereisten daarvoor gelden.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel21
  - number: '22.1'
    text: |-
      Bij algemene maatregel van bestuur worden de criteria vastgesteld met inachtneming waarvan Onze Minister
      vaarbevoegdheidsbewijzen, diploma’s of certificaten erkent die zijn afgegeven door een bevoegde autoriteit van
      een staat, niet zijnde een lid-staat van de Europese Unie, een andere staat die partij is bij de overeenkomst
      betreffende de Europese Economische Ruimte of Zwitserland.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel22
  - number: '22.2'
    text: |-
      Aan de houder van een geldig vaarbevoegdheidsbewijs, diploma of certificaat dat ingevolge het
      eerste lid is erkend, wordt, indien hij ook overigens voldoet aan de eisen gesteld ingevolge
      [artikel 19, eerste lid, aanhef en onderdeel a, ten 2° en ten 3°][ref1], en hij dienst gaat doen op een
      Nederlands schip, een vaarbevoegdheidsbewijs afgegeven, waarop een officiële verklaring is opgenomen dat dit
      vaarbevoegdheidsbewijs is afgegeven op grond van een erkend vaarbevoegdheidsbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel19
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '22.3'
    text: |-
      Een erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EG-beroepskwalificaties][ref1] voor een beroep waarvoor de
      vaarbevoegdheden genoemd in [artikel 18, tweede lid, onderdeel d][ref2], geldig zijn, wordt met een erkend
      vaarbevoegdheidsbewijs, diploma of certificaat als bedoeld in het tweede lid gelijkgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel18
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '22.4'
    text: Bij ministeriële regeling worden regels gesteld met betrekking tot de afgifte van het vaarbevoegdheidsbewijs.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel22
  - number: '22.5'
    text: |-
      Bij ministeriële regeling wordt bepaald welke bescheiden worden overgelegd bij de aanvraag voor een
      vaarbevoegdheidsbewijs als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel22
  - number: 22a.1
    text: |-
      Onze Minister erkent een bewijs van beroepsbekwaamheid dat is afgegeven door of onder de verantwoordelijkheid
      van de bevoegde autoriteit van een andere lidstaat van de Europese Unie, een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel22a
  - number: 22a.2
    text: |-
      Aan de houder van een bewijs van beroepsbekwaamheid als bedoeld in het eerste
      lid, wordt, indien hij ook overigens voldoet aan de eisen gesteld ingevolge
      [artikel 19, eerste lid, aanhef en onderdeel a, ten 1°, ten 2° en ten 3°][ref1], en hij dienst gaat doen op een
      Nederlands schip, een vaarbevoegdheidsbewijs afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel19
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 22a.3
    text: |-
      Een ingevolge het tweede lid afgegeven vaarbevoegdheidsbewijs is beperkt tot de in het oorspronkelijke bewijs
      omschreven functies, taken en verantwoordelijkheidsniveaus en bevat een officiële verklaring dat het bewijs is
      afgegeven op grond van een erkend vaarbevoegdheidsbewijs.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel22a
  - number: 22a.4
    text: |-
      Bij ministeriële regeling wordt bepaald welke bescheiden worden overgelegd bij de aanvraag van een
      vaarbevoegdheidsbewijs.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel22a
  - number: 22a.5
    text: Het tweede lid is niet van toepassing op gezellen.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel22a
  - number: '23.1'
    text: |-
      Onze Minister onderzoekt schriftelijke verklaringen over of aanwijzingen van medische ongeschiktheid of
      onbekwaamheid tot het uitoefenen van een functie aan boord van houders van een vaarbevoegdheidsbewijs als bedoeld
      in de [artikelen 18][ref1] of [22][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel22
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '23.2'
    text: |-
      Onze Minister stelt de houder van een vaarbevoegdheidsbewijs, te wiens aanzien een gegrond vermoeden van medische
      ongeschiktheid of onbekwaamheid tot het uitoefenen van zijn functie aan boord bestaat, daarvan in kennis. Hij is
      verplicht zich bij de eerste gelegenheid te onderwerpen aan een onderzoek met inachtneming van door Onze Minister
      te geven aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel23
  - number: '23.3'
    text: |-
      Bij gegrond vermoeden van medische ongeschiktheid wordt het onderzoek, bedoeld in het tweede lid, ingesteld
      door een door Onze Minister aangewezen geneeskundige of medisch specialist naar de algemene lichamelijke
      geschiktheid dan wel naar de geschiktheid van het gezichts- of gehoororgaan op de voet van het bepaalde krachtens
      [artikel 19, eerste lid, aanhef en onderdeel a, ten 3°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel19
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '23.4'
    text: |-
      Bij gegrond vermoeden van onbekwaamheid tot het uitoefenen van een functie aan boord wordt het onderzoek, bedoeld
      in het tweede lid, ingesteld door een door Onze Minister aangewezen deskundige op de voet van het bepaalde
      krachtens [artikel 19, eerste lid, aanhef en onderdeel a, ten 1°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel19
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '23.5'
    text: |-
      Indien bij een periodiek onderzoek of bij een in het tweede lid bedoeld onderzoek blijkt dat de houder van
      een vaarbevoegdheidsbewijs niet voldoet aan de krachtens deze wet gestelde eisen voor de algemene lichamelijke
      geschiktheid of aan de eisen voor de geschiktheid van het gezichts- of gehoororgaan, weigert de geneeskundige of
      medisch specialist een nieuwe geneeskundige verklaring van geschiktheid voor de zeevaart af te geven. Onze Minister
      kan de desbetreffende geneeskundige verklaring van geschiktheid voor de zeevaart ongeldig verklaren.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel23
  - number: '23.6'
    text: |-
      De [artikelen 42][ref1], [43][ref2] en [44][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0009124#Artikel44
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: '43'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009124
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '23.7'
    text: |-
      Indien de houder van een vaarbevoegdheidsbewijs niet aan de in het tweede lid bedoelde verplichting voldoet
      zonder dat van een geldige reden daartoe blijkt, kan Onze Minister zonder nader onderzoek het afgegeven
      vaarbevoegdheidsbewijs ongeldig verklaren.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel23
  - number: '24.1'
    text: |-
      Onze Minister trekt een vaarbevoegdheidsbewijs als bedoeld in de [artikelen 18][ref1] of [22][ref2] in, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel22
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 24.1.a
    text: |-
      uit een onderzoek naar de bekwaamheid, bedoeld in [artikel 23, vierde lid][ref1], blijkt dat de houder niet meer
      voldoet aan de in [artikel 19, eerste lid, aanhef en onderdeel a, ten 1°][ref2], bedoelde beroepsvereisten;


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel19
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 24.1.b
    text: |-
      een van de voor de houder voorgeschreven geneeskundige verklaringen van geschiktheid voor de zeevaart ingevolge
      [artikel 23][ref1] ongeldig is verklaard, of indien de houder blijvend medisch ongeschikt voor de zeevaart is
      verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel23
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '24.2'
    text: |-
      Een vaarbevoegdheidsbewijs kan door Onze Minister voorts worden ingetrokken indien is gebleken dat bij de aanvraag
      onjuiste gegevens zijn opgegeven dan wel dat valse of vervalste documenten zijn overgelegd.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel24
  - number: '24.3'
    text: |-
      Onze Minister kan, ter voorkoming van een noodsituatie of gevaar voor het scheepvaartverkeer, de houder van een
      vaarbevoegdheidsbewijs voor ten hoogste 24 uur een verbod opleggen aan boord van een schip een functie uit te
      oefenen of werkzaamheden te verrichten.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel24
  - number: '24.4'
    text: |-
      Onze Minister trekt een vaarbevoegdheidsbewijs als bedoeld in [artikel 22][ref1] in, indien de geldigheid van het
      buitenlandse diploma, certificaat of bevoegdheidsbewijs op grond waarvan dat vaarbevoegdheidsbewijs is afgegeven,
      door of vanwege de bevoegde buitenlandse autoriteit is geschorst of ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel22
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '24.5'
    text: |-
      Onze Minister stelt de bevoegde buitenlandse autoriteit in kennis van de toepassing van het eerste en tweede lid
      van dit artikel ten aanzien van een vaarbevoegdheidsbewijs als bedoeld in [artikel 22][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel22
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '25.1'
    text: |-
      Onze Minister kan ten aanzien van een bemanningslid, met inachtneming van bij algemene maatregel van bestuur
      te stellen regels, voor een bepaald schip, en voor een periode van ten hoogste zes maanden, ontheffing
      verlenen van de in [artikel 18, eerste lid][ref1], bedoelde verplichting om in het bezit te zijn van een geldig
      vaarbevoegdheidsbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel18
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '25.2'
    text: |-
      Onze Minister kan aan de houder van een vaarbevoegdheid, geldig op kleine schepen, ontheffing geven
      van de in [artikel 18, eerste lid][ref1], bedoelde verplichting om in het bezit te zijn van een geldig
      vaarbevoegdheidsbewijs, voorzover die bevoegdheid wordt gebruikt aan boord van een schip, dat als gevolg van een
      verbouwing niet meer als klein schip is aan te merken, indien wordt voldaan aan de volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel18
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 25.2.a
    text: |-
      de ontheffing geldt voor de duur van de opleiding van de houder ten behoeve van een bevoegdheid geldig op alle
      schepen, met een maximum van twee jaren, en
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel25
  - number: 25.2.b
    text: |-
      de houder heeft in de vijf jaren, voorafgaand aan de aanvraag, twee jaren aan boord van dit schip, of aan boord van
      een naar het oordeel van Onze Minister identiek schip, dienst gedaan.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel25
  - number: 25a.1
    text: |-
      Ter uitvoering van de [artikelen 20 tot en met 24][ref1] worden persoonsgegevens betreffende de gezondheid
      verwerkt. De verwerking van deze gegevens vindt plaats teneinde te kunnen beoordelen of degene die aan boord van
      een schip werkzaamheden verricht waarvoor het bezit van een vaarbevoegdheidsbewijs is vereist, voldoet of niet meer
      voldoet aan de wettelijke vereisten betreffende de medische geschiktheid in verband met de afgifte of het behoud
      van een vaarbevoegdheidsbewijs. Onze Minister is verantwoordelijke voor deze verwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel20
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 25a.2
    text: |-
      Ter uitvoering van [artikel 25][ref1] worden persoonsgegevens betreffende de gezondheid verwerkt. De verwerking van
      deze gegevens vindt plaats teneinde te kunnen beoordelen of aan een bemanningslid, onderscheidenlijk aan de houder
      van een vaarbevoegdheid, ontheffing kan worden verleend van de verplichting in het bezit te zijn van een geldig
      vaarbevoegdheidsbewijs. Onze Minister is verantwoordelijke voor deze verwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel25
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '25'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '26'
    text: De kapitein van een vissersvaartuig heeft de titel van schipper.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel26
  - number: '27.1'
    text: |-
      De kapitein is belast met de handhaving van de openbare orde aan boord en oefent aan boord over alle opvarenden
      gezag uit.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel27
  - number: '27.2'
    text: |-
      De kapitein belast een bemanningslid niet met werkzaamheden aan boord, waarvoor een vaarbevoegdheid of
      beroepskwalificatie vereist is, indien dat bemanningslid niet blijkens zijn geldige vaarbevoegdheidsbewijs of,
      indien dat is toegestaan, blijkens een document als bedoeld in [artikel 21][ref1] bevoegd is die werkzaamheden aan
      boord te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel21
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '27.3'
    text: |-
      De opvarenden zijn verplicht de bevelen van de kapitein na te komen die door de kapitein worden gegeven in het
      belang der veiligheid of tot handhaving van de orde, met inbegrip van de openbare orde.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel27
  - number: '28'
    text: |-
      De kapitein oefent zijn gezag uit zodra hij aan boord is en het gezag heeft aanvaard of overgenomen, en zolang hij
      het gezag niet heeft overgedragen of de scheepsbeheerder hem het gezag niet heeft ontnomen.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel28
  - number: '29.1'
    text: 'Op Nederlandse schepen worden alleen personen als kapitein aangesteld die de nationaliteit bezitten van:'
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel29
  - number: 29.1.a
    text: het Koninkrijk der Nederlanden, dan wel
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel29
  - number: 29.1.b
    text: |-
      van een andere staat, doch uitsluitend indien zij ingevolge [artikel 30][ref1] zijn vrijgesteld van de in de aanhef
      en onderdeel a genoemde eis.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel30
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '30'
        hoofdstuk: '3'
  - number: '29.2'
    text: |-
      Bij ministeriële regeling kan, onder het stellen van voorwaarden of beperkingen, ten behoeve van vissersvaartuigen
      vrijstelling worden verleend van het in het eerste lid bedoelde vereiste.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel29
  - number: '30.1'
    text: |-
      Personen die de nationaliteit bezitten van een van de lidstaten van de Europese Unie of van een van de overige
      staten die partij zijn bij de Overeenkomst inzake de Europese Economische Ruimte, zijn vrijgesteld van de
      nationaliteitseis, bedoeld in [artikel 29, eerste lid, aanhef en onder a][ref1], voor het dienstdoen op Nederlandse
      schepen die geen vissersvaartuig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel29
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '29'
        hoofdstuk: '3'
  - number: '30.2'
    text: |-
      Aan personen die de nationaliteit bezitten van een andere staat kan bij regeling van Onze Minister vrijstelling
      worden verleend van de nationaliteitseis, bedoeld in [artikel 29, eerste lid, aanhef en onder a][ref1], voor het
      dienstdoen op Nederlandse schepen die geen vissersvaartuig zijn, mits het betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel29
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '29'
        hoofdstuk: '3'
  - number: 30.2.a
    text: |-
      staten waarmee, ingevolge een daartoe strekkend besluit van de Raad van de Europese Unie,
      toetredingsonderhandelingen gaande zijn en die voorkomen op een lijst die bij regeling van Onze Minister wordt
      vastgesteld, of
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel30
  - number: 30.2.b
    text: een staat die niet behoort tot een van de staten, bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel30
  - number: '30.3'
    text: 'De vrijstelling, bedoeld in het tweede lid, kan slechts worden verleend indien:'
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel30
  - number: 30.3.a
    text: |-
      het Koninkrijk der Nederlanden voor Nederland met die staat een schriftelijke afspraak heeft gemaakt voor de
      erkenning van vaarbevoegdheidsbewijzen als bedoeld in Voorschrift I/10 van de Bijlage van het op 7 juli 1978
      te Londen tot stand gekomen Internationale Verdrag betreffende de normen voor zeevarenden inzake opleiding,
      diplomering en wachtdienst, 1978 (Trb. 1981, 144), en
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel30
  - number: 30.3.b
    text: de erkenningsprocedure, opgenomen in artikel 19 van de bemanningsrichtlijn, is voltooid.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel30
  - number: '30.4'
    text: Aan de vrijstelling, bedoeld in het tweede lid, kunnen beperkingen of nadere voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel30
  - number: '30.5'
    text: |-
      Door werkgevers- en werknemersorganisaties in de sector koopvaardij, respectievelijk de sector zeegaande waterbouw
      wordt, ter regulering van de arbeidsmarkt voor kapiteins met de Nederlandse nationaliteit, respectievelijk die
      van een staat als bedoeld in het eerste lid, voor hun sector een privaatrechtelijke regeling vastgesteld omtrent
      afgifte aan een scheepsbeheerder van een schriftelijke toestemming tot het aanstellen van een persoon met een
      andere nationaliteit in de functie van kapitein.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel30
  - number: '30.6'
    text: |-
      Elk der regelingen, bedoeld in het vijfde lid, bevat bepalingen ten aanzien van de afgifte, respectievelijk de
      weigering van een verklaring als bedoeld in het vijfde lid, door een paritair samengestelde commissie, bestaande
      uit vertegenwoordigers van de werkgevers- en werknemersorganisaties in de sector koopvaardij, respectievelijk de
      sector zeegaande waterbouw.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel30
  - number: '30.7'
    text: 'De regeling als bedoeld in het vijfde lid, bevat daarnaast in elk geval:'
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel30
  - number: 30.7.a
    text: |-
      een klachtenprocedure ten behoeve van eerste stuurlieden, respectievelijk eerste maritieme officieren die naar hun
      oordeel op onjuiste gronden niet zijn aangesteld in de functie van kapitein op een Nederlands schip;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel30
  - number: 30.7.b
    text: de vaststelling van de werkzaamheden van de commissie, bedoeld in het zesde lid, en
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel30
  - number: 30.7.c
    text: |-
      de wijze van verkrijging van betrouwbare en zo volledig mogelijke informatie als omschreven in het achtste lid,
      welke jaarlijks vóór 1 april aan Onze Minister dient te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel30
  - number: '30.8'
    text: 'De informatie, bedoeld in het zevende lid, onder c, omvat:'
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel30
  - number: 30.8.a
    text: het aantal zeevarenden op de Nederlandse vloot, gerangschikt naar functie, leeftijd en nationaliteit;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel30
  - number: 30.8.b
    text: |-
      het aantal Nederlandse officieren dat in het verstreken jaar voor het eerst, anders dan als stagiair, is gemonsterd
      op Nederlandse zeeschepen;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel30
  - number: 30.8.c
    text: het aantal beschikbare stageplaatsen;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel30
  - number: 30.8.d
    text: het aantal Nederlandse studenten dat als stagiair is geplaatst, en
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel30
  - number: 30.8.e
    text: het aantal buitenlandse studenten dat als stagiair is geplaatst, alsmede de nationaliteit van deze stagiairs.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel30
  - number: '30.9'
    text: |-
      Voorafgaand aan de vaststelling van een regeling als bedoeld in het tweede lid pleegt Onze Minister overleg over
      het ontwerp van een regeling met de werkgevers- en werknemersorganisaties in de sector koopvaardij, respectievelijk
      de sector zeegaande waterbouw.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel30
  - number: '30.10'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld met betrekking tot de vrijstelling van de eisen neergelegd
      in [artikel 29, eerste lid][ref1], voor de gevallen waarin de privaatrechtelijke regeling, bedoeld in het vijfde
      lid, niet binnen drie maanden na de inwerkingtreding van dat vijfde lid tot stand is gekomen, dan wel vervallen is
      zonder dat door de werkgevers- en werknemersorganisaties in de desbetreffende sector is voorzien in vervanging van
      die regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel29
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '29'
        hoofdstuk: '3'
  - number: '31.1'
    text: |-
      In geval van belet of ontstentenis van de kapitein van een Nederlands schip, niet zijnde een vissersvaartuig,
      treedt als kapitein op de eerste stuurman, onderscheidenlijk de eerste maritiem officier.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel31
  - number: '31.2'
    text: |-
      In geval geen eerste stuurman of eerste maritiem officier aanwezig is, treedt als kapitein op een door de
      scheepsbeheerder aangewezen persoon.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel31
  - number: '31.3'
    text: |-
      In geval van belet of ontstentenis van de kapitein van een vissersvaartuig treedt als kapitein op de
      plaatsvervangend schipper of, bij afwezigheid van een plaatsvervangend schipper, een door de scheepsbeheerder
      aangewezen persoon.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel31
  - number: '32.1'
    text: |-
      De scheepsbeheerder draagt er zorg voor dat de kapitein op grond van de door hem gegeven zienswijze bij de
      toepassing van [artikel 4, derde lid][ref1], of bij toepassing van [artikel 8, vierde lid][ref2], niet benadeeld
      wordt in zijn positie in de zeescheepvaartonderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel8
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '32.2'
    text: |-
      De kapitein kan de kantonrechter verzoeken te bepalen dat de scheepsbeheerder gevolg dient te geven aan hetgeen in
      het eerste lid is bepaald.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel32
  - number: '33.1'
    text: Aan boord van een schip is een monsterrol, die wordt opgemaakt en gewijzigd door de kapitein.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel33
  - number: '33.2'
    text: |-
      In de monsterrol worden ten minste de namen en functies opgenomen van de bemanningsleden die de functies vervullen,
      genoemd in het bemanningscertificaat, alsmede van de bemanningsleden die door de scheepsbeheerder dan wel de
      kapitein, met toepassing van respectievelijk [artikel 4, eerste lid][ref1], en [artikel 4, vierde lid][ref2], naast
      de eerstbedoelde bemanningsleden aan boord zijn geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel4
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '33.3'
    text: De monsterrol heeft een geldigheidsduur van niet meer dan twaalf maanden.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel33
  - number: '33.4'
    text: |-
      De kapitein stelt Onze Minister binnen een week dan wel in de eerstvolgende haven in kennis van een door hem
      opgemaakte monsterrol of van wijzigingen in de monsterrol.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel33
  - number: '34.1'
    text: 'Bij of krachtens algemene maatregel van bestuur:'
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel34
  - number: 34.1.a
    text: wordt bepaald welke gegevens van de bemanning voorts worden opgenomen in de monsterrol;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel34
  - number: 34.1.b
    text: wordt het model van de monsterrol vastgesteld;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel34
  - number: 34.1.c
    text: worden de wijze en frequentie van opmaken en wijzigen van de monsterrol bepaald;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel34
  - number: 34.1.d
    text: |-
      kunnen regels worden gesteld met betrekking tot de wijze waarop de Onze Minister van een opgemaakte of gewijzigde
      monsterrol in kennis wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel34
  - number: '34.2'
    text: |-
      Bij ministeriële regeling kan van de verplichting, genoemd in [artikel 33, eerste lid][ref1], en van de bepalingen
      krachtens het eerste lid van dit artikel ten behoeve van bepaalde categorieën van schepen vrijstelling worden
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel33
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '34.3'
    text: |-
      Onze Minister kan in bijzondere gevallen van de verplichting, genoemd in [artikel 33, eerste lid][ref1], en van
      de bepalingen krachtens het eerste lid van dit artikel ontheffing verlenen ten behoeve van een bepaald schip en
      gedurende een bepaalde periode. Aan deze ontheffing kunnen beperkingen en voorwaarden worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel33
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '35'
    text: |-
      De bemanningsleden, bedoeld in [artikel 33, tweede lid][ref1], zijn in het bezit van een geldig monsterboekje of
      een voorlopig monsterboekje, waaruit de gegevens, die op de monsterrol worden vermeld, worden overgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel33
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '36'
    text: Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel36
  - number: 36.a
    text: het monsterboekje of het voorlopig monsterboekje, alsmede de afgifte ervan;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel36
  - number: 36.b
    text: de in het monsterboekje en het voorlopig monsterboekje op te nemen gegevens, en
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel36
  - number: 36.c
    text: de gegevens die anderen dan de kapitein in het monsterboekje of het voorlopig monsterboekje mogen aantekenen.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel36
  - number: '37.1'
    text: Een monsterboekje is tot tien jaar na de datum van afgifte geldig.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel37
  - number: '37.2'
    text: Een voorlopig monsterboekje is tot 3 maanden na de datum van afgifte geldig.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel37
  - number: '38.1'
    text: 'De kapitein tekent van een bemanningslid in het monsterboekje aan:'
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel38
  - number: 38.1.a
    text: de dag van aanmonstering;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel38
  - number: 38.1.b
    text: de dag van afmonstering;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel38
  - number: 38.1.c
    text: de functie waarin het bemanningslid heeft dienst gedaan, en
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel38
  - number: 38.1.d
    text: de naam en de roepletters van het schip.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel38
  - number: '38.2'
    text: In het monsterboekje wordt het loon noch enige gedragsbeoordeling opgenomen.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel38
  - number: '39.1'
    text: |-
      Indien het bemanningslid van mening is, dat de kapitein of de ander, bedoeld in
      [artikel 36, aanhef en onderdeel c][ref1], in zijn monsterboekje vermeldingen in strijd met [artikel 38][ref2]
      heeft gedaan of nagelaten, kan hij daarover een klacht indienen bij Onze Minister. Deze beslist, zo nodig na
      verhoor of behoorlijke oproeping van belanghebbenden, en brengt de door hem nodig geachte verbetering in het boekje
      aan.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel38
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '36'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '39.2'
    text: |-
      De bevoegdheid van het bemanningslid tot het indienen van een klacht als bedoeld in het eerste lid vervalt door
      verloop van vier weken na de dag van afmonstering in een Nederlandse haven en van zes maanden na de dag van
      afmonstering buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel39
  - number: '40.1'
    text: |-
      Elk bemanningslid is in het bezit van een of meer van de in het tweede lid genoemde geldige geneeskundige
      verklaringen van geschiktheid voor de zeevaart, waaruit blijkt dat hij is gekeurd door een geneeskundige of medisch
      specialist die door Onze Minister daartoe is aangewezen, en dat hij voldoet aan de eisen van medische geschiktheid,
      vastgesteld krachtens [artikel 19, eerste lid, aanhef en onderdeel a, ten 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel19
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '40.2'
    text: |-
      De in het eerste lid bedoelde geneeskundige verklaringen van geschiktheid voor de zeevaart zijn de geneeskundige
      verklaringen:
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel40
  - number: 40.2.a
    text: betreffende de algemene lichamelijke geschiktheid;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel40
  - number: 40.2.b
    text: betreffende het gezichtsorgaan, en
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel40
  - number: 40.2.c
    text: betreffende het gehoororgaan.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel40
  - number: 40a
    text: |-
      Een geneeskundige verklaring waaruit blijkt dat een bemanningslid is gekeurd en medisch geschikt bevonden voor
      de zeevaart door een geneeskundige of medisch specialist die door de bevoegde autoriteit van een andere lidstaat
      van de Europese Unie, een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische
      Ruimte of Zwitserland daartoe is aangewezen, wordt gelijkgesteld met een geneeskundige verklaring als bedoeld in
      [artikel 40, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel40
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '40'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '41'
    text: |-
      De geneeskundige verklaringen van geschiktheid voor de zeevaart, bedoeld in [artikel 40, eerste lid][ref1], worden
      bij aanmonstering overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel40
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '40'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '42.1'
    text: |-
      Indien de geneeskundige of medisch specialist na de keuring weigert aan de gekeurde de vereiste geneeskundige
      verklaring van geschiktheid voor de zeevaart af te geven, heeft de gekeurde het recht zich nogmaals te laten keuren
      door een door Onze Minister als scheidsrechter aangewezen geneeskundige of medisch specialist.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel42
  - number: '42.2'
    text: Het oordeel van de als scheidsrechter aangewezen geneeskundige of medisch specialist is bindend.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel42
  - number: '42.3'
    text: |-
      De gekeurde, aan wie geweigerd is een geneeskundige verklaring van geschiktheid voor de zeevaart af te geven,
      heeft het recht zich opnieuw door een scheidsrechter te laten onderzoeken, indien er medische gronden zijn om te
      veronderstellen dat de reden voor de eerdere afkeuring is vervallen.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel42
  - number: '42.4'
    text: |-
      De gekeurde die tijdens het onderzoek heeft meegedeeld dat hij van mening is dat hij op medische gronden ongeschikt
      voor de zeevaart moet worden bevonden, heeft het recht zich door een scheidsrechter te laten onderzoeken, indien
      de keurende geneeskundige of medische specialist geen bezwaren heeft geconstateerd tegen afgifte aan hem van een
      geneeskundige verklaring van geschiktheid voor de zeevaart.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel42
  - number: '43.1'
    text: |-
      De geneeskundige verklaring van geschiktheid voor de zeevaart, afgegeven door een geneeskundige of medisch
      specialist die niet ingevolge [artikel 42][ref1] als scheidsrechter is aangewezen, nadat een andere geneeskundige
      of medisch specialist de afgifte van een geneeskundige verklaring van geschiktheid voor de zeevaart heeft
      geweigerd, is ongeldig.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel42
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '43.2'
    text: |-
      Indien uit een volgende keuring blijkt dat de gekeurde niet aan de gestelde eisen van medische geschiktheid
      voldoet, vervalt de geldigheid van de desbetreffende, eerder afgegeven, verklaring van geschiktheid voor de
      zeevaart.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel43
  - number: '44.1'
    text: Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel44
  - number: 44.1.a
    text: |-
      de medische keuring, bedoeld in [artikel 40, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel40
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '40'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 44.1.b
    text: de herkeuring door als scheidsrechters aangewezen geneeskundigen of medisch specialisten;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel44
  - number: 44.1.c
    text: |-
      de aanwijzing van geneeskundigen, medisch specialisten en scheidsrechters, alsmede de intrekking van deze
      aanwijzing;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel44
  - number: 44.1.d
    text: de geldigheidsduur van de geneeskundige verklaringen van geschiktheid voor de zeevaart.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel44
  - number: '44.2'
    text: |-
      Onze Minister kan voor een bepaalde periode van de verplichting te voldoen aan de geldende medische normen
      ontheffing verlenen, indien een als scheidsrechter aangewezen geneeskundige of medisch specialist daartoe
      gemotiveerd adviseert.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel44
  - number: '45'
    text: |-
      Indien korte tijd voor vertrek van een schip de bemanning moet worden aangevuld, kan, indien dringende
      omstandigheden nopen tot het aanmonsteren van personen die niet in het bezit zijn van een of meer geldige
      geneeskundige verklaringen van geschiktheid voor de zeevaart, door Onze Minister ontheffing worden verleend van de
      in [artikel 40, eerste lid][ref1], bedoelde verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel40
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '40'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '46'
    text: |-
      Indien de monsterrol moet worden opgemaakt of aangevuld in een haven buiten Nederland, waar geen geneeskundigen
      of medisch specialisten als bedoeld in [artikel 40, eerste lid][ref1], aanwezig zijn, wordt ten aanzien van de
      geneeskundige verklaringen van geschiktheid voor de zeevaart het ter plaatse geldende gebruik gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel40
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '40'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '47'
    text: |-
      In de gevallen, bedoeld in [de artikelen 45][ref1] en [46][ref2], wordt bij de eerste gelegenheid een medische
      keuring door een geneeskundige of medisch specialist als bedoeld in [artikel 40, eerste lid][ref3], verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0009124#Artikel40
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: '46'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009124
        artikel: '40'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '48.1'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat bijzondere categorieën opvarenden in het bezit moeten zijn van een
      geldige geneeskundige verklaring van geschiktheid voor de zeevaart.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel48
  - number: '48.2'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat bemanningsleden op bepaalde schepen vrijgesteld zijn van
      onderdelen van de medische keuring.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel48
  - number: 48b.1
    text: |-
      De scheepsbeheerder stelt voor een schip van 500 GT of meer dat internationale reizen maakt, een verklaring
      naleving maritieme arbeid deel II op waarin maatregelen zijn opgenomen om te waarborgen dat de in
      [artikel 48c, eerste lid][ref1], bedoelde eisen voortdurend worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel48c
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel48b
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: 48c
        hoofdstuk: 4B
  - number: 48b.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de inhoud van de verklaring naleving maritieme arbeid
      deel II en over de eisen die aan deze inhoud worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel48b
  - number: 48b.3
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot het model van de verklaring naleving
      maritieme arbeid.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel48b
  - number: 48b.4
    text: Het bepaalde bij of krachtens dit artikel is niet van toepassing op vissersvaartuigen.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel48b
  - number: 48c.1
    text: |-
      Onze Minister geeft voor een schip van 500 GT of meer dat internationale reizen maakt, op aanvraag een certificaat
      maritieme arbeid en een verklaring naleving maritieme arbeid af, indien de door de scheepsbeheerder opgestelde
      verklaring naleving maritieme arbeid deel II voldoet aan het bepaalde krachtens [artikel 48b][ref1] en na onderzoek
      blijkt dat voor het desbetreffende schip wordt voldaan aan de eisen, bedoeld in Aanhangsel A5-1 van het Maritiem
      Arbeidsverdrag met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel48b
