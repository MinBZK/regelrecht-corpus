  - number: 55t.3
    text: |-
      Aan de behandeling van het verzoek tot herziening ter zitting van het College van Beroep voor het bedrijfsleven
      nemen geen leden deel die hebben deelgenomen aan de behandeling van de zaak, waarvan de herziening wordt verzocht.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel55t
  - number: '56'
    text: |-
      Het is verboden met een schip naar zee te gaan, een schip naar zee te doen gaan of op zee dan wel op buiten
      Nederland gelegen wateren die ter plaatse als binnenwater worden aangemerkt, te gebruiken of te doen gebruiken,
      zonder dat aan boord van het schip een geldig bemanningscertificaat voorhanden is.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel56
  - number: '57'
    text: Het is verboden
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel57
  - number: 57.a
    text: om een schip te bemannen met minder bemanningsleden dan is aangegeven in het bemanningscertificaat;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel57
  - number: 57.b
    text: |-
      een schip zodanig te bemannen dat niet ten minste de op het bemanningscertificaat aangegeven functies worden
      vervuld door tot het vervullen van die functies bevoegde bemanningsleden, of
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel57
  - number: 57.c
    text: het schip te gebruiken in strijd met de voorwaarden van het bemanningscertificaat.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel57
  - number: '58.1'
    text: |-
      Het is verboden het houden van uitkijk, dan wel het optreden als chef van de wacht op de brug of als chef van de
      wacht in de machinekamer of machinekamers, op te dragen aan of te laten verrichten door bemanningsleden die tot het
      verrichten van die werkzaamheden niet bevoegd zijn.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel58
  - number: '58.2'
    text: |-
      Het is verboden aan boord werkzaamheden waarvoor ingevolge [artikel 18][ref1] een vaarbevoegdheidsbewijs is
      vereist, te verrichten, indien men hiertoe niet door middel van een geldig vaarbevoegdheidsbewijs bevoegd is
      verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel18
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '58.3'
    text: |-
      Het is verboden aan boord werkzaamheden waarvoor ingevolge [artikel 21][ref1] een certificaat of een ander document
      is vereist, te verrichten, indien men hiertoe niet door middel van een geldig certificaat of document bevoegd is
      verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel21
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '59'
    text: |-
      Het is verboden na te laten de monsterrol op te maken, opnieuw op te maken of bij te stellen, dan wel na te laten
      Onze Minister ingevolge [artikel 33, vierde lid][ref1], in kennis te stellen van de opgemaakte monsterrol of van
      een wijziging hiervan.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel33
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '60'
    text: |-
      Het is verboden de verplichtingen ingevolge [artikel 3, tweede en derde lid][ref1],
      [artikel 4, eerste, tweede en vierde lid,][ref2] en [artikel 29, eerste lid][ref3], niet na te komen.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0009124#Artikel29
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0009124
        artikel: '29'
        hoofdstuk: '3'
  - number: '61'
    text: |-
      Tegen een op grond van deze wet genomen besluit van een ambtenaar van de Inspectie Verkeer en Waterstaat tot
      aanhouding van een schip, kan iedere belanghebbende beroep instellen bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel61
  - number: '62'
    text: Bij ministeriële regeling worden de tarieven vastgesteld voor
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel62
  - number: 62.a
    text: de afgifte van bemanningscertificaten;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel62
  - number: 62.b
    text: de beoordeling van een bemanningsplan;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel62
  - number: 62.c
    text: de afgifte, vervanging of vernieuwing van vaarbevoegdheidsbewijzen;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel62
  - number: 62.d
    text: de afgifte of vervanging van een monsterboekje of een voorlopig monsterboekje;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel62
  - number: 62.e
    text: het afnemen van examens, aanvullende examens en toetsen;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel62
  - number: 62.f
    text: het verlenen van ontheffingen;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel62
  - number: 62.g
    text: vergoedingen van gecommitteerden en deskundigen;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel62
  - number: 62.h
    text: |-
      de afgifte, vervanging of vernieuwing van bijzondere documenten, bedoeld in [artikel 21][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel21
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 62.i
    text: de afgifte van diploma's, getuigschriften en verklaringen;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel62
  - number: 62.j
    text: |-
      de behandeling van een aanvraag voor de erkenning van een opleiding als bedoeld in
      [artikel 19, tweede lid, onder b][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel19
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 62.k
    text: de afgifte, vervanging of vernieuwing van certificaten maritieme arbeid en verklaringen naleving maritieme arbeid.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel62
  - number: '63'
    text: |-
      Onze Minister kan gecommitteerden of deskundigen aanwijzen, die bevoegd zijn de examens bij te wonen die worden
      afgenomen ter verkrijging van de bij of krachtens deze wet bedoelde vaarbevoegdheden, diploma’s of certificaten.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel63
  - number: '64'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen, ter uitvoering van het op 7 juli 1978 te Londen tot stand
      gekomen Internationale Verdrag betreffende de normen voor zeevarenden inzake opleiding, diplomering en wachtdienst,
      1978 (Trb. 1981, 144), alsmede van andere verdragen of van besluiten van volkenrechtelijke organisaties, regels met
      betrekking tot de bemanning van schepen worden gesteld ter waarborging van de veilige en milieuverantwoorde vaart.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel64
  - number: '65'
    text: |-
      Er is een Centraal register bemanningsgegevens, waarin Onze Minister de afgegeven monsterboekjes en voorlopige
      monsterboekjes, de afgegeven en ingetrokken vaarbevoegdheidsbewijzen als bedoeld in de [artikelen 18][ref1]
      en [22][ref2], de gegeven vrijstellingen en ontheffingen, en de hem toegezonden gegevens van de monsterrollen,
      registreert.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel22
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 65a
    text: |-
      Onze Minister is bevoegd aan de tot het verstrekken en ontvangen van informatie bevoegde autoriteit van een
      lidstaat van de Europese Unie, een andere staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte of het op 7 juli 1978 te Londen tot stand gekomen Internationaal Verdrag betreffende de
      normen voor zeevarenden inzake opleiding, diplomering en wachtdienst, 1978 (Trb. 1981, 144), informatie te
      verstrekken en van deze te ontvangen omtrent de verlening van een vaarbevoegdheidsbewijs of een ander bewijs van
      beroepsbekwaamheid.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel65a
  - number: '66'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de wijze waarop de gegevens in het Centraal
      register bemanningsgegevens worden geregistreerd.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel66
  - number: '67.1'
    text: Er is een openbaar register van bemanningscertificaten, dat door Onze Minister wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel67
  - number: '67.2'
    text: Dit register kan door eenieder kosteloos worden geraadpleegd.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel67
  - number: '67.3'
    text: |-
      Desgevraagd wordt tegen ten hoogste de kostprijs een afschrift verstrekt van het bemanningscertificaat voor een
      bepaald schip.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel67
  - number: '68'
    text: |-
      Onze Minister kan examencommissies aanwijzen, bij welke aan degenen, die geen opleiding aan een door het Rijk
      bekostigde instelling hebben gevolgd, gelegenheid wordt geboden examen af te leggen voor de hierna genoemde
      getuigschriften, onderscheidenlijk verklaringen: - als maritiem officier;
        - als stuurman/werktuigkundige kleine schepen;
        - schipper/machinist beperkt werkgebied;
        - stuurman/werktuigkundige voor de zeevisvaart SW4;
        - stuurman/werktuigkundige voor de zeevisvaart SW5;
        - stuurman/werktuigkundige voor de zeevisvaart SW6;
        - stuurman grote zeilvaart;
        - stuurman kleine zeilvaart;
        - stoomvoortstuwing.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel68
  - number: '69'
    text: |-
      Bij algemene maatregel van bestuur worden de beroepsvereisten bepaald voor de functies, tot welke de in
      [artikel 68][ref1] genoemde getuigschriften en verklaringen toegang verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel68
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '68'
        hoofdstuk: '7'
        paragraaf: '7'
  - number: '70.1'
    text: |-
      De verklaringen van geschiktheid en bekwaamheid, die op grond van [Hoofdstuk VII van het Schepenbesluit 1965][ref1]
      zijn afgegeven voor de datum van inwerkingtreding van deze wet, behouden hun geldigheid overeenkomstig de daarop
      aangegeven einddatum.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#HoofdstukVII
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0002501
        hoofdstuk: VII
  - number: '70.2'
    text: |-
      Verklaringen van geschiktheid en bekwaamheid, waarop geen einddatum is vermeld, zijn geldig tot de eerste dag van
      de maand volgend op het bereiken van het 65ste jaar van de houder.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel70
  - number: '71.1'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald op welke vaarbevoegdheidsbewijzen, bedoeld in
      [hoofdstuk 2, paragraaf 3][ref1], van deze wet, de houder van een geldige Nederlandse verklaring van geschiktheid
      en bekwaamheid, van een zeevaartdiploma of een diploma voor de zeevisvaart aanspraak heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0009124
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '71.2'
    text: |-
      De vaarbevoegdheden, bedoeld in het eerste lid, zijn ten minste gelijkwaardig aan de bevoegdheid ingevolge
      de verklaring van geschiktheid en bekwaamheid die, of het diploma voor de zeevisvaart dat voor vervanging in
      aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel71
  - number: '71.3'
    text: |-
      Onder de zeevaartdiploma's, bedoeld in het eerste lid, worden mede verstaan de diploma's, voor inwerkingtreding
      van deze wet verkregen op grond van het Besluit van 3 april 1941 (Stb. B 32), houdende bepalingen betreffende
      gelijkstelling van de Zeevaartdiploma’s uitgereikt door of vanwege den Gouverneur van Curaçao met de diploma’s
      uitgereikt door de commissie ingesteld ingevolge de Wet op de Zeevaartdiploma’s (Staatsblad 1935 No. 456), alsmede
      de diploma's, voor inwerkingtreding van deze wet verkregen op grond van het Besluit van 12 september 1942 (Stb. C
      55), houdende gelijkstelling van diploma’s voor stuurlieden en machinisten.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel71
  - number: '71.4'
    text: |-
      Bij de in het eerste lid bedoelde algemene maatregel van bestuur kunnen aanvullende beroepsvereisten worden gesteld
      waaraan de houder van een van de diploma's, genoemd in [artikel 76][ref1] moet voldoen alvorens hij in aanmerking
      komt voor de afgifte van het daarbij genoemde vaarbevoegdheidsbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel76
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '76'
        hoofdstuk: '8'
  - number: '72'
    text: |-
      De documenten, houdende de minimum voorgeschreven bemanningssamenstelling met de functies van de bemanningsleden,
      die zijn afgegeven voor inwerkingtreding van deze wet, behouden hun geldigheid overeenkomstig de einddatum van het
      certificaat van deugdelijkheid waar zij bij behoren.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel72
  - number: '73'
    text: |-
      Scheepsbeheerders van schepen, die zijn bemand overeenkomstig de modellen van het Besluit zeevaartdiploma’s
      en [Hoofdstuk VII van het Schepenbesluit 1965][ref1] of het [Bemanningseisenbesluit][ref2], waarvan de
      bemanningssamenstelling niet wordt gewijzigd na inwerkingtreding van deze wet, kunnen een beperkt bemanningsplan
      indienen bij de aanvraag van het eerste bemanningscertificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#HoofdstukVII
      [ref2]: https://wetten.overheid.nl/BWBR0005266
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0002501
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0005266
  - number: '74'
    text: |-
      De geneeskundige verklaringen van geschiktheid voor de zeevaart, die zijn afgegeven voor inwerkingtreding van deze
      wet, behouden hun geldigheid overeenkomstig de daarop aangegeven einddatum.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel74
  - number: '75'
    text: |-
      Op aanvragen voor bemanningsdocumenten, verklaringen van geschiktheid en bekwaamheid, monsterboekjes en
      geneeskundige verklaringen voor de zeevaart, die zijn ingediend voor het tijdstip van inwerkingtreding van deze
      wet en op dat tijdstip nog in behandeling zijn, wordt besloten met inachtneming van het bepaalde bij of krachtens
      deze wet.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel75
  - number: '76.1'
    text: |-
      Tot 1 februari 2002 kan examen worden afgelegd ter verkrijging van het diploma - als eerste stuurman voor de grote
      handelsvaart;
        - als tweede stuurman voor de grote handelsvaart;
        - als derde stuurman voor de grote handelsvaart;
        - als stuurman voor de kleine handelsvaart en het aanvullingsdiploma als stuurman voor de kleine handelsvaart;
        - C als scheepswerktuigkundige;
        - B als scheepswerktuigkundige;
        - A als scheepswerktuigkundige;
        - als motordrijver;
        - voor de zeevisvaart SW VI;
        - voor de zeevisvaart SW V;
        - voor de zeevisvaart S IV-v;
        - voor de zeevisvaart W IV-v.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel76
  - number: '76.2'
    text: |-
      Tot 1 februari 2007 worden aan houders van een verklaring dat het desbetreffende examen met goed gevolg werd
      afgelegd de in het eerste lid genoemde diploma’s afgegeven, alsmede de diploma’s - als stuurman voor de grote
      sleepvaart;
        - het voorlopig diploma als scheepswerktuigkundige;
        - als assistent scheepswerktuigkundige.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel76
  - number: '76.3'
    text: |-
      Bij ministeriële regeling worden met inachtneming van de in het eerste lid genoemde einddatum, de tijdstippen
      bepaald waarop de respectievelijke in dat lid genoemde examens voor de laatste maal worden afgenomen.
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel76
  - number: '76.4'
    text: 'Met betrekking tot de in dit artikel genoemde examens en de afgifte van diploma’s zijn van toepassing:'
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel76
  - number: 76.4.a
    text: het Examenbesluit zeevaartdiploma’s 1991;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel76
  - number: 76.4.b
    text: |-
      het [Examenreglement zeevisvaart][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003996
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0003996
  - number: 76.4.c
    text: het Besluit zeevaartdiploma’s experimenterend hoger nautisch onderwijs;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel76
  - number: 76.4.d
    text: het Besluit bijzondere verkrijging diploma’s kleine handelsvaart;
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel76
  - number: 76.4.e
    text: |-
      het [Besluit bijzondere verkrijging voorlopig diploma als scheepswerktuigkundige][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0003611
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0003611
  - number: 76.4.f
    text: |-
      het [Besluit bijzondere verkrijging diploma A als scheepswerktuigkundige][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004216
    url: https://wetten.overheid.nl/BWBR0009124/2012-11-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0004216
  - number: '77'
    text: |-
      Bij algemene maatregel van bestuur worden de beroepsvereisten bepaald voor de functies, tot welke de in
      [artikel 76, eerste lid][ref1], genoemde diploma’s toegang verlenen.


