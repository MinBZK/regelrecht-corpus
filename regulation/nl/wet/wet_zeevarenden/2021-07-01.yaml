    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel1
  - number: 1.1.p
    text: |-
      bemanningsplan: een voorstel van de scheepsbeheerder, houdende het aantal bemanningsleden met hun functies aan
