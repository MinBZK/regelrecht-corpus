    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel1
  - number: 1.1.y
    text: |-
      Maritiem Arbeidsverdrag: het op 23 februari 2006 in Genève tot stand gekomen Maritiem Arbeidsverdrag, 2006
      (Trb. 2007, 93) en de bij dat verdrag behorende bindende protocollen en aanhangselen;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel1
  - number: 1.1.z
    text: 'zeevarende:'
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel1
  - number: 1.1.z.1°
    text: |-
      de natuurlijke persoon die in enige hoedanigheid werkzaamheden verricht aan boord van een schip, niet zijnde een
      vissersvaartuig; of
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel1
  - number: 1.1.z.2°
    text: een visser;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel1
  - number: 1.1.aa
    text: |-
      visser: een ieder die in enige hoedanigheid aan boord van een vissersvaartuig werkzaam is met uitzondering van
      loodsen, marinepersoneel, andere personen in dienst van een overheid, aan de wal gestationeerde personen, die aan
      boord werkzaamheden verrichten, en visserijwaarnemers;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel1
  - number: 1.1.ab
    text: |-
      certificaat maritieme arbeid: het certificaat, bedoeld in voorschrift 5.1.3, derde lid, van het Maritiem
      Arbeidsverdrag;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel1
  - number: 1.1.ac
    text: |-
      verklaring naleving maritieme arbeid: de verklaring, bedoeld in norm A 5.1.3, tiende lid, van het Maritiem
      Arbeidsverdrag, bestaande uit deel I en deel II;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel1
  - number: 1.1.ad
    text: |-
      internationale reis: een reis tussen twee verschillende landen of tussen havens in een ander land, waarbij een
      gebied voor welks buitenlandse betrekkingen een buiten dat gebied zetelende regering verantwoordelijk is of waarvan
      de Verenigde Naties het besturend lichaam zijn, mede als een afzonderlijk land wordt aangemerkt, en waarbij een
      transatlantische reis tussen delen van het Koninkrijk met een internationale reis gelijk wordt gesteld;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel1
  - number: 1.1.ae
    text: |-
      IMO-nummer: het scheepsidentificatienummer, bedoeld in voorschrift XI-1/3 van het op 1 november 1974 te Londen tot
      stand gekomen Verdrag voor de beveiliging van mensenlevens op zee (Trb. 1976, 157);
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel1
  - number: 1.1.af
    text: |-
      STCW-Verdrag: het op 7 juli 1978 te Londen tot stand gekomen Internationaal Verdrag betreffende de normen voor
      zeevarenden inzake opleiding, diplomering en wachtdienst, 1978 (Trb. 1981, 144) en de bij dat verdrag behorende
      bindende bijlagen;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel1
  - number: 1.1.ag
    text: |-
      STCW-Code: de Code inzake opleiding, diplomering en wachtdienst van zeevarenden, behorend bij het STCW-Verdrag
      (Trb. 1996, 249);
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel1
  - number: 1.1.ah
    text: |-
      SOLAS-verdrag: het op 1 november 1974 te Londen tot stand gekomen Verdrag voor de beveiliging van mensenlevens op
      zee (Trb. 1976, 157) en de bij dat verdrag behorende bindende protocollen, aanhangsels en bijlagen;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel1
  - number: 1.1.ai
    text: |-
      beveiligingstaak: elke functie of werkzaamheid met betrekking tot de beveiliging aan boord van een schip, zoals
      omschreven in hoofdstuk XI-2 van het SOLAS-verdrag en in de bij resolutie 2 van de Conferentie van verdragsluitende
      regeringen die partij zijn bij het SOLAS-verdrag op 12 december 2002 aangenomen Internationale Code voor de
      beveiliging van schepen en havenfaciliteiten (*International Ship and Port Facility Security Code*);
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel1
  - number: 1.1.aj
    text: |-
      ervaring: de diensttijd in maanden, in een bepaalde functie aan boord van in de vaart zijnde zeeschepen, gerekend
      met ingang van de dag van aanmonstering tot en met de dag van afmonstering;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel1
  - number: 1.1.ak
    text: |-
      GT: de maateenheid brutotonnage waarin de totale inhoud van een schip, vastgesteld overeenkomstig het op 23 juni
      1969 te Londen tot stand gekomen Verdrag betreffende de meting van schepen (Trb. 1970, 122), wordt uitgedrukt;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel1
  - number: 1.1.al
    text: 'schipper: de kapitein van een vissersvaartuig;'
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel1
  - number: 1.1.am
    text: |-
      Caribisch-Nederlands schip: een schip dat op grond van de [Vaartuigenwet 1930 BES][ref1] is geregistreerd in de
      openbare lichamen Bonaire, Sint Eustatius of Saba;


      [ref1]: https://wetten.overheid.nl/BWBR0028292
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028292
  - number: 1.1.an
    text: |-
      Verdrag betreffende werk in de visserijsector: het op 14 juni 2007 te Genève tot stand gekomen Verdrag betreffende
      werk in de visserijsector (Trb. 2011, 152);
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel1
  - number: 1.1.ao
    text: |-
      visserij-arbeidscertificaat: document als bedoeld in artikel 41 van het Verdrag betreffende werk in de
      visserijsector.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel1
  - number: '1.2'
    text: |-
      Bij regeling van Onze Minister kunnen, na overleg met de betrokken organisaties van scheepsbeheerders en
      zeevarenden, categorieën van personen worden aangewezen die in afwijking van het eerste lid, onderdeel z, niet
      worden aangemerkt als zeevarenden.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel1
  - number: '2.1'
    text: |-
      Het bepaalde bij of krachtens deze wet is van toepassing ten aanzien van Nederlandse schepen, voor zover ten
      aanzien van vissersvaartuigen niet anders is bepaald, en, in de bij of krachtens deze wet aangewezen gevallen, op
      Caribisch-Nederlandse schepen.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel2
  - number: '2.2'
    text: 'Deze wet is niet van toepassing ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel2
  - number: 2.2.a
    text: |-
      schepen die uitsluitend varen op Nederlandse binnenwateren of wateren binnen, of dicht grenzend aan beschutte
      wateren of gebieden waar Nederlandse havenvoorschriften gelden;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel2
  - number: 2.2.b
    text: onbemande schepen die niet van middelen tot werktuiglijke voortstuwing zijn voorzien;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel2
  - number: 2.2.c
    text: oorlogsschepen en marinehulpschepen;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel2
  - number: 2.2.d
    text: reddingsvaartuigen; en
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel2
  - number: 2.2.e
    text: pleziervaartuigen.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel2
  - number: '2.3'
    text: |-
      Het bepaalde bij of krachtens [hoofdstuk 4B][ref1], en [hoofdstuk 7, paragrafen 8][ref2] en [9][ref3], is niet van
      toepassing op niet commercieel gebruikte schepen.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Hoofdstuk4B
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Hoofdstuk7
      [ref3]: https://wetten.overheid.nl/BWBR0009124#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009124
        hoofdstuk: 4B
      - id: ref2
        bwb_id: BWBR0009124
        hoofdstuk: '7'
        paragraaf: '8'
      - id: ref3
        bwb_id: BWBR0009124
        hoofdstuk: '7'
        paragraaf: '9'
  - number: '2.4'
    text: |-
      Voor de toepassing van het derde lid kunnen bij ministeriële regeling nadere regels worden gesteld en kan
      nader worden bepaald welke categorieën van schepen in ieder geval vallen onder de in het derde lid bedoelde
      uitzonderingen.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel2
  - number: '2.5'
    text: |-
      Bij regeling van Onze Minister kunnen na overleg met de betrokken organisaties van scheepsbeheerders en zeevarenden
      categorieën van schepen worden aangewezen waarop het bepaalde bij of krachtens deze wet geheel of gedeeltelijk niet
      van toepassing is.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel2
  - number: '2.6'
    text: |-
      Voor de toepassing van het vijfde lid kunnen bij ministeriële regeling voor niet commercieel gebruikte
      overheidsschepen nadere regels worden gesteld. Daarbij kan onderscheid worden gemaakt tussen verschillende
      categorieën schepen.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel2
  - number: '2.7'
    text: |-
      Bij regeling van Onze Minister kan na overleg met de betrokken organisaties van scheepsbeheerders en zeevarenden,
      voor categorieën schepen van minder dan 200 GT die geen internationale reizen maken, worden bepaald dat van het
      bepaalde bij of krachtens deze wet onder daarbij te stellen regels vrijstelling wordt verleend.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel2
  - number: '3.1'
    text: De zorg voor het bemannen van een schip met inachtneming van deze wet berust bij de scheepsbeheerder.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel3
  - number: '3.2'
    text: |-
      De scheepsbeheerder verschaft de kapitein de middelen die hem in staat stellen om aan zijn verplichtingen ingevolge
      deze wet te voldoen.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel3
  - number: '3.3'
    text: |-
      De scheepsbeheerder houdt, ten behoeve van de met het toezicht op de naleving van deze wet belaste autoriteiten,
      per schip van elk daarop dienstdoend bemanningslid een overzicht bij van ten minste het volgende:
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel3
  - number: 3.3.a
    text: de opleiding;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel3
  - number: 3.3.b
    text: de ervaring;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel3
  - number: 3.3.c
    text: de vakbekwaamheid;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel3
  - number: 3.3.d
    text: de medische geschiktheid.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel3
  - number: '3.4'
    text: |-
      Ter uitvoering van de in het derde lid bedoelde verplichting worden persoonsgegevens over gezondheid als bedoeld in
      artikel 4, onderdeel 15, van de Algemene verordening gegevensbescherming verwerkt. De verwerking van deze gegevens
      vindt plaats teneinde te kunnen beoordelen of de bemanning van de door de scheepsbeheerder beheerde schepen
      voldoet aan de wettelijke vereisten betreffende de lichamelijke en geestelijke geschiktheid. De scheepsbeheerder is
      verwerkingsverantwoordelijke voor deze verwerking.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel3
  - number: '4.1'
    text: |-
      De scheepsbeheerder bemant een schip zodanig dat redelijkerwijs alle werkzaamheden aan boord, met inachtneming
      van de geldende arbeids- en rusttijden, en gelet op de bedrijfsvoering, de beperking van oververmoeidheid van
      zeevarenden, de risico’s op zee en van de lading, zonder gevaar voor de opvarenden, het schip, de lading, het
      milieu of het scheepvaartverkeer kunnen worden verricht.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel4
  - number: '4.2'
    text: |-
      De scheepsbeheerder zorgt ervoor dat de bemanningsleden bij hun tewerkstelling aan boord vertrouwd zijn met hun
      specifieke taken en met alle regelingen, procedures aan boord en de kenmerken van het schip, die verband houden met
      hun taken zowel onder normale omstandigheden als in noodsituaties.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel4
  - number: '4.3'
    text: |-
      De scheepsbeheerder zorgt ervoor dat de zeevarenden voorafgaand aan hun tewerkstelling aan boord de bij of
      krachtens algemene maatregel van bestuur vereiste bijscholings- en herhalingstrainingen hebben gevolgd.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel4
  - number: '4.4'
    text: |-
      De kapitein en de scheepsofficieren gedragen zich aan boord ten opzichte van de opvarenden, het schip, de lading,
      het milieu en het scheepvaartverkeer zoals het een goed zeeman betaamt.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel4
  - number: '4.5'
    text: |-
      De kapitein zorgt ervoor dat de bemanning van het schip te allen tijde berekend is voor het verrichten van de
      werkzaamheden aan boord.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel4
  - number: '4.6'
    text: |-
      De kapitein zorgt ervoor dat het wachtpersoneel de beginselen van een veilige wacht in acht neemt in
      overeenstemming met voorschrift VIII/2 van de bijlage bij het STCW-Verdrag dan wel, voor vissersvaartuigen, de
      voorschriften die voor het wacht houden op vissersvaartuigen zijn gesteld op grond van [artikel 64][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel64
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '64'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: '4.7'
    text: |-
      De kapitein organiseert de werkzaamheden en de wachtindeling zodanig dat het wachtpersoneel voldoende uitgerust en
      anderszins geschikt is om dienst te doen bij aanvang van de wacht.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel4
  - number: '4.8'
    text: |-
      De kapitein verlaat het schip niet gedurende de vaart of bij dreigend gevaar, tenzij zijn afwezigheid volstrekt
      noodzakelijk is of de zorg voor lijfsbehoud hem daartoe dwingt.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel4
  - number: '4.9'
    text: De bemanning verlaat het schip niet zonder toestemming van de kapitein.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel4
  - number: '4.10'
    text: |-
      Toestemming van de kapitein is niet nodig voor het in een aanloophaven verlaten van het schip voor het, wanneer dit
      mogelijk is, onverwijld raadplegen van een arts of tandarts.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel4
  - number: '5.1'
    text: Een schip is voorzien van een geldig bemanningscertificaat, afgegeven door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel5
  - number: '5.2'
    text: Een schip is ten minste bemand overeenkomstig het bemanningscertificaat.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel5
  - number: '6.1'
    text: |-
      Op het bemanningscertificaat worden de kenmerken van het schip en, zo nodig, de bijzonderheden ten aanzien van het
      gebruik van het schip in relatie tot de bemanning vermeld.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel6
  - number: '6.2'
    text: Een bemanningscertificaat wordt voor een bepaalde periode van ten hoogste vijf jaren afgegeven.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel6
  - number: '6.3'
    text: |-
      De kapitein draagt er zorg voor dat een kopie van het geldige bemanningscertificaat op een duidelijk zichtbare
      plaats aan boord van het schip wordt opgehangen.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel6
  - number: '7.1'
    text: |-
      De scheepsbeheerder dient een aanvraag voor een bemanningscertificaat in bij Onze Minister en voegt daarbij een
      bemanningsplan voor het betrokken schip of de betrokken schepen.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel7
  - number: '7.2'
    text: De scheepsbeheerder kan voor een schip meer dan een bemanningssamenstelling voorstellen.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel7
  - number: '7.3'
    text: Bij ministeriële regeling wordt bepaald welke gegevens ten minste in het bemanningsplan worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel7
  - number: '8.1'
    text: Onze Minister neemt een besluit over elk van de ingediende bemanningssamenstellingen.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel8
  - number: '8.2'
    text: |-
      Onze Minister besluit tot afgifte van een bemanningscertificaat voor het betrokken schip of de betrokken schepen,
      indien naar zijn oordeel met de voorgestelde bemanningssamenstelling
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel8
  - number: 8.2.a
    text: de veiligheid van het schip en de veilige en milieuverantwoorde vaart zijn gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel8
  - number: 8.2.b
    text: |-
      de voor de bemanning geldende normen voor arbeids- en rusttijden niet worden overschreden en er rekening is
      gehouden met de beperking van oververmoeidheid van zeevarenden;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel8
  - number: 8.2.c
    text: |-
      ook overigens aan de vereisten, bedoeld in [artikel 4, eerste lid][ref1], kan worden voldaan; en


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel4
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 8.2.d
    text: |-
      wordt voldaan aan het bij of krachtens de [artikelen 48a, vierde lid][ref1], en [64][ref2] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel48a
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel64
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: 48a
        hoofdstuk: 4A
      - id: ref2
        bwb_id: BWBR0009124
        artikel: '64'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: '8.3'
    text: De scheepsbeheerder verstrekt desgevraagd nadere inlichtingen over het bemanningsplan.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel8
  - number: '8.4'
    text: Onze Minister kan de kapitein raadplegen alvorens te besluiten omtrent de afgifte van een bemanningscertificaat.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel8
  - number: '8.5'
    text: |-
      Onze Minister stelt ambtshalve de bemanningssamenstelling van het betrokken schip of de betrokken schepen
      vast en geeft dienovereenkomstig een bemanningscertificaat af, indien hij van oordeel is, dat met de
      bemanningssamenstelling die door de scheepsbeheerder wordt voorgesteld niet of niet geheel kan worden voldaan aan
      het tweede lid, onderdelen a tot en met d.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel8
  - number: '8.6'
    text: |-
      De scheepsbeheerder verschaft de kapitein een afschrift van het bemanningsplan, dat is voorzien van de
      eventuele aanvullende gegevens die zijn verstrekt op grond van het derde lid, en dat behoort bij het geldige
      bemanningscertificaat.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel8
  - number: '9'
    text: |-
      Indien voor een schip meer dan een bemanningssamenstelling geldt, worden alle bemanningssamenstellingen duidelijk
      onderscheiden in het bemanningscertificaat opgenomen.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel9
  - number: '10'
    text: 'De kapitein tekent in het scheepsdagboek aan:'
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel10
  - number: 10.a
    text: |-
      volgens welke bemanningssamenstelling het schip is bemand, indien in het bemanningscertificaat meer dan een
      samenstelling is opgenomen; en
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel10
  - number: 10.b
    text: de feiten of omstandigheden die niet in overeenstemming zijn met de gegevens van het bemanningsplan.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel10
  - number: '11.1'
    text: |-
      De scheepsbeheerder meldt aan Onze Minister alle wijzigingen van de gegevens van het bemanningsplan die hij
      voornemens is door te voeren.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel11
  - number: '11.2'
    text: |-
      Op grond van de nieuwe gegevens beslist Onze Minister of de bemanningssamenstelling overeenkomstig het geldige
      bemanningscertificaat kan worden gehandhaafd. Zo nodig geeft hij een nieuw bemanningscertificaat af.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel11
  - number: '12.1'
    text: |-
      Indien de omstandigheden daartoe aanleiding geven bij de toepassing van [artikel 4, vijfde lid][ref1], verzoekt
      de kapitein de scheepsbeheerder gemotiveerd hem voor een bepaald tijdstip de benodigde aanvullende middelen te
      verschaffen. Een mondeling verzoek wordt zo spoedig mogelijk schriftelijk bevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel4
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '12.2'
    text: |-
      Indien de scheepsbeheerder niet tijdig of geen gevolg geeft aan het verzoek, bedoeld in het eerste lid, stelt de
      kapitein Onze Minister daarvan schriftelijk in kennis.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel12
  - number: '13'
    text: Onze Minister trekt het bemanningscertificaat in, indien is gebleken dat
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel13
  - number: 13.a
    text: |-
      het bemanningsplan onjuiste of onvolledige gegevens bevat, zodanig dat op grond van de juiste of volledige gegevens
      dit bemanningscertificaat niet zou zijn afgegeven, dan wel
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel13
  - number: 13.b
    text: |-
      het schip in strijd met de gegevens in het bemanningscertificaat wordt gebruikt en dit afwijkende gebruik naar zijn
      redelijk oordeel een andere bemanningssamenstelling noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel13
  - number: '14.1'
    text: |-
      Onverminderd [artikel 8, vijfde lid][ref1], geeft Onze Minister ambtshalve een nieuw bemanningscertificaat af voor
      een andere bemanningssamenstelling dan waarmee het betrokken schip of de betrokken schepen op grond van het laatst
      afgegeven bemanningscertificaat is of zijn bemand, indien hem is gebleken dat het voldoen aan de eisen, gesteld in
      artikel 8, tweede lid, met dat certificaat niet langer gewaarborgd is.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel8
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '14.2'
    text: |-
      In het geval, bedoeld in het eerste lid, nodigt Onze Minister de scheepsbeheerder uit een nieuw bemanningsplan in
      te dienen.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel14
  - number: '15.1'
    text: |-
      Nadat een nieuw bemanningscertificaat voor een schip is afgegeven wordt het oude bemanningscertificaat zo spoedig
      mogelijk aan Onze Minister gezonden.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel15
  - number: '15.2'
    text: De scheepsbeheerder draagt er zorg voor dat aan het eerste lid wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel15
  - number: '16'
    text: |-
      Onze Minister kan, met inachtneming van bij algemene maatregel van bestuur te stellen regels, voor een bepaald
      schip en voor een periode van ten hoogste zes maanden, ontheffing verlenen van de in [artikel 5, tweede lid][ref1],
      bedoelde verplichting om het schip overeenkomstig het bemanningscertificaat te bemannen.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel5
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 16a.1
    text: |-
      Onze Minister kan voor een bijzonder schip ontheffing verlenen van de in [artikel 7, eerste lid][ref1], bedoelde
      verplichting om een bemanningsplan te voegen bij de aanvraag van een bemanningscertificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel7
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 16a.2
    text: |-
      In de ontheffing kunnen voor de bemanning andere, ten minste gelijkwaardige, beroepsvereisten worden
      vastgesteld dan de beroepsvereisten, bedoeld in de [artikelen 19, eerste lid, onderdeel a, onder 1°][ref1], en
      [19a, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel19a
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: 19a
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 16a.3
    text: |-
      Uiterlijk twaalf maanden na het tijdstip waarop de ontheffing van kracht is geworden, evalueert Onze Minister de in
      het bemanningscertificaat voor het betrokken schip genoemde bemanningssamenstelling in relatie tot het gebruik dat
      van het schip wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel16a
  - number: 16a.4
    text: |-
      Op grond van de bevindingen uit de evaluatie beslist Onze Minister of de bemanningssamenstelling overeenkomstig het
      geldige bemanningscertificaat kan worden gehandhaafd. Zo nodig geeft hij een nieuw bemanningscertificaat af.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel16a
  - number: 16a.5
    text: De scheepsbeheerder verstrekt Onze Minister desgevraagd de door deze gewenste informatie.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel16a
  - number: '17.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven met betrekking tot de
      samenstelling van de bemanning voor verschillende categorieën vissersvaartuigen.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel17
  - number: '17.2'
    text: De scheepsbeheerder dient per vissersvaartuig een aanvraag in voor een bemanningscertificaat bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel17
  - number: '17.3'
    text: Bij ministeriële regeling wordt bepaald welke gegevens bij de aanvraag worden ingediend.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel17
  - number: 17a
    text: |-
      Deze paragraaf is niet van toepassing op vissersvaartuigen, met uitzondering van de [artikelen 5][ref1],
      [6][ref2], [13, aanhef en onderdeel b][ref3], [15][ref4], [16][ref5] en [17][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0009124#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0009124#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0009124#Artikel16
      [ref6]: https://wetten.overheid.nl/BWBR0009124#Artikel17
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009124
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0009124
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0009124
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0009124
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '18.1'
    text: |-
      Een ieder die aan boord van een schip een functie vervult als bedoeld in het tweede lid waarvoor krachtens deze wet
      eisen zijn gesteld, is in het bezit van een geldig vaarbevoegdheidsbewijs voor die functie.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel18
  - number: '18.2'
    text: |-
      De vaarbevoegdheden die op de vaarbevoegdheidsbewijzen kunnen worden aangetekend hebben betrekking op de volgende
      functies:
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel18
  - number: 18.2.a
    text: |-
      kapitein alle schepen kapitein schepen van minder dan 3000 GT kapitein schepen van minder dan 500 GT eerste
      stuurman alle schepen eerste stuurman schepen van minder dan 3000 GT eerste stuurman schepen van minder dan 500 GT
      wachtstuurman alle schepen
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel18
  - number: 18.2.b
    text: |-
      hoofdwerktuigkundige alle schepen hoofdwerktuigkundige schepen met minder dan 3000 kW voortstuwingsvermogen
      tweede werktuigkundige alle schepen tweede werktuigkundige schepen met minder dan 3000 kW voortstuwingsvermogen
      wachtwerktuigkundige alle schepen
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel18
  - number: 18.2.c
    text: |-
      eerste maritiem officier alle schepen eerste maritiem officier schepen van minder dan 3000 GT en minder dan 3000 kW
      voortstuwingsvermogen maritiem officier alle schepen maritiem officier schepen van minder dan 3000 GT en minder dan
      3000 kW voortstuwingsvermogen
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel18
  - number: 18.2.d
    text: officier elektrotechniek alle schepen
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel18
  - number: 18.2.e
    text: |-
      gekwalificeerd gezel dek alle schepen gekwalificeerd gezel machinekamer alle schepen gekwalificeerd gezel dek
      en machinekamer alle schepen wachtlopend gezel dek alle schepen wachtlopend gezel machinekamer alle schepen
      wachtlopend gezel dek en machinekamer alle schepen
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel18
  - number: 18.2.f
    text: gezel elektrotechniek alle schepen
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel18
  - number: 18.2.g
    text: kapitein zeilvaart eerste stuurman zeilvaart wachtstuurman zeilvaart
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel18
  - number: 18.2.h
    text: gezel zeilvaart
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel18
  - number: 18.2.i
    text: |-
      schipper zeevisvaart plaatsvervangend schipper zeevisvaart stuurman zeevisvaart stuurman-werktuigkundige
      zeevisvaart hoofdwerktuigkundige zeevisvaart tweede werktuigkundige zeevisvaart wachtwerktuigkundige zeevisvaart
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel18
  - number: 18.2.j
    text: gezel zeevisvaart
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel18
  - number: 18.2.k
    text: radio-operator
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel18
  - number: '18.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald welke beperkingen of aanvullingen mogen worden
      aangebracht op een vaarbevoegdheidsbewijs in verband met de aard van de lading, het soort schip, de GT, het
      voortstuwingsvermogen, het type voortstuwing, de scheepslengte of het vaargebied.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel18
  - number: '18.4'
    text: |-
      In afwijking van het eerste lid kan een bemanningslid dat erkenning van zijn vaarbevoegdheidsbewijs als bedoeld
      in de [artikelen 22, eerste lid][ref1], of [22a, eerste lid][ref2], heeft aangevraagd, voor een periode van ten
      hoogste 3 maanden volstaan met een door Onze Minister op aanvraag afgegeven bewijs van aanvraag om erkenning
      van een vaarbevoegdheidsbewijs, tezamen met het te erkennen vaarbevoegdheidsbewijs. Het bepaalde in de vorige
      volzin is niet van toepassing in bij ministeriële regeling aangewezen gevallen. Bij ministeriële regeling worden
      de voorwaarden vastgesteld waaronder een bewijs van aanvraag om erkenning van een vaarbevoegdheidsbewijs wordt
      afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel22a
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: 22a
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '19.1'
    text: 'Bij of krachtens algemene maatregel van bestuur worden:'
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel19
  - number: 19.1.a
    text: |-
      voor de verkrijging van de vaarbevoegdheden, genoemd in [artikel 18, tweede lid][ref1], vastgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel18
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 19.1.a.1°
    text: de beroepsvereisten;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel19
  - number: 19.1.a.2°
    text: de opgedane ervaring;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel19
  - number: 19.1.a.3°
    text: de eisen van medische geschiktheid, en
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel19
  - number: 19.1.a.4°
    text: de wijze waarop wordt beoordeeld of wordt voldaan aan de onder ten 1° en ten 2° bedoelde eisen;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel19
  - number: 19.1.b
    text: |-
      de geldigheidsduur van het vaarbevoegdheidsbewijs, alsmede de wijze van eerste afgifte, vervanging of vernieuwing
      van het vaarbevoegdheidsbewijs geregeld.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel19
  - number: '19.2'
    text: |-
      Aan de voor de afgifte van een vaarbevoegdheidsbewijs benodigde beroepsvereisten kan worden voldaan
      door het met goed gevolg hebben afgelegd van het afsluitend examen van een aan een op grond van de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] bekostigde hogeschool of rechtspersoon hoger
      onderwijs verbonden opleiding voor een nautisch beroep dan wel het met goed gevolg hebben afgelegd van het
      examen van een nautische beroepsopleiding waarvoor op grond van de [Wet educatie en beroepsonderwijs][ref2] een
      kwalificatiedossier is, of eindtermen zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005682
      - id: ref2
        bwb_id: BWBR0007625
  - number: 19a.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden aanvullende beroepsvereisten vastgesteld, anders dan die
      bedoeld in [artikel 19, eerste lid, onderdeel a, onder 1°][ref1], voor de uitoefening van specifieke functies of
      werkzaamheden aan boord. Hieronder worden voor functies op schepen, waarop het STCW-Verdrag van toepassing is, in
      ieder geval begrepen de trainingen, genoemd in de hoofdstukken V en VI van de bijlage bij dat verdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel19
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 19a.2
    text: |-
      Zeevarenden volgen voorafgaand aan hun tewerkstelling aan boord van een schip de bij of krachtens algemene
      maatregel van bestuur vereiste bijscholings- of herhalingstrainingen.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel19a
  - number: 19a.3
    text: De in het eerste en tweede lid bedoelde opleidingen kunnen op aanvraag door Onze Minister worden erkend.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel19a
  - number: 19a.4
    text: 'Bij ministeriële regeling worden regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel19a
  - number: 19a.4.a
    text: de aanvraag voor de erkenning;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel19a
  - number: 19a.4.b
    text: de intrekking van de erkenning.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel19a
  - number: 19a.5
    text: Onze Minister stelt de criteria vast op grond waarvan een aanvraag voor een erkenning wordt beoordeeld.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel19a
  - number: '20.1'
    text: |-
      Onze Minister besluit tot afgifte van een vaarbevoegdheidsbewijs wanneer de aanvrager voldoet aan de eisen, bedoeld
      in [artikel 19, eerste lid, aanhef en onderdeel a, ten 1°, ten 2° en ten 3°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel19
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '20.2'
    text: |-
      Onze Minister besluit tot afgifte van een bekwaamheidsbewijs aan een kapitein of een officier voor het dienstdoen
      op tankers wanneer de aanvrager voldoet aan de eisen, bedoeld in [artikel 19a, eerste lid][ref1], met betrekking
      tot een voortgezette opleiding voor het behandelen van lading van tankers.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel19a
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: 19a
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '20.3'
    text: |-
      Bij ministeriële regeling wordt bepaald welke bescheiden worden overgelegd bij de aanvraag van een
      vaarbevoegdheidsbewijs of een bekwaamheidsbewijs voor het dienstdoen op tankers door een kapitein of een officier.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel20
  - number: '20.4'
    text: |-
      Onze Minister vergewist zich ervan dat een persoon de Nederlandse nationaliteit bezit, dan wel de nationaliteit
      van een van de staten, bedoeld in [artikel 30][ref1], alvorens aan deze een van de vaarbevoegdheden als kapitein,
      onderscheidenlijk schipper, af te geven die zijn genoemd in [artikel 18, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel18
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '30'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '20.5'
    text: |-
      Onze Minister vergewist zich van de authenticiteit en de geldigheid van de door de aanvrager overgelegde documenten
      alvorens hij overgaat tot afgifte van een vaarbevoegdheidsbewijs of een bekwaamheidsbewijs voor het dienstdoen op
      tankers door een kapitein of een officier.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel20
  - number: '20.6'
    text: |-
      Ter uitvoering van het vijfde lid is Onze Minister bevoegd tot het ontvangen van een opleidingsinstituut als
      bedoeld in [artikel 19a, derde lid][ref1], van de volgende gegevens met betrekking tot de aanvraag van een
      vaarbevoegdheidsbewijs of een bekwaamheidsbewijs voor het dienstdoen op tankers:


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel19a
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: 19a
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 20.6.a
    text: de naam van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel20
  - number: 20.6.b
    text: de geboortedatum van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel20
  - number: 20.6.c
    text: het burgerservicenummer van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel20
  - number: 20.6.d
    text: de datum van afgifte van het overgelegde bekwaamheidsbewijs; en
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel20
  - number: 20.6.e
    text: de naam van het opleidingsinstituut dat het bekwaamheidsbewijs heeft afgegeven.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel20
  - number: '21'
    text: |-
      Bij ministeriële regeling kan worden bepaald voor welke bij internationale regeling aangewezen bijzondere
      functies of werkzaamheden het bezit van een certificaat of enig ander document voorgeschreven is, alsmede welke
      beroepsvereisten daarvoor gelden.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel21
  - number: 21a
    text: |-
      Bij ministeriële regeling kan worden bepaald voor welke functies of werkzaamheden aan boord van Caribisch-
      Nederlandse schepen het bezit van een certificaat of enig ander document voorgeschreven is, alsmede welke
      beroepsvereisten daarvoor gelden.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel21a
  - number: '22.1'
    text: |-
      Bij algemene maatregel van bestuur worden de criteria vastgesteld met inachtneming waarvan Onze Minister
      vaarbevoegdheidsbewijzen of bekwaamheidsbewijzen erkent die zijn afgegeven door een bevoegde autoriteit van
      een staat, niet zijnde een lid-staat van de Europese Unie, een andere staat die partij is bij de overeenkomst
      betreffende de Europese Economische Ruimte of Zwitserland.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel22
  - number: '22.2'
    text: |-
      Aan de houder van een geldig vaarbevoegdheidsbewijs of bekwaamheidsbewijs dat ingevolge het
      eerste lid is erkend, wordt, indien hij ook overigens voldoet aan de eisen gesteld ingevolge
      [artikel 19, eerste lid, aanhef en onderdeel a, ten 2° en ten 3°][ref1], en hij dienst gaat doen op een
      Nederlands schip, een vaarbevoegdheidsbewijs afgegeven, waarop een officiële verklaring is opgenomen dat dit
      vaarbevoegdheidsbewijs is afgegeven op grond van een erkend vaarbevoegdheidsbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel19
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '22.3'
    text: |-
      Een erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref1] voor een beroep waarvoor de
      vaarbevoegdheden genoemd in [artikel 18, tweede lid, onderdelen i en j][ref2], geldig zijn, wordt met een erkend
      vaarbevoegdheidsbewijs of bekwaamheidsbewijs als bedoeld in het tweede lid gelijkgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel18
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '22.4'
    text: Bij ministeriële regeling worden regels gesteld met betrekking tot de afgifte van het vaarbevoegdheidsbewijs.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel22
  - number: '22.5'
    text: |-
      Bij ministeriële regeling wordt bepaald welke bescheiden worden overgelegd bij de aanvraag voor een
      vaarbevoegdheidsbewijs als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel22
  - number: '22.6'
    text: Het tweede lid is niet van toepassing op gezellen.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel22
  - number: 22a.1
    text: |-
      Onze Minister erkent een vaarbevoegdheidsbewijs of een bekwaamheidsbewijs dat is afgegeven door of onder de
      verantwoordelijkheid van de bevoegde autoriteit van een andere lidstaat van de Europese Unie, een andere staat die
      partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland. De vorige volzin is niet
      van toepassing op vaarbevoegdheidsbewijzen of bekwaamheidsbewijzen voor het dienstdoen op vissersvaartuigen.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel22a
  - number: 22a.2
    text: |-
      Aan de houder van een vaarbevoegdheidsbewijs of een bekwaamheidsbewijs als bedoeld in
      het eerste lid, wordt, indien hij ook overigens voldoet aan de eisen gesteld ingevolge
      [artikel 19, eerste lid, aanhef en onderdeel a, ten 1°, ten 2° en ten 3°][ref1], en hij dienst gaat doen op een
      Nederlands schip, een vaarbevoegdheidsbewijs afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel19
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 22a.3
    text: |-
      Een ingevolge het tweede lid afgegeven vaarbevoegdheidsbewijs is beperkt tot de in het oorspronkelijke bewijs
      omschreven functies, taken en verantwoordelijkheidsniveaus en bevat een officiële verklaring dat het bewijs is
      afgegeven op grond van een erkend vaarbevoegdheidsbewijs.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel22a
  - number: 22a.4
    text: |-
      Bij ministeriële regeling wordt bepaald welke bescheiden worden overgelegd bij de aanvraag van een
      vaarbevoegdheidsbewijs.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel22a
  - number: 22a.5
    text: Het tweede lid is niet van toepassing op gezellen.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel22a
  - number: 22b
    text: |-
      Bij een erkenning als bedoeld in [artikel 22, eerste lid][ref1], of [22a][ref2], eerste lid, van:


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel22a
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel22b
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: 22a
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 22b.a
    text: een vaarbevoegdheidsbewijs, of
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel22b
  - number: 22b.b
    text: een bekwaamheidsbewijs voor het dienstdoen op tankers door een kapitein of een officier,
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel22b
  - number: '23.1'
    text: |-
      Onze Minister onderzoekt schriftelijke verklaringen over of aanwijzingen van medische ongeschiktheid of
      onbekwaamheid tot het uitoefenen van een functie aan boord van houders van een vaarbevoegdheidsbewijs als bedoeld
      in [artikel 18][ref1], [22][ref2] of [22a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0009124#Artikel22a
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0009124
        artikel: 22a
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '23.2'
    text: |-
      Onze Minister stelt de houder van een vaarbevoegdheidsbewijs, te wiens aanzien een gegrond vermoeden van medische
      ongeschiktheid of onbekwaamheid tot het uitoefenen van zijn functie aan boord bestaat, daarvan in kennis. Hij is
      verplicht zich bij de eerste gelegenheid te onderwerpen aan een onderzoek met inachtneming van door Onze Minister
      te geven aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel23
  - number: '23.3'
    text: |-
      Bij gegrond vermoeden van medische ongeschiktheid wordt het onderzoek, bedoeld in het tweede lid, ingesteld
      door een door Onze Minister aangewezen geneeskundige of medisch specialist naar de algemene lichamelijke
      geschiktheid dan wel naar de geschiktheid van het gezichts- of gehoororgaan op de voet van het bepaalde krachtens
      [artikel 19, eerste lid, aanhef en onderdeel a, ten 3°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel19
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '23.4'
    text: |-
      Bij gegrond vermoeden van onbekwaamheid tot het uitoefenen van een functie aan boord wordt het onderzoek, bedoeld
      in het tweede lid, ingesteld door een door Onze Minister aangewezen deskundige op de voet van het bepaalde
      krachtens [artikel 19, eerste lid, aanhef en onderdeel a, ten 1°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel19
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '23.5'
    text: |-
      Indien bij een periodiek onderzoek of bij een in het tweede lid bedoeld onderzoek blijkt dat de houder van
      een vaarbevoegdheidsbewijs niet voldoet aan de krachtens deze wet gestelde eisen voor de algemene lichamelijke
      geschiktheid of aan de eisen voor de geschiktheid van het gezichts- of gehoororgaan, weigert de geneeskundige of
      medisch specialist een nieuwe geneeskundige verklaring van geschiktheid voor de zeevaart af te geven. Onze Minister
      kan de desbetreffende geneeskundige verklaring van geschiktheid voor de zeevaart ongeldig verklaren.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel23
  - number: '23.6'
    text: |-
      De [artikelen 42][ref1], [43][ref2] en [44][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0009124#Artikel44
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: '43'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009124
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '23.7'
    text: |-
      Indien de houder van een vaarbevoegdheidsbewijs niet aan de in het tweede lid bedoelde verplichting voldoet
      zonder dat van een geldige reden daartoe blijkt, kan Onze Minister zonder nader onderzoek het afgegeven
      vaarbevoegdheidsbewijs ongeldig verklaren.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel23
  - number: '24.1'
    text: |-
      Onze Minister trekt een vaarbevoegdheidsbewijs als bedoeld in [artikel 18][ref1], [22][ref2] of [22a][ref3] in,
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0009124#Artikel22a
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0009124
        artikel: 22a
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 24.1.a
    text: |-
      uit een onderzoek naar de bekwaamheid, bedoeld in [artikel 23, vierde lid][ref1], blijkt dat de houder niet meer
      voldoet aan de in [artikel 19, eerste lid, aanhef en onderdeel a, ten 1°][ref2], bedoelde beroepsvereisten;


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel19
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 24.1.b
    text: |-
      een van de voor de houder voorgeschreven geneeskundige verklaringen van geschiktheid voor de zeevaart ingevolge
      [artikel 23][ref1] ongeldig is verklaard, of indien de houder blijvend medisch ongeschikt voor de zeevaart is
      verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel23
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '24.2'
    text: |-
      Een vaarbevoegdheidsbewijs, een bekwaamheidsbewijs voor het dienstdoen op tankers door een kapitein
      of een officier, of een bewijs van aanvraag om erkenning van een vaarbevoegdheidsbewijs als bedoeld in
      [artikel 18, vierde lid][ref1], kan door Onze Minister voorts worden ingetrokken indien is gebleken dat bij de
      aanvraag ervan onjuiste gegevens zijn opgegeven dan wel dat valse of vervalste documenten zijn overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel18
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '24.3'
    text: |-
      Onze Minister kan, ter voorkoming van een noodsituatie of gevaar voor het scheepvaartverkeer, de houder van een
      vaarbevoegdheidsbewijs voor ten hoogste 24 uur een verbod opleggen aan boord van een schip een functie uit te
      oefenen of werkzaamheden te verrichten.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel24
  - number: '24.4'
    text: |-
      Onze Minister trekt een vaarbevoegdheidsbewijs als bedoeld in [artikel 22][ref1] of [22a][ref2] in, indien
      de geldigheid van het buitenlandse vaarbevoegdheidsbewijs of bekwaamheidsbewijs op grond waarvan dat
      vaarbevoegdheidsbewijs is afgegeven, door of vanwege de bevoegde buitenlandse autoriteit is geschorst of
      ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel22a
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: 22a
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '24.5'
    text: |-
      Onze Minister stelt de bevoegde buitenlandse autoriteit in kennis van de toepassing van het eerste en tweede lid
      van dit artikel ten aanzien van een vaarbevoegdheidsbewijs als bedoeld in [artikel 22][ref1] of [22a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel22a
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: 22a
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '25.1'
    text: |-
      Onze Minister kan ten aanzien van een bemanningslid, met inachtneming van bij algemene maatregel van bestuur
      te stellen regels, voor een bepaald schip, en voor een periode van ten hoogste zes maanden, ontheffing
      verlenen van de in [artikel 18, eerste lid][ref1], bedoelde verplichting om in het bezit te zijn van een geldig
      vaarbevoegdheidsbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel18
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '25.2'
    text: |-
      Onze Minister kan aan de houder van een vaarbevoegdheid, geldig op schepen van minder dan 3000 GT of met een
      voortstuwingsvermogen van minder dan 3000 kW, ontheffing geven van de in [artikel 18, eerste lid][ref1], bedoelde
      verplichting om in het bezit te zijn van een geldig vaarbevoegdheidsbewijs, voorzover die bevoegdheid wordt
      gebruikt aan boord van een schip, dat als gevolg van een verbouwing niet meer als een schip van minder dan 3000
      GT of met een voortstuwingsvermogen van minder dan 3000 kW is aan te merken, indien wordt voldaan aan de volgende
      voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel18
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 25.2.a
    text: |-
      de ontheffing geldt voor de duur van de opleiding van de houder ten behoeve van een bevoegdheid geldig op alle
      schepen, met een maximum van twee jaren, en
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel25
  - number: 25.2.b
    text: |-
      de houder heeft in de vijf jaren, voorafgaand aan de aanvraag, twee jaren aan boord van dit schip, of aan boord van
      een naar het oordeel van Onze Minister identiek schip, dienst gedaan.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel25
  - number: 25a.1
    text: |-
      Ter uitvoering van de [artikelen 20 tot en met 24][ref1] worden persoonsgegevens over gezondheid als bedoeld in
      artikel 4, onderdeel 15, van de Algemene verordening gegevensbescherming verwerkt. De verwerking van deze gegevens
      vindt plaats teneinde te kunnen beoordelen of degene die aan boord van een schip werkzaamheden verricht waarvoor
      het bezit van een vaarbevoegdheidsbewijs is vereist, voldoet of niet meer voldoet aan de wettelijke vereisten
      betreffende de medische geschiktheid in verband met de afgifte of het behoud van een vaarbevoegdheidsbewijs. Onze
      Minister is verwerkingsverantwoordelijke voor deze verwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel20
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 25a.2
    text: |-
      Ter uitvoering van [artikel 25][ref1] worden persoonsgegevens over gezondheid als bedoeld in artikel 4, onderdeel
      15, van de Algemene verordening gegevensbescherming verwerkt. De verwerking van deze gegevens vindt plaats teneinde
      te kunnen beoordelen of aan een bemanningslid, onderscheidenlijk aan de houder van een vaarbevoegdheid, ontheffing
      kan worden verleend van de verplichting in het bezit te zijn van een geldig vaarbevoegdheidsbewijs. Onze Minister
      is verwerkingsverantwoordelijke voor deze verwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel25
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '25'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 25b.1
    text: |-
      Zeevarenden, niet zijnde zeevarenden die een functie als bedoeld in [artikel 18, tweede lid][ref1], uitoefenen,
      voldoen aan de bij of krachtens algemene maatregel van bestuur gestelde opleidingseisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel18
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 25b.2
    text: Het eerste lid is niet van toepassing op vissers.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel25b
  - number: '27.1'
    text: |-
      De kapitein is belast met de handhaving van de openbare orde aan boord en oefent aan boord over alle opvarenden
      disciplinair gezag uit. Hij kan tot handhaving van dit gezag de maatregelen nemen die redelijkerwijs nodig zijn.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel27
  - number: '27.2'
    text: |-
      De kapitein belast een bemanningslid niet met werkzaamheden aan boord, waarvoor een vaarbevoegdheid of
      beroepskwalificatie vereist is, indien dat bemanningslid niet blijkens zijn geldige vaarbevoegdheidsbewijs of,
      indien dat is toegestaan, blijkens een document als bedoeld in [artikel 21][ref1] bevoegd is die werkzaamheden aan
      boord te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel21
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '27.3'
    text: |-
      De kapitein vermeldt een weigering van toestemming aan een bemanningslid als bedoeld in
      [artikel 4, negende lid][ref1], en de reden daarvoor in het scheepsdagboek en verstrekt desgevraagd aan het
      bemanningslid binnen twaalf uur een schriftelijke bevestiging daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel4
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '27.4'
    text: |-
      De opvarenden zijn verplicht de bevelen van de kapitein op te volgen en de toepasselijke maatregelen inzake de
      veiligheid of de gezondheid in acht te nemen.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel27
  - number: '27.5'
    text: |-
      Een schriftelijke bevestiging als bedoeld in het derde lid, behoeft niet te worden verstrekt aan een bemanningslid
      van een vissersvaartuig.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel27
  - number: '28'
    text: |-
      De kapitein oefent zijn gezag uit zodra hij aan boord is en het gezag heeft aanvaard of overgenomen, en zolang hij
      het gezag niet heeft overgedragen of de scheepsbeheerder hem het gezag niet heeft ontnomen.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel28
  - number: '29.1'
    text: 'Op Nederlandse schepen worden alleen personen als kapitein aangesteld die de nationaliteit bezitten van:'
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel29
  - number: 29.1.a
    text: het Koninkrijk der Nederlanden, dan wel
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel29
  - number: 29.1.b
    text: |-
      van een andere staat, doch uitsluitend indien zij ingevolge [artikel 30][ref1] zijn vrijgesteld van de in de aanhef
      en onderdeel a genoemde eis.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel30
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '30'
        hoofdstuk: '3'
  - number: '29.2'
    text: |-
      Bij ministeriële regeling kan, onder het stellen van voorwaarden of beperkingen, ten behoeve van vissersvaartuigen
      vrijstelling worden verleend van het in het eerste lid bedoelde vereiste.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel29
  - number: '30.1'
    text: |-
      Personen die de nationaliteit bezitten van een van de lidstaten van de Europese Unie of van een van de overige
      staten die partij zijn bij de Overeenkomst inzake de Europese Economische Ruimte, zijn vrijgesteld van de
      nationaliteitseis, bedoeld in [artikel 29, eerste lid, aanhef en onder a][ref1], voor het dienstdoen op Nederlandse
      schepen die geen vissersvaartuig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel29
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '29'
        hoofdstuk: '3'
  - number: '30.2'
    text: |-
      Aan personen die de nationaliteit bezitten van een andere staat kan bij regeling van Onze Minister vrijstelling
      worden verleend van de nationaliteitseis, bedoeld in [artikel 29, eerste lid, aanhef en onder a][ref1], voor het
      dienstdoen op Nederlandse schepen die geen vissersvaartuig zijn, mits het betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel29
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '29'
        hoofdstuk: '3'
  - number: 30.2.a
    text: |-
      staten waarmee, ingevolge een daartoe strekkend besluit van de Raad van de Europese Unie,
      toetredingsonderhandelingen gaande zijn en die voorkomen op een lijst die bij regeling van Onze Minister wordt
      vastgesteld, of
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel30
  - number: 30.2.b
    text: een staat die niet behoort tot een van de staten, bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel30
  - number: '30.3'
    text: 'De vrijstelling, bedoeld in het tweede lid, kan slechts worden verleend indien:'
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel30
  - number: 30.3.a
    text: |-
      het Koninkrijk der Nederlanden voor Nederland met die staat een schriftelijke afspraak heeft gemaakt voor de
      erkenning van vaarbevoegdheidsbewijzen als bedoeld in Voorschrift I/10 van de Bijlage bij het STCW-Verdrag, en
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel30
  - number: 30.3.b
    text: de erkenningsprocedure, opgenomen in artikel 19 van de bemanningsrichtlijn, is voltooid.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel30
  - number: '30.4'
    text: Aan de vrijstelling, bedoeld in het tweede lid, kunnen beperkingen of nadere voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel30
  - number: '30.5'
    text: |-
      Door werkgevers- en werknemersorganisaties in de sector koopvaardij, respectievelijk de sector zeegaande waterbouw
      wordt, ter regulering van de arbeidsmarkt voor kapiteins met de Nederlandse nationaliteit, respectievelijk die
      van een staat als bedoeld in het eerste lid, voor hun sector een privaatrechtelijke regeling vastgesteld omtrent
      afgifte aan een scheepsbeheerder van een schriftelijke toestemming tot het aanstellen van een persoon met een
      andere nationaliteit in de functie van kapitein.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel30
  - number: '30.6'
    text: |-
      Elk der regelingen, bedoeld in het vijfde lid, bevat bepalingen ten aanzien van de afgifte, respectievelijk de
      weigering van een verklaring als bedoeld in het vijfde lid, door een paritair samengestelde commissie, bestaande
      uit vertegenwoordigers van de werkgevers- en werknemersorganisaties in de sector koopvaardij, respectievelijk de
      sector zeegaande waterbouw.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel30
  - number: '30.7'
    text: 'De regeling als bedoeld in het vijfde lid, bevat daarnaast in elk geval:'
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel30
  - number: 30.7.a
    text: |-
      een klachtenprocedure ten behoeve van eerste stuurlieden, respectievelijk eerste maritieme officieren die naar hun
      oordeel op onjuiste gronden niet zijn aangesteld in de functie van kapitein op een Nederlands schip;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel30
  - number: 30.7.b
    text: de vaststelling van de werkzaamheden van de commissie, bedoeld in het zesde lid, en
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel30
  - number: 30.7.c
    text: |-
      de wijze van verkrijging van betrouwbare en zo volledig mogelijke informatie als omschreven in het achtste lid,
      welke jaarlijks vóór 1 april aan Onze Minister dient te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel30
  - number: '30.8'
    text: 'De informatie, bedoeld in het zevende lid, onder c, omvat:'
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel30
  - number: 30.8.a
    text: het aantal zeevarenden op de Nederlandse vloot, gerangschikt naar functie, leeftijd en nationaliteit;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel30
  - number: 30.8.b
    text: |-
      het aantal Nederlandse officieren dat in het verstreken jaar voor het eerst, anders dan als stagiair, is gemonsterd
      op Nederlandse zeeschepen;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel30
  - number: 30.8.c
    text: het aantal beschikbare stageplaatsen;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel30
  - number: 30.8.d
    text: het aantal Nederlandse studenten dat als stagiair is geplaatst, en
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel30
  - number: 30.8.e
    text: het aantal buitenlandse studenten dat als stagiair is geplaatst, alsmede de nationaliteit van deze stagiairs.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel30
  - number: '30.9'
    text: |-
      Voorafgaand aan de vaststelling van een regeling als bedoeld in het tweede lid pleegt Onze Minister overleg over
      het ontwerp van een regeling met de werkgevers- en werknemersorganisaties in de sector koopvaardij, respectievelijk
      de sector zeegaande waterbouw.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel30
  - number: '30.10'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld met betrekking tot de vrijstelling van de eisen neergelegd
      in [artikel 29, eerste lid][ref1], voor de gevallen waarin de privaatrechtelijke regeling, bedoeld in het vijfde
      lid, niet binnen drie maanden na de inwerkingtreding van dat vijfde lid tot stand is gekomen, dan wel vervallen is
      zonder dat door de werkgevers- en werknemersorganisaties in de desbetreffende sector is voorzien in vervanging van
      die regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel29
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '29'
        hoofdstuk: '3'
  - number: '31.1'
    text: |-
      In geval van belet of ontstentenis van de kapitein van een Nederlands schip, niet zijnde een vissersvaartuig,
      treedt als kapitein op de eerste stuurman, onderscheidenlijk de eerste maritiem officier.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel31
  - number: '31.2'
    text: |-
      In geval geen eerste stuurman of eerste maritiem officier aanwezig is, treedt als kapitein op een door de
      scheepsbeheerder aangewezen persoon.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel31
  - number: '31.3'
    text: |-
      In geval van belet of ontstentenis van de kapitein van een vissersvaartuig treedt als kapitein op de
      plaatsvervangend schipper of, bij afwezigheid van een plaatsvervangend schipper, een door de scheepsbeheerder
      aangewezen persoon.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel31
  - number: '32.1'
    text: |-
      De scheepsbeheerder draagt er zorg voor dat de kapitein op grond van de door hem gegeven zienswijze bij de
      toepassing van [artikel 4, vijfde lid][ref1], of bij toepassing van [artikel 8, vierde lid][ref2], niet benadeeld
      wordt in zijn positie in de zeescheepvaartonderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel8
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '32.2'
    text: |-
      De kapitein kan de kantonrechter verzoeken te bepalen dat de scheepsbeheerder gevolg dient te geven aan hetgeen in
      het eerste lid is bepaald.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel32
  - number: 32a.1
    text: |-
      Tegenover de scheepsbeheerder is de kapitein verplicht te handelen overeenkomstig de hem door de scheepsbeheerder
      gegeven orders, mits deze orders niet in strijd zijn met de verplichtingen, hem als gezagvoerder door de wet
      opgelegd.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel32a
  - number: 32a.2
    text: |-
      De kapitein geeft de scheepsbeheerder doorlopend kennis van alles wat het schip en de zaken aan boord betreft en
      vraagt diens orders alvorens tot een maatregel van geldelijk belang over te gaan.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel32a
  - number: '33.1'
    text: Aan boord van een schip is een monsterrol, die wordt opgemaakt, gewijzigd en ondertekend door de kapitein.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel33
  - number: '33.2'
    text: |-
      In de monsterrol worden, onverminderd [artikel 34][ref1], de namen en de functies opgenomen van alle zeevarenden
      die aan boord werkzaam zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel34
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '33.3'
    text: De monsterrol heeft een geldigheidsduur van niet meer dan twaalf maanden.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel33
  - number: '34.1'
    text: 'Bij of krachtens algemene maatregel van bestuur:'
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel34
  - number: 34.1.a
    text: wordt bepaald welke gegevens van de bemanning voorts worden opgenomen in de monsterrol;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel34
  - number: 34.1.b
    text: wordt het model van de monsterrol vastgesteld;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel34
  - number: 34.1.c
    text: worden de wijze en frequentie van opmaken en wijzigen van de monsterrol bepaald;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel34
  - number: 34.1.d
    text: |-
      kunnen regels worden gesteld met betrekking tot de wijze waarop de Onze Minister van een opgemaakte of gewijzigde
      monsterrol in kennis wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel34
  - number: '34.2'
    text: |-
      Bij ministeriële regeling kan van de verplichting, genoemd in [artikel 33, eerste lid][ref1], en van de bepalingen
      krachtens het eerste lid van dit artikel ten behoeve van bepaalde categorieën van schepen vrijstelling worden
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel33
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '34.3'
    text: |-
      Onze Minister kan in bijzondere gevallen van de verplichting, genoemd in [artikel 33, eerste lid][ref1], en van
      de bepalingen krachtens het eerste lid van dit artikel ontheffing verlenen ten behoeve van een bepaald schip en
      gedurende een bepaalde periode. Aan deze ontheffing kunnen beperkingen en voorwaarden worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel33
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '35.1'
    text: |-
      De zeevarenden, bedoeld in [artikel 33, tweede lid][ref1], zijn in het bezit van een geldig monsterboekje.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel33
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '35.2'
    text: |-
      Het eerste lid is niet van toepassing op bemanningsleden met een andere nationaliteit dan de Nederlandse, indien
      zij in het bezit zijn van een geldig monsterboekje dat ten minste in de Engelse taal is gesteld en is afgegeven
      door of namens de bevoegde autoriteit van het land van herkomst of van een ander land.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel35
  - number: '36'
    text: Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel36
  - number: 36.a
    text: het monsterboekje, alsmede de afgifte ervan;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel36
  - number: 36.b
    text: de in het monsterboekje op te nemen gegevens, en
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel36
  - number: 36.c
    text: de gegevens die anderen dan de kapitein in het monsterboekje mogen aantekenen.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel36
  - number: '37'
    text: Een monsterboekje is tot tien jaar na de datum van afgifte geldig.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel37
  - number: '38.1'
    text: |-
      De kapitein tekent van een bemanningslid in het monsterboekje aan dan wel reikt een document uit waarin is
      aangegeven:
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel38
  - number: 38.1.a
    text: de dag van aanmonstering;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel38
  - number: 38.1.b
    text: de dag en plaats van afmonstering;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel38
  - number: 38.1.c
    text: de functie waarin het bemanningslid heeft dienst gedaan alsmede een overzicht van zijn werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel38
  - number: 38.1.d
    text: |-
      de naam en roepletters van het schip en voor een passagiersschip van meer dan 100 GT of meer of een schip, niet
      zijnde een passagiersschip, van 300 GT of meer, het IMO-nummer;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel38
  - number: 38.1.e
    text: GT van het schip;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel38
  - number: 38.1.f
    text: het voortstuwingsvermogen in kW;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel38
  - number: 38.1.g
    text: |-
      het soort schip, onderscheiden naar koopvaardijschip, vissersvaartuig, zeilschip, alsmede werktuiglijke
      voortbeweging door middel van een inwendige verbrandingsmotor, een elektrische voortstuwingsinstallatie of door
      stoom, en
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel38
  - number: 38.1.h
    text: |-
      het type schip, onderscheiden naar olietanker, chemicaliëntanker, vloeibaar gastanker, hoge snelheidsvaartuig of
      passagiersschip.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel38
  - number: '38.2'
    text: |-
      In het monsterboekje dan wel het document, bedoeld in het eerste lid, wordt het loon noch enige gedragsbeoordeling
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel38
  - number: '38.3'
    text: Bij ministeriële regeling wordt het model van het in het eerste lid bedoelde document vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel38
  - number: 38a.1
    text: |-
      De kapitein bewaart het monsterboekje na de aanmonstering en geeft het aan het bemanningslid terug bij de
      afmonstering.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel38a
  - number: 38a.2
    text: |-
      Indien de kapitein het monsterboekje niet kan teruggeven aan het bemanningslid, doet hij het toekomen aan de
      scheepsbeheerder die het, onder vermelding van de reden voor het niet teruggeven, zendt aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel38a
  - number: '40.1'
    text: |-
      Elk bemanningslid dat een functie uitoefent als bedoeld in [artikel 18, tweede lid][ref1], is in het bezit van
      een geldige geneeskundige verklaring van geschiktheid voor de zeevaart, waaruit blijkt dat hij is gekeurd door een
      geneeskundige of medisch specialist die door Onze Minister daartoe is aangewezen, en hij voldoet aan de eisen van
      medische geschiktheid, vastgesteld krachtens [artikel 19, eerste lid, aanhef en onderdeel a, onder 3°][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel19
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '40.2'
    text: |-
      Elke andere zeevarende dan een bemanningslid als bedoeld in het eerste lid, is in het bezit van een geldige
      geneeskundige verklaring van geschiktheid voor de zeevaart, waaruit blijkt dat hij is gekeurd door een
      geneeskundige of medisch specialist die door Onze Minister daartoe is aangewezen of erkend, en hij voldoet aan de
      eisen van medische geschiktheid, vastgesteld bij of krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel40
  - number: 40a
    text: |-
      Een geneeskundige verklaring waaruit blijkt dat een bemanningslid is gekeurd en medisch geschikt bevonden voor
      de zeevaart door een geneeskundige of medisch specialist die door de bevoegde autoriteit van een andere lidstaat
      van de Europese Unie, een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische
      Ruimte of Zwitserland daartoe is aangewezen, wordt gelijkgesteld met een geneeskundige verklaring als bedoeld in
      [artikel 40, eerste of tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel40
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '40'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '41'
    text: |-
      De geneeskundige verklaring van geschiktheid voor de zeevaart, bedoeld in [artikel 40, eerste en tweede lid][ref1],
      wordt bij aanmonstering overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel40
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '40'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '42.1'
    text: |-
      Indien de geneeskundige of medisch specialist na de keuring weigert aan de gekeurde de vereiste geneeskundige
      verklaring van geschiktheid voor de zeevaart af te geven, heeft de gekeurde het recht zich nogmaals te laten keuren
      door een door Onze Minister als scheidsrechter aangewezen geneeskundige of medisch specialist.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel42
  - number: '42.2'
    text: Het oordeel van de als scheidsrechter aangewezen geneeskundige of medisch specialist is bindend.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel42
  - number: '42.3'
    text: |-
      De gekeurde, aan wie geweigerd is een geneeskundige verklaring van geschiktheid voor de zeevaart af te geven,
      heeft het recht zich opnieuw door een scheidsrechter te laten onderzoeken, indien er medische gronden zijn om te
      veronderstellen dat de reden voor de eerdere afkeuring is vervallen.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel42
  - number: '42.4'
    text: |-
      De gekeurde die tijdens het onderzoek heeft meegedeeld dat hij van mening is dat hij op medische gronden ongeschikt
      voor de zeevaart moet worden bevonden, heeft het recht zich door een scheidsrechter te laten onderzoeken, indien
      de keurende geneeskundige of medische specialist geen bezwaren heeft geconstateerd tegen afgifte aan hem van een
      geneeskundige verklaring van geschiktheid voor de zeevaart.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel42
  - number: '43.1'
    text: |-
      De geneeskundige verklaring van geschiktheid voor de zeevaart, afgegeven door een geneeskundige of medisch
      specialist die niet ingevolge [artikel 42][ref1] als scheidsrechter is aangewezen, nadat een andere geneeskundige
      of medisch specialist de afgifte van een geneeskundige verklaring van geschiktheid voor de zeevaart heeft
      geweigerd, is ongeldig.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel42
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '43.2'
    text: |-
      Indien uit een volgende keuring blijkt dat de gekeurde niet aan de gestelde eisen van medische geschiktheid
      voldoet, vervalt de geldigheid van de desbetreffende, eerder afgegeven, verklaring van geschiktheid voor de
      zeevaart en wordt deze ingenomen door de keuringsarts.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel43
  - number: '44.1'
    text: Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel44
  - number: 44.1.a
    text: |-
      de medische keuringen, bedoeld in [artikel 40, eerste en tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel40
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '40'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 44.1.b
    text: de herkeuring door als scheidsrechters aangewezen geneeskundigen of medisch specialisten;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel44
  - number: 44.1.c
    text: |-
      de aanwijzing en erkenning van geneeskundigen, medisch specialisten en scheidsrechters, alsmede de intrekking van
      deze aanwijzing en erkenning;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel44
  - number: 44.1.d
    text: het model en de geldigheidsduur van de geneeskundige verklaring van geschiktheid voor de zeevaart.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel44
  - number: '44.2'
    text: |-
      De vaststelling van de regels, bedoeld in het eerste lid, onderdelen a en d, vindt plaats na raadpleging van de
      representatieve organisaties van werkgevers en werknemers in de zeevaart.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel44
  - number: '44.3'
    text: |-
      Onze Minister kan voor een bepaalde periode van de verplichting te voldoen aan de geldende medische normen
      ontheffing verlenen, indien een als scheidsrechter aangewezen geneeskundige of medisch specialist daartoe
      gemotiveerd adviseert.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel44
  - number: '45.1'
    text: |-
      Indien korte tijd voor vertrek van een schip de bemanning moet worden aangevuld, kan, indien dringende
      omstandigheden nopen tot het aanmonsteren van personen die niet in het bezit zijn van een geldige geneeskundige
      verklaring van geschiktheid voor de zeevaart, door Onze Minister aan een zeevarende die in het bezit is van een
      geneeskundige verklaring van geschiktheid voor de zeevaart waarvan de geldigheidsduur recentelijk is verstreken,
      ontheffing worden verleend van de in [artikel 40, eerste of tweede lid][ref1], bedoelde verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel40
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '40'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '45.2'
    text: |-
      De in het eerste lid bedoelde ontheffing geldt tot aan de volgende aanloophaven waar een medische keuring door een
      geneeskundige of medisch specialist als bedoeld in [artikel 40, eerste of tweede lid][ref1], kan worden verricht,
      maar ten hoogste voor een termijn van drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel40
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '40'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '47.1'
    text: |-
      Indien de geldigheid van een geneeskundige verklaring gedurende een reis verstrijkt, kan de betrokken zeevarende
      werkzaamheden verrichten tot aan de volgende aanloophaven waar een medische keuring door een geneeskundige of
      medisch specialist als bedoeld in [artikel 40, eerste of tweede lid][ref1], kan worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel40
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '40'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '47.2'
    text: |-
      De termijn tussen het verstrijken van de geldigheid van een geneeskundige verklaring gedurende een reis en de
      medische keuring, bedoeld in het eerste lid, bedraagt ten hoogste drie maanden.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel47
  - number: '48.1'
    text: |-
      De scheepsbeheerder draagt zorg voor behoorlijke en veilige accommodatie voor de zeevarenden aan boord van
      een schip, met inbegrip van voorzieningen en voorraden voor zieke zeevarenden en recreatieve voorzieningen met
      inachtneming van de daaraan bij ministeriële regeling gestelde eisen. Deze eisen kunnen afhankelijk van het
      bouwjaar van het schip verschillen.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48
  - number: '48.2'
    text: |-
      In overeenstemming met norm A 3.1 van het Maritiem Arbeidsverdrag dan wel, voor vissersvaartuigen, onderdeel 3
      van Bijlage III van het Verdrag betreffende werk in de visserijsector kan van bepaalde eisen door Onze Minister
      ontheffing worden verleend.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48
  - number: 48a.1
    text: |-
      De scheepsbeheerder voorziet de zeevarenden aan boord van een schip kosteloos van voeding en drinkwater van
      voldoende hoeveelheid, kwaliteit, voedingswaarde en variëteit en rekening houdend met godsdienstige voorschriften
      en culturele gebruiken, in overeenstemming met de daaraan bij ministeriële regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48a
  - number: 48a.2
    text: |-
      De maximale hoeveelheid sterke drank als bedoeld in [artikel 1, eerste lid, van de Alcoholwet][ref1] die voor
      verbruik door de zeevarenden aan boord beschikbaar is, wordt vastgesteld bij ministeriële regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel1
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '1'
  - number: 48a.3
    text: |-
      De voorraden voedsel en drinkwater en de ruimten en apparatuur voor de opslag, bewerking en bereiding van voedsel
      en drinkwater, worden regelmatig door of namens de kapitein geïnspecteerd overeenkomstig bij ministeriële regeling
      gestelde regels.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48a
  - number: 48a.4
    text: |-
      Degene die aan boord tot taak heeft de voeding voor de zeevarenden te beheren en te bereiden, voldoet aan de bij of
      krachtens algemene maatregel van bestuur gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48a
  - number: 48b.1
    text: |-
      De scheepsbeheerder stelt voor een schip van 500 GT of meer dat internationale reizen maakt, een verklaring
      naleving maritieme arbeid deel II op waarin maatregelen zijn opgenomen om te waarborgen dat de in
      [artikel 48c, eerste lid][ref1], bedoelde eisen voortdurend worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel48c
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48b
    references:
