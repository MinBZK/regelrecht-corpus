  - number: 69db.3
    text: |-
      De in het eerste lid bedoelde scheepsbeheerder zorgt ten aanzien van de personen, bedoeld in de
      [artikelen 747][ref1] en [749 van Boek 7 van het Burgerlijk Wetboek][ref2], voor de nakoming van de
      uit de [artikelen 706][ref3], [707][ref4],[718][ref5], [719 leden 1, 2, 5 en 6][ref6], [720][ref7],
      [734 tot en met 734l][ref8], [743][ref9] en [746 van genoemd Boek 7][ref10] voortkomende verplichtingen.


