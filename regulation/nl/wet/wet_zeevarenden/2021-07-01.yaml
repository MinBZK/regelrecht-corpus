        hoofdstuk: '7'
        paragraaf: '8'
  - number: '61'
    text: |-
      Tegen een op grond van deze wet genomen besluit van een ambtenaar van de Inspectie Leefomgeving en Transport tot
      aanhouding van een schip, kan iedere belanghebbende beroep instellen bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel61
  - number: '62'
    text: Bij ministeriële regeling worden de tarieven vastgesteld voor
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel62
  - number: 62.a
    text: de afgifte van bemanningscertificaten;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel62
  - number: 62.b
    text: de beoordeling van een bemanningsplan;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel62
  - number: 62.c
    text: de afgifte, vervanging of vernieuwing van vaarbevoegdheidsbewijzen;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel62
  - number: 62.d
    text: de afgifte of vervanging van een monsterboekje;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel62
  - number: 62.e
    text: het verlenen van ontheffingen;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel62
  - number: 62.f
    text: vergoedingen van gecommitteerden en deskundigen;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel62
  - number: 62.g
    text: |-
      de afgifte, vervanging of vernieuwing van bijzondere documenten, bedoeld in [artikel 21][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel21
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 62.h
    text: de afgifte van bekwaamheidsbewijzen en verklaringen;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel62
  - number: 62.i
    text: |-
      de behandeling van een aanvraag voor de erkenning van een opleiding als bedoeld in
      [artikel 19a, derde lid, onderdeel b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel19a
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: 19a
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 62.j
    text: |-
      de afgifte, vervanging of vernieuwing van certificaten maritieme arbeid en verklaringen naleving maritieme arbeid;
      en
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel62
  - number: 62.k
    text: |-
      de afgifte van bewijzen van aanvraag om erkenning van een vaarbevoegdheidsbewijs als bedoeld in
      [artikel 18, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel18
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0009124
