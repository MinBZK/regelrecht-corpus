  - number: 69e.1
    text: |-
      De scheepsbeheerder draagt zorg voor een schriftelijk beleid ten aanzien van de voorkoming van alcoholmisbruik door
      zeevarenden die veiligheidstaken, beveiligingstaken of taken die verband houden met het mariene milieu uitvoeren.
      Hierbij wordt aandacht geschonken aan voorlichting omtrent de gevolgen van het gebruik van alcohol en aan het
      gebruik van alcohol tijdens het werk.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel69e
  - number: 69e.2
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de inhoud van het in het eerste lid bedoelde
      beleid.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel69e
  - number: '70.1'
    text: |-
      Een vaarbevoegdheidsbewijs, afgegeven aan een zeevarende voor het tijdstip waarop artikel I, onderdelen M en XX,
      van het bij koninklijke boodschap van 13 oktober 2012 ingediende voorstel van wet houdende wijziging van de Wet
      zeevarenden, de Scheepvaartverkeerswet en de Wet op de economische delicten in verband met de implementatie van
      de wijziging van de bijlage bij het STCW-Verdrag en de STCW-Code en enige andere onderwerpen op het terrein van de
      zeevaartbemanning (Kamerstukken II 2012/2013, 33 442, nr. 2), nadat dat voorstel tot wet is verheven, in werking
      treden, behoudt zijn geldigheid overeenkomstig de daarop aangegeven einddatum indien de zeevarende aantoont de in
      [artikel 19a, tweede lid][ref1], bedoelde bijscholings- en herhalingstrainingen te hebben gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel19a
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: 19a
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '70.2'
    text: |-
      Een vaarbevoegdheidsbewijs, afgegeven aan een zeevarende voor het in het eerste lid bedoelde tijdstip, behoudt zijn
      geldigheid overeenkomstig de daarop aangegeven einddatum maar uiterlijk tot 1 januari 2017, indien de zeevarende
      niet aantoont de in [artikel 19a, tweede lid][ref1], bedoelde bijscholings- en herhalingstrainingen te hebben
      gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel19a
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: 19a
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '71'
    text: |-
      Op aanvragen voor bemanningsdocumenten, vaarbevoegdheidsbewijzen, bekwaamheidsbewijzen voor het dienstdoen op
      tankers en monsterboekjes die zijn ingediend voor het tijdstip waarop artikel I van het in [artikel 70][ref1]
      bedoelde voorstel van wet, nadat dat voorstel tot wet is verheven, in werking treedt en op dat tijdstip nog in
      behandeling zijn, wordt besloten met inachtneming van het bepaalde bij of krachtens genoemd artikel I.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel70
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '70'
        hoofdstuk: '8'
  - number: '78.1'
    text: |-
      Een wijziging van de bemanningsrichtlijn gaat voor de toepassing van deze wet gelden met ingang van de dag waarop
      aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de
      Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel78
  - number: '78.2'
    text: |-
      Een wijziging van de op grond van deze wet toepasselijke verdragen en codes gaat, tenzij bij ministerieel besluit,
      dat in de Staatscourant wordt bekendgemaakt, anders is bepaald, voor de toepassing van deze wet gelden met ingang
      van de dag waarop die wijziging internationaal in werking treedt.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel78
  - number: '78.3'
    text: |-
      Bij ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, kunnen de benaming van de
      bemanningsrichtlijn en de verwijzing naar onderdelen daarvan worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel78
  - number: '79'
    text: |-
      Ingeval bij of krachtens deze wet regels worden gesteld ter uitvoering van het STCW-Verdrag, het SOLAS-verdrag of
      het Maritiem Arbeidsverdrag, kan overtreding van die regels ook als strafbaar feit worden aangemerkt dan wel worden
      bestraft met een bestuurlijke sanctie indien deze regels in de Engelse taal zijn gesteld en bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel79
  - number: '84'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel84
  - number: '85'
    text: 'Deze wet wordt aangehaald als: Wet zeevarenden.'
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel85
