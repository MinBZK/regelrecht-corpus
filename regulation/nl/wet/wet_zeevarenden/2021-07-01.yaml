  - number: 60a
    text: |-
      Het is verboden zeevarenden te straffen of op enige andere wijze te benadelen voor het indienen van een klacht als
      bedoeld in [artikel 69a, eerste lid][ref1], of [69b, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel69a
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel69b
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel60a
    references:
