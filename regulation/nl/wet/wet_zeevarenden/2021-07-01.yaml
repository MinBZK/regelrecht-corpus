        artikel: '40'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 1.1.t
    text: |-
      tuchtcollege: het tuchtcollege voor de scheepvaart als bedoeld in [artikel 55a, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel55a
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel1
