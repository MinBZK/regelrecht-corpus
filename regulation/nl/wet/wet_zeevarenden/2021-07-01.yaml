      de bemanningssamenstelling, gesteld bij of krachtens [hoofdstuk 2, paragrafen 1][ref1] en
      [2][ref2], alsmede de rusttijden, gesteld bij of krachtens [paragraaf 5.2][ref3] en krachtens
      [artikel 5:12, tweede lid, van de Arbeidstijdenwet][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0007671#Paragraaf5.2
      [ref4]: https://wetten.overheid.nl/BWBR0007671#Artikel5
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48f
    references:
      - id: ref1
