        hoofdstuk: '2'
        paragraaf: '3'
  - number: '63'
    text: |-
      Onze Minister kan gecommitteerden of deskundigen aanwijzen, die bevoegd zijn de examens bij te wonen die worden
      afgenomen ter verkrijging van de bij of krachtens deze wet bedoelde vaarbevoegdheden of bekwaamheidsbewijzen.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel63
  - number: '64'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen, ter uitvoering van verdragen of besluiten van
      volkenrechtelijke organisaties, regels worden gesteld ter waarborging van de veilige en milieuverantwoorde vaart
      alsmede de gezondheid, de veiligheid en behoorlijke leef- en werkomstandigheden van zeevarenden.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel64
  - number: '65.1'
    text: |-
      Er is een Centraal register bemanningsgegevens, waarin Onze Minister de gegevens omtrent de afgegeven
      vaarbevoegdheidsbewijzen, bekwaamheidsbewijzen en monsterboekjes, alsmede de ten aanzien van deze bewijzen gegeven
      vrijstellingen en ontheffingen registreert.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel65
  - number: '65.2'
    text: |-
      Onze Minister beheert een Centraal inspectieregister waarin de inspectierapporten met betrekking tot de werk- en
      leefomstandigheden van zeevarenden aan boord worden geregistreerd.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel65
  - number: 65a
    text: |-
      Onze Minister is bevoegd aan de tot het verstrekken en ontvangen van informatie bevoegde autoriteit van een
      lidstaat van de Europese Unie, een andere staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte of het STCW-Verdrag, informatie te verstrekken en van deze te ontvangen omtrent de verlening van
      een vaarbevoegdheidsbewijs of een bekwaamheidsbewijs.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel65a
  - number: '66'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de registratie van gegevens in de in
      [artikel 65][ref1] bedoelde centrale registers.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel65
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '65'
        hoofdstuk: '7'
        paragraaf: '5'
  - number: '67.1'
    text: Er is een openbaar register van bemanningscertificaten, dat door Onze Minister wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel67
  - number: '67.2'
    text: |-
      Er is een openbaar register van certificaten maritieme arbeid en visserij-arbeidscertificaten, dat door Onze
      Minister wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel67
  - number: '67.3'
    text: De in het eerste en tweede lid bedoelde registers kunnen door een ieder kosteloos worden geraadpleegd.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel67
  - number: '67.4'
    text: |-
      Desgevraagd wordt tegen ten hoogste de kostprijs een afschrift verstrekt van een certificaat voor een bepaald
      schip.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel67
  - number: '68'
    text: |-
      Onze Minister kan een examencommissie aanwijzen bij welke gelegenheid wordt geboden examen af te leggen voor de
      hierna genoemde bekwaamheidsbewijzen:
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel68
  - number: 68.a
    text: diploma stuurman grote zeilvaart;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel68
  - number: 68.b
    text: diploma stuurman kleine zeilvaart;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel68
  - number: 68.c
    text: certificaat grote zeilvaart;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel68
  - number: 68.d
    text: certificaat kleine zeilvaart.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel68
  - number: '69'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden de beroepsvereisten vastgesteld voor de functies waartoe de
      in [artikel 68][ref1] genoemde bekwaamheidsbewijzen toegang verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel68
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '68'
        hoofdstuk: '7'
        paragraaf: '7'
  - number: 69a.1
    text: |-
      Aan boord van elk schip is een door de scheepsbeheerder vastgestelde klachtenprocedure van toepassing voor het
      indienen van klachten met betrekking tot de naleving van de in [artikel 48c, eerste lid][ref1], bedoelde bepalingen
      of een vermoedelijke schending van het Maritiem Arbeidsverdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel48c
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel69a
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: 48c
        hoofdstuk: 4B
  - number: 69a.2
    text: |-
      Bij ministeriële regeling worden regels gesteld waaraan de in het eerste lid bedoelde klachtenprocedure moet
      voldoen.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel69a
  - number: 69a.3
    text: |-
      Iedere zeevarende ontvangt voor aanvang van zijn werkzaamheden aan boord van de kapitein een afschrift van de aan
      boord geldende klachtenprocedure.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel69a
  - number: 69a.4
    text: Het bepaalde bij of krachtens dit artikel is niet van toepassing op vissersvaartuigen.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel69a
  - number: 69b.1
    text: |-
      Elke zeevarende aan boord van een Nederlands schip kan een klacht betreffende de vermoedelijke schending van het
      Maritiem Arbeidsverdrag of een klacht betreffende een vermeend onrechtmatig bevel van de kapitein melden bij een
      daartoe aangewezen ambtenaar van de Inspectie Leefomgeving en Transport.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel69b
  - number: 69b.2
    text: |-
      Bij ministeriële regeling worden regels gesteld over de wijze waarop de in het eerste lid bedoelde klachten worden
      behandeld.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel69b
  - number: 69b.3
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op klachten betreffende een vermoedelijke schending
      van het Verdrag betreffende werk in de visserijsector met dien verstande dat een klacht kan worden ingediend
      door een visser, een vereniging van beroepsbeoefenaren of een andere belangenvereniging, een vakbond of, in het
      algemeen, door eenieder die belang heeft bij de veiligheid van het vaartuig of de gezondheid van vissers aan boord.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel69b
  - number: 69c.1
    text: |-
      De scheepsbeheerder draagt er zorg voor dat aan boord van het schip afschriften aanwezig zijn van de door de
      desbetreffende zeevarende en zijn werkgever ondertekende arbeidsovereenkomst, de toepasselijke collectieve
      arbeidsovereenkomst en informatie over andere op die arbeidsovereenkomst van toepassing zijnde arbeidsvoorwaarden
      en certificaten van verzekeringen als bedoeld in [artikel 48c, eerste lid, onderdelen n en o][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel48c
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel69c
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: 48c
        hoofdstuk: 4B
  - number: 69c.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op iedere andere overeenkomst op basis waarvan de zeevarende aan
      boord werkzaam is.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel69c
  - number: 69c.3
    text: |-
      De scheepsbeheerder draagt er zorg voor dat aan boord van het schip op een duidelijk zichtbare en voor de bemanning
      toegankelijke plaats een afschrift aanwezig is van het certificaat maritieme arbeid en de verklaring naleving
      maritieme arbeid.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel69c
  - number: 69c.4
    text: |-
      De scheepsbeheerder draagt er zorg voor dat aan boord van het schip een exemplaar van de geldende tekst van het
      Maritiem Arbeidsverdrag aanwezig is.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel69c
  - number: 69c.5
    text: |-
      Alle in het eerste tot en met het vierde lid bedoelde documenten en de resultaten van onderzoeken als bedoeld in
      [artikel 48c, derde lid, onderdeel a][ref1], zijn beschikbaar in het Nederlands of indien het originele document
      in een andere taal is opgesteld, in de desbetreffende taal, en het Engels en eenvoudig toegankelijk voor de
      zeevarenden. Indien het schip geen internationale reizen maakt, is geen Engelse vertaling vereist van de documenten
      die in het Nederlands beschikbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel48c
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel69c
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: 48c
        hoofdstuk: 4B
  - number: 69c.6
    text: Het bepaalde bij of krachtens dit artikel is niet van toepassing op vissersvaartuigen.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel69c
  - number: 69d.1
    text: |-
      De scheepsbeheerder draagt er zorg voor dat de zee-arbeidsovereenkomsten, bedoeld in de
      [artikelen 694, eerste lid][ref1] en [736, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref2]
      van de zeevarenden aan boord van zijn schip voldoen aan het bepaalde in de [artikelen 697][ref3]
      en [699 van Boek 7 van het Burgerlijk Wetboek][ref4] en, voor wat betreft de onderdelen 6, 7, 8,
      12 en 13 van laatstgenoemd artikel, in overeenstemming zijn met de toepasselijke bepalingen in
      [Boek 7 van het Burgerlijk Wetboek][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel694
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel736
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel697
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel699
      [ref5]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel69d
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '694'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '736'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '697'
      - id: ref4
        bwb_id: BWBR0005290
        artikel: '699'
      - id: ref5
        bwb_id: BWBR0005290
  - number: 69d.2
    text: |-
      De scheepsbeheerder zorgt voor de nakoming van de uit de [artikelen 706 tot en met 709][ref1],
      [717 tot en met 720][ref2], en [734 tot en met 734l van Boek 7 van het Burgerlijk Wetboek][ref3] voortkomende
      verplichtingen. Indien de scheepsbeheerder niet de werkgever is van de desbetreffende zeevarende, geeft
      de scheepsbeheerder slechts toepassing aan de eerste volzin indien de werkgever bij de nakoming van deze
      verplichtingen in gebreke blijft en de zeevarende aan de scheepsbeheerder een verzoek tot nakoming doet.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel706
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel717
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel734
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel69d
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '706'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '717'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '734'
  - number: 69d.3
    text: |-
      De scheepsbeheerder zorgt voor de nakoming van de uit de [artikelen 738a, eerste tot en met vierde lid][ref1],
      [738d][ref2], [738e, eerste en tweede lid][ref3], en [738f, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref4]
      voortkomende verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel738a
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel738d
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel738e
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel738f
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel69d
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 738a
      - id: ref2
        bwb_id: BWBR0005290
        artikel: 738d
      - id: ref3
        bwb_id: BWBR0005290
        artikel: 738e
      - id: ref4
        bwb_id: BWBR0005290
        artikel: 738f
  - number: 69d.4
    text: |-
      De scheepsbeheerder handelt overeenkomstig de voor het desbetreffende schip op grond van
      [artikel 48c, eerste lid][ref1], afgegeven verklaring naleving maritieme arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel48c
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel69d
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: 48c
        hoofdstuk: 4B
  - number: 69da
    text: 'De scheepsbeheerder van een vissersvaartuig draagt er zorg voor dat:'
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel69da
  - number: 69da.a
    text: |-
      de overeenkomst, op basis waarvan de visser zijn werkzaamheden aan boord verricht, schriftelijk is aangegaan en is
      ondertekend door partijen;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel69da
  - number: 69da.b
    text: de visser beschikt over een afschrift van die overeenkomst; en
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel69da
  - number: 69da.c
    text: de overeenkomst aan boord voor inzage beschikbaar is voor de visser en, op verzoek, voor andere belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel69da
  - number: 69db.1
    text: |-
      De scheepsbeheerder van een vissersvaartuig draagt er zorg voor dat de overeenkomsten, op grond waarvan vissers hun
      werkzaamheden aan boord verrichten, voldoen aan [artikel 742 van Boek 7 van het Burgerlijk Wetboek][ref1] alsmede
      de bepalingen die ingevolge [artikel 740 van genoemd Boek 7][ref2] van toepassing zijn dan wel in gevolge de
      [artikelen 747][ref3] en [749 van genoemd Boek 7][ref4] van overeenkomstige toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel742
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel740
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel747
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel749
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel69db
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '742'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '740'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '747'
      - id: ref4
        bwb_id: BWBR0005290
        artikel: '749'
  - number: 69db.2
    text: |-
      De in het eerste lid bedoelde scheepsbeheerder zorgt ten aanzien van zeevarenden, die op grond van een
      arbeidsovereenkomst arbeid verrichten in de zeevisserij, voor de nakoming van de uit de [artikelen 706][ref1],
      [707][ref2][709][ref3], [718tot en met 720][ref4] ,[734 tot en met 734l][ref5], [736][ref6], [741][ref7],
      [743][ref8], [746][ref9] en [748 van Boek 7 van het Burgerlijk Wetboek][ref10] voortkomende verplichtingen.
      [Artikel 69d, tweede lid, tweede volzin][ref11], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel706
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel707
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel709
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel718
      [ref5]: https://wetten.overheid.nl/BWBR0005290#Artikel734
      [ref6]: https://wetten.overheid.nl/BWBR0005290#Artikel736
      [ref7]: https://wetten.overheid.nl/BWBR0005290#Artikel741
      [ref8]: https://wetten.overheid.nl/BWBR0005290#Artikel743
      [ref9]: https://wetten.overheid.nl/BWBR0005290#Artikel746
      [ref10]: https://wetten.overheid.nl/BWBR0005290#Artikel748
      [ref11]: https://wetten.overheid.nl/BWBR0009124#Artikel69d
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel69db
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '706'
