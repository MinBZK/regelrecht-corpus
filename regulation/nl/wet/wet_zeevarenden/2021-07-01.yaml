  - number: 48c.2
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de inhoud van de verklaring naleving maritieme
      arbeid deel I voor verschillende categorieën van schepen, waarbij een opsomming wordt voorgeschreven van alle in
      het eerste lid bedoelde eisen die op de desbetreffende schepen van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48c
  - number: 48c.3
    text: 'Bij ministeriële regeling worden regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48c
  - number: 48c.3.a
    text: |-
      de onderzoeken waaraan schepen zijn onderworpen ter verkrijging en verlenging van een certificaat maritieme arbeid
      of tijdens de geldigheidsduur daarvan, alsmede de inhoud van die onderzoeken en de frequentie waarmee zij worden
      verricht;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48c
  - number: 48c.3.b
    text: de registratie van de bij de inspectie verzamelde onderzoeksgegevens;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48c
  - number: 48c.3.c
    text: de geldigheid van het certificaat maritieme arbeid en de verlenging van de geldigheidsduur daarvan;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48c
  - number: 48c.3.d
    text: de voorwaarden voor afgifte van tijdelijke of voorlopige certificaten maritieme arbeid;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48c
  - number: 48c.3.e
    text: |-
      regels met betrekking tot de documenten waarmee kan worden aangetoond dat voldaan wordt aan het eerste lid,
      onderdelen n en o.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48c
  - number: 48c.4
    text: 'Bij ministeriële regeling worden regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48c
  - number: 48c.4.a
    text: de bij een aanvraag als bedoeld in het eerste lid te verstrekken gegevens en te overleggen bescheiden; en
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48c
  - number: 48c.4.b
    text: de modellen van het certificaat maritieme arbeid en het voorlopige certificaat maritieme arbeid.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48c
  - number: 48c.5
    text: |-
      Op verzoek van de scheepsbeheerder geeft Onze Minister voor schepen kleiner dan 500 GT overeenkomstig het bepaalde
      bij of krachtens dit artikel een certificaat maritieme arbeid af.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48c
  - number: 48c.6
    text: Het bepaalde bij of krachtens dit artikel is niet van toepassing op vissersvaartuigen.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48c
  - number: 48d.1
    text: |-
      De door Onze Minister aangewezen ambtenaren zijn belast met het verrichten van onderzoeken als bedoeld in
      [artikel 48c, derde lid, onderdeel a][ref1]. Deze onderzoeken kunnen tevens geheel of ten dele worden verricht door
      daartoe door Onze Minister aangewezen rechtspersonen.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel48c
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48d
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: 48c
        hoofdstuk: 4B
  - number: 48d.2
    text: Aan een aanwijzing als bedoeld in het eerste lid kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48d
  - number: 48d.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de aanwijzing van natuurlijke
      personen of rechtspersonen krachtens het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48d
  - number: 48d.4
    text: |-
      Onze Minister kan slechts door hem erkende rechtspersonen aanwijzen. Bij ministeriële regeling worden regels
      gesteld met betrekking tot de wijze van erkenning, de voorwaarden voor erkenning, de intrekking van de erkenning
      indien niet meer aan deze voorwaarden wordt voldaan, en de bekendmaking van een erkenning of intrekking van een
      erkenning.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48d
  - number: 48e.1
    text: 'Een certificaat maritieme arbeid vervalt, indien:'
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48e
  - number: 48e.1.a
    text: |-
      een deel van het schip wordt verbouwd waarvoor krachtens [artikel 48][ref1] gestelde eisen gelden, of in de
      inrichting of de uitrusting waarvoor krachtens artikel 48 gestelde voorschriften gelden, ingrijpende wijzigingen
      worden aangebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel48
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48e
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '48'
        hoofdstuk: 4A
  - number: 48e.1.b
    text: het schip een buitenlands schip wordt;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48e
  - number: 48e.1.c
    text: het tijdvak waarvoor het certificaat geldt, is verstreken;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48e
  - number: 48e.1.d
    text: |-
      de tijdens de geldigheidsduur van het certificaat verplicht gestelde onderzoeken als bedoeld in
      [artikel 48c, derde lid][ref1], niet of niet tijdig hebben plaatsgevonden, behoudens in bij ministeriële regeling
      omschreven bijzondere gevallen;


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel48c
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48e
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: 48c
        hoofdstuk: 4B
  - number: 48e.1.e
    text: |-
      het schip van naam verandert of een ander letterteken of nummer krijgt, of het schip niet langer wordt beheerd door
      de scheepsbeheerder vermeld op het certificaat maritieme arbeid.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48e
  - number: 48e.2
    text: 'Onze Minister kan een certificaat intrekken, wanneer blijkt dat:'
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48e
  - number: 48e.2.a
    text: |-
      de bouw, de inrichting of de uitrusting van het schip waarvoor krachtens [artikel 48][ref1] gestelde voorschriften
      gelden, in belangrijke mate afwijkt van de gegevens van het certificaat;


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel48
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48e
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '48'
        hoofdstuk: 4A
  - number: 48e.2.b
    text: |-
      het schip of de scheepsbeheerder niet langer voldoet aan de in [artikel 48c, eerste lid][ref1], bedoelde
      voorschriften of aan de voor het desbetreffende schip afgegeven verklaring naleving maritieme arbeid en de vereiste
      corrigerende maatregelen niet zijn getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel48c
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48e
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: 48c
        hoofdstuk: 4B
  - number: 48e.3
    text: |-
      Bij ministeriële regeling kan worden bepaald dat certificaten in bij die regeling te bepalen gevallen bovendien
      vervallen, wanneer het schip aan zijn oorspronkelijke bestemming wordt onttrokken.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48e
  - number: 48e.4
    text: De scheepsbeheerder zendt een vervallen of ingetrokken certificaat zo spoedig mogelijk aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48e
  - number: 48f.1
    text: |-
      Dit artikel is van toepassing op een vissersvaartuig dat gewoonlijk per reis meer dan drie dagen op zee verblijft
      en een lengte heeft van 24 meter of meer dan wel normaliter vaart op een afstand van meer dan 200 zeemijl tot de
      Nederlandse kustlijn.
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48f
  - number: 48f.2
    text: |-
      Onze Minister geeft op aanvraag een visserij-arbeidscertificaat af voor een vissersvaartuig als bedoeld in
      het eerste lid, indien na onderzoek blijkt dat voor dat vissersvaartuig wordt voldaan aan de voorschriften met
      betrekking tot:
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48f
  - number: 48f.2.1°
    text: |-
      de minimumleeftijd, gesteld bij of krachtens de [Arbeidstijdenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007671
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48f
    references:
      - id: ref1
        bwb_id: BWBR0007671
  - number: 48f.2.2°
    text: |-
      het geneeskundig onderzoek, gesteld bij of krachtens [hoofdstuk 4, paragraaf 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel48f
    references:
