    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel1
  - number: 1.1.q
    text: |-
      bemanningscertificaat: een door Onze Minister afgegeven certificaat, houdende het minimumaantal bemanningsleden met
      hun functies aan boord van het betrokken schip;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel1
  - number: 1.1.r
    text: |-
      beroepsvereisten: de krachtens deze wet gestelde vereisten ten aanzien van de kennis, het inzicht, de vaardigheden
      en de leeftijd voor een functie aan boord of voor werkzaamheden waarop deze wet van toepassing is;
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel1
  - number: 1.1.s
    text: |-
      geneeskundige verklaring van geschiktheid voor de zeevaart: een verklaring als bedoeld in [artikel 40][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel40
    url: https://wetten.overheid.nl/BWBR0009124/2021-07-01#Artikel1
    references:
      - id: ref1
