      maritieme arbeid en een verklaring naleving maritieme arbeid af, indien de door de scheepsbeheerder opgestelde
      verklaring naleving maritieme arbeid deel II voldoet aan het bepaalde krachtens [artikel 48b][ref1] en na onderzoek
