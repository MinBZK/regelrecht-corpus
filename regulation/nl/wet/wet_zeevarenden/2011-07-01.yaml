  - number: '17'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven met betrekking tot de
      samenstelling van de bemanning voor verschillende categorieën vissersvaartuigen.

      2 Deze paragraaf is niet van toepassing op vissersvaartuigen met een scheepslengte van minder dan 45 meter, met
      uitzondering van de [artikelen 5][ref1], [6][ref2], [13, aanhef en onderdeel b][ref3], [15][ref4], [16][ref5]
      en [17][ref6].

      3 De scheepsbeheerder dient per vissersvaartuig een aanvraag in voor een bemanningscertificaat bij Onze Minister.

      4 Bij ministeriële regeling wordt bepaald welke gegevens bij de aanvraag worden ingediend.


