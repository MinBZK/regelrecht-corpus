  - number: 55r
    text: |-
      Tegen een beslissing van het tuchtcollege kan binnen zes weken na de dag van de verzending van de in
      [artikel 55q, tweede lid][ref1], bedoelde brief hoger beroep worden ingesteld bij het College van Beroep voor het
      bedrijfsleven:

      a. door de betrokken kapitein of scheepsofficier indien het verzoek of de klacht geheel of ten dele gegrond is
      verklaard;

      b. door Onze Minister;

      c. door de klager indien zijn klacht geheel of ten dele ongegrond is verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel55q
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel55r
