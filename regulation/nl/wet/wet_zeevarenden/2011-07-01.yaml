  - number: 55a
    text: |-
      1 De kapitein en de scheepsofficieren zijn aan tuchtrechtspraak onderworpen terzake van enig handelen of nalaten in
      strijd met de zorg die zij als een goed zeeman in acht behoren te nemen ten opzichte van de opvarenden, het schip,
      de lading, het milieu of het scheepvaartverkeer.

      2 De tuchtrechtspraak in eerste aanleg wordt uitgeoefend door het tuchtcollege voor de scheepvaart. Het
      tuchtcollege voor de scheepvaart is gevestigd te Amsterdam.

      3 De tuchtrechtspraak in hoger beroep wordt uitgeoefend door het College van Beroep voor het bedrijfsleven. Het
      College van Beroep voor het bedrijfsleven beslist in hoogste ressort.
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel55a
  - number: 55b
    text: |-
      1 Het tuchtcollege bestaat uit een voorzitter, twee plaatsvervangende voorzitters, acht leden en zestien
      plaatsvervangende leden. Zij worden door Onze Minister benoemd voor een periode van vier jaren en zijn terstond
      herbenoembaar.

      2 De voorzitter en de twee plaatsvervangende voorzitters zijn personen

      a. aan wie op grond van het afsluitend examen van een opleiding in het wetenschappelijk
      onderwijs door een universiteit dan wel de Open Universiteit, waarop de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] betrekking heeft, de graad van Bachelor op het
      gebied van het recht en tevens de graad van Master op het gebied van het recht is verleend, of

      b. die op grond van het afsluitend examen van een opleiding op het gebied van het recht aan een universiteit dan
      wel de Open Universiteit, waarop de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2] betrekking
      heeft, het recht hebben verkregen om de titel meester te voeren.

      3 Vier leden en vier plaatsvervangende leden hebben gedurende de aan hun benoeming voorafgaande periode van
      tien jaren ten minste vijf jaren als kapitein of als scheepsofficier aan boord van een ander schip dan een
      vissersvaartuig gevaren.

      4 Vier leden en vier plaatsvervangende leden hebben gedurende de aan hun benoeming voorafgaande periode van tien
      jaren ten minste vijf jaren als schipper of als scheepsofficier aan boord van een vissersvaartuig gevaren.

      5 Voorts worden als plaatsvervangend lid benoemd:

      a. twee reders;

      b. twee waterbouwkundigen;

      c. twee registerloodsen;

      d. twee hydrografen.

      6 Onze Minister verleent aan de voorzitter, de plaatsvervangende voorzitters, de leden en de plaatsvervangende
      leden in elk geval ontslag met ingang van de maand, volgende op die waarin zij de leeftijd van zeventig jaren
      hebben bereikt, en op eigen verzoek tussentijds.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel55b
