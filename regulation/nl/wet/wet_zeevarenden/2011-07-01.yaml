  - number: '35'
    text: |-
      De bemanningsleden, bedoeld in [artikel 33, tweede lid][ref1], zijn in het bezit van een geldig monsterboekje of
      een voorlopig monsterboekje, waaruit de gegevens, die op de monsterrol worden vermeld, worden overgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel33
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '36'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot

      a. het monsterboekje of het voorlopig monsterboekje, alsmede de afgifte ervan;

      b. de in het monsterboekje en het voorlopig monsterboekje op te nemen gegevens, en

      c. de gegevens die anderen dan de kapitein in het monsterboekje of het voorlopig monsterboekje mogen aantekenen.
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel36
  - number: '37'
    text: |-
      1 Een monsterboekje is tot tien jaar na de datum van afgifte geldig.

      2 Een voorlopig monsterboekje is tot 3 maanden na de datum van afgifte geldig.
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel37
  - number: '38'
    text: |-
      1 De kapitein tekent van een bemanningslid in het monsterboekje aan:

      a. de dag van aanmonstering;

      b. de dag van afmonstering;

      c. de functie waarin het bemanningslid heeft dienst gedaan, en

      d. de naam en de roepletters van het schip.

      2 In het monsterboekje wordt het loon noch enige gedragsbeoordeling opgenomen.
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel38
  - number: '39'
    text: |-
      1 Indien het bemanningslid van mening is, dat de kapitein of de ander, bedoeld in
      [artikel 36, aanhef en onderdeel c][ref1], in zijn monsterboekje vermeldingen in strijd met [artikel 38][ref2]
      heeft gedaan of nagelaten, kan hij daarover een klacht indienen bij Onze Minister. Deze beslist, zo nodig na
      verhoor of behoorlijke oproeping van belanghebbenden, en brengt de door hem nodig geachte verbetering in het boekje
      aan.

      2 De bevoegdheid van het bemanningslid tot het indienen van een klacht als bedoeld in het eerste lid vervalt
      door verloop van vier weken na de dag van afmonstering in een Nederlandse haven en van zes maanden na de dag van
      afmonstering buiten Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel38
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel39
