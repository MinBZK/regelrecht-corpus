  - number: '40'
    text: |-
      1 Elk bemanningslid is in het bezit van een of meer van de in het tweede lid genoemde geldige geneeskundige
      verklaringen van geschiktheid voor de zeevaart, waaruit blijkt dat hij is gekeurd door een geneeskundige of medisch
      specialist die door Onze Minister daartoe is aangewezen, en dat hij voldoet aan de eisen van medische geschiktheid,
      vastgesteld krachtens [artikel 19, eerste lid, aanhef en onderdeel a, ten 3][ref1].

      2 De in het eerste lid bedoelde geneeskundige verklaringen van geschiktheid voor de zeevaart zijn de geneeskundige
      verklaringen:

      a. betreffende de algemene lichamelijke geschiktheid;

      b. betreffende het gezichtsorgaan, en

      c. betreffende het gehoororgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel19
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 40a
    text: |-
      Een geneeskundige verklaring waaruit blijkt dat een bemanningslid is gekeurd en medisch geschikt bevonden voor
      de zeevaart door een geneeskundige of medisch specialist die door de bevoegde autoriteit van een andere lidstaat
      van de Europese Unie, een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische
      Ruimte of Zwitserland daartoe is aangewezen, wordt gelijkgesteld met een geneeskundige verklaring als bedoeld in
      [artikel 40, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel40
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '40'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '41'
    text: |-
      De geneeskundige verklaringen van geschiktheid voor de zeevaart, bedoeld in [artikel 40, eerste lid][ref1], worden
      bij aanmonstering overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel40
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '40'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '42'
    text: |-
      1 Indien de geneeskundige of medisch specialist na de keuring weigert aan de gekeurde de vereiste geneeskundige
      verklaring van geschiktheid voor de zeevaart af te geven, heeft de gekeurde het recht zich nogmaals te laten keuren
      door een door Onze Minister als scheidsrechter aangewezen geneeskundige of medisch specialist.

      2 Het oordeel van de als scheidsrechter aangewezen geneeskundige of medisch specialist is bindend.

      3 De gekeurde, aan wie geweigerd is een geneeskundige verklaring van geschiktheid voor de zeevaart af te geven,
      heeft het recht zich opnieuw door een scheidsrechter te laten onderzoeken, indien er medische gronden zijn om te
      veronderstellen dat de reden voor de eerdere afkeuring is vervallen.

      4 De gekeurde die tijdens het onderzoek heeft meegedeeld dat hij van mening is dat hij op medische gronden
      ongeschikt voor de zeevaart moet worden bevonden, heeft het recht zich door een scheidsrechter te laten
      onderzoeken, indien de keurende geneeskundige of medische specialist geen bezwaren heeft geconstateerd tegen
      afgifte aan hem van een geneeskundige verklaring van geschiktheid voor de zeevaart.
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel42
  - number: '43'
    text: |-
      1 De geneeskundige verklaring van geschiktheid voor de zeevaart, afgegeven door een geneeskundige of medisch
      specialist die niet ingevolge [artikel 42][ref1] als scheidsrechter is aangewezen, nadat een andere geneeskundige
      of medisch specialist de afgifte van een geneeskundige verklaring van geschiktheid voor de zeevaart heeft
      geweigerd, is ongeldig.

      2 Indien uit een volgende keuring blijkt dat de gekeurde niet aan de gestelde eisen van medische geschiktheid
      voldoet, vervalt de geldigheid van de desbetreffende, eerder afgegeven, verklaring van geschiktheid voor de
      zeevaart.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel42
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '44'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot

      a. de medische keuring, bedoeld in [artikel 40, eerste lid][ref1];

      b. de herkeuring door als scheidsrechters aangewezen geneeskundigen of medisch specialisten;

      c. de aanwijzing van geneeskundigen, medisch specialisten en scheidsrechters, alsmede de intrekking van deze
      aanwijzing;

      d. de geldigheidsduur van de geneeskundige verklaringen van geschiktheid voor de zeevaart.

      2 Onze Minister kan voor een bepaalde periode van de verplichting te voldoen aan de geldende medische normen
      ontheffing verlenen, indien een als scheidsrechter aangewezen geneeskundige of medisch specialist daartoe
      gemotiveerd adviseert.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel40
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '40'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '45'
    text: |-
      Indien korte tijd voor vertrek van een schip de bemanning moet worden aangevuld, kan, indien dringende
      omstandigheden nopen tot het aanmonsteren van personen die niet in het bezit zijn van een of meer geldige
      geneeskundige verklaringen van geschiktheid voor de zeevaart, door Onze Minister ontheffing worden verleend van de
      in [artikel 40, eerste lid][ref1], bedoelde verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel40
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '40'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '46'
    text: |-
      Indien de monsterrol moet worden opgemaakt of aangevuld in een haven buiten Nederland, waar geen geneeskundigen
      of medisch specialisten als bedoeld in [artikel 40, eerste lid][ref1], aanwezig zijn, wordt ten aanzien van de
      geneeskundige verklaringen van geschiktheid voor de zeevaart het ter plaatse geldende gebruik gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel40
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '40'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '47'
    text: |-
      In de gevallen, bedoeld in [de artikelen 45][ref1] en [46][ref2], wordt bij de eerste gelegenheid een medische
      keuring door een geneeskundige of medisch specialist als bedoeld in [artikel 40, eerste lid][ref3], verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0009124#Artikel40
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: '46'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009124
        artikel: '40'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '48'
    text: |-
      1 Bij ministeriële regeling kan worden bepaald dat bijzondere categorieën opvarenden in het bezit moeten zijn van
      een geldige geneeskundige verklaring van geschiktheid voor de zeevaart.

      2 Bij ministeriële regeling kan worden bepaald dat bemanningsleden op bepaalde schepen vrijgesteld zijn van
      onderdelen van de medische keuring.
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel48
  - number: '49'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de ambtenaren van de
      Inspectie Verkeer en Waterstaat, alsmede de bij besluit van Onze Minister aangewezen ambtenaren of andere personen.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel49
  - number: '50'
    text: |-
      De in [artikel 49, eerste lid][ref1], bedoelde toezichthouder is bevoegd ter uitoefening van zijn bevoegdheden
      ingevolge deze wet elke plaats te betreden, met inbegrip van woongedeelten van schepen.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel49
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '49'
        hoofdstuk: '5'
  - number: '51'
    text: |-
      1 De in [artikel 49, eerste lid][ref1], bedoelde toezichthouder is bevoegd zaken en schepen te onderzoeken
      met betrekking waartoe hij een toezichthoudende taak heeft. Deze bevoegdheid strekt zich uit tot de in
      [artikel 50][ref2] bedoelde plaatsen.

      2 Hij is bevoegd met het oog op de uitoefening van deze bevoegdheden, in geval van gegrond vermoeden dat in strijd
      wordt gehandeld met enige verplichting ingevolge deze wet, van de kapitein van een schip te vorderen dat deze het
      schip gaande houdt dan wel naar een door hem aangewezen veilige ligplaats of ankerplaats brengt.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel50
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '49'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: '50'
        hoofdstuk: '5'
  - number: '52'
    text: |-
      1 Een ambtenaar van de Inspectie Verkeer en Waterstaat is bevoegd een schip aan te houden, indien er voorafgaand
      aan het vertrek naar zee

      a. geen bemanningscertificaat voor het schip is afgegeven of het bemanningscertificaat ongeldig is;

      b. de door hem aangetroffen bemanning niet ten minste in overeenstemming is met het bemanningscertificaat; of

      c. van het schip kennelijk een ander gebruik wordt of zal worden gemaakt dan overeenkomstig de beperkingen of
      voorwaarden vermeld in het bemanningscertificaat.

      2 De ambtenaar van de Inspectie Verkeer en Waterstaat is eveneens bevoegd een
      schip aan te houden, indien de toezichthouder dan wel de inspecteur, bedoeld in
      [artikel 1:3, eerste lid, onderdeel c, van de Algemene douanewet][ref1] de toegang tot het schip wordt geweigerd of
      indien geen medewerking aan diens onderzoek wordt gegeven.

      3 De aanhouding wordt opgeheven, zodra de reden voor de aanhouding is komen te vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel13
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: 1:3
  - number: '53'
    text: |-
      1 De ambtenaar van de Inspectie Verkeer en Waterstaat stelt Onze Minister onverwijld in kennis van de aanhouding en
      van de redenen voor de aanhouding.

      2 Van een besluit tot aanhouding van een schip of tot opheffing van de aanhouding wordt voorts de betrokken
      ambtenaar van de rijksbelastingdienst, bevoegd inzake douane, in kennis gesteld.

      3 De in het tweede lid bedoelde ambtenaar verleent geen expeditie voor het betrokken schip indien hij een
      mededeling van aanhouding heeft ontvangen en zolang hij geen mededeling van opheffing heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel53
  - number: '54'
    text: Onze Minister kan de aan de toezichthouder toekomende bevoegdheden beperken.
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel54
  - number: '55'
    text: |-
      Met het opsporen van feiten, die bij of krachtens deze wet strafbaar zijn gesteld, zijn belast:

      a. de bij of krachtens [artikel 141 Wetboek van Strafvordering][ref1] aangewezen personen;

      b. de ambtenaren van de Inspectie Verkeer en Waterstaat.


