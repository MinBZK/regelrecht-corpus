  - number: 55q
    text: |-
      1 De beslissing van het tuchtcollege berust op een deugdelijke motivering. Zij wordt in een openbare zitting
      uitgesproken. Indien de betrokken kapitein of scheepsofficier niet ter zitting is verschenen, kan het tuchtcollege
      bij verstek uitspraak doen.

      2 De secretaris zendt onverwijld een afschrift van de schriftelijke beslissing van het tuchtcollege:

      a. bij aangetekende brief aan de betrokken kapitein of scheepsofficier;

      b. bij gewone brief aan Onze Minister;

      c. bij gewone brief aan de klager.

      3 Indien het tuchtcollege in zijn uitspraak een schorsing van de vaarbevoegdheid heeft opgelegd, deelt de
      secretaris in zijn aangetekende brief aan de betrokken kapitein of scheepsofficier mede: de datum waarop
      de schorsing ingaat, de verplichting om zijn vaarbevoegdheidsbewijs vóór die datum in te leveren bij het in
      [artikel 65][ref1] genoemde Centraal register bemanningsgegevens, alsmede de gevolgen van het niet tijdig inleveren
      van het vaarbevoegdheidsbewijs op grond van het vierde lid. De secretaris zendt een afschrift van de schriftelijke
      beslissing van het tuchtcollege alsmede van de aangetekende brief aan de betrokken kapitein of scheepsofficier
      tevens ter registratie aan het Centraal register bemanningsgegevens.

      4 Indien de betrokken kapitein of scheepsofficier zijn vaarbevoegdheidsbewijs niet tijdig bij het Centraal register
      bemanningsgegevens inlevert, wordt de periode van schorsing van de vaarbevoegdheid van rechtswege verlengd met de
      termijn die is verstreken tussen de datum waarop de schorsing ingaat en de datum waarop het vaarbevoegdheidsbewijs
      daadwerkelijk is ingeleverd.

      5 Zodra de periode van schorsing is verstreken geeft het Centraal register bemanningsgegevens het
      vaarbevoegdheidsbewijs terug aan de betrokken kapitein of scheepsofficier.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel65
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel55q
