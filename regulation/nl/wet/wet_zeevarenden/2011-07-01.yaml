  - number: '26'
    text: De kapitein van een vissersvaartuig heeft de titel van schipper.
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel26
  - number: '27'
    text: |-
      1 De kapitein is belast met de handhaving van de openbare orde aan boord en oefent aan boord over alle opvarenden
      gezag uit.

      2 De kapitein belast een bemanningslid niet met werkzaamheden aan boord, waarvoor een vaarbevoegdheid of
      beroepskwalificatie vereist is, indien dat bemanningslid niet blijkens zijn geldige vaarbevoegdheidsbewijs of,
      indien dat is toegestaan, blijkens een document als bedoeld in [artikel 21][ref1] bevoegd is die werkzaamheden aan
      boord te verrichten.

      3 De opvarenden zijn verplicht de bevelen van de kapitein na te komen die door de kapitein worden gegeven in het
      belang der veiligheid of tot handhaving van de orde, met inbegrip van de openbare orde.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel21
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '28'
    text: |-
      De kapitein oefent zijn gezag uit zodra hij aan boord is en het gezag heeft aanvaard of overgenomen, en zolang hij
      het gezag niet heeft overgedragen of de scheepsbeheerder hem het gezag niet heeft ontnomen.
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel28
  - number: '29'
    text: |-
      1 Op Nederlandse schepen worden alleen personen als kapitein aangesteld die de nationaliteit bezitten van:

      a. het Koninkrijk der Nederlanden, dan wel

      b. van een andere staat, doch uitsluitend indien zij ingevolge [artikel 30][ref1] zijn vrijgesteld van de in de
      aanhef en onderdeel a genoemde eis.

      2 Bij ministeriële regeling kan, onder het stellen van voorwaarden of beperkingen, ten behoeve van
      vissersvaartuigen vrijstelling worden verleend van het in het eerste lid bedoelde vereiste.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel30
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '30'
        hoofdstuk: '3'
  - number: '30'
    text: |-
      1 Personen die de nationaliteit bezitten van een van de lidstaten van de Europese Unie of van een van de overige
      staten die partij zijn bij de Overeenkomst inzake de Europese Economische Ruimte, zijn vrijgesteld van de
      nationaliteitseis, bedoeld in [artikel 29, eerste lid, aanhef en onder a][ref1], voor het dienstdoen op Nederlandse
      schepen die geen vissersvaartuig zijn.

      2 Aan personen die de nationaliteit bezitten van een andere staat kan bij regeling van Onze Minister vrijstelling
      worden verleend van de nationaliteitseis, bedoeld in [artikel 29, eerste lid, aanhef en onder a][ref2], voor het
      dienstdoen op Nederlandse schepen die geen vissersvaartuig zijn, mits het betreft:

      a. staten waarmee, ingevolge een daartoe strekkend besluit van de Raad van de Europese Unie,
      toetredingsonderhandelingen gaande zijn en die voorkomen op een lijst die bij regeling van Onze Minister wordt
      vastgesteld, of

      b. een staat die niet behoort tot een van de staten, bedoeld onder a.

      3 De vrijstelling, bedoeld in het tweede lid, kan slechts worden verleend indien:

      a. het Koninkrijk der Nederlanden voor Nederland met die staat een schriftelijke afspraak heeft gemaakt voor
      de erkenning van vaarbevoegdheidsbewijzen als bedoeld in Voorschrift I/10 van de Bijlage van het op 7 juli 1978
      te Londen tot stand gekomen Internationale Verdrag betreffende de normen voor zeevarenden inzake opleiding,
      diplomering en wachtdienst, 1978 (Trb. 1981, 144), en

      b. de erkenningsprocedure, opgenomen in artikel 19 van de bemanningsrichtlijn, is voltooid.

      4 Aan de vrijstelling, bedoeld in het tweede lid, kunnen beperkingen of nadere voorschriften worden verbonden.

      5 Door werkgevers- en werknemersorganisaties in de sector koopvaardij, respectievelijk de sector zeegaande
      waterbouw wordt, ter regulering van de arbeidsmarkt voor kapiteins met de Nederlandse nationaliteit,
      respectievelijk die van een staat als bedoeld in het eerste lid, voor hun sector een privaatrechtelijke regeling
      vastgesteld omtrent afgifte aan een scheepsbeheerder van een schriftelijke toestemming tot het aanstellen van een
      persoon met een andere nationaliteit in de functie van kapitein.

      6 Elk der regelingen, bedoeld in het vijfde lid, bevat bepalingen ten aanzien van de afgifte, respectievelijk de
      weigering van een verklaring als bedoeld in het vijfde lid, door een paritair samengestelde commissie, bestaande
      uit vertegenwoordigers van de werkgevers- en werknemersorganisaties in de sector koopvaardij, respectievelijk de
      sector zeegaande waterbouw.

      7 De regeling als bedoeld in het vijfde lid, bevat daarnaast in elk geval:

      a. een klachtenprocedure ten behoeve van eerste stuurlieden, respectievelijk eerste maritieme officieren die naar
      hun oordeel op onjuiste gronden niet zijn aangesteld in de functie van kapitein op een Nederlands schip;

      b. de vaststelling van de werkzaamheden van de commissie, bedoeld in het zesde lid, en

      c. de wijze van verkrijging van betrouwbare en zo volledig mogelijke informatie als omschreven in het achtste lid,
      welke jaarlijks vóór 1 april aan Onze Minister dient te worden verstrekt.

      8 De informatie, bedoeld in het zevende lid, onder c, omvat:

      a. het aantal zeevarenden op de Nederlandse vloot, gerangschikt naar functie, leeftijd en nationaliteit;

      b. het aantal Nederlandse officieren dat in het verstreken jaar voor het eerst, anders dan als stagiair, is
      gemonsterd op Nederlandse zeeschepen;

      c. het aantal beschikbare stageplaatsen;

      d. het aantal Nederlandse studenten dat als stagiair is geplaatst, en

      e. het aantal buitenlandse studenten dat als stagiair is geplaatst, alsmede de nationaliteit van deze stagiairs.

      9 Voorafgaand aan de vaststelling van een regeling als bedoeld in het tweede lid pleegt Onze Minister overleg over
      het ontwerp van een regeling met de werkgevers- en werknemersorganisaties in de sector koopvaardij, respectievelijk
      de sector zeegaande waterbouw.

      10 Bij regeling van Onze Minister worden regels gesteld met betrekking tot de vrijstelling van de eisen neergelegd
      in [artikel 29, eerste lid][ref3], voor de gevallen waarin de privaatrechtelijke regeling, bedoeld in het vijfde
      lid, niet binnen drie maanden na de inwerkingtreding van dat vijfde lid tot stand is gekomen, dan wel vervallen is
      zonder dat door de werkgevers- en werknemersorganisaties in de desbetreffende sector is voorzien in vervanging van
      die regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0009124#Artikel29
