  - number: '82'
    text: |-
      Na de inwerkingtreding van deze wet berusten de volgende algemene maatregelen van bestuur en ministeriële
      regelingen op [de artikelen 19, eerste lid][ref1], en [77][ref2] van deze wet:

      a. Examenbesluit zeevaartdiploma’s 1991;

      b. [Examenreglement zeevisvaart][ref3];

      c. Regeling normen ter bepaling uitslag zeevisvaartexamens;

      d. [Diensttijdreglement zeevisvaart][ref4];

      e. Besluit zeevaartdiploma’s experimenterend hoger nautisch onderwijs;

      f. Besluit bijzondere verkrijging diploma’s kleine handelsvaart;

      g. [Besluit bijzondere verkrijging voorlopig diploma als scheepswerktuigkundige][ref5];

      h. [Besluit bijzondere verkrijging diploma A als scheepswerktuigkundige][ref6].


