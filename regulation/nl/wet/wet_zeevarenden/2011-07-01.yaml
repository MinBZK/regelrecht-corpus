  - number: '13'
    text: |-
      Onze Minister trekt het bemanningscertificaat in, indien is gebleken dat

      a. het bemanningsplan onjuiste of onvolledige gegevens bevat, zodanig dat op grond van de juiste of volledige
      gegevens dit bemanningscertificaat niet zou zijn afgegeven, dan wel

      b. het schip in strijd met de gegevens in het bemanningscertificaat wordt gebruikt en dit afwijkende gebruik naar
      zijn redelijk oordeel een andere bemanningssamenstelling noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel13
  - number: '14'
    text: |-
      1 Onverminderd [artikel 8, vijfde lid][ref1], geeft Onze Minister voor het schip ambtshalve een nieuw
      bemanningscertificaat af voor een andere bemanningssamenstelling dan waarmee het schip op grond van het laatst
      afgegeven bemanningscertificaat is bemand, indien hem is gebleken dat het voldoen aan de eisen, gesteld in
      [artikel 8, tweede lid][ref2], met dat certificaat niet langer gewaarborgd is.

      2 In het geval, bedoeld in het eerste lid, nodigt Onze Minister de scheepsbeheerder uit een nieuw bemanningsplan in
      te dienen.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel8
