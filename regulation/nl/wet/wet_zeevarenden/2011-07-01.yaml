  - number: '78'
    text: |-
      1 Een wijziging van de bemanningsrichtlijn gaat voor de toepassing van deze wet gelden met ingang van de dag waarop
      aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de
      Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.

      2 Bij ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, kunnen de benaming van de
      bemanningsrichtlijn en de verwijzing naar onderdelen daarvan worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel78
  - number: '79'
    text: |-
      1

      2 Onverminderd het bepaalde in [artikel 82][ref1] wordt de Wet op de zeevaartdiploma’s ingetrokken.

      3 Onverminderd het bepaalde in [artikel 82][ref2] wordt de Wet op de Zeevischvaartdiploma's, Stb. 1935, 455,
      ingetrokken.

      4 Het Besluit van 12 september 1942, houdende gelijkstelling van diploma’s voor stuurlieden en machinisten (Stb. C
