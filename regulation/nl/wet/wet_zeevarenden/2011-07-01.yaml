      - id: ref1
        bwb_id: BWBR0009124
        artikel: '68'
        hoofdstuk: '7'
        paragraaf: '7'
  - number: '70'
    text: |-
      1 De verklaringen van geschiktheid en bekwaamheid, die op grond van
      [Hoofdstuk VII van het Schepenbesluit 1965][ref1] zijn afgegeven voor de datum van inwerkingtreding van deze wet,
      behouden hun geldigheid overeenkomstig de daarop aangegeven einddatum.

      2 Verklaringen van geschiktheid en bekwaamheid, waarop geen einddatum is vermeld, zijn geldig tot de eerste dag van
      de maand volgend op het bereiken van het 65ste jaar van de houder.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#HoofdstukVII
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0002501
        hoofdstuk: VII
  - number: '71'
    text: |-
      1 Bij algemene maatregel van bestuur wordt bepaald op welke vaarbevoegdheidsbewijzen, bedoeld in
      [hoofdstuk 2, paragraaf 3][ref1], van deze wet, de houder van een geldige Nederlandse verklaring van geschiktheid
      en bekwaamheid, van een zeevaartdiploma of een diploma voor de zeevisvaart aanspraak heeft.

      2 De vaarbevoegdheden, bedoeld in het eerste lid, zijn ten minste gelijkwaardig aan de bevoegdheid ingevolge
      de verklaring van geschiktheid en bekwaamheid die, of het diploma voor de zeevisvaart dat voor vervanging in
      aanmerking komt.

      3 Onder de zeevaartdiploma's, bedoeld in het eerste lid, worden mede verstaan de diploma's, voor inwerkingtreding
      van deze wet verkregen op grond van het Besluit van 3 april 1941 (Stb. B 32), houdende bepalingen betreffende
      gelijkstelling van de Zeevaartdiploma’s uitgereikt door of vanwege den Gouverneur van Curaçao met de diploma’s
      uitgereikt door de commissie ingesteld ingevolge de Wet op de Zeevaartdiploma’s (Staatsblad 1935 No. 456), alsmede
      de diploma's, voor inwerkingtreding van deze wet verkregen op grond van het Besluit van 12 september 1942 (Stb. C
      55), houdende gelijkstelling van diploma’s voor stuurlieden en machinisten.

      4 Bij de in het eerste lid bedoelde algemene maatregel van bestuur kunnen aanvullende beroepsvereisten worden
      gesteld waaraan de houder van een van de diploma's, genoemd in [artikel 76][ref2] moet voldoen alvorens hij in
      aanmerking komt voor de afgifte van het daarbij genoemde vaarbevoegdheidsbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel76
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0009124
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: '76'
        hoofdstuk: '8'
  - number: '72'
    text: |-
      De documenten, houdende de minimum voorgeschreven bemanningssamenstelling met de functies van de bemanningsleden,
      die zijn afgegeven voor inwerkingtreding van deze wet, behouden hun geldigheid overeenkomstig de einddatum van het
      certificaat van deugdelijkheid waar zij bij behoren.
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel72
  - number: '73'
    text: |-
      Scheepsbeheerders van schepen, die zijn bemand overeenkomstig de modellen van het Besluit zeevaartdiploma’s
      en [Hoofdstuk VII van het Schepenbesluit 1965][ref1] of het [Bemanningseisenbesluit][ref2], waarvan de
      bemanningssamenstelling niet wordt gewijzigd na inwerkingtreding van deze wet, kunnen een beperkt bemanningsplan
      indienen bij de aanvraag van het eerste bemanningscertificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#HoofdstukVII
      [ref2]: https://wetten.overheid.nl/BWBR0005266
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0002501
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0005266
  - number: '74'
    text: |-
      De geneeskundige verklaringen van geschiktheid voor de zeevaart, die zijn afgegeven voor inwerkingtreding van deze
      wet, behouden hun geldigheid overeenkomstig de daarop aangegeven einddatum.
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel74
  - number: '75'
    text: |-
      Op aanvragen voor bemanningsdocumenten, verklaringen van geschiktheid en bekwaamheid, monsterboekjes en
      geneeskundige verklaringen voor de zeevaart, die zijn ingediend voor het tijdstip van inwerkingtreding van deze
      wet en op dat tijdstip nog in behandeling zijn, wordt besloten met inachtneming van het bepaalde bij of krachtens
      deze wet.
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel75
  - number: '76'
    text: |-
      1 Tot 1 februari 2002 kan examen worden afgelegd ter verkrijging van het diploma

        - als eerste stuurman voor de grote handelsvaart;
        - als tweede stuurman voor de grote handelsvaart;
        - als derde stuurman voor de grote handelsvaart;
        - als stuurman voor de kleine handelsvaart en het aanvullingsdiploma als stuurman voor de kleine handelsvaart;
        - C als scheepswerktuigkundige;
        - B als scheepswerktuigkundige;
        - A als scheepswerktuigkundige;
        - als motordrijver;
        - voor de zeevisvaart SW VI;
        - voor de zeevisvaart SW V;
        - voor de zeevisvaart S IV-v;
        - voor de zeevisvaart W IV-v.

      2 Tot 1 februari 2007 worden aan houders van een verklaring dat het desbetreffende examen met goed gevolg werd
      afgelegd de in het eerste lid genoemde diploma’s afgegeven, alsmede de diploma’s

        - als stuurman voor de grote sleepvaart;
        - het voorlopig diploma als scheepswerktuigkundige;
        - als assistent scheepswerktuigkundige.

      3 Bij ministeriële regeling worden met inachtneming van de in het eerste lid genoemde einddatum, de tijdstippen
      bepaald waarop de respectievelijke in dat lid genoemde examens voor de laatste maal worden afgenomen.

      4 Met betrekking tot de in dit artikel genoemde examens en de afgifte van diploma’s zijn van toepassing:

      a. het Examenbesluit zeevaartdiploma’s 1991;

      b. het [Examenreglement zeevisvaart][ref1];

      c. het Besluit zeevaartdiploma’s experimenterend hoger nautisch onderwijs;

      d. het Besluit bijzondere verkrijging diploma’s kleine handelsvaart;

      e. het [Besluit bijzondere verkrijging voorlopig diploma als scheepswerktuigkundige][ref2], of

      f. het [Besluit bijzondere verkrijging diploma A als scheepswerktuigkundige][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003996
      [ref2]: https://wetten.overheid.nl/BWBR0003611
      [ref3]: https://wetten.overheid.nl/BWBR0004216
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0003996
      - id: ref2
        bwb_id: BWBR0003611
      - id: ref3
        bwb_id: BWBR0004216
  - number: '77'
    text: |-
      Bij algemene maatregel van bestuur worden de beroepsvereisten bepaald voor de functies, tot welke de in
      [artikel 76, eerste lid][ref1], genoemde diploma’s toegang verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel76
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '76'
        hoofdstuk: '8'
  - number: 77a
    text: |-
      Ten aanzien van beroepen waarvoor de vaarbevoegdheden, genoemd in
      [artikel 18, tweede lid, onderdelen a, b, c en e][ref1], geldig zijn, behouden verklaringen als bedoeld in
      [artikel 22, derde lid][ref2], zoals dat luidde voor 20 oktober 2007, hun geldigheid overeenkomstig de daarop
      aangegeven einddatum.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel22
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel77a
