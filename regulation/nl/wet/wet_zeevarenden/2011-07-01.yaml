  - number: '61'
    text: |-
      Tegen een op grond van deze wet genomen besluit van een ambtenaar van de Inspectie Verkeer en Waterstaat tot
      aanhouding van een schip, kan iedere belanghebbende beroep instellen bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel61
  - number: '62'
    text: |-
      Bij ministeriële regeling worden de tarieven vastgesteld voor

      a. de afgifte van bemanningscertificaten;

      b. de beoordeling van een bemanningsplan;

      c. de afgifte, vervanging of vernieuwing van vaarbevoegdheidsbewijzen;

      d. de afgifte of vervanging van een monsterboekje of een voorlopig monsterboekje;

      e. het afnemen van examens, aanvullende examens en toetsen;

      f. het verlenen van ontheffingen;

      g. vergoedingen van gecommitteerden en deskundigen;

      h. de afgifte, vervanging of vernieuwing van bijzondere documenten, bedoeld in [artikel 21][ref1];

      i. de afgifte van diploma's, getuigschriften en verklaringen; en

      j. de behandeling van een aanvraag voor de erkenning van een opleiding als bedoeld in
      [artikel 19, tweede lid, onder b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel19
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel62
    references:
