  - number: 55l
    text: |-
      1 De voorzitter en de leden, alsmede hun plaatsvervangers, kunnen zich verschonen en kunnen worden gewraakt indien
      er te hunnen aanzien feiten of omstandigheden bestaan, waardoor de onpartijdigheid van het tuchtcollege schade zou
      kunnen lijden.

      2 De overige leden van het tuchtcollege beslissen zo spoedig mogelijk over een verzoek tot verschoning of wraking
      van hun medelid. Bij staking van stemmen wordt het verzoek tot verschoning of wraking toegewezen.
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel55l
  - number: 55m
    text: |-
      1 Zodra het tuchtcollege een verzoek of een klacht in behandeling heeft genomen, zendt de secretaris een afschrift
      van het verzoek of van de klacht aan de betrokken kapitein of scheepsofficier.

      2 Wanneer het tuchtcollege uit eigen beweging een tuchtzaak aanhangig maakt, deelt de secretaris dit schriftelijk
      mede aan de betrokken kapitein of scheepsofficier onder vermelding van de gewraakte gedraging en van de bezwaren
      die tegen deze gedraging zijn gerezen.

      3 De betrokken kapitein of scheepsofficier kan binnen zes weken na de dag van verzending van het afschrift van het
      verzoek of van de klacht, als bedoeld in het eerste lid, of van de schriftelijke mededeling, als bedoeld in het
      tweede lid, schriftelijk of elektronisch een verweerschrift indienen. De voorzitter kan deze termijn op verzoek van
      de betrokken kapitein of scheepsofficier verlengen.

      4 De secretaris zendt een afschrift van het verweerschrift aan degene die het verzoek of de klacht bij de
      voorzitter heeft ingediend.
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel55m
  - number: 55n
    text: |-
      1 De voorzitter bepaalt het tijdstip voor de mondelinge behandeling van de zaak ter zitting. De secretaris roept
      degene die het verzoek of de klacht heeft ingediend en de betrokken kapitein of scheepsofficier ten minste twee
      weken van tevoren bij aangetekende brief op voor de zitting. De betrokken kapitein of scheepsofficier is verplicht
      aan de oproeping gevolg te geven.

      2 Indien de betrokken kapitein of scheepsofficier op de oproeping niet ter zitting verschijnt, kan het tuchtcollege
      de officier van justitie verzoeken de betrokkene te dagvaarden. Hij is verplicht na dagvaarding te verschijnen.

      3 Indien de betrokken kapitein of scheepsofficier op de dagvaarding niet ter zitting verschijnt, kan het
      tuchtcollege de officier van justitie verzoeken de betrokkene te dagvaarden, met bevel tot medebrenging.
      [Artikel 556 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.

      4 Degene die het verzoek of de klacht heeft ingediend kan zich ter zitting door een daartoe gemachtigde doen
      vertegenwoordigen of zich door een raadsman doen bijstaan.

      5 De betrokken kapitein of scheepsofficier kan zich door een raadsman doen bijstaan.

      6 Het tuchtcollege kan weigeren bepaalde personen die geen advocaat zijn, als raadsman of als gemachtigde ter
      zitting toe te laten. Bij een zodanige weigering houdt het tuchtcollege de zaak tot een volgende zitting aan.

      7 Het tuchtcollege stelt de betrokken kapitein of scheepsofficier en zijn raadsman ten minste twee weken voor de
      zitting in de gelegenheid om van alle op de zaak betrekking hebbende stukken kennis te nemen.

      8 Het tuchtcollege behandelt de zaak in een openbare zitting. Het tuchtcollege kan om gewichtige redenen bepalen
      dat de behandeling geheel of gedeeltelijk met gesloten deuren zal plaats vinden.

      9 De secretaris maakt van het verhandelde ter zitting een proces-verbaal op dat door de voorzitter en de secretaris
      wordt ondertekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel556
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel55n
