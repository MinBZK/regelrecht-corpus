  - number: '20'
    text: |-
      1 Onze Minister besluit tot afgifte van een vaarbevoegdheidsbewijs wanneer de aanvrager voldoet aan de eisen,
      bedoeld in [artikel 19, eerste lid, aanhef en onderdeel a, ten 1°, ten 2° en ten 3°][ref1].

      2 Bij ministeriële regeling wordt bepaald welke bescheiden worden overgelegd bij de aanvraag van een
      vaarbevoegdheidsbewijs.

      3 Onze Minister vergewist zich ervan dat een persoon de Nederlandse nationaliteit bezit, dan wel de nationaliteit
      van een van de staten, bedoeld in [artikel 30][ref2], alvorens aan deze een van de vaarbevoegdheden als kapitein,
      onderscheidenlijk schipper, af te geven die zijn genoemd in [artikel 18, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel30
