  - number: '25'
    text: |-
      1 Onze Minister kan ten aanzien van een bemanningslid, met inachtneming van bij algemene maatregel van
      bestuur te stellen regels, voor een bepaald schip, en voor een periode van ten hoogste zes maanden, ontheffing
      verlenen van de in [artikel 18, eerste lid][ref1], bedoelde verplichting om in het bezit te zijn van een geldig
      vaarbevoegdheidsbewijs.

      2 Onze Minister kan aan de houder van een vaarbevoegdheid, geldig op kleine schepen, ontheffing geven
      van de in [artikel 18, eerste lid][ref2], bedoelde verplichting om in het bezit te zijn van een geldig
      vaarbevoegdheidsbewijs, voorzover die bevoegdheid wordt gebruikt aan boord van een schip, dat als gevolg van een
      verbouwing niet meer als klein schip is aan te merken, indien wordt voldaan aan de volgende voorwaarden:

      a. de ontheffing geldt voor de duur van de opleiding van de houder ten behoeve van een bevoegdheid geldig op alle
      schepen, met een maximum van twee jaren, en

      b. de houder heeft in de vijf jaren, voorafgaand aan de aanvraag, twee jaren aan boord van dit schip, of aan boord
      van een naar het oordeel van Onze Minister identiek schip, dienst gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel18
