        artikel: '556'
  - number: 55o
    text: |-
      1 Het tuchtcollege kan getuigen en deskundigen voor de zitting oproepen en horen. De leden en de buitengewone leden
      van de Onderzoeksraad voor veiligheid, de algemeen secretaris en de medewerkers van het bureau van de raad, alsmede
      de door Onze Minister wie het aangaat op verzoek van de raad aangewezen deskundigen kunnen door het tuchtcollege
      niet als getuige of deskundige worden opgeroepen.

      2 De secretaris roept getuigen en deskundigen bij aangetekende brief voor de zitting op. Ieder die als getuige of
      deskundige door het tuchtcollege is opgeroepen, is verplicht aan die oproeping gevolg te geven.

      3 Indien een getuige of deskundige op de oproeping niet ter zitting verschijnt, doet de officier van justitie hem
      op verzoek van het tuchtcollege dagvaarden. Hij is verplicht na dagvaarding te verschijnen.

      4 Indien een getuige of deskundige op de dagvaarding niet ter zitting verschijnt, doet de officier
      van justitie hem op verzoek van het tuchtcollege andermaal dagvaarden, met bevel tot medebrenging.
      [Artikel 556 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.

      5 De voorzitter beëdigt getuigen om de gehele waarheid en niets dan de waarheid te zeggen. Getuigen zijn verplicht
      op de gestelde vragen te antwoorden.

      6 De voorzitter beëdigt deskundigen om hun taak naar geweten te vervullen. Deskundigen zijn verplicht de door het
      tuchtcollege gevorderde diensten te bewijzen.

      7 Ten aanzien van de getuigen en deskundigen zijn de
      [artikelen 217 tot en met 219 van het Wetboek van Strafvordering][ref2] van overeenkomstige toepassing.

      8 De getuigen en deskundigen ontvangen desgevraagd op vertoon van hun oproep of dagvaarding een door
      de voorzitter vast te stellen schadeloosstelling overeenkomstig het bepaalde bij of krachtens de
      [Wet tarieven in strafzaken][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel556
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel217
      [ref3]: https://wetten.overheid.nl/BWBR0002406
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel55o
