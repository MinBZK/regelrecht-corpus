  - number: '33'
    text: |-
      1 Aan boord van een schip is een monsterrol, die wordt opgemaakt en gewijzigd door de kapitein.

      2 In de monsterrol worden ten minste de namen en functies opgenomen van de bemanningsleden die de
      functies vervullen, genoemd in het bemanningscertificaat, alsmede van de bemanningsleden die door de
      scheepsbeheerder dan wel de kapitein, met toepassing van respectievelijk [artikel 4, eerste lid][ref1], en
      [artikel 4, vierde lid][ref2], naast de eerstbedoelde bemanningsleden aan boord zijn geplaatst.

      3 De monsterrol heeft een geldigheidsduur van niet meer dan twaalf maanden.

      4 De kapitein stelt Onze Minister binnen een week dan wel in de eerstvolgende haven in kennis van een door hem
      opgemaakte monsterrol of van wijzigingen in de monsterrol.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel4
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '34'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur:

      a. wordt bepaald welke gegevens van de bemanning voorts worden opgenomen in de monsterrol;

      b. wordt het model van de monsterrol vastgesteld;

      c. worden de wijze en frequentie van opmaken en wijzigen van de monsterrol bepaald;

      d. kunnen regels worden gesteld met betrekking tot de wijze waarop de Onze Minister van een opgemaakte of
      gewijzigde monsterrol in kennis wordt gesteld.

      2 Bij ministeriële regeling kan van de verplichting, genoemd in [artikel 33, eerste lid][ref1], en van de
      bepalingen krachtens het eerste lid van dit artikel ten behoeve van bepaalde categorieën van schepen vrijstelling
      worden verleend.

      3 Onze Minister kan in bijzondere gevallen van de verplichting, genoemd in [artikel 33, eerste lid][ref2], en van
      de bepalingen krachtens het eerste lid van dit artikel ontheffing verlenen ten behoeve van een bepaald schip en
      gedurende een bepaalde periode. Aan deze ontheffing kunnen beperkingen en voorwaarden worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel33
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel34
    references:
      - id: ref1
