  - number: '24'
    text: |-
      1 Onze Minister trekt een vaarbevoegdheidsbewijs als bedoeld in de [artikelen 18][ref1] of [22][ref2] in, indien:

      a. uit een onderzoek naar de bekwaamheid, bedoeld in [artikel 23, vierde lid][ref3], blijkt dat de houder niet meer
      voldoet aan de in [artikel 19, eerste lid, aanhef en onderdeel a, ten 1°][ref4], bedoelde beroepsvereisten;

      b. een van de voor de houder voorgeschreven geneeskundige verklaringen van geschiktheid voor de zeevaart ingevolge
      [artikel 23][ref5] ongeldig is verklaard, of indien de houder blijvend medisch ongeschikt voor de zeevaart is
      verklaard.

      2 Een vaarbevoegdheidsbewijs kan door Onze Minister voorts worden ingetrokken indien is gebleken dat bij de
      aanvraag onjuiste gegevens zijn opgegeven dan wel dat valse of vervalste documenten zijn overgelegd.

      3 Onze Minister kan, ter voorkoming van een noodsituatie of gevaar voor het scheepvaartverkeer, de houder van
      een vaarbevoegdheidsbewijs voor ten hoogste 24 uur een verbod opleggen aan boord van een schip een functie uit te
      oefenen of werkzaamheden te verrichten.

      4 Onze Minister trekt een vaarbevoegdheidsbewijs als bedoeld in [artikel 22][ref6] in, indien de geldigheid van het
      buitenlandse diploma, certificaat of bevoegdheidsbewijs op grond waarvan dat vaarbevoegdheidsbewijs is afgegeven,
      door of vanwege de bevoegde buitenlandse autoriteit is geschorst of ingetrokken.

      5 Onze Minister stelt de bevoegde buitenlandse autoriteit in kennis van de toepassing van het eerste en tweede lid
      van dit artikel ten aanzien van een vaarbevoegdheidsbewijs als bedoeld in [artikel 22][ref7].


