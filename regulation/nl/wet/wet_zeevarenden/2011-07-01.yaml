  - number: '9'
    text: |-
      Indien voor een schip meer dan een bemanningssamenstelling geldt, worden alle bemanningssamenstellingen duidelijk
      onderscheiden in het bemanningscertificaat opgenomen.
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel9
  - number: '10'
    text: |-
      De kapitein tekent in het scheepsdagboek aan:

      a. volgens welke bemanningssamenstelling het schip is bemand, indien in het bemanningscertificaat meer dan een
      samenstelling is opgenomen; en

      b. de feiten of omstandigheden die niet in overeenstemming zijn met de gegevens van het bemanningsplan.
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel10
  - number: '11'
    text: |-
      1 De scheepsbeheerder meldt aan Onze Minister alle wijzigingen van de gegevens van het bemanningsplan die hij
      voornemens is door te voeren.

      2 Op grond van de nieuwe gegevens beslist Onze Minister of de bemanningssamenstelling overeenkomstig het geldige
      bemanningscertificaat kan worden gehandhaafd. Zo nodig geeft hij een nieuw bemanningscertificaat af.
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel11
  - number: '12'
    text: |-
      1 Indien de omstandigheden daartoe aanleiding geven bij de toepassing van [artikel 4, derde lid][ref1], verzoekt
      de kapitein de scheepsbeheerder gemotiveerd hem voor een bepaald tijdstip de benodigde aanvullende middelen te
      verschaffen. Een mondeling verzoek wordt zo spoedig mogelijk schriftelijk bevestigd.

      2 Indien de scheepsbeheerder niet tijdig of geen gevolg geeft aan het verzoek, bedoeld in het eerste lid, stelt de
      kapitein Onze Minister daarvan schriftelijk in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel4
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel12
