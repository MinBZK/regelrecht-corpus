  - number: '56'
    text: |-
      1 Het is verboden met een schip naar zee te gaan, een schip naar zee te doen gaan of op zee een schip te gebruiken
      of te doen gebruiken, zonder dat aan boord van het schip een geldig bemanningscertificaat voorhanden is.

      2 Het is verboden om een schip waarvoor een certificaat van deugdelijkheid als bedoeld in de [Schepenwet][ref1] is
      vereist of is afgegeven, te gebruiken op wateren die ter plaatse als binnenwater worden aangemerkt, zonder dat aan
      boord van het schip een geldig bemanningscertificaat voorhanden is.


      [ref1]: https://wetten.overheid.nl/BWBR0001876
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0001876
  - number: '57'
    text: |-
      Het is verboden

      a. om een schip te bemannen met minder bemanningsleden dan is aangegeven in het bemanningscertificaat;

      b. een schip zodanig te bemannen dat niet ten minste de op het bemanningscertificaat aangegeven functies worden
      vervuld door tot het vervullen van die functies bevoegde bemanningsleden, of

      c. het schip te gebruiken in strijd met de voorwaarden van het bemanningscertificaat.
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel57
  - number: '58'
    text: |-
      1 Het is verboden het houden van uitkijk, dan wel het optreden als chef van de wacht op de brug of als chef van de
      wacht in de machinekamer of machinekamers, op te dragen aan of te laten verrichten door bemanningsleden die tot het
      verrichten van die werkzaamheden niet bevoegd zijn.

      2 Het is verboden aan boord werkzaamheden waarvoor ingevolge [artikel 18][ref1] een vaarbevoegdheidsbewijs is
      vereist, te verrichten, indien men hiertoe niet door middel van een geldig vaarbevoegdheidsbewijs bevoegd is
      verklaard.

      3 Het is verboden aan boord werkzaamheden waarvoor ingevolge [artikel 21][ref2] een certificaat of een ander
      document is vereist, te verrichten, indien men hiertoe niet door middel van een geldig certificaat of document
      bevoegd is verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel21
