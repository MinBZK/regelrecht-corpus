  - number: '18'
    text: |-
      1 Een ieder die aan boord van een schip een functie vervult waarvoor krachtens deze wet eisen zijn gesteld, is in
      het bezit van een geldig vaarbevoegdheidsbewijs voor die functie.

      2 De vaarbevoegdheden, die op de in het eerste lid bedoelde vaarbevoegdheidsbewijzen kunnen worden aangetekend,
      zijn:

      a. kapitein alle schepen

      eerste stuurman alle schepen

      wachtstuurman alle schepen

      kapitein kleine schepen

      eerste stuurman kleine schepen

      b. hoofdwerktuigkundige alle schepen

      tweede werktuigkundige alle schepen

      wachtwerktuigkundige alle schepen

      hoofdwerktuigkundige kleine schepen

      tweede werktuigkundige kleine schepen

      c. eerste maritiem officier

      eerste maritiem officier kleine schepen

      maritiem officier

      maritiem officier kleine schepen

      d. schipper zeevisvaart

      plaatsvervangend schipper zeevisvaart

      stuurman-werktuigkundige zeevisvaart

      stuurman zeevisvaart

      werktuigkundige zeevisvaart

      e. radio-operator

      f. gezel.

      3 Bij algemene maatregel van bestuur wordt bepaald welke de onderlinge rangorde is van de in het tweede lid
      genoemde vaarbevoegdheden.

      4 Bij of krachtens algemene maatregel van bestuur wordt bepaald welke beperkingen of aanvullingen mogen worden
      aangebracht op een vaarbevoegdheidsbewijs in verband met de aard van de lading, het soort schip of het vaargebied.

      5 Bij algemene maatregel van bestuur worden de vaarbevoegdheden, genoemd in het tweede lid, onderdeel d, nader
      onderscheiden naar scheepslengte, voortstuwingsvermogen of vaargebied.

      6 Bij algemene maatregel van bestuur wordt bepaald welke specifieke beperkingen gelden voor de vaarbevoegdheden
      waarop houders van bijzondere verklaringen van geschiktheid en bekwaamheid of diploma's, afgegeven voor de datum
      van inwerkingtreding van deze wet, recht hebben.
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel18
  - number: '19'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden:

      a. voor de verkrijging van de vaarbevoegdheden, genoemd in [artikel 18, tweede lid][ref1], vastgesteld:

      1°. de beroepsvereisten;

      2°. de opgedane ervaring;

      3°. de eisen van medische geschiktheid, en

      4°. de wijze waarop wordt beoordeeld of wordt voldaan aan de onder ten 1° en ten 2° bedoelde eisen;

      b. de geldigheidsduur van het vaarbevoegdheidsbewijs, alsmede de wijze van eerste afgifte, vervanging of
      vernieuwing van het vaarbevoegdheidsbewijs geregeld;

      c. de grenzen bepaald van de schepen, waarop de volgende vaarbevoegdheden mogen worden uitgeoefend:

      1°. kapitein kleine schepen;

      2°. eerste stuurman kleine schepen;

      3°. hoofdwerktuigkundige kleine schepen;

      4°. tweede werktuigkundige kleine schepen;

      5°. eerste maritiem officier kleine schepen, en

      6°. maritiem officier kleine schepen.

      2 Aan de voor de afgifte van een vaarbevoegdheidsbewijs benodigde beroepsvereisten kan worden voldaan door:

      a. het met goed gevolg hebben afgelegd van het afsluitend examen van een aan een op grond van de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2] bekostigde of aangewezen hogeschool verbonden
      opleiding voor een nautisch beroep dan wel het met goed gevolg hebben afgelegd van het examen van een nautische
      beroepsopleiding waarvoor op grond van de [Wet educatie en beroepsonderwijs][ref3] eindtermen zijn vastgesteld, of

      b. het hebben gevolgd van een door Onze Minister erkende opleiding.

      3 Bij ministeriële regeling worden regels gesteld met betrekking tot:

      a. de aanvraag voor de in het tweede lid bedoelde erkenning;

      b. de intrekking van de erkenning.

      4 Onze Minister stelt de criteria vast op grond waarvan een aanvraag voor de in het tweede lid bedoelde erkenning
      wordt beoordeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005682
