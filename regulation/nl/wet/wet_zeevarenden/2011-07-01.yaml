preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe bepalingen vast te stellen voor het bemannen van
    Nederlandse zeeschepen;

    Gelet op het op 7 juli 1978 te Londen tot stand gekomen Internationale Verdrag betreffende de normen voor
    zeevarenden inzake opleiding, diplomering en wachtdienst, 1978 (Trb. 1981, 144), alsmede op Richtlijn nr. 94/58/
    EG van de Raad van de Europese Unie van 22 november 1994 inzake het minimumopleidingsniveau van zeevarenden (PbEG
    L 319);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Verkeer en Waterstaat;

      b. Nederlands schip: een schip dat op grond van Nederlandse rechtsregels gerechtigd is de vlag van het Koninkrijk
      te voeren;

      c. vissersvaartuig: een Nederlands schip dat bestemd is of gebezigd wordt voor het bedrijfsmatig vangen van vis of
      van andere levende rijkdommen van de zee;

      d. zeilschip: een Nederlands schip dat bestemd en ingericht is om hoofdzakelijk door middel van zeilen te worden
      voortbewogen;

      e. pleziervaartuig: een Nederlands schip dat uitsluitend anders dan in de uitoefening van een beroep of bedrijf
      wordt gebruikt;

      f. zeilvaart: de bedrijfsmatige vaart met zeilschepen op zee;

      g. scheepslengte: tenzij anders bepaald, 96 procent van de totale lengte op een waterlijn op 85 procent van de
      kleinste holte gemeten vanaf de kiellijn, of de lengte van de voorzijde van de voorsteven tot de hartlijn van de
      roerkoning op die waterlijn, indien deze lengte groter is; bij vissersvaartuigen die met een stuurlast ontworpen
      zijn, moet de waterlijn waarop deze lengte gemeten wordt, evenwijdig aan de ontwerplastlijn worden genomen;

      h. kapitein: de gezagvoerder van een Nederlands schip;

      i. scheepsofficier: een lid van de bemanning, niet zijnde de kapitein, die aan boord van een Nederlands schip een
      functie als stuurman, werktuigkundige, maritiem officier of radio-operator vervult;

      j. opvarende: een ieder die zich gedurende de vaart aan boord van het schip bevindt;

      k. bemanning: de kapitein, de scheepsofficieren, de scheepsgezellen, en de overige opvarenden die in de monsterrol
      worden genoemd;

      l. scheepsbeheerder: de natuurlijke persoon of de rechtspersoon die, vanuit een vestiging van een
      zeescheepvaartonderneming in Nederland, de dagelijkse leiding heeft over het beheer van het schip, alsmede de
      personen die als lid van een maatschap het beheer voeren over het vissersvaartuig;

      m. de ambtenaren van de Inspectie Verkeer en Waterstaat: de door Onze Minister aangewezen ambtenaren van de
      Inspectie Verkeer en Waterstaat;

      n. vaarbevoegdheid: de bevoegdheid om in een of meer functies aan boord van een schip dienst te doen;

      o. vaarbevoegdheidsbewijs: een door Onze Minister afgegeven document waaruit de vaarbevoegdheid blijkt;

      p. bemanningsplan: een voorstel van de scheepsbeheerder, houdende het aantal bemanningsleden met hun functies aan
      boord waarmee de scheepsbeheerder het betrokken schip minimaal wenst te bemannen;

      q. bemanningscertificaat: een door Onze Minister afgegeven certificaat, houdende het minimumaantal bemanningsleden
      met hun functies aan boord van het betrokken schip;

      r. beroepsvereisten: de krachtens deze wet gestelde vereisten ten aanzien van de kennis, het inzicht en de
      vaardigheden voor een functie aan boord of voor werkzaamheden waarop deze wet van toepassing is;

      s. geneeskundige verklaring van geschiktheid voor de zeevaart: een verklaring als bedoeld in [artikel 40][ref1];

      t. tuchtcollege: het tuchtcollege voor de scheepvaart als bedoeld in [artikel 55a, tweede lid][ref2];

      u. verwerking van persoonsgegevens: hetgeen daaronder wordt verstaan in de [Wet bescherming persoonsgegevens][ref3];

      v. verantwoordelijke: hetgeen daaronder wordt verstaan in de [Wet bescherming persoonsgegevens][ref4];

      w. bewijs van beroepsbekwaamheid: elk geldig document dat is afgegeven door of onder de verantwoordelijkheid
      van de bevoegde autoriteit van een lidstaat van de Europese Unie, een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, in overeenstemming met artikel 5 van de
      bemanningsrichtlijn en de in de daarbij behorende bijlage I vastgestelde vereisten;

      x. bemanningsrichtlijn: richtlijn nr. 2008/106/EG van het Europees Parlement en de Raad van de Europese Unie van
      19 november 2008 inzake het minimum opleidingsniveau van zeevarenden (PbEU L 323).


