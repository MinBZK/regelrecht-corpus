  - number: '2'
    text: |-
      1 Deze wet is van toepassing ten aanzien van Nederlandse schepen die op zee worden gebruikt, voor zover ten aanzien
      van vissersvaartuigen niet anders is bepaald.

      2 Deze wet is van toepassing ten aanzien van Nederlandse schepen, waarvoor een certificaat van deugdelijkheid als
      bedoeld in de [Schepenwet][ref1] is vereist of is afgegeven, die worden gebruikt op wateren die ter plaatse als
      binnenwater worden aangemerkt.

      3 Deze wet is niet van toepassing ten aanzien van:

      a. schepen die voorzien zijn van een certificaat van deugdelijkheid voor onbemand gesleept vervoer;

      b. oorlogsschepen;

      c. reddingvaartuigen;

      d. onoverdekte vissersvaartuigen, die in de regel niet buiten het zicht van de Nederlandse kust worden gebracht;

      e. pleziervaartuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0001876
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001876
  - number: '3'
    text: |-
      1 De zorg voor het bemannen van een schip met inachtneming van deze wet berust bij de scheepsbeheerder.

      2 De scheepsbeheerder verschaft de kapitein de middelen die hem in staat stellen om aan zijn verplichtingen
      ingevolge deze wet te voldoen.

      3 De scheepsbeheerder houdt, ten behoeve van de met het toezicht op de naleving van deze wet belaste autoriteiten,
      per schip van elk daarop dienstdoend bemanningslid een overzicht bij van ten minste het volgende:

      a. de opleiding;

      b. de ervaring;

      c. de vakbekwaamheid;

      d. de medische geschiktheid.

      4 Ter uitvoering van de in het derde lid bedoelde verplichting worden persoonsgegevens betreffende de gezondheid
      verwerkt. De verwerking van deze gegevens vindt plaats teneinde te kunnen beoordelen of de bemanning van de door
      de scheepsbeheerder beheerde schepen voldoet aan de wettelijke vereisten betreffende de lichamelijke en geestelijke
      geschiktheid. De scheepsbeheerder is verantwoordelijke voor deze verwerking.
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel3
  - number: '4'
    text: |-
      1 De scheepsbeheerder bemant een schip zodanig dat redelijkerwijs alle werkzaamheden aan boord, met inachtneming
      van de geldende arbeids- en rusttijden, en gelet op de bedrijfsvoering, de risico’s op zee en van de lading, zonder
      gevaar voor de opvarenden, het schip, de lading, het milieu of het scheepvaartverkeer kunnen worden verricht.

      2 De scheepsbeheerder zorgt ervoor dat de bemanningsleden bij hun tewerkstelling aan boord vertrouwd zijn met hun
      specifieke taken en met alle regelingen, procedures aan boord en de kenmerken van het schip, die verband houden met
      hun taken zowel onder normale omstandigheden als in noodsituaties.

      3 De kapitein en de scheepsofficieren gedragen zich aan boord ten opzichte van de opvarenden, het schip, de lading,
      het milieu en het scheepvaartverkeer zoals het een goed zeeman betaamt.

      4 De kapitein zorgt ervoor dat de bemanning van het schip te allen tijde berekend is voor het verrichten van de
      werkzaamheden aan boord.
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel4
  - number: '5'
    text: |-
      1 Een schip is voorzien van een geldig bemanningscertificaat, afgegeven door Onze Minister.

      2 Een schip is ten minste bemand overeenkomstig het bemanningscertificaat.
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel5
  - number: '6'
    text: |-
      1 Op het bemanningscertificaat worden de kenmerken van het schip en, zo nodig, de bijzonderheden ten aanzien van
      het gebruik van het schip in relatie tot de bemanning vermeld.

      2 Een bemanningscertificaat wordt in tweevoud voor een bepaalde periode van ten hoogste vijf jaren afgegeven.

      3 De kapitein draagt er zorg voor dat een van de exemplaren van het geldige bemanningscertificaat op een duidelijk
      zichtbare plaats aan boord van het schip wordt opgehangen.
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel6
  - number: '7'
    text: |-
      1 De scheepsbeheerder dient voor elk schip afzonderlijk een aanvraag voor een bemanningscertificaat in bij Onze
      Minister, en voegt daarbij een bemanningsplan voor het betrokken schip.

      2 De scheepsbeheerder kan voor een schip meer dan een bemanningssamenstelling voorstellen.

      3 Bij ministeriële regeling wordt bepaald welke gegevens ten minste in het bemanningsplan worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel7
  - number: '8'
    text: |-
      1 Onze Minister neemt een besluit over elk van de ingediende bemanningssamenstellingen.

      2 Onze Minister besluit tot afgifte van een bemanningscertificaat voor het betrokken schip, indien naar zijn
      oordeel met de voorgestelde bemanningssamenstelling

      a. de veiligheid van het schip en de veilige en milieuverantwoorde vaart zijn gewaarborgd;

      b. de voor de bemanning geldende normen voor arbeids- en rusttijden niet worden overschreden;

      c. ook overigens aan de vereisten, bedoeld in [artikel 4, eerste lid][ref1], kan worden voldaan; en

      d. wordt voldaan aan het krachtens [artikel 64][ref2] bepaalde.

      3 De scheepsbeheerder verstrekt desgevraagd nadere inlichtingen over het bemanningsplan.

      4 Onze Minister kan de kapitein raadplegen alvorens te besluiten omtrent de afgifte van een bemanningscertificaat.

      5 Onze Minister stelt ambtshalve de bemanningssamenstelling van het betrokken schip vast en geeft
      dienovereenkomstig een bemanningscertificaat af, indien hij van oordeel is, dat met de bemanningssamenstelling die
      door de scheepsbeheerder wordt voorgesteld niet of niet geheel kan worden voldaan aan het tweede lid, onderdelen a
      tot en met d.

      6 De scheepsbeheerder verschaft de kapitein een afschrift van het bemanningsplan, dat is voorzien van de
      eventuele aanvullende gegevens die zijn verstrekt op grond van het derde lid, en dat behoort bij het geldige
      bemanningscertificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel64
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel8
