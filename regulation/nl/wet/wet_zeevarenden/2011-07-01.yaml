  - number: 25a
    text: |-
      1 Ter uitvoering van de [artikelen 20 tot en met 24][ref1] worden persoonsgegevens betreffende de gezondheid
      verwerkt. De verwerking van deze gegevens vindt plaats teneinde te kunnen beoordelen of degene die aan boord van
      een schip werkzaamheden verricht waarvoor het bezit van een vaarbevoegdheidsbewijs is vereist, voldoet of niet meer
      voldoet aan de wettelijke vereisten betreffende de medische geschiktheid in verband met de afgifte of het behoud
      van een vaarbevoegdheidsbewijs. Onze Minister is verantwoordelijke voor deze verwerking.

      2 Ter uitvoering van [artikel 25][ref2] worden persoonsgegevens betreffende de gezondheid verwerkt. De verwerking
      van deze gegevens vindt plaats teneinde te kunnen beoordelen of aan een bemanningslid, onderscheidenlijk aan de
      houder van een vaarbevoegdheid, ontheffing kan worden verleend van de verplichting in het bezit te zijn van een
      geldig vaarbevoegdheidsbewijs. Onze Minister is verantwoordelijke voor deze verwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel25
