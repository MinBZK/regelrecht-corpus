  - number: 55g
    text: |-
      1 De voorzitter, de leden en de secretaris, alsmede hun plaatsvervangers, mogen zich niet op enige wijze inlaten
      met partijen of hun raadslieden of gemachtigden over enige zaak die bij het tuchtcollege voor de scheepvaart
      aanhangig is, of waarvan zij weten of kunnen vermoeden dat deze bij het tuchtcollege voor de scheepvaart aanhangig
      zal worden gemaakt.

      2 Zij zijn verplicht tot geheimhouding van de gegevens waarover zij bij de uitoefening van hun taak de beschikking
      krijgen en waarvan zij het vertrouwelijk karakter kennen of redelijkerwijs moeten vermoeden, behoudens voorzover
      enig wettelijk voorschrift hen tot mededeling verplicht of uit hun taak de noodzaak tot mededeling voortvloeit.

      3 Zij zijn verplicht tot geheimhouding van hetgeen in de raadkamer over aanhangige zaken is geuit.
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel55g
  - number: 55h
    text: |-
      1 Een zaak wordt in eerste aanleg bij het tuchtcollege aanhangig gemaakt op verzoek van Onze Minister of door een
      klacht van een belanghebbende. Daarnaast is het tuchtcollege bevoegd om uit eigen beweging een zaak aanhangig te
      maken.

      2 Een verzoek en een klacht worden schriftelijk of elektronisch en met redenen omkleed ingediend bij de voorzitter
      van het tuchtcollege. Een klacht van een belanghebbende vermeldt de naam, het adres en de woonplaats van de klager.
      Een verzoek en een klacht bevatten voorts ten minste de volgende gegevens:

      a. de naam en, voor zover bekend, het adres en de woonplaats van de kapitein of de scheepsofficier op wie het
      verzoek of de klacht betrekking heeft, en indien het verzoek of de klacht betrekking heeft op een scheepsofficier,
      de functie aan boord van het schip die de scheepsofficier ten tijde van de gewraakte gedraging vervulde;

      b. de naam en, voor zover bekend, het type van het schip, aan boord waarvan de gewraakte gedraging heeft plaats
      gevonden;

      c. een omschrijving van de gedraging, waarop het verzoek of de klacht betrekking heeft;

      d. de bezwaren die tegen de gewraakte gedraging zijn gerezen.

      3 Indien de klager daarom verzoekt, is de secretaris van het tuchtcollege hem behulpzaam bij het formuleren van
      de klacht.

      4 Het tuchtcollege neemt een verzoek of een klacht niet in behandeling indien de gedraging waarop het verzoek of de
      klacht betrekking heeft meer dan twee jaren voor de indiening van het verzoek of de klacht heeft plaats gevonden.
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel55h
  - number: 55i
    text: |-
      1 De voorzitter kan besluiten tot het instellen van een vooronderzoek, in welk geval hij de uitvoering
      van het vooronderzoek opdraagt aan een of meer leden of plaatsvervangende leden of aan de secretaris of de
      plaatsvervangende secretaris van het tuchtcollege.

      2 Degene die het vooronderzoek verricht is bevoegd:

      a. voor het verrichten van onderzoek ter plaatse elke plaats te betreden die hij noodzakelijk acht, zo nodig met
      behulp van de sterke arm, met uitzondering van een woning zonder toestemming van de bewoner;

      b. kennis te nemen van alle schriftelijke stukken en gegevens in geautomatiseerde werken die zich aan boord
      bevinden, waarvan hij kennisneming in het belang van het onderzoek acht, en daarvan afschriften te maken;

      c. de klager, alsmede de betrokken kapitein of scheepsofficier te horen;

      d. getuigen en deskundigen te horen, waarbij het bepaalde in [artikel 55o, vijfde, zesde en zevende lid][ref1], van
      overeenkomstige toepassing is.

      3 Degene die het vooronderzoek heeft verricht neemt geen deel aan de behandeling van de zaak ter zitting van het
      tuchtcollege.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel55o
