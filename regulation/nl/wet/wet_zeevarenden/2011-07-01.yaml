  - number: '31'
    text: |-
      1 In geval van belet of ontstentenis van de kapitein van een Nederlands schip, niet zijnde een vissersvaartuig,
      treedt als kapitein op de eerste stuurman, onderscheidenlijk de eerste maritiem officier.

      2 In geval geen eerste stuurman of eerste maritiem officier aanwezig is, treedt als kapitein op een door de
      scheepsbeheerder aangewezen persoon.

      3 In geval van belet of ontstentenis van de kapitein van een vissersvaartuig treedt als kapitein op de
      plaatsvervangend schipper of, bij afwezigheid van een plaatsvervangend schipper, een door de scheepsbeheerder
      aangewezen persoon.
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel31
  - number: '32'
    text: |-
      1 De scheepsbeheerder draagt er zorg voor dat de kapitein op grond van de door hem gegeven zienswijze bij de
      toepassing van [artikel 4, derde lid][ref1], of bij toepassing van [artikel 8, vierde lid][ref2], niet benadeeld
      wordt in zijn positie in de zeescheepvaartonderneming.

      2 De kapitein kan de kantonrechter verzoeken te bepalen dat de scheepsbeheerder gevolg dient te geven aan hetgeen
      in het eerste lid is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel8
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel32
