  - number: 55e
    text: |-
      De voorzitter, de plaatsvervangende voorzitters, de leden en de plaatsvervangende leden van het tuchtcollege
      ontvangen een bij ministeriële regeling vast te stellen vacatiegeld, alsmede een vergoeding van reis- en
      verblijfkosten en van verdere verschotten.
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel55e
  - number: 55f
    text: |-
      1 Het tuchtcollege heeft een secretaris en een plaatsvervangend secretaris

      a. aan wie op grond van het afsluitend examen van een opleiding in het wetenschappelijk
      onderwijs door een universiteit dan wel de Open Universiteit, waarop de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] betrekking heeft, de graad van Bachelor op het
      gebied van het recht en tevens de graad van Master op het gebied van het recht is verleend, of

      b. die op grond van het afsluitend examen van een opleiding op het gebied van het recht aan een universiteit dan
      wel de Open Universiteit, waarop de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2] betrekking
      heeft, het recht heeft verkregen om de titel meester te voeren.

      2 De secretaris en de plaatsvervangend secretaris worden door Onze Minister benoemd, geschorst en ontslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0005682
