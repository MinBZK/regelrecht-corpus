  - number: 55j
    text: |-
      1 De voorzitter kan een verzoek of een klacht na een summier onderzoek terstond afwijzen bij een met redenen
      omklede beslissing indien hij van oordeel is dat de klager kennelijk niet ontvankelijk is, dan wel het verzoek of
      de klacht kennelijk ongegrond is.

      2 De secretaris zendt onverwijld een afschrift van de schriftelijke beslissing van de voorzitter aan Onze Minister
      en aan de klager.

      3 Onze Minister en de klager kunnen binnen twee weken na de dag van verzending van de beslissing van de
      voorzitter tot afwijzing van een verzoek of een klacht hiertegen schriftelijk of elektronisch verzet doen bij het
      tuchtcollege. Ten gevolge van het verzet vervalt de beslissing van de voorzitter.

      4 Indien de voorzitter van oordeel is dat een verzoek of een klacht vatbaar is voor een minnelijke schikking, roept
      hij Onze Minister of de klager alsmede de betrokken kapitein of scheepsofficier op teneinde een zodanige schikking
      te beproeven. Indien een minnelijke schikking is getroffen, wordt het verzoek of de klacht ingetrokken.

      5 De voorzitter brengt verzoeken en klachten die niet door hem zijn afgewezen of niet in der minne zijn geschikt,
      onverwijld ter kennis van het tuchtcollege.
    url: https://wetten.overheid.nl/BWBR0009124/2011-07-01#Artikel55j
  - number: 55k
    text: |-
      1 Aan de behandeling van een zaak ter zitting van het tuchtcollege nemen vijf leden deel, te weten de voorzitter of
      een van zijn plaatsvervangers, alsmede:

      a. de vier leden, bedoeld in [artikel 55b, derde lid][ref1], indien het verzoek of de klacht betrekking heeft
      op de kapitein of een scheepsofficier van een ander schip dan een vissersvaartuig, met de mogelijkheid van
      plaatsvervanging, of

      b. de vier leden, bedoeld in [artikel 55b, vierde lid][ref2], indien het verzoek of de klacht betrekking heeft op
      de schipper of een scheepsofficier van een vissersvaartuig, met de mogelijkheid van plaatsvervanging.

      2 De voorzitter kan, indien de zaak het vereist, bepalen dat aan de behandeling van die zaak ter zitting van
      het tuchtcollege, een of twee plaatsvervangende leden als bedoeld in [artikel 55b, vijfde lid][ref3], deelnemen
      in plaats van de in het eerste lid, onder a en b voor behandeling aangewezen leden. De plaatsvervangende leden,
      bedoeld in de eerste volzin, brengen geen stem uit bij het nemen van een beslissing. In geval van staking van
      stemmen is de stem van de voorzitter of zijn plaatsvervanger beslissend.

      3 De voorzitter kan, indien een zaak hem daartoe geschikt voorkomt, bepalen dat aan de behandeling van die zaak
      ter zitting van het tuchtcollege, in afwijking van het bepaalde in het eerste lid, drie leden deelnemen, te weten
      de voorzitter of een van zijn plaatsvervangers, alsmede twee van de vier leden, bedoeld in het eerste lid onder a
      of b.

      4 Bij de behandeling van een zaak ter zitting van het tuchtcollege naverzet als bedoeld in
      [artikel 55j, derde lid][ref4], wordt de voorzitter vervangen door een van zijn plaatsvervangers.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel55b
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel55b
