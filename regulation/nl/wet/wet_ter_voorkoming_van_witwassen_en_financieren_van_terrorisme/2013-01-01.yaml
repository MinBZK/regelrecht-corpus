        artikel: '24'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0024282
        artikel: '24'
        hoofdstuk: '4'
  - number: 32.a
    text: |-
      de ontwikkeling van interne procedures en controles ter voorkoming van witwassen en het financieren van terrorisme;
      en
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel32
  - number: 32.b
    text: |-
      de opleiding van werknemers als bedoeld in [artikel 35][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel35
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '35'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '33.1'
    text: |-
      Een instelling die op grond van deze wet een persoon heeft geïdentificeerd en zijn identiteit heeft geverifieerd,
      of bij wie de cliënt is geïntroduceerd conform de procedure van [artikel 5][ref1], legt op opvraagbare wijze de
      volgende gegevens vast:


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel5
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 33.1.a
    text: 'van natuurlijke personen:'
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel33
  - number: 33.1.a.1°
    text: |-
      de geslachtsnaam, de voornamen, de geboortedatum, het adres en de woonplaats dan wel plaats van vestiging van de
      cliënt alsmede van degene die namens die natuurlijke persoon optreedt of een afschrift van het document dat een
      persoonidentificerend nummer bevat en aan de hand waarvan de identificatie heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel33
  - number: 33.1.a.2°
    text: |-
      de aard, het nummer en de datum en plaats van uitgifte van het document met behulp waarvan de identiteit is
      geverifieerd;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel33
  - number: 33.1.a.3°
    text: de aard van de dienstverlening;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel33
  - number: 33.1.b
    text: 'van naar Nederlands recht opgerichte rechtspersonen:'
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel33
  - number: 33.1.b.1°
    text: |-
      de rechtsvorm, de statutaire naam, de handelsnaam, het adres met huisnummer, de postcode, de plaats van
      vestiging, het land van statutaire zetel en, indien de rechtspersoon bij een Kamer van Koophandel en Fabrieken is
      geregistreerd, het registratienummer bij de Kamer van Koophandel en Fabrieken en de plaats van vestiging van de
      Kamer van Koophandel en Fabrieken die het desbetreffende handelsregister houdt en de wijze waarop de identiteit
      is geverifieerd;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel33
  - number: 33.1.b.2°
    text: |-
      van degenen die voor de rechtspersoon bij de instelling optreden: de geslachtsnaam, de voornamen en de
      geboortedatum;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel33
  - number: 33.1.b.3°
    text: de aard van de dienstverlening;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel33
  - number: 33.1.c
    text: 'van buitenlandse rechtspersonen:'
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel33
  - number: 33.1.c.1°
    text: de gegevens in de documenten aan de hand waarvan de identiteit is geverifieerd;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel33
  - number: 33.1.c.2°
    text: |-
      van degenen die voor de rechtspersoon bij de instelling optreden: de geslachtsnaam, de voornamen en de
      geboortedatum;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel33
  - number: 33.1.c.3°
    text: de aard van de dienstverlening;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel33
  - number: 33.1.c.4°
    text: het adres met huisnummer, de postcode, de plaats van vestiging en het land van statutaire zetel;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel33
  - number: 33.1.d
    text: |-
      indien van toepassing, de identiteit van de uiteindelijk belanghebbende en de wijze waarop deze identiteit is
      geverifieerd.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel33
  - number: '33.2'
    text: |-
      Indien een cliënt handelt als trustee legt een instelling tevens op opvraagbare wijze de volgende gegevens vast van
      de instellers, de trustees en de uiteindelijk belanghebbenden:
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel33
  - number: 33.2.1°
    text: 'ingeval van natuurlijke personen: de gegevens, bedoeld in het eerste lid, onderdeel a, subonderdelen 1° en 2°;'
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel33
  - number: 33.2.2°
    text: |-
      ingeval van naar Nederlands recht opgerichte rechtspersonen: de gegevens, bedoeld in het eerste lid, onderdeel b,
      subonderdelen 1° en 2°;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel33
  - number: 33.2.3°
    text: |-
      ingeval van buitenlandse rechtspersonen: de gegevens, bedoeld in het eerste lid, onderdeel c, subonderdelen 1°
      en 2°.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel33
  - number: '33.3'
    text: |-
      Een instelling bewaart de gegevens, bedoeld in het eerste en tweede lid, en legt die gegevens vast gedurende vijf
      jaar na het tijdstip van het beëindigen van de zakelijke transactie of na het uitvoeren van de desbetreffende
      transactie.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel33
  - number: '33.3'
    text: |-
      Een instelling bewaart de in het eerste en tweede lid bedoelde gegevens op toegankelijke wijze gedurende vijf jaar
      na het tijdstip van het beëindigen van de zakelijke relatie of tot vijf jaar na het uitvoeren van de desbetreffende
      transactie.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel33
  - number: '34'
    text: |-
      Een instelling bewaart de gegevens, bedoeld in [artikel 16, tweede lid][ref1], en legt deze vast, op zodanige wijze
      dat die gegevens opvraagbaar zijn en de desbetreffende transactie reconstrueerbaar is gedurende vijf jaar na het
      tijdstip van het doen van de melding.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel16
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '35'
    text: |-
      Een instelling draagt er zorg voor dat haar werknemers, voor zover relevant voor de uitoefening van hun taken,
      bekend zijn met de bepalingen van deze wet en periodiek opleidingen genieten die hen in staat stellen een
      ongebruikelijke transactie te herkennen en een cliëntenonderzoek goed en volledig uit te voeren.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel35
  - number: '36'
    text: |-
      De rechtsgeldigheid van een privaatrechtelijke rechtshandeling van een instelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°][ref1], welke is verricht in strijd met de bij of krachtens deze wet
      gestelde regels is niet uit dien hoofde aantastbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '1'
        hoofdstuk: '1'
  - number: '37'
    text: |-
      Een ontheffing die is verleend op grond van
      [artikel 2, zesde lid, van de Wet identificatie bij dienstverlening][ref1], berust vanaf het tijdstip van
      inwerkingtreding van deze wet op [artikel 3, zevende lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006330#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel3
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006330
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '38.1'
    text: |-
      Ten aanzien van cliënten die reeds op grond van de Wet identificatie bij dienstverlening zijn geïdentificeerd of
      ten aanzien van wie geen verplichting tot identificatie op grond van die wet was vereist, alsmede in voorkomende
      gevallen de trust ten behoeve waarvan zij handelen, verricht een instelling het cliëntenonderzoek, bedoeld in
      [artikel 3, eerste lid][ref1], in de navolgende gevallen binnen de daarbij genoemde termijn na een bij koninklijk
      besluit te bepalen tijdstip:


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel3
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 38.1.a
    text: |-
      zes maanden ingeval van cliënten op welke [artikel 9][ref1] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel9
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 38.1.b
    text: |-
      een jaar ingeval van cliënten op welke [artikel 8, eerste lid][ref1], van toepassing is of waarvan de instelling
      bekend is dat artikel 8, vierde lid, van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel8
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 38.1.c
    text: |-
      twee jaar ingeval van cliënten op wie de onderdelen a en b niet van toepassing zijn en die rechtspersoon zijn met
      zetel buiten Nederland of handelen ten behoeve van een trust;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel38
  - number: 38.1.d
    text: bij eerste gelegenheid ingeval van cliënten op welke de onderdelen a tot en met c niet van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel38
  - number: '38.2'
    text: |-
      In afwijking van het eerste lid verricht een instelling in geval van een zakelijke relatie met betrekking tot
      een levensverzekeringsovereenkomst als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1] het
      cliëntenonderzoek, bedoeld in [artikel 3, eerste lid][ref2], wanneer een geldelijke uitkering plaatsvindt aan de
      cliënt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel3
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '38.3'
    text: |-
      Gegevens van de in het eerste lid bedoelde personen die reeds op grond van de
      [Wet identificatie bij dienstverlening][ref1] zijn vastgelegd, worden geacht te zijn vastgelegd ingevolge deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006330
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0006330
  - number: '38.4'
    text: |-
      Onverminderd [artikel 8, vierde lid][ref1], draagt een instelling er zorg voor dat een persoon als bedoeld in
      artikel 8, vierde lid, onderdeel a, beslist omtrent het voortzetten van de zakelijke relatie met cliënten als
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel8
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '39'
    text: |-
      Een last onder dwangsom of een bestuurlijke boete die op het tijdstip van inwerkingtreding van
      deze wet was opgelegd ter zake van overtreding van een voorschrift, gesteld bij of krachtens de
      [Wet identificatie bij dienstverlening][ref1] of de [Wet melding ongebruikelijke transacties][ref2],
      wordt aangemerkt als een last onder dwangsom of een bestuurlijke boete als bedoeld in [artikel 26][ref3]
      onderscheidenlijk [27][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006330
      [ref2]: https://wetten.overheid.nl/BWBR0006331
      [ref3]: https://wetten.overheid.nl/BWBR0024282#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0024282#Artikel27
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0006330
      - id: ref2
        bwb_id: BWBR0006331
      - id: ref3
        bwb_id: BWBR0024282
        artikel: '26'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0024282
        artikel: '27'
        hoofdstuk: '4'
  - number: '40'
    text: |-
      Op bezwaar of beroep, ingesteld vóór het tijdstip van inwerkingtreding van deze wet tegen een besluit op grond van
      de [Wet identificatie bij dienstverlening][ref1] of de [Wet melding ongebruikelijke transacties][ref2], blijft het
      recht van toepassing dat gold voor het tijdstip van inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006330
      [ref2]: https://wetten.overheid.nl/BWBR0006331
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0006330
      - id: ref2
        bwb_id: BWBR0006331
  - number: '41.1'
    text: |-
      Met het toezicht op de naleving van de regels, gesteld bij of krachtens de
      [Wet identificatie bij dienstverlening][ref1] en de [Wet melding ongebruikelijke transacties][ref2], zijn belast de
      op grond van [artikel 24, eerste lid][ref3], aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0006330
      [ref2]: https://wetten.overheid.nl/BWBR0006331
      [ref3]: https://wetten.overheid.nl/BWBR0024282#Artikel24
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0006330
      - id: ref2
        bwb_id: BWBR0006331
      - id: ref3
        bwb_id: BWBR0024282
        artikel: '24'
        hoofdstuk: '4'
  - number: '41.2'
    text: |-
      De personen die op grond van [artikel 24, eerste lid][ref1], zijn belast met het toezicht op de naleving van
      deze wet, kunnen na inwerkingtreding van deze wet tot drie jaren na de dag waarop de overtreding is begaan
      een bestuurlijke boete opleggen terzake van overtreding van een voorschrift gesteld bij of krachtens de
      [Wet identificatie bij dienstverlening][ref2] of de [Wet melding ongebruikelijke transacties][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0006330
      [ref3]: https://wetten.overheid.nl/BWBR0006331
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '24'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006330
      - id: ref3
        bwb_id: BWBR0006331
  - number: '41.3'
    text: |-
      Op een bestuurlijke boete als bedoeld in het tweede lid blijft het recht van toepassing dat gold voor het tijdstip
      van inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel41
  - number: '42'
    text: |-
      Een aanwijzing die is gegeven op grond van [artikel 17u van de Wet melding ongebruikelijke transacties][ref1],
      wordt vanaf het tijdstip van inwerkingtreding van deze wet aangemerkt als een aanwijzing als bedoeld in
      [artikel 32][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel17u
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel32
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel42
