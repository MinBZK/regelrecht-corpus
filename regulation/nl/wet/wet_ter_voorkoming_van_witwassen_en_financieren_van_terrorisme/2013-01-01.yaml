  - number: 1.1.r
    text: |-
      *bank:* een bank als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 1.1.s
    text: |-
      *platform voor de veiling van emissierechten:* Platform voor de veiling van emissierechten als bedoeld in hoofdstuk
      VII van Verordening (EU) nr. 1031/2010 van de Europese Commissie van 12 november 2010 inzake de tijdstippen, het
      beheer en andere aspecten van de veiling van broeikasgasemissierechten overeenkomstig Richtlijn 2003/87/EG van het
      Europees Parlement en de Raad tot vaststelling van een regeling voor de handel in broeikasgasemissierechten binnen
      de Gemeenschap (PbEU L 302).
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel1
  - number: '1.2'
    text: |-
      Deze wet is niet van toepassing op belastingadviseurs als bedoeld in het eerste lid, onderdeel a, onder 11°, en de
      personen, bedoeld in het eerste lid, onderdeel a, onder 12° en 13°, voor zover zij voor een cliënt werkzaamheden
      verrichten betreffende de bepaling van diens rechtspositie, diens vertegenwoordiging en verdediging in rechte, het
      geven van advies voor, tijdens en na een rechtsgeding of het geven van advies over het instellen of vermijden van
      een rechtsgeding.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel1
  - number: '1.3'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder de begrippen «trust», «trustee» en «insteller» verstaan:
      hetgeen daaronder in het Verdrag inzake het recht dat toepasselijk is op trusts en inzake de erkenning van trusts
      (Trb. 1985, 141) wordt verstaan.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel1
  - number: '2.1'
    text: |-
      Een instelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°, 2°, 3°, 5°, 6°, 7°, 8°, 18° of 19°][ref1], die
      een bijkantoor of een dochtermaatschappij heeft in een staat die geen lidstaat is, draagt er zorg voor dat
      het bijkantoor onderscheidenlijk de dochtermaatschappij cliëntenonderzoek verricht dat gelijkwaardig is
      aan dat, geregeld in [artikel 3, eerste tot en met vierde en zesde lid][ref2], en gegevens met betrekking
      tot het cliëntenonderzoek vastlegt en bewaart op een wijze die gelijkwaardig is aan hetgeen is geregeld in
      [artikel 33][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0024282#Artikel33
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref3
        bwb_id: BWBR0024282
        artikel: '33'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '2.2'
    text: |-
      Indien het recht van de betrokken staat toepassing van het eerste lid niet toelaat, stelt de instelling degene die
      ingevolge [artikel 24][ref1] belast is met het toezicht op de naleving van deze wet door de instelling daarvan in
      kennis en neemt zij maatregelen om het risico van witwassen en financieren van terrorisme te voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel24
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '24'
        hoofdstuk: '4'
  - number: 2a.1
    text: |-
      Ter voorkoming van witwassen en financieren van terrorisme verricht een instelling cliëntenonderzoek en meldt zij
      verrichte of voorgenomen ongebruikelijke transacties overeenkomstig de bij of krachtens de [hoofdstukken 2][ref1]
      en [3][ref2] gestelde regels. Daarbij besteedt een instelling bijzondere aandacht aan ongebruikelijke
      transactiepatronen en aan transacties die naar hun aard een hoger risico op witwassen of financieren van terrorisme
      met zich brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0024282
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0024282
        hoofdstuk: '3'
  - number: 2a.2
    text: |-
      Een instelling treft adequate maatregelen ter voorkoming van risico’s op witwassen en financieren van terrorisme
      die kunnen ontstaan door het gebruik van nieuwe technologieën in het economisch verkeer.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel2a
  - number: '3.1'
    text: Een instelling verricht ter voorkoming van witwassen en financieren van terrorisme cliëntenonderzoek.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: '3.2'
    text: 'Het cliëntenonderzoek stelt de instelling in staat om:'
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: 3.2.a
    text: de cliënt te identificeren en diens identiteit te verifiëren;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: 3.2.b
    text: |-
      de uiteindelijk belanghebbende van de cliënt te identificeren en op risico gebaseerde en adequate maatregelen te
      nemen om zijn identiteit te verifiëren, en indien de cliënt een rechtspersoon is, op risico gebaseerde en adequate
      maatregelen te nemen om inzicht te verwerven in de eigendoms- en zeggenschapsstructuur van de cliënt;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: 3.2.c
    text: het doel en de beoogde aard van de zakelijke relatie vast te stellen;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: 3.2.d
    text: |-
      een voortdurende controle op de zakelijke relatie en de tijdens de duur van deze relatie verrichte transacties uit
      te oefenen, teneinde te verzekeren dat deze overeenkomen met de kennis die de instelling heeft van de cliënt en
      diens risicoprofiel, met zo nodig een onderzoek naar de bron van de middelen die bij de zakelijke relatie of de
      transactie gebruikt worden;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: 3.2.e
    text: vast te stellen of de natuurlijke persoon die de cliënt vertegenwoordigt daartoe bevoegd is;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: 3.2.f
    text: |-
      op risico gebaseerde en adequate maatregelen te nemen om te verifiëren of de cliënt ten behoeve van zichzelf
      optreedt dan wel ten behoeve van een derde;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: 3.2.g
    text: |-
      in voorkomend geval, de natuurlijke persoon, bedoeld in onderdeel e, te identificeren en diens identiteit te
      verifiëren.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: '3.3'
    text: |-
      In afwijking van het tweede lid stelt het cliëntenonderzoek, indien de cliënt handelt als trustee, de instelling
      in staat om op risico gebaseerde en adequate maatregelen te nemen om inzicht te verwerven in de eigendoms- en
      zeggenschapsstructuur van de trust en daartoe:
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: 3.3.a
    text: |-
      de instellers en de trustees van de trust te identificeren en op risico gebaseerde en adequate maatregelen te nemen
      om hun identiteit te verifiëren;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: 3.3.b
    text: |-
      de uiteindelijk belanghebbende van de trust te identificeren en op risico gebaseerde en adequate maatregelen te
      nemen om diens identiteit te verifiëren;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: 3.3.c
    text: het doel en de beoogde aard van de zakelijke relatie vast te stellen;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: 3.3.d
    text: |-
      een voortdurende controle op de zakelijke relatie en de tijdens de duur van de relatie verrichte transacties uit
      te oefenen, teneinde te verzekeren dat deze overeenkomen met de kennis die de instelling heeft van de trust en het
      risicoprofiel van de trust, met zo nodig een onderzoek naar de bron van de middelen die bij de zakelijke relatie of
      de transactie gebruikt worden;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: 3.3.e
    text: vast te stellen of de cliënt bevoegd is te handelen als trustee.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: '3.4'
    text: |-
      In afwijking van het tweede lid stelt het cliëntenonderzoek, indien cliënten optreden als vennoten van een
      personenvennootschap, de instelling in staat om:
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: 3.4.a
    text: |-
      de vennoten en de personen bevoegd inzake het beheer van de personenvennootschap te identificeren en op risico
      gebaseerde en adequate maatregelen te nemen om, voor zover toepasselijk, hun hoedanigheid van vennoot te
      verifiëren;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: 3.4.b
    text: 'de natuurlijke persoon te identificeren die:'
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: 3.4.b.1°
    text: bij ontbinding van de personenvennootschap recht heeft op een aandeel in de gemeenschap van meer dan 25 procent;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: 3.4.b.2°
    text: recht heeft op een aandeel in de winsten van de personenvennootschap van meer dan 25 procent;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: 3.4.b.3°
    text: |-
      bij besluitvorming ter zake van wijziging van de overeenkomst die ten grondslag ligt aan de personenvennootschap
      of ter zake van de uitvoering van die overeenkomst anders dan door daden van beheer, meer dan 25 procent van de
      stemmen kan uitoefenen voor zover in die overeenkomst besluitvorming bij meerderheid van stemmen is bedongen; of
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: 3.4.b.4°
    text: feitelijk zeggenschap kan uitoefenen over de personenvennootschap;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: 3.4.c
    text: |-
      op risico gebaseerde en adequate maatregelen te nemen om de identiteit van de natuurlijke persoon bedoeld in
      onderdeel b te verifiëren;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: 3.4.d
    text: het doel en de beoogde aard van de zakelijke relatie vast te stellen;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: 3.4.e
    text: |-
      een voortdurende controle op de zakelijke relatie en de tijdens de duur van deze relatie verrichte transacties
      uit te oefenen, teneinde te verzekeren dat deze overeenkomen met de kennis die de instelling heeft van de
      personenvennootschap en haar risicoprofiel, met zo nodig een onderzoek naar de bron van de middelen die bij de
      zakelijke relatie of de transactie gebruikt worden;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: 3.4.f
    text: |-
      vast te stellen of de natuurlijke persoon die de vennoten in de personenvennootschap vertegenwoordigt daartoe
      bevoegd is;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: 3.4.g
    text: |-
      in voorkomend geval de natuurlijke persoon, bedoeld in onderdeel f, te identificeren en diens identiteit te
      verifiëren.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: '3.5'
    text: 'Een instelling verricht het cliëntenonderzoek in de volgende gevallen:'
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: 3.5.a
    text: indien zij in of vanuit Nederland een zakelijke relatie aangaat;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: 3.5.b
    text: |-
      indien zij in of vanuit Nederland een incidentele transactie verricht ten behoeve van de cliënt van ten minste
      € 15 000, of twee of meer transacties waartussen een verband bestaat met een gezamenlijke waarde van ten minste
      € 15 000;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: 3.5.c
    text: indien er indicaties zijn dat de cliënt betrokken is bij witwassen of financieren van terrorisme;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: 3.5.d
    text: indien zij twijfelt aan de betrouwbaarheid van eerder verkregen gegevens van de cliënt;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: 3.5.e
    text: |-
      indien het risico van betrokkenheid van een bestaande cliënt bij witwassen of financieren van terrorisme daartoe
      aanleiding geeft;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: 3.5.f
    text: |-
      indien er, gelet op de staat waarin een cliënt woonachtig of gevestigd is of zijn zetel heeft, een verhoogd risico
      op witwassen of financieren van terrorisme bestaat;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: 3.5.g
    text: |-
      indien zij in of vanuit Nederland een incidentele transactie verricht ten behoeve van de cliënt of de trust
      inhoudende een geldovermaking als bedoeld in artikel 2, zevende lid, van Verordening (EG) nr. 2006/1781 van het
      Europees Parlement en de Raad van 15 november 2006 betreffende bij geldovermakingen te voegen informatie over de
      betaler (PbEU 2006, L 345).
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: '3.6'
    text: |-
      Een instelling kan het cliëntenonderzoek afstemmen op de risicogevoeligheid voor witwassen of financiering van
      terrorisme van het type cliënt, zakelijke relatie, product of transactie.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: '3.7'
    text: |-
      Het eerste tot en met zesde lid is niet van toepassing op trustkantoren als bedoeld in
      [artikel 1, onderdeel a, onder 10°][ref1], voor zover zij diensten verlenen als bedoeld in
      [artikel 1, onderdeel d, van de Wet toezicht trustkantoren][ref2] en op taxateurs als bedoeld in artikel 1,
      onderdeel a, onder 24°.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0016189#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0016189
        artikel: '1'
  - number: '3.8'
    text: |-
      Een instelling neemt op risico gebaseerde en adequate maatregelen om ervoor te zorgen dat de gegevens die ingevolge
      het tweede, derde en vierde lid zijn verzameld over daar bedoelde personen, actueel gehouden worden.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: '3.9'
    text: Bij ministeriële regeling kan vrijstelling worden geregeld van het in het eerste of tweede lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: '3.10'
    text: |-
      Onze Minister van Financiën kan, op verzoek van een instelling, al dan niet voor bepaalde tijd, ontheffing verlenen
      van het eerste of tweede lid. Aan een vrijstelling en ontheffing kunnen beperkingen worden gesteld en voorschriften
      worden verbonden.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
  - number: '3.11'
    text: |-
      In dit artikel wordt verstaan onder personenvennootschap: een maatschap als bedoeld in
      [artikel 1655 van boek 7A van het Burgerlijk Wetboek][ref1], een vennootschap onder firma als bedoeld
      in [artikel 16 van het Wetboek van Koophandel][ref2] en een commanditaire vennootschap als bedoeld in
      [artikel 19 van het Wetboek van Koophandel][ref3], alsmede een maatschap of vennootschap naar buitenlands recht die
      met deze rechtsvormen vergelijkbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1655
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0001838#Artikel19
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: '1655'
      - id: ref2
        bwb_id: BWBR0001838
        artikel: '16'
      - id: ref3
        bwb_id: BWBR0001838
        artikel: '19'
  - number: '4.1'
    text: |-
      Een instelling voldoet aan [artikel 3, tweede lid, onderdelen a en b][ref1], voordat de zakelijke relatie wordt
      aangegaan of een incidentele transactie als bedoeld in [artikel 3, derde lid, onderdeel b][ref2], wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel3
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '4.2'
    text: |-
      In afwijking van het eerste lid is het een instelling toegestaan de identiteit van de cliënt en, indien van
      toepassing, de identiteit van de uiteindelijk belanghebbende te verifiëren tijdens het aangaan van de zakelijke
      relatie, indien dit noodzakelijk is om de dienstverlening niet te verstoren en indien er weinig risico op witwassen
      of financieren van terrorisme bestaat. In dat geval verifieert de instelling de identiteit zo spoedig mogelijk na
      het eerste contact met de cliënt.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel4
  - number: '4.3'
    text: |-
      In afwijking van het eerste lid is het een instelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 5°][ref1], toegestaan de begunstigde van een polis te identificeren en
      de identiteit te verifiëren nadat de zakelijke relatie is aangegaan. In dat geval vindt het identificeren en het
      verifiëren van de identiteit plaats op of voor het tijdstip van uitbetaling, dan wel op of voor het tijdstip waarop
      de begunstigde zijn rechten krachtens de polis wil uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '1'
        hoofdstuk: '1'
  - number: '4.4'
    text: |-
      In afwijking van het eerste lid is het een bank als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°][ref1], toegestaan een rekening te openen voordat de verificatie van
      de identiteit van de cliënt heeft plaatsgevonden, indien zij waarborgt dat deze rekening niet kan worden gebruikt
      voordat de verificatie heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '1'
        hoofdstuk: '1'
  - number: '4.5'
    text: |-
      In afwijking van het eerste lid kan een notaris, toegevoegd notaris of kandidaat-notaris als bedoeld
      in [artikel 1, eerste lid, onderdeel a, onder 12°][ref1], de identiteit van de cliënt en, indien van
      toepassing, van de uiteindelijk belanghebbende verifiëren op het moment dat identificatie op grond van
      [artikel 39 van de Wet op het notarisambt][ref2] is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel39
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: '39'
  - number: '5.1'
    text: |-
      Onverminderd [artikel 4][ref1] is het een instelling verboden een zakelijke relatie aan te gaan met of een
      transactie uit te voeren voor een cliënt, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel4
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 5.1.a
    text: |-
      zij zelf ten aanzien van die cliënt onderzoek heeft verricht conform [artikel 3][ref1], of ten aanzien van die
