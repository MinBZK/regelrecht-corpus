      rechtspersonen die effecten hebben uitgegeven die in een lidstaat zijn toegelaten tot de handel op een
      gereglementeerde markt als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
