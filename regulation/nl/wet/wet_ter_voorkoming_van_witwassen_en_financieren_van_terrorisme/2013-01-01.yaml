        artikel: '1'
  - number: 6.1.e
    text: |-
      cliënten die tijdelijk gelden aanhouden op rekeningen op naam van notarissen, advocaten en andere onafhankelijke
      beoefenaren van juridische beroepen. Voor zover de rekeninghouders niet in een lidstaat gevestigd zijn, is deze
      bepaling slechts van toepassing indien op hen wettelijke voorschriften van toepassing zijn ter voorkoming van
      witwassen en financieren van terrorisme die overeenkomen met het bepaalde in deze wet en de informatie over de
      identiteit van de cliënten op verzoek beschikbaar is voor de desbetreffende instelling;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel6
  - number: 6.1.f
    text: Nederlandse overheidsinstanties;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel6
  - number: 6.1.g
    text: 'instanties:'
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel6
  - number: 6.1.g.1°
    text: |-
      die zijn belast met openbare functies uit hoofde van het Verdrag betreffende de Europese Unie, de verdragen tot
      oprichting van de Europese Gemeenschappen of de afgeleide communautaire wetgeving;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel6
  - number: 6.1.g.2°
    text: waarvan de identiteit bekend is;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel6
  - number: 6.1.g.3°
    text: waarvan de activiteiten en boekhoudkundige praktijken transparant zijn; en
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel6
  - number: 6.1.g.4°
    text: |-
      die verantwoording schuldig zijn aan een instelling van de Europese Gemeenschappen of aan een overheidsinstantie
      van een lidstaat of ten aanzien waarvan andere gepaste procedures bestaan om de activiteiten te controleren.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel6
  - number: '6.2'
    text: |-
      Een instelling verzamelt voldoende gegevens om te kunnen vaststellen of het eerste lid op een cliënt van toepassing
      is.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel6
  - number: '6.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen categorieën cliënten worden aangewezen waarop het eerste lid van
      overeenkomstige toepassing is.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel6
  - number: '6.4'
    text: Onze Minister van Financiën wijst de staten aan als bedoeld in het eerste lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel6
  - number: '7.1'
    text: |-
      [Artikel 3, eerste lid, derde lid, aanhef en onderdelen a, b en d, en vierde lid][ref1], alsmede
      [artikel 4, eerste lid][ref2], zijn niet van toepassing voor zover het betreft zakelijke relaties of transacties
      met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel4
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 7.1.a
    text: |-
      levensverzekeringsovereenkomsten als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1], waarvan
      het bedrag van de jaarlijks te betalen premie € 1 000 of minder bedraagt of waarvan het bedrag van de eenmalige
      premie € 2 500 of minder bedraagt;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 7.1.b
    text: |-
      producten met betrekking tot een pensioen als bedoeld in [artikel 1 van de Pensioenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
  - number: 7.1.c
    text: |-
      elektronisch geld als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1], waarvan:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 7.1.c.1°
    text: |-
      indien de geldswaarde die is opgeslagen op de elektronische drager of die op afstand is opgeslagen in een centrale
      rekeningadministratie niet kan worden heropgeladen, het maximumbedrag niet meer dan € 250 bedraagt; of
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel7
  - number: 7.1.c.2°
    text: |-
      indien de geldswaarde die is opgeslagen op de elektronische drager of die op afstand is opgeslagen in een centrale
      rekeningadministratie kan worden opgeladen, het totaalbedrag van de transacties die in een kalenderjaar kunnen
      worden verricht niet meer dan € 2.500 bedraagt, tenzij de houder een bedrag van € 1 000 of meer heeft laten
      terugbetalen in datzelfde kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel7
  - number: '7.2'
    text: |-
      Een instelling verzamelt voldoende gegevens om te kunnen vaststellen of het eerste lid op een product van
      toepassing is.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel7
  - number: '7.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen producten of transacties worden aangewezen waarop het eerste lid van
      overeenkomstige toepassing is.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel7
  - number: '7.4'
    text: Voor nationale betalingstransacties wordt het in het eerste lid genoemde bedrag van € 250 verdubbeld.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel7
  - number: '8.1'
    text: |-
      Een instelling verricht, onverminderd [artikel 3, tweede, derde en vierde lid][ref1], verscherpt cliëntenonderzoek
      indien en naar gelang een zakelijke relatie of transactie naar haar aard of in verband met de staat waar de cliënt
      woonachtig of gevestigd is of zijn zetel heeft een hoger risico op witwassen of financieren van terrorisme met zich
      brengt. Bij ministeriële regeling kunnen categorieën zakelijke relaties en transacties worden aangewezen die naar
      hun aard een hoger risico op witwassen of financieren van terrorisme met zich brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel3
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '8.2'
    text: |-
      Onverminderd het eerste lid neemt een instelling, indien een cliënt niet fysiek aanwezig is voor verificatie van
      diens identiteit, maatregelen om het hogere risico te compenseren. De instelling kan aan de vorige volzin voldoen
      indien zij:
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel8
  - number: 8.2.a
    text: de identiteit van de cliënt verifieert aan de hand van aanvullende documenten, gegevens of informatie;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel8
  - number: 8.2.b
    text: de overgelegde documenten beoordeelt op echtheid; of
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel8
  - number: 8.2.c
    text: |-
      waarborgt dat de eerste betaling die met de zakelijke relatie of transactie verband houdt, wordt gedaan ten gunste
      of ten laste van een rekening van de cliënt bij een bank met zetel in een lidstaat of in een door Onze Minister
      van Financiën aangewezen staat die beschikt over een vergunning om in die lidstaat onderscheidenlijk die staat haar
      bedrijf te mogen uitoefenen.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel8
  - number: '8.3'
    text: |-
      Onverminderd het eerste lid draagt een bank die een correspondentbankrelatie aangaat of is aangegaan met een bank
      in een staat die geen lidstaat is er zorg voor dat:
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel8
  - number: 8.3.a
    text: |-
      zij voldoende informatie over de betrokken bank verzamelt om een volledig beeld te krijgen van de aard van haar
      bedrijfsactiviteiten, en op basis van openbaar beschikbare informatie de reputatie van de bank en de kwaliteit van
      het toezicht dat op de bank wordt uitgeoefend beoordeelt;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel8
  - number: 8.3.b
    text: |-
      zij de procedures en maatregelen ter voorkoming van witwassen en financieren van terrorisme van de betrokken bank
      beoordeelt;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel8
  - number: 8.3.c
    text: |-
      indien het een nieuwe correspondentbankrelatie betreft, de beslissing tot het aangaan van die relatie wordt genomen
      of goedgekeurd door personen die daartoe door de bank gemachtigd zijn;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel8
  - number: 8.3.d
    text: de verantwoordelijkheden van beide banken schriftelijk worden vastgelegd;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel8
  - number: 8.3.e
    text: |-
      de betrokken bank de cliënt heeft geïdentificeerd en zijn identiteit heeft geverifieerd en daarnaast doorlopend
      toezicht houdt op de cliënten die rechtstreeks toegang hebben tot transitrekeningen en dat deze in staat is om haar
      op verzoek de relevante cliëntgegevens te verstrekken.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel8
  - number: '8.4'
    text: |-
      Een instelling draagt er zorg voor dat zij over op risico gebaseerde procedures beschikt om te bepalen of de
      cliënt of de uiteindelijk belanghebbende een politiek prominent persoon is die niet in Nederland woont of niet
      de Nederlandse nationaliteit heeft. Onverminderd het eerste lid draagt een instelling die een zakelijke relatie
      aangaat of voortzet met of een transactie verricht voor een cliënt waarop de eerste volzin van toepassing is, er
      tevens zorg voor dat:
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel8
  - number: 8.4.a
    text: |-
      de beslissing tot het aangaan van die relatie of het verrichten van die transactie wordt genomen of wordt
      goedgekeurd door personen die daartoe door de instelling zijn gemachtigd;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel8
  - number: 8.4.b
    text: |-
      zij op risico gebaseerde en adequate maatregelen treft om de bron van het vermogen van de politiek prominente
      persoon en de fondsen die bij de zakelijke relatie of de transactie gebruikt worden vast te stellen; en
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel8
  - number: 8.4.c
    text: zij doorlopend controle uitoefent op de zakelijke relatie.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel8
  - number: '8.5'
    text: |-
      Indien de cliënt of een uiteindelijk belanghebbende gedurende de zakelijke relatie een politiek prominent persoon
      wordt of blijkt te zijn, voldoet de instelling binnen een redelijke termijn aan het vierde lid.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel8
  - number: '8.6'
    text: |-
      Bij ministeriële regeling kan vrijstelling worden geregeld van het vierde of vijfde lid terzake van personen die in
      Nederland wonen.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel8
  - number: '8.7'
    text: |-
      Onze Minister van Financiën kan op verzoek van een instelling, al dan niet voor bepaalde tijd, aan die instelling
      ontheffing verlenen van het vierde of vijfde lid terzake van personen die in Nederland wonen. Aan een ontheffing
      kunnen beperkingen worden gesteld en voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel8
  - number: '9.1'
    text: |-
      Onverminderd [artikel 8, eerste lid][ref1], kan bij ministeriële regeling worden bepaald dat bij die regeling
      aangewezen instellingen bijzondere maatregelen nemen met betrekking tot cliënten die woonachtig of gevestigd zijn
      of hun zetel hebben in bij die regeling aangewezen staten met strategische tekortkomingen in de preventie van
      witwassen en financieren van terrorisme of transacties, zakelijke relaties en correspondentbankrelaties gerelateerd
      aan die staten. In de regeling kan onderscheid worden gemaakt naar categorie instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel8
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '9.2'
    text: |-
      Als bijzondere maatregelen met betrekking tot cliënten die woonachtig of gevestigd zijn of hun zetel hebben in een
      ingevolge het eerste lid aangewezen staat en hun uiteindelijk belanghebbenden kunnen worden aangewezen:
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel9
  - number: 9.2.a
    text: |-
      verzamelen van aanvullende informatie over die cliënten en uiteindelijk belanghebbenden, waaronder informatie
      met betrekking tot het doel en de aard van de zakelijke relatie, de herkomst van de fondsen die bij de zakelijke
      relatie of de transactie gebruikt worden en de bron van het vermogen van die cliënten en van die uiteindelijk
      belanghebbenden;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel9
  - number: 9.2.b
    text: verhoogde frequentie van actualiseringen van gegevens over die cliënten en die uiteindelijk belanghebbenden;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel9
  - number: 9.2.c
    text: verscherpte controle op de zakelijke relatie met en de transacties van die cliënten;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel9
  - number: 9.2.d
    text: |-
      verzamelen van aanvullende informatie over de achtergrond van en beweegredenen voor voorgenomen of verrichte
      transacties van die cliënten;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel9
  - number: 9.2.e
    text: |-
      bij algemene maatregel van bestuur aan te wijzen maatregelen die strekken tot het beheersen of beperken van
      risico’s gerelateerd aan die cliënten en uiteindelijk belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel9
  - number: '9.3'
    text: |-
      Als bijzondere maatregelen met betrekking tot transacties, zakelijke relaties en correspondentbankrelaties
      gerelateerd aan een ingevolge het eerste lid aangewezen staat kunnen worden aangewezen:
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel9
  - number: 9.3.a
    text: verscherpte controle op die transacties, zakelijke relaties en correspondentbankrelaties;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel9
  - number: 9.3.b
    text: beperking van die transacties, zakelijke relaties en correspondentbankrelaties;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel9
  - number: 9.3.c
    text: niet uitvoeren van die transacties en beëindiging van die zakelijke relaties en correspondentbankrelaties;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel9
  - number: 9.3.d
    text: |-
      bij algemene maatregel van bestuur aan te wijzen maatregelen die strekken tot het beheersen of beperken van
      risico’s gerelateerd aan die transacties, zakelijke relaties en correspondentbankrelaties.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel9
  - number: '10.1'
    text: |-
      Een instelling kan het cliëntenonderzoek, bedoeld in [artikel 3, eerste lid][ref1], voor zover het betrekking heeft
      op het in het [tweede lid, onderdelen a, b, en c, van dat artikel][ref2] bepaalde, laten verrichten door een derde,
      onverminderd haar verplichting om te voldoen aan het in die onderdelen bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel3
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '10.2'
    text: |-
      Indien de in het eerste lid bedoelde uitbesteding een structureel karakter heeft legt de instelling de opdracht
      daartoe schriftelijk vast.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel10
  - number: '11.1'
    text: |-
      Indien de cliënt een natuurlijke persoon is, wordt diens identiteit geverifieerd aan de hand van documenten,
      gegevens of inlichtingen uit betrouwbare en onafhankelijke bron. Bij ministeriële regeling kunnen documenten,
      gegevens of inlichtingen worden aangewezen op basis waarvan kan worden voldaan aan het in de vorige zin bepaalde.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel11
  - number: '11.2'
    text: |-
      Indien de cliënt een rechtspersoon is opgericht naar Nederlands recht en in Nederland zijn zetel heeft of een
      buitenlandse rechtspersoon is die in Nederland is gevestigd, wordt diens identiteit geverifieerd aan de hand van
      documenten, gegevens of inlichtingen uit betrouwbare en onafhankelijke bron. Bij ministeriële regeling kunnen
      documenten, gegevens of inlichtingen worden aangewezen op basis waarvan kan worden voldaan aan het in de vorige
      zin bepaalde.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel11
  - number: '11.3'
    text: |-
      Indien de cliënt een buitenlandse rechtspersoon is die niet in Nederland is gevestigd, wordt de identiteit
      geverifieerd op basis van betrouwbare en in het internationale verkeer gebruikelijke documenten uit onafhankelijke
      bron, gegevens of inlichtingen of op basis van documenten, gegevens of inlichtingen die bij wet als geldig middel
      voor identificatie zijn erkend in de staat van herkomst van de cliënt.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel11
  - number: '11.4'
    text: |-
      Bij ministeriële regeling kunnen regels worden vastgesteld met betrekking tot het verifiëren van de identiteit van
      cliënten die niet onder het eerste tot en met het derde lid vallen.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel11
  - number: '12.1'
    text: Er is een Financiële inlichtingen eenheid.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel12
  - number: '12.2'
    text: |-
      De Financiële inlichtingen eenheid ongebruikelijke transacties is de verantwoordelijke autoriteit als bedoeld in de
      [Verordening nr. 2006/1781/EG](33681R2006) van het Europees Parlement en de Raad betreffende bij geldovermakingen
      te voegen informatie over de betaler.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel12
  - number: '12.3'
    text: |-
      De algemene leiding, de organisatie en het beheer van de Financiële inlichtingen eenheid berusten bij Onze Minister
      van Justitie.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel12
  - number: '12.4'
    text: |-
      Benoeming, schorsing en ontslag van het hoofd van de Financiële inlichtingen eenheid geschieden bij koninklijk
      besluit op voordracht van Onze Minister van Justitie, in overeenstemming met Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel12
  - number: '12.5'
    text: |-
      Onze Minister van Justitie bepaalt in overeenstemming met Onze Minister van Financiën de begroting van de
      Financiële inlichtingen eenheid.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel12
  - number: '13'
    text: |-
      De Financiële inlichtingen eenheid heeft met het oog op het voorkomen en opsporen van witwassen en financieren van
      terrorisme tot taak:
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel13
  - number: 13.a
    text: |-
      het verzamelen, registreren, bewerken en analyseren van de gegevens die het verkrijgt, teneinde te bezien of deze
      gegevens van belang kunnen zijn voor het voorkomen en opsporen van misdrijven;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel13
  - number: 13.b
    text: |-
      het verstrekken van persoonsgegevens en andere gegevens in overeenstemming met deze wet en het bij of krachtens de
      [Wet politiegegevens][ref1] bepaalde;


      [ref1]: https://wetten.overheid.nl/BWBR0022463
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0022463
  - number: 13.c
    text: |-
      een instelling berichten over de ontvangst van een melding door die instelling, de ontvangst van nadere gegevens
      of inlichtingen verstrekt door die instelling, alsmede over trends en fenomenen die naar voren komen uit ontvangen
      meldingen, en in voorkomende gevallen, door tussenkomst van het openbaar ministerie, over de betekenis van een
      melding door die instelling voor de vervolging van strafbare feiten;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel13
  - number: 13.d
    text: |-
      het verrichten van onderzoek naar ontwikkelingen op het gebied van witwassen en financieren van terrorisme en naar
      de verbetering van de methoden om witwassen en financieren van terrorisme te voorkomen en op te sporen;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel13
  - number: 13.e
    text: |-
      het geven van aanbevelingen voor de bedrijfstakken omtrent de invoering van passende procedures voor interne
      controle en communicatie en andere te treffen maatregelen tot voorkoming van het gebruik van die bedrijfstakken
      voor witwassen en financieren van terrorisme;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel13
  - number: 13.f
    text: 'het geven van voorlichting omtrent het voorkomen en opsporen van witwassen en financieren van terrorisme aan:'
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel13
  - number: 13.f.1°
    text: de bedrijfstakken en beroepsgroepen;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel13
  - number: 13.f.2°
    text: |-
      de personen die krachtens [artikel 24][ref1] met het toezicht op de naleving van deze wet zijn belast;


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel24
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '24'
        hoofdstuk: '4'
  - number: 13.f.3°
    text: het openbaar ministerie en de overige ambtenaren belast met de opsporing van strafbare feiten;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel13
  - number: 13.f.4°
    text: het publiek;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel13
  - number: 13.g
    text: |-
      het geven van inlichtingen aangaande het meldgedrag van de instellingen aan de personen die krachtens
      [artikel 24][ref1] met het toezicht op de naleving van deze wet zijn belast;


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel24
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '24'
        hoofdstuk: '4'
  - number: 13.h
    text: |-
      het onderhouden van contacten met buitenlandse van overheidswege aangewezen instanties die een vergelijkbare taak
      hebben als de Financiële inlichtingen eenheid;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel13
  - number: 13.i
    text: |-
      het jaarlijks uitbrengen van een verslag met betrekking tot de taakuitoefening en zijn werkzaamheden in het
      voorafgaande jaar en van zijn voornemens voor het komende jaar, dat wordt aangeboden aan Onze Minister van Justitie
      en ter kennis gebracht van Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel13
  - number: '14.1'
    text: |-
      Bij de Financiële inlichtingen eenheid kunnen persoonsgegevens worden verwerkt ten behoeve van de taak, bedoeld
      in [artikel 13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel13
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '14.2'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over de categorieën van personen waarover de Financiële
      inlichtingen eenheid gegevens verwerkt, de gegevensverstrekking en verbanden met andere verzamelingen van
      persoonsgegevens, de bewaring en vernietiging van gegevens en de protocolplicht.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel14
  - number: '14.3'
    text: |-
      Op de verwerking van persoonsgegevens door de Financiële inlichtingen eenheid zijn de [artikelen 1][ref1],
      [2][ref2], [3, eerste en tweede lid][ref3], [4][ref4], [5][ref5], [6][ref6], [7][ref7], [15][ref8],
      [16, eerste lid, onderdelen a, b en c][ref9], [17][ref10], [18][ref11], [22][ref12] en [23][ref13],
      [25 tot en met 31][ref14], alsmede [artikel 33 van de Wet politiegegevens][ref15] van overeenkomstige
      toepassing, met dien verstande dat voor de Financiële inlichtingen eenheid als verantwoordelijke in de zin van
      [artikel 1, onderdeel f, van die wet][ref16] wordt aangemerkt Onze Minister van Veiligheid en Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0022463#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0022463#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0022463#Artikel6
      [ref7]: https://wetten.overheid.nl/BWBR0022463#Artikel7
      [ref8]: https://wetten.overheid.nl/BWBR0022463#Artikel15
      [ref9]: https://wetten.overheid.nl/BWBR0022463#Artikel16
      [ref10]: https://wetten.overheid.nl/BWBR0022463#Artikel17
      [ref11]: https://wetten.overheid.nl/BWBR0022463#Artikel18
      [ref12]: https://wetten.overheid.nl/BWBR0022463#Artikel22
      [ref13]: https://wetten.overheid.nl/BWBR0022463#Artikel23
      [ref14]: https://wetten.overheid.nl/BWBR0022463#Artikel25
      [ref15]: https://wetten.overheid.nl/BWBR0022463#Artikel33
      [ref16]: https://wetten.overheid.nl/BWBR0022463#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel14
    references:
      - id: ref1
