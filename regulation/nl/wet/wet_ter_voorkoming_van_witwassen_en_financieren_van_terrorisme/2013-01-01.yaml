        artikel: '33'
      - id: ref16
        bwb_id: BWBR0022463
        artikel: '1'
  - number: '15.1'
    text: |-
      Bij algemene maatregel van bestuur worden, zo nodig per daarbij te onderscheiden categorieën transacties,
      indicatoren vastgesteld aan de hand waarvan wordt beoordeeld of een transactie wordt aangemerkt als een
      ongebruikelijke transactie.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel15
  - number: '15.2'
    text: |-
      Indien het spoedeisende belang dat vereist, kunnen bij regeling van Onze Minister van Financiën en Onze Minister
      van Justitie gezamenlijk de indicatoren, bedoeld in het eerste lid, worden vastgesteld voor een termijn van ten
      hoogste zes maanden.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel15
  - number: '16.1'
    text: |-
      Een instelling meldt een verrichte of voorgenomen ongebruikelijke transactie onverwijld nadat het ongebruikelijke
      karakter van de transactie bekend is geworden, aan de Financiële inlichtingen eenheid.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel16
  - number: '16.2'
    text: 'Bij een melding als bedoeld in het eerste lid verstrekt de instelling de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel16
  - number: 16.2.a
    text: |-
      de identiteit van de cliënt en, voor zover mogelijk, de identiteit van degene ten behoeve van wie de transactie
      wordt uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel16
  - number: 16.2.b
    text: de aard en het nummer van het identiteitsbewijs van de cliënt;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel16
  - number: 16.2.c
    text: de aard, het tijdstip en de plaats van de transactie;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel16
  - number: 16.2.d
    text: |-
      de omvang en de bestemming en herkomst van de gelden, effecten, edele metalen of andere waarden die bij de
      transactie betrokken zijn;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel16
  - number: 16.2.e
    text: de omstandigheden op grond waarvan de transactie als ongebruikelijk wordt aangemerkt;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel16
  - number: 16.2.f
    text: een omschrijving van de desbetreffende zaken van grote waarde bij een transactie boven de € 15 000;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel16
  - number: 16.2.g
    text: aanvullende, bij algemene maatregel van bestuur aan te wijzen, gegevens.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel16
  - number: '16.3'
    text: |-
      In afwijking van het tweede lid verstrekt een taxateur als bedoeld in [artikel 1, onderdeel a, onder 24°][ref1],
      de gegevens bedoeld in het tweede lid voor zover zij daarover beschikt, alsmede een beschrijving van de
      desbetreffende onroerende zaken en rechten waaraan onroerende zaken zijn onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '1'
        hoofdstuk: '1'
  - number: '16.4'
    text: |-
      De meldingsplicht, bedoeld in het eerste lid, is van overeenkomstige toepassing indien een cliëntenonderzoek als
      bedoeld in [artikel 3, eerste lid][ref1], niet leidt tot het in artikel 3, tweede lid, aanhef en onderdelen a, b,
      c, e, f en g, derde lid, aanhef en onderdelen a, b, c en e, en vierde lid, aanhef en onderdelen a, b, c, d, f en g,
      bedoelde resultaat of een zakelijke relatie wordt beëindigd ingevolge [artikel 5, tweede lid][ref2], en er tevens
      indicaties zijn dat de desbetreffende cliënt betrokken is bij witwassen of financieren van terrorisme. Bij de
      melding van een dergelijke transactie ingevolge het eerste lid verstrekt een instelling naast de gegevens bedoeld
      in het tweede lid een beschrijving van de redenen waarom het cliëntenonderzoek niet leidde tot het in artikel 5,
      eerste lid, onderdeel b, bedoelde resultaat, of de redenen waarom niet kon worden voldaan aan de verplichtingen,
      bedoeld in artikel 5, tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel5
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '17.1'
    text: |-
      De Financiële inlichtingen eenheid kan ten behoeve van de uitvoering van haar taak als bedoeld in
      [artikel 13, onderdeel b][ref1], bij de instelling die een melding heeft gedaan, alsmede bij de instelling die
      bij een transactie is betrokken waarover de Financiële inlichtingen eenheid gegevens heeft verzameld, nadere
      inlichtingen vragen.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel13
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '17.2'
    text: |-
      De instelling waaraan overeenkomstig het eerste lid deze gegevens of inlichtingen zijn gevraagd, verstrekt deze
      schriftelijk, alsmede in spoedeisende gevallen mondeling, aan de Financiële inlichtingen eenheid binnen de door de
      Financiële inlichtingen eenheid gestelde termijn.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel17
  - number: '18'
    text: |-
      De Financiële inlichtingen eenheid bepaalt de wijze waarop een melding moet worden gedaan, of gegevens of
      inlichtingen als bedoeld in [artikel 17, eerste lid][ref1], moeten worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel17
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '19.1'
    text: |-
      Gegevens of inlichtingen die in overeenstemming met de [artikelen 16][ref1] of [17][ref2] te goeder trouw zijn
      verstrekt, kunnen niet dienen als grondslag voor of ten behoeve van een opsporingsonderzoek of een vervolging
      wegens verdenking van, of als bewijs ter zake van een tenlastelegging wegens witwassen of financieren van
      terrorisme door de instelling die deze gegevens of inlichtingen heeft verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel17
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '19.2'
    text: |-
      Gegevens of inlichtingen die zijn verstrekt in de redelijke veronderstelling dat uitvoering wordt gegeven aan de
      [artikelen 16][ref1] of [17][ref2] kunnen niet dienen als grondslag voor of ten behoeve van een opsporingsonderzoek
      of een vervolging wegens verdenking van, of als bewijs ter zake van een tenlastelegging wegens, overtreding van
      [artikel 272 van het Wetboek van Strafrecht][ref3] door de instelling die deze gegevens of inlichtingen heeft
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel272
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '272'
  - number: '19.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing ten aanzien van personen die werkzaam zijn voor een
      instelling die gegevens of inlichtingen heeft verstrekt als omschreven in het eerste of tweede lid en die daaraan
      hebben meegewerkt.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel19
  - number: '20.1'
    text: |-
      Een instelling die op grond van [artikel 16][ref1] een melding heeft gedaan of op grond van [artikel 17][ref2]
      nadere inlichtingen heeft verstrekt in de redelijke veronderstelling uitvoering te geven aan die artikelen, is niet
      aansprakelijk voor enige schade die een derde dientengevolge lijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel17
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '20.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van personen die werkzaam zijn voor een instelling
      die een melding heeft gedaan of inlichtingen heeft verstrekt als omschreven in het eerste lid en die daaraan hebben
      meegewerkt.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel20
  - number: '21.1'
    text: Er is een Commissie inzake de meldingsplicht van ongebruikelijke transacties.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel21
  - number: '21.2'
    text: |-
      De commissie treedt periodiek in overleg met vertegenwoordigers van Onze Minister van Justitie en Onze Minister van
      Financiën over:
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel21
  - number: 21.2.a
    text: de inrichting en uitvoering van de meldingsplicht;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel21
  - number: 21.2.b
    text: |-
      de vaststelling van de indicatoren bedoeld in [artikel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel15
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '21.3'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de samenstelling en de organisatie van de
      commissie.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel21
  - number: '22.1'
    text: |-
      Het is aan een ieder die uit hoofde van de toepassing van deze wet of van krachtens deze wet genomen besluiten
      enige taak vervult of heeft vervuld verboden van gegevens of inlichtingen, die ingevolge deze wet zijn verstrekt of
      ontvangen, of van een buitenlandse toezichthoudende instantie zijn ontvangen, verder of anders gebruik te maken of
      daaraan verder of anders bekendheid te geven dan voor de uitoefening van zijn taak of door deze wet wordt geëist.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel22
  - number: '22.2'
    text: |-
      Een toezichthouder is in afwijking van het eerste lid bevoegd gegevens of inlichtingen, die ingevolge deze wet zijn
      verstrekt of ontvangen of van een buitenlandse toezichthoudende instantie zijn ontvangen, te verstrekken aan een
      andere toezichthouder of aan een buitenlandse toezichthoudende instantie, tenzij:
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel22
  - number: 22.2.a
    text: het doel waarvoor de gegevens of inlichtingen zullen worden gebruikt onvoldoende bepaald is;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel22
  - number: 22.2.b
    text: |-
      het beoogde gebruik van de gegevens of inlichtingen niet past in het kader van het toezicht op wetgeving ter
      voorkoming van witwassen en financieren van terrorisme;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel22
  - number: 22.2.c
    text: de verstrekking van de gegevens of inlichtingen zich niet zou verdragen met de Nederlandse wet of de openbare orde;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel22
  - number: 22.2.d
    text: de geheimhouding van de gegevens of inlichtingen niet in voldoende mate is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel22
  - number: 22.2.e
    text: |-
      de verstrekking van de gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met de belangen die
      deze wet beoogt te beschermen; of
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel22
  - number: 22.2.f
    text: |-
      onvoldoende is gewaarborgd dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel22
  - number: '22.3'
    text: |-
      Voor zover de gegevens of inlichtingen, bedoeld in het tweede lid, zijn verkregen van een buitenlandse
      toezichthoudende instantie, verstrekt een toezichthouder deze niet aan een andere toezichthouder of aan een andere
      buitenlandse toezichthoudende instantie, tenzij de buitenlandse toezichthoudende instantie waarvan de gegevens of
      inlichtingen zijn verkregen uitdrukkelijk heeft ingestemd met de verstrekking van de gegevens of inlichtingen en
      in voorkomend geval heeft ingestemd met het gebruik voor een ander doel dan waarvoor de gegevens of inlichtingen
      zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel22
  - number: '22.4'
    text: |-
      Indien een buitenlandse toezichthoudende instantie aan de toezichthouder die de gegevens of inlichtingen op grond
      van het tweede of derde lid heeft verstrekt, verzoekt om die gegevens of inlichtingen te mogen gebruiken voor een
      ander doel dan waarvoor zij zijn verstrekt, willigt de toezichthouder dat verzoek slechts in:
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel22
  - number: 22.4.a
    text: |-
      indien het beoogde gebruik niet in strijd is met het tweede of derde lid of voorzover die toezichthoudende
      instantie op een andere wijze dan in deze wet voorzien vanuit Nederland met inachtneming van de daarvoor geldende
      wettelijke procedures voor dat andere doel de beschikking over die gegevens of inlichtingen zou kunnen verkrijgen;
      en
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel22
  - number: 22.4.b
    text: |-
      na overleg met Onze Minister van Veiligheid en Justitie indien het in de aanhef bedoelde verzoek betrekking heeft
      op een onderzoek naar strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel22
  - number: '22.5'
    text: |-
      In dit artikel wordt verstaan onder toezichthouder: Onze Minister van Financiën of een persoon aan wie Onze
      Minister van Financiën bevoegdheden heeft overgedragen op grond van [artikel 31][ref1], alsmede de toezichthouder,
      bedoeld in [artikel 1 van de Wet toezicht trustkantoren][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0016189#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '31'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0016189
        artikel: '1'
  - number: '23.1'
    text: |-
      Een instelling en de personen die werkzaam zijn voor een instelling zijn, behoudens voor zover uit deze wet de
      noodzaak tot bekendmaking voortvloeit, verplicht tot geheimhouding jegens een ieder van:
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel23
  - number: 23.1.a
    text: |-
      een melding ingevolge [artikel 16][ref1] door die instelling;


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel16
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 23.1.b
    text: |-
      nadere inlichtingen verstrekt ingevolge [artikel 17][ref1] door die instelling;


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel17
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 23.1.c
    text: |-
      het gegeven dat een melding of verstrekking aanleiding heeft gegeven tot een onderzoek naar witwassen van geld of
      financieren van terrorisme of dat het voornemen bestaat een dergelijk onderzoek te verrichten;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel23
  - number: 23.1.d
    text: |-
      overleg over de naleving van [artikel 16][ref1] met betrekking tot een transactie.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel16
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '23.2'
    text: |-
      De instelling die ingevolge [artikel 13, onderdeel c][ref1], gegevens of inlichtingen verkrijgt, is verplicht tot
      geheimhouding daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel13
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '23.3'
    text: |-
      Een ieder die kennis neemt van gegevens waarvan hij weet of redelijkerwijs moet vermoeden dat ter zake op een
      instelling de geheimhoudingsplicht, bedoeld in het eerste of tweede lid, rust, is verplicht tot geheimhouding
      hiervan, behoudens voor zover uit deze wet de noodzaak tot bekendmaking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel23
  - number: '23.4'
    text: |-
      De in het eerste en derde lid bedoelde geheimhoudingsplicht is niet van toepassing op een mededeling gedaan door
      een instelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 11°, 12° en 13°][ref1], aan een cliënt
      met als doel deze te doen afzien van een onwettige handeling.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '1'
        hoofdstuk: '1'
  - number: '23.5'
    text: 'Het eerste lid is niet van toepassing op mededelingen:'
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel23
  - number: 23.5.1°
    text: |-
      van een instelling aan een andere instelling die behoort tot dezelfde groep en is gevestigd in een lidstaat of een
      derde land;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel23
  - number: 23.5.2°
    text: |-
      tussen instellingen als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 11° tot en met 13°][ref1],
      gevestigd in een lidstaat of een derde land, die hun werkzaamheden, al dan niet als werknemer, uitoefenen binnen
      eenzelfde rechtspersoon of netwerk;


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '1'
        hoofdstuk: '1'
  - number: 23.5.3°
    text: |-
      van een instelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1 tot en met 3, 5 tot en met 9, 11° tot en met 13°][ref1], aan een
      instelling behorende tot dezelfde categorie, voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '1'
        hoofdstuk: '1'
  - number: 23.5.3°.a
    text: |-
      de mededeling betrekking heeft op een cliënt van beide instellingen en een transactie waarbij beide instellingen
      betrokken zijn;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel23
  - number: 23.5.3°.b
    text: |-
      de andere instelling is gevestigd in een lidstaat of een derde land dat eisen stelt die gelijkwaardig zijn op het
      gebied van het beroepsgeheim en de bescherming van persoonsgegevens;
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel23
  - number: 23.5.3°.c
    text: de mededeling uitsluitend is bedoeld ter voorkoming van witwassen en financieren van terrorisme.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel23
  - number: '23.6'
    text: |-
      Voor de toepassing van het vijfde lid wordt verstaan onder: - *groep:* een groep, als omschreven in artikel 2,
      punt 12, van Richtlijn 2002/87/EG van het Europees Parlement en de Raad van 16 december 2002 betreffende het
      aanvullende toezicht op kredietinstellingen, verzekeringsondernemingen en beleggingsondernemingen in een financieel
      conglomeraat (PbEG 2002, L 35);
        - *netwerk:* de grotere structuur waartoe de persoon behoort en die eigendom, beheer en controle op de naleving van
      de verplichtingen gezamenlijk deelt;
        - *derde land:* een door Onze Minister van Financiën aangewezen staat waar eisen zijn gesteld die gelijkwaardig
      zijn aan de eisen gesteld bij of krachtens deze wet en waar toezicht wordt uitgeoefend op de naleving van die
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel23
  - number: '24.1'
    text: |-
      Bij besluit van Onze Minister van Financiën en Onze Minister van Justitie gezamenlijk kunnen personen worden
      aangewezen die belast zijn met het toezicht op de naleving door de instellingen van deze wet.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel24
  - number: '24.2'
    text: |-
      De personen die op grond van het eerste lid belast zijn met het toezicht op de instellingen, bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 10° tot en met 15° en 23°][ref1], kunnen het toezicht op een
      risicogeoriënteerde wijze uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '1'
        hoofdstuk: '1'
  - number: '24.3'
    text: |-
      De Nederlandsche Bank N.V. en de daartoe bij besluit van De Nederlandsche Bank N.V. aangewezen personen zijn belast
      met het toezicht op de naleving van de [Verordening nr. 2006/1781/EG](33681R2006) van het Europees Parlement en de
      Raad betreffende bij geldovermakingen te voegen informatie over de betaler.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel24
  - number: '24.4'
    text: |-
      De Stichting Autoriteit Financiële Markten en de daartoe bij besluit van de Stichting Autoriteit Financiële
      Markten aangewezen personen zijn belast met het toezicht op de naleving van Verordening (EU) nr. 1031/2010 van
      de Europese Commissie van 12 november 2010 inzake de tijdstippen, het beheer en andere aspecten van de veiling
      van broeikasgasemissierechten overeenkomstig Richtlijn 2003/87/EG van het Europees Parlement en de Raad tot
      vaststelling van een regeling voor de handel in broeikasgasemissierechten binnen de Gemeenschap (PbEU L 302).
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel24
  - number: '24.5'
    text: |-
      Op de uitoefening door de personen, bedoeld in het eerste lid, van het toezicht op de naleving van het
      bepaalde bij of krachtens deze wet door notarissen, toegevoegd notarissen en kandidaat-notarissen is
      [artikel 111a, derde lid, van de Wet op het notarisambt][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel111a
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: 111a
  - number: '24.6'
    text: |-
      Van een besluit tot aanwijzing op grond van het eerste lid wordt mededeling gedaan door plaatsing in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel24
  - number: '24.7'
    text: |-
      Bij ministeriële regeling kunnen banken die deel uitmaken van een groep banken die op 15 december 1977 blijvend was
      aangesloten bij een centrale kredietinstelling die controle uitoefent op de bedrijfsvoering en uitbesteding van die
      banken worden vrijgesteld van het toezicht door de Nederlandsche Bank N.V. op de naleving van deze wet, indien de
      centrale kredietinstelling toezicht houdt op die groep banken en in voldoende mate bevoegd is voor de naleving van
      deze wet noodzakelijke instructies te geven aan die banken. Aan deze vrijstelling kunnen beperkingen worden gesteld
      en voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel24
  - number: '25'
    text: |-
      Indien de personen die met wettelijk toezicht op instellingen zijn belast bij de uitoefening van hun taak feiten
      ontdekken die kunnen duiden op witwassen of financieren van terrorisme, lichten zij, zo nodig in afwijking van de
      toepasselijke wettelijke geheimhoudingsbepalingen, de Financiële inlichtingen eenheid in.
    url: https://wetten.overheid.nl/BWBR0024282/2013-01-01#Artikel25
  - number: '26.1'
    text: |-
      Onze Minister van Financiën kan een last onder dwangsom opleggen ter zake van overtreding
      van de [artikelen 2][ref1], [3, eerste tot en met derde en zevende lid][ref2],
      [4, eerste lid, tweede lid, tweede volzin, derde lid, tweede volzin, en vierde lid][ref3],
      [5, eerste en derde lid][ref4], [6, tweede lid][ref5], [7, tweede lid][ref6], [8][ref7], [10, tweede lid][ref8],
      [11][ref9], [16][ref10], [17, tweede lid][ref11], [23 eerste en tweede lid][ref12], [33][ref13], [34][ref14] en
      [35][ref15] van deze wet, [artikel 5:20 van de Algemene wet bestuursrecht][ref16], het bepaalde in [Verordening
      (EG) nr. 2006/1781](33681R2006) van het Europees Parlement en de Raad van de Europese Unie van 15 november 2006
      betreffende bij geldovermakingen te voegen informatie over de betaler (PbEU L 345) en het bepaalde in Verordening
      (EU) nr. 1031/2010 van de Europese Commissie van 12 november 2010 inzake de tijdstippen, het beheer en andere
      aspecten van de veiling van broeikasgasemissierechten overeenkomstig Richtlijn 2003/87/EG van het Europees
      Parlement en de Raad tot vaststelling van een regeling voor de handel in broeikasgasemissierechten binnen de
      Gemeenschap (PbEU L 302).


