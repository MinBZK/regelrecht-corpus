  - number: '27.1'
    text: |-
      Onze Minister van Financiën kan een bestuurlijke boete opleggen ter zake van overtreding
      van de [artikelen 2][ref1], [3, eerste tot en met derde en zevende lid][ref2],
      [4, eerste lid, tweede lid, tweede volzin, derde lid, tweede volzin, en vierde lid][ref3],
