      veiling van broeikasgasemissierechten.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel1d
  - number: 1d.4
    text: |-
      De in het eerste lid genoemde bestuursorganen kunnen, indien een verordening als bedoeld in artikel 288 van het
      Verdrag betreffende de werking van de Europese Unie betrekking heeft op een onderwerp dat verband houdt met de
      voorkoming van witwassen of financieren van terrorisme, bij algemene maatregel van bestuur tevens worden belast met
      de uitvoering en handhaving van de bij of krachtens die verordening gestelde regels.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel1d
  - number: 1d.5
    text: |-
      De bij of krachtens een verordening als bedoeld in het tweede, derde of vierde lid gestelde regels worden voor de
      toepassing van deze wet gelijkgesteld met bij of krachtens deze wet gestelde regels.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel1d
  - number: 1d.6
    text: |-
      De in het eerste lid genoemde bestuursorganen oefenen hun taak uit op een risico gebaseerde en effectieve wijze en
      nemen artikel 48, zesde tot en met achtste lid, van de vierde anti-witwasrichtlijn daarbij in acht.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel1d
  - number: 1d.7
    text: |-
      Bij regeling van Onze Minister van Financiën en Onze Minister van Justitie en Veiligheid kunnen nadere regels
      worden gesteld met betrekking tot de taakuitoefening van de op grond van dit artikel bevoegde bestuursorganen, met
      uitzondering van de deken, bedoeld in het eerste lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel1d
  - number: 1e
    text: |-
      Bij regeling van Onze Minister van Financiën en Onze Minister van Justitie en Veiligheid kunnen banken die deel
      uitmaken van een groep banken die blijvend is aangesloten bij een centrale kredietinstelling die controle uitoefent
      op de bedrijfsvoering en uitbesteding van die banken worden vrijgesteld van het toezicht door de Nederlandsche
      Bank N.V., indien de centrale kredietinstelling toezicht houdt op die groep banken en in voldoende mate bevoegd
      is voor de naleving van deze wet noodzakelijke instructies te geven aan die banken. Aan deze vrijstelling kunnen
      beperkingen worden gesteld en voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel1e
  - number: 1f.1
    text: |-
      Onze Minister van Financiën en Onze Minister van Justitie en Veiligheid gezamenlijk publiceren een verslag van de
      geïdentificeerde, geanalyseerde en beoordeelde nationale risico’s op witwassen en het financieren van terrorisme,
      bedoeld in artikel 7 van de vierde anti-witwasrichtlijn. Dit verslag wordt elke twee jaar geactualiseerd.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel1f
  - number: 1f.2
    text: |-
      Ter voorbereiding van dit verslag publiceren Onze Minister van Financiën en Onze Minister van Justitie en
      Veiligheid gezamenlijk de statistieken, bedoeld in artikel 44 van de vierde anti-witwasrichtlijn. Deze statistieken
      worden jaarlijks geactualiseerd.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel1f
  - number: '2.1'
    text: |-
      Een instelling met een bijkantoor of een meerderheidsdochteronderneming in een staat die geen lidstaat is en waar
      de wettelijke voorschriften ter voorkoming van witwassen en financieren van terrorisme minder verstrekkend zijn
      dan de bij of krachtens deze wet gestelde regels, draagt er zorg voor dat het bijkantoor, onderscheidenlijk de
      meerderheidsdochteronderneming, de bij of krachtens deze wet gestelde regels naleeft, voor zover het recht van de
      betrokken staat hier niet aan in de weg staat.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel2
  - number: '2.2'
    text: |-
      Indien het recht van de betrokken staat aan toepassing van het eerste lid in de weg staat, stelt de instelling de
      toezichthoudende autoriteit daarvan in kennis en neemt zij maatregelen om het risico van witwassen en financieren
      van terrorisme doeltreffend te beheersen. Indien van toepassing neemt zij hierbij het bepaalde op grond van artikel
      45, zevende lid, van de vierde anti-witwasrichtlijn in acht.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel2
  - number: '2.3'
    text: |-
      Een instelling die een vestiging in een andere lidstaat exploiteert, ziet er op toe dat deze vestiging de in die
      lidstaat ter omzetting van de vierde anti-witwasrichtlijn geldende bepalingen naleeft.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel2
  - number: 2a.1
    text: |-
      Ter voorkoming van witwassen en financieren van terrorisme verricht een instelling cliëntenonderzoek en meldt zij
      verrichte of voorgenomen ongebruikelijke transacties overeenkomstig de bij of krachtens de [hoofdstukken 2][ref1]
      en [3][ref2] gestelde regels. Daarbij besteedt een instelling bijzondere aandacht aan ongebruikelijke
      transactiepatronen en aan transacties die naar hun aard een hoger risico op witwassen of financieren van terrorisme
      met zich brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0024282
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0024282
        hoofdstuk: '3'
  - number: 2a.2
    text: |-
      Een instelling treft adequate maatregelen ter voorkoming van risico’s op witwassen en financieren van terrorisme
      die kunnen ontstaan door het gebruik van nieuwe technologieën in het economisch verkeer.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel2a
  - number: 2b.1
    text: |-
      Een instelling neemt maatregelen om haar risico’s op witwassen en financieren van terrorisme vast te stellen en te
      beoordelen, waarbij de maatregelen in verhouding staan tot de aard en de omvang van de instelling.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel2b
  - number: 2b.2
    text: |-
      Bij het vaststellen en beoordelen van de risico’s, bedoeld in het eerste lid, houdt de instelling in ieder
      geval rekening met de risicofactoren die verband houden met het type cliënt, product, dienst, transactie en
      leveringskanaal en met landen of geografische gebieden.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel2b
  - number: 2b.3
    text: |-
      Een instelling legt de resultaten van het vaststellen en beoordelen van haar risico’s vast, houdt deze actueel en
      verstrekt deze resultaten desgevraagd aan de toezichthoudende autoriteit.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel2b
  - number: 2b.4
    text: |-
      De toezichthoudende autoriteit kan ontheffing verlenen van het eerste tot en met derde lid, indien de instelling
      behoort tot een sector waarvan de inherente specifieke risico’s op witwassen en financieren van terrorisme
      duidelijk en inzichtelijk zijn.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel2b
  - number: 2c.1
    text: |-
      Een instelling beschikt over gedragslijnen, procedures en maatregelen om de risico’s op witwassen en financieren
      van terrorisme en de risico’s die zijn geïdentificeerd in de meest recente versies van de supranationale
      risicobeoordeling en de nationale risicobeoordeling te beperken en effectief te beheersen.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel2c
  - number: 2c.2
    text: |-
      De gedragslijnen, procedures en maatregelen, bedoeld in het eerste lid, zijn evenredig aan de aard en de omvang
      van de instelling en hebben ten minste betrekking op de naleving van de bepalingen in [hoofdstuk 1][ref1],
      [paragraaf 1.2][ref2], [1.3][ref3], [hoofdstuk 2][ref4], [hoofdstuk 3][ref5], [paragraaf 3.2][ref6] en
      [hoofdstuk 5][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0024282#Hoofdstuk1
      [ref4]: https://wetten.overheid.nl/BWBR0024282#Hoofdstuk2
      [ref5]: https://wetten.overheid.nl/BWBR0024282#Hoofdstuk3
      [ref6]: https://wetten.overheid.nl/BWBR0024282#Hoofdstuk3
      [ref7]: https://wetten.overheid.nl/BWBR0024282#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0024282
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0024282
        hoofdstuk: '1'
        paragraaf: '1.2'
      - id: ref3
        bwb_id: BWBR0024282
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref4
        bwb_id: BWBR0024282
        hoofdstuk: '2'
      - id: ref5
        bwb_id: BWBR0024282
        hoofdstuk: '3'
      - id: ref6
        bwb_id: BWBR0024282
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref7
        bwb_id: BWBR0024282
        hoofdstuk: '5'
  - number: 2c.3
    text: |-
      De gedragslijnen, procedures en maatregelen behoeven de goedkeuring van de personen die het dagelijks beleid van
      een instelling bepalen.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel2c
  - number: 2c.4
    text: |-
      Een instelling draagt zorg voor een systematische toetsing van de gedragslijnen, procedures en maatregelen en
      draagt waar nodig zorg voor een bijstelling hiervan.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel2c
  - number: 2d.1
    text: |-
      Indien het dagelijks beleid van een instelling wordt bepaald door twee of meer personen, wijst een instelling één
      van de personen die het dagelijks beleid van de instelling bepalen aan die is belast met de verantwoordelijkheid
      voor de naleving door de instelling van het bij of krachtens deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel2d
  - number: 2d.2
    text: |-
      Voor zover passend bij de aard en omvang van de instelling, beschikt een instelling over een onafhankelijke en
      effectieve compliancefunctie.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel2d
  - number: 2d.3
    text: |-
      De compliancefunctie is gericht op het controleren van de naleving van wettelijke regels en interne regels die de
      instelling zelf heeft opgesteld en omvat onder meer de taak die strekt tot het verstrekken van de gegevens, bedoeld
      in [artikel 16][ref1], aan de Financiële inlichtingen eenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel16
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel2d
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 2d.4
    text: |-
      Indien van toepassing en voor zover passend bij de aard en de omvang van de instelling, draagt een instelling er
      zorg voor dat op onafhankelijke wijze een auditfunctie wordt uitgeoefend ten aanzien van haar werkzaamheden. De
      auditfunctie controleert de naleving door een instelling van de bij of krachtens deze wet gestelde regels en de
      uitoefening van de compliancefunctie.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel2d
  - number: 2e.1
    text: |-
      Een instelling als bedoeld in [artikel 1a, derde lid, onderdeel b of e][ref1], met hoofdkantoor in een
      andere lidstaat en met vestigingen niet zijnde bijkantoren in Nederland, wijst in Nederland op verzoek van de
      toezichthoudende autoriteit een centraal contactpunt aan met het oog op de naleving van de bij of krachtens deze
      wet gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel2e
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 1a
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 2e.2
    text: |-
      Het centraal contactpunt bewerkstelligt namens de instelling en met inachtneming van het bepaalde op grond van
      artikel 45, elfde lid, van de vierde anti-witwasrichtlijn, de naleving van de bij of krachtens deze wet gestelde
      regels en draagt zorg voor het aanleveren van de door de toezichthoudende autoriteit op grond van deze wet
      verzochte informatie.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel2e
  - number: 2e.3
    text: |-
      De toezichthoudende autoriteit kan een instelling verzoeken een centraal contactpunt als bedoeld in het eerste lid
      aan te wijzen in de op grond van artikel 45, elfde lid, van de vierde anti-witwasrichtlijn aangewezen gevallen.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel2e
  - number: 2f.1
    text: |-
      Een instelling die deel uitmaakt van een groep past de op het niveau van de groep geldende gedragslijnen en
      procedures op effectieve wijze toe, voor zover die voldoen aan de bij of krachtens deze wet gestelde regels.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel2f
  - number: 2f.2
    text: |-
      Een instelling draagt tevens zorg voor een effectieve toepassing van de in het eerste lid bedoelde gedragslijnen en
      procedures door haar bijkantoren of meerderheidsdochterondernemingen met zetel buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel2f
  - number: 2f.3
    text: |-
      Onder de gedragslijnen en procedures, bedoeld in het eerste en tweede lid, worden in ieder geval verstaan
      gedragslijnen en procedures inzake gegevensbescherming en gedragslijnen en procedures voor het delen van informatie
      binnen de groep, voor zover deze gegevens en informatie betrekking hebben op het voorkomen van witwassen en
      financieren van terrorisme.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel2f
  - number: 2f.4
    text: |-
      Indien het recht van een betrokken staat die geen lidstaat is in de weg staat aan de toepassing van het tweede
      lid, stelt de instelling de toezichthoudende autoriteit hiervan in kennis en ziet de instelling er op toe dat
      het bijkantoor of de meerderheidsdochteronderneming aanvullende maatregelen neemt om het risico op witwassen en
      financieren van terrorisme doeltreffend te beheersen. Indien van toepassing neemt zij hierbij het bepaalde op grond
      van artikel 45, zevende lid, van de vierde anti-witwasrichtlijn in acht.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel2f
  - number: 2f.5
    text: |-
      Indien de aanvullende maatregelen, bedoeld in het vierde lid, onvoldoende zijn, neemt de toezichthoudende
      autoriteit aanvullende toezichtmaatregelen, waarbij onder meer wordt verlangd dat de groep geen zakelijke relaties
      aangaat of die relaties beëindigt en geen transacties uitvoert, dan wel waarbij de groep, indien nodig, wordt
      verzocht haar bedrijfsactiviteiten in de betrokken staat te beëindigen.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel2f
  - number: '3.1'
    text: Een instelling verricht ter voorkoming van witwassen en financieren van terrorisme cliëntenonderzoek.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel3
  - number: '3.2'
    text: 'Het cliëntenonderzoek stelt de instelling in staat om:'
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel3
  - number: 3.2.a
    text: de cliënt te identificeren en diens identiteit te verifiëren;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel3
  - number: 3.2.b
    text: |-
      de uiteindelijk belanghebbende van de cliënt te identificeren en redelijke maatregelen te nemen om zijn identiteit
      te verifiëren, indien de cliënt een rechtspersoon is, redelijke maatregelen te nemen om inzicht te verwerven in
      de eigendoms- en zeggenschapsstructuur van de cliënt, en indien de uiteindelijk belanghebbende lid is van het
      hoger leidinggevend personeel, noodzakelijke redelijke maatregelen te nemen om de identiteit te verifiëren van
      de natuurlijke persoon die lid is van het hoger leidinggevend personeel, waarbij de genomen maatregelen en de
      ondervonden moeilijkheden tijdens het verificatieproces worden vastgelegd;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel3
  - number: 3.2.c
    text: het doel en de beoogde aard van de zakelijke relatie vast te stellen;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel3
  - number: 3.2.d
    text: |-
      een voortdurende controle op de zakelijke relatie en de tijdens de duur van deze relatie verrichte transacties uit
      te oefenen, teneinde te verzekeren dat deze overeenkomen met de kennis die de instelling heeft van de cliënt en
      diens risicoprofiel, met zo nodig een onderzoek naar de bron van de middelen die bij de zakelijke relatie of de
      transactie gebruikt worden;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel3
  - number: 3.2.e
    text: |-
      vast te stellen of de natuurlijke persoon die de cliënt vertegenwoordigt daartoe bevoegd is en in voorkomend geval
      de natuurlijke persoon te identificeren en diens identiteit te verifiëren;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel3
  - number: 3.2.f
    text: |-
      redelijke maatregelen te nemen om te verifiëren of de cliënt ten behoeve van zichzelf optreedt dan wel ten behoeve
      van een derde.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel3
  - number: '3.3'
    text: |-
      Indien een cliënt handelt als trustee van een trust of ten behoeve van een andere juridische constructie strekt
      het in het eerste lid bedoelde cliëntenonderzoek zich tevens uit tot de trust of juridische constructie, met
      overeenkomstige toepassing van de maatregelen, bedoeld in het tweede lid. Het cliëntenonderzoek stelt de instelling
      in dat geval eveneens in staat om vast te stellen of de cliënt bevoegd is op te treden als trustee van een trust of
      ten behoeve van een andere juridische constructie.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel3
  - number: '3.4'
    text: |-
      Indien een cliënt optreedt als vennoot van een personenvennootschap strekt het in het eerste lid bedoelde
      cliëntenonderzoek zich tevens uit tot de personenvennootschap, met overeenkomstige toepassing van de maatregelen,
      bedoeld in het tweede lid. Het cliëntenonderzoek stelt de instelling in dat geval eveneens in staat om vast te
      stellen of de natuurlijke persoon die de vennoten in de personenvennootschap vertegenwoordigt daartoe bevoegd is
      en, in voorkomend geval, om die persoon te identificeren en diens identiteit te verifiëren.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel3
  - number: '3.5'
    text: 'Een instelling verricht het cliëntenonderzoek in de volgende gevallen:'
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel3
  - number: 3.5.a
    text: indien zij in of vanuit Nederland een zakelijke relatie aangaat;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel3
  - number: 3.5.b
    text: |-
      indien zij in of vanuit Nederland een incidentele transactie verricht ten behoeve van de cliënt van ten minste
      € 15.000, of twee of meer transacties waartussen een verband bestaat met een gezamenlijke waarde van ten minste
      € 15.000;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel3
  - number: 3.5.c
    text: indien er indicaties zijn dat de cliënt betrokken is bij witwassen of financieren van terrorisme;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel3
  - number: 3.5.d
    text: indien zij twijfelt aan de juistheid of volledigheid van eerder verkregen gegevens van de cliënt;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel3
  - number: 3.5.e
    text: |-
      indien het risico van betrokkenheid van een bestaande cliënt bij witwassen of financieren van terrorisme daartoe
      aanleiding geeft;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel3
  - number: 3.5.f
    text: |-
      indien er, gelet op de staat waarin een cliënt woonachtig of gevestigd is of zijn zetel heeft, een verhoogd risico
      op witwassen of financieren van terrorisme bestaat;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel3
  - number: 3.5.g
    text: |-
      indien zij in of vanuit Nederland een incidentele transactie verricht ten behoeve van de cliënt of de trust,
      inhoudende een geldovermaking als bedoeld in artikel 3, negende lid, van de verordening betreffende bij
      geldovermakingen te voegen informatie, ten bedrage van ten minste € 1.000.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel3
  - number: '3.6'
    text: |-
      Een instelling als bedoeld in [artikel 1a, vierde lid, onderdeel i][ref1], verricht cliëntenonderzoek indien zij
      in of vanuit Nederland een incidentele transactie verricht ten behoeve van de cliënt van ten minste € 10.000 in
      contant geld, of twee of meer transacties waartussen een verband bestaat met een gezamenlijke waarde van ten minste
      € 10.000 in contant geld.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 1a
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: '3.7'
    text: |-
      In afwijking van het vijfde lid, onderdeel b, verricht een instelling als bedoeld in
      [artikel 1a, vierde lid, onderdeel n][ref1], cliëntenonderzoek indien zij in of vanuit Nederland een incidentele
      transactie verricht ten behoeve van de cliënt van ten minste € 2.000,– bij het ophalen van een prijs of het aangaan
      van een weddenschap, of twee of meer transacties waartussen een verband bestaat met een gezamenlijke waarde van ten
      minste € 2.000,– of meer.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 1a
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: '3.8'
    text: |-
      Een instelling stemt het cliëntenonderzoek aantoonbaar af op de risicogevoeligheid voor witwassen of financiering
      van terrorisme van het type cliënt, zakelijke relatie, product of transactie.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel3
  - number: '3.9'
    text: |-
      Een instelling houdt bij het bepalen van de risicogevoeligheid, bedoeld in het achtste lid, tenminste rekening met
      de in bijlage I bij de vierde anti-witwasrichtlijn genoemde risicovariabelen.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel3
  - number: '3.10'
    text: |-
      Het eerste tot en met het negende lid en het elfde lid zijn niet van toepassing op een instelling als bedoeld in
      [artikel 1a, vierde lid, onderdeel o][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 1a
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: '3.11'
    text: |-
      Een instelling neemt redelijke maatregelen om ervoor te zorgen dat de gegevens die ingevolge het tweede tot en met
      vierde lid zijn verzameld over daar bedoelde personen, actueel gehouden worden. De gegevens worden in elk geval
      geactualiseerd indien relevante omstandigheden van de cliënt veranderen, een instelling op grond van deze wet
      verplicht is tot het opnemen van contact met de cliënt om informatie met betrekking tot de uiteindelijk begunstigde
      te evalueren of de instelling daartoe verplicht is op grond van [Richtlijn 2011/16](32011L0016)/EU van de Raad van
      15 februari 2011 betreffende de administratieve samenwerking op het gebied van de belastingen en tot intrekking van
      [Richtlijn 77/79/EEG](31977L0079) (PbEU 2011, L 64).
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel3
  - number: '3.12'
    text: |-
      In dit artikel wordt verstaan onder personenvennootschap: een maatschap als bedoeld in
      [artikel 1655 van boek 7A van het Burgerlijk Wetboek][ref1], een vennootschap onder firma als bedoeld
      in [artikel 16 van het Wetboek van Koophandel][ref2] en een commanditaire vennootschap als bedoeld in
      [artikel 19 van het Wetboek van Koophandel][ref3], alsmede een maatschap of vennootschap naar buitenlands recht die
      met een van deze rechtsvormen vergelijkbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1655
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0001838#Artikel19
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: '1655'
      - id: ref2
        bwb_id: BWBR0001838
        artikel: '16'
      - id: ref3
        bwb_id: BWBR0001838
        artikel: '19'
  - number: '3.13'
    text: |-
      Voor de toepassing van het tweede lid wordt, indien de in het eerste lid bedoelde verplichting rust op een
      tussenpersoon als bedoeld in [artikel 1a, vierde lid, onderdeel h][ref1], onder cliënt mede verstaan: de
      wederpartij van de cliënt bij een door bemiddeling van de tussenpersoon tot stand gebrachte en gesloten
      overeenkomst inzake onroerende zaken en rechten waaraan onroerende zaken zijn onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 1a
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: '3.14'
    text: |-
      In geval van een trustkantoor als bedoeld in [artikel 1a, vierde lid, onderdeel f][ref1],
      dat diensten verleent als bedoeld in de begripsomschrijving van trustdienst in
      [artikel 1, eerste lid, van de Wet toezicht trustkantoren 2018][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0041583#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 1a
        hoofdstuk: '1'
        paragraaf: '1.1'
      - id: ref2
        bwb_id: BWBR0041583
        artikel: '1'
  - number: 3.14.a
    text: |-
      wordt onder cliëntenonderzoek in de zin van het eerste lid verstaan de maatregelen die zijn voorgeschreven
      krachtens [hoofdstuk 4 van de Wet toezicht trustkantoren 2018][ref1] en die worden uitgevoerd voorafgaand aan of
      bij de uitvoering van een dienst of het aangaan van een zakelijke relatie;


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0041583
        hoofdstuk: '4'
  - number: 3.14.b
    text: zijn het tweede tot en met het negende lid en elfde lid niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel3
  - number: '3.15'
    text: |-
      Bij het verrichten van het cliëntenonderzoek verlaten de instellingen zich niet uitsluitend op de informatie in het
      handelsregister, bedoeld in [artikel 2 van de Handelsregisterwet 2007][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel2
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '2'
  - number: 3a.1
    text: |-
      In aanvulling op [artikel 3, tweede tot en met vierde lid][ref1], stelt het cliëntenonderzoek een bank of andere
      financiële onderneming in staat om onverwijld nadat een begunstigde van een levensverzekering is geïdentificeerd
      of aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel3
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3a.1.a
    text: |-
      de naam van de persoon vast te leggen, indien de begunstigde als met name genoemde natuurlijke persoon of
      rechtspersoon of juridische constructie is geïdentificeerd;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel3a
  - number: 3a.1.b
    text: |-
      voldoende informatie in te winnen betreffende de begunstigde om ervan overtuigd te zijn dat op het tijdstip
      van uitbetaling de identiteit van de begunstigde kan worden vastgesteld, indien de begunstigde door middel van
      kenmerken of naar categorie of anderszins is aangewezen.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel3a
  - number: 3a.2
    text: |-
      Verificatie van de identiteit van de begunstigde, bedoeld in het eerste lid, vindt plaats op het tijdstip van
      uitbetaling van de levensverzekering.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel3a
  - number: 3a.3
    text: |-
      Indien een levensverzekering aan een derde wordt overgedragen, identificeert een bank of andere financiële
      onderneming die op de hoogte is van de overdracht de uiteindelijk belanghebbende op het tijdstip van de overdracht
      aan de natuurlijke persoon, rechtspersoon of juridische constructie die de waarde van de overgedragen polis te
      eigen voordele ontvangt.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel3a
  - number: '4.1'
    text: |-
      Een instelling voldoet aan [artikel 3, tweede lid, onderdelen a en b][ref1], en indien van toepassing het derde en
      vierde lid van dat artikel, voordat de zakelijke relatie wordt aangegaan of een incidentele transactie als bedoeld
      in artikel 3, vijfde lid, onderdelen b en g, zesde en zevende lid, wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel3
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '4.2'
    text: |-
      Bij het aangaan van een nieuwe zakelijke relatie met een cliënt als bedoeld in
      [artikel 3, tweede lid, onderdeel b, of vierde lid][ref1], beschikt de instelling over een bewijs van inschrijving
      in het handelsregister, bedoeld in [artikel 2 van de Handelsregisterwet 2007][ref2], en stelt de instelling vast of
      de uiteindelijk belanghebbenden van de cliënt zijn opgenomen als bedoeld in artikel 15a van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel2
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0021777
        artikel: '2'
  - number: '4.3'
    text: |-
      In afwijking van het eerste lid is het een instelling toegestaan de identiteit van de cliënt en, indien van
      toepassing, de identiteit van de uiteindelijk belanghebbende te verifiëren tijdens het aangaan van de zakelijke
      relatie, indien dit noodzakelijk is om de dienstverlening niet te verstoren en indien er weinig risico op witwassen
      of financieren van terrorisme bestaat. In dat geval verifieert de instelling de identiteit zo spoedig mogelijk na
      het eerste contact met de cliënt.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel4
  - number: '4.4'
    text: |-
      In afwijking van het eerste lid is het een bank of andere financiële onderneming toegestaan een rekening, met
      inbegrip van een rekening voor effectentransacties, te openen voordat de verificatie van de identiteit van de
      cliënt heeft plaatsgevonden, indien zij waarborgt dat deze rekening niet kan worden gebruikt voordat de verificatie
      heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel4
  - number: '4.5'
    text: |-
      In afwijking van het eerste lid kan een notaris, toegevoegd notaris of kandidaat-notaris als
      bedoeld in [artikel 1a, vierde lid, onderdeel d][ref1], de identiteit van de cliënt en, indien van
      toepassing, van de uiteindelijk belanghebbende verifiëren op het moment dat identificatie op grond van
      [artikel 39 van de Wet op het notarisambt][ref2] is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel39
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 1a
        hoofdstuk: '1'
        paragraaf: '1.1'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: '39'
  - number: '4.6'
    text: |-
      In afwijking van het eerste lid is het een instelling toegestaan om de identiteit van de begunstigde van een
      trust of van een soortgelijke juridische constructie pas vast te stellen op het tijdstip van uitbetaling of op
      het tijdstip waarop de begunstigde zijn definitieve rechten uitoefent, mits de begunstigde voor het aangaan van
      de zakelijke relatie of het uitvoeren van een incidentele transactie aan de hand van specifieke kenmerken of
      naar categorie is omschreven en de instelling zodanige informatie inwint dat zij in staat is de identiteit van
      de begunstigde vast te stellen op het tijdstip van uitbetaling of op het tijdstip waarop de begunstigde zijn
      definitieve rechten uitoefent.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel4
  - number: '5.1'
    text: |-
      Onverminderd [artikel 4][ref1] is het een instelling verboden een zakelijke relatie aan te gaan met of een
      transactie uit te voeren voor een cliënt, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel4
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 5.1.a
    text: |-
      zij zelf ten aanzien van die cliënt onderzoek heeft verricht conform [artikel 3][ref1], of ten aanzien van die
      cliënt onderzoek is verricht conform artikel 3 of op daarmee overeenkomende wijze door:


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel3
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 5.1.a.1°
    text: |-
      een instelling als bedoeld in [artikel 1a, vierde lid, onderdelen a tot en met e][ref1], met zetel in Nederland of
      een andere lidstaat;


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 1a
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 5.1.a.2°
    text: |-
      een instelling als bedoeld in [artikel 1a, vierde lid, onderdeel f][ref1],
      waaraan een vergunning als bedoeld in [artikel 3, eerste en tweede lid][ref2], of
      [artikel 4, eerste lid, onderdeel c, van de Wet toezicht trustkantoren 2018][ref3] is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0041583#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0041583#Artikel4
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 1a
        hoofdstuk: '1'
        paragraaf: '1.1'
      - id: ref2
        bwb_id: BWBR0041583
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0041583
        artikel: '4'
  - number: 5.1.a.3°
    text: |-
      een instelling als bedoeld in [artikel 1a, tweede lid en derde lid][ref1], of een bijkantoor daarvan met zetel
      onderscheidenlijk vestigingsplaats in Nederland of een andere lidstaat;


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 1a
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 5.1.a.4°
    text: |-
      een instelling als bedoeld onder 1° of 3°, met zetel in een door Onze Minister van Financiën aangewezen staat
      die geen lidstaat is, in welke staat wettelijke voorschriften van toepassing zijn die gelijkwaardig zijn aan het
      bepaalde in [artikel 3, tweede tot en met vijfde en achtste lid][ref1], en [artikel 8, eerste lid][ref2], en er
      toezicht wordt uitgeoefend op de naleving van die voorschriften, of een bijkantoor van de instelling in Nederland;


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel8
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 5.1.a.5°
    text: |-
      een bijkantoor of meerderheidsdochteronderneming, gevestigd in een staat die geen lidstaat is, van een instelling
      als bedoeld onder 1° of 3° met vestiging in Nederland of in een andere lidstaat, indien het bijkantoor of de
      meerderheidsdochteronderneming deel uitmaakt van dezelfde groep en volledig voldoet aan de op het niveau van de
      groep geldende gedragslijnen en procedures overeenkomstig [artikel 2f, eerste tot en met derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel2f
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 2f
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: 5.1.b
    text: |-
      dit onderzoek heeft geleid tot het in
      [artikel 3, tweede lid, aanhef en onderdelen a, b, c, e en f, derde en vierde lid][ref1] bedoelde resultaat; en


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel3
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 5.1.c
    text: |-
      de instelling beschikt over alle identificatie- en verificatiegegevens en overige gegevens inzake de identiteit van
      de in [artikel 3, tweede, derde en vierde lid][ref1], bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel3
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '5.2'
    text: |-
      De toezichthoudende autoriteit kan toestaan dat een instelling, dan wel een bijkantoor of dochteronderneming in
      Nederland van een instelling met zetel buiten Nederland, het bepaalde in het eerste lid naleeft via de op het
      niveau van de groep geldende gedragslijnen en procedures, indien:
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel5
  - number: 5.2.a
    text: de instelling zich verlaat op informatie verstrekt door een derde die deel uitmaakt van dezelfde groep;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel5
  - number: 5.2.b
    text: |-
      die groep cliëntenonderzoeksmaatregelen, regels inzake bewaring van bewijsstukken en programma’s ter bestrijding
      van witwassen en terrorismefinanciering toepast overeenkomstig de bij of krachtens deze wet gestelde regels; en
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel5
  - number: 5.2.c
    text: |-
      op de effectieve uitvoering van de in onderdeel b bedoelde voorschriften op het niveau van de groep toezicht wordt
      uitgeoefend door een bevoegde autoriteit van de lidstaat van herkomst of van een staat die geen lidstaat is.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel5
  - number: '5.3'
    text: |-
      Indien een instelling met betrekking tot een zakelijke relatie niet kan voldoen aan
      [artikel 3, eerste tot en met vierde en veertiende lid, onderdeel a][ref1], beëindigt de instelling die zakelijke
      relatie.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel3
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '5.4'
    text: |-
      Het eerste tot en met derde lid zijn niet van toepassing op de gevallen als bedoeld in de [artikelen 6][ref1] en
      [7][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel7
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '5.5'
    text: |-
      Het is een bank of andere financiële onderneming verboden een correspondentrelatie aan te gaan of voort te zetten
      met een shellbank of met een bank of andere financiële onderneming waarvan bekend is dat deze een shellbank
      toestaat van haar rekeningen gebruik te maken.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel5
  - number: '6.1'
    text: |-
      In afwijking van [artikel 3, tweede tot en met vierde lid][ref1], kan een instelling een vereenvoudigd
      cliëntenonderzoek verrichten indien een zakelijke relatie of transactie naar haar aard een laag risico op witwassen
      of financieren van terrorisme met zich brengt. De instelling houdt daarbij ten minste rekening met de in bijlage II
      bij de vierde anti-witwasrichtlijn genoemde risicofactoren.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel3
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '6.2'
    text: |-
      Een instelling verzamelt aantoonbaar voldoende gegevens om te kunnen vaststellen of met betrekking tot een cliënt
      een vereenvoudigd cliëntenonderzoek, als bedoeld in het eerste lid, kan worden verricht.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel6
  - number: '6.3'
    text: |-
      Een instelling neemt redelijke maatregelen om ervoor te zorgen dat de gegevens die ingevolge het tweede lid zijn
      verzameld en de daarop gebaseerde vaststelling actueel gehouden worden.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel6
  - number: '6.4'
    text: |-
      Een instelling zorgt voor een toereikende controle van de transacties of de zakelijke relatie om te verzekeren dat
      kan worden voldaan aan het bepaalde in [artikel 16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel16
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '7.1'
    text: |-
      De [artikelen 3, tweede lid, onderdelen a tot en met c, e en f][ref1], en [4][ref2] zijn niet van toepassing voor
      zover een instelling een zakelijke relatie aangaat of een transactie verricht met betrekking tot elektronisch geld
      en:


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel4
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 7.1.a
    text: |-
      het elektronisch geld waarop de geldwaarde is opgeslagen niet kan worden heropgeladen of een
      betalingstransactielimiet heeft van € 150 per maand en uitsluitend in Nederland kan worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel7
  - number: 7.1.b
    text: de opgeslagen geldwaarde van het elektronisch geld niet meer dan € 150 bedraagt;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel7
  - number: 7.1.c
    text: het elektronisch geld uitsluitend wordt gebruikt voor de aankoop van goederen of diensten;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel7
  - number: 7.1.d
    text: de opgeslagen geldwaarde van het elektronisch geld niet kan worden aangevuld met anoniem elektronisch geld; en
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel7
  - number: 7.1.e
    text: |-
      de uitgever van het elektronisch geld zorgt voor een toereikende controle van de transacties of de zakelijke
      relatie om te verzekeren dat kan worden voldaan aan het bepaalde in [artikel 16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel16
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '7.2'
    text: Een instelling verzamelt voldoende gegevens om te kunnen vaststellen of het eerste lid van toepassing is.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel7
  - number: '7.3'
    text: |-
      Het eerste lid is niet van toepassing indien sprake is van terugbetaling in contanten of opname in contanten van
      de monetaire waarde van het elektronisch geld en het terug te betalen bedrag hoger is dan € 50, of indien sprake
      is van een betalingstransactie op afstand als bedoeld in artikel 4, onderdeel 6, van de richtlijn betaaldiensten en
      het betaalde bedrag hoger is dan € 50 per transactie.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel7
  - number: '7.4'
    text: |-
      Banken en andere financiële ondernemingen accepteren enkel betalingen verricht met anonieme prepaidkaarten die zijn
      uitgegeven in derde landen, indien deze kaarten voldoen aan eisen gelijkwaardig aan die van het eerste of derde
      lid.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel7
  - number: '8.1'
    text: |-
      Een instelling verricht, in aanvulling op [artikel 3, tweede tot en met vierde lid][ref1], verscherpt
      cliëntenonderzoek in ten minste de volgende gevallen:


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel3
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 8.1.a
    text: |-
      indien de zakelijke relatie of transactie naar haar aard een hoger risico op witwassen of financieren van
      terrorisme met zich brengt;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel8
  - number: 8.1.b
    text: |-
      indien de staat waar de cliënt woonachtig of gevestigd is of zijn zetel heeft op grond van artikel 9 van de vierde
      anti-witwasrichtlijn door de Europese Commissie is aangewezen als staat met een hoger risico op witwassen of
      financieren van terrorisme.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel8
  - number: '8.2'
    text: |-
      Een instelling houdt ten minste rekening met de risicofactoren, bedoeld in bijlage III bij de vierde anti-
      witwasrichtlijn, om vast te stellen of het eerste lid, onderdeel a, van toepassing is.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel8
  - number: '8.3'
    text: |-
      Een instelling neemt redelijke maatregelen om de achtergrond en het doel van complexe of ongebruikelijk grote
      transacties, van transacties met een ongebruikelijk patroon of zonder duidelijk economisch of rechtmatig doel te
      onderzoeken en onderwerpt de gehele zakelijke relatie met de cliënt in dat geval aan een verscherpte controle.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel8
  - number: '8.4'
    text: |-
      Onverminderd het eerste lid draagt een bank of andere financiële onderneming die een correspondentrelatie aangaat
      of is aangegaan met een respondentinstelling in een staat die geen lidstaat is en waarbij betalingen worden
      verricht, er bij het aangaan van de zakelijke relatie zorg voor dat:
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel8
  - number: 8.4.a
    text: |-
      zij voldoende informatie over de betrokken respondentinstelling verzamelt om een volledig beeld te krijgen
      van de aard van haar bedrijfsactiviteiten, en op basis van openbaar beschikbare informatie de reputatie van de
      respondentinstelling en de kwaliteit van het toezicht dat op de respondentinstelling wordt uitgeoefend beoordeelt;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel8
  - number: 8.4.b
    text: |-
      zij de procedures en maatregelen ter voorkoming van witwassen en financieren van terrorisme van de betrokken
      respondentinstelling beoordeelt;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel8
  - number: 8.4.c
    text: |-
      indien het een nieuwe correspondentrelatie betreft, de beslissing tot het aangaan van die relatie wordt genomen of
      goedgekeurd door het hoger leidinggevend personeel van de bank of andere financiële onderneming;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel8
  - number: 8.4.d
    text: |-
      de verantwoordelijkheden van de bank of andere financiële onderneming en van de respondentinstelling worden
      vastgelegd;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel8
  - number: 8.4.e
    text: |-
      de betrokken respondentinstelling de cliënten die rechtstreeks toegang hebben tot transitrekeningen heeft
      geïdentificeerd, hun identiteit heeft geverifieerd en daarnaast doorlopend toezicht houdt op deze cliënten en dat
      deze in staat is om haar op verzoek de relevante cliëntgegevens te verstrekken.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel8
  - number: '8.5'
    text: |-
      In aanvulling op de cliëntenonderzoeksmaatregelen, bedoeld in [artikel 3][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel3
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 8.5.a
    text: |-
      beschikt een instelling over passende risicobeheersystemen, waaronder op risico gebaseerde procedures, om te
      bepalen of de cliënt of de uiteindelijk belanghebbende een politiek prominente persoon is;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel8
  - number: 8.5.b
    text: |-
      past een instelling de volgende maatregelen toe bij het aangaan of voortzetten van een zakelijke relatie met of het
      verrichten van een transactie voor een politiek prominente persoon:
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel8
  - number: 8.5.b.1°
    text: |-
      voor het aangaan of voortzetten van deze zakelijke relatie of het verrichten van deze transactie, is de toestemming
      vereist van een persoon die deel uitmaakt van het hoger leidinggevend personeel;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel8
  - number: 8.5.b.2°
    text: |-
      passende maatregelen worden getroffen om de bron van het vermogen en van de middelen die bij deze zakelijke relatie
      of deze transactie gebruikt worden, vast te stellen;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel8
  - number: 8.5.b.3°
    text: de zakelijke relatie wordt doorlopend aan verscherpte controle onderworpen.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel8
  - number: '8.6'
    text: |-
      In aanvulling op de cliëntenonderzoeksmaatregelen, bedoeld in [artikel 3][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel3
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 8.6.a
    text: |-
      neemt een instelling, uiterlijk bij uitbetaling van de polis of bij gehele of gedeeltelijke overdracht van
      de polis, redelijke maatregelen om te bepalen of de begunstigde dan wel de uiteindelijk belanghebbende van de
      begunstigde van een levensverzekering, een politiek prominente persoon is;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel8
  - number: 8.6.b
    text: |-
      past een instelling de volgende maatregelen toe in geval de persoon, bedoeld in onderdeel a, een politiek
      prominente persoon is:
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel8
  - number: 8.6.b.1°
    text: |-
      een persoon die deel uitmaakt van het hoger leidinggevend personeel wordt geïnformeerd over de uitbetaling van de
      polisopbrengsten aan de personen, bedoeld in onderdeel a, voorafgaand aan deze uitbetaling;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel8
  - number: 8.6.b.2°
    text: de gehele zakelijke relatie met de polishouder wordt aan verscherpte controle onderworpen.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel8
  - number: '8.7'
    text: |-
      Indien de cliënt of de uiteindelijk belanghebbende niet langer een prominente publieke functie bekleedt, past
      de instelling passende risicogebaseerde maatregelen zo lang als nodig, doch ten minste gedurende 12 maanden toe,
      totdat deze persoon niet langer het hoger risico met zich brengt dat hoort bij politiek prominente personen.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel8
  - number: '8.8'
    text: |-
      De maatregelen, bedoeld in het vijfde tot en met het zevende lid, zijn van overeenkomstige toepassing op
      familieleden van politiek prominente personen en personen bekend als naaste geassocieerden van politiek prominente
      personen.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel8
  - number: '8.9'
    text: |-
      Indien de cliënt of de uiteindelijk belanghebbende gedurende de zakelijke relatie een politiek prominente persoon
      wordt of blijkt te zijn, voldoet de instelling onverwijld nadat hiervan is gebleken aan het vijfde lid, het zesde
      lid, onderdeel b, en het zevende en achtste lid.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel8
  - number: '8.10'
    text: |-
      Indien een cliënt een bijkantoor of meerderheidsdochteronderneming met zetel of vestiging in een staat als
      bedoeld in het eerste lid is van een in een lidstaat gevestigde instelling, en het betreffende bijkantoor of
      de betreffende meerderheidsdochteronderneming volledig voldoet aan de voor de groep geldende gedragslijnen en
      procedures overeenkomstig [artikel 2f, tweede lid][ref1], kan in plaats van een verscherpt cliëntenonderzoek,
      cliëntenonderzoek worden verricht dat is afgestemd op de risico’s op witwassen of financieren van terrorisme die
      met deze cliënt gepaard gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel2f
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 2f
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: '8.11'
    text: |-
      Een instelling neemt redelijke maatregelen om ervoor te zorgen dat de gegevens, die ingevolge het derde tot en met
      zesde, achtste en tiende lid zijn verzameld, actueel gehouden worden.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel8
  - number: '9.1'
    text: |-
      Onverminderd [artikel 8, eerste lid][ref1], verricht een instelling met betrekking tot transacties, zakelijke
      relaties en correspondentbankrelaties gerelateerd aan staten die op grond van artikel 9 van de vierde anti-
      witwasrichtlijn in gedelegeerde handelingen van de Europese Commissie zijn aangewezen als staten met een hoger
      risico op witwassen of financieren van terrorisme de volgende verscherpte onderzoeksmaatregelen:


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel8
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 9.1.a
    text: verzamelen van aanvullende informatie over die cliënten en uiteindelijk belanghebbenden;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel9
  - number: 9.1.b
    text: verzamelen van aanvullende informatie met betrekking tot het doel en de aard van die zakelijke relatie;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel9
  - number: 9.1.c
    text: |-
      verzamelen van informatie over de herkomst van de fondsen die bij die zakelijke relatie of transactie gebruikt
      worden en de bron van het vermogen van die cliënten en van die uiteindelijk belanghebbenden;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel9
  - number: 9.1.d
    text: |-
      verzamelen van informatie over de achtergrond van en beweegredenen voor de voorgenomen of verrichte transacties van
      die cliënten;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel9
  - number: 9.1.e
    text: |-
      verkrijgen van goedkeuring van het hoger leidinggevend personeel voor het aangaan of voortzetten van die zakelijke
      relatie;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel9
  - number: 9.1.f
    text: |-
      verrichten van verscherpte controle op die zakelijke relatie met en de transacties van die cliënten, door
      het aantal controles en de frequentie van actualiseringen van gegevens over die cliënten en die uiteindelijk
      belanghebbenden te verhogen en door transactiepatronen te selecteren die nader onderzocht moeten worden.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel9
  - number: '9.2'
    text: |-
      In aanvulling op het eerste lid kan bij ministeriële regeling worden bepaald dat een instelling tevens één of
      meer van de volgende aanvullende risicobeperkende maatregelen toepast met betrekking tot cliënten die transacties
      uitvoeren die verband houden met staten als bedoeld in het eerste lid:
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel9
  - number: 9.2.a
    text: toepassen van aanvullende elementen van verscherpt cliëntenonderzoek;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel9
  - number: 9.2.b
    text: invoeren van verscherpte meldmechanismen of het systematisch melden van financiële transacties;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel9
  - number: 9.2.c
    text: beperken van die transacties, zakelijke relaties of correspondentbankrelaties;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel9
  - number: 9.2.d
    text: niet uitvoeren van die transacties en beëindiging van die zakelijke relaties en correspondentbankrelaties;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel9
  - number: 9.2.e
    text: overige bij algemene maatregel van bestuur aan te wijzen maatregelen.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel9
  - number: '9.3'
    text: |-
      In aanvulling op het eerste lid, kunnen bij ministeriële regeling ten aanzien van de in het eerste lid aangewezen
      staten tevens één of meer van de volgende maatregelen worden bepaald:
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel9
  - number: 9.3.a
    text: vestigingsverbod voor dochterondernemingen of bijkantoren van instellingen afkomstig uit die staten;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel9
  - number: 9.3.b
    text: vestigingsverbod voor dochterondernemingen of bijkantoren van instellingen in die staten;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel9
  - number: 9.3.c
    text: |-
      uitvoeren van verscherpte controle op of toepassen van verscherpte eisen aan de uitvoering van een externe audit
      voor in die staten gevestigde dochterondernemingen of bijkantoren door een instelling;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel9
  - number: 9.3.d
    text: |-
      toepassen van hogere eisen aan de uitvoering van een externe audit voor groepen ten aanzien van in die staten
      gevestigde dochterondernemingen of bijkantoren door een instelling;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel9
  - number: 9.3.e
    text: |-
      herzien, wijzigen of beëindigen van zakelijke relaties en correspondentrelaties in die staten door banken en andere
      financiële ondernemingen;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel9
  - number: 9.3.f
    text: overige bij algemene maatregel van bestuur aan te wijzen maatregelen.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel9
  - number: '9.4'
    text: |-
      In de regeling bedoeld in het tweede en derde lid, kan worden bepaald dat bij die regeling aangewezen instellingen
      één of meer van de maatregelen genoemd in het tweede en derde lid verrichten. Daarbij kan onderscheid worden
      gemaakt naar categorie instelling.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel9
  - number: 9a
    text: |-
      Onze Minister van Financiën en Onze Minister van Justitie en Veiligheid gezamenlijk stellen een lijst met de
      functies vast die in Nederland kwalificeren als prominente publieke functies. Deze lijst wordt actueel gehouden.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel9a
  - number: '10.1'
    text: |-
      Een instelling kan het cliëntenonderzoek, bedoeld in [artikel 3, eerste lid][ref1], voor zover het betrekking heeft
      op het in het tweede lid, onderdelen a, b, c, e en f, van dat artikel bepaalde, laten verrichten door een derde in
      het kader van een uitbesteding- of agentuurovereenkomst, onverminderd haar verplichting om te voldoen aan het in
      die onderdelen bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel3
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '10.2'
    text: |-
      Indien de in het eerste lid bedoelde uitbesteding een structureel karakter heeft legt de instelling de opdracht
      daartoe schriftelijk vast.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel10
  - number: 10a.1
    text: |-
      In afwijking van [artikel 1, eerste lid][ref1], wordt in deze paragraaf onder uiteindelijk belanghebbende verstaan:
      de natuurlijke persoon die de uiteindelijke eigenaar is van of zeggenschap heeft over een vennootschap of andere
      juridische entiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 10a.2
    text: |-
      In deze paragraaf wordt onder vennootschap of andere juridische entiteit verstaan: een in Nederland opgerichte
      vennootschap of andere juridische entiteit die een van de volgende rechtsvormen heeft:
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel10a
  - number: 10a.2.a
    text: |-
      een besloten vennootschap met beperkte aansprakelijkheid of een naamloze vennootschap, niet zijnde een vennootschap
      die als uitgevende instelling is onderworpen aan openbaarmakingsvereisten als bedoeld in [Richtlijn 2004/109/
      EG](32004L0109) van het Europees Parlement en de Raad van 15 december 2004 betreffende transparantievereisten
      die gelden voor informatie over uitgevende instellingen waarvan effecten tot de handel op een gereglementeerde
      markt zijn toegelaten en tot wijziging van [Richtlijn 2001/34/EG](32001L0034) (PbEU 2004, L 390), dan wel aan
      vergelijkbare internationale standaarden met inbegrip van een 100 procent dochtermaatschappij van een dergelijke
      vennootschap, een Europese naamloze vennootschap met de statutaire zetel in Nederland en een Europese coöperatieve
      vennootschap met de statutaire zetel in Nederland;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel10a
  - number: 10a.2.b
    text: een kerkgenootschap;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel10a
  - number: 10a.2.c
    text: een vereniging, een vereniging van eigenaars, een onderlinge waarborgmaatschappij, een coöperatie of een stichting;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel10a
  - number: 10a.2.d
    text: |-
      een maatschap, een commanditaire vennootschap, een vennootschap onder firma, een rederij of een Europese economisch
      samenwerkingsverband;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel10a
  - number: 10a.2.e
    text: |-
      overige privaatrechtelijke rechtspersoon als bedoeld in
      [artikel 6, eerste lid, onderdeel b, van de Handelsregisterwet 2007][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel6
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '6'
  - number: 10a.3
    text: |-
      Bij algemene maatregel van bestuur worden de categorieën natuurlijke personen aangewezen die in elk geval moeten
      worden aangemerkt als uiteindelijk belanghebbende als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel10a
  - number: 10b.1
    text: |-
      Vennootschappen en andere juridische entiteiten winnen de gegevens en de bescheiden, bedoeld in
      [artikel 15a, tweede, onderscheidenlijk derde lid, van de Handelsregisterwet 2007][ref1], over wie hun uiteindelijk
      belanghebbenden zijn in en houden deze bij. Deze gegevens en bescheiden zijn toereikend, accuraat en actueel.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel15a
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: 15a
  - number: 10b.2
    text: |-
      Een uiteindelijk belanghebbende verschaft de vennootschap of andere juridische entiteit alle informatie die
      noodzakelijk is om te voldoen aan het eerste lid.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel10b
  - number: 10c.1
    text: |-
      Een instelling doet melding aan de Kamer van Koophandel van iedere discrepantie die zij aantreft tussen een gegeven
      omtrent een uiteindelijk belanghebbende dat zij verstrekt heeft gekregen uit het handelsregister, bedoeld in
      [artikel 2 van de Handelsregisterwet 2007][ref1], en de informatie over die uiteindelijk belanghebbende waarover
      zij uit anderen hoofde beschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel2
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '2'
  - number: 10c.2
    text: |-
      Op een melding als bedoeld in het eerste lid is het bepaalde bij of krachtens de [artikelen 33][ref1],
      [34, tweede en derde lid][ref2], [35][ref3] en [36 van de Handelsregisterwet 2007][ref4] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0021777#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0021777#Artikel36
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '33'
      - id: ref2
        bwb_id: BWBR0021777
        artikel: '34'
      - id: ref3
        bwb_id: BWBR0021777
        artikel: '35'
      - id: ref4
        bwb_id: BWBR0021777
        artikel: '36'
  - number: 10c.3
    text: |-
      Het eerste lid is niet van toepassing indien een instelling op grond van [artikel 16][ref1] een verrichte of
      voorgenomen ongebruikelijke transactie meldt aan de Financiële inlichtingen eenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel16
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 10c.4
    text: |-
      Ten behoeve van de naleving van de verplichting, bedoeld in het eerste lid, zijn de instellingen, bedoeld
      in [artikel 1a, vierde lid, onderdeel c][ref1], niet gehouden aan de geheimhoudingsplicht, bedoeld in
      [artikel 11a van de Advocatenwet][ref2], en zijn de instellingen, bedoeld in artikel 1a, vierde lid, onderdeel d,
      niet gehouden aan de geheimhoudingsplicht in [artikel 22 van de Wet op het notarisambt][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel11a
      [ref3]: https://wetten.overheid.nl/BWBR0010388#Artikel22
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 1a
        hoofdstuk: '1'
        paragraaf: '1.1'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 11a
      - id: ref3
        bwb_id: BWBR0010388
        artikel: '22'
  - number: 10c.5
    text: |-
      Bij een melding als bedoeld in het eerste lid verstrekt een instelling de gegevens, bedoeld
      in [artikel 15a, tweede lid, onderdelen a en e, van de Handelsregisterwet 2007][ref1] dan wel
      __REF001___________________________________________________________________________________________________________
      __________________________________________________, waarover zij beschikt en kan zij de bescheiden, bedoeld in
      artikel 15a, derde lid, van de Handelsregisterwet 2007 dan wel artikel 5, vierde lid, van de Implementatiewet
      registratie uiteindelijk belanghebbenden van trusts en soortgelijke juridische constructies, verstrekken waarover
      zij beschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel15a
      [ref2]: https://wetten.overheid.nl/BWBR0046156#Artikel5
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: 15a
      - id: ref2
        bwb_id: BWBR0046156
        artikel: '5'
  - number: 10c.6
    text: De Kamer van Koophandel bepaalt de wijze waarop een melding als bedoeld in het eerste lid wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel10c
  - number: '11.1'
    text: |-
      Indien de cliënt, de insteller van een trust, de trustee van een trust, de vennoot van een personenvennootschap of
      de persoon bevoegd inzake het beheer van de personenvennootschap een natuurlijke persoon is, wordt diens identiteit
      geverifieerd aan de hand van documenten, gegevens of inlichtingen uit betrouwbare en onafhankelijke bron. Bij
      ministeriële regeling kunnen documenten, gegevens of inlichtingen worden aangewezen op basis waarvan kan worden
      voldaan aan het in de vorige zin bepaalde.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel11
  - number: '11.2'
    text: |-
      Indien de cliënt, de insteller van een trust, de trustee van een trust, de vennoot van een personenvennootschap
      of de persoon bevoegd inzake het beheer van de personenvennootschap een rechtspersoon is opgericht naar Nederlands
      recht en in Nederland zijn zetel heeft of een buitenlandse rechtspersoon is die in Nederland is gevestigd,
      wordt diens identiteit geverifieerd aan de hand van documenten, gegevens of inlichtingen uit betrouwbare en
      onafhankelijke bron. Bij ministeriële regeling kunnen documenten, gegevens of inlichtingen worden aangewezen op
      basis waarvan kan worden voldaan aan het in de vorige zin bepaalde.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel11
  - number: '11.3'
    text: |-
      Indien de cliënt, de insteller van een trust, de trustee van een trust, de vennoot van een personenvennootschap
      of de persoon bevoegd inzake het beheer van de personenvennootschap een buitenlandse rechtspersoon is die niet in
      Nederland is gevestigd, wordt de identiteit geverifieerd op basis van betrouwbare en in het internationale verkeer
      gebruikelijke documenten uit onafhankelijke bron, gegevens of inlichtingen of op basis van documenten, gegevens of
      inlichtingen die bij wet als geldig middel voor identificatie zijn erkend in de staat van herkomst van de cliënt,
      de insteller van een trust, de trustee van een trust, de vennoot van een personenvennootschap of de persoon bevoegd
      inzake het beheer van de personenvennootschap.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel11
  - number: '11.4'
    text: |-
      Bij ministeriële regeling kunnen regels worden vastgesteld met betrekking tot het verifiëren van de identiteit van
      cliënten die niet onder het eerste tot en met het derde lid vallen.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel11
  - number: '12.1'
    text: Er is een Financiële inlichtingen eenheid.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel12
  - number: '12.2'
    text: |-
      De algemene leiding, de organisatie en het beheer van de Financiële inlichtingen eenheid berusten bij Onze Minister
      van Justitie.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel12
  - number: '12.3'
    text: |-
      Benoeming, schorsing en ontslag van het hoofd van de Financiële inlichtingen eenheid geschieden bij koninklijk
      besluit op voordracht van Onze Minister van Justitie, in overeenstemming met Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel12
  - number: '12.4'
    text: |-
      Onze Minister van Justitie bepaalt in overeenstemming met Onze Minister van Financiën de begroting van de
      Financiële inlichtingen eenheid.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel12
  - number: '13'
    text: |-
      De Financiële inlichtingen eenheid heeft met het oog op het voorkomen en opsporen van witwassen en onderliggende
      basisdelicten, alsmede financieren van terrorisme, tot taak:
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13
  - number: 13.a
    text: |-
      het verzamelen, registreren, bewerken en analyseren van de gegevens die het verkrijgt, teneinde te bezien of deze
      gegevens van belang kunnen zijn voor het voorkomen en opsporen van misdrijven;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13
  - number: 13.b
    text: |-
      het verstrekken van persoonsgegevens en andere gegevens in overeenstemming met deze wet en het bij of krachtens de
      [Wet politiegegevens][ref1] bepaalde;


      [ref1]: https://wetten.overheid.nl/BWBR0022463
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0022463
  - number: 13.c
    text: |-
      een instelling berichten over de ontvangst van een melding door die instelling, de ontvangst van nadere gegevens
      of inlichtingen verstrekt door die instelling, alsmede over trends en fenomenen die naar voren komen uit ontvangen
      meldingen, en in voorkomende gevallen, door tussenkomst van het openbaar ministerie, over de betekenis van een
      melding door die instelling voor de vervolging van strafbare feiten;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13
  - number: 13.d
    text: |-
      het verrichten van onderzoek naar ontwikkelingen op het gebied van witwassen en financieren van terrorisme en naar
      de verbetering van de methoden om witwassen en financieren van terrorisme te voorkomen en op te sporen;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13
  - number: 13.e
    text: |-
      het geven van aanbevelingen voor de bedrijfstakken omtrent de invoering van passende procedures voor interne
      controle en communicatie en andere te treffen maatregelen tot voorkoming van het gebruik van die bedrijfstakken
      voor witwassen en financieren van terrorisme;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13
  - number: 13.f
    text: 'het geven van voorlichting omtrent het voorkomen en opsporen van witwassen en financieren van terrorisme aan:'
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13
  - number: 13.f.1°
    text: de bedrijfstakken en beroepsgroepen;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13
  - number: 13.f.2°
    text: de toezichthoudende autoriteit;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13
  - number: 13.f.3°
    text: het openbaar ministerie en de overige ambtenaren belast met de opsporing van strafbare feiten;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13
  - number: 13.f.4°
    text: het publiek;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13
  - number: 13.g
    text: |-
      het geven van inlichtingen aangaande het meldgedrag van de instellingen aan de toezichthoudende autoriteit en de
      personen, bedoeld in onderdeel f, onder 3°;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13
  - number: 13.h
    text: |-
      het onderhouden van contacten met buitenlandse van overheidswege aangewezen instanties die een vergelijkbare taak
      hebben als de Financiële inlichtingen eenheid;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13
  - number: 13.i
    text: |-
      het jaarlijks uitbrengen van een verslag met betrekking tot de taakuitoefening en zijn werkzaamheden in het
      voorafgaande jaar en van zijn voornemens voor het komende jaar, dat wordt aangeboden aan Onze Minister van Justitie
      en ter kennis gebracht van Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13
  - number: 13a.1
    text: |-
      Ten behoeve van de uitoefening van haar taken op grond van [artikel 13][ref1], werkt de Financiële inlichtingen
      eenheid zoveel mogelijk samen met de financiële inlichtingen eenheden van andere lidstaten.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel13
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 13a.2
    text: |-
      De Financiële inlichtingen eenheid wisselt met een financiële inlichtingen eenheid van een andere lidstaat, uit
      eigen beweging of op verzoek van die andere financiële inlichtingen eenheid en zo nodig onder het stellen van
      voorwaarden of beperkingen, alle beschikbare informatie uit die relevant kan zijn voor de verwerking of de analyse
      door die financiële inlichtingen eenheid van informatie met betrekking tot witwassen of financieren van terrorisme
      en de betrokken natuurlijke of rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13a
  - number: 13a.3
    text: 'De informatie, bedoeld in het tweede lid, wordt ook uitgewisseld indien:'
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13a
  - number: 13a.3.a
    text: |-
      op het tijdstip van uitwisseling niet is vastgesteld welk basisdelict bij de te analyseren of de te verwerken
      informatie is betrokken;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13a
  - number: 13a.3.b
    text: |-
      de definitie van een betrokken misdrijf van fiscale aard in de andere lidstaat anders is dan naar Nederlands recht
      omschreven.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13a
  - number: 13a.4
    text: |-
      Een verzoek als bedoeld in het tweede lid wordt door de Financiële inlichtingen eenheid in behandeling genomen,
      indien:
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13a
  - number: 13a.4.a
    text: het verzoek de relevante feiten en achtergrondinformatie bevat; en
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13a
  - number: 13a.4.b
    text: |-
      in het verzoek uiteen is gezet wat de redenen zijn voor het verzoek en hoe de gevraagde informatie zal worden
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13a
  - number: 13a.5
    text: |-
      Indien een verzoek als bedoeld in het tweede lid in behandeling wordt genomen, gebruikt de Financiële inlichtingen
      eenheid voor het vergaren van de verzochte informatie al haar bevoegdheden op grond van deze wet en verstrekt zij
      de verzochte informatie onverwijld aan de financiële inlichtingen eenheid van de andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13a
  - number: 13a.6
    text: |-
      Aan een verzoek als bedoeld in het tweede lid wordt niet voldaan indien het verstrekken van de gevraagde informatie
      zich niet zou verdragen met de Nederlandse wet.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13a
  - number: 13a.7
    text: |-
      De Financiële inlichtingen eenheid wijst een centraal contactpunt aan dat verantwoordelijk is voor de ontvangst van
      de verzoeken bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13a
  - number: 13a.8
    text: |-
      Indien een financiële inlichtingen eenheid van een andere lidstaat verzoekt om toestemming voor het delen van
      informatie afkomstig van de Financiële inlichtingen eenheid met bevoegde autoriteiten in een andere lidstaat,
      verstrekt de Financiële inlichtingen eenheid deze toestemming onverwijld en zo ruim mogelijk, tenzij het verlenen
      van toestemming:
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13a
  - number: 13a.8.a
    text: niet past binnen het kader van de wetgeving ter voorkoming van witwassen en financieren van terrorisme;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13a
  - number: 13a.8.b
    text: strijdig is met wettelijke bepalingen;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13a
  - number: 13a.8.c
    text: een strafrechtelijk onderzoek kan schaden; of
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13a
  - number: 13a.8.d
    text: de belangen van natuurlijke of rechtspersonen op wie de informatie betrekking heeft onevenredig kan schaden.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13a
  - number: 13a.9
    text: |-
      Indien het verstrekken van informatie of het verlenen van toestemming op grond van het zesde lid, onderscheidenlijk
      het achtste lid, wordt geweigerd, wordt dit gemotiveerd kenbaar gemaakt aan de financiële inlichtingen eenheid die
      om de informatie of toestemming heeft verzocht.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13a
  - number: 13b.1
    text: |-
      De Financiële inlichtingen eenheid kan, ten behoeve van haar taken, bedoeld in [artikel 13][ref1], een financiële
      inlichtingen eenheid van een andere lidstaat verzoeken om informatie die relevant kan zijn voor de verwerking of
      de analyse van informatie met betrekking tot witwassen of financieren van terrorisme en de betrokken natuurlijke of
      rechtspersonen, indien zij daarbij ten minste de volgende informatie verstrekt:


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel13
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 13b.1.a
    text: relevante feiten en achtergrondinformatie bij het verzoek;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13b
  - number: 13b.1.b
    text: de redenen voor het verzoek; en
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13b
  - number: 13b.1.c
    text: de wijze waarop de verzochte informatie zal worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13b
  - number: 13b.2
    text: |-
      De Financiële inlichtingen eenheid gebruikt informatie die zij heeft ontvangen van een financiële inlichtingen
      eenheid van een andere lidstaat uitsluitend indien:
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13b
  - number: 13b.2.a
    text: |-
      het gebruik van de informatie noodzakelijk is voor het vervullen van haar taken, bedoeld in [artikel 13][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel13
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 13b.2.b
    text: |-
      het gebruik van de informatie alleen plaatsvindt voor het doel waarvoor de informatie is gevraagd of verstrekt, dan
      wel met voorafgaande toestemming van de financiële inlichtingen eenheid die de informatie heeft verstrekt; en
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13b
  - number: 13b.2.c
    text: |-
      wordt voldaan aan de beperkingen en voorwaarden die aan het gebruik van de informatie zijn gesteld door de
      financiële inlichtingen eenheid die de informatie heeft verstrekt.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13b
  - number: 13b.3
    text: |-
      Informatie afkomstig van een financiële inlichtingen eenheid van een andere lidstaat wordt door de Financiële
      inlichtingen eenheid niet zonder voorafgaande toestemming van die financiële inlichtingen eenheid verstrekt aan de
      personen, bedoeld in [artikel 13, onderdeel g][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel13
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 13c.1
    text: |-
      De Financiële inlichtingen eenheid werkt bij de toepassing van geavanceerde technologieën samen met de financiële
      inlichtingen eenheden van andere lidstaten. Deze technologieën stellen de Financiële inlichtingen eenheid in
      staat om, onder de voorwaarden gesteld in de [artikelen 13a][ref1] en [13b][ref2], anoniem verbanden te leggen
      tussen de eigen gegevens en de gegevens van andere financiële inlichtingen eenheden, zodat personen die in verband
      worden gebracht met witwassen en het financieren van terrorisme kunnen worden opgespoord en hun opbrengsten en
      geldmiddelen kunnen worden geïdentificeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel13a
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel13b
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13c
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 13a
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: 13b
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 13c.2
    text: |-
      De Financiële inlichtingen eenheid maakt voor de contacten met de financiële inlichtingen eenheden van de andere
      lidstaten gebruik van beschermde kanalen.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel13c
  - number: '14.1'
    text: |-
      Bij de Financiële inlichtingen eenheid kunnen persoonsgegevens worden verwerkt ten behoeve van de taak, bedoeld
      in [artikel 13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel13
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '14.2'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over de categorieën van personen waarover de Financiële
      inlichtingen eenheid gegevens verwerkt, de gegevensverstrekking en verbanden met andere verzamelingen van
      persoonsgegevens, de bewaring en vernietiging van gegevens en de protocolplicht.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel14
  - number: '14.3'
    text: |-
      Op de verwerking van persoonsgegevens door de Financiële inlichtingen eenheid zijn de [artikelen 1][ref1],
      [2][ref2], [3, eerste en tweede lid][ref3], [4][ref4], [4a][ref5], [4b][ref6], [4c][ref7], [5][ref8],
      [6][ref9], [6a][ref10], [6b][ref11], [6c][ref12], [7][ref13], [7a][ref14], [15][ref15], [15a][ref16],
      [16, eerste lid, onderdelen a en b][ref17], [17][ref18], [17b](onbekend), [18][ref19], [22][ref20] en [23][ref21],
      [24a tot en met 33b][ref22], alsmede de [artikelen 35 tot en met 36 van de Wet politiegegevens][ref23]
      van overeenkomstige toepassing, met dien verstande dat voor de Financiële inlichtingen eenheid als
      verwerkingsverantwoordelijke in de zin van artikel 1, onderdeel f, van die wet wordt aangemerkt Onze Minister van
      Justitie en Veiligheid.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0022463#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0022463#Artikel4a
      [ref6]: https://wetten.overheid.nl/BWBR0022463#Artikel4b
      [ref7]: https://wetten.overheid.nl/BWBR0022463#Artikel4c
      [ref8]: https://wetten.overheid.nl/BWBR0022463#Artikel5
      [ref9]: https://wetten.overheid.nl/BWBR0022463#Artikel6
