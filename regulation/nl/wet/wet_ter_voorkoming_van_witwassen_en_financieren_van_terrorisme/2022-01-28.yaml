    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel1a
  - number: 1a.5
    text: |-
      Deze wet is niet van toepassing op belastingadviseurs als bedoeld in het vierde lid, onderdeel a, en personen als
      bedoeld in het vierde lid, onderdeel c, d en e, voor zover zij voor een cliënt werkzaamheden verrichten betreffende
      de bepaling van diens rechtspositie, diens vertegenwoordiging en verdediging in rechte, het geven van advies voor,
      tijdens en na een rechtsgeding of het geven van advies over het instellen of vermijden van een rechtsgeding.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel1a
  - number: 1a.6
    text: |-
      Indien een beleggingsinstelling als bedoeld in het derde lid, onderdeel d, een beleggingsmaatschappij met aparte
      beheerder is of een beleggingsfonds of indien een icbe als bedoeld in het derde lid, onderdeel h, een fonds voor
      collectieve belegging in effecten of een maatschappij voor collectieve belegging in effecten met aparte beheerder
      is, draagt de beheerder van de betreffende instelling zorg voor de naleving van de bij of krachtens deze wet
      gestelde regels door de instelling.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel1a
  - number: 1b.1
    text: |-
      Bij regeling van Onze Minister van Financiën en Onze Minister van Justitie en Veiligheid kunnen instellingen als
      bedoeld in [artikel 1a, vierde lid, onderdeel n][ref1], zo nodig onder het stellen van aanvullende regels, geheel
      of gedeeltelijk worden vrijgesteld van de bij of krachtens deze wet gestelde regels, indien, rekening houdend met
      de aard en de omvang van de te verlenen diensten, voor die instellingen een bewezen laag risico op witwassen en
      financieren van terrorisme bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 1a
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 1b.2
    text: |-
      Geen vrijstelling kan worden verleend aan instellingen als bedoeld in [artikel 1a, vierde lid, onderdeel n][ref1],
      die activiteiten verrichten als bedoeld in [artikel 27g][ref2] of [31 van de Wet op de kansspelen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel27g
      [ref3]: https://wetten.overheid.nl/BWBR0002469#Artikel31
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel1b
    references:
