  - number: 30.b
    text: |-
      overtreding van [artikel 1a, zesde lid][ref1], voor zover de overtreding betrekking heeft op de regels die bij of
      krachtens de in onderdeel a genoemde artikelen zijn gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 1a
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 30.c
    text: |-
      overtreding van de bij of krachtens de artikelen 4 tot en met 14 en 16, eerste lid, van de verordening betreffende
      bij geldovermakingen te voegen informatie gestelde regels;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel30
  - number: 30.d
    text: overtreding van de bij of krachtens de verordening inzake de veiling van broeikasgasemissierechten gestelde regels;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel30
  - number: 30.e
    text: |-
      overtreding van de bij of krachtens een bij algemene maatregel van bestuur aangewezen verordening als bedoeld in
      [artikel 1d, vierde lid][ref1], gestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1d
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 1d
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 30.f
    text: |-
      overtreding van [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 30.g
    text: |-
      het geen gevolg geven dan wel niet tijdig of onvolledig gevolg geven aan een aanwijzing als bedoeld in
      [artikel 28][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel28
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '31.1'
    text: |-
      Het bedrag van de bestuurlijke boete wordt bepaald bij algemene maatregel van bestuur, met dien verstande dat de
      bestuurlijke boete voor een afzonderlijke overtreding ten hoogste € 5.000.000, of, in gevallen als bedoeld in het
      vierde lid, ten hoogste € 10.000.000 bedraagt.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel31
  - number: '31.2'
    text: |-
      De algemene maatregel van bestuur, bedoeld in het eerste lid, bepaalt bij elke daarin omschreven overtreding het
      maximale bedrag van de op te leggen bestuurlijke boete. De overtredingen worden gerangschikt in categorieën naar
      zwaarte van de overtreding met de daarbij behorende basisbedragen, minimumbedragen en maximumbedragen. Daarbij
      wordt de volgende indeling gebruikt:








                    Categorie


                    Basisbedrag


                    Minimumbedrag


                    Maximumbedrag






                    1


                    € 10.000,–


                    € 0,–


                    € 10.000,–




                    2


                    € 500.000,–


                    € 0,–


                    € 1.000.000,–




                    3


                    € 2.000.000,–


                    € 0,–


                    € 4.000.000,–
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel31
  - number: '31.3'
    text: |-
      In afwijking van het tweede lid, bedraagt het basisbedrag voor de bestuurlijke boete voor een overtreding
      die is gerangschikt in de derde categorie indien de boete wordt opgelegd aan een instelling als bedoeld in
      [artikel 1a, tweede, derde, of vierde lid, onderdeel f][ref1], € 2.500.000,– en is het maximumbedrag van de
      bestuurlijke boete € 5.000.000,–.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 1a
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: '31.4'
    text: |-
      Indien ten tijde van het plegen van de overtreding nog geen vijf jaren zijn verstreken sinds het opleggen van een
      bestuurlijke boete aan de overtreder ter zake van eenzelfde overtreding, bedraagt de bestuurlijke boete voor een
      afzonderlijke overtreding ten hoogste tweemaal het ingevolge het tweede of derde lid toepasselijke maximumbedrag.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel31
  - number: '32.1'
    text: |-
      Indien de boete wordt opgelegd aan een instelling als bedoeld in
      [artikel 1a, tweede, derde, of vierde lid, onderdeel f][ref1], bedraagt de bestuurlijke boete voor
      een afzonderlijke overtreding van een voorschrift gerangschikt in de derde categorie, in afwijking van
      [artikel 31][ref2], ten hoogste 20% van de netto-omzet van de overtreder in het boekjaar voorafgaande aan de
      beschikking waarmee de bestuurlijke boete wordt opgelegd, indien dit meer is dan tweemaal het ingevolge artikel 31,
      derde lid, toepasselijke maximumbedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel31
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 1a
        hoofdstuk: '1'
        paragraaf: '1.1'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '31'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '32.2'
    text: |-
      Indien de bestuurlijke boete wordt opgelegd aan een onderneming die opgenomen is in een groep met een
      geconsolideerde jaarrekening, worden bij de berekening van de netto-omzet de totaalbedragen gehanteerd uit de
      geconsolideerde jaarrekening van de uiteindelijke moederonderneming.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel32
  - number: 32a
    text: |-
      De toezichthoudende autoriteit kan in afwijking van [artikel 31][ref1] een bestuurlijke boete opleggen van ten
      hoogste tweemaal het bedrag van het voordeel dat de overtreder door de overtreding heeft verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel31
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '31'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 32b.1
    text: |-
      Indien tegen een besluit tot het opleggen van een bestuurlijke boete bezwaar, beroep of hoger beroep wordt
      aangetekend, schorst dit de verplichting tot betaling van de boete totdat de beroepstermijn is verstreken of,
      indien beroep of hoger beroep is ingesteld, op het beroep of hoger beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel32b
  - number: 32b.2
    text: De schorsing van de verplichting tot betaling schorst niet de berekening van de wettelijke rente.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel32b
  - number: 32c.1
    text: |-
      Bij een overtreding die beboetbaar is met een boete gerangschikt in de tweede of derde boetecategorie, bedoeld in
      [artikel 31, tweede lid][ref1], kan de toezichthoudende autoriteit de overtreder de bevoegdheid ontzeggen om bij
      een instelling als bedoeld in [artikel 1a][ref2] beleidsbepalende functies uit te oefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel32c
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '31'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: 1a
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 32c.2
    text: |-
      Indien de overtreding, bedoeld in het eerste lid, is begaan door een rechtspersoon, is het eerste lid van
      overeenkomstige toepassing op de natuurlijke personen die tot de betrokken gedraging opdracht hebben gegeven of
      daar feitelijk leiding aan hebben gegeven.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel32c
  - number: 32c.3
    text: |-
      Een ontzegging als bedoeld in het eerste lid kan worden opgelegd voor de duur van ten hoogste een jaar en eenmaal
      met ten hoogste een jaar worden verlengd.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel32c
  - number: 32d.1
    text: |-
      De toezichthoudende autoriteit kan ten aanzien van vestigingen als bedoeld in [artikel 2e, eerste lid][ref1],
      passende en evenredige maatregelen nemen om ernstige gebreken die onmiddellijke maatregelen vereisen, te
      adresseren.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel2e
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel32d
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 2e
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: 32d.2
    text: |-
      De maatregelen, bedoeld in het eerste lid, zijn van tijdelijke aard en worden beëindigd wanneer de geconstateerde
      gebreken zijn hersteld.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel32d
  - number: 32e
    text: |-
      De toezichthoudende autoriteit kan een waarschuwing of verklaring publiceren, onder vermelding van de
      overtreding en de overtreder, bij overtreding van de in [artikel 30][ref1] bedoelde voorschriften, voor zover
      deze overtreding beboetbaar is met een boete gerangschikt in de tweede of derde boetecategorie, bedoeld in
      [artikel 31, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel31
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel32e
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '30'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '31'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 32f.1
    text: |-
      De toezichthoudende autoriteit maakt een besluit tot het opleggen van een bestuurlijke sanctie ingevolge deze wet
      openbaar. De openbaarmaking geschiedt zodra het besluit onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel32f
  - number: 32f.2
    text: |-
      Indien tegen een besluit als bedoeld in het eerste lid bezwaar, beroep of hoger beroep is ingesteld, wordt de
      uitkomst daarvan tezamen met het besluit openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel32f
  - number: 32f.3
    text: |-
      In aanvulling op [artikel 5:2, eerste lid, onderdeel a, van de Algemene wet bestuursrecht][ref1] wordt onder
      bestuurlijke sanctie mede verstaan: het door de toezichthoudende autoriteit wegens een overtreding beëindigen of
      beperken van een recht of bevoegdheid alsmede het opleggen van een verbod.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel32f
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 32f.4
    text: |-
      In afwijking van het eerste lid maakt de toezichthoudende autoriteit een besluit tot het opleggen van een
      bestuurlijke boete zo spoedig mogelijk openbaar, indien het een bestuurlijke boete betreft ter zake een overtreding
      van een voorschrift dat op grond van [artikel 31, tweede lid][ref1], is gerangschikt in de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel31
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel32f
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '31'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 32f.5
    text: |-
      De toezichthoudende autoriteit maakt in afwijking van het eerste lid een besluit tot het opleggen van een last
      onder dwangsom ingevolge deze wet zo spoedig mogelijk openbaar, indien een dwangsom wordt verbeurd.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel32f
  - number: 32f.6
    text: |-
      De toezichthoudende autoriteit maakt de indiening van een bezwaar of de instelling van een beroep of hoger beroep
      tegen een besluit als bedoeld in het vierde of vijfde lid, alsmede de beslissing op bezwaar en de uitkomst van
      dat beroep of hoger beroep, zo spoedig mogelijk openbaar, tenzij het besluit op grond van [artikel 32g][ref1] niet
      openbaar is gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel32g
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel32f
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 32g
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 32f.7
    text: |-
      Een besluit dat ingevolge het eerste, vierde of vijfde lid openbaar is gemaakt, blijft, tenzij bij wettelijk
      voorschrift anders bepaald, gedurende een periode van vijf jaar na bekendmaking beschikbaar op de website van de
      toezichthoudende autoriteit, met uitzondering van de persoonsgegevens die deel uitmaken van het besluit indien enig
      wettelijk voorschrift daaraan in de weg staat.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel32f
  - number: 32g.1
    text: |-
      Openbaarmaking op grond van [artikel 32f][ref1] wordt uitgesteld of geschiedt in zodanige vorm dat de openbaar te
      maken gegevens niet herleidbaar zijn tot afzonderlijke personen voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel32f
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel32g
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 32f
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 32g.1.a
    text: |-
      die gegevens herleidbaar zijn tot een natuurlijke persoon en bekendmaking van zijn persoonsgegevens onevenredig
      zou zijn;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel32g
  - number: 32g.1.b
    text: betrokken partijen in onevenredige mate schade zou worden berokkend;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel32g
  - number: 32g.1.c
    text: |-
      een lopend strafrechtelijk onderzoek of een lopend onderzoek door de personen, bedoeld in [artikel 24][ref1], naar
      mogelijke overtredingen zou worden ondermijnd; of


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel24
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel32g
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 32g.1.d
    text: de stabiliteit van het financiële stelsel in gevaar zou worden gebracht.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel32g
  - number: 32g.2
    text: |-
      Openbaarmaking op grond van [artikel 32f][ref1] blijft achterwege, indien openbaarmaking overeenkomstig het eerste
      lid:


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel32f
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel32g
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 32f
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 32g.2.a
    text: |-
      onevenredig zou zijn gezien de geringe ernst van de overtreding, tenzij het een besluit tot het opleggen van een
      bestuurlijke boete betreft; of
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel32g
  - number: 32g.2.b
    text: de stabiliteit van het financiële stelsel in gevaar zou brengen.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel32g
  - number: 32h.1
    text: |-
      Alvorens over te gaan tot openbaarmaking van gegevens die tot afzonderlijke personen herleidbaar zijn op grond van
      deze paragraaf, neemt de toezichthoudende autoriteit een besluit tot openbaarmaking. Dit besluit bevat de openbaar
      te maken gegevens en de wijze en termijn waarop de openbaarmaking zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel32h
  - number: 32h.2
    text: |-
      Onverminderd [artikel 4:11 van de Algemene wet bestuursrecht][ref1] kan de toezichthoudende
      autoriteit bij het nemen van een besluit op grond van [artikel 32e][ref2] de toepassing van
      [artikel 4:8 van de Algemene wet bestuursrecht][ref3] achterwege laten, indien van de betrokken persoon geen adres
      bekend is en het adres ook niet met een redelijke inspanning kan worden verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel32e
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel32h
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: 32e
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 32i.1
    text: |-
      De toezichthoudende autoriteit gaat pas over tot openbaarmaking op grond van [artikel 32e][ref1] of
      [32f, vierde of vijfde lid][ref2], nadat vijf werkdagen zijn verstreken na de dag waarop de betrokken persoon van
      het besluit tot het publiceren van een waarschuwing of verklaring in kennis is gesteld of het besluit tot opleggen
      van een boete of last onder dwangsom aan hem bekend is gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel32e
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel32f
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel32i
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 32e
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: 32f
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 32i.2
    text: |-
      Indien wordt verzocht om een voorlopige voorziening als bedoeld in
      [artikel 8:81 van de Algemene wet bestuursrecht][ref1] om openbaarmaking op grond van deze paragraaf te voorkomen,
      wordt de openbaarmaking opgeschort totdat de voorzieningenrechter uitspraak heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel32i
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 32i.3
    text: |-
      De toezichthoudende autoriteit beëindigt het openbaar beschikbaar houden van gegevens die tot afzonderlijke
      personen herleidbaar zijn op grond van [artikel 32e][ref1] en [32f][ref2] onverwijld voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel32e
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel32f
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel32i
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 32e
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: 32f
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 32i.3.a
    text: het besluit tot openbaarmaking wordt ingetrokken;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel32i
  - number: 32i.3.b
    text: het besluit tot openbaarmaking door de bestuursrechter onherroepelijk wordt vernietigd.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel32i
  - number: 32i.4
    text: |-
      In de gevallen bedoeld in het derde lid, biedt de toezichthoudende autoriteit de belanghebbende aan de intrekking
      of de vernietiging openbaar te maken.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel32i
  - number: 32j.1
    text: |-
      Indien wordt verzocht om een voorlopige voorziening als bedoeld in
      [artikel 8:81 van de Algemene wet bestuursrecht][ref1] om openbaarmaking op grond van deze paragraaf te voorkomen,
      vindt het onderzoek ter zitting plaats met gesloten deuren.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel32j
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 32j.2
    text: |-
      Indien de voorzieningenrechter openbaarmaking op grond van deze paragraaf heeft verboden, of indien op grond van
      [artikel 32g][ref1] nog geen tot personen herleidbare openbaarmaking heeft plaatsgevonden, vindt het horen van
      belanghebbenden ter zake van het bezwaar tegen het besluit tot openbaarmaking of het besluit tot het opleggen van
      de bestuurlijke sanctie niet in het openbaar plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel32g
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel32j
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 32g
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 32j.3
    text: |-
      Indien de voorzieningenrechter openbaarmaking op grond van deze paragraaf heeft verboden, of indien op grond van
      [artikel 32g][ref1] nog geen tot afzonderlijke personen herleidbare openbaarmaking heeft plaatsgevonden, en beroep
      of hoger beroep wordt ingesteld tegen de beslissing op het bezwaar tegen het besluit tot openbaarmaking of het
      besluit tot het opleggen van de bestuurlijke sanctie, vindt het onderzoek ter zitting plaats met gesloten deuren.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel32g
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel32j
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 32g
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '33.1'
    text: |-
      Een instelling die op grond van deze wet cliëntenonderzoek heeft verricht, of bij wie een cliënt is
      geïntroduceerd conform de procedure van [artikel 5][ref1], legt op opvraagbare wijze de documenten en gegevens
      vast die zijn gebruikt voor de naleving van het bepaalde in [artikel 3, tweede tot en met vierde lid][ref2],
      [artikel 3a, eerste lid][ref3], [artikel 6, eerste en tweede lid][ref4], [artikel 7, tweede lid][ref5], en
      [artikel 8, derde tot en met zesde en achtste lid][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0024282#Artikel3a
      [ref4]: https://wetten.overheid.nl/BWBR0024282#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0024282#Artikel7
      [ref6]: https://wetten.overheid.nl/BWBR0024282#Artikel8
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref3
        bwb_id: BWBR0024282
        artikel: 3a
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref4
        bwb_id: BWBR0024282
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref5
        bwb_id: BWBR0024282
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref6
        bwb_id: BWBR0024282
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '33.2'
    text: 'Onder de documenten en gegevens, bedoeld in het eerste lid, zijn ten minste begrepen:'
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel33
  - number: 33.2.a
    text: |-
      van natuurlijke personen, niet zijnde uiteindelijk belanghebbenden als bedoeld in [artikel 1, eerste lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 33.2.a.1°
    text: |-
      de geslachtsnaam, de voornamen, de geboortedatum, het adres en de woonplaats, dan wel de plaats van vestiging van
      de cliënt alsmede van degene die namens die natuurlijke persoon optreedt, of een afschrift van het document dat een
      persoonidentificerend nummer bevat en aan de hand waarvan de verificatie van de identiteit heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel33
  - number: 33.2.a.2°
    text: |-
      de aard, het nummer en de datum en plaats van uitgifte van het document met behulp waarvan de identiteit is
      geverifieerd;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel33
  - number: 33.2.b
    text: |-
      van natuurlijke personen, zijnde uiteindelijk belanghebbenden als bedoeld in [artikel 1, eerste lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 33.2.b.1°
    text: de identiteit, waaronder ten minste de geslachtsnaam en voornamen van de uiteindelijk belanghebbende; en
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel33
  - number: 33.2.b.2°
    text: |-
      de gegevens en documenten die zijn vergaard op basis van de redelijke maatregelen die zijn genomen om de identiteit
      van de uiteindelijk belanghebbende te verifiëren;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel33
  - number: 33.2.c
    text: 'van vennootschappen of andere juridische entiteiten:'
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel33
  - number: 33.2.c.1°
    text: |-
      de rechtsvorm, de statutaire naam, de handelsnaam, het adres met huisnummer, de postcode, de plaats van vestiging
      en het land van statutaire zetel;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel33
  - number: 33.2.c.2°
    text: |-
      indien de vennootschap of andere juridische entiteit bij de Kamer van Koophandel is geregistreerd, het
      registratienummer bij de Kamer van Koophandel en de wijze waarop de identiteit is geverifieerd;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel33
  - number: 33.2.c.3°
    text: |-
      van degenen die voor de vennootschap of juridische entiteit bij de instelling optreden: de geslachtsnaam, de
      voornamen en de geboortedatum.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel33
  - number: 33.2.d
    text: 'van trusts of andere juridische constructies:'
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel33
  - number: 33.2.d.1°
    text: het doel en de aard van de trust of andere juridische constructie;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel33
  - number: 33.2.d.2°
    text: het recht waardoor de trust of andere juridische constructie wordt beheerst.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel33
  - number: '33.3'
    text: |-
      Een instelling bewaart de in het eerste en tweede lid bedoelde gegevens op toegankelijke wijze gedurende vijf
      jaar na het tijdstip van het beëindigen van de zakelijke relatie of gedurende vijf jaar na het uitvoeren van de
      desbetreffende transactie.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel33
  - number: '33.4'
    text: |-
      Een instelling beschikt over systemen die haar in staat stellen onverwijld en volledig te reageren op vragen van de
      Financiële inlichtingen eenheid en van de toezichthoudende autoriteit, waaronder:
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel33
  - number: 33.4.a
    text: |-
      de vraag of zij met een bepaalde cliënt een zakelijke relatie onderhoudt of gedurende een periode van vijf jaar
      voorafgaand aan het verzoek heeft onderhouden;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel33
  - number: 33.4.b
    text: vragen over de aard van de relatie met de bedoelde cliënt.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel33
  - number: '33.5'
    text: |-
      De systemen, bedoeld in het vierde lid, voorzien in beveiligde kanalen die de vertrouwelijkheid van de in dat lid
      bedoelde verzoeken waarborgen.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel33
  - number: '34.1'
    text: |-
      Een instelling die op grond van [artikel 16, eerste lid][ref1], een verrichte of voorgenomen ongebruikelijke
      transactie heeft gemeld, legt op opvraagbare wijze de volgende gegevens vast:


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel16
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 34.1.a
    text: |-
      alle gegevens, bedoeld in [artikel 16, tweede lid][ref1], die noodzakelijk zijn om de desbetreffende transactie te
      kunnen reconstrueren;


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel16
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 34.1.b
    text: |-
      een afschrift van de melding, bedoeld in [artikel 16, eerste lid][ref1], alsmede de daarbij verstrekte informatie
      en gegevens;


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel16
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 34.1.c
    text: |-
      het bericht van de Financiële inlichtingen eenheid van ontvangst van deze melding, als bedoeld in
      [artikel 13, onderdeel c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel13
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '34.2'
    text: |-
      Een instelling bewaart de in het eerste lid bedoelde gegevens op toegankelijke wijze gedurende vijf jaar na
      het tijdstip van het doen van de melding, respectievelijk het tijdstip van de ontvangst van het bericht van de
      Financiële inlichtingen eenheid.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel34
  - number: 34a.1
    text: |-
      Persoonsgegevens, verzameld op grond van deze wet, worden door een instelling alleen verwerkt met het oog op het
      voorkomen van witwassen en financieren van terrorisme en worden niet verder verwerkt voor commerciële doeleinden of
      andere doeleinden die niet verenigbaar zijn met dat doel.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel34a
  - number: 34a.2
    text: |-
      Een instelling verstrekt, alvorens een zakelijke relatie aan te gaan of een incidentele transactie te verrichten,
      informatie aan een cliënt over de krachtens deze wet geldende verplichtingen ter zake van de verwerking van
      persoonsgegevens met het oog op het voorkomen van witwassen en financieren van terrorisme.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel34a
  - number: 34a.3
    text: |-
      Een instelling vernietigt de persoonsgegevens die zij uit hoofde van deze wet heeft verkregen onmiddellijk na
      het verstrijken van de termijn, bedoeld in [artikel 33, derde lid][ref1], en [34][ref2], tenzij bij wettelijk
      voorschrift anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel34
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '33'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '34'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '35'
    text: |-
      Een instelling draagt er zorg voor dat haar werknemers, alsmede de dagelijks beleidsbepalers voor zover relevant
      voor de uitoefening van hun taken en rekening houdend met de risico’s, aard en omvang van de instelling, worden
      doorgelicht, bekend zijn met de bepalingen van deze wet en periodiek opleidingen genieten die hen in staat stellen
      een ongebruikelijke transactie te herkennen en een cliëntenonderzoek goed en volledig uit te voeren.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel35
  - number: 35a.1
    text: |-
      De instellingen, bedoeld in [artikel 1a, vierde lid, onderdeel a tot en met e en h][ref1], voor zover
      zij bemiddelen bij het tot stand brengen en sluiten van overeenkomsten inzake onroerende zaken en rechten
      waaraan onroerende zaken zijn onderworpen, verstrekken op verzoek aan de toezichthoudende autoriteit
      een door Onze Minister van Justitie en Veiligheid afgegeven verklaring omtrent het gedrag als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref2] met betrekking tot de personen die het
      beleid bepalen of mede bepalen, binnen een door de toezichthoudende autoriteit te stellen redelijke termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 1a
        hoofdstuk: '1'
        paragraaf: '1.1'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '28'
  - number: 35a.2
    text: |-
      Indien een verklaring omtrent het gedrag met betrekking tot de personen die het beleid bepalen of mede bepalen
      op grond van [artikel 35, eerste lid, van de Wet justitiële en strafvorderlijke gegevens][ref1] wordt geweigerd,
      nemen de instellingen, bedoeld in het eerste lid, de noodzakelijke maatregelen om te voorkomen dat deze personen
      een beleidsbepalende of medebeleidsbepalende functie binnen de instelling bekleden.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel35
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '35'
  - number: '36'
    text: |-
      De rechtsgeldigheid van een privaatrechtelijke rechtshandeling van een instelling als bedoeld in
      [artikel 1a, tweede lid][ref1], welke is verricht in strijd met de bij of krachtens deze wet gestelde regels is
      niet uit dien hoofde aantastbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 1a
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: '38.1'
    text: |-
      Ten aanzien van cliënten waarnaar reeds cliëntenonderzoek is verricht op grond van deze wet, zoals deze
      luidde voor inwerkingtreding van de Implementatiewet vierde anti-witwasrichtlijn, verricht een instelling het
      cliëntenonderzoek, bedoeld in [artikel 3, eerste lid][ref1], bij eerste gelegenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel3
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '38.2'
    text: |-
      Onder eerste gelegenheid in de zin van het eerste lid wordt verstaan het eerste moment dat door de cliënt
      contact wordt opgenomen met de instelling of het eerste moment dat de instelling, met inachtneming van de
      risicogevoeligheid voor witwassen of financieren van terrorisme van het type cliënt, zakelijke relatie, product of
      transactie, aanleiding vindt om het cliëntenonderzoek te doen plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel38
  - number: '38.3'
    text: |-
      In afwijking van het eerste lid verricht een bank of andere financiële onderneming in geval
      van een zakelijke relatie met betrekking tot een levensverzekeringsovereenkomst als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref1], die is aangegaan voor het tijdstip van
      inwerkingtreding van de [Implementatiewet vierde anti-witwasrichtlijn][ref2], het cliëntenonderzoek, bedoeld in
      de [artikelen 3, eerste lid][ref3], en [3a][ref4], zodra een geldelijke uitkering plaatsvindt aan de cliënt of
      begunstigde.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0041195
      [ref3]: https://wetten.overheid.nl/BWBR0024282#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0024282#Artikel3a
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0041195
      - id: ref3
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref4
        bwb_id: BWBR0024282
        artikel: 3a
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '38.4'
    text: |-
      De [artikelen 3a][ref1], [6][ref2], [7][ref3] en [8][ref4] zijn van overeenkomstige toepassing op een
      cliëntenonderzoek dat op grond van het eerste of derde lid wordt verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0024282#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0024282#Artikel8
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 3a
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref3
        bwb_id: BWBR0024282
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref4
        bwb_id: BWBR0024282
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '39.1'
    text: |-
      Op overtredingen die hebben plaatsgevonden of zijn aangevangen voor het tijdstip van inwerkingtreding van de
      [Implementatiewet vierde anti-witwasrichtlijn][ref1], zijn de [artikelen 32e tot en met 32j][ref2] niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0041195
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel32e
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0041195
      - id: ref2
        bwb_id: BWBR0024282
        artikel: 32e
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '39.2'
    text: |-
      In afwijking van het eerste lid wordt in het geval van een overtreding, begaan door een instelling als bedoeld
      in [artikel 1a, tweede lid of derde lid, onderdeel c][ref1], en waarop artikel 28a van deze wet, zoals dat luidde
      voor het tijdstip van inwerkingtreding van de [Implementatiewet vierde anti-witwasrichtlijn][ref2], van toepassing
      is, een besluit tot het publiceren van een waarschuwing of verklaring na het tijdstip van inwerkingtreding van de
      Implementatiewet vierde anti-witwasrichtlijn genomen met inachtneming van de [artikelen 32h][ref3], [32i][ref4]
      en [32j][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0041195
      [ref3]: https://wetten.overheid.nl/BWBR0024282#Artikel32h
      [ref4]: https://wetten.overheid.nl/BWBR0024282#Artikel32i
      [ref5]: https://wetten.overheid.nl/BWBR0024282#Artikel32j
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 1a
        hoofdstuk: '1'
        paragraaf: '1.1'
      - id: ref2
        bwb_id: BWBR0041195
      - id: ref3
        bwb_id: BWBR0024282
        artikel: 32h
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref4
        bwb_id: BWBR0024282
        artikel: 32i
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref5
        bwb_id: BWBR0024282
        artikel: 32j
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '40'
    text: |-
      Een wijziging van de vierde anti-witwasrichtlijn, de richtlijn betaaldiensten of de richtlijn kapitaalvereisten
      gaat voor de toepassing van deze wet gelden met ingang van de dag waarop aan de betrokken wijziging uitvoering moet
      zijn gegeven, tenzij bij besluit van Onze Minister van Financiën en Onze Minister van Justitie en Veiligheid dat in
      de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel40
  - number: 42a
    text: |-
      De [artikelen 19][ref1], [20][ref2], [22][ref3], [23][ref4] en [33 tot en met 35][ref5] zijn van overeenkomstige
      toepassing op een platform voor de veiling van emissierechten.


