  - number: '1.2'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder de begrippen «trust», «trustee» en «insteller»
      verstaan hetgeen daaronder in het op 1 juli 1985 te ’s-Gravenhage tot stand gekomen Verdrag inzake het recht dat
      toepasselijk is op trusts en inzake de erkenning van trusts (Trb. 1985, 141) wordt verstaan.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel1
  - number: '1.3'
    text: |-
      Bij algemene maatregel van bestuur worden de categorieën natuurlijke personen aangewezen die in elk geval moeten
      worden aangemerkt als uiteindelijk belanghebbende als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel1
  - number: 1a.1
    text: |-
      Deze wet is van toepassing op banken en andere financiële ondernemingen, alsmede op de ingevolge het vierde
      lid aangewezen natuurlijke personen, rechtspersonen of vennootschappen handelend in het kader van hun
      beroepsactiviteiten.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel1a
  - number: 1a.2
    text: |-
      Als bank wordt aangemerkt een bank als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1],
      niet zijnde een natuurlijke persoon, rechtspersoon of vennootschap waarvoor op grond van
      [artikel 2:11, tweede lid][ref2], of [artikel 2:16, vierde lid, van die wet][ref3] geen vergunning tot uitoefening
      van het bedrijf van bank vereist is, of een bijkantoor in Nederland van een bank met zetel buiten Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel1a
