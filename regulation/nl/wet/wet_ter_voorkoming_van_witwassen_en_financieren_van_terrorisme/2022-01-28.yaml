  - number: 1a.4
    text: |-
      Als natuurlijke personen, rechtspersonen of vennootschappen handelend in het kader van hun beroepsactiviteiten
      waarop deze wet van toepassing is worden aangewezen:
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel1a
  - number: 1a.4.a
    text: |-
      natuurlijke personen, rechtspersonen of vennootschappen die als belastingadviseur zelfstandig onafhankelijk
      beroepsactiviteiten uitoefenen, dan wel natuurlijke personen, rechtspersonen of vennootschappen voor zover zij
      anderszins zelfstandig in hoofdzaak, onafhankelijk, al dan niet via andere aan hen gelieerde natuurlijke personen,
      rechtspersonen of vennootschappen, daarmee vergelijkbare activiteiten beroeps- of bedrijfsmatig verrichten;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel1a
  - number: 1a.4.b
    text: |-
      natuurlijke personen, rechtspersonen of vennootschappen die als externe registeraccountant of externe accountant-
      administratieconsulent zelfstandig onafhankelijk beroepsactiviteiten waaronder forensische accountancy
      uitoefenen, dan wel natuurlijke personen, rechtspersonen of vennootschappen, voor zover die anderszins zelfstandig
