        artikel: '35'
  - number: 14a.1
    text: |-
      In het kader van haar taak op grond van [artikel 13, onderdeel g][ref1], kan de Financiële inlichtingen eenheid
      op verzoek informatie verstrekken aan de in dat onderdeel bedoelde personen, indien het verzoek betrekking heeft
      op aangelegenheden die verband houden met witwassen, daarmee verband houdende basisdelicten, of financieren van
      terrorisme.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel13
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 14a.2
    text: |-
      De Financiële inlichtingen eenheid kan een verzoek om informatie als bedoeld in het eerste lid weigeren indien
      zwaarwegende belangen zich tegen het verstrekken van informatie verzetten.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel14a
  - number: 14a.3
    text: |-
      De toezichthoudende autoriteit en de personen, bedoeld in [artikel 13, onderdeel g][ref1], informeren de Financiële
      inlichtingen eenheid over de wijze waarop gebruik is gemaakt van de overeenkomstig dit artikel verstrekte
      informatie en over het resultaat van de op grond van deze informatie uitgevoerde onderzoeken of inspecties.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel13
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '15.1'
    text: |-
      Bij algemene maatregel van bestuur worden, zo nodig per daarbij te onderscheiden categorieën transacties,
      indicatoren vastgesteld aan de hand waarvan wordt beoordeeld of een transactie wordt aangemerkt als een
      ongebruikelijke transactie.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel15
  - number: '15.2'
    text: |-
      Indien het spoedeisende belang dat vereist, kunnen bij regeling van Onze Minister van Financiën en Onze Minister
      van Justitie gezamenlijk de indicatoren, bedoeld in het eerste lid, worden vastgesteld voor een termijn van ten
      hoogste zes maanden.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel15
  - number: '16.1'
    text: |-
      Een instelling meldt een verrichte of voorgenomen ongebruikelijke transactie onverwijld nadat het ongebruikelijke
      karakter van de transactie bekend is geworden, aan de Financiële inlichtingen eenheid.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel16
  - number: '16.2'
    text: 'Bij een melding als bedoeld in het eerste lid verstrekt de instelling de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel16
  - number: 16.2.a
    text: |-
      de identiteit van de cliënt, de identiteit van de uiteindelijk belanghebbenden en, voor zover mogelijk, de
      identiteit van degene ten behoeve van wie de transactie wordt uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel16
  - number: 16.2.b
    text: |-
      de aard en het nummer van het identiteitsbewijs van de cliënt en, voorzover mogelijk, van de overige in onderdeel a
      bedoelde personen;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel16
  - number: 16.2.c
    text: de aard, het tijdstip en de plaats van de transactie;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel16
  - number: 16.2.d
    text: |-
      de omvang en de bestemming en herkomst van de gelden, effecten, edele metalen of andere waarden die bij de
      transactie betrokken zijn;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel16
  - number: 16.2.e
    text: de omstandigheden op grond waarvan de transactie als ongebruikelijk wordt aangemerkt;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel16
  - number: 16.2.f
    text: een omschrijving van de desbetreffende zaken van grote waarde bij een transactie boven de € 10.000;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel16
  - number: 16.2.g
    text: aanvullende, bij algemene maatregel van bestuur aan te wijzen, gegevens.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel16
  - number: '16.3'
    text: |-
      In afwijking van het tweede lid verstrekt een instelling als bedoeld in
      [artikel 1a, vierde lid, onderdeel o][ref1], de gegevens bedoeld in het tweede lid voor zover zij daarover
      beschikt, alsmede een beschrijving van de desbetreffende onroerende zaken en rechten waaraan onroerende zaken zijn
      onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 1a
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: '16.4'
    text: 'De meldingsplicht, bedoeld in het eerste lid, is van overeenkomstige toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel16
  - number: 16.4.a
    text: |-
      een cliëntenonderzoek als bedoeld in [artikel 3, eerste lid][ref1], niet leidt tot het in
      [artikel 5, eerste lid, onderdeel b][ref2], bedoelde resultaat of tot de uitvoering van de in artikel 3, veertiende
      lid, onderdeel a, bedoelde maatregelen, en er tevens indicaties zijn dat de desbetreffende cliënt betrokken is bij
      witwassen of financieren van terrorisme;


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel5
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 16.4.b
    text: |-
      een zakelijke relatie wordt beëindigd ingevolge [artikel 5, derde lid][ref1], en er tevens indicaties zijn dat de
      desbetreffende cliënt betrokken is bij witwassen of financieren van terrorisme.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel5
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '16.5'
    text: |-
      Bij een melding ingevolge het vierde lid verstrekt een instelling naast de gegevens, bedoeld in het tweede lid, een
      beschrijving van de redenen waarom het vierde lid van toepassing is.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel16
  - number: 16a
    text: |-
      Een melding als bedoeld in [artikel 16][ref1] die betrekking heeft op een andere lidstaat, wordt door de Financiële
      inlichtingen eenheid onverwijld gedeeld met de financiële inlichtingen eenheid van die lidstaat, tenzij het
      verstrekken van de melding:


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel16
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 16a.a
    text: strijdig is met een wettelijk voorschrift;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel16a
  - number: 16a.b
    text: een strafrechtelijk onderzoek kan schaden;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel16a
  - number: 16a.c
    text: de belangen van natuurlijke of rechtspersonen op wie de informatie betrekking heeft onevenredig kan schaden.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel16a
  - number: '17.1'
    text: |-
      De Financiële inlichtingen eenheid kan ten behoeve van de uitvoering van haar taak, bedoeld in
      [artikel 13, aanhef en onderdelen a en b][ref1], gegevens of inlichtingen opvragen bij een instelling die een
      melding heeft gedaan of bij een instelling die naar het oordeel van de Financiële inlichtingen eenheid beschikt
      over gegevens of inlichtingen die relevant zijn voor het analyseren door de Financiële inlichtingen eenheid van een
      transactie of voorgenomen transactie of van een zakelijke relatie.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel13
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '17.2'
    text: |-
      De instelling waaraan overeenkomstig het eerste lid deze gegevens of inlichtingen zijn gevraagd, verstrekt deze
      onverwijld en in schriftelijke vorm, alsmede in spoedeisende gevallen mondeling, aan de Financiële inlichtingen
      eenheid.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel17
  - number: '17.3'
    text: |-
      Indien een instelling met vestiging in een andere lidstaat naar het oordeel van de Financiële inlichtingen eenheid
      beschikt over gegevens of inlichtingen als bedoeld in het eerste lid, kan de Financiële inlichtingen eenheid
      overeenkomstig [artikel 13b][ref1], de financiële inlichtingen eenheid van de lidstaat waar de instelling is
      gevestigd om deze gegevens of inlichtingen verzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel13b
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 13b
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '18'
    text: |-
      De Financiële inlichtingen eenheid bepaalt de wijze waarop een melding moet worden gedaan, of gegevens of
      inlichtingen als bedoeld in [artikel 17, eerste lid][ref1], moeten worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel17
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 18a
    text: |-
      Ten behoeve van de naleving van de in de [artikelen 16][ref1] en [17][ref2] opgenomen verplichtingen, zijn de
      instellingen, bedoeld in [artikel 1a, vierde lid, onderdeel c][ref3], niet gehouden aan de geheimhoudingsplicht,
      bedoeld in [artikel 11a van de Advocatenwet][ref4] en zijn de instellingen, bedoeld in artikel 1a, vierde lid,
      onderdeel d, niet gehouden aan de geheimhoudingsplicht in [artikel 22 van de Wet op het notarisambt][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
      [ref4]: https://wetten.overheid.nl/BWBR0002093#Artikel11a
      [ref5]: https://wetten.overheid.nl/BWBR0010388#Artikel22
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0024282
        artikel: 1a
        hoofdstuk: '1'
        paragraaf: '1.1'
      - id: ref4
        bwb_id: BWBR0002093
        artikel: 11a
      - id: ref5
        bwb_id: BWBR0010388
        artikel: '22'
  - number: '19.1'
    text: |-
      Gegevens of inlichtingen die in overeenstemming met de [artikelen 16][ref1] of [17][ref2] te goeder trouw zijn
      verstrekt, kunnen niet dienen als grondslag voor of ten behoeve van een opsporingsonderzoek of een vervolging
      wegens verdenking van, of als bewijs ter zake van een tenlastelegging wegens witwassen of financieren van
      terrorisme door de instelling die deze gegevens of inlichtingen heeft verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel17
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '19.2'
    text: |-
      Gegevens of inlichtingen die zijn verstrekt in de redelijke veronderstelling dat uitvoering wordt gegeven aan de
      [artikelen 16][ref1] of [17][ref2] kunnen niet dienen als grondslag voor of ten behoeve van een opsporingsonderzoek
      of een vervolging wegens verdenking van, of als bewijs ter zake van een tenlastelegging wegens, overtreding van
      [artikel 272 van het Wetboek van Strafrecht][ref3] door de instelling die deze gegevens of inlichtingen heeft
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel272
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '272'
  - number: '19.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing ten aanzien van personen die werkzaam zijn voor een
      instelling die gegevens of inlichtingen heeft verstrekt als omschreven in het eerste of tweede lid en die daaraan
      hebben meegewerkt.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel19
  - number: '20.1'
    text: |-
      Een instelling die op grond van [artikel 16][ref1] een melding heeft gedaan of op grond van [artikel 17][ref2]
      nadere inlichtingen heeft verstrekt in de redelijke veronderstelling uitvoering te geven aan die artikelen, is niet
      aansprakelijk voor enige schade die een derde dientengevolge lijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel17
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '20.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van personen die werkzaam zijn voor een instelling
      die een melding heeft gedaan of inlichtingen heeft verstrekt als omschreven in het eerste lid en die daaraan hebben
      meegewerkt.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel20
  - number: 20a.1
    text: |-
      Een instelling beschikt over adequate voorzieningen, die passend zijn bij de aard en omvang van de instelling en
      die het haar werknemers of personen in een vergelijkbare positie mogelijk maken om een overtreding van de bij of
      krachtens deze wet gestelde regels intern en op anonieme wijze te melden via een specifiek, onafhankelijk kanaal,
      dat passend is ten opzichte van de aard en omvang van de instelling.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel20a
  - number: 20a.2
    text: |-
      De toezichthoudende autoriteit beschikt over doeltreffende en betrouwbare mechanismen als bedoeld in artikel 61,
      eerste en tweede lid, van de vierde anti-witwasrichtlijn voor het melden van mogelijke of werkelijke inbreuken op
      het bij of krachtens deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel20a
  - number: 20b.1
    text: |-
      Een instelling mag een persoon die voor haar werkzaam is en die te goeder trouw en naar behoren namens de
      instelling aan de Financiële inlichtingen eenheid een melding doet als bedoeld in [artikel 16, eerste lid][ref1],
      aan de Financiële inlichtingen eenheid gegevens of inlichtingen verstrekt als bedoeld in
      [artikel 17, eerste lid][ref2], of intern binnen de instelling een overtreding van het in deze wet bepaalde meldt
      als bedoeld in [artikel 20a, eerste lid][ref3], niet benadelen.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0024282#Artikel20a
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel20b
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0024282
        artikel: 20a
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 20b.2
    text: |-
      Onverminderd het eerste lid kunnen de in het eerste lid bedoelde personen die in verband met een melding als
      bedoeld in [artikel 16, eerste lid][ref1], of [20a, eerste lid][ref2], zijn blootgesteld aan benadeling als bedoeld
      in het eerste lid, door middel van de in artikel 20a, tweede lid, bedoelde mechanismen een klacht indienen bij de
      toezichthoudende autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel20a
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel20b
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: 20a
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '21.1'
    text: Er is een Commissie inzake de meldingsplicht van ongebruikelijke transacties.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel21
  - number: '21.2'
    text: |-
      De commissie treedt periodiek in overleg met vertegenwoordigers van Onze Minister van Justitie en Onze Minister van
      Financiën over:
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel21
  - number: 21.2.a
    text: de inrichting en uitvoering van de meldingsplicht;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel21
  - number: 21.2.b
    text: |-
      de vaststelling van de indicatoren bedoeld in [artikel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel15
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '21.3'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de samenstelling en de organisatie van de
      commissie.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel21
  - number: '22.1'
    text: |-
      Het is een ieder die uit hoofde van de toepassing van deze wet of van krachtens deze wet genomen besluiten enige
      taak vervult of heeft vervuld verboden van vertrouwelijke gegevens of inlichtingen, die ingevolge deze wet dan wel
      ingevolge [titel 5.2 van de Algemene wet bestuursrecht][ref1] zijn verstrekt of ontvangen, of van een buitenlandse
      toezichthoudende instantie zijn ontvangen, verder of anders gebruik te maken of daaraan verder of anders bekendheid
      te geven dan voor de uitoefening van zijn taak of door deze wet wordt geëist.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '22.2'
    text: |-
      In afwijking van het eerste lid, kan de toezichthoudende autoriteit met gebruikmaking van de in het eerste lid
      bedoelde informatie mededelingen doen, indien deze niet kunnen worden herleid tot afzonderlijke personen.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22
  - number: '22.3'
    text: |-
      Het eerste en tweede lid laten ten aanzien van degene op wie het tweede lid van toepassing is, onverlet de
      toepasselijkheid van de bepalingen van het [Wetboek van Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: 22a.1
    text: |-
      De toezichthoudende autoriteit is in afwijking van [artikel 22, eerste lid][ref1], bevoegd gegevens of inlichtingen
      die ingevolge deze wet zijn verstrekt of ontvangen of van een buitenlandse toezichthoudende instantie zijn
      ontvangen, te verstrekken aan:


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel22
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '22'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 22a.1.a
    text: een andere toezichthoudende autoriteit of aan een buitenlandse toezichthoudende instantie;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22a
  - number: 22a.1.b
    text: |-
      de Belastingdienst, de Fiscale Inlichtingen- en Opsporingsdienst, de Nationale Politie, de Financiële Inlichtingen
      Eenheid of het Openbaar Ministerie, voor zover de gegevens of inlichtingen dienstig zijn voor de uitoefening van
      hun wettelijke taken;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22a
  - number: 22a.1.c
    text: |-
      een tijdelijke enquêtecommissie van het Europees Parlement, bedoeld in artikel 226 van het Verdrag betreffende de
      werking van de Europese Unie;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22a
  - number: 22a.1.d
    text: |-
      een commissie, als bedoeld in [artikel 2, tweede lid, van de Wet op de parlementaire enquête 2008][ref1], voor
      zover de gegevens of inlichtingen naar het oordeel van die commissie noodzakelijk zijn voor de vervulling van haar
      taak;


      [ref1]: https://wetten.overheid.nl/BWBR0023825#Artikel2
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0023825
        artikel: '2'
  - number: 22a.1.e
    text: |-
      de Algemene Rekenkamer, voor zover de gegevens of inlichtingen naar het oordeel van de
      Algemene Rekenkamer noodzakelijk zijn voor de uitoefening van haar wettelijke taak op grond van
      [artikel 7.24 van de Comptabiliteitswet 2016][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
  - number: 22a.2
    text: 'De in het eerste lid bedoelde informatie wordt niet verstrekt indien:'
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22a
  - number: 22a.2.a
    text: het doel waarvoor de gegevens of inlichtingen zullen worden gebruikt onvoldoende bepaald is;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22a
  - number: 22a.2.b
    text: |-
      het beoogde gebruik van de gegevens of inlichtingen niet past in het kader van het toezicht op wetgeving ter
      voorkoming van witwassen en financieren van terrorisme;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22a
  - number: 22a.2.c
    text: de verstrekking van de gegevens of inlichtingen zich niet zou verdragen met de Nederlandse wet of de openbare orde;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22a
  - number: 22a.2.d
    text: de geheimhouding van de gegevens of inlichtingen niet in voldoende mate is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22a
  - number: 22a.2.e
    text: |-
      de verstrekking van de gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met de belangen die
      deze wet beoogt te beschermen; of
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22a
  - number: 22a.2.f
    text: |-
      onvoldoende is gewaarborgd dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22a
  - number: 22a.3
    text: |-
      Voor zover de gegevens of inlichtingen, bedoeld in het eerste lid, zijn verkregen van een buitenlandse
      toezichthoudende instantie, verstrekt de toezichthoudende autoriteit deze niet aan een andere toezichthoudende
      instantie of aan een andere buitenlandse toezichthoudende instantie, tenzij de buitenlandse toezichthoudende
      instantie waarvan de gegevens of inlichtingen zijn verkregen uitdrukkelijk heeft ingestemd met de verstrekking van
      de gegevens of inlichtingen en in voorkomend geval heeft ingestemd met het gebruik voor een ander doel dan waarvoor
      de gegevens of inlichtingen zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22a
  - number: 22a.4
    text: |-
      Indien een buitenlandse toezichthoudende instantie aan de toezichthoudende autoriteit die de gegevens of
      inlichtingen op grond van het tweede of derde lid heeft verstrekt, verzoekt om die gegevens of inlichtingen te
      mogen gebruiken voor een ander doel dan waarvoor zij zijn verstrekt, willigt de toezichthoudende autoriteit dat
      verzoek slechts in:
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22a
  - number: 22a.4.a
    text: |-
      indien het beoogde gebruik niet in strijd is met het tweede of derde lid of voor zover die toezichthoudende
      instantie op een andere wijze dan in deze wet voorzien vanuit Nederland met inachtneming van de daarvoor geldende
      wettelijke procedures voor dat ander doel de beschikking over die gegevens of inlichtingen zou kunnen verkrijgen;
      en
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22a
  - number: 22a.4.b
    text: |-
      na overleg met Onze Minister van Justitie en Veiligheid indien het in de aanhef bedoelde verzoek betrekking heeft
      op een onderzoek naar strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22a
  - number: 22a.5
    text: |-
      De partijen, bedoeld in het eerste lid, onderdeel c tot en met e, zijn verplicht tot geheimhouding van de op grond
      van het eerste lid ontvangen vertrouwelijke gegevens of inlichtingen en maken die slechts openbaar indien deze niet
      herleid kunnen worden tot afzonderlijke personen.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22a
  - number: 22a.6
    text: 'Voor de toepassing van dit artikel wordt onder toezichthoudende autoriteit verstaan:'
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22a
  - number: 22a.6.a
    text: |-
      de toezichthoudende autoriteit, bedoeld in [artikel 1d, eerste lid, onderdeel e of f][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1d
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 1d
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 22a.6.b
    text: |-
      de toezichthoudende autoriteit, bedoeld in [artikel 1d, eerste lid, onderdeel c][ref1], voor zover het betreft de
      instellingen als bedoeld in [artikel 1a, vierde lid, onderdeel a, b of e][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1d
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 1d
        hoofdstuk: '1'
        paragraaf: '1.1'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: 1a
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 22a.6.c
    text: |-
      de toezichthouder, bedoeld in [artikel 1, eerste lid, van de Wet toezicht trustkantoren 2018][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '1'
  - number: 22b.1
    text: |-
      De toezichthoudende autoriteit, bedoeld in [artikel 1d, eerste lid, onderdelen a en b][ref1], is in afwijking van
      [artikel 22, eerste lid][ref2], bevoegd gegevens of inlichtingen die ingevolge deze wet zijn verstrekt of ontvangen
      of van een buitenlandse toezichthoudende instantie zijn ontvangen, te verstrekken aan:


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1d
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel22
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22b
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 1d
        hoofdstuk: '1'
        paragraaf: '1.1'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '22'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 22b.1.a
    text: |-
      een andere toezichthoudende autoriteit of een toezichthoudende instantie die belast is met het toezicht op de
      instellingen, bedoeld in [artikel 1a, tweede of derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22b
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 1a
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 22b.1.b
    text: |-
      een buitenlandse toezichthoudende instantie in een andere lidstaat die is belast met het toezicht op de
      instellingen, bedoeld in [artikel 1a, eerste of tweede lid][ref1], of een buitenlandse toezichthoudende instantie
      in een derde land die belast is met het toezicht op deze instellingen en waarmee een samenwerkingsovereenkomst is
      gesloten als bedoeld in artikel 57bis, vijfde lid, van de vierde anti-witwasrichtlijn;


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22b
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 1a
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 22b.1.c
    text: de Europese Centrale Bank;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22b
  - number: 22b.1.d
    text: |-
      de instanties genoemd in [artikel 22a, eerste lid, onderdelen b tot en met e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel22a
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22b
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 22a
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 22b.2
    text: 'De in het eerste lid bedoelde informatie wordt niet verstrekt indien:'
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22b
  - number: 22b.2.a
    text: het doel waarvoor de gegevens of inlichtingen zullen worden gebruikt onvoldoende bepaald is;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22b
  - number: 22b.2.b
    text: |-
      het beoogde gebruik van de gegevens of inlichtingen niet past in het kader van deze wet, prudentiële regelgeving of
      het toezicht op de instellingen, bedoeld in [artikel 1a, tweede of derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22b
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 1a
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 22b.2.c
    text: de verstrekking van de gegevens of inlichtingen zich niet zou verdragen met de Nederlandse wet of de openbare orde;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22b
  - number: 22b.2.d
    text: de geheimhouding van de gegevens of inlichtingen niet in voldoende mate is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22b
  - number: 22b.2.e
    text: |-
      de verstrekking van de gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met de belangen die
      deze wet beoogt te beschermen; of
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22b
  - number: 22b.2.f
    text: |-
      onvoldoende is gewaarborgd dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22b
  - number: 22b.3
    text: |-
      [Artikel 22a, derde tot en met het vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel22a
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22b
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 22a
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 22c.1
    text: |-
      Het Bureau Financieel Toezicht is in afwijking van [artikel 22, eerste lid][ref1], bevoegd gegevens of inlichtingen
      verkregen bij de vervulling van zijn ingevolge deze wet opgedragen taak ten aanzien van een instelling als bedoeld
      in [artikel 1a, vierde lid, onderdeel a of b][ref2], te verstrekken aan de Stichting Autoriteit Financiële Markten,
      voor zover de gegevens of inlichtingen dienstig zijn voor de uitoefening van taken van de Stichting Autoriteit
      Financiële Markten op grond van de Wet toezicht accountantsorganisaties.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22c
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '22'
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: 1a
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 22c.2
    text: |-
      [Artikel 22a, tweede tot en met vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel22a
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel22c
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 22a
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: '23.1'
    text: |-
      Een instelling en de personen die werkzaam zijn voor een instelling zijn, behoudens voor zover uit deze wet de
      noodzaak tot bekendmaking voortvloeit, verplicht tot geheimhouding jegens een ieder van:
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23
  - number: 23.1.a
    text: |-
      een melding ingevolge [artikel 16][ref1] door die instelling;


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel16
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 23.1.b
    text: |-
      nadere inlichtingen verstrekt ingevolge [artikel 17][ref1] door die instelling;


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel17
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 23.1.c
    text: |-
      het gegeven dat een melding of verstrekking aanleiding heeft gegeven tot een onderzoek naar witwassen van geld of
      financieren van terrorisme of dat het voornemen bestaat een dergelijk onderzoek te verrichten;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23
  - number: 23.1.d
    text: |-
      overleg over de naleving van [artikel 16][ref1] met betrekking tot een transactie.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel16
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '23.2'
    text: |-
      De instelling die ingevolge [artikel 13, onderdeel c][ref1], gegevens of inlichtingen verkrijgt, is verplicht tot
      geheimhouding daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel13
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '23.3'
    text: |-
      Een instelling kan de rechten, bedoeld in artikel 15 van de Algemene verordening gegevensbescherming, buiten
      toepassing laten voor zover zulks noodzakelijk en evenredig is ter naleving van het bepaalde in het eerste en
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23
  - number: '23.4'
    text: |-
      Een ieder die kennis neemt van gegevens waarvan hij weet of redelijkerwijs moet vermoeden dat ter zake op een
      instelling de geheimhoudingsplicht, bedoeld in het eerste of tweede lid, rust, is verplicht tot geheimhouding
      hiervan, behoudens voor zover uit deze wet de noodzaak tot bekendmaking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23
  - number: '23.5'
    text: |-
      De in het eerste en derde lid bedoelde geheimhoudingsplicht is niet van toepassing op een mededeling gedaan door
      een instelling als bedoeld in [artikel 1a, vierde lid, onderdelen a tot en met e][ref1], aan een cliënt met als
      doel deze te doen afzien van een onwettige handeling.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 1a
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: '23.6'
    text: 'Het eerste lid is niet van toepassing op mededelingen:'
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23
  - number: 23.6.1°
    text: |-
      tussen instellingen als bedoeld in [artikel 1a, tweede en derde lid][ref1], gevestigd in een lidstaat en die tot
      dezelfde groep behoren, alsmede tussen deze instellingen en hun bijkantoren of meerderheidsdochterondernemingen,
      die zijn gevestigd in een andere lidstaat of een staat die geen lidstaat is, voor zover het bijkantoor of de
      meerderheidsdochteronderneming voldoet aan de op het niveau van de groep geldende gedragslijnen en procedures,
      bedoeld in [artikel 2f, derde lid][ref2] en de op het niveau van de groep geldende gedragslijnen en procedures
      voldoen aan de voorschriften van deze wet;


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel2f
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 1a
        hoofdstuk: '1'
        paragraaf: '1.1'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: 2f
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: 23.6.2°
    text: |-
      tussen instellingen als bedoeld in [artikel 1a, vierde lid, onderdelen a tot en met e][ref1], gevestigd in
      een lidstaat of een derde land, die hun werkzaamheden, al dan niet als werknemer, uitoefenen binnen eenzelfde
      rechtspersoon of netwerk;


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 1a
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 23.6.3°
    text: |-
      van een instelling als bedoeld in
      [artikel 1a, tweede lid, derde lid, onderdelen a, c, d, g, i en j, en vierde lid, onderdeel a tot en met e][ref1],
      aan een instelling behorende tot dezelfde categorie, voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 1a
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 23.6.3°.a
    text: |-
      de mededeling betrekking heeft op een cliënt van beide instellingen en een transactie waarbij beide instellingen
      betrokken zijn;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23
  - number: 23.6.3°.b
    text: |-
      de andere instelling is gevestigd in een lidstaat of een derde land dat eisen stelt die gelijkwaardig zijn op het
      gebied van het beroepsgeheim en de bescherming van persoonsgegevens;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23
  - number: 23.6.3°.c
    text: de mededeling uitsluitend is bedoeld ter voorkoming van witwassen en financieren van terrorisme.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23
  - number: '23.7'
    text: |-
      Voor de toepassing van het zesde lid wordt verstaan onder: - *netwerk:* de grotere structuur waartoe de persoon
      behoort en die eigendom, beheer en controle op de naleving van de verplichtingen gezamenlijk deelt;
        - *derde land:* een door Onze Minister van Financiën aangewezen staat waar eisen zijn gesteld die gelijkwaardig
      zijn aan de eisen gesteld bij of krachtens deze wet en waar toezicht wordt uitgeoefend op de naleving van die
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23
  - number: 23a
    text: |-
      Onverminderd [artikel 23, eerste lid][ref1], deelt een instelling informatie over een melding ingevolge
      [artikel 16][ref2] door die instelling binnen de groep, tenzij door de Financiële inlichtingen eenheid anders wordt
      bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel16
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 23b.1
    text: |-
      Een ieder die in of vanuit Nederland beroeps- of bedrijfsmatig diensten aanbiedt voor het wisselen tussen virtuele
      valuta en fiduciaire valuta registreert zich bij de Nederlandsche Bank.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23b
  - number: 23b.2
    text: |-
      Een ieder die in of vanuit Nederland beroeps- of bedrijfsmatig bewaarportemonnees aanbiedt registreert zich bij de
      Nederlandsche Bank.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23b
  - number: 23c.1
    text: |-
      Een verzoek tot registratie als bedoeld in [artikel 23b][ref1] geschiedt onder opgave van bij of krachtens algemene
      maatregel van bestuur te bepalen gegevens. Deze gegevens kunnen betrekking hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel23b
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23c
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 23b
        hoofdstuk: 3A
  - number: 23c.1.a
    text: gegevens van feitelijke aard;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23c
  - number: 23c.1.b
    text: |-
      gegevens die verband houden met de naleving van voorschriften op grond van deze wet of de [Sanctiewet 1977][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003296
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23c
    references:
      - id: ref1
        bwb_id: BWBR0003296
  - number: 23c.2
    text: |-
      De Nederlandsche Bank registreert een aanbieder als bedoeld in [artikel 23b][ref1] binnen twee maanden na ontvangst
      van de in het eerste lid bedoelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel23b
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23c
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 23b
        hoofdstuk: 3A
  - number: 23c.3
    text: |-
      Een aanbieder als bedoeld in [artikel 23b][ref1] kan enkel diensten als bedoeld in dit hoofdstuk aanbieden indien
      hij geregistreerd is.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel23b
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23c
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 23b
        hoofdstuk: 3A
  - number: 23d.1
    text: |-
      De Nederlandsche Bank gaat niet over tot registratie van een aanbieder als bedoeld in [artikel 23b][ref1] indien:


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel23b
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23d
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 23b
        hoofdstuk: 3A
  - number: 23d.1.a
    text: |-
      de gegevens bedoeld in [artikel 23c, eerste lid][ref1], niet volledig zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel23c
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23d
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 23c
        hoofdstuk: 3A
  - number: 23d.1.b
    text: |-
      zij na verificatie van de gegevens bedoeld in [artikel 23c, eerste lid][ref1], niet overtuigd is van de juistheid
      van deze gegevens;


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel23c
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23d
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 23c
        hoofdstuk: 3A
  - number: 23d.1.c
    text: |-
      een aanbieder als bedoeld in [artikel 23b][ref1] niet voldoet aan
      [artikel 23h, eerste, tweede, derde of vierde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel23b
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel23h
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23d
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 23b
        hoofdstuk: 3A
      - id: ref2
        bwb_id: BWBR0024282
        artikel: 23h
        hoofdstuk: 3A
  - number: 23d.1.d
    text: |-
      een uiteindelijk belanghebbende van een aanbieder als bedoeld in [artikel 23b][ref1] niet voldoet aan
      [artikel 23h, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel23b
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel23h
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23d
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 23b
        hoofdstuk: 3A
      - id: ref2
        bwb_id: BWBR0024282
        artikel: 23h
        hoofdstuk: 3A
  - number: 23d.2
    text: |-
      DNB stelt de aanbieder onverwijld op de hoogte indien zij op grond van het eerste lid niet over gaat tot
      registratie.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23d
  - number: 23d.3
    text: |-
      De Nederlandsche Bank kan de registratie van een aanbieder als bedoeld in [artikel 23b][ref1] doorhalen indien:


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel23b
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23d
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 23b
        hoofdstuk: 3A
  - number: 23d.3.a
    text: de aanbieder hierom verzoekt;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23d
  - number: 23d.3.b
    text: |-
      de aanbieder bij het verzoek tot registratie onjuiste of onvolledige gegevens heeft verstrekt, en kennis omtrent
      de juiste en volledige gegevens ertoe zou hebben geleid dat De Nederlandsche Bank niet tot registratie zou zijn
      overgegaan;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23d
  - number: 23d.3.c
    text: |-
      de aanbieder relevante omstandigheden of feiten heeft verzwegen op grond waarvan, zo zij voor het tijdstip waarop
      de registratie heeft plaatsgevonden zich hadden voorgedaan of bekend waren geweest, De Nederlandsche Bank niet zou
      zijn overgegaan tot registratie;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23d
  - number: 23d.3.d
    text: |-
      de aanbieder niet voldoet aan de bij of krachtens deze wet of de [Sanctiewet 1977][ref1] gestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0003296
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23d
    references:
      - id: ref1
        bwb_id: BWBR0003296
  - number: 23d.3.e
    text: |-
      de aanbieder niet voldoet aan de verplichting tot betaling van een bedrag op grond van de
      [Wet bekostiging financieel toezicht 2019][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0041548
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23d
    references:
      - id: ref1
        bwb_id: BWBR0041548
  - number: 23d.3.f
    text: de aanbieder geen diensten heeft verleend binnen een termijn van zes maanden na registratie;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23d
  - number: 23d.3.g
    text: |-
      de aanbieder zijn dienstverlening heeft beëindigd, dan wel zijn dienstverlening gedurende meer dan zes maanden
      heeft gestaakt;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23d
  - number: 23d.3.h
    text: |-
      de aanbieder de onderneming ten behoeve waarvan de registratie heeft plaatsgevonden, geheel of gedeeltelijk
      overdraagt;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23d
  - number: 23d.3.i
    text: de aanbieder in staat van faillissement is komen te verkeren;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23d
  - number: 23d.3.j
    text: |-
      doorhaling of beëindiging heeft plaatsgevonden van de inschrijving van de aanbieder in het handelsregister bedoeld
      in [artikel 1, eerste lid, onderdeel h, van de Handelsregisterwet 2007][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23d
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '1'
  - number: 23d.3.k
    text: de aanbieder is opgehouden te bestaan;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23d
  - number: 23d.3.l
    text: |-
      een uiteindelijk belanghebbende van een aanbieder als bedoeld in [artikel 23b][ref1] niet voldoet aan
      [artikel 23h, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel23b
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel23h
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23d
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 23b
        hoofdstuk: 3A
      - id: ref2
        bwb_id: BWBR0024282
        artikel: 23h
        hoofdstuk: 3A
  - number: 23e.1
    text: |-
      Een aanbieder als bedoeld in [artikel 23b][ref1] meldt schriftelijk aan de Nederlandsche Bank een voornemen tot
      wijziging van:


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel23b
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23e
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 23b
        hoofdstuk: 3A
  - number: 23e.1.a
    text: de identiteit van degenen die het beleid van de aanbieder bepalen of mede bepalen;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23e
  - number: 23e.1.b
    text: de identiteit van degenen die al dan niet middellijk een gekwalificeerde deelneming houden in de aanbieder;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23e
  - number: 23e.1.c
    text: de identiteit van een uiteindelijk belanghebbende van de aanbieder.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23e
  - number: 23e.2
    text: |-
      Een wijziging als bedoeld in het eerste lid wordt niet doorgevoerd dan nadat de Nederlandsche Bank hiervoor
      toestemming heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23e
  - number: 23e.3
    text: |-
      Een aanbieder als bedoeld in [artikel 23b][ref1] meldt onverwijld schriftelijk aan de Nederlandsche Bank een
      wijziging van:


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel23b
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23e
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 23b
        hoofdstuk: 3A
  - number: 23e.3.a
    text: de formele en feitelijke zeggenschapsstructuur van de groep waartoe de aanbieder behoort;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23e
  - number: 23e.3.b
    text: de antecedenten van degenen die het beleid van de aanbieder bepalen of mede bepalen;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23e
  - number: 23e.3.c
    text: |-
      de antecedenten van degenen die een gekwalificeerde deelneming houden in de aanbieder alsmede de omvang van de
      desbetreffende gekwalificeerde deelneming;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23e
  - number: 23e.3.d
    text: de antecedenten van de uiteindelijk belanghebbende van de aanbieder;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23e
  - number: 23e.3.e
    text: de formele en feitelijke zeggenschapsstructuur of de bedrijfsvoering van de aanbieder;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23e
  - number: 23e.3.f
    text: een wijziging van de omvang van de desbetreffende gekwalificeerde deelneming;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23e
  - number: 23e.3.g
    text: overige bij ministeriële regeling te bepalen gegevens.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23e
  - number: 23e.4
    text: |-
      De houder van een gekwalificeerde deelneming en de uiteindelijk belanghebbende verschaffen een aanbieder als
      bedoeld in [artikel 23b][ref1] alle informatie die noodzakelijk is om te voldoen aan dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel23b
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23e
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 23b
        hoofdstuk: 3A
  - number: 23e.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de bij de in het eerste en
      derde lid bedoelde kennisgeving te verstrekken gegevens.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23e
  - number: 23f.1
    text: |-
      Er is een openbaar register van aanbieders als bedoeld in [artikel 23b][ref1] die door de Nederlandsche Bank zijn
      geregistreerd. Het register wordt gehouden door de Nederlandsche Bank en wordt in ieder geval gepubliceerd op een
      daartoe geschikte website.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel23b
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23f
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 23b
        hoofdstuk: 3A
  - number: 23f.2
    text: |-
      De Nederlandsche Bank verricht de inschrijving en doorhaling in het register op zodanige wijze dat uit het register
      is op te maken vanaf welk tijdstip, welke diensten als bedoeld in [artikel 23b][ref1] een geregistreerde aanbieder
      mag verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel23b
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23f
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 23b
        hoofdstuk: 3A
  - number: 23f.3
    text: |-
      In het register worden ten aanzien van een aanbieder als bedoeld in [artikel 23b][ref1] de volgende gegevens
      opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel23b
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23f
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 23b
        hoofdstuk: 3A
  - number: 23f.3.a
    text: de naam en het adres en, indien van toepassing, de statutaire zetel en de naam en het adres van zijn bijkantoren;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23f
  - number: 23f.3.b
    text: |-
      de datum van inschrijving van de aanbieder als bedoeld in [artikel 23b][ref1] in het register;


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel23b
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23f
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 23b
        hoofdstuk: 3A
  - number: 23f.3.c
    text: |-
      het nummer van de inschrijving van de aanbieder als bedoeld in [artikel 23b][ref1] bij de Kamer van Koophandel.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel23b
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23f
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 23b
        hoofdstuk: 3A
  - number: 23f.4
    text: |-
      De Nederlandsche Bank draagt onverwijld zorg voor de inschrijving van de aanbieder als bedoeld in
      [artikel 23b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel23b
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23f
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 23b
        hoofdstuk: 3A
  - number: 23f.5
    text: |-
      Indien van toepassing vermeldt de Nederlandsche Bank bij doorhaling dat het desbetreffende besluit nog niet
      onherroepelijk is.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23f
  - number: 23f.6
    text: |-
      De Nederlandsche Bank versterkt aan een ieder desgevraagd, tegen betaling van de kostprijs, afschriften uit het
      register.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23f
  - number: 23g.1
    text: |-
      Het is een ieder die in een derde land woonachtig of gevestigd is of zijn zetel heeft verboden beroeps- of
      bedrijfsmatig in Nederland diensten aan te bieden voor het wisselen tussen virtuele valuta en fiduciaire valuta.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23g
  - number: 23g.2
    text: |-
      Het is een ieder die in een derde land woonachtig of gevestigd is of zijn zetel heeft verboden beroeps- of
      bedrijfsmatig in Nederland bewaarportemonnees aan te bieden.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23g
  - number: 23g.3
    text: |-
      Het verbod in het eerste onderscheidenlijk het tweede lid is niet van toepassing op een aanbieder die in een door
      Onze Minister aangewezen derde land woonachtig of gevestigd is of zijn zetel heeft, waar toezicht op het uitoefenen
      van het beroep of bedrijf, bedoeld in het eerste onderscheidenlijk het tweede lid, wordt uitgeoefend dat in
      voldoende mate waarborgen biedt ten aanzien van de belangen die deze wet beoogt te beschermen en de aanbieder in
      het desbetreffende derde land onder toezicht staat.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23g
  - number: 23h.1
    text: |-
      Het beleid van een aanbieder als bedoeld in [artikel 23b][ref1] wordt bepaald of mede bepaald door personen die
      geschikt zijn in verband met de door die aanbieder verleende diensten. Indien binnen die aanbieder een orgaan
      belast is met het toezicht op het beleid en de algemene zaken van de aanbieder, wordt dit toezicht gehouden door
      personen die geschikt zijn voor de uitoefening van dit toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel23b
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23h
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 23b
        hoofdstuk: 3A
  - number: 23h.2
    text: |-
      Het beleid van een aanbieder als bedoeld in [artikel 23b][ref1] wordt bepaald of mede bepaald door personen
      wier betrouwbaarheid buiten twijfel staat. Indien binnen die aanbieder een orgaan belast is met het toezicht
      op het beleid en de algemene gang van zaken binnen de aanbieder, wordt dit toezicht gehouden door personen wier
      betrouwbaarheid buiten twijfel staat.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel23b
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23h
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 23b
        hoofdstuk: 3A
  - number: 23h.3
    text: |-
      De uiteindelijk belanghebbende van een aanbieder als bedoeld in [artikel 23b][ref1] is, gelet op zijn reputatie,
      geschikt en zijn betrouwbaarheid staat buiten twijfel.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel23b
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23h
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 23b
        hoofdstuk: 3A
  - number: 23h.4
    text: |-
      De betrouwbaarheid van een persoon staat buiten twijfel wanneer dat eenmaal door de Nederlandsche Bank of de
      stichting Autoriteit Financiële Markten voor de toepassing van deze wet, de [Wet op het financieel toezicht][ref1]
      of de [Wet toezicht trustkantoren 2018][ref2] is vastgesteld, zolang niet een wijziging in de relevante feiten of
      omstandigheden een redelijke aanleiding geeft tot een nieuwe beoordeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
      [ref2]: https://wetten.overheid.nl/BWBR0041583
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23h
    references:
      - id: ref1
        bwb_id: BWBR0020368
      - id: ref2
        bwb_id: BWBR0041583
  - number: 23h.5
    text: |-
      Indien sprake is van een gekwalificeerde deelneming wordt die gehouden door natuurlijke personen wier
      betrouwbaarheid buiten twijfel staat, of in geval van een rechtspersoon, de betrouwbaarheid van de bestuurders van
      die rechtspersoon buiten twijfel staat.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23h
  - number: 23h.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de wijze waarop
      wordt vastgesteld of de betrouwbaarheid van een persoon buiten twijfel staat en welke feiten en omstandigheden
      daarbij in aanmerking worden genomen, alsmede regels met betrekking tot de misdrijven die, indien begaan door
      die persoon, met het oog op de belangen die de wet beoogt te beschermen, tot de vaststelling leiden dat de
      betrouwbaarheid van die persoon niet buiten twijfel staat.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23h
  - number: 23i.1
    text: |-
      Een aanbieder als bedoeld in [artikel 23b][ref1] is niet met personen verbonden in een formele of feitelijke
      zeggenschapsstructuur die in zodanige mate ondoorzichtig is dat deze een belemmering vormt of kan vormen voor het
      adequaat uitoefenen van toezicht op de aanbieder.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel23b
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23i
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 23b
        hoofdstuk: 3A
  - number: 23i.2
    text: |-
      Een aanbieder als bedoeld in [artikel 23b][ref1] is niet met personen verbonden in een formele of feitelijke
      zeggenschapsstructuur indien het recht van een staat, dat op die personen van toepassing is, een belemmering vormt
      of kan vormen voor het adequaat uitoefenen van toezicht op de aanbieder.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel23b
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23i
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 23b
        hoofdstuk: 3A
  - number: 23j.1
    text: |-
      Een aanbieder als bedoeld in [artikel 23b][ref1] voert een adequaat beleid dat een integere en beheerste
      uitoefening van het bedrijf waarborgt, met in achtneming van de [artikelen 2 tot en met 2f][ref2],
      [3 tot en met 10][ref3], [16][ref4], [20a][ref5], [20b][ref6], [23e tot en met 23j][ref7] en
      [33 tot en met 35a][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel23b
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0024282#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0024282#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0024282#Artikel20a
      [ref6]: https://wetten.overheid.nl/BWBR0024282#Artikel20b
      [ref7]: https://wetten.overheid.nl/BWBR0024282#Artikel23e
      [ref8]: https://wetten.overheid.nl/BWBR0024282#Artikel33
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23j
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 23b
        hoofdstuk: 3A
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.2'
      - id: ref3
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref4
        bwb_id: BWBR0024282
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref5
        bwb_id: BWBR0024282
        artikel: 20a
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref6
        bwb_id: BWBR0024282
        artikel: 20b
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref7
        bwb_id: BWBR0024282
        artikel: 23e
        hoofdstuk: 3A
      - id: ref8
        bwb_id: BWBR0024282
        artikel: '33'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 23j.2
    text: |-
      Een aanbieder als bedoeld in [artikel 23b][ref1] richt de bedrijfsvoering zodanig in dat deze een beheerste
      en integere uitoefening van zijn bedrijf waarborgt, met inachtneming van de [artikelen 2 tot en met 2f][ref2],
      [3 tot en met 10][ref3], [16][ref4], [20a][ref5], [20b][ref6], [23e tot en met 23j][ref7] en
      [33 tot en met 35a][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel23b
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0024282#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0024282#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0024282#Artikel20a
      [ref6]: https://wetten.overheid.nl/BWBR0024282#Artikel20b
      [ref7]: https://wetten.overheid.nl/BWBR0024282#Artikel23e
      [ref8]: https://wetten.overheid.nl/BWBR0024282#Artikel33
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23j
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 23b
        hoofdstuk: 3A
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.2'
      - id: ref3
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref4
        bwb_id: BWBR0024282
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref5
        bwb_id: BWBR0024282
        artikel: 20a
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref6
        bwb_id: BWBR0024282
        artikel: 20b
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref7
        bwb_id: BWBR0024282
        artikel: 23e
        hoofdstuk: 3A
      - id: ref8
        bwb_id: BWBR0024282
        artikel: '33'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 23j.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de
      verplichtingen in dit artikel. Deze regels kunnen betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23j
  - number: 23j.3.a
    text: 'een integere bedrijfsuitoefening, waaronder wordt verstaan het tegengaan van:'
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23j
  - number: 23j.3.a.1°
    text: belangenverstrengeling;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23j
  - number: 23j.3.a.2°
    text: |-
      strafbare feiten of andere wetsovertredingen door de aanbieder of zijn werknemers, die het vertrouwen in de
      aanbieder kunnen schaden;
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23j
  - number: 23j.3.a.3°
    text: relaties met cliënten of derden, die het vertrouwen in de aanbieder kunnen schaden
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23j
  - number: 23j.3.b
    text: het beheersen van bedrijfsprocessen en bedrijfsrisico’s.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel23j
  - number: '24.1'
    text: |-
      Met het toezicht op de naleving van de bij of krachtens deze wet gestelde regels zijn belast de bij besluit van
      de toezichthoudende autoriteit aangewezen personen. Van dat besluit wordt mededeling gedaan door plaatsing in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel24
  - number: '24.2'
    text: |-
      In afwijking van het eerste lid, is de deken, bedoeld in [artikel 45a, eerste lid, van de Advocatenwet][ref1],
      belast met het toezicht op de naleving van de bij of krachtens deze wet gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel45a
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 45a
  - number: '25.1'
    text: |-
      Indien de medewerkers van een toezichthoudende autoriteit, dan wel de in [artikel 24, tweede lid][ref1], bedoelde
      deken, bij de uitoefening van hun taak op grond van deze wet of enige andere wet feiten ontdekken die kunnen duiden
      op witwassen of financieren van terrorisme, licht de toezichthoudende autoriteit onder wiens verantwoordelijkheid
      zij hun taak uitoefenen, dan wel de in artikel 24, tweede lid, bedoelde deken, de Financiële inlichtingen eenheid
      in, zo nodig in afwijking van de toepasselijke wettelijke geheimhoudingsbepalingen, voor zover de gegevens of
      inlichtingen dienstig zijn voor de uitoefening van de wettelijke taken van de Financiële inlichtingen eenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel24
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '25.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van medewerkers van De Nederlandsche Bank N.V.,
      voor zover zij betrokken zijn bij de verwisseling, intrekking en aftekening van bankbiljetten als bedoeld in
      [artikel 27, derde lid, van de Bankwet 1998][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0009508#Artikel27
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0009508
        artikel: '27'
  - number: '26'
    text: |-
      De [artikelen 111a, derde lid, van de Wet op het notarisambt][ref1] en
      [45a, tweede lid, van de Advocatenwet][ref2], zijn van overeenkomstige toepassing op het toezicht op de naleving
      door de personen die op grond van [artikel 24, eerste lid][ref3], door de toezichthoudende autoriteit, bedoeld in
      [artikel 1d, eerste lid, onderdeel c][ref4], zijn aangewezen, respectievelijk op het toezicht op de naleving door
      de deken, bedoeld in artikel 24, tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel111a
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel45a
      [ref3]: https://wetten.overheid.nl/BWBR0024282#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0024282#Artikel1d
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: 111a
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 45a
      - id: ref3
        bwb_id: BWBR0024282
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref4
        bwb_id: BWBR0024282
        artikel: 1d
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: '27.1'
    text: |-
      De toezichthoudende autoriteit werkt samen met de toezichthoudende instanties van andere lidstaten, voor zover dat
      voor de vervulling van haar taak op grond van deze wet of de vervulling van de taken van die instanties nodig is.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel27
  - number: '27.2'
    text: |-
      De Nederlandsche Bank N.V. en de Stichting Autoriteit Financiële Markten, voor zover op grond van
      [artikel 1d, eerste lid, onderdeel a en b][ref1], belast met de uitvoering en handhaving van deze wet, verstrekken
      de Europese Bankautoriteit alle informatie die voor de vervulling van de taken van die autoriteiten nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1d
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 1d
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: '27.3'
    text: |-
      De Nederlandsche Bank N.V. en de Stichting Autoriteit Financiële Markten informeren de Europese Bankautoriteit
      voorts over een maatregel die ingevolge [paragraaf 4.2][ref1] van deze wet is opgelegd aan een bank of andere
      financiële onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0024282
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '28'
    text: |-
      De toezichthoudende autoriteit kan een ieder die niet voldoet aan een ingevolge deze wet op hem rustende
      verplichting een aanwijzing geven om binnen een door de toezichthoudende autoriteit gestelde redelijke termijn ten
      aanzien van in de aanwijzingsbeschikking aan te geven punten een bepaalde gedragslijn te volgen.
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel28
  - number: '29'
    text: 'De toezichthoudende autoriteit kan een last onder dwangsom opleggen ter zake van:'
    url: https://wetten.overheid.nl/BWBR0024282/2022-01-28#Artikel29
