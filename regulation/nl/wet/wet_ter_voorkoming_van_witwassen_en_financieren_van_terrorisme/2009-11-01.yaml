      - id: ref3
        bwb_id: BWBR0024282
        artikel: '33'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '2.2'
    text: |-
      Indien het recht van de betrokken staat toepassing van het eerste lid niet toelaat, stelt de instelling degene die
      ingevolge [artikel 24][ref1] belast is met het toezicht op de naleving van deze wet door de instelling daarvan in
      kennis en neemt zij maatregelen om het risico van witwassen en financieren van terrorisme te voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel24
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '24'
        hoofdstuk: '4'
  - number: '3.1'
    text: Een instelling verricht ter voorkoming van witwassen en financieren van terrorisme cliëntenonderzoek.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel3
  - number: '3.2'
    text: 'Het cliëntenonderzoek stelt de instelling in staat om:'
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel3
  - number: 3.2.a
    text: de cliënt te identificeren en zijn identiteit te verifiëren;
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel3
  - number: 3.2.b
    text: |-
      indien van toepassing, de uiteindelijk belanghebbende te identificeren en op risico gebaseerde en adequate
      maatregelen te nemen om zijn identiteit te verifiëren, en indien het een rechtspersoon, een stichting of een trust
      als bedoeld in het Verdrag inzake het recht dat toepasselijk is op trusts en inzake de erkenning van trusts (Trb.
      1985, 141) betreft, op risico gebaseerde en adequate maatregelen te nemen om inzicht te verwerven in de eigendoms-
      en zeggenschapsstructuur van de cliënt;
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel3
  - number: 3.2.c
    text: het doel en de beoogde aard van de zakelijke relatie vast te stellen;
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel3
  - number: 3.2.d
    text: |-
      voor zover mogelijk, een voortdurende controle op de zakelijke relatie en de tijdens de duur van deze relatie
      verrichte transacties uit te voeren, teneinde te verzekeren dat deze overeenkomen met de kennis die de instelling
      heeft van de cliënt en van zijn risicoprofiel, met in voorkomend geval een onderzoek naar de bron van het vermogen.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel3
  - number: '3.3'
    text: 'Een instelling verricht het cliëntenonderzoek in de volgende gevallen:'
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel3
  - number: 3.3.a
    text: indien zij in of vanuit Nederland een zakelijke relatie aangaat;
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel3
  - number: 3.3.b
    text: |-
      indien zij in of vanuit Nederland een incidentele transactie verricht ten behoeve van de cliënt van ten minste
      € 15 000, of twee of meer transacties waartussen een verband bestaat met een gezamenlijke waarde van ten minste
      € 15 000;
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel3
  - number: 3.3.c
    text: indien er indicaties zijn dat de cliënt betrokken is bij witwassen of financieren van terrorisme;
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel3
  - number: 3.3.d
    text: indien zij twijfelt aan de betrouwbaarheid van eerder verkregen gegevens van de cliënt; of
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel3
  - number: 3.3.e
    text: |-
      indien het risico van betrokkenheid van een bestaande cliënt bij witwassen of financieren van terrorisme daartoe
      aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel3
  - number: '3.4'
    text: |-
      Een instelling kan het cliëntenonderzoek afstemmen op de risicogevoeligheid voor witwassen of financiering van
      terrorisme van het type cliënt, zakelijke relatie, product of transactie.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel3
  - number: '3.5'
    text: |-
      Het eerste tot en met het vierde lid is niet van toepassing op trustkantoren als bedoeld in
      [artikel 1, onderdeel a, onder 10°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '1'
        hoofdstuk: '1'
  - number: '3.6'
    text: Bij ministeriële regeling kan vrijstelling worden geregeld van het in het eerste of tweede lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel3
  - number: '3.7'
    text: |-
      Onze Minister van Financiën kan, op verzoek van een instelling, al dan niet voor bepaalde tijd, ontheffing verlenen
      van het eerste of tweede lid. Aan een vrijstelling en ontheffing kunnen beperkingen worden gesteld en voorschriften
      worden verbonden.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel3
  - number: '4.1'
    text: |-
      Een instelling voldoet aan [artikel 3, tweede lid, onderdelen a en b][ref1], voordat de zakelijke relatie wordt
      aangegaan of een incidentele transactie als bedoeld in [artikel 3, derde lid, onderdeel b][ref2], wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel3
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '4.2'
    text: |-
      In afwijking van het eerste lid is het een instelling toegestaan de identiteit van de cliënt en, indien van
      toepassing, de identiteit van de uiteindelijk belanghebbende te verifiëren tijdens het aangaan van de zakelijke
      relatie, indien dit noodzakelijk is om de dienstverlening niet te verstoren en indien er weinig risico op witwassen
      of financieren van terrorisme bestaat. In dat geval verifieert de instelling de identiteit zo spoedig mogelijk na
      het eerste contact met de cliënt.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel4
  - number: '4.3'
    text: |-
      In afwijking van het eerste en tweede lid is het een instelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 5°][ref1], toegestaan de begunstigde van een polis te identificeren en
      de identiteit te verifiëren nadat de zakelijke relatie is aangegaan. In dat geval vindt het identificeren en het
      verifiëren van de identiteit plaats op of voor het tijdstip van uitbetaling, dan wel op of voor het tijdstip waarop
      de begunstigde zijn rechten krachtens de polis wil uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '1'
        hoofdstuk: '1'
  - number: '4.4'
    text: |-
      In afwijking van het eerste en tweede lid is het een kredietinstelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°][ref1], toegestaan een rekening te openen voordat de verificatie van
      de identiteit van de cliënt heeft plaatsgevonden, indien zij waarborgt dat deze rekening niet kan worden gebruikt
      voordat de verificatie heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '1'
        hoofdstuk: '1'
  - number: '4.5'
    text: |-
      In afwijking van het eerste en tweede lid kan een notaris of kandidaat-notaris als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 12°][ref1], de identiteit van de cliënt en, indien van
      toepassing, van de uiteindelijk belanghebbende verifiëren op het moment dat identificatie op grond van
      [artikel 39 van de Wet op het notarisambt][ref2] is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel39
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: '39'
  - number: '5.1'
    text: |-
      Het is een instelling verboden een zakelijke relatie aan te gaan of een transactie uit te voeren, indien zij
      geen cliëntenonderzoek heeft verricht als bedoeld in [artikel 3][ref1] of indien het cliëntenonderzoek niet heeft
      geleid tot het in [artikel 3, tweede lid, aanhef en onderdelen a, b en c][ref2], bedoelde resultaat. Indien de
      instelling reeds een zakelijke relatie met de cliënt heeft en de instelling niet kan voldoen aan het bepaalde in
      [artikel 3, eerste en tweede lid, aanhef en onderdelen a, b, en c][ref3], beëindigt de instelling de desbetreffende
      zakelijke relatie.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0024282#Artikel3
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref3
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '5.2'
    text: |-
      Het eerste lid is niet van toepassing op de gevallen als bedoeld in de [artikelen 6][ref1] en [7][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel7
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '5.3'
    text: |-
      Het is een bank verboden een correspondentbankrelatie aan te gaan of voort te zetten met een shellbank of met een
      bank waarvan bekend is dat deze een shellbank toestaat van haar rekeningen gebruik te maken.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel5
  - number: '6.1'
    text: |-
      [Artikel 3, eerste lid, derde lid, aanhef en onderdelen a, b en d, en vierde lid][ref1], en
      [artikel 4, eerste lid][ref2], zijn niet van toepassing ten aanzien van de volgende cliënten:


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel4
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 6.1.a
    text: |-
      instellingen als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1° tot en met 8°][ref1], met zetel in
      Nederland of in een andere lidstaat;


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '1'
        hoofdstuk: '1'
  - number: 6.1.b
    text: |-
      instellingen als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1° tot en met 9°][ref1],
      met zetel in een staat die geen lidstaat is, indien in die staat op de instelling
      wettelijke voorschriften van toepassing zijn die gelijkwaardig zijn aan het bepaalde in de
      [artikelen 3, tweede lid, derde lid, aanhef en onderdelen a, b, c en d, en vierde lid][ref2], en
      [artikel 8, eerste lid][ref3], en er toezicht wordt uitgeoefend op de naleving van die voorschriften;


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0024282#Artikel8
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref3
        bwb_id: BWBR0024282
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 6.1.c
    text: |-
      rechtspersonen die effecten hebben uitgegeven die in een lidstaat zijn toegelaten tot de handel op een
      gereglementeerde markt als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 6.1.d
    text: |-
      rechtspersonen die effecten hebben uitgegeven in een staat die geen lidstaat is, zijn toegelaten tot de handel op
      een markt in financiële instrumenten als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1], en
      die daarbij zijn onderworpen aan openbaarmakingsvereisten die overeenkomen met die van [richtlijn nr. 2004/109]
      (32004L0109) van het Europees Parlement en de Raad van de Europese Unie van 15 december 2004 betreffende de
      transparantievereisten die gelden voor informatie over uitgevende instellingen waarvan effecten tot de handel op
      een gereglementeerde markt zijn toegelaten en tot wijziging van [Richtlijn 2001/34/EG](32001L0034) (PbEU L 390);


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 6.1.e
    text: |-
      cliënten die tijdelijk gelden aanhouden op rekeningen op naam van notarissen, advocaten en andere onafhankelijke
      beoefenaren van juridische beroepen. Voor zover de rekeninghouders niet in een lidstaat gevestigd zijn, is deze
      bepaling slechts van toepassing indien op hen wettelijke voorschriften van toepassing zijn ter voorkoming van
      witwassen en financieren van terrorisme die overeenkomen met het bepaalde in deze wet en de informatie over de
      identiteit van de cliënten op verzoek beschikbaar is voor de desbetreffende instelling;
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel6
  - number: 6.1.f
    text: Nederlandse overheidsinstanties;
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel6
  - number: 6.1.g
    text: 'instanties:'
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel6
  - number: 6.1.g.1°
    text: |-
      die zijn belast met openbare functies uit hoofde van het Verdrag betreffende de Europese Unie, de verdragen tot
      oprichting van de Europese Gemeenschappen of de afgeleide communautaire wetgeving;
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel6
  - number: 6.1.g.2°
    text: waarvan de identiteit bekend is;
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel6
  - number: 6.1.g.3°
    text: waarvan de activiteiten en boekhoudkundige praktijken transparant zijn; en
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel6
  - number: 6.1.g.4°
    text: |-
      die verantwoording schuldig zijn aan een instelling van de Europese Gemeenschappen of aan een overheidsinstantie
      van een lidstaat of ten aanzien waarvan andere gepaste procedures bestaan om de activiteiten te controleren.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel6
  - number: '6.2'
    text: |-
      Een instelling verzamelt voldoende gegevens om te kunnen vaststellen of het eerste lid op een cliënt van toepassing
      is.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel6
  - number: '6.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen categorieën cliënten worden aangewezen waarop het eerste lid van
      overeenkomstige toepassing is.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel6
  - number: '6.4'
    text: Onze Minister van Financiën wijst de staten aan als bedoeld in het eerste lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel6
  - number: '7.1'
    text: |-
      [Artikel 3, eerste lid, derde lid, aanhef en onderdelen a, b en d, en vierde lid][ref1], alsmede
      [artikel 4, eerste lid][ref2], zijn niet van toepassing voor zover het betreft zakelijke relaties of transacties
      met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel4
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 7.1.a
    text: |-
      levensverzekeringsovereenkomsten als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1], waarvan
      het bedrag van de jaarlijks te betalen premie € 1 000 of minder bedraagt of waarvan het bedrag van de eenmalige
      premie € 2 500 of minder bedraagt;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 7.1.b
    text: |-
      producten met betrekking tot een pensioen als bedoeld in [artikel 1 van de Pensioenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
  - number: 7.1.c
    text: |-
      elektronisch geld als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1], waarvan:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 7.1.c.1°
    text: |-
      indien de geldswaarde die is opgeslagen op de elektronische drager of die op afstand is opgeslagen in een centrale
      rekeningadministratie niet kan worden heropgeladen, het maximumbedrag niet meer dan € 150 bedraagt; of
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel7
  - number: 7.1.c.2°
    text: |-
      indien de geldswaarde die is opgeslagen op de elektronische drager of die op afstand is opgeslagen in een centrale
      rekeningadministratie kan worden opgeladen, het totaalbedrag van de transacties die in een kalenderjaar kunnen
      worden verricht niet meer dan € 2.500 bedraagt, tenzij de houder een bedrag van € 1 000 of meer heeft laten
      terugbetalen in datzelfde kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel7
  - number: '7.2'
    text: |-
      Een instelling verzamelt voldoende gegevens om te kunnen vaststellen of het eerste lid op een product van
      toepassing is.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel7
  - number: '7.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen producten of transacties worden aangewezen waarop het eerste lid van
      overeenkomstige toepassing is.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel7
  - number: '8.1'
    text: |-
      Een instelling verricht, onverminderd [artikel 3, tweede, derde en vierde lid][ref1], aanvullend cliëntenonderzoek
      indien en naar gelang een zakelijke relatie of transactie naar haar aard een hoger risico op witwassen of
      financieren van terrorisme met zich brengt. Bij algemene maatregel van bestuur kunnen categorieën zakelijke
      relaties en transacties worden aangewezen die naar hun aard een hoger risico op witwassen of financieren van
      terrorisme met zich brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel3
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '8.2'
    text: |-
      Onverminderd het eerste lid neemt een instelling, indien een cliënt niet fysiek aanwezig is voor identificatie,
      maatregelen om het hogere risico te compenseren. De instelling kan aan de vorige volzin voldoen indien zij:
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel8
  - number: 8.2.a
    text: de identiteit van de cliënt verifieert aan de hand van aanvullende documenten, gegevens of informatie;
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel8
  - number: 8.2.b
    text: de overgelegde documenten beoordeelt op echtheid; of
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel8
  - number: 8.2.c
    text: |-
      waarborgt dat de eerste betaling die met de zakelijke relatie of transactie verband houdt, wordt gedaan ten gunste
      of ten laste van een rekening van de cliënt bij een bank met zetel in een lidstaat of in een door Onze Minister
      van Financiën aangewezen staat die beschikt over een vergunning om in die lidstaat onderscheidenlijk die staat haar
      bedrijf te mogen uitoefenen.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel8
  - number: '8.3'
    text: |-
      Onverminderd het eerste lid draagt een bank die een correspondentbankrelatie aangaat of is aangegaan met een bank
      in een staat die geen lidstaat is er zorg voor dat:
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel8
  - number: 8.3.a
    text: |-
      zij voldoende informatie over de betrokken bank verzamelt om een volledig beeld te krijgen van de aard van haar
      bedrijfsactiviteiten, en op basis van openbaar beschikbare informatie de reputatie van de bank en de kwaliteit van
      het toezicht dat op de bank wordt uitgeoefend beoordeelt;
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel8
  - number: 8.3.b
    text: |-
      zij de procedures en maatregelen ter voorkoming van witwassen en financieren van terrorisme van de betrokken bank
      beoordeelt;
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel8
  - number: 8.3.c
    text: |-
      indien het een nieuwe correspondentbankrelatie betreft, de beslissing tot het aangaan van die relatie wordt genomen
      of goedgekeurd door personen die daartoe door de bank gemachtigd zijn;
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel8
  - number: 8.3.d
    text: de verantwoordelijkheden van beide banken schriftelijk worden vastgelegd;
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel8
  - number: 8.3.e
    text: |-
      de betrokken bank de cliënt heeft geïdentificeerd en zijn identiteit heeft geverifieerd en daarnaast doorlopend
      toezicht houdt op de cliënten die rechtstreeks toegang hebben tot transitrekeningen en dat deze in staat is om haar
      op verzoek de relevante cliëntgegevens te verstrekken.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel8
  - number: '8.4'
    text: |-
      Een instelling draagt er zorg voor dat zij over op risico gebaseerde procedures beschikt om te bepalen of de cliënt
      een politiek prominent persoon is die niet in Nederland woont. Onverminderd het eerste lid draagt een instelling
      die een zakelijke relatie aangaat met of een transactie verricht voor een politiek prominente persoon die niet in
      Nederland woont, er tevens zorg voor dat:
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel8
  - number: 8.4.a
    text: |-
      de beslissing tot het aangaan van die relatie of het verrichten van die transactie wordt genomen of wordt
      goedgekeurd door personen die daartoe door de instelling zijn gemachtigd;
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel8
  - number: 8.4.b
    text: |-
      zij adequate maatregelen treft om de bron van het vermogen vast te stellen dat bij de zakelijke relatie of
      transactie wordt gebruikt; en
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel8
  - number: 8.4.c
    text: zij doorlopend controle uitoefent op de zakelijke relatie.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel8
  - number: '9.1'
    text: |-
      [Artikel 5, eerste lid][ref1], is niet van toepassing ten aanzien van cliënten die zijn geïdentificeerd en waarvan
      de identiteit reeds is geverifieerd, ingevolge [artikel 3][ref2] of op daarmee overeenkomende wijze, door:


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel3
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 9.1.a
    text: |-
      een instelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 11° tot en met 13°][ref1], met zetel in
      Nederland of een andere lidstaat; of


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '1'
        hoofdstuk: '1'
  - number: 9.1.b
    text: |-
      een instelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1° tot en met 3° of 5° tot en met 10°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '1'
        hoofdstuk: '1'
  - number: '9.2'
    text: |-
      Een instelling als bedoeld in het eerste lid stelt, op verzoek van de instelling waar zij een cliënt introduceert,
      de identificatie- en verificatiegegevens en overige gegevens en bescheiden inzake de identiteit van de cliënt of de
      uiteindelijk belanghebbende ter beschikking aan die instelling.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel9
  - number: '10.1'
    text: |-
      Een instelling kan het cliëntenonderzoek, bedoeld in [artikel 3, eerste lid][ref1], voor zover het betrekking heeft
      op het in het [tweede lid, onderdelen a, b, en c, van dat artikel][ref2] bepaalde, laten verrichten door een derde,
      onverminderd haar verplichting om te voldoen aan het in die onderdelen bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel3
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '10.2'
    text: |-
      Indien de in het eerste lid bedoelde uitbesteding een structureel karakter heeft legt de instelling de opdracht
      daartoe schriftelijk vast.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel10
  - number: '11.1'
    text: |-
      Indien de cliënt een natuurlijke persoon is, wordt diens identiteit geverifieerd aan de hand van documenten,
      gegevens of inlichtingen uit betrouwbare en onafhankelijke bron. Bij ministeriële regeling kunnen documenten,
      gegevens of inlichtingen worden aangewezen op basis waarvan kan worden voldaan aan het in de vorige zin bepaalde.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel11
  - number: '11.2'
    text: |-
      Indien de cliënt een rechtspersoon is opgericht naar Nederlands recht en in Nederland zijn zetel heeft of een
      buitenlandse rechtspersoon is die in Nederland is gevestigd, wordt diens identiteit geverifieerd aan de hand van
      documenten, gegevens of inlichtingen uit betrouwbare en onafhankelijke bron. Bij ministeriële regeling kunnen
      documenten, gegevens of inlichtingen worden aangewezen op basis waarvan kan worden voldaan aan het in de vorige
      zin bepaalde.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel11
  - number: '11.3'
    text: |-
      Indien de cliënt een buitenlandse rechtspersoon is die niet in Nederland is gevestigd, wordt de identiteit
      geverifieerd op basis van betrouwbare en in het internationale verkeer gebruikelijke documenten, gegevens of
      inlichtingen of op basis van documenten, gegevens of inlichtingen die bij wet als geldig middel voor identificatie
      zijn erkend in de staat van herkomst van de cliënt.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel11
  - number: '11.4'
    text: |-
      Bij ministeriële regeling kunnen regels worden vastgesteld met betrekking tot het verifiëren van de identiteit van
      cliënten die niet onder het eerste tot en met het derde lid vallen.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel11
  - number: '12.1'
    text: Er is een Meldpunt ongebruikelijke transacties.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel12
  - number: '12.2'
    text: |-
      Het Meldpunt ongebruikelijke transacties is de verantwoordelijke autoriteit als bedoeld in de [Verordening
      nr. 2006/1781/EG](33681R2006) van het Europees Parlement en de Raad betreffende bij geldovermakingen te voegen
      informatie over de betaler.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel12
  - number: '12.3'
    text: De algemene leiding, de organisatie en het beheer van het meldpunt berusten bij Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel12
  - number: '12.4'
    text: |-
      Benoeming, schorsing en ontslag van het hoofd van het meldpunt geschieden bij koninklijk besluit op voordracht van
      Onze Minister van Justitie, in overeenstemming met Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel12
  - number: '12.5'
    text: |-
      Onze Minister van Justitie bepaalt in overeenstemming met Onze Minister van Financiën de begroting van het
      meldpunt.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel12
  - number: '13'
    text: 'Het meldpunt heeft met het oog op het voorkomen en opsporen van witwassen en financieren van terrorisme tot taak:'
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel13
  - number: 13.a
    text: |-
      het verzamelen, registreren, bewerken en analyseren van de gegevens die het verkrijgt, teneinde te bezien of deze
      gegevens van belang kunnen zijn voor het voorkomen en opsporen van misdrijven;
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel13
  - number: 13.b
    text: |-
      het verstrekken van persoonsgegevens en andere gegevens in overeenstemming met deze wet en het bij of krachtens de
      [Wet politiegegevens][ref1] bepaalde;


      [ref1]: https://wetten.overheid.nl/BWBR0022463
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0022463
  - number: 13.c
    text: |-
      de instelling die overeenkomstig [artikel 16][ref1] een melding heeft gedaan, berichten over de afdoening van de
      melding;


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel16
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 13.d
    text: |-
      het verrichten van onderzoek naar ontwikkelingen op het gebied van witwassen en financieren van terrorisme en naar
      de verbetering van de methoden om witwassen en financieren van terrorisme te voorkomen en op te sporen;
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel13
  - number: 13.e
    text: |-
      het geven van aanbevelingen voor de bedrijfstakken omtrent de invoering van passende procedures voor interne
      controle en communicatie en andere te treffen maatregelen tot voorkoming van het gebruik van die bedrijfstakken
      voor witwassen en financieren van terrorisme;
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel13
  - number: 13.f
    text: 'het geven van voorlichting omtrent het voorkomen en opsporen van witwassen en financieren van terrorisme aan:'
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel13
  - number: 13.f.1°
    text: de bedrijfstakken en beroepsgroepen;
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel13
  - number: 13.f.2°
    text: |-
      de personen die krachtens [artikel 24][ref1] met het toezicht op de naleving van deze wet zijn belast;


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel24
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '24'
        hoofdstuk: '4'
  - number: 13.f.3°
    text: het openbaar ministerie en de overige ambtenaren belast met de opsporing van strafbare feiten;
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel13
  - number: 13.f.4°
    text: het publiek;
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel13
  - number: 13.g
    text: |-
      het geven van inlichtingen aangaande het meldgedrag van de instellingen aan de personen die krachtens
      [artikel 24][ref1] met het toezicht op de naleving van deze wet zijn belast;


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel24
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '24'
        hoofdstuk: '4'
  - number: 13.h
    text: |-
      het onderhouden van contacten met buitenlandse van overheidswege aangewezen instanties die een vergelijkbare taak
      hebben als het meldpunt;
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel13
  - number: 13.i
    text: |-
      het jaarlijks uitbrengen van een verslag met betrekking tot de taakuitoefening en zijn werkzaamheden in het
      voorafgaande jaar en van zijn voornemens voor het komende jaar, dat wordt aangeboden aan Onze Minister van Justitie
      en ter kennis gebracht van Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel13
  - number: '14.1'
    text: |-
      Bij het meldpunt kunnen persoonsgegevens worden verwerkt ten behoeve van de taak, bedoeld in [artikel 13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel13
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '14.2'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over de categorieën van personen waarover het meldpunt
      gegevens verwerkt, de gegevensverstrekking, de bewaring en vernietiging van gegevens en de protocolplicht.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel14
  - number: '14.3'
    text: |-
      Op de verwerking van persoonsgegevens door het meldpunt zijn de [artikelen 1][ref1], [2][ref2],
      [3, eerste en tweede lid][ref3], [4][ref4], [5][ref5], [6][ref6], [7][ref7], [15][ref8],
      [16, eerste lid, onderdelen a, b en c][ref9], [17][ref10], [18][ref11], [22][ref12] en [23][ref13],
      [25 tot en met 31][ref14], alsmede [artikel 33 van de Wet politiegegevens][ref15] van overeenkomstige
      toepassing, met dien verstande dat voor het meldpunt als verantwoordelijke in de zin van
      [artikel 1, onderdeel f, van die wet][ref16] wordt aangemerkt Onze Minister van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0022463#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0022463#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0022463#Artikel6
      [ref7]: https://wetten.overheid.nl/BWBR0022463#Artikel7
      [ref8]: https://wetten.overheid.nl/BWBR0022463#Artikel15
      [ref9]: https://wetten.overheid.nl/BWBR0022463#Artikel16
      [ref10]: https://wetten.overheid.nl/BWBR0022463#Artikel17
      [ref11]: https://wetten.overheid.nl/BWBR0022463#Artikel18
      [ref12]: https://wetten.overheid.nl/BWBR0022463#Artikel22
      [ref13]: https://wetten.overheid.nl/BWBR0022463#Artikel23
      [ref14]: https://wetten.overheid.nl/BWBR0022463#Artikel25
      [ref15]: https://wetten.overheid.nl/BWBR0022463#Artikel33
      [ref16]: https://wetten.overheid.nl/BWBR0022463#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0022463
        artikel: '4'
      - id: ref5
        bwb_id: BWBR0022463
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0022463
        artikel: '6'
      - id: ref7
        bwb_id: BWBR0022463
        artikel: '7'
      - id: ref8
        bwb_id: BWBR0022463
        artikel: '15'
      - id: ref9
        bwb_id: BWBR0022463
        artikel: '16'
      - id: ref10
        bwb_id: BWBR0022463
        artikel: '17'
      - id: ref11
        bwb_id: BWBR0022463
        artikel: '18'
      - id: ref12
        bwb_id: BWBR0022463
        artikel: '22'
      - id: ref13
        bwb_id: BWBR0022463
        artikel: '23'
      - id: ref14
        bwb_id: BWBR0022463
        artikel: '25'
      - id: ref15
        bwb_id: BWBR0022463
        artikel: '33'
      - id: ref16
        bwb_id: BWBR0022463
        artikel: '1'
  - number: '15.1'
    text: |-
      Bij algemene maatregel van bestuur worden, zo nodig per daarbij te onderscheiden categorieën transacties,
      indicatoren vastgesteld aan de hand waarvan wordt beoordeeld of een transactie wordt aangemerkt als een
      ongebruikelijke transactie.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel15
  - number: '15.2'
    text: |-
      Indien het spoedeisende belang dat vereist, kunnen bij regeling van Onze Minister van Financiën en Onze Minister
      van Justitie gezamenlijk de indicatoren, bedoeld in het eerste lid, worden vastgesteld voor een termijn van ten
      hoogste zes maanden.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel15
  - number: '16.1'
    text: |-
      Een instelling meldt een verrichte of voorgenomen ongebruikelijke transactie binnen veertien dagen nadat het
      ongebruikelijke karakter van de transactie bekend is geworden, aan het meldpunt.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel16
  - number: '16.2'
    text: 'Bij een melding als bedoeld in het eerste lid verstrekt de instelling de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel16
  - number: 16.2.a
    text: |-
      de identiteit van de cliënt en, voor zover mogelijk, de identiteit van degene ten behoeve van wie de transactie
      wordt uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel16
  - number: 16.2.b
    text: de aard en het nummer van het identiteitsbewijs van de cliënt;
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel16
  - number: 16.2.c
    text: de aard, het tijdstip en de plaats van de transactie;
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel16
  - number: 16.2.d
    text: |-
      de omvang en de bestemming en herkomst van de gelden, effecten, edele metalen of andere waarden die bij een
      transactie betrokken zijn;
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel16
  - number: 16.2.e
    text: de omstandigheden op grond waarvan de transactie als ongebruikelijk wordt aangemerkt;
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel16
  - number: 16.2.f
    text: een omschrijving van de desbetreffende zaken van grote waarde bij een transactie boven de € 15 000;
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel16
  - number: 16.2.g
    text: aanvullende, bij algemene maatregel van bestuur aan te wijzen, gegevens.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel16
  - number: '17.1'
    text: |-
      Het meldpunt kan bij de instelling die een melding heeft gedaan, alsmede bij de instelling die bij een transactie
      is betrokken waarover het meldpunt gegevens heeft verzameld, nadere gegevens of inlichtingen vragen, teneinde
      te kunnen beoordelen of verzamelde gegevens dienen te worden verstrekt op grond van zijn taak bedoeld in
      [artikel 13, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel13
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '17.2'
    text: |-
      De instelling waaraan overeenkomstig het eerste lid deze gegevens of inlichtingen zijn gevraagd, verstrekt deze
      schriftelijk, alsmede in spoedeisende gevallen mondeling, aan het meldpunt binnen de door het meldpunt gestelde
      termijn.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel17
  - number: '18'
    text: |-
      Het meldpunt bepaalt de wijze waarop een melding moet worden gedaan, of gegevens of inlichtingen als bedoeld in
      [artikel 17, eerste lid][ref1], moeten worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel17
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '19.1'
    text: |-
      Gegevens of inlichtingen die in overeenstemming met de [artikelen 16][ref1] of [17][ref2] zijn verstrekt, kunnen
      niet dienen als grondslag voor of ten behoeve van een opsporingsonderzoek of een vervolging wegens verdenking van,
      of als bewijs ter zake van een tenlastelegging wegens witwassen of financieren van terrorisme door de instelling
      die deze gegevens of inlichtingen heeft verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel17
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '19.2'
    text: |-
      Gegevens of inlichtingen die zijn verstrekt in de redelijke veronderstelling dat uitvoering wordt gegeven aan de
      [artikelen 16][ref1] of [17][ref2] kunnen niet dienen als grondslag voor of ten behoeve van een opsporingsonderzoek
      of een vervolging wegens verdenking van, of als bewijs ter zake van een tenlastelegging wegens, overtreding van
      [artikel 272 van het Wetboek van Strafrecht][ref3] door de instelling die deze gegevens of inlichtingen heeft
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel272
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '272'
  - number: '19.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing ten aanzien van personen die werkzaam zijn voor een
      instelling die gegevens of inlichtingen heeft verstrekt als omschreven in het eerste of tweede lid en die daaraan
      hebben meegewerkt.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel19
  - number: '20'
    text: |-
      De instelling die tot een melding op de voet van [artikel 16][ref1] is overgegaan, is niet aansprakelijk
      voor schade die een derde dientengevolge lijdt, tenzij aannemelijk wordt gemaakt dat gelet op alle feiten en
      omstandigheden in redelijkheid niet tot melding had mogen worden overgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel16
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '21.1'
    text: Er is een Commissie inzake de meldingsplicht van ongebruikelijke transacties.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel21
  - number: '21.2'
    text: |-
      De commissie treedt periodiek in overleg met vertegenwoordigers van Onze Minister van Justitie en Onze Minister van
      Financiën over:
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel21
  - number: 21.2.a
    text: de inrichting en uitvoering van de meldingsplicht;
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel21
  - number: 21.2.b
    text: |-
      de vaststelling van de indicatoren bedoeld in [artikel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel15
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '21.3'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de samenstelling en de organisatie van de
      commissie.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel21
  - number: '22'
    text: |-
      Het is aan een ieder die uit hoofde van de toepassing van deze wet of van krachtens deze wet genomen besluiten
      enige taak vervult of heeft vervuld verboden van gegevens of inlichtingen, die ingevolge deze wet zijn verstrekt
      of ontvangen, verder of anders gebruik te maken of daaraan verder of anders bekendheid te geven dan voor de
      uitoefening van zijn taak of door deze wet wordt geëist.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel22
  - number: '23.1'
    text: |-
      Een instelling die ingevolge [artikel 16][ref1] een melding heeft gedaan of die ingevolge [artikel 17][ref2]
      nadere informatie heeft verstrekt, is verplicht tot geheimhouding hiervan, alsmede van het gegeven dat deze
      melding of verstrekking aanleiding kan geven tot nader onderzoek, behoudens voor zover uit deze wet de noodzaak tot
      bekendmaking voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel17
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '23.2'
    text: |-
      De instelling die ingevolge [artikel 13, onderdeel c][ref1], gegevens of inlichtingen verkrijgt, is verplicht tot
      geheimhouding daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel13
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '23.3'
    text: |-
      De in het eerste lid bedoelde geheimhoudingsplicht is niet van toepassing op een mededeling gedaan door een
      instelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 11°, 12° en 13°][ref1], aan een cliënt met
      als doel deze te doen afzien van een onwettige handeling.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '1'
        hoofdstuk: '1'
  - number: '23.4'
    text: 'Een instelling kan, in afwijking van het eerste lid, mededelingen doen aan:'
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel23
  - number: 23.4.a
    text: |-
      instellingen die behoren tot hetzelfde financieel conglomeraat als bedoeld in
      [artikel 3:290 van de Wet op het financieel toezicht][ref1] en die tenminste hebben voldaan aan de verplichting tot
      het vereenvoudigd cliëntenonderzoek, bedoeld in de [artikelen 6][ref2] en [7][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0024282#Artikel7
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref3
        bwb_id: BWBR0024282
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 23.4.b
    text: |-
      instellingen als bedoeld in [artikel 1, eerste lid, onderdeel a][ref1], met zetel in een lidstaat of een staat die
      geen lidstaat is die eisen stelt die gelijkwaardig zijn aan die in deze wet, en die hun werkzaamheden, al dan niet
      als werknemer, uitoefenen binnen eenzelfde rechtspersoon of netwerk;


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '1'
        hoofdstuk: '1'
  - number: 23.4.c
    text: |-
      instellingen als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1° tot en met 12°][ref1], met zetel in
      een lidstaat, mits het dezelfde cliënt en dezelfde transactie betreft en de mededeling uitsluitend is bedoeld ter
      voorkoming van witwassen en financieren van terrorisme;


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '1'
        hoofdstuk: '1'
  - number: 23.4.d
    text: |-
      instellingen als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1° tot en met 12°][ref1], met zetel in
      een staat die geen lidstaat is die eisen stelt die gelijkwaardig zijn aan die in deze wet, die zijn onderworpen
      aan gelijkwaardige verplichtingen op het gebied van het beroepsgeheim en de bescherming van persoonsgegevens, en
      tot dezelfde beroepscategorie behoren, mits het dezelfde cliënt en dezelfde transactie betreft en de mededeling
      uitsluitend is bedoeld ter voorkoming van witwassen en financieren van terrorisme.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '1'
        hoofdstuk: '1'
  - number: '24.1'
    text: |-
      Bij besluit van Onze Minister van Financiën en Onze Minister van Justitie gezamenlijk kunnen personen worden
      aangewezen die belast zijn met het toezicht op de naleving door de instellingen van deze wet.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel24
  - number: '24.2'
    text: |-
      De personen die op grond van het eerste lid belast zijn met het toezicht op de instellingen, bedoeld
      in [artikel 1, eerste lid, onderdeel a, onder 10° tot en met 15°][ref1], kunnen het toezicht op een
      risicogeoriënteerde wijze uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '1'
        hoofdstuk: '1'
  - number: '24.3'
    text: |-
      De Nederlandsche Bank N.V. is belast met het toezicht op de naleving van de [Verordening nr. 2006/1781/EG]
      (33681R2006) van het Europees Parlement en de Raad betreffende bij geldovermakingen te voegen informatie over de
      betaler.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel24
  - number: '24.4'
    text: |-
      Ten aanzien van personen die op grond van het eerste lid belast zijn met het toezicht op
      de naleving van de artikelen, genoemd in het eerste en derde lid, zijn de bepalingen van
      [hoofdstuk 5, afdeling 5.2, van de Algemene wet bestuursrecht][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.2
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '5.2'
  - number: '24.5'
    text: |-
      Van een besluit tot aanwijzing op grond van het eerste lid wordt mededeling gedaan door plaatsing in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel24
  - number: '24.6'
    text: |-
      Bij ministeriële regeling kunnen banken die deel uitmaken van een groep banken die op 15 december 1977 blijvend was
      aangesloten bij een centrale kredietinstelling die controle uitoefent op de bedrijfsvoering en uitbesteding van die
      banken worden vrijgesteld van het toezicht door de Nederlandsche Bank N.V. op de naleving van deze wet, indien de
      centrale kredietinstelling toezicht houdt op die groep banken en in voldoende mate bevoegd is voor de naleving van
      deze wet noodzakelijke instructies te geven aan die banken. Aan deze vrijstelling kunnen beperkingen worden gesteld
      en voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel24
  - number: '25'
    text: |-
      Indien de personen die met wettelijk toezicht op instellingen zijn belast bij de uitoefening van hun taak feiten
      ontdekken die kunnen duiden op witwassen of financieren van terrorisme, lichten zij, zo nodig in afwijking van de
      toepasselijke wettelijke geheimhoudingsbepalingen, het meldpunt in.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel25
  - number: '26.1'
    text: |-
      Onze Minister van Financiën kan een last onder dwangsom opleggen ter zake van overtreding
      van de [artikelen 2][ref1], [3, eerste tot en met derde en zevende lid][ref2],
      [4, eerste lid, tweede lid, tweede volzin, derde lid, tweede volzin, en vierde lid][ref3],
      [5, eerste en derde lid][ref4], [6, tweede lid][ref5], [7, tweede lid][ref6], [8][ref7], [10, tweede lid][ref8],
      [11][ref9], [16][ref10], [17, tweede lid][ref11], [23 eerste en tweede lid][ref12], [33][ref13], [34][ref14] en
      [35][ref15] van deze wet, [artikel 5:20 van de Algemene wet bestuursrecht][ref16] en het bepaalde in [Verordening
      (EG) nr. 2006/1781](33681R2006) van het Europees Parlement en de Raad van de Europese Unie van 15 november 2006
      betreffende bij geldovermakingen te voegen informatie over de betaler (PbEU L 345).


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel3
