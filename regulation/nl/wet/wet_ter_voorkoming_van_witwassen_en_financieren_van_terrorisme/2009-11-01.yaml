        artikel: '5'
  - number: '27.2'
    text: |-
      Het eerste lid is niet van toepassing ten aanzien van degene die, in geval van bezwaren tegen diens handelen of
      nalaten in de beroepsuitoefening, onderworpen is aan tuchtrechtspraak.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel27
  - number: '28.1'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de uitoefening van de bevoegdheid,
      bedoeld in [artikel 27, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel27
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '27'
        hoofdstuk: '4'
  - number: '28.2'
    text: |-
      Het bedrag van de bestuurlijke boete wordt bepaald bij algemene maatregel van bestuur, met dien verstande dat
      de bestuurlijke boete voor een afzonderlijke overtreding ten hoogste € 4 000 000 bedraagt. Indien tijdens het
      plegen van de overtreding nog geen vijf jaren zijn verlopen sedert het opleggen van een bestuurlijke boete aan de
      overtreder ter zake van eenzelfde overtreding, wordt het bedrag van de bestuurlijke boete, bedoeld in de eerste
      volzin, voor een afzonderlijke overtreding verdubbeld.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel28
  - number: '28.3'
    text: |-
      De algemene maatregel van bestuur, bedoeld in het eerste lid, bepaalt bij elke daarin omschreven overtreding het
      bedrag van de deswege op te leggen bestuurlijke boete. De overtredingen worden gerangschikt in categorieën naar
      zwaarte van de overtreding met de daarbij behorende basisbedragen, minimumbedragen en maximumbedragen. Daarbij
      wordt de volgende indeling gebruikt:








                    Categorie


                    Basisbedrag


                    Minimumbedrag


                    Maximumbedrag






                    1


                    € 10 000,–


                    € 0,–


                    € 10 000,–




                    2


                    € 500 000,–


                    € 0,–


                    € 1 000 000,–




                    3


                    € 2 000 000,–


                    € 0,–


                    € 4 000 000,–
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel28
  - number: '28.4'
    text: |-
      In afwijking van het tweede en derde lid kan de toezichthouder de hoogte van de bestuurlijke boete vaststellen
      op ten hoogste twee keer het bedrag van het voordeel dat de overtreder door de overtreding heeft verkregen indien
      diens voordeel groter is dan € 2 000 000.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel28
  - number: '29'
    text: Onze Minister van Financiën kan de bestuurlijke boete invorderen bij dwangbevel.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel29
  - number: '30'
    text: |-
      In afwijking van [artikel 8:7 van de Algemene wet bestuursrecht][ref1] is voor beroep tegen besluiten op grond van
      deze wet de rechtbank te Rotterdam bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '31.1'
    text: |-
      De bevoegdheden die Onze Minister van Financiën op grond van dit hoofdstuk heeft, met uitzondering van
      [artikel 27, derde lid][ref1], kunnen bij algemene maatregel van bestuur worden overgedragen aan personen die
      ingevolge [artikel 24, eerste lid][ref2], zijn aangewezen. Alsdan gelden de verplichtingen op grond van dit
      hoofdstuk jegens Onze Minister van Financiën als verplichtingen jegens de desbetreffende persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel24
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '27'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '24'
        hoofdstuk: '4'
  - number: '31.2'
    text: Aan de overdracht, bedoeld in het eerste lid, kunnen beperkingen worden gesteld en voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel31
  - number: '32'
    text: |-
      Indien een instelling niet voldoet aan haar verplichtingen ingevolge [artikel 16][ref1] of [17, tweede lid][ref2],
      kan de op grond van [artikel 24, eerste lid][ref3], aangewezen persoon door middel van het geven van een aanwijzing
      de instelling verplichten binnen een door de op grond van [artikel 24, eerste lid][ref4], aangewezen persoon
      gestelde termijn een bepaalde gedragslijn te volgen aangaande:


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0024282#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0024282#Artikel24
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0024282
        artikel: '24'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0024282
        artikel: '24'
        hoofdstuk: '4'
  - number: 32.a
    text: |-
      de ontwikkeling van interne procedures en controles ter voorkoming van witwassen en het financieren van terrorisme;
      en
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel32
  - number: 32.b
    text: |-
      de opleiding van werknemers als bedoeld in [artikel 35][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel35
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '35'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '33.1'
    text: |-
      Een instelling die op grond van deze wet de cliënt of zakelijke relatie heeft geïdentificeerd en zijn identiteit
      heeft geverifieerd, legt op toegankelijke wijze de volgende gegevens vast:
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel33
  - number: 33.1.a
    text: 'van natuurlijke personen:'
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel33
  - number: 33.1.a.1°
    text: |-
      de geslachtsnaam, de voornamen, de geboortedatum, het adres en de woonplaats dan wel plaats van vestiging van de
      cliënt alsmede van degene die namens die natuurlijke persoon optreedt of een afschrift van het document dat een
      persoonidentificerend nummer bevat en aan de hand waarvan de identificatie heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel33
  - number: 33.1.a.2°
    text: |-
      de aard, het nummer en de datum en plaats van uitgifte van het document met behulp waarvan de identiteit is
      geverifieerd;
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel33
  - number: 33.1.a.3°
    text: de aard van de dienstverlening;
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel33
  - number: 33.1.b
    text: 'van naar Nederlands recht opgerichte rechtspersonen:'
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel33
  - number: 33.1.b.1°
    text: |-
      de rechtsvorm, de statutaire naam, de handelsnaam, het adres met huisnummer, de postcode, de plaats van
      vestiging, het land van statutaire zetel en, indien de rechtspersoon bij een Kamer van Koophandel en Fabrieken is
      geregistreerd, het registratienummer bij de Kamer van Koophandel en Fabrieken en de plaats van vestiging van de
      Kamer van Koophandel en Fabrieken die het desbetreffende handelsregister houdt en de wijze waarop de identiteit
      is geverifieerd;
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel33
  - number: 33.1.b.2°
    text: |-
      van degenen die voor de rechtspersoon bij de instelling optreden: de geslachtsnaam, de voornamen en de
      geboortedatum;
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel33
  - number: 33.1.b.3°
    text: de aard van de dienstverlening;
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel33
  - number: 33.1.c
    text: 'van buitenlandse rechtspersonen:'
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel33
  - number: 33.1.c.1°
    text: de documenten aan de hand waarvan de identiteit is geverifieerd;
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel33
  - number: 33.1.c.2°
    text: |-
      van degenen die voor de rechtspersoon bij de instelling optreden: de geslachtsnaam, de voornamen en de
      geboortedatum;
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel33
  - number: 33.1.c.3°
    text: de aard van de dienstverlening.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel33
  - number: '33.2'
    text: |-
      Een instelling bewaart de in het eerste lid bedoelde gegevens op toegankelijke wijze gedurende vijf jaar na het
      tijdstip van het beëindigen van de zakelijke relatie of tot vijf jaar na het uitvoeren van de desbetreffende
      transactie.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel33
  - number: '34'
    text: |-
      Een instelling bewaart de gegevens, bedoeld in [artikel 16, tweede lid][ref1], op toegankelijke wijze gedurende
      vijf jaar na het tijdstip van het doen van de melding.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel16
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '35'
    text: |-
      Een instelling draagt er zorg voor dat haar werknemers, voor zover relevant voor de uitoefening van hun taken,
      bekend zijn met de bepalingen van deze wet en opleidingen genieten die hen in staat stellen een ongebruikelijke
      transactie te herkennen.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel35
  - number: '36'
    text: |-
      De rechtsgeldigheid van een privaatrechtelijke rechtshandeling van een instelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°][ref1], welke is verricht in strijd met de bij of krachtens deze wet
      gestelde regels is niet uit dien hoofde aantastbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '1'
        hoofdstuk: '1'
  - number: '37'
    text: |-
      Een ontheffing die is verleend op grond van
      [artikel 2, zesde lid, van de Wet identificatie bij dienstverlening][ref1], berust vanaf het tijdstip van
      inwerkingtreding van deze wet op [artikel 3, zevende lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006330#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel3
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006330
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '38.1'
    text: |-
      [Artikel 3, eerste lid][ref1], is niet van toepassing ten aanzien van cliënten die reeds op grond van de
      [Wet identificatie bij dienstverlening][ref2] zijn geïdentificeerd of ten aanzien van wie geen verplichting tot
      identificatie op grond van [die wet][ref3] was vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006330
      [ref3]: https://wetten.overheid.nl/BWBR0006330
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0006330
      - id: ref3
        bwb_id: BWBR0006330
  - number: '38.2'
    text: |-
      Gegevens van de in het eerste lid bedoelde personen die reeds op grond van de
      [Wet identificatie bij dienstverlening][ref1] zijn vastgelegd, worden geacht te zijn vastgelegd ingevolge deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006330
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0006330
  - number: '39'
    text: |-
      Een last onder dwangsom of een bestuurlijke boete die op het tijdstip van inwerkingtreding van
      deze wet was opgelegd ter zake van overtreding van een voorschrift, gesteld bij of krachtens de
      [Wet identificatie bij dienstverlening][ref1] of de [Wet melding ongebruikelijke transacties][ref2],
      wordt aangemerkt als een last onder dwangsom of een bestuurlijke boete als bedoeld in [artikel 26][ref3]
      onderscheidenlijk [27][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006330
      [ref2]: https://wetten.overheid.nl/BWBR0006331
      [ref3]: https://wetten.overheid.nl/BWBR0024282#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0024282#Artikel27
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0006330
      - id: ref2
        bwb_id: BWBR0006331
      - id: ref3
        bwb_id: BWBR0024282
        artikel: '26'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0024282
        artikel: '27'
        hoofdstuk: '4'
  - number: '40'
    text: |-
      Op bezwaar of beroep, ingesteld vóór het tijdstip van inwerkingtreding van deze wet tegen een besluit op grond van
      de [Wet identificatie bij dienstverlening][ref1] of de [Wet melding ongebruikelijke transacties][ref2], blijft het
      recht van toepassing dat gold voor het tijdstip van inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006330
      [ref2]: https://wetten.overheid.nl/BWBR0006331
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0006330
      - id: ref2
        bwb_id: BWBR0006331
  - number: '41.1'
    text: |-
      De personen die op grond van [artikel 24, eerste lid][ref1], zijn belast met het toezicht op de naleving van
      deze wet, kunnen na inwerkingtreding van deze wet tot drie jaren na de dag waarop de overtreding is begaan
      een bestuurlijke boete opleggen terzake van overtreding van een voorschrift gesteld bij of krachtens de
      [Wet identificatie bij dienstverlening][ref2] of de [Wet melding ongebruikelijke transacties][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0006330
      [ref3]: https://wetten.overheid.nl/BWBR0006331
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '24'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006330
      - id: ref3
        bwb_id: BWBR0006331
  - number: '41.2'
    text: |-
      Op een bestuurlijke boete als bedoeld in het eerste lid blijft het recht van toepassing dat gold voor het tijdstip
      van inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel41
  - number: '42'
    text: |-
      Een aanwijzing die is gegeven op grond van [artikel 17u van de Wet melding ongebruikelijke transacties][ref1],
      wordt vanaf het tijdstip van inwerkingtreding van deze wet aangemerkt als een aanwijzing als bedoeld in
      [artikel 32][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel17u
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel32
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0006331
        artikel: 17u
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '32'
        hoofdstuk: '4'
  - number: '49'
    text: |-
      De [Wet identificatie bij dienstverlening][ref1] en de [Wet melding ongebruikelijke transacties][ref2] worden
      ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006330
      [ref2]: https://wetten.overheid.nl/BWBR0006331
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0006330
      - id: ref2
        bwb_id: BWBR0006331
  - number: '50'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel50
  - number: '51'
    text: 'Deze wet wordt aangehaald als: Wet ter voorkoming van witwassen en financieren van terrorisme.'
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel51
