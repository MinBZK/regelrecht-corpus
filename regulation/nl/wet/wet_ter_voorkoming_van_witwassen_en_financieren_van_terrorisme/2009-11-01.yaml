  - number: '26.2'
    text: |-
      Het eerste lid is niet van toepassing ten aanzien van degene die, in geval van bezwaren tegen diens handelen of
      nalaten in de beroepsuitoefening, onderworpen is aan tuchtrechtspraak.
    url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#Artikel26
  - number: '27.1'
    text: |-
      Onze Minister van Financiën kan een bestuurlijke boete opleggen ter zake van overtreding
      van de [artikelen 2][ref1], [3, eerste tot en met derde en zevende lid][ref2],
      [4, eerste lid, tweede lid, tweede volzin, derde lid, tweede volzin, en vierde lid][ref3],
      [5, eerste en derde lid][ref4], [6, tweede lid][ref5], [7, tweede lid][ref6], [8][ref7], [10, tweede lid][ref8],
      [11][ref9], [16, eerste en tweede lid][ref10], [17, tweede lid][ref11], [23, eerste en tweede lid][ref12],
      [33][ref13], [34][ref14], en [35][ref15] van deze wet, [artikel 5:20 van de Algemene wet bestuursrecht][ref16] en
      het bepaalde in [Verordening (EG) nr. 2006/1781](33681R2006) van het Europees Parlement en de Raad van de Europese
      Unie van 15 november 2006 betreffende bij geldovermakingen te voegen informatie over de betaler (PbEU L 345).


