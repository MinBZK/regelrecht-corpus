preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Wet identificatie bij dienstverlening en de Wet
    melding ongebruikelijke transacties samen te voegen tot één wet, gericht op het voorkomen van het gebruik van het
    financiële stelsel voor het witwassen van geld en het financieren van terrorisme;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0024282/2009-11-01#ArtikelAanhef
