  - number: 32h
    text: |-
      1 Alvorens over te gaan tot openbaarmaking van gegevens die tot afzonderlijke personen herleidbaar zijn op grond
      van deze paragraaf, neemt de toezichthoudende autoriteit een besluit tot openbaarmaking. Dit besluit bevat de
      openbaar te maken gegevens en de wijze en termijn waarop de openbaarmaking zal plaatsvinden.

      2 Onverminderd [artikel 4:11 van de Algemene wet bestuursrecht][ref1] kan de toezichthoudende
      autoriteit bij het nemen van een besluit op grond van [artikel 32e][ref2] de toepassing van
      [artikel 4:8 van de Algemene wet bestuursrecht][ref3] achterwege laten, indien van de betrokken persoon geen adres
      bekend is en het adres ook niet met een redelijke inspanning kan worden verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel411
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel32e
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel48
    url: https://wetten.overheid.nl/BWBR0024282/2026-06-03#Artikel32h
    references:
      - id: ref1
