regulatory_layer: WET
publication_date: '2019-03-27'
valid_from: '2026-06-03'
bwb_id: BWBR0024282
url: https://wetten.overheid.nl/BWBR0024282/2026-06-03
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Wet identificatie bij dienstverlening en de Wet
    melding ongebruikelijke transacties samen te voegen tot één wet, gericht op het voorkomen van het gebruik van het
    financiële stelsel voor het witwassen van geld en het financieren van terrorisme;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0024282/2026-06-03#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *aanbieder van cryptoactivadiensten:* een aanbieder van cryptoactivadiensten als bedoeld in artikel 3, eerste
      lid, onderdeel 15, van [Verordening (EU) 2023/1114](32023R1114) van het Europees Parlement en de Raad van 31 mei
      2023 betreffende cryptoactivamarkten en tot wijziging van [Verordeningen (EU) nr. 1093/2010](32010R1093) en
      [(EU) nr. 1095/2010](32010R1095) en [Richtlijnen 2013/36/EU](32013L0036) en [(EU) 2019/1937](32019L1937) (PbEU
      2023, L 150) wanneer deze een of meer cryptoactivadiensten verricht als bedoeld in dat artikel, onderdeel 16, met
      uitzondering van het verlenen van advies over cryptoactiva bedoeld in dat onderdeel, onder h;
        - *bijkantoor:* duurzaam in een andere staat dan de staat van zetel aanwezig onderdeel zonder rechtspersoonlijkheid
      van een rechtspersoon of vennootschap;
        - *cliënt:* natuurlijke persoon of rechtspersoon met wie een zakelijke relatie wordt aangegaan of die een
      transactie laat uitvoeren;
        - *correspondentrelatie:* a. het verlenen van bankdiensten door een bank als correspondent aan een andere
      bank als respondent, met inbegrip van het verstrekken van een lopende of andere passiefrekening en aanverwante
      diensten, zoals contantenbeheer, internationale geldovermakingen, verwerking van cheques, transitrekeningen en
      valutawisseldiensten; of b. de betrekkingen tussen banken en andere financiële ondernemingen, banken onderling en
      andere financiële ondernemingen onderling, inclusief wanneer soortgelijke diensten door een correspondentinstelling
      aan een respondentinstelling worden verleend en met inbegrip van betrekkingen die zijn aangegaan voor
      effectentransacties of geldovermakingen, of betrekkingen die zijn aangegaan voor cryptoactivatransacties of
      overdrachten van cryptoactiva;
        - *cryptoactivum:* een cryptoactivum als bedoeld in artikel 3, eerste lid, onderdeel 5, van [Verordening (EU)
      2023/1114](32023R1114) van het Europees Parlement en de Raad van 31 mei 2023 betreffende cryptoactivamarkten en tot
      wijziging van [Verordeningen (EU) nr. 1093/2010](32010R1093) en [(EU) nr. 1095/2010](32010R1095) en [Richtlijnen
      2013/36/EU](32013L0036) en [(EU) 2019/1937](32019L1937) (PbEU 2023, L 150) behalve wanneer het onder de in artikel
      2, tweede, derde en vierde lid, van die verordening genoemde categorieën valt of anderszins als geldmiddel wordt
      aangemerkt;
        - *de Nederlandsche Bank:* de Nederlandsche Bank N.V.;
        - *dochteronderneming:* dochteronderneming als bedoeld in artikel 2, tiende lid, van de richtlijn jaarrekening;
        - *Europese Bankautoriteit:* de Europese toezichthoudende autoriteit opgericht bij verordening (EU) nr. 1093/2010
      van het Europees parlement en de Raad van 24 november 2010 tot oprichting van een Europese toezichthoudende
      autoriteit (Europese Bankautoriteit), tot wijziging van Besluit nr. 716/2009/EG en tot intrekking van Besluit
      2009/78/EG van de Commissie (*PbEU* 2010, L 331);
        - *Europese toezichthoudende autoriteiten:* de Europese Autoriteit voor effecten en markten, de Europese Autoriteit
      voor verzekeringen en bedrijfspensioenen en de Europese Bankautoriteit;
        - *elektronisch geld:* elektronisch geld als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1];
        - *familielid van een politiek prominente persoon:* natuurlijke persoon die een bij algemene maatregel van bestuur
      aan te wijzen familierelatie heeft met een politiek prominente persoon;
        - *financieren van terrorisme:* de gedraging strafbaar gesteld in
      [artikel 421, eerste lid, van het Wetboek van Strafrecht][ref2];
        - *Financiële inlichtingen eenheid:* Financiële inlichtingen eenheid, bedoeld in [artikel 12, eerste lid][ref3];
        - *gekwalificeerde deelneming:* rechtstreeks of middellijk belang van ten minste tien procent van het geplaatste
      aandelenkapitaal of een daarmee vergelijkbaar belang, of het rechtstreeks of middellijk kunnen uitoefenen van ten
      minste tien procent van de stemrechten of een daarmee vergelijkbare zeggenschap;
        - *groep:* groep van ondernemingen bestaande uit een moederonderneming, haar dochterondernemingen en de entiteiten
      waarin de moederonderneming of haar dochterondernemingen een deelneming hebben als bedoeld in artikel 2, tweede
      lid, van de richtlijn jaarrekening, alsook ondernemingen die met elkaar verbonden zijn door een betrekking als
      bedoeld in artikel 22 van de richtlijn jaarrekening;
        - *hoger leidinggevend personeel:* a. personen die het dagelijks beleid van een instelling bepalen; of b. personen
      werkzaam onder verantwoordelijkheid van een instelling, die een leidinggevende functie vervullen direct onder het
      echelon van de dagelijks beleidsbepalers en die verantwoordelijk zijn voor natuurlijke personen wier werkzaamheden
      van invloed zijn op de blootstelling van een instelling aan de risico’s op witwassen en het financieren van
      terrorisme;
        - *identificeren:* opgave van de identiteit laten doen;
        - *instelling:* bank, andere financiële onderneming, of natuurlijke persoon, rechtspersoon of vennootschap
      handelend in het kader van zijn beroepsactiviteiten, waarop deze wet ingevolge [artikel 1a][ref4] van toepassing
      is;
        - *lidstaat:* een lidstaat van de Europese Unie alsmede een staat, niet zijnde een lidstaat van de Europese Unie,
      die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte;
        - *melding:* melding als bedoeld in [artikel 16, eerste lid][ref5];
        - *moederonderneming:* moederonderneming als bedoeld in artikel 2, negende lid, van de richtlijn jaarrekening;
        - *nationale risicobeoordeling:* verslag van de identificatie, analyse en beoordeling van de nationale risico’s op
      witwassen en het financieren van terrorisme als bedoeld in [artikel 1g][ref6];
        - *ongebruikelijke transactie:* transactie die op grond van de indicatoren bedoeld in
      [artikel 15, eerste lid][ref7], als ongebruikelijk is aan te merken;
        - *persoon bekend als naaste geassocieerde van een politiek prominente persoon:* natuurlijke persoon die behoort
      tot een bij algemene maatregel van bestuur aan te wijzen categorie personen;
        - *persoonsgegeven:* persoonsgegeven als bedoeld in artikel 4, eerste lid, van de Algemene verordening
      gegevensbescherming;
        - *platform voor de veiling van emissierechten:* platform voor de veiling van emissierechten als bedoeld in
      hoofdstuk VII van de verordening inzake de veiling van broeikasgasemissierechten;
        - *politiek prominente persoon:* natuurlijke persoon die een bij algemene maatregel van bestuur aan te wijzen
      prominente publieke functie bekleedt of heeft bekleed;
        - *richtlijn betaaldiensten:* richtlijn (EU) 2015/2366 van het Europees Parlement en de Raad van 25 november 2015
      betreffende betalingsdiensten in de interne markt, houdende wijziging van de [Richtlijnen 2002/65/EG](32002L0065),
      [2009/110/EG](32009L0110) en [2013/36](32013L0036)/EU en Verordening (EU) nr. [1093/2010](32993L2010) en houdende
      intrekking van [Richtlijn 2007/64](32007L0064) (PbEU 2015, L 337);
        - *richtlijn jaarrekening:* [richtlijn 2013/34](32013L0034)/EU van het Europees Parlement en de Raad van 26 juni
      2013 betreffende de jaarlijkse financiële overzichten, geconsolideerde financiële overzichten en aanverwante
      verslagen van bepaalde ondernemingsvormen, tot wijziging van [Richtlijn 2006/43/EG](32006L0043) van het het
      Europees Parlement en de Raad en tot intrekking van [Richtlijnen 78/660/EEG](31978L0660) en [83/349/EEG]
      (31983L0349) van de Raad (PbEU 2013, L 182);
        - *richtlijn kapitaalvereisten:* [richtlijn 2013/36](32013L0036)/EU van het Europees Parlement en de Raad
      van 26 juni 2013 betreffende toegang tot het bedrijf van kredietinstellingen en het prudentieel toezicht op
      kredietinstellingen en beleggingsondernemingen, tot wijziging van [Richtlijn 2002/87/EG](32002L0087) en tot
      intrekking van de [Richtlijnen 2006/48/EG](32006L0048) en [2006/49/EG](32006L0049) (PbEU 2013, L 176);
        - *shellbank:* bank of andere financiële onderneming als bedoeld in [artikel 1a, tweede en derde lid][ref8], of
      onderneming die gelijkwaardige activiteiten als die van een bank of andere financiële onderneming verricht, die
      is opgericht in een staat waar zij geen fysieke aanwezigheid heeft en die geen onderdeel uitmaakt van een onder
      toezicht staande groep;
        - *supranationale risicobeoordeling:* door de Europese Commissie beschikbaar gesteld verslag van de identificatie,
      analyse en beoordeling van de risico’s op witwassen en het financieren van terrorisme die van invloed zijn op de
      interne markt en verband houden met grensoverschrijdende activiteiten als bedoeld in artikel 6 van de vierde anti-
      witwasrichtlijn;
        - *toezichthoudende autoriteit:* het ingevolge [artikel 1d][ref9] bevoegde bestuursorgaan;
        - *transactie:* handeling of samenstel van handelingen van of ten behoeve van een cliënt waarvan de instelling ten
      behoeve van haar dienstverlening aan die cliënt heeft kennisgenomen;
        - *transitrekening:* bankrekening die bij een in Nederland gevestigde bank wordt aangehouden door een bank
      gevestigd in een staat die geen lidstaat is en die door een cliënt van laatstbedoelde bank gedebiteerd of
      gecrediteerd kan worden zonder tussenkomst van de in Nederland gevestigde bank;
        - *uiteindelijk belanghebbende:* natuurlijke persoon die de uiteindelijke eigenaar is van of zeggenschap heeft over
      een cliënt, dan wel de natuurlijke persoon voor wiens rekening een transactie of activiteit wordt verricht;
        - *verifiëren:* vaststellen dat de opgegeven identiteit overeenkomt met de werkelijke identiteit;
        - *verordening betreffende bij geldovermakingen en overdrachten van cryptoactiva te voegen informatie:*
      [Verordening (EU) 2023/1113](32023R1113) van het Europees Parlement en de Raad van 31 mei 2023 betreffende bij
      geldovermakingen en overdrachten van bepaalde cryptoactiva te voegen informatie en tot wijziging van [Richtlijn
      (EU) 2015/849](32015L0849) (PbEU 2023, L 150);
        - *verordening inzake de veiling van broeikasgasemissierechten:* verordening (EU) nr. 1031/2010 van de
      Europese Commissie van 12 november 2010 inzake de tijdstippen, het beheer en andere aspecten van de veiling van
      broeikasgasemissierechten overeenkomstig [Richtlijn 2003/87/EG](32003L0087) van het Europees Parlement en de Raad
      tot vaststelling van een regeling voor de handel in broeikasgasemissierechten binnen de Gemeenschap (PbEU 2010,
      L 302);
        - *vierde anti-witwasrichtlijn:* [richtlijn 2015/849](32015L0849) van het Europees Parlement en de Raad van
      20 mei 2015 inzake de voorkoming van het gebruik van het financiële stelsel voor het witwassen van geld of
      terrorismefinanciering, tot wijziging van Verordening (EU) nr. 648/2012 van het Europees Parlement en de Raad en
      tot intrekking van [Richtlijn 2005/60](32005L0060) van het Europees Parlement en de Raad en [Richtlijn 2006/70/EG]
      (32006L0070) van de Commissie (PbEU 2015, L 141);
        - *witwassen:* de gedragingen strafbaar gesteld in de [artikelen 420bis][ref10], [420bis.1][ref11],
      [420ter][ref12], [420quater][ref13] en [420quater.1 van het Wetboek van strafrecht][ref14];
        - *zakelijke relatie:* zakelijke, professionele, of commerciële relatie tussen een instelling en een natuurlijke
      persoon, rechtspersoon of vennootschap, die verband houdt met de professionele activiteiten van die instelling en
      waarvan op het tijdstip dat het contact wordt gelegd, wordt aangenomen dat deze enige tijd zal duren;
        - *zelfgehost adres:* een zelfgehost adres als bedoeld in artikel 3, eerste lid, onderdeel 20, van de verordening
      betreffende bij geldovermakingen en overdrachten van cryptoactiva te voegen informatie.

      2 In deze wet en de daarop berustende bepalingen wordt onder de begrippen «trust», «trustee» en «insteller»
      verstaan hetgeen daaronder in het op 1 juli 1985 te ’s-Gravenhage tot stand gekomen Verdrag inzake het recht dat
      toepasselijk is op trusts en inzake de erkenning van trusts (Trb. 1985, 141) wordt verstaan.

      3 Bij algemene maatregel van bestuur worden de categorieën natuurlijke personen aangewezen die in elk geval moeten
      worden aangemerkt als uiteindelijk belanghebbende als bedoeld in het eerste lid.


