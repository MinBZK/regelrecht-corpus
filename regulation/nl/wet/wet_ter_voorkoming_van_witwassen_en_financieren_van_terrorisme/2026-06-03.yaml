  - number: 32a
    text: |-
      De toezichthoudende autoriteit kan in afwijking van [artikel 31][ref1] of [32][ref2] een bestuurlijke boete
      opleggen van ten hoogste tweemaal het bedrag van het voordeel dat de overtreder door de overtreding heeft
      verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel32
    url: https://wetten.overheid.nl/BWBR0024282/2026-06-03#Artikel32a
