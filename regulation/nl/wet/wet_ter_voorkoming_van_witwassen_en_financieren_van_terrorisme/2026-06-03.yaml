  - number: 22a
    text: |-
      1 De toezichthoudende autoriteit is in afwijking van [artikel 22, eerste lid][ref1], bevoegd gegevens of
      inlichtingen die ingevolge deze wet zijn verstrekt of ontvangen of van een buitenlandse toezichthoudende instantie
      zijn ontvangen, te verstrekken aan:

      a. een andere toezichthoudende autoriteit of aan een buitenlandse toezichthoudende instantie;

      b. de Belastingdienst, de Fiscale Inlichtingen- en Opsporingsdienst, de Nationale Politie, de Financiële
      Inlichtingen Eenheid of het Openbaar Ministerie, voor zover de gegevens of inlichtingen dienstig zijn voor de
      uitoefening van hun wettelijke taken;

      c. een tijdelijke enquêtecommissie van het Europees Parlement, bedoeld in artikel 226 van het Verdrag betreffende
      de werking van de Europese Unie;

      d. een commissie, als bedoeld in [artikel 2, tweede lid, van de Wet op de parlementaire enquête 2008][ref2], voor
      zover de gegevens of inlichtingen naar het oordeel van die commissie noodzakelijk zijn voor de vervulling van haar
      taak;

      e. de Algemene Rekenkamer, voor zover de gegevens of inlichtingen naar het oordeel van de
      Algemene Rekenkamer noodzakelijk zijn voor de uitoefening van haar wettelijke taak op grond van
      [artikel 7.24 van de Comptabiliteitswet 2016][ref3].

      2 De in het eerste lid bedoelde informatie wordt niet verstrekt indien:

      a. het doel waarvoor de gegevens of inlichtingen zullen worden gebruikt onvoldoende bepaald is;

      b. het beoogde gebruik van de gegevens of inlichtingen niet past in het kader van het toezicht op wetgeving ter
      voorkoming van witwassen en financieren van terrorisme;

      c. de verstrekking van de gegevens of inlichtingen zich niet zou verdragen met de Nederlandse wet of de openbare
      orde;

      d. de geheimhouding van de gegevens of inlichtingen niet in voldoende mate is gewaarborgd;

      e. de verstrekking van de gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met de belangen
      die deze wet beoogt te beschermen; of

      f. onvoldoende is gewaarborgd dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor deze worden verstrekt.

      3 Voor zover de gegevens of inlichtingen, bedoeld in het eerste lid, zijn verkregen van een buitenlandse
      toezichthoudende instantie, verstrekt de toezichthoudende autoriteit deze niet aan een andere toezichthoudende
      instantie of aan een andere buitenlandse toezichthoudende instantie, tenzij de buitenlandse toezichthoudende
      instantie waarvan de gegevens of inlichtingen zijn verkregen uitdrukkelijk heeft ingestemd met de verstrekking van
      de gegevens of inlichtingen en in voorkomend geval heeft ingestemd met het gebruik voor een ander doel dan waarvoor
      de gegevens of inlichtingen zijn verstrekt.

      4 Indien een buitenlandse toezichthoudende instantie aan de toezichthoudende autoriteit die de gegevens of
      inlichtingen op grond van het tweede of derde lid heeft verstrekt, verzoekt om die gegevens of inlichtingen te
      mogen gebruiken voor een ander doel dan waarvoor zij zijn verstrekt, willigt de toezichthoudende autoriteit dat
      verzoek slechts in:

      a. indien het beoogde gebruik niet in strijd is met het tweede of derde lid of voor zover die toezichthoudende
      instantie op een andere wijze dan in deze wet voorzien vanuit Nederland met inachtneming van de daarvoor geldende
      wettelijke procedures voor dat ander doel de beschikking over die gegevens of inlichtingen zou kunnen verkrijgen;
      en

      b. na overleg met Onze Minister van Justitie en Veiligheid indien het in de aanhef bedoelde verzoek betrekking
      heeft op een onderzoek naar strafbare feiten.

      5 De partijen, bedoeld in het eerste lid, onderdeel c tot en met e, zijn verplicht tot geheimhouding van de op
      grond van het eerste lid ontvangen vertrouwelijke gegevens of inlichtingen en maken die slechts openbaar indien
      deze niet herleid kunnen worden tot afzonderlijke personen.

      6 Voor de toepassing van dit artikel wordt onder toezichthoudende autoriteit verstaan:

      a. de toezichthoudende autoriteit, bedoeld in [artikel 1d, eerste lid, onderdeel e of f][ref4];

      b. de toezichthoudende autoriteit, bedoeld in [artikel 1d, eerste lid, onderdeel c][ref5], voor zover het betreft
      de instellingen als bedoeld in [artikel 1a, vierde lid, onderdeel a, b of e][ref6];

      c. de toezichthouder, bedoeld in [artikel 1, eerste lid, van de Wet toezicht trustkantoren 2018][ref7].


