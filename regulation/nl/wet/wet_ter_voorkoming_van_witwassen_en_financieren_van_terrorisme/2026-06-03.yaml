      1 Een instelling doet melding aan de Kamer van Koophandel van iedere discrepantie die zij aantreft
      tussen een gegeven omtrent een uiteindelijk belanghebbende dat zij verstrekt heeft gekregen uit het
      handelsregister, bedoeld in [artikel 2 van de Handelsregisterwet 2007][ref1], of uit het register, bedoeld in
      __REF001___________________________________________________________________________________________________________
      ___________________, en de informatie over die uiteindelijk belanghebbende waarover zij uit anderen hoofde
      beschikt.

      2 Op een melding als bedoeld in het eerste lid welke betrekking heeft op gegevens uit het handelsregister, bedoeld
      in [artikel 2 van de Handelsregisterwet 2007][ref3] is het bepaalde bij of krachtens de [artikelen 33][ref4],
      [34, tweede en derde lid][ref5], [35][ref6] en [36 van de Handelsregisterwet 2007][ref7] van toepassing.

      3 Het eerste lid is niet van toepassing indien een instelling op grond van [artikel 16][ref8] een verrichte of
      voorgenomen ongebruikelijke transactie meldt aan de Financiële inlichtingen eenheid.

      4 Ten behoeve van de naleving van de verplichting, bedoeld in het eerste lid, zijn de instellingen, bedoeld
      in [artikel 1a, vierde lid, onderdeel c][ref9], niet gehouden aan de geheimhoudingsplicht, bedoeld in
      [artikel 11a van de Advocatenwet][ref10], en zijn de instellingen, bedoeld in artikel 1a, vierde lid, onderdeel d,
      niet gehouden aan de geheimhoudingsplicht in [artikel 22 van de Wet op het notarisambt][ref11].

      5 Bij een melding als bedoeld in het eerste lid verstrekt een instelling de gegevens, bedoeld
      in [artikel 15a, tweede lid, onderdelen a en e, van de Handelsregisterwet 2007][ref12] dan wel
      __REF001___________________________________________________________________________________________________________
      ___________________________________________________, waarover zij beschikt en kan zij de bescheiden, bedoeld in
      artikel 15a, derde lid, van de Handelsregisterwet 2007 dan wel artikel 5, vierde lid, van de Implementatiewet
      registratie uiteindelijk belanghebbenden van trusts en soortgelijke juridische constructies, verstrekken waarover
      zij beschikt.

      6 De Kamer van Koophandel bepaalt de wijze waarop een melding als bedoeld in het eerste lid wordt gedaan.


