  - number: '28'
    text: |-
      De toezichthoudende autoriteit kan een ieder die niet voldoet aan een ingevolge deze wet op hem rustende
      verplichting een aanwijzing geven om binnen een door de toezichthoudende autoriteit gestelde redelijke termijn ten
      aanzien van in de aanwijzingsbeschikking aan te geven punten een bepaalde gedragslijn te volgen.
    url: https://wetten.overheid.nl/BWBR0024282/2026-06-03#Artikel28
  - number: '29'
    text: |-
      De toezichthoudende autoriteit kan een last onder dwangsom opleggen ter zake van:

      a. overtreding van de bij of krachtens de [artikelen 1e][ref1], [1f][ref2], [2][ref3], [2a][ref4],
      [2b][ref5], [2c][ref6], [2d][ref7], [2e, eerste en tweede lid][ref8], [2f, eerste, tweede en vierde lid][ref9],
      [3, eerste tot en met negende en elfde lid][ref10], [3a, eerste en tweede lid][ref11],
      [4, eerste lid, tweede lid, tweede volzin, en derde lid][ref12], [5, eerste, derde en vijfde lid][ref13],
      [6][ref14], [7, tweede lid][ref15], [8][ref16], [9][ref17], [10, tweede lid][ref18],
      [10c, eerste lid][ref19], [11][ref20], [16][ref21], [17, tweede lid][ref22], [20a][ref23], [20b][ref24],
      [23, eerste, tweede en vierde lid][ref25], [23a][ref26], [33][ref27], [34][ref28], [35][ref29], [35a][ref30]
      en [38][ref31] van deze wet gestelde regels;

      b. overtreding van [artikel 1a, zesde lid][ref32], voor zover de overtreding betrekking heeft op de regels die bij
      of krachtens de in onderdeel a genoemde artikelen zijn gesteld;

      c. overtreding van de bij of krachtens de artikelen 4 tot en met 24 en artikel 26, eerste lid, van de verordening
      betreffende bij geldovermakingen en overdrachten van cryptoactiva te voegen informatie gestelde regels;

      d. overtreding van de bij of krachtens de verordening inzake de veiling van broeikasgasemissierechten gestelde
      regels;

      e. overtreding van de bij of krachtens een bij algemene maatregel van bestuur aangewezen verordening als bedoeld in
      [artikel 1d, vierde lid][ref33], gestelde regels;

      f. het geen gevolg geven dan wel niet tijdig of onvolledig gevolg geven aan een aanwijzing als bedoeld in
      [artikel 28][ref34].


