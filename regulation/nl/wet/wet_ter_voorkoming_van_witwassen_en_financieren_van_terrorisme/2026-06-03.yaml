      2 Een uiteindelijk belanghebbende verschaft de vennootschap of andere juridische entiteit alle informatie die
      noodzakelijk is om te voldoen aan het eerste lid.

      3 Trustees winnen de gegevens en de bescheiden, bedoeld in
