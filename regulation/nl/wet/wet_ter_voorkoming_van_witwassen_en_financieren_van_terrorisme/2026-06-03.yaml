  - number: '27'
    text: |-
      1 De toezichthoudende autoriteit werkt samen met de toezichthoudende instanties van andere lidstaten, voor zover
      dat voor de vervulling van haar taak op grond van deze wet of de vervulling van de taken van die instanties nodig
      is.

      2 De Nederlandsche Bank N.V. en de Stichting Autoriteit Financiële Markten, voor zover op grond van
      [artikel 1d, eerste lid, onderdeel a en b][ref1], belast met de uitvoering en handhaving van deze wet, verstrekken
      de Europese Bankautoriteit alle informatie die voor de vervulling van de taken van die autoriteiten nodig is.

      3 De Nederlandsche Bank N.V. en de Stichting Autoriteit Financiële Markten informeren de Europese Bankautoriteit
      voorts over een maatregel die ingevolge [paragraaf 4.2][ref2] van deze wet is opgelegd aan een bank of andere
      financiële onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1d
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Hoofdstuk4
