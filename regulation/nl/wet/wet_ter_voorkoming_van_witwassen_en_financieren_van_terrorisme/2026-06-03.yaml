  - number: 22b
    text: |-
      1 De toezichthoudende autoriteit, bedoeld in [artikel 1d, eerste lid, onderdelen a en b][ref1], is in afwijking van
      [artikel 22, eerste lid][ref2], bevoegd gegevens of inlichtingen die ingevolge deze wet zijn verstrekt of ontvangen
      of van een buitenlandse toezichthoudende instantie zijn ontvangen, te verstrekken aan:

      a. een andere toezichthoudende autoriteit of een toezichthoudende instantie die belast is met het toezicht op de
      instellingen, bedoeld in [artikel 1a, tweede of derde lid][ref3];

      b. een buitenlandse toezichthoudende instantie in een andere lidstaat die is belast met het toezicht op de
      instellingen, bedoeld in [artikel 1a, eerste of tweede lid][ref4], of een buitenlandse toezichthoudende instantie
      in een derde land die belast is met het toezicht op deze instellingen en waarmee een samenwerkingsovereenkomst is
      gesloten als bedoeld in artikel 57bis, vijfde lid, van de vierde anti-witwasrichtlijn;

      c. de Europese Centrale Bank;

      d. de instanties genoemd in [artikel 22a, eerste lid, onderdelen b tot en met e][ref5].

      2 De in het eerste lid bedoelde informatie wordt niet verstrekt indien:

      a. het doel waarvoor de gegevens of inlichtingen zullen worden gebruikt onvoldoende bepaald is;

      b. het beoogde gebruik van de gegevens of inlichtingen niet past in het kader van deze wet, prudentiële regelgeving
      of het toezicht op de instellingen, bedoeld in [artikel 1a, tweede of derde lid][ref6];

      c. de verstrekking van de gegevens of inlichtingen zich niet zou verdragen met de Nederlandse wet of de openbare
      orde;

      d. de geheimhouding van de gegevens of inlichtingen niet in voldoende mate is gewaarborgd;

      e. de verstrekking van de gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met de belangen
      die deze wet beoogt te beschermen; of

      f. onvoldoende is gewaarborgd dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor deze worden verstrekt.

      3 [Artikel 22a, derde tot en met het vijfde lid][ref7], is van overeenkomstige toepassing.


