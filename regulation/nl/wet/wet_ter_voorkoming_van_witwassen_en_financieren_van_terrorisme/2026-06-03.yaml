      1 Vennootschappen en andere juridische entiteiten winnen de gegevens en de bescheiden, bedoeld in
      [artikel 15a, tweede, onderscheidenlijk derde lid, van de Handelsregisterwet 2007][ref1], over wie hun uiteindelijk
