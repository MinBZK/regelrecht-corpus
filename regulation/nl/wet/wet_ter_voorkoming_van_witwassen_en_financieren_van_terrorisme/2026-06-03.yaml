  - number: 2f
    text: |-
      1 Een instelling die deel uitmaakt van een groep past de op het niveau van de groep geldende gedragslijnen en
      procedures op effectieve wijze toe, voor zover die voldoen aan de bij of krachtens deze wet gestelde regels.

      2 Een instelling draagt tevens zorg voor een effectieve toepassing van de in het eerste lid bedoelde gedragslijnen
      en procedures door haar bijkantoren of meerderheidsdochterondernemingen met zetel buiten Nederland.

      3 Onder de gedragslijnen en procedures, bedoeld in het eerste en tweede lid, worden in ieder geval verstaan
      gedragslijnen en procedures inzake gegevensbescherming en gedragslijnen en procedures voor het delen van informatie
      binnen de groep, voor zover deze gegevens en informatie betrekking hebben op het voorkomen van witwassen en
      financieren van terrorisme.

      4 Indien het recht van een betrokken staat die geen lidstaat is in de weg staat aan de toepassing van het tweede
      lid, stelt de instelling de toezichthoudende autoriteit hiervan in kennis en ziet de instelling er op toe dat
      het bijkantoor of de meerderheidsdochteronderneming aanvullende maatregelen neemt om het risico op witwassen en
      financieren van terrorisme doeltreffend te beheersen. Indien van toepassing neemt zij hierbij het bepaalde op grond
      van artikel 45, zevende lid, van de vierde anti-witwasrichtlijn in acht.

      5 Indien de aanvullende maatregelen, bedoeld in het vierde lid, onvoldoende zijn, neemt de toezichthoudende
      autoriteit aanvullende toezichtmaatregelen, waarbij onder meer wordt verlangd dat de groep geen zakelijke relaties
      aangaat of die relaties beëindigt en geen transacties uitvoert, dan wel waarbij de groep, indien nodig, wordt
      verzocht haar bedrijfsactiviteiten in de betrokken staat te beëindigen.
    url: https://wetten.overheid.nl/BWBR0024282/2026-06-03#Artikel2f
  - number: '3'
    text: |-
      1 Een instelling verricht ter voorkoming van witwassen en financieren van terrorisme cliëntenonderzoek.

      2 Het cliëntenonderzoek stelt de instelling in staat om:

      a. de cliënt te identificeren en diens identiteit te verifiëren;

      b. de uiteindelijk belanghebbende van de cliënt te identificeren en redelijke maatregelen te nemen om zijn
      identiteit te verifiëren, indien de cliënt een rechtspersoon is, redelijke maatregelen te nemen om inzicht te
      verwerven in de eigendoms- en zeggenschapsstructuur van de cliënt, en indien de uiteindelijk belanghebbende lid is
      van het hoger leidinggevend personeel, noodzakelijke redelijke maatregelen te nemen om de identiteit te verifiëren
      van de natuurlijke persoon die lid is van het hoger leidinggevend personeel, waarbij de genomen maatregelen en de
      ondervonden moeilijkheden tijdens het verificatieproces worden vastgelegd;

      c. het doel en de beoogde aard van de zakelijke relatie vast te stellen;

      d. een voortdurende controle op de zakelijke relatie en de tijdens de duur van deze relatie verrichte transacties
      uit te oefenen, teneinde te verzekeren dat deze overeenkomen met de kennis die de instelling heeft van de cliënt
      en diens risicoprofiel, met zo nodig een onderzoek naar de bron van de middelen die bij de zakelijke relatie of de
      transactie gebruikt worden;

      e. vast te stellen of de natuurlijke persoon die de cliënt vertegenwoordigt daartoe bevoegd is en in voorkomend
      geval de natuurlijke persoon te identificeren en diens identiteit te verifiëren;

      f. redelijke maatregelen te nemen om te verifiëren of de cliënt ten behoeve van zichzelf optreedt dan wel ten
      behoeve van een derde.

      3 Indien een cliënt handelt als trustee van een trust of ten behoeve van een andere juridische constructie
      strekt het in het eerste lid bedoelde cliëntenonderzoek zich tevens uit tot de trust of juridische constructie,
      met overeenkomstige toepassing van de maatregelen, bedoeld in het tweede lid. Het cliëntenonderzoek stelt
      de instelling in dat geval eveneens in staat om vast te stellen of de cliënt bevoegd is op te treden als
      trustee van een trust of ten behoeve van een andere juridische constructie. Indien een cliënt bij het aangaan
      van een zakelijke relatie of het verrichten van een incidentele transactie boven de drempels bedoeld in
      [artikel 3, vijfde lid, onderdelen b en g, zesde lid of zevende lid][ref1], handelt in de hoedanigheid van trustee,
      dan stelt de cliënt de instelling met spoed op de hoogte van die hoedanigheid en verstrekt aan de instelling de in
      __REF001___________________________________________________________________________________________________________
      ___________________ bedoelde gegevens en bescheiden.

      4 Indien een cliënt optreedt als vennoot van een personenvennootschap strekt het in het eerste lid bedoelde
      cliëntenonderzoek zich tevens uit tot de personenvennootschap, met overeenkomstige toepassing van de maatregelen,
      bedoeld in het tweede lid. Het cliëntenonderzoek stelt de instelling in dat geval eveneens in staat om vast te
      stellen of de natuurlijke persoon die de vennoten in de personenvennootschap vertegenwoordigt daartoe bevoegd is
      en, in voorkomend geval, om die persoon te identificeren en diens identiteit te verifiëren.

      5 Een instelling verricht het cliëntenonderzoek in de volgende gevallen:

      a. indien zij in of vanuit Nederland een zakelijke relatie aangaat;

      b. indien zij in of vanuit Nederland een incidentele transactie verricht ten behoeve van de cliënt van ten minste
      € 15.000, of twee of meer transacties waartussen een verband bestaat met een gezamenlijke waarde van ten minste
      € 15.000;

      c. indien er indicaties zijn dat de cliënt betrokken is bij witwassen of financieren van terrorisme;

      d. indien zij twijfelt aan de juistheid of volledigheid van eerder verkregen gegevens van de cliënt;

      e. indien het risico van betrokkenheid van een bestaande cliënt bij witwassen of financieren van terrorisme daartoe
      aanleiding geeft;

      f. indien er, gelet op de staat waarin een cliënt woonachtig of gevestigd is of zijn zetel heeft, een verhoogd
      risico op witwassen of financieren van terrorisme bestaat;

      g. indien zij in of vanuit Nederland een incidentele transactie verricht ten behoeve van de cliënt of de
      trust, inhoudende een geldovermaking als bedoeld in artikel 3, negende lid, van de verordening betreffende bij
      geldovermakingen en overdrachten van cryptoactiva te voegen informatie, ten bedrage van ten minste € 1.000.

      6 In afwijking van het vijfde lid, onderdeel b, verricht een instelling als bedoeld in
      [artikel 1a, vierde lid, onderdeel l][ref3], cliëntenonderzoek indien zij in of vanuit Nederland een incidentele
      transactie verricht ten behoeve van de cliënt van ten minste € 2.000,– bij het ophalen van een prijs of het aangaan
      van een weddenschap, of twee of meer transacties waartussen een verband bestaat met een gezamenlijke waarde van ten
      minste € 2.000,– of meer.

      7 Een instelling stemt het cliëntenonderzoek aantoonbaar af op de risicogevoeligheid voor witwassen of financiering
      van terrorisme van het type cliënt, zakelijke relatie, product of transactie.

      8 Een instelling houdt bij het bepalen van de risicogevoeligheid, bedoeld in het zevende lid, tenminste rekening
      met de in bijlage I bij de vierde anti-witwasrichtlijn genoemde risicovariabelen.

      9 Het eerste tot en met het achtste lid en het tiende lid zijn niet van toepassing op een instelling als bedoeld in
      [artikel 1a, vierde lid, onderdeel m][ref4].

      10 Een instelling neemt redelijke maatregelen om ervoor te zorgen dat de gegevens die ingevolge het tweede tot
      en met vierde lid zijn verzameld over daar bedoelde personen, actueel gehouden worden. De gegevens worden in elk
      geval geactualiseerd indien relevante omstandigheden van de cliënt veranderen, een instelling op grond van deze wet
      verplicht is tot het opnemen van contact met de cliënt om informatie met betrekking tot de uiteindelijk begunstigde
      te evalueren of de instelling daartoe verplicht is op grond van [Richtlijn 2011/16](32011L0016)/EU van de Raad van
      15 februari 2011 betreffende de administratieve samenwerking op het gebied van de belastingen en tot intrekking van
      [Richtlijn 77/79/EEG](31977L0079) (PbEU 2011, L 64).

      11 In dit artikel wordt verstaan onder personenvennootschap: een maatschap als bedoeld in
      [artikel 1655 van boek 7A van het Burgerlijk Wetboek][ref5], een vennootschap onder firma als bedoeld
      in [artikel 16 van het Wetboek van Koophandel][ref6] en een commanditaire vennootschap als bedoeld in
      [artikel 19 van het Wetboek van Koophandel][ref7], alsmede een maatschap of vennootschap naar buitenlands recht die
      met een van deze rechtsvormen vergelijkbaar is.

      12 Voor de toepassing van het tweede lid wordt, indien de in het eerste lid bedoelde verplichting rust op
      een tussenpersoon als bedoeld in [artikel 1a, vierde lid, onderdeel h][ref8], onder cliënt mede verstaan:
      de wederpartij van de cliënt bij een door bemiddeling van de tussenpersoon tot stand gebrachte en gesloten
      overeenkomst inzake onroerende zaken en rechten waaraan onroerende zaken zijn onderworpen.

      13 In geval van een trustkantoor als bedoeld in [artikel 1a, vierde lid, onderdeel f][ref9],
      dat diensten verleent als bedoeld in de begripsomschrijving van trustdienst in
      [artikel 1, eerste lid, van de Wet toezicht trustkantoren 2018][ref10]:

      a. wordt onder cliëntenonderzoek in de zin van het eerste lid verstaan de maatregelen die zijn voorgeschreven
      krachtens [hoofdstuk 4 van de Wet toezicht trustkantoren 2018][ref11] en die worden uitgevoerd voorafgaand aan of
      bij de uitvoering van een dienst of het aangaan van een zakelijke relatie;

      b. zijn het tweede tot en met het achtste lid en tiende lid niet van toepassing.

      14

      15 Bij het verrichten van het cliëntenonderzoek verlaten de instellingen
      zich niet uitsluitend op de informatie in het handelsregister, bedoeld in
      [artikel 2 van de Handelsregisterwet 2007][ref12], of de informatie in het register, bedoeld in
      __REF001___________________________________________________________________________________________________________
      ____________________.


