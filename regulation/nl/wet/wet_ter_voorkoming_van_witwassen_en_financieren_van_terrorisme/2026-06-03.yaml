  - number: '17'
    text: |-
      1 De Financiële inlichtingen eenheid kan ten behoeve van de uitvoering van haar taak, bedoeld in
      [artikel 13, aanhef en onderdelen a en b][ref1], gegevens of inlichtingen opvragen bij een instelling die een
      melding heeft gedaan of bij een instelling die naar het oordeel van de Financiële inlichtingen eenheid beschikt
      over gegevens of inlichtingen die relevant zijn voor het analyseren door de Financiële inlichtingen eenheid van een
      transactie of voorgenomen transactie of van een zakelijke relatie.

      2 De instelling waaraan overeenkomstig het eerste lid deze gegevens of inlichtingen zijn gevraagd, verstrekt deze
      onverwijld en in schriftelijke vorm, alsmede in spoedeisende gevallen mondeling, aan de Financiële inlichtingen
      eenheid.

      3 Indien een instelling met vestiging in een andere lidstaat naar het oordeel van de Financiële inlichtingen
      eenheid beschikt over gegevens of inlichtingen als bedoeld in het eerste lid, kan de Financiële inlichtingen
      eenheid overeenkomstig [artikel 13b][ref2], de financiële inlichtingen eenheid van de lidstaat waar de instelling
      is gevestigd om deze gegevens of inlichtingen verzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel13b
