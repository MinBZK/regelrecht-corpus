  - number: 1c
    text: |-
      1 Onze Minister van Financiën kan, in bij algemene maatregel van bestuur te bepalen gevallen, ontheffing verlenen
      van de bij of krachtens deze wet gestelde regels aan instellingen die incidenteel of in zeer beperkte mate
      financiële werkzaamheden verrichten, indien er een bewezen laag risico op witwassen of financieren van terrorisme
      bestaat. Aan een ontheffing kunnen voorschriften of beperkingen worden verbonden.

      2 Onze Minister van Financiën kan een op grond van het eerste lid verleende ontheffing wijzigen, geheel of
      gedeeltelijk intrekken of beperken, dan wel daaraan nadere voorschriften verbinden, indien:

      a. is gebleken dat bij de aanvraag van de ontheffing onjuiste of onvolledige gegevens zijn verstrekt en kennis
      omtrent de juiste en volledige gegevens tot een andere beslissing zou hebben geleid;

      b. de houder van een ontheffing omstandigheden of feiten heeft verzwegen op grond waarvan, zo zij voor het
      tijdstip waarop de ontheffing werd verleend zich hadden voorgedaan of bekend waren geweest, de ontheffing zou zijn
      geweigerd;

      c. de houder van een ontheffing niet langer voldoet aan de bij of krachtens deze wet gestelde regels, dan wel niet
      meer voldoet aan de aan de ontheffing verbonden voorschriften of de gestelde beperkingen niet naleeft.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het
      verlenen, wijzigen, intrekken of beperken van een ontheffing.
    url: https://wetten.overheid.nl/BWBR0024282/2026-06-03#Artikel1c
  - number: 1d
    text: |-
      1 Met de uitvoering en handhaving van deze wet zijn belast:

      a. de Nederlandsche Bank N.V.: voor zover het betreft instellingen als bedoeld in
      __REF000___________________________________________________________________________________________________________
      _________________________________________________________, of bijkantoren van dergelijke instellingen met zetel
      buiten Nederland, alsmede instellingen als bedoeld in artikel 1a, vierde lid, onderdeel f;

      b. de Stichting Autoriteit Financiële Markten: voor zover het betreft instellingen als bedoeld in
      __REF000___________________________________________________________________________________________________________
      _________________________________________________________________ of bijkantoren van dergelijke instellingen met
      zetel buiten Nederland, alsmede beheerders als bedoeld in artikel 1a, zesde lid;

      c. het Bureau Financieel Toezicht: voor zover het betreft instellingen als bedoeld in
      [artikel 1a, vierde lid, onderdeel a, b, d en e][ref3];

      d. de deken, bedoeld in [artikel 22, tweede lid, van de Advocatenwet][ref4]: voor zover het betreft instellingen
      als bedoeld in [artikel 1a, vierde lid, onderdeel c][ref5];

      e. Onze Minister van Financiën: voor zover het betreft instellingen als bedoeld in
      [artikel 1a, vierde lid, onderdeel g, h, i, j, k, m en n][ref6];

      f. de kansspelautoriteit: voor zover het betreft instellingen als bedoeld in
      [artikel 1a, vierde lid, onderdeel l][ref7].

      2 De Nederlandsche Bank N.V. is belast met de uitvoering en handhaving van de verordening betreffende bij
      geldovermakingen en overdrachten van cryptoactiva te voegen informatie, voor zover het gaat om instellingen als
      bedoeld in artikel 3, onderdelen 5 en 6 van die verordening.

      3 De Stichting Autoriteit Financiële Markten is belast met de uitvoering en handhaving van de verordening inzake
      de veiling van broeikasgasemissierechten en de verordening betreffende bij geldovermakingen en overdrachten van
      cryptoactiva te voegen informatie, voor zover het gaat om instellingen als bedoeld in artikel 3, onderdelen 15 en
      16 van die verordening.

      4 De in het eerste lid genoemde bestuursorganen kunnen, indien een verordening als bedoeld in artikel 288 van het
      Verdrag betreffende de werking van de Europese Unie betrekking heeft op een onderwerp dat verband houdt met de
      voorkoming van witwassen of financieren van terrorisme, bij algemene maatregel van bestuur tevens worden belast met
      de uitvoering en handhaving van de bij of krachtens die verordening gestelde regels.

      5 De bij of krachtens een verordening als bedoeld in het tweede, derde of vierde lid gestelde regels worden voor de
      toepassing van deze wet gelijkgesteld met bij of krachtens deze wet gestelde regels.

      6 De in het eerste lid genoemde bestuursorganen oefenen hun taak uit op een risico gebaseerde en effectieve wijze
      en nemen artikel 48, zesde tot en met achtste lid, van de vierde anti-witwasrichtlijn daarbij in acht.

      7 Bij regeling van Onze Minister van Financiën en Onze Minister van Justitie en Veiligheid kunnen nadere regels
      worden gesteld met betrekking tot de taakuitoefening van de op grond van dit artikel bevoegde bestuursorganen, met
      uitzondering van de deken, bedoeld in het eerste lid, onderdeel d.


