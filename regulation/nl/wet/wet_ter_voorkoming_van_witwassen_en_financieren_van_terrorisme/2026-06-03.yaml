    text: |-
      1 Bij regeling van Onze Minister van Financiën en Onze Minister van Justitie en Veiligheid kunnen instellingen als
      bedoeld in [artikel 1a, vierde lid, onderdeel l][ref1], zo nodig onder het stellen van aanvullende regels, geheel
      of gedeeltelijk worden vrijgesteld van de bij of krachtens deze wet gestelde regels, indien, rekening houdend met
      de aard en de omvang van de te verlenen diensten, voor die instellingen een bewezen laag risico op witwassen en
      financieren van terrorisme bestaat.

      2 Geen vrijstelling kan worden verleend aan instellingen als bedoeld in [artikel 1a, vierde lid, onderdeel l][ref2],
      die activiteiten verrichten als bedoeld in [artikel 27g][ref3] of [31 van de Wet op de kansspelen][ref4].


