  - number: '8'
    text: |-
      1 Een instelling verricht, in aanvulling op [artikel 3, tweede tot en met vierde lid][ref1], verscherpt
      cliëntenonderzoek in ten minste de volgende gevallen:

      a. indien de zakelijke relatie of transactie naar haar aard een hoger risico op witwassen of financieren van
      terrorisme met zich brengt;

      b. indien de staat waar de cliënt woonachtig of gevestigd is of zijn zetel heeft op grond van artikel 9 van de
      vierde anti-witwasrichtlijn door de Europese Commissie is aangewezen als staat met een hoger risico op witwassen of
      financieren van terrorisme.

      2 Een instelling houdt ten minste rekening met de risicofactoren, bedoeld in bijlage III bij de vierde anti-
      witwasrichtlijn, om vast te stellen of het eerste lid, onderdeel a, van toepassing is.

      3 Een instelling neemt redelijke maatregelen om de achtergrond en het doel van complexe of ongebruikelijk grote
      transacties, van transacties met een ongebruikelijk patroon of zonder duidelijk economisch of rechtmatig doel te
      onderzoeken en onderwerpt de gehele zakelijke relatie met de cliënt in dat geval aan een verscherpte controle.

      4 Onverminderd het eerste lid draagt een bank of andere financiële onderneming die een correspondentrelatie
      aangaat of is aangegaan met een respondentinstelling in een staat die geen lidstaat is en waarbij betalingen worden
      verricht, er bij het aangaan van de zakelijke relatie zorg voor dat:

      a. zij voldoende informatie over de betrokken respondentinstelling verzamelt om een volledig beeld te krijgen
      van de aard van haar bedrijfsactiviteiten, en op basis van openbaar beschikbare informatie de reputatie van de
      respondentinstelling en de kwaliteit van het toezicht dat op de respondentinstelling wordt uitgeoefend beoordeelt;

      b. zij de procedures en maatregelen ter voorkoming van witwassen en financieren van terrorisme van de betrokken
      respondentinstelling beoordeelt;

      c. indien het een nieuwe correspondentrelatie betreft, de beslissing tot het aangaan van die relatie wordt genomen
      of goedgekeurd door het hoger leidinggevend personeel van de bank of andere financiële onderneming;

      d. de verantwoordelijkheden van de bank of andere financiële onderneming en van de respondentinstelling worden
      vastgelegd;

      e. de betrokken respondentinstelling de cliënten die rechtstreeks toegang hebben tot transitrekeningen heeft
      geïdentificeerd, hun identiteit heeft geverifieerd en daarnaast doorlopend toezicht houdt op deze cliënten en dat
      deze in staat is om haar op verzoek de relevante cliëntgegevens te verstrekken;

      f. bij beëindiging van de correspondentrelatie om redenen die verband houden met het witwassen van geld en
      terrorismefinanciering, het besluit gedocumenteerd wordt.

      5 In aanvulling op de cliëntenonderzoeksmaatregelen, bedoeld in [artikel 3][ref2], dragen aanbieders van
      cryptoactivadiensten er bij overdrachten van cryptoactiva naar of vanuit een zelfgehost adres zorg voor dat:

      a. zij beschikken over interne beleidsregels, procedures en controles om het risico op het witwassen van geld en
      terrorismefinanciering vast te stellen en te beoordelen;

      b. er risicobeperkende maatregelen worden getroffen die in verhouding staan tot de vastgestelde risico's. Daarbij
      gaat het om een of meer van de volgende risicobeperkende maatregelen:

      1°. het nemen van risicogebaseerde maatregelen ter identificatie en ter verificatie van de identiteit van de
      initiator of de begunstigde van een overdracht naar of vanuit een zelfgehost adres, of van de uiteindelijke
      begunstigde eigenaar van de initiator of begunstigde, onder meer door een beroep te doen op derde partijen;

      2°. het eisen van aanvullende informatie over de oorsprong en de bestemming van de overgemaakte cryptoactiva;

      3°. het aanscherpen van de permanente monitoring van deze transacties;

      4°. alle andere maatregelen om de risico's op het witwassen van geld en terrorismefinanciering evenals het risico
      op niet-uitvoering en ontduiking van gerichte financiële sancties en van gerichte financiële sancties in verband
      met de financiering van proliferatie te beperken en te beheersen.

      6 In aanvulling op de cliëntenonderzoeksmaatregelen, bedoeld in [artikel 3][ref3]:

      a. beschikt een instelling over passende risicobeheersystemen, waaronder op risico gebaseerde procedures, om te
      bepalen of de cliënt of de uiteindelijk belanghebbende een politiek prominente persoon is;

      b. past een instelling de volgende maatregelen toe bij het aangaan of voortzetten van een zakelijke relatie met of
      het verrichten van een transactie voor een politiek prominente persoon:

      1°. voor het aangaan of voortzetten van deze zakelijke relatie of het verrichten van deze transactie, is de
      toestemming vereist van een persoon die deel uitmaakt van het hoger leidinggevend personeel;

      2°. passende maatregelen worden getroffen om de bron van het vermogen en van de middelen die bij deze zakelijke
      relatie of deze transactie gebruikt worden, vast te stellen;

      3°. de zakelijke relatie wordt doorlopend aan verscherpte controle onderworpen.

      7 In aanvulling op de cliëntenonderzoeksmaatregelen, bedoeld in [artikel 3][ref4]:

      a. neemt een instelling, uiterlijk bij uitbetaling van de polis of bij gehele of gedeeltelijke overdracht van
      de polis, redelijke maatregelen om te bepalen of de begunstigde dan wel de uiteindelijk belanghebbende van de
      begunstigde van een levensverzekering, een politiek prominente persoon is;

      b. past een instelling de volgende maatregelen toe in geval de persoon, bedoeld in onderdeel a, een politiek
      prominente persoon is:

      1°. een persoon die deel uitmaakt van het hoger leidinggevend personeel wordt geïnformeerd over de uitbetaling van
      de polisopbrengsten aan de personen, bedoeld in onderdeel a, voorafgaand aan deze uitbetaling;

      2°. de gehele zakelijke relatie met de polishouder wordt aan verscherpte controle onderworpen.

      8 Indien de cliënt of de uiteindelijk belanghebbende niet langer een prominente publieke functie bekleedt, past
      de instelling passende risicogebaseerde maatregelen zo lang als nodig, doch ten minste gedurende 12 maanden toe,
      totdat deze persoon niet langer het hoger risico met zich brengt dat hoort bij politiek prominente personen.

      9 De maatregelen, bedoeld in het vijfde tot en met het zevende lid, zijn van overeenkomstige toepassing op
      familieleden van politiek prominente personen en personen bekend als naaste geassocieerden van politiek prominente
      personen.

      10 Indien de cliënt of de uiteindelijk belanghebbende gedurende de zakelijke relatie een politiek prominente
      persoon wordt of blijkt te zijn, voldoet de instelling onverwijld nadat hiervan is gebleken aan het zesde lid, het
      zevende lid, onderdeel b, en het achtste en negende lid.

      11 Indien een cliënt een bijkantoor of meerderheidsdochteronderneming met zetel of vestiging in een staat als
      bedoeld in het eerste lid is van een in een lidstaat gevestigde instelling, en het betreffende bijkantoor of
      de betreffende meerderheidsdochteronderneming volledig voldoet aan de voor de groep geldende gedragslijnen en
      procedures overeenkomstig [artikel 2f, tweede lid][ref5], kan in plaats van een verscherpt cliëntenonderzoek,
      cliëntenonderzoek worden verricht dat is afgestemd op de risico’s op witwassen of financieren van terrorisme die
      met deze cliënt gepaard gaan.

      12 Een instelling neemt redelijke maatregelen om ervoor te zorgen dat de gegevens, die ingevolge het derde tot en
      met zevende lid, negende lid en elfde lid zijn verzameld, actueel gehouden worden.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0024282#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0024282#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0024282#Artikel2f
