  - number: 32d
    text: |-
      1 De toezichthoudende autoriteit kan ten aanzien van vestigingen als bedoeld in [artikel 2e, eerste lid][ref1],
      passende en evenredige maatregelen nemen om ernstige gebreken die onmiddellijke maatregelen vereisen, te
      adresseren.

      2 De maatregelen, bedoeld in het eerste lid, zijn van tijdelijke aard en worden beëindigd wanneer de geconstateerde
      gebreken zijn hersteld.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel2e
