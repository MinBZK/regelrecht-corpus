  - number: 13b
    text: |-
      1 De Financiële inlichtingen eenheid kan, ten behoeve van haar taken, bedoeld in [artikel 13][ref1], een financiële
      inlichtingen eenheid van een andere lidstaat verzoeken om informatie die relevant kan zijn voor de verwerking of
      de analyse van informatie met betrekking tot witwassen of financieren van terrorisme en de betrokken natuurlijke of
      rechtspersonen, indien zij daarbij ten minste de volgende informatie verstrekt:

      a. relevante feiten en achtergrondinformatie bij het verzoek;

      b. de redenen voor het verzoek; en

      c. de wijze waarop de verzochte informatie zal worden gebruikt.

      2 De Financiële inlichtingen eenheid gebruikt informatie die zij heeft ontvangen van een financiële inlichtingen
      eenheid van een andere lidstaat uitsluitend indien:

      a. het gebruik van de informatie noodzakelijk is voor het vervullen van haar taken, bedoeld in [artikel 13][ref2];

      b. het gebruik van de informatie alleen plaatsvindt voor het doel waarvoor de informatie is gevraagd of verstrekt,
      dan wel met voorafgaande toestemming van de financiële inlichtingen eenheid die de informatie heeft verstrekt; en

      c. wordt voldaan aan de beperkingen en voorwaarden die aan het gebruik van de informatie zijn gesteld door de
      financiële inlichtingen eenheid die de informatie heeft verstrekt.

      3 Informatie afkomstig van een financiële inlichtingen eenheid van een andere lidstaat wordt door de Financiële
      inlichtingen eenheid niet zonder voorafgaande toestemming van die financiële inlichtingen eenheid verstrekt aan de
      personen, bedoeld in [artikel 13, onderdeel g][ref3].


