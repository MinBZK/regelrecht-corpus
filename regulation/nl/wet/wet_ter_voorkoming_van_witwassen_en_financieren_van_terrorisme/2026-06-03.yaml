  - number: 1a
    text: |-
      1 Deze wet is van toepassing op banken en andere financiële ondernemingen, alsmede op de ingevolge het
      vierde lid aangewezen natuurlijke personen, rechtspersonen of vennootschappen handelend in het kader van hun
      beroepsactiviteiten, met dien verstande dat voor de instellingen, bedoeld in het vierde lid, onderdeel i, alleen de
      verplichting in [artikel 1f][ref1] geldt.

      2 Als bank wordt aangemerkt een bank als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref2],
      niet zijnde een natuurlijke persoon, rechtspersoon of vennootschap waarvoor op grond van
      [artikel 2:11, tweede lid][ref3], of [artikel 2:16, vierde lid, van die wet][ref4] geen vergunning tot uitoefening
      van het bedrijf van bank vereist is, of een bijkantoor in Nederland van een bank met zetel buiten Nederland.

      3 Als andere financiële ondernemingen worden aangemerkt:

      a. degenen die, geen bank zijnde, in hoofdzaak hun bedrijf maken van het verrichten van een of meer van
      de werkzaamheden opgenomen onder de punten 2, 3, 5, 6, 9, 10, 12 en 14 van bijlage I bij de richtlijn
      kapitaalvereisten;

      b. degenen die, geen bank zijnde, in hoofdzaak hun bedrijf maken van het verrichten van betaaldiensten als bedoeld
      in bijlage I bij de richtlijn betaaldiensten;

      c. beleggingsondernemingen als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref5];

      d. beleggingsinstellingen als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref6];

      e. elektronischgeldinstellingen als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref7] voor zover
      deze andere transacties verrichten dan bedoeld in [artikel 1:5a, tweede lid, onderdeel k, van die wet][ref8];

      f. wisselinstellingen als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref9];

      g. levensverzekeraars als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref10] met uitzondering
      van levensverzekeraars die uitsluitend het bedrijf van natura-uitvaartverzekeraar als bedoeld in dat artikel
      uitoefenen;

      h. icbe’s als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref11];

      i. financiële dienstverleners als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref12] voor zover
      deze bemiddelen in levensverzekeringen;

      j. betaaldienstagenten als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref13];

      k. aanbieders van cryptoactivadiensten;

      l. bijkantoren in Nederland van andere financiële ondernemingen als bedoeld onder a tot en met i en k, met zetel
      buiten Nederland.

      4 Als natuurlijke personen, rechtspersonen of vennootschappen handelend in het kader van hun beroepsactiviteiten
      waarop deze wet van toepassing is worden aangewezen:

      a. natuurlijke personen, rechtspersonen of vennootschappen die als belastingadviseur zelfstandig onafhankelijk
      beroepsactiviteiten uitoefenen, dan wel natuurlijke personen, rechtspersonen of vennootschappen voor zover zij
      anderszins zelfstandig in hoofdzaak, onafhankelijk, al dan niet via andere aan hen gelieerde natuurlijke personen,
      rechtspersonen of vennootschappen, daarmee vergelijkbare activiteiten beroeps- of bedrijfsmatig verrichten;

      b. natuurlijke personen, rechtspersonen of vennootschappen die als externe registeraccountant of externe
      accountant-administratieconsulent zelfstandig onafhankelijk beroepsactiviteiten waaronder forensische accountancy
      uitoefenen, dan wel natuurlijke personen, rechtspersonen of vennootschappen, voor zover die anderszins zelfstandig
      onafhankelijk daarmee vergelijkbare activiteiten beroeps- of bedrijfsmatig verrichten;

      c. natuurlijke personen, rechtspersonen of vennootschappen die als advocaat:

      1°. zelfstandig onafhankelijk beroeps- of bedrijfsmatig advies geven of bijstand verlenen bij:

      i. het aan- of verkopen van registergoederen;

      ii. het beheren van geld, effecten, munten, muntbiljetten, edele metalen, edelstenen of andere waarden;

      iii. het oprichten of beheren van vennootschappen, rechtspersonen of soortgelijke lichamen als bedoeld in
      [artikel 2, eerste lid, onderdeel b, van de Algemene wet inzake rijksbelastingen][ref14] dan wel het organiseren
      van de inbreng die nodig is voor de oprichting, de exploitatie of het beheer daarvan;

      iv. het aan- of verkopen van aandelen in, of het geheel of gedeeltelijk aan- of verkopen dan wel
      overnemen van ondernemingen, vennootschappen, rechtspersonen of soortgelijke lichamen als bedoeld in
      [artikel 2, eerste lid, onderdeel b, van de Algemene wet inzake rijksbelastingen][ref15];

      v. werkzaamheden op fiscaal gebied die vergelijkbaar zijn met de werkzaamheden van de in onderdeel a beschreven
      beroepsgroepen;

      vi. het vestigen van een recht van hypotheek op een registergoed; of

      2°. zelfstandig onafhankelijk beroeps- of bedrijfsmatig optreden in naam en voor rekening van een cliënt bij
      enigerlei financiële transactie of onroerende zaaktransactie;

      d. natuurlijke personen, rechtspersonen of vennootschappen die als notaris, toegevoegd notaris of kandidaat-
      notaris:

      1°. zelfstandig onafhankelijk beroeps- of bedrijfsmatig advies geven of bijstand verlenen bij:

      i. het aan- of verkopen van registergoederen;

      ii. het beheren van geld, effecten, munten, muntbiljetten, edele metalen, edelstenen of andere waarden;

      iii. het oprichten of beheren van vennootschappen, rechtspersonen of soortgelijke lichamen als bedoeld in
      [artikel 2, eerste lid, onderdeel b, van de Algemene wet inzake rijksbelastingen][ref16] dan wel het organiseren
      van de inbreng die nodig is voor de oprichting, de exploitatie of het beheer daarvan;

      iv. het aan- of verkopen van aandelen in, of het geheel of gedeeltelijk aan- of verkopen dan wel
      overnemen van ondernemingen, vennootschappen, rechtspersonen of soortgelijke lichamen als bedoeld in
      [artikel 2, eerste lid, onderdeel b, van de Algemene wet inzake rijksbelastingen][ref17];

      v. werkzaamheden op fiscaal gebied die vergelijkbaar zijn met de werkzaamheden van de in onderdeel a beschreven
      beroepsgroepen;

      vi. het vestigen van een recht van hypotheek op een registergoed; of

      2°. zelfstandig onafhankelijk beroeps- of bedrijfsmatig optreden in naam en voor rekening van een cliënt bij
      enigerlei financiële transactie of onroerende zaaktransactie;

      e. natuurlijke personen, rechtspersonen of vennootschappen die in de uitoefening van een aan dat van advocaat,
      notaris, toegevoegd notaris of kandidaat-notaris gelijksoortig juridisch beroep of bedrijf de in onderdeel c of d
      genoemde werkzaamheden verrichten;

      f. trustkantoren als bedoeld in [artikel 1, eerste lid, van de Wet toezicht trustkantoren 2018][ref18];

      g. natuurlijke personen, rechtspersonen of vennootschappen die beroeps- of bedrijfsmatig
      een adres of postadres ter beschikking stellen, niet zijnde een trustkantoor als bedoeld in
      [artikel 1, eerste lid, van de Wet toezicht trustkantoren 2018][ref19];

      h. natuurlijke personen, rechtspersonen of vennootschappen die beroeps- of bedrijfsmatig bemiddelen bij het
      tot stand brengen en het sluiten van overeenkomsten inzake onroerende zaken en rechten waaraan onroerende zaken
      zijn onderworpen, met inbegrip van het tot stand brengen en sluiten van een overeenkomst tot huur als bedoeld in
      [artikel 7:201 van het Burgerlijk Wetboek][ref20], voor zover de maandelijkse huurprijs een bedrag van € 10.000 of
      meer bedraagt;

      i. natuurlijke personen, rechtspersonen of vennootschappen die beroeps- of bedrijfsmatig handelen als koper of
      verkoper van goederen;

      j. natuurlijke personen, rechtspersonen of vennootschappen die beroeps- of bedrijfsmatig bemiddelen inzake koop en
      verkoop van voertuigen, schepen, kunstvoorwerpen, antiquiteiten, edelstenen, edele metalen, sieraden of juwelen;

      k. natuurlijke personen, rechtspersonen of vennootschappen die beroeps- of bedrijfsmatig handelen als koper of
      verkoper van kunstvoorwerpen, voor zover betaling van deze kunstvoorwerpen plaatsvindt voor een bedrag van € 10.000
      of meer, ongeacht of de transactie plaatsvindt in een handeling of door middel van meer handelingen waartussen een
      verband bestaat;

      l. natuurlijke personen, rechtspersonen of vennootschappen die beroeps- of bedrijfsmatig gelegenheid geven als
      bedoeld in [artikel 1, eerste lid, onderdeel a, van de Wet op de kansspelen][ref21] of die activiteiten verrichten
      als bedoeld in [artikel 7a][ref22], [30b][ref23], [30h][ref24] of [30z van die wet][ref25].

      m. natuurlijke personen, rechtspersonen of vennootschappen die beroeps- of bedrijfsmatig taxaties uitvoeren van
      onroerende zaken en rechten waaraan onroerende zaken zijn onderworpen;

      n. pandhuizen als bedoeld in [artikel 131, onderdeel a, van Boek 7 van het Burgerlijk Wetboek][ref26];

      o. natuurlijke personen, rechtspersonen of vennootschappen die behoren tot een bij algemene maatregel van bestuur
      aan te wijzen categorie beroepen of personen.

      5 Deze wet is niet van toepassing op belastingadviseurs als bedoeld in het vierde lid, onderdeel a, en personen als
      bedoeld in het vierde lid, onderdeel c, d en e, voor zover zij voor een cliënt werkzaamheden verrichten betreffende
      de bepaling van diens rechtspositie, diens vertegenwoordiging en verdediging in rechte, het geven van advies voor,
      tijdens en na een rechtsgeding of het geven van advies over het instellen of vermijden van een rechtsgeding.

      6 Indien een beleggingsinstelling als bedoeld in het derde lid, onderdeel d, een beleggingsmaatschappij met aparte
      beheerder is of een beleggingsfonds of indien een icbe als bedoeld in het derde lid, onderdeel h, een fonds voor
      collectieve belegging in effecten of een maatschappij voor collectieve belegging in effecten met aparte beheerder
      is, draagt de beheerder van de betreffende instelling zorg voor de naleving van de bij of krachtens deze wet
      gestelde regels door de instelling.


