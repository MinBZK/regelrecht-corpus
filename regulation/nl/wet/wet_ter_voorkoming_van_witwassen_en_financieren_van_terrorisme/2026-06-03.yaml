  - number: '12'
    text: |-
      1 Er is een Financiële inlichtingen eenheid.

      2 De algemene leiding, de organisatie en het beheer van de Financiële inlichtingen eenheid berusten bij Onze
      Minister van Justitie.

      3 Benoeming, schorsing en ontslag van het hoofd van de Financiële inlichtingen eenheid geschieden bij koninklijk
      besluit op voordracht van Onze Minister van Justitie, in overeenstemming met Onze Minister van Financiën.

      4 Onze Minister van Justitie bepaalt in overeenstemming met Onze Minister van Financiën de begroting van de
      Financiële inlichtingen eenheid.
    url: https://wetten.overheid.nl/BWBR0024282/2026-06-03#Artikel12
  - number: '13'
    text: |-
      De Financiële inlichtingen eenheid heeft met het oog op het voorkomen en opsporen van witwassen en onderliggende
      basisdelicten, alsmede financieren van terrorisme, tot taak:

      a. het verzamelen, registreren, bewerken en analyseren van de gegevens die het verkrijgt, teneinde te bezien of
      deze gegevens van belang kunnen zijn voor het voorkomen en opsporen van misdrijven;

      b. het verstrekken van persoonsgegevens en andere gegevens in overeenstemming met deze wet en het bij of krachtens
      de [Wet politiegegevens][ref1] bepaalde;

      c. een instelling berichten over de ontvangst van een melding door die instelling, de ontvangst van nadere gegevens
      of inlichtingen verstrekt door die instelling, alsmede over trends en fenomenen die naar voren komen uit ontvangen
      meldingen, en in voorkomende gevallen, door tussenkomst van het openbaar ministerie, over de betekenis van een
      melding door die instelling voor de vervolging van strafbare feiten;

      d. het verrichten van onderzoek naar ontwikkelingen op het gebied van witwassen en financieren van terrorisme en
      naar de verbetering van de methoden om witwassen en financieren van terrorisme te voorkomen en op te sporen;

      e. het geven van aanbevelingen voor de bedrijfstakken omtrent de invoering van passende procedures voor interne
      controle en communicatie en andere te treffen maatregelen tot voorkoming van het gebruik van die bedrijfstakken
      voor witwassen en financieren van terrorisme;

      f. het geven van voorlichting omtrent het voorkomen en opsporen van witwassen en financieren van terrorisme aan:

      1°. de bedrijfstakken en beroepsgroepen;

      2°. de toezichthoudende autoriteit;

      3°. het openbaar ministerie en de overige ambtenaren belast met de opsporing van strafbare feiten;

      4°. het publiek;

      g. het geven van inlichtingen aangaande het meldgedrag van de instellingen aan de toezichthoudende autoriteit en de
      personen, bedoeld in onderdeel f, onder 3°;

      h. het onderhouden van contacten met buitenlandse van overheidswege aangewezen instanties die een vergelijkbare
      taak hebben als de Financiële inlichtingen eenheid;

      i. het jaarlijks uitbrengen van een verslag met betrekking tot de taakuitoefening en zijn werkzaamheden in het
      voorafgaande jaar en van zijn voornemens voor het komende jaar, dat wordt aangeboden aan Onze Minister van Justitie
      en ter kennis gebracht van Onze Minister van Financiën.


      [ref1]: https://wetten.overheid.nl/BWBR0022463
    url: https://wetten.overheid.nl/BWBR0024282/2026-06-03#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0022463
  - number: 13a
    text: |-
      1 Ten behoeve van de uitoefening van haar taken op grond van [artikel 13][ref1], werkt de Financiële inlichtingen
      eenheid zoveel mogelijk samen met de financiële inlichtingen eenheden van andere lidstaten.

      2 De Financiële inlichtingen eenheid wisselt met een financiële inlichtingen eenheid van een andere lidstaat,
      uit eigen beweging of op verzoek van die andere financiële inlichtingen eenheid en zo nodig onder het stellen van
      voorwaarden of beperkingen, alle beschikbare informatie uit die relevant kan zijn voor de verwerking of de analyse
      door die financiële inlichtingen eenheid van informatie met betrekking tot witwassen of financieren van terrorisme
      en de betrokken natuurlijke of rechtspersonen.

      3 De informatie, bedoeld in het tweede lid, wordt ook uitgewisseld indien:

      a. op het tijdstip van uitwisseling niet is vastgesteld welk basisdelict bij de te analyseren of de te verwerken
      informatie is betrokken;

      b. de definitie van een betrokken misdrijf van fiscale aard in de andere lidstaat anders is dan naar Nederlands
      recht omschreven.

      4 Een verzoek als bedoeld in het tweede lid wordt door de Financiële inlichtingen eenheid in behandeling genomen,
      indien:

      a. het verzoek de relevante feiten en achtergrondinformatie bevat; en

      b. in het verzoek uiteen is gezet wat de redenen zijn voor het verzoek en hoe de gevraagde informatie zal worden
      gebruikt.

      5 Indien een verzoek als bedoeld in het tweede lid in behandeling wordt genomen, gebruikt de Financiële
      inlichtingen eenheid voor het vergaren van de verzochte informatie al haar bevoegdheden op grond van deze wet en
      verstrekt zij de verzochte informatie onverwijld aan de financiële inlichtingen eenheid van de andere lidstaat.

      6 Aan een verzoek als bedoeld in het tweede lid wordt niet voldaan indien het verstrekken van de gevraagde
      informatie zich niet zou verdragen met de Nederlandse wet.

      7 De Financiële inlichtingen eenheid wijst een centraal contactpunt aan dat verantwoordelijk is voor de ontvangst
      van de verzoeken bedoeld in het tweede lid.

      8 Indien een financiële inlichtingen eenheid van een andere lidstaat verzoekt om toestemming voor het delen van
      informatie afkomstig van de Financiële inlichtingen eenheid met bevoegde autoriteiten in een andere lidstaat,
      verstrekt de Financiële inlichtingen eenheid deze toestemming onverwijld en zo ruim mogelijk, tenzij het verlenen
      van toestemming:

      a. niet past binnen het kader van de wetgeving ter voorkoming van witwassen en financieren van terrorisme;

      b. strijdig is met wettelijke bepalingen;

      c. een strafrechtelijk onderzoek kan schaden; of

      d. de belangen van natuurlijke of rechtspersonen op wie de informatie betrekking heeft onevenredig kan schaden.

      9 Indien het verstrekken van informatie of het verlenen van toestemming op grond van het zesde lid,
      onderscheidenlijk het achtste lid, wordt geweigerd, wordt dit gemotiveerd kenbaar gemaakt aan de financiële
      inlichtingen eenheid die om de informatie of toestemming heeft verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel13
    url: https://wetten.overheid.nl/BWBR0024282/2026-06-03#Artikel13a
