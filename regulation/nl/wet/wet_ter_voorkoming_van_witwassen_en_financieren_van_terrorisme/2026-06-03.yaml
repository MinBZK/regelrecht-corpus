  - number: '4'
    text: |-
      1 Een instelling voldoet aan [artikel 3, tweede lid, onderdelen a en b][ref1], en indien van toepassing het derde
      en vierde lid van dat artikel, voordat de zakelijke relatie wordt aangegaan of een incidentele transactie als
      bedoeld in artikel 3, vijfde lid, onderdelen b en g, zesde en zevende lid, wordt uitgevoerd.

      2 Bij het aangaan van een nieuwe zakelijke relatie met een cliënt als bedoeld in
      [artikel 3, tweede lid, onderdeel b, of vierde lid][ref2], beschikt de instelling over een bewijs van inschrijving
      in het handelsregister, bedoeld in [artikel 2 van de Handelsregisterwet 2007][ref3], en stelt de instelling vast of
      de uiteindelijk belanghebbenden van de cliënt zijn opgenomen als bedoeld in artikel 15a van die wet.

      3 In afwijking van het eerste lid is het een instelling toegestaan de identiteit van de cliënt en, indien van
      toepassing, de identiteit van de uiteindelijk belanghebbende te verifiëren tijdens het aangaan van de zakelijke
      relatie, indien dit noodzakelijk is om de dienstverlening niet te verstoren en indien er weinig risico op witwassen
      of financieren van terrorisme bestaat. In dat geval verifieert de instelling de identiteit zo spoedig mogelijk na
      het eerste contact met de cliënt.

      4 In afwijking van het eerste lid is het een bank of andere financiële onderneming toegestaan een rekening, met
      inbegrip van een rekening voor effectentransacties, te openen voordat de verificatie van de identiteit van de
      cliënt heeft plaatsgevonden, indien zij waarborgt dat deze rekening niet kan worden gebruikt voordat de verificatie
      heeft plaatsgevonden.

      5 In afwijking van het eerste lid kan een notaris, toegevoegd notaris of kandidaat-notaris als
      bedoeld in [artikel 1a, vierde lid, onderdeel d][ref4], de identiteit van de cliënt en, indien van
      toepassing, van de uiteindelijk belanghebbende verifiëren op het moment dat identificatie op grond van
      [artikel 39 van de Wet op het notarisambt][ref5] is vereist.

      6 In afwijking van het eerste lid is het een instelling toegestaan om de identiteit van de begunstigde van een
      trust of van een soortgelijke juridische constructie pas vast te stellen op het tijdstip van uitbetaling of op
      het tijdstip waarop de begunstigde zijn definitieve rechten uitoefent, mits de begunstigde voor het aangaan van
      de zakelijke relatie of het uitvoeren van een incidentele transactie aan de hand van specifieke kenmerken of
      naar categorie is omschreven en de instelling zodanige informatie inwint dat zij in staat is de identiteit van
      de begunstigde vast te stellen op het tijdstip van uitbetaling of op het tijdstip waarop de begunstigde zijn
      definitieve rechten uitoefent.

      7 Bij het aangaan van een nieuwe zakelijke relatie met een cliënt als bedoeld in [artikel 3, derde lid][ref6],
      beschikt de instelling over een bewijs van inschrijving in het register, bedoeld in
      __REF001___________________________________________________________________________________________________________
      ___________________ dan wel in een ander register als bedoeld in artikel 31 van de vierde anti-
      witwasrichtlijn dat in een andere lidstaat van de Europese Unie wordt bijgehouden, en stelt de
      instelling vast of de uiteindelijk belanghebbenden van de cliënt zijn geregistreerd als bedoeld in
      __REF002___________________________________________________________________________________________________________
      ____________________.


