  - number: 17a
    text: |-
      1 De Financiële inlichtingen eenheid kan ten behoeve van de uitvoering van de taak, bedoeld
      in[ artikel 13, aanhef en onderdelen a en b][ref1], een instelling verzoeken het uitvoeren van een transactie
      of meerdere transacties gedurende een periode van ten hoogste vijf werkdagen aan te houden ingeval de Financiële
      inlichtingen eenheid aanwijzingen heeft dat deze transactie of transacties verband kan of kunnen houden met
      witwassen of financieren van terrorisme, of indien een financiële inlichtingen eenheid uit een andere staat hierom
      verzoekt.

      2 De in het eerste lid genoemde periode kan met een termijn van ten hoogste vijf werkdagen worden verlengd indien
      de Financiële inlichtingen eenheid het in het eerste lid bedoelde verzoek doet op verzoek van een financiële
      inlichtingen eenheid van een andere staat.

      3 De Financiële inlichtingen eenheid trekt het verzoek, bedoeld in het eerste lid, voor het aflopen van de termijn,
      genoemd in het eerste en tweede lid, in zodra zulks mogelijk is.

      4 De instelling waaraan overeenkomstig het eerste lid een verzoek is gedaan, geeft hieraan onverwijld gevolg.

      5 Een instelling beschikt over gedragslijnen, procedures en maatregelen die haar in staat stellen te voldoen aan
      het vierde lid.

      6 Een instelling informeert een cliënt terstond over toepassing van het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel13
    url: https://wetten.overheid.nl/BWBR0024282/2026-06-03#Artikel17a
