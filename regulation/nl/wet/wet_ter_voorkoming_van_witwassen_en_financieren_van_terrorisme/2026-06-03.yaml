  - number: '38'
    text: |-
      1 Ten aanzien van cliënten waarnaar reeds cliëntenonderzoek is verricht op grond van deze wet, zoals deze
      luidde voor inwerkingtreding van de Implementatiewet vierde anti-witwasrichtlijn, verricht een instelling het
      cliëntenonderzoek, bedoeld in [artikel 3, eerste lid][ref1], bij eerste gelegenheid.

      2 Onder eerste gelegenheid in de zin van het eerste lid wordt verstaan het eerste moment dat door de cliënt
      contact wordt opgenomen met de instelling of het eerste moment dat de instelling, met inachtneming van de
      risicogevoeligheid voor witwassen of financieren van terrorisme van het type cliënt, zakelijke relatie, product of
      transactie, aanleiding vindt om het cliëntenonderzoek te doen plaatsvinden.

      3 In afwijking van het eerste lid verricht een bank of andere financiële onderneming in geval
      van een zakelijke relatie met betrekking tot een levensverzekeringsovereenkomst als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref2], die is aangegaan voor het tijdstip van
      inwerkingtreding van de [Implementatiewet vierde anti-witwasrichtlijn][ref3], het cliëntenonderzoek, bedoeld in
      de [artikelen 3, eerste lid][ref4], en [3a][ref5], zodra een geldelijke uitkering plaatsvindt aan de cliënt of
      begunstigde.

      4 De [artikelen 3a][ref6], [6][ref7], [7][ref8] en [8][ref9] zijn van overeenkomstige toepassing op een
      cliëntenonderzoek dat op grond van het eerste of derde lid wordt verricht.


