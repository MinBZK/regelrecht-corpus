        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 23aa
    text: |-
      In afwijking van de geheimhoudingsplicht, bedoeld in [artikel 23, eerste, tweede en vierde lid][ref1],
      verstrekt een instelling, indien zij deelneemt aan een samenwerkingsverband als bedoeld in de
      [Wet gegevensverwerking door samenwerkingsverbanden][ref2], aan het samenwerkingsverband gegevens behorend tot
      de in [hoofdstuk 2 van die wet][ref3] of bij algemene maatregel van bestuur op grond van die wet aangewezen
      categorieën, voor zover dat noodzakelijk is voor het doel van dat samenwerkingsverband, tenzij naar het oordeel van
      de instelling zwaarwegende redenen zich daartegen verzetten. Bij algemene maatregel van bestuur kunnen voorwaarden
      en beperkingen worden gesteld aan de verstrekkingen op grond van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0049962
      [ref3]: https://wetten.overheid.nl/BWBR0049962#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0024282/2026-06-03#Artikel23aa
