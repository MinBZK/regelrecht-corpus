  - number: '6'
    text: |-
      1 In afwijking van [artikel 3, tweede tot en met vierde lid][ref1], kan een instelling een vereenvoudigd
      cliëntenonderzoek verrichten indien een zakelijke relatie of transactie naar haar aard een laag risico op witwassen
      of financieren van terrorisme met zich brengt. De instelling houdt daarbij ten minste rekening met de in bijlage II
      bij de vierde anti-witwasrichtlijn genoemde risicofactoren.

      2 Een instelling verzamelt aantoonbaar voldoende gegevens om te kunnen vaststellen of met betrekking tot een cliënt
      een vereenvoudigd cliëntenonderzoek, als bedoeld in het eerste lid, kan worden verricht.

      3 Een instelling neemt redelijke maatregelen om ervoor te zorgen dat de gegevens die ingevolge het tweede lid zijn
      verzameld en de daarop gebaseerde vaststelling actueel gehouden worden.

      4 Een instelling zorgt voor een toereikende controle van de transacties of de zakelijke relatie om te verzekeren
      dat kan worden voldaan aan het bepaalde in [artikel 16][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel3
