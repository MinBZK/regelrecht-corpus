  - number: 1g
    text: |-
      1 Onze Minister van Financiën en Onze Minister van Justitie en Veiligheid gezamenlijk publiceren een verslag van de
      geïdentificeerde, geanalyseerde en beoordeelde nationale risico’s op witwassen en het financieren van terrorisme,
      bedoeld in artikel 7 van de vierde anti-witwasrichtlijn. Dit verslag wordt elke twee jaar geactualiseerd.

      2 Ter voorbereiding van dit verslag publiceren Onze Minister van Financiën en Onze Minister van Justitie en
      Veiligheid gezamenlijk de statistieken, bedoeld in artikel 44 van de vierde anti-witwasrichtlijn. Deze statistieken
      worden jaarlijks geactualiseerd.
    url: https://wetten.overheid.nl/BWBR0024282/2026-06-03#Artikel1g
  - number: '2'
    text: |-
      1 Een instelling met een bijkantoor of een meerderheidsdochteronderneming in een staat die geen lidstaat is en
      waar de wettelijke voorschriften ter voorkoming van witwassen en financieren van terrorisme minder verstrekkend
      zijn dan de bij of krachtens deze wet gestelde regels, draagt er zorg voor dat het bijkantoor, onderscheidenlijk de
      meerderheidsdochteronderneming, de bij of krachtens deze wet gestelde regels naleeft, voor zover het recht van de
      betrokken staat hier niet aan in de weg staat.

      2 Indien het recht van de betrokken staat aan toepassing van het eerste lid in de weg staat, stelt de instelling de
      toezichthoudende autoriteit daarvan in kennis en neemt zij maatregelen om het risico van witwassen en financieren
      van terrorisme doeltreffend te beheersen. Indien van toepassing neemt zij hierbij het bepaalde op grond van artikel
      45, zevende lid, van de vierde anti-witwasrichtlijn in acht.

      3 Een instelling die een vestiging in een andere lidstaat exploiteert, ziet er op toe dat deze vestiging de in die
      lidstaat ter omzetting van de vierde anti-witwasrichtlijn geldende bepalingen naleeft.
    url: https://wetten.overheid.nl/BWBR0024282/2026-06-03#Artikel2
  - number: 2a
    text: |-
      1 Ter voorkoming van witwassen en financieren van terrorisme verricht een instelling cliëntenonderzoek en meldt zij
      verrichte of voorgenomen ongebruikelijke transacties overeenkomstig de bij of krachtens de [hoofdstukken 2][ref1]
      en [3][ref2] gestelde regels. Daarbij besteedt een instelling bijzondere aandacht aan ongebruikelijke
      transactiepatronen en aan transacties die naar hun aard een hoger risico op witwassen of financieren van terrorisme
      met zich brengen.

      2 Een instelling treft adequate maatregelen ter voorkoming van risico’s op witwassen en financieren van terrorisme
      die kunnen ontstaan door het gebruik van nieuwe technologieën in het economisch verkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0024282/2026-06-03#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0024282
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0024282
        hoofdstuk: '3'
  - number: 2b
    text: |-
      1 Een instelling neemt maatregelen om haar risico’s op witwassen en financieren van terrorisme vast te stellen en
      te beoordelen, waarbij de maatregelen in verhouding staan tot de aard en de omvang van de instelling.

      2 Bij het vaststellen en beoordelen van de risico’s, bedoeld in het eerste lid, houdt de instelling in ieder
      geval rekening met de risicofactoren die verband houden met het type cliënt, product, dienst, transactie en
      leveringskanaal en met landen of geografische gebieden.

      3 Een instelling legt de resultaten van het vaststellen en beoordelen van haar risico’s vast, houdt deze actueel en
      verstrekt deze resultaten desgevraagd aan de toezichthoudende autoriteit.

      4 De toezichthoudende autoriteit kan ontheffing verlenen van het eerste tot en met derde lid, indien de instelling
      behoort tot een sector waarvan de inherente specifieke risico’s op witwassen en financieren van terrorisme
      duidelijk en inzichtelijk zijn.
    url: https://wetten.overheid.nl/BWBR0024282/2026-06-03#Artikel2b
  - number: 2c
    text: |-
      1 Een instelling beschikt over gedragslijnen, procedures en maatregelen om de risico’s op witwassen en financieren
      van terrorisme en de risico’s die zijn geïdentificeerd in de meest recente versies van de supranationale
      risicobeoordeling en de nationale risicobeoordeling te beperken en effectief te beheersen.

      2 De gedragslijnen, procedures en maatregelen, bedoeld in het eerste lid, zijn evenredig aan de aard en de
      omvang van de instelling en hebben ten minste betrekking op de naleving van de bepalingen in [hoofdstuk 1][ref1],
      [paragraaf 1.2][ref2], [1.3][ref3], [hoofdstuk 2][ref4], [hoofdstuk 3][ref5], [paragraaf 3.2][ref6] en
      [hoofdstuk 5][ref7].

      3 De gedragslijnen, procedures en maatregelen behoeven de goedkeuring van de personen die het dagelijks beleid van
      een instelling bepalen.

      4 Een instelling draagt zorg voor een systematische toetsing van de gedragslijnen, procedures en maatregelen en
      draagt waar nodig zorg voor een bijstelling hiervan.


