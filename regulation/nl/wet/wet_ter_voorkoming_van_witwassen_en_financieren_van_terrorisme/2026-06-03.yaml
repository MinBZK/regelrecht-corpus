      1 De toezichthoudende autoriteit verstrekt, indien zij deelneemt aan een samenwerkingsverband als bedoeld in de
      [Wet gegevensverwerking door samenwerkingsverbanden][ref1], in afwijking van [artikel 22, eerste lid][ref2], aan
      het samenwerkingsverband gegevens of inlichtingen, die ingevolge deze wet zijn verstrekt of ontvangen of van een
      buitenlandse toezichthoudende instantie zijn ontvangen, en die behoren tot de in [hoofdstuk 2 van die wet][ref3]
      of bij algemene maatregel van bestuur op grond van die wet aangewezen categorieën, voor zover dat noodzakelijk is
      voor het doel van dat samenwerkingsverband, tenzij naar het oordeel van de toezichthoudende autoriteit zwaarwegende
      redenen zich daartegen verzetten.

      2 Indien voor de verstrekking aan bepaalde partijen op grond van de [artikelen 22 tot en met 22c][ref4] bijzondere
      regels gelden, geschiedt de in het eerste lid bedoelde verstrekking steeds met inachtneming van die regels.

      3 Bij algemene maatregel van bestuur kunnen voorwaarden en beperkingen worden gesteld aan de verstrekkingen op
      grond van dit artikel.


