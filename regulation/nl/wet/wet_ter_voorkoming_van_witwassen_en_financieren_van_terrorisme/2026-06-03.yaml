  - number: '23'
    text: |-
      1 Een instelling en de personen die werkzaam zijn voor een instelling zijn, behoudens voor zover uit deze wet de
      noodzaak tot bekendmaking voortvloeit, verplicht tot geheimhouding jegens een ieder van:

      a. een melding ingevolge [artikel 16][ref1] door die instelling;

      b. nadere inlichtingen verstrekt ingevolge [artikel 17][ref2] door die instelling;

      c. het gegeven dat een melding of verstrekking aanleiding heeft gegeven tot een onderzoek naar witwassen van geld
      of financieren van terrorisme of dat het voornemen bestaat een dergelijk onderzoek te verrichten;

      d. overleg over de naleving van [artikel 16][ref3] met betrekking tot een transactie.

      2 De instelling die ingevolge [artikel 13, onderdeel c][ref4], gegevens of inlichtingen verkrijgt, is verplicht tot
      geheimhouding daarvan.

      3 Een instelling kan de rechten, bedoeld in artikel 15 van de Algemene verordening gegevensbescherming, buiten
      toepassing laten voor zover zulks noodzakelijk en evenredig is ter naleving van het bepaalde in het eerste en
      tweede lid.

      4 Een ieder die kennis neemt van gegevens waarvan hij weet of redelijkerwijs moet vermoeden dat ter zake op een
      instelling de geheimhoudingsplicht, bedoeld in het eerste of tweede lid, rust, is verplicht tot geheimhouding
      hiervan, behoudens voor zover uit deze wet de noodzaak tot bekendmaking voortvloeit.

      5 De in het eerste en derde lid bedoelde geheimhoudingsplicht is niet van toepassing op een mededeling gedaan door
      een instelling als bedoeld in [artikel 1a, vierde lid, onderdelen a tot en met e][ref5], aan een cliënt met als
      doel deze te doen afzien van een onwettige handeling.

      6 Het eerste lid is niet van toepassing op mededelingen:

      1°. tussen instellingen als bedoeld in [artikel 1a, tweede en derde lid][ref6], gevestigd in een
      lidstaat en die tot dezelfde groep behoren, alsmede tussen deze instellingen en hun bijkantoren of
      meerderheidsdochterondernemingen, die zijn gevestigd in een andere lidstaat of een staat die geen lidstaat is,
      voor zover het bijkantoor of de meerderheidsdochteronderneming voldoet aan de op het niveau van de groep geldende
      gedragslijnen en procedures, bedoeld in [artikel 2f, derde lid][ref7] en de op het niveau van de groep geldende
      gedragslijnen en procedures voldoen aan de voorschriften van deze wet;

      2°. tussen instellingen als bedoeld in [artikel 1a, vierde lid, onderdelen a tot en met e][ref8], gevestigd in
      een lidstaat of een derde land, die hun werkzaamheden, al dan niet als werknemer, uitoefenen binnen eenzelfde
      rechtspersoon of netwerk;

      3°. van een instelling als bedoeld in
      [artikel 1a, tweede lid, derde lid, onderdelen a, c, d, g, i en j, en vierde lid, onderdeel a tot en met e][ref9],
      aan een instelling behorende tot dezelfde categorie, voor zover:

      a. de mededeling betrekking heeft op een cliënt van beide instellingen en een transactie waarbij beide instellingen
      betrokken zijn;

      b. de andere instelling is gevestigd in een lidstaat of een derde land dat eisen stelt die gelijkwaardig zijn op
      het gebied van het beroepsgeheim en de bescherming van persoonsgegevens;

      c. de mededeling uitsluitend is bedoeld ter voorkoming van witwassen en financieren van terrorisme.

      7 Voor de toepassing van het zesde lid wordt verstaan onder:

        - *netwerk:* de grotere structuur waartoe de persoon behoort en die eigendom, beheer en controle op de naleving van
      de verplichtingen gezamenlijk deelt;
        - *derde land:* een door Onze Minister van Financiën aangewezen staat waar eisen zijn gesteld die gelijkwaardig
      zijn aan de eisen gesteld bij of krachtens deze wet en waar toezicht wordt uitgeoefend op de naleving van die
      voorschriften.


