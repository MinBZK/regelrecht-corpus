    text: |-
      1 Onverminderd [artikel 4][ref1] is het een instelling verboden een zakelijke relatie aan te gaan met of een
      transactie uit te voeren voor een cliënt, tenzij:

      a. zij zelf ten aanzien van die cliënt onderzoek heeft verricht conform [artikel 3][ref2], of ten aanzien van die
      cliënt onderzoek is verricht conform artikel 3 of op daarmee overeenkomende wijze door:

      1°. een instelling als bedoeld in [artikel 1a, vierde lid, onderdelen a tot en met e][ref3], met zetel in Nederland
      of een andere lidstaat;

      2°. een instelling als bedoeld in [artikel 1a, vierde lid, onderdeel f][ref4],
      waaraan een vergunning als bedoeld in [artikel 3, eerste en tweede lid][ref5], of
      [artikel 4, eerste lid, onderdeel c, van de Wet toezicht trustkantoren 2018][ref6] is verleend;

      3°. een instelling als bedoeld in [artikel 1a, tweede lid en derde lid][ref7], of een bijkantoor daarvan met zetel
      onderscheidenlijk vestigingsplaats in Nederland of een andere lidstaat;

      4°. een instelling als bedoeld onder 1° of 3°, met zetel in een door Onze Minister van Financiën aangewezen staat
      die geen lidstaat is, in welke staat wettelijke voorschriften van toepassing zijn die gelijkwaardig zijn aan het
      bepaalde in [artikel 3, tweede tot en met vijfde en zevende lid][ref8], en [artikel 8, eerste lid][ref9], en er
      toezicht wordt uitgeoefend op de naleving van die voorschriften, of een bijkantoor van de instelling in Nederland;

      5°. een bijkantoor of meerderheidsdochteronderneming, gevestigd in een staat die geen lidstaat is, van een
      instelling als bedoeld onder 1° of 3° met vestiging in Nederland of in een andere lidstaat, indien het bijkantoor
      of de meerderheidsdochteronderneming deel uitmaakt van dezelfde groep en volledig voldoet aan de op het niveau van
      de groep geldende gedragslijnen en procedures overeenkomstig [artikel 2f, eerste tot en met derde lid][ref10];

      b. dit onderzoek heeft geleid tot het in
      [artikel 3, tweede lid, aanhef en onderdelen a, b, c, e en f, derde en vierde lid][ref11] bedoelde resultaat; en

      c. de instelling beschikt over alle identificatie- en verificatiegegevens en overige gegevens inzake de identiteit
      van de in [artikel 3, tweede, derde en vierde lid][ref12], bedoelde personen.

      2 De toezichthoudende autoriteit kan toestaan dat een instelling, dan wel een bijkantoor of dochteronderneming
      in Nederland van een instelling met zetel buiten Nederland, het bepaalde in het eerste lid naleeft via de op het
      niveau van de groep geldende gedragslijnen en procedures, indien:

      a. de instelling zich verlaat op informatie verstrekt door een derde die deel uitmaakt van dezelfde groep;

      b. die groep cliëntenonderzoeksmaatregelen, regels inzake bewaring van bewijsstukken en programma’s ter bestrijding
      van witwassen en terrorismefinanciering toepast overeenkomstig de bij of krachtens deze wet gestelde regels; en

      c. op de effectieve uitvoering van de in onderdeel b bedoelde voorschriften op het niveau van de groep toezicht
      wordt uitgeoefend door een bevoegde autoriteit van de lidstaat van herkomst of van een staat die geen lidstaat is.

      3 Indien een instelling met betrekking tot een zakelijke relatie niet kan voldoen aan
      [artikel 3, eerste tot en met vierde en dertiende lid, onderdeel a][ref13], beëindigt de instelling die zakelijke
      relatie.

      4 Het eerste tot en met derde lid zijn niet van toepassing op de gevallen als bedoeld in de [artikelen 6][ref14]
      en [7][ref15].

      5 Het is een bank of andere financiële onderneming verboden een correspondentrelatie aan te gaan of voort te
      zetten met een shellbank of met een bank of andere financiële onderneming waarvan bekend is dat deze een shellbank
      toestaat van haar rekeningen gebruik te maken.


