      1 Op overtredingen die hebben plaatsgevonden of zijn aangevangen voor het tijdstip van inwerkingtreding van
      de [Implementatiewet vierde anti-witwasrichtlijn][ref1], zijn de [artikelen 32e tot en met 32j][ref2] niet van
      toepassing.

      2 In afwijking van het eerste lid wordt in het geval van een overtreding, begaan door een instelling als bedoeld
      in [artikel 1a, tweede lid of derde lid, onderdeel c][ref3], en waarop artikel 28a van deze wet, zoals dat luidde
      voor het tijdstip van inwerkingtreding van de [Implementatiewet vierde anti-witwasrichtlijn][ref4], van toepassing
      is, een besluit tot het publiceren van een waarschuwing of verklaring na het tijdstip van inwerkingtreding van de
      Implementatiewet vierde anti-witwasrichtlijn genomen met inachtneming van de [artikelen 32h][ref5], [32i][ref6]
      en [32j][ref7].


