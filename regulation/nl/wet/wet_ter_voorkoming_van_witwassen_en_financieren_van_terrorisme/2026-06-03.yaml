      1 Er is een Commissie inzake de meldingsplicht van ongebruikelijke transacties.

      2 De commissie treedt periodiek in overleg met vertegenwoordigers van Onze Minister van Justitie en Onze Minister
      van Financiën over:

      a. de inrichting en uitvoering van de meldingsplicht;

      b. de vaststelling van de indicatoren bedoeld in [artikel 15][ref1].

      3 Bij ministeriële regeling worden regels gesteld met betrekking tot de samenstelling en de organisatie van de
      commissie.


