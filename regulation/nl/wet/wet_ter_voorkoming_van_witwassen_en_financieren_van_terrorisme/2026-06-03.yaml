      1 In afwijking van [artikel 1, eerste lid][ref1], wordt in deze paragraaf onder uiteindelijk
      belanghebbende verstaan: de natuurlijke persoon die de uiteindelijke eigenaar is van of
      zeggenschap heeft over een vennootschap of andere juridische entiteit dan wel over een trust
      of een soortgelijke juridische constructie als bedoeld in [artikel 2, derde lid][ref2], en
      __REF002___________________________________________________________________________________________________________
      ___________________.

      2 In deze paragraaf wordt onder vennootschap of andere juridische entiteit verstaan: een in Nederland opgerichte
      vennootschap of andere juridische entiteit die een van de volgende rechtsvormen heeft:

      a. een besloten vennootschap met beperkte aansprakelijkheid of een naamloze vennootschap, niet zijnde
      een vennootschap die als uitgevende instelling is onderworpen aan openbaarmakingsvereisten als bedoeld in
      [Richtlijn 2004/109/EG](32004L0109) van het Europees Parlement en de Raad van 15 december 2004 betreffende
      transparantievereisten die gelden voor informatie over uitgevende instellingen waarvan effecten tot de handel op
      een gereglementeerde markt zijn toegelaten en tot wijziging van [Richtlijn 2001/34/EG](32001L0034) (PbEU 2004,
      L 390), dan wel aan vergelijkbare internationale standaarden met inbegrip van een 100 procent dochtermaatschappij
      van een dergelijke vennootschap, een Europese naamloze vennootschap met de statutaire zetel in Nederland en een
      Europese coöperatieve vennootschap met de statutaire zetel in Nederland;

      b. een kerkgenootschap;

      c. een vereniging, een vereniging van eigenaars, een onderlinge waarborgmaatschappij, een coöperatie of een
      stichting;

      d. een maatschap, een commanditaire vennootschap, een vennootschap onder firma, een rederij of een Europese
      economisch samenwerkingsverband;

      e. overige privaatrechtelijke rechtspersoon als bedoeld in
      [artikel 6, eerste lid, onderdeel b, van de Handelsregisterwet 2007][ref4].

      3 In deze paragraaf wordt onder een trust of soortgelijke juridische constructie verstaan: een
      trust of soortgelijke juridische constructie als bedoeld in [artikel 2, derde lid][ref5], en
      __REF001___________________________________________________________________________________________________________
      ___________________.

      4 In deze paragraaf wordt een soortgelijke juridische constructie gelijkgesteld aan een trust en wordt onder een
      trustee mede verstaan degene die in een soortgelijke juridische constructie een vergelijkbare positie heeft als een
      trustee in een trust.

      5 Bij algemene maatregel van bestuur worden de categorieën natuurlijke personen aangewezen die in elk geval moeten
      worden aangemerkt als uiteindelijk belanghebbende als bedoeld in het eerste lid.


