    text: |-
      1 Een instelling die op grond van [artikel 16, eerste lid][ref1], een verrichte of voorgenomen ongebruikelijke
      transactie heeft gemeld, legt op opvraagbare wijze de volgende gegevens vast:

      a. alle gegevens, bedoeld in [artikel 16, tweede lid][ref2], die noodzakelijk zijn om de desbetreffende transactie
      te kunnen reconstrueren;

      b. een afschrift van de melding, bedoeld in [artikel 16, eerste lid][ref3], alsmede de daarbij verstrekte
      informatie en gegevens;

      c. het bericht van de Financiële inlichtingen eenheid van ontvangst van deze melding, als bedoeld in
      [artikel 13, onderdeel c][ref4].

      2 Een instelling bewaart de in het eerste lid bedoelde gegevens op toegankelijke wijze gedurende vijf jaar na
      het tijdstip van het doen van de melding, respectievelijk het tijdstip van de ontvangst van het bericht van de
      Financiële inlichtingen eenheid.


