  - number: '15'
    text: |-
      1 Bij algemene maatregel van bestuur worden, zo nodig per daarbij te onderscheiden categorieën transacties,
      indicatoren vastgesteld aan de hand waarvan wordt beoordeeld of een transactie wordt aangemerkt als een
      ongebruikelijke transactie.

      2 Indien het spoedeisende belang dat vereist, kunnen bij regeling van Onze Minister van Financiën en Onze Minister
      van Justitie gezamenlijk de indicatoren, bedoeld in het eerste lid, worden vastgesteld voor een termijn van ten
      hoogste zes maanden.
    url: https://wetten.overheid.nl/BWBR0024282/2026-06-03#Artikel15
  - number: '16'
    text: |-
      1 Een instelling meldt een verrichte of voorgenomen ongebruikelijke transactie onverwijld nadat het ongebruikelijke
      karakter van de transactie bekend is geworden, aan de Financiële inlichtingen eenheid.

      2 Bij een melding als bedoeld in het eerste lid verstrekt de instelling de volgende gegevens:

      a. de identiteit van de cliënt, de identiteit van de uiteindelijk belanghebbenden en, voor zover mogelijk, de
      identiteit van degene ten behoeve van wie de transactie wordt uitgevoerd;

      b. de aard en het nummer van het identiteitsbewijs van de cliënt en, voorzover mogelijk, van de overige in
      onderdeel a bedoelde personen;

      c. de aard, het tijdstip en de plaats van de transactie;

      d. de omvang en de bestemming en herkomst van de gelden, effecten, edele metalen of andere waarden die bij de
      transactie betrokken zijn;

      e. de omstandigheden op grond waarvan de transactie als ongebruikelijk wordt aangemerkt;

      f. een omschrijving van de desbetreffende zaken van grote waarde bij een transactie boven de € 10.000;

      g. aanvullende, bij algemene maatregel van bestuur aan te wijzen, gegevens.

      3 In afwijking van het tweede lid verstrekt een instelling als bedoeld in
      [artikel 1a, vierde lid, onderdeel m][ref1], de gegevens bedoeld in het tweede lid voor zover zij daarover
      beschikt, alsmede een beschrijving van de desbetreffende onroerende zaken en rechten waaraan onroerende zaken zijn
      onderworpen.

      4 De meldingsplicht, bedoeld in het eerste lid, is van overeenkomstige toepassing indien:

      a. een cliëntenonderzoek als bedoeld in [artikel 3, eerste lid][ref2], niet leidt tot het in
      [artikel 5, eerste lid, onderdeel b][ref3], bedoelde resultaat of tot de uitvoering van de in artikel 3, veertiende
      lid, onderdeel a, bedoelde maatregelen, en er tevens indicaties zijn dat de desbetreffende cliënt betrokken is bij
      witwassen of financieren van terrorisme;

      b. een zakelijke relatie wordt beëindigd ingevolge [artikel 5, derde lid][ref4], en er tevens indicaties zijn dat
      de desbetreffende cliënt betrokken is bij witwassen of financieren van terrorisme.

      5 Bij een melding ingevolge het vierde lid verstrekt een instelling naast de gegevens, bedoeld in het tweede lid,
      een beschrijving van de redenen waarom het vierde lid van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0024282#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0024282#Artikel5
