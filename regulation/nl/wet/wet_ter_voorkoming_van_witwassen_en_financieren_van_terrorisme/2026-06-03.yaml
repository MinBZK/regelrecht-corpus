    text: |-
      1 Bij de Financiële inlichtingen eenheid kunnen persoonsgegevens worden verwerkt ten behoeve van de taak, bedoeld
      in [artikel 13][ref1].

      2 Bij algemene maatregel van bestuur worden regels gesteld over de categorieën van personen waarover de Financiële
      inlichtingen eenheid gegevens verwerkt, de gegevensverstrekking en verbanden met andere verzamelingen van
      persoonsgegevens, de bewaring en vernietiging van gegevens en de protocolplicht.

      3 Op de verwerking van persoonsgegevens door de Financiële inlichtingen eenheid zijn de [artikelen 1][ref2],
      [2][ref3], [3, eerste en tweede lid][ref4], [4][ref5], [4a][ref6], [4b][ref7], [4c][ref8], [5][ref9],
      [6][ref10], [6a][ref11], [6b][ref12], [6c][ref13], [7][ref14], [7a][ref15], [15][ref16], [15a][ref17],
      [16, eerste lid, onderdelen a en b][ref18], [17][ref19], [17a][ref20], [18][ref21], [22][ref22] en [23][ref23],
      [24a tot en met 33b][ref24], alsmede de [artikelen 35 tot en met 36 van de Wet politiegegevens][ref25]
      van overeenkomstige toepassing, met dien verstande dat voor de Financiële inlichtingen eenheid als
      verwerkingsverantwoordelijke in de zin van artikel 1, onderdeel f, van die wet wordt aangemerkt Onze Minister van
      Justitie en Veiligheid.


