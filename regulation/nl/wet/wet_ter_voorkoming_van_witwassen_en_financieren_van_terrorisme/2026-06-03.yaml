  - number: 9a
    text: |-
      Onze Minister van Financiën en Onze Minister van Justitie en Veiligheid gezamenlijk stellen een lijst met de
      functies vast die in Nederland kwalificeren als prominente publieke functies. Deze lijst wordt actueel gehouden.
    url: https://wetten.overheid.nl/BWBR0024282/2026-06-03#Artikel9a
  - number: '10'
    text: |-
      1 Een instelling kan het cliëntenonderzoek, bedoeld in [artikel 3, eerste lid][ref1], voor zover het betrekking
      heeft op het in het tweede lid, onderdelen a, b, c, e en f, van dat artikel bepaalde, laten verrichten door een
      derde in het kader van een uitbesteding- of agentuurovereenkomst, onverminderd haar verplichting om te voldoen aan
      het in die onderdelen bepaalde.

      2 Indien de in het eerste lid bedoelde uitbesteding een structureel karakter heeft legt de instelling de opdracht
      daartoe schriftelijk vast.


