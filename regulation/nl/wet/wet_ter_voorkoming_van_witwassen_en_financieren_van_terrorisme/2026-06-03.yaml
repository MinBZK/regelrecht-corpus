  - number: '7'
    text: |-
      1 De [artikelen 3, tweede lid, onderdelen a tot en met c, e en f][ref1], en [4][ref2] zijn niet van toepassing
      voor zover een instelling een zakelijke relatie aangaat of een transactie verricht met betrekking tot elektronisch
      geld en:

      a. het elektronisch geld waarop de geldwaarde is opgeslagen niet kan worden heropgeladen of een
      betalingstransactielimiet heeft van € 150 per maand en uitsluitend in Nederland kan worden gebruikt;

      b. de opgeslagen geldwaarde van het elektronisch geld niet meer dan € 150 bedraagt;

      c. het elektronisch geld uitsluitend wordt gebruikt voor de aankoop van goederen of diensten;

      d. de opgeslagen geldwaarde van het elektronisch geld niet kan worden aangevuld met anoniem elektronisch geld; en

      e. de uitgever van het elektronisch geld zorgt voor een toereikende controle van de transacties of de zakelijke
      relatie om te verzekeren dat kan worden voldaan aan het bepaalde in [artikel 16][ref3].

      2 Een instelling verzamelt voldoende gegevens om te kunnen vaststellen of het eerste lid van toepassing is.

      3 Het eerste lid is niet van toepassing indien sprake is van terugbetaling in contanten of opname in contanten van
      de monetaire waarde van het elektronisch geld en het terug te betalen bedrag hoger is dan € 50, of indien sprake
      is van een betalingstransactie op afstand als bedoeld in artikel 4, onderdeel 6, van de richtlijn betaaldiensten en
      het betaalde bedrag hoger is dan € 50 per transactie.

      4 Banken en andere financiële ondernemingen accepteren enkel betalingen verricht met anonieme prepaidkaarten die
      zijn uitgegeven in derde landen, indien deze kaarten voldoen aan eisen gelijkwaardig aan die van het eerste of
      derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel3
