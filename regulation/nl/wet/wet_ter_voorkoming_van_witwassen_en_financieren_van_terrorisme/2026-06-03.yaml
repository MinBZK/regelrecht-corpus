  - number: 32g
    text: |-
      1 Openbaarmaking op grond van [artikel 32f][ref1] wordt uitgesteld of geschiedt in zodanige vorm dat de openbaar te
      maken gegevens niet herleidbaar zijn tot afzonderlijke personen voor zover:

      a. die gegevens herleidbaar zijn tot een natuurlijke persoon en bekendmaking van zijn persoonsgegevens onevenredig
      zou zijn;

      b. betrokken partijen in onevenredige mate schade zou worden berokkend;

      c. een lopend strafrechtelijk onderzoek of een lopend onderzoek door de personen, bedoeld in [artikel 24][ref2],
      naar mogelijke overtredingen zou worden ondermijnd; of

      d. de stabiliteit van het financiële stelsel in gevaar zou worden gebracht.

      2 Openbaarmaking op grond van [artikel 32f][ref3] blijft achterwege, indien openbaarmaking overeenkomstig het
      eerste lid:

      a. onevenredig zou zijn gezien de geringe ernst van de overtreding, tenzij het een besluit tot het opleggen van een
      bestuurlijke boete betreft; of

      b. de stabiliteit van het financiële stelsel in gevaar zou brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel32f
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0024282#Artikel32f
    url: https://wetten.overheid.nl/BWBR0024282/2026-06-03#Artikel32g
