  - number: '19'
    text: |-
      1 Gegevens of inlichtingen die in overeenstemming met de [artikelen 16][ref1] of [17][ref2] te goeder trouw zijn
      verstrekt, kunnen niet dienen als grondslag voor of ten behoeve van een opsporingsonderzoek of een vervolging
      wegens verdenking van, of als bewijs ter zake van een tenlastelegging wegens witwassen of financieren van
      terrorisme door de instelling die deze gegevens of inlichtingen heeft verstrekt.

      2 Gegevens of inlichtingen die zijn verstrekt in de redelijke veronderstelling dat uitvoering wordt gegeven aan de
      [artikelen 16][ref3] of [17][ref4] kunnen niet dienen als grondslag voor of ten behoeve van een opsporingsonderzoek
      of een vervolging wegens verdenking van, of als bewijs ter zake van een tenlastelegging wegens, overtreding van
      [artikel 272 van het Wetboek van Strafrecht][ref5] door de instelling die deze gegevens of inlichtingen heeft
      verstrekt.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing ten aanzien van personen die werkzaam zijn voor een
      instelling die gegevens of inlichtingen heeft verstrekt als omschreven in het eerste of tweede lid en die daaraan
      hebben meegewerkt.


