  - number: '9'
    text: |-
      1 Onverminderd [artikel 8, eerste lid][ref1], verricht een instelling met betrekking tot transacties, zakelijke
      relaties en correspondentbankrelaties gerelateerd aan staten die op grond van artikel 9 van de vierde anti-
      witwasrichtlijn in gedelegeerde handelingen van de Europese Commissie zijn aangewezen als staten met een hoger
      risico op witwassen of financieren van terrorisme de volgende verscherpte onderzoeksmaatregelen:

      a. verzamelen van aanvullende informatie over die cliënten en uiteindelijk belanghebbenden;

      b. verzamelen van aanvullende informatie met betrekking tot het doel en de aard van die zakelijke relatie;

      c. verzamelen van informatie over de herkomst van de fondsen die bij die zakelijke relatie of transactie gebruikt
      worden en de bron van het vermogen van die cliënten en van die uiteindelijk belanghebbenden;

      d. verzamelen van informatie over de achtergrond van en beweegredenen voor de voorgenomen of verrichte transacties
      van die cliënten;

      e. verkrijgen van goedkeuring van het hoger leidinggevend personeel voor het aangaan of voortzetten van die
      zakelijke relatie;

      f. verrichten van verscherpte controle op die zakelijke relatie met en de transacties van die cliënten, door
      het aantal controles en de frequentie van actualiseringen van gegevens over die cliënten en die uiteindelijk
      belanghebbenden te verhogen en door transactiepatronen te selecteren die nader onderzocht moeten worden.

      2 In aanvulling op het eerste lid kan bij ministeriële regeling worden bepaald dat een instelling tevens één of
      meer van de volgende aanvullende risicobeperkende maatregelen toepast met betrekking tot cliënten die transacties
      uitvoeren die verband houden met staten als bedoeld in het eerste lid:

      a. toepassen van aanvullende elementen van verscherpt cliëntenonderzoek;

      b. invoeren van verscherpte meldmechanismen of het systematisch melden van financiële transacties;

      c. beperken van die transacties, zakelijke relaties of correspondentbankrelaties;

      d. niet uitvoeren van die transacties en beëindiging van die zakelijke relaties en correspondentbankrelaties;

      e. overige bij algemene maatregel van bestuur aan te wijzen maatregelen.

      3 In aanvulling op het eerste lid, kunnen bij ministeriële regeling ten aanzien van de in het eerste lid aangewezen
      staten tevens één of meer van de volgende maatregelen worden bepaald:

      a. vestigingsverbod voor dochterondernemingen of bijkantoren van instellingen afkomstig uit die staten;

      b. vestigingsverbod voor dochterondernemingen of bijkantoren van instellingen in die staten;

      c. uitvoeren van verscherpte controle op of toepassen van verscherpte eisen aan de uitvoering van een externe audit
      voor in die staten gevestigde dochterondernemingen of bijkantoren door een instelling;

      d. toepassen van hogere eisen aan de uitvoering van een externe audit voor groepen ten aanzien van in die staten
      gevestigde dochterondernemingen of bijkantoren door een instelling;

      e. herzien, wijzigen of beëindigen van zakelijke relaties en correspondentrelaties in die staten door banken en
      andere financiële ondernemingen;

      f. overige bij algemene maatregel van bestuur aan te wijzen maatregelen.

      4 In de regeling bedoeld in het tweede en derde lid, kan worden bepaald dat bij die regeling aangewezen
      instellingen één of meer van de maatregelen genoemd in het tweede en derde lid verrichten. Daarbij kan onderscheid
      worden gemaakt naar categorie instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel8
