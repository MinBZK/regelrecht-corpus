  - number: 32b
    text: |-
      1 Indien tegen een besluit tot het opleggen van een bestuurlijke boete bezwaar, beroep of hoger beroep wordt
      aangetekend, schorst dit de verplichting tot betaling van de boete totdat de beroepstermijn is verstreken of,
      indien beroep of hoger beroep is ingesteld, op het beroep of hoger beroep is beslist.

      2 De schorsing van de verplichting tot betaling schorst niet de berekening van de wettelijke rente.
    url: https://wetten.overheid.nl/BWBR0024282/2026-06-03#Artikel32b
  - number: 32c
    text: |-
      1 Bij een overtreding die beboetbaar is met een boete gerangschikt in de tweede of derde boetecategorie, bedoeld
      in [artikel 31, tweede lid][ref1], kan de toezichthoudende autoriteit de overtreder de bevoegdheid ontzeggen om bij
      een instelling als bedoeld in [artikel 1a][ref2] beleidsbepalende functies uit te oefenen.

      2 Indien de overtreding, bedoeld in het eerste lid, is begaan door een rechtspersoon, is het eerste lid van
      overeenkomstige toepassing op de natuurlijke personen die tot de betrokken gedraging opdracht hebben gegeven of
      daar feitelijk leiding aan hebben gegeven.

      3 Een ontzegging als bedoeld in het eerste lid kan worden opgelegd voor de duur van ten hoogste een jaar en eenmaal
      met ten hoogste een jaar worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
    url: https://wetten.overheid.nl/BWBR0024282/2026-06-03#Artikel32c
