  - number: '24'
    text: |-
      1 Met het toezicht op de naleving van de bij of krachtens deze wet gestelde regels zijn belast de bij besluit van
      de toezichthoudende autoriteit aangewezen personen. Van dat besluit wordt mededeling gedaan door plaatsing in de
      Staatscourant.

      2 In afwijking van het eerste lid, is de deken, bedoeld in [artikel 45a, eerste lid, van de Advocatenwet][ref1],
      belast met het toezicht op de naleving van de bij of krachtens deze wet gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel45a
    url: https://wetten.overheid.nl/BWBR0024282/2026-06-03#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 45a
  - number: '25'
    text: |-
      1 Indien de medewerkers van een toezichthoudende autoriteit, dan wel de in [artikel 24, tweede lid][ref1], bedoelde
      deken, bij de uitoefening van hun taak op grond van deze wet of enige andere wet feiten ontdekken die kunnen duiden
      op witwassen of financieren van terrorisme, licht de toezichthoudende autoriteit onder wiens verantwoordelijkheid
      zij hun taak uitoefenen, dan wel de in artikel 24, tweede lid, bedoelde deken, de Financiële inlichtingen eenheid
      in, zo nodig in afwijking van de toepasselijke wettelijke geheimhoudingsbepalingen, voor zover de gegevens of
      inlichtingen dienstig zijn voor de uitoefening van de wettelijke taken van de Financiële inlichtingen eenheid.

      2 Het eerste lid is van overeenkomstige toepassing ten aanzien van medewerkers van De Nederlandsche Bank N.V.,
      voor zover zij betrokken zijn bij de verwisseling, intrekking en aftekening van bankbiljetten als bedoeld in
      [artikel 27, derde lid, van de Bankwet 1998][ref2]


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0009508#Artikel27
    url: https://wetten.overheid.nl/BWBR0024282/2026-06-03#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0009508
        artikel: '27'
  - number: '26'
    text: |-
      De [artikelen 111a, derde lid, van de Wet op het notarisambt][ref1] en
      [45a, tweede lid, van de Advocatenwet][ref2], zijn van overeenkomstige toepassing op het toezicht op de naleving
      door de personen die op grond van [artikel 24, eerste lid][ref3], door de toezichthoudende autoriteit, bedoeld in
      [artikel 1d, eerste lid, onderdeel c][ref4], zijn aangewezen, respectievelijk op het toezicht op de naleving door
      de deken, bedoeld in artikel 24, tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel111a
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel45a
      [ref3]: https://wetten.overheid.nl/BWBR0024282#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0024282#Artikel1d
    url: https://wetten.overheid.nl/BWBR0024282/2026-06-03#Artikel26
