  - number: 32f
    text: |-
      1 De toezichthoudende autoriteit maakt een besluit tot het opleggen van een bestuurlijke sanctie ingevolge deze wet
      of [artikel 5:20, derde lid, van de Algemene wet bestuursrecht][ref1] openbaar. De openbaarmaking geschiedt zodra
      het besluit onherroepelijk is geworden.

      2 Indien tegen een besluit als bedoeld in het eerste lid bezwaar, beroep of hoger beroep is ingesteld, wordt de
      uitkomst daarvan tezamen met het besluit openbaar gemaakt.

      3 In aanvulling op [artikel 5:2, eerste lid, onderdeel a, van de Algemene wet bestuursrecht][ref2] wordt onder
      bestuurlijke sanctie mede verstaan: het door de toezichthoudende autoriteit wegens een overtreding beëindigen of
      beperken van een recht of bevoegdheid alsmede het opleggen van een verbod.

      4 In afwijking van het eerste lid maakt de toezichthoudende autoriteit een besluit tot het opleggen van een
      bestuurlijke boete zo spoedig mogelijk openbaar, indien het een bestuurlijke boete betreft ter zake een overtreding
      van een voorschrift dat op grond van [artikel 31, tweede lid][ref3], is gerangschikt in de derde categorie.

      5 De toezichthoudende autoriteit maakt in afwijking van het eerste lid een besluit tot het
      opleggen van een last onder dwangsom ingevolge deze wet of [artikel 5:20, derde lid][ref4], juncto
      [artikel 5:32, eerste lid, van de Algemene wet bestuursrecht][ref5] zo spoedig mogelijk openbaar, indien een
      dwangsom wordt verbeurd.

      6 De toezichthoudende autoriteit maakt de indiening van een bezwaar of de instelling van een beroep of hoger beroep
      tegen een besluit als bedoeld in het vierde of vijfde lid, alsmede de beslissing op bezwaar en de uitkomst van
      dat beroep of hoger beroep, zo spoedig mogelijk openbaar, tenzij het besluit op grond van [artikel 32g][ref6] niet
      openbaar is gemaakt.

      7 Een besluit dat ingevolge het eerste, vierde of vijfde lid openbaar is gemaakt, blijft, tenzij bij wettelijk
      voorschrift anders bepaald, gedurende een periode van vijf jaar na bekendmaking beschikbaar op de website van de
      toezichthoudende autoriteit, met uitzondering van de persoonsgegevens die deel uitmaken van het besluit indien enig
      wettelijk voorschrift daaraan in de weg staat.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel520
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0024282#Artikel31
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel520
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel532
      [ref6]: https://wetten.overheid.nl/BWBR0024282#Artikel32g
