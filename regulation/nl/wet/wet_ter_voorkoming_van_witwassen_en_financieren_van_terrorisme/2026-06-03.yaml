  - number: '33'
    text: |-
      1 Een instelling die op grond van deze wet cliëntenonderzoek heeft verricht, of bij wie een cliënt is
      geïntroduceerd conform de procedure van [artikel 5][ref1], legt op opvraagbare wijze de documenten en gegevens
      vast die zijn gebruikt voor de naleving van het bepaalde in [artikel 3, tweede tot en met vierde lid][ref2],
      [artikel 3a, eerste lid][ref3], [artikel 6, eerste en tweede lid][ref4], [artikel 7, tweede lid][ref5], en
      [artikel 8, derde, vierde, zesde, zevende en negende lid][ref6].

      2 Onder de documenten en gegevens, bedoeld in het eerste lid, zijn ten minste begrepen:

      a. van natuurlijke personen, niet zijnde uiteindelijk belanghebbenden als bedoeld in [artikel 1, eerste lid][ref7]:

      1°. de geslachtsnaam, de voornamen, de geboortedatum, het adres en de woonplaats, dan wel de plaats van vestiging
      van de cliënt alsmede van degene die namens die natuurlijke persoon optreedt, of een afschrift van het document
      dat een persoonidentificerend nummer bevat en aan de hand waarvan de verificatie van de identiteit heeft
      plaatsgevonden;

      2°. de aard, het nummer en de datum en plaats van uitgifte van het document met behulp waarvan de identiteit is
      geverifieerd;

      b. van natuurlijke personen, zijnde uiteindelijk belanghebbenden als bedoeld in [artikel 1, eerste lid][ref8]:

      1°. de identiteit, waaronder ten minste de geslachtsnaam en voornamen van de uiteindelijk belanghebbende; en

      2°. de gegevens en documenten die zijn vergaard op basis van de redelijke maatregelen die zijn genomen om de
      identiteit van de uiteindelijk belanghebbende te verifiëren;

      c. van vennootschappen of andere juridische entiteiten:

      1°. de rechtsvorm, de statutaire naam, de handelsnaam, het adres met huisnummer, de postcode, de plaats van
      vestiging en het land van statutaire zetel;

      2°. indien de vennootschap of andere juridische entiteit bij de Kamer van Koophandel is geregistreerd, het
      registratienummer bij de Kamer van Koophandel en de wijze waarop de identiteit is geverifieerd;

      3°. van degenen die voor de vennootschap of juridische entiteit bij de instelling optreden: de geslachtsnaam, de
      voornamen en de geboortedatum.

      d. van trusts of andere juridische constructies:

      1°. het doel en de aard van de trust of andere juridische constructie;

      2°. het recht waardoor de trust of andere juridische constructie wordt beheerst.

      3 Een instelling bewaart de in het eerste en tweede lid bedoelde gegevens op toegankelijke wijze gedurende vijf
      jaar na het tijdstip van het beëindigen van de zakelijke relatie of gedurende vijf jaar na het uitvoeren van de
      desbetreffende transactie.

      4 Een instelling beschikt over systemen die haar in staat stellen onverwijld en volledig te reageren op vragen van
      de Financiële inlichtingen eenheid en van de toezichthoudende autoriteit, waaronder:

      a. de vraag of zij met een bepaalde cliënt een zakelijke relatie onderhoudt of gedurende een periode van vijf jaar
      voorafgaand aan het verzoek heeft onderhouden;

      b. vragen over de aard van de relatie met de bedoelde cliënt.

      5 De systemen, bedoeld in het vierde lid, voorzien in beveiligde kanalen die de vertrouwelijkheid van de in dat lid
      bedoelde verzoeken waarborgen.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel5
