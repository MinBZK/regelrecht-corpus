  - number: '31'
    text: |-
      1 Het bedrag van de bestuurlijke boete wordt bepaald bij algemene maatregel van bestuur, met dien verstande dat de
      bestuurlijke boete voor een afzonderlijke overtreding ten hoogste € 5.000.000, of, in gevallen als bedoeld in het
      vierde lid, ten hoogste € 10.000.000 bedraagt.

      2 De algemene maatregel van bestuur, bedoeld in het eerste lid, bepaalt bij elke daarin omschreven overtreding het
      maximale bedrag van de op te leggen bestuurlijke boete. De overtredingen worden gerangschikt in categorieën naar
      zwaarte van de overtreding met de daarbij behorende basisbedragen, minimumbedragen en maximumbedragen. Daarbij
      wordt de volgende indeling gebruikt:










                    Categorie


                    Basisbedrag


                    Minimumbedrag


                    Maximumbedrag






                    1


                    € 10.000,–


                    € 0,–


                    € 10.000,–




                    2


                    € 500.000,–


                    € 0,–


                    € 1.000.000,–




                    3


                    € 2.000.000,–


                    € 0,–


                    € 4.000.000,–






      3 In afwijking van het tweede lid, bedraagt het basisbedrag voor de bestuurlijke boete voor een overtreding
      die is gerangschikt in de derde categorie indien de boete wordt opgelegd aan een instelling als bedoeld in
      [artikel 1a, tweede, derde, of vierde lid, onderdeel f][ref1], of aan een beheerder als bedoeld in artikel 1a,
      zesde lid, € 2.500.000,– en is het maximumbedrag van de bestuurlijke boete € 5.000.000,–.

      4 Indien ten tijde van het plegen van de overtreding nog geen vijf jaren zijn verstreken sinds het opleggen van een
      bestuurlijke boete aan de overtreder ter zake van eenzelfde overtreding, bedraagt de bestuurlijke boete voor een
      afzonderlijke overtreding ten hoogste tweemaal het ingevolge het tweede of derde lid toepasselijke maximumbedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
    url: https://wetten.overheid.nl/BWBR0024282/2026-06-03#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 1a
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: '32'
    text: |-
      1 Indien de boete wordt opgelegd aan een instelling als bedoeld in
      [artikel 1a, tweede, derde, of vierde lid, onderdeel f][ref1], of aan een beheerder als bedoeld in artikel 1a,
      zesde lid, bedraagt de bestuurlijke boete voor een afzonderlijke overtreding van een voorschrift gerangschikt in
      de derde categorie, in afwijking van [artikel 31][ref2], ten hoogste 20% van de netto-omzet van de overtreder in
      het boekjaar voorafgaande aan de beschikking waarmee de bestuurlijke boete wordt opgelegd, indien dit meer is dan
      tweemaal het ingevolge artikel 31, derde lid, toepasselijke maximumbedrag.

      2 Indien de bestuurlijke boete wordt opgelegd aan een onderneming die opgenomen is in een groep met een
      geconsolideerde jaarrekening, worden bij de berekening van de netto-omzet de totaalbedragen gehanteerd uit de
      geconsolideerde jaarrekening van de uiteindelijke moederonderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel31
    url: https://wetten.overheid.nl/BWBR0024282/2026-06-03#Artikel32
    references:
