        artikel: 4:8
  - number: 32i
    text: |-
      1 De toezichthoudende autoriteit gaat pas over tot openbaarmaking op grond van [artikel 32e][ref1] of
      [32f, vierde of vijfde lid][ref2], nadat vijf werkdagen zijn verstreken na de dag waarop de betrokken persoon van
      het besluit tot het publiceren van een waarschuwing of verklaring in kennis is gesteld of het besluit tot opleggen
      van een boete of last onder dwangsom aan hem bekend is gemaakt.

      2 Indien wordt verzocht om een voorlopige voorziening als bedoeld in
      [artikel 8:81 van de Algemene wet bestuursrecht][ref3] om openbaarmaking op grond van deze paragraaf te voorkomen,
      wordt de openbaarmaking opgeschort totdat de voorzieningenrechter uitspraak heeft gedaan.

      3 De toezichthoudende autoriteit beëindigt het openbaar beschikbaar houden van gegevens die tot afzonderlijke
      personen herleidbaar zijn op grond van [artikel 32e][ref4] en [32f][ref5] onverwijld voor zover:

      a. het besluit tot openbaarmaking wordt ingetrokken;

      b. het besluit tot openbaarmaking door de bestuursrechter onherroepelijk wordt vernietigd.

      4 In de gevallen bedoeld in het derde lid, biedt de toezichthoudende autoriteit de belanghebbende aan de intrekking
      of de vernietiging openbaar te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel32e
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel32f
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel881
