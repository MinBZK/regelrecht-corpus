    text: |-
      1 Een instelling die op grond van [artikel 16][ref1] een melding heeft gedaan of op grond van [artikel 17][ref2]
      nadere inlichtingen heeft verstrekt in de redelijke veronderstelling uitvoering te geven aan die artikelen, is niet
      aansprakelijk voor enige schade die een derde dientengevolge lijdt.

      2 Het eerste lid is van overeenkomstige toepassing ten aanzien van personen die werkzaam zijn voor een instelling
      die een melding heeft gedaan of inlichtingen heeft verstrekt als omschreven in het eerste lid en die daaraan hebben
      meegewerkt.


