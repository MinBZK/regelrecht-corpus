  - number: '8'
    text: |-
      1 Een instelling verricht, onverminderd [artikel 3, tweede, derde en vierde lid][ref1], verscherpt
      cliëntenonderzoek indien en naar gelang een zakelijke relatie of transactie naar haar aard een hoger risico op
      witwassen of financieren van terrorisme met zich brengt. Bij algemene maatregel van bestuur kunnen categorieën
      zakelijke relaties en transacties worden aangewezen die naar hun aard een hoger risico op witwassen of financieren
      van terrorisme met zich brengen.

      2 Onverminderd het eerste lid neemt een instelling, indien een cliënt niet fysiek aanwezig is voor identificatie,
      maatregelen om het hogere risico te compenseren. De instelling kan aan de vorige volzin voldoen indien zij:

      a. de identiteit van de cliënt verifieert aan de hand van aanvullende documenten, gegevens of informatie;

      b. de overgelegde documenten beoordeelt op echtheid; of

      c. waarborgt dat de eerste betaling die met de zakelijke relatie of transactie verband houdt, wordt gedaan ten
      gunste of ten laste van een rekening van de cliënt bij een bank met zetel in een lidstaat of in een door Onze
      Minister van Financiën aangewezen staat die beschikt over een vergunning om in die lidstaat onderscheidenlijk die
      staat haar bedrijf te mogen uitoefenen.

      3 Onverminderd het eerste lid draagt een bank die een correspondentbankrelatie aangaat of is aangegaan met een bank
      in een staat die geen lidstaat is er zorg voor dat:

      a. zij voldoende informatie over de betrokken bank verzamelt om een volledig beeld te krijgen van de aard van haar
      bedrijfsactiviteiten, en op basis van openbaar beschikbare informatie de reputatie van de bank en de kwaliteit van
      het toezicht dat op de bank wordt uitgeoefend beoordeelt;

      b. zij de procedures en maatregelen ter voorkoming van witwassen en financieren van terrorisme van de betrokken
      bank beoordeelt;

      c. indien het een nieuwe correspondentbankrelatie betreft, de beslissing tot het aangaan van die relatie wordt
      genomen of goedgekeurd door personen die daartoe door de bank gemachtigd zijn;

      d. de verantwoordelijkheden van beide banken schriftelijk worden vastgelegd;

      e. de betrokken bank de cliënt heeft geïdentificeerd en zijn identiteit heeft geverifieerd en daarnaast doorlopend
      toezicht houdt op de cliënten die rechtstreeks toegang hebben tot transitrekeningen en dat deze in staat is om haar
      op verzoek de relevante cliëntgegevens te verstrekken.

      4 Een instelling draagt er zorg voor dat zij over op risico gebaseerde procedures beschikt om te bepalen of de
      cliënt een politiek prominent persoon is die niet in Nederland woont. Onverminderd het eerste lid draagt een
      instelling die een zakelijke relatie aangaat met of een transactie verricht voor een politiek prominente persoon
      die niet in Nederland woont, er tevens zorg voor dat:

      a. de beslissing tot het aangaan van die relatie of het verrichten van die transactie wordt genomen of wordt
      goedgekeurd door personen die daartoe door de instelling zijn gemachtigd;

      b. zij adequate maatregelen treft om de bron van het vermogen vast te stellen dat bij de zakelijke relatie of
      transactie wordt gebruikt; en

      c. zij doorlopend controle uitoefent op de zakelijke relatie.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel3
