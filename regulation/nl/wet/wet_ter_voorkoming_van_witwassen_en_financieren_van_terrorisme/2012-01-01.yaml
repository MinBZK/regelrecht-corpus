        bwb_id: BWBR0006331
  - number: '41'
    text: |-
      1 Met het toezicht op de naleving van de regels, gesteld bij of krachtens de
      [Wet identificatie bij dienstverlening][ref1] en de [Wet melding ongebruikelijke transacties][ref2], zijn belast de
      op grond van [artikel 24, eerste lid][ref3], aangewezen personen.

      2 De personen die op grond van [artikel 24, eerste lid][ref4], zijn belast met het toezicht op de naleving
      van deze wet, kunnen na inwerkingtreding van deze wet tot drie jaren na de dag waarop de overtreding is
      begaan een bestuurlijke boete opleggen terzake van overtreding van een voorschrift gesteld bij of krachtens de
      [Wet identificatie bij dienstverlening][ref5] of de [Wet melding ongebruikelijke transacties][ref6].

      3 Op een bestuurlijke boete als bedoeld in het tweede lid blijft het recht van toepassing dat gold voor het
      tijdstip van inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006330
      [ref2]: https://wetten.overheid.nl/BWBR0006331
