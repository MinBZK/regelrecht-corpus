    text: |-
      1 Bij het meldpunt kunnen persoonsgegevens worden verwerkt ten behoeve van de taak, bedoeld in [artikel 13][ref1].

      2 Bij algemene maatregel van bestuur worden regels gesteld over de categorieën van personen waarover het meldpunt
      gegevens verwerkt, de gegevensverstrekking, de bewaring en vernietiging van gegevens en de protocolplicht.

      3 Op de verwerking van persoonsgegevens door het meldpunt zijn de [artikelen 1][ref2], [2][ref3],
      [3, eerste en tweede lid][ref4], [4][ref5], [5][ref6], [6][ref7], [7][ref8], [15][ref9],
      [16, eerste lid, onderdelen a, b en c][ref10], [17][ref11], [18][ref12], [22][ref13] en [23][ref14],
      [25 tot en met 31][ref15], alsmede [artikel 33 van de Wet politiegegevens][ref16] van overeenkomstige
      toepassing, met dien verstande dat voor het meldpunt als verantwoordelijke in de zin van
      [artikel 1, onderdeel f, van die wet][ref17] wordt aangemerkt Onze Minister van Justitie.


