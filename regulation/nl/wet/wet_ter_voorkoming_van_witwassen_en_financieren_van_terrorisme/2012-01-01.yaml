  - number: '11'
    text: |-
      1 Indien de cliënt een natuurlijke persoon is, wordt diens identiteit geverifieerd aan de hand van documenten,
      gegevens of inlichtingen uit betrouwbare en onafhankelijke bron. Bij ministeriële regeling kunnen documenten,
      gegevens of inlichtingen worden aangewezen op basis waarvan kan worden voldaan aan het in de vorige zin bepaalde.

      2 Indien de cliënt een rechtspersoon is opgericht naar Nederlands recht en in Nederland zijn zetel heeft of een
      buitenlandse rechtspersoon is die in Nederland is gevestigd, wordt diens identiteit geverifieerd aan de hand van
      documenten, gegevens of inlichtingen uit betrouwbare en onafhankelijke bron. Bij ministeriële regeling kunnen
      documenten, gegevens of inlichtingen worden aangewezen op basis waarvan kan worden voldaan aan het in de vorige
      zin bepaalde.

      3 Indien de cliënt een buitenlandse rechtspersoon is die niet in Nederland is gevestigd, wordt de identiteit
      geverifieerd op basis van betrouwbare en in het internationale verkeer gebruikelijke documenten, gegevens of
      inlichtingen of op basis van documenten, gegevens of inlichtingen die bij wet als geldig middel voor identificatie
      zijn erkend in de staat van herkomst van de cliënt.

      4 Bij ministeriële regeling kunnen regels worden vastgesteld met betrekking tot het verifiëren van de identiteit
      van cliënten die niet onder het eerste tot en met het derde lid vallen.
