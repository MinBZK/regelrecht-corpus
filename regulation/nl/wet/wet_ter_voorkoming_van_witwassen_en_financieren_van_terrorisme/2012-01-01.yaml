      waarvan de identiteit reeds is geverifieerd, ingevolge [artikel 3][ref2] of op daarmee overeenkomende wijze, door:

      a. een instelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 11° tot en met 13°][ref3], met zetel
