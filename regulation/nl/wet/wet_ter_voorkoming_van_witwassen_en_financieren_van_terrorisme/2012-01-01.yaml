      1 [Artikel 3, eerste lid, derde lid, aanhef en onderdelen a, b en d, en vierde lid][ref1], en
      [artikel 4, eerste lid][ref2], zijn niet van toepassing ten aanzien van de volgende cliënten:

      a. instellingen als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1° tot en met 8°, 18° en 19°][ref3],
      met zetel in Nederland of in een andere lidstaat;

      b. instellingen als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1° tot en met 9°, 18° en 19°][ref4],
      met zetel in een staat die geen lidstaat is, indien in die staat op de instelling
      wettelijke voorschriften van toepassing zijn die gelijkwaardig zijn aan het bepaalde in de
      [artikelen 3, tweede lid, derde lid, aanhef en onderdelen a, b, c en d, en vierde lid][ref5], en
      [artikel 8, eerste lid][ref6], en er toezicht wordt uitgeoefend op de naleving van die voorschriften;

      c. rechtspersonen die effecten hebben uitgegeven die in een lidstaat zijn toegelaten tot de handel op een
      gereglementeerde markt als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref7];

      d. rechtspersonen die effecten hebben uitgegeven in een staat die geen lidstaat is, zijn toegelaten tot de handel
      op een markt in financiële instrumenten als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref8],
      en die daarbij zijn onderworpen aan openbaarmakingsvereisten die overeenkomen met die van [richtlijn nr. 2004/109]
      (32004L0109) van het Europees Parlement en de Raad van de Europese Unie van 15 december 2004 betreffende de
      transparantievereisten die gelden voor informatie over uitgevende instellingen waarvan effecten tot de handel op
      een gereglementeerde markt zijn toegelaten en tot wijziging van [Richtlijn 2001/34/EG](32001L0034) (PbEU L 390);

      e. cliënten die tijdelijk gelden aanhouden op rekeningen op naam van notarissen, advocaten en andere onafhankelijke
      beoefenaren van juridische beroepen. Voor zover de rekeninghouders niet in een lidstaat gevestigd zijn, is deze
      bepaling slechts van toepassing indien op hen wettelijke voorschriften van toepassing zijn ter voorkoming van
      witwassen en financieren van terrorisme die overeenkomen met het bepaalde in deze wet en de informatie over de
      identiteit van de cliënten op verzoek beschikbaar is voor de desbetreffende instelling;

      f. Nederlandse overheidsinstanties;

      g. instanties:

      1°. die zijn belast met openbare functies uit hoofde van het Verdrag betreffende de Europese Unie, de verdragen tot
      oprichting van de Europese Gemeenschappen of de afgeleide communautaire wetgeving;

      2°. waarvan de identiteit bekend is;

      3°. waarvan de activiteiten en boekhoudkundige praktijken transparant zijn; en

      4°. die verantwoording schuldig zijn aan een instelling van de Europese Gemeenschappen of aan een
      overheidsinstantie van een lidstaat of ten aanzien waarvan andere gepaste procedures bestaan om de activiteiten
      te controleren.

      2 Een instelling verzamelt voldoende gegevens om te kunnen vaststellen of het eerste lid op een cliënt van
      toepassing is.

      3 Bij algemene maatregel van bestuur kunnen categorieën cliënten worden aangewezen waarop het eerste lid van
      overeenkomstige toepassing is.

      4 Onze Minister van Financiën wijst de staten aan als bedoeld in het eerste lid, onderdeel b.


