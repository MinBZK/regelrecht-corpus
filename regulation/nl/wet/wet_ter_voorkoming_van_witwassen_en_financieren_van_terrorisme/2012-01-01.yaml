    text: |-
      1 Een instelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°, 2°, 3°, 5°, 6°, 7°, 8°, 18° of 19°][ref1], die
      een bijkantoor of een dochtermaatschappij heeft in een staat die geen lidstaat is, draagt er zorg voor
      dat het bijkantoor onderscheidenlijk de dochtermaatschappij cliëntenonderzoek verricht dat gelijkwaardig
      is aan dat, geregeld in [artikel 3, eerste tot en met het vierde lid][ref2], en gegevens met betrekking
      tot het cliëntenonderzoek vastlegt en bewaart op een wijze die gelijkwaardig is aan hetgeen is geregeld in
      [artikel 33][ref3].

      2 Indien het recht van de betrokken staat toepassing van het eerste lid niet toelaat, stelt de instelling degene
      die ingevolge [artikel 24][ref4] belast is met het toezicht op de naleving van deze wet door de instelling daarvan
      in kennis en neemt zij maatregelen om het risico van witwassen en financieren van terrorisme te voorkomen.


