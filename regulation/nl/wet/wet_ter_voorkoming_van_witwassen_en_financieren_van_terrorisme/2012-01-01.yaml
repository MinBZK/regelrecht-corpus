        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '22'
    text: |-
      Het is aan een ieder die uit hoofde van de toepassing van deze wet of van krachtens deze wet genomen besluiten
      enige taak vervult of heeft vervuld verboden van gegevens of inlichtingen, die ingevolge deze wet zijn verstrekt
      of ontvangen, verder of anders gebruik te maken of daaraan verder of anders bekendheid te geven dan voor de
      uitoefening van zijn taak of door deze wet wordt geëist.
    url: https://wetten.overheid.nl/BWBR0024282/2012-01-01#Artikel22
  - number: '23'
    text: |-
      1 Een instelling die ingevolge [artikel 16][ref1] een melding heeft gedaan of die ingevolge [artikel 17][ref2]
      nadere informatie heeft verstrekt, is verplicht tot geheimhouding hiervan, alsmede van het gegeven dat deze
      melding of verstrekking aanleiding kan geven tot nader onderzoek, behoudens voor zover uit deze wet de noodzaak tot
      bekendmaking voortvloeit.

      2 De instelling die ingevolge [artikel 13, onderdeel c][ref3], gegevens of inlichtingen verkrijgt, is verplicht tot
      geheimhouding daarvan.

      3 De in het eerste lid bedoelde geheimhoudingsplicht is niet van toepassing op een mededeling gedaan door een
      instelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 11°, 12° en 13°][ref4], aan een cliënt met
      als doel deze te doen afzien van een onwettige handeling.

      4 Een instelling kan, in afwijking van het eerste lid, mededelingen doen aan:

      a. instellingen die behoren tot hetzelfde financieel conglomeraat als bedoeld in
      [artikel 3:290 van de Wet op het financieel toezicht][ref5] en die tenminste hebben voldaan aan de verplichting tot
      het vereenvoudigd cliëntenonderzoek, bedoeld in de [artikelen 6][ref6] en [7][ref7];

      b. instellingen als bedoeld in [artikel 1, eerste lid, onderdeel a][ref8], met zetel in een lidstaat of een staat
      die geen lidstaat is die eisen stelt die gelijkwaardig zijn aan die in deze wet, en die hun werkzaamheden, al dan
      niet als werknemer, uitoefenen binnen eenzelfde rechtspersoon of netwerk;

      c. instellingen als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1° tot en met 12°][ref9], met zetel in
      een lidstaat, mits het dezelfde cliënt en dezelfde transactie betreft en de mededeling uitsluitend is bedoeld ter
      voorkoming van witwassen en financieren van terrorisme;

      d. instellingen als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1° tot en met 12°][ref10], met zetel
      in een staat die geen lidstaat is die eisen stelt die gelijkwaardig zijn aan die in deze wet, die zijn onderworpen
      aan gelijkwaardige verplichtingen op het gebied van het beroepsgeheim en de bescherming van persoonsgegevens, en
      tot dezelfde beroepscategorie behoren, mits het dezelfde cliënt en dezelfde transactie betreft en de mededeling
      uitsluitend is bedoeld ter voorkoming van witwassen en financieren van terrorisme.

      5 Een ieder die kennis neemt van een melding, het gegeven dat een melding aanleiding kan geven tot nader onderzoek,
      nadere informatie als bedoeld in het eerste lid of gegevens of inlichtingen als bedoeld in het tweede lid en weet
      of redelijkerwijs moet vermoeden dat ter zake op een instelling de geheimhoudingsplicht bedoeld in het eerste
      lid rust, is verplicht tot geheimhouding hiervan, behoudens voor zover uit deze wet de noodzaak tot bekendmaking
      voortvloeit. Het derde en vierde lid zijn van overeenkomstige toepassing.


