  - number: '33'
    text: |-
      1 Een instelling die op grond van deze wet de cliënt heeft geïdentificeerd en zijn identiteit heeft geverifieerd,
      legt op toegankelijke wijze de volgende gegevens vast:

      a. van natuurlijke personen:

      1°. de geslachtsnaam, de voornamen, de geboortedatum, het adres en de woonplaats dan wel plaats van vestiging van
      de cliënt alsmede van degene die namens die natuurlijke persoon optreedt of een afschrift van het document dat een
      persoonidentificerend nummer bevat en aan de hand waarvan de identificatie heeft plaatsgevonden;

      2°. de aard, het nummer en de datum en plaats van uitgifte van het document met behulp waarvan de identiteit is
      geverifieerd;

      3°. de aard van de dienstverlening;

      b. van naar Nederlands recht opgerichte rechtspersonen:

      1°. de rechtsvorm, de statutaire naam, de handelsnaam, het adres met huisnummer, de postcode, de plaats van
      vestiging, het land van statutaire zetel en, indien de rechtspersoon bij een Kamer van Koophandel en Fabrieken is
      geregistreerd, het registratienummer bij de Kamer van Koophandel en Fabrieken en de plaats van vestiging van de
      Kamer van Koophandel en Fabrieken die het desbetreffende handelsregister houdt en de wijze waarop de identiteit
      is geverifieerd;

      2°. van degenen die voor de rechtspersoon bij de instelling optreden: de geslachtsnaam, de voornamen en de
      geboortedatum;

      3°. de aard van de dienstverlening;

      c. van buitenlandse rechtspersonen:

      1°. de documenten aan de hand waarvan de identiteit is geverifieerd;

      2°. van degenen die voor de rechtspersoon bij de instelling optreden: de geslachtsnaam, de voornamen en de
      geboortedatum;

      3°. de aard van de dienstverlening.

      2 Indien bij een cliëntenonderzoek [artikel 3, tweede lid, onderdeel b][ref1], van toepassing is, legt de
      instelling de gegevens waarmee zij voldoet aan de verplichtingen ingevolge die bepaling op toegankelijke wijze
      vast.

      3 Een instelling bewaart de in het eerste en tweede lid bedoelde gegevens op toegankelijke wijze gedurende
      vijf jaar na het tijdstip van het beëindigen van de zakelijke relatie of tot vijf jaar na het uitvoeren van de
      desbetreffende transactie.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel3
    url: https://wetten.overheid.nl/BWBR0024282/2012-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '34'
    text: |-
      Een instelling bewaart de gegevens, bedoeld in [artikel 16, tweede lid][ref1], op toegankelijke wijze gedurende
      vijf jaar na het tijdstip van het doen van de melding.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel16
    url: https://wetten.overheid.nl/BWBR0024282/2012-01-01#Artikel34
