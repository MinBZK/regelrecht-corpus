  - number: '3'
    text: |-
      1 Een instelling verricht ter voorkoming van witwassen en financieren van terrorisme cliëntenonderzoek.

      2 Het cliëntenonderzoek stelt de instelling in staat om:

      a. de cliënt te identificeren en zijn identiteit te verifiëren;

      b. indien van toepassing, de uiteindelijk belanghebbende te identificeren en op risico gebaseerde en adequate
      maatregelen te nemen om zijn identiteit te verifiëren, en indien het een rechtspersoon, een stichting of een trust
      als bedoeld in het Verdrag inzake het recht dat toepasselijk is op trusts en inzake de erkenning van trusts (Trb.
      1985, 141) betreft, op risico gebaseerde en adequate maatregelen te nemen om inzicht te verwerven in de eigendoms-
      en zeggenschapsstructuur van de cliënt;

      c. het doel en de beoogde aard van de zakelijke relatie vast te stellen;

      d. voor zover mogelijk, een voortdurende controle op de zakelijke relatie en de tijdens de duur van deze relatie
      verrichte transacties uit te voeren, teneinde te verzekeren dat deze overeenkomen met de kennis die de instelling
      heeft van de cliënt en van zijn risicoprofiel, met in voorkomend geval een onderzoek naar de bron van het vermogen.

      3 Een instelling verricht het cliëntenonderzoek in de volgende gevallen:

      a. indien zij in of vanuit Nederland een zakelijke relatie aangaat;

      b. indien zij in of vanuit Nederland een incidentele transactie verricht ten behoeve van de cliënt van ten minste
      € 15 000, of twee of meer transacties waartussen een verband bestaat met een gezamenlijke waarde van ten minste
      € 15 000;

      c. indien er indicaties zijn dat de cliënt betrokken is bij witwassen of financieren van terrorisme;

      d. indien zij twijfelt aan de betrouwbaarheid van eerder verkregen gegevens van de cliënt; of

      e. indien het risico van betrokkenheid van een bestaande cliënt bij witwassen of financieren van terrorisme daartoe
      aanleiding geeft.

      4 Een instelling kan het cliëntenonderzoek afstemmen op de risicogevoeligheid voor witwassen of financiering van
      terrorisme van het type cliënt, zakelijke relatie, product of transactie.

      5 Het eerste tot en met het vierde lid is niet van toepassing op trustkantoren als bedoeld in
      [artikel 1, onderdeel a, onder 10°][ref1].

      6 Bij ministeriële regeling kan vrijstelling worden geregeld van het in het eerste of tweede lid bepaalde.

      7 Onze Minister van Financiën kan, op verzoek van een instelling, al dan niet voor bepaalde tijd, ontheffing
      verlenen van het eerste of tweede lid. Aan een vrijstelling en ontheffing kunnen beperkingen worden gesteld en
      voorschriften worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1
    url: https://wetten.overheid.nl/BWBR0024282/2012-01-01#Artikel3
