      b. een instelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1° tot en met 3°, 5° tot en met 10°, 18° of 19°][ref4].

      2 Een instelling als bedoeld in het eerste lid stelt, op verzoek van de instelling waar zij een cliënt
      introduceert, de identificatie- en verificatiegegevens en overige gegevens en bescheiden inzake de identiteit van
      de cliënt of de uiteindelijk belanghebbende onverwijld ter beschikking aan die instelling.


