  - number: '15'
    text: |-
      1 Bij algemene maatregel van bestuur worden, zo nodig per daarbij te onderscheiden categorieën transacties,
      indicatoren vastgesteld aan de hand waarvan wordt beoordeeld of een transactie wordt aangemerkt als een
      ongebruikelijke transactie.

      2 Indien het spoedeisende belang dat vereist, kunnen bij regeling van Onze Minister van Financiën en Onze Minister
      van Justitie gezamenlijk de indicatoren, bedoeld in het eerste lid, worden vastgesteld voor een termijn van ten
      hoogste zes maanden.
    url: https://wetten.overheid.nl/BWBR0024282/2012-01-01#Artikel15
  - number: '16'
    text: |-
      1 Een instelling meldt een verrichte of voorgenomen ongebruikelijke transactie binnen veertien dagen nadat het
      ongebruikelijke karakter van de transactie bekend is geworden, aan het meldpunt.

      2 Bij een melding als bedoeld in het eerste lid verstrekt de instelling de volgende gegevens:

      a. de identiteit van de cliënt en, voor zover mogelijk, de identiteit van degene ten behoeve van wie de transactie
      wordt uitgevoerd;

      b. de aard en het nummer van het identiteitsbewijs van de cliënt;

      c. de aard, het tijdstip en de plaats van de transactie;

      d. de omvang en de bestemming en herkomst van de gelden, effecten, edele metalen of andere waarden die bij een
      transactie betrokken zijn;

      e. de omstandigheden op grond waarvan de transactie als ongebruikelijk wordt aangemerkt;

      f. een omschrijving van de desbetreffende zaken van grote waarde bij een transactie boven de € 15 000;

      g. aanvullende, bij algemene maatregel van bestuur aan te wijzen, gegevens.
    url: https://wetten.overheid.nl/BWBR0024282/2012-01-01#Artikel16
  - number: '17'
    text: |-
      1 Het meldpunt kan bij de instelling die een melding heeft gedaan, alsmede bij de instelling die bij een
      transactie is betrokken waarover het meldpunt gegevens heeft verzameld, nadere gegevens of inlichtingen vragen,
      teneinde te kunnen beoordelen of verzamelde gegevens dienen te worden verstrekt op grond van zijn taak bedoeld in
      [artikel 13, onderdeel b][ref1].

      2 De instelling waaraan overeenkomstig het eerste lid deze gegevens of inlichtingen zijn gevraagd, verstrekt deze
      schriftelijk, alsmede in spoedeisende gevallen mondeling, aan het meldpunt binnen de door het meldpunt gestelde
      termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel13
    url: https://wetten.overheid.nl/BWBR0024282/2012-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '18'
    text: |-
      Het meldpunt bepaalt de wijze waarop een melding moet worden gedaan, of gegevens of inlichtingen als bedoeld in
      [artikel 17, eerste lid][ref1], moeten worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel17
    url: https://wetten.overheid.nl/BWBR0024282/2012-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '19'
    text: |-
      1 Gegevens of inlichtingen die in overeenstemming met de [artikelen 16][ref1] of [17][ref2] zijn verstrekt, kunnen
      niet dienen als grondslag voor of ten behoeve van een opsporingsonderzoek of een vervolging wegens verdenking van,
      of als bewijs ter zake van een tenlastelegging wegens witwassen of financieren van terrorisme door de instelling
      die deze gegevens of inlichtingen heeft verstrekt.

      2 Gegevens of inlichtingen die zijn verstrekt in de redelijke veronderstelling dat uitvoering wordt gegeven aan de
      [artikelen 16][ref3] of [17][ref4] kunnen niet dienen als grondslag voor of ten behoeve van een opsporingsonderzoek
      of een vervolging wegens verdenking van, of als bewijs ter zake van een tenlastelegging wegens, overtreding van
      [artikel 272 van het Wetboek van Strafrecht][ref5] door de instelling die deze gegevens of inlichtingen heeft
      verstrekt.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing ten aanzien van personen die werkzaam zijn voor een
      instelling die gegevens of inlichtingen heeft verstrekt als omschreven in het eerste of tweede lid en die daaraan
      hebben meegewerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel17
