  - number: '20'
    text: |-
      De instelling die tot een melding op de voet van [artikel 16][ref1] is overgegaan, is niet aansprakelijk
      voor schade die een derde dientengevolge lijdt, tenzij aannemelijk wordt gemaakt dat gelet op alle feiten en
      omstandigheden in redelijkheid niet tot melding had mogen worden overgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel16
    url: https://wetten.overheid.nl/BWBR0024282/2012-01-01#Artikel20
