  - number: '12'
    text: |-
      1 Er is een Meldpunt ongebruikelijke transacties.

      2 Het Meldpunt ongebruikelijke transacties is de verantwoordelijke autoriteit als bedoeld in de [Verordening
      nr. 2006/1781/EG](33681R2006) van het Europees Parlement en de Raad betreffende bij geldovermakingen te voegen
      informatie over de betaler.

      3 De algemene leiding, de organisatie en het beheer van het meldpunt berusten bij Onze Minister van Justitie.

      4 Benoeming, schorsing en ontslag van het hoofd van het meldpunt geschieden bij koninklijk besluit op voordracht
      van Onze Minister van Justitie, in overeenstemming met Onze Minister van Financiën.

      5 Onze Minister van Justitie bepaalt in overeenstemming met Onze Minister van Financiën de begroting van het
      meldpunt.
    url: https://wetten.overheid.nl/BWBR0024282/2012-01-01#Artikel12
  - number: '13'
    text: |-
      Het meldpunt heeft met het oog op het voorkomen en opsporen van witwassen en financieren van terrorisme tot taak:

      a. het verzamelen, registreren, bewerken en analyseren van de gegevens die het verkrijgt, teneinde te bezien of
      deze gegevens van belang kunnen zijn voor het voorkomen en opsporen van misdrijven;

      b. het verstrekken van persoonsgegevens en andere gegevens in overeenstemming met deze wet en het bij of krachtens
      de [Wet politiegegevens][ref1] bepaalde;

      c. de instelling die overeenkomstig [artikel 16][ref2] een melding heeft gedaan, berichten over de afdoening van
      de melding;

      d. het verrichten van onderzoek naar ontwikkelingen op het gebied van witwassen en financieren van terrorisme en
      naar de verbetering van de methoden om witwassen en financieren van terrorisme te voorkomen en op te sporen;

      e. het geven van aanbevelingen voor de bedrijfstakken omtrent de invoering van passende procedures voor interne
      controle en communicatie en andere te treffen maatregelen tot voorkoming van het gebruik van die bedrijfstakken
      voor witwassen en financieren van terrorisme;

      f. het geven van voorlichting omtrent het voorkomen en opsporen van witwassen en financieren van terrorisme aan:

      1°. de bedrijfstakken en beroepsgroepen;

      2°. de personen die krachtens [artikel 24][ref3] met het toezicht op de naleving van deze wet zijn belast;

      3°. het openbaar ministerie en de overige ambtenaren belast met de opsporing van strafbare feiten;

      4°. het publiek;

      g. het geven van inlichtingen aangaande het meldgedrag van de instellingen aan de personen die krachtens
      [artikel 24][ref4] met het toezicht op de naleving van deze wet zijn belast;

      h. het onderhouden van contacten met buitenlandse van overheidswege aangewezen instanties die een vergelijkbare
      taak hebben als het meldpunt;

      i. het jaarlijks uitbrengen van een verslag met betrekking tot de taakuitoefening en zijn werkzaamheden in het
      voorafgaande jaar en van zijn voornemens voor het komende jaar, dat wordt aangeboden aan Onze Minister van Justitie
      en ter kennis gebracht van Onze Minister van Financiën.


      [ref1]: https://wetten.overheid.nl/BWBR0022463
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel16
