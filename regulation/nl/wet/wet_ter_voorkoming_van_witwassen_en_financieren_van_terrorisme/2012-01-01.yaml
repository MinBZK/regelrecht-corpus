      1 [Artikel 3, eerste lid][ref1], is niet van toepassing ten aanzien van cliënten die reeds op grond van de
      [Wet identificatie bij dienstverlening][ref2] zijn geïdentificeerd of ten aanzien van wie geen verplichting tot
      identificatie op grond van [die wet][ref3] was vereist.

      2 Gegevens van de in het eerste lid bedoelde personen die reeds op grond van de
      [Wet identificatie bij dienstverlening][ref4] zijn vastgelegd, worden geacht te zijn vastgelegd ingevolge deze wet.


