    text: |-
      1 [Artikel 3, eerste lid, derde lid, aanhef en onderdelen a, b en d, en vierde lid][ref1], alsmede
      [artikel 4, eerste lid][ref2], zijn niet van toepassing voor zover het betreft zakelijke relaties of transacties
      met betrekking tot:

      a. levensverzekeringsovereenkomsten als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref3],
      waarvan het bedrag van de jaarlijks te betalen premie € 1 000 of minder bedraagt of waarvan het bedrag van de
      eenmalige premie € 2 500 of minder bedraagt;

      b. producten met betrekking tot een pensioen als bedoeld in [artikel 1 van de Pensioenwet][ref4];

      c. elektronisch geld als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref5], waarvan:

      1°. indien de geldswaarde die is opgeslagen op de elektronische drager of die op afstand is opgeslagen in een
      centrale rekeningadministratie niet kan worden heropgeladen, het maximumbedrag niet meer dan € 250 bedraagt; of

      2°. indien de geldswaarde die is opgeslagen op de elektronische drager of die op afstand is opgeslagen in een
      centrale rekeningadministratie kan worden opgeladen, het totaalbedrag van de transacties die in een kalenderjaar
      kunnen worden verricht niet meer dan € 2.500 bedraagt, tenzij de houder een bedrag van € 1 000 of meer heeft laten
      terugbetalen in datzelfde kalenderjaar.

      2 Een instelling verzamelt voldoende gegevens om te kunnen vaststellen of het eerste lid op een product van
      toepassing is.

      3 Bij algemene maatregel van bestuur kunnen producten of transacties worden aangewezen waarop het eerste lid van
      overeenkomstige toepassing is.

      4 Voor nationale betalingstransacties wordt het in het eerste lid genoemde bedrag van € 250 verdubbeld.


