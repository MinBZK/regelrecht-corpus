  - number: '24'
    text: |-
      1 Bij besluit van Onze Minister van Financiën en Onze Minister van Justitie gezamenlijk kunnen personen worden
      aangewezen die belast zijn met het toezicht op de naleving door de instellingen van deze wet.

      2 De personen die op grond van het eerste lid belast zijn met het toezicht op de instellingen, bedoeld
      in [artikel 1, eerste lid, onderdeel a, onder 10° tot en met 15°][ref1], kunnen het toezicht op een
      risicogeoriënteerde wijze uitoefenen.

      3 De Nederlandsche Bank N.V. is belast met het toezicht op de naleving van de [Verordening nr. 2006/1781/EG]
      (33681R2006) van het Europees Parlement en de Raad betreffende bij geldovermakingen te voegen informatie over de
      betaler.

      4 De Stichting Autoriteit Financiële Markten is belast met het toezicht op de naleving van Verordening (EU)
      nr. 1031/2010 van de Europese Commissie van 12 november 2010 inzake de tijdstippen, het beheer en andere aspecten
      van de veiling van broeikasgasemissierechten overeenkomstig Richtlijn 2003/87/EG van het Europees Parlement
      en de Raad tot vaststelling van een regeling voor de handel in broeikasgasemissierechten binnen de Gemeenschap
      (PbEU L 302).

      5 Ten aanzien van personen die op grond van het eerste lid belast zijn met het toezicht op
      de naleving van de artikelen, genoemd in het eerste en derde lid, zijn de bepalingen van
      [hoofdstuk 5, afdeling 5.2, van de Algemene wet bestuursrecht][ref2] van overeenkomstige toepassing.

      6 Van een besluit tot aanwijzing op grond van het eerste lid wordt mededeling gedaan door plaatsing in de
      Staatscourant.

      7 Bij ministeriële regeling kunnen banken die deel uitmaken van een groep banken die op 15 december 1977 blijvend
      was aangesloten bij een centrale kredietinstelling die controle uitoefent op de bedrijfsvoering en uitbesteding van
      die banken worden vrijgesteld van het toezicht door de Nederlandsche Bank N.V. op de naleving van deze wet, indien
      de centrale kredietinstelling toezicht houdt op die groep banken en in voldoende mate bevoegd is voor de naleving
      van deze wet noodzakelijke instructies te geven aan die banken. Aan deze vrijstelling kunnen beperkingen worden
      gesteld en voorschriften worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.2
    url: https://wetten.overheid.nl/BWBR0024282/2012-01-01#Artikel24
