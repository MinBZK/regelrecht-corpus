preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Wet identificatie bij dienstverlening en de Wet
    melding ongebruikelijke transacties samen te voegen tot één wet, gericht op het voorkomen van het gebruik van het
    financiële stelsel voor het witwassen van geld en het financieren van terrorisme;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0024282/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. *instelling:*

      1°. bank als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1] die ingevolge
      [artikel 107, tweede lid, onderdeel a, onder 1° tot en met 4° van die wet][ref2] geregistreerd is;

      2°. financiële instelling als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref3];

      3°. onderneming, niet zijnde een bank of financiële instelling, die werkzaamheden verricht die zijn opgenomen
      onder punt 14 van Bijlage I van [richtlijn nr. 2006/48/EG](32006L0048) van het Europees Parlement en de Raad
      van de Europese Unie van 14 juni 2006 betreffende de toegang tot en de uitoefening van de werkzaamheden van
      kredietinstellingen (herschikking) (PbEU L 177);

      4°. wisselinstelling als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref4], voor zover deze
      wisseltransacties verricht als bedoeld in de onderdelen a en c van de definitie van het begrip wisseltransactie in
      dat artikel;

      5°. levensverzekeraar als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref5] met uitzondering
      van een levensverzekeraar die uitsluitend het bedrijf van natura-uitvaartverzekeraar als bedoeld in dat artikel
      uitoefent;

      6°. beleggingsonderneming als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref6];

      7°. beleggingsinstelling als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref7];

      8°. financiële dienstverlener als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref8] voor zover
      deze bemiddelt in levensverzekeringen;

      9°. bijkantoor in Nederland van een financiële onderneming als bedoeld onder 1° tot en met 8° met zetel buiten
      Nederland;

      10°. trustkantoor als bedoeld in [artikel 1, onderdeel a, van de Wet toezicht trustkantoren][ref9];

      11°. externe registeraccountant, externe accountant-administratieconsulent of belastingadviseur, voor zover deze
      zijn beroepsactiviteiten uitoefent dan wel een natuurlijke persoon, rechtspersoon of vennootschap, voor zover die
      anderszins zelfstandig onafhankelijk beroeps- of bedrijfsmatig daarmee vergelijkbare activiteiten verricht;

      12°. natuurlijke persoon, rechtspersoon of vennootschap die als advocaat, notaris, of kandidaat-notaris of in de
      uitoefening van een gelijksoortig juridisch beroep of bedrijf zelfstandig onafhankelijk beroeps- of bedrijfsmatig
      advies geeft of bijstand verleent bij:

      a. het aan- of verkopen van onroerende zaken;

      b. het beheren van geld, effecten, munten, muntbiljetten, edele metalen, edelstenen of andere waarden;

      c. het oprichten of beheren van vennootschappen, rechtspersonen of soortgelijke lichamen als bedoeld in
      [artikel 2, eerste lid, onderdeel b, van de Algemene wet inzake rijksbelastingen][ref10];

      d. het aan- of verkopen dan wel overnemen van ondernemingen;

      e. werkzaamheden op fiscaal gebied die vergelijkbaar zijn met de werkzaamheden van de onder 11° beschreven
      beroepsgroepen;

      13°. natuurlijke persoon, rechtspersoon of vennootschap die als advocaat, notaris of kandidaat-notaris dan wel
      in de uitoefening van een gelijksoortig juridisch beroep optreedt in naam en voor rekening van een cliënt bij
      enigerlei financiële transactie of onroerende zaaktransactie;

      14°. tussenpersoon als bedoeld in [artikel 62 van het Wetboek van Koophandel][ref11], voor zover deze bemiddelt bij
      het tot stand brengen en het sluiten van overeenkomsten inzake onroerende zaken en rechten waaraan onroerende zaken
      zijn onderworpen;

      15°. beroeps- of bedrijfsmatig handelende verkoper van goederen, voor zover betaling van deze goederen in contanten
      plaatsvindt voor een bedrag van € 15 000 of meer, ongeacht of de transactie plaatsvindt in een handeling of door
      middel van meer handelingen waartussen een verband bestaat;

      16°. natuurlijke persoon, rechtspersoon of vennootschap die beroeps- of bedrijfsmatig een speelcasino in de zin van
      [artikel 27g, tweede lid, van de Wet op de kansspelen][ref12] organiseert;

      17°. natuurlijke persoon of rechtspersoon die behoort tot een bij algemene maatregel van bestuur aan te wijzen
      categorie beroepen of bedrijven;

      18°. natuurlijke persoon of rechtspersoon die bij de uitvoering van betaaldiensten als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref13] optreedt voor rekening van:

      a. een betaalinstelling als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref14]; of

      b. een betaaldienstverlener als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref15] met zetel in
      een andere lidstaat die beschikt over een door de toezichthoudende instantie van die lidstaat verleende vergunning
      voor het uitoefenen van zijn bedrijf;

      19°. betaaldienstverlener als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref16];

      20°. natuurlijke persoon, rechtspersoon of vennootschap die beroeps- of bedrijfmatig een adres of postadres ter
      beschikking stelt;

      b. *cliënt:* natuurlijke persoon of rechtspersoon met wie een zakelijke relatie wordt aangegaan of die een
      transactie laat uitvoeren;

      c. *identificeren:* opgave van de identiteit laten doen;

      d. *verifiëren van de identiteit:* vaststellen dat de opgegeven identiteit overeenkomt met de werkelijke
      identiteit;

      e. *politiek prominente persoon:* een persoon als bedoeld in artikel 2, eerste lid, van de Uitvoeringsrichtlijn,
      tenzij deze de in dat lid bedoelde functie ten minste gedurende één jaar niet meer heeft uitgeoefend, diens directe
      familieleden en naaste geassocieerden in de zin van artikel 2, tweede en derde lid, van de Uitvoeringsrichtlijn;

      f. *uiteindelijk belanghebbende:*

      1°. natuurlijke persoon die een belang houdt van meer dan 25 procent van het kapitaalbelang of meer dan 25 procent
      van de stemrechten van de aandeelhoudersvergadering kan uitoefenen van een rechtspersoon anders dan een stichting,
      dan wel op andere wijze feitelijk zeggenschap kan uitoefenen in deze rechtspersoon, tenzij deze rechtspersoon
      een vennootschap is die is onderworpen aan openbaarmakingsvereisten als bedoeld in [richtlijn nr. 2004/109]
      (32004L0109) van het Europees Parlement en de Raad van de Europese Unie van 15 december 2004 betreffende de
      transparantievereisten die gelden voor informatie over uitgevende instellingen waarvan effecten tot de handel op
      een gereglementeerde markt zijn toegelaten en tot wijziging van [Richtlijn 2001/34/EG](32001L0034) (PbEU L 390) of
      aan voorschriften van een internationale organisatie die gelijkwaardig zijn aan die richtlijn;

      2°. begunstigde van 25 procent of meer van het vermogen van een stichting of een trust als bedoeld in het Verdrag
      inzake het recht dat toepasselijk is op trusts en inzake de erkenning van trusts (Trb. 1985, 141) of degene die
      bijzondere zeggenschap heeft over 25 procent of meer van het vermogen van een stichting of een trust;

      g. *zakelijke relatie:* zakelijke, professionele, of commerciële relatie tussen een instelling en een natuurlijke
      persoon of een rechtspersoon, die verband houdt met de professionele activiteiten van die instelling en waarvan op
      het tijdstip dat het contact wordt gelegd, wordt aangenomen dat deze enige tijd zal duren;

      h. *transitrekening:* door een bank aangehouden bankrekening in een staat die geen lidstaat is en die door een
      cliënt van de bank die niet in die staat is gevestigd gedebiteerd of gecrediteerd kan worden zonder tussenkomst van
      de bank;

      i. *financieren van terrorisme:*

      1°. opzettelijk verwerven of voorhanden hebben van voorwerpen met geldswaarde, bestemd tot het begaan van een
      misdrijf als bedoeld in [artikel 83 van het Wetboek van Strafrecht][ref17];

      2°. opzettelijk verschaffen van middelen met geldswaarde tot het plegen van een misdrijf als bedoeld in
      [artikel 83 van het Wetboek van Strafrecht][ref18]; of

      3°. het verlenen van geldelijke steun, alsmede het opzettelijk werven van geld ten behoeve van een organisatie die
      tot oogmerk heeft het plegen van misdrijven als bedoeld in [artikel 83 van het Wetboek van Strafrecht][ref19];

      j. *shellbank:* bank of een onderneming die zich met vergelijkbare activiteiten bezig houdt, opgericht in een staat
      waar zij geen fysieke aanwezigheid heeft en die geen onderdeel uitmaakt van een onder toezicht staand financieel
      conglomeraat in de zin van de [Wet op het financieel toezicht][ref20] of een daarmee vergelijkbare groep;

      k. *lidstaat:* staat die lid is van de Europese Unie alsmede een staat, niet zijnde een lidstaat van de Europese
      Unie, die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte;

      l. *correspondentbankrelatie:* vaste relatie tussen banken in verschillende landen voor de afwikkeling van
      transacties of de uitvoering van opdrachten;

      m. *transactie:* handeling of samenstel van handelingen van of ten behoeve van een cliënt in verband met het
      afnemen of het verlenen van diensten;

      n. *ongebruikelijke transactie:* transactie die ingevolge [artikel 15][ref21] als zodanig is aangemerkt;

      o. *melding:* melding als bedoeld in [artikel 16][ref22];

      p. *Uitvoeringsrichtlijn:* [Richtlijn nr. 2006/70/EG](32006L0070) van de Commissie van de Europese Gemeenschappen
      van 1 augustus 2006 tot vaststelling van uitvoeringsmaatregelen van [Richtlijn 2005/60/EG](32005L0060) van
      het Europees Parlement en de Raad wat betreft de definitie van politiek prominente personen en wat betreft
      de technische criteria voor vereenvoudigde cliëntenonderzoeksprocedures en voor vrijstellingen op grond van
      occasionele of zeer beperkte financiële activiteiten (PbEU L 214);

      q. *meldpunt:* het Meldpunt ongebruikelijke transacties, bedoeld in [artikel 12, eerste lid][ref23];

      r. *bank:* een bank als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref24];

      s. *platform voor de veiling van emissierechten:* Platform voor de veiling van emissierechten als bedoeld
      in hoofdstuk VII van Verordening (EU) nr. 1031/2010 van de Europese Commissie van 12 november 2010 inzake
      de tijdstippen, het beheer en andere aspecten van de veiling van broeikasgasemissierechten overeenkomstig
      Richtlijn 2003/87/EG van het Europees Parlement en de Raad tot vaststelling van een regeling voor de handel in
      broeikasgasemissierechten binnen de Gemeenschap (PbEU L 302).

      2 Deze wet is niet van toepassing op belastingadviseurs als bedoeld in het eerste lid, onderdeel a, onder 11°, en
      de personen, bedoeld in het eerste lid, onderdeel a, onder 12° en 13°, voor zover zij voor een cliënt werkzaamheden
      verrichten betreffende de bepaling van diens rechtspositie, diens vertegenwoordiging en verdediging in rechte, het
      geven van advies voor, tijdens en na een rechtsgeding of het geven van advies over het instellen of vermijden van
      een rechtsgeding.


