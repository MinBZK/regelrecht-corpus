      [11][ref9], [16, eerste en tweede lid][ref10], [17, tweede lid][ref11], [23, eerste en tweede lid][ref12],
      [33][ref13], [34][ref14], en [35][ref15] van deze wet, [artikel 5:20 van de Algemene wet bestuursrecht][ref16] en
      het bepaalde in [Verordening (EG) nr. 2006/1781](33681R2006) van het Europees Parlement en de Raad van de Europese
      Unie van 15 november 2006 betreffende bij geldovermakingen te voegen informatie over de betaler (PbEU L 345) en het
      bepaalde in Verordening (EU) nr. 1031/2010 van de Europese Commissie van 12 november 2010 inzake de tijdstippen,
