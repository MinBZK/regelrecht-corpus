  - number: '4'
    text: |-
      1 Een instelling voldoet aan [artikel 3, tweede lid, onderdelen a en b][ref1], voordat de zakelijke relatie wordt
      aangegaan of een incidentele transactie als bedoeld in [artikel 3, derde lid, onderdeel b][ref2], wordt uitgevoerd.

      2 In afwijking van het eerste lid is het een instelling toegestaan de identiteit van de cliënt en, indien van
      toepassing, de identiteit van de uiteindelijk belanghebbende te verifiëren tijdens het aangaan van de zakelijke
      relatie, indien dit noodzakelijk is om de dienstverlening niet te verstoren en indien er weinig risico op witwassen
      of financieren van terrorisme bestaat. In dat geval verifieert de instelling de identiteit zo spoedig mogelijk na
      het eerste contact met de cliënt.

      3 In afwijking van het eerste en tweede lid is het een instelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 5°][ref3], toegestaan de begunstigde van een polis te identificeren en
      de identiteit te verifiëren nadat de zakelijke relatie is aangegaan. In dat geval vindt het identificeren en het
      verifiëren van de identiteit plaats op of voor het tijdstip van uitbetaling, dan wel op of voor het tijdstip waarop
      de begunstigde zijn rechten krachtens de polis wil uitoefenen.

      4 In afwijking van het eerste en tweede lid is het een bank als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°][ref4], toegestaan een rekening te openen voordat de verificatie van
      de identiteit van de cliënt heeft plaatsgevonden, indien zij waarborgt dat deze rekening niet kan worden gebruikt
      voordat de verificatie heeft plaatsgevonden.

      5 In afwijking van het eerste en tweede lid kan een notaris of kandidaat-notaris als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 12°][ref5], de identiteit van de cliënt en, indien van
      toepassing, van de uiteindelijk belanghebbende verifiëren op het moment dat identificatie op grond van
      [artikel 39 van de Wet op het notarisambt][ref6] is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel3
