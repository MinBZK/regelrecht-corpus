  - number: 1.1.2
    text: |-
      Onder reclameboodschap als bedoeld in het eerste lid wordt niet verstaan het oproepen tot steun aan of het gunstig
      stemmen ten aanzien van instellingen met een wetenschappelijk, cultureel, godsdienstig, levensbeschouwelijk,
      politiek of liefdadig karakter, voor zover dat geen betrekking heeft op het kopen van een bepaald product of het
      gebruik maken van een bepaalde dienst die in de handel verkrijgbaar is.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel1.1
  - number: 1.2.1
    text: |-
      Onder de bevoegdheid van Nederland vallen instellingen die een televisieprogramma verzorgen en krachtens artikel 2
      van de Europese richtlijn onder die Nederlandse bevoegdheid vallen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel1.2
  - number: 1.2.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een instelling die radioprogramma’s verzorgt, met dien
      verstande dat in ieder geval onder de bevoegdheid van Nederland valt een instelling die radioprogramma’s verzorgt
      die in Nederland door middel van een omroepzender, satelliet daaronder niet begrepen, worden verspreid.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel1.2
  - number: 2.1.1
    text: 'Er is een publieke mediaopdracht die bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.1
  - number: 2.1.1.a
    text: |-
      het op landelijk, regionaal en lokaal niveau verzorgen van publieke mediadiensten door het aanbieden van media-
      aanbod op het terrein van informatie, cultuur, educatie en verstrooiing, via alle beschikbare aanbodkanalen; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.1
  - number: 2.1.1.b
    text: |-
      het verzorgen van publieke mediadiensten waarvan het media-aanbod bestemd voor landen en gebieden buiten Nederland
      en voor Nederlanders die buiten de landsgrenzen verblijven.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.1
  - number: 2.1.2
    text: |-
      Publieke mediadiensten voldoen aan democratische, sociale en culturele behoeften van de Nederlandse samenleving
      door het aanbieden van media-aanbod dat:
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.1
  - number: 2.1.2.a
    text: |-
      evenwichtig, pluriform, gevarieerd en kwalitatief hoogstaand is en zich tevens kenmerkt door een grote
      verscheidenheid naar vorm en inhoud;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.1
  - number: 2.1.2.b
    text: |-
      op evenwichtige wijze een beeld van de samenleving geeft en de pluriformiteit van onder de bevolking levende
      overtuigingen, opvattingen en interesses op maatschappelijk, cultureel en levensbeschouwelijk gebied weerspiegelt;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.1
  - number: 2.1.2.c
    text: |-
      gericht is op en een relevant bereik heeft onder zowel een breed en algemeen publiek, als bevolkings- en
      leeftijdgroepen van verschillende omvang en samenstelling met in het bijzonder aandacht voor kleine doelgroepen;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.1
  - number: 2.1.2.d
    text: |-
      onafhankelijk is van commerciële invloeden en, behoudens het bepaalde bij of krachtens de wet, van
      overheidsinvloeden;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.1
  - number: 2.1.2.e
    text: voldoet aan hoge journalistieke en professionele kwaliteitseisen; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.1
  - number: 2.1.2.f
    text: voor iedereen toegankelijk is.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.1
  - number: 2.1.3
    text: |-
      Het programma-aanbod van de algemene programmakanalen van de landelijke, regionale en lokale publieke mediadiensten
      wordt via omroepzenders verspreid naar alle huishoudens in het verzorgingsgebied waarvoor de programma’s zijn
      bestemd zonder dat zij voor de ontvangst andere kosten moeten betalen dan de kosten van aanschaf en gebruik van
      technische voorzieningen die de ontvangst mogelijk maken.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.1
  - number: 2.1.4
    text: |-
      In het kader van de uitvoering van de publieke mediaopdracht volgen en stimuleren publieke media-instellingen
      technologische ontwikkelingen en benutten de mogelijkheden om media-aanbod aan het publiek aan te bieden via nieuwe
      media- en verspreidingstechnieken.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.1
  - number: 2.2.1
    text: |-
      De Nederlandse Omroep Stichting is het samenwerkings- en coördinatieorgaan voor de uitvoering van de publieke
      mediaopdracht op landelijk niveau, bedoeld in [artikel 2.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.2.2
    text: 'Naast de andere taken die de Stichting heeft op grond van deze wet, is zij belast met:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.2
  - number: 2.2.2.a
    text: |-
      het bevorderen van samenwerking en coördinatie met het oog op de uitvoering van de publieke mediaopdracht op
      landelijk niveau;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.2
  - number: 2.2.2.b
    text: |-
      de coördinatie en ordening op en tussen de aanbodkanalen van het media-aanbod van de landelijke publieke
      mediadienst;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.2
  - number: 2.2.2.c
    text: de verzorging van media-aanbod;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.2
  - number: 2.2.2.d
    text: |-
      de vertegenwoordiging van de landelijke publieke media-instellingen in internationale organisaties op het gebied
      van media en de medewerking aan de oprichting van dergelijke organisaties;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.2
  - number: 2.2.2.e
    text: |-
      het in samenwerking met buitenlandse omroepinstellingen meewerken aan Europees media-aanbod dat mede op het
      Nederlandse publiek is gericht;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.2
  - number: 2.2.2.f
    text: het beschikbaar stellen van media-aanbod van de landelijke publieke mediadienst aan het buitenland;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.2
  - number: 2.2.2.g
    text: |-
      het behartigen van zaken die van gemeenschappelijk belang zijn voor de landelijke publieke mediadienst en de
      landelijke publieke media-instellingen;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.2
  - number: 2.2.2.h
    text: |-
      het in samenwerking met de Wereldomroep sluiten van collectieve arbeidsovereenkomsten en het vaststellen van normen
      voor de honorering van freelancers, mede in naam van de landelijke publieke media-instellingen;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.2
  - number: 2.2.2.i
    text: |-
      de bekostiging van de landelijke publieke media-instellingen, op basis van de door Onze Minister beschikbaar
      gestelde gelden;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.2
  - number: 2.2.2.j
    text: |-
      het bevorderen van een doelmatige inzet van de gelden die bestemd zijn voor de verzorging en verspreiding van het
      media-aanbod en het bevorderen van geïntegreerde financiële verslaglegging en verantwoording; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.2
  - number: 2.2.2.k
    text: |-
      het inrichten, in stand houden, beheren en exploiteren en regelen van het gebruik van organen, diensten en
      faciliteiten, waaronder studio’s en distributie-infrastructuren, die nodig zijn voor een goede uitvoering van de
      publieke mediaopdracht op landelijk niveau.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.2
  - number: 2.3.1
    text: |-
      De Stichting kan in het kader van haar taak, bedoeld in [artikel 2.2, tweede lid, onderdeel g][ref1], in naam van
      de gezamenlijke landelijke publieke media-instellingen overeenkomsten met derden aangaan.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.1.1
        afdeling: 2.2.1
  - number: 2.3.2
    text: |-
      De Stichting stelt in het kader van haar taak, bedoeld in [artikel 2.2, tweede lid, onderdeel g][ref1], een
      gedragscode op ter bevordering van goed bestuur en integriteit bij de landelijke publieke media-instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.1.1
        afdeling: 2.2.1
  - number: 2.3.3
    text: 'De gedragscode heeft in elk geval betrekking op:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.3
  - number: 2.3.3.a
    text: aanbevelingen voor de bestuurlijke organisatie, waaronder een beloningskader en bestuurlijk toezicht;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.3
  - number: 2.3.3.b
    text: gedragsregels voor integer handelen van bestuurders en medewerkers;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.3
  - number: 2.3.3.c
    text: gedragsregels voor publieke en transparante verantwoording en verslaglegging;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.3
  - number: 2.3.3.d
    text: procedures voor de behandeling van meldingen en vermoedens over mogelijke misstanden; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.3
  - number: 2.3.3.e
    text: toezicht en naleving van de gedragscode.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.3
  - number: '2.4'
    text: De organen van de Stichting zijn een raad van toezicht, een raad van bestuur en een college van omroepen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.4
  - number: 2.5.1
    text: |-
      De raad van toezicht bestaat uit een voorzitter en ten hoogste zes andere leden die op voordracht van Onze Minister
      bij koninklijk besluit worden benoemd, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.5
  - number: 2.5.2
    text: |-
      Voor een van de andere leden kunnen de gezamenlijke ondernemingsraden van de Stichting, de Programmastichting, de
      erkende omroepverenigingen, bedoeld in [artikel 2.24][ref1], en de erkende educatieve media-instelling, bedoeld in
      [artikel 2.28][ref2], personen voor benoeming aanbevelen.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.2.2
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.2.2
  - number: 2.5.3
    text: Benoeming geschiedt voor vijf jaar en herbenoeming voor een aansluitende periode is eenmaal mogelijk.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.5
  - number: 2.6.1
    text: 'Het lidmaatschap van de raad van toezicht is onverenigbaar met:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.6
  - number: 2.6.1.a
    text: het lidmaatschap van het college van omroepen;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.6
  - number: 2.6.1.b
    text: het lidmaatschap van de raad van bestuur;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.6
  - number: 2.6.1.c
    text: het lidmaatschap van een orgaan van of een dienstbetrekking bij een publieke media-instelling;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.6
  - number: 2.6.1.d
    text: het lidmaatschap van een orgaan van of een dienstbetrekking bij een commerciële media-instelling;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.6
  - number: 2.6.1.e
    text: het lidmaatschap van een van beide Kamers der Staten-Generaal, een provinciaal bestuur of een gemeentebestuur;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.6
  - number: 2.6.1.f
    text: |-
      een dienstbetrekking bij een ministerie of bij een dienst, instelling of bedrijf vallende onder de
      verantwoordelijkheid van een minister; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.6
  - number: 2.6.1.g
    text: |-
      het hebben van financiële of andere belangen bij bedrijven of instellingen en het vervullen van nevenfuncties
      waardoor een goede vervulling van de functie of de handhaving van de onafhankelijkheid van het betrokken lid of van
      het vertrouwen daarin in het geding kan zijn.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.6
  - number: 2.6.2
    text: 'Schorsing en ontslag zijn mogelijk wegens:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.6
  - number: 2.6.2.a
    text: ongeschiktheid;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.6
  - number: 2.6.2.b
    text: disfunctioneren; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.6
  - number: 2.6.2.c
    text: onverenigbaarheid van functies.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.6
  - number: 2.6.3
    text: Ontslag is verder mogelijk op eigen verzoek.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.6
  - number: 2.6.4
    text: De leden van de raad van toezicht ontvangen van de Stichting een door Onze Minister vast te stellen vergoeding.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.6
  - number: 2.7.1
    text: |-
      De raad van toezicht houdt toezicht op het beleid van de raad van bestuur en op de algemene gang van zaken bij
      de Stichting en de uitvoering van de publieke mediaopdracht op landelijk niveau en staat de raad van bestuur met
      advies terzijde.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.7
  - number: 2.7.2
    text: 'De raad van toezicht is verder belast met:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.7
  - number: 2.7.2.a
    text: het vaststellen van de jaarrekening van de Stichting; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.7
  - number: 2.7.2.b
    text: het wijzigen van de statuten van de Stichting, op voorstel van de raad van bestuur;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.7
  - number: 2.7.3
    text: |-
      Bij de vervulling van hun taak richten de leden van de raad van toezicht zich naar het gemeenschappelijke belang
      van de landelijke publieke mediadienst.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.7
  - number: 2.8.1
    text: |-
      De raad van bestuur bestaat uit een voorzitter en twee andere leden die worden benoemd, geschorst en ontslagen door
      de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.8
  - number: 2.8.2
    text: Benoeming geschiedt voor vijf jaar en herbenoeming voor een aansluitende periode is eenmaal mogelijk.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.8
  - number: 2.8.3
    text: Besluiten tot benoeming, schorsing of ontslag behoeven de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.8
  - number: 2.9.1
    text: |-
      Op het lidmaatschap van de raad van bestuur is
      [artikel 2.6, eerste lid, aanhef en onderdelen a en c tot en met g][ref1], van overeenkomstige toepassing, met
      dien verstande dat [artikel 2.6, eerste lid, onderdeel c][ref2], niet van overeenkomstige toepassing is op het
      lidmaatschap van een orgaan van de Ster.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.1.2
        afdeling: 2.2.1
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.1.2
        afdeling: 2.2.1
  - number: 2.9.2
    text: |-
      De leden van de raad van bestuur zijn in dienst van de Stichting. De raad van toezicht stelt hun arbeidsvoorwaarden
      vast.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.9
  - number: 2.9.3
    text: |-
      [Artikel 668a, eerste tot en met vierde lid, van Boek 7 van het Burgerlijk Wetboek][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel668a
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 668a
  - number: 2.10.1
    text: De raad van bestuur bestuurt de Stichting.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.10
  - number: 2.10.2
    text: 'Naast de andere taken en bevoegdheden die de raad van bestuur heeft op grond van deze wet, is hij belast met:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.10
  - number: 2.10.2.a
    text: de dagelijkse leiding over de werkzaamheden van de Stichting, waaronder de verzorging van haar media-aanbod;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.10
  - number: 2.10.2.b
    text: |-
      de dagelijkse coördinatie en samenhangende ordening van het media-aanbod op en tussen de diverse aanbodkanalen van
      de landelijke publieke mediadienst;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.10
  - number: 2.10.2.c
    text: |-
      het vaststellen van regelingen die nodig zijn voor de uitvoering van de taken van de Stichting, waaronder in ieder
      geval een regeling voor de coördinatie en ordening van het media-aanbod op de aanbodkanalen van de landelijke
      publieke mediadienst;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.10
  - number: 2.10.2.d
    text: |-
      het vaststellen van de profielen van de aanbodkanalen van de landelijke publieke mediadienst, inhoudende de
      uitgangspunten voor een herkenbaar media-aanbod op die kanalen;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.10
  - number: 2.10.2.e
    text: |-
      het vaststellen van het concessiebeleidsplan, bedoeld in [artikel 2.20][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.1.4
        afdeling: 2.2.1
  - number: 2.10.2.f
    text: |-
      het aangaan van de prestatieovereenkomst, bedoeld in [2.22][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.1.4
        afdeling: 2.2.1
  - number: 2.10.2.g
    text: |-
      het vaststellen van de begroting, bedoeld in [artikel 2.147][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.2.1
        afdeling: 2.6.2
  - number: 2.10.2.h
    text: |-
      het vaststellen van het jaarverslag, bedoeld in [artikel 2.17][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.1.3
        afdeling: 2.2.1
  - number: 2.10.3
    text: |-
      De raad van bestuur is verder belast met datgene wat niet uitdrukkelijk tot de taken of bevoegdheden van de raad
      van toezicht behoort.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.10
  - number: 2.11.1
    text: 'De volgende besluiten van de raad van bestuur behoeven de instemming van de raad van toezicht:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.11
  - number: 2.11.1.a
    text: |-
      de besluiten, bedoeld in het [artikel 2.10, tweede lid, onderdelen e tot en met h][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.1.2
        afdeling: 2.2.1
  - number: 2.11.1.b
    text: het doen van investeringen die een in de statuten van de Stichting vastgesteld bedrag te boven gaan;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.11
  - number: 2.11.1.c
    text: |-
      het door de Stichting aangaan of verbreken van duurzame samenwerking met een andere rechtspersoon of vennootschap
      als die samenwerking van ingrijpende betekenis is voor de Stichting of de andere landelijke publieke media-
      instellingen;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.11
  - number: 2.11.1.d
    text: collectief ontslag van een aanmerkelijk aantal werknemers; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.11
  - number: 2.11.1.e
    text: het vaststellen van ingrijpende wijzigingen in de arbeidsomstandigheden van een aanmerkelijk aantal werknemers.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.11
  - number: 2.11.2
    text: |-
      De verdere werkwijze van de raad van toezicht en de raad van bestuur wordt geregeld in de statuten en reglementen
      van de Stichting.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.11
  - number: 2.12.1
    text: |-
      Het college van omroepen adviseert de raad van toezicht en de raad van bestuur desgevraagd of uit eigen beweging
      over het beleid inzake het media-aanbod van de landelijke publieke mediadienst.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.12
  - number: 2.12.2
    text: 'Het college is als volgt samengesteld:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.12
  - number: 2.12.2.a
    text: |-
      de omroepverenigingen en de educatieve media-instelling die een erkenning hebben verkregen en de Programmastichting
      benoemen elk één lid;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.12
  - number: 2.12.2.b
    text: |-
      de kerkgenootschappen en de genootschappen op geestelijke grondslag, bedoeld in [artikel 2.42][ref1], benoemen
      gezamenlijk één lid; en


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.2.4
  - number: 2.12.2.c
    text: |-
      de mediadirecteur van de Stichting, bedoeld in [artikel 2.23, vierde lid][ref1], is lid met raadgevende stem.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.1.5
        afdeling: 2.2.1
  - number: 2.12.3
    text: |-
      De omroepverenigingen die een voorlopige erkenning hebben verkregen kunnen elk een waarnemer in het college
      aanwijzen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.12
  - number: 2.13.1
    text: |-
      Het lidmaatschap van het college van omroepen is onverenigbaar met het lidmaatschap van een redactie als bedoeld
      in [artikel 2.56][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.2.5
  - number: 2.13.2
    text: Het college wijst uit zijn midden de voorzitter aan en regelt zijn eigen werkwijze.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.13
  - number: 2.13.3
    text: |-
      Het eerste lid is niet van toepassing op de mediadirecteur van de Stichting, bedoeld in
      [artikel 2.23, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.1.5
        afdeling: 2.2.1
  - number: 2.14.1
    text: |-
      Voordat de raad van bestuur een overeenkomst als bedoeld in [artikel 2.3, eerste lid][ref1], aangaat of een besluit
      als bedoeld in [artikel 2.10, tweede lid, onderdelen d, e of f][ref2], neemt, stelt hij het college van omroepen in
      de gelegenheid daarover binnen een door hem te stellen redelijke termijn zijn mening te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.1.1
        afdeling: 2.2.1
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.1.2
        afdeling: 2.2.1
  - number: 2.14.2
    text: |-
      Het uitblijven van de mening van het college staat aan het aangaan van een overeenkomst of het nemen van een
      besluit door de raad van bestuur niet in de weg.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.14
  - number: 2.14.3
    text: |-
      Als uit de mening blijkt dat het college niet instemt met een voorgenomen overeenkomst of een voorgenomen besluit
      dan wel belangrijke onderdelen daarvan en de raad van bestuur wenst zijn voornemen ongewijzigd te handhaven, legt
      de raad van bestuur de voorgenomen overeenkomst of het vastgestelde besluit samen met de mening ter instemming voor
      aan de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.14
  - number: 2.15.1
    text: |-
      De Stichting verstrekt Onze Minister desgevraagd alle inlichtingen met betrekking tot de werkzaamheden van de
      Stichting.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.15
  - number: 2.15.2
    text: |-
      Onze Minister kan inzage verlangen in zakelijke gegevens en bescheiden van de Stichting voor zover dat voor de
      vervulling van zijn taak nodig is.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.15
  - number: 2.16.1
    text: |-
      Als de Stichting naar de mening van Onze Minister zijn taken ernstig verwaarloost, kan Onze Minister na overleg met
      de Stichting de noodzakelijke voorzieningen treffen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.16
  - number: 2.16.2
    text: |-
      Onze Minister stelt de Tweede Kamer der Staten-Generaal onverwijld in kennis van de door hem getroffen
      voorzieningen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.16
  - number: 2.17.1
    text: De Stichting stelt jaarlijks vóór 1 juni een jaarverslag over het afgelopen kalenderjaar vast.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.17
  - number: 2.17.2
    text: |-
      In het jaarverslag wordt aandacht besteed aan de werkzaamheden van de Stichting, het gevoerde beleid in het
      algemeen en de doelmatigheid en doeltreffendheid van de werkwijze in het bijzonder.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.17
  - number: 2.17.3
    text: De Stichting zendt het verslag aan Onze Minister en maakt het openbaar.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.17
  - number: 2.18.1
    text: Wijzigingen in de statuten van de Stichting behoeven de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.18
  - number: 2.18.2
    text: De raad van toezicht en de raad van bestuur kunnen niet besluiten tot ontbinding van de Stichting.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.18
  - number: 2.19.1
    text: |-
      Voor de verwezenlijking van de publieke mediaopdracht op landelijk niveau wordt bij koninklijk besluit aan de
      Stichting een concessie verleend.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.19
  - number: 2.19.2
    text: |-
      De concessie geldt voor tien jaar en treedt in werking met ingang van een in het koninklijk besluit te bepalen
      tijdstip.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.19
  - number: 2.19.3
    text: |-
      Voor de toepassing van de [artikelen 2.20][ref1], [2.29][ref2] en [2.43, eerste lid][ref3], bestaat de
      concessieperiode uit twee perioden van vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.1.4
        afdeling: 2.2.1
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.2.2
      - id: ref3
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.2.4
  - number: 2.20.1
    text: |-
      Voorafgaand aan de concessieverlening en vóór aanvang van de tweede periode van vijf jaar van de concessieperiode
      dient de Stichting een concessiebeleidsplan voor de komende vijf jaar in bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.20
  - number: 2.20.2
    text: 'Het concessiebeleidsplan bevat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.20
  - number: 2.20.2.a
    text: |-
      een beschrijving van de wijze waarop in de komende vijf jaar de publieke mediaopdracht op landelijk niveau
      wordt uitgevoerd, tevens uitgewerkt in kwantitatieve en kwalitatieve doelstellingen voor het media-aanbod en het
      publieksbereik van de landelijke publieke mediadienst;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.20
  - number: 2.20.2.b
    text: aard en aantal van de programmakanalen en de daarvoor gewenste frequentieruimte;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.20
  - number: 2.20.2.c
    text: aard en aantal van de overige aanbodkanalen;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.20
  - number: 2.20.2.d
    text: |-
      een onderbouwd overzicht van de naar verwachting benodigde organisatorische, personele, materiële en financiële
      middelen; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.20
  - number: 2.20.2.e
    text: |-
      een beschrijving van de samenwerking met de Wereldomroep, regionale en lokale publieke media-instellingen en
      anderen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.20
  - number: 2.20.3
    text: |-
      Bij ministeriële regeling kunnen regels gesteld worden over de inrichting van het concessiebeleidsplan en het
      tijdstip van indiening.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.20
  - number: 2.20.4
    text: |-
      De raad van bestuur stelt het concessiebeleidsplan vast na overleg met in elk geval de landelijke publieke
      media-instellingen en, voor zover het de samenwerking betreft, de betrokken regionale en lokale publieke media-
      instellingen en de Wereldomroep.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.20
  - number: 2.21.1
    text: De Stichting maakt het concessiebeleidsplan openbaar.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.21
  - number: 2.21.2
    text: Over het concessiebeleidsplan vraagt Onze Minister advies aan het Commissariaat en de Raad voor cultuur.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.21
  - number: 2.21.3
    text: |-
      Het concessiebeleidsplan behoeft de instemming van Onze Minister voor zover het betreft de onderwerpen, bedoeld
      in [artikel 2.20, tweede lid, onderdelen b en c][ref1], waarbij de instemming geschiedt met inachtneming van
      [artikel 3.3, tweede lid, van de Telecommunicatiewet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.21
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.1.4
        afdeling: 2.2.1
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
  - number: 2.21.4
    text: |-
      Als de Stichting wijzigingen wil aanbrengen in het door Onze Minister goedgekeurde deel van het
      concessiebeleidsplan, neemt zij die op in de begroting. Het eerste en tweede lid zijn van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.21
  - number: 2.22.1
    text: |-
      Mede op basis van het concessiebeleidsplan sluiten Onze Minister en de Stichting een prestatieovereenkomst voor de
      duur van het concessiebeleidsplan.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.22
  - number: 2.22.2
    text: 'De prestatieovereenkomst bevat afspraken over:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.22
  - number: 2.22.2.a
    text: |-
      kwalitatieve en kwantitatieve doelstellingen voor het media-aanbod en het publieksbereik van de landelijke publieke
      mediadienst;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.22
  - number: 2.22.2.b
    text: maatregelen bij niet naleving, voor zover mogelijk binnen het bepaalde bij of krachtens deze wet; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.22
  - number: 2.22.2.c
    text: tussentijdse wijziging in verband met veranderende inzichten of omstandigheden.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.22
  - number: 2.22.3
    text: |-
      De prestatieovereenkomst heeft geen betrekking op de inhoud van het media-aanbod van de landelijke publieke
      mediadienst.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.22
  - number: 2.23.1
    text: |-
      De Stichting verzorgt media-aanbod dat zich bij uitstek leent voor een gezamenlijke verzorging, waaronder media-
      aanbod dat:
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.23
  - number: 2.23.1.a
    text: een hoge frequentie en vaste regelmaat van verspreiding vereist;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.23
  - number: 2.23.1.b
    text: een algemeen dienstverlenend karakter draagt; of
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.23
  - number: 2.23.1.c
    text: met een doelmatiger inzet van middelen beter gezamenlijk tot stand kan worden gebracht.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.23
  - number: 2.23.2
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald welk media-aanbod als bedoeld in het eerste lid in ieder
      geval door de Stichting wordt verzorgd.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.23
  - number: 2.23.3
    text: De Stichting verzorgt teletekst voor de landelijke publieke mediadienst.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.23
  - number: 2.23.4
    text: |-
      Voor de verzorging van het media-aanbod stelt de raad van bestuur een mediadirecteur aan die in dienst is van de
      Stichting en die geen lid is van de raad van toezicht of de raad van bestuur.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.23
  - number: 2.24.1
    text: |-
      Onze Minister kan eens in de vijf jaar aan omroepverenigingen erkenningen en voorlopige erkenningen verlenen voor
      de verzorging van media-aanbod voor de landelijke publieke mediadienst volgens de bepalingen van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.24
  - number: 2.24.2
    text: 'Omroepverenigingen zijn verenigingen die:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.24
  - number: 2.24.2.a
    text: rechtspersoon naar Nederlands recht met volledige rechtsbevoegdheid zijn;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.24
  - number: 2.24.2.b
    text: |-
      zich volgens de statuten uitsluitend of hoofdzakelijk ten doel stellen ter uitvoering van de publieke mediaopdracht
      op landelijk niveau media-aanbod te verzorgen en alle activiteiten te verrichten die nodig zijn om daarmee een
      publieke taak van algemeen nut te vervullen;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.24
  - number: 2.24.2.c
    text: |-
      zich volgens de statuten ten doel stellen in het media-aanbod een bepaalde, in de statuten aangeduide
      maatschappelijke, culturele, godsdienstige of geestelijke stroming te vertegenwoordigen en zich in het media-aanbod
      te richten op de bevrediging van in de samenleving levende maatschappelijke, culturele of godsdienstige dan wel
      geestelijke behoeften;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.24
  - number: 2.24.2.d
    text: hun leden op democratisch aanvaardbare wijze invloed geven op het beleid; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.24
  - number: 2.24.2.e
    text: |-
      een jaarlijkse contributie van ten minste € 5,72 heffen waarin de verstrekking van een programmablad niet is
      begrepen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.24
  - number: 2.24.3
    text: |-
      Het in het tweede lid, onderdeel e, genoemde bedrag kan bij algemene maatregel van bestuur naar aanleiding van de
      door het Centraal Bureau voor de Statistiek vastgestelde consumentenprijsindex worden aangepast.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.24
  - number: '2.25'
    text: 'Voor een erkenning komen slechts in aanmerking omroepverenigingen die:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.25
  - number: 2.25.a
    text: in de voorafgaande erkenningperiode een erkenning of voorlopige erkenning hadden; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.25
  - number: 2.25.b
    text: ten minste 150 000 leden hebben.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.25
  - number: '2.26'
    text: 'Voor een voorlopige erkenning komen slechts in aanmerking omroepverenigingen die:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.26
  - number: 2.26.a
    text: in de voorafgaande erkenningperiode geen erkenning of voorlopige erkenning hadden;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.26
  - number: 2.26.b
    text: ten minste 50 000 leden hebben; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.26
  - number: 2.26.c
    text: |-
      blijkens het beleidsplan, bedoeld in [artikel 2.30][ref1], een voorgenomen media-aanbod hebben dat naar inhoud en
      strekking zodanig afwijkt van het media-aanbod van de omroepverenigingen, bedoeld in [artikel 2.25][ref2], dat het
      de verscheidenheid van het media-aanbod van de landelijke publieke mediadienst vergroot en daarmee een vernieuwende
      bijdrage levert aan de uitvoering van de publieke mediaopdracht op landelijk niveau.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.26
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.2.2
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.2.2
  - number: 2.27.1
    text: |-
      Het Commissariaat stelt het aantal leden per omroepvereniging die een aanvraag voor een erkenning of voorlopige
      erkenning hebben ingediend vast op een peildatum die door Onze Minister wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.27
  - number: 2.27.2
    text: 'Als lid tellen mee personen die:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.27
  - number: 2.27.2.a
    text: 16 jaar of ouder zijn;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.27
  - number: 2.27.2.b
    text: in Nederland woonachtig zijn; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.27
  - number: 2.27.2.c
    text: |-
      de jaarlijkse minimumcontributie, bedoeld in [artikel 2.24, tweede lid, onderdeel e][ref1], hebben betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.27
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.2.2
  - number: 2.27.3
    text: |-
      Het Commissariaat bepaalt de wijze waarop de vaststelling van het aantal leden gebeurt en omroepverenigingen
      verstrekken aan het Commissariaat alle gegevens die het daarvoor nodig acht.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.27
  - number: 2.28.1
    text: |-
      Onze Minister kan eens in de vijf jaar aan een instelling een erkenning verlenen voor de verzorging van educatief
      media-aanbod voor de landelijke publieke mediadienst volgens de bepalingen van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.28
  - number: 2.28.2
    text: 'Voor een erkenning komt slechts in aanmerking een instelling die:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.28
  - number: 2.28.2.a
    text: rechtspersoon naar Nederlands recht met volledige rechtsbevoegdheid is;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.28
  - number: 2.28.2.b
    text: |-
      zich volgens de statuten uitsluitend ten doel stelt het verzorgen van een breed en samenhangend educatief media-
      aanbod op het gebied van onderwijs, scholing en vorming;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.28
  - number: 2.28.2.c
    text: |-
      volgens de statuten een bestuur heeft waarin deskundigen uit de kring van representatieve landelijke organisaties
      op het gebied van onderwijs, scholing en vorming zitting hebben; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.28
  - number: 2.28.2.d
    text: |-
      volgens de statuten een orgaan heeft dat het beleid voor het media-aanbod bepaalt en dat representatief is voor
      maatschappelijke en levensbeschouwelijk organisaties op het terrein van onderwijs, scholing en vorming.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.28
  - number: 2.28.3
    text: De statuten en wijzigingen daarvan behoeven de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.28
  - number: 2.29.1
    text: |-
      Een erkenning of een voorlopige erkenning wordt op aanvraag verleend en geldt voor een periode van vijf jaar die
      samenvalt met een vijfjaarlijkse periode van de concessie als bedoeld in [artikel 2.19, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.29
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.1.4
        afdeling: 2.2.1
  - number: 2.29.2
    text: |-
      Een erkenning of voorlopige erkenning is niet overdraagbaar en vervalt van rechtswege na afloop van de
      erkenningperiode.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.29
  - number: 2.29.3
    text: |-
      Een erkenning of voorlopige erkenning geeft aanspraak op een financiële bijdrage voor de verzorging van media-
      aanbod volgens het bepaalde bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.29
  - number: 2.30.1
    text: Een aanvraag voor een erkenning of voorlopige erkenning bevat de statuten van de aanvrager en een beleidsplan.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.30
  - number: 2.30.2
    text: 'Het beleidsplan bevat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.30
  - number: 2.30.2.a
    text: |-
      het voorgenomen beleid ten aanzien van het media-aanbod, met in achtneming van de bij of krachtens deze wet
      gestelde verplichtingen voor het media-aanbod van de landelijk publieke mediadienst; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.30
  - number: 2.30.2.b
    text: |-
      de voornemens en afspraken over samenwerking ten behoeve van de landelijke publieke mediadienst met andere
      aanvragers van een erkenning of een voorlopige erkenning, de Stichting of de Programmastichting.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.30
  - number: 2.30.3
    text: |-
      Het deel van het beleidsplan dat betrekking heeft op samenwerking kan door de desbetreffende aanvragers gezamenlijk
      worden ingediend.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.30
  - number: 2.30.4
    text: 'Bij ministeriële regeling kunnen nadere regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.30
  - number: 2.30.4.a
    text: het tijdstip en de wijze van indiening van een aanvraag;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.30
  - number: 2.30.4.b
    text: de inrichting van een aanvraag en het beleidsplan; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.30
  - number: 2.30.4.c
    text: de termijn en wijze waarop een besluit op een aanvraag wordt genomen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.30
  - number: 2.31.1
    text: |-
      Voordat Onze Minister besluit over het verlenen van een erkenning of voorlopige erkenning vraagt hij de Raad voor
      cultuur, het Commissariaat en de Stichting binnen een door hem te stellen termijn te adviseren over een aanvraag.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.31
  - number: 2.31.2
    text: |-
      Het uitblijven van een advies staat aan het nemen van een besluit over het verlenen van een erkenning of voorlopige
      erkenning niet in de weg.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.31
  - number: 2.32.1
    text: 'Onze Minister wijst een aanvraag voor een erkenning of een voorlopige erkenning af als de aanvrager:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.32
  - number: 2.32.1.a
    text: |-
      niet voldoet aan de [artikelen 2.24, tweede lid][ref1], [2.25][ref2], [2.26][ref3] of [2.28, tweede lid][ref4]; of


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.32
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.2.2
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.2.2
      - id: ref3
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.2.2
      - id: ref4
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.2.2
  - number: 2.32.2
    text: 'Onze Minister kan een aanvraag afwijzen als:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.32
  - number: 2.32.2.a
    text: |-
      de aanvrager niet voldoet aan de bij of krachtens [artikel 2.30, vierde lid][ref1], gestelde eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.32
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.2.2
  - number: 2.32.2.b
    text: |-
      aannemelijk is dat de aanvrager zich, mede gelet op zijn handelwijze in een voorafgaande periode waarin hij een
      erkenning heeft gehad, niet zal houden aan het bepaalde bij of krachtens deze wet; of
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.32
  - number: 2.32.2.c
    text: 'uit de aanvraag naar de mening van Onze Minister onvoldoende blijkt dat:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.32
  - number: 2.32.2.c.1°
    text: in het door de aanvrager te verzorgen media-aanbod de identiteit en missie van de aanvrager tot uitdrukking komt;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.32
  - number: 2.32.2.c.2°
    text: het door de aanvrager te verzorgen media-aanbod voldoet aan de daaraan bij of krachtens deze wet gestelde eisen; of
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.32
  - number: 2.32.2.c.3°
    text: de aanvrager bereid is tot samenwerking ten behoeve van de landelijk publieke mediadienst.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.32
  - number: 2.32.3
    text: |-
      Een aanvraag van een omroepvereniging die een voorlopige erkenning heeft verkregen en die aansluitend
      voor een erkenning in aanmerking wil komen, kan daarnaast worden afgewezen als tijdens de periode van
      de voorlopige erkenning onvoldoende is gebleken dat het media-aanbod voldoet aan de eisen, bedoeld in
      [artikel 2.26, onderdeel c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.32
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.2.2
  - number: 2.33.1
    text: 'Onze Minister trekt een erkenning of voorlopige erkenning in als een instelling:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.33
  - number: 2.33.1.a
    text: |-
      niet meer voldoet aan de [artikelen 2.24, tweede lid][ref1], of [2.28, tweede lid][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.33
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.2.2
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.2.2
  - number: 2.33.2
    text: |-
      Onze Minister kan een erkenning of voorlopige erkenning intrekken als het Commissariaat aan de instelling binnen
      een jaar ten minste twee maal een bestuurlijke sanctie als bedoeld in [titel 7.2][ref1] heeft opgelegd wegens
      overtreding van het bepaalde bij of krachtens deze wet of [artikel 5:20 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.33
    references:
      - id: ref1
        bwb_id: BWBR0025028
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 2.33.3
    text: 'Onze Minister kan op verzoek van de raad van bestuur een erkenning of voorlopige erkenning intrekken als:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.33
  - number: 2.33.3.a
    text: |-
      de raad van bestuur aan de instelling binnen de erkenningperiode twee maal een sanctie als bedoeld in
      [artikel 2.154][ref1] heeft opgelegd; of


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.33
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.2.2
        afdeling: 2.6.2
  - number: 2.33.3.b
    text: |-
      de instelling naar de mening van de raad van bestuur onvoldoende uitvoering geeft aan de bereidheid tot
      samenwerking ten behoeve van de landelijk publieke mediadienst.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.33
  - number: 2.34.1
    text: |-
      De omroepverenigingen en de educatieve media-instelling zijn verplicht gedurende de erkenningperiode media-aanbod
      te verzorgen, waaronder in elk geval radio- en televisieprogramma’s.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.34
  - number: 2.34.2
    text: |-
      Het media-aanbod van een omroepvereniging weerspiegelt de identiteit en missie van die vereniging zoals die in de
      statuten zijn omschreven.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.34
  - number: 2.34.3
    text: Het media-aanbod van de educatieve media-instelling is geheel educatief van aard.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.34
  - number: 2.35.1
    text: |-
      De Nederlandse Programma Stichting heeft tot taak media-aanbod voor de landelijke publieke mediadienst te verzorgen
      dat voorziet in de bevrediging van in de samenleving levende maatschappelijke, culturele, godsdienstige of
      geestelijke behoeften, zodanig dat dit media-aanbod samen met het media-aanbod van de andere landelijke publieke
      media-instellingen een evenwichtig beeld oplevert van de maatschappelijke, culturele, godsdienstige en geestelijke
      verscheidenheid in Nederland.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.35
  - number: 2.35.2
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald welk media-aanbod als bedoeld in het eerste lid in ieder
      geval door de Programmastichting wordt verzorgd.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.35
  - number: 2.36.1
    text: |-
      Het bestuur van de Programmastichting bestaat uit zeven leden die worden benoemd, geschorst en ontslagen door Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.36
  - number: 2.36.2
    text: Onze Minister wijst uit de leden de voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.36
  - number: 2.36.3
    text: |-
      Benoeming geschiedt voor een periode van vier jaar en herbenoeming voor een aansluitende periode is eenmaal
      mogelijk.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.36
  - number: 2.36.4
    text: |-
      Voor benoeming komen in aanmerking personen die deskundig zijn op het gebied van het media-aanbod dat de
      Programmastichting verzorgt.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.36
  - number: 2.37.1
    text: 'Het lidmaatschap van het bestuur van de Programmastichting is onverenigbaar met:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.37
  - number: 2.37.1.a
    text: het lidmaatschap van een orgaan van of een dienstbetrekking bij een andere landelijke publieke media-instelling;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.37
  - number: 2.37.1.b
    text: het lidmaatschap van een orgaan van of een dienstbetrekking bij een commerciële media-instelling;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.37
  - number: 2.37.1.c
    text: het lidmaatschap van een van beide Kamers der Staten-Generaal;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.37
  - number: 2.37.1.d
    text: |-
      een dienstbetrekking bij een ministerie of bij een dienst, instelling of bedrijf vallende onder de
      verantwoordelijkheid van een minister; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.37
  - number: 2.37.1.e
    text: |-
      het hebben van financiële of andere belangen bij bedrijven of instellingen en het vervullen van nevenfuncties
      waardoor een goede vervulling van de functie of de handhaving van de onafhankelijkheid van het betrokken lid of van
      het vertrouwen daarin in het geding kan zijn.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.37
  - number: 2.37.2
    text: 'Schorsing en ontslag zijn mogelijk wegens:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.37
  - number: 2.37.2.a
    text: ongeschiktheid;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.37
  - number: 2.37.2.b
    text: disfunctioneren; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.37
  - number: 2.37.2.c
    text: onverenigbaarheid van functies.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.37
  - number: 2.37.3
    text: Ontslag is verder mogelijk op eigen verzoek.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.37
  - number: 2.38.1
    text: |-
      De Programmastichting heeft een adviesraad die het bestuur adviseert over het media-aanbod dat de
      Programmastichting verzorgt en die bestaat uit een voorzitter en negentien andere leden.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.38
  - number: 2.38.2
    text: |-
      Onze Minister benoemt, schorst en ontslaat de voorzitter. De andere leden worden benoemd, geschorst en ontslagen
      door maatschappelijke en culturele organisaties die door Onze Minister zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.38
  - number: 2.38.3
    text: Benoeming geschiedt voor vijf jaar en herbenoeming voor een aansluitende periode is eenmaal mogelijk.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.38
  - number: 2.38.4
    text: De adviesraad regelt, met instemming van het bestuur van de Programmastichting, zijn werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.38
  - number: 2.39.1
    text: |-
      De Programmastichting verstrekt Onze Minister desgevraagd alle inlichtingen met betrekking tot de werkzaamheden van
      de Programmastichting.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.39
  - number: 2.39.2
    text: |-
      Onze Minister kan inzage verlangen in zakelijke gegevens en bescheiden van de Programmastichting voor zover dat
      voor de vervulling van zijn taak nodig is.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.39
  - number: 2.40.1
    text: De Programmastichting stelt jaarlijks vóór 1 juni een jaarverslag vast over het afgelopen kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.40
  - number: 2.40.2
    text: |-
      In het jaarverslag wordt aandacht besteed aan de werkzaamheden van de Programmastichting, het gevoerde beleid in
      het algemeen en de doelmatigheid en doeltreffendheid van de werkzaamheden in het bijzonder.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.40
  - number: 2.40.3
    text: De Programmastichting zendt het jaarverslag aan Onze Minister en maakt het openbaar.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.40
  - number: 2.41.1
    text: Wijzigingen in de statuten van de Programmastichting behoeven de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.41
  - number: 2.41.2
    text: Het bestuur kan niet besluiten tot ontbinding van de Programmastichting.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.41
  - number: 2.42.1
    text: |-
      Het Commissariaat kan eens in de vijf jaar kerkgenootschappen en genootschappen op geestelijke grondslag of
      rechtspersonen waarin twee of meer van deze genootschappen samenwerken, aanwijzen voor het verzorgen van media-
      aanbod op kerkelijk of geestelijk terrein voor de landelijke publieke mediadienst volgens de bepalingen van deze
      afdeling.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.42
  - number: 2.42.2
    text: |-
      Voor aanwijzing komen in slechts aanmerking kerkgenootschappen en genootschappen op geestelijke grondslag die
      representatief geacht kunnen worden voor een in Nederland aanwezige kerkelijke of geestelijke hoofdstroming.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.42
  - number: 2.43.1
    text: |-
      Een aanwijzing geschiedt op aanvraag, geldt voor een periode van vijf jaar die samenvalt met een vijfjaarlijkse
      periode van de concessie als bedoeld in [artikel 2.19, derde lid][ref1], en vervalt van rechtswege na afloop van
      die periode.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.43
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.1.4
        afdeling: 2.2.1
  - number: 2.43.2
    text: |-
      Een aanwijzing geeft aanspraak op een financiële bijdrage voor de verzorging van media-aanbod volgens het bepaalde
      bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.43
  - number: 2.44.1
    text: |-
      Kerkgenootschappen en genootschappen op geestelijke grondslag tonen in hun aanvragen hun representativiteit voor
      een hoofdstroming naar genoegen van het Commissariaat aan.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.44
  - number: 2.44.2
    text: 'Bij ministeriële regeling kunnen nadere regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.44
  - number: 2.44.2.a
    text: het tijdstip en de wijze van indiening van een aanvraag;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.44
  - number: 2.44.2.b
    text: de inhoud van een aanvraag; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.44
  - number: 2.44.2.c
    text: de termijn waarbinnen een besluit op een aanvraag wordt genomen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.44
  - number: 2.45.1
    text: |-
      Als meerdere aanvragers een aanvraag indienen voor een hoofdstroming bevordert het Commissariaat voor zover dat
      redelijkerwijs mogelijk is samenwerking door of samengaan van die aanvragers.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.45
  - number: 2.45.2
    text: Per kerkelijke of geestelijke hoofdstroming vindt slechts één aanwijzing plaats.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.45
  - number: 2.46.1
    text: 'Het Commissariaat wijst een aanvraag voor een aanwijzing af als de aanvrager:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.46
  - number: 2.46.1.a
    text: |-
      niet voldoet aan de [artikelen 2.42, tweede lid][ref1], of [2.44, eerste lid][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.46
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.2.4
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.2.4
  - number: 2.46.2
    text: 'Het Commissariaat kan een aanvraag afwijzen als:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.46
  - number: 2.46.2.a
    text: |-
      de aanvrager niet voldoet aan de krachtens [artikel 2.44, tweede lid][ref1], gestelde eisen; of


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.46
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.2.4
  - number: 2.46.2.b
    text: |-
      aannemelijk is dat de aanvrager zich, mede gelet op zijn handelwijze in een voorafgaande periode waarin hij is
      aangewezen, niet zal houden aan het bepaalde bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.46
  - number: 2.47.1
    text: 'Het Commissariaat trekt een aanwijzing in als een kerkgenootschap of genootschap op geestelijke grondslag:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.47
  - number: 2.47.1.a
    text: niet meer voldoet aan de eisen voor aanwijzing; of
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.47
  - number: 2.47.2
    text: |-
      Het Commissariaat kan een aanwijzing intrekken als het Commissariaat aan het kerkgenootschap of genootschap
      op geestelijke grondslag binnen een jaar ten minste twee maal een bestuurlijke sanctie als bedoeld
      in [titel 7.2][ref1] heeft opgelegd wegens overtreding van het bepaalde bij of krachtens deze wet of
      [artikel 5:20 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.47
    references:
      - id: ref1
        bwb_id: BWBR0025028
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 2.47.3
    text: |-
      Het Commissariaat kan op verzoek van de raad van bestuur een aanwijzing intrekken als de raad van bestuur aan een
      kerkgenootschap of genootschap op geestelijke grondslag binnen de periode waarvoor de aanwijzing geldt twee maal
      een sanctie als bedoeld in [artikel 2.154][ref1] is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.47
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.2.2
        afdeling: 2.6.2
  - number: 2.48.1
    text: |-
      Onze Minister stelt jaarlijks op advies van het Commissariaat en de Stichting de totale hoeveelheid uren vast die
      op de algemene programmakanalen van de landelijke publieke mediadienst beschikbaar zijn voor kerkgenootschappen en
      genootschappen op geestelijke grondslag.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.48
  - number: 2.48.2
    text: |-
      Het Commissariaat kan in bijzondere gevallen of voor bijzondere doelen extra uren vaststellen en toewijzen. Deze
      extra uren geven geen aanspraak op een vergoeding boven de vergoeding, bedoeld in [artikel 2.153][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.48
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.2.2
        afdeling: 2.6.2
  - number: 2.49.1
    text: |-
      Het Commissariaat stelt jaarlijks voor elk van de aangewezen kerkgenootschappen en genootschappen op geestelijk
      grondslag vast hoeveel uren beschikbaar zijn op de algemene programmakanalen van de landelijke publieke
      mediadienst.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.49
  - number: 2.49.2
    text: |-
      Kerkgenootschappen respectievelijk genootschappen op geestelijke grondslag verzorgen media-aanbod dat geheel ligt
      op kerkelijk respectievelijk geestelijk terrein en dat verband houdt met de kerkelijke of geestelijke identiteit.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.49
  - number: 2.49.3
    text: |-
      Kerkgenootschappen en genootschappen op geestelijke grondslag kunnen de verzorging van hun media-aanbod opdragen
      aan de Stichting, een omroepvereniging of een door hen opgerichte rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.49
  - number: 2.50.1
    text: |-
      Gedurende de concessieperiode, bedoeld in [artikel 2.19][ref1], wordt op ten minste drie algemene
      televisieprogrammakanalen en vijf algemene radioprogrammakanalen van de landelijke publieke mediadienst programma-
      aanbod verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.50
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.1.4
        afdeling: 2.2.1
  - number: 2.50.2
    text: Het programma-aanbod op de onderscheiden algemene programmakanalen heeft een herkenbaar profiel.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.50
  - number: 2.51.1
    text: 'Op de algemene programmakanalen:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.51
  - number: 2.51.1.a
    text: |-
      beschikken omroepverenigingen waarvan het Commissariaat bij de erkenningverlening heeft vastgesteld dat zij 300 000
      of meer leden hebben per jaar over 650 uren voor televisie en 3000 uren voor radio;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.51
  - number: 2.51.1.b
    text: |-
      beschikken omroepverenigingen waarvan het Commissariaat bij de erkenningverlening heeft vastgesteld dat zij ten
      minste 150 000, doch minder dan 300 000 leden hebben per jaar over 325 uren voor televisie en 1500 uren voor radio;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.51
  - number: 2.51.1.c
    text: |-
      beschikken omroepverenigingen die een voorlopige erkenning hebben verkregen per jaar over 100 uren voor televisie
      en 450 uren voor radio;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.51
  - number: 2.51.1.d
    text: beschikt de Stichting per jaar over 1300 uren voor televisie en 1500 uren voor radio;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.51
  - number: 2.51.1.e
    text: beschikt de Programmastichting per jaar over 650 uren voor televisie en 3 000 uren voor radio; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.51
  - number: 2.51.1.f
    text: beschikt de educatieve media-instelling per jaar over 500 uren voor televisie en 475 uren voor radio.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.51
  - number: 2.51.2
    text: De instellingen, bedoeld in het eerste lid, kunnen meer uren gebruiken.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.51
  - number: 2.51.3
    text: |-
      Bij algemene maatregel van bestuur kan de verdeling van het eerste lid, onderdelen a tot en met c, worden herzien
      als het aantal omroepverenigingen daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.51
  - number: 2.52.1
    text: |-
      De instellingen gebruiken hun uren, bedoeld in [artikel 2.51, eerste lid][ref1], geheel.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.52
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.2.5
  - number: 2.52.2
    text: |-
      In overleg met de raad van bestuur kan worden afgeweken van het eerste lid als dat voor de samenstelling van een
      samenhangend, pluriform, gevarieerd en kwalitatief hoogstaand media-aanbod op de aanbodkanalen van de landelijke
      publieke mediadienst wenselijk is.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.52
  - number: 2.53.1
    text: De raad van bestuur deelt de uren in.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.53
  - number: 2.53.2
    text: 'De raad van bestuur kan deze indeling herzien:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.53
  - number: 2.53.2.a
    text: als een erkenning of een voorlopige erkenning wordt ingetrokken;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.53
  - number: 2.53.2.b
    text: als de aan een instelling ter beschikking staande uren worden ingetrokken of verminderd;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.53
  - number: 2.53.2.c
    text: in het belang van de coördinatie en ordening op en tussen de verschillende programmakanalen van de programma’s; of
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.53
  - number: 2.53.2.d
    text: op grond van omstandigheden die niet voorzien waren ten tijde van de indeling.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.53
  - number: 2.54.1
    text: |-
      Bij de indeling zorgt de raad van bestuur er voor dat tussen 16.00 uur en 24.00 uur op de algemene
      televisieprogrammakanalen en tussen 7.00 uur en 19.00 uur op de algemene radioprogrammakanalen een evenwichtige
      verdeling van de uren wordt bereikt.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.54
  - number: 2.54.2
    text: |-
      De raad van bestuur zorgt er in het kader van de coördinatie voor dat het media-aanbod op de aanbodkanalen van de
      landelijke publieke mediadienst past binnen de kaders van [artikel 2.1][ref1], het concessiebeleidsplan, bedoeld in
      [artikel 2.19][ref2], en de profielen van de aanbodkanalen en voldoet aan de [artikelen 2.115, eerste lid][ref3],
      [2.116][ref4] en [2.119 tot en met 2.123][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.54
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.1.4
        afdeling: 2.2.1
      - id: ref3
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.4.1
        afdeling: 2.5.4
      - id: ref4
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.4.1
        afdeling: 2.5.4
      - id: ref5
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.4.1
        afdeling: 2.5.4
  - number: 2.55.1
    text: |-
      De raad van bestuur bevordert dat tussen de Stichting en de andere landelijke publieke media-instellingen afspraken
      tot stand komen over de kwantitatieve en kwalitatieve doelstellingen voor het media-aanbod en het publieksbereik op
      de aanbodkanalen en over de wederzijdse inspanningen daarvoor.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.55
  - number: 2.55.2
    text: 'De instellingen:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.55
  - number: 2.55.2.a
    text: |-
      stellen het media-aanbod dat zij ter uitvoering van hun publieke taak verzorgen ter beschikking voor verspreiding
      op de aanbodkanalen; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.55
  - number: 2.55.2.b
    text: |-
      zorgen voor voldoende gebruiksrechten op dat media-aanbod voor verspreiding, hergebruik en ontsluiting op de
      aanbodkanalen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.55
  - number: 2.56.1
    text: |-
      Voor de coördinatie en ordening van het programma-aanbod op een algemeen televisieprogrammakanaal wordt de raad van
      bestuur bijgestaan door een redactie die als volgt is samengesteld:
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.56
  - number: 2.56.1.a
    text: |-
      de omroepverenigingen, de educatieve media-instelling, de Programmastichting en de Stichting van wie een door de
      raad van bestuur te bepalen belangrijk deel van de uren, bedoeld in [artikel 2.51, eerste lid][ref1], tussen 16.00
      uur en 24.00 uur is ingedeeld op het desbetreffende programmakanaal benoemen elk één lid; en


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.56
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.2.5
  - number: 2.56.1.b
    text: |-
      de kerkgenootschappen en genootschappen op geestelijke grondslag van wie uren zijn ingedeeld op het desbetreffende
      programmakanaal benoemen gezamenlijk één lid.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.56
  - number: 2.56.2
    text: |-
      Voor de coördinatie en ordening van het programma-aanbod op een radioprogrammakanaal wordt de raad van bestuur
      bijgestaan door een redactie waarin de instellingen van wie uren op het desbetreffende programmakanaal zijn
      ingedeeld elk één lid benoemen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.56
  - number: 2.56.3
    text: |-
      Het lidmaatschap van een redactie is onverenigbaar met het lidmaatschap van een toezichts- of bestuursorgaan van
      een landelijke publieke media-instelling.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.56
  - number: '2.57'
    text: |-
      Een regeling voor de coördinatie en ordening van het media-aanbod als bedoeld in
      [artikel 2.10, tweede lid, onderdeel c][ref1], regelt in elk geval:


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.57
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.1.2
        afdeling: 2.2.1
  - number: 2.57.a
    text: |-
      de wijze waarop de coördinatie en ordening van het media-aanbod op en tussen de verschillende aanbodkanalen
      plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.57
  - number: 2.57.b
    text: |-
      de wijze waarop de raad van bestuur zijn bevoegdheid om het beoogde moment van verspreiding van media-aanbod te
      wijzigen of media-aanbod niet te verspreiden, gebruikt; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.57
  - number: 2.57.c
    text: |-
      de wijze waarop de raad van bestuur het tot stand komen van afspraken als bedoeld in
      [artikel 2.55, eerste lid][ref1], bevordert.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.57
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.2.5
  - number: '2.58'
    text: |-
      De Stichting stuurt jaarlijks vóór 1 mei aan het Commissariaat en Onze Minister een verslag over het afgelopen
      kalenderjaar met daarin in elk geval:
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.58
  - number: 2.58.a
    text: |-
      een beschrijving van de wijze waarop door de landelijke publieke media-instellingen op de verschillende
      aanbodkanalen uitvoering is gegeven aan de publieke mediaopdracht;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.58
  - number: 2.58.b
    text: |-
      de samenstelling van het media-aanbod van de publieke mediadienst op de programmakanalen en voor zover mogelijk
      op de overige aanbodkanalen, waaronder de uren die besteed zijn aan media-aanbod op de terreinen genoemd in
      [artikel 2.1, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.58
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.58.c
    text: |-
      een rapportage over de realisering van de doelstellingen van de prestatieovereenkomst, bedoeld in
      [artikel 2.22][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.58
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.1.4
        afdeling: 2.2.1
  - number: 2.58.d
    text: |-
      de naleving van de [artikelen 2.115 tot en met 2.123][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.58
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.4.1
        afdeling: 2.5.4
  - number: 2.58.e
    text: |-
      de naleving van de gedragscode, bedoeld in [artikel 2.3, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.58
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.1.1
        afdeling: 2.2.1
  - number: 2.59.1
    text: |-
      De landelijke publieke media-instellingen verstrekken desgevraagd aan de raad van toezicht van de Stichting, de
      raad van bestuur en de door hem daartoe aangewezen medewerkers van de Stichting alle inlichtingen voor zover dat
      voor de vervulling van de taken van de raad van toezicht en de raad van bestuur redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.59
  - number: 2.59.2
    text: |-
      De raad van bestuur en de door hem daartoe aangewezen medewerkers van de Stichting kunnen inzage verlangen in
      zakelijke gegevens en bescheiden van de instellingen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.59
  - number: 2.60.1
    text: |-
      Onverminderd [artikel 2.88, eerste lid][ref1], zijn de regelingen, bedoeld in
      [artikel 2.10, tweede lid, onderdeel c][ref2], en de overige besluiten die de raad van bestuur of de door hem
      gemandateerden nemen in de uitoefening van hun taken bindend voor de instellingen die media-aanbod verzorgen voor
      de landelijke publieke mediadienst en de politieke partijen en de overheid aan wie op grond van [titel 6.1][ref3]
      uren zijn toegewezen, voor zover die regelingen en besluiten hen aangaan.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.60
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.5.1
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.1.2
        afdeling: 2.2.1
      - id: ref3
        bwb_id: BWBR0025028
        hoofdstuk: '6'
  - number: 2.60.2
    text: De raad van bestuur ziet er op toe dat de regelingen en besluiten worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.60
  - number: 2.61.1
    text: |-
      Voor de verzorging van de publieke mediadiensten op regionaal en lokaal niveau kan het Commissariaat regionale
      respectievelijk lokale instellingen als publieke media-instellingen aanwijzen volgens de bepalingen van deze
      paragraaf.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.61
  - number: 2.61.2
    text: 'Voor aanwijzing komen slechts in aanmerking instellingen die:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.61
  - number: 2.61.2.a
    text: rechtspersoon naar Nederlands recht met volledige rechtsbevoegdheid zijn;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.61
  - number: 2.61.2.b
    text: |-
      zich volgens de statuten uitsluitend of hoofdzakelijk ten doel stellen het op regionaal respectievelijk lokaal
      niveau uitvoeren van de publieke mediaopdracht door het verzorgen van media-aanbod dat gericht is op de bevrediging
      van maatschappelijke behoeften die in een provincie, een gemeente of een deel van de provincie waarop de instelling
      zich richt leven, en het verrichten van alle activiteiten die nodig zijn om daarmee een publieke taak te vervullen;
      en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.61
  - number: 2.61.2.c
    text: |-
      volgens de statuten een orgaan hebben dat het beleid voor het media-aanbod bepaalt en dat representatief is voor de
      belangrijkste in de desbetreffende provincie of gemeente voorkomende maatschappelijke, culturele, godsdienstige en
      geestelijke stromingen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.61
  - number: 2.62.1
    text: |-
      Aanwijzing geschiedt nadat Provinciale Staten hebben dan wel de gemeenteraad heeft geadviseerd over de vraag of de
      instelling aan de eisen, bedoeld in [artikel 2.61, tweede lid][ref1], voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.62
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.3.1
  - number: 2.62.2
    text: |-
      Een regionale publieke media-instelling wordt alleen aangewezen als Provinciale Staten zich bereid verklaren voor
      de bekostiging ervan zorg te dragen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.62
  - number: 2.63.1
    text: |-
      Als meer dan één lokale instelling in een gemeente aan de eisen, bedoeld in [artikel 2.61, tweede lid][ref1],
      voldoet, bevordert het College van Burgemeester en Wethouders voor zover dat redelijkerwijs mogelijk is het
      samengaan van die instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.63
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.3.1
  - number: 2.63.2
    text: |-
      Er kan per gemeente slechts één lokale publieke media-instelling worden aangewezen, waarbij het Commissariaat acht
      slaat op alle factoren die voor het functioneren van de instelling van belang kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.63
  - number: 2.64.1
    text: |-
      Een instelling die de publieke mediaopdracht wil uitvoeren voor meer dan één provincie of gemeente, wordt alleen
      dan voor dat gebied aangewezen, als Provinciale Staten of de gemeenteraden van de desbetreffende provincies of
      gemeenten het in [artikel 2.62, eerste lid][ref1], bedoelde advies gezamenlijk hebben uitgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.64
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.3.1
  - number: 2.64.2
    text: |-
      Het Commissariaat stelt Provinciale Staten en de gemeenteraden van de desbetreffende provincies of gemeenten in
      kennis van een aanvraag van een instelling als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.64
  - number: 2.65.1
    text: Een aanwijzing geschiedt op aanvraag, geldt voor vijf jaar en vervalt van rechtswege na afloop van deze periode.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.65
  - number: 2.65.2
    text: |-
      Zonodig wijst het Commissariaat de dagen waarop en de uren waarin programma-aanbod van regionale en lokale
      mediadiensten wordt uitgezonden op de voor de regionale dan wel lokale publieke mediadiensten beschikbare ruimte op
      een omroepzender.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.65
  - number: 2.66.1
    text: |-
      Provinciale Staten brengen dan wel de gemeenteraad brengt tijdens de aanwijzingsperiode ten minste eenmaal aan het
      Commissariaat advies uit over de vraag of een aangewezen regionale of lokale publieke media-instelling naar hun of
      zijn mening nog voldoet aan de eisen van [artikel 2.61, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.66
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.3.1
  - number: 2.66.2
    text: |-
      Als tijdens de aanwijzingsperiode bij het Commissariaat ernstige twijfel bestaat of de regionale of lokale publieke
      media-instelling nog aan de eisen van [artikel 2.61, tweede lid][ref1], voldoet, kan hij een tussentijds advies
      vragen.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.66
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.3.1
  - number: 2.67.1
    text: 'Het Commissariaat trekt een aanwijzing in als de desbetreffende regionale of lokale publieke media-instelling:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.67
  - number: 2.67.1.a
    text: |-
      niet meer voldoet aan de eisen van [artikel 2.61, tweede lid][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.67
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.3.1
  - number: 2.67.2
    text: |-
      Het Commissariaat trekt de aanwijzing van een regionale of lokale publieke media-instelling die niet meer voldoet
      aan [artikel 2.61, tweede lid, onderdelen b of c][ref1], pas in nadat de desbetreffende media-instelling gedurende
      vier maanden, gerekend van de dag waarop het desbetreffende feit is geconstateerd, in de gelegenheid is gesteld
      opnieuw aan dit vereiste te voldoen en zij daarin niet is geslaagd.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.67
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.3.1
  - number: 2.68.1
    text: 'Een aanwijzing kan door het Commissariaat worden ingetrokken als:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.68
  - number: 2.68.1.a
    text: |-
      de regionale of lokale publieke media-instelling in een periode van een jaar geen media-aanbod dat voldoet aan de
      eisen van deze wet heeft verzorgd en dat aanbod gedurende een ononderbroken periode van ten minste twee maanden is
      verspreid; of
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.68
  - number: 2.68.1.b
    text: |-
      het Commissariaat aan de regionale of lokale publieke media-instelling binnen een periode van een jaar ten minste
      twee maal een bestuurlijke sanctie als bedoeld in [titel 7.2][ref1] heeft opgelegd voor overtreding van het
      bepaalde bij of krachtens deze wet of [artikel 5:20 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.68
    references:
      - id: ref1
        bwb_id: BWBR0025028
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 2.68.2
    text: |-
      Het Commissariaat beslist pas over intrekking op grond van het eerste lid, onderdeel a, nadat hij Gedeputeerde
      Staten, respectievelijk het College van Burgemeester en Wethouders van de desbetreffende provincie of gemeente
      in de gelegenheid heeft gesteld binnen een door het Commissariaat te stellen redelijke termijn hun zienswijze te
      geven.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.68
  - number: 2.68.3
    text: |-
      Het uitblijven van een zienswijze binnen de gestelde termijn staat aan het nemen van een beslissing door het
      Commissariaat niet in de weg.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.68
  - number: '2.69'
    text: 'Bij ministeriële regeling kunnen nadere regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.69
  - number: 2.69.a
    text: de wijze waarop aanvragen voor een aanwijzing worden ingediend;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.69
  - number: 2.69.b
    text: de termijn waarbinnen beslissingen op de aanvragen worden genomen;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.69
  - number: 2.69.c
    text: |-
      de termijn waarop adviezen als bedoeld in [artikel 2.62, eerste lid][ref1], worden uitgebracht; en


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.69
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.3.1
  - number: 2.69.d
    text: de termijn waarop beslissingen over aanwijzing of intrekking van een aanwijzing in werking treden.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.69
  - number: '2.70'
    text: 'Het programma-aanbod van de regionale en lokale publieke mediadienst bestaat per programmakanaal:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.70
  - number: 2.70.a
    text: |-
      voor ten minste vijftig procent van de duur uit aanbod van informatieve, culturele en educatieve aard dat in het
      bijzonder betrekking heeft op de provincie respectievelijk gemeente waarvoor het aanbod bestemd is; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.70
  - number: 2.70.b
    text: |-
      voor ten minste uit een bij algemene maatregel van bestuur vast te stellen percentage aanbod als bedoeld in
      onderdeel a dat door de regionale respectievelijk lokale publieke media-instelling zelf of uitsluitend in haar
      opdracht is geproduceerd.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.70
  - number: 2.71.1
    text: |-
      Een lokale publieke media-instelling kan met de regionale publieke media-instelling in wier verzorgingsgebied zij
      werkzaam is een samenwerkingsovereenkomst sluiten.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.71
  - number: 2.71.2
    text: De overeenkomst wordt overgelegd aan het Commissariaat.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.71
  - number: 2.71.3
    text: |-
      Bij een samenwerkingsovereenkomst voor de verzorging van programma-aanbod kan in afwijking van [artikel 2.70][ref1]
      het programma-aanbod van de lokale publieke mediadienst:


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.71
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.3.2
  - number: 2.71.3.a
    text: |-
      voor ten minste vijftig procent van de duur bestaan uit aanbod dat in het bijzonder betrekking heeft op de gemeente
      waarvoor het programma-aanbod bestemd is, of op de provincie waarbinnen die gemeente ligt; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.71
  - number: 2.71.3.b
    text: |-
      voor ten minste het percentage, bedoeld in [artikel 2.70, onderdeel b][ref1], bestaan uit aanbod dat:


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.71
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.3.2
  - number: 2.71.3.b.1°
    text: geproduceerd is door de lokale publieke media-instelling zelf;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.71
  - number: 2.71.3.b.2°
    text: |-
      geproduceerd is door de regionale publieke media-instelling waarmee zij de samenwerkingsovereenkomst heeft
      gesloten; of
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.71
  - number: 2.71.3.b.3°
    text: uitsluitend in opdracht van een van hen of van hen beiden, is geproduceerd.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.71
  - number: 2.71.4
    text: 'Bij algemene maatregel van bestuur kan worden bepaald:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.71
  - number: 2.71.4.a
    text: |-
      dat een gedeelte van het aanbod, bedoeld in het derde lid, onderdeel a, in het bijzonder betrekking heeft op de
      gemeente waarvoor het programma-aanbod is bestemd; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.71
  - number: 2.71.4.b
    text: |-
      dat een gedeelte van het aanbod, bedoeld in het derde lid, onderdeel b, door de lokale publieke media-instelling
      zelf of uitsluitend in haar opdracht is geproduceerd.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.71
  - number: '2.72'
    text: |-
      De taak van de Stichting Radio Nederland Wereldomroep is het uitvoeren van de publieke mediaopdracht, bedoeld in
      [artikel 2.1, eerste lid, onderdeel b][ref1], door:


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.72
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.72.a
    text: het informeren van Nederlandstaligen in het buitenland;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.72
  - number: 2.72.b
    text: het voorzien in onafhankelijke informatie in landen met een informatieachterstand;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.72
  - number: 2.72.c
    text: het verspreiden van een realistisch beeld van Nederland in het buitenland; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.72
  - number: 2.72.d
    text: |-
      het verrichten van alle activiteiten die daarvoor nodig of ondersteunend zijn, waaronder het oprichten van of
      deelnemen in organisaties en rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.72
  - number: '2.73'
    text: De organen van de Wereldomroep zijn een raad van toezicht, een directie en een adviesraad.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.73
  - number: 2.74.1
    text: De raad van toezicht bestaat uit zeven leden die door Onze Minister worden benoemd, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.74
  - number: 2.74.2
    text: Onze Minister wijst uit de leden de voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.74
  - number: 2.74.3
    text: Benoeming geschiedt voor vier jaar en herbenoeming voor een aansluitende periode is eenmaal mogelijk.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.74
  - number: 2.75.1
    text: 'Het lidmaatschap van de raad van toezicht is onverenigbaar met:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.75
  - number: 2.75.1.a
    text: het lidmaatschap van de adviesraad;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.75
  - number: 2.75.1.b
    text: het lidmaatschap van de directie;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.75
  - number: 2.75.1.c
    text: het lidmaatschap van een orgaan van of een dienstbetrekking bij een commerciële media-instelling;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.75
  - number: 2.75.1.d
    text: het lidmaatschap van een van beide Kamers der Staten-Generaal;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.75
  - number: 2.75.1.e
    text: |-
      een dienstbetrekking bij een ministerie of bij een dienst, instelling of bedrijf vallende onder de
      verantwoordelijkheid van een minister; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.75
  - number: 2.75.1.f
    text: |-
      het hebben van financiële of andere belangen bij bedrijven of instellingen en het vervullen van nevenfuncties
      waardoor een goede vervulling van de functie of de handhaving van de onafhankelijkheid van het betrokken lid of van
      het vertrouwen daarin in het geding kan zijn.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.75
  - number: 2.75.2
    text: 'Schorsing en ontslag zijn mogelijk wegens:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.75
  - number: 2.75.2.a
    text: ongeschiktheid;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.75
  - number: 2.75.2.b
    text: disfunctioneren; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.75
  - number: 2.75.2.c
    text: onverenigbaarheid van functies.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.75
  - number: 2.75.3
    text: Ontslag is verder mogelijk op eigen verzoek.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.75
  - number: 2.75.4
    text: De leden van de raad van toezicht ontvangen van de Wereldomroep een door Onze Minister vast te stellen vergoeding.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.75
  - number: 2.76.1
    text: |-
      De raad van toezicht houdt toezicht op het beleid van de directie en op de algemene gang van zaken binnen de
      Wereldomroep en staat de directie met advies terzijde.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.76
  - number: 2.76.2
    text: |-
      Bij de vervulling van hun taak richten de leden van de raad van toezicht zich naar het algemene belang van de
      Wereldomroep.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.76
  - number: 2.77.1
    text: |-
      De Wereldomroep heeft een directie die bestaat uit ten hoogste drie leden die worden benoemd, geschorst en
      ontslagen door de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.77
  - number: 2.77.2
    text: Besluiten tot benoeming, schorsing en ontslag behoeven de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.77
  - number: 2.77.3
    text: |-
      [Artikel 2.75, eerste lid, onderdelen a en c tot en met g][ref1], is van overeenkomstige toepassing op het
      lidmaatschap van de directie.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.77
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.4.2
  - number: 2.77.4
    text: De directieleden zijn in dienst van de Wereldomroep. De raad van toezicht stelt hun arbeidsvoorwaarden vast.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.77
  - number: 2.78.1
    text: De directie bestuurt de Wereldomroep.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.78
  - number: 2.78.2
    text: De directie is belast met de dagelijkse leiding en het financiële beheer van de Wereldomroep.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.78
  - number: 2.78.3
    text: |-
      De directie is verder belast met datgene wat niet uitdrukkelijk tot de taken of bevoegdheden van de raad van
      toezicht behoort.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.78
  - number: '2.79'
    text: |-
      De werkwijze van de raad van toezicht en de directie wordt geregeld in de statuten en reglementen van de
      Wereldomroep.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.79
  - number: 2.80.1
    text: |-
      De adviesraad van de Wereldomroep adviseert de raad van toezicht en de directie over de inhoud van het media-aanbod
      van de Wereldomroep.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.80
  - number: 2.80.2
    text: |-
      De leden van de adviesraad worden door Onze Minister benoemd, geschorst en ontslagen. Benoeming geschiedt voor vijf
      jaar en herbenoeming voor een aansluitende periode is eenmaal mogelijk.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.80
  - number: 2.80.3
    text: De adviesraad regelt, met instemming van de raad van toezicht, zijn eigen werkwijze.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.80
  - number: 2.81.1
    text: De Wereldomroep is voor het gevoerde en te voeren beleid verantwoording verschuldigd aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.81
  - number: 2.81.2
    text: |-
      De Wereldomroep verstrekt Onze Minister desgevraagd alle inlichtingen met betrekking tot de werkzaamheden van de
      Wereldomroep.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.81
  - number: 2.81.3
    text: |-
      Onze Minister kan inzage verlangen in zakelijke gegevens en bescheiden van de Wereldomroep voor zover dat voor de
      vervulling van zijn taak nodig is.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.81
  - number: 2.82.1
    text: De Wereldomroep stelt jaarlijks vóór 1 juni een jaarverslag over het afgelopen kalenderjaar vast.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.82
  - number: 2.82.2
    text: |-
      In het jaarverslag wordt aandacht besteed aan de werkzaamheden van de Wereldomroep, het gevoerde beleid in het
      algemeen en de doelmatigheid en doeltreffendheid van de werkzaamheden in het bijzonder.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.82
  - number: 2.82.3
    text: De Wereldomroep zendt het jaarverslag aan Onze Minister en maakt het openbaar.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.82
  - number: 2.83.1
    text: Wijzigingen in de statuten van de Wereldomroep behoeven de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.83
  - number: 2.83.2
    text: De raad van toezicht en de directie kunnen niet besluiten tot ontbinding van de Wereldomroep.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.83
  - number: 2.84.1
    text: De Wereldomroep dient elke vijf jaar een beleidsplan voor de komende vijf jaar in bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.84
  - number: 2.84.2
    text: 'Het beleidsplan bevat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.84
  - number: 2.84.2.a
    text: |-
      een beschrijving van de wijze waarop de Wereldomroep in de komende vijf jaar uitvoering geeft aan zijn taken,
      tevens uitgewerkt in kwantitatieve en kwalitatieve doelstellingen voor het media-aanbod en het publieksbereik van
      de Wereldomroep;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.84
  - number: 2.84.2.b
    text: aard en aantal van de te gebruiken aanbodkanalen;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.84
  - number: 2.84.2.c
    text: een overzicht van de activiteiten in binnen- en buitenland;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.84
  - number: 2.84.2.d
    text: een overzicht van de naar verwachting benodigde organisatorische, personele, materiële en financiële middelen; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.84
  - number: 2.84.2.e
    text: een beschrijving van de samenwerking met de landelijke, regionale en lokale publieke media-instellingen en anderen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.84
  - number: 2.84.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels gesteld worden over de inrichting van het beleidsplan en het
      tijdstip van indiening.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.84
  - number: 2.84.4
    text: De Wereldomroep maakt het beleidsplan openbaar.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.84
  - number: 2.85.1
    text: |-
      Onze Minister vraagt de Raad voor cultuur en het Commissariaat binnen een door hem te stellen termijn te adviseren
      over het beleidsplan.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.85
  - number: 2.85.2
    text: |-
      Het beleidsplan behoeft de instemming van Onze Minister voor zover het betreft de onderwerpen, genoemd in
      [artikel 2.84, tweede lid, onderdelen b en c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.85
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.4.4
  - number: 2.85.3
    text: |-
      Als de Wereldomroep wijzigingen wil aanbrengen in de door Onze Minister goedgekeurde voorstellen, neemt hij die op
      in de begroting. Het eerste en tweede lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.85
  - number: 2.86.1
    text: |-
      Mede op basis van het beleidsplan sluiten Onze Minister en de Wereldomroep een prestatieovereenkomst voor de duur
      van het beleidsplan.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.86
  - number: 2.86.2
    text: 'De prestatieovereenkomst bevat afspraken over:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.86
  - number: 2.86.2.a
    text: kwalitatieve en kwantitatieve doelstellingen voor het media-aanbod en het publieksbereik van de Wereldomroep;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.86
  - number: 2.86.2.b
    text: maatregelen bij niet naleving, voor zover mogelijk en binnen het bepaalde bij of krachtens deze wet; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.86
  - number: 2.86.2.c
    text: tussentijdse wijziging in verband met veranderende inzichten of omstandigheden.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.86
  - number: 2.86.3
    text: De prestatieovereenkomst heeft geen betrekking op de specifieke inhoud van het media-aanbod van de Wereldomroep.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.86
  - number: 2.87.1
    text: |-
      De Wereldomroep verzorgt de televisieprogramma’s voor Nederlandstaligen in het buitenland in samenwerking met de
      Stichting.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.87
  - number: 2.87.2
    text: |-
      Ten behoeve van de verzorging van radioprogramma’s voor Nederlandstaligen in het buitenland door de Wereldomroep
      vindt samenwerking met de Stichting plaats.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.87
  - number: 2.88.1
    text: |-
      De publieke media-instellingen bepalen, onverminderd het bepaalde bij of krachtens deze wet, vorm en inhoud van het
      door hen verzorgde media-aanbod en zijn daar verantwoordelijk voor.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.88
  - number: 2.88.2
    text: |-
      De publieke media-instellingen, met uitzondering van de kerkgenootschappen en genootschappen op geestelijke
      grondslag, brengen in overeenstemming met hun werknemers die zijn belast met de verzorging en samenstelling van het
      media-aanbod een redactiestatuut tot stand.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.88
  - number: 2.88.3
    text: 'Het redactiestatuut bevat de journalistieke rechten en plichten van de werknemers, waaronder in elk geval:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.88
  - number: 2.88.3.a
    text: waarborgen dat normen inzake journalistieke deontologie en kwaliteit worden gehanteerd; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.88
  - number: 2.88.3.b
    text: |-
      waarborgen voor redactionele onafhankelijkheid ten opzichte van adverteerders, sponsors en anderen die bijdragen
      hebben verstrekt voor de totstandkoming van media-aanbod.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.88
  - number: 2.89.1
    text: 'Tenzij dit bij of krachtens deze wet is toegestaan, bevat het media-aanbod van de publieke mediadiensten geen:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.89
  - number: 2.89.1.a
    text: Reclame- of telewinkelboodschappen; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.89
  - number: 2.89.1.b
    text: |-
      Vermijdbare andere uitingen die onmiskenbaar tot gevolg hebben dat de afname van producten of diensten wordt
      bevorderd.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.89
  - number: 2.89.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald in welke gevallen vermijdbare uitingen zijn
      toegestaan en wanneer uitingen onvermijdbaar zijn.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.89
  - number: '2.90'
    text: |-
      Behoudens toestemming van het Commissariaat bevat het media-aanbod van de publieke mediadiensten geen oproepen in
      het kader van ledenwerving, andere verenigingsactiviteiten of nevenactiviteiten.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.90
  - number: 2.91.1
    text: |-
      In het media-aanbod van de publieke mediadiensten mogen reclame- en telewinkelboodschappen die zijn aangeboden door
      derden worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.91
  - number: 2.91.2
    text: |-
      Reclame- en telewinkelboodschappen, inclusief omlijsting daarvan, in het media-aanbod van de landelijke publieke
      mediadienst en de Wereldomroep worden uitsluitend verzorgd door de Ster.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.91
  - number: 2.91.3
    text: |-
      De Ster kan op verzoek van regionale en lokale publieke media-instellingen reclame- en telewinkelboodschappen,
      inclusief omlijsting daarvan, verzorgen die worden opgenomen in het media-aanbod van die instellingen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.91
  - number: 2.92.1
    text: |-
      De Ster en de regionale en lokale publieke media-instellingen die reclame- of telewinkelboodschappen in het media-
      aanbod opnemen, zijn aangesloten bij de Nederlandse Reclame Code of een vergelijkbare door de Stichting Reclame
      Code tot stand gebrachte regeling en ter zake onderworpen aan het toezicht van de Stichting Reclame Code.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.92
  - number: 2.92.2
    text: |-
      Aansluiting wordt aangetoond door een schriftelijke verklaring van de Stichting Reclame Code aan het Commissariaat
      over te leggen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.92
  - number: '2.93'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de wijze waarop inzicht wordt
      gegeven in de financiën die betrekking hebben op de verzorging van reclame- en telewinkelboodschappen in het media-
      aanbod van de regionale en lokale publieke mediadiensten.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.93
  - number: 2.94.1
    text: |-
      Reclame- en telewinkelboodschappen zijn als zodanig herkenbaar en door akoestische of optische middelen duidelijk
      onderscheiden van de overige inhoud van het programma-aanbod.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.94
  - number: 2.94.2
    text: 'Niet toegestaan zijn:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.94
  - number: 2.94.2.a
    text: subliminale technieken;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.94
  - number: 2.94.2.b
    text: reclame- en telewinkelboodschappen voor medische behandelingen;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.94
  - number: 2.94.2.c
    text: reclame- en telewinkelboodschappen voor alcoholhoudende dranken tussen 06.00 uur en 21.00 uur; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.94
  - number: 2.94.2.d
    text: sluikreclame.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.94
  - number: 2.95.1
    text: 'Het aandeel reclame- en telewinkelboodschappen, inclusief omlijsting, in het programma-aanbod bedraagt:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.95
  - number: 2.95.1.a
    text: |-
      per programmakanaal niet meer dan een bij algemene maatregel van bestuur vast te stellen percentage van de totale
      duur van het programma-aanbod op het programmakanaal per jaar, welk percentage niet meer bedraagt dan tien en voor
      radio- en televisieprogramma-aanbod kan verschillen;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.95
  - number: 2.95.1.b
    text: |-
      per programmakanaal niet meer dan vijftien procent van de totale duur van het programma-aanbod op het
      programmakanaal per dag; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.95
  - number: 2.95.1.c
    text: per uur niet meer dan twaalf minuten.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.95
  - number: 2.95.2
    text: |-
      Ten hoogste een derde van de tijd die wordt gebruikt voor reclame- of telewinkelboodschappen in het programma-
      aanbod wordt gebruikt voor omlijsting.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.95
  - number: 2.96.1
    text: 'Reclame- en telewinkelboodschappen in het programma-aanbod worden zodanig geplaatst dat zij:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.96
  - number: 2.96.1.a
    text: zijn opgenomen in blokken die inclusief omlijsting ten minste één minuut duren;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.96
  - number: 2.96.1.b
    text: |-
      op zondagen niet direct vooraf gaan aan of direct aansluiten op programma’s van kerkelijke of geestelijke aard,
      tenzij de instelling die voor de inhoud van zodanig programma verantwoordelijk is daartegen geen bezwaar heeft
      gemaakt; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.96
  - number: 2.96.1.c
    text: |-
      niet in programma’s worden opgenomen, behoudens het bepaalde in [artikel 2.97][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.96
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.2.2
        afdeling: 2.5.2
  - number: 2.96.2
    text: |-
      Telewinkelboodschappen in het programma-aanbod duren elk ten hoogste één minuut en een blok als bedoeld in het
      eerste lid, onderdeel a, bestaat voor ten hoogste tweederde van de duur uit telewinkelboodschappen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.96
  - number: 2.96.3
    text: |-
      Bij algemene maatregel van bestuur kunnen regels gesteld worden over de plaatsing van reclame- en
      telewinkelboodschappen in en rond programma-aanbod dat in het bijzonder bestemd is voor kinderen jonger dan twaalf
      jaar.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.96
  - number: 2.97.1
    text: 'In programma’s worden alleen reclame- of telewinkelboodschappen opgenomen als:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.97
  - number: 2.97.1.a
    text: het desbetreffende programma langer duurt dan anderhalf uur voor televisie, dan wel drie kwartier voor radio;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.97
  - number: 2.97.1.b
    text: het desbetreffende programma bestaat uit het volledige verslag of de volledige weergave van een evenement;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.97
  - number: 2.97.1.c
    text: |-
      zij worden opgenomen tijdens de in het evenement voorkomende gebruikelijke pauzes of tussen de in het evenement
      voorkomende zelfstandige onderdelen;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.97
  - number: 2.97.1.d
    text: |-
      de instelling die verantwoordelijk is voor de inhoud van het desbetreffende daartegen geen bezwaar heeft gemaakt op
      grond van afbreuk aan de integriteit, het karakter of de samenhang van het programma; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.97
  - number: 2.97.1.e
    text: dit geen afbreuk doet aan de rechten van rechthebbenden.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.97
  - number: 2.97.2
    text: |-
      In programma’s worden ten hoogste eenmaal per vijfenveertig minuten voor televisie en ten hoogste eenmaal per
      dertig minuten voor radio reclame- of telewinkelboodschappen opgenomen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.97
  - number: 2.97.3
    text: |-
      In programma’s van kerkelijke of geestelijke aard en in programma’s die in het bijzonder bestemd zijn voor kinderen
      jonger dan twaalf jaar worden geen reclame- of telewinkelboodschappen opgenomen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.97
  - number: '2.98'
    text: |-
      De [artikelen 2.94 tot en met 2.97][ref1] zijn zo veel mogelijk van overeenkomstige toepassing op het overige
      media-aanbod van de publieke mediadiensten.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.98
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.2.2
        afdeling: 2.5.2
  - number: '2.99'
    text: |-
      De Stichting Etherreclame heeft tot taak het verzorgen van media-aanbod voor de landelijke publieke mediadienst en,
      op verzoek, voor de regionale en lokale publieke mediadiensten dat bestaat uit reclame- en telewinkelboodschappen
      die zijn aangeboden door derden, inclusief omlijsting daarvan.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.99
  - number: 2.100.1
    text: Het bestuur van de Ster bestaat uit vijf leden die door Onze Minister worden benoemd, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.100
  - number: 2.100.2
    text: Drie van de leden worden benoemd op voordracht van de Stichting.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.100
  - number: 2.100.3
    text: |-
      Onze Minister wijst uit de leden de voorzitter aan en kan twee waarnemers met raadgevende stem in het bestuur
      aanwijzen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.100
  - number: 2.101.1
    text: |-
      Benoeming van de leden van het bestuur van de Ster geschiedt voor een periode van vijf jaar en herbenoeming voor
      een aansluitende periode is eenmaal mogelijk.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.101
  - number: 2.101.2
    text: 'Schorsing en ontslag zijn mogelijk wegens:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.101
  - number: 2.101.2.a
    text: ongeschiktheid;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.101
  - number: 2.101.2.b
    text: disfunctioneren; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.101
  - number: 2.101.2.c
    text: |-
      het hebben van financiële of andere belangen bij bedrijven of instellingen en het vervullen van nevenfuncties
      waardoor een goede vervulling van de functie of de handhaving van de onafhankelijkheid van het betrokken lid of van
      het vertrouwen daarin in het geding kan zijn.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.101
  - number: 2.101.3
    text: Ontslag is verder mogelijk op eigen verzoek.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.101
  - number: 2.102.1
    text: De Ster verstrekt Onze Minister desgevraagd alle inlichtingen met betrekking tot de werkzaamheden van de Ster.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.102
  - number: 2.102.2
    text: |-
      Onze Minister kan inzage verlangen in zakelijke gegevens en bescheiden van de Ster voor zover dat voor de
      vervulling van zijn taak nodig is.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.102
  - number: 2.103.1
    text: De Ster stelt jaarlijks vóór 1 juni een jaarverslag over het afgelopen kalenderjaar vast.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.103
  - number: 2.103.2
    text: |-
      In het jaarverslag wordt aandacht besteed aan de werkzaamheden van de Ster, het gevoerde beleid in het algemeen en
      de doelmatigheid en doeltreffendheid van de werkwijze in het bijzonder.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.103
  - number: 2.103.3
    text: De Ster zendt het verslag aan Onze Minister en maakt het openbaar.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.103
  - number: 2.104.1
    text: Wijzigingen in de statuten van de Ster behoeven de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.104
  - number: 2.104.2
    text: Het bestuur kan niet besluiten tot ontbinding van de Ster.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.104
  - number: 2.105.1
    text: |-
      De Ster doet jaarlijks vóór 1 augustus aan Onze Minister opgave van de verwachte inkomsten uit de reclame- en
      telewinkelboodschappen van de landelijke publieke mediadienst en de Wereldomroep in het lopende en in het volgende
      kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.105
  - number: 2.105.2
    text: |-
      De Ster zendt een afschrift van deze opgaven ter kennisneming aan het Commissariaat, de Stichting en de
      Wereldomroep.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.105
  - number: 2.105.3
    text: |-
      De inkomsten die de Ster verwerft uit de verzorging van reclame- en telewinkelboodschappen voor de landelijke
      publieke mediadienst stelt zij na aftrek van de door Onze Minister goedgekeurde uitgaven ter beschikking van Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.105
  - number: 2.106.1
    text: Media-aanbod van de publieke mediadiensten wordt niet gesponsord.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.106
  - number: 2.106.2
    text: 'Het eerste lid is niet van toepassing op media-aanbod:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.106
  - number: 2.106.2.a
    text: van culturele aard;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.106
  - number: 2.106.2.b
    text: van educatieve aard;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.106
  - number: 2.106.2.c
    text: bestaande uit het verslag of de weergave van een of meer sportevenementen of sportwedstrijden; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.106
  - number: 2.106.2.d
    text: bestaande uit het verslag of de weergave van evenementen ten behoeve van ideële doelen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.106
  - number: 2.106.3
    text: 'Media-aanbod als bedoeld in het tweede lid wordt niet gesponsord als het:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.106
  - number: 2.106.3.a
    text: geheel of gedeeltelijk bestaat uit nieuws, actualiteiten of politieke informatie; of
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.106
  - number: 2.106.3.b
    text: in het bijzonder is bestemd voor kinderen jonger dan twaalf jaar.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.106
  - number: 2.107.1
    text: |-
      Bij gesponsord media-aanbod wordt ter informatie van het publiek duidelijk vermeld dat en door wie het media-aanbod
      is gesponsord.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.107
  - number: 2.107.2
    text: De vermelding geschiedt door neutrale vermelding of vertoning van naam of (beeld)merk van de sponsor.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.107
  - number: 2.107.3
    text: |-
      Bij een gesponsord programma vindt de vermelding plaats aan het begin of het einde van het programma, met dien
      verstande dat bij een gesponsord televisieprogramma de vermelding:
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.107
  - number: 2.107.3.a
    text: ten hoogste vijf seconden duurt;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.107
  - number: 2.107.3.b
    text: voor zover deze niet plaatsvindt op de aan- of aftiteling uitsluitend uit stilstaande beelden bestaat; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.107
  - number: 2.107.3.c
    text: niet beeldvullend is.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.107
  - number: 2.107.4
    text: |-
      Het derde lid is zo veel mogelijk van overeenkomstige toepassing op het overige media-aanbod van de publieke
      mediadiensten.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.107
  - number: 2.108.1
    text: |-
      In gesponsord media-aanbod mogen producten of diensten van een sponsor worden vermeld of getoond, behalve als deze
      een bijdrage in geld heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.108
  - number: 2.108.2
    text: |-
      Het Commissariaat kan toestemming verlenen voor het vermelden of vertonen van de naam, het (beeld)merk, producten
      of diensten van sponsors in de titel van gesponsord media-aanbod, mits het publiek niet door middel van specifieke
      aanprijzingen wordt aangespoord tot het kopen of huren van producten of afname van diensten van de sponsors.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.108
  - number: 2.108.3
    text: Het Commissariaat kan aan het verlenen van toestemming voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.108
  - number: 2.109.1
    text: |-
      Sponsorbijdragen worden rechtstreeks van de sponsors en door middel van een schriftelijke overeenkomst bedongen
      of aanvaard.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.109
  - number: 2.109.2
    text: 'Er worden geen sponsorbijdragen bedongen of aanvaard van personen, bedrijven of instellingen die:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.109
  - number: 2.109.2.a
    text: zich voornamelijk bezighouden met de productie of verkoop van sigaretten of andere tabaksproducten; of
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.109
  - number: 2.109.2.b
    text: |-
      gebruik maken van namen of (beeld)merken die tevens worden gebruikt door personen, bedrijven of instellingen als
      bedoeld in onderdeel a, of daarmee een zo sterke gelijkenis vertonen dat het publiek redelijkerwijs de indruk
      krijgt dat het mede de naam of het (beeld)merk van een persoon, bedrijf of instelling als bedoeld in onderdeel
      a betreft.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.109
  - number: '2.110'
    text: 'De landelijke publieke media-instellingen sturen een afschrift van een sponsorovereenkomst aan de raad van bestuur:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.110
  - number: 2.110.a
    text: binnen één week na het tot stand komen daarvan; of
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.110
  - number: 2.110.b
    text: als het media-aanbod eerder wordt verspreid naar het publiek, vóór laatstgenoemd moment.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.110
  - number: 2.111.1
    text: |-
      Als de raad van bestuur binnen twee weken na ontvangst van het afschrift van de sponsorovereenkomst, of in het
      geval van [artikel 2.110, onderdeel b][ref1], vóór de beoogde datum van verspreiding, schriftelijk heeft meegedeeld
      dat de sponsorovereenkomst in strijd is met het gemeenschappelijke belang van de landelijke publieke mediadienst,
      wordt het media-aanbod waarop de overeenkomst betrekking heeft niet verspreid, tenzij de overeenkomst wordt
      ontbonden of gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.111
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.5.3
  - number: 2.111.2
    text: |-
      In het geval de raad van bestuur aanvullende informatie verlangt, moet voor de toepassing van het eerste lid de
      schriftelijke mededeling zijn gegeven binnen twee weken nadat de aanvullende informatie is ontvangen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.111
  - number: '2.112'
    text: |-
      De [artikelen 2.110][ref1] en [2.111][ref2] zijn van overeenkomstige toepassing op de wijziging van een
      sponsorovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.112
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.5.3
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.5.3
  - number: '2.113'
    text: |-
      De publieke media-instellingen brengen jaarlijks via de jaarrekening verslag uit over de inkomsten uit
      sponsorbijdragen, het gesponsorde media-aanbod en de hoedanigheid van de sponsors, gespecificeerd per onderdeel van
      het media-aanbod.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.113
  - number: 2.114.1
    text: |-
      Als een gesponsord programma uit het buitenland is aangekocht en daar als programma naar het publiek is verspreid,
      zijn de [artikelen 2.106 tot en met 2.113][ref1] van toepassing voor zover sponsorbijdragen worden gegeven voor de
      aankoop van het programma.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.114
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.5.3
  - number: 2.114.2
    text: |-
      De [artikelen 2.107 tot en met 2.113][ref1] zijn van overeenkomstige toepassing als een overheidsinstelling of
      andere instelling dan bedoeld in de begripsomschrijving van sponsoring in [artikel 1.1][ref2] een bijdrage heeft
      gegeven voor de productie of aankoop van media-aanbod om de verspreiding daarvan te bevorderen of mogelijk te
      maken.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel1
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.114
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.5.3
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '1'
        hoofdstuk: '1'
  - number: 2.115.1
    text: |-
      Op elk televisieprogrammakanaal van de landelijke en regionale publieke mediadienst bestaat het programma-aanbod
      voor ten minste vijftig procent van de duur uit Europese producties in de zin van artikel 6 van de Europese
      richtlijn.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.115
  - number: 2.115.2
    text: |-
      Het televisieprogramma-aanbod van de Wereldomroep bestaat voor ten minste vijftig procent uit producties als
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.115
  - number: 2.116.1
    text: |-
      Ten minste vijfentwintig procent van de totale duur van het programma-aanbod op de algemene
      televisieprogrammakanalen van de landelijke publieke mediadienst tezamen bestaat uit producties als bedoeld in
      [artikel 2.115][ref1] die kunnen worden aangemerkt als onafhankelijke productie.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.116
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.4.1
        afdeling: 2.5.4
  - number: 2.116.2
    text: |-
      Op elk van de algemene televisieprogrammakanalen van de landelijke publieke mediadienst bestaat het
      programma-aanbod voor uit ten minste zeventien en een half procent van de duur uit producties als bedoeld in
      [artikel 2.115][ref1] die kunnen worden aangemerkt als onafhankelijke productie.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.116
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.4.1
        afdeling: 2.5.4
  - number: 2.116.3
    text: |-
      Op elk van de andere televisieprogrammakanalen van de landelijke publieke mediadienst bestaat het programma-aanbod
      uit ten minste tien procent van de duur uit producties als bedoeld in [artikel 2.115][ref1] die kunnen worden
      aangemerkt als onafhankelijke productie.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.116
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.4.1
        afdeling: 2.5.4
  - number: '2.117'
    text: |-
      Op elk van de televisieprogrammakanalen van de regionale publieke mediadienst bestaat het programma-aanbod voor ten
      minste tien procent van de duur uit producties als bedoeld in [artikel 2.115][ref1] die kunnen worden aangemerkt
      als onafhankelijke productie.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.117
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.4.1
        afdeling: 2.5.4
  - number: '2.118'
    text: |-
      Het televisieprogramma-aanbod van de Wereldomroep bestaat voor ten minste tien procent uit producties als bedoeld
      in [artikel 2.115][ref1] die kunnen worden aangemerkt als onafhankelijke productie.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.118
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.4.1
        afdeling: 2.5.4
  - number: '2.119'
    text: |-
      Ten minste een derde deel van de programma’s, bedoeld in de [artikelen 2.116 tot en met 2.118][ref1], is niet ouder
      dan vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.119
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.4.1
        afdeling: 2.5.4
  - number: 2.120.1
    text: 'Als onafhankelijke productie wordt aangemerkt programma-aanbod dat niet geproduceerd is door:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.120
  - number: 2.120.1.a
    text: een publieke media-instelling;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.120
  - number: 2.120.1.b
    text: een commerciële media-instelling;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.120
  - number: 2.120.1.c
    text: een buitenlandse omroepinstelling;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.120
  - number: 2.120.1.d
    text: |-
      een rechtspersoon waarin een instelling als bedoeld in de onderdelen a tot en met c, al dan niet door middel van
      een of meer dochtermaatschappijen, een belang van meer dan vijfentwintig procent heeft;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.120
  - number: 2.120.1.e
    text: |-
      een rechtspersoon waarin twee of meer instellingen als bedoeld in de onderdelen a tot en met c, al dan niet door
      middel van een of meer van hun onderscheidene dochtermaatschappijen, samen een belang van meer dan vijftig procent
      hebben; of
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.120
  - number: 2.120.1.f
    text: |-
      een vennootschap waarin een instelling als bedoeld in de onderdelen a tot en met c, dan wel een of meer van haar
      dochtermaatschappijen, als vennoot volledig jegens schuldeisers aansprakelijk is voor de schulden.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.120
  - number: 2.120.2
    text: 'Bij algemene maatregel van bestuur:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.120
  - number: 2.120.2.a
    text: |-
      kunnen nadere regels worden gesteld over de toepassing van het eerste lid en de
      [artikelen 2.116 tot en met 2.119][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.120
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.4.1
        afdeling: 2.5.4
  - number: 2.120.2.b
    text: |-
      kan worden bepaald dat in andere dan de in het eerste lid bedoelde gevallen programma-aanbod wordt aangemerkt als
      onafhankelijke productie.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.120
  - number: '2.121'
    text: |-
      Voor de toepassing van de [artikelen 2.116 tot en met 2.120][ref1] blijft buiten beschouwing programma-aanbod:


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.121
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.4.1
        afdeling: 2.5.4
  - number: 2.121.a
    text: dat bestaat uit nieuws;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.121
  - number: 2.121.b
    text: dat betrekking heeft op sport;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.121
  - number: 2.121.c
    text: |-
      dat het karakter van een spel heeft, met uitzondering van programma-aanbod van culturele of educatieve aard dat
      mede het karakter van een spel heeft;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.121
  - number: 2.121.d
    text: dat bestaat uit reclame- en telewinkelboodschappen, inclusief omlijsting, en zelfpromotie;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.121
  - number: 2.121.e
    text: van kerkgenootschappen en genootschappen op geestelijke grondslag, politieke partijen en de overheid; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.121
  - number: 2.121.f
    text: dat bestaat uit teletekst.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.121
  - number: 2.122.1
    text: |-
      Op elk televisieprogrammakanaal van de landelijke en regionale publieke mediadienst bestaat het programma-aanbod
      voor ten minste vijftig procent van de duur uit oorspronkelijk Nederlands- of Friestalige producties.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.122
  - number: 2.122.2
    text: 'Voor de toepassing van het eerste lid blijft buiten beschouwing:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.122
  - number: 2.122.2.a
    text: programma-aanbod dat bestaat uit reclame- en telewinkelboodschappen, inclusief omlijsting; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.122
  - number: 2.122.2.b
    text: |-
      programma-aanbod van kerkgenootschappen en genootschappen op geestelijke grondslag, politieke partijen en de
      overheid.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.122
  - number: 2.122.3
    text: |-
      Het Commissariaat kan in bijzondere gevallen geheel of gedeeltelijk ontheffing verlenen van het eerste lid. Het
      Commissariaat kan aan een ontheffing voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.122
  - number: '2.123'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over de ondertiteling van televisieprogramma-
      aanbod, waarbij onder meer kan worden bepaald welk percentage van het televisieprogramma-aanbod van de landelijke
      publieke mediadienst bestaat uit producties als bedoeld in [artikel 2.122, eerste lid][ref1], die voorzien zijn van
      ondertiteling ten behoeve van personen met een auditieve beperking.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.123
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.4.2
        afdeling: 2.5.4
  - number: '2.124'
    text: |-
      In het media-aanbod van de publieke mediadiensten worden geen films opgenomen buiten de met de rechthebbenden
      overeengekomen periodes.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.124
  - number: '2.125'
    text: |-
      De stichting Stimuleringsfonds Nederlandse culturele mediaproducties heeft tot taak het verstrekken van financiële
      bijdragen voor de ontwikkeling en vervaardiging van media-aanbod van bijzondere Nederlandse culturele aard
      ten behoeve van de landelijke en regionale publieke media-instellingen, met uitzondering van de Ster, en de
      Wereldomroep.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.125
  - number: 2.126.1
    text: |-
      In deze afdeling wordt verstaan onder: stichting: stichting Stimuleringsfonds Nederlandse culturele
      mediaproducties.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.126
  - number: 2.126.2
    text: |-
      Op de stichting is de [Kaderwet zelfstandige bestuursorganen][ref1] van toepassing met uitzondering van
      [artikel 22][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020495
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel22
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.126
    references:
      - id: ref1
        bwb_id: BWBR0020495
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '22'
  - number: 2.127.1
    text: |-
      De stichting heeft een bestuur dat bestaat uit zeven leden die worden benoemd, geschorst en ontslagen door Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.127
  - number: 2.127.2
    text: |-
      Twee leden worden benoemd uit de kring van de publieke mediadiensten en twee leden uit de kring van de film- en
      podiumkunsten. Onze Minister wijst uit de andere leden de voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.127
  - number: 2.127.3
    text: 'Schorsing en ontslag zijn mogelijk wegens:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.127
  - number: 2.127.3.a
    text: ongeschiktheid;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.127
  - number: 2.127.3.b
    text: disfunctioneren; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.127
  - number: 2.127.3.c
    text: |-
      het hebben van financiële of andere belangen bij bedrijven of instellingen en het vervullen van nevenfuncties
      waardoor een goede vervulling van de functie of de handhaving van de onafhankelijkheid van het betrokken lid of van
      het vertrouwen daarin in het geding kan zijn.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.127
  - number: 2.127.4
    text: Ontslag is verder mogelijk op eigen verzoek.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.127
  - number: '2.128'
    text: |-
      Onverminderd de [artikelen 27][ref1] en [28 van de Kaderwet zelfstandige bestuursorganen][ref2] bevat de begroting
      van de stichting:


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel28
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.128
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '27'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '28'
  - number: 2.128.a
    text: |-
      het beleid en een toelichting op de begrotingsposten voor de ontwikkeling en vervaardiging van media-aanbod ten
      behoeve van de landelijke publieke mediadienst en de Wereldomroep;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.128
  - number: 2.128.b
    text: |-
      het beleid en een toelichting op de begrotingsposten voor de ontwikkeling en vervaardiging van media-aanbod ten
      behoeve van de regionale publieke mediadienst; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.128
  - number: 2.128.c
    text: het beleid en een toelichting op de begrotingsposten voor de overige stimuleringsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.128
  - number: 2.129.1
    text: |-
      [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1] is van toepassing op de jaarrekening van de stichting, met
      dien verstande dat de winst- en verliesrekening wordt vervangen door een exploitatierekening. Op deze rekening
      zijn de bepalingen omtrent de winst- en verliesrekening zoveel mogelijk van overeenkomstige toepassing. Bepalingen
      omtrent winst en verlies zijn zoveel mogelijk van overeenkomstige toepassing op het exploitatiesaldo.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.129
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: 2.129.2
    text: Het boekjaar is gelijk aan het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.129
  - number: 2.130.1
    text: |-
      Op basis van de goedgekeurde begroting ontvangt de stichting jaarlijks uit de gelden, bedoeld in
      [artikel 2.146][ref1], aanhef, van Onze Minister een bijdrage voor de kosten van de uitvoering van haar taak.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.130
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.6.1
  - number: 2.130.2
    text: |-
      De bijdrage bedraagt ten minste een zestiende deel van de afgedragen inkomsten van de Ster van het desbetreffende
      jaar.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.130
  - number: 2.131.1
    text: Wijzigingen in de statuten van de stichting behoeven de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.131
  - number: 2.131.2
    text: Het bestuur van de stichting kan niet besluiten tot ontbinding van de stichting.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.131
  - number: 2.132.1
    text: |-
      De publieke media-instellingen mogen alleen na voorafgaande toestemming van het Commissariaat nevenactiviteiten
      verrichten.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.132
  - number: 2.132.2
    text: |-
      Nevenactiviteiten zijn activiteiten, directe of indirecte deelnemingen in rechtspersonen daaronder begrepen, die
      niet rechtstreeks verband houden met of ten dienste staan van het ter uitvoering van de publieke media-opdracht
      verzorgen van media-aanbod, met uitzondering van verenigingsactiviteiten.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.132
  - number: 2.132.3
    text: |-
      Toestemming kan alleen worden gegeven als een nevenactiviteit verband houdt met of ten dienste staat van de
      verwezenlijking van de publieke media-opdracht, op marktconforme wijze wordt verricht en ten minste kostendekkend
      is.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.132
  - number: '2.133'
    text: |-
      Op overeenkomsten ter zake van nevenactiviteiten die er toe strekken om rechten op en de bekendheid van media-
      aanbod dat voor de landelijke publieke mediadienst is verzorgd of daaraan verbonden namen en merken buiten
      de publieke mediadienst te exploiteren, zijn de [artikelen 2.110 tot en met 2.112][ref1] van overeenkomstige
      toepassing, met dien verstande dat de termijn, bedoeld in [artikel 2.111, eerste lid][ref2], twee maanden is.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.133
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.5.3
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.5.3
  - number: 2.134.1
    text: |-
      In het kader van nevenactiviteiten kunnen de publieke media-instellingen rechtspersonen of samenwerkingsverbanden
      oprichten of daarin deelnemen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.134
  - number: 2.134.2
    text: Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over het verrichten van nevenactiviteiten.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.134
  - number: 2.134.3
    text: |-
      De instellingen die nevenactiviteiten willen verrichten, tonen desgevraagd ten genoegen van het Commissariaat aan
      dat de nevenactiviteiten voldoen aan het bepaalde bij of krachtens [artikel 2.132][ref1] en dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.134
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.5.6
  - number: 2.135.1
    text: |-
      Tenzij bij of krachtens deze wet anders is bepaald, gebruiken de publieke media-instellingen al hun inkomsten voor
      de uitvoering van de publieke mediaopdracht.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.135
  - number: 2.135.2
    text: |-
      Het eerste lid en de [artikelen 2.132][ref1] en [2.134][ref2] zijn niet van toepassing op kerkgenootschappen en
      genootschappen op geestelijke grondslag.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.135
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.5.6
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.5.6
  - number: 2.136.1
    text: |-
      Omroepverenigingen kunnen inkomsten uit contributies en, tot ten hoogste een bij algemene maatregel van bestuur te
      bepalen bedrag, inkomsten uit programmabladen gebruiken voor verenigingsactiviteiten.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.136
  - number: 2.136.2
    text: 'Verenigingsactiviteiten zijn activiteiten die:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.136
  - number: 2.136.2.a
    text: redelijkerwijs nodig zijn voor het goed functioneren van de vereniging en haar organen; of
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.136
  - number: 2.136.2.b
    text: die gebruikelijk zijn in een actief functionerende vereniging om de band met en tussen de leden te versterken.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.136
  - number: 2.137.1
    text: |-
      Het Commissariaat stelt regels over het verstrekken van op geld waardeerbare voordelen aan leden en over
      activiteiten in het kader van ledenwerving.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.137
  - number: 2.137.2
    text: De regels behoeven de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.137
  - number: 2.138.1
    text: |-
      Als een omroepvereniging voornemens is na afloop van de periode waarvoor een erkenning of een voorlopige erkenning
      is verleend een commerciële omroepdienst te verzorgen of een belang te verwerven in een commerciële media-
      instelling, meldt zij dit aan het Commissariaat.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.138
  - number: 2.138.2
    text: |-
      Na de melding kan de omroepvereniging in het laatste jaar van de erkenningperiode activiteiten verrichten die
      noodzakelijk zijn om te zorgen dat zij of de rechtspersoon waarin zij een belang verwerft na afloop van de
      erkenningperiode een commerciële omroepdienst kan verzorgen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.138
  - number: 2.138.3
    text: |-
      Tijdens de periode dat een omroepvereniging activiteiten als bedoeld in het tweede lid verricht, is
      [artikel 2.33, eerste lid][ref1], niet van toepassing en wordt zij beschouwd als omroepvereniging.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.138
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.2.2
  - number: 2.139.1
    text: |-
      De landelijke publieke media-instellingen stellen de gegevens van hun programma-aanbod, voor zover deze nodig
      zijn voor de opgaven van het te verspreiden programma-aanbod in gedrukte of elektronische programmagidsen, ter
      beschikking van de Stichting.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.139
  - number: 2.139.2
    text: |-
      Zij aanvaarden dat de Stichting de gegevens voor verveelvoudiging en openbaarmaking ter beschikking stelt aan de
      omroepverenigingen en aan anderen die daartoe een overeenkomst met de Stichting hebben gesloten.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.139
  - number: '2.140'
    text: |-
      Als inbreuk op het auteursrecht op enig geschrift inhoudende opgaven van uit te zenden programma-aanbod,
      geproduceerd door of in opdracht van landelijke publieke media-instellingen, wordt voor de burgerrechtelijke
      aansprakelijkheid mede beschouwd het verveelvoudigen of openbaar maken van lijsten of andere opgaven van dat
      programma-aanbod anders dan met toepassing van [artikel 2.139][ref1] of met toestemming van de desbetreffende
      instelling, tenzij wordt bewezen dat de gegevens in die lijsten of andere opgaven niet direct of indirect zijn
      ontleend aan enig geschrift als bedoeld in de aanhef van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.140
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.5.6
  - number: 2.141.1
    text: |-
      De publieke media-instellingen zijn met al hun activiteiten niet dienstbaar aan het maken van winst door derden en
      tonen dat desgevraagd naar genoegen van het Commissariaat aan.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.141
  - number: 2.141.2
    text: |-
      Voor kerkgenootschappen en genootschappen op geestelijke grondslag is het eerste lid alleen van toepassing op de
      activiteiten ter verzorging van hun media-aanbod voor de landelijke publieke mediadienst.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.141
  - number: 2.142.1
    text: |-
      De publieke media-instellingen zorgen er voor dat leden van hun organen, werknemers en andere personen of
      rechtspersonen waarmee een overeenkomst is gesloten met het oog op de uitvoering van de publieke media-opdracht,
      voor zichzelf of voor anderen geen op geld waardeerbaar voordeel van derden bedingen of aanvaarden dat direct of
      indirect verband houdt met werkzaamheden van de betrokkene voor de instelling, tenzij het daartoe bevoegde orgaan
      van de instelling daarvoor toestemming heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.142
  - number: 2.142.2
    text: |-
      Toestemming wordt alleen gegeven als de betrokkene aannemelijk maakt dat het voordeel niet is bedoeld als
      tegenprestatie voor het door hem in de uitoefening van zijn werkzaamheden voor de instelling bevoordelen van
      derden.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.142
  - number: 2.142.3
    text: |-
      Een persoon of rechtspersoon die een overeenkomst als bedoeld in het eerste lid heeft gesloten, wordt ten opzichte
      van degenen die in zijn dienst werken niet aangemerkt als een derde.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.142
  - number: 2.143.1
    text: |-
      De publieke media-instellingen voorzien op onafhankelijke wijze in de uitvoering van de publieke mediaopdracht
      en hebben daarvoor op de wijze zoals geregeld in deze wet aanspraak op bekostiging uit ’s Rijks kas die een
      kwalitatief hoogwaardig media-aanbod mogelijk maakt en waardoor continuïteit van financiering gewaarborgd is.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.143
  - number: 2.143.2
    text: |-
      Voor de bekostiging van de uitvoering van de publieke mediaopdracht en ter bestrijding van de overige kosten,
      bedoeld in [artikel 2.146][ref1], worden onder de naam «rijksmediabijdrage» jaarlijks gelden beschikbaar gesteld
      door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.143
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.6.1
  - number: 2.144.1
    text: |-
      De rijksmediabijdrage bestaat ten minste uit een bedrag van € 577,093 miljoen, gebaseerd op de in het jaar 1998
      door de Dienst omroepbijdragen op grond van de toen geldende wettelijke bepalingen aan Onze Minister afgedragen
      inkomsten en de mutaties in de rijksbegroting vanaf dat moment. Dit bedrag wordt vermeerderd met € 47,179 miljoen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.144
  - number: 2.144.2
    text: 'Het bedrag van de rijksmediabijdrage wordt jaarlijks bijgesteld overeenkomstig:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.144
  - number: 2.144.2.a
    text: |-
      de door het Centraal Bureau voor de Statistiek voor het desbetreffende jaar geraamde index voor de groei van het
      aantal huishoudens in Nederland; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.144
  - number: 2.144.2.b
    text: de door het Centraal Planbureau voor het desbetreffende jaar geraamde consumentenprijsindex.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.144
  - number: '2.145'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de toepassing van de
      [artikelen 2.143, tweede lid][ref1], en [2.144][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.145
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.6.1
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.6.1
  - number: '2.146'
    text: 'De rijksmediabijdrage en de inkomsten van de Ster dienen ter bestrijding van de kosten verbonden aan:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.146
  - number: 2.146.a
    text: |-
      de bekostiging van de uitvoering van de publieke mediaopdracht op landelijke niveau volgens [afdeling 2.6.2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.146
    references:
      - id: ref1
        bwb_id: BWBR0025028
        hoofdstuk: '2'
        afdeling: 2.6.2
  - number: 2.146.b
    text: |-
      de bekostiging van de Wereldomroep volgens [afdeling 2.6.3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.146
    references:
      - id: ref1
        bwb_id: BWBR0025028
        hoofdstuk: '2'
        afdeling: 2.6.3
  - number: 2.146.c
    text: |-
      het Europese media-aanbod, bedoeld in [artikel 2.2, tweede lid, onderdeel e][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.146
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.1.1
        afdeling: 2.2.1
  - number: 2.146.d
    text: |-
      het Stimuleringsfonds voor de pers, genoemd in [artikel 8.1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel8
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.146
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '8'
        hoofdstuk: '8'
  - number: 2.146.e
    text: |-
      de Raad voor cultuur, voor zover samenhangend met de advisering over radio, televisie, pers en andere vormen van
      massacommunicatie, tot een door Onze Minister te bepalen bedrag;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.146
  - number: 2.146.f
    text: het Commissariaat;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.146
  - number: 2.146.g
    text: door Onze Minister bekostigd onderzoek in het belang van de massacommunicatie;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.146
  - number: 2.146.h
    text: de bijdrage aan de stichting Stimuleringsfonds Nederlandse culturele mediaproducties;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.146
  - number: 2.146.i
    text: |-
      vergoedingen aan een door Onze Minister aan te wijzen instelling voor het in stand houden en exploiteren van
      omroeporkesten, omroepkoren en een muziekbibliotheek;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.146
  - number: 2.146.j
    text: |-
      vergoedingen aan een door Onze Minister aan te wijzen instelling voor het in stand houden en exploiteren van een
      media-archief;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.146
  - number: 2.146.k
    text: een door Onze Minister aan te wijzen overlegorgaan van lokale publieke media-instellingen; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.146
  - number: 2.146.l
    text: |-
      bijdragen voor de verzorging van media-aanbod van regionale en lokale publieke mediadiensten dat gericht is op
      minderheden.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.146
  - number: 2.147.1
    text: |-
      De Stichting dient jaarlijks vóór 15 september een begroting voor de landelijke publieke mediadienst in bij Onze
      Minister en het Commissariaat.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.147
  - number: 2.147.2
    text: 'De begroting bevat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.147
  - number: 2.147.2.a
    text: |-
      een beschrijving van de wijze waarop door de instellingen die media-aanbod verzorgen voor de landelijke publieke
      mediadienst invulling wordt gegeven aan het voorgenomen media-aanbod op de verschillende aanbodkanalen, met in
      achtneming van het bepaalde bij of krachtens deze wet;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.147
  - number: 2.147.2.b
    text: een overzicht van aard en aantal van de aanbodkanalen;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.147
  - number: 2.147.2.c
    text: |-
      de financiële middelen die voor het volgende kalenderjaar nodig zijn om de voornemens met betrekking tot de
      landelijke publieke mediadienst te verwezenlijken en een raming voor de daarop volgende vier jaar;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.147
  - number: 2.147.2.d
    text: een toelichting op de onderscheiden onderdelen en begrotingsposten; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.147
  - number: 2.147.2.e
    text: |-
      een beschrijving van de samenwerking met de Wereldomroep, de regionale en lokale publieke media-instellingen en
      anderen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.147
  - number: 2.147.3
    text: 'De financiële middelen worden als volgt onderverdeeld:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.147
  - number: 2.147.3.a
    text: de financiële middelen voor de verzorging van het media-aanbod op de verschillende aanbodkanalen;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.147
  - number: 2.147.3.b
    text: |-
      de financiële middelen voor programma-aanbod, bedoeld in de [artikelen 2.115 tot en met 2.123][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.147
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.4.1
        afdeling: 2.5.4
  - number: 2.147.3.c
    text: |-
      de eigen inkomsten van de omroepverenigingen, de educatieve media-instelling, de Programmastichting en de
      Stichting, die gebruikt moeten worden voor de verzorging van het media-aanbod;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.147
  - number: 2.147.3.d
    text: de financiële middelen voor het verspreiden van het media-aanbod op de verschillende aanbodkanalen; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.147
  - number: 2.147.3.e
    text: |-
      de financiële middelen voor de uitvoering van de taken en werkzaamheden van de Stichting die niet direct
      samenhangen met de verzorging van media-aanbod door de Stichting.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.147
  - number: 2.148.1
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de inhoud en inrichting van de begroting.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.148
  - number: 2.148.2
    text: Het Commissariaat zendt vóór 15 oktober zijn opmerkingen met betrekking tot de begroting aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.148
  - number: 2.148.3
    text: De Stichting maakt de begroting openbaar.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.148
  - number: 2.149.1
    text: 'Onze Minister stelt jaarlijks vóór 1 december de budgetten voor het komende jaar vast voor:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.149
  - number: 2.149.1.a
    text: |-
      de verzorging van respectievelijk het televisieprogramma-aanbod, het radioprogramma-aanbod en het overige media-
      aanbod van de omroepverenigingen en de Programmastichting samen;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.149
  - number: 2.149.1.b
    text: |-
      de verzorging van respectievelijk het televisieprogramma-aanbod, het radioprogramma-aanbod en het overige media-
      aanbod van de Stichting;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.149
  - number: 2.149.1.c
    text: |-
      de verzorging van respectievelijk het televisieprogramma-aanbod, het radioprogramma-aanbod en het overige media-
      aanbod van de educatieve media-instelling;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.149
  - number: 2.149.1.d
    text: |-
      de verzorging van programma-aanbod en daarmee direct samenhangend ander media-aanbod van de kerkgenootschappen en
      genootschappen op geestelijke grondslag samen;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.149
  - number: 2.149.1.e
    text: de uitvoering van de overige taken en werkzaamheden van de Stichting; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.149
  - number: 2.149.1.f
    text: de versterking van het media-aanbod van de landelijke publieke mediadienst.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.149
  - number: 2.149.2
    text: |-
      Onze Minister stelt de budgetten vast op tachtig procent van de overeenkomstige budgetten van het voorgaande jaar
      als de Stichting de begroting niet volgens de daarvoor geldende regels heeft ingediend.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.149
  - number: 2.150.1
    text: |-
      Het budget voor de versterking van het media-aanbod van de landelijke publieke mediadienst bedraagt vijfentwintig
      procent van het totaal van de in [artikel 2.149, eerste lid, onderdelen a tot en met c][ref1], genoemde budgetten.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.150
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.2.2
        afdeling: 2.6.2
  - number: 2.150.2
    text: 'Onder versterking van het media-aanbod wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.150
  - number: 2.150.2.a
    text: versterking van het onderscheidende karakter van het media-aanbod;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.150
  - number: 2.150.2.b
    text: |-
      bevordering van een herkenbaar media-aanbod op de onderscheiden aanbodkanalen, waaronder de bevordering van
      samenwerkingsprojecten;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.150
  - number: 2.150.2.c
    text: |-
      bevordering van media-aanbod gericht op specifieke bevolkings- en leeftijdsgroepen, waaronder in elk geval jeugd en
      minderheden; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.150
  - number: 2.150.2.d
    text: |-
      bevordering van media-aanbod van culturele aard en programma-aanbod dat betrekking heeft op kunst, waaronder in elk
      geval toneel, documentaires, film, hoorspelen, klassieke muziek en opera.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.150
  - number: 2.150.3
    text: |-
      Het budget komt geheel ten goede aan media-aanbod van de omroepverenigingen, de educatieve media-instelling, de
      Programmastichting en de Stichting.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.150
  - number: 2.151.1
    text: Onze Minister stelt de budgetten door tussenkomst van het Commissariaat ter beschikking van de raad van bestuur.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.151
  - number: 2.151.2
    text: |-
      De budgetten, bedoeld in [artikel 2.149, eerste lid, onderdelen b, e en f][ref1], besteedt de raad van bestuur aan
      de daar genoemde doelen.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.151
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.2.2
        afdeling: 2.6.2
  - number: 2.152.1
    text: |-
      De raad van bestuur verdeelt het budget, bedoeld in [artikel 2.149, eerste lid, onderdeel a][ref1], als volgt:


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.152
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.2.2
        afdeling: 2.6.2
  - number: 2.152.1.a
    text: |-
      de omroepverenigingen, bedoeld in [artikel 2.51, eerste lid, onderdeel a][ref1], en de Programmastichting krijgen
      elk hetzelfde bedrag;


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.152
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.2.5
  - number: 2.152.1.b
    text: |-
      de omroepverenigingen, bedoeld in [artikel 2.51, eerste lid, onderdeel b][ref1], krijgen elk vijftig procent van
      het bedrag, bedoeld in onderdeel a; en


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.152
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.2.5
  - number: 2.152.1.c
    text: |-
      de omroepverenigingen die een voorlopige erkenning hebben verkregen, krijgen elk vijftien procent van het bedrag,
      bedoeld in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.152
  - number: 2.152.2
    text: |-
      De omroepverenigingen, de educatieve media-instelling en de Programmastichting besteden de ontvangen bedragen aan
      de in [artikel 2.149, eerste lid, onderdelen a en c][ref1], genoemde doelen.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.152
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.2.2
        afdeling: 2.6.2
  - number: 2.153.1
    text: |-
      De raad van bestuur verdeelt het budget, bedoeld in [artikel 2.149, eerste lid, onderdeel d][ref1], over de
      kerkgenootschappen en genootschappen op geestelijke grondslag op basis van de verhouding tussen de hoeveelheid uren
      die voor elk kerkgenootschap en genootschap op geestelijke grondslag op grond van [artikel 2.49, eerste lid][ref2],
      is vastgesteld en de totale hoeveelheid uren, bedoeld in [artikel 2.48, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.153
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.2.2
        afdeling: 2.6.2
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.2.4
      - id: ref3
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.2.4
  - number: 2.153.2
    text: |-
      Kerkgenootschappen en genootschappen op geestelijke grondslag besteden de ontvangen bedragen aan de in
      [artikel 2.149, eerste lid, onderdeel d][ref1], genoemde doelen.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.153
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.2.2
        afdeling: 2.6.2
  - number: 2.154.1
    text: 'De raad van bestuur kan ten hoogste vijftien procent van het voor een instelling vastgestelde bedrag inhouden als:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.154
  - number: 2.154.1.a
    text: de desbetreffende instelling inbreuk heeft gemaakt op bindende besluiten van de raad van bestuur; of
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.154
  - number: 2.154.1.b
    text: |-
      een omroepvereniging of de educatieve media-instelling naar de mening van de raad van bestuur onvoldoende
      uitvoering geeft aan de bereidheid tot samenwerking ten behoeve van de landelijke publieke mediadienst.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.154
  - number: 2.154.2
    text: |-
      Ingehouden bedragen worden toegevoegd aan het budget voor versterking van het media-aanbod van de landelijke
      publieke mediadienst.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.154
  - number: '2.155'
    text: De raad van bestuur beslist jaarlijks vóór 1 januari over de verdeling van de budgetten.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.155
  - number: '2.156'
    text: |-
      Met toestemming van de raad van bestuur kan met ten hoogste tien procent van het bedrag dat aan een instelling ter
      beschikking wordt gesteld voor de verzorging van respectievelijk radioprogramma’s, televisieprogramma’s of ander
      media-aanbod, worden geschoven tussen deze doelen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.156
  - number: 2.157.1
    text: De instellingen ontvangen voorschotten volgens bij ministeriële regeling te stellen regels.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.157
  - number: 2.157.2
    text: |-
      Als een instelling zijn jaarrekening, bedoeld in [artikel 2.171, tweede lid][ref1], niet tijdig indient:


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.157
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.6.1
        afdeling: 2.6.6
  - number: 2.157.2.a
    text: verzoekt het Commissariaat de raad van bestuur de bevoorschotting met twintig procent te verminderen; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.157
  - number: 2.157.2.b
    text: |-
      kan het Commissariaat de raad van bestuur verzoeken de bevoorschotting verder te verminderen of te beëindigen
      wanneer ondanks herhaalde aanmaningen van het Commissariaat de instelling in gebreke blijft met het indienen van
      de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.157
  - number: 2.157.3
    text: |-
      Als een instelling voorschotten in strijd met het bepaalde bij of krachtens de wet gebruikt, kan de raad van
      bestuur de bevoorschotting verminderen of beëindigen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.157
  - number: 2.157.4
    text: De raad van bestuur voldoet meteen aan verzoeken, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.157
  - number: 2.158.1
    text: |-
      Onze Minister kan uit de rijksmediabijdrage en uit de inkomsten van de Ster ten behoeve van de landelijke publieke
      mediadienst gelden ter beschikking stellen voor door Onze Minister daarbij vast te stellen bijzondere doelen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.158
  - number: 2.158.2
    text: Onze Minister stelt de gelden door tussenkomst van het Commissariaat ter beschikking van de raad van bestuur.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.158
  - number: 2.159.1
    text: Onze Minister kan aan een besluit tot het ter beschikking stellen van gelden voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.159
  - number: 2.159.2
    text: Voorschriften hebben geen betrekking op de specifieke inhoud van media-aanbod.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.159
  - number: 2.159.3
    text: |-
      Onze Minister kan een besluit tot het ter beschikking stellen van gelden intrekken of wijzigen als de voorschriften
      niet worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.159
  - number: 2.160.1
    text: De Wereldomroep dient jaarlijks vóór 15 september een begroting in bij Onze Minister en het Commissariaat.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.160
  - number: 2.160.2
    text: 'De begroting bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.160
  - number: 2.160.2.a
    text: |-
      een beschrijving van de wijze waarop door de Wereldomroep uitvoering zal worden gegeven aan de publieke
      mediaopdracht;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.160
  - number: 2.160.2.b
    text: |-
      een opgave van de financiële middelen die voor het volgende kalenderjaar nodig zijn om de voornemens van de
      Wereldomroep te verwezenlijken en een raming voor de daarop volgende vier jaar;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.160
  - number: 2.160.2.c
    text: |-
      een toelichting op de onderscheiden onderdelen en begrotingsposten, waaronder die voor personeel, organisatie en de
      organen van de Wereldomroep; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.160
  - number: 2.160.2.d
    text: een beschrijving van de samenwerking met de Stichting.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.160
  - number: 2.160.3
    text: 'De financiële middelen worden als volgt onderverdeeld:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.160
  - number: 2.160.3.a
    text: de kosten van de verzorging van het media-aanbod van de Wereldomroep;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.160
  - number: 2.160.3.b
    text: de kosten die niet rechtstreeks samenhangen met de verzorging van het media-aanbod;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.160
  - number: 2.160.3.c
    text: de kosten van het verspreiden van het media-aanbod van de Wereldomroep; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.160
  - number: 2.160.3.d
    text: de eigen inkomsten die moeten worden gebruikt voor de uitvoering van de publieke taak.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.160
  - number: '2.161'
    text: 'De begroting bevat verder:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.161
  - number: 2.161.a
    text: |-
      een beschrijving van de wijze waarop in het afgelopen kalenderjaar uitvoering is gegeven aan de publieke
      mediaopdracht; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.161
  - number: 2.161.b
    text: 'een opgave van het door de Wereldomroep in zijn media-aanbod op te nemen aanbod dat:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.161
  - number: 2.161.b.1°
    text: is geproduceerd door of in opdracht van landelijke publieke media-instellingen; of
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.161
  - number: 2.161.b.2°
    text: al als onderdeel van het media-aanbod van de landelijke publieke mediadienst is verspreid.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.161
  - number: 2.162.1
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de inhoud en inrichting van de begroting.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.162
  - number: 2.162.2
    text: Het Commissariaat zendt vóór 15 oktober zijn opmerkingen met betrekking tot de begroting aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.162
  - number: 2.162.3
    text: De Wereldomroep maakt de begroting openbaar.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.162
  - number: '2.163'
    text: 'Onze Minister stelt jaarlijks vóór 1 december de budgetten voor het komende kalenderjaar vast voor:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.163
  - number: 2.163.a
    text: de verzorging van het media-aanbod van de Wereldomroep;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.163
  - number: 2.163.b
    text: de kosten die niet direct samenhangen met de verzorging van het media-aanbod; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.163
  - number: 2.163.c
    text: het verspreiden van het media-aanbod.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.163
  - number: 2.164.1
    text: Onze Minister stelt de budgetten ter beschikking van de Wereldomroep door tussenkomst van het Commissariaat.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.164
  - number: 2.164.2
    text: |-
      Onze Minister stelt de budgetten vast op tachtig procent van de overeenkomstige budgetten voor het voorgaande jaar
      als de Wereldomroep de begroting niet volgens de daarvoor geldende regels heeft ingediend.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.164
  - number: 2.164.3
    text: |-
      De Wereldomroep besteedt de budgetten aan de in [artikel 2.163][ref1] genoemde doelen.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.164
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.3.2
        afdeling: 2.6.3
  - number: 2.165.1
    text: De Wereldomroep ontvangt voorschotten volgens bij ministeriële regeling te stellen regels.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.165
  - number: 2.165.2
    text: |-
      Als de Wereldomroep zijn jaarrekening, bedoeld in [artikel 2.171, tweede lid][ref1], niet tijdig indient:


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.165
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.6.1
        afdeling: 2.6.6
  - number: 2.165.2.a
    text: vermindert het Commissariaat de bevoorschotting met twintig procent; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.165
  - number: 2.165.2.b
    text: |-
      kan het Commissariaat de bevoorschotting verder verminderen of beëindigen wanneer ondanks herhaalde aanmaningen van
      het Commissariaat de Wereldomroep in gebreke blijft met het indienen van de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.165
  - number: 2.165.3
    text: |-
      Als de Wereldomroep voorschotten in strijd met het bepaalde bij of krachtens de wet gebruikt, kan het Commissariaat
      de bevoorschotting verminderen of beëindigen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.165
  - number: 2.166.1
    text: |-
      Onze Minister kan uit de rijksmediabijdrage en de inkomsten van de Ster een algemene mediareserve vormen die
      bestemd is voor:
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.166
  - number: 2.166.1.a
    text: de opvang van dalende inkomsten van de Ster;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.166
  - number: 2.166.1.b
    text: bijdragen in reorganisatiekosten als gevolg van overheidsbesluiten; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.166
  - number: 2.166.1.c
    text: |-
      de financiering van de door het Commissariaat aan te houden rekening-courantverhouding voor de betalingen ter
      uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.166
  - number: 2.166.2
    text: Het Commissariaat beheert de algemene mediareserve.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.166
  - number: 2.167.1
    text: |-
      Onze Minister kan, voor zover dat de financiering van de rekening-courantverhouding niet in gevaar brengt, uit de
      algemene mediareserve gelden ter beschikking stellen ten behoeve van:
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.167
  - number: 2.167.1.a
    text: de landelijke publieke media-instellingen;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.167
  - number: 2.167.1.b
    text: de Wereldomroep; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.167
  - number: 2.167.1.c
    text: |-
      de door hem aangewezen instelling voor het exploiteren van omroepkoren, omroeporkesten en een muziekbibliotheek en
      van een media-archief.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.167
  - number: 2.167.2
    text: |-
      Onze Minister stelt gelden ten behoeve van de landelijke publieke media-instellingen door tussenkomst van het
      Commissariaat ter beschikking aan de raad van bestuur.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.167
  - number: 2.167.3
    text: |-
      Onze Minister stelt gelden ten behoeve van de Wereldomroep en de instellingen, bedoeld in het eerste lid, onderdeel
      c, door tussenkomst van het Commissariaat aan hen ter beschikking.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.167
  - number: 2.168.1
    text: |-
      Renteopbrengsten uit het beheer van de algemene mediareserve zijn bestemd voor door Onze Minister te bepalen
      mediadoeleinden in brede zin.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.168
  - number: 2.168.2
    text: |-
      Onze Minister kan uit de renteopbrengsten gelden ter beschikking stellen aan landelijke publieke media-instellingen
      en aan de Wereldomroep.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.168
  - number: 2.168.3
    text: |-
      [Artikel 2.167, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.168
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.6.4
  - number: '2.169'
    text: |-
      [Artikel 2.159][ref1] is van overeenkomstige toepassing op het ter beschikking stellen van gelden op grond van de
      [artikelen 2.167][ref2] en [2.168][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.169
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.2.3
        afdeling: 2.6.2
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.6.4
      - id: ref3
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.6.4
  - number: 2.170.1
    text: |-
      Gedeputeerde Staten zorgen voor de bekostiging van het functioneren van ten minste één regionale publieke media-
      instelling in de provincie door vergoeding van de kosten die rechtstreeks verband houden met het verzorgen van de
      regionale publieke omroepdienst, voor zover die kosten niet op andere wijze zijn gedekt, op zodanige wijze dat:
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.170
  - number: 2.170.1.a
    text: een kwalitatief hoogwaardig media-aanbod mogelijk is en continuïteit van bekostiging is gewaarborgd; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.170
  - number: 2.170.1.b
    text: |-
      in ieder geval per provincie het in 2004 bestaande niveau van de activiteiten met betrekking tot de verzorging van
      media-aanbod door de regionale publieke media-instelling(en) ten minste gehandhaafd blijft.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.170
  - number: 2.170.2
    text: |-
      Aan de bekostiging worden geen voorschriften verbonden die in strijd zijn met het bepaalde bij of krachtens deze
      wet.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.170
  - number: 2.170.3
    text: |-
      Onze Minister zendt telkens na drie jaar aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten
      van het bepaalde in dit artikel in de praktijk.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.170
  - number: 2.171.1
    text: Het Commissariaat is belast met de rechtmatigheidscontrole van de uitgaven van de publieke media-instellingen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.171
  - number: 2.171.2
    text: |-
      De landelijke publieke media-instellingen, met uitzondering van de Stichting, zenden jaarlijks vóór 1 mei de
      jaarrekening aan het Commissariaat en sturen gelijktijdig een afschrift daarvan aan de raad van bestuur.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.171
  - number: 2.171.3
    text: |-
      De raad van bestuur zendt vóór 1 juni zijn opmerkingen over de jaarrekeningen tezamen met de jaarrekening van de
      Stichting aan het Commissariaat.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.171
  - number: 2.172.1
    text: |-
      [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1] is van toepassing op de jaarrekeningen, met dien verstande
      dat de winst- en verliesrekening wordt vervangen door een exploitatierekening. Op deze rekening zijn de bepalingen
      over de winst- en verliesrekening zoveel mogelijk van overeenkomstige toepassing. Bepalingen over winst en verlies
      zijn zoveel mogelijk van overeenkomstige toepassing op het exploitatiesaldo.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.172
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: 2.172.2
    text: Het boekjaar is gelijk aan het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.172
  - number: 2.172.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de inhoud en inrichting van de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.172
  - number: '2.173'
    text: |-
      Het Commissariaat brengt als onderdeel van het financieel verslag, bedoeld in [artikel 7.7, derde lid][ref1],
      verslag uit over de rechtmatigheidscontrole.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel7
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.173
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '7'
        hoofdstuk: '7'
  - number: 2.174.1
    text: |-
      Landelijke publieke media-instellingen kunnen met toestemming van de raad van bestuur en onder de door hem te
      stellen voorwaarden, die per instelling of categorie van instellingen kunnen verschillen, gelden reserveren.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.174
  - number: 2.174.2
    text: |-
      Het totaal van de gereserveerde gelden in een kalenderjaar bedraagt niet meer dan tien procent van het totaal van
      de ter beschikking gestelde budgetten, bedoeld in [artikel 2.149, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.174
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.2.2
        afdeling: 2.6.2
  - number: 2.174.3
    text: Gelden die in strijd met het eerste lid zijn gereserveerd, worden terugbetaald aan de raad van bestuur.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.174
  - number: 2.175.1
    text: |-
      De Wereldomroep kan met toestemming van het Commissariaat en onder door hem te stellen voorwaarden gelden
      reserveren.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.175
  - number: 2.175.2
    text: |-
      Het totaal van de gereserveerde gelden in een kalenderjaar bedraagt niet meer dan tien procent van het totaal van
      de ter beschikking gestelde budgetten, bedoeld in [artikel 2.163, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.175
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.3.2
        afdeling: 2.6.3
  - number: 2.176.1
    text: |-
      Gereserveerde gelden worden in het volgende kalenderjaar besteed aan de doelen waarvoor zij oorspronkelijk bestemd
      zijn.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.176
  - number: 2.176.2
    text: |-
      Onze Minister en het Commissariaat kunnen op verzoek van de raad van bestuur respectievelijk de Wereldomroep
      ontheffing verlenen van het eerste lid. Onze Minister en het Commissariaat kunnen aan een ontheffing voorschriften
      verbinden.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.176
  - number: 2.177.1
    text: |-
      Gelden die in strijd met het bepaalde bij of krachtens deze wet zijn gebruikt of die in strijd met de
      [artikelen 2.174, tweede lid][ref1], en [2.175][ref2] zijn gereserveerd, vordert het Commissariaat terug.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.177
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.6.2
        afdeling: 2.6.6
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.6.2
        afdeling: 2.6.6
  - number: 2.177.2
    text: Teruggevorderde gelden worden toegevoegd aan de algemene mediareserve.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.177
  - number: 2.178.1
    text: |-
      De landelijke publieke media-instellingen richten hun administratie zodanig in dat daaruit te allen tijde de voor
      de uitvoering van de taken van de raad van bestuur en het Commissariaat benodigde informatie op eenduidige en
      vergelijkbare wijze verkregen kan worden.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.178
  - number: 2.178.2
    text: De raad van bestuur bevordert dat de instellingen een eenduidige financiële boekhouding voeren.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.178
  - number: '2.179'
    text: |-
      Deze afdeling is op kerkgenootschappen en genootschappen op geestelijke grondslag van toepassing voor zover
      het betreft de activiteiten en financiën die betrekking hebben op de verzorging van programma-aanbod en daaraan
      gerelateerd ander media-aanbod voor de landelijke publieke mediadienst.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.179
  - number: 2.180.1
    text: |-
      De instellingen die door Onze Minister zijn aangewezen voor het in stand houden en exploiteren van omroeporkesten,
      omroepkoren en een muziekbibliotheek en voor het exploiteren van een media-archief dienen eenmaal per vijf jaar bij
      Onze Minister een meerjarenplan voor de volgende periode van vijf jaar in.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.180
  - number: 2.180.2
    text: |-
      De meerjarenplannen zijn afgestemd op het voor de desbetreffende periode geldende concessiebeleidsplan voor de
      landelijke publieke mediadienst.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.180
  - number: 2.181.1
    text: De instellingen dienen jaarlijks vóór 15 september een begroting in bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.181
  - number: 2.181.2
    text: |-
      De instellingen dienen jaarlijks vóór 1 mei bij Onze Minister een jaarrekening over het voorafgaande kalenderjaar
      in.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.181
  - number: 2.182.1
    text: De meerjarenplannen en de jaarrekeningen behoeven de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.182
  - number: 2.182.2
    text: Met betrekking tot de meerjarenplannen hoort Onze Minister de Stichting.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.182
  - number: 2.183.1
    text: |-
      Onze Minister stelt uit de financiële middelen, bedoeld in [artikel 2.146, aanhef][ref1], aan de instellingen een
      bijdrage in de kosten ter beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.183
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.6.1
  - number: 2.183.2
    text: Onze Minister kan aan een besluit tot het ter beschikking stellen van bijdragen voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.183
  - number: 2.183.3
    text: |-
      Als een instelling niet voldoet aan de [artikelen 2.180][ref1] en [2.181][ref2] of de aan een besluit tot het ter
      beschikking stellen van bijdragen verbonden voorschriften niet naleeft, kan Onze Minister:


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.183
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.6.7
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.6.7
  - number: 2.183.3.a
    text: de beschikking waarbij de desbetreffende instelling is aangewezen, intrekken; of
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.183
  - number: 2.183.3.b
    text: het besluit tot het ter beschikking stellen van bijdragen intrekken of wijzigen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.183
  - number: 2.184.1
    text: |-
      De Stichting en de Wereldomroep evalueren regelmatig de wijze waarop uitvoering wordt gegeven aan de publieke
      mediaopdracht.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.184
  - number: 2.184.2
    text: Een evaluatie vindt in elk geval eens in de vijf jaar plaats.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.184
  - number: 2.185.1
    text: |-
      Voor de evaluatie stellen de Stichting en de Wereldomroep elk een commissie in voor de duur van de evaluatie, met
      de volgende samenstelling:
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.185
  - number: 2.185.1.a
    text: |-
      de evaluatiecommissie van de Stichting bestaat uit ten minste vijf onafhankelijke deskundigen en is zoveel mogelijk
      representatief voor het kijk- en luisterpubliek; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.185
  - number: 2.185.1.b
    text: de evaluatiecommissie van de Wereldomroep bestaat uit ten minste drie onafhankelijke deskundigen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.185
  - number: 2.185.2
    text: |-
      De leden van de evaluatiecommissie van de Stichting worden op voordracht van de raad van bestuur benoemd door de
      raad van toezicht, gehoord Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.185
  - number: 2.185.3
    text: |-
      De leden van de evaluatiecommissie van de Wereldomroep worden op voordracht van de directie benoemd door de raad
      van toezicht van de Wereldomroep, gehoord Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.185
  - number: 2.186.1
    text: 'De evaluatiecommissie van de Stichting rapporteert in elk geval over:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.186
  - number: 2.186.1.a
    text: |-
      de wijze waarop de landelijke publieke media-instellingen zowel gezamenlijk als afzonderlijk uitvoering hebben
      gegeven aan de publieke mediaopdracht op landelijk niveau;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.186
  - number: 2.186.1.b
    text: |-
      de mate waarin het media-aanbod van de landelijke publieke mediadienst tegemoet komt aan de interesses en inzichten
      van het algemene publiek en van specifieke bevolkings- en leeftijdsgroepen; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.186
  - number: 2.186.1.c
    text: |-
      andere onderwerpen die zijn opgenomen in het besluit tot instelling van de evaluatiecommissie of die door Onze
      Minister zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.186
  - number: 2.186.2
    text: 'De evaluatiecommissie van de Wereldomroep rapporteert in elk geval over:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.186
  - number: 2.186.2.a
    text: de wijze waarop de Wereldomroep uitvoering heeft gegeven aan de publieke mediaopdracht;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.186
  - number: 2.186.2.b
    text: |-
      de mate waarin het media-aanbod van de Wereldomroep voldoet aan de doelstellingen, bedoeld in [artikel 2.72][ref1];
      en


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.186
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.4.1
  - number: 2.186.2.c
    text: |-
      andere onderwerpen die zijn opgenomen in het besluit tot instelling van de evaluatiecommissie of die door Onze
      Minister zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.186
  - number: 2.187.1
    text: |-
      De evaluatiecommissies kunnen aanbevelingen doen over de wijze waarop aan de publieke mediaopdracht in de komende
      jaren uitvoering wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.187
  - number: 2.187.2
    text: |-
      De evaluatiecommissies brengen op een bij ministeriële regeling te bepalen tijdstip rapport uit aan de raad van
      toezicht van de Stichting, respectievelijk de raad van toezicht van de Wereldomroep, die het aan Onze Minister
      zenden en openbaar maken.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel2.187
  - number: 3.1.1
    text: |-
      Onverminderd het bepaalde bij of krachtens de Telecommunicatiewet is het verzorgen van een commerciële omroepdienst
      alleen toegestaan met toestemming van het Commissariaat.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.1
  - number: 3.1.2
    text: |-
      Als een commerciële media-instelling meerdere programmakanalen verzorgt, is voor ieder programmakanaal afzonderlijk
      toestemming nodig.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.1
  - number: 3.1.3
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop aanvragen voor een toestemming worden
      ingediend.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.1
  - number: 3.2.1
    text: Een toestemming wordt op aanvraag verleend en geldt voor vijf jaar.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.2
  - number: 3.2.2
    text: Een toestemming is niet overdraagbaar en vervalt van rechtswege na afloop van de toestemmingsperiode.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.2
  - number: 3.2.3
    text: In de toestemming wordt aangegeven of deze betrekking heeft op televisieomroep of op radio-omroep.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.2
  - number: 3.2.4
    text: Op grond van een toestemming voor televisieomroep is het tevens toegestaan teletekst te verzorgen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.2
  - number: 3.3.2
    text: 'Het Commissariaat kan een aanvraag afwijzen als:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.3
  - number: 3.3.2.a
    text: de door de aanvrager bij de aanvraag verstrekte gegevens onjuist of onvolledig zijn; of
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.3
  - number: 3.3.2.b
    text: redelijkerwijs te verwachten is dat de aanvrager zich niet zal houden aan het bepaalde bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.3
  - number: 3.4.1
    text: 'Het Commissariaat trekt een toestemming in als de commerciële media-instelling:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.4
  - number: 3.4.1.a
    text: daarom verzoekt;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.4
  - number: 3.4.1.b
    text: |-
      in gebreke blijft met de betaling van de verschuldigde toezichtskosten, bedoeld in [artikel 3.30][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.4.2
    text: 'Het Commissariaat kan een toestemming intrekken als de commerciële media-instelling:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.4
  - number: 3.4.2.a
    text: bij de aanvraag onjuiste of onvolledige gegevens verstrekt blijkt te hebben; of
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.4
  - number: 3.4.2.b
    text: |-
      overigens niet voldoet aan het bepaalde bij of krachtens deze wet of
      [artikel 5:20 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 3.5.1
    text: |-
      Een commerciële media-instelling bepaalt, onverminderd het bepaalde bij of krachtens deze wet, vorm en inhoud van
      het door haar verzorgde programma-aanbod en is daar verantwoordelijk voor.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.5
  - number: 3.5.2
    text: |-
      Een commerciële media-instelling brengt in overeenstemming met de werknemers die zijn belast met de verzorging en
      samenstelling van het programma-aanbod een redactiestatuut tot stand waarin de journalistieke rechten en plichten
      van deze werknemers worden geregeld.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.5
  - number: 3.6.1
    text: |-
      Een commerciële media-instelling die reclame- of telewinkelboodschappen in het programma-aanbod opneemt, is
      aangesloten bij de Nederlandse Reclame Code of een vergelijkbare door de Stichting Reclame Code tot stand gebrachte
      regeling en ter zake onderworpen aan het toezicht van de Stichting Reclame Code.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.6
  - number: 3.6.2
    text: |-
      Aansluiting wordt aangetoond door een schriftelijke verklaring van de Stichting Reclame Code aan het Commissariaat
      over te leggen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.6
  - number: 3.7.1
    text: |-
      Reclame- en telewinkelboodschappen zijn als zodanig herkenbaar en door akoestische of optische middelen duidelijk
      onderscheiden van de overige inhoud van het programma-aanbod.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.7
  - number: 3.7.2
    text: 'Niet toegestaan zijn:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.7
  - number: 3.7.2.a
    text: subliminale technieken;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.7
  - number: 3.7.2.b
    text: reclame- en telewinkelboodschappen voor medische behandelingen;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.7
  - number: 3.7.2.c
    text: reclame- en telewinkelboodschappen voor alcoholhoudende dranken tussen 06.00 uur en 21.00 uur; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.7
  - number: 3.7.2.d
    text: sluikreclame.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.7
  - number: 3.7.3
    text: |-
      In de naam van een programmakanaal mogen namen of (beeld-)merken van personen, bedrijven of instellingen op
      neutrale wijze worden vermeld of getoond.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.7
  - number: 3.7.4
    text: |-
      Het Commissariaat kan nadere regels stellen voor de vermelding of vertoning, bedoeld in het derde lid, welke regels
      de goedkeuring behoeven van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.7
  - number: 3.8.1
    text: 'Het programma-aanbod op een programmakanaal:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.8
  - number: 3.8.1.a
    text: bestaat voor ten hoogste vijftien procent van de totale duur per dag uit reclameboodschappen;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.8
  - number: 3.8.1.b
    text: bestaat voor ten hoogste twintig procent van de totale duur per dag uit telewinkelboodschappen;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.8
  - number: 3.8.1.c
    text: |-
      bestaat voor ten hoogste twintig procent van de totale duur per dag uit een combinatie van reclame- en
      telewinkelboodschappen; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.8
  - number: 3.8.1.d
    text: bestaat voor ten hoogste twaalf minuten per uur uit reclame- of telewinkelboodschappen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.8
  - number: 3.8.2
    text: |-
      Reclame- en telewinkelboodschappen in het televisieprogramma-aanbod worden geplaatst in blokken die met inbegrip
      van de eventuele omlijsting ten minste één minuut duren.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.8
  - number: 3.8.3
    text: |-
      Het Commissariaat kan voor bepaalde categorieën programma’s vrijstelling verlenen van de in het tweede lid bedoelde
      verplichting om reclame- en telewinkelboodschappen in blokken te plaatsen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.8
  - number: 3.9.1
    text: |-
      In het programma-aanbod op een programmakanaal zijn ten hoogste acht blokken van telewinkelboodschappen per dag
      opgenomen, die per blok zonder onderbreking ten minste vijftien minuten duren en waarvan de totale duur ten hoogste
      drie uur per dag is.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.9
  - number: 3.9.2
    text: |-
      De telewinkelblokken zijn gedurende de gehele duur daarvan als zodanig herkenbaar en door optische en akoestische
      middelen duidelijk onderscheiden van de overige inhoud van het programma-aanbod.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.9
  - number: 3.9.3
    text: |-
      [Artikel 3.8, eerste en tweede lid][ref1], is niet van toepassing op de telewinkelblokken.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '3'
        hoofdstuk: '3'
        afdeling: 3.2.2
  - number: 3.10.1
    text: |-
      In programma’s worden alleen reclame- of telewinkelboodschappen opgenomen als deze geen afbreuk doen aan de
      integriteit, het karakter of de samenhang van het desbetreffende programma of aan de rechten van rechthebbenden.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.10
  - number: 3.10.2
    text: |-
      In programma’s die bestaan uit de weergave van kerkelijke of geestelijke samenkomsten worden geen reclame- of
      telewinkelboodschappen opgenomen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.10
  - number: '3.11'
    text: |-
      In de volgende programma’s worden alleen reclame- of telewinkelboodschappen opgenomen als zij ten minste dertig
      minuten duren:
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.11
  - number: 3.11.a
    text: programma’s, bestaande uit nieuws of commentaar op het nieuws;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.11
  - number: 3.11.b
    text: |-
      programma’s van kerkelijke of geestelijke aard, niet zijnde programma’s als bedoeld in
      [artikel 3.10, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '3'
        hoofdstuk: '3'
        afdeling: 3.2.2
  - number: 3.11.c
    text: programma’s die bestemd zijn voor minderjarigen beneden de leeftijd van twaalf jaar; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.11
  - number: 3.11.d
    text: niet-gedramatiseerde documentaires.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.11
  - number: 3.12.1
    text: |-
      In films worden alleen reclame- of telewinkelboodschappen opgenomen als de geprogrammeerde duur van de film ten
      minste dertig minuten is.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.12
  - number: 3.12.2
    text: |-
      Onverminderd het eerste lid worden in films ten hoogste eenmaal per volledig tijdvak van dertig minuten reclame- of
      telewinkelboodschappen opgenomen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.12
  - number: 3.12.3
    text: |-
      Als de geprogrammeerde duur van een film ten minste twintig minuten langer is dan twee of meer volledige tijdvakken
      van dertig minuten kunnen nog eenmaal reclame- en telewinkelboodschappen worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.12
  - number: '3.13'
    text: |-
      In televisieprogramma’s die bestaan uit het verslag van een evenement worden alleen reclame- of
      telewinkelboodschappen opgenomen tijdens de in het evenement voorkomende gebruikelijke pauzes of tussen de daarin
      voorkomende gebruikelijke zelfstandige onderdelen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.13
  - number: 3.14.1
    text: |-
      In afwijking van de [artikelen 3.8][ref1] en [3.11][ref2] mag een televisieprogrammakanaal worden verzorgd dat:


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel3
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '3'
        hoofdstuk: '3'
        afdeling: 3.2.2
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '3'
        hoofdstuk: '3'
        afdeling: 3.2.2
  - number: 3.14.1.a
    text: uitsluitend bestaat uit ten behoeve van zelfpromotie uitgezonden reclameboodschappen; of
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.14
  - number: 3.14.1.b
    text: uitsluitend bestaat uit telewinkelboodschappen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.14
  - number: 3.14.2
    text: |-
      In het programma-aanbod van een televisieprogrammakanaal als bedoeld in het eerste lid mogen andere
      reclameboodschappen worden opgenomen met inachtneming van de bepalingen die gelden voor het opnemen van
      reclameboodschappen in televisieprogramma-aanbod.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.14
  - number: 3.15.1
    text: |-
      Programma-aanbod wordt alleen gesponsord als in het redactiestatuut, bedoeld in [artikel 3.5, tweede lid][ref1],
      waarborgen zijn opgenomen voor de redactionele onafhankelijkheid van de werknemers die belast zijn met de
      verzorging en samenstelling van het programma-aanbod ten opzichte van de sponsors.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '3'
        hoofdstuk: '3'
        afdeling: 3.2.1
  - number: 3.15.2
    text: 'Er worden geen sponsorbijdragen bedongen of aanvaard van personen, bedrijven of instellingen:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.15
  - number: 3.15.2.a
    text: die zich voornamelijk bezighouden met de productie of verkoop van sigaretten of andere tabaksproducten; of
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.15
  - number: 3.15.2.b
    text: |-
      die gebruik maken van namen of (beeld)merken die tevens worden gebruikt door personen, bedrijven of instellingen
      als bedoeld in onderdeel a, of daarmee een zo sterke gelijkenis vertonen dat het publiek redelijkerwijs de indruk
      krijgt dat het mede de naam of het (beeld)merk van een persoon, bedrijf of instelling als bedoeld in onderdeel
      a betreft.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.15
  - number: 3.15.3
    text: Programma-aanbod bestaande uit nieuws, actualiteiten of politieke informatie wordt niet gesponsord.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.15
  - number: 3.16.1
    text: |-
      Bij gesponsord programma-aanbod wordt ter informatie van het publiek duidelijk vermeld dat en door wie het
      programma-aanbod is gesponsord.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.16
  - number: 3.16.2
    text: 'De vermelding geschiedt door middel van naam of (beeld)merk van de sponsor en is zodanig vormgegeven dat:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.16
  - number: 3.16.2.a
    text: |-
      het publiek niet door middel van specifieke aanprijzingen wordt aangespoord tot het kopen of huren van producten of
      afname van diensten van de sponsors; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.16
  - number: 3.16.2.b
    text: deze ten hoogste vijf seconden duurt.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.16
  - number: 3.16.3
    text: |-
      Bij een gesponsord programma geschiedt de vermelding aan het begin of het einde van het programma en kan de
      vermelding daarnaast plaatsvinden aan het begin of aan het einde van een reclameblok dat in het programma is
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.16
  - number: 3.16.4
    text: |-
      In afwijking van het tweede lid, onderdeel a, geschiedt tussen 06.00 uur en 21.00 uur de vermelding van sponsors
      die zich bezighouden met de productie of verkoop van alcoholhoudende dranken door neutrale vermelding of vertoning
      van naam of (beeld)merk.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.16
  - number: 3.17.1
    text: 'In gesponsord programma-aanbod mogen:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.17
  - number: 3.17.1.a
    text: producten of diensten van sponsors worden vermeld of getoond; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.17
  - number: 3.17.1.b
    text: in de titel de naam, het (beeld)merk, producten of diensten van sponsors worden vermeld.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.17
  - number: 3.17.2
    text: |-
      Het Commissariaat kan nadere regels stellen voor de vertoning of vermelding in de titel, welke regels de
      goedkeuring behoeven van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.17
  - number: 3.18.1
    text: |-
      Als gesponsord programma-aanbod uit het buitenland is aangekocht en daar als programma naar het publiek is
      verspreid, zijn de [artikelen 3.15 tot en met 3.17][ref1] van toepassing voor zover sponsorbijdragen worden
      verstrekt voor de aankoop van het programma.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '3'
        hoofdstuk: '3'
        afdeling: 3.2.3
  - number: 3.18.2
    text: |-
      [Artikel 3.16, eerste tot en met derde lid][ref1], is van overeenkomstige toepassing als een overheidsinstelling
      of andere instelling dan bedoeld in de begripsomschrijving van sponsoring in [artikel 1.1][ref2] een bijdrage heeft
      gegeven voor de productie of aankoop van programma-aanbod om de verspreiding daarvan te bevorderen of mogelijk
      te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel1
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '3'
        hoofdstuk: '3'
        afdeling: 3.2.3
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '1'
        hoofdstuk: '1'
  - number: 3.19.1
    text: |-
      Bij programma-aanbod dat bestaat uit het verslag of de weergave van een evenement dat niet voornamelijk bestemd
      is om als programma te worden uitgezonden, mogen de namen of (beeld)merken van die personen, bedrijven of
      instellingen, die een financiële of andere bijdrage hebben gegeven voor de totstandkoming van het evenement worden
      vermeld of getoond.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.19
  - number: 3.19.2
    text: |-
      [Artikel 3.16, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '3'
        hoofdstuk: '3'
        afdeling: 3.2.3
  - number: 3.19.3
    text: |-
      Dit artikel is niet van toepassing ten aanzien van personen, bedrijven of instellingen als bedoeld in
      [artikel 3.15, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '3'
        hoofdstuk: '3'
        afdeling: 3.2.3
  - number: 3.20.1
    text: |-
      Op een televisieprogrammakanaal bestaat het programma-aanbod voor ten minste vijftig procent van de duur uit
      Europese producties in de zin van artikel 6 van de Europese richtlijn.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.20
  - number: 3.20.2
    text: |-
      Het Commissariaat kan in bijzondere gevallen ten aanzien van een bepaalde commerciële media-instelling tijdelijk
      gedeeltelijke ontheffing verlenen van het eerste lid, met dien verstande dat het percentage niet lager gesteld kan
      worden dan tien. Het Commissariaat kan aan een ontheffing voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.20
  - number: 3.21.1
    text: |-
      Op een televisieprogrammakanaal bestaat het programma-aanbod uit ten minste tien procent van de duur uit producties
      als bedoeld in [artikel 3.20, eerste lid][ref1], die kunnen worden aangemerkt als onafhankelijke producties.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.21
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.4.1
        afdeling: 3.2.4
  - number: 3.21.2
    text: Ten minste een derde deel van de producties, bedoeld in het eerste lid, is niet ouder dan vijf jaar.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.21
  - number: 3.22.1
    text: 'Als onafhankelijke productie wordt aangemerkt programma-aanbod dat niet geproduceerd is door:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.22
  - number: 3.22.1.a
    text: een publieke media-instelling;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.22
  - number: 3.22.1.b
    text: een commerciële media-instelling;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.22
  - number: 3.22.1.c
    text: een buitenlandse omroepinstelling;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.22
  - number: 3.22.1.d
    text: |-
      een rechtspersoon waarin een instelling als bedoeld in de onderdelen a, b of c, al dan niet door middel van een of
      meer dochtermaatschappijen, een belang van meer dan vijfentwintig procent heeft;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.22
  - number: 3.22.1.e
    text: |-
      een rechtspersoon waarin twee of meer instellingen als bedoeld in de onderdelen a, b of c, al dan niet door middel
      van een of meer van hun onderscheidene dochtermaatschappijen, samen een belang van meer dan vijftig procent hebben;
      of
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.22
  - number: 3.22.1.f
    text: |-
      een vennootschap waarin een instelling als bedoeld in de onderdelen a, b, of c, of een of meer van haar
      dochtermaatschappijen, als vennoot volledig jegens schuldeisers aansprakelijk is voor de schulden.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.22
  - number: 3.22.2
    text: 'Bij algemene maatregel van bestuur:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.22
  - number: 3.22.2.a
    text: |-
      kunnen nadere regels worden gesteld over de toepassing van dit artikel en de [artikelen 3.20][ref1] en
      [3.21][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel3
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.4.1
        afdeling: 3.2.4
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.4.1
        afdeling: 3.2.4
  - number: 3.22.2.b
    text: |-
      kan worden bepaald dat in andere dan de in het eerste lid bedoelde gevallen programma-aanbod wordt aangemerkt als
      onafhankelijke productie.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.22
  - number: 3.23.1
    text: |-
      Voor de toepassing van de [artikelen 3.20 tot en met 3.22][ref1] blijft buiten beschouwing programma-aanbod dat:


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.4.1
        afdeling: 3.2.4
  - number: 3.23.1.a
    text: bestaat uit nieuws;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.23
  - number: 3.23.1.b
    text: betrekking heeft op sport;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.23
  - number: 3.23.1.c
    text: |-
      het karakter van een spel heeft, met uitzondering van programma’s van culturele of educatieve aard, die mede het
      karakter van een spel hebben;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.23
  - number: 3.23.1.d
    text: bestaat uit reclameboodschappen en telewinkelboodschappen, inclusief omlijsting, en zelfpromotie;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.23
  - number: 3.23.1.e
    text: bestaat uit stilstaande beelden; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.23
  - number: 3.23.1.f
    text: bestaat uit teletekst.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.23
  - number: 3.23.2
    text: |-
      De [artikelen 3.20 tot en met 3.22][ref1] zijn niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.4.1
        afdeling: 3.2.4
  - number: 3.23.2.a
    text: |-
      programma-aanbod dat in slechts één gemeente of een beperkt aantal aan elkaar grenzende gemeenten kan worden
      ontvangen;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.23
  - number: 3.23.2.b
    text: |-
      programma-aanbod als bedoeld in [artikel 3.14][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '3'
        hoofdstuk: '3'
        afdeling: 3.2.2
  - number: 3.23.2.c
    text: |-
      programma-aanbod dat uitsluitend bestemd is voor ontvangst in andere staten dan de lidstaten van de Europese Unie
      en dat niet direct of indirect kan worden ontvangen door het publiek in één of meer lidstaten van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.23
  - number: 3.24.1
    text: |-
      Op een televisieprogrammakanaal bestaat het programma-aanbod voor ten minste veertig procent uit oorspronkelijk
      Nederlands- of Friestalige producties.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.24
  - number: 3.24.2
    text: |-
      Het Commissariaat kan in bijzondere gevallen geheel of gedeeltelijk ontheffing verlenen van het eerste lid. Het
      Commissariaat kan aan een ontheffing voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.24
  - number: '3.25'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over de ondertiteling van televisieprogramma’s,
      waarbij onder meer kan worden bepaald welk percentage van het programma-aanbod, bedoeld in
      [artikel 3.24, eerste lid][ref1], voorzien is van ondertiteling ten behoeve van personen met een auditieve
      beperking.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.25
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.4.2
        afdeling: 3.2.4
  - number: '3.26'
    text: In het programma-aanbod worden geen films opgenomen buiten de met de rechthebbenden overeengekomen periodes.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.26
  - number: '3.27'
    text: |-
      Het is niet toegestaan programma-aanbod als bedoeld in [artikel 2.23, tweede lid][ref1], voor zover het betreft
      programma-aanbod waarvan de verspreiding in Nederland slechts mogelijk is na verwerving van de daarop betrekking
      hebbende rechten, te verzorgen als:


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.27
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.1.5
        afdeling: 2.2.1
  - number: 3.27.a
    text: |-
      de commerciële media-instelling niet tijdig aan de Stichting heeft medegedeeld dat zij de desbetreffende rechten
      wil verwerven met uitsluiting van de landelijke publieke media-instellingen; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.27
  - number: 3.27.b
    text: |-
      de Stichting binnen een redelijke termijn na de mededeling aan de commerciële media-instelling te kennen heeft
      gegeven dat zij of een andere landelijke publieke media-instelling het desbetreffende programma-aanbod wenst te
      verzorgen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.27
  - number: '3.28'
    text: |-
      Als inbreuk op het auteursrecht op enig geschrift inhoudende opgaven van uit te zenden programma-aanbod,
      geproduceerd door of in opdracht van een commerciële media-instelling, wordt voor de burgerrechtelijke
      aansprakelijkheid mede beschouwd het verveelvoudigen of openbaar maken van lijsten of andere opgaven van dat
      programma-aanbod anders dan met toestemming van de desbetreffende instelling, tenzij wordt bewezen dat de gegevens
      in die lijsten of andere opgaven niet direct of indirect zijn ontleend aan enig geschrift als in dit artikel
      bedoeld.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.28
  - number: '3.29'
    text: |-
      De [artikelen 3.8][ref1], [3.9, eerste en derde lid][ref2], [3.10, tweede lid][ref3], [3.11 tot en met 3.14][ref4]
      en [3.19 tot en met 3.26][ref5] zijn niet van toepassing op programma-aanbod dat niet direct of indirect buiten
      Nederland ontvangen kan worden en dat:


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0025028#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0025028#Artikel3
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.29
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '3'
        hoofdstuk: '3'
        afdeling: 3.2.2
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '3'
        hoofdstuk: '3'
        afdeling: 3.2.2
      - id: ref3
        bwb_id: BWBR0025028
        artikel: '3'
        hoofdstuk: '3'
        afdeling: 3.2.2
      - id: ref4
        bwb_id: BWBR0025028
        artikel: '3'
        hoofdstuk: '3'
        afdeling: 3.2.2
      - id: ref5
        bwb_id: BWBR0025028
        artikel: '3'
        hoofdstuk: '3'
        afdeling: 3.2.3
  - number: 3.29.a
    text: voor zover het de beeldinhoud betreft uitsluitend of nagenoeg uitsluitend bestaat uit stilstaande beelden; of
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.29
  - number: 3.29.b
    text: |-
      hoofdzakelijk bestaat uit informatie over programma-aanbod en andere diensten die via een omroepzender of
      omroepnetwerk worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.29
  - number: 3.30.1
    text: |-
      Een commerciële media-instelling is voor elke verkregen toestemming aan het Commissariaat jaarlijks toezichtskosten
      verschuldigd.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.30
  - number: 3.30.2
    text: 'De hoogte van de toezichtskosten wordt vastgesteld bij ministeriële regeling, waarbij:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.30
  - number: 3.30.2.a
    text: een onderscheid wordt gemaakt tussen toestemmingen voor radio-omroep en voor televisieomroep; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.30
  - number: 3.30.2.b
    text: |-
      rekening wordt gehouden met de gemiddelde duur van de uitzendingen en met het aantal huishoudens in Nederland, dat
      het programma-aanbod kan ontvangen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.30
  - number: 3.30.3
    text: Het Commissariaat kan de verschuldigde toezichtskosten invorderen bij dwangbevel.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.30
  - number: '3.31'
    text: |-
      Een commerciële media-instelling doet voor elke verkregen toestemming jaarlijks aan het Commissariaat opgave
      van het aantal huishoudens in Nederland dat het desbetreffende programma-aanbod op een door het Commissariaat te
      bepalen peildatum kan ontvangen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel3.31
  - number: 4.1.1
    text: |-
      Het televisieprogramma-aanbod van de publieke mediadiensten en van commerciële mediadiensten bevat geen aanbod dat
      de lichamelijke, geestelijke of zedelijke ontwikkeling van personen jonger dan zestien jaar ernstige schade zou
      kunnen toebrengen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel4.1
  - number: 4.1.2
    text: |-
      Het televisieprogramma-aanbod van de publieke mediadiensten en van commerciële mediadiensten mag alleen dan aanbod
      bevatten dat schade kan toebrengen aan de lichamelijke, geestelijke of zedelijke ontwikkeling van personen jonger
      dan zestien jaar, als de instelling die verantwoordelijk is voor de inhoud van het aanbod is aangesloten bij de
      door Onze Minister erkende organisatie, bedoeld in [artikel 4.2, eerste lid][ref1], en ter zake gebonden is aan
      de regels en het toezicht daarop van die organisatie met betrekking tot het verspreiden van het hiervoor bedoelde
      aanbod.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel4
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.1.3
    text: |-
      De instelling die is aangesloten toont dit aan door een schriftelijke verklaring van de erkende organisatie aan het
      Commissariaat over te leggen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel4.1
  - number: 4.2.1
    text: |-
      Onze Minister kan een organisatie erkennen die voorziet in regelingen omtrent classificatie en het verspreiden van
      aanbod als bedoeld in [artikel 4.1, tweede lid][ref1], en het toezicht daarop.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel4
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.2.2
    text: 'De regelingen hebben in ieder geval betrekking op:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel4.2
  - number: 4.2.2.a
    text: 'criteria voor de classificatie van aanbod, waaronder in ieder geval de mate waarin:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel4.2
  - number: 4.2.2.a.1°
    text: angst wordt opgewekt;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel4.2
  - number: 4.2.2.a.2°
    text: brutaliserend geweld wordt vertoond of gerechtvaardigd;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel4.2
  - number: 4.2.2.a.3°
    text: het gebruik van drugs aantrekkelijk wordt voorgesteld of vergoelijkt;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel4.2
  - number: 4.2.2.a.4°
    text: sprake is van pornografie; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel4.2
  - number: 4.2.2.a.5°
    text: |-
      op andere gronden volgens algemeen geldende opvattingen producten niet geschikt zijn voor vertoning aan bepaalde
      categorieën personen jonger dan zestien jaar;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel4.2
  - number: 4.2.2.b
    text: de tijdstippen van verspreiding van het hiervoor bedoelde aanbod; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel4.2
  - number: 4.2.2.c
    text: |-
      de wijze waarop de verspreiding van dit aanbod wordt voorafgegaan door of is voorzien van symbolen of
      waarschuwingen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel4.2
  - number: 4.3.1
    text: 'Een organisatie komt slechts voor erkenning in aanmerking als:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel4.3
  - number: 4.3.1.a
    text: |-
      onafhankelijk toezicht door de organisatie op de naleving van de regelingen, bedoeld in het eerste lid, is
      gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel4.3
  - number: 4.3.1.b
    text: |-
      voorzien is in voldoende betrokkenheid van belanghebbenden, onder wie in ieder geval vertegenwoordigers uit de
      consumentensfeer, publieke media-instellingen, deskundigen op het gebied van de audiovisuele media en producenten
      van audiovisuele media; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel4.3
  - number: 4.3.1.c
    text: de financiële positie van de organisatie een adequate uitvoering van de werkzaamheden waarborgt.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel4.3
  - number: 4.3.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de eisen bedoeld in het
      eerste lid en kunnen andere eisen voor erkenning worden gesteld.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel4.3
  - number: 4.3.3
    text: Aan een erkenning kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel4.3
  - number: 4.4.1
    text: |-
      Onze Minister trekt een erkenning in als de erkende organisatie niet meer voldoet aan de [artikelen 4.2][ref1]
      en [4.3, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel4
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.4.2
    text: |-
      Onze Minister kan een erkenning intrekken als de erkende organisatie niet voldoet aan de nadere regels en andere
      eisen, bedoeld in [artikel 4.3, tweede lid][ref1], of de voorschriften, bedoeld in [artikel 4.3, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel4
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '4'
        hoofdstuk: '4'
  - number: '4.5'
    text: Van een beschikking tot erkenning en intrekking van een erkenning wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel4.5
  - number: '4.6'
    text: Dit hoofdstuk is van overeenkomstige toepassing op het overige media-aanbod van de publieke mediadiensten.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel4.6
  - number: 5.1.1
    text: |-
      Bij algemene maatregel van bestuur wordt een lijst vastgesteld van evenementen die, wanneer zij als een
      televisieprogramma worden verspreid, in ieder geval worden verspreid op een open televisieprogrammakanaal, en kan
      worden bepaald welke van die evenementen tevens worden aangemerkt als evenementen als bedoeld in artikel 3 bis van
      de Europese richtlijn.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel5.1
  - number: 5.1.2
    text: |-
      Een evenement kan op de lijst worden geplaatst als in ieder geval wordt voldaan aan twee van de volgende
      voorwaarden:
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel5.1
  - number: 5.1.2.a
    text: het evenement is van algemeen belang voor de Nederlandse samenleving;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel5.1
  - number: 5.1.2.b
    text: het evenement is van bijzondere culturele betekenis;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel5.1
  - number: 5.1.2.c
    text: |-
      het evenement werd in het verleden ook al op een open televisieprogrammakanaal uitgezonden en kon rekenen op een
      grote kijkdichtheid; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel5.1
  - number: 5.1.2.d
    text: het gaat om een groot internationaal sportevenement waaraan een nationaal team deelneemt.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel5.1
  - number: '5.2'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld ter uitvoering van de verplichting,
      bedoeld in [artikel 5.1, eerste lid][ref1], waarbij in ieder geval wordt bepaald of de op de lijst genoemde
      evenementen, wanneer zij als televisieprogramma worden verspreid, in ieder geval worden verspreid op een open
      televisieprogrammakanaal door middel van volledige of gedeeltelijke rechtstreekse verslaggeving dan wel door middel
      van volledige of gedeeltelijke uitgestelde verslaggeving.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel5
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.3.1
    text: |-
      Publieke media-instellingen en commerciële media-instellingen oefenen verworven verspreidingsrechten die
      betrekking hebben op evenementen die zijn vermeld op de lijst van evenementen uit overeenkomstig de krachtens
      [artikel 5.2][ref1] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel5
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.3.2
    text: |-
      De instellingen oefenen na 30 juli 1997 verworven uitzendrechten uit overeenkomstig de regels die door andere
      lidstaten van de Europese Unie overeenkomstig artikel 3 bis, eerste lid, van de Europese richtlijn zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel5.3
  - number: 6.1.1
    text: |-
      Het Commissariaat wijst jaarlijks een aantal uren op de algemene programmakanalen van de landelijke publieke
      mediadienst toe aan politieke partijen die bij de laatstgehouden verkiezing van de leden van de Tweede of Eerste
      Kamer der Staten-Generaal een of meer zetels hebben verworven.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.1
  - number: 6.1.2
    text: |-
      Het Commissariaat wijst een aantal uren op de algemene programmakanalen van de landelijke publieke mediadienst
      toe aan:
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.1
  - number: 6.1.2.a
    text: |-
      politieke partijen die in alle kieskringen aan de verkiezing van de leden van de Tweede Kamer der Staten-Generaal
      deelnemen; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.1
  - number: 6.1.2.b
    text: politieke partijen die in Nederland aan de verkiezing van de leden van het Europese Parlement deelnemen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.1
  - number: 6.1.3
    text: |-
      De uren, bedoeld in het tweede lid, zijn beschikbaar in een door het Commissariaat te bepalen periode die
      onmiddellijk vooraf gaat aan de dag die in Nederland voor de desbetreffende verkiezing is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.1
  - number: 6.2.1
    text: |-
      Als een politieke partij op grond van de [artikelen 137c][ref1], [137d][ref2], [137e][ref3], [137f][ref4],
      [137g][ref5] of [429quater van het Wetboek van Strafrecht][ref6] is veroordeeld tot een onvoorwaardelijke
      geldboete, wijst het Commissariaat in afwijking van [artikel 6.1, eerste en tweede lid][ref7], aan deze politieke
      partij geen uren toe gedurende een periode die ingaat op de dag waarop de veroordeling onherroepelijk is geworden.
      Deze periode is:


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel137c
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel137d
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel137e
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel137f
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel137g
      [ref6]: https://wetten.overheid.nl/BWBR0001854#Artikel429quater
      [ref7]: https://wetten.overheid.nl/BWBR0025028#Artikel6
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 137c
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 137d
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 137e
      - id: ref4
        bwb_id: BWBR0001854
        artikel: 137f
      - id: ref5
        bwb_id: BWBR0001854
        artikel: 137g
      - id: ref6
        bwb_id: BWBR0001854
        artikel: 429quater
      - id: ref7
        bwb_id: BWBR0025028
        artikel: '6'
        hoofdstuk: '6'
        afdeling: 6.1.1
  - number: 6.2.1.a
    text: één jaar, bij een geldboete van minder dan € 1 125;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.2
  - number: 6.2.1.b
    text: twee jaar, bij een geldboete van € 1 125 of meer, maar minder dan € 2 250;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.2
  - number: 6.2.1.c
    text: drie jaar, bij een geldboete van € 2 250 of meer, maar minder dan € 3 375; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.2
  - number: 6.2.1.d
    text: vier jaar, bij een geldboete van € 3 375 of meer.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.2
  - number: 6.2.2
    text: |-
      Als aan de lijst van een politieke partij aan de lijst waarvan op de dag waarop de veroordeling onherroepelijk
      wordt op grond van de [Kieswet][ref1] geen zetels zijn toegewezen, op grond van een verkiezing die plaatsvindt
      binnen een periode van twee jaar na die dag één of meer zetels worden toegewezen, gaat de periode gedurende welke
      aan deze politieke partij geen uren als bedoeld in [artikel 6.1, eerste lid][ref2], worden toegewezen, in op de dag
      waarop de verkiezing heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel6
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0004627
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '6'
        hoofdstuk: '6'
        afdeling: 6.1.1
  - number: 6.3.1
    text: |-
      Na een veroordeling als bedoeld in [artikel 6.2, eerste lid][ref1], worden aan de politieke partij, zo
      nodig in afwijking van [artikel 6.2, eerste lid, onderdeel a][ref2], in ieder geval geen uren als bedoeld in
      [artikel 6.1, tweede lid][ref3], toegewezen binnen twee jaar na de dag waarop de veroordeling onherroepelijk is
      geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel6
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '6'
        hoofdstuk: '6'
        afdeling: 6.1.1
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '6'
        hoofdstuk: '6'
        afdeling: 6.1.1
      - id: ref3
        bwb_id: BWBR0025028
        artikel: '6'
        hoofdstuk: '6'
        afdeling: 6.1.1
  - number: 6.3.2
    text: |-
      Als aan een politieke partij met toepassing van [artikel 6.2, eerste lid][ref1], geen uren meer worden toegewezen,
      dan vervallen met ingang van de dag waarop de veroordeling onherroepelijk is geworden van rechtswege ook de uren
      die al zijn toegewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel6
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '6'
        hoofdstuk: '6'
        afdeling: 6.1.1
  - number: '6.4'
    text: |-
      Een politieke partij gebruikt de aan haar toegewezen uren geheel en alleen voor programma-aanbod op politiek
      terrein.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.4
  - number: 6.5.1
    text: |-
      Het Commissariaat wijst jaarlijks op aanvraag van Onze Minister-President, Minister van Algemene Zaken,
      een aantal uren op de algemene programmakanalen van de landelijke publieke mediadienst toe ten behoeve van
      overheidsvoorlichting.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.5
  - number: 6.5.2
    text: 'Bij ministeriële regeling worden nadere regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.5
  - number: 6.5.2.a
    text: het tijdstip waarop een aanvraag wordt ingediend; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.5
  - number: 6.5.2.b
    text: de termijn waarbinnen een besluit op de aanvraag wordt genomen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.5
  - number: 6.6.1
    text: |-
      De toegewezen uren zijn beschikbaar voor Onze Ministers voor gebruik door overheidsinstellingen of personen die
      door hen zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.6
  - number: 6.6.2
    text: De toegewezen uren worden geheel gebruikt en alleen voor overheidsvoorlichting.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.6
  - number: 6.7.1
    text: |-
      Onze Minister stelt jaarlijks op advies van het Commissariaat en de Stichting de totale hoeveelheid uren vast die
      op de algemene programmakanalen van de landelijke publieke mediadienst beschikbaar zijn voor politieke partijen en
      de overheid.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.7
  - number: 6.7.2
    text: Het Commissariaat kan in bijzondere gevallen of voor bijzondere doelen meer uren vaststellen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.7
  - number: '6.8'
    text: |-
      De [artikelen 2.53][ref1], [2.59][ref2], [2.60][ref3], [2.88, eerste lid][ref4], [2.89][ref5],
      [2.106 tot en met 2.109][ref6], [2.114][ref7], [2.124][ref8], [2.139][ref9] en [2.142][ref10] en
      [hoofdstuk 4][ref11] zijn van overeenkomstige toepassing op politieke partijen en de overheid en het gebruik van
      de aan hen toegewezen uren. De [artikelen 2.59][ref12] en [2.60][ref13] zijn daarbij slechts van overeenkomstige
      toepassing voor zover het betreft de activiteiten die verband houden met het gebruik van de toegewezen uren.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel2
