  - number: 6.9.1
    text: |-
      Het Commissariaat kan aan natuurlijke of rechtspersonen toestemming verlenen voor het via een omroepzender
      verzorgen van een omroepdienst voor een bijzonder doel en met een beperkt bereik of van beperkte duur.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.9
  - number: 6.9.2
    text: Het Commissariaat kan aan een toestemming voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.9
  - number: 6.10.1
    text: |-
      De aanbieder van een omroepzender of een omroepnetwerk verspreidt geen programma-aanbod als de instelling die
      verantwoordelijk is voor vorm en inhoud van het desbetreffende programma-aanbod, krachtens deze wet of krachtens
      de op die instelling van toepassing zijnde buitenlandse regelgeving niet gerechtigd is voor verspreiding bestemd
      programma-aanbod te verzorgen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.10
  - number: '6.11'
    text: 'Het is de aanbieder van een omroepzender of een omroepnetwerk toegestaan via de omroepzender of het omroepnetwerk:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.11
  - number: 6.11.a
    text: |-
      programma-aanbod te verspreiden dat bestaat uit een onverkorte en rechtstreekse weergave van een openbare
      vergadering van de Eerste of Tweede Kamer der Staten-Generaal, van Provinciale Staten of van een gemeenteraad; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.11
  - number: 6.11.b
    text: |-
      informatie over het via de omroepzender of het omroepnetwerk aangeboden programma-aanbod en diensten te
      verspreiden.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.11
  - number: '6.12'
    text: |-
      Deze paragraaf is van toepassing als omroepnetwerken voor een significant aantal eindgebruikers in Nederland het
      belangrijkste middel zijn om programma-aanbod te ontvangen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.12
  - number: 6.13.1
    text: |-
      Als een significant aantal aangeslotenen op een omroepnetwerk programma-aanbod op analoge wijze ontvangt,
      verspreidt de aanbieder van dat omroepnetwerk naar die aangeslotenen in ieder geval vrij toegankelijk programma-
      aanbod op ten minste vijftien omroepnetten voor televisie en op ten minste vijfentwintig omroepnetten voor radio,
      waaronder:
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.13
  - number: 6.13.1.a
    text: |-
      het programma-aanbod van de landelijke publieke mediadienst op drie algemene televisieprogrammakanalen en vijf
      algemene radioprogrammakanalen;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.13
  - number: 6.13.1.b
    text: |-
      het in [artikel 2.70][ref1] bedoelde programma-aanbod van de regionale publieke mediadienst dat bestemd is voor de
      provincie of deel van de provincie waarbinnen het omroepnetwerk zich bevindt op één omroepnet voor televisie en één
      omroepnet voor radio;


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.13
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.3.2
  - number: 6.13.1.c
    text: |-
      het in [artikel 2.70][ref1] bedoelde programma-aanbod van de lokale publieke mediadienst dat bestemd is voor de
      gemeente waarbinnen het omroepnetwerk zich bevindt op één omroepnet voor televisie en één omroepnet voor radio;


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.13
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.3.2
  - number: 6.13.1.d
    text: |-
      het programma-aanbod van twee televisieprogrammakanalen en twee radioprogrammakanalen van de Nederlandstalige
      landelijke Belgische openbare omroepdienst; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.13
  - number: 6.13.1.e
    text: |-
      ander programma-aanbod dan bedoeld in onderdeel c, dat een lokale publieke media-instelling verzorgt en dat gericht
      is op specifieke bevolkings- en leeftijdsgroepen, waaronder minderheden, met dien verstande dat deze verplichting
      beperkt is tot het programma-aanbod op ten hoogste twee omroepnetten voor televisie en vijf omroepnetten voor
      radio.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.13
  - number: 6.13.2
    text: |-
      Als een significant aantal aangeslotenen op een omroepnetwerk programma-aanbod op digitale wijze ontvangt,
      verspreidt de aanbieder van dat omroepnetwerk naar die aangeslotenen in ieder geval:
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.13
  - number: 6.13.2.a
    text: het programma-aanbod, bedoeld in het eerste lid; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.13
  - number: 6.13.2.b
    text: |-
      het in [artikel 2.70][ref1] bedoelde programma-aanbod van een regionale publieke mediadienst dat bestemd is voor
      een provincie of deel van een provincie aangrenzend aan de provincie waarbinnen het omroepnetwerk zich bevindt op
      één omroepnet voor televisie.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.13
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.3.2
  - number: 6.14.1
    text: |-
      Het is de aanbieder van een omroepnetwerk toegestaan naar een aangeslotene op het omroepnetwerk op diens
      verzoek minder programma-aanbod dan bedoeld in [artikel 6.13, eerste lid, onderdelen a en b][ref1], dat door de
      aangeslotenen op analoge wijze of op digitale wijze wordt ontvangen, te verspreiden, mits hij een evenredig lager
      tarief in rekening brengt.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel6
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.14
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: 6.3.1.2
        afdeling: 6.3.1
  - number: 6.14.2
    text: |-
      Het Commissariaat kan geheel of gedeeltelijk ontheffing verlenen van de verplichtingen, bedoeld in
      [artikel 6.13][ref1], als het onverkort nakomen daarvan leidt tot disproportionele kosten, tot een belemmering
      van innovatie of tot anderszins onredelijke uitkomsten. Het Commissariaat kan aan een ontheffing voorschriften
      verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel6
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.14
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: 6.3.1.2
        afdeling: 6.3.1
  - number: 6.15.1
    text: In gemeenten waar een omroepnetwerk aanwezig is, stelt de gemeenteraad een programmaraad in.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.15
  - number: 6.15.2
    text: |-
      De programmaraad is representatief voor de belangrijkste in de gemeente of gemeenten voorkomende maatschappelijke,
      culturele, godsdienstige en geestelijke stromingen en beschikt als geheel over voldoende kennis van de
      informatiebehoeften van bevolkings- en leeftijdsgroepen van verschillende omvang en samenstelling binnen het
      -kijken luisterpubliek.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.15
  - number: 6.16.1
    text: |-
      Een programmaraad bestaat uit ten minste zeven en ten hoogste vijftien leden, die worden benoemd door de
      gemeenteraad van de gemeente waar het omroepnetwerk aanwezig.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.16
  - number: 6.16.2
    text: |-
      Benoeming geschiedt voor een periode van vier jaar en herbenoeming voor een aansluitende periode is eenmaal
      mogelijk.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.16
  - number: 6.16.3
    text: De gemeenteraad vervult een vacature zo spoedig mogelijk, maar in ieder geval binnen zes maanden.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.16
  - number: 6.17.1
    text: |-
      In gemeenten waar al een programmaraad functioneert, vindt de instelling en benoeming van de leden van de
      programmaraad plaats na overleg met deze programmaraad.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.17
  - number: 6.17.2
    text: |-
      Als een aantal omroepnetwerken gekoppeld is en daardoor feitelijk als één omroepnetwerk functioneert, stellen de
      betrokken gemeenteraden gezamenlijk één programmaraad in en benoemen zij gezamenlijk de leden.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.17
  - number: 6.18.1
    text: 'Voor benoeming tot lid van een programmaraad komen in aanmerking personen die:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.18
  - number: 6.18.1.a
    text: woonachtig zijn in het gebied waarop het advies van de programmaraad betrekking heeft; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.18
  - number: 6.18.1.b
    text: |-
      aangesloten zijn op het omroepnetwerk in dat gebied dan wel deel uitmaken van een huishouden dat daarop is
      aangesloten.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.18
  - number: 6.18.2
    text: 'Met het lidmaatschap van een programmaraad zijn onverenigbaar:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.18
  - number: 6.18.2.a
    text: |-
      het lidmaatschap van een gemeenteraad in een gemeente die behoort tot het gebied waarop het advies van de
      programmaraad betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.18
  - number: 6.18.2.b
    text: het lidmaatschap van een College van Burgemeester en Wethouders in een gemeente als bedoeld in onderdeel a;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.18
  - number: 6.18.2.c
    text: |-
      een binding met de aanbieder van het omroepnetwerk dat aanwezig is in het gebied waarop het advies van de
      programmaraad betrekking heeft; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.18
  - number: 6.18.2.d
    text: |-
      het lidmaatschap van het bestuur van of een betrekking, al dan niet tegen betaling, bij een publieke media-
      instelling of een commerciële media-instelling.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.18
  - number: 6.19.1
    text: 'Een programmaraad stelt een reglement vast waarin in ieder geval regels zijn opgenomen over:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.19
  - number: 6.19.1.a
    text: |-
      de wijze waarop de instelling, de taak en de samenstelling van de programmaraad kenbaar wordt gemaakt aan de
      aangeslotenen op het omroepnetwerk in het gebied waarop het advies van de programmaraad betrekking heeft; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.19
  - number: 6.19.1.b
    text: |-
      de totstandkoming, de inhoud, de vaststelling, de openbaarmaking en de geldigheidsduur van het advies van de
      programmaraad.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.19
  - number: 6.19.2
    text: Het reglement voorziet in een transparante adviesprocedure.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.19
  - number: 6.20.1
    text: |-
      De programmaraad adviseert de aanbieder van het omroepnetwerk welk vrij toegankelijk programma-
      aanbod op vijftien uitzendnetten voor televisie en vijfentwintig uitzendnetten voor radio hij krachtens
      [artikel 6.13, eerste lid][ref1], ten minste verspreidt naar alle aangeslotenen op het netwerk.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel6
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.20
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: 6.3.1.2
        afdeling: 6.3.1
  - number: 6.20.2
    text: |-
      De aanbieder van een omroepnetwerk volgt het advies, bedoeld in het eerste lid, tenzij zwaarwichtige redenen zich
      daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.20
  - number: 6.20.3
    text: |-
      De aanbieder van een omroepnetwerk kan de programmaraad voorts een advies vragen over het overige vrij
      toegankelijke programma-aanbod dat hij verspreidt naar alle aangeslotenen op het omroepnetwerk.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.20
  - number: 6.21.1
    text: |-
      De programmaraad maakt bij zijn advisering een duidelijk onderscheid tussen advisering als bedoeld in
      [artikel 6.20, eerste lid][ref1], en advisering als bedoeld in het derde lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel6
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.21
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: 6.3.1.3
        afdeling: 6.3.1
  - number: 6.21.2
    text: |-
      Onverminderd de [artikelen 6.13][ref1] en [6.14][ref2], gaat de programmaraad in zijn advisering uit van een
      pluriforme samenstelling van het pakket aan vrij toegankelijk programma-aanbod, rekening houdend met de in de
      gemeente levende maatschappelijke, culturele, godsdienstige en geestelijke behoeften.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel6
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.21
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: 6.3.1.2
        afdeling: 6.3.1
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: 6.3.1.2
        afdeling: 6.3.1
  - number: '6.22'
    text: |-
      Deze paragraaf is niet van toepassing op de aanbieder van een omroepnetwerk aan wie het Commissariaat ontheffing
      heeft verleend op grond van [artikel 6.14, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel6
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.22
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: 6.3.1.2
        afdeling: 6.3.1
  - number: 6.23.1
    text: |-
      Onze Minister, handelend in overeenstemming met het gevoelen van de ministerraad, wijst de frequentieruimte
      in de FM-band aan die wordt gebruikt voor het verspreiden van radioprogramma-aanbod dat overwegend bestaat uit
      Nederlandstalige muziek. Bij ministeriële regeling wordt nader omschreven in welke gevallen radioprogramma-aanbod
      aan deze eis voldoet.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.23
  - number: 6.23.2
    text: |-
      Onze Minister, handelend in overeenstemming met het gevoelen van de ministerraad, wijst andere frequentieruimte
      in de FM-band aan die slechts mag worden gebruikt voor het verspreiden van bij die aanwijzing vast te stellen
      categorieën radioprogramma-aanbod dat, gelet op de aard, inhoud of doelgroep, verhoudingsgewijs lage inkomsten uit
      reclame of verhoudingsgewijs hoge kosten meebrengt.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.23
  - number: 6.23.3
    text: |-
      Als aard en omvang van de frequentieruimte in de FM-band die beschikbaar is voor het verspreiden van
      radioprogramma-aanbod daartoe aanleiding geven, kan Onze Minister, handelend in overeenstemming met het gevoelen
      van de ministerraad, afzien van het aanwijzen van frequentieruimte in de FM-band op grond van het eerste en tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.23
  - number: 6.24.1
    text: |-
      Voor de verspreiding van het radioprogramma-aanbod van eenzelfde instelling wordt niet meer frequentieruimte
      gebruikt dan één FM-frequentie of samenstel van FM-frequenties.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.24
  - number: 6.24.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald in welke gevallen een aantal met elkaar verbonden
      instellingen voor de toepassing van het eerste lid als één instelling wordt aangemerkt.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.24
  - number: 6.24.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden afgeweken van het eerste lid als dat wenselijk is
      vanuit een oogpunt van doelmatig gebruik van frequentieruimte, waarbij een onderscheid kan worden gemaakt tussen
      verschillende categorieën frequentieruimte, bestaande uit FM-frequenties en samenstellen van FM-frequenties.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.24
  - number: '6.25'
    text: |-
      De [artikelen 6.23][ref1] en [6.24][ref2] zijn niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel6
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.25
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '6'
        hoofdstuk: '6'
        afdeling: 6.3.2
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '6'
        hoofdstuk: '6'
        afdeling: 6.3.2
  - number: 6.25.a
    text: de frequentieruimte die wordt gebruikt voor de verspreiding van programma-aanbod van de publieke mediadiensten; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.25
  - number: 6.25.b
    text: frequentieruimte die wordt gebruikt ten behoeve van verspreiding via een satelliet.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.25
  - number: 6.26.1
    text: |-
      Bij algemene maatregel van bestuur worden, op voordracht van Onze Minister-President, Minister van Algemene Zaken,
      na overleg met Onze Minister, regels gesteld op grond waarvan in geval van buitengewone omstandigheden het gebruik
      van programmakanalen van de publieke mediadiensten, studio’s en andere faciliteiten, omroepzenders, omroepnetwerken
      en andere hulpmiddelen ter beschikking worden gesteld aan de bij of krachtens die algemene maatregel van bestuur
      aangewezen autoriteiten.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.26
  - number: 6.26.2
    text: |-
      Onze Minister-President, Minister van Algemene Zaken, is bevoegd in de algemene noodtoestand, na overleg met Onze
      Minister, regels te stellen ten aanzien van de inhoud van radio- en televisieprogramma’s en het toezicht daarop,
      waarbij kan worden afgeweken van het bepaalde in [artikel 7.11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel7
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.26
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '7'
        hoofdstuk: '7'
  - number: 6.26.3
    text: |-
      De in het tweede lid bedoelde bevoegdheid wordt onverwijld beëindigd zodra
      [artikel 31, eerste lid, van de Oorlogswet voor Nederland][ref1] in werking wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007983#Artikel31
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.26
    references:
      - id: ref1
        bwb_id: BWBR0007983
        artikel: '31'
  - number: '6.27'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over het verzorgen van omroepdiensten die
      uitsluitend bestemd zijn voor de in Nederland gelegerde militairen van buitenlandse strijdkrachten en hun gezinnen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel6.27
  - number: 7.1.1
    text: Er is een Commissariaat voor de Media.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.1
  - number: 7.1.2
    text: Het Commissariaat heeft rechtspersoonlijkheid en is gevestigd in de gemeente Hilversum.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.1
  - number: 7.1.3
    text: |-
      Het Commissariaat is belast met de uitvoering van taken die hem zijn opgedragen bij of krachtens deze wet en andere
      wetten.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.1
  - number: '7.2'
    text: |-
      Op het Commissariaat is de [Kaderwet zelfstandige bestuursorganen][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0020495
  - number: 7.3.1
    text: Het Commissariaat bestaat uit een voorzitter en twee of vier andere leden.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.3
  - number: 7.3.2
    text: Een benoeming geschiedt voor vijf jaar en herbenoeming voor een aansluitende periode is eenmaal mogelijk.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.3
  - number: '7.4'
    text: |-
      Onverminderd [artikel 13 van de Kaderwet zelfstandige bestuursorganen][ref1] zijn onverenigbaar met het
      lidmaatschap van het Commissariaat:


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel13
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '13'
  - number: 7.4.a
    text: het lidmaatschap van een van beide Kamers der Staten-Generaal, een provinciaal bestuur of een gemeentebestuur;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.4
  - number: 7.4.b
    text: |-
      een dienstbetrekking bij een ministerie, een dienst, instelling of bedrijf vallende onder de verantwoordelijkheid
      van een minister; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.4
  - number: 7.4.c
    text: |-
      het lidmaatschap van een orgaan van of een dienstbetrekking bij een publieke media-instelling, een commerciële
      media-instelling of een uitgever van een persorgaan.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.4
  - number: 7.5.1
    text: Het Commissariaat neemt besluiten bij meerderheid van stemmen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.5
  - number: 7.5.2
    text: |-
      Het Commissariaat kan alleen met instemming van alle leden aan één of meer van zijn leden mandaat en machtiging
      verlenen voor het uitvoeren van delen van zijn taak.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.5
  - number: 7.5.3
    text: Het Commissariaat stelt inzake zijn besluitvorming en werkwijze een bestuursreglement vast.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.5
  - number: '7.6'
    text: De kosten van het Commissariaat worden door Onze Minister vergoed op basis van de door hem goedgekeurde begroting.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.6
  - number: 7.7.1
    text: |-
      Onverminderd [artikel 34 van de Kaderwet zelfstandige bestuursorganen][ref1] dient het Commissariaat jaarlijks
      voor 1 september bij Onze Minister een financieel verslag in over het beheer van de algemene mediareserve, bedoeld
      in [artikel 2.166][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.6.4
  - number: 7.7.2
    text: |-
      Het financieel verslag gaat vergezeld van een verklaring omtrent de getrouwheid en de rechtmatigheid, afgegeven
      door een accountant als bedoeld in [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1] en behoeft de
      instemming van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 7.7.3
    text: Het Commissariaat maakt het financieel verslag openbaar.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.7
  - number: '7.8'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de inhoud en inrichting van de begroting, het
      financieel verslag en aandachtspunten voor de accountantscontrole.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.8
  - number: 7.9.1
    text: Het Commissariaat zendt besluiten zo spoedig mogelijk na de bekendmaking aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.9
  - number: 7.9.2
    text: |-
      Besluiten van het Commissariaat kunnen binnen acht weken na ontvangst daarvan door Onze Minister dan wel gedurende
      de tijd dat het besluit is geschorst worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.9
  - number: 7.9.3
    text: Besluiten van het Commissariaat kunnen binnen acht weken na ontvangst daarvan door Onze Minister worden geschorst.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.9
  - number: 7.9.4
    text: |-
      Van een besluit tot schorsing, opheffing of verlenging van de schorsing wordt mededeling gedaan in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.9
  - number: '7.10'
    text: |-
      Het Commissariaat plaatst besluiten tot vaststelling van nadere regels op grond van deze wet en tot vaststelling
      van beleidsregels over de uitvoering van zijn taken in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.10
  - number: 7.11.1
    text: |-
      Het Commissariaat is belast met de bestuursrechtelijke handhaving van het bepaalde bij of krachtens deze wet, met
      uitzondering van:
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.11
  - number: 7.11.1.a
    text: |-
      de [artikelen 2.2 tot en met 2.22][ref1], [2.24 tot en met 2.33][ref2], [2.36 tot en met 2.41][ref3],
      [2.53 tot en met 2.57][ref4], [2.59][ref5], [2.60][ref6], [2.73 tot en met 2.87][ref7],
      [2.125 tot en met 2.131][ref8], [2.143 tot en met 2.145][ref9], [2.149][ref10], [2.150, eerste lid][ref11],
      [2.151, eerste lid][ref12], [2.158][ref13], [2.163][ref14], [2.164, eerste en tweede lid][ref15],
      [2.166 tot en met 2.168][ref16], [2.180 tot en met 2.187][ref17], [4.2 tot en met 4.5][ref18] en [6.26][ref19]; en


