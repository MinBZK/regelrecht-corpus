preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de taakopdracht van de publieke omroep te wijzigen
    in het licht van ontwikkelingen in technologie, media-aanbod, mediaproductie, distributie en mediagebruik, de
    reclameregels voor commerciële omroepen te versoepelen en andere noodzakelijke aanpassingen te doen; dat het verder
    wenselijk is de Mediawet te moderniseren en technisch aan te passen en dat het daarom wenselijk is een nieuwe
    Mediawet vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#ArtikelAanhef
articles:
  - number: 1.1.1
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *aanbieder van een omroepnetwerk:*
      natuurlijke persoon of rechtspersoon die transmissiecapaciteit door middel van een omroepnetwerk ter beschikking
      stelt;
        - *aanbieder van een omroepzender:* natuurlijke persoon of rechtspersoon die transmissiecapaciteit door middel van
      een omroepzender ter beschikking stelt;
        - *aanbodkanaal:* geordende geheel van media-aanbod dat onder een herkenbare naam via een elektronisch
      communicatienetwerk wordt aangeboden;
        - *alcoholhoudende drank:* alcoholhoudende drank als bedoeld in [artikel 1 van de Drank- en Horecawet][ref1];
        - *commerciële mediadienst:* mediadienst die verzorgd wordt op basis van [hoofdstuk 3][ref2];
        - *commerciële media-instelling:* natuurlijke persoon of rechtspersoon die een commerciële mediadienst verzorgt en
      die voor de toepassing van deze wet onder de bevoegdheid van Nederland valt;
        - *Commissariaat:* Commissariaat voor de Media, genoemd in [artikel 7.1][ref3];
        - *dagbladmarkt:* door het Stimuleringsfonds voor de pers, genoemd in [artikel 8.1][ref4], vastgestelde gemiddelde
      betaalde oplage, in een kalenderjaar, van persorganen die bestemd zijn voor het publiek in Nederland en ten minste
      zes keer per week verschijnen;
        - *Europese richtlijn:* [richtlijn nr. 89/552/EEG](31989L0552) van de Raad van de Europese Gemeenschappen van
      3 oktober 1989 betreffende de coördinatie van bepaalde wettelijke en bestuursrechtelijke bepalingen in de lidstaten
      inzake de uitoefening van televisie-omroepactiviteiten (PbEG L 298), zoals gewijzigd bij [richtlijn nr. 97/36/EG]
      (31997L0036) van het Europees Parlement en de Raad van 30 juni 1997 (PbEG L 202);
        - *evenement:* georganiseerde voor het publiek toegankelijke gebeurtenis op het terrein van sport of cultuur;
        - *landelijke publieke media-instelling:* instelling die op grond van [titel 2.2][ref5] media-aanbod voor de
      landelijke publieke mediadienst verzorgt;
        - *lokale publieke media-instelling:* instelling die op grond van [titel 2.3][ref6] is aangewezen voor de
      verzorging van een lokale publieke mediadienst;
        - *media-aanbod:* één of meer elektronische producten met beeld- of geluidsinhoud die bestemd zijn voor afname door
      het algemene publiek of een deel daarvan;
        - *mediadienst:* dienst die bestaat uit het verzorgen van media-aanbod door middel van openbare elektronische
      communicatienetwerken als bedoeld in [artikel 1.1, onderdeel h, van de Telecommunicatiewet][ref7], waarvoor de
      verzorger redactionele verantwoordelijkheid draagt;
        - *omroepdienst:* mediadienst die betrekking heeft op het verzorgen van media-aanbod dat op basis van een schema
      dat is vastgesteld door de instelling die verantwoordelijk is voor het media-aanbod, al dan niet gecodeerd door
      middel van een omroepzender of een omroepnetwerk wordt verspreid voor gelijktijdige ontvangst door het algemene
      publiek of een deel daarvan;
        - *omroepnet:* transmissiecapaciteit op een omroepnetwerk of een omroepzender die noodzakelijk is om continu
      programma-aanbod te verspreiden;
        - *omroepnetwerk:* openbaar elektronisch communicatienetwerk als bedoeld in
      [artikel 1.1, onderdeel h, van de Telecommunicatiewet][ref8], dat wordt gebruikt of mede wordt gebruikt om,
      hoofdzakelijk met gebruik van kabels, programma’s te verspreiden;
        - *omroepzender:* radiozendapparaat als bedoeld in [artikel 1.1, onderdeel kk, van de Telecommunicatiewet][ref9]
      dat wordt gebruikt of mede wordt gebruikt voor het verspreiden van programma’s;
        - *Onze Minister:* Onze Minister van Onderwijs, Cultuur en Wetenschap;
        - *open televisieprogrammakanaal:* televisieprogrammakanaal dat ontvangen kan worden door ten minste vijfenzeventig
      procent van alle huishoudens in Nederland, waarvoor geen andere kosten verschuldigd zijn dan: 1°. het tarief dat
      een aanbieder van een omroepnetwerk aan de aangeslotenen op het omroepnetwerk in rekening brengt voor de ontvangst
      van het programma-aanbod van een door de aanbieder met inachtneming van de [artikelen 6.12 tot en met 6.14][ref10]
      vast te stellen aantal omroepnetten; of 2°. de kosten van aankoop of gebruik van technische voorzieningen die de
      ontvangst van televisieprogramma’s mogelijk maken;
        - *politieke partij:* politieke partij als bedoeld in
      [artikel 1, onderdeel b, van de Wet subsidiëring politieke partijen][ref11];
        - *programma:* elektronisch product met beeld- of geluidsinhoud dat duidelijk afgebakend is en als zodanig
      herkenbaar onder een afzonderlijke titel via een omroepdienst wordt verspreid;
        - *programma-aanbod:* geheel van media-aanbod dat wordt verspreid via een omroepdienst;
        - *programmakanaal:* geordende geheel van programma-aanbod dat onder een herkenbare naam wordt verspreid via een
      omroepzender of omroepnetwerk;
        - *Programmastichting:* Nederlandse Programma Stichting, genoemd in [artikel 2.35][ref12];
        - *publieke mediadienst:* mediadienst die verzorgd wordt op basis van [hoofdstuk 2][ref13];
        - *publieke media-instelling:* instelling die op basis van [hoofdstuk 2][ref14] media-aanbod verzorgt;
        - *publieke mediaopdracht:* mediaopdracht als bedoeld in [artikel 2.1, eerste lid][ref15];
        - *raad van bestuur:* raad van bestuur van de Stichting;
        - *radio-omroep:* omroepdienst die betrekking heeft op radioprogramma-aanbod;
        - *radioprogramma:* programma met uitsluitend geluidsinhoud;
        - *reclameboodschap:* uiting in welke vorm dan ook, niet zijnde een telewinkelboodschap, waarmee onmiskenbaar wordt
      beoogd het publiek te bewegen tot het kopen van een bepaald product of het gebruik maken van een bepaalde dienst,
      dan wel gunstig te stemmen ten aanzien van een bepaald bedrijf, een bedrijfstak of een bepaalde instelling teneinde
      de verkoop van producten of de afname van diensten te bevorderen;
        - *regionale publieke media-instelling:* instelling die op grond van [titel 2.3][ref16] is aangewezen voor de
      verzorging van een regionale publieke mediadienst;
        - *sluikreclame:* het anders dan op grond van deze wet vermelden of tonen van namen, (beeld)merken, producten,
      diensten of activiteiten van personen, bedrijven of instellingen als redelijkerwijs kan worden aangenomen dat
      daarmee wordt beoogd of mede wordt beoogd reclame te maken, met dien verstande dat het oogmerk in elk geval
      aanwezig is als de vertoning of vermelding tegen betaling of soortgelijke vergoeding geschiedt;
        - *sponsoring:* het verstrekken van financiële of andere bijdragen door een overheidsbedrijf dat of particuliere
      onderneming die zich gewoonlijk niet bezighoudt met de verzorging van mediadiensten of media-aanbod, ten behoeve
      van de totstandkoming of aankoop van media-aanbod, teneinde de verspreiding daarvan naar het algemene publiek of
      een deel daarvan te bevorderen of mogelijk te maken;
        - *sportwedstrijd:* wedstrijd of de voorbereiding op een wedstrijd, georganiseerd door of onder auspiciën van de
      door het NOC*NSF erkende nationale sportorganisaties en hun geledingen, of door vergelijkbare internationale, al
      dan niet overkoepelende sportorganisaties, dan wel een andere wedstrijd of de voorbereiding op een wedstrijd van
      een sport die door het NOC*NSF als sport is aangemerkt;
        - *Ster:* Stichting Etherreclame, genoemd in [artikel 2.99][ref17];
        - *Stichting:* Nederlandse Omroep Stichting, genoemd in [artikel 2.2][ref18];
        - *teletekst:* televisieprogramma dat uitsluitend bestaat uit stilstaande tekstbeelden die door de kijker in
      een door hem bepaalde volgorde en op een door hem bepaald tijdstip kunnen worden geraadpleegd, en dat wordt
      verspreid via dezelfde transmissieruimte van een omroepzender of omroepnetwerk als die welke wordt gebruikt voor de
      verspreiding van andere televisieprogramma’s;
        - *televisieomroep:* omroepdienst die betrekking heeft op televisieprogramma-aanbod;
        - *televisieprogramma:* programma met beeldinhoud, al dan niet mede met geluidsinhoud;
        - *telewinkelboodschap:* uiting in een televisieprogramma die bestaat uit een rechtstreekse aanbieding aan het
      publiek met het oog op de levering tegen betaling van producten of diensten;
        - *uitgever van een persorgaan:* rechtspersoon die een persorgaan uitgeeft;
        - *Wereldomroep:* Stichting Radio Nederland Wereldomroep, genoemd in [artikel 2.72][ref19].


