    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel9.20
  - number: 9.20.2
    text: |-
      Als deze wet na 31 december 2008 in werking treedt, werken de [artikelen 2.143][ref1], [2.144][ref2] en
      [9.1, onderdeel a][ref3], terug tot en met 1 januari 2008.


