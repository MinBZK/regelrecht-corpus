      - id: ref2
        bwb_id: BWBR0025028
        artikel: '3'
        hoofdstuk: '3'
        afdeling: 3.2.2
  - number: '9.3'
    text: |-
      [Hoofdstuk VII van de Mediawet][ref1] zoals [die wet][ref2] luidde op de dag voorafgaande aan het tijdstip
      waarop deze wet in werking treedt, blijft tot 1 januari 2011 van kracht, met dien verstande dat de in de
      [artikelen 89][ref3] en [90 van genoemd hoofdstuk][ref4] bedoelde gelden ter beschikking worden gesteld aan de raad
      van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#HoofdstukVII
      [ref2]: https://wetten.overheid.nl/BWBR0004149
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel89
      [ref4]: https://wetten.overheid.nl/BWBR0004149#Artikel90
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0004149
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0004149
      - id: ref3
        bwb_id: BWBR0004149
        artikel: '89'
      - id: ref4
        bwb_id: BWBR0004149
        artikel: '90'
  - number: 9.4.1
    text: |-
      Concessies, erkenningen, zendtijdtoewijzingen, toestemmingen en ontheffingen die zijn verleend op grond van de
      [Mediawet][ref1] zoals [die wet][ref2] luidde op de dag voorafgaande aan het tijdstip waarop deze wet in werking
      treedt, worden geacht te zijn verleend op grond van deze wet voor de duur waarvoor zij zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0004149
      [ref2]: https://wetten.overheid.nl/BWBR0004149
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0004149
      - id: ref2
        bwb_id: BWBR0004149
  - number: 9.4.2
    text: |-
      Benoemingen op grond van de [Mediawet][ref1] zoals [die wet][ref2] luidde op de dag voorafgaande aan het tijdstip
      waarop deze wet in werking treedt, worden geacht te zijn geschied op grond van deze wet voor de duur van de
      benoemingstermijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004149
      [ref2]: https://wetten.overheid.nl/BWBR0004149
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0004149
      - id: ref2
        bwb_id: BWBR0004149
  - number: '9.5'
    text: |-
      Voor overtredingen van het bepaalde bij of krachtens de [Mediawet][ref1] zoals [die wet][ref2] luidde op de
      dag voorafgaande aan het tijdstip waarop deze wet in werking treedt, en ten aanzien van voor het tijdstip
      van inwerkingtreding van deze wet aangevangen bezwaar- en beroepsprocedures blijft de [Mediawet][ref3] zoals
      [die wet][ref4] luidde op de dag voorafgaande aan het tijdstip waarop deze wet in werking treedt, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004149
      [ref2]: https://wetten.overheid.nl/BWBR0004149
      [ref3]: https://wetten.overheid.nl/BWBR0004149
      [ref4]: https://wetten.overheid.nl/BWBR0004149
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel9.5
    references:
      - id: ref1
        bwb_id: BWBR0004149
      - id: ref2
        bwb_id: BWBR0004149
      - id: ref3
        bwb_id: BWBR0004149
      - id: ref4
        bwb_id: BWBR0004149
  - number: '9.6'
    text: |-
      Bij algemene maatregel van bestuur kunnen tot twee jaar na het tijdstip waarop deze wet in werking treedt, in
      gevallen waarin deze wet niet voorziet, regels worden gesteld met betrekking tot de invoering van artikelen van
      deze wet of onderdelen daarvan.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel9.6
  - number: '9.16'
    text: |-
      Onze Minister stelt regels ter uitvoering van de artikelen 12, 15 en 16 van de Europese richtlijn, voor zover
      naar het oordeel van Onze Minister een of meer van deze artikelen niet, niet voldoende, niet juist of niet tijdig
      zijn uitgewerkt in de Nederlandse Reclame Code of in een vergelijkbare door de Stichting Reclame Code tot stand
      gebrachte regeling, dan wel de Stichting Reclame Code in gebreke blijft met het toezicht daarop.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel9.16
  - number: '9.17'
    text: |-
      Een wijziging van de Europese richtlijn gaat voor de toepassing van het bepaalde bij of krachtens de artikelen 1.3,
      [2.115 tot en met 2.121][ref1], [3.20 tot en met 3.23][ref2], en [hoofdstuk 5][ref3] gelden met ingang van de dag
      waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel9.17
    references:
