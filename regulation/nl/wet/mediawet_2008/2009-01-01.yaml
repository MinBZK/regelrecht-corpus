  - number: 7.11.1.b
    text: |-
      [hoofdstuk 8][ref1].

      [ref1]: https://wetten.overheid.nl/BWBR0025028#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.11
    references:
      - id: ref1
        bwb_id: BWBR0025028
        hoofdstuk: '8'
  - number: 7.11.2
    text: |-
      Met het toezicht op de naleving zijn belast de leden van het Commissariaat en de bij besluit van het Commissariaat
      aangewezen medewerkers van het Commissariaat.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.11
  - number: 7.11.3
    text: Van een besluit als bedoeld in het tweede lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.11
  - number: 7.12.1
    text: |-
      Bij overtreding van het bepaalde bij of krachtens deze wet, met uitzondering van
      de [artikelen 2.58, onderdelen a tot en met c, en e][ref1], en [2.170][ref2], of
      [artikel 5:20 van de Algemene wet bestuursrecht][ref3] kan het Commissariaat aan de overtreder een bestuurlijke
      boete opleggen van ten hoogste € 225 000 per overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.12
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.2.5
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.6.5
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 7.12.2
    text: |-
      Bij overtreding van het bepaalde bij of krachtens de [artikelen 2.132 tot en met 2.134][ref1] en
      [6.10 tot en met 6.15][ref2] kan het Commissariaat aan de overtreder een last onder dwangsom opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel6
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.12
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.5.6
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: 6.3.1.1
        afdeling: 6.3.1
  - number: '7.13'
    text: |-
      De te betalen geldsommen van de bestuurlijke boeten en dwangsommen komen toe aan Onze Minister en zijn bestemd voor
      door hem te bepalen mediadoelen in brede zin.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.13
  - number: 7.14.1
    text: |-
      Bij overtreding van het bepaalde bij of krachtens deze wet of [artikel 5:20 van de Algemene wet bestuursrecht][ref1]
      kan het Commissariaat, naast of in plaats van het opleggen van een bestuurlijke boete en een last onder dwangsom:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.14
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 7.14.1.a
    text: |-
      de in [artikel 2.51][ref1] bedoelde uren van de desbetreffende instelling voor ten hoogste twaalf weken intrekken;


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.14
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.2.5
  - number: 7.14.1.b
    text: |-
      de in de [artikelen 2.49, eerste lid][ref1], [6.1][ref2] en [6.5][ref3] bedoelde uren van de desbetreffende
      instelling verminderen of intrekken; en


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel6
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.14
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.2.4
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '6'
        hoofdstuk: '6'
        afdeling: 6.1.1
      - id: ref3
        bwb_id: BWBR0025028
        artikel: '6'
        hoofdstuk: '6'
        afdeling: 6.1.2
  - number: 7.14.1.c
    text: |-
      de uren intrekken of verminderen die de Ster op grond van [artikel 2.95][ref1] op de programmakanalen van de
      landelijke publieke mediadienst ter beschikking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.14
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.2.2
        afdeling: 2.5.2
  - number: 7.14.2
    text: |-
      De bevoegdheden, bedoeld in het eerste lid, heeft het Commissariaat ook wanneer de raad van bestuur het
      Commissariaat heeft verzocht de uren van de desbetreffende instelling te verminderen of in te trekken omdat:
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.14
  - number: 7.14.2.a
    text: |-
      aan een instelling die media-aanbod voor de landelijke publieke omroepdienst verzorgt voor twee achtereenvolgende
      jaren een sanctie als bedoeld in [artikel 2.154][ref1] is opgelegd; of


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.14
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.2.2
        afdeling: 2.6.2
  - number: 7.14.2.b
    text: |-
      een omroepvereniging of de educatieve media-instelling naar de mening van de raad van bestuur onvoldoende
      uitvoering geeft aan de bereidheid tot samenwerking ten behoeve van de landelijke publieke mediadienst.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.14
  - number: 7.16.1
    text: |-
      Tijdens de periode van intrekking van uren als bedoeld in [artikel 7.14][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel7
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.16
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.16.1.a
    text: |-
      is [artikel 2.51, tweede lid][ref1], niet van toepassing; en


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.16
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.2.5
  - number: 7.16.1.b
    text: bestaat geen recht op een financiële bijdrage voor de verzorging van het programma-aanbod.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.16
  - number: 7.16.2
    text: |-
      Tijdens de periode van vermindering van uren wordt de financiële bijdrage voor de verzorging van het programma-
      aanbod evenredig verminderd.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.16
  - number: 7.16.3
    text: |-
      Tijdens de periode van een verbod als bedoeld in [artikel 7.15, eerste lid][ref1], bestaat geen recht op een
      financiële bijdrage voor de verzorging van het media-aanbod.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel7
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.16
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '7'
        hoofdstuk: '7'
  - number: '7.17'
    text: |-
      Bij intrekking of vermindering van uren of een verbod als bedoeld in [artikel 7.15, eerste lid][ref1], kan
      het Commissariaat als dat nodig is de verdeling van de uren, bedoeld in de [artikelen 2.49, eerste lid][ref2],
      [6.1][ref3] en [6.5][ref4], herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0025028#Artikel6
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.17
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.2.4
      - id: ref3
        bwb_id: BWBR0025028
        artikel: '6'
        hoofdstuk: '6'
        afdeling: 6.1.1
      - id: ref4
        bwb_id: BWBR0025028
        artikel: '6'
        hoofdstuk: '6'
        afdeling: 6.1.2
  - number: '7.18'
    text: |-
      De publieke en commerciële media-instellingen, alsmede politieke partijen en de overheid bewaren gedurende
      twee weken na de uitzending opnamen van het door hen verzorgde programma-aanbod en stellen deze desgevraagd ter
      beschikking van het Commissariaat.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.18
  - number: 7.19.1
    text: |-
      De in [artikel 7.14, tweede lid][ref1], bedoelde toezichthouders zijn bevoegd:


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel7
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.19
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.19.1.a
    text: met medeneming van de benodigde apparatuur, een woning binnen te treden zonder toestemming van de bewoner; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.19
  - number: 7.19.1.b
    text: |-
      bedrijfsruimten en voorwerpen te verzegelen gedurende de tijd gelegen tussen 18.00 uur en 08.00 uur voor zover
      dat voor de uitoefening van de in [artikel 5:17 van de Algemene wet bestuursrecht][ref1] genoemde bevoegdheden
      redelijkerwijs nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.19
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 7.19.2
    text: De toezichthouders oefenen de in het eerste lid genoemde bevoegdheden zo nodig uit met behulp van de sterke arm.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.19
  - number: 7.20.1
    text: |-
      Het Commissariaat stelt jaarlijks vóór 1 november Onze Minister in kennis van het voorgenomen handhavingsbeleid in
      het volgende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.20
  - number: 7.20.2
    text: Het Commissariaat oefent geen voorafgaand toezicht uit op de inhoud van media-aanbod.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel7.20
  - number: 8.1.1
    text: Er is een Stimuleringsfonds voor de pers.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.1
  - number: 8.1.2
    text: Het Stimuleringsfonds heeft rechtspersoonlijkheid en is gevestigd in de gemeente ’s-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.1
  - number: 8.2.1
    text: 'In dit hoofdstuk word verstaan onder: - *Stimuleringsfonds:* Stimuleringsfonds voor de pers.'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.2
  - number: 8.2.2
    text: |-
      Op het Stimuleringsfonds is de [Kaderwet zelfstandige bestuursorganen][ref1] van toepassing met uitzondering van
      [artikel 22][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020495
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel22
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0020495
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '22'
  - number: 8.3.1
    text: |-
      Het Stimuleringsfonds heeft tot doel het handhaven en bevorderen van de pluriformiteit van de pers, voor zover die
      van belang is voor de informatie en opinievorming.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.3
  - number: 8.3.2
    text: 'Het Stimuleringsfonds is belast met:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.3
  - number: 8.3.2.a
    text: het verstrekken van subsidies;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.3
  - number: 8.3.2.b
    text: het verrichten of doen verrichten van onderzoek met betrekking tot het functioneren van de pers; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.3
  - number: 8.3.2.c
    text: de uitvoering van overige taken die hem zijn opgedragen bij of krachtens deze wet en andere wetten.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.3
  - number: 8.4.1
    text: Het Stimuleringsfonds heeft een bestuur dat bestaat uit een voorzitter en zes andere leden.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.4
  - number: 8.4.2
    text: Een benoeming geschiedt voor vijf jaar en herbenoeming voor een aansluitende periode is eenmaal mogelijk.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.4
  - number: '8.5'
    text: |-
      Onverminderd [artikel 13 van de Kaderwet zelfstandige bestuursorganen][ref1] zijn met het lidmaatschap van het
      bestuur van het Stimuleringsfonds onverenigbaar:


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel13
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.5
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '13'
  - number: 8.5.a
    text: het lidmaatschap van een van beide Kamers der Staten-Generaal, een provinciaal bestuur of een gemeentebestuur;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.5
  - number: 8.5.b
    text: |-
      een dienstbetrekking bij een ministerie, een dienst, instelling of bedrijf vallende onder de verantwoordelijkheid
      van een minister; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.5
  - number: 8.5.c
    text: |-
      het lidmaatschap van een orgaan van of een dienstbetrekking bij een publieke media-instelling, een commerciële
      media-instelling of een uitgever van een persorgaan.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.5
  - number: 8.6.1
    text: Het Stimuleringsfonds neemt besluiten bij meerderheid van stemmen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.6
  - number: 8.6.2
    text: |-
      Het Stimuleringsfonds kan slechts met instemming van alle leden aan één of meer van zijn leden mandaat en
      machtiging verlenen voor het uitvoeren van delen van zijn taak.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.6
  - number: 8.6.3
    text: Het Stimuleringsfonds stelt inzake zijn besluitvorming en werkwijze een bestuursreglement vast.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.6
  - number: '8.7'
    text: |-
      Onze Minister vergoedt uit de in [artikel 8.8][ref1] bedoelde inkomsten en uit andere beschikbare financiële
      middelen de kosten van het Stimuleringsfonds op basis van de door hem goedgekeurde begroting.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel8
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.7
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.8.1
    text: 'Bij ministeriële regeling:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.8
  - number: 8.8.1.a
    text: |-
      kan worden bepaald welk percentage, dat ten hoogste vier procent bedraagt, van de inkomsten uit reclame- en
      telewinkelboodschappen van onderscheidenlijk de landelijke, regionale en lokale publieke mediadiensten en de
      commerciële media-instellingen jaarlijks wordt uitgekeerd ten behoeve van het Stimuleringsfonds voor de pers; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.8
  - number: 8.8.1.b
    text: kunnen regels worden gesteld over de vaststelling van de in onderdeel a bedoelde inkomsten.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.8
  - number: 8.8.2
    text: |-
      Regionale en lokale publieke media-instellingen en commerciële media-instellingen voldoen jaarlijks het met
      toepassing van het eerste lid vastgestelde bedrag aan het Commissariaat, dat het ter beschikking stelt aan Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.8
  - number: '8.9'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de inrichting van de begroting, het financieel verslag
      en aandachtspunten voor de accountantscontrole.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.9
  - number: 8.10.1
    text: |-
      Het Stimuleringsfonds kan binnen de door Onze Minister beschikbaar gestelde bedragen subsidie verstrekken op grond
      van deze titel.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.10
  - number: 8.10.2
    text: 'Subsidie wordt alleen verstrekt ten behoeve van persorganen die voldoen aan de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.10
  - number: 8.10.2.a
    text: zij worden in Nederland uitgegeven en zijn bestemd voor het publiek in Nederland;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.10
  - number: 8.10.2.b
    text: |-
      zij bevatten in belangrijke mate nieuws, analyse, commentaar en achtergrondinformatie over een gevarieerd deel van
      de maatschappelijke actualiteit, mede in het belang van politieke meningsvorming;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.10
  - number: 8.10.2.c
    text: |-
      zij worden geredigeerd door een zelfstandige redactie op basis van een statuut waarin de redactionele identiteit
      is neergelegd;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.10
  - number: 8.10.2.d
    text: zij verschijnen regelmatig en ten minste maandelijks;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.10
  - number: 8.10.2.e
    text: zij zijn voor iedereen verkrijgbaar;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.10
  - number: 8.10.2.f
    text: zij worden verkrijgbaar gesteld tegen betaling;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.10
  - number: 8.10.2.g
    text: zij worden niet uitgegeven door of vanwege de overheid; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.10
  - number: 8.10.2.h
    text: |-
      zij worden niet uitgegeven of verspreid in samenhang met het lidmaatschap, donateurschap of deelnemerschap van een
      vereniging, kerkgenootschap of andere organisatie.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.10
  - number: 8.11.1
    text: |-
      Het Stimuleringsfonds kan ten behoeve van een persorgaan aan de uitgever daarvan subsidie verstrekken in de vorm
      van kredieten of kredietfaciliteiten voor de uitvoering van een project dat gericht is op een rendabele exploitatie
      van het persorgaan.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.11
  - number: 8.11.2
    text: 'Subsidie wordt alleen verstrekt als:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.11
  - number: 8.11.2.a
    text: de continuïteit van het persorgaan in gevaar is;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.11
  - number: 8.11.2.b
    text: de noodzakelijke financiële middelen niet of niet afdoende op andere wijze kunnen worden verkregen;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.11
  - number: 8.11.2.c
    text: |-
      het project wordt uitgevoerd volgens een activiteitenplan dat uitzicht biedt op een rendabele exploitatie van het
      persorgaan binnen een redelijke periode; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.11
  - number: 8.11.2.d
    text: het activiteitenplan door het Stimuleringsfonds is goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.11
  - number: 8.11.3
    text: |-
      Uitsluitend ten behoeve van een eenmalige reorganisatie van een persorgaan kan de subsidie worden verstrekt in de
      vorm van een uitkering als het activiteitenplan niet op doeltreffende wijze kan worden uitgevoerd met kredieten
      of kredietfaciliteiten.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.11
  - number: 8.12.1
    text: |-
      Het Stimuleringsfonds kan ten behoeve van het starten van de exploitatie van een persorgaan aan de uitgever daarvan
      subsidie verstrekken in de vorm van kredieten of kredietfaciliteiten.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.12
  - number: 8.12.2
    text: 'Subsidie wordt alleen verstrekt als:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.12
  - number: 8.12.2.a
    text: het persorgaan ten minste zes keer per week verschijnt;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.12
  - number: 8.12.2.b
    text: het starten van de exploitatie zonder subsidie niet mogelijk is;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.12
  - number: 8.12.2.c
    text: |-
      het starten van de exploitatie plaatsvindt volgens een activiteitenplan dat uitzicht biedt op een rendabele
      exploitatie binnen een redelijke periode; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.12
  - number: 8.12.2.d
    text: het activiteitenplan door het Stimuleringsfonds is goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.12
  - number: 8.12.3
    text: |-
      Subsidie kan worden verstrekt tot ten hoogste de helft van de in het activiteitenplan begrote kosten die zijn
      berekend volgens door het Stimuleringsfonds vast te stellen richtlijnen over een periode van ten hoogste vier jaar
      vanaf de start van de exploitatie.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.12
  - number: 8.12.4
    text: |-
      Als de werkelijke exploitatietekorten lager zijn dan de voorziene exploitatiekosten kan de subsidie lager worden
      vastgesteld tot ten hoogste vijfentwintig procent van de werkelijke exploitatietekorten.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.12
  - number: 8.13.1
    text: |-
      Het Stimuleringsfonds kan ten behoeve van twee of meer persorganen gezamenlijk aan de uitgever of uitgevers daarvan
      subsidie verstrekken voor de uitvoering van een project gericht op het verbeteren van de exploitatiepositie van
      die persorganen.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.13
  - number: 8.13.2
    text: 'Subsidie wordt alleen verstrekt als:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.13
  - number: 8.13.2.a
    text: |-
      het project wordt uitgevoerd volgens een activiteitenplan dat door de verantwoordelijke uitgever of door de
      verantwoordelijke uitgevers gezamenlijk is opgesteld en dat uitzicht biedt op een structurele verbetering van de
      exploitatiepositie van de persorganen binnen een redelijke termijn;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.13
  - number: 8.13.2.b
    text: het project past in de doelstellingen van het Stimuleringsfonds; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.13
  - number: 8.13.2.c
    text: het activiteitenplan door het Stimuleringsfonds is goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.13
  - number: 8.14.1
    text: |-
      Het Stimuleringsfonds kan voor het verrichten van organisatieonderzoek dat gericht is op structurele verbetering
      van de exploitatiepositie van een persorgaan aan de uitgever daarvan subsidie verstrekken.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.14
  - number: 8.14.2
    text: 'Subsidie wordt alleen verstrekt als:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.14
  - number: 8.14.2.a
    text: |-
      de exploitatie in het boekjaar voorafgaand aan de aanvraag van de subsidie verliesgevend is geweest of dreigde
      te worden;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.14
  - number: 8.14.2.b
    text: door de uitgever een voorstel is ingediend dat de opzet en uitvoering van het onderzoek bevat;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.14
  - number: 8.14.2.c
    text: het voorgestelde onderzoek past in de doelstellingen van het Stimuleringsfonds; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.14
  - number: 8.14.2.d
    text: het voorstel voor het onderzoek door het Stimuleringsfonds is goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.14
  - number: 8.14.3
    text: Subsidie kan worden verstrekt tot ten hoogste tweederde deel van de kosten van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.14
  - number: 8.15.1
    text: |-
      Het Stimuleringsfonds kan subsidie verstrekken voor het verrichten van onderzoek ten behoeve van de persbedrijfstak
      als geheel.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.15
  - number: 8.15.2
    text: 'Subsidie wordt alleen verstrekt als:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.15
  - number: 8.15.2.a
    text: een voorstel is ingediend dat de opzet en uitvoering van het onderzoek bevat;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.15
  - number: 8.15.2.b
    text: |-
      het voorgestelde onderzoek betrekking heeft op de bedrijfstak als geheel en past in de doelstellingen van het
      Stimuleringsfonds; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.15
  - number: 8.15.2.c
    text: het voorstel voor het onderzoek is goedgekeurd door het Stimuleringsfonds.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.15
  - number: 8.16.1
    text: |-
      Het Stimuleringsfonds kan ieder jaar subsidieplafonds vaststellen voor de verschillende activiteiten waarvoor
      subsidie kan worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.16
  - number: 8.16.2
    text: Een besluit tot vaststelling van een subsidieplafond wordt in de Staatscourant bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.16
  - number: 8.17.1
    text: Subsidies worden verstrekt op aanvraag.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.17
  - number: 8.17.2
    text: Het Stimuleringsfonds kan een aanvraag voorleggen aan een externe adviesinstantie.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.17
  - number: 8.17.3
    text: |-
      Het Stimuleringsfonds waarborgt dat vertrouwelijke gegevens betreffende de bedrijfsvoering van de aanvrager als
      zodanig behandeld worden.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.17
  - number: '8.18'
    text: |-
      Verplichtingen die het Stimuleringsfonds aan een subsidieontvanger oplegt hebben geen betrekking op de inhoud van
      een persorgaan.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.18
  - number: '8.19'
    text: |-
      Het Stimuleringsfonds maakt een besluit tot verlening van een subsidie binnen een week nadat het besluit is genomen
      bekend in de Staatscourant, met vermelding van de hoogte van de subsidie.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.19
  - number: 8.20.1
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.20
  - number: 8.20.1.a
    text: de nadere voorwaarden voor het verkrijgen van subsidie;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.20
  - number: 8.20.1.b
    text: de verplichtingen die het Stimuleringsfonds bij de subsidieverstrekking kan opleggen;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.20
  - number: 8.20.1.c
    text: de indiening en wijze van behandeling van aanvragen;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.20
  - number: 8.20.1.d
    text: de hoogte van subsidies en de wijze van berekening daarvan;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.20
  - number: 8.20.1.e
    text: |-
      de wijze waarop de beschikbare financiële middelen voor de verschillende subsidies worden verdeeld als een
      subsidieplafond is vastgesteld;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.20
  - number: 8.20.1.f
    text: de verstrekking van voorschotten; en
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.20
  - number: 8.20.1.g
    text: de intrekking, wijziging en terugvordering van subsidies.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.20
  - number: 8.20.2
    text: Voorwaarden als bedoeld in het eerste lid, onderdeel a, hebben geen betrekking op de inhoud van een persorgaan.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.20
  - number: 8.21.1
    text: |-
      Met het toezicht op de naleving van de bepalingen en voorschriften die op grond van dit hoofdstuk gelden voor
      subsidieontvangers zijn belast de leden van het Stimuleringsfonds en de bij besluit van het Stimuleringsfonds
      aangewezen medewerkers van het Stimuleringsfonds.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.21
  - number: 8.21.2
    text: Van een besluit als bedoeld in het tweede lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel8.21
  - number: '9.1'
    text: |-
      In afwijking van [artikel 2.144, eerste lid, tweede volzin][ref1], bedraagt de vermeerdering van de
      rijksmediabijdrage:


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
        hoofdstuk: '2'
        afdeling: 2.6.1
  - number: 9.1.a
    text: € 49,799 miljoen voor het jaar 2008;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel9.1
  - number: 9.1.b
    text: € 48,387 miljoen voor het jaar 2009;
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel9.1
  - number: 9.1.c
    text: € 47,985 miljoen voor het jaar 2010.
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel9.1
  - number: '9.2'
    text: |-
      De [artikelen 2.98, tweede lid, onderdeel c][ref1], en [3.7, tweede lid, onderdeel c][ref2], zijn tot één
      jaar na het tijdstip waarop deze wet in werking treedt niet van toepassing op de verspreiding van reclame- en
      telewinkelboodschappen ter uitvoering van overeenkomsten met adverteerders die zijn aangegaan vóór het tijdstip van
      inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel3
    url: https://wetten.overheid.nl/BWBR0025028/2009-01-01#Artikel9.2
