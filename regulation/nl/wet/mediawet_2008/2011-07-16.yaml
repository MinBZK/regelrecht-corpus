        afdeling: 2.6.2
  - number: '2.49'
    text: |-
      1 Het Commissariaat stelt jaarlijks voor elk van de aangewezen kerkgenootschappen en genootschappen op geestelijke
      grondslag vast hoeveel uren beschikbaar zijn op de algemene programmakanalen van de landelijke publieke
      mediadienst.

      2 Kerkgenootschappen respectievelijk genootschappen op geestelijke grondslag verzorgen media-aanbod dat geheel ligt
      op kerkelijk respectievelijk geestelijk terrein en dat verband houdt met de kerkelijke of geestelijke identiteit.

      3 Kerkgenootschappen en genootschappen op geestelijke grondslag kunnen de verzorging van hun media-aanbod opdragen
      aan de NOS, een omroepvereniging of een door hen opgerichte rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.49
  - number: '2.50'
    text: |-
      1 Gedurende de concessieperiode, bedoeld in [artikel 2.19][ref1], wordt op ten minste drie algemene
      televisieprogrammakanalen en vijf algemene radioprogrammakanalen van de landelijke publieke mediadienst programma-
      aanbod verzorgd.

      2 Het programma-aanbod op de onderscheiden algemene programmakanalen heeft een herkenbaar profiel.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.19
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.50
    references:
