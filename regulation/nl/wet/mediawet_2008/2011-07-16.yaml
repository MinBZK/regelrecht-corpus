  - number: '2.176'
    text: |-
      1 Gereserveerde gelden voor de verzorging van media-aanbod worden in het volgende kalenderjaar besteed aan de
      doelen waarvoor zij oorspronkelijk bestemd zijn.

      2 Onze Minister en het Commissariaat kunnen op verzoek van de raad van bestuur respectievelijk de Wereldomroep
      ontheffing verlenen van het eerste lid. Onze Minister en het Commissariaat kunnen aan een ontheffing voorschriften
      verbinden.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.176
  - number: '2.177'
    text: |-
      1 Gelden die in strijd met het bepaalde bij of krachtens deze wet zijn gebruikt of die in strijd met de
      [artikelen 2.174, tweede lid][ref1], [2.174a, eerste lid][ref2], en [2.175][ref3] zijn gereserveerd, vordert het
      Commissariaat terug.

      2 Teruggevorderde gelden worden toegevoegd aan de algemene mediareserve.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.174
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.174a
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel2.175
