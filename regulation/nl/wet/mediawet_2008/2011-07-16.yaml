  - number: '2.152'
    text: |-
      1 De raad van bestuur verdeelt het budget, bedoeld in [artikel 2.149, eerste lid, onderdeel a][ref1], zodanig dat:

      a. van de ene helft van het budget elke omroepvereniging een gelijk deel ontvangt; en

      b. van de andere helft van het budget elke omroepvereniging een bedrag ontvangt waarvan de omvang wordt berekend
      naar rato van het aantal leden van de omroepvereniging overeenkomstig het tweede lid.

      Voor de vaststelling van het budget, bedoeld in onderdeel b, telt het aantal leden dat het aantal van 400 000 leden
      overschrijdt, niet mee.

      2 Het bedrag per omroepvereniging, bedoeld in het eerste lid, onderdeel b, wordt vastgesteld aan de hand van de
      formule

      (l : t) * b, waarbij

      l = het aantal leden per omroepvereniging;

      t = het totaal aantal leden van alle omroepverenigingen die een erkenning als bedoeld in [artikel 2.24][ref2]
      hebben verkregen; en

      b = de helft van het budget, bedoeld in [artikel 2.149, eerste lid, onderdeel a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.149
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.24
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel2.149
