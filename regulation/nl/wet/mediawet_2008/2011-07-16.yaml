  - number: '2.52'
    text: |-
      1 De instellingen gebruiken hun uren, bedoeld in [artikel 2.51, eerste lid][ref1], geheel.

      2 In overleg met de raad van bestuur kan worden afgeweken van het eerste lid als dat voor de samenstelling van een
      samenhangend, pluriform, gevarieerd en kwalitatief hoogstaand media-aanbod op de aanbodkanalen van de landelijke
      publieke mediadienst wenselijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.51
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.52
