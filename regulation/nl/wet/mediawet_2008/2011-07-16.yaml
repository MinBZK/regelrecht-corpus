  - number: '2.143'
    text: |-
      1 De NPO en de publieke media-instellingen voorzien op onafhankelijke wijze in de uitvoering van de publieke
      mediaopdracht en hebben daarvoor op de wijze zoals geregeld in deze wet aanspraak op bekostiging uit ’s Rijks kas
      die een kwalitatief hoogwaardig media-aanbod mogelijk maakt en waardoor continuïteit van financiering gewaarborgd
      is.

      2 Voor de bekostiging van de uitvoering van de publieke mediaopdracht en ter bestrijding van de overige kosten,
      bedoeld in [artikel 2.146][ref1], worden onder de naam «rijksmediabijdrage» jaarlijks gelden beschikbaar gesteld
      door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.146
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.143
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.146'
        hoofdstuk: '2'
        afdeling: 2.6.1
  - number: '2.144'
    text: |-
      1 De rijksmediabijdrage bestaat ten minste uit een bedrag van € 577,093 miljoen, gebaseerd op de in het jaar 1998
      door de Dienst omroepbijdragen op grond van de toen geldende wettelijke bepalingen aan Onze Minister afgedragen
      inkomsten en de mutaties in de rijksbegroting vanaf dat moment. Dit bedrag wordt vermeerderd met € 47,179 miljoen.

      2 Het bedrag van de rijksmediabijdrage wordt jaarlijks bijgesteld overeenkomstig:

      a. de door het Centraal Bureau voor de Statistiek voor het desbetreffende jaar geraamde index voor de groei van het
      aantal huishoudens in Nederland; en

      b. de door het Centraal Planbureau voor het desbetreffende jaar geraamde consumentenprijsindex.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.144
  - number: '2.145'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de toepassing van de
      [artikelen 2.143, tweede lid][ref1], en [2.144][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.143
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.144
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.145
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.143'
        hoofdstuk: '2'
        afdeling: 2.6.1
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2.144'
        hoofdstuk: '2'
        afdeling: 2.6.1
  - number: '2.146'
    text: |-
      De rijksmediabijdrage en de inkomsten van de Ster dienen ter bestrijding van de kosten verbonden aan:

      a. de bekostiging van de uitvoering van de publieke mediaopdracht op landelijke niveau volgens
      [afdeling 2.6.2][ref1];

      b. de bekostiging van de Wereldomroep volgens [afdeling 2.6.3][ref2];

      c. het Europese media-aanbod, bedoeld in [artikel 2.2, tweede lid, onderdeel e][ref3];

      d. het Stimuleringsfonds voor de pers, genoemd in [artikel 8.1][ref4];

      e. de Raad voor cultuur, voor zover samenhangend met de advisering over radio, televisie, pers en andere vormen van
      massacommunicatie, tot een door Onze Minister te bepalen bedrag;

      f. het Commissariaat;

      g. door Onze Minister bekostigd onderzoek in het belang van de massacommunicatie;

      h. de bijdrage aan de stichting Stimuleringsfonds Nederlandse culturele mediaproducties;

      i. vergoedingen aan een door Onze Minister aangewezen instelling voor het in stand houden en exploiteren van
      omroeporkesten, omroepkoren en een muziekbibliotheek;

      j. vergoedingen aan een door Onze Minister aangewezen instelling voor het in stand houden en exploiteren van een
      media-archief;

      k.

      l. het door Onze Minister aangewezen overlegorgaan van lokale publieke media-instellingen; en

      m. bijdragen voor de verzorging van media-aanbod van regionale en lokale publieke mediadiensten dat gericht is
      op minderheden;

      n. vergoedingen aan het landelijk orgaan dat informatie verstrekt en anderszins ondersteuning biedt aan de
      programmaraden, bedoeld in [artikel 6.15, eerste lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Hoofdstuk2
