  - number: '2.59'
    text: |-
      1 De landelijke publieke media-instellingen verstrekken desgevraagd aan de raad van toezicht van de NPO, de raad
      van bestuur en de door hem daartoe aangewezen medewerkers van de NPO alle inlichtingen voor zover dat voor de
      vervulling van de taken van de raad van toezicht en de raad van bestuur redelijkerwijs nodig is.

      2 De raad van bestuur en de door hem daartoe aangewezen medewerkers van de NPO kunnen inzage verlangen in zakelijke
      gegevens en bescheiden van de instellingen.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.59
  - number: '2.60'
    text: |-
      1 Onverminderd [artikel 2.88, eerste lid][ref1], zijn de regelingen, bedoeld in
      [artikel 2.10, tweede lid, onderdeel c][ref2], en de overige besluiten die de raad van bestuur of de door hem
      gemandateerden nemen in de uitoefening van hun taken, bindend voor de landelijke publieke media-instellingen, voor
      zover die regelingen en besluiten hen aangaan.

      2 De raad van bestuur ziet er op toe dat de regelingen en besluiten worden nageleefd.


