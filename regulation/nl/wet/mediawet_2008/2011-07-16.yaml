        artikel: '2.159'
        hoofdstuk: '2'
        paragraaf: 2.6.2.3
        afdeling: 2.6.2
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2.167'
        hoofdstuk: '2'
        afdeling: 2.6.4
      - id: ref3
        bwb_id: BWBR0025028
        artikel: '2.168'
        hoofdstuk: '2'
        afdeling: 2.6.4
  - number: '2.170'
    text: |-
      1 Gedeputeerde Staten zorgen voor de bekostiging van het functioneren van ten minste één regionale publieke media-
      instelling in de provincie door vergoeding van de kosten die rechtstreeks verband houden met het verzorgen van de
      regionale publieke mediadienst, voor zover die kosten niet op andere wijze zijn gedekt, op zodanige wijze dat:

      a. een kwalitatief hoogwaardig media-aanbod mogelijk is en continuïteit van bekostiging is gewaarborgd; en

      b. in ieder geval per provincie het in 2004 bestaande niveau van de activiteiten met betrekking tot de verzorging
      van media-aanbod door de regionale publieke media-instelling(en) ten minste gehandhaafd blijft.

      2 Aan de bekostiging worden geen voorschriften verbonden die in strijd zijn met het bepaalde bij of krachtens deze
      wet.

      3 Onze Minister zendt telkens na drie jaar aan de Staten-Generaal een verslag over de doeltreffendheid en de
      effecten van het bepaalde in dit artikel in de praktijk.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.170
  - number: 2.170a
    text: |-
      1 Het College van Burgemeester en Wethouders zorgt voor de bekostiging van het functioneren van de lokale
      publieke media-instelling als de gemeenteraad een advies als bedoeld in [artikel 2.62, eerste lid][ref1], heeft
      uitgebracht en daarbij positief heeft geadviseerd over de vraag of de instelling voldoet aan de eis, bedoeld in
      [artikel 2.61, tweede lid, onderdeel c][ref2].

      2 De bekostiging betreft vergoeding van de kosten die rechtstreeks verband houden met het verzorgen van de lokale
      publieke omroepdienst, voor zover die kosten niet op andere wijze zijn gedekt, op zodanige wijze dat op lokaal
      niveau in een toereikend media-aanbod kan worden voorzien en continuïteit van bekostiging is gewaarborgd.

      3 Als twee of meer gemeenteraden gezamenlijk een advies als bedoeld in [artikel 2.62, eerste lid][ref3], hebben
      uitgebracht, en daarbij positief hebben geadviseerd over de vraag of de instelling voldoet aan de eis, bedoeld
      in [artikel 2.61, tweede lid, onderdeel c][ref4], zorgen de Colleges van Burgemeester en Wethouders van de
      desbetreffende gemeenten gezamenlijk voor de bekostiging, bedoeld in het eerste lid.

      4 [Artikel 2.170, tweede en derde lid][ref5], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.62
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.61
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel2.62
      [ref4]: https://wetten.overheid.nl/BWBR0025028#Artikel2.61
      [ref5]: https://wetten.overheid.nl/BWBR0025028#Artikel2.170
