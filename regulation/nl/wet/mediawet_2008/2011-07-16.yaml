  - number: '6.14'
    text: |-
      1 Het is de aanbieder van een omroepnetwerk toegestaan naar een aangeslotene op het omroepnetwerk op diens
      verzoek minder programma-aanbod dan bedoeld in [artikel 6.13, eerste lid, onderdelen a en b][ref1], dat door de
      aangeslotenen op analoge wijze of op digitale wijze wordt ontvangen, te verspreiden, mits hij een evenredig lager
      tarief in rekening brengt.

      2 Het Commissariaat kan geheel of gedeeltelijk ontheffing verlenen van de verplichtingen, bedoeld in
      [artikel 6.13][ref2], als het onverkort nakomen daarvan leidt tot disproportionele kosten, tot een belemmering
      van innovatie of tot anderszins onredelijke uitkomsten. Het Commissariaat kan aan een ontheffing voorschriften
      verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel6.13
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel6.13
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel6.14
