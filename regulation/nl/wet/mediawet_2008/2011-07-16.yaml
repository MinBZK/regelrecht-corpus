  - number: '2.67'
    text: |-
      1 Het Commissariaat trekt een aanwijzing in als de desbetreffende regionale of lokale publieke media-instelling:

      a. niet meer voldoet aan de eisen van [artikel 2.61, tweede lid][ref1]; of

      b.

      2 Het Commissariaat trekt de aanwijzing van een regionale of lokale publieke media-instelling die niet meer voldoet
      aan [artikel 2.61, tweede lid, onderdelen b of c][ref2], pas in nadat de desbetreffende media-instelling gedurende
      vier maanden, gerekend van de dag waarop het desbetreffende feit is geconstateerd, in de gelegenheid is gesteld
      opnieuw aan dit vereiste te voldoen en zij daarin niet is geslaagd.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.61
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.61
