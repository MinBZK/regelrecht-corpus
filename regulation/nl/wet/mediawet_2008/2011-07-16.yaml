  - number: '2.42'
    text: |-
      1 Het Commissariaat kan eens in de vijf jaar kerkgenootschappen en genootschappen op geestelijke grondslag of
      rechtspersonen waarin twee of meer van deze genootschappen samenwerken, aanwijzen voor het verzorgen van media-
      aanbod op kerkelijk of geestelijk terrein voor de landelijke publieke mediadienst volgens de bepalingen van deze
      afdeling.

      2 Voor aanwijzing komen slechts in aanmerking kerkgenootschappen en genootschappen op geestelijke grondslag die
      representatief geacht kunnen worden voor een in Nederland aanwezige kerkelijke of geestelijke hoofdstroming.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.42
  - number: '2.43'
    text: |-
      1 Een aanwijzing geschiedt op aanvraag, geldt voor een periode van vijf jaar die samenvalt met een vijfjaarlijkse
      periode van de concessie als bedoeld in [artikel 2.19, derde lid][ref1], en vervalt van rechtswege na afloop van
      die periode.

      2 Een aanwijzing geeft aanspraak op een financiële bijdrage voor de verzorging van media-aanbod volgens het
      bepaalde bij of krachtens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.19
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.43
