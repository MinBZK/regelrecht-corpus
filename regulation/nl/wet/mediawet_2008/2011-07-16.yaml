  - number: '7.17'
    text: |-
      Bij intrekking of vermindering van uren of een verbod als bedoeld in [artikel 7.15, eerste lid][ref1], kan
      het Commissariaat als dat nodig is de verdeling van de uren, bedoeld in de [artikelen 2.49, eerste lid][ref2],
      [6.1][ref3] en [6.5][ref4], herzien.


