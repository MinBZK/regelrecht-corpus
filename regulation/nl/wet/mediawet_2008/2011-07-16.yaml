  - number: '2.58'
    text: |-
      De NPO stuurt jaarlijks vóór 1 mei aan het Commissariaat en Onze Minister een verslag over het afgelopen
      kalenderjaar met daarin in elk geval:

      a. een beschrijving van de wijze waarop door de NPO en de landelijke publieke media-instellingen op de
      verschillende aanbodkanalen uitvoering is gegeven aan de publieke mediaopdracht;

      b. de samenstelling van het media-aanbod van de publieke mediadienst op de programmakanalen en voor zover mogelijk
      op de overige aanbodkanalen, waaronder de uren die besteed zijn aan media-aanbod op de terreinen genoemd in
      [artikel 2.1, eerste lid][ref1];

      c. een rapportage over de realisering van de doelstellingen van de prestatieovereenkomst, bedoeld in
      [artikel 2.22][ref2];

      d. de naleving van de [artikelen 2.115 tot en met 2.123][ref3]; en

      e. de naleving van de gedragscode, bedoeld in [artikel 2.3, tweede lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.22
