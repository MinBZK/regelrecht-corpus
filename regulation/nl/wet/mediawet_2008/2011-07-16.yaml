  - number: '7.16'
    text: |-
      1 Tijdens de periode van intrekking van uren als bedoeld in [artikel 7.14][ref1]:

      a. is [artikel 2.51, derde lid][ref2], niet van toepassing; en

      b. bestaat geen recht op een financiële bijdrage voor de verzorging van het programma-aanbod.

      2 Tijdens de periode van vermindering van uren wordt de financiële bijdrage voor de verzorging van het programma-
      aanbod evenredig verminderd.

      3 Tijdens de periode van een verbod als bedoeld in [artikel 7.15, eerste lid][ref3], bestaat geen recht op een
      financiële bijdrage voor de verzorging van het media-aanbod.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel7.14
