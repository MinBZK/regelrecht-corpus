  - number: '2.14'
    text: |-
      1 Voordat de raad van bestuur een overeenkomst als bedoeld in [artikel 2.3, eerste lid][ref1], aangaat dan wel
      een besluit neemt over een taak als bedoeld in [artikel 2.10, tweede lid, onderdelen d, e, f, of g][ref2], over
      de wijze van aanwending van het budget, bedoeld in [artikel 2.149, eerste lid, onderdeel h][ref3], stelt hij het
      college van omroepen in de gelegenheid daarover zijn mening te geven binnen een door de raad van bestuur te stellen
      redelijke termijn.

      2 Het uitblijven van de mening van het college staat aan het aangaan van een overeenkomst of het nemen van een
      besluit door de raad van bestuur niet in de weg.

      3 Als uit de mening blijkt dat het college niet instemt met een voorgenomen overeenkomst of een voorgenomen besluit
      dan wel belangrijke onderdelen daarvan en de raad van bestuur wenst zijn voornemen ongewijzigd te handhaven, legt
      de raad van bestuur de voorgenomen overeenkomst of het vastgestelde besluit samen met de mening ter instemming voor
      aan de raad van toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.3
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.10
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel2.149
