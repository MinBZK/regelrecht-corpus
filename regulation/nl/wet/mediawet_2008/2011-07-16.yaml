        paragraaf: 2.3.1
  - number: '2.63'
    text: |-
      1 Als meer dan één lokale instelling in een gemeente aan de eisen, bedoeld in [artikel 2.61, tweede lid][ref1],
      voldoet, bevordert het College van Burgemeester en Wethouders voor zover dat redelijkerwijs mogelijk is het
      samengaan van die instellingen.

      2 Er kan per gemeente slechts één lokale publieke media-instelling worden aangewezen, waarbij het Commissariaat
      acht slaat op alle factoren die voor het functioneren van de instelling van belang kunnen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.61
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.63
