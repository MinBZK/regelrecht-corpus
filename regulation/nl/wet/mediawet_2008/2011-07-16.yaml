  - number: '2.12'
    text: |-
      1 Het college van omroepen adviseert de raad van toezicht en de raad van bestuur desgevraagd of uit eigen beweging
      over het beleid inzake het media-aanbod van de landelijke publieke mediadienst.

      2 Het college van omroepen is als volgt samengesteld:

      a. de omroepverenigingen en de educatieve media-instelling die een erkenning als bedoeld in [artikel 2.24][ref1]
      onderscheidenlijk [artikel 2.28][ref2] hebben verkregen, de omroepverenigingen die een voorlopige erkenning als
      bedoeld in [artikel 2.24][ref3] hebben verkregen, de NOS en de NPS benoemen elk één lid; en

      b. de kerkgenootschappen en de genootschappen op geestelijke grondslag die op grond van [artikel 2.42][ref4] zijn
      aangewezen, benoemen gezamenlijk één lid.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.24
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.28
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel2.24
