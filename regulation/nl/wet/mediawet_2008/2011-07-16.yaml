  - number: '2.33'
    text: |-
      1 Onze Minister trekt een erkenning of voorlopige erkenning in als een instelling:

      a. niet meer voldoet aan de [artikelen 2.24, tweede lid][ref1], of [2.28, tweede lid][ref2], dan
      wel niet voldoet aan de [artikelen 2.25, eerste volzin, onderdeel c, en tweede volzin][ref3], en
      [2.26, eerste volzin, onderdeel c, en tweede volzin][ref4]; of

      b.

      2 Onze Minister kan een erkenning of voorlopige erkenning intrekken als het Commissariaat aan de instelling binnen
      een jaar ten minste twee maal een bestuurlijke sanctie als bedoeld in [titel 7.2][ref5] heeft opgelegd wegens
      overtreding van het bepaalde bij of krachtens deze wet of [artikel 5:20 van de Algemene wet bestuursrecht][ref6].

      3 Onze Minister kan een erkenning of voorlopige erkenning intrekken, als bij de nieuwe evaluatie, bedoeld in
      [artikel 2.184, derde lid][ref7], is vastgesteld dat een omroepvereniging of de educatieve media-instelling
      onvoldoende heeft bijgedragen aan de uitvoering van de publieke mediaopdracht op landelijk niveau door de wijze
      waarop zij uitvoering heeft gegeven aan de publieke taak, bedoeld in [artikel 2.24, tweede lid, onderdeel b][ref8],
      onderscheidenlijk [artikel 2.28, tweede lid, onderdeel b][ref9]. [Artikel 2.31][ref10] is van overeenkomstige
      toepassing. Een besluit als bedoeld in de eerste volzin voorziet in het tijdstip met ingang waarvan de erkenning of
      voorlopige erkenning wordt ingetrokken. Dit tijdstip is niet later dan één jaar na de bekendmaking van het besluit,
      bedoeld in de eerste volzin.

      4 Onze Minister kan op verzoek van de raad van bestuur een erkenning of voorlopige erkenning intrekken als:

      a. de raad van bestuur aan de instelling binnen de erkenningperiode twee maal een sanctie als bedoeld in
      [artikel 2.154][ref11] heeft opgelegd; of

      b. de instelling naar de mening van de raad van bestuur onvoldoende uitvoering geeft aan de bereidheid tot
      samenwerking ten behoeve van de landelijk publieke mediadienst.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.24
