  - number: '2.147'
    text: |-
      1 De NPO dient jaarlijks vóór 15 september een begroting voor de landelijke publieke mediadienst in bij Onze
      Minister en het Commissariaat.

      2 De begroting bevat in elk geval:

      a. een beschrijving van de wijze waarop door de NPO en de landelijke publieke media-instellingen invulling wordt
      gegeven aan het voorgenomen media-aanbod op de verschillende aanbodkanalen, met in achtneming van het bepaalde bij
      of krachtens deze wet;

      b. een overzicht van aard en aantal van de aanbodkanalen;

      c. de financiële middelen die voor het volgende kalenderjaar nodig zijn om de voornemens met betrekking tot de
      landelijke publieke mediadienst te verwezenlijken en een raming voor de daarop volgende vier jaar;

      d. een toelichting op de onderscheiden onderdelen en begrotingsposten; en

      e. een beschrijving van de samenwerking met de Wereldomroep, de regionale en lokale publieke media-instellingen
      en anderen.

      3 De financiële middelen worden als volgt onderverdeeld:

      a. de financiële middelen voor de verzorging van het media-aanbod op de verschillende aanbodkanalen;

      b. de financiële middelen voor programma-aanbod, bedoeld in de [artikelen 2.115 tot en met 2.123][ref1];

      c. de eigen inkomsten van de omroepverenigingen, de educatieve media-instelling, de NOS en de NPS, die gebruikt
      moeten worden voor de verzorging van het media-aanbod;

      d. de financiële middelen voor het verspreiden van het media-aanbod op de verschillende aanbodkanalen; en

      e. de financiële middelen voor de uitvoering van de taken en werkzaamheden van de NPO.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.115
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.147
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.115'
        hoofdstuk: '2'
        paragraaf: 2.5.4.1
        afdeling: 2.5.4
  - number: '2.148'
    text: |-
      1 Bij ministeriële regeling kunnen nadere regels worden gesteld over de inhoud en inrichting van de begroting.

      2 Het Commissariaat zendt vóór 15 oktober zijn opmerkingen met betrekking tot de begroting aan Onze Minister.

      3 De NPO maakt de begroting openbaar.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.148
  - number: '2.149'
    text: |-
      1 Onze Minister stelt jaarlijks vóór 1 december de budgetten van de landelijke publieke mediadienst voor het
      komende jaar vast voor:

      a. de verzorging van het media-aanbod van de omroepverenigingen die een erkenning als bedoeld in
      [artikel 2.24][ref1] hebben verkregen, gezamenlijk;

      b. de verzorging van het media-aanbod van de omroepverenigingen die een voorlopige erkenning als bedoeld in
      [artikel 2.24][ref2] hebben verkregen, gezamenlijk;

      c. de verzorging van het media-aanbod van de NOS;

      d. de verzorging van het media-aanbod van de NPS;

      e. de verzorging van het media-aanbod van de educatieve media-instelling die een erkenning als bedoeld in
      [artikel 2.28][ref3] heeft verkregen;

      f. de verzorging van het media-aanbod van de op grond van [artikel 2.42][ref4] aangewezen kerkgenootschappen en
      genootschappen op geestelijke grondslag gezamenlijk;

      g. de uitvoering van de taken en werkzaamheden van de NPO; en

      h. de versterking van het media-aanbod van de landelijke publieke mediadienst.

      Onze Minister stelt het budget, bedoeld in de eerste volzin, onderdeel d, niet hoger vast dan het gemiddelde budget
      dat met toepassing van [artikel 2.152][ref5] voor een omroepvereniging kan worden vastgesteld.

      2 Onze Minister stelt de budgetten vast op tachtig procent van de overeenkomstige budgetten van het voorgaande jaar
      als de NPO de begroting niet volgens de daarvoor geldende regels heeft ingediend.


