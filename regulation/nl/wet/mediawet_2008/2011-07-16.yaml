  - number: '2.154'
    text: |-
      1 De raad van bestuur kan ten hoogste vijftien procent van het voor een instelling vastgestelde bedrag inhouden
      als:

      a. de desbetreffende instelling inbreuk heeft gemaakt op bindende besluiten van de raad van bestuur; of

      b. een omroepvereniging of de educatieve media-instelling naar de mening van de raad van bestuur onvoldoende
      uitvoering geeft aan de bereidheid tot samenwerking ten behoeve van de landelijke publieke mediadienst.

      2 Ingehouden bedragen worden toegevoegd aan het budget, bedoeld in [artikel 2.149, eerste lid, onderdeel h][ref1].


