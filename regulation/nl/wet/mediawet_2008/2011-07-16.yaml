  - number: '2.150'
    text: |-
      1 Het budget, bedoeld in [artikel 2.149, eerste lid, onderdeel h][ref1], bedraagt dertig procent van het totaal van
      de budgetten, bedoeld in [artikel 2.149, eerste lid, onderdelen a tot en met e][ref2].

      2 Onder versterking van het media-aanbod wordt verstaan de bevordering van de pluriformiteit van het media-aanbod.

      3 Het budget komt geheel ten goede aan media-aanbod van de omroepverenigingen, de educatieve media-instelling, de
