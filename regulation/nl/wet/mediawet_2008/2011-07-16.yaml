  - number: 3.29a
    text: |-
      In deze titel wordt onder commerciële mediadienst op aanvraag verstaan: mediadienst op aanvraag die door een
      commerciële media-instelling wordt verzorgd en waarbij het media-aanbod betrekking heeft op producten met bewegende
      beeldinhoud al dan niet mede met geluidsinhoud. Daaronder worden ook begrepen bijbehorende ondertitelingsdiensten
      en elektronische programmagidsen.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel3.29a
  - number: 3.29b
    text: |-
      1 Een media-instelling die een commerciële mediadienst op aanvraag verzorgt of beëindigt, meldt het moment van de
      aanvang of de beëindiging van de mediadienst op aanvraag binnen twee weken na dat moment aan het Commissariaat. Als
      een media-instelling een door een derde aangeleverde commerciële mediadienst op aanvraag wijzigt, meldt deze media-
      instelling eveneens de gewijzigde commerciële mediadienst op aanvraag. De volgende gegevens van de media-instelling
      worden daarbij in elk geval verstrekt:

      a. naam;

      b. plaats van vestiging; en

      c. contactgegevens waaronder e-mailadres of internetadres.

      2 Een media-instelling die een commerciële mediadienst op aanvraag verzorgt, stelt eveneens via haar media-aanbod
      ten minste de gegevens, bedoeld in het eerste lid, gemakkelijk, rechtstreeks en permanent beschikbaar, alsmede de
      naam van het Commissariaat als het orgaan dat is belast met het toezicht op de naleving van het bepaalde bij of
      krachtens deze titel.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel3.29b
  - number: 3.29c
    text: |-
      Een media-instelling die een commerciële mediadienst op aanvraag verzorgt, bevordert de vervaardiging en de toegang
      tot Europese producties in de zin van artikel 1 van de Europese richtlijn.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel3.29c
  - number: 3.29d
    text: |-
      Op commerciële mediadiensten op aanvraag zijn de [artikelen 3.5][ref1], [3.5a][ref2], [3.6][ref3],
      [3.7, tweede lid, aanhef en onder a][ref4], [3.15 tot en met 3.19c][ref5] en [3.26][ref6] van overeenkomstige
      toepassing met uitzondering van de [artikelen 3.16, vierde lid][ref7], en [3.19b, derde lid, onderdeel b][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3.5
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel3.5a
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel3.6
