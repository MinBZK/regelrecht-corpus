  - number: '6.9'
    text: |-
      1 Het Commissariaat kan aan natuurlijke of rechtspersonen toestemming verlenen voor het via een omroepzender
      verzorgen van een omroepdienst voor een bijzonder doel en met een beperkt bereik of van beperkte duur.

      2 Het Commissariaat kan aan een toestemming voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel6.9
  - number: '6.10'
    text: |-
      1 De aanbieder van een omroepzender of een omroepnetwerk verspreidt geen programma-aanbod als de instelling die
      verantwoordelijk is voor vorm en inhoud van het desbetreffende programma-aanbod, krachtens deze wet of krachtens
      de op die instelling van toepassing zijnde buitenlandse regelgeving niet gerechtigd is voor verspreiding bestemd
      programma-aanbod te verzorgen.

      2

      3
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel6.10
  - number: '6.11'
    text: |-
      1 Het is de aanbieder van een omroepzender of een omroepnetwerk toegestaan via de omroepzender of het
      omroepnetwerk:

      a. programma-aanbod te verspreiden dat bestaat uit een onverkorte en rechtstreekse weergave van een openbare
      vergadering van de Eerste of Tweede Kamer der Staten-Generaal, van Provinciale Staten of van een gemeenteraad; en

      b. informatie over het via de omroepzender of het omroepnetwerk aangeboden programma-aanbod en diensten te
      verspreiden.

      2 [Hoofdstuk 4][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel6.11
    references:
      - id: ref1
        bwb_id: BWBR0025028
        hoofdstuk: '4'
  - number: '6.12'
    text: |-
      Deze paragraaf is van toepassing als omroepnetwerken voor een significant aantal eindgebruikers in Nederland het
      belangrijkste middel zijn om programma-aanbod te ontvangen.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel6.12
  - number: '6.13'
    text: |-
      1 Als een significant aantal aangeslotenen op een omroepnetwerk programma-aanbod op analoge wijze ontvangt,
      verspreidt de aanbieder van dat omroepnetwerk naar die aangeslotenen in ieder geval ongewijzigd en vrij
      toegankelijk programma-aanbod op ten minste vijftien omroepnetten voor televisie en op ten minste vijfentwintig
      omroepnetten voor radio, waaronder:

      a. het programma-aanbod van de landelijke publieke mediadienst op drie algemene televisieprogrammakanalen en vijf
      algemene radioprogrammakanalen;

      b. het in [artikel 2.70][ref1] bedoelde programma-aanbod van de regionale publieke mediadienst dat bestemd is voor
      de provincie of deel van de provincie waarbinnen het omroepnetwerk zich bevindt op één omroepnet voor televisie en
      één omroepnet voor radio;

      c. het in [artikel 2.70][ref2] bedoelde programma-aanbod van de lokale publieke mediadienst dat bestemd is voor de
      gemeente waarbinnen het omroepnetwerk zich bevindt op één omroepnet voor televisie en één omroepnet voor radio;

      d. het programma-aanbod van twee televisieprogrammakanalen en twee radioprogrammakanalen van de Nederlandstalige
      landelijke Belgische openbare omroepdienst; en

      e. ander programma-aanbod dan bedoeld in onderdeel c, dat een lokale publieke media-instelling verzorgt en
      dat gericht is op specifieke bevolkings- en leeftijdsgroepen, waaronder minderheden, met dien verstande dat
      deze verplichting beperkt is tot het programma-aanbod op ten hoogste twee omroepnetten voor televisie en vijf
      omroepnetten voor radio.

      2 Als een significant aantal aangeslotenen op een omroepnetwerk programma-aanbod op digitale wijze ontvangt,
      verspreidt de aanbieder van dat omroepnetwerk naar die aangeslotenen in ieder geval ongewijzigd:

      a. het programma-aanbod, bedoeld in het eerste lid; en

      b. het in [artikel 2.70][ref3] bedoelde programma-aanbod van een regionale publieke mediadienst dat bestemd is voor
      een provincie of deel van een provincie aangrenzend aan de provincie waarbinnen het omroepnetwerk zich bevindt op
      één omroepnet voor televisie.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.70
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.70
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel2.70
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel6.13
