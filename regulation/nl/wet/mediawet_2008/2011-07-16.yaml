  - number: '2.34'
    text: |-
      1 De omroepverenigingen en de educatieve media-instelling zijn verplicht gedurende de erkenningperiode media-aanbod
      te verzorgen, waaronder in elk geval radio- en televisieprogramma’s.

      2 Het media-aanbod van een omroepvereniging weerspiegelt de identiteit en missie van die vereniging zoals die in de
      statuten zijn omschreven.

      3 Het media-aanbod van de educatieve media-instelling is geheel educatief van aard.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.34
  - number: 2.34a
    text: |-
      1 De Nederlandse Omroep Stichting heeft tot taak media-aanbod voor de landelijke publieke mediadienst te verzorgen
      op het gebied van nieuws, sport en evenementen dat zich bij uitstek leent voor gezamenlijke verzorging, waaronder
      media-aanbod dat:

      a. een hoge frequentie en vaste regelmaat van verspreiding vereist;

      b. een algemeen dienstverlenend karakter draagt; of

      c. met een doelmatiger inzet van middelen beter gezamenlijk tot stand kan worden gebracht.

      2 De NOS verzorgt teletekst voor de landelijke publieke mediadienst.

      3 Bij algemene maatregel van bestuur kan worden bepaald welk media-aanbod als bedoeld in het eerste lid in ieder
      geval door de NOS wordt verzorgd.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.34a
  - number: 2.34b
    text: De organen van de NOS zijn een raad van toezicht en een directie.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.34b
  - number: 2.34c
    text: |-
      1 De raad van toezicht van de NOS bestaat uit vijf of zeven leden die op voordracht van de raad van toezicht door
      Onze Minister worden benoemd en die door Onze Minister kunnen worden geschorst en ontslagen.

      2 De raad van toezicht wijst uit zijn midden de voorzitter aan.

      3 Benoeming geschiedt voor een periode van vier jaar en herbenoeming voor een aansluitende periode is eenmaal
      mogelijk.

      4 De raad van toezicht wordt zodanig samengesteld dat bestuurlijke ervaring en deskundigheid op de terreinen die
      relevant zijn voor het media-aanbod dat de NOS verzorgt, aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.34c
  - number: 2.34d
    text: |-
      1 Het lidmaatschap van de raad van toezicht van de NOS is onverenigbaar met:

      a. de functie van lid van de directie van de NOS;

      b. het lidmaatschap van een orgaan van of een dienstbetrekking bij de NPO of een landelijke publieke media-
      instelling;

      c. het lidmaatschap van een orgaan van of een dienstbetrekking bij een commerciële media-instelling;

      d. het lidmaatschap van een van beide Kamers der Staten-Generaal, een provinciaal bestuur of een gemeentebestuur;

      e. een dienstbetrekking bij een ministerie of bij een dienst, instelling of bedrijf direct vallende onder de
      verantwoordelijkheid van een minister; en

      f. het hebben van financiële of andere belangen bij bedrijven of instellingen en het vervullen van nevenfuncties
      waardoor een goede vervulling van de functie of de handhaving van de onafhankelijkheid van het betrokken lid of van
      het vertrouwen daarin in het geding kan zijn.

      2 Schorsing en ontslag zijn mogelijk wegens:

      a. ongeschiktheid;

      b. disfunctioneren; en

      c. onverenigbaarheid als bedoeld in het eerste lid.

      3 Ontslag is verder mogelijk op eigen verzoek.

      4 De leden van de raad van toezicht kunnen gezamenlijk worden ontslagen, als bij de evaluatie bedoeld, in
      [artikel 2.184, derde lid][ref1], is vastgesteld dat de NOS onvoldoende heeft bijgedragen aan de uitvoering van de
      publieke mediaopdracht op landelijk niveau door de wijze waarop zij uitvoering heeft gegeven aan de publieke taak,
      bedoeld in [artikel 2.34a][ref2]. In geval van een ontslag als bedoeld in de eerste volzin benoemt Onze Minister de
      leden van de nieuwe raad van toezicht.

      5 De leden van de raad van toezicht ontvangen van de NOS een door Onze Minister vast te stellen vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.184
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.34a
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.34d
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.184'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0025028
        artikel: 2.34a
        hoofdstuk: '2'
        afdeling: 2.2.2a
  - number: 2.34e
    text: |-
      1 De raad van toezicht houdt toezicht op het beleid van de directie en op de algemene gang van zaken binnen de NOS
      en de pluriformiteit van het media-aanbod van de NOS en staat de directie met advies terzijde.

      2 Bij de vervulling van hun taak richten de leden van de raad van toezicht zich naar het algemene belang van de
      NOS.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.34e
  - number: 2.34f
    text: |-
      1 De directie van de NOS bestaat uit ten hoogste drie leden die worden benoemd, geschorst en ontslagen door de raad
      van toezicht.

      2 [Artikel 2.34d, eerste lid, onderdelen b tot en met f][ref1], is van overeenkomstige toepassing op de leden van
      de directie.

      3 De directieleden zijn in dienst van de NOS. De raad van toezicht stelt hun arbeidsvoorwaarden vast.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.34d
