  - number: '2.185'
    text: |-
      1 Voor de evaluatie stellen de NPO en de Wereldomroep elk een commissie in voor de duur van de evaluatie, met de
      volgende samenstelling:

      a. de evaluatiecommissie van de NPO bestaat uit ten minste vijf onafhankelijke deskundigen en is zoveel mogelijk
      representatief voor het kijk- en luisterpubliek; en

      b. de evaluatiecommissie van de Wereldomroep bestaat uit ten minste drie onafhankelijke deskundigen.

      2 De leden van de evaluatiecommissie van de NPO worden op voordracht van de raad van bestuur benoemd door de raad
      van toezicht, gehoord Onze Minister.

      3 De leden van de evaluatiecommissie van de Wereldomroep worden op voordracht van de directie benoemd door de raad
      van toezicht van de Wereldomroep, gehoord Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.185
  - number: '2.186'
    text: |-
      1 De evaluatiecommissie van de NPO rapporteert in elk geval over:

      a. de wijze waarop de NPO en de landelijke publieke media-instellingen zowel gezamenlijk als afzonderlijk
      uitvoering hebben gegeven aan de publieke mediaopdracht op landelijk niveau;

      b. de mate waarin het media-aanbod van de landelijke publieke mediadienst tegemoet komt aan de interesses en
      inzichten van het algemene publiek en van specifieke bevolkings- en leeftijdsgroepen;

      c. de wijze waarop de omroepverenigingen waaraan een voorlopige erkenning als bedoeld in [artikel 2.24][ref1]
      is verleend, een bijdrage hebben geleverd aan de vergroting van de verscheidenheid van het media-aanbod van de
      landelijke publieke mediadienst en daarmee een vernieuwende bijdrage hebben geleverd aan de uitvoering van de
      publieke mediaopdracht op landelijk niveau; en

      d. andere onderwerpen die zijn opgenomen in het besluit tot instelling van de evaluatiecommissie of die door Onze
      Minister zijn aangegeven.

      2 De evaluatiecommissie van de Wereldomroep rapporteert in elk geval over:

      a. de wijze waarop de Wereldomroep uitvoering heeft gegeven aan de publieke mediaopdracht;

      b. de mate waarin het media-aanbod van de Wereldomroep voldoet aan de doelstellingen, bedoeld in
      [artikel 2.72][ref2]; en

      c. andere onderwerpen die zijn opgenomen in het besluit tot instelling van de evaluatiecommissie of die door Onze
      Minister zijn aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.24
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.72
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.186
    references:
      - id: ref1
