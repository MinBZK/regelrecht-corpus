  - number: '7.18'
    text: |-
      1 De publieke en commerciële media-instellingen, alsmede politieke partijen en de overheid bewaren gedurende
      twee weken na de uitzending opnamen van het door hen verzorgde programma-aanbod en stellen deze desgevraagd ter
      beschikking van het Commissariaat.

      2 Een media-instelling die een mediadienst op aanvraag verzorgt, bewaart haar media-aanbod nog gedurende twee weken
      vanaf het moment dat het aanbod niet meer op aanvraag kan worden afgenomen en stelt het desgevraagd ter beschikking
      van het Commissariaat.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel7.18
  - number: '7.19'
    text: |-
      1 De in [artikel 7.11, tweede lid][ref1], bedoelde toezichthouders zijn bevoegd:

      a. met medeneming van de benodigde apparatuur, een woning binnen te treden zonder toestemming van de bewoner; en

      b. bedrijfsruimten en voorwerpen te verzegelen gedurende de tijd gelegen tussen 18.00 uur en 08.00 uur voor zover
      dat voor de uitoefening van de in [artikel 5:17 van de Algemene wet bestuursrecht][ref2] genoemde bevoegdheden
      redelijkerwijs nodig is.

      2 De toezichthouders oefenen de in het eerste lid genoemde bevoegdheden zo nodig uit met behulp van de sterke arm.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel7.11
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel517
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel7.19
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '7.11'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 5:17
  - number: '7.20'
    text: |-
      1 Het Commissariaat stelt jaarlijks vóór 1 november Onze Minister in kennis van het voorgenomen handhavingsbeleid
      in het volgende kalenderjaar.

      2 Het Commissariaat oefent geen voorafgaand toezicht uit op de inhoud van media-aanbod.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel7.20
  - number: '8.1'
    text: |-
      1 Er is een Stimuleringsfonds voor de pers.

      2 Het Stimuleringsfonds heeft rechtspersoonlijkheid en is gevestigd in de gemeente ’s-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel8.1
  - number: '8.2'
    text: |-
      1 In dit hoofdstuk word verstaan onder:

        - *Stimuleringsfonds:* Stimuleringsfonds voor de pers.

      2 Op het Stimuleringsfonds is de [Kaderwet zelfstandige bestuursorganen][ref1] van toepassing met uitzondering
      van [artikel 22][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020495
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel22
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0020495
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '22'
  - number: '8.3'
    text: |-
      1 Het Stimuleringsfonds heeft tot doel het handhaven en bevorderen van de pluriformiteit van de pers, voor zover
      die van belang is voor de informatie en opinievorming.

      2 Het Stimuleringsfonds is belast met:

      a. het verstrekken van subsidies;

      b. het verrichten of doen verrichten van onderzoek met betrekking tot het functioneren van de pers; en

      c. de uitvoering van overige taken die hem zijn opgedragen bij of krachtens deze wet en andere wetten.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel8.3
  - number: '8.4'
    text: |-
      1 Het Stimuleringsfonds heeft een bestuur dat bestaat uit een voorzitter en zes andere leden.

      2 Een benoeming geschiedt voor vijf jaar en herbenoeming voor een aansluitende periode is eenmaal mogelijk.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel8.4
  - number: '8.5'
    text: |-
      Onverminderd [artikel 13 van de Kaderwet zelfstandige bestuursorganen][ref1] zijn met het lidmaatschap van het
      bestuur van het Stimuleringsfonds onverenigbaar:

      a. het lidmaatschap van een van beide Kamers der Staten-Generaal, een provinciaal bestuur of een gemeentebestuur;

      b. een dienstbetrekking bij een ministerie, een dienst, instelling of bedrijf vallende onder de
      verantwoordelijkheid van een minister; en

      c. het lidmaatschap van een orgaan van of een dienstbetrekking bij de NPO, een publieke media-instelling, een
      commerciële media-instelling of een uitgever van een persorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel13
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel8.5
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '13'
  - number: '8.6'
    text: |-
      1 Het Stimuleringsfonds neemt besluiten bij meerderheid van stemmen.

      2 Het Stimuleringsfonds kan slechts met instemming van alle leden aan één of meer van zijn leden mandaat en
      machtiging verlenen voor het uitvoeren van delen van zijn taak.

      3 Het Stimuleringsfonds stelt inzake zijn besluitvorming en werkwijze een bestuursreglement vast.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel8.6
  - number: '8.7'
    text: |-
      Onze Minister vergoedt uit de in [artikel 8.8][ref1] bedoelde inkomsten en uit andere beschikbare financiële
      middelen de kosten van het Stimuleringsfonds op basis van de door hem goedgekeurde begroting.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel8.8
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel8.7
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '8.8'
        hoofdstuk: '8'
  - number: '8.8'
    text: |-
      1 Bij ministeriële regeling:

      a. kan worden bepaald welk percentage, dat ten hoogste vier procent bedraagt, van de inkomsten uit reclame- en
      telewinkelboodschappen van onderscheidenlijk de landelijke, regionale en lokale publieke mediadiensten en de
      commerciële media-instellingen jaarlijks wordt uitgekeerd ten behoeve van het Stimuleringsfonds voor de pers; en

      b. kunnen regels worden gesteld over de vaststelling van de in onderdeel a bedoelde inkomsten.

      2 Regionale en lokale publieke media-instellingen en commerciële media-instellingen voldoen jaarlijks het met
      toepassing van het eerste lid vastgestelde bedrag aan het Commissariaat, dat het ter beschikking stelt aan Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel8.8
  - number: '8.9'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de inrichting van de begroting, het financieel verslag
      en aandachtspunten voor de accountantscontrole.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel8.9
  - number: '8.10'
    text: |-
      1 Het Stimuleringsfonds kan binnen de door Onze Minister beschikbaar gestelde bedragen subsidie verstrekken op
      grond van deze titel.

      2 Subsidie wordt alleen verstrekt ten behoeve van persorganen die voldoen aan de volgende voorwaarden:

      a. zij worden in Nederland uitgegeven en zijn bestemd voor het publiek in Nederland;

      b. zij bevatten in belangrijke mate nieuws, analyse, commentaar en achtergrondinformatie over een gevarieerd deel
      van de maatschappelijke actualiteit, mede in het belang van politieke meningsvorming;

      c. zij worden geredigeerd door een zelfstandige redactie op basis van een statuut waarin de redactionele identiteit
      is neergelegd;

      d. zij verschijnen regelmatig en ten minste maandelijks;

      e. zij zijn voor iedereen verkrijgbaar;

      f. zij worden verkrijgbaar gesteld tegen betaling;

      g. zij worden niet uitgegeven door of vanwege de overheid; en

      h. zij worden niet uitgegeven of verspreid in samenhang met het lidmaatschap, donateurschap of deelnemerschap van
      een vereniging, kerkgenootschap of andere organisatie.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel8.10
  - number: '8.11'
    text: |-
      1 Het Stimuleringsfonds kan ten behoeve van een persorgaan aan de uitgever daarvan subsidie verstrekken in de vorm
      van kredieten of kredietfaciliteiten voor de uitvoering van een project dat gericht is op een rendabele exploitatie
      van het persorgaan.

      2 Subsidie wordt alleen verstrekt als:

      a. de continuïteit van het persorgaan in gevaar is;

      b. de noodzakelijke financiële middelen niet of niet afdoende op andere wijze kunnen worden verkregen;

      c. het project wordt uitgevoerd volgens een activiteitenplan dat uitzicht biedt op een rendabele exploitatie van
      het persorgaan binnen een redelijke periode; en

      d. het activiteitenplan door het Stimuleringsfonds is goedgekeurd.

      3 Uitsluitend ten behoeve van een eenmalige reorganisatie van een persorgaan kan de subsidie worden verstrekt in
      de vorm van een uitkering als het activiteitenplan niet op doeltreffende wijze kan worden uitgevoerd met kredieten
      of kredietfaciliteiten.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel8.11
  - number: '8.12'
    text: |-
      1 Het Stimuleringsfonds kan ten behoeve van het starten van de exploitatie van een persorgaan aan de uitgever
      daarvan subsidie verstrekken in de vorm van kredieten of kredietfaciliteiten.

      2 Subsidie wordt alleen verstrekt als:

      a. het persorgaan ten minste zes keer per week verschijnt;

      b. het starten van de exploitatie zonder subsidie niet mogelijk is;

      c. het starten van de exploitatie plaatsvindt volgens een activiteitenplan dat uitzicht biedt op een rendabele
      exploitatie binnen een redelijke periode; en

      d. het activiteitenplan door het Stimuleringsfonds is goedgekeurd.

      3 Subsidie kan worden verstrekt tot ten hoogste de helft van de in het activiteitenplan begrote kosten die zijn
      berekend volgens door het Stimuleringsfonds vast te stellen richtlijnen over een periode van ten hoogste vier jaar
      vanaf de start van de exploitatie.

      4 Als de werkelijke exploitatietekorten lager zijn dan de voorziene exploitatiekosten kan de subsidie lager worden
      vastgesteld tot ten hoogste vijfentwintig procent van de werkelijke exploitatietekorten.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel8.12
  - number: '8.13'
    text: |-
      1 Het Stimuleringsfonds kan ten behoeve van twee of meer persorganen gezamenlijk aan de uitgever of uitgevers
      daarvan subsidie verstrekken voor de uitvoering van een project gericht op het verbeteren van de exploitatiepositie
      van die persorganen.

      2 Subsidie wordt alleen verstrekt als:

      a. het project wordt uitgevoerd volgens een activiteitenplan dat door de verantwoordelijke uitgever of door de
      verantwoordelijke uitgevers gezamenlijk is opgesteld en dat uitzicht biedt op een structurele verbetering van de
      exploitatiepositie van de persorganen binnen een redelijke termijn;

      b. het project past in de doelstellingen van het Stimuleringsfonds; en

      c. het activiteitenplan door het Stimuleringsfonds is goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel8.13
  - number: '8.14'
    text: |-
      1 Het Stimuleringsfonds kan voor het verrichten van organisatieonderzoek dat gericht is op structurele verbetering
      van de exploitatiepositie van een persorgaan aan de uitgever daarvan subsidie verstrekken.

      2 Subsidie wordt alleen verstrekt als:

      a. de exploitatie in het boekjaar voorafgaand aan de aanvraag van de subsidie verliesgevend is geweest of dreigde
      te worden;

      b. door de uitgever een voorstel is ingediend dat de opzet en uitvoering van het onderzoek bevat;

      c. het voorgestelde onderzoek past in de doelstellingen van het Stimuleringsfonds; en

      d. het voorstel voor het onderzoek door het Stimuleringsfonds is goedgekeurd.

      3 Subsidie kan worden verstrekt tot ten hoogste tweederde deel van de kosten van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel8.14
  - number: '8.15'
    text: |-
      1 Het Stimuleringsfonds kan subsidie verstrekken voor het verrichten van onderzoek ten behoeve van de
      persbedrijfstak als geheel.

      2 Subsidie wordt alleen verstrekt als:

      a. een voorstel is ingediend dat de opzet en uitvoering van het onderzoek bevat;

      b. het voorgestelde onderzoek betrekking heeft op de bedrijfstak als geheel en past in de doelstellingen van het
      Stimuleringsfonds; en

      c. het voorstel voor het onderzoek is goedgekeurd door het Stimuleringsfonds.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel8.15
  - number: '8.16'
    text: |-
      1 Het Stimuleringsfonds kan ieder jaar subsidieplafonds vaststellen voor de verschillende activiteiten waarvoor
      subsidie kan worden verstrekt.

      2 Een besluit tot vaststelling van een subsidieplafond wordt in de Staatscourant bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel8.16
  - number: '8.17'
    text: |-
      1 Subsidies worden verstrekt op aanvraag.

      2 Het Stimuleringsfonds kan een aanvraag voorleggen aan een externe adviesinstantie.

      3 Het Stimuleringsfonds waarborgt dat vertrouwelijke gegevens betreffende de bedrijfsvoering van de aanvrager als
      zodanig behandeld worden.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel8.17
  - number: '8.18'
    text: |-
      Verplichtingen die het Stimuleringsfonds aan een subsidieontvanger oplegt hebben geen betrekking op de inhoud van
      een persorgaan.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel8.18
  - number: '8.19'
    text: |-
      Het Stimuleringsfonds maakt een besluit tot verlening van een subsidie binnen een week nadat het besluit is genomen
      bekend in de Staatscourant, met vermelding van de hoogte van de subsidie.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel8.19
  - number: '8.20'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over:

      a. de nadere voorwaarden voor het verkrijgen van subsidie;

      b. de verplichtingen die het Stimuleringsfonds bij de subsidieverstrekking kan opleggen;

      c. de indiening en wijze van behandeling van aanvragen;

      d. de hoogte van subsidies en de wijze van berekening daarvan;

      e. de wijze waarop de beschikbare financiële middelen voor de verschillende subsidies worden verdeeld als een
      subsidieplafond is vastgesteld;

      f. de verstrekking van voorschotten; en

      g. de intrekking, wijziging en terugvordering van subsidies.

      2 Voorwaarden als bedoeld in het eerste lid, onderdeel a, hebben geen betrekking op de inhoud van een persorgaan.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel8.20
  - number: '8.21'
    text: |-
      1 Met het toezicht op de naleving van de bepalingen en voorschriften die op grond van dit hoofdstuk gelden voor
      subsidieontvangers zijn belast de leden van het Stimuleringsfonds en de bij besluit van het Stimuleringsfonds
      aangewezen medewerkers van het Stimuleringsfonds.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel8.21
  - number: '9.1'
    text: |-
      In afwijking van [artikel 2.144, eerste lid, tweede volzin][ref1], bedraagt de vermeerdering van de
      rijksmediabijdrage:

      a. € 49,799 miljoen voor het jaar 2008;

      b. € 48,387 miljoen voor het jaar 2009;

      c. € 47,985 miljoen voor het jaar 2010.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.144
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.144'
        hoofdstuk: '2'
        afdeling: 2.6.1
  - number: '9.2'
    text: |-
      De [artikelen 2.94, tweede lid, onderdeel b][ref1], en [3.7, tweede lid, onderdeel b][ref2], zijn tot één
      jaar na het tijdstip waarop deze wet in werking treedt niet van toepassing op de verspreiding van reclame- en
      telewinkelboodschappen ter uitvoering van overeenkomsten met adverteerders die zijn aangegaan vóór het tijdstip van
      inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.94
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel3.7
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.94'
        hoofdstuk: '2'
        paragraaf: 2.5.2.2
        afdeling: 2.5.2
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '3.7'
        hoofdstuk: '3'
        afdeling: 3.2.2
  - number: '9.3'
    text: |-
      [Hoofdstuk VII van de Mediawet][ref1] zoals [die wet][ref2] luidde op de dag voorafgaande aan het tijdstip
      waarop deze wet in werking treedt, blijft tot 1 januari 2011 van kracht, met dien verstande dat de in de
      [artikelen 89][ref3] en [90 van genoemd hoofdstuk][ref4] bedoelde gelden ter beschikking worden gesteld aan de raad
      van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#HoofdstukVII
      [ref2]: https://wetten.overheid.nl/BWBR0004149
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel89
      [ref4]: https://wetten.overheid.nl/BWBR0004149#Artikel90
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0004149
        hoofdstuk: VII
      - id: ref2
