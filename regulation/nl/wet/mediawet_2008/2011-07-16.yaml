        paragraaf: 2.3.1
  - number: '2.70'
    text: |-
      Het programma-aanbod van de regionale en lokale publieke mediadienst bestaat per programmakanaal:

      a. voor ten minste vijftig procent van de duur uit aanbod van informatieve, culturele en educatieve aard dat in het
      bijzonder betrekking heeft op de provincie respectievelijk gemeente waarvoor het aanbod bestemd is; en

      b. voor ten minste uit een bij algemene maatregel van bestuur vast te stellen percentage aanbod als bedoeld in
      onderdeel a dat door de regionale respectievelijk lokale publieke media-instelling zelf of uitsluitend in haar
      opdracht is geproduceerd.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.70
  - number: '2.71'
    text: |-
      1 Een lokale publieke media-instelling kan met de regionale publieke media-instelling in wier verzorgingsgebied zij
      werkzaam is een samenwerkingsovereenkomst sluiten.

      2 De overeenkomst wordt overgelegd aan het Commissariaat.

      3 Bij een samenwerkingsovereenkomst voor de verzorging van programma-aanbod kan in afwijking van
      [artikel 2.70][ref1] het programma-aanbod van de lokale publieke mediadienst:

      a. voor ten minste vijftig procent van de duur bestaan uit aanbod dat in het bijzonder betrekking heeft op de
      gemeente waarvoor het programma-aanbod bestemd is, of op de provincie waarbinnen die gemeente ligt; en

      b. voor ten minste het percentage, bedoeld in [artikel 2.70, onderdeel b][ref2], bestaan uit aanbod dat:

      1°. geproduceerd is door de lokale publieke media-instelling zelf;

      2°. geproduceerd is door de regionale publieke media-instelling waarmee zij de samenwerkingsovereenkomst heeft
      gesloten; of

      3°. uitsluitend in opdracht van een van hen of van hen beiden, is geproduceerd.

      4 Bij algemene maatregel van bestuur kan worden bepaald:

      a. dat een gedeelte van het aanbod, bedoeld in het derde lid, onderdeel a, in het bijzonder betrekking heeft op de
      gemeente waarvoor het programma-aanbod is bestemd; en

      b. dat een gedeelte van het aanbod, bedoeld in het derde lid, onderdeel b, door de lokale publieke media-instelling
      zelf of uitsluitend in haar opdracht is geproduceerd.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.70
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.70
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.71
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.70'
