  - number: '2.53'
    text: |-
      1 De raad van bestuur deelt de uren in.

      2 De raad van bestuur kan deze indeling herzien:

      a. als een erkenning of een voorlopige erkenning wordt ingetrokken;

      b. als de aan een instelling ter beschikking staande uren worden ingetrokken of verminderd;

      c. in het belang van de coördinatie en ordening op en tussen de verschillende programmakanalen van de programma’s;

      d. op grond van omstandigheden die niet voorzien waren ten tijde van de indeling; of

      e. naar aanleiding van een verzoek als bedoeld in [artikel 2.54, eerste lid, tweede volzin][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.54
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.53
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.54'
        hoofdstuk: '2'
        afdeling: 2.2.5
  - number: '2.54'
    text: |-
      1 Bij de indeling zorgt de raad van bestuur er voor dat tussen 16.00 uur en 24.00 uur op de algemene
      televisieprogrammakanalen en tussen 7.00 uur en 19.00 uur op de algemene radioprogrammakanalen een evenwichtige
      verdeling van de uren wordt bereikt. Indien en voor zover een of meer landelijke publieke media-instellingen daarom
      verzoeken zorgt de raad van bestuur in afwijking van de vorige volzin voor een verdeling van de uren van deze
      landelijke publieke media-instellingen tussen 7.00 uur en 24.00 uur op de algemene televisieprogrammakanalen.

      2 De raad van bestuur zorgt er in het kader van de coördinatie voor dat het media-aanbod op de aanbodkanalen van de
      landelijke publieke mediadienst past binnen de kaders van [artikel 2.1][ref1], het concessiebeleidsplan, bedoeld in
      [artikel 2.20][ref2], en de profielen van de aanbodkanalen en voldoet aan de [artikelen 2.115, eerste lid][ref3],
      [2.116][ref4] en [2.119 tot en met 2.123][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.1
