  - number: 2.34g
    text: |-
      1 De directie bestuurt de NOS.

      2 De directie is belast met de dagelijkse leiding en het financiële beheer van de NOS.

      3 De directie is verder belast met datgene wat niet uitdrukkelijk tot de taken of bevoegdheden van de raad van
      toezicht behoort.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.34g
  - number: 2.34h
    text: |-
      1 De NOS verstrekt Onze Minister desgevraagd alle inlichtingen met betrekking tot de werkzaamheden van de
      stichting.

      2 Onze Minister kan inzage verlangen in zakelijke gegevens en bescheiden van de NOS voor zover dat voor de
      vervulling van zijn taak nodig is.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.34h
  - number: 2.34i
    text: |-
      1 De NOS stelt jaarlijks vóór 1 mei een jaarverslag over het afgelopen kalenderjaar vast.

      2 In het jaarverslag wordt aandacht besteed aan de werkzaamheden van de NOS, het gevoerde beleid in het algemeen en
      de doelmatigheid en doeltreffendheid van de werkzaamheden in het bijzonder.

      3 De NOS zendt het jaarverslag aan Onze Minister en maakt het openbaar.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.34i
  - number: 2.34j
    text: |-
      1 Wijziging in de statuten van de NOS behoeven de instemming van Onze Minister.

      2 De raad van toezicht en de directie kunnen niet besluiten tot ontbinding van de NOS.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.34j
  - number: '2.35'
    text: |-
      1 De Nederlandse Programma Stichting heeft tot taak media-aanbod voor de landelijke publieke mediadienst te
      verzorgen dat voorziet in de bevrediging van in de samenleving levende maatschappelijke, culturele, godsdienstige
      of geestelijke behoeften, zodanig dat dit media-aanbod samen met het media-aanbod van de andere landelijke publieke
      media-instellingen een evenwichtig beeld oplevert van de maatschappelijke, culturele, godsdienstige en geestelijke
      verscheidenheid in Nederland.

      2 Bij algemene maatregel van bestuur kan worden bepaald welk media-aanbod als bedoeld in het eerste lid in ieder
      geval door de NPS wordt verzorgd.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.35
  - number: 2.35a
    text: De organen van de NPS zijn een raad van toezicht, een algemeen directeur en een adviesraad.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.35a
  - number: '2.36'
    text: |-
      1 De raad van toezicht van de NPS bestaat uit vijf of zeven leden die op voordracht van de raad van toezicht door
      Onze Minister worden benoemd en die door Onze Minister kunnen worden geschorst en ontslagen.

      2 De raad van toezicht wijst uit zijn midden de voorzitter aan.

      3 Benoeming geschiedt voor een periode van vier jaar en herbenoeming voor een aansluitende periode is eenmaal
      mogelijk.

      4 De raad van toezicht wordt zodanig samengesteld dat bestuurlijke ervaring en deskundigheid op de terreinen die
      relevant zijn voor het media-aanbod dat de NPS verzorgt, aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.36
  - number: '2.37'
    text: |-
      1 Het lidmaatschap van de raad van toezicht van de NPS is onverenigbaar met:

      a. de functie van algemeen directeur van de NPS;

      b. het lidmaatschap van een orgaan van of een dienstbetrekking bij de NPO of een landelijke publieke media-
      instelling;

      c. het lidmaatschap van een orgaan van of een dienstbetrekking bij een commerciële media-instelling;

      d. het lidmaatschap van een van beide Kamers der Staten-Generaal;

      e. een dienstbetrekking bij een ministerie of bij een dienst, instelling of bedrijf vallende onder de
      verantwoordelijkheid van een minister; en

      f. het hebben van financiële of andere belangen bij bedrijven of instellingen en het vervullen van nevenfuncties
      waardoor een goede vervulling van de functie of de handhaving van de onafhankelijkheid van het betrokken lid of van
      het vertrouwen daarin in het geding kan zijn.

      2 Schorsing en ontslag zijn mogelijk wegens:

      a. ongeschiktheid;

      b. disfunctioneren; en

      c. onverenigbaarheid als bedoeld in het eerste lid.

      3 Ontslag is verder mogelijk op eigen verzoek.

      4 De leden van de raad van toezicht kunnen gezamenlijk worden ontslagen, als bij de evaluatie bedoeld, in
      [artikel 2.184, derde lid][ref1], is vastgesteld dat de NPS onvoldoende heeft bijgedragen aan de uitvoering van de
      publieke mediaopdracht op landelijk niveau door de wijze waarop zij uitvoering heeft gegeven aan de publieke taak,
      bedoeld in [artikel 2.35][ref2]. In geval van een ontslag als bedoeld in de eerste volzin benoemt Onze Minister de
      leden van de nieuwe raad van toezicht.

      5 De leden van de raad van toezicht ontvangen van de NPS een door Onze Minister vast te stellen vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.184
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.35
