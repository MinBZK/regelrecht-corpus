  - number: '2.44'
    text: |-
      1 Kerkgenootschappen en genootschappen op geestelijke grondslag tonen in hun aanvragen hun representativiteit voor
      een hoofdstroming naar genoegen van het Commissariaat aan.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld over:

      a. het tijdstip en de wijze van indiening van een aanvraag;

      b. de inhoud van een aanvraag; en

      c. de termijn waarbinnen een besluit op een aanvraag wordt genomen.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.44
  - number: '2.45'
    text: |-
      1 Als meerdere aanvragers een aanvraag indienen voor een hoofdstroming bevordert het Commissariaat voor zover dat
      redelijkerwijs mogelijk is samenwerking door of samengaan van die aanvragers.

      2 Per kerkelijke of geestelijke hoofdstroming vindt slechts één aanwijzing plaats.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.45
  - number: '2.46'
    text: |-
      1 Het Commissariaat wijst een aanvraag voor een aanwijzing af als de aanvrager:

      a. niet voldoet aan de [artikelen 2.42, tweede lid][ref1], of [2.44, eerste lid][ref2]; of

      b.

      2 Het Commissariaat kan een aanvraag afwijzen als:

      a. de aanvrager niet voldoet aan de krachtens [artikel 2.44, tweede lid][ref3], gestelde eisen; of

      b. aannemelijk is dat de aanvrager zich, mede gelet op zijn handelwijze in een voorafgaande periode waarin hij is
      aangewezen, niet zal houden aan het bepaalde bij of krachtens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.42
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.44
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel2.44
