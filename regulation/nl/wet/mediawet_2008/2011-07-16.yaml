  - number: '2.175'
    text: |-
      1 De Wereldomroep kan met toestemming van het Commissariaat en onder door hem te stellen voorwaarden gelden voor de
      verzorging van media-aanbod reserveren.

      2 Het totaal van de gereserveerde gelden in een kalenderjaar bedraagt niet meer dan tien procent van het totaal van
      de ter beschikking gestelde budgetten, bedoeld in [artikel 2.163, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.163
