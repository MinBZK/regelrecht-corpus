  - number: '6.22'
    text: |-
      Deze paragraaf is niet van toepassing op de aanbieder van een omroepnetwerk aan wie het Commissariaat ontheffing
      heeft verleend op grond van [artikel 6.14, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel6.14
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel6.22
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '6.14'
        hoofdstuk: '6'
