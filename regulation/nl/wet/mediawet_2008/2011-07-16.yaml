  - number: '3.30'
    text: |-
      1 Een commerciële media-instelling is aan het Commissariaat jaarlijks kosten verbonden aan het toezicht
      verschuldigd voor elke verkregen toestemming en voor elke van haar mediadiensten op aanvraag.

      2 Bij ministeriële regeling worden regels gesteld over de vaststelling van de toezichtskosten, bedoeld in het
      eerste lid, waarbij:

      a. onderscheid kan worden gemaakt tussen omroepdiensten en mediadiensten op aanvraag;

      b. onderscheid kan worden gemaakt tussen toestemmingen voor radio-omroep en voor televisieomroep; en

      c. rekening kan worden gehouden met de gemiddelde duur van de uitzendingen en met het aantal huishoudens in
      Nederland, dat het programma-aanbod kan ontvangen.

      3 Het Commissariaat kan de verschuldigde toezichtskosten invorderen bij dwangbevel.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel3.30
  - number: '4.1'
    text: |-
      1 Het televisieprogramma-aanbod van de publieke mediadiensten en van commerciële mediadiensten bevat geen aanbod
      dat de lichamelijke, geestelijke of zedelijke ontwikkeling van personen jonger dan zestien jaar ernstige schade zou
      kunnen toebrengen.

      2 Het televisieprogramma-aanbod van de publieke mediadiensten en van commerciële mediadiensten mag alleen dan
      aanbod bevatten dat schade kan toebrengen aan de lichamelijke, geestelijke of zedelijke ontwikkeling van personen
      jonger dan zestien jaar, als de instelling die verantwoordelijk is voor de inhoud van het aanbod is aangesloten bij
      de door Onze Minister erkende organisatie, bedoeld in [artikel 4.2, eerste lid][ref1], en ter zake gebonden is aan
      de regels en het toezicht daarop van die organisatie met betrekking tot het verspreiden van het hiervoor bedoelde
      aanbod.

      3 De instelling die is aangesloten toont dit aan door een schriftelijke verklaring van de erkende organisatie aan
      het Commissariaat over te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel4.2
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '4.2'
        hoofdstuk: '4'
  - number: '4.2'
    text: |-
      1 Onze Minister kan een organisatie erkennen die voorziet in regelingen omtrent classificatie en het verspreiden
      van aanbod als bedoeld in [artikel 4.1, tweede lid][ref1], en het toezicht daarop.

      2 De regelingen hebben in ieder geval betrekking op:

      a. criteria voor de classificatie van aanbod, waaronder in ieder geval de mate waarin:

      1°. angst wordt opgewekt;

      2°. brutaliserend geweld wordt vertoond of gerechtvaardigd;

      3°. het gebruik van drugs aantrekkelijk wordt voorgesteld of vergoelijkt;

      4°. sprake is van pornografie; en

      5°. op andere gronden volgens algemeen geldende opvattingen producten niet geschikt zijn voor vertoning aan
      bepaalde categorieën personen jonger dan zestien jaar;

      b. de tijdstippen van verspreiding van het hiervoor bedoelde aanbod; en

      c. de wijze waarop de verspreiding van dit aanbod wordt voorafgegaan door of is voorzien van symbolen of
      waarschuwingen.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel4.1
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '4.1'
        hoofdstuk: '4'
  - number: '4.3'
    text: |-
      1 Een organisatie komt slechts voor erkenning in aanmerking als:

      a. onafhankelijk toezicht door de organisatie op de naleving van de regelingen, bedoeld in
      [artikel 4.2 , eerste lid][ref1], is gewaarborgd;

      b. voorzien is in voldoende betrokkenheid van belanghebbenden, onder wie in ieder geval vertegenwoordigers uit de
      consumentensfeer, publieke media-instellingen, deskundigen op het gebied van de audiovisuele media en producenten
      van audiovisuele media; en

      c. de financiële positie van de organisatie een adequate uitvoering van de werkzaamheden waarborgt.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de eisen bedoeld in het
      eerste lid en kunnen andere eisen voor erkenning worden gesteld.

      3 Aan een erkenning kunnen voorschriften worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel4.2
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '4.2'
        hoofdstuk: '4'
  - number: '4.4'
    text: |-
      1 Onze Minister trekt een erkenning in als de erkende organisatie niet meer voldoet aan de [artikelen 4.2][ref1]
      en [4.3, eerste lid][ref2].

      2 Onze Minister kan een erkenning intrekken als de erkende organisatie niet voldoet aan de nadere regels en andere
      eisen, bedoeld in [artikel 4.3, tweede lid][ref3], of de voorschriften, bedoeld in [artikel 4.3, derde lid][ref4].


