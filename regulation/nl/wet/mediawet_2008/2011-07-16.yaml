  - number: '9.6'
    text: |-
      Bij algemene maatregel van bestuur kunnen tot twee jaar na het tijdstip waarop deze wet in werking treedt, in
      gevallen waarin deze wet niet voorziet, regels worden gesteld met betrekking tot de invoering van artikelen van
      deze wet of onderdelen daarvan.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel9.6
  - number: '9.15'
    text: |-
      De voordracht voor een krachtens de [artikelen 2.21a][ref1], [2.34a][ref2], [2.116][ref3] of [2.136][ref4] vast te
      stellen algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers
      der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.21a
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.34a
