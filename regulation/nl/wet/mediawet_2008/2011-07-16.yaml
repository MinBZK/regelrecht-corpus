  - number: '2.48'
    text: |-
      1 Onze Minister stelt jaarlijks op advies van het Commissariaat en de NPO de totale hoeveelheid uren vast
      die op de algemene programmakanalen van de landelijke publieke mediadienst beschikbaar zijn voor aangewezen
      kerkgenootschappen en genootschappen op geestelijke grondslag.

      2 Het Commissariaat kan in bijzondere gevallen of voor bijzondere doelen extra uren vaststellen en toewijzen. Deze
      extra uren geven geen aanspraak op een vergoeding boven de vergoeding, bedoeld in [artikel 2.153][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.153
