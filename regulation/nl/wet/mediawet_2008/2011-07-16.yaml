        paragraaf: 2.3.2
  - number: '2.72'
    text: |-
      De taak van de Stichting Radio Nederland Wereldomroep is het uitvoeren van de publieke mediaopdracht, bedoeld in
      [artikel 2.1, eerste lid, onderdeel b][ref1], door:

      a. het informeren van Nederlandstaligen in het buitenland;

      b. het voorzien in onafhankelijke informatie in landen met een informatieachterstand;

      c. het verspreiden van een realistisch beeld van Nederland in het buitenland; en

      d. het verrichten van alle activiteiten die daarvoor nodig of ondersteunend zijn, waaronder het oprichten van of
      deelnemen in organisaties en rechtspersonen.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.72
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.1'
        hoofdstuk: '2'
  - number: '2.73'
    text: De organen van de Wereldomroep zijn een raad van toezicht, een directie en een adviesraad.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.73
  - number: '2.74'
    text: |-
      1 De raad van toezicht bestaat uit zeven leden die door Onze Minister worden benoemd, geschorst en ontslagen.

      2 Onze Minister wijst uit de leden de voorzitter aan.

      3 Benoeming geschiedt voor vier jaar en herbenoeming voor een aansluitende periode is eenmaal mogelijk.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.74
  - number: '2.75'
    text: |-
      1 Het lidmaatschap van de raad van toezicht is onverenigbaar met:

      a. het lidmaatschap van de adviesraad;

      b. het lidmaatschap van de directie;

      c. het lidmaatschap van een orgaan van of een dienstbetrekking bij een commerciële media-instelling;

      d. het lidmaatschap van een van beide Kamers der Staten-Generaal;

      e. een dienstbetrekking bij een ministerie of bij een dienst, instelling of bedrijf vallende onder de
      verantwoordelijkheid van een minister; en

      f. het hebben van financiële of andere belangen bij bedrijven of instellingen en het vervullen van nevenfuncties
      waardoor een goede vervulling van de functie of de handhaving van de onafhankelijkheid van het betrokken lid of van
      het vertrouwen daarin in het geding kan zijn.

      2 Schorsing en ontslag zijn mogelijk wegens:

      a. ongeschiktheid;

      b. disfunctioneren; en

      c. onverenigbaarheid als bedoeld in het eerste lid.

      3 Ontslag is verder mogelijk op eigen verzoek.

      4 De leden van de raad van toezicht ontvangen van de Wereldomroep een door Onze Minister vast te stellen
      vergoeding.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.75
  - number: '2.76'
    text: |-
      1 De raad van toezicht houdt toezicht op het beleid van de directie en op de algemene gang van zaken binnen de
      Wereldomroep en staat de directie met advies terzijde.

      2 Bij de vervulling van hun taak richten de leden van de raad van toezicht zich naar het algemene belang van de
      Wereldomroep.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.76
  - number: '2.77'
    text: |-
      1 De directie van de Wereldomroep bestaat uit ten hoogste drie leden die worden benoemd, geschorst en ontslagen
      door de raad van toezicht.

      2 Besluiten tot benoeming, schorsing en ontslag behoeven de instemming van Onze Minister.

      3 [Artikel 2.75, eerste lid, onderdelen a en c tot en met f][ref1], is van overeenkomstige toepassing op het
      lidmaatschap van de directie.

      4 De directieleden zijn in dienst van de Wereldomroep. De raad van toezicht stelt hun arbeidsvoorwaarden vast.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.75
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.77
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.75'
        hoofdstuk: '2'
        paragraaf: 2.4.2
  - number: '2.78'
    text: |-
      1 De directie bestuurt de Wereldomroep.

      2 De directie is belast met de dagelijkse leiding en het financiële beheer van de Wereldomroep.

      3 De directie is verder belast met datgene wat niet uitdrukkelijk tot de taken of bevoegdheden van de raad van
      toezicht behoort.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.78
  - number: '2.79'
    text: |-
      De werkwijze van de raad van toezicht en de directie wordt geregeld in de statuten en reglementen van de
      Wereldomroep.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.79
  - number: '2.80'
    text: |-
      1 De adviesraad van de Wereldomroep adviseert de raad van toezicht en de directie over de inhoud van het media-
      aanbod van de Wereldomroep.

      2 De leden van de adviesraad worden door Onze Minister benoemd, geschorst en ontslagen. Benoeming geschiedt voor
      vijf jaar en herbenoeming voor een aansluitende periode is eenmaal mogelijk.

      3 De adviesraad regelt, met instemming van de raad van toezicht, zijn eigen werkwijze.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.80
  - number: '2.81'
    text: |-
      1 De Wereldomroep is voor het gevoerde en te voeren beleid verantwoording verschuldigd aan Onze Minister.

      2 De Wereldomroep verstrekt Onze Minister desgevraagd alle inlichtingen met betrekking tot de werkzaamheden van
      de Wereldomroep.

      3 Onze Minister kan inzage verlangen in zakelijke gegevens en bescheiden van de Wereldomroep voor zover dat voor de
      vervulling van zijn taak nodig is.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.81
  - number: '2.82'
    text: |-
      1 De Wereldomroep stelt jaarlijks vóór 1 juni een jaarverslag over het afgelopen kalenderjaar vast.

      2 In het jaarverslag wordt aandacht besteed aan de werkzaamheden van de Wereldomroep, het gevoerde beleid in het
      algemeen en de doelmatigheid en doeltreffendheid van de werkzaamheden in het bijzonder.

      3 De Wereldomroep zendt het jaarverslag aan Onze Minister en maakt het openbaar.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.82
  - number: '2.83'
    text: |-
      1 Wijzigingen in de statuten van de Wereldomroep behoeven de instemming van Onze Minister.

      2 De raad van toezicht en de directie kunnen niet besluiten tot ontbinding van de Wereldomroep.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.83
  - number: '2.84'
    text: |-
      1 De Wereldomroep dient elke vijf jaar een beleidsplan voor de komende vijf jaar in bij Onze Minister.

      2 Het beleidsplan bevat in elk geval:

      a. een beschrijving van de wijze waarop de Wereldomroep in de komende vijf jaar uitvoering geeft aan zijn taken,
      tevens uitgewerkt in kwantitatieve en kwalitatieve doelstellingen voor het media-aanbod en het publieksbereik van
      de Wereldomroep;

      b. aard en aantal van de te gebruiken aanbodkanalen;

      c. een overzicht van de activiteiten in binnen- en buitenland;

      d. een overzicht van de naar verwachting benodigde organisatorische, personele, materiële en financiële middelen;
      en

      e. een beschrijving van de samenwerking met de landelijke, regionale en lokale publieke media-instellingen en
      anderen.

      3 Bij ministeriële regeling kunnen nadere regels gesteld worden over de inrichting van het beleidsplan en het
      tijdstip van indiening.

      4 De Wereldomroep maakt het beleidsplan openbaar.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.84
  - number: '2.85'
    text: |-
      1 Onze Minister vraagt de Raad voor cultuur en het Commissariaat binnen een door hem te stellen termijn te
      adviseren over het beleidsplan.

      2 Het beleidsplan behoeft de instemming van Onze Minister voor zover het betreft de onderwerpen, genoemd in
      [artikel 2.84, tweede lid, onderdelen b en c][ref1].

      3 Als de Wereldomroep wijzigingen wil aanbrengen in de door Onze Minister goedgekeurde voorstellen, neemt hij die
      op in de begroting. Het eerste en tweede lid zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.84
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.85
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.84'
        hoofdstuk: '2'
        paragraaf: 2.4.4
  - number: '2.86'
    text: |-
      1 Mede op basis van het beleidsplan sluiten Onze Minister en de Wereldomroep een prestatieovereenkomst voor de duur
      van het beleidsplan.

      2 De prestatieovereenkomst bevat afspraken over:

      a. kwalitatieve en kwantitatieve doelstellingen voor het media-aanbod en het publieksbereik van de Wereldomroep;

      b. maatregelen bij niet naleving, voor zover mogelijk en binnen het bepaalde bij of krachtens deze wet; en

      c. tussentijdse wijziging in verband met veranderende inzichten of omstandigheden.

      3 De prestatieovereenkomst heeft geen betrekking op de inhoud van het media-aanbod van de Wereldomroep.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.86
  - number: '2.87'
    text: |-
      1 De Wereldomroep verzorgt de televisieprogramma’s voor Nederlandstaligen in het buitenland in samenwerking met
      de NOS.

      2 Ten behoeve van de verzorging van radioprogramma’s voor Nederlandstaligen in het buitenland door de Wereldomroep
      vindt samenwerking met de NOS plaats.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.87
  - number: '2.88'
    text: |-
      1 De publieke media-instellingen bepalen, onverminderd het bepaalde bij of krachtens deze wet, vorm en inhoud van
      het door hen verzorgde media-aanbod en zijn daar verantwoordelijk voor.

      2 De publieke media-instellingen, met uitzondering van de kerkgenootschappen en genootschappen op geestelijke
      grondslag, brengen in overeenstemming met hun werknemers die zijn belast met de verzorging en samenstelling van het
      media-aanbod een redactiestatuut tot stand.

      3 Het redactiestatuut bevat de journalistieke rechten en plichten van de werknemers, waaronder in elk geval:

      a. waarborgen dat normen inzake journalistieke deontologie en kwaliteit worden gehanteerd; en

      b. waarborgen voor redactionele onafhankelijkheid ten opzichte van adverteerders, sponsors en anderen die bijdragen
      hebben verstrekt voor de totstandkoming van media-aanbod.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.88
  - number: 2.88a
    text: |-
      1 Reclame- en telewinkelboodschappen en gesponsord media-aanbod zijn als zodanig herkenbaar.

      2 In reclame- en telewinkelboodschappen en gesponsord media-aanbod worden geen subliminale technieken gebruikt.

      3 Het media-aanbod bevat geen:

      a. sluikreclame; of

      b. productplaatsing.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.88a
  - number: '2.89'
    text: |-
      1 Tenzij dit bij of krachtens deze wet is toegestaan, bevat het media-aanbod van de publieke mediadiensten geen:

      a. reclame- of telewinkelboodschappen; en

      b. vermijdbare andere uitingen die onmiskenbaar tot gevolg hebben dat de afname van producten of diensten wordt
      bevorderd.

      2 Bij of krachtens algemene maatregel van bestuur kan worden bepaald in welke gevallen vermijdbare uitingen zijn
      toegestaan en wanneer uitingen onvermijdbaar zijn.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.89
  - number: '2.90'
    text: |-
      Behoudens toestemming van het Commissariaat bevat het media-aanbod van de publieke mediadiensten geen oproepen in
      het kader van ledenwerving, andere verenigingsactiviteiten of nevenactiviteiten.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.90
  - number: '2.91'
    text: |-
      1 In het media-aanbod van de publieke mediadiensten mogen reclame- en telewinkelboodschappen die zijn aangeboden
      door derden worden opgenomen.

      2 Reclame- en telewinkelboodschappen, inclusief omlijsting daarvan, in het media-aanbod van de landelijke publieke
      mediadienst en de Wereldomroep worden uitsluitend verzorgd door de Ster.

      3 De Ster kan op verzoek van regionale en lokale publieke media-instellingen reclame- en telewinkelboodschappen,
      inclusief omlijsting daarvan, verzorgen die worden opgenomen in het media-aanbod van die instellingen.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.91
  - number: '2.92'
    text: |-
      1 De Ster en de regionale en lokale publieke media-instellingen die reclame- of telewinkelboodschappen in het
      media-aanbod opnemen, zijn aangesloten bij de Nederlandse Reclame Code of een vergelijkbare door de Stichting
      Reclame Code tot stand gebrachte regeling en ter zake onderworpen aan het toezicht van de Stichting Reclame Code.

      2 Aansluiting wordt aangetoond door een schriftelijke verklaring van de Stichting Reclame Code aan het
      Commissariaat over te leggen.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.92
  - number: '2.93'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de wijze waarop inzicht wordt
      gegeven in de financiën die betrekking hebben op de verzorging van reclame- en telewinkelboodschappen in het media-
      aanbod van de regionale en lokale publieke mediadiensten.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.93
  - number: '2.94'
    text: |-
      1 Reclame- en telewinkelboodschappen zijn door akoestische of visuele middelen duidelijk onderscheiden van de
      overige inhoud van het programma-aanbod.

      2 Het programma-aanbod bevat geen reclame- en telewinkelboodschappen voor:

      a. medische behandelingen; en

      b. alcoholhoudende dranken tussen 06.00 uur en 21.00 uur.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.94
  - number: '2.95'
    text: |-
      1 Het aandeel reclame- en telewinkelboodschappen, inclusief omlijsting, in het programma-aanbod bedraagt:

      a. per programmakanaal niet meer dan een bij algemene maatregel van bestuur vast te stellen percentage van de
      totale duur van het programma-aanbod op het programmakanaal per jaar, welk percentage niet meer bedraagt dan tien
      en voor radio- en televisieprogramma-aanbod kan verschillen;

      b. per programmakanaal niet meer dan vijftien procent van de totale duur van het programma-aanbod op het
      programmakanaal per dag; en

      c. per uur niet meer dan twaalf minuten.

      2 Ten hoogste een derde van de tijd die wordt gebruikt voor reclame- of telewinkelboodschappen in het programma-
      aanbod wordt gebruikt voor omlijsting.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.95
  - number: '2.96'
    text: |-
      1 Reclame- en telewinkelboodschappen in het programma-aanbod worden zodanig geplaatst dat zij:

      a. zijn opgenomen in blokken, welke blokken voor televisieprogramma-aanbod inclusief omlijsting ten minste één
      minuut duren;

      b. op zondagen niet direct vooraf gaan aan of direct aansluiten op programma’s van kerkelijke of geestelijke aard,
      tenzij de instelling die voor de inhoud van zodanig programma verantwoordelijk is daartegen geen bezwaar heeft
      gemaakt; en

      c. niet in programma’s worden opgenomen, behoudens het bepaalde in [artikel 2.97][ref1].

      2 Telewinkelboodschappen in het programma-aanbod duren elk ten hoogste één minuut en een blok als bedoeld in het
      eerste lid, onderdeel a, bestaat voor ten hoogste tweederde van de duur uit telewinkelboodschappen.

      3 Bij algemene maatregel van bestuur kunnen regels gesteld worden over de plaatsing van reclame- en
      telewinkelboodschappen in en rond programma-aanbod dat in het bijzonder bestemd is voor kinderen jonger dan twaalf
      jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.97
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.96
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.97'
        hoofdstuk: '2'
        paragraaf: 2.5.2.2
        afdeling: 2.5.2
  - number: '2.97'
    text: |-
      1 In programma’s worden alleen reclame- of telewinkelboodschappen opgenomen als:

      a. het desbetreffende programma langer duurt dan anderhalf uur voor televisie, dan wel drie kwartier voor radio;

      b. het desbetreffende programma bestaat uit het volledige verslag of de volledige weergave van een evenement;

      c. zij worden opgenomen tijdens de in het evenement voorkomende gebruikelijke pauzes of tussen de in het evenement
      voorkomende zelfstandige onderdelen in blokken die ten minste een minuut duren;

      d. de instelling die verantwoordelijk is voor de inhoud van het desbetreffende daartegen geen bezwaar heeft gemaakt
      op grond van afbreuk aan de integriteit, het karakter of de samenhang van het programma; en

      e. dit geen afbreuk doet aan de rechten van rechthebbenden.

      2 In programma’s van kerkelijke of geestelijke aard en in programma’s die in het bijzonder bestemd zijn voor
      kinderen jonger dan twaalf jaar worden geen reclame- of telewinkelboodschappen opgenomen.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.97
  - number: '2.98'
    text: |-
      De [artikelen 2.94 tot en met 2.97][ref1] zijn zo veel mogelijk van overeenkomstige toepassing op het overige
      media-aanbod van de publieke mediadiensten. Voor [artikel 2.96, eerste lid, onderdeel a][ref2], geldt de vorige
      volzin uitsluitend voor het overige media-aanbod met beeldinhoud, al dan niet mede met geluidsinhoud.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.94
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.96
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.98
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.94'
        hoofdstuk: '2'
        paragraaf: 2.5.2.2
        afdeling: 2.5.2
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2.96'
        hoofdstuk: '2'
        paragraaf: 2.5.2.2
        afdeling: 2.5.2
  - number: '2.99'
    text: |-
      De Stichting Etherreclame heeft tot taak het verzorgen van media-aanbod voor de landelijke publieke mediadienst en,
      op verzoek, voor de regionale en lokale publieke mediadiensten dat bestaat uit reclame- en telewinkelboodschappen
      die zijn aangeboden door derden, inclusief omlijsting daarvan.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.99
  - number: '2.100'
    text: |-
      1 Het bestuur van de Ster bestaat uit vijf leden die door Onze Minister worden benoemd, geschorst en ontslagen.

      2 Drie van de leden worden benoemd op voordracht van de NPO.

      3 Onze Minister wijst uit de leden de voorzitter aan en kan twee waarnemers met raadgevende stem in het bestuur
      aanwijzen.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.100
  - number: '2.101'
    text: |-
      1 Benoeming van de leden van het bestuur van de Ster geschiedt voor een periode van vijf jaar en herbenoeming voor
      een aansluitende periode is eenmaal mogelijk.

      2 Schorsing en ontslag zijn mogelijk wegens:

      a. ongeschiktheid;

      b. disfunctioneren; en

      c. het hebben van financiële of andere belangen bij bedrijven of instellingen en het vervullen van nevenfuncties
      waardoor een goede vervulling van de functie of de handhaving van de onafhankelijkheid van het betrokken lid of van
      het vertrouwen daarin in het geding kan zijn.

      3 Ontslag is verder mogelijk op eigen verzoek.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.101
  - number: '2.102'
    text: |-
      1 De Ster verstrekt Onze Minister desgevraagd alle inlichtingen met betrekking tot de werkzaamheden van de Ster.

      2 Onze Minister kan inzage verlangen in zakelijke gegevens en bescheiden van de Ster voor zover dat voor de
      vervulling van zijn taak nodig is.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.102
  - number: '2.103'
    text: |-
      1 De Ster stelt jaarlijks vóór 1 juni een jaarverslag over het afgelopen kalenderjaar vast.

      2 In het jaarverslag wordt aandacht besteed aan de werkzaamheden van de Ster, het gevoerde beleid in het algemeen
      en de doelmatigheid en doeltreffendheid van de werkwijze in het bijzonder.

      3 De Ster zendt het verslag aan Onze Minister en maakt het openbaar.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.103
  - number: '2.104'
    text: |-
      1 Wijzigingen in de statuten van de Ster behoeven de instemming van Onze Minister.

      2 Het bestuur kan niet besluiten tot ontbinding van de Ster.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.104
  - number: '2.105'
    text: |-
      1 De Ster doet jaarlijks vóór 1 augustus aan Onze Minister opgave van de verwachte inkomsten uit de reclame- en
      telewinkelboodschappen van de landelijke publieke mediadienst en de Wereldomroep in het lopende en in het volgende
      kalenderjaar.

      2 De Ster zendt een afschrift van deze opgaven ter kennisneming aan het Commissariaat, de NPO en de Wereldomroep.

      3 De inkomsten die de Ster verwerft uit de verzorging van reclame- en telewinkelboodschappen voor de landelijke
      publieke mediadienst stelt zij na aftrek van de door Onze Minister goedgekeurde uitgaven ter beschikking van Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.105
  - number: '2.106'
    text: |-
      1 Media-aanbod van de publieke mediadiensten wordt niet gesponsord.

      2 Het eerste lid is niet van toepassing op media-aanbod:

      a. van culturele aard;

      b. van educatieve aard;

      c. bestaande uit het verslag of de weergave van een of meer sportevenementen of sportwedstrijden; en

      d. bestaande uit het verslag of de weergave van evenementen ten behoeve van ideële doelen.

      3 Media-aanbod als bedoeld in het tweede lid wordt niet gesponsord als het:

      a. geheel of gedeeltelijk bestaat uit nieuws, actualiteiten of politieke informatie; of

      b. in het bijzonder is bestemd voor kinderen jonger dan twaalf jaar.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.106
  - number: '2.107'
    text: |-
      1 Bij gesponsord media-aanbod wordt ter informatie van het publiek duidelijk vermeld dat en door wie het media-
      aanbod is gesponsord.

      2 De vermelding geschiedt door neutrale vermelding of vertoning van naam, (beeld)merk of ander onderscheidend teken
      van de sponsor.

      3 Bij een gesponsord programma vindt de vermelding plaats aan het begin of het einde van het programma en kan de
      vermelding daarnaast plaatsvinden aan het begin of het einde van een reclameblok dat in het programma is opgenomen.

      4 Ten aanzien van de vermelding geldt dat zij:

      a. ten hoogste vijf seconden duurt;

      b. voor zover deze niet plaatsvindt op de aan- of aftiteling, uitsluitend uit stilstaande beelden bestaat; en

      c. niet beeldvullend is.

      5 Het derde en vierde lid zijn zo veel mogelijk van overeenkomstige toepassing op het overige media-aanbod van de
      publieke mediadiensten.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.107
  - number: '2.108'
    text: |-
      1 In gesponsord media-aanbod mogen producten of diensten van een sponsor worden vermeld of getoond, behalve als
      deze een bijdrage in geld heeft gegeven en onverminderd [artikel 2.88a, derde lid, aanhef en onderdeel b][ref1].

      2 Het Commissariaat kan toestemming verlenen voor het vermelden of vertonen van de naam, het (beeld)merk, producten
      of diensten van sponsors in de titel van gesponsord media-aanbod, mits het publiek niet rechtstreeks door middel
      van specifieke aanprijzingen wordt aangespoord tot het kopen of huren van producten of afname van diensten van
      de sponsors.

      3 Het Commissariaat kan aan het verlenen van toestemming voorschriften verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.88a
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.108
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: 2.88a
        hoofdstuk: '2'
        afdeling: 2.5.1
  - number: '2.109'
    text: |-
      Sponsorbijdragen worden rechtstreeks van de sponsors en door middel van een schriftelijke overeenkomst bedongen
      of aanvaard.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.109
  - number: '2.110'
    text: |-
      De landelijke publieke media-instellingen sturen een afschrift van een sponsorovereenkomst aan de raad van bestuur:

      a. binnen één week na het tot stand komen daarvan; of

      b. als het media-aanbod eerder wordt verspreid naar het publiek, vóór laatstgenoemd moment.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.110
  - number: '2.111'
    text: |-
      1 Als de raad van bestuur binnen twee weken na ontvangst van het afschrift van de sponsorovereenkomst, of in het
      geval van [artikel 2.110, onderdeel b][ref1], vóór de beoogde datum van verspreiding, schriftelijk heeft meegedeeld
      dat de sponsorovereenkomst in strijd is met het gemeenschappelijke belang van de landelijke publieke mediadienst,
      wordt het media-aanbod waarop de overeenkomst betrekking heeft niet verspreid, tenzij de overeenkomst wordt
      ontbonden of gewijzigd.

      2 In het geval de raad van bestuur aanvullende informatie verlangt, moet voor de toepassing van het eerste lid de
      schriftelijke mededeling zijn gegeven binnen twee weken nadat de aanvullende informatie is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.110
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.111
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.110'
        hoofdstuk: '2'
        afdeling: 2.5.3
  - number: '2.112'
    text: |-
      De [artikelen 2.110][ref1] en [2.111][ref2] zijn van overeenkomstige toepassing op de wijziging van een
      sponsorovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.110
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.111
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.112
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.110'
        hoofdstuk: '2'
        afdeling: 2.5.3
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2.111'
        hoofdstuk: '2'
        afdeling: 2.5.3
  - number: '2.113'
    text: |-
      De publieke media-instellingen brengen jaarlijks via de jaarrekening verslag uit over de inkomsten uit
      sponsorbijdragen, het gesponsorde media-aanbod en de hoedanigheid van de sponsors, gespecificeerd per onderdeel van
      het media-aanbod.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.113
  - number: '2.114'
    text: |-
      1 Als een gesponsord programma uit het buitenland is aangekocht en daar als programma naar het publiek is
      verspreid, zijn de [artikelen 2.106 tot en met 2.113][ref1] van toepassing voor zover sponsorbijdragen worden
      gegeven voor de aankoop van het programma.

      2 De [artikelen 2.107 tot en met 2.113][ref2] zijn van overeenkomstige toepassing als een andere instelling
      dan bedoeld in de begripsomschrijving van sponsoring in [artikel 1.1][ref3] een bijdrage heeft gegeven voor de
      productie of aankoop van media-aanbod om de verspreiding daarvan te bevorderen of mogelijk te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.106
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.107
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.114
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.106'
        hoofdstuk: '2'
        afdeling: 2.5.3
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2.107'
        hoofdstuk: '2'
        afdeling: 2.5.3
      - id: ref3
        bwb_id: BWBR0025028
        artikel: '1.1'
        hoofdstuk: '1'
  - number: '2.115'
    text: |-
      1 Op elk televisieprogrammakanaal van de landelijke en regionale publieke mediadienst bestaat het programma-
      aanbod voor ten minste vijftig procent van de duur uit Europese producties in de zin van artikel 1 van de Europese
      richtlijn.

      2 Het televisieprogramma-aanbod van de Wereldomroep bestaat voor ten minste vijftig procent uit producties als
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.115
  - number: '2.116'
    text: |-
      1 Bij algemene maatregel van bestuur wordt vastgesteld hoeveel procent van het totaal van de budgetten,
      bedoeld in [artikel 2.149, eerste lid][ref1], met uitzondering van onderdeel g, en de gelden die op grond van
      [artikel 2.158][ref2] ter beschikking zijn gesteld voor het verzorgen van media-aanbod, wordt besteed aan Europese
      producties als bedoeld in artikel 6 van de Europese richtlijn die kunnen worden aangemerkt als onafhankelijke
      productie. Het percentage, bedoeld in de vorige volzin, wordt vastgesteld op ten minste tien en ten hoogste twintig
      procent.

      2 Op elk van de televisieprogrammakanalen van de landelijke publieke mediadienst bestaat het programma-aanbod
      uit ten minste tien procent van de duur uit producties als bedoeld in [artikel 2.115][ref3] die kunnen worden
      aangemerkt als onafhankelijke productie.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.149
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.158
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel2.115
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.116
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.149'
        hoofdstuk: '2'
        paragraaf: 2.6.2.2
        afdeling: 2.6.2
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2.158'
        hoofdstuk: '2'
        paragraaf: 2.6.2.3
        afdeling: 2.6.2
      - id: ref3
        bwb_id: BWBR0025028
        artikel: '2.115'
        hoofdstuk: '2'
        paragraaf: 2.5.4.1
        afdeling: 2.5.4
  - number: '2.117'
    text: |-
      Op elk van de televisieprogrammakanalen van de regionale publieke mediadienst bestaat het programma-aanbod voor ten
      minste tien procent van de duur uit producties als bedoeld in [artikel 2.115][ref1] die kunnen worden aangemerkt
      als onafhankelijke productie.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.115
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.117
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.115'
        hoofdstuk: '2'
        paragraaf: 2.5.4.1
        afdeling: 2.5.4
  - number: '2.118'
    text: |-
      Het televisieprogramma-aanbod van de Wereldomroep bestaat voor ten minste tien procent uit producties als bedoeld
      in [artikel 2.115][ref1] die kunnen worden aangemerkt als onafhankelijke productie.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.115
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.118
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.115'
        hoofdstuk: '2'
        paragraaf: 2.5.4.1
        afdeling: 2.5.4
  - number: '2.119'
    text: |-
      Ten minste een derde deel van de programma’s, bedoeld in de [artikelen 2.116 tot en met 2.118][ref1], is niet ouder
      dan vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.116
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.119
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.116'
        hoofdstuk: '2'
        paragraaf: 2.5.4.1
        afdeling: 2.5.4
  - number: '2.120'
    text: |-
      1 Als onafhankelijke productie wordt aangemerkt media-aanbod dat niet geproduceerd is door:

      a. een publieke media-instelling;

      b. een commerciële media-instelling;

      c. een buitenlandse omroepinstelling;

      d. een rechtspersoon waarin een instelling als bedoeld in de onderdelen a tot en met c, al dan niet door middel van
      een of meer dochtermaatschappijen, een belang van meer dan vijfentwintig procent heeft;

      e. een rechtspersoon waarin twee of meer instellingen als bedoeld in de onderdelen a tot en met c, al dan niet door
      middel van een of meer van hun onderscheidene dochtermaatschappijen, samen een belang van meer dan vijftig procent
      hebben; of

      f. een vennootschap waarin een instelling als bedoeld in de onderdelen a tot en met c, dan wel een of meer van haar
      dochtermaatschappijen, als vennoot volledig jegens schuldeisers aansprakelijk is voor de schulden.

      2 Bij algemene maatregel van bestuur:

      a. kunnen nadere regels worden gesteld over de toepassing van het eerste lid en de
      [artikelen 2.116 tot en met 2.119][ref1]; en

      b. kan worden bepaald dat in andere dan de in het eerste lid bedoelde gevallen media-aanbod wordt aangemerkt als
      onafhankelijke productie.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.116
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.120
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.116'
        hoofdstuk: '2'
        paragraaf: 2.5.4.1
        afdeling: 2.5.4
  - number: '2.121'
    text: |-
      Voor de toepassing van de [artikelen 2.116 tot en met 2.120][ref1] blijft buiten beschouwing media-aanbod:

      a. dat bestaat uit nieuws;

      b. dat betrekking heeft op sport;

      c. dat het karakter van een spel heeft, met uitzondering van media-aanbod van culturele of educatieve aard dat mede
      het karakter van een spel heeft;

      d. dat bestaat uit reclame- en telewinkelboodschappen, inclusief omlijsting, en zelfpromotie;

      e. van kerkgenootschappen en genootschappen op geestelijke grondslag, politieke partijen en de overheid; en

      f. dat bestaat uit teletekst.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.116
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.121
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.116'
        hoofdstuk: '2'
        paragraaf: 2.5.4.1
        afdeling: 2.5.4
  - number: '2.122'
    text: |-
      1 Op elk televisieprogrammakanaal van de landelijke en regionale publieke mediadienst bestaat het programma-aanbod
      voor ten minste vijftig procent van de duur uit oorspronkelijk Nederlands- of Friestalige producties.

      2 Voor de toepassing van het eerste lid blijft buiten beschouwing:

      a. programma-aanbod dat bestaat uit reclame- en telewinkelboodschappen, inclusief omlijsting; en

      b. programma-aanbod van kerkgenootschappen en genootschappen op geestelijke grondslag, politieke partijen en de
      overheid.

      3 Het Commissariaat kan in bijzondere gevallen geheel of gedeeltelijk ontheffing verlenen van het eerste lid. Het
      Commissariaat kan aan een ontheffing voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.122
  - number: '2.123'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over de ondertiteling van televisieprogramma-
      aanbod, waarbij onder meer kan worden bepaald welk percentage van het televisieprogramma-aanbod van de landelijke
      publieke mediadienst bestaat uit producties als bedoeld in [artikel 2.122, eerste lid][ref1], die voorzien zijn van
      ondertiteling ten behoeve van personen met een auditieve beperking.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.122
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.123
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.122'
        hoofdstuk: '2'
        paragraaf: 2.5.4.2
        afdeling: 2.5.4
  - number: '2.124'
    text: |-
      In het media-aanbod van de publieke mediadiensten worden geen films opgenomen buiten de met de rechthebbenden
      overeengekomen periodes.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.124
  - number: '2.125'
    text: |-
      De stichting Stimuleringsfonds Nederlandse culturele mediaproducties heeft tot taak:

      a. het verstrekken van financiële bijdragen voor de ontwikkeling en vervaardiging van media-aanbod van bijzondere
      Nederlandse culturele aard ten behoeve van de landelijke en regionale publieke media-instellingen en de
      Wereldomroep; en

      b. het verstrekken van financiële bijdragen aan landelijke en regionale publieke media-instellingen en de
      Wereldomroep ter bevordering van de samenwerking met instellingen op het terrein van de cultuur.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.125
  - number: '2.126'
    text: |-
      1 In deze afdeling wordt verstaan onder: stichting: stichting Stimuleringsfonds Nederlandse culturele
      mediaproducties.

      2 Op de stichting is de [Kaderwet zelfstandige bestuursorganen][ref1] van toepassing met uitzondering van
      [artikel 22][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020495
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel22
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.126
    references:
      - id: ref1
        bwb_id: BWBR0020495
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '22'
  - number: '2.127'
    text: |-
      1 De stichting heeft een bestuur dat bestaat uit zeven leden die worden benoemd, geschorst en ontslagen door Onze
      Minister.

      2 Twee leden worden benoemd uit de kring van de publieke mediadiensten en twee leden uit de kring van de film- en
      podiumkunsten. Onze Minister wijst uit de andere leden de voorzitter aan.

      3 Schorsing en ontslag zijn mogelijk wegens:

      a. ongeschiktheid;

      b. disfunctioneren; en

      c. het hebben van financiële of andere belangen bij bedrijven of instellingen en het vervullen van nevenfuncties
      waardoor een goede vervulling van de functie of de handhaving van de onafhankelijkheid van het betrokken lid of van
      het vertrouwen daarin in het geding kan zijn.

      4 Ontslag is verder mogelijk op eigen verzoek.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.127
  - number: '2.128'
    text: |-
      Onverminderd de [artikelen 27][ref1] en [28 van de Kaderwet zelfstandige bestuursorganen][ref2] bevat de begroting
      van de stichting:

      a. het beleid en een toelichting op de begrotingsposten voor de ontwikkeling en vervaardiging van media-aanbod ten
      behoeve van de landelijke publieke mediadienst en de Wereldomroep;

      b. het beleid en een toelichting op de begrotingsposten voor de ontwikkeling en vervaardiging van media-aanbod ten
      behoeve van de regionale publieke mediadienst; en

      c. het beleid en een toelichting op de begrotingsposten voor de samenwerking, bedoeld in
      [artikel 2.125, onderdeel b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel2.125
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.128
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '27'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0025028
        artikel: '2.125'
        hoofdstuk: '2'
        paragraaf: 2.5.5.1
        afdeling: 2.5.5
  - number: '2.129'
    text: |-
      1 [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1] is van toepassing op de jaarrekening van de stichting,
      met dien verstande dat de winst- en verliesrekening wordt vervangen door een exploitatierekening. Op deze rekening
      zijn de bepalingen omtrent de winst- en verliesrekening zoveel mogelijk van overeenkomstige toepassing. Bepalingen
      omtrent winst en verlies zijn zoveel mogelijk van overeenkomstige toepassing op het exploitatiesaldo.

      2 Het boekjaar is gelijk aan het kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.129
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: '2.130'
    text: |-
      1 Op basis van de goedgekeurde begroting ontvangt de stichting jaarlijks uit de gelden, bedoeld in
      [artikel 2.146][ref1], aanhef, van Onze Minister een bijdrage voor de kosten van de uitvoering van haar taak.

      2 De bijdrage bedraagt ten minste een zestiende deel van de afgedragen inkomsten van de Ster van het desbetreffende
      jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.146
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.130
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.146'
        hoofdstuk: '2'
        afdeling: 2.6.1
  - number: '2.131'
    text: |-
      1 Wijzigingen in de statuten van de stichting behoeven de instemming van Onze Minister.

      2 Het bestuur van de stichting kan niet besluiten tot ontbinding van de stichting.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.131
  - number: '2.132'
    text: |-
      1 De NPO en de publieke media-instellingen mogen alleen na voorafgaande toestemming van het Commissariaat
      nevenactiviteiten verrichten.

      2 Nevenactiviteiten zijn activiteiten, directe of indirecte deelnemingen in rechtspersonen daaronder begrepen, die
      niet rechtstreeks verband houden met of ten dienste staan van de uitvoering van de publieke media-opdracht, met
      uitzondering van verenigingsactiviteiten.

      3 Toestemming kan alleen worden gegeven als een nevenactiviteit verband houdt met of ten dienste staat van de
      verwezenlijking van de publieke media-opdracht en direct gerelateerd is aan het media-aanbod van de publieke
      omroep, op marktconforme wijze wordt verricht en ten minste kostendekkend is.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.132
  - number: '2.133'
    text: |-
      Op overeenkomsten ter zake van nevenactiviteiten die er toe strekken om rechten op en de bekendheid van media-
      aanbod dat voor de landelijke publieke mediadienst is verzorgd of daaraan verbonden namen en merken buiten
      de publieke mediadienst te exploiteren, zijn de [artikelen 2.110 tot en met 2.112][ref1] van overeenkomstige
      toepassing, met dien verstande dat de termijn, bedoeld in [artikel 2.111, eerste en tweede lid][ref2], twee maanden
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.110
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.111
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.133
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.110'
        hoofdstuk: '2'
        afdeling: 2.5.3
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2.111'
        hoofdstuk: '2'
        afdeling: 2.5.3
  - number: '2.134'
    text: |-
      1 In het kader van nevenactiviteiten kunnen de NPO en de publieke media-instellingen rechtspersonen of
      samenwerkingsverbanden oprichten of daarin deelnemen.

      2 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over het verrichten van nevenactiviteiten.

      3 De instellingen die nevenactiviteiten willen verrichten, tonen desgevraagd ten genoegen van het Commissariaat aan
      dat de nevenactiviteiten voldoen aan het bepaalde bij of krachtens [artikel 2.132][ref1] en dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.132
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.134
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.132'
        hoofdstuk: '2'
        afdeling: 2.5.6
  - number: '2.135'
    text: |-
      1 Tenzij bij of krachtens deze wet anders is bepaald, gebruiken de NPO en de publieke media-instellingen al hun
      inkomsten voor de uitvoering van de publieke mediaopdracht.

      2 Het eerste lid en de [artikelen 2.132][ref1] en [2.134][ref2] zijn niet van toepassing op kerkgenootschappen en
      genootschappen op geestelijke grondslag.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.132
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.134
