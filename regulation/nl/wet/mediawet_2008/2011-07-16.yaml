  - number: 2.37a
    text: |-
      1 De raad van toezicht houdt toezicht op het beleid van de algemeen directeur, op de algemene gang van zaken binnen
      de NPS en op de pluriformiteit van het media-aanbod van de NPS en staat de algemeen directeur met advies terzijde.

      2 Bij de vervulling van hun taak richten de leden van de raad van toezicht zich naar het algemene belang van de
      NPS.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.37a
  - number: 2.37b
    text: |-
      1 De algemeen directeur van de NPS wordt benoemd, geschorst en ontslagen door de raad van toezicht.

      2 [Artikel 2.37, eerste lid, onderdelen b tot en met f][ref1], is van overeenkomstige toepassing op de algemeen
      directeur.

      3 De algemeen directeur is in dienst van de NPS. De raad van toezicht stelt zijn arbeidsvoorwaarden vast.


