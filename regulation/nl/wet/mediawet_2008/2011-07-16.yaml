  - number: '7.14'
    text: |-
      1 Bij overtreding van het bepaalde bij of krachtens deze wet of
      [artikel 5:20 van de Algemene wet bestuursrecht][ref1] kan het Commissariaat, naast of in plaats van het opleggen
      van een bestuurlijke boete en een last onder dwangsom:

      a. de in [artikel 2.51][ref2] bedoelde uren van de desbetreffende instelling voor ten hoogste twaalf weken
      intrekken;

      b. de in de [artikelen 2.49, eerste lid][ref3], [6.1][ref4] en [6.5][ref5] bedoelde uren van de desbetreffende
      instelling verminderen of intrekken; en

      c. de uren intrekken of verminderen die de Ster op grond van [artikel 2.95][ref6] op de programmakanalen van de
      landelijke publieke mediadienst ter beschikking heeft.

      2 De bevoegdheden, bedoeld in het eerste lid, heeft het Commissariaat ook wanneer de raad van bestuur het
      Commissariaat heeft verzocht de uren van de desbetreffende instelling te verminderen of in te trekken omdat:

      a. aan een instelling die media-aanbod voor de landelijke publieke omroepdienst verzorgt voor twee
      achtereenvolgende jaren een sanctie als bedoeld in [artikel 2.154][ref7] is opgelegd; of

      b. een omroepvereniging of de educatieve media-instelling naar de mening van de raad van bestuur onvoldoende
      uitvoering geeft aan de bereidheid tot samenwerking ten behoeve van de landelijke publieke mediadienst.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel520
