  - number: '2.171'
    text: |-
      1 Het Commissariaat is belast met de rechtmatigheidstoetsing van de uitgaven van de NPO, de landelijke publieke
      media-instellingen en de Wereldomroep.

      2 De landelijke publieke media-instellingen en de Wereldomroep zenden jaarlijks vóór 1 mei de jaarrekening aan het
      Commissariaat en sturen gelijktijdig een afschrift daarvan aan de raad van bestuur.

      3 De raad van bestuur zendt vóór 1 juli zijn opmerkingen over de jaarrekeningen tezamen met de jaarrekening van de
      NPO aan het Commissariaat.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.171
  - number: '2.172'
    text: |-
      1 [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1] is van toepassing op de jaarrekeningen, met dien verstande
      dat de winst- en verliesrekening wordt vervangen door een exploitatierekening. Op deze rekening zijn de bepalingen
      over de winst- en verliesrekening zoveel mogelijk van overeenkomstige toepassing. Bepalingen over winst en verlies
      zijn zoveel mogelijk van overeenkomstige toepassing op het exploitatiesaldo.

      2 Het boekjaar is gelijk aan het kalenderjaar.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld over de inhoud en inrichting van de jaarrekening.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.172
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: '2.173'
    text: |-
      Het Commissariaat brengt als onderdeel van het financieel verslag, bedoeld in [artikel 7.7][ref1], verslag uit over
      de rechtmatigheidstoetsing.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel7.7
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.173
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '7.7'
        hoofdstuk: '7'
  - number: '2.174'
    text: |-
      1 De landelijke publieke media-instellingen kunnen met toestemming van de raad van bestuur en onder de door hem te
      stellen voorwaarden, die per instelling of categorie van instellingen kunnen verschillen, gelden voor de verzorging
      van media-aanbod reserveren. De NPO kan gelden die bestemd zijn voor de verzorging van media-aanbod door de
      landelijke publieke media-instellingen, reserveren.

      2 Het totaal van de gereserveerde gelden in een kalenderjaar bedraagt niet meer dan tien procent van het totaal van
      de ter beschikking gestelde budgetten, bedoeld in [artikel 2.149, eerste lid][ref1].

      3 Gelden die in strijd met het eerste lid zijn gereserveerd, worden terugbetaald aan de raad van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.149
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.174
