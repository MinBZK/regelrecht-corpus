        afdeling: 2.6.2
  - number: 2.174a
    text: |-
      1 Omroepverenigingen die een erkenning of voorlopige erkenning als bedoeld in [artikel 2.24][ref1] hebben
      verkregen, kunnen netto inkomsten uit contributies en verenigingsactiviteiten tot een bij algemene maatregel van
      bestuur vast te stellen bedrag reserveren voor verenigingsactiviteiten.

      2 [Artikel 2.174, derde lid][ref2], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.24
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.174
