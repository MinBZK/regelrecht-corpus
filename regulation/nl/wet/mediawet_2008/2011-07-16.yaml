        hoofdstuk: '2'
        paragraaf: 2.2.1.4
        afdeling: 2.2.1
  - number: '2.51'
    text: |-
      1 Op de algemene programmakanalen:

      a. beschikken de omroepverenigingen die een erkenning als bedoeld in [artikel 2.24][ref1] hebben verkregen, per
      jaar over 325 uren voor televisie en over 1500 uren voor radio, aangevuld met een aantal uren dat wordt berekend
      naar rato van het aantal leden van de omroepverenigingen overeenkomstig het tweede lid;

      b. beschikken de omroepverenigingen die een voorlopige erkenning als bedoeld in [artikel 2.24][ref2] hebben
      verkregen, per jaar over 100 uren voor televisie en over 450 uren voor radio;

      c. beschikt de NOS per jaar over 1300 uren voor televisie en over 1500 uren voor radio;

      d. beschikt de NPS per jaar over 650 uren voor televisie en over 3000 uren voor radio; en

      e. beschikt de educatieve media-instelling die een erkenning als bedoeld in [artikel 2.28][ref3] heeft verkregen,
      per jaar over 500 uren voor televisie en over 475 uren voor radio.

      2 Het aanvullend aantal uren voor televisie en radio per omroepvereniging die een erkenning als bedoeld
      in [artikel 2.24][ref4] heeft verkregen, wordt vastgesteld aan de hand van de formule (l : t) * 325 * o
      onderscheidenlijk (l : t) * 1500 * o, waarbij

      l = het aantal leden per omroepvereniging die een erkenning heeft verkregen;

      t = het aantal leden van alle omroepverenigingen die een erkenning hebben verkregen; en

      o = het aantal omroepverenigingen die een erkenning hebben verkregen.

      Voor de vaststelling van het aanvullend aantal uren telt het aantal leden dat het aantal van 400 000 leden
      overschrijdt, niet mee. Het aanvullend aantal uren wordt naar boven afgerond op het naastbij gelegen gehele getal.

      3 De instellingen, bedoeld in het eerste lid, kunnen meer uren gebruiken dan de aantallen, bedoeld in dat lid.

      4 Bij algemene maatregel van bestuur kan de verdeling van het eerste lid, onderdelen a en b, worden herzien als het
      aantal omroepverenigingen daartoe aanleiding geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.24
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.24
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel2.28
      [ref4]: https://wetten.overheid.nl/BWBR0025028#Artikel2.24
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.51
