  - number: '7.12'
    text: |-
      1 Bij overtreding van het bepaalde bij of krachtens deze wet, met uitzondering van de
      [artikelen 2.34, eerste lid][ref1], [2.58, onderdelen a tot en met c, en e][ref2], en [2.170][ref3], of
      [artikel 5:20 van de Algemene wet bestuursrecht][ref4] kan het Commissariaat aan de overtreder een bestuurlijke
      boete opleggen van ten hoogste € 225 000 per overtreding.

      2 De bestuurlijke boete bij overtreding van het bepaalde in [artikel 2.34, eerste lid][ref5], bedraagt tien procent
      van het totale bedrag aan gelden dat gemiddeld in de kalenderjaren voorafgaand aan de overtreding tijdens de
      lopende erkenningsperiode aan de omroepvereniging ter beschikking is gesteld voor de verzorging van media-aanbod
      voor de landelijke publieke mediadienst.

      3 Bij overtreding van het bepaalde bij of krachtens de [artikelen 2.132 tot en met 2.134][ref6],
      [6.10 tot en met 6.14][ref7] en [6.20][ref8] kan het Commissariaat aan de overtreder een last onder dwangsom
      opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.34
