  - number: 9.17a
    text: |-
      Vooruitlopend op wetgeving ter zake kunnen bij ministeriële regeling regels worden gesteld voor vormen
      van audiovisuele commerciële communicatie in de zin van artikel 1 van de Europese richtlijn waarop de
      [hoofdstukken 1 tot en met 8][ref1] van deze wet niet van toepassing zijn.


