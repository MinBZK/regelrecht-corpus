        artikel: '2.24'
        hoofdstuk: '2'
        afdeling: 2.2.2
  - number: '2.28'
    text: |-
      1 Onze Minister kan eens in de vijf jaar aan een instelling een erkenning verlenen voor de verzorging van educatief
      media-aanbod voor de landelijke publieke mediadienst volgens de bepalingen van deze afdeling.

      2 Voor een erkenning komt slechts in aanmerking een instelling die:

      a. rechtspersoon naar Nederlands recht met volledige rechtsbevoegdheid is;

      b. zich volgens de statuten uitsluitend ten doel stelt het verzorgen van een breed en samenhangend educatief media-
      aanbod op het gebied van onderwijs, scholing en vorming;

      c. volgens de statuten een bestuur heeft waarin deskundigen uit de kring van representatieve landelijke
      organisaties op het gebied van onderwijs, scholing en vorming zitting hebben; en

      d. volgens de statuten een orgaan heeft dat het beleid voor het media-aanbod bepaalt en dat representatief is voor
      maatschappelijke en levensbeschouwelijk organisaties op het terrein van onderwijs, scholing en vorming.

      3 De statuten en wijzigingen daarvan behoeven de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.28
  - number: '2.29'
    text: |-
      1 Een erkenning of een voorlopige erkenning wordt op aanvraag verleend en geldt voor een periode van vijf jaar die
      samenvalt met een vijfjaarlijkse periode van de concessie als bedoeld in [artikel 2.19, derde lid][ref1].

      2 Een erkenning of voorlopige erkenning is niet overdraagbaar en vervalt van rechtswege na afloop van de
      erkenningperiode.

      3 Een erkenning of voorlopige erkenning geeft aanspraak op een financiële bijdrage voor de verzorging van media-
      aanbod volgens het bepaalde bij of krachtens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.19
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.29
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.19'
        hoofdstuk: '2'
        paragraaf: 2.2.1.4
        afdeling: 2.2.1
  - number: '2.30'
    text: |-
      1 Een aanvraag voor een erkenning of voorlopige erkenning bevat de statuten van de aanvrager en een beleidsplan.

      2 Het beleidsplan bevat in elk geval:

      a. het voorgenomen beleid ten aanzien van het media-aanbod, met in achtneming van de bij of krachtens deze wet
      gestelde verplichtingen voor het media-aanbod van de landelijk publieke mediadienst; en

      b. de voornemens en afspraken over samenwerking ten behoeve van de landelijke publieke mediadienst met andere
      aanvragers van een erkenning of een voorlopige erkenning, de NPO, de NOS of de NPS.

      3 Het deel van het beleidsplan dat betrekking heeft op samenwerking kan door de desbetreffende aanvragers
      gezamenlijk worden ingediend.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld over:

      a. het tijdstip en de wijze van indiening van een aanvraag;

      b. de inrichting van een aanvraag en het beleidsplan; en

      c. de termijn en wijze waarop een besluit op een aanvraag wordt genomen.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.30
  - number: '2.31'
    text: |-
      1 Voordat Onze Minister besluit over het verlenen van een erkenning of voorlopige erkenning vraagt hij de Raad voor
      cultuur, het Commissariaat en de NPO binnen een door hem te stellen termijn te adviseren over een aanvraag.

      2 Het uitblijven van een advies staat aan het nemen van een besluit over het verlenen van een erkenning of
      voorlopige erkenning niet in de weg.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.31
  - number: '2.32'
    text: |-
      1 Onze Minister wijst een aanvraag voor een erkenning of een voorlopige erkenning af als de aanvrager:

      a. niet voldoet aan de [artikelen 2.24, tweede lid][ref1], [2.25, eerste volzin, onderdelen a en b][ref2],
      [2.26, eerste volzin, onderdelen a, b en d][ref3] of [2.28, tweede lid][ref4]; of

      b.

      2 Onze Minister kan een aanvraag afwijzen als:

      a. blijkens de evaluatie, bedoeld in [artikel 2.184, derde lid][ref5], onvoldoende heeft bijgedragen aan
      de uitvoering van de publieke mediaopdracht op landelijk niveau door de wijze waarop hij uitvoering heeft
      gegeven aan zijn publieke taak, bedoeld in [artikel 2.24, tweede lid, onderdeel b][ref6], onderscheidenlijk
      [artikel 2.28, tweede lid, onderdeel b][ref7];

      b. de aanvrager niet voldoet aan de krachtens [artikel 2.30, vierde lid][ref8], gestelde eisen;

      c. aannemelijk is dat de aanvrager zich, mede gelet op zijn handelwijze in een voorafgaande periode waarin hij een
      erkenning heeft gehad, niet zal houden aan het bepaalde bij of krachtens deze wet; of

      d. uit de aanvraag naar de mening van Onze Minister onvoldoende blijkt dat:

      1°. in het door de aanvrager te verzorgen media-aanbod de identiteit en missie van de aanvrager tot uitdrukking
      komt;

      2°. het door de aanvrager te verzorgen media-aanbod voldoet aan de daaraan bij of krachtens deze wet gestelde
      eisen; of

      3°. de aanvrager bereid is tot samenwerking ten behoeve van de landelijk publieke mediadienst.

      3 Een aanvraag van een omroepvereniging die een voorlopige erkenning heeft verkregen en die aansluitend
      voor een erkenning in aanmerking wil komen, kan daarnaast worden afgewezen als tijdens de periode van
      de voorlopige erkenning onvoldoende is gebleken dat het media-aanbod voldoet aan de eisen, bedoeld in
      [artikel 2.26, onderdeel d][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.24
