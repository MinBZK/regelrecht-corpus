  - number: 2.152a
    text: |-
      1 De raad van bestuur verdeelt het budget, bedoeld in [artikel 2.149, eerste lid, onderdeel b][ref1], over de
      omroepverenigingen die een voorlopige erkenning als bedoeld in [artikel 2.24][ref2] hebben verkregen, zodanig dat
      elke omroepvereniging een bedrag ontvangt van dertig procent van het basisbudget van een omroepvereniging, bedoeld
      in [artikel 2.152, eerste lid, onderdeel a][ref3].

      2 De omroepverenigingen, bedoeld in [artikel 2.152, eerste lid, onderdeel a][ref4], de omroepverenigingen,
      bedoeld in het eerste lid, de NOS, de NPS en de educatieve media-instelling, bedoeld in
      [artikel 2.149, eerste lid, onderdeel e][ref5], besteden de ontvangen bedragen en de budgetten aan de in
      [artikel 2.149, eerste lid, onderdelen a tot en met e][ref6], genoemde doelen.


