  - number: '2.11'
    text: |-
      1 De volgende besluiten van de raad van bestuur behoeven de instemming van de raad van toezicht:

      a. de besluiten, bedoeld in het [artikel 2.10, tweede lid, onderdelen e tot en met h][ref1];

      b. het doen van investeringen die een in de statuten van de NPO vastgesteld bedrag te boven gaan;

      c. het door de NPO aangaan of verbreken van duurzame samenwerking met een andere rechtspersoon of vennootschap als
      die samenwerking van ingrijpende betekenis is voor de NPO of de landelijke publieke media-instellingen;

      d. collectief ontslag van een aanmerkelijk aantal werknemers; en

      e. het vaststellen van ingrijpende wijzigingen in de arbeidsomstandigheden van een aanmerkelijk aantal werknemers.

      2 De verdere werkwijze van de raad van toezicht en de raad van bestuur wordt geregeld in de statuten en reglementen
      van de NPO.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.10
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.11
