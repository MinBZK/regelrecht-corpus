  - number: '2.139'
    text: |-
      1 De landelijke publieke media-instellingen stellen de gegevens van hun programma-aanbod, voor zover deze nodig
      zijn voor de opgaven van het te verspreiden programma-aanbod in gedrukte of elektronische programmagidsen, ter
      beschikking van de NPO.

      2 Zij aanvaarden dat de NPO de gegevens voor verveelvoudiging en openbaarmaking ter beschikking stelt aan de
      omroepverenigingen en aan anderen die daartoe een overeenkomst met de NPO hebben gesloten.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.139
  - number: '2.140'
    text: |-
      Als inbreuk op het auteursrecht op enig geschrift inhoudende opgaven van uit te zenden programma-aanbod,
      geproduceerd door of in opdracht van landelijke publieke media-instellingen, wordt voor de burgerrechtelijke
      aansprakelijkheid mede beschouwd het verveelvoudigen of openbaar maken van lijsten of andere opgaven van dat
      programma-aanbod anders dan met toepassing van [artikel 2.139][ref1] of met toestemming van de desbetreffende
      instelling, tenzij wordt bewezen dat de gegevens in die lijsten of andere opgaven niet direct of indirect zijn
      ontleend aan enig geschrift als bedoeld in de aanhef van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.139
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.140
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.139'
        hoofdstuk: '2'
        afdeling: 2.5.6
  - number: '2.141'
    text: |-
      1 De NPO en de publieke media-instellingen zijn met al hun activiteiten niet dienstbaar aan het maken van winst
      door derden en tonen dat desgevraagd naar genoegen van het Commissariaat aan.

      2 Voor kerkgenootschappen en genootschappen op geestelijke grondslag is het eerste lid alleen van toepassing op de
      activiteiten ter verzorging van hun media-aanbod voor de landelijke publieke mediadienst.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.141
  - number: '2.142'
    text: |-
      1 De NPO en de publieke media-instellingen zorgen er voor dat leden van hun organen, werknemers en andere personen
      of rechtspersonen waarmee een overeenkomst is gesloten met het oog op de uitvoering van de publieke media-opdracht,
      voor zichzelf of voor anderen geen op geld waardeerbaar voordeel van derden bedingen of aanvaarden dat direct of
      indirect verband houdt met werkzaamheden van de betrokkene voor de instelling, tenzij het daartoe bevoegde orgaan
      van de instelling daarvoor toestemming heeft gegeven.

      2 Toestemming wordt alleen gegeven als de betrokkene aannemelijk maakt dat het voordeel niet is bedoeld als
      tegenprestatie voor het door hem in de uitoefening van zijn werkzaamheden voor de instelling bevoordelen van
      derden.

      3 Een persoon of rechtspersoon die een overeenkomst als bedoeld in het eerste lid heeft gesloten, wordt ten
      opzichte van degenen die in zijn dienst werken niet aangemerkt als een derde.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.142
  - number: 2.142a
    text: |-
      1 De NPO, de landelijke publieke media-instellingen en de instellingen die door Onze Minister zijn aangewezen voor
      het in stand houden en exploiteren van omroeporkesten, omroepkoren en een muziekbibliotheek, van een media-archief
      en van een expertisecentrum voor media-educatie, richten hun bestuurlijke organisatie zodanig in dat er een helder
      onderscheid is tussen het dagelijks bestuur en het onafhankelijke toezicht daarop.

      2 De NPO en de landelijke publieke media-instellingen volgen daarbij zoveel als mogelijk aanbevelingen uit de
      gedragscode, bedoeld in [artikel 2.3, tweede lid][ref1].

      3 Dit artikel is ten aanzien kerkgenootschappen en genootschappen op geestelijke grondslag alleen van toepassing op
      de rechtspersonen, bedoeld in de [artikelen 2.42, eerste lid][ref2], en [2.49, derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.3
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.42
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel2.49
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.142a
