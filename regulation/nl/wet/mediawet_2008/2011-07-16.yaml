  - number: '2.55'
    text: |-
      1 De raad van bestuur bevordert dat tussen de NPO en de landelijke publieke media-instellingen afspraken tot
      stand komen over de kwantitatieve en kwalitatieve doelstellingen voor het media-aanbod en het publieksbereik op de
      aanbodkanalen en over de wederzijdse inspanningen daarvoor.

      2 De instellingen:

      a. stellen het media-aanbod dat zij ter uitvoering van hun publieke taak verzorgen ter beschikking voor
      verspreiding op de aanbodkanalen; en

      b. zorgen voor voldoende gebruiksrechten op dat media-aanbod voor verspreiding, hergebruik en ontsluiting op de
      aanbodkanalen.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.55
  - number: '2.56'
    text: |-
      1 Voor de coördinatie en ordening van het programma-aanbod op een algemeen televisieprogrammakanaal wordt de raad
      van bestuur bijgestaan door een redactie die als volgt is samengesteld:

      a. de omroepverenigingen, de educatieve media-instelling, de NOS en de NPS van wie een door de raad van bestuur
      te bepalen belangrijk deel van de uren, bedoeld in [artikel 2.51, eerste lid][ref1], is ingedeeld op het
      desbetreffende programmakanaal tussen de uren waarvoor een evenwichtige verdeling is gemaakt als bedoeld in
      [artikel 2.54, eerste lid][ref2], benoemen elk één lid; en

      b. de kerkgenootschappen en genootschappen op geestelijke grondslag van wie uren zijn ingedeeld op het
      desbetreffende programmakanaal benoemen gezamenlijk één lid.

      2 Voor de coördinatie en ordening van het programma-aanbod op een radioprogrammakanaal wordt de raad van bestuur
      bijgestaan door een redactie waarin de instellingen van wie uren op het desbetreffende programmakanaal zijn
      ingedeeld elk één lid benoemen.

      3 Het lidmaatschap van een redactie is onverenigbaar met het lidmaatschap van een toezichts- of bestuursorgaan van
      de NPO of een landelijke publieke media-instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.51
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.54
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.56
