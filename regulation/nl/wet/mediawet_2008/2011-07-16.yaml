  - number: '2.47'
    text: |-
      1 Het Commissariaat trekt een aanwijzing in als een kerkgenootschap of genootschap op geestelijke grondslag:

      a. niet meer voldoet aan de eisen voor aanwijzing; of

      b.

      2 Het Commissariaat kan een aanwijzing intrekken als het Commissariaat aan het kerkgenootschap of
      genootschap op geestelijke grondslag binnen een jaar ten minste twee maal een bestuurlijke sanctie als
      bedoeld in [titel 7.2][ref1] heeft opgelegd wegens overtreding van het bepaalde bij of krachtens deze wet of
      [artikel 5:20 van de Algemene wet bestuursrecht][ref2].

      3 Het Commissariaat kan op verzoek van de raad van bestuur een aanwijzing intrekken als de raad van bestuur aan een
      kerkgenootschap of genootschap op geestelijke grondslag binnen de periode waarvoor de aanwijzing geldt twee maal
      een sanctie als bedoeld in [artikel 2.154][ref3] is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Hoofdstuk7
