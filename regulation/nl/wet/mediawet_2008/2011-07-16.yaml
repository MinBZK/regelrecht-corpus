  - number: '2.178'
    text: |-
      1 De landelijke publieke media-instellingen richten hun administratie zodanig in dat daaruit te allen tijde de
      voor de uitvoering van de taken van de raad van bestuur en het Commissariaat benodigde informatie op eenduidige en
      vergelijkbare wijze verkregen kan worden.

      2 De raad van bestuur bevordert dat de instellingen een eenduidige financiële boekhouding voeren.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.178
  - number: '2.179'
    text: |-
      Deze afdeling is op kerkgenootschappen en genootschappen op geestelijke grondslag van toepassing voor zover
      het betreft de activiteiten en financiën die betrekking hebben op de verzorging van programma-aanbod en daaraan
      gerelateerd ander media-aanbod voor de landelijke publieke mediadienst.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.179
  - number: '2.180'
    text: |-
      1 De instellingen die door Onze Minister zijn aangewezen voor het in stand houden en exploiteren van
      omroeporkesten, omroepkoren en een muziekbibliotheek , van een media-archief en van een expertisecentrum voor
      media-educatie dienen eenmaal per vijf jaar bij Onze Minister een meerjarenplan voor de volgende periode van vijf
      jaar in.

      2 De meerjarenplannen zijn afgestemd op het voor de desbetreffende periode geldende concessiebeleidsplan voor de
      landelijke publieke mediadienst.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.180
  - number: '2.181'
    text: |-
      1 De instellingen dienen jaarlijks vóór 15 september een begroting in bij Onze Minister.

      2 De instellingen dienen jaarlijks vóór 1 mei bij Onze Minister een jaarrekening over het voorafgaande kalenderjaar
      in.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.181
  - number: '2.182'
    text: |-
      1 De meerjarenplannen en de jaarrekeningen behoeven de instemming van Onze Minister.

      2 Met betrekking tot de meerjarenplannen hoort Onze Minister de NPO.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.182
  - number: '2.183'
    text: |-
      1 Onze Minister stelt uit de rijksmediabijdrage en de inkomsten van de Ster, aan de instellingen een bijdrage in de
      kosten ter beschikking.

      2 Onze Minister kan aan een besluit tot het ter beschikking stellen van bijdragen voorschriften verbinden.

      3 Als een instelling niet voldoet aan de [artikelen 2.180][ref1] en [2.181][ref2] of de aan een besluit tot het ter
      beschikking stellen van bijdragen verbonden voorschriften niet naleeft, kan Onze Minister:

      a. de beschikking waarbij de desbetreffende instelling is aangewezen, intrekken; of

      b. het besluit tot het ter beschikking stellen van bijdragen intrekken of wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.180
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.181
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.183
