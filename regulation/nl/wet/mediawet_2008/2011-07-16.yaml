  - number: '2.68'
    text: |-
      1 Een aanwijzing kan door het Commissariaat worden ingetrokken als:

      a. de regionale of lokale publieke media-instelling in een periode van een jaar geen media-aanbod dat voldoet aan
      de eisen van deze wet heeft verzorgd en dat aanbod gedurende een ononderbroken periode van ten minste twee maanden
      is verspreid; of

      b. het Commissariaat aan de regionale of lokale publieke media-instelling binnen een periode van een jaar ten
      minste twee maal een bestuurlijke sanctie als bedoeld in [titel 7.2][ref1] heeft opgelegd voor overtreding van het
      bepaalde bij of krachtens deze wet of [artikel 5:20 van de Algemene wet bestuursrecht][ref2].

      2 Het Commissariaat beslist pas over intrekking op grond van het eerste lid, onderdeel a, nadat hij Gedeputeerde
      Staten, respectievelijk het College van Burgemeester en Wethouders van de desbetreffende provincie of gemeente
      in de gelegenheid heeft gesteld binnen een door het Commissariaat te stellen redelijke termijn hun zienswijze te
      geven.

      3 Het uitblijven van een zienswijze binnen de gestelde termijn staat aan het nemen van een beslissing door het
      Commissariaat niet in de weg.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel520
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.68
