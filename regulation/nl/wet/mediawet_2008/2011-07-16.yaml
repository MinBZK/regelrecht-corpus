  - number: '2.15'
    text: |-
      1 De NPO verstrekt Onze Minister desgevraagd alle inlichtingen met betrekking tot de werkzaamheden van de NPO.

      2 Onze Minister kan inzage verlangen in zakelijke gegevens en bescheiden van de NPO voor zover dat voor de
      vervulling van zijn taak nodig is.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.15
  - number: '2.16'
    text: |-
      1 Als de NPO naar de mening van Onze Minister zijn taken ernstig verwaarloost, kan Onze Minister na overleg met de
      NPO de noodzakelijke voorzieningen treffen.

      2 Onze Minister stelt de Tweede Kamer der Staten-Generaal onverwijld in kennis van de door hem getroffen
      voorzieningen.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.16
  - number: '2.17'
    text: |-
      1 De NPO stelt jaarlijks vóór 1 juni een jaarverslag over het afgelopen kalenderjaar vast.

      2 In het jaarverslag wordt aandacht besteed aan de werkzaamheden van de NPO, het gevoerde beleid in het algemeen en
      de doelmatigheid en doeltreffendheid van de werkwijze in het bijzonder.

      3 De NPO zendt het verslag aan Onze Minister en maakt het openbaar.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.17
  - number: '2.18'
    text: |-
      1 Wijzigingen in de statuten van de NPO behoeven de instemming van Onze Minister.

      2 De raad van toezicht en de raad van bestuur kunnen niet besluiten tot ontbinding van de NPO.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.18
  - number: '2.19'
    text: |-
      1 Voor de verwezenlijking van de publieke mediaopdracht op landelijk niveau wordt bij koninklijk besluit aan de NPO
      een concessie verleend.

      2 De concessie geldt voor tien jaar en treedt in werking met ingang van een in het koninklijk besluit te bepalen
      tijdstip.

      3 Voor de toepassing van de [artikelen 2.20][ref1], [2.29][ref2] en [2.43, eerste lid][ref3], bestaat de
      concessieperiode uit twee perioden van vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.20
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.29
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel2.43
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.20'
        hoofdstuk: '2'
        paragraaf: 2.2.1.4
        afdeling: 2.2.1
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2.29'
        hoofdstuk: '2'
        afdeling: 2.2.2
      - id: ref3
        bwb_id: BWBR0025028
        artikel: '2.43'
        hoofdstuk: '2'
        afdeling: 2.2.4
  - number: '2.20'
    text: |-
      1 Voorafgaand aan de concessieverlening en vóór aanvang van de tweede periode van vijf jaar van de concessieperiode
      dient de NPO een concessiebeleidsplan voor de komende vijf jaar in bij Onze Minister.

      2 Het concessiebeleidsplan bevat in elk geval:

      a. een beschrijving van de wijze waarop in de komende vijf jaar de publieke mediaopdracht op landelijk niveau
      wordt uitgevoerd, tevens uitgewerkt in kwantitatieve en kwalitatieve doelstellingen voor het media-aanbod en het
      publieksbereik van de landelijke publieke mediadienst;

      b. aard en aantal van de programmakanalen en de daarvoor gewenste frequentieruimte;

      c. aard en aantal van de overige aanbodkanalen;

      d. een onderbouwd overzicht van de naar verwachting benodigde organisatorische, personele, materiële en financiële
      middelen; en

      e. een beschrijving van de samenwerking met de Wereldomroep, regionale en lokale publieke media-instellingen en
      anderen.

      3 Bij ministeriële regeling kunnen regels gesteld worden over de inrichting van het concessiebeleidsplan en het
      tijdstip van indiening.

      4 De raad van bestuur stelt het concessiebeleidsplan vast na overleg met in elk geval de landelijke publieke
      media-instellingen en, voor zover het de samenwerking betreft, de betrokken regionale en lokale publieke media-
      instellingen en de Wereldomroep.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.20
  - number: '2.21'
    text: |-
      1 De NPO maakt het concessiebeleidsplan openbaar.

      2 Over het concessiebeleidsplan vraagt Onze Minister advies aan het Commissariaat en de Raad voor cultuur.

      3 Het concessiebeleidsplan behoeft de instemming van Onze Minister voor zover het betreft de onderwerpen, bedoeld
      in [artikel 2.20, tweede lid, onderdelen b en c][ref1], waarbij de instemming geschiedt met inachtneming van
      [artikel 3.3, tweede lid, van de Telecommunicatiewet][ref2].

      4 Als de NPO wijzigingen wil aanbrengen in het door Onze Minister goedgekeurde deel van het concessiebeleidsplan,
      neemt zij die op in de begroting. Het eerste en tweede lid zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.20
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3.3
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.21
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.20'
        hoofdstuk: '2'
        paragraaf: 2.2.1.4
        afdeling: 2.2.1
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3.3'
  - number: 2.21a
    text: |-
      1 [Artikel 2.21, derde lid][ref1], is niet van toepassing, als bij wijze van experiment van beperkte omvang of
      duur media-aanbod via andere aanbodkanalen dan die, bedoeld in [artikel 2.20, tweede lid, onderdelen b en c][ref2],
      wordt aangeboden. Een experiment dient om te onderzoeken of deze aanbodkanalen een bijdrage kunnen leveren aan de
      verwezenlijking van de publieke media-opdracht op landelijk niveau.

      2 Bij algemene maatregel van bestuur wordt bepaald wanneer sprake is van beperkte omvang of duur en kunnen nadere
      regels worden gesteld over het uitvoeren van experimenten.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.21
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.20
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.21a
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.21'
        hoofdstuk: '2'
        paragraaf: 2.2.1.4
        afdeling: 2.2.1
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2.20'
        hoofdstuk: '2'
        paragraaf: 2.2.1.4
        afdeling: 2.2.1
  - number: '2.22'
    text: |-
      1 Mede op basis van het concessiebeleidsplan sluiten Onze Minister en de NPO een prestatieovereenkomst voor de duur
      van het concessiebeleidsplan.

      2 De prestatieovereenkomst bevat afspraken over:

      a. kwalitatieve en kwantitatieve doelstellingen voor het media-aanbod en het publieksbereik van de landelijke
      publieke mediadienst;

      b. maatregelen bij niet naleving, voor zover mogelijk binnen het bepaalde bij of krachtens deze wet; en

      c. tussentijdse wijziging in verband met veranderende inzichten of omstandigheden.

      3 De prestatieovereenkomst heeft geen betrekking op de inhoud van het media-aanbod van de landelijke publieke
      mediadienst.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.22
  - number: '2.24'
    text: |-
      1 Onze Minister kan eens in de vijf jaar aan omroepverenigingen erkenningen en voorlopige erkenningen verlenen voor
      de verzorging van media-aanbod voor de landelijke publieke mediadienst volgens de bepalingen van deze afdeling.

      2 Omroepverenigingen zijn verenigingen die:

      a. rechtspersoon naar Nederlands recht met volledige rechtsbevoegdheid zijn;

      b. zich volgens de statuten uitsluitend of hoofdzakelijk ten doel stellen ter uitvoering van de publieke
      mediaopdracht op landelijk niveau media-aanbod te verzorgen en alle activiteiten te verrichten die nodig zijn om
      daarmee een publieke taak van algemeen nut te vervullen;

      c. zich volgens de statuten ten doel stellen in het media-aanbod een bepaalde, in de statuten aangeduide
      maatschappelijke, culturele, godsdienstige of geestelijke stroming te vertegenwoordigen en zich in het media-aanbod
      te richten op de bevrediging van in de samenleving levende maatschappelijke, culturele of godsdienstige dan wel
      geestelijke behoeften;

      d. hun leden op democratisch aanvaardbare wijze invloed geven op het beleid; en

      e. een jaarlijkse contributie van ten minste € 5,72 heffen waarin de verstrekking van een programmablad niet is
      begrepen.

      3 Het in het tweede lid, onderdeel e, genoemde bedrag kan bij algemene maatregel van bestuur naar aanleiding van de
      door het Centraal Bureau voor de Statistiek vastgestelde consumentenprijsindex worden aangepast.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.24
  - number: '2.25'
    text: |-
      Voor een erkenning komen slechts in aanmerking omroepverenigingen die:

      a. in de voorafgaande erkenningsperiode een erkenning of een voorlopige erkenning hadden;

      b. ten minste 150 000 leden hebben; en

      c. op 31 december van het jaar voorafgaand aan dat waarin die erkenning ingaat, een reserve als bedoeld in
      [artikel 2.174a][ref1] hebben waarvan het saldo nihil of positief is.

      De hoogte van het saldo, bedoeld in de eerste volzin, wordt aangetoond door overlegging van de jaarrekening,
      bedoeld in [artikel 2.171, tweede lid][ref2], die vergezeld gaat van een verklaring van een accountant als bedoeld
      in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.174a
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.171
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.25
