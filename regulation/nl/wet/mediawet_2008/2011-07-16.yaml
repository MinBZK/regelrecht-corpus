  - number: '4.5'
    text: Van een beschikking tot erkenning en intrekking van een erkenning wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel4.5
  - number: '4.6'
    text: |-
      1 Dit hoofdstuk is van overeenkomstige toepassing op het overige media-aanbod van de publieke mediadiensten.

      2 Een media-instelling die een commerciële mediadienst op aanvraag als bedoeld in [artikel 3.29a][ref1] verzorgt,
      zorgt ervoor dat het media-aanbod dat de lichamelijke, geestelijke of zedelijke ontwikkeling van personen jonger
      dan zestien jaar ernstige schade zou kunnen toebrengen, uitsluitend zodanig beschikbaar wordt gesteld dat zij dat
      aanbod normaliter niet te horen of te zien krijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3.29a
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: 3.29a
        hoofdstuk: '3'
  - number: '5.1'
    text: |-
      1 Bij algemene maatregel van bestuur wordt een lijst vastgesteld van evenementen die, wanneer zij als een
      televisieprogramma worden verspreid, in ieder geval worden verspreid op een open televisieprogrammakanaal, en kan
      worden bepaald welke van die evenementen tevens worden aangemerkt als evenementen als bedoeld in artikel 3 undecies
      van de Europese richtlijn.

      2 Een evenement kan op de lijst worden geplaatst als in ieder geval wordt voldaan aan twee van de volgende
      voorwaarden:

      a. het evenement is van algemeen belang voor de Nederlandse samenleving;

      b. het evenement is van bijzondere culturele betekenis;

      c. het evenement werd in het verleden ook al op een open televisieprogrammakanaal uitgezonden en kon rekenen op een
      grote kijkdichtheid; en

      d. het gaat om een groot internationaal sportevenement waaraan een nationaal team deelneemt.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel5.1
  - number: '5.2'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld ter uitvoering van de verplichting,
      bedoeld in [artikel 5.1, eerste lid][ref1], waarbij in ieder geval wordt bepaald of de op de lijst genoemde
      evenementen, wanneer zij als televisieprogramma worden verspreid, in ieder geval worden verspreid op een open
      televisieprogrammakanaal door middel van volledige of gedeeltelijke rechtstreekse verslaggeving dan wel door middel
      van volledige of gedeeltelijke uitgestelde verslaggeving.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel5.1
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '5.1'
        hoofdstuk: '5'
  - number: '5.3'
    text: |-
      1 Publieke media-instellingen en commerciële media-instellingen oefenen verworven verspreidingsrechten die
      betrekking hebben op evenementen die zijn vermeld op de lijst van evenementen uit overeenkomstig de krachtens
      [artikel 5.2][ref1] gestelde regels.

      2 De instellingen oefenen na 30 juli 1997 verworven uitzendrechten uit overeenkomstig de regels die door andere
      lidstaten van de Europese Unie overeenkomstig artikel 3 undecies, eerste lid, van de Europese richtlijn zijn
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel5.2
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '5.2'
        hoofdstuk: '5'
  - number: '5.4'
    text: |-
      1 Aanbieders van omroepdiensten die exclusieve rechten hebben verworven ten aanzien van evenementen van groot
      belang, stellen korte fragmenten daarvan tegen vergoeding ter beschikking van andere aanbieders van omroepdiensten
      in de Europese Gemeenschap die daarom verzoeken. De verzoekende aanbieder van een omroepdienst is vrij in de keuze
      van fragmenten van evenementen van groot belang.

      2 Korte fragmenten duren maximaal 90 seconden per evenement en mogen onbeperkt worden herhaald binnen één etmaal.
      Als de wedstrijdbepalende sportmomenten van het evenement samen langer duren dan 90 seconden en de weergave zich
      beperkt tot die sportmomenten, mogen korte fragmenten bij uitzondering maximaal 180 seconden duren.

      3 Voor verspreiding van de korte fragmenten gelden de volgende voorwaarden:

      a. korte fragmenten worden uitsluitend opgenomen in dagelijks geprogrammeerde algemene nieuwsprogramma’s;

      b. korte fragmenten worden, indien het wedstrijdbepalende sportmomenten betreft, niet eerder verspreid dan nadat de
      exclusieve rechten van het evenement, voor volledig rechtstreekse en gedeeltelijk uitgestelde verslaggeving, voor
      de eerste maal zijn gebruikt; en

      c. tijdens de verspreiding van een kort fragment wordt de bron vermeld, tenzij dat om praktische redenen niet
      mogelijk is.

      4 Alleen de media-instelling die korte fragmenten overeenkomstig het derde lid verspreidt, kan het desbetreffende
      programma in identieke vorm als media-aanbod van haar mediadienst op aanvraag aanbieden.

      5 Een speeldag van een sportcompetitie of sportevenement wordt als één evenement beschouwd.

      6 De vergoeding voor een kort fragment bedraagt niet meer dan de extra kosten die rechtstreeks voortkomen uit het
      verschaffen van toegang tot het signaal.

      7 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over het ter beschikking stellen van korte
      fragmenten en het gebruik daarvan.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel5.4
  - number: '6.1'
    text: |-
      1 Het Commissariaat wijst jaarlijks een aantal uren op de algemene programmakanalen van de landelijke publieke
      mediadienst toe aan politieke partijen die bij de laatstgehouden verkiezing van de leden van de Tweede of Eerste
      Kamer der Staten-Generaal een of meer zetels hebben verworven.

      2 Het Commissariaat wijst een aantal uren op de algemene programmakanalen van de landelijke publieke mediadienst
      toe aan:

      a. politieke partijen die in alle kieskringen aan de verkiezing van de leden van de Tweede Kamer der Staten-
      Generaal deelnemen; en

      b. politieke partijen die in Nederland aan de verkiezing van de leden van het Europese Parlement deelnemen.

      3 De uren, bedoeld in het tweede lid, zijn beschikbaar in een door het Commissariaat te bepalen periode die
      onmiddellijk vooraf gaat aan de dag die in Nederland voor de desbetreffende verkiezing is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel6.1
  - number: '6.2'
    text: |-
      1 Als een politieke partij op grond van de [artikelen 137c][ref1], [137d][ref2], [137e][ref3], [137f][ref4],
      [137g][ref5] of [429quater van het Wetboek van Strafrecht][ref6] is veroordeeld tot een onvoorwaardelijke
      geldboete, wijst het Commissariaat in afwijking van [artikel 6.1, eerste en tweede lid][ref7], aan deze politieke
      partij geen uren toe gedurende een periode die ingaat op de dag waarop de veroordeling onherroepelijk is geworden.
      Deze periode is:

      a. één jaar, bij een geldboete van minder dan € 1 125;

      b. twee jaar, bij een geldboete van € 1 125 of meer, maar minder dan € 2 250;

      c. drie jaar, bij een geldboete van € 2 250 of meer, maar minder dan € 3 375; en

      d. vier jaar, bij een geldboete van € 3 375 of meer.

      2 Als aan de lijst van een politieke partij aan de lijst waarvan op de dag waarop de veroordeling onherroepelijk
      wordt op grond van de [Kieswet][ref8] geen zetels zijn toegewezen, op grond van een verkiezing die plaatsvindt
      binnen een periode van twee jaar na die dag één of meer zetels worden toegewezen, gaat de periode gedurende welke
      aan deze politieke partij geen uren als bedoeld in [artikel 6.1, eerste lid][ref9], worden toegewezen, in op de dag
      waarop de verkiezing heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel137c
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel137d
