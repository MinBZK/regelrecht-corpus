        artikel: '2.72'
        hoofdstuk: '2'
        paragraaf: 2.4.1
  - number: '2.187'
    text: |-
      1 De evaluatiecommissies kunnen aanbevelingen doen over de wijze waarop aan de publieke mediaopdracht in de komende
      jaren uitvoering wordt gegeven.

      2 De evaluatiecommissies brengen op een bij ministeriële regeling te bepalen tijdstip rapport uit aan de raad van
      toezicht van de NPO, respectievelijk de raad van toezicht van de Wereldomroep, die het aan Onze Minister zenden en
      openbaar maken.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.187
  - number: '2.188'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden criteria vastgesteld op basis waarvan afzonderlijke
      landelijke publieke media-instellingen worden geëvalueerd als bedoeld in [artikel 2.186, eerste lid][ref1].

      2 De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet gedaan
      dan nadat het ontwerp in de Staatscourant is bekendgemaakt en aan een ieder de gelegenheid is geboden om binnen
      vier weken na de dag waarop de bekendmaking is geschied, wensen en bedenkingen ter kennis van Onze Minister te
      brengen. Gelijktijdig met de bekendmaking wordt het ontwerp aan de beide kamers der Staten-Generaal overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.186
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.188
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.186'
        hoofdstuk: '2'
  - number: '3.1'
    text: |-
      1 Onverminderd het bepaalde bij of krachtens de Telecommunicatiewet is het verzorgen van een commerciële
      omroepdienst alleen toegestaan met toestemming van het Commissariaat.

      2 Als een commerciële media-instelling meerdere programmakanalen verzorgt, is voor ieder programmakanaal
      afzonderlijk toestemming nodig.

      3 Als een commerciële media-instelling het door een derde aangeleverde programma-aanbod van een programmakanaal
      wijzigt, heeft die commerciële media-instelling voor het gewijzigde programmakanaal toestemming nodig.

      4 Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop aanvragen voor een toestemming worden
      ingediend.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel3.1
  - number: '3.2'
    text: |-
      1 Een toestemming wordt op aanvraag verleend en geldt voor vijf jaar.

      2 Een toestemming is niet overdraagbaar en vervalt van rechtswege na afloop van de toestemmingsperiode.

      3 In de toestemming wordt aangegeven of deze betrekking heeft op televisieomroep of op radio-omroep.

      4 Op grond van een toestemming voor televisieomroep is het tevens toegestaan teletekst te verzorgen.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel3.2
  - number: '3.3'
    text: |-
      1

      2 Het Commissariaat kan een aanvraag afwijzen als:

      a. de door de aanvrager bij de aanvraag verstrekte gegevens onjuist of onvolledig zijn; of

      b. redelijkerwijs te verwachten is dat de aanvrager zich niet zal houden aan het bepaalde bij of krachtens deze
      wet.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel3.3
  - number: '3.4'
    text: |-
      1 Het Commissariaat trekt een toestemming in als de commerciële media-instelling:

      a. daarom verzoekt;

      b. in gebreke blijft met de betaling van de verschuldigde toezichtskosten, bedoeld in [artikel 3.30][ref1]; of

      c.

      2 Het Commissariaat kan een toestemming intrekken als de commerciële media-instelling:

      a. bij de aanvraag onjuiste of onvolledige gegevens verstrekt blijkt te hebben; of

      b. overigens niet voldoet aan het bepaalde bij of krachtens deze wet of
      [artikel 5:20 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3.30
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel520
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '3.30'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 5:20
  - number: '3.5'
    text: |-
      1 Een commerciële media-instelling bepaalt, onverminderd het bepaalde bij of krachtens deze wet, vorm en inhoud van
      het door haar verzorgde programma-aanbod en is daar verantwoordelijk voor.

      2 Een commerciële media-instelling brengt in overeenstemming met de werknemers die zijn belast met de verzorging en
      samenstelling van het programma-aanbod een redactiestatuut tot stand waarin de journalistieke rechten en plichten
      van deze werknemers worden geregeld.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel3.5
  - number: 3.5a
    text: |-
      1 Reclame- en telewinkelboodschappen, gesponsord programma-aanbod en productplaatsing zijn als zodanig herkenbaar.

      2 In reclame- en telewinkelboodschappen, gesponsord programma-aanbod en programma-aanbod met productplaatsing
      worden geen subliminale technieken gebruikt.

      3 Het programma-aanbod bevat geen sluikreclame.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel3.5a
  - number: '3.6'
    text: |-
      1 Een commerciële media-instelling die reclame- of telewinkelboodschappen in het programma-aanbod opneemt, is
      aangesloten bij de Nederlandse Reclame Code of een vergelijkbare door de Stichting Reclame Code tot stand gebrachte
      regeling en ter zake onderworpen aan het toezicht van de Stichting Reclame Code.

      2 Aansluiting wordt aangetoond door een schriftelijke verklaring van de Stichting Reclame Code aan het
      Commissariaat over te leggen.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel3.6
  - number: '3.7'
    text: |-
      1 Reclame- en telewinkelboodschappen zijn door akoestische, visuele of ruimtelijke middelen duidelijk onderscheiden
      van de overige inhoud van het programma-aanbod.

      2 Het programma-aanbod bevat geen reclame- en telewinkelboodschappen voor:

      a. medische behandelingen; en

      b. alcoholhoudende dranken tussen 06.00 uur en 21.00 uur.

      3 In de naam van een programmakanaal mogen namen of (beeld-)merken van personen, bedrijven of instellingen op
      neutrale wijze worden vermeld of getoond.

      4 Het Commissariaat kan nadere regels stellen voor de vermelding of vertoning, bedoeld in het derde lid, welke
      regels de goedkeuring behoeven van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel3.7
  - number: '3.8'
    text: |-
      1 Het programma-aanbod op een programmakanaal bestaat voor ten hoogste twaalf minuten per uur uit reclame- of
      telewinkelboodschappen.

      2 Met inachtneming van deze afdeling kunnen in het programma-aanbod bestaande uit het verslag of de weergave van
      sportevenementen afzonderlijke reclame- of telewinkelboodschappen worden geplaatst en in het overige programma-
      aanbod bij uitzondering.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel3.8
  - number: '3.9'
    text: |-
      1 In het programma-aanbod op een programmakanaal duren blokken van telewinkelboodschappen zonder onderbreking ten
      minste vijftien minuten.

      2 Blokken van telewinkelboodschappen zijn gedurende de gehele duur daarvan door visuele en akoestische middelen
      duidelijk als zodanig herkenbaar.

      3 [Artikel 3.8, eerste en tweede lid][ref1], is niet van toepassing op de telewinkelblokken.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3.8
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '3.8'
        hoofdstuk: '3'
        afdeling: 3.2.2
  - number: '3.10'
    text: |-
      1 In programma’s worden alleen reclame- of telewinkelboodschappen opgenomen als deze geen afbreuk doen aan de
      integriteit, het karakter of de samenhang van het desbetreffende programma of aan de rechten van rechthebbenden.

      2 In programma’s die bestaan uit de weergave van kerkelijke of geestelijke samenkomsten worden geen reclame- of
      telewinkelboodschappen opgenomen.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel3.10
  - number: '3.11'
    text: |-
      In de volgende programma’s worden ten hoogste eenmaal per geprogrammeerd tijdvak van dertig minuten reclame- of
      telewinkelboodschappen opgenomen:

      a. programma’s bestaande uit films;

      b. programma’s bestaande uit nieuws of commentaar op het nieuws; en

      c. programma’s die in het bijzonder bestemd zijn voor kinderen jonger dan twaalf jaar, mits de geprogrammeerde duur
      van het programma meer dan dertig minuten bedraagt.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel3.11
  - number: '3.13'
    text: |-
      In televisieprogramma’s die bestaan uit het verslag van een evenement worden alleen reclame- of
      telewinkelboodschappen opgenomen tijdens de in het evenement voorkomende gebruikelijke pauzes of tussen de daarin
      voorkomende gebruikelijke zelfstandige onderdelen.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel3.13
  - number: '3.14'
    text: |-
      1 In afwijking van de [artikelen 3.8][ref1] en [3.11][ref2] mag een televisieprogrammakanaal worden verzorgd dat:

      a. uitsluitend bestaat uit ten behoeve van zelfpromotie uitgezonden reclameboodschappen; of

      b. uitsluitend bestaat uit telewinkelboodschappen.

      2 In het programma-aanbod van een televisieprogrammakanaal als bedoeld in het eerste lid mogen andere
      reclameboodschappen worden opgenomen met inachtneming van de bepalingen die gelden voor het opnemen van
      reclameboodschappen in televisieprogramma-aanbod.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3.8
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel3.11
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '3.8'
        hoofdstuk: '3'
        afdeling: 3.2.2
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '3.11'
        hoofdstuk: '3'
        afdeling: 3.2.2
  - number: '3.15'
    text: |-
      1 Programma-aanbod wordt alleen gesponsord als in het redactiestatuut, bedoeld in [artikel 3.5, tweede lid][ref1],
      waarborgen zijn opgenomen voor de redactionele onafhankelijkheid van de werknemers die belast zijn met de
      verzorging en samenstelling van het programma-aanbod ten opzichte van de sponsors.

      2 Programma-aanbod bestaande uit nieuws, actualiteiten of politieke informatie wordt niet gesponsord.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3.5
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '3.5'
        hoofdstuk: '3'
        afdeling: 3.2.1
  - number: '3.16'
    text: |-
      1 Bij gesponsord programma-aanbod wordt ter informatie van het publiek duidelijk vermeld dat en door wie het
      programma-aanbod is gesponsord.

      2 De vermelding is zodanig vormgegeven dat:

      a. tussen 06.00 uur en 21.00 uur de vermelding van sponsors die zich bezighouden met de productie of verkoop van
      alcoholhoudende dranken, geschiedt door neutrale vermelding of vertoning van naam of (beeld)merk; en

      b. in andere gevallen dan bedoeld in onderdeel a, de vermelding geschiedt door vermelding of vertoning van naam,
      (beeld)merk of ander onderscheidend teken en het publiek niet rechtstreeks door middel van specifieke aanprijzingen
      wordt aangespoord tot het kopen of huren van producten of afname van diensten van de sponsors.

      3 Bij een gesponsord programma vindt de vermelding plaats aan het begin of het einde van het programma en kan de
      vermelding daarnaast plaatsvinden aan het begin of het einde van de in het programma opgenomen reclameboodschap
      of reclameboodschappen.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel3.16
  - number: '3.17'
    text: |-
      1 In gesponsord programma-aanbod mogen:

      a. onverminderd [afdeling 3.2.3A][ref1], producten of diensten van sponsors worden vermeld of getoond; en

      b. in de titel de naam, het (beeld)merk, producten of diensten van sponsors worden vermeld of getoond.

      2 Het vermelden en vertonen als bedoeld in het eerste lid mogen het publiek niet door middel van specifieke
      aanprijzingen aansporen tot het kopen of huren van producten of afname van diensten van de sponsors.

      3 Het Commissariaat kan nadere regels stellen voor de vertoning of vermelding in de titel, welke regels de
      goedkeuring behoeven van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0025028
        hoofdstuk: '3'
        afdeling: 3.2.3a
  - number: '3.18'
    text: |-
      1 Als gesponsord programma-aanbod uit het buitenland is aangekocht en daar als programma naar het publiek is
      verspreid, zijn de [artikelen 3.15 tot en met 3.17][ref1] van toepassing voor zover sponsorbijdragen worden
      verstrekt voor de aankoop van het programma.

      2 [Artikel 3.16, eerste tot en met derde lid][ref2], is van overeenkomstige toepassing als een andere instelling
      dan bedoeld in de begripsomschrijving van sponsoring in [artikel 1.1][ref3] een bijdrage heeft gegeven voor de
      productie of aankoop van programma-aanbod om de verspreiding daarvan te bevorderen of mogelijk te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3.15
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel3.16
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '3.15'
        hoofdstuk: '3'
        afdeling: 3.2.3
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '3.16'
        hoofdstuk: '3'
        afdeling: 3.2.3
      - id: ref3
        bwb_id: BWBR0025028
        artikel: '1.1'
        hoofdstuk: '1'
  - number: '3.19'
    text: |-
      1 Bij programma-aanbod dat bestaat uit het verslag of de weergave van een evenement dat niet voornamelijk
      bestemd is om als programma te worden uitgezonden, mogen de namen of (beeld)merken van die personen, bedrijven of
      instellingen, die een financiële of andere bijdrage hebben gegeven voor de totstandkoming van het evenement worden
      vermeld of getoond.

      2 [Artikel 3.16, tweede en derde lid][ref1], is van overeenkomstige toepassing.

      3 Het eerste en tweede lid zijn niet van toepassing op situaties die vallen onder het verbod op sponsoring op grond
      van [artikel 5 van de Tabakswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3.16
      [ref2]: https://wetten.overheid.nl/BWBR0004302#Artikel5
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '3.16'
        hoofdstuk: '3'
        afdeling: 3.2.3
      - id: ref2
        bwb_id: BWBR0004302
        artikel: '5'
  - number: 3.19a
    text: |-
      1 Productplaatsing in het programma-aanbod, voor zover dat aanbod is geproduceerd na 19 december 2009, is niet
      toegestaan.

      2 Tenzij het programma-aanbod in het bijzonder bestemd is voor kinderen jonger dan twaalf jaar, is het eerste lid
      niet van toepassing op programma-aanbod bestaande uit:

      a. films;

      b. series;

      c. sportprogramma’s; en

      d. lichte amusementsprogramma’s.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel3.19a
  - number: 3.19b
    text: |-
      1 Productplaatsing mag alleen voorkomen als in het redactiestatuut, bedoeld in [artikel 3.5, tweede lid][ref1],
      waarborgen zijn opgenomen voor de redactionele onafhankelijkheid van de werknemers die belast zijn met de
      verzorging en samenstelling van het programma-aanbod in verband met productplaatsing.

      2 Productplaatsing in het programma-aanbod is zodanig vormgegeven dat:

      a. het publiek niet rechtstreeks door middel van specifieke aanprijzingen wordt aangespoord tot het kopen of huren
      van producten of afname van diensten; en

      b. het betrokken product geen overmatige aandacht krijgt.

      3 Productplaatsing is niet toegestaan voor:

      a. medische behandelingen; en

      b. alcoholhoudende dranken tussen 06.00 uur en 21.00 uur.

      4 Bij programma-aanbod waarin productplaatsing is opgenomen wordt ter informatie van het publiek duidelijk vermeld
      dat het programma-aanbod voorzien is van productplaatsing. De vermelding geschiedt op passende wijze en vindt
      plaats aan het begin en het einde van het programma en eveneens aan het begin of het einde van de in het programma
      opgenomen reclameboodschap of reclameboodschappen.

      5 Het Commissariaat kan nadere regels stellen over de toepassing van productplaatsing in programma-aanbod, welke
      regels de goedkeuring behoeven van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3.5
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel3.19b
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '3.5'
        hoofdstuk: '3'
        afdeling: 3.2.1
  - number: 3.19c
    text: |-
      Als programma-aanbod waarin productplaatsing is opgenomen uit het buitenland is aangekocht en daar als programma
      naar het publiek is verspreid, is [artikel 3.19b, eerste tot en met derde lid][ref1], niet van toepassing als dat
      aanbod niet is geproduceerd door of in opdracht van de commerciële media-instelling dan wel door of in opdracht van
      een aan haar verbonden onderneming die het programma-aanbod heeft aangekocht.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3.19b
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel3.19c
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: 3.19b
        hoofdstuk: '3'
        afdeling: 3.2.3a
  - number: '3.20'
    text: |-
      1 Op een televisieprogrammakanaal bestaat het programma-aanbod voor ten minste vijftig procent van de duur uit
      Europese producties in de zin van artikel 1 van de Europese richtlijn.

      2 Het Commissariaat kan in bijzondere gevallen ten aanzien van een bepaalde commerciële media-instelling tijdelijk
      gedeeltelijke ontheffing verlenen van het eerste lid, met dien verstande dat het percentage niet lager gesteld kan
      worden dan tien. Het Commissariaat kan aan een ontheffing voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel3.20
  - number: '3.21'
    text: |-
      1 Op een televisieprogrammakanaal bestaat het programma-aanbod uit ten minste tien procent van de duur uit
      producties als bedoeld in [artikel 3.20, eerste lid][ref1], die kunnen worden aangemerkt als onafhankelijke
      producties.

      2 Ten minste een derde deel van de producties, bedoeld in het eerste lid, is niet ouder dan vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3.20
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel3.21
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '3.20'
        hoofdstuk: '3'
        paragraaf: 3.2.4.1
        afdeling: 3.2.4
  - number: '3.22'
    text: |-
      1 Als onafhankelijke productie wordt aangemerkt programma-aanbod dat niet geproduceerd is door:

      a. een publieke media-instelling;

      b. een commerciële media-instelling;

      c. een buitenlandse omroepinstelling;

      d. een rechtspersoon waarin een instelling als bedoeld in de onderdelen a, b of c, al dan niet door middel van een
      of meer dochtermaatschappijen, een belang van meer dan vijfentwintig procent heeft;

      e. een rechtspersoon waarin twee of meer instellingen als bedoeld in de onderdelen a, b of c, al dan niet door
      middel van een of meer van hun onderscheidene dochtermaatschappijen, samen een belang van meer dan vijftig procent
      hebben; of

      f. een vennootschap waarin een instelling als bedoeld in de onderdelen a, b, of c, of een of meer van haar
      dochtermaatschappijen, als vennoot volledig jegens schuldeisers aansprakelijk is voor de schulden.

      2 Bij algemene maatregel van bestuur:

      a. kunnen nadere regels worden gesteld over de toepassing van dit artikel en de [artikelen 3.20][ref1] en
      [3.21][ref2]; en

      b. kan worden bepaald dat in andere dan de in het eerste lid bedoelde gevallen programma-aanbod wordt aangemerkt
      als onafhankelijke productie.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3.20
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel3.21
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '3.20'
        hoofdstuk: '3'
        paragraaf: 3.2.4.1
        afdeling: 3.2.4
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '3.21'
        hoofdstuk: '3'
        paragraaf: 3.2.4.1
        afdeling: 3.2.4
  - number: '3.23'
    text: |-
      1 Voor de toepassing van de [artikelen 3.20 tot en met 3.22][ref1] blijft buiten beschouwing programma-aanbod dat:

      a. bestaat uit nieuws;

      b. betrekking heeft op sport;

      c. het karakter van een spel heeft, met uitzondering van programma’s van culturele of educatieve aard, die mede het
      karakter van een spel hebben;

      d. bestaat uit reclameboodschappen en telewinkelboodschappen, inclusief omlijsting, en zelfpromotie;

      e. bestaat uit stilstaande beelden; en

      f. bestaat uit teletekst.

      2 De [artikelen 3.20 tot en met 3.22][ref2] zijn niet van toepassing op:

      a. programma-aanbod dat in slechts één gemeente of een beperkt aantal aan elkaar grenzende gemeenten kan worden
      ontvangen;

      b. programma-aanbod als bedoeld in [artikel 3.14][ref3]; en

      c. programma-aanbod dat uitsluitend bestemd is voor ontvangst in andere staten dan de lidstaten van de Europese
      Unie en dat niet direct of indirect kan worden ontvangen door het publiek in één of meer lidstaten van de Europese
      Unie.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3.20
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel3.20
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel3.14
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '3.20'
        hoofdstuk: '3'
        paragraaf: 3.2.4.1
        afdeling: 3.2.4
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '3.20'
        hoofdstuk: '3'
        paragraaf: 3.2.4.1
        afdeling: 3.2.4
      - id: ref3
        bwb_id: BWBR0025028
        artikel: '3.14'
        hoofdstuk: '3'
        afdeling: 3.2.2
  - number: '3.24'
    text: |-
      1 Op een televisieprogrammakanaal bestaat het programma-aanbod voor ten minste veertig procent uit oorspronkelijk
      Nederlands- of Friestalige producties.

      2 Het Commissariaat kan in bijzondere gevallen geheel of gedeeltelijk ontheffing verlenen van het eerste lid. Het
      Commissariaat kan aan een ontheffing voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel3.24
  - number: '3.25'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over de ondertiteling van televisieprogramma’s,
      waarbij onder meer kan worden bepaald welk percentage van het programma-aanbod, bedoeld in
      [artikel 3.24, eerste lid][ref1], voorzien is van ondertiteling ten behoeve van personen met een auditieve
      beperking.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3.24
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel3.25
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '3.24'
        hoofdstuk: '3'
        paragraaf: 3.2.4.2
        afdeling: 3.2.4
  - number: '3.26'
    text: In het programma-aanbod worden geen films opgenomen buiten de met de rechthebbenden overeengekomen periodes.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel3.26
  - number: '3.28'
    text: |-
      Als inbreuk op het auteursrecht op enig geschrift inhoudende opgaven van uit te zenden programma-aanbod,
      geproduceerd door of in opdracht van een commerciële media-instelling, wordt voor de burgerrechtelijke
      aansprakelijkheid mede beschouwd het verveelvoudigen of openbaar maken van lijsten of andere opgaven van dat
      programma-aanbod anders dan met toestemming van de desbetreffende instelling, tenzij wordt bewezen dat de gegevens
      in die lijsten of andere opgaven niet direct of indirect zijn ontleend aan enig geschrift als in dit artikel
      bedoeld.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel3.28
  - number: '3.29'
    text: |-
      De [artikelen 3.8][ref1], [3.9, eerste en derde lid][ref2], [3.10, tweede lid][ref3], [3.11 tot en met 3.14][ref4]
      en [3.19 tot en met 3.26][ref5] zijn niet van toepassing op programma-aanbod dat niet direct of indirect buiten
      Nederland ontvangen kan worden en dat:

      a. voor zover het de beeldinhoud betreft uitsluitend of nagenoeg uitsluitend bestaat uit stilstaande beelden; of

      b. hoofdzakelijk bestaat uit informatie over programma-aanbod en andere diensten die via een omroepzender of
      omroepnetwerk worden aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3.8
