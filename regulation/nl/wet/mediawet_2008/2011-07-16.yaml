  - number: '2.4'
    text: De organen van de NPO zijn een raad van toezicht, een raad van bestuur en een college van omroepen.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.4
  - number: '2.5'
    text: |-
      1 De raad van toezicht bestaat uit een voorzitter en ten hoogste zes andere leden die op voordracht van Onze
      Minister bij koninklijk besluit worden benoemd, geschorst en ontslagen.

      2 Voor een van de andere leden kunnen de gezamenlijke ondernemingsraden van de NPO, de NOS, de NPS en de
      omroepverenigingen en de educatieve media-instelling die een erkenning als bedoeld in [artikel 2.24][ref1]
      onderscheidenlijk [artikel 2.28][ref2] hebben verkregen personen voor benoeming aanbevelen.

      3 Benoeming geschiedt voor vijf jaar en herbenoeming voor een aansluitende periode is eenmaal mogelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.24
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.28
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.24'
        hoofdstuk: '2'
        afdeling: 2.2.2
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2.28'
        hoofdstuk: '2'
        afdeling: 2.2.2
  - number: '2.6'
    text: |-
      1 Het lidmaatschap van de raad van toezicht is onverenigbaar met:

      a. het lidmaatschap van het college van omroepen;

      b. het lidmaatschap van de raad van bestuur;

      c. het lidmaatschap van een orgaan van of een dienstbetrekking bij een publieke media-instelling;

      d. het lidmaatschap van een orgaan van of een dienstbetrekking bij een commerciële media-instelling;

      e. het lidmaatschap van een van beide Kamers der Staten-Generaal, een provinciaal bestuur of een gemeentebestuur;

      f. een dienstbetrekking bij een ministerie of bij een dienst, instelling of bedrijf vallende onder de
      verantwoordelijkheid van een minister; en

      g. het hebben van financiële of andere belangen bij bedrijven of instellingen en het vervullen van nevenfuncties
      waardoor een goede vervulling van de functie of de handhaving van de onafhankelijkheid van het betrokken lid of van
      het vertrouwen daarin in het geding kan zijn.

      2 Schorsing en ontslag zijn mogelijk wegens:

      a. ongeschiktheid;

      b. disfunctioneren; en

      c. onverenigbaarheid als bedoeld in het eerste lid.

      3 Ontslag is verder mogelijk op eigen verzoek.

      4 De leden van de raad van toezicht ontvangen van de NPO een door Onze Minister vast te stellen vergoeding.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.6
  - number: '2.7'
    text: |-
      1 De raad van toezicht houdt toezicht op het beleid van de raad van bestuur en op de algemene gang van zaken bij
      de NPO, het functioneren van de raad van bestuur als toezichthouder bij de NOS en de uitvoering van de publieke
      mediaopdracht op landelijk niveau en staat de raad van bestuur met advies terzijde.

      2 De raad van toezicht is verder belast met:

      a. het vaststellen van de jaarrekening van de NPO; en

      b. het wijzigen van de statuten van de NPO, op voorstel van de raad van bestuur;

      3 Bij de vervulling van hun taak richten de leden van de raad van toezicht zich naar het gemeenschappelijke belang
      van de landelijke publieke mediadienst.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.7
  - number: '2.8'
    text: |-
      1 De raad van bestuur bestaat uit een voorzitter en twee andere leden die worden benoemd, geschorst en ontslagen
      door de raad van toezicht.

      2 Benoeming geschiedt voor vijf jaar en herbenoeming voor een aansluitende periode is eenmaal mogelijk.

      3 Besluiten tot benoeming, schorsing of ontslag behoeven de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.8
  - number: '2.9'
    text: |-
      1 Op het lidmaatschap van de raad van bestuur is
      [artikel 2.6, eerste lid, aanhef en onderdelen a en c tot en met g][ref1], van overeenkomstige toepassing, met
      dien verstande dat [artikel 2.6, eerste lid, onderdeel c][ref2], niet van overeenkomstige toepassing is op het
      lidmaatschap van een orgaan van de Ster.

      2 De leden van de raad van bestuur zijn in dienst van de NPO. De raad van toezicht stelt hun arbeidsvoorwaarden
      vast.

      3 [Artikel 668a, eerste tot en met vierde lid, van Boek 7 van het Burgerlijk Wetboek][ref3] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.6
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.6
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel668a
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.9
