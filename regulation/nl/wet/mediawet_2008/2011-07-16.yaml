  - number: '2.184'
    text: |-
      1 De NPO en de Wereldomroep evalueren regelmatig de wijze waarop uitvoering wordt gegeven aan de publieke
      mediaopdracht.

      2 Een evaluatie vindt in elk geval eens in de vijf jaar plaats.

      3 Als in de rapportage, bedoeld in [artikel 2.186, eerste lid][ref1], is vastgesteld dat een omroepvereniging
      of de educatieve media-instelling onvoldoende heeft bijgedragen aan de uitvoering van de publieke mediaopdracht
      op landelijk niveau door de wijze waarop zij uitvoering heeft gegeven aan de publieke taak, bedoeld in
      [artikel 2.24, tweede lid, onderdeel b][ref2], onderscheidenlijk [artikel 2.28, tweede lid, onderdeel b][ref3],
      vindt in afwijking van het tweede lid in elk geval binnen twee jaar na het tijdstip waarop deze rapportage is
      uitgebracht, een nieuwe evaluatie plaats van de wijze waarop de desbetreffende omroepvereniging of de educatieve
      media-instelling uitvoering geeft aan deze publieke taak.

      4 Als in de rapportage, bedoeld in [artikel 2.186, eerste lid][ref4], betreffende de vorige evaluatie is
      vastgesteld dat de NPS onvoldoende heeft bijgedragen aan de uitvoering van de publieke mediaopdracht op landelijk
      niveau door de wijze waarop zij uitvoering heeft gegeven aan haar publieke taak, bedoeld in [artikel 2.35][ref5],
      vindt in afwijking van het tweede lid in elk geval binnen twee jaar na het tijdstip waarop deze rapportage is
      uitgebracht, een nieuwe evaluatie plaats.

      5 Als in de rapportage, bedoeld in [artikel 2.186, eerste lid][ref6], betreffende de vorige evaluatie is
      vastgesteld dat de NOS onvoldoende heeft bijgedragen aan de uitvoering van de publieke mediaopdracht op landelijk
      niveau door de wijze waarop zij uitvoering heeft gegeven aan haar publieke taak, bedoeld in [artikel 2.34a][ref7],
      vindt in afwijking van het tweede lid in elk geval binnen twee jaar na het tijdstip waarop deze rapportage is
      uitgebracht, een nieuwe evaluatie plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.186
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.24
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel2.28
