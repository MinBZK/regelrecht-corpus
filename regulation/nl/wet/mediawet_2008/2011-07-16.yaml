  - number: '2.155'
    text: De raad van bestuur beslist jaarlijks vóór 1 januari over de verdeling van de budgetten.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.155
  - number: '2.157'
    text: |-
      1 De landelijke publieke media-instellingen ontvangen voorschotten volgens bij ministeriële regeling te stellen
      regels.

      2 Als een instelling zijn jaarrekening, bedoeld in [artikel 2.171, tweede lid][ref1], niet tijdig indient:

      a. verzoekt het Commissariaat de raad van bestuur de bevoorschotting met twintig procent te verminderen; en

      b. kan het Commissariaat de raad van bestuur verzoeken de bevoorschotting verder te verminderen of te beëindigen
      wanneer ondanks herhaalde aanmaningen van het Commissariaat de instelling in gebreke blijft met het indienen van
      de jaarrekening.

      3 Als een instelling voorschotten in strijd met het bepaalde bij of krachtens de wet gebruikt, kan de raad van
      bestuur de bevoorschotting verminderen of beëindigen.

      4 De raad van bestuur voldoet meteen aan verzoeken, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.171
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.157
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.171'
        hoofdstuk: '2'
        paragraaf: 2.6.6.1
        afdeling: 2.6.6
  - number: '2.158'
    text: |-
      1 Onze Minister kan uit de rijksmediabijdrage en uit de inkomsten van de Ster ten behoeve van de landelijke
      publieke mediadienst gelden ter beschikking stellen voor door Onze Minister daarbij vast te stellen bijzondere
      doelen.

      2 Onze Minister stelt de gelden door tussenkomst van het Commissariaat ter beschikking van de raad van bestuur.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.158
  - number: '2.159'
    text: |-
      1 Onze Minister kan aan een besluit tot het ter beschikking stellen van gelden voorschriften verbinden.

      2 Voorschriften hebben geen betrekking op de specifieke inhoud van media-aanbod.

      3 Onze Minister kan een besluit tot het ter beschikking stellen van gelden intrekken of wijzigen als de
      voorschriften niet worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.159
  - number: '2.160'
    text: |-
      1 De Wereldomroep dient jaarlijks vóór 15 september een begroting in bij Onze Minister en het Commissariaat.

      2 De begroting bevat in ieder geval:

      a. een beschrijving van de wijze waarop door de Wereldomroep uitvoering zal worden gegeven aan de publieke
      mediaopdracht;

      b. een opgave van de financiële middelen die voor het volgende kalenderjaar nodig zijn om de voornemens van de
      Wereldomroep te verwezenlijken en een raming voor de daarop volgende vier jaar;

      c. een toelichting op de onderscheiden onderdelen en begrotingsposten, waaronder die voor personeel, organisatie en
      de organen van de Wereldomroep; en

      d. een beschrijving van de samenwerking met de NOS.

      3 De financiële middelen worden als volgt onderverdeeld:

      a. de kosten van de verzorging van het media-aanbod van de Wereldomroep;

      b. de kosten die niet rechtstreeks samenhangen met de verzorging van het media-aanbod;

      c. de kosten van het verspreiden van het media-aanbod van de Wereldomroep; en

      d. de eigen inkomsten die moeten worden gebruikt voor de uitvoering van de publieke taak.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.160
  - number: '2.161'
    text: |-
      De begroting bevat verder:

      a. een beschrijving van de wijze waarop in het afgelopen kalenderjaar uitvoering is gegeven aan de publieke
      mediaopdracht; en

      b. een opgave van het door de Wereldomroep in zijn media-aanbod op te nemen aanbod dat:

      1°. is geproduceerd door of in opdracht van landelijke publieke media-instellingen; of

      2°. al als onderdeel van het media-aanbod van de landelijke publieke mediadienst is verspreid.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.161
  - number: '2.162'
    text: |-
      1 Bij ministeriële regeling kunnen nadere regels worden gesteld over de inhoud en inrichting van de begroting.

      2 Het Commissariaat zendt vóór 15 oktober zijn opmerkingen met betrekking tot de begroting aan Onze Minister.

      3 De Wereldomroep maakt de begroting openbaar.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.162
  - number: '2.163'
    text: |-
      Onze Minister stelt jaarlijks vóór 1 december de budgetten voor het komende kalenderjaar vast voor:

      a. de verzorging van het media-aanbod van de Wereldomroep;

      b. de kosten die niet direct samenhangen met de verzorging van het media-aanbod; en

      c. het verspreiden van het media-aanbod.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.163
  - number: '2.164'
    text: |-
      1 Onze Minister stelt de budgetten ter beschikking van de Wereldomroep door tussenkomst van het Commissariaat.

      2 Onze Minister stelt de budgetten vast op tachtig procent van de overeenkomstige budgetten voor het voorgaande
      jaar als de Wereldomroep de begroting niet volgens de daarvoor geldende regels heeft ingediend.

      3 De Wereldomroep besteedt de budgetten aan de in [artikel 2.163][ref1] genoemde doelen.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.163
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.164
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.163'
        hoofdstuk: '2'
        paragraaf: 2.6.3.2
        afdeling: 2.6.3
  - number: '2.165'
    text: |-
      1 De Wereldomroep ontvangt voorschotten volgens bij ministeriële regeling te stellen regels.

      2 Als de Wereldomroep zijn jaarrekening, bedoeld in [artikel 2.171, tweede lid][ref1], niet tijdig indient:

      a. vermindert het Commissariaat de bevoorschotting met twintig procent; en

      b. kan het Commissariaat de bevoorschotting verder verminderen of beëindigen wanneer ondanks herhaalde aanmaningen
      van het Commissariaat de Wereldomroep in gebreke blijft met het indienen van de jaarrekening.

      3 Als de Wereldomroep voorschotten in strijd met het bepaalde bij of krachtens de wet gebruikt, kan het
      Commissariaat de bevoorschotting verminderen of beëindigen.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.171
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.165
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.171'
        hoofdstuk: '2'
        paragraaf: 2.6.6.1
        afdeling: 2.6.6
  - number: '2.166'
    text: |-
      1 Onze Minister kan uit de rijksmediabijdrage en de inkomsten van de Ster een algemene mediareserve vormen die
      bestemd is voor:

      a. de opvang van dalende inkomsten van de Ster;

      b. bijdragen in reorganisatiekosten als gevolg van overheidsbesluiten; en

      c. de financiering van de door het Commissariaat aan te houden rekening-courantverhouding voor de betalingen ter
      uitvoering van deze wet.

      2 Het Commissariaat beheert de algemene mediareserve.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.166
  - number: '2.167'
    text: |-
      1 Onze Minister kan, voor zover dat de financiering van de rekening-courantverhouding niet in gevaar brengt, uit de
      algemene mediareserve gelden ter beschikking stellen ten behoeve van:

      a. de NPO en de landelijke publieke media-instellingen;

      b. de Wereldomroep; en

      c. de door hem aangewezen instellingen voor het in stand houden en exploiteren van omroepkoren, omroeporkesten en
      een muziekbibliotheek, van een media-archief en van een expertisecentrum voor media-educatie.

      2 Onze Minister stelt gelden ten behoeve van de landelijke publieke media-instellingen door tussenkomst van het
      Commissariaat ter beschikking aan de raad van bestuur.

      3 Onze Minister stelt gelden ten behoeve van de Wereldomroep en de instellingen, bedoeld in het eerste lid,
      onderdeel c, door tussenkomst van het Commissariaat aan hen ter beschikking.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.167
  - number: '2.168'
    text: |-
      1 Renteopbrengsten uit het beheer van de algemene mediareserve zijn bestemd voor door Onze Minister te bepalen
      mediadoeleinden in brede zin.

      2 Onze Minister kan uit de renteopbrengsten gelden ter beschikking stellen aan de NPO, aan de landelijke publieke
      media-instellingen en aan de Wereldomroep.

      3 [Artikel 2.167, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.167
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.168
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.167'
        hoofdstuk: '2'
        afdeling: 2.6.4
  - number: '2.169'
    text: |-
      [Artikel 2.159][ref1] is van overeenkomstige toepassing op het ter beschikking stellen van gelden op grond van de
      [artikelen 2.167][ref2] en [2.168][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.159
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.167
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel2.168
