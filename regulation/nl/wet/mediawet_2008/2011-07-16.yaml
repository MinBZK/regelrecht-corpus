  - number: '2.136'
    text: |-
      1 Omroepverenigingen die een erkenning of een voorlopige erkenning als bedoeld in [artikel 2.24][ref1] hebben
      verkregen, kunnen netto inkomsten uit contributies en verenigingsactiviteiten en, tot ten hoogste een bij algemene
      maatregel van bestuur te bepalen bedrag en volgens bij algemene maatregel van bestuur te stellen nadere regels uit
      programmabladen gebruiken voor verenigingsactiviteiten.

      2 Verenigingsactiviteiten zijn activiteiten die:

      a. redelijkerwijs nodig zijn voor het goed functioneren van de vereniging en haar organen; of

      b. die gebruikelijk zijn in een actief functionerende vereniging om de band met en tussen de leden te versterken.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.24
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.136
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.24'
        hoofdstuk: '2'
        afdeling: 2.2.2
  - number: '2.137'
    text: |-
      1 Het Commissariaat stelt regels over het verstrekken van op geld waardeerbare voordelen aan leden en over
      activiteiten in het kader van ledenwerving.

      2 De regels behoeven de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.137
  - number: '2.138'
    text: |-
      1 Als een omroepvereniging voornemens is na afloop van de periode waarvoor een erkenning of een voorlopige
      erkenning is verleend een commerciële omroepdienst te verzorgen of een belang te verwerven in een commerciële
      media-instelling, meldt zij dit aan het Commissariaat.

      2 Na de melding kan de omroepvereniging in het laatste jaar van de erkenningperiode activiteiten verrichten
      die noodzakelijk zijn om te zorgen dat zij of de rechtspersoon waarin zij een belang verwerft na afloop van de
      erkenningperiode een commerciële omroepdienst kan verzorgen.

      3 Tijdens de periode dat een omroepvereniging activiteiten als bedoeld in het tweede lid verricht, is
      [artikel 2.33, eerste lid][ref1], niet van toepassing en wordt zij beschouwd als omroepvereniging.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.33
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.138
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.33'
        hoofdstuk: '2'
        afdeling: 2.2.2
  - number: 2.138a
    text: |-
      1 Wanneer een omroepvereniging uitvoering geeft aan het voornemen, bedoeld in [artikel 2.138, eerste lid][ref1],
      draagt zij zo spoedig mogelijk na afloop van de periode waarvoor een erkenning of een voorlopige
      erkenning als bedoeld in [artikel 2.24][ref2], is verleend, zorg voor de vaststelling van een
      eindafrekening. De eindafrekening gaat vergezeld van een verklaring van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref3]. [Artikel 2.171, eerste lid][ref4], is van
      overeenkomstige toepassing.

      2 Mede op basis van de eindafrekening, bedoeld in het eerste lid, stelt het Commissariaat het terug te betalen
      bedrag vast. Teruggevorderde bedragen voegt het Commissariaat toe aan de algemene mediareserve, bedoeld in
      [artikel 2.166][ref5].

      3 In het geval, bedoeld in het eerste lid:

      a. betaalt de omroepvereniging de op het moment, bedoeld in [artikel 2.138, eerste lid][ref6], aanwezige gelden die
      bestemd zijn voor de verzorging van media-aanbod voor de landelijke publieke omroep, terug aan het Commissariaat;

      b. draagt de omroepvereniging er zorg voor dat programmamateriaal dat verspreid is op de programmakanalen van de
      landelijke publieke omroep dan wel daarvoor is geproduceerd of aangekocht en de daaraan verbonden programmaformats,
      namen en merken, voor zover het auteurs- of gebruiksrecht daarop bij de omroepvereniging berust, gedurende drie
      jaar na afloop van de periode waarvoor een erkenning of voorlopige erkenning is verleend, om niet ter beschikking
      wordt gesteld aan de raad van bestuur voor gebruik op aanbodkanalen van de landelijke publieke omroep;

      c. stelt de omroepvereniging het programmamateriaal, bedoeld in onderdeel b, ter beschikking aan de door Onze
      Minister aangewezen instelling voor het in stand houden en exploiteren van een media-archief; en

      d. onthoudt de omroepvereniging zich gedurende drie jaar na afloop van de periode waarvoor een erkenning of
      voorlopige erkenning is verleend, van gebruik of exploitatie van het programmamateriaal, bedoeld in onderdeel a, en
      de daaraan verbonden programmaformats, namen en merken, tenzij daarover met de raad van bestuur een overeenkomst is
      gesloten tegen een marktconforme vergoeding.

      4 Voor de toepassing van dit artikel wordt onder omroepverenging tevens begrepen haar rechtsopvolger of
      rechtsverkrijgende.

      5 Het eerste tot en met vierde lid zijn van overeenkomstige toepassing, als:

      a. aan een omroepvereniging geen erkenning als bedoeld in [artikel 2.24][ref7] of [artikel 2.28][ref8] wordt
      verleend;

      b. een erkenning of voorlopige erkenning overeenkomstig [artikel 2.33][ref9] wordt ingetrokken; en

      c. een omroepvereniging in strijd met [artikel 2.34, eerste lid][ref10], tijdens een erkenningsperiode niet langer
      als omroepvereniging media-aanbod voor de landelijke publieke omroep verzorgt.


