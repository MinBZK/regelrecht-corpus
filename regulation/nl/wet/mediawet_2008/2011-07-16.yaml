  - number: '6.15'
    text: |-
      1 In gemeenten waar een omroepnetwerk aanwezig is, stelt de gemeenteraad een programmaraad in.

      2 De programmaraad is representatief voor de belangrijkste in de gemeente of gemeenten voorkomende
      maatschappelijke, culturele, godsdienstige en geestelijke stromingen en beschikt als geheel over voldoende kennis
      van de informatiebehoeften van bevolkings- en leeftijdsgroepen van verschillende omvang en samenstelling binnen het
      kijk- en luisterpubliek.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel6.15
  - number: '6.16'
    text: |-
      1 Een programmaraad bestaat uit ten minste zeven en ten hoogste vijftien leden, die worden benoemd door de
      gemeenteraad van de gemeente waar het omroepnetwerk aanwezig.

      2 Benoeming geschiedt voor een periode van vier jaar en herbenoeming voor een aansluitende periode is eenmaal
      mogelijk.

      3 De gemeenteraad vervult een vacature zo spoedig mogelijk, maar in ieder geval binnen zes maanden.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel6.16
  - number: '6.17'
    text: |-
      1 In gemeenten waar al een programmaraad functioneert, vindt de instelling en benoeming van de leden van de
      programmaraad plaats na overleg met deze programmaraad.

      2 Als een aantal omroepnetwerken gekoppeld is en daardoor feitelijk als één omroepnetwerk functioneert, stellen de
      betrokken gemeenteraden gezamenlijk één programmaraad in en benoemen zij gezamenlijk de leden.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel6.17
  - number: '6.18'
    text: |-
      1 Voor benoeming tot lid van een programmaraad komen in aanmerking personen die:

      a. woonachtig zijn in het gebied waarop het advies van de programmaraad betrekking heeft; en

      b. aangesloten zijn op het omroepnetwerk in dat gebied dan wel deel uitmaken van een huishouden dat daarop is
      aangesloten.

      2 Met het lidmaatschap van een programmaraad zijn onverenigbaar:

      a. het lidmaatschap van een gemeenteraad in een gemeente die behoort tot het gebied waarop het advies van de
      programmaraad betrekking heeft;

      b. het lidmaatschap van het College van Burgemeester en Wethouders in een gemeente als bedoeld in onderdeel a;

      c. een binding met de aanbieder van het omroepnetwerk dat aanwezig is in het gebied waarop het advies van de
      programmaraad betrekking heeft; en

      d. het lidmaatschap van het bestuur van of een betrekking bij de NPO, een publieke media-instelling of een
      commerciële media-instelling.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel6.18
  - number: '6.19'
    text: |-
      1 Een programmaraad stelt een reglement vast waarin in ieder geval regels zijn opgenomen over:

      a. de wijze waarop de instelling, de taak en de samenstelling van de programmaraad kenbaar wordt gemaakt aan de
      aangeslotenen op het omroepnetwerk in het gebied waarop het advies van de programmaraad betrekking heeft; en

      b. de totstandkoming, de inhoud, de vaststelling, de openbaarmaking en de geldigheidsduur van het advies van de
      programmaraad.

      2 Het reglement voorziet in een transparante adviesprocedure.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel6.19
  - number: '6.20'
    text: |-
      1 De programmaraad adviseert de aanbieder van het omroepnetwerk welk vrij toegankelijk programma-
      aanbod op vijftien omroepnetten voor televisie en vijfentwintig omroepnetten voor radio hij krachtens
      [artikel 6.13, eerste lid][ref1], ten minste verspreidt naar alle aangeslotenen op het netwerk.

      2 De aanbieder van een omroepnetwerk volgt het advies, bedoeld in het eerste lid, tenzij zwaarwichtige redenen zich
      daartegen verzetten.

      3 De aanbieder van een omroepnetwerk kan de programmaraad voorts een advies vragen over het overige vrij
      toegankelijke programma-aanbod dat hij verspreidt naar alle aangeslotenen op het omroepnetwerk.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel6.13
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel6.20
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '6.13'
        hoofdstuk: '6'
        paragraaf: 6.3.1.2
        afdeling: 6.3.1
  - number: '6.21'
    text: |-
      1 De programmaraad maakt bij zijn advisering een duidelijk onderscheid tussen advisering als bedoeld in
      [artikel 6.20, eerste lid][ref1], en advisering als bedoeld in het derde lid van dat artikel.

      2 Onverminderd de [artikelen 6.13][ref2] en [6.14][ref3], gaat de programmaraad in zijn advisering uit van een
      pluriforme samenstelling van het pakket aan vrij toegankelijk programma-aanbod, rekening houdend met de in de
      gemeente levende maatschappelijke, culturele, godsdienstige en geestelijke behoeften.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel6.20
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel6.13
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel6.14
