  - number: '9.16'
    text: |-
      Onze Minister stelt regels ter uitvoering van de artikelen 12, 15 en 16 van de Europese richtlijn, voor zover
      naar het oordeel van Onze Minister een of meer van deze artikelen niet, niet voldoende, niet juist of niet tijdig
      zijn uitgewerkt in de Nederlandse Reclame Code of in een vergelijkbare door de Stichting Reclame Code tot stand
      gebrachte regeling, dan wel de Stichting Reclame Code in gebreke blijft met het toezicht daarop.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel9.16
  - number: '9.17'
    text: |-
      Een wijziging van de Europese richtlijn gaat voor de toepassing van het bepaalde bij of krachtens de
      [artikelen 1.2][ref1], [2.115 tot en met 2.121][ref2], [3.20 tot en met 3.23][ref3], en [hoofdstuk 5][ref4] gelden
      met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel1.2
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.115
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel3.20
