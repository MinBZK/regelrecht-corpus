  - number: '2.61'
    text: |-
      1 Voor de verzorging van de publieke mediadiensten op regionaal en lokaal niveau kan het Commissariaat regionale
      respectievelijk lokale instellingen als publieke media-instellingen aanwijzen volgens de bepalingen van deze
      paragraaf.

      2 Voor aanwijzing komen slechts in aanmerking instellingen die:

      a. rechtspersoon naar Nederlands recht met volledige rechtsbevoegdheid zijn;

      b. zich volgens de statuten uitsluitend of hoofdzakelijk ten doel stellen het op regionaal respectievelijk lokaal
      niveau uitvoeren van de publieke mediaopdracht door het verzorgen van media-aanbod dat gericht is op de bevrediging
      van maatschappelijke behoeften die in een provincie, een gemeente of een deel van de provincie waarop de instelling
      zich richt leven, en het verrichten van alle activiteiten die nodig zijn om daarmee een publieke taak te vervullen;
      en

      c. volgens de statuten een orgaan hebben dat het beleid voor het media-aanbod bepaalt en dat representatief is voor
      de belangrijkste in de desbetreffende provincie of gemeente voorkomende maatschappelijke, culturele, godsdienstige
      en geestelijke stromingen.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.61
  - number: '2.62'
    text: |-
      1 Aanwijzing geschiedt nadat Provinciale Staten hebben dan wel de gemeenteraad heeft geadviseerd over de vraag of
      de instelling aan de eisen, bedoeld in [artikel 2.61, tweede lid][ref1], voldoet.

      2 Een regionale publieke media-instelling wordt alleen aangewezen als Provinciale Staten zich bereid verklaren voor
      de bekostiging ervan zorg te dragen.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.61
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.62
