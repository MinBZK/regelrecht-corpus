        artikel: '393'
  - number: '2.26'
    text: |-
      Voor een voorlopige erkenning komen slechts in aanmerking omroepverenigingen die:

      a. in de voorafgaande erkenningperiode geen erkenning of voorlopige erkenning hadden;

      b. ten minste 50 000 leden hebben;

      c. op 31 december van het jaar voorafgaand aan dat waarin die erkenning ingaat, een reserve als bedoeld in
      [artikel 2.174a][ref1] hebben waarvan het saldo nihil of positief is; en

      d. zich naar stroming als bedoeld in [artikel 2.24, tweede lid, onderdeel c][ref2], en naar voorgenomen media-
      aanbod wat betreft genre, inhoud en doelgroepen zodanig onderscheiden van de omroepverenigingen, bedoeld in
      [artikel 2.25][ref3], dat de verscheidenheid van het media-aanbod van de landelijke publieke mediadienst wordt
      vergroot en een vernieuwende bijdrage wordt geleverd aan de uitvoering van de publieke mediaopdracht op landelijk
      niveau.

      [Artikel 2.25, tweede volzin][ref4], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.174a
