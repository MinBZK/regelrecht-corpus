  - number: '6.23'
    text: |-
      1 Onze Minister, handelend in overeenstemming met het gevoelen van de ministerraad, wijst de frequentieruimte
      in de FM-band aan die wordt gebruikt voor het verspreiden van radioprogramma-aanbod dat overwegend bestaat uit
      Nederlandstalige muziek. Bij ministeriële regeling wordt nader omschreven in welke gevallen radioprogramma-aanbod
      aan deze eis voldoet.

      2 Onze Minister, handelend in overeenstemming met het gevoelen van de ministerraad, wijst andere frequentieruimte
      in de FM-band aan die slechts mag worden gebruikt voor het verspreiden van bij die aanwijzing vast te stellen
      categorieën radioprogramma-aanbod dat, gelet op de aard, inhoud of doelgroep, verhoudingsgewijs lage inkomsten uit
      reclame of verhoudingsgewijs hoge kosten meebrengt.

      3 Als aard en omvang van de frequentieruimte in de FM-band die beschikbaar is voor het verspreiden van
      radioprogramma-aanbod daartoe aanleiding geven, kan Onze Minister, handelend in overeenstemming met het gevoelen
      van de ministerraad, afzien van het aanwijzen van frequentieruimte in de FM-band op grond van het eerste en tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel6.23
  - number: '6.24'
    text: |-
      1 Voor de verspreiding van het radioprogramma-aanbod van eenzelfde instelling wordt niet meer frequentieruimte
      gebruikt dan één FM-frequentie of samenstel van FM-frequenties.

      2 Bij of krachtens algemene maatregel van bestuur wordt bepaald in welke gevallen een aantal met elkaar verbonden
      instellingen voor de toepassing van het eerste lid als één instelling wordt aangemerkt.

      3 Bij of krachtens algemene maatregel van bestuur kan worden afgeweken van het eerste lid als dat wenselijk is
      vanuit een oogpunt van doelmatig gebruik van frequentieruimte, waarbij een onderscheid kan worden gemaakt tussen
      verschillende categorieën frequentieruimte, bestaande uit FM-frequenties en samenstellen van FM-frequenties.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel6.24
  - number: '6.25'
    text: |-
      De [artikelen 6.23][ref1] en [6.24][ref2] zijn niet van toepassing op:

      a. de frequentieruimte die wordt gebruikt voor de verspreiding van programma-aanbod van de publieke mediadiensten;
      en

      b. frequentieruimte die wordt gebruikt ten behoeve van verspreiding via een satelliet.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel6.23
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel6.24
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel6.25
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '6.23'
        hoofdstuk: '6'
        afdeling: 6.3.2
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '6.24'
        hoofdstuk: '6'
        afdeling: 6.3.2
  - number: '6.26'
    text: |-
      1 Bij algemene maatregel van bestuur worden, op voordracht van Onze Minister-President, Minister van Algemene
      Zaken, na overleg met Onze Minister, regels gesteld op grond waarvan in geval van buitengewone omstandigheden
      het gebruik van programmakanalen van de publieke mediadiensten, studio’s en andere faciliteiten, omroepzenders,
      omroepnetwerken en andere hulpmiddelen ter beschikking worden gesteld aan de bij of krachtens die algemene
      maatregel van bestuur aangewezen autoriteiten.

      2 Onze Minister-President, Minister van Algemene Zaken, is bevoegd in de algemene noodtoestand, na overleg met Onze
      Minister, regels te stellen ten aanzien van de inhoud van radio- en televisieprogramma’s en het toezicht daarop,
      waarbij kan worden afgeweken van het bepaalde in [artikel 7.11][ref1].

      3 De in het tweede lid bedoelde bevoegdheid wordt onverwijld beëindigd zodra
      [artikel 31, eerste lid, van de Oorlogswet voor Nederland][ref2] in werking wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel7.11
      [ref2]: https://wetten.overheid.nl/BWBR0007983#Artikel31
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel6.26
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '7.11'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0007983
        artikel: '31'
  - number: '6.27'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over het verzorgen van omroepdiensten die
      uitsluitend bestemd zijn voor de in Nederland gelegerde militairen van buitenlandse strijdkrachten en hun gezinnen.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel6.27
  - number: '7.1'
    text: |-
      1 Er is een Commissariaat voor de Media.

      2 Het Commissariaat heeft rechtspersoonlijkheid en is gevestigd in de gemeente Hilversum.

      3 Het Commissariaat is belast met de uitvoering van taken die hem zijn opgedragen bij of krachtens deze wet en
      andere wetten.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel7.1
  - number: '7.2'
    text: |-
      Op het Commissariaat is de [Kaderwet zelfstandige bestuursorganen][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0020495
  - number: '7.3'
    text: |-
      1 Het Commissariaat bestaat uit een voorzitter en twee of vier andere leden.

      2 Een benoeming geschiedt voor vijf jaar en herbenoeming voor een aansluitende periode is eenmaal mogelijk.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel7.3
  - number: '7.4'
    text: |-
      Onverminderd [artikel 13 van de Kaderwet zelfstandige bestuursorganen][ref1] zijn onverenigbaar met het
      lidmaatschap van het Commissariaat:

      a. het lidmaatschap van een van beide Kamers der Staten-Generaal, een provinciaal bestuur of een gemeentebestuur;

      b. een dienstbetrekking bij een ministerie, een dienst, instelling of bedrijf vallende onder de
      verantwoordelijkheid van een minister; en

      c. het lidmaatschap van een orgaan van of een dienstbetrekking bij de NPO, een publieke media-instelling, een
      commerciële media-instelling of een uitgever van een persorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel13
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '13'
  - number: '7.5'
    text: |-
      1 Het Commissariaat neemt besluiten bij meerderheid van stemmen.

      2 Het Commissariaat kan alleen met instemming van alle leden aan één of meer van zijn leden mandaat en machtiging
      verlenen voor het uitvoeren van delen van zijn taak.

      3 Het Commissariaat stelt inzake zijn besluitvorming en werkwijze een bestuursreglement vast.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel7.5
  - number: '7.6'
    text: De kosten van het Commissariaat worden door Onze Minister vergoed op basis van de door hem goedgekeurde begroting.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel7.6
  - number: '7.7'
    text: |-
      1 Onverminderd [artikel 34 van de Kaderwet zelfstandige bestuursorganen][ref1] dient het Commissariaat jaarlijks
      voor 1 september bij Onze Minister een financieel verslag in over het beheer van de algemene mediareserve, bedoeld
      in [artikel 2.166][ref2].

      2 Het financieel verslag gaat vergezeld van een verklaring omtrent de getrouwheid en de rechtmatigheid, afgegeven
      door een accountant als bedoeld in [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref3] en behoeft de
      instemming van Onze Minister.

      3 Het Commissariaat maakt het financieel verslag openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.166
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2.166'
        hoofdstuk: '2'
        afdeling: 2.6.4
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '7.8'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de inhoud en inrichting van de begroting, het
      financieel verslag en aandachtspunten voor de accountantscontrole.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel7.8
  - number: '7.9'
    text: |-
      1 Het Commissariaat zendt besluiten zo spoedig mogelijk na de bekendmaking aan Onze Minister.

      2 Besluiten van het Commissariaat kunnen binnen acht weken na ontvangst daarvan door Onze Minister dan wel
      gedurende de tijd dat het besluit is geschorst worden vernietigd.

      3 Besluiten van het Commissariaat kunnen binnen acht weken na ontvangst daarvan door Onze Minister worden
      geschorst.

      4 Van een besluit tot schorsing, opheffing of verlenging van de schorsing wordt mededeling gedaan in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel7.9
  - number: '7.10'
    text: |-
      Het Commissariaat plaatst besluiten tot vaststelling van nadere regels op grond van deze wet en tot vaststelling
      van beleidsregels over de uitvoering van zijn taken in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel7.10
  - number: '7.11'
    text: |-
      1 Het Commissariaat is belast met de bestuursrechtelijke handhaving van het bepaalde bij of krachtens deze wet, met
      uitzondering van:

      a. de [artikelen 2.2 tot en met 2.22][ref1], [2.24 tot en met 2.33][ref2], [2.34a tot en met 2.34j][ref3],
      [2.36 tot en met 2.41][ref4], [2.53 tot en met 2.57][ref5], [2.59][ref6], [2.60][ref7],
      [2.73 tot en met 2.87][ref8], [2.125 tot en met 2.131][ref9], [2.143 tot en met 2.145][ref10],
      [2.149][ref11], [2.150, eerste lid][ref12], [2.151, eerste lid][ref13], [2.158][ref14], [2.163][ref15],
      [2.164, eerste en tweede lid][ref16], [2.166 tot en met 2.168][ref17], [2.180 tot en met 2.187][ref18],
      [4.2 tot en met 4.5][ref19] en [6.26][ref20]; en

      b. [hoofdstuk 8][ref21].

      2 Met het toezicht op de naleving zijn belast de leden van het Commissariaat en de bij besluit van het
      Commissariaat aangewezen medewerkers van het Commissariaat.

      3 Van een besluit als bedoeld in het tweede lid wordt mededeling gedaan door plaatsing in de Staatscourant.


