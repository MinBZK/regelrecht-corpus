  - number: '2.151'
    text: |-
      1 Onze Minister stelt de budgetten door tussenkomst van het Commissariaat ter beschikking van de raad van bestuur.

      2 De budgetten, bedoeld in [artikel 2.149, eerste lid, onderdelen g en h][ref1], besteedt de raad van bestuur aan
      de daar genoemde doelen.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.149
    url: https://wetten.overheid.nl/BWBR0025028/2011-07-16#Artikel2.151
