  - number: 2.173a
    text: |-
      1 Het Commissariaat is belast met de rechtmatigheidstoetsing van de uitgaven van de RPO en de regionale publieke
      media-instellingen.

      2 De RPO en de regionale publieke media-instellingen zenden jaarlijks vóór 1 mei de jaarrekening aan het
      Commissariaat.

      3 De [artikelen 2.172][ref1] en [2.173][ref2] zijn van toepassing.


