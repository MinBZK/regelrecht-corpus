  - number: 3.29e
    text: |-
      1 Een media-instelling die een commerciële mediadienst op aanvraag verzorgt, investeert in Nederlands cultureel
      audiovisueel product.

      2 De investering bedraagt vijf procent van de relevante omzet per boekjaar.

      3 De relevante omzet per boekjaar bestaat uit alle in Nederland gegenereerde omzet die verband houdt met het
      aanbieden van de betreffende commerciële mediadienst op aanvraag. Hiertoe wordt gerekend omzet uit:

      a. reclameboodschappen;

      b. abonnementen;

      c. gebruikerstransacties;

      d. sponsoring; en

      e. productplaatsing.

      4 Het eerste lid is niet van toepassing indien de relevante omzet per boekjaar minder dan € 10 miljoen bedraagt.

      5 Het Commissariaat kan een media-instelling als bedoeld in het eerste lid ontheffing verlenen van het eerste lid
      indien toepassing gelet op de aard of het onderwerp van de betreffende mediadienst, of het gebruik van innovatieve
      formats, praktisch onuitvoerbaar of ongerechtvaardigd zou zijn.

      6 Het Commissariaat kan nadere regels stellen over de ontheffing, bedoeld in het vijfde lid, welke regels de
      goedkeuring behoeven van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel3.29e
  - number: 3.29f
    text: |-
      Onder Nederlands cultureel audiovisueel product wordt verstaan een Europese productie in de zin van artikel 1,
      onderdeel n, van de Europese richtlijn, niet zijnde een verslag of de weergave van een of meer sportevenementen of
      sportwedstrijden, die voldoet aan ten minste twee van de volgende voorwaarden, waarvan ten minste één van de onder
      a of b genoemde voorwaarden:

      a. het scenario is voor ten minste 75 procent geschreven in de Nederlandse of Friese taal;

      b. de hoofdpersonages drukken zich voor ten minste 75 procent uit in de Nederlandse of Friese taal;

      c. het scenario is gebaseerd op een origineel literair werk in de Nederlandse of Friese taal;

      d. het hoofdthema houdt verband met de Nederlandse cultuur, geschiedenis, maatschappij of politiek.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel3.29f
  - number: 3.29g
    text: |-
      1 De investering, bedoeld in [artikel 3.29e, eerste lid][ref1], wordt uitgevoerd voordat twee boekjaren zijn
      verstreken sinds het einde van het boekjaar waarin de relevante omzet, bedoeld in artikel 3.29e, is gegenereerd.

      2 Indien een media-instelling in één boekjaar meer investeert dan waartoe hij op grond van [artikel 3.29e][ref2]
      verplicht is, telt het meer geïnvesteerde mee in het daarop volgende boekjaar.

      3 De investering vindt plaats in media-aanbod dat kwalificeert als Nederlands cultureel audiovisueel aanbod en
      bestaat uit:

      a. een investering in een productie of coproductie;

      b. de verkrijging vooraf van een exploitatielicentie ten aanzien van een nog niet voltooide productie; of

      c. de verkrijging van een exploitatielicentie ten aanzien van een productie die op het moment van de verkrijging
      niet ouder is dan vier jaar.

      4 Ten minste de helft van het te investeren bedrag wordt aangewend ten behoeve van media-aanbod dat kwalificeert
      als Nederlands cultureel audiovisueel product en een documentairefilm, documentaireserie, dramaserie of speelfilm
      is.

      5 Ten minste zestig procent van het te investeren bedrag wordt aangewend ten behoeve van onafhankelijke producties
      als bedoeld in [artikel 3.22, eerste lid][ref3]. Artikel 3.22, tweede lid, is van overeenkomstige toepassing.

      6 De investering is uitgevoerd wanneer een of meer overeenkomsten zijn gesloten ten behoeve van een investering of
      verkrijging als bedoeld in het derde lid dan wel, voor zover het betreft een investering, bedoeld in het derde lid,
      onder a, het te investeren bedrag op andere wijze aantoonbaar daarvoor is aangewend.

      7 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de gevolgen voor het uitvoeren
      van de investering van de ontbinding of niet nakoming van een overeenkomst als bedoeld in het vijfde lid, dan wel
      van het niet langer op aantoonbare wijze aanwenden van het te investeren bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3.29e
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel3.29e
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel3.22
