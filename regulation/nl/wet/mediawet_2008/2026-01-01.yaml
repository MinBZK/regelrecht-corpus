  - number: '2.139'
    text: |-
      1 De landelijke publieke media-instellingen stellen de volgende gegevens van hun programma-aanbod ter beschikking
      van de NPO: per programma de titel, een korte omschrijving, de naam van de landelijke publieke media-instelling
      die het programma verzorgt, het programmakanaal waarop het programma wordt verspreid, de datum en het tijdstip van
      verspreiding, en de classificatie, bedoeld in [artikel 4.2][ref1].

      2 De landelijke publieke media-instellingen aanvaarden dat de NPO de gegevens voor vermenigvuldiging en
      openbaarmaking aan het publiek via gedrukte of elektronische programmagidsen ter beschikking stelt aan de
      omroeporganisaties en tegen een marktconforme vergoeding aan andere afnemers die daarom verzoeken.

      3 De landelijke publieke media-instellingen stellen de gegevens, bedoeld in het eerste lid, tijdig ter beschikking
      van de NPO. De NPO stelt die gegevens ten minste zes weken voorafgaand aan de verspreiding van het desbetreffende
      programma-aanbod ter beschikking van de omroeporganisaties en van de andere afnemers, bedoeld in het tweede lid.

      4 De NPO sluit met de andere afnemers, bedoeld in het tweede lid, een overeenkomst met betrekking tot de
      beschikbaarstelling van de gegevens. De overeenkomst bepaalt in elk geval dat de gegevens niet worden gewijzigd, en
      bevat overigens geen bepalingen of voorwaarden die de terbeschikkingstelling van de gegevens hinderen.

      5 Het bedrag van de vergoeding, bedoeld in het tweede lid, is voor zover het betreft afnemers die programmagidsen
      binnen Nederland uitbrengen:

      a. voor gedrukte programmagidsen: € 0,0195 voor elk afgezet exemplaar van een gedrukte programmagids;

      b. voor elektronische programmagidsen die door middel van technische voorzieningen die de ontvangst van
      televisieprogramma’s op digitale wijze mogelijk maken, gevoed of verspreid worden: per maand per huishouden € 0,006
      voor elke zodanige technische voorziening; en

      c. voor overige elektronische programmagidsen: per jaar € 2.500 per elektronische programmagids.

      6 Het Commissariaat kan bij regeling andere bedragen dan de bedragen, bedoeld in het vijfde lid, vaststellen, als
      de resultaten van zijn tweejaarlijks onderzoek naar de marktprijs van de vergoedingen daartoe aanleiding geven.
      Het Commissariaat maakt de resultaten van het onderzoek en de wijze van berekening van de marktprijs van de
      vergoedingen bekend.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel4.2
