  - number: 2.14a
    text: |-
      1 De raad van bestuur benoemt, op voordracht van het college van omroepen, een ombudsman voor de publieke omroep
      voor een periode van drie jaar. Herbenoeming is mogelijk.

      2 De raad van bestuur kan de ombudsman tussentijds ontslaan indien deze, ondanks een voorafgaande waarschuwing van
      het college van omroepen, naar het oordeel van dit college structureel in gebreke blijft.

      3 De raad van bestuur kan voorzien in tijdelijke vervanging van de ombudsman indien deze wegens ziekte of verlof
      langdurig niet in staat is zijn functie te vervullen.

      4 De ombudsman heeft geen financiële of andere belangen bij bedrijven of instellingen en vervult geen nevenfuncties
      waardoor een goede vervulling van de functie of de handhaving van de onafhankelijkheid van de ombudsman of van het
      vertrouwen daarin in het geding kan zijn.

      5 De ombudsman beoordeelt na een klacht of uit eigen beweging het journalistieke handelen van de landelijke
      publieke media-instellingen bij de verzorging van media-aanbod op het gebied van nieuws, informatie en educatie.
      Dit oordeel is niet bindend en de ombudsman kan geen rectificatie afdwingen.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.14a
  - number: '2.15'
    text: |-
      1 De NPO verstrekt Onze Minister desgevraagd alle inlichtingen met betrekking tot de werkzaamheden van de NPO.

      2 Onze Minister kan inzage verlangen in zakelijke gegevens en bescheiden van de NPO voor zover dat voor de
      vervulling van zijn taak nodig is.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.15
  - number: '2.16'
    text: |-
      1 Als de NPO naar de mening van Onze Minister zijn taken ernstig verwaarloost, kan Onze Minister na overleg met de
      NPO de noodzakelijke voorzieningen treffen.

      2 Onze Minister stelt de Tweede Kamer der Staten-Generaal onverwijld in kennis van de door hem getroffen
      voorzieningen.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.16
  - number: '2.17'
    text: |-
      1 De NPO stelt jaarlijks vóór 1 juni een bestuursverslag over het afgelopen kalenderjaar vast.

      2 In het bestuursverslag wordt aandacht besteed aan de werkzaamheden van de NPO, het gevoerde beleid in het
      algemeen en de doelmatigheid en doeltreffendheid van de werkwijze in het bijzonder.

      3 De NPO zendt het verslag aan Onze Minister en maakt het openbaar.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.17
  - number: '2.18'
    text: |-
      1 Wijzigingen in de statuten van de NPO behoeven de instemming van Onze Minister.

      2 De raad van toezicht en de raad van bestuur kunnen niet besluiten tot ontbinding van de NPO.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.18
  - number: '2.19'
    text: |-
      1 Voor de verwezenlijking van de publieke mediaopdracht op landelijk niveau wordt bij koninklijk besluit aan de NPO
      een concessie verleend.

      2 De concessie geldt voor tien jaar en treedt in werking met ingang van een in het koninklijk besluit te bepalen
      tijdstip.

      3 Voor de toepassing van de [artikelen 2.20][ref1] en [2.29][ref2] bestaat de concessieperiode uit twee perioden
      van vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.20
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.29
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.19
