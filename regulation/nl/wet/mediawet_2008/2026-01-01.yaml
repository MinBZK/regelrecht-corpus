  - number: '2.143'
    text: |-
      1 De NPO, de RPO en de publieke media-instellingen voorzien op onafhankelijke wijze in de uitvoering van de
      publieke mediaopdracht en hebben daarvoor op de wijze zoals geregeld in deze wet aanspraak op bekostiging uit ’s
      Rijks kas die een kwalitatief hoogwaardig media-aanbod mogelijk maakt en waardoor continuïteit van financiering
      gewaarborgd is.

      2 Voor de bekostiging van de uitvoering van de publieke mediaopdracht en ter bestrijding van de overige kosten,
      bedoeld in [artikel 2.146][ref1], worden onder de naam «rijksmediabijdrage» jaarlijks gelden beschikbaar gesteld
      door Onze Minister.


