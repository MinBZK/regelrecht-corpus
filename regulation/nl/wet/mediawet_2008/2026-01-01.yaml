  - number: 2.60b
    text: De organen van de RPO zijn een raad van toezicht en een bestuur.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.60b
  - number: 2.60c
    text: |-
      1 De raad van toezicht van de RPO bestaat uit een voorzitter en ten hoogste vier andere leden die op voordracht van
      Onze Minister bij koninklijk besluit worden benoemd, geschorst en ontslagen.

      2 Bij een vacature stelt de raad van toezicht profielschetsen voor de vacature en voor de raad als geheel op
      waarover hij in ieder geval het bestuur van de RPO en de gezamenlijke ondernemingsraden van de regionale publieke
      media-instellingen in de gelegenheid stelt binnen een redelijke termijn zienswijzen te geven.

      3 Na betrekking van de zienswijzen stelt de raad van toezicht de profielschetsen vast en maakt deze openbaar.

      4 Voor de selectie van kandidaten stelt de raad van toezicht een onafhankelijke benoemingsadviescommissie in. De
      benoemingsadviescommissie adviseert de raad van toezicht.

      5 De raad van toezicht geeft een zwaarwegend advies aan Onze Minister voor de voordracht, bedoeld in het eerste
      lid.

      6 Het advies, bedoeld in het vijfde lid, is gemotiveerd, waarbij in elk geval wordt ingegaan op de geschiktheid,
      de profielschetsen, de positie van de kandidaat in het rooster van aftreden en de procedure die heeft geleid tot
      het advies.

      7 Onze Minister neemt het advies over, tenzij het in strijd is met:

      a. deze wet;

      b. eisen van zorgvuldigheid; of

      c. andere zwaarwegende belangen.

      8 Indien Onze Minister het advies niet overneemt, verzoekt hij onder opgave van een schriftelijke motivering de
      raad van toezicht ervoor te zorgen dat tot een nieuw advies wordt gekomen en informeert hij de Tweede Kamer dat een
      advies niet is overgenomen en de grond hiervoor.

      9 Ten behoeve van de ondersteuning bij het opstellen van de profielschetsen door de raad van toezicht en de
      selectie van kandidaten door de benoemingsadviescommissie, schakelt de raad van toezicht een wervingsadviesbureau
      in.

      10 De gezamenlijke ondernemingsraden van de regionale publieke media-instellingen kunnen voor benoeming van een van
      de andere leden als bedoeld in het eerste lid, personen aanbevelen aan de benoemingsadviescommissie.

      11 Benoeming geschiedt voor vijf jaar en herbenoeming voor een aansluitende periode is eenmaal mogelijk.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.60c
  - number: 2.60d
    text: |-
      1 Het lidmaatschap van de raad van toezicht van de RPO is onverenigbaar met:

      a. het lidmaatschap van het bestuur van de RPO;

      b. het lidmaatschap van een orgaan van of een dienstbetrekking bij een publieke media-instelling;

      c. het lidmaatschap van een orgaan van of een dienstbetrekking bij een commerciële media-instelling;

      d. het lidmaatschap van een van beide Kamers der Staten-Generaal, een provinciaal bestuur of een gemeentebestuur;

      e. een dienstbetrekking bij een ministerie of bij een dienst, instelling of bedrijf vallende onder de
      verantwoordelijkheid van een Minister; en

      f. het hebben van financiële of andere belangen bij bedrijven of instellingen en het vervullen van nevenfuncties
      waardoor een goede vervulling van de functie of de handhaving van de onafhankelijkheid van het betrokken lid of van
      het vertrouwen daarin in het geding kan zijn.

      2 Schorsing en ontslag zijn mogelijk wegens:

      a. ongeschiktheid;

      b. disfunctioneren; en

      c. onverenigbaarheid als bedoeld in het eerste lid.

      3 Ontslag is verder mogelijk op eigen verzoek.

      4 De leden van de raad van toezicht van de RPO ontvangen van de RPO een door Onze Minister vast te stellen
      vergoeding.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.60d
  - number: 2.60e
    text: |-
      1 De raad van toezicht van de RPO houdt toezicht op het beleid van het bestuur van de RPO, de algemene gang van
      zaken bij de RPO en de uitvoering van de publieke mediaopdracht op regionaal niveau en staat het bestuur van de RPO
      met advies terzijde.

      2 De raad van toezicht van de RPO is verder belast met:

      a. het vaststellen van de jaarrekening van de RPO; en

      b. het wijzigen van de statuten van de RPO, op voorstel van het bestuur van de RPO.

      3 Bij de vervulling van hun taak richten de leden van de raad van toezicht van de RPO zich naar het
      gemeenschappelijke belang van de regionale publieke mediadienst.

      4 De raad van toezicht stelt een rooster van aftreden voor zijn leden op waarin wordt voorzien dat de leden niet
      allen gelijktijdig aftreden.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.60e
  - number: 2.60f
    text: |-
      1 Het bestuur van de RPO bestaat uit ten hoogste zes leden die worden benoemd, geschorst en ontslagen door de raad
      van toezicht van de RPO.

      2 Benoeming geschiedt voor vijf jaar en herbenoeming voor een aansluitende periode is eenmaal mogelijk.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.60f
  - number: 2.60g
    text: |-
      1 Voor het bestuur van de RPO is [artikel 2.60d, eerste lid, onder c tot en met f][ref1], van overeenkomstige
      toepassing.

      2 Het lidmaatschap van het bestuur van de RPO is onverenigbaar met het lidmaatschap van een orgaan van of een
      dienstbetrekking bij een publieke media-instelling, de regionale publieke media-instellingen uitgezonderd.

      3 De leden van het bestuur van de RPO zijn in dienst van de RPO. De raad van toezicht van de RPO stelt hun
      arbeidsvoorwaarden vast.

      4 [Artikel 668a, eerste tot en met vierde lid, van Boek 7 van het Burgerlijk Wetboek][ref2] is niet van toepassing
      op de leden van het bestuur van de RPO.

      5 Een lid van het bestuur van de RPO kan niet na beëindiging van dat lidmaatschap voor een aansluitende periode
      worden benoemd als lid van de raad van toezicht van de RPO.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.60d
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel668a
