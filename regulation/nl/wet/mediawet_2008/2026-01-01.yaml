  - number: '2.72'
    text: |-
      1 Het media-aanbod van de regionale publieke media-instellingen wordt uitsluitend verspreid via:

      a. een aanbodkanaal als bedoeld in [artikel 2.60l, tweede lid, onder b en c][ref1], waarvoor Onze Minister
      toestemming heeft verleend als bedoeld in [artikel 2.60m, derde lid][ref2];

      b. een aanbodkanaal van de landelijke publieke mediadienst; of

      c. een aanbodkanaal van een lokale publieke media-instelling in het geval van een samenwerkingsovereenkomst als
      bedoeld in [artikel 2.71][ref3].

      2 Het eerste lid, onder a, is niet van toepassing op media-aanbod als bedoeld in [artikel 2.60m1][ref4].


