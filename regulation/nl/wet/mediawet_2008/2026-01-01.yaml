  - number: 2.170a
    text: |-
      1 Als een regionale publieke media-instelling voornemens is na afloop van de periode waarvoor een aanwijzing als
      bedoeld in [artikel 2.61][ref1] is verleend, een commerciële omroepdienst te verzorgen of een belang te verwerven
      in een commerciële media- instelling, meldt zij dit aan het Commissariaat.

      2 Na de melding kan de regionale publieke media-instelling in het laatste jaar van de periode waarvoor een
      aanwijzing is verleend, activiteiten verrichten die noodzakelijk zijn om te zorgen dat zij of de rechtspersoon
      waarin zij een belang verwerft, na afloop van de periode waarvoor die aanwijzing is verleend, een commerciële
      omroepdienst kan verzorgen.

      3 Als een regionale publieke media-instelling uitvoering geeft aan het voornemen, bedoeld in het eerste lid, draagt
      zij binnen vier maanden na afloop van de periode waarvoor een aanwijzing is verleend, zorg voor de vaststelling
      van een eindafrekening. [Artikel 2.138a, eerste lid, tweede, derde en vierde volzin][ref2], is van overeenkomstige
      toepassing.

      4 Mede op basis van de eindafrekening, bedoeld in het derde lid, stelt het Commissariaat het terug te betalen
      bedrag vast. [Artikel 2.138a, tweede lid, tweede volzin][ref3], is van toepassing.

      5 In het geval, bedoeld in het derde lid:

      a. betaalt de regionale publieke media-instelling de op het moment, bedoeld in het eerste lid, aanwezige gelden
      die bestemd zijn voor de verzorging van media-aanbod voor de regionale publieke mediadienst, terug aan het
      Commissariaat;

      b. stelt de regionale publieke media-instelling het programmamateriaal dat verspreid is op de programmakanalen
      van de regionale publieke media-instelling dan wel daarvoor is geproduceerd of aangekocht en de daaraan verbonden
      programmaformats, namen en merken, voor zover het auteurs- en gebruiksrecht bij de regionale publieke media-
      instelling berust, ter beschikking aan de door Onze Minister aangewezen instelling voor het in stand houden en
      exploiteren van een media-archief voor gebruik door andere publieke media-instellingen; en

      c. onthoudt de regionale publieke media-instelling zich gedurende drie jaar na afloop van de periode waarvoor
      de aanwijzing is verleend, van gebruik of exploitatie van het programmamateriaal, bedoeld in onderdeel b, en de
      daaraan verbonden programmaformats, namen en merken, voor zover het auteurs- en gebruiksrecht bij de regionale
      publieke media-instelling berust.

      6 Voor de toepassing van het derde, vierde en vijfde lid wordt onder regionale publieke media-instelling tevens
      begrepen haar rechtsopvolger of rechtsverkrijgende.

      7 Als een regionale publieke media-instelling na afloop van de periode waarvoor een aanwijzing is
      verleend, niet opnieuw wordt aangewezen, draagt zij binnen vier maanden na afloop van de periode
      waarvoor die aanwijzing is verleend, zorg voor de vaststelling van een eindafrekening wat betreft de
      financiën die betrekking hebben op de verzorging van media-aanbod voor de regionale publieke mediadienst.
      [Artikel 2.138a, eerste lid, tweede, derde en vierde volzin][ref4], is van overeenkomstige toepassing. Artikel
      2.138a, tweede lid, is van toepassing.

      8 In het geval, bedoeld in het zevende lid, zijn het vijfde en zesde lid van overeenkomstige toepassing.

      9 Het zevende lid is eveneens van toepassing, als een aanwijzing overeenkomstig [artikel 2.67][ref5] of
      [artikel 2.68][ref6] wordt ingetrokken. [Artikel 2.138a, eerste lid, tweede, derde en vierde volzin][ref7], is van
      overeenkomstige toepassing. Artikel 2.138a, tweede lid, is van toepassing.

      10 In het geval, bedoeld in het negende lid, zijn het vijfde en zesde lid van overeenkomstige toepassing.


