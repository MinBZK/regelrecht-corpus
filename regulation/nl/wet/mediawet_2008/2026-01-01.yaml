  - number: '2.50'
    text: |-
      Gedurende de concessieperiode, bedoeld in [artikel 2.19][ref1], wordt:

      a. op ten minste twee algemene televisieprogrammakanalen en op ten minste vijf algemene radioprogrammakanalen van
      de landelijke publieke mediadienst programma-aanbod verzorgd; en

      b. op ten minste een aanbodkanaal een kosteloze mediadienst op aanvraag verzorgd die is bestemd voor de catch-up
      van de programma’s op de algemene programmakanalen.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.19
