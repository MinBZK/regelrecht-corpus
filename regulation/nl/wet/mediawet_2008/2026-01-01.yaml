        artikel: '2.115'
        hoofdstuk: '2'
        paragraaf: 2.5.4.1
        afdeling: 2.5.4
  - number: '2.117'
    text: |-
      Op elk van de televisieprogrammakanalen van de regionale publieke mediadienst bestaat het programma-aanbod voor ten
      minste tien procent van de duur uit producties als bedoeld in [artikel 2.115][ref1] die kunnen worden aangemerkt
      als onafhankelijke productie.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.115
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.117
    references:
