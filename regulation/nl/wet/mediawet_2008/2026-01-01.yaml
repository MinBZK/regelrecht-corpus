  - number: 2.60n
    text: |-
      1 Mede op basis van het concessiebeleidsplan RPO sluiten Onze Minister en de RPO een prestatieovereenkomst voor de
      duur van het concessiebeleidsplan RPO.

      2 De prestatieovereenkomst bevat afspraken over:

      a. kwalitatieve en kwantitatieve doelstellingen voor het media-aanbod en het publieksbereik van de regionale
      publieke mediadienst;

      b. maatregelen bij niet naleving, voor zover mogelijk binnen het bepaalde bij of krachtens deze wet; en

      c. tussentijdse wijziging in verband met veranderende inzichten of omstandigheden.

      3 De prestatieovereenkomst heeft geen betrekking op de inhoud van het media-aanbod van de regionale publieke
      mediadienst.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.60n
  - number: 2.60o
    text: |-
      De regionale publieke media-instellingen verstrekken desgevraagd aan de raad van toezicht van de RPO, het bestuur
      van de RPO en de door hem daartoe aangewezen medewerkers van de RPO alle inlichtingen voor zover dat voor de
      vervulling van de taken van de raad van toezicht van de RPO en het bestuur van de RPO redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.60o
  - number: '2.61'
    text: |-
      1 Voor de verzorging van de publieke mediadiensten op regionaal en lokaal niveau kan het Commissariaat regionale
      respectievelijk lokale instellingen als publieke media-instellingen aanwijzen volgens de bepalingen van deze
      paragraaf.

      2 Voor aanwijzing komen slechts in aanmerking instellingen die:

      a. rechtspersoon naar Nederlands recht met volledige rechtsbevoegdheid zijn;

      b. zich volgens de statuten uitsluitend of hoofdzakelijk ten doel stellen het op regionaal respectievelijk lokaal
      niveau uitvoeren van de publieke mediaopdracht door het verzorgen van media-aanbod dat gericht is op de bevrediging
      van maatschappelijke behoeften die in een provincie, een gemeente of een deel van de provincie waarop de instelling
      zich richt leven, en het verrichten van alle activiteiten die nodig zijn om daarmee een publieke taak te vervullen;
      en

      c. volgens de statuten een orgaan hebben dat het beleid voor het media-aanbod bepaalt en dat representatief is voor
      de belangrijkste in de desbetreffende provincie of gemeente voorkomende maatschappelijke, culturele, godsdienstige
      en geestelijke stromingen.

      3 Aanwijzing geschiedt nadat provinciale staten hebben dan wel de gemeenteraad heeft geadviseerd over de vraag of
      de instelling aan de eisen, bedoeld in het tweede lid, voldoet.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.61
  - number: '2.62'
    text: |-
      1 Er kan per provincie één regionale publieke media-instelling worden aangewezen, waarbij het Commissariaat acht
      slaat op alle factoren die voor het functioneren van de instelling van belang kunnen zijn.

      2 In afwijking van het eerste lid kunnen in de provincie Zuid-Holland twee regionale publieke media-instellingen
      worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.62
  - number: '2.63'
    text: |-
      1 Als meer dan één lokale instelling in een gemeente aan de eisen, bedoeld in [artikel 2.61, tweede lid][ref1],
      voldoet, bevordert het college van burgemeester en wethouders voor zover dat redelijkerwijs mogelijk is het
      samengaan van die instellingen.

      2 Er kan per gemeente slechts één lokale publieke media-instelling worden aangewezen, waarbij het Commissariaat
      acht slaat op alle factoren die voor het functioneren van de instelling van belang kunnen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.61
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.63
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.61'
        hoofdstuk: '2'
        paragraaf: 2.3.1a
  - number: '2.64'
    text: |-
      1 Een instelling die de publieke mediaopdracht wil uitvoeren voor meer dan één provincie of gemeente, wordt alleen
      dan voor dat gebied aangewezen, als provinciale staten of de gemeenteraden van de desbetreffende provincies of
      gemeenten het in [artikel 2.61, derde lid][ref1] bedoelde advies gezamenlijk hebben uitgebracht.

      2 Het Commissariaat stelt provinciale staten en de gemeenteraden van de desbetreffende provincies of gemeenten in
      kennis van een aanvraag van een instelling als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.61
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.64
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.61'
        hoofdstuk: '2'
        paragraaf: 2.3.1a
  - number: '2.65'
    text: |-
      1 Een aanwijzing als regionale publieke media-instelling geschiedt op aanvraag, geldt voor de duur van vijf jaar,
      die begint met ingang van de concessie, bedoeld in [artikel 2.60k][ref1], dan wel met ingang van het zesde jaar van
      die concessie, en daarna van rechtswege vervalt.

      2 Een aanwijzing als lokale publieke media-instelling geschiedt op aanvraag, geldt voor vijf jaar en vervalt daarna
      van rechtswege.

      3 Zonodig wijst het Commissariaat de dagen waarop en de uren waarin programma-aanbod van regionale en lokale
      mediadiensten wordt uitgezonden op de voor de regionale dan wel lokale publieke mediadiensten beschikbare ruimte op
      een omroepzender.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.60k
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.65
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: 2.60k
        hoofdstuk: '2'
        paragraaf: 2.3.1
  - number: '2.66'
    text: |-
      1 Provinciale staten brengen dan wel de gemeenteraad brengt tijdens de aanwijzingsperiode ten minste eenmaal aan
      het Commissariaat advies uit over de vraag of een aangewezen regionale of lokale publieke media-instelling naar hun
      of zijn mening nog voldoet aan de eisen van [artikel 2.61, tweede lid][ref1].

      2 Als tijdens de aanwijzingsperiode bij het Commissariaat ernstige twijfel bestaat of de regionale of lokale
      publieke media-instelling nog aan de eisen van [artikel 2.61, tweede lid][ref2], voldoet, kan hij een tussentijds
      advies vragen.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.61
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.61
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.66
