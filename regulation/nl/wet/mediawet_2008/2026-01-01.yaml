  - number: '2.73'
    text: |-
      1 De raad van bestuur kan media-aanbod van een regionale publieke media-instelling dat daarvoor door die media-
      instelling met voldoende gebruiksrechten beschikbaar is gesteld plaatsen op een aanbodkanaal van de landelijke
      publieke mediadienst.

      2 Op het eerste lid zijn de [artikelen 2.52][ref1], [2.53][ref2], [2.54, eerste lid][ref3], [2.57][ref4],
      [2.58][ref5], [2.59, eerste lid][ref6], en [2.60][ref7] zoveel mogelijk van overeenkomstige toepassing.

      3 Op media-aanbod van een regionale publieke media-instelling dat is geplaatst op een aanbodkanaal van de
      landelijke publieke mediadienst zijn de regels over reclame- en telewinkelboodschappen voor de landelijke publieke
      mediadienst van overeenkomstige toepassing.


