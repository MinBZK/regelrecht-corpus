  - number: 6.14b
    text: |-
      Het digitale standaardprogrammapakket dat een pakketaanbieder door middel van een satelliet verspreidt of laat
      verspreiden, bevat in afwijking van [artikel 6.13, derde en vierde lid][ref1], niet het programma-aanbod op
      programmakanalen als bedoeld in de onderdelen b, c, d en e van artikel 6.13, derde lid, onderscheidenlijk de
      onderdelen b, c en d van artikel 6.13, vierde lid.


