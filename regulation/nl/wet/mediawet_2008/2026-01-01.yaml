  - number: '2.169'
    text: |-
      1 Onze Minister kan aan een besluit tot het ter beschikking stellen van gelden op grond van de
      [artikelen 2.167][ref1] en [2.168][ref2] voorschriften verbinden.

      2 De voorschriften hebben geen betrekking op de specifieke inhoud van media-aanbod.

      3 Onze Minister kan een besluit tot het ter beschikking stellen van gelden intrekken of wijzigen, als de
      voorschriften niet worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.167
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.168
