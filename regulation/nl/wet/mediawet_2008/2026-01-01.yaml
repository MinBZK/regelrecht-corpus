        artikel: '4.2'
        hoofdstuk: '4'
  - number: '4.2'
    text: |-
      1 Onze Minister kan een organisatie erkennen die voorziet in regelingen omtrent classificatie en het verspreiden
      van aanbod als bedoeld in [artikel 4.1, eerste lid][ref1], en het toezicht daarop.

      2 De regelingen hebben in ieder geval betrekking op:

      a. criteria voor de classificatie van aanbod, waaronder in ieder geval de mate waarin:

      1°. angst wordt opgewekt;

      2°. brutaliserend geweld wordt vertoond of gerechtvaardigd;

      3°. het gebruik van drugs aantrekkelijk wordt voorgesteld of vergoelijkt;

      4°. sprake is van pornografie; en

      5°. op andere gronden volgens algemeen geldende opvattingen producten niet geschikt zijn voor vertoning aan
      bepaalde categorieën personen jonger dan zestien jaar;

      b. de tijdstippen van verspreiding van het hiervoor bedoelde aanbod op een programmakanaal; en

      c. de wijze waarop de verspreiding van dit aanbod wordt voorafgegaan door of is voorzien van symbolen of
      waarschuwingen.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel4.1
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel4.2
