  - number: '2.27'
    text: |-
      1 Het Commissariaat stelt het aantal leden per omroeporganisatie die een aanvraag voor een erkenning of voorlopige
      erkenning heeft ingediend vast op een peildatum die door Onze Minister wordt bepaald. Bij een samenwerkingsomroep
      wordt het aantal leden bepaald door het totaal aantal leden van de omroepverenigingen die hij vertegenwoordigt.

      2 Als lid tellen mee personen die:

      a. 16 jaar of ouder zijn;

      b. in Nederland woonachtig zijn; en

      c. de jaarlijkse minimumcontributie, bedoeld in [artikel 2.24, eerste lid, onderdeel e][ref1], of 2.24a, eerste
      lid, onderdeel e, hebben betaald.

      3 Het Commissariaat bepaalt de wijze waarop de vaststelling van het aantal leden gebeurt en de aanvrager verstrekt
      aan het Commissariaat alle gegevens die het daarvoor nodig acht.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.24
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.27
