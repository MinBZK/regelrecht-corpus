  - number: '2.150'
    text: |-
      1 Het budget, bedoeld in [artikel 2.149, eerste lid, onderdeel f][ref1], bedraagt vijftig procent van het totaal
      van de budgetten, bedoeld in artikel 2.149, eerste lid, onderdelen a en b, en dertig procent van het totaal van de
      budgetten, bedoeld in artikel 2.149, eerste lid, onderdelen c en d.

      2 Onder versterking van het media-aanbod wordt verstaan stimulering van de verzorging van media-aanbod en
      samenwerking ter bevordering van de pluriformiteit van het media-aanbod.

      3 Het budget komt geheel ten goede aan media-aanbod van de omroeporganisaties, de NOS en de NTR.

      4 Het media-aanbod, bedoeld in [artikel 2.54, tweede lid][ref2], komt ten laste van het budget, bedoeld in
      [artikel 2.149, eerste lid, onder f][ref3].


