  - number: '2.171'
    text: |-
      1 Het Commissariaat is belast met de rechtmatigheidstoetsing van de uitgaven van de NPO, de landelijke publieke
      media-instellingen en de Ster.

      2 De landelijke publieke media-instellingen en de Ster zenden jaarlijks vóór 1 mei de jaarrekening
      aan het Commissariaat en sturen gelijktijdig een afschrift daarvan aan de raad van bestuur. De NPO,
      de landelijke publieke media-instellingen en de Ster nemen in het bestuursverslag, bedoeld in de
      [artikelen 2.17][ref1], [2.34i][ref2], [2.40][ref3] en [2.103][ref4], in samenhang met de [artikelen 48][ref5] en
      [300 van Boek 2 van het Burgerlijk Wetboek][ref6] een samengevatte jaarrekening op.

      3 De raad van bestuur zendt vóór 1 juli de jaarrekening van de NPO aan het Commissariaat.


