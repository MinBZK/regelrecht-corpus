    text: |-
      Onze Minister stelt regels ter uitvoering van artikel 22 van de Europese richtlijn, voor zover naar het oordeel van
      Onze Minister een of meer van deze artikelen niet, niet voldoende, niet juist of niet tijdig zijn uitgewerkt in de
      Nederlandse Reclame Code of in een vergelijkbare door de Stichting Reclame Code tot stand gebrachte regeling, dan
      wel de Stichting Reclame Code in gebreke blijft met het toezicht daarop.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel9.16
  - number: '9.17'
    text: |-
