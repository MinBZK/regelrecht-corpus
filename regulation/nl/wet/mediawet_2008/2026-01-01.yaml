  - number: '7.13'
    text: |-
      De te betalen geldsommen van de bestuurlijke boeten en dwangsommen komen toe aan Onze Minister en zijn
      bestemd voor door hem te bepalen mediadoelen in brede zin, met uitzondering van de bestuurlijke boete,
      bedoeld in [artikel 7.12, tweede lid][ref1], die wordt toegevoegd aan de algemene mediareserve, bedoeld in
      [artikel 2.166][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel7.12
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.166
