  - number: '2.33'
    text: |-
      1 Onze Minister trekt een erkenning of een voorlopige erkenning in als een instelling niet meer
      voldoet aan de [artikelen 2.24][ref1], [2.24a][ref2], [2.25, eerste lid, onderdeel d][ref3], of
      [2.26, eerste lid, onderdelen f en g][ref4], dan wel niet voldoet aan artikel 2.25, eerste lid, onderdeel c, of
      2.26, eerste lid, onderdeel c.

      2 Onze Minister kan een erkenning of voorlopige erkenning intrekken als het Commissariaat aan
      de instelling binnen een jaar ten minste twee maal een bestuurlijke sanctie als bedoeld in
      [titel 7.2][ref5] heeft opgelegd wegens overtreding van het bepaalde bij of krachtens deze wet of
      [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref6].

      3 Onze Minister kan een erkenning of voorlopige erkenning daarnaast intrekken als bij de tweede evaluatie,
      bedoeld in [artikel 2.184, derde lid][ref7], is vastgesteld dat de instelling onvoldoende heeft bijgedragen
      aan de uitvoering van de publieke mediaopdracht op landelijk niveau door de wijze waarop zij uitvoering
      heeft gegeven aan de publieke taak, bedoeld in [artikel 2.24, eerste lid, onderdeel b][ref8], of
      [2.24a, eerste lid, onderdeel b][ref9]. [Artikel 2.31, eerste en tweede lid][ref10], is van overeenkomstige
      toepassing. Een besluit als bedoeld in de eerste volzin voorziet in het tijdstip met ingang waarvan de erkenning of
      voorlopige erkenning wordt ingetrokken. Dit tijdstip is niet later dan één jaar na de bekendmaking van het besluit,
      bedoeld in de eerste volzin.

      4 Onze Minister kan op verzoek van de raad van bestuur een erkenning of voorlopige erkenning intrekken als:

      a. de raad van bestuur aan de instelling binnen de erkenningperiode twee maal een sanctie als bedoeld in
      [artikel 2.154][ref11] heeft opgelegd; of

      b. de instelling naar de mening van de raad van bestuur onvoldoende uitvoering geeft aan de bereidheid tot
      samenwerking ten behoeve van de landelijk publieke mediadienst.


