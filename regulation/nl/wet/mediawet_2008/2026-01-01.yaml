  - number: '2.166'
    text: |-
      1 Onze Minister kan uit de rijksmediabijdrage en de inkomsten van de Ster een algemene mediareserve vormen die
      bestemd is voor:

      a. de opvang van dalende inkomsten van de Ster;

      b. bijdragen in reorganisatiekosten als gevolg van overheidsbesluiten; en

      c. de financiering van de door het Commissariaat aan te houden rekening-courantverhouding voor de betalingen ter
      uitvoering van deze wet.

      2 Het Commissariaat beheert de algemene mediareserve.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.166
  - number: '2.167'
    text: |-
      1 Onze Minister kan, voor zover dat de financiering van de rekening-courantverhouding niet in gevaar brengt, uit de
      algemene mediareserve gelden ter beschikking stellen ten behoeve van:

      a. de NPO, de RPO en de landelijke en regionale publieke media-instellingen;

      b. het overlegorgaan van lokale publieke media-instellingen, bedoeld in [artikel 2.146, onder l][ref1], het
      Stimuleringsfonds voor de journalistiek, bedoeld in [artikel 8.1][ref2], en de door hem aangewezen instellingen
      voor het in stand houden en exploiteren van omroeporkesten en omroepkoren, van een media-archief en van een
      expertisecentrum voor media-educatie;

      c. het Commissariaat.

      2 Onze Minister stelt gelden ten behoeve van de NPO en de landelijke publieke media-instellingen door tussenkomst
      van het Commissariaat ter beschikking aan de raad van bestuur. Voor de landelijke publieke media-instellingen is
      [artikel 2.152a, tweede lid][ref3], van overeenkomstige toepassing.

      3 Onze Minister stelt gelden ten behoeve van de RPO, de regionale publieke media-instellingen en de instellingen,
      bedoeld in het eerste lid, onderdeel b, door tussenkomst van het Commissariaat aan hen ter beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.146
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel8.1
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel2.152a
