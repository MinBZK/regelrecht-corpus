  - number: '2.30'
    text: |-
      1 Een aanvraag voor een erkenning of voorlopige erkenning bevat de statuten van de aanvrager en een beleidsplan.

      2 Het beleidsplan is afgestemd op het concessiebeleidsplan voor dezelfde periode en bevat in elk geval:

      a. het voorgenomen beleid ten aanzien van het media-aanbod, met in achtneming van de bij of krachtens deze wet
      gestelde verplichtingen voor het media-aanbod van de landelijk publieke mediadienst, waarbij wordt aangegeven
      waaruit binding in de samenleving met de missie en identiteit van de omroeporganisatie blijkt anders dan uit het
      ledenaantal;

      b. de voornemens en afspraken over samenwerking ten behoeve van de landelijke publieke mediadienst met andere
      aanvragers van een erkenning of een voorlopige erkenning, de NPO, de NOS of de NTR; en

      c. voor zover het betreft het beleidsplan van een aanvrager van een voorlopige erkenning, de voornemens en
      afspraken over de wijze waarop zijn verantwoordelijkheid, bedoeld in [artikel 2.88, eerste lid][ref1], in de
      samenwerking met de NTR of een omroeporganisatie, bedoeld in [artikel 2.26, eerste lid, onderdeel f][ref2], is
      gewaarborgd.

      3 Het deel van het beleidsplan dat betrekking heeft op samenwerking kan door de desbetreffende aanvragers
      gezamenlijk worden ingediend.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld over:

      a. het tijdstip en de wijze van indiening van een aanvraag;

      b. de inrichting van een aanvraag en het beleidsplan; en

      c. de termijn en wijze waarop een besluit op een aanvraag wordt genomen.

      5 Aangaande eenzelfde omroepvereniging kan slechts een aanvraag worden toegewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.88
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.26
