  - number: '1.2'
    text: |-
      1 Onder de bevoegdheid van Nederland vallen publieke of commerciële media-instellingen die krachtens artikel 2 van
      de Europese richtlijn onder die Nederlandse bevoegdheid vallen.

      2 Het eerste lid is van overeenkomstige toepassing op een instelling die radioprogramma’s verzorgt, met dien
      verstande dat in ieder geval onder de bevoegdheid van Nederland valt een instelling die radioprogramma’s verzorgt
      die in Nederland door middel van een omroepzender, satelliet daaronder niet begrepen, worden verspreid.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel1.2
  - number: '2.1'
    text: |-
      1 Er is een publieke mediaopdracht die bestaat uit:

      a. het op landelijk, regionaal en lokaal niveau verzorgen van publieke mediadiensten door het aanbieden van media-
      aanbod dat tot doel heeft een breed en divers publiek te voorzien van informatie, waaronder journalistieke inhoud,
      cultuur en educatie, via alle beschikbare aanbodkanalen;

      a1. het kunnen inzetten van amusement als middel om een informatief, cultureel of educatief doel te bereiken of een
      breed en divers publiek te trekken en te binden zodat deze doelen onder de aandacht worden gebracht;

      b. het verzorgen van publieke mediadiensten waarvan het media-aanbod bestemd is voor Nederlanders die buiten de
      landsgrenzen verblijven; en

      c. het stimuleren van innovatie ten aanzien van media-aanbod, het volgen en stimuleren van technologische
      ontwikkelingen en het benutten van de mogelijkheden om media-aanbod aan het publiek aan te bieden via nieuwe media-
      en verspreidingstechnieken.

      2 Publieke mediadiensten zijn in overeenstemming met publieke waarden, waarbij zij voorzien in democratische,
      sociale en culturele behoeften van de Nederlandse samenleving. Zij verzorgen daartoe media-aanbod dat:

      a. evenwichtig, pluriform, gevarieerd en kwalitatief hoogstaand is en zich tevens kenmerkt door een grote
      verscheidenheid naar vorm en inhoud;

      b. op evenwichtige wijze een beeld van de samenleving geeft en de pluriformiteit van onder de bevolking levende
      overtuigingen, opvattingen en interesses op maatschappelijk, cultureel en levensbeschouwelijk gebied weerspiegelt;

      c. gericht is op en een relevant bereik heeft onder zowel een breed en algemeen publiek, als bevolkings- en
      leeftijdgroepen van verschillende omvang en samenstelling met in het bijzonder aandacht voor kleine doelgroepen;

      d. onafhankelijk is van commerciële invloeden en, behoudens het bepaalde bij of krachtens de wet, van
      overheidsinvloeden;

      e. voldoet aan hoge journalistieke en professionele kwaliteitseisen, die binnen deze sector gehanteerd worden; en

      f. voor iedereen toegankelijk is.

      3 Het programma-aanbod van de algemene programmakanalen van de landelijke, regionale en lokale publieke
      mediadiensten wordt via omroepzenders verspreid naar alle huishoudens in het verzorgingsgebied waarvoor de
      programma’s zijn bestemd zonder dat zij voor de ontvangst andere kosten moeten betalen dan de kosten van aanschaf
      en gebruik van technische voorzieningen die de ontvangst mogelijk maken.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.1
  - number: '2.2'
    text: |-
      1 De Stichting Nederlandse Publieke Omroep is het sturings- en samenwerkingsorgaan voor de uitvoering van de
      publieke mediaopdracht op landelijk niveau, bedoeld in [artikel 2.1][ref1].

      2 Naast de andere taken die de NPO heeft op grond van deze wet, is zij belast met:

      a. het geven van sturing en het bevorderen van samenwerking met het oog op de uitvoering van de publieke
      mediaopdracht op landelijk niveau;

      b. de coördinatie en ordening op en tussen de aanbodkanalen van het media-aanbod van de landelijke publieke
      mediadienst;

      b1. het zorgdragen voor de publieksbetrokkenheid bij de invulling van het media-aanbod van de landelijke publieke
      mediadienst;

      c. de vertegenwoordiging van de landelijke publieke media-instellingen in internationale organisaties op het gebied
      van media en de medewerking aan de oprichting van dergelijke organisaties;

      d. het in samenwerking met buitenlandse omroepinstellingen meewerken aan Europees media-aanbod dat mede op het
      Nederlandse publiek is gericht;

      e. het beschikbaar stellen van media-aanbod van de landelijke publieke mediadienst aan het buitenland;

      f. het behartigen van zaken die van gemeenschappelijk belang zijn voor de landelijke publieke mediadienst en
      de landelijke publieke media-instellingen, waaronder de coördinatie van het verwerven, beheren en gebruiken van
      rechten op media-aanbod en de daaraan verbonden namen en merken;

      g. het sluiten van collectieve arbeidsovereenkomsten en het vaststellen van normen voor de honorering van
      freelancers, mede in naam van de landelijke publieke media-instellingen;

      h. de bekostiging van de landelijke publieke media-instellingen, op basis van de door Onze Minister beschikbaar
      gestelde gelden;

      i. het zorgdragen voor een doelmatige inzet van de gelden die bestemd zijn voor de verzorging en verspreiding van
      het media-aanbod en het zorgdragen voor geïntegreerde financiële verslaglegging en verantwoording;

      j. het inrichten, in stand houden, beheren en exploiteren en regelen van het gebruik van organen, diensten en
      faciliteiten, waaronder studio’s en distributie-infrastructuren, die nodig zijn voor een goede uitvoering van de
      publieke mediaopdracht op landelijk niveau;

      k. het verspreiden van media-aanbod voor Nederlandstaligen in het buitenland; en

      l. het in samenwerking met publieke media-instellingen bevorderen van talentontwikkeling.

      3 Bij de uitvoering van haar taken stuurt de NPO en bevordert zij de samenwerking vanuit de kwantitatieve en
      kwalitatieve doelstellingen voor het media-aanbod en het publieksbereik van de landelijke publieke mediadienst,
      vervat in het concessiebeleidsplan, de prestatieovereenkomst, bedoeld in [artikel 2.22][ref2], de profielen van
      de aanbodkanalen, de afspraken, bedoeld in [artikel 2.55][ref3], de regeling, bedoeld in [artikel 2.57][ref4],
      en de begroting, bedoeld in [artikel 2.147][ref5], en neemt zij bij de verzorging van het media-aanbod door de
      landelijke publieke media-instellingen [artikel 2.88][ref6] in acht.


