  - number: '2.178'
    text: |-
      1 De landelijke en regionale publieke media-instellingen en de Ster richten hun organisatie zodanig in dat een
      deugdelijke inrichting, sturing en beheersing van de bedrijfsprocessen gewaarborgd is.

      2 De landelijke en regionale publieke media-instellingen en de Ster voeren een deugdelijke administratie waaruit
      te allen tijde Onze Minister, de raad van bestuur en het Commissariaat elk de benodigde informatie die zij voor de
      uitvoering van hun taken nodig hebben, op eenduidige wijze kunnen verkrijgen.

      3 De landelijke publieke media-instelling die samenwerkingsomroep is, draagt ervoor zorg dat de omroepverenigingen
      die hij vertegenwoordigt, overeenkomstig het eerste en tweede lid handelen.

      4 De raad van bestuur en het Commissariaat bevorderen dat onderscheidenlijk de landelijke publieke media-
      instellingen en de regionale publieke media-instellingen een eenduidige financiële boekhouding voeren.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.178
  - number: '2.180'
    text: |-
      1 De instellingen die door Onze Minister zijn aangewezen voor het in stand houden en exploiteren van omroeporkesten
      en omroepkoren, van een media-archief en van een expertisecentrum voor media-educatie dienen eenmaal per vijf jaar
      bij Onze Minister een meerjarenplan voor de volgende periode van vijf jaar in.

      2 De meerjarenplannen zijn afgestemd op het voor de desbetreffende periode geldende concessiebeleidsplan voor de
      landelijke publieke mediadienst.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.180
  - number: '2.181'
    text: |-
      1 De instellingen dienen jaarlijks vóór 15 september een begroting in bij Onze Minister.

      2 De instellingen dienen jaarlijks vóór 1 mei bij Onze Minister een jaarrekening over het voorafgaande kalenderjaar
      in.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.181
  - number: '2.182'
    text: |-
      1 De meerjarenplannen en de jaarrekeningen behoeven de instemming van Onze Minister.

      2 Met betrekking tot de meerjarenplannen hoort Onze Minister de NPO.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.182
  - number: '2.183'
    text: |-
      1 Onze Minister stelt uit de rijksmediabijdrage en de inkomsten van de Ster, aan de instellingen een bijdrage in
      de kosten ter beschikking. Onze Minister stelt de bijdrage voor de instelling die is aangewezen voor het in stand
      houden en exploiteren van omroeporkesten en omroepkoren door tussenkomst van het Commissariaat ter beschikking van
      de raad van bestuur, die de bijdrage ter beschikking stelt aan de instelling.

      2 Onze Minister kan aan een besluit tot het ter beschikking stellen van bijdragen voorschriften verbinden.

      3 Als een instelling niet voldoet aan de [artikelen 2.180][ref1] en [2.181][ref2] of de aan een besluit tot het ter
      beschikking stellen van bijdragen verbonden voorschriften niet naleeft, kan Onze Minister:

      a. de beschikking waarbij de desbetreffende instelling is aangewezen, intrekken; of

      b. het besluit tot het ter beschikking stellen van bijdragen intrekken of wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.180
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.181
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.183
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.180'
        hoofdstuk: '2'
        afdeling: 2.6.7
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2.181'
        hoofdstuk: '2'
        afdeling: 2.6.7
  - number: '2.184'
    text: |-
      1 De NPO evalueert regelmatig de wijze waarop uitvoering wordt gegeven aan de publieke mediaopdracht.

      2 Een evaluatie vindt in elk geval eens in de vijf jaar plaats.

      3 Als de evaluatiecommissie in haar rapportage, bedoeld in [artikel 2.186, eerste lid][ref1], heeft vastgesteld
      dat er gegronde redenen zijn aan te nemen dat een omroeporganisatie onvoldoende heeft bijgedragen aan de uitvoering
      van de publieke mediaopdracht op landelijk niveau door de wijze waarop zij uitvoering heeft gegeven aan de publieke
      taak, bedoeld in [artikel 2.24, eerste lid, onderdeel b][ref2], of [2.24a, eerste lid, onderdeel b][ref3],
      vindt in afwijking van het tweede lid in elk geval binnen twee jaar en vier jaar na het tijdstip waarop deze
      rapportage is uitgebracht een eerste respectievelijk tweede evaluatie plaats van de wijze waarop de betreffende
      omroeporganisatie uitvoering geeft aan deze publieke taak.

      4 Het derde lid is van overeenkomstige toepassing op de NTR en de NOS en de wijze waarop zij uitvoering hebben
      gegeven aan hun wettelijke taak.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.186
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.24
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel2.24a
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.184
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.186'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2.24'
        hoofdstuk: '2'
        afdeling: 2.2.2
      - id: ref3
        bwb_id: BWBR0025028
        artikel: 2.24a
        hoofdstuk: '2'
        afdeling: 2.2.2
  - number: '2.185'
    text: |-
      1 De NPO stelt een commissie in die tot taak heeft de evaluatie te verrichten voor de duur van de evaluatie. De
      commissie bestaat uit ten minste vijf onafhankelijke deskundigen en is zo veel mogelijk representatief voor het
      kijk- en luisterpubliek.

      2 De leden van de evaluatiecommissie worden op voordracht van de raad van bestuur benoemd door de raad van
      toezicht, gehoord Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.185
  - number: '2.186'
    text: |-
      1 De evaluatiecommissie rapporteert in elk geval over:

      a. de wijze waarop de NPO en de landelijke publieke media-instellingen gezamenlijk uitvoering hebben gegeven aan de
      publieke mediaopdracht op landelijk niveau;

      b. de mate waarin het media-aanbod van de landelijke publieke mediadienst tegemoet komt aan de interesses en
      inzichten van het algemene publiek en van specifieke bevolkings- en leeftijdsgroepen;

      c. de wijze waarop de omroepverenigingen waaraan een voorlopige erkenning als bedoeld in
      [artikel 2.23, tweede lid][ref1], is verleend, een bijdrage hebben geleverd aan de vergroting van de
      verscheidenheid van het media-aanbod van de landelijke publieke mediadienst en daarmee een vernieuwende bijdrage
      hebben geleverd aan de uitvoering van de publieke mediaopdracht op landelijk niveau; en

      d. andere onderwerpen die zijn opgenomen in het besluit tot instelling van de evaluatiecommissie of die door Onze
      Minister zijn aangegeven.

      2 De evaluatiecommissie rapporteert over de wijze waarop omroeporganisaties, de NTR of de NOS
      afzonderlijk uitvoering hebben gegeven aan de publieke mediaopdracht op landelijk niveau als bedoeld in
      [artikel 2.184, derde en vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.23
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.184
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.186
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.23'
        hoofdstuk: '2'
        afdeling: 2.2.2
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2.184'
        hoofdstuk: '2'
  - number: '2.187'
    text: |-
      1 De evaluatiecommissie kan aanbevelingen doen over de wijze waarop aan de publieke mediaopdracht in de komende
      jaren uitvoering wordt gegeven.

      2 De evaluatiecommissie brengt op een bij ministeriële regeling te bepalen tijdstip rapport uit aan de raad van
      toezicht van de NPO, die het aan Onze Minister zendt en openbaar maakt.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.187
  - number: '2.188'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden criteria vastgesteld op basis waarvan afzonderlijke
      landelijke publieke media-instellingen worden geëvalueerd als bedoeld in [artikel 2.186, tweede lid][ref1].

      2 De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet gedaan
      dan nadat het ontwerp in de Staatscourant is bekendgemaakt en aan een ieder de gelegenheid is geboden om binnen
      vier weken na de dag waarop de bekendmaking is geschied, wensen en bedenkingen ter kennis van Onze Minister te
      brengen. Gelijktijdig met de bekendmaking wordt het ontwerp aan de beide kamers der Staten-Generaal overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.186
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.188
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.186'
        hoofdstuk: '2'
  - number: '3.1'
    text: |-
      1 Onverminderd het bepaalde bij of krachtens de [Telecommunicatiewet][ref1] is het verzorgen van een commerciële
      omroepdienst alleen toegestaan met toestemming van het Commissariaat.

      2 In afwijking van het eerste lid is [artikel 3.29b][ref2] van overeenkomstige toepassing voor zover de commerciële
      omroepdienst bestaat uit het verzorgen van radioprogramma-aanbod via het open internet.

      3 Als een commerciële media-instelling meerdere programmakanalen verzorgt, is voor ieder programmakanaal
      afzonderlijk toestemming nodig.

      4 Als een commerciële media-instelling het door een derde aangeleverde programma-aanbod van een programmakanaal
      wijzigt, heeft die commerciële media-instelling voor het gewijzigde programmakanaal toestemming nodig.

      5 Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop aanvragen voor een toestemming worden
      ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0009950
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel3.29b
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
      - id: ref2
        bwb_id: BWBR0025028
        artikel: 3.29b
        hoofdstuk: '3'
  - number: '3.2'
    text: |-
      1 Een toestemming wordt op aanvraag verleend en geldt voor vijf jaar.

      2 Een toestemming is niet overdraagbaar en vervalt van rechtswege na afloop van de toestemmingsperiode.

      3 In de toestemming wordt aangegeven of deze betrekking heeft op televisieomroep of op radio-omroep.

      4 Op grond van een toestemming voor televisieomroep is het tevens toegestaan teletekst te verzorgen.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel3.2
  - number: '3.3'
    text: |-
      Het Commissariaat kan een aanvraag afwijzen als:

      a. de door de aanvrager bij de aanvraag verstrekte gegevens onjuist of onvolledig zijn; of

      b. redelijkerwijs te verwachten is dat de aanvrager zich niet zal houden aan het bepaalde bij of krachtens deze
      wet.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel3.3
  - number: '3.4'
    text: |-
      1 Het Commissariaat trekt een toestemming in als de commerciële media-instelling:

      a. daarom verzoekt; of

      b. in gebreke blijft met de betaling van de verschuldigde toezichtskosten, bedoeld in [artikel 3.30][ref1].

      2 Het Commissariaat kan een toestemming intrekken als de commerciële media-instelling:

      a. bij de aanvraag onjuiste of onvolledige gegevens verstrekt blijkt te hebben; of

      b. overigens niet voldoet aan het bepaalde bij of krachtens deze wet of
      [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3.30
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel520
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '3.30'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 5:20
  - number: '3.5'
    text: |-
      1 Een commerciële media-instelling bepaalt, onverminderd het bepaalde bij of krachtens deze wet, vorm en inhoud van
      het door haar verzorgde programma-aanbod en is daar verantwoordelijk voor.

      2 Een commerciële media-instelling brengt in overeenstemming met de werknemers die zijn belast met de verzorging en
      samenstelling van het programma-aanbod een redactiestatuut tot stand waarin de journalistieke rechten en plichten
      van deze werknemers worden geregeld.

      3 Een commerciële media-instelling neemt passende maatregelen om te voorkomen dat het aanbod van haar mediadiensten
      aanzet tot geweld of haat jegens een groep personen of een lid van een groep, op een van de gronden genoemd
      in artikel 21 van het Handvest van de grondrechten van de Europese Unie, of uitlokt tot het plegen van een
      terroristisch misdrijf.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel3.5
  - number: 3.5a
    text: |-
      1 Een commerciële media-instelling stelt ten minste de volgende gegevens van de media-instelling gemakkelijk,
      rechtstreeks en permanent beschikbaar voor het publiek:

      a. naam;

      b. plaats van vestiging;

      c. contactgegevens waaronder e-mailadres of internetadres; en

      d. de naam van het Commissariaat als het orgaan dat is belast met het toezicht op de naleving op grond van
      [titel 7.2][ref1].

      2 Een commerciële media-instelling informeert het Commissariaat onverwijld over wijzigingen die van invloed kunnen
      zijn op de bevoegdheid van Nederland over deze commerciële media-instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel3.5a
    references:
      - id: ref1
        bwb_id: BWBR0025028
        hoofdstuk: '7'
  - number: 3.5b
    text: |-
      1 Reclame- en telewinkelboodschappen, gesponsord programma-aanbod en productplaatsing zijn als zodanig herkenbaar.

      2 In reclame- en telewinkelboodschappen, gesponsord programma-aanbod en programma-aanbod met productplaatsing
      worden geen subliminale technieken gebruikt.

      3 Het programma-aanbod bevat geen sluikreclame.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel3.5b
  - number: '3.6'
    text: |-
      1 Een commerciële media-instelling die reclame- of telewinkelboodschappen in het programma-aanbod opneemt, is
      aangesloten bij de Nederlandse Reclame Code of een vergelijkbare door de Stichting Reclame Code tot stand gebrachte
      regeling en ter zake onderworpen aan het toezicht van de Stichting Reclame Code.

      2 Aansluiting wordt aangetoond door een schriftelijke verklaring van de Stichting Reclame Code aan het
      Commissariaat over te leggen.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel3.6
  - number: '3.7'
    text: |-
      1 Reclame- en telewinkelboodschappen zijn door akoestische, visuele of ruimtelijke middelen duidelijk onderscheiden
      van de overige inhoud van het programma-aanbod.

      2 Het programma-aanbod bevat geen reclame- en telewinkelboodschappen voor:

      a. medische behandelingen; en

      b. alcoholhoudende dranken tussen 06.00 uur en 21.00 uur.

      3 In de naam van een programmakanaal mogen namen of (beeld-)merken van personen, bedrijven of instellingen op
      neutrale wijze worden vermeld of getoond.

      4 Het Commissariaat kan nadere regels stellen voor de vermelding of vertoning, bedoeld in het derde lid, welke
      regels de goedkeuring behoeven van Onze Minister.

      5 Het televisieprogramma-aanbod bevat voorts geen reclame- en telewinkelboodschappen voor:

      a. kansspelen waarvoor een vergunning als bedoeld in de [artikelen 14a][ref1], [15][ref2], [23][ref3], [27g][ref4]
      en [31 van de Wet op de kansspelen][ref5] vereist is, of die gespeeld worden op een automaat in een
      speelautomatenhal voor de aanwezigheid waarvan een vergunning vereist is, tussen 06.00 en 21.00 uur;

      b. overige kansspelen waarvoor ingevolge de [Wet op de kansspelen][ref6] een vergunning vereist is, tussen 06.00
      en 19.00 uur.

      6 Het vijfde lid, onder a, is van overeenkomstige toepassing op radioprogramma-aanbod.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel14a
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0002469#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0002469#Artikel27g
      [ref5]: https://wetten.overheid.nl/BWBR0002469#Artikel31
      [ref6]: https://wetten.overheid.nl/BWBR0002469
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 14a
      - id: ref2
        bwb_id: BWBR0002469
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0002469
        artikel: '23'
      - id: ref4
        bwb_id: BWBR0002469
        artikel: 27g
      - id: ref5
        bwb_id: BWBR0002469
        artikel: '31'
      - id: ref6
        bwb_id: BWBR0002469
  - number: '3.8'
    text: |-
      1 Het programma-aanbod op een programmakanaal bestaat voor niet meer dan twintig procent van de tijdvakken tussen
      06:00 uur en 18:00 uur en tussen 18:00 uur en 24:00 uur uit reclame- of telewinkelboodschappen.

      2 Met inachtneming van deze afdeling kunnen in het programma-aanbod bestaande uit het verslag of de weergave van
      sportevenementen afzonderlijke reclame- of telewinkelboodschappen worden geplaatst en in het overige programma-
      aanbod bij uitzondering.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel3.8
  - number: '3.9'
    text: |-
      1 In het programma-aanbod op een programmakanaal duren blokken van telewinkelboodschappen zonder onderbreking ten
      minste vijftien minuten.

      2 Blokken van telewinkelboodschappen zijn gedurende de gehele duur daarvan door visuele en akoestische middelen
      duidelijk als zodanig herkenbaar.

      3 [Artikel 3.8, eerste en tweede lid][ref1], is niet van toepassing op de telewinkelblokken.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3.8
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '3.8'
        hoofdstuk: '3'
        afdeling: 3.2.2
  - number: '3.10'
    text: |-
      1 In programma’s worden alleen reclame- of telewinkelboodschappen opgenomen als deze geen afbreuk doen aan de
      integriteit, het karakter of de samenhang van het desbetreffende programma of aan de rechten van rechthebbenden.

      2 In programma’s die bestaan uit de weergave van kerkelijke of geestelijke samenkomsten worden geen reclame- of
      telewinkelboodschappen opgenomen.

      3 In programma’s die in het bijzonder bestemd zijn voor kinderen jonger dan twaalf jaar worden geen
      telewinkelboodschappen opgenomen.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel3.10
  - number: '3.11'
    text: |-
      1 In de volgende programma’s worden ten hoogste eenmaal per geprogrammeerd tijdvak van dertig minuten reclame- of
      telewinkelboodschappen opgenomen:

      a. programma’s bestaande uit films;

      b. programma’s bestaande uit nieuws of commentaar op het nieuws.

      2 In programma’s die in het bijzonder bestemd zijn voor kinderen jonger dan twaalf jaar worden ten hoogste eenmaal
      per geprogrammeerd tijdvak van dertig minuten reclameboodschappen opgenomen, mits de geprogrammeerde duur van het
      programma meer dan dertig minuten bedraagt.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel3.11
  - number: '3.13'
    text: |-
      In televisieprogramma’s die bestaan uit het verslag van een evenement worden alleen reclame- of
      telewinkelboodschappen opgenomen tijdens de in het evenement voorkomende gebruikelijke pauzes of tussen de daarin
      voorkomende gebruikelijke zelfstandige onderdelen.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel3.13
  - number: '3.14'
    text: |-
      1 In afwijking van de [artikelen 3.8][ref1] en [3.11][ref2] mag een televisieprogrammakanaal worden verzorgd dat:

      a. uitsluitend bestaat uit ten behoeve van zelfpromotie uitgezonden reclameboodschappen; of

      b. uitsluitend bestaat uit telewinkelboodschappen.

      2 In het programma-aanbod van een televisieprogrammakanaal als bedoeld in het eerste lid mogen andere
      reclameboodschappen worden opgenomen met inachtneming van de bepalingen die gelden voor het opnemen van
      reclameboodschappen in televisieprogramma-aanbod.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3.8
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel3.11
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '3.8'
        hoofdstuk: '3'
        afdeling: 3.2.2
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '3.11'
        hoofdstuk: '3'
        afdeling: 3.2.2
  - number: '3.15'
    text: |-
      1 Programma-aanbod wordt alleen gesponsord als in het redactiestatuut, bedoeld in [artikel 3.5, tweede lid][ref1],
      waarborgen zijn opgenomen voor de redactionele onafhankelijkheid van de werknemers die belast zijn met de
      verzorging en samenstelling van het programma-aanbod ten opzichte van de sponsors.

      2 Programma-aanbod bestaande uit nieuws, actualiteiten of politieke informatie wordt niet gesponsord.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3.5
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '3.5'
        hoofdstuk: '3'
        afdeling: 3.2.1
  - number: '3.16'
    text: |-
      1 Bij gesponsord programma-aanbod wordt ter informatie van het publiek duidelijk vermeld dat en door wie het
      programma-aanbod is gesponsord.

      2 De vermelding is zodanig vormgegeven dat:

      a. tussen 06.00 uur en 21.00 uur de vermelding van sponsors die zich bezighouden met de productie of verkoop van
      alcoholhoudende dranken, geschiedt door neutrale vermelding of vertoning van naam of (beeld)merk; en

      b. in andere gevallen dan bedoeld in onderdeel a, de vermelding geschiedt door vermelding of vertoning van naam,
      (beeld)merk of ander onderscheidend teken en het publiek niet rechtstreeks door middel van specifieke aanprijzingen
      wordt aangespoord tot het kopen of huren van producten of afname van diensten van de sponsors.

      3 Bij een gesponsord programma vindt de vermelding plaats aan het begin of het einde van het programma en kan de
      vermelding daarnaast plaatsvinden aan het begin of het einde van de in het programma opgenomen reclameboodschap
      of reclameboodschappen.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel3.16
  - number: '3.17'
    text: |-
      1 In gesponsord programma-aanbod mogen:

      a. onverminderd [afdeling 3.2.3a][ref1], producten of diensten van sponsors worden vermeld of getoond; en

      b. in de titel de naam, het (beeld)merk, producten of diensten van sponsors worden vermeld of getoond.

      2 Het vermelden en vertonen als bedoeld in het eerste lid mogen het publiek niet door middel van specifieke
      aanprijzingen aansporen tot het kopen of huren van producten of afname van diensten van de sponsors.

      3 Het Commissariaat kan nadere regels stellen voor de vertoning of vermelding in de titel, welke regels de
      goedkeuring behoeven van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0025028
        hoofdstuk: '3'
        afdeling: 3.2.3a
  - number: '3.18'
    text: |-
      [Artikel 3.16, eerste tot en met derde lid][ref1], is van overeenkomstige toepassing als een andere instelling
      dan bedoeld in de begripsomschrijving van sponsoring in [artikel 1.1][ref2] een bijdrage heeft gegeven voor de
      productie of aankoop van programma-aanbod om de verspreiding daarvan te bevorderen of mogelijk te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3.16
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel3.18
    references:
