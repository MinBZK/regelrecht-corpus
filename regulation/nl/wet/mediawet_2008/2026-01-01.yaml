  - number: '2.3'
    text: |-
      1 De NPO kan in het kader van haar taak, bedoeld in [artikel 2.2, tweede lid, onderdeel f][ref1], in naam van de
      gezamenlijke landelijke publieke media-instellingen overeenkomsten met derden aangaan.

      2 De NPO stelt in het kader van haar taak, bedoeld in [artikel 2.2, tweede lid, onderdeel f][ref2], een gedragscode
      op ter bevordering van goed bestuur en integriteit bij de NPO, de landelijke publieke media-instellingen en de
      Ster.

      3 De gedragscode omvat in elk geval:

      a. aanbevelingen voor de bestuurlijke organisatie, waaronder bestuurlijk toezicht;

      b. een beloningskader;

      c. gedragsregels voor integer handelen van bestuurders en medewerkers;

      d. gedragsregels voor publieke en transparante verantwoording en verslaglegging; en

      e. procedures voor de behandeling van meldingen en vermoedens over mogelijke misstanden.

      4 Het beloningskader, bedoeld in het derde lid, onderdeel b, voor zover dat betrekking heeft op medewerkers die
      buiten de van toepassing zijnde collectieve arbeidsovereenkomst een beloning ontvangen, behoeft de goedkeuring
      van Onze Minister. Voor zover Onze Minister goedkeuring daaraan onthoudt of als de NPO nalatig blijft bij het
      vaststellen van een beloningskader, bepaalt hij de inhoud van het beloningskader. De NPO stelt vervolgens het
      beloningskader vast overeenkomstig de inhoud, bedoeld in de vorige volzin.

      5 De gedragscode wordt nageleefd door de NPO en de landelijke publieke media-instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.2
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.2
