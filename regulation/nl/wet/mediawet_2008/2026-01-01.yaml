  - number: 2.169a
    text: |-
      1 De RPO dient jaarlijks vóór 15 september een begroting voor de regionale publieke mediadienst in bij Onze
      Minister en het Commissariaat.

      2 De begroting bevat in elk geval:

      a. een beschrijving van de wijze waarop door de RPO en de regionale publieke media-instellingen invulling wordt
      gegeven aan het voorgenomen media-aanbod op de verschillende aanbodkanalen, met in achtneming van het bepaalde bij
      of krachtens deze wet;

      b. een overzicht van aard en aantal van de aanbodkanalen;

      c. de financiële middelen die voor het volgende kalenderjaar nodig zijn om de voornemens met betrekking tot de
      regionale publieke mediadienst te verwezenlijken en een raming voor de daarop volgende vier jaar;

      d. een toelichting op de onderscheiden onderdelen en begrotingsposten; en

      e. een beschrijving van de samenwerking met de landelijke en lokale publieke media-instellingen en anderen.

      3 De financiële middelen worden als volgt onderverdeeld:

      a. de eigen inkomsten van de regionale publieke media-instellingen, die gebruikt moeten worden voor de verzorging
      van het media-aanbod; en

      b. de financiële middelen voor de uitvoering van de taken en werkzaamheden van de RPO.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.169a
  - number: 2.169b
    text: |-
      1 Bij ministeriële regeling kunnen nadere regels worden gesteld over de inhoud en inrichting van de begroting.

      2 Het Commissariaat zendt vóór 15 oktober zijn opmerkingen met betrekking tot de begroting aan Onze Minister.

      3 De RPO maakt de begroting openbaar.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.169b
  - number: 2.169c
    text: |-
      1 Onze Minister stelt jaarlijks vóór 1 december het budget vast voor de uitvoering van de taken en werkzaamheden
      van de RPO.

      2 Onze Minister kan aan een besluit tot het vast stellen van het budget schriftelijke voorwaarden verbinden.

      3 Het budget, bedoeld in het eerste lid, stelt Onze Minister door tussenkomst van het Commissariaat ter beschikking
      aan de RPO.

      4 Onze Minister stelt het budget vast op tachtig procent van het budget van het voorgaande jaar als de RPO de
      begroting niet volgens de daarvoor geldende regels heeft ingediend.

      5 Het budget, bedoeld in het eerste lid, besteedt het bestuur van de RPO aan de daar genoemde doelen.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.169c
  - number: '2.170'
    text: |-
      1 Onze Minister stelt jaarlijks vóór 1 december het totaalbudget vast dat voor het volgend jaar beschikbaar is voor
      de bekostiging van de regionale publieke mediadiensten. Onze Minister stelt het totaalbudget ter beschikking aan
      het Commissariaat.

      2 Het Commissariaat kan op aanvraag van regionale publieke media-instellingen uit het budget, bedoeld in het eerste
      lid, een bijdrage verstrekken in de kosten die rechtstreeks verband houden met het verzorgen van regionale publieke
      mediadiensten, voor zover die kosten niet op andere wijze zijn gedekt. Het Commissariaat beslist jaarlijks vóór
      1 januari op een aanvraag.

      3 Aan de verstrekking van de bijdrage, bedoeld in het tweede lid, worden geen voorwaarden verbonden die in strijd
      zijn met het bepaalde bij of krachtens deze wet.

      4 Een aanvraag als bedoeld in het tweede lid gaat vergezeld van een begroting die is afgestemd op de begroting,
      bedoeld in [artikel 2.169a, eerste lid][ref1], voor dezelfde periode.

      5 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:

      a. de verdeling van het totaalbudget over de regionale publieke media-instellingen;

      b. de inhoud, de inrichting en het tijdstip van indiening van een aanvraag; en

      c. de inhoud en de inrichting van de begroting.

      6 Het Commissariaat zendt vóór 15 oktober zijn opmerkingen met betrekking tot de begrotingen van de regionale
      publieke media-instellingen aan Onze Minister.

      7 De regionale publieke media-instellingen besteden de ontvangen bedragen aan de verzorging van publieke
      mediadiensten op regionaal niveau.

      8 De regionale publieke media-instellingen ontvangen voorschotten volgens bij ministeriële regeling te stellen
      regels.

      9 Als een regionale publieke media-instelling haar jaarrekening, bedoeld in [artikel 2.173a, tweede lid][ref2],
      niet tijdig indient:

      a. vermindert het Commissariaat de bevoorschotting met twintig procent; en

      b. kan het Commissariaat de bevoorschotting verder verminderen of beëindigen wanneer ondanks herhaalde aanmaningen
      van het Commissariaat de instelling in gebreke blijft met het indienen van de jaarrekening.

      Als een instelling voorschotten in strijd met het bepaalde bij of krachtens de wet gebruikt, kan het Commissariaat
      de bevoorschotting verminderen of beëindigen.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.169a
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.173a
