  - number: 2.174a
    text: |-
      1 Omroeporganisaties die een erkenning of een voorlopige erkenning als bedoeld in [artikel 2.23][ref1] hebben
      verkregen, kunnen netto inkomsten uit contributies en verenigingsactiviteiten als bedoeld in [artikel 2.136][ref2]
      tot een bij algemene maatregel van bestuur vast te stellen bedrag reserveren voor die verenigingsactiviteiten.

      2 De landelijke publieke media-instelling die samenwerkingsomroep is, draagt ervoor zorg dat de omroepverenigingen
      die hij vertegenwoordigt, slechts tot een bij algemene maatregel van bestuur vast te stellen bedrag overeenkomstig
      het eerste lid reserveren voor eigen verenigingsactiviteiten. De instelling ontvangt jaarlijks aan het einde
      van het boekjaar, bedoeld in [artikel 2.172, tweede lid][ref3], van de omroepverenigingen over dat boekjaar
      het deel van hun exploitatiesaldo dat overblijft na aftrek van de overeenkomstig de eerste volzin voor
      verenigingsactiviteiten gereserveerde gelden.

      3 Gelden die in strijd met het eerste lid zijn gereserveerd of in strijd met het tweede lid, tweede volzin, niet
      zijn ontvangen, worden terugbetaald aan de raad van bestuur.


