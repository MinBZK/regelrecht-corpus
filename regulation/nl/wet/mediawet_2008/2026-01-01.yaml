  - number: '2.14'
    text: |-
      1 De raad van bestuur vraagt het college van omroepen om advies voordat hij:

      a. een overeenkomst aangaat als bedoeld in [artikel 2.3, eerste lid][ref1], of
      [2.10, tweede lid, onderdeel f][ref2];

      b. een besluit neemt over een taak als bedoeld in [artikel 2.10, tweede lid, onderdelen d, e, of g][ref3];

      c. een besluit neemt over de wijze van aanwending van het budget, bedoeld in
      [artikel 2.149, eerste lid, onderdeel f][ref4]; of

      d. een besluit neemt over vaststelling van de jaarplannen met de programmeerstrategie in het kader van de regeling
      voor de coördinatie en ordening van het media-aanbod, bedoeld in [artikel 2.10, tweede lid, onder c][ref5].

      2 De raad van bestuur stelt het college van omroepen een redelijke termijn voor het geven van het advies. Het
      uitblijven van het advies van het college staat aan het aangaan van een overeenkomst of het nemen van een besluit
      door de raad van bestuur niet in de weg.

      3 Als uit het advies blijkt dat het college niet instemt met een voorgenomen overeenkomst of een
      voorgenomen besluit dan wel belangrijke onderdelen daarvan en de raad van bestuur wenst zijn voornemen
      ongewijzigd te handhaven, kan de raad van bestuur het college in de gelegenheid stellen daarover te worden
      gehoord binnen een door de raad van bestuur te stellen redelijke termijn. De raad van bestuur doet dat
      in ieder geval indien het een voorgenomen besluit of een voorgenomen overeenkomst betreft als bedoeld in
      [artikel 2.10, tweede lid, onderdeel e, respectievelijk f][ref6].

      4 Indien de raad van bestuur na toepassing van het derde lid zijn voornemen ongewijzigd heeft gehandhaafd, legt
      hij de voorgenomen overeenkomst of het vastgestelde besluit ter instemming voor aan de raad van toezicht. De raad
      van bestuur motiveert daarbij waarom hij de voorgenomen overeenkomst ongewijzigd wil handhaven, respectievelijk het
      voorgenomen besluit ongewijzigd heeft vastgesteld.

      5 Alvorens de raad van toezicht besluit over instemming met een voorgenomen overeenkomst of vastgesteld besluit
      kan hij het college in de gelegenheid stellen daarover te worden gehoord binnen een door de raad van toezicht te
      stellen redelijke termijn. De raad van toezicht doet dat in ieder geval indien het een vastgesteld besluit of een
      voorgenomen overeenkomst betreft als bedoeld in [artikel 2.10, tweede lid, onderdeel e, respectievelijk f][ref7].


