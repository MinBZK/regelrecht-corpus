  - number: 3.29i
    text: |-
      1 De [artikelen 3.29e][ref1], [3.29g][ref2] en [3.29h][ref3] zijn eveneens van toepassing op een aanbieder van
      mediadiensten die krachtens artikel 2 van de Europese richtlijn onder de bevoegdheid van een andere lidstaat valt
      en een commerciële mediadienst op aanvraag verzorgt die zich geheel of gedeeltelijk richt op publiek in Nederland,
      behalve wanneer de mediadienst een klein publiek heeft.

      2 Het Commissariaat kan een aanbieder van mediadiensten als bedoeld in het eerste lid ontheffing verlenen
      van [artikel 3.29e, eerste lid][ref4], indien toepassing gelet op de aard of het onderwerp van de betreffende
      mediadienst, of het gebruik van innovatieve formats, praktisch onuitvoerbaar of ongerechtvaardigd zou zijn. Artikel
      3.29e, zesde lid, is van overeenkomstige toepassing.

      3 Bij of krachtens algemene maatregel van bestuur kunnen indicatoren worden vastgesteld waaruit kan worden
      opgemaakt dat een mediadienst zich richt op publiek in Nederland.


