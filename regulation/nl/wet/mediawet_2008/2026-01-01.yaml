  - number: 2.138a
    text: |-
      1 Wanneer een omroeporganisatie uitvoering geeft aan het voornemen, bedoeld in [artikel 2.138, eerste lid][ref1],
      draagt zij binnen vier maanden na afloop van de periode waarvoor een erkenning of een voorlopige
      erkenning als bedoeld in [artikel 2.23][ref2] is verleend, zorg voor de vaststelling van een
      eindafrekening. De eindafrekening gaat vergezeld van een verklaring van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref3]. [Artikel 2.171, eerste lid][ref4], is van
      overeenkomstige toepassing. Het Commissariaat kan de termijn, bedoeld in de eerste volzin, verlengen met een door
      hem te stellen termijn.

      2 Mede op basis van de eindafrekening, bedoeld in het eerste lid, stelt het Commissariaat het terug te betalen
      bedrag vast. Teruggevorderde bedragen voegt het Commissariaat toe aan de algemene mediareserve, bedoeld in
      [artikel 2.166][ref5].

      3 In het geval, bedoeld in het eerste lid:

      a. betaalt de omroeporganisatie de op het moment, bedoeld in [artikel 2.138, eerste lid][ref6], aanwezige
      gelden die bestemd zijn voor de verzorging van media-aanbod voor de landelijke publieke omroep, terug aan het
      Commissariaat;

      b. draagt de omroeporganisatie er zorg voor dat programmamateriaal dat verspreid is op de programmakanalen van de
      landelijke publieke omroep dan wel daarvoor is geproduceerd of aangekocht en de daaraan verbonden programmaformats,
      namen en merken, voor zover het auteurs- of gebruiksrecht daarop bij de omroeporganisatie berust, gedurende drie
      jaar na afloop van de periode waarvoor een erkenning of voorlopige erkenning is verleend, om niet ter beschikking
      wordt gesteld aan de raad van bestuur voor gebruik op aanbodkanalen van de landelijke publieke omroep;

      c. stelt de omroeporganisatie het programmamateriaal, bedoeld in onderdeel b, ter beschikking aan de door Onze
      Minister aangewezen instelling voor het in stand houden en exploiteren van een media-archief; en

      d. onthoudt de omroeporganisatie zich gedurende drie jaar na afloop van de periode waarvoor een erkenning of
      voorlopige erkenning is verleend, van gebruik of exploitatie van het programmamateriaal, bedoeld in onderdeel
      a, en de daaraan verbonden programmaformats, namen en merken, voor zover het auteurs- en gebruiksrecht bij
      de omroeporganisatie berust, tenzij daarover met de raad van bestuur een overeenkomst is gesloten tegen een
      marktconforme vergoeding.

      4 Voor de toepassing van dit artikel wordt onder omroeporganisatie tevens begrepen haar rechtsopvolger of
      rechtsverkrijgende.

      5 Het eerste tot en met vierde lid zijn van overeenkomstige toepassing, als:

      a. aan een omroeporganisatie geen erkenning als bedoeld in [artikel 2.23, eerste lid][ref7], wordt verleend;

      b. een erkenning of voorlopige erkenning overeenkomstig [artikel 2.33][ref8] wordt ingetrokken; en

      c. een omroeporganisatie in strijd met [artikel 2.34, eerste lid][ref9], tijdens een erkenningperiode niet langer
      als omroeporganisatie media-aanbod voor de landelijke publieke omroep verzorgt.


