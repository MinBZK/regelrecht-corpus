      2 In geval van toepassing van het eerste lid heeft het eerste concessiebeleidsplan RPO, in afwijking van
      [artikel 2.60l][ref2], betrekking op de volledige periode van de eerste concessie.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.60k
