        artikel: '2.115'
        hoofdstuk: '2'
        paragraaf: 2.5.4.1
        afdeling: 2.5.4
  - number: '2.119'
    text: |-
      Ten minste een derde deel van de programma’s, bedoeld in de [artikelen 2.116][ref1] en [2.117][ref2], is niet ouder
      dan vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.116
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.117
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.119
