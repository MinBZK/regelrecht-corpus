  - number: '2.175'
    text: |-
      1 De regionale publieke media-instellingen kunnen met toestemming van het Commissariaat en onder door hem te
      stellen voorwaarden, die per instelling kunnen verschillen, gelden voor de verzorging van media-aanbod reserveren.
      De RPO kan gelden reserveren die bestemd zijn voor de uitvoering van haar taken en werkzaamheden.

      2 Het totaal van de gereserveerde gelden in een kalenderjaar bedraagt niet meer dan tien procent van de uitgaven
      van een regionale publieke media-instelling of de RPO.

      3 Gelden die in strijd met het eerste lid zijn gereserveerd, worden terugbetaald aan het Commissariaat.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.175
  - number: '2.176'
    text: |-
      1 Gereserveerde gelden voor de verzorging van media-aanbod worden in het volgende kalenderjaar besteed aan de
      doelen waarvoor zij oorspronkelijk bestemd zijn.

      2 Onze Minister kan voor de landelijke publieke media-instellingen op verzoek van de raad van bestuur ontheffing
      verlenen van het eerste lid. Onze Minister kan aan een ontheffing voorschriften verbinden.

      3 Het Commissariaat kan op verzoek van een regionale publieke media-instelling ontheffing verlenen van het eerste
      lid. Het Commissariaat kan aan een ontheffing voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.176
  - number: '2.177'
    text: |-
      1 Gelden die in strijd met het bepaalde bij of krachtens deze wet zijn gebruikt of die in strijd met de
      [artikelen 2.174, tweede lid][ref1], [2.174a, eerste lid][ref2], en [2.175, eerste lid][ref3], zijn gereserveerd,
      of die in strijd met artikel 2.174a, tweede lid, tweede volzin, niet zijn ontvangen, vordert het Commissariaat van
      de NPO, de RPO of de landelijke of regionale publieke media-instelling terug.

      2 Teruggevorderde gelden worden toegevoegd aan de algemene mediareserve.


