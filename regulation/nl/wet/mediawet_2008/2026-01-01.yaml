        afdeling: 2.5.2
  - number: 9.14f
    text: |-
      In afwijking van [artikel 2.65, eerste lid][ref1], blijft een aanwijzing als regionale publieke media-instelling
      op grond van artikel 2.65, eerste lid, zoals dat luidde op de dag voorafgaand aan de inwerkingtreding van dit
      artikel, die geldt op de dag waarop artikel I, onderdeel Ma, van de Wijziging van de Mediawet 2008 met het oog op
      de versterking van het toekomstperspectief van de publieke omroep in werking treedt, gelden tot en met 31 december
      2025 en vervalt daarna van rechtswege.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.65
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel9.14f
