  - number: '2.168'
    text: |-
      1 Renteopbrengsten uit het beheer van de algemene mediareserve zijn bestemd voor door Onze Minister te bepalen
      mediadoeleinden in brede zin.

      2 Onze Minister kan uit de renteopbrengsten gelden ter beschikking stellen aan:

      a. de NPO, de RPO en de landelijke en regionale publieke media-instellingen;

      b. het overlegorgaan van lokale publieke media-instellingen, bedoeld in [artikel 2.146, onder l][ref1], het
      Stimuleringsfonds voor de journalistiek, bedoeld in [artikel 8.1][ref2], en de door hem aangewezen instellingen
      voor het in stand houden en exploiteren van omroeporkesten en omroepkoren, van een media-archief en van een
      expertisecentrum voor media-educatie;

      c. het Commissariaat.

      3 [Artikel 2.167, tweede en derde lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.146
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel8.1
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel2.167
