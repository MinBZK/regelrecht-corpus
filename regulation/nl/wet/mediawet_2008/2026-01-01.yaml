  - number: 3.29h
    text: |-
      1 Een media-instelling als bedoeld in [artikel 3.29e, eerste lid][ref1], informeert het Commissariaat jaarlijks
      vóór 1 juli met betrekking tot het voorgaande boekjaar over het volgende:

      a. de samenstelling en hoogte van de relevante omzet; en

      b. de uitvoering van de investering bedoeld in [artikel 3.29e, eerste lid][ref2].

      2 Het eerste lid is niet van toepassing op een media-instelling waarvan de totale in Nederland gegenereerde omzet
      minder dan € 10 miljoen per boekjaar betreft.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld over de aanlevering van informatie of stukken bij
      het Commissariaat ter uitvoering van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3.29e
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel3.29e
