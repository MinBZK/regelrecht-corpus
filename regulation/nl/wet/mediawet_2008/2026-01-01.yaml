  - number: '2.149'
    text: |-
      1 Onze Minister stelt jaarlijks vóór 1 december met inachtneming van [artikel 2.148a][ref1] de budgetten van de
      landelijke publieke mediadienst voor het komende jaar vast voor:

      a. de verzorging van het media-aanbod van de omroeporganisaties die een erkenning als bedoeld in
      [artikel 2.23, eerste lid][ref2], hebben verkregen, gezamenlijk;

      b. de verzorging van het media-aanbod van de omroepverenigingen die een voorlopige erkenning als bedoeld in
      [artikel 2.23, tweede lid][ref3], hebben verkregen, gezamenlijk;

      c. de verzorging van het media-aanbod van de NOS;

      d. de verzorging van het media-aanbod van de NTR;

      e. de uitvoering van de taken en werkzaamheden van de NPO; en

      f. de versterking van het media-aanbod van de landelijke publieke mediadienst.

      2 Onze Minister stelt de budgetten vast op tachtig procent van de overeenkomstige budgetten van het voorgaande jaar
      als de NPO de begroting niet volgens de daarvoor geldende regels heeft ingediend.


