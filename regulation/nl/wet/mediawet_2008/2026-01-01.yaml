        artikel: '1.1'
  - number: 3a.2
    text: |-
      1 Onder de bevoegdheid van Nederland valt een aanbieder van een videoplatformdienst die krachtens artikel 28bis,
      eerste tot en met vierde lid, van de Europese richtlijn in Nederland is gevestigd of geacht wordt in Nederland te
      zijn gevestigd.

      2 Een aanbieder van een videoplatform stelt, gemakkelijk, rechtstreeks en permanent ten minste de volgende gegevens
      beschikbaar voor het publiek:

      a. naam;

      b. plaats van vestiging;

      c. contactgegevens waaronder e-mailadres of internetadres; en

      d. de naam van het Commissariaat als het orgaan dat is belast met het toezicht op de naleving van het bepaalde bij
      of krachtens dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel3a.2
  - number: 3a.3
    text: |-
      1 Een aanbieder van een videoplatform heeft een gedragscode die maatregelen voorschrijft als bedoeld in
      artikel 28ter, eerste lid, en tweede lid, tweede en vierde alinea, van de Europese richtlijn, en past deze
      gedragscode en maatregelen op dit videoplatform toe.

      2 De gedragscode, bedoeld in het eerste lid, omvat daartoe naargelang het geval de maatregelen als genoemd in
      artikel 28ter, derde lid, van de Europese richtlijn.

      3 De gedragscode, bedoeld in eerste lid, bevat duidelijke en ondubbelzinnige doelstellingen en voorziet in:

      a. regelmatige, transparante en onafhankelijke toezicht- en evaluatiemaatregelen ten aanzien van de mate waarin de
      doelstellingen worden bereikt; en

      b. doeltreffende handhaving, met inbegrip van doeltreffende en evenredige sancties.

      4 De aanbieder van een videoplatform zorgt ervoor dat de gedragscode voldoende draagvlak heeft onder de
      belangrijkste betrokkenen.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel3a.3
  - number: 3a.4
    text: |-
      1 Een aanbieder van een videoplatform die audiovisuele commerciële communicatie in de handel brengt, verkoopt of
      organiseert, is aangesloten bij de Nederlandse Reclame Code of een vergelijkbare door de Stichting Reclame Code tot
      stand gebrachte regeling en ter zake onderworpen aan het toezicht van de Stichting Reclame Code.

      2 Aansluiting wordt aangetoond door een schriftelijke verklaring van de Stichting Reclame Code aan het
      Commissariaat over te leggen.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel3a.4
  - number: 3a.5
    text: |-
      1 Audiovisuele commerciële communicatie op een videoplatformdienst is als zodanig herkenbaar.

      2 In audiovisuele commerciële communicatie wordt geen subliminale technieken gebruikt.

      3 Audiovisuele commerciële communicatie wordt niet aangeboden in de vorm van sluikreclame.

      4 Indien audiovisueel media-aanbod of door gebruikers gegenereerde video's audiovisuele commerciële communicatie
      bevatten en de aanbieder van een videoplatform daarvan op de hoogte is, informeert de aanbieder van een
      videoplatform de gebruiker van de videoplatformdienst hierover op een manier die voor de gebruiker duidelijk is.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel3a.5
  - number: '4.1'
    text: |-
      1 Het audiovisueel media-aanbod mag alleen dan aanbod bevatten dat schade kan toebrengen aan de lichamelijke,
      geestelijke of morele ontwikkeling van personen jonger dan zestien jaar, als de instelling die verantwoordelijk
      is voor de inhoud van het aanbod is aangesloten bij de door Onze Minister erkende organisatie, bedoeld in
      [artikel 4.2, eerste lid][ref1], en ter zake gebonden is aan de regels en het toezicht daarop van die organisatie
      met betrekking tot het verspreiden van het hiervoor bedoelde aanbod.

      2 De instelling die is aangesloten bij de door Onze Minister erkende organisatie, bedoeld in
      [artikel 4.2, eerste lid][ref2], toont dit aan door een schriftelijke verklaring van de erkende organisatie aan
      het Commissariaat over te leggen.

      3 Het eerste en tweede lid zijn niet van toepassing voor zover het audiovisueel media-aanbod wordt aangeboden
      in een andere lidstaat van de Europese Unie en de aanbieder daarvan aan het Commissariaat heeft aangetoond dat
      de bescherming van personen jonger dan zestien jaar tegen het betreffende audiovisuele media-aanbod ten minste
      overeenkomstig is aan het beschermingsniveau als bedoeld in [artikel 4.2][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel4.2
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel4.2
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel4.2
