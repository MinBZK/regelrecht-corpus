    text: |-
      1 Onze Minister trekt een erkenning in als de erkende organisatie niet meer voldoet aan de [artikelen 4.2][ref1]
      en [4.3, eerste lid][ref2].

      2 Onze Minister kan een erkenning intrekken als de erkende organisatie niet voldoet aan de nadere regels en andere
      eisen, bedoeld in [artikel 4.3, tweede lid][ref3], of de voorschriften, bedoeld in [artikel 4.3, derde lid][ref4].


