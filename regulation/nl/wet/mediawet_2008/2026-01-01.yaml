      [artikel 2.23, eerste lid][ref3], alleen verlenen aan:

      a. de omroepverenigingen Evangelische Omroep, MAX en VPRO;

      b. de omroeporganisaties die gevormd zijn uit de omroepverenigingen Algemene Omroepvereniging AVRO en TROS, BNN en
      VARA onderscheidenlijk KRO en NCRV; en

      c. de omroeporganisaties van de in de onderdelen a en b genoemde samenstelling met inbegrip van een of beide
      omroepverenigingen PowNed en WNL.


