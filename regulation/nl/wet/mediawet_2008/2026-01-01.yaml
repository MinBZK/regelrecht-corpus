  - number: 2.60k
    text: |-
      Voor de verwezenlijking van de publieke mediaopdracht op regionaal niveau wordt bij koninklijk besluit aan de RPO
      een concessie verleend die geldt voor tien jaar en in werking treedt met ingang van een in het koninklijk besluit
      te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.60k
  - number: 2.60l
    text: |-
      1 Voorafgaand aan de concessieverlening en vóór aanvang van de tweede periode van vijf jaar van de concessieperiode
      dient de RPO een concessiebeleidsplan RPO voor de komende vijf jaar in bij Onze Minister.

      2 Het concessiebeleidsplan RPO bevat in elk geval:

      a. een beschrijving van de wijze waarop in de komende vijf jaar de publieke mediaopdracht op regionaal niveau
      wordt uitgevoerd, tevens uitgewerkt in kwantitatieve en kwalitatieve doelstellingen voor het media-aanbod en het
      publieksbereik van de regionale publieke mediadienst;

      b. aard en aantal van de programmakanalen en de daarvoor gewenste frequentieruimte;

      c. aard en aantal van de overige aanbodkanalen;

      d. een onderbouwd overzicht van de naar verwachting benodigde organisatorische, personele, materiële en financiële
      middelen; en

      e. een beschrijving van de samenwerking met de landelijke en lokale publieke media-instellingen en anderen.

      3 Bij ministeriële regeling kunnen regels gesteld worden over de inrichting van het concessiebeleidsplan RPO en het
      tijdstip van indiening.

      4 Het bestuur van de RPO stelt het concessiebeleidsplan RPO vast na overleg met in elk geval de regionale publieke
      media-instellingen en, voor zover het de samenwerking betreft, de betrokken landelijke en lokale publieke media-
      instellingen.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.60l
  - number: 2.60m
    text: |-
      1 De RPO maakt het concessiebeleidsplan RPO openbaar.

      2 Over het concessiebeleidsplan RPO vraagt Onze Minister advies aan het Commissariaat en de Raad voor cultuur. Bij
      toepassing van het vierde lid wordt het advies gevraagd na afloop van de termijn, genoemd in dat lid, onder a.

      3 Het concessiebeleidsplan RPO behoeft de instemming van Onze Minister voor zover het betreft de onderwerpen,
      bedoeld in [artikel 2.60l, tweede lid, onder b en c][ref1], waarbij de instemming geschiedt in overeenstemming met
      het bepaalde in de [Telecommunicatiewet][ref2].

      4 Voor zover de instemming, bedoeld in het derde lid, betrekking heeft op een nieuw of significant gewijzigd
      aanbodkanaal:

      a. kunnen belanghebbenden gedurende vier weken na openbaarmaking van het concessiebeleidsplan mondeling of
      schriftelijk zienswijzen naar voren brengen bij Onze Minister; en

      b. kan Onze Minister de Autoriteit Consument en Markt na afloop van de termijn, genoemd onder a, verzoeken een
      rapportage uit te brengen met een analyse van de mogelijke effecten van het aanbodkanaal op de daarvoor relevante
      markten.

      5 Bij toepassing van het vierde lid maken het Commissariaat, de Raad voor cultuur en de Autoriteit Consument en
      Markt ten behoeve van hun adviezen dan wel rapportage gebruik van de zienswijzen, bedoeld in dat lid, onder a. Onze
      Minister doet die zienswijzen aan hen toekomen.

      6 Het Commissariaat kan de Autoriteit Consument en Markt de gegevens verstrekken die noodzakelijk zijn voor de
      analyse, bedoeld in het vierde lid, aanhef en onder b.

      7 Op de voorbereiding van een besluit over instemming als bedoeld in het vierde lid is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref3] van toepassing.

      8 Als de RPO wijzigingen wil aanbrengen in het door Onze Minister goedgekeurde deel van het concessiebeleidsplan
      RPO, dan neemt zij die op in de begroting. Het eerste tot en met zevende lid zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.60l
      [ref2]: https://wetten.overheid.nl/BWBR0009950
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.60m
