  - number: '2.22'
    text: |-
      1 Mede op basis van het concessiebeleidsplan sluiten Onze Minister en de NPO een prestatieovereenkomst voor de duur
      van het concessiebeleidsplan.

      2 De prestatieovereenkomst bevat afspraken over:

      a. kwalitatieve en kwantitatieve doelstellingen voor het media-aanbod, de publieksbetrokkenheid en het
      publieksbereik van de landelijke publieke mediadienst;

      b. maatregelen bij niet naleving, voor zover mogelijk binnen het bepaalde bij of krachtens deze wet; en

      c. tussentijdse wijziging in verband met veranderende inzichten of omstandigheden.

      3 De prestatieovereenkomst heeft geen betrekking op de inhoud van het media-aanbod van de landelijke publieke
      mediadienst.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.22
  - number: '2.23'
    text: |-
      1 Onze Minister kan eens in de vijf jaar aan ten hoogste zes omroeporganisaties erkenningen verlenen voor de
      verzorging van media-aanbod voor de landelijke publieke mediadienst volgens de bepalingen van deze afdeling. Een
      omroeporganisatie is een omroepvereniging als bedoeld in [artikel 2.24][ref1] of een samenwerkingsomroep als
      bedoeld in [artikel 2.24a][ref2].

      2 Onze Minister kan eens in de vijf jaar voorlopige erkenningen verlenen aan omroepverenigingen voor de verzorging
      van media-aanbod voor de landelijke publieke mediadienst volgens de bepalingen van deze afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.24
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.24a
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.23
    references:
