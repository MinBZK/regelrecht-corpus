  - number: 6.14d
    text: |-
      Het Commissariaat kan geheel of gedeeltelijk ontheffing verlenen van de verplichtingen, bedoeld in de
      [artikelen 6.13][ref1], [6.14][ref2] en [6.14b][ref3] en de op die artikelen berustende voorschriften, als het
      onverkort nakomen daarvan leidt tot disproportionele kosten, tot een belemmering van innovatie of tot anderszins
      onredelijke uitkomsten. Het Commissariaat kan aan een ontheffing voorschriften verbinden.


