  - number: 2.60a
    text: |-
      1 Onze Minister wijst een stichting aan als het samenwerkings- en coördinatieorgaan voor de uitvoering van de
      publieke mediaopdracht op regionaal niveau, bedoeld in [artikel 2.1][ref1].

      2 De stichting, bedoeld in het eerste lid, wordt voor de toepassing van deze wet aangeduid als de RPO.

      3 De RPO wordt belast met de volgende taken:

      a. het bevorderen van samenwerking en coördinatie met het oog op de uitvoering van de publieke mediaopdracht op
      regionaal niveau;

      b. het behartigen van zaken die van gemeenschappelijk belang zijn voor de regionale publieke mediadienst en de
      regionale publieke media-instellingen;

      c. het sluiten van collectieve arbeidsovereenkomsten en het vaststellen van normen voor de honorering van
      freelancers, mede in naam van de regionale publieke media-instellingen;

      d. het bevorderen van een doelmatige inzet van de gelden die bestemd zijn voor de verzorging en verspreiding van
      het media-aanbod en het bevorderen van geïntegreerde financiële verslaglegging en verantwoording;

      e. het inrichten, in stand houden, beheren en exploiteren en regelen van het gebruik van organen, diensten en
      faciliteiten, waaronder studio’s en distributie-infrastructuren, die nodig zijn voor een goede uitvoering van de
      publieke mediaopdracht op regionaal niveau; en

      f. andere taken waarmee zij bij de wet wordt belast.

      4 De [Kaderwet zelfstandige bestuursorganen][ref2] is niet van toepassing op de RPO.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.60a
