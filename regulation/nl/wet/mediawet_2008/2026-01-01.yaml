  - number: 2.99d
    text: |-
      1 Het lidmaatschap van de raad van toezicht van de Ster is onverenigbaar met:

      a. de functie van lid van het bestuur van de Ster;

      b. het lidmaatschap van een orgaan van of een dienstbetrekking bij de NPO, de RPO, het overlegorgaan, bedoeld in
      [artikel 2.146, aanhef en onder l][ref1], of een publieke media-instelling;

      c. het lidmaatschap van een orgaan van of een dienstbetrekking bij een commerciële media-instelling;

      d. het lidmaatschap van een van beide Kamers der Staten-Generaal, een provinciaal bestuur of een gemeentebestuur;

      e. een dienstbetrekking bij een ministerie of bij een dienst, instelling of bedrijf direct vallende onder de
      verantwoordelijkheid van een minister;

      f. het hebben van financiële of andere belangen bij bedrijven of instellingen en het vervullen van nevenfuncties
      waardoor een goede vervulling van de functie of de handhaving van de onafhankelijkheid van het betrokken lid of van
      het vertrouwen daarin in het geding kan zijn; en

      g. het lidmaatschap van een orgaan van of een dienstbetrekking bij een omroepvereniging die in een
      samenwerkingsomroep vertegenwoordigd is.

      2 Schorsing en ontslag zijn mogelijk wegens:

      a. ongeschiktheid;

      b. disfunctioneren; en

      c. onverenigbaarheid als bedoeld in het eerste lid.

      3 Ontslag is verder mogelijk op eigen verzoek.

      4 De leden van de raad van toezicht ontvangen van de Ster een door Onze Minister vast te stellen vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.146
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.99d
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.146'
        hoofdstuk: '2'
        afdeling: 2.6.1
  - number: 2.99e
    text: |-
      1 De raad van toezicht van de Ster houdt toezicht op het beleid van het bestuur van de Ster en op de algemene gang
      van zaken binnen de Ster en staat het bestuur met advies terzijde.

      2 Bij de vervulling van hun taak richten de leden van de raad van toezicht zich naar het algemene belang van de
      Ster en naar haar taak als onderdeel van het publieke mediabestel.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.99e
  - number: '2.100'
    text: |-
      1 Het bestuur van de Ster bestaat uit ten hoogste drie leden, die door de raad van toezicht van de Ster worden
      benoemd, geschorst en ontslagen.

      2 [Artikel 2.99d, eerste lid, aanhef en onder b tot en met g][ref1], is van overeenkomstige toepassing op het
      lidmaatschap van het bestuur van de Ster.

      3 Het bestuur is in dienst van de Ster. De raad van toezicht stelt zijn arbeidsvoorwaarden vast.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.99d
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.100
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: 2.99d
        hoofdstuk: '2'
        paragraaf: 2.5.2.3
        afdeling: 2.5.2
  - number: '2.101'
    text: |-
      1 Benoeming van de leden van het bestuur van de Ster geschiedt voor een periode van vijf jaar en herbenoeming voor
      een aansluitende periode is eenmaal mogelijk.

      2 Schorsing en ontslag zijn mogelijk wegens:

      a. ongeschiktheid;

      b. disfunctioneren; en

      c. onverenigbaarheid als bedoeld in [artikel 2.99d, eerste lid, aanhef en onder b tot en met g][ref1], in samenhang
      met [artikel 2.100, tweede lid][ref2].

      3 Ontslag is verder mogelijk op eigen verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.99d
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.100
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.101
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: 2.99d
        hoofdstuk: '2'
        paragraaf: 2.5.2.3
        afdeling: 2.5.2
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2.100'
        hoofdstuk: '2'
        paragraaf: 2.5.2.3
        afdeling: 2.5.2
  - number: 2.101a
    text: |-
      1 Het bestuur van de Ster bestuurt de Ster.

      2 Het bestuur is belast met de dagelijks leiding en het financiële beheer van de Ster.

      3 Het bestuur is verder belast met datgene wat niet uitdrukkelijk tot de taken van de raad van toezicht van de
      Ster behoort.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.101a
  - number: '2.102'
    text: |-
      1 De Ster verstrekt Onze Minister desgevraagd alle inlichtingen met betrekking tot de werkzaamheden van de Ster.

      2 Onze Minister kan inzage verlangen in zakelijke gegevens en bescheiden van de Ster voor zover dat voor de
      vervulling van zijn taak nodig is.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.102
  - number: 2.102a
    text: |-
      1 Als de Ster naar de mening van Onze Minister haar taken ernstig verwaarloost, kan Onze Minister na overleg met de
      Ster de noodzakelijke voorzieningen treffen.

      2 Onze Minister stelt de Tweede Kamer der Staten-Generaal onverwijld in kennis van de door hem getroffen
      voorzieningen.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.102a
  - number: '2.103'
    text: |-
      1 De Ster stelt jaarlijks vóór 1 juni een bestuursverslag over het afgelopen kalenderjaar vast.

      2 In het bestuursverslag wordt aandacht besteed aan de werkzaamheden van de Ster, het gevoerde beleid in het
      algemeen en de doelmatigheid en doeltreffendheid van de werkwijze in het bijzonder.

      3 De Ster zendt het verslag aan Onze Minister en maakt het openbaar.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.103
  - number: '2.104'
    text: |-
      1 Wijzigingen in de statuten van de Ster behoeven de instemming van Onze Minister.

      2 De raad van toezicht of het bestuur van de Ster kan niet besluiten tot ontbinding van de Ster.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.104
  - number: 2.104a
    text: |-
      De raad van bestuur bevordert dat tussen de NPO en de Ster afspraken tot stand komen over het beleid inzake de
      inkomsten uit reclame- en telewinkelboodschappen op de aanbodkanalen van de landelijke publieke mediadienst en de
      wederzijdse inspanningen daarvoor.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.104a
  - number: '2.105'
    text: |-
      1 De Ster doet jaarlijks vóór 15 september aan Onze Minister opgave van de verwachte inkomsten uit de reclame- en
      telewinkelboodschappen van de landelijke publieke mediadienst in het lopende en in het volgende kalenderjaar.

      2 De Ster zendt een afschrift van deze opgaven ter kennisneming aan het Commissariaat en de NPO.

      3 De inkomsten die de Ster verwerft uit de verzorging van reclame- en telewinkelboodschappen voor de landelijke
      publieke mediadienst stelt zij na aftrek van de door Onze Minister goedgekeurde uitgaven ter beschikking van Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.105
  - number: '2.106'
    text: |-
      1 Media-aanbod van de publieke mediadiensten wordt niet gesponsord.

      2 Het eerste lid is niet van toepassing op media-aanbod:

      a. van culturele aard;

      b. van educatieve aard;

      c. bestaande uit het verslag of de weergave van een of meer sportevenementen of sportwedstrijden; en

      d. bestaande uit het verslag of de weergave van evenementen ten behoeve van ideële doelen.

      3 Media-aanbod als bedoeld in het tweede lid wordt niet gesponsord als het:

      a. geheel of gedeeltelijk bestaat uit nieuws, actualiteiten of politieke informatie; of

      b. in het bijzonder is bestemd voor kinderen jonger dan twaalf jaar.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.106
  - number: '2.107'
    text: |-
      1 Bij gesponsord media-aanbod wordt ter informatie van het publiek duidelijk vermeld dat en door wie het media-
      aanbod is gesponsord.

      2 De vermelding geschiedt door neutrale vermelding of vertoning van naam, (beeld)merk of ander onderscheidend teken
      van de sponsor.

      3 Bij een gesponsord programma vindt de vermelding plaats aan het begin of het einde van het programma en kan de
      vermelding daarnaast plaatsvinden aan het begin of het einde van een reclameblok dat in het programma is opgenomen.

      4 Ten aanzien van de vermelding geldt dat zij:

      a. ten hoogste vijf seconden duurt;

      b. voor zover deze niet plaatsvindt op de aan- of aftiteling, uitsluitend uit stilstaande beelden bestaat; en

      c. niet beeldvullend is.

      5 Het derde en vierde lid zijn zo veel mogelijk van overeenkomstige toepassing op het overige media-aanbod van de
      publieke mediadiensten.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.107
  - number: '2.108'
    text: |-
      1 In gesponsord media-aanbod mogen producten of diensten van een sponsor worden vermeld of getoond, behalve als
      deze een bijdrage in geld heeft gegeven en onverminderd [artikel 2.88b, derde lid, aanhef en onderdeel b][ref1].

      2 Het Commissariaat kan toestemming verlenen voor het vermelden of vertonen van de naam, het (beeld)merk, producten
      of diensten van sponsors in de titel van gesponsord media-aanbod, mits het publiek niet rechtstreeks door middel
      van specifieke aanprijzingen wordt aangespoord tot het kopen of huren van producten of afname van diensten van
      de sponsors.

      3 Het Commissariaat kan aan het verlenen van toestemming voorschriften verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.88b
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.108
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: 2.88b
        hoofdstuk: '2'
        afdeling: 2.5.1
  - number: '2.109'
    text: |-
      Sponsorbijdragen worden rechtstreeks van de sponsors en door middel van een schriftelijke overeenkomst bedongen
      of aanvaard.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.109
  - number: '2.110'
    text: |-
      De landelijke publieke media-instellingen sturen een afschrift van een sponsorovereenkomst aan de raad van bestuur:

      a. binnen één week na het tot stand komen daarvan; of

      b. als het media-aanbod eerder wordt verspreid naar het publiek, vóór laatstgenoemd moment.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.110
  - number: '2.111'
    text: |-
      1 Als de raad van bestuur binnen twee weken na ontvangst van het afschrift van de sponsorovereenkomst, of in het
      geval van [artikel 2.110, onderdeel b][ref1], vóór de beoogde datum van verspreiding, schriftelijk heeft meegedeeld
      dat de sponsorovereenkomst in strijd is met het gemeenschappelijke belang van de landelijke publieke mediadienst,
      wordt het media-aanbod waarop de overeenkomst betrekking heeft niet verspreid, tenzij de overeenkomst wordt
      ontbonden of gewijzigd.

      2 In het geval de raad van bestuur aanvullende informatie verlangt, moet voor de toepassing van het eerste lid de
      schriftelijke mededeling zijn gegeven binnen twee weken nadat de aanvullende informatie is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.110
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.111
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.110'
        hoofdstuk: '2'
        afdeling: 2.5.3
  - number: '2.112'
    text: |-
      De [artikelen 2.110][ref1] en [2.111][ref2] zijn van overeenkomstige toepassing op de wijziging van een
      sponsorovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.110
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.111
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.112
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.110'
        hoofdstuk: '2'
        afdeling: 2.5.3
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2.111'
        hoofdstuk: '2'
        afdeling: 2.5.3
  - number: '2.113'
    text: |-
      De publieke media-instellingen brengen jaarlijks via de jaarrekening verslag uit over de inkomsten uit
      sponsorbijdragen, het gesponsorde media-aanbod en de hoedanigheid van de sponsors, gespecificeerd per onderdeel van
      het media-aanbod.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.113
  - number: '2.114'
    text: |-
      De [artikelen 2.107 tot en met 2.113][ref1] zijn van overeenkomstige toepassing als een andere instelling dan
      bedoeld in de begripsomschrijving van sponsoring in [artikel 1.1][ref2] een bijdrage heeft gegeven voor de
      productie of aankoop van media-aanbod om de verspreiding daarvan te bevorderen of mogelijk te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.107
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.114
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.107'
        hoofdstuk: '2'
        afdeling: 2.5.3
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '1.1'
        hoofdstuk: '1'
  - number: '2.115'
    text: |-
      1 Op elk televisieprogrammakanaal van de landelijke en regionale publieke mediadienst bestaat het programma-
      aanbod voor ten minste vijftig procent van de duur uit Europese producties in de zin van artikel 1 van de Europese
      richtlijn.

      2 Het audiovisueel media-aanbod op aanvraag bestaat per aanbodkanaal voor ten minste dertig procent uit Europese
      producties als bedoeld in artikel 1 van de Europese richtlijn.

      3 De Europese producties van een aanbodkanaal als bedoeld in het tweede lid worden door de aanbieder van het
      aanbodkanaal onder de aandacht van het publiek gebracht.

      4 Het tweede en derde lid zijn niet van toepassing op een mediadienst op aanvraag van een publieke media-instelling
      met een lage omzet of een klein publiek.

      5 Het Commissariaat kan aan een publieke media-instelling of aan de NPO ontheffing verlenen van het tweede en het
      derde lid indien de toepassing van deze leden gelet op de aard of het onderwerp van deze mediadienst op aanvraag
      praktisch onhaalbaar of ongerechtvaardigd zou zijn.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.115
  - number: '2.116'
    text: |-
      1 Bij algemene maatregel van bestuur wordt vastgesteld hoeveel procent van het totaal van de budgetten, bedoeld
      in [artikel 2.149, eerste lid][ref1], met uitzondering van onderdeel e, wordt besteed aan Europese producties
      als bedoeld in artikel 1 van de Europese richtlijn die kunnen worden aangemerkt als onafhankelijke productie. Het
      percentage, bedoeld in de vorige volzin, wordt vastgesteld op ten minste tien en ten hoogste vijfentwintig procent.

      2 Op elk van de televisieprogrammakanalen van de landelijke publieke mediadienst bestaat het programma-aanbod
      uit ten minste tien procent van de duur uit producties als bedoeld in [artikel 2.115][ref2] die kunnen worden
      aangemerkt als onafhankelijke productie.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.149
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.115
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.116
