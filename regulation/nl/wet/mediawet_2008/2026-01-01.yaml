  - number: '2.29'
    text: |-
      1 Een erkenning of een voorlopige erkenning wordt op aanvraag verleend en geldt voor een periode van vijf jaar
      die samenvalt met een vijfjaarlijkse periode van de concessie als bedoeld in [artikel 2.19, derde lid][ref1], en
      vervalt van rechtswege na afloop van de erkenningperiode.

      2 Een erkenning kan alleen overgaan met toestemming van Onze Minister op aanvraag van de omroeporganisatie
      waaraan deze is verleend, en alleen aan een omroeporganisatie die door fusie is gevormd overeenkomstig
      [artikel 2.25, eerste lid, aanhef en onderdeel a, onder 2°, 3° of 4°][ref2]. Aan een toestemming kunnen
      voorwaarden worden verbonden. [Artikel 2.32, eerste lid][ref3], wat betreft de [artikelen 2.24][ref4] en
      [2.24a, en tweede lid, onderdelen a en c][ref5], is van overeenkomstige toepassing.

      3 Een erkenning of voorlopige erkenning geeft aanspraak op een financiële bijdrage voor de verzorging van media-
      aanbod volgens het bepaalde bij of krachtens deze wet.

      4 Door overgang van een erkenning treedt de verkrijgende omroeporganisatie in alle uit de wet voortvloeiende
      rechten en verplichtingen van haar rechtsvoorganger.


