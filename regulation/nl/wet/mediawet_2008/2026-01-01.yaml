        bwb_id: BWBR0027466
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0027466
        artikel: '46'
  - number: '6.28'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over het verzorgen van omroepdiensten die
      uitsluitend bestemd zijn voor de in Nederland gelegerde militairen van buitenlandse strijdkrachten en hun gezinnen.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel6.28
  - number: '7.1'
    text: |-
      1 Er is een Commissariaat voor de Media.

      2 Het Commissariaat heeft rechtspersoonlijkheid en is gevestigd in de gemeente Hilversum.

      3 Het Commissariaat is belast met de uitvoering van taken die hem zijn opgedragen bij of krachtens deze wet en
      andere wetten.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel7.1
  - number: '7.2'
    text: |-
      Op het Commissariaat is de [Kaderwet zelfstandige bestuursorganen][ref1] van toepassing met uitzondering van
      [artikel 17][ref2] voor zover het betreft het bepaalde in [artikel 2.139, zesde lid][ref3], van de Mediawet 2008.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel2.139
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0020495
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '17'
      - id: ref3
        bwb_id: BWBR0025028
        artikel: '2.139'
        hoofdstuk: '2'
        afdeling: 2.5.6
  - number: '7.3'
    text: |-
      1 Het Commissariaat bestaat uit een voorzitter en twee of vier andere leden.

      2 Een benoeming geschiedt voor vijf jaar en herbenoeming voor een aansluitende periode is eenmaal mogelijk.

      3 Onverminderd [artikel 12 van de Kaderwet zelfstandige bestuursorganen][ref1] gebeurt benoeming door Onze Minister
      van de leden van het Commissariaat op de zwaarwegende voordracht van het Commissariaat en met inachtneming van het
      vierde tot en met twaalfde lid.

      4 Bij een vacature draagt het Commissariaat zorg voor de procedure die leidt tot de voordracht, bedoeld in het
      derde lid.

      5 Het Commissariaat stelt profielschetsen op voor de vacature en voor het Commissariaat als geheel.

      6 De profielschetsen behoeven de instemming van Onze Minister.

      7 Het Commissariaat maakt de profielschetsen na de instemming openbaar.

      8 Voor de selectie van kandidaten stelt het Commissariaat een onafhankelijke benoemingsadviescommissie in.

      9 De benoemingsadviescommissie is samengesteld uit een gelijk aantal onafhankelijke leden, leden namens het
      Commissariaat en leden namens Onze Minister.

      10 Het advies van de benoemingsadviescommissie berust op unanieme besluitvorming.

      11 De benoemingsadviescommissie brengt aan het Commissariaat een bindend advies uit.

      12 De voordracht van het Commissariaat aan Onze Minister is gemotiveerd, waarbij in elk geval wordt ingegaan op de
      geschiktheid, de profielschetsen, de positie van de kandidaat in het rooster van aftreden en de procedure die heeft
      geleid tot de voordracht.

      13 Onze Minister neemt de voordracht over, tenzij deze in strijd is met:

      a. deze wet;

      b. eisen van zorgvuldigheid; of

      c. andere zwaarwegende belangen.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel12
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '12'
  - number: '7.4'
    text: |-
      Onverminderd [artikel 13 van de Kaderwet zelfstandige bestuursorganen][ref1] zijn onverenigbaar met het
      lidmaatschap van het Commissariaat:

      a. het lidmaatschap van een van beide Kamers der Staten-Generaal, een provinciaal bestuur of een gemeentebestuur;

      b. een dienstbetrekking bij een ministerie, een dienst, instelling of bedrijf vallende onder de
      verantwoordelijkheid van een minister; en

      c. het lidmaatschap van een orgaan van of een dienstbetrekking bij de NPO, de RPO, een publieke media-instelling,
      een omroepvereniging die in een samenwerkingsomroep vertegenwoordigd is, een commerciële media-instelling of een
      uitgever van een persorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel13
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '13'
  - number: '7.5'
    text: |-
      1 Het Commissariaat neemt besluiten bij meerderheid van stemmen.

      2 Het Commissariaat kan alleen met instemming van alle leden aan één of meer van zijn leden mandaat en machtiging
      verlenen voor het uitvoeren van delen van zijn taak.

      3 Het Commissariaat stelt inzake zijn besluitvorming en werkwijze een bestuursreglement vast.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel7.5
  - number: '7.6'
    text: De kosten van het Commissariaat worden door Onze Minister vergoed op basis van de door hem goedgekeurde begroting.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel7.6
  - number: '7.7'
    text: |-
      1 Onverminderd [artikel 34 van de Kaderwet zelfstandige bestuursorganen][ref1] dient het Commissariaat jaarlijks
      voor 1 september bij Onze Minister een financieel verslag in over het beheer van de algemene mediareserve, bedoeld
      in [artikel 2.166][ref2].

      2 Het financieel verslag gaat vergezeld van een verklaring omtrent de getrouwheid en de rechtmatigheid, afgegeven
      door een accountant als bedoeld in [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref3] en behoeft de
      instemming van Onze Minister.

      3 Het Commissariaat maakt het financieel verslag openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.166
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2.166'
        hoofdstuk: '2'
        afdeling: 2.6.4
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '7.8'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de inhoud en inrichting van de begroting, het
      financieel verslag en aandachtspunten voor de accountantscontrole.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel7.8
  - number: '7.9'
    text: |-
      1 Het Commissariaat zendt besluiten zo spoedig mogelijk na de bekendmaking aan Onze Minister.

      2 Besluiten van het Commissariaat kunnen binnen acht weken na ontvangst daarvan door Onze Minister dan wel
      gedurende de tijd dat het besluit is geschorst worden vernietigd.

      3 Besluiten van het Commissariaat kunnen binnen acht weken na ontvangst daarvan door Onze Minister worden
      geschorst.

      4 Van een besluit tot schorsing, opheffing of verlenging van de schorsing wordt mededeling gedaan in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel7.9
  - number: '7.10'
    text: |-
      Het Commissariaat plaatst besluiten tot vaststelling van nadere regels op grond van deze wet en tot vaststelling
      van beleidsregels over de uitvoering van zijn taken in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel7.10
  - number: '7.11'
    text: |-
      1 Het Commissariaat is belast met de bestuursrechtelijke handhaving van het bepaalde bij of krachtens deze wet, met
      uitzondering van:

      a. de [artikelen 2.2, eerste lid en tweede lid, onderdelen a tot en met h, j tot en met l][ref1],
      [2.3, eerste tot en met vierde lid][ref2], [2.4 tot en met 2.16][ref3], [2.18 tot en met 2.27][ref4],
      [2.29 tot en met 2.33][ref5], [2.34a tot en met 2.34j][ref6], [2.36 tot en met 2.41][ref7],
      [2.53 tot en met 2.57][ref8], [2.59][ref9], [2.60][ref10], [2.60a tot en met 2.60o][ref11],
      [2.125 tot en met 2.131][ref12], [2.143 tot en met 2.145][ref13], [2.148a][ref14], [2.149][ref15],
      [2.150, eerste lid][ref16], [2.151, eerste lid][ref17], [2.166 tot en met 2.168][ref18],
      [2.169c, eerste tot en met vierde lid][ref19], [2.170c][ref20], [2.170d][ref21], [2.180 tot en met 2.187][ref22],
      [4.2 tot en met 4.5][ref23] en [6.26][ref24]; en

      b. [hoofdstuk 8][ref25].

      2 Met het toezicht op de naleving zijn belast de leden van het Commissariaat en de bij besluit van het
      Commissariaat aangewezen medewerkers van het Commissariaat.

      3 Van een besluit als bedoeld in het tweede lid wordt mededeling gedaan door plaatsing in de Staatscourant.


