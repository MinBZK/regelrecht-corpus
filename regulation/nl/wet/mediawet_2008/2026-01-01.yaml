        afdeling: 2.2.2
  - number: '2.13'
    text: |-
      1 Het lidmaatschap van het college van omroepen is onverenigbaar met het lidmaatschap van een redactie als bedoeld
      in [artikel 2.56][ref1].

      2 Het college wijst uit zijn midden de voorzitter aan en regelt zijn eigen werkwijze.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.56
