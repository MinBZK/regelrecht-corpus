  - number: 7.16a
    text: |-
      1 Het Commissariaat kan aan een landelijke of regionale publieke media-instelling een aanwijzing geven, als:

      a. sprake is van wanbeheer van een of meer leden van het bestuur of van het toezichthoudende orgaan; of

      b. deugdelijke inrichting, sturing en beheersing van bedrijfsprocessen of deugdelijke administratie onvoldoende
      gewaarborgd zijn.

      Een aanwijzing omvat een of meer maatregelen en is evenredig aan het doel waarvoor zij wordt gegeven.

      2 Onder wanbeheer wordt uitsluitend verstaan:

      a. financieel wanbeleid;

      b. ongerechtvaardigde verrijking, al dan niet beoogd, van de instelling, van de leden van het bestuur of het
      toezichthoudende orgaan zelf of van een derde; of

      c. onrechtmatig handelen, waaronder wordt verstaan het in de hoedanigheid van bestuurder of toezichthouder handelen
      in strijd met wettelijke bepalingen of de kennelijke geest van wettelijke bepalingen waarmee financieel voordeel
      wordt behaald ten gunste van de instelling, van de leden van het bestuur of het toezichthoudende orgaan zelf of van
      een derde.

      3 In de aanwijzing geeft het Commissariaat gemotiveerd aan op welke punten sprake is van wanbeheer en de in verband
      daarmee te nemen maatregelen.

      4 De instelling voldoet aan de aanwijzing. In de aanwijzing wordt daarvoor een termijn gesteld.

      5 Voordat het Commissariaat een aanwijzing geeft, stelt hij de instelling vier weken in de gelegenheid haar
      zienswijze naar voren te brengen.

      6 Een aanwijzing kan inhouden de opdracht om bestuurders of toezichthouders te vervangen.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel7.16a
  - number: '7.17'
    text: |-
      Bij intrekking of vermindering van uren kan het Commissariaat als dat nodig is de verdeling van de uren, bedoeld in
      de [artikelen 6.1][ref1] en [6.5][ref2], herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel6.1
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel6.5
