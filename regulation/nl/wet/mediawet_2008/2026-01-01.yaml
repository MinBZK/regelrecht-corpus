  - number: 9.14d
    text: |-
      De concessie van de NPO, de concessieperiode en de tweede van de twee perioden van vijf jaar, bedoeld in
      [artikel 2.19, derde lid][ref1], de tweede periode van vijf jaar, bedoeld in [artikel 2.20, eerste lid][ref2], de
      erkenningen en de voorlopige erkenningen, bedoeld in [artikel 2.23, eerste, respectievelijk tweede lid][ref3], en
      de erkenningperiode die gelden op het moment van inwerkingtreding van dit artikel worden, voor zover van toepassing
      in afwijking van deze wet, van rechtswege met een jaar verlengd.


