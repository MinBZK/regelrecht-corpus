  - number: '2.6'
    text: |-
      1 Het lidmaatschap van de raad van toezicht is onverenigbaar met:

      a. het lidmaatschap van het college van omroepen;

      b. het lidmaatschap van de raad van bestuur;

      c. het lidmaatschap van een orgaan van of een dienstbetrekking bij een publieke media-instelling;

      d. het lidmaatschap van een orgaan van of een dienstbetrekking bij een commerciële media-instelling;

      e. het lidmaatschap van een van beide Kamers der Staten-Generaal, een provinciaal bestuur of een gemeentebestuur;

      f. een dienstbetrekking bij een ministerie of bij een dienst, instelling of bedrijf vallende onder de
      verantwoordelijkheid van een minister;

      g. het hebben van financiële of andere belangen bij bedrijven of instellingen en het vervullen van nevenfuncties
      waardoor een goede vervulling van de functie of de handhaving van de onafhankelijkheid van het betrokken lid of van
      het vertrouwen daarin in het geding kan zijn; en

      h. het lidmaatschap van een orgaan van of een dienstbetrekking bij een omroepvereniging die in een
      samenwerkingsomroep vertegenwoordigd is.

      2 Schorsing en ontslag zijn mogelijk wegens:

      a. ongeschiktheid;

      b. disfunctioneren; en

      c. onverenigbaarheid als bedoeld in het eerste lid.

      3 Ontslag is verder mogelijk op eigen verzoek.

      4 De leden van de raad van toezicht ontvangen van de NPO een door Onze Minister vast te stellen vergoeding.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.6
  - number: '2.7'
    text: |-
      1 De raad van toezicht is belast met het toezicht op:

      a. de uitvoering van de publieke mediaopdracht op landelijk niveau;

      b. de werkzaamheden van de raad van bestuur; en

      c. de algemene gang van zaken in de organisatie van de NPO.

      2 De raad van toezicht staat de raad van bestuur met advies ter zijde.

      3 De raad van toezicht is verder belast met:

      a. het vaststellen van de jaarrekening van de NPO; en

      b. het wijzigen van de statuten van de NPO, op voorstel van de raad van bestuur;

      4 Bij de uitvoering van zijn taak neemt de raad van toezicht het gemeenschappelijke belang van de landelijke
      publieke mediadienst in acht, werkt de raad met gevoel voor het krachtenveld waarin de landelijke publieke
      mediadienst functioneert en houdt de raad rekening met de belangen van de landelijke publieke media-instellingen.

      5 De raad van bestuur verstrekt de raad van toezicht tijdig de informatie die de raad van toezicht nodig heeft voor
      de uitvoering van zijn taak.

      6 De raad van toezicht stelt een rooster van aftreden voor zijn leden op waarin wordt voorzien dat de leden niet
      allen gelijktijdig aftreden.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.7
  - number: '2.8'
    text: |-
      1 De raad van bestuur bestaat uit een voorzitter en ten hoogste twee andere leden die worden benoemd, geschorst en
      ontslagen door de raad van toezicht.

      2 Benoeming geschiedt voor vijf jaar en herbenoeming voor een aansluitende periode is eenmaal mogelijk.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.8
  - number: '2.9'
    text: |-
      1 Op het lidmaatschap van de raad van bestuur is artikel 2.6, eerste lid, aanhef en onderdelen a en c tot en met
      h, van overeenkomstige toepassing, met dien verstande dat [artikel 2.6, eerste lid, onderdeel c][ref1], niet van
      overeenkomstige toepassing is op het lidmaatschap van een orgaan van de Ster.

      2 De leden van de raad van bestuur zijn in dienst van de NPO. De raad van toezicht stelt hun arbeidsvoorwaarden
      vast.

      3 [Artikel 668a, eerste tot en met vierde lid, van Boek 7 van het Burgerlijk Wetboek][ref2] is niet van toepassing.

      4 Een lid van de raad van bestuur kan niet na beëindiging van dat lidmaatschap voor een aansluitende periode worden
      benoemd als lid van de raad van toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.6
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel668a
