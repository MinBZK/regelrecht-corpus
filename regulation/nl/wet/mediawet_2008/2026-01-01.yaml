  - number: 2.11a
    text: De raad van toezicht en het college van omroepen hebben ten minste tweemaal per jaar overleg.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.11a
  - number: '2.12'
    text: |-
      1 Het college van omroepen adviseert de raad van toezicht en de raad van bestuur desgevraagd of uit eigen beweging
      over het beleid inzake het media-aanbod van de landelijke publieke mediadienst.

      2 Het college van omroepen is zodanig samengesteld dat de omroeporganisaties die een erkenning als bedoeld in
      [artikel 2.23, eerste lid][ref1], hebben verkregen, de omroepverenigingen die een voorlopige erkenning als bedoeld
      in artikel 2.23, tweede lid, hebben verkregen, de NOS en de NTR daarin elk één lid benoemen.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.23
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.12
