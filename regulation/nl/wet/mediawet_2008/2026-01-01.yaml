  - number: '2.74'
    text: |-
      1 Het aanbodkanaal, bedoeld in [artikel 2.50, aanhef en onder b][ref1], is mede bestemd voor de catch-up van de
      programma’s op de televisieprogrammakanalen van de regionale publieke mediadienst.

      2 Een regionale publieke media-instelling kan voor plaatsing op het aanbodkanaal, bedoeld in het eerste lid,
      beschikbaar stellen een programma als bedoeld in het eerste lid:

      a. met voldoende gebruiksrechten;

      b. conform de technische specificaties van de NPO; en

      c. in overeenstemming met de regels over reclame- en telewinkelboodschappen voor de landelijke publieke
      mediadienst.

      3 In afwijking van [artikel 2.73][ref2], eerste lid, plaatst de raad van bestuur een programma dat tijdig
      beschikbaar is gesteld met toepassing van het tweede lid op het aanbodkanaal, bedoeld in het eerste lid.

      4 In afwijking van [artikel 2.73, tweede lid][ref3], is op het derde lid uitsluitend
      [artikel 2.59, eerste lid][ref4], zoveel mogelijk van overeenkomstige toepassing.


