  - number: '7.12'
    text: |-
      1 Bij overtreding van het bepaalde bij of krachtens deze wet, met uitzondering van
      de [artikelen 2.34, eerste lid][ref1], [2.58, onderdelen a tot en met c, en e][ref2],
      [2.170, eerste tot en met zesde lid, en achtste en negende lid][ref3], en [2.170b][ref4], of van
      [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref5] kan het Commissariaat aan de overtreder een
      bestuurlijke boete opleggen van ten hoogste € 225 000 per overtreding.

      2 De bestuurlijke boete bij overtreding van het bepaalde in [artikel 2.34, eerste lid][ref6], bedraagt tien procent
      van het totale bedrag aan gelden dat gemiddeld in de kalenderjaren voorafgaand aan de overtreding tijdens de
      lopende erkenningperiode aan de omroeporganisatie ter beschikking is gesteld voor de verzorging van media-aanbod
      voor de landelijke publieke mediadienst.

      3 Bij overtreding van het bepaalde bij of krachtens deze wet, met uitzondering van de
      [artikelen 2.34, tweede lid][ref7], [2.35][ref8], [2.58, onderdeel d][ref9], [2.70][ref10],
      [2.71, derde en vierde lid][ref11], [2.88b tot en met 2.92][ref12], [2.94 tot en met 2.99][ref13],
      [2.106 tot en met 2.108][ref14], [2.111, eerste lid][ref15], [2.115 tot en met 2.124][ref16],
      [2.150, tweede en derde lid][ref17], [2.151, tweede lid][ref18], [2.169c, vijfde lid][ref19],
      [2.170, eerste tot en met zesde lid, en achtste en negende lid][ref20] en [2.170b][ref21],
      [3.5b tot en met 3.14][ref22], [3.15, tweede lid][ref23], [3.16][ref24], [3.17][ref25],
      [3.19 tot en met 3.19b][ref26], [3.20 tot en met 3.26][ref27], [3.29][ref28], [3.29d][ref29], [3a.5][ref30],
      [4.1][ref31], [4.6][ref32], [5.1 tot en met 5.4][ref33], [6.4][ref34], [6.6, tweede lid][ref35], en
      [6.23 tot en met 6.25][ref36] kan het Commissariaat aan de overtreder een last onder dwangsom opleggen.


