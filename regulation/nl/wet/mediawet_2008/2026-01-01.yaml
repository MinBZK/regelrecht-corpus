  - number: '2.26'
    text: |-
      1 Voor een voorlopige erkenning komt slechts in aanmerking een omroepvereniging die:

      a. in de voorafgaande erkenningperiode geen erkenning of voorlopige erkenning had en niet vertegenwoordigd was in
      een samenwerkingsomroep die in die periode een erkenning had;

      b. ten minste 50.000 leden heeft;

      c. op 31 december van het jaar voorafgaand aan dat waarin die erkenning ingaat, een reserve als bedoeld in
      [artikel 2.174a, eerste lid][ref1], heeft waarvan het saldo nihil of positief is;

      d. zich naar stroming als bedoeld in [artikel 2.24, eerste lid, onderdeel c][ref2], en naar voorgenomen media-
      aanbod wat betreft genre, inhoud en doelgroepen zodanig onderscheidt van de omroeporganisaties, bedoeld in
      [artikel 2.25][ref3], dat de verscheidenheid van het media-aanbod van de landelijke publieke mediadienst wordt
      vergroot en een vernieuwende bijdrage wordt geleverd aan de uitvoering van de publieke mediaopdracht op landelijk
      niveau;

      e. de voorschriften met betrekking tot ledenwerving, bedoeld in [artikel 2.137][ref4], in acht heeft genomen;

      f. de verzorging van haar media-aanbod opdraagt aan de NTR of een omroeporganisatie die een erkenning als bedoeld
      in [artikel 2.23, eerste lid][ref5], heeft verkregen en waarmee zij overeenstemming heeft bereikt; en

      g. voldoet aan de [artikelen 2.142a, eerste en tweede lid][ref6], en [2.178, eerste en tweede lid][ref7].

      2 [Artikel 2.25, tweede lid][ref8], is van toepassing.


