      1 Van overdrachtsbelasting zijn vrijgesteld verkrijgingen van onroerende zaken en de rechten waaraan deze zijn
      onderworpen, bij vorming van een omroeporganisatie als bedoeld in [artikel 9.7, aanhef en onderdelen b en c][ref1].

      2 Het eerste lid is alleen van toepassing als de onroerende zaken en de rechten waaraan deze zijn onderworpen
      uiterlijk 1 juli 2015 worden verkregen vanwege fusie tot een omroepvereniging of oprichting van een
      samenwerkingsomroep.

      3 Als onroerende zaken en de rechten waaraan deze zijn onderworpen, die zijn verkregen onder toepassing van het
      eerste en tweede lid, als gevolg van het niet finaal tot stand komen van een omroeporganisatie worden verkregen
