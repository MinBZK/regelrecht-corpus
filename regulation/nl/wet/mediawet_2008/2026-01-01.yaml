  - number: '3.24'
    text: |-
      1 Op een televisieprogrammakanaal bestaat het programma-aanbod voor ten minste veertig procent uit oorspronkelijk
      Nederlands- of Friestalige producties.

      2 Het Commissariaat kan in bijzondere gevallen geheel of gedeeltelijk ontheffing verlenen van het eerste lid. Het
      Commissariaat kan aan een ontheffing voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel3.24
  - number: '3.25'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen regels worden gesteld over de ondertiteling van
      televisieprogramma’s, waarbij onder meer kan worden bepaald welk percentage van het programma-aanbod, bedoeld
      in [artikel 3.24, eerste lid][ref1], voorzien is van ondertiteling ten behoeve van personen met een auditieve
      beperking.

      2 Het Commissariaat kan in bijzondere gevallen geheel of gedeeltelijk ontheffing verlenen van een verplichting
      betreffende het percentage, bedoeld in het eerste lid. Het Commissariaat kan aan een ontheffing voorschriften
      verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3.24
