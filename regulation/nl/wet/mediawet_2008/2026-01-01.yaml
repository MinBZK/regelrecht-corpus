  - number: '6.9'
    text: |-
      1 Het Commissariaat kan aan natuurlijke of rechtspersonen toestemming verlenen voor het via een omroepzender
      verzorgen van een omroepdienst voor een bijzonder doel, met een beperkt bereik en van beperkte duur. Het
      Commissariaat kan tevens de toestemming verlenen voor het verzorgen van een omroepdienst zonder beperkte duur voor
      zover dit aangewezen is gelet op de aard van de omroepdienst.

      2 Het Commissariaat kan aan een toestemming voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel6.9
  - number: 6.9a
    text: |-
      In deze afdeling wordt verstaan onder:

        - *«abonnee»:* natuurlijke persoon of rechtspersoon die partij is bij een overeenkomst met een pakketaanbieder met
      betrekking tot de ontvangst van een of meer programmapakketten;
        - *«pakketaanbieder»:* een natuurlijk persoon of rechtspersoon die een of meer programmapakketten tegen betaling
      verspreidt of laat verspreiden door middel van een omroepnetwerk of een omroepzender;
        - *«programmapakket»:* een door een natuurlijk persoon of rechtspersoon samengesteld geheel van televisie- en
      radioprogrammakanalen die hoofdzakelijk door derden zijn geproduceerd;
        - *«standaardprogrammapakket»:* een programmapakket als bedoeld in [artikel 6.13][ref1] of in [artikel 6.14][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel6.13
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel6.14
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel6.9a
    references:
