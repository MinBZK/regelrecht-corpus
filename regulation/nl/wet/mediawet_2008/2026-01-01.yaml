        afdeling: 2.5.4
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2.117'
        hoofdstuk: '2'
        paragraaf: 2.5.4.1
        afdeling: 2.5.4
  - number: '2.120'
    text: |-
      1 Als onafhankelijke productie wordt aangemerkt media-aanbod dat niet geproduceerd is door:

      a. een publieke media-instelling;

      b. een commerciële media-instelling;

      c. een buitenlandse omroepinstelling;

      d. een rechtspersoon waarin een instelling als bedoeld in de onderdelen a tot en met c, al dan niet door middel van
      een of meer dochtermaatschappijen, een belang van meer dan vijfentwintig procent heeft;

      e. een rechtspersoon waarin twee of meer instellingen als bedoeld in de onderdelen a tot en met c, al dan niet door
      middel van een of meer van hun onderscheidene dochtermaatschappijen, samen een belang van meer dan vijftig procent
      hebben; of

      f. een vennootschap waarin een instelling als bedoeld in de onderdelen a tot en met c, dan wel een of meer van haar
      dochtermaatschappijen, als vennoot volledig jegens schuldeisers aansprakelijk is voor de schulden.

      2 Bij algemene maatregel van bestuur:

      a. kunnen nadere regels worden gesteld over de toepassing van het eerste lid en de
      [artikelen 2.116 tot en met 2.119][ref1]; en

      b. kan worden bepaald dat in andere dan de in het eerste lid bedoelde gevallen media-aanbod wordt aangemerkt als
      onafhankelijke productie.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.116
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.120
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.116'
        hoofdstuk: '2'
        paragraaf: 2.5.4.1
        afdeling: 2.5.4
  - number: '2.121'
    text: |-
      1 Voor de toepassing van de [artikelen 2.116, tweede lid][ref1], en [2.117 tot en met 2.120][ref2] blijft buiten
      beschouwing media-aanbod:

      a. dat bestaat uit nieuws;

      b. dat betrekking heeft op sport;

      c. dat het karakter van een spel heeft, met uitzondering van media-aanbod van culturele of educatieve aard dat mede
      het karakter van een spel heeft;

      d. dat bestaat uit reclame- en telewinkelboodschappen, inclusief omlijsting, en zelfpromotie;

      e. dat van kerkelijke of geestelijke aard is en media-aanbod van politieke partijen en de overheid; en

      f. dat bestaat uit teletekst.

      2 Voor de toepassing van [artikel 2.116, eerste lid][ref3], blijft buiten beschouwing media-aanbod als bedoeld in
      het eerste lid, onder a, d, e en f.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.116
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.117
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel2.116
