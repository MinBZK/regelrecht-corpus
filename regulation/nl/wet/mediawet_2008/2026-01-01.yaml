  - number: 2.170b
    text: |-
      1 Het college van burgemeester en wethouders zorgt voor de bekostiging van het functioneren van de lokale publieke
      media-instelling als de gemeenteraad een advies als bedoeld in [artikel 2.61, derde lid][ref1] heeft uitgebracht
      en daarbij positief heeft geadviseerd over de vraag of de instelling voldoet aan de eis, bedoeld in artikel 2.61,
      tweede lid, onderdeel c.

      2 De bekostiging betreft vergoeding van de kosten die rechtstreeks verband houden met het verzorgen van de lokale
      publieke mediadienst, voor zover die kosten niet op andere wijze zijn gedekt, op zodanige wijze dat op lokaal
      niveau in een toereikend media-aanbod kan worden voorzien en continuïteit van bekostiging is gewaarborgd.

      3 Als twee of meer gemeenteraden gezamenlijk een advies als bedoeld in [artikel 2.61, derde lid][ref2] hebben
      uitgebracht, en daarbij positief hebben geadviseerd over de vraag of de instelling voldoet aan de eis, bedoeld
      in artikel 2.61, tweede lid, onderdeel c, zorgen de colleges van burgemeester en wethouders van de desbetreffende
      gemeenten gezamenlijk voor de bekostiging, bedoeld in het eerste lid.

      4 Aan de bekostiging worden geen voorschriften verbonden die in strijd zijn met het bepaalde bij of krachtens deze
      wet.

      5 Onze Minister zendt telkens na drie jaar aan de Staten-Generaal een verslag over de doeltreffendheid en de
      effecten van het bepaalde in dit artikel in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.61
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.61
