  - number: '2.147'
    text: |-
      1 De NPO dient jaarlijks vóór 15 september een begroting voor de landelijke publieke mediadienst in bij Onze
      Minister en het Commissariaat.

      2 De begroting bevat in elk geval:

      a. een beschrijving van de wijze waarop door de NPO en de landelijke publieke media-instellingen invulling wordt
      gegeven aan het voorgenomen media-aanbod op de verschillende aanbodkanalen, met in achtneming van het bepaalde bij
      of krachtens deze wet;

      b. een overzicht van aard en aantal van de aanbodkanalen;

      c. de financiële middelen die voor het volgende kalenderjaar nodig zijn om de voornemens met betrekking tot de
      landelijke publieke mediadienst te verwezenlijken en een raming voor de daarop volgende vier jaar;

      d. een toelichting op de onderscheiden onderdelen en begrotingsposten; en

      e. een beschrijving van de samenwerking met de regionale en lokale publieke media-instellingen en anderen.

      3 De financiële middelen worden als volgt onderverdeeld:

      a. de financiële middelen voor de verzorging van het media-aanbod op de verschillende aanbodkanalen;

      b. de eigen inkomsten van de omroeporganisaties, de NOS en de NTR, die gebruikt moeten worden voor de verzorging
      van het media-aanbod;

      c. de financiële middelen voor het verspreiden van het media-aanbod op de verschillende aanbodkanalen; en

      d. de financiële middelen voor de uitvoering van de taken en werkzaamheden van de NPO.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.147
  - number: '2.148'
    text: |-
      1 Bij ministeriële regeling kunnen nadere regels worden gesteld over de inhoud en inrichting van de begroting.

      2 Het Commissariaat zendt vóór 15 oktober zijn opmerkingen met betrekking tot de begroting aan Onze Minister.

      3 De NPO maakt de begroting openbaar.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.148
  - number: 2.148a
    text: |-
      1 Voorafgaand aan elke periode van vijf jaar, bedoeld in [artikel 2.19, derde lid][ref1], wordt door Onze Minister
      het bedrag vastgesteld dat de landelijke publieke mediadienst in die periode jaarlijks ten minste ter beschikking
      wordt gesteld ten behoeve van zijn taakvervulling.

      2 Het in het eerste lid bedoelde bedrag is voor het eerste jaar van de genoemde periode gelijk aan het bedrag dat
      ten behoeve van de landelijke publieke mediadienst beschikbaar wordt gesteld in de rijksbegroting voor dat jaar.
      Het aandeel van de rijksmediabijdrage in dat bedrag wordt voor de daaropvolgende jaren bijgesteld overeenkomstig:

      a. de door het Centraal Bureau voor de Statistiek voor het desbetreffende jaar geraamde index voor de groei van het
      aantal huishoudens in Nederland; en

      b. de door het Centraal Planbureau voor het desbetreffende jaar geraamde consumentenprijsindex.

      3 Indien na aanvang van de periode van vijf jaar, bedoeld in het eerste lid, veranderde omstandigheden zich in
      overwegende mate verzetten tegen ongewijzigde voortzetting van het ter beschikking stellen van de met inachtneming
      van het eerste en tweede lid vastgestelde bedragen, kan Onze Minister de hoogte van het voor resterende jaren
      ter beschikking te stellen bedrag wijzigen met inachtneming van een redelijke termijn. De hoogte van het aldus
      gewijzigde bedrag is gelijk aan het bedrag dat voor het betreffende jaar waarin het gewijzigde bedrag voor
      het eerst van toepassing is ten behoeve van de landelijke publieke mediadienst beschikbaar wordt gesteld in de
      rijksbegroting voor dat jaar en wordt voor de daaropvolgende jaren bijgesteld overeenkomstig de onderdelen a en b
      van het tweede lid.

      4 In geval van een wijziging van het bedrag zoals bedoeld in het derde lid, vergoedt Onze Minister de schade die
      de landelijke publieke mediadienst lijdt doordat hij in vertrouwen op het eerder vastgestelde bedrag anders heeft
      gehandeld dan hij met inachtneming van het gewijzigde bedrag zou hebben gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.19
