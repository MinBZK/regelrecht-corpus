  - number: '6.3'
    text: |-
      1 Na een veroordeling als bedoeld in [artikel 6.2, eerste lid][ref1], worden aan de politieke partij, zo
      nodig in afwijking van [artikel 6.2, eerste lid, onderdeel a][ref2], in ieder geval geen uren als bedoeld in
      [artikel 6.1, tweede lid][ref3], toegewezen binnen twee jaar na de dag waarop de veroordeling onherroepelijk is
      geworden.

      2 Als aan een politieke partij met toepassing van [artikel 6.2, eerste lid][ref4], geen uren meer worden
      toegewezen, dan vervallen met ingang van de dag waarop de veroordeling onherroepelijk is geworden van rechtswege
      ook de uren die al zijn toegewezen.


