  - number: '2.172'
    text: |-
      1 [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1] is van toepassing op de jaarrekeningen, met dien verstande
      dat de winst- en verliesrekening wordt vervangen door een exploitatierekening. Op deze rekening zijn de bepalingen
      over de winst- en verliesrekening zo veel mogelijk van overeenkomstige toepassing. Bepalingen over winst en verlies
      zijn zo veel mogelijk van overeenkomstige toepassing op het exploitatiesaldo.

      2 Het boekjaar is gelijk aan het kalenderjaar.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld over de inhoud en inrichting van de
      jaarrekening, waaronder regels over de wijze waarop inzicht wordt gegeven in de kosten van de programmering.

      4 Regels over de wijze waarop inzicht wordt gegeven in de kosten van de programmering of wijzigingen van die regels
      worden niet eerder vastgesteld dan vier weken nadat een ontwerp daarvan aan beide kamers der Staten-Generaal is
      overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.172
