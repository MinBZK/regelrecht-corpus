  - number: '4.3'
    text: |-
      1 Een organisatie komt slechts voor erkenning in aanmerking als:

      a. onafhankelijk toezicht door de organisatie op de naleving van de regelingen, bedoeld in
      [artikel 4.2 , eerste lid][ref1], is gewaarborgd;

      b. voorzien is in voldoende betrokkenheid van belanghebbenden, onder wie in ieder geval vertegenwoordigers uit de
      consumentensfeer, publieke media-instellingen, deskundigen op het gebied van de audiovisuele media en producenten
      van audiovisuele media; en

      c. de financiële positie van de organisatie een adequate uitvoering van de werkzaamheden waarborgt.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de eisen bedoeld in het
      eerste lid en kunnen andere eisen voor erkenning worden gesteld.

      3 Aan een erkenning kunnen voorschriften worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel4.2
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel4.3
