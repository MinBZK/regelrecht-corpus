  - number: '2.88'
    text: |-
      1 De publieke media-instellingen bepalen, onverminderd het bepaalde bij of krachtens deze wet, vorm en inhoud van
      het door hen verzorgde media-aanbod en zijn daar verantwoordelijk voor.

      2 De publieke media-instellingen brengen in overeenstemming met hun werknemers die zijn belast met de verzorging en
      samenstelling van het media-aanbod een redactiestatuut tot stand.

      3 Het redactiestatuut bevat de journalistieke rechten en plichten van de werknemers, waaronder in elk geval:

      a. waarborgen dat normen inzake journalistieke deontologie en kwaliteit worden gehanteerd; en

      b. waarborgen voor redactionele onafhankelijkheid ten opzichte van adverteerders, sponsors en anderen die bijdragen
      hebben verstrekt voor de totstandkoming van media-aanbod.

      4 De NTR en omroeporganisaties, waaraan omroepverenigingen die een voorlopige erkenning als bedoeld in
      [artikel 2.23, tweede lid][ref1], hebben verkregen, de verzorging van hun media-aanbod hebben opgedragen, dragen
      ervoor zorg dat de verantwoordelijkheid van die omroepverenigingen in de samenwerking is gewaarborgd.

      5 Een publieke media-instelling neemt passende maatregelen om te voorkomen dat het aanbod van haar mediadiensten
      aanzet tot geweld of haat jegens een groep personen of een lid van een groep, op een van de gronden genoemd
      in artikel 21 van het Handvest van de grondrechten van de Europese Unie, of uitlokt tot het plegen van een
      terroristisch misdrijf.

      6 De publieke media-instellingen nemen in hun jaarverslag een reflectie op over de wijze waarop de journalistieke
      deontologie in acht is genomen en hoe het eigen redactiestatuut is gerespecteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.23
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.88
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.23'
        hoofdstuk: '2'
        afdeling: 2.2.2
  - number: 2.88a
    text: |-
      Publieke media-instellingen stellen ten minste de volgende gegevens van de media-instelling gemakkelijk,
      rechtstreeks en permanent beschikbaar voor het publiek:

      a. naam;

      b. plaats van vestiging;

      c. contactgegevens waaronder e-mailadres of internetadres; en

      d. de naam van het Commissariaat als het orgaan dat is belast met het toezicht op de naleving op grond van
      [titel 7.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.88a
    references:
      - id: ref1
        bwb_id: BWBR0025028
        hoofdstuk: '7'
  - number: 2.88b
    text: |-
      1 Reclame- en telewinkelboodschappen en gesponsord media-aanbod zijn als zodanig herkenbaar.

      2 In reclame- en telewinkelboodschappen en gesponsord media-aanbod worden geen subliminale technieken gebruikt.

      3 Het media-aanbod bevat geen:

      a. sluikreclame; of

      b. productplaatsing.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.88b
  - number: '2.89'
    text: |-
      1 Tenzij dit bij of krachtens deze wet is toegestaan, bevat het media-aanbod van de publieke mediadiensten geen:

      a. reclame- of telewinkelboodschappen; en

      b. vermijdbare andere uitingen die onmiskenbaar tot gevolg hebben dat de afname van producten of diensten wordt
      bevorderd.

      2 Bij of krachtens algemene maatregel van bestuur kan worden bepaald in welke gevallen vermijdbare uitingen zijn
      toegestaan en wanneer uitingen onvermijdbaar zijn.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.89
  - number: '2.90'
    text: |-
      Behoudens toestemming van het Commissariaat bevat het media-aanbod van de publieke mediadiensten geen
      oproepen in het kader van ledenwerving, andere verenigingsactiviteiten of nevenactiviteiten als bedoeld in
      [afdeling 2.5.6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.90
    references:
      - id: ref1
        bwb_id: BWBR0025028
        hoofdstuk: '2'
        afdeling: 2.5.6
  - number: '2.91'
    text: |-
      1 In het media-aanbod van de publieke mediadiensten mogen reclame- en telewinkelboodschappen die zijn aangeboden
      door derden worden opgenomen.

      2 Reclame- en telewinkelboodschappen, inclusief omlijsting daarvan, in het media-aanbod van de landelijke publieke
      mediadienst worden uitsluitend verzorgd door de Ster.

      3 De Ster kan op verzoek van regionale en lokale publieke media-instellingen reclame- en telewinkelboodschappen,
      inclusief omlijsting daarvan, verzorgen die worden opgenomen in het media-aanbod van die instellingen.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.91
  - number: '2.92'
    text: |-
      1 De Ster en de regionale en lokale publieke media-instellingen die reclame- of telewinkelboodschappen in het
      media-aanbod opnemen, zijn aangesloten bij de Nederlandse Reclame Code of een vergelijkbare door de Stichting
      Reclame Code tot stand gebrachte regeling en ter zake onderworpen aan het toezicht van de Stichting Reclame Code.

      2 Aansluiting wordt aangetoond door een schriftelijke verklaring van de Stichting Reclame Code aan het
      Commissariaat over te leggen.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.92
  - number: '2.93'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de wijze waarop inzicht wordt
      gegeven in de financiën die betrekking hebben op de verzorging van reclame- en telewinkelboodschappen in het media-
      aanbod van de regionale en lokale publieke mediadiensten.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.93
  - number: '2.94'
    text: |-
      1 Reclame- en telewinkelboodschappen zijn door akoestische of visuele middelen duidelijk onderscheiden van de
      overige inhoud van het programma-aanbod.

      2 Het programma-aanbod bevat geen reclame- en telewinkelboodschappen voor:

      a. medische behandelingen; en

      b. alcoholhoudende dranken tussen 06.00 uur en 21.00 uur.

      3 Het televisieprogramma-aanbod bevat voorts geen reclame- en telewinkelboodschappen voor:

      a. kansspelen waarvoor een vergunning als bedoeld in de [artikelen 14a][ref1], [15][ref2], [23][ref3], [27g][ref4]
      en [31 van de Wet op de kansspelen][ref5] vereist is, of die gespeeld worden op een automaat in een
      speelautomatenhal voor de aanwezigheid waarvan een vergunning vereist is, tussen 06.00 en 21.00 uur;

      b. overige kansspelen waarvoor ingevolge de [Wet op de kansspelen][ref6] een vergunning vereist is, tussen 06.00
      en 19.00 uur.

      4 Het derde lid, onder a, is van overeenkomstige toepassing op radioprogramma-aanbod.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel14a
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0002469#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0002469#Artikel27g
      [ref5]: https://wetten.overheid.nl/BWBR0002469#Artikel31
      [ref6]: https://wetten.overheid.nl/BWBR0002469
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.94
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 14a
      - id: ref2
        bwb_id: BWBR0002469
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0002469
        artikel: '23'
      - id: ref4
        bwb_id: BWBR0002469
        artikel: 27g
      - id: ref5
        bwb_id: BWBR0002469
        artikel: '31'
      - id: ref6
        bwb_id: BWBR0002469
  - number: '2.95'
    text: |-
      1 Het aandeel reclame- en telewinkelboodschappen in het programma-aanbod bedraagt:

      a. per programmakanaal niet meer dan een bij algemene maatregel van bestuur vast te stellen percentage van de
      totale duur van het programma-aanbod op het programmakanaal per jaar, welk percentage niet meer bedraagt dan tien
      en voor landelijke, regionale en lokale publieke mediadiensten en voor radio- en televisieprogramma-aanbod kan
      verschillen;

      b. per programmakanaal niet meer dan vijftien procent van de totale duur van het programma-aanbod op het
      programmakanaal per dag; en

      c. niet meer dan twintig procent van de tijdvakken tussen 06:00 uur en 18:00 uur en tussen 18:00 uur en 24:00 uur.

      2 Ten hoogste een derde van de tijd die wordt gebruikt voor reclame- of telewinkelboodschappen in het programma-
      aanbod wordt gebruikt voor omlijsting.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.95
  - number: '2.96'
    text: |-
      1 Reclame- en telewinkelboodschappen in het programma-aanbod worden zodanig geplaatst dat zij:

      a. zijn opgenomen in blokken, welke blokken voor televisieprogramma-aanbod inclusief omlijsting ten minste één
      minuut duren;

      b. op zondagen niet direct vooraf gaan aan of direct aansluiten op programma’s van kerkelijke of geestelijke aard,
      tenzij de instelling die voor de inhoud van zodanig programma verantwoordelijk is daartegen geen bezwaar heeft
      gemaakt; en

      c. niet in programma’s worden opgenomen, behoudens het bepaalde in [artikel 2.97][ref1].

      2 Telewinkelboodschappen in het programma-aanbod duren elk ten hoogste één minuut en een blok als bedoeld in het
      eerste lid, onderdeel a, bestaat voor ten hoogste tweederde van de duur uit telewinkelboodschappen.

      3 Bij algemene maatregel van bestuur kunnen regels gesteld worden over de plaatsing van reclame- en
      telewinkelboodschappen in en rond programma-aanbod dat in het bijzonder bestemd is voor kinderen jonger dan twaalf
      jaar.

      4 Rond televisieprogramma-aanbod van de landelijke publieke mediadienst dat in het bijzonder is bestemd voor
      kinderen jonger dan twaalf jaar worden geen reclame- of telewinkelboodschappen geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.97
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.96
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.97'
        hoofdstuk: '2'
        paragraaf: 2.5.2.2
        afdeling: 2.5.2
  - number: '2.97'
    text: |-
      1 In programma’s worden alleen reclame- of telewinkelboodschappen opgenomen als:

      a. het desbetreffende programma langer duurt dan anderhalf uur voor televisie, dan wel drie kwartier voor radio;

      b. het desbetreffende programma bestaat uit het volledige verslag of de volledige weergave van een evenement;

      c. zij worden opgenomen tijdens de in het evenement voorkomende gebruikelijke pauzes of tussen de in het evenement
      voorkomende zelfstandige onderdelen in blokken die ten minste een minuut duren;

      d. de instelling die verantwoordelijk is voor de inhoud van het desbetreffende daartegen geen bezwaar heeft gemaakt
      op grond van afbreuk aan de integriteit, het karakter of de samenhang van het programma; en

      e. dit geen afbreuk doet aan de rechten van rechthebbenden.

      2 In programma’s van kerkelijke of geestelijke aard en in programma’s die in het bijzonder bestemd zijn voor
      kinderen jonger dan twaalf jaar worden geen reclame- of telewinkelboodschappen opgenomen.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.97
  - number: '2.98'
    text: |-
      1 De [artikelen 2.94 tot en met 2.97][ref1] zijn zo veel mogelijk van overeenkomstige toepassing
      op het overige media-aanbod van de publieke mediadiensten. Wat betreft de toepassing van
      [artikel 2.96, eerste lid, onderdeel a][ref2], geldt de vorige volzin uitsluitend voor het overige media-aanbod met
      beeldinhoud, al dan niet mede met geluidsinhoud.

      2 In afwijking van het eerste lid bevat het media-aanbod met beeldinhoud, al dan niet mede met geluidsinhoud, van
      mediadiensten op aanvraag van de landelijke publieke mediadienst geen reclame- of telewinkelboodschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.94
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.96
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.98
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.94'
        hoofdstuk: '2'
        paragraaf: 2.5.2.2
        afdeling: 2.5.2
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2.96'
        hoofdstuk: '2'
        paragraaf: 2.5.2.2
        afdeling: 2.5.2
  - number: '2.99'
    text: |-
      De Stichting Etherreclame heeft tot taak het verzorgen van media-aanbod voor de landelijke publieke mediadienst en,
      op verzoek, voor de regionale en lokale publieke mediadiensten dat bestaat uit reclame- en telewinkelboodschappen
      die zijn aangeboden door derden, inclusief omlijsting daarvan.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.99
  - number: 2.99a
    text: De organen van de Ster zijn een raad van toezicht en een bestuur.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.99a
  - number: 2.99b
    text: |-
      1 De raad van toezicht van de Ster bestaat uit vijf leden die op voordracht van de raad van toezicht door Onze
      Minister worden benoemd en die door Onze Minister kunnen worden geschorst en ontslagen.

      2 De raad van toezicht wijst uit zijn midden de voorzitter aan.

      3 Benoeming geschiedt voor een periode van vier jaar. Herbenoeming is eenmaal mogelijk, voor een aansluitende
      periode.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.99b
  - number: 2.99c
    text: |-
      1 Bij een vacature draagt de raad van toezicht van de Ster zorg voor de procedure die leidt tot de voordracht,
      bedoeld in [artikel 2.99b, eerste lid][ref1].

      2 De raad van toezicht stelt profielschetsen op voor de vacature en voor de raad als geheel.

      3 De NPO en, voor zover de Ster media-aanbod voor de regionale respectievelijk lokale publieke mediadiensten
      verzorgt, de RPO en het overlegorgaan, bedoeld in [artikel 2.146, aanhef en onder l][ref2], worden in de
      gelegenheid gesteld om binnen een redelijke termijn zienswijzen te geven op de profielschetsen.

      4 De profielschetsen behoeven de instemming van Onze Minister.

      5 De raad van toezicht maakt de profielschetsen na de instemming openbaar.

      6 Voor de selectie van kandidaten stelt de raad van toezicht een onafhankelijke benoemingsadviescommissie in die de
      raad van toezicht adviseert.

      7 De voordracht van de raad van toezicht aan Onze Minister is gemotiveerd, waarbij in elk geval wordt ingegaan op
      de geschiktheid, de profielschetsen, de positie van de kandidaat in het rooster van aftreden en de procedure die
      heeft geleid tot de voordracht.

      8 Onze Minister neemt de voordracht over, tenzij deze in strijd is met:

      a. deze wet;

      b. eisen van zorgvuldigheid;

      c. andere zwaarwegende belangen; of

      d. een redelijke verwachting dat de voorgedragen kandidaat geschikt zal zijn voor de vervulling van de taak van
      lid van de raad van toezicht en de raad van toezicht bij benoeming overeenkomstig de voordracht naar behoren zal
      zijn samengesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.99b
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.146
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.99c
    references:
