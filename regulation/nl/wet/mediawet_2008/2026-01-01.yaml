  - number: '6.10'
    text: |-
      De aanbieder van een omroepzender of een omroepnetwerk verspreidt geen programma-aanbod als de instelling die
      verantwoordelijk is voor vorm en inhoud van het desbetreffende programma-aanbod, krachtens deze wet of krachtens
      de op die instelling van toepassing zijnde buitenlandse regelgeving niet gerechtigd is voor verspreiding bestemd
      programma-aanbod te verzorgen. De eerste volzin is van overeenkomstige toepassing op een pakketaanbieder.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel6.10
  - number: '6.11'
    text: |-
      1 Het is de aanbieder van een omroepzender of een omroepnetwerk toegestaan via de omroepzender of het
      omroepnetwerk:

      a. programma-aanbod te verspreiden dat bestaat uit een onverkorte en rechtstreekse weergave van een openbare
      vergadering van de Eerste of Tweede Kamer der Staten-Generaal, van provinciale staten of van een gemeenteraad; en

      b. informatie over het via de omroepzender of het omroepnetwerk aangeboden programma-aanbod en diensten te
      verspreiden.

      De eerste volzin is van overeenkomstige toepassing op een pakketaanbieder.

      2 [Hoofdstuk 4][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel6.11
    references:
      - id: ref1
        bwb_id: BWBR0025028
        hoofdstuk: '4'
  - number: '6.12'
    text: |-
      1 Deze paragraaf is van toepassing op pakketaanbieders die een of meer programmapakketten naar ten minste 100.000
      abonnees in Nederland verspreiden of laten verspreiden.

      2 Als een pakketaanbieder programma-aanbod door middel van twee of meer omroepnetwerken of omroepzenders
      verspreidt of laat verspreiden, worden voor de toepassing van het eerste lid de desbetreffende aantallen abonnees
      samengevoegd.

      3 Als een pakketaanbieder een rechtspersoon is, worden voor de toepassing van dit artikel samengevoegd het aantal
      abonnees van die pakketaanbieder en de aantallen abonnees van de dochtermaatschappijen die de pakketaanbieder
      in stand houdt. Als de pakketaanbieder een rechtspersoon is en een dochtermaatschappij die door een andere
      pakketaanbieder in stand wordt gehouden, worden voor de toepassing van dit artikel samengevoegd het aantal abonnees
      van die dochtermaatschappij, het aantal abonnees van de pakketaanbieder die deze dochtermaatschappij in stand
      houdt, en de aantallen abonnees van de andere dochtermaatschappijen die deze pakketaanbieder in stand houdt.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel6.12
  - number: '6.13'
    text: |-
      1 Als een pakketaanbieder een of meer digitale programmapakketten verspreidt of laat verspreiden, ontvangen alle
      abonnees die met hem een overeenkomst met betrekking tot de ontvangst van een of meer digitale programmapakketten
      hebben gesloten, in elk geval een digitaal standaardprogrammapakket.

      2 Het standaardprogrammapakket bestaat uit ten minste dertig televisieprogrammakanalen en een door de
      pakketaanbieder met inachtneming van het vierde lid te bepalen aantal radioprogrammakanalen. Bij ministeriële
      regeling kunnen diensten worden aangewezen waarvan het signaal als integraal onderdeel van de programmakanalen moet
      worden doorgegeven en kunnen nadere regels worden gesteld voor de doorgifte van deze diensten.

      3 Voor zover het betreft televisieprogrammakanalen, bevat het standaardprogrammapakket in elk geval:

      a. de algemene televisieprogrammakanalen van de landelijke publieke mediadienst, bedoeld in
      [artikel 2.50, onder a][ref1], en een derde algemeen televisieprogrammakanaal voor zover dat door de landelijke
      publieke mediadienst wordt verzorgd;

      b. één televisieprogrammakanaal van de regionale publieke mediadienst met programma-aanbod als bedoeld in
      [artikel 2.70][ref2], dat bestemd is voor de provincie of het deel van de provincie waarbinnen de abonnees
      woonachtig zijn;

      c. de televisieprogrammakanalen van de regionale publieke mediadienst met programma-aanbod als bedoeld in
      [artikel 2.70][ref3], dat bestemd is voor de provincies aangrenzend aan de provincie waarbinnen de abonnees
      woonachtig zijn;

      d. één televisieprogrammakanaal van de lokale publieke mediadienst met programma-aanbod als bedoeld in
      [artikel 2.70][ref4], dat bestemd is voor de gemeente waarbinnen de abonnees woonachtig zijn en dat door de
      pakketaanbieder wordt verspreid vanaf een in de markt gebruikelijk en geschikt centraal overnamepunt in Nederland
      voor de aanlevering en verspreiding van televisieprogrammakanalen;

      e. ten hoogste twee televisieprogrammakanalen van de lokale publieke mediadienst met ander programma-aanbod
      dan bedoeld in onderdeel d, dat een lokale publieke media-instelling verzorgt en dat is gericht op specifieke
      bevolkings- en leeftijdsgroepen waaronder minderheden en dat door de pakketaanbieder wordt verspreid vanaf een
      in de markt gebruikelijk en geschikt centraal overnamepunt in Nederland voor de aanlevering en verspreiding van
      televisieprogrammakanalen; en

      f. drie televisieprogrammakanalen van de Nederlandstalige landelijke Belgische openbare omroepdienst.

      4 Voor zover het betreft radioprogrammakanalen, bevat het standaardprogrammapakket in elk geval:

      a. vijf algemene radioprogrammakanalen van de landelijke publieke mediadienst;

      b. één radioprogrammakanaal van de regionale publieke mediadienst met programma-aanbod als bedoeld in
      [artikel 2.70][ref5], dat bestemd is voor de provincie of het deel van de provincie waarbinnen de abonnees
      woonachtig zijn;

      c. één radioprogrammakanaal van de lokale publieke mediadienst met programma-aanbod als bedoeld in
      [artikel 2.70][ref6], dat bestemd is voor de gemeente waarbinnen de abonnees woonachtig zijn en dat door de
      pakketaanbieder wordt verspreid vanaf een in de markt gebruikelijk en geschikt centraal overnamepunt in Nederland
      voor de aanlevering en verspreiding van radioprogrammakanalen;

      d. ten hoogste vijf radioprogrammakanalen van de lokale publieke mediadienst met ander programma-aanbod dan
      bedoeld in onderdeel c, dat een lokale publieke media-instelling verzorgt en dat is gericht op specifieke
      bevolkings- en leeftijdsgroepen waaronder minderheden en dat door de pakketaanbieder wordt verspreid vanaf een
      in de markt gebruikelijk en geschikt centraal overnamepunt in Nederland voor de aanlevering en verspreiding van
      radioprogrammakanalen; en

      e. vijf radioprogrammakanalen van de Nederlandstalige landelijke Belgische openbare omroepdienst.

      5 Bij de vaststelling of een pakketaanbieder heeft voldaan aan het vereiste, bedoeld in de eerste volzin van het
      tweede lid, worden de volgende regels in acht genomen:

      a. ten minste dertig unieke televisieprogrammakanalen worden aangeboden in een door de pakketaanbieder te bepalen
      uitzendkwaliteit;

      b. als televisieprogrammakanalen in verschillende uitzendkwaliteit worden aangeboden, worden programmakanalen met
      dezelfde naam en ordening van het programma-aanbod als één programmakanaal aangemerkt;

      c. als televisieprogrammakanalen in verschillende uitzendkwaliteit worden aangeboden, worden programmakanalen
      met dezelfde naam maar met een verschillende ordening van het programma-aanbod als afzonderlijke programmakanalen
      aangemerkt; en

      d. als televisieprogrammakanalen via omroepzenders worden verspreid zonder dat voor de ontvangst andere kosten
      moeten worden betaald dan de kosten van aanschaf en gebruik van technische voorzieningen die de ontvangst mogelijk
      maken, en deze programmakanalen zijn opgenomen in de elektronische programmagids die onderdeel van de technische
      voorzieningen is, worden deze programmakanalen aangemerkt als televisieprogrammakanalen als bedoeld in onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.50
