  - number: '2.52'
    text: |-
      Bij de coördinatie en ordening op en tussen de aanbodkanalen kan de raad van bestuur voorstellen voor programma’s
      toetsen aan de kwantitatieve en kwalitatieve doelstellingen voor het media-aanbod en het publieksbereik van
      de landelijke publieke mediadienst, vervat in het concessiebeleidsplan, de prestatieovereenkomst, bedoeld in
      [artikel 2.22][ref1], de profielen van de aanbodkanalen, de afspraken, bedoeld in [artikel 2.55][ref2], de
      regeling, bedoeld in [artikel 2.57][ref3], en de begroting, bedoeld in [artikel 2.147][ref4], en neemt zij
