  - number: '2.57'
    text: |-
      Een regeling voor de coördinatie en ordening van het media-aanbod als bedoeld in
      [artikel 2.10, tweede lid, onderdeel c][ref1], regelt in elk geval:

      a. de wijze waarop de coördinatie en ordening van het media-aanbod op en tussen de verschillende aanbodkanalen
      plaatsvindt;

      b. de wijze waarop de raad van bestuur zijn bevoegdheid om het beoogde moment van verspreiding van media-aanbod te
      wijzigen of media-aanbod niet te verspreiden, gebruikt;

      c. de wijze waarop de raad van bestuur de bevoegdheid, bedoeld in artikel 2.54, tweede lid, gebruikt; en

      d. de wijze waarop de raad van bestuur het tot stand komen van afspraken als bedoeld in
      [artikel 2.55, eerste lid][ref2], bevordert.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.10
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.55
