preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de taakopdracht van de publieke omroep te wijzigen
    in het licht van ontwikkelingen in technologie, media-aanbod, mediaproductie, distributie en mediagebruik, de
    reclameregels voor commerciële omroepen te versoepelen en andere noodzakelijke aanpassingen te doen; dat het verder
    wenselijk is de Mediawet te moderniseren en technisch aan te passen en dat het daarom wenselijk is een nieuwe
    Mediawet vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *aanbieder van een omroepnetwerk:* natuurlijke persoon of rechtspersoon die transmissiecapaciteit door middel van
      een omroepnetwerk ter beschikking stelt;
        - *aanbieder van een omroepzender:* natuurlijke persoon of rechtspersoon die transmissiecapaciteit door middel van
      een omroepzender ter beschikking stelt;
        - *aanbodkanaal:* geordende geheel van media-aanbod dat onder een herkenbare naam via een elektronisch
      communicatienetwerk als bedoeld in [artikel 1.1 van de Telecommunicatiewet][ref1] wordt aangeboden;
        - *alcoholhoudende drank:* alcoholhoudende drank als bedoeld in [artikel 1 van de Alcoholwet][ref2];
        - *audiovisueel media-aanbod:* media-aanbod van een mediadienst dat betrekking heeft op producten met bewegende
      beeldinhoud al dan niet mede met geluidsinhoud;
        - *Autoriteit Consument en Markt:* Autoriteit Consument en Markt als bedoeld in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref3];
        - *catch-up:* afname als mediadienst op aanvraag van media-aanbod gedurende een beperkte periode die begint tijdens
      of kort na de verspreiding van dat media-aanbod op een programmakanaal;
        - *commerciële mediadienst:* mediadienst die verzorgd wordt op grond van [hoofdstuk 3][ref4];
        - *commerciële media-instelling:* natuurlijke persoon of rechtspersoon die een commerciële mediadienst verzorgt en
      die voor de toepassing van deze wet onder de bevoegdheid van Nederland valt;
        - *Commissariaat:* Commissariaat voor de Media, genoemd in [artikel 7.1][ref5];
        - *concessiebeleidsplan:* concessiebeleidsplan als bedoeld in [artikel 2.20][ref6];
        - *concessiebeleidsplan RPO:* concessiebeleidsplan RPO als bedoeld in [artikel 2.60l][ref7];
        - *dagbladmarkt:* door het Stimuleringsfonds voor de journalistiek, genoemd in [artikel 8.1][ref8], vastgestelde
      gemiddelde betaalde oplage, in een kalenderjaar, van persorganen die bestemd zijn voor het publiek in Nederland en
      ten minste zes keer per week verschijnen;
        - *erkenningperiode:* periode als bedoeld in [artikel 2.29, eerste lid][ref9];
        - *Europese richtlijn:* Richtlijn 2010/13/EU van 10 maart 2010 van het Europees Parlement en de Raad betreffende
      de coördinatie van bepaalde wettelijke en bestuursrechtelijke bepalingen in de lidstaten inzake het aanbieden van
      audiovisuele mediadiensten (richtlijn audiovisuele mediadiensten);
        - *evenement:* georganiseerde voor het publiek toegankelijke gebeurtenis op het terrein van sport of cultuur;
        - *landelijke publieke media-instelling:* instelling die op grond van [titel 2.2][ref10] media-aanbod voor de
      landelijke publieke mediadienst verzorgt;
        - *lokale publieke media-instelling:* instelling die op grond van [titel 2.3][ref11] is aangewezen voor de
      verzorging van een lokale publieke mediadienst;
        - *media-aanbod:* één of meer elektronische producten met beeld- of geluidsinhoud die bestemd zijn voor afname door
      het algemene publiek of een deel daarvan;
        - *mediadienst:* dienst die bestaat uit het verzorgen van media-aanbod door middel van openbare elektronische
      communicatienetwerken als bedoeld in [artikel 1.1 van de Telecommunicatiewet][ref12], waarvoor de verzorger
      redactionele verantwoordelijkheid draagt;
        - *mediadienst op aanvraag:* mediadienst die bestaat uit het verzorgen van media-aanbod dat op individueel verzoek
      en op een moment naar keuze kan worden afgenomen;
        - *NOS:* Nederlandse Omroep Stichting, genoemd in [artikel 2.34a][ref13];
        - *NPO:* Stichting Nederlandse Publieke Omroep, genoemd in [artikel 2.2][ref14];
        - *NTR:* Stichting NTR, genoemd in [artikel 2.35][ref15];
        - *omroepdienst:* mediadienst die betrekking heeft op het verzorgen van media-aanbod dat op basis van een
      chronologisch schema dat is vastgesteld door de instelling die verantwoordelijk is voor het media-aanbod, al dan
      niet gecodeerd door middel van een omroepzender of een omroepnetwerk wordt verspreid voor gelijktijdige ontvangst
      door het algemene publiek of een deel daarvan;
        - *omroepnetwerk:* openbaar elektronisch communicatienetwerk als bedoeld in
      [artikel 1.1 van de Telecommunicatiewet][ref16], dat wordt gebruikt of mede wordt gebruikt om, hoofdzakelijk met
      gebruik van kabels, programma’s te verspreiden;
        - *omroeporganisatie:* omroeporganisatie als bedoeld in [artikel 2.23][ref17];
        - *omroepzender:* radiozendapparaat als bedoeld in [artikel 1.1 van de Telecommunicatiewet][ref18] dat wordt
      gebruikt of mede wordt gebruikt voor het verspreiden van programma’s;
        - *Onze Minister:* Onze Minister van Onderwijs, Cultuur en Wetenschap;
        - *open televisieprogrammakanaal:* televisieprogrammakanaal dat ontvangen kan worden door ten minste vijfenzeventig
      procent van alle huishoudens in Nederland, waarvoor geen andere kosten verschuldigd zijn dan: 1°. het tarief dat
      een pakketaanbieder als bedoeld in [artikel 6.9a][ref19] aan zijn abonnees in rekening brengt voor de ontvangst van
      het programma-aanbod van een door die aanbieder met inachtneming van de [artikelen 6.13 tot en met 6.14b][ref20]
      vast te stellen aantal programmakanalen; of 2°. de kosten van aankoop of gebruik van technische voorzieningen die
      de ontvangst van televisieprogramma’s mogelijk maken;
        - *overlay:* toevoeging aan het audiovisueel media-aanbod die niet afkomstig is van de media-instelling die de
      mediadienst verzorgt;
        - *politieke partij:* vereniging waarvan de aanduiding op grond van [artikel G 1][ref21], [Q 6][ref22] of
      [Y 10 van de Kieswet][ref23] is geregistreerd in het register van aanduidingen voor de verkiezing van leden van de
      Tweede Kamer, de Eerste Kamer of het Europees Parlement;
        - *productplaatsing:* het tegen betaling of soortgelijke vergoeding opnemen van of het verwijzen naar een product,
      dienst of (beeld)merk binnen het kader van een programma, of met een programma overeenkomend onderdeel van het
      media-aanbod;
        - *programma:* elektronisch product met beeld- of geluidsinhoud dat duidelijk afgebakend is en als zodanig
      herkenbaar onder een afzonderlijke titel via een omroepdienst wordt verspreid;
        - *programma-aanbod:* geheel van media-aanbod dat wordt verspreid via een omroepdienst;
        - *programmakanaal:* geordende geheel van programma-aanbod dat onder een herkenbare naam wordt verspreid via een
      omroepzender of omroepnetwerk;
        - *publieke mediadienst:* mediadienst die verzorgd wordt op grond van [hoofdstuk 2][ref24];
        - *publieke media-instelling:* instelling die op grond van [hoofdstuk 2][ref25] media-aanbod verzorgt;
        - *publieke mediaopdracht:* mediaopdracht als bedoeld in [artikel 2.1, eerste lid][ref26];
        - *raad van bestuur:* raad van bestuur van de NPO;
        - *radio-omroep:* omroepdienst die betrekking heeft op radioprogramma-aanbod;
        - *radioprogramma:* programma met uitsluitend geluidsinhoud;
        - *reclameboodschap:* uiting in welke vorm dan ook, niet zijnde een telewinkelboodschap, waarmee onmiskenbaar wordt
      beoogd het publiek te bewegen tot het kopen van een bepaald product of het gebruik maken van een bepaalde dienst,
      dan wel gunstig te stemmen ten aanzien van een bepaald bedrijf, een bedrijfstak of een bepaalde instelling teneinde
      de verkoop van producten of de afname van diensten te bevorderen;
        - *redactionele verantwoordelijkheid:* het uitoefenen van effectieve controle over: a. de keuze van het media-
      aanbod; en b. de ordening van het media-aanbod in een chronologisch schema voor wat betreft programma’s, of in een
      catalogus voor wat betreft het media-aanbod van mediadiensten op aanvraag;
        - *regionale publieke media-instelling:* instelling die op grond van [titel 2.3][ref27] is aangewezen voor de
      verzorging van een regionale publieke mediadienst;
        - *RPO:* Stichting Regionale Publieke Omroep;
        - *sluikreclame:* het anders dan op grond van deze wet vermelden of tonen van namen, (beeld)merken, producten,
      diensten of activiteiten van personen, bedrijven of instellingen als redelijkerwijs kan worden aangenomen dat
      daarmee wordt beoogd of mede wordt beoogd reclame te maken, met dien verstande dat het oogmerk in elk geval
      aanwezig is als de vertoning of vermelding tegen betaling of soortgelijke vergoeding geschiedt;
        - *sponsoring:* het verstrekken van financiële of andere bijdragen door een onderneming of een natuurlijke persoon
      die zich gewoonlijk niet bezighoudt met de verzorging van mediadiensten of media-aanbod, ten behoeve van de
      totstandkoming of aankoop van media-aanbod, teneinde de verspreiding daarvan naar het algemene publiek of een deel
      daarvan te bevorderen of mogelijk te maken;
        - *sportwedstrijd:* wedstrijd of de voorbereiding op een wedstrijd, georganiseerd door of onder auspiciën van de
      door het NOC*NSF erkende nationale sportorganisaties en hun geledingen, of door vergelijkbare internationale, al
      dan niet overkoepelende sportorganisaties, dan wel een andere wedstrijd of de voorbereiding op een wedstrijd van
      een sport die door het NOC*NSF als sport is aangemerkt;
        - *Ster:* Stichting Etherreclame, genoemd in [artikel 2.99][ref28];
        - *teletekst:* televisieprogramma dat uitsluitend bestaat uit stilstaande tekstbeelden die door de kijker in
      een door hem bepaalde volgorde en op een door hem bepaald tijdstip kunnen worden geraadpleegd, en dat wordt
      verspreid via dezelfde transmissieruimte van een omroepzender of omroepnetwerk als die welke wordt gebruikt voor de
      verspreiding van andere televisieprogramma’s;
        - *televisieomroep:* omroepdienst die betrekking heeft op televisieprogramma-aanbod;
        - *televisieprogramma:* programma met beeldinhoud, al dan niet mede met geluidsinhoud;
        - *telewinkelboodschap:* uiting in een televisieprogramma-aanbod die bestaat uit een rechtstreekse aanbieding aan
      het publiek met het oog op de levering tegen betaling van producten of diensten;
        - *uitgever van een persorgaan:* rechtspersoon die een persorgaan uitgeeft.

      2 Onder reclameboodschap als bedoeld in het eerste lid wordt niet verstaan het oproepen tot steun aan
      of het gunstig stemmen ten aanzien van instellingen met een wetenschappelijk, cultureel, godsdienstig,
      levensbeschouwelijk, politiek of liefdadig karakter, voor zover dat geen betrekking heeft op het kopen van een
      bepaald product of het gebruik maken van een bepaalde dienst die in de handel verkrijgbaar is.


