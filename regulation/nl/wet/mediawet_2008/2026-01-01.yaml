  - number: '2.32'
    text: |-
      1 Onze Minister wijst een aanvraag voor een erkenning of een voorlopige erkenning af als de aanvrager niet voldoet
      aan de [artikelen 2.24][ref1], [2.24a][ref2], [2.25, eerste lid, onderdelen a, b en d, en derde lid][ref3], of
      [2.26, eerste lid, onderdelen a, b, en d tot en met g][ref4].

      2 Onze Minister kan een aanvraag afwijzen als:

      a. de aanvrager blijkens de tweede evaluatie, bedoeld in [artikel 2.184, derde lid][ref5], onvoldoende heeft
      bijgedragen aan de uitvoering van de publieke mediaopdracht op landelijk niveau door de wijze waarop hij
      uitvoering heeft gegeven aan zijn publieke taak, bedoeld in [artikel 2.24, eerste lid, onderdeel b][ref6], of
      [2.24a, eerste lid, onderdeel b][ref7];

      b. de aanvrager niet voldoet aan [artikel 2.30, eerste tot en met derde en vijfde lid][ref8], of de krachtens
      artikel 2.30, vierde lid, gestelde eisen;

      c. aannemelijk is dat de aanvrager zich, mede gelet op zijn handelwijze in een voorafgaande periode waarin hij een
      erkenning heeft gehad, niet zal houden aan het bepaalde bij of krachtens deze wet; of

      d. uit de aanvraag naar de mening van Onze Minister onvoldoende blijkt dat:

      1°. in het door de aanvrager te verzorgen media-aanbod de identiteit en missie van de aanvrager tot uitdrukking
      komt;

      2°. het door de aanvrager te verzorgen media-aanbod voldoet aan de daaraan bij of krachtens deze wet gestelde
      eisen; of

      3°. de aanvrager bereid is tot samenwerking ten behoeve van de landelijk publieke mediadienst en zijn
      verantwoordelijkheid gewaarborgd is als bedoeld in [artikel 2.30, tweede lid, onderdeel c][ref9].

      3 Onze Minister kan daarnaast een aanvraag afwijzen als de aanvraag niet uitgaat van een voorstel als bedoeld in
      [artikel 2.31, derde lid][ref10].


