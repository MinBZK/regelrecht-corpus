        artikel: 2.34d
        hoofdstuk: '2'
        afdeling: 2.2.2a
  - number: 2.34g
    text: |-
      1 De directie bestuurt de NOS.

      2 De directie is belast met de dagelijkse leiding en het financiële beheer van de NOS.

      3 De directie is verder belast met datgene wat niet uitdrukkelijk tot de taken of bevoegdheden van de raad van
      toezicht behoort.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.34g
  - number: 2.34h
    text: |-
      1 De NOS verstrekt Onze Minister desgevraagd alle inlichtingen met betrekking tot de werkzaamheden van de
      stichting.

      2 Onze Minister kan inzage verlangen in zakelijke gegevens en bescheiden van de NOS voor zover dat voor de
      vervulling van zijn taak nodig is.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.34h
  - number: 2.34i
    text: |-
      1 De NOS stelt jaarlijks vóór 1 mei een bestuursverslag over het afgelopen kalenderjaar vast.

      2 In het bestuursverslag wordt aandacht besteed aan de werkzaamheden van de NOS, het gevoerde beleid in het
      algemeen en de doelmatigheid en doeltreffendheid van de werkzaamheden in het bijzonder.

      3 De NOS zendt het bestuursverslag aan Onze Minister en maakt het openbaar.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.34i
  - number: 2.34j
    text: |-
      1 Wijziging in de statuten van de NOS behoeven de instemming van Onze Minister.

      2 De raad van toezicht en de directie kunnen niet besluiten tot ontbinding van de NOS.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.34j
  - number: '2.35'
    text: |-
      1 De Stichting NTR heeft tot taak media-aanbod voor de landelijke publieke mediadienst te verzorgen dat voorziet in
      de bevrediging van in de samenleving levende maatschappelijke, culturele, godsdienstige of geestelijke behoeften,
      zodanig dat dit media-aanbod samen met het media-aanbod van de andere landelijke publieke media-instellingen een
      evenwichtig beeld oplevert van de maatschappelijke, culturele, godsdienstige en geestelijke verscheidenheid in
      Nederland.

      2 Bij algemene maatregel van bestuur kan worden bepaald welk media-aanbod als bedoeld in het eerste lid in ieder
      geval door de NTR wordt verzorgd.

      3 De NTR heeft eveneens tot taak het voor de landelijke publieke mediadienst verzorgen van een breed en
      samenhangend educatief media-aanbod op het gebied van onderwijs, scholing en vorming.

      4 De raad van bestuur kan de NTR belasten met het verzorgen van media-aanbod als bedoeld in
      [artikel 2.54, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.54
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.35
