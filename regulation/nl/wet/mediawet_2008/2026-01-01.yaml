  - number: '2.122'
    text: |-
      1 Op elk televisieprogrammakanaal van de landelijke en regionale publieke mediadienst bestaat het programma-aanbod
      voor ten minste vijftig procent van de duur uit oorspronkelijk Nederlands- of Friestalige producties.

      2 Voor de toepassing van het eerste lid blijft buiten beschouwing:

      a. programma-aanbod dat bestaat uit reclame- en telewinkelboodschappen, inclusief omlijsting; en

      b. programma-aanbod dat van kerkelijke of geestelijke aard is en programma-aanbod van politieke partijen en de
      overheid.

      3 Het Commissariaat kan in bijzondere gevallen geheel of gedeeltelijk ontheffing verlenen van het eerste lid. Het
      Commissariaat kan aan een ontheffing voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.122
  - number: '2.123'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen regels worden gesteld over de ondertiteling van televisieprogramma-
      aanbod, waarbij onder meer kan worden bepaald welk percentage van het televisieprogramma-aanbod van de landelijke
      publieke mediadienst bestaat uit producties als bedoeld in [artikel 2.122, eerste lid][ref1], die voorzien zijn van
      ondertiteling ten behoeve van personen met een auditieve beperking.

      2 Het Commissariaat kan in bijzondere gevallen geheel of gedeeltelijk ontheffing verlenen van een verplichting
      betreffende het percentage, bedoeld in het eerste lid. Het Commissariaat kan aan een ontheffing voorschriften
      verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.122
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.123
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.122'
        hoofdstuk: '2'
        paragraaf: 2.5.4.2
        afdeling: 2.5.4
  - number: '2.124'
    text: |-
      In het media-aanbod van de publieke mediadiensten worden geen films opgenomen buiten de met de rechthebbenden
      overeengekomen periodes.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.124
  - number: '2.132'
    text: |-
      1 De NPO en de publieke media-instellingen mogen alleen na voorafgaande toestemming van het Commissariaat
      nevenactiviteiten verrichten.

      2 Nevenactiviteiten zijn activiteiten, directe of indirecte deelnemingen in rechtspersonen daaronder begrepen,
      die niet rechtstreeks verband houden met of ten dienste staan van de uitvoering van de publieke mediaopdracht, met
      uitzondering van verenigingsactiviteiten als bedoeld in [artikel 2.136][ref1].

      3 Toestemming kan alleen worden gegeven als een nevenactiviteit verband houdt met of ten dienste staat van de
      verwezenlijking van de publieke mediaopdracht en direct gerelateerd is aan het media-aanbod van de publieke media-
      instelling, op marktconforme wijze wordt verricht en ten minste kostendekkend is.

      4 In afwijking van het eerste lid is geen voorafgaande toestemming van het Commissariaat nodig voor het bij
      wijze van experiment van beperkte omvang en duur verrichten van nevenactiviteiten die bestaan uit het leveren van
      goederen of diensten, met inbegrip van rechten en verplichtingen aan:

      a. mediabedrijven ten behoeve van de versterking en verbetering van de nieuws- en informatievoorziening; of

      b. culturele instellingen.

      5 De NPO en de publieke media-instellingen melden nevenactiviteiten als bedoeld in het vierde lid bij het
      Commissariaat.

      6 Bij ministeriële regeling kunnen nadere regels worden gesteld over:

      a. de wijze van melden;

      b. de omvang en duur van het experiment;

      c. de aard en inhoud van de nevenactiviteiten; en

      d. de samenwerking met de in het vierde lid, onderdelen a en b, bedoelde instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.136
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.132
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.136'
        hoofdstuk: '2'
        afdeling: 2.5.6
  - number: '2.133'
    text: |-
      Op overeenkomsten ter zake van nevenactiviteiten die er toe strekken om rechten op en de bekendheid van media-
      aanbod dat voor de landelijke publieke mediadienst is verzorgd of daaraan verbonden namen en merken buiten
      de publieke mediadienst te exploiteren, zijn de [artikelen 2.110 tot en met 2.112][ref1] van overeenkomstige
      toepassing, met dien verstande dat de termijn, bedoeld in [artikel 2.111, eerste en tweede lid][ref2], twee maanden
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.110
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.111
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.133
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.110'
        hoofdstuk: '2'
        afdeling: 2.5.3
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2.111'
        hoofdstuk: '2'
        afdeling: 2.5.3
  - number: '2.134'
    text: |-
      1 In het kader van nevenactiviteiten kunnen de NPO en de publieke media-instellingen rechtspersonen of
      samenwerkingsverbanden oprichten of daarin deelnemen.

      2 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over het verrichten van nevenactiviteiten.

      3 De instellingen die nevenactiviteiten willen verrichten, tonen desgevraagd ten genoegen van het Commissariaat aan
      dat de nevenactiviteiten voldoen aan het bepaalde bij of krachtens [artikel 2.132][ref1] en dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.132
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.134
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.132'
        hoofdstuk: '2'
        afdeling: 2.5.6
  - number: '2.135'
    text: |-
      1 Tenzij bij of krachtens deze wet anders is bepaald, gebruiken de NPO, de RPO en de publieke media-instellingen al
      hun inkomsten voor de uitvoering van de publieke mediaopdracht.

      2 De landelijke publieke media-instelling die samenwerkingsomroep is, draagt ervoor zorg dat de omroepverenigingen
      die hij vertegenwoordigt, al hun inkomsten voor de uitvoering van de publieke mediaopdracht gebruiken, tenzij bij
      of krachtens deze wet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.135
  - number: '2.136'
    text: |-
      1 Omroeporganisaties die een erkenning of een voorlopige erkenning als bedoeld in [artikel 2.23][ref1] hebben
      verkregen, kunnen netto inkomsten uit contributies en verenigingsactiviteiten en, tot ten hoogste een bij algemene
      maatregel van bestuur te bepalen bedrag en volgens bij algemene maatregel van bestuur te stellen nadere regels uit
      programmabladen gebruiken voor eigen verenigingsactiviteiten.

      2 Verenigingsactiviteiten zijn activiteiten die:

      a. redelijkerwijs nodig zijn voor het goed functioneren van de vereniging en haar organen;

      b. gebruikelijk zijn in een actief functionerende vereniging om de band met en tussen de leden te versterken; of

      c. in de vorm van evenementen ondersteunend zijn aan het uitdragen van de missie van de vereniging.

      3 Onder verenigingsactiviteiten als bedoeld in het eerste lid worden ook verstaan activiteiten van een stichting
      die samenwerkingsomroep is en die een erkenning als bedoeld in [artikel 2.23, eerste lid][ref2], heeft verkregen,
      en welke activiteiten:

      a. redelijkerwijs nodig zijn voor het goed functioneren van de stichting en haar organen;

      b. gebruikelijk zijn in een actief functionerende stichting om de band met en tussen de contribuanten te
      versterken; of

      c. in de vorm van evenementen ondersteunend zijn aan het uitdragen van de missie van de stichting.

      4 De landelijke publieke media-instelling die samenwerkingsomroep is, draagt ervoor zorg dat de omroepverenigingen
      die hij vertegenwoordigt, netto inkomsten uit contributies en verenigingsactiviteiten gebruiken voor eigen
      verenigingsactiviteiten als bedoeld in het tweede lid, voor zover de omroepverenigingen van die bevoegdheid gebruik
      maken.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.23
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.23
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.136
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2.23'
        hoofdstuk: '2'
        afdeling: 2.2.2
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '2.23'
        hoofdstuk: '2'
        afdeling: 2.2.2
  - number: '2.137'
    text: |-
      1 Het is omroepverenigingen niet toegestaan in het kader van ledenwerving op geld waardeerbare voordelen aan leden
      te verstrekken.

      2 Onverminderd het eerste lid kan het Commissariaat regels stellen over het verstrekken van op geld waardeerbare
      voordelen aan leden en over activiteiten in het kader van ledenwerving. De regels behoeven de goedkeuring van Onze
      Minister.

      3 De landelijke publieke media-instelling die samenwerkingsomroep is, draagt ervoor zorg dat de omroepverenigingen
      die hij vertegenwoordigt de regels in acht nemen.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.137
  - number: '2.138'
    text: |-
      1 Als een omroeporganisatie voornemens is na afloop van de periode waarvoor een erkenning of een voorlopige
      erkenning als bedoeld in [artikel 2.23][ref1] is verleend een commerciële omroepdienst te verzorgen of een belang
      te verwerven in een commerciële media-instelling, meldt zij dit aan het Commissariaat.

      2 Na de melding kan de omroeporganisatie in het laatste jaar van de erkenningperiode activiteiten verrichten
      die noodzakelijk zijn om te zorgen dat zij of de rechtspersoon waarin zij een belang verwerft na afloop van de
      erkenningperiode een commerciële omroepdienst kan verzorgen.

      3 Tijdens de periode dat een omroeporganisatie activiteiten als bedoeld in het tweede lid verricht, is
      [artikel 2.33, eerste lid][ref2], niet van toepassing en wordt zij beschouwd als omroeporganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.23
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.33
