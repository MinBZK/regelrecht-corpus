  - number: '2.55'
    text: |-
      1 De raad van bestuur bevordert dat tussen de NPO en de landelijke publieke media-instellingen afspraken tot stand
      komen over de kwantitatieve en kwalitatieve doelstellingen voor het media-aanbod, de publieksbetrokkenheid en het
      publieksbereik op de aanbodkanalen en over de wederzijdse inspanningen daarvoor.

      2 De instellingen:

      a. stellen het media-aanbod dat zij ter uitvoering van hun publieke taak verzorgen ter beschikking voor
      verspreiding op de aanbodkanalen;

      b. zorgen voor voldoende gebruiksrechten op dat media-aanbod voor verspreiding, hergebruik en ontsluiting op de
      aanbodkanalen; en

      c. verlenen medewerking in het kader van de taak van de NPO om voor de landelijke publieke mediadienst het
      verwerven, beheren en gebruiken van rechten op media-aanbod en de daaraan verbonden namen en merken te coördineren.

      3 Het tweede lid is ook van toepassing op het media-aanbod dat omroepverenigingen die vertegenwoordigd zijn in een
      samenwerkingsomroep in eerdere erkenningperiodes hebben verzorgd.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.55
  - number: '2.56'
    text: |-
      1 Voor de coördinatie en ordening op en tussen de aanbodkanalen van het media-aanbod van de landelijke publieke
      mediadienst wordt de raad van bestuur bijgestaan door een redactie, die als volgt is samengesteld:

      a. de omroeporganisaties die een erkenning als bedoeld in [artikel 2.23, eerste lid][ref1], hebben verkregen, de
      NOS en de NTR benoemen elk een lid; en

      b. de omroepverenigingen die een voorlopige erkenning als bedoeld in [artikel 2.23, tweede lid][ref2], hebben
      verkregen worden vertegenwoordigd door het voor de NTR benoemde lid of het voor de omroeporganisatie, bedoeld in
      [artikel 2.26, eerste lid, onder f][ref3], benoemde lid.

      2 Het lidmaatschap van een redactie is onverenigbaar met het lidmaatschap van een orgaan van de NPO, een landelijke
      publieke media-instelling of een omroepvereniging die in een samenwerkingsomroep vertegenwoordigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.23
