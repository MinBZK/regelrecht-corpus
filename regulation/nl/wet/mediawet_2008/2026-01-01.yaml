      1 De [artikelen 2.15 tot en met 2.18, eerste lid][ref1], zijn van overeenkomstige toepassing voor de RPO.

      2 De raad van toezicht van de RPO en het bestuur van de RPO kunnen niet besluiten tot ontbinding van de RPO.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.15
