  - number: '7.20'
    text: |-
      1 Het Commissariaat stelt jaarlijks vóór 1 november Onze Minister in kennis van het voorgenomen handhavingsbeleid
      in het volgende kalenderjaar.

      2 Het Commissariaat oefent geen voorafgaand toezicht uit op de inhoud van media-aanbod.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel7.20
  - number: '7.21'
    text: |-
      1 Het Commissariaat is belast met het onderzoek naar ontwikkelingen ten aanzien van concentraties en financieel-
      economische omstandigheden op de nationale en internationale mediamarkten en de gevolgen daarvan voor de
      pluriformiteit en onafhankelijkheid van de informatievoorziening.

      2 Het Commissariaat rapporteert jaarlijks over zijn bevindingen aan Onze Minister.

      3 Het Commissariaat maakt zijn bevindingen openbaar, met uitzondering van gegevens die naar hun aard vertrouwelijk
      zijn.

      4 Het Commissariaat handhaaft de naleving van het redactiestatuut, bedoeld in de
      [artikelen 2.88, tweede lid][ref1], en [3.5, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.88
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel3.5
