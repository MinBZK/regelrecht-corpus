  - number: 3.29a
    text: |-
      In deze titel en de daarop berustende bepalingen wordt verstaan onder:

        - *animatie:* audiovisuele productie met toepassing van een filmtechniek waarbij de illusie van beweging wordt
      gecreëerd door verschillende stilstaande beelden na elkaar af te spelen;
        - *commerciële mediadienst op aanvraag:* mediadienst op aanvraag die door een commerciële media-instelling wordt
      verzorgd en waarbij het media-aanbod betrekking heeft op producten met bewegende beeldinhoud al dan niet mede met
      geluidsinhoud. Daaronder worden ook begrepen bijbehorende ondertitelingsdiensten en elektronische programmagidsen;
        - *documentairefilm:* audiovisuele productie in het genre non-fictie waarbij de eigen visie van de regisseur wordt
      vormgegeven met creatieve gebruikmaking van filmische middelen in een persoonlijke stijl, met een vertoningsduur
      van ten minste 50 minuten;
        - *documentaireserie:* audiovisuele productie in het genre non-fictie, waarbij de eigen visie van de regisseur
      wordt vormgegeven met creatieve gebruikmaking van filmische middelen in een persoonlijke stijl, met een doorlopende
      verhaallijn en in een beperkte reeks, met een totale vertoningsduur van ten minste 120 minuten, verdeeld over
      meerdere afleveringen van ieder ten minste twintig minuten;
        - *dramaserie:* audiovisuele productie in het genre fictie, met een doorlopende verhaallijn en in een beperkte
      reeks, met een totale vertoningsduur duur van ten minste 120 minuten, verdeeld over afleveringen van ieder ten
      minste twintig minuten, dan wel in het geval van een serie die in het bijzonder bestemd is voor kinderen jonger
      dan twaalf jaar of van een animatie, met een totale vertoningsduur van ten minste 100 minuten, verdeeld over
      afleveringen van ieder ten minste tien minuten;
        - *speelfilm:* audiovisuele productie in het genre fictie met een vertoningsduur van ten minste 60 minuten.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel3.29a
  - number: 3.29b
    text: |-
      1 Een media-instelling die een commerciële mediadienst op aanvraag verzorgt of beëindigt, meldt het moment van de
      aanvang of de beëindiging van de mediadienst op aanvraag binnen twee weken na dat moment aan het Commissariaat. Als
      een media-instelling een door een derde aangeleverde commerciële mediadienst op aanvraag wijzigt, meldt deze media-
      instelling eveneens de gewijzigde commerciële mediadienst op aanvraag. De volgende gegevens van de media-instelling
      worden daarbij in elk geval verstrekt:

      a. naam;

      b. plaats van vestiging; en

      c. contactgegevens waaronder e-mailadres of internetadres.

      2 Een media-instelling die een commerciële mediadienst op aanvraag verzorgt, stelt eveneens ten minste de
      gegevens, bedoeld in het eerste lid, gemakkelijk, rechtstreeks en permanent beschikbaar, alsmede de naam van het
      Commissariaat als het orgaan dat is belast met het toezicht op de naleving van het bepaalde bij of krachtens deze
      titel.

      3 Een media-instelling die een commerciële mediadienst op aanvraag verzorgt informeert het Commissariaat onverwijld
      over wijzigingen die van invloed kunnen zijn op de bevoegdheid van Nederland over deze media-instelling.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel3.29b
  - number: 3.29c
    text: |-
      1 Het audiovisueel media-aanbod van een commerciële mediadienst op aanvraag bestaat voor ten minste dertig procent
      uit Europese producties als bedoeld in artikel 1 van de Europese richtlijn.

      2 De Europese producties op een commerciële mediadienst op aanvraag worden door de media-instelling die de
      commerciële mediadienst op aanvraag verzorgt onder de aandacht van het publiek gebracht.

      3 Het eerste en tweede lid zijn niet van toepassing op een media-instelling die een commerciële mediadienst op
      aanvraag met een lage omzet of een klein publiek verzorgt.

      4 Het Commissariaat kan voor een media-instelling die een commerciële mediadienst op aanvraag verzorgt ontheffing
      verlenen van het eerste en tweede lid indien de toepassing van deze leden gelet op de aard of het onderwerp van
      deze mediadienst op aanvraag praktisch onhaalbaar of ongerechtvaardigd zou zijn.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel3.29c
  - number: 3.29d
    text: |-
      Op commerciële mediadiensten op aanvraag zijn de [artikelen 3.5][ref1], [3.5b][ref2], [3.6][ref3],
      [3.7, tweede lid, aanhef en onderdeel a][ref4], [3.15 tot en met 3.19c][ref5], [3.26][ref6] en [3.27][ref7] van
      overeenkomstige toepassing met uitzondering van de [artikelen 3.16, tweede lid, aanhef en onderdeel a][ref8], en
      [3.19b, derde lid, onderdeel b][ref9].


