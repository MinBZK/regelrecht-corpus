  - number: '2.53'
    text: |-
      1 De raad van bestuur verzorgt de plaatsing van het media-aanbod van de landelijke publieke media-instellingen en
      de Ster op de aanbodkanalen.

      2 De raad van bestuur kan de plaatsing op de aanbodkanalen herzien:

      a. als een erkenning of een voorlopige erkenning wordt ingetrokken;

      b. in het belang van de coördinatie en ordening op en tussen de verschillende aanbodkanalen; of

      c. op grond van omstandigheden die niet voorzien waren ten tijde van de indeling.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.53
  - number: '2.54'
    text: |-
      1 De raad van bestuur zorgt er in het kader van de coördinatie voor dat het media-aanbod op de aanbodkanalen
      van de landelijke publieke mediadienst past binnen de kaders van [artikel 2.1][ref1], het concessiebeleidsplan
      en de profielen van de aanbodkanalen en voldoet aan de [artikelen 2.115][ref2], [2.116][ref3] en
      [2.119 tot en met 2.123][ref4], alsmede dat de landelijke publieke media-instellingen beschikken over
      ruimte op de aanbodkanalen die nodig is om media-aanbod dat is vervaardigd met de budgetten, bedoeld in
      [artikel 2.149, eerste lid, onder a tot en met d][ref5], te kunnen plaatsen.

      2 De raad van bestuur kan het initiatief nemen tot het verzorgen van media-aanbod door een landelijke publieke
      media-instelling op basis van een voorstel dat niet afkomstig is van de NPO of een landelijke publieke media-
      instelling.

      3 Bij het verzorgen van media-aanbod als bedoeld in het tweede lid neemt de landelijke publieke media-instelling
      de afspraken in acht die de raad van bestuur over het media-aanbod heeft gemaakt met de partij van wie het voorstel
      afkomstig is.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.115
