  - number: '2.141'
    text: |-
      1 De NPO, de RPO en de publieke media-instellingen zijn met al hun activiteiten niet dienstbaar aan het maken van
      winst door derden en tonen dat desgevraagd naar genoegen van het Commissariaat aan.

      2 De landelijke publieke media-instelling die samenwerkingsomroep is, draagt ervoor zorg dat de omroepverenigingen
      die hij vertegenwoordigt, met al hun activiteiten niet dienstbaar zijn aan het maken van winst door derden en tonen
      dat desgevraagd naar genoegen van het Commissariaat aan.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.141
  - number: '2.142'
    text: |-
      1 De NPO, de RPO en de publieke media-instellingen zorgen er voor dat leden van hun organen, werknemers en andere
      personen of rechtspersonen waarmee een overeenkomst is gesloten met het oog op de uitvoering van de publieke
      mediaopdracht, voor zichzelf of voor anderen geen op geld waardeerbaar voordeel van derden bedingen of aanvaarden
      dat direct of indirect verband houdt met werkzaamheden van de betrokkene voor de instelling, tenzij het daartoe
      bevoegde orgaan van de instelling daarvoor toestemming heeft gegeven.

      2 Toestemming wordt alleen gegeven als de betrokkene aannemelijk maakt dat het voordeel niet is bedoeld als
      tegenprestatie voor het door hem in de uitoefening van zijn werkzaamheden voor de instelling bevoordelen van
      derden.

      3 Een persoon of rechtspersoon die een overeenkomst als bedoeld in het eerste lid heeft gesloten, wordt ten
      opzichte van degenen die in zijn dienst werken niet aangemerkt als een derde.

      4 De landelijke publieke media-instelling die samenwerkingsomroep is, draagt ervoor zorg dat de omroepverenigingen
      die hij vertegenwoordigt, overeenkomstig het eerste tot en met derde lid handelen.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.142
  - number: 2.142a
    text: |-
      1 De NPO, de RPO, de landelijke en regionale publieke media-instellingen en de instellingen die door Onze Minister
      zijn aangewezen voor het in stand houden en exploiteren van omroeporkesten en omroepkoren, van een media-archief
      en van een expertisecentrum voor media-educatie, richten hun bestuurlijke organisatie zodanig in dat overeenkomstig
      hun statuten en reglementen:

      a. de inrichting daarvan sober, doelmatig en evenwichtig is;

      b. er een helder onderscheid is tussen het dagelijks bestuur en het toezichthoudende orgaan;

      c. deugdelijk, onafhankelijk en deskundig toezicht wordt uitgeoefend; en

      d. de leden van het toezichthoudende orgaan worden benoemd op basis van vooraf vastgestelde openbare profielen.

      2 De NPO en de landelijke publieke media-instellingen volgen daarbij zo veel als mogelijk aanbevelingen uit de
      gedragscode, bedoeld in [artikel 2.3, tweede lid][ref1].

      3 De landelijke publieke media-instelling die samenwerkingsomroep is, draagt ervoor zorg dat de omroepverenigingen
      die hij vertegenwoordigt, overeenkomstig het eerste en tweede lid handelen.

      4 Bij algemene maatregel van bestuur kan nader worden omschreven wanneer sprake is van een sobere, doelmatige en
      evenwichtige inrichting als bedoeld in het eerste lid, onder a.


