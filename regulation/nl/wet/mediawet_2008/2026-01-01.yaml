  - number: '2.174'
    text: |-
      1 De landelijke publieke media-instellingen kunnen met toestemming van de raad van bestuur en onder de door hem te
      stellen voorwaarden, die per instelling of categorie van instellingen kunnen verschillen, gelden voor de verzorging
      van media-aanbod reserveren. De NPO kan gelden die bestemd zijn voor de verzorging van media-aanbod door de
      landelijke publieke media-instellingen, reserveren. De NPO kan tevens gelden die bestemd zijn voor de uitvoering
      van zijn taken en werkzaamheden, reserveren.

      2 Het totaal van de gereserveerde gelden in een kalenderjaar bedraagt niet meer dan tien procent van de
      uitgaven van de NPO en de landelijke publieke media-instellingen met uitzondering van de uitgaven aan
      verenigingsactiviteiten, zoals opgenomen in de jaarrekening, bedoeld in [artikel 2.171, tweede en derde lid][ref1].

      3 Gelden die in strijd met het eerste lid zijn gereserveerd, worden terugbetaald aan de raad van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.171
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.174
