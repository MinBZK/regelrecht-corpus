        hoofdstuk: '2'
        paragraaf: 2.3.1a
  - number: 9.14g
    text: |-
      De relevante omzet, bedoeld in [artikel 3.29e][ref1], wordt voor het eerst bepaald over de resterende maanden van
      het op de datum van inwerkingtreding van dit artikel lopende boekjaar, dan wel over het boekjaar dat aanvangt op de
      datum van inwerkingtreding van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3.29e
