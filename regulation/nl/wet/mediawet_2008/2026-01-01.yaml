  - number: '6.4'
    text: |-
      Een politieke partij gebruikt de aan haar toegewezen uren geheel en alleen voor programma-aanbod op politiek
      terrein.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel6.4
  - number: '6.5'
    text: |-
      1 Het Commissariaat wijst jaarlijks op aanvraag van Onze Minister-President, Minister van Algemene Zaken,
      een aantal uren op de algemene programmakanalen van de landelijke publieke mediadienst toe ten behoeve van
      overheidsvoorlichting.

      2 Bij ministeriële regeling worden nadere regels gesteld over:

      a. het tijdstip waarop een aanvraag wordt ingediend; en

      b. de termijn waarbinnen een besluit op de aanvraag wordt genomen.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel6.5
  - number: '6.6'
    text: |-
      1 De toegewezen uren zijn beschikbaar voor Onze Ministers voor gebruik door overheidsinstellingen of personen die
      door hen zijn aangewezen.

      2 De toegewezen uren worden geheel gebruikt en alleen voor overheidsvoorlichting.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel6.6
  - number: '6.7'
    text: |-
      1 Onze Minister stelt jaarlijks op advies van het Commissariaat en de NPO de totale hoeveelheid uren vast die op
      de algemene programmakanalen van de landelijke publieke mediadienst beschikbaar zijn voor politieke partijen en
      de overheid.

      2 Het Commissariaat kan in bijzondere gevallen of voor bijzondere doelen meer uren vaststellen.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel6.7
  - number: '6.8'
    text: |-
