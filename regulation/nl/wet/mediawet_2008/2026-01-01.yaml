  - number: 2.60i
    text: |-
      1 De volgende besluiten van het bestuur van de RPO behoeven de instemming van de raad van toezicht van de RPO:

      a. de besluiten, bedoeld in het [artikel 2.60h, tweede lid, onder c tot en met f][ref1];

      b. het doen van investeringen die een in de statuten van de RPO vastgesteld bedrag te boven gaan;

      c. het door de RPO aangaan of verbreken van duurzame samenwerking met een andere rechtspersoon of vennootschap als
      die samenwerking van ingrijpende betekenis is voor de RPO of de regionale publieke media-instellingen;

      d. collectief ontslag van een aanmerkelijk aantal werknemers; en

      e. het vaststellen van ingrijpende wijzigingen in de arbeidsomstandigheden van een aanmerkelijk aantal werknemers.

      2 De verdere werkwijze van de raad van toezicht van de RPO en het bestuur van de RPO wordt geregeld in de statuten
      en reglementen van de RPO.

      3 In de statuten wordt in ieder geval geregeld op welke wijze de regionale publieke media-instellingen worden
      betrokken bij de besluitvorming van het bestuur van de RPO.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.60h
