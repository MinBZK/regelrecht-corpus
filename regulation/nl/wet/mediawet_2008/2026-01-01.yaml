  - number: '6.14'
    text: |-
      1 Als een pakketaanbieder een of meer analoge programmapakketten verspreidt of laat verspreiden, ontvangen alle
      abonnees die met hem een overeenkomst met betrekking tot de ontvangst van een of meer analoge programmapakketten
      hebben gesloten, in elk geval een analoog standaardprogrammapakket.

      2 Het standaardprogrammapakket bestaat uit ten minste vijftien televisieprogrammakanalen en een door de
      pakketaanbieder met inachtneming van het vierde lid te bepalen aantal radioprogrammakanalen. De programmakanalen
      worden ongewijzigd verspreid.

      3 [Artikel 6.13, derde lid, aanhef en onderdelen a, b, d en e][ref1], is van toepassing. Artikel 6.13, derde lid,
      aanhef en onderdeel f, is van toepassing met dien verstande dat het aantal televisieprogrammakanalen twee bedraagt.

      4 [Artikel 6.13, vierde lid, aanhef en onderdelen a, b, c en d][ref2], is van toepassing. Artikel 6.13, vierde lid,
      aanhef en onderdeel e, is van toepassing met dien verstande dat het aantal radioprogrammakanalen twee bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel6.13
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel6.13
