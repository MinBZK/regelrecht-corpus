  - number: '7.15'
    text: |-
      1 Bij een onherroepelijke veroordeling tot een onvoorwaardelijke geldboete op grond van
      [artikel 137d van het Wetboek van Strafrecht][ref1] verbiedt het Commissariaat:

      a. een omroepvereniging, de educatieve media-instelling en een kerkgenootschap of genootschap op geestelijke
      grondslag tijdelijk een erkenning of aanwijzing als bedoeld in [hoofdstuk 2, afdeling 2.2.2][ref2] respectievelijk
      [afdeling 2.2.4][ref3], te gebruiken;

      b. een regionale of lokale publieke media-instelling tijdelijk een aanwijzing als bedoeld in
      [hoofdstuk 2, paragraaf 2.3.1][ref4], te gebruiken; en

      c. een commerciële media-instelling tijdelijk een toestemming als bedoeld in [hoofdstuk 3, titel 3.1][ref5], te
      gebruiken.

      2 Een verbod geldt voor een periode van:

      a. één jaar, bij een geldboete van minder dan € 1 125;

      b. twee jaar, bij een geldboete van € 1 125 of meer, maar minder dan € 2 250;

      c. drie jaar, bij een geldboete van € 2 250 of meer, maar minder dan € 3 375; en

      d. vier jaar, bij een geldboete van € 3 375 of meer.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel137d
