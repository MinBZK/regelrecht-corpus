  - number: '2.152'
    text: |-
      1 De raad van bestuur verdeelt het budget, bedoeld in [artikel 2.149, eerste lid, aanhef en onder a][ref1],
      over de omroeporganisaties met een erkenning, bedoeld in [artikel 2.23, eerste lid][ref2], zodanig dat elke
      omroeporganisatie een bedrag ontvangt dat gelijk is aan de som van de bedragen die worden toegerekend aan de
      organisaties waaruit de omroeporganisatie is samengesteld.

      2 De organisaties waaruit een omroeporganisatie kan zijn samengesteld zijn:

      a. een samenwerkingsomroep als bedoeld in [artikel 2.24a][ref3];

      b. een omroepvereniging als bedoeld in [artikel 2.24][ref4];

      c. een omroepvereniging met een voorlopige erkenning als bedoeld in [artikel 2.23, tweede lid][ref5].

      3 Bepalend voor de indeling, bedoeld in het tweede lid, is de organisatie waarvan sprake was bij aanvang van de
      erkenningperiode met begindatum 1 januari 2016, met dien verstande dat:

      a. een omroepvereniging die op dat moment was vertegenwoordigd in een samenwerkingsomroep voor de indeling niet
      afzonderlijk in aanmerking wordt genomen; en

      b. met een samenwerkingsomroep gelijk wordt gesteld een omroepvereniging die op 1 januari 2016 was gevormd uit
      twee of meer omroepverenigingen die afzonderlijk een erkenning hadden bij aanvang van de daaraan voorafgaande
      erkenningperiode.

      4 Voor indeling bij het tweede lid, onder c, geldt ook een voorlopige erkenning als bedoeld in
      [artikel 2.23, tweede lid][ref6], in een erkenningperiode later dan die, bedoeld in het derde lid, maar eerder dan
      de erkenningperiode waarin het jaar valt waarop op de budgetverdeling betrekking heeft.

      5 De bedragen die worden toegerekend aan de organisaties, bedoeld in het tweede lid, onder respectievelijk a, b en
      c, verhouden zich tot elkaar als 3: 2: 1.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.149
