  - number: 4.1a
    text: |-
      1 Audiovisueel media-aanbod dat schade kan toebrengen aan de lichamelijke, geestelijke of morele ontwikkeling van
      personen jonger dan zestien jaar wordt door de instelling die verantwoordelijk is voor de inhoud van het aanbod
      zodanig beschikbaar gesteld dat personen jonger dan zestien jaar deze normaliter niet te horen of te zien krijgen.

      2 De meest schadelijke inhoud als nodeloos geweld en pornografie wordt door de instelling die verantwoordelijk is
      voor de inhoud van het aanbod ontoegankelijk gemaakt voor personen jonger dan zestien jaar.

      3 Voor zover het televisieprogramma-aanbod betreft dat niet als meest schadelijke inhoud kan worden gekwalificeerd,
      worden de maatregelen die volgen uit de regelingen als bedoeld in [artikel 4.2, tweede lid][ref1], beschouwd als
      maatregelen als bedoeld in het eerste lid.

      4 De op grond van dit artikel door media-instellingen verzamelde of anderszins gegenereerde persoonsgegevens van
      minderjarigen worden niet verwerkt voor commerciële doeleinden.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel4.2
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel4.1a
