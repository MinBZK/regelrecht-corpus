        bwb_id: BWBR0025028
        artikel: 2.24a
        hoofdstuk: '2'
        afdeling: 2.2.2
  - number: '2.24'
    text: |-
      1 Een omroepvereniging is een vereniging die:

      a. rechtspersoon naar Nederlands recht met volledige rechtsbevoegdheid is;

      b. zich volgens de statuten uitsluitend of hoofdzakelijk ten doel stelt ter uitvoering van de publieke
      mediaopdracht op landelijk niveau media-aanbod te verzorgen en alle activiteiten te verrichten die nodig zijn om
      daarmee een publieke taak van algemeen nut te vervullen;

      c. zich volgens de statuten ten doel stelt in het media-aanbod een bepaalde, in de statuten aangeduide
      maatschappelijke, culturele, godsdienstige of geestelijke stroming te vertegenwoordigen en zich in het media-aanbod
      te richten op de bevrediging van in de samenleving levende maatschappelijke, culturele of godsdienstige dan wel
      geestelijke behoeften;

      d. haar leden op democratisch aanvaardbare wijze invloed geeft op het beleid; en

      e. een jaarlijkse contributie heft van ten minste € 8,50, waarin de verstrekking van een programmablad niet is
      begrepen.

      2 Het in het eerste lid, onderdeel e, genoemde bedrag kan bij algemene maatregel van bestuur naar aanleiding van de
      door het Centraal Bureau voor de Statistiek vastgestelde consumentenprijsindex worden aangepast.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.24
  - number: 2.24a
    text: |-
      1 Een samenwerkingsomroep is een vereniging of stichting waarin twee of meer omroepverenigingen vertegenwoordigd
      zijn, die gericht is op het voeren van een landelijke publieke media-instelling en die:

      a. rechtspersoon naar Nederlands recht met volledige rechtsbevoegdheid is;

      b. zich volgens de statuten uitsluitend of hoofdzakelijk ten doel stelt ter uitvoering van de publieke
      mediaopdracht op landelijk niveau media-aanbod te verzorgen en alle activiteiten te verrichten die nodig zijn om
      daarmee een publieke taak van algemeen nut te vervullen;

      c. zich volgens de statuten ten doel stelt in het media-aanbod bepaalde, in de statuten aangeduide
      maatschappelijke, culturele, godsdienstige of geestelijke stromingen te vertegenwoordigen, overeenkomstig
      de statuten van de omroepverenigingen die hij vertegenwoordigt, en zich in het media-aanbod te richten op de
      bevrediging van in de samenleving levende maatschappelijke, culturele of godsdienstige dan wel geestelijke
      behoeften;

      d. als de samenwerkingsomroep een vereniging is, zijn leden op democratisch aanvaardbare wijze invloed geeft op het
      beleid; en

      e. ervoor zorg draagt dat de omroepverenigingen die hij vertegenwoordigt, een jaarlijkse contributie heffen van ten
      minste € 8,50, waarin de verstrekking van een programmablad niet is begrepen.

      2 Het in het eerste lid, onderdeel e, genoemde bedrag kan bij algemene maatregel van bestuur naar aanleiding van de
      door het Centraal Bureau voor de Statistiek vastgestelde consumentenprijsindex worden aangepast.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel2.24a
  - number: '2.25'
    text: |-
      1 Voor een erkenning komt slechts in aanmerking een omroeporganisatie:

      a. 1°. die in de voorafgaande erkenningperiode een erkenning had;

      2°. die is gevormd uit omroepverenigingen die in de voorafgaande periode een erkenning hadden;

      3°. die is gevormd uit alle omroepverenigingen die waren vertegenwoordigd in een samenwerkingsomroep die in de
      voorafgaande periode een erkenning had; of

      4°. die is gevormd uit omroepverenigingen als bedoeld onder 2° en 3°;

      b. 1°. die voor zover het een omroepvereniging betreft, ten minste 100.000 leden heeft; of

      2°. waarvan voor zover het een samenwerkingsomroep betreft, de omroepverenigingen die hij vertegenwoordigt, samen
      ten minste 100.000 leden hebben en afzonderlijk niet minder dan 50.000 leden;

      c. die op 31 december van het jaar voorafgaand aan dat waarin die erkenning ingaat, een reserve als bedoeld
      in [artikel 2.174a, eerste lid][ref1], heeft waarvan het saldo nihil of positief is en voor zover het een
      samenwerkingsomroep betreft, ook elke omroepvereniging die hij vertegenwoordigt, op die datum een reserve als
      bedoeld in artikel 2.174a, tweede lid, heeft waarvan het saldo nihil of positief is; en

      d. die de beschikbaarheid van het media-aanbod op de aanbodkanalen, bedoeld in [artikel 2.55, derde lid][ref2],
      heeft zeker gesteld en voldoet aan de [artikelen 2.142a][ref3] en [2.178, eerste, tweede en derde lid][ref4].

      2 De hoogte van het saldo, bedoeld in het eerste lid, wordt aangetoond door overlegging van de jaarrekening,
      bedoeld in [artikel 2.171, tweede lid][ref5], die vergezeld gaat van een verklaring van een accountant als bedoeld
      in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref6].

      3 In afwijking van het eerste lid, onderdeel a, kan ook in aanmerking komen voor een erkenning een
      samenwerkingsomroep waarin zijn vertegenwoordigd:

      a. een of meer omroepverenigingen als bedoeld in het eerste lid, onderdeel a; en

      b. een of meer omroepverenigingen die in de voorafgaande erkenningperiode een voorlopige erkenning hadden, waarbij
      voor elk van deze omroepverenigingen geldt dat:

      1°. die omroepvereniging ten minste 50.000 leden heeft; en

      2°. van die omroepvereniging niet tijdens de periode van de voorlopige erkenning onvoldoende is gebleken dat het
      media-aanbod voldoet aan de eisen, bedoeld in [artikel 2.26, eerste lid, onderdeel d][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.174a
