  - number: '6.16'
    text: |-
      1 Bij ministeriële regeling kan worden bepaald dat een pakketaanbieder voorziet in de instelling van een
      geschillencommissie voor de behandeling van klachten van abonnees over de samenstelling van het digitale
      standaardprogrammapakket.

      2 Als het eerste lid toepassing heeft gevonden, kunnen twee of meer pakketaanbieders besluiten gezamenlijk een
      geschillencommissie als bedoeld in het eerste lid in te stellen.

      3 Als het eerste lid toepassing heeft gevonden, worden bij ministeriële regeling tevens voorschriften gegeven over
      de wijze van behandeling van de klachten, de samenstelling van de geschillencommissie en over de gevolgen van de
      beslissing van de geschillencommissie in geval van gegrondheid van een klacht.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel6.16
  - number: '6.23'
    text: |-
      1 Onze Minister, in overeenstemming met Onze Minister van Economische Zaken, wijst de frequentieruimte in
      de FM-band aan die wordt gebruikt voor het verspreiden van radioprogramma-aanbod dat overwegend bestaat uit
      Nederlandstalige muziek. Bij ministeriële regeling wordt nader omschreven in welke gevallen radioprogramma-aanbod
      aan deze eis voldoet.

      2 Onze Minister, in overeenstemming met Onze Minister van Economische Zaken, wijst andere frequentieruimte in de
      FM-band aan die slechts mag worden gebruikt voor het verspreiden van bij die aanwijzing vast te stellen categorieën
      radioprogramma-aanbod dat, gelet op de aard, inhoud of doelgroep, verhoudingsgewijs lage inkomsten uit reclame of
      verhoudingsgewijs hoge kosten meebrengt.

      3 Als aard en omvang van de frequentieruimte in de FM-band die beschikbaar is voor het verspreiden van
      radioprogramma-aanbod daartoe aanleiding geven, kan Onze Minister, in overeenstemming met Onze Minister van
      Economische Zaken, afzien van het aanwijzen van frequentieruimte in de FM-band op grond van het eerste en tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel6.23
  - number: '6.25'
    text: |-
      [Artikel 6.23][ref1] is niet van toepassing op:

      a. de frequentieruimte die wordt gebruikt voor de verspreiding van programma-aanbod van de publieke mediadiensten;
      en

      b. frequentieruimte die wordt gebruikt ten behoeve van verspreiding via een satelliet.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel6.23
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel6.25
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '6.23'
        hoofdstuk: '6'
        afdeling: 6.3.2
  - number: 6.25a
    text: |-
      1 Het media-aanbod van een publieke of commerciële media-instelling wordt ongewijzigd verspreid, tenzij de
      betreffende publieke of commerciële media-instelling toestemming heeft gegeven voor een gewijzigde vorm van
      verspreiding.

      2 Gewijzigde verspreiding van audiovisueel media-aanbod door de toevoeging van een overlay is mogelijk indien:

      a. de ontvanger van de dienst daartoe voor privégebruik het initiatief heeft genomen of toestemming heeft gegeven;

      b. het besturingselementen van gebruikersinterfaces of waarschuwingen, informatie van algemeen belang of
      ondertiteling betreft;

      c. in geval van commerciële doeleinden: door de publieke of commerciële media-instelling uitdrukkelijk toestemming
      is gegeven; of

      d. het commerciële communicatie betreft die door de publieke of commerciële media-instelling van de mediadienst
      wordt aangeboden.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel6.25a
  - number: '6.26'
    text: |-
      1 Bij algemene maatregel van bestuur worden, op voordracht van Onze Minister-President, Minister van Algemene
      Zaken, na overleg met Onze Minister, regels gesteld op grond waarvan in geval van buitengewone omstandigheden
      het gebruik van programmakanalen van de publieke mediadiensten, studio’s en andere faciliteiten, omroepzenders,
      omroepnetwerken en andere hulpmiddelen ter beschikking worden gesteld aan de bij of krachtens die algemene
      maatregel van bestuur aangewezen autoriteiten.

      2 Onze Minister-President, Minister van Algemene Zaken, is bevoegd in de algemene noodtoestand, na overleg met Onze
      Minister, regels te stellen ten aanzien van de inhoud van radio- en televisieprogramma’s en het toezicht daarop,
      waarbij kan worden afgeweken van het bepaalde in [artikel 7.11][ref1].

      3 De in het tweede lid bedoelde bevoegdheid wordt onverwijld beëindigd zodra
      [artikel 31, eerste lid, van de Oorlogswet voor Nederland][ref2] in werking wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel7.11
      [ref2]: https://wetten.overheid.nl/BWBR0007983#Artikel31
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel6.26
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '7.11'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0007983
        artikel: '31'
  - number: '6.27'
    text: |-
      In geval van rampen of crises als bedoeld in [artikel 1 van de Wet veiligheidsregio’s][ref1],
      bieden mediadiensten het audiovisuele media-aanbod bestaande uit informatie bedoeld in
      [artikel 46, tweede lid, van de wet veiligheidsregio’s][ref2], in samenwerking met het bestuur van de
      veiligheidsregio’s zoveel mogelijk op een voor personen met een auditieve of visuele beperking toegankelijke wijze
      aan.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0027466#Artikel46
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel6.27
    references:
