  - number: '7.14'
    text: |-
      Bij overtreding van het bepaalde bij of krachtens deze wet of
      [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1] kan het Commissariaat, naast of in plaats van
      het opleggen van een bestuurlijke boete en een last onder dwangsom:

      a. de in de artikelen [6.1][ref2] en [6.5][ref3] bedoelde uren van de desbetreffende instelling verminderen of
      intrekken; en

      b. de uren intrekken of verminderen die de Ster op grond van [artikel 2.95][ref4] op de programmakanalen van de
      landelijke publieke mediadienst ter beschikking heeft.


