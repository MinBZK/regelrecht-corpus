  - number: 2.152a
    text: |-
      1 De raad van bestuur verdeelt het budget, bedoeld in [artikel 2.149, eerste lid, aanhef en onder b][ref1], over
      de omroepverenigingen met een voorlopige erkenning, bedoeld in [artikel 2.23, tweede lid][ref2], zodanig dat elke
      omroepvereniging met een voorlopige erkenning over een bedrag beschikt dat gelijk is aan vijftien procent van het
      bedrag voor een omroeporganisatie die met toepassing van [artikel 2.152, derde lid][ref3], wordt ingedeeld als
      omroepvereniging als bedoeld in [artikel 2.24][ref4].

      2 De NTR en de omroeporganisaties, bedoeld in [artikel 2.26, eerste lid, onderdeel f][ref5], ontvangen de
      bedragen, bedoeld in het eerste lid en [artikel 2.150, derde lid][ref6], van elk van de omroepverenigingen die een
      voorlopige erkenning hebben verkregen, ten beheer.

      3 De landelijke publieke media-instellingen, bedoeld in
      [artikel 2.149, eerste lid, onderdelen a tot en met d][ref7], besteden de ontvangen bedragen en de budgetten aan
      de in de desbetreffende onderdelen genoemde doelen.


