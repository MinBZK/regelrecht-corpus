  - number: '2.10'
    text: |-
      1 De raad van bestuur bestuurt de NPO.

      2 Naast de andere taken en bevoegdheden die de raad van bestuur heeft op grond van deze wet, is hij belast met:

      a. de dagelijkse leiding over de werkzaamheden van de NPO;

      b. de dagelijkse coördinatie en samenhangende ordening van het media-aanbod op en tussen de diverse aanbodkanalen
      van de landelijke publieke mediadienst;

      c. het vaststellen van regelingen die nodig zijn voor de uitvoering van de taken van de NPO, waaronder in ieder
      geval een regeling voor de coördinatie en ordening van het media-aanbod op de aanbodkanalen van de landelijke
      publieke mediadienst;

      d. het vaststellen van de profielen van de aanbodkanalen van de landelijke publieke mediadienst, inhoudende de
      uitgangspunten voor een herkenbaar media-aanbod op die kanalen;

      e. het vaststellen van het concessiebeleidsplan;

      f. het aangaan van de prestatieovereenkomst, bedoeld in [artikel 2.22][ref1];

      g. het vaststellen van de begroting, bedoeld in [artikel 2.147][ref2];

      h. het vaststellen van het bestuursverslag, bedoeld in [artikel 2.17][ref3]; en

      i. het organiseren van representatieve publieksvertegenwoordiging, waaronder een representatieve maatschappelijke
      adviesraad, ter bevordering van de publieksbetrokkenheid bij de invulling van het media-aanbod van de landelijke
      publieke mediadienst.

      3 De raad van bestuur is verder belast met datgene wat niet uitdrukkelijk tot de taken of bevoegdheden van de raad
      van toezicht behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.22
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.147
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel2.17
