  - number: '2.58'
    text: |-
      1 De NPO stuurt jaarlijks vóór 1 juni aan het Commissariaat en Onze Minister een verslag over het afgelopen
      kalenderjaar met daarin in elk geval:

      a. een beschrijving van de wijze waarop door de NPO en de landelijke publieke media-instellingen op de
      verschillende aanbodkanalen uitvoering is gegeven aan de publieke mediaopdracht;

      b. de samenstelling van het media-aanbod van de publieke mediadienst op de programmakanalen en voor zover mogelijk
      op de overige aanbodkanalen, waaronder de uren die besteed zijn aan media-aanbod op de terreinen genoemd in
      [artikel 2.1, eerste lid][ref1];

      c. een rapportage over de realisering van de doelstellingen van de prestatieovereenkomst, bedoeld in
      [artikel 2.22][ref2], en een verantwoording over de doelmatigheid en doeltreffendheid van die realisering;

      d. de naleving van de [artikelen 2.115 tot en met 2.123][ref3];

      e. de naleving van de gedragscode, bedoeld in [artikel 2.3, tweede lid][ref4]; en

      f. de maatregelen die de NPO treft om de toegankelijkheid van het audiovisueel media-aanbod voor personen met een
      handicap verder te ontwikkelen.

      2 Het Commissariaat brengt uiterlijk 19 december 2022 en vervolgens om de drie jaar verslag uit aan de Europese
      Commissie over de uitvoering van het eerste lid, onderdeel f.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.22
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel2.115
      [ref4]: https://wetten.overheid.nl/BWBR0025028#Artikel2.3
