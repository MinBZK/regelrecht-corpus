  - number: 2.60m1
    text: |-
      1 [Artikel 2.60m, derde lid][ref1], is niet van toepassing, als bij wijze van experiment van beperkte omvang of
      duur media-aanbod via andere aanbodkanalen dan die, bedoeld in [artikel 2.60l, tweede lid, onder b en c][ref2],
      wordt aangeboden. Een experiment dient om te onderzoeken of deze aanbodkanalen een bijdrage kunnen leveren aan de
      verwezenlijking van de publieke mediaopdracht op regionaal niveau.

      2 Bij algemene maatregel van bestuur wordt bepaald wanneer sprake is van beperkte omvang of duur en kunnen nadere
      regels worden gesteld over het uitvoeren van experimenten.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.60m
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.60l
