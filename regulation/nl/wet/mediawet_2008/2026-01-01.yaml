  - number: '3.30'
    text: |-
      1 Een commerciële media-instelling is aan het Commissariaat jaarlijks kosten verbonden aan het toezicht
      verschuldigd voor elke verkregen toestemming en voor elke van haar mediadiensten op aanvraag.

      2 Bij ministeriële regeling worden regels gesteld over de vaststelling van de toezichtskosten, bedoeld in het
      eerste lid, waarbij in elk geval:

      a. onderscheid kan worden gemaakt tussen omroepdiensten en mediadiensten op aanvraag;

      b. onderscheid kan worden gemaakt tussen toestemmingen voor radio-omroep en voor televisieomroep; en

      c. rekening kan worden gehouden met de gemiddelde duur van de uitzendingen en met het aantal huishoudens in
      Nederland, dat het programma-aanbod kan ontvangen.

      3 Het Commissariaat kan de verschuldigde toezichtskosten invorderen bij dwangbevel.
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel3.30
  - number: 3a.1
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

        - *aanbieder van een videoplatform:* de natuurlijke persoon of rechtspersoon die een videoplatformdienst aanbiedt;
        - *audiovisuele commerciële communicatie:* beelden, al dan niet met geluid, die dienen om direct of indirect de
      goederen, de diensten of het imago van een natuurlijke of rechtspersoon die een economische activiteit verricht,
      te promoten en deel uitmaken van audiovisueel media-aanbod of van een door gebruikers gegenereerde video, tegen
      betaling of een soortgelijke vergoeding of ten behoeve van zelfpromotie;
        - *door gebruiker gegenereerde video:* een reeks bewegende beelden, al dan niet met geluid, die ongeacht de duur
      ervan een afzonderlijk element vormt, die door een gebruiker is gecreëerd en door die gebruiker of een andere
      gebruiker naar een videoplatform is geüpload;
        - *gedragscode:* gedragscode voor een of meer videoplatformen, gericht op de gebruikers van een
      videoplatformdienst, waarin in ieder geval regels als bedoeld in [artikel 3a.3][ref1] zijn opgenomen.
        - *productplaatsing:* het tegen betaling of soortgelijke vergoeding opnemen van of het verwijzen naar een product,
      dienst of (beeld)merk binnen het kader van een programma, met een programma overeenkomend onderdeel van het media-
      aanbod, of door een gebruiker gegenereerde video;
        - *sponsoring:* het verstrekken van financiële of andere bijdragen door een onderneming of een natuurlijke
      persoon die zich gewoonlijk niet bezighoudt met de verzorging van mediadiensten of videoplatformdiensten, of met
      de vervaardiging van audiovisuele werken, ten behoeve van de totstandkoming of aankoop van media-aanbod of door
      gebruikers gegenereerde video’s, teneinde de verspreiding daarvan naar het algemene publiek of een deel daarvan te
      bevorderen of mogelijk te maken;
        - *videoplatformdienst:* dienst of een losstaand gedeelte daarvan, a. waarvan het hoofddoel of een essentiële
      functie bestaat uit het aan het algemene publiek aanbieden van audiovisueel media-aanbod of door gebruikers
      gegenereerde video’s ter informatie, vermaak of educatie; b. waarvoor de aanbieder van het videoplatform geen
      redactionele verantwoordelijkheid draagt; c. waarvan de organisatie met automatische middelen of algoritmen wordt
      bepaald door de aanbieder van het videoplatform; en d. die wordt aangeboden door middel van openbare elektronische
      communicatienetwerken als bedoeld in [artikel 1.1 van de Telecommunicatiewet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3a.3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel3a.1
