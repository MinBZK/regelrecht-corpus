  - number: '2.157'
    text: |-
      1 De landelijke publieke media-instellingen ontvangen voorschotten volgens bij ministeriële regeling te stellen
      regels. De NTR en de omroeporganisaties, bedoeld in [artikel 2.26, eerste lid, onderdeel f][ref1], ontvangen
      tevens de bedragen ten beheer die zijn gemoeid met de bevoorschotting van de omroepverenigingen die een voorlopige
      erkenning als bedoeld in [artikel 2.23, tweede lid][ref2], hebben verkregen.

      2 Als een instelling zijn jaarrekening, bedoeld in [artikel 2.171, tweede lid][ref3], niet tijdig indient:

      a. verzoekt het Commissariaat de raad van bestuur de bevoorschotting met twintig procent te verminderen; en

      b. kan het Commissariaat de raad van bestuur verzoeken de bevoorschotting verder te verminderen of te beëindigen
      wanneer ondanks herhaalde aanmaningen van het Commissariaat de instelling in gebreke blijft met het indienen van
      de jaarrekening.

      3 Als een instelling haar gelden in strijd met het bepaalde bij of krachtens deze wet uitgeeft, kan het
      Commissariaat de raad van bestuur verzoeken de bevoorschotting te verminderen of te beëindigen.

      4 De raad van bestuur voldoet meteen aan verzoeken als bedoeld in het tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.26
