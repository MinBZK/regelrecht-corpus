  - number: 2.21a
    text: |-
      1 [Artikel 2.21, derde lid][ref1], is niet van toepassing, als bij wijze van experiment van beperkte omvang of
      duur media-aanbod via andere aanbodkanalen dan die, bedoeld in [artikel 2.20, tweede lid, onderdelen b en c][ref2],
      wordt aangeboden. Een experiment dient om te onderzoeken of deze aanbodkanalen een bijdrage kunnen leveren aan de
      verwezenlijking van de publieke mediaopdracht op landelijk niveau.

      2 Bij algemene maatregel van bestuur wordt bepaald wanneer sprake is van beperkte omvang of duur en kunnen nadere
      regels worden gesteld over het uitvoeren van experimenten.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.21
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.20
