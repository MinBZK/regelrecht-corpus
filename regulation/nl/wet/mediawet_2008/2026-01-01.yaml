  - number: 9.14e
    text: |-
      1 In afwijking van [artikel 2.95, eerste lid, aanhef en onder a][ref1], bedraagt het aandeel reclame- en
      telewinkelboodschappen per televisieprogrammakanaal van de landelijke publieke mediadienst niet meer dan een bij of
      krachtens algemene maatregel van bestuur vast te stellen percentage van de totale duur van het programma-aanbod op
      dat kanaal per jaar, welk percentage niet meer bedraagt dan tien.

      2 De voordracht voor een op grond van het eerste lid vast te stellen algemene maatregel van bestuur wordt niet
      eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.

      3 Dit artikel is van toepassing voor de jaren 2022 tot en met 2025.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.95
    url: https://wetten.overheid.nl/BWBR0025028/2026-01-01#Artikel9.14e
