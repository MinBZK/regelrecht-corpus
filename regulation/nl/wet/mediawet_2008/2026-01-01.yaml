  - number: 7:22
    text: |-
      1 Het Commissariaat houdt een lijst bij met publieke en commerciële media-instellingen die op grond van
      [artikel 1.2, eerste lid][ref1], onder de bevoegdheid van Nederland vallen, met de vermelding op welk criterium
      als bedoeld in artikel 2, tweede tot en met vijfde lid, van de Europese richtlijn de rechtsmacht van de betreffende
      aanbieder is gebaseerd.

      2 Het Commissariaat houdt een lijst bij met de aanbieders van videoplatformen die op grond van
      [artikel 3a.2, eerste lid][ref2], onder de bevoegdheid van Nederland vallen, met de vermelding op welk criterium
      als bedoeld in artikel 28bis, eerste tot en met vierde lid, van de Europese richtlijn de rechtsmacht van de
      betreffende aanbieder is gebaseerd.


