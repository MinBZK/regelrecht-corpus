  - number: 9.14h
    text: |-
      1 Onze Minister van Onderwijs, Cultuur en Wetenschap zendt binnen drie jaar na de inwerkingtreding van de
      [artikelen 3.29e tot en met 3.29i][ref1] aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten
      van die bepalingen in de praktijk.

      2 Onze Minister doet voorts jaarlijks verslag aan de Staten-Generaal over de door media-instellingen in het
      daaraan voorafgaande boekjaar gedane investeringen in Nederlands cultureel audiovisueel product, zijnde een
      documentairefilm, documentaireserie, dramaserie of speelfilm, en vermeldt daarbij tevens welke investeringen zijn
      aangewend ten behoeve van onafhankelijke producties als bedoeld in [artikel 3.22, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3.29e
