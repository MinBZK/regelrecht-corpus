  - number: '2.31'
    text: |-
      1 Voordat Onze Minister besluit over het verlenen van een erkenning of voorlopige erkenning vraagt hij de Raad voor
      cultuur, het Commissariaat en de NPO binnen een door hem te stellen termijn te adviseren over een aanvraag.

      2 Het uitblijven van een advies staat aan het nemen van een besluit over het verlenen van een erkenning of
      voorlopige erkenning niet in de weg.

      3 Als een aanvraag is ingediend door een omroepvereniging als bedoeld in
      [artikel 2.25, derde lid, onderdeel b][ref1], bevat het advies een concreet voorstel voor het samengaan van
      deze aanvrager met een of meer andere aanvragers, gericht op de totstandkoming van een samenwerkingsomroep. De
      mate waarin aanvragers kunnen bijdragen aan de uitvoering van de publieke mediaopdracht op landelijk niveau met
      inachtneming van hun in het media-aanbod te weerspiegelen identiteit, is bepalend voor de inhoud van het voorstel.

      4 Als het advies een voorstel als bedoeld in het derde lid bevat, stelt Onze Minister na overweging van het advies,
      de betreffende aanvragers in de gelegenheid als samenwerkingsomroep gezamenlijk een nieuwe aanvraag in te dienen.
      [Artikel 2.30][ref2] en het eerste lid zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2.25
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel2.30
