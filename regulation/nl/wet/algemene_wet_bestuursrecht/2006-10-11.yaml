  - number: 7:15.1
    text: Voor de behandeling van het bezwaar is geen recht verschuldigd.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel715
  - number: 7:15.2
    text: |-
      De kosten, die de belanghebbende in verband met de behandeling van het bezwaar redelijkerwijs heeft
      moeten maken, worden door het bestuursorgaan uitsluitend vergoed op verzoek van de belanghebbende
      voorzover het bestreden besluit wordt herroepen wegens aan het bestuursorgaan te wijten onrechtmatigheid.
      [Art. 243, tweede lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel243
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel715
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '243'
  - number: 7:15.3
    text: |-
      Het verzoek wordt gedaan voordat het bestuursorgaan op het bezwaar heeft beslist. Het bestuursorgaan beslist op het
      verzoek bij de beslissing op het bezwaar.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel715
  - number: 7:15.4
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld over de kosten waarop de vergoeding uitsluitend
      betrekking kan hebben en over de wijze waarop het bedrag van de kosten wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel715
  - number: 7:16.1
    text: Voordat een beroepsorgaan op het beroep beslist, stelt het belanghebbenden in de gelegenheid te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel716
  - number: 7:16.2
    text: |-
      Het beroepsorgaan stelt daarvan in ieder geval de indiener van het beroepschrift op de hoogte, alsmede het
      bestuursorgaan dat het besluit heeft genomen en de belanghebbenden die bij de voorbereiding van het besluit of bij
      de behandeling van het bezwaarschrift hun zienswijze naar voren hebben gebracht.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel716
  - number: 7:17
    text: 'Van het horen van belanghebbenden kan worden afgezien indien:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel717
  - number: 7:17.a
    text: het beroep kennelijk niet-ontvankelijk is,
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel717
  - number: 7:17.b
    text: het beroep kennelijk ongegrond is, of
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel717
  - number: 7:17.c
    text: de belanghebbenden hebben verklaard geen gebruik te willen maken van het recht te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel717
  - number: 7:18.1
    text: Tot tien dagen voor het horen kunnen belanghebbenden nadere stukken indienen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel718
  - number: 7:18.2
    text: |-
      Het beroepsorgaan legt het beroepschrift en alle verder op de zaak betrekking hebbende stukken voorafgaand aan het
      horen gedurende ten minste een week voor belanghebbenden ter inzage.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel718
  - number: 7:18.3
    text: |-
      Bij de oproeping voor het horen worden belanghebbenden gewezen op het eerste lid en wordt vermeld waar en wanneer
      de stukken ter inzage zullen liggen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel718
  - number: 7:18.4
    text: Belanghebbenden kunnen van deze stukken tegen vergoeding van ten hoogste de kosten afschriften verkrijgen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel718
  - number: 7:18.5
    text: Voor zover de belanghebbenden daarmee instemmen, kan toepassing van het tweede lid achterwege worden gelaten.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel718
  - number: 7:18.6
    text: |-
      Het beroepsorgaan kan, al dan niet op verzoek van een belanghebbende, toepassing van het tweede lid voorts
      achterwege laten, voor zover geheimhouding om gewichtige redenen is geboden. Van de toepassing van deze bepaling
      wordt mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel718
  - number: 7:18.7
    text: |-
      Gewichtige redenen zijn in ieder geval niet aanwezig, voor zover ingevolge de [Wet openbaarheid van bestuur][ref1]
      de verplichting bestaat een verzoek om informatie, vervat in deze stukken, in te willigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel718
    references:
      - id: ref1
        bwb_id: BWBR0005252
  - number: 7:18.8
    text: |-
      Indien een gewichtige reden is gelegen in de vrees voor schade aan de lichamelijke of geestelijke gezondheid van
      een belanghebbende, kan inzage van de desbetreffende stukken worden voorbehouden aan een gemachtigde die hetzij
      advocaat hetzij arts is.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel718
  - number: 7:19.1
    text: Het horen geschiedt door het beroepsorgaan.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel719
  - number: 7:19.2
    text: |-
      Bij of krachtens de wet kan het horen worden opgedragen aan een adviescommissie waarin een of meer leden zitting
      hebben die geen deel uitmaken van en niet werkzaam zijn onder verantwoordelijkheid van het beroepsorgaan.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel719
  - number: 7:19.3
    text: |-
      Het horen geschiedt in het openbaar, tenzij het beroepsorgaan op verzoek van een belanghebbende of om gewichtige
      redenen ambtshalve anders beslist.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel719
  - number: 7:20.1
    text: Belanghebbenden worden in elkaars aanwezigheid gehoord.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel720
  - number: 7:20.2
    text: |-
      Ambtshalve of op verzoek kunnen belanghebbenden afzonderlijk worden gehoord, indien aannemelijk is dat gezamenlijk
      horen een zorgvuldige behandeling zal belemmeren of dat tijdens het horen feiten of omstandigheden bekend zullen
      worden waarvan geheimhouding om gewichtige redenen is geboden.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel720
  - number: 7:20.3
    text: |-
      Wanneer belanghebbenden afzonderlijk zijn gehoord, wordt ieder van hen op de hoogte gesteld van het verhandelde
      tijdens het horen buiten zijn aanwezigheid.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel720
  - number: 7:20.4
    text: |-
      Het beroepsorgaan kan, al dan niet op verzoek van een belanghebbende, toepassing van het
      derde lid achterwege laten, voor zover geheimhouding om gewichtige redenen is geboden.
      [Artikel 7:18, zesde lid, tweede volzin, zevende en achtste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel720
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.3'
  - number: 7:21
    text: Van het horen wordt een verslag gemaakt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel721
  - number: 7:22
    text: Op verzoek van de belanghebbende kunnen door hem meegebrachte getuigen en deskundigen worden gehoord.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel722
  - number: 7:23
    text: |-
      Wanneer na het horen aan het beroepsorgaan feiten of omstandigheden bekend worden die voor de op het beroep te
      nemen beslissing van aanmerkelijk belang kunnen zijn, wordt dit aan belanghebbenden meegedeeld en worden zij in de
      gelegenheid gesteld daarover te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel723
  - number: 7:24.1
    text: Het beroepsorgaan beslist binnen zestien weken na ontvangst van het beroepschrift.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel724
  - number: 7:24.2
    text: |-
      Indien het beroepsorgaan evenwel behoort tot dezelfde rechtspersoon als het bestuursorgaan tegen welks
      besluit het beroep is gericht, beslist het binnen zes weken of, indien een commissie als bedoeld in
      [artikel 7:19, tweede lid][ref1], is ingesteld, binnen tien weken na ontvangst van het beroepschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel724
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.3'
  - number: 7:24.3
    text: |-
      De termijn wordt opgeschort met ingang van de dag waarop de indiener is verzocht een verzuim als bedoeld in
      [artikel 6:6][ref1] te herstellen, tot de dag waarop het verzuim is hersteld of de daarvoor gestelde termijn
      ongebruikt is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel724
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
  - number: 7:24.4
    text: Het beroepsorgaan kan de beslissing voor ten hoogste acht weken verdagen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel724
  - number: 7:24.5
    text: |-
      In het geval, bedoeld in het tweede lid, kan het beroepsorgaan de beslissing echter voor ten hoogste vier weken
      verdagen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel724
  - number: 7:24.6
    text: Van de verdaging wordt schriftelijk mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel724
  - number: 7:24.7
    text: |-
      Verder uitstel is mogelijk voor zover de indiener daarmee instemt en andere belanghebbenden daardoor niet in hun
      belangen kunnen worden geschaad of ermee instemmen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel724
  - number: 7:25
    text: |-
      Voor zover het beroepsorgaan het beroep ontvankelijk en gegrond acht, vernietigt het het bestreden besluit en neemt
      het voor zover nodig in de plaats daarvan een nieuw besluit.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel725
  - number: 7:26.1
    text: |-
      De beslissing op het beroep dient te berusten op een deugdelijke motivering, die bij de bekendmaking van de
      beslissing wordt vermeld. Daarbij wordt, indien ingevolge [artikel 7:17][ref1] van het horen is afgezien, tevens
      aangegeven op welke grond dat is geschied.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel726
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.3'
  - number: 7:26.2
    text: |-
      Indien de beslissing afwijkt van het advies van een commissie als bedoeld in [artikel 7:19, tweede lid][ref1],
      worden in de beslissing de redenen voor die afwijking vermeld en wordt het advies met de beslissing meegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel726
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.3'
  - number: 7:26.3
    text: |-
      De beslissing wordt bekendgemaakt door toezending of uitreiking aan degenen tot wie zij is gericht. Betreft het
      een besluit dat niet tot een of meer belanghebbenden was gericht, dan wordt de beslissing bekendgemaakt op dezelfde
      wijze als waarop dat besluit bekendgemaakt is.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel726
  - number: 7:26.4
    text: |-
      Zo spoedig mogelijk na de bekendmaking van de beslissing wordt hiervan mededeling gedaan aan het bestuursorgaan
      tegen welks besluit het beroep was gericht, aan degenen tot wie het bestreden besluit was gericht en aan de
      belanghebbenden die in beroep hun zienswijze naar voren hebben gebracht.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel726
  - number: 7:26.5
    text: |-
      Bij de mededeling, bedoeld in het vierde lid, is [artikel 6:23][ref1] van overeenkomstige toepassing en wordt
      met het oog op de aanvang van de beroepstermijn zo duidelijk mogelijk aangegeven wanneer de bekendmaking van de
      beslissing overeenkomstig het derde lid heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel726
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
  - number: 7:27
    text: |-
      [Artikel 3:6, tweede lid][ref1], [afdeling 3.4][ref2], de [artikelen 3:41 tot en met 3:45][ref3],
      [afdeling 3.7][ref4], met uitzondering van [artikel 3:49][ref5], en [hoofdstuk 4][ref6] zijn niet van toepassing op
      besluiten op grond van deze afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel3
