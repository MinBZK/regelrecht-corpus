preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat ingevolge artikel 107, tweede lid, van de Grondwet de wet algemene
    regels van bestuursrecht dient vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#ArtikelAanhef
articles:
  - number: 1:1.1
    text: 'Onder bestuursorgaan wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel11
  - number: 1:1.1.a
    text: een orgaan van een rechtspersoon die krachtens publiekrecht is ingesteld, of
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel11
  - number: 1:1.1.b
    text: een ander persoon of college, met enig openbaar gezag bekleed.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel11
  - number: 1:1.2
    text: 'De volgende organen, personen en colleges worden niet als bestuursorgaan aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel11
  - number: 1:1.2.a
    text: de wetgevende macht;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel11
  - number: 1:1.2.b
    text: de kamers en de verenigde vergadering der Staten-Generaal;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel11
  - number: 1:1.2.c
    text: |-
      onafhankelijke, bij de wet ingestelde organen die met rechtspraak zijn belast, alsmede de Raad voor de rechtspraak
      en het College van afgevaardigden;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel11
  - number: 1:1.2.d
    text: de Raad van State en zijn afdelingen;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel11
  - number: 1:1.2.e
    text: de Algemene Rekenkamer;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel11
  - number: 1:1.2.f
    text: |-
      de Nationale ombudsman en de substituut-ombudsmannen als bedoeld in
      [artikel 9, eerste lid, van de Wet Nationale ombudsman][ref1], en ombudsmannen en ombudscommissies als bedoeld in
      [artikel 9:17, onderdeel b][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '9'
        hoofdstuk: '9'
        afdeling: 9.2.1
  - number: 1:1.2.g
    text: |-
      de voorzitters, leden, griffiers en secretarissen van de in de onderdelen *b* tot en met *f* bedoelde organen, de
      procureur-generaal, de plaatsvervangend procureur-generaal en de advocaten-generaal bij de Hoge Raad, de besturen
      van de in onderdeel c bedoelde organen alsmede de voorzitters van die besturen, alsmede de commissies uit het
      midden van de in de onderdelen *b* tot en met *f* bedoelde organen;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel11
  - number: 1:1.2.h
    text: |-
      de commissie van toezicht betreffende de inlichtingen- en veiligheidsdiensten, bedoeld in
      [artikel 64 van de Wet op de inlichtingen- en veiligheidsdiensten 2002][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel64
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '64'
  - number: 1:1.3
    text: |-
      Een ingevolge het tweede lid uitgezonderd orgaan, persoon of college wordt wel als bestuursorgaan aangemerkt voor
      zover het orgaan, de persoon of het college besluiten neemt of handelingen verricht ten aanzien van een niet voor
      het leven benoemde ambtenaar als bedoeld in [artikel 1 van de Ambtenarenwet][ref1] als zodanig, zijn nagelaten
      betrekkingen of zijn rechtverkrijgenden.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel1
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '1'
  - number: 1:2.1
    text: 'Onder belanghebbende wordt verstaan: degene wiens belang rechtstreeks bij een besluit is betrokken.'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel12
  - number: 1:2.2
    text: Ten aanzien van bestuursorganen worden de hun toevertrouwde belangen als hun belangen beschouwd.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel12
  - number: 1:2.3
    text: |-
      Ten aanzien van rechtspersonen worden als hun belangen mede beschouwd de algemene en collectieve belangen die zij
      krachtens hun doelstellingen en blijkens hun feitelijke werkzaamheden in het bijzonder behartigen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel12
  - number: 1:3.1
    text: |-
      Onder besluit wordt verstaan: een schriftelijke beslissing van een bestuursorgaan, inhoudende een
      publiekrechtelijke rechtshandeling.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel13
  - number: 1:3.2
    text: |-
      Onder beschikking wordt verstaan: een besluit dat niet van algemene strekking is, met inbegrip van de afwijzing van
      een aanvraag daarvan.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel13
  - number: 1:3.3
    text: 'Onder aanvraag wordt verstaan: een verzoek van een belanghebbende, een besluit te nemen.'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel13
  - number: 1:3.4
    text: |-
      Onder beleidsregel wordt verstaan: een bij besluit vastgestelde algemene regel, niet zijnde een algemeen verbindend
      voorschrift, omtrent de afweging van belangen, de vaststelling van feiten of de uitleg van wettelijke voorschriften
      bij het gebruik van een bevoegdheid van een bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel13
  - number: 1:4.1
    text: |-
      Onder administratieve rechter wordt verstaan: een onafhankelijk, bij de wet ingesteld orgaan dat met
      administratieve rechtspraak is belast.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel14
  - number: 1:4.2
    text: |-
      Een tot de rechterlijke macht behorend gerecht wordt als administratieve rechter aangemerkt voor zover
      [hoofdstuk 8][ref1] of de [Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref2] - met uitzondering
      van [hoofdstuk VIII][ref3] - van toepassing of van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0004581
      [ref3]: https://wetten.overheid.nl/BWBR0004581#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0004581
      - id: ref3
        bwb_id: BWBR0004581
        hoofdstuk: VIII
  - number: 1:5.1
    text: |-
      Onder het maken van bezwaar wordt verstaan: het gebruik maken van de ingevolge een wettelijk voorschrift bestaande
      bevoegdheid, voorziening tegen een besluit te vragen bij het bestuursorgaan dat het besluit heeft genomen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel15
  - number: 1:5.2
    text: |-
      Onder het instellen van administratief beroep wordt verstaan: het gebruik maken van de ingevolge een wettelijk
      voorschrift bestaande bevoegdheid, voorziening tegen een besluit te vragen bij een ander bestuursorgaan dan hetwelk
      het besluit heeft genomen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel15
  - number: 1:5.3
    text: |-
      Onder het instellen van beroep wordt verstaan: het instellen van administratief beroep, dan wel van beroep bij een
      administratieve rechter.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel15
  - number: 1:6
    text: |-
      De [hoofdstukken 2 tot en met 8][ref1] en [10][ref2] van deze wet zijn niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005537
        hoofdstuk: '10'
  - number: 1:6.a
    text: de opsporing en vervolging van strafbare feiten, alsmede de tenuitvoerlegging van strafrechtelijke beslissingen;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel16
  - number: 1:6.b
    text: |-
      de tenuitvoerlegging van vrijheidsbenemende maatregelen op grond van de [Vreemdelingenwet 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 1:6.c
    text: |-
      de tenuitvoerlegging van andere vrijheidsbenemende maatregelen in een inrichting die in hoofdzaak bestemd is voor
      de tenuitvoerlegging van strafrechtelijke beslissingen;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel16
  - number: 1:6.d
    text: |-
      besluiten en handelingen ter uitvoering van de [Wet militair tuchtrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004788
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004788
  - number: 1:6.e
    text: |-
      besluiten en handelingen ter uitvoering van de
      [Wet toetsing levensbeëindiging op verzoek en hulp bij zelfdoding][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012410
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0012410
  - number: 1:7.1
    text: |-
      Indien door een bestuursorgaan ingevolge enig wettelijk voorschrift advies moet worden gevraagd of extern overleg
      moet worden gevoerd inzake een besluit alvorens een zodanig besluit kan worden genomen, geldt dat voorschrift
      niet indien het voorgenomen besluit uitsluitend strekt tot uitvoering van een bindend besluit van de Raad
      van de Europese Unie, van het Europees Parlement en de Raad gezamenlijk of van de Commissie van de Europese
      Gemeenschappen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel17
  - number: 1:7.2
    text: Het eerste lid is niet van toepassing op het horen van de Raad van State.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel17
  - number: 1:8.1
    text: |-
      Indien door een bestuursorgaan ingevolge enig wettelijk voorschrift van het ontwerp van een besluit kennis moet
      worden gegeven alvorens een zodanig besluit kan worden genomen, geldt dat voorschrift niet indien het voorgenomen
      besluit uitsluitend strekt tot uitvoering van een bindend besluit van de Raad van de Europese Unie, van het
      Europees Parlement en de Raad gezamenlijk of van de Commissie van de Europese Gemeenschappen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel18
  - number: 1:8.2
    text: |-
      Het eerste lid is niet van toepassing op de overlegging van het ontwerp van een algemene maatregel van bestuur of
      ministeriële regeling aan de Staten-Generaal, indien:
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel18
  - number: 1:8.2.a
    text: |-
      bij de wet is bepaald dat door of namens een der Kamers der Staten-Generaal of door een aantal leden daarvan de
      wens te kennen kan worden gegeven dat het onderwerp of de inwerkingtreding van die algemene maatregel van bestuur
      of ministeriële regeling bij de wet wordt geregeld, of
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel18
  - number: 1:8.2.b
    text: |-
      [artikel 21.6, zesde lid, van de Wet milieubeheer][ref1] of
      [artikel 33 van de Wet verontreiniging oppervlaktewateren][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002682#Artikel33
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0002682
        artikel: '33'
  - number: 1:9
    text: Deze titel is van overeenkomstige toepassing op voorstellen van wet.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel19
  - number: 2:1.1
    text: |-
      Een ieder kan zich ter behartiging van zijn belangen in het verkeer met bestuursorganen laten bijstaan of door een
      gemachtigde laten vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel21
  - number: 2:1.2
    text: Het bestuursorgaan kan van een gemachtigde een schriftelijke machtiging verlangen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel21
  - number: 2:2.1
    text: |-
      Het bestuursorgaan kan bijstand of vertegenwoordiging door een persoon tegen wie ernstige bezwaren bestaan,
      weigeren.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel22
  - number: 2:2.2
    text: |-
      De belanghebbende en de in het eerste lid bedoelde persoon worden van de weigering onverwijld schriftelijk in
      kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel22
  - number: 2:2.3
    text: Het eerste lid is niet van toepassing ten aanzien van advocaten en procureurs.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel22
  - number: 2:3.1
    text: |-
      Het bestuursorgaan zendt geschriften tot behandeling waarvan kennelijk een ander bestuursorgaan bevoegd is,
      onverwijld door naar dat orgaan, onder gelijktijdige mededeling daarvan aan de afzender.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel23
  - number: 2:3.2
    text: |-
      Het bestuursorgaan zendt geschriften die niet voor hem bestemd zijn en die ook niet worden doorgezonden, zo spoedig
      mogelijk terug aan de afzender.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel23
  - number: 2:4.1
    text: Het bestuursorgaan vervult zijn taak zonder vooringenomenheid.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel24
  - number: 2:4.2
    text: |-
      Het bestuursorgaan waakt ertegen dat tot het bestuursorgaan behorende of daarvoor werkzame personen die een
      persoonlijk belang bij een besluit hebben, de besluitvorming beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel24
  - number: 2:5.1
    text: |-
      Een ieder die is betrokken bij de uitvoering van de taak van een bestuursorgaan en daarbij de beschikking krijgt
      over gegevens waarvan hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, en voor wie niet reeds
      uit hoofde van ambt, beroep of wettelijk voorschrift ter zake van die gegevens een geheimhoudingsplicht geldt, is
      verplicht tot geheimhouding van die gegevens, behoudens voor zover enig wettelijk voorschrift hem tot mededeling
      verplicht of uit zijn taak de noodzaak tot mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel25
  - number: 2:5.2
    text: |-
      Het eerste lid is mede van toepassing op instellingen en daartoe behorende of daarvoor werkzame personen die door
      een bestuursorgaan worden betrokken bij de uitvoering van zijn taak, en op instellingen en daartoe behorende of
      daarvoor werkzame personen die een bij of krachtens de wet toegekende taak uitoefenen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel25
  - number: 2:6.1
    text: |-
      Bestuursorganen en onder hun verantwoordelijkheid werkzame personen gebruiken de Nederlandse taal, tenzij bij
      wettelijk voorschrift anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel26
  - number: 2:6.2
    text: |-
      In afwijking van het eerste lid kan een andere taal worden gebruikt indien het gebruik daarvan doelmatiger is en de
      belangen van derden daardoor niet onevenredig worden geschaad.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel26
  - number: 2:7.1
    text: |-
      Een ieder kan de Friese taal gebruiken in het verkeer met bestuursorganen, voor zover deze in de provincie Fryslân
      zijn gevestigd.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel27
  - number: 2:7.2
    text: |-
      Het eerste lid geldt niet, indien het bestuursorgaan heeft verzocht de Nederlandse taal te gebruiken op de grond,
      dat het gebruik van de Friese taal tot een onevenredige belasting van het bestuurlijk verkeer zou leiden.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel27
  - number: 2:8.1
    text: Bestuursorganen kunnen in het mondeling verkeer binnen de provincie Fryslân de Friese taal gebruiken.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel28
  - number: 2:8.2
    text: |-
      Het eerste lid geldt niet, indien de wederpartij heeft verzocht de Nederlandse taal te gebruiken op de grond, dat
      het gebruik van de Friese taal tot een onbevredigend verloop van het mondeling verkeer zou leiden.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel28
  - number: 2:9.1
    text: |-
      In de provincie Fryslân gevestigde bestuursorganen die niet tot de centrale overheid behoren, kunnen regels stellen
      over het gebruik van de Friese taal in schriftelijke stukken.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel29
  - number: 2:9.2
    text: |-
      Onze Minister wie het aangaat kan voor onderdelen van de centrale overheid waarvan het werkterrein zich uitstrekt
      tot de provincie Fryslân of een deel daarvan, regels stellen over het gebruik van de Friese taal in schriftelijke
      stukken.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel29
  - number: 2:10.1
    text: 'Een schriftelijk stuk in de Friese taal wordt tevens in de Nederlandse taal opgesteld, indien het:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel210
  - number: 2:10.1.a
    text: |-
      bestemd of mede bestemd is voor buiten de provincie Fryslân gevestigde bestuursorganen of bestuursorganen van de
      centrale overheid,
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel210
  - number: 2:10.1.b
    text: algemeen verbindende voorschriften of beleidsregels inhoudt, of
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel210
  - number: 2:10.1.c
    text: is opgesteld ter directe voorbereiding van de onder *b* genoemde voorschriften of regels.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel210
  - number: 2:10.2
    text: |-
      De bekendmaking, mededeling of terinzagelegging van een schriftelijk stuk als bedoeld in het eerste lid geschiedt
      in ieder geval ook in de Nederlandse taal, tenzij redelijkerwijs kan worden aangenomen dat daaraan geen behoefte
      bestaat.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel210
  - number: 2:11.1
    text: |-
      Indien een schriftelijk stuk in de Friese taal is opgesteld, verstrekt het bestuursorgaan daarvan op verzoek een
      vertaling in de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel211
  - number: 2:11.2
    text: Het bestuursorgaan kan voor het vertalen een vergoeding van ten hoogste de kosten verlangen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel211
  - number: 2:11.3
    text: 'Voor het vertalen kan geen vergoeding worden verlangd, indien het schriftelijk stuk:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel211
  - number: 2:11.3.a
    text: |-
      de notulen van de vergadering van een vertegenwoordigend orgaan inhoudt, en het belang van de verzoeker
      rechtstreeks bij het genotuleerde is betrokken, dan wel de notulen van de vergadering van een vertegenwoordigend
      orgaan inhoudt, en de vaststelling van algemeen verbindende voorschriften of beleidsregels betreft, of
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel211
  - number: 2:11.3.b
    text: een besluit of andere handeling inhoudt waarbij de verzoeker belanghebbende is.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel211
  - number: 2:12.1
    text: |-
      Een ieder kan in vergaderingen van in de provincie Fryslân gevestigde vertegenwoordigende organen de Friese taal
      gebruiken.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel212
  - number: 2:12.2
    text: Hetgeen in de Friese taal is gezegd, wordt in de Friese taal genotuleerd.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel212
  - number: 2:13.1
    text: |-
      In het verkeer tussen burgers en bestuursorganen kan een bericht elektronisch worden verzonden, mits de bepalingen
      van deze afdeling in acht worden genomen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel213
  - number: 2:13.2
    text: 'Het eerste lid geldt niet, indien:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel213
  - number: 2:13.2.a
    text: dit bij of krachtens wettelijk voorschrift is bepaald, of
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel213
  - number: 2:13.2.b
    text: een vormvoorschrift zich tegen elektronische verzending verzet.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel213
  - number: 2:14.1
    text: |-
      Een bestuursorgaan kan een bericht dat tot een of meer geadresseerden is gericht, elektronisch verzenden voor zover
      de geadresseerde kenbaar heeft gemaakt dat hij langs deze weg voldoende bereikbaar is.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel214
  - number: 2:14.2
    text: |-
      Tenzij bij wettelijk voorschrift anders is bepaald, geschiedt de verzending van berichten die niet tot een of meer
      geadresseerden zijn gericht, niet uitsluitend elektronisch.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel214
  - number: 2:14.3
    text: |-
      Indien een bestuursorgaan een bericht elektronisch verzendt, geschiedt dit op een voldoende betrouwbare en
      vertrouwelijke manier, gelet op de aard en de inhoud van het bericht en het doel waarvoor het wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel214
  - number: 2:15.1
    text: |-
      Een bericht kan elektronisch naar een bestuursorgaan worden verzonden voor zover het bestuursorgaan kenbaar heeft
      gemaakt dat deze weg is geopend. Het bestuursorgaan kan nadere eisen stellen aan het gebruik van de elektronische
      weg.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel215
  - number: 2:15.2
    text: |-
      Een bestuursorgaan kan elektronisch verschafte gegevens en bescheiden weigeren voor zover de aanvaarding daarvan
      tot een onevenredige belasting voor het bestuursorgaan zou leiden.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel215
  - number: 2:15.3
    text: |-
      Een bestuursorgaan kan een elektronisch verzonden bericht weigeren voor zover de betrouwbaarheid of
      vertrouwelijkheid van dit bericht onvoldoende is gewaarborgd, gelet op de aard en de inhoud van het bericht en het
      doel waarvoor het wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel215
  - number: 2:15.4
    text: Het bestuursorgaan deelt een weigering op grond van dit artikel zo spoedig mogelijk aan de afzender mede.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel215
  - number: 2:16
    text: |-
      Aan het vereiste van ondertekening is voldaan door een elektronische handtekening, indien de methode die daarbij
      voor authentificatie is gebruikt voldoende betrouwbaar is, gelet op de aard en de inhoud van het elektronische
      bericht en het doel waarvoor het wordt gebruikt. De [artikelen 15a, tweede tot en met zesde lid][ref1], en
      [15b van Boek 3 van het Burgerlijk Wetboek][ref2] zijn van overeenkomstige toepassing, voor zover de aard van het
      bericht zich daartegen niet verzet. Bij wettelijk voorschrift kunnen aanvullende eisen worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel15a
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel15b
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel216
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 15a
      - id: ref2
        bwb_id: BWBR0005291
        artikel: 15b
  - number: 2:17.1
    text: |-
      Als tijdstip waarop een bericht door een bestuursorgaan elektronisch is verzonden, geldt het tijdstip waarop het
      bericht een systeem voor gegevensverwerking bereikt waarover het bestuursorgaan geen controle heeft of, indien het
      bestuursorgaan en de geadresseerde gebruik maken van hetzelfde systeem voor gegevensverwerking, het tijdstip waarop
      het bericht toegankelijk wordt voor de geadresseerde.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel217
  - number: 2:17.2
    text: |-
      Als tijdstip waarop een bericht door een bestuursorgaan elektronisch is ontvangen, geldt het tijdstip waarop het
      bericht zijn systeem voor gegevensverwerking heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel217
  - number: 3:1.1
    text: 'Op besluiten, inhoudende algemeen verbindende voorschriften:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel31
  - number: 3:1.1.a
    text: |-
      is [afdeling 3.2][ref1] slechts van toepassing, voor zover de aard van de besluiten zich daartegen niet verzet;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: 3:1.1.b
    text: |-
      zijn de [afdelingen 3.6][ref1] en [3.7][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '3'
        afdeling: '3.6'
      - id: ref2
        bwb_id: BWBR0005537
        hoofdstuk: '3'
        afdeling: '3.7'
  - number: 3:1.2
    text: |-
      Op andere handelingen van bestuursorganen dan besluiten zijn de [afdelingen 3.2 tot en met 3.4][ref1] van
      overeenkomstige toepassing, voor zover de aard van de handelingen zich daartegen niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: 3:2
    text: |-
      Bij de voorbereiding van een besluit vergaart het bestuursorgaan de nodige kennis omtrent de relevante feiten en de
      af te wegen belangen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel32
  - number: 3:3
    text: |-
      Het bestuursorgaan gebruikt de bevoegdheid tot het nemen van een besluit niet voor een ander doel dan waarvoor die
      bevoegdheid is verleend.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel33
  - number: 3:4.1
    text: |-
      Het bestuursorgaan weegt de rechtstreeks bij het besluit betrokken belangen af, voor zover niet uit een wettelijk
      voorschrift of uit de aard van de uit te oefenen bevoegdheid een beperking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel34
  - number: 3:4.2
    text: |-
      De voor een of meer belanghebbenden nadelige gevolgen van een besluit mogen niet onevenredig zijn in verhouding tot
      de met het besluit te dienen doelen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel34
  - number: 3:5.1
    text: |-
      In deze afdeling wordt verstaan onder adviseur: een persoon of college, bij of krachtens wettelijk
      voorschrift belast met het adviseren inzake door een bestuursorgaan te nemen besluiten en niet werkzaam onder
      verantwoordelijkheid van dat bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel35
  - number: 3:5.2
    text: Deze afdeling is niet van toepassing op het horen van de Raad van State.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel35
  - number: 3:6.1
    text: |-
      Indien aan de adviseur niet reeds bij wettelijk voorschrift een termijn is gesteld, kan het bestuursorgaan aangeven
      binnen welke termijn een advies wordt verwacht. Deze termijn mag niet zodanig kort zijn, dat de adviseur zijn taak
      niet naar behoren kan vervullen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel36
  - number: 3:6.2
    text: |-
      Indien het advies niet tijdig wordt uitgebracht staat het enkele ontbreken daarvan niet in de weg aan het nemen van
      het besluit.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel36
  - number: 3:7.1
    text: |-
      Het bestuursorgaan waaraan advies wordt uitgebracht, stelt aan de adviseur, al dan niet op verzoek, de gegevens ter
      beschikking die nodig zijn voor een goede vervulling van diens taak.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel37
  - number: 3:7.2
    text: |-
      [Artikel 10 van de Wet openbaarheid van bestuur][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: 3:8
    text: In of bij het besluit wordt de adviseur vermeld die advies heeft uitgebracht.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel38
  - number: 3:9
    text: |-
      Indien een besluit berust op een onderzoek naar feiten en gedragingen dat door een adviseur is verricht, dient het
      bestuursorgaan zich ervan te vergewissen dat dit onderzoek op zorgvuldige wijze heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel39
  - number: 3:9a
    text: Deze afdeling is van overeenkomstige toepassing op voorstellen van wet.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel39a
  - number: 3:10.1
    text: |-
      Deze afdeling is van toepassing op de voorbereiding van besluiten indien dat bij wettelijk voorschrift of bij
      besluit van het bestuursorgaan is bepaald.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel310
  - number: 3:10.2
    text: |-
      Tenzij bij wettelijk voorschrift of bij besluit van het bestuursorgaan anders is bepaald, is deze afdeling niet van
      toepassing op de voorbereiding van een besluit inhoudende de afwijzing van een aanvraag tot intrekking of wijziging
      van een besluit.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel310
  - number: 3:10.3
    text: |-
      [Afdeling 4.1.1][ref1] is mede van toepassing op andere besluiten dan beschikkingen, indien deze op aanvraag worden
      genomen en voorbereid overeenkomstig deze afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel310
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '4'
        afdeling: 4.1.1
  - number: 3:11.1
    text: |-
      Het bestuursorgaan legt het ontwerp van het te nemen besluit, met de daarop betrekking hebbende stukken die
      redelijkerwijs nodig zijn voor een beoordeling van het ontwerp, ter inzage.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel311
  - number: 3:11.2
    text: |-
      [Artikel 10 van de Wet openbaarheid van bestuur][ref1] is van overeenkomstige toepassing. Indien op grond daarvan
      bepaalde stukken niet ter inzage worden gelegd, wordt daarvan mededeling gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel311
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: 3:11.3
    text: |-
      Tegen vergoeding van ten hoogste de kosten verstrekt het bestuursorgaan afschrift van de ter inzage gelegde
      stukken.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel311
  - number: 3:11.4
    text: |-
      De stukken liggen ter inzage gedurende de in [artikel 3:16, eerste lid][ref1], bedoelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel311
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.4'
  - number: 3:12.1
    text: |-
      Voorafgaand aan de terinzagelegging geeft het bestuursorgaan in een of meer dag-, nieuws-, of huis-aan-huisbladen
      of op een andere geschikte wijze kennis van het ontwerp. Volstaan kan worden met het vermelden van de zakelijke
      inhoud.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel312
  - number: 3:12.2
    text: |-
      Indien het een besluit van een tot de centrale overheid behorend bestuursorgaan betreft, wordt de kennisgeving in
      ieder geval in de Staatscourant geplaatst, tenzij bij wettelijk voorschrift anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel312
  - number: 3:12.3
    text: 'In de kennisgeving wordt vermeld:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel312
  - number: 3:12.3.a
    text: waar en wanneer de stukken ter inzage zullen liggen;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel312
  - number: 3:12.3.b
    text: wie in de gelegenheid worden gesteld om zienswijzen naar voren te brengen;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel312
  - number: 3:12.3.c
    text: op welke wijze dit kan geschieden;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel312
  - number: 3:12.3.d
    text: |-
      indien toepassing is gegeven aan [artikel 3:18, tweede lid][ref1]: de termijn waarbinnen het besluit zal worden
      genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel312
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.4'
  - number: 3:13.1
    text: |-
      Indien het besluit tot een of meer belanghebbenden zal zijn gericht, zendt het bestuursorgaan voorafgaand aan de
      terinzagelegging het ontwerp toe aan hen, onder wie begrepen de aanvrager.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel313
  - number: 3:13.2
    text: |-
      [Artikel 3:12, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel313
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.4'
  - number: 3:14.1
    text: Het bestuursorgaan vult de ter inzage gelegde stukken aan met nieuwe relevante stukken en gegevens.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel314
  - number: 3:14.2
    text: |-
      [Artikel 3:11, tweede tot en met vierde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel314
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.4'
  - number: 3:15.1
    text: |-
      Belanghebbenden kunnen bij het bestuursorgaan naar keuze schriftelijk of mondeling hun zienswijze over het ontwerp
      naar voren brengen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel315
  - number: 3:15.2
    text: |-
      Bij wettelijk voorschrift of door het bestuursorgaan kan worden bepaald dat ook aan anderen de gelegenheid moet
      worden geboden hun zienswijze naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel315
  - number: 3:15.3
    text: |-
      Indien het een besluit op aanvraag betreft, stelt het bestuursorgaan de aanvrager zo nodig in de gelegenheid te
      reageren op de naar voren gebrachte zienswijzen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel315
  - number: 3:15.4
    text: |-
      Indien het een besluit tot wijziging of intrekking van een besluit betreft, stelt het bestuursorgaan degene tot
      wie het te wijzigen of in te trekken besluit is gericht zo nodig in de gelegenheid te reageren op de naar voren
      gebrachte zienswijzen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel315
  - number: 3:16.1
    text: |-
      De termijn voor het naar voren brengen van zienswijzen en het uitbrengen van adviezen als bedoeld in
      [afdeling 3.3][ref1], bedraagt zes weken, tenzij bij wettelijk voorschrift een langere termijn is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel316
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '3'
        afdeling: '3.3'
  - number: 3:16.2
    text: De termijn vangt aan met ingang van de dag waarop het ontwerp ter inzage is gelegd.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel316
  - number: 3:16.3
    text: |-
      Op schriftelijk naar voren gebrachte zienswijzen zijn de [artikelen 6:9][ref1] en [6:10][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel316
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
  - number: 3:17
    text: |-
      Van hetgeen overeenkomstig [artikel 3:15][ref1] mondeling naar voren is gebracht, wordt een verslag gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel317
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.4'
  - number: 3:18.1
    text: |-
      Indien het een besluit op aanvraag betreft, neemt het bestuursorgaan het besluit zo spoedig mogelijk, doch
      uiterlijk zes maanden na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel318
  - number: 3:18.2
    text: |-
      Indien de aanvraag een zeer ingewikkeld of omstreden onderwerp betreft, kan het bestuursorgaan, alvorens een
      ontwerp ter inzage te leggen, binnen acht weken na ontvangst van de aanvraag de in het eerste lid bedoelde termijn
      met een redelijke termijn verlengen. Voordat het bestuursorgaan een besluit tot verlenging neemt, stelt het de
      aanvrager in de gelegenheid zijn zienswijze daarover naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel318
  - number: 3:18.3
    text: |-
      In afwijking van het eerste lid neemt het bestuursorgaan het besluit uiterlijk twaalf weken na de terinzagelegging
      van het ontwerp, indien het een besluit betreft:
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel318
  - number: 3:18.3.a
    text: inzake intrekking van een besluit;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel318
  - number: 3:18.3.b
    text: |-
      inzake wijziging van een besluit en de aanvraag is gedaan door een ander dan degene tot wie het te wijzigen besluit
      is gericht.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel318
  - number: 3:18.4
    text: |-
      Indien geen zienswijzen naar voren zijn gebracht, doet het bestuursorgaan daarvan zo spoedig mogelijk nadat
      de termijn voor het naar voren brengen van zienswijzen is verstreken, mededeling op de wijze, bedoeld in
      [artikel 3:12, eerste en tweede lid][ref1]. In afwijking van het eerste of derde lid neemt het bestuursorgaan het
      besluit in dat geval binnen vier weken nadat de termijn voor het naar voren brengen van zienswijzen is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel318
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.4'
  - number: 3:40
    text: Een besluit treedt niet in werking voordat het is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel340
  - number: 3:41.1
    text: |-
      De bekendmaking van besluiten die tot een of meer belanghebbenden zijn gericht, geschiedt door toezending of
      uitreiking aan hen, onder wie begrepen de aanvrager.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel341
  - number: 3:41.2
    text: |-
      Indien de bekendmaking van het besluit niet kan geschieden op de wijze als voorzien in het eerste lid, geschiedt
      zij op een andere geschikte wijze.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel341
  - number: 3:42.1
    text: |-
      De bekendmaking van besluiten die niet tot een of meer belanghebbenden zijn gericht, geschiedt door kennisgeving
      van het besluit of van de zakelijke inhoud ervan in een van overheidswege uitgegeven blad of een dag-, nieuws- of
      huis-aan-huisblad, dan wel op een andere geschikte wijze.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel342
  - number: 3:42.2
    text: Tenzij bij wettelijk voorschrift anders is bepaald, geschiedt de bekendmaking niet elektronisch.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel342
  - number: 3:42.3
    text: |-
      Indien alleen van de zakelijke inhoud wordt kennisgegeven, wordt het besluit tegelijkertijd ter inzage gelegd. In
      de kennisgeving wordt vermeld waar en wanneer het besluit ter inzage ligt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel342
  - number: 3:43.1
    text: |-
      Tegelijkertijd met of zo spoedig mogelijk na de bekendmaking wordt van het besluit mededeling gedaan aan degenen
      die bij de voorbereiding ervan hun zienswijze naar voren hebben gebracht. Aan een adviseur als bedoeld in
      [artikel 3:5][ref1] wordt in ieder geval mededeling gedaan indien van het advies wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel343
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.3'
  - number: 3:43.2
    text: Bij de mededeling van een besluit wordt tevens vermeld wanneer en hoe de bekendmaking ervan heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel343
  - number: 3:44.1
    text: |-
      Indien bij de voorbereiding van het besluit toepassing is gegeven aan [afdeling 3.4][ref1], geschiedt de
      mededeling, bedoeld in [artikel 3:43, eerste lid][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel344
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '3'
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: 3:44.1.a
    text: |-
      met overeenkomstige toepassing van de [artikelen 3:11][ref1] en
      [3:12, eerste of tweede lid, en derde lid, onderdeel a][ref2], met dien verstande dat de stukken ter inzage liggen
      totdat de beroepstermijn is verstreken, en


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel344
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.4'
  - number: 3:44.1.b
    text: |-
      door toezending van een exemplaar van het besluit aan degenen die over het ontwerp van het besluit zienswijzen naar
      voren hebben gebracht.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel344
  - number: 3:44.2
    text: 'In afwijking van het eerste lid, onderdeel b, kan het bestuursorgaan:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel344
  - number: 3:44.2.a
    text: |-
      indien de omvang van het besluit daartoe aanleiding geeft, volstaan met een ieder van de daar bedoelde personen de
      strekking van het besluit mee te delen;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel344
  - number: 3:44.2.b
    text: |-
      indien een zienswijze door meer dan vijf personen naar voren is gebracht bij hetzelfde geschrift, volstaan met
      toezending van een exemplaar aan de vijf personen wier namen en adressen als eerste in dat geschrift zijn vermeld;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel344
  - number: 3:44.2.c
    text: |-
      indien een zienswijze naar voren is gebracht door meer dan vijf personen bij hetzelfde geschrift en de omvang van
      het besluit daartoe aanleiding geeft, volstaan met het meedelen aan de vijf personen wier namen en adressen als
      eerste in dat geschrift zijn vermeld, van de strekking van het besluit;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel344
  - number: 3:44.2.d
    text: indien toezending zou moeten geschieden aan meer dan 250 personen, die toezending achterwege laten.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel344
  - number: 3:45.1
    text: |-
      Indien tegen een besluit bezwaar kan worden gemaakt of beroep kan worden ingesteld, wordt daarvan bij de
      bekendmaking en bij de mededeling van het besluit melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel345
  - number: 3:45.2
    text: |-
      Hierbij wordt vermeld door wie, binnen welke termijn en bij welk orgaan bezwaar kan worden gemaakt of beroep kan
      worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel345
  - number: 3:46
    text: Een besluit dient te berusten op een deugdelijke motivering.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel346
  - number: 3:47.1
    text: De motivering wordt vermeld bij de bekendmaking van het besluit.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel347
  - number: 3:47.2
    text: Daarbij wordt zo mogelijk vermeld krachtens welk wettelijk voorschrift het besluit wordt genomen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel347
  - number: 3:47.3
    text: |-
      Indien de motivering in verband met de vereiste spoed niet aanstonds bij de bekendmaking van het besluit kan worden
      vermeld, verstrekt het bestuursorgaan deze binnen een week na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel347
  - number: 3:47.4
    text: |-
      In dat geval zijn de [artikelen 3:41 tot en met 3:43][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel347
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: 3:48.1
    text: |-
      De vermelding van de motivering kan achterwege blijven indien redelijkerwijs kan worden aangenomen dat daaraan geen
      behoefte bestaat.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel348
  - number: 3:48.2
    text: |-
      Verzoekt een belanghebbende binnen een redelijke termijn om de motivering, dan wordt deze zo spoedig mogelijk
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel348
  - number: 3:49
    text: |-
      Ter motivering van een besluit of een onderdeel daarvan kan worden volstaan met een verwijzing naar een met het oog
      daarop uitgebracht advies, indien het advies zelf de motivering bevat en van het advies kennis is of wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel349
  - number: 3:50
    text: |-
      Indien het bestuursorgaan een besluit neemt dat afwijkt van een met het oog daarop krachtens wettelijk voorschrift
      uitgebracht advies, wordt zulks met de redenen voor de afwijking in de motivering vermeld.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel350
  - number: 4:1
    text: |-
      Tenzij bij wettelijk voorschrift anders is bepaald, wordt de aanvraag tot het geven van een beschikking
      schriftelijk ingediend bij het bestuursorgaan dat bevoegd is op de aanvraag te beslissen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel41
  - number: 4:2.1
    text: 'De aanvraag wordt ondertekend en bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel42
  - number: 4:2.1.a
    text: de naam en het adres van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel42
  - number: 4:2.1.b
    text: de dagtekening;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel42
  - number: 4:2.1.c
    text: een aanduiding van de beschikking die wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel42
  - number: 4:2.2
    text: |-
      De aanvrager verschaft voorts de gegevens en bescheiden die voor de beslissing op de aanvraag nodig zijn en
      waarover hij redelijkerwijs de beschikking kan krijgen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel42
  - number: 4:3.1
    text: |-
      De aanvrager kan weigeren gegevens en bescheiden te verschaffen voor zover het belang daarvan voor de beslissing
      van het bestuursorgaan niet opweegt tegen het belang van de eerbiediging van de persoonlijke levenssfeer, met
      inbegrip van de bescherming van medische en psychologische onderzoeksresultaten, of tegen het belang van de
      bescherming van bedrijfs- en fabricagegegevens.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel43
  - number: 4:3.2
    text: |-
      Het eerste lid is niet van toepassing op bij wettelijk voorschrift aangewezen gegevens en bescheiden waarvan is
      bepaald dat deze dienen te worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel43
  - number: 4:3a
    text: Het bestuursorgaan bevestigt de ontvangst van een elektronisch ingediende aanvraag.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel43a
  - number: 4:4
    text: |-
      Het bestuursorgaan dat bevoegd is op de aanvraag te beslissen, kan voor het indienen van aanvragen en het
      verstrekken van gegevens een formulier vaststellen, voor zover daarin niet is voorzien bij wettelijk voorschrift.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel44
  - number: 4:5.1
    text: 'Het bestuursorgaan kan besluiten de aanvraag niet te behandelen, indien:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel45
  - number: 4:5.1.a
    text: de aanvrager niet heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van de aanvraag, of
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel45
  - number: 4:5.1.b
    text: |-
      de aanvraag geheel of gedeeltelijk is geweigerd op grond van [artikel 2:15][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 4:5.1.c
    text: |-
      de verstrekte gegevens en bescheiden onvoldoende zijn voor de beoordeling van de aanvraag of voor de voorbereiding
      van de beschikking,
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel45
  - number: 4:5.2
    text: |-
      Indien de aanvraag of een van de daarbij behorende gegevens of bescheiden in een vreemde taal is gesteld en een
      vertaling daarvan voor de beoordeling van de aanvraag of voor de voorbereiding van de beschikking noodzakelijk
      is, kan het bestuursorgaan besluiten de aanvraag niet te behandelen, mits de aanvrager de gelegenheid heeft gehad
      binnen een door het bestuursorgaan gestelde termijn de aanvraag met een vertaling aan te vullen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel45
  - number: 4:5.3
    text: |-
      Indien de aanvraag of een van de daarbij behorende gegevens of bescheiden omvangrijk of ingewikkeld is en een
      samenvatting voor de beoordeling van de aanvraag of voor de voorbereiding van de beschikking noodzakelijk is, kan
      het bestuursorgaan besluiten de aanvraag niet te behandelen, mits de aanvrager de gelegenheid heeft gehad binnen
      een door het bestuursorgaan gestelde termijn de aanvraag met een samenvatting aan te vullen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel45
  - number: 4:5.4
    text: |-
      Een besluit om de aanvraag niet te behandelen wordt aan de aanvrager bekendgemaakt binnen vier weken nadat de
      aanvraag is aangevuld of nadat de daarvoor gestelde termijn ongebruikt is verstreken.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel45
  - number: 4:6.1
    text: |-
      Indien na een geheel of gedeeltelijk afwijzende beschikking een nieuwe aanvraag wordt gedaan, is de aanvrager
      gehouden nieuw gebleken feiten of veranderde omstandigheden te vermelden.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel46
  - number: 4:6.2
    text: |-
      Wanneer geen nieuw gebleken feiten of veranderde omstandigheden worden vermeld, kan het bestuursorgaan zonder
      toepassing te geven aan [artikel 4:5][ref1] de aanvraag afwijzen onder verwijzing naar zijn eerdere afwijzende
      beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
        hoofdstuk: '4'
        afdeling: 4.1.1
  - number: 4:7.1
    text: |-
      Voordat een bestuursorgaan een aanvraag tot het geven van een beschikking geheel of gedeeltelijk afwijst, stelt het
      de aanvrager in de gelegenheid zijn zienswijze naar voren te brengen indien:
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel47
  - number: 4:7.1.a
    text: de afwijzing zou steunen op gegevens over feiten en belangen die de aanvrager betreffen, en
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel47
  - number: 4:7.1.b
    text: die gegevens afwijken van gegevens die de aanvrager ter zake zelf heeft verstrekt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel47
  - number: 4:7.2
    text: |-
      Het eerste lid geldt niet indien sprake is van een afwijking van de aanvraag die slechts van geringe betekenis voor
      de aanvrager kan zijn.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel47
  - number: 4:8.1
    text: |-
      Voordat een bestuursorgaan een beschikking geeft waartegen een belanghebbende die de beschikking niet heeft
      aangevraagd naar verwachting bedenkingen zal hebben, stelt het die belanghebbende in de gelegenheid zijn zienswijze
      naar voren te brengen indien:
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel48
  - number: 4:8.1.a
    text: de beschikking zou steunen op gegevens over feiten en belangen die de belanghebbende betreffen, en
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel48
  - number: 4:8.1.b
    text: die gegevens niet door de belanghebbende zelf ter zake zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel48
  - number: 4:8.2
    text: |-
      Het eerste lid geldt niet indien de belanghebbende niet heeft voldaan aan een wettelijke verplichting gegevens
      te verstrekken.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel48
  - number: 4:9
    text: |-
      Bij toepassing van de [artikelen 4:7][ref1] en [4:8][ref2] kan de belanghebbende naar keuze schriftelijk of
      mondeling zijn zienswijze naar voren brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
        hoofdstuk: '4'
        afdeling: 4.1.2
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
        hoofdstuk: '4'
        afdeling: 4.1.2
  - number: 4:11
    text: |-
      Het bestuursorgaan kan toepassing van de [artikelen 4:7][ref1] en [4:8][ref2] achterwege laten voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel411
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
        hoofdstuk: '4'
        afdeling: 4.1.2
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
        hoofdstuk: '4'
        afdeling: 4.1.2
  - number: 4:11.a
    text: de vereiste spoed zich daartegen verzet;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel411
  - number: 4:11.b
    text: |-
      de belanghebbende reeds eerder in de gelegenheid is gesteld zijn zienswijze naar voren te brengen en zich sindsdien
      geen nieuwe feiten of omstandigheden hebben voorgedaan, of
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel411
  - number: 4:11.c
    text: |-
      het met de beschikking beoogde doel slechts kan worden bereikt indien de belanghebbende daarvan niet reeds tevoren
      in kennis is gesteld.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel411
  - number: 4:12.1
    text: |-
      Het bestuursorgaan kan toepassing van de [artikelen 4:7][ref1] en [4:8][ref2] voorts achterwege laten bij een
      beschikking die strekt tot het vaststellen van een financiële verplichting of aanspraak indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel412
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
        hoofdstuk: '4'
        afdeling: 4.1.2
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
        hoofdstuk: '4'
        afdeling: 4.1.2
  - number: 4:12.1.a
    text: tegen die beschikking bezwaar kan worden gemaakt of administratief beroep kan worden ingesteld, en
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel412
  - number: 4:12.1.b
    text: de nadelige gevolgen na bezwaar of administratief beroep volledig ongedaan kunnen worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel412
  - number: 4:12.2
    text: 'Het eerste lid geldt niet bij een beschikking die strekt tot:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel412
  - number: 4:12.2.a
    text: |-
      het op grond van [artikel 4:35][ref1] of met toepassing van [artikel 4:51][ref2] weigeren van een subsidie;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel412
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
        hoofdstuk: '4'
        afdeling: 4.2.3
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
        hoofdstuk: '4'
        afdeling: 4.2.6
  - number: 4:12.2.b
    text: |-
      het op grond van [artikel 4:46, tweede lid][ref1], lager vaststellen van een subsidie, of


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel412
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
        hoofdstuk: '4'
        afdeling: 4.2.5
  - number: 4:12.2.c
    text: het intrekken of ten nadele van de ontvanger wijzigen van een subsidieverlening of een subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel412
  - number: 4:13.1
    text: |-
      Een beschikking dient te worden gegeven binnen de bij wettelijk voorschrift bepaalde termijn of, bij het ontbreken
      van zulk een termijn, binnen een redelijke termijn na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel413
  - number: 4:13.2
    text: |-
      De in het eerste lid bedoelde redelijke termijn is in ieder geval verstreken wanneer het bestuursorgaan binnen
      acht weken na ontvangst van de aanvraag geen beschikking heeft gegeven, noch een kennisgeving als bedoeld in
      [artikel 4:14, derde lid][ref1], heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel413
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
        hoofdstuk: '4'
        afdeling: 4.1.3
  - number: 4:14.1
    text: |-
      Indien een beschikking niet binnen de bij wettelijk voorschrift bepaalde termijn kan worden gegeven, deelt
      het bestuursorgaan dit aan de aanvrager mede en noemt het daarbij een zo kort mogelijke termijn waarbinnen de
      beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel414
  - number: 4:14.2
    text: |-
      Het eerste lid is niet van toepassing indien het bestuursorgaan na het verstrijken van de bij wettelijk voorschrift
      bepaalde termijn niet langer bevoegd is.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel414
  - number: 4:14.3
    text: |-
      Indien, bij het ontbreken van een bij wettelijk voorschrift bepaalde termijn, een beschikking niet binnen acht
      weken kan worden gegeven, stelt het bestuursorgaan de aanvrager daarvan in kennis en noemt het daarbij een
      redelijke termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel414
  - number: 4:15
    text: |-
      De termijn voor het geven van een beschikking wordt opgeschort met ingang van de dag waarop het bestuursorgaan
      krachtens [artikel 4:5][ref1] de aanvrager uitnodigt de aanvraag aan te vullen, tot de dag waarop de aanvraag is
      aangevuld of de daarvoor gestelde termijn ongebruikt is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel415
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
        hoofdstuk: '4'
        afdeling: 4.1.1
  - number: 4:21.1
    text: |-
      Onder subsidie wordt verstaan: de aanspraak op financiële middelen, door een bestuursorgaan verstrekt met het oog
      op bepaalde activiteiten van de aanvrager, anders dan als betaling voor aan het bestuursorgaan geleverde goederen
      of diensten.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel421
  - number: 4:21.2
    text: |-
      Deze titel is niet van toepassing op aanspraken of verplichtingen die voortvloeien uit een wettelijk
      voorschrift inzake belastingen of de heffing van een premie dan wel een premievervangende belasting ingevolge de
      [Wet financiering sociale verzekeringen][ref1] of de [Ziekenfondswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017745
      [ref2]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel421
    references:
      - id: ref1
        bwb_id: BWBR0017745
      - id: ref2
        bwb_id: BWBR0002460
  - number: 4:21.3
    text: |-
      Deze titel is niet van toepassing op de aanspraak op financiële middelen die wordt verstrekt op grond van een
      wettelijk voorschrift dat uitsluitend voorziet in verstrekking aan rechtspersonen die krachtens publiekrecht zijn
      ingesteld.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel421
  - number: 4:21.4
    text: Deze titel is van overeenkomstige toepassing op de bekostiging van het onderwijs en onderzoek.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel421
  - number: 4:22
    text: |-
      Onder subsidieplafond wordt verstaan: het bedrag dat gedurende een bepaald tijdvak ten hoogste beschikbaar is voor
      de verstrekking van subsidies krachtens een bepaald wettelijk voorschrift.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel422
  - number: 4:23.1
    text: |-
      Een bestuursorgaan verstrekt slechts subsidie op grond van een wettelijk voorschrift dat regelt voor welke
      activiteiten subsidie kan worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel423
  - number: 4:23.2
    text: |-
      Indien een zodanig wettelijk voorschrift is opgenomen in een niet op een wet berustende algemene maatregel van
      bestuur, vervalt dat voorschrift vier jaren nadat het in werking is getreden, tenzij voor dat tijdstip een voorstel
      van wet bij de Staten-Generaal is ingediend waarin de subsidie wordt geregeld.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel423
  - number: 4:23.3
    text: 'Het eerste lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel423
  - number: 4:23.3.a
    text: |-
      in afwachting van de totstandkoming van een wettelijk voorschrift gedurende ten hoogste een jaar of totdat een
      binnen dat jaar bij de Staten-Generaal ingediend wetsvoorstel is verworpen of tot wet is verheven en in werking
      is getreden;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel423
  - number: 4:23.3.b
    text: |-
      indien de subsidie rechtstreeks op grond van een door de Raad van de Europese Unie, het Europees Parlement en de
      Raad gezamenlijk of de Commissie van de Europese Gemeenschappen vastgesteld programma wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel423
  - number: 4:23.3.c
    text: |-
      indien de begroting de subsidie-ontvanger en het bedrag waarop de subsidie ten hoogste kan worden vastgesteld,
      vermeldt, of
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel423
  - number: 4:23.3.d
    text: in incidentele gevallen, mits de subsidie voor ten hoogste vier jaren wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel423
  - number: 4:23.4
    text: |-
      Het bestuursorgaan publiceert jaarlijks een verslag van de verstrekking van subsidies met toepassing van het derde
      lid, onderdelen *a* en *d*.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel423
  - number: 4:24
    text: |-
      Indien een subsidie op een wettelijk voorschrift berust, wordt ten minste eenmaal in de vijf jaren een verslag
      gepubliceerd over de doeltreffendheid en de effecten van de subsidie in de praktijk, tenzij bij wettelijk
      voorschrift anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel424
  - number: 4:25.1
    text: Een subsidieplafond kan slechts bij of krachtens wettelijk voorschrift worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel425
  - number: 4:25.2
    text: |-
      Een subsidie wordt geweigerd voor zover door verstrekking van de subsidie het subsidieplafond zou worden
      overschreden.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel425
  - number: 4:25.3
    text: |-
      Indien niet tijdig, dan wel in bezwaar of beroep of ter uitvoering van een rechterlijke uitspraak omtrent
      verstrekking wordt beslist, geldt de verplichting van het tweede lid slechts voor zover zij ook gold op het
      tijdstip, waarop de beslissing in eerste aanleg werd genomen of had moeten worden genomen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel425
  - number: 4:26.1
    text: Bij of krachtens wettelijk voorschrift wordt bepaald hoe het beschikbare bedrag wordt verdeeld.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel426
  - number: 4:26.2
    text: Bij de bekendmaking van het subsidieplafond wordt de wijze van verdeling vermeld.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel426
  - number: 4:27.1
    text: Het subsidieplafond wordt bekendgemaakt voor de aanvang van het tijdvak waarvoor het is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel427
  - number: 4:27.2
    text: |-
      Indien het subsidieplafond of een verlaging daarvan later wordt bekendgemaakt, heeft deze bekendmaking geen
      gevolgen voor voordien ingediende aanvragen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel427
  - number: 4:28
    text: |-
      [Artikel 4:27, tweede lid][ref1], is niet van toepassing, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel428
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
        hoofdstuk: '4'
        afdeling: 4.2.2
  - number: 4:28.a
    text: |-
      de aanvragen voor het tijdvak waarvoor het subsidieplafond is vastgesteld ingevolge wettelijk voorschrift moeten
      worden ingediend op een tijdstip waarop de begroting nog niet is vastgesteld of goedgekeurd;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel428
  - number: 4:28.b
    text: het een verlaging betreft die voortvloeit uit de vaststelling of goedkeuring van de begroting, en
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel428
  - number: 4:28.c
    text: |-
      bij de bekendmaking van het subsidieplafond is gewezen op de mogelijkheid van verlaging en de gevolgen daarvan voor
      reeds ingediende aanvragen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel428
  - number: 4:29
    text: |-
      Tenzij bij wettelijk voorschrift anders is bepaald kan voorafgaand aan een subsidievaststelling een beschikking
      omtrent subsidieverlening worden gegeven, indien een aanvraag daartoe is ingediend voor de afloop van de activiteit
      of het tijdvak waarvoor de subsidie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel429
  - number: 4:30.1
    text: De beschikking tot subsidieverlening bevat een omschrijving van de activiteiten waarvoor subsidie wordt verleend.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel430
  - number: 4:30.2
    text: De omschrijving kan later worden uitgewerkt, voor zover de beschikking tot subsidieverlening dit vermeldt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel430
  - number: 4:31.1
    text: |-
      De beschikking tot subsidieverlening vermeldt het bedrag van de subsidie, dan wel de wijze waarop dit bedrag wordt
      bepaald.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel431
  - number: 4:31.2
    text: |-
      Indien de beschikking tot subsidieverlening het bedrag van de subsidie niet vermeldt, vermeldt zij het bedrag
      waarop de subsidie ten hoogste kan worden vastgesteld, tenzij bij wettelijk voorschrift anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel431
  - number: 4:32
    text: |-
      Een subsidie in de vorm van een periodieke aanspraak op financiële middelen wordt verleend voor een bepaald
      tijdvak, dat in de beschikking tot subsidieverlening wordt vermeld.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel432
  - number: 4:33
    text: |-
      Een subsidie kan niet worden verleend onder de voorwaarde dat uitsluitend het bestuursorgaan of uitsluitend de
      subsidie-ontvanger een bepaalde handeling verricht, tenzij het betreft de voorwaarde dat:
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel433
  - number: 4:33.a
    text: |-
      de subsidie-ontvanger medewerkt aan de totstandkoming van een overeenkomst ter uitvoering van de beschikking tot
      subsidieverlening, of
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel433
  - number: 4:33.b
    text: |-
      de subsidie-ontvanger aantoont dat een gebeurtenis, niet zijnde een handeling van het bestuursorgaan of van de
      subsidie-ontvanger, heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel433
  - number: 4:34.1
    text: |-
      Voor zover een subsidie wordt verleend ten laste van een begroting die nog niet is vastgesteld of goedgekeurd, kan
      zij worden verleend onder de voorwaarde dat voldoende gelden ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel434
  - number: 4:34.2
    text: |-
      De voorwaarde kan niet worden gesteld, voor zover zulks voortvloeit uit het wettelijk voorschrift waarop de
      subsidie berust.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel434
  - number: 4:34.3
    text: |-
      De voorwaarde vervalt, indien het bestuursorgaan daarop niet binnen vier weken na de vaststelling of goedkeuring
      van de begroting een beroep heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel434
  - number: 4:34.4
    text: |-
      Het beroep op de voorwaarde geschiedt bij een subsidie voor een activiteit die door het bestuursorgaan ook in het
      voorafgaande begrotingsjaar werd gesubsidieerd door een intrekking wegens veranderde omstandigheden overeenkomstig
      [artikel 4:50][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel434
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
        hoofdstuk: '4'
        afdeling: 4.2.6
  - number: 4:34.5
    text: |-
      In andere gevallen geschiedt het beroep op de voorwaarde door een intrekking overeenkomstig
      [artikel 4:48, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel434
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
        hoofdstuk: '4'
        afdeling: 4.2.6
  - number: 4:35.1
    text: 'De subsidieverlening kan in ieder geval worden geweigerd indien een gegronde reden bestaat om aan te nemen dat:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel435
  - number: 4:35.1.a
    text: de activiteiten niet of niet geheel zullen plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel435
  - number: 4:35.1.b
    text: de aanvrager niet zal voldoen aan de aan de subsidie verbonden verplichtingen;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel435
  - number: 4:35.1.c
    text: |-
      de aanvrager niet op een behoorlijke wijze rekening en verantwoording zal afleggen omtrent de verrichte
      activiteiten en de daaraan verbonden uitgaven en inkomsten, voor zover deze voor de vaststelling van de subsidie
      van belang zijn.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel435
  - number: 4:35.2
    text: 'De subsidieverlening kan voorts in ieder geval worden geweigerd indien de aanvrager:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel435
  - number: 4:35.2.a
    text: |-
      in het kader van de aanvraag onjuiste of onvolledige gegevens heeft verstrekt en de verstrekking van deze gegevens
      tot een onjuiste beschikking op de aanvraag zou hebben geleid, of
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel435
  - number: 4:35.2.b
    text: |-
      failliet is verklaard of aan hem surséance van betaling is verleend of ten aanzien van hem de
      schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, dan wel een verzoek daartoe bij de
      rechtbank is ingediend.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel435
  - number: 4:36.1
    text: Ter uitvoering van de beschikking tot subsidieverlening kan een overeenkomst worden gesloten.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel436
  - number: 4:36.2
    text: |-
      Tenzij bij wettelijk voorschrift anders is bepaald of de aard van de subsidie zich daartegen verzet, kan in de
      overeenkomst worden bepaald dat de subsidie-ontvanger verplicht is de activiteiten te verrichten waarvoor de
      subsidie is verleend.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel436
  - number: 4:37.1
    text: 'Het bestuursorgaan kan de subsidie-ontvanger verplichtingen opleggen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel437
  - number: 4:37.1.a
    text: aard en omvang van de activiteiten waarvoor subsidie wordt verleend;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel437
  - number: 4:37.1.b
    text: de administratie van aan de activiteiten verbonden uitgaven en inkomsten;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel437
  - number: 4:37.1.c
    text: |-
      het vóór de subsidievaststelling verstrekken van gegevens en bescheiden die nodig zijn voor een beslissing omtrent
      de subsidie;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel437
  - number: 4:37.1.d
    text: de te verzekeren risico’s;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel437
  - number: 4:37.1.e
    text: het stellen van zekerheid voor verleende voorschotten;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel437
  - number: 4:37.1.f
    text: |-
      het afleggen van rekening en verantwoording omtrent de verrichte activiteiten en de daaraan verbonden uitgaven en
      inkomsten, voor zover deze voor de vaststelling van de subsidie van belang zijn;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel437
  - number: 4:37.1.g
    text: het beperken of wegnemen van de nadelige gevolgen van de subsidie voor derden;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel437
  - number: 4:37.1.h
    text: |-
      het uitoefenen van controle door een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1] op het door het bestuursorgaan gevoerde
      financiële beheer en de financiële verantwoording daarover.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel437
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 4:37.2
    text: |-
      Indien een verplichting als bedoeld in het eerste lid, onderdeel *c*, wordt opgelegd, zijn de [artikelen 4:3][ref1]
      en [4:4][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel437
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
        hoofdstuk: '4'
        afdeling: 4.1.1
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
        hoofdstuk: '4'
        afdeling: 4.1.1
  - number: 4:38.1
    text: |-
      Het bestuursorgaan kan de subsidie-ontvanger ook andere verplichtingen opleggen die strekken tot verwezenlijking
      van het doel van de subsidie.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel438
  - number: 4:38.2
    text: |-
      Indien de subsidie op een wettelijk voorschrift berust, worden de verplichtingen opgelegd bij wettelijk voorschrift
      of krachtens wettelijk voorschrift bij de subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel438
  - number: 4:38.3
    text: |-
      Indien de subsidie niet op een wettelijk voorschrift berust, kunnen de verplichtingen worden opgelegd bij de
      subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel438
  - number: 4:39.1
    text: |-
      Verplichtingen die niet strekken tot verwezenlijking van het doel van de subsidie kunnen slechts aan de subsidie
      worden verbonden voor zover dit bij wettelijk voorschrift is bepaald.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel439
  - number: 4:39.2
    text: |-
      Verplichtingen als bedoeld in het eerste lid kunnen slechts betrekking hebben op de wijze waarop of de middelen
      waarmee de gesubsidieerde activiteit wordt verricht.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel439
  - number: 4:40
    text: |-
      De verplichtingen kunnen na de subsidieverlening worden uitgewerkt, voor zover de beschikking tot subsidieverlening
      dit vermeldt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel440
  - number: 4:41.1
    text: |-
      In de gevallen, genoemd in het tweede lid, is de subsidie-ontvanger, voor zover het verstrekken van de subsidie
      heeft geleid tot vermogensvorming, daarvoor een vergoeding verschuldigd aan het bestuursorgaan, mits:
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel441
  - number: 4:41.1.a
    text: |-
      dit bij wettelijk voorschrift of, indien de subsidie niet op een wettelijk voorschrift berust, bij de
      subsidieverlening is bepaald, en
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel441
  - number: 4:41.1.b
    text: daarbij is aangegeven hoe de hoogte van de vergoeding wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel441
  - number: 4:41.2
    text: 'De vergoeding is slechts verschuldigd indien:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel441
  - number: 4:41.2.a
    text: |-
      de subsidie-ontvanger voor de gesubsidieerde activiteiten gebruikte of bestemde goederen vervreemdt of bezwaart of
      de bestemming daarvan wijzigt;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel441
  - number: 4:41.2.b
    text: |-
      de subsidie-ontvanger een schadevergoeding ontvangt voor verlies of beschadiging van voor de gesubsidieerde
      activiteiten gebruikte of bestemde goederen;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel441
  - number: 4:41.2.c
    text: de gesubsidieerde activiteiten geheel of gedeeltelijk worden beëindigd;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel441
  - number: 4:41.2.d
    text: de subsidieverlening of de subsidievaststelling wordt ingetrokken of de subsidie wordt beëindigd, of
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel441
  - number: 4:41.2.e
    text: de rechtspersoon die de subsidie ontving wordt ontbonden.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel441
  - number: 4:41.3
    text: |-
      De vergoeding wordt vastgesteld binnen een jaar nadat het bestuursorgaan op de hoogte is gekomen of kon zijn van de
      gebeurtenis die het recht op vergoeding deed ontstaan, doch in ieder geval binnen vijf jaren na de bekendmaking van
      de laatste beschikking tot subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel441
  - number: 4:42
    text: |-
      De beschikking tot subsidievaststelling stelt het bedrag van de subsidie vast en geeft aanspraak op betaling van
      het vastgestelde bedrag overeenkomstig [afdeling 4.2.7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel442
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '4'
        afdeling: 4.2.7
  - number: 4:43.1
    text: |-
      Indien geen beschikking tot subsidieverlening is gegeven, bevat de beschikking tot subsidievaststelling een
      aanduiding van de activiteiten waarvoor subsidie wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel443
  - number: 4:43.2
    text: |-
      De [artikelen 4:32][ref1], [4:35, tweede lid][ref2], [4:38][ref3] en [4:39][ref4] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel443
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
        hoofdstuk: '4'
        afdeling: 4.2.3
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
        hoofdstuk: '4'
        afdeling: 4.2.3
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
        hoofdstuk: '4'
        afdeling: 4.2.4
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '4'
        hoofdstuk: '4'
        afdeling: 4.2.4
  - number: 4:44.1
    text: |-
      Indien een beschikking tot subsidieverlening is gegeven, dient de subsidie-ontvanger na afloop van de activiteiten
      of het tijdvak waarvoor de subsidie is verleend een aanvraag tot vaststelling van de subsidie in, tenzij:
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel444
  - number: 4:44.1.a
    text: |-
      de subsidie met toepassing van [artikel 4:47, onderdeel ][ref1], ambtshalve wordt vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel444
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
        hoofdstuk: '4'
        afdeling: 4.2.5
  - number: 4:44.1.b
    text: |-
      bij wettelijk voorschrift of bij de subsidieverlening is bepaald dat de aanvraag wordt ingediend telkens na afloop
      van een gedeelte van het tijdvak waarvoor de subsidie is verleend, of
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel444
  - number: 4:44.1.c
    text: |-
      de vaststelling van de subsidie bij een overeenkomst als bedoeld in [artikel 4:36, eerste lid][ref1], anders is
      geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel444
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
        hoofdstuk: '4'
        afdeling: 4.2.3
  - number: 4:44.2
    text: |-
      Indien bij wettelijk voorschrift geen termijn is bepaald, wordt de aanvraag tot vaststelling ingediend binnen een
      bij de subsidieverlening te bepalen termijn.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel444
  - number: 4:44.3
    text: |-
      Indien voor de indiening van de aanvraag tot vaststelling geen termijn is bepaald of de aanvraag na afloop van de
      daarvoor bepaalde termijn niet is ingediend kan het bestuursorgaan de subsidie-ontvanger een termijn stellen binnen
      welke de aanvraag moet zijn ingediend.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel444
  - number: 4:44.4
    text: Indien na afloop van deze termijn geen aanvraag is ingediend, kan de subsidie ambtshalve worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel444
  - number: 4:45.1
    text: |-
      Bij de aanvraag tot subsidievaststelling toont de aanvrager aan dat de activiteiten hebben plaatsgevonden
      overeenkomstig de aan de subsidie verbonden verplichtingen, tenzij de subsidie voor de aanvang van de activiteiten
      wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel445
  - number: 4:45.2
    text: |-
      Bij de aanvraag tot subsidievaststelling legt de aanvrager rekening en verantwoording af omtrent de aan de
      activiteiten verbonden uitgaven en inkomsten, voor zover deze voor de vaststelling van de subsidie van belang zijn.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel445
  - number: 4:46.1
    text: |-
      Indien een beschikking tot subsidieverlening is gegeven, stelt het bestuursorgaan de subsidie overeenkomstig de
      subsidieverlening vast.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel446
  - number: 4:46.2
    text: 'De subsidie kan lager worden vastgesteld indien:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel446
  - number: 4:46.2.a
    text: de activiteiten waarvoor subsidie is verleend niet of niet geheel hebben plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel446
  - number: 4:46.2.b
    text: de subsidie-ontvanger niet heeft voldaan aan de aan de subsidie verbonden verplichtingen;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel446
  - number: 4:46.2.c
    text: |-
      de subsidie-ontvanger onjuiste of onvolledige gegevens heeft verstrekt en de verstrekking van juiste of volledige
      gegevens tot een andere beschikking op de aanvraag tot subsidieverlening zou hebben geleid, of
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel446
  - number: 4:46.2.d
    text: de subsidieverlening anderszins onjuist was en de subsidie-ontvanger dit wist of behoorde te weten.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel446
  - number: 4:46.3
    text: |-
      Voor zover het bedrag van de subsidie afhankelijk is van de werkelijke kosten van de activiteiten waarvoor subsidie
      is verleend, worden kosten die in redelijkheid niet als noodzakelijk kunnen worden beschouwd bij de vaststelling
      van de subsidie niet in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel446
  - number: 4:47
    text: 'Het bestuursorgaan kan de subsidie geheel of gedeeltelijk ambtshalve vaststellen, indien:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel447
  - number: 4:47.a
    text: |-
      bij wettelijk voorschrift of bij de subsidieverlening een termijn is bepaald binnen welke de subsidie ambtshalve
      wordt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel447
  - number: 4:47.b
    text: |-
      toepassing wordt gegeven aan [artikel 4:44, vierde lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel447
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
        hoofdstuk: '4'
        afdeling: 4.2.5
  - number: 4:47.c
    text: |-
      de beschikking tot subsidieverlening of de beschikking tot subsidievaststelling wordt ingetrokken of ten nadele van
      de ontvanger wordt gewijzigd.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel447
  - number: 4:48.1
    text: |-
      Zolang de subsidie niet is vastgesteld kan het bestuursorgaan de subsidieverlening intrekken of ten nadele van de
      subsidie-ontvanger wijzigen, indien:
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel448
  - number: 4:48.1.a
    text: de activiteiten waarvoor subsidie is verleend niet of niet geheel hebben plaatsgevonden of zullen plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel448
  - number: 4:48.1.b
    text: de subsidie-ontvanger niet heeft voldaan aan de aan de subsidie verbonden verplichtingen;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel448
  - number: 4:48.1.c
    text: |-
      de subsidie-ontvanger onjuiste of onvolledige gegevens heeft verstrekt en de verstrekking van juiste of volledige
      gegevens tot een andere beschikking op de aanvraag tot subsidieverlening zou hebben geleid;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel448
  - number: 4:48.1.d
    text: de subsidieverlening anderszins onjuist was en de subsidie-ontvanger dit wist of behoorde te weten, of
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel448
  - number: 4:48.1.e
    text: |-
      met toepassing van [artikel 4:34, vijfde lid][ref1], een beroep wordt gedaan op de voorwaarde dat voldoende gelden
      ter beschikking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel448
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
        hoofdstuk: '4'
        afdeling: 4.2.3
  - number: 4:48.2
    text: |-
      De intrekking of wijziging werkt terug tot en met het tijdstip waarop de subsidie is verleend, tenzij bij de
      intrekking of wijziging anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel448
  - number: 4:49.1
    text: 'Het bestuursorgaan kan de subsidievaststelling intrekken of ten nadele van de ontvanger wijzigen:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel449
  - number: 4:49.1.a
    text: |-
      op grond van feiten of omstandigheden waarvan het bij de subsidievaststelling redelijkerwijs niet op de hoogte kon
      zijn en op grond waarvan de subsidie lager dan overeenkomstig de subsidieverlening zou zijn vastgesteld;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel449
  - number: 4:49.1.b
    text: indien de subsidievaststelling onjuist was en de subsidie-ontvanger dit wist of behoorde te weten, of
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel449
  - number: 4:49.1.c
    text: |-
      indien de subsidie-ontvanger na de subsidievaststelling niet heeft voldaan aan aan de subsidie verbonden
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel449
  - number: 4:49.2
    text: |-
      De intrekking of wijziging werkt terug tot en met het tijdstip waarop de subsidie is vastgesteld, tenzij bij de
      intrekking of wijziging anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel449
  - number: 4:49.3
    text: |-
      De subsidievaststelling kan niet meer worden ingetrokken of ten nadele van de ontvanger worden gewijzigd indien
      vijf jaren zijn verstreken sedert de dag waarop zij is bekendgemaakt dan wel, in het geval, bedoeld in het eerste
      lid, onderdeel *c*, sedert de dag waarop de handeling in strijd met de verplichting is verricht of de dag waarop
      aan de verplichting had moeten zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel449
  - number: 4:50.1
    text: |-
      Zolang de subsidie niet is vastgesteld kan het bestuursorgaan de subsidieverlening met inachtneming van een
      redelijke termijn intrekken of ten nadele van de subsidie-ontvanger wijzigen:
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel450
  - number: 4:50.1.a
    text: voor zover de subsidieverlening onjuist is;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel450
  - number: 4:50.1.b
    text: |-
      voor zover veranderde omstandigheden of gewijzigde inzichten zich in overwegende mate tegen voortzetting of
      ongewijzigde voortzetting van de subsidie verzetten, of
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel450
  - number: 4:50.1.c
    text: in andere bij wettelijk voorschrift geregelde gevallen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel450
  - number: 4:50.2
    text: |-
      Bij intrekking of wijziging op grond van het eerste lid, onderdeel *a* of *b*, vergoedt het bestuursorgaan de
      schade die de subsidie-ontvanger lijdt doordat hij in vertrouwen op de subsidie anders heeft gehandeld dan hij
      zonder subsidie zou hebben gedaan.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel450
  - number: 4:51.1
    text: |-
      Indien aan een subsidie-ontvanger voor drie of meer achtereenvolgende jaren subsidie is verstrekt voor dezelfde
      of in hoofdzaak dezelfde voortdurende activiteiten, geschiedt gehele of gedeeltelijke weigering van de subsidie
      voor een daarop aansluitend tijdvak op de grond, dat veranderde omstandigheden of gewijzigde inzichten zich tegen
      voortzetting of ongewijzigde voortzetting van de subsidie verzetten, slechts met inachtneming van een redelijke
      termijn.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel451
  - number: 4:51.2
    text: |-
      Voor zover aan het einde van het tijdvak waarvoor subsidie is verleend sedert de bekendmaking van het voornemen tot
      weigering voor een daarop aansluitend tijdvak nog geen redelijke termijn is verstreken, wordt de subsidie voor het
      resterende deel van die termijn verleend, zo nodig in afwijking van [artikel 4:25, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel451
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
        hoofdstuk: '4'
        afdeling: 4.2.2
  - number: 4:52.1
    text: |-
      Het subsidiebedrag wordt overeenkomstig de subsidievaststelling betaald, onder verrekening van de betaalde
      voorschotten.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel452
  - number: 4:52.2
    text: |-
      Het subsidiebedrag wordt binnen vier weken na de subsidievaststelling betaald, tenzij bij wettelijk voorschrift
      anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel452
  - number: 4:52.3
    text: |-
      Indien de subsidie niet op een wettelijk voorschrift berust, kan bij de subsidieverlening, of, indien geen
      beschikking tot subsidieverlening is gegeven, bij de subsidievaststelling, een andere termijn worden bepaald
      waarbinnen het subsidiebedrag wordt betaald.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel452
  - number: 4:53.1
    text: |-
      Het subsidiebedrag kan in gedeelten worden betaald, mits bij wettelijk voorschrift is bepaald hoe de gedeelten
      worden berekend en op welke tijdstippen zij worden betaald.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel453
  - number: 4:53.2
    text: |-
      Indien de subsidie niet op een wettelijk voorschrift berust, kan het subsidiebedrag in gedeelten worden
      betaald, mits bij de subsidieverlening, of indien geen beschikking tot subsidieverlening is gegeven, bij de
      subsidievaststelling, is bepaald hoe de gedeelten worden berekend en op welke tijdstippen zij worden betaald.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel453
  - number: 4:54.1
    text: |-
      Het bestuursorgaan kan de subsidie-ontvanger voorschotten verlenen, voor zover dit bij wettelijk voorschrift of bij
      de subsidieverlening is bepaald.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel454
  - number: 4:54.2
    text: |-
      De beschikking tot voorschotverlening vermeldt het bedrag van het voorschot, dan wel de wijze waarop dit bedrag
      wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel454
  - number: 4:55.1
    text: Voorschotten worden overeenkomstig de voorschotverlening betaald.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel455
  - number: 4:55.2
    text: |-
      De voorschotten worden binnen vier weken na de voorschotverlening betaald, tenzij bij wettelijk voorschrift of bij
      de voorschotverlening anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel455
  - number: 4:56
    text: |-
      De verplichting tot betaling van een subsidiebedrag of een voorschot wordt opgeschort met ingang van de dag waarop
      het bestuursorgaan aan de subsidie-ontvanger schriftelijk kennis geeft van het ernstige vermoeden dat er grond
      bestaat om toepassing te geven aan [artikel 4:48][ref1] of [4:49][ref2], tot en met de dag waarop de beschikking
      omtrent de intrekking of wijziging is bekendgemaakt of de dag waarop sedert de kennisgeving van het ernstige
      vermoeden dertien weken zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel456
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
        hoofdstuk: '4'
        afdeling: 4.2.6
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
        hoofdstuk: '4'
        afdeling: 4.2.6
  - number: 4:57
    text: |-
      Onverschuldigd betaalde subsidiebedragen en voorschotten kunnen worden teruggevorderd voor zover na de dag waarop
      de subsidie is vastgesteld, dan wel de handeling als bedoeld in [artikel 4:49, eerste lid, onderdeel c][ref1],
      heeft plaatsgevonden, nog geen vijf jaren zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel457
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
        hoofdstuk: '4'
        afdeling: 4.2.6
  - number: 4:58.1
    text: |-
      Deze afdeling is van toepassing op per boekjaar verstrekte subsidies, indien dat bij wettelijk voorschrift of bij
      besluit van het bestuursorgaan is bepaald.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel458
  - number: 4:58.2
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat deze afdeling van toepassing is op daarbij aangewezen
      subsidies.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel458
  - number: 4:59.1
    text: |-
      Het bestuursorgaan dat met toepassing van deze afdeling een subsidie verleent kan een of meer toezichthouders
      aanwijzen die zijn belast met het toezicht op de naleving van de aan de ontvanger van die subsidie opgelegde
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel459
  - number: 4:59.2
    text: |-
      De toezichthouder beschikt niet over de bevoegdheden, vermeld in de [artikelen 5:18][ref1] en [5:19][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel459
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.2'
  - number: 4:60
    text: |-
      Tenzij bij wettelijk voorschrift anders is bepaald, wordt de aanvraag van de subsidie uiterlijk dertien weken voor
      de aanvang van het boekjaar ingediend.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel460
  - number: 4:61.1
    text: 'De aanvraag van de subsidie gaat in ieder geval vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel461
  - number: 4:61.1.a
    text: een activiteitenplan, tenzij redelijkerwijs kan worden aangenomen dat daaraan geen behoefte is, en
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel461
  - number: 4:61.1.b
    text: een begroting, tenzij deze voor de berekening van het bedrag van de subsidie niet van belang is.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel461
  - number: 4:61.2
    text: |-
      Indien de aanvrager beschikt over een egalisatiereserve als bedoeld in [artikel 4:72][ref1], vermeldt de aanvraag
      de omvang daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel461
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.2.8.4
        afdeling: 4.2.8
  - number: 4:62
    text: |-
      Het activiteitenplan behelst een overzicht van de activiteiten waarvoor subsidie wordt gevraagd en de daarmee
      nagestreefde doelstellingen en vermeldt per activiteit de daarvoor benodigde personele en materiële middelen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel462
  - number: 4:63.1
    text: |-
      De begroting behelst een overzicht van de voor het boekjaar geraamde inkomsten en uitgaven van de aanvrager, voor
      zover deze betrekking hebben op de activiteiten waarvoor subsidie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel463
  - number: 4:63.2
    text: De begrotingsposten worden ieder afzonderlijk van een toelichting voorzien.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel463
  - number: 4:63.3
    text: |-
      Tenzij voor de activiteiten waarop de aanvraag betrekking heeft nog niet eerder subsidie werd verstrekt, behelst de
      begroting een vergelijking met de begroting van het lopende boekjaar en de gerealiseerde inkomsten en uitgaven van
      het jaar, voorafgaand aan het lopende boekjaar.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel463
  - number: 4:64.1
    text: |-
      Tenzij de aanvraag wordt ingediend door een krachtens publiekrecht ingestelde rechtspersoon, gaat deze, indien voor
      het jaar voorafgaand aan het subsidiejaar geen subsidie werd aangevraagd, voorts vergezeld van:
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel464
  - number: 4:64.1.a
    text: |-
      een afschrift van de oprichtingsakte van de rechtspersoon dan wel van de statuten zoals deze laatstelijk zijn
      gewijzigd, en
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel464
  - number: 4:64.1.b
    text: |-
      de laatst opgemaakte jaarrekening als bedoeld in [artikel 361 van Boek 2 van het Burgerlijk Wetboek][ref1] dan
      wel de balans en de staat van baten en lasten en de toelichting daarop of, indien deze bescheiden ontbreken, een
      verslag over de financiële positie van de aanvrager op het moment van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel361
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel464
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '361'
  - number: 4:64.2
    text: |-
      De in het eerste lid, onderdeel b, bedoelde bescheiden dan wel het verslag over de financiële positie zijn voorzien
      van een van een accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1]
      afkomstige schriftelijke verklaring omtrent de getrouwheid onderscheidenlijk een mededeling, inhoudende dat van
      onjuistheden niet is gebleken.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel464
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 4:64.3
    text: |-
      Bij wettelijk voorschrift of bij besluit van het bestuursorgaan kan vrijstelling of ontheffing worden verleend van
      het in het tweede lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel464
  - number: 4:65
    text: |-
      Voor zover de aanvrager voor dezelfde begrote uitgaven tevens subsidie heeft aangevraagd bij een of meer andere
      bestuursorganen, doet hij daarvan mededeling in de aanvraag, onder vermelding van de stand van zaken met betrekking
      tot de beoordeling van die aanvraag of aanvragen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel465
  - number: 4:66
    text: De subsidie wordt slechts verleend aan een rechtspersoon met volledige rechtsbevoegdheid.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel466
  - number: 4:67.1
    text: De subsidie wordt voor een boekjaar of voor een bepaald aantal boekjaren verleend.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel467
  - number: 4:67.2
    text: |-
      Indien de subsidie voor twee of meer boekjaren wordt verleend, wordt aan de subsidie de verplichting verbonden
      tot het periodiek aan het bestuursorgaan verstrekken van de gegevens die voor de vaststelling van de subsidie van
      belang zijn.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel467
  - number: 4:67.3
    text: |-
      De beschikking tot subsidieverlening vermeldt welke gegevens de subsidie-ontvanger krachtens het tweede lid moet
      verstrekken, alsmede op welke tijdstippen de gegevens moeten worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel467
  - number: 4:68
    text: |-
      Tenzij bij wettelijk voorschrift of bij de subsidieverlening anders is bepaald, stelt de subsidie-ontvanger het
      boekjaar gelijk aan het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel468
  - number: 4:69.1
    text: |-
      De subsidie-ontvanger voert een zodanig ingerichte administratie, dat daaruit te allen tijde de voor de
      vaststelling van de subsidie van belang zijnde rechten en verplichtingen alsmede de betalingen en de ontvangsten
      kunnen worden nagegaan.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel469
  - number: 4:69.2
    text: De administratie en de daartoe behorende bescheiden worden gedurende zeven jaren bewaard.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel469
  - number: 4:70
    text: |-
      Indien gedurende het boekjaar aanmerkelijke verschillen ontstaan of dreigen te ontstaan tussen de werkelijke
      uitgaven en inkomsten en de begrote uitgaven en inkomsten doet de subsidie-ontvanger daarvan onverwijld mededeling
      aan het bestuursorgaan onder vermelding van de oorzaak van de verschillen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel470
  - number: 4:71.1
    text: |-
      Indien dit bij wettelijk voorschrift of bij de subsidieverlening is bepaald, behoeft de subsidie-ontvanger de
      toestemming van het bestuursorgaan voor:
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel471
  - number: 4:71.1.a
    text: het oprichten van dan wel deelnemen in een rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel471
  - number: 4:71.1.b
    text: het wijzigen van de statuten;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel471
  - number: 4:71.1.c
    text: |-
      het in eigendom verwerven, het vervreemden of het bezwaren van registergoederen, indien zij mede zijn verworven
      door middel van de subsidiegelden, dan wel de lasten daarvoor mede worden bekostigd uit de subsidiegelden;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel471
  - number: 4:71.1.d
    text: |-
      het aangaan en beëindigen van overeenkomsten tot verkrijging, vervreemding of bezwaring van registergoederen of
      tot huur, verhuur of pacht daarvan, indien deze goederen geheel of gedeeltelijk zijn verworven door middel van de
      subsidie dan wel de uitgaven daarvoor mede zijn bekostigd uit de subsidie;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel471
  - number: 4:71.1.e
    text: het aangaan van kredietovereenkomsten en van overeenkomsten van geldlening;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel471
  - number: 4:71.1.f
    text: |-
      het aangaan van overeenkomsten waarbij de subsidie-ontvanger zich verbindt tot zekerheidsstelling met inbegrip van
      zekerheidsstelling voor schulden van derden of waarbij hij zich als borg of hoofdelijk medeschuldenaar verbindt of
      zich voor een derde sterk maakt;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel471
  - number: 4:71.1.g
    text: het vormen van fondsen en reserveringen;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel471
  - number: 4:71.1.h
    text: |-
      het vaststellen of wijzigen van tarieven voor door de subsidie-ontvanger in de gewone uitoefening van zijn
      gesubsidieerde activiteiten te verrichten prestaties;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel471
  - number: 4:71.1.i
    text: het ontbinden van de rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel471
  - number: 4:71.1.j
    text: het doen van aangifte tot zijn faillissement of het aanvragen van zijn surséance van betaling.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel471
  - number: 4:71.2
    text: Het bestuursorgaan beslist binnen vier weken omtrent de toestemming.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel471
  - number: 4:71.3
    text: De beslissing kan eenmaal voor ten hoogste vier weken worden verdaagd.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel471
  - number: 4:71.4
    text: Indien omtrent de toestemming niet tijdig is beslist, wordt de toestemming geacht te zijn verleend.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel471
  - number: 4:72.1
    text: |-
      Indien dit bij wettelijk voorschrift of bij de subsidieverlening is bepaald, vormt de ontvanger een
      egalisatiereserve.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel472
  - number: 4:72.2
    text: |-
      Het verschil tussen de vastgestelde subsidie en de werkelijke kosten van de activiteiten waarvoor subsidie werd
      verleend komt ten gunste onderscheidenlijk ten laste van de egalisatiereserve.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel472
  - number: 4:72.3
    text: De egalisatiereserve wordt zo hoog rentend en zo veilig als redelijkerwijs mogelijk is belegd.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel472
  - number: 4:72.4
    text: De van de egalisatiereserve genoten rente wordt aan de egalisatiereserve toegevoegd.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel472
  - number: 4:72.5
    text: |-
      In de gevallen bedoeld in [artikel 4:41, tweede lid, onderdelen c, d en e][ref1], is de subsidie-ontvanger
      ter zake van de egalisatiereserve vergoedingsplichtig naar evenredigheid van de mate waarin de subsidie aan de
      egalisatiereserve heeft bijgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel472
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
        hoofdstuk: '4'
        afdeling: 4.2.4
  - number: 4:73
    text: De subsidie wordt per boekjaar vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel473
  - number: 4:74
    text: |-
      De subsidie-ontvanger dient binnen zes maanden na afloop van het boekjaar een aanvraag tot vaststelling
      van de subsidie in, tenzij bij wettelijk voorschrift anders is bepaald of de subsidie met toepassing van
      [artikel 4:67, tweede lid][ref1], voor twee of meer boekjaren is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel474
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.2.8.3
        afdeling: 4.2.8
  - number: 4:75.1
    text: De aanvraag tot vaststelling gaat in ieder geval vergezeld van een financieel verslag en een activiteitenverslag.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel475
  - number: 4:75.2
    text: |-
      Indien de subsidie-ontvanger ingevolge wettelijk voorschrift verplicht is tot het opstellen van een
      jaarrekening als bedoeld in [artikel 361 van Boek 2 van het Burgerlijk Wetboek][ref1], of indien dit bij de
      subsidieverlening is bepaald, legt hij in plaats van het financieel verslag de jaarrekening over, onverminderd
      [artikel 4:45, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel361
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel475
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '361'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
        hoofdstuk: '4'
        afdeling: 4.2.5
  - number: 4:76.1
    text: |-
      Indien de subsidie-ontvanger zijn inkomsten geheel ontleent aan de subsidie omvat het financiële verslag de balans
      en de exploitatierekening met de toelichting en zijn het tweede tot en met vijfde lid van toepassing.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel476
  - number: 4:76.2
    text: |-
      Het financiële verslag geeft volgens normen die in het maatschappelijk verkeer als aanvaardbaar worden beschouwd,
      een zodanig inzicht dat een verantwoord oordeel kan worden gevormd omtrent:
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel476
  - number: 4:76.2.a
    text: het vermogen en het exploitatiesaldo, en
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel476
  - number: 4:76.2.b
    text: |-
      voor zover de aard van het financiële verslag dat toelaat, omtrent de solvabiliteit en de liquiditeit van de
      subsidie-ontvanger.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel476
  - number: 4:76.3
    text: |-
      De balans met de toelichting geeft getrouw, duidelijk en stelselmatig de grootte en de samenstelling in actief- en
      passiefposten van het vermogen op het einde van het boekjaar weer.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel476
  - number: 4:76.4
    text: |-
      De exploitatierekening met de toelichting geeft getrouw, duidelijk en stelselmatig de grootte van het
      exploitatiesaldo van het boekjaar weer.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel476
  - number: 4:76.5
    text: |-
      Het financiële verslag sluit aan op de begroting waarvoor subsidie is verleend en behelst een vergelijking met de
      gerealiseerde inkomsten en uitgaven van het jaar, voorafgaand aan het boekjaar.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel476
  - number: 4:77
    text: |-
      Indien de subsidie-ontvanger zijn inkomsten in overwegende mate ontleent aan de subsidie kan bij wettelijk
      voorschrift of bij de subsidieverlening worden bepaald dat [artikel 4:76][ref1] van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel477
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.2.8.5
        afdeling: 4.2.8
  - number: 4:78.1
    text: |-
      De subsidie-ontvanger geeft opdracht tot onderzoek van het financiële verslag aan een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel478
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 4:78.2
    text: |-
      De accountant onderzoekt of het financiële verslag voldoet aan de bij of krachtens de wet gestelde voorschriften en
      of het activiteitenverslag, voor zover hij dat verslag kan beoordelen, met het financiële verslag verenigbaar is.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel478
  - number: 4:78.3
    text: |-
      De accountant geeft de uitslag van zijn onderzoek weer in een schriftelijke verklaring omtrent de getrouwheid van
      het financiële verslag.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel478
  - number: 4:78.4
    text: De aanvraag tot vaststelling van de subsidie gaat vergezeld van de in het derde lid bedoelde verklaring.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel478
  - number: 4:78.5
    text: |-
      Bij wettelijk voorschrift of bij de subsidieverlening kan vrijstelling of ontheffing worden verleend van het eerste
      tot en met het vierde lid.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel478
  - number: 4:79.1
    text: |-
      Bij wettelijk voorschrift of bij de subsidieverlening kan worden bepaald dat de in
      [artikel 4:78, eerste lid][ref1], bedoelde opdracht tevens strekt tot onderzoek van de naleving van aan de subsidie
      verbonden verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel479
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.2.8.5
        afdeling: 4.2.8
  - number: 4:79.2
    text: |-
      Bij toepassing van het eerste lid gaat de opdracht vergezeld van een bij of krachtens wettelijk voorschrift of bij
      de subsidieverlening vast te stellen aanwijzing over de reikwijdte en de intensiteit van de controle.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel479
  - number: 4:79.3
    text: |-
      Bij toepassing van het eerste lid, gaat het financiële verslag tevens vergezeld van een schriftelijke verklaring
      van de accountant over de naleving door de subsidie-ontvanger van de aan de subsidie verbonden verplichtingen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel479
  - number: 4:80
    text: |-
      Het activiteitenverslag beschrijft de aard en omvang van de activiteiten waarvoor subsidie werd verleend en bevat
      een vergelijking tussen de nagestreefde en de gerealiseerde doelstellingen en een toelichting op de verschillen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel480
  - number: 4:81.1
    text: |-
      Een bestuursorgaan kan beleidsregels vaststellen met betrekking tot een hem toekomende of onder zijn
      verantwoordelijkheid uitgeoefende, dan wel door hem gedelegeerde bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel481
  - number: 4:81.2
    text: |-
      In andere gevallen kan een bestuursorgaan slechts beleidsregels vaststellen, voor zover dit bij wettelijk
      voorschrift is bepaald.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel481
  - number: 4:82
    text: |-
      Ter motivering van een besluit kan slechts worden volstaan met een verwijzing naar een vaste gedragslijn voor zover
      deze is neergelegd in een beleidsregel.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel482
  - number: 4:83
    text: |-
      Bij de bekendmaking van het besluit, inhoudende een beleidsregel, wordt zo mogelijk het wettelijk voorschrift
      vermeld waaruit de bevoegdheid waarop het besluit, inhoudende een beleidsregel, betrekking heeft voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel483
  - number: 4:84
    text: |-
      Het bestuursorgaan handelt overeenkomstig de beleidsregel, tenzij dat voor een of meer belanghebbenden gevolgen
      zou hebben die wegens bijzondere omstandigheden onevenredig zijn in verhouding tot de met de beleidsregel te dienen
      doelen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel484
  - number: 5:11
    text: |-
      Onder toezichthouder wordt verstaan: een persoon, bij of krachtens wettelijk voorschrift belast met het houden van
      toezicht op de naleving van het bepaalde bij of krachtens enig wettelijk voorschrift.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel511
  - number: 5:12.1
    text: |-
      Bij de uitoefening van zijn taak draagt een toezichthouder een legitimatiebewijs bij zich, dat is uitgegeven door
      het bestuursorgaan onder verantwoordelijkheid waarvan de toezichthouder werkzaam is.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel512
  - number: 5:12.2
    text: Een toezichthouder toont zijn legitimatiebewijs desgevraagd aanstonds.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel512
  - number: 5:12.3
    text: |-
      Het legitimatiebewijs bevat een foto van de toezichthouder en vermeldt in ieder geval diens naam en hoedanigheid.
      Het model van het legitimatiebewijs wordt vastgesteld bij regeling van Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel512
  - number: 5:13
    text: |-
      Een toezichthouder maakt van zijn bevoegdheden slechts gebruik voor zover dat redelijkerwijs voor de vervulling van
      zijn taak nodig is.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel513
  - number: 5:14
    text: |-
      Bij wettelijk voorschrift of bij besluit van het bestuursorgaan dat de toezichthouder als zodanig aanwijst, kunnen
      de aan de toezichthouder toekomende bevoegdheden worden beperkt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel514
  - number: 5:15.1
    text: |-
      Een toezichthouder is bevoegd, met medeneming van de benodigde apparatuur, elke plaats te betreden met uitzondering
      van een woning zonder toestemming van de bewoner.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel515
  - number: 5:15.2
    text: Zo nodig verschaft hij zich toegang met behulp van de sterke arm.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel515
  - number: 5:15.3
    text: Hij is bevoegd zich te doen vergezellen door personen die daartoe door hem zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel515
  - number: 5:16
    text: Een toezichthouder is bevoegd inlichtingen te vorderen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel516
  - number: 5:16a
    text: |-
      Een toezichthouder is bevoegd van personen inzage te vorderen van een identiteitsbewijs als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel516a
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 5:17.1
    text: Een toezichthouder is bevoegd inzage te vorderen van zakelijke gegevens en bescheiden.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel517
  - number: 5:17.2
    text: Hij is bevoegd van de gegevens en bescheiden kopieën te maken.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel517
  - number: 5:17.3
    text: |-
      Indien het maken van kopieën niet ter plaatse kan geschieden, is hij bevoegd de gegevens en bescheiden voor dat
      doel voor korte tijd mee te nemen tegen een door hem af te geven schriftelijk bewijs.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel517
  - number: 5:18.1
    text: Een toezichthouder is bevoegd zaken te onderzoeken, aan opneming te onderwerpen en daarvan monsters te nemen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel518
  - number: 5:18.2
    text: Hij is bevoegd daartoe verpakkingen te openen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel518
  - number: 5:18.3
    text: |-
      De toezichthouder neemt op verzoek van de belanghebbende indien mogelijk een tweede monster, tenzij bij of
      krachtens wettelijk voorschrift anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel518
  - number: 5:18.4
    text: |-
      Indien het onderzoek, de opneming of de monsterneming niet ter plaatse kan geschieden, is hij bevoegd de zaken voor
      dat doel voor korte tijd mee te nemen tegen een door hem af te geven schriftelijk bewijs.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel518
  - number: 5:18.5
    text: De genomen monsters worden voor zover mogelijk teruggegeven.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel518
  - number: 5:18.6
    text: |-
      De belanghebbende wordt op zijn verzoek zo spoedig mogelijk in kennis gesteld van de resultaten van het onderzoek,
      de opneming of de monsterneming.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel518
  - number: 5:19.1
    text: |-
      Een toezichthouder is bevoegd vervoermiddelen te onderzoeken met betrekking waartoe hij een toezichthoudende taak
      heeft.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel519
  - number: 5:19.2
    text: |-
      Hij is bevoegd vervoermiddelen waarmee naar zijn redelijk oordeel zaken worden vervoerd met betrekking waartoe hij
      een toezichthoudende taak heeft, op hun lading te onderzoeken.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel519
  - number: 5:19.3
    text: |-
      Hij is bevoegd van de bestuurder van een vervoermiddel inzage te vorderen van de wettelijk voorgeschreven
      bescheiden met betrekking waartoe hij een toezichthoudende taak heeft.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel519
  - number: 5:19.4
    text: |-
      Hij is bevoegd met het oog op de uitoefening van deze bevoegdheden van de bestuurder van een voertuig of van de
      schipper van een vaartuig te vorderen dat deze zijn vervoermiddel stilhoudt en naar een door hem aangewezen plaats
      overbrengt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel519
  - number: 5:19.5
    text: Bij regeling van Onze Minister van Justitie wordt bepaald op welke wijze de vordering tot stilhouden wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel519
  - number: 5:20.1
    text: |-
      Een ieder is verplicht aan een toezichthouder binnen de door hem gestelde redelijke termijn alle medewerking te
      verlenen die deze redelijkerwijs kan vorderen bij de uitoefening van zijn bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel520
  - number: 5:20.2
    text: |-
      Zij die uit hoofde van ambt, beroep of wettelijk voorschrift verplicht zijn tot geheimhouding, kunnen het verlenen
      van medewerking weigeren, voor zover dit uit hun geheimhoudingsplicht voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel520
  - number: 5:21
    text: |-
      Onder bestuursdwang wordt verstaan: het door feitelijk handelen door of vanwege een bestuursorgaan optreden tegen
      hetgeen in strijd met bij of krachtens enig wettelijk voorschrift gestelde verplichtingen is of wordt gedaan,
      gehouden of nagelaten.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel521
  - number: 5:22
    text: De bevoegdheid tot toepassing van bestuursdwang bestaat slechts indien zij bij of krachtens de wet is toegekend.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel522
  - number: 5:23
    text: Deze afdeling is niet van toepassing indien wordt opgetreden ter onmiddellijke handhaving van de openbare orde.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel523
  - number: 5:24.1
    text: |-
      Een beslissing tot toepassing van bestuursdwang wordt op schrift gesteld. De schriftelijke beslissing is een
      beschikking.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel524
  - number: 5:24.2
    text: De beschikking vermeldt welk voorschrift is of wordt overtreden.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel524
  - number: 5:24.3
    text: |-
      De bekendmaking geschiedt aan de overtreder, aan de rechthebbenden op het gebruik van de zaak ten aanzien waarvan
      bestuursdwang zal worden toegepast en aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel524
  - number: 5:24.4
    text: |-
      In de beschikking wordt een termijn gesteld waarbinnen de belanghebbenden de tenuitvoerlegging kunnen voorkomen
      door zelf maatregelen te treffen. Het bestuursorgaan omschrijft de te nemen maatregelen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel524
  - number: 5:24.5
    text: Geen termijn behoeft te worden gegund, indien de vereiste spoed zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel524
  - number: 5:24.6
    text: |-
      Indien de situatie dermate spoedeisend is dat het bestuursorgaan de beslissing tot toepassing van bestuursdwang
      niet tevoren op schrift kan stellen, zorgt het alsnog zo spoedig mogelijk voor de opschriftstelling en voor de
      bekendmaking.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel524
  - number: 5:25.1
    text: |-
      De overtreder is de kosten verbonden aan de toepassing van bestuursdwang verschuldigd, tenzij de kosten
      redelijkerwijze niet of niet geheel te zijnen laste behoren te komen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel525
  - number: 5:25.2
    text: De beschikking vermeldt dat de toepassing van bestuursdwang op kosten van de overtreder plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel525
  - number: 5:25.3
    text: |-
      Indien echter de kosten geheel of gedeeltelijk niet ten laste van de overtreder zullen worden gebracht, wordt zulks
      in de beschikking vermeld.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel525
  - number: 5:25.4
    text: |-
      Onder de kosten, bedoeld in het eerste lid, worden begrepen de kosten verbonden aan de voorbereiding
      van bestuursdwang, voor zover deze kosten zijn gemaakt na het tijdstip waarop de termijn, bedoeld in
      [artikel 5:24, vierde lid][ref1], is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel525
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.3'
  - number: 5:25.5
    text: |-
      De kosten zijn ook verschuldigd indien de bestuursdwang door opheffing van de onwettige situatie niet of niet
      volledig is uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel525
  - number: 5:25.6
    text: |-
      Onder de kosten, bedoeld in het eerste lid, worden tevens begrepen de kosten voortvloeiende uit de vergoeding van
      schade ingevolge [artikel 5:27, zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel525
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.3'
  - number: 5:26.1
    text: |-
      Het bestuursorgaan dat bestuursdwang heeft toegepast, kan van de overtreder bij dwangbevel de ingevolge
      [artikel 5:25][ref1] verschuldigde kosten, verhoogd met de op de invordering vallende kosten, invorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel526
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.3'
  - number: 5:26.2
    text: |-
      Het dwangbevel wordt op kosten van de overtreder bij deurwaardersexploit betekend en levert een executoriale titel
      op in de zin van het [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering](onbekend).
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel526
  - number: 5:26.3
    text: |-
      Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van de
      rechtspersoon waartoe het bestuursorgaan behoort.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel526
  - number: 5:26.4
    text: |-
      Het verzet schorst de tenuitvoerlegging. Op verzoek van de rechtspersoon kan de rechter de schorsing van de
      tenuitvoerlegging opheffen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel526
  - number: 5:27.1
    text: |-
      Om aan een beslissing tot toepassing van bestuursdwang uitvoering te geven, hebben personen die daartoe
      zijn aangewezen door het bestuursorgaan dat bestuursdwang toepast, toegang tot elke plaats, voor zover dat
      redelijkerwijs voor de vervulling van hun taak nodig is.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel527
  - number: 5:27.2
    text: |-
      Voor het binnentreden in een woning zonder toestemming van de bewoner is het bestuursorgaan
      dat bestuursdwang toepast bevoegd tot het geven van een machtiging als bedoeld in
      [artikel 2 van de Algemene wet op het binnentreden][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel2
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel527
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '2'
  - number: 5:27.3
    text: |-
      Een plaats die niet bij de overtreding is betrokken, wordt niet betreden dan nadat het bestuursorgaan dat
      bestuursdwang toepast dit de rechthebbende ten minste achtenveertig uren tevoren schriftelijk heeft aangezegd.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel527
  - number: 5:27.4
    text: |-
      Het derde lid geldt niet, indien tijdige aanzegging wegens de vereiste spoed niet mogelijk is. De aanzegging
      geschiedt dan zo spoedig mogelijk.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel527
  - number: 5:27.5
    text: De aanzegging omschrijft de wijze waarop het betreden zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel527
  - number: 5:27.6
    text: |-
      De rechtspersoon waartoe het bestuursorgaan behoort, vergoedt de schade die door het betreden van een
      plaats als bedoeld in het derde lid wordt veroorzaakt, voor zover deze redelijkerwijs niet ten laste van de
      rechthebbende behoort te komen, onverminderd het recht tot verhaal van deze schade op de overtreder ingevolge
      [artikel 5:25, zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel527
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.3'
  - number: 5:28
    text: |-
      Tot de bevoegdheid tot toepassing van bestuursdwang behoort het verzegelen van gebouwen, terreinen en hetgeen zich
      daarin of daarop bevindt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel528
  - number: 5:29.1
    text: |-
      Tot de bevoegdheid tot toepassing van bestuursdwang behoort het meevoeren en opslaan van daarvoor vatbare zaken
      voor zover de toepassing van bestuursdwang dit vereist.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel529
  - number: 5:29.2
    text: |-
      Indien zaken zijn meegevoerd en opgeslagen, doet het bestuursorgaan dat bestuursdwang heeft toegepast daarvan
      proces-verbaal opmaken, waarvan afschrift wordt verstrekt aan degene die de zaken onder zijn beheer had.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel529
  - number: 5:29.3
    text: |-
      Het bestuursorgaan draagt zorg voor de bewaring van de opgeslagen zaken en geeft deze zaken terug aan de
      rechthebbende.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel529
  - number: 5:29.4
    text: |-
      Het bestuursorgaan is bevoegd de afgifte op te schorten totdat de ingevolge [artikel 5:25][ref1] verschuldigde
      kosten zijn voldaan. Indien de rechthebbende niet tevens de overtreder is, is het bestuursorgaan bevoegd de afgifte
      op te schorten totdat de kosten van bewaring zijn voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel529
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.3'
  - number: 5:30.1
    text: |-
      Het bestuursorgaan dat bestuursdwang heeft toegepast, is bevoegd, indien een ingevolge
      [artikel 5:29, eerste lid][ref1], meegevoerde en opgeslagen zaak niet binnen dertien weken na de meevoering kan
      worden teruggegeven, deze te verkopen of, indien verkoop naar zijn oordeel niet mogelijk is, de zaak om niet aan
      een derde in eigendom over te dragen of te laten vernietigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel530
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.3'
  - number: 5:30.2
    text: |-
      Gelijke bevoegdheid heeft het bestuursorgaan ook binnen die termijn, zodra de ingevolge [artikel 5:25][ref1]
      verschuldigde kosten, vermeerderd met de voor de verkoop, de eigendomsoverdracht om niet of de vernietiging
      geraamde kosten, in verhouding tot de waarde van de zaak onevenredig hoog worden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel530
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.3'
  - number: 5:30.3
    text: |-
      Verkoop, eigendomsoverdracht of vernietiging vindt niet plaats binnen twee weken na de verstrekking van het
      afschrift, bedoeld in [artikel 5:29, tweede lid][ref1], tenzij het gevaarlijke stoffen of eerder aan bederf
      onderhevige stoffen betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel530
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.3'
  - number: 5:30.4
    text: |-
      Gedurende drie jaren na het tijdstip van verkoop heeft degene die op dat tijdstip eigenaar was, recht op de
      opbrengst van de zaak onder aftrek van de ingevolge [artikel 5:25][ref1] verschuldigde kosten en de kosten van de
      verkoop. Na het verstrijken van die termijn vervalt het eventuele batige saldo aan de rechtspersoon waartoe het
      bestuursorgaan behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel530
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.3'
  - number: 5:31
    text: |-
      Een beslissing tot toepassing van bestuursdwang wordt niet genomen zolang een ter zake van de betrokken overtreding
      reeds gegeven beschikking tot oplegging van een last onder dwangsom niet is ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel531
  - number: 5:32.1
    text: |-
      Een bestuursorgaan dat bevoegd is bestuursdwang toe te passen, kan in plaats daarvan aan de overtreder een last
      onder dwangsom opleggen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel532
  - number: 5:32.2
    text: |-
      Een last onder dwangsom strekt ertoe de overtreding ongedaan te maken of verdere overtreding dan wel een herhaling
      van de overtreding te voorkomen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel532
  - number: 5:32.3
    text: |-
      Voor het opleggen van een last onder dwangsom wordt niet gekozen, indien het belang dat het betrokken voorschrift
      beoogt te beschermen, zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel532
  - number: 5:32.4
    text: |-
      Het bestuursorgaan stelt de dwangsom vast hetzij op een bedrag ineens, hetzij op een bedrag per tijdseenheid waarin
      de last niet is uitgevoerd, dan wel per overtreding van de last. Het bestuursorgaan stelt tevens een bedrag vast
      waarboven geen dwangsom meer wordt verbeurd. Het vastgestelde bedrag staat in redelijke verhouding tot de zwaarte
      van het geschonden belang en de beoogde werking van de dwangsomoplegging.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel532
  - number: 5:32.5
    text: |-
      In de beschikking tot oplegging van een last onder dwangsom die strekt tot het ongedaan maken van een overtreding
      of het voorkomen van verdere overtreding, wordt een termijn gesteld gedurende welke de overtreder de last kan
      uitvoeren zonder dat een dwangsom wordt verbeurd.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel532
  - number: 5:33.1
    text: |-
      Verbeurde dwangsommen komen toe aan de rechtspersoon waartoe het bestuursorgaan behoort dat de dwangsom heeft
      vastgesteld. Het bestuursorgaan kan bij dwangbevel het verschuldigde bedrag, verhoogd met de op de invordering
      vallende kosten, invorderen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel533
  - number: 5:33.2
    text: |-
      [Artikel 5:26, tweede tot en met vierde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel533
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.3'
  - number: 5:34.1
    text: |-
      Het bestuursorgaan dat een last onder dwangsom heeft opgelegd, kan op verzoek van de overtreder de last opheffen,
      de looptijd ervan opschorten voor een bepaalde termijn of de dwangsom verminderen ingeval van blijvende of
      tijdelijke gehele of gedeeltelijke onmogelijkheid voor de overtreder om aan zijn verplichtingen te voldoen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel534
  - number: 5:34.2
    text: |-
      Het bestuursorgaan dat de last onder dwangsom heeft opgelegd, kan op verzoek van de overtreder de last opheffen
      indien de beschikking een jaar van kracht is geweest zonder dat de dwangsom is verbeurd.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel534
  - number: 5:35.1
    text: |-
      De bevoegdheid tot invordering van verbeurde bedragen verjaart door verloop van zes maanden na de dag waarop zij
      zijn verbeurd.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel535
  - number: 5:35.2
    text: |-
      De verjaring wordt geschorst door faillissement, toepassing van de schuldsaneringsregeling natuurlijke personen en
      ieder wettelijk beletsel voor invordering van de dwangsom.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel535
  - number: 5:36
    text: |-
      Een last onder dwangsom wordt niet opgelegd zolang een ter zake van de betrokken overtreding reeds genomen
      beslissing tot toepassing van bestuursdwang niet is ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel536
  - number: 6:1
    text: |-
      De [hoofdstukken 6][ref1] en [7][ref2] zijn van overeenkomstige toepassing indien is voorzien in de mogelijkheid
      van bezwaar of beroep tegen andere handelingen van bestuursorganen dan besluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005537
        hoofdstuk: '7'
  - number: 6:2
    text: 'Voor de toepassing van wettelijke voorschriften over bezwaar en beroep worden met een besluit gelijkgesteld:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel62
  - number: 6:2.a
    text: de schriftelijke weigering een besluit te nemen, en
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel62
  - number: 6:2.b
    text: het niet tijdig nemen van een besluit.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel62
  - number: 6:3
    text: |-
      Een beslissing inzake de procedure ter voorbereiding van een besluit is niet vatbaar voor bezwaar of beroep, tenzij
      deze beslissing de belanghebbende los van het voor te bereiden besluit rechtstreeks in zijn belang treft.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel63
  - number: 6:4.1
    text: |-
      Het maken van bezwaar geschiedt door het indienen van een bezwaarschrift bij het bestuursorgaan dat het besluit
      heeft genomen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel64
  - number: 6:4.2
    text: Het instellen van administratief beroep geschiedt door het indienen van een beroepschrift bij het beroepsorgaan.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel64
  - number: 6:4.3
    text: |-
      Het instellen van beroep op een administratieve rechter geschiedt door het indienen van een beroepschrift bij die
      rechter.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel64
  - number: 6:5.1
    text: 'Het bezwaar- of beroepschrift wordt ondertekend en bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel65
  - number: 6:5.1.a
    text: de naam en het adres van de indiener;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel65
  - number: 6:5.1.b
    text: de dagtekening;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel65
  - number: 6:5.1.c
    text: een omschrijving van het besluit waartegen het bezwaar of beroep is gericht;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel65
  - number: 6:5.1.d
    text: de gronden van het bezwaar of beroep.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel65
  - number: 6:5.2
    text: |-
      Bij het beroepschrift wordt zo mogelijk een afschrift van het besluit waarop het geschil betrekking heeft,
      overgelegd.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel65
  - number: 6:5.3
    text: |-
      Indien het bezwaar- of beroepschrift in een vreemde taal is gesteld en een vertaling voor een goede behandeling van
      het bezwaar of beroep noodzakelijk is, dient de indiener zorg te dragen voor een vertaling.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel65
  - number: 6:6
    text: 'Het bezwaar of beroep kan niet-ontvankelijk worden verklaard, indien:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel66
  - number: 6:6.a
    text: |-
      niet is voldaan aan [artikel 6:5][ref1] of aan enig ander bij de wet gesteld vereiste voor het in behandeling nemen
      van het bezwaar of beroep, of


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
  - number: 6:6.b
    text: |-
      het bezwaar- of beroepschrift geheel of gedeeltelijk is geweigerd op grond van [artikel 2:15][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 6:7
    text: De termijn voor het indienen van een bezwaar- of beroepschrift bedraagt zes weken.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel67
  - number: 6:8.1
    text: De termijn vangt aan met ingang van de dag na die waarop het besluit op de voorgeschreven wijze is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel68
  - number: 6:8.2
    text: |-
      De termijn voor het indienen van een bezwaarschrift tegen een besluit waartegen alleen door een of meer bepaalde
      belanghebbenden administratief beroep kon worden ingesteld, vangt aan met ingang van de dag na die waarop de
      beroepstermijn ongebruikt is verstreken.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel68
  - number: 6:8.3
    text: |-
      De termijn voor het indienen van een beroepschrift tegen een besluit dat aan goedkeuring is onderworpen, vangt aan
      met ingang van de dag na die waarop het besluit, inhoudende de goedkeuring van dat besluit, op de voorgeschreven
      wijze is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel68
  - number: 6:8.4
    text: |-
      De termijn voor het indienen van een beroepschrift tegen een besluit dat is voorbereid met toepassing
      van [afdeling 3.4][ref1] vangt aan met ingang van de dag na die waarop het besluit overeenkomstig
      [artikel 3:44, eerste lid, onderdeel a][ref2], ter inzage is gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '3'
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: 6:9.1
    text: Een bezwaar- of beroepschrift is tijdig ingediend indien het voor het einde van de termijn is ontvangen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel69
  - number: 6:9.2
    text: |-
      Bij verzending per post is een bezwaar- of beroepschrift tijdig ingediend indien het voor het einde van de termijn
      ter post is bezorgd, mits het niet later dan een week na afloop van de termijn is ontvangen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel69
  - number: 6:10.1
    text: |-
      Ten aanzien van een voor het begin van de termijn ingediend bezwaar- of beroepschrift blijft niet-
      ontvankelijkverklaring op grond daarvan achterwege indien het besluit ten tijde van de indiening:
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel610
  - number: 6:10.1.a
    text: wel reeds tot stand was gekomen, of
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel610
  - number: 6:10.1.b
    text: nog niet tot stand was gekomen, maar de indiener redelijkerwijs kon menen dat dit wel reeds het geval was.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel610
  - number: 6:10.2
    text: De behandeling van het bezwaar of beroep kan worden aangehouden tot het begin van de termijn.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel610
  - number: 6:11
    text: |-
      Ten aanzien van een na afloop van de termijn ingediend bezwaar- of beroepschrift blijft niet-ontvankelijkverklaring
      op grond daarvan achterwege indien redelijkerwijs niet kan worden geoordeeld dat de indiener in verzuim is geweest.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel611
  - number: 6:12.1
    text: |-
      Indien het bezwaar of beroep is gericht tegen het niet tijdig nemen van een besluit, is het niet aan een termijn
      gebonden.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel612
  - number: 6:12.2
    text: |-
      Het bezwaar- of beroepschrift kan worden ingediend zodra het bestuursorgaan in gebreke is tijdig een besluit te
      nemen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel612
  - number: 6:12.3
    text: |-
      Het bezwaar of beroep wordt niet-ontvankelijk verklaard indien het bezwaar- of beroepschrift onredelijk laat is
      ingediend.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel612
  - number: 6:13
    text: |-
      Geen beroep bij de administratieve rechter kan worden ingesteld door een belanghebbende aan wie redelijkerwijs
      kan worden verweten dat hij geen zienswijzen als bedoeld in [artikel 3:15][ref1] naar voren heeft gebracht, geen
      bezwaar heeft gemaakt of geen administratief beroep heeft ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel613
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.4'
  - number: 6:14.1
    text: Het orgaan waarbij het bezwaar- of beroepschrift is ingediend, bevestigt de ontvangst daarvan schriftelijk.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel614
  - number: 6:14.2
    text: |-
      Het orgaan waarbij het beroepschrift is ingediend, geeft daarvan zo spoedig mogelijk kennis aan het bestuursorgaan
      dat het bestreden besluit heeft genomen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel614
  - number: 6:15.1
    text: |-
      Indien het bezwaar- of beroepschrift wordt ingediend bij een onbevoegd bestuursorgaan of bij een onbevoegde
      administratieve rechter, wordt het, nadat daarop de datum van ontvangst is aangetekend, zo spoedig mogelijk
      doorgezonden aan het bevoegde orgaan, onder gelijktijdige mededeling hiervan aan de afzender.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel615
  - number: 6:15.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing indien in plaats van een bezwaarschrift een beroepschrift is
      ingediend of omgekeerd.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel615
  - number: 6:15.3
    text: |-
      Het tijdstip van indiening bij het onbevoegde orgaan is bepalend voor de vraag of het bezwaar- of beroepschrift
      tijdig is ingediend, behoudens in geval van kennelijk onredelijk gebruik van procesrecht.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel615
  - number: 6:16
    text: |-
      Het bezwaar of beroep schorst niet de werking van het besluit waartegen het is gericht, tenzij bij of krachtens
      wettelijk voorschrift anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel616
  - number: 6:17
    text: |-
      Indien iemand zich laat vertegenwoordigen, zendt het orgaan dat bevoegd is op het bezwaar of beroep te beslissen,
      de op de zaak betrekking hebbende stukken in ieder geval aan de gemachtigde.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel617
  - number: 6:18.1
    text: |-
      Het aanhangig zijn van bezwaar of beroep tegen een besluit brengt geen verandering in een los van het bezwaar of
      beroep reeds bestaande bevoegdheid tot intrekking of wijziging van dat besluit.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel618
  - number: 6:18.2
    text: |-
      Gaat het bestuursorgaan tot intrekking of wijziging van het bestreden besluit over, dan doet het daarvan onverwijld
      mededeling aan het orgaan waarbij het bezwaar of beroep aanhangig is.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel618
  - number: 6:18.3
    text: |-
      Na de intrekking of wijziging mag het bestuursorgaan, zolang het bezwaar of beroep aanhangig blijft, geen besluit
      nemen waarvan de inhoud of strekking met het oorspronkelijke besluit overeenstemt, tenzij:
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel618
  - number: 6:18.3.a
    text: gewijzigde omstandigheden dit rechtvaardigen en
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel618
  - number: 6:18.3.b
    text: het bestuursorgaan daartoe los van het bezwaar of beroep ook bevoegd zou zijn geweest.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel618
  - number: 6:18.4
    text: |-
      Een bestuursorgaan doet van een besluit als bedoeld in het derde lid onverwijld mededeling aan het orgaan waarbij
      het bezwaar of beroep aanhangig is.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel618
  - number: 6:19.1
    text: |-
      Indien een bestuursorgaan een besluit heeft genomen als bedoeld in [artikel 6:18][ref1], wordt het bezwaar of
      beroep geacht mede te zijn gericht tegen het nieuwe besluit, tenzij dat besluit aan het bezwaar of beroep geheel
      tegemoet komt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel619
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
  - number: 6:19.2
    text: |-
      De beslissing op het bezwaar of beroep tegen het nieuwe besluit kan echter worden verwezen naar een ander orgaan
      waarbij bezwaar of beroep tegen dat nieuwe besluit aanhangig is, dan wel kan of kon worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel619
  - number: 6:19.3
    text: |-
      Intrekking van het bestreden besluit staat niet in de weg aan vernietiging van dat besluit indien de indiener van
      het bezwaar- of beroepschrift daarbij belang heeft.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel619
  - number: 6:20.1
    text: |-
      Indien het bezwaar of beroep is gericht tegen het niet tijdig nemen van een besluit, blijft het bestuursorgaan
      verplicht een besluit op de aanvraag te nemen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel620
  - number: 6:20.2
    text: 'Het in het eerste lid bepaalde geldt niet:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel620
  - number: 6:20.2.a
    text: gedurende de periode dat het bezwaar aanhangig is;
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel620
  - number: 6:20.2.b
    text: |-
      na de beslissing op het bezwaar of beroep indien de indiener van de aanvraag als gevolg daarvan geen belang meer
      heeft bij een besluit op de aanvraag.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel620
  - number: 6:20.3
    text: |-
      Indien het bestuursorgaan een besluit op de aanvraag neemt, doet het daarvan onverwijld mededeling aan het orgaan
      waarbij het bezwaar of beroep tegen het niet tijdig beslissen aanhangig is.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel620
  - number: 6:20.4
    text: |-
      Het bezwaar of beroep wordt geacht mede te zijn gericht tegen het besluit op de aanvraag, tenzij dat besluit aan
      het bezwaar of beroep geheel tegemoet komt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel620
  - number: 6:20.5
    text: |-
      De beslissing op het bezwaar of beroep tegen het besluit op de aanvraag kan echter worden verwezen naar een ander
      orgaan waarbij bezwaar of beroep tegen het besluit op de aanvraag aanhangig is, kan of kon worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel620
  - number: 6:20.6
    text: |-
      Het bezwaar of beroep tegen het niet tijdig beslissen op de aanvraag kan alsnog gegrond worden verklaard, indien de
      indiener van het bezwaar- of beroepschrift daarbij belang heeft.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel620
  - number: 6:21.1
    text: Het bezwaar of beroep kan schriftelijk worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel621
  - number: 6:21.2
    text: Tijdens het horen kan de intrekking ook mondeling geschieden.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel621
  - number: 6:22
    text: |-
      Een besluit waartegen bezwaar is gemaakt of beroep is ingesteld, kan, ondanks schending van een vormvoorschrift,
      door het orgaan dat op het bezwaar of beroep beslist, in stand worden gelaten indien blijkt dat de belanghebbenden
      daardoor niet zijn benadeeld.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel622
  - number: 6:23.1
    text: |-
      Indien beroep kan worden ingesteld tegen de beslissing op het bezwaar of beroep, wordt daarvan bij de bekendmaking
      van de beslissing melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel623
  - number: 6:23.2
    text: Hierbij wordt vermeld door wie, binnen welke termijn en bij welk orgaan beroep kan worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel623
  - number: 6:24
    text: |-
      Deze afdeling is met uitzondering van [artikel 6:12][ref1] van overeenkomstige toepassing indien hoger beroep of
      beroep in cassatie kan worden ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel624
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
  - number: 7:1.1
    text: |-
      Degene aan wie het recht is toegekend tegen een besluit beroep op een administratieve rechter in te stellen, dient
      alvorens beroep in te stellen tegen dat besluit bezwaar te maken, tenzij het besluit:
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel71
  - number: 7:1.1.a
    text: op bezwaar of in administratief beroep is genomen,
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel71
  - number: 7:1.1.b
    text: aan goedkeuring is onderworpen,
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel71
  - number: 7:1.1.c
    text: de goedkeuring van een ander besluit of de weigering van die goedkeuring inhoudt, of
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel71
  - number: 7:1.1.d
    text: |-
      is voorbereid met toepassing van [afdeling 3.4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '3'
        afdeling: '3.4'
  - number: 7:1.2
    text: |-
      Tegen de beslissing op het bezwaar kan beroep worden ingesteld met toepassing van de voorschriften die gelden voor
      het instellen van beroep tegen het besluit waartegen bezwaar is gemaakt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel71
  - number: 7:1a.1
    text: |-
      In het bezwaarschrift kan de indiener het bestuursorgaan verzoeken in te stemmen met rechtstreeks beroep bij de
      administratieve rechter, zulks in afwijking van [artikel 7:1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.1'
  - number: 7:1a.2
    text: 'Het bestuursorgaan wijst het verzoek in ieder geval af, indien:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel71a
  - number: 7:1a.2.a
    text: het bezwaarschrift is gericht tegen het niet tijdig nemen van een besluit, of
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel71a
  - number: 7:1a.2.b
    text: |-
      tegen het besluit een ander bezwaarschrift is ingediend waarin eenzelfde verzoek ontbreekt, tenzij dat andere
      bezwaarschrift kennelijk niet-ontvankelijk is.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel71a
  - number: 7:1a.3
    text: Het bestuursorgaan kan instemmen met het verzoek indien de zaak daarvoor geschikt is.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel71a
  - number: 7:1a.4
    text: |-
      Het bestuursorgaan beslist zo spoedig mogelijk op het verzoek. Een beslissing tot instemming wordt genomen
      zodra redelijkerwijs kan worden aangenomen dat geen nieuwe bezwaarschriften zullen worden ingediend. De
      [artikelen 4:7][ref1] en [4:8][ref2] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
        hoofdstuk: '4'
        afdeling: 4.1.2
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
        hoofdstuk: '4'
        afdeling: 4.1.2
  - number: 7:1a.5
    text: |-
      Indien het bestuursorgaan instemt met het verzoek zendt het het bezwaarschrift, nadat daarop de datum van ontvangst
      is aangetekend, onverwijld door aan de bevoegde rechter.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel71a
  - number: 7:1a.6
    text: |-
      Een na de instemming ontvangen bezwaarschrift wordt eveneens onverwijld doorgezonden aan de bevoegde
      rechter. Indien dit bezwaarschrift geen verzoek als bedoeld in het eerste lid bevat, wordt, in afwijking van
      [artikel 8:41, eerste lid][ref1], geen griffierecht geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.1
  - number: 7:2.1
    text: Voordat een bestuursorgaan op het bezwaar beslist, stelt het belanghebbenden in de gelegenheid te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel72
  - number: 7:2.2
    text: |-
      Het bestuursorgaan stelt daarvan in ieder geval de indiener van het bezwaarschrift op de hoogte alsmede de
      belanghebbenden die bij de voorbereiding van het besluit hun zienswijze naar voren hebben gebracht.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel72
  - number: 7:3
    text: 'Van het horen van belanghebbenden kan worden afgezien indien:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel73
  - number: 7:3.a
    text: het bezwaar kennelijk niet-ontvankelijk is,
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel73
  - number: 7:3.b
    text: het bezwaar kennelijk ongegrond is,
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel73
  - number: 7:3.c
    text: de belanghebbenden hebben verklaard geen gebruik te willen maken van het recht te worden gehoord, of
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel73
  - number: 7:3.d
    text: |-
      aan het bezwaar volledig tegemoet wordt gekomen en andere belanghebbenden daardoor niet in hun belangen kunnen
      worden geschaad.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel73
  - number: 7:4.1
    text: Tot tien dagen voor het horen kunnen belanghebbenden nadere stukken indienen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel74
  - number: 7:4.2
    text: |-
      Het bestuursorgaan legt het bezwaarschrift en alle verder op de zaak betrekking hebbende stukken voorafgaand aan
      het horen gedurende ten minste een week voor belanghebbenden ter inzage.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel74
  - number: 7:4.3
    text: |-
      Bij de oproeping voor het horen worden belanghebbenden gewezen op het eerste lid en wordt vermeld waar en wanneer
      de stukken ter inzage zullen liggen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel74
  - number: 7:4.4
    text: Belanghebbenden kunnen van deze stukken tegen vergoeding van ten hoogste de kosten afschriften verkrijgen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel74
  - number: 7:4.5
    text: Voor zover de belanghebbenden daarmee instemmen, kan toepassing van het tweede lid achterwege worden gelaten.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel74
  - number: 7:4.6
    text: |-
      Het bestuursorgaan kan, al dan niet op verzoek van een belanghebbende, toepassing van het tweede lid voorts
      achterwege laten, voor zover geheimhouding om gewichtige redenen is geboden. Van de toepassing van deze bepaling
      wordt mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel74
  - number: 7:4.7
    text: |-
      Gewichtige redenen zijn in ieder geval niet aanwezig, voor zover ingevolge de [Wet openbaarheid van bestuur][ref1]
      de verplichting bestaat een verzoek om informatie, vervat in deze stukken, in te willigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0005252
  - number: 7:4.8
    text: |-
      Indien een gewichtige reden is gelegen in de vrees voor schade aan de lichamelijke of geestelijke gezondheid van
      een belanghebbende, kan inzage van de desbetreffende stukken worden voorbehouden aan een gemachtigde die hetzij
      advocaat hetzij arts is.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel74
  - number: 7:5.1
    text: |-
      Tenzij het horen geschiedt door of mede door het bestuursorgaan zelf dan wel de voorzitter of een lid ervan,
      geschiedt het horen door:
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel75
  - number: 7:5.1.a
    text: een persoon die niet bij de voorbereiding van het bestreden besluit betrokken is geweest, of
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel75
  - number: 7:5.1.b
    text: |-
      meer dan een persoon van wie de meerderheid, onder wie degene die het horen leidt, niet bij de voorbereiding van
      het besluit betrokken is geweest.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel75
  - number: 7:5.2
    text: |-
      Voor zover niet bij wettelijk voorschrift anders is bepaald, besluit het bestuursorgaan of het horen in het
      openbaar plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel75
  - number: 7:6.1
    text: Belanghebbenden worden in elkaars aanwezigheid gehoord.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel76
  - number: 7:6.2
    text: |-
      Ambtshalve of op verzoek kunnen belanghebbenden afzonderlijk worden gehoord, indien aannemelijk is dat gezamenlijk
      horen een zorgvuldige behandeling zal belemmeren of dat tijdens het horen feiten of omstandigheden bekend zullen
      worden waarvan geheimhouding om gewichtige redenen is geboden.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel76
  - number: 7:6.3
    text: |-
      Wanneer belanghebbenden afzonderlijk zijn gehoord, wordt ieder van hen op de hoogte gesteld van het verhandelde
      tijdens het horen buiten zijn aanwezigheid.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel76
  - number: 7:6.4
    text: |-
      Het bestuursorgaan kan, al dan niet op verzoek van een belanghebbende, toepassing van het
      derde lid achterwege laten, voor zover geheimhouding om gewichtige redenen is geboden.
      [Artikel 7:4, zesde lid, tweede volzin, zevende en achtste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.2'
  - number: 7:7
    text: Van het horen wordt een verslag gemaakt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel77
  - number: 7:8
    text: Op verzoek van de belanghebbende kunnen door hem meegebrachte getuigen en deskundigen worden gehoord.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel78
  - number: 7:9
    text: |-
      Wanneer na het horen aan het bestuursorgaan feiten of omstandigheden bekend worden die voor de op het bezwaar te
      nemen beslissing van aanmerkelijk belang kunnen zijn, wordt dit aan belanghebbenden meegedeeld en worden zij in de
      gelegenheid gesteld daarover te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel79
  - number: 7:10.1
    text: |-
      Het bestuursorgaan beslist binnen zes weken of - indien een commissie als bedoeld in [artikel 7:13][ref1] is
      ingesteld - binnen tien weken na ontvangst van het bezwaarschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel710
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.2'
  - number: 7:10.2
    text: |-
      De termijn wordt opgeschort met ingang van de dag waarop de indiener is verzocht een verzuim als bedoeld in
      [artikel 6:6][ref1] te herstellen, tot de dag waarop het verzuim is hersteld of de daarvoor gestelde termijn
      ongebruikt is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel710
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
  - number: 7:10.3
    text: |-
      Het bestuursorgaan kan de beslissing voor ten hoogste vier weken verdagen. Van de verdaging wordt schriftelijk
      mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel710
  - number: 7:10.4
    text: |-
      Verder uitstel is mogelijk voor zover de indiener van het bezwaarschrift daarmee instemt en andere belanghebbenden
      daardoor niet in hun belangen kunnen worden geschaad of ermee instemmen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel710
  - number: 7:11.1
    text: Indien het bezwaar ontvankelijk is, vindt op grondslag daarvan een heroverweging van het bestreden besluit plaats.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel711
  - number: 7:11.2
    text: |-
      Voor zover de heroverweging daartoe aanleiding geeft, herroept het bestuursorgaan het bestreden besluit en neemt
      het voor zover nodig in de plaats daarvan een nieuw besluit.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel711
  - number: 7:12.1
    text: |-
      De beslissing op het bezwaar dient te berusten op een deugdelijke motivering, die bij de bekendmaking van de
      beslissing wordt vermeld. Daarbij wordt, indien ingevolge [artikel 7:3][ref1] van het horen is afgezien, tevens
      aangegeven op welke grond dat is geschied.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel712
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.2'
  - number: 7:12.2
    text: |-
      De beslissing wordt bekendgemaakt door toezending of uitreiking aan degenen tot wie zij is gericht. Betreft het
      een besluit dat niet tot een of meer belanghebbenden was gericht, dan wordt de beslissing bekendgemaakt op dezelfde
      wijze als waarop dat besluit bekendgemaakt is.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel712
  - number: 7:12.3
    text: |-
      Zo spoedig mogelijk na de bekendmaking van de beslissing wordt hiervan mededeling gedaan aan de belanghebbenden die
      in bezwaar of bij de voorbereiding van het bestreden besluit hun zienswijze naar voren hebben gebracht.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel712
  - number: 7:12.4
    text: |-
      Bij de mededeling, bedoeld in het derde lid, is [artikel 6:23][ref1] van overeenkomstige toepassing en wordt
      met het oog op de aanvang van de beroepstermijn zo duidelijk mogelijk aangegeven wanneer de bekendmaking van de
      beslissing overeenkomstig het tweede lid heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel712
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
  - number: 7:13.1
    text: 'Dit artikel is van toepassing indien ten behoeve van de beslissing op het bezwaar een adviescommissie is ingesteld:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel713
  - number: 7:13.1.a
    text: die bestaat uit een voorzitter en ten minste twee leden,
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel713
  - number: 7:13.1.b
    text: |-
      waarvan de voorzitter geen deel uitmaakt van en niet werkzaam is onder verantwoordelijkheid van het bestuursorgaan
      en
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel713
  - number: 7:13.1.c
    text: die voldoet aan eventueel bij wettelijk voorschrift gestelde andere eisen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel713
  - number: 7:13.2
    text: |-
      Indien een commissie over het bezwaar zal adviseren, deelt het bestuursorgaan dit zo spoedig mogelijk mede aan de
      indiener van het bezwaarschrift.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel713
  - number: 7:13.3
    text: |-
      Het horen geschiedt door de commissie. De commissie kan het horen opdragen aan de voorzitter of een lid dat geen
      deel uitmaakt van en niet werkzaam is onder verantwoordelijkheid van het bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel713
  - number: 7:13.4
    text: |-
      De commissie beslist over de toepassing van [artikel 7:4, zesde lid][ref1], van [artikel 7:5, tweede lid][ref2],
      en, voor zover bij wettelijk voorschrift niet anders is bepaald, van [artikel 7:3][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel713
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.2'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.2'
  - number: 7:13.5
    text: |-
      Een vertegenwoordiger van het bestuursorgaan wordt voor het horen uitgenodigd en wordt in de gelegenheid gesteld
      een toelichting op het standpunt van het bestuursorgaan te geven.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel713
  - number: 7:13.6
    text: Het advies van de commissie wordt schriftelijk uitgebracht en bevat een verslag van het horen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel713
  - number: 7:13.7
    text: |-
      Indien de beslissing op het bezwaar afwijkt van het advies van de commissie, wordt in de beslissing de reden voor
      die afwijking vermeld en wordt het advies met de beslissing meegezonden.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel713
  - number: 7:14
    text: |-
      [Artikel 3:6, tweede lid][ref1], [afdeling 3.4][ref2], de [artikelen 3:41 tot en met 3:45][ref3],
      [afdeling 3.7][ref4], met uitzondering van [artikel 3:49][ref5], en [hoofdstuk 4][ref6] zijn niet van toepassing op
      besluiten op grond van deze afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk3
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel714
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.3'
      - id: ref2
        bwb_id: BWBR0005537
        hoofdstuk: '3'
        afdeling: '3.4'
      - id: ref3
