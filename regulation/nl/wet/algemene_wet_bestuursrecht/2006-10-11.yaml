  - number: 7:28.1
    text: Voor de behandeling van het beroep is geen recht verschuldigd.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel728
  - number: 7:28.2
    text: |-
      De kosten, die de belanghebbende in verband met de behandeling van het beroep redelijkerwijs heeft
      moeten maken, worden door het bestuursorgaan uitsluitend vergoed op verzoek van de belanghebbende
      voorzover het bestreden besluit wordt herroepen wegens aan het bestuursorgaan te wijten onrechtmatigheid.
      In dat geval stelt het beroepsorgaan de vergoeding vast die het bestuursorgaan verschuldigd is.
      [Artikel 243, tweede lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel57b
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel728
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 57b
  - number: 7:28.3
    text: |-
      Het verzoek wordt gedaan voordat het beroepsorgaan op het beroep heeft beslist. Het beroepsorgaan beslist op het
      verzoek bij de beslissing op het beroep.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel728
  - number: 7:28.4
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld over de kosten waarop de vergoeding uitsluitend
      betrekking kan hebben en over de wijze waarop het bedrag van de kosten wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel728
  - number: 8:1.1
    text: Een belanghebbende kan tegen een besluit beroep instellen bij de rechtbank.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel81
  - number: 8:1.2
    text: |-
      Met een besluit wordt gelijkgesteld een andere handeling van een bestuursorgaan waarbij een ambtenaar
      als bedoeld in [artikel 1 van de Ambtenarenwet][ref1] als zodanig of een dienstplichtige als bedoeld in
      [hoofdstuk 2 van de Kaderwet dienstplicht][ref2] als zodanig, hun nagelaten betrekkingen of hun rechtverkrijgenden
      belanghebbende zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008589#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0008589
        hoofdstuk: '2'
  - number: 8:1.3
    text: 'Met een besluit worden gelijkgesteld:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel81
  - number: 8:1.3.a
    text: |-
      de schriftelijke beslissing, inhoudende de weigering van de goedkeuring van een besluit, inhoudende een algemeen
      verbindend voorschrift of een beleidsregel of de intrekking of de vaststelling van de inwerkingtreding van een
      algemeen verbindend voorschrift of een beleidsregel, en
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel81
  - number: 8:1.3.b
    text: |-
      de schriftelijke beslissing, inhoudende de weigering van de goedkeuring van een besluit ter voorbereiding van een
      privaatrechtelijke rechtshandeling.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel81
  - number: 8:2
    text: 'Geen beroep kan worden ingesteld tegen:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel82
  - number: 8:2.a
    text: een besluit, inhoudende een algemeen verbindend voorschrift of een beleidsregel,
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel82
  - number: 8:2.b
    text: |-
      een besluit, inhoudende de intrekking of de vaststelling van de inwerkingtreding van een algemeen verbindend
      voorschrift of een beleidsregel, en
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel82
  - number: 8:2.c
    text: |-
      een besluit, inhoudende de goedkeuring van een besluit, inhoudende een algemeen verbindend voorschrift of een
      beleidsregel of de intrekking of de vaststelling van de inwerkingtreding van een algemeen verbindend voorschrift of
      een beleidsregel.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel82
  - number: 8:3
    text: Geen beroep kan worden ingesteld tegen een besluit ter voorbereiding van een privaatrechtelijke rechtshandeling.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel83
  - number: 8:4
    text: 'Geen beroep kan worden ingesteld tegen een besluit:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel84
  - number: 8:4.a
    text: inhoudende schorsing of vernietiging van een besluit van een ander bestuursorgaan,
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel84
  - number: 8:4.b
    text: |-
      op grond van een in enig wettelijk voorschrift voor het geval van buitengewone omstandigheden toegekende
      bevoegdheid of opgelegde verplichting in deze omstandigheden genomen,
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel84
  - number: 8:4.c
    text: |-
      genomen op grond van een wettelijk voorschrift ter beveiliging van de militaire belangen van het Koninkrijk of
      zijn bondgenoten,
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel84
  - number: 8:4.d
    text: |-
      tot benoeming of aanstelling, tenzij beroep wordt ingesteld door een ambtenaar als bedoeld
      in [artikel 1 van de Ambtenarenwet][ref1] als zodanig of een dienstplichtige als bedoeld in
      [hoofdstuk 2 van de Kaderwet dienstplicht][ref2] als zodanig, hun nagelaten betrekkingen of hun rechtverkrijgenden,


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008589#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0008589
        hoofdstuk: '2'
  - number: 8:4.e
    text: |-
      inhoudende een beoordeling van het kennen of kunnen van een kandidaat of leerling die ter zake is geëxamineerd of
      op enigerlei andere wijze is getoetst, dan wel inhoudende de vaststelling van opgaven, beoordelingsnormen of nadere
      regels voor die examinering of toetsing,
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel84
  - number: 8:4.f
    text: |-
      inhoudende een technische beoordeling van een voertuig of een luchtvaartuig, dan wel een meetmiddel, een onderdeel
      daarvan of een hulpinrichting daarvoor,
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel84
  - number: 8:4.g
    text: |-
      inzake de nummering van kandidatenlijsten, de geldigheid van lijstverbindingen, het verloop van de stemming, de
      stemopneming en de vaststelling van de uitslag bij verkiezingen van de leden van vertegenwoordigende organen,
      de benoemdverklaring in opengevallen plaatsen, de toelating van nieuwe leden van provinciale staten en van de
      gemeenteraad, alsmede de verlening van tijdelijk ontslag wegens zwangerschap en bevalling of ziekte,
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel84
  - number: 8:4.h
    text: |-
      genomen op grond van een wettelijk voorschrift inzake de verplichte krijgsdienst, voor zover het keuring,
      herkeuring, werkelijke dienst, groot verlof of diensteindiging betreft, tenzij het besluit betrekking heeft
      op verlenging van werkelijke dienst of kostwinnersvergoeding, of het besluit is genomen op grond van de
      [Wet voor het reservepersoneel der krijgsmacht 1985][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003883
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0003883
  - number: 8:4.i
    text: houdende een ambtshandeling van een gerechtsdeurwaarder of notaris,
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel84
  - number: 8:4.j
    text: |-
      als bedoeld in [artikel 7:1a, vierde lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.1'
  - number: 8:4.k
    text: |-
      inhoudende een weigering op grond van [artikel 2:15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 8:5.1
    text: |-
      Geen beroep kan worden ingesteld tegen een besluit, genomen op grond van een wettelijk voorschrift dat is opgenomen
      in de bijlage die bij deze wet behoort.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel85
  - number: 8:5.2
    text: |-
      Bij een wijziging van de bijlage blijft de bijlage zoals deze luidde voor het tijdstip van inwerkingtreding van
      de wijziging van toepassing ten aanzien van de mogelijkheid om beroep in te stellen tegen een besluit dat voor dat
      tijdstip is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel85
  - number: 8:6.1
    text: |-
      Geen beroep kan worden ingesteld tegen een besluit waartegen beroep bij een andere administratieve rechter kan of
      kon worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel86
  - number: 8:6.2
    text: |-
      Geen beroep kan worden ingesteld tegen een besluit waartegen administratief beroep kan worden ingesteld of door de
      belanghebbende kon worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel86
  - number: 8:7.1
    text: |-
      Indien beroep wordt ingesteld tegen een besluit van een bestuursorgaan van een provincie, een gemeente, een
      waterschap of een regio als bedoeld in [artikel 21 van de Politiewet 1993][ref1] dan wel tegen een besluit van
      een gemeenschappelijk orgaan of een bestuursorgaan van een openbaar lichaam dat is ingesteld met toepassing van de
      [Wet gemeenschappelijke regelingen][ref2], is de rechtbank binnen het rechtsgebied waarvan het bestuursorgaan zijn
      zetel heeft bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0003740
  - number: 8:7.2
    text: |-
      Indien beroep wordt ingesteld tegen een besluit van een ander bestuursorgaan, is de rechtbank binnen het
      rechtsgebied waarvan de indiener van het beroepschrift zijn woonplaats in Nederland heeft bevoegd. Indien de
      indiener van het beroepschrift geen woonplaats in Nederland heeft, is de rechtbank binnen het rechtsgebied waarvan
      het bestuursorgaan zijn zetel heeft bevoegd.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel87
  - number: 8:8.1
    text: |-
      Indien tegen hetzelfde besluit bij meer dan één bevoegde rechtbank beroep is ingesteld, worden de zaken verder
      behandeld door de bevoegde rechtbank waarbij als eerste beroep is ingesteld. Indien gelijktijdig bij meer dan één
      bevoegde rechtbank als eerste beroep is ingesteld, worden de zaken verder behandeld door de bevoegde rechtbank die
      als eerste wordt genoemd in de [Wet op de rechterlijke indeling][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002080
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0002080
  - number: 8:8.2
    text: |-
      De andere rechtbank verwijst onderscheidenlijk de andere rechtbanken verwijzen de daar aanhangig gemaakte zaak of
      zaken naar de rechtbank die de zaken verder behandelt. De op de zaak of zaken betrekking hebbende stukken worden
      toegezonden aan de rechtbank die de zaken verder behandelt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel88
  - number: 8:8.3
    text: |-
      Indien tegen hetzelfde besluit bij meer dan één rechtbank beroep is ingesteld, doet het bestuursorgaan daarvan
      onverwijld mededeling aan die rechtbanken.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel88
  - number: 8:8.4
    text: |-
      Indien het bestuursorgaan ingevolge [artikel 7:1a, vijfde of zesde lid][ref1], verschillende bezwaarschriften
      doorzendt, zendt het bestuursorgaan deze door aan de rechtbank die ingevolge de tweede volzin van het eerste lid de
      zaak zal behandelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.1'
  - number: 8:9
    text: |-
      De Afdeling bestuursrechtspraak van de Raad van State onderscheidenlijk de Centrale Raad van Beroep oordelen in
      hoogste ressort over geschillen tussen de rechtbanken over de toepassing van [artikel 8:7][ref1] in zaken tot de
      kennisneming waarvan zij in hoger beroep bevoegd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: 8:10.1
    text: De zaken die bij de rechtbank aanhangig worden gemaakt, worden in behandeling genomen door een enkelvoudige kamer.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel810
  - number: 8:10.2
    text: |-
      Indien een zaak naar het oordeel van de enkelvoudige kamer ongeschikt is voor behandeling door één rechter,
      verwijst zij deze naar een meervoudige kamer. De enkelvoudige kamer kan ook in andere gevallen een zaak naar een
      meervoudige kamer verwijzen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel810
  - number: 8:10.3
    text: |-
      Indien een zaak naar het oordeel van de meervoudige kamer geschikt is voor verdere behandeling door één rechter,
      kan zij deze verwijzen naar een enkelvoudige kamer.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel810
  - number: 8:10.4
    text: |-
      Verwijzing kan geschieden in elke stand van het geding. Een verwezen zaak wordt voortgezet in de stand waarin zij
      zich bevindt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel810
  - number: 8:11.1
    text: |-
      De voorschriften omtrent de behandeling van het beroep zijn op de behandeling zowel door een enkelvoudige als door
      een meervoudige kamer van toepassing.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel811
  - number: 8:11.2
    text: |-
      Degene die zitting heeft in een enkelvoudige kamer heeft tevens de bevoegdheden en de verplichtingen die de
      voorzitter van een meervoudige kamer heeft.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel811
  - number: 8:12
    text: De rechtbank kan aan een rechter-commissaris opdragen het vooronderzoek of een gedeelte daarvan te verrichten.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel812
  - number: 8:13.1
    text: |-
      De rechtbank kan een bij haar aanhangig gemaakte zaak ter verdere behandeling verwijzen naar de rechtbank waar een
      andere zaak aanhangig is gemaakt, indien naar haar oordeel behandeling van die zaken door één rechtbank gewenst is.
      Zij kan een bij haar aanhangig gemaakte zaak ter verdere behandeling verwijzen naar een andere rechtbank, indien
      naar haar oordeel door betrokkenheid van de rechtbank behandeling van die zaak door een andere rechtbank gewenst
      is.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel813
  - number: 8:13.2
    text: Een verzoek tot verwijzing kan worden gedaan tot de aanvang van het onderzoek ter zitting.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel813
  - number: 8:13.3
    text: |-
      Indien de rechtbank waarnaar een zaak is verwezen, instemt met de verwijzing, worden de op de zaak betrekking
      hebbende stukken aan haar toegezonden.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel813
  - number: 8:14.1
    text: |-
      De rechtbank kan zaken over hetzelfde of een verwant onderwerp ter behandeling voegen en de behandeling van
      gevoegde zaken splitsen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel814
  - number: 8:14.2
    text: Een verzoek daartoe kan worden gedaan tot de sluiting van het onderzoek ter zitting.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel814
  - number: 8:15
    text: |-
      Op verzoek van een partij kan elk van de rechters die een zaak behandelen, worden gewraakt op grond van feiten of
      omstandigheden waardoor de rechterlijke onpartijdigheid schade zou kunnen lijden.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel815
  - number: 8:16.1
    text: Het verzoek wordt gedaan zodra de feiten of omstandigheden aan de verzoeker bekend zijn geworden.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel816
  - number: 8:16.2
    text: |-
      Het verzoek geschiedt schriftelijk en is gemotiveerd. Na de aanvang van het onderzoek ter zitting onderscheidenlijk
      na de aanvang van het horen van partijen of getuigen in het vooronderzoek kan het ook mondeling geschieden.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel816
  - number: 8:16.3
    text: Alle feiten of omstandigheden moeten tegelijk worden voorgedragen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel816
  - number: 8:16.4
    text: |-
      Een volgend verzoek om wraking van dezelfde rechter wordt niet in behandeling genomen, tenzij feiten of
      omstandigheden worden voorgedragen die pas na het eerdere verzoek aan de verzoeker bekend zijn geworden.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel816
  - number: 8:16.5
    text: Geschiedt het verzoek ter zitting, dan wordt het onderzoek ter zitting geschorst.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel816
  - number: 8:17
    text: Een rechter wiens wraking is verzocht, kan in de wraking berusten.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel817
  - number: 8:18.1
    text: |-
      Het verzoek om wraking wordt zo spoedig mogelijk ter zitting behandeld door een meervoudige kamer waarin de rechter
      wiens wraking is verzocht, geen zitting heeft.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel818
  - number: 8:18.2
    text: |-
      De verzoeker en de rechter wiens wraking is verzocht, worden in de gelegenheid gesteld te worden gehoord. De
      rechtbank kan ambtshalve of op verzoek van de verzoeker of de rechter wiens wraking is verzocht, bepalen dat zij
      niet in elkaars aanwezigheid zullen worden gehoord.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel818
  - number: 8:18.3
    text: |-
      De rechtbank beslist zo spoedig mogelijk. De rechtbank spreekt de beslissing in het openbaar uit. De beslissing
      is gemotiveerd en wordt onverwijld aan de verzoeker, de andere partijen en de rechter wiens wraking was verzocht
      medegedeeld.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel818
  - number: 8:18.4
    text: |-
      In geval van misbruik kan de rechtbank bepalen dat een volgend verzoek niet in behandeling wordt genomen. Hiervan
      wordt in de beslissing melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel818
  - number: 8:18.5
    text: Tegen de beslissing staat geen rechtsmiddel open.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel818
  - number: 8:19.1
    text: |-
      Op grond van feiten of omstandigheden als bedoeld in [artikel 8:15][ref1] kan elk van de rechters die een zaak
      behandelen, verzoeken zich te mogen verschonen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel819
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.4
  - number: 8:19.2
    text: |-
      Het verzoek geschiedt schriftelijk en is gemotiveerd. Na de aanvang van het onderzoek ter zitting,
      onderscheidenlijk na de aanvang van het horen van partijen of getuigen in het vooronderzoek kan het ook mondeling
      geschieden.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel819
  - number: 8:19.3
    text: Geschiedt het verzoek ter zitting, dan wordt het onderzoek ter zitting geschorst.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel819
  - number: 8:20.1
    text: |-
      Het verzoek om verschoning wordt zo spoedig mogelijk behandeld door een meervoudige kamer waarin de rechter die om
      verschoning heeft verzocht, geen zitting heeft.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel820
  - number: 8:20.2
    text: |-
      De rechtbank beslist zo spoedig mogelijk. De beslissing is gemotiveerd en wordt onverwijld aan partijen en de
      rechter die om verschoning had verzocht medegedeeld.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel820
  - number: 8:20.3
    text: Tegen de beslissing staat geen rechtsmiddel open.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel820
  - number: 8:21.1
    text: |-
      Natuurlijke personen, onbekwaam om in rechte te staan, worden in het geding vertegenwoordigd door hun
      vertegenwoordigers naar burgerlijk recht. De wettelijke vertegenwoordiger behoeft niet de machtiging van de
      kantonrechter, bedoeld in [artikel 349 van Boek 1 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel349
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel821
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '349'
  - number: 8:21.2
    text: |-
      De in het eerste lid bedoelde personen kunnen zelf in het geding optreden, indien zij tot redelijke waardering van
      hun belangen in staat kunnen worden geacht.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel821
  - number: 8:21.3
    text: |-
      Indien geen wettelijke vertegenwoordiger aanwezig is, of deze niet beschikbaar is en de zaak spoedeisend is, kan
      de rechtbank een voorlopige vertegenwoordiger benoemen. De benoeming vervalt zodra een wettelijke vertegenwoordiger
      aanwezig is of de wettelijke vertegenwoordiger weer beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel821
  - number: 8:22.1
    text: |-
      In geval van faillissement of surséance van betaling of toepassing van de schuldsaneringsregeling natuurlijke
      personen zijn de [artikelen 25][ref1], [27][ref2] en [31 van de Faillissementswet][ref3] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0001860#Artikel31
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel822
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0001860
        artikel: '27'
      - id: ref3
        bwb_id: BWBR0001860
        artikel: '31'
  - number: 8:22.2
    text: |-
      De [artikelen 25, tweede lid][ref1], en [27][ref2] vinden geen toepassing, indien partijen vóór de
      faillietverklaring zijn uitgenodigd om op een zitting van de rechtbank te verschijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel27
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel822
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0001860
        artikel: '27'
  - number: 8:23.1
    text: |-
      Een bestuursorgaan dat een college is, wordt in het geding vertegenwoordigd door een of meer door het
      bestuursorgaan aangewezen leden.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel823
  - number: 8:23.2
    text: |-
      De Kroon wordt in het geding vertegenwoordigd door Onze Minister wie het aangaat onderscheidenlijk door een of meer
      van Onze Ministers wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel823
  - number: 8:24.1
    text: Partijen kunnen zich laten bijstaan of door een gemachtigde laten vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel824
  - number: 8:24.2
    text: De rechtbank kan van een gemachtigde een schriftelijke machtiging verlangen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel824
  - number: 8:24.3
    text: Het tweede lid is niet van toepassing ten aanzien van advocaten en procureurs.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel824
  - number: 8:25.1
    text: De rechtbank kan bijstand of vertegenwoordiging door een persoon tegen wie ernstige bezwaren bestaan, weigeren.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel825
  - number: 8:25.2
    text: |-
      De betrokken partij en de in het eerste lid bedoelde persoon worden onverwijld in kennis gesteld van de weigering
      en de reden daarvoor.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel825
  - number: 8:25.3
    text: Het eerste lid is niet van toepassing ten aanzien van advocaten en procureurs.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel825
  - number: 8:26.1
    text: |-
      De rechtbank kan tot de sluiting van het onderzoek ter zitting ambtshalve, op verzoek van een partij of op hun
      eigen verzoek, belanghebbenden in de gelegenheid stellen als partij aan het geding deel te nemen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel826
  - number: 8:26.2
    text: |-
      Indien de rechtbank vermoedt dat er onbekende belanghebbenden zijn, kan zij in de *Staatscourant* doen aankondigen
      dat een zaak bij haar aanhangig is. Naast de aankondiging in de *Staatscourant* kan ook een ander middel voor de
      aankondiging worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel826
  - number: 8:27.1
    text: |-
      Partijen die door de rechtbank zijn opgeroepen om in persoon dan wel in persoon of bij gemachtigde te verschijnen,
      al dan niet voor het geven van inlichtingen, zijn verplicht te verschijnen en de verlangde inlichtingen te geven.
      Partijen worden hierop gewezen, alsmede op [artikel 8:31][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel827
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.5
  - number: 8:27.2
    text: |-
      Indien het een rechtspersoon betreft of een bestuursorgaan dat een college is, kan de rechtbank een of meer
      bepaalde bestuurders onderscheidenlijk een of meer bepaalde leden oproepen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel827
  - number: 8:28
    text: |-
      Partijen aan wie door de rechtbank is verzocht schriftelijk inlichtingen te geven, zijn verplicht de verlangde
      inlichtingen te geven. Partijen worden hierop gewezen, alsmede op [artikel 8:31][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel828
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.5
  - number: 8:29.1
    text: |-
      Partijen die verplicht zijn inlichtingen te geven dan wel stukken over te leggen, kunnen, indien daarvoor
      gewichtige redenen zijn, het geven van inlichtingen dan wel het overleggen van stukken weigeren of de rechtbank
      mededelen dat uitsluitend zij kennis zal mogen nemen van de inlichtingen onderscheidenlijk de stukken.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel829
  - number: 8:29.2
    text: |-
      Gewichtige redenen zijn voor een bestuursorgaan in ieder geval niet aanwezig, voor zover ingevolge de
      [Wet openbaarheid van bestuur][ref1] de verplichting zou bestaan een verzoek om informatie, vervat in de over te
      leggen stukken, in te willigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel829
    references:
      - id: ref1
        bwb_id: BWBR0005252
  - number: 8:29.3
    text: |-
      De rechtbank beslist of de in het eerste lid bedoelde weigering onderscheidenlijk de beperking van de kennisneming
      gerechtvaardigd is.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel829
  - number: 8:29.4
    text: Indien de rechtbank heeft beslist dat de weigering gerechtvaardigd is, vervalt de verplichting.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel829
  - number: 8:29.5
    text: |-
      Indien de rechtbank heeft beslist dat de beperking van de kennisneming gerechtvaardigd is, kan zij slechts
      met toestemming van de andere partijen mede op de grondslag van die inlichtingen onderscheidenlijk die stukken
      uitspraak doen. Indien de toestemming wordt geweigerd, wordt de zaak verwezen naar een andere kamer.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel829
  - number: 8:30
    text: |-
      Partijen zijn verplicht mee te werken aan een onderzoek als bedoeld in [artikel 8:47, eerste lid][ref1]. Partijen
      worden hierop gewezen, alsmede op [artikel 8:31][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel830
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.2
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.5
  - number: 8:31
    text: |-
      Indien een partij niet voldoet aan de verplichting te verschijnen, inlichtingen te geven, stukken over te leggen
      of mee te werken aan een onderzoek als bedoeld in [artikel 8:47, eerste lid][ref1], kan de rechtbank daaruit de
      gevolgtrekkingen maken die haar geraden voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel831
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.2
  - number: 8:32.1
    text: |-
      De rechtbank kan, indien de vrees bestaat dat kennisneming van stukken door een partij haar lichamelijke of
      geestelijke gezondheid zou schaden, bepalen dat deze kennisneming is voorbehouden aan een gemachtigde die advocaat
      of arts is dan wel daarvoor van de rechtbank bijzondere toestemming heeft gekregen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel832
  - number: 8:32.2
    text: |-
      De rechtbank kan, indien kennisneming van stukken door een partij de persoonlijke levenssfeer van een ander
      onevenredig zou schaden, bepalen dat deze kennisneming is voorbehouden aan een gemachtigde die advocaat of arts is
      dan wel daarvoor van de rechtbank bijzondere toestemming heeft gekregen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel832
  - number: 8:33.1
    text: |-
      Ieder die door de rechtbank als getuige wordt opgeroepen, is verplicht aan de oproeping gevolg te geven en
      getuigenis af te leggen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel833
  - number: 8:33.2
    text: |-
      In de oproeping worden vermeld de plaats en het tijdstip waarop de getuige zal worden gehoord, de feiten waarop het
      horen betrekking zal hebben en de gevolgen die zijn verbonden aan het niet verschijnen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel833
  - number: 8:33.3
    text: |-
      De [artikelen 165, tweede en derde lid][ref1], [172][ref2],
      [173, eerste lid, eerste volzin, tweede en derde lid][ref3], [174, eerste lid][ref4],
      [175][ref5], [176, eerste en derde lid][ref6], [177, eerste lid][ref7] en
      [178 van het Wetboek van Burgerlijke Rechtsvordering][ref8] zijn van overeenkomstige toepassing


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel165
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel172
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel173
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel174
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel175
      [ref6]: https://wetten.overheid.nl/BWBR0001827#Artikel176
      [ref7]: https://wetten.overheid.nl/BWBR0001827#Artikel177
      [ref8]: https://wetten.overheid.nl/BWBR0001827#Artikel178
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel833
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '165'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '172'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '173'
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '174'
      - id: ref5
        bwb_id: BWBR0001827
        artikel: '175'
      - id: ref6
        bwb_id: BWBR0001827
        artikel: '176'
      - id: ref7
        bwb_id: BWBR0001827
        artikel: '177'
      - id: ref8
        bwb_id: BWBR0001827
        artikel: '178'
  - number: 8:33.4
    text: |-
      De rechtbank kan bepalen dat getuigen niet zullen worden gehoord dan na het afleggen van de eed of de belofte. Zij
      leggen in dat geval de eed of de belofte af dat zij zullen zeggen de gehele waarheid en niets dan de waarheid.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel833
  - number: 8:34.1
    text: |-
      De deskundige die zijn benoeming heeft aanvaard, is verplicht zijn opdracht onpartijdig en naar beste weten te
      vervullen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel834
  - number: 8:34.2
    text: |-
      [Artikel 165, tweede lid, onderdeel b, en derde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel165
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel834
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '165'
  - number: 8:35.1
    text: |-
      De tolk die zijn benoeming heeft aanvaard en die door de rechtbank wordt opgeroepen, is verplicht aan de oproeping
      gevolg te geven en zijn opdracht onpartijdig en naar beste weten te vervullen. De [artikelen 172][ref1] en
      [178 van het Wetboek van Burgerlijke Rechtsvordering][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel172
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel178
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel835
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '172'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '178'
  - number: 8:35.2
    text: |-
      In de oproeping worden vermeld de plaats en het tijdstip waarop de opdracht moet worden vervuld en de gevolgen die
      zijn verbonden aan het niet verschijnen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel835
  - number: 8:36.1
    text: |-
      Aan de door de rechtbank opgeroepen getuigen, deskundigen en tolken en de deskundigen die een onderzoek als bedoeld
      in [artikel 8:47, eerste lid][ref1], hebben ingesteld, wordt ten laste van het Rijk een vergoeding toegekend. Het
      bij en krachtens de [Wet tarieven in strafzaken][ref2] bepaalde is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002406
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel836
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.2
      - id: ref2
        bwb_id: BWBR0002406
  - number: 8:36.2
    text: |-
      De partij die een getuige of deskundige heeft meegebracht of opgeroepen, dan wel aan wie een verslag
      van een deskundige is uitgebracht, is aan deze een vergoeding verschuldigd. Het bij en krachtens de
      [Wet tarieven in strafzaken][ref1] bepaalde is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002406
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel836
    references:
      - id: ref1
        bwb_id: BWBR0002406
  - number: 8:37.1
    text: |-
      Oproepingen, de uitnodiging om op een zitting van de rechtbank te verschijnen, alsmede de verzending van een
      afschrift van de uitspraak en van het proces-verbaal van de mondelinge uitspraak geschieden door de griffier bij
      aangetekende brief of bij brief met ontvangstbevestiging, tenzij de rechtbank anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel837
  - number: 8:37.2
    text: |-
      Voor het overige geschiedt de verzending van stukken door de griffier bij gewone brief, tenzij de rechtbank anders
      bepaalt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel837
  - number: 8:37.3
    text: In een brief wordt de datum van verzending vermeld.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel837
  - number: 8:38.1
    text: |-
      Indien de griffier een bij aangetekende brief of bij brief met ontvangstbevestiging verzonden stuk terug ontvangt
      en hem blijkt dat de geadresseerde op de dag van verzending of uiterlijk een week daarna in de gemeentelijke
      basisadministratie persoonsgegevens stond ingeschreven op het op het stuk vermelde adres, dan verzendt hij het stuk
      zo spoedig mogelijk bij gewone brief.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel838
  - number: 8:38.2
    text: |-
      In de overige gevallen waarin de griffier een bij aangetekende brief of bij brief met ontvangstbevestiging
      verzonden stuk terug ontvangt, verbetert hij, indien mogelijk, het op het stuk vermelde adres en verzendt hij het
      stuk opnieuw bij aangetekende brief of bij brief met ontvangstbevestiging.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel838
  - number: 8:39.1
    text: |-
      De griffier zendt de op de zaak betrekking hebbende stukken zo spoedig mogelijk aan partijen, voor zover de
      rechtbank niet op grond van de [artikelen 8:29][ref1] of [8:32][ref2] anders heeft beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel839
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.5
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.5
  - number: 8:39.2
    text: |-
      De griffier kan de toezending van zeer omvangrijke stukken of van stukken die bezwaarlijk kunnen worden
      vermenigvuldigd, achterwege laten. Hij stelt partijen daarvan in kennis en vermeldt daarbij dat deze stukken
      gedurende een door hem te bepalen termijn van ten minste een week ter griffie ter inzage worden gelegd.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel839
  - number: 8:39.3
    text: |-
      Partijen kunnen afschriften van of uittreksels uit de in het tweede lid bedoelde stukken verkrijgen. Met
      betrekking tot de kosten is het bij en krachtens de [Wet tarieven in strafzaken][ref1] bepaalde van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002406
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel839
    references:
      - id: ref1
        bwb_id: BWBR0002406
  - number: 8:40
    text: |-
      Indien het beroepschrift is ingediend door twee of meer personen, kan worden volstaan met verzending van de
      oproeping, de uitnodiging om op een zitting van de rechtbank te verschijnen, de op de zaak betrekking hebbende
      stukken en een afschrift van de uitspraak of van het proces-verbaal van de mondelinge uitspraak aan de persoon die
      als eerste in het beroepschrift is vermeld.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel840
  - number: 8:41.1
    text: |-
      Van de indiener van het beroepschrift wordt door de griffier een griffierecht geheven. Indien het een beroepschrift
      ter zake van twee of meer samenhangende besluiten of van twee of meer indieners ter zake van hetzelfde besluit
      betreft, is eenmaal griffierecht verschuldigd. In die gevallen bedraagt het griffierecht het hoogste op grond van
      het derde lid ter zake van een van de besluiten onderscheidenlijk door een van de indieners verschuldigde bedrag.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel841
  - number: 8:41.2
    text: |-
      De griffier wijst de indiener van het beroepschrift op de verschuldigdheid van het griffierecht en deelt hem
      mee dat het verschuldigde bedrag binnen vier weken na de dag van verzending van zijn mededeling dient te zijn
      bijgeschreven op de rekening van de rechtbank dan wel ter griffie dient te zijn gestort. Indien het bedrag
      niet binnen deze termijn is bijgeschreven of gestort, wordt het beroep niet-ontvankelijk verklaard, tenzij
      redelijkerwijs niet kan worden geoordeeld dat de indiener in verzuim is geweest.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel841
  - number: 8:41.3
    text: 'Het griffierecht bedraagt:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel841
  - number: 8:41.3.a
    text: '€ 38 indien door een natuurlijke persoon beroep is ingesteld tegen:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel841
  - number: 8:41.3.a.1°
    text: |-
      een besluit, genomen op grond van een wettelijk voorschrift dat is opgenomen in de onderdelen B en C,
      onder 1 tot en met 25, 29 en 33, dit laatste voor zover het een besluit betreft dat is genomen op grond van
      [artikel 21a van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], van [de bijlage die bij de
      Beroepswet](onbekend) behoort,


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel21a
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel841
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 21a
  - number: 8:41.3.a.2°
    text: |-
      een besluit inzake een uitkering bij werkloosheid of ziekte, genomen ten aanzien van een ambtenaar als
      bedoeld in [artikel 1 van de Ambtenarenwet][ref1] als zodanig of een dienstplichtige als bedoeld in
      [hoofdstuk 2 van de Kaderwet dienstplicht][ref2] als zodanig, hun nagelaten betrekkingen of hun rechtverkrijgenden,
      of


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008589#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel841
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0008589
        hoofdstuk: '2'
  - number: 8:41.3.a.3°
    text: |-
      een besluit inzake een uitkering op grond van blijvende arbeidsongeschiktheid op grond van een wettelijk
      voorschrift waarbij de natuurlijke persoon ter zake van zijn arbeidsongeschiktheid vanwege het Rijk
      invaliditeitspensioen is verzekerd of een besluit, genomen op grond van artikel P 9 van de Algemene burgerlijke
      pensioenwet,
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel841
  - number: 8:41.3.a.4e
    text: |-
      een besluit genomen op grond van de [Wet op de huurtoeslag][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0008659
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel841
    references:
      - id: ref1
        bwb_id: BWBR0008659
  - number: 8:41.3.b
    text: |-
      € 141 indien door een natuurlijke persoon beroep is ingesteld tegen een ander besluit dan een besluit als bedoeld
      in onderdeel *a*, tenzij bij wet anders is bepaald, en
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel841
  - number: 8:41.3.c
    text: € 281 indien anders dan door een natuurlijke persoon beroep is ingesteld.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel841
  - number: 8:41.4
    text: |-
      Indien het beroep wordt ingetrokken omdat het bestuursorgaan geheel of gedeeltelijk aan de indiener van het
      beroepschrift is tegemoetgekomen, wordt het door de indiener betaalde griffierecht aan hem vergoed door de
      desbetreffende rechtspersoon. In de overige gevallen kan de desbetreffende rechtspersoon, indien het beroep wordt
      ingetrokken, het betaalde griffierecht geheel of gedeeltelijk vergoeden.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel841
  - number: 8:41.5
    text: |-
      De in het derde lid genoemde bedragen kunnen bij algemene maatregel van bestuur worden gewijzigd voor zover het
      prijsindexcijfer van de gezinsconsumptie daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel841
  - number: 8:42.1
    text: |-
      Binnen vier weken na de dag van verzending van het beroepschrift aan het bestuursorgaan zendt dit de op de zaak
      betrekking hebbende stukken aan de rechtbank en dient het een verweerschrift in.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel842
  - number: 8:42.2
    text: De rechtbank kan de in het eerste lid bedoelde termijn verlengen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel842
  - number: 8:43.1
    text: |-
      De rechtbank kan de indiener van het beroepschrift in de gelegenheid stellen schriftelijk te repliceren. In
      dat geval wordt het bestuursorgaan in de gelegenheid gesteld schriftelijk te dupliceren. De rechtbank stelt de
      termijnen voor repliek en dupliek vast.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel843
  - number: 8:43.2
    text: |-
      De rechtbank stelt andere partijen dan de in het eerste lid bedoelde in de gelegenheid om ten minste eenmaal een
      schriftelijke uiteenzetting over de zaak te geven. Zij stelt hiervoor een termijn vast.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel843
  - number: 8:44.1
    text: |-
      De rechtbank kan partijen oproepen om in persoon dan wel in persoon of bij gemachtigde te verschijnen om te worden
      gehoord, al dan niet voor het geven van inlichtingen. Indien niet alle partijen worden opgeroepen, worden de niet
      opgeroepen partijen in de gelegenheid gesteld het horen bij te wonen en een uiteenzetting over de zaak te geven.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel844
  - number: 8:44.2
    text: Van het geven van inlichtingen wordt door de griffier een proces-verbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel844
  - number: 8:44.3
    text: |-
      Het wordt door de voorzitter van de meervoudige kamer en de griffier ondertekend. Bij verhindering van de
      voorzitter of de griffier wordt dit in het proces-verbaal vermeld.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel844
  - number: 8:45.1
    text: |-
      De rechtbank kan partijen en anderen verzoeken binnen een door haar te bepalen termijn schriftelijk inlichtingen te
      geven en onder hen berustende stukken in te zenden.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel845
  - number: 8:45.2
    text: |-
      Bestuursorganen zijn, ook als zij geen partij zijn, verplicht aan het verzoek, bedoeld in het eerste lid, te
      voldoen. [Artikel 8:29][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel845
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.5
  - number: 8:45.3
    text: |-
      Werkgevers van partijen zijn, ook als zij geen partij zijn, verplicht aan het verzoek, bedoeld in het eerste lid,
      te voldoen. [Artikel 8:29][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel845
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.5
  - number: 8:46.1
    text: De rechtbank kan getuigen oproepen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel846
  - number: 8:46.2
    text: |-
      De rechtbank deelt de namen en woonplaatsen van de getuigen, de plaats en het tijdstip waarop dezen zullen worden
      gehoord en de feiten waarop het horen betrekking zal hebben, ten minste een week tevoren aan partijen mee.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel846
  - number: 8:46.3
    text: |-
      De [artikelen 179, eerste, tweede en derde lid, eerste volzin][ref1], en
      [180, eerste tot en met derde en vijfde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel179
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel180
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel846
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '179'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '180'
  - number: 8:47.1
    text: De rechtbank kan een deskundige benoemen voor het instellen van een onderzoek.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel847
  - number: 8:47.2
    text: Bij de benoeming worden vermeld de opdracht die moet worden vervuld en de termijn, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel847
  - number: 8:47.3
    text: |-
      Van het voornemen tot het benoemen van een deskundige als bedoeld in het eerste lid wordt aan partijen mededeling
      gedaan. De rechtbank kan partijen in de gelegenheid stellen om hun wensen omtrent het onderzoek binnen een door
      haar te bepalen termijn schriftelijk aan haar kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel847
  - number: 8:47.4
    text: |-
      De rechtbank stelt een termijn binnen welke de deskundige aan haar een schriftelijk verslag van het onderzoek
      uitbrengt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel847
  - number: 8:47.5
    text: |-
      Partijen kunnen binnen vier weken na de dag van verzending van het verslag aan hen schriftelijk hun zienswijze met
      betrekking tot het verslag naar voren brengen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel847
  - number: 8:47.6
    text: De rechtbank kan de in het vijfde lid bedoelde termijn verlengen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel847
  - number: 8:48.1
    text: |-
      De arts die voor het instellen van een onderzoek als bedoeld in [artikel 8:47, eerste lid][ref1], een persoon moet
      onderzoeken, kan de voor het onderzoek van belang zijnde inlichtingen over deze persoon inwinnen bij de behandelend
      arts of de behandelende artsen, de verzekeringsarts en de adviserend arts van het bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel848
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.2
  - number: 8:48.2
    text: |-
      Zij verstrekken de gevraagde inlichtingen voor zover daardoor de persoonlijke levenssfeer van de betrokken persoon
      niet onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel848
  - number: 8:49
    text: De rechtbank kan tolken benoemen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel849
  - number: 8:50.1
    text: |-
      De rechtbank kan een onderzoek ter plaatse instellen. Zij heeft daarbij toegang tot elke plaats voor zover dat
      redelijkerwijs voor de vervulling van haar taak nodig is.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel850
  - number: 8:50.2
    text: Bestuursorganen verlenen de medewerking die in het belang van het onderzoek is vereist.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel850
  - number: 8:50.3
    text: |-
      Van plaats en tijdstip van het onderzoek wordt aan partijen mededeling gedaan. Zij kunnen bij het onderzoek
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel850
  - number: 8:50.4
    text: Van het onderzoek wordt door de griffier een proces-verbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel850
  - number: 8:50.5
    text: |-
      Het wordt door de voorzitter van de meervoudige kamer en de griffier ondertekend. Bij verhindering van de
      voorzitter of de griffier wordt dit in het proces-verbaal vermeld.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel850
  - number: 8:51.1
    text: |-
      De rechtbank kan aan een door haar aangewezen gerechtsauditeur of aan de griffier opdragen een onderzoek ter
      plaatse in te stellen. Deze heeft daarbij toegang tot elke plaats voor zover dat redelijkerwijs voor de vervulling
      van de hem opgedragen taak nodig is. De rechtbank is bevoegd tot het geven van een machtiging tot binnentreden.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel851
  - number: 8:51.2
    text: |-
      [Artikel 8:50, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel851
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.2
  - number: 8:51.3
    text: |-
      Van het onderzoek wordt door de gerechtsauditeur of de griffier een proces-verbaal opgemaakt, dat door hem wordt
      ondertekend.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel851
  - number: 8:52.1
    text: De rechtbank kan, indien de zaak spoedeisend is, bepalen dat deze versneld wordt behandeld.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel852
  - number: 8:52.2
    text: 'In dat geval kan de rechtbank:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel852
  - number: 8:52.2.a
    text: |-
      de in [artikel 8:41, tweede lid][ref1], bedoelde termijn verkorten,


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel852
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.1
  - number: 8:52.2.b
    text: |-
      de in [artikel 8:42, eerste lid][ref1], bedoelde termijn verkorten,


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel852
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.2
  - number: 8:52.2.c
    text: |-
      [artikel 8:43, tweede lid][ref1], geheel of gedeeltelijk buiten toepassing laten,


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel852
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.2
  - number: 8:52.2.d
    text: |-
      [artikel 8:47, derde lid][ref1], geheel of gedeeltelijk buiten toepassing laten, en


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel852
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.2
  - number: 8:52.2.e
    text: |-
      de in [artikel 8:47, vijfde lid][ref1], bedoelde termijn verkorten.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel852
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.2
  - number: 8:52.3
    text: |-
      Indien de rechtbank bepaalt dat de zaak versneld wordt behandeld, bepaalt zij tevens zo spoedig mogelijk
      het tijdstip waarop de zitting zal plaatsvinden en doet zij daarvan onverwijld mededeling aan partijen.
      [Artikel 8:56][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel852
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.5
  - number: 8:53
    text: |-
      Blijkt aan de rechtbank bij de behandeling dat de zaak niet voldoende spoedeisend is om een versnelde behandeling
      te rechtvaardigen of dat de zaak een gewone behandeling vordert, dan bepaalt zij dat de zaak verder op de gewone
      wijze wordt behandeld.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel853
  - number: 8:54.1
    text: |-
      Totdat partijen zijn uitgenodigd om op een zitting van de rechtbank te verschijnen, kan de rechtbank het onderzoek
      sluiten, indien voortzetting van het onderzoek niet nodig is, omdat:
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel854
  - number: 8:54.1.a
    text: zij kennelijk onbevoegd is,
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel854
  - number: 8:54.1.b
    text: het beroep kennelijk niet-ontvankelijk is,
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel854
  - number: 8:54.1.c
    text: het beroep kennelijk ongegrond is, of
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel854
  - number: 8:54.1.d
    text: het beroep kennelijk gegrond is.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel854
  - number: 8:54.2
    text: |-
      In de uitspraak na toepassing van het eerste lid worden partijen gewezen op [artikel 8:55, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel854
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.4
  - number: 8:54a.1
    text: |-
      Totdat partijen zijn uitgenodigd om op een zitting van de rechtbank te verschijnen, kan de rechtbank het onderzoek
      sluiten, indien voortzetting van het onderzoek niet nodig is, omdat het bestuursorgaan kennelijk ten onrechte heeft
      ingestemd met rechtstreeks beroep bij de rechtbank.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel854a
  - number: 8:54a.2
    text: |-
      In dat geval strekt de uitspraak ertoe dat het bestuursorgaan het beroepschrift als bezwaarschrift behandelt.
      [Artikel 7:10][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel854a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.2'
  - number: 8:55.1
    text: |-
      Tegen de uitspraak, bedoeld in [artikel 8:54, tweede lid][ref1], kunnen een belanghebbende en het bestuursorgaan
      verzet doen bij de rechtbank. De indiener van het verzetschrift kan daarbij vragen in de gelegenheid te worden
      gesteld over het verzet te worden gehoord. De [artikelen 6:4, derde lid][ref2], [6:5 tot en met 6:9][ref3],
      [6:11][ref4], [6:14][ref5], [6:15][ref6], [6:17][ref7] en [6:21][ref8] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref8]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel855
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.4
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref7
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref8
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
  - number: 8:55.2
    text: |-
      Indien bij wet de werking van een uitspraak wordt opgeschort totdat de termijn voor het instellen van hoger
      beroep is verstreken of, indien hoger beroep is ingesteld, op het hoger beroep is beslist, wordt de werking van de
      uitspraak, bedoeld in [artikel 8:54, tweede lid][ref1], op overeenkomstige wijze opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel855
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.4
  - number: 8:55.3
    text: |-
      Alvorens uitspraak te doen op het verzet, stelt de rechtbank de indiener van het verzetschrift die daarom heeft
      gevraagd, in de gelegenheid op een zitting te worden gehoord, tenzij zij van oordeel is dat het verzet gegrond is.
      Indien de indiener van het verzetschrift daarom niet heeft gevraagd, kan de rechtbank hem in de gelegenheid stellen
      op een zitting te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel855
  - number: 8:55.4
    text: |-
      Indien de uitspraak waartegen verzet is gedaan, is gedaan door een meervoudige kamer, wordt uitspraak op het verzet
      gedaan door een meervoudige kamer. Van de kamer die uitspraak doet op het verzet maakt geen deel uit degene die
      zitting heeft gehad in de kamer die de uitspraak heeft gedaan waartegen verzet is gedaan.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel855
  - number: 8:55.5
    text: 'De uitspraak strekt tot:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel855
  - number: 8:55.5.a
    text: niet-ontvankelijkverklaring van het verzet,
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel855
  - number: 8:55.5.b
    text: ongegrondverklaring van het verzet, of
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel855
  - number: 8:55.5.c
    text: gegrondverklaring van het verzet.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel855
  - number: 8:55.6
    text: |-
      Indien de rechtbank het verzet niet-ontvankelijk of ongegrond verklaart, blijft de uitspraak waartegen verzet was
      gedaan in stand.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel855
  - number: 8:55.7
    text: |-
      Indien de rechtbank het verzet gegrond verklaart, vervalt de uitspraak waartegen verzet was gedaan en wordt het
      onderzoek voortgezet in de stand waarin het zich bevond.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel855
  - number: 8:56
    text: |-
      Na afloop van het vooronderzoek worden partijen ten minste drie weken tevoren uitgenodigd om op een in de
      uitnodiging te vermelden plaats en tijdstip op een zitting van de rechtbank te verschijnen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel856
  - number: 8:57
    text: |-
      Indien partijen daarvoor toestemming hebben gegeven, kan de rechtbank bepalen dat het onderzoek ter zitting
      achterwege blijft. In dat geval sluit de rechtbank het onderzoek.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel857
  - number: 8:58.1
    text: Tot tien dagen voor de zitting kunnen partijen nadere stukken indienen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel858
  - number: 8:58.2
    text: |-
      Op deze bevoegdheid worden partijen in de uitnodiging, bedoeld in [artikel 8:56][ref1], gewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel858
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.5
  - number: 8:59
    text: |-
      De rechtbank kan een partij oproepen om in persoon dan wel in persoon of bij gemachtigde te verschijnen, al dan
      niet voor het geven van inlichtingen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel859
  - number: 8:60.1
    text: De rechtbank kan getuigen oproepen en deskundigen en tolken benoemen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel860
  - number: 8:60.2
    text: |-
      De opgeroepen getuige en de deskundige of de tolk die zijn benoeming heeft aanvaard en door de
      rechtbank wordt opgeroepen, zijn verplicht aan de oproeping gevolg te geven. De [artikelen 172][ref1] en
      [178 van het Wetboek van Burgerlijke Rechtsvordering][ref2] zijn van overeenkomstige toepassing. In de oproeping
      van de deskundige worden vermeld de opdracht die moet worden vervuld, de plaats en het tijdstip waarop de opdracht
      moet worden vervuld en de gevolgen die zijn verbonden aan het niet verschijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel172
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel178
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel860
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '172'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '178'
  - number: 8:60.3
    text: |-
      Namen en woonplaatsen van de opgeroepen getuigen en deskundigen en de feiten waarop het horen betrekking zal hebben
      onderscheidenlijk de opdracht die moet worden vervuld, worden bij de uitnodiging, bedoeld in [artikel 8:56][ref1],
      aan partijen zoveel mogelijk medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel860
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.5
  - number: 8:60.4
    text: |-
      Partijen kunnen getuigen en deskundigen meebrengen of bij aangetekende brief of deurwaardersexploit oproepen, mits
      daarvan uiterlijk een week voor de dag van de zitting aan de rechtbank en aan de andere partijen mededeling is
      gedaan, met vermelding van namen en woonplaatsen. Op deze bevoegdheid worden partijen in de uitnodiging, bedoeld in
      [artikel 8:56][ref1], gewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel860
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.5
  - number: 8:61.1
    text: De voorzitter van de meervoudige kamer heeft de leiding van de zitting.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel861
  - number: 8:61.2
    text: De griffier houdt aantekening van het verhandelde ter zitting.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel861
  - number: 8:61.3
    text: |-
      De griffier maakt een proces-verbaal op van de zitting, indien de rechtbank dit ambtshalve of op verzoek van een
      partij die daarbij belang heeft, bepaalt en indien hoger beroep wordt ingesteld.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel861
  - number: 8:61.4
    text: |-
      Het bevat de namen van de rechter of de rechters die de zaak behandelt onderscheidenlijk behandelen, die van
      partijen en van hun vertegenwoordigers of gemachtigden die op de zitting zijn verschenen en van degenen die hen
      hebben bijgestaan, en die van de getuigen, deskundigen en tolken die op de zitting zijn verschenen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel861
  - number: 8:61.5
    text: Het houdt een vermelding in van hetgeen op de zitting met betrekking tot de zaak is voorgevallen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel861
  - number: 8:61.6
    text: |-
      Het wordt door de voorzitter van de meervoudige kamer en de griffier ondertekend. Bij verhindering van de
      voorzitter of de griffier wordt dit in het proces-verbaal vermeld.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel861
  - number: 8:61.7
    text: Aan het proces-verbaal kunnen overgelegde pleitnotities worden gehecht.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel861
  - number: 8:61.8
    text: |-
      De rechtbank kan bepalen dat de verklaring van een partij, getuige of deskundige geheel in het proces-verbaal
      zal worden opgenomen. In dat geval wordt de verklaring onverwijld op schrift gesteld en aan de partij, getuige of
      deskundige voorgelezen. Deze mag daarin wijzigingen aanbrengen, die op schrift worden gesteld en aan de partij,
      getuige of deskundige worden voorgelezen. De verklaring wordt door de partij, getuige of deskundige ondertekend.
      Heeft ondertekening niet plaats, dan wordt de reden daarvan in het proces-verbaal vermeld.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel861
  - number: 8:62.1
    text: De zitting is openbaar.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel862
  - number: 8:62.2
    text: 'De rechtbank kan bepalen dat het onderzoek ter zitting geheel of gedeeltelijk zal plaatshebben met gesloten deuren:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel862
  - number: 8:62.2.a
    text: in het belang van de openbare orde of de goede zeden,
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel862
  - number: 8:62.2.b
    text: in het belang van de veiligheid van de Staat,
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel862
  - number: 8:62.2.c
    text: indien de belangen van minderjarigen of de eerbiediging van de persoonlijke levenssfeer van partijen dit eisen, of
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel862
  - number: 8:62.2.d
    text: indien openbaarheid het belang van een goede rechtspleging ernstig zou schaden.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel862
  - number: 8:63.1
    text: |-
      Op het horen van getuigen en deskundigen is
      [artikel 179, tweede en derde lid, eerste volzin, van het Wetboek van Burgerlijke Rechtsvordering][ref1]
      van overeenkomstige toepassing. Op het horen van getuigen is
      [artikel 179, eerste lid, van het Wetboek van Burgerlijke Rechtsvordering][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel179
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel179
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel863
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '179'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '179'
  - number: 8:63.2
    text: |-
      De rechtbank kan afzien van het horen van door een partij meegebrachte of opgeroepen getuigen en deskundigen indien
      zij van oordeel is dat dit redelijkerwijs niet kan bijdragen aan de beoordeling van de zaak.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel863
  - number: 8:63.3
    text: |-
      Indien een door een partij opgeroepen getuige of deskundige niet is verschenen, kan de rechtbank deze oproepen. In
      dat geval schorst de rechtbank het onderzoek ter zitting.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel863
  - number: 8:64.1
    text: De rechtbank kan het onderzoek ter zitting schorsen. Zij kan daarbij bepalen dat het vooronderzoek wordt hervat.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel864
  - number: 8:64.2
    text: |-
      Indien bij de schorsing geen tijdstip van de nadere zitting is bepaald, bepaalt de rechtbank dit zo spoedig
      mogelijk. De griffier doet zo spoedig mogelijk mededeling aan partijen van het tijdstip van de nadere zitting.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel864
  - number: 8:64.3
    text: |-
      In de gevallen waarin schorsing van het onderzoek ter zitting heeft plaatsgevonden, wordt de zaak op de nadere
      zitting hervat in de stand waarin zij zich bevond.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel864
  - number: 8:64.4
    text: De rechtbank kan bepalen dat het onderzoek ter zitting opnieuw wordt aangevangen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel864
  - number: 8:64.5
    text: |-
      Indien partijen daarvoor toestemming hebben gegeven, kan de rechtbank bepalen dat de nadere zitting achterwege
      blijft. In dat geval sluit de rechtbank het onderzoek.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel864
  - number: 8:65.1
    text: De rechtbank sluit het onderzoek ter zitting, wanneer zij van oordeel is dat het is voltooid.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel865
  - number: 8:65.2
    text: Voordat het onderzoek ter zitting wordt gesloten, hebben partijen het recht voor het laatst het woord te voeren.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel865
  - number: 8:65.3
    text: Zodra het onderzoek ter zitting is gesloten, deelt de voorzitter mee wanneer uitspraak zal worden gedaan.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel865
  - number: 8:66.1
    text: |-
      Tenzij mondeling uitspraak wordt gedaan, doet de rechtbank binnen zes weken na de sluiting van het onderzoek
      schriftelijk uitspraak.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel866
  - number: 8:66.2
    text: In bijzondere omstandigheden kan de rechtbank deze termijn met ten hoogste zes weken verlengen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel866
  - number: 8:66.3
    text: Van deze verlenging wordt aan partijen mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel866
  - number: 8:67.1
    text: |-
      De rechtbank kan na de sluiting van het onderzoek ter zitting onmiddellijk mondeling uitspraak doen. De uitspraak
      kan voor ten hoogste een week worden verdaagd onder aanzegging aan partijen van het tijdstip van de uitspraak.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel867
  - number: 8:67.2
    text: De mondelinge uitspraak bestaat uit de beslissing en de gronden van de beslissing.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel867
  - number: 8:67.3
    text: Van de mondelinge uitspraak wordt door de griffier een proces-verbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel867
  - number: 8:67.4
    text: |-
      Het wordt door de voorzitter van de meervoudige kamer en de griffier ondertekend. Bij verhindering van de
      voorzitter of de griffier wordt dit in het proces-verbaal vermeld.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel867
  - number: 8:67.5
    text: |-
      De rechtbank spreekt de beslissing, bedoeld in het tweede lid, in het openbaar uit, in tegenwoordigheid van
      de griffier. Daarbij wordt vermeld door wie, binnen welke termijn en bij welke administratieve rechter welk
      rechtsmiddel kan worden aangewend.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel867
  - number: 8:67.6
    text: De mededeling, bedoeld in het vijfde lid, tweede volzin, wordt in het proces-verbaal vermeld.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel867
  - number: 8:68.1
    text: |-
      Indien de rechtbank van oordeel is dat het onderzoek niet volledig is geweest, kan zij het heropenen. De rechtbank
      bepaalt daarbij op welke wijze het onderzoek wordt voortgezet.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel868
  - number: 8:68.2
    text: De griffier doet zo spoedig mogelijk mededeling daarvan aan partijen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel868
  - number: 8:69.1
    text: |-
      De rechtbank doet uitspraak op de grondslag van het beroepschrift, de overgelegde stukken, het verhandelde tijdens
      het vooronderzoek en het onderzoek ter zitting.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel869
  - number: 8:69.2
    text: De rechtbank vult ambtshalve de rechtsgronden aan.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel869
  - number: 8:69.3
    text: De rechtbank kan ambtshalve de feiten aanvullen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel869
  - number: 8:70
    text: 'De uitspraak strekt tot:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel870
  - number: 8:70.a
    text: onbevoegdverklaring van de rechtbank,
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel870
  - number: 8:70.b
    text: niet-ontvankelijkverklaring van het beroep,
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel870
  - number: 8:70.c
    text: ongegrondverklaring van het beroep, of
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel870
  - number: 8:70.d
    text: gegrondverklaring van het beroep.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel870
  - number: 8:71
    text: |-
      Voor zover uitsluitend een vordering bij de burgerlijke rechter kan worden ingesteld, wordt dit in de uitspraak
      vermeld. De burgerlijke rechter is aan die beslissing gebonden.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel871
  - number: 8:72.1
    text: Indien de rechtbank het beroep gegrond verklaart, vernietigt zij het bestreden besluit geheel of gedeeltelijk.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel872
  - number: 8:72.2
    text: |-
      Vernietiging van een besluit of een gedeelte van een besluit brengt vernietiging van de rechtsgevolgen van dat
      besluit of van het vernietigde gedeelte daarvan mee.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel872
  - number: 8:72.3
    text: |-
      De rechtbank kan bepalen dat de rechtsgevolgen van het vernietigde besluit of het vernietigde gedeelte daarvan
      geheel of gedeeltelijk in stand blijven.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel872
  - number: 8:72.4
    text: |-
      Indien de rechtbank het beroep gegrond verklaart, kan zij het bestuursorgaan opdragen een nieuw besluit te nemen of
      een andere handeling te verrichten met inachtneming van haar uitspraak, dan wel kan zij bepalen dat haar uitspraak
      in de plaats treedt van het vernietigde besluit of het vernietigde gedeelte daarvan.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel872
  - number: 8:72.5
    text: |-
      De rechtbank kan het bestuursorgaan een termijn stellen voor het nemen van een nieuw besluit of het verrichten
      van een andere handeling, alsmede zo nodig een voorlopige voorziening treffen. In het laatste geval bepaalt de
      rechtbank het tijdstip waarop de voorlopige voorziening vervalt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel872
  - number: 8:72.6
    text: |-
      De rechtbank kan bepalen dat een voorlopige voorziening vervalt op een later tijdstip dan het tijdstip waarop zij
      uitspraak heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel872
  - number: 8:72.7
    text: |-
      De rechtbank kan bepalen dat, indien of zolang het bestuursorgaan niet voldoet aan een uitspraak, de door haar
      aangewezen rechtspersoon aan een door haar aangewezen partij een in de uitspraak vast te stellen dwangsom verbeurt.
      De [artikelen 611a tot en met 611i van het Wetboek van Burgerlijke Rechtsvordering][ref1] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel611a
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel872
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 611a
  - number: 8:73.1
    text: |-
      Indien de rechtbank het beroep gegrond verklaart, kan zij, indien daarvoor gronden zijn, op verzoek van een partij
      de door haar aangewezen rechtspersoon veroordelen tot vergoeding van de schade die die partij lijdt.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel873
  - number: 8:73.2
    text: |-
      Indien de rechtbank de omvang van de schadevergoeding bij haar uitspraak niet of niet volledig kan vaststellen,
      bepaalt zij in haar uitspraak dat ter voorbereiding van een nadere uitspraak daarover het onderzoek wordt heropend.
      De rechtbank bepaalt daarbij op welke wijze het onderzoek wordt voortgezet.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel873
  - number: 8:73a.1
    text: |-
      Ingeval van intrekking van het beroep omdat het bestuursorgaan geheel of gedeeltelijk aan de indiener van
      het beroepschrift is tegemoetgekomen, kan de rechtbank, op verzoek van de indiener de door haar aangewezen
      rechtspersoon bij afzonderlijke uitspraak met toepassing van [artikel 8:73][ref1] veroordelen tot vergoeding van de
      schade die de verzoeker lijdt. Het verzoek wordt gedaan tegelijk met de intrekking van het beroep. Indien aan dit
      vereiste niet is voldaan, wordt het verzoek niet-ontvankelijk verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel873a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.6
  - number: 8:73a.2
    text: |-
      De rechtbank stelt de verzoeker zo nodig in de gelegenheid het verzoek schriftelijk toe te lichten en stelt het
      bestuursorgaan in de gelegenheid een verweerschrift in te dienen. Zij stelt hiervoor termijnen vast. Indien het
      verzoek mondeling wordt gedaan, kan de rechtbank bepalen dat het toelichten van het verzoek en het voeren van
      verweer onmiddellijk mondeling geschieden.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel873a
  - number: 8:73a.3
    text: |-
      Indien het toelichten van het verzoek en het voeren van verweer mondeling zijn geschied, sluit de rechtbank het
      onderzoek. In de overige gevallen zijn de [afdelingen 8.2.4][ref1] en [8.2.5][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel873a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '8'
        afdeling: 8.2.4
      - id: ref2
        bwb_id: BWBR0005537
        hoofdstuk: '8'
        afdeling: 8.2.5
  - number: 8:74.1
    text: |-
      Indien de rechtbank het beroep gegrond verklaart, houdt de uitspraak tevens in dat aan de indiener van het
      beroepschrift het door hem betaalde griffierecht wordt vergoed door de door de rechtbank aangewezen rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel874
  - number: 8:74.2
    text: |-
      In de overige gevallen kan de uitspraak inhouden dat het betaalde griffierecht door de door de rechtbank aangewezen
      rechtspersoon geheel of gedeeltelijk wordt vergoed.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel874
  - number: 8:75.1
    text: |-
      De rechtbank is bij uitsluiting bevoegd een partij te veroordelen in de kosten die een andere partij in
      verband met de behandeling van het beroep bij de rechtbank, en van het bezwaar of van het administratief
      beroep redelijkerwijs heeft moeten maken. De [artikelen 7:15, tweede tot en met vierde lid][ref1], en
      [7:28, tweede lid, eerste volzin, derde en vierde lid][ref2], zijn van toepassing. Een natuurlijke persoon kan
      slechts in de kosten worden veroordeeld in geval van kennelijk onredelijk gebruik van procesrecht. Bij algemene
      maatregel van bestuur worden nadere regels gesteld over de kosten waarop een veroordeling als bedoeld in de eerste
      volzin uitsluitend betrekking kan hebben en over de wijze waarop bij de uitspraak het bedrag van de kosten wordt
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel875
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.3'
  - number: 8:75.2
    text: |-
      In geval van een veroordeling in de kosten ten behoeve van een partij aan wie ter zake van het
      beroep op de rechtbank, het bezwaar of het administratief beroep een toevoeging is verleend krachtens
      de [Wet op de rechtsbijstand][ref1], wordt het bedrag van de kosten betaald aan de griffier.
      [Artikel 243 van het Wetboek van Burgerlijke Rechtsvordering][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006368
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel243
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel875
    references:
      - id: ref1
        bwb_id: BWBR0006368
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '243'
  - number: 8:75.3
    text: |-
      Indien een bestuursorgaan in de kosten wordt veroordeeld, wijst de rechtbank de rechtspersoon aan die de kosten
      moet vergoeden.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel875
  - number: 8:75a.1
    text: |-
      In geval van intrekking van het beroep omdat het bestuursorgaan geheel of gedeeltelijk aan de indiener van het
      beroepschrift is tegemoetgekomen, kan het bestuursorgaan op verzoek van de indiener bij afzonderlijke uitspraak
      met toepassing van [artikel 8:75][ref1] in de kosten worden veroordeeld. Het verzoek wordt gedaan tegelijk met de
      intrekking van het beroep. Indien aan dit vereiste niet is voldaan, wordt het verzoek niet-ontvankelijk verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel875a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.6
  - number: 8:75a.2
    text: |-
      [Artikel 8:73a, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel875a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.6
  - number: 8:76
    text: |-
      Voor zover een uitspraak strekt tot betaling van een bepaald geldbedrag kan zij ten uitvoer worden gelegd
      overeenkomstig de bepalingen van het [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering](onbekend).
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel876
  - number: 8:77.1
    text: 'De schriftelijke uitspraak vermeldt:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel877
  - number: 8:77.1.a
    text: de namen van partijen en van hun vertegenwoordigers of gemachtigden,
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel877
  - number: 8:77.1.b
    text: de gronden van de beslissing,
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel877
  - number: 8:77.1.c
    text: de beslissing,
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel877
  - number: 8:77.1.d
    text: de naam van de rechter of de namen van de rechters die de zaak heeft onderscheidenlijk hebben behandeld,
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel877
  - number: 8:77.1.e
    text: de dag waarop de beslissing is uitgesproken, en
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel877
  - number: 8:77.1.f
    text: door wie, binnen welke termijn en bij welke administratieve rechter welk rechtsmiddel kan worden aangewend.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel877
  - number: 8:77.2
    text: |-
      Indien de uitspraak strekt tot gegrondverklaring van het beroep, wordt in de uitspraak vermeld welke geschreven of
      ongeschreven rechtsregel of welk algemeen rechtsbeginsel geschonden wordt geoordeeld.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel877
  - number: 8:77.3
    text: |-
      De uitspraak wordt ondertekend door de voorzitter van de meervoudige kamer en de griffier. Bij verhindering van de
      voorzitter of de griffier wordt dit in de uitspraak vermeld.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel877
  - number: 8:78
    text: |-
      De rechtbank spreekt de beslissing, bedoeld in [artikel 8:77, eerste lid, onderdeel c][ref1], in het openbaar uit,
      in tegenwoordigheid van de griffier.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel878
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.6
  - number: 8:79.1
    text: |-
      Binnen twee weken na de dagtekening van de uitspraak zendt de griffier kosteloos een afschrift van de uitspraak of
      van het proces-verbaal van de mondelinge uitspraak aan partijen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel879
  - number: 8:79.2
    text: |-
      Anderen dan partijen kunnen afschriften of uittreksels van de uitspraak of van het proces-verbaal van de mondelinge
      uitspraak verkrijgen. Met betrekking tot de kosten is het bij en krachtens de [Wet tarieven in strafzaken][ref1]
      bepaalde van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002406
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel879
    references:
      - id: ref1
        bwb_id: BWBR0002406
  - number: 8:80
    text: |-
      Indien de rechtbank bepaalt dat haar uitspraak in de plaats treedt van het vernietigde besluit, wordt de uitspraak
      bovendien overeenkomstig de voor dat besluit voorgeschreven wijze bekendgemaakt door het bevoegde bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel880
  - number: 8:81.1
    text: |-
      Indien tegen een besluit bij de rechtbank beroep is ingesteld dan wel, voorafgaand aan een mogelijk beroep bij de
      rechtbank, bezwaar is gemaakt of administratief beroep is ingesteld, kan de voorzieningenrechter van de rechtbank
      die bevoegd is of kan worden in de hoofdzaak, op verzoek een voorlopige voorziening treffen indien onverwijlde
      spoed, gelet op de betrokken belangen, dat vereist.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel881
  - number: 8:81.2
    text: |-
      Indien bij de rechtbank beroep is ingesteld, kan een verzoek om voorlopige voorziening worden gedaan door een
      partij in de hoofdzaak.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel881
  - number: 8:81.3
    text: |-
      Indien voorafgaand aan een mogelijk beroep bij de rechtbank bezwaar is gemaakt of administratief beroep is
      ingesteld, kan een verzoek om voorlopige voorziening worden gedaan door de indiener van het bezwaarschrift,
      onderscheidenlijk door de indiener van het beroepschrift of door de belanghebbende die geen recht heeft tot het
      instellen van administratief beroep.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel881
  - number: 8:81.4
    text: |-
      De [artikelen 6:4, derde lid][ref1], [6:5][ref2], [6:6][ref3], [6:14][ref4], [6:15][ref5], [6:17][ref6] en
      [6:21][ref7] zijn van overeenkomstige toepassing. De indiener van het verzoekschrift die bezwaar heeft gemaakt dan
      wel beroep heeft ingesteld, legt daarbij een afschrift van het bezwaar- of beroepschrift over.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel881
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref7
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
  - number: 8:81.5
    text: |-
      Indien een verzoek om voorlopige voorziening is gedaan nadat bezwaar is gemaakt of administratief beroep is
      ingesteld en op dit bezwaar of beroep wordt beslist voordat de zitting heeft plaatsgevonden, wordt de verzoeker
      in de gelegenheid gesteld beroep bij de rechtbank in te stellen. Het verzoek om voorlopige voorziening wordt
      gelijkgesteld met een verzoek dat wordt gedaan hangende het beroep bij de rechtbank.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel881
  - number: 8:82.1
    text: |-
      Van de verzoeker wordt door de griffier een griffierecht
      geheven.[ Artikel 8:41, eerste lid, tweede en derde volzin, derde en vijfde lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel882
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.1
  - number: 8:82.2
    text: |-
      [Artikel 8:41, tweede lid][ref1], is van overeenkomstige toepassing, met dien verstande dat de termijn binnen
      welke de bijschrijving of storting van het verschuldigde bedrag dient plaats te vinden, twee weken bedraagt. De
      voorzieningenrechter kan een kortere termijn stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel882
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.1
  - number: 8:82.3
    text: |-
      Indien het verzoek wordt ingetrokken omdat het bestuursorgaan, onderscheidenlijk de belanghebbende tot wie het
      bestreden besluit is gericht, aan de voorzieningenrechter schriftelijk heeft medegedeeld de uitvoering van het
      bestreden besluit hangende de procedure met betrekking tot de hoofdzaak op te schorten dan wel de gevraagde
      voorlopige maatregelen te zullen nemen wordt het betaalde griffierecht door de griffier terugbetaald. In de overige
      gevallen kan de desbetreffende rechtspersoon, indien het verzoek wordt ingetrokken, het betaalde griffierecht
      geheel of gedeeltelijk vergoeden.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel882
  - number: 8:82.4
    text: |-
      De uitspraak kan inhouden dat het betaalde griffierecht door de door de voorzieningenrechter aangewezen
      rechtspersoon geheel of gedeeltelijk wordt vergoed.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel882
  - number: 8:83.1
    text: |-
      Partijen worden zo spoedig mogelijk uitgenodigd om op een in de uitnodiging te vermelden plaats en
      tijdstip op een zitting te verschijnen. Binnen een door de voorzieningenrechter te bepalen termijn
      zendt het bestuursorgaan de op de zaak betrekking hebbende stukken aan hem.[ Artikel 8:58][ref1] is van
      overeenkomstige toepassing, met dien verstande dat tot één dag voor de zitting nadere stukken kunnen
      worden ingediend. De [artikelen 8:59 tot en met 8:65][ref2] zijn van overeenkomstige toepassing, met
      dien verstande dat getuigen en deskundigen kunnen worden meegebracht of opgeroepen zonder dat de in
      [artikel 8:60, vierde lid, eerste volzin][ref3], bedoelde mededeling is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel883
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.5
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.5
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.5
  - number: 8:83.2
    text: |-
      Indien administratief beroep is ingesteld, wordt het beroepsorgaan eveneens uitgenodigd om op de zitting te
      verschijnen. Het beroepsorgaan wordt in de gelegenheid gesteld ter zitting een uiteenzetting over de zaak te geven.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel883
  - number: 8:83.3
    text: |-
      Indien de voorzieningenrechter kennelijk onbevoegd is of het verzoek kennelijk niet-ontvankelijk, kennelijk
      ongegrond of kennelijk gegrond is, kan de voorzieningenrechter uitspraak doen zonder toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel883
  - number: 8:83.4
    text: |-
      Indien onverwijlde spoed dat vereist en partijen daardoor niet in hun belangen worden geschaad, kan de
      voorzieningenrechter ook in andere gevallen uitspraak doen zonder toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel883
  - number: 8:84.1
    text: De voorzieningenrechter doet zo spoedig mogelijk schriftelijk of mondeling uitspraak.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel884
  - number: 8:84.2
    text: 'De uitspraak strekt tot:'
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel884
  - number: 8:84.2.a
    text: onbevoegdverklaring van de voorzieningenrechter,
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel884
  - number: 8:84.2.b
    text: niet-ontvankelijkverklaring van het verzoek,
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel884
  - number: 8:84.2.c
    text: afwijzing van het verzoek, of
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel884
  - number: 8:84.2.d
    text: gehele of gedeeltelijke toewijzing van het verzoek.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel884
  - number: 8:84.3
    text: |-
      De griffier zendt onverwijld een afschrift van de uitspraak of van het proces-verbaal van de mondelinge uitspraak
      kosteloos aan partijen.
    url: https://wetten.overheid.nl/BWBR0005537/2006-10-11#Artikel884
  - number: 8:84.4
    text: |-
      De [artikelen 8:67, tweede tot en met vijfde lid][ref1], [8:68][ref2], [8:69][ref3],
      [8:72, vijfde en zevende lid][ref4], [8:75][ref5], [8:75][ref6], [8:76][ref7], [8:77, eerste en derde lid][ref8],
      [8:78][ref9], [8:79, tweede lid][ref10], en [8:80][ref11] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel8
