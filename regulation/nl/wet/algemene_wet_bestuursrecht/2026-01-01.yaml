  - number: 3:11
    text: |-
      1 Het bestuursorgaan legt het ontwerp van het te nemen besluit, met de daarop betrekking hebbende stukken die
      redelijkerwijs nodig zijn voor een beoordeling van het ontwerp, ter inzage, met uitzondering van stukken waarvoor
      bij wettelijk voorschrift mededeling op de in [artikel 12 van de Bekendmakingswet][ref1] bepaalde wijze is
      voorgeschreven.

      2 [ Artikel 5.1 van de Wet open overheid][ref2] is van overeenkomstige toepassing. Indien op grond daarvan bepaalde
      stukken niet ter inzage worden gelegd, wordt daarvan mededeling gedaan.

      3 De stukken liggen ter inzage gedurende de in [artikel 3:16, eerste lid][ref3], bedoelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0045754#Artikel5.1
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel316
