  - number: 8:29
    text: |-
      1 Partijen die verplicht zijn inlichtingen te geven dan wel stukken over te leggen, kunnen, indien daarvoor
      gewichtige redenen zijn, het geven van inlichtingen dan wel het overleggen van stukken weigeren of de
      bestuursrechter mededelen dat uitsluitend hij kennis zal mogen nemen van de inlichtingen onderscheidenlijk de
      stukken.

      2 Gewichtige redenen zijn voor een bestuursorgaan in ieder geval niet aanwezig, voor zover ingevolge de
      [Wet open overheid][ref1] de verplichting zou bestaan een verzoek om informatie, vervat in de over te leggen
      stukken, in te willigen.

      3 De bestuursrechter beslist of de in het eerste lid bedoelde weigering onderscheidenlijk de beperking van de
      kennisneming gerechtvaardigd is.

      4 Indien de bestuursrechter heeft beslist dat de weigering gerechtvaardigd is, vervalt de verplichting.

      5 Indien de bestuursrechter heeft beslist dat de beperking van de kennisneming gerechtvaardigd is, kan hij slechts
      met toestemming van de andere partijen mede op de grondslag van die inlichtingen onderscheidenlijk die stukken
      uitspraak doen. Indien de toestemming wordt geweigerd, wordt de zaak verwezen naar een andere kamer.

      6 Inzake een beroep tegen een besluit op grond van de [Wet open overheid][ref2] neemt, in zo verre in afwijking
      van het eerste en derde lid, uitsluitend de bestuursrechter kennis van de stukken waarvan op grond van de Wet
      open overheid om openbaarmaking of verstrekking is verzocht. De toestemming, bedoeld in het vijfde lid, is van
      rechtswege verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0045754
      [ref2]: https://wetten.overheid.nl/BWBR0045754
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel829
    references:
