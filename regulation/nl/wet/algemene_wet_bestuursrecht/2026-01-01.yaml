  - number: B2:3
    text: |-
      Tegen een besluit, genomen op grond van een in dit artikel genoemd voorschrift of anderszins in dit artikel
      omschreven, kan beroep worden ingesteld bij de Centrale Raad van Beroep. Een besluit waarbij de volgende
      ambtenaren, hun nagelaten betrekkingen of hun rechtverkrijgenden belanghebbende zijn:

      a. een rechterlijk ambtenaar als bedoeld in [artikel 1, onderdeel b, van de Wet op de rechterlijke organisatie][ref1]
      als zodanig

      b. een lid van de Centrale Raad van Beroep of het College van Beroep voor het bedrijfsleven met rechtspraak belast
      als zodanig

      c. een senior-gerechtsauditeur of gerechtsauditeur van de Centrale Raad van Beroep of het College van Beroep voor
      het bedrijfsleven als zodanig

      d. een gewezen ambtenaar als bedoeld in onderdeel a, b of c als zodanig

      [Algemene pensioen- en uitkeringswet politieke ambtsdragers][ref2]

      [Garantiewet Burgerlijk Overheidspersoneel Indonesië][ref3], voor zover het betreft een besluit op grond van de
      Algemene oorlogsongevallenregeling

      [Liquidatiewet ongevallenwetten][ref4]: [artikel 24, eerste lid][ref5]

      [Tijdelijke vergoedingsregeling psychotherapie na-oorlogse generatie][ref6]

      [Wet buitengewoon pensioen 1940–1945][ref7]

      [Wet buitengewoon pensioen Indisch verzet][ref8]

      [Wet buitengewoon pensioen zeelieden-oorlogsslachtoffers][ref9]

      [Wet uitkeringen burger-oorlogsslachtoffers 1940–1945][ref10]

      [Wet uitkeringen vervolgingsslachtoffers 1940–1945][ref11]


