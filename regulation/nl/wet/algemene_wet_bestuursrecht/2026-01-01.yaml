  - number: B2:2
    text: |-
      Tegen een besluit, genomen op grond van een in dit artikel genoemd voorschrift of anderszins in dit artikel
      omschreven, kan beroep worden ingesteld bij de Afdeling bestuursrechtspraak van de Raad van State.

      [Archiefwet 1995][ref1]: [artikel 38][ref2], indien overeenkomstige toepassing is gegeven aan:

      a. [artikel 124 van de Gemeentewet][ref3], voor zover het beroep wordt ingesteld door het dagelijks bestuur of het
      algemeen bestuur van een waterschap;

      b. [artikel 124a van de Gemeentewet][ref4], voor zover het beroep wordt ingesteld door gedeputeerde staten, en

      c. [hoofdstuk XVII van de Gemeentewet][ref5]

      [Bekendmakingswet][ref6]: [artikel 21][ref7], indien overeenkomstige toepassing is gegeven
      [artikel 121 van de Provinciewet][ref8], voor zover het beroep wordt ingesteld door het dagelijks bestuur of het
      algemeen bestuur van een waterschap

      [ Experimentenwet onderwijs][ref9]

      Gedelegeerde Verordening (EU) 2019/331 van de Commissie van 19 december 2018 tot vaststelling van een voor de hele
      Unie geldende overgangsregeling voor de geharmoniseerde kosteloze toewijzing van emissierechten overeenkomstig
      artikel 10bis van Richtlijn 2003/87/EG van het Europees Parlement en de Raad (PbEU 2019, L 59): voor zover het
      besluiten betreft van de Nederlandse emissieautoriteit, genoemd in [artikel 2.1 van de Wet milieubeheer][ref10]

      [Gemeentewet][ref11]:

      a. [artikel 85, tweede lid][ref12]

      b. [artikel 124][ref13], voor zover het beroep wordt ingesteld door de raad, het college van burgemeester en
      wethouders, onderscheidenlijk de burgemeester

      c. [artikel 124a][ref14], voor zover het beroep wordt ingesteld door gedeputeerde staten, onderscheidenlijk de
      commissaris van de Koning

      d. [artikel 125][ref15], voor zover het besluit betrekking heeft op de handhaving van het bepaalde bij of krachtens
      de in [artikel 20.3, eerste lid, van de Wet milieubeheer][ref16], bedoelde wetten of wettelijke bepalingen

      e. [artikel 268, eerste lid][ref17]

      f. de [artikelen 278a, vierde lid][ref18], en [281, tweede lid][ref19], indien overeenkomstige toepassing is
      gegeven aan [artikel 124 van de Gemeentewet][ref20] voor zover het beroep wordt ingesteld door de raad, het college
      van burgemeester en wethouders, onderscheidenlijk de burgemeester, en indien overeenkomstige toepassing is gegeven
      aan [artikel 124a van de Gemeentewet][ref21] voor zover het beroep wordt ingesteld door gedeputeerde staten,
      onderscheidenlijk de commissaris van de Koning

      [Kaderwet dienstplicht][ref22]: de [artikelen 10, eerste lid][ref23], [11][ref24] en [13][ref25]

      [Kernenergiewet][ref26]

      [Kieswet][ref27]:

      a. de [artikelen D 7][ref28], [G 1 tot en met G 4][ref29], [I 4][ref30], [K 8][ref31], [L 11][ref32],
      [M 4][ref33], [Q 6][ref34], [S 2][ref35], [X 4, derde lid][ref36], [X 4a, derde lid][ref37][X 5, derde lid][ref38],
      [X 7, vierde lid][ref39], [X 7a, vierde lid][ref40], en [X 8, vierde lid][ref41]

      b. [artikel Y 2][ref42] in samenhang met [artikel D 7][ref43], [G 1][ref44], [G 4][ref45], [I 4][ref46],
      [K 8][ref47], [L 11][ref48] of [M 4][ref49]

      c. de [artikelen Y 32][ref50] en [Y 33][ref51]

      [Mijnbouwwet][ref52]:

      a. een besluit dat van toepassing is op het continentaal plat, met uitzondering van een besluit krachtens de
      [afdelingen 5.1.1][ref53], [5.1.2][ref54], [5.3][ref55], [5.4][ref56] of [5.5][ref57]

      b. instemming met een winningsplan krachtens [artikel 34][ref58], en instemming met een opslagplan krachtens
      [39, eerste lid][ref59]

      [Omgevingswet][ref60]:

      a. [artikel 2.4][ref61]

      b. [artikel 2.12a, eerste lid][ref62]

      c. [artikel 2.13a, eerste lid][ref63]

      d. [artikel 2.15, tweede lid][ref64]

      e. [artikel 2.32][ref65], voor zover het betreft de weigering om een ontheffing te verlenen van een regel die is
      gesteld over een besluit waartegen beroep kan worden ingesteld bij de Afdeling bestuursrechtspraak van de Raad
      van State

      f. de [artikelen 2.33][ref66] en [2.34][ref67], voor zover [artikel 16.85 van de Omgevingswet][ref68] niet van
