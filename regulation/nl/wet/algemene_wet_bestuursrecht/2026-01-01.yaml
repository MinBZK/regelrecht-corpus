  - number: 8:40
    text: |-
      Indien het beroepschrift is ingediend door twee of meer personen, kan worden volstaan met verzending van de
      oproeping, de uitnodiging om op een zitting van de bestuursrechter te verschijnen, de op de zaak betrekking
      hebbende stukken en een afschrift van de uitspraak of van het proces-verbaal van de mondelinge uitspraak aan de
      persoon die als eerste in het beroepschrift is vermeld.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel840
  - number: 8:41
    text: |-
      1 Van de indiener van het beroepschrift wordt door de griffier een griffierecht geheven.

      2 Het griffierecht bedraagt:

      a. € 54 indien door een natuurlijke persoon beroep is ingesteld tegen een besluit als omschreven in de bij deze wet
      behorende [Regeling verlaagd griffierecht][ref1],

      b. € 200 indien door een natuurlijke persoon beroep is ingesteld tegen een ander besluit,

      c. € 397 indien anders dan door een natuurlijke persoon beroep is ingesteld.

      3 Indien het een beroepschrift tegen twee of meer samenhangende besluiten dan wel van twee of meer indieners tegen
      hetzelfde besluit betreft, is eenmaal griffierecht verschuldigd. Dit griffierecht is gelijk aan het hoogste van de
      bedragen die bij toepassing van het tweede lid verschuldigd zouden zijn geweest.

      4 De griffier deelt de indiener van het beroepschrift mede welk griffierecht is verschuldigd en wijst hem daarbij
      op het bepaalde in het vijfde en zesde lid.

      5 Het griffierecht dient binnen vier weken na verzending van de mededeling van de griffier te zijn bijgeschreven op
      de rekening van het gerecht dan wel ter griffie te zijn gestort.

      6 Indien het bedrag niet tijdig is bijgeschreven of gestort, is het beroep niet-ontvankelijk, tenzij redelijkerwijs
      niet kan worden geoordeeld dat de indiener in verzuim is geweest. In afwijking van de eerste zin blijft niet-
      ontvankelijkverklaring achterwege, indien aannemelijk is dat de indiener van het beroepschrift op de datum waarop
      het bedrag uiterlijk moet zijn bijgeschreven of gestort, in betalingsonmacht verkeert.

      7 Indien het beroep wordt ingetrokken omdat het bestuursorgaan geheel of gedeeltelijk aan de indiener van het
      beroepschrift is tegemoetgekomen, vergoedt het bestuursorgaan aan de indiener het door deze betaalde griffierecht.

      8 In andere gevallen kan het bestuursorgaan, indien het beroep wordt ingetrokken, het betaalde griffierecht geheel
      of gedeeltelijk vergoeden.


