  - number: 8:109
    text: |-
      1 Het griffierecht voor het hoger beroep bedraagt:

      a. € 147 indien door een natuurlijke persoon hoger beroep is ingesteld tegen een uitspraak omtrent een besluit als
      omschreven in de bij deze wet behorende [Regeling verlaagd griffierecht][ref1],

      b. € 297 indien door een natuurlijke persoon hoger beroep is ingesteld tegen een uitspraak omtrent een ander
      besluit, of

      c. € 596 als anders dan door een natuurlijke persoon hoger beroep is ingesteld.

      2 Indien het bestuursorgaan hoger beroep heeft ingesteld en de aangevallen uitspraak in stand blijft, wordt van het
      bestuursorgaan een griffierecht geheven dat gelijk is aan het in het eerste lid, onderdeel c, genoemde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel8109
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 8:110
    text: |-
      1 Indien hoger beroep is ingesteld, kan degene die ook hoger beroep had kunnen instellen, incidenteel hoger beroep
      instellen. De voorschriften omtrent het hoger beroep zijn van toepassing, tenzij in deze titel anders is bepaald.

      2 Het incidenteel hoger beroep wordt ingesteld binnen zes weken nadat de hogerberoepsrechter de gronden van het
      hoger beroep aan de desbetreffende partij heeft verzonden.

      3 Binnen vier weken nadat de hogerberoepsrechter de gronden van het incidenteel hoger beroep aan partijen heeft
      verzonden, kunnen deze partijen schriftelijk hun zienswijze omtrent het incidenteel hoger beroep naar voren
      brengen.

      4 De hogerberoepsrechter kan de in het tweede en derde lid genoemde termijnen verlengen of, indien hij het hoger
      beroep behandelt met overeenkomstige toepassing van [afdeling 8.2.3][ref1], verkorten.

      5 Voor het incidenteel hoger beroep is geen griffierecht verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel8110
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '8'
        afdeling: 8.2.3
  - number: 8:111
    text: |-
      1 Niet-ontvankelijkheid van het hoger beroep heeft geen gevolgen voor de ontvankelijkheid van het incidenteel hoger
      beroep, tenzij die niet-ontvankelijkheid het gevolg is van:

      a. overschrijding van de termijn voor het instellen van hoger beroep,

      b. overschrijding van de termijn voor betaling van het griffierecht, of

      c. de omstandigheid dat degene die het hoger beroep heeft ingesteld daartoe niet gerechtigd was.

      2 Intrekking van het hoger beroep na aanvang van de termijn voor het instellen van incidenteel hoger beroep heeft
      geen gevolgen voor de ontvankelijkheid van het incidenteel hoger beroep.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel8111
  - number: 8:112
    text: |-
      1 Incidenteel hoger beroep kan worden ingesteld onder de voorwaarde dat het hoger beroep gegrond is.

      2 Een voorwaardelijk incidenteel hoger beroep vervalt als het hoger beroep niet-ontvankelijk of ongegrond is, dan
      wel wordt ingetrokken. In het laatste geval deelt de griffier de indiener mee dat zijn hoger beroep is vervallen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel8112
  - number: 8:113
    text: |-
      1 De hogerberoepsrechter bevestigt de uitspraak van de rechtbank, hetzij met overneming, hetzij met verbetering van
      de gronden, of doet, met gehele of gedeeltelijke vernietiging van de uitspraak, hetgeen de rechtbank zou behoren
      te doen.

      2 Indien de uitspraak van de hogerberoepsrechter ertoe strekt dat het bestuursorgaan een nieuw besluit neemt, kan
      de uitspraak tevens inhouden dat beroep tegen dat besluit slechts kan worden ingesteld bij de hogerberoepsrechter.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel8113
  - number: 8:114
    text: |-
      1 Indien de hogerberoepsrechter de uitspraak van de rechtbank geheel of gedeeltelijk vernietigt, houdt de uitspraak
      tevens in dat het bestuursorgaan aan de indiener van het beroepschrift het door hem betaalde griffierecht vergoedt,
      tenzij de hogerberoepsrechter bepaalt dat het griffierecht door de griffier aan de indiener wordt terugbetaald.

      2 In andere gevallen kan de uitspraak inhouden dat het bestuursorgaan of de griffier het betaalde griffierecht
      geheel of gedeeltelijk vergoedt.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel8114
  - number: 8:115
    text: |-
      1 De hogerberoepsrechter wijst de zaak terug naar de rechtbank die deze in eerste aanleg heeft behandeld, indien:

      a. de rechtbank haar onbevoegdheid of de niet-ontvankelijkheid van het beroep heeft uitgesproken en de
      hogerberoepsrechter deze uitspraak vernietigt met bevoegdverklaring van de rechtbank, onderscheidenlijk
      ontvankelijkverklaring van het beroep, of

      b. de hogerberoepsrechter om andere redenen van oordeel is dat de zaak opnieuw door de rechtbank moet worden
      behandeld.

      2 De griffier zendt de gedingstukken en een afschrift van de uitspraak zo spoedig mogelijk aan de griffier van
      de rechtbank.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel8115
  - number: 8:116
    text: |-
      In de gevallen, bedoeld in [artikel 8:115, eerste lid, onderdeel a][ref1], kan de hogerberoepsrechter de zaak
      zonder terugwijzing afdoen, indien deze naar zijn oordeel geen nadere behandeling door de rechtbank behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8115
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel8116
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 8:115
        hoofdstuk: '8'
  - number: 8:117
    text: |-
      Indien de uitspraak is gedaan door een andere rechtbank dan de bevoegde, kan de hogerberoepsrechter de uitspraak
      als bevoegdelijk gedaan aanmerken.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel8117
  - number: 8:118
    text: |-
      1 In geval van intrekking van het hoger beroep door het bestuursorgaan kan het bestuursorgaan op verzoek van een
      partij bij afzonderlijke uitspraak met overeenkomstige toepassing van [artikel 8:75][ref1] in de kosten worden
      veroordeeld.

      2 Indien het hoger beroep mondeling wordt ingetrokken, wordt het verzoek door de partij die daarbij aanwezig is
      mondeling gedaan, tegelijk met de intrekking van het hoger beroep. Indien aan dit vereiste niet is voldaan, is het
      verzoek niet-ontvankelijk.

      3 Indien het hoger beroep schriftelijk wordt ingetrokken, wordt het verzoek schriftelijk gedaan. In dat geval zijn
      de [artikelen 6:5 tot en met 6:9][ref2], [6:11][ref3], [6:14][ref4], [6:15][ref5], [6:17][ref6] en [6:21][ref7] van
      overeenkomstige toepassing.

      4 [Artikel 8:75a, tweede en derde lid][ref8], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel875
