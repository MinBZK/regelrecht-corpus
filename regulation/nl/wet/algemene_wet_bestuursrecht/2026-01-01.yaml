  - number: 8:106
    text: |-
      1 De werking van een uitspraak van de rechtbank of van de voorzieningenrechter wordt opgeschort totdat de termijn
      voor het instellen van hoger beroep is verstreken of, indien hoger beroep is ingesteld, op het hoger beroep is
      beslist, indien:

      a. de uitspraak betreft een besluit als bedoeld in artikel 9 van de bij deze wet behorende
      [Bevoegdheidsregeling bestuursrechtspraak][ref1], of

      b. tegen de uitspraak hoger beroep kan worden ingesteld bij een gerechtshof.

      2 Het eerste lid geldt niet indien de uitspraak een beroep tegen het niet tijdig nemen van een besluit betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel8106
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 8:107
    text: |-
      1 De griffier van de hogerberoepsrechter doet van het ingestelde hoger beroep zo spoedig mogelijk mededeling aan de
      griffier van de rechtbank die de uitspraak heeft gedaan.

      2 De griffier van de rechtbank stelt de gedingstukken met de aantekeningen van de zitting, voor zover deze op de
      zaak betrekking hebben, en een afschrift van de uitspraak binnen een week na ontvangst van de in het eerste lid
      bedoelde mededeling ter beschikking aan de griffier van de hogerberoepsrechter.

      3 Op verzoek van de hogerberoepsrechter stelt de griffier van de rechtbank het proces-verbaal van de zitting of de
      schriftelijke weergave van een in [artikel 8:36e][ref1] bedoelde beeld- of geluidsopname die het proces-verbaal
      vervangt, ter beschikking aan de griffier van de hogerberoepsrechter binnen een door de hogerberoepsrechter te
      bepalen termijn. De griffier van de hogerberoepsrechter stelt dit proces-verbaal of deze schriftelijke weergave ter
      beschikking aan partijen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel836e
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel8107
