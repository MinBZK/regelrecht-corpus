  - number: 8:92
    text: |-
      1 Het verzoekschrift wordt ondertekend en bevat ten minste:

      a. de naam en het adres van de verzoeker;

      b. de dagtekening;

      c. een aanduiding van de oorzaak van de schade;

      d. een opgave van de aard van de geleden of de te lijden schade en, voor zover redelijkerwijs mogelijk, het bedrag
      van de schade en een specificatie daarvan;

      e. de gronden van het verzoek.

      2 Bij het verzoekschrift worden zo mogelijk een afschrift van het schadeveroorzakende besluit waarop het
      verzoekschrift betrekking heeft, en van het verzoek, bedoeld in [artikel 8:90, tweede lid][ref1], overgelegd.

      3 [Artikel 6:5, derde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel890
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel65
