  - number: 8:7
    text: |-
      1 Indien beroep wordt ingesteld tegen een besluit van een bestuursorgaan van een provincie, een gemeente
      of een waterschap dan wel tegen een besluit van een gemeenschappelijk orgaan, een bestuur van een
      bedrijfsvoeringsorganisatie of een bestuursorgaan van een openbaar lichaam dat is ingesteld met toepassing
      van de [Wet gemeenschappelijke regelingen][ref1], is bevoegd de rechtbank binnen het rechtsgebied waarvan het
      bestuursorgaan zijn zetel heeft.

      2 Indien beroep wordt ingesteld tegen een besluit van een ander bestuursorgaan, is bevoegd de rechtbank binnen het
      rechtsgebied waarvan de indiener van het beroepschrift zijn woonplaats in Nederland heeft. Indien de indiener van
      het beroepschrift geen woonplaats in Nederland heeft, is bevoegd de rechtbank binnen het rechtsgebied waarvan het
      bestuursorgaan zijn zetel heeft.

      3 Indien beroep wordt ingesteld tegen een besluit als bedoeld in hoofdstuk 3 van de bij deze wet behorende
      [Bevoegdheidsregeling bestuursrechtspraak][ref2], is in afwijking van het eerste en tweede lid slechts de door
      dat hoofdstuk aangewezen rechtbank bevoegd. Indien beroep wordt ingesteld tegen een besluit als bedoeld in
      [artikel 4:126][ref3] dat betrekking heeft op schade die is veroorzaakt door een besluit als bedoeld in de eerste
      zin of door een handeling ter uitvoering van een zodanig besluit, is in afwijking van het eerste en tweede lid
      eveneens slechts die rechtbank bevoegd.

      4 Het eerste en tweede lid zijn van overeenkomstige toepassing indien beroep in eerste aanleg kan worden ingesteld
      bij een gerechtshof.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
      [ref2]: https://wetten.overheid.nl/BWBR0005537
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4126
