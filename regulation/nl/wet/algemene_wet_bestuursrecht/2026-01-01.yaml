  - number: 3:1
    text: |-
      1 Op besluiten, inhoudende algemeen verbindende voorschriften:

      a. is [afdeling 3.2][ref1] slechts van toepassing, voor zover de aard van de besluiten zich daartegen niet verzet;

      b. zijn de [afdelingen 3.6][ref2] en [3.7][ref3] niet van toepassing.

      2 Op andere handelingen van bestuursorganen dan besluiten zijn de [afdelingen 3.2 tot en met 3.4][ref4] van
      overeenkomstige toepassing, voor zover de aard van de handelingen zich daartegen niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk3
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk3
