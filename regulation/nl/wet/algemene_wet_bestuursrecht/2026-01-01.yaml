  - number: B2:8
    text: |-
      1 Tegen een besluit, genomen op grond van de [Overgangswet elektriciteitsproductiesector][ref1], kan beroep worden
      ingesteld bij de rechtbank Gelderland.

      2 Tegen een besluit op grond van de [afdelingen 5.1.1][ref2], [5.1.2][ref3], [5.3][ref4],
      [5.4][ref5] en [5.5 van de Mijnbouwwet][ref6] alsmede een besluit als bedoeld in
      [artikel 26 van de Wet voorraadvorming aardolieproducten 2012][ref7] kan beroep worden ingesteld bij de rechtbanken
      Noord-Nederland, Gelderland, Noord-Holland, Den Haag en Zeeland-West-Brabant in het ressort waarvan de indiener
      van het beroepschrift zijn woonplaats heeft. Indien de indiener van het beroepschrift geen woonplaats in Nederland
      heeft, kan beroep worden ingesteld bij de rechtbank binnen het rechtsgebied waarvan het bestuursorgaan zijn zetel
      heeft.

      3 Tegen een besluit van de Raad voor rechtsbijstand, bedoeld in
      [hoofdstuk II van de Wet op de rechtsbijstand][ref8], kan beroep worden ingesteld bij de rechtbank in het
      arrondissement waar de raad is gevestigd.

      4 Tegen een beschikking als bedoeld in [artikel 8:2, tweede lid, van de Algemene douanewet][ref9], met uitzondering
      van een beschikking ter zake van landbouwrestituties, kan beroep worden ingesteld bij de rechtbank Noord-Holland.

      5 Tegen een beschikking als bedoeld in [artikel 18, derde lid, van de Wet strategische diensten][ref10] kan beroep
      worden ingesteld bij de rechtbank te Haarlem.

      6 Tegen een besluit van de Dienst, genoemd in [artikel 1 van de Kadasterwet][ref11], omtrent wijziging van een
      authentiek gegeven of omtrent wijziging van een ander gegeven dan een authentiek gegeven, kan beroep worden
      ingesteld bij de rechtbank binnen het rechtsgebied waarvan:

      a. de onroerende zaak waarmee het betreffende gegeven verband houdt, geheel of grotendeels is gelegen, of

      b. de Dienst, genoemd in [artikel 1 van de Kadasterwet][ref12], is gevestigd indien het betreffende gegeven verband
      houdt met een te boek staand schip of luchtvaartuig.

      7 Tegen een besluit op grond van [artikel 2.3 van de Jeugdwet][ref13] kan beroep worden ingesteld bij de
      kinderrechter binnen wiens rechtsgebied de betrokken gemeente is gelegen.

      8 Tegen een besluit inzake subsidieverstrekking voor een project op grond van de [Uitvoeringswet EFRO][ref14],
      kan beroep worden ingesteld bij de rechtbank binnen het rechtsgebied waarvan een autoriteit als bedoeld in
      [artikel 3 van die wet][ref15] die bevoegd is besluiten te nemen inzake de verstrekking van EFRO-middelen voor het
      project, haar zetel heeft, tenzij die autoriteit in het buitenland gevestigd is.

      9 Tegen een besluit als bedoeld in [hoofdstuk V, afdeling 2, van de Algemene wet inzake rijksbelastingen][ref16]
      van een bestuursorgaan als bedoeld in [artikel 8:7, tweede lid][ref17], kan beroep worden ingesteld bij:

      a. de rechtbanken Noord-Holland, Den Haag en Zeeland-West-Brabant in het ressort waarvan de indiener van het
      beroepschrift zijn woonplaats heeft dan wel, indien de indiener van het beroepschrift geen woonplaats in Nederland
      heeft, bij de rechtbanken Noord-Holland, Den Haag en Zeeland-West-Brabant in het ressort waarvan het bestuursorgaan
      zijn zetel heeft;

      b. de rechtbank Gelderland, indien de indiener van het beroepschrift zijn woonplaats heeft in het arrondissement
      Gelderland, het arrondissement Overijssel of het arrondissement Midden-Nederland, met uitzondering van de
      provincie Flevoland dan wel, indien de indiener van het beroepschrift geen woonplaats in Nederland heeft, wanneer
      het bestuursorgaan zijn zetel heeft in het arrondissement Gelderland, het arrondissement Overijssel of het
      arrondissement Midden-Nederland, met uitzondering van de provincie Flevoland;

      c. de rechtbank Noord-Nederland, indien de indiener van het beroepschrift zijn woonplaats heeft in het
      arrondissement Noord-Nederland of de provincie Flevoland dan wel, indien de indiener van het beroepschrift geen
      woonplaats in Nederland heeft, wanneer het bestuursorgaan zijn zetel heeft in het arrondissement Noord-Nederland of
      de provincie Flevoland.

      10 Tegen een besluit als bedoeld in [artikel 2, derde lid][ref18], en
      [artikel 15, eerste lid, van de Tijdelijke wet Groningen][ref19] kan beroep worden ingesteld bij de rechtbank
      Noord-Nederland.


