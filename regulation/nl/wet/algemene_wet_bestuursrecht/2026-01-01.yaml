  - number: 8:87
    text: |-
      1 De voorzieningenrechter kan, ook ambtshalve, een voorlopige voorziening opheffen of wijzigen, ook als zij is
      getroffen met toepassing van [artikel 8:72, vijfde lid][ref1].

      2 De [artikelen 8:81, tweede, derde en vierde lid][ref2], en [8:82 tot en met 8:86][ref3] zijn van overeenkomstige
      toepassing. Indien voorafgaand aan een mogelijk beroep bij de bestuursrechter bezwaar is gemaakt of administratief
      beroep is ingesteld, kan een verzoek om opheffing of wijziging eveneens worden gedaan door een belanghebbende die
      door de voorlopige voorziening rechtstreeks in zijn belang wordt getroffen, door het bestuursorgaan of door het
      beroepsorgaan.

      3 Indien een verzoek om opheffing of wijziging is gedaan door het bestuursorgaan of het beroepsorgaan en het
      verzoek geheel of gedeeltelijk wordt toegewezen, kan de uitspraak inhouden dat het betaalde griffierecht door de
      griffier aan het bestuursorgaan wordt terugbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel872
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel881
