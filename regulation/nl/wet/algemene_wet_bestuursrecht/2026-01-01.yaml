  - number: 8:55d
    text: |-
      1 Indien het beroep gegrond is en nog geen besluit is bekendgemaakt, bepaalt de bestuursrechter dat het
      bestuursorgaan binnen twee weken na de dag waarop de uitspraak wordt verzonden alsnog een besluit bekendmaakt.

      2 De bestuursrechter verbindt aan zijn uitspraak een nadere dwangsom voor iedere dag dat
      het bestuursorgaan in gebreke blijft de uitspraak na te leven. De [artikelen 611c][ref1] en
      [611g van het Wetboek van Burgerlijke Rechtsvordering][ref2] zijn van overeenkomstige toepassing.

      3 In bijzondere gevallen of indien de naleving van andere wettelijke voorschriften daartoe noopt, kan de
      bestuursrechter een andere termijn bepalen of een andere voorziening treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel611c
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel611g
