  - number: 3:18
    text: |-
      1 Indien het een besluit op aanvraag betreft, neemt het bestuursorgaan het besluit zo spoedig mogelijk, doch
      uiterlijk zes maanden na ontvangst van de aanvraag.

      2 Indien de aanvraag een zeer ingewikkeld of omstreden onderwerp betreft, kan het bestuursorgaan, alvorens een
      ontwerp ter inzage te leggen, binnen acht weken na ontvangst van de aanvraag de in het eerste lid bedoelde termijn
      met een redelijke termijn verlengen. Voordat het bestuursorgaan een besluit tot verlenging neemt, stelt het de
      aanvrager in de gelegenheid zijn zienswijze daarover naar voren te brengen.

      3 In afwijking van het eerste lid neemt het bestuursorgaan het besluit uiterlijk twaalf weken na de
      terinzagelegging van het ontwerp, indien het een besluit betreft:

      a. inzake intrekking van een besluit;

      b. inzake wijziging van een besluit en de aanvraag is gedaan door een ander dan degene tot wie het te wijzigen
      besluit is gericht.

      4 Indien geen zienswijzen naar voren zijn gebracht, doet het bestuursorgaan daarvan zo spoedig mogelijk nadat
      de termijn voor het naar voren brengen van zienswijzen is verstreken, mededeling op de wijze, bedoeld in
      [artikel 3:12, eerste lid][ref1]. In afwijking van het eerste of derde lid neemt het bestuursorgaan het besluit in
      dat geval binnen vier weken nadat de termijn voor het naar voren brengen van zienswijzen is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel312
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel318
    references:
