      Indien de bestuursrechter het verzoek geheel of gedeeltelijk toewijst, veroordeelt hij het bestuursorgaan tot
      vergoeding van schade.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel895
  - number: 8:104
    text: |-
      1 Een belanghebbende en het bestuursorgaan kunnen hoger beroep instellen tegen:

      a. een uitspraak als bedoeld in [artikel 8:66, eerste lid][ref1], of [artikel 8:67, eerste lid][ref2], van de
      rechtbank,

      b. een uitspraak als bedoeld in [artikel 8:86, eerste lid][ref3], van de voorzieningenrechter van de rechtbank,

      c. een uitspraak van de rechtbank op een verzoek als bedoeld in [artikel 8:88, eerste lid][ref4].

      2 Geen hoger beroep kan worden ingesteld tegen:

      a. een uitspraak van de rechtbank na toepassing van [artikel 8:54, eerste lid][ref5],

      b. een uitspraak van de rechtbank als bedoeld in [artikel 8:54a, tweede lid][ref6],

      c. een uitspraak van de rechtbank als bedoeld in [artikel 8:55, zevende lid][ref7],

      d. een uitspraak van de voorzieningenrechter als bedoeld in [artikel 8:84, eerste lid][ref8],

      e. een uitspraak van de voorzieningenrechter als bedoeld in [artikel 8:75a, eerste lid][ref9], in verband met
      [artikel 8:84, vijfde lid][ref10], en

      f. een uitspraak van de voorzieningenrechter als bedoeld in [artikel 8:87][ref11].

      3 Tegelijkertijd met het hoger beroep tegen de in het eerste lid bedoelde uitspraak kan hoger beroep worden
      ingesteld tegen:

      a. een tussenuitspraak als bedoeld in [artikel 8:80a][ref12], of

      b. een andere beslissing van de rechtbank.

      4 Geen hoger beroep kan worden ingesteld tegen de voorlopige voorziening, bedoeld in
      [artikel 8:72, vijfde lid][ref13].


