  - number: 9:1
    text: |-
      1 Een ieder heeft het recht om over de wijze waarop een bestuursorgaan zich in een bepaalde aangelegenheid jegens
      hem of een ander heeft gedragen, een klacht in te dienen bij dat bestuursorgaan.

      2 Een gedraging van een persoon, werkzaam onder de verantwoordelijkheid van een bestuursorgaan, wordt aangemerkt
      als een gedraging van dat bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel91
  - number: 9:2
    text: |-
      Het bestuursorgaan draagt zorg voor een behoorlijke behandeling van mondelinge en schriftelijke klachten over zijn
      gedragingen en over gedragingen van bestuursorganen die onder zijn verantwoordelijkheid werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel92
  - number: 9:3
    text: |-
      Tegen een besluit inzake de behandeling van een klacht over een gedraging van een bestuursorgaan kan geen beroep
      worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel93
  - number: 9:4
    text: |-
      1 Indien een schriftelijke klacht betrekking heeft op een gedraging jegens de klager en voldoet aan de vereisten
      van het tweede lid, zijn de [artikelen 9:5 tot en met 9:12][ref1] van toepassing.

      2 Het klaagschrift wordt ondertekend en bevat ten minste:

      a. de naam en het adres van de indiener;

      b. de dagtekening;

      c. een omschrijving van de gedraging waartegen de klacht is gericht.

      3 [Artikel 6:5, derde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel65
