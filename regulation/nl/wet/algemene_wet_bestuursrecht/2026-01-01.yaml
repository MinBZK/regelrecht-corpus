  - number: 4:96
    text: |-
      1 Het bestuursorgaan kan de beschikking tot uitstel van betaling onderscheidenlijk tot verlening van een voorschot
      intrekken of wijzigen:

      a. indien de voorschriften niet worden nageleefd;

      b. indien de wederpartij onjuiste of onvolledige gegevens heeft verstrekt en de verstrekking van juiste of
      volledige gegevens tot een andere beschikking zou hebben geleid, of

      c. voor zover veranderde omstandigheden zich verzetten tegen voortduring van het uitstel onderscheidenlijk tegen de
      verlening van het voorschot.

      2 De verplichting tot betaling van een voorschot wordt opgeschort met ingang van de dag waarop het bestuursorgaan
      aan de wederpartij schriftelijk kennis geeft van het ernstige vermoeden dat er grond bestaat om toepassing te geven
      aan het eerste lid, aanhef en onder a of b, tot en met de dag waarop de beschikking omtrent intrekking of wijziging
      is bekendgemaakt of de dag waarop sedert de kennisgeving van het ernstige vermoeden dertien weken zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel496
  - number: 4:97
    text: De schuldenaar is in verzuim indien hij niet binnen de voorgeschreven termijn heeft betaald.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel497
  - number: 4:98
    text: |-
      1 Het verzuim heeft de verschuldigdheid van wettelijke rente tot gevolg overeenkomstig de
      [artikelen 119, eerste en tweede lid][ref1], en [120, eerste lid, van Boek 6 van het Burgerlijk Wetboek][ref2].

      2 Wettelijke rente is niet verschuldigd indien het bedrag ervan bij enige of laatste betaling minder bedraagt dan
      € 20, dan wel, indien het bestuursorgaan de schuldenaar is, € 10.

      3 Indien na het intreden van het verzuim de koers van het geld waarin de geldschuld moet worden betaald zich heeft
      gewijzigd, is [artikel 125 van Boek 6 van het Burgerlijk Wetboek][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel119
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel120
      [ref3]: https://wetten.overheid.nl/BWBR0005289#Artikel125
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel498
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '119'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '120'
      - id: ref3
        bwb_id: BWBR0005289
        artikel: '125'
  - number: 4:99
    text: Het bestuursorgaan stelt het bedrag van de verschuldigde wettelijke rente bij beschikking vast.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel499
  - number: 4:100
    text: |-
      Indien het bestuursorgaan de beschikking tot betaling van een door hem verschuldigde geldsom niet tijdig geeft, is
      het wettelijke rente verschuldigd vanaf het tijdstip waarop het in verzuim zou zijn geweest indien de beschikking
      op de laatste dag van de daarvoor gestelde termijn zou zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel4100
  - number: 4:101
    text: |-
      Voor zover het bestuursorgaan uitstel van betaling heeft verleend of de rechter de verplichting tot betaling heeft
      geschorst, is de schuldenaar over de termijn van uitstel of schorsing wettelijke rente verschuldigd, tenzij bij het
      uitstel of de schorsing anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel4101
  - number: 4:102
    text: |-
      1 Indien een betaling aan het bestuursorgaan is geschied op grond van een beschikking die in bezwaar of in beroep
      is gewijzigd of vernietigd, is het bestuursorgaan over de termijn tussen de betaling en de terugbetaling wettelijke
      rente verschuldigd over het te veel betaalde bedrag.

      2 Indien een afwijzende beschikking tot betaling door het bestuursorgaan als gevolg van bezwaar of beroep wordt
      vervangen door een beschikking tot betaling, is het bestuursorgaan wettelijke rente verschuldigd vanaf het tijdstip
      waarop het in verzuim zou zijn geweest indien de beschikking op de laatste dag van de daarvoor gestelde termijn zou
      zijn gegeven.

      3 Wettelijke rente is niet verschuldigd voor zover de belanghebbende onjuiste of onvolledige gegevens heeft
      verstrekt, dan wel aan de belanghebbende is toe te rekenen dat onjuiste of onvolledige gegevens zijn verstrekt.

      4 Dit artikel is van overeenkomstige toepassing indien het bestuursorgaan de beschikking tot betaling met
      terugwerkende kracht wijzigt of intrekt.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel4102
  - number: 4:103
    text: |-
      Deze afdeling is niet van toepassing indien bij de wet een andere regeling omtrent verzuim en de gevolgen daarvan
      is getroffen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel4103
  - number: 4:104
    text: |-
      1 De rechtsvordering tot betaling van een geldsom verjaart vijf jaren nadat de voorgeschreven betalingstermijn
      is verstreken.

      2 Na voltooiing van de verjaring kan het bestuursorgaan zijn bevoegdheden tot aanmaning en verrekening en tot
      uitvaardiging en tenuitvoerlegging van een dwangbevel niet meer uitoefenen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel4104
  - number: 4:105
    text: |-
      1 De verjaring wordt gestuit door een daad van rechtsvervolging overeenkomstig
      [artikel 316, eerste lid, van Boek 3 van het Burgerlijk Wetboek][ref1].
      [Artikel 316, tweede lid, van Boek 3 van het Burgerlijk Wetboek][ref2] is van overeenkomstige toepassing.

      2 Erkenning van het recht op betaling stuit de verjaring van de rechtsvordering tegen hem die het recht erkent.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel316
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel316
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel4105
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '316'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '316'
  - number: 4:106
    text: |-
      Het bestuursorgaan kan de verjaring ook stuiten door een aanmaning als bedoeld in [artikel 4:112][ref1], een
      beschikking tot verrekening of een dwangbevel dan wel door een daad van tenuitvoerlegging van een dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4112
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel4106
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:112
        hoofdstuk: '4'
        paragraaf: 4.4.4.1
        afdeling: 4.4.4
  - number: 4:107
    text: |-
      De schuldeiser van het bestuursorgaan kan de verjaring ook stuiten door een schriftelijke aanmaning of een
      schriftelijke mededeling waarin hij zich ondubbelzinnig zijn recht op betaling voorbehoudt.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel4107
  - number: 4:108
    text: |-
      Indien de schuldeiser van het bestuursorgaan een recht tot verrekening als bedoeld in [artikel 4:93][ref1] heeft,
      eindigt dit recht niet door verjaring van de rechtsvordering.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel493
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel4108
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:93
        hoofdstuk: '4'
        afdeling: 4.4.1
  - number: 4:109
    text: |-
      Indien de schuldeiser van het bestuursorgaan zelf een bestuursorgaan is, zijn de [artikelen 4:107][ref1] en
      [4:108][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4107
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4108
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel4109
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:107
        hoofdstuk: '4'
        afdeling: 4.4.3
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:108
        hoofdstuk: '4'
        afdeling: 4.4.3
  - number: 4:110
    text: |-
      1 Door stuiting van de verjaring begint een nieuwe verjaringstermijn te lopen met de aanvang van de volgende dag.

      2 De nieuwe termijn is gelijk aan de oorspronkelijke, doch niet langer dan vijf jaren.

      3 Wordt de verjaring echter gestuit door het instellen van een eis die door toewijzing wordt gevolgd, dan is
      [artikel 324 van Boek 3 van het Burgerlijk Wetboek][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel324
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel4110
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '324'
  - number: 4:111
    text: |-
      1 De verjaringstermijn van de rechtsvordering tot betaling aan een bestuursorgaan wordt verlengd met de tijd
      gedurende welke de schuldenaar na de aanvang van die termijn uitstel van betaling heeft.

      2 Het eerste lid is van overeenkomstige toepassing indien:

      a. de schuldenaar in surseance van betaling verkeert;

      b. de schuldenaar in staat van faillissement verkeert;

      c. ten aanzien van de schuldenaar de schuldsaneringsregeling natuurlijke personen van toepassing is;

      d. de tenuitvoerlegging van een dwangbevel is geschorst ingevolge een lopend rechtsgeding, met dien verstande dat
      de termijn waarmee de verjaringstermijn wordt verlengd een aanvang neemt op de dag waarop het rechtsgeding door het
      instellen van een vordering bij de burgerlijke rechter aanhangig wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel4111
  - number: 4:112
    text: |-
      1 Het bestuursorgaan maant de schuldenaar die in verzuim is schriftelijk aan tot betaling binnen twee weken,
      gerekend vanaf de dag na die waarop de aanmaning is toegezonden.

      2 Bij wettelijk voorschrift kan een andere termijn worden vastgesteld.

      3 De aanmaning vermeldt dat bij niet tijdige betaling deze kan worden afgedwongen door op kosten van de schuldenaar
      uit te voeren invorderingsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel4112
  - number: 4:113
    text: |-
      1 Het bestuursorgaan kan voor de aanmaning een vergoeding in rekening brengen. De vergoeding bedraagt € 9 indien de
      schuld minder dan € 454  bedraagt en € 20 indien de schuld € 454  of meer bedraagt.

      2 De aanmaning vermeldt de vergoeding die in rekening wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel4113
  - number: 4:114
    text: |-
      Onder dwangbevel wordt verstaan: een schriftelijk bevel van een bestuursorgaan dat ertoe strekt de betaling van een
      geldsom als bedoeld in [artikel 4:85][ref1] af te dwingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel485
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel4114
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:85
        hoofdstuk: '4'
        afdeling: 4.4.1
  - number: 4:115
    text: De bevoegdheid tot uitvaardiging van een dwangbevel bestaat slechts indien zij bij de wet is toegekend.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel4115
  - number: 4:116
    text: |-
      Een dwangbevel levert een executoriale titel op, die met toepassing van de voorschriften van het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] kan worden tenuitvoergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel4116
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 4:117
    text: |-
      1 Een dwangbevel wordt slechts uitgevaardigd wanneer binnen de overeenkomstig [artikel 4:112][ref1] gestelde
      aanmaningstermijn niet volledig is betaald.

      2 Bij de wet kan evenwel worden bepaald dat het dwangbevel zo nodig zonder aanmaning en voor het verstrijken van
      bij wettelijk voorschrift gestelde of eerder gegunde betalings- of aanmaningstermijnen kan worden uitgevaardigd
      of tenuitvoergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4112
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel4117
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:112
        hoofdstuk: '4'
        paragraaf: 4.4.4.1
        afdeling: 4.4.4
  - number: 4:118
    text: |-
      [Artikel 4:8][ref1] is niet van toepassing op de aanmaning en het dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel48
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel4118
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:8
        hoofdstuk: '4'
        afdeling: 4.1.2
  - number: 4:119
    text: |-
      1 Bij het dwangbevel kunnen tevens de aanmaningsvergoeding, de wettelijke rente en de kosten van het dwangbevel
      worden ingevorderd.

      2 Het dwangbevel kan betrekking hebben op verschillende verplichtingen tot betaling van een geldsom door de
      schuldenaar aan het bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel4119
  - number: 4:120
    text: |-
      1 De betekening en de tenuitvoerlegging van het dwangbevel geschieden op kosten van degene tegen wie het is
      uitgevaardigd.

      2 De gerechtelijke kosten worden berekend met toepassing van de op grond van
      [artikel 434a van het Wetboek van Burgerlijke Rechtsvordering][ref1] vastgestelde tarieven. De buitengerechtelijke
      kosten worden berekend met toepassing van bij algemene maatregel van bestuur vast te stellen tarieven.

      3 De kosten zijn ook verschuldigd indien het dwangbevel door betaling van verschuldigde bedragen niet of niet
      volledig ten uitvoer is gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel434a
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel4120
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 434a
  - number: 4:121
    text: |-
      Indien een dwangbevel dat is uitgevaardigd voor een gedeelte van een verplichting tot betaling van een geldsom ten
      uitvoer wordt gelegd door beslaglegging, kunnen bij datzelfde dwangbevel alle tot het tijdstip van beslaglegging
      vervallen termijnen van die verplichting worden ingevorderd, mits het op dat tijdstip invorderbare bedrag uit het
      dwangbevel is op te maken.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel4121
  - number: 4:122
    text: |-
      1 Het dwangbevel vermeldt in ieder geval:

      a. aan het hoofd het woord «dwangbevel»;

      b. het bedrag van de invorderbare hoofdsom;

      c. de beschikking of het wettelijk voorschrift waaruit de geldschuld voortvloeit;

      d. de kosten van het dwangbevel, en

      e. dat het op kosten van de schuldenaar ten uitvoer kan worden gelegd.

      2 Het dwangbevel vermeldt, indien van toepassing:

      a. het bedrag van de aanmaningsvergoeding, en

      b. de ingangsdatum van de wettelijke rente.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel4122
  - number: 4:123
    text: |-
      1 De bekendmaking van een dwangbevel geschiedt door middel van de betekening van een exploot als bedoeld in
      het [Wetboek van Burgerlijke Rechtsvordering][ref1]. De [artikelen 3:41 tot en met 3:45][ref2] zijn niet van
      toepassing.

      2 Het exploot vermeldt in ieder geval de rechtbank waarbij tegen het dwangbevel en de tenuitvoerlegging ervan
      overeenkomstig de [artikelen 438][ref3] en [438a van het Wetboek van Burgerlijke Rechtsvordering][ref4] kan worden
      opgekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel341
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel438
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel438a
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel4123
    references:
      - id: ref1
        bwb_id: BWBR0001827
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 3:41
        hoofdstuk: '3'
        afdeling: '3.6'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '438'
      - id: ref4
        bwb_id: BWBR0001827
        artikel: 438a
  - number: 4:124
    text: |-
      Het bestuursorgaan beschikt ten aanzien van de invordering ook over de bevoegdheden die een schuldeiser op grond
      van het privaatrecht heeft.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel4124
  - number: 4:125
    text: |-
      1 Het bezwaar, beroep of hoger beroep tegen de beschikking waarbij de verplichting tot betaling van een geldsom is
      vastgesteld, heeft mede betrekking op een bijkomende beschikking van hetzelfde bestuursorgaan omtrent verrekening,
      uitstel van betaling, verlening van een voorschot, vaststelling van de rente of gehele of gedeeltelijke
      kwijtschelding, voor zover de belanghebbende deze beschikking betwist.

      2 Het bezwaar, beroep of hoger beroep tegen een bijkomende beschikking heeft mede betrekking op een latere
      bijkomende beschikking met betrekking tot dezelfde geldschuld, voor zover de belanghebbende deze beschikking
      betwist.

      3 De bestuursrechter kan de beslissing op het beroep of hoger beroep inzake de bijkomende beschikking echter
      verwijzen naar een ander orgaan, indien behandeling door dit orgaan gewenst is.

      4 In beroep of hoger beroep legt de belanghebbende zo mogelijk een afschrift over van de bijkomende beschikking die
      hij betwist.

      5 Het eerste tot en met het vierde lid zijn van overeenkomstige toepassing op een verzoek om voorlopige
      voorziening.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel4125
  - number: 4:126
    text: |-
      1 Indien een bestuursorgaan in de rechtmatige uitoefening van zijn publiekrechtelijke bevoegdheid of taak schade
      veroorzaakt die uitgaat boven het normale maatschappelijke risico en die een benadeelde in vergelijking met anderen
      onevenredig zwaar treft, kent het bestuursorgaan de benadeelde desgevraagd een vergoeding toe.

      2 Schade blijft in elk geval voor rekening van de aanvrager voor zover:

      a. hij het risico van het ontstaan van de schade heeft aanvaard;

      b. hij de schade had kunnen beperken door binnen redelijke grenzen maatregelen te nemen, die tot voorkoming of
      vermindering van de schade hadden kunnen leiden;

      c. de schade anderszins het gevolg is van een omstandigheid die aan de aanvrager kan worden toegerekend of

      d. de vergoeding van de schade anderszins is verzekerd.

      3 Indien een schadeveroorzakende gebeurtenis als bedoeld in het eerste lid tevens voordeel voor de benadeelde heeft
      opgeleverd, wordt dit bij de vaststelling van de te vergoeden schade in aanmerking genomen.

      4 Het bestuursorgaan kan een vergoeding toekennen in andere vorm dan betaling van een geldsom.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel4126
  - number: 4:127
    text: |-
      De aanvraag bevat mede:

      a. een aanduiding van de schadeveroorzakende gebeurtenis;

      b. een opgave van de aard van de geleden of te lijden schade en, voor zover redelijkerwijs mogelijk, het bedrag van
      de schade en een specificatie daarvan.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel4127
  - number: 4:128
    text: |-
      1 Bij wettelijk voorschrift kan worden bepaald dat van de aanvrager een recht van ten hoogste € 500 kan worden
      geheven voor het in behandeling nemen van de aanvraag.

      2 Het in het eerste lid bedoelde wettelijk voorschrift kan voor bestuursorganen van de centrale overheid bij of
      krachtens algemene maatregel van bestuur worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel4128
  - number: 4:129
    text: |-
      Indien het bestuursorgaan een vergoeding als bedoeld in [artikel 4:126][ref1] toekent, vergoedt het tevens:

      a. redelijke kosten ter voorkoming of beperking van schade;

      b. redelijke kosten ter zake van door een derde beroepsmatig verleende rechtsbijstand of andere deskundige bijstand
      bij de vaststelling van de schade;

      c. indien voor de indiening van de aanvraag een recht is geheven, het betaalde recht;

      d. de wettelijke rente vanaf de ontvangst van de aanvraag, of indien de schade op een later tijdstip ontstaat,
      vanaf dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4126
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel4129
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:126
        hoofdstuk: '4'
  - number: 4:130
    text: |-
      1 Het bestuursorgaan beslist binnen acht weken of – indien een adviescommissie is ingesteld waarvan de voorzitter,
      dan wel het enig lid, geen deel uitmaakt van en niet werkzaam is onder verantwoordelijkheid van het bestuursorgaan
      – binnen zes maanden na de ontvangst van de aanvraag, tenzij bij of krachtens wettelijk voorschrift een andere
      termijn is bepaald.

      2 Het bestuursorgaan kan de beslissing eenmaal voor ten hoogste acht weken of – indien een adviescommissie als
      bedoeld in het eerste lid is ingeschakeld – zes maanden verdagen. Van de verdaging wordt schriftelijk mededeling
      gedaan.

      3 Indien de schade mede is veroorzaakt door een besluit waartegen beroep kan worden ingesteld, kan het
      bestuursorgaan de beslissing aanhouden totdat het besluit onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel4130
  - number: 4:131
    text: |-
      1 Het bestuursorgaan kan de aanvraag afwijzen indien op het tijdstip van de aanvraag vijf jaren zijn verstreken
      na aanvang van de dag na die waarop de benadeelde bekend is geworden zowel met de schade als met het voor de
      schadeveroorzakende gebeurtenis verantwoordelijke bestuursorgaan, en in ieder geval na verloop van twintig jaren
      nadat de schade is veroorzaakt.

      2 Indien een aanvraag betrekking heeft op schade veroorzaakt door een besluit waartegen beroep kan worden
      ingesteld, vangt de termijn van vijf jaren niet aan voordat dit besluit onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel4131
  - number: 5:1
    text: |-
      1 In deze wet wordt verstaan onder overtreding: een gedraging die in strijd is met het bepaalde bij of krachtens
      enig wettelijk voorschrift.

      2 Onder overtreder wordt verstaan: degene die de overtreding pleegt of medepleegt.

      3 Overtredingen kunnen worden begaan door natuurlijke personen en rechtspersonen.
      [Artikel 51, tweede en derde lid, van het Wetboek van Strafrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel51
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '51'
  - number: 5:2
    text: |-
      1 In deze wet wordt verstaan onder:

      a. bestuurlijke sanctie: een door een bestuursorgaan wegens een overtreding opgelegde verplichting of onthouden
      aanspraak;

      b. herstelsanctie: een bestuurlijke sanctie die strekt tot het geheel of gedeeltelijk ongedaan maken of beëindigen
      van een overtreding, tot het voorkomen van herhaling van een overtreding, dan wel tot het wegnemen of beperken van
      de gevolgen van een overtreding;

      c. bestraffende sanctie: een bestuurlijke sanctie voor zover deze beoogt de overtreder leed toe te voegen.

      2 Geen bestuurlijke sanctie is de enkele last tot het verrichten van bepaalde handelingen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel52
  - number: 5:3
    text: |-
      De [artikelen 5:4 tot en met 5:10][ref1] zijn van toepassing op:

      a. in dit hoofdstuk geregelde bestuurlijke sancties, en

      b. bij wettelijk voorschrift aangewezen andere bestuurlijke sancties.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel54
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 5:4
        hoofdstuk: '5'
  - number: 5:4
    text: |-
      1 De bevoegdheid tot het opleggen van een bestuurlijke sanctie bestaat slechts voor zover zij bij of krachtens de
      wet is verleend.

      2 Een bestuurlijke sanctie wordt slechts opgelegd indien de overtreding en de sanctie bij of krachtens een aan de
      gedraging voorafgaand wettelijk voorschrift zijn omschreven.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel54
  - number: 5:5
    text: |-
      Het bestuursorgaan legt geen bestuurlijke sanctie op voor zover voor de overtreding een rechtvaardigingsgrond
      bestond.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel55
  - number: 5:6
    text: |-
      Het bestuursorgaan legt geen herstelsanctie op zolang een andere wegens dezelfde overtreding opgelegde
      herstelsanctie van kracht is.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel56
  - number: 5:7
    text: Een herstelsanctie kan worden opgelegd zodra het gevaar voor de overtreding klaarblijkelijk dreigt.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel57
  - number: 5:8
    text: |-
      Indien twee of meer voorschriften zijn overtreden, kan voor de overtreding van elk afzonderlijk voorschrift een
      bestuurlijke sanctie worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel58
  - number: 5:9
    text: |-
      De beschikking tot oplegging van een bestuurlijke sanctie vermeldt:

      a. de overtreding alsmede het overtreden voorschrift;

      b. zo nodig een aanduiding van de plaats waar en het tijdstip waarop de overtreding is geconstateerd.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel59
  - number: 5:10
    text: |-
      1 Voor zover een bestuurlijke sanctie verplicht tot betaling van een geldsom, komt deze geldsom toe aan het
      bestuursorgaan dat de sanctie heeft opgelegd, tenzij bij wettelijk voorschrift anders is bepaald.

      2 Het bestuursorgaan kan de geldsom invorderen bij dwangbevel.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel510
  - number: 5:10a
    text: |-
      1 Degene die wordt verhoord met het oog op het aan hem opleggen van een bestraffende sanctie, is niet verplicht ten
      behoeve daarvan verklaringen omtrent de overtreding af te leggen.

      2 Voor het verhoor wordt aan de betrokkene medegedeeld dat hij niet verplicht is tot antwoorden.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel510a
  - number: 5:11
    text: |-
      Onder toezichthouder wordt verstaan: een persoon, bij of krachtens wettelijk voorschrift belast met het houden van
      toezicht op de naleving van het bepaalde bij of krachtens enig wettelijk voorschrift.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel511
  - number: 5:12
    text: |-
      1 Bij de uitoefening van zijn taak draagt een toezichthouder een legitimatiebewijs bij zich, dat is uitgegeven door
      het bestuursorgaan onder verantwoordelijkheid waarvan de toezichthouder werkzaam is.

      2 Een toezichthouder toont zijn legitimatiebewijs desgevraagd aanstonds.

      3 Het legitimatiebewijs bevat een foto van de toezichthouder en vermeldt in ieder geval diens naam en hoedanigheid.
      Het model van het legitimatiebewijs wordt vastgesteld bij regeling van Onze Minister van Justitie en Veiligheid.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel512
  - number: 5:13
    text: |-
      Een toezichthouder maakt van zijn bevoegdheden slechts gebruik voor zover dat redelijkerwijs voor de vervulling van
      zijn taak nodig is.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel513
  - number: 5:14
    text: |-
      Bij wettelijk voorschrift of bij besluit van het bestuursorgaan dat de toezichthouder als zodanig aanwijst, kunnen
      de aan de toezichthouder toekomende bevoegdheden worden beperkt.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel514
  - number: 5:15
    text: |-
      1 Een toezichthouder is bevoegd, met medeneming van de benodigde apparatuur, elke plaats te betreden met
      uitzondering van een woning zonder toestemming van de bewoner.

      2 Zo nodig verschaft hij zich toegang met behulp van de sterke arm.

      3 Hij is bevoegd zich te doen vergezellen door personen die daartoe door hem zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel515
  - number: 5:16
    text: Een toezichthouder is bevoegd inlichtingen te vorderen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel516
  - number: 5:16a
    text: |-
      Een toezichthouder is bevoegd van personen inzage te vorderen van een identiteitsbewijs als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel516a
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 5:17
    text: |-
      1 Een toezichthouder is bevoegd inzage te vorderen van zakelijke gegevens en bescheiden.

      2 Hij is bevoegd van de gegevens en bescheiden kopieën te maken.

      3 Indien het maken van kopieën niet ter plaatse kan geschieden, is hij bevoegd de gegevens en bescheiden voor dat
      doel voor korte tijd mee te nemen tegen een door hem af te geven schriftelijk bewijs.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel517
  - number: 5:18
    text: |-
      1 Een toezichthouder is bevoegd zaken te onderzoeken, aan opneming te onderwerpen en daarvan monsters te nemen.

      2 Hij is bevoegd daartoe verpakkingen te openen.

      3 De toezichthouder neemt op verzoek van de belanghebbende indien mogelijk een tweede monster, tenzij bij of
      krachtens wettelijk voorschrift anders is bepaald.

      4 Indien het onderzoek, de opneming of de monsterneming niet ter plaatse kan geschieden, is hij bevoegd de zaken
      voor dat doel voor korte tijd mee te nemen tegen een door hem af te geven schriftelijk bewijs.

      5 De genomen monsters worden voor zover mogelijk teruggegeven.

      6 De belanghebbende wordt op zijn verzoek zo spoedig mogelijk in kennis gesteld van de resultaten van het
      onderzoek, de opneming of de monsterneming.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel518
  - number: 5:19
    text: |-
      1 Een toezichthouder is bevoegd vervoermiddelen te onderzoeken met betrekking waartoe hij een toezichthoudende
      taak heeft.

      2 Hij is bevoegd vervoermiddelen waarmee naar zijn redelijk oordeel zaken worden vervoerd met betrekking waartoe
      hij een toezichthoudende taak heeft, op hun lading te onderzoeken.

      3 Hij is bevoegd van de bestuurder van een vervoermiddel inzage te vorderen van de wettelijk voorgeschreven
      bescheiden met betrekking waartoe hij een toezichthoudende taak heeft.

      4 Hij is bevoegd met het oog op de uitoefening van deze bevoegdheden van de bestuurder van een voertuig of van de
      schipper van een vaartuig te vorderen dat deze zijn vervoermiddel stilhoudt en naar een door hem aangewezen plaats
      overbrengt.

      5 Bij regeling van Onze Minister van Justitie en Veiligheid wordt bepaald op welke wijze de vordering tot
      stilhouden wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel519
  - number: 5:20
    text: |-
      1 Een ieder is verplicht aan een toezichthouder binnen de door hem gestelde redelijke termijn alle medewerking te
      verlenen die deze redelijkerwijs kan vorderen bij de uitoefening van zijn bevoegdheden.

      2 Zij die uit hoofde van ambt, beroep of wettelijk voorschrift verplicht zijn tot geheimhouding, kunnen het
      verlenen van medewerking weigeren, voor zover dit uit hun geheimhoudingsplicht voortvloeit.

      3 Het bestuursorgaan onder verantwoordelijkheid waarvan de toezichthouder werkzaam is, is bevoegd tot oplegging van
      een last onder bestuursdwang ter handhaving van het eerste lid.

      4 Indien de gevorderde medewerking strekt ter handhaving van het bepaalde bij of krachtens een regeling die is
      genoemd in hoofdstuk 2, 3 of 4 van de bij deze wet behorende [Bevoegdheidsregeling bestuursrechtspraak][ref1] of
      in de bij deze wet behorende [Regeling verlaagd griffierecht][ref2], wordt de last onder bestuursdwang voor de
      toepassing van de twee laatstgenoemde regelingen aangemerkt als een besluit, genomen op grond van de eerstbedoelde
      regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel520
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
  - number: 5:21
    text: |-
      Onder last onder bestuursdwang wordt verstaan: de herstelsanctie, inhoudende:

      a. een last tot geheel of gedeeltelijk herstel van de overtreding, en

      b. de bevoegdheid van het bestuursorgaan om de last door feitelijk handelen ten uitvoer te leggen, indien de last
      niet of niet tijdig wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel521
  - number: 5:23
    text: Deze afdeling is niet van toepassing op optreden ter onmiddellijke handhaving van de openbare orde.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel523
  - number: 5:24
    text: |-
      1 De last onder bestuursdwang omschrijft de te nemen herstelmaatregelen.

      2 De last onder bestuursdwang vermeldt de termijn waarbinnen zij moet worden uitgevoerd.

      3 De last onder bestuursdwang wordt bekendgemaakt aan de overtreder, aan de rechthebbenden op het gebruik van de
      zaak waarop de last betrekking heeft en aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel524
  - number: 5:25
    text: |-
      1 De toepassing van bestuursdwang geschiedt op kosten van de overtreder, tenzij deze kosten redelijkerwijze niet of
      niet geheel te zijnen laste behoren te komen.

      2 De last vermeldt in hoeverre de kosten van bestuursdwang ten laste van de overtreder zullen worden gebracht.

      3 Tot de kosten van bestuursdwang behoren de kosten van voorbereiding van bestuursdwang, voor zover deze zijn
      gemaakt na het verstrijken van de termijn waarbinnen de last had moeten worden uitgevoerd.

      4 De kosten van voorbereiding van bestuursdwang zijn ook verschuldigd, voor zover als gevolg van het alsnog
      uitvoeren van de last geen bestuursdwang is toegepast.

      5 Tot de kosten van bestuursdwang behoren tevens de kosten van vergoeding van schade ingevolge
      [artikel 5:27, zesde lid][ref1].

      6 Het bestuursorgaan stelt de hoogte van de verschuldigde kosten vast binnen vijf jaar nadat de bestuursdwang is
      toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel527
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel525
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 5:27
        hoofdstuk: '5'
        afdeling: 5.3.1
  - number: 5:27
    text: |-
      1 Om bestuursdwang toe te passen, hebben door het bestuursorgaan aangewezen personen toegang tot elke plaats, voor
      zover dat redelijkerwijs voor de vervulling van hun taak nodig is.

      2 Voor het binnentreden in een woning zonder toestemming van de bewoner is het bestuursorgaan
      dat bestuursdwang toepast bevoegd tot het geven van een machtiging als bedoeld in
      [artikel 2 van de Algemene wet op het binnentreden][ref1].

      3 Een plaats die niet bij de overtreding is betrokken, wordt niet betreden dan nadat het bestuursorgaan dit de
      rechthebbende ten minste achtenveertig uren tevoren schriftelijk heeft aangezegd.

      4 Het derde lid geldt niet, indien tijdige aanzegging wegens de vereiste spoed niet mogelijk is. De aanzegging
      geschiedt dan zo spoedig mogelijk.

      5 De aanzegging omschrijft de wijze waarop het betreden zal plaatsvinden.

      6 Het bestuursorgaan vergoedt de schade die door het betreden van een plaats als bedoeld in het derde lid wordt
      veroorzaakt, voor zover deze redelijkerwijs niet ten laste van de rechthebbende behoort te komen, onverminderd het
      recht tot verhaal van deze schade op de overtreder ingevolge [artikel 5:25, vijfde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel525
