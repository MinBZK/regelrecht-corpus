  - number: 8:37
    text: |-
      1 Oproepingen, de uitnodiging om op een zitting van de bestuursrechter te verschijnen, de uitnodiging om te
      verklaren of van het recht ter zitting te worden gehoord gebruik wordt gemaakt, alsmede de verzending van een
      afschrift van de uitspraak en van het proces-verbaal van de mondelinge uitspraak aan een geadresseerde voor wie
      de verplichting tot digitaal procederen als bedoeld in [artikel 8:36a][ref1] niet geldt en die niet digitaal
      procedeert, geschieden door de griffier bij aangetekende brief, tenzij de bestuursrechter anders bepaalt.

      2 Voor het overige geschiedt de verzending van stukken aan geadresseerden als bedoeld in het eerste lid door de
      griffier bij gewone brief, tenzij de bestuursrechter anders bepaalt.

      3 In een brief wordt de datum van verzending vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel836a
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel837
