  - number: 4:20e
    text: |-
      Indien in een wettelijk voorschrift of een beleidsregel is bepaald dat in een beschikking steeds bepaalde
      voorschriften worden opgenomen, dan maken deze ook deel uit van de beschikking van rechtswege.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel420e
  - number: 4:20f
    text: |-
      1 Het bestuursorgaan kan aan de beschikking van rechtswege alsnog voorschriften verbinden of de beschikking
      intrekken voor zover dit nodig is om ernstige gevolgen voor het algemeen belang te voorkomen.

      2 Een beschikking als bedoeld in het eerste lid kan slechts worden genomen binnen zes weken na de bekendmaking van
      de beschikking van rechtswege.

      3 Het bestuursorgaan vergoedt de schade die door de wijziging of intrekking bedoeld in het eerste lid wordt
      veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel420f
  - number: 4:21
    text: |-
      1 Onder subsidie wordt verstaan: de aanspraak op financiële middelen, door een bestuursorgaan verstrekt met het oog
      op bepaalde activiteiten van de aanvrager, anders dan als betaling voor aan het bestuursorgaan geleverde goederen
      of diensten.

      2 Deze titel is niet van toepassing op aanspraken of verplichtingen die voortvloeien uit een wettelijk voorschrift
      inzake:

      a. belastingen,

      b. de heffing van een premie dan wel een premievervangende belasting ingevolge de
      [Wet financiering sociale verzekeringen][ref1], of

      c. de heffing van een inkomensafhankelijke bijdrage dan wel een bijdragevervangende belasting ingevolge de
      [Zorgverzekeringswet][ref2].

      3 Deze titel is niet van toepassing op de aanspraak op financiële middelen die wordt verstrekt op grond van een
      wettelijk voorschrift dat uitsluitend voorziet in verstrekking aan rechtspersonen die krachtens publiekrecht zijn
      ingesteld.

      4 Deze titel is van overeenkomstige toepassing op de bekostiging van het onderwijs en onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0017745
      [ref2]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel421
    references:
      - id: ref1
        bwb_id: BWBR0017745
      - id: ref2
        bwb_id: BWBR0018450
  - number: 4:22
    text: |-
      Onder subsidieplafond wordt verstaan: het bedrag dat gedurende een bepaald tijdvak ten hoogste beschikbaar is voor
      de verstrekking van subsidies krachtens een bepaald wettelijk voorschrift.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel422
  - number: 4:23
    text: |-
      1 Een bestuursorgaan verstrekt slechts subsidie op grond van een wettelijk voorschrift dat regelt voor welke
      activiteiten subsidie kan worden verstrekt.

      2 Indien een zodanig wettelijk voorschrift is opgenomen in een niet op een wet berustende algemene maatregel van
      bestuur, vervalt dat voorschrift vier jaren nadat het in werking is getreden, tenzij voor dat tijdstip een voorstel
      van wet bij de Staten-Generaal is ingediend waarin de subsidie wordt geregeld.

      3 Het eerste lid is niet van toepassing:

      a. in afwachting van de totstandkoming van een wettelijk voorschrift gedurende ten hoogste een jaar of totdat een
      binnen dat jaar bij de Staten-Generaal ingediend wetsvoorstel is verworpen of tot wet is verheven en in werking
      is getreden;

      b. indien de subsidie rechtstreeks op grond van een door de Raad van de Europese Unie, het Europees Parlement en de
      Raad gezamenlijk of de Europese Commissie vastgesteld programma wordt verstrekt;

      c. indien de begroting de subsidie-ontvanger en het bedrag waarop de subsidie ten hoogste kan worden vastgesteld,
      vermeldt, of

      d. in incidentele gevallen, mits de subsidie voor ten hoogste vier jaren wordt verstrekt.

      4 Het bestuursorgaan publiceert jaarlijks een verslag van de verstrekking van subsidies met toepassing van het
      derde lid, onderdelen *a* en *d*.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel423
  - number: 4:24
    text: |-
      Indien een subsidie op een wettelijk voorschrift berust, wordt ten minste eenmaal in de vijf jaren een verslag
      gepubliceerd over de doeltreffendheid en de effecten van de subsidie in de praktijk, tenzij bij wettelijk
      voorschrift anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel424
  - number: 4:25
    text: |-
      1 Een subsidieplafond kan slechts bij of krachtens wettelijk voorschrift worden vastgesteld.

      2 Een subsidie wordt geweigerd voor zover door verstrekking van de subsidie het subsidieplafond zou worden
      overschreden.

      3 Indien niet tijdig, dan wel in bezwaar of beroep of ter uitvoering van een rechterlijke uitspraak omtrent
      verstrekking wordt beslist, geldt de verplichting van het tweede lid slechts voor zover zij ook gold op het
      tijdstip, waarop de beslissing in eerste aanleg werd genomen of had moeten worden genomen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel425
  - number: 4:26
    text: |-
      1 Bij of krachtens wettelijk voorschrift wordt bepaald hoe het beschikbare bedrag wordt verdeeld.

      2 Bij de bekendmaking van het subsidieplafond wordt de wijze van verdeling vermeld.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel426
  - number: 4:27
    text: |-
      1 Het subsidieplafond wordt bekendgemaakt voor de aanvang van het tijdvak waarvoor het is vastgesteld.

      2 Indien het subsidieplafond of een verlaging daarvan later wordt bekendgemaakt, heeft deze bekendmaking geen
      gevolgen voor voordien ingediende aanvragen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel427
  - number: 4:28
    text: |-
      [Artikel 4:27, tweede lid][ref1], is niet van toepassing, indien:

      a. de aanvragen voor het tijdvak waarvoor het subsidieplafond is vastgesteld ingevolge wettelijk voorschrift moeten
      worden ingediend op een tijdstip waarop de begroting nog niet is vastgesteld of goedgekeurd;

      b. het een verlaging betreft die voortvloeit uit de vaststelling of goedkeuring van de begroting, en

      c. bij de bekendmaking van het subsidieplafond is gewezen op de mogelijkheid van verlaging en de gevolgen daarvan
      voor reeds ingediende aanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel427
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel428
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:27
        hoofdstuk: '4'
        afdeling: 4.2.2
  - number: 4:29
    text: |-
      Tenzij bij wettelijk voorschrift anders is bepaald kan voorafgaand aan een subsidievaststelling een beschikking
      omtrent subsidieverlening worden gegeven, indien een aanvraag daartoe is ingediend voor de afloop van de activiteit
      of het tijdvak waarvoor de subsidie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel429
  - number: 4:30
    text: |-
      1 De beschikking tot subsidieverlening bevat een omschrijving van de activiteiten waarvoor subsidie wordt verleend.

      2 De omschrijving kan later worden uitgewerkt, voor zover de beschikking tot subsidieverlening dit vermeldt.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel430
  - number: 4:31
    text: |-
      1 De beschikking tot subsidieverlening vermeldt het bedrag van de subsidie, dan wel de wijze waarop dit bedrag
      wordt bepaald.

      2 Indien de beschikking tot subsidieverlening het bedrag van de subsidie niet vermeldt, vermeldt zij het bedrag
      waarop de subsidie ten hoogste kan worden vastgesteld, tenzij bij wettelijk voorschrift anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel431
  - number: 4:32
    text: |-
      Een subsidie in de vorm van een periodieke aanspraak op financiële middelen wordt verleend voor een bepaald
      tijdvak, dat in de beschikking tot subsidieverlening wordt vermeld.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel432
  - number: 4:33
    text: |-
      Een subsidie kan niet worden verleend onder de voorwaarde dat uitsluitend het bestuursorgaan of uitsluitend de
      subsidie-ontvanger een bepaalde handeling verricht, tenzij het betreft de voorwaarde dat:

      a. de subsidie-ontvanger medewerkt aan de totstandkoming van een overeenkomst ter uitvoering van de beschikking tot
      subsidieverlening, of

      b. de subsidie-ontvanger aantoont dat een gebeurtenis, niet zijnde een handeling van het bestuursorgaan of van de
      subsidie-ontvanger, heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel433
  - number: 4:34
    text: |-
      1 Voor zover een subsidie wordt verleend ten laste van een begroting die nog niet is vastgesteld of goedgekeurd,
      kan zij worden verleend onder de voorwaarde dat voldoende gelden ter beschikking worden gesteld.

      2 De voorwaarde kan niet worden gesteld, voor zover zulks voortvloeit uit het wettelijk voorschrift waarop de
      subsidie berust.

      3 De voorwaarde vervalt, indien het bestuursorgaan daarop niet binnen vier weken na de vaststelling of goedkeuring
      van de begroting een beroep heeft gedaan.

      4 Het beroep op de voorwaarde geschiedt bij een subsidie voor een activiteit die door het bestuursorgaan ook in het
      voorafgaande begrotingsjaar werd gesubsidieerd door een intrekking wegens veranderde omstandigheden overeenkomstig
      [artikel 4:50][ref1].

      5 In andere gevallen geschiedt het beroep op de voorwaarde door een intrekking overeenkomstig
      [artikel 4:48, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel450
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel448
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel434
