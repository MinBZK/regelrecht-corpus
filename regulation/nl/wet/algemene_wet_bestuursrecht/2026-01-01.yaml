    text: |-
      Blijkt aan de bestuursrechter bij de behandeling dat de zaak niet voldoende spoedeisend is om een versnelde
      behandeling te rechtvaardigen of dat de zaak een gewone behandeling vordert, dan bepaalt hij dat de zaak verder op
      de gewone wijze wordt behandeld.
