  - number: 7:2
    text: |-
      1 Voordat een bestuursorgaan op het bezwaar beslist, stelt het belanghebbenden in de gelegenheid te worden gehoord.

      2 Het bestuursorgaan stelt daarvan in ieder geval de indiener van het bezwaarschrift op de hoogte alsmede de
      belanghebbenden die bij de voorbereiding van het besluit hun zienswijze naar voren hebben gebracht.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel72
  - number: 7:3
    text: |-
      Van het horen van een belanghebbende kan worden afgezien indien:

      a. het bezwaar kennelijk niet-ontvankelijk is,

      b. het bezwaar kennelijk ongegrond is,

      c. de belanghebbende heeft verklaard geen gebruik te willen maken van het recht te worden gehoord,

      d. de belanghebbende niet binnen een door het bestuursorgaan gestelde redelijke termijn verklaart dat hij gebruik
      wil maken van het recht te worden gehoord, of

      e. aan het bezwaar volledig tegemoet wordt gekomen en andere belanghebbenden daardoor niet in hun belangen kunnen
      worden geschaad.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel73
  - number: 7:4
    text: |-
      1 Tot tien dagen voor het horen kunnen belanghebbenden nadere stukken indienen.

      2 Het bestuursorgaan legt het bezwaarschrift en alle verder op de zaak betrekking hebbende stukken voorafgaand aan
      het horen gedurende ten minste een week voor belanghebbenden ter inzage.

      3 Bij de oproeping voor het horen worden belanghebbenden gewezen op het eerste lid en wordt vermeld waar en wanneer
      de stukken ter inzage zullen liggen.

      4 Belanghebbenden kunnen van deze stukken tegen vergoeding van ten hoogste de kosten afschriften verkrijgen.

      5 Voor zover de belanghebbenden daarmee instemmen, kan toepassing van het tweede lid achterwege worden gelaten.

      6 Het bestuursorgaan kan, al dan niet op verzoek van een belanghebbende, toepassing van het tweede lid voorts
      achterwege laten, voor zover geheimhouding om gewichtige redenen is geboden. Van de toepassing van deze bepaling
      wordt mededeling gedaan.

      7 Gewichtige redenen zijn in ieder geval niet aanwezig, voor zover ingevolge de [Wet open overheid][ref1] de
      verplichting bestaat een verzoek om informatie, vervat in deze stukken, in te willigen.

      8 Indien een gewichtige reden is gelegen in de vrees voor schade aan de lichamelijke of geestelijke gezondheid van
      een belanghebbende, kan inzage van de desbetreffende stukken worden voorbehouden aan een gemachtigde die hetzij
      advocaat hetzij arts is.


      [ref1]: https://wetten.overheid.nl/BWBR0045754
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0045754
  - number: 7:5
    text: |-
      1 Tenzij het horen geschiedt door of mede door het bestuursorgaan zelf dan wel de voorzitter of een lid ervan,
      geschiedt het horen door:

      a. een persoon die niet bij de voorbereiding van het bestreden besluit betrokken is geweest, of

      b. meer dan een persoon van wie de meerderheid, onder wie degene die het horen leidt, niet bij de voorbereiding van
      het besluit betrokken is geweest.

      2 Voor zover niet bij wettelijk voorschrift anders is bepaald, besluit het bestuursorgaan of het horen in het
      openbaar plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel75
  - number: 7:6
    text: |-
      1 Belanghebbenden worden in elkaars aanwezigheid gehoord.

      2 Ambtshalve of op verzoek kunnen belanghebbenden afzonderlijk worden gehoord, indien aannemelijk is dat
      gezamenlijk horen een zorgvuldige behandeling zal belemmeren of dat tijdens het horen feiten of omstandigheden
      bekend zullen worden waarvan geheimhouding om gewichtige redenen is geboden.

      3 Wanneer belanghebbenden afzonderlijk zijn gehoord, wordt ieder van hen op de hoogte gesteld van het verhandelde
      tijdens het horen buiten zijn aanwezigheid.

      4 Het bestuursorgaan kan, al dan niet op verzoek van een belanghebbende, toepassing van
      het derde lid achterwege laten, voor zover geheimhouding om gewichtige redenen is geboden.
      [Artikel 7:4, zesde lid, tweede volzin, zevende en achtste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel74
