      1 De bevoegde bestuursorganen zenden de door hen genomen besluiten zo spoedig mogelijk toe aan het coördinerend
      bestuursorgaan.

      2 Het coördinerend bestuursorgaan maakt de besluiten gelijktijdig bekend en legt deze, indien tevens
      terinzagelegging wettelijk is voorgeschreven op grond van [afdeling 3.4][ref1], gelijktijdig ter inzage.


