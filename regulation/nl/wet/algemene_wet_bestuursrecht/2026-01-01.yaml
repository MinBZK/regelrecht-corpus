    text: |-
      1 De bestuursrechter kan een deskundige benoemen voor het instellen van een onderzoek.

      2 Bij de benoeming worden vermeld de opdracht die moet worden vervuld en de termijn, bedoeld in het vierde lid.

      3 Van het voornemen tot het benoemen van een deskundige als bedoeld in het eerste lid wordt aan partijen mededeling
      gedaan. De bestuursrechter kan partijen in de gelegenheid stellen om hun wensen omtrent het onderzoek binnen een
      door hem te bepalen termijn schriftelijk aan hem kenbaar te maken.

      4 De bestuursrechter stelt een termijn binnen welke de deskundige aan hem een schriftelijk verslag van het
      onderzoek uitbrengt.

      5 Partijen kunnen binnen vier weken na de dag van verzending van het verslag aan hen schriftelijk hun zienswijze
      met betrekking tot het verslag naar voren brengen.

      6 De bestuursrechter kan de in het vijfde lid bedoelde termijn verlengen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel847
  - number: 8:48
    text: |-
      1 De arts die voor het instellen van een onderzoek als bedoeld in [artikel 8:47, eerste lid][ref1], een persoon
      moet onderzoeken, kan de voor het onderzoek van belang zijnde inlichtingen over deze persoon inwinnen bij de
      behandelend arts of de behandelende artsen, de verzekeringsarts en de adviserend arts van het bestuursorgaan.

      2 Zij verstrekken de gevraagde inlichtingen voor zover daardoor de persoonlijke levenssfeer van de betrokken
      persoon niet onevenredig wordt geschaad.


