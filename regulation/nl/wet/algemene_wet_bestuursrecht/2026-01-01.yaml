      1 Het beroep kan worden ingesteld bij de rechtbank, tenzij een andere bestuursrechter bevoegd is ingevolge
      hoofdstuk 2 van de bij deze wet behorende [Bevoegdheidsregeling bestuursrechtspraak][ref1] dan wel ingevolge een
