  - number: 3:25
    text: |-
      1 Indien op de voorbereiding van een van de besluiten [afdeling 3.4][ref1] van toepassing is, is die afdeling van
      toepassing op alle besluiten, met inachtneming van het volgende:

      a. de ingevolge de [artikelen 3:11][ref2], [3:14][ref3] en [3:44][ref4], eerste lid, onderdeel a, vereiste
      terinzageleggingen geschiedt in ieder geval ten kantore van het coördinerend bestuursorgaan;

      b. het coördinerend bestuursorgaan draagt er zorg voor dat de gelegenheid tot het mondeling naar voren brengen van
      zienswijzen wordt gegeven met betrekking tot alle ontwerpbesluiten gezamenlijk;

      c. zienswijzen worden bij het coördinerend bestuursorgaan naar voren gebracht;

      d. indien over een ontwerpbesluit zienswijzen naar voren kunnen worden gebracht door een ieder geldt dit eveneens
      met betrekking tot de andere ontwerpbesluiten;

      e. indien een ontwerpbesluit strekt tot uitvoering van een ander besluit dat geen onderdeel uitmaakt van de
      coördinatie, kunnen zienswijzen geen betrekking hebben op dat andere besluit;

      f. het in de gelegenheid stellen te reageren op naar voren gebrachte zienswijzen geschiedt door het coördinerend
      bestuursorgaan;

      g. de ingevolge die afdeling en [afdeling 3.6][ref5] vereiste mededelingen, kennisgevingen en toezendingen
      geschieden door het coördinerend bestuursorgaan;

      h. in afwijking van [artikel 3:18][ref6] worden de besluiten genomen binnen een door het coördinerend
      bestuursorgaan te bepalen termijn, doch uiterlijk binnen de termijn die geldt voor het besluit met de langste
      beslistermijn;

      i. de dag van terinzagelegging van de besluiten door het coördinerend bestuursorgaan is bepalend voor de aanvang
      van de beroepstermijn ingevolge [artikel 6:8, vierde lid][ref7].

      2 Indien [afdeling 3.4][ref8] niet van toepassing is, geschiedt de voorbereiding met toepassing of overeenkomstige
      toepassing van de onderdelen b tot en met h van het eerste lid.


