        hoofdstuk: '3'
        afdeling: '3.6'
  - number: 4:20c
    text: |-
      1 Het bestuursorgaan maakt de beschikking bekend binnen twee weken nadat zij van rechtswege is gegeven.

      2 Bij de bekendmaking en mededeling van de beschikking wordt vermeld dat de beschikking van rechtswege is gegeven.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel420c
  - number: 4:20d
    text: |-
      1 Indien het bestuursorgaan de beschikking niet overeenkomstig [artikel 4:20c][ref1] binnen twee weken heeft
      bekendgemaakt, verbeurt het na een daarop volgende ingebrekestelling door de aanvrager een dwangsom vanaf de dag
      dat twee weken zijn verstreken sinds die ingebrekestelling.

      2 De dwangsom wordt berekend overeenkomstig [artikel 4:17, eerste en tweede lid][ref2].

      3 De [artikelen 4:17, vijfde lid, onder a en b][ref3], en [4:18 tot en met 4:20][ref4] zijn van overeenkomstige
      toepassing.


