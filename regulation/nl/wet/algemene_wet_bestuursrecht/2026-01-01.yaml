  - number: 3:44
    text: |-
      1 Indien bij de voorbereiding van een besluit dat tot een of meer belanghebbenden is gericht toepassing is
      gegeven aan [afdeling 3.4][ref1], wordt kennisgegeven van de terinzagelegging van het besluit en van de op de zaak
      betrekking hebbende stukken:

      a. met overeenkomstige toepassing van de [artikelen 3:11][ref2] en [3:12, eerste lid][ref3], met dien verstande dat
      de stukken ter inzage liggen totdat de beroepstermijn is verstreken, en

      b. door toezending van een exemplaar van het besluit aan degenen die over het ontwerp van het besluit zienswijzen
      naar voren hebben gebracht.

      2 Indien bij de voorbereiding van een besluit dat niet tot een of meer belanghebbenden is gericht toepassing
      is gegeven aan [afdeling 3.4][ref4], wordt gelijktijdig met de bekendmaking van het besluit kennisgegeven van
      de terinzagelegging van de op de zaak betrekking hebbende stukken. Het eerste lid, onderdelen a en b, is van
      overeenkomstige toepassing.

      3 Indien bij de voorbereiding van het besluit toepassing is gegeven aan [afdeling 3.4][ref5], kan het
      bestuursorgaan in afwijking van [artikel 3:43, eerste lid][ref6]:

      a. indien de omvang van het besluit daartoe aanleiding geeft, volstaan met een ieder van de daar bedoelde personen
      de strekking van het besluit mee te delen;

      b. indien een zienswijze door meer dan vijf personen naar voren is gebracht bij hetzelfde geschrift, volstaan met
      toezending van een exemplaar aan de vijf personen wier namen en adressen als eerste in dat geschrift zijn vermeld;

      c. indien een zienswijze naar voren is gebracht door meer dan vijf personen bij hetzelfde geschrift en de omvang
      van het besluit daartoe aanleiding geeft, volstaan met het meedelen aan de vijf personen wier namen en adressen als
      eerste in dat geschrift zijn vermeld, van de strekking van het besluit;

      d. indien toezending zou moeten geschieden aan meer dan 250 personen, die toezending achterwege laten.


