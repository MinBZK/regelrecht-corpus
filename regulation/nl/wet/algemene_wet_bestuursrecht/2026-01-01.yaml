  - number: 8:36a
    text: |-
      1 Beroep wordt langs elektronische weg ingesteld.

      2 Partijen en andere betrokkenen dienen ook de overige stukken langs elektronische weg in, tenzij de
      bestuursrechter anders bepaalt. [Artikel 6:9][ref1] is van overeenkomstige toepassing.

      3 Het eerste en het tweede lid zijn van overeenkomstige toepassing op het indienen van verzoeken en het doen van
      verzet.

      4 Het eerste lid is van overeenkomstige toepassing indien een bestuursorgaan een bezwaarschrift doorzendt op grond
      van [artikel 7:1a, vijfde of zesde lid][ref2].

      5 Indien niet is voldaan aan de verplichtingen die voortvloeien uit het eerste tot en met derde lid of de algemene
      maatregel van bestuur, bedoeld in [artikel 8:36f, eerste lid][ref3], stelt de bestuursrechter de desbetreffende
      partij of andere betrokkene in de gelegenheid dit verzuim te herstellen binnen een door hem te bepalen termijn.
      Maakt de partij of andere betrokkene van deze gelegenheid geen gebruik, dan kan het beroep niet-ontvankelijk worden
      verklaard dan wel kan de bestuursrechter het stuk buiten beschouwing laten.

      6 In afwijking van het vijfde lid kan de bestuursrechter bepalen dat de procedure wordt voortgezet volgens de
      regels die gelden voor stukkenwisseling op papier.

      7 De bestuursrechter betrekt na afloop van de termijn ingediende stukken als bedoeld in het tweede lid bij zijn
      beslissing indien redelijkerwijs niet kan worden geoordeeld dat de indiener in verzuim is geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel71a
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel836f
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel836a
