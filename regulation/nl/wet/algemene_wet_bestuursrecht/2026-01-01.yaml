      1 De tolk die zijn benoeming heeft aanvaard en die door de bestuursrechter wordt opgeroepen, is verplicht aan de
      oproeping gevolg te geven en zijn opdracht onpartijdig en naar beste weten te vervullen. De [artikelen 172][ref1]
      en [178 van het Wetboek van Burgerlijke Rechtsvordering][ref2] zijn van overeenkomstige toepassing.

      2 In de oproeping worden vermeld de plaats en het tijdstip waarop de opdracht moet worden vervuld en de gevolgen
      die zijn verbonden aan het niet verschijnen.


