  - number: B3:1
    text: |-
      Het tarief, genoemd in [artikel 8:41, tweede lid, onderdeel a][ref1], dan wel genoemd in
      [artikel 8:109, eerste lid, onderdeel a][ref2], geldt indien het beroep, dan wel hoger beroep, betreft:

      a. een besluit inzake een uitkering bij werkloosheid of ziekte, genomen ten aanzien van een persoon met betrekking
      tot diens in [artikel 3 van de Ambtenarenwet 2017][ref3] bedoelde hoedanigheid;

      b. een besluit inzake een uitkering op grond van blijvende arbeidsongeschiktheid op grond van een wettelijk
      voorschrift waarbij de natuurlijke persoon ter zake van zijn arbeidsongeschiktheid vanwege het Rijk
      invaliditeitspensioen is verzekerd, of een besluit, genomen op grond van artikel P9 van de Algemene burgerlijke
      pensioenwet;

      c. een bestuurlijke boete van ten hoogste € 340;

      d. een besluit waarbij de kosten van bestuursdwang op ten hoogste € 340 zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel841
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8109
      [ref3]: https://wetten.overheid.nl/BWBR0001947#Artikel3
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel1
