  - number: B2:12
    text: |-
      Tegen een uitspraak van de rechtbank of van de voorzieningenrechter omtrent een besluit, genomen op grond van een
      in dit artikel genoemd voorschrift of anderszins in dit artikel omschreven, kan hoger beroep worden ingesteld bij
      een gerechtshof.

      [Algemene douanewet][ref1]: [artikel 8:2, tweede lid][ref2]

      Algemene wet bestuursrecht: [artikel 4:126][ref3], voor zover het besluit betrekking heeft op schade, veroorzaakt
      door een besluit op grond van een ander voorschrift, genoemd in artikel 12 van deze Bevoegdheidsregeling
      bestuursrechtspraak, of door een handeling ter uitvoering van een zodanig besluit

      [Algemene wet inzake rijksbelastingen][ref4]: [artikel 26][ref5]

      [Mijnbouwwet][ref6]: de [afdelingen 5.1.1][ref7], [5.1.2][ref8], [5.3][ref9], [5.4][ref10] en [5.5][ref11]

      [Wet strategische diensten][ref12]: [artikel 18, derde lid][ref13]


