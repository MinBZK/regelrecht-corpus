  - number: 8:49
    text: De bestuursrechter kan tolken benoemen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel849
  - number: 8:50
    text: |-
      1 De bestuursrechter kan een onderzoek ter plaatse instellen. Hij heeft daarbij toegang tot elke plaats voor zover
      dat redelijkerwijs voor de vervulling van zijn taak nodig is.

      2 Bestuursorganen verlenen de medewerking die in het belang van het onderzoek is vereist.

      3 Van plaats en tijdstip van het onderzoek wordt aan partijen mededeling gedaan. Zij kunnen bij het onderzoek
      aanwezig zijn.

      4 Van het onderzoek wordt door de griffier een proces-verbaal opgemaakt.

      5 Het wordt door de voorzitter en de griffier ondertekend. Bij verhindering van de voorzitter of de griffier wordt
      dit in het proces-verbaal vermeld.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel850
  - number: 8:51
    text: |-
      1 De bestuursrechter kan aan de griffier opdragen een onderzoek ter plaatse in te stellen. Deze heeft daarbij
      toegang tot elke plaats voor zover dat redelijkerwijs voor de vervulling van de hem opgedragen taak nodig is. De
      bestuursrechter is bevoegd tot het geven van een machtiging tot binnentreden.

      2 [Artikel 8:50, tweede en derde lid][ref1], is van overeenkomstige toepassing.

      3 Van het onderzoek wordt door de griffier een proces-verbaal opgemaakt, dat door hem wordt ondertekend.


