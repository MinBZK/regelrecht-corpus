  - number: 3:27
    text: |-
      1 Indien tegen een van de besluiten bezwaar kan worden gemaakt of administratief beroep kan worden ingesteld,
      geschiedt dit in afwijking van [artikel 6:4][ref1] door het indienen van het bezwaar- of beroepschrift bij het
      coördinerend bestuursorgaan. Het coördinerend bestuursorgaan zendt terstond na ontvangst van het bezwaar- of
      beroepschrift een afschrift daarvan aan het bevoegde bestuursorgaan.

      2 Het coördinerend bestuursorgaan draagt er zorg voor dat de gelegenheid tot het gebruik maken van het recht te
      worden gehoord wordt gegeven met betrekking tot alle bestreden besluiten gezamenlijk.

      3 De bevoegde bestuursorganen zenden de door hen genomen beslissingen op het bezwaar of beroep zo spoedig mogelijk
      toe aan het coördinerend bestuursorgaan. Het coördinerend bestuursorgaan maakt de beslissingen gelijktijdig bekend
      en doet de ingevolge [artikel 7:12, derde lid][ref2], of [artikel 7:26, vierde lid][ref3], vereiste mededelingen.

      4 Een beslissing op een verzoek in te stemmen met rechtstreeks beroep bij de bestuursrechter, bedoeld in
      [artikel 7:1a, vierde lid][ref4], wordt genomen door het coördinerend bestuursorgaan. Onverminderd artikel 7:1a,
      tweede lid, wijst het coördinerend bestuursorgaan het verzoek in ieder geval af indien tegen een van de andere
      besluiten een bezwaarschrift is ingediend waarin eenzelfde verzoek ontbreekt.


