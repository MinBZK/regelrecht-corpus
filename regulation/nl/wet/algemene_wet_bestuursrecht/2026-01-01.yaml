  - number: 4:35
    text: |-
      1 De subsidieverlening kan in ieder geval worden geweigerd indien een gegronde reden bestaat om aan te nemen dat:

      a. de activiteiten niet of niet geheel zullen plaatsvinden;

      b. de aanvrager niet zal voldoen aan de aan de subsidie verbonden verplichtingen;

      c. de aanvrager niet op een behoorlijke wijze rekening en verantwoording zal afleggen omtrent de verrichte
      activiteiten en de daaraan verbonden uitgaven en inkomsten, voor zover deze voor de vaststelling van de subsidie
      van belang zijn.

      2 De subsidieverlening kan voorts in ieder geval worden geweigerd indien de aanvrager:

      a. in het kader van de aanvraag onjuiste of onvolledige gegevens heeft verstrekt en de verstrekking van deze
      gegevens tot een onjuiste beschikking op de aanvraag zou hebben geleid, of

      b. failliet is verklaard of aan hem surséance van betaling is verleend of ten aanzien van hem de
      schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, dan wel een verzoek daartoe bij de
      rechtbank is ingediend.

      3 De subsidieverlening wordt voorts geweigerd indien de verstrekking van subsidie naar het oordeel van het
      bestuursorgaan niet verenigbaar is met het bepaalde in de artikelen 107 en 108 van het Verdrag betreffende de
      werking van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel435
  - number: 4:36
    text: |-
      1 Ter uitvoering van de beschikking tot subsidieverlening kan een overeenkomst worden gesloten.

      2 Tenzij bij wettelijk voorschrift anders is bepaald of de aard van de subsidie zich daartegen verzet, kan in
      de overeenkomst worden bepaald dat de subsidie-ontvanger verplicht is de activiteiten te verrichten waarvoor de
      subsidie is verleend.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel436
  - number: 4:37
    text: |-
      1 Het bestuursorgaan kan de subsidie-ontvanger verplichtingen opleggen met betrekking tot:

      a. aard en omvang van de activiteiten waarvoor subsidie wordt verleend;

      b. de administratie van aan de activiteiten verbonden uitgaven en inkomsten;

      c. het vóór de subsidievaststelling verstrekken van gegevens en bescheiden die nodig zijn voor een beslissing
      omtrent de subsidie;

      d. de te verzekeren risico’s;

      e. het stellen van zekerheid voor verleende voorschotten;

      f. het afleggen van rekening en verantwoording omtrent de verrichte activiteiten en de daaraan verbonden uitgaven
      en inkomsten, voor zover deze voor de vaststelling van de subsidie van belang zijn;

      g. het beperken of wegnemen van de nadelige gevolgen van de subsidie voor derden;

      h. het uitoefenen van controle door een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1] op het door het bestuursorgaan gevoerde
      financiële beheer en de financiële verantwoording daarover.

      2 Indien een verplichting als bedoeld in het eerste lid, onderdeel *c*, wordt opgelegd, zijn de
      [artikelen 4:3][ref2] en [4:4][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel44
