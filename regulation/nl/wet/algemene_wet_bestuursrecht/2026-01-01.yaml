  - number: 9:5
    text: |-
      Zodra het bestuursorgaan naar tevredenheid van de klager aan diens klacht tegemoet is gekomen, vervalt de
      verplichting tot het verder toepassen van deze titel.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel95
  - number: 9:6
    text: Het bestuursorgaan bevestigt de ontvangst van het klaagschrift schriftelijk.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel96
  - number: 9:7
    text: |-
      1 De behandeling van de klacht geschiedt door een persoon die niet bij de gedraging waarop de klacht betrekking
      heeft, betrokken is geweest.

      2 Het eerste lid is niet van toepassing indien de klacht betrekking heeft op een gedraging van het bestuursorgaan
      zelf dan wel de voorzitter of een lid ervan.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel97
  - number: 9:8
    text: |-
      1 Het bestuursorgaan is niet verplicht de klacht te behandelen indien zij betrekking heeft op een gedraging:

      a. waarover reeds eerder een klacht is ingediend die met inachtneming van de [artikelen 9:4][ref1] en volgende
      is behandeld;

      b. die langer dan een jaar voor indiening van de klacht heeft plaatsgevonden;

      c. waartegen door de klager bezwaar gemaakt had kunnen worden,

      d. waartegen door de klager beroep kan worden ingesteld, tenzij die gedraging bestaat uit het niet tijdig nemen van
      een besluit, of beroep kon worden ingesteld;

      e. die door het instellen van een procedure aan het oordeel van een andere rechterlijke instantie dan een
      bestuursrechter onderworpen is, dan wel onderworpen is geweest of,

      f. zolang ter zake daarvan een opsporingsonderzoek op bevel van de officier van justitie of een vervolging gaande
      is, dan wel indien de gedraging deel uitmaakt van de opsporing of vervolging van een strafbaar feit en ter zake van
      dat feit een opsporingsonderzoek op bevel van de officier van justitie of een vervolging gaande is.

      2 Het bestuursorgaan is niet verplicht de klacht te behandelen indien het belang van de klager dan wel het gewicht
      van de gedraging kennelijk onvoldoende is.

      3 Van het niet in behandeling nemen van de klacht wordt de klager zo spoedig mogelijk doch uiterlijk binnen vier
      weken na ontvangst van het klaagschrift schriftelijk in kennis gesteld. [Artikel 9:12, tweede lid][ref2], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel912
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel98
