  - number: 9:26
    text: |-
      Tenzij [artikel 9:22][ref1] van toepassing is, is de ombudsman bevoegd uit eigen beweging een onderzoek in te
      stellen naar de wijze waarop een bestuursorgaan zich in een bepaalde aangelegenheid heeft gedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel922
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel926
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 9:22
        hoofdstuk: '9'
        afdeling: 9.2.2
  - number: 9:27
    text: |-
      1 De ombudsman beoordeelt of het bestuursorgaan zich in de door hem onderzochte aangelegenheid al dan niet
      behoorlijk heeft gedragen.

      2 Indien ten aanzien van de gedraging waarop het onderzoek van de ombudsman betrekking heeft door een rechterlijke
      instantie uitspraak is gedaan, neemt de ombudsman de rechtsgronden in acht waarop die uitspraak steunt of mede
      steunt.

      3 De ombudsman kan naar aanleiding van het door hem verrichte onderzoek aan het bestuursorgaan aanbevelingen doen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel927
  - number: 9:28
    text: |-
      1 Het verzoekschrift wordt ondertekend en bevat ten minste:

      a. de naam en het adres van de verzoeker;

      b. de dagtekening;

      c. een omschrijving van de gedraging waartegen het verzoek is gericht, een aanduiding van degene die zich aldus
      heeft gedragen en een aanduiding van degene jegens wie de gedraging heeft plaatsgevonden, indien deze niet de
      verzoeker is;

      d. de gronden van het verzoek;

      e. de wijze waarop een klacht bij het bestuursorgaan is ingediend, en zo mogelijk de bevindingen van het
      onderzoek naar de klacht door het bestuursorgaan, zijn oordeel daarover alsmede de eventuele conclusies die het
      bestuursorgaan hieraan verbonden heeft.

      2 Indien het verzoekschrift in een vreemde taal is gesteld en een vertaling voor een goede behandeling van het
      verzoek noodzakelijk is, draagt de verzoeker zorg voor een vertaling.

      3 Indien niet is voldaan aan de in dit artikel gestelde vereisten of indien het verzoekschrift geheel of
      gedeeltelijk is geweigerd op grond van [artikel 2:15][ref1], stelt de ombudsman de verzoeker in de gelegenheid het
      verzuim binnen een door hem daartoe gestelde termijn te herstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel215
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel928
    references:
