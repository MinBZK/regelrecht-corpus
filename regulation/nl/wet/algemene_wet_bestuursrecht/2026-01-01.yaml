  - number: 8:59
    text: |-
      De bestuursrechter kan een partij oproepen om in persoon dan wel in persoon of bij gemachtigde te verschijnen, al
      dan niet voor het geven van inlichtingen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel859
  - number: 8:60
    text: |-
      1 De bestuursrechter kan getuigen oproepen en deskundigen en tolken benoemen.

      2 De opgeroepen getuige en de deskundige of de tolk die zijn benoeming heeft aanvaard en door de
      bestuursrechter wordt opgeroepen, zijn verplicht aan de oproeping gevolg te geven. De [artikelen 172][ref1] en
      [178 van het Wetboek van Burgerlijke Rechtsvordering][ref2] zijn van overeenkomstige toepassing. In de oproeping
      van de deskundige worden vermeld de opdracht die moet worden vervuld, de plaats en het tijdstip waarop de opdracht
      moet worden vervuld en de gevolgen die zijn verbonden aan het niet verschijnen.

      3 Namen en woonplaatsen van de opgeroepen getuigen en deskundigen en de feiten waarop het horen betrekking
      zal hebben onderscheidenlijk de opdracht die moet worden vervuld, worden bij de uitnodiging, bedoeld in
      [artikel 8:56][ref3], aan partijen zoveel mogelijk medegedeeld.

      4 Partijen kunnen getuigen en deskundigen meebrengen of bij aangetekende brief of deurwaardersexploit oproepen,
      mits daarvan uiterlijk tien dagen voor de dag van de zitting aan de bestuursrechter en aan de andere partijen
      mededeling is gedaan, met vermelding van namen en woonplaatsen. Op deze bevoegdheid worden partijen in de
      uitnodiging, bedoeld in [artikel 8:56][ref4], gewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel172
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel178
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel856
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel856
