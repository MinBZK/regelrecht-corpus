  - number: 4:13
    text: |-
      1 Een beschikking dient te worden gegeven binnen de bij wettelijk voorschrift bepaalde termijn of, bij het
      ontbreken van zulk een termijn, binnen een redelijke termijn na ontvangst van de aanvraag.

      2 De in het eerste lid bedoelde redelijke termijn is in ieder geval verstreken wanneer het bestuursorgaan binnen
      acht weken na ontvangst van de aanvraag geen beschikking heeft gegeven, noch een mededeling als bedoeld in
      [artikel 4:14, derde lid][ref1], heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel414
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel413
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:14
        hoofdstuk: '4'
        paragraaf: 4.1.3.1
        afdeling: 4.1.3
  - number: 4:14
    text: |-
      1 Indien een beschikking niet binnen de bij wettelijk voorschrift bepaalde termijn kan worden gegeven, deelt
      het bestuursorgaan dit aan de aanvrager mede en noemt het daarbij een zo kort mogelijke termijn waarbinnen de
      beschikking wel tegemoet kan worden gezien.

      2 Het eerste lid is niet van toepassing indien het bestuursorgaan na het verstrijken van de bij wettelijk
      voorschrift bepaalde termijn niet langer bevoegd is.

      3 Indien, bij het ontbreken van een bij wettelijk voorschrift bepaalde termijn, een beschikking niet binnen acht
      weken kan worden gegeven, deelt het bestuursorgaan dit binnen deze termijn aan de aanvrager mede en noemt het
      daarbij een redelijke termijn binnen welke de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel414
  - number: 4:15
    text: |-
      1 De termijn voor het geven van een beschikking wordt opgeschort met ingang van de dag na die waarop het
      bestuursorgaan:

      a. de aanvrager krachtens [artikel 4:5][ref1] uitnodigt de aanvraag aan te vullen, tot de dag waarop de aanvraag is
      aangevuld of de daarvoor gestelde termijn ongebruikt is verstreken, of

      b. de aanvrager mededeelt dat voor de beschikking op de aanvraag redelijkerwijs noodzakelijke informatie aan een
      buitenlandse instantie is gevraagd, tot de dag waarop deze informatie is ontvangen of verder uitstel niet meer
      redelijk is.

      2 De termijn voor het geven van een beschikking wordt voorts opgeschort:

      a. gedurende de termijn waarvoor de aanvrager schriftelijk met uitstel heeft ingestemd,

      b. zolang de vertraging aan de aanvrager kan worden toegerekend, of

      c. zolang het bestuursorgaan door overmacht niet in staat is een beschikking te geven.

      3 In geval van overmacht deelt het bestuursorgaan zo spoedig mogelijk aan de aanvrager mede dat de beslistermijn is
      opgeschort, alsmede binnen welke termijn de beschikking wel tegemoet kan worden gezien.

      4 Indien de opschorting eindigt, doet het bestuursorgaan daarvan in de gevallen, bedoeld in het eerste lid,
      onderdeel b, of het tweede lid, onderdelen b en c, zo spoedig mogelijk mededeling aan de aanvrager, onder
      vermelding van de termijn binnen welke de beschikking alsnog moet worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel415
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:5
        hoofdstuk: '4'
        afdeling: 4.1.1
  - number: 4:17
    text: |-
      1 Indien een beschikking op aanvraag niet tijdig wordt gegeven, verbeurt het bestuursorgaan aan de aanvrager een
      dwangsom voor elke dag dat het in gebreke is, doch voor ten hoogste 42 dagen. De [Algemene termijnenwet][ref1] is
      op laatstgenoemde termijn niet van toepassing.

      2 De dwangsom bedraagt de eerste veertien dagen € 23 per dag, de daaropvolgende veertien dagen € 35 per dag en de
      overige dagen € 45 per dag.

      3 De eerste dag waarover de dwangsom verschuldigd is, is de dag waarop twee weken zijn verstreken na de dag waarop
      de termijn voor het geven van de beschikking is verstreken en het bestuursorgaan van de aanvrager een schriftelijke
      ingebrekestelling heeft ontvangen.

      4 Beroep tegen het niet tijdig geven van de beschikking schort de dwangsom niet op.

      5 Geen dwangsom is verschuldigd indien:

      a. het bestuursorgaan onredelijk laat in gebreke is gesteld,

      b. de aanvrager geen belanghebbende is, of

      c. de aanvraag kennelijk niet-ontvankelijk of kennelijk ongegrond is.

      6 Indien er meer dan één aanvrager is, is de dwangsom aan ieder van de aanvragers voor een gelijk deel
      verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel417
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: 4:18
    text: |-
      Het bestuursorgaan stelt de verschuldigdheid en de hoogte van de dwangsom bij beschikking vast binnen twee weken na
      de laatste dag waarover de dwangsom verschuldigd was.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel418
  - number: 4:19
    text: |-
      1 Het bezwaar, beroep of hoger beroep tegen de beschikking op de aanvraag heeft mede betrekking op een beschikking
      tot vaststelling van de hoogte van de dwangsom, voor zover de belanghebbende deze beschikking betwist.

      2 De bestuursrechter kan de beslissing op het beroep of hoger beroep inzake de beschikking tot vaststelling van de
      hoogte van de dwangsom echter verwijzen naar een ander orgaan, indien behandeling door dit orgaan gewenst is.

      3 In beroep of hoger beroep legt de belanghebbende zo mogelijk een afschrift over van de beschikking die hij
      betwist.

      4 Het eerste tot en met het derde lid zijn van overeenkomstige toepassing op een verzoek om voorlopige voorziening.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel419
  - number: 4:20
    text: |-
      Het bestuursorgaan kan onverschuldigd betaalde dwangsommen terugvorderen voor zover na de dag waarop de
      beschikking, bedoeld in [artikel 4:18][ref1] is vastgesteld, nog geen vijf jaren zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel418
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel420
