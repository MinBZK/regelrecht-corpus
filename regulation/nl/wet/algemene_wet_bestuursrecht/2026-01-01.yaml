  - number: 8:56
    text: |-
      Na afloop van het vooronderzoek worden partijen ten minste drie weken tevoren uitgenodigd om op een in de
      uitnodiging te vermelden plaats en tijdstip op een zitting van de bestuursrechter te verschijnen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel856
  - number: 8:57
    text: |-
      1 De bestuursrechter kan bepalen dat het onderzoek ter zitting achterwege blijft indien geen van de partijen, nadat
      zij zijn gewezen op hun recht ter zitting te worden gehoord, binnen een door hem gestelde redelijke termijn heeft
      verklaard dat zij gebruik wil maken van dit recht.

      2 Is het beroep reeds ter zitting behandeld, dan kan de bestuursrechter na toepassing van [artikel 8:51a][ref1]
      bepalen dat een nader onderzoek ter zitting achterwege blijft indien:

      a. het bestuursorgaan heeft medegedeeld dat het geen gebruik maakt van de gelegenheid om het gebrek te herstellen
      of te laten herstellen;

      b. de termijn als bedoeld in [artikel 8:51a, tweede lid][ref2], ongebruikt is verstreken;

      c. partijen hun zienswijzen over de wijze waarop het gebrek is hersteld, naar voren hebben gebracht; of

      d. de termijn als bedoeld in [artikel 8:51b, derde lid][ref3], ongebruikt is verstreken, tenzij partijen daardoor
      kunnen worden benadeeld.

      3 Als de bestuursrechter bepaalt dat het onderzoek of het nadere onderzoek ter zitting achterwege blijft, sluit hij
      het onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel851a
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel851a
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel851b
