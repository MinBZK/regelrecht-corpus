  - number: 8:20
    text: |-
      1 Het verzoek om verschoning wordt zo spoedig mogelijk behandeld door een meervoudige kamer waarin de rechter die
      om verschoning heeft verzocht, geen zitting heeft.

      2 De meervoudige kamer beslist zo spoedig mogelijk. De beslissing is gemotiveerd en wordt onverwijld aan partijen
      en de rechter die om verschoning had verzocht medegedeeld.

      3 Tegen de beslissing staat geen rechtsmiddel open.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel820
  - number: 8:21
    text: |-
      1 Natuurlijke personen, onbekwaam om in rechte te staan, worden in het geding vertegenwoordigd door hun
      vertegenwoordigers naar burgerlijk recht. De wettelijke vertegenwoordiger behoeft niet de machtiging van de
      kantonrechter, bedoeld in [artikel 349 van Boek 1 van het Burgerlijk Wetboek][ref1].

      2 De in het eerste lid bedoelde personen kunnen zelf in het geding optreden, indien zij tot redelijke waardering
      van hun belangen in staat kunnen worden geacht.

      3 Indien geen wettelijke vertegenwoordiger aanwezig is, of deze niet beschikbaar is en de zaak spoedeisend is,
      kan de bestuursrechter een voorlopige vertegenwoordiger benoemen. De benoeming vervalt zodra een wettelijke
      vertegenwoordiger aanwezig is of de wettelijke vertegenwoordiger weer beschikbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel349
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel821
