  - number: 3:2
    text: |-
      Bij de voorbereiding van een besluit vergaart het bestuursorgaan de nodige kennis omtrent de relevante feiten en de
      af te wegen belangen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel32
  - number: 3:3
    text: |-
      Het bestuursorgaan gebruikt de bevoegdheid tot het nemen van een besluit niet voor een ander doel dan waarvoor die
      bevoegdheid is verleend.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel33
  - number: 3:4
    text: |-
      1 Het bestuursorgaan weegt de rechtstreeks bij het besluit betrokken belangen af, voor zover niet uit een wettelijk
      voorschrift of uit de aard van de uit te oefenen bevoegdheid een beperking voortvloeit.

      2 De voor een of meer belanghebbenden nadelige gevolgen van een besluit mogen niet onevenredig zijn in verhouding
      tot de met het besluit te dienen doelen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel34
  - number: 3:5
    text: |-
      1 In deze afdeling wordt verstaan onder adviseur: een persoon of college, bij of krachtens wettelijk
      voorschrift belast met het adviseren inzake door een bestuursorgaan te nemen besluiten en niet werkzaam onder
      verantwoordelijkheid van dat bestuursorgaan.

      2 Deze afdeling is niet van toepassing op het horen van de Raad van State.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel35
  - number: 3:6
    text: |-
      1 Indien aan de adviseur niet reeds bij wettelijk voorschrift een termijn is gesteld, kan het bestuursorgaan
      aangeven binnen welke termijn een advies wordt verwacht. Deze termijn mag niet zodanig kort zijn, dat de adviseur
      zijn taak niet naar behoren kan vervullen.

      2 Indien het advies niet tijdig wordt uitgebracht staat het enkele ontbreken daarvan niet in de weg aan het nemen
      van het besluit.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel36
  - number: 3:7
    text: |-
      1 Het bestuursorgaan waaraan advies wordt uitgebracht, stelt aan de adviseur, al dan niet op verzoek, de gegevens
      ter beschikking die nodig zijn voor een goede vervulling van diens taak.

      2 [Artikel 5.1 van de Wet open overheid][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel5.1
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '5.1'
  - number: 3:8
    text: In of bij het besluit wordt de adviseur vermeld die advies heeft uitgebracht.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel38
  - number: 3:9
    text: |-
      Indien een besluit berust op een onderzoek naar feiten en gedragingen dat door een adviseur is verricht, dient het
      bestuursorgaan zich ervan te vergewissen dat dit onderzoek op zorgvuldige wijze heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel39
  - number: 3:9a
    text: Deze afdeling is van overeenkomstige toepassing op voorstellen van wet.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel39a
  - number: 3:10
    text: |-
      1 Deze afdeling is van toepassing op de voorbereiding van besluiten indien dat bij wettelijk voorschrift of bij
      besluit van het bestuursorgaan is bepaald.

      2 Tenzij bij wettelijk voorschrift of bij besluit van het bestuursorgaan anders is bepaald, is deze afdeling niet
      van toepassing op de voorbereiding van een besluit inhoudende de afwijzing van een aanvraag tot intrekking of
      wijziging van een besluit.

      3 [Afdeling 4.1.1][ref1] is mede van toepassing op andere besluiten dan beschikkingen, indien deze op aanvraag
      worden genomen en voorbereid overeenkomstig deze afdeling.

      4 Indien deze afdeling van toepassing is op de voorbereiding van een besluit is [paragraaf 4.1.3.3][ref2]. niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk4
