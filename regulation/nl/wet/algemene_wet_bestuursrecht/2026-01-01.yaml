  - number: 7:11
    text: |-
      1 Indien het bezwaar ontvankelijk is, vindt op grondslag daarvan een heroverweging van het bestreden besluit
      plaats.

      2 Voor zover de heroverweging daartoe aanleiding geeft, herroept het bestuursorgaan het bestreden besluit en neemt
      het voor zover nodig in de plaats daarvan een nieuw besluit.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel711
  - number: 7:12
    text: |-
      1 De beslissing op het bezwaar dient te berusten op een deugdelijke motivering, die bij de bekendmaking van de
      beslissing wordt vermeld. Daarbij wordt, indien ingevolge [artikel 7:3][ref1] van het horen is afgezien, tevens
      aangegeven op welke grond dat is geschied.

      2 De beslissing wordt bekendgemaakt door toezending of uitreiking aan degenen tot wie zij is gericht. Betreft het
      een besluit dat niet tot een of meer belanghebbenden is gericht, dan wordt de beslissing tevens bekendgemaakt op
      dezelfde wijze als waarop dat besluit bekendgemaakt is, tenzij het bestreden besluit in stand wordt gelaten.

      3 Zo spoedig mogelijk na de bekendmaking van de beslissing wordt hiervan mededeling gedaan aan de belanghebbenden
      die in bezwaar of bij de voorbereiding van het bestreden besluit hun zienswijze naar voren hebben gebracht.

      4 Bij de mededeling, bedoeld in het derde lid, is [artikel 6:23][ref2] van overeenkomstige toepassing en wordt
      met het oog op de aanvang van de beroepstermijn zo duidelijk mogelijk aangegeven wanneer de bekendmaking van de
      beslissing overeenkomstig het tweede lid heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel623
