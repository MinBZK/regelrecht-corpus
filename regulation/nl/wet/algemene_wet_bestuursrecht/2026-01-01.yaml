  - number: 8:108
    text: |-
      1 Voor zover in deze titel niet anders is bepaald, zijn op het hoger beroep de [titels 8.1 tot en met 8.3][ref1]
      van overeenkomstige toepassing, met uitzondering van de [artikelen 8:1 tot en met 8:10][ref2],
      [8:41, tweede lid][ref3], en [8:74][ref4].

      2 Op het hoger beroep, bedoeld in [artikel 8:104, eerste lid, aanhef en onder c][ref5], zijn voorts de
      [afdelingen 8.2.2a][ref6], [8.2.4a][ref7] en [8.2.7][ref8] en de [artikelen 8:28a][ref9], [8:70][ref10] en
      [8:72][ref11] niet van toepassing.

      3 Indien hoger beroep kan worden ingesteld bij een gerechtshof, is voorts
      [hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref12] van toepassing.


