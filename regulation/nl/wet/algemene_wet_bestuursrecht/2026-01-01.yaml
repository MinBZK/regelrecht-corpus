  - number: 8:60a
    text: |-
      1 De schriftelijke opmerkingen van de Europese Commissie of de Autoriteit Consument en Markt, bedoeld in
      [artikel 8:45a, eerste lid][ref1], kunnen tot tien dagen voor de zitting worden ingediend.

      2 Indien de Europese Commissie of de Autoriteit Consument en Markt ter zitting verschijnt voor het maken van
      mondelinge opmerkingen, wordt dit zoveel mogelijk aan partijen meegedeeld bij de uitnodiging voor de zitting.
      [Artikel 8:45a, derde lid][ref2], is van overeenkomstige toepassing.


