  - number: 8:84
    text: |-
      1 De voorzieningenrechter doet zo spoedig mogelijk schriftelijk of mondeling uitspraak.

      2 De uitspraak strekt tot:

      a. onbevoegdverklaring van de voorzieningenrechter,

      b. niet-ontvankelijkverklaring van het verzoek,

      c. afwijzing van het verzoek, of

      d. gehele of gedeeltelijke toewijzing van het verzoek.

      3 De voorzieningenrechter kan aan de gehele of gedeeltelijke toewijzing van het verzoek de voorwaarde verbinden
      dat de indiener van het verzoekschrift financiële zekerheid stelt ten behoeve van de rechtspersoon waartoe het
      bestuursorgaan behoort.

      4 De griffier zendt onverwijld een afschrift van de uitspraak of van het proces-verbaal van de mondelinge uitspraak
      kosteloos aan partijen.

      5 De [artikelen 8:67, tweede tot en met vijfde lid][ref1], [8:68][ref2], [8:69][ref3],
      [8:72, vierde lid, tweede volzin, aanhef en onder b, en zesde lid][ref4], [8:75][ref5], [8:75a ][ref6],
      [8:76][ref7], [8:77, eerste en derde lid][ref8], [8:78][ref9], [artikel 8:79, tweede en derde lid][ref10], en
      [8:80][ref11] zijn van overeenkomstige toepassing.


