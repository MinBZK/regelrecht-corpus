  - number: 8:54
    text: |-
      1 Totdat partijen zijn uitgenodigd om op een zitting van de bestuursrechter te verschijnen, kan de bestuursrechter
      het onderzoek sluiten, indien voortzetting van het onderzoek niet nodig is, omdat:

      a. de bestuursrechter kennelijk onbevoegd is,

      b. het beroep kennelijk niet-ontvankelijk is,

      c. het beroep kennelijk ongegrond is, of

      d. het beroep kennelijk gegrond is.

      2 In de uitspraak na toepassing van het eerste lid worden partijen gewezen op [artikel 8:55, eerste lid][ref1].


