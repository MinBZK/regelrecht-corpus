  - number: 3:12
    text: |-
      1 Voorafgaand aan de terinzagelegging geeft het bestuursorgaan in het in [artikel 12 van de Bekendmakingswet][ref1]
      voor het bestuursorgaan aangewezen publicatieblad op de in dat artikel bepaalde wijze kennis van het ontwerp.

      2 In de kennisgeving wordt vermeld:

      a. wie in de gelegenheid worden gesteld om zienswijzen naar voren te brengen;

      b. op welke wijze dit kan geschieden;

      c. indien toepassing is gegeven aan [artikel 3:18, tweede lid][ref2]: de termijn waarbinnen het besluit zal worden
      genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel318
