  - number: B3:2
    text: |-
      Het tarief, genoemd in [artikel 8:41, tweede lid, onderdeel a][ref1], dan wel genoemd in
      [artikel 8:109, eerste lid, onderdeel a][ref2], geldt voorts indien het beroep, dan wel hoger beroep, betreft een
      besluit, genomen op grond van een in dit artikel genoemd voorschrift of anderszins in dit artikel omschreven.

      De volgende besluiten:

      a. een besluit over een gehandicaptenparkeerkaart als bedoeld in
      [hoofdstuk IV van het Besluit administratieve bepalingen inzake het wegverkeer][ref3]

      b. een op grond van een gemeentelijke verordening of gemeenschappelijke regeling genomen besluit over een
      gehandicaptenparkeerkaart

      c. een besluit over een gehandicaptenparkeerplaats voor een bepaald voertuig

      [Algemene bijstandswet][ref4]

      [Algemene Kinderbijslagwet][ref5]

      [Algemene nabestaandenwet ][ref6]

      [Algemene Ouderdomswet][ref7]

      [Algemene wet inkomensafhankelijke regelingen][ref8]

      [Algemene wet inzake rijksbelastingen][ref9], tenzij het beroep of hoger beroep door een natuurlijke persoon is
      ingesteld tegen een uitspraak inzake een besluit met betrekking tot de toepassing van:

      a. de [Wet op de dividendbelasting 1965][ref10]

      b. de [Wet op de omzetbelasting 1968][ref11]

      c. de [Wet op de belasting van personenauto’s en motorrijwielen 1992][ref12]

      d. de [Wet op de accijns][ref13]

      e. de [Wet op de verbruiksbelasting van alcoholvrije dranken][ref14]

      f. de [Wet belastingen op milieugrondslag][ref15]

