  - number: 8:82
    text: |-
      1 Van de verzoeker wordt door de griffier een griffierecht geheven.

      2 Het griffierecht is gelijk aan het griffierecht dat de verzoeker ten tijde van de indiening van het verzoek voor
      de hoofdzaak verschuldigd is of zou zijn.

      3 [Artikel 8:41, derde tot en met zesde lid][ref1], is van overeenkomstige toepassing, met dien verstande dat de
      termijn voor de bijschrijving of storting van het griffierecht twee weken bedraagt. De voorzieningenrechter kan een
      kortere termijn stellen.

      4 De griffier betaalt het griffierecht terug indien het verzoek wordt ingetrokken:

      a. omdat het bestuursorgaan aan de voorzieningenrechter schriftelijk heeft medegedeeld de uitvoering van het
      bestreden besluit tijdens de procedure over de hoofdzaak op te schorten, of

      b. omdat de belanghebbende tot wie het bestreden besluit is gericht, aan de voorzieningenrechter schriftelijk heeft
      medegedeeld de gevraagde voorlopige maatregelen te zullen nemen.

      5 De uitspraak kan inhouden dat het betaalde griffierecht door het bestuursorgaan geheel of gedeeltelijk wordt
      vergoed.

      6 In andere gevallen kan het bestuursorgaan het betaalde griffierecht geheel of gedeeltelijk vergoeden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel841
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel882
