  - number: 8:77
    text: |-
      1 De schriftelijke uitspraak vermeldt:

      a. de namen van partijen en van hun vertegenwoordigers of gemachtigden,

      b. de gronden van de beslissing,

      c. de beslissing,

      d. de naam van de rechter of de namen van de rechters die de zaak heeft onderscheidenlijk hebben behandeld,

      e. de dag waarop de beslissing is uitgesproken, en

      f. door wie, binnen welke termijn en bij welke bestuursrechter welk rechtsmiddel kan worden aangewend.

      2 Indien de uitspraak strekt tot gegrondverklaring van het beroep, wordt in de uitspraak vermeld welke geschreven
      of ongeschreven rechtsregel of welk algemeen rechtsbeginsel geschonden wordt geoordeeld.

      3 De uitspraak wordt ondertekend door de voorzitter en de griffier. Bij verhindering van de voorzitter of de
      griffier wordt dit in de uitspraak vermeld.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel877
  - number: 8:78
    text: De uitspraak geschiedt in het openbaar.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel878
  - number: 8:79
    text: |-
      1 Binnen twee weken na de dagtekening van de uitspraak stelt de griffier kosteloos een afschrift van de uitspraak
      of van het proces-verbaal van de mondelinge uitspraak ter beschikking van partijen.

      2 Anderen dan partijen kunnen afschriften of uittreksels van de uitspraak of van het proces-verbaal
      van de mondelinge uitspraak verkrijgen. Met betrekking tot de kosten is het bij en krachtens de
      [Wet tarieven in strafzaken][ref1] bepaalde van overeenkomstige toepassing.

      3 In afwijking van het tweede lid verstrekt de griffier, indien de uitspraak betrekking heeft op de toepassing van
      de artikelen 101 of 102 van het Verdrag betreffende de werking van de Europese Unie, overeenkomstig artikel 15,
      tweede lid, van de in [artikel 8:45, vierde lid][ref2], genoemde verordening onverwijld en kosteloos een afschrift
      van de uitspraak of van het proces-verbaal van de mondelinge uitspraak aan de Europese Commissie. De verstrekking
      geschiedt door tussenkomst van de Raad voor de rechtspraak, tenzij het een uitspraak van de Hoge Raad of van de
      Afdeling bestuursrechtspraak van de Raad van State betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0002406
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel845
