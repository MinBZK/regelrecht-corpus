  - number: 8:55b
    text: |-
      1 Indien het beroep is gericht tegen het niet tijdig nemen van een besluit, doet de bestuursrechter binnen acht
      weken nadat het beroepschrift is ontvangen en aan de vereisten van [artikel 6:5][ref1] is voldaan, uitspraak met
      toepassing van [artikel 8:54][ref2], tenzij de bestuursrechter een onderzoek ter zitting nodig acht.

      2 Indien de bestuursrechter een onderzoek ter zitting nodig acht, deelt hij dit zo spoedig mogelijk aan partijen
      mede.

      3 Indien de bestuursrechter een onderzoek ter zitting nodig acht, behandelt hij het beroep zo mogelijk met
      toepassing van [artikel 8:52][ref3]. In dat geval doet de bestuursrechter zo mogelijk binnen dertien weken
      uitspraak.


