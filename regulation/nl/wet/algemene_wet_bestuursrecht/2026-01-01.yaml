      Wanneer na het horen aan het beroepsorgaan feiten of omstandigheden bekend worden die voor de op het beroep te
      nemen beslissing van aanmerkelijk belang kunnen zijn, wordt dit aan belanghebbenden meegedeeld en worden zij in de
      gelegenheid gesteld daarover te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel723
  - number: 7:24
    text: |-
      1 Het beroepsorgaan beslist binnen zestien weken, gerekend vanaf de dag na die waarop de termijn voor het indienen
      van het beroepschrift is verstreken.

      2 Indien het beroepsorgaan evenwel behoort tot dezelfde rechtspersoon als het bestuursorgaan tegen welks
      besluit het beroep is gericht, beslist het binnen zes weken of – indien een commissie als bedoeld in
      [artikel 7:19, tweede lid][ref1], is ingesteld – binnen twaalf weken, gerekend vanaf de dag na die waarop de
      termijn voor het indienen van het beroepschrift is verstreken.

      3 De termijn wordt opgeschort gerekend vanaf de dag na die waarop de indiener is verzocht een verzuim als bedoeld
      in [artikel 6:6][ref2] te herstellen, tot de dag waarop het verzuim is hersteld of de daarvoor gestelde termijn
      ongebruikt is verstreken.

      4 Het beroepsorgaan kan de beslissing voor ten hoogste tien weken verdagen.

      5 In het geval, bedoeld in het tweede lid, kan het beroepsorgaan de beslissing echter voor ten hoogste zes weken
      verdagen.

      6 Verder uitstel is mogelijk voor zover:

      a. alle belanghebbenden daarmee instemmen,

      b. de indiener van het beroepschrift daarmee instemt en andere belanghebbenden daardoor niet in hun belangen kunnen
      worden geschaad, of

      c. dit nodig is in verband met de naleving van wettelijke procedurevoorschriften.

      7 Indien toepassing is gegeven aan het derde, vierde, vijfde of zesde lid, doet het beroepsorgaan hiervan
      schriftelijk mededeling aan belanghebbenden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel719
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel66
