  - number: 3:43
    text: |-
      1 Tegelijkertijd met of zo spoedig mogelijk na de bekendmaking wordt van het besluit mededeling gedaan aan
      degenen die bij de voorbereiding ervan hun zienswijze naar voren hebben gebracht. Aan een adviseur als bedoeld in
      [artikel 3:5][ref1] wordt in ieder geval mededeling gedaan indien van het advies wordt afgeweken.

      2 Bij de mededeling van een besluit wordt tevens vermeld wanneer en hoe de bekendmaking ervan heeft plaatsgevonden.


