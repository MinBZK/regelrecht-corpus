  - number: 8:81
    text: |-
      1 Indien tegen een besluit bij de bestuursrechter beroep is ingesteld dan wel, voorafgaand aan een mogelijk beroep
      bij de bestuursrechter, bezwaar is gemaakt of administratief beroep is ingesteld, kan de voorzieningenrechter van
      de bestuursrechter die bevoegd is of kan worden in de hoofdzaak, op verzoek een voorlopige voorziening treffen
      indien onverwijlde spoed, gelet op de betrokken belangen, dat vereist.

      2 Indien bij de bestuursrechter beroep is ingesteld, kan een verzoek om voorlopige voorziening worden gedaan door
      een partij in de hoofdzaak.

      3 Indien voorafgaand aan een mogelijk beroep bij de bestuursrechter bezwaar is gemaakt of administratief beroep
      is ingesteld, kan een verzoek om voorlopige voorziening worden gedaan door de indiener van het bezwaarschrift,
      onderscheidenlijk door de indiener van het beroepschrift of door de belanghebbende die geen recht heeft tot het
      instellen van administratief beroep.

      4 De [artikelen 6:4, derde lid][ref1], [6:5][ref2], [6:6][ref3], [6:14][ref4], [6:15][ref5], [6:17][ref6],
      [6:19][ref7] en [6:21][ref8] zijn van overeenkomstige toepassing. De indiener van het verzoekschrift die bezwaar
      heeft gemaakt dan wel beroep heeft ingesteld, legt daarbij een afschrift van het bezwaar- of beroepschrift over.

      5 Indien een verzoek om voorlopige voorziening is gedaan nadat bezwaar is gemaakt of administratief beroep is
      ingesteld en op dit bezwaar of beroep wordt beslist voordat de zitting heeft plaatsgevonden, wordt de verzoeker
      in de gelegenheid gesteld beroep bij de bestuursrechter in te stellen. Het verzoek om voorlopige voorziening wordt
      gelijkgesteld met een verzoek dat wordt gedaan hangende het beroep bij de bestuursrechter.


