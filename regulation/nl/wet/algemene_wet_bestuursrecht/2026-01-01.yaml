  - number: 8:61
    text: |-
      1 De voorzitter heeft de leiding van de zitting.

      2 De griffier houdt aantekening van het verhandelde ter zitting.

      3 De griffier maakt van de zitting een proces-verbaal op:

      a. indien de bestuursrechter dit ambtshalve of op verzoek van een partij die daarbij belang heeft, bepaalt, of

      b. op verzoek van de hogerberoepsrechter of de Hoge Raad.

      4 Het bevat de namen van de rechter of de rechters die de zaak behandelt onderscheidenlijk behandelen, die van
      partijen en van hun vertegenwoordigers of gemachtigden die op de zitting zijn verschenen en van degenen die hen
      hebben bijgestaan, en die van de getuigen, deskundigen en tolken die op de zitting zijn verschenen.

      5 Het houdt een vermelding in van hetgeen op de zitting met betrekking tot de zaak is voorgevallen.

      6 Het wordt door de voorzitter en de griffier ondertekend. Bij verhindering van de voorzitter of de griffier wordt
      dit in het proces-verbaal vermeld.

      7 Aan het proces-verbaal kunnen overgelegde pleitnotities worden gehecht.

      8 De bestuursrechter kan bepalen dat de verklaring van een partij, getuige of deskundige geheel in het proces-
      verbaal zal worden opgenomen. In dat geval wordt de verklaring onverwijld op schrift gesteld en aan de partij,
      getuige of deskundige voorgelezen. Deze mag daarin wijzigingen aanbrengen, die op schrift worden gesteld en aan
      de partij, getuige of deskundige worden voorgelezen. De verklaring wordt door de partij, getuige of deskundige
      ondertekend. Heeft ondertekening niet plaats, dan wordt de reden daarvan in het proces-verbaal vermeld.

      9 Nadat de bestuursrechter toepassing heeft gegeven aan [artikel 8:36e][ref1], kan de hogerberoepsrechter of de
      Hoge Raad verzoeken een schriftelijke weergave van de gesproken tekst van de beeld- of geluidsopname op te stellen.

      10 De griffier die een proces-verbaal opmaakt stelt dit ter beschikking aan partijen, indien het derde lid, aanhef
      en onder a, van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel836e
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel861
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 8:36e
        hoofdstuk: '8'
        afdeling: 8.1.6a
  - number: 8:62
    text: |-
      1 De zitting is openbaar.

      2 De bestuursrechter kan bepalen dat het onderzoek ter zitting geheel of gedeeltelijk zal plaatshebben met gesloten
      deuren:

      a. in het belang van de openbare orde of de goede zeden,

      b. in het belang van de veiligheid van de Staat,

      c. indien de belangen van minderjarigen of de eerbiediging van de persoonlijke levenssfeer van partijen dit eisen,
      of

      d. indien openbaarheid het belang van een goede rechtspleging ernstig zou schaden.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel862
  - number: 8:63
    text: |-
      1 Op het horen van getuigen en deskundigen is
      [artikel 179, tweede en derde lid, eerste volzin, van het Wetboek van Burgerlijke Rechtsvordering][ref1] van
      overeenkomstige toepassing. Op het horen van getuigen is artikel 179, eerste lid, van het Wetboek van Burgerlijke
      Rechtsvordering van overeenkomstige toepassing.

      2 De bestuursrechter kan afzien van het horen van door een partij meegebrachte of opgeroepen getuigen en
      deskundigen indien hij van oordeel is dat dit redelijkerwijs niet kan bijdragen aan de beoordeling van de zaak.

      3 Indien een door een partij opgeroepen getuige of deskundige niet is verschenen, kan de bestuursrechter deze
      oproepen. In dat geval schorst de bestuursrechter het onderzoek ter zitting.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel179
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel863
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '179'
  - number: 8:64
    text: |-
      1 De bestuursrechter kan het onderzoek ter zitting schorsen. Hij kan daarbij bepalen dat het vooronderzoek wordt
      hervat.

      2 Indien bij de schorsing geen tijdstip van de nadere zitting is bepaald, bepaalt de bestuursrechter dit zo spoedig
      mogelijk. De griffier doet zo spoedig mogelijk mededeling aan partijen van het tijdstip van de nadere zitting.

      3 In de gevallen waarin schorsing van het onderzoek ter zitting heeft plaatsgevonden, wordt de zaak op de nadere
      zitting hervat in de stand waarin zij zich bevond.

      4 De bestuursrechter kan bepalen dat het onderzoek ter zitting opnieuw wordt aangevangen.

      5 De bestuursrechter kan bepalen dat de nadere zitting achterwege blijft indien geen van de partijen, nadat zij
      zijn gewezen op hun recht ter zitting te worden gehoord, binnen een door hem gestelde redelijke termijn heeft
      verklaard dat zij gebruik wil maken van dit recht. [Artikel 8:57, tweede en derde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel857
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel864
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 8:57
        hoofdstuk: '8'
        afdeling: 8.2.5
  - number: 8:65
    text: |-
      1 De bestuursrechter sluit het onderzoek ter zitting, wanneer hij van oordeel is dat het is voltooid.

      2 Voordat het onderzoek ter zitting wordt gesloten, hebben partijen het recht voor het laatst het woord te voeren.

      3 Zodra het onderzoek ter zitting is gesloten, deelt de voorzitter mee wanneer uitspraak zal worden gedaan.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel865
  - number: 8:66
    text: |-
      1 Tenzij mondeling uitspraak wordt gedaan, doet de bestuursrechter binnen zes weken na de sluiting van het
      onderzoek schriftelijk uitspraak.

      2 In bijzondere omstandigheden kan de bestuursrechter deze termijn met ten hoogste zes weken verlengen.

      3 Van deze verlenging wordt aan partijen mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel866
  - number: 8:67
    text: |-
      1 De bestuursrechter kan na de sluiting van het onderzoek ter zitting onmiddellijk mondeling uitspraak doen. De
      uitspraak kan voor ten hoogste een week worden verdaagd onder aanzegging aan partijen van het tijdstip van de
      uitspraak.

      2 De mondelinge uitspraak bestaat uit de beslissing en de gronden van de beslissing.

      3 Van de mondelinge uitspraak wordt door de griffier een proces-verbaal opgemaakt.

      4 Het wordt door de voorzitter en de griffier ondertekend. Bij verhindering van de voorzitter of de griffier wordt
      dit in het proces-verbaal vermeld.

      5 De bestuursrechter spreekt de beslissing, bedoeld in het tweede lid, in het openbaar uit, in tegenwoordigheid van
      de griffier. Daarbij wordt vermeld door wie, binnen welke termijn en bij welke bestuursrechter welk rechtsmiddel
      kan worden aangewend.

      6 De mededeling, bedoeld in het vijfde lid, tweede volzin, wordt in het proces-verbaal vermeld.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel867
  - number: 8:68
    text: |-
      1 Indien de bestuursrechter van oordeel is dat het onderzoek niet volledig is geweest, kan hij het heropenen. De
      bestuursrechter bepaalt daarbij op welke wijze het onderzoek wordt voortgezet.

      2 De griffier doet zo spoedig mogelijk mededeling daarvan aan partijen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel868
  - number: 8:69
    text: |-
      1 De bestuursrechter doet uitspraak op de grondslag van het beroepschrift, de overgelegde stukken, het verhandelde
      tijdens het vooronderzoek en het onderzoek ter zitting.

      2 De bestuursrechter vult ambtshalve de rechtsgronden aan.

      3 De bestuursrechter kan ambtshalve de feiten aanvullen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel869
  - number: 8:69a
    text: |-
      De bestuursrechter vernietigt een besluit niet op de grond dat het in strijd is met een geschreven of ongeschreven
      rechtsregel of een algemeen rechtsbeginsel, indien deze regel of dit beginsel kennelijk niet strekt tot bescherming
      van de belangen van degene die zich daarop beroept.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel869a
  - number: 8:70
    text: |-
      De uitspraak strekt tot:

      a. onbevoegdverklaring van de bestuursrechter,

      b. niet-ontvankelijkverklaring van het beroep,

      c. ongegrondverklaring van het beroep, of

      d. gegrondverklaring van het beroep.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel870
  - number: 8:71
    text: |-
      Voor zover uitsluitend een vordering bij de burgerlijke rechter kan worden ingesteld, wordt dit in de uitspraak
      vermeld. De burgerlijke rechter is aan die beslissing gebonden.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel871
  - number: 8:72
    text: |-
      1 Indien de bestuursrechter het beroep gegrond verklaart, vernietigt hij het bestreden besluit geheel of
      gedeeltelijk.

      2 De vernietiging van een besluit of een gedeelte van een besluit brengt vernietiging van de rechtsgevolgen van dat
      besluit of van het vernietigde gedeelte daarvan mee.

      3 De bestuursrechter kan bepalen dat:

      a. de rechtsgevolgen van het vernietigde besluit of het vernietigde gedeelte daarvan geheel of gedeeltelijk in
      stand blijven, of

      b. zijn uitspraak in de plaats treedt van het vernietigde besluit of het vernietigde gedeelte daarvan.

      4 De bestuursrechter kan, indien toepassing van het derde lid niet mogelijk is, het bestuursorgaan opdragen een
      nieuw besluit te nemen of een andere handeling te verrichten met inachtneming van zijn aanwijzingen. Daarbij kan
      hij:

      a. bepalen dat wettelijke voorschriften over de voorbereiding van het nieuwe besluit of de andere handeling geheel
      of gedeeltelijk buiten toepassing blijven;

      b. het bestuursorgaan een termijn stellen voor het nemen van het nieuwe besluit of het verrichten van de andere
      handeling.

      5 De bestuursrechter kan zo nodig een voorlopige voorziening treffen. Daarbij bepaalt hij het tijdstip waarop de
      voorlopige voorziening vervalt.

      6 De bestuursrechter kan bepalen dat, indien of zolang het bestuursorgaan niet voldoet aan een
      uitspraak, het bestuursorgaan aan een door hem aangewezen partij een in de uitspraak vast te
      stellen dwangsom verbeurt. De [artikelen 611a, vierde lid][ref1], [611b tot en met 611d][ref2] en
      [611g van het Wetboek van Burgerlijke Rechtsvordering][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel611a
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel611b
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel611g
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel872
