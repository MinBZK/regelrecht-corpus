  - number: 3:28
    text: |-
      Voor de mogelijkheid van beroep bij de bestuursrechter worden besluiten die zijn voorbereid met toepassing van deze
      afdeling aangemerkt als één besluit.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel328
  - number: 3:29
    text: |-
      1 Tenzij het tweede lid van toepassing is, staat tegen besluiten die zijn voorbereid met toepassing van deze
      afdeling beroep open bij de rechtbank binnen het rechtsgebied waar het coördinerend bestuursorgaan zijn zetel
      heeft.

      2 Tegen besluiten die zijn voorbereid met toepassing van deze afdeling staat beroep open bij:

      a. de Afdeling bestuursrechtspraak van de Raad van State, indien tegen een of meer van de besluiten beroep kan
      worden ingesteld bij de Afdeling;

      b. het College van Beroep voor het bedrijfsleven, indien tegen een of meer van de besluiten beroep kan worden
      ingesteld bij het College en onderdeel a niet van toepassing is;

      c. de Centrale Raad van Beroep, indien tegen een of meer van de besluiten beroep kan worden ingesteld bij de
      Centrale Raad van Beroep en de onderdelen a en b niet van toepassing zijn.

      3 Indien inzake één van de besluiten die met toepassing van deze afdeling gecoördineerd zijn voorbereid hoger
      beroep kan worden ingesteld bij:

      a. de Afdeling bestuursrechtspraak van de Raad van State, staat inzake alle besluiten hoger beroep open bij de
      Afdeling;

      b. het College van Beroep voor het bedrijfsleven en onderdeel a niet van toepassing is, staat inzake alle besluiten
      hoger beroep open bij het College;

      c. de Centrale Raad van Beroep en de onderdelen a en b niet van toepassing zijn, staat inzake alle besluiten hoger
      beroep open bij de Centrale Raad van Beroep.

      4 De ingevolge het eerste lid bevoegde rechtbank of de ingevolge het tweede of derde lid bevoegde
      bestuursrechter kan de behandeling van de beroepen dan wel hoger beroepen verwijzen naar een rechtbank
      onderscheidenlijk een andere bestuursrechter die voor de behandeling ervan meer geschikt wordt geacht.
      [Artikel 8:13, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel813
