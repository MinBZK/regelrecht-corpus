  - number: 2:18
    text: |-
      1 Aan het vereiste van ondertekening is voldaan door een elektronische handtekening, indien de methode die daarbij
      voor ondertekening is gebruikt, voldoende betrouwbaar is, gelet op de aard en inhoud van het elektronische bericht
      en het doel waarvoor het is gebruikt.

      2 Indien de veiligheid en de betrouwbaarheid van het elektronische bericht en het doel waarvoor het wordt gebruikt
      dit noodzakelijk maken, kan bij wettelijk voorschrift het gebruik worden voorgeschreven van een bepaald type
      elektronische handtekening als bedoeld in artikel 3, onder 10, van [Verordening (EU) nr. 910/2014](32014R0910)
      van het Europees Parlement en de Raad van 23 juli 2014 (PbEU 2014, L 257). Daarbij kunnen aanvullende eisen worden
      gesteld, tenzij het gaat om een geavanceerde elektronische handtekening als bedoeld in artikel 3, onder 11, of een
      gekwalificeerde elektronische handtekening als bedoeld in artikel 3, onder 12, van die verordening.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel218
  - number: 2:19
    text: |-
      Als tijdstip waarop een bericht door een bestuursorgaan elektronisch is verzonden, geldt:

      a. het tijdstip waarop het bericht een systeem voor gegevensverwerking bereikt waarvoor het bestuursorgaan of een
      ander bestuursorgaan geen verantwoordelijkheid draagt;

      b. indien het bestuursorgaan gebruikmaakt van een systeem voor gegevensverwerking waarin de geadresseerde toegang
      heeft tot het bericht: het tijdstip waarop het bericht toegankelijk wordt voor de geadresseerde;

      c. indien het bestuursorgaan gebruikmaakt van zowel een voorziening voor elektronisch berichtenverkeer en
      informatieverschaffing als bedoeld in [artikel 5, eerste lid, onder f, van de Wet digitale overheid][ref1] als een
      andere voorziening: het tijdstip waarop het bericht toegankelijk is geworden via de eerstgenoemde voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0048156#Artikel5
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel219
    references:
      - id: ref1
        bwb_id: BWBR0048156
        artikel: '5'
  - number: 2:20
    text: |-
      Als tijdstip waarop een bericht door een bestuursorgaan elektronisch is ontvangen, geldt het tijdstip waarop het
      bericht zijn systeem voor gegevensverwerking of een ander daartoe aangewezen systeem heeft bereikt of het tijdstip
      waarop het bericht op andere wijze elektronisch toegankelijk wordt voor het bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel220
  - number: 2:21
    text: |-
      1 Het bestuursorgaan kan een wettelijke termijn voor de indiening van een bericht verlengen wegens een verminderde
      elektronische bereikbaarheid van het bestuursorgaan.

      2 Het bestuursorgaan doet van de in het eerste lid bedoelde verlenging zo spoedig mogelijk mededeling op een
      zodanige wijze dat degenen die gebruikmaken van de desbetreffende wijze van elektronische verzending hiervan tijdig
      kennis kunnen nemen.

      3 Indien voor de indiening van een bericht bij een bestuursorgaan een termijn is gesteld, en het bestuursorgaan
      in een periode voorafgaand aan het einde van die termijn enige tijd niet bereikbaar is via de met toepassing
      van [artikel 2:13, tweede lid][ref1], voor dat bericht aangewezen wijze van elektronische verzending, wordt de
      verzender de overschrijding van die termijn niet tegengeworpen indien redelijkerwijs niet kan worden geoordeeld dat
      de verzender in verzuim is geweest. De verzender wordt in ieder geval niet geoordeeld in verzuim te zijn geweest
      voor de duur van de in de vorige zin bedoelde periode.

      4 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de verschoonbaarheid van
      termijnoverschrijdingen wegens verminderde elektronische bereikbaarheid van het bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel213
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel221
