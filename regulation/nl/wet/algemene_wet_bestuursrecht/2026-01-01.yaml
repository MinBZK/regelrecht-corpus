  - number: 5:28
    text: |-
      Het bestuursorgaan dat bestuursdwang toepast, is bevoegd tot het verzegelen van gebouwen, terreinen en hetgeen zich
      daarin of daarop bevindt.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel528
  - number: 5:29
    text: |-
      1 Voor zover de toepassing van bestuursdwang dit vergt, kan het bestuursorgaan zaken meevoeren en opslaan.

      2 Het bestuursorgaan doet van het meevoeren en opslaan proces-verbaal opmaken. Een afschrift van het proces-verbaal
      wordt verstrekt aan degene die de zaken onder zijn beheer had.

      3 Het bestuursorgaan draagt zorg voor de bewaring van de opgeslagen zaken en geeft deze zaken terug aan de
      rechthebbende.

      4 Het bestuursorgaan kan de teruggave opschorten totdat de ingevolge [artikel 5:25][ref1] verschuldigde kosten
      zijn voldaan.

      5 Indien de rechthebbende niet tevens de overtreder is, kan het bestuursorgaan de teruggave opschorten totdat de
      kosten van bewaring zijn voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel525
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel529
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 5:25
        hoofdstuk: '5'
        afdeling: 5.3.1
  - number: 5:30
    text: |-
      1 Indien een meegevoerde en opgeslagen zaak niet binnen dertien weken nadat zij is meegevoerd, kan worden
      teruggegeven, kan het bestuursorgaan de zaak verkopen.

      2 Het bestuursorgaan kan de zaak eerder verkopen, zodra de ingevolge [artikel 5:25][ref1] verschuldigde kosten,
      vermeerderd met de voor de verkoop geraamde kosten, in verhouding tot de waarde van de zaak onevenredig hoog
      worden.

      3 Verkoop vindt evenwel niet plaats binnen twee weken na de verstrekking van het afschrift van het proces-verbaal
      van meevoeren en opslaan, tenzij het gevaarlijke stoffen of eerder aan bederf onderhevige stoffen betreft.

      4 Gedurende drie jaren na het tijdstip van verkoop heeft degene die op dat tijdstip eigenaar was, recht op de
      opbrengst van de zaak onder aftrek van de ingevolge [artikel 5:25][ref2] verschuldigde kosten en de kosten van de
      verkoop. Na het verstrijken van deze termijn vervalt een batig saldo aan het bestuursorgaan.

      5 Indien naar het oordeel van het bestuursorgaan verkoop niet mogelijk is, kan het de zaak om niet aan een derde in
      eigendom overdragen of laten vernietigen. Het eerste tot en met het derde lid zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel525
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel525
