        afdeling: '3.5'
  - number: 3:22
    text: |-
      1 Het coördinerend bestuursorgaan bevordert een doelmatige en samenhangende voorbereiding van besluiten, waarbij
      de bestuursorganen bij de beoordeling van de aanvragen in ieder geval rekening houden met de onderlinge samenhang
      tussen de aanvragen en tussen de te nemen besluiten.

      2 De bevoegde bestuursorganen verlenen de medewerking die voor het welslagen van de coördinatie nodig is.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel322
  - number: 3:23
    text: |-
      1 De besluiten worden zoveel mogelijk gelijktijdig aangevraagd bij het coördinerend bestuursorgaan, met dien
      verstande dat de laatste aanvraag niet later wordt ingediend dan zes weken na ontvangst van de eerste aanvraag. Het
      coördinerend bestuursorgaan kan bepalen dat voor het indienen van de aanvragen een andere termijn geldt.

      2 Het coördinerend bestuursorgaan zendt terstond na ontvangst van de aanvragen een afschrift daarvan aan de
      bevoegde bestuursorganen.

      3 Indien een aanvraag later dan de termijn, bedoeld in het eerste lid, wordt ingediend, wordt die aanvraag niet
      betrokken bij de gecoördineerde voorbereiding van de andere besluiten, tenzij het coördinerend bestuursorgaan
      anders bepaalt.

      4 Bij wettelijk voorschrift kan worden bepaald dat de aanvraag om een besluit niet wordt behandeld indien niet
      tevens de aanvraag om een ander besluit is ingediend.

      5 Het coördinerend bestuursorgaan is mede bevoegd tot het indienen van een aanvraag bij het bevoegde
      bestuursorgaan, indien het besluit waarop de aanvraag betrekking heeft, strekt tot uitvoering van een besluit
      dat door het coördinerend bestuursorgaan is genomen. De aanvraag kan mede namens een van de andere betrokken
      bestuursorganen worden ingediend.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel323
  - number: 3:24
    text: |-
      Onverminderd [artikel 3:23, vierde lid][ref1], vangt de termijn voor het nemen van de besluiten, bedoeld in artikel
      3:23, eerste lid, aan met ingang van de dag waarop de laatste aanvraag is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel323
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel324
