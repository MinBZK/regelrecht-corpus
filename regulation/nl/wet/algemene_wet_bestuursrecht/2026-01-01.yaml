  - number: 2:23
    text: |-
      Indien de indiening van een bericht als bedoeld in [artikel 2:13, eerste lid][ref1], aan een termijn is gebonden en
      de verzender redelijkerwijs kon menen dat hij het bericht kon indienen zoals hij heeft gedaan, wordt deze termijn
      verlengd met het tijdsverloop tussen de ontvangst van het bericht en de in [artikel 2:16, eerste lid][ref2],
      bedoelde reactie, doch met ten minste één werkdag.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel213
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel216
