  - number: 3:40
    text: Een besluit treedt niet in werking voordat het is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel340
  - number: 3:41
    text: |-
      1 De bekendmaking van besluiten die tot een of meer belanghebbenden zijn gericht, geschiedt door toezending of
      uitreiking aan hen, onder wie begrepen de aanvrager.

      2 Indien de bekendmaking van het besluit niet kan geschieden op de wijze als voorzien in het eerste lid, geschiedt
      zij op een andere geschikte wijze.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel341
  - number: 3:42
    text: |-
      De bekendmaking van besluiten die niet tot een of meer belanghebbenden zijn gericht, geschiedt op de in de
      [artikelen 5][ref1] onderscheidenlijk [6 van de Bekendmakingswet][ref2] bepaalde wijze.


