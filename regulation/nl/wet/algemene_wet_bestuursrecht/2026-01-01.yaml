  - number: 2:22
    text: |-
      1 Indien een kennisgeving als bedoeld in [artikel 2:10][ref1] niet is verzonden, wordt de overschrijding van een
      termijn die is aangevangen met de verzending van het bericht waarop deze kennisgeving betrekking heeft, niet aan de
      geadresseerde tegengeworpen, tenzij de geadresseerde heeft laten weten deze kennisgeving niet te willen ontvangen.

      2 De overschrijding van een termijn wordt de geadresseerde evenmin tegengeworpen indien hij de kennisgeving,
      bedoeld in [artikel 2:10][ref2], niet heeft ontvangen en redelijkerwijs niet kan worden geoordeeld dat hij in
      verzuim is geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel210
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel210
