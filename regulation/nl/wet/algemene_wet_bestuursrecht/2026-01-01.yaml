  - number: 8:89
    text: |-
      1 Indien de schade wordt veroorzaakt door een besluit waarover de Centrale Raad van Beroep of de Hoge Raad in enige
      of hoogste aanleg oordeelt, is de bestuursrechter bij uitsluiting bevoegd.

      2 In de overige gevallen is de bestuursrechter bevoegd voor zover de gevraagde vergoeding ten hoogste € 25 000
      bedraagt met inbegrip van de tot aan de dag van het verzoek verschenen rente, en onverminderd het recht van de
      belanghebbende om op grond van andere wettelijke bepalingen schadevergoeding te vragen.

      3 De bestuursrechter is in de gevallen, bedoeld in het tweede lid, niet bevoegd indien de belanghebbende het
      verzoek heeft ingediend nadat hij ter zake van de schade een geding bij de burgerlijke rechter aanhangig heeft
      gemaakt.

      4 Zolang het verzoek van de belanghebbende bij de bestuursrechter aanhangig is, verklaart de burgerlijke rechter
      een vordering tot vergoeding van de schade niet ontvankelijk.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel889
  - number: 8:90
    text: |-
      1 Het verzoek wordt schriftelijk ingediend bij de bestuursrechter die bevoegd is kennis te nemen van het beroep
      tegen het besluit.

      2 Ten minste acht weken voor het indienen van het in het eerste lid bedoelde verzoekschrift vraagt de
      belanghebbende het betrokken bestuursorgaan schriftelijk om vergoeding van de schade, tenzij dit redelijkerwijs
      niet van hem kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel890
  - number: 8:91
    text: |-
      1 Indien het verzoek wordt gedaan gedurende het beroep tegen of het hoger beroep omtrent het schadeveroorzakende
      besluit, wordt het ingediend bij de bestuursrechter waarbij het beroep of het hoger beroep aanhangig is.

      2 In dat geval is [artikel 8:90, tweede lid][ref1], niet van toepassing.

      3 Indien het verzoek wordt gedaan in hoger beroep beslist de hogerberoepsrechter op het verzoek, tenzij hij het
      verzoek naar de rechtbank verwijst omdat het naar zijn oordeel behandeling door de rechtbank behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel890
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel891
