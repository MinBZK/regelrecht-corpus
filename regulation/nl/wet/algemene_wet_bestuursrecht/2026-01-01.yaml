  - number: 8:88
    text: |-
      1 De bestuursrechter is bevoegd op verzoek van een belanghebbende een bestuursorgaan te veroordelen tot vergoeding
      van schade die de belanghebbende lijdt of zal lijden als gevolg van:

      a. een onrechtmatig besluit;

      b. een andere onrechtmatige handeling ter voorbereiding van een onrechtmatig besluit;

      c. het niet tijdig nemen van een besluit;

      d. een andere onrechtmatige handeling van een bestuursorgaan waarbij een persoon als bedoeld in
      [artikel 8:2, eerste lid, onder a][ref1], zijn nagelaten betrekkingen of zijn rechtverkrijgenden belanghebbende
      zijn.

      2 Het eerste lid is niet van toepassing indien het besluit van beroep bij de bestuursrechter is uitgezonderd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel82
