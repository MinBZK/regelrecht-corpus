  - number: 7:28
    text: |-
      1 Voor de behandeling van het beroep is geen recht verschuldigd.

      2 De kosten, die de belanghebbende in verband met de behandeling van het beroep redelijkerwijs heeft moeten
      maken, worden door het bestuursorgaan uitsluitend vergoed op verzoek van de belanghebbende voor zover het
      bestreden besluit wordt herroepen wegens aan het bestuursorgaan te wijten onrechtmatigheid. In dat geval stelt het
      beroepsorgaan de vergoeding vast die het bestuursorgaan verschuldigd is.

      3 Indien aan de belanghebbende in verband met het beroep een toevoeging is verleend op grond van
      de [Wet op de rechtsbijstand][ref1], betaalt het bestuursorgaan de toe te kennen vergoeding aan de
      rechtsbijstandverlener. De rechtsbijstandverlener stelt de belanghebbende zoveel mogelijk schadeloos voor de
      door deze voldane eigen bijdrage. De rechtsbijstandverlener doet aan de Raad voor rechtsbijstand opgave van een
      kostenvergoeding door het bestuursorgaan.

      4 Het verzoek wordt gedaan voordat het beroepsorgaan op het beroep heeft beslist. Het beroepsorgaan beslist op het
      verzoek bij de beslissing op het beroep.

      5 Bij algemene maatregel van bestuur worden nadere regels gesteld over de kosten waarop de vergoeding uitsluitend
      betrekking kan hebben en over de wijze waarop het bedrag van de kosten wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006368
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel728
    references:
      - id: ref1
        bwb_id: BWBR0006368
  - number: 8:1
    text: Een belanghebbende kan tegen een besluit beroep instellen bij de bestuursrechter.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel81
  - number: 8:2
    text: |-
      1 Met een besluit wordt gelijkgesteld:

      a. een andere handeling van een bestuursorgaan waarbij een persoon met betrekking tot diens in
      [artikel 3 van de Ambtenarenwet 2017][ref1] bedoelde hoedanigheid, zijn nagelaten betrekkingen of zijn
      rechtverkrijgenden belanghebbende zijn,

      b. een andere publiekrechtelijke handeling van de Sociaal-Economische Raad.

      2 Met een besluit wordt gelijkgesteld de schriftelijke beslissing, inhoudende de weigering van de goedkeuring van:

      a. een besluit, inhoudende een algemeen verbindend voorschrift of een beleidsregel of de intrekking of de
      vaststelling van de inwerkingtreding van een algemeen verbindend voorschrift of een beleidsregel,

      b. een besluit ter voorbereiding van een privaatrechtelijke rechtshandeling.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel3
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '3'
  - number: 8:3
    text: |-
      1 Geen beroep kan worden ingesteld tegen een besluit:

      a. inhoudende een algemeen verbindend voorschrift of een beleidsregel,

      b. inhoudende de intrekking of de vaststelling van de inwerkingtreding van een algemeen verbindend voorschrift of
      een beleidsregel,

      c. inhoudende de goedkeuring van een besluit, inhoudende een algemeen verbindend voorschrift of een beleidsregel
      of de intrekking of de vaststelling van de inwerkingtreding van een algemeen verbindend voorschrift of een
      beleidsregel.

      2 Geen beroep kan worden ingesteld tegen een besluit ter voorbereiding van een privaatrechtelijke rechtshandeling.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel83
  - number: 8:4
    text: |-
      1 Geen beroep kan worden ingesteld tegen een besluit:

      a. inhoudende een weigering op grond van [artikel 2:15][ref1],

      b. inhoudende een aanmaning als bedoeld in [artikel 4:112][ref2] of een dwangbevel,

      c. als bedoeld in [artikel 7:1a, vierde lid][ref3], [7:10, tweede, derde of vierde lid][ref4], of
      [7:24, derde tot en met zesde lid][ref5],

      d. inhoudende schorsing of vernietiging van een besluit van een ander bestuursorgaan,

      e. als bedoeld in [artikel 3:20, onderdeel b][ref6], [3:21, derde lid][ref7], of
      [3:25, eerste lid, onderdeel h][ref8],

      f. inzake vergoeding van schade wegens onrechtmatig bestuurshandelen.

      2 Onverminderd [hoofdstuk 2][ref9] van de bij deze wet behorende Bevoegdheidsregeling bestuursrechtspraak kan geen
      beroep worden ingesteld tegen een besluit:

      a. op grond van een in enig wettelijk voorschrift voor het geval van buitengewone omstandigheden toegekende
      bevoegdheid of opgelegde verplichting in deze omstandigheden genomen,

      b. genomen op grond van een wettelijk voorschrift ter beveiliging van de militaire belangen van het Koninkrijk of
      zijn bondgenoten,

      c. genomen op grond van een wettelijk voorschrift inzake de verplichte krijgsdienst, voor zover het keuring,
      herkeuring, werkelijke dienst, groot verlof of diensteindiging betreft, tenzij het besluit betrekking heeft op
      verlenging van werkelijke dienst of kostwinnersvergoeding.

      3 Geen beroep kan worden ingesteld tegen een besluit:

      a. tot benoeming of aanstelling, tenzij beroep wordt ingesteld door een persoon met betrekking tot diens
      in [artikel 3 van de Ambtenarenwet 2017][ref10] bedoelde hoedanigheid, zijn nagelaten betrekkingen of zijn
      rechtverkrijgenden,

      b. inhoudende een beoordeling van het kennen of kunnen van een kandidaat of leerling die ter zake is geëxamineerd
      of op enigerlei andere wijze is getoetst, dan wel inhoudende de vaststelling van opgaven, beoordelingsnormen of
      nadere regels voor die examinering of toetsing,

      c. inhoudende een technische beoordeling van een voertuig of een luchtvaartuig, dan wel een meetmiddel, een
      onderdeel daarvan of een hulpinrichting daarvoor.

      4 Geen beroep kan worden ingesteld tegen een besluit:

      a. inzake de nummering van kandidatenlijsten, het verloop van de stemming, de stemopneming, de vaststelling van
      de stemwaarden en de vaststelling van de uitslag bij verkiezingen van de leden van vertegenwoordigende organen,
      de benoemdverklaring in opengevallen plaatsen, alsmede de toelating van nieuwe leden van provinciale staten, van
      het kiescollege voor de Eerste Kamer voor Nederlanders die geen ingezetenen zijn, van de gemeenteraad en van het
      algemeen bestuur van een waterschap, alsmede de verlening van tijdelijk ontslag wegens zwangerschap en bevalling
      of ziekte,

      b. houdende een ambtshandeling van een gerechtsdeurwaarder of notaris.


