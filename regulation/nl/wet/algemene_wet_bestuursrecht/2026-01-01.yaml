  - number: 4:12
    text: |-
      1 Het bestuursorgaan kan toepassing van de [artikelen 4:7][ref1] en [4:8][ref2] voorts achterwege laten bij een
      beschikking die strekt tot het vaststellen van een financiële verplichting of aanspraak indien:

      a. tegen die beschikking bezwaar kan worden gemaakt of administratief beroep kan worden ingesteld, en

      b. de nadelige gevolgen na bezwaar of administratief beroep volledig ongedaan kunnen worden gemaakt.

      2 Het eerste lid geldt niet bij een beschikking die strekt tot:

      a. het op grond van [artikel 4:35][ref3] of met toepassing van [artikel 4:51][ref4] weigeren van een subsidie;

      b. het op grond van [artikel 4:46, tweede lid][ref5], lager vaststellen van een subsidie, of

      c. het intrekken of ten nadele van de ontvanger wijzigen van een subsidieverlening of een subsidievaststelling.


