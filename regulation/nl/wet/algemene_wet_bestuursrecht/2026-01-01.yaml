        bwb_id: BWBR0005537
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 2:3
        hoofdstuk: '2'
        afdeling: '2.1'
  - number: 9:22
    text: |-
      De ombudsman is niet bevoegd een onderzoek in te stellen of voort te zetten indien het verzoek betrekking heeft op:

      a. een aangelegenheid die behoort tot het algemeen regeringsbeleid, daaronder begrepen het algemeen beleid ter
      handhaving van de rechtsorde, of tot het algemeen beleid van het betrokken bestuursorgaan;

      b. een algemeen verbindend voorschrift;

      c. een gedraging waartegen beklag kan worden gedaan of beroep kan worden ingesteld, tenzij die gedraging bestaat
      uit het niet tijdig nemen van een besluit, of waartegen een beklag- of beroepsprocedure aanhangig is;

      d. een gedraging ten aanzien waarvan door een bestuursrechter uitspraak is gedaan;

      e. een gedraging ten aanzien waarvan een procedure bij een andere rechterlijke instantie dan een bestuursrechter
      aanhangig is, dan wel beroep openstaat tegen een uitspraak die in een zodanige procedure is gedaan;

      f. een gedraging waarop de rechterlijke macht toeziet.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel922
  - number: 9:23
    text: |-
      De ombudsman is niet verplicht een onderzoek in te stellen of voort te zetten indien:

      a. het verzoekschrift niet voldoet aan de vereisten, bedoeld in [artikel 9:28, eerste en tweede lid][ref1];

      b. het verzoek kennelijk ongegrond is;

      c. het belang van de verzoeker bij een onderzoek door de ombudsman dan wel het gewicht van de gedraging kennelijk
      onvoldoende is;

      d. de verzoeker een ander is dan degene jegens wie de gedraging heeft plaatsgevonden;

      e. het verzoek betrekking heeft op een gedraging waartegen bezwaar kan worden gemaakt, tenzij die gedraging bestaat
      uit het niet tijdig nemen van een besluit, of waartegen een bezwaarprocedure aanhangig is;

      f. het verzoek betrekking heeft op een gedraging waartegen door de verzoeker bezwaar had kunnen worden gemaakt,
      beroep had kunnen worden ingesteld of beklag had kunnen worden gedaan;

      g. het verzoek betrekking heeft op een gedraging ten aanzien waarvan door een andere rechterlijke instantie dan een
      bestuursrechter uitspraak is gedaan;

      h. niet is voldaan aan het vereiste van [artikel 9:20, eerste lid][ref2];

      i. een verzoek, dezelfde gedraging betreffende, bij hem in behandeling is of – behoudens indien een nieuw feit of
      een nieuwe omstandigheid bekend is geworden en zulks tot een ander oordeel over de bedoelde gedraging zou hebben
      kunnen leiden – door hem is afgedaan;

      j. ten aanzien van een gedraging van het bestuursorgaan die nauw samenhangt met het onderwerp van het
      verzoekschrift een procedure aanhangig is bij een rechterlijke instantie, dan wel ingevolge bezwaar, administratief
      beroep of beklag bij een andere instantie;

      k. het verzoek betrekking heeft op een gedraging die nauw samenhangt met een onderwerp, dat door het instellen van
      een procedure aan het oordeel van een andere rechterlijke instantie dan een bestuursrechter onderworpen is;

      l. na tussenkomst van de ombudsman naar diens oordeel alsnog naar behoren aan de grieven van de verzoeker tegemoet
      is gekomen;

      m. het verzoek, dezelfde gedraging betreffende, ingevolge een wettelijk geregelde klachtvoorziening bij een
      onafhankelijke klachtinstantie niet zijnde een ombudsman in behandeling is of daardoor is afgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel928
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel920
