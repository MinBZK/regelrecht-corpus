      Bij een wijziging van een bijlage bij deze wet blijft de bijlage zoals deze luidde voor het tijdstip van
      inwerkingtreding van de wijziging van toepassing op het beroep of hoger beroep tegen een besluit dat,
      onderscheidenlijk een uitspraak die voor dat tijdstip is bekendgemaakt.
