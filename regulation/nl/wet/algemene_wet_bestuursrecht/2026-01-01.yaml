  - number: 8:51a
    text: |-
      1 De bestuursrechter kan het bestuursorgaan in de gelegenheid stellen een gebrek in het bestreden besluit te
      herstellen of te laten herstellen. De vorige volzin vindt geen toepassing, indien belanghebbenden die niet als
      partij aan het geding deelnemen daardoor onevenredig kunnen worden benadeeld.

      2 De bestuursrechter bepaalt de termijn waarbinnen het bestuursorgaan het gebrek kan herstellen. Hij kan deze
      termijn verlengen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel851a
  - number: 8:51b
    text: |-
      1 Het bestuursorgaan deelt de bestuursrechter zo spoedig mogelijk mede of het gebruik maakt van de gelegenheid om
      het gebrek te herstellen of te laten herstellen.

      2 Indien het bestuursorgaan overgaat tot herstel van het gebrek, deelt het de bestuursrechter zo spoedig mogelijk
      schriftelijk mede op welke wijze het gebrek is hersteld.

      3 Partijen kunnen binnen vier weken na verzending van de mededeling bedoeld in het tweede lid, schriftelijk hun
      zienswijze over de wijze waarop het gebrek is hersteld, naar voren brengen. De bestuursrechter kan deze termijn
      verlengen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel851b
  - number: 8:51c
    text: |-
      De bestuursrechter deelt partijen mede op welke wijze het beroep verder wordt behandeld binnen vier weken na:

      a. ontvangst van de mededeling van het bestuursorgaan dat het geen gebruik maakt van de gelegenheid om het gebrek
      te herstellen of te laten herstellen;

      b. het ongebruikt verstrijken van de termijn bedoeld in [artikel 8:51a, tweede lid][ref1];

      c. ontvangst van de zienswijzen; of

      d. het ongebruikt verstrijken van de termijn bedoeld in [artikel 8:51b, derde lid][ref2].


