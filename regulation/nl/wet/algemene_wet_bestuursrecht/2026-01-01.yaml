  - number: 9:9
    text: |-
      Aan degene op wiens gedraging de klacht betrekking heeft, wordt een afschrift van het klaagschrift alsmede van de
      daarbij meegezonden stukken toegezonden.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel99
  - number: 9:10
    text: |-
      1 Het bestuursorgaan stelt de klager en degene op wiens gedraging de klacht betrekking heeft, in de gelegenheid te
      worden gehoord.

      2 Van het horen van de klager kan worden afgezien indien:

      a. de klacht kennelijk ongegrond is,

      b. de klager heeft verklaard geen gebruik te willen maken van het recht te worden gehoord, of

      c. de klager niet binnen een door het bestuursorgaan gestelde redelijke termijn verklaart dat hij gebruik wil maken
      van het recht te worden gehoord.

      3 Van het horen wordt een verslag gemaakt.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel910
  - number: 9:11
    text: |-
      1 Het bestuursorgaan handelt de klacht af binnen zes weken of – indien [afdeling 9.1.3][ref1] van toepassing is –
      binnen tien weken na ontvangst van het klaagschrift.

      2 Het bestuursorgaan kan de afhandeling voor ten hoogste vier weken verdagen. Van de verdaging wordt schriftelijk
      mededeling gedaan aan de klager en aan degene op wiens gedraging de klacht betrekking heeft.

      3 Verder uitstel is mogelijk voor zover de klager daarmee schriftelijk instemt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel911
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '9'
        afdeling: 9.1.3
  - number: 9:12
    text: |-
      1 Het bestuursorgaan stelt de klager schriftelijk en gemotiveerd in kennis van de bevindingen van het onderzoek
      naar de klacht, zijn oordeel daarover alsmede van de eventuele conclusies die het daaraan verbindt.

      2 Bij de kennisgeving wordt vermeld bij welke ombudsman en binnen welke termijn de klager vervolgens een
      verzoekschrift kan indienen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel912
  - number: 9:12a
    text: |-
      Het bestuursorgaan draagt zorg voor registratie van de bij hem ingediende schriftelijke klachten. De geregistreerde
      klachten worden jaarlijks gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel912a
  - number: 9:13
    text: |-
      De in deze afdeling geregelde procedure voor de behandeling van klachten wordt in aanvulling op
      [afdeling 9.1.2][ref1] gevolgd indien dat bij wettelijk voorschrift of bij besluit van het bestuursorgaan is
      bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel913
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '9'
        afdeling: 9.1.2
  - number: 9:14
    text: |-
      1 Bij wettelijk voorschrift of bij besluit van het bestuursorgaan wordt een persoon of commissie belast met de
      behandeling van en de advisering over klachten.

      2 Het bestuursorgaan kan de persoon of commissie slechts in het algemeen instructies geven.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel914
  - number: 9:15
    text: |-
      1 Bij het bericht van ontvangst, bedoeld in [artikel 9:6][ref1], wordt vermeld dat een persoon of commissie over de
      klacht zal adviseren.

      2 Het horen geschiedt door de in [artikel 9:14][ref2] bedoelde persoon of commissie. Indien een commissie is
      ingesteld, kan deze het horen opdragen aan de voorzitter of een lid van de commissie.

      3 De persoon of commissie beslist over de toepassing van [artikel 9:10, tweede lid][ref3].

      4 De persoon of commissie zendt een rapport van bevindingen, vergezeld van het advies en eventuele aanbevelingen,
      aan het bestuursorgaan. Het rapport bevat het verslag van het horen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel96
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel914
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel910
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel915
