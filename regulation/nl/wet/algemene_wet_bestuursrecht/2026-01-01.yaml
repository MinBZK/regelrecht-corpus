  - number: 8:10
    text: |-
      1 De zaken die bij de rechtbank aanhangig worden gemaakt, worden in behandeling genomen door een enkelvoudige
      kamer.

      2 Indien een zaak naar het oordeel van de enkelvoudige kamer ongeschikt is voor behandeling door één rechter,
      verwijst zij deze naar een meervoudige kamer. De enkelvoudige kamer kan ook in andere gevallen een zaak naar een
      meervoudige kamer verwijzen.

      3 Indien een zaak naar het oordeel van de meervoudige kamer geschikt is voor verdere behandeling door één rechter,
      kan zij deze verwijzen naar een enkelvoudige kamer.

      4 Verwijzing kan geschieden in elke stand van het geding. Een verwezen zaak wordt voortgezet in de stand waarin zij
      zich bevindt.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel810
  - number: 8:10a
    text: |-
      1 De zaken die bij een andere bestuursrechter dan de rechtbank aanhangig worden gemaakt, worden in behandeling
      genomen door een meervoudige kamer.

      2 Indien een zaak naar het oordeel van de meervoudige kamer geschikt is voor verdere behandeling door één rechter,
      kan zij deze verwijzen naar een enkelvoudige kamer.

      3 Indien een zaak naar het oordeel van de enkelvoudige kamer ongeschikt is voor behandeling door één rechter,
      verwijst zij deze naar een meervoudige kamer.

      4 De meervoudige kamer kan een zaak voorts verwijzen naar een grote kamer, indien haar dit met het oog op de
      rechtseenheid of de rechtsontwikkeling geraden voorkomt. De eerste volzin geldt niet, indien de zaak aanhangig is
      bij een gerechtshof.

      5 Verwijzing kan geschieden in elke stand van het geding. Een verwezen zaak wordt voortgezet in de stand waarin zij
      zich bevindt.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel810a
  - number: 8:11
    text: |-
      1 De voorschriften omtrent de behandeling van het beroep zijn van toepassing op de behandeling door elk van de
      kamers, bedoeld in de [artikelen 8:10 ][ref1]en [8:10a][ref2].

      2 Degene die zitting heeft in een enkelvoudige kamer heeft tevens de bevoegdheden en de verplichtingen van de
      voorzitter.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel810
