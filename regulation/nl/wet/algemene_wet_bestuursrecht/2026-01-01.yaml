  - number: 8:119
    text: |-
      1 De bestuursrechter kan op verzoek van een partij een onherroepelijk geworden uitspraak herzien op grond van
      feiten of omstandigheden die:

      a. hebben plaatsgevonden vóór de uitspraak,

      b. bij de indiener van het verzoekschrift vóór de uitspraak niet bekend waren en redelijkerwijs niet bekend konden
      zijn, en

      c. waren zij bij de bestuursrechter eerder bekend geweest, tot een andere uitspraak zouden hebben kunnen leiden.

      2 [Hoofdstuk 6, titel 8.1][ref1], met uitzondering van [afdeling 8.1.1][ref2] en [artikel 8:13][ref3],
      [titel 8.2][ref4], met uitzondering van [artikel 8:41, tweede lid][ref5], [titel 8.3][ref6] en [titel 8.5][ref7],
      met uitzondering van [artikel 8:109][ref8], zijn voor zover nodig van overeenkomstige toepassing.

      3 Het griffierecht is gelijk aan het griffierecht dat ten tijde van de indiening van het verzoek verschuldigd zou
      zijn geweest voor het beroep of hoger beroep dat heeft geleid tot de uitspraak waarvan herziening wordt gevraagd.

      4 Indien de uitspraak wordt herzien, betaalt de griffier het griffierecht terug.


