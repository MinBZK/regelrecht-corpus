  - number: 8:23
    text: |-
      1 Een bestuursorgaan dat een college is, wordt in het geding vertegenwoordigd door een of meer door het
      bestuursorgaan aangewezen leden.

      2 De Kroon wordt in het geding vertegenwoordigd door Onze Minister wie het aangaat onderscheidenlijk door een of
      meer van Onze Ministers wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel823
  - number: 8:24
    text: |-
      1 Partijen kunnen zich laten bijstaan of door een gemachtigde laten vertegenwoordigen.

      2 De bestuursrechter kan van een gemachtigde een schriftelijke machtiging verlangen.

      3 Het tweede lid is niet van toepassing ten aanzien van advocaten.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel824
  - number: 8:25
    text: |-
      1 De bestuursrechter kan bijstand of vertegenwoordiging door een persoon tegen wie ernstige bezwaren bestaan,
      weigeren.

      2 De betrokken partij en de in het eerste lid bedoelde persoon worden onverwijld in kennis gesteld van de weigering
      en de reden daarvoor.

      3 Het eerste lid is niet van toepassing ten aanzien van advocaten.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel825
  - number: 8:26
    text: |-
      1 De bestuursrechter kan tot de sluiting van het onderzoek ter zitting ambtshalve, op verzoek van een partij of op
      hun eigen verzoek, belanghebbenden in de gelegenheid stellen als partij aan het geding deel te nemen.

      2 Indien de bestuursrechter vermoedt dat er onbekende belanghebbenden zijn, kan hij in de *Staatscourant* doen
      aankondigen dat een zaak bij hem aanhangig is. Naast de aankondiging in de *Staatscourant* kan ook een ander middel
      voor de aankondiging worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel826
  - number: 8:27
    text: |-
      1 Partijen die door de bestuursrechter zijn opgeroepen om in persoon dan wel in persoon of bij gemachtigde
      te verschijnen, al dan niet voor het geven van inlichtingen, zijn verplicht te verschijnen en de verlangde
      inlichtingen te geven. Partijen worden hierop gewezen, alsmede op [artikel 8:31][ref1].

      2 Indien het een rechtspersoon betreft of een bestuursorgaan dat een college is, kan de bestuursrechter een of meer
      bepaalde bestuurders onderscheidenlijk een of meer bepaalde leden oproepen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel831
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel827
