  - number: 8:12
    text: |-
      De bestuursrechter kan aan een rechter-commissaris opdragen het vooronderzoek of een gedeelte daarvan te
      verrichten.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel812
  - number: 8:12a
    text: |-
      1 De voorzitter van de Afdeling bestuursrechtspraak van de Raad van State, de president van de Centrale Raad van
      Beroep en de president van het College van Beroep voor het bedrijfsleven kunnen in zaken die bij hun college in
      behandeling zijn bij een meervoudige of grote kamer, een lid van het desbetreffende college verzoeken een conclusie
      te nemen.

      2 Een dergelijk verzoek kan ook worden gericht aan een lid van een van de andere colleges in overeenstemming met de
      voorzitter onderscheidenlijk de president van dat college.

      3 De conclusie wordt schriftelijk genomen, is met redenen omkleed en vermeldt:

      a. de naam van degene die haar heeft genomen en

      b. de dag waarop zij is genomen.

      4 De conclusie wordt uiterlijk zes weken na sluiting van het onderzoek ter zitting ter kennis van het college
      gebracht en in afschrift aan partijen toegezonden. Aan [artikel 8:64][ref1] behoeft daarbij geen toepassing te
      worden gegeven.

      5 Partijen kunnen binnen twee weken na verzending van het afschrift van de conclusie hun schriftelijk commentaar
      daarop aan het college doen toekomen.

      6 [Artikel 8:79, tweede lid][ref2], is van overeenkomstige toepassing.

      7 Degene die de conclusie heeft genomen, neemt geen deel aan de beraadslagingen over de zaak.

      8 De conclusie bindt het college niet.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel864
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel879
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel812a
