  - number: 7:15
    text: |-
      1 Voor de behandeling van het bezwaar is geen recht verschuldigd.

      2 De kosten, die de belanghebbende in verband met de behandeling van het bezwaar redelijkerwijs heeft moeten
      maken, worden door het bestuursorgaan uitsluitend vergoed op verzoek van de belanghebbende voor zover het bestreden
      besluit wordt herroepen wegens aan het bestuursorgaan te wijten onrechtmatigheid.

      3 Het verzoek wordt gedaan voordat het bestuursorgaan op het bezwaar heeft beslist. Het bestuursorgaan beslist op
      het verzoek bij de beslissing op het bezwaar.

      4 Bij algemene maatregel van bestuur worden nadere regels gesteld over de kosten waarop de vergoeding uitsluitend
      betrekking kan hebben en over de wijze waarop het bedrag van de kosten wordt vastgesteld.

      5 Indien aan de belanghebbende in verband met het bezwaar een toevoeging is verleend op grond van
      de [Wet op de rechtsbijstand][ref1], betaalt het bestuursorgaan de toe te kennen vergoeding aan de
      rechtsbijstandverlener. De rechtsbijstandverlener stelt de belanghebbende zoveel mogelijk schadeloos voor de
      door deze voldane eigen bijdrage. De rechtsbijstandverlener doet aan de Raad voor rechtsbijstand opgave van een
      kostenvergoeding door het bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006368
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel715
    references:
      - id: ref1
        bwb_id: BWBR0006368
  - number: 7:16
    text: |-
      1 Voordat een beroepsorgaan op het beroep beslist, stelt het belanghebbenden in de gelegenheid te worden gehoord.

      2 Het beroepsorgaan stelt daarvan in ieder geval de indiener van het beroepschrift op de hoogte, alsmede het
      bestuursorgaan dat het besluit heeft genomen en de belanghebbenden die bij de voorbereiding van het besluit of bij
      de behandeling van het bezwaarschrift hun zienswijze naar voren hebben gebracht.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel716
