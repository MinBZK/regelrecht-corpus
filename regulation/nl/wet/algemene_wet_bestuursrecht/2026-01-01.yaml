  - number: 4:44
    text: |-
      1 Indien een beschikking tot subsidieverlening is gegeven, dient de subsidie-ontvanger na afloop van de
      activiteiten of het tijdvak waarvoor de subsidie is verleend een aanvraag tot vaststelling van de subsidie in,
      tenzij:

      a. de subsidie met toepassing van [artikel 4:47, onderdeel ][ref1], ambtshalve wordt vastgesteld;

      b. bij wettelijk voorschrift of bij de subsidieverlening is bepaald dat de aanvraag wordt ingediend telkens na
      afloop van een gedeelte van het tijdvak waarvoor de subsidie is verleend, of

      c. de vaststelling van de subsidie bij een overeenkomst als bedoeld in [artikel 4:36, eerste lid][ref2], anders
      is geregeld.

      2 Indien bij wettelijk voorschrift geen termijn is bepaald, wordt de aanvraag tot vaststelling ingediend binnen een
      bij de subsidieverlening te bepalen termijn.

      3 Indien voor de indiening van de aanvraag tot vaststelling geen termijn is bepaald of de aanvraag na afloop van de
      daarvoor bepaalde termijn niet is ingediend kan het bestuursorgaan de subsidie-ontvanger een termijn stellen binnen
      welke de aanvraag moet zijn ingediend.

      4 Indien na afloop van deze termijn geen aanvraag is ingediend, kan de subsidie ambtshalve worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel447
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel436
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel444
