  - number: 2:24
    text: |-
      Indien een bericht met toepassing van [artikel 2:16, eerste lid, onder a][ref1], wordt behandeld, vangt een
      bij wettelijk voorschrift bepaalde behandeltermijn aan op het tijdstip van interne doorgeleiding, mits het
      bestuursorgaan de afzender onverwijld mededeling doet van de doorgeleiding en het tijdstip waarop de termijn
      aanvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel216
