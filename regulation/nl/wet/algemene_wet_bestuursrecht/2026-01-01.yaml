      2 Hierbij wordt vermeld door wie, binnen welke termijn en bij welk orgaan bezwaar kan worden gemaakt of beroep kan
      worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel345
  - number: 3:46
    text: Een besluit dient te berusten op een deugdelijke motivering.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel346
  - number: 3:47
    text: |-
      1 De motivering wordt vermeld bij de bekendmaking van het besluit.

      2 Daarbij wordt zo mogelijk vermeld krachtens welk wettelijk voorschrift het besluit wordt genomen.

      3 Indien de motivering in verband met de vereiste spoed niet aanstonds bij de bekendmaking van het besluit kan
      worden vermeld, verstrekt het bestuursorgaan deze binnen een week na de bekendmaking.

      4 In dat geval zijn de [artikelen 3:41 tot en met 3:43][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel341
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel347
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 3:41
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: 3:48
    text: |-
      1 De vermelding van de motivering kan achterwege blijven indien redelijkerwijs kan worden aangenomen dat daaraan
      geen behoefte bestaat.

      2 Verzoekt een belanghebbende binnen een redelijke termijn om de motivering, dan wordt deze zo spoedig mogelijk
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel348
  - number: 3:49
    text: |-
      Ter motivering van een besluit of een onderdeel daarvan kan worden volstaan met een verwijzing naar een met het oog
      daarop uitgebracht advies, indien het advies zelf de motivering bevat en van het advies kennis is of wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel349
  - number: 3:50
    text: |-
      Indien het bestuursorgaan een besluit neemt dat afwijkt van een met het oog daarop krachtens wettelijk voorschrift
      uitgebracht advies, wordt zulks met de redenen voor de afwijking in de motivering vermeld.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel350
  - number: 4:1
    text: |-
      Tenzij bij wettelijk voorschrift anders is bepaald, wordt de aanvraag tot het geven van een beschikking
      schriftelijk ingediend bij het bestuursorgaan dat bevoegd is op de aanvraag te beslissen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel41
  - number: 4:2
    text: |-
      1 De aanvraag wordt ondertekend en bevat ten minste:

      a. de naam en het adres van de aanvrager;

      b. de dagtekening;

      c. een aanduiding van de beschikking die wordt gevraagd.

      2 De aanvrager verschaft voorts de gegevens en bescheiden die voor de beslissing op de aanvraag nodig zijn en
      waarover hij redelijkerwijs de beschikking kan krijgen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel42
  - number: 4:3
    text: |-
      1 De aanvrager kan weigeren gegevens en bescheiden te verschaffen voor zover het belang daarvan voor de beslissing
      van het bestuursorgaan niet opweegt tegen het belang van de eerbiediging van de persoonlijke levenssfeer, met
      inbegrip van de bescherming van medische en psychologische onderzoeksresultaten, of tegen het belang van de
      bescherming van bedrijfs- en fabricagegegevens.

      2 Het eerste lid is niet van toepassing op bij wettelijk voorschrift aangewezen gegevens en bescheiden waarvan is
      bepaald dat deze dienen te worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel43
  - number: 4:4
    text: |-
      1 Het bestuursorgaan dat bevoegd is op de aanvraag te beslissen, kan voor het indienen van aanvragen en het
      verstrekken van gegevens een formulier vaststellen, voor zover daarin niet is voorzien bij wettelijk voorschrift.

      2 In het formulier worden geen gegevens gevraagd die voor de te nemen beschikking niet noodzakelijk zijn, tenzij
      wordt vermeld dat de verstrekking van die gegevens niet verplicht is.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel44
  - number: 4:5
    text: |-
      1 Het bestuursorgaan kan besluiten de aanvraag niet te behandelen, indien:

      a. de aanvrager niet heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van de aanvraag, of

      b. de aanvraag geheel of gedeeltelijk is geweigerd op grond van [artikel 2:15][ref1], of

      c. de verstrekte gegevens en bescheiden onvoldoende zijn voor de beoordeling van de aanvraag of voor de
      voorbereiding van de beschikking,

      mits de aanvrager de gelegenheid heeft gehad de aanvraag binnen een door het bestuursorgaan gestelde termijn aan
      te vullen.

      2 Indien de aanvraag of een van de daarbij behorende gegevens of bescheiden in een vreemde taal is gesteld en een
      vertaling daarvan voor de beoordeling van de aanvraag of voor de voorbereiding van de beschikking noodzakelijk
      is, kan het bestuursorgaan besluiten de aanvraag niet te behandelen, mits de aanvrager de gelegenheid heeft gehad
      binnen een door het bestuursorgaan gestelde termijn de aanvraag met een vertaling aan te vullen.

      3 Indien de aanvraag of een van de daarbij behorende gegevens of bescheiden omvangrijk of ingewikkeld is en een
      samenvatting voor de beoordeling van de aanvraag of voor de voorbereiding van de beschikking noodzakelijk is, kan
      het bestuursorgaan besluiten de aanvraag niet te behandelen, mits de aanvrager de gelegenheid heeft gehad binnen
      een door het bestuursorgaan gestelde termijn de aanvraag met een samenvatting aan te vullen.

      4 Een besluit om de aanvraag niet te behandelen wordt aan de aanvrager bekendgemaakt binnen vier weken nadat de
      aanvraag is aangevuld of nadat de daarvoor gestelde termijn ongebruikt is verstreken.

      5 Het bestuursorgaan kan afzien van het bieden van de gelegenheid het verzuim te herstellen, indien het toepassing
      geeft aan [artikel 2:16, eerste lid, aanhef][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel215
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel216
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel45
