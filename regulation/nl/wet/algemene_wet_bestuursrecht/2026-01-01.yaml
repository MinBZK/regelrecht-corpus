  - number: B2:9
    text: |-
      Tegen een uitspraak van de rechtbank of van de voorzieningenrechter omtrent een besluit, genomen op grond van een
      in dit artikel genoemd voorschrift of anderszins in dit artikel omschreven, kan hoger beroep worden ingesteld bij
      de Centrale Raad van Beroep.

      De volgende besluiten:

      a. een besluit over een gehandicaptenparkeerkaart als bedoeld in
      [hoofdstuk IV van het Besluit administratieve bepalingen][ref1] inzake het wegverkeer

      b. een op grond van een gemeentelijke verordening of gemeenschappelijke regeling genomen besluit over een
      gehandicaptenparkeerkaart

      c. een besluit over een gehandicaptenparkeerplaats voor een bepaald voertuig

      [Algemene Kinderbijslagwet][ref2]

      [Algemene nabestaandenwet][ref3]

      [Algemene Ouderdomswet][ref4]

      [Burgerlijk Wetboek: Boek 7, artikel 673e][ref5]

      [Kaderwet SZW-subsidies][ref6], voor zover het betreft een algemene maatregel van bestuur of een ministeriële
      regeling op grond van [artikel 9 ][ref7]

      [Liquidatiewet Ongevallenwetten][ref8],met uitzondering van [artikel 24, eerste lid][ref9]

      [Participatiewet][ref10], met uitzondering van de [artikelen 52][ref11], [76, eerste en tweede lid][ref12], en
      [81][ref13] en [paragraaf 6.5][ref14]

      [Tijdelijke wet beperking inkomensgevolgen arbeidsongeschiktheidscriteria][ref15]

      [Tijdelijke wet pilot loondispensatie][ref16]

      [Toeslagenwet][ref17]

      [Werkloosheidswet][ref18]

      [Wet arbeid en zorg][ref19]: [hoofdstuk 3, afdeling 2][ref20], en de [artikelen 4:2b][ref21] en [6:3][ref22]

      [ Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref23]

      [Wet arbeidsongeschiktheidsvoorziening militairen ][ref24]

      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref25]

      [Wet financiering sociale verzekeringen][ref26], voor zover het betreft een besluit van de Sociale verzekeringsbank
      of het Uitvoeringsinstituut werknemersverzekeringen

      [Wet hersteloperatie toeslagen][ref27]: [Artikelen 3.6][ref28], [3.7][ref29], [3.8][ref30], [3.10][ref31] met
      uitzondering van kwijtschelding die ziet op vorderingen die verband houden met de inning van de eigen bijdrage als
      bedoeld in [artikel 2.1.4b van de Wet maatschappelijke ondersteuning 2015][ref32] en [artikel 3.11][ref33]

      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref34]

      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref35]

      [Wet inkomensvoorziening oudere werklozen ][ref36]

      [Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref37]: een besluit van het
      Uitvoeringsinstituut werknemersverzekeringen op grond van [artikel 2.3][ref38]

      [Wet langdurige zorg][ref39], met uitzondering van:

      a. besluiten van Onze Minister van Volksgezondheid, Welzijn en Sport

      b. besluiten van een met het toezicht belaste ambtenaar, en

      c. een beschikking op grond van [artikel 11.4.1][ref40] of [11.4.2][ref41]

      [Wet maatschappelijke ondersteuning 2015][ref42]: [artikel 3a.1.1][ref43]

      [Wet milieubeheer][ref44]: [artikel 15.50][ref45]

      [Wet op de arbeidsongeschiktheidsverzekering][ref46]

      [Wet overheidspersoneel onder de werknemersverzekeringen][ref47]

      [Wet overige OCW-subsidies][ref48]: [artikel 19a][ref49]

      Wet sociale werkvoorziening

      [Wet structuur uitvoeringsorganisatie werk en inkomen][ref50], met uitzondering van [artikel 9, vijfde lid][ref51]

      [Wet terugdringing beroep op de arbeidsongeschiktheidsregelingen][ref52]

      [Wet werk en inkomen naar arbeidsvermogen][ref53]

      [Ziektewet][ref54]

      [Zorgverzekeringswet][ref55]: de [artikelen 9b][ref56], [9c][ref57], [18f][ref58], [18g][ref59], [68b][ref60],
      [69][ref61] en [70][ref62], behalve voor zover op grond van artikel 18f, eerste lid, in samenhang met
      [artikel 18d][ref63] of [18e][ref64], een besluit is genomen over de verschuldigdheid van de bestuursrechtelijke
      premie of de hoogte daarvan


