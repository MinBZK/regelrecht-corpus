      1 Indien tegen de met toepassing van [artikel 8:54][ref1] gedane uitspraak verzet wordt gedaan, beslist de
      bestuursrechter daarover binnen zes weken.

      2 [Artikel 8:55, derde lid][ref2], is niet van toepassing.

      3 Indien het verzet gegrond is, beslist de bestuursrechter zo spoedig mogelijk op het beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel854
