  - number: 8:85
    text: |-
      1 De voorzieningenrechter kan in zijn uitspraak bepalen wanneer de voorlopige voorziening vervalt.

      2 De voorlopige voorziening vervalt in ieder geval zodra:

      a. de termijn voor het instellen van beroep bij de bestuursrechter tegen het besluit dat op bezwaar of in
      administratief beroep is genomen, ongebruikt is verstreken,

      b. het bezwaar of het beroep is ingetrokken, of

      c. de bestuursrechter uitspraak heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel885
  - number: 8:86
    text: |-
      1 Indien het verzoek wordt gedaan indien beroep bij de bestuursrechter is ingesteld en de voorzieningenrechter van
      oordeel is dat na de zitting, bedoeld in [artikel 8:83, eerste lid][ref1], nader onderzoek redelijkerwijs niet kan
      bijdragen aan de beoordeling van de zaak, kan hij onmiddellijk uitspraak doen in de hoofdzaak.

      2 Indien de bestuursrechter in eerste en hoogste aanleg uitspraak doet, kan het eerste lid slechts worden toegepast
      indien partijen daarvoor toestemming hebben gegeven.

      3 Partijen worden in de uitnodiging, bedoeld in [artikel 8:83, eerste lid][ref2], gewezen op de bevoegdheid,
      bedoeld in het eerste lid, en indien de bestuursrechter in eerste en hoogste aanleg uitspraak doet, tevens op de
      voorwaarde, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel883
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel883
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel886
