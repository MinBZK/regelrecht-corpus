  - number: 8:55
    text: |-
      1 Tegen de uitspraak, bedoeld in [artikel 8:54, tweede lid][ref1], kunnen een belanghebbende en het bestuursorgaan
      verzet doen bij de bestuursrechter.

      2 De [artikelen 6:4, derde lid][ref2], [6:5 tot en met 6:9][ref3], [6:11][ref4], [6:14][ref5], [6:15][ref6],
      [6:17][ref7] en [6:21][ref8] zijn van overeenkomstige toepassing.

      3 Indien bij wet de werking van een uitspraak wordt opgeschort totdat de termijn voor het instellen van hoger
      beroep is verstreken of, indien hoger beroep is ingesteld, op het hoger beroep is beslist, wordt de werking van de
      uitspraak, bedoeld in [artikel 8:54, tweede lid][ref9], op overeenkomstige wijze opgeschort.

      4 Alvorens uitspraak te doen op het verzet, stelt de bestuursrechter de indiener van het verzetschrift die daarom
      heeft gevraagd, in de gelegenheid op een zitting te worden gehoord, tenzij hij van oordeel is dat het verzet
      gegrond is. In andere gevallen kan de bestuursrechter de indiener in de gelegenheid stellen op een zitting te
      worden gehoord.

      5 De bestuursrechter kan ook de andere partijen in de gelegenheid stellen op de zitting, bedoeld in het vierde lid,
      te worden gehoord.

      6 Indien de uitspraak waartegen verzet is gedaan, is gedaan door een meervoudige kamer, wordt uitspraak op het
      verzet gedaan door een meervoudige kamer. Van de kamer die uitspraak doet op het verzet maakt geen deel uit degene
      die zitting heeft gehad in de kamer die de uitspraak heeft gedaan waartegen verzet is gedaan.

      7 De uitspraak strekt tot:

      a. niet-ontvankelijkverklaring van het verzet,

      b. ongegrondverklaring van het verzet, of

      c. gegrondverklaring van het verzet.

      8 Indien de bestuursrechter het verzet niet-ontvankelijk of ongegrond verklaart, blijft de uitspraak waartegen
      verzet was gedaan in stand.

      9 Indien de bestuursrechter het verzet gegrond verklaart, vervalt de uitspraak waartegen verzet was gedaan en wordt
      het onderzoek voortgezet in de stand waarin het zich bevond.

      10 Indien de bestuursrechter het verzet gegrond verklaart, kan hij tevens uitspraak doen op het beroep, mits:

      a. nader onderzoek redelijkerwijs niet kan bijdragen aan de beoordeling van de zaak, en

      b. de partijen in de gelegenheid zijn gesteld op een zitting te worden gehoord en daarbij zijn gewezen op de
      bevoegdheid om tevens uitspraak te doen op het beroep.


