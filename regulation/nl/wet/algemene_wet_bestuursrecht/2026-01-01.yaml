  - number: 8:22
    text: |-
      1 In geval van faillissement of surséance van betaling of toepassing van de schuldsaneringsregeling natuurlijke
      personen zijn de [artikelen 25][ref1], [27][ref2] en [31 van de Faillissementswet][ref3] van overeenkomstige
      toepassing.

      2 De [artikelen 25, tweede lid][ref4], en [27][ref5] vinden geen toepassing, indien partijen vóór de
      faillietverklaring zijn uitgenodigd om op een zitting van de bestuursrechter te verschijnen.


