  - number: 8:28a
    text: |-
      1 Indien het beroep is ingesteld tegen een bestuurlijke boete is, in afwijking van de [artikelen 8:27][ref1]
      en [8:28][ref2], de partij aan wie de bestuurlijke boete is opgelegd, niet verplicht omtrent de overtreding
      verklaringen af te leggen.

      2 Voor de bestuursrechter deze partij verhoort, deelt hij haar mede dat zij niet verplicht is tot antwoorden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel827
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel828
