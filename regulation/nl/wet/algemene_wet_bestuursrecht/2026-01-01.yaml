      1 Totdat partijen zijn uitgenodigd om op een zitting van de bestuursrechter te verschijnen, kan de bestuursrechter
      het onderzoek sluiten, indien voortzetting van het onderzoek niet nodig is, omdat het bestuursorgaan kennelijk ten
      onrechte heeft ingestemd met rechtstreeks beroep bij de bestuursrechter.

      2 In dat geval strekt de uitspraak ertoe dat het bestuursorgaan het beroepschrift als bezwaarschrift behandelt.
      [Artikel 7:10][ref1] is van overeenkomstige toepassing.


