  - number: 8:13
    text: |-
      1 De rechtbank kan een bij haar aanhangig gemaakte zaak ter verdere behandeling verwijzen naar de rechtbank waar
      een andere zaak aanhangig is gemaakt, indien naar haar oordeel behandeling van die zaken door één rechtbank gewenst
      is.

      2 Een verzoek tot verwijzing kan worden gedaan tot de aanvang van het onderzoek ter zitting.

      3 Indien de rechtbank waarnaar een zaak is verwezen, instemt met de verwijzing, worden de op de zaak betrekking
      hebbende stukken aan haar ter beschikking gesteld.

      4 Het eerste tot en met derde lid zijn van overeenkomstige toepassing indien beroep in eerste aanleg kan worden
      ingesteld bij een gerechtshof.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel813
  - number: 8:14
    text: |-
      1 De bestuursrechter kan zaken over hetzelfde of een verwant onderwerp ter behandeling voegen en de behandeling van
      gevoegde zaken splitsen.

      2 Een verzoek daartoe kan worden gedaan tot de sluiting van het onderzoek ter zitting.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel814
  - number: 8:15
    text: |-
      Op verzoek van een partij kan elk van de rechters die een zaak behandelen, worden gewraakt op grond van feiten of
      omstandigheden waardoor de rechterlijke onpartijdigheid schade zou kunnen lijden.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel815
  - number: 8:16
    text: |-
      1 Het verzoek wordt gedaan zodra de feiten of omstandigheden aan de verzoeker bekend zijn geworden.

      2 Het verzoek geschiedt schriftelijk en is gemotiveerd. Na de aanvang van het onderzoek ter zitting
      onderscheidenlijk na de aanvang van het horen van partijen of getuigen in het vooronderzoek kan het ook mondeling
      geschieden.

      3 Alle feiten of omstandigheden moeten tegelijk worden voorgedragen.

      4 Een volgend verzoek om wraking van dezelfde rechter wordt niet in behandeling genomen, tenzij feiten of
      omstandigheden worden voorgedragen die pas na het eerdere verzoek aan de verzoeker bekend zijn geworden.

      5 Geschiedt het verzoek ter zitting, dan wordt het onderzoek ter zitting geschorst. De rechter wiens wraking is
      verzocht, onthoudt zich van het verder behandelen van de zaak, waaronder begrepen het nemen van beslissingen,
      tenzij dit geen uitstel duldt.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel816
  - number: 8:17
    text: Een rechter wiens wraking is verzocht, kan in de wraking berusten.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel817
  - number: 8:18
    text: |-
      1 Het verzoek om wraking wordt zo spoedig mogelijk ter zitting behandeld door een meervoudige kamer waarin de
      rechter wiens wraking is verzocht, geen zitting heeft.

      2 De verzoeker en de rechter wiens wraking is verzocht, worden in de gelegenheid gesteld te worden gehoord. De
      meervoudige kamer kan ambtshalve of op verzoek van de verzoeker of de rechter wiens wraking is verzocht, bepalen
      dat zij niet in elkaars aanwezigheid zullen worden gehoord.

      3 Indien het verzoek kennelijk niet-ontvankelijk of kennelijk ongegrond is, kan de meervoudige kamer zonder
      toepassing te geven aan het eerste en tweede lid beslissen het verzoek zonder behandeling ter zitting af te doen.

      4 De meervoudige kamer beslist zo spoedig mogelijk. De meervoudige kamer spreekt de beslissing in het openbaar uit.
      De beslissing is gemotiveerd en wordt onverwijld aan de verzoeker, de andere partijen en de rechter wiens wraking
      was verzocht medegedeeld.

      5 In geval van misbruik kan de meervoudige kamer bepalen dat een volgend verzoek niet in behandeling wordt genomen.
      Hiervan wordt in de beslissing melding gemaakt.

      6 Tegen de beslissing staat geen rechtsmiddel open.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel818
  - number: 8:19
    text: |-
      1 Op grond van feiten of omstandigheden als bedoeld in [artikel 8:15][ref1] kan elk van de rechters die een zaak
      behandelen, verzoeken zich te mogen verschonen.

      2 Het verzoek geschiedt schriftelijk en is gemotiveerd. Na de aanvang van het onderzoek ter zitting,
      onderscheidenlijk na de aanvang van het horen van partijen of getuigen in het vooronderzoek kan het ook mondeling
      geschieden.

      3 Geschiedt het verzoek ter zitting, dan wordt het onderzoek ter zitting geschorst.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel815
