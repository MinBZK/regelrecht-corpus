  - number: 8:80b
    text: |-
      1 De bestuursrechter kan de tussenuitspraak ook doen voordat partijen zijn uitgenodigd om op een zitting van de
      bestuursrechter te verschijnen.

      2 De bestuursrechter kan de tussenuitspraak ook mondeling doen. [Artikel 8:67, tweede tot en met vijfde lid][ref1],
      is van overeenkomstige toepassing.

      3 De bestuursrechter kan zo nodig een voorlopige voorziening treffen. In dat geval bepaalt hij wanneer de
      voorlopige voorziening vervalt.

      4 De voorlopige voorziening als bedoeld in het derde lid, vervalt in ieder geval zodra:

      a. het beroep is ingetrokken; of

      b. de bestuursrechter uitspraak als bedoeld in [artikel 8:66, eerste lid][ref2], heeft gedaan, tenzij bij die
      uitspraak een ander tijdstip is bepaald.


