  - number: 8:38
    text: |-
      1 Indien de griffier een bij aangetekende brief verzonden stuk terug ontvangt en hem blijkt dat de geadresseerde op
      de dag van verzending of uiterlijk een week daarna in de basisregistratie personen stond ingeschreven op het op het
      stuk vermelde adres, dan verzendt hij het stuk zo spoedig mogelijk bij gewone brief.

      2 In de overige gevallen waarin de griffier een bij aangetekende brief verzonden stuk terug ontvangt, verbetert
      hij, indien mogelijk, het op het stuk vermelde adres en verzendt hij het stuk opnieuw bij aangetekende brief.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel838
  - number: 8:39
    text: |-
      1 De griffier zendt de op de zaak betrekking hebbende stukken zo spoedig mogelijk aan partijen, voor zover de
      bestuursrechter niet op grond van de [artikelen 8:29][ref1] of [8:32][ref2] anders heeft beslist of tenzij het de
      stukken betreft waarvan op grond van de [Wet open overheid][ref3] om openbaarmaking of verstrekking is verzocht.

      2 De griffier kan de toezending van zeer omvangrijke stukken of van stukken die bezwaarlijk kunnen worden
      vermenigvuldigd, achterwege laten. Hij stelt partijen daarvan in kennis en vermeldt daarbij dat deze stukken
      gedurende een door hem te bepalen termijn van ten minste een week ter griffie ter inzage worden gelegd.

      3 Partijen kunnen afschriften van of uittreksels uit de in het tweede lid bedoelde stukken verkrijgen. Met
      betrekking tot de kosten is het bij en krachtens de [Wet tarieven in strafzaken][ref4] bepaalde van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel829
