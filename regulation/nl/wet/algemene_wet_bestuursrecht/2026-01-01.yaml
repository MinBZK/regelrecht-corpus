preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat ingevolge artikel 107, tweede lid, van de Grondwet de wet algemene
    regels van bestuursrecht dient vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#ArtikelAanhef
articles:
  - number: 1:1
    text: |-
      1 Onder bestuursorgaan wordt verstaan:

      a. een orgaan van een rechtspersoon die krachtens publiekrecht is ingesteld, of

      b. een ander persoon of college, met enig openbaar gezag bekleed.

      2 De volgende organen, personen en colleges worden niet als bestuursorgaan aangemerkt:

      a. de wetgevende macht;

      b. de kamers en de verenigde vergadering der Staten-Generaal;

      c. onafhankelijke, bij de wet ingestelde organen die met rechtspraak zijn belast, alsmede de Raad voor de
      rechtspraak en het College van afgevaardigden;

      d. de Raad van State en zijn afdelingen;

      e. de Algemene Rekenkamer;

      f. de Nationale ombudsman en de substituut-ombudsmannen als bedoeld in
      [artikel 9, eerste lid, van de Wet Nationale ombudsman][ref1], en ombudsmannen en ombudscommissies als bedoeld in
      [artikel 9:17, onderdeel b][ref2];

      g. de voorzitters, leden, griffiers en secretarissen van de in de onderdelen *b* tot en met *f* bedoelde organen,
      de procureur-generaal, de plaatsvervangend procureur-generaal en de advocaten-generaal bij de Hoge Raad, de
      besturen van de in onderdeel c bedoelde organen alsmede de voorzitters van die besturen, alsmede de commissies uit
      het midden van de in de onderdelen *b* tot en met *f* bedoelde organen;

      h. de commissie van toezicht op de inlichtingen- en veiligheidsdiensten en haar afdelingen, bedoeld in
      [artikel 97 van de Wet op de inlichtingen- en veiligheidsdiensten 2017][ref3];

      i. de toetsingscommissie inzet bevoegdheden, bedoeld in
      [artikel 32 van de Wet op de inlichtingen- en veiligheidsdiensten 2017][ref4].

      3 Een ingevolge het tweede lid uitgezonderd orgaan, persoon of college wordt wel als bestuursorgaan aangemerkt voor
      zover het orgaan, de persoon of het college besluiten neemt of handelingen verricht ten aanzien van een persoon
      met betrekking tot diens in [artikel 3 van de Ambtenarenwet 2017][ref5] bedoelde hoedanigheid, zijn nagelaten
      betrekkingen of zijn rechtverkrijgenden, met uitzondering van een voor het leven benoemde ambtenaar werkzaam bij de
      Raad van State en zijn afdelingen en de Algemene Rekenkamer.

      4 De vermogensrechtelijke gevolgen van een handeling van een bestuursorgaan treffen de rechtspersoon waartoe het
      bestuursorgaan behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel9
