  - number: B2:10
    text: |-
      Tegen een uitspraak van de rechtbank of van de voorzieningenrechter omtrent een besluit, genomen op grond van
      een in dit artikel genoemd voorschrift of anderszins in dit artikel omschreven, kan eveneens hoger beroep worden
      ingesteld bij de Centrale Raad van Beroep.

      Algemene wet bestuursrecht: [artikel 4:126][ref1], voor zover het besluit betrekking heeft op schade, veroorzaakt
      door een besluit op grond van een ander voorschrift, genoemd in artikel 9 of 10 van deze Bevoegdheidsregeling
      bestuursrechtspraak, of door een handeling ter uitvoering van een zodanig besluit

      Een besluit waarbij een persoon met betrekking tot diens in [artikel 3 van de Ambtenarenwet 2017][ref2] bedoelde
      hoedanigheid, zijn nagelaten betrekkingen of zijn rechtverkrijgenden belanghebbende zijn.

