  - number: 2:25
    text: |-
      Indien het bestuursorgaan gebruikmaakt van een systeem voor gegevensverwerking waarin de geadresseerde toegang
      heeft tot het bericht, rust op het bestuursorgaan de bewijslast inzake de ontvangst van aan het bestuursorgaan
      gezonden berichten en de verzending van aan de geadresseerde gezonden berichten, alsmede inzake gegevens over de
      kennisneming van deze berichten door de geadresseerde. De afzender of de geadresseerde wordt desgevraagd afschrift
      van deze gegevens verstrekt.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel225
  - number: 2:26
    text: |-
      1 Bij algemene maatregel van bestuur kan tijdelijk worden afgeweken van het bepaalde bij of krachtens deze
      afdeling, voor zover dat nodig is wegens nieuwe technische ontwikkelingen. Indien daarbij wordt afgeweken van in
      deze afdeling geboden waarborgen, wordt een gelijkwaardig alternatief opgenomen.

      2 Bij toepassing van het eerste lid wordt in ieder geval geregeld van welke bepaling of bepalingen, door welke
      bestuursorganen of belanghebbenden, op welke wijze en gedurende welke periode wordt afgeweken.

      3 De voordracht voor de algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp
      aan beide Kamers der Staten-Generaal is overgelegd.

      4 Onze Minister zendt ten minste twaalf maanden voor het einde van de werkingsduur van de algemene maatregel van
      bestuur aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van de toepassing van de nieuwe
      ontwikkelingen in relatie tot elektronisch bestuurlijk verkeer, alsmede een standpunt inzake de voortzetting anders
      dan bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel226
  - number: 2:27
    text: |-
      Bij regeling van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kunnen regels worden gesteld over
      het bewaren en vernietigen van berichten die zijn verzonden via een voorziening voor elektronisch berichtenverkeer
      en informatieverschaffing als bedoeld in [artikel 5, eerste lid, onder f, van de Wet digitale overheid][ref1],
      waaronder regels inzake de termijn waarbinnen berichten ten minste en ten hoogste worden bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0048156#Artikel5
