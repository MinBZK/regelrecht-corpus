  - number: 4:45
    text: |-
      1 Bij de aanvraag tot subsidievaststelling toont de aanvrager aan dat de activiteiten hebben plaatsgevonden
      overeenkomstig de aan de subsidie verbonden verplichtingen, tenzij de subsidie voor de aanvang van de activiteiten
      wordt vastgesteld.

      2 Bij de aanvraag tot subsidievaststelling legt de aanvrager rekening en verantwoording af omtrent de aan de
      activiteiten verbonden uitgaven en inkomsten, voor zover deze voor de vaststelling van de subsidie van belang zijn.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel445
  - number: 4:46
    text: |-
      1 Indien een beschikking tot subsidieverlening is gegeven, stelt het bestuursorgaan de subsidie overeenkomstig de
      subsidieverlening vast.

      2 De subsidie kan lager worden vastgesteld indien:

      a. de activiteiten waarvoor subsidie is verleend niet of niet geheel hebben plaatsgevonden;

      b. de subsidie-ontvanger niet heeft voldaan aan de aan de subsidie verbonden verplichtingen;

      c. de subsidie-ontvanger onjuiste of onvolledige gegevens heeft verstrekt en de verstrekking van juiste of
      volledige gegevens tot een andere beschikking op de aanvraag tot subsidieverlening zou hebben geleid, of

      d. de subsidieverlening anderszins onjuist was en de subsidie-ontvanger dit wist of behoorde te weten.

      3 Voor zover het bedrag van de subsidie afhankelijk is van de werkelijke kosten van de activiteiten waarvoor
      subsidie is verleend, worden kosten die in redelijkheid niet als noodzakelijk kunnen worden beschouwd bij de
      vaststelling van de subsidie niet in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel446
  - number: 4:47
    text: |-
      Het bestuursorgaan kan de subsidie geheel of gedeeltelijk ambtshalve vaststellen, indien:

      a. bij wettelijk voorschrift of bij de subsidieverlening een termijn is bepaald binnen welke de subsidie ambtshalve
      wordt vastgesteld;

      b. toepassing wordt gegeven aan [artikel 4:44, vierde lid][ref1], of

      c. de beschikking tot subsidieverlening of de beschikking tot subsidievaststelling wordt ingetrokken of ten nadele
      van de ontvanger wordt gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel444
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel447
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:44
        hoofdstuk: '4'
        afdeling: 4.2.5
  - number: 4:48
    text: |-
      1 Zolang de subsidie niet is vastgesteld kan het bestuursorgaan de subsidieverlening intrekken of ten nadele van de
      subsidie-ontvanger wijzigen, indien:

      a. de activiteiten waarvoor subsidie is verleend niet of niet geheel hebben plaatsgevonden of zullen plaatsvinden;

      b. de subsidie-ontvanger niet heeft voldaan aan de aan de subsidie verbonden verplichtingen;

      c. de subsidie-ontvanger onjuiste of onvolledige gegevens heeft verstrekt en de verstrekking van juiste of
      volledige gegevens tot een andere beschikking op de aanvraag tot subsidieverlening zou hebben geleid;

      d. de subsidieverlening anderszins onjuist was en de subsidie-ontvanger dit wist of behoorde te weten, of

      e. met toepassing van [artikel 4:34, vijfde lid][ref1], een beroep wordt gedaan op de voorwaarde dat voldoende
      gelden ter beschikking worden gesteld.

      2 De intrekking of wijziging werkt terug tot en met het tijdstip waarop de subsidie is verleend, tenzij bij de
      intrekking of wijziging anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel434
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel448
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:34
        hoofdstuk: '4'
        afdeling: 4.2.3
  - number: 4:49
    text: |-
      1 Het bestuursorgaan kan de subsidievaststelling intrekken of ten nadele van de ontvanger wijzigen:

      a. op grond van feiten of omstandigheden waarvan het bij de subsidievaststelling redelijkerwijs niet op de hoogte
      kon zijn en op grond waarvan de subsidie lager dan overeenkomstig de subsidieverlening zou zijn vastgesteld;

      b. indien de subsidievaststelling onjuist was en de subsidie-ontvanger dit wist of behoorde te weten, of

      c. indien de subsidie-ontvanger na de subsidievaststelling niet heeft voldaan aan aan de subsidie verbonden
      verplichtingen.

      2 De intrekking of wijziging werkt terug tot en met het tijdstip waarop de subsidie is vastgesteld, tenzij bij de
      intrekking of wijziging anders is bepaald.

      3 De subsidievaststelling kan niet meer worden ingetrokken of ten nadele van de ontvanger worden gewijzigd indien
      vijf jaren zijn verstreken sedert de dag waarop zij is bekendgemaakt dan wel, in het geval, bedoeld in het eerste
      lid, onderdeel *c*, sedert de dag waarop de handeling in strijd met de verplichting is verricht of de dag waarop
      aan de verplichting had moeten zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel449
  - number: 4:50
    text: |-
      1 Zolang de subsidie niet is vastgesteld kan het bestuursorgaan de subsidieverlening met inachtneming van een
      redelijke termijn intrekken of ten nadele van de subsidie-ontvanger wijzigen:

      a. voor zover de subsidieverlening onjuist is;

      b. voor zover veranderde omstandigheden of gewijzigde inzichten zich in overwegende mate tegen voortzetting of
      ongewijzigde voortzetting van de subsidie verzetten, of

      c. in andere bij wettelijk voorschrift geregelde gevallen.

      2 Bij intrekking of wijziging op grond van het eerste lid, onderdeel *a* of *b*, vergoedt het bestuursorgaan de
      schade die de subsidie-ontvanger lijdt doordat hij in vertrouwen op de subsidie anders heeft gehandeld dan hij
      zonder subsidie zou hebben gedaan.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel450
  - number: 4:51
    text: |-
      1 Indien aan een subsidie-ontvanger voor drie of meer achtereenvolgende jaren subsidie is verstrekt voor dezelfde
      of in hoofdzaak dezelfde voortdurende activiteiten, geschiedt gehele of gedeeltelijke weigering van de subsidie
      voor een daarop aansluitend tijdvak op de grond, dat veranderde omstandigheden of gewijzigde inzichten zich tegen
      voortzetting of ongewijzigde voortzetting van de subsidie verzetten, slechts met inachtneming van een redelijke
      termijn.

      2 Voor zover aan het einde van het tijdvak waarvoor subsidie is verleend sedert de bekendmaking van het voornemen
      tot weigering voor een daarop aansluitend tijdvak nog geen redelijke termijn is verstreken, wordt de subsidie voor
      het resterende deel van die termijn verleend, zo nodig in afwijking van [artikel 4:25, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel425
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel451
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:25
        hoofdstuk: '4'
        afdeling: 4.2.2
  - number: 4:52
    text: |-
      1 Het subsidiebedrag wordt overeenkomstig de subsidievaststelling betaald.

      2 Indien de subsidie niet op een wettelijk voorschrift berust, kan bij de subsidieverlening, of, indien geen
      beschikking tot subsidieverlening is gegeven, bij de subsidievaststelling een van [artikel 4:87, eerste lid][ref1],
      afwijkende termijn voor de betaling van het subsidiebedrag worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel487
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel452
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:87
        hoofdstuk: '4'
        afdeling: 4.4.1
  - number: 4:53
    text: |-
      1 Het subsidiebedrag kan in gedeelten worden betaald, mits bij wettelijk voorschrift is bepaald hoe de gedeelten
      worden berekend en op welke tijdstippen zij worden betaald.

      2 Indien de subsidie niet op een wettelijk voorschrift berust, kan het subsidiebedrag in gedeelten worden
      betaald, mits bij de subsidieverlening, of indien geen beschikking tot subsidieverlening is gegeven, bij de
      subsidievaststelling, is bepaald hoe de gedeelten worden berekend en op welke tijdstippen zij worden betaald.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel453
  - number: 4:56
    text: |-
      De verplichting tot betaling van een subsidiebedrag of een voorschot wordt opgeschort met ingang van de dag waarop
      het bestuursorgaan aan de subsidie-ontvanger schriftelijk kennis geeft van het ernstige vermoeden dat er grond
      bestaat om toepassing te geven aan [artikel 4:48][ref1] of [4:49][ref2], tot en met de dag waarop de beschikking
      omtrent de intrekking of wijziging is bekendgemaakt of de dag waarop sedert de kennisgeving van het ernstige
      vermoeden dertien weken zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel448
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel449
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel456
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:48
        hoofdstuk: '4'
        afdeling: 4.2.6
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:49
        hoofdstuk: '4'
        afdeling: 4.2.6
  - number: 4:57
    text: |-
      1 Het bestuursorgaan kan onverschuldigd betaalde subsidiebedragen terugvorderen.

      2 Het bestuursorgaan kan het terug te vorderen bedrag bij dwangbevel invorderen.

      3 Het bestuursorgaan kan het terug te vorderen bedrag verrekenen met een aan dezelfde subsidie-ontvanger voor
      dezelfde activiteiten verstrekte subsidie voor een ander tijdvak.

      4 Terugvordering van een subsidiebedrag of een voorschot vindt niet plaats voor zover na de dag waarop de
      subsidie is vastgesteld, dan wel de handeling, bedoeld in [artikel 4:49, eerste lid, onderdeel c][ref1], heeft
      plaatsgevonden, vijf jaren zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel449
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel457
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:49
        hoofdstuk: '4'
        afdeling: 4.2.6
  - number: 4:58
    text: |-
      1 Deze afdeling is van toepassing op per boekjaar verstrekte subsidies, indien dat bij wettelijk voorschrift of bij
      besluit van het bestuursorgaan is bepaald.

      2 Bij algemene maatregel van bestuur kan worden bepaald dat deze afdeling van toepassing is op daarbij aangewezen
      subsidies.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel458
  - number: 4:59
    text: |-
      1 Het bestuursorgaan dat met toepassing van deze afdeling een subsidie verleent kan een of meer toezichthouders
      aanwijzen die zijn belast met het toezicht op de naleving van de aan de ontvanger van die subsidie opgelegde
      verplichtingen.

      2 De toezichthouder beschikt niet over de bevoegdheden, vermeld in de [artikelen 5:18][ref1] en [5:19][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel518
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel519
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel459
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 5:18
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 5:19
        hoofdstuk: '5'
  - number: 4:60
    text: |-
      Tenzij bij wettelijk voorschrift anders is bepaald, wordt de aanvraag van de subsidie uiterlijk dertien weken voor
      de aanvang van het boekjaar ingediend.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel460
  - number: 4:61
    text: |-
      1 De aanvraag van de subsidie gaat in ieder geval vergezeld van:

      a. een activiteitenplan, tenzij redelijkerwijs kan worden aangenomen dat daaraan geen behoefte is, en

      b. een begroting, tenzij deze voor de berekening van het bedrag van de subsidie niet van belang is.

      2 Indien de aanvrager beschikt over een egalisatiereserve als bedoeld in [artikel 4:72][ref1], vermeldt de aanvraag
      de omvang daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel472
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel461
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:72
        hoofdstuk: '4'
        paragraaf: 4.2.8.4
        afdeling: 4.2.8
  - number: 4:62
    text: |-
      Het activiteitenplan behelst een overzicht van de activiteiten waarvoor subsidie wordt gevraagd en de daarmee
      nagestreefde doelstellingen en vermeldt per activiteit de daarvoor benodigde personele en materiële middelen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel462
  - number: 4:63
    text: |-
      1 De begroting behelst een overzicht van de voor het boekjaar geraamde inkomsten en uitgaven van de aanvrager, voor
      zover deze betrekking hebben op de activiteiten waarvoor subsidie wordt gevraagd.

      2 De begrotingsposten worden ieder afzonderlijk van een toelichting voorzien.

      3 Tenzij voor de activiteiten waarop de aanvraag betrekking heeft nog niet eerder subsidie werd verstrekt, behelst
      de begroting een vergelijking met de begroting van het lopende boekjaar en de gerealiseerde inkomsten en uitgaven
      van het jaar, voorafgaand aan het lopende boekjaar.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel463
  - number: 4:64
    text: |-
      1 Tenzij de aanvraag wordt ingediend door een krachtens publiekrecht ingestelde rechtspersoon, gaat deze, indien
      voor het jaar voorafgaand aan het subsidiejaar geen subsidie werd aangevraagd, voorts vergezeld van:

      a. een afschrift van de oprichtingsakte van de rechtspersoon dan wel van de statuten zoals deze laatstelijk zijn
      gewijzigd, en

      b. de laatst opgemaakte jaarrekening als bedoeld in [artikel 361 van Boek 2 van het Burgerlijk Wetboek][ref1] dan
      wel de balans en de staat van baten en lasten en de toelichting daarop of, indien deze bescheiden ontbreken, een
      verslag over de financiële positie van de aanvrager op het moment van de aanvraag.

      2 De in het eerste lid, onderdeel b, bedoelde bescheiden dan wel het verslag over
      de financiële positie zijn voorzien van een van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2] afkomstige schriftelijke verklaring omtrent
      de getrouwheid onderscheidenlijk een mededeling, inhoudende dat van onjuistheden niet is gebleken.

      3 Bij wettelijk voorschrift of bij besluit van het bestuursorgaan kan vrijstelling of ontheffing worden verleend
      van het in het tweede lid bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel361
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel464
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '361'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 4:65
    text: |-
      Voor zover de aanvrager voor dezelfde begrote uitgaven tevens subsidie heeft aangevraagd bij een of meer andere
      bestuursorganen, doet hij daarvan mededeling in de aanvraag, onder vermelding van de stand van zaken met betrekking
      tot de beoordeling van die aanvraag of aanvragen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel465
  - number: 4:66
    text: De subsidie wordt slechts verleend aan een rechtspersoon met volledige rechtsbevoegdheid.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel466
  - number: 4:67
    text: |-
      1 De subsidie wordt voor een boekjaar of voor een bepaald aantal boekjaren verleend.

      2 Indien de subsidie voor twee of meer boekjaren wordt verleend, wordt aan de subsidie de verplichting verbonden
      tot het periodiek aan het bestuursorgaan verstrekken van de gegevens die voor de vaststelling van de subsidie van
      belang zijn.

      3 De beschikking tot subsidieverlening vermeldt welke gegevens de subsidie-ontvanger krachtens het tweede lid moet
      verstrekken, alsmede op welke tijdstippen de gegevens moeten worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel467
  - number: 4:68
    text: |-
      Tenzij bij wettelijk voorschrift of bij de subsidieverlening anders is bepaald, stelt de subsidie-ontvanger het
      boekjaar gelijk aan het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel468
  - number: 4:69
    text: |-
      1 De subsidie-ontvanger voert een zodanig ingerichte administratie, dat daaruit te allen tijde de voor de
      vaststelling van de subsidie van belang zijnde rechten en verplichtingen alsmede de betalingen en de ontvangsten
      kunnen worden nagegaan.

      2 De administratie en de daartoe behorende bescheiden worden gedurende zeven jaren bewaard.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel469
  - number: 4:70
    text: |-
      Indien gedurende het boekjaar aanmerkelijke verschillen ontstaan of dreigen te ontstaan tussen de werkelijke
      uitgaven en inkomsten en de begrote uitgaven en inkomsten doet de subsidie-ontvanger daarvan onverwijld mededeling
      aan het bestuursorgaan onder vermelding van de oorzaak van de verschillen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel470
  - number: 4:71
    text: |-
      1 Indien dit bij wettelijk voorschrift of bij de subsidieverlening is bepaald, behoeft de subsidie-ontvanger de
      toestemming van het bestuursorgaan voor:

      a. het oprichten van dan wel deelnemen in een rechtspersoon;

      b. het wijzigen van de statuten;

      c. het in eigendom verwerven, het vervreemden of het bezwaren van registergoederen, indien zij mede zijn verworven
      door middel van de subsidiegelden, dan wel de lasten daarvoor mede worden bekostigd uit de subsidiegelden;

      d. het aangaan en beëindigen van overeenkomsten tot verkrijging, vervreemding of bezwaring van registergoederen of
      tot huur, verhuur of pacht daarvan, indien deze goederen geheel of gedeeltelijk zijn verworven door middel van de
      subsidie dan wel de uitgaven daarvoor mede zijn bekostigd uit de subsidie;

      e. het aangaan van kredietovereenkomsten en van overeenkomsten van geldlening;

      f. het aangaan van overeenkomsten waarbij de subsidie-ontvanger zich verbindt tot zekerheidsstelling met inbegrip
      van zekerheidsstelling voor schulden van derden of waarbij hij zich als borg of hoofdelijk medeschuldenaar verbindt
      of zich voor een derde sterk maakt;

      g. het vormen van fondsen en reserveringen;

      h. het vaststellen of wijzigen van tarieven voor door de subsidie-ontvanger in de gewone uitoefening van zijn
      gesubsidieerde activiteiten te verrichten prestaties;

      i. het ontbinden van de rechtspersoon;

      j. het doen van aangifte tot zijn faillissement of het aanvragen van zijn surséance van betaling.

      2 Het bestuursorgaan beslist binnen vier weken omtrent de toestemming.

      3 De beslissing kan eenmaal voor ten hoogste vier weken worden verdaagd.

      4 [Paragraaf 4.1.3.3][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel471
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '4'
        paragraaf: 4.1.3.3
        afdeling: 4.1.3
  - number: 4:72
    text: |-
      1 Indien dit bij wettelijk voorschrift of bij de subsidieverlening is bepaald, vormt de ontvanger een
      egalisatiereserve.

      2 Het verschil tussen de vastgestelde subsidie en de werkelijke kosten van de activiteiten waarvoor subsidie werd
      verleend komt ten gunste onderscheidenlijk ten laste van de egalisatiereserve.

      3 De egalisatiereserve wordt zo hoog rentend en zo veilig als redelijkerwijs mogelijk is belegd.

      4 De van de egalisatiereserve genoten rente wordt aan de egalisatiereserve toegevoegd.

      5 In de gevallen bedoeld in [artikel 4:41, tweede lid, onderdelen c, d en e][ref1], is de subsidie-ontvanger
      ter zake van de egalisatiereserve vergoedingsplichtig naar evenredigheid van de mate waarin de subsidie aan de
      egalisatiereserve heeft bijgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel441
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel472
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:41
        hoofdstuk: '4'
        afdeling: 4.2.4
  - number: 4:73
    text: De subsidie wordt per boekjaar vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel473
  - number: 4:74
    text: |-
      De subsidie-ontvanger dient binnen zes maanden na afloop van het boekjaar een aanvraag tot vaststelling
      van de subsidie in, tenzij bij wettelijk voorschrift anders is bepaald of de subsidie met toepassing van
      [artikel 4:67, tweede lid][ref1], voor twee of meer boekjaren is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel467
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel474
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:67
        hoofdstuk: '4'
        paragraaf: 4.2.8.3
        afdeling: 4.2.8
  - number: 4:75
    text: |-
      1 De aanvraag tot vaststelling gaat in ieder geval vergezeld van een financieel verslag en een activiteitenverslag.

      2 Indien de subsidie-ontvanger ingevolge wettelijk voorschrift verplicht is tot het opstellen van een
      jaarrekening als bedoeld in [artikel 361 van Boek 2 van het Burgerlijk Wetboek][ref1], of indien dit bij de
      subsidieverlening is bepaald, legt hij in plaats van het financieel verslag de jaarrekening over, onverminderd
      [artikel 4:45, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel361
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel445
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel475
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '361'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:45
        hoofdstuk: '4'
        afdeling: 4.2.5
  - number: 4:76
    text: |-
      1 Indien de subsidie-ontvanger zijn inkomsten geheel ontleent aan de subsidie omvat het financiële verslag de
      balans en de exploitatierekening met de toelichting en zijn het tweede tot en met vijfde lid van toepassing.

      2 Het financiële verslag geeft volgens normen die in het maatschappelijk verkeer als aanvaardbaar worden beschouwd,
      een zodanig inzicht dat een verantwoord oordeel kan worden gevormd omtrent:

      a. het vermogen en het exploitatiesaldo, en

      b. voor zover de aard van het financiële verslag dat toelaat, omtrent de solvabiliteit en de liquiditeit van de
      subsidie-ontvanger.

      3 De balans met de toelichting geeft getrouw, duidelijk en stelselmatig de grootte en de samenstelling in actief-
      en passiefposten van het vermogen op het einde van het boekjaar weer.

      4 De exploitatierekening met de toelichting geeft getrouw, duidelijk en stelselmatig de grootte van het
      exploitatiesaldo van het boekjaar weer.

      5 Het financiële verslag sluit aan op de begroting waarvoor subsidie is verleend en behelst een vergelijking met de
      gerealiseerde inkomsten en uitgaven van het jaar, voorafgaand aan het boekjaar.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel476
  - number: 4:77
    text: |-
      Indien de subsidie-ontvanger zijn inkomsten in overwegende mate ontleent aan de subsidie kan bij wettelijk
      voorschrift of bij de subsidieverlening worden bepaald dat [artikel 4:76][ref1] van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel476
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel477
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:76
        hoofdstuk: '4'
        paragraaf: 4.2.8.5
        afdeling: 4.2.8
  - number: 4:78
    text: |-
      1 De subsidie-ontvanger geeft opdracht tot onderzoek van het financiële verslag aan een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].

      2 De accountant onderzoekt of het financiële verslag voldoet aan de bij of krachtens de wet gestelde voorschriften
      en of het activiteitenverslag, voor zover hij dat verslag kan beoordelen, met het financiële verslag verenigbaar
      is.

      3 De accountant geeft de uitslag van zijn onderzoek weer in een schriftelijke verklaring omtrent de getrouwheid van
      het financiële verslag.

      4 De aanvraag tot vaststelling van de subsidie gaat vergezeld van de in het derde lid bedoelde verklaring.

      5 Bij wettelijk voorschrift of bij de subsidieverlening kan vrijstelling of ontheffing worden verleend van het
      eerste tot en met het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel478
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 4:79
    text: |-
      1 Bij wettelijk voorschrift of bij de subsidieverlening kan worden bepaald dat de in
      [artikel 4:78, eerste lid][ref1], bedoelde opdracht tevens strekt tot onderzoek van de naleving van aan de subsidie
      verbonden verplichtingen.

      2 Bij toepassing van het eerste lid gaat de opdracht vergezeld van een bij of krachtens wettelijk voorschrift of
      bij de subsidieverlening vast te stellen aanwijzing over de reikwijdte en de intensiteit van de controle.

      3 Bij toepassing van het eerste lid, gaat het financiële verslag tevens vergezeld van een schriftelijke verklaring
      van de accountant over de naleving door de subsidie-ontvanger van de aan de subsidie verbonden verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel478
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel479
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:78
        hoofdstuk: '4'
        paragraaf: 4.2.8.5
        afdeling: 4.2.8
  - number: 4:80
    text: |-
      Het activiteitenverslag beschrijft de aard en omvang van de activiteiten waarvoor subsidie werd verleend en bevat
      een vergelijking tussen de nagestreefde en de gerealiseerde doelstellingen en een toelichting op de verschillen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel480
  - number: 4:81
    text: |-
      1 Een bestuursorgaan kan beleidsregels vaststellen met betrekking tot een hem toekomende of onder zijn
      verantwoordelijkheid uitgeoefende, dan wel door hem gedelegeerde bevoegdheid.

      2 In andere gevallen kan een bestuursorgaan slechts beleidsregels vaststellen, voor zover dit bij wettelijk
      voorschrift is bepaald.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel481
  - number: 4:82
    text: |-
      Ter motivering van een besluit kan slechts worden volstaan met een verwijzing naar een vaste gedragslijn voor zover
      deze is neergelegd in een beleidsregel.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel482
  - number: 4:83
    text: |-
      Bij de bekendmaking van het besluit, inhoudende een beleidsregel, wordt zo mogelijk het wettelijk voorschrift
      vermeld waaruit de bevoegdheid waarop het besluit, inhoudende een beleidsregel, betrekking heeft voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel483
  - number: 4:84
    text: |-
      Het bestuursorgaan handelt overeenkomstig de beleidsregel, tenzij dat voor een of meer belanghebbenden gevolgen
      zou hebben die wegens bijzondere omstandigheden onevenredig zijn in verhouding tot de met de beleidsregel te dienen
      doelen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel484
  - number: 4:85
    text: |-
      1 Deze titel is van toepassing op geldschulden die voortvloeien uit:

      a. een wettelijk voorschrift dat een verplichting tot betaling uitsluitend aan of door een bestuursorgaan regelt,
      of

      b. een besluit dat vatbaar is voor bezwaar of beroep.

      2 Deze titel is niet van toepassing op verplichtingen tot betaling van een geldsom voor het in behandeling nemen
      van een aanvraag.

      3 Deze titel is niet van toepassing op verplichtingen tot betaling die bij uitspraak van de bestuursrechter zijn
      opgelegd.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel485
  - number: 4:86
    text: |-
      1 De verplichting tot betaling van een geldsom wordt bij beschikking vastgesteld.

      2 De beschikking vermeldt in ieder geval:

      a. de te betalen geldsom;

      b. de termijn waarbinnen de betaling moet plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel486
  - number: 4:87
    text: |-
      1 De betaling geschiedt binnen zes weken nadat de beschikking op de voorgeschreven wijze is bekendgemaakt, tenzij
      de beschikking een later tijdstip vermeldt.

      2 Bij of krachtens wettelijk voorschrift kan een andere termijn voor de betaling worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel487
  - number: 4:88
    text: |-
      1 Bij wettelijk voorschrift kan worden bepaald dat een geldsom moet worden betaald zonder dat dit bij beschikking
      is vastgesteld.

      2 In dat geval wordt tevens bepaald binnen welke termijn de betaling moet plaatsvinden.

      3 Indien de belanghebbende binnen redelijke termijn daarom verzoekt wordt de op het bestuursorgaan rustende
      verplichting tot betaling zo spoedig mogelijk alsnog bij beschikking vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel488
  - number: 4:89
    text: |-
      1 Tenzij bij wettelijk voorschrift anders is bepaald, geschiedt betaling door bijschrijving op een daartoe door de
      schuldeiser bestemde bankrekening.

      2 Betaling geschiedt in euro, tenzij bij wettelijk voorschrift of bij besluit van het bestuursorgaan anders is
      bepaald.

      3 Betaling door bijschrijving op een bankrekening geschiedt op het tijdstip waarop de rekening van de schuldeiser
      wordt gecrediteerd.

      4 Bij wettelijk voorschrift kan worden bepaald dat betaling aan een ander dan de schuldeiser geschiedt.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel489
  - number: 4:90
    text: |-
      1 Indien girale betaling naar het oordeel van het bestuursorgaan bezwaarlijk is, kan het betaling in andere vorm
      ontvangen of verrichten.

      2 De schuldeiser is verplicht voor iedere contante betaling een kwitantie af te geven, tenzij bij wettelijk
      voorschrift anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel490
  - number: 4:91
    text: |-
      1 De kosten van betaling komen ten laste van de schuldenaar.

      2 Indien een bestuursorgaan betaalt aan een schuldeiser buiten de Europese Unie, kunnen de daaraan verbonden kosten
      op het te betalen bedrag in mindering worden gebracht, tenzij bij wettelijk voorschrift anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel491
  - number: 4:92
    text: |-
      1 Betaling ter voldoening van een bepaalde geldschuld strekt in de eerste plaats tot mindering van de kosten,
      vervolgens tot mindering van de verschenen rente en ten slotte tot mindering van de hoofdsom en de lopende rente.

      2 Indien een schuldenaar verschillende geldschulden heeft bij dezelfde schuldeiser, kan de schuldenaar bij de
      betaling de geldschuld aanwijzen waaraan de betaling moet worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel492
  - number: 4:93
    text: |-
      1 Verrekening van een geldschuld met een bestaande vordering geschiedt slechts voor zover in de bevoegdheid daartoe
      bij wettelijk voorschrift is voorzien.

      2 Verrekening geschiedt onder vermelding van de vordering waarmee de geldschuld is verrekend alsmede de hoogte van
      het bedrag van de verrekening.

      3 De verrekening werkt terug overeenkomstig
      [artikel 129, eerste en tweede lid, van Boek 6 van het Burgerlijk Wetboek][ref1].

      4 De schuldenaar is niet bevoegd tot verrekening voor zover beslag op de vordering van de schuldeiser nietig zou
      zijn.

      5 Uitstel van betaling staat aan verrekening niet in de weg.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel129
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel493
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '129'
  - number: 4:94
    text: |-
      1 Het bestuursorgaan kan de wederpartij uitstel van betaling verlenen.

      2 Gedurende het uitstel kan het bestuursorgaan niet aanmanen of invorderen.

      3 De beschikking tot uitstel van betaling vermeldt de termijn waarvoor het uitstel geldt.

      4 Het bestuursorgaan kan aan de beschikking tot uitstel van betaling voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel494
  - number: 4:94a
    text: |-
      Tenzij bij wettelijk voorschrift anders is bepaald, kan een bestuursorgaan een geldschuld geheel of gedeeltelijk
      kwijtschelden indien de nadelige gevolgen van de invordering onevenredig zijn in verhouding tot de met de
      invordering te dienen doelen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel494a
  - number: 4:95
    text: |-
      1 Het bestuursorgaan kan vooruitlopend op de vaststelling van een verplichting tot betaling van een geldsom
      een voorschot verlenen indien redelijkerwijs kan worden aangenomen dat een verplichting tot betaling zal worden
      vastgesteld, tenzij bij wettelijk voorschrift anders is bepaald.

      2 In de beschikking tot verlening van een voorschot kan, in afwijking van
      [artikel 4:86, tweede lid, onderdeel a][ref1], worden volstaan met de vermelding van de wijze waarop het bedrag van
      het voorschot wordt bepaald.

      3 Bij de beschikking tot verlening van een voorschot kan een van [artikel 4:87, eerste lid][ref2], afwijkende
      termijn voor de betaling van het voorschot worden vastgesteld.

      4 Betaalde voorschotten worden verrekend met de te betalen geldsom. Onverschuldigd betaalde voorschotten kunnen
      worden teruggevorderd.

      5 Het bestuursorgaan kan het terug te vorderen voorschot bij dwangbevel invorderen voor zover deze bevoegdheid ook
      ten aanzien van de terugvordering van de hoofdsom is toegekend.

      6 Het bestuursorgaan kan aan de beschikking tot verlening van een voorschot voorschriften verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel486
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel487
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel495
