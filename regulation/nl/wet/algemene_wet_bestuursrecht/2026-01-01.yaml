      - id: ref3
        bwb_id: BWBR0004581
        hoofdstuk: VIII
  - number: 1:5
    text: |-
      1 Onder het maken van bezwaar wordt verstaan: het gebruik maken van de ingevolge een wettelijk voorschrift
      bestaande bevoegdheid, voorziening tegen een besluit te vragen bij het bestuursorgaan dat het besluit heeft
      genomen.

      2 Onder het instellen van administratief beroep wordt verstaan: het gebruik maken van de ingevolge een wettelijk
      voorschrift bestaande bevoegdheid, voorziening tegen een besluit te vragen bij een ander bestuursorgaan dan hetwelk
      het besluit heeft genomen.

      3 Onder het instellen van beroep wordt verstaan: het instellen van administratief beroep, dan wel van beroep bij
      een bestuursrechter.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel15
  - number: 1:6
    text: |-
      De [hoofdstukken 2 tot en met 8][ref1] en [10][ref2] van deze wet zijn niet van toepassing op:

      a. de opsporing en vervolging van strafbare feiten, alsmede de tenuitvoerlegging van strafrechtelijke beslissingen;

      b. de tenuitvoerlegging van vrijheidsbenemende maatregelen op grond van de [Vreemdelingenwet 2000][ref3];

      c. de tenuitvoerlegging van andere vrijheidsbenemende maatregelen in een inrichting die in hoofdzaak bestemd is
      voor de tenuitvoerlegging van strafrechtelijke beslissingen;

      d. besluiten en handelingen ter uitvoering van de [Wet militair tuchtrecht][ref4];

      e. besluiten en handelingen ter uitvoering van de
      [Wet toetsing levensbeëindiging op verzoek en hulp bij zelfdoding][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk2
