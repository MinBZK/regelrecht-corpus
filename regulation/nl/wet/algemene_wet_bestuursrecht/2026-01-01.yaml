        afdeling: '3.4'
  - number: 3:13
    text: |-
      1 Indien het besluit tot een of meer belanghebbenden zal zijn gericht, zendt het bestuursorgaan voorafgaand aan de
      terinzagelegging het ontwerp toe aan hen, onder wie begrepen de aanvrager.

      2 [ Artikel 3:12, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel312
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel313
