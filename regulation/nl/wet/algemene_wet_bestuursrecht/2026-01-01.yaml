  - number: 8:8
    text: |-
      1 Indien tegen hetzelfde besluit bij meer dan één bevoegde rechtbank beroep is ingesteld, worden de zaken verder
      behandeld door de bevoegde rechtbank waarbij als eerste beroep is ingesteld. Indien gelijktijdig bij meer dan één
      bevoegde rechtbank als eerste beroep is ingesteld, worden de zaken verder behandeld door de bevoegde rechtbank die
      als eerste wordt genoemd in [artikel 1 van de Wet op de rechterlijke indeling][ref1].

      2 De andere rechtbank verwijst, onderscheidenlijk de andere rechtbanken verwijzen de daar aanhangig gemaakte zaak
      of zaken naar de rechtbank die de zaken verder behandelt. De op de zaak of zaken betrekking hebbende stukken worden
      toegezonden aan de rechtbank die de zaken verder behandelt.

      3 Indien tegen hetzelfde besluit bij meer dan één rechtbank beroep is ingesteld, doet het bestuursorgaan daarvan
      onverwijld mededeling aan die rechtbanken.

      4 Indien het bestuursorgaan ingevolge [artikel 7:1a, vijfde of zesde lid][ref2], twee of meer bezwaarschriften
      doorzendt, zendt het bestuursorgaan deze door aan de rechtbank die ingevolge de tweede volzin van het eerste lid de
      zaak zal behandelen.

      5 Het eerste tot en met het vierde lid zijn van overeenkomstige toepassing indien beroep in eerste aanleg kan
      worden ingesteld bij een gerechtshof.


      [ref1]: https://wetten.overheid.nl/BWBR0002080#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel71a
