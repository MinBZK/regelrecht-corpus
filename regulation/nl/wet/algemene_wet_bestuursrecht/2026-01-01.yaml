  - number: 5:31
    text: |-
      1 Een bestuursorgaan dat bevoegd is om een last onder bestuursdwang op te leggen, kan in
      spoedeisende gevallen besluiten dat bestuursdwang zal worden toegepast zonder voorafgaande last.
      [Artikel 5:24, eerste en derde lid][ref1], is op dit besluit van overeenkomstige toepassing.

      2 Indien de situatie zo spoedeisend is, dat een besluit niet kan worden afgewacht, kan terstond bestuursdwang
      worden toegepast, maar wordt zo spoedig mogelijk nadien alsnog een besluit als bedoeld in het eerste lid
      bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel524
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel531
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 5:24
        hoofdstuk: '5'
        afdeling: 5.3.1
  - number: 5:31a
    text: |-
      1 De aanvrager van een last onder bestuursdwang, dan wel een andere belanghebbende die door de overtreding wordt
      benadeeld, kan het bestuursorgaan verzoeken bestuursdwang toe te passen.

      2 Het verzoek kan worden gedaan na afloop van de termijn, bedoeld in [artikel 5:24, tweede lid][ref1].

      3 Het bestuursorgaan beslist binnen vier weken op het verzoek. De beslissing is een beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel524
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel531a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 5:24
        hoofdstuk: '5'
        afdeling: 5.3.1
  - number: 5:31b
    text: |-
      De beschikking omtrent de toepassing vervalt, voor zover de last onder bestuursdwang wordt ingetrokken of
      vernietigd.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel531b
  - number: 5:31c
    text: |-
      1 Het bezwaar, beroep of hoger beroep tegen de last onder bestuursdwang heeft mede betrekking op een beschikking
      die strekt tot toepassing van bestuursdwang of op een beschikking tot vaststelling van de kosten van de
      bestuursdwang, voor zover de belanghebbende deze beschikking betwist.

      2 De bestuursrechter kan de beslissing op het beroep of hoger beroep inzake de beschikking tot toepassing van
      bestuursdwang of de beschikking tot vaststelling van de kosten echter verwijzen naar een ander orgaan, indien
      behandeling door dit orgaan gewenst is.

      3 In beroep of hoger beroep legt de belanghebbende zo mogelijk een afschrift over van de beschikking die hij
      betwist.

      4 Het eerste tot en met het derde lid zijn van overeenkomstige toepassing op een verzoek om voorlopige voorziening.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel531c
  - number: 5:31d
    text: |-
      Onder last onder dwangsom wordt verstaan: de herstelsanctie, inhoudende:

      a. een last tot geheel of gedeeltelijk herstel van de overtreding, en

      b. de verplichting tot betaling van een geldsom indien de last niet of niet tijdig wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel531d
  - number: 5:32
    text: |-
      1 Een bestuursorgaan dat bevoegd is een last onder bestuursdwang op te leggen, kan in plaats daarvan aan de
      overtreder een last onder dwangsom opleggen.

      2 Voor een last onder dwangsom wordt niet gekozen, indien het belang dat het betrokken voorschrift beoogt te
      beschermen, zich daartegen verzet.

      3 Indien de last onder dwangsom strekt ter handhaving van het bepaalde bij of krachtens een regeling die is genoemd
      in hoofdstuk 2, 3 of 4 van de bij deze wet behorende [Bevoegdheidsregeling bestuursrechtspraak][ref1] of in de bij
      deze wet behorende [Regeling verlaagd griffierecht][ref2], wordt de last onder dwangsom voor de toepassing van de
      twee laatstgenoemde regelingen aangemerkt als een besluit, genomen op grond van de eerstbedoelde regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel532
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
  - number: 5:32a
    text: |-
      1 De last onder dwangsom omschrijft de te nemen herstelmaatregelen.

      2 Bij een last onder dwangsom die strekt tot het ongedaan maken van een overtreding of het voorkomen van verdere
      overtreding, wordt een termijn gesteld gedurende welke de overtreder de last kan uitvoeren zonder dat een dwangsom
      wordt verbeurd.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel532a
  - number: 5:32b
    text: |-
      1 Het bestuursorgaan stelt de dwangsom vast hetzij op een bedrag ineens, hetzij op een bedrag per tijdseenheid
      waarin de last niet is uitgevoerd, dan wel per overtreding van de last.

      2 Het bestuursorgaan stelt tevens een bedrag vast waarboven geen dwangsom meer wordt verbeurd.

      3 De bedragen staan in redelijke verhouding tot de zwaarte van het geschonden belang en tot de beoogde werking van
      de dwangsom.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel532b
  - number: 5:33
    text: Een verbeurde dwangsom wordt betaald binnen zes weken nadat zij van rechtswege is verbeurd.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel533
  - number: 5:34
    text: |-
      1 Het bestuursorgaan dat een last onder dwangsom heeft opgelegd, kan op verzoek van de overtreder de last opheffen,
      de looptijd ervan opschorten voor een bepaalde termijn of de dwangsom verminderen ingeval van blijvende of
      tijdelijke gehele of gedeeltelijk onmogelijkheid voor de overtreder om aan zijn verplichtingen te voldoen.

      2 Het bestuursorgaan dat een last onder dwangsom heeft opgelegd, kan op verzoek van de overtreder de last opheffen
      indien de beschikking een jaar van kracht is geweest zonder dat de dwangsom is verbeurd.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel534
  - number: 5:35
    text: |-
      1 In afwijking van [artikel 4:104, eerste lid][ref1], verjaart de rechtsvordering tot betaling van een verbeurde
      dwangsom door verloop van een jaar na de dag waarop zij is verbeurd.

      2 Indien op de dag waarop de rechtsvordering verjaart, bezwaar, beroep of hoger beroep openstaat of aanhangig is
      tegen de last onder dwangsom, wordt de verjaringstermijn verlengd tot onherroepelijk op het bezwaar, beroep of
      hoger beroep is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4104
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel535
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:104
        hoofdstuk: '4'
        afdeling: 4.4.3
  - number: 5:37
    text: |-
      1 Alvorens aan te manen tot betaling van de dwangsom, beslist het bestuursorgaan bij beschikking omtrent de
      invordering van een dwangsom.

      2 Het bestuursorgaan geeft voorts een beschikking omtrent de invordering van de dwangsom, indien een belanghebbende
      daarom verzoekt.

      3 Het bestuursorgaan beslist binnen vier weken op het verzoek.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel537
  - number: 5:37a
    text: |-
      1 Een beschikking tot invordering van een dwangsom stuit de verjaring.

      2 Indien op de dag waarop de rechtsvordering verjaart een verzoek als bedoeld in [artikel 5:37, tweede lid][ref1],
      aanhangig is, wordt de verjaringstermijn verlengd tot onherroepelijk op het verzoek is beslist.

      3 Indien op de dag waarop de rechtsvordering verjaart bezwaar, beroep of hoger beroep openstaat of aanhangig is
      tegen de afwijzing van een verzoek als bedoeld in [artikel 5:37, tweede lid][ref2], of tegen het niet tijdig nemen
      van een beslissing op een zodanig verzoek, wordt de verjaringstermijn verlengd tot:

      a. de termijn voor het maken van bezwaar of het instellen van beroep of hoger beroep ongebruikt is verstreken;

      b. onherroepelijk op het bezwaar, beroep of hoger beroep is beslist; of

      c. het bestuursorgaan alsnog een beschikking tot invordering van een dwangsom heeft gegeven.

      4 Indien op de dag waarop de rechtsvordering verjaart, de beschikking omtrent invordering ingevolge een uitspraak
      van de voorzieningenrechter is geschorst, wordt de verjaringstermijn verlengd met de duur van de schorsing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel537
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel537
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel537a
