  - number: 7:13
    text: |-
      1 Dit artikel is van toepassing indien ten behoeve van de beslissing op het bezwaar een adviescommissie is
      ingesteld:

      a. die bestaat uit een voorzitter en ten minste twee leden,

      b. waarvan de voorzitter geen deel uitmaakt van en niet werkzaam is onder verantwoordelijkheid van het
      bestuursorgaan en

      c. die voldoet aan eventueel bij wettelijk voorschrift gestelde andere eisen.

      2 Indien een commissie over het bezwaar zal adviseren, deelt het bestuursorgaan dit zo spoedig mogelijk mede aan de
      indiener van het bezwaarschrift.

      3 Het horen geschiedt door de commissie. De commissie kan het horen opdragen aan de voorzitter of een lid dat geen
      deel uitmaakt van en niet werkzaam is onder verantwoordelijkheid van het bestuursorgaan.

      4 De commissie beslist over de toepassing van [artikel 7:4, zesde lid][ref1], van [artikel 7:5, tweede lid][ref2],
      en, voor zover bij wettelijk voorschrift niet anders is bepaald, van [artikel 7:3][ref3].

      5 Een vertegenwoordiger van het bestuursorgaan wordt voor het horen uitgenodigd en wordt in de gelegenheid gesteld
      een toelichting op het standpunt van het bestuursorgaan te geven.

      6 Het advies van de commissie wordt schriftelijk uitgebracht en bevat een verslag van het horen.

      7 Indien de beslissing op het bezwaar afwijkt van het advies van de commissie, wordt in de beslissing de reden voor
      die afwijking vermeld en wordt het advies met de beslissing meegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel75
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel73
