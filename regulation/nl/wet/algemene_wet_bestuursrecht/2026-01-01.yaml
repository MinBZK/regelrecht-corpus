        bwb_id: BWBR0005537
        artikel: 2:15
        hoofdstuk: '2'
        paragraaf: 2.3.3
        afdeling: '2.3'
  - number: 9:29
    text: |-
      Aan de behandeling van het verzoek wordt niet meegewerkt door een persoon die betrokken is geweest bij de gedraging
      waarop het verzoek betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel929
  - number: 9:30
    text: |-
      1 De ombudsman stelt het bestuursorgaan, degene op wiens gedraging het verzoek betrekking heeft, en de verzoeker in
      de gelegenheid hun standpunt toe te lichten.

      2 De ombudsman beslist of de toelichting schriftelijk of mondeling en al dan niet in elkaars tegenwoordigheid wordt
      gegeven.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel930
  - number: 9:31
    text: |-
      1 Het bestuursorgaan, onder zijn verantwoordelijkheid werkzame personen – ook na het beëindigen van de
      werkzaamheden –, getuigen alsmede de verzoeker verstrekken de ombudsman de benodigde inlichtingen en verschijnen op
      een daartoe strekkende uitnodiging voor hem. Gelijke verplichtingen rusten op ieder college, met dien verstande dat
      het college bepaalt wie van zijn leden aan de verplichtingen zal voldoen, tenzij de ombudsman één of meer bepaalde
      leden aanwijst. De ombudsman kan betrokkenen die zijn opgeroepen gelasten om in persoon te verschijnen.

      2 Inlichtingen die betrekking hebben op het beleid, gevoerd onder de verantwoordelijkheid van een minister
      of een ander bestuursorgaan, kan de ombudsman bij de daarbij betrokken personen en colleges slechts inwinnen
      door tussenkomst van de minister onderscheidenlijk dat bestuursorgaan. Het orgaan door tussenkomst waarvan de
      inlichtingen worden ingewonnen, kan zich bij het horen van de ambtenaren doen vertegenwoordigen.

      3 Binnen een door de ombudsman te bepalen termijn worden ten behoeve van een onderzoek de onder het bestuursorgaan,
      degene op wiens gedraging het verzoek betrekking heeft, en bij anderen berustende stukken aan hem overgelegd nadat
      hij hierom schriftelijk heeft verzocht.

      4 De ingevolge het eerste lid opgeroepen personen onderscheidenlijk degenen die ingevolge het derde lid
      verplicht zijn stukken over te leggen kunnen, indien daarvoor gewichtige redenen zijn, het geven van inlichtingen
      onderscheidenlijk het overleggen van stukken weigeren of de ombudsman mededelen dat uitsluitend hij kennis zal
      mogen nemen van de inlichtingen onderscheidenlijk de stukken.

      5 De ombudsman beslist of de in het vierde lid bedoelde weigering onderscheidenlijk de beperking van de
      kennisneming gerechtvaardigd is.

      6 Indien de ombudsman heeft beslist dat de weigering gerechtvaardigd is, vervalt de verplichting.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel931
  - number: 9:32
    text: |-
      1 De ombudsman kan ten dienste van het onderzoek deskundigen werkzaamheden opdragen. Hij kan voorts in het belang
      van het onderzoek deskundigen en tolken oproepen.

      2 Door de ombudsman opgeroepen deskundigen of tolken verschijnen voor hem, en verlenen
      onpartijdig en naar beste weten hun diensten als zodanig. Op deskundigen, tevens ambtenaren, is
      [artikel 9:31, tweede tot en met zesde lid][ref1], van overeenkomstige toepassing.

      3 De ombudsman kan bepalen dat getuigen niet zullen worden gehoord en tolken niet tot de uitoefening van hun taak
      zullen worden toegelaten dan na het afleggen van de eed of de belofte. Getuigen leggen in dat geval de eed of de
      belofte af dat zij de gehele waarheid en niets dan de waarheid zullen zeggen en tolken dat zij hun plichten als
      tolk met nauwgezetheid zullen vervullen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel931
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel932
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 9:31
        hoofdstuk: '9'
        afdeling: 9.2.3
  - number: 9:33
    text: |-
      1 Aan de door de ombudsman opgeroepen verzoekers, getuigen, deskundigen en tolken wordt een vergoeding toegekend.
      Deze vergoeding vindt plaats ten laste van de rechtspersoon waartoe het bestuursorgaan behoort op wiens
      gedraging het verzoek betrekking heeft, indien het een gemeente, provincie, waterschap of gemeenschappelijke
      regeling betreft. In overige gevallen vindt de vergoeding plaats ten laste van het Rijk. Het bij en krachtens de
      [Wet tarieven in strafzaken][ref1] bepaalde is van overeenkomstige toepassing.

      2 De in het eerste lid bedoelde personen die in openbare dienst zijn, ontvangen geen vergoeding indien zij zijn
      opgeroepen in verband met hun taak als zodanig.


      [ref1]: https://wetten.overheid.nl/BWBR0002406
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel933
    references:
      - id: ref1
        bwb_id: BWBR0002406
  - number: 9:34
    text: |-
      1 De ombudsman kan een onderzoek ter plaatse instellen. Hij heeft daarbij toegang tot elke plaats, met uitzondering
      van een woning zonder toestemming van de bewoner, voor zover dat redelijkerwijs voor de vervulling van zijn taak
      nodig is.

      2 Bestuursorganen verlenen de medewerking die in het belang van het onderzoek, bedoeld in het eerste lid, is
      vereist.

      3 Van het onderzoek wordt een proces-verbaal gemaakt.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel934
  - number: 9:35
    text: |-
      1 De ombudsman deelt, alvorens het onderzoek te beëindigen, zijn bevindingen schriftelijk mee aan:

      a. het betrokken bestuursorgaan;

      b. degene op wiens gedraging het verzoek betrekking heeft;

      c. de verzoeker.

      2 De ombudsman geeft hun de gelegenheid zich binnen een door hem te stellen termijn omtrent de bevindingen te
      uiten.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel935
  - number: 9:36
    text: |-
      1 Wanneer een onderzoek is afgesloten, stelt de ombudsman een rapport op, waarin hij zijn bevindingen en zijn
      oordeel weergeeft. Hij neemt daarbij [artikel 5.1 van de Wet open overheid][ref1] in acht.

      2 Indien naar het oordeel van de ombudsman de gedraging niet behoorlijk is, vermeldt hij in het rapport welk
      vereiste van behoorlijkheid geschonden is.

      3 De ombudsman zendt zijn rapport aan het betrokken bestuursorgaan, alsmede aan de verzoeker en aan degene op wiens
      gedraging het verzoek betrekking heeft.

      4 Indien de ombudsman aan het bestuursorgaan een aanbeveling doet als bedoeld in [artikel 9:27, derde lid][ref2],
      deelt het bestuursorgaan binnen een redelijke termijn aan de ombudsman mee op welke wijze aan de aanbeveling gevolg
      zal worden gegeven. Indien het bestuursorgaan overweegt de aanbeveling niet op te volgen, deelt het dat met redenen
      omkleed aan de ombudsman mee.

      5 Bij de ombudsman berustende informatie over de klacht en het onderzoek die niet opgenomen in het rapport, is
      niet openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel5.1
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel927
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel936
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '5.1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 9:27
        hoofdstuk: '9'
        afdeling: 9.2.2
  - number: 9:36a
    text: |-
      Voor zover een aan de ombudsman gericht verzoek op grond van de [Wet open overheid][ref1] betrekking heeft op door
      een bestuursorgaan verstrekte informatie ten behoeve van een onderzoek als bedoeld in [artikel 9:18][ref2], zendt
      de ombudsman het verzoek ter behandeling door aan het bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0045754
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel918
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel936a
    references:
      - id: ref1
        bwb_id: BWBR0045754
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 9:18
        hoofdstuk: '9'
        afdeling: 9.2.1
  - number: 10:1
    text: 'Onder mandaat wordt verstaan: de bevoegdheid om in naam van een bestuursorgaan besluiten te nemen.'
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel101
  - number: 10:2
    text: |-
      Een door de gemandateerde binnen de grenzen van zijn bevoegdheid genomen besluit geldt als een besluit van de
      mandaatgever.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel102
  - number: 10:3
    text: |-
      1 Een bestuursorgaan kan mandaat verlenen, tenzij bij wettelijk voorschrift anders is bepaald of de aard van de
      bevoegdheid zich tegen de mandaatverlening verzet.

      2 Mandaat wordt in ieder geval niet verleend indien het betreft een bevoegdheid:

      a. tot het vaststellen van algemeen verbindende voorschriften, tenzij bij de verlening van die bevoegdheid in
      mandaatverlening is voorzien;

      b. tot het nemen van een besluit ten aanzien waarvan is bepaald dat het met versterkte meerderheid moet worden
      genomen of waarvan de aard van de voorgeschreven besluitvormingsprocedure zich anderszins tegen de mandaatverlening
      verzet;

      c. tot het vernietigen van of tot het onthouden van goedkeuring aan een besluit van een ander bestuursorgaan.

      3 Mandaat tot het beslissen op een bezwaarschrift of op een verzoek als bedoeld in
      [artikel 7:1a, eerste lid][ref1], wordt niet verleend aan degene die het besluit waartegen het bezwaar zich richt,
      krachtens mandaat heeft genomen.

      4 Indien [artikel 5:53][ref2] van toepassing is, wordt mandaat tot het opleggen van een bestuurlijke boete niet
      verleend aan degene die van de overtreding een rapport of proces-verbaal heeft opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel71a
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel553
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 7:1a
        hoofdstuk: '7'
        afdeling: '7.1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 5:53
        hoofdstuk: '5'
        afdeling: 5.4.2
  - number: 10:4
    text: |-
      1 Indien de gemandateerde niet werkzaam is onder verantwoordelijkheid van de mandaatgever, behoeft de
      mandaatverlening de instemming van de gemandateerde en in het voorkomende geval van degene onder wiens
      verantwoordelijkheid hij werkt.

      2 Het eerste lid is niet van toepassing indien bij wettelijk voorschrift in de bevoegdheid tot de mandaatverlening
      is voorzien.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel104
  - number: 10:5
    text: |-
      1 Een bestuursorgaan kan hetzij een algemeen mandaat hetzij een mandaat voor een bepaald geval verlenen.

      2 Een algemeen mandaat wordt schriftelijk verleend. Een mandaat voor een bepaald geval wordt in ieder geval
      schriftelijk verleend indien de gemandateerde niet werkzaam is onder verantwoordelijkheid van de mandaatgever.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel105
  - number: 10:6
    text: |-
      1 De mandaatgever kan de gemandateerde per geval of in het algemeen instructies geven ter zake van de uitoefening
      van de gemandateerde bevoegdheid.

      2 De gemandateerde verschaft de mandaatgever op diens verzoek inlichtingen over de uitoefening van de bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel106
  - number: 10:7
    text: De mandaatgever blijft bevoegd de gemandateerde bevoegdheid uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel107
  - number: 10:8
    text: |-
      1 De mandaatgever kan het mandaat te allen tijde intrekken.

      2 Een algemeen mandaat wordt schriftelijk ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel108
  - number: 10:9
    text: |-
      1 De mandaatgever kan toestaan dat ondermandaat wordt verleend.

      2 Op ondermandaat zijn de overige artikelen van deze afdeling van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel109
  - number: 10:10
    text: Een krachtens mandaat genomen besluit vermeldt namens welk bestuursorgaan het besluit is genomen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel1010
  - number: 10:11
    text: |-
      1 Een bestuursorgaan kan bepalen dat door hem genomen besluiten namens hem kunnen worden ondertekend, tenzij bij
      wettelijk voorschrift anders is bepaald of de aard van de bevoegdheid zich hiertegen verzet.

      2 In dat geval moet uit het besluit blijken, dat het door het bestuursorgaan zelf is genomen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel1011
  - number: 10:12
    text: |-
      Deze afdeling is van overeenkomstige toepassing indien een bestuursorgaan aan een ander, werkzaam onder zijn
      verantwoordelijkheid, volmacht verleent tot het verrichten van privaatrechtelijke rechtshandelingen, of machtiging
      verleent tot het verrichten van handelingen die noch een besluit, noch een privaatrechtelijke rechtshandeling zijn.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel1012
  - number: 10:13
    text: |-
      Onder delegatie wordt verstaan: het overdragen door een bestuursorgaan van zijn bevoegdheid tot het nemen van
      besluiten aan een ander die deze onder eigen verantwoordelijkheid uitoefent.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel1013
  - number: 10:14
    text: Delegatie geschiedt niet aan ondergeschikten.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel1014
  - number: 10:15
    text: Delegatie geschiedt slechts indien in de bevoegdheid daartoe bij wettelijk voorschrift is voorzien.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel1015
  - number: 10:16
    text: |-
      1 Het bestuursorgaan kan ter zake van de uitoefening van de gedelegeerde bevoegdheid uitsluitend beleidsregels
      geven.

      2 Degene aan wie de bevoegdheid is gedelegeerd, verschaft het bestuursorgaan op diens verzoek inlichtingen over de
      uitoefening van de bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel1016
  - number: 10:17
    text: Het bestuursorgaan kan de gedelegeerde bevoegdheid niet meer zelf uitoefenen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel1017
  - number: 10:18
    text: Het bestuursorgaan kan het delegatiebesluit te allen tijde intrekken.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel1018
  - number: 10:19
    text: |-
      Een besluit dat op grond van een gedelegeerde bevoegdheid wordt genomen, vermeldt het delegatiebesluit en de
      vindplaats daarvan.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel1019
  - number: 10:20
    text: |-
      1 Op de overdracht door een bestuursorgaan van een bevoegdheid van een ander bestuursorgaan tot het nemen
      van besluiten aan een derde is deze afdeling, met uitzondering van [artikel 10:16][ref1], van overeenkomstige
      toepassing.

      2 Bij wettelijk voorschrift of bij het besluit tot overdracht kan worden bepaald dat het bestuursorgaan wiens
      bevoegdheid is overgedragen beleidsregels over de uitoefening van die bevoegdheid kan geven.

      3 Degene aan wie de bevoegdheid is overgedragen, verschaft het overdragende en het oorspronkelijk bevoegde
      bestuursorgaan op hun verzoek inlichtingen over de uitoefening van de bevoegdheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1016
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel1020
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 10:16
        hoofdstuk: '10'
        afdeling: 10.1.2
  - number: 10:21
    text: |-
      Deze afdeling is van overeenkomstige toepassing indien een bestuursorgaan zijn bevoegdheid tot het verrichten van
      andere handelingen dan besluiten overdraagt aan een ander die deze onder eigen verantwoordelijkheid uitoefent, met
      dien verstande dat [artikel 10:19][ref1] van overeenkomstige toepassing is voor zover de aard van de handeling zich
      daartegen niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1019
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel1021
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 10:19
        hoofdstuk: '10'
        afdeling: 10.1.2
  - number: 10:22
    text: |-
      1 Indien een bevoegdheid tot het nemen van besluiten bij wettelijk voorschrift is toegedeeld aan een persoon of
      college, werkzaam onder de verantwoordelijkheid van een bestuursorgaan, kan dit bestuursorgaan per geval of in het
      algemeen instructies geven ter zake van de uitoefening van de toegedeelde bevoegdheid.

      2 Degene aan wie de bevoegdheid is toegedeeld, verschaft het bestuursorgaan op diens verzoek inlichtingen over de
      uitoefening van de bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel1022
  - number: 10:23
    text: |-
      [Artikel 10:22][ref1] is van overeenkomstige toepassing indien bij wettelijk voorschrift een bevoegdheid tot
      het verrichten van andere handelingen dan besluiten is toegedeeld aan een persoon of college, werkzaam onder de
      verantwoordelijkheid van een bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1022
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel1023
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 10:22
        hoofdstuk: '10'
        afdeling: 10.1.3
  - number: 10:25
    text: |-
      In deze wet wordt verstaan onder goedkeuring: de voor de inwerkingtreding van een besluit van een bestuursorgaan
      vereiste toestemming van een ander bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel1025
  - number: 10:26
    text: Besluiten kunnen slechts aan goedkeuring worden onderworpen in bij of krachtens de wet bepaalde gevallen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel1026
  - number: 10:27
    text: |-
      De goedkeuring kan slechts worden onthouden wegens strijd met het recht of op een grond, neergelegd in de wet
      waarin of krachtens welke de goedkeuring is voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel1027
  - number: 10:28
    text: |-
      Aan een besluit waarover een rechter uitspraak heeft gedaan of waarbij een in kracht van gewijsde gegane uitspraak
      van de rechter wordt uitgevoerd, kan geen goedkeuring worden onthouden op rechtsgronden welke in strijd zijn met
      die waarop de uitspraak steunt of mede steunt.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel1028
  - number: 10:29
    text: |-
      1 Een besluit kan alleen dan gedeeltelijk worden goedgekeurd, indien gedeeltelijke inwerkingtreding strookt met
      aard en inhoud van het besluit.

      2 De goedkeuring kan noch voor bepaalde tijd of onder voorwaarden worden verleend, noch worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel1029
  - number: 10:30
    text: |-
      1 Gedeeltelijke goedkeuring of onthouding van goedkeuring vindt niet plaats dan nadat aan het bestuursorgaan dat
      het besluit heeft genomen, gelegenheid tot overleg is geboden.

      2 De motivering van het goedkeuringsbesluit verwijst naar hetgeen in het overleg aan de orde is gekomen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel1030
  - number: 10:31
    text: |-
      1 Tenzij bij wettelijk voorschrift anders is bepaald, wordt het besluit omtrent goedkeuring binnen dertien weken
      na de verzending ter goedkeuring bekend gemaakt aan het bestuursorgaan dat het aan goedkeuring onderworpen besluit
      heeft genomen.

      2 Het nemen van het besluit omtrent goedkeuring kan eenmaal voor ten hoogste dertien weken worden verdaagd.

      3 In afwijking van het tweede lid kan het nemen van het besluit omtrent goedkeuring eenmaal voor ten hoogste zes
      maanden worden verdaagd indien inzake dat besluit advies van een adviseur als bedoeld in [artikel 3:5][ref1] is
      vereist.

      4 Tenzij bij wettelijk voorschrift anders is bepaald, is [paragraaf 4.1.3.3][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel1031
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 3:5
        hoofdstuk: '3'
        afdeling: '3.3'
      - id: ref2
        bwb_id: BWBR0005537
        hoofdstuk: '4'
        paragraaf: 4.1.3.3
        afdeling: 4.1.3
  - number: 10:32
    text: |-
      1 Deze afdeling is van overeenkomstige toepassing indien voor het nemen van een besluit door een bestuursorgaan de
      toestemming van een ander bestuursorgaan is vereist.

      2 Bij de toestemming kan een termijn worden gesteld waarbinnen het besluit dient te worden genomen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel1032
  - number: 10:33
    text: |-
      Deze afdeling is van toepassing indien een bestuursorgaan bevoegd is buiten administratief beroep een besluit van
      een ander bestuursorgaan te vernietigen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel1033
  - number: 10:34
    text: De vernietigingsbevoegdheid kan slechts worden verleend bij de wet.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel1034
  - number: 10:35
    text: Vernietiging kan alleen geschieden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel1035
  - number: 10:36
    text: |-
      Een besluit kan alleen dan gedeeltelijk worden vernietigd, indien gedeeltelijke instandhouding strookt met aard en
      inhoud van het besluit.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel1036
  - number: 10:37
    text: |-
      Een besluit waarover de rechter uitspraak heeft gedaan of waarbij een in kracht van gewijsde gegane uitspraak van
      de rechter wordt uitgevoerd, kan niet worden vernietigd op rechtsgronden welke in strijd zijn met die waarop de
      uitspraak steunt of mede steunt.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel1037
  - number: 10:38
    text: |-
      1 Een besluit dat nog goedkeuring behoeft, kan niet worden vernietigd.

      2 Een besluit waartegen bezwaar of beroep openstaat of aanhangig is, kan niet worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel1038
  - number: 10:39
    text: |-
      1 Een besluit tot het verrichten van een privaatrechtelijke rechtshandeling kan niet worden vernietigd, indien
      dertien weken zijn verstreken nadat het is bekendgemaakt.

      2 Indien binnen de termijn genoemd in het eerste lid overeenkomstig [artikel 10:43][ref1] schorsing heeft
      plaatsgevonden, blijft vernietiging binnen de duur van de schorsing mogelijk.

      3 Indien een besluit als bedoeld in het eerste lid aan goedkeuring is onderworpen, vangt de in het eerste lid
      genoemde termijn aan nadat het goedkeuringsbesluit is bekendgemaakt. Op het goedkeuringsbesluit zijn het eerste en
      tweede lid van overeenkomstige toepassing.

      4 Dit artikel is niet van toepassing indien vernietiging geschiedt wegens strijd met de bij of krachtens het
      Verdrag betreffende de werking van de Europese Unie, het Verdrag tot oprichting van de Europese Gemeenschap voor
      Atoomenergie of het Verdrag betreffende de Europese Unie op Nederland rustende verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1043
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel1039
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 10:43
        hoofdstuk: '10'
        afdeling: 10.2.3
  - number: 10:40
    text: |-
      Een besluit dat overeenkomstig [artikel 10:43][ref1] is geschorst, kan, nadat de schorsing is geëindigd, niet meer
      worden vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1043
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel1040
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 10:43
        hoofdstuk: '10'
        afdeling: 10.2.3
  - number: 10:41
    text: |-
      1 Vernietiging vindt niet plaats dan nadat aan het bestuursorgaan dat het besluit heeft genomen, gelegenheid tot
      overleg is geboden.

      2 De motivering van het vernietigingsbesluit verwijst naar hetgeen in het overleg aan de orde is gekomen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel1041
  - number: 10:42
    text: |-
      1 Vernietiging van een besluit strekt zich uit tot alle rechtsgevolgen waarop het was gericht.

      2 In het vernietigingsbesluit kan worden bepaald dat de rechtsgevolgen van het vernietigde besluit geheel of ten
      dele in stand blijven.

      3 Indien een besluit tot het aangaan van een overeenkomst wordt vernietigd, wordt de overeenkomst, zo zij reeds
      is aangegaan en voor zover bij het vernietigingsbesluit niet anders is bepaald, niet of niet verder uitgevoerd,
      onverminderd het recht van de wederpartij op schadevergoeding.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel1042
  - number: 10:43
    text: |-
      Hangende het onderzoek of er reden is tot vernietiging over te gaan, kan een besluit door het tot vernietiging
      bevoegde bestuursorgaan worden geschorst.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel1043
  - number: 10:44
    text: |-
      1 Het besluit tot schorsing bepaalt de duur hiervan.

      2 De schorsing van een besluit kan eenmaal worden verlengd.

      3 De schorsing kan ook na verlenging niet langer duren dan een jaar.

      4 Indien bezwaar is gemaakt of beroep is ingesteld tegen het geschorste besluit, duurt de schorsing evenwel voort
      tot dertien weken nadat op het bezwaar of beroep onherroepelijk is beslist.

      5 De schorsing kan worden opgeheven.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel1044
  - number: 10:45
    text: |-
      Op het besluit inzake schorsing zijn de [artikelen 10:36][ref1], [10:37][ref2], [10:38, eerste lid][ref3],
      [10:39, eerste en derde lid][ref4], en [10:42, derde lid][ref5], van overeenkomstige toepassing.


