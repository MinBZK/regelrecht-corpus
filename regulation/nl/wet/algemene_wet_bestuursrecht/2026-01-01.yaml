        bwb_id: BWBR0005537
        artikel: 3:11
        hoofdstuk: '3'
        afdeling: '3.4'
  - number: 3:15
    text: |-
      1 Belanghebbenden kunnen bij het bestuursorgaan naar keuze schriftelijk of mondeling hun zienswijze over het
      ontwerp naar voren brengen.

      2 Bij wettelijk voorschrift of door het bestuursorgaan kan worden bepaald dat ook aan anderen de gelegenheid moet
      worden geboden hun zienswijze naar voren te brengen.

      3 Indien het een besluit op aanvraag betreft, stelt het bestuursorgaan de aanvrager zo nodig in de gelegenheid te
      reageren op de naar voren gebrachte zienswijzen.

      4 Indien het een besluit tot wijziging of intrekking van een besluit betreft, stelt het bestuursorgaan degene tot
      wie het te wijzigen of in te trekken besluit is gericht zo nodig in de gelegenheid te reageren op de naar voren
      gebrachte zienswijzen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel315
  - number: 3:16
    text: |-
      1 De termijn voor het naar voren brengen van zienswijzen en het uitbrengen van adviezen als bedoeld in
      [afdeling 3.3][ref1], bedraagt zes weken, tenzij bij wettelijk voorschrift een langere termijn is bepaald.

      2 De termijn vangt aan met ingang van de dag waarop het ontwerp ter inzage is gelegd en daarvan kennis is gegeven.

      3 Op schriftelijk naar voren gebrachte zienswijzen zijn de [artikelen 6:9][ref2], [6:10][ref3] en [6:15][ref4] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk3
