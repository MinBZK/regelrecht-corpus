  - number: 4:38
    text: |-
      1 Het bestuursorgaan kan de subsidie-ontvanger ook andere verplichtingen opleggen die strekken tot verwezenlijking
      van het doel van de subsidie.

      2 Indien de subsidie op een wettelijk voorschrift berust, worden de verplichtingen opgelegd bij wettelijk
      voorschrift of krachtens wettelijk voorschrift bij de subsidieverlening.

      3 Indien de subsidie niet op een wettelijk voorschrift berust, kunnen de verplichtingen worden opgelegd bij de
      subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel438
  - number: 4:39
    text: |-
      1 Verplichtingen die niet strekken tot verwezenlijking van het doel van de subsidie kunnen slechts aan de subsidie
      worden verbonden voor zover dit bij wettelijk voorschrift is bepaald.

      2 Verplichtingen als bedoeld in het eerste lid kunnen slechts betrekking hebben op de wijze waarop of de middelen
      waarmee de gesubsidieerde activiteit wordt verricht.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel439
  - number: 4:40
    text: |-
      De verplichtingen kunnen na de subsidieverlening worden uitgewerkt, voor zover de beschikking tot subsidieverlening
      dit vermeldt.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel440
  - number: 4:41
    text: |-
      1 In de gevallen, genoemd in het tweede lid, is de subsidie-ontvanger, voor zover het verstrekken van de subsidie
      heeft geleid tot vermogensvorming, daarvoor een vergoeding verschuldigd aan het bestuursorgaan, mits:

      a. dit bij wettelijk voorschrift of, indien de subsidie niet op een wettelijk voorschrift berust, bij de
      subsidieverlening is bepaald, en

      b. daarbij is aangegeven hoe de hoogte van de vergoeding wordt bepaald.

      2 De vergoeding is slechts verschuldigd indien:

      a. de subsidie-ontvanger voor de gesubsidieerde activiteiten gebruikte of bestemde goederen vervreemdt of bezwaart
      of de bestemming daarvan wijzigt;

      b. de subsidie-ontvanger een schadevergoeding ontvangt voor verlies of beschadiging van voor de gesubsidieerde
      activiteiten gebruikte of bestemde goederen;

      c. de gesubsidieerde activiteiten geheel of gedeeltelijk worden beëindigd;

      d. de subsidieverlening of de subsidievaststelling wordt ingetrokken of de subsidie wordt beëindigd, of

      e. de rechtspersoon die de subsidie ontving wordt ontbonden.

      3 De vergoeding wordt vastgesteld binnen een jaar nadat het bestuursorgaan op de hoogte is gekomen of kon zijn van
      de gebeurtenis die het recht op vergoeding deed ontstaan, doch in ieder geval binnen vijf jaren na de bekendmaking
      van de laatste beschikking tot subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel441
  - number: 4:42
    text: |-
      De beschikking tot subsidievaststelling stelt het bedrag van de subsidie vast en geeft aanspraak op betaling van
      het vastgestelde bedrag overeenkomstig [afdeling 4.2.7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel442
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '4'
        afdeling: 4.2.7
  - number: 4:43
    text: |-
      1 Indien geen beschikking tot subsidieverlening is gegeven, bevat de beschikking tot subsidievaststelling een
      aanduiding van de activiteiten waarvoor subsidie wordt verstrekt.

      2 De [artikelen 4:32][ref1], [4:35, tweede en derde lid][ref2], [4:38][ref3] en [4:39][ref4] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel432
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel435
