  - number: B2:4
    text: |-
      Tegen een besluit, genomen op grond van een in dit artikel genoemd voorschrift of anderszins in dit artikel
      omschreven, kan beroep worden ingesteld bij het College van Beroep voor het bedrijfsleven.

      Een besluit van de Sociaal-Economische Raad of van de Kamer van Koophandel, genoemd in
      [artikel 2 van de Wet op de Kamer van Koophandel][ref1], met uitzondering van:

      a. een besluit op grond van de [Wet open overheid][ref2]

      b. een besluit ten aanzien van een persoon met betrekking tot diens in [artikel 3 van de Ambtenarenwet 2017][ref3]
      bedoelde hoedanigheid

      c. een besluit op grond van de Algemene verordening gegevensbescherming

      [Algemene douanewet][ref4]: een beschikking ter zake van landbouwrestituties

      [Bankwet 1998][ref5]: [artikel 12, vierde lid][ref6], voor zover het een schorsing of ontheffing van een directeur
      betreft

      [ Burgerlijk Wetboek, Boek 2][ref7], voor zover het besluit is bekendgemaakt voor 1 juli 2011:

      a. [artikel 64, derde lid][ref8], tweede volzin, voor zover het betreft een weigering om de in de eerste volzin
      bedoelde termijn te verlengen

      b. de [artikelen 68, tweede lid][ref9], en [125, tweede lid][ref10], voor zover het betreft een weigering van een
      verklaring

      c. [artikel 156][ref11], voor zover het betreft:

      1. een weigering, wijziging of intrekking van een ontheffing

      2. een besluit tot verlening van de ontheffing voor zover daaraan voorschriften zijn verbonden dan wel daarbij
      beperkingen zijn opgelegd

      d. [artikel 175, derde lid][ref12], tweede volzin, voor zover het betreft een afwijzing van een verzoek

      e. de [artikelen 179, tweede lid][ref13], en [235, tweede lid][ref14], voor zover het betreft een weigering van
      een verklaring

      f. [artikel 266][ref15], voor zover het betreft:

      1. een besluit tot weigering, wijziging of intrekking van de ontheffing

      2. een besluit tot verlening van de ontheffing voor zover daaraan voorschriften zijn verbonden dan wel daarbij
      beperkingen zijn opgelegd

      [Energiewet][ref16], met inbegrip van een besluit van de Autoriteit Consument en Markt genomen op grond van
      [artikel 3.37][ref17], [3.106, tweede lid][ref18], [3.108][ref19], [3.109][ref20], [3.110][ref21], [3.112][ref22]
      en [3.121][ref23], voor zover het besluit kan worden aangemerkt als een algemeen verbindend voorschrift
      als bedoeld in [artikel 8.3, eerste lid][ref24], van de Algemene wet bestuursrecht, en met uitzondering van
      een besluit op grond van de [artikelen 3.33, tweede lid, onderdeel e][ref25], [5.19][ref26], [5.21][ref27],
