    text: |-
      1 Het horen geschiedt door het beroepsorgaan.

      2 Bij of krachtens de wet kan het horen worden opgedragen aan een adviescommissie waarin een of meer leden zitting
      hebben die geen deel uitmaken van en niet werkzaam zijn onder verantwoordelijkheid van het beroepsorgaan.

