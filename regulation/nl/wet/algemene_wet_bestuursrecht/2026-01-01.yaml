  - number: 9:18
    text: |-
      1 Een ieder heeft het recht de ombudsman schriftelijk te verzoeken een onderzoek in te stellen naar de wijze waarop
      een bestuursorgaan zich in een bepaalde aangelegenheid jegens hem of een ander heeft gedragen.

      2 Indien het verzoekschrift bij een onbevoegde ombudsman wordt ingediend, wordt het, nadat daarop de datum
      van ontvangst is aangetekend, zo spoedig mogelijk doorgezonden aan de bevoegde ombudsman, onder gelijktijdige
      mededeling hiervan aan de verzoeker.

      3 De ombudsman is verplicht aan een verzoek als bedoeld in het eerste lid gevolg te geven, tenzij
      [artikel 9:22][ref1], [9:23][ref2] of [9:24][ref3] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel922
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel923
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel924
