        artikel: 8:41
        hoofdstuk: '8'
        afdeling: 8.2.1
  - number: 8:83
    text: |-
      1 Partijen worden zo spoedig mogelijk uitgenodigd om op een in de uitnodiging te vermelden plaats en tijdstip op
      een zitting te verschijnen. Binnen een door de voorzieningenrechter te bepalen termijn zendt het bestuursorgaan
      de op de zaak betrekking hebbende stukken aan hem. De [artikelen 8:45, vierde tot en met zesde lid][ref1], en
      [8:45a][ref2] zijn van overeenkomstige toepassing, met dien verstande dat de voorzieningenrechter kan bepalen dat
      de in deze artikelen bedoelde zienswijzen mondeling ter zitting naar voren worden gebracht. [Artikel 8:58][ref3]
      is van overeenkomstige toepassing, met dien verstande dat tot één dag voor de zitting nadere stukken kunnen worden
      ingediend. De [artikelen 8:59][ref4], [8:60][ref5], [8:60a, tweede lid][ref6], en [8:61 tot en met 8:65][ref7]
      zijn van overeenkomstige toepassing, met dien verstande dat getuigen en deskundigen kunnen worden meegebracht of
      opgeroepen zonder dat de in [artikel 8:60, vierde lid, eerste volzin][ref8], bedoelde mededeling is gedaan.

      2 Indien administratief beroep is ingesteld, wordt het beroepsorgaan eveneens uitgenodigd om op de zitting te
      verschijnen. Het beroepsorgaan wordt in de gelegenheid gesteld ter zitting een uiteenzetting over de zaak te geven.

      3 Indien de voorzieningenrechter kennelijk onbevoegd is of het verzoek kennelijk niet-ontvankelijk, kennelijk
      ongegrond of kennelijk gegrond is, kan de voorzieningenrechter uitspraak doen zonder toepassing van het eerste lid.

      4 Indien onverwijlde spoed dat vereist en partijen daardoor niet in hun belangen worden geschaad, kan de
      voorzieningenrechter ook in andere gevallen uitspraak doen zonder toepassing van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel845
