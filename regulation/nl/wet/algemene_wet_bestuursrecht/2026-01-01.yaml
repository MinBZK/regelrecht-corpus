        artikel: 4:18
        hoofdstuk: '4'
        paragraaf: 4.1.3.2
        afdeling: 4.1.3
  - number: 4:20a
    text: |-
      1 Deze paragraaf is van toepassing indien dit bij wettelijk voorschrift is bepaald.

      2 [Paragraaf 4.1.3.2][ref1] is niet van toepassing indien deze paragraaf van toepassing is.


