  - number: B2:11
    text: |-
      Tegen een uitspraak van de rechtbank of van de voorzieningenrechter omtrent een besluit, genomen op grond van een
      in dit artikel genoemd voorschrift of anderszins in dit artikel omschreven, kan hoger beroep worden ingesteld bij
      het College van Beroep voor het bedrijfsleven.

      [Aanbestedingswet 2012][ref1], [artikel 4.21][ref2]

      [Aanbestedingswet op defensie- en veiligheidsgebied][ref3], [artikel 3.8][ref4]

      Algemene wet bestuursrecht: [artikel 4:126][ref5], voor zover het besluit betrekking heeft op schade, veroorzaakt
      door een besluit op grond van een ander voorschrift, genoemd in artikel 11 van deze Bevoegdheidsregeling
      bestuursrechtspraak, of door een handeling ter uitvoering van een zodanig besluit

