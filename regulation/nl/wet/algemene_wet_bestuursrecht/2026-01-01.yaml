  - number: 8:12b
    text: |-
      1 De Afdeling bestuursrechtspraak van de Raad van State, de Centrale Raad van Beroep en het College van Beroep
      voor het bedrijfsleven kunnen in zaken die bij hun college in behandeling zijn bij een meervoudige of grote
      kamer, anderen dan partijen in de gelegenheid stellen binnen een door het college te bepalen termijn schriftelijke
      opmerkingen te maken.

      2 De aankondiging hiervan geschiedt op een door het college te bepalen wijze.

      3 Van het voornemen om toepassing te geven aan het eerste lid doet het college mededeling aan partijen. Het college
      kan partijen in de gelegenheid stellen om hun wensen omtrent dat voornemen binnen een door hem te bepalen termijn
      schriftelijk aan hem kenbaar te maken.

      4 Partijen kunnen binnen vier weken na de dag van verzending aan hen van de schriftelijke opmerkingen schriftelijk
      hun zienswijze met betrekking tot die opmerkingen naar voren brengen. Het college kan deze termijn verlengen.

      5 Het college kan degenen die schriftelijke opmerkingen hebben gemaakt, uitnodigen ter zitting te verschijnen
      teneinde over hun opmerkingen te worden gehoord.

      6 Indien het college toepassing geeft aan het vijfde lid, wordt daarvan aan partijen mededeling gedaan in de
      uitnodiging, bedoeld in [artikel 8:56][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel856
