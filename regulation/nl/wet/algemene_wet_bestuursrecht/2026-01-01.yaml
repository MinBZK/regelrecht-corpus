  - number: 9:17
    text: |-
      Onder ombudsman wordt verstaan:

      a. de Nationale ombudsman, of

      b. een ombudsman of ombudscommissie ingesteld krachtens de [Gemeentewet][ref1], de [Provinciewet][ref2], de
      [Waterschapswet][ref3] of de [Wet gemeenschappelijke regelingen][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005416
      [ref2]: https://wetten.overheid.nl/BWBR0005645
      [ref3]: https://wetten.overheid.nl/BWBR0005108
