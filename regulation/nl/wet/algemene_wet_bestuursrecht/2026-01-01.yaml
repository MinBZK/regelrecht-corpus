  - number: 4:6
    text: |-
      1 Indien na een geheel of gedeeltelijk afwijzende beschikking een nieuwe aanvraag wordt gedaan, is de aanvrager
      gehouden nieuw gebleken feiten of veranderde omstandigheden te vermelden.

      2 Wanneer geen nieuw gebleken feiten of veranderde omstandigheden worden vermeld, kan het bestuursorgaan zonder
      toepassing te geven aan [artikel 4:5][ref1] de aanvraag afwijzen onder verwijzing naar zijn eerdere afwijzende
      beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:5
        hoofdstuk: '4'
        afdeling: 4.1.1
  - number: 4:7
    text: |-
      1 Voordat een bestuursorgaan een aanvraag tot het geven van een beschikking geheel of gedeeltelijk afwijst, stelt
      het de aanvrager in de gelegenheid zijn zienswijze naar voren te brengen indien:

      a. de afwijzing zou steunen op gegevens over feiten en belangen die de aanvrager betreffen, en

      b. die gegevens afwijken van gegevens die de aanvrager ter zake zelf heeft verstrekt.

      2 Het eerste lid geldt niet indien sprake is van een afwijking van de aanvraag die slechts van geringe betekenis
      voor de aanvrager kan zijn.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel47
  - number: 4:8
    text: |-
      1 Voordat een bestuursorgaan een beschikking geeft waartegen een belanghebbende die de beschikking niet heeft
      aangevraagd naar verwachting bedenkingen zal hebben, stelt het die belanghebbende in de gelegenheid zijn zienswijze
      naar voren te brengen indien:

      a. de beschikking zou steunen op gegevens over feiten en belangen die de belanghebbende betreffen, en

      b. die gegevens niet door de belanghebbende zelf ter zake zijn verstrekt.

      2 Het eerste lid geldt niet indien de belanghebbende niet heeft voldaan aan een wettelijke verplichting gegevens
      te verstrekken.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel48
  - number: 4:9
    text: |-
      Bij toepassing van de [artikelen 4:7][ref1] en [4:8][ref2] kan de belanghebbende naar keuze schriftelijk of
      mondeling zijn zienswijze naar voren brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel48
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:7
        hoofdstuk: '4'
        afdeling: 4.1.2
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:8
        hoofdstuk: '4'
        afdeling: 4.1.2
  - number: 4:11
    text: |-
      Het bestuursorgaan kan toepassing van de [artikelen 4:7][ref1] en [4:8][ref2] achterwege laten voor zover:

      a. de vereiste spoed zich daartegen verzet;

      b. de belanghebbende reeds eerder in de gelegenheid is gesteld zijn zienswijze naar voren te brengen en zich
      sindsdien geen nieuwe feiten of omstandigheden hebben voorgedaan, of

      c. het met de beschikking beoogde doel slechts kan worden bereikt indien de belanghebbende daarvan niet reeds
      tevoren in kennis is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel48
