  - number: 9:20
    text: |-
      1 Alvorens het verzoek aan een ombudsman te doen, dient de verzoeker over de gedraging een klacht in bij het
      betrokken bestuursorgaan, tenzij dit redelijkerwijs niet van hem kan worden gevergd.

      2 Het eerste lid geldt niet indien het verzoek betrekking heeft op de wijze van klachtbehandeling door het
      betrokken bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel920
  - number: 9:21
    text: |-
      Op het verkeer met de ombudsman is [hoofdstuk 2][ref1] van overeenkomstige toepassing, met uitzondering van
      [artikel 2:3, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel23
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel921
    references:
