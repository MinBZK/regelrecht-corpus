  - number: 4:20b
    text: |-
      1 Indien niet tijdig op de aanvraag tot het geven van een beschikking is beslist, is de gevraagde beschikking van
      rechtswege gegeven.

      2 De verlening van rechtswege geldt als een beschikking.

      3 In afwijking van [artikel 3:40][ref1] treedt de beschikking in werking op de derde dag na afloop van de
      beslistermijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel340
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel420b
