  - number: 8:105
    text: |-
      1 Het hoger beroep wordt ingesteld bij de Afdeling bestuursrechtspraak van de Raad van State,
      tenzij een andere hogerberoepsrechter bevoegd is ingevolge hoofdstuk 4 van de bij deze wet behorende
      [Bevoegdheidsregeling bestuursrechtspraak][ref1] dan wel ingevolge een ander wettelijk voorschrift.

      2 Het hoger beroep, bedoeld in [artikel 8:104, eerste lid, aanhef en onder c][ref2], wordt ingesteld bij de
      hogerberoepsrechter die ingevolge het eerste lid bevoegd is of zou zijn te oordelen over een uitspraak van de
      rechtbank omtrent het schadeveroorzakende besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8104
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel8105
