  - number: 1:7
    text: |-
      1 Indien door een bestuursorgaan ingevolge enig wettelijk voorschrift advies moet worden gevraagd of extern overleg
      moet worden gevoerd inzake een besluit alvorens een zodanig besluit kan worden genomen, geldt dat voorschrift
      niet indien het voorgenomen besluit uitsluitend strekt tot uitvoering van een bindend besluit van de Raad van de
      Europese Unie, van het Europees Parlement en de Raad gezamenlijk of van de Europese Commissie.

      2 Het eerste lid is niet van toepassing op het horen van de Raad van State.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel17
  - number: 1:8
    text: |-
      1 Indien door een bestuursorgaan ingevolge enig wettelijk voorschrift van het ontwerp van een besluit kennis moet
      worden gegeven alvorens een zodanig besluit kan worden genomen, geldt dat voorschrift niet indien het voorgenomen
      besluit uitsluitend strekt tot uitvoering van een bindend besluit van de Raad van de Europese Unie, van het
      Europees Parlement en de Raad gezamenlijk of van de Europese Commissie.

      2 Het eerste lid is niet van toepassing op de overlegging van het ontwerp van een algemene maatregel van bestuur of
      ministeriële regeling aan de Staten-Generaal, indien:

      a. bij de wet is bepaald dat door of namens een der Kamers der Staten-Generaal of door een aantal leden daarvan de
      wens te kennen kan worden gegeven dat het onderwerp of de inwerkingtreding van die algemene maatregel van bestuur
      of ministeriële regeling bij de wet wordt geregeld, of

      b. [artikel 21.6, vierde lid, van de Wet milieubeheer][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel21.6
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '21.6'
  - number: 1:9
    text: Deze titel is van overeenkomstige toepassing op voorstellen van wet.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel19
  - number: 2:1
    text: |-
      1 Een bestuursorgaan draagt zorg voor passende ondersteuning bij het verkeer met dat bestuursorgaan.

      2 Een ieder kan zich ter behartiging van zijn belangen in het verkeer met bestuursorganen laten bijstaan of door
      een gemachtigde laten vertegenwoordigen.

      3 Het bestuursorgaan kan van een gemachtigde een schriftelijke machtiging verlangen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel21
  - number: 2:2
    text: |-
      1 Het bestuursorgaan kan bijstand of vertegenwoordiging door een persoon tegen wie ernstige bezwaren bestaan,
      weigeren.

      2 De belanghebbende en de in het eerste lid bedoelde persoon worden van de weigering onverwijld schriftelijk in
      kennis gesteld.

      3 Het eerste lid is niet van toepassing ten aanzien van advocaten.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel22
  - number: 2:3
    text: |-
      1 Het bestuursorgaan zendt een bericht tot behandeling waarvan kennelijk een ander bestuursorgaan bevoegd is,
      onverwijld door naar dat orgaan, onder gelijktijdige mededeling daarvan aan de afzender.

      2 Het bestuursorgaan zendt een bericht dat niet voor hem bestemd is en dat ook niet wordt doorgezonden, zo spoedig
      mogelijk terug aan de afzender.

      3 Voor een elektronisch ontvangen bericht gelden het eerste en tweede lid slechts indien het bestuursorgaan uit het
      bericht, gelet op de wijze waarop het is verzonden, zonder nadere bewerking kan afleiden aan wie het bericht moet
      worden door- of teruggezonden.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel23
  - number: 2:4
    text: |-
      1 Het bestuursorgaan vervult zijn taak zonder vooringenomenheid.

      2 Het bestuursorgaan waakt ertegen dat tot het bestuursorgaan behorende of daarvoor werkzame personen die een
      persoonlijk belang bij een besluit hebben, de besluitvorming beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel24
  - number: 2:5
    text: |-
      1 Een ieder die is betrokken bij de uitvoering van de taak van een bestuursorgaan en daarbij de beschikking krijgt
      over gegevens waarvan hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, en voor wie niet reeds
      uit hoofde van ambt, beroep of wettelijk voorschrift ter zake van die gegevens een geheimhoudingsplicht geldt, is
      verplicht tot geheimhouding van die gegevens, behoudens voor zover enig wettelijk voorschrift hem tot mededeling
      verplicht of uit zijn taak de noodzaak tot mededeling voortvloeit.

      2 Het eerste lid is mede van toepassing op instellingen en daartoe behorende of daarvoor werkzame personen die door
      een bestuursorgaan worden betrokken bij de uitvoering van zijn taak, en op instellingen en daartoe behorende of
      daarvoor werkzame personen die een bij of krachtens de wet toegekende taak uitoefenen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel25
  - number: 2:6
    text: |-
      1 Bestuursorganen en onder hun verantwoordelijkheid werkzame personen gebruiken de Nederlandse taal, tenzij bij
      wettelijk voorschrift anders is bepaald.

      2 In afwijking van het eerste lid kan een andere taal worden gebruikt indien het gebruik daarvan doelmatiger is en
      de belangen van derden daardoor niet onevenredig worden geschaad.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel26
  - number: 2:7
    text: |-
      1 In het verkeer met een bestuursorgaan kan een bericht langs elektronische weg worden verzonden, tenzij een
      vormvoorschrift zich daartegen verzet.

      2 In het verkeer met een bestuursorgaan wordt het gebruik van de elektronische weg niet voorgeschreven voor een
      bericht dat tot een of meer geadresseerden is gericht.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel27
  - number: 2:8
    text: |-
      Een bestuursorgaan kan een bericht dat tot een of meer geadresseerden is gericht, slechts elektronisch verzenden
      voor zover de geadresseerde uitdrukkelijk kenbaar heeft gemaakt dat hij langs deze weg voldoende bereikbaar is.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel28
  - number: 2:9
    text: |-
      Indien een bestuursorgaan een bericht elektronisch verzendt, geschiedt dit op een voldoende betrouwbare en
      vertrouwelijke manier, gelet op de aard en de inhoud van het bericht en het doel waarvoor het wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel29
  - number: 2:10
    text: |-
      1 Indien een bestuursorgaan een bericht elektronisch verzendt door het bericht te plaatsen in een systeem voor
      gegevensverwerking waarin de geadresseerde toegang heeft tot het bericht, wordt aan de geadresseerde binnen 48
      uur elektronisch meegedeeld dat voor hem een bericht van het bestuursorgaan toegankelijk is geworden, tenzij de
      geadresseerde heeft laten weten een dergelijke kennisgeving niet te willen ontvangen.

      2

      3 Indien het bestuursorgaan gebruikmaakt van zowel een voorziening voor elektronisch berichtenverkeer en
      informatieverschaffing als bedoeld in [artikel 5, eerste lid, onderdeel f, van de Wet digitale overheid][ref1]
      als een andere voorziening, kan worden volstaan met kennisgeving van het toegankelijk worden van het bericht in de
      eerste voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0048156#Artikel5
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel210
    references:
      - id: ref1
        bwb_id: BWBR0048156
        artikel: '5'
  - number: 2:11
    text: |-
      1 Indien een bestuursorgaan een elektronisch bericht niet met succes kan bezorgen bij de geadresseerde, wordt het
      bericht nogmaals of op een andere wijze verzonden.

      2 Indien een bestuursorgaan een in [artikel 2:10][ref1] bedoelde kennisgeving niet met succes kan bezorgen bij de
      geadresseerde, wordt de kennisgeving nogmaals verzonden of spant het bestuursorgaan zich in om geadresseerde langs
      andere weg te informeren over het niet kunnen bezorgen van de kennisgeving en van de maatregelen die hij kan nemen
      om kennisgevingen te ontvangen.

      3 De tweede verzending van een bericht als bedoeld in het eerste lid geldt als tijdstip waarop het bericht is
      verzonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel210
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel211
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 2:10
        hoofdstuk: '2'
        paragraaf: 2.3.2
        afdeling: '2.3'
  - number: 2:12
    text: |-
      Een door een bestuursorgaan verzonden elektronisch bericht wordt gewijzigd of ingetrokken door de verzending van
      een nieuw bericht waarin de wijziging of intrekking wordt vermeld.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel212
  - number: 2:13
    text: |-
      1 Een ieder kan een bericht dat deel uitmaakt van een procedure over een besluit of een klacht of een ander
      krachtens wettelijk voorschrift voorgeschreven bericht elektronisch aan een bestuursorgaan zenden.

      2 Bij wettelijk voorschrift of bij besluit van het bestuursorgaan wordt voor ieder type bericht als bedoeld in
      het eerste lid, gelet op de aard en de inhoud van het type bericht en het doel waarvoor het wordt gebruikt, een
      voldoende betrouwbare en vertrouwelijke wijze van verzenden aangewezen.

      3 Bij wettelijk voorschrift of bij besluit van het bestuursorgaan kunnen nadere eisen worden gesteld, mits die
      eisen de mogelijkheid van elektronische verzending niet onevenredig belemmeren.

      4 Bij tijdelijke regeling van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan worden bepaald dat
      het eerste lid niet van toepassing is op in die tijdelijke regeling aangewezen berichten aan in die tijdelijke
      regeling aangewezen bestuursorganen voor een in die tijdelijke regeling bepaalde periode.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel213
  - number: 2:14
    text: |-
      Een ander bericht dan een bericht als bedoeld in [artikel 2:13, eerste lid][ref1], kan elektronisch aan een
      bestuursorgaan worden verzonden voor zover het bestuursorgaan kenbaar heeft gemaakt dat deze weg is geopend. Het
      bestuursorgaan kan nadere eisen stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel213
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel214
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 2:13
        hoofdstuk: '2'
        paragraaf: 2.3.3
        afdeling: '2.3'
  - number: 2:15
    text: |-
      1 Een bestuursorgaan kan elektronisch verschafte gegevens en bescheiden weigeren voor zover de aanvaarding daarvan
      tot een onevenredige belasting voor het bestuursorgaan zou leiden.

      2 Een bestuursorgaan kan een elektronisch verzonden bericht weigeren voor zover de betrouwbaarheid of
      vertrouwelijkheid van het bericht onvoldoende is gewaarborgd, gelet op de aard en de inhoud van het bericht en het
      doel waarvoor het wordt gebruikt.

      3 Het bestuursorgaan deelt een weigering op grond van dit artikel zo spoedig mogelijk aan de afzender mee.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel215
  - number: 2:16
    text: |-
      1 Indien een bericht als bedoeld in [artikel 2:13, eerste lid][ref1], niet is verzonden op de voor dat bericht
      aangewezen wijze, kan een bestuursorgaan ermee volstaan de afzender te wijzen op de juiste wijze van verzending,
      tenzij:

      a. het bestuursorgaan het bericht zonder nadere bewerking kan behandelen als ware het op de juiste wijze ingediend;

      b. het bericht een bezwaarschrift of een administratief beroepschrift betreft; of

      c. voor het type bericht geen wijze van verzending is aangewezen.

      2 Een bestuursorgaan is niet gehouden op een bericht als bedoeld in het eerste lid te reageren, indien het
      bericht is verzonden op een wijze die niet voor enig bericht als bedoeld in [artikel 2:13, eerste lid][ref2], is
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel213
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel213
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel216
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 2:13
        hoofdstuk: '2'
        paragraaf: 2.3.3
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 2:13
        hoofdstuk: '2'
        paragraaf: 2.3.3
        afdeling: '2.3'
  - number: 2:17
    text: |-
      1 Een bestuursorgaan bevestigt de ontvangst van een elektronisch bericht als bedoeld in
      [artikel 2:13, eerste lid][ref1], dat is verzonden overeenkomstig het tweede lid van dat artikel en met
      inachtneming van de nadere eisen, gesteld krachtens het derde lid van dat artikel, tenzij:

      a. het bestuursorgaan en de verzender gebruikmaken van hetzelfde systeem voor gegevensverwerking en de verzender in
      dat systeem kan zien dat het bericht voor het bestuursorgaan beschikbaar is; of

      b. van de verzender geen elektronisch adres beschikbaar is.

      2 Indien een bericht als bedoeld in [artikel 2:13, eerste lid][ref2], aan een bestuursorgaan wordt verzonden
      door de rechtstreekse invoer van gegevens in een systeem voor gegevensverwerking van het bestuursorgaan, stelt
      het bestuursorgaan de ingevoerde gegevens aan de verzender ter beschikking op een voldoende betrouwbare en
      vertrouwelijke manier.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel213
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel213
