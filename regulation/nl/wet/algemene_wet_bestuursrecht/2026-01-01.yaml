  - number: 1:2
    text: |-
      1 Onder belanghebbende wordt verstaan: degene wiens belang rechtstreeks bij een besluit is betrokken.

      2 Ten aanzien van bestuursorganen worden de hun toevertrouwde belangen als hun belangen beschouwd.

      3 Ten aanzien van rechtspersonen worden als hun belangen mede beschouwd de algemene en collectieve belangen die zij
      krachtens hun doelstellingen en blijkens hun feitelijke werkzaamheden in het bijzonder behartigen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel12
  - number: 1:3
    text: |-
      1 Onder besluit wordt verstaan: een schriftelijke beslissing van een bestuursorgaan, inhoudende een
      publiekrechtelijke rechtshandeling.

      2 Onder beschikking wordt verstaan: een besluit dat niet van algemene strekking is, met inbegrip van de afwijzing
      van een aanvraag daarvan.

      3 Onder aanvraag wordt verstaan: een verzoek van een belanghebbende, een besluit te nemen.

      4 Onder beleidsregel wordt verstaan: een bij besluit vastgestelde algemene regel, niet zijnde een algemeen
      verbindend voorschrift, omtrent de afweging van belangen, de vaststelling van feiten of de uitleg van wettelijke
      voorschriften bij het gebruik van een bevoegdheid van een bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel13
  - number: 1:4
    text: |-
      1 Onder bestuursrechter wordt verstaan: een onafhankelijk, bij de wet ingesteld orgaan dat met bestuursrechtspraak
      is belast.

      2 Onder hogerberoepsrechter wordt verstaan: een bestuursrechter die in hoger beroep oordeelt.

      3 Een tot de rechterlijke macht behorend gerecht wordt als bestuursrechter aangemerkt voor zover
      [hoofdstuk 8][ref1] of de [Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref2] - met uitzondering
      van [hoofdstuk VIII][ref3] - van toepassing of van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0004581
      [ref3]: https://wetten.overheid.nl/BWBR0004581#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel14
    references:
