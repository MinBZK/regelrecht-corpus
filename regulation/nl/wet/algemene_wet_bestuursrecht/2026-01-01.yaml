  - number: 9:24
    text: |-
      1 Voorts is de ombudsman niet verplicht een onderzoek in te stellen of voort te zetten, indien het verzoek wordt
      ingediend later dan een jaar:

      a. na de kennisgeving door het bestuursorgaan van de bevindingen van het onderzoek, of

      b. nadat de klachtbehandeling door het bestuursorgaan op andere wijze is geëindigd, dan wel ingevolge wettelijk
      voorschrift beëindigd had moeten zijn.

      2 In afwijking van het eerste lid eindigt de termijn een jaar nadat de gedraging heeft plaatsgevonden, indien
      redelijkerwijs niet van verzoeker kan worden gevergd dat hij eerst een klacht bij het bestuursorgaan indient.
      Is de gedraging binnen een jaar nadat zij plaatsvond, aan het oordeel van een andere rechterlijke instantie dan
      een bestuursrechter onderworpen, of is daartegen bezwaar gemaakt, administratief beroep ingesteld dan wel beklag
      gedaan, dan eindigt de termijn een jaar na de datum waarop:

      a. in die procedure een uitspraak is gedaan waartegen geen beroep meer openstaat, of

      b. de procedure op een andere wijze is geëindigd.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel924
  - number: 9:25
    text: |-
      1 Indien de ombudsman op grond van [artikel 9:22][ref1], [9:23][ref2] of [9:24][ref3] geen onderzoek instelt of
      dit niet voortzet, deelt hij dit onder vermelding van de redenen zo spoedig mogelijk schriftelijk aan de verzoeker
      mede.

      2 In het geval dat hij een onderzoek niet voortzet, doet hij de in het eerste lid bedoelde mededeling tevens aan
      het bestuursorgaan en, in voorkomend geval, aan degene op wiens gedraging het onderzoek betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel922
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel923
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel924
