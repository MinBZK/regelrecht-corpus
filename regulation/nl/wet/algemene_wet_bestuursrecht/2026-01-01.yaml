        bwb_id: BWBR0005537
        artikel: 3:12
        hoofdstuk: '3'
        afdeling: '3.4'
  - number: 3:19
    text: |-
      1 Indien er sprake is van besluiten die nodig zijn om een bepaalde activiteit te mogen verrichten of besluiten
      die strekken tot het vaststellen van een financiële aanspraak met het oog op die activiteit, bevordert het
      bestuursorgaan dat een aanvrager in kennis wordt gesteld van andere op aanvraag te nemen besluiten waarvan het
      bestuursorgaan redelijkerwijs kan aannemen dat deze nodig zijn voor de door de aanvrager te verrichten activiteit.

      2 Bij de kennisgeving wordt per besluit in ieder geval vermeld:

      a. naam en adres van het bestuursorgaan, bevoegd tot het nemen van het besluit;

      b. krachtens welk wettelijk voorschrift het besluit wordt genomen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel319
  - number: 3:20
    text: |-
      Deze afdeling is van toepassing op besluiten ten aanzien waarvan dat is bepaald:

      a. bij wettelijk voorschrift; of

      b. bij besluit van de tot het nemen van die besluiten bevoegde bestuursorganen (coördinatiebesluit).
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel320
  - number: 3:21
    text: |-
      1 Bij of krachtens het wettelijk voorschrift, bedoeld in [artikel 3:20, onderdeel a][ref1], of in het
      coördinatiebesluit wordt een coördinerend bestuursorgaan aangewezen.

      2 Indien het in een coördinatiebesluit als coördinerend bestuursorgaan aan te wijzen bestuursorgaan niet bevoegd
      is tot het nemen van een of meer van de te coördineren besluiten, behoeft de aanwijzing de instemming van dat
      bestuursorgaan.

      3 Indien redelijkerwijs niet valt te verwachten dat toepassing van deze afdeling op een besluit de voortgang van
      de besluitvorming over de te coördineren besluiten in betekenende mate zal versnellen of dat aan deze toepassing
      anderszins aanmerkelijke voordelen zijn verbonden, kan het coördinerend bestuursorgaan besluiten deze afdeling ten
      aanzien van dat besluit niet, niet verder of later toe te passen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel320
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel321
