        artikel: 3:12
        hoofdstuk: '3'
        afdeling: '3.4'
  - number: 3:14
    text: |-
      1 Het bestuursorgaan vult de ter inzage gelegde stukken aan met nieuwe relevante stukken en gegevens.

      2 [Artikel 3:11, tweede tot en met derde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel311
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel314
    references:
