  - number: 5:38
    text: |-
      1 Indien uit een beschikking tot intrekking of wijziging van de last onder dwangsom voortvloeit dat een reeds
      gegeven beschikking tot invordering van die dwangsom niet in stand kan blijven, vervalt die beschikking.

      2 Het bestuursorgaan kan een nieuwe beschikking tot invordering geven die in overeenstemming is met de gewijzigde
      last onder dwangsom.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel538
  - number: 5:39
    text: |-
      1 Het bezwaar, beroep of hoger beroep tegen de last onder dwangsom heeft mede betrekking op een beschikking die
      strekt tot invordering van de dwangsom, voor zover de belanghebbende deze beschikking betwist.

      2 De bestuursrechter kan de beslissing op het beroep of hoger beroep tegen de beschikking tot invordering echter
      verwijzen naar een ander orgaan, indien behandeling door dit orgaan gewenst is.

      3 In beroep of hoger beroep legt de belanghebbende zo mogelijk een afschrift over van de beschikking die hij
      betwist.

      4 Het eerste tot en met het derde lid zijn van overeenkomstige toepassing op een verzoek om voorlopige voorziening.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel539
  - number: 5:40
    text: |-
      1 Onder bestuurlijke boete wordt verstaan: de bestraffende sanctie, inhoudende een onvoorwaardelijke verplichting
      tot betaling van een geldsom.

      2 Deze titel is niet van toepassing op de intrekking of wijziging van een aanspraak op financiële middelen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel540
  - number: 5:41
    text: |-
      Het bestuursorgaan legt geen bestuurlijke boete op voor zover de overtreding niet aan de overtreder kan worden
      verweten.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel541
  - number: 5:42
    text: |-
      1 Het bestuursorgaan legt geen bestuurlijke boete op indien de overtreder is overleden.

      2 Een bestuurlijke boete vervalt indien zij op het tijdstip van het overlijden van de overtreder niet
      onherroepelijk is. Een onherroepelijke bestuurlijke boete vervalt voor zover zij op dat tijdstip nog niet is
      betaald.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel542
  - number: 5:43
    text: |-
      Het bestuursorgaan legt geen bestuurlijke boete op indien aan de overtreder wegens dezelfde
      overtreding reeds eerder een bestuurlijke boete is opgelegd, dan wel een kennisgeving als bedoeld in
      [artikel 5:50, tweede lid, aanhef en onderdeel a][ref1], is bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel550
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel543
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 5:50
        hoofdstuk: '5'
        afdeling: 5.4.2
  - number: 5:44
    text: |-
      1 Het bestuursorgaan legt geen bestuurlijke boete op indien tegen de overtreder wegens dezelfde gedraging een
      strafvervolging is ingesteld en het onderzoek ter terechtzitting is begonnen, dan wel een strafbeschikking is
      uitgevaardigd.

      2 Indien de gedraging tevens een strafbaar feit is, wordt zij aan de officier van justitie voorgelegd, tenzij bij
      wettelijk voorschrift is bepaald, dan wel met het openbaar ministerie is overeengekomen, dat daarvan kan worden
      afgezien.

      3 Voor een gedraging die aan de officier van justitie moet worden voorgelegd, legt het bestuursorgaan slechts een
      bestuurlijke boete op indien:

      a. de officier van justitie aan het bestuursorgaan heeft medegedeeld ten aanzien van de overtreder van
      strafvervolging af te zien, of

      b. het bestuursorgaan niet binnen dertien weken een reactie van de officier van justitie heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel544
  - number: 5:45
    text: |-
      1 Indien [artikel 5:53][ref1] van toepassing is, vervalt de bevoegdheid tot het opleggen van een bestuurlijke boete
      vijf jaren nadat de overtreding heeft plaatsgevonden.

      2 In de overige gevallen vervalt de bevoegdheid tot het opleggen van een bestuurlijke boete drie jaren nadat de
      overtreding heeft plaatsgevonden.

      3 Indien tegen de bestuurlijke boete bezwaar wordt gemaakt of beroep wordt ingesteld, wordt de vervaltermijn
      opgeschort tot onherroepelijk op het bezwaar of beroep is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel553
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel545
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 5:53
        hoofdstuk: '5'
        afdeling: 5.4.2
  - number: 5:46
    text: |-
      1 De wet bepaalt de bestuurlijke boete die wegens een bepaalde overtreding ten hoogste kan worden opgelegd.

      2 Tenzij de hoogte van de bestuurlijke boete bij wettelijk voorschrift is vastgesteld, stemt het bestuursorgaan de
      bestuurlijke boete af op de ernst van de overtreding en de mate waarin deze aan de overtreder kan worden verweten.
      Het bestuursorgaan houdt daarbij zo nodig rekening met de omstandigheden waaronder de overtreding is gepleegd.

      3 Indien de hoogte van de bestuurlijke boete bij wettelijk voorschrift is vastgesteld, legt het bestuursorgaan
      niettemin een lagere bestuurlijke boete op indien de overtreder aannemelijk maakt dat de vastgestelde bestuurlijke
      boete wegens bijzondere omstandigheden te hoog is.

      4 [Artikel 1, tweede lid, van het Wetboek van Strafrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel1
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel546
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '1'
  - number: 5:47
    text: |-
      Een bestuurlijke boete die is opgelegd wegens een gedraging die tevens een strafbaar feit is, vervalt indien
      het gerechtshof met toepassing van [artikel 12i van het Wetboek van Strafvordering][ref1] de vervolging van de
      overtreder voor dat feit beveelt.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel12i
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel547
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 12i
  - number: 5:48
    text: |-
      1 Het bestuursorgaan en de voor de overtreding bevoegde toezichthouder kunnen van de overtreding een rapport
      opmaken.

      2 Het rapport is gedagtekend en vermeldt:

      a. de naam van de overtreder;

      b. de overtreding alsmede het overtreden voorschrift;

      c. zo nodig een aanduiding van de plaats waar en het tijdstip waarop de overtreding is geconstateerd.

      3 Een afschrift van het rapport wordt uiterlijk bij de bekendmaking van de beschikking tot oplegging van de
      bestuurlijke boete aan de overtreder toegezonden of uitgereikt.

      4 Indien van de overtreding een proces-verbaal als bedoeld in [artikel 152 van het Wetboek van Strafvordering][ref1]
      is opgemaakt, treedt dit voor de toepassing van deze afdeling in de plaats van het rapport.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel152
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel548
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '152'
  - number: 5:49
    text: |-
      1 Het bestuursorgaan stelt de overtreder desgevraagd in de gelegenheid de gegevens waarop het opleggen van de
      bestuurlijke boete, dan wel het voornemen daartoe, berust, in te zien en daarvan afschriften te vervaardigen.

      2 Voor zover blijkt dat de verdediging van de overtreder dit redelijkerwijs vergt, draagt het bestuursorgaan er
      zoveel mogelijk zorg voor dat deze gegevens aan de overtreder worden medegedeeld in een voor deze begrijpelijke
      taal.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel549
  - number: 5:50
    text: |-
      1 Indien de overtreder in de gelegenheid wordt gesteld over het voornemen tot het opleggen van een bestuurlijke
      boete zijn zienswijze naar voren te brengen,

      a. wordt het rapport reeds bij de uitnodiging daartoe aan de overtreder toegezonden of uitgereikt;

      b. zorgt het bestuursorgaan voor bijstand door een tolk, indien blijkt dat de verdediging van de overtreder dit
      redelijkerwijs vergt.

      2 Indien het bestuursorgaan nadat de overtreder zijn zienswijze naar voren heeft gebracht, beslist dat:

      a. voor de overtreding geen bestuurlijke boete zal worden opgelegd, of

      b. de overtreding alsnog aan de officier van justitie zal worden voorgelegd,

      wordt dit schriftelijk aan de overtreder medegedeeld.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel550
  - number: 5:51
    text: |-
      1 Indien van de overtreding een rapport is opgemaakt, beslist het bestuursorgaan omtrent het opleggen van de
      bestuurlijke boete binnen dertien weken na de dagtekening van het rapport.

      2 De beslistermijn wordt opgeschort met ingang van de dag waarop de gedraging aan het openbaar ministerie is
      voorgelegd, tot de dag waarop het bestuursorgaan weer bevoegd wordt een bestuurlijke boete op te leggen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel551
  - number: 5:52
    text: |-
      De beschikking tot oplegging van de bestuurlijke boete vermeldt:

      a. de naam van de overtreder;

      b. het bedrag van de boete.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel552
  - number: 5:53
    text: |-
      1 Dit artikel is van toepassing indien voor de overtreding een bestuurlijke boete van meer dan € 340 kan worden
      opgelegd, tenzij bij wettelijk voorschrift anders is bepaald.

      2 In afwijking van [artikel 5:48][ref1] wordt van de overtreding steeds een rapport of proces-verbaal opgemaakt.

      3 In afwijking van [afdeling 4.1.2][ref2] wordt de overtreder steeds in de gelegenheid gesteld zijn zienswijze naar
      voren te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel548
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel553
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 5:48
        hoofdstuk: '5'
        afdeling: 5.4.2
      - id: ref2
        bwb_id: BWBR0005537
        hoofdstuk: '4'
        afdeling: 4.1.2
  - number: 5:54
    text: |-
      Deze titel is van overeenkomstige toepassing op andere bestraffende sancties, voor zover dit bij wettelijk
      voorschrift is bepaald.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel554
  - number: 6:1
    text: |-
      De [hoofdstukken 6][ref1] en [7][ref2] zijn van overeenkomstige toepassing indien is voorzien in de mogelijkheid
      van bezwaar of beroep tegen andere handelingen van bestuursorganen dan besluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005537
        hoofdstuk: '7'
  - number: 6:2
    text: |-
      Voor de toepassing van wettelijke voorschriften over bezwaar en beroep worden met een besluit gelijkgesteld:

      a. de schriftelijke weigering een besluit te nemen, en

      b. het niet tijdig nemen van een besluit.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel62
  - number: 6:3
    text: |-
      Een beslissing inzake de procedure ter voorbereiding van een besluit is niet vatbaar voor bezwaar of beroep, tenzij
      deze beslissing de belanghebbende los van het voor te bereiden besluit rechtstreeks in zijn belang treft.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel63
  - number: 6:4
    text: |-
      1 Het maken van bezwaar geschiedt door het indienen van een bezwaarschrift bij het bestuursorgaan dat het besluit
      heeft genomen.

      2 Het instellen van administratief beroep geschiedt door het indienen van een beroepschrift bij het beroepsorgaan.

      3 Het instellen van beroep bij een bestuursrechter geschiedt door het indienen van een beroepschrift bij die
      rechter.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel64
  - number: 6:5
    text: |-
      1 Het bezwaar- of beroepschrift wordt ondertekend en bevat ten minste:

      a. de naam en het adres van de indiener;

      b. de dagtekening;

      c. een omschrijving van het besluit waartegen het bezwaar of beroep is gericht;

      d. de gronden van het bezwaar of beroep.

      2 Bij het beroepschrift wordt zo mogelijk een afschrift van het besluit waarop het geschil betrekking heeft,
      overgelegd.

      3 Indien het bezwaar- of beroepschrift in een vreemde taal is gesteld en een vertaling voor een goede behandeling
      van het bezwaar of beroep noodzakelijk is, dient de indiener zorg te dragen voor een vertaling.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel65
  - number: 6:6
    text: |-
      Het bezwaar of beroep kan niet-ontvankelijk worden verklaard, indien:

      a. niet is voldaan aan [artikel 6:5][ref1] of aan enig ander bij de wet gesteld vereiste voor het in behandeling
      nemen van het bezwaar of beroep, of

      b. het bezwaar- of beroepschrift geheel of gedeeltelijk is geweigerd op grond van [artikel 2:15][ref2],

      mits de indiener de gelegenheid heeft gehad het verzuim te herstellen binnen een hem daartoe gestelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel215
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 6:5
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 2:15
        hoofdstuk: '2'
        paragraaf: 2.3.3
        afdeling: '2.3'
  - number: 6:7
    text: De termijn voor het indienen van een bezwaar- of beroepschrift bedraagt zes weken.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel67
  - number: 6:8
    text: |-
      1 De termijn vangt aan met ingang van de dag na die waarop het besluit op de voorgeschreven wijze is bekendgemaakt.

      2 De termijn voor het indienen van een bezwaarschrift tegen een besluit waartegen alleen door een of meer bepaalde
      belanghebbenden administratief beroep kon worden ingesteld, vangt aan met ingang van de dag na die waarop de
      beroepstermijn ongebruikt is verstreken.

      3 De termijn voor het indienen van een beroepschrift tegen een besluit dat aan goedkeuring is onderworpen,
      vangt aan met ingang van de dag na die waarop het besluit, inhoudende de goedkeuring van dat besluit, op de
      voorgeschreven wijze is bekendgemaakt.

      4 De termijn voor het indienen van een beroepschrift tegen een besluit dat tot een of meer belanghebbenden is
      gericht en dat is voorbereid met toepassing van [afdeling 3.4][ref1] vangt aan met ingang van de dag na die waarop
      het besluit overeenkomstig [artikel 3:44, eerste lid, onderdeel a][ref2], ter inzage is gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel344
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '3'
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 3:44
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: 6:9
    text: |-
      1 Een bezwaar- of beroepschrift is tijdig ingediend indien het voor het einde van de termijn is ontvangen.

      2 Bij verzending per post is een bezwaar- of beroepschrift tijdig ingediend indien het voor het einde van de
      termijn ter post is bezorgd, mits het niet later dan een week na afloop van de termijn is ontvangen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel69
  - number: 6:10
    text: |-
      1 Ten aanzien van een voor het begin van de termijn ingediend bezwaar- of beroepschrift blijft niet-
      ontvankelijkverklaring op grond daarvan achterwege indien het besluit ten tijde van de indiening:

      a. wel reeds tot stand was gekomen, of

      b. nog niet tot stand was gekomen, maar de indiener redelijkerwijs kon menen dat dit wel reeds het geval was.

      2 De behandeling van het bezwaar of beroep kan worden aangehouden tot het begin van de termijn.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel610
  - number: 6:11
    text: |-
      Ten aanzien van een na afloop van de termijn ingediend bezwaar- of beroepschrift blijft niet-ontvankelijkverklaring
      op grond daarvan achterwege indien redelijkerwijs niet kan worden geoordeeld dat de indiener in verzuim is geweest.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel611
  - number: 6:12
    text: |-
      1 Indien het beroep is gericht tegen het niet tijdig nemen van een besluit dan wel het niet tijdig bekendmaken van
      een van rechtswege verleende beschikking, is het niet aan een termijn gebonden.

      2 Het beroepschrift kan worden ingediend zodra:

      a. het bestuursorgaan in gebreke is tijdig een besluit te nemen of een van rechtswege verleende beschikking bekend
      te maken, en

      b. twee weken zijn verstreken na de dag waarop belanghebbende het bestuursorgaan schriftelijk heeft medegedeeld dat
      het in gebreke is.

      3 Indien redelijkerwijs niet van de belanghebbende kan worden gevergd dat hij het bestuursorgaan in gebreke stelt,
      kan het beroepschrift worden ingediend zodra het bestuursorgaan in gebreke is tijdig een besluit te nemen.

      4 Het beroep is niet-ontvankelijk indien het beroepschrift onredelijk laat is ingediend.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel612
  - number: 6:13
    text: |-
      Geen beroep bij de bestuursrechter kan worden ingesteld door een belanghebbende aan wie redelijkerwijs kan worden
      verweten dat hij geen zienswijzen als bedoeld in [artikel 3:15][ref1] naar voren heeft gebracht, geen bezwaar heeft
      gemaakt of geen administratief beroep heeft ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel315
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel613
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 3:15
        hoofdstuk: '3'
        afdeling: '3.4'
  - number: 6:14
    text: |-
      1 Het orgaan waarbij het bezwaar- of beroepschrift is ingediend, bevestigt de ontvangst daarvan schriftelijk.

      2 Het orgaan waarbij het beroepschrift is ingediend, geeft daarvan zo spoedig mogelijk kennis aan het
      bestuursorgaan dat het bestreden besluit heeft genomen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel614
  - number: 6:15
    text: |-
      1 Indien het bezwaar- of beroepschrift wordt ingediend bij een onbevoegd bestuursorgaan of bij een onbevoegde
      bestuursrechter, wordt het, onder vermelding van de datum van ontvangst, zo spoedig mogelijk doorgezonden aan het
      bevoegde orgaan, onder gelijktijdige mededeling hiervan aan de afzender.

      2 Het eerste lid is van overeenkomstige toepassing indien in plaats van een bezwaarschrift een beroepschrift is
      ingediend of omgekeerd.

      3 Het tijdstip van indiening bij het onbevoegde orgaan is bepalend voor de vraag of het bezwaar- of beroepschrift
      tijdig is ingediend, behoudens in geval van kennelijk onredelijk gebruik van procesrecht.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel615
  - number: 6:16
    text: |-
      Het bezwaar of beroep schorst niet de werking van het besluit waartegen het is gericht, tenzij bij of krachtens
      wettelijk voorschrift anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel616
  - number: 6:17
    text: |-
      Indien iemand zich laat vertegenwoordigen, stelt het orgaan dat bevoegd is op het bezwaar of beroep te beslissen,
      de op de zaak betrekking hebbende stukken in ieder geval ter beschikking aan de gemachtigde.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel617
  - number: 6:19
    text: |-
      1 Het bezwaar of beroep heeft van rechtswege mede betrekking op een besluit tot intrekking, wijziging of vervanging
      van het bestreden besluit, tenzij partijen daarbij onvoldoende belang hebben.

      2 Het eerste lid geldt ook indien het bezwaar is gemaakt of het beroep is ingesteld nadat het bestuursorgaan het
      bestreden besluit heeft ingetrokken, gewijzigd of vervangen.

      3 Het bestuursorgaan stelt het nieuwe besluit onverwijld ter beschikking aan het orgaan waarbij het beroep
      aanhangig is.

      4 Indien een ander orgaan een bezwaar- of beroepschrift tegen het nieuwe besluit ontvangt, zendt het dit met
      toepassing van [artikel 6:15, eerste en tweede lid][ref1], door.

      5 De bestuursrechter kan het beroep tegen het nieuwe besluit echter verwijzen naar een ander orgaan, indien
      behandeling door dit orgaan gewenst is.

      6 Intrekking of vervanging van het bestreden besluit staat niet in de weg aan vernietiging van dat besluit indien
      de indiener van het bezwaar- of beroepschrift daarbij belang heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel615
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel619
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 6:15
        hoofdstuk: '6'
        afdeling: '6.2'
  - number: 6:20
    text: |-
      1 Indien het beroep zich richt tegen het niet tijdig nemen van een besluit, blijft het bestuursorgaan verplicht
      dit besluit te nemen, tenzij de belanghebbende daarbij als gevolg van de beslissing op het beroep geen belang meer
      heeft.

      2 Het bestuursorgaan stelt een besluit als bedoeld in het eerste lid onverwijld ter beschikking aan het orgaan
      waarbij het beroep aanhangig is.

      3 Het beroep tegen het niet tijdig nemen van een besluit heeft mede betrekking op het alsnog genomen besluit,
      tenzij dit geheel aan het beroep tegemoet komt.

      4 De beslissing op het beroep kan echter worden verwezen naar een ander orgaan waarbij bezwaar of beroep tegen het
      alsnog genomen besluit aanhangig is, dan wel kan of kon worden gemaakt of ingesteld.

      5 Het beroep tegen het niet tijdig nemen van een besluit kan alsnog gegrond worden verklaard, indien de indiener
      van het beroepschrift daarbij belang heeft.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel620
  - number: 6:21
    text: |-
      1 Het bezwaar of beroep kan schriftelijk worden ingetrokken.

      2 Tijdens het horen kan de intrekking ook mondeling geschieden.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel621
  - number: 6:22
    text: |-
      Een besluit waartegen bezwaar is gemaakt of beroep is ingesteld, kan, ondanks schending van een geschreven of
      ongeschreven rechtsregel of algemeen rechtsbeginsel, door het orgaan dat op het bezwaar of beroep beslist in stand
      worden gelaten indien aannemelijk is dat de belanghebbenden daardoor niet zijn benadeeld.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel622
  - number: 6:23
    text: |-
      1 Indien beroep kan worden ingesteld tegen de beslissing op het bezwaar of beroep, wordt daarvan bij de
      bekendmaking van de beslissing melding gemaakt.

      2 Hierbij wordt vermeld door wie, binnen welke termijn en bij welk orgaan beroep kan worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel623
  - number: 6:24
    text: |-
      Deze afdeling is met uitzondering van [artikel 6:12][ref1] van overeenkomstige toepassing indien hoger beroep,
      incidenteel hoger beroep, beroep in cassatie of incidenteel beroep in cassatie kan worden ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel612
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel624
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 6:12
        hoofdstuk: '6'
        afdeling: '6.2'
  - number: 7:1
    text: |-
      1 Degene aan wie het recht is toegekend beroep bij een bestuursrechter in te stellen, dient alvorens beroep in te
      stellen bezwaar te maken, tenzij:

      a. het besluit in bezwaar of in administratief beroep is genomen,

      b. het besluit aan goedkeuring is onderworpen,

      c. het besluit een goedkeuring of een weigering daarvan inhoudt,

      d. het besluit is voorbereid met toepassing van [afdeling 3.4][ref1],

      e. het besluit is genomen op basis van een uitspraak waarin de bestuursrechter met toepassing van
      [artikel 8:72, vierde lid, onderdeel a][ref2], heeft bepaald dat [afdeling 3.4][ref3] geheel of gedeeltelijk buiten
      toepassing blijft,

      f. het beroep zich richt tegen het niet tijdig nemen van een besluit,

      g. het besluit is genomen op grond van een voorschrift als genoemd in de bij deze wet behorende Regeling
      rechtstreeks beroep dan wel het besluit anderszins in die regeling is omschreven.

      2 Tegen de beslissing op het bezwaar kan beroep worden ingesteld met toepassing van de voorschriften die gelden
      voor het instellen van beroep tegen het besluit waartegen bezwaar is gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel872
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '3'
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 8:72
        hoofdstuk: '8'
        afdeling: 8.2.6
      - id: ref3
        bwb_id: BWBR0005537
        hoofdstuk: '3'
        afdeling: '3.4'
  - number: 7:1a
    text: |-
      1 In het bezwaarschrift kan de indiener het bestuursorgaan verzoeken in te stemmen met rechtstreeks beroep bij de
      bestuursrechter, zulks in afwijking van [artikel 7:1][ref1].

      2 Het bestuursorgaan wijst het verzoek in ieder geval af, indien tegen het besluit een ander bezwaarschrift is
      ingediend waarin eenzelfde verzoek ontbreekt, tenzij dat andere bezwaarschrift kennelijk niet-ontvankelijk is.

      3 Het bestuursorgaan kan instemmen met het verzoek indien de zaak daarvoor geschikt is.

      4 Het bestuursorgaan beslist zo spoedig mogelijk op het verzoek. Een beslissing tot instemming wordt genomen
      zodra redelijkerwijs kan worden aangenomen dat geen nieuwe bezwaarschriften zullen worden ingediend. De
      [artikelen 4:7][ref2] en [4:8][ref3] zijn niet van toepassing.

      5 Indien het bestuursorgaan instemt met het verzoek zendt het het bezwaarschrift, onder vermelding van de datum van
      ontvangst, onverwijld door aan de bevoegde rechter.

      6 Een na de instemming ontvangen bezwaarschrift wordt eveneens onverwijld doorgezonden aan de bevoegde
      rechter. Indien dit bezwaarschrift geen verzoek als bedoeld in het eerste lid bevat, wordt, in afwijking van
      [artikel 8:41, eerste lid][ref4], geen griffierecht geheven.


