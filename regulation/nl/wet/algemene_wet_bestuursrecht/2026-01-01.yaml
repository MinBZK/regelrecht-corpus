  - number: 8:41a
    text: De bestuursrechter beslecht het hem voorgelegde geschil zoveel mogelijk definitief.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel841a
  - number: 8:42
    text: |-
      1 Binnen vier weken na de dag van verzending van de gronden van het beroepschrift aan het bestuursorgaan zendt dit
      de op de zaak betrekking hebbende stukken aan de bestuursrechter en kan het een verweerschrift indienen. Indien de
      bestuursrechter om een verweerschrift heeft verzocht, dient het bestuursorgaan binnen vier weken een verweerschrift
      in.

      2 De bestuursrechter kan de in het eerste lid bedoelde termijnen verlengen.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel842
  - number: 8:43
    text: |-
      1 De bestuursrechter kan de indiener van het beroepschrift in de gelegenheid stellen schriftelijk te repliceren. In
      dat geval wordt het bestuursorgaan in de gelegenheid gesteld schriftelijk te dupliceren. De bestuursrechter stelt
      de termijnen voor repliek en dupliek vast.

      2 De bestuursrechter stelt andere partijen dan de in het eerste lid bedoelde in de gelegenheid om ten minste
      eenmaal een schriftelijke uiteenzetting over de zaak te geven. Hij stelt hiervoor een termijn vast.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel843
  - number: 8:44
    text: |-
      1 De bestuursrechter kan partijen oproepen om in persoon dan wel in persoon of bij gemachtigde te verschijnen om
      te worden gehoord, al dan niet voor het geven van inlichtingen. Indien niet alle partijen worden opgeroepen, worden
      de niet opgeroepen partijen in de gelegenheid gesteld het horen bij te wonen en een uiteenzetting over de zaak
      te geven.

      2 Van het geven van inlichtingen wordt door de griffier een proces-verbaal opgemaakt.

      3 Het wordt door de voorzitter en de griffier ondertekend. Bij verhindering van de voorzitter of de griffier wordt
      dit in het proces-verbaal vermeld.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel844
  - number: 8:45
    text: |-
      1 De bestuursrechter kan partijen en anderen verzoeken binnen een door hem te bepalen termijn schriftelijk
      inlichtingen te geven en onder hen berustende stukken in te zenden.

      2 Bestuursorganen zijn, ook als zij geen partij zijn, verplicht aan het verzoek, bedoeld in het eerste lid, te
      voldoen. [Artikel 8:29][ref1] is van overeenkomstige toepassing.

      3 Werkgevers van partijen zijn, ook als zij geen partij zijn, verplicht aan het verzoek, bedoeld in het eerste lid,
      te voldoen. [Artikel 8:29][ref2] is van overeenkomstige toepassing.

      4 Van het voornemen van de bestuursrechter tot het vragen van inlichtingen of advies aan de Europese Commissie
      krachtens artikel 15, eerste lid, van Verordening (EG) nr. 1/2003 van de Raad van 16 december 2002 betreffende de
      uitvoering van de mededingingsregels van de artikelen 81 en 82 van het Verdrag (PbEG 2003, L 1) wordt aan partijen
      mededeling gedaan. De bestuursrechter kan partijen in de gelegenheid stellen om hun wensen omtrent de te vragen
      inlichtingen of het te vragen advies binnen een door hem te bepalen termijn schriftelijk aan hem kenbaar te maken.

      5 Op het verstrekken van inlichtingen of advies door de Europese Commissie is [artikel 8:29][ref3] van
      overeenkomstige toepassing.

      6 Partijen kunnen binnen vier weken na de dag van verzending aan hen van de inlichtingen of het advies van de
      Europese Commissie schriftelijk hun zienswijze met betrekking tot de inlichtingen of het advies naar voren brengen.
      De bestuursrechter kan deze termijn verlengen.


