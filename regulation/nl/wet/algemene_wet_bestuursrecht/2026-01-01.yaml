  - number: 7:7
    text: Van het horen wordt een verslag gemaakt.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel77
  - number: 7:8
    text: Op verzoek van de belanghebbende kunnen door hem meegebrachte getuigen en deskundigen worden gehoord.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel78
  - number: 7:9
    text: |-
      Wanneer na het horen aan het bestuursorgaan feiten of omstandigheden bekend worden die voor de op het bezwaar te
      nemen beslissing van aanmerkelijk belang kunnen zijn, wordt dit aan belanghebbenden meegedeeld en worden zij in de
      gelegenheid gesteld daarover te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0005537/2026-01-01#Artikel79
  - number: 7:10
    text: |-
      1 Het bestuursorgaan beslist binnen zes weken of – indien een commissie als bedoeld in [artikel 7:13][ref1]
      is ingesteld – binnen twaalf weken, gerekend vanaf de dag na die waarop de termijn voor het indienen van het
      bezwaarschrift is verstreken.

      2 De termijn wordt opgeschort gerekend vanaf de dag na die waarop de indiener is verzocht een verzuim als bedoeld
      in [artikel 6:6][ref2] te herstellen, tot de dag waarop het verzuim is hersteld of de daarvoor gestelde termijn
      ongebruikt is verstreken.

      3 Het bestuursorgaan kan de beslissing voor ten hoogste zes weken verdagen.

      4 Verder uitstel is mogelijk voor zover:

      a. alle belanghebbenden daarmee instemmen,

      b. de indiener van het bezwaarschrift daarmee instemt en andere belanghebbenden daardoor niet in hun belangen
      kunnen worden geschaad, of

      c. dit nodig is in verband met de naleving van wettelijke procedurevoorschriften.

      5 Indien toepassing is gegeven aan het tweede, derde of vierde lid, doet het bestuursorgaan hiervan schriftelijk
      mededeling aan belanghebbenden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel713
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel66
