      het betreft de weigering om een besluit tot vernietiging te nemen en het niet tijdig nemen van een besluit tot
      vernietiging en voor zover het betreft de weigering om een voordracht tot vernietiging te doen Burgerlijk Wetboek:
      a. [Boek 1][ref7]: 1. [artikel 7, eerste en tweede lid][ref8] 2. [titel 14, afdeling 4][ref9] b. [Boek 2][ref10]:
      de [artikelen 63d, tweede lid][ref11], [156][ref12] en [266][ref13], voor zover de aanvraag is toegewezen c.
      [Boek 7][ref14]: [artikel 671a][ref15]. [Elektriciteitswet 1998][ref16]: de [artikelen 9b, vierde lid][ref17],
