    text: |-
      Tegen een uitspraak van de rechtbank of van de voorzieningenrechter omtrent een besluit, genomen op
      grond van een in dit artikel genoemd voorschrift of anderszins in dit artikel omschreven, kan hoger
      beroep worden ingesteld bij de Centrale Raad van Beroep. De volgende besluiten: a. een besluit over een
      gehandicaptenparkeerkaart als bedoeld in [hoofdstuk IV van het Besluit administratieve bepalingen][ref1]
      inzake het wegverkeer b. een op grond van een gemeentelijke verordening of gemeenschappelijke regeling genomen
      besluit over een gehandicaptenparkeerkaart c. een besluit over een gehandicaptenparkeerplaats voor een bepaald
      voertuig [Algemene Kinderbijslagwet][ref2] [Algemene nabestaandenwet][ref3] [Algemene Ouderdomswet][ref4]
      [Besluit bovenwettelijke werkloosheidsregeling voor onderwijspersoneel primair onderwijs][ref5],
