  - number: 8:104.3
    text: |-
      Tegelijkertijd met het hoger beroep tegen de in het eerste lid bedoelde uitspraak kan hoger beroep worden ingesteld
      tegen:
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8104
  - number: 8:104.3.a
    text: |-
      een tussenuitspraak als bedoeld in [artikel 8:80a][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8104
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.7
  - number: 8:104.3.b
    text: een andere beslissing van de rechtbank.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8104
  - number: 8:104.4
    text: |-
      Geen hoger beroep kan worden ingesteld tegen de voorlopige voorziening, bedoeld in
      [artikel 8:72, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8104
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.6
  - number: 8:105.1
    text: |-
      Het hoger beroep wordt ingesteld bij de Afdeling bestuursrechtspraak van de Raad van State, tenzij
      een andere hogerberoepsrechter bevoegd is ingevolge hoofdstuk 4 van de bij deze wet behorende
      [Bevoegdheidsregeling bestuursrechtspraak][ref1] dan wel ingevolge een ander wettelijk voorschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8105
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 8:105.2
    text: |-
      Het hoger beroep, bedoeld in [artikel 8:104, eerste lid, aanhef en onder c][ref1], wordt ingesteld bij de
      hogerberoepsrechter die ingevolge het eerste lid bevoegd is of zou zijn te oordelen over een uitspraak van de
      rechtbank omtrent het schadeveroorzakende besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8105
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
  - number: 8:106.1
    text: |-
      De werking van een uitspraak van de rechtbank of van de voorzieningenrechter wordt opgeschort totdat de termijn
      voor het instellen van hoger beroep is verstreken of, indien hoger beroep is ingesteld, op het hoger beroep is
      beslist, indien:
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8106
  - number: 8:106.1.a
    text: |-
      de uitspraak betreft een besluit als bedoeld in artikel 9 van de bij deze wet behorende
      [Bevoegdheidsregeling bestuursrechtspraak][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8106
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 8:106.1.b
    text: tegen de uitspraak hoger beroep kan worden ingesteld bij een gerechtshof.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8106
  - number: 8:106.2
    text: Het eerste lid geldt niet indien de uitspraak een beroep tegen het niet tijdig nemen van een besluit betreft.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8106
  - number: 8:107.1
    text: |-
      De griffier van de hogerberoepsrechter doet van het ingestelde hoger beroep zo spoedig mogelijk mededeling aan de
      griffier van de rechtbank die de uitspraak heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8107
  - number: 8:107.2
    text: |-
      De griffier van de rechtbank stelt de gedingstukken met de aantekeningen van de zitting, voor zover deze op de zaak
      betrekking hebben, en een afschrift van de uitspraak binnen een week na ontvangst van de in het eerste lid bedoelde
      mededeling ter beschikking aan de griffier van de hogerberoepsrechter.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8107
  - number: 8:107.3
    text: |-
      Op verzoek van de hogerberoepsrechter stelt de griffier van de rechtbank het proces-verbaal van de zitting of de
      schriftelijke weergave van een in [artikel 8:36e][ref1] bedoelde beeld- of geluidsopname die het proces-verbaal
      vervangt, ter beschikking aan de griffier van de hogerberoepsrechter binnen een door de hogerberoepsrechter te
      bepalen termijn. De griffier van de hogerberoepsrechter stelt dit proces-verbaal of deze schriftelijke weergave ter
      beschikking aan partijen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8107
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.6a
  - number: 8:108.1
    text: |-
      Voor zover in deze titel niet anders is bepaald, zijn op het hoger beroep de [titels 8.1 tot en met 8.3][ref1]
      van overeenkomstige toepassing, met uitzondering van de [artikelen 8:1 tot en met 8:10][ref2],
      [8:41, tweede lid][ref3], en [8:74][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8108
    references:
