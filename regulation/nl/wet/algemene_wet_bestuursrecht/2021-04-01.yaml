        hoofdstuk: '8'
        afdeling: 8.2.6
  - number: 8:108.2
    text: |-
      Op het hoger beroep, bedoeld in [artikel 8:104, eerste lid, aanhef en onder c][ref1], zijn voorts de
      [afdelingen 8.2.2a][ref2], [8.2.4a][ref3] en [8.2.7][ref4] en de [artikelen 8:28a][ref5], [8:70][ref6] en
      [8:72][ref7] niet van toepassing.


