  - number: B2:2
    text: |-
      Tegen een besluit, genomen op grond van een in dit artikel genoemd voorschrift of anderszins in dit artikel
      omschreven, kan beroep worden ingesteld bij de Afdeling bestuursrechtspraak van de Raad van State. Algemene wet
      bestuursrecht: [artikel 5:32][ref1], voor zover het besluit betrekking heeft op de handhaving van het bepaalde
      bij of krachtens de in [artikel 20.3, eerste lid, van de Wet milieubeheer][ref2] bedoelde wetten of wettelijke
      bepalingen dan wel de [Ontgrondingenwet][ref3] [Archiefwet 1995][ref4]: [artikel 38][ref5], betreffende de
      toepassing van: a. [artikel 124 van de Gemeentewet][ref6], voor zover het beroep wordt ingesteld door het
      dagelijks bestuur of het algemeen bestuur van een waterschap; b. [artikel 124a van de Gemeentewet][ref7], voor
      zover het beroep wordt ingesteld door gedeputeerde staten, en c. [hoofdstuk XVII van de Gemeentewet][ref8]
      [Belemmeringenwet Privaatrecht][ref9]: de [artikelen 2, vijfde lid][ref10], en [3, tweede lid][ref11],
      voor zover de verplichting noodzakelijk is voor de uitvoering van werken als bedoeld in
      [artikel 2.3, tweede lid, onderdelen a en b, van de Crisis- en herstelwet][ref12] of voor de uitvoering
      van een of meer besluiten als bedoeld in: a. [artikel 21, tweede lid, van de Tracéwet][ref13]
      b. de [artikelen 3.30, eerste lid, onder a][ref14], [3.33, eerste lid, onder a][ref15],
      en [3.35, eerste lid, onder b, van de Wet ruimtelijke ordening][ref16] c.
      [artikel 15, tweede lid, van de Spoedwet wegverbreding][ref17]: de verlegging van kabels en leidingen,
      verband houdende met de uitvoering van een wegaanpassingsbesluit [Crisis- en herstelwet][ref18]: a.
      [artikel 2.3][ref19], voor zover het betreft een besluit tot vaststelling van een bestemmingsplan
      b. [artikel 2.10, eerste lid][ref20] [ Experimentenwet onderwijs][ref21] [Gemeentewet][ref22]: a.
      [artikel 85, tweede lid][ref23] b. [artikel 124][ref24], voor zover het beroep wordt ingesteld door de raad,
      het college van burgemeester en wethouders, onderscheidenlijk de burgemeester c. [artikel 124a][ref25], voor
      zover het beroep wordt ingesteld door gedeputeerde staten, onderscheidenlijk de commissaris van de Koning d.
      [artikel 125][ref26], voor zover het besluit betrekking heeft op de handhaving van het bepaalde bij of krachtens
      de in [artikel 20.3, eerste lid, van de Wet milieubeheer][ref27], bedoelde wetten of wettelijke bepalingen dan
      wel de [Ontgrondingenwet][ref28] e. [artikel 268, eerste lid][ref29] f. de [artikelen 278a, vierde lid][ref30],
      en [281, tweede lid][ref31], betreffende de toepassing van [artikel 124 van de Gemeentewet][ref32] voor
      zover het beroep wordt ingesteld door de raad, het college van burgemeester en wethouders, onderscheidenlijk
      de burgemeester, en betreffende de toepassing van [artikel 124a van de Gemeentewet][ref33] voor zover
      het beroep wordt ingesteld door gedeputeerde staten, onderscheidenlijk de commissaris van de Koning
      [Interimwet stad-en-milieubenadering][ref34]: a. de [artikelen 2][ref35] en [3][ref36] b. een besluit
      omtrent goedkeuring van een besluit als bedoeld in [artikel 9][ref37] [Kaderwet dienstplicht][ref38]: de
      [artikelen 10, eerste lid][ref39], [11][ref40] en [13][ref41] [Kernenergiewet][ref42] [Kieswet][ref43]: a. de
      [artikelen D 7][ref44], [G 1 tot en met G 4][ref45], [I 4][ref46], [K 8][ref47], [L 11][ref48], [M 4][ref49],
      [Q 6][ref50], [S 2][ref51], [X 4, derde lid][ref52], [X 4a, derde lid][ref53][X 5, derde lid][ref54],
      [X 7, vierde lid][ref55], [X 7a, vierde lid][ref56], en [X 8, vierde lid][ref57] b. [artikel Y 2][ref58] in
      samenhang met [artikel D 7][ref59], [G 1][ref60], [G 4][ref61], [I 4][ref62], [K 8][ref63], [L 11][ref64]
      of [M 4][ref65] c. de [artikelen Y 32][ref66] en [Y 33][ref67] [Mijnbouwwet][ref68]: a. een besluit dat van
      toepassing is op het continentaal plat, met uitzondering van een besluit krachtens de [afdelingen 5.1.1][ref69],
      [5.1.2][ref70], [5.3][ref71], [5.4][ref72] of [5.5][ref73] b. een besluit omtrent een mijnbouwmilieuvergunning
      krachtens [artikel 40][ref74], instemming met een winningsplan krachtens [artikel 34][ref75], instemming
      met een winningsplan of een opslagplan krachtens [39, eerste lid][ref76], en de vaststelling van een
      operationele strategie krachtens [artikel 52d][ref77] [Ontgrondingenwet][ref78]: [hoofdstuk II][ref79]
      en de artikelen 26a, eerste lid, [27][ref80] en [29a, eerste lid][ref81] [Participatiewet][ref82]:
      [artikel 76, eerste en tweede lid][ref83] [Provinciewet][ref84]: a. [artikel 83, tweede lid][ref85] b.
      [artikel 121][ref86], voor zover het beroep wordt ingesteld door gedeputeerde staten, onderscheidenlijk de
      commissaris van de Koning c. [artikel 122][ref87], voor zover het besluit betrekking heeft op de handhaving
