      Tegen een besluit, genomen op grond van een in dit artikel genoemd voorschrift of anderszins in dit
      artikel omschreven, kan beroep worden ingesteld bij de rechtbank Rotterdam. [Aanbestedingswet 2012][ref1],
      [artikel 4.21][ref2] [Aanbestedingswet op defensie- en veiligheidsgebied][ref3], [artikel 3.8][ref4]
      [Bankwet 1998][ref5]: [artikel 9c, eerste en tweede lid][ref6] Burgerlijk Wetboek: a.
      [Boek 2][ref7]: de [artikelen 63d, tweede lid][ref8], [156][ref9] en [266][ref10] b. [Boek 8][ref11]:
      [titel 6, afdeling 5][ref12] [ Drinkwaterwet][ref13]: [artikel 50, derde lid][ref14], in samenhang met
      [artikel 70a van de Mededingingswet][ref15] [Elektriciteitswet 1998][ref16]: de [artikelen 77h][ref17] en
      [77i][ref18] [Gaswet][ref19]: de [artikelen 16][ref20], [60ac][ref21] en [60ad][ref22] [Gezondheids- en welzijnswet
      voor dieren](onbekend): [artikel 120b, eerste lid][ref23] [Instellingswet Autoriteit Consument en Markt][ref24]
      [Invoerings- en aanpassingswet Pensioenwet][ref25] [Loodsenwet][ref26], met uitzondering van de
      [artikelen 21, derde lid][ref27], [27b, vierde lid][ref28], [27d][ref29], [27e][ref30], [27f][ref31], [27h][ref32]
      en [27l][ref33] [ Mededingingswet][ref34] [Muntwet 2002][ref35]: [artikel 11, eerste en tweede lid][ref36]
      [Pensioenwet][ref37] [Postwet 2009][ref38], met uitzondering van [hoofdstuk 3A][ref39] en [artikel 58][ref40]
      [Sanctiewet 1977][ref41]: de [artikelen 10ba tot en met 10d][ref42] [Spoorwegwet][ref43], met
      uitzondering van de [artikelen 19][ref44] en [hoofdstuk 5][ref45], [paragraaf 2][ref46], en
      [artikel 71, tweede lid][ref47] [Tabaks- en rookwarenwet][ref48] [Telecommunicatiewet][ref49], met inbegrip
      van de verordeningen genoemd in [artikel 18.2a][ref50], met uitzondering van: a. de [artikelen 3.5][ref51],
      [3.5a][ref52], [3.5b][ref53], [3.22][ref54], [15.2, derde lid][ref55], [15.4, vierde lid][ref56], en
      [18.9, eerste en tweede lid][ref57] b. alsmede, voor zover het betreft een besluit van de Autoriteit Consument
      en Markt: 1. [hoofdstuk 6][ref58], tenzij beroep kon worden ingesteld voor de inwerkingtreding van de
      [Wet implementatie Europees regelgevingskader voor de elektronische communicatiesector 2002][ref59] 2. de
      [hoofdstukken 5a][ref60], [6a][ref61], [6b][ref62] en [12][ref63] 3. [hoofdstuk 15][ref64], met uitzondering
      van de [artikelen 15.2][ref65], [15.2a][ref66] en [15.4][ref67]. [Uitvoeringswet EU-zeehavenverordening][ref68]:
      [artikel 9, eerste lid][ref69] Verordening (EU) nr. 806/2014 van het Europees parlement en de Raad van
      15 juli 2014 tot vaststelling van eenvormige regels en een eenvormige procedure voor de afwikkeling
      van kredietinstellingen en bepaalde beleggingsondernemingen in het kader van een gemeenschappelijk
      afwikkelingsmechanisme en een gemeenschappelijk bankenafwikkelingsfonds en tot wijziging van
      Verordening (EU) nr. 1093/2010 van het Europees parlement en de Raad (PbEU 2014, L 225), met
      uitzondering van de artikelen 16, 18 en 21 [Warenwet][ref70] [Warmtewet][ref71]: [artikel 18][ref72]
      [Wet bekostiging financieel toezicht][ref73] [Wet bestrijding maritieme ongevallen][ref74]
      [Wet bestrijding ongevallen Noordzee][ref75], voor zover het betreft een beschikking van Onze
      Minister, genomen op een verzoek om een tegemoetkoming als bedoeld in [artikel 13, eerste lid][ref76]
      [ Wet beveiliging netwerk- en informatiesystemen][ref77], voor zover het een besluit betreft dat betrekking
      heeft op een aanbieder van een essentiële dienst in de sectoren energie, digitale infrastructuur, bankwezen,
      infrastructuur voor de financiële markt, gezondheidszorg en spoor of op een digitaledienstverlener
      [Wet dieren][ref78]: [artikel 8.7][ref79] [Wet financiële betrekkingen buitenland 1994][ref80]
      [Wet geneesmiddelenprijzen][ref81]: [artikel 11][ref82] [Wet gewasbeschermingsmiddelen en biociden][ref83]:
      [artikel 90][ref84] [Wet handhaving consumentenbescherming][ref85]
      [Wet implementatie EU-richtlijnen energie-efficiëntie][ref86]: de [artikelen 21][ref87] en
      [22][ref88] [Wet informatie-uitwisseling bovengrondse en ondergrondse netten en netwerken][ref89]
      [Wet inkomstenbelasting 2001][ref90]: een boetebesluit als bedoeld in [artikel 3.52a, elfde lid][ref91],
      en een daarmee samenhangende correctie-RDA-beschikking als bedoeld in het tweede lid van dit artikel
      [Wet inzake de geldtransactiekantoren][ref92], voor zover die wet nog van toepassing is op grond van
      [artikel IX van de Wijzigingswet financiële markten 2012][ref93] [Wet lokaal spoor][ref94], met uitzondering van
      [artikel 12][ref95] [Wet luchtvaart][ref96]: [artikel 11.24][ref97] [Wet marktordening gezondheidszorg][ref98],
      voor zover het betreft beschikkingen van de Nederlandse Zorgautoriteit als bedoeld in
      [paragraaf 4 van hoofdstuk 6][ref99] [Wet op de inlichtingen- en veiligheidsdiensten 2017:][ref100]
      [artikel 53, zevende lid][ref101] [Wet op het financieel toezicht][ref102], met uitzondering van: a. de
      [artikelen 5:77, eerste lid][ref103], en [5:81, derde lid][ref104] b. een besluit terzake van het ingevolge
      [artikel 5:76, tweede lid][ref105], of [5:80b, vijfde lid][ref106], bepaalde, met uitzondering van een besluit
      tot het opleggen van een bestuurlijke boete als bedoeld in [artikel 1:80][ref107] c. de [artikelen 6:1][ref108] en
      [6:2][ref109] [Wet personenvervoer 2000][ref110]: de [artikelen 56, eerste lid][ref111], [59, eerste lid][ref112],
      [94, eerste lid][ref113], en [96, eerste lid][ref114] [Wet privatisering APB][ref115], voor zover het de
      overeenkomstige toepassing van de [Wet verplichte deelneming in een bedrijfstakpensioenfonds 2000][ref116]
      betreft op grond van [artikel 21, vierde lid][ref117] [Wet schadefonds olietankschepen][ref118]
      [Wet ter voorkoming van witwassen en financieren van terrorisme][ref119]
      [Wet toezicht accountantsorganisaties][ref120]
      [Wet toezicht financiële verslaggeving][ref121] [Wet toezicht trustkantoren 2018][ref122]
