        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.5
  - number: 8:52.3
    text: |-
      Indien de bestuursrechter bepaalt dat de zaak versneld wordt behandeld, bepaalt hij tevens zo spoedig mogelijk
      het tijdstip waarop de zitting zal plaatsvinden en doet hij daarvan onverwijld mededeling aan partijen.
      [Artikel 8:56][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel852
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.5
  - number: 8:53
    text: |-
      Blijkt aan de bestuursrechter bij de behandeling dat de zaak niet voldoende spoedeisend is om een versnelde
      behandeling te rechtvaardigen of dat de zaak een gewone behandeling vordert, dan bepaalt hij dat de zaak verder op
      de gewone wijze wordt behandeld.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel853
  - number: 8:54.1
    text: |-
      Totdat partijen zijn uitgenodigd om op een zitting van de bestuursrechter te verschijnen, kan de bestuursrechter
      het onderzoek sluiten, indien voortzetting van het onderzoek niet nodig is, omdat:
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel854
  - number: 8:54.1.a
    text: de bestuursrechter kennelijk onbevoegd is,
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel854
  - number: 8:54.1.b
    text: het beroep kennelijk niet-ontvankelijk is,
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel854
  - number: 8:54.1.c
    text: het beroep kennelijk ongegrond is, of
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel854
  - number: 8:54.1.d
    text: het beroep kennelijk gegrond is.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel854
  - number: 8:54.2
    text: |-
      In de uitspraak na toepassing van het eerste lid worden partijen gewezen op [artikel 8:55, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel854
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.4
  - number: 8:54a.1
    text: |-
      Totdat partijen zijn uitgenodigd om op een zitting van de bestuursrechter te verschijnen, kan de bestuursrechter
      het onderzoek sluiten, indien voortzetting van het onderzoek niet nodig is, omdat het bestuursorgaan kennelijk ten
      onrechte heeft ingestemd met rechtstreeks beroep bij de bestuursrechter.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel854a
  - number: 8:54a.2
    text: |-
      In dat geval strekt de uitspraak ertoe dat het bestuursorgaan het beroepschrift als bezwaarschrift behandelt.
      [Artikel 7:10][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel854a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.2'
  - number: 8:55.1
    text: |-
      Tegen de uitspraak, bedoeld in [artikel 8:54, tweede lid][ref1], kunnen een belanghebbende en het bestuursorgaan
      verzet doen bij de bestuursrechter.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel855
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.4
  - number: 8:55.2
    text: |-
      De [artikelen 6:4, derde lid][ref1], [6:5 tot en met 6:9][ref2], [6:11][ref3], [6:14][ref4], [6:15][ref5],
      [6:17][ref6] en [6:21][ref7] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel6
