  - number: B2:12
    text: |-
      Tegen een uitspraak van de rechtbank of van de voorzieningenrechter omtrent een besluit, genomen op
      grond van een in dit artikel genoemd voorschrift of anderszins in dit artikel omschreven, kan hoger
      beroep worden ingesteld bij een gerechtshof. [Algemene douanewet][ref1]: [artikel 8:2, tweede lid][ref2]
      [Algemene wet inzake rijksbelastingen][ref3]: [artikel 26][ref4] [Mijnbouwwet][ref5]: de [afdelingen 5.1.1][ref6],
      [5.1.2][ref7], [5.3][ref8], [5.4][ref9] en [5.5][ref10] [Wet strategische diensten][ref11]:
      [artikel 18, derde lid][ref12]


