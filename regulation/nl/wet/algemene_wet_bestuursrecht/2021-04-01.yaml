    text: |-
      Tegen een uitspraak van de rechtbank of van de voorzieningenrechter omtrent een besluit, genomen
      op grond van een in dit artikel genoemd voorschrift of anderszins in dit artikel omschreven,
      kan eveneens hoger beroep worden ingesteld bij de Centrale Raad van Beroep. Een besluit waarbij
      een persoon met betrekking tot diens in [artikel 3 van de Ambtenarenwet 2017][ref1] bedoelde
      hoedanigheid, zijn nagelaten betrekkingen of zijn rechtverkrijgenden belanghebbende zijn.
