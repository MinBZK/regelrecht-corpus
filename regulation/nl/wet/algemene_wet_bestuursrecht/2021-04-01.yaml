  - number: 8:77.1
    text: 'De schriftelijke uitspraak vermeldt:'
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel877
  - number: 8:77.1.a
    text: de namen van partijen en van hun vertegenwoordigers of gemachtigden,
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel877
  - number: 8:77.1.b
    text: de gronden van de beslissing,
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel877
  - number: 8:77.1.c
    text: de beslissing,
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel877
  - number: 8:77.1.d
    text: de naam van de rechter of de namen van de rechters die de zaak heeft onderscheidenlijk hebben behandeld,
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel877
  - number: 8:77.1.e
    text: de dag waarop de beslissing is uitgesproken, en
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel877
  - number: 8:77.1.f
    text: door wie, binnen welke termijn en bij welke bestuursrechter welk rechtsmiddel kan worden aangewend.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel877
  - number: 8:77.2
    text: |-
      Indien de uitspraak strekt tot gegrondverklaring van het beroep, wordt in de uitspraak vermeld welke geschreven of
      ongeschreven rechtsregel of welk algemeen rechtsbeginsel geschonden wordt geoordeeld.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel877
  - number: 8:77.3
    text: |-
      De uitspraak wordt ondertekend door de voorzitter en de griffier. Bij verhindering van de voorzitter of de griffier
      wordt dit in de uitspraak vermeld.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel877
  - number: 8:78
    text: De uitspraak geschiedt in het openbaar.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel878
  - number: 8:79.1
    text: |-
      Binnen twee weken na de dagtekening van de uitspraak stelt de griffier kosteloos een afschrift van de uitspraak of
      van het proces-verbaal van de mondelinge uitspraak ter beschikking van partijen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel879
  - number: 8:79.2
    text: |-
      Anderen dan partijen kunnen afschriften of uittreksels van de uitspraak of van het proces-verbaal van de mondelinge
      uitspraak verkrijgen. Met betrekking tot de kosten is het bij en krachtens de [Wet tarieven in strafzaken][ref1]
      bepaalde van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002406
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel879
    references:
      - id: ref1
        bwb_id: BWBR0002406
  - number: 8:79.3
    text: |-
      In afwijking van het tweede lid verstrekt de griffier, indien de uitspraak betrekking heeft op de toepassing van
      de artikelen 101 of 102 van het Verdrag betreffende de werking van de Europese Unie, overeenkomstig artikel 15,
      tweede lid, van de in [artikel 8:45, vierde lid][ref1], genoemde verordening onverwijld en kosteloos een afschrift
      van de uitspraak of van het proces-verbaal van de mondelinge uitspraak aan de Europese Commissie. De verstrekking
      geschiedt door tussenkomst van de Raad voor de rechtspraak, tenzij het een uitspraak van de Hoge Raad of van de
      Afdeling bestuursrechtspraak van de Raad van State betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel879
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.2
  - number: 8:80
    text: |-
      Indien de bestuursrechter bepaalt dat zijn uitspraak in de plaats treedt van het vernietigde besluit, wordt
      de uitspraak bovendien overeenkomstig de voor dat besluit voorgeschreven wijze bekendgemaakt door het bevoegde
      bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel880
  - number: 8:80a.1
    text: |-
      Als de bestuursrechter [artikel 8:51a][ref1] toepast, doet hij een tussenuitspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel880a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.2a
  - number: 8:80a.2
    text: De tussenuitspraak vermeldt zoveel mogelijk op welke wijze het gebrek kan worden hersteld.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel880a
  - number: 8:80a.3
    text: |-
      De [artikelen 8:72, vierde lid, tweede volzin, aanhef en onder a][ref1], [8:77][ref2], [8:78][ref3], [8:79][ref4]
      en [8:119][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel880a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.6
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.6
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.6
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.6
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
  - number: 8:80b.1
    text: |-
      De bestuursrechter kan de tussenuitspraak ook doen voordat partijen zijn uitgenodigd om op een zitting van de
      bestuursrechter te verschijnen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel880b
  - number: 8:80b.2
    text: |-
      De bestuursrechter kan de tussenuitspraak ook mondeling doen. [Artikel 8:67, tweede tot en met vijfde lid][ref1],
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel880b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.6
  - number: 8:80b.3
    text: |-
      De bestuursrechter kan zo nodig een voorlopige voorziening treffen. In dat geval bepaalt hij wanneer de voorlopige
      voorziening vervalt.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel880b
  - number: 8:80b.4
    text: 'De voorlopige voorziening als bedoeld in het derde lid, vervalt in ieder geval zodra:'
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel880b
  - number: 8:80b.4.a
    text: het beroep is ingetrokken; of
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel880b
  - number: 8:80b.4.b
    text: |-
      de bestuursrechter uitspraak als bedoeld in [artikel 8:66, eerste lid][ref1], heeft gedaan, tenzij bij die
      uitspraak een ander tijdstip is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel880b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.6
  - number: 8:81.1
    text: |-
      Indien tegen een besluit bij de bestuursrechter beroep is ingesteld dan wel, voorafgaand aan een mogelijk beroep
      bij de bestuursrechter, bezwaar is gemaakt of administratief beroep is ingesteld, kan de voorzieningenrechter van
      de bestuursrechter die bevoegd is of kan worden in de hoofdzaak, op verzoek een voorlopige voorziening treffen
      indien onverwijlde spoed, gelet op de betrokken belangen, dat vereist.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel881
  - number: 8:81.2
    text: |-
      Indien bij de bestuursrechter beroep is ingesteld, kan een verzoek om voorlopige voorziening worden gedaan door een
      partij in de hoofdzaak.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel881
  - number: 8:81.3
    text: |-
      Indien voorafgaand aan een mogelijk beroep bij de bestuursrechter bezwaar is gemaakt of administratief beroep
      is ingesteld, kan een verzoek om voorlopige voorziening worden gedaan door de indiener van het bezwaarschrift,
      onderscheidenlijk door de indiener van het beroepschrift of door de belanghebbende die geen recht heeft tot het
      instellen van administratief beroep.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel881
  - number: 8:81.4
    text: |-
      De [artikelen 6:4, derde lid][ref1], [6:5][ref2], [6:6][ref3], [6:14][ref4], [6:15][ref5], [6:17][ref6],
      [6:19][ref7] en [6:21][ref8] zijn van overeenkomstige toepassing. De indiener van het verzoekschrift die bezwaar
      heeft gemaakt dan wel beroep heeft ingesteld, legt daarbij een afschrift van het bezwaar- of beroepschrift over.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref8]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel881
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref7
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref8
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
  - number: 8:81.5
    text: |-
      Indien een verzoek om voorlopige voorziening is gedaan nadat bezwaar is gemaakt of administratief beroep is
      ingesteld en op dit bezwaar of beroep wordt beslist voordat de zitting heeft plaatsgevonden, wordt de verzoeker
      in de gelegenheid gesteld beroep bij de bestuursrechter in te stellen. Het verzoek om voorlopige voorziening wordt
      gelijkgesteld met een verzoek dat wordt gedaan hangende het beroep bij de bestuursrechter.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel881
  - number: 8:82.1
    text: Van de verzoeker wordt door de griffier een griffierecht geheven.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel882
  - number: 8:82.2
    text: |-
      Het griffierecht is gelijk aan het griffierecht dat de verzoeker ten tijde van de indiening van het verzoek voor de
      hoofdzaak verschuldigd is of zou zijn.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel882
  - number: 8:82.3
    text: |-
      [Artikel 8:41, derde tot en met zesde lid][ref1], is van overeenkomstige toepassing, met dien verstande dat de
      termijn voor de bijschrijving of storting van het griffierecht twee weken bedraagt. De voorzieningenrechter kan een
      kortere termijn stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel882
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.1
  - number: 8:82.4
    text: 'De griffier betaalt het griffierecht terug indien het verzoek wordt ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel882
  - number: 8:82.4.a
    text: |-
      omdat het bestuursorgaan aan de voorzieningenrechter schriftelijk heeft medegedeeld de uitvoering van het bestreden
      besluit tijdens de procedure over de hoofdzaak op te schorten, of
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel882
  - number: 8:82.4.b
    text: |-
      omdat de belanghebbende tot wie het bestreden besluit is gericht, aan de voorzieningenrechter schriftelijk heeft
      medegedeeld de gevraagde voorlopige maatregelen te zullen nemen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel882
  - number: 8:82.5
    text: |-
      De uitspraak kan inhouden dat het betaalde griffierecht door het bestuursorgaan geheel of gedeeltelijk wordt
      vergoed.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel882
  - number: 8:82.6
    text: In andere gevallen kan het bestuursorgaan het betaalde griffierecht geheel of gedeeltelijk vergoeden.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel882
  - number: 8:83.1
    text: |-
      Partijen worden zo spoedig mogelijk uitgenodigd om op een in de uitnodiging te vermelden plaats en tijdstip op
      een zitting te verschijnen. Binnen een door de voorzieningenrechter te bepalen termijn zendt het bestuursorgaan
      de op de zaak betrekking hebbende stukken aan hem. De [artikelen 8:45, vierde tot en met zesde lid][ref1], en
      [8:45a][ref2] zijn van overeenkomstige toepassing, met dien verstande dat de voorzieningenrechter kan bepalen dat
      de in deze artikelen bedoelde zienswijzen mondeling ter zitting naar voren worden gebracht. [Artikel 8:58][ref3]
      is van overeenkomstige toepassing, met dien verstande dat tot één dag voor de zitting nadere stukken kunnen worden
      ingediend. De [artikelen 8:59][ref4], [8:60][ref5], [8:60a, tweede lid][ref6], en [8:61 tot en met 8:65][ref7]
      zijn van overeenkomstige toepassing, met dien verstande dat getuigen en deskundigen kunnen worden meegebracht of
      opgeroepen zonder dat de in [artikel 8:60, vierde lid, eerste volzin][ref8], bedoelde mededeling is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref8]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel883
