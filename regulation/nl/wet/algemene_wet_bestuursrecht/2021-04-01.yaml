  - number: 11:2.2
    text: |-
      De overige bij of krachtens deze wet vastgestelde bedragen kunnen bij regeling van Onze Minister van Veiligheid en
      Justitie worden gewijzigd voor zover de consumentenprijsindex daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel112
  - number: 11:3
    text: |-
      Bij een wijziging van een bijlage bij deze wet blijft de bijlage zoals deze luidde voor het tijdstip van
      inwerkingtreding van de wijziging van toepassing op het beroep of hoger beroep tegen een besluit dat,
      onderscheidenlijk een uitspraak die voor dat tijdstip is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel113
  - number: 11:4
    text: 'Deze wet wordt aangehaald als: Algemene wet bestuursrecht.'
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel114
  - number: B2:1
    text: |-
      Tegen een besluit, genomen op grond van een in dit artikel genoemd voorschrift of anderszins in dit artikel
      omschreven, kan geen beroep worden ingesteld. [Archiefwet 1995][ref1]: a. [artikel 38][ref2], betreffende
      de toepassing van [artikel 124 van de Gemeentewet][ref3] voor zover het beroep niet wordt ingesteld
      door het dagelijks bestuur of het algemeen bestuur van een waterschap, en betreffende de toepassing van
      [artikel 124a van de Gemeentewet][ref4] voor zover het beroep niet wordt ingesteld door gedeputeerde staten
