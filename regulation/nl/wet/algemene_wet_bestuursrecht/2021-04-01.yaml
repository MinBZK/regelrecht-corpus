  - number: 8:85.1
    text: De voorzieningenrechter kan in zijn uitspraak bepalen wanneer de voorlopige voorziening vervalt.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel885
  - number: 8:85.2
    text: 'De voorlopige voorziening vervalt in ieder geval zodra:'
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel885
  - number: 8:85.2.a
    text: |-
      de termijn voor het instellen van beroep bij de bestuursrechter tegen het besluit dat op bezwaar of in
      administratief beroep is genomen, ongebruikt is verstreken,
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel885
  - number: 8:85.2.b
    text: het bezwaar of het beroep is ingetrokken, of
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel885
  - number: 8:85.2.c
    text: de bestuursrechter uitspraak heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel885
  - number: 8:86.1
    text: |-
      Indien het verzoek wordt gedaan indien beroep bij de bestuursrechter is ingesteld en de voorzieningenrechter van
      oordeel is dat na de zitting, bedoeld in [artikel 8:83, eerste lid][ref1], nader onderzoek redelijkerwijs niet kan
      bijdragen aan de beoordeling van de zaak, kan hij onmiddellijk uitspraak doen in de hoofdzaak.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel886
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
  - number: 8:86.2
    text: |-
      Indien de bestuursrechter in eerste en hoogste aanleg uitspraak doet, kan het eerste lid slechts worden toegepast
      indien partijen daarvoor toestemming hebben gegeven.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel886
  - number: 8:86.3
    text: |-
      Partijen worden in de uitnodiging, bedoeld in [artikel 8:83, eerste lid][ref1], gewezen op de bevoegdheid,
      bedoeld in het eerste lid, en indien de bestuursrechter in eerste en hoogste aanleg uitspraak doet, tevens op de
      voorwaarde, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel886
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
  - number: 8:87.1
    text: |-
      De voorzieningenrechter kan, ook ambtshalve, een voorlopige voorziening opheffen of wijzigen, ook als zij is
      getroffen met toepassing van [artikel 8:72, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel887
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.6
  - number: 8:87.2
    text: |-
      De [artikelen 8:81, tweede, derde en vierde lid][ref1], en [8:82 tot en met 8:86][ref2] zijn van overeenkomstige
      toepassing. Indien voorafgaand aan een mogelijk beroep bij de bestuursrechter bezwaar is gemaakt of administratief
      beroep is ingesteld, kan een verzoek om opheffing of wijziging eveneens worden gedaan door een belanghebbende die
      door de voorlopige voorziening rechtstreeks in zijn belang wordt getroffen, door het bestuursorgaan of door het
      beroepsorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel887
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
  - number: 8:87.3
    text: |-
      Indien een verzoek om opheffing of wijziging is gedaan door het bestuursorgaan of het beroepsorgaan en het verzoek
      geheel of gedeeltelijk wordt toegewezen, kan de uitspraak inhouden dat het betaalde griffierecht door de griffier
      aan het bestuursorgaan wordt terugbetaald.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel887
  - number: 8:88.1
    text: |-
      De bestuursrechter is bevoegd op verzoek van een belanghebbende een bestuursorgaan te veroordelen tot vergoeding
      van schade die de belanghebbende lijdt of zal lijden als gevolg van:
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel888
  - number: 8:88.1.a
    text: een onrechtmatig besluit;
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel888
  - number: 8:88.1.b
    text: een andere onrechtmatige handeling ter voorbereiding van een onrechtmatig besluit;
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel888
  - number: 8:88.1.c
    text: het niet tijdig nemen van een besluit;
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel888
  - number: 8:88.1.d
    text: |-
      een andere onrechtmatige handeling van een bestuursorgaan waarbij een persoon als bedoeld in
      [artikel 8:2, eerste lid, onder a][ref1], zijn nagelaten betrekkingen of zijn rechtverkrijgenden belanghebbende
      zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel888
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: 8:88.2
    text: Het eerste lid is niet van toepassing indien het besluit van beroep bij de bestuursrechter is uitgezonderd.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel888
  - number: 8:89.1
    text: |-
      Indien de schade wordt veroorzaakt door een besluit waarover de Centrale Raad van Beroep of de Hoge Raad in enige
      of hoogste aanleg oordeelt, is de bestuursrechter bij uitsluiting bevoegd.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel889
  - number: 8:89.2
    text: |-
      In de overige gevallen is de bestuursrechter bevoegd voor zover de gevraagde vergoeding ten hoogste € 25 000
      bedraagt met inbegrip van de tot aan de dag van het verzoek verschenen rente, en onverminderd het recht van de
      belanghebbende om op grond van andere wettelijke bepalingen schadevergoeding te vragen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel889
  - number: 8:89.3
    text: |-
      De bestuursrechter is in de gevallen, bedoeld in het tweede lid, niet bevoegd indien de belanghebbende het verzoek
      heeft ingediend nadat hij terzake van de schade een geding bij de burgerlijke rechter aanhangig heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel889
  - number: 8:89.4
    text: |-
      Zolang het verzoek van de belanghebbende bij de bestuursrechter aanhangig is, verklaart de burgerlijke rechter een
      vordering tot vergoeding van de schade niet ontvankelijk.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel889
  - number: 8:90.1
    text: |-
      Het verzoek wordt schriftelijk ingediend bij de bestuursrechter die bevoegd is kennis te nemen van het beroep tegen
      het besluit.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel890
  - number: 8:90.2
    text: |-
      Ten minste acht weken voor het indienen van het in het eerste lid bedoelde verzoekschrift vraagt de belanghebbende
      het betrokken bestuursorgaan schriftelijk om vergoeding van de schade, tenzij dit redelijkerwijs niet van hem kan
      worden gevergd.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel890
  - number: 8:91.1
    text: |-
      Indien het verzoek wordt gedaan gedurende het beroep tegen of het hoger beroep omtrent het schadeveroorzakende
      besluit, wordt het ingediend bij de bestuursrechter waarbij het beroep of het hoger beroep aanhangig is.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel891
  - number: 8:91.2
    text: |-
      In dat geval is [artikel 8:90, tweede lid][ref1], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel891
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
  - number: 8:91.3
    text: |-
      Indien het verzoek wordt gedaan in hoger beroep beslist de hogerberoepsrechter op het verzoek, tenzij hij het
      verzoek naar de rechtbank verwijst omdat het naar zijn oordeel behandeling door de rechtbank behoeft.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel891
  - number: 8:92.1
    text: 'Het verzoekschrift wordt ondertekend en bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel892
  - number: 8:92.1.a
    text: de naam en het adres van de verzoeker;
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel892
  - number: 8:92.1.b
    text: de dagtekening;
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel892
  - number: 8:92.1.c
    text: een aanduiding van de oorzaak van de schade;
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel892
  - number: 8:92.1.d
    text: |-
      een opgave van de aard van de geleden of de te lijden schade en, voor zover redelijkerwijs mogelijk, het bedrag van
      de schade en een specificatie daarvan;
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel892
  - number: 8:92.1.e
    text: de gronden van het verzoek.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel892
  - number: 8:92.2
    text: |-
      Bij het verzoekschrift worden zo mogelijk een afschrift van het schadeveroorzakende besluit waarop het
      verzoekschrift betrekking heeft, en van het verzoek, bedoeld in [artikel 8:90, tweede lid][ref1], overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel892
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
  - number: 8:92.3
    text: |-
      [Artikel 6:5, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel892
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
  - number: 8:93
    text: |-
      [Artikel 310 van Boek 3 van het Burgerlijk Wetboek][ref1] is van overeenkomstige toepassing op verzoeken om
      schadevergoeding op grond van deze titel. De verjaringstermijn vangt evenwel niet eerder aan dan de dag na die
      waarop:


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel310
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel893
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '310'
  - number: 8:93.a
    text: de vernietiging van het schadeveroorzakende besluit onherroepelijk is geworden, of
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel893
  - number: 8:93.b
    text: het bestuursorgaan de onrechtmatigheid van het besluit heeft erkend.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel893
  - number: 8:94.1
    text: |-
      Op het verzoek en de behandeling daarvan zijn de [artikelen 6:6][ref1], [6:14][ref2], [6:15][ref3],
      [6:17][ref4], [6:21][ref5], [6:24][ref6], [8:8 tot en met 8:28][ref7], [8:29 tot en met 8:51][ref8],
      [8:52 tot en met 8:55][ref9], [8:56 tot en met 8:69][ref10], [8:71][ref11], [8:74 tot en met 8:80][ref12]
      en [8:81 tot en met 8:87][ref13] van overeenkomstige toepassing, met dien verstande dat
