  - number: 8:52.1
    text: De bestuursrechter kan, indien de zaak spoedeisend is, bepalen dat deze versneld wordt behandeld.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel852
  - number: 8:52.2
    text: 'In dat geval kan de bestuursrechter:'
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel852
  - number: 8:52.2.a
    text: |-
      de in [artikel 8:41, vijfde lid][ref1], bedoelde termijn verkorten,


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
