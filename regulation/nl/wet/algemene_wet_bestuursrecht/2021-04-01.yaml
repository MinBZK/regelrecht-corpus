        artikel: '10'
        hoofdstuk: '10'
        afdeling: 10.2.2
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '10'
        hoofdstuk: '10'
        afdeling: 10.2.2
      - id: ref4
