  - number: B2:8.1
    text: |-
      Tegen een besluit, genomen op grond van de [Overgangswet elektriciteitsproductiesector][ref1], kan beroep worden
      ingesteld bij de rechtbank Gelderland.


      [ref1]: https://wetten.overheid.nl/BWBR0012088
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0012088
  - number: B2:8.2
    text: |-
      Tegen een besluit op grond van de [afdelingen 5.1.1][ref1], [5.1.2][ref2], [5.3][ref3],
      [5.4][ref4] en [5.5 van de Mijnbouwwet][ref5] alsmede een besluit als bedoeld in
      [artikel 26 van de Wet voorraadvorming aardolieproducten 2012][ref6] kan beroep worden ingesteld bij de rechtbanken
      Noord-Nederland, Gelderland, Noord-Holland, Den Haag en Zeeland-West-Brabant in het ressort waarvan de indiener
      van het beroepschrift zijn woonplaats heeft. Indien de indiener van het beroepschrift geen woonplaats in Nederland
      heeft, kan beroep worden ingesteld bij de rechtbank binnen het rechtsgebied waarvan het bestuursorgaan zijn zetel
      heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Afdeling5.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Afdeling5.1.2
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Afdeling5.3
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Afdeling5.4
      [ref5]: https://wetten.overheid.nl/BWBR0014168#Afdeling5.5
      [ref6]: https://wetten.overheid.nl/BWBR0032775#Artikel26
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0014168
        afdeling: 5.1.1
      - id: ref2
        bwb_id: BWBR0014168
        afdeling: 5.1.2
      - id: ref3
        bwb_id: BWBR0014168
        afdeling: '5.3'
      - id: ref4
        bwb_id: BWBR0014168
        afdeling: '5.4'
      - id: ref5
        bwb_id: BWBR0014168
        afdeling: '5.5'
      - id: ref6
        bwb_id: BWBR0032775
        artikel: '26'
  - number: B2:8.3
    text: |-
      Tegen een besluit van de Raad voor rechtsbijstand, bedoeld in [hoofdstuk II van de Wet op de rechtsbijstand][ref1],
      kan beroep worden ingesteld bij de rechtbank in het arrondissement waar de raad is gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006368
        hoofdstuk: II
  - number: B2:8.4
    text: |-
      Tegen een beschikking als bedoeld in [artikel 8:2, tweede lid, van de Algemene douanewet][ref1], met uitzondering
      van een beschikking ter zake van landbouwrestituties, kan beroep worden ingesteld bij de rechtbank Noord-Holland.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '8'
  - number: B2:8.5
    text: |-
      Tegen een beschikking als bedoeld in [artikel 18, derde lid, van de Wet strategische diensten][ref1] kan beroep
      worden ingesteld bij de rechtbank te Haarlem.


      [ref1]: https://wetten.overheid.nl/BWBR0030545#Artikel18
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0030545
        artikel: '18'
  - number: B2:8.6
    text: |-
      Tegen een besluit van de Dienst, genoemd in [artikel 1 van de Kadasterwet][ref1], omtrent wijziging van een
      authentiek gegeven of omtrent wijziging van een ander gegeven dan een authentiek gegeven, kan beroep worden
      ingesteld bij de rechtbank binnen het rechtsgebied waarvan:


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel1
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '1'
  - number: B2:8.6.a
    text: de onroerende zaak waarmee het betreffende gegeven verband houdt, geheel of grotendeels is gelegen, of
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8
  - number: B2:8.6.b
    text: |-
      de Dienst, genoemd in [artikel 1 van de Kadasterwet][ref1], is gevestigd indien het betreffende gegeven verband
      houdt met een te boek staand schip of luchtvaartuig.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel1
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '1'
  - number: B2:8.7
    text: |-
      Tegen een besluit op grond van [artikel 2.3 van de Jeugdwet][ref1] kan beroep worden ingesteld bij de kinderrechter
      binnen wiens rechtsgebied de betrokken gemeente is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel2
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '2'
  - number: B2:8.8
    text: |-
      Tegen een besluit inzake subsidieverstrekking voor een project op grond van de [Uitvoeringswet EFRO][ref1],
      kan beroep worden ingesteld bij de rechtbank binnen het rechtsgebied waarvan een autoriteit als bedoeld in
      [artikel 3 van die wet][ref2] die bevoegd is besluiten te nemen inzake de verstrekking van EFRO-middelen voor het
      project, haar zetel heeft, tenzij die autoriteit in het buitenland gevestigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0034784
      [ref2]: https://wetten.overheid.nl/BWBR0034784#Artikel3
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0034784
      - id: ref2
        bwb_id: BWBR0034784
        artikel: '3'
  - number: B2:8.9
    text: |-
      Tegen een besluit als bedoeld in [hoofdstuk V, afdeling 2, van de Algemene wet inzake rijksbelastingen][ref1] van
      een bestuursorgaan als bedoeld in [artikel 8:7, tweede lid][ref2], kan beroep worden ingesteld bij:


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002320
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: B2:8.9.a
    text: |-
      de rechtbanken Noord-Holland, Den Haag en Zeeland-West-Brabant in het ressort waarvan de indiener van het
      beroepschrift zijn woonplaats heeft dan wel, indien de indiener van het beroepschrift geen woonplaats in Nederland
      heeft, bij de rechtbanken Noord-Holland, Den Haag en Zeeland-West-Brabant in het ressort waarvan het bestuursorgaan
      zijn zetel heeft;
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8
  - number: B2:8.9.b
    text: |-
      de rechtbank Gelderland, indien de indiener van het beroepschrift zijn woonplaats heeft in het arrondissement
      Gelderland, het arrondissement Overijssel of het arrondissement Midden-Nederland, met uitzondering van de
      provincie Flevoland dan wel, indien de indiener van het beroepschrift geen woonplaats in Nederland heeft, wanneer
      het bestuursorgaan zijn zetel heeft in het arrondissement Gelderland, het arrondissement Overijssel of het
      arrondissement Midden-Nederland, met uitzondering van de provincie Flevoland;
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8
  - number: B2:8.9.c
    text: |-
      de rechtbank Noord-Nederland, indien de indiener van het beroepschrift zijn woonplaats heeft in het arrondissement
      Noord-Nederland of de provincie Flevoland dan wel, indien de indiener van het beroepschrift geen woonplaats in
      Nederland heeft, wanneer het bestuursorgaan zijn zetel heeft in het arrondissement Noord-Nederland of de provincie
      Flevoland.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8
  - number: B2:8.10
    text: |-
      Tegen een besluit als bedoeld in [artikel 2, derde lid][ref1], en
      [artikel 15, eerste lid, van de Tijdelijke wet Groningen][ref2] kan beroep worden ingesteld bij de rechtbank Noord-
      Nederland.


