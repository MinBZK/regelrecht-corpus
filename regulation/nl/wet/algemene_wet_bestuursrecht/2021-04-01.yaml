    text: |-
      Tegen een besluit, genomen op grond van een in dit artikel genoemd voorschrift of
      anderszins in dit artikel omschreven, kan beroep worden ingesteld bij de rechtbank Den Haag.
      __REF000___________________________________________________________________________________________________________
      ________________________________________________________ (Stb. 1984, 364)
      [Garantiewet Burgerlijk Overheidspersoneel Indonesië][ref2], met uitzondering van een besluit
      op grond van de Algemene oorlogsongevallenregeling [Garantiewet militairen K.N.I.L.][ref3]
      [Garantiewet Surinaamse pensioenen][ref4] [Wet ambtenaren defensie][ref5] *de reglementen van de
      Stichting Maror-gelden Overheid, de Stichting Joods Humanitair Fonds, de Stichting Rechtsherstel
      Sinti en Roma en de Stichting Het Gebaar* [Samenloopregeling Indonesische pensioenen 1960][ref6]
      [Toeslagregeling pensioenen Suriname en Nederlandse Antillen][ref7]
      [Toeslagwet Indonesische pensioenen 1956][ref8] [Uitkeringswet gewezen militairen][ref9]
      [Uitkeringswet tegemoetkoming twee tot vijfjarige diensttijd veteranen][ref10] [Vreemdelingenwet 2000][ref11],
      met uitzondering van de [artikelen 43][ref12] en [45, vierde lid][ref13], en met dien verstande
      dat de rechtbank Den Haag het beroep kan behandelen in alle zittingsplaatsen van alle rechtbanken,
      bedoeld in [artikel 21b, eerste en tweede lid, van de Wet op de rechterlijke organisatie][ref14]
      [Wet arbeid vreemdelingen][ref15], met uitzondering van een besluit tot het opleggen van een
      bestuurlijke boete, en met dien verstande dat de rechtbank Den Haag beroepen tegen besluiten
      als bedoeld in die wet kan behandelen in alle zittingsplaatsen van alle rechtbanken, bedoeld
      in [artikel 21b, eerste en tweede lid, van de Wet op de rechterlijke organisatie][ref16]
