      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref7
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
  - number: 8:55.3
    text: |-
      Indien bij wet de werking van een uitspraak wordt opgeschort totdat de termijn voor het instellen van hoger
      beroep is verstreken of, indien hoger beroep is ingesteld, op het hoger beroep is beslist, wordt de werking van de
      uitspraak, bedoeld in [artikel 8:54, tweede lid][ref1], op overeenkomstige wijze opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel855
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.4
  - number: 8:55.4
    text: |-
      Alvorens uitspraak te doen op het verzet, stelt de bestuursrechter de indiener van het verzetschrift die daarom
      heeft gevraagd, in de gelegenheid op een zitting te worden gehoord, tenzij hij van oordeel is dat het verzet
      gegrond is. In andere gevallen kan de bestuursrechter de indiener in de gelegenheid stellen op een zitting te
      worden gehoord.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel855
  - number: 8:55.5
    text: |-
      De bestuursrechter kan ook de andere partijen in de gelegenheid stellen op de zitting, bedoeld in het vierde lid,
      te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel855
  - number: 8:55.6
    text: |-
      Indien de uitspraak waartegen verzet is gedaan, is gedaan door een meervoudige kamer, wordt uitspraak op het verzet
      gedaan door een meervoudige kamer. Van de kamer die uitspraak doet op het verzet maakt geen deel uit degene die
      zitting heeft gehad in de kamer die de uitspraak heeft gedaan waartegen verzet is gedaan.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel855
  - number: 8:55.7
    text: 'De uitspraak strekt tot:'
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel855
  - number: 8:55.7.a
    text: niet-ontvankelijkverklaring van het verzet,
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel855
  - number: 8:55.7.b
    text: ongegrondverklaring van het verzet, of
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel855
  - number: 8:55.7.c
    text: gegrondverklaring van het verzet.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel855
  - number: 8:55.8
    text: |-
      Indien de bestuursrechter het verzet niet-ontvankelijk of ongegrond verklaart, blijft de uitspraak waartegen verzet
      was gedaan in stand.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel855
  - number: 8:55.9
    text: |-
      Indien de bestuursrechter het verzet gegrond verklaart, vervalt de uitspraak waartegen verzet was gedaan en wordt
      het onderzoek voortgezet in de stand waarin het zich bevond.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel855
  - number: 8:55.10
    text: 'Indien de bestuursrechter het verzet gegrond verklaart, kan hij tevens uitspraak doen op het beroep, mits:'
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel855
  - number: 8:55.10.a
    text: nader onderzoek redelijkerwijs niet kan bijdragen aan de beoordeling van de zaak, en
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel855
  - number: 8:55.10.b
    text: |-
      de partijen in de gelegenheid zijn gesteld op een zitting te worden gehoord en daarbij zijn gewezen op de
      bevoegdheid om tevens uitspraak te doen op het beroep.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel855
  - number: 8:55b.1
    text: |-
      Indien het beroep is gericht tegen het niet tijdig nemen van een besluit, doet de bestuursrechter binnen acht
      weken nadat het beroepschrift is ontvangen en aan de vereisten van [artikel 6:5][ref1] is voldaan, uitspraak met
      toepassing van [artikel 8:54][ref2], tenzij de bestuursrechter een onderzoek ter zitting nodig acht.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel855b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.4
  - number: 8:55b.2
    text: |-
      Indien de bestuursrechter een onderzoek ter zitting nodig acht, deelt hij dit zo spoedig mogelijk aan partijen
      mede.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel855b
  - number: 8:55b.3
    text: |-
      Indien de bestuursrechter een onderzoek ter zitting nodig acht, behandelt hij het beroep zo mogelijk met toepassing
      van [artikel 8:52][ref1]. In dat geval doet de bestuursrechter zo mogelijk binnen dertien weken uitspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel855b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.3
  - number: 8:55c
    text: |-
      Indien het beroep gegrond is, stelt de bestuursrechter desgevraagd tevens de hoogte van
      de ingevolge [afdeling 4.1.3][ref1] verbeurde dwangsom vast. De [artikelen 611c][ref2] en
      [611g van het Wetboek van Burgerlijke Rechtsvordering][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel611c
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel611g
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel855c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '4'
        afdeling: 4.1.3
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 611c
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 611g
  - number: 8:55d.1
    text: |-
      Indien het beroep gegrond is en nog geen besluit is bekendgemaakt, bepaalt de bestuursrechter dat het
      bestuursorgaan binnen twee weken na de dag waarop de uitspraak wordt verzonden alsnog een besluit bekendmaakt.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel855d
  - number: 8:55d.2
    text: |-
      De bestuursrechter verbindt aan zijn uitspraak een nadere dwangsom voor iedere dag dat het
      bestuursorgaan in gebreke blijft de uitspraak na te leven. De [artikelen 611c][ref1] en
      [611g van het Wetboek van Burgerlijke Rechtsvordering][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel611c
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel611g
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel855d
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 611c
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 611g
  - number: 8:55d.3
    text: |-
      In bijzondere gevallen of indien de naleving van andere wettelijke voorschriften daartoe noopt, kan de
      bestuursrechter een andere termijn bepalen of een andere voorziening treffen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel855d
  - number: 8:55e.1
    text: |-
      Indien tegen de met toepassing van [artikel 8:54][ref1] gedane uitspraak verzet wordt gedaan, beslist de
      bestuursrechter daarover binnen zes weken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel855e
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.4
  - number: 8:55e.2
    text: |-
      [Artikel 8:55, derde lid][ref1], is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel855e
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.4
  - number: 8:55e.3
    text: Indien het verzet gegrond is, beslist de bestuursrechter zo spoedig mogelijk op het beroep.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel855e
  - number: 8:55f.1
    text: |-
      Tegen het niet tijdig bekendmaken van een beschikking van rechtswege kan de belanghebbende beroep bij de
      bestuursrechter instellen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel855f
  - number: 8:55f.2
    text: Deze afdeling is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel855f
  - number: 8:56
    text: |-
      Na afloop van het vooronderzoek worden partijen ten minste drie weken tevoren uitgenodigd om op een in de
      uitnodiging te vermelden plaats en tijdstip op een zitting van de bestuursrechter te verschijnen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel856
  - number: 8:57.1
    text: |-
      De bestuursrechter kan bepalen dat het onderzoek ter zitting achterwege blijft indien geen van de partijen, nadat
      zij zijn gewezen op hun recht ter zitting te worden gehoord, binnen een door hem gestelde redelijke termijn heeft
      verklaard dat zij gebruik wil maken van dit recht.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel857
  - number: 8:57.2
    text: |-
      Is het beroep reeds ter zitting behandeld, dan kan de bestuursrechter na toepassing van [artikel 8:51a][ref1]
      bepalen dat een nader onderzoek ter zitting achterwege blijft indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel857
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.2a
  - number: 8:57.2.a
    text: |-
      het bestuursorgaan heeft medegedeeld dat het geen gebruik maakt van de gelegenheid om het gebrek te herstellen of
      te laten herstellen;
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel857
  - number: 8:57.2.b
    text: |-
      de termijn als bedoeld in [artikel 8:51a, tweede lid][ref1], ongebruikt is verstreken;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel857
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.2a
  - number: 8:57.2.c
    text: partijen hun zienswijzen over de wijze waarop het gebrek is hersteld, naar voren hebben gebracht; of
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel857
  - number: 8:57.2.d
    text: |-
      de termijn als bedoeld in [artikel 8:51b, derde lid][ref1], ongebruikt is verstreken, tenzij partijen daardoor
      kunnen worden benadeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel857
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.2a
  - number: 8:57.3
    text: |-
      Als de bestuursrechter bepaalt dat het onderzoek of het nadere onderzoek ter zitting achterwege blijft, sluit hij
      het onderzoek.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel857
  - number: 8:58.1
    text: Tot tien dagen voor de zitting kunnen partijen nadere stukken indienen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel858
  - number: 8:58.2
    text: |-
      Op deze bevoegdheid worden partijen in de uitnodiging, bedoeld in [artikel 8:56][ref1], gewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel858
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.5
  - number: 8:59
    text: |-
      De bestuursrechter kan een partij oproepen om in persoon dan wel in persoon of bij gemachtigde te verschijnen, al
      dan niet voor het geven van inlichtingen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel859
  - number: 8:60.1
    text: De bestuursrechter kan getuigen oproepen en deskundigen en tolken benoemen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel860
  - number: 8:60.2
    text: |-
      De opgeroepen getuige en de deskundige of de tolk die zijn benoeming heeft aanvaard en door de
      bestuursrechter wordt opgeroepen, zijn verplicht aan de oproeping gevolg te geven. De [artikelen 172][ref1] en
      [178 van het Wetboek van Burgerlijke Rechtsvordering][ref2] zijn van overeenkomstige toepassing. In de oproeping
      van de deskundige worden vermeld de opdracht die moet worden vervuld, de plaats en het tijdstip waarop de opdracht
      moet worden vervuld en de gevolgen die zijn verbonden aan het niet verschijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel172
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel178
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel860
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '172'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '178'
  - number: 8:60.3
    text: |-
      Namen en woonplaatsen van de opgeroepen getuigen en deskundigen en de feiten waarop het horen betrekking zal hebben
      onderscheidenlijk de opdracht die moet worden vervuld, worden bij de uitnodiging, bedoeld in [artikel 8:56][ref1],
      aan partijen zoveel mogelijk medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel860
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.5
  - number: 8:60.4
    text: |-
      Partijen kunnen getuigen en deskundigen meebrengen of bij aangetekende brief of deurwaardersexploit oproepen, mits
      daarvan uiterlijk tien dagen voor de dag van de zitting aan de bestuursrechter en aan de andere partijen mededeling
      is gedaan, met vermelding van namen en woonplaatsen. Op deze bevoegdheid worden partijen in de uitnodiging, bedoeld
      in [artikel 8:56][ref1], gewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel860
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.5
  - number: 8:60a.1
    text: |-
      De schriftelijke opmerkingen van de Europese Commissie of de Autoriteit Consument en Markt, bedoeld in
      [artikel 8:45a, eerste lid][ref1], kunnen tot tien dagen voor de zitting worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel860a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.2
  - number: 8:60a.2
    text: |-
      Indien de Europese Commissie of de Autoriteit Consument en Markt ter zitting verschijnt voor het maken van
      mondelinge opmerkingen, wordt dit zoveel mogelijk aan partijen meegedeeld bij de uitnodiging voor de zitting.
      [Artikel 8:45a, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel860a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.2
  - number: 8:61.1
    text: De voorzitter heeft de leiding van de zitting.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel861
  - number: 8:61.2
    text: De griffier houdt aantekening van het verhandelde ter zitting.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel861
  - number: 8:61.3
    text: 'De griffier maakt van de zitting een proces-verbaal op:'
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel861
  - number: 8:61.3.a
    text: indien de bestuursrechter dit ambtshalve of op verzoek van een partij die daarbij belang heeft, bepaalt, of
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel861
  - number: 8:61.3.b
    text: op verzoek van de hogerberoepsrechter of de Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel861
  - number: 8:61.4
    text: |-
      Het bevat de namen van de rechter of de rechters die de zaak behandelt onderscheidenlijk behandelen, die van
      partijen en van hun vertegenwoordigers of gemachtigden die op de zitting zijn verschenen en van degenen die hen
      hebben bijgestaan, en die van de getuigen, deskundigen en tolken die op de zitting zijn verschenen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel861
  - number: 8:61.5
    text: Het houdt een vermelding in van hetgeen op de zitting met betrekking tot de zaak is voorgevallen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel861
  - number: 8:61.6
    text: |-
      Het wordt door de voorzitter en de griffier ondertekend. Bij verhindering van de voorzitter of de griffier wordt
      dit in het proces-verbaal vermeld.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel861
  - number: 8:61.7
    text: Aan het proces-verbaal kunnen overgelegde pleitnotities worden gehecht.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel861
  - number: 8:61.8
    text: |-
      De bestuursrechter kan bepalen dat de verklaring van een partij, getuige of deskundige geheel in het proces-verbaal
      zal worden opgenomen. In dat geval wordt de verklaring onverwijld op schrift gesteld en aan de partij, getuige of
      deskundige voorgelezen. Deze mag daarin wijzigingen aanbrengen, die op schrift worden gesteld en aan de partij,
      getuige of deskundige worden voorgelezen. De verklaring wordt door de partij, getuige of deskundige ondertekend.
      Heeft ondertekening niet plaats, dan wordt de reden daarvan in het proces-verbaal vermeld.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel861
  - number: 8:61.9
    text: |-
      Nadat de bestuursrechter toepassing heeft gegeven aan [artikel 8:36e][ref1], kan de hogerberoepsrechter of de Hoge
      Raad verzoeken een schriftelijke weergave van de gesproken tekst van de beeld- of geluidsopname op te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel861
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.6a
  - number: 8:61.10
    text: |-
      De griffier die een proces-verbaal opmaakt stelt dit ter beschikking aan partijen, indien het derde lid, aanhef en
      onder a, van toepassing is.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel861
  - number: 8:62.1
    text: De zitting is openbaar.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel862
  - number: 8:62.2
    text: |-
      De bestuursrechter kan bepalen dat het onderzoek ter zitting geheel of gedeeltelijk zal plaatshebben met gesloten
      deuren:
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel862
  - number: 8:62.2.a
    text: in het belang van de openbare orde of de goede zeden,
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel862
  - number: 8:62.2.b
    text: in het belang van de veiligheid van de Staat,
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel862
  - number: 8:62.2.c
    text: indien de belangen van minderjarigen of de eerbiediging van de persoonlijke levenssfeer van partijen dit eisen, of
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel862
  - number: 8:62.2.d
    text: indien openbaarheid het belang van een goede rechtspleging ernstig zou schaden.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel862
  - number: 8:63.1
    text: |-
      Op het horen van getuigen en deskundigen is
      [artikel 179, tweede en derde lid, eerste volzin, van het Wetboek van Burgerlijke Rechtsvordering][ref1] van
      overeenkomstige toepassing. Op het horen van getuigen is artikel 179, eerste lid, van het Wetboek van Burgerlijke
      Rechtsvordering van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel179
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel863
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '179'
  - number: 8:63.2
    text: |-
      De bestuursrechter kan afzien van het horen van door een partij meegebrachte of opgeroepen getuigen en deskundigen
      indien hij van oordeel is dat dit redelijkerwijs niet kan bijdragen aan de beoordeling van de zaak.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel863
  - number: 8:63.3
    text: |-
      Indien een door een partij opgeroepen getuige of deskundige niet is verschenen, kan de bestuursrechter deze
      oproepen. In dat geval schorst de bestuursrechter het onderzoek ter zitting.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel863
  - number: 8:64.1
    text: |-
      De bestuursrechter kan het onderzoek ter zitting schorsen. Hij kan daarbij bepalen dat het vooronderzoek wordt
      hervat.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel864
  - number: 8:64.2
    text: |-
      Indien bij de schorsing geen tijdstip van de nadere zitting is bepaald, bepaalt de bestuursrechter dit zo spoedig
      mogelijk. De griffier doet zo spoedig mogelijk mededeling aan partijen van het tijdstip van de nadere zitting.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel864
  - number: 8:64.3
    text: |-
      In de gevallen waarin schorsing van het onderzoek ter zitting heeft plaatsgevonden, wordt de zaak op de nadere
      zitting hervat in de stand waarin zij zich bevond.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel864
  - number: 8:64.4
    text: De bestuursrechter kan bepalen dat het onderzoek ter zitting opnieuw wordt aangevangen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel864
  - number: 8:64.5
    text: |-
      De bestuursrechter kan bepalen dat de nadere zitting achterwege blijft indien geen van de partijen, nadat zij zijn
      gewezen op hun recht ter zitting te worden gehoord, binnen een door hem gestelde redelijke termijn heeft verklaard
      dat zij gebruik wil maken van dit recht. [Artikel 8:57, tweede en derde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel864
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.5
  - number: 8:65.1
    text: De bestuursrechter sluit het onderzoek ter zitting, wanneer hij van oordeel is dat het is voltooid.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel865
  - number: 8:65.2
    text: Voordat het onderzoek ter zitting wordt gesloten, hebben partijen het recht voor het laatst het woord te voeren.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel865
  - number: 8:65.3
    text: Zodra het onderzoek ter zitting is gesloten, deelt de voorzitter mee wanneer uitspraak zal worden gedaan.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel865
  - number: 8:66.1
    text: |-
      Tenzij mondeling uitspraak wordt gedaan, doet de bestuursrechter binnen zes weken na de sluiting van het onderzoek
      schriftelijk uitspraak.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel866
  - number: 8:66.2
    text: In bijzondere omstandigheden kan de bestuursrechter deze termijn met ten hoogste zes weken verlengen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel866
  - number: 8:66.3
    text: Van deze verlenging wordt aan partijen mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel866
  - number: 8:67.1
    text: |-
      De bestuursrechter kan na de sluiting van het onderzoek ter zitting onmiddellijk mondeling uitspraak doen. De
      uitspraak kan voor ten hoogste een week worden verdaagd onder aanzegging aan partijen van het tijdstip van de
      uitspraak.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel867
  - number: 8:67.2
    text: De mondelinge uitspraak bestaat uit de beslissing en de gronden van de beslissing.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel867
  - number: 8:67.3
    text: Van de mondelinge uitspraak wordt door de griffier een proces-verbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel867
  - number: 8:67.4
    text: |-
      Het wordt door de voorzitter en de griffier ondertekend. Bij verhindering van de voorzitter of de griffier wordt
      dit in het proces-verbaal vermeld.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel867
  - number: 8:67.5
    text: |-
      De bestuursrechter spreekt de beslissing, bedoeld in het tweede lid, in het openbaar uit, in tegenwoordigheid van
      de griffier. Daarbij wordt vermeld door wie, binnen welke termijn en bij welke bestuursrechter welk rechtsmiddel
      kan worden aangewend.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel867
  - number: 8:67.6
    text: De mededeling, bedoeld in het vijfde lid, tweede volzin, wordt in het proces-verbaal vermeld.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel867
  - number: 8:68.1
    text: |-
      Indien de bestuursrechter van oordeel is dat het onderzoek niet volledig is geweest, kan hij het heropenen. De
      bestuursrechter bepaalt daarbij op welke wijze het onderzoek wordt voortgezet.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel868
  - number: 8:68.2
    text: De griffier doet zo spoedig mogelijk mededeling daarvan aan partijen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel868
  - number: 8:69.1
    text: |-
      De bestuursrechter doet uitspraak op de grondslag van het beroepschrift, de overgelegde stukken, het verhandelde
      tijdens het vooronderzoek en het onderzoek ter zitting.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel869
  - number: 8:69.2
    text: De bestuursrechter vult ambtshalve de rechtsgronden aan.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel869
  - number: 8:69.3
    text: De bestuursrechter kan ambtshalve de feiten aanvullen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel869
  - number: 8:69a
    text: |-
      De bestuursrechter vernietigt een besluit niet op de grond dat het in strijd is met een geschreven of ongeschreven
      rechtsregel of een algemeen rechtsbeginsel, indien deze regel of dit beginsel kennelijk niet strekt tot bescherming
      van de belangen van degene die zich daarop beroept.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel869a
  - number: 8:70
    text: 'De uitspraak strekt tot:'
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel870
  - number: 8:70.a
    text: onbevoegdverklaring van de bestuursrechter,
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel870
  - number: 8:70.b
    text: niet-ontvankelijkverklaring van het beroep,
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel870
  - number: 8:70.c
    text: ongegrondverklaring van het beroep, of
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel870
  - number: 8:70.d
    text: gegrondverklaring van het beroep.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel870
  - number: 8:71
    text: |-
      Voor zover uitsluitend een vordering bij de burgerlijke rechter kan worden ingesteld, wordt dit in de uitspraak
      vermeld. De burgerlijke rechter is aan die beslissing gebonden.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel871
  - number: 8:72.1
    text: |-
      Indien de bestuursrechter het beroep gegrond verklaart, vernietigt hij het bestreden besluit geheel of
      gedeeltelijk.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel872
  - number: 8:72.2
    text: |-
      De vernietiging van een besluit of een gedeelte van een besluit brengt vernietiging van de rechtsgevolgen van dat
      besluit of van het vernietigde gedeelte daarvan mee.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel872
  - number: 8:72.3
    text: 'De bestuursrechter kan bepalen dat:'
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel872
  - number: 8:72.3.a
    text: |-
      de rechtsgevolgen van het vernietigde besluit of het vernietigde gedeelte daarvan geheel of gedeeltelijk in stand
      blijven, of
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel872
  - number: 8:72.3.b
    text: zijn uitspraak in de plaats treedt van het vernietigde besluit of het vernietigde gedeelte daarvan.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel872
  - number: 8:72.4
    text: |-
      De bestuursrechter kan, indien toepassing van het derde lid niet mogelijk is, het bestuursorgaan opdragen een nieuw
      besluit te nemen of een andere handeling te verrichten met inachtneming van zijn aanwijzingen. Daarbij kan hij:
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel872
  - number: 8:72.4.a
    text: |-
      bepalen dat wettelijke voorschriften over de voorbereiding van het nieuwe besluit of de andere handeling geheel of
      gedeeltelijk buiten toepassing blijven;
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel872
  - number: 8:72.4.b
    text: |-
      het bestuursorgaan een termijn stellen voor het nemen van het nieuwe besluit of het verrichten van de andere
      handeling.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel872
  - number: 8:72.5
    text: |-
      De bestuursrechter kan zo nodig een voorlopige voorziening treffen. Daarbij bepaalt hij het tijdstip waarop de
      voorlopige voorziening vervalt.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel872
  - number: 8:72.6
    text: |-
      De bestuursrechter kan bepalen dat, indien of zolang het bestuursorgaan niet voldoet aan een
      uitspraak, het bestuursorgaan aan een door hem aangewezen partij een in de uitspraak vast te
      stellen dwangsom verbeurt. De [artikelen 611a, vierde lid][ref1], [611b tot en met 611d][ref2] en
      [611g van het Wetboek van Burgerlijke Rechtsvordering][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel611a
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel611b
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel611g
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel872
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 611a
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 611b
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 611g
  - number: 8:72a
    text: |-
      Indien de bestuursrechter een beschikking tot het opleggen van een bestuurlijke boete vernietigt, neemt hij een
      beslissing omtrent het opleggen van de boete en bepaalt hij dat zijn uitspraak in zoverre in de plaats treedt van
      de vernietigde beschikking.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel872a
  - number: 8:74.1
    text: |-
      Indien de bestuursrechter het beroep gegrond verklaart, houdt de uitspraak tevens in dat aan de indiener van het
      beroepschrift het door hem betaalde griffierecht wordt vergoed door het bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel874
  - number: 8:74.2
    text: |-
      In de overige gevallen kan de uitspraak inhouden dat het betaalde griffierecht door het bestuursorgaan geheel of
      gedeeltelijk wordt vergoed.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel874
  - number: 8:75.1
    text: |-
      De bestuursrechter is bij uitsluiting bevoegd een partij te veroordelen in de kosten die een andere partij in
      verband met de behandeling van het beroep bij de bestuursrechter, en van het bezwaar of van het administratief
      beroep redelijkerwijs heeft moeten maken. De [artikelen 7:15, tweede tot en met vierde lid][ref1], en
      [7:28, tweede, vierde en vijfde lid][ref2], zijn van toepassing. Een natuurlijke persoon kan slechts in de kosten
      worden veroordeeld in geval van kennelijk onredelijk gebruik van procesrecht. Bij algemene maatregel van bestuur
      worden nadere regels gesteld over de kosten waarop een veroordeling als bedoeld in de eerste volzin uitsluitend
      betrekking kan hebben en over de wijze waarop bij de uitspraak het bedrag van de kosten wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel875
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.3'
  - number: 8:75.2
    text: |-
      In geval van een veroordeling in de kosten ten behoeve van een partij aan wie ter zake van het beroep
      bij de bestuursrechter, het bezwaar of het administratief beroep een toevoeging is verleend krachtens de
      [Wet op de rechtsbijstand][ref1], wordt het bedrag van de kosten betaald aan de rechtsbijstandverlener. De
      rechtsbijstandverlener stelt de belanghebbende zoveel mogelijk schadeloos voor de door deze voldane eigen
      bijdrage. De rechtsbijstandverlener doet aan de Raad voor rechtsbijstand opgave van een kostenvergoeding door het
      bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006368
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel875
    references:
      - id: ref1
        bwb_id: BWBR0006368
  - number: 8:75a.1
    text: |-
      In geval van intrekking van het beroep omdat het bestuursorgaan geheel of gedeeltelijk aan de indiener van het
      beroepschrift is tegemoetgekomen, kan het bestuursorgaan op verzoek van de indiener bij afzonderlijke uitspraak
      met toepassing van [artikel 8:75][ref1] in de kosten worden veroordeeld. Het verzoek wordt gedaan tegelijk met de
      intrekking van het beroep. Indien aan dit vereiste niet is voldaan, wordt het verzoek niet-ontvankelijk verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel875a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.6
  - number: 8:75a.2
    text: |-
      De bestuursrechter stelt de verzoeker zo nodig in de gelegenheid het verzoek schriftelijk toe te lichten en stelt
      het bestuursorgaan in de gelegenheid een verweerschrift in te dienen. Hij stelt hiervoor termijnen vast. Indien het
      verzoek mondeling wordt gedaan, kan de bestuursrechter bepalen dat het toelichten van het verzoek en het voeren van
      verweer onmiddellijk mondeling geschieden.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel875a
  - number: 8:75a.3
    text: |-
      Indien het toelichten van het verzoek en het voeren van verweer mondeling zijn geschied, sluit de bestuursrechter
      het onderzoek. In de overige gevallen zijn de [afdelingen 8.2.4][ref1] en [8.2.5][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel875a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '8'
        afdeling: 8.2.4
      - id: ref2
        bwb_id: BWBR0005537
        hoofdstuk: '8'
        afdeling: 8.2.5
  - number: 8:76
    text: |-
      Voor zover een uitspraak strekt tot vergoeding van griffierecht, proceskosten of schade als bedoeld in
      [artikel 8:74][ref1], [8:75][ref2], [8:75a][ref3], [8:82, vierde lid][ref4], [8:87, derde lid][ref5],
      of [8:95][ref6] levert zij een executoriale titel op, die met toepassing van de voorschriften van het
      [Wetboek van Burgerlijke Rechtsvordering][ref7] kan worden tenuitvoergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref7]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel876
