  - number: 7:27a
    text: |-
      Indien het beroep tegen een besluit op aanvraag is ingesteld door een ander dan de aanvrager, wordt de aanvrager
      voor de toepassing van [paragraaf 4.1.3.2][ref1] gelijkgesteld met degene die het beroep heeft ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel727a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '4'
        paragraaf: 4.1.3.2
        afdeling: 4.1.3
  - number: 7:28.1
    text: Voor de behandeling van het beroep is geen recht verschuldigd.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel728
  - number: 7:28.2
    text: |-
      De kosten, die de belanghebbende in verband met de behandeling van het beroep redelijkerwijs heeft moeten maken,
      worden door het bestuursorgaan uitsluitend vergoed op verzoek van de belanghebbende voorzover het bestreden besluit
      wordt herroepen wegens aan het bestuursorgaan te wijten onrechtmatigheid. In dat geval stelt het beroepsorgaan de
      vergoeding vast die het bestuursorgaan verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel728
  - number: 7:28.3
    text: |-
      Indien aan de belanghebbende in verband met het beroep een toevoeging is verleend op grond van de
      [Wet op de rechtsbijstand][ref1], betaalt het bestuursorgaan de toe te kennen vergoeding aan de
      rechtsbijstandverlener. De rechtsbijstandverlener stelt de belanghebbende zoveel mogelijk schadeloos voor de
      door deze voldane eigen bijdrage. De rechtsbijstandverlener doet aan de Raad voor rechtsbijstand opgave van een
      kostenvergoeding door het bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006368
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel728
    references:
      - id: ref1
        bwb_id: BWBR0006368
  - number: 7:28.4
    text: |-
      Het verzoek wordt gedaan voordat het beroepsorgaan op het beroep heeft beslist. Het beroepsorgaan beslist op het
      verzoek bij de beslissing op het beroep.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel728
  - number: 7:28.5
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld over de kosten waarop de vergoeding uitsluitend
      betrekking kan hebben en over de wijze waarop het bedrag van de kosten wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel728
  - number: 8:1
    text: Een belanghebbende kan tegen een besluit beroep instellen bij de bestuursrechter.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel81
  - number: 8:2.1
    text: 'Met een besluit wordt gelijkgesteld:'
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel82
  - number: 8:2.1.a
    text: |-
      een andere handeling van een bestuursorgaan waarbij een persoon met betrekking tot diens in
      [artikel 3 van de Ambtenarenwet 2017][ref1] bedoelde hoedanigheid, zijn nagelaten betrekkingen of zijn
      rechtverkrijgenden belanghebbende zijn,


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel3
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '3'
  - number: 8:2.1.b
    text: een andere publiekrechtelijke handeling van de Sociaal-Economische Raad.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel82
  - number: 8:2.2
    text: 'Met een besluit wordt gelijkgesteld de schriftelijke beslissing, inhoudende de weigering van de goedkeuring van:'
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel82
  - number: 8:2.2.a
    text: |-
      een besluit, inhoudende een algemeen verbindend voorschrift of een beleidsregel of de intrekking of de vaststelling
      van de inwerkingtreding van een algemeen verbindend voorschrift of een beleidsregel,
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel82
  - number: 8:2.2.b
    text: een besluit ter voorbereiding van een privaatrechtelijke rechtshandeling.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel82
  - number: 8:3.1
    text: 'Geen beroep kan worden ingesteld tegen een besluit:'
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel83
  - number: 8:3.1.a
    text: inhoudende een algemeen verbindend voorschrift of een beleidsregel,
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel83
  - number: 8:3.1.b
    text: |-
      inhoudende de intrekking of de vaststelling van de inwerkingtreding van een algemeen verbindend voorschrift of
      een beleidsregel,
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel83
  - number: 8:3.1.c
    text: |-
      inhoudende de goedkeuring van een besluit, inhoudende een algemeen verbindend voorschrift of een beleidsregel of de
      intrekking of de vaststelling van de inwerkingtreding van een algemeen verbindend voorschrift of een beleidsregel.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel83
  - number: 8:3.2
    text: Geen beroep kan worden ingesteld tegen een besluit ter voorbereiding van een privaatrechtelijke rechtshandeling.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel83
  - number: 8:4.1
    text: 'Geen beroep kan worden ingesteld tegen een besluit:'
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel84
  - number: 8:4.1.a
    text: |-
      inhoudende een weigering op grond van [artikel 2:15][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 8:4.1.b
    text: |-
      inhoudende een aanmaning als bedoeld in [artikel 4:112][ref1] of een dwangbevel,


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.4.4.1
        afdeling: 4.4.4
  - number: 8:4.1.c
    text: |-
      als bedoeld in [artikel 7:1a, vierde lid][ref1], [7:10, tweede, derde of vierde lid][ref2], of
      [7:24, derde tot en met zesde lid][ref3],


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.2'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.3'
  - number: 8:4.1.d
    text: inhoudende schorsing of vernietiging van een besluit van een ander bestuursorgaan,
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel84
  - number: 8:4.1.e
    text: |-
      als bedoeld in [artikel 3:21, eerste lid, onderdeel b][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.3
        afdeling: '3.5'
  - number: 8:4.1.f
    text: inzake vergoeding van schade wegens onrechtmatig bestuurshandelen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel84
  - number: 8:4.2
    text: |-
      Onverminderd [hoofdstuk 2][ref1] van de bij deze wet behorende Bevoegdheidsregeling bestuursrechtspraak kan geen
      beroep worden ingesteld tegen een besluit:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '2'
  - number: 8:4.2.a
    text: |-
      op grond van een in enig wettelijk voorschrift voor het geval van buitengewone omstandigheden toegekende
      bevoegdheid of opgelegde verplichting in deze omstandigheden genomen,
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel84
  - number: 8:4.2.b
    text: |-
      genomen op grond van een wettelijk voorschrift ter beveiliging van de militaire belangen van het Koninkrijk of
      zijn bondgenoten,
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel84
  - number: 8:4.2.c
    text: |-
      genomen op grond van een wettelijk voorschrift inzake de verplichte krijgsdienst, voor zover het keuring,
      herkeuring, werkelijke dienst, groot verlof of diensteindiging betreft, tenzij het besluit betrekking heeft op
      verlenging van werkelijke dienst of kostwinnersvergoeding.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel84
  - number: 8:4.3
    text: 'Geen beroep kan worden ingesteld tegen een besluit:'
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel84
  - number: 8:4.3.a
    text: |-
      tot benoeming of aanstelling, tenzij beroep wordt ingesteld door een persoon met betrekking tot diens in
      [artikel 3 van de Ambtenarenwet 2017][ref1] bedoelde hoedanigheid, zijn nagelaten betrekkingen of zijn
      rechtverkrijgenden,


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel3
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '3'
  - number: 8:4.3.b
    text: |-
      inhoudende een beoordeling van het kennen of kunnen van een kandidaat of leerling die ter zake is geëxamineerd of
      op enigerlei andere wijze is getoetst, dan wel inhoudende de vaststelling van opgaven, beoordelingsnormen of nadere
      regels voor die examinering of toetsing,
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel84
  - number: 8:4.3.c
    text: |-
      inhoudende een technische beoordeling van een voertuig of een luchtvaartuig, dan wel een meetmiddel, een onderdeel
      daarvan of een hulpinrichting daarvoor.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel84
  - number: 8:4.4
    text: 'Geen beroep kan worden ingesteld tegen een besluit:'
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel84
  - number: 8:4.4.a
    text: |-
      inzake de nummering van kandidatenlijsten, het verloop van de stemming, de stemopneming, de vaststelling van de
      stemwaarden en de vaststelling van de uitslag bij verkiezingen van de leden van vertegenwoordigende organen, de
      benoemdverklaring in opengevallen plaatsen, alsmede de toelating van nieuwe leden van provinciale staten, van de
      gemeenteraad en van het algemeen bestuur van een waterschap, alsmede de verlening van tijdelijk ontslag wegens
      zwangerschap en bevalling of ziekte,
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel84
  - number: 8:4.4.b
    text: houdende een ambtshandeling van een gerechtsdeurwaarder of notaris.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel84
  - number: 8:5.1
    text: |-
      Geen beroep kan worden ingesteld tegen een besluit als bedoeld in artikel 1 van de bij deze wet behorende
      [Bevoegdheidsregeling bestuursrechtspraak][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 8:5.2
    text: |-
      Geen beroep kan worden ingesteld tegen een besluit waartegen administratief beroep kan worden ingesteld of door de
      belanghebbende kon worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel85
  - number: 8:6.1
    text: |-
      Het beroep kan worden ingesteld bij de rechtbank, tenzij een andere bestuursrechter bevoegd is ingevolge hoofdstuk
      2 van de bij deze wet behorende [Bevoegdheidsregeling bestuursrechtspraak][ref1] dan wel ingevolge een ander
      wettelijk voorschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 8:6.2
    text: |-
      Bij elk van de bestuursrechters, genoemd in hoofdstuk 2 van de bij deze wet behorende Bevoegdheidsregeling
      bestuursrechtspraak, kan beroep worden ingesteld tegen een besluit waarover die rechter in hoger beroep oordeelt,
      indien hij toepassing heeft gegeven aan [artikel 8:113, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
  - number: 8:7.1
    text: |-
      Indien beroep wordt ingesteld tegen een besluit van een bestuursorgaan van een provincie, een gemeente
      of een waterschap dan wel tegen een besluit van een gemeenschappelijk orgaan, een bestuur van een
      bedrijfsvoeringsorganisatie of een bestuursorgaan van een openbaar lichaam dat is ingesteld met toepassing
      van de [Wet gemeenschappelijke regelingen][ref1], is bevoegd de rechtbank binnen het rechtsgebied waarvan het
      bestuursorgaan zijn zetel heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: 8:7.2
    text: |-
      Indien beroep wordt ingesteld tegen een besluit van een ander bestuursorgaan, is bevoegd de rechtbank binnen het
      rechtsgebied waarvan de indiener van het beroepschrift zijn woonplaats in Nederland heeft. Indien de indiener van
      het beroepschrift geen woonplaats in Nederland heeft, is bevoegd de rechtbank binnen het rechtsgebied waarvan het
      bestuursorgaan zijn zetel heeft.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel87
  - number: 8:7.3
    text: |-
      Indien beroep wordt ingesteld tegen een besluit als bedoeld in hoofdstuk 3 van de bij deze wet behorende
      [Bevoegdheidsregeling bestuursrechtspraak][ref1], is in afwijking van het eerste en tweede lid slechts de door dat
      hoofdstuk aangewezen rechtbank bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 8:7.4
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing indien beroep in eerste aanleg kan worden ingesteld
      bij een gerechtshof.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel87
  - number: 8:8.1
    text: |-
      Indien tegen hetzelfde besluit bij meer dan één bevoegde rechtbank beroep is ingesteld, worden de zaken verder
      behandeld door de bevoegde rechtbank waarbij als eerste beroep is ingesteld. Indien gelijktijdig bij meer dan één
      bevoegde rechtbank als eerste beroep is ingesteld, worden de zaken verder behandeld door de bevoegde rechtbank die
      als eerste wordt genoemd in [artikel 1 van de Wet op de rechterlijke indeling][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002080#Artikel1
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0002080
        artikel: '1'
  - number: 8:8.2
    text: |-
      De andere rechtbank verwijst, onderscheidenlijk de andere rechtbanken verwijzen de daar aanhangig gemaakte zaak of
      zaken naar de rechtbank die de zaken verder behandelt. De op de zaak of zaken betrekking hebbende stukken worden
      toegezonden aan de rechtbank die de zaken verder behandelt.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel88
  - number: 8:8.3
    text: |-
      Indien tegen hetzelfde besluit bij meer dan één rechtbank beroep is ingesteld, doet het bestuursorgaan daarvan
      onverwijld mededeling aan die rechtbanken.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel88
  - number: 8:8.4
    text: |-
      Indien het bestuursorgaan ingevolge [artikel 7:1a, vijfde of zesde lid][ref1], twee of meer bezwaarschriften
      doorzendt, zendt het bestuursorgaan deze door aan de rechtbank die ingevolge de tweede volzin van het eerste lid de
      zaak zal behandelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.1'
  - number: 8:8.5
    text: |-
      Het eerste tot en met het vierde lid zijn van overeenkomstige toepassing indien beroep in eerste aanleg kan worden
      ingesteld bij een gerechtshof.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel88
  - number: 8:9
    text: |-
      De Afdeling bestuursrechtspraak van de Raad van State, de Centrale Raad van Beroep, onderscheidenlijk het College
      van Beroep voor het bedrijfsleven, oordelen in hoogste ressort over geschillen tussen de rechtbanken over de
      toepassing van [artikel 8:7][ref1] in zaken tot de kennisneming waarvan zij in hoger beroep bevoegd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: 8:10.1
    text: De zaken die bij de rechtbank aanhangig worden gemaakt, worden in behandeling genomen door een enkelvoudige kamer.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel810
  - number: 8:10.2
    text: |-
      Indien een zaak naar het oordeel van de enkelvoudige kamer ongeschikt is voor behandeling door één rechter,
      verwijst zij deze naar een meervoudige kamer. De enkelvoudige kamer kan ook in andere gevallen een zaak naar een
      meervoudige kamer verwijzen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel810
  - number: 8:10.3
    text: |-
      Indien een zaak naar het oordeel van de meervoudige kamer geschikt is voor verdere behandeling door één rechter,
      kan zij deze verwijzen naar een enkelvoudige kamer.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel810
  - number: 8:10.4
    text: |-
      Verwijzing kan geschieden in elke stand van het geding. Een verwezen zaak wordt voortgezet in de stand waarin zij
      zich bevindt.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel810
  - number: 8:10a.1
    text: |-
      De zaken die bij een andere bestuursrechter dan de rechtbank aanhangig worden gemaakt, worden in behandeling
      genomen door een meervoudige kamer.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel810a
  - number: 8:10a.2
    text: |-
      Indien een zaak naar het oordeel van de meervoudige kamer geschikt is voor verdere behandeling door één rechter,
      kan zij deze verwijzen naar een enkelvoudige kamer.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel810a
  - number: 8:10a.3
    text: |-
      Indien een zaak naar het oordeel van de enkelvoudige kamer ongeschikt is voor behandeling door één rechter,
      verwijst zij deze naar een meervoudige kamer.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel810a
  - number: 8:10a.4
    text: |-
      De meervoudige kamer kan een zaak voorts verwijzen naar een grote kamer, indien haar dit met het oog op de
      rechtseenheid of de rechtsontwikkeling geraden voorkomt. De eerste volzin geldt niet, indien de zaak aanhangig is
      bij een gerechtshof.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel810a
  - number: 8:10a.5
    text: |-
      Verwijzing kan geschieden in elke stand van het geding. Een verwezen zaak wordt voortgezet in de stand waarin zij
      zich bevindt.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel810a
  - number: 8:11.1
    text: |-
      De voorschriften omtrent de behandeling van het beroep zijn van toepassing op de behandeling door elk van de
      kamers, bedoeld in de [artikelen 8:10 ][ref1]en [8:10a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel811
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.2
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.2
  - number: 8:11.2
    text: |-
      Degene die zitting heeft in een enkelvoudige kamer heeft tevens de bevoegdheden en de verplichtingen van de
      voorzitter.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel811
  - number: 8:12
    text: |-
      De bestuursrechter kan aan een rechter-commissaris opdragen het vooronderzoek of een gedeelte daarvan te
      verrichten.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel812
  - number: 8:12a.1
    text: |-
      De voorzitter van de Afdeling bestuursrechtspraak van de Raad van State, de president van de Centrale Raad van
      Beroep en de president van het College van Beroep voor het bedrijfsleven kunnen in zaken die in hun college in
      behandeling zijn bij een meervoudige of grote kamer, een lid van het desbetreffende college verzoeken een conclusie
      te nemen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel812a
  - number: 8:12a.2
    text: |-
      Een dergelijk verzoek kan ook worden gericht aan een lid van een van de andere colleges in overeenstemming met de
      voorzitter onderscheidenlijk de president van dat college.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel812a
  - number: 8:12a.3
    text: 'De conclusie wordt schriftelijk genomen, is met redenen omkleed en vermeldt:'
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel812a
  - number: 8:12a.3.a
    text: de naam van degene die haar heeft genomen en
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel812a
  - number: 8:12a.3.b
    text: de dag waarop zij is genomen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel812a
  - number: 8:12a.4
    text: |-
      De conclusie wordt uiterlijk zes weken na sluiting van het onderzoek ter zitting ter kennis van het college
      gebracht en in afschrift aan partijen toegezonden. Aan [artikel 8:64][ref1] behoeft daarbij geen toepassing te
      worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel812a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.5
  - number: 8:12a.5
    text: |-
      Partijen kunnen binnen twee weken na verzending van het afschrift van de conclusie hun schriftelijk commentaar
      daarop aan het college doen toekomen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel812a
  - number: 8:12a.6
    text: |-
      [Artikel 8:79, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel812a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.6
  - number: 8:12a.7
    text: Degene die de conclusie heeft genomen, neemt geen deel aan de beraadslagingen over de zaak.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel812a
  - number: 8:12a.8
    text: De conclusie bindt het college niet.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel812a
  - number: 8:13.1
    text: |-
      De rechtbank kan een bij haar aanhangig gemaakte zaak ter verdere behandeling verwijzen naar de rechtbank waar een
      andere zaak aanhangig is gemaakt, indien naar haar oordeel behandeling van die zaken door één rechtbank gewenst is.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel813
  - number: 8:13.2
    text: Een verzoek tot verwijzing kan worden gedaan tot de aanvang van het onderzoek ter zitting.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel813
  - number: 8:13.3
    text: |-
      Indien de rechtbank waarnaar een zaak is verwezen, instemt met de verwijzing, worden de op de zaak betrekking
      hebbende stukken aan haar ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel813
  - number: 8:13.4
    text: |-
      Het eerste tot en met derde lid zijn van overeenkomstige toepassing indien beroep in eerste aanleg kan worden
      ingesteld bij een gerechtshof.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel813
  - number: 8:14.1
    text: |-
      De bestuursrechter kan zaken over hetzelfde of een verwant onderwerp ter behandeling voegen en de behandeling van
      gevoegde zaken splitsen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel814
  - number: 8:14.2
    text: Een verzoek daartoe kan worden gedaan tot de sluiting van het onderzoek ter zitting.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel814
  - number: 8:15
    text: |-
      Op verzoek van een partij kan elk van de rechters die een zaak behandelen, worden gewraakt op grond van feiten of
      omstandigheden waardoor de rechterlijke onpartijdigheid schade zou kunnen lijden.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel815
  - number: 8:16.1
    text: Het verzoek wordt gedaan zodra de feiten of omstandigheden aan de verzoeker bekend zijn geworden.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel816
  - number: 8:16.2
    text: |-
      Het verzoek geschiedt schriftelijk en is gemotiveerd. Na de aanvang van het onderzoek ter zitting onderscheidenlijk
      na de aanvang van het horen van partijen of getuigen in het vooronderzoek kan het ook mondeling geschieden.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel816
  - number: 8:16.3
    text: Alle feiten of omstandigheden moeten tegelijk worden voorgedragen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel816
  - number: 8:16.4
    text: |-
      Een volgend verzoek om wraking van dezelfde rechter wordt niet in behandeling genomen, tenzij feiten of
      omstandigheden worden voorgedragen die pas na het eerdere verzoek aan de verzoeker bekend zijn geworden.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel816
  - number: 8:16.5
    text: Geschiedt het verzoek ter zitting, dan wordt het onderzoek ter zitting geschorst.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel816
  - number: 8:17
    text: Een rechter wiens wraking is verzocht, kan in de wraking berusten.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel817
  - number: 8:18.1
    text: |-
      Het verzoek om wraking wordt zo spoedig mogelijk ter zitting behandeld door een meervoudige kamer waarin de rechter
      wiens wraking is verzocht, geen zitting heeft.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel818
  - number: 8:18.2
    text: |-
      De verzoeker en de rechter wiens wraking is verzocht, worden in de gelegenheid gesteld te worden gehoord. De
      bestuursrechter kan ambtshalve of op verzoek van de verzoeker of de rechter wiens wraking is verzocht, bepalen dat
      zij niet in elkaars aanwezigheid zullen worden gehoord.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel818
  - number: 8:18.3
    text: |-
      De bestuursrechter beslist zo spoedig mogelijk. De bestuursrechter spreekt de beslissing in het openbaar uit. De
      beslissing is gemotiveerd en wordt onverwijld aan de verzoeker, de andere partijen en de rechter wiens wraking was
      verzocht medegedeeld.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel818
  - number: 8:18.4
    text: |-
      In geval van misbruik kan de bestuursrechter bepalen dat een volgend verzoek niet in behandeling wordt genomen.
      Hiervan wordt in de beslissing melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel818
  - number: 8:18.5
    text: Tegen de beslissing staat geen rechtsmiddel open.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel818
  - number: 8:19.1
    text: |-
      Op grond van feiten of omstandigheden als bedoeld in [artikel 8:15][ref1] kan elk van de rechters die een zaak
      behandelen, verzoeken zich te mogen verschonen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel819
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.4
  - number: 8:19.2
    text: |-
      Het verzoek geschiedt schriftelijk en is gemotiveerd. Na de aanvang van het onderzoek ter zitting,
      onderscheidenlijk na de aanvang van het horen van partijen of getuigen in het vooronderzoek kan het ook mondeling
      geschieden.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel819
  - number: 8:19.3
    text: Geschiedt het verzoek ter zitting, dan wordt het onderzoek ter zitting geschorst.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel819
  - number: 8:20.1
    text: |-
      Het verzoek om verschoning wordt zo spoedig mogelijk behandeld door een meervoudige kamer waarin de rechter die om
      verschoning heeft verzocht, geen zitting heeft.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel820
  - number: 8:20.2
    text: |-
      De bestuursrechter beslist zo spoedig mogelijk. De beslissing is gemotiveerd en wordt onverwijld aan partijen en de
      rechter die om verschoning had verzocht medegedeeld.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel820
  - number: 8:20.3
    text: Tegen de beslissing staat geen rechtsmiddel open.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel820
  - number: 8:21.1
    text: |-
      Natuurlijke personen, onbekwaam om in rechte te staan, worden in het geding vertegenwoordigd door hun
      vertegenwoordigers naar burgerlijk recht. De wettelijke vertegenwoordiger behoeft niet de machtiging van de
      kantonrechter, bedoeld in [artikel 349 van Boek 1 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel349
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel821
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '349'
  - number: 8:21.2
    text: |-
      De in het eerste lid bedoelde personen kunnen zelf in het geding optreden, indien zij tot redelijke waardering van
      hun belangen in staat kunnen worden geacht.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel821
  - number: 8:21.3
    text: |-
      Indien geen wettelijke vertegenwoordiger aanwezig is, of deze niet beschikbaar is en de zaak spoedeisend is,
      kan de bestuursrechter een voorlopige vertegenwoordiger benoemen. De benoeming vervalt zodra een wettelijke
      vertegenwoordiger aanwezig is of de wettelijke vertegenwoordiger weer beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel821
  - number: 8:22.1
    text: |-
      In geval van faillissement of surséance van betaling of toepassing van de schuldsaneringsregeling natuurlijke
      personen zijn de [artikelen 25][ref1], [27][ref2] en [31 van de Faillissementswet][ref3] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0001860#Artikel31
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel822
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0001860
        artikel: '27'
      - id: ref3
        bwb_id: BWBR0001860
        artikel: '31'
  - number: 8:22.2
    text: |-
      De [artikelen 25, tweede lid][ref1], en [27][ref2] vinden geen toepassing, indien partijen vóór de
      faillietverklaring zijn uitgenodigd om op een zitting van de bestuursrechter te verschijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel27
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel822
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0001860
        artikel: '27'
  - number: 8:23.1
    text: |-
      Een bestuursorgaan dat een college is, wordt in het geding vertegenwoordigd door een of meer door het
      bestuursorgaan aangewezen leden.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel823
  - number: 8:23.2
    text: |-
      De Kroon wordt in het geding vertegenwoordigd door Onze Minister wie het aangaat onderscheidenlijk door een of meer
      van Onze Ministers wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel823
  - number: 8:24.1
    text: Partijen kunnen zich laten bijstaan of door een gemachtigde laten vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel824
  - number: 8:24.2
    text: De bestuursrechter kan van een gemachtigde een schriftelijke machtiging verlangen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel824
  - number: 8:24.3
    text: Het tweede lid is niet van toepassing ten aanzien van advocaten.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel824
  - number: 8:25.1
    text: |-
      De bestuursrechter kan bijstand of vertegenwoordiging door een persoon tegen wie ernstige bezwaren bestaan,
      weigeren.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel825
  - number: 8:25.2
    text: |-
      De betrokken partij en de in het eerste lid bedoelde persoon worden onverwijld in kennis gesteld van de weigering
      en de reden daarvoor.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel825
  - number: 8:25.3
    text: Het eerste lid is niet van toepassing ten aanzien van advocaten.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel825
  - number: 8:26.1
    text: |-
      De bestuursrechter kan tot de sluiting van het onderzoek ter zitting ambtshalve, op verzoek van een partij of op
      hun eigen verzoek, belanghebbenden in de gelegenheid stellen als partij aan het geding deel te nemen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel826
  - number: 8:26.2
    text: |-
      Indien de bestuursrechter vermoedt dat er onbekende belanghebbenden zijn, kan hij in de *Staatscourant* doen
      aankondigen dat een zaak bij hem aanhangig is. Naast de aankondiging in de *Staatscourant* kan ook een ander middel
      voor de aankondiging worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel826
  - number: 8:27.1
    text: |-
      Partijen die door de bestuursrechter zijn opgeroepen om in persoon dan wel in persoon of bij gemachtigde
      te verschijnen, al dan niet voor het geven van inlichtingen, zijn verplicht te verschijnen en de verlangde
      inlichtingen te geven. Partijen worden hierop gewezen, alsmede op [artikel 8:31][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel827
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.5
  - number: 8:27.2
    text: |-
      Indien het een rechtspersoon betreft of een bestuursorgaan dat een college is, kan de bestuursrechter een of meer
      bepaalde bestuurders onderscheidenlijk een of meer bepaalde leden oproepen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel827
  - number: 8:28
    text: |-
      Partijen aan wie door de bestuursrechter is verzocht schriftelijk inlichtingen te geven, zijn verplicht de
      verlangde inlichtingen te geven. Partijen worden hierop gewezen, alsmede op [artikel 8:31][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel828
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.5
  - number: 8:28a.1
    text: |-
      Indien het beroep is ingesteld tegen een bestuurlijke boete is, in afwijking van de [artikelen 8:27][ref1]
      en [8:28][ref2], de partij aan wie de bestuurlijke boete is opgelegd, niet verplicht omtrent de overtreding
      verklaringen af te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel828a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.5
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.5
  - number: 8:28a.2
    text: Voor de bestuursrechter deze partij verhoort, deelt hij haar mede dat zij niet verplicht is tot antwoorden.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel828a
  - number: 8:29.1
    text: |-
      Partijen die verplicht zijn inlichtingen te geven dan wel stukken over te leggen, kunnen, indien daarvoor
      gewichtige redenen zijn, het geven van inlichtingen dan wel het overleggen van stukken weigeren of de
      bestuursrechter mededelen dat uitsluitend hij kennis zal mogen nemen van de inlichtingen onderscheidenlijk de
      stukken.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel829
  - number: 8:29.2
    text: |-
      Gewichtige redenen zijn voor een bestuursorgaan in ieder geval niet aanwezig, voor zover ingevolge de
      [Wet openbaarheid van bestuur][ref1] de verplichting zou bestaan een verzoek om informatie, vervat in de over te
      leggen stukken, in te willigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel829
    references:
      - id: ref1
        bwb_id: BWBR0005252
  - number: 8:29.3
    text: |-
      De bestuursrechter beslist of de in het eerste lid bedoelde weigering onderscheidenlijk de beperking van de
      kennisneming gerechtvaardigd is.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel829
  - number: 8:29.4
    text: Indien de bestuursrechter heeft beslist dat de weigering gerechtvaardigd is, vervalt de verplichting.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel829
  - number: 8:29.5
    text: |-
      Indien de bestuursrechter heeft beslist dat de beperking van de kennisneming gerechtvaardigd is, kan hij slechts
      met toestemming van de andere partijen mede op de grondslag van die inlichtingen onderscheidenlijk die stukken
      uitspraak doen. Indien de toestemming wordt geweigerd, wordt de zaak verwezen naar een andere kamer.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel829
  - number: 8:30
    text: |-
      Partijen zijn verplicht mee te werken aan een onderzoek als bedoeld in [artikel 8:47, eerste lid][ref1]. Partijen
      worden hierop gewezen, alsmede op [artikel 8:31][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel830
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.2
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.5
  - number: 8:31
    text: |-
      Indien een partij niet voldoet aan de verplichting te verschijnen, inlichtingen te geven, stukken over te leggen of
      mee te werken aan een onderzoek als bedoeld in [artikel 8:47, eerste lid][ref1], kan de bestuursrechter daaruit de
      gevolgtrekkingen maken die hem geraden voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel831
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.2
  - number: 8:32.1
    text: |-
      De bestuursrechter kan, indien de vrees bestaat dat kennisneming van stukken door een partij haar lichamelijke of
      geestelijke gezondheid zou schaden, bepalen dat deze kennisneming is voorbehouden aan een gemachtigde die advocaat
      of arts is dan wel daarvoor van de bestuursrechter bijzondere toestemming heeft gekregen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel832
  - number: 8:32.2
    text: |-
      De bestuursrechter kan, indien kennisneming van stukken door een partij de persoonlijke levenssfeer van een ander
      onevenredig zou schaden, bepalen dat deze kennisneming is voorbehouden aan een gemachtigde die advocaat of arts is
      dan wel daarvoor van de bestuursrechter bijzondere toestemming heeft gekregen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel832
  - number: 8:32a
    text: |-
      De bestuursrechter kan door partijen verschafte gegevens en bescheiden buiten beschouwing laten indien zij op zijn
      verzoek niet aangeven ter toelichting of staving van welke stelling de gegevens en bescheiden zijn bedoeld en welk
      onderdeel daartoe van belang is.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel832a
  - number: 8:33.1
    text: |-
      Ieder die door de bestuursrechter als getuige wordt opgeroepen, is verplicht aan de oproeping gevolg te geven en
      getuigenis af te leggen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel833
  - number: 8:33.2
    text: |-
      In de oproeping worden vermeld de plaats en het tijdstip waarop de getuige zal worden gehoord, de feiten waarop het
      horen betrekking zal hebben en de gevolgen die zijn verbonden aan het niet verschijnen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel833
  - number: 8:33.3
    text: |-
      De [artikelen 165, tweede en derde lid][ref1], [172][ref2],
      [173, eerste lid, eerste volzin, tweede en derde lid][ref3], [174, eerste lid][ref4],
      [175][ref5], [176, eerste en derde lid][ref6], [177, eerste lid][ref7] en
      [178 van het Wetboek van Burgerlijke Rechtsvordering][ref8] zijn van overeenkomstige toepassing


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel165
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel172
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel173
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel174
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel175
      [ref6]: https://wetten.overheid.nl/BWBR0001827#Artikel176
      [ref7]: https://wetten.overheid.nl/BWBR0001827#Artikel177
      [ref8]: https://wetten.overheid.nl/BWBR0001827#Artikel178
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel833
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '165'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '172'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '173'
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '174'
      - id: ref5
        bwb_id: BWBR0001827
        artikel: '175'
      - id: ref6
        bwb_id: BWBR0001827
        artikel: '176'
      - id: ref7
        bwb_id: BWBR0001827
        artikel: '177'
      - id: ref8
        bwb_id: BWBR0001827
        artikel: '178'
  - number: 8:33.4
    text: |-
      De bestuursrechter kan bepalen dat getuigen niet zullen worden gehoord dan na het afleggen van de eed of de
      belofte. Zij leggen in dat geval de eed of de belofte af dat zij zullen zeggen de gehele waarheid en niets dan
      de waarheid.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel833
  - number: 8:34.1
    text: |-
      De deskundige die zijn benoeming heeft aanvaard, is verplicht zijn opdracht onpartijdig en naar beste weten te
      vervullen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel834
  - number: 8:34.2
    text: |-
      [Artikel 165, tweede lid, onderdeel b, en derde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel165
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel834
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '165'
  - number: 8:35.1
    text: |-
      De tolk die zijn benoeming heeft aanvaard en die door de bestuursrechter wordt opgeroepen, is verplicht aan de
      oproeping gevolg te geven en zijn opdracht onpartijdig en naar beste weten te vervullen. De [artikelen 172][ref1]
      en [178 van het Wetboek van Burgerlijke Rechtsvordering][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel172
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel178
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel835
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '172'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '178'
  - number: 8:35.2
    text: |-
      In de oproeping worden vermeld de plaats en het tijdstip waarop de opdracht moet worden vervuld en de gevolgen die
      zijn verbonden aan het niet verschijnen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel835
  - number: 8:36.1
    text: |-
      Aan de door de bestuursrechter opgeroepen getuigen, deskundigen en tolken en de deskundigen die een onderzoek
      als bedoeld in [artikel 8:47, eerste lid][ref1], hebben ingesteld, wordt ten laste van het Rijk een vergoeding
      toegekend. Het bij en krachtens de [Wet tarieven in strafzaken][ref2] bepaalde is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002406
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel836
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.2
      - id: ref2
        bwb_id: BWBR0002406
  - number: 8:36.2
    text: |-
      De partij die een getuige of deskundige heeft meegebracht of opgeroepen, dan wel aan wie een verslag
      van een deskundige is uitgebracht, is aan deze een vergoeding verschuldigd. Het bij en krachtens de
      [Wet tarieven in strafzaken][ref1] bepaalde is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002406
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel836
    references:
      - id: ref1
        bwb_id: BWBR0002406
  - number: 8:36a.1
    text: Beroep wordt langs elektronische weg ingesteld.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel836a
  - number: 8:36a.2
    text: |-
      Partijen en andere betrokkenen dienen ook de overige stukken langs elektronische weg in, tenzij de bestuursrechter
      anders bepaalt. [Artikel 6:9][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel836a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
  - number: 8:36a.3
    text: |-
      Het eerste en het tweede lid zijn van overeenkomstige toepassing op het indienen van verzoeken en het doen van
      verzet.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel836a
  - number: 8:36a.4
    text: |-
      Het eerste lid is van overeenkomstige toepassing indien een bestuursorgaan een bezwaarschrift doorzendt op grond
      van [artikel 7:1a, vijfde of zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel836a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.1'
  - number: 8:36a.5
    text: |-
      Indien niet is voldaan aan de verplichtingen die voortvloeien uit het eerste tot en met derde lid of de algemene
      maatregel van bestuur, bedoeld in [artikel 8:36f, eerste lid][ref1], stelt de bestuursrechter de desbetreffende
      partij of andere betrokkene in de gelegenheid dit verzuim te herstellen binnen een door hem te bepalen termijn.
      Maakt de partij of andere betrokkene van deze gelegenheid geen gebruik, dan kan het beroep niet-ontvankelijk worden
      verklaard dan wel kan de bestuursrechter het stuk buiten beschouwing laten.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel836a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.6a
  - number: 8:36a.6
    text: |-
      In afwijking van het vijfde lid kan de bestuursrechter bepalen dat de procedure wordt voortgezet volgens de regels
      die gelden voor stukkenwisseling op papier.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel836a
  - number: 8:36a.7
    text: |-
      De bestuursrechter betrekt na afloop van de termijn ingediende stukken als bedoeld in het tweede lid bij zijn
      beslissing indien redelijkerwijs niet kan worden geoordeeld dat de indiener in verzuim is geweest.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel836a
  - number: 8:36b.1
    text: |-
      De verplichting tot procederen langs elektronische weg geldt niet voor natuurlijke personen en voor verenigingen
      waarvan de statuten niet zijn opgenomen in een notariële akte, tenzij zij worden vertegenwoordigd door een derde
      die beroepsmatig rechtsbijstand verleent.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel836b
  - number: 8:36b.2
    text: |-
      Bij algemene maatregel van bestuur kunnen andere uitzonderingen worden gemaakt op de verplichting tot
      stukkenwisseling langs elektronische weg bedoeld in [artikel 8:36a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel836b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.6a
  - number: 8:36b.3
    text: |-
      Indien een partij niet verplicht is langs elektronische weg te procederen en niet langs elektronische weg
      procedeert, dient zij de stukken in op papier. De griffier stelt stukken en mededelingen op papier, of indien deze
      partij dit wenst langs elektronische weg, aan hem ter beschikking en stelt de door deze partij ingediende stukken
      ter beschikking van de overige partijen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel836b
  - number: 8:36c
    text: |-
      1 Als tijdstip waarop een bericht door de bestuursrechter langs elektronische weg is ontvangen, geldt het tijdstip
      waarop het bericht het digitale systeem voor gegevensverwerking van de bestuursrechter heeft bereikt. Na elke
      indiening langs elektronische weg ontvangt de indiener een ontvangstbevestiging in het digitale systeem voor
      gegevensverwerking.

      2 Als tijdstip waarop een bericht dat door de bestuursrechter is geplaatst in het in het eerste lid genoemde
      digitale systeem voor gegevensverwerking door de geadresseerde is ontvangen, geldt het tijdstip waarop de
      bestuursrechter de geadresseerde hierover een kennisgeving heeft verzonden buiten het digitale systeem voor
      gegevensverwerking.

      3 Als tijdstip waarop een bericht dat door een partij of een andere betrokkene bij de procedure is geplaatst in het
      in het eerste lid genoemde digitale systeem voor gegevensverwerking door de andere partijen en betrokkenen bij de
      procedure is ontvangen, geldt het tijdstip waarop de bestuursrechter de betrokkenen hierover een kennisgeving heeft
      verzonden buiten het digitale systeem voor gegevensverwerking.

      4 Indien een partij of andere betrokkene bij de procedure afziet van digitale bereikbaarheid buiten het digitale
      systeem voor gegevensverwerking als bedoeld in het eerste lid, zodat de kennisgeving bedoeld in het tweede en
      derde lid niet kan worden gezonden, geldt als tijdstip waarop een bericht als bedoeld in deze leden door hem
      is ontvangen, het tijdstip waarop het bericht voor hem toegankelijk is geworden in het digitale systeem voor
      gegevensverwerking.

      1 Als tijdstip waarop een bericht door de bestuursrechter langs elektronische weg is ontvangen, geldt het tijdstip
      waarop het bericht het digitale systeem voor gegevensverwerking van de bestuursrechter heeft bereikt.

      2 Als tijdstip waarop een bericht dat door de bestuursrechter is geplaatst in het in het eerste lid genoemde
      digitale systeem voor gegevensverwerking door de geadresseerde is ontvangen, geldt het tijdstip waarop de
      bestuursrechter de geadresseerde hierover een kennisgeving heeft verzonden buiten het digitale systeem voor
      gegevensverwerking.

      3 Als tijdstip waarop een bericht dat door een partij of een andere betrokkene bij de procedure is geplaatst in het
      in het eerste lid genoemde digitale systeem voor gegevensverwerking door de andere partijen en betrokkenen bij de
      procedure is ontvangen, geldt het tijdstip waarop de bestuursrechter de betrokkenen hierover een kennisgeving heeft
      verzonden buiten het digitale systeem voor gegevensverwerking.

      4 Indien een partij of andere betrokkene bij de procedure afziet van digitale bereikbaarheid buiten het digitale
      systeem voor gegevensverwerking als bedoeld in het eerste lid, zodat de kennisgeving bedoeld in het tweede en
      derde lid niet kan worden gezonden, geldt als tijdstip waarop een bericht als bedoeld in deze leden door hem
      is ontvangen, het tijdstip waarop het bericht voor hem toegankelijk is geworden in het digitale systeem voor
      gegevensverwerking.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel836c
  - number: 8:36d.1
    text: |-
      Waar in de [hoofdstukken 6][ref1] en [8][ref2] voor het verkeer met de bestuursrechter ondertekening is
      voorgeschreven is aan dit vereiste voldaan indien het stuk is ondertekend met een elektronische handtekening die
      voldoet aan bij of krachtens algemene maatregel van bestuur te stellen eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel836d
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005537
        hoofdstuk: '8'
  - number: 8:36d.2
    text: |-
      Een beroepschrift of verzoekschrift dat langs elektronische weg is ingediend in het digitale systeem voor
      gegevensverwerking van de bestuursrechter, geldt als ondertekend.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel836d
  - number: 8:36e
    text: |-
      De bestuursrechter kan bepalen dat een door of namens hem gemaakte beeld- of geluidsopname van een zakelijke
      samenvatting van:
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel836e
  - number: 8:36e.a
    text: |-
      het geven van inlichtingen bedoeld in [artikel 8:44][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel836e
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.2
  - number: 8:36e.b
    text: |-
      het maken van mondelinge opmerkingen bedoeld in [artikel 8:45a, tweede lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel836e
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.2
  - number: 8:36e.c
    text: |-
      het onderzoek ter plaatse bedoeld in de [artikelen 8:50][ref1] en [8:51][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel836e
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.2
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.2
  - number: 8:36e.d
    text: |-
      de zitting bedoeld in [artikel 8:61][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel836e
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.5
  - number: 8:36f.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het elektronisch
      verkeer met de bestuursrechter, het digitale systeem voor gegevensverwerking en de verschoonbaarheid van
      termijnoverschrijdingen wegens verstoring van het digitale systeem voor gegevensverwerking van de rechterlijke
      instanties of van de toegang tot dit systeem.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel836f
  - number: 8:36f.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de toepassing van beeld- en
      geluidsopnamen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel836f
  - number: 8:36g
    text: |-
      De verzending van berichten door de griffier geschiedt langs elektronische weg, met uitzondering van de
      berichtgeving aan een partij als bedoeld in [artikel 8:36b][ref1], die te kennen heeft gegeven deze op papier te
      willen ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel836g
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.6a
  - number: 8:37.1
    text: |-
      Oproepingen, de uitnodiging om op een zitting van de bestuursrechter te verschijnen, de uitnodiging om te verklaren
      of van het recht ter zitting te worden gehoord gebruik wordt gemaakt, alsmede de verzending van een afschrift van
      de uitspraak en van het proces-verbaal van de mondelinge uitspraak aan een geadresseerde voor wie de verplichting
      tot digitaal procederen als bedoeld in [artikel 8:36a][ref1] niet geldt en die niet digitaal procedeert, geschieden
      door de griffier bij aangetekende brief, tenzij de bestuursrechter anders bepaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel837
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.6a
  - number: 8:37.2
    text: |-
      Voor het overige geschiedt de verzending van stukken aan geadresseerden als bedoeld in het eerste lid door de
      griffier bij gewone brief, tenzij de bestuursrechter anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel837
  - number: 8:37.3
    text: In een brief wordt de datum van verzending vermeld.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel837
  - number: 8:38.1
    text: |-
      Indien de griffier een bij aangetekende brief verzonden stuk terug ontvangt en hem blijkt dat de geadresseerde op
      de dag van verzending of uiterlijk een week daarna in de basisregistratie personen stond ingeschreven op het op het
      stuk vermelde adres, dan verzendt hij het stuk zo spoedig mogelijk bij gewone brief.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel838
  - number: 8:38.2
    text: |-
      In de overige gevallen waarin de griffier een bij aangetekende brief verzonden stuk terug ontvangt, verbetert hij,
      indien mogelijk, het op het stuk vermelde adres en verzendt hij het stuk opnieuw bij aangetekende brief.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel838
  - number: 8:39.1
    text: |-
      De griffier zendt de op de zaak betrekking hebbende stukken zo spoedig mogelijk aan partijen, voor zover de
      bestuursrechter niet op grond van de [artikelen 8:29][ref1] of [8:32][ref2] anders heeft beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel839
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.5
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.5
  - number: 8:39.2
    text: |-
      De griffier kan de toezending van zeer omvangrijke stukken of van stukken die bezwaarlijk kunnen worden
      vermenigvuldigd, achterwege laten. Hij stelt partijen daarvan in kennis en vermeldt daarbij dat deze stukken
      gedurende een door hem te bepalen termijn van ten minste een week ter griffie ter inzage worden gelegd.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel839
  - number: 8:39.3
    text: |-
      Partijen kunnen afschriften van of uittreksels uit de in het tweede lid bedoelde stukken verkrijgen. Met
      betrekking tot de kosten is het bij en krachtens de [Wet tarieven in strafzaken][ref1] bepaalde van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002406
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel839
    references:
      - id: ref1
        bwb_id: BWBR0002406
  - number: 8:40
    text: |-
      Indien het beroepschrift is ingediend door twee of meer personen, kan worden volstaan met verzending van de
      oproeping, de uitnodiging om op een zitting van de bestuursrechter te verschijnen, de op de zaak betrekking
      hebbende stukken en een afschrift van de uitspraak of van het proces-verbaal van de mondelinge uitspraak aan de
      persoon die als eerste in het beroepschrift is vermeld.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel840
  - number: 8:40a
    text: |-
      1 [Afdeling 2.3][ref1] is van overeenkomstige toepassing op het verkeer met de bestuursrechter.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het elektronisch verkeer
      met de bestuursrechter.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de toepassing van
      videoconferentie.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel840a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 8:41.1
    text: Van de indiener van het beroepschrift wordt door de griffier een griffierecht geheven.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel841
  - number: 8:41.2
    text: 'Het griffierecht bedraagt:'
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel841
  - number: 8:41.2.a
    text: |-
      € 49 indien door een natuurlijke persoon beroep is ingesteld tegen een besluit als omschreven in de bij deze wet
      behorende [Regeling verlaagd griffierecht][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel841
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 8:41.2.b
    text: € 181 indien door een natuurlijke persoon beroep is ingesteld tegen een ander besluit,
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel841
  - number: 8:41.2.c
    text: € 360 indien anders dan door een natuurlijke persoon beroep is ingesteld.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel841
  - number: 8:41.3
    text: |-
      Indien het een beroepschrift tegen twee of meer samenhangende besluiten dan wel van twee of meer indieners tegen
      hetzelfde besluit betreft, is eenmaal griffierecht verschuldigd. Dit griffierecht is gelijk aan het hoogste van de
      bedragen die bij toepassing van het tweede lid verschuldigd zouden zijn geweest.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel841
  - number: 8:41.4
    text: |-
      De griffier deelt de indiener van het beroepschrift mede welk griffierecht is verschuldigd en wijst hem daarbij op
      het bepaalde in het vijfde en zesde lid.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel841
  - number: 8:41.5
    text: |-
      Het griffierecht dient binnen vier weken na verzending van de mededeling van de griffier te zijn bijgeschreven op
      de rekening van het gerecht dan wel ter griffie te zijn gestort.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel841
  - number: 8:41.6
    text: |-
      Indien het bedrag niet tijdig is bijgeschreven of gestort, is het beroep niet-ontvankelijk, tenzij redelijkerwijs
      niet kan worden geoordeeld dat de indiener in verzuim is geweest.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel841
  - number: 8:41.7
    text: |-
      Indien het beroep wordt ingetrokken omdat het bestuursorgaan geheel of gedeeltelijk aan de indiener van het
      beroepschrift is tegemoetgekomen, vergoedt het bestuursorgaan aan de indiener het door deze betaalde griffierecht.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel841
  - number: 8:41.8
    text: |-
      In andere gevallen kan het bestuursorgaan, indien het beroep wordt ingetrokken, het betaalde griffierecht geheel of
      gedeeltelijk vergoeden.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel841
  - number: 8:41a
    text: De bestuursrechter beslecht het hem voorgelegde geschil zoveel mogelijk definitief.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel841a
  - number: 8:42.1
    text: |-
      Binnen vier weken na de dag van verzending van de gronden van het beroepschrift aan het bestuursorgaan zendt dit
      de op de zaak betrekking hebbende stukken aan de bestuursrechter en kan het een verweerschrift indienen. Indien de
      bestuursrechter om een verweerschrift heeft verzocht, dient het bestuursorgaan binnen vier weken een verweerschrift
      in.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel842
  - number: 8:42.2
    text: De bestuursrechter kan de in het eerste lid bedoelde termijnen verlengen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel842
  - number: 8:43.1
    text: |-
      De bestuursrechter kan de indiener van het beroepschrift in de gelegenheid stellen schriftelijk te repliceren. In
      dat geval wordt het bestuursorgaan in de gelegenheid gesteld schriftelijk te dupliceren. De bestuursrechter stelt
      de termijnen voor repliek en dupliek vast.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel843
  - number: 8:43.2
    text: |-
      De bestuursrechter stelt andere partijen dan de in het eerste lid bedoelde in de gelegenheid om ten minste eenmaal
      een schriftelijke uiteenzetting over de zaak te geven. Hij stelt hiervoor een termijn vast.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel843
  - number: 8:44.1
    text: |-
      De bestuursrechter kan partijen oproepen om in persoon dan wel in persoon of bij gemachtigde te verschijnen om te
      worden gehoord, al dan niet voor het geven van inlichtingen. Indien niet alle partijen worden opgeroepen, worden
      de niet opgeroepen partijen in de gelegenheid gesteld het horen bij te wonen en een uiteenzetting over de zaak
      te geven.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel844
  - number: 8:44.2
    text: Van het geven van inlichtingen wordt door de griffier een proces-verbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel844
  - number: 8:44.3
    text: |-
      Het wordt door de voorzitter en de griffier ondertekend. Bij verhindering van de voorzitter of de griffier wordt
      dit in het proces-verbaal vermeld.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel844
  - number: 8:45.1
    text: |-
      De bestuursrechter kan partijen en anderen verzoeken binnen een door hem te bepalen termijn schriftelijk
      inlichtingen te geven en onder hen berustende stukken in te zenden.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel845
  - number: 8:45.2
    text: |-
      Bestuursorganen zijn, ook als zij geen partij zijn, verplicht aan het verzoek, bedoeld in het eerste lid, te
      voldoen. [Artikel 8:29][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel845
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.5
  - number: 8:45.3
    text: |-
      Werkgevers van partijen zijn, ook als zij geen partij zijn, verplicht aan het verzoek, bedoeld in het eerste lid,
      te voldoen. [Artikel 8:29][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel845
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.5
  - number: 8:45.4
    text: |-
      Van het voornemen van de bestuursrechter tot het vragen van inlichtingen of advies aan de Europese Commissie
      krachtens artikel 15, eerste lid, van Verordening (EG) nr. 1/2003 van de Raad van 16 december 2002 betreffende de
      uitvoering van de mededingingsregels van de artikelen 81 en 82 van het Verdrag (PbEG 2003, L 1) wordt aan partijen
      mededeling gedaan. De bestuursrechter kan partijen in de gelegenheid stellen om hun wensen omtrent de te vragen
      inlichtingen of het te vragen advies binnen een door hem te bepalen termijn schriftelijk aan hem kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel845
  - number: 8:45.5
    text: |-
      Op het verstrekken van inlichtingen of advies door de Europese Commissie is [artikel 8:29][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel845
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.5
  - number: 8:45.6
    text: |-
      Partijen kunnen binnen vier weken na de dag van verzending aan hen van de inlichtingen of het advies van de
      Europese Commissie schriftelijk hun zienswijze met betrekking tot de inlichtingen of het advies naar voren brengen.
      De bestuursrechter kan deze termijn verlengen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel845
  - number: 8:45a.1
    text: |-
      De Europese Commissie en de Autoriteit Consument en Markt kunnen, niet optredende als partij, schriftelijke
      opmerkingen maken krachtens artikel 15, derde lid, eerste alinea, van de in [artikel 8:45, vierde lid][ref1],
      genoemde verordening indien zij de wens daartoe te kennen hebben gegeven. De bestuursrechter kan daarvoor een
      termijn vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel845a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.2
  - number: 8:45a.2
    text: |-
      Met toestemming van de bestuursrechter kunnen de Europese Commissie en de Autoriteit Consument en Markt ook
      mondelinge opmerkingen maken. De bestuursrechter kan de Europese Commissie en de Autoriteit Consument en Markt
      voor het maken van mondelinge opmerkingen uitnodigen. Partijen worden in de gelegenheid gesteld daarbij aanwezig te
      zijn. [Artikel 8:44, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel845a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.2
  - number: 8:45a.3
    text: |-
      De bestuursrechter doet partijen schriftelijk mededeling van de stukken die hij krachtens artikel 15, derde lid,
      tweede alinea, van de verordening aan de Europese Commissie of de Autoriteit Consument en Markt verstrekt met het
      oog op de door hen te maken opmerkingen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel845a
  - number: 8:45a.4
    text: |-
      Partijen kunnen binnen vier weken na de dag van verzending aan hen van de opmerkingen dan wel van het proces-
      verbaal van de opmerkingen van de Europese Commissie of de Autoriteit Consument en Markt schriftelijk hun
      zienswijze met betrekking tot de opmerkingen naar voren brengen. De bestuursrechter kan deze termijn verlengen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel845a
  - number: 8:46.1
    text: De bestuursrechter kan getuigen oproepen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel846
  - number: 8:46.2
    text: |-
      De bestuursrechter deelt de namen en woonplaatsen van de getuigen, de plaats en het tijdstip waarop dezen zullen
      worden gehoord en de feiten waarop het horen betrekking zal hebben, ten minste een week tevoren aan partijen mee.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel846
  - number: 8:46.3
    text: |-
      De [artikelen 179, eerste, tweede en derde lid, eerste volzin][ref1], en
      [180, eerste tot en met derde en vijfde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel179
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel180
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel846
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '179'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '180'
  - number: 8:47.1
    text: De bestuursrechter kan een deskundige benoemen voor het instellen van een onderzoek.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel847
  - number: 8:47.2
    text: Bij de benoeming worden vermeld de opdracht die moet worden vervuld en de termijn, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel847
  - number: 8:47.3
    text: |-
      Van het voornemen tot het benoemen van een deskundige als bedoeld in het eerste lid wordt aan partijen mededeling
      gedaan. De bestuursrechter kan partijen in de gelegenheid stellen om hun wensen omtrent het onderzoek binnen een
      door hem te bepalen termijn schriftelijk aan hem kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel847
  - number: 8:47.4
    text: |-
      De bestuursrechter stelt een termijn binnen welke de deskundige aan hem een schriftelijk verslag van het onderzoek
      uitbrengt.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel847
  - number: 8:47.5
    text: |-
      Partijen kunnen binnen vier weken na de dag van verzending van het verslag aan hen schriftelijk hun zienswijze met
      betrekking tot het verslag naar voren brengen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel847
  - number: 8:47.6
    text: De bestuursrechter kan de in het vijfde lid bedoelde termijn verlengen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel847
  - number: 8:48.1
    text: |-
      De arts die voor het instellen van een onderzoek als bedoeld in [artikel 8:47, eerste lid][ref1], een persoon moet
      onderzoeken, kan de voor het onderzoek van belang zijnde inlichtingen over deze persoon inwinnen bij de behandelend
      arts of de behandelende artsen, de verzekeringsarts en de adviserend arts van het bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel848
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.2
  - number: 8:48.2
    text: |-
      Zij verstrekken de gevraagde inlichtingen voor zover daardoor de persoonlijke levenssfeer van de betrokken persoon
      niet onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel848
  - number: 8:49
    text: De bestuursrechter kan tolken benoemen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel849
  - number: 8:50.1
    text: |-
      De bestuursrechter kan een onderzoek ter plaatse instellen. Hij heeft daarbij toegang tot elke plaats voor zover
      dat redelijkerwijs voor de vervulling van zijn taak nodig is.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel850
  - number: 8:50.2
    text: Bestuursorganen verlenen de medewerking die in het belang van het onderzoek is vereist.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel850
  - number: 8:50.3
    text: |-
      Van plaats en tijdstip van het onderzoek wordt aan partijen mededeling gedaan. Zij kunnen bij het onderzoek
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel850
  - number: 8:50.4
    text: Van het onderzoek wordt door de griffier een proces-verbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel850
  - number: 8:50.5
    text: |-
      Het wordt door de voorzitter en de griffier ondertekend. Bij verhindering van de voorzitter of de griffier wordt
      dit in het proces-verbaal vermeld.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel850
  - number: 8:51.1
    text: |-
      De bestuursrechter kan aan de griffier opdragen een onderzoek ter plaatse in te stellen. Deze heeft daarbij
      toegang tot elke plaats voor zover dat redelijkerwijs voor de vervulling van de hem opgedragen taak nodig is. De
      bestuursrechter is bevoegd tot het geven van een machtiging tot binnentreden.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel851
  - number: 8:51.2
    text: |-
      [Artikel 8:50, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel851
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.2
  - number: 8:51.3
    text: Van het onderzoek wordt door de griffier een proces-verbaal opgemaakt, dat door hem wordt ondertekend.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel851
  - number: 8:51a.1
    text: |-
      De bestuursrechter kan het bestuursorgaan in de gelegenheid stellen een gebrek in het bestreden besluit te
      herstellen of te laten herstellen. De vorige volzin vindt geen toepassing, indien belanghebbenden die niet als
      partij aan het geding deelnemen daardoor onevenredig kunnen worden benadeeld.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel851a
  - number: 8:51a.2
    text: |-
      De bestuursrechter bepaalt de termijn waarbinnen het bestuursorgaan het gebrek kan herstellen. Hij kan deze termijn
      verlengen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel851a
  - number: 8:51b.1
    text: |-
      Het bestuursorgaan deelt de bestuursrechter zo spoedig mogelijk mede of het gebruik maakt van de gelegenheid om het
      gebrek te herstellen of te laten herstellen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel851b
  - number: 8:51b.2
    text: |-
      Indien het bestuursorgaan overgaat tot herstel van het gebrek, deelt het de bestuursrechter zo spoedig mogelijk
      schriftelijk mede op welke wijze het gebrek is hersteld.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel851b
  - number: 8:51b.3
    text: |-
      Partijen kunnen binnen vier weken na verzending van de mededeling bedoeld in het tweede lid, schriftelijk hun
      zienswijze over de wijze waarop het gebrek is hersteld, naar voren brengen. De bestuursrechter kan deze termijn
      verlengen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel851b
  - number: 8:51c
    text: 'De bestuursrechter deelt partijen mede op welke wijze het beroep verder wordt behandeld binnen vier weken na:'
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel851c
  - number: 8:51c.a
    text: |-
      ontvangst van de mededeling van het bestuursorgaan dat het geen gebruik maakt van de gelegenheid om het gebrek te
      herstellen of te laten herstellen;
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel851c
  - number: 8:51c.b
    text: |-
      het ongebruikt verstrijken van de termijn bedoeld in [artikel 8:51a, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel851c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.2a
  - number: 8:51c.c
    text: ontvangst van de zienswijzen; of
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel851c
  - number: 8:51c.d
    text: |-
      het ongebruikt verstrijken van de termijn bedoeld in [artikel 8:51b, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel851c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.2a
  - number: 8:51d
    text: |-
      Indien de bestuursrechter in hoogste aanleg uitspraak doet, kan hij het bestuursorgaan
      opdragen een gebrek in het bestreden besluit te herstellen of te laten herstellen. De
      [artikelen 8:51a, eerste lid, tweede volzin, en tweede lid][ref1], [8:51b, tweede en derde lid][ref2], en
      [8:51c, aanhef en onderdelen b tot en met d][ref3], zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel851d
