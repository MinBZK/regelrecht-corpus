  - number: B2:4
    text: |-
      Tegen een besluit, genomen op grond van een in dit artikel genoemd voorschrift of anderszins
      in dit artikel omschreven, kan beroep worden ingesteld bij het College van Beroep voor het
      bedrijfsleven. Een besluit van de Sociaal-Economische Raad of van de Kamer van Koophandel, genoemd in
      [artikel 2 van de Wet op de Kamer van Koophandel][ref1], met uitzondering van: a. een besluit op grond van de
      [Wet openbaarheid van bestuur][ref2] b. een besluit ten aanzien van een persoon met betrekking tot diens in
      [artikel 3 van de Ambtenarenwet 2017][ref3] bedoelde hoedanigheid [Algemene douanewet][ref4]: een beschikking
      ter zake van landbouwrestituties Algemene wet bestuursrecht: [artikel 5:32][ref5], voor zover het betreft een
      besluit dat betrekking heeft op de handhaving van het bepaalde bij of krachtens de [Winkeltijdenwet][ref6]
      [Bankwet 1998][ref7]: [artikel 12, vierde lid][ref8], voor zover het een schorsing of ontheffing van een directeur
      betreft [ Burgerlijk Wetboek, Boek 2][ref9], voor zover het besluit is bekendgemaakt voor 1 juli 2011: a.
      [artikel 64, derde lid][ref10], tweede volzin, voor zover het betreft een weigering om de in de eerste volzin
      bedoelde termijn te verlengen b. de [artikelen 68, tweede lid][ref11], en [125, tweede lid][ref12], voor zover
      het betreft een weigering van een verklaring c. [artikel 156][ref13], voor zover het betreft: 1. een weigering,
      wijziging of intrekking van een ontheffing 2. een besluit tot verlening van de ontheffing voor zover daaraan
      voorschriften zijn verbonden dan wel daarbij beperkingen zijn opgelegd d. [artikel 175, derde lid][ref14],
      tweede volzin, voor zover het betreft een afwijzing van een verzoek e. de [artikelen 179, tweede lid][ref15],
      en [235, tweede lid][ref16], voor zover het betreft een weigering van een verklaring f. [artikel 266][ref17],
      voor zover het betreft: 1. een besluit tot weigering, wijziging of intrekking van de ontheffing 2. een besluit
      tot verlening van de ontheffing voor zover daaraan voorschriften zijn verbonden dan wel daarbij beperkingen
      zijn opgelegd [Elektriciteitswet 1998][ref18], met inbegrip van een besluit van de Autoriteit Consument en
      Markt, genomen op grond van de [artikelen 36][ref19], [37][ref20], [41][ref21], [41c][ref22], [55][ref23],
      [56, tweede lid][ref24], en [57, derde en vierde lid][ref25], dat kan worden aangemerkt als algemeen
      verbindend voorschrift als bedoeld in [artikel 8:3, eerste lid][ref26], van de Algemene wet bestuursrecht en
      met uitzondering van een besluit op grond van de [artikelen 9b, vierde lid][ref27], [9c, derde lid][ref28],
      [9d, tweede en derde lid][ref29], [9e, vijfde lid][ref30], [9f, zesde lid][ref31], [20a, derde lid][ref32],
      [20b, derde lid][ref33], [20c, tweede en derde lid][ref34], [77h][ref35] en [77i][ref36] [Gaswet][ref37], met
      inbegrip van een besluit van de Autoriteit Consument en Markt, genomen op grond van de [artikelen 12f][ref38],
      [12g][ref39], [23][ref40], [24, tweede lid][ref41], [25, derde en vierde lid][ref42], [81][ref43],
      [81c][ref44] en [82][ref45], dat kan worden aangemerkt als algemeen verbindend voorschrift als bedoeld in
      [artikel 8:3, eerste lid][ref46], van de Algemene wet bestuursrecht en met uitzondering van een besluit op grond
      van de [artikelen 16][ref47], [39b, derde lid][ref48], [39c, derde lid][ref49], [39d, tweede en derde lid][ref50],
      [60ac][ref51] en [60ad][ref52] [Gemeentewet][ref53]: [artikel 125][ref54], voor zover het betreft een besluit dat
      betrekking heeft op de handhaving van het bepaalde bij of krachtens de [Winkeltijdenwet][ref55] [Gezondheids- en
      welzijnswet voor dieren](onbekend), met uitzondering van [artikel 120b, eerste lid][ref56] [Hamsterwet][ref57]
      [Kaderwet EZ-subsidies][ref58] [Landbouwkwaliteitswet][ref59] [Landbouwwet][ref60]: de [artikelen 13][ref61],
      [15][ref62], [17 tot en met 22][ref63] en [26][ref64] [Loodsenwet][ref65]: de [artikelen 21, derde lid][ref66],
      [27b, vierde lid][ref67], [27d][ref68], [27e][ref69], [27f][ref70], [27h][ref71] en [27l][ref72] Marktverordening
      voor het wegvervoer [Meststoffenwet][ref73], met uitzondering van [artikel 51][ref74] [Metrologiewet][ref75]
      [Noodwet voedselvoorziening][ref76]: de [artikelen 6 tot en met 10][ref77] en [29][ref78], behoudens in geval
      van toepassing van [artikel 18][ref79] [ Plantgezondheidswet][ref80], met uitzondering van [artikel 26][ref81]
      [Postwet 2009][ref82]: [hoofdstuk 3A][ref83] en [artikel 58][ref84] [Prijzennoodwet][ref85] [Prijzenwet ][ref86]
      [Scheepvaartverkeerswet][ref87]: de [artikelen 14a, tweede lid, eerste volzin][ref88], en [15ba, eerste lid][ref89]
      [Spoorwegwet][ref90]: [hoofdstuk 5][ref91], [paragraaf 2][ref92], en [artikel 71, tweede lid][ref93]
      [Telecommunicatiewet][ref94], voor zover het betreft een besluit van de Autoriteit Consument en Markt, genomen
      op grond van: a. [hoofdstuk 6][ref95], tenzij beroep kon worden ingesteld voor de inwerkingtreding van de
      [Wet implementatie Europees regelgevingskader voor de elektronische communicatiesector 2002][ref96] b. de
      [hoofdstukken 5a][ref97], [6a][ref98], [6b][ref99] en [12][ref100] c. [hoofdstuk 15][ref101], met uitzondering van
      de [artikelen 15.2][ref102], [15.2a][ref103] en [15.4][ref104] [Uitvoeringswet EU-zeehavenverordening][ref105]:
      [artikel 7][ref106], voor zover het betreft een besluit van de Autoriteit Consument en Markt
      [Uitvoeringswet verordening Europese coöperatieve vennootschap][ref107]: het verzet, bedoeld in de
      [artikelen 6, eerste lid][ref108], en [9][ref109] [Uitvoeringswet verordening Europese vennootschap][ref110]:
      het verzet, bedoeld in de [artikelen 5, eerste lid][ref111], en [7][ref112] Verordening (EG) nr. 1435/2003 van
      de Raad van 22 juli 2003 betreffende het statuut voor een Europese Coöperatieve Vennootschap (SCE) (PbEU 2003,
      L 207): artikel 7, veertiende lid, tweede alinea Verordening (EG) nr. 2157/2001 van de Raad van 8 oktober 2001
      betreffende het statuut van de Europese vennootschap (SE) (PbEG 2001, L 294): artikel 8, veertiende lid, tweede
      alinea Verordening (EU) nr. 806/2014 van het Europees parlement en de Raad van 15 juli 2014 tot vaststelling
      van eenvormige regels en een eenvormige procedure voor de afwikkeling van kredietinstellingen en bepaalde
      beleggingsondernemingen in het kader van een gemeenschappelijk afwikkelingsmechanisme en een gemeenschappelijk
      bankenafwikkelingsfonds en tot wijziging van Verordening (EU) nr. 1093/2010 van het Europees parlement en de
      Raad (PbEU 2014, L 225): de artikelen 16, 18 en 21 Verordening (EU) nr. 2017/1129 van het Europees Parlement
      en de Raad van 14 juni 2017 betreffende het prospectus dat moet worden gepubliceerd wanneer effecten aan het
      publiek worden aangeboden of tot de handel op een gereglementeerde markt worden toegelaten en tot intrekking
      van [Richtlijn 2003/71/EG](32003L0071) (PbEU 2017, L 168): de artikelen 20, eerste en vijfde lid, en 23, eerste
      lid [Waarborgwet 2019][ref113], met uitzondering van [artikel 38][ref114] [Warmtewet][ref115], met inbegrip
      van een op grond van [artikel 5, eerste lid][ref116], genomen besluit tot vaststelling van een maximumprijs,
      en met uitzondering van [artikel 18][ref117] [Wedervergeldingswet zeescheepvaart][ref118]: a. een verlening of
      weigering van een vergunning of een ontheffing b. een intrekking van een vergunning of een ontheffing krachtens
      [artikel 7][ref119] c. een oplegging van een heffing [Wet capaciteitsbeheersing binnenvaartvloot][ref120]
      [Wet dieren][ref121], met uitzondering van een besluit op grond van [artikel 8.7][ref122]
      [Wet geneesmiddelenprijzen][ref123], met uitzondering van [artikel 11][ref124] en met inbegrip van een besluit
      tot vaststelling van een maximumprijs [Wet gewasbeschermingsmiddelen en biociden][ref125], met uitzondering
      van de [artikelen 90][ref126] en [108][ref127] [Wet implementatie EU-richtlijnen energie-efficiëntie][ref128],
      met uitzondering van de [artikelen 21][ref129] en [22][ref130] [Wet inkomstenbelasting 2001][ref131]: a. de
      [artikelen 3.37, eerste lid][ref132], en [3.42, eerste lid][ref133], voor zover het betreft een besluit van
      Onze Minister van Economische Zaken en Klimaat, en b. [artikel 3.52a, eerste, tweede en elfde lid][ref134],
      voor zover het betreft een besluit van Onze Minister van Economische Zaken en Klimaat, met uitzondering
      van een boetebesluit als bedoeld in het elfde lid en een daarmee samenhangende correctie-RDA-
      beschikking als bedoeld in het tweede lid [ Wet langdurige zorg][ref135]: [artikel 11.4.1][ref136]
      en [artikel 11.4.2][ref137] [Wet luchtvaart][ref138]: de [artikelen 8.25ea, vierde lid][ref139],
      [8.25f, tweede, vierde en vijfde lid][ref140], [8.25g, eerste lid][ref141], [8.40f, vierde lid][ref142], en
      [8.40g, tweede, vierde en vijfde lid][ref143] [Wet marktordening gezondheidszorg][ref144], met uitzondering
      van beschikkingen van de Nederlandse Zorgautoriteit als bedoeld in [paragraaf 4 van hoofdstuk 6][ref145]
      [Wet medewerking verdedigingsvoorbereiding][ref146] [Wet nationaliteit zeeschepen in rompbevrachting][ref147]
      [Wet op de architectentitel][ref148], met inbegrip van een besluit inzake een aanwijzing als
      bedoeld in de [artikelen 9, eerste lid, onderdeel j][ref149], [10, eerste lid, onderdeel f][ref150],
      [11, eerste lid, onderdeel f][ref151], en [12, eerste lid, onderdeel f][ref152], dat kan worden aangemerkt
      als algemeen verbindend voorschrift als bedoeld in [artikel 8:3, eerste lid][ref153], van de Algemene wet
      bestuursrecht, tenzij het betreft een besluit als bedoeld in [artikel 8:4, derde lid, onderdeel b][ref154], van
      de Algemene wet bestuursrecht [Wet op het accountantsberoep][ref155] [Wet op het financieel toezicht][ref156]:
      a. [artikel 1:26, eerste en tweede lid][ref157], de [artikelen 3A:17 tot en met 3A:19][ref158],
      [3A:85][ref159] en [3A:86][ref160] en de [artikelen 5:77, eerste lid][ref161], en [5:81, derde lid][ref162]
      b. een besluit terzake van het ingevolge [artikel 5:76, tweede lid][ref163], of [5:80b, vijfde lid][ref164],
      bepaalde, met uitzondering van een besluit tot het opleggen van een bestuurlijke boete als
      bedoeld in [artikel 1:80][ref165] [Wet personenvervoer 2000][ref166], met uitzondering van
      de [artikelen 56, eerste lid][ref167], [59, eerste lid][ref168], [94, eerste lid][ref169],
      en [96, eerste lid][ref170] [Wet terugvordering staatssteun][ref171]: [artikel 3][ref172]
      [Wet uitvoering Internationaal Energieprogramma][ref173] [Wet verbod pelsdierhouderij][ref174]
