  - number: 8:108.3
    text: |-
      Indien hoger beroep kan worden ingesteld bij een gerechtshof, is voorts
      [hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8108
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: V
  - number: 8:109.1
    text: 'Het griffierecht voor het hoger beroep bedraagt:'
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8109
  - number: 8:109.1.a
    text: |-
      € 134 indien door een natuurlijke persoon hoger beroep is ingesteld tegen een uitspraak omtrent een besluit als
      omschreven in de bij deze wet behorende [Regeling verlaagd griffierecht][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8109
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 8:109.1.b
    text: |-
      € 270 indien door een natuurlijke persoon hoger beroep is ingesteld tegen een uitspraak omtrent een ander besluit,
      of
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8109
  - number: 8:109.1.c
    text: € 541 als anders dan door een natuurlijke persoon hoger beroep is ingesteld.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8109
  - number: 8:109.2
    text: |-
      Indien het bestuursorgaan hoger beroep heeft ingesteld en de aangevallen uitspraak in stand blijft, wordt van het
      bestuursorgaan een griffierecht geheven dat gelijk is aan het in het eerste lid, onderdeel c, genoemde bedrag.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8109
  - number: 8:110.1
    text: |-
      Indien hoger beroep is ingesteld, kan degene die ook hoger beroep had kunnen instellen, incidenteel hoger beroep
      instellen. De voorschriften omtrent het hoger beroep zijn van toepassing, tenzij in deze titel anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8110
  - number: 8:110.2
    text: |-
      Het incidenteel hoger beroep wordt ingesteld binnen zes weken nadat de hogerberoepsrechter de gronden van het hoger
      beroep aan de desbetreffende partij heeft verzonden.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8110
  - number: 8:110.3
    text: |-
      Binnen vier weken nadat de hogerberoepsrechter de gronden van het incidenteel hoger beroep aan partijen heeft
      verzonden, kunnen deze partijen schriftelijk hun zienswijze omtrent het incidenteel hoger beroep naar voren
      brengen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8110
  - number: 8:110.4
    text: |-
      De hogerberoepsrechter kan de in het tweede en derde lid genoemde termijnen verlengen of, indien hij het hoger
      beroep behandelt met overeenkomstige toepassing van [afdeling 8.2.3][ref1], verkorten.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8110
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '8'
        afdeling: 8.2.3
  - number: 8:110.5
    text: Voor het incidenteel hoger beroep is geen griffierecht verschuldigd.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8110
  - number: 8:111.1
    text: |-
      Niet-ontvankelijkheid van het hoger beroep heeft geen gevolgen voor de ontvankelijkheid van het incidenteel hoger
      beroep, tenzij die niet-ontvankelijkheid het gevolg is van:
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8111
  - number: 8:111.1.a
    text: overschrijding van de termijn voor het instellen van hoger beroep,
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8111
  - number: 8:111.1.b
    text: overschrijding van de termijn voor betaling van het griffierecht, of
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8111
  - number: 8:111.1.c
    text: de omstandigheid dat degene die het hoger beroep heeft ingesteld daartoe niet gerechtigd was.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8111
  - number: 8:111.2
    text: |-
      Intrekking van het hoger beroep na aanvang van de termijn voor het instellen van incidenteel hoger beroep heeft
      geen gevolgen voor de ontvankelijkheid van het incidenteel hoger beroep.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8111
  - number: 8:112.1
    text: Incidenteel hoger beroep kan worden ingesteld onder de voorwaarde dat het hoger beroep gegrond is.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8112
  - number: 8:112.2
    text: |-
      Een voorwaardelijk incidenteel hoger beroep vervalt als het hoger beroep niet-ontvankelijk of ongegrond is, dan wel
      wordt ingetrokken. In het laatste geval deelt de griffier de indiener mee dat zijn hoger beroep is vervallen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8112
  - number: 8:113.1
    text: |-
      De hogerberoepsrechter bevestigt de uitspraak van de rechtbank, hetzij met overneming, hetzij met verbetering van
      de gronden, of doet, met gehele of gedeeltelijke vernietiging van de uitspraak, hetgeen de rechtbank zou behoren
      te doen.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8113
  - number: 8:113.2
    text: |-
      Indien de uitspraak van de hogerberoepsrechter ertoe strekt dat het bestuursorgaan een nieuw besluit neemt, kan de
      uitspraak tevens inhouden dat beroep tegen dat besluit slechts kan worden ingesteld bij de hogerberoepsrechter.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8113
  - number: 8:114.1
    text: |-
      Indien de hogerberoepsrechter de uitspraak van de rechtbank geheel of gedeeltelijk vernietigt, houdt de uitspraak
      tevens in dat het bestuursorgaan aan de indiener van het beroepschrift het door hem betaalde griffierecht vergoedt,
      tenzij de hogerberoepsrechter bepaalt dat het griffierecht door de griffier aan de indiener wordt terugbetaald.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8114
  - number: 8:114.2
    text: |-
      In andere gevallen kan de uitspraak inhouden dat het bestuursorgaan of de griffier het betaalde griffierecht geheel
      of gedeeltelijk vergoedt.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8114
  - number: 8:115.1
    text: 'De hogerberoepsrechter wijst de zaak terug naar de rechtbank die deze in eerste aanleg heeft behandeld, indien:'
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8115
  - number: 8:115.1.a
    text: |-
      de rechtbank haar onbevoegdheid of de niet-ontvankelijkheid van het beroep heeft uitgesproken en de
      hogerberoepsrechter deze uitspraak vernietigt met bevoegdverklaring van de rechtbank, onderscheidenlijk
      ontvankelijkverklaring van het beroep, of
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8115
  - number: 8:115.1.b
    text: |-
      de hogerberoepsrechter om andere redenen van oordeel is dat de zaak opnieuw door de rechtbank moet worden
      behandeld.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8115
  - number: 8:115.2
    text: |-
      De griffier zendt de gedingstukken en een afschrift van de uitspraak zo spoedig mogelijk aan de griffier van de
      rechtbank.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8115
  - number: 8:116
    text: |-
      In de gevallen, bedoeld in [artikel 8:115, eerste lid, onderdeel a][ref1], kan de hogerberoepsrechter de zaak
      zonder terugwijzing afdoen, indien deze naar zijn oordeel geen nadere behandeling door de rechtbank behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8116
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
  - number: 8:117
    text: |-
      Indien de uitspraak is gedaan door een andere rechtbank dan de bevoegde, kan de hogerberoepsrechter de uitspraak
      als bevoegdelijk gedaan aanmerken.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8117
  - number: 8:118.1
    text: |-
      In geval van intrekking van het hoger beroep door het bestuursorgaan kan het bestuursorgaan op verzoek van een
      partij bij afzonderlijke uitspraak met overeenkomstige toepassing van [artikel 8:75][ref1] in de kosten worden
      veroordeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8118
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.6
  - number: 8:118.2
    text: |-
      Indien het hoger beroep mondeling wordt ingetrokken, wordt het verzoek door de partij die daarbij aanwezig is
      mondeling gedaan, tegelijk met de intrekking van het hoger beroep. Indien aan dit vereiste niet is voldaan, is het
      verzoek niet-ontvankelijk.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8118
  - number: 8:118.3
    text: |-
      Indien het hoger beroep schriftelijk wordt ingetrokken, wordt het verzoek schriftelijk gedaan. In dat geval zijn
      de [artikelen 6:5 tot en met 6:9][ref1], [6:11][ref2], [6:14][ref3], [6:15][ref4], [6:17][ref5] en [6:21][ref6] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8118
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
  - number: 8:118.4
    text: |-
      [Artikel 8:75a, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8118
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.6
  - number: 8:119.1
    text: |-
      De bestuursrechter kan op verzoek van een partij een onherroepelijk geworden uitspraak herzien op grond van feiten
      of omstandigheden die:
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8119
  - number: 8:119.1.a
    text: hebben plaatsgevonden vóór de uitspraak,
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8119
  - number: 8:119.1.b
    text: |-
      bij de indiener van het verzoekschrift vóór de uitspraak niet bekend waren en redelijkerwijs niet bekend konden
      zijn, en
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8119
  - number: 8:119.1.c
    text: waren zij bij de bestuursrechter eerder bekend geweest, tot een andere uitspraak zouden hebben kunnen leiden.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8119
  - number: 8:119.2
    text: |-
      [Hoofdstuk 6, titel 8.1][ref1], met uitzondering van [afdeling 8.1.1][ref2] en [artikel 8:13][ref3],
      [titel 8.2][ref4], met uitzondering van [artikel 8:41, tweede lid][ref5], [titel 8.3][ref6] en [titel 8.5][ref7],
      met uitzondering van [artikel 8:109][ref8], zijn voor zover nodig van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
      [ref8]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel8119
    references:
