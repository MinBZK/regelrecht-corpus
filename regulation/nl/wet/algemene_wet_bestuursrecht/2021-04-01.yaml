  - number: B2:11
    text: |-
      Tegen een uitspraak van de rechtbank of van de voorzieningenrechter omtrent een besluit, genomen op grond
      van een in dit artikel genoemd voorschrift of anderszins in dit artikel omschreven, kan hoger beroep worden
      ingesteld bij het College van Beroep voor het bedrijfsleven. [Aanbestedingswet 2012][ref1], [artikel 4.21][ref2]
      [Aanbestedingswet op defensie- en veiligheidsgebied][ref3], [artikel 3.8][ref4] [Bankwet 1998][ref5]:
      [artikel 9c, eerste en tweede lid][ref6] [Burgerlijk Wetboek][ref7]: de [artikelen 63d, tweede lid][ref8],
      [156][ref9] en [266 van Boek 2][ref10] [ Drinkwaterwet][ref11]: [artikel 50, derde lid][ref12], in samenhang
      met [artikel 70a van de Mededingingswet][ref13] [Elektriciteitswet 1998][ref14]: de [artikelen 77h][ref15] en
      [77i][ref16] [Gaswet][ref17]: de [artikelen 16][ref18], [60ac][ref19] en [60ad ][ref20] [Gezondheids- en welzijnswet
      voor dieren](onbekend): [artikel 120b, eerste lid][ref21] [Instellingswet Autoriteit Consument en Markt][ref22]
      [Invoerings- en aanpassingswet Pensioenwet][ref23] [Loodsenwet][ref24], met uitzondering van de
      [artikelen 21, derde lid][ref25], [27b, vierde lid][ref26], [27d][ref27], [27e][ref28], [27f][ref29], [27h][ref30]
      en [27l][ref31] [Mededingingswet][ref32] [Meststoffenwet][ref33]: [artikel 51][ref34] [Muntwet 2002][ref35]:
      [artikel 11, eerste en tweede lid][ref36] [Overgangswet elektriciteitsproductiesector][ref37] [Pensioenwet][ref38]
      [Plantgezondheidswet][ref39]: [artikel 26][ref40] [Postwet 2009][ref41], met uitzondering van [hoofdstuk 3A][ref42]
      en [artikel 58][ref43] [Sanctiewet 1977][ref44]: de [artikelen 10ba tot en met 10d][ref45] [Spoorwegwet][ref46],
      met uitzondering van de [artikelen 19][ref47], [21][ref48] en [hoofdstuk 5][ref49], [paragraaf 2][ref50], en
      [artikel 71, tweede lid][ref51] [Tabaks- en rookwarenwet][ref52] [Telecommunicatiewet][ref53], met inbegrip
      van de verordeningen genoemd in [artikel 18.2a][ref54], met uitzondering van: a. de [artikelen 3.5][ref55],
      [3.5a][ref56], [3.5b][ref57], [3.22][ref58], [15.2, derde lid][ref59], [15.4, vierde lid][ref60], en
      [18.9, eerste en tweede lid][ref61] b. alsmede, voor zover het betreft een besluit van de Autoriteit Consument
      en Markt: 1. [hoofdstuk 6][ref62], tenzij beroep kon worden ingesteld voor de inwerkingtreding van de
      [Wet implementatie Europees regelgevingskader voor de elektronische communicatiesector 2002][ref63] 2. de
      [hoofdstukken 5a][ref64], [6a][ref65], [6b][ref66] en [12][ref67] 3. [hoofdstuk 15][ref68], met uitzondering
      van de [artikelen 15.2][ref69], [15.2a][ref70] en [15.4][ref71]. [Uitvoeringswet EU-zeehavenverordening][ref72]:
      [artikel 9, eerste lid][ref73] Verordening (EU) nr. 806/2014 van het Europees parlement en de Raad van
      15 juli 2014 tot vaststelling van eenvormige regels en een eenvormige procedure voor de afwikkeling
      van kredietinstellingen en bepaalde beleggingsondernemingen in het kader van een gemeenschappelijk
      afwikkelingsmechanisme en een gemeenschappelijk bankenafwikkelingsfonds en tot wijziging van Verordening
      (EU) nr. 1093/2010 van het Europees parlement en de Raad (PbEU 2014, L 225), met uitzondering van de
      artikelen 16, 18 en 21 [Waarborgwet 2019][ref74]: [artikel 38][ref75] [Warenwet][ref76] [Warmtewet][ref77]:
      [artikel 18][ref78] [Wet aanwijzing nationale accreditatie-instantie][ref79]: [hoofdstuk 3][ref80]
      [Wet bekostiging financieel toezicht][ref81] [Wet bestrijding maritieme ongevallen][ref82]
      [Wet bestuurlijke boete meldingsplichten door ministers verstrekte subsidies][ref83], voor
      zover de boete is opgelegd ter zake van het niet voldoen aan een bijzondere meldingsplicht
      die is verbonden aan een krachtens de [Kaderwet EZ-subsidies][ref84] verstrekte subsidie
      [ Wet beveiliging netwerk- en informatiesystemen][ref85], voor zover het een besluit betreft dat betrekking
      heeft op een aanbieder van een essentiële dienst in de sectoren energie, digitale infrastructuur,
      bankwezen, infrastructuur voor de financiële markt en spoor of op een digitaledienstverlener
      [Wet dieren][ref86]: [artikel 8.7][ref87] [Wet financiële betrekkingen buitenland 1994][ref88]
      [Wet geneesmiddelenprijzen][ref89]: [artikel 11][ref90] [Wet gewasbeschermingsmiddelen en biociden][ref91]:
      [artikel 90][ref92] [Wet handhaving consumentenbescherming][ref93]
      [Wet implementatie EU-richtlijnen energie-efficiëntie][ref94]: de [artikelen 21][ref95] en
      [22][ref96] [Wet informatie-uitwisseling bovengrondse en ondergrondse netten en netwerken][ref97]
      [Wet inkomstenbelasting 2001][ref98]: een boetebesluit als bedoeld in [artikel 3.52a, elfde lid][ref99],
      en een daarmee samenhangende correctie-RDA-beschikking als bedoeld in het tweede lid van dit artikel
      [Wet inzake de geldtransactiekantoren][ref100],voor zover die wet nog van toepassing is op grond
      van [artikel IX van de Wijzigingswet financiële markten 2012][ref101] [Wet lokaal spoor][ref102],
      met uitzondering van [artikel 12][ref103] [Wet luchtvaart][ref104]: [artikel 11.24][ref105]
      [Wet marktordening gezondheidszorg][ref106], voor zover het betreft een besluit van de Nederlandse Zorgautoriteit
      als bedoeld in [hoofdstuk 6, paragraaf 4 ][ref107] [Wet op de inlichtingen- en veiligheidsdiensten 2017:][ref108]
      [artikel 53, zevende lid][ref109] [Wet op het financieel toezicht][ref110], met uitzondering
      van: a. de [artikelen 3A:17 tot en met 3A:19][ref111], [3A:85][ref112] en [3A:86][ref113] b. de
      [artikelen 5:77, eerste lid][ref114], en [5:81, derde lid][ref115] c. een besluit terzake van het ingevolge
      [artikel 5:76, tweede lid][ref116], of [5:80b, vijfde lid][ref117], bepaalde, met uitzondering van een besluit
      tot het opleggen van een bestuurlijke boete als bedoeld in [artikel 1:80][ref118] d. de [artikelen 6:1][ref119]
      en [6:2][ref120] [Wet op het notarisambt][ref121], voor zover het de toepassing of overeenkomstige toepassing
      van de [Wet verplichte beroepspensioenregeling][ref122] betreft op grond van [artikel 113c][ref123]
      [Wet personenvervoer 2000][ref124]: de [artikelen 56, eerste lid][ref125], [59, eerste lid][ref126],
      [94, eerste lid][ref127], en [96, eerste lid][ref128] [Wet privatisering APB][ref129], voor zover het de
      overeenkomstige toepassing van de [Wet verplichte deelneming in een bedrijfstakpensioenfonds 2000][ref130]
      betreft op grond van [artikel 21, vierde lid][ref131] [Wet schadefonds olietankschepen][ref132]
      [Wet ter voorkoming van witwassen en financieren van terrorisme][ref133]
      [Wet toezicht accountantsorganisaties][ref134]
      [Wet toezicht financiële verslaggeving][ref135] [Wet toezicht trustkantoren 2018][ref136]
