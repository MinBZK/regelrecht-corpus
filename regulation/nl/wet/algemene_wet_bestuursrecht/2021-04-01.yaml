  - number: B3:1.a
    text: |-
      een besluit inzake een uitkering bij werkloosheid of ziekte, genomen ten aanzien van een persoon met betrekking tot
      diens in [artikel 3 van de Ambtenarenwet 2017][ref1] bedoelde hoedanigheid;


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel3
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '3'
  - number: B3:1.b
    text: |-
      een besluit inzake een uitkering op grond van blijvende arbeidsongeschiktheid op grond van een wettelijk
      voorschrift waarbij de natuurlijke persoon ter zake van zijn arbeidsongeschiktheid vanwege het Rijk
      invaliditeitspensioen is verzekerd, of een besluit, genomen op grond van artikel P9 van de Algemene burgerlijke
      pensioenwet;
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel1
  - number: B3:1.c
    text: een bestuurlijke boete van ten hoogste € 340;
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel1
  - number: B3:1.d
    text: een besluit waarbij de kosten van bestuursdwang op ten hoogste € 340 zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005537/2021-04-01#Artikel1
  - number: B3:2
    text: |-
      Het tarief, genoemd in [artikel 8:41, tweede lid, onderdeel a][ref1], dan wel genoemd in
      [artikel 8:109, eerste lid, onderdeel a][ref2], geldt voorts indien het beroep, dan wel hoger beroep,
      betreft een besluit, genomen op grond van een in dit artikel genoemd voorschrift of anderszins in dit
      artikel omschreven. De volgende besluiten: a. een besluit over een gehandicaptenparkeerkaart als bedoeld in
      [hoofdstuk IV van het Besluit administratieve bepalingen inzake het wegverkeer][ref3] b. een op grond van een
      gemeentelijke verordening of gemeenschappelijke regeling genomen besluit over een gehandicaptenparkeerkaart
      c. een besluit over een gehandicaptenparkeerplaats voor een bepaald voertuig [Algemene bijstandswet][ref4]
      [Algemene Kinderbijslagwet][ref5] [Algemene nabestaandenwet ][ref6] [Algemene Ouderdomswet][ref7]
      [Algemene wet inkomensafhankelijke regelingen][ref8] [Algemene wet inzake rijksbelastingen][ref9], tenzij het beroep
      of hoger beroep door een natuurlijke persoon is ingesteld tegen een uitspraak inzake een besluit met betrekking tot
      de toepassing van: a. de [Wet op de dividendbelasting 1965][ref10] b. de [Wet op de omzetbelasting 1968][ref11] c.
      de [Wet op de belasting van personenauto’s en motorrijwielen 1992][ref12] d. de [Wet op de accijns][ref13] e. de
      [Wet op de verbruiksbelasting van alcoholvrije dranken][ref14] f. de [Wet belastingen op milieugrondslag][ref15]
      [Besluit bovenwettelijke werkloosheidsregeling voor onderwijspersoneel primair onderwijs][ref16],
      voor zover het betreft besluiten van Onze Minister van Onderwijs, Cultuur en Wetenschap
      __REF016___________________________________________________________________________________________________________
      __________________________________________________________ (Stb. 1984, 364)
      [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref18], voor zover
      het betreft besluiten van Onze Minister van Onderwijs, Cultuur en Wetenschap
      [Besluit ziekte en arbeidsongeschiktheid voor onderwijspersoneel primair onderwijs][ref19],
      voor zover het betreft besluiten van Onze Minister van Onderwijs, Cultuur en Wetenschap
      [Garantiewet Burgerlijk Overheidspersoneel Indonesië][ref20], met inbegrip van een besluit
      op grond van de Algemene oorlogsongevallenregeling [Garantiewet Militairen K.N.I.L.][ref21]
      [Garantiewet Surinaamse pensioenen][ref22] [Kaderwet SZW-subsidies][ref23], voor zover het betreft
      een ministeriële regeling op grond van [artikel 9 ][ref24] [Liquidatiewet Ongevallenwetten][ref25]
      [Mijnbouwwet][ref26]: de [afdelingen 5.1.1][ref27], [5.1.2][ref28], [5.3][ref29], [5.4][ref30] en [5.5][ref31]
      [Participatiewet][ref32], met uitzondering van de [artikelen 52][ref33], [76, eerste en tweede lid][ref34],
      en [81][ref35] en [paragraaf 6.5][ref36] Reglement eenmalige uitkering silicose-vergoeding oud-mijnwerkers,
      vastgesteld bij besluit van het bestuur van de Stichting Silicose Oud-Mijnwerkers van 18 april 1994 de
      reglementen van de Stichting Maror-gelden Overheid, de Stichting Joods Humanitair Fonds, de Stichting
      Rechtsherstel Sinti en Roma en de Stichting Het Gebaar [Samenloopregeling Indonesische pensioenen 1960][ref37]
      [Tijdelijke vergoedingsregeling psychotherapie na-oorlogse generatie][ref38]
      [Tijdelijke wet beperking inkomensgevolgen arbeidsongeschiktheidscriteria][ref39]
      [Tijdelijke wet pilot loondispensatie][ref40] [Toeslagenwet][ref41]
      [Toeslagregeling pensioenen Suriname en Nederlandse Antillen][ref42] [Toeslagwet Indonesische pensioenen 1956][ref43]
      [Uitkeringswet tegemoetkoming twee tot vijfjarige diensttijd veteranen][ref44]
      [Werkloosheidswet][ref45] [Wet arbeid en zorg][ref46]: [hoofdstuk 3, afdeling 2][ref47],
      en [artikel 4:2b][ref48] [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref49]
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref50]
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref51] [Wet buitengewoon pensioen 1940–1945][ref52]
      [Wet buitengewoon pensioen Indisch verzet][ref53] [Wet buitengewoon pensioen zeelieden-oorlogsslachtoffers][ref54]
      [Wet financiering sociale verzekeringen][ref55], voor zover het betreft een besluit van de Sociale
      verzekeringsbank of het Uitvoeringsinstituut werknemersverzekeringen [Wet gemeentelijke schuldhulpverlening][ref56]
      [Wet gevolgen brutering uitkeringsregelingen][ref57] [Wet inburgering][ref58]
