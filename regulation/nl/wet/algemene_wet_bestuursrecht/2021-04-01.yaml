      voor zover het betreft een besluit tot vaststelling, wijziging of uitwerking van het reconstructieplan,
      alsmede een besluit dat is genomen met toepassing van de [artikelen 40 tot en met 43][ref95]
      [Spoedwet wegverbreding][ref96]: a. een plan als bedoeld in [artikel 6, vijfde lid][ref97] b. de
      [artikelen 7, eerste lid][ref98], [9, eerste lid][ref99], en [15, tweede lid, onder c][ref100]
      [Tijdelijke experimentenwet stembiljetten en centrale stemopneming][ref101]: [artikelen 4][ref102]
      [Tijdelijke wet aanwijzing bèta-opleidingen][ref103]: [artikel 2, eerste lid][ref104] [Tracéwet][ref105]: de
      [artikelen 9, eerste lid][ref106], [20, tweede lid][ref107], en [21, tweede lid, onder c][ref108] Verordening (EG)
      nr. 1013/2006 van het Europees Parlement en de Raad van 14 juni 2006 betreffende de overbrenging van afvalstoffen
