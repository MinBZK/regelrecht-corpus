        afdeling: 10.2.2
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '10'
        hoofdstuk: '10'
        afdeling: 10.2.2
  - number: 11:2.1
    text: |-
      Het bedrag van de vergoeding, bedoeld in [artikel 4:113, eerste lid][ref1], en de bedragen,
      vastgesteld in de [artikelen 8:41, tweede lid][ref2], en [8:109, eerste lid][ref3], en krachtens de
      [artikelen 7:15, vierde lid][ref4], [7:28, vijfde lid][ref5], en [8:75, eerste lid][ref6], worden jaarlijks
      met ingang van 1 januari bij regeling van Onze Minister van Veiligheid en Justitie gewijzigd voor zover de
      consumentenprijsindex daartoe aanleiding geeft. Daarbij worden de bedragen rekenkundig afgerond op gehele euro’s.


