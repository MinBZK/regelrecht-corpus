      [artikel 5, eerste en tweede lid][ref21], bedoelde besluiten en handelingen, met dien verstande
      dat de rechtbank Den Haag de beroepen kan behandelen in alle zittingsplaatsen van alle rechtbanken,
      bedoeld in [artikel 21b, eerste en tweede lid, van de Wet op de rechterlijke organisatie][ref22]
