preamble:
  text: |-
    Gelet op artikel 2, onder c, sub 5 en artikel 34 van de Organisatieregeling Ministerie van Veiligheid en Justitie;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0031558/2012-05-19#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Met het oog op de waarheidsvinding in strafzaken heeft het NFI de volgende kerntaken:

      a. het verrichten van onafhankelijk forensisch zaakonderzoek op overwegend technisch, medisch-biologisch en
      natuurwetenschappelijk gebied en het ter zake daarvan uitbrengen van verslag;

      b. het ontwikkelen en implementeren van nieuwe onderzoeksmethoden en technieken ter bevordering van kennis op het
      gebied van forensisch onderzoek;

      c. het zijn van (inter)nationaal kennis- en expertisecentrum op het gebied van het forensisch onderzoek.

      2 Het NFI kan ook producten of diensten leveren indien sprake is van:

      a. een activiteit die in het verlengde ligt van de kerntaken, bedoeld in het eerste lid, en een onlosmakelijke
      samenhang heeft met de waarheidsvinding in strafzaken;

      b. een activiteit die bijdraagt aan de handhaving van de (inter)nationale rechtsorde of veiligheid en waarvan het
      om redenen van kwaliteit, zorgvuldigheid, doelmatigheid, continuïteit of herkenbaarheid wenselijk is dat het NFI
      deze verricht;

      c. ondersteuning bij de hulpverleningstaak van de politie, bedoeld in [artikel 2 van de Politiewet 1993][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel2
    url: https://wetten.overheid.nl/BWBR0031558/2012-05-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '2'
  - number: '2'
    text: |-
      1 Bij de uitvoering van de kerntaken, bedoeld in [artikel 1, eerste lid][ref1], levert het NFI producten of
      diensten aan het openbaar ministerie, de zittende magistratuur, de politie, de bijzondere opsporingsdiensten en het
      ministerie van Veiligheid en Justitie.

      2 Bij de uitvoering van de taak, bedoeld in [artikel 1, tweede lid, onder a][ref2], kan het NFI producten of
      diensten leveren aan Nederlandse en buitenlandse overheidsorganisaties, de advocatuur, artsen en geneeskundigen en
      de brandweer en ambulancedienst.

      3 Bij de uitvoering van de taak, bedoeld in [artikel 1, tweede lid, onder b][ref3], kan het NFI producten of
      diensten leveren aan Nederlandse en buitenlandse overheidsorganisaties en intergouvernementele organisaties.

      4 Bij de uitvoering van de taak, bedoeld in [artikel 1, tweede lid, onder c][ref4], levert het NFI producten of
      diensten aan de politie.


