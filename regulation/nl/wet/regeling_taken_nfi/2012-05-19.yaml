  - number: '3'
    text: |-
      Indien sprake is van een zaak van groot maatschappelijk belang die niet valt binnen de omschrijving van de taken
      in [artikel 1][ref1], maar waarbij de bijzondere deskundigheid van het NFI aanleiding geeft om een beroep te doen
      op het NFI, kan na goedkeuring van de minister van Veiligheid en Justitie worden besloten dat het NFI een dienst of
      product levert.


      [ref1]: https://wetten.overheid.nl/BWBR0031558#Artikel1
    url: https://wetten.overheid.nl/BWBR0031558/2012-05-19#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0031558
        artikel: '1'
  - number: '4'
    text: |-
      1 De minister van Veiligheid en Justitie draagt er zorg voor dat het NFI over middelen beschikt ten behoeve van
      de uitvoering van de kerntaken, bedoeld in [artikel 1, eerste lid][ref1]. Hiertoe worden tussen het NFI en de in
      [artikel 2, eerste lid][ref2], genoemde afnemers afspraken gemaakt over de te leveren producten en diensten en de
      afrekening daarvan.

      2 Voor de levering van producten of diensten die buiten de afspraken, bedoeld in het eerste lid, vallen kan het NFI
      kosten in rekening brengen volgens een door de minister van Veiligheid en Justitie vastgesteld prijsbeleid.

      3 Voor de levering van producten of diensten, bedoeld in [artikel 1, tweede lid][ref3], brengt het NFI de hiermee
      samenhangen kosten in rekening bij de afnemers, bedoeld in [artikel 2, tweede tot en met vierde lid][ref4], volgens
      een door de minister van Veiligheid en Justitie vastgesteld prijsbeleid.


