  - number: '5'
    text: |-
      Indien ten genoegen van de Bank aannemelijk wordt gemaakt dat het niet nakomen van een verplichting zoals opgelegd
      in de [Controlevoorschriften AKW][ref1] niet kan worden verweten aan degene aan wie de verplichting is opgelegd,
      worden de [artikelen 3][ref2] en [4][ref3] niet toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0007872
      [ref2]: https://wetten.overheid.nl/BWBR0007870#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0007870#Artikel4
