  - number: '2'
    text: |-
      1 Dit besluit is van toepassing op:

      a. de persoon die kinderbijslag ontvangt of hiervoor in aanmerking wenst te komen;

      b. de partner van degene die kinderbijslag ontvangt of hiervoor in aanmerking wenst te komen, mits de partner zelf
      recht heeft op kinderbijslag;

      c. de persoon aan wie op grond van [artikel 21 AKW][ref1] kinderbijslag wordt uitbetaald.

      2 Dit besluit is ook van toepassing als de in het eerste lid bedoelde personen of het kind waarvoor kinderbijslag
      is aangevraagd, buiten Nederland wonen.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0007870/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
  - number: '3'
    text: |-
      1 Indien degene op wie dit besluit van toepassing is de verplichting om op verzoek informatie te verstrekken als
      bedoeld in [artikel 15 AKW][ref1], niet binnen de door de Sociale Verzekeringsbank daarvoor vastgestelde termijn is
      nagekomen, of een verplichting, genoemd in de [artikelen 3 tot en met 16 van de Controlevoorschriften AKW][ref2],
      niet of niet behoorlijk is nagekomen, wordt de kinderbijslag tijdelijk gedeeltelijk geweigerd.

      2 De weigering, bedoeld in het eerste lid, vindt plaats door een bedrag, dat met inachtneming van [artikel 4][ref3]
      is vastgesteld, in mindering te brengen op de eerstvolgende termijn of termijnen van de kinderbijslag.

      3 Indien gedurende vijf jaren niet geëffectueerd kan worden, omdat er geen recht bestaat op kinderbijslag of de
      uitbetaling daarvan, vervalt het in mindering te brengen bedrag.

      4 In afwijking van het eerste lid vindt geen weigering plaats maar wordt een schriftelijke waarschuwing
      gegeven indien het niet tijdig nakomen van de verplichting om op verzoek informatie te verstrekken als bedoeld
      in [artikel 15 AKW][ref4], niet heeft geleid tot het ten onrechte of tot een te hoog bedrag verlenen van
      kinderbijslag, tenzij:

      a. door de Bank ter zake van het niet tijdig nakomen van de verplichting reeds een schorsingsbeslissing is genomen;
      of

      b. het niet nakomen van de verplichting plaatsvindt binnen een periode van twee jaar, te rekenen vanaf de datum
      waarop aan de mededelingsplichtige reeds eerder een zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0007872#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0007870#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0002368#Artikel15
