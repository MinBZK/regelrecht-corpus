  - number: '4'
    text: |-
      1 Bij het na een schriftelijk rappel of een schriftelijke waarschuwing niet binnen twee weken, dan wel op een
      door de Bank nader vast te stellen tijdstip, nakomen van een verplichting als bedoeld in de [artikelen 3][ref1]
      en [5 tot en met 16 van de Controlevoorschriften AKW][ref2], wordt een bedrag van € 22,– in mindering gebracht op
      de kinderbijslag.

      2 Bij het niet nakomen van een verplichting als bedoeld in [artikel 4 van de Controlevoorschriften AKW][ref3] wordt
      een bedrag van € 22,– in mindering gebracht op de kinderbijslag.

      3 Indien binnen één kalenderkwartaal twee of meer verplichtingen, genoemd in de
      [artikelen 3 tot en met 16 van de Controlevoorschriften AKW][ref4], niet worden nagekomen, wordt eenmaal het in het
      eerste lid genoemde bedrag op de kinderbijslag in mindering gebracht.

      4 Indien binnen twee jaren na de dag waarop een weigering als gevolg van het niet nakomen van één of meer
      verplichtingen aan de belanghebbende is bekend gemaakt, opnieuw een verplichting niet wordt nagekomen, wordt een
      bedrag van € 34,– in mindering gebracht op de kinderbijslag.


      [ref1]: https://wetten.overheid.nl/BWBR0007872#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007872#Artikel5
