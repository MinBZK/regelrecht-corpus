preamble:
  text: |-
    Gelet op de artikelen 29 en 33 van verordening (EG) nr. 1257/1999 van de Raad van de Europese Unie van 17 mei
    1999 betreffende steun voor plattelandsontwikkeling uit het Europees Oriëntatie- en Garantiefonds voor de Landbouw
    (EOGFL) en tot wijziging en instelling van een aantal verordeningen (PbEG L160);

    Gelet op de beschikking van de Commissie van de Europese Gemeenschappen van 28 september tot goedkeuring van het
    programmeringsdocument voor plattelandsontwikkeling voor Nederland met betrekking tot de programmeringsperiode
    2000-2006 (C (2000) 2751);

    Gelet op de artikelen 29, 32 en 35 van de Wet agrarisch grondverkeer;

    Gelet op de artikelen 2, 4 en 7 van de Kaderwet LNV-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012190/2003-09-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a

              *minister:*


              Minister van Landbouw, Natuurbeheer en Visserij;



            b

              *DLG:*


              dienst Landelijk Gebied van het Ministerie van Landbouw, Natuurbeheer en Visserij;



            c

              *bureau beheer landbouwgronden:*


              bureau bedoeld in [artikel 28 van de Wet agrarisch grondverkeer][ref1];



            d

              *Staatsbosbeheer:*


              organisatie bedoeld in [artikel 2 van de Wet verzelfstandiging Staatsbosbeheer][ref2];



            e

              *land:*


              land bedoeld in [artikel 1 van de Wet agrarisch grondverkeer][ref3];



            f

              *verwerving:*


              verwerving van het recht van eigendom of het recht van erfpacht indien het erfpachtrecht door de bloot
      eigenaar wordt gekocht van de erfpachter;



            g

              *vervreemding:*


              vervreemding van het recht van eigendom of verlenen van het recht van erfpacht;



            h

              *verkoper:*


              iedere natuurlijke of rechtspersoon die land vervreemdt aan bureau beheer landbouwgronden;



            i

              *koper:*


              iedere natuurlijke of rechtspersoon die land verwerft van bureau beheer landbouwgronden;



            j

              *doorlevering:*


              de verwerving van een onroerende zaak van een verkoper en directe vervreemding van die zaak;



            k

              *landinrichtingsproject:*


              project van herinrichting, ruilverkaveling en aanpassingsinrichting, bedoeld in
      [artikel 13 van de Landinrichtingswet][ref4];



            l

              *natuurgebied:*


              natuurgebied bedoeld in artikel 1, eerste lid, van de Subsidieregeling natuurbeheer 2000, zoals het
      krachtens die regeling nader door de provincie is begrensd;



            m

              *randstadgroenstructuurproject:*


              project waarvan het werkgebied is weergegeven op kaart 3 van het Structuurschema Groene Ruimte, deel 4,
      planologische kernbeslissing;



            n

              *strategisch groenproject:*


              project waarvan het werkgebied is aangegeven op kaart 1 van het Structuurschema Groene Ruimte, deel 4,
      planologische kernbeslissing;



            o

              *bufferzone:*


              zone zoals aangegeven op de kaart bufferzones van de Vierde nota over de ruimtelijke ordening Extra, deel
      4, planologische kernbeslissing;



            p

              *uiterwaarden:*


              uiterwaarden bedoeld in de samenwerkingsafspraak 1999-2015 LNV-V&W;



            q

              *landinrichtingsplan:*


              plan bedoeld in [artikel 73 van de Landinrichtingswet][ref5];



            r

              *aanpassingsplan:*


              plan bedoeld in [artikel 102 van de Landinrichtingswet][ref6];



            s

              *herinrichtingsplan:*


              plan bedoeld in
      [artikel 16, eerste lid, van de Herinrichtingswet Oost-Groningen en de Gronings-Drentse Veenkoloniën][ref7];



            t

              *plan van voorzieningen:*


              plan bedoeld in [artikel 40 van de Reconstructiewet Midden-Delfland][ref8];



            u

              *begrenzingenplan:*


              plan bedoeld in [artikel 131 van de Landinrichtingswet][ref9];



            v

              *landschapsplan:*


              plan bedoeld in [artikel 69 van de Reconstructiewet Midden-Delfland][ref10];



            w

              *inventarisatieplan:*


              plan bedoeld in
      [artikel 72 van de Herinrichtingswet Oost-Groningen en de Gronings-Drentse Veenkoloniën][ref11];



            x
            reconstructieplan:

              plan als bedoeld in [artikel 11 van de Reconstructiewet concentratiegebieden][ref12];



            y

              *reservaat:*


              gebied dat als reservaat is aangeduid in een begrenzingenplan, landschapsplan of inventarisatieplan;



            z

              *verordening (EG) nr. 1257/1999:*


              [verordening (EG) nr. 1257/1999](31999R1257) van de Raad van de Europese Unie van 17 mei 1999 betreffende
      steun voor plattelandsontwikkeling uit het Europees Oriëntatie- en Garantiefonds voor de Landbouw (EOGFL) en tot
      wijziging en instelling van een aantal verordeningen (PbEG L160);



            aa

              *cofinanciering:*


              geldmiddelen verstrekt door de Commissie van de Europese Gemeenschappen.


