  - number: '2'
    text: |-
      1 Bureau beheer landbouwgronden handelt volgens het bepaalde in deze regeling, voorzover de doorlevering voor
      cofinanciering in aanmerking komt op grond van [verordening (EG) nr. 1257/1999](31999R1257), bij:

      a. de doorlevering van land aan Staatsbosbeheer of

      b. de verwerving van land voor doorlevering aan derden ten behoeve van de ontwikkeling en instandhouding van
      natuurgebieden of reservaten in de volgende gebieden:

        - landinrichtingsprojecten op grond van het vastgestelde landinrichtingsplan, aanpassingsplan, herinrichtingsplan,
      plan van voorzieningen, begrenzingenplan, landschapsplan, inventarisatieplan of reconstructieplan;
        - strategische groenprojecten;
        - randstadgroenstructuurprojecten;
        - bufferzones;
        - uiterwaarden.

      2 De doorlevering of verwerving met cofinanciering door bureau beheer landbouwgronden behoeft goedkeuring van de
      minister.
    url: https://wetten.overheid.nl/BWBR0012190/2003-09-20#Artikel2
  - number: '3'
    text: |-
      1 Bureau beheer landbouwgronden maakt in de administratie onderscheid tussen kosten die voor cofinanciering in
      aanmerking komen en overige kosten.

      2 De kosten welke voor cofinanciering in aanmerking komen zijn:

      a. het aankoopbedrag;

      b. het kadastraal recht en het registratierecht;

      c. veiling- of notariskosten;

      d. overdrachtsbelasting of schenkingsrecht voorzover geen kwijtschelding of vermindering wordt verleend;

      e. het bedrag ter betaling van een afkoopsom van de landinrichtingsrente voorzover die rust op het doorgeleverde of
      verworven terrein.

      3 Kosten welke niet voor cofinanciering in aanmerking komen zijn:

      a. kosten verbonden aan het compenseren van waardeverlies van land of gebouwen en andere kosten als gevolg van
      kapitaalverliezen of inkomensverliezen;

      b. accountantskosten;

      c. de verrekenbare BTW;

      d. kosten van werkzaamheden die tot de reguliere taken van andere overheden of van andere rechtspersonen behoren;

      e. kosten gemaakt voor de verwerving door betaling van een bedrag aan de verkoper voor het nakomen van
      verplichtingen welke de verkoper heeft op grond van enig wettelijk voorschrift;

      f. kosten van verwerving welke uitgaan boven de normaal gangbare marktprijs voor dat land;

      g. kosten gemaakt voor de verwerving van terreinen, welke door bureau beheer landbouwgronden zijn aangekocht van
      het Rijk.

      4 Kosten welke voor subsidiëring in aanmerking zijn genomen op grond van de Regeling subsidies particuliere
      terreinbeherende natuurbeschermingsorganisaties, komen niet voor een vergoeding met cofinanciering in aanmerking;

      5 Voorzover subsidies, die uit anderen hoofde van overheidswege worden verstrekt, leiden tot een vergoeding van
      meer dan 100% van de kosten van verwerving, worden die subsidies in mindering gebracht op de vergoeding, welke met
      cofinanciering wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0012190/2003-09-20#Artikel3
  - number: '4'
    text: |-
      Bureau beheer landbouwgronden levert grond slechts door indien, in de notariële akte tot doorlevering of
      vervreemding van het desbetreffende land, welke in de openbare registers wordt ingeschreven, de koper en bureau
      beheer landbouwgronden overeenkomen:

      a. dat de koper de verplichting heeft het desbetreffende land niet te gebruiken of te doen gebruiken voor landbouw,
      woningbouw, bedrijventerrein of infrastructurele werken en overigens datgene na te laten wat de ontwikkeling van de
      natuur op het desbetreffende land in gevaar brengt of verstoort;

      b. dat de verplichting, bedoeld onder a, zal overgaan op degenen die het land onder bijzondere titel zullen
      verkrijgen;

      c. dat aan de verplichting, bedoeld onder a, mede gebonden zullen zijn degenen die van de koper of diens
      rechtsopvolgers een recht tot gebruik van het land zullen verkrijgen en

      d. dat het toezicht op de naleving van deze voorwaarden kan worden uitgeoefend door iedere daartoe aangewezen
      medewerker door de Minister van Landbouw, Natuurbeheer en Visserij.
    url: https://wetten.overheid.nl/BWBR0012190/2003-09-20#Artikel4
  - number: '5'
    text: |-
      1 Bureau beheer landbouwgronden draagt zorg voor een overzichtelijke en deugdelijke administratie ten aanzien van
      de activiteiten inzake de uitvoering van de koopovereenkomst en bewaart alle documenten waaronder afschriften van
      de notariële akten en koopcontracten gedurende ten minste 3 jaren na datum van de vervreemding, conform artikel
      4 van [verordening (EEG) nr. 4045/89](31989R4045) van de Raad van 21 december 1989 inzake de door de Lid-Staten
      uit te voeren controles op de verrichtingen in het kader van de financieringsregeling van de afdeling Garantie
      van het Europees Oriëntatie- en Garantiefonds voor de Landbouw en houdende intrekking van [Richtlijn 77/435/EEG]
      (31977L0435) (PbEG L388).

      2 Bureau beheer landbouwgronden komt met de kopers en rechtsopvolgers overeen dat een overzichtelijke en
      deugdelijke administratie ten aanzien van de activiteiten inzake de uitvoering van de koopovereenkomst wordt
      gevoerd en dat alle documenten waaronder afschriften van de notariële akten en koopcontracten worden bewaard
      gedurende ten minste 3 jaren na de datum van de vervreemding, conform artikel 4 van [verordening (EEG) nr.
      4045/89](31989R4045) van de Raad van 21 december 1989 inzake de door de Lid-Staten uit te voeren controles op de
      verrichtingen in het kader van de financieringsregeling van de afdeling Garantie van het Europees Oriëntatie- en
      Garantiefonds voor de Landbouw en houdende intrekking van [Richtlijn 77/435/EEG](31977L0435) (PbEG L388).
    url: https://wetten.overheid.nl/BWBR0012190/2003-09-20#Artikel5
  - number: '6'
    text: |-
      Met het toezicht op de naleving van deze regeling zijn alle daartoe aangewezen medewerkers van de Directie
      Financieel-Economische Zaken van het Ministerie van Landbouw, Natuurbeheer en Visserij belast.
    url: https://wetten.overheid.nl/BWBR0012190/2003-09-20#Artikel6
  - number: '7'
    text: |-
      Bureau beheer landbouwgronden draagt er zorg voor dat een burgerlijke rechtsvordering tot nakoming, ontbinding of
      schadevergoeding wordt ingesteld tegen de koper of diens rechtsopvolgers wanneer de koper of diens rechtsopvolgers
      door ernstige nalatigheid of opzettelijk een onjuiste aanvraag tot subsidieverlening of -vaststelling hebben
      ingediend of ernstig nalatig of opzettelijk anderszins onjuiste gegevens hebben verstrekt op grond van een
      andere regeling gebaseerd op titel II, hoofdstuk IX van de [verordening (EG) nr. 1257/1999](31999R1257) voor het
      betreffende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0012190/2003-09-20#Artikel7
  - number: '8'
    text: |-
      Bureau beheer landbouwgronden vervreemdt geen land, dat verworven is met cofinanciering, aan een koper indien de
      koper of diens rechtsopvolgers door ernstige nalatigheid of opzettelijk een onjuiste aanvraag tot subsidieverlening
      of -vaststelling hebben ingediend of ernstig nalatig of opzettelijk anderszins onjuiste gegevens hebben verstrekt
      op grond van een andere regeling gebaseerd op titel II, hoofdstuk IX van de [verordening (EG) nr. 1257/1999]
      (31999R1257) voor het betreffende kalenderjaar, of indien tegen hem of diens rechtsopvolgers een burgerlijke
      rechtsvordering, als bedoeld in [artikel 7][ref1], is ingesteld voor het betreffende kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0012190#Artikel7
    url: https://wetten.overheid.nl/BWBR0012190/2003-09-20#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0012190
        artikel: '7'
        paragraaf: '6'
  - number: '9'
    text: |-
      Indien de koper of diens rechtsopvolgers opzettelijk een onjuiste aanvraag tot subsidieverlening of
      subsidievaststelling hebben ingediend of opzettelijk anderszins foute gegevens hebben verstrekt op grond van een
      andere regeling gebaseerd op titel II, hoofdstuk IX van de [verordening (EG) nr. 1257/1999](31999R1257) , of indien
      in geval van opzet een burgerlijke rechtsvordering tegen hem of diens rechtsopvolgers is ingesteld, als bedoeld in
      [artikel 7][ref1], vervreemdt bureau beheer landbouwgronden geen land, dat verworven is met cofinanciering, aan een
      koper of diens rechtsopvolgers in het daaropvolgende jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0012190#Artikel7
    url: https://wetten.overheid.nl/BWBR0012190/2003-09-20#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0012190
        artikel: '7'
        paragraaf: '6'
  - number: '10'
    text: |-
      Indien de koper of diens rechtsopvolgers in een jaar opzettelijk onjuiste of foute gegevens hebben verstrekt,
      wordt in het daaropvolgende jaar aan die koper of diens rechtsopvolgers geen land vervreemd door bureau beheer
      landbouwgronden, dat verworven is met cofinanciering.
    url: https://wetten.overheid.nl/BWBR0012190/2003-09-20#Artikel10
  - number: '11'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst en werkt, met uitzondering van [artikel 4][ref1], terug tot 1 januari 2000.

      Deze regeling wordt aangehaald als: Regeling handelwijze bij vervreemding.


      [ref1]: https://wetten.overheid.nl/BWBR0012190#Artikel4
    url: https://wetten.overheid.nl/BWBR0012190/2003-09-20#Artikel11
