preamble:
  text: |-
    Gelet op de artikelen 3 en 5 van de Kaderwet SZW-subsidies en 32d, eerste lid, van de Wet structuur
    uitvoeringsorganisatie werk en inkomen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0037912/2017-07-18#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *baangarantie:* een arbeidsovereenkomst of een aanstelling in openbare dienst van ten minste zes maanden ingaande
      op uiterlijk de eerste werkdag van de kalendermaand na de kalendermaand waarin de scholing is afgerond, met een
      minimale omvang per kalenderweek van het gemiddelde aantal gewerkte uren, indien werkzaamheden bij de werkgever
      hebben plaatsgevonden, en het aantal uren gevolgde scholing in de scholingsperiode voorafgaand aan het afronden van
      die scholing;
        - *ervaringscertificaat:* een overzicht van de door de persoon in de praktijk geleerde en erkende competenties
      zoals zijn kennis, vaardigheden en kwaliteiten;
        - *EVC-procedure:* de procedure Erkenning van Verworven Competenties zijnde een geheel van processtappen
      en gehanteerde instrumenten waarmee de verworven competenties van deelnemers door een erkende aanbieder
      worden beoordeeld, ten opzichte van een specifieke landelijke standaard, resulterend in afgifte van een
      ervaringscertificaat;
        - *IOW-uitkering:* een uitkering op grond van de Wet inkomensvoorziening oudere werklozen;
        - *kansberoep:* een beroep dat is opgenomen in de bijlage bij deze regeling;
        - *minister:* de Minister van Sociale Zaken en Werkgelegenheid;
        - *scholing:* het volgen van een interne of externe opleiding of training, niet zijnde een bedrijfsspecifieke
      training, met als oogmerk de leerling vakspecifieke beroepsvaardigheden aan te leren, die leidt tot een door het
      Ministerie van Onderwijs, Cultuur en Wetenschappen of een door een branche of sector erkend diploma of certificaat;
        - *sector zorg:* de sector die zorgt voor verpleging en verzorging, geestelijke gezondheidszorg, gehandicaptenzorg
      en thuiszorg;
        - *UWV:* het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];
        - *WW-uitkering:* een uitkering op grond van de Werkloosheidswet;
        - *zelfstandige:* de persoon die: a. in Nederland woont en die belastbare winst uit onderneming geniet als bedoeld
      in [paragraaf 3.2.1 van de Wet inkomstenbelasting 2001][ref2], tenzij hij de onderneming niet voor eigen rekening
      feitelijk drijft; b. niet in Nederland woont en die belastbare winst uit Nederlandse onderneming geniet als bedoeld
      in [afdeling 7.2 van de Wet inkomstenbelasting 2001][ref3], tenzij hij de onderneming niet voor eigen rekening
      feitelijk drijft; of c. directeur-grootaandeelhouder is en het werk tot stand brengt uitsluitend voor rekening en
      risico van de onderneming van de rechtspersoon waarvan hij directeur-grootaandeelhouder is.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Paragraaf3.2.1
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Afdeling7.2
