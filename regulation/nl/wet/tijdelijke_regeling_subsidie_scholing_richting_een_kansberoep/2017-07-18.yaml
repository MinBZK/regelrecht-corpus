  - number: '2'
    text: |-
      De minister verstrekt op aanvraag subsidie voor scholing aan de
      persoon die als werkzoekende bij UWV is geregistreerd, bedoeld in
      [artikel 30b, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], en:

      a. arbeid in loondienst verricht, dan wel vanwege het verricht hebben van dergelijke arbeid een IOW- of WW-
      uitkering ontvangt; of

      b. als zelfstandige werkzaamheden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30b
    url: https://wetten.overheid.nl/BWBR0037912/2017-07-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30b
  - number: '3'
    text: |-
      1 Voor subsidie kan de persoon, bedoeld in [artikel 2][ref1], uitsluitend in aanmerking komen indien de scholing is
      gericht op een kansberoep.

      2 Voor subsidie kan de persoon, bedoeld in [artikel 2][ref2], in aanmerking komen, die via een EVC-procedure zijn
      competenties en ervaring in een ervaringscertificaat laat vastleggen.

      3 Voor subsidie als bedoeld in het eerste en tweede lid, komt in aanmerking de scholing die gestart is op of na de
      datum van inwerkingtreding van deze regeling, doch niet later dan 1 april 2018.


      [ref1]: https://wetten.overheid.nl/BWBR0037912#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037912#Artikel2
    url: https://wetten.overheid.nl/BWBR0037912/2017-07-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0037912
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0037912
        artikel: '2'
  - number: '4'
    text: |-
      1 De subsidie voor scholing bedraagt 100% van de werkelijke kosten van de scholing, tot een maximum van € 2.500,–,
      inclusief BTW, per rechthebbende.

      2 De scholing kan bestaan uit meerdere met elkaar samenhangende opleidingen of cursussen.

      3 In afwijking van het eerste lid kan de minister 100% van de werkelijke kosten van een scholing die duurder is dan
      € 2.500,–, inclusief BTW, subsidiëren, indien een nieuwe werkgever baangarantie aanbiedt.

      4 In afwijking van het eerste en derde lid wordt de BTW niet gesubsidieerd, indien het subsidie voor scholing van
      een zelfstandige betreft.
    url: https://wetten.overheid.nl/BWBR0037912/2017-07-18#Artikel4
  - number: '5'
    text: |-
      1 De subsidieaanvraag wordt uiterlijk twee weken na aanvang van die scholing, bij UWV ingediend, met gebruikmaking
      van een door UWV beschikbaar gesteld aanvraagformulier. De aanvraag is volledig als het aanvraagformulier volledig
      is ingevuld en is ondertekend door de aanvrager en alle gevraagde bijlagen zijn bijgevoegd.

      2 Bij de aanvraag worden in ieder geval de volgende documenten overgelegd:

      a. een bewijs waaruit blijkt dat de opleidings- of inschrijvingskosten zijn betaald, dan wel een bewijs waaruit
      blijkt dat deze kosten zijn verschuldigd;

      b. een bewijs waaruit blijkt dat de opleidingsinstelling de leerling heeft toegelaten; en

      c. een bewijs van de baangarantie van de nieuwe werkgever, indien [artikel 4, derde lid][ref1], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0037912#Artikel4
    url: https://wetten.overheid.nl/BWBR0037912/2017-07-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0037912
        artikel: '4'
  - number: '6'
    text: |-
      1 De subsidie voor scholing wordt geweigerd, indien:

      a. de volledige aanvraag is ontvangen na de termijn, bedoeld in [artikel 5, eerste lid][ref1];

      b. ten behoeve van dezelfde rechthebbende subsidie voor scholing, op grond van deze regeling, reeds is verleend;

      c. de kosten van scholing waarvoor de subsidie wordt aangevraagd reeds geheel of gedeeltelijk uit andere publieke
      middelen worden gefinancierd; of

      d. ten behoeve van dezelfde rechthebbende subsidie op grond van de
      [Regeling cofinanciering sectorplannen 2015][ref2] is toegekend.

      2 Het eerste lid, onderdeel a, is niet van toepassing op de aanvrager wiens onvolledige aanvraag
      voor de aanvang van de scholing van de rechthebbende is ontvangen en die door UWV op grond van
      [artikel 4:5 van de Algemene wet bestuursrecht][ref3] in de gelegenheid is gesteld om zijn aanvraag aan te vullen.


      [ref1]: https://wetten.overheid.nl/BWBR0037912#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0035840
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0037912/2017-07-18#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0037912
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0035840
      - id: ref3
        bwb_id: BWBR0005537
        artikel: 4:5
  - number: '7'
    text: De minister beslist binnen acht weken na ontvangst van de volledige aanvraag op die aanvraag.
    url: https://wetten.overheid.nl/BWBR0037912/2017-07-18#Artikel7
  - number: '8'
    text: |-
      Binnen 30 kalenderdagen na het afgeven van de beschikking, bedoeld in [artikel 7][ref1], betaalt de minister de
      subsidie aan de subsidieaanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0037912#Artikel7
    url: https://wetten.overheid.nl/BWBR0037912/2017-07-18#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0037912
        artikel: '7'
  - number: '9'
    text: |-
      1 De subsidieaanvraag wordt ingediend in de periode vanaf de datum van inwerkingtreding van deze regeling tot en
      met 31 december 2017.

      2 Een subsidieaanvraag die is ingediend na afloop van de periode, bedoeld in het eerste lid, wordt niet in
      behandeling genomen.

      3 De subsidie wordt toegekend aan de subsidieaanvrager.
    url: https://wetten.overheid.nl/BWBR0037912/2017-07-18#Artikel9
  - number: '10'
    text: |-
      1 De subsidieaanvrager aan wie subsidie is toegekend doet onverwijld een melding aan UWV zodra aannemelijk is dat
      de scholing niet of niet geheel zal plaatsvinden, of dat niet aan de overige verplichtingen zal worden voldaan.

      2 De subsidieaanvrager aan wie subsidie is toegekend is verplicht desgevraagd alle medewerking te verlenen aan
      een steekproef.
    url: https://wetten.overheid.nl/BWBR0037912/2017-07-18#Artikel10
  - number: '11'
    text: |-
      1 Voor rechthebbenden die werkzaam zijn of waren in de sector zorg bedraagt het subsidieplafond voor de periode
      vanaf de datum van inwerkingtreding van deze regeling tot en met 31 december 2017 € 9.000.000,–.

      2 Voor de overige rechthebbenden bedraagt het subsidieplafond voor de periode vanaf de datum van inwerkingtreding
      van deze regeling tot en met 31 december 2017 € 36.000.000,–.

      3 Indien het subsidieplafond, bedoeld in het eerste lid, is bereikt, kunnen rechthebbenden die werkzaam zijn of
      waren in de zorg tevens beroep doen op het subsidieplafond, bedoeld in het tweede lid, tenzij dit subsidieplafond
      ook is bereikt.
    url: https://wetten.overheid.nl/BWBR0037912/2017-07-18#Artikel11
  - number: '12'
    text: |-
      1 Voor het bepalen van het bereiken van het subsidieplafond worden de subsidieaanvragen op volgorde van
      binnenkomst behandeld, waarbij alleen volledige subsidieaanvragen in behandeling worden genomen. Van een volledige
      subsidieaanvraag is sprake indien wordt voldaan aan [artikel 5][ref1].

      2 Wanneer de subsidieaanvrager op grond van [artikel 4:5 van de Algemene wet bestuursrecht][ref2] de gelegenheid
      heeft gehad zijn aanvraag aan te vullen, geldt als datum van binnenkomst de datum van ontvangst van de volledige
      aanvraag.

      3 Indien subsidievaststelling op grond van de subsidieaanvragen die op dezelfde datum zijn binnengekomen leidt
      tot overschrijding van het van toepassing zijnde subsidieplafond, wordt, indien de volgorde van binnenkomst van
      die aanvragen niet kan worden vastgesteld, in afwijking van het eerste lid, met betrekking tot die aanvragen de
      volgorde door loting vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0037912#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0037912/2017-07-18#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0037912
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:5
  - number: '13'
    text: |-
      De verleende subsidie wordt geheel of gedeeltelijk teruggevorderd indien deze ten onrechte of voor een te hoog
      bedrag is verstrekt of indien niet aan de verplichtingen, bedoeld in [artikel 10][ref1], is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0037912#Artikel10
    url: https://wetten.overheid.nl/BWBR0037912/2017-07-18#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0037912
        artikel: '10'
  - number: '14'
    text: |-
      Op subsidies verleend op grond van deze regeling is de [Kaderregeling subsidies OCW, SZW en VWS][ref1] niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037603
    url: https://wetten.overheid.nl/BWBR0037912/2017-07-18#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0037603
  - number: '15'
    text: |-
      1 De minister verleent aan UWV het volgende mandaat:

      a. UWV is bevoegd om in het kader van de uitvoering van deze regeling namens de minister besluiten te nemen,
      privaatrechtelijke rechtshandelingen te verrichten en handelingen te verrichten die een privaatrechtelijke
      rechtshandeling noch een besluit zijn;

      b. UWV is bevoegd om in het kader van de uitvoering van deze regeling namens de minister te beslissen op
      bezwaarschriften, met dien verstande dat degene die betrokken is bij het besluitvormingsproces ten aanzien van het
      bezwaarschrift niet ook betrokken is geweest bij het besluitvormingsproces in eerste aanleg; en

      c. UWV is bevoegd om in het kader van de uitvoering van deze regeling namens de minister in rechte op te treden
      en tegen rechterlijke uitspraken hoger beroep of cassatie in te stellen, dan wel af te zien van hoger beroep of
      cassatie.

      2 UWV is bevoegd in het kader van de uitvoering van deze regeling tot het verlenen van ondermandaat of het
      doorverlenen van zijn andere vertegenwoordigingsbevoegdheden aan bij UWV werkzame functionarissen.

      3 [Hoofdstuk 4 van het Organisatie-, mandaat- en volmachtbesluit SZW 2009][ref1] is van toepassing op de
      uitoefening van bevoegdheden op grond van deze regeling en tevens op de uitoefening van bevoegdheden die krachtens
      ondermandaat respectievelijk doorverlening van volmacht en machtiging worden uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0024956#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0037912/2017-07-18#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0024956
        hoofdstuk: '4'
  - number: '16'
    text: |-
      UWV brengt aan de minister inhoudelijk en financieel verslag uit over de uitvoering van de regeling overeenkomstig
      [artikel 49 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel49
    url: https://wetten.overheid.nl/BWBR0037912/2017-07-18#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '49'
  - number: '17'
    text: |-
      1 Het Rijk voorziet in de middelen tot dekking van de uitgaven verbonden aan deze regeling.

      2 UWV beheert en administreert afzonderlijk de middelen, bedoeld in het eerste lid.

      3 In verband met het middelenbeheer wordt de rijksbijdrage, bedoeld in het eerste lid, beschouwd als middelen die
      deel uitmaken van het Algemeen Werkloosheidsfonds.
    url: https://wetten.overheid.nl/BWBR0037912/2017-07-18#Artikel17
  - number: '18'
    text: |-
      1 Voor 1 oktober van elk jaar verstrekt UWV aan de minister een opgave van het totaalbedrag aan de voor het komende
      jaar geraamde lasten met betrekking tot deze regeling.

      2 In afwijking van het eerste lid wordt de opgave van het totaalbedrag van de geraamde lasten voor het jaar 2016
      ingediend voor 1 juli 2016.

      3 De minister stort op de rekening-courant, bedoeld in [artikel 5.16, onderdeel b, van de Regeling Wfsv][ref1],
      een periodiek voorschot op het bedrag, bedoeld in het eerste lid, van de geraamde lasten met als valutadatum de
      tweeëntwintigste dag van elke maand.

      4 De minister kan, na overleg met UWV, afwijken van de in het eerste en het tweede lid bedoelde bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0019150#Artikel5.16
    url: https://wetten.overheid.nl/BWBR0037912/2017-07-18#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0019150
        artikel: '5.16'
  - number: '19'
    text: |-
      1 In de jaarrekening, bedoeld in [artikel 49 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1],
      worden de lasten alsmede de ontvangen voorschotten, met betrekking tot deze regeling opgenomen.

      2 Na goedkeuring van het besluit tot vaststelling van de jaarrekening, bedoeld in
      [artikel 34, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref2], rekent de minister de lasten
      alsmede de ontvangen voorschotten, met betrekking tot deze regeling en het desbetreffende kalenderjaar af, met als
      valutadatum 1 juni van het hierop volgende kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel34
    url: https://wetten.overheid.nl/BWBR0037912/2017-07-18#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '49'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '34'
  - number: '20'
    text: |-
      1 De minister draagt zorg voor de evaluatie van deze regeling.

      2 UWV verstrekt twee keer per jaar een rapport over de voortgang van de regeling.

      3 De minister en UWV maken afspraken over het verstrekken van de benodigde gegevens.
    url: https://wetten.overheid.nl/BWBR0037912/2017-07-18#Artikel20
  - number: 20a
    text: |-
      1 De subsidie, bedoeld in [artikel 3][ref1], voor de scholing richting een kansberoep dat is opgenomen in de
      bijlage, bedoeld in artikel 1, zoals deze bijlage luidde op 17 juli 2017, kan tot en met 31 juli 2017 worden
      aangevraagd.

      2 Op een aanvraag die wordt ingediend na aanvang van de scholing, is de bijlage, bedoeld in artikel 1, zoals deze
      luidde op de startdatum van de scholing van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037912#Artikel3
    url: https://wetten.overheid.nl/BWBR0037912/2017-07-18#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0037912
        artikel: '3'
  - number: '21'
    text: |-
      1 Deze regeling treedt in werking met ingang van 1 mei 2016 en vervalt met ingang van 1 januari 2018.

      2 In afwijking van het eerste lid blijft deze regeling, zoals die luidde op 31 december 2017, van toepassing op de
      afwikkeling van de subsidieaanvragen op grond van deze regeling.
    url: https://wetten.overheid.nl/BWBR0037912/2017-07-18#Artikel21
  - number: '22'
    text: 'Deze regeling wordt aangehaald als: Tijdelijke regeling subsidie scholing richting een kansberoep.'
    url: https://wetten.overheid.nl/BWBR0037912/2017-07-18#Artikel22
