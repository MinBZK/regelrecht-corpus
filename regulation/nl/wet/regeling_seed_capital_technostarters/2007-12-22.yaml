    text: |-
      In 2005 worden slechts geldleningen op grond van deze regeling verstrekt indien de Europese Commissie de minister
      heeft bericht dat deze regeling verenigbaar is met de regels van de Europese Gemeenschappen ten aanzien van
      staatssteun.
