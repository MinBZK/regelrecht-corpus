preamble:
  text: |-
    Gelet op artikel 3 van de Kaderwet EZ-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0018146/2007-12-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. minister: de Minister van Economische Zaken;

      b. groep: een economische eenheid, waarin organisatorisch zijn verbonden:

      1°. een natuurlijke persoon of rechtspersoon, die direct of indirect:

        - meer dan de helft van het geplaatste kapitaal verschaft aan,
        - volledig aansprakelijk vennoot is van of
        - overwegende zeggenschap heeft over een of meer rechtspersonen of vennootschappen, en

      2°. laatstbedoelde rechtspersonen of vennootschappen;

      c. kapitaalvennootschap:

      1°. een vennootschap als bedoeld in artikel 1 van de Eerste [Richtlijn 68/151/EEG](31968L0151) van de Raad van
      9 maart 1968 strekkende tot het coördineren van de waarborgen, welke in de Lid-Staten worden verlangd van de
      vennootschappen in de zin van de tweede alinea van artikel 58 van het Verdrag, om de belangen te beschermen zowel
      van de deelnemers in deze vennootschappen als van derden, zulks ten einde die waarborgen gelijkwaardig te maken (PB
      EG L 65), of

      2°. een kapitaalvennootschap die is ingericht naar het recht van één van de lidstaten van de Europese Unie, die
      rechtspersoonlijkheid bezit, een apart vermogen heeft dat bij uitsluiting voor de schulden van de vennootschap
      kan worden aangesproken en op grond van haar nationale wetgeving onderworpen is aan garantievoorwaarden zoals
      bedoeld in [Richtlijn 68/151/EEG](31968L0151) van de Raad om de belangen van zowel deelgerechtigden als derden
      te beschermen.

      d. technostarter: een rechtspersoon die een onderneming drijft:

      1°. die voor eigen rekening en risico producten, processen of diensten – niet zijnde adviezen – verkoopt en levert,
      die zijn gebaseerd op een nieuwe technische vinding of een nieuwe toepassing van bestaande technologie;

      2°. die ten hoogste vijf jaar geleden is ingeschreven in het handelsregister van een Kamer van Koophandel en
      Fabrieken;

      3°. die ten tijde van de eerste verstrekking van risicodragend kapitaal op grond van deze regeling voldoet aan
      de definitie van middelgrote, kleine en micro-ondernemingen, opgenomen in de bijlage bij [Verordening (EG) nr.
      364/2004](32004R0364) van de Commissie van 25 februari 2004 tot wijziging van [Verordening (EG) nr. 70/2001]
      (32001R0070) van de Commissie van 12 januari 2001 betreffende de toepassing van de artikelen 87 en 88 van het EG-
      verdrag op staatssteun voor kleine en middelgrote ondernemingen (PbEG L 10);

      e. technostartervennootschap: een technostarter die

      1°. een onderneming drijft in de vorm van een kapitaalvennootschap, en

      2°. zijn primaire bedrijfsactiviteiten in Nederland uitvoert,

      behoudens voor zover de onderneming behoort tot de economische sectoren van landbouw, visserij, aquacultuur of
      scheepsbouw of tot de EGKS-sectoren;

      f. startersfonds: een vennootschap

      1°. in de vorm van een kapitaalvennootschap of een vennootschap met een afgescheiden vermogen, ingericht naar het
      recht van één van de andere lidstaten van de Europese Unie;

      2°. die blijkens de akte waarbij haar statuten zijn vastgesteld of blijkens de overeenkomst waarbij zij is
      aangegaan uitsluitend tot doel heeft het verstrekken van risicodragend kapitaal aan technos⁠tartervennootschappen
      teneinde winst te behalen; en

      3°. waarin ten minste drie aandeelhouders of hoofdelijk aansprakelijke vennoten deelnemen respectievelijk
      samenwerken zonder dat twee of drie van hen tot dezelfde groep behoren en zonder dat één van hen een
      meerderheidsbelang in het fonds heeft;

      g. achtergestelde vordering: een vordering van een startersfonds ten laste van een technostartervennootschap

      1°. die het startersfonds heeft verkregen door aan de technostartervennootschap geld ter leen te verstrekken,

      2°. die niet door enige vorm van zekerheid is gedekt, en

      3°. waarop de debiteur krachtens een daartoe strekkende bepaling in de akte van geldlening in geval van ontbinding,
      een akkoord na verlening van surséance van betaling of een akkoord in faillissement van de debiteur, eerst
      verplicht is rente en aflossing te betalen nadat alle andere op dat moment bestaande schulden van de debiteur zijn
      voldaan, met uitzondering van de schulden die voortvloeien uit leningen waaraan een bepaling van gelijke aard als
      voornoemde bepaling is verbonden,

      4°. terwijl ingevolge de vorenbedoelde akte van geldlening de crediteur afstand heeft gedaan van alle rechten tot
      verrekening van de rente en aflossing;

      h. participatie: risicodragend kapitaal in de vorm van

      1°. aandelen in het kapitaal van een technostartervennootschap die het startersfonds rechtstreeks van de
      technostartervennootschap heeft verkregen tegen volstorting van die aandelen in geld, of door omzetting van een
      achtergestelde vordering; of

      2°. aandelen in het kapitaal van een technostartervennootschap als bedoeld onder 1° in combinatie met een
      achtergestelde vordering;

      i. verkrijgingsprijs van een participatie: het bedrag in geld waarvoor het startersfonds de participatie heeft
      verkregen;

      j. fondsplan: een plan van een startersfonds tot uitvoering van een met elkaar samenhangend geheel van activiteiten
      die bestaan uit het verkrijgen, beheren en beëindigen van participaties en het begeleiden van de desbetreffende
      technostartervennootschappen;

      k. investeringsperiode: de periode gedurende welke een startersfonds activiteiten verricht ter verkrijging van
      participaties;

      l. investeringsbudget: de financiële middelen die een startersfonds beschikbaar heeft of zal hebben en die bestemd
      zijn om de verkrijgingsprijs van participaties te voldoen;

      m. inkomsten: alle op geld waardeerbare voordelen die een startersfonds heeft uit een participatie, waaronder
      dividend, rente, aflossingen, opties, de prijs waartegen de participatie is vervreemd, de prijs waartegen de
      participatie door de technostartervennootschap is ingekocht of terugbetaald en de liquidatie-uitkering;

      n. beheerskosten: alle kosten die een startersfonds maakt voor het verkrijgen, behouden en beëindigen van
      participaties, met inbegrip van de kosten van begeleiding van technostartervennootschappen, uitgezonderd de
      verkrijgingsprijs van de participaties;

      o. referentierente: de referentierentevoet, bedoeld in de Mededeling van de Commissie over de methode waarmee de
      referentie- en disconteringspercentages worden vastgesteld (PbEG 1997, C 273), zoals laatstelijk vastgesteld voor
      Nederland, en vermeerderd met 4%.
    url: https://wetten.overheid.nl/BWBR0018146/2007-12-22#Artikel1
  - number: '2'
    text: |-
      1 De minister verleent op aanvraag een subsidie in de vorm van een geldlening aan een startersfonds voor het
      uitvoeren van een fondsplan dat is gebaseerd op de uitgangspunten dat:

      a. het startersfonds participaties verkrijgt gedurende een investeringsperiode van ten hoogste zes jaar, en deze
      uiterlijk zes jaar na afloop van de investeringsperiode vervreemdt;

      b. de totale verkrijgingsprijs van de participaties die gedurende de investeringsperiode in één
      technostartervennootschap worden verkregen, ten minste € 100.000,– en ten hoogste € 2.500.000,– bedraagt;

      c. de gemiddelde totale verkrijgingsprijs van de participaties die een startersfonds gedurende de
      investeringsperiode per technostartervennootschap verkrijgt, over alle technostartervennootschappen genomen ten
      hoogste € 800.000,– bedraagt;

      d. de middelen die door een startersfonds per half jaar aan een technostartervennootschap worden verstrekt ten
      hoogste € 500.000,– bedragen;

      e. de beheerskosten jaarlijks ten hoogste 5% bedragen van het investeringsbudget;

      f. de fondsbeheerder voor zijn werkzaamheden een beloning verkrijgt die afhankelijk is van zijn individuele
      prestatie;

      g. de relatieve omvang van achtergestelde vorderingen zodanig wordt beperkt dat ten hoogste 35% van het totaal van
      de verkrijgingsprijzen van de participaties betrekking heeft op achtergestelde vorderingen;

      h. voor achtergestelde vorderingen een rente wordt bedongen die ten minste gelijk is aan de referentierente;

      i. de participaties verkregen worden in technostartervennootschappen waarvan de rentabiliteits- en
      continuïteitsperspectieven ten minste redelijk zijn;

      j. bij de beslissing van het startersfonds inzake de verkrijging van een participatie rekening wordt gehouden met
      het ondernemingsplan van de desbetreffende technostartervennootschap;

      k. de participaties verkregen worden in technostartervennootschappen waarin niet eerder een participatie is
      verkregen door een investeringsfonds, niet zijnde een startersfonds, behoudens indien de eerdere participatie
      is verkregen door een investeringsfonds dat uitsluitend het verstrekken van risicodragend kapitaal aan
      technostartervennootschappen tot doel heeft en dat naar het oordeel van de minister niet in staat is nieuwe
      participaties in de technostartervennootschap te verkrijgen.

      2 De verstrekking van de geldlening vindt plaats onder de voorwaarde dat binnen twee weken na de beschikking tot
      verstrekking van de geldlening een overeenkomst tot geldlening wordt gesloten tussen de Staat en het startersfonds.

      3 De Staat doet een aanbod een overeenkomst tot geldlening te sluiten, die is opgesteld overeenkomstig het model
      dat is opgenomen in de bij deze regeling behorende [bijlage 1][ref1].

      4 In de overeenkomst tot geldlening wordt onder meer bepaald dat:

      a. de geldlening een bedrag betreft dat ten hoogste door het startersfonds kan worden opgenomen;

      b. ingevolge de geldlening het startersfonds bedragen in contanten kan opnemen, telkens indien het startersfonds
      een participatie verkrijgt, voor zover het totaal van de verstrekte middelen niet hoger is dan het maximale bedrag
      van de geldlening;

      c. het startersfonds een deel van de inkomsten uit participaties overboekt aan de minister;

      d. het startersfonds geen andere activiteiten verricht dan de uitvoering van het fondsplan.

      5 De minister kan in aanvulling op het model in het aanbod voor de overeenkomst tot geldlening bepalingen opnemen
      die strekken tot verwezenlijking van het doel van de subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0018146
    url: https://wetten.overheid.nl/BWBR0018146/2007-12-22#Artikel2
    references:
