  - number: '6'
    text: |-
      1 Aanvragen om verstrekking van een geldlening op grond van deze regeling worden in 2005 gedaan op een zodanig
      tijdstip dat zij worden ontvangen in de periode van 1 april tot en met 30 juni.

      2 Aanvragen om verstrekking van een geldlening op grond van deze regeling worden in de jaren vanaf 2005 gedaan op
      een zodanig tijdstip dat zij worden ontvangen in de periode van 1 januari tot en met 31 maart, of in een andere
      periode indien deze bij ministeriële regeling is vastgesteld.

      3 Een aanvraag om verstrekking van een geldlening wordt ingediend met gebruikmaking van een formulier, dat is
      opgenomen in de bij deze regeling behorende [bijlage 2][ref1].

      4 De aanvraag gaat vergezeld van een fondsplan en een begroting voor het fondsplan alsmede van andere bescheiden,
      overeenkomstig hetgeen in het formulier is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0018146
