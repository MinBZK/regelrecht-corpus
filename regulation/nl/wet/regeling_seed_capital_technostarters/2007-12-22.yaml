  - number: '3'
    text: |-
      1 De geldsom die op grond van de in [artikel 2, tweede lid][ref1] bedoelde overeenkomst tot geldlening ten hoogste
      kan worden geleend, bedraagt 50 procent van het investeringsbudget, maar niet meer dan een plafond-bedrag dat bij
      ministeriële regeling wordt vastgesteld.

      2 Het in het eerste lid bedoelde plafond-bedrag bedraagt € 4.000.000,– voor het in 2005 verstrekken van een
      geldlening op grond van deze regeling.

      3 Indien een ander bestuursorgaan of de Commissie van de Europese Gemeenschappen een financiële bijdrage aan het
      investeringsbudget van het startersfonds heeft verstrekt, wordt op grond van deze regeling slechts een zodanige
      geldlening verstrekt, dat het totaal van de geldlening en de andere financiële bijdragen niet meer bedraagt dan het
      in het eerste lid bedoelde percentage.


      [ref1]: https://wetten.overheid.nl/BWBR0018146#Artikel2
