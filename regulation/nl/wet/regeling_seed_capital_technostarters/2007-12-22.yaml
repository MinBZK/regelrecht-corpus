  - number: '8'
    text: |-
      1 De minister wint omtrent de aanvragen het advies in van de Adviescommissie seed capital technostarters.

      2 De minister beslist afwijzend op een aanvraag indien hij, daarbij geadviseerd door de commissie, van oordeel
      is dat:

      a. de aanvraag niet voldoet aan deze regeling;

      b. onvoldoende aannemelijk is dat het startersfonds gedurende de investeringsperiode daadwerkelijk zal beschikken
      over de middelen die het fonds aan het investeringsbudget bijdraagt;

      c. onvoldoende vertrouwen bestaat dat het startersfonds bij het verkrijgen, beheren en beëindigen van participaties
      het ontstaan van belangenverstrengeling zal voorkomen;

      d. onvoldoende vertrouwen bestaat dat de betrokkenen de capaciteiten hebben voor het verkrijgen van participaties
      en voor het beheer van het startersfonds op een wijze zoals bij participatiefondsen gebruikelijk is;

      e. het fondsplan onvoldoende is onderbouwd;

      f. onvoldoende vertrouwen bestaat dat het fondsplan naar behoren wordt uitgevoerd.

      3 De minister rangschikt, daarbij geadviseerd door de commissie, de aanvragen waarop hij niet afwijzend beschikt
      zodanig, dat een aanvraag hoger gerangschikt wordt naar mate:

      a. de aanvrager meer kan steunen op relevante ervaring en deskundigheid;

      b. het fondsplan meer bijdraagt aan de opbouw van succesvolle ondernemingen door technostartervennootschappen;

      c. het fondsplan doelmatiger is ingericht.

      4 De minister verdeelt het beschikbare bedrag in de volgorde van de rangschikking.

      5 Indien een aanvraag is gedaan om verstrekking van een geldlening voor een bedrag dat hoger is dan het in
      [artikel 3, eerste en tweede lid][ref1], bedoelde plafond-bedrag en indien die aanvraag voor het overige kan worden
      toegewezen, kan de minister in afwijking van het bepaalde in [artikel 3, eerste onderscheidenlijk tweede lid][ref2]
      het maximale bedrag van de geldlening bepalen op een hoger bedrag dan het plafond-bedrag indien het op grond van
      [artikel 5][ref3] beschikbare bedrag daarvoor toereikend is.

      6 Bij de toepassing van het vijfde lid wordt voorrang gegeven aan aanvragen die hoger in de rangschikking zijn
      geplaatst.

      7 Voor de rangschikking wegen de in het derde lid genoemde criteria even zwaar.


