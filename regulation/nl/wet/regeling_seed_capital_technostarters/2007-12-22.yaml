  - number: '7'
    text: |-
      Binnen dertien weken na de laatste dag van de bij [artikel 6, eerste lid][ref1], vastgestelde periode, geeft de
      minister een beschikking omtrent in die periode ontvangen aanvragen om verstrekking van een geldlening.


      [ref1]: https://wetten.overheid.nl/BWBR0018146#Artikel6
