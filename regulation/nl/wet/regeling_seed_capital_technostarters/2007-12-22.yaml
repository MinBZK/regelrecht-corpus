  - number: '4'
    text: |-
      1 Er is een Adviescommissie seed capital technostarters die tot taak heeft de minister op zijn verzoek te adviseren
      omtrent aanvragen om verstrekking van een geldlening op grond van deze regeling.

      2 De adviezen van de commissie gaan vergezeld van een deugdelijke motivering.

      3 De commissie bestaat uit een voorzitter en ten minste vier en ten hoogste zes andere leden. De leden beschikken
      tezamen over deskundigheid op het terrein van de verstrekking van risico-kapitaal aan beginnende ondernemingen en
      de beoordeling van ondernemingsplannen. De leden zijn geen ambtenaren, werkzaam bij de rijksoverheid.

      4 De voorzitter en de andere leden worden door de minister voor een termijn van ten hoogste drie jaar benoemd. Zij
      zijn opnieuw benoembaar voor een termijn van ten hoogste drie jaar.

      5 De commissie stelt haar eigen werkwijze schriftelijk vast.

      6 Een lid van de commissie neemt niet deel aan de voorbereiding en vaststelling van een advies, indien hij een
      persoonlijk belang heeft bij de beschikking op de aanvraag.

      7 De minister kan waarnemers aanwijzen, die het recht hebben de vergaderingen van de commissie bij te wonen.

      8 In het secretariaat van de commissie wordt door de minister voorzien.

      9 Het beheer van de bescheiden betreffende de werkzaamheden van de commissie geschiedt op overeenkomstige wijze als
      bij het Ministerie van Economische Zaken. De bescheiden worden na beëindiging van de werkzaamheden van de commissie
      bewaard in het archief van dat ministerie.

      10 De commissie verstrekt desgevraagd aan de minister de voor de uitoefening van zijn taak benodigde inlichtingen.
      De minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van zijn
      taak redelijkerwijs nodig is.

      11 De commissie stelt jaarlijks voor 1 april een verslag op van haar werkzaamheden in het afgelopen kalenderjaar.
      Op verzoek van de minister stelt de commissie tevens een evaluatieverslag op, waarin zij aandacht besteedt aan de
      doelmatigheid en doeltreffendheid van haar taakvervulling. Het jaarverslag en het evaluatieverslag worden aan de
      minister toegezonden en algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0018146/2007-12-22#Artikel4
  - number: '5'
    text: |-
      1 Het subsidieplafond voor het in 2005 verstrekken van geldleningen op aanvragen op grond van deze regeling,
      bedraagt € 20.600.000,–.

      2 Bij ministeriële regeling wordt een plafond vastgesteld voor het verstrekken van geldleningen op aanvragen op
      grond van deze regeling die na 2005 zijn ontvangen in een periode als bedoeld in [artikel 6, tweede lid][ref1].
      Daarbij kunnen afzonderlijke subsidieplafonds worden vastgesteld voor aanvragen die betrekking hebben op
      participaties in bepaalde categorieën technostarters of voor aanvragen die worden gedaan in een bepaalde periode,
      bedoeld in [artikel 6, tweede lid][ref2].

      3 Indien het plafond met betrekking tot enig kalenderjaar nog niet is vastgesteld op 1 januari van dat jaar,
      bedraagt het plafond met betrekking tot de aanvraagperiode in dat jaar € 11.600.000,–.


      [ref1]: https://wetten.overheid.nl/BWBR0018146#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0018146#Artikel6
