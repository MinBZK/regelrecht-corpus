articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel1
  - number: 1.a
    text: '*ministerie:* Ministerie van Justitie en Veiligheid;'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel1
  - number: 1.b
    text: |-
      *bewindspersoon:* de Minister van Justitie en Veiligheid, de Minister voor Rechtsbescherming of de Staatssecretaris
      van Justitie en Veiligheid, afhankelijk van wie het aangaat;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel1
  - number: 1.c
    text: |-
      *departementsleiding:* de bewindspersonen alsmede de secretaris-generaal, de plaatsvervangend secretaris-generaal,
      de hoofddirecteur bedrijfsvoering, de directeuren-generaal, de Nationaal Coördinator Terrorismebestrijding en
      Veiligheid en de inspecteur-generaal van de Inspectie Justitie en Veiligheid gezamenlijk;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel1
  - number: 1.d
    text: |-
      *bestuursdepartement:* de departementsleiding alsmede de beleids-, staf- en bedrijfsvoeringonderdelen ter
      ondersteuning van de departementsleiding;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel1
  - number: 1.e
    text: |-
      *bestuursraad:* de bestuursraad, bedoeld in [artikel 3, zevende lid][ref1].


