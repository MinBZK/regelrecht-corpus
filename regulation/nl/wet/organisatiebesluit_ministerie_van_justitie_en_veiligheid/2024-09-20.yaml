  - number: '3.6'
    text: |-
      Eén van de tot het directoraat-generaal behorende directeuren wordt op voordracht van de desbetreffende directeur-
      generaal namens de bewindspersoon door de secretaris-generaal aangewezen als plaatsvervangend directeur-generaal.
      Het voorgaande is van overeenkomstige toepassing op de Nationaal Coördinator Terrorismebestrijding en Veiligheid en
      de inspecteur-generaal van de Inspectie Justitie en Veiligheid.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel3
  - number: '3.7'
    text: |-
      De secretaris-generaal (voorzitter), de plaatsvervangend secretaris-generaal, de hoofddirecteur bedrijfsvoering, de
      directeuren-generaal van de clusters als bedoeld in [artikel 2, tweede lid onderdelen c tot en met g][ref1] en de
      Nationaal Coördinator Terrorismebestrijding en Veiligheid vormen samen de bestuursraad. De bestuursraad formuleert
      de ministeriebrede en gemeenschappelijke kaders en bewaakt dat de activiteiten en het beleid van de onderscheiden
      clusters daarbinnen blijven. De voorzitter van het College van procureurs-generaal, de directeur-generaal van de
      Dienst Justitiële Inrichtingen, de directeur-generaal van de Immigratie- en Naturalisatiedienst en de korpschef van
      de Nationale Politie nemen als toehoorder deel aan de bestuursraad.


      [ref1]: https://wetten.overheid.nl/BWBR0040293#Artikel2
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0040293
        artikel: '2'
        hoofdstuk: '1'
  - number: '4.1'
    text: |-
      Het cluster secretaris-generaal (SG-cluster) heeft taken op de terreinen van wetgeving, Europese en internationale
      aangelegenheden, onderzoek, strategievorming, innovatie, voorlichting, communicatie, financiën en bestuurlijke en
      parlementaire ondersteuning.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel4
  - number: '4.2'
    text: |-
      de plaatsvervangend secretaris-generaal is hoofd van het SG-cluster. De secretaris-generaal blijft verantwoordelijk
      voor de beleidsvoering ten aanzien van de directie Wetgeving en Juridische Zaken en de directie Financieel-
      Economische Zaken betreft. Het SG-cluster bestaat uit de Organisatie Integriteit, die tot taak heeft het bevorderen
      en stimuleren van een goed werkend integriteitsstelsel binnen het ministerie, en de volgende dienstonderdelen:
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel4
  - number: 4.2.a
    text: de directie Wetgeving en Juridische Zaken (DWJZ);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel4
  - number: 4.2.b
    text: de directie Europese en Internationale Aangelegenheden (DEIA);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel4
  - number: 4.2.c
    text: de directie Bestuursondersteuning (DBO);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel4
  - number: 4.2.d
    text: de directie Communicatie (DCOM);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel4
  - number: 4.2.e
    text: de directie Financieel-Economische Zaken (DFEZ);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel4
  - number: 4.2.f
    text: de directie Innovatie, Kennis en Strategie (IKS, ook afgekort als X);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel4
  - number: 4.2.g
    text: de directie Eigenaarsadvisering;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel4
  - number: 4.2.h
    text: het bureau Adviescollege Verloftoetsing tbs;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel4
  - number: 4.2.i
    text: de Nationaal Coördinator Antisemitismebestrijding (NCAB).
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel4
  - number: '5.1'
    text: |-
      De directie Wetgeving en Juridische Zaken (DWJZ) is belast met de ontwikkeling, de totstandkoming, het beheer en
      het onderhoud van justitie- en veiligheidswetgeving en van andere wetgeving voor zover deze tot het werkterrein van
      een dienstonderdeel van het ministerie behoort, alsmede met het ontwikkelen en uitdragen van het wetgevingsbeleid
      en de toetsing van ontwerpwetgeving van de ministeries op rechtsstatelijke en bestuurlijke kwaliteit, met inbegrip
      van de constitutionele, Europeesrechtelijke en internationaalrechtelijke toetsing van wetgeving.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel5
  - number: '5.2'
    text: 'De directie is tevens belast met:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel5
  - number: 5.2.a
    text: |-
      het in ondermandaat dan wel met volmacht of machtiging van de hoofden van de clusters en het hoofd van het
      Wetenschappelijk Onderzoek en Datacentrum (WODC) behandelen van bezwaar- en beroepschriften, verzoeken om
      voorlopige voorziening, aansprakelijkstellingen, verzoeken om schadevergoeding en civielrechtelijke procedures;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel5
  - number: 5.2.b
    text: |-
      het ten behoeve van de hoofden van de clusters opstellen van overeenkomsten en convenanten, anders dan op het
      gebied van inkoop en aanbesteding;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel5
  - number: 5.2.c
    text: |-
      het desgevraagd adviseren van de leden van de departementsleiding op juridisch-bestuurlijk gecompliceerde of
      gevoelige onderwerpen, alsmede het vervullen van bijzondere opdrachten van de departementsleiding;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel5
  - number: 5.2.d
    text: |-
      het in samenwerking met de clusters ontwikkelen, beheren en bewaken van de juridische kwaliteitsborging, gericht
      op het inzichtelijk maken, voorkomen en tegengaan van juridische risico’s en het waarborgen van een adequate
      juridische inbreng, zowel bij de voorbereiding als bij de uitvoering van beleid;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel5
  - number: 5.2.e
    text: |-
      klachtbehandeling op mensenrechtelijk terrein voor internationale gerechten en comités, mensenrechtelijke
      advisering in de brede zin en het voeren van internationale onderhandelingen namens het ministerie ten aanzien van
      mensenrechtelijke onderwerpen;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel5
  - number: 5.2.f
    text: |-
      het onderhouden van het geregelde contact met de landsadvocaat en het beslissen op verzoeken om inschakeling van
      de landsadvocaat.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel5
  - number: '5.3'
    text: |-
      De directie Wetgeving en Juridische Zaken is voorts belast met het opdrachtgeverschap als bedoeld in de circulaire
      ‘Governance ten aanzien van zbo’s’ met betrekking tot het College van Toezicht Collectieve Beheersorganisaties
      auteurs- en naburige rechten.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel5
  - number: '5.4'
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel5
  - number: 5.4.a
    text: de sector Straf- en sanctierecht;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel5
  - number: 5.4.b
    text: de sector Staats- en bestuursrecht;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel5
  - number: 5.4.c
    text: de sector Privaatrecht;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel5
  - number: 5.4.d
    text: de sector Juridische Zaken en Wetgevingsbeleid;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel5
  - number: 5.4.e
    text: de afdeling Ondersteuning.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel5
  - number: '6.1'
    text: |-
      De directie Europese en Internationale Aangelegenheden (DEIA) draagt zorg voor een ministeriebrede strategie- en
      visieontwikkeling ten aanzien van multilaterale, Europese en bilaterale horizontale dossiers en beleidsvraagstukken
      en ten aanzien van Koninkrijksamenwerking, internationale projecten en expertisegebieden. Tevens is de directie
      belast met de zorg voor een gecoördineerde en effectieve inzet van Nederland op het gebied van Justitie en
      Veiligheid binnen het kader van de samenwerking binnen de Europese Unie en in het kader van de samenwerking op
      multilateraal, bilateraal en Koninkrijksniveau. Tenslotte faciliteert de directie de politieke en ambtelijke
      leiding alsmede de directies in logistieke en instrumentele zin op voornoemde terreinen en verzorgt zij de daarop
      betrekking hebbende informatievoorziening aan interne dossierhouders en belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel6
  - number: '6.2'
    text: |-
      De directie bevordert en bewaakt de eenheid van optreden op de in het eerste lid genoemde terreinen met
      inachtneming van de eigen beleidsverantwoordelijkheid van andere dienstonderdelen voor de internationale aspecten
      van hun beleidsterrein.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel6
  - number: '6.3'
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel6
  - number: 6.3.a
    text: de afdeling Europese Unie;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel6
  - number: 6.3.b
    text: de afdeling Internationale Betrekkingen en Projecten;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel6
  - number: 6.3.c
    text: de afdeling Justitie en Veiligheid van de Permanente Vertegenwoordiging bij de Europese Unie;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel6
  - number: 6.3.d
    text: |-
      de attachees Justitie en Veiligheid op andere Nederlandse ambassades en permanente vertegenwoordigingen in het
      buitenland;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel6
  - number: 6.3.e
    text: de managementondersteuning.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel6
  - number: '9.1'
    text: 'De directie Bestuursondersteuning (DBO) is belast met:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel9
  - number: 9.1.a
    text: algemene staftaken, ten behoeve van de politieke en ambtelijke leiding;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel9
  - number: 9.1.b
    text: |-
      de protocollaire ondersteuning van de departementsleiding van het ministerie en vervult daarbij een coördinerende
      rol.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel9
  - number: '9.2'
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel9
  - number: 9.2.a
    text: de afdeling Advies;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel9
  - number: 9.2.b
    text: de afdeling Managementondersteuning en Bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel9
  - number: 9.2.c
    text: het Bureau Protocol en Evenementen.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel9
  - number: '10.1'
    text: |-
      De directie Communicatie (DCOM) is belast met het geven van informatie van en over het ministerie. Hierbij wordt
      gezocht naar een goede balans tussen het belang van het ministerie en dat van de ontvangers. Ook heeft de directie
      tot taak om politieke en maatschappelijke signalen op te vangen en terug te koppelen binnen de organisatie.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel10
  - number: '10.2'
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel10
  - number: 10.2.a
    text: het Bedrijfsbureau;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel10
  - number: 10.2.b
    text: de afdeling Woordvoering, Speeches en Omgevingskennis;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel10
  - number: 10.2.c
    text: de afdeling Communicatieadvies en Redactie.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel10
  - number: '11.1'
    text: 'De directie Financieel-Economische Zaken (DFEZ) is de ministeriebrede en DG-controller en belast met:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel11
  - number: 11.1.a
    text: |-
      de advisering van de departementsleiding over het beleid, de uitvoering en de bedrijfsvoering dat aan de
      departementale begroting ten grondslag ligt;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel11
  - number: 11.1.b
    text: de coördinatie van het begrotingsproces;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel11
  - number: 11.1.c
    text: de inrichting en de aansturing van de financiële functie op het ministerie;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel11
  - number: 11.1.d
    text: |-
      het adviseren van de departementsleiding over het functioneren en de inrichting van de controlfunctie binnen het
      ministerie;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel11
  - number: 11.1.e
    text: de ondersteuning van de budgethouders bij besluitvorming;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel11
  - number: 11.1.f
    text: het bewaken van de financiën ten aanzien van de doelmatigheid, doeltreffendheid en rechtmatigheid.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel11
  - number: '11.2'
    text: |-
      DFEZ bevordert de integratie van beheer en beleid binnen het domein van de directie en levert daartoe een
      bijdrage aan het realiseren van de beleidsdoelstellingen van het ministerie. DFEZ doet dit door kaders binnen het
      domein van de directie voor bedrijfsvoering te stellen, op hoofdlijnen toezicht te houden, financiële en andere
      bedrijfsvoeringprocessen te begeleiden en ondersteunen, alsmede te adviseren waar dat gewenst wordt of zij dit
      noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel11
  - number: '11.3'
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel11
  - number: 11.3.a
    text: de afdeling Begroting en Kaderstelling;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel11
  - number: 11.3.b
    text: de afdeling Financiële Infrastructuur & Concernadministratie;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel11
  - number: 11.3.c
    text: de afdeling Control op Beleid en Uitvoering.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel11
  - number: '12'
    text: |-
      De directie Innovatie, Kennis en Strategie is belast met het versterken van de functies innovatie, strategie en
      kennis van het ministerie. Daarbij kunnen de volgende taken worden onderscheiden:
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel12
  - number: 12.a
    text: Het daarbij adviseren van de departementsleiding;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel12
  - number: 12.b
    text: |-
      Het onderhouden of versterken van netwerken zowel binnen het ministerie als met externe publieke en private
      partijen;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel12
  - number: 12.c
    text: Het doen van verkenningen en het agenderen van nieuwe onderwerpen;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel12
  - number: 12.d
    text: Het coördineren van organisatieonderdeel overstijgende activiteiten;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel12
  - number: 12.e
    text: Het behartigen van organisatieonderdeel overstijgende belangen;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel12
  - number: 12.f
    text: Het stimuleren van projecten en activiteiten.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel12
  - number: 12a.1
    text: |-
      De directie Eigenaarsadvisering (DEA) heeft tot taak de eigenaar, met inachtneming van de geldende wet- en
      regelgeving, te adviseren en te ondersteunen ten aanzien van de organisaties genoemd in het tweede lid. Ter
      uitvoering van deze taken is DEA in het bijzonder belast met:
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel12a
  - number: 12a.1.a
    text: |-
      het toetsen van de doelmatigheid en de continuïteit van de uitvoering van de organisatie en de kwaliteit van de
      dienstverlening;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel12a
  - number: 12a.1.b
    text: het toetsen van de bedrijfsvoering van de organisatie en het adviseren binnen de planning- en controlcyclus;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel12a
  - number: 12a.1.c
    text: het toezien op het goed functioneren van het sturingsmodel;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel12a
  - number: 12a.1.d
    text: |-
      de advisering over kaders en richtlijnen voor diensten en verzelfstandigde organisaties en het coördineren van
      ontwikkelingen daaromtrent.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel12a
  - number: 12a.2
    text: |-
      Het aandachtsgebied van de taken van de DEA omvat de diensten en baten-lastenagentschappen, genoemd in
      [artikel 2, derde lid][ref1], alsmede de zelfstandige bestuursorganen genoemd in [artikel 3, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0040293#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0040293#Artikel3
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0040293
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0040293
        artikel: '3'
        hoofdstuk: '1'
  - number: '13'
    text: |-
      Het bureau Adviescollege Verloftoetsing tbs is belast met het ondersteunen van het Adviescollege Verloftoetsing tbs
      alsmede het ontwikkelen van richtlijnen en andere vormen van methodische aanpak ten behoeve van dat adviescollege.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel13
  - number: 13a.1
    text: |-
      De Nationaal Coördinator Antisemitismebestrijding (NCAB) adviseert de Minister van Justitie en Veiligheid over de
      volgende onderwerpen:
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel13a
  - number: 13a.1.a
    text: bestrijding van antisemitisme;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel13a
  - number: 13a.1.b
    text: |-
      knelpunten in de verschillende ketens bij de afhandeling van antisemitismezaken en in de gehele keten van
      antisemitisme bestrijding;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel13a
  - number: 13a.1.c
    text: |-
      het vervolg dat gegeven kan worden aan de projecten die in het kader van de besteding van de gelden antisemitisme
      zijn uitgevoerd, op basis van de uitkomsten van de evaluaties die onder ambtelijke verantwoordelijkheid worden
      uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel13a
  - number: 13a.2
    text: 'In aanvulling op het bepaalde in het eerste lid, bestaat het takenpakket van de NCAB nog uit de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel13a
  - number: 13a.2.a
    text: |-
      signaleringsfunctie voor de Joodse gemeenschap en het informeren van de Minister van Justitie en Veiligheid over de
      ontvangen signalen;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel13a
  - number: 13a.2.b
    text: |-
      Het opzetten van een gesprekscyclus met gemeenten met een Joodse gemeenschap en monitoren welke maatregelen de
      beveiliging van Joodse gemeenschappen effectief borgen;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel13a
  - number: 13a.2.c
    text: |-
      het onderhouden van contacten met collega’s in het internationale werkveld om ervaringen uit te wisselen en waar
      mogelijk goede ervaringen over te nemen en in Nederland in de praktijk te brengen;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel13a
  - number: 13a.2.d
    text: evaluatie van de eigen werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel13a
  - number: 13a.3
    text: |-
      Bij de uitvoering van zijn taak kan de NCAB zich onder meer voor het inwinnen van inlichtingen rechtstreeks wenden
      tot alle instanties en personen die aan het uitvoeren van zijn taak kunnen bijdragen, hieronder begrepen de leden
      van de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel13a
  - number: '14.1'
    text: |-
      De Hoofddirectie bedrijfsvoering staat onder leiding van de hoofddirecteur bedrijfsvoering. De hoofddirecteur
      bedrijfsvoering is onder meer verantwoordelijk voor de bedrijfsvoering van het ministerie in beleidsmatige zin, in
      het bijzonder betreffende personeel, informatievoorziening, organisatie, automatisering, huisvesting en facilities.
      Daarbij kunnen de volgende taken worden onderscheiden:
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel14
  - number: 14.1.a
    text: ministeriebrede kaderstelling, control en advisering aan de secretaris-generaal en bewindslieden;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel14
  - number: 14.1.b
    text: |-
      ministeriebrede coördinatie ten behoeve van de inbreng van het JenV-belang in interdepartementale overleggen en
      trajecten op het terrein van bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel14
  - number: 14.1.c
    text: advisering van integraal managers in de rol van DG-controller;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel14
  - number: 14.1.d
    text: |-
      dienstverlening op het terrein van bedrijfsvoering ter ondersteuning van de primaire processen op het
      bestuursdepartement.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel14
  - number: '14.2'
    text: |-
      De hoofddirectie bedrijfsvoering is tevens belast met de advisering en ondersteuning van de eigenaar ten aanzien
      van de organisaties genoemd in [artikel 2, derde lid][ref1], alsmede de zelfstandige bestuursorganen genoemd in
      [artikel 3, eerste lid][ref2], tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0040293#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0040293#Artikel3
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0040293
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0040293
        artikel: '3'
        hoofdstuk: '1'
  - number: '14.3'
    text: |-
      De hoofddirectie bedrijfsvoering bestaat uit de Landelijke Eenheid Vertrouwenspersonen en de volgende
      dienstonderdelen:
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel14
  - number: 14.3.a
    text: de directie Personeel en Organisatie (DP&O);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel14
  - number: 14.3.b
    text: de directie Informatievoorziening en Inkoop (DI&I);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel14
  - number: 14.3.c
    text: het Dienstencentrum (DC);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel14
  - number: 14.3.d
    text: de directie Huisvesting en Facilities (DHF);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel14
  - number: 14.3.e
    text: het Project-, Programma- en Adviescentrum (PPAC);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel14
  - number: 14.3.f
    text: de directie Openbaarmaking (DO).
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel14
  - number: '15.1'
    text: 'De directie Personeel en Organisatie (DP&O) is belast met:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel15
  - number: 15.1.a
    text: |-
      advisering van de departementsleiding over en de ontwikkeling, organisatie, coördinatie van en control op het
      ministeriebreed organisatie- en personeelsbeleid;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel15
  - number: 15.1.b
    text: de uitvoering van de departementale werkgeverstaken;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel15
  - number: 15.1.c
    text: |-
      de eerstelijnsadvisering ten aanzien van organisatie- en personeelsaangelegenheden aan de hoofden van de clusters
      en de daaronder ressorterende dienstonderdelen;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel15
  - number: 15.1.d
    text: de ontwikkeling en organisatie van opleidingsprogramma’s ten behoeve van alle beleidsambtenaren van het ministerie.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel15
  - number: '15.2'
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel15
  - number: 15.2.a
    text: de afdeling Beleidsimplementatie;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel15
  - number: 15.2.b
    text: de afdeling Kwaliteit, Control en interne Bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel15
  - number: 15.2.c
    text: de afdeling Dienstverlening;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel15
  - number: 15.2.d
    text: Human Resource Management, Organisatie en Ondersteuning i.o. (HRMO i.o.);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel15
  - number: 15.2.e
    text: het Bureau Ondersteuning Medezeggenschap.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel15
  - number: '16.1'
    text: 'De directie Informatievoorziening en Inkoop (DI&I) is belast met:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel16
  - number: 16.1.a
    text: |-
      het adviseren van de departementsleiding over strategische vraagstukken op het gebied van informatievoorziening
      en ICT;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel16
  - number: 16.1.b
    text: de control op het gebied van inkoopbeheer, informatievoorziening en ICT;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel16
  - number: 16.1.c
    text: |-
      het ondersteunen van de dienstonderdelen van het ministerie bij de inrichting van de keteninformatisering en de
      beheersing van grote ICT-projecten;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel16
  - number: 16.1.d
    text: de uitvoering van projecten op het gebied van de JenV-brede ICT-infrastructuur;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel16
  - number: 16.1.e
    text: |-
      het vaststellen van kaders en centrale voorzieningen ten behoeve van de dienstonderdelen van het ministerie met het
      oog op rechtmatige, efficiënte en duurzame inkoop;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel16
  - number: 16.1.f
    text: |-
      het toezicht op de integrale beveiliging waaronder het toezicht op de inrichting en werking van de departementale
      beveiligingsorganisatie en van de control-processen voor informatiebeveiliging, en de werking van de
      beveiligingsorganisatie en de informatiebeveiliging ten behoeve van de onder de verantwoordelijkheid van
      respectievelijk de Minister en de Minister van Binnenlandse Zaken en Koninkrijksrelaties ressorterende diensten
      en bedrijven.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel16
  - number: '16.2'
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel16
  - number: 16.2.a
    text: de afdeling Beleid, Kennis en Innovatie;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel16
  - number: 16.2.b
    text: de afdeling I-Control en Security;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel16
  - number: 16.2.c
    text: de afdeling Regie, Programma’s en Projecten;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel16
  - number: 16.2.d
    text: de afdeling Strategische Inkoop;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel16
  - number: 16.2.e
    text: de afdeling Beveiligingsautoriteit (BVA);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel16
  - number: 16.2.f
    text: de eenheid Bedrijfsjuridische Zaken;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel16
  - number: 16.2.g
    text: de eenheid Staf.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel16
  - number: '16.3'
    text: |-
      De afdeling Beleid, Kennis en Innovatie, de afdeling I-Control en Security en de afdeling Regie, Programma’s en
      Projecten vormen tezamen het Chief Information Officer-Office (CIO-Office).
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel16
  - number: '17.1'
    text: |-
      Het Dienstencentrum (DC) verzorgt voor het bestuursdepartement de levering van diensten op het gebied van
      huisvesting, facilitaire dienstverlening, ICT, inkoopondersteuning, werkplekservices en diensten op het gebied
      van post en informatievoorziening. Het Dienstencentrum is tevens belast met contractmanagement binnen de
      bedrijfsvoering ten behoeve van het bestuursdepartement.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel17
  - number: '17.2'
    text: 'Het Dienstencentrum bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel17
  - number: 17.2.a
    text: de afdeling Klantadvies en ondersteuning;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel17
  - number: 17.2.b
    text: de afdeling Portfoliomanagement;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel17
  - number: 17.2.c
    text: de afdeling Bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel17
  - number: 17.2.d
    text: de afdeling Inkoop uitvoeringscentrum (IUC);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel17
  - number: 17.2.e
    text: de afdeling Productie informatievoorziening (PIV).
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel17
  - number: '18'
    text: |-
      De directie Huisvesting en Facilities (DHF) is belast met het realiseren van beleid, kaders en richtlijnen
      op het terrein van huisvesting en daarmee verband houdende faciliteiten alsmede met de uitvoering van
      huisvestingsprojecten voor het ministerie en aan het ministerie gerelateerde internationale organisaties.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel18
  - number: 18a
    text: 'Het Project-, Programma- en Adviescentrum (PPAC) is belast met:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel18a
  - number: 18a.a
    text: het stimuleren en ondersteunen van projectmatig en programmatisch werken;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel18a
  - number: 18a.b
    text: het delen van kennis en ervaringen met projectmatig en programmatisch werken;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel18a
  - number: 18a.c
    text: het vergroten van flexibiliteit van medewerkers;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel18a
  - number: 18a.d
    text: het verbinden van ervaren project- en programmamanagers en projectsecretarissen.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel18a
  - number: 18b.1
    text: 'De directie Openbaarmaking is belast met de kerntaken:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel18b
  - number: 18b.1.a
    text: Passieve openbaarmaking;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel18b
  - number: 18b.1.b
    text: Actieve openbaarmaking;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel18b
  - number: 18b.1.c
    text: (Onderzoeks-)commissies & parlementaire enquêtes.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel18b
  - number: 18b.2
    text: 'De directie Openbaarmaking bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel18b
  - number: 18b.2.a
    text: de afdeling Passieve openbaarmaking;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel18b
  - number: 18b.2.b
    text: het team Staf;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel18b
  - number: 18b.2.c
    text: het team Verkenning, ontwikkeling en ondersteuning.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel18b
  - number: '19.1'
    text: |-
      Het directoraat-generaal Straffen en Beschermen (DGSenB) is belast met het ontwikkelen, in opdracht geven dan wel
      uitvoeren en/of implementeren van het beleid met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel19
  - number: 19.1.a
    text: |-
      de bescherming en begeleiding van jeugdigen in onveilige opvoedsituaties en voor een persoonsgerichte en
      groepsgerichte aanpak van jeugdigen die in aanraking komen of dreigen te komen met politie en justitiële
      organisaties;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel19
  - number: 19.1.b
    text: slachtoffers van geweld en criminaliteit;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel19
  - number: 19.1.c
    text: de bescherming van personen en instellingen tegen criminaliteit, recidive en onveiligheid;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel19
  - number: 19.1.d
    text: |-
      een effectieve en persoonsgerichte tenuitvoerlegging van strafrechtelijke beslissingen inclusief de regie op dit
      deel van de strafrechtketen.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel19
  - number: '19.2'
    text: 'Het directoraat-generaal bestaat uit de volgende dienstonderdelen:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel19
  - number: 19.2.a
    text: de directie Sanctie- en Slachtofferbeleid (DSenS);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel19
  - number: 19.2.b
    text: de directie Jeugd, Familie en aanpak Criminaliteitsfenomenen (DJFC);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel19
  - number: 19.2.c
    text: de directie Advies, Regie en Centrale autoriteit (DARC);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel19
  - number: 19.2.d
    text: de directie Artificiële Intelligentie (AI);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel19
  - number: 19.2.e
    text: de programmadirectie Toekomstscenario kind- en gezinsbescherming (TKG).
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel19
  - number: '20'
    text: |-
      De directeur-generaal wordt secretarieel, organisatorisch en administratief ondersteund door het team
      Managementondersteuning en Staf.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel20
  - number: '21.1'
    text: |-
      De directie Sanctie- en Slachtofferbeleid (DSenS) is belast met de coördinatie, ontwikkeling en evaluatie van
      beleid dat is gericht op:
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel21
  - number: 21.1.a
    text: |-
      het voorkomen van slachtofferschap en daderschap alsmede de bescherming van kwetsbare groepen die vanwege de
      kwetsbare positie waarin zij verkeren bedreigd of verleid worden door (herhaalde) criminaliteit;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel21
  - number: 21.1.b
    text: het terrein van de intramurale, extramurale en financiële sanctietoepassing bij minderjarigen en volwassenen;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel21
  - number: 21.1.c
    text: forensische zorg alsmede de aanpak van personen met verward gedrag en een hoog veiligheidsrisico.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel21
  - number: 21.1.d
    text: innovatie en onderzoekscoördinatie voor het gehele directoraat-generaal (DG-lab);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel21
  - number: 21.1.e
    text: het kansspelbeleid en het integriteitsbeleid, waaronder in ieder geval de verklaring omtrent het gedrag.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel21
  - number: '21.2'
    text: |-
      De directie voert de regie en coördineert de inzet van alle betrokken dienstonderdelen en taakorganisaties
      bij de afdoening van incidenten tijdens de tenuitvoerlegging van strafrechtelijke beslissingen en de
      [Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref1] waaraan politiek-bestuurlijke aspecten zijn
      verbonden, onverlet de eigenstandige verantwoordelijkheid van de betrokken taakorganisaties voor de aan hen uit
      hoofde van dit besluit toebedeelde taken en verantwoordelijkheden. De directie ontwikkelt en onderhoudt daartoe de
      benodigde expertise en incidentenstrategie.


      [ref1]: https://wetten.overheid.nl/BWBR0004581
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004581
  - number: '21.3'
    text: |-
      De directie heeft een adviserende taak in de beleidsvoering van de het Centraal Justitieel Incassobureau, de Dienst
      JUSTIS en de Dienst Justitiële Inrichtingen, voor zover het haar beleidsterrein betreft.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel21
  - number: '21.4'
    text: |-
      De directie is beleidsmatig en budgettair verantwoordelijk voor de door de directie gesubsidieerde organisaties en
      instellingen en stuurt deze aan.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel21
  - number: '21.5'
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel21
  - number: 21.5.a
    text: het team Sancties Intramuraal (SI);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel21
  - number: 21.5.b
    text: het team Sancties Extramuraal (SE);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel21
  - number: 21.5.c
    text: het team Forensische Zorg (FZ);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel21
  - number: 21.5.d
    text: het team Slachtofferbeleid (SB);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel21
  - number: 21.5.e
    text: het team Integriteit en Kansspelen (IenK);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel21
  - number: 21.5.f
    text: het secretariaat van de Raad voor Strafrechtstoepassing en Jeugdbescherming (secretariaat RSJ).
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel21
  - number: '21.6'
    text: |-
      Het secretariaat RSJ is belast met de bedrijfsvoering en ondersteuning van de Raad voor Strafrechtstoepassing en
      Jeugdbescherming.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel21
  - number: '22.1'
    text: |-
      De directie Jeugd, Familie en aanpak Criminaliteitsfenomenen (DJFC) is belast met de coördinatie, ontwikkeling en
      evaluatie van beleid dat is gericht op:
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel22
  - number: 22.1.a
    text: |-
      de vereenvoudiging en verhoging van de effectiviteit van het stelsel van de jeugdbescherming, het verbeteren van de
      rechtsbescherming van ouders en kinderen;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel22
  - number: 22.1.b
    text: |-
      dat is gericht op de continuïteit van het aanbod van jeugdbescherming en het tegengaan van huiselijk geweld en
      kindermishandeling;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel22
  - number: 22.1.c
    text: de aanpak van (jeugd)criminaliteit;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel22
  - number: 22.1.d
    text: |-
      kinderrechten en aangaande het familierecht gericht op mensen, hun identiteit en hun levensgebeurtenissen,
      waaronder in ieder geval geboorte, naamgeving, afstamming, (gender)identiteit, adoptie, huwelijk en scheiding en de
      gevolgen daarvan;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel22
  - number: 22.1.e
    text: |-
      de aanpak van criminaliteitsfenomenen met een grote impact op de slachtoffers en omgeving, langs de lijnen van
      voorkomen daderschap en slachtofferschap, versterken opsporing en vervolging en voorkomen recidive.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel22
  - number: '22.2'
    text: |-
      De directie heeft een adviserende taak in de beleidsvoering van de raad voor de kinderbescherming en de Dienst
      Justitiële Inrichtingen, voor zover het haar beleidsterrein betreft.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel22
  - number: '22.3'
    text: |-
      De directie is beleidsmatig en budgettair verantwoordelijk voor de door de directie gesubsidieerde organisaties
      en instellingen en stuurt deze aan. De directie is tevens beleidsmatig verantwoordelijk voor het Landelijk Bureau
      Inning Onderhoudsbijdragen en de aansturing daarvan.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel22
  - number: '22.4'
    text: |-
      De directie is belast met de verlening van vergunningen als bedoeld in
      [artikel 15 van de Wet opneming buitenlandse kinderen ter adoptie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004447#Artikel15
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004447
        artikel: '15'
  - number: '22.5'
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel22
  - number: 22.5.a
    text: het team Stelsel Jeugdbescherming (JBS);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel22
  - number: 22.5.b
    text: het team Jeugdbescherming en Huiselijk Geweld (JBHG);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel22
  - number: 22.5.c
    text: het team Jeugdcriminaliteit (JC);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel22
  - number: 22.5.d
    text: het team Familie (F);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel22
  - number: 22.5.e
    text: het team Aanpak Criminaliteitsfenomenen (ACF).
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel22
  - number: '23.1'
    text: |-
      De directie Advies, Regie en Centrale autoriteit (DARC) is belast met financiële advisering aan de directeur-
      generaal en de directeuren van de andere onderdelen als bedoeld in [artikel 19, tweede lid][ref1]. Deze advisering
      heeft in ieder geval betrekking op uitvoeringsdiensten, zelfstandige bestuursorganen, rechtspersonen met een
      wettelijke taak en gesubsidieerde organisaties op het terrein van het directoraat-generaal, voor zover het geen
      taak van DFEZ of DEA betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0040293#Artikel19
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0040293
        artikel: '19'
        hoofdstuk: '4'
  - number: '23.2'
    text: 'Daarnaast is de directie belast met:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel23
  - number: 23.2.a
    text: |-
      het gevraagd en ongevraagd advies uitbrengen over bedrijfsvoerings-, informatiemanagement-, juridische en
      ketenregievraagstukken, samenwerking in de strafrecht- en jeugdbeschermingsketens en data-analyses;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel23
  - number: 23.2.b
    text: het ondersteunen bij juridische procedures;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel23
  - number: 23.2.c
    text: het afhandelen van informatieverzoeken op het terrein van het directoraat-generaal;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel23
  - number: 23.2.d
    text: de verzorging van de interne bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel23
  - number: 23.2.e
    text: |-
      het adviseren over het functioneren van de tenuitvoerleggingsketen van strafrechtelijke beslissingen en de
      [Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref1], de jeugdketen en de slachtofferketen en het
      verbeteren van de prestaties van deze ketens;


      [ref1]: https://wetten.overheid.nl/BWBR0004581
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004581
  - number: 23.2.f
    text: de ondersteuning van het management binnen het directoraat-generaal in de vorm van een staf en secretariaat;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel23
  - number: 23.2.g
    text: |-
      het aanwijzen van projectplaatsen op grond van
      [artikel 3:8, derde lid, Besluit tenuitvoerlegging strafrechtelijke beslissingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0042962#Artikel3
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0042962
        artikel: '3'
  - number: '23.3'
    text: 'De directie is budgettair verantwoordelijk voor:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel23
  - number: 23.3.a
    text: het Centrum Internationale Kinderontvoering;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel23
  - number: 23.3.b
    text: de International Social Services;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel23
  - number: '23.4'
    text: |-
      De Centrale autoriteit Internationale Kinderaangelegenheden van het team, genoemd in het zevende lid, onder b,
      verricht de werkzaamheden van de Centrale autoriteit interlandelijke adoptie, de Centrale autoriteit internationale
      kinderbescherming en de Centrale autoriteit internationale kinderontvoering. De Centrale autoriteit Internationale
      Kinderaangelegenheden is verantwoordelijk voor het uitvoeringsbeleid ten aanzien van voornoemde werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel23
  - number: '23.5'
    text: 'Het team Subsidieportaal, genoemd in het zevende lid, onder d, is belast met:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel23
  - number: 23.5.a
    text: |-
      het voor de hoofden van de clusters, bedoeld in [artikel 2, tweede lid, onder a tot en met h][ref1], voorbereiden
      en uitvoeren van beslissingen met betrekking tot subsidies en financiële bijdragen aan medeoverheden met
      uitzondering van subsidies en bijdragen aan zelfstandige bestuursorganen en rechtspersonen met een wettelijke taak,
      alsmede met uitzondering van EU-subsidies;


      [ref1]: https://wetten.overheid.nl/BWBR0040293#Artikel2
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0040293
        artikel: '2'
        hoofdstuk: '1'
  - number: 23.5.b
    text: |-
      de feitelijke uitvoering van betaalopdrachten ter uitvoering van beslissingen als bedoeld in onderdeel a, voor
      zover de beslissingsbevoegde daartoe machtiging heeft verleend;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel23
  - number: 23.5.c
    text: |-
      het gevraagd en ongevraagd adviseren over de niet-beleidsmatige onderdelen van subsidieprocessen en de niet-
      beleidsmatige onderdelen van het verstrekken van bijdragen aan medeoverheden.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel23
  - number: '23.6'
    text: 'Het team Managementondersteuning en Staf (MOS), genoemd in het zevende lid, onder e, is belast met:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel23
  - number: 23.6.a
    text: de managementondersteuning voor de MT-leden van DGSenB;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel23
  - number: 23.6.b
    text: |-
      het organiseren en coördineren van de parlementaire processen, het ondersteunen van de inhoudelijke MT’s van
      DGSenB;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel23
  - number: 23.6.c
    text: het hebben van de secretarisrol voor de SenB-staf met de bewindslieden.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel23
  - number: '23.7'
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel23
  - number: 23.7.a
    text: het team Financieel Advies en Bedrijfsvoering (FAB);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel23
  - number: 23.7.b
    text: het team Juridische en Internationale Zaken (JIZ);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel23
  - number: 23.7.c
    text: het team Ketenregie (KR);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel23
  - number: 23.7.d
    text: het team Subsidieportaal;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel23
  - number: 23.7.e
    text: het team Managementondersteuning en Staf (MOS).
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel23
  - number: '24'
    text: |-
      De directie Artificiële Intelligentie is belast met de coördinatie, ontwikkeling en realisatie van beleid inzake
      kunstmatige intelligentie en de toepassing daarvan in het justitie- en veiligheidsdomein in samenwerking dan wel in
      opdracht van andere onderdelen of takenorganisaties van het ministerie.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel24
  - number: '25'
    text: |-
      De programmadirectie Toekomstscenario kind- en gezinsbescherming (TKG) is belast met de coördinatie en
      uitvoering van werkzaamheden ter voorbereiding van de afstemming en besluitvorming tussen en ten behoeve van haar
      opdrachtgevers inzake een toekomstscenario met betrekking tot de bescherming van kinderen en hun gezinnen. De
      programmadirectie richt zich in ieder geval op:
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel25
  - number: 25.a
    text: het doorontwikkelen van het toekomstscenario en het uitwerken daarvan naar een concreet en gedragen stelselaanpak;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel25
  - number: 25.b
    text: het eenvoudiger en effectiever maken van de jeugdbeschermingsketen en het terugdringen van huiselijk geweld;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel25
  - number: 25.c
    text: |-
      de vereenvoudiging en het verbeteren van de kwaliteit van de jeugdbescherming en het tegengaan van
      kindermishandeling en huiselijk geweld in afstemming met de directie DJFC;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel25
  - number: 25.d
    text: |-
      het integreren van de werkwijze en opbrengsten van de programma’s Geweld Hoort Nergens Thuis en de programma’s
      Scheiden zonder schade.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel25
  - number: '28.1'
    text: 'Het directoraat-generaal Politie en Veiligheidsregio’s (DGPenV) is belast met:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel28
  - number: 28.1.a
    text: de verantwoordelijkheid voor het functioneren van de politieorganisatie en het leveren van politiezorg;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel28
  - number: 28.1.b
    text: het ontwikkelen van een visie op de kwaliteit, de inrichting en de ontwikkeling van de politieorganisatie;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel28
  - number: 28.1.c
    text: |-
      het in samenspraak met de NCTV verhogen van de weerbaarheid op decentraal niveau ter voorkoming van
      maatschappelijke ontwrichting, door het preventief afwenden van gevaar, het voorkomen en beperken van de gevolgen
      van een ramp of crisis, en het bijdragen aan het herstellen van de daardoor veroorzaakte schade.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel28
  - number: '28.2'
    text: 'Ter uitvoering van de taken, bedoeld in het eerste lid, is het directoraat-generaal in het bijzonder belast met:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel28
  - number: 28.2.a
    text: de doorontwikkeling van het stelsel van de nationale politie;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel28
  - number: 28.2.b
    text: beleidsontwikkeling op het terrein van de politie;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel28
  - number: 28.2.c
    text: |-
      het vaststellen van beleidskaders voor de politieorganisatie en de uitvoering van politietaken, gericht op het
      realiseren van de beleidsprioriteiten van de bewindspersoon en de gezagsdragers;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel28
  - number: 28.2.d
    text: het creëren van condities voor een goed en slagvaardig functionerend politieapparaat;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel28
  - number: 28.2.e
    text: |-
      het in samenspraak met de NCTV ontwikkelen van beleid gericht op risico- en crisisbeheersing op decentraal
      niveau, in het bijzonder het onderhouden van het stelsel van decentrale crisisbeheersing, en het zorgdragen voor
      de aansluiting daarvan op het stelsel van nationale crisisbeheersing en op de afspraken met betrekking tot de
      internationale samenwerking.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel28
  - number: '28.3'
    text: 'Het directoraat-generaal bestaat uit de volgende portefeuilles en dienstonderdelen:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel28
  - number: 28.3.a
    text: de portefeuille Politieorganisatie en -middelen en Staf;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel28
  - number: 28.3.b
    text: de portefeuille Politieel Beleid en Taakuitvoering;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel28
  - number: 28.3.c
    text: de portefeuille Veiligheidsregio’s, Crisisbeheersing en Meldkamer;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel28
  - number: 28.3.d
    text: het Landelijk Operationeel Coördinatie Centrum (LOCC);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel28
  - number: 28.3.e
    text: het korps politie Bonaire, Sint Eustatius en Saba;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel28
  - number: 28.3.f
    text: het brandweerkorps Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel28
  - number: '29.1'
    text: 'De portefeuille Politieorganisatie en -middelen en Staf is belast met:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel29
  - number: 29.1.a
    text: het invullen van het eigenaarschap ten opzichte van politie;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel29
  - number: 29.1.b
    text: het invullen van het werkgeverschap voor het politiepersoneel;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel29
  - number: 29.1.c
    text: |-
      het toezicht op de inrichting, de toerusting en het functioneren van de politieorganisatie alsmede haar
      effectiviteit;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel29
  - number: 29.1.d
    text: |-
      het beheer en de interne bedrijfsvoering, de coördinatie van parlementaire aangelegenheden, de coördinatie en
      afhandeling van burgerbrieven, bestuurlijke, juridische, operationele aangelegenheden en het management van
      incidenten.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel29
  - number: '29.2'
    text: 'De portefeuille Politieorganisatie en -middelen en Staf bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel29
  - number: 29.2.a
    text: de afdeling Financiën Bedrijfsvoering Kustwacht;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel29
  - number: 29.2.b
    text: de afdeling Politiepersoneel;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel29
  - number: 29.2.c
    text: de afdeling Staf en Bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel29
  - number: '30.1'
    text: 'De portefeuille Politieel Beleid en Taakuitvoering is belast met:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel30
  - number: 30.1.a
    text: het beleid inzake de primaire processen, taakuitvoering en bevoegdheden van de politie;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel30
  - number: 30.1.b
    text: internationale politiesamenwerking;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel30
  - number: 30.1.c
    text: |-
      het beheer van het korps politie Bonaire, Sint Eustatius en Saba en het brandweerkorps Bonaire, Sint Eustatius
      en Saba;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel30
  - number: 30.1.d
    text: het centraal beleggen van bestuurlijke informatie.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel30
  - number: '30.2'
    text: 'De portefeuille Politieel Beleid en Taakuitvoering bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel30
  - number: 30.2.a
    text: de afdeling Politiebestel, Bevoegdheden en Informatiefunctie;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel30
  - number: 30.2.b
    text: de afdeling Internationale en Caribische aangelegenheden;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel30
  - number: 30.2.c
    text: de afdeling Strategie en Beleid Politie.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel30
  - number: 31a.1
    text: 'De portefeuille Veiligheidsregio’s, Crisisbeheersing en Meldkamer is belast met het in samenspraak met de NCTV:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel31a
  - number: 31a.1.a
    text: |-
      onderhouden van het stelsel van decentrale crisisbeheersing (waaronder het stelsel van veiligheidsregio’s) en
      de aansluiting daarvan op het stelsel van nationale crisisbeheersing en op de afspraken met betrekking tot de
      internationale samenwerking;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel31a
  - number: 31a.1.b
    text: ontwikkelen van beleid gericht op risico- en crisisbeheersing op decentraal niveau;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel31a
  - number: 31a.1.c
    text: het beleid inzake de organisatie van de meldkamer;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel31a
  - number: 31a.1.d
    text: het beleid inzake het communicatiesysteem van de hulpdiensten.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel31a
  - number: 31a.2
    text: 'De portefeuille Veiligheidsregio’s, Crisisbeheersing en Meldkamer bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel31a
  - number: 31a.2.a
    text: de afdeling Veiligheidsregio’s en Crisisbeheersing;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel31a
  - number: 31a.2.b
    text: de afdeling Meldkamers, crisiscommunicatie en alerteren.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel31a
  - number: 31b.1
    text: |-
      Het Landelijk Operationeel Coördinatie Centrum (LOCC) maakt deel uit van de nationale
      crisisbesluitvormingsstructuur en draagt hierbij zorg voor het aanleveren van het multidisciplinair Landelijk
      Operationeel Beeld en het operationeel advies bij nationale en internationale incidenten, crises, rampen en
      grootschalige evenementen.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel31b
  - number: 31b.2
    text: |-
      Het LOCC coördineert regionale, nationale en internationale bijstand, met inbegrip van de bijstand, bedoeld in de
      [Wet veiligheidsregio’s][ref1] en de [Politiewet 2012][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0027466
      [ref2]: https://wetten.overheid.nl/BWBR0031788
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel31b
    references:
      - id: ref1
        bwb_id: BWBR0027466
      - id: ref2
        bwb_id: BWBR0031788
  - number: 31b.3
    text: |-
      Het LOCC draagt tevens, als zijnde de National Training Coördinator, zorg voor de coördinatie, opleiding en inzet
      van de Nederlandse experts in het kader van EU Civil Protection Mechanism.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel31b
  - number: 31b.4
    text: |-
      Het LOCC ondersteunt op verzoek van betrokken crisispartners bij regionale en bovenregionale incidenten, crises,
      rampen en grootschalige evenementen.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel31b
  - number: '32'
    text: |-
      Het korps politie Bonaire, Sint Eustatius en Saba (korps politie BES) is belast met de taken bedoeld in
      [artikel 5 van de Rijkswet politie van Curaçao, van Sint Maarten en van Bonaire, Sint Eustatius en Saba][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028079#Artikel5
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0028079
        artikel: '5'
  - number: '33'
    text: |-
      Het brandweerkorps Bonaire, Sint Eustatius en Saba (brandweerkorps BES) is belast met de taken bedoeld in
      [artikel 27, tweede lid][ref1], en [artikel 28, eerste lid, van de Veiligheidswet BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0028586#Artikel28
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '27'
      - id: ref2
        bwb_id: BWBR0028586
        artikel: '28'
  - number: '34.1'
    text: |-
      Het directoraat-generaal Rechtspleging en Rechtshandhaving (DGRR) is belast met het ontwikkelen, in opdracht geven
      dan wel uitvoeren en/of implementeren van het beleid voor:
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel34
  - number: 34.1.a
    text: het tegengaan van onveiligheid en criminaliteit;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel34
  - number: 34.1.b
    text: het scheppen van voorwaarden voor een goed functionerend rechtsbestel en een slagvaardige rechtspleging;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel34
  - number: 34.1.c
    text: het bewerkstelligen van een effectieve en professionele rechtshandhaving.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel34
  - number: '34.2'
    text: |-
      Voorts is het directoraat-generaal belast met de behandeling van uitvoeringsvraagstukken in de strafrechtketen waar
      een specifieke verantwoordelijkheid van de bewindspersoon aan de orde is.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel34
  - number: '34.3'
    text: 'Het directoraat-generaal bestaat uit de volgende dienstonderdelen:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel34
  - number: 34.3.a
    text: de directie Rechtshandhaving en Criminaliteitsbestrijding (DRC);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel34
  - number: 34.3.b
    text: de directie Rechtsbestel (DRb);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel34
  - number: 34.3.c
    text: de directie Advisering en Ondersteuning (DAO);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel34
  - number: 34.3.d
    text: de directie Juridische en Operationele Aangelegenheden (DJOA);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel34
  - number: 34.3.e
    text: de directie Veiligheid en Bestuur (DVB);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel34
  - number: 34.3.f
    text: de directie Strafrechtketen (DSK).
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel34
  - number: '35'
    text: De directeur-generaal Rechtspleging en Rechtshandhaving is beheersverantwoordelijk voor het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel35
  - number: '36.1'
    text: |-
      De directie Rechtshandhaving en Criminaliteitsbestrijding (DRC) bevordert en draagt bij aan een rechtvaardige,
      effectieve en integrale rechtshandhaving en criminaliteitsbestrijding (preventief en repressief) op lokaal,
      regionaal, nationaal en internationaal niveau. Binnen de rechtstatelijke kaders werkt de directie er aan mee om het
      opsporings- en vervolgingsapparaat zo goed als mogelijk in staat te stellen om zijn taak uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel36
  - number: '36.2'
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel36
  - number: 36.2.a
    text: de afdeling Strafrechtelijke Handhaving (SH);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel36
  - number: 36.2.b
    text: de afdeling Fraude en Bijzonder Strafrecht (FBS);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel36
  - number: 36.2.c
    text: de afdeling Cybercrime en Zeden (CZ).
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel36
  - number: '37.1'
    text: |-
      De directie Rechtsbestel (DRb) is belast met de organisatie, de instandhouding en de ontwikkeling van het
      rechtsbestel. Dit omvat in ieder geval de toegang tot het recht en de kwaliteit van het rechtsbestel ten behoeve
      van de waarborging van rechtsbescherming en rechtszekerheid. Hieronder wordt in ieder geval begrepen het stelsel
      van de rechterlijke organisatie, alsmede de volgende beleidsterreinen: rechtsbijstand, juridische vrije beroepen,
      alternatieve geschiloplossing, schuldsanering natuurlijke personen, tolken en vertalers en gegevensbescherming.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel37
  - number: '37.2'
    text: De directie is voorts belast met het beheer van de Hoge Raad der Nederlanden.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel37
  - number: '37.3'
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel37
  - number: 37.3.a
    text: de afdeling Strafrechtelijk Bestel & Arbeidsvoorwaarden (SBA);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel37
  - number: 37.3.b
    text: de afdeling Rechtspraak & Geschiloplossing (RG);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel37
  - number: 37.3.c
    text: de afdeling Toegang Rechtsbestel (TR);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel37
  - number: 37.3.d
    text: het Beleidsteam Privacy (BtP).
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel37
  - number: '38.1'
    text: |-
      De directie Advisering en Ondersteuning (DAO) is belast met financiële advisering aan en ondersteuning van de
      directeur-generaal Rechtspleging en Rechtshandhaving en de overige directies. Het adviseren omvat in ieder geval
      de financiële advisering ten aanzien van een aantal taakorganisaties, rechtspersonen met een wettelijke taak,
      zelfstandige bestuursorganen en organisaties en instellingen op het terrein van het directoraat-generaal.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel38
  - number: '38.2'
    text: |-
      De directeur-generaal Rechtspleging en Rechtshandhaving wordt secretarieel, organisatorisch en administratief
      ondersteund door de stafondersteuning, die is ondergebracht bij de directie Advisering en Ondersteuning.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel38
  - number: '38.3'
    text: |-
      De directie is tevens belast met het adviseren over en coördineren van alle staf- en interne bedrijfsvoeringstaken
      voor de directeur-generaal Rechtspleging en Rechtshandhaving en de beleidsdirecties van het directoraat-generaal.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel38
  - number: '38.4'
    text: De directie kent een afdeling Financiën.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel38
  - number: '39.1'
    text: |-
      De directie Juridische en Operationele Aangelegenheden (DJOA) is belast met de voorbereiding van beslissingen
      in individuele gevallen op het terrein van rechtspleging en rechtshandhaving met toepassing van bestaande
      regels en beleidskaders. De beslissingen hebben betrekking op bestuurlijk-juridische zaken, operationele
      zaken, rechtshulpverzoeken, benoemingen of incidenten. De directie levert op deze terreinen ook bijdragen aan
      beleidsvoorstellen.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel39
  - number: '39.2'
    text: |-
      De directie voert de regie en coördineert de inzet van alle betrokken dienstonderdelen en taakorganisaties bij
      de afdoening van incidenten waaraan politiek-bestuurlijke aspecten zijn verbonden. De directie ontwikkelt en
      onderhoudt daartoe de benodigde expertise en incidentenstrategie en organiseert de voorbereiding van het ministerie
      van crisisbeheersing in het kader van het nationaal handboek crisisbeheersing.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel39
  - number: '39.3'
    text: |-
      De directie fungeert als het juridisch expertisecentrum van het directoraat-generaal. De directie bewaakt de
      juridische kwaliteit van de diverse producten van het directoraat-generaal en beperkt de juridische risico’s en in
      voorkomende gevallen voor dienstonderdelen en organisaties, werkzaam op het terrein van het directoraat-generaal.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel39
  - number: '39.4'
    text: |-
      De directie is als Nederlandse centrale autoriteit voor internationale strafrechtelijke samenwerking
      belast met de voorbereiding en uitvoering van beslissingen van de bewindspersoon aangaande
      internationale rechtshulp in strafzaken en uitleveringen, met uitzondering van beslissingen inzake
      de overdracht en overname van de tenuitvoerlegging van vrijheidsstraffen en vrijheidsbenemende
      maatregelen op grond van de [Wet overdracht tenuitvoerlegging strafvonnissen][ref1] en de
      [Wet wederzijdse erkenning en tenuitvoerlegging vrijheidsbenemende en voorwaardelijke sancties][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004028
      [ref2]: https://wetten.overheid.nl/BWBR0031814
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0004028
      - id: ref2
        bwb_id: BWBR0031814
  - number: '39.5'
    text: |-
      De directie is voorts belast met de beantwoording van brieven van burgers alsmede parlementaire zaken op het
      terrein van het directoraat-generaal.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel39
  - number: '39.6'
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel39
  - number: 39.6.a
    text: de afdeling Juridische, Bestuurlijke en Operationele Zaken;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel39
  - number: 39.6.b
    text: de afdeling Internationale Aangelegenheden en Rechtshulp in Strafzaken;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel39
  - number: 39.6.c
    text: de afdeling Benoemingen, Burgercorrespondentie, Ondersteuning en Parlementaire zaken.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel39
  - number: '40.1'
    text: |-
      De directie Veiligheid en Bestuur (DVB) is belast met het faciliteren van het lokale bestuur en publieke en private
      partners om ten aanzien van maatschappelijke veiligheidsvraagstukken zijn eigen taken uit te voeren, relevante
      partners bijeen te brengen, kaders te maken, beleid en juridische instrumenten te ontwikkelen, financiële stimulans
      te bieden, kennis te ontwikkelen en te verspreiden, fenomenen te agenderen en waar nodig regie te voeren.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel40
  - number: '40.2'
    text: 'De directie bestaat uit een groot aantal pijlers, programma’s en projecten die vallen onder:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel40
  - number: 40.2.a
    text: de afdeling Integrale veiligheid (IV);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel40
  - number: 40.2.b
    text: de afdeling Bestuurlijke aanpak (BA);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel40
  - number: 40.2.c
    text: de afdeling Bestuurlijk Instrumentarium (BI).
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel40
  - number: '40.3'
    text: |-
      De directie is organisatorisch verantwoordelijk voor het Landelijk Expertise Centrum (LIEC). Het LIEC vormt samen
      met tien Regionale Informatie en Expertise Centra (RIEC’s) een landelijk werkend concern, dat vormgeeft aan een
      bestuurlijke en integrale aanpak van georganiseerde ondermijnende criminaliteit. Het LIEC valt beheersmatig onder
      de verantwoordelijkheid van de Stuurgroep LIEC.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel40
  - number: '41.1'
    text: 'De directie Strafrechtketen (DSK) is belast met:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel41
  - number: 41.1.a
    text: het bevorderen van de (digitale) ketensamenwerking binnen de strafrechtketen;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel41
  - number: 41.1.b
    text: de bestuurlijke informatievoorziening over de strafrechtketen;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel41
  - number: 41.1.c
    text: |-
      de administratieve en secretariële ondersteuning ten behoeve van de verschillende beraden binnen de
      strafrechtketen.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel41
  - number: '41.2'
    text: De directie kent een afdeling Keteninformatievoorziening (KIV).
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel41
  - number: '44.1'
    text: |-
      Het directoraat-generaal Migratie (DGM) is belast met het ontwikkelen, in opdracht geven dan wel uitvoeren en/of
      implementeren van het beleid voor:
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel44
  - number: 44.1.a
    text: |-
      het uitvoeren van de vreemdelingenwetgeving en van de [Rijkswet op het Nederlanderschap][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003738
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0003738
  - number: 44.1.b
    text: |-
      een gereglementeerde en beheerste toelating van vreemdelingen tot Nederland, een gereglementeerd en beheerst
      verblijf in en vertrek uit Nederland en een gereglementeerde en beheerste terugkeer van vreemdelingen;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel44
  - number: 44.1.c
    text: het voeren van de regie op de keten van toegang, toelating, toezicht en terugkeer van vreemdelingen;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel44
  - number: 44.1.d
    text: |-
      het adviseren van de regering over het vreemdelingenrecht en het -beleid en over het naturalisatie- en
      nationaliteitsrecht.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel44
  - number: '44.2'
    text: 'Het directoraat-generaal is voorts belast met:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel44
  - number: 44.2.a
    text: het voeren van regie op de keten van toegang, toelating, toezicht en terugkeer van vreemdelingen;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel44
  - number: 44.2.b
    text: |-
      het adviseren van de regering over het vreemdelingenrecht en het -beleid, en over het naturalisatie- en
      nationaliteitsrecht.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel44
  - number: '44.3'
    text: 'Het directoraat-generaal Migratie bestaat uit de volgende dienstonderdelen:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel44
  - number: 44.3.a
    text: de directie Migratiebeleid (DMB);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel44
  - number: 44.3.b
    text: de directie Regie Migratieketen (DRM);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel44
  - number: 44.3.c
    text: het bureau Internationaal Migratiebeleid (BIM);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel44
  - number: 44.3.d
    text: de programmadirectie Oekraïense Ontheemden;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel44
  - number: 44.3.e
    text: het secretariaat van de Adviesraad Migratie.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel44
  - number: '45.1'
    text: |-
      De directie Migratiebeleid (DMB) is belast met het ontwikkelen en implementeren van het beleid voor de zorg voor
      een gereglementeerde en beheerste toelating tot verblijf in en vertrek uit Nederland of terugkeer van vreemdelingen
      op een in nationaal en internationaal opzicht maatschappelijk verantwoorde wijze.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel45
  - number: '45.2'
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel45
  - number: 45.2.a
    text: de afdeling Toezicht, Regulier en Nationaliteit;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel45
  - number: 45.2.b
    text: de afdeling Asiel, Opvang en Terugkeer;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel45
  - number: 45.2.c
    text: de afdeling Juridische en Algemene Zaken.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel45
  - number: '46.1'
    text: |-
      De directie Regie Migratieketen (DRM) heeft tot taak de migratieketen in staat te stellen de
      [Vreemdelingenwet 2000][ref1] en het migratiebeleid snel en zorgvuldig uit te voeren en daarover verantwoording
      af te leggen door het als ketenregisseur ondersteunen van de bij de migratieketen aangesloten organisaties. De
      directie heeft binnen het cluster tevens een aantal ondersteunende taken, waaronder staf en bedrijfsvoering,
      en beheert als de Verantwoordelijke Autoriteit de Europese Migratie- en Veiligheidsfondsen van meerdere
      beleidsonderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: '46.2'
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel46
  - number: 46.2.a
    text: de afdeling Ketensturing;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel46
  - number: 46.2.b
    text: de afdeling Ketenvoorzieningen;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel46
  - number: 46.2.c
    text: de afdeling Analyse Proeftuin Migratieketen (APM);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel46
  - number: 46.2.d
    text: het bureau Bedrijfsvoering en Staf;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel46
  - number: 46.2.e
    text: het bureau Verantwoordelijke Autoriteit.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel46
  - number: 46a
    text: |-
      Het Bureau Internationaal Migratiebeleid (BIM) ontwikkelt en bewaakt het internationaal migratiebeleid, zorgt in
      dat kader voor overzicht, legt dwarsverbanden tussen de verschillende dossiers en coördineert de departementale,
      interdepartementale en internationale afstemming.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel46a
  - number: '47.1'
    text: |-
      De programmadirectie Oekraïense Ontheemden is belast met de interdepartementale coördinerende en integrale
      beleidsfunctie met betrekking tot de opvang van Oekraïense ontheemden, met als doel goede invulling te geven aan de
      rechten van Oekraïense ontheemden, die voortkomen uit de EU-Richtlijn Tijdelijke Bescherming (verblijf, onderwijs,
      zorg en werk). Deze Richtlijn loopt tot 4 maart 2025.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel47
  - number: '47.2'
    text: 'De programmadirectie Oekraïense Ontheemden is voorts belast met:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel47
  - number: 47.2.a)
    text: |-
      het zorgdragen voor de coördinatie van de bijzondere crisisbesluitvorming inzake ontheemden als bedoeld in artikel
      47, eerste lid;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel47
  - number: 47.2.b)
    text: |-
      het voeren van regie op de keten van registratie, plaatsing, opvang en repatriëring of bestendigd verblijf van
      ontheemden als bedoeld in artikel 47, eerste lid;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel47
  - number: 47.2.c)
    text: |-
      het monitoren van en rapporteren over de ontheemdenstromen uit Oekraïne en het maatschappelijk sentiment in
      Nederland om te komen tot bijdragen aan het creëren van maatschappelijk draagvlak en een behoeftestelling richting
      uitvoerende organisaties en beleidsverantwoordelijke ministeries;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel47
  - number: 47.2.d)
    text: het voorbereiden en coördineren van de afbouw van activiteiten wanneer dat aan de orde is.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel47
  - number: '47.3'
    text: 'De programmadirectie Oekraïense Ontheemden bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel47
  - number: 47.3.a
    text: de afdeling Beleid;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel47
  - number: 47.3.b
    text: de afdeling Staf en Bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel47
  - number: 47.3.c
    text: de afdeling Externe Betrekkingen;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel47
  - number: 47.3.d
    text: de afdeling Opdrachtgeverschap, Financiën en Informatievoorziening.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel47
  - number: '49.1'
    text: Het secretariaat van de Adviesraad Migratie is belast met de ambtelijke ondersteuning van die commissie.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel49
  - number: '49.2'
    text: 'Het secretariaat bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel49
  - number: 49.2.a
    text: het procescluster Advisering;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel49
  - number: 49.2.b
    text: het procescluster Informatie en Documentatie;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel49
  - number: 49.2.c
    text: het procescluster Bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel49
  - number: 49a.1
    text: |-
      De programmadirecteur-generaal Ondermijning (DGO) zet zich samen met een brede maatschappelijke coalitie in voor de
      aanpak van ondermijning en is daartoe belast met de volgende hoofdtaken:
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel49a
  - number: 49a.1.a
    text: |-
      het coördineren, aanjagen, versterken, ontwikkelen van beleid, zorgen voor benodigde wetgeving van de aanpak van
      georganiseerde ondermijnende criminaliteit en voert daarbij de regie op de afpakketen en het afpakken van crimineel
      vermogen.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel49a
  - number: 49a.1.b
    text: het adviseren van de regering over integraal ondermijningsbeleid.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel49a
  - number: 49a.1.c
    text: |-
      samen met partners inzetten voor het bestendigen van de aanpak van georganiseerde ondermijnende criminaliteit op de
      langere termijn.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel49a
  - number: 49a.2
    text: 'De programmadirecteur-generaal Ondermijning wordt bij de uitvoering van de hoofdtaken ondersteund door:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel49a
  - number: 49a.2.a
    text: de programmadirecteur Criminele Geldstromen, tevens plaatsvervangend programmadirecteur-generaal;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel49a
  - number: 49a.2.b
    text: de programmadirecteur Ondermijning.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel49a
  - number: 49a.3
    text: De DGO wordt hierbij secretarieel, organisatorisch en administratief ondersteund door de stafondersteuning.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel49a
  - number: 49b.1
    text: |-
      Het programmadirectoraat-generaal Samenleving en COVID-19 is belast met de navolgende taken en daarmee
      samenhangende activiteiten:
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel49b
  - number: 49b.1.a
    text: Monitoren van (middel)lange termijn trajecten met COVID-19 karakter bij departementen;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel49b
  - number: 49b.1.b
    text: |-
      Monitoren ontwikkelingen in de samenleving als gevolg van de crisis, zowel maatschappelijk als sociaaleconomisch
      van aard (dashboard);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel49b
  - number: 49b.1.c
    text: Verkennen samenleving tijdens en na Corona aan de hand van lange termijn (interdepartementale) beleidsthema’s;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel49b
  - number: 49b.1.d
    text: Zorgen voor handelingsperspectief middellange termijn aanpak COVID-19-crisis;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel49b
  - number: 49b.1.e
    text: |-
      Evaluatie en verantwoording (interdepartementale coördinatie en regie met betrekking tot het afhandelen van
      verzoeken als bedoeld in [artikel 4.1, eerste lid, Wet open overheid][ref1], evaluatie en onderzoek, parlementaire
      verantwoording en archivering);


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel4
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel49b
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '4'
  - number: 49b.2
    text: |-
      Het programmadirectoraat-generaal Samenleving en COVID-19 bestaat uit een programmadirecteur-generaal Samenleving
      en COVID-19, een stafbureau en de volgende programmadirecties:
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel49b
  - number: 49b.2.a
    text: de programmadirectie Strategie en Kennis COVID-19(SKC-19);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel49b
  - number: 49b.2.b
    text: de programmadirectie Evaluatie en Verantwoording (DEV);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel49b
  - number: 49b.3
    text: |-
      De programmadirecteur-generaal Samenleving en COVID-19 is het hoofd van het programmadirectoraat-generaal en kan de
      in het tweede lid genoemde programmadirecties en het stafbureau nader onderverdelen.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel49b
  - number: 49c
    text: |-
      De programmadirectie Strategie en Kennis COVID-19 is belast met het verkennen van de samenleving tijdens en na
      Corona aan de hand van lange termijn (interdepartementale) beleidsthema’s en het zorgen voor handelingsperspectief
      middellange termijn aanpak COVID-19-crisis.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel49c
  - number: 49d
    text: |-
      De programmadirectie Evaluatie en Verantwoording is belast met de voorbereiding en interdepartementale coördinatie
      van (externe) onderzoeken en verantwoording.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel49d
  - number: 49e
    text: |-
      Het stafbureau is belast met het monitoren van (middel)lange termijn trajecten met COVID-19 karakter bij
      departementen en met het monitoren van ontwikkelingen in de samenleving als gevolg van de crisis, zowel
      maatschappelijk als sociaaleconomisch van aard (dashboard). Daarnaast zorgt het stafbureau voor de ondersteuning
      van de programmadirecteur-generaal, de directeuren en het Managementteam en voor de inbreng van stukken vanuit het
      DGSC-19 in DOC-19, ACC-19, MCC-19, voor zover dit de taken betreft van het DG.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel49e
  - number: '50.1'
    text: |-
      De Nationaal Coördinator Terrorismebestrijding en Veiligheid (NCTV) heeft tot taak het versterken van de nationale
      veiligheid en het voorkomen van maatschappelijke ontwrichting door dreigingen voor de vitale belangen van de
      samenleving te identificeren en de weerbaarheid en bescherming van die vitale belangen te versterken. Hiertoe
      verricht de NCTV in het bijzonder activiteiten die zijn gericht op:
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel50
  - number: 50.1.a
    text: |-
      het bevorderen van de identificatie en de analyse van dreigingen en risico's op het gebied van terrorisme en
      nationale veiligheid;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel50
  - number: 50.1.b
    text: 'het reduceren van kansen of effecten van de genoemde dreigingen en risico’s door:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel50
  - number: 50.1.b.i
    text: het verhogen van weerbaarheid van vitale belangen;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel50
  - number: 50.1.b.ii
    text: |-
      het zorgdragen voor een samenhangend crisisbeheersingsbeleid op nationaal niveau en voor een adequaat functioneren
      van het stelsel van nationale crisisbeheersing inclusief de aansluiting daarvan op het beleid en het stelsel van
      decentrale crisisbeheersing en op de afspraken met betrekking tot de internationale samenwerking;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel50
  - number: 50.1.c
    text: |-
      het zorgdragen voor de coördinatie van de bescherming van de vitale infrastructuur en voor een integrale aanpak van
      dreigingen voor de nationale veiligheid;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel50
  - number: 50.1.d
    text: het nemen van beschermingsmaatregelen ten aanzien van daartoe aangewezen bijzondere personen, objecten en diensten;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel50
  - number: 50.1.e
    text: het adequaat functioneren van het stelsel van bewaken en beveiligen;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel50
  - number: 50.1.f
    text: het zorgdragen voor de coördinatie van de nationale crisisbesluitvorming;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel50
  - number: 50.1.g
    text: |-
      de strategieontwikkeling rond cyber security en het bevorderen van de publiek-private samenwerking op het gebied
      van cyber security en het voorzien in het secretariaat van de Cyber Security Raad.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel50
  - number: '50.2'
    text: 'De Nationaal Coördinator Terrorismebestrijding en Veiligheid bestaat uit de volgende dienstonderdelen:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel50
  - number: 50.2.a
    text: de portefeuille Contraterrorisme en Beveiliging Burgerluchtvaart;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel50
  - number: 50.2.b
    text: de portefeuille Cybersecurity, Weerbaarheid Statelijke Dreigingen en Economische Veiligheid;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel50
  - number: 50.2.c
    text: de portefeuille Nationale Crisisbeheersing;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel50
  - number: 50.2.d
    text: de portefeuille Bewaken en Beveiligen;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel50
  - number: 50.2.e
    text: de portefeuille Strategie, Analyse Nationale Veiligheid en Bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel50
  - number: 50.2.f
    text: het secretariaat van de Cyber Security Raad.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel50
  - number: '51.1'
    text: De NCTV legt inhoudelijk direct verantwoording af aan de bewindspersoon.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel51
  - number: '51.2'
    text: De NCTV wordt hierbij secretarieel, organisatorisch en administratief ondersteund door de stafondersteuning.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel51
  - number: '52.1'
    text: 'De portefeuille Contraterrorisme en Beveiliging Burgerluchtvaart heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel52
  - number: 52.1.a
    text: |-
      het ontwikkelen, implementeren, uitvoeren, coördineren, evalueren van en communiceren over het beleid en de
      maatregelen inzake het contraterrorisme en het tegengaan van extremisme;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel52
  - number: 52.1.b
    text: |-
      het versterken van de samenwerking en verbinden van nationale en internationale partners in de integrale aanpak van
      terrorisme en extremisme;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel52
  - number: 52.1.c
    text: |-
      het coördineren, evalueren en adviseren inzake de lokale aanpak van terrorisme, extremisme en andere
      veiligheidsdreigingen, alsmede het met het oog op de bescherming van de nationale veiligheid uitvoeren van en
      adviseren over de uitvoering van wettelijke regelingen ten behoeve van maatregelen ter voorkoming of aanpak van
      terrorisme en extremisme;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel52
  - number: 52.1.d
    text: |-
      het ontwikkelen, implementeren, coördineren, evalueren van en communiceren over het beleid inzake de beveiliging
      van de burgerluchtvaart en het signaleren en detecteren van reisbewegingen in relatie tot terrorisme en ernstige
      criminaliteit, waaronder de beleids- en financieringsverantwoordelijkheid en het opdrachtgeverschap van de
      Passagiersinformatie-eenheid Nederland (Pi-NL) en de sturing alsmede ontwikkeling van de (verdere) inrichting van
      de technische voorziening Travel Information Portal (TRIP);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel52
  - number: 52.1.e
    text: |-
      het coördineren, implementeren en evalueren van en communiceren over het beleid en, de maatregelen op het terrein
      van de beveiliging van de burgerluchtvaart, waaronder het geven van aanwijzingen aan de Koninklijke marechaussee en
      de luchtvaartsector op basis van de [Luchtvaartwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002267
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0002267
  - number: '52.2'
    text: 'De portefeuille bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel52
  - number: 52.2.a
    text: de Afdeling Contraterrorisme 1;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel52
  - number: 52.2.b
    text: de Afdeling Contraterrorisme 2;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel52
  - number: 52.2.c
    text: de Afdeling Beveiliging Burgerluchtvaart.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel52
  - number: '53.1'
    text: |-
      De portefeuille Cybersecurity, Weerbaarheid Statelijke Dreigingen en Economische Veiligheid heeft de volgende
      taken:
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel53
  - number: 53.1.a
    text: |-
      het coördineren, ontwikkelen, implementeren, uitvoeren, evalueren van en communiceren over het beleid en de
      maatregelen inzake dreigingen van statelijke actoren;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel53
  - number: 53.1.b
    text: het zorgdragen voor de coördinatie van de bescherming van de vitale infrastructuur;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel53
  - number: 53.1.c
    text: |-
      het zorgdragen voor een integrale aanpak van dreigingen voor de nationale veiligheid alsmede het invulling geven
      aan de strategie ter borging van de nationale veiligheid;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel53
  - number: 53.1.d
    text: |-
      het coördineren, ontwikkelen en evalueren van het beleid en de maatregelen inzake cyber security, waaronder de
      uitvoering van de Nederlandse Cyber Security Agenda.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel53
  - number: '53.2'
    text: 'De portefeuille bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel53
  - number: 53.2.a
    text: de Afdeling Weerbaarheid Statelijke Dreigingen en Economische Veiligheid;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel53
  - number: 53.2.b
    text: de Afdeling Cybersecurity.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel53
  - number: '54.1'
    text: 'De portefeuille Nationale Crisisbeheersing heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel54
  - number: 54.1.a
    text: |-
      het ontwikkelen van crisisbeheersingsbeleid op nationaal niveau, waaronder het onderhouden van het stelsel van
      nationale crisisbeheersing en het, in samenspraak met het directoraat-generaal Politie en Veiligheidsregio’s,
      zorgdragen voor de aansluiting daarvan op het beleid en het stelsel van decentrale crisisbeheersing en op de
      afspraken met betrekking tot de internationale samenwerking;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel54
  - number: 54.1.b
    text: |-
      het zorg dragen voor rijksbrede crisiscoördinatie en het faciliteren, adviseren en coördineren bij grote
      evenementen met een potentieel veiligheidsrisico;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel54
  - number: 54.1.c
    text: |-
      het zorg dragen voor de ondersteunende communicatie ten behoeve van de taakuitoefening van de NCTV en voor het
      ontwikkelen en uitvoeren van de rijksbrede crisiscommunicatie.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel54
  - number: '54.2'
    text: 'De portefeuille bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel54
  - number: 54.2.a
    text: het Nationaal Crisiscentrum;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel54
  - number: 54.2.b
    text: de Afdeling Communicatie.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel54
  - number: 54a.1
    text: 'De portefeuille Bewaken en Beveiligen heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel54a
  - number: 54a.1.a
    text: |-
      het coördineren, ontwikkelen en evalueren van het beleid inzake het nationaal stelsel van bewaken en beveiligen en
      het stelsel van speciale eenheden;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel54a
  - number: 54a.1.b
    text: |-
      het uitvoeren van het nationaal stelsel van bewaken en beveiligen, het stelsel van speciale eenheden en de
      procedure Renegade.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel54a
  - number: 54a.2
    text: De portefeuille bestaat uit de afdeling Coördinatie Bewaken en Beveiligen.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel54a
  - number: '55.1'
    text: 'De portefeuille Strategie, Analyse Nationale Veiligheid en Bedrijfsvoering heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel55
  - number: 55.1.a
    text: |-
      de strategische advisering over alle aangelegenheden die het werkterrein van de NCTV betreffen, de coördinatie en
      procesbewaking van algemene parlementaire aangelegenheden, de voorbereiding van interdepartementale en politiek-
      bestuurlijke besluitvorming alsmede van bestuurlijke besluitvorming, en de uitvoering van de decentrale juridische
      functie ten behoeve van de NCTV;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel55
  - number: 55.1.b
    text: de voorbereiding van de internationale en Europese beleidsvorming op het gebied van de NCTV;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel55
  - number: 55.1.c
    text: |-
      het in samenwerking en in overleg met andere partijen binnen en buiten de NCTV verrichten en aanleveren van
      analyses van dreigingen en risico’s ten behoeve van de werkzaamheden van de NCTV en de werkzaamheden van
      veiligheidspartners, alsmede het opstellen van het actuele dreigings- en incidentenbeeld en de omgevingsanalyse ten
      behoeve van de nationale crisisbesluitvorming;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel55
  - number: 55.1.d
    text: |-
      de ondersteuning van de NCTV op het gebied van de bedrijfsvoering en facilitaire zaken, in het bijzonder
      betreffende personeelsaangelegenheden, ICT en informatiemanagement, huisvesting, beveiliging en financiële
      advisering;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel55
  - number: 55.1.e
    text: |-
      het organiseren, faciliteren en stimuleren van de opleiding en de persoonlijke ontwikkeling van NCTV-medewerkers
      alsmede het organiseren, faciliteren en stimuleren van het ontwikkelen, benutten en borgen van kennis die relevant
      is voor de taakuitoefening van de NCTV.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel55
  - number: '55.2'
    text: 'De portefeuille bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel55
  - number: 55.2.a
    text: de Afdeling Strategie, Staf en Juridische zaken;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel55
  - number: 55.2.b
    text: de Afdeling Analyse Nationale Veiligheid;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel55
  - number: 55.2.c
    text: de Afdeling Bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel55
  - number: 55.2.d
    text: de NCTV Academie.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel55
  - number: '56'
    text: |-
      Het secretariaat van de Cyber Security Raad is belast met het verzorgen van de secretariële taken ten behoeve van
      de Cyber Security Raad, genoemd in [artikel 2 van het Instellingsbesluit Cyber Security Raad][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031950#Artikel2
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0031950
        artikel: '2'
  - number: '60.1'
    text: 'De Inspectie Justitie en Veiligheid (IJenV) is belast met:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel60
  - number: 60.1.a
    text: 'toezichtstaken op het terrein van het ministerie en heeft daartoe de volgende hoofdtaken:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel60
  - number: 60.1.a.i
    text: |-
      het houden van toezicht op de uitvoering en de naleving van de wet- en regelgeving op het terrein van het
      ministerie en van wet- en regelgeving op andere daartoe bij of krachtens de wet aangewezen beleidsterreinen;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel60
  - number: 60.1.a.ii
    text: |-
      het gevraagd en ongevraagd verstrekken van inlichtingen en adviezen aan de bewindspersoon over onderwerpen die
      hem aangaan;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel60
  - number: 60.1.a.iii
    text: het vervullen van andere door de bewindspersoon aan de Inspectie opgedragen toezichtstaken.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel60
  - number: 60.1.b
    text: |-
      de handhavingstaken bedoeld in [hoofdstuk 9 van de Jeugdwet][ref1] met uitzondering van het geven
      en handhaven van een schriftelijke aanwijzing, als bedoeld in [artikel 9.3, eerste lid][ref2], en
      [artikel 9.5 van de Jeugdwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel9
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0034925
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '9'
  - number: '60.2'
    text: 'De IJenV bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel60
  - number: 60.2.a
    text: De directie Strategie, Kwaliteit en Bedrijfsvoering (SKenB);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel60
  - number: 60.2.b
    text: De directie Beschermen, Straffen en Handhaving (BSH);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel60
  - number: 60.2.c
    text: De directie Politie, Security en Crisisbeheersing (PSenC).
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel60
  - number: '60.3'
    text: De inspecteur-generaal is het hoofd van de IJenV.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel60
  - number: '61.1'
    text: |-
      De directie Strategie, Kwaliteit en Bedrijfsvoering (SKenB) is belast met de strategische en juridische advisering,
      communicatie, kwaliteitsmanagement, bedrijfsvoering en ondersteuning van de toezichtdirecties en de eigen directie.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel61
  - number: '61.2'
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel61
  - number: 61.2.a
    text: De afdeling Strategie en Communicatie;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel61
  - number: 61.2.b
    text: De afdeling Kennis en Kwaliteitscentrum;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel61
  - number: 61.2.c
    text: De afdeling Bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel61
  - number: '62.1'
    text: |-
      De directies Beschermen, Straffen en Handhaving (BSH) en Politie, Security en Crisisbeheersing (PSenC) zijn belast
      met de uitvoering van de toezichtstaken conform het meerjarenperspectief, het werkprogramma en andere voorkomende
      toezichtstaken.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel62
  - number: '62.2'
    text: Een hoofdinspecteur-directeur is het hoofd van de betreffende directie.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel62
  - number: '62.3'
    text: |-
      De directie Beschermen, Straffen en Handhaving (BSH) is tevens belast met de uitvoering van handhavingstaken
      ingevolge de [Wet experiment gesloten coffeeshopketen][ref1] en de daarop gebaseerde regelgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0042818
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0042818
  - number: '62.4'
    text: 'De directie Beschermen, Straffen en Handhaving (BSH) bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel62
  - number: 62.4.a
    text: De afdeling Beschermen;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel62
  - number: 62.4.b
    text: De afdeling Straffen;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel62
  - number: 62.4.c
    text: De afdeling Handhaving.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel62
  - number: '62.5'
    text: 'De directie Politie, Security en Crisisbeheersing (PSenC) bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel62
  - number: 62.5.a
    text: De afdeling Politie en Security;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel62
  - number: 62.5.b
    text: De afdeling Crisisbeheersing en Cyber.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel62
  - number: 63a.1
    text: |-
      De Dienst Terugkeer en Vertrek (DT&V) is als taakorganisatie belast met de uitvoering van de vreemdelingenwetgeving
      ten aanzien van vertrek en uitzetting.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63a
  - number: 63a.2
    text: 'De dienst bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63a
  - number: 63a.2.a
    text: de directie Internationale aangelegenheden;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63a
  - number: 63a.2.b
    text: de directie Ondersteuning en Voorbereiden Terugkeer;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63a
  - number: 63a.2.c
    text: de directie Toezicht en Maatregelen;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63a
  - number: 63a.2.d
    text: de directie Strategisch Advies en Juridische Zaken;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63a
  - number: 63a.2.e
    text: de directie Bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63a
  - number: 63b.1
    text: |-
      Binnen het stelsel van informatievoorziening voor de justitiële ketens beheert Justid onder meer de
      strafrechtsketendatabank (SKDB), als bedoeld in [artikel 27b, vierde lid, van het Wetboek van Strafvordering][ref1],
      en de centrale voorziening voor de justitiële documentatie en documentatie persoonsdossiers, als bedoeld in
      [artikel 2][ref2] en [artikel 40 van de Wet justitiële en strafvorderlijke gegevens][ref3] en aangeduid als
      Justitieel Documentatie Systeem (JDS).


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel27b
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0014194#Artikel40
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63b
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 27b
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0014194
        artikel: '40'
  - number: 63b.2
    text: |-
      Justid is de Matching Autoriteit bij het vaststellen van het integer en integraal persoonsbeeld van justitiabelen
      en is aangewezen als Centrale Autoriteit voor Nederland ten behoeve van de uitwisseling van strafregistergegevens
      met de lidstaten van de Europese Unie en het Verenigd Koninkrijk.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63b
  - number: 63b.3
    text: |-
      Justid levert, beheert en ondersteunt ketendiensten en -voorzieningen voor informatiedeling en duurzame
      archivering, waaronder:
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63b
  - number: 63b.3.a
    text: |-
      het Centraal Informatiepunt Onderzoek Telecommunicatie (CIOT), als bedoeld in
      [artikel 2 van het Besluit verstrekking gegevens telecommunicatie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011123#Artikel2
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63b
    references:
      - id: ref1
        bwb_id: BWBR0011123
        artikel: '2'
  - number: 63b.3.b
    text: |-
      het centraal elektronisch systeem, als bedoeld in [artikel 3:267i van de Wet op het financieel toezicht][ref1] en
      aangeduid als Verwijzingsportaal Bankgegevens (VB);


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 63b.3.c
    text: |-
      de Collectieve Opdracht Routeervoorziening (CORV), als bedoeld in
      [artikel 2 van het Besluit justitiële keteninformatisering Jeugdwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035936#Artikel2
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63b
    references:
      - id: ref1
        bwb_id: BWBR0035936
        artikel: '2'
  - number: 63b.3.d
    text: |-
      de centrale bewaarplaats voor de dubbelen van de akten van de burgerlijke stand, als bedoeld in
      [artikel 30 van het Besluit Burgerlijke Stand 1994][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006493#Artikel30
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63b
    references:
      - id: ref1
        bwb_id: BWBR0006493
        artikel: '30'
  - number: 63b.3.e
    text: de technische voorziening Travel Information Portal (TRIP);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63b
  - number: 63b.3.f
    text: |-
      de gemeenschappelijke basisdienst Centraal Digitaal Depot (CDD+), met de functie van e-depot binnen het Ministerie
      van Justitie en Veiligheid.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63b
  - number: 63b.4
    text: |-
      Bij het oplossen van informatievraagstukken binnen het justitiële en veiligheidsdomein, treedt Justid op als
      kennis- en innovatiecentrum en ontwikkelt Justid nieuwe producten en diensten.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63b
  - number: 63c.1
    text: |-
      De raad voor de kinderbescherming (RvdK) is belast met de bij of krachtens wet opgedragen taken. Deze taken
      omvatten onder meer dat de raad onderzoek doet naar het belang en de positie van het kind in beschermingszaken,
      strafzaken en gezag- en omgangszaken.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63c
  - number: 63c.2
    text: De raad adviseert in juridische procedures en kan om kinderbeschermingsmaatregelen verzoeken bij een rechtbank.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63c
  - number: 63c.3
    text: |-
      De raad coördineert de tenuitvoerlegging van taakstraffen na ontvangst van de last daartoe, voert casusregie in
      strafzaken en de tenuitvoerlegging van strafrechtelijke beslissingen van jeugdigen, en doet onderzoeken ten behoeve
      van het verkrijgen van een beginseltoestemming voor interlandelijke adoptie.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63c
  - number: 63d.1
    text: 'Het Centraal Justitieel Incassobureau (CJIB) is belast met:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63d
  - number: 63d.1.a
    text: |-
      de tenuitvoerlegging van de [Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref1], waaronder in
      ieder geval wordt verstaan de inning, de gerechtelijke incasso en de toepassing van wettelijke dwangmiddelen en het
      beheer en verwerking van dienaangaande gegevens;


      [ref1]: https://wetten.overheid.nl/BWBR0004581
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63d
    references:
      - id: ref1
        bwb_id: BWBR0004581
  - number: 63d.1.b
    text: |-
      de coördinatie van de persoonsgerichte tenuitvoerlegging van alle strafrechtelijke beslissingen als operationeel
      ketenregisseur, alsmede het beheer en de verwerking van dienaangaande gegevens. Het CJIB voorziet de gerechten
      als bedoeld in [artikel 2 van de Wet op de rechterlijke organisatie][ref1], het openbaar ministerie en de met de
      tenuitvoerlegging belaste organisaties van informatie over de tenuitvoerlegging van strafrechtelijke beslissingen;


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel2
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63d
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '2'
  - number: 63d.1.c
    text: |-
      de afhandeling van verzoeken van slachtoffers en nabestaanden om vertaling
      tijdens de tenuitvoerlegging van strafrechtelijke beslissingen als bedoeld in
      [artikel 51ca, vijfde lid, derde volzin, van het Wetboek van Strafvordering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel51ca
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63d
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 51ca
  - number: 63d.1.d
    text: |-
      de tenuitvoerlegging van strafrechtelijke beslissingen inhoudende geldelijke sancties, waaronder in ieder geval
      wordt verstaan de inning, de gerechtelijke incasso en de toepassing van wettelijke dwangmiddelen, vervangende
      hechtenis en het beheer en de verwerking van dienaangaande gegevens;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63d
  - number: 63d.1.e
    text: |-
      de ondersteuning van het openbaar ministerie bij strafrechtelijke en administratiefrechtelijke beslissingen en voor
      zover dit door het openbaar ministerie van het CJIB wordt verlangd;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63d
  - number: 63d.1.f
    text: het verrichten van incassowerkzaamheden voor de door de bewindspersoon aangewezen onderdelen van het Rijk;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63d
  - number: 63d.1.g
    text: het verrichten van inning- en of incassowerkzaamheden ter ondersteuning van het Rijk;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63d
  - number: 63d.1.h
    text: het verrichten van door de bewindspersoon aangewezen andere werkzaamheden ter ondersteuning van het Rijk;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63d
  - number: 63d.1.i
    text: |-
      het voorzien van informatie aan de ter zake bevoegde autoriteiten belast met de overname
      en overdracht van strafrechtelijke beslissingen van en aan het buitenland ten behoeve van
      de tenuitvoerlegging. Tevens ondersteunt het CJIB de officier van justitie als bedoeld in
      __REF000___________________________________________________________________________________________________________
      ________________________;


      [ref1]: https://wetten.overheid.nl/BWBR0022793#Artikel1
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63d
    references:
      - id: ref1
        bwb_id: BWBR0022793
        artikel: '1'
  - number: 63d.1.j
    text: |-
      het verzoeken om weigering of vervallenverklaring van reisdocumenten als bedoeld in
      [artikel 18, tweede lid, van de Paspoortwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel18
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63d
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '18'
  - number: 63d.1.k
    text: |-
      het inwinnen van informatie bij slachtoffers, nabestaanden en andere relevante personen ten behoeve van de
      tenuitvoerlegging van gevangenisstraffen;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63d
  - number: 63d.1.l
    text: |-
      het doen van mededelingen over de tenuitvoerlegging van tijdelijke gevangenisstraffen aan andere relevante
      personen;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63d
  - number: 63d.1.m
    text: |-
      het doen van mededelingen over de tenuitvoerlegging van levenslange gevangenisstraffen aan slachtoffers en
      nabestaanden.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63d
  - number: 63d.2
    text: Een nadere uitwerking van de taken van het CJIB is opgenomen in een takenbesluit van het CJIB.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63d
  - number: 63e
    text: |-
      De Dienst JUSTIS is belast met nemen van besluiten en verwerken van informatie ter bevordering van een betrouwbare,
      veilige en rechtvaardige samenleving in sectoren met kwetsbare belangen.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63e
  - number: 63f.1
    text: |-
      De Dienst Justitiële Inrichtingen (DJI) is belast met het tenuitvoerleggen van vrijheidsstraffen en
      vrijheidsbenemende maatregelen en met het voorbereiden van de aan de zorg van de bewindspersoon toevertrouwde
      personen op hun succesvolle terugkeer naar de maatschappij, binnen of buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63f
  - number: 63f.2
    text: |-
      De DJI is tevens belast met het behandelen van rechtshulpverzoeken inzake de overdracht
      en overname van de tenuitvoerlegging van vrijheidsstraffen en vrijheidsbenemende
      maatregelen op grond van de [Wet overdracht tenuitvoerlegging strafvonnissen][ref1] en de
      [Wet wederzijdse erkenning en tenuitvoerlegging vrijheidsbenemende en voorwaardelijke sancties][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004028
      [ref2]: https://wetten.overheid.nl/BWBR0031814
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63f
    references:
      - id: ref1
        bwb_id: BWBR0004028
      - id: ref2
        bwb_id: BWBR0031814
  - number: 63g
    text: |-
      De Immigratie- en Naturalisatiedienst (IND) is belast met de uitvoering van de vreemdelingenwetgeving en van de
      [Rijkswet op het Nederlanderschap][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003738
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63g
    references:
      - id: ref1
        bwb_id: BWBR0003738
  - number: 63h.1
    text: |-
      Het Nederlands Forensisch Instituut (NFI) is met het oog op de waarheidsvinding in strafzaken belast met de
      volgende kerntaken:
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h
  - number: 63h.1.a
    text: |-
      het verrichten van onafhankelijk forensisch zaakonderzoek op overwegend technisch, medisch-biologisch en
      natuurwetenschappelijk gebied en het ter zake daarvan uitbrengen van verslag;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h
  - number: 63h.1.b
    text: |-
      het ontwikkelen en implementeren van nieuwe onderzoeksmethoden en technieken ter bevordering van kennis op het
      gebied van forensisch onderzoek;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h
  - number: 63h.1.c
    text: het zijn van een nationaal en internationaal kennis- en expertisecentrum op het gebied van forensisch onderzoek.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h
  - number: 63h.2
    text: |-
      Het NFI is voorts belast met de door de bewindspersoon aangewezen taken zoals bepaald
      [artikel 1, tweede lid][ref1], en [artikel 3 van de Regeling taken NFI][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031558#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0031558#Artikel3
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h
    references:
      - id: ref1
        bwb_id: BWBR0031558
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0031558
        artikel: '3'
  - number: 63h.3.a
    text: |-
      Bij de uitvoering van de kerntaken, als bedoeld in [artikel 1, eerste lid, van de Regeling taken NFI][ref1] levert
      het NFI producten dan wel diensten aan het openbaar ministerie, de zittende magistratuur, de politie, de bijzondere
      opsporingsdiensten en het ministerie;


      [ref1]: https://wetten.overheid.nl/BWBR0031558#Artikel1
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h
    references:
      - id: ref1
        bwb_id: BWBR0031558
        artikel: '1'
  - number: 63h.3.b
    text: |-
      Bij de uitvoering van de taken als bedoeld in [artikel 1, tweede lid, van de Regeling taken NFI][ref1] kan het
      NFI producten of diensten leveren aan in [artikel 2, tweede, derde en vierde lid van de Regeling taken NFI][ref2],
      genoemde personen en instanties.


      [ref1]: https://wetten.overheid.nl/BWBR0031558#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0031558#Artikel2
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h
    references:
      - id: ref1
        bwb_id: BWBR0031558
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0031558
        artikel: '2'
  - number: 63h1.1
    text: |-
      Het Nationaal Cyber Security Centrum (NCSC) is, met het oog op het voorkomen en beperken van maatschappelijke
      ontwrichting door cyberdreigingen en -incidenten en het versterken van de digitale weerbaarheid van de samenleving,
      belast met:
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h1
  - number: 63h1.1.a
    text: |-
      het informeren, adviseren en bijstaan van de rijksoverheid en vitale aanbieders in geval van dreigingen en
      incidenten met betrekking tot hun netwerk- en informatiesystemen;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h1
  - number: 63h1.1.b
    text: het informeren van anderen over de in onderdeel a bedoelde dreigingen en incidenten;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h1
  - number: 63h1.1.c
    text: |-
      het ten behoeve van de in de onderdelen a en b genoemde taken verrichten van analyses en technisch onderzoek naar
      aanleiding van cyberdreigingen en -incidenten;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h1
  - number: 63h1.1.d
    text: |-
      het aan anderen verstrekken van bij de in onderdeel c genoemde analyses verkregen informatie over dreigingen en
      incidenten betreffende andere netwerk- en informatiesystemen;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h1
  - number: 63h1.1.e
    text: de taken van het centraal contactpunt, bedoeld in de Wet beveiliging netwerk- en informatiesystemen;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h1
  - number: 63h1.1.f
    text: het bevorderen en voeren van het secretariaat van de publiek-private samenwerking op het gebied van cyber security.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h1
  - number: 63h1.2
    text: 'Het NCSC bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h1
  - number: 63h1.2.a
    text: de unit Operatie;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h1
  - number: 63h1.2.b
    text: de unit Samenwerking en Kennisuitwisseling;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h1
  - number: 63h1.2.c
    text: de unit Informatievoorziening en Techniek;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h1
  - number: 63h1.2.d
    text: de afdeling Staf.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h1
  - number: 63h2.1
    text: 'Het Wetenschappelijk Onderzoek- en Datacentrum (WODC) is belast met:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h2
  - number: 63h2.1.a
    text: |-
      het verrichten van onderzoek en het doen verrichten van onderzoek, waaronder het evalueren van beleid en
      beleidsprogramma’s;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h2
  - number: 63h2.1.b
    text: het adviseren over voorgenomen beleid en beleidsprogramma’s;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h2
  - number: 63h2.1.c
    text: het ontwikkelen, onderhouden en toegankelijk maken van data;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h2
  - number: 63h2.1.d
    text: het verspreiden van binnen het WODC aanwezige kennis;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h2
  - number: 63h2.1.e
    text: de documentatie van (sociaal-)wetenschappelijke publicaties op het terrein van Justitie en Veiligheid.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h2
  - number: 63h2.2
    text: 'Het WODC bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h2
  - number: 63h2.2.a
    text: De afdeling Intern Wetenschappelijk beleidsonderzoek (IWB);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h2
  - number: 63h2.2.b
    text: De afdeling Extern Wetenschappelijk Beleidsonderzoek (EWB);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h2
  - number: 63h2.2.c
    text: De afdeling Communicatie en Informatie (C&I);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h2
  - number: 63h2.2.d
    text: De afdeling Informatievoorziening en Datamanagement (I&D);
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h2
  - number: 63h2.2.e
    text: De afdeling Bedrijfsvoering en Directieondersteuning (B&D).
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h2
  - number: 63h3.1
    text: |-
      De Justitiële ICT Organisatie is belast met het beheer en de (door)ontwikkeling van specifieke en
      gemeenschappelijke ICT-diensten gericht op de ondersteuning van onderdelen van het Ministerie van Justitie en
      Veiligheid.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h3
  - number: 63h4.1
    text: |-
      De Nationale Opvang Organisatie (NOO) is belast met de taak om in het kader van de opvang van Oekraïense ontheemden
      bij te dragen aan:
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h4
  - number: 63h4.1.a
    text: het realiseren van voldoende opvanglocaties van voldoende kwaliteit, en;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h4
  - number: 63h4.1.b
    text: |-
      het voldoende beschikbaar en toegankelijk zijn van benodigde basisvoorzieningen en -functies, zoals onderwijs,
      zorg, maatschappelijke hulp.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h4
  - number: 63h4.2
    text: 'De NOO is meer specifiek belast met:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h4
  - number: 63h4.2.a
    text: |-
      Het ondersteunen en monitoren van het realiseren van voldoende opvanglocaties van voldoende kwaliteit door
      gemeenten in Nederland.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h4
  - number: 63h4.2.b
    text: |-
      Het ondersteunen en monitoren van de uitvoering van de feitelijke opvang, door gemeenten. Daarbij gaat het erom dat
      gemeenten moeten kunnen voorzien in voldoende beschikbaarheid en toegankelijkheid van benodigde basisvoorzieningen
      en -functies, zoals onderwijs, zorg, maatschappelijk hulp.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h4
  - number: 63h4.2.c
    text: |-
      Het waar nodig ondersteunen en monitoren van de veilige terugkeer dan wel het bestendigd verblijf van ontheemden en
      van de afbouw van locaties en voorzieningen door gemeenten.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h4
  - number: 63h4.2.d
    text: |-
      Het waar nodig uitvoeren van een regierol op voornoemde gebieden, bijvoorbeeld bij de organisatie van
      crisisnoodopvang bij plotselinge grootschalige instroom.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h4
  - number: 63h4.3
    text: 'De NOO bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h4
  - number: 63h4.3.a
    text: de afdeling Ontwikkeling Opvanglocaties
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h4
  - number: 63h4.3.b
    text: de afdeling Planning & Control
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h4
  - number: 63h4.3.c
    text: de afdeling Ondersteuning Opvang
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63h4
  - number: 63i
    text: |-
      Het secretariaat van het Schadefonds Geweldsmisdrijven (secretariaat SGM) is belast met de bedrijfsvoering en
      ondersteuning van het Schadefonds Geweldsmisdrijven.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63i
  - number: 63j.1
    text: |-
      Het bureau van de Nationaal rapporteur mensenhandel en seksueel geweld tegen kinderen als bedoeld in
      [artikel 2, eerste lid van de Wet Nationaal rapporteur mensenhandel en seksueel geweld tegen kinderen][ref1] is
      belast met de bedrijfsvoering en ondersteuning van de Nationaal rapporteur mensenhandel en seksueel geweld tegen
      kinderen.


      [ref1]: https://wetten.overheid.nl/BWBR0034176#Artikel2
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel63j
    references:
      - id: ref1
        bwb_id: BWBR0034176
        artikel: '2'
  - number: '64'
    text: |-
      Bij de hoofden van de in [artikel 2][ref1] genoemde dienstonderdelen en daaronder ressorterende dienstonderdelen
      liggen voor het daarbij werkzame personeel ter inzage:


      [ref1]: https://wetten.overheid.nl/BWBR0040293#Artikel2
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0040293
        artikel: '2'
        hoofdstuk: '1'
  - number: 64.a
    text: een exemplaar van dit besluit;
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel64
  - number: 64.b
    text: het organisatie- en formatierapport van het betreffende dienstonderdeel.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel64
  - number: '65.1'
    text: |-
      Een voornemen tot aanpassing van de organisatie zoals deze is weergegeven in dit besluit, wordt genomen door de
      secretaris-generaal, gehoord de bestuursraad.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel65
  - number: '65.2'
    text: |-
      De directeur Personeel en Organisatie adviseert de secretaris-generaal alvorens een beslissing omtrent instemming
      wordt genomen.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel65
  - number: '66.1'
    text: |-
      Elk onderdeel dat ressorteert onder de in [artikel 2][ref1] genoemde dienstonderdelen ontwerpt en onderhoudt
      een organisatierapport en een formatierapport en, voor zover van toepassing, een taakbesluit en een baten-
      lastenagentschapsregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0040293#Artikel2
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0040293
        artikel: '2'
        hoofdstuk: '1'
  - number: '66.2'
    text: |-
      Voor zover een document als bedoeld in het eerste lid betrekking heeft op een dienstonderdeel, genoemd in
      [artikel 2, tweede lid, onderdelen a, b, i of j en derde lid][ref1], of het secretariaat van het Schadefonds
      Geweldsmisdrijven, is de secretaris-generaal bevoegd het document namens de bewindspersoon vast te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0040293#Artikel2
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0040293
        artikel: '2'
        hoofdstuk: '1'
  - number: '66.3'
    text: |-
      Voor zover een document als bedoeld in het eerste lid betrekking heeft op een dienstonderdeel, genoemd in
      [artikel 2, tweede lid, onderdelen c tot en met h][ref1], is de directeur-generaal onder wie het onderdeel
      ressorteert, bevoegd het document namens de bewindspersoon vast te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0040293#Artikel2
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0040293
        artikel: '2'
        hoofdstuk: '1'
  - number: '66.4'
    text: |-
      De secretaris-generaal respectievelijk de directeur-generaal van de clusters als bedoeld in
      [artikel 2, tweede lid, onderdelen d tot en met i][ref1] kan de in het tweede respectievelijk derde lid bedoelde
      bevoegdheid mandateren aan een onder hem ressorterende ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0040293#Artikel2
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0040293
        artikel: '2'
        hoofdstuk: '1'
  - number: '66.5'
    text: |-
      Alvorens een document als bedoeld in het eerste lid, kan worden vastgesteld, behoeft dit de instemming van de
      bestuursraad, indien er sprake is van financiële meeruitgaven of een uitbreiding van de personele formatie. De
      directeur Financieel Economische Zaken en de directeur Personeel en Organisatie adviseren de bestuursraad alvorens
      een beslissing omtrent instemming wordt genomen.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel66
  - number: '67.1'
    text: De directeur Personeel en Organisatie is belast met het beheer van dit besluit.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel67
  - number: '67.2'
    text: |-
      De hoofden van de clusters zijn verantwoordelijk voor een juiste, volledige en tijdige aanlevering aan de directeur
      Personeel en Organisatie van de gegevens die een goed beheer van dit besluit mogelijk maken.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel67
  - number: '68.1'
    text: |-
      Na inwerkingtreding van dit besluit wordt in regelingen en besluiten die verwijzen
      naar het [Organisatiebesluit Ministerie van Veiligheid en Justitie 2015][ref1] of de
      [Organisatieregeling Ministerie van Veiligheid en Justitie 2011][ref2] gelezen ‘Organisatiebesluit Ministerie van
      Justitie en Veiligheid’. In afwachting van aanpassing van de verwijzingen in deze regelingen en besluiten moet
      worden geacht te zijn verwezen naar bepalingen van gelijke strekking uit het Organisatiebesluit Ministerie van
      Justitie en Veiligheid.


      [ref1]: https://wetten.overheid.nl/BWBR0036820
      [ref2]: https://wetten.overheid.nl/BWBR0030837
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0036820
      - id: ref2
        bwb_id: BWBR0030837
  - number: '68.2'
    text: |-
      Besluiten of handelingen die vóór de inwerkingtreding van dit besluit namens de bewindspersoon zijn genomen
      of verricht door een functionaris van een dienstonderdeel zoals dat dienstonderdeel vóór 26 oktober 2017 werd
      aangeduid, behouden hun rechtskracht.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel68
  - number: '68.3'
    text: |-
      Besluiten of handelingen die in de periode vanaf 15 augustus 2018 en vóór de inwerkingtreding van
      [artikel 19, derde lid][ref1] en [artikel 28, vierde lid][ref2] van dit besluit namens de bewindspersoon door de
      directeur-generaal Politie dan wel de directeur-generaal Straffen en Beschermen zijn genomen of verricht, behouden
      hun rechtskracht.


      [ref1]: https://wetten.overheid.nl/BWBR0040293#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0040293#Artikel28
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0040293
        artikel: '19'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0040293
        artikel: '28'
        hoofdstuk: '5'
  - number: '68.4'
    text: |-
      Ondermandaten, volmachten en machtigingen verleend door of namens de directeur-generaal Politie dan wel de
      directeur-generaal Straffen en beschermen blijven van kracht.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel68
  - number: '69'
    text: |-
      Het [Organisatiebesluit Ministerie van Veiligheid en Justitie 2015][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0036820
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0036820
  - number: '71'
    text: 'Dit besluit wordt aangehaald als: Organisatiebesluit Ministerie van Justitie en Veiligheid.'
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel71
