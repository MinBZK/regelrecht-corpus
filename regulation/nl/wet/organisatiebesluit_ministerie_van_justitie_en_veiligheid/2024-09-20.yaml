  - number: '3.1'
    text: |-
      De secretaris-generaal is ambtelijk eindverantwoordelijk voor de leiding van de in [artikel 2][ref1] genoemde
      dienstonderdelen. De plaatsvervangend secretaris-generaal vervult de rol van eigenaar als bedoeld in de
      [Regeling agentschappen][ref2] en de circulaire 'Governance ten aanzien van zbo’s’, voor de diensten en
      baten-lastenagentschappen, genoemd in [artikel 2, derde lid][ref3], de Inspectie Justitie en Veiligheid, het
      instituut Nationaal rapporteur mensenhandel en seksueel geweld tegen kinderen en het secretariaat van het
      Schadefonds Geweldsmisdrijven alsmede voor de hieronder genoemde zelfstandige bestuursorganen. De hoofddirecteur
      bedrijfsvoering is Chief Information Officer van het Ministerie van Justitie en Veiligheid.


