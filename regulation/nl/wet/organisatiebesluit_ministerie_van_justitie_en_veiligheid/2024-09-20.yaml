  - number: '3.2'
    text: |-
      De secretaris-generaal wordt bij afwezigheid vervangen door de plaatsvervangend secretaris-generaal. Bij
      afwezigheid van de secretaris-generaal en de plaatsvervangend secretaris-generaal vindt vervanging plaats door de
      hoofddirecteur bedrijfsvoering. Bij afwezigheid van zowel de secretaris-generaal, de plaatsvervangend secretaris-
      generaal als de hoofddirecteur bedrijfsvoering vindt vervanging plaats door een van de directeuren-generaal van
      de clusters als bedoeld in [artikel 2, tweede lid onderdelen c tot en met h][ref1] of de Nationaal Coördinator
      Terrorismebestrijding en Veiligheid, in volgorde van de datum van benoeming. De plaatsvervangend secretaris-
      generaal en de hoofddirecteur bedrijfsvoering zullen elkaar bij afwezigheid vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0040293#Artikel2
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0040293
        artikel: '2'
        hoofdstuk: '1'
  - number: '3.3'
    text: |-
      De hoofden van de clusters zijn belast met de beleids- en bedrijfsvoering van de tot hun cluster behorende
      onderdelen tenzij anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel3
  - number: '3.4'
    text: |-
      De directeuren-generaal van de clusters als bedoeld in [artikel 2, tweede lid onderdelen c tot en met h][ref1], de
      directeur Wetgeving en Juridische Zaken en de Nationaal Coördinator Terrorismebestrijding en Veiligheid vervullen
      de rol van opdrachtgever als bedoeld in de [Regeling agentschappen][ref2] en de circulaire 'Governance ten aanzien
      van zbo’s’.


      [ref1]: https://wetten.overheid.nl/BWBR0040293#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0040286
    url: https://wetten.overheid.nl/BWBR0040293/2024-09-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0040293
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0040286
  - number: '3.5'
    text: |-
      De hoofden van de diensten, baten-lastenagentschappen, genoemd in [artikel 2, derde lid][ref1], de zelfstandige
      bestuursorganen als bedoeld in [artikel 3, eerste lid][ref2], en het secretariaat van het Schadefonds
      Geweldsmisdrijven vervullen de rol van opdrachtnemer als bedoeld in de [Regeling agentschappen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0040293#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0040293#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0040286
