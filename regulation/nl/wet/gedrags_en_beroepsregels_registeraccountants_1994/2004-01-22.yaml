preamble:
  text: |-
    gelet op het bepaalde in artikel 23, lid 2, van de Wet op de Registeraccountants (Stb. 1993, 468), onderstaande
    verordening bekend, welke door de ledenvergadering op 30 november 1994 is vastgesteld.

    De ledenvergadering van de Orde Nederlands Instituut van Registeraccountants;

    Gelet op artikel 19, tweede lid en artikel 19a van de Wet op de Registeraccountants;

    Stelt de volgende verordening vast:
  url: https://wetten.overheid.nl/BWBR0007194/2004-01-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze verordening wordt verstaan onder:

      de Wet: de [Wet op de Registeraccountants][ref1];

      de Orde: het Nederlands Instituut van Registeraccountants;

      het bestuur: het bestuur van de Orde;

      accountant: een in de zin van [artikel 2, eerste lid][ref2], optredende registeraccountant, Accountant-
      Administratieconsulent of buitenlands deskundige;

      openbaar accountant: een accountant die optreedt in de zin van [artikel 2, tweede lid][ref3];

      verklaring: een accountantsverklaring, een beoordelingsverklaring of een samenstellingsverklaring;

      accountantsverklaring: een schriftelijke mededeling van een accountant inhoudende de uitkomst van de controle van
      een verantwoording;

      beoordelingsverklaring: een schriftelijke mededeling van een accountant inhoudende de uitkomst van de beoordeling
      van een verantwoording;

      samenstellingsverklaring: een schriftelijke mededeling van een accountant inhoudende de uitkomst van de
      samenstelling van een verantwoording;

      controle: het geheel van werkzaamheden dat erop gericht is een (relatief) hoge maar niet absolute mate van
      zekerheid te verkrijgen omtrent de getrouwheid van een verantwoording, die in de accountantsverklaring in positief
      geformuleerde bewoordingen als ' redelijke mate van zekerheid' wordt weergegeven;

      beoordeling: het geheel van werkzaamheden dat erop gericht is een beperkte mate van zekerheid te verkrijgen omtrent
      de getrouwheid van een verantwoording, welke mate van zekerheid lager is dan bij een controle;

      samenstelling: het geheel van werkzaamheden dat erop gericht is een verantwoording op deskundige wijze te
      vervaardigen zonder het oogmerk daarbij zekerheid omtrent de getrouwheid van de verantwoording te verkrijgen;

      openbaar maken: beschikbaar stellen voor het publiek, dan wel aan een zodanige kring van personen dat deze met het
      publiek gelijk is te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002374
      [ref2]: https://wetten.overheid.nl/BWBR0007194#Artikel2
