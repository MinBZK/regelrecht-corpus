  - number: '8'
    text: De bepalingen van dit hoofdstuk gelden uitsluitend voor registeraccountants voor zover zij optreden als accountant.
    url: https://wetten.overheid.nl/BWBR0007194/2004-01-22#Artikel8
  - number: '9'
    text: |-
      1 De registeraccountant is onpartijdig in zijn oordeel.

      2 Indien de registeraccountant een bijzonder belang vertegenwoordigt, is hij gehouden ervoor zorg te dragen dat
      zulks aan de betrokkenen kenbaar is.

      3 Het is de registeraccountant verboden een verklaring te geven aangaande een verantwoording die door of mede door
      hemzelf, zijn echtgenoot, zijn geregistreerde partner, een persoon tot wie hij anderszins in een nauwe persoonlijke
      relatie staat of een persoon met wie hij onder gemeenschappelijke naam optreedt, wordt afgelegd.
    url: https://wetten.overheid.nl/BWBR0007194/2004-01-22#Artikel9
  - number: '10'
    text: |-
      1 De registeraccountant houdt geheim al hetgeen hem in de uitoefening van zijn beroep als geheim is toevertrouwd
      of wat daarbij als een vertrouwelijke aangelegenheid te zijner kennis is gekomen, voor zover bij of krachtens de
      [wet][ref1] niet anders wordt vereist.

      2 De registeraccountant maakt van vertrouwelijke gegevens die in de uitoefening van zijn beroep te zijner kennis
      zijn gekomen, niet verder of anders gebruik, en aan die gegevens geeft hij niet verder of anders bekendheid, dan
      voor de vervulling van zijn taak of bij of krachtens de [wet][ref2] wordt vereist.

      3 Indien degene wiens aangelegenheid het betreft de registeraccountant heeft ontslagen van zijn plicht tot
      geheimhouding, is deze gehouden de belangen van alle betrokkenen en van de stand der registeraccountants zorgvuldig
      af te wegen alvorens tot bekendmaking over te gaan.

      4 De registeraccountant handelt niet in strijd met de plicht tot geheimhouding als geregeld in het eerste en
      tweede lid, wanneer hij bij het centraal meldpunt als bedoeld in de [Verordening op de fraudemelding][ref3]
      de opzegging van een controleopdracht wegens een reden als bedoeld in [artikel 2, derde lid][ref4], of
      [artikel 3, tweede lid][ref5], van genoemde verordening meldt in het geval dat voornoemde verordening niet de
      plicht daartoe oplegt.

      5 Indien een voor de vervulling van de taak vereiste mededeling slechts kan worden gedaan door openbaarmaking
      ervan, en degene wiens aangelegenheden het betreft daaraan niet meewerkt, is de registeraccountant gehouden ten
      aanzien van de wijze van openbaarmaking de belangen van alle betrokkenen en van de stand der registeraccountants in
      het oog te houden.

      6 De bepalingen van dit artikel blijven voor de registeraccountant gelden nadat hij is opgehouden op te treden
      als accountant.


      [ref1]: https://wetten.overheid.nl/BWBR0002374
      [ref2]: https://wetten.overheid.nl/BWBR0002374
      [ref3]: https://wetten.overheid.nl/BWBR0006758
      [ref4]: https://wetten.overheid.nl/BWBR0007194#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0007194#Artikel3
