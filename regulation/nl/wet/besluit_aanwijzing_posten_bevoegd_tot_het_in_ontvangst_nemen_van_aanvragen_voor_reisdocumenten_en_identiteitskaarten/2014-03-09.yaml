  - number: '2'
    text: |-
      De hoofden van honorair consulaire posten zijn bevoegd tot het uitreiken van paspoorten en identiteitskaarten,
      zoals bedoeld in [artikel 1][ref1], indien veilige verzending van het reisdocument niet mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0034819#Artikel1
