    text: |-
      Het [besluit van de Minister van Buitenlandse Zaken van 2 april 2015][ref1], met nr. DCV/RL-0299/2015 tot
      aanwijzing van posten bevoegd tot het in ontvangst nemen van aanvragen voor reisdocumenten en identiteitskaarten
      wordt ingetrokken.


