  - number: '2'
    text: |-
      De hoofden van honorair consulaire posten zijn bevoegd tot het uitreiken van paspoorten, zoals bedoeld in
      [artikel 1][ref1], indien veilige verzending van het reisdocument niet mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0036717#Artikel1
