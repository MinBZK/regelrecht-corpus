    Besluit:
  url: https://wetten.overheid.nl/BWBR0031598/2012-06-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De hoofden van de in [bijlage A][ref1] genoemde consulaire posten zijn bevoegd tot het in ontvangst nemen van
      aanvragen voor, alsmede het uitreiken van:

      a. nationale paspoorten;

      b. reisdocumenten voor vluchtelingen;

      c. reisdocumenten voor vreemdelingen;

      d. faciliteitenpaspoorten; en

      e. tweede paspoorten.

      2 De hoofden van de in [bijlage B][ref2] genoemde consulaire posten zijn bovendien bevoegd tot het in ontvangst
      nemen van aanvragen voor, alsmede het uitreiken van Nederlandse identiteitskaarten.

      3 De hoofden van alle consulaire posten zijn bevoegd tot het in ontvangst nemen van aanvragen voor, alsmede het
      uitreiken van laissez-passers en noodpaspoorten.


