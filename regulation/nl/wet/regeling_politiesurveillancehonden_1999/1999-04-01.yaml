  - number: '2'
    text: |-
      Een politiesurveillancehond wordt uitsluitend in politiedienst gebruikt indien:

      a. het gebruik geschiedt door een geleider, en

      b. de combinatie van geleider en politiesurveillancehond beschikt over een certificaat als bedoeld in
      [artikel 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010333#Artikel8
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010333
        artikel: '8'
        paragraaf: '3'
  - number: '3'
    text: |-
      1 Er is een keuringscommissie voor de politiesurveillancehond. De leden van deze commissie worden aangewezen door
      of vanwege de korpschef en aangemeld bij het keuringsinstituut.

      2 De leden van de keuringscommissie zijn ambtenaar van politie als bedoeld in
      [artikel 3, eerste lid, van de Politiewet 1993][ref1].

      3 De leden van de keuringscommissie beschikken over een ruime dressuurtechnische ervaring en praktische politie-
      ervaring op het gebied van inzet en gebruik van politiesurveillancehonden.

      4 De keuring van de combinatie van geleider en hond geschiedt door de keuringscommissie met dien verstande dat de
      leden die keuren afkomstig zijn uit een ander korps dan het korps waar de combinatie dienst zal doen.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel3
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '3'
  - number: '4'
    text: |-
      1 De ministers wijzen rijksgecommitteerden aan.

      2 De rijksgecommitteerden houden toezicht op de kwaliteit, de objectiviteit van de (her)keuringen door de
      keuringscommissie en de juiste naleving van de regels terzake.

      3 De rijksgecommitteerden rapporteren over hun activiteiten jaarlijks aan de ministers.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikel4
  - number: '5'
    text: |-
      Aan een keuring kunnen deelnemen ambtenaren van politie vanaf de rang van surveillant van politie, die zijn
      aangewezen als geleider.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikel5
  - number: '6'
    text: |-
      Voor de keuring komen in aanmerking honden die:

      a. door een gediplomeerd dierenarts gezond zijn verklaard, en

      b. ingeënt zijn tegen de in het keuringsreglement aangewezen ziekten.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikel6
  - number: '7'
    text: |-
      1 De keuring van de combinatie van geleider en hond geschiedt op basis van het keuringsreglement.

      2 Aan een politiesurveillancehond worden tenminste de volgende, in het keuringsreglement nader omschreven eisen
      gesteld:

      a. gehoorzaamheid van de hond aan de geleider;

      b. een goede samenwerking van de hond met de geleider;

      c. de vaardigheid van de hond in het kunnen nemen van alle hindernissen die voor een goed funktioneren in de
      praktijk noodzakelijk zijn;

      d. het vermogen van de hond om op commando van de geleider geweld tegen derden toe te passen respectievelijk te
      beëindigen.

      3 De hond wordt gedurende de keuring geleid door zijn geleider.

      4 Indien de combinatie van geleider en hond de keuring niet met goed gevolg aflegt, bestaat de mogelijkheid een
      tweede maal en zonodig een derde maal aan de keuring deel te nemen.

      5 In geval de combinatie van geleider en hond voor de derde maal de keuring niet met goed gevolg voltooit, komt de
      betreffende combinatie niet meer voor keuring in aanmerking.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikel7
  - number: '8'
    text: |-
      De keuringscommissie verstrekt aan de geleider van de combinatie die heeft voldaan aan de keuringseisen een
      certificaat op naam van de combinatie van de geleider en de politiesurveillancehond.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikel8
  - number: '9'
    text: |-
      1 Het certificaat heeft een geldigheidsduur van ten hoogste twee jaar en drie maanden te rekenen vanaf de datum
      waarop aan de keuringseisen is voldaan.

      2 Het certificaat geldt uitsluitend voor de combinatie van geleider en hond, op naam waarvan het is afgegeven.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikel9
  - number: '10'
    text: |-
      1 De combinatie van geleider en politiesurveillancehond wordt uiterlijk twee jaar na het behalen van het
      certificaat door de keuringscommissie opnieuw aan de keuringseisen onderworpen.

      2 Indien de herkeuring, bedoeld in het eerste lid, met goed gevolg wordt afgelegd, wordt de geldigheidsduur van het
      certificaat overeenkomstig [artikel 9, eerste lid][ref1], vastgesteld.

      3 Indien de combinatie van geleider en politiesurveillancehond de herkeuring niet met goed gevolg aflegt, kan
      binnen de geldigheidsduur van het certificaat een tweede herkeuring plaatsvinden.

      4 Indien na toepassing van het derde lid opnieuw niet wordt voldaan aan de keuringseisen, vervalt de geldigheid van
      het verkregen certificaat, bedoeld in [artikel 8][ref2], met onmiddellijke ingang.

      5 Een politiesurveillancehond die, deel uitmakend van een combinatie, voor het behalen van een nieuw certificaat
      achtereenvolgens tot drie maal toe wordt afgewezen, komt niet meer voor de politiedienst in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0010333#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0010333#Artikel8
