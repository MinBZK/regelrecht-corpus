  - number: '11'
    text: De Regeling politiesurveillancehonden wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikel11
  - number: '12'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikel12
  - number: '13'
    text: 'Deze regeling wordt aangehaald als: Regeling politiesurveillancehonden 1999.'
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikel13
  - number: a
    text: |-
      De hond moet ten opzichte van zijn geleider zijn volgzaamheid en gehoorzaamheid tonen.

      De hond moet aantonen buiten de aanwezigheid van zijn geleider gedurende 3 minuten te kunnen blijven liggen; de
      oefening wordt solitair uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikela
  - number: b
    text: |-
      De geleider surveilleert met zijn hond aan een slappe lijn in een rechte lijn, over een afstand van ongeveer 50
      meter. De hond dient tijdens de surveillance waarneembaar oplettend voor zijn omgeving naast de geleider te lopen.
      Surveillance-oefeningen welke naast het bovenvermelde nog bijzondere details bevatten, worden in de betreffende
      oefeningen nader omschreven.

      Na één van de oefeningen, dit naar keuze van de keuringscommissie, moet de hond op commando van de geleider ’af’
      gaan, waarna de geleider uit het zicht van de hond gaat.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikelb
  - number: c
    text: |-
      1 De geleider surveilleert met zijn hond aangelijnd in een rechte lijn over de aangegeven afstand. Dit surveilleren
      moet geschieden met een slappe lijn en de hond moet oplettend voor zijn omgeving direct naast de geleider lopen.

      2 De geleider gaat met zijn hond aangelijnd en in een rechte lijn in looppas over de aangegeven afstand. Dit moet
      geschieden met een slappe lijn en de hond moet oplettend voor zijn omgeving direct naast de geleider lopen.

      3 De geleider surveilleert met zijn hond onaangelijnd in een rechte lijn over de aangegeven afstand. Tijdens dit
      surveilleren moet de hond oplettend voor zijn omgeving direct naast de geleider lopen. De geleider dient zijn hond
      bij de daarvoor geplaatste markeringen om te commanderen naar de andere zijde van de geleider. De hond mag tijdens
      het omgaan naar de andere zijde niet teveel afwijken van de geleider.

      4 De geleider gaat met zijn hond aangelijnd naar de hem beschikbaar gestelde fiets. Daar aangekomen moet de hond
      zich al of niet op commando van zijn geleider naar de rechterzijde van de fiets begeven. Hierna legt de geleider
      met zijn hond aangelijnd de aangegeven route af. De hond dient met zijn kop ongeveer ter hoogte van de as van het
      voorwiel te lopen. Na de afgelegde route stapt de geleider af en zet de fiets weg.

      5 De hond moet gedurende 3 minuten onaangelijnd blijven liggen met aandacht voor zijn omgeving. De tijd begint te
      lopen op het moment dat de geleider daadwerkelijk uit zicht is. De geleider mag niet eerder dan na die 3 minuten
      weer in het zicht van zijn hond komen.

      Op teken van een lid van de keuringscommissie gaat de geleider zijn hond weer ophalen en is dit onderdeel
      afgelopen.

      6 De geleider legt de hond op een door de keuringscommissie aangegeven plaats af. Hierna vangt dit onderdeel aan.
      Nadat de geleider uit het zicht van de hond is, worden vervolgens drie stukken voedsel bij de hond geworpen. De
      hond mag geen voedsel dan van zijn geleider aannemen.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikelc
  - number: d
    text: |-
      De diverse onderdelen kennen de volgende maximum waardering:

      1. Surveilleren aan de lijn in gewone pas 5 punten

      2. Surveilleren aan de lijn in looppas 5 punten

      3. Surveilleren onaangelijnd in gewone pas en met omcommandering 5 punten

      4. Surveilleren naast de fiets 5 punten

      5. Afliggen 5 punten

      Totaal 25 punten
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikeld
  - number: e
    text: |-
      1. t/m 4 De geleider dient de lijn waarmee de hond aangelijnd is met die hand vast te houden aan welke zijde de
      hond zich bevindt. Van de geleider mag geen enkele dreiging uitgaan. Tijdens de onderdelen mag hij geen tekens of
      extra commando’s aan zijn hond geven. Bij onaangelijnd surveilleren dient de lijn niet zichtbaar te zijn.

      Aftrek vindt plaats in geval er geen sprake is van een slappe lijn, in geval van onoplettendheid en indien de
      geleider de politiesurveillancehond niet direct naast zich houdt. De met betrekking tot de surveillance omschreven
      vereisten worden per onderdeel beoordeeld. Voor iedere niet juiste uitvoering daarvan vindt per keer aftrek plaats
      van één punt.

      5 Bij dit onderdeel dient de hond oplettend te zijn. Hij mag zich niet verplaatsen, niet gaan zitten en niet gaan
      staan. De omschreven vereisten worden apart beoordeeld. Voor iedere niet juiste uitvoering daarvan vindt per keer
      aftrek plaats van één punt. Verlaat de hond de eerste ingenomen plaats over een afstand van meer dan vijf meter,
      dan worden geen punten toegekend.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikele
  - number: a
    text: De geleider en zijn hond moeten een verdachte zo stil mogelijk kunnen benaderen.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikela
  - number: b
    text: |-
      De geleider gaat met zijn hond aangelijnd na een teken van een lid van de keuringscommissie in een aangewezen
      richting surveilleren.

      Tijdens deze surveillance hoort de geleider een geluid als van een inbraak in de omgeving. De geleider moet na het
      constateren van dit geluid naar de plaats gaan vanwaar het geluid komt.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikelb
  - number: c
    text: |-
      De geleider moet er voor zorgen dat de verdachte diens nadering met de politiesurveillancehond niet bemerkt,
      dit ter beoordeling van een lid van de keuringscommissie die zich bij de verdachte bevindt. Uitzondering is de
      natuurlijke ademhaling van de hond. Bij het aantreffen van de verdachte houdt de geleider deze aan, waarna hij zijn
      hond op een afstand van ongeveer 3 meter van de verdachte ter bewaking ’af’ legt.

      Hierna stelt de geleider een gedegen onderzoek aan de kleding in, waarbij hij er voor zorg draagt dat hij niet
      tussen de verdachte en de hond komt. De verdachte wordt bij het fouilleren altijd van achteren benaderd. Na het
      onderzoek aan de kleding is de oefening beëindigd.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikelc
  - number: d
    text: |-
      De diverse onderdelen kennen de volgende maximum waardering:

      1. Surveilleren 5 punten

      2. Stil zijn 5 punten

      3. Aanhouding 5 punten

      4. Onderzoek 5 punten

      5. Bewaken 5 punten

      Totaal 25 punten
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikeld
  - number: e
    text: |-
      1 Dit dient te geschieden aan een slappe lijn met de hond attent naast de geleider. Het surveilleren eindigt zodra
      de combinatie op een afstand van ongeveer 3 meter de verdachte is genaderd.

      2 Dit dient op de natuurlijke ademhaling van de hond na zo stil te geschieden dat het lid van de keuringscommissie,
      die zich bij de verdachte bevindt geen geluiden waarneemt van de geleider en/of de hond.

      N.B.: het ’stil zijn’ is cruciaal voor de waardering. Indien het surveilleren niet goed of zelfs onvoldoende
      uitgevoerd, dan kan het stil, mits uitmuntend uitgevoerd, nog met maximaal 5 punten worden gewaardeerd. Het
      omgekeerde is niet mogelijk.

      3 Dit dient volgens de daarvoor bestaande regels overeenkomstig het [Wetboek van Strafvordering][ref1] te
      geschieden. Houdt de geleider de verdachte niet aan, dan wordt de oefening vanaf onderdeel 3 met nul punten
      gewaardeerd.

      4 Dit dient terdege te worden gedaan. Er vindt aftrek plaats indien de geleider zich tussen de verdachte en de hond
      begeeft/bevindt.

      5 Dit dient door de hond op ongeveer 3 meter met volle aandacht en zonder aanval of bijten te geschieden.

      De hond mag zich niet verplaatsen, niet gaan zitten en niet gaan staan. Verlaat de hond de eerst ingenomen plaats
      over een afstand van meer dan vijf meter, dan wordt het onderdeel bewaken met nul punten gewaardeerd.

      Indien de hond de verdachte die zich heeft overgegeven aanvalt of bijt, dan wordt de combinatie afgewezen.

      De per onderdeel omschreven vereisten worden apart beoordeeld. Voor iedere niet juiste uitvoering daarvan vindt per
      keer aftrek plaats van één punt.

      Aanval en/of bijten bij onderdeel 5 ’bewaken’ leidt tot afwijzing van de combinatie.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikele
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: a
    text: De geleider moet met zijn hond aantonen dat deze diverse obstakels kan nemen.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikela
  - number: b
    text: |-
      De oefening heeft betrekking op de volgende objecten:

      1 een open trap van tenminste 12 treden met een mogelijkheid om via de bovenkant van de trap deze weer te verlaten;

      N.B.: een open trap bezit geen stootborden.

      2 een balk of plank van ongeveer 50 centimeter breed en minimaal 5 meter lang moet op een hoogte van ongeveer 2
      meter zijn aangebracht op een stellage waar de hond op en af moet kunnen;

      3 een pijpconstructie waar een hond kruipend door moet met een middellijn van ongeveer 50 centimeter en waarvan het
      uiteinde niet zichtbaar is zodat het voor de hond in de pijp donker is;

      4 een schutting met een hoogte van tenminste 1.80 meter en ten hoogste 2 meter met aan de achterzijde een afloop-
      of een opvangschoot;

      5 een kuil of sloot van tenminste 2.25 meter breed welke mag zijn voorzien van een schuine springklep van ongeveer
      1 meter breed en ongeveer 50 centimeter boven de kuil;

      6 een dranghek met spijlen dat wordt gebruikt bij afzettingen.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikelb
  - number: c
    text: |-
      Per object dient de oefening als volgt te worden uitgevoerd:

      1 De geleider neemt onder aan de trap plaats. Op commando van de geleider moet de hond de trap oplopen. De hond mag
      via de bovenkant de trap weer verlaten.

      2 De geleider neemt bij het begin van de stellage plaats. Op commando van de geleider loopt de hond over de balk of
      plank. De geleider mag met zijn hond meelopen naar de andere zijde van de stellage waar de hond deze weer verlaat.

      3 Op commando van de geleider moet de hond door de pijp gaan, waarna de geleider naar het uiteinde mag lopen waar
      de hond de pijp moet verlaten.

      4 De geleider neemt met zijn hond plaats voor de schutting. Op commando van de geleider moet de hond over de
      schutting springen en deze aan de andere zijde via een afloop- of opvangschot weer verlaten.

      5 De geleider neemt met zijn hond plaats voor de sloot of kuil. Op commando van de geleider moet de hond de
      heensprong over de sloot of kuil maken.

      6 De geleider neemt met zijn hond plaats voor een dranghek. Op commando van de geleider moet de hond een vrije
      heensprong maken.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikelc
  - number: d
    text: Voor elk object is door de politiesurveillancehond maximaal 5 punten te behalen.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikeld
  - number: e
    text: |-
      De hond krijgt 5 punten als deze de oefening bij het betreffende object zelfstandig uitvoert. Voor een niet juist
      uitgevoerd object worden 3 punten gegeven. Voor een object waar de geleider de hond helpt of in geval van een
      weigering of herhaling worden ten hoogste 2 punten gegeven.

      Elk object mag bij mislukking éénmaal worden herhaald.

      Er is sprake van:

        - een niet juist uitgevoerd object, indien de hond de open trap niet goed oploopt maar met sprongen naar boven
      gaat, de loopplank of balk te vroeg verlaat, of aan het einde van de kruippijp deze niet zelfstandig verlaat;
        - hulp, indien de geleider de hond tijdens de uitvoering van de proeven steunt (praten, meelopen e.d.) of duwt met
      uitzondering van het meelopen bij object 2;
        - weigering indien de hond de oefening na het commando van de geleider daartoe niet aanvangt;
        - herhaling, indien de geleider na het begin van uitvoering door de hond deze terugroept en opnieuw een commando
      geeft voor het begin van uitvoering.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikele
  - number: a
    text: |-
      Op een willekeurig terrein of plaats met een afmeting van ongeveer 30 bij 50 meter dat is gemarkeerd of afgezet,
      moet de hond drie kleine voorwerpen met daaraan menselijke geur zoeken en vinden.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikela
  - number: b
    text: |-
      In een afgezet of gemarkeerd gebied waarvan de oppervlakte de praktijksituatie zo goed mogelijk moet benaderen
      (zie hierboven onder a.) bevinden zich drie kleine voorwerpen ter grootte van een sleutel, een klein zakmes, een
      klein slot e.d. met daaraan menselijke geur. De voorbeelden zijn willekeurig, maar duiden op het formaat van het
      voorwerp. Deze voorwerpen kunnen zowel op de grond als ongeveer 50 centimeter boven de grond zijn verstopt.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikelb
  - number: c
    text: |-
      De keuringscommissie geeft de zijde van de lokatie aan waarlangs de geleider zijn hond mag begeleiden. De geleider
      mag zijn hond tijdens het onderzoek aanmoedigen tot zoeken. Hij mag zich niet in het te onderzoeken terrein
      begeven.

      De hond moet de voorwerpen apporteren.

      De hond moet de voorwerpen heel bij zijn geleider brengen.

      De tijdsduur van de oefening is 10 minuten.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikelc
  - number: d
    text: |-
      De onderdelen van de oefeningen kennen de volgende maximum waardering:

      1. wijze van zoeken door de hond 5 punten

      2. drie voorwerpen à 5 punten 15 punten

      Totaal 20 punten
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikeld
  - number: e
    text: |-
      De omschreven vereisten worden apart beoordeeld. Voor iedere niet juiste uitvoering vindt per keer aftrek plaats
      van één punt.

      Ten aanzien van het totaal van de oefening vindt aftrek plaats in geval de hond dingen doet, die niet bij het
      onderzoek horen. Voorts vindt aftrek plaats bij niet goed zoeken door de hond.

      Indien de hond twee of één van de aangegeven voorwerpen vindt, worden maximaal 3 respectievelijk 2 punten per
      voorwerp toegekend.

      Per gevonden voorwerp vindt aftrek plaats, indien dit door de hond wordt gedeukt of kapot gemaakt. Hetzelfde geldt
      bij apporteren indien dit slecht gebeurd. Voor ingeslikte of niet gevonden voorwerpen worden geen punten gegeven.

      Indien de geleider zich na aanzegging van het lid van de keuringscommissie niet houdt aan de instructie, worden
      voor de gehele oefening geen punten toegekend.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikele
  - number: a
    text: |-
      In een gemarkeerd of afgezet terrein moet de hond een wapen en een breekwerktuig, met daaraan menselijke geur,
      zoeken en vinden.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikela
  - number: b
    text: |-
      In een gemarkeerd of afgezet terrein met een minimum lengte van 75 meter en een maximum lengte van 150 meter, zijn
      een wapen en een breekwerktuig met daaraan menselijke geur weggegooid. De breedte van het terrein wordt aangegeven
      door de keuringscommissie. De voorwerpen mogen niet verder dan 20 meter vanaf de basislijn worden weggegooid.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikelb
  - number: c
    text: |-
      Vanaf een beginpunt dat door een lid van de keuringscommissie wordt aangegeven wordt het onderzoek door de geleider
      met zijn hond aangevangen.

      De geleider mag zijn hond tot zoeken aanmoedigen. Ook mag de geleider op een rustige manier zijn hond bij het
      opzoeken en verwijzen corrigeren.

      De geleider mag niet in het terrein komen. Hij moet op aanwijzing van de keuringscommissie van het aangegeven
      beginpunt voorwaarts gaan naar het eindpunt van het terrein; zijn route loopt langs het te doorzoeken terrein. Hij
      mag stilstaan maar niet teruggaan op het gedeelte dat hij heeft afgelegd.

      Als de hond het wapen en/of het breekwerktuig verwijst en/of aanblaft, moet de geleider de plaats waar het voorwerp
      zich bevindt kenbaar maken aan de keuringscommissie, waarna een lid van de keuringscommissie de geleider opdracht
      geeft de hond uit het terrein te roepen. De aangewezen voorwerpen blijven in het terrein achter. De geleider mag
      gedurende dit onderzoek aan de keuringscommissie slechts tweemaal een plaats aangeven.

      De hond mag geen andere dingen doen dan die verband houden met dit onderzoek. De wijze van verwijzen van voorwerpen
      door de hond wordt niet voorgeschreven.

      De tijdsduur van dit onderzoek is 10 minuten.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikelc
  - number: d
    text: |-
      De diverse onderdelen kennen de navolgende maximum waardering:

      1. wijze van het terrein nemen door de hond 2 x 5 punten

      2. aanwijzen van de voorwerpen 2 x 5 punten

      Totaal 20 punten
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikeld
  - number: e
    text: |-
      Indien één of beide voorwerpen worden geapporteerd vindt per voorwerp aftrek plaats van 3 punten, mits het voorwerp
      rustig in de bek van de hond wordt gehouden en de geleider op commando de hond kan bewegen het voorwerp buiten het
      terrein los te laten. Als dit niet gebeurt, vindt een aftrek plaats van 4 punten per voorwerp.

      Bij het verplaatsen van een voorwerp over een afstand tot één meter vindt aftrek plaats van 1 punt, tot twee meter
      2 punten, enz. tot maximaal 5 punten per voorwerp.

      Er vindt per voorwerp aftrek plaats van 1 punt, indien de hond het voorwerp verkeerd aanwijst, mits de geleider dit
      niet kenbaar heeft gemaakt. Eveneens aftrek van 1 punt, indien de hond in het voorwerp bijt.

      Bij een verkeerde aanwijzing door de geleider wordt het voorwerp als niet gevonden beschouwd; de geleider kan
      overigens maar één keer verkeerd verwijzen.

      Op het totaal aantal punten van de oefening vindt aftrek plaats in geval de hond dingen doet, die niet bij het
      onderzoek horen; 1 punt per keer. Indien beide voorwerpen niet worden gevonden, zal voor de gehele oefening geen
      waardering plaatsvinden.

      Indien de geleider zich na aanzegging van het lid van de keuringscommissie niet houdt aan de instructie, worden
      voor de gehele oefening geen punten toegekend.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikele
  - number: a
    text: In een willekeurig gebied of lokatie moet de hond onaangelijnd een in burger gekleed persoon opzoeken en vinden.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikela
  - number: b
    text: |-
      In een willekeurig gebied of lokatie heeft een persoon zich verstopt. Deze persoon dient ervoor te zorgen dat de
      hond nimmer bij hem kan komen en dat hij zich zodanig verstopt dat de geleider/hond hem niet kan zien.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikelb
  - number: c
    text: |-
      Voor het begin van de oefening sommeert de geleider drie maal ’Hier spreekt de politie, kom te voorschijn of de
      hond wordt ingezet’. In de oefening geeft de verstopte persoon geen gevolg aan de sommatie. Door een lid van de
      keuringscommissie wordt een richting aangegeven. Tijdens de zoeking laat de geleider de onaangelijnde hond zowel
      links als rechts het terrein of de lokatie doorzoeken. Hij dient de hond op een zodanige afstand te volgen dat
      hij deze onder onmiddellijk en voortdurend toezicht houdt. De geleider mag niet teruggaan naar het door hem reeds
      afgelegde gedeelte.

      Als de hond de persoon lokaliseert, dit ter beoordeling van de gelider (kennis van zijn hond), gaat de geleider na
      een teken van de keurmeester naar zijn hond, lijnt hem aan, doet twee passen achterwaarts en sommeert de burger te
      voorschijn te komen.

      De geleider mag eenmaal een gelokaliseerde plaats kenbaar maken aan de keuringscommissie. Indien de geleider een
      plaast kenbaar maakt waar de persoon zich niet bevindt maar waarvan aannemelijk is dat er menselijke geur aanwezig
      is (dit ter beoordeling van de keuringscommissie) kan het lid van de keuringscommissie de geleider door laten
      zoeken en de oefening laten vervolgen.

      De geleider mag tijdens de oefening zijn hond op rustige wijze corrigeren doch met uitzondering van het onderdeel
      wijze van lokaliseren en bewaken. De hond dient de persoon duidelijk en zelfstandig te lokaliseren.

      Tijdens de oefening volgt het lid van de keuringscommissie de combinatie op een afstand van ± 10 meter.

      De tijdsduur van de oefening is 10 minuten.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikelc
  - number: d
    text: |-
      De diverse onderdelen kennen de navolgende maximum waardering:

      1. Wijze van terrein of lokatie nemen door de hond 5 punten

      2. Surveilleren/begeleiden door de geleider 5 punten

      3. Wijze van lokaliseren 5 punten

      4. Bewaken 5 punten

      Totaal 20 punten
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikeld
  - number: e
    text: |-
      Aftrek onderdeel 1: ongehoorzaamheid, onwennigheid en dingen die niet bij dit onderzoek behoren.

      Aftrek onderdeel 2: geen kennis hond, ontaktische handelingen en teruggaan van de geleider op de aangewezen
      richting.

      Aftrek onderdeel 3: niet goed lokaliseren door de hond en/of het aanbrengen van beschadigingen omgeving vindplaats
      door de hond.

      Aftrek onderdeel 4: geen goede bewakingsdrift van de hond. Indien dit onderdeel met 0 punten wordt gewaarderd
      kunnen de andere onderdelen met maximaal drie punten worden gewaardeerd.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikele
  - number: a
    text: De hond dient een dienstvoertuig te bewaken.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikela
  - number: b
    text: |-
      De geleider zit in een dienstvoertuig. De hond is geplaatst in de kennel van het dienstvoertuig. Op een teken van
      de keurmeester zal de helper de achterklep van de dienstauto en de kennel openen. De helper zal trachten de hond
      uit de kennel te halen.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikelb
  - number: c
    text: |-
      De hond moet op energieke wijze de verdachte aanvallen. Indien de hond de verdachte bijt geeft de helper zijn
      poging op. De geleider stapt uit het dienstvoertuig en geeft de hond indien nodig het commando tot loslaten. Hierna
      is de oefening beëindigd.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikelc
  - number: d
    text: |-
      De diverse onderdelen kennen de navolgende maximum waardering:

      1. Bewaken van het dienstvoertuig 5 punten

      2. Bijten 5 punten

      3. Loslaten 5 punten

      Totaal 15 punten
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikeld
  - number: e
    text: |-
      Aftrek voor het onderdeel bijten vindt plaats indien de hond slap bijt. Indien de hond niet bijt, vindt voor de
      gehele oefening geen waardering plaats.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikele
  - number: a
    text: |-
      De hond wordt ingezet tegen een zich met een stok verwerende verdachte. De hond zal hier zijn moed en
      beheersbaarheid moeten tonen.

      De afstand waarover de oefening plaatsvindt bedraagt minimaal 60 meter en maximaal 100 meter.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikela
  - number: b
    text: |-
      Tijdens de surveillance ontdekt de geleider met zijn hond een zich verdacht ophoudende persoon die iets in een
      tas deponeert.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikelb
  - number: c
    text: |-
      De geleider die dit feit ontdekt roept de verdachte aan met ’Halt Politie, geeft u zich over of de hond wordt
      ingezet’.

      Hieraan voldoet de verdachte niet en hij gaat er vandoor na het wegwerpen van de tas. De geleider geeft hierop zijn
      hond opdracht de verdachte tot staan te brengen. De geleider volgt zijn hond zo snel mogelijk met medeneming van de
      weggegooide tas. De hond moet de verdachte, die zich verdedigt door zich naar de hond te keren en hem probeert af
      te weren met schreeuwen en een stokslag, met zijn eerste aanval direct tot staan brengen en al of niet op commando
      van de geleider loslaten. Nadat de hond heeft losgelaten gaat de hond over tot bewaken van de verdachte.

      De geleider houdt de verdachte aan, waarna hij de stok afneemt en een gedegen onderzoek aan de kleding instelt.

      Tijdens dit onderzoek ligt de hond op ongeveer 3 meter van de verdachte en draagt de geleider er zorg voor dat
      hij niet tussen de hond en de verdachte komt. Na het onderzoek wordt met medeneming van de tas en de stok door
      de geleider de verdachte overgebracht naar een gereedstaande dienstauto. Voordat de verdachte wordt overgebracht
      geeft de geleider duidelijk de richting aan waarheen de verdachte moet lopen. De geleider volgt op ongeveer 2 meter
      achter de verdachte, met zijn hond onaangelijnd naast zich. Op een afstand van 2 meter van de dienstauto laat de
      geleider de verdachte halt houden.

      De geleider laat zijn hond onaangelijnd ter bewaking bij de verdachte achter, waarna hij de deur van de dienstauto
      opent. De verdachte doet hierna een vluchtpoging. De hond moet de verdachte zonder dat hij daartoe een commando
      krijgt resoluut tot staan brengen en al of niet op commando loslaten en overgaan tot bewaken. Vervolgens gaat de
      geleider naar zijn hond en verwijdert zich van de verdachte waarna de oefening is beëindigd.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikelc
  - number: d
    text: |-
      De diverse onderdelen kennen de navolgende maximum waardering:

      1. Surveilleren 5 punten

      2. Aanval 5 punten

      3. Bijten 5 punten

      4. Loslaten 5 punten

      5. Bewaken na het loslaten 5 punten

      6. Onderzoek 5 punten

      7. Bewaken tijdens onderzoek 5 punten

      8. Overbrengen 5 punten

      9. Bewaken voor tweede aanval 5 punten

      10. Tweede aanval 5 punten

      11. Bijten 5 punten

      12. Loslaten 5 punten

      13. Bewaken 5 punten

      Totaal 65 punten
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikeld
  - number: e
    text: |-
      Indien de eerste aanval (sub 2.) met 3 punten wordt gewaardeerd, dan mogen de onderdelen sub 1. tot en met 7., mits
      uitmuntend uitgevoerd, niet hoger worden gewaardeerd.

      Bijt de hond bij deze eerste aanvalsoefening dan wel bij een herhaalde poging niet direct in, dan worden voor de
      gehele oefening geen punten toegekend.

      Voor de aanvalsoefening ná het overbrengen wordt eenzelfde waardering toegepast met dien verstande dat er gekort
      zal worden na het onderdeel ’overbrengen’ sub 8. De voorgaande onderdelen sub 1. tot en met 7. kunnen dan, mits
      uitmuntend uitgevoerd en niet beperkt door de puntentelling naar aanleiding van de eerste aanval nog met 5 punten
      worden gewaardeerd.

      Na het onderdeel overbrengen laat de geleider zijn hond ter bewaking bij de verdachte achter. De geleider gaat naar
      de auto om de deur te openen. Indien de hond de verdachte te vroeg aanvalt en wel voordat de geleider de deur van
      de auto heeft geopend, wordt de aanval met maximaal 3 punten gewaardeerd. De geleider opent vervolgens de deur en
      geeft daarna het commando voor het loslaten. De verdachte vlucht niet meer.

      Voor iedere beet tijdens bewaken, onderzoek of overbrengen wordt per beet 1 punt afgetrokken; zie ook paragraaf
      IV.4.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikele
  - number: a
    text: |-
      De hond wordt ingezet tegen een verdachte die van een vuurwapen en een werpstuk gebruik maakt. De hond zal hier
      zijn moed en beheersbaarheid moeten tonen. De afstand waarover de oefening plaatsvindt, bedraagt maximaal 60 meter.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikela
  - number: b
    text: |-
      Tijdens de surveillance ontdekt de geleider met zijn hond een zich verdacht ophoudende persoon. Deze schiet met een
      vuurwapen in de richting van de geleider.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikelb
  - number: c
    text: |-
      De geleider gaat na de beschieting met zijn hond in dekking. De hond krijgt vanuit deze positie van de geleider
      opdracht om de verdachte tot staan te brengen. Tijdens de achtervolging en/of het begin van de aanval wordt er
      nogmaals geschoten in de richting van de hond. Als de hond de verdachte tot op ongeveer 10 meter is genaderd,
      gooit de verdachte een plastic jerrycan (inhoud 5 liter) in de richting van de hond en vlucht verder. De hond moet
      de verdachte resoluut tot staan brengen. De geleider commandeert de verdachte het vuurwapen te laten vallen. De
      verdachte geeft zich na het laten vallen van het vuurwapen over. De geleider dient het vuurwapen in beslag te nemen
      en op de voorgeschreven wijze veilig te stellen.

      De geleider houdt de verdachte aan, waarna hij een gedegen onderzoek aan de kleding instelt. Tijdens dit onderzoek
      ligt de hond op ongeveer 3 meter achter de verdachte. De geleider draagt er zorg voor dat hij niet tussen de hond
      en de verdachte komt.

      Na het onderzoek wordt met medeneming van het inbeslaggenomen pistool de verdachte overgebracht naar een
      gereedstaande dienstauto. Voordat de verdachte wordt overgebracht geeft de geleider duidelijk de richting
      aan waarheen de verdachte moet lopen. De geleider volgt op ongeveer 2 meter achter de verdachte met zijn hond
      onaangelijnd naast zich. Op een afstand van 2 meter van de dienstauto laat de geleider de verdachte halt houden.

      De geleider laat zijn hond onaangelijnd ter bewaking bij de verdachte achter en opent de deur van de dienstauto.
      Vervolgens keert de geleider terug naar zijn hond. Tijdens het naderen valt de verdachte de geleider aan. De hond
      moet uit eigener beweging de verdachte aanvallen en vervolgens al of niet op commando loslaten en overgaan tot
      bewaken zodra de verdachte zich heeft overgegeven. Hierna gaat de geleider naar zijn hond en verwijdert zich van de
      verdachte waarna de oefening is beëindigd.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikelc
  - number: d
    text: |-
      De diverse onderdelen kennen de navolgende maximum waardering:

      1. Aanval 5 punten

      2. Surveilleren 5 punten

      3. Bijten 5 punten

      4. Loslaten 5 punten

      5. Bewaken na het loslaten 5 punten

      6. Onderzoek 5 punten

      7. Bewaken tijdens onderzoek 5 punten

      8. Overbrengen 5 punten

      9. bewaken voor tweede aanval/verdedigen 5 punten

      10. Tweede aanval/verdedigen 5 punten

      11. Bijten 5 punten

      12. Loslaten 5 punten

      13. Bewaken 5 punten

      Totaal 65 punten
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikeld
  - number: e
    text: |-
      Indien de eerste aanval (sub 2.) met 3 punten wordt gewaardeerd, dan mogen de onderdelen sub 1. tot en met 8., mits
      uitmuntend uitgevoerd, niet hoger worden gewaardeerd. Bijt de hond bij deze aanval of bij een herhaalde aanval niet
      direct in, dan worden voor de gehele oefening geen punten toegekend.

      In geval het onderdeel tweede aanval/verdedigen na het overbrengen met 3 punten wordt gewaardeerd, dan mogen
      de resterende onderdelen sub 9. tot en met 11., mits uitmuntend uitgevoerd, niet hoger worden gewaardeerd. De
      onderdelen sub 1. tot en met 8. kunnen dan, mits uitmuntend uitgevoerd en niet beperkt door de puntentelling naar
      aanleiding van de eerste aanval nog met 5 punten worden gewaardeerd.

      Na het onderdeel overbrengen laat de geleider zijn hond ter bewaking bij de verdachte achter. De geleider gaat naar
      de auto om de deur te openen. Indien de hond de verdachte te vroeg aanvalt en wel voordat de geleider de deur van
      de auto heeft geopend, wordt de aanval met maximaal 3 punten gewaardeerd. De geleider opent de deur en geeft hierna
      het commando tot loslaten. Het verdedigen vindt dan niet meer plaats.

      Voor iedere beet tijdens het bewaken, het onderzoek of het overbrengen wordt per beet 1 punt afgetrokken; zie ook
      paragraaf IV.4.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikele
  - number: a
    text: |-
      De hond wordt ingezet tegen een verdachte die zich op een gladde vloer bevindt op een afstand van maximaal 10
      meter.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikela
  - number: b
    text: |-
      In een lokatie met een gladde vloer is een verdachte aanwezig. De geleider gaat op aanwijzing van een lid van
      de keuringscommissie met zijn hond aangelijnd naar binnen. Op dat moment zal de verdachte een voorwerp pakken en
      enkele bedreigingen tegen de geleider uiten.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikelb
  - number: c
    text: |-
      De geleider sommeert tweemaal: ’Halt politie, geeft u zich over of de hond wordt ingezet.’. De verdachte voldoet
      niet aan de sommatie. De geleider zet hierna zijn hond onaangelijnd aanvallend in. Nadat de hond de verdachte heeft
      aangevallen geeft deze zich over en moet de hond al of niet op commando loslaten en overgaan tot bewaken. Hierna
      gaat de geleider naar zijn hond en verwijdert zich van de verdachte waarna de oefening is beëindigd.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikelc
  - number: d
    text: |-
      De diverse onderdelen kennen de navolgende maximum waardering:

      1. Aanval 5 punten

      2. Bijten 5 punten

      3. Loslaten 5 punten

      4. bewaken 5 punten

      Totaal 20 punten
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikeld
  - number: e
    text: |-
      Indien de aanval met 3 punten wordt gewaardeerd, dan mogen de overige onderdelen, mits uitmuntend uitgevoerd niet
      hoger worden gewaardeerd.

      In geval het onderdeel aanval met minder dan 3 punten wordt gewaardeerd, dan zal voor de gehele oefening geen
      puntenwaardering plaatsvinden; zie ook paragraaf IV.4.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikele
  - number: a
    text: |-
      De hond wordt ingezet op een vluchtende verdachte, die nadat de hond is ingezet zich overgeeft en stil gaat staan.
      De hond moet zijn beheersbaarheid tonen.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikela
  - number: b
    text: |-
      Als de hond is ingezet en de vluchtende verdachte stil is gaan staan en zich overgeeft, moet de hond als hij bij de
      verdachte is aangekomen direct overgaan tot bewaken.

      Nadat de hond bij de verdachte is aangekomen, mag de geleider tot tweemaal toe een commando tot niet bijten geven.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikelb
  - number: c
    text: |-
      Tijdens de surveillance ontdekt de geleider met zijn hond - op een afstand van minimaal 60 meter en maximaal 100
      meter - iemand die even tevoren een misdrijf heeft gepleegd. De geleider roept de verdachte aan met de woorden:
      ’Halt politie, geeft u zich over of de hond wordt ingezet.’ Hieraan wordt, ook na herhaling, door de verdachte geen
      gevolg gegeven. Vervolgens geeft de geleider zijn hond de opdracht de verdachte tot staan te brengen. De geleider
      volgt zijn hond. Als de hond-in-achtervolging de verdachte tot op ongeveer 30 meter is genaderd, geeft de verdachte
      zich over door zich om te draaien en stil te gaan staan. Als de hond bij de verdachte is aangekomen, gaat de hond
      onmiddellijk over tot bewaking.

      Na de aanhouding stelt de geleider een gedegen onderzoek aan de kleding in. Tijdens dit onderzoek ligt de hond op
      ongeveer 2 meter van de verdachte en draagt de geleider er zorg voor dat hij niet tussen de hond en de verdachte
      komt.

      Na het onderzoek wordt de verdachte overgebracht naar een gereedstaande dienstauto. Voordat de verdachte wordt
      overgebracht geeft de geleider duidelijk de richting aan waarin de verdachte moet lopen. De geleider volgt met
      zijn hond onaangelijnd naast zich op ongeveer 2 meter afstand achter de verdachte. Op een afstand van 2 meter van
      de dienstauto laat de geleider de verdachte halt houden. De geleider laat de hond onaangelijnd ter bewaking bij de
      verdachte achter, waarna hij de deur van de dienstauto opent. De verdachte doet hierna een vluchtpoging. De hond
      moet de verdachte zonder dat hij daartoe het commando krijgt resoluut tot staan brengen en al of niet op commando
      loslaten en overgaan tot bewaken. Vervolgens gaat de geleider naar zijn hond en verwijdert zich van de verdachte
      waarna de oefening is beëindigd.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikelc
  - number: d
    text: |-
      De diverse onderdelen kennen de navolgende maximum waardering:

      1. Surveilleren 5 punten

      2. Achtervolging 5 punten

      3. Bewaken 5 punten

      4. Aanhouding 5 punten

      5. Onderzoek 5 punten

      6. Bewaken tijdens onderzoek 5 punten

      7. Overbrengen 5 punten

      8. Bewaken voor aanval 5 punten

      9. Aanval 5 punten

      10. Bijten 5 punten

      11. Loslaten 5 punten

      12. Bewaken 5 punten

      Totaal 60 punten
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikeld
  - number: e
    text: |-
      In geval van waardering van onderdeel 3. ’Bewaken’ met 3 punten mogen de onderdelen sub 1. tot en met 7. van deze
      oefening, mits uitmuntend uitgevoerd, niet hoger worden gewaardeerd.

      In geval onderdeel 9. ’Aanval’ een waardering krijgt van 3 punten mogen de onderdelen sub 9. tot en met 12. van
      deze oefening, mits uitmuntend uitgevoerd, niet hoger worden gewaardeerd dan met 3 punten. De voorgaande onderdelen
      kunnen dan, mits uitmuntend uitgevoerd en niet beperkt door de puntentelling naar aanleiding van onderdeel 3.
      ’Bewaken’ nog met 5 punten worden gewaardeerd.

      Indien de schijnaanval is geslaagd en de hond voor het overbrengen de verdachte zwaar bijt, vindt voor de oefening
      geen waardering plaats. Indien de hond na het overbrengen en voor het onderdeel 9 de verdachte bijt, vindt per keer
      aftrek van één punt plaats.

      Zie voor de beoordeling ook paragraaf IV.4.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikele
  - number: a
    text: |-
      De hond wordt ingezet op een vluchtende verdachte. De hond moet zijn beheersbaarheid tonen door op commando van
      zijn geleider direct terug te komen.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikela
  - number: b
    text: |-
      Als de geleider zijn hond terugroept, moet deze onmiddellijk aan dit commando voldoen en vlot naar de geleider
      terugkomen.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikelb
  - number: c
    text: |-
      Tijdens de surveillance ontdekt de geleider met zijn hond iemand - op een afstand van minimaal 60 meter en maximaal
      100 meter - die even tevoren een misdrijf heeft gepleegd. De geleider roept de verdachte aan met de woorden ’Halt
      politie, geeft u zich over of de hond wordt ingezet’. Hieraan wordt, ook na herhaling, door de verdachte geen
      gevolg gegeven. Vervolgens geeft de geleider zijn hond de opdracht de verdachte tot staan te brengen. De geleider
      volgt zijn hond ongeveer 25 meter. Als de hond in achtervolging is en de verdachte tot op ongeveer 30 meter is
      genaderd, roept de geleider zijn hond terug. Deze moet onmiddellijk aan dit commando voldoen en vlot naar de
      geleider terugkomen.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikelc
  - number: d
    text: |-
      De diverse onderdelen kennen de navolgende maximum waardering:

      1. Surveilleren 5 punten

      2. Achtervolging 5 punten

      3. Terugkeren 5 punten

      Totaal 15 punten
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikeld
  - number: e
    text: |-
      De geleider mag de achtervolgende hond twee commando’s geven om terug te keren. Bij drie of vier commando’s is de
      waardering voor het terugkeren maximaal respectievelijk 4 of 3 punten. In geval van waardering van onderdeel 2.
      ’Achtervolging’ of onderdeel 3. ’Terugkeren’ met 3 punten mogen de andere onderdelen, mits uitmuntend uitgevoerd,
      niet hoger worden gewaardeerd dan met 3 punten.

      Indien de hond tijdens de oefening de verdachte bijt, vindt voor de gehele oefening geen waardering plaats.

      Zie voor de beoordeling van de onderdelen ook paragraaf IV.4.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikele
  - number: '1'
    text: |-
      Tijdens een surveillance dient een geleider duidelijke sommaties te geven, waarbij de hond zich naast de geleider
      bevindt. De surveillance mag geschieden aan een sliplijn. De hond draagt tijdens de oefeningen geen halsband.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikel1
  - number: '2'
    text: |-
      De beoordeling van een aanval begint zodra de hond is afgelijnd en eindigt zodra de hond zich heeft ingebeten. Bij
      een vluchtpoging dient de hond resoluut eigener beweging de verdachte aan te vallen en tot staan te brengen.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikel2
  - number: '3'
    text: Bijten op een arm of been maakt voor een beoordeling geen verschil.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikel3
  - number: '4'
    text: |-
      De geleider mag niet aan de verdachte of de hond komen, hij mag niet be-dreigend zijn en moet ’los’ commanderen op
      ongeveer 2 meter van de verdachte. De geleider mag maximaal 3 extra commando’s aan zijn hond geven.

      Laat de hond niet los, dan zal voor de gehele oefening geen waardering plaatsvinden
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikel4
  - number: '5'
    text: |-
      De hond dient attent bij de verdachte te blijven. Tijdens het onderzoek aan de kleding moet de hond zich op
      ongeveer 3 meter van de verdachte bevinden. De geleider mag zich niet tussen de verdachte en de hond begeven. De
      hond mag zich niet verplaatsen, niet gaan zitten en niet gaan staan. Verlaat de hond de eerst ingenomen plaats over
      een afstand van meer dan vijf meter, dan worden voor dit onderdeel geen punten toegekend.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikel5
  - number: '6'
    text: |-
      Na de aanhouding dient een gedegen onderzoek aan de kleding plaats te vinden. De verdachte wordt van achteren
      benaderd voordat tot daadwerkelijk fouilleren wordt overgegaan. Tijdens het fouilleren staat de geleider achter
      de verdachte.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikel6
  - number: '7'
    text: |-
      Alvorens de verdachte over te brengen moet de geleider hem een richting aangeven waarheen het overbrengen
      geschiedt. Hierna commandeert de geleider zijn hond met de verdachte voorwaarts te gaan. Tijdens het overbrengen
      dient de geleider met zijn hond onaangelijnd naast zich op ongeveer 2 meter achter de helper te blijven. Het
      overbrengen eindigt op een afstand van 2 meter van een gereedstaande dienstauto, waarna eventueel nog een oefening
      begint.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikel7
  - number: '8'
    text: |-
      Nabeten worden in mindering gebracht op het totaal aantal punten van de oefening tot een maximum van 5. Indien
      sprake is van meer dan vijf nabeten, dan wordt geen certificaat verstrekt.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikel8
  - number: '9'
    text: |-
      Extra commando’s, met uitzondering van het onderdeel ’Loslaten’ en de eerste twee terugkeercommando’s van het
      betreffende onderdeel in paragraaf IV.3.6., leiden per keer tot aftrek van 1 punt van het totaal van de oefening.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikel9
  - number: '10'
    text: |-
      In geval het onderdeel ’Aanval’ met minder dan 3 punten wordt gewaardeerd, zal voor de gehele oefening geen
      puntenwaardering plaatsvinden.

      In geval het de ’Tweede aanval’ in een oefening betreft, zal voor het resterende gedeelte van de oefening geen
      puntenwaardering plaatsvinden (N.B.: oefeningen 2,3,4 en 5 van taakdeel 3).
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikel10
  - number: '11'
    text: |-
      De geleider dient zich te houden aan de aanzeggingen en aanwijzingen van (het lid van) de keuringscommissie. Indien
      hij zich niet daaraan houdt, wordt hij gekort in de waardering voor de combinatie.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikel11
  - number: '12'
    text: |-
      Alle hiervoor in aanmerking komende oefeningen worden uitgevoerd met behulp van een pakwerker met uitzondering van
      het manrevieren. Deze oefening wordt ’in burger’ gedaan. In de daarvoor in aanmerking komende oefeningen treedt de
      helper op als verdachte.
    url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#Artikel12
