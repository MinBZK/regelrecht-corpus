  text: |-
    Gelet op artikel 14 van het Besluit beheer regionale politiekorpsen;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0010333/1999-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
             geleider:

              de ambtenaar van een regionaal politiekorps, aangesteld voor de uitvoering van de politietaak, die
      toestemming heeft van de regionaal korpsbeheerder om politiedienst te doen met een politiesurveillancehond;



            b
            politiesurveillancehond:

              de hond in eigendom van een politieregio waarvoor over een certificaat, als bedoeld in [artikel 8][ref1],
      wordt beschikt;



            c
            keuringsreglement:

              het reglement dat als bijlage bij deze regeling is opgenomen;



            d
             keuringseisen:

              de eisen die vermeld zijn in het keuringsreglement;



            e
            keuringscommissie:

              een keuringscommissie, als bedoeld in [artikel 3, eerste lid][ref2];



            f
             rijksgecomitteerden:

              de functionarissen, bedoeld in [artikel 4, eerste lid][ref3];



            g
            de ministers:

              de Minister van Binnenlandse Zaken en Koninkrijksrelaties en de Minister van Justitie;



            h
            keuringsinstituut:

              de door de Raad van Hoofdcommissarissen getroffen voorziening voor de organisatie en administratie van
      keuringen


