preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het gewenst is bij de wet nieuwe voorschriften omtrent de
    volkshuisvesting vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002379/2003-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Voor de toepassing van deze wet wordt verstaan onder: bouwen: het plaatsen, het geheel of gedeeltelijk oprichten,
      vernieuwen of veranderen en het vergroten van een bouwwerk; slopen: het afbreken van een bouwwerk of van een
      gedeelte daarvan; gebouw: elk bouwwerk, dat een voor mensen toegankelijke overdekte geheel of gedeeltelijk
      met wanden omsloten ruimte vormt; woonkeet: een loods, keet of andere soortgelijke inrichting, bestemd om te
      voorzien in een tijdelijke behoefte aan woongelegenheid; bestemmingsplan: een bestemmingsplan als bedoeld in de
      [Wet op de Ruimtelijke Ordening][ref1]; rooilijn: de lijn die, behoudens toegelaten afwijkingen bij het bouwen
      aan de wegzijde (voorgevelrooilijn) of aan de van de weg afgekeerde zijde (achtergevelrooilijn) niet mag worden
      overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0002375
    url: https://wetten.overheid.nl/BWBR0002379/2003-01-01#Artikel1
    references:
