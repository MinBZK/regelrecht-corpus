  - number: '69'
    text: |-
      1 Wij kunnen bij algemene maatregel van bestuur bepalen, dat ten behoeve van de in [artikel 63][ref1] omschreven
      doeleinden te verlenen geldelijke steun moet worden aangevraagd door tussenkomst van een door Onze Minister van
      Volkshuisvesting en Bouwnijverheid toegelaten bemiddelend orgaan. In die algemene maatregel van bestuur worden
      voorschriften gegeven betreffende de toelating. Daarbij kan worden voorgeschreven, dat de akte van oprichting of
      de statuten van het bemiddelend orgaan dienen te bepalen, dat bij liquidatie van dit orgaan de vereffening - voor
      zover nodig in afwijking van het bepaalde in [artikel 55](onbekend) - zal geschieden door een of meer door de
      Verzekeringskamer aan te wijzen vereffenaars.

      2 De Verzekeringskamer is belast met het toezicht op de toegelaten bemiddelende organen en is bevoegd de toelating,
      bedoeld in het eerste lid, bij met redenen omkleed besluit in te trekken, een en ander overeenkomstig bij algemene
      maatregel van bestuur te stellen nadere regelen.

      3 Tegen een besluit van de Verzekeringskamer tot intrekking van de toelating, bedoeld in het eerste lid, kan het
      bemiddelend orgaan binnen één maand nadat het afschrift van het besluit verzonden is bij Ons beroep instellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002379#Artikel63
