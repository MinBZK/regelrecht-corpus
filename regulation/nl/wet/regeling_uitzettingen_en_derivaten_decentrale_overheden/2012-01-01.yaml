        artikel: '15.47'
  - number: '2'
    text: |-
      1 Openbare lichamen zetten, al dan niet tegen waardepapieren, slechts gelden uit bij en gaan slechts verbintenissen
      met betrekking tot financiële derivaten aan met financiële ondernemingen die:

      a. gevestigd zijn in een lidstaat die ten minste beschikt over een AA-rating afgegeven door ten minste twee
      ratingbureaus; en

      b. voor henzelf of voor de door hen uitgegeven waardepapieren kunnen aantonen dat ze ten minste over een AA-
      minusrating beschikken, afgegeven door ten minste twee ratingbureaus.

      2 Indien de gelden worden uitgezet of de verbintenissen met betrekking tot financiële derivaten worden aangegaan
      voor een periode van minder dan drie maanden, tonen deze financiële ondernemingen aan dat ze, in afwijking van het
      eerste lid, onderdeel b, voor henzelf of voor de door hen uitgegeven waardepapieren ten minste over een A-rating,
      afgegeven door ten minste twee ratingbureaus beschikken.

      3 Het eerste en tweede lid zijn niet van toepassing op uitzettingen tegen waardepapieren waarvoor een
      solvabiliteitsratio van 0 procent geldt.
    url: https://wetten.overheid.nl/BWBR0012076/2012-01-01#Artikel2
  - number: 2a
    text: |-
      1 Openbare lichamen gaan geen leningen aan met het enkele doel de aangetrokken gelden tegen een hoger rendement uit
      te zetten.

      2 Openbare lichamen zetten tijdelijk overtollige gelden van aangetrokken leningen voor projectfinanciering
      uitsluitend uit bij de financiële onderneming waar deze leningen zijn aangegaan, onverminderd
      [artikel 2, eerste en tweede lid][ref1].

      3 Indien een openbaar lichaam een nettingovereenkomst heeft afgesloten met een financiële onderneming met
      betrekking tot het uitzetten van tijdelijk overtollige gelden van aangetrokken leningen voor projectfinanciering
      als bedoeld in het tweede lid, is [artikel 2, eerste en tweede lid][ref2], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012076#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012076#Artikel2
    url: https://wetten.overheid.nl/BWBR0012076/2012-01-01#Artikel2a
    references:
