  - number: '4'
    text: |-
      1 Derivaten worden uitsluitend gebruikt ter beperking van financiële risico's. Dit houdt in dat geen open posities
      worden ingenomen. Derivaten worden afgesloten met een instelling die voldoet aan [artikel 2][ref1];

      2 In afwijking van het eerste lid, laatste volzin, kunnen derivaten ook worden afgesloten op een gereglementeerde
      markt in de Europese Economische Ruimte, zoals bedoeld in de [Richtlijn 93/22/EEG](31993L0022) van de Raad van 10
      mei 1993 betreffende het verrichten van diensten op het gebied van beleggingen in effecten in een lidstaat van de
      Europese Economische Ruimte onder toezicht staande effecteninstelling.

      Een wijziging van deze Richtlijn gaat voor de toepassing van deze regeling gelden met ingang van de dag waarop aan
      de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0012076#Artikel2
