        artikel: '2'
  - number: '3'
    text: |-
      Openbare lichamen als bedoeld in [artikel 1, onderdeel a, van de wet][ref1], zetten uitsluitend gelden uit in de
      vorm van:

      a. producten waarbij de hoofdsom tenminste aan het einde van de looptijd intact is, uitgezet bij een instelling die
      voldoet aan [artikel 2][ref2];

      b. vastrentende waarden, uitgegeven door een instelling die voldoet aan [artikel 2][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011987#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0012076#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0012076#Artikel2
    url: https://wetten.overheid.nl/BWBR0012076/2012-01-01#Artikel3
    references:
