  - number: 3a
    text: |-
      1 Nazorgfondsen mogen, in afwijking van [artikel 3][ref1], gelden uitzetten in de vorm van beleggingen in aandelen
      die genoteerd zijn aan een van overheidswege toegelaten effectenbeurs en in onroerend goedfondsen die genoteerd
      zijn aan een van overheidswege toegelaten effectenbeurs, mits zeker wordt gesteld dat de hoofdsom, gecorrigeerd
      voor inflatie, ten minste aan het einde van dertig jaar intact is door middel van:

      a. vastrentende waarden, uitgegeven door een instelling die voldoet aan [artikel 2][ref2], of

      b. overige uitzettingen tegen rente bij een instelling die voldoet aan [artikel 2][ref3].

      2 Voor de bepaling van het gedeelte van de portefeuille dat aangehouden moet worden in de vorm van uitzettingen als
      bedoeld in het eerste lid onder a en b, geldt een nominale rekenrente van 5% en een inflatiecorrectie van 2%.


      [ref1]: https://wetten.overheid.nl/BWBR0012076#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012076#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0012076#Artikel2
