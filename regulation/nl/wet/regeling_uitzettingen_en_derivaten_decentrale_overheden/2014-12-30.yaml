    Gelet op artikel 2, tweede lid, van de Wet financiering decentrale overheden,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012076/2014-12-30#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *de wet:* de [Wet financiering decentrale overheden][ref1];

      b. *lidstaat:* staat die lid is van de Europese Unie of een andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte;

      c. *financiële onderneming:* een onderneming die in een lidstaat het bedrijf van bank mag uitoefenen,
      beleggingsdiensten mag verlenen, beleggingsinstellingen mag beheren, rechten van deelneming in een
      beleggingsmaatschappij mag aanbieden, of het bedrijf van verzekeraar mag uitoefenen.

      d. *solvabiliteitsratio:* het in een lidstaat voor een financiële onderneming voorgeschreven minimumniveau
      aansprakelijk vermogen tegenover aangehouden naar risicograad gewogen activum;

      e. *vastrentende waarden:* openbare en onderhandse leningen;

      f. *nazorgfondsen:* fondsen als bedoeld in [artikel 15.47 van de Wet Milieubeheer][ref2].

      g. *rating:* taxatie van de kredietwaardigheid van een financiële onderneming of een land, bepaald door een
      ratingbureau;

      h. *nettingovereenkomst:* een overeenkomst op grond waarvan de wederzijdse verplichtingen tussen partijen verrekend
      worden waardoor wordt bepaald wat de ene partij per saldo aan de andere partij verschuldigd is;

      i. *waardepapieren:* documenten met een geldswaarde, zoals een bewijs van een aandeel of obligatie;

      k. *rentecap:* financieel derivaat waarbij de koper gedurende een in de overeenkomst overeengekomen renteperiode
      van de verkoper een geldsom ontvangt indien de variabele rente zich boven een overeengekomen rentepercentage
      beweegt;

      l. *renteswap:* financieel derivaat waarbij gedurende een overeengekomen periode kasstromen in de vorm van
      rentebetalingen worden uitgewisseld;

      m. *payer swap:* renteswap waarbij de betaler een vaste rente over de nominale waarde betaalt en een variabele
      rente over de nominale waarde ontvangt;

      n. *receiver swap:* renteswap waarbij de betaler een variabele rente over de nominale waarde betaalt en een vaste
      rente over de nominale waarde ontvangt;

      o. *forward starting swap:* payer- of receiver swap met een overeengekomen toekomstige begindatum;

      p. *swaption:* financieel derivaat dat de koper gedurende een bepaalde periode of op een bepaald moment het recht
      geeft om onder bepaalde voorwaarden een renteswap af te sluiten;

      q. *niet-effectieve positie:* situatie waarin de looptijd en de onderliggende waarde van een financieel derivaat
      niet overeenkomt met de financieringsbehoefte waaraan het derivaat wordt toegerekend;

      r. *financieringsbehoefte:* een lening, groep leningen of een nog aan te trekken lening respectievelijk groep
      leningen.


