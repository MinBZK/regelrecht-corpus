  - number: '4'
    text: |-
      1 Openbare lichamen hanteren financiële derivaten uitsluitend ter beperking van financiële risico’s en nemen geen
      niet-effectieve positie in.

      2 Financiële derivaten worden door openbare lichamen uitsluitend afgesloten met een financiële
      onderneming als bedoeld in [artikel 2, eerste lid][ref1], of op een gereglementeerde markt, bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref2], in een van de staten die partij zijn bij de Overeenkomst
      betreffende de Europese Economische Ruimte.

      3 Openbare lichamen hanteren uitsluitend rentecaps, payer swaps, forward start payer swaps of swaptions.

      4 Bijstortverplichtingen worden alleen overeengekomen indien de bijstortverplichting op beide partijen of
      uitsluitend op de financiële onderneming rust.

      5 Indien een niet-effectieve positie ontstaat, nemen openbare lichamen de noodzakelijke maatregelen om deze binnen
      een redelijke termijn ongedaan te maken. Hiervoor kan een openbaar lichaam, in afwijking van het derde lid, een
      receiver swap hanteren.


