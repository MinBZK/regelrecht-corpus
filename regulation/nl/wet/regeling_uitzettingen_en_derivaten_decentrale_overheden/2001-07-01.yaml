        artikel: '15'
  - number: '2'
    text: |-
      Bij het uitzetten van gelden, alsmede bij het afsluiten van derivaten door openbare lichamen als bedoeld in
      [artikel 1, onderdeel a, van de wet][ref1], voldoen de tegenpartijen waarmee transacties terzake worden afgesloten
      aan onderdeel a, b of c:


      [ref1]: https://wetten.overheid.nl/BWBR0011987#Artikel1
    url: https://wetten.overheid.nl/BWBR0012076/2001-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011987
        artikel: '1'
  - number: 2.a
    text: |-
      financiële instellingen of door financiële instellingen uitgegeven waardepapier met minimaal een A rating,
      afgegeven door tenminste één gezaghebbende rating agency;
    url: https://wetten.overheid.nl/BWBR0012076/2001-07-01#Artikel2
  - number: 2.b
    text: instellingen, voor wiens waardepapier een solvabiliteitsratio van 0% geldt;
    url: https://wetten.overheid.nl/BWBR0012076/2001-07-01#Artikel2
  - number: 2.c
    text: |-
      financiële instellingen, met een kredietwaardigheid vergelijkbaar met het gestelde in onderdeel a, voor zover
      vastgelegd en onderbouwd in het financieringsstatuut en de begroting en het jaarverslag.
    url: https://wetten.overheid.nl/BWBR0012076/2001-07-01#Artikel2
  - number: '3'
    text: |-
      Openbare lichamen als bedoeld in [artikel 1, onderdeel a, van de wet][ref1], zetten uitsluitend gelden uit in de
      vorm van:


      [ref1]: https://wetten.overheid.nl/BWBR0011987#Artikel1
    url: https://wetten.overheid.nl/BWBR0012076/2001-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011987
        artikel: '1'
  - number: 3.a
    text: |-
      producten waarbij de hoofdsom tenminste aan het einde van de looptijd intact is, uitgezet bij een instelling die
      voldoet aan [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012076#Artikel2
    url: https://wetten.overheid.nl/BWBR0012076/2001-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012076
        artikel: '2'
  - number: 3.b
    text: |-
      vastrentende waarden, uitgegeven door een instelling die voldoet aan [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012076#Artikel2
    url: https://wetten.overheid.nl/BWBR0012076/2001-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012076
        artikel: '2'
  - number: 3a.1
    text: |-
      Nazorgfondsen mogen, in afwijking van [artikel 3][ref1], gelden uitzetten in de vorm van beleggingen in aandelen
      die genoteerd zijn aan een van overheidswege toegelaten effectenbeurs en in onroerend goedfondsen die genoteerd
      zijn aan een van overheidswege toegelaten effectenbeurs, mits zeker wordt gesteld dat de hoofdsom, gecorrigeerd
      voor inflatie, ten minste aan het einde van dertig jaar intact is door middel van:


      [ref1]: https://wetten.overheid.nl/BWBR0012076#Artikel3
    url: https://wetten.overheid.nl/BWBR0012076/2001-07-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0012076
        artikel: '3'
  - number: 3a.1.a
    text: |-
      vastrentende waarden, uitgegeven door een instelling die voldoet aan [artikel 2][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0012076#Artikel2
    url: https://wetten.overheid.nl/BWBR0012076/2001-07-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0012076
        artikel: '2'
  - number: 3a.1.b
    text: |-
      overige uitzettingen tegen rente bij een instelling die voldoet aan [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012076#Artikel2
    url: https://wetten.overheid.nl/BWBR0012076/2001-07-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0012076
        artikel: '2'
  - number: 3a.2
    text: |-
      Voor de bepaling van het gedeelte van de portefeuille dat aangehouden moet worden in de vorm van uitzettingen als
      bedoeld in het eerste lid onder a en b, geldt een nominale rekenrente van 5% en een inflatiecorrectie van 2%.
    url: https://wetten.overheid.nl/BWBR0012076/2001-07-01#Artikel3a
  - number: '4.1'
    text: |-
      Derivaten worden uitsluitend gebruikt ter beperking van financiële risico's. Dit houdt in dat geen open posities
      worden ingenomen. Derivaten worden afgesloten met een instelling die voldoet aan [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012076#Artikel2
    url: https://wetten.overheid.nl/BWBR0012076/2001-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012076
        artikel: '2'
  - number: '4.2'
    text: |-
      In afwijking van het eerste lid, laatste volzin, kunnen derivaten ook worden afgesloten op een gereglementeerde
      markt in de Europese Economische Ruimte, zoals bedoeld in de [Richtlijn 93/22/EEG](31993L0022) van de Raad van 10
      mei 1993 betreffende het verrichten van diensten op het gebied van beleggingen in effecten in een lidstaat van de
      Europese Economische Ruimte onder toezicht staande effecteninstelling. Een wijziging van deze Richtlijn gaat voor
      de toepassing van deze regeling gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering
      moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0012076/2001-07-01#Artikel4
  - number: '5'
    text: |-
      Deze regeling treedt in werking met ingang van de datum waarop de [Wet financiering decentrale overheden][ref1] in
      werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0011987
    url: https://wetten.overheid.nl/BWBR0012076/2001-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011987
  - number: '6'
    text: 'Deze regeling wordt aangehaald als: Regeling uitzettingen en derivaten decentrale overheden.'
    url: https://wetten.overheid.nl/BWBR0012076/2001-07-01#Artikel6
