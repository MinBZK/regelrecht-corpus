  text: |-
    Handelende in overeenstemming met de Minister van Binnenlandse Zaken en Koninkrijksrelaties en de Staatssecretaris
    van Verkeer en Waterstaat;

    Gelet op artikel 2, tweede lid, van de Wet financiering decentrale overheden,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012076/2001-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a
            de wet:

              de [Wet financiering decentrale overheden][ref1];



            b
            financiële instelling:

              een instelling die aan één van onderstaande bepalingen voldoet:
              een kredietinstelling die in Nederland op grond van de Wet toezicht kredietwezen 1995, of in een andere
      lidstaat van de Europese Economische Ruimte onder toezicht staat;
      een effecteninstelling die in Nederland op grond van de [Wet toezicht effectenverkeer 1995][ref2], of in een andere
      lidstaat van de Europese Economische Ruimte onder toezicht staat;
      een beleggingsinstelling die in Nederland op grond van de [Wet toezicht beleggingsinstellingen][ref3], of in een
      andere lidstaat van de Europese Economische Ruimte onder toezicht staat;
      een verzekeraar die in Nederland op grond van de [Wet toezicht verzekeringsbedrijf 1993][ref4], de
      [Wet toezicht natura-uitvaartverzekeringsbedrijf][ref5], of in een andere lidstaat van de Europese Economische
      Ruimte onder toezicht staat;
      een pensioenfonds dat in Nederland op grond van de Pensioen- en spaarfondsenwet onder toezicht staat;



            c
            solvabiliteitsratio:

              door een bancaire toezichthoudende autoriteit in een lidstaat van de Europese Economische Ruimte
      voorgeschreven minimumniveau aansprakelijk vermogen tegenover aangehouden naar risicograad gewogen activum;



            d
             vastrentende waarden:

              openbare en onderhandse leningen;



            e
            nazorgfondsen:

              fondsen als bedoeld in [artikel 15.47 van de Wet Milieubeheer][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0011987
      [ref2]: https://wetten.overheid.nl/BWBR0007657
