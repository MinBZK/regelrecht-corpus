  - number: 1a
    text: |-
      Deze regeling berust mede op de [artikelen 19, negende lid, van de Werkloosheidswet][ref1] en
      [6, zesde lid, van de Wet inkomensvoorziening oudere werklozen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0024394#Artikel6
    url: https://wetten.overheid.nl/BWBR0016004/2017-10-27#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0024394
        artikel: '6'
  - number: '2'
    text: |-
      1 De werknemer kan per kalenderjaar gedurende 20 dagen vakantie genieten met behoud van zijn recht op uitkering op
      grond van de [Werkloosheidswet][ref1].

      2 De uitkeringsgerechtigde kan per kalenderjaar gedurende 20 dagen vakantie genieten met behoud van zijn recht op
      uitkering op grond van de [Wet inkomensvoorziening oudere werklozen][ref2].

      3 In afwijking van het eerste lid geldt een termijn van 65 dagen voor de werknemer, bedoeld in
      [artikel 7 van de Regeling vrijstelling verplichtingen sociale zekerheidswetten][ref3].

      4 In afwijking van het tweede lid geldt een termijn van 65 dagen voor de IOW-gerechtigde, bedoeld in
      [artikel 7 van de Regeling vrijstelling verplichtingen sociale zekerheidswetten][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0024394
      [ref3]: https://wetten.overheid.nl/BWBR0019305#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0019305#Artikel7
    url: https://wetten.overheid.nl/BWBR0016004/2017-10-27#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
