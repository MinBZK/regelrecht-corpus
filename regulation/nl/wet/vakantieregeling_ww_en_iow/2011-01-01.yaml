        bwb_id: BWBR0024394
        artikel: '6'
  - number: '2'
    text: |-
      1 De werknemer kan per kalenderjaar gedurende 20 dagen vakantie genieten met behoud van zijn recht op uitkering op
      grond van de [Werkloosheidswet][ref1].

      2 De uitkeringsgerechtigde kan per kalenderjaar gedurende 20 dagen vakantie genieten met behoud van zijn recht op
      uitkering op grond van de [Wet inkomensvoorziening oudere werklozen][ref2].

      3 In afwijking van het eerste lid geldt een termijn van 65 dagen voor de
      werknemer, bedoeld in de [artikelen 5, eerste en tweede lid][ref3], [7][ref4] en
      [8, eerste lid, van de Regeling vrijstelling verplichtingen sociale zekerheidswetten][ref5].

      4 In afwijking van het tweede lid geldt een termijn van 65 dagen voor de IOW-gerechtigde, bedoeld in de
      [artikelen 5, tweede lid][ref6], en [7 van de Regeling vrijstelling verplichtingen sociale zekerheidswetten][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
