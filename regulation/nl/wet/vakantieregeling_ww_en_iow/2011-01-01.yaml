  - number: '3'
    text: |-
      1 Op het aantal dagen, bedoeld in [artikel 2, eerste en derde lid][ref1], wordt in mindering gebracht:

      a. vijf maal het aantal hele weken voor de eerste werkloosheidsdag in het desbetreffende kalenderjaar, gedeeld
      door 13;

      b. het aantal dagen waarop de werknemer in het desbetreffende kalenderjaar vakantie heeft genoten met behoud van
      zijn recht op uitkering op grond van de [Werkloosheidswet][ref2], met uitzondering van vakantiedagen die tevens
      nationale of christelijke feestdagen zijn.

      2 Op het aantal dagen, bedoeld in [artikel 2, tweede en vierde lid][ref3], wordt in mindering gebracht:

      a. vijf maal het aantal hele weken voor de eerste dag waarop recht op een uitkering op grond van de
      [Wet inkomensvoorziening oudere werklozen][ref4] bestond in het desbetreffende kalenderjaar, gedeeld door 13;

      b. het aantal dagen waarop de werknemer in het desbetreffende kalenderjaar vakantie heeft genoten met behoud van
      zijn recht op uitkering op grond van de [Wet inkomensvoorziening oudere werklozen][ref5], met uitzondering van
      vakantiedagen die tevens nationale of christelijke feestdagen zijn.


