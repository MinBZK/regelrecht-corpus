  - number: 1a
    text: |-
      Deze regeling berust mede op [artikel 6, zesde lid, van de Wet inkomensvoorziening oudere werklozen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel6
    url: https://wetten.overheid.nl/BWBR0016004/2011-01-01#Artikel1a
