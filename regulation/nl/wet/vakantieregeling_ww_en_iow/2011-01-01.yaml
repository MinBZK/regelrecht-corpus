  - number: '4'
    text: Het aantal dagen, berekend volgens de voorgaande artikelen, wordt rekenkundig op hele dagen afgerond.
    url: https://wetten.overheid.nl/BWBR0016004/2011-01-01#Artikel4
  - number: '5'
    text: |-
      De werknemer die op 31 december 2003 op grond van artikel 2, tweede lid, van de regeling van de Minister van
      Sociale Zaken en Werkgelegenheid van 23 januari 1992, nr. 92342 (Stcrt. 19), per kalenderjaar gedurende 13 weken
      vakantie kon genieten met behoud van zijn recht op uitkering op grond van de [Werkloosheidswet][ref1] kan, in
      afwijking van [artikel 2, eerste lid][ref2], in 2004 gedurende maximaal 65 dagen vakantie genieten met behoud van
      zijn recht op uitkering op grond van de Werkloosheidswet, voorzover hij voor de datum van inwerkingtreding van deze
      regeling verplichtingen daartoe is aangegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0016004#Artikel2
