preamble:
  text: |-
    Gelet op artikel 19, vijfde lid, van de Werkloosheidswet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0016004/2011-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Van vakantie genieten als bedoeld in [artikel 19, eerste lid, onderdeel j, van de Werkloosheidswet][ref1] en
      [artikel 6, eerste lid, onderdeel d, van de Wet inkomensvoorziening oudere werklozen][ref2] is sprake gedurende de
      periode waarover de werknemer of de uitkeringsgerechtigde:

      a. verklaart vakantie te genieten;

      b. niet verklaart vakantie te genieten, maar daarvan, gelet op de feitelijke omstandigheden, kennelijk sprake is.

      2 In deze regeling wordt verstaan onder dagen: maandag tot en met vrijdag danwel dinsdag tot en met zaterdag.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0024394#Artikel6
