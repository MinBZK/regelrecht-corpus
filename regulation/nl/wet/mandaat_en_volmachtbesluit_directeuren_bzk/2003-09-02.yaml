        bwb_id: BWBR0013171
        artikel: 8:1
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0013171
        artikel: 8:2
        paragraaf: '8'
  - number: 9:2
    text: |-
      1 De directeur Personeel en Organisatie is belast met het beheer van dit besluit.

      2 De secretaris-generaal, de diensthoofden en de directeuren, ieder voor zover het hem aangaat, zijn
      verantwoordelijk voor een juiste, volledige en tijdige aanlevering aan de directeur Personeel en Organisatie van de
      gegevens die een goed beheer van dit besluit onderscheidenlijk het mandaat- en volmachtregister BZK mogelijk maken.

      3 Het beheer en de aanlevering van gegevens geschieden met inachtneming van de desbetreffende (richtlijnen inzake)
      administratieve organisatiebeschrijvingen.

      4 De directeur Personeel en Organisatie rapporteert jaarlijks aan de secretaris-generaal en de diensthoofden over
      het beheer van dit besluit.
    url: https://wetten.overheid.nl/BWBR0013171/2003-09-02#Artikel92
  - number: 9:3
    text: |-
      1 Wijziging van dit besluit is voorbehouden aan de secretaris-generaal.

      2 Wijziging van dit besluit geschiedt op voordracht van de directeur Personeel en Organisatie na advies van de
      directeur Financieel-Economische Zaken en de directeur Constitutionele Zaken en Wetgeving.
    url: https://wetten.overheid.nl/BWBR0013171/2003-09-02#Artikel93
  - number: 10:1
    text: Dit besluit treedt in werking met ingang van 1 januari 2002.
    url: https://wetten.overheid.nl/BWBR0013171/2003-09-02#Artikel101
  - number: 10:2
    text: 'Dit besluit wordt aangehaald als: Mandaat- en volmachtbesluit directeuren BZK (MV-besluit directeuren BZK).'
    url: https://wetten.overheid.nl/BWBR0013171/2003-09-02#Artikel102
