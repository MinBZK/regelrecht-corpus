  - number: 8:4
    text: |-
      1 De directeur legt op verzoek van een bewindspersoon, de secretaris-generaal of het diensthoofd mondeling of
      schriftelijk verantwoording af over de uitoefening van zijn mandaat en volmacht krachtens dit besluit.

      2 De gemandateerde of gevolmachtigde, bedoeld in [artikel 7:3][ref1], legt op verzoek van een bewindspersoon,
      de secretaris-generaal, het diensthoofd of de directeur mondeling of schriftelijk verantwoording af over de
      uitoefening van zijn mandaat en volmacht krachtens dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0013171#Artikel73
    url: https://wetten.overheid.nl/BWBR0013171/2003-09-02#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0013171
        artikel: 7:3
        paragraaf: '7'
  - number: 8:5
    text: |-
      1 De directeur onderscheidenlijk een op grond van of krachtens dit besluit gemandateerde en gevolmachtigde, is
      verantwoordelijk voor het bijhouden van een of meer doelmatig ingerichte administraties die inzicht bieden in
      het door en namens de directeur gevoerde financiële beheer en beheer van niet-geldelijke zaken op grond van diens
      mandaat en volmacht.

      2 De directeur Financieel-Economische Zaken en de directeur Accountantsdienst zijn bevoegd om de administraties,
      bedoeld in het eerste lid, te onderzoeken ten behoeve van de uitvoering van hun taken overeenkomstig het
      [Organisatiebesluit BZK][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013308
    url: https://wetten.overheid.nl/BWBR0013171/2003-09-02#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0013308
  - number: 8:6
    text: |-
      In gevallen waarin dit besluit niet voorziet, beslist de bewindspersoon die het aangaat, de secretaris-generaal of
      het diensthoofd over de verlening van mandaat en volmacht.
    url: https://wetten.overheid.nl/BWBR0013171/2003-09-02#Artikel86
  - number: 9:1
    text: |-
      Verlening en doorverlening van (onder)mandaat en volmacht op grond van of krachtens dit besluit wordt geregistreerd
      overeenkomstig de [artikelen 8:1][ref1] en [8:2][ref2] van het MV-besluit secretaris-generaal BZK.


      [ref1]: https://wetten.overheid.nl/BWBR0013171#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0013171#Artikel82
    url: https://wetten.overheid.nl/BWBR0013171/2003-09-02#Artikel91
    references:
