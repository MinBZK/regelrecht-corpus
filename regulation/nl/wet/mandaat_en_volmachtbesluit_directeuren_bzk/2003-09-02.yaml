preamble:
  text: |-
    Gelet op het Mandaat- en volmachtbesluit secretaris-generaal BZK en het Mandaat- en volmachtbesluit diensthoofden
    BZK;

    Gezien het advies van de Groepsondernemingsraad;

    Besluit
  url: https://wetten.overheid.nl/BWBR0013171/2003-09-02#ArtikelAanhef
articles:
  - number: 1:1
    text: |-
      In dit besluit wordt verstaan onder:



            ministerie:

              het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties;



            minister:

              de Minister van Binnenlandse Zaken en Koninkrijksrelaties;



            bewindspersoon:

              de Minister van Binnenlandse Zaken en Koninkrijksrelaties onderscheidenlijk de Staatssecretaris van
      Binnenlandse Zaken en Koninkrijksrelaties;









            stuk:

              een stuk dat een besluit inhoudt of een ander stuk dat wordt toegerekend aan een bewindspersoon;



            diensthoofd:

              de plaatsvervangend secretaris-generaal, een directeur-generaal, het hoofd van de Algemene Inlichtingen- en
      Veiligheidsdienst of het hoofd van de Inspectie Openbare Orde en Veiligheid van het ministerie.
    url: https://wetten.overheid.nl/BWBR0013171/2003-09-02#Artikel11
  - number: 1:2
    text: |-
      1 Onder directeur wordt in dit besluit mede verstaan: de leidinggevende van een in het
      [Organisatiebesluit BZK][ref1] genoemd dienstonderdeel dat deel uitmaakt van een directoraat-generaal, van de
      Centrale Stafdiensten, van de Algemene Inlichtingen- en Veiligheidsdienst of van de Inspectie Openbare Orde en
      Veiligheid en daaronder rechtstreeks ressorteert.

      2 Het eerste lid is niet van toepassing op het Korps landelijke politiediensten en de Informatie- en
      communicatietechnologie Organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0013308
    url: https://wetten.overheid.nl/BWBR0013171/2003-09-02#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0013308
  - number: 2:1
    text: |-
      1 De directeur is bevoegd om namens een bewindspersoon besluiten te nemen en stukken af te doen en te ondertekenen.

      2 De directeur is bevoegd om namens een bewindspersoon voor de Staat privaatrechtelijke rechtshandelingen te
      verrichten.

      3 De bevoegdheden, bedoeld in het eerste en tweede lid, worden aangeduid als: het mandaat en de volmacht van de
      directeur.
    url: https://wetten.overheid.nl/BWBR0013171/2003-09-02#Artikel21
  - number: 2:2
    text: |-
      Het mandaat en de volmacht van de directeur wordt uitgeoefend ten aanzien van aangelegenheden die naar
      het oordeel van de directeur en te zijner verantwoording behoren tot zijn werkterrein overeenkomstig het
      [Organisatiebesluit BZK][ref1] en die, onverminderd het bepaalde in het MV-besluit secretaris-generaal BZK, het MV-
      besluit diensthoofden BZK onderscheidenlijk dit besluit, redelijkerwijs niet behoren te worden voorgelegd aan een
      bewindspersoon, de secretaris-generaal of het diensthoofd die het aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0013308
    url: https://wetten.overheid.nl/BWBR0013171/2003-09-02#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0013308
  - number: 2:3
    text: |-
      Onverminderd het bepaalde in het MV-besluit secretaris-generaal BZK, het MV-besluit diensthoofden BZK
      onderscheidenlijk dit besluit, heeft het mandaat en de volmacht van de directeur in ieder geval betrekking op:

      a) de taken van de directeur en de onder de directeur ressorterende functionarissen en dienstonderdelen, genoemd
      in het [Organisatiebesluit BZK][ref1] en het daarop gebaseerde organisatiebesluit, en het uitoefenen van integraal
      management dienaangaande met inbegrip van aangelegenheden op organisatorisch, personeel, financieel en materieel
      gebied en aangelegenheden met betrekking tot het verrichten van privaatrechtelijke rechtshandelingen;

      b) het leiding geven aan de rechtstreeks onder de directeur ressorterende functionarissen;

      c) het optreden als bestuurder in de zin van de [Wet op de ondernemingsraden][ref2] in het overleg met de
      ondernemingsraad van het desbetreffende dienstonderdeel, voor zover het diensthoofd niet als zodanig optreedt;

      d) het vertegenwoordigen van een bewindspersoon namens de Staat in gerechtelijke procedures waarbij het
      dienstonderdeel is betrokken;

      e) het afnemen van de eed of de belofte van ambtenaren bij het dienstonderdeel waarover de directeur de leiding
      voert voor zover het een buitendienst of agentschap betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0013308
      [ref2]: https://wetten.overheid.nl/BWBR0002747
    url: https://wetten.overheid.nl/BWBR0013171/2003-09-02#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0013308
      - id: ref2
        bwb_id: BWBR0002747
  - number: 3:1
    text: |-
      De directeur Informatievoorziening is met inachtneming van dit besluit bevoegd om stukken af te doen en te
      ondertekenen met betrekking tot het aangaan van mantelovereenkomsten inzake departementale ICT-aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0013171/2003-09-02#Artikel31
  - number: 3:2
    text: |-
      De directeur Financieel-Economische Zaken is bevoegd om stukken af te doen en te ondertekenen in verband met de
      uitvoering van artikel 21 van de Compatibiliteitswet en het [Besluit taak FEZ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005333
    url: https://wetten.overheid.nl/BWBR0013171/2003-09-02#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005333
  - number: 3:3
    text: |-
      De directeur Personeel en Organisatie is met inachtneming van dit besluit bevoegd:

      a) tot het ondertekenen van procedurele stukken in het kader van de behandeling van bezwaarschriften tegen
      besluiten van of namens een bewindspersoon met betrekking tot een personele aangelegenheid;

      b) tot het inschakelen van de landsadvocaat voor ondersteuning of vertegenwoordiging van het ministerie inzake
      rechtspositionele vraagstukken;

      c) tot het namens de secretaris-generaal ondertekenen van stukken aan de Groepsondernemingsraad onderscheidenlijk
      het departementaal georganiseerd overleg;

      d) tot het ondertekenen van brieven met betrekking tot het voeren van de salarisadministratie bij de directie;

      e) tot het afdoen en ondertekenen van stukken met betrekking tot het aangaan van mantelovereenkomsten inzake
      organisatie-advisering, opleiding, scholing, training en assessments bij het ministerie, en overeenkomsten inzake
      departementale vervoersregelingen, arbeidsomstandigheden, bedrijfsmaatschappelijk werk en kinderopvang;

      f) tot het afdoen en ondertekenen van stukken met betrekking tot de vergoeding van representatiekosten op grond van
      het Besluit representatiekosten rijkspersoneel.
    url: https://wetten.overheid.nl/BWBR0013171/2003-09-02#Artikel33
  - number: 3:4
    text: |-
      De directeur Accountantsdienst is bevoegd om stukken af te doen en te ondertekenen in verband met de uitvoering van
      artikel 22 van de Compatibiliteitswet en het [Besluit taak DAD][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007535
    url: https://wetten.overheid.nl/BWBR0013171/2003-09-02#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0007535
  - number: 3:5
    text: |-
      De directeur Voorlichting en Communicatie is met inachtneming van dit besluit bevoegd om stukken af te doen en te
      ondertekenen met betrekking tot het aangaan van mantelovereenkomsten inzake publiekscampagnes en de inzet van media
      ten behoeve van departementale voorlichting en communicatie.
    url: https://wetten.overheid.nl/BWBR0013171/2003-09-02#Artikel35
  - number: 3:6
    text: |-
      De directeur Facilitaire Zaken is met inachtneming van dit besluit bevoegd om stukken af te doen en te
      ondertekenen met betrekking tot het aangaan van (mantel)overeenkomsten inzake departementale inkoop, bewaking en
      beveiliging, bedrijfshulpverlening, schoonmaak, vervoer, groenvoorziening en catering, en met betrekking tot de in
      [artikel 4:9, derde lid, van het Organisatiebesluit BZK][ref1] genoemde taken van de Centrale Directeur Inkoop.


      [ref1]: https://wetten.overheid.nl/BWBR0013308#Artikel49
    url: https://wetten.overheid.nl/BWBR0013171/2003-09-02#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0013308
        artikel: 4:9
  - number: '4'
    text: |-
      1 Ondertekening van besluiten en stukken op grond van het mandaat van de directeur vindt plaats op de volgende
      wijze:

        - (aanduiding bewindspersoon),
        - voor deze,
        - (aanduiding directeur),
        - (handtekening)
        - (naam)

      2 Bij ondertekening van besluiten en stukken op grond van de volmacht van de directeur wordt de aanduiding van de
      bewindspersoon voorafgegaan door: Namens de Staat der Nederlanden.
    url: https://wetten.overheid.nl/BWBR0013171/2003-09-02#Artikel4
  - number: 5:1
    text: |-
      Het mandaat en de volmacht van de directeur is niet van toepassing:

      a) indien bij wettelijk voorschrift anders is bepaald;

      b) indien de aard van de bevoegdheid of het stuk zich daartegen verzet;

      c) indien het een stuk betreft dat bij de ontvanger de indruk kan wekken dat de ondertekenaar persoonlijk een
      beslissing neemt die door een bewindspersoon behoort te worden genomen;

      d) op besluiten en stukken met betrekking tot politieke of maatschappelijke aangelegenheden van principiële aard;

      e) indien het een bezwaarschrift betreft dat gericht is tegen een besluit dat door het diensthoofd is genomen.
    url: https://wetten.overheid.nl/BWBR0013171/2003-09-02#Artikel51
  - number: 5:2
    text: |-
      Artikel 4:2, eerste en tweede lid, en artikel 4:3 van het MV-besluit secretaris-generaal BZK, inzake aan de
      bewindspersonen voorbehouden aangelegenheden, zijn van toepassing.
    url: https://wetten.overheid.nl/BWBR0013171/2003-09-02#Artikel52
  - number: 5:3
    text: |-
      1 [Artikel 5:3][ref1] van het MV-besluit diensthoofden BZK, inzake aan de secretaris-generaal voorbehouden
      aangelegenheden, is van toepassing.

      2 Het mandaat en de volmacht van de directeur is niet van toepassing op de aangelegenheden, bedoeld in
      [artikel 7:2][ref2] van het MV-besluit diensthoofden BZK.


      [ref1]: https://wetten.overheid.nl/BWBR0013171#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0013171#Artikel72
    url: https://wetten.overheid.nl/BWBR0013171/2003-09-02#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0013171
        artikel: 5:3
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0013171
        artikel: 7:2
        paragraaf: '7'
  - number: 5:4
    text: |-
      Het mandaat en de volmacht van de directeur is niet van toepassing voor zover het diensthoofd die het aangaat dit
      met toepassing van [artikel 7:1, tweede lid][ref1], van het MV-besluit diensthoofden BZK heeft bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0013171#Artikel71
    url: https://wetten.overheid.nl/BWBR0013171/2003-09-02#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0013171
        artikel: 7:1
        paragraaf: '7'
  - number: 5:5
    text: |-
      1 Het mandaat en de volmacht van de directeur met betrekking tot het aangaan van financiële verplichtingen en het
      doen van uitgaven is beperkt tot het budget dat aan de directeur ter beschikking is gesteld op basis van een door
      het diensthoofd en de directeur Financieel-Economische Zaken goedgekeurd bestedingsplan.

      2 De directeur is bevoegd om in afwijking van het eerste lid financiële verplichtingen aan te gaan en uitgaven
      te doen, voor zover aan hem daartoe uitdrukkelijk en schriftelijk mandaat is verleend door een bewindspersoon, de
      secretaris-generaal of het diensthoofd, met medeparaaf van de directeur Financieel-Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0013171/2003-09-02#Artikel55
  - number: 5:6
    text: |-
      Het buiteninvorderingstellen of kwijtschelden van een privaatrechtelijke vordering geschiedt met medeparaaf van of
      namens de directeur Financieel-Economische Zaken bij een bedrag van tenminste € 5.000,- en met inachtneming van de
      door de Minister van Financiën gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0013171/2003-09-02#Artikel56
  - number: 5:7
    text: |-
      Het aanstellen en tewerkstellen van een leidinggevende die onder de rechtstreekse leiding van een directeur valt,
      geschiedt in overeenstemming met het diensthoofd.
    url: https://wetten.overheid.nl/BWBR0013171/2003-09-02#Artikel57
  - number: '6'
    text: |-
      1 Bij tijdelijke afwezigheid of verhindering van de directeur wordt diens mandaat en volmacht volledig uitgeoefend
      door de plaatsvervangend directeur.

      2 Bij gelijktijdige tijdelijke afwezigheid of verhindering van de directeur en de plaatsvervangend directeur wordt
      het mandaat en de volmacht van de directeur bij wijze van waarneming volledig uitgeoefend door de functionaris die
      daartoe door de directeur in overeenstemming met het diensthoofd is aangewezen.

      3 Ondertekening van besluiten en stukken ingevolge dit artikel vindt plaats overeenkomstig [artikel 4][ref1], met
      dien verstande dat de handtekening voorafgegaan wordt door: b/a.


      [ref1]: https://wetten.overheid.nl/BWBR0013171#Artikel4
    url: https://wetten.overheid.nl/BWBR0013171/2003-09-02#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013171
        artikel: '4'
        paragraaf: '4'
  - number: 7:1
    text: |-
      De directeur is, voor zover niet anders is bepaald, bevoegd tot het verlenen van ondermandaat en het doorverlenen
      van zijn volmacht, respectievelijk tot het beperken of het intrekken daarvan, aan onder hem ressorterende
      functionarissen ten aanzien van aangelegenheden op hun werkterrein overeenkomstig het desbetreffende
      organisatiebesluit.
    url: https://wetten.overheid.nl/BWBR0013171/2003-09-02#Artikel71
  - number: 7:2
    text: |-
      Reeds op grond van het onderhavige besluit zijn, voor zover door de directeur met toepassing van
      [artikel 7:1][ref1] niet anders is bepaald, de rechtstreeks onder de directeur ressorterende leidinggevenden ten
      aanzien van de onder hen ressorterende functionarissen bevoegd tot:

      a) het vaststellen van het wekelijkse werkrooster;

      b) het verlenen van vakantieverlof;

      c) het verlenen van buitengewoon verlof van korte duur;

      d) het accorderen van binnenlandse dienstreizen en daarbij gebruikte vervoermiddel;

      e) het voeren respectievelijk de verslaglegging van het gesprek, bedoeld in
      [artikel 71 van het Algemeen Rijksambtenarenreglement][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013171#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel71
    url: https://wetten.overheid.nl/BWBR0013171/2003-09-02#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0013171
        artikel: 7:1
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '71'
  - number: 7:3
    text: |-
      De directeur kan, voor zover niet anders is bepaald, bij toepassing van de bevoegdheid, bedoeld in
      [artikel 7:1][ref1], tevens de bevoegdheid toekennen tot het verlenen van ondermandaat en het doorverlenen van de
      volmacht aan een rechtstreeks onder de gemandateerde of gevolmachtigde ressorterende functionaris ten aanzien van
      aangelegenheden op het werkterrein van de functionaris overeenkomstig het desbetreffende organisatiebesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0013171#Artikel71
    url: https://wetten.overheid.nl/BWBR0013171/2003-09-02#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0013171
        artikel: 7:1
        paragraaf: '7'
  - number: 7:4
    text: |-
      1 De uitoefening door de directeur van de bevoegdheden, bedoeld in [artikel 7:1][ref1] en [artikel 7:3][ref2],
      geschiedt bij schriftelijk besluit, in overeenstemming met het diensthoofd en met kennisgeving aan de directeur
      Personeel en Organisatie en de directeur Financieel-Economische Zaken.

      2 De uitoefening door de gemandateerde of gevolmachtigde, bedoeld in [artikel 7:3][ref3], van diens bevoegdheid
      geschiedt bij schriftelijk besluit, in overeenstemming met de directeur en met kennisgeving aan de directeur
      Personeel en Organisatie en aan de directeur Financieel-Economische Zaken.

      3 Voor de besluiten, bedoeld in het eerste en tweede lid, wordt gebruik gemaakt van het model, bedoeld in
      [artikel 7:3, tweede lid][ref4], van het MV-besluit diensthoofden BZK. In overeenstemming met de directeur
      Personeel en Organisatie kan daarvan worden afgeweken indien daartoe bijzondere aanleiding bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0013171#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0013171#Artikel73
      [ref3]: https://wetten.overheid.nl/BWBR0013171#Artikel73
      [ref4]: https://wetten.overheid.nl/BWBR0013171#Artikel73
    url: https://wetten.overheid.nl/BWBR0013171/2003-09-02#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0013171
        artikel: 7:1
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0013171
        artikel: 7:3
        paragraaf: '7'
      - id: ref3
        bwb_id: BWBR0013171
        artikel: 7:3
        paragraaf: '7'
      - id: ref4
        bwb_id: BWBR0013171
        artikel: 7:3
        paragraaf: '7'
  - number: 7:5
    text: |-
      De directeur is bevoegd om in bijzondere gevallen, naast of in plaats van het bepaalde in [artikel 7:1][ref1]
      en [artikel 7:3][ref2], mondeling of schriftelijk ondermandaat te verlenen onderscheidenlijk zijn volmacht
      door te verlenen aan een onder hem ressorterende functionaris voor een bepaald geval, met inachtneming van
      [artikel 1, derde lid, van het Besluit privaatrechtelijke rechtshandelingen 1996][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013171#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0013171#Artikel73
      [ref3]: https://wetten.overheid.nl/BWBR0007804#Artikel1
    url: https://wetten.overheid.nl/BWBR0013171/2003-09-02#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0013171
        artikel: 7:1
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0013171
        artikel: 7:3
        paragraaf: '7'
      - id: ref3
        bwb_id: BWBR0007804
        artikel: '1'
  - number: 8:1
    text: |-
      1 De uitoefening door de directeur van diens mandaat en volmacht, geschiedt onder verantwoordelijkheid van het
      diensthoofd waaronder de directeur ressorteert.

      2 De uitoefening door de directeur onderscheidenlijk een op grond van of krachtens dit besluit gemandateerde en
      gevolmachtigde van diens mandaat en volmacht, geschiedt met inachtneming van:

      a) algemene en bijzondere aanwijzingen van hiërarchisch hogergeplaatsten ten aanzien van de uitoefening van het
      mandaat en de volmacht;

      b) departementale richtlijnen met betrekking tot paraaf en medeparaaf en het voorleggen en afdoen van stukken;

      c) de van toepassing zijnde wet- en regelgeving en overige departementale richtlijnen, in
      het bijzonder de [Comptabiliteitswet][ref1], de [Wet op de ondernemingsraden][ref2], het
      [Besluit privaatrechtelijke rechtshandelingen 1996][ref3], het [Besluit taak FEZ][ref4], het
      [Organisatiebesluit BZK][ref5] en (de richtlijnen inzake) administratieve organisatiebeschrijvingen.


      [ref1]: https://wetten.overheid.nl/BWBR0013308
      [ref2]: https://wetten.overheid.nl/BWBR0013308
      [ref3]: https://wetten.overheid.nl/BWBR0013308
      [ref4]: https://wetten.overheid.nl/BWBR0013308
      [ref5]: https://wetten.overheid.nl/BWBR0013308
    url: https://wetten.overheid.nl/BWBR0013171/2003-09-02#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0013308
      - id: ref2
        bwb_id: BWBR0013308
      - id: ref3
        bwb_id: BWBR0013308
      - id: ref4
        bwb_id: BWBR0013308
      - id: ref5
        bwb_id: BWBR0013308
  - number: 8:2
    text: |-
      1 De uitoefening door de directeur onderscheidenlijk een op grond van of krachtens dit besluit gemandateerde en
      gevolmachtigde van diens mandaat en volmacht, geschiedt binnen de door de secretaris-generaal vastgestelde kaders
      betreffende het beleid en beheer inzake de bedrijfsvoering van het ministerie.

      2 Afwijking van het eerste lid is slechts mogelijk in overeenstemming met de secretaris-generaal, het diensthoofd,
      de directeur Financieel-Economische Zaken en de directeur van de Centrale Stafdiensten die het aangaat en wordt
      schriftelijk vastgelegd.
    url: https://wetten.overheid.nl/BWBR0013171/2003-09-02#Artikel82
  - number: 8:3
    text: |-
      De uitoefening door de directeur onderscheidenlijk een op grond van of krachtens dit besluit gemandateerde en
      gevolmachtigde van diens mandaat en volmacht, geschiedt met inachtneming van de departementale procedures en
      richtlijnen met betrekking tot onder meer:

        - administratieve organisatiebeschrijvingen;
        - documentaire informatievoorziening;
        - financiële verplichtingen, informatie en administratie;
        - totstandbrenging van wet- en regelgeving;
        - personele besluiten;
        - behandeling van topstukken;
        - behandeling van en het beslissen op verzoeken op grond van de [Wet openbaarheid van bestuur][ref1], met inbegrip
      van bezwaarschriften dienaangaande;
        - ontslagverlening op grond van [artikel 99 van het Algemeen Rijksambtenarenreglement][ref2] onderscheidenlijk
      [artikel 95 van het Besluit algemene rechtspositie politie][ref3];
        - aanleg en bijhouding van persoonsregistraties;
        - inkoop, verwerving en Europese aanbesteding;
        - het aangaan en het gebruik van (mantel)contracten;
        - werving, selectie, aanstelling en herplaatsing in het kader van reorganisatie;
        - aanpassing van de organisatie of formatie.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel99
      [ref3]: https://wetten.overheid.nl/BWBR0006516#Artikel95
    url: https://wetten.overheid.nl/BWBR0013171/2003-09-02#Artikel83
