---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_identificatie_bij_dienstverlening_bes
regulatory_layer: WET
publication_date: '2011-12-20'
valid_from: '2010-10-10'
bwb_id: BWBR0028490
url: https://wetten.overheid.nl/BWBR0028490/2010-10-10
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel1
  - number: 1.a
    text: '*dienstverlener:* een ieder die beroeps- of bedrijfsmatig een dienst verricht;'
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel1
  - number: 1.b
    text: '*dienst:* het door een dienstverlener in of vanuit Bonaire, Sint Eustatius of Saba:'
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel1
  - number: 1.b.1°
    text: in bewaring nemen van effecten, bankbiljetten, munten, muntbiljetten, edele metalen en andere waarden;
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel1
  - number: 1.b.2°
    text: |-
      openstellen van een rekening waarop een saldo in geld, effecten, edele metalen of andere waarden kan worden
      aangehouden;
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel1
  - number: 1.b.3°
    text: verhuren van een safe-loket;
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel1
  - number: 1.b.4°
    text: |-
      verrichten van een uitbetaling ter zake van het verzilveren van coupons of vergelijkbare stukken van obligaties of
      vergelijkbare waardepapieren;
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel1
  - number: 1.b.5°
    text: |-
      sluiten of bemiddelen bij het sluiten van een levensverzekeringsovereenkomst als bedoeld in
      [artikel 1, eerste lid, onderdeel a, van de Wet toezicht verzekeringsbedrijf BES][ref1] tegen een premie als
      bedoeld in artikel 1, eerste lid, onderdeel c, van de Wet toezicht verzekeringsbedrijf BES boven een door Onze
      Minister te bepalen bedrag;


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel1
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '1'
  - number: 1.b.6°
    text: |-
      doen van een uitkering uit hoofde van een levensverzekeringsovereenkomst als bedoeld onder 5° welke meer bedraagt
      dan een door Onze Minister te bepalen bedrag;
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel1
  - number: 1.b.7°
    text: |-
      verlenen van een dienst ter zake van een transactie of van kennelijk met elkaar samenhangende transacties, met een
      tegenwaarde of gezamenlijke tegenwaarde welke gelijk is aan dan wel meer bedraagt dan een door Onze Minister te
      bepalen bedrag, dat voor onderscheiden soorten van transacties verschillend kan zijn;
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel1
  - number: 1.b.8°
    text: |-
      crediteren of debiteren dan wel doen crediteren of debiteren van een rekening waarop een saldo in geld, effecten,
      edele metalen of andere valuta kan worden aangehouden;
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel1
  - number: 1.b.9°
    text: verlenen van andere bij algemene maatregel van bestuur aan te wijzen diensten.
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel1
  - number: 1.c
    text: |-
      *cliënt:* een ieder aan wie een dienst wordt verleend, daaronder begrepen in geval van een dienst als bedoeld in
      onderdeel b, onder 5° en 6°, degene die de premie betaalt alsmede degene aan wie de uitkering wordt gedaan of met
      wie een dienstverlener een relatie aangaat, gericht op het verlenen van diensten;
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel1
  - number: 1.d
    text: '*Onze Minister:* Onze Minister van Financiën;'
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel1
  - number: 1.e
    text: |-
      *kredietinstelling:* een kredietinstelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, van de Wet toezicht bank- en kredietwezen 1994 BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel1
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '1'
  - number: 1.f
    text: |-
      *levensverzekeringsbedrijf:* een levensverzekeringsbedrijf als bedoeld in
      [artikel 1, eerste lid, onderdeel d, van de Wet toezicht verzekeringsbedrijf BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel1
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '1'
  - number: 1.g
    text: |-
      *uiteindelijk belanghebbende:* de natuurlijke persoon die gerechtigd is tot of bijzondere zeggenschap heeft over 25
      procent of meer van de activa of opbrengsten van een stichting of een trust als bedoeld in het Verdrag inzake het
      recht dat toepasselijk is op trusts en inzake de erkenning van trusts (Trb. 1985, 141) of de natuurlijke persoon
      die in een rechtspersoon of vennootschap een rechtstreeks of middellijk belang van 25 procent of meer van het
      nominaal kapitaal of een daarmee vergelijkbaar belang heeft of houdt dan wel rechtstreeks of middellijk 25 procent
      of meer van de stemrechten of een daarmee vergelijkbare zeggenschap kan uitoefenen.
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel1
  - number: 1a
    text: |-
      Een dienstverlener die een bijkantoor of een dochtermaatschappij heeft buiten Bonaire, Sint Eustatius en Saba,
      draagt er zorg voor dat het bijkantoor, onderscheidenlijk de dochtermaatschappij, handelt in overeenstemming met de
      ingevolge deze wet gestelde voorschriften. Bij ministeriële regeling kunnen nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel1a
  - number: '2.1'
    text: |-
      De dienstverlener is verplicht voordat hij aan een cliënt een dienst verleent of met een cliënt een relatie aangaat
      gericht op het gedurende ten minste enige tijd verlenen van diensten:
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel2
  - number: 2.1.a
    text: de identiteit van de cliënt vast te stellen en te verifiëren;
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel2
  - number: 2.1.b
    text: |-
      indien van toepassing, de identiteit van de uiteindelijk belanghebbende vast te stellen en redelijke maatregelen te
      treffen om deze te verifiëren;
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel2
  - number: 2.1.c
    text: indien van toepassing, het doel en de beoogde aard van de bedoelde relatie vast te stellen;
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel2
  - number: 2.1.d
    text: |-
      indien de cliënt niet een natuurlijke persoon is, adequate maatregelen te nemen om inzicht te verwerven in de
      eigendoms- en zeggenschapsstructuur van de cliënt.
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel2
  - number: '2.2'
    text: 'Het eerste lid is bovendien van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel2
  - number: 2.2.a
    text: |-
      bij het verlenen van de dienst, bedoeld in [artikel 1, onderdeel b, onder 7°][ref1], niet bekend is welk bedrag
      daarmee gemoeid zal zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0028490#Artikel1
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028490
        artikel: '1'
  - number: 2.2.b
    text: |-
      de premie, bedoeld in [artikel 1, onderdeel b, onder 5°][ref1], de uitkering, bedoeld in artikel 1, onderdeel b,
      onder 6° of het bedrag van de transactie, bedoeld in artikel 1, onderdeel b, onder 7°, kleiner is dan het ingevolge
      die bepalingen vastgestelde bedrag, maar de dienst betrekking heeft op een transactie die aan de hand van de
      ingevolge [artikel 10 van de Wet melding ongebruikelijke transacties BES][ref2] vastgestelde indicatoren als een
      ongebruikelijke transactie als bedoeld in die wet dient te worden aangemerkt; of


      [ref1]: https://wetten.overheid.nl/BWBR0028490#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028598#Artikel10
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028490
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0028598
        artikel: '10'
  - number: 2.2.c
    text: |-
      de premie, bedoeld in [artikel 1, onderdeel b, onder 5°][ref1], de uitkering, bedoeld in artikel 1, onderdeel
      b, onder 6°, of het bedrag van de transactie, bedoeld in artikel 1, onderdeel b, onder 7°, kleiner is dan het
      ingevolge die bepalingen vastgestelde bedrag, maar de dienstverlener weet of redelijkerwijs moet vermoeden dat de
      transactie waarop de dienst betrekking heeft deel uitmaakt van een geheel van met elkaar samenhangende transacties,
      waarbij verschillende financiële instellingen zijn betrokken. Bij ministeriële regeling kan worden bepaald dat het
      eerste lid voorts van toepassing is in bij die regeling aan te geven gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0028490#Artikel1
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028490
        artikel: '1'
  - number: '2.3'
    text: |-
      Het eerste lid is niet van toepassing met betrekking tot de dienst bedoeld in
      [artikel 1, onderdeel b, onder 5° en 6°][ref1] voor zover het betreft een door een levensverzekeringsbedrijf
      aangeboden pensioenverzekering, tenzij deze wordt afgekocht of als zekerheidsstelling dient.


      [ref1]: https://wetten.overheid.nl/BWBR0028490#Artikel1
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028490
        artikel: '1'
  - number: '2.4'
    text: 'Door Onze Minister kan vrijstelling worden verleend van het bepaalde in het eerste lid indien als cliënt optreedt:'
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel2
  - number: 2.4.a
    text: |-
      een onderneming of instelling die geregistreerd is ingevolge
      [artikel 11 van de Wet toezicht bank- en kredietwezen 1994 BES][ref1] of een levensverzekeringsbedrijf als bedoeld
      in [artikel 1, eerste lid, onderdeel d van de Wet toezicht verzekeringsbedrijf BES][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028495#Artikel1
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0028495
        artikel: '1'
  - number: 2.4.b
    text: een onderneming of instelling die behoort tot een door Onze Minister aan te wijzen categorie.
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel2
  - number: '2.5'
    text: Onze Minister kan op verzoek ontheffing verlenen van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel2
  - number: '2.6'
    text: |-
      Aan een vrijstelling als bedoeld in het vierde lid en aan een ontheffing als bedoeld in het vijfde lid kunnen
      beperkingen worden gesteld en voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel2
  - number: '2.7'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld betreffende verscherpt cliëntenonderzoek en aanvullend
      onderzoek voor het aangaan en onderhouden van vaste relaties voor de afwikkeling van transacties of de uitvoering
      van opdrachten en daarmee vergelijkbare betrekkingen.
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel2
  - number: '3.1'
    text: |-
      Indien de cliënt een natuurlijke persoon is, wordt de identiteit vastgesteld met behulp van een van de volgende, in
      het land van uitgifte, geldige documenten:
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel3
  - number: 3.1.a
    text: een rijbewijs;
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel3
  - number: 3.1.b
    text: een door de lokale overheid uitgegeven identiteitskaart;
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel3
  - number: 3.1.c
    text: een reisdocument of paspoort;
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel3
  - number: 3.1.d
    text: een ander door Onze Minister aan te wijzen document.
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel3
  - number: '3.2'
    text: |-
      Indien de cliënt een rechtspersoon of vennootschap is, wordt de identiteit vastgesteld met behulp van een
      gewaarmerkt uittreksel uit het register van de Kamer van Koophandel en Nijverheid, of een soortgelijke instelling,
      in het land van vestiging, dan wel met behulp van een verklaring, afgegeven door van de cliënt onafhankelijke
      functionaris uit het land van vestiging, die de betrouwbaarheid van deze verklaring op grond van de aard van zijn
      functie voldoende kan waarborgen. Het uittreksel dan wel de verklaring dient ten minste de door Onze Minister te
      bepalen gegevens te bevatten.
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel3
  - number: '3.3'
    text: |-
      De dienstverlener draagt zorg voor de juiste identiteitsgegevens. Wanneer blijkt dat deze gegevens niet meer
      overeenstemmen met de werkelijkheid, is de dienstverlener verplicht deze gewijzigde identiteitsgegevens aan te
      passen.
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel3
  - number: '4.1'
    text: |-
      In afwijking van [artikel 3][ref1] is aan de verplichtingen, bedoeld in [artikel 2][ref2] voldaan, indien de
      dienstverlener voor de vaststelling van de identiteit van een cliënt gebruik maakt van de gegevens die hij bij een
      eerder aan die cliënt verleende dienst overeenkomstig de bepalingen van deze wet heeft vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028490#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028490#Artikel2
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028490
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0028490
        artikel: '2'
  - number: '4.2'
    text: |-
      Aan de verplichting, bedoeld in [artikel 2, eerste lid][ref1], is met betrekking tot de dienst, bedoeld
      in [artikel 1, onderdeel b, onder 5° en 6°][ref2] voldaan indien de eerste premiebetaling wordt gedaan
      ten laste van, dan wel de uitkering uit hoofde van de levensverzekeringsovereenkomst wordt betaald
      ten gunste van een rekening van de cliënt bij een kredietinstelling die geregistreerd is ingevolge
      [artikel 11 van de Wet toezicht bank- en kredietwezen 1994 BES][ref3] of een levensverzekeringsbedrijf als
      bedoeld in [artikel 1 onderdeel b van de Wet toezicht verzekeringsbedrijf BES][ref4] of een kredietinstelling of
      levensverzekeringsbedrijf met zetel in een door Onze Minister aan te wijzen ander deel van het Koninkrijk of in een
      door hem aan te wijzen andere Staat.


      [ref1]: https://wetten.overheid.nl/BWBR0028490#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028490#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0028547#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0028495#Artikel1
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028490
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0028490
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0028547
        artikel: '11'
      - id: ref4
        bwb_id: BWBR0028495
        artikel: '1'
  - number: '4.3'
    text: |-
      Aan de verplichting, bedoeld in [artikel 2, eerste lid][ref1], is met betrekking tot de dienst,
      bedoeld in [artikel 1, onderdeel b, onder 1°, 2°, 4° en 7°][ref2], voor zover verband houdend
      met de handel in effecten, voldaan indien de eerste betaling die met de dienst verband houdt
      door de cliënt wordt gedaan of indien een betaling aan de cliënt wordt gedaan ten laste of ten
      gunste van een rekening van die cliënt bij een kredietinstelling die geregistreerd is ingevolge
      [artikel 11 van de Wet toezicht bank- en kredietwezen 1994 BES][ref3] of een kredietinstelling met zetel in een
      door Onze Minister aangewezen ander deel van het Koninkrijk of in een door hem aangewezen andere Staat.


      [ref1]: https://wetten.overheid.nl/BWBR0028490#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028490#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0028547#Artikel11
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028490
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0028490
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0028547
        artikel: '11'
  - number: '4.4'
    text: Het derde lid is van overeenkomstige toepassing in door Onze Minister aan te wijzen gevallen.
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel4
  - number: '4.5'
    text: |-
      De leden twee tot en met vier zijn niet van toepassing indien de dienst betrekking heeft op een transactie die als
      een ongebruikelijke transactie in de zin van de [Wet melding ongebruikelijke transacties BES][ref1] dient te worden
      aangemerkt, of als [artikel 5, vierde lid][ref2], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0028598
      [ref2]: https://wetten.overheid.nl/BWBR0028490#Artikel5
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028598
      - id: ref2
        bwb_id: BWBR0028490
        artikel: '5'
  - number: '5.1'
    text: |-
      De dienstverlener is verplicht de identiteit van de natuurlijke persoon die namens een cliënt of namens een
      vertegenwoordiger van een cliënt bij hem verschijnt overeenkomstig de [artikelen 3][ref1] en [4][ref2] vast te
      stellen voordat hij de dienst verleent.


      [ref1]: https://wetten.overheid.nl/BWBR0028490#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028490#Artikel4
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028490
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0028490
        artikel: '4'
  - number: '5.2'
    text: |-
      De dienstverlener is verplicht na te gaan of de natuurlijke persoon die voor hem verschijnt voor zichzelf optreedt
      dan wel voor een derde.
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel5
  - number: '5.3'
    text: |-
      Indien de natuurlijke persoon optreedt voor een derde is de dienstverlener verplicht de identiteit van die derde
      vast te stellen met behulp van door de natuurlijke persoon over te leggen documenten, bedoeld in [artikel 3][ref1],
      tenzij [artikel 2, eerste lid, tweede volzin][ref2], van toepassing is. Indien de derde optreedt voor een andere
      derde, is de dienstverlener verplicht de identiteit van die andere derde op dezelfde wijze vast te stellen, tenzij
      artikel 2, eerste lid, tweede volzin, van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0028490#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028490#Artikel2
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028490
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0028490
        artikel: '2'
  - number: '5.4'
    text: |-
      Indien de dienstverlener weet of redelijkerwijs moet vermoeden dat de natuurlijke persoon die voor hem verschijnt
      niet voor zichzelf optreedt, dient hij redelijke maatregelen te treffen teneinde de identiteit van de cliënt voor
      wie hij optreedt en, ingeval van vertegenwoordiging van een cliënt door een derde van die vertegenwoordiger te
      achterhalen.
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel5
  - number: '5.5'
    text: |-
      Het derde en vierde lid zijn niet van toepassing indien de natuurlijke persoon een dienstverlener is dan wel
      optreedt namens een dienstverlener waarop een vrijstelling als bedoeld in [artikel 2, vierde lid][ref1], of een
      ontheffing als bedoeld in artikel 2, vijfde lid, van toepassing is, mits die dienstverlener de identiteit van de
      derde voor wie zij optreedt overeenkomstig deze wet dan wel overeenkomstig de wetgeving van een door Onze Minister
      aangewezen ander deel van het Koninkrijk of een door hem aangewezen andere Staat heeft vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028490#Artikel2
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028490
        artikel: '2'
  - number: '5.6'
    text: |-
      Door Onze Minister kan vrijstelling en, op verzoek, ontheffing worden verleend van het derde en vierde lid. Aan een
      vrijstelling en aan een ontheffing kunnen beperkingen worden gesteld en voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel5
  - number: 5a
    text: |-
      Indien een dienstverlener een relatie met een cliënt is aangegaan, gericht op het gedurende ten minste enige tijd
      verlenen van diensten, voert de dienstverlener een voortdurende controle uit op die relatie en de tijdens de duur
      van die relatie uit te voeren transacties, ten einde te verzekeren dat deze overeenkomen met de kennis die de
      dienstverlener heeft van de cliënt en van zijn risicoprofiel, met in voorkomend geval een onderzoek naar de bron
      van het vermogen. Bij ministeriële regeling kunnen nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel5a
  - number: '6'
    text: |-
      De dienstverlener is verplicht de volgende gegevens vast te leggen op een zodanige wijze dat deze toegankelijk
      zijn:
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel6
  - number: 6.a
    text: |-
      de naam, het adres en de woonplaats dan wel plaats van vestiging van de cliënt en, indien van toepassing, van de
      uiteindelijk belanghebbende en van degene te wiens name het depot of de rekening wordt gesteld, van degene die
      toegang tot het safe-loket zal hebben of degene te wiens name een uitbetaling of transactie wordt verricht, alsmede
      van hun vertegenwoordigers;
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel6
  - number: 6.b
    text: |-
      de aard, het nummer en de datum en plaats van uitgifte van het document met behulp waarvan de
      identiteitsvaststelling heeft plaatsgevonden, behoudens indien [artikel 4][ref1] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0028490#Artikel4
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028490
        artikel: '4'
  - number: 6.c
    text: de aard van de dienst; en
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel6
  - number: 6.d.1
    text: |-
      in het geval van het in bewaring nemen van de in [artikel 1, onderdeel b, onder 1°][ref1], genoemde waarden:
      het desbetreffende depotnummer en de marktwaarde die deze waarden vertegenwoordigen op het tijdstip van de
      inbewaringneming, of bij ontstentenis van een marktwaarde het bedrag dat deze waarden vertegenwoordigen, berekend
      volgens andere in het maatschappelijk verkeer gebruikelijke waarderingsgrondslagen, of indien het bedrag dat
      deze waarden vertegenwoordigen in redelijkheid niet kan worden vastgesteld, een nauwkeurige omschrijving van die
      waarden;


      [ref1]: https://wetten.overheid.nl/BWBR0028490#Artikel1
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028490
        artikel: '1'
  - number: 6.d.2
    text: |-
      in het geval van het openstellen van een rekening: een duidelijke omschrijving van de soort rekening en het aan die
      rekening toegekende nummer;
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel6
  - number: 6.d.3
    text: |-
      in het geval van verhuur van een safe-loket: het nummer of een andere onderscheidende aanduiding van het
      desbetreffende safe-loket;
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel6
  - number: 6.d.4
    text: |-
      in het geval van het verrichten van uitbetalingen ter zake van het verzilveren van coupons of vergelijkbare stukken
      van obligaties of vergelijkbare waardepapieren: het bedrag dat met de transactie is gemoeid en het desbetreffende
      rekeningnummer;
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel6
  - number: 6.d.5
    text: |-
      in het geval van het sluiten van een levensverzekeringsovereenkomst: het nummer van de rekening ten laste waarvan
      de premiebetaling wordt gedaan;
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel6
  - number: 6.d.6
    text: |-
      in het geval van het doen van een uitkering uit hoofde van een levensverzekeringsovereenkomst: het nummer van de
      rekening ten gunste waarvan de uitkering wordt gedaan;
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel6
  - number: 6.d.7
    text: |-
      in het geval van een dienst als bedoeld in [artikel 1, onderdeel b, onder 7°][ref1]: het bedrag dat met de
      transactie is gemoeid en het desbetreffende rekeningnummer;


      [ref1]: https://wetten.overheid.nl/BWBR0028490#Artikel1
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028490
        artikel: '1'
  - number: 6.d.8
    text: |-
      in het geval van een dienst als bedoeld in [artikel 1, onderdeel b, onder 9°][ref1]: de op die dienst betrekking
      hebbende gegevens die bij algemene maatregel van bestuur zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0028490#Artikel1
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028490
        artikel: '1'
  - number: '7'
    text: |-
      De dienstverlener is verplicht de in [artikel 6][ref1] bedoelde gegevens op toegankelijke wijze te bewaren tot vijf
      jaar na het beëindigen van de overeenkomst op grond waarvan de dienst is verleend of tot vijf jaar na het uitvoeren
      van een dienst als bedoeld in [artikel 1, onderdeel b, onder 4° of 7°][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028490#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0028490#Artikel1
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028490
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0028490
        artikel: '1'
  - number: '8.1'
    text: |-
      Het is de dienstverlener verboden een dienst te verlenen of een relatie aan te gaan, gericht op het gedurende
      ten minste enige tijd verlenen van diensten, indien de identiteit van de cliënt en, indien van toepassing, de
      uiteindelijk belanghebbende, niet op de ingevolge deze wet voorgeschreven wijze is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel8
  - number: '8.2'
    text: |-
      Indien een dienstverlener een relatie met een cliënt is aangegaan, gericht op het gedurende ten minste enige tijd
      verlenen van diensten, beëindigt hij die relatie ingeval hij niet kan voldoen aan de verplichtingen ingevolge
      [artikel 2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028490#Artikel2
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028490
        artikel: '2'
  - number: '8.3'
    text: |-
      De dienstverlener draagt er zorg voor dat zijn werknemers, voor zover relevant voor de uitoefening van hun taken,
      bekend zijn met de bepalingen van deze wet.
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel8
  - number: 8a.1
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de daartoe bij besluit van
      Onze Minister en Onze Minister van Justitie gezamenlijk aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel8a
  - number: 8a.2
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel8a
  - number: 8a.3
    text: |-
      [Afdeling 5.2 van de Algemene wet bestuursrecht][ref1] is van toepassing, met uitzondering van de
      [artikelen 5.18][ref2] en [5.19][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '5.2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 8a.4
    text: |-
      Indien de in het eerste lid bedoelde personen bij de uitoefening van hun taak feiten ontdekken die kunnen
      duiden op witwassen of financiering van terrorisme, lichten zij, zo nodig in afwijking van wettelijke
      geheimhoudingsbepalingen, het Meldpunt, bedoeld in de [Wet melding ongebruikelijke transacties BES][ref1], in.


      [ref1]: https://wetten.overheid.nl/BWBR0028598
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0028598
  - number: 8a.5
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de wijze van taakuitoefening van
      de in het eerste lid bedoelde personen.
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel8a
  - number: 8b.1
    text: |-
      Bij besluit van Onze Minister en Onze Minister van Justitie gezamenlijk kan worden bepaald dat een krachtens
      [artikel 8a][ref1] aangewezen toezichthouder bevoegd is een dienstverlener die niet of niet tijdig voldoet aan een
      uit deze wet voortvloeiende verplichting, een geldboete op te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0028490#Artikel8a
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0028490
        artikel: 8a
  - number: 8b.2
    text: |-
      De hoogte van de boete voor de verscheidene overtredingen wordt bepaald bij algemene maatregel van bestuur, met
      dien verstande dat de boete voor een afzonderlijke overtreding ten hoogste USD 250.000 bedraagt.
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel8b
  - number: 8b.3
    text: |-
      Alvorens over te gaan tot het opleggen van een boete stelt de toezichthouder de betrokken dienstverlener
      schriftelijk op de hoogte van het voornemen een boete op te leggen, onder vermelding van de gronden waarop dat
      voornemen berust.
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel8b
  - number: '9.1'
    text: |-
      Overtreding van voorschriften gesteld bij of krachtens de [artikelen 2, eerste, tweede en zesde lid][ref1],
      [3, derde lid][ref2], [5][ref3], [6][ref4], [7][ref5] en [8][ref6] van deze wet is, voor zover zulks
      opzettelijk geschied, een misdrijf en wordt gestraft met hetzij gevangenisstraf van ten hoogste vier jaren, hetzij
      met geldboete van de vijfde categorie, hetzij met beide straffen.


      [ref1]: https://wetten.overheid.nl/BWBR0028490#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028490#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0028490#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0028490#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0028490#Artikel7
      [ref6]: https://wetten.overheid.nl/BWBR0028490#Artikel8
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028490
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0028490
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0028490
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0028490
        artikel: '6'
      - id: ref5
        bwb_id: BWBR0028490
        artikel: '7'
      - id: ref6
        bwb_id: BWBR0028490
        artikel: '8'
  - number: '9.2'
    text: |-
      Overtreding van voorschriften gesteld bij of krachtens de [artikelen 2, eerste, tweede en zesde lid][ref1],
      [3, derde lid][ref2], [5][ref3], [6][ref4], [7][ref5] en [8][ref6] van deze wet is, voorzover zulks niet
      opzettelijk geschied, een overtreding en wordt gestraft met hetzij hechtenis van ten hoogste een jaar, hetzij met
      geldboete van de vijfde categorie, hetzij met beide straffen.


      [ref1]: https://wetten.overheid.nl/BWBR0028490#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028490#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0028490#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0028490#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0028490#Artikel7
      [ref6]: https://wetten.overheid.nl/BWBR0028490#Artikel8
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028490
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0028490
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0028490
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0028490
        artikel: '6'
      - id: ref5
        bwb_id: BWBR0028490
        artikel: '7'
      - id: ref6
        bwb_id: BWBR0028490
        artikel: '8'
  - number: '10.1'
    text: |-
      Met de opsporing van de in deze wet strafbaar gestelde feiten zijn, naast de in
      [artikel 184 van het Wetboek van Strafvordering BES][ref1] bedoelde ambtenaren, belast de daartoe bij besluit van
      Onze Minister van Justitie in overeenstemming met Onze Minister aangewezen ambtenaren. Van een zodanig besluit
      wordt mededeling gedaan door plaatsing in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '184'
  - number: '10.2'
    text: |-
      Zij kunnen te allen tijde inzage vorderen van alle bescheiden waarvan naar hun redelijk oordeel inzage voor de
      vervulling van hun taak noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel10
  - number: '11'
    text: 'Deze wet wordt aangehaald als: Wet identificatie bij dienstverlening BES.'
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel11
  - number: '12'
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel12
  - number: '13'
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0028490/2010-10-10#Artikel13
