$id: regeling_certificering_scheepsbeveiligingsfunctionarissen
regulatory_layer: WET
publication_date: '2014-05-02'
valid_from: '2013-08-20'
valid_to: '2014-05-02'
bwb_id: BWBR0023729
url: https://wetten.overheid.nl/BWBR0023729/2013-08-20
preamble:
  text: |-
    Gelet op het op 7 juli 1978 te Londen tot stand gekomen Internationale Verdrag betreffende de normen
    voor zeevarenden inzake opleiding, diplomering en wachtdienst, 1978 (Trb. 1981, 144) en artikel 21 van de
    Zeevaartbemanningswet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0023729/2013-08-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      scheepsbeveiligingsfunctionaris: een zich aan boord bevindende, aan de kapitein verantwoordelijke persoon,
      dan wel de kapitein zelf, die door de scheepsbeheerder is aangesteld als verantwoordelijke voor de beveiliging
      van het schip, waaronder begrepen de uitvoering en het onderhoud van het scheepsbeveiligingsplan, en voor het
      contact met de beveiligingsfunctionaris van de zeescheepvaartonderneming en de beveiligingsfunctionarissen van
      de havenfaciliteiten;

      STCW-Verdrag: het op 7 juli 1978 te Londen tot stand gekomen Internationale Verdrag betreffende de normen voor
      zeevarenden inzake opleiding, diplomering en wachtdienst, 1978 (Trb. 1981, 144) en de bij dat verdrag behorende
      bindende protocollen, aanhangsels en bijlagen;

      STCW-Code: de Code inzake opleiding, diplomering en wachtdienst van zeevarenden, behorend bij het STCW-Verdrag
      (Trb. 1996, 249).
    url: https://wetten.overheid.nl/BWBR0023729/2013-08-20#Artikel1
  - number: '2'
    text: |-
      Voor de afgifte van het certificaat scheepsbeveiligingsfunctionaris:

      a. voldoet de aanvrager aan voorschrift VI/5, paragraaf 1.1, van de bijlage bij het STCW-Verdrag, en

      b. heeft de aanvrager met goed gevolg een door Onze minister erkende opleiding en training afgerond die voldoet aan
      sectie A-VI/5, paragrafen 1 tot en met 4, van de STCW-Code.
    url: https://wetten.overheid.nl/BWBR0023729/2013-08-20#Artikel2
    machine_readable:
      operation: ALL_OF
      operands:
        - operation: INPUT_VARIABLE
          variable: voldoet_aan_STCW_VI_5_1_1
          type: boolean
          description: Voldoet de aanvrager aan voorschrift VI/5, paragraaf 1.1, van de bijlage bij het STCW-Verdrag?
        - operation: INPUT_VARIABLE
          variable: heeft_erkende_opleiding
          type: boolean
          description: Heeft de aanvrager met goed gevolg een door Onze minister erkende opleiding en training afgerond die voldoet aan sectie A-VI/5, paragrafen 1 tot en met 4, van de STCW-Code?
      output:
        type: boolean
        description: Wordt het certificaat scheepsbeveiligingsfunctionaris afgegeven?
  - number: '3'
    text: |-
      1 Bemanningsleden die als scheepsbeveiligingsfunctionaris zijn aangesteld, zijn in het bezit van het certificaat
      scheepsbeveiligingsfunctionaris, bedoeld in [artikel 2][ref1].

      2 In afwijking van het eerste lid kunnen tot 1 juli 2009 bemanningsleden als scheepsbeveiligingsfunctionaris zijn
      aangesteld die voor 1 januari 2008 een training als scheepsbeveiligingsfunctionaris hebben afgerond.


      [ref1]: https://wetten.overheid.nl/BWBR0023729#Artikel2
    url: https://wetten.overheid.nl/BWBR0023729/2013-08-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0023729
        artikel: '2'
    machine_readable:
      operation: ALL_OF
      operands:
        - operation: INPUT_VARIABLE
          variable: is_aangesteld_als_scheepsbeveiligingsfunctionaris
          type: boolean
          description: Is het bemanningslid aangesteld als scheepsbeveiligingsfunctionaris?
        - operation: OR
          operands:
            - operation: AND
              operands:
                - operation: INPUT_VARIABLE
                  variable: datum
                  type: date
                  description: De datum waarop de controle plaatsvindt.
                - operation: GREATER_THAN
                  operands:
                    - operation: INPUT_VARIABLE
                      variable: datum
                    - operation: LITERAL
                      type: date
                      value: "2009-07-01"
                  type: boolean
                - operation: INPUT_VARIABLE
                  variable: heeft_certificaat
                  type: boolean
                  description: Is het bemanningslid in het bezit van het certificaat scheepsbeveiligingsfunctionaris?
            - operation: AND
              operands:
                - operation: INPUT_VARIABLE
                  variable: datum
                  type: date
                  description: De datum waarop de controle plaatsvindt.
                - operation: LESS_THAN
                  operands:
                    - operation: INPUT_VARIABLE
                      variable: datum
                    - operation: LITERAL
                      type: date
                      value: "2009-07-01"
                  type: boolean
                - operation: INPUT_VARIABLE
                  variable: training_voor_2008
                  type: boolean
                  description: Heeft het bemanningslid voor 1 januari 2008 een training als scheepsbeveiligingsfunctionaris afgerond?
      output:
        type: boolean
        description: Mag het bemanningslid als scheepsbeveiligingsfunctionaris zijn aangesteld?
  - number: 3a
    text: |-
      Deze regeling berust op [artikel 21 van de Wet zeevarenden][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel21
    url: https://wetten.overheid.nl/BWBR0023729/2013-08-20#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '21'
  - number: '4'
    text: 'Deze regeling wordt aangehaald als: Regeling certificering scheepsbeveiligingsfunctionarissen.'
    url: https://wetten.overheid.nl/BWBR0023729/2013-08-20#Artikel4
