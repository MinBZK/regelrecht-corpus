preamble:
  text: |-
    Gelet op artikel 11, derde lid, van het Besluit voorkoming verontreiniging door met schepen in bulk vervoerde
    schadelijke vloeistoffen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0016083/2004-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor het onderzoek en de verdere werkzaamheden nodig voor de afgifte van het certificaat van voorkoming van
      verontreiniging voor het vervoer van schadelijke vloeistoffen in bulk, is het volgende tarief verschuldigd:

      a. voor een eerste afgifte € 624;

      b. voor een hernieuwde afgifte € 425.
    url: https://wetten.overheid.nl/BWBR0016083/2004-01-01#Artikel1
  - number: '2'
    text: |-
      1 Voor het onderzoek aan boord en de verdere werkzaamheden nodig voor een tussentijdse aanpassing van het
      certificaat, bedoeld in artikel 1, is een tarief verschuldigd van € 409.

      2 Voor de werkzaamheden nodig voor het verstrekken van een extra exemplaar, een tussentijdse vervanging of de
      afgifte van het certificaat, bedoeld in artikel 1, zonder dat hiervoor een onderzoek aan boord plaatsvindt, is
      een tarief verschuldigd van € 183. Indien ten behoeve van een schip tegelijkertijd meerdere certificaten als
      bedoeld in het tweede lid worden verstrekt, zonder dat hiervoor een onderzoek aan boord plaatsvindt, is een tarief
      verschuldigd van € 118.

      4 Voor de vervanging van certificaten die door een scheepsongeval verloren zijn gegaan, is geen vergoeding
      verschuldigd.
    url: https://wetten.overheid.nl/BWBR0016083/2004-01-01#Artikel2
  - number: '3'
    text: |-
      De [artikelen 46][ref1] en [47 van de Regeling Nederlandse tarieven Schepenwet 2004][ref2] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016086#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0016086#Artikel47
    url: https://wetten.overheid.nl/BWBR0016083/2004-01-01#Artikel3
