        bwb_id: BWBR0001827
        artikel: '672'
        afdeling: Derde
  - number: '676'
    text: |-
      Geschillen die in verband met een verzegeling, ontzegeling of boedelbeschrijving rijzen, worden in kort geding
      gebracht voor de voorzieningenrechter van de rechtbank in welker rechtsgebied de verzegeling is geschiedt of de te
      beschrijven boedel zich geheel of grotendeels bevindt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel676
