      - id: ref8
        bwb_id: BWBR0002656
        artikel: '422'
  - number: 710a
    text: |-
      De indiening van verzoekschriften krachtens de [artikelen 700, derde lid, tweede volzin][ref1],
      [709, tweede en derde lid][ref2], [715, tweede lid, derde volzin][ref3], en [721, tweede volzin][ref4], kan ook
      door een deurwaarder geschieden. Indien een deurwaarder het verzoekschrift indient, geldt zijn kantoor als gekozen
      woonplaats van de verzoeker.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel700
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel709
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel715
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel721
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel710a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '700'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '709'
        afdeling: Eerste
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '715'
        afdeling: Derde
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '721'
        afdeling: Vierde
  - number: '711.1'
    text: |-
      Verlof om conservatoir beslag tot verhaal van een geldvordering te leggen op roerende zaken die geen
      registergoederen zijn en op rechten aan toonder of order wordt slechts verleend, indien de schuldeiser aantoont dat
      er gegronde vrees bestaat voor verduistering hetzij door de schuldenaar van zijn goederen hetzij, zo de voor het
      beslag vatbare goederen aan een ander dan de schuldenaar toebehoren, door deze ander van die goederen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel711
  - number: '711.2'
    text: |-
      De eis van vrees voor verduistering geldt niet wanneer het verlof wordt verleend aan de houder van een wisselbrief,
      een orderbiljet of cheque, waarvan de non-betaling door protest of een voor de cheque daarmee gelijk te stellen
      verklaring is vastgesteld, telkens voor hetgeen deze houder te vorderen heeft van de trekker, de acceptant, de
      avalist en de endossanten. Ook [artikel 701][ref1] mist in dit geval toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel701
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel711
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '701'
        afdeling: Eerste
  - number: '711.3'
    text: |-
      De vorige leden zijn mede van toepassing op de goederen bedoeld in [artikel 474bb][ref1]. Het in beslag te nemen
      goed moet in het in [artikel 700, tweede lid][ref2], bedoelde verzoekschrift worden omschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel474bb
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel700
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel711
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 474bb
        afdeling: Eerste_A
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '700'
        afdeling: Eerste
  - number: '712'
    text: |-
      De [artikelen 441, eerste lid][ref1], [443-445][ref2], [447][ref3], [448][ref4], [451][ref5], [453a][ref6],
      [455a][ref7], [457][ref8] en [461d][ref9] zijn op de in het vorige artikel bedoelde beslag van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel441
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel443
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel447
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel448
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel451
      [ref6]: https://wetten.overheid.nl/BWBR0001827#Artikel453a
      [ref7]: https://wetten.overheid.nl/BWBR0001827#Artikel455a
