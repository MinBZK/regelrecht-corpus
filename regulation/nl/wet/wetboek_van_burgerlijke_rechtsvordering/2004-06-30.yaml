        artikel: '455'
        afdeling: Eerste
  - number: '492.4'
    text: |-
      Indien geen ander beslag daaraan in de weg staat, kan de deurwaarder alsnog [artikel 491][ref1] toepassen. Het door
      hem gelegde beslag eindigt daardoor.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel491
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel492
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '491'
        afdeling: Vierde
  - number: '493'
    text: |-
      Betreft het recht op afgifte een of meer naar de soort bepaalde zaken, dan zal de deurwaarder een aan dat recht
      beantwoordende hoeveelheid zaken van die soort onder zich of in beslag nemen, uit te kiezen door de deurwaarder
      tenzij de geëxecuteerde tijdig van een hem toekomende bevoegdheid tot kiezen gebruik maakt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel493
  - number: '494.1'
    text: |-
      Betreft het recht op afgifte te velde staande vruchten en beplantingen van een onroerende zaak, dan kan uit
      dien hoofde beslag worden gelegd op de zaak of het zakelijk recht van degene jegens wie dit recht bestaat, zulks
      overeenkomstig de bepalingen betreffende beslag op onroerende zaken, maar met vermelding in het proces-verbaal dat
      het beslag slechts ten aanzien van die vruchten of beplantingen zijn werking heeft.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel494
  - number: '494.2'
    text: |-
      Het beslag komt op de vruchten of beplantingen te rusten, zodra deze zijn afgescheiden. Zodra alle vruchten of
      beplantingen waarop het beslag betrekking heeft zijn afgescheiden, vervalt het beslag op de zaak of het zakelijk
      recht.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel494
  - number: '494.3'
    text: |-
      [Artikel 451][ref1] is, mede ter zake van de inoogsting, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel451
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel494
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '451'
        afdeling: Eerste
  - number: '495.1'
    text: |-
      Betreft het recht op afgifte een orderpapier, dan is [artikel 474a, tweede lid][ref1], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel474a
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel495
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 474a
        afdeling: Eerste_A
  - number: '495.2'
    text: |-
      Betreft het recht op afgifte een toonder- of orderpapier en is aan het daaruit voortvloeiende recht stemrecht
      verbonden, dan is [artikel 474ba][ref1] van overeenkomstige toepassing, tenzij het stemrecht blijkens de
      executoriale titel aan de executant toekomt.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel474ba
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel495
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 474ba
        afdeling: Eerste_A
  - number: '496.1'
    text: |-
      Betreft het een executie tot afgifte op vordering van een pandhouder als bedoeld in [artikel 237, derde lid, van
      Boek 3 van het Burgerlijk Wetboek](onbekend), dan geeft de deurwaarder de zaak af aan de pandhouder of derde in
      wiens macht de zaak moet worden gebracht.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel496
  - number: '496.2'
    text: |-
      Is het pandrecht uit hoofde waarvan de afgifte geëist wordt, niet bij een authentieke akte gevestigd, dan kan
      de deurwaarder de zaak slechts onder zich nemen of in beslag nemen met verlof van de voorzieningenrechter van
      de rechtbank binnen welker rechtsgebied de zaak zich bevindt. Het verlof wordt verzocht bij een verzoekschrift
      waarbij de pandakte wordt overgelegd. De voorzieningenrechter beslist na summier onderzoek. Het verlof en het
      verzoekschrift worden, met het in [artikel 491, tweede lid][ref1], bedoelde proces-verbaal, aan de pandgever
      betekend. Tegen een krachtens dit lid gegeven verlof is geen hogere voorziening toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel491
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel496
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '491'
        afdeling: Vierde
  - number: '496.3'
    text: |-
      Is op de zaak reeds beslag gelegd, dan kan de deurwaarder haar met handhaving van het beslag niettemin onder zich
      nemen, mits de pandhouder tevens overeenkomstig [artikel 461a][ref1] de executie van de beslaglegger overneemt. Hij
      betekent de in de derde zin van het vorige lid bedoelde stukken onverwijld mede aan de deurwaarder die het beslag
      heeft gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel461a
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel496
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 461a
        afdeling: Eerste
  - number: '497.1'
    text: |-
      Bij samenloop van een beslag tot verkrijging van afgifte met een ander beslag, al of niet van dezelfde aard, kan de
      meest gerede partij zich overeenkomstig [artikel 438][ref1] tot de rechter wenden.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel438
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel497
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '438'
  - number: '497.2'
    text: |-
      Wordt op een zaak zowel beslag tot verkrijging van afgifte gelegd als tot verhaal van een geldvordering, dan geldt
      het beslag tot verkrijging van afgifte zo nodig tevens als een als tweede gelegd executoriaal beslag tot verhaal
      van de vordering tot vervangende schadevergoeding wegens uitblijven van de afgifte.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel497
  - number: '497.3'
    text: |-
      Een beslag tot verhaal van een vordering tot vervangende schadevergoeding wegens het uitblijven van afgifte van
      een zaak kan niet tegen de legger van een beslag tot verkrijging van afgifte van die zaak worden ingeroepen, indien
      deze andere goederen van de beslagene aanwijst die voor deze vordering voldoende verhaal bieden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel497
  - number: '498'
    text: |-
      Zolang de afgifte nog niet heeft plaats gevonden, kan ieder wiens recht op de zaak de executant moet eerbiedigen,
      zich tegen de afgifte verzetten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel498
  - number: '499'
    text: |-
      Bevindt de zaak zich onder een derde die tegen de afgifte geen bezwaar maakt of zich niet te goeder trouw tegen
      een vordering tot afgifte aan de geëxecuteerde zou kunnen verzetten, dan geschiedt de executie overeenkomstig de
      voorgaande artikelen van deze afdeling. De afgifte aan de executant geldt mede als afgifte van de derde aan de
      geëxecuteerde.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel499
  - number: '500'
    text: |-
      Tot afgifte van een zaak die zich onder een derde bevindt, kan ook derdenbeslag gelegd worden. De
      [artikelen 475-479][ref1] zijn van overeenkomstige toepassing. Het exploit van beslaglegging houdt in om de
      afgifte van welke zaak of zaken het gaat. De verklaring van de derde, als bedoeld in [artikel 476a][ref2], betreft
      uitsluitend deze zaak of zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel476a
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel500
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '475'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 476a
        afdeling: Tweede
  - number: '502.1'
    text: |-
      Het beslag op onroerende zaken moet worden voorafgegaan door een exploit van een deurwaarder, houdende bevel om
      binnen twee dagen aan de executoriale titel te voldoen. Eerst na verloop van die termijn kan het beslag worden
      gelegd. Indien daartoe gronden zijn, kan de voorzieningenrechter van de rechtbank, ook op mondeling verzoek van de
      deurwaarder, die termijn inkorten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel502
  - number: '502.2'
    text: |-
      Het bevel zal melding maken van de titel uit kracht waarvan de vervolging plaats heeft en zal uitdrukken dat
      bij gebreke van betaling zal worden overgegaan tot executoriale maatregelen tegen de onroerende zaken van de
      geëxecuteerde, zulks op straffe van nietigheid van het exploit.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel502
  - number: '502.3'
    text: |-
      Indien bij het betekenen van de executoriale titel tevens het voorgeschreven bevel is gedaan, wordt geen
      afzonderlijk bevel vereist.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel502
  - number: '502.4'
    text: |-
      Bij het bevel of de betekening moet de executant tot het uiteinde der executie woonplaats kiezen ten kantore van de
      deurwaarder, zulks op straffe van nietigheid van het exploit. Tevens kan woonplaats worden gekozen in Nederland ten
      kantore van een advocaat.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel502
  - number: '503'
    text: Indien de schuldeiser een jaar na het bevel heeft laten verlopen, zal hij gehouden zijn het bevel te vernieuwen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel503
  - number: '504.1'
    text: |-
      Het beslag geschiedt bij een proces-verbaal van een deurwaarder dat, behalve de gewone formaliteiten, op straffe
      van nietigheid inhoudt:
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel504
  - number: 504.1.a
    text: de vermelding van de voornaam, naam en woonplaats van de executant en de naam en woonplaats van de geëxecuteerde;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel504
  - number: 504.1.b
    text: de vermelding van de titel uit hoofde waarvan het beslag wordt gelegd;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel504
  - number: 504.1.c
    text: |-
      de aard van de in beslag genomen onroerende zaken, hun kadastrale aanduiding, en, indien zij buiten de bebouwde kom
      zijn gelegen, zoveel mogelijk de grootte;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel504
  - number: 504.1.d
    text: |-
      indien het beslag wordt gelegd buiten het arrondissement waarin overeenkomstig [artikel 502, vierde lid][ref1],
      woonplaats is gekozen, een keuze van woonplaats ten kantore van de deurwaarder die het beslag legt.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel502
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel504
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '502'
        afdeling: Eerste
  - number: '504.2'
    text: |-
      In het proces-verbaal kan tevens een notaris worden aangewezen ten overstaan van wie de verkoop zal geschieden. In
      dat geval wordt in plaats van bij de deurwaarder, woonplaats bij de notaris gekozen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel504
  - number: 504a.1
    text: Het beslag kan slechts worden gelegd voor een vordering waarvan het geldelijk beloop bepaalbaar is.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel504a
  - number: 504a.2
    text: Zolang de vordering niet is vereffend, kan niet tot executoriale verkoop worden overgegaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel504a
  - number: '505.1'
    text: |-
      Het proces-verbaal van inbeslagneming zal in de in
      [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1] bedoelde openbare registers worden
      ingeschreven. Een afschrift van het proces-verbaal zal op straffe van nietigheid van het beslag niet later dan drie
      dagen na de inschrijving aan de geëxecuteerde worden betekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel505
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: '505.2'
    text: |-
      Een vervreemding, bezwaring, onderbewindstelling, verhuring of verpachting, tot stand gekomen na de inschrijving
      van het proces-verbaal, kan niet tegen de beslaglegger worden ingeroepen. Dit geldt niet voor verhuur van
      woonruimte waarop de [artikelen 271 tot en met 277 van Boek 7 van het Burgerlijk Wetboek][ref1] van toepassing
      zijn, tenzij de verhuring plaatsvond na de bekendmaking bedoeld in [artikel 516][ref2] of huurder wist dat de
      beslaglegger door de verhuring in zijn verhaalsmogelijkheden zou worden benadeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel271
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel516
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel505
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '271'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '516'
        afdeling: Tweede
  - number: '505.3'
    text: |-
      Indien de akte betreffende de vervreemding of bezwaring vóór de inschrijving van het beslag reeds was verleden,
      kan de vervreemding of bezwaring nog tegen de beslaglegger worden ingeroepen, mits de inschrijving van deze akte
      uiterlijk geschiedt de eerste dag, waarop het kantoor van de Dienst voor het kadaster en de openbare registers na
      de dag van de inschrijving van het beslag voor het publiek opengesteld is.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel505
  - number: '506.1'
    text: De geëxecuteerde is verplicht de in beslag genomen zaken in goede staat te houden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel506
  - number: '506.2'
    text: |-
      De voorzieningenrechter van de rechtbank kan op verzoek van een beslaglegger een gerechtelijke bewaarder van de
      zaak aanstellen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel506
  - number: '506.3'
    text: Tegen een aanstelling krachtens het vorige lid is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel506
  - number: '507.1'
    text: |-
      Vruchten en beplantingen, die ten tijde van de inschrijving zich nog op of in de zaak bevinden of te velde staan en
      vóór de verkoop worden geoogst, vallen mede onder het beslag, tenzij daarop rechten of beslagen van derden rusten,
      daaronder begrepen het pandrecht bedoeld in artikel 237, vierde lid, van Boek 3 van het Burgerlijk Wetboek.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel507
  - number: '507.2'
    text: |-
      [Artikel 451][ref1] is, mede ter zake van de inoogsting, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel451
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel507
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '451'
        afdeling: Eerste
  - number: '507.3'
    text: |-
      Na de betekening van het ingeschreven beslag aan de huurder of pachter valt de aan de geëxecuteerde nog
      verschuldigde huur en pacht onder het beslag en moet zij worden betaald aan de notaris ten overstaan van wie
      de executie zal plaatsvinden, mits dit bij de betekening uitdrukkelijk aan de huurder of pachter met opgave van
      de plaats van betaling wordt medegedeeld en behoudens de rechten van derden, die de executant moet eerbiedigen.
      Hetgeen aan de notaris wordt betaald, wordt gerekend tot de in [artikel 551][ref1] bedoelde opbrengst van de zaak.
      De [artikelen 475i ][ref2], [476][ref3] en [478][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel551
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475i
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel476
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel478
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel507
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '551'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475i
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '476'
        afdeling: Tweede
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '478'
        afdeling: Tweede
  - number: '507.4'
    text: |-
      Het vorige lid is van overeenkomstige toepassing op hetgeen aan de geëxecuteerde verschuldigd is als canon uit
      hoofde van een erfpacht of als retributie uit hoofde van een opstalrecht of erfdienstbaarheid of als tegenprestatie
      ter zake van een kwalitatieve verplichting als bedoeld in [artikel 252, vierde lid, van Boek 6 van het Burgerlijk
      Wetboek](onbekend).
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel507
  - number: 507a.1
    text: |-
      Eveneens vallen onder het beslag vorderingen tot vergoeding die na de inschrijving in de plaats van de zaak zijn
      getreden, daaronder begrepen vorderingen ter zake van waardevermindering van de zaak.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel507a
  - number: 507a.2
    text: |-
      Zij moeten met overeenkomstige toepassing van [artikel 507, derde lid][ref1], aan de notaris worden voldaan,
      behoudens de rechten van derden, die de executant moet eerbiedigen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel507
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel507a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '507'
        afdeling: Eerste
  - number: '508'
    text: |-
      Rusten op de in beslag genomen zaak een of meer hypotheken, dan zal de beslaglegger het door hem gelegde beslag
      uiterlijk binnen vier dagen na de inschrijving in de betreffende openbare registers aan de hypotheekhouders doen
      betekenen; de betekening mag geschieden aan de door deze overeenkomstig [artikel 260, eerste lid, derde zin, van
      Boek 3 van het Burgerlijk Wetboek](onbekend) gekozen woonplaats.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel508
  - number: '509.1'
    text: |-
      Indien een hypotheekhouder die uit hoofde van zijn recht bevoegd is tot executoriale verkoop, de executie
      wil overnemen en dit binnen veertien dagen nadat het beslag aan hem is betekend, aanzegt aan de executant met
      inachtneming van [artikel 544, tweede lid][ref1], geschiedt de executie verder door de hypotheekhouder en zijn de
      desbetreffende bepalingen van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel544
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel509
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '544'
        afdeling: Vierde
  - number: '509.2'
    text: |-
      Zijn er meer hypotheekhouders, dan komt deze bevoegdheid toe aan de hoogst gerangschikte hypotheekhouder, die de in
      het eerste lid bedoelde aanzegging heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel509
  - number: '509.3'
    text: |-
      Wordt niet binnen veertien dagen een aanzegging als in het eerste lid bedoeld gedaan, dan is de beslaglegger
      bevoegd de executie voort te zetten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel509
  - number: '513.1'
    text: |-
      Indien meer schuldeisers op dezelfde zaak beslag hebben gelegd, zal de executie plaatsvinden op de vervolging
      van degene die het eerst overeenkomstig [artikel 505, eerste lid][ref1], het proces-verbaal van beslag heeft doen
      inschrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel505
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel513
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '505'
        afdeling: Eerste
  - number: '513.2'
    text: |-
      De voorzieningenrechter van de rechtbank binnen welker rechtsgebied de zaak geheel of grotendeels is gelegen,
      kan op verzoek van een schuldeiser wiens proces-verbaal later is ingeschreven, bepalen dat deze de executie zal
      overnemen:
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel513
  - number: 513.2.a
    text: |-
      in geval van arglist van de schuldeiser wiens proces-verbaal het eerst is ingeschreven, of samenspanning van deze
      met de geëxecuteerde;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel513
  - number: 513.2.b
    text: indien deze schuldeiser de executie niet met redelijke spoed voortzet.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel513
  - number: '513.3'
    text: Tegen een beschikking krachtens het tweede lid is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel513
  - number: '513.4'
    text: Bij toepassing van het tweede lid wordt de overneming bij exploit aan de geëxecuteerde aangezegd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel513
  - number: 513a
    text: |-
      De inschrijving van het beslag kan worden doorgehaald met toepassing van de [artikelen 28](onbekend) en [29
      van Boek 3 van het Burgerlijk Wetboek](onbekend), met dien verstande dat de bewaarder mede tot doorhaling wordt
      gemachtigd door:
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel513a
  - number: 513a.1°
    text: |-
      een ingeschreven schriftelijke verklaring van de deurwaarder dat hij in opdracht van de executant het beslag opheft
      of dat het beslag is vervallen;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel513a
  - number: 513a.2°
    text: |-
      een overeenkomstig [artikel 17, eerste lid, onder ](onbekend) ingeschreven rechterlijke uitspraak die tot opheffing
      van het beslag strekt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel513a
  - number: '514.1'
    text: De executoriale verkoop geschiedt ten overstaan van een bevoegde notaris.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel514
  - number: '514.2'
    text: |-
      Zo de notaris niet reeds in het proces-verbaal van inbeslagneming is aangewezen, geschiedt de aanwijzing bij
      exploit aan de geëxecuteerde. Hetzelfde geldt voor de vervanging van een reeds aangewezen notaris.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel514
  - number: '514.3'
    text: |-
      Bij een exploit als bedoeld in het tweede lid kiest de executant op straffe van nietigheid woonplaats ten kantore
      van de aangewezen notaris.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel514
  - number: '515.1'
    text: |-
      De notaris stelt binnen veertien dagen na zijn aanwijzing of, zo er hypothecaire inschrijvingen zijn, binnen
      veertien dagen na het ongebruikt verstrijken van de in [artikel 509, eerste lid][ref1], bedoelde termijn, dag, uur
      en plaats van de verkoop vast.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel509
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel515
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '509'
        afdeling: Eerste
  - number: '515.2'
    text: |-
      Hij deelt schriftelijk dag, uur en plaats van de verkoop mede aan de geëxecuteerde en aan alle
      in [artikel 551][ref1] bedoelde beperkt gerechtigden en schuldeisers, een en ander aan de hand
      van een door de bewaarder van de openbare registers af te geven getuigschrift als bedoeld in
      [artikel 99 lid 1 van de Kadasterwet][ref2], waarin de inschrijvingen en de boekingen in de registers van
      voorlopige aantekeningen worden vermeld, die daartoe van belang zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel551
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel99
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel515
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '551'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '99'
  - number: '516.1'
    text: |-
      Geen verkoop zal kunnen plaatsvinden dan na verloop van dertig dagen, nadat zij door aanplakking volgens
      plaatselijk gebruik en door aankondiging in een plaatselijk verspreid dagblad zal zijn bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel516
  - number: '516.2'
    text: In de bekendmakingen wordt vermeld dat het een executoriale verkoop betreft.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel516
  - number: '517.1'
    text: |-
      De notaris stelt de veilconditiën vast, zulks in overleg met de executant en met inachtneming van het bepaalde in
      [artikel 519][ref1]. Tenminste acht dagen voor de verkoop doet hij de in [artikel 515, tweede lid][ref2], bedoelde
      ingeschrevenen en latere beslagleggers hiervan mededeling met toezending van een exemplaar van deze condities en
      legt hij tevens een exemplaar daarvan te zijnen kantore neer ter inzage voor het publiek.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel519
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel515
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel517
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '519'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '515'
        afdeling: Tweede
  - number: '517.2'
    text: |-
      Op verlangen van ieder der voormelde belanghebbenden kunnen de veilconditiën tevens inhouden dat de zaak wordt
      verkocht vrij van daarop rustende rechten of beperkingen, die niet tegen het recht van deze belanghebbende kunnen
      worden ingeroepen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel517
  - number: '518.1'
    text: |-
      Geschillen over de veilconditiën, over de wijze van verkoop of over dag, uur of plaats daarvan worden op verzoek
      van de meest gerede partij of van de notaris beslist door de voorzieningenrechter van de rechtbank in welker
      rechtsgebied de zaken geheel of grotendeels zijn gelegen, onverminderd de bevoegdheid van hen wier rechten bij de
      executie niet worden geëerbiedigd, zich daartegen overeenkomstig [artikel 538][ref1] te verzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel538
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel518
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '538'
        afdeling: Derde
  - number: '518.2'
    text: Tegen beschikkingen krachtens dit artikel is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel518
  - number: '519'
    text: De verkoop vindt in het openbaar plaats, eerst bij opbod en vervolgens bij afmijning.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel519
  - number: '520.1'
    text: |-
      De executant kan onroerende zaken die in verschillende arrondissementen zijn gelegen, slechts gezamenlijk voor één
      prijs verkopen, indien zij tezamen worden geëxploiteerd of door alle belanghebbenden bij de opbrengst gezamenlijke
      verkoop is overeengekomen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel520
  - number: '520.2'
    text: |-
      Is zulks niet overeengekomen, dan kan de voorzieningenrechter van de rechtbank binnen welker rechtsgebied de zaken
      grotendeels zijn gelegen op verzoek van de meest gerede partij of van de notaris bepalen dat de zaken gezamenlijk
      zullen worden verkocht.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel520
  - number: '520.3'
    text: Tegen beschikkingen krachtens het vorige lid is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel520
  - number: '521'
    text: |-
      Heeft de executant voor de schuld waarvoor hij beslag heeft gelegd tevens hypotheek op andere onroerende zaken
      of op beperkte rechten daarop, dan mag hij de in beslag genomen zaken slechts verkopen in geval de aan hem
      verhypothekeerde goederen ontoereikend zijn.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel521
  - number: '522'
    text: |-
      Indien meer onroerende zaken in dezelfde inbeslagneming zijn vervat en de opbrengst van het verkochte toereikend
      is om de executant, de beperkt gerechtigden wier recht vervalt, en de andere beslagleggers op deze zaken, met
      de kosten, te voldoen, zal de notaris met de verkoop der overige zaken niet verder gaan, tenzij de geëxecuteerde
      verklaart die verkoop te verlangen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel522
  - number: '523'
    text: |-
      De notaris is verplicht, voor zover hem dit mogelijk is, uiterlijk op de dag na de verkoop, van de verkoop
      schriftelijk kennis te geven aan de geëxecuteerde en aan alle in [artikel 551][ref1] bedoelde beperkt gerechtigden
      en schuldeisers.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel551
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel523
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '551'
        afdeling: Vijfde
  - number: '524'
    text: |-
      De koper is gehouden de koopprijs te voldoen in handen van de notaris. Deze voldoet daaruit de kosten van de
      executie.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel524
  - number: '525.1'
    text: De koper verkrijgt het recht op de verkochte zaken door inschrijving van het proces-verbaal van toewijzing.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel525
  - number: '525.2'
    text: |-
      De bewaarder van de openbare registers weigert inschrijving, indien niet tevens een verklaring van de notaris wordt
      overgelegd dat de koopprijs in zijn handen is gestort en, zo het om een verkoop bedoeld in [artikel 477][ref1],
      gaat, tevens een schriftelijke verklaring van de derde dat hij de zaak ter beschikking heeft gesteld van de
      deurwaarder die het beslag onder de derde heeft gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel477b
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel525
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 477b
        afdeling: Tweede
  - number: '525.3'
    text: |-
      De geëxecuteerde zal op enkel vertoon van het proces-verbaal tot ontruiming worden genoodzaakt op de wijze bepaald
      bij de [artikelen 556][ref1] en [557][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel556
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel557
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel525
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '556'
        afdeling: Zesde
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '557'
        afdeling: Zesde
  - number: '526.1'
    text: '[Artikel 273 van Boek 3 van het Burgerlijk Wetboek](onbekend) is van toepassing.'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel526
  - number: '526.2'
    text: |-
      Op de in dat artikel aangegeven wijze vervallen ook beperkte rechten die wel tegen de verkoper ingeroepen kunnen
      worden, indien de zaak vrij van deze rechten is verkocht overeenkomstig [artikel 517, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel517
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel526
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '517'
        afdeling: Tweede
  - number: '527'
    text: |-
      Schiet de koper tekort in de nakoming van de koopovereenkomst, dan mag de executant ten laste van de koper de
      verkochte zaak met inachtneming van de [artikelen 514 en volgende][ref1] wederom verkopen. De executant is tot deze
      verkoop gehouden, indien een van de bij de opbrengst direct belanghebbenden dit verlangt.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel514
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel527
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '514'
        afdeling: Tweede
  - number: '528'
    text: |-
      De koper zal deze nieuwe verkoop kunnen voorkomen door vóór de verkoop alsnog aan de koopovereenkomst te voldoen en
      de met betrekking tot deze nieuwe verkoop reeds gemaakte kosten te betalen met aanbod van zekerheid voor zover deze
      nog niet bekend mochten zijn.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel528
  - number: '529'
    text: |-
      De koper die in de nakoming van de koopovereenkomst tekortschiet, is aansprakelijk voor het verschil tussen de
      prijs waarvoor hij de zaak heeft gekocht en die van de nieuwe verkoop, zonder dat hij nochtans het meerdere dat
      deze laatste verkoop mocht hebben opgebracht, zal kunnen vorderen; dit meerdere zal aan de schuldeisers, of zo
      dezen niet meer te vorderen hebben, aan degenen tegen wie het beslag gedaan is, betaald worden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel529
  - number: '538.1'
    text: |-
      Treft het beslag een zaak die geheel of ten dele aan een ander toebehoort of waarop een recht van een ander rust
      dat de executant moet eerbiedigen, dan kan deze ander zich tegen verkoop waarbij zijn recht niet in acht wordt
      genomen, tot op het tijdstip van de verkoop verzetten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel538
  - number: '538.2'
    text: |-
      De eiser die in het ongelijk wordt gesteld, zal, op vordering van de executant, zo daartoe gronden zijn, tot
      schadevergoeding worden veroordeeld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel538
  - number: '539'
    text: |-
      De notaris aan wie een dagvaarding als bedoeld in het vorige artikel betekend wordt is bevoegd de verkoop van
      alle bij de executie betrokken zaken op te schorten, totdat de voorzieningenrechter van de rechtbank omtrent
      de schorsing van de executie zal hebben beslist op vordering van de meest gerede partij of op verlangen van de
      notaris, die zich daartoe bij de voorzieningenrechter kan vervoegen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel539
  - number: '540'
    text: |-
      Indien de verkoop door het verzet is vertraagd, kan deze niet plaatsvinden dan nadat de in [artikel 516][ref1]
      bedoelde bekendmakingen opnieuw hebben plaatsgevonden en de daar bedoelde termijn opnieuw is in acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel516
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel540
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '516'
        afdeling: Tweede
  - number: '544.1'
    text: |-
      De hypotheekhouder is verplicht de executie te doen inleiden door een aanzegging daarvan of van de in
      [artikel 509][ref1] bedoelde overneming aan de hypotheekgever, de schuldenaar en hen van wier recht of beslag uit
      de registers blijkt en wier recht door de executoriale verkoop zal tenietgaan of vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel509
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel544
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '509'
        afdeling: Eerste
  - number: '544.2'
    text: 'De aanzegging van de executie of de overneming daarvan geschiedt bij exploit van een deurwaarder en houdt in:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel544
  - number: 544.2.a
    text: |-
      zo nauwkeurig mogelijk het bedrag waarvoor de hypotheekhouder uit hoofde van zijn recht tot executie wil overgaan,
      en de ter zake tot het tijdstip van de aanzegging reeds gemaakte kosten;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel544
  - number: 544.2.b
    text: de aanwijzing van de notaris ten overstaan van wie de verkoop zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel544
  - number: '544.3'
    text: |-
      Een hypotheekhouder kan de executie ook overnemen van een andere hypotheekhouder wiens recht in rang na het zijne
      komt, door binnen veertien dagen nadat hem de in het eerste lid bedoelde aanzegging is gedaan, van de overneming
      aanzegging te doen. Artikel 509 is van overeenkomstige toepassing. De vorige leden worden opnieuw in acht genomen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel544
  - number: '545.1'
    text: |-
      Indien de hypotheekhouder in gebreke mocht blijven de executie met redelijke spoed voort te zetten, kan elke
      beslaglegger of hypotheekhouder aan de voorzieningenrechter van de rechtbank binnen welker rechtsgebied de zaken
      geheel of grotendeels zijn gelegen, verzoeken een termijn vast te stellen, waarbinnen de hypotheekhouder tot de
      verkoop of tot indiening van een verzoek tot onderhandse verkoop moet overgaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel545
  - number: '545.2'
    text: |-
      Bij overschrijding van de termijn wordt de executie voortgezet door de verzoeker met de hoogst gerangschikte
      hypotheek of, zo onder de verzoekers geen hypotheekhouder is, door de schuldeiser wiens beslag het eerst is
      ingeschreven.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel545
  - number: '545.3'
    text: Tegen een beschikking krachtens het eerste lid is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel545
  - number: '546'
    text: |-
      De [artikelen 514, tweede lid, tweede zin, en derde lid][ref1], [515-520][ref2], [522][ref3], [523][ref4],
      [525][ref5], [526, tweede lid][ref6], en [527-529][ref7] zijn ook bij executie door een hypotheekhouder van
      toepassing met inachtneming van de volgende artikelen van deze afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel514
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel515
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel522
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel523
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel525
      [ref6]: https://wetten.overheid.nl/BWBR0001827#Artikel526
      [ref7]: https://wetten.overheid.nl/BWBR0001827#Artikel527
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel546
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '514'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '515'
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '522'
        afdeling: Tweede
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '523'
        afdeling: Tweede
      - id: ref5
        bwb_id: BWBR0001827
        artikel: '525'
        afdeling: Tweede
      - id: ref6
        bwb_id: BWBR0001827
        artikel: '526'
        afdeling: Tweede
      - id: ref7
        bwb_id: BWBR0001827
        artikel: '527'
        afdeling: Tweede
  - number: '547.1'
    text: |-
      De in [artikel 515][ref1] bedoelde termijn loopt vanaf de dag van de in [artikel 544][ref2] bedoelde aanzegging aan
      de hypotheekgever.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel515
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel544
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel547
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '515'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '544'
        afdeling: Vierde
  - number: '547.2'
    text: |-
      In de in [artikel 516][ref1] bedoelde aanplakking en aankondiging dient tevens te zijn opgenomen dat tot veertien
      dagen vóór de voor de verkoop bepaalde dag ondershands op de te executeren zaken kan worden geboden bij een aan de
      notaris gericht geschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel516
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel547
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '516'
        afdeling: Tweede
  - number: '547.3'
    text: De notaris geeft van de binnengekomen biedingen onverwijld afschrift aan de executant en de geëxecuteerde.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel547
  - number: '548.1'
    text: |-
      Tot één week vóór de voor de verkoop bepaalde dag kan bij de voorzieningenrechter van de rechtbank het in [artikel
      268, tweede lid, van Boek 3 van het Burgerlijk Wetboek](onbekend) bedoelde verzoek dat de verkoop ondershands zal
      geschieden, worden ingediend.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel548
  - number: '548.2'
    text: |-
      Dit verzoek kan uitsluitend worden gedaan, indien tevens een volledige koopakte wordt overgelegd, zij het dat,
      indien het verzoek niet door de executant wordt gedaan, de akte niet door of namens hem ondertekend behoeft te
      zijn. Tevens dienen in afschrift te worden overgelegd de biedingen die bij de notaris zijn binnengekomen dan wel
      een verklaring van de notaris dat hij zulke biedingen niet heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel548
  - number: '548.3'
    text: |-
      Bij verzoekschrift wordt voorts een lijst overgelegd van de in [artikel 544][ref1] bedoelde belanghebbenden.
      De griffier deelt hun onverwijld mede dat het verzoek is gedaan en dat zij op hun verlangen door de
      voorzieningenrechter kunnen worden gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel544
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel548
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '544'
        afdeling: Vierde
  - number: '548.4'
    text: |-
      Door tijdige indiening van het verzoek vervalt de voor de openbare verkoop bepaalde dag. Wordt het verzoek
      afgewezen, dan zal de rechter tevens de dag bepalen waarop de openbare verkoop zal plaatsvinden. Deze verkoop
      zal tenminste veertien dagen tevoren op de in [artikel 516][ref1] bedoelde wijze worden bekendgemaakt. De
      voorzieningenrechter kan de verzoeker in de kosten van de bekendmaking veroordelen, onverminderd diens verplichting
      de door het verzoek ontstane schade te vergoeden, zo daartoe gronden zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel516
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel548
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '516'
        afdeling: Tweede
  - number: '549.1'
    text: |-
      Een verzoekschrift van de hypotheekhouder tot het verkrijgen van het verlof, bedoeld in
      [artikel 264 lid 5 van Boek 3 van het Burgerlijk Wetboek][ref1] kan, behalve door een procureur, ook door een
      notaris worden ingediend, in welk geval diens kantoor als gekozen woonplaats van de verzoeker geldt. Bij het
      verzoekschrift wordt overgelegd een niet langer dan één maand tevoren aan de huurder of, als de woonruimte in zijn
      plaats door een onderhuurder wordt bewoond, aan de onderhuurder door een deurwaarder uitgebracht exploit waarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel264
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel549
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '264'
  - number: 549.1.a
    text: |-
      aan de huurder of onderhuurder wordt betekend de aanzegging of de overneming van de executie door de
      hypotheekhouder bedoeld in [artikel 544][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel544
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel549
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '544'
        afdeling: Vierde
  - number: 549.1.b
    text: aan de huurder of onderhuurder wordt aangezegd dat het beding jegens de huurder zal worden ingeroepen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel549
  - number: '549.2'
    text: |-
      De voorzieningenrechter beslist niet dan na verhoor of behoorlijke oproeping van de huurder en de eventuele
      onderhuurders.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel549
  - number: '549.3'
    text: |-
      Indien het onderpand met overlating aan de koper van de bevoegdheid het beding in te roepen wordt verkocht, gaan
      ook de rechten uit de beschikking waarbij het verlof is verleend, op de koper over.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel549
  - number: '549.4'
    text: |-
      Onder de huurder in de zin van dit artikel wordt begrepen degene die ingevolge [artikel 266 lid 1][ref1] of
      [artikel 267 lid 1 van Boek 7 van het Burgerlijk Wetboek][ref2] medehuurder is.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel266
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel267
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel549
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '266'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '267'
  - number: '551.1'
    text: |-
      Indien er geen andere schuldeiser is, die op het geëxecuteerde of op de koopprijs beslag heeft gelegd, en evenmin
      door de executie een beperkt recht vervalt, draagt de notaris aan de executant uit de netto-opbrengst van de
      zaak af hetgeen aan deze blijkens een door hem te dien aanzien aan de notaris afgelegde verklaring krachtens zijn
      executoriale titel toekomt; het overschot keert de notaris uit aan de geëxecuteerde.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel551
  - number: '551.2'
    text: |-
      Ingeval er wel schuldeisers of beperkt gerechtigden zijn, als in het eerste lid bedoeld, dan wel de in dat lid
      bedoelde verklaring wordt betwist of de notaris ernstige reden heeft te vermoeden dat zij onjuist is, stort de
      notaris de netto-opbrengst onverwijld bij een door hem aangewezen bewaarder die aan de in [artikel 445][ref1]
      bedoelde eisen voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel445
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel551
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '445'
        afdeling: Eerste
  - number: '551.3'
    text: |-
      Wanneer de schuldeisers die op de zaak of op de koopprijs beslag hebben gelegd, de beperkt gerechtigden wier recht
      door de executie vervalt, en de geëxecuteerde het vóór de betaaldag van de koopsom omtrent de verdeling van de te
      storten som eens zijn geworden, blijft de storting achterwege en keert de notaris aan ieder het hem toekomende uit.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel551
  - number: '551.4'
    text: |-
      Voor zover de verplichtingen welke ingevolge dit artikel op de notaris rusten, niet worden nagekomen, is de Staat
      jegens belanghebbenden voor de daaruit voor hen voortvloeiende schade met de notaris hoofdelijk aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel551
  - number: '551.5'
    text: |-
      In geval van executie door een hypotheekhouder is niet dit artikel, maar [artikel 270 van Boek 3 van het Burgerlijk
      Wetboek](onbekend) van toepassing.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel551
  - number: '551.6'
    text: Van het in dit artikel bepaalde kan in de koopvoorwaarden niet worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel551
  - number: 551a.1
    text: |-
      Na de betaling van de koopprijs is ieder der in het derde lid van het vorige artikel genoemde belanghebbenden
      bevoegd een gerechtelijke rangregeling te verzoeken.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel551a
  - number: 551a.2
    text: |-
      Indien deze belanghebbenden met betrekking tot de verdeling alsnog tot overeenstemming komen en daarvan door een
      authentieke akte doen blijken aan de in [artikel 551, tweede lid][ref1], bedoelde bewaarder, keert deze aan ieder
      het hem volgens deze akte toekomende uit.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel551
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel551a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '551'
        afdeling: Vijfde
  - number: '552.1'
    text: |-
      Een gerechtelijke rangregeling, bedoeld in het vorige artikel en in [artikel 271 van Boek 3 van het Burgerlijk
      Wetboek](onbekend), wordt verzocht door aan de voorzieningenrechter van de rechtbank binnen welker rechtsgebied
      zich de geëxecuteerde zaken geheel of grotendeels bevinden, de benoeming van een rechter-commissaris te verzoeken,
      te wiens overstaan de verdeling zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel552
  - number: '552.2'
    text: |-
      Bij het verzoekschrift wordt gevoegd een door de bewaarder van de openbare registers af te geven getuigschrift
      als bedoeld in [artikel 99 lid 1 van de Kadasterwet][ref1], waarin de inschrijvingen en de boekingen in het
      register van voorlopige aantekeningen worden vermeld, die voor de aanwijzing van de in [artikel 551][ref2] bedoelde
      belanghebbenden van belang zijn, alsmede een door de notaris af te geven staat van de schuldeisers die beslag
      hebben gelegd op de opbrengst van de executie of hun vordering ontlenen aan [artikel 264, lid 7 van Boek 3 van het
      Burgerlijk Wetboek.](onbekend)


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel551
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel552
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '99'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '551'
        afdeling: Vijfde
  - number: '552.3'
    text: Tegen een benoeming krachtens het eerste lid is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel552
  - number: '552.4'
    text: |-
      Op de rangregeling zijn de [artikelen 482-490][ref1], [490][ref2] en [490][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel482
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel490c
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel490d
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel552
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '482'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 490c
        afdeling: Derde
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 490d
        afdeling: Derde
  - number: '553.1'
    text: |-
      Ingeval bij een executoriale verkoop meer onroerende zaken of daarop rustende rechten tezamen, dan wel een of
      meer onroerende zaken of daarop rustende rechten tezamen met daarbij behorende roerende zaken, zoals omschreven in
      [artikel 254 van Boek 3 van het Burgerlijk Wetboek](onbekend), voor één prijs zijn verkocht en er deelnemers aan de
      rangregeling zijn, wier recht of voorrang niet alle verkochte zaken of rechten betreft, deelt ieder van hen alleen
      mee of alleen met voorrang mee in het gedeelte van de netto-opbrengst dat naar schatting kan worden toegerekend aan
      de zaken of rechten waarop zijn recht of voorrang betrekking had.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel553
  - number: '553.2'
    text: |-
      In de in [artikel 483][ref1] bedoelde staat van verdeling zal de rechter-commissaris aan de hand van de overgelegde
      stukken en zo nodig na verhoor van deskundigen een verdeling overeenkomstig het vorige lid voorstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel483
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel553
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '483'
        afdeling: Derde
  - number: '555'
    text: |-
      De gedwongen ontruiming van onroerende zaken moet worden voorafgegaan door een exploit van een deurwaarder,
      houdende bevel om binnen drie dagen aan de executoriale titel te voldoen. De [artikelen 502][ref1] en [503][ref2]
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel502
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel503
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel555
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '502'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '503'
        afdeling: Eerste
  - number: '556.1'
    text: De gedwongen ontruiming geschiedt door een deurwaarder.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel556
  - number: '556.2'
    text: |-
      Deze kan zich doen bijstaan door een of twee getuigen, wier naam en woonplaats hij in dat geval in zijn proces-
      verbaal zal vermelden en die dit stuk mede zullen tekenen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel556
  - number: '557'
    text: |-
      Indien de deuren gesloten zijn, of de opening geweigerd wordt, gelijk mede indien geweigerd wordt enige kamer te
      openen, is [artikel 444][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel444
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel557
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '444'
        afdeling: Eerste
  - number: 557a.1
    text: |-
      Tenzij zulks onverenigbaar zou zijn met het belang van degene op wiens vordering het bevel wordt gedaan, kan
      de rechter bepalen dat een vonnis, waarbij aan anderen dan aan gebruikers of gewezen gebruikers krachtens een
      persoonlijk of zakelijk recht de ontruiming wordt bevolen van een gebouwde onroerende zaak of gedeelte daarvan,
      binnen een door hem te bepalen termijn niet ten uitvoer kan worden gelegd, onverminderd het recht van de
      eerstgenoemde op vergoeding van alle geleden of te lijden schade.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel557a
  - number: 557a.2
    text: |-
      Tenzij zulks onverenigbaar zou zijn met het belang van degene op wiens vordering het bevel tot ontruiming wordt
      gedaan, bepaalt de rechter dat dit bevel niet ten uitvoer kan worden gelegd, totdat hij omtrent het al dan niet
      bepalen van een termijn als in het vorige lid bedoeld heeft beslist, na terzake inlichtingen te hebben ingewonnen
      bij burgemeester en wethouders van de gemeente waarin de onroerende zaak zich bevindt. Hiertoe beveelt hij
      burgemeester en wethouders binnen een door hem te bepalen termijn hun schriftelijk bericht ter griffie in te
      leveren of op een door hem te bepalen terechtzitting mondeling verslag te doen of door een door hen aangewezen
      ambtenaar te laten doen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel557a
  - number: 557a.3
    text: |-
      Desgevorderd kan de rechter bepalen dat een vonnis, waarbij aan anderen dan aan gebruikers of gewezen gebruikers
      krachtens een persoonlijk of zakelijk recht de ontruiming wordt bevolen van een gebouwde onroerende zaak of
      gedeelte daarvan, tot een jaar na de dag waarop het vonnis wordt uitgesproken dan wel bekrachtigd, of, indien de
      rechter een termijn bepaalt als bedoeld in het eerste lid, tot een jaar na de dag waarop die datum verstrijkt,
      ten uitvoer kan worden gelegd tegen een ieder die ten tijde van de tenuitvoerlegging zich daar bevindt of daar
      binnentreedt en telkens wanneer dat zich voordoet.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel557a
  - number: '558'
    text: |-
      Deze afdeling is mede van toepassing, indien een gehele of gedeeltelijke al of niet tijdelijke ontruiming nodig
      is, omdat:
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel558
  - number: 558.a
    text: |-
      de executant overeenkomstig [artikel 299 van Boek 3 van het Burgerlijk Wetboek][ref1] is gemachtigd ten aanzien
      van een onroerende zaak zelf datgene te verrichten waartoe nakoming van een jegens hem bestaande verplichting zou
      hebben geleid; of


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel299
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel558
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '299'
  - number: 558.b
    text: |-
      de executant krachtens de door hem verkregen uitspraak gerechtigd is werkzaamheden op of aan een onroerende zaak te
      verrichten en degene tegen wie de tenuitvoerlegging zich richt, gehouden is dit te gedogen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel558
  - number: 562a
    text: In deze titel wordt onder schepen mede verstaan schepen in aanbouw.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel562a
  - number: '563.1'
    text: |-
      Het beslag op schepen moet worden voorafgegaan door een aan de eigenaar of boekhouder te betekenen exploit van een
      deurwaarder, houdende een bevel om binnen vierentwintig uur aan de executoriale titel te voldoen. Eerst na verloop
      van die termijn kan het beslag worden gelegd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel563
  - number: '563.2'
    text: |-
      Indien er echter vrees bestaat dat het schip spoedig naar een andere plaats zal vertrekken kan de
      voorzieningenrechter van de rechtbank, ook op mondeling verzoek van de deurwaarder, bepalen dat deze ook zonder
      voorafgaand bevel tot de inbeslagneming kan overgaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel563
  - number: '563.3'
    text: |-
      In dat geval zal, in afwijking van [artikel 430, derde lid][ref1], de betekening van de titel tezamen met die van
      het proces-verbaal van inbeslagneming kunnen geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel430
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel563
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '430'
  - number: '564.1'
    text: Het beslag op schepen wordt aan boord daarvan gedaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel564
  - number: '564.2'
    text: |-
      De deurwaarder kan zich doen bijstaan door één of twee getuigen, wier naam en woonplaats hij in dat geval in het in
      [artikel 565][ref1] bedoelde proces-verbaal zal vermelden en die dat stuk mede zullen ondertekenen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel565
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel564
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '565'
        afdeling: Eerste
  - number: '564.3'
    text: |-
      De deurwaarder kan een bewaarder aan boord stellen en de nodige maatregelen nemen om het vertrek van het schip
      te beletten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel564
  - number: '565.1'
    text: |-
      Het beslag geschiedt bij een proces-verbaal van een deurwaarder dat, behalve de gewone formaliteiten, op straffe
      van nietigheid inhoudt:
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel565
  - number: 565.1.a
    text: de vermelding van de voornaam, naam en woonplaats van de executant;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel565
  - number: 565.1.b
    text: de vermelding van de titel uit hoofde waarvan het beslag wordt gelegd;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel565
  - number: 565.1.c
    text: een opgave van het bedrag dat krachtens deze titel aan de executant verschuldigd is;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel565
  - number: 565.1.d
    text: |-
      de naam en de woonplaats van de eigenaar of de boekhouder, de naam van de kapitein of de schipper, telkens indien
      zij bekend zijn, en de naam en woonplaats van hem jegens wie de onder *b* bedoelde titel luidt, indien deze een
      ander is dan de eigenaar;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel565
  - number: 565.1.e
    text: |-
      de naam, de soort en de ruimte van het schip en zo het schip teboekstaat in het register, genoemd in
      [artikel 193](onbekend) of [783 van Boek 8 van het Burgerlijk Wetboek](onbekend), de gegevens omschreven in
      [artikel 21, eerste lid onder ][ref1] (*Stb.* 1989, 186);


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel21
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel565
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '21'
  - number: 565.1.f
    text: de algemene omschrijving van het scheepstoebehoren.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel565
  - number: '565.2'
    text: 'In het proces-verbaal moet de executant tot het einde van de executie woonplaats kiezen in Nederland:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel565
  - number: 565.2.a
    text: |-
      in geval in het proces-verbaal een notaris wordt aangewezen ten overstaan van wie de verkoop met toepassing van
      [artikel 570][ref1] zal plaatsvinden: bij die notaris of bij een advocaat;


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel570
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel565
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '570'
        afdeling: Eerste
  - number: 565.2.b
    text: |-
      in geval het voornemen bestaat de verkoop met toepassing van [artikel 575][ref1] te doen plaats vinden voor de
      rechtbank: bij een advocaat;


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel575
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel565
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '575'
        afdeling: Eerste
  - number: 565.2.c
    text: |-
      in geval de verkoop dient plaats te vinden met toepassing van [artikel 576][ref1]: bij de deurwaarder of bij een
      advocaat.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel576
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel565
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '576'
        afdeling: Eerste
  - number: '565.3'
    text: |-
      Het proces-verbaal wordt binnen acht dagen betekend aan de eigenaar van het schip of, als deze een rederij is en
      een boekhouder heeft, aan de boekhouder, alsmede aan degene jegens wie de in het eerste lid onder *b* bedoelde
      titel luidt, indien dit een andere is dan de eigenaar.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel565
  - number: '565.4'
    text: |-
      Indien de eigenaar van het schip of de boekhouder niet bekend is, kan aan de eis van het vorige lid worden voldaan
      doordat het proces-verbaal wordt betekend aan boord aan de kapitein of de schipper of zijn plaatsvervanger; zo deze
      niet te bereiken zijn, vindt de betekening plaats door een afschrift van het betekende proces-verbaal aan boord van
      het schip aan te plakken.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel565
  - number: '565.5'
    text: |-
      [Artikel 435 lid 3][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel435
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel565
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '435'
  - number: '566.1'
    text: |-
      Het proces-verbaal van inbeslagneming van schepen die teboekstaan in het in [artikel 193][ref1] of
      [artikel 783 van Boek 8 van het Burgerlijk Wetboek][ref2] genoemde register, zal worden ingeschreven in de in
      [afdeling 2, Titel 1 van Boek 3 van het Burgerlijk Wetboek][ref3] bedoelde openbare registers.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel193
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel783
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel566
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '193'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '783'
      - id: ref3
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: '566.2'
    text: |-
      Een vervreemding, bezwaring, onderbewindstelling, verhuring of vervrachting, totstandgekomen na de inschrijving van
      het proces-verbaal, kan niet tegen de beslaglegger worden ingeroepen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel566
  - number: '566.3'
    text: |-
      De in [artikel 565, derde lid][ref1], bedoelde betekening dient tevens binnen acht dagen na de inschrijving te
      geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel565
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel566
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '565'
        afdeling: Eerste
  - number: '566.4'
    text: |-
      [Artikel 513a][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel513a
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel566
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 513a
        afdeling: Eerste
  - number: '567'
    text: |-
      Een inbeslagneming van schepen die niet teboekstaan in het in [artikel 193](onbekend) of [artikel 783 van Boek
      8 van het Burgerlijk Wetboek](onbekend) genoemde register, heeft tot gevolg dat een vervreemding, bezwaring,
      onderbewindstelling, verhuring of vervrachting, totstandgekomen na de in [artikel 565, derde lid][ref1], bedoelde
      betekening, niet tegen de beslaglegger kan worden ingeroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel565
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel567
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '565'
        afdeling: Eerste
  - number: '568'
    text: |-
      Indien op een in beslag genomen schip dat teboekstaat in het in [artikel 193](onbekend) of [artikel 783
      van Boek 8 van het Burgerlijk Wetboek](onbekend) genoemde register, een of meer hypotheken rusten, zijn de
      [artikelen 508][ref1] en [509][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel508
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel509
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel568
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '508'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '509'
        afdeling: Eerste
  - number: '569.1'
    text: |-
      Indien meer schuldeisers op hetzelfde schip beslag hebben gelegd, zal de executie plaatsvinden op vervolging van
      degene die het oudste executoriale beslag heeft gelegd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel569
  - number: '569.2'
    text: |-
      De voorzieningenrechter van de rechtbank binnen welker rechtsgebied de verkoop zal plaats vinden, kan op verzoek
      van een schuldeiser die later beslag heeft gelegd, bepalen dat deze de executie zal overnemen, indien de executant
      de executie niet met redelijke spoed voortzet.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel569
  - number: '569.3'
    text: Tegen een beschikking als bedoeld in het tweede lid is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel569
  - number: '569.4'
    text: |-
      Bij toepassing van het tweede lid wordt de overneming bij exploit aangezegd aan de in
      [artikel 565, derde en vierde lid][ref1], aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel565
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel569
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '565'
        afdeling: Eerste
  - number: '570.1'
    text: |-
      De executoriale verkoop geschiedt ten overstaan van een bevoegde notaris, tenzij de executant gebruik maakt van de
      hem in [artikel 575][ref1] toegekende bevoegdheid of [artikel 576][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel575
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel576
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel570
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '575'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '576'
        afdeling: Eerste
  - number: '570.2'
    text: |-
      In geval van verkoop ten overstaan van een notaris zijn de [artikelen 514, tweede en derde lid][ref1], [515][ref2],
      [517-519][ref3], [523][ref4], [525][ref5] en [528-540][ref6] van overeenkomstige toepassing, voor zover daarvan in
      de volgende bepalingen van deze afdeling niet wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel514
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel515
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel517
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel523
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel525
      [ref6]: https://wetten.overheid.nl/BWBR0001827#Artikel528
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel570
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '514'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '515'
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '517'
        afdeling: Tweede
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '523'
        afdeling: Tweede
      - id: ref5
        bwb_id: BWBR0001827
        artikel: '525'
        afdeling: Tweede
      - id: ref6
        bwb_id: BWBR0001827
        artikel: '528'
        afdeling: Tweede
  - number: '571.1'
    text: |-
      Geen verkoop zal kunnen plaatsvinden dan na verloop van veertien dagen, nadat zij bekend zal zijn gemaakt door
      aanplakking volgens plaatselijk gebruik, die in elk geval mede op een in het oog vallende plaats van het schip
      geschiedt, en door aankondiging in een ter plaatse waar het schip zich bevindt verspreid dagblad.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel571
  - number: '571.2'
    text: |-
      Geldt het de verkoop van een buitenlands zeeschip, dan wordt een kennisgeving bovendien, zo mogelijk,
      geplaatst in één of meer door de voorzieningenrechter van de rechtbank binnen welker rechtsgebied
      de verkoop zal plaatsvinden, aan te wijzen nieuwsbladen van het land waartoe het schip behoort.
      Geldt het de verkoop van een binnenschip dat teboekstaat in een Verdragsregister als bedoeld in
      [artikel 781 onder d van Boek 8 van het Burgerlijk Wetboek][ref1], dan wel in enig soortgelijk buitenlands
      register, dan wordt een kennisgeving bovendien, zo mogelijk, geplaatst in één of meer door de voorzieningenrechter
      van de rechtbank aan te wijzen nieuwsbladen van het land, waar het register wordt gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel781
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel571
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '781'
  - number: '571.3'
    text: |-
      Geldt het de verkoop van een buitenlands zeeschip of van een binnenschip dat teboekstaat in een register als
      genoemd in [artikel 781 onder d van Boek 8 van het Burgerlijk Wetboek][ref1], dan wel van een in enig soortgelijk
      buitenlands register teboekstaand binnenschip, dan wordt in plaats van een termijn van veertien dagen in acht
      genomen de door de voorzieningenrechter van de rechtbank te bepalen termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel781
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel571
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '781'
  - number: '571.4'
    text: |-
      Het in het derde lid bepaalde geldt eveneens, indien het de verkoop betreft van een binnenschip, dat niet in
      een der in [artikel 781 van Boek 8 van het Burgerlijk Wetboek][ref1] genoemde registers, noch in enig ander
      soortgelijk buitenlands register teboekstaat en dat een vrachtschip is van 20 of meer tonnen laadvermogen dan
      wel een ander binnenschip is met 10 of meer kubieke meters verplaatsing, zijnde de in kubieke meters uitgedrukte
      waterverplaatsing tussen het vlak van inzinking van het lege binnenschip in zoet water en het vlak van de grootste
      toegelaten diepgang.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel781
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel571
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '781'
  - number: '571.5'
    text: |-
      De in het tweede tot en met vierde lid bedoelde beslissingen van de voorzieningenrechter worden gegeven op verzoek
      van de executant of de notaris, ten overstaan van wie de verkoop zal geschieden. Tegen toewijzing van het verzoek
      is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel571
  - number: '572'
    text: |-
      De in [artikel 571][ref1] bedoelde aanplakkingen en aankondigingen moeten inhouden:


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel571
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel572
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '571'
        afdeling: Eerste
  - number: 572.a
    text: |-
      naar gelang de verkoop zal plaatsvinden met toepassing van [artikel 570][ref1], [575][ref2] of 576 de naam van de
      notaris ten overstaan van wie de verkoop zal geschieden, de rechtbank voor welke de verkoop zal plaatsvinden of de
      naam van de deurwaarder die met de verkoop is belast;


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel570
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel575
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel572
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '570'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '575'
        afdeling: Eerste
  - number: 572.b
    text: |-
      de voornaam, naam en woonplaats van de executant, alsmede de door deze met inachtneming van
      [artikel 565, tweede lid][ref1] gekozen woonplaats;


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel565
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel572
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '565'
        afdeling: Eerste
  - number: 572.c
    text: |-
      de titel uit hoofde waarvan de verkoop plaatsvindt, en het bedrag dat krachtens deze titel aan de executant
      verschuldigd is;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel572
  - number: 572.d
    text: |-
      de naam en de woonplaats van de eigenaar of de boekhouder van het in beslag genomen schip, indien een en ander
      bekend is, alsmede van hem jegens wie de onder *c* bedoelde titel luidt, indien deze een ander is dan de eigenaar;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel572
  - number: 572.e
    text: de naam van het schip;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel572
  - number: 572.f
    text: de scheepsruimte;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel572
  - number: 572.g
    text: de plaats waar het schip zich bevindt;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel572
  - number: 572.h
    text: de plaats, de dag en het uur, waarop de verkoop zal plaatshebben.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel572
  - number: '573'
    text: |-
      Vindt verkoop ten overstaan van een notaris plaats van een schip dat niet teboekstaat in het in [artikel 193]
      (onbekend) of [artikel 783 van Boek 8 van het Burgerlijk Wetboek](onbekend) genoemde register, dan vinden de in
      [artikel 515, tweede lid][ref1], en[ 517, eerste lid][ref2], bedoelde mededelingen plaats aan de rechthebbenden en
      beslagleggers die aan de notaris bekend zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel515
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel517
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel573
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '515'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '517'
        afdeling: Tweede
  - number: '574'
    text: |-
      In het in [artikel 573][ref1] bedoelde geval is [artikel 525, eerste en tweede lid][ref2], niet van toepassing, en
      geschiedt de levering met toepassing van de regels die ter zake van levering van een schip van de betreffende soort
      in acht dienen te worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel573
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel525
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel574
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '573'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '525'
        afdeling: Tweede
  - number: '575.1'
    text: |-
      Geldt de verkoop een buitenlands zeeschip, dan kan zij ook plaats vinden voor de rechtbank ter openbare
      terechtzitting. De executant verzoekt daartoe aan de rechtbank voor welke hij voornemens is de executie te doen
      plaatsvinden, bepaling van dag en uur van de verkoop. De rechtbank stelt deze vast met inachtneming van de in het
      tweede lid bedoelde termijnen waarbinnen geen verkoop kan plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel575
  - number: '575.2'
    text: |-
      De verkoop kan, onverminderd de in [artikel 571][ref1] voorgeschreven termijn, niet plaats vinden voordat dertig
      dagen zijn verstreken nadat de executant ter griffie heeft gedeponeerd:


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel571
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel575
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '571'
        afdeling: Eerste
  - number: 575.2.a
    text: de veilingvoorwaarden;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel575
  - number: 575.2.b
    text: |-
      een verklaring van de deurwaarder of van een advocaat dat aan de in [artikel 571, eerste lid][ref1], voorgeschreven
      aanplakkingen en aankondigingen is voldaan, waarbij exemplaren daarvan zijn gevoegd;


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel571
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel575
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '571'
        afdeling: Eerste
  - number: 575.2.c
    text: een door een advocaat opgestelde en ondertekende lijst van de bekende rechthebbenden en beslagleggers op het schip.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel575
  - number: '575.3'
    text: |-
      De executant deelt onverwijld aan de in het tweede lid onder *c* bedoelde rechthebbenden en beslagleggers
      schriftelijk dag en uur van de verkoop mede en deponeert ter griffie een verklaring van een advocaat dat aan dit
      voorschrift is voldaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel575
  - number: '575.4'
    text: |-
      Tenminste drie dagen voor de aanvang van de verkoop stelt de voorzieningenrechter van de rechtbank een staat van
      geschatte kosten van de executie op, die op de griffie en ter terechtzitting ter inzage wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel575
  - number: '575.5'
    text: |-
      De verkoop geschiedt eerst bij opbod en vervolgens bij afmijning. Met betrekking tot de veilingvoorwaarden zijn de
      [artikelen 517, tweede lid][ref1], en [518][ref2] van overeenkomstige toepassing. De executant geeft schriftelijk
      van de verkoop kennis aan de geëxecuteerde en de hem bekende rechthebbenden en beslagleggers.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel517
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel518
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel575
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '517'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '518'
        afdeling: Tweede
  - number: '575.6'
    text: Tegen het vonnis van verkoop en toewijzing is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel575
  - number: '575.7'
    text: |-
      [Artikel 538][ref1] is van overeenkomstige toepassing. De dagvaarding waarbij het verzet plaatsvindt, wordt mede
      aan de griffier betekend. Deze betekening schorst de executie.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel538
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel575
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '538'
        afdeling: Derde
  - number: '575.8'
    text: |-
      De rechtbank kan op verzoek van de executant nader dag en uur van de verkoop vaststellen. In dat geval vinden de in
      [artikel 571, eerste lid][ref1], bedoelde aanplakkingen en aankondigingen opnieuw plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel571
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel575
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '571'
        afdeling: Eerste
  - number: '576.1'
    text: 'De verkoop zal geschieden als die van andere roerende zaken, indien het beslag gelegd is op:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel576
  - number: 576.1.a
    text: |-
      zeeschepen, waarvan de bruto-inhoud minder dan 20 kubieke meters of de brutotonnage minder dan 6 bedraagt of, in
      geval van een schip in aanbouw zal bedragen, en die niet in het in [artikel 193 van Boek 8](onbekend) bedoelde
      register teboekstaan, of op
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel576
  - number: 576.1.b
    text: |-
      binnenschepen als bedoeld in het [tweede lid van artikel 785 van Boek 8 onder ](onbekend), die niet teboekstaan
      in een der registers genoemd in [artikel 781 van Boek 8 van het Burgerlijk Wetboek](onbekend), noch in enig ander
      soortgelijk buitenlands register.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel576
  - number: '576.2'
    text: |-
      De bekendmaking zal geschieden door aankondiging in een dagblad, verspreid ter plaatse waar het schip zich bevindt,
      en door aanplakking naar plaatselijk gebruik en in elk geval op een in het oog vallende plaats van het schip.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel576
  - number: '577.1'
    text: |-
      De koopprijs wordt gestort in handen van de notaris, de griffier of de deurwaarder, naar gelang de verkoop plaats
      heeft gevonden met toepassing van [artikel 570][ref1], [575][ref2] of [576][ref3], dan wel bij een door de notaris,
      de griffier of deurwaarder aan te wijzen bewaarder die aan de eisen van [artikel 445][ref4] voldoet, telkens
      onverminderd de bevoegdheid van de koper om in afwachting van de betaling voldoende zekerheid te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel570
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel575
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel576
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel445
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel577
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '570'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '575'
        afdeling: Eerste
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '576'
        afdeling: Eerste
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '445'
        afdeling: Eerste
  - number: '577.2'
    text: |-
      Bij gebreke van een zodanige betaling, bewaring of zekerheidsstelling is de executant bevoegd het schip ten laste
      van de koper met inachtneming van [artikel 570][ref1] en volgende wederom te verkopen. De executant is tot deze
      verkoop gehouden, indien een van de bij de opbrengst direct belanghebbenden dit verlangt.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel570
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel577
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '570'
        afdeling: Eerste
  - number: '578.1'
    text: |-
      Door betaling van de koopprijs, onderscheidenlijk zekerheidsstelling of in bewaringgeving overeenkomstig
      [artikel 577, eerste lid][ref1], wordt het schip bevrijd van de daarop bij voorrang verhaalbare vorderingen en
      vervallen de daarop gelegde beslagen, alsook de beperkte rechten die niet tegen de verkoper ingeroepen kunnen
      worden of ter zake waarvan [artikel 517, tweede lid][ref2], is toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel577
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel517
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel578
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '577'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '517'
        afdeling: Tweede
  - number: '578.2'
    text: |-
      Ter zake van schepen die teboekstaan in het in [artikel 193 van Boek 8][ref1]
      of [783 van Boek 8 van het Burgerlijk Wetboek][ref2] genoemde register is
      [artikel 273, tweede en derde lid, van Boek 3, van het Burgerlijk Wetboek][ref3], van overeenkomstige toepassing,
      met dien verstande dat bevoegd is de voorzieningenrechter van de rechtbank binnen wier rechtsgebied de verkoop
      heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel193
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel783
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel273
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel578
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '193'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '783'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '273'
  - number: '579'
    text: |-
      Bij de executie door een hypotheekhouder van een schip dat teboekstaat in het in [artikel 193 van Boek 8]
      (onbekend) of [artikel 783 van Boek 8 van het Burgerlijk Wetboek](onbekend) genoemde register, zijn de
      [artikelen 544][ref1] en [545][ref2] van overeenkomstige toepassing. De executie geschiedt voorts met toepassing
      van de [artikelen 570][ref3], [571, eerste lid][ref4], en [572][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel544
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel545
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel570
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel571
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel572
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel579
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '544'
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '545'
        afdeling: Vierde
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '570'
        afdeling: Eerste
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '571'
        afdeling: Eerste
      - id: ref5
        bwb_id: BWBR0001827
        artikel: '572'
        afdeling: Eerste
  - number: '580'
    text: |-
      Op de verdeling van de opbrengst zijn de [artikelen 551-552][ref1] van overeenkomstige toepassing. Is een schip
      verkocht als bedoeld in [artikel 576][ref2], dan zijn de [artikelen 480-490a][ref3], [490c][ref4] en [490d][ref5]
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel551
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel576
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel480
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel490c
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel490d
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel580
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '551'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '576'
        afdeling: Eerste
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '480'
        afdeling: Derde
      - id: ref4
        bwb_id: BWBR0001827
        artikel: 490c
        afdeling: Derde
      - id: ref5
        bwb_id: BWBR0001827
        artikel: 490d
        afdeling: Derde
  - number: '581.1'
    text: |-
      In geval bij een executoriale verkoop van een schip voor één prijs mede scheepstoebehoren is verkocht, dat ten
      tijde van de verkoop aan een ander dan de eigenaar van het schip toebehoorde en deze ander de eigendom van het
      scheepstoebehoren als gevolg van de verkoop verloren heeft, wordt aan hem uit de netto-opbrengst met voorrang boven
      allen jegens wie hij zijn recht ten tijde van de verkoop kon inroepen, een vergoeding uitgekeerd ten bedrage van de
      waarde die het scheepstoebehoren ten tijde van de executie naar schatting had.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel581
  - number: '581.2'
    text: |-
      Ingeval er bij de verdeling van de netto-opbrengst deelnemers aan de rangregeling zijn, wier recht of voorrang niet
      gelijkelijk schip en scheepstoebehoren betreft, is [artikel 553][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel553
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel581
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '553'
        afdeling: Vijfde
  - number: '582.1'
    text: |-
      De executie tot afgifte van een schip vangt aan met een bevel als bedoeld in [artikel 563][ref1], dat van
      overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel563
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel582
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '563'
        afdeling: Eerste
  - number: '582.2'
    text: |-
      De executie geschiedt doordat de deurwaarder het schip, zonodig met overeenkomstige toepassing van de
      [artikelen 556-558][ref1], onder zich neemt en afgeeft aan degene die het krachtens de executoriale titel moet
      ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel556
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel582
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '556'
        afdeling: Zesde
  - number: '582.3'
    text: |-
      De [artikelen 444-444b][ref1], [492, eerste, tweede en vierde lid][ref2], [497][ref3], [499][ref4], [500][ref5] en
      [564][ref6] zijn van overeenkomstige toepassing, met dien verstande dat voor de toepassing van [artikel 444b][ref7]
      de waarde van het schip in de plaats treedt van de vordering waarvoor het beslag is gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel444
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel492
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel497
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel499
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel500
      [ref6]: https://wetten.overheid.nl/BWBR0001827#Artikel564
      [ref7]: https://wetten.overheid.nl/BWBR0001827#Artikel444b
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel582
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '444'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '492'
        afdeling: Vierde
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '497'
        afdeling: Vierde
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '499'
        afdeling: Vierde
      - id: ref5
        bwb_id: BWBR0001827
        artikel: '500'
        afdeling: Vierde
      - id: ref6
        bwb_id: BWBR0001827
        artikel: '564'
        afdeling: Eerste
      - id: ref7
        bwb_id: BWBR0001827
        artikel: 444b
        afdeling: Eerste
  - number: 584a.1
    text: |-
      De in [artikel 1300 van Boek 8 van het Burgerlijk Wetboek][ref1] opgenomen begripsomschrijvingen gelden ook voor de
      onderhavige afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1300
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584a
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1300'
  - number: 584a.2
    text: 'In deze afdeling wordt voorts verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584a
  - number: 584a.2.a
    text: |-
      het Verdrag van Chicago: het op 7 december 1944 te Chicago tot stand gekomen Verdrag inzake de internationale
      burgerluchtvaart (*Stb.* 1947, H 165);
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584a
  - number: 584a.2.b
    text: 'nationaliteitsregister: een register als bedoeld in artikel 17 van het Verdrag van Chicago.'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584a
  - number: 584b.1
    text: |-
      Het beslag op een in het register of in een verdragsregister teboekstaand luchtvaartuig moet worden voorafgegaan
      door een aan de geëxecuteerde te betekenen exploit van een deurwaarder, houdende een bevel om binnen vierentwintig
      uur aan de executoriale titel te voldoen. Eerst na verloop van die termijn kan het beslag worden gelegd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584b
  - number: 584b.2
    text: |-
      De voorzieningenrechter van de rechtbank kan, ook op mondeling verzoek van de deurwaarder, bepalen dat deze ook
      zonder voorafgaand bevel tot inbeslagneming kan overgaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584b
  - number: 584b.3
    text: |-
      In dat geval zal, in afwijking van [artikel 430, derde lid][ref1], de betekening van de titel tezamen met die van
      het proces-verbaal van inbeslagneming kunnen geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel430
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584b
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '430'
  - number: 584c.1
    text: |-
      De deurwaarder legt het beslag ter plaatse waar het luchtvaartuig zich bevindt bij een proces-verbaal dat behalve
      de gewone formaliteiten, op straffe van nietigheid inhoudt:
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584c
  - number: 584c.1.a
    text: de vermelding van de voornaam, naam en woonplaats van de executant en de naam en woonplaats van de geëxecuteerde;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584c
  - number: 584c.1.b
    text: de vermelding van de titel uit hoofde waarvan het beslag wordt gelegd;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584c
  - number: 584c.1.c
    text: een opgave van de vordering waarvoor het beslag wordt gelegd;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584c
  - number: 584c.1.d
    text: |-
      de kentekenen van het luchtvaartuig en een korte aanduiding van de inhoud van het bewijs van inschrijving, bedoeld
      in artikel 29 van het Verdrag van Chicago, dan wel de vermelding dat dit hem, deurwaarder, bij navraag niet is
      vertoond;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584c
  - number: 584c.1.e
    text: het adres van de in artikel III, eerste lid, van het Verdrag van Genève bedoelde dienst;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584c
  - number: 584c.1.f
    text: |-
      een keuze van woonplaats ten kantore van de deurwaarder die het beslag legt en, desgewenst, in Nederland ten
      kantore van een advocaat.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584c
  - number: 584c.2
    text: |-
      De deurwaarder kan zich doen bijstaan door een of twee getuigen, wier naam en woonplaats hij in dat geval in het
      procesverbaal zal vermelden en die dit stuk mede zullen ondertekenen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584c
  - number: 584c.3
    text: |-
      De deurwaarder neemt de nodige maatregelen om vertrek van het luchtvaartuig te beletten. Hij is gerechtigd het
      luchtvaartuig of enig onderdeel daarvan in gerechtelijke bewaring te geven, waartoe hij tot verplaatsing binnen
      Nederland mag overgaan. De [artikelen 445, tweede zin][ref1], en [446, tweede lid][ref2], zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel445
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel446
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584c
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '445'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '446'
        afdeling: Eerste
  - number: 584d.1
    text: |-
      Wanneer beslag is gelegd op een in het register teboekstaand luchtvaartuig zal het proces-verbaal van
      inbeslagneming in de in [afdeling 2, Titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1] bedoelde openbare
      registers worden ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584d
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: 584d.2
    text: |-
      Wanneer beslag is gelegd op een in een verdragsregister teboekstaand luchtvaartuig, zendt de deurwaarder een
      door hem gewaarmerkt afschrift van het proces-verbaal ten spoedigste rechtstreeks aangetekend en zo mogelijk per
      luchtpost naar de in artikel III, eerste lid, van het Verdrag van Genève bedoelde dienst, alsmede aan de bewaarder
      van het nationaliteitsregister, waar het luchtvaartuig is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584d
  - number: 584d.3
    text: |-
      In elk geval zal het proces-verbaal van beslag op straffe van nietigheid binnen drie dagen na het leggen daarvan
      aan de geëxecuteerde worden betekend.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584d
  - number: 584e
    text: |-
      Een vervreemding, bezwaring of onderbewindstelling tot stand gebracht na de inschrijving in de openbare registers,
      kan niet tegen de beslaglegger of de koper ter executie worden ingeroepen, wanneer deze totstandbrenging geschiedde
      door de geëxecuteerde, terwijl hij kennis droeg van het beslag.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584e
  - number: 584f.1
    text: |-
      De beslaglegger legt op de griffie van de rechtbank in welker rechtsgebied het luchtvaartuig zich dan bevindt,
      neer een afschrift van het proces-verbaal van inbeslagneming, alsmede een uittreksel uit de registratie voor
      luchtvaartuigen als bedoeld in [artikel 107, eerste lid, Kadasterwet][ref1], dat ten minste de gegevens bevat,
      bedoeld in [artikel 92, tweede lid, Kadasterwet, onder ][ref2], alsmede de gegevens omtrent niet doorgehaalde
      voorlopige aantekeningen, dan wel een soortgelijk uittreksel uit het verdragsregister.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel92
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584f
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '107'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '92'
  - number: 584f.2
    text: 'Hij verzoekt voorts aan deze rechtbank:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584f
  - number: 584f.2.a
    text: |-
      benoeming van een rechter-commissaris voor de verificatie van de rechten waaraan het luchtvaartuig is onderworpen,
      en van de vorderingen die daarop verhaalbaar zijn;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584f
  - number: 584f.2.b
    text: |-
      vaststelling van plaats, dag en uur, waarop de verkoop en de toewijzing zullen plaats hebben. Deze dag moet
      tenminste 7 weken liggen na de dagtekening van de beschikking der rechtbank;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584f
  - number: 584f.2.c
    text: |-
      vaststelling van de dag, voor welke zij, die beweren rechten en vorderingen als bedoeld onder *a* te bezitten,
      deze bij de rechter-commissaris moeten kenbaar maken. Deze dag mag niet meer dan 4 weken voor de dag van de verkoop
      liggen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584f
  - number: 584f.3
    text: |-
      Ten minste 6 weken voor de voor de verkoop bestemde dag brengt hij deze te 's-Gravenhage ter openbare kennis
      op de wijze als voorgeschreven bij algemene maatregel van bestuur. Wanneer beslag is gelegd op een in een
      verdragsregister teboekstaand luchtvaartuig brengt hij de verkoop tevens ter openbare kennis ter plaatse, waar het
      nationaliteitsregister waarin het luchtvaartuig is ingeschreven, is gevestigd, op de wijze daar voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584f
  - number: 584f.4
    text: |-
      Hij verwittigt voorts 6 weken voor de voor de verkoop bestemde dag degenen die in de registratie voor
      luchtvaartuigen, bedoeld in [artikel 92 Kadasterwet][ref1] of in een verdragsregister, als beperkt gerechtigd
      of beslaglegger staan vermeld, van de voorgenomen verkoop bij aangetekende brief, alsmede zo mogelijk bij per
      luchtpost verzonden aangetekende brief, beide gericht naar hun woonplaatsen vermeld in de registratie voor
      luchtvaartuigen dan wel in het verdragsregister.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel92
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584f
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '92'
  - number: 584g
    text: |-
      De kennisgevingen uit hoofde van [artikel 584][ref1], behelzen:


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel584f
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584g
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 584f
        afdeling: Tweede
  - number: 584g.a
    text: de voornaam, de naam, en woonplaats van de executant;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584g
  - number: 584g.b
    text: de korte vermelding van de titel, uit kracht waarvan hij beslag heeft gelegd;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584g
  - number: 584g.c
    text: de vordering, waarvoor het beslag is gelegd;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584g
  - number: 584g.d
    text: de door hem in het proces-verbaal gekozen woonplaats;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584g
  - number: 584g.e
    text: de veilingvoorwaarden;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584g
  - number: 584g.f
    text: |-
      de door de rechtbank op grond van [artikel 584][ref1], gegeven beschikkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel584f
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584g
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 584f
        afdeling: Tweede
  - number: 584h
    text: |-
      Op verzoek van de executant kan de rechtbank ook na het verstrijken van de krachtens
      [artikel 584f, tweede lid onder c][ref1], door haar gestelde termijn, nader plaats, dag en uur, waarop de verkoop
      en de toewijzing zullen plaats hebben, vaststellen alsmede een nadere dag, voor welke de in [artikel 584f][ref2]
      bedoelde vorderingen bij de rechter-commissaris moeten zijn kenbaar gemaakt. De rechtbank neemt bij deze nadere
      vaststelling, welke zij slechts éénmaal kan verrichten, de termijnen, vermeld in [artikel 584f][ref3], in acht en
      stelt overigens die voorwaarden, welke haar dienstig voorkomen. De executant vervult de formaliteiten, vermeld in
      [artikel 584f leden 3 en 4][ref4] en in [artikel 584g][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel584f
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel584f
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel584f
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel584g
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel584g
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584h
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 584f
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 584f
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 584f
        afdeling: Tweede
      - id: ref4
        bwb_id: BWBR0001827
        artikel: 584g
        afdeling: Tweede
      - id: ref5
        bwb_id: BWBR0001827
        artikel: 584g
        afdeling: Tweede
  - number: 584i.1
    text: |-
      Na het verstrijken van de krachtens [artikel 584f, tweede lid onder c][ref1] of [584h][ref2] door de
      rechtbank gestelde termijn maakt de rechter-commissaris uit de ingediende beweringen een staat op van de in
      [artikel 584f tweede lid][ref3], bedoelde rechten en vorderingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel584f
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel584h
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel584f
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584i
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 584f
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 584h
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 584f
        afdeling: Tweede
  - number: 584i.2
    text: |-
      De [artikelen 483a-490a][ref1][490c][ref2] en [490d][ref3] zijn van overeenkomstige toepassing, voor zover uit de
      volgende artikelen van deze afdeling niet anders voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel483a
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel490c
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel490d
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584i
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 483a
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 490c
        afdeling: Derde
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 490d
        afdeling: Derde
  - number: 584j.1
    text: |-
      De in [artikel 484][ref1] bedoelde nederlegging en mededeling vinden plaats ten minste twee weken voor de voor de
      verkoop vastgestelde dag.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel484
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584j
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '484'
        afdeling: Derde
  - number: 584j.2
    text: |-
      De rechter-commissaris sluit de lijst van rechten en vorderingen niet voor het voor de verkoop vastgestelde
      tijdstip; tot dit tijdstip kunnen schuldeisers tegenspraak doen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584j
  - number: 584k.1
    text: |-
      Indien voor het tijdstip van de verkoop geen tegenspraak is gedaan dan tegen rechten en vorderingen die in rang na
      die van de executant komen, sluit de rechter-commissaris de lijst en wordt tot verkoop overgegaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584k
  - number: 584k.2
    text: |-
      Indien voor het tijdstip van verkoop wel tegenspraak als bedoeld in het vorige lid is gedaan, verdaagt de
      rechtercommissaris de verkoop.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584k
  - number: 584k.3
    text: |-
      Zodra op de tegenspraak is beslist bij een vonnis, dat in kracht van gewijsde is gegaan, sluit de rechter-
      commissaris op verzoek van de executant de lijst en bepaalt hij plaats, dag en uur, waarop de verkoop en de
      toewijzing zullen plaats hebben. Deze dag moet tenminste 7 weken liggen na de dagtekening van de beschikking van de
      rechter-commissaris.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584k
  - number: 584k.4
    text: |-
      De executant vervult in dat geval opnieuw de formaliteiten vermeld in [artikel 584][ref1]. Hij verwittigt voorts
      hen, die een bewering hebben ingediend, alsmede de in [artikel 584][ref2], bedoelde beperkt gerechtigden en
      beslagleggers, van de voorgenomen verkoop bij aangetekende brief, alsmede, zo mogelijk, bij per luchtpost verzonden
      aangetekende brief.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel584f
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel584f
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584k
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 584f
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 584f
        afdeling: Tweede
  - number: 584l.1
    text: |-
      Iedere schuldeiser, wiens vordering op de door de rechter-commissaris vastgestelde lijst rang neemt boven die
      van de beslaglegger, kan bij de verkoop diens plaats innemen mits hij de beslaglegger ten minste 7 dagen voor de
      verkoop van zijn voornemen hiertoe bij aangetekende brief heeft kennis gegeven.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584l
  - number: 584l.2
    text: |-
      Indien de beslaglegger de uitwinning niet of niet op de bepaalde dag vervolgt, heeft iedere schuldeiser, wiens
      vordering op de door de rechter-commissaris vastgestelde lijst rang neemt boven die van de beslaglegger, het recht
      dit te doen. Dit recht vervalt, wanneer hij, na aanmaning door een belanghebbende, er binnen een redelijke termijn
      geen gebruik van maakt. De schuldeiser, die van dit recht gebruik wenst te maken, vervult in dat geval opnieuw
      de formaliteiten vermeld in [artikel 584k, vierde lid][ref1]; [artikel 584g][ref2] vindt, voor zover mogelijk,
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel584k
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel584g
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584l
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 584k
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 584g
        afdeling: Tweede
  - number: 584m.1
    text: |-
      De verkoop geschiedt bij opbod en vervolgens bij afmijning voor de rechter-commissaris met inachtneming van de
      veilingvoorwaarden zoals hiervan door de beslaglegger is kennisgegeven of zoals deze door de rechter-commissaris
      op verzoek van een belanghebbende nader zijn bepaald, en overigens op de door de rechter-commissaris na raadpleging
      van de executant te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584m
  - number: 584m.2
    text: |-
      De rechter-commissaris beslist over de toewijzing. Toewijzing vindt niet plaats, wanneer niet alle vorderingen,
      welke op de door de rechter-commissaris vastgestelde lijst als bevoorrecht boven de vordering van hem, op wiens
      verzoek de verkoop geschiedt, voorkomen, uit de opbrengst worden voldaan of door de koper te zijnen laste worden
      genomen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584m
  - number: 584m.3
    text: |-
      In het in het vorige lid bedoelde geval blijven de kosten van uitwinning ten laste van hem, op wiens verzoek de
      verkoop geschiedt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584m
  - number: 584n.1
    text: |-
      De koopprijs wordt binnen twee dagen voldaan in handen van de griffier van de rechtbank binnen welker
      rechtsgebied de verkoop is geschied dan wel bij een door de griffier aan te wijzen bewaarder die aan de eisen
      van [artikel 445][ref1] voldoet. De griffier voldoet daaruit op last van de rechter-commissaris de kosten van
      de executie die in het gezamenlijk belang van de schuldeisers zijn gemaakt en keert de netto-opbrengst uit
      overeenkomstig de door de rechter-commissaris opgestelde lijst, zodra deze gesloten is.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel445
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584n
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '445'
        afdeling: Eerste
  - number: 584n.2
    text: |-
      Schiet de koper in de nakoming van de koopovereenkomst tekort, dan zijn de [artikelen 527-529][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel527
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584n
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '527'
        afdeling: Tweede
  - number: 584o.1
    text: |-
      De koper verkrijgt de eigendom van een in het register teboekstaand luchtvaartuig door inschrijving van het proces-
      verbaal van toewijzing.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584o
  - number: 584o.2
    text: |-
      De bewaarder van de registers weigert inschrijving, indien niet tevens een verklaring van de griffier wordt
      overgelegd dat de koopprijs in zijn handen is gestort.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584o
  - number: 584o.3
    text: |-
      De koper verkrijgt de eigendom van een in het verdragsregister teboekstaand luchtvaartuig door de voldoening van
      de koopprijs.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584o
  - number: 584p.1
    text: |-
      Tenzij in de veilingvoorwaarden anders is bepaald, vervallen door de levering aan de koper en de voldoening
      van de koopprijs alle op een in het register teboekstaand luchtvaartuig rustende rechten, voor zover
      deze niet rang nemen boven het recht van de executant, alsmede de rechten die niet op de lijst van de
      rechter-commissaris voorkomen. De ingeschreven overeenkomsten, bedoeld in de [artikelen 1308][ref1] en
      [1309 van Boek 8 van het Burgerlijk Wetboek][ref2], worden ontbonden, voor zover de daaruit voortvloeiende rechten
      rang nemen na de vordering van de executant. Aldus waardeloos geworden inschrijvingen van hypotheken en beslagen
      worden ambtshalve doorgehaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1308
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1309
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584p
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1308'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1309'
  - number: 584p.2
    text: |-
      Tenzij in de veilingvoorwaarden anders is bepaald, vervallen door de eigendomsverkrijging overeenkomstig
      [artikel 584o, derde lid][ref1], alle in het vorige lid bedoelde rechten die op een in het verdragsregister
      teboekstaand luchtvaartuig rusten.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel584o
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584p
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 584o
        afdeling: Tweede
  - number: 584q
    text: |-
      Indien het beslag en de executie niet overeenkomstig deze afdeling hebben plaats gevonden, kan een ieder, die
      daardoor is benadeeld, binnen zes maanden na de toewijzing vorderen dat de rechtbank binnen welker rechtsgebied de
      verkoop is geschied de verkoop en daaropgevolgde eigendomsovergang vernietigt. Indien deze vorderingen een in het
      register teboekstaand luchtvaartuig betreft, moet zij op straffe van niet ontvankelijkheid binnen drie dagen na de
      instelling daarvan in de openbare registers worden ingeschreven.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584q
  - number: 584r.1
    text: |-
      De executie tot afgifte van een in het register of een verdragsregister teboekstaand luchtvaartuig vangt aan met
      een bevel als bedoeld in [artikel 584b][ref1], dat van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel584b
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584r
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 584b
        afdeling: Tweede
  - number: 584r.2
    text: |-
      De executie geschiedt doordat de deurwaarder het luchtvaartuig onder zich neemt en afgeeft aan degene die het
      krachtens executoriale titel moet ontvangen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584r
  - number: 584r.3
    text: |-
      De [artikelen 444-444b][ref1], [492, eerste, tweede en vierde lid][ref2], [497][ref3], [499][ref4],
      [500][ref5] en [584c][ref6] zijn van overeenkomstige toepassing, met dien verstande dat voor de toepassing van
      [artikel 444b][ref7] de waarde van het luchtvaartuig in de plaats treedt van de vordering waarvoor het beslag is
      gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel444
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel492
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel497
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel499
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel500
      [ref6]: https://wetten.overheid.nl/BWBR0001827#Artikel584c
      [ref7]: https://wetten.overheid.nl/BWBR0001827#Artikel444b
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel584r
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '444'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '492'
        afdeling: Vierde
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '497'
        afdeling: Vierde
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '499'
        afdeling: Vierde
      - id: ref5
        bwb_id: BWBR0001827
        artikel: '500'
        afdeling: Vierde
      - id: ref6
        bwb_id: BWBR0001827
        artikel: 584c
        afdeling: Tweede
      - id: ref7
