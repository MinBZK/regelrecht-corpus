  - number: 438b
    text: |-
      Voor zover de executie andere handelingen vergt dan het doen van een exploot, is [artikel 64][ref1] van
      overeenkomstige toepassing, met dien verstande dat voor de overeenkomstige toepassing van het derde lid van dat
      artikel de plaats waar de handeling moet worden verricht, bepalend is.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel64
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel438b
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '64'
        afdeling: Zesde
  - number: '439.1'
    text: |-
      Het beslag op roerende zaken die geen registergoederen zijn, moet worden voorafgegaan door een exploit van een
      deurwaarder, houdende bevel om binnen twee dagen aan de executoriale titel te voldoen. Eerst na verloop van die
      termijn kan het beslag worden gelegd. Indien daartoe gronden zijn, kan de voorzieningenrechter van de rechtbank,
      ook op mondeling verzoek van de deurwaarder, die termijn inkorten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel439
  - number: '439.2'
    text: |-
      Indien bij het betekenen van de executoriale titel tevens het voorgeschreven bevel is gedaan, wordt geen
      afzonderlijk bevel vereist.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel439
  - number: '439.3'
    text: |-
      Bij het bevel of de betekening moet de executant tot het uiteinde der executie woonplaats kiezen ten kantore van de
      deurwaarder, zulks op straffe van nietigheid van het exploit. Tevens kan woonplaats worden gekozen in Nederland ten
      kantore van een advocaat.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel439
  - number: '440.1'
    text: |-
      Het beslag wordt gelegd bij een exploit van een deurwaarder dat, behalve de gewone formaliteiten, op straffe van
      nietigheid inhoudt:
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel440
  - number: 440.1.a
    text: de vermelding van de voornaam, naam en woonplaats van de executant en de naam en woonplaats van de geëxecuteerde;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel440
  - number: 440.1.b
    text: de vermelding van de executoriale titel uit hoofde waarvan het beslag wordt gelegd;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel440
  - number: 440.1.c
    text: |-
      indien het beslag wordt gelegd buiten het arrondissement waarin overeenkomstig [artikel 439, derde lid][ref1],
      woonplaats is gekozen, een keuze van woonplaats ten kantore van de deurwaarder die het beslag legt.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel439
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel440
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '439'
        afdeling: Eerste
  - number: '440.2'
    text: |-
      De deurwaarder kan zich doen bijstaan door een of twee getuigen, wier naam en woonplaats hij in dat geval in het
      proces-verbaal zal vermelden en die dat stuk mede zullen tekenen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel440
  - number: '441.1'
    text: Het beslag kan slechts worden gedaan voor een vordering waarvan het geldelijk beloop bepaalbaar is.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel441
  - number: '441.2'
    text: |-
      Indien de vordering niet is vereffend, worden na het beslag alle verdere vervolgingen gestaakt, totdat de
      vereffening is geschied.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel441
  - number: '443.1'
    text: |-
      De deurwaarder zal dadelijk, of uiterlijk op de volgende dag overgaan tot de meer bijzondere aanduiding der zaken
      die hij in beslag neemt, en zal deze op het door hem daarvan onverwijld op te maken proces-verbaal nauwkeurig
      beschrijven met opgave van hun getal, gewicht en maat overeenkomstig hun aard. Het proces-verbaal wordt binnen drie
      dagen na de inbeslagneming betekend aan de geëxecuteerde en, als er een bewaarder is, ook aan deze.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel443
  - number: '443.2'
    text: |-
      De executant mag bij de inbeslagneming niet tegenwoordig zijn dan in geval de deurwaarder zulks ter aanwijzing van
      de in beslag te nemen zaken noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel443
  - number: '444.1'
    text: |-
      De deurwaarder heeft ter inbeslagneming toegang tot elke plaats, voor zover dat redelijkerwijs voor de vervulling
      van zijn taak nodig is.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel444
  - number: '444.2'
    text: |-
      Indien de deuren gesloten zijn, of de opening daarvan geweigerd wordt, gelijk mede indien geweigerd wordt enige
      kamer of stuk huisraad te openen, alsmede wanneer bij niet-tegenwoordigheid van de geëxecuteerde er niemand
      gevonden wordt om hem te vertegenwoordigen, zal de deurwaarder zich vervoegen bij de burgemeester der gemeente in
      wiens tegenwoordigheid de opening van de deuren en van het huisraad zal worden gedaan voor zover dat redelijkerwijs
      nodig is. De burgemeester kan zich doen vertegenwoordigen door een ambtenaar van politie die tevens hulpofficier
      van justitie is. Van de tegenwoordigheid van deze ambtenaar en van hetgeen in zijn bijzijn, uit kracht van dit en
      de volgende drie artikelen, is verricht, zal melding gemaakt worden in het proces-verbaal van beslag.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel444
  - number: '444.3'
    text: |-
      Bij het binnentreden in een woning zonder toestemming van de bewoner zijn de [artikelen 10][ref1] en
      [11, tweede lid, van de Algemene wet op het binnentreden][ref2] op het proces-verbaal van beslag van
      overeenkomstige toepassing. Deze artikelen gelden eveneens in het geval dat na het binnentreden geen beslag wordt
      gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0006763#Artikel11
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel444
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0006763
        artikel: '11'
  - number: 444a.1
    text: |-
      Indien er redelijk vermoeden bestaat, dat in beslag te nemen zaken zich bevinden op een plaats, van een derde
      gehuurd of op andere wijze in gebruik verkregen, zodanig dat voor de toegang de medewerking van de derde nodig
      blijft, zal de deurwaarder, ingeval van weigering van de geëxecuteerde of de derde om de deuren, welke tot de
      plaats toegang geven, te openen, handelen, zoals in het vorige artikel is bepaald. Met weigering staat gelijk
      afwezigheid na behoorlijke sommatie om persoonlijk of bij gemachtigde te verschijnen om de deuren te openen. De
      deurwaarder kan inmiddels door een bewaarder beletten, dat van de plaats iets wordt weggenomen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel444a
  - number: 444a.2
    text: |-
      De derde is gehouden de deurwaarder op vertoon van de titel, uit krachte waarvan het beslag wordt gelegd,
      aanwijzing te doen van de verhuurde of op andere wijze in gebruik gegeven ruimte.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel444a
  - number: 444a.3
    text: |-
      Zij die van het verhuren of op andere wijze in gebruik geven, als bedoeld in de vorige leden, een bedrijf maken,
      zijn verplicht desgewenst de deurwaarder inzage te geven van het register of de stukken, waarin de gebruikers zijn
      vermeld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel444a
  - number: 444a.4
    text: |-
      Van het ogenblik, dat de deurwaarder zich tot de derde heeft gewend om tot de inbeslagneming ingevolge dit artikel
      te komen, mag de derde de geëxecuteerde toegang tot de ruimte niet meer verlenen dan in tegenwoordigheid van de
      deurwaarder.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel444a
  - number: 444b.1
    text: |-
      Indien de derde niet voldoet aan enige hem bij het tweede, derde en vierde lid van het vorige artikel opgelegde
      verplichting, kan hij worden veroordeeld tot voldoening van het bedrag der vordering, waarvoor het beslag wordt
      gelegd, met rente en kosten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel444b
  - number: 444b.2
    text: |-
      De schade, welke de derde lijdt door het openbreken der deuren, wordt, indien dit niet aan hem te wijten is, hem
      vergoed door de executant, behoudens het verhaal van deze op de geëxecuteerde, indien daartoe gronden aanwezig
      zijn. De derde kan verlangen, dat, alvorens tot het openmaken der deuren wordt overgegaan, zekerheid wordt gesteld
      voor de voldoening der hem verschuldigde schadevergoeding.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel444b
  - number: 444b.3
    text: |-
      De deurwaarder en de ambtenaar, in [artikel 444][ref1] genoemd, zijn tot geheimhouding verplicht nopens de inhoud
      van het register en de stukken, bedoeld in het derde lid van het vorige artikel; echter wat de geëxecuteerde
      betreft, voor zover niet anders is vereist voor een behoorlijke vervulling van hun taak te dezen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel444
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel444b
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '444'
        afdeling: Eerste
  - number: '445'
    text: |-
      Indien er bij de inbeslagneming gereed geld wordt gevonden, zal het getal en de
      geldsoort vermeld worden; de deurwaarder zal het geld benevens alle aandeelbewijzen,
      effecten en verder geldswaarde hebbend papier aan een door hem aan te wijzen ingevolge
      [artikel 52 van de Wet toezicht kredietwezen 1992][ref1] (*Stb.* 1992, 722) geregistreerde kredietinstelling
      als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°, van de Wet toezicht kredietwezen 1992][ref2]
      of door zodanige kredietinstelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°, van de Wet toezicht kredietwezen 1992][ref3] gegarandeerd
      effectenbewaarbedrijf of aan de Nederlandsche Bank N.V. in gerechtelijke bewaring geven, tenzij de executant en
      geëxecuteerde omtrent een andere plaats van bewaring mochten zijn overeengekomen. De bewaring geschiedt ten name
      van de deurwaarder onder vermelding van het beslag, van de executant en van de geëxecuteerde.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel445
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '52'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0005792
        artikel: '1'
  - number: '446.1'
    text: |-
      De deurwaarder kan ook andere zaken dan die bedoeld in het vorige artikel aan een door hem aan te wijzen geschikte
      bewaarder in gerechtelijke bewaring geven, indien dit voor het behoud van deze zaken redelijkerwijze noodzakelijk
      is. De tweede zin van het vorige artikel is van toepassing.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel446
  - number: '446.2'
    text: |-
      De deurwaarder maakt van de inbewaringgeving een afzonderlijk proces-verbaal op, dat binnen drie dagen na de
      inbewaringgeving wordt betekend aan de geëxecuteerde en aan de bewaarder.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel446
  - number: '447'
    text: 'Geen beslag op roerende zaken mag, uit welken hoofde ook, gedaan worden:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel447
  - number: 447.1°
    text: |-
      op het nodige bed en beddegoed van de geëxecuteerde en de inwonende leden van zijn gezin en op de kleren, waarmee
      zij gekleed en gedekt zijn;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel447
  - number: 447.2°
    text: op de gereedschappen van ambachtslieden en werklieden, tot hun persoonlijk bedrijf behorende;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel447
  - number: 447.3°
    text: |-
      op de in het huis voorhanden zijnde voorraad van spijs en drank, dienende tot de behoefte van het huisgezin,
      gedurende een maand;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel447
  - number: 447.4°
    text: |-
      op het ingevolge [artikel 642c][ref1] in de kas der gerechtelijke consignaties gestorte bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel642c
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel447
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 642c
        afdeling: Tweede
  - number: '448.1'
    text: |-
      Evenmin kan beslag worden gelegd op de boeken die de geëxecuteerde nodig heeft voor zijn beroep, en op de
      werktuigen en gereedschappen, dienend tot enig onderwijs of de beoefening van kunsten en wetenschappen, telkens tot
      een bij algemene maatregel van bestuur vast te stellen bedrag en te zijner keuze.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel448
  - number: '448.2'
    text: 'De in het eerste lid bedoelde zaken kunnen wel in beslag worden genomen voor vorderingen:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel448
  - number: 448.2.1°
    text: wegens levensbehoeften verstrekt aan de geëxecuteerde en de inwonende leden van zijn gezin;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel448
  - number: 448.2.2°
    text: ter zake van de vervaardiging of het herstel van deze zaken of de verkoop daarvan aan de geëxecuteerde.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel448
  - number: '449'
    text: |-
      Dag en uur van de verkoop van de in beslag genomen zaken worden aan de geëxecuteerde betekend hetzij tezamen met
      het proces-verbaal van inbeslagneming hetzij binnen drie dagen na de betekening daarvan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel449
  - number: '451.1'
    text: |-
      Indien beesten of werktuigen voor de landbouw, of vruchten te velde welke reeds van de grond zijn afgescheiden,
      zijn in beslag genomen, kan de kantonrechter, op verzoek van de executant, en na verhoor of behoorlijke oproeping
      van de geëxecuteerde, een geschikte persoon aanstellen, teneinde voor de nodige bedrijfsvoering, verzorging of
      inzameling zorg te dragen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel451
  - number: '451.2'
    text: Tegen een toewijzende beschikking krachtens het vorige lid is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel451
  - number: 453a.1
    text: |-
      Een vervreemding, bezwaring, onderbewindstelling of verhuring van de zaak, tot stand gekomen nadat deze in beslag
      genomen is, kan niet tegen de beslaglegger worden ingeroepen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel453a
  - number: 453a.2
    text: |-
      Rechten door een derde anders dan om niet verkregen, worden geëerbiedigd, mits de zaak in zijn handen is gekomen en
      hij toen te goeder trouw was.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel453a
  - number: '455.1'
    text: |-
      Nog niet verantwoorde en afgedragen baten, voortgebracht door de in beslag genomen zaken, vallen mede onder het
      beslag en moeten aan de deurwaarder worden verantwoord en op zijn verlangen aan hem worden afgedragen, een en ander
      behoudens de rechten van derden, die de executant moet eerbiedigen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel455
  - number: '455.2'
    text: |-
      Bestaat de bate in een vordering op een derde dan valt zij niet onder het beslag dan nadat het beslag aan de derde
      is betekend. De [artikelen 475c][ref1], [476][ref2] en [478][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel476
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel478
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel455
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '476'
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '478'
        afdeling: Tweede
  - number: 455a.1
    text: |-
      Vorderingen tot vergoeding die na inbeslagneming in de plaats van de beslagen zaak zijn getreden, daaronder
      begrepen vorderingen ter zake van waardevermindering van de zaak, vallen, nadat het beslag aan de schuldenaar
      uit die vordering is betekend, eveneens onder het beslag, behoudens de rechten van derden, die de executant moet
      eerbiedigen. Zij moeten op verlangen van de deurwaarder aan hem worden voldaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel455a
  - number: 455a.2
    text: |-
      De artikelen 475, [476][ref1] en [478][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel476
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel478
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel455a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '476'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '478'
        afdeling: Tweede
  - number: '456.1'
    text: |-
      Treft het beslag een zaak die geheel of ten dele aan een ander toebehoort of ten aanzien waarvan een ander een
      recht geldend kan maken dat de executant moet eerbiedigen, dan kan deze ander zich tegen verkoop waarbij zijn recht
      niet in acht wordt genomen tot op het tijdstip van verkoop verzetten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel456
  - number: '456.2'
    text: |-
      De eiser die in het ongelijk wordt gesteld, zal op vordering van de executant, zo daartoe gronden zijn, tot
      schadevergoeding worden veroordeeld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel456
  - number: '457.1'
    text: |-
      Op de in beslag genomen zaken kan tot op het tijdstip van de verkoop opnieuw beslag worden gelegd. De beslaglegger
      is verplicht een zodanig beslag onverwijld te betekenen aan de deurwaarder die het eerdere beslag heeft gelegd en,
      zo deze er is, aan de gerechtelijke bewaarder, met vermelding van de aard van de vordering en van het beloop van
      het bedrag waarvoor het nieuwe beslag is gelegd of, indien de vordering nog niet is vereffend, van het geschatte
      bedrag.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel457
  - number: '457.2'
    text: |-
      Is het eerdere beslag gelegd op de grondslag van het [Wetboek van Strafvordering][ref1] dan is de beslaglegger
      verplicht het door hem later gelegde beslag onverwijld te betekenen aan het parket van het openbaar ministerie bij
      het gerecht in feitelijke aanleg waarvoor de strafzaak, op grond waarvan het eerdere beslag is gelegd, wordt of het
      laatst werd vervolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel457
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '457.3'
    text: |-
      Indien onder een beslag vorderingen tot vergoeding vallen, die voor in beslag genomen zaken in de plaats zijn
      getreden, worden deze ook door volgende beslagen op die zaken getroffen. Is een in beslag genomen zaak verloren
      gegaan, dan kan op die vorderingen tot op het tijdstip van de inning daarvan beslag worden gelegd met inachtneming
      van dezelfde formaliteiten als wanneer deze zaak zich nog onder de schuldenaar zou hebben bevonden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel457
  - number: '458.1'
    text: |-
      Indien op de zaak meer beslagen zijn gelegd, wordt zij verkocht door de beslaglegger die het oudste executoriale
      beslag heeft gelegd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel458
  - number: '458.2'
    text: |-
      Rust op een zaak een beperkt recht dat deze beslaglegger moet eerbiedigen, maar dat niet aan een latere
      beslaglegger kan worden tegengeworpen, dan wordt de zaak vrij van het beperkte recht verkocht, indien deze laatste
      beslaglegger aan de executant, de geëxecuteerde en de beperkt gerechtigde bij exploit mededeelt dit te verlangen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel458
  - number: '459.1'
    text: |-
      Indien de executant in gebreke blijft om binnen vier weken na afloop van de in [artikel 462][ref1] bedoelde termijn
      de verkoop tot stand te brengen, kan iedere beslaglegger die een executoriale titel heeft, de executie van de door
      hem in beslag genomen zaken overnemen door zulks bij exploit aan de executant en de geëxecuteerde aan te zeggen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel462
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel459
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '462'
        afdeling: Eerste
  - number: '459.2'
    text: |-
      De overneming kan niet geschieden dan nadat aan de executant schriftelijk een redelijke termijn is gesteld om
      alsnog tot verkoop over te gaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel459
  - number: '459.3'
    text: |-
      Indien er meer beslagleggers zijn die de overneming verlangen, is slechts degene die het oudste executoriale beslag
      heeft gelegd, daartoe bevoegd, tenzij de voorzieningenrechter van de rechtbank op verzoek van de meest gerede
      partij anders beslist.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel459
  - number: '459.4'
    text: Tegen beschikkingen krachtens het vorige lid is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel459
  - number: 461a.1
    text: |-
      Indien de in beslag genomen zaak is verpand en de pandhouder bevoegd is tot executie over te gaan, kan hij, zo
      nodig overeenkomstig [artikel 496][ref1] afgifte van de zaak vorderende, de executie overnemen en zelf executeren
      met inachtneming van de bepalingen betreffende executie krachtens pandrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel496
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel461a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '496'
        afdeling: Vierde
  - number: 461a.2
    text: |-
      Rusten op een zaak meer pandrechten, dan komt deze bevoegdheid uitsluitend toe aan de hoogst gerangschikte
      pandhouder, die tot executie wenst over te gaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel461a
  - number: 461a.3
    text: |-
      De pandhouder, die van deze bevoegdheid gebruik wil maken, dient zulks uiterlijk op het tijdstip van de verkoop bij
      exploit aan de beslaglegger, aan te zeggen met opgave van de termijn binnen welke hij tot verkoop zal overgaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel461a
  - number: 461a.4
    text: Zolang geen aanzegging als voormeld plaatsvindt, blijft de beslaglegger bevoegd de executie voort te zetten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel461a
  - number: 461b.1
    text: |-
      Indien de pandhouder de in het derde lid van het vorige artikel bedoelde termijn te lang stelt dan wel binnen die
      termijn niet tot verkoop overgaat, kan de voorzieningenrechter van de rechtbank op verzoek van de beslaglegger een
      termijn bepalen binnen welke de pandhouder uiterlijk tot de verkoop moet overgaan. Volgt binnen die termijn geen
      verkoop, dan is de executant met uitsluiting van de pandhouder bevoegd met de executie voort te gaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel461b
  - number: 461b.2
    text: Tegen een beschikking krachtens het vorige lid is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel461b
  - number: 461c
    text: |-
      De schuldeiser die vóór het beslag ten aanzien van in beslag genomen zaken het beding, bedoeld in artikel 254 van
      Boek 3 van het Burgerlijk Wetboek heeft gemaakt en van de in het [tweede lid van dat artikel](onbekend) bedoelde
      bevoegdheid tot gezamenlijke executie gebruik wil maken, kan de executie overeenkomstig [artikel 461a][ref1]
      overnemen. De artikelen 544-548 zijn op de executie van deze zaken van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel461a
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel461c
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 461a
        afdeling: Eerste
  - number: 461d
    text: |-
      Bevindt de in beslag genomen zaak zich onder een derde en beroept deze zich erop dat hij het beslag wegens de
      vorm ervan of wegens een hem ten aanzien van de zaak toekomend recht niet behoeft te dulden, dan dienen bij het
      beslag, voor zover de executant de executie zonder eerbiediging van het ingeroepen recht of bevoegdheid wenst door
      te zetten, de regels betreffende het derden-beslag uit de tweede afdeling te worden gevolgd, met dien verstande
      dat het reeds gelegde beslag geldt als een uitsluitend op die zaken gelegd derden-beslag en vervalt indien niet
      binnen drie dagen nadat het is gelegd, aan de derde een formulier in tweevoud als bedoeld in [artikel 475][ref1],
      is betekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel461d
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '475'
        afdeling: Tweede
  - number: '462.1'
    text: |-
      De verkoop der in beslag genomen zaken mag geen plaats hebben vóór vier weken, te rekenen van de dag van de
      betekening aan de geëxecuteerde van het proces-verbaal, bedoeld in [artikel 443][ref1], zulks op straffe van
      schadevergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel443
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel462
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '443'
        afdeling: Eerste
  - number: '462.2'
    text: |-
      Deze termijn kan verkort worden bij onderlinge toestemming van partijen of ook ten verzoeke van de meest gerede
      partij door de voorzieningenrechter van de rechtbank.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel462
  - number: '463.1'
    text: |-
      De verkoop zal in het openbaar worden gehouden ten overstaan van de deurwaarder en op een door deze daartoe aan te
      wijzen binnen zijn ambtsgebied gelegen plaats.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel463
  - number: '463.2'
    text: |-
      Is de in beslag genomen zaak op een markt of beurs verhandelbaar, dan kan de verkoop in afwijking van de
      [artikelen 464-466][ref1] en [469][ref2] geschieden op die markt door tussenkomst van een tussenpersoon in het vak
      of ter beurze door die van een bevoegde tussenpersoon overeenkomstig de regels en gebruiken die aldaar voor een
      gewone verkoop gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel464
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel469
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel463
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '464'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '469'
        afdeling: Eerste
  - number: '463.3'
    text: |-
      De voorzieningenrechter van de rechtbank kan ten verzoeke van de beslaglegger of de geëxecuteerde een verkoop als
      in het vorige lid bedoeld ook bepalen ten aanzien van effecten aan toonder die niet ter beurze verhandelbaar zijn.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel463
  - number: 463a
    text: |-
      Geschillen over de veilconditiën, over de wijze van verkoop of over dag, uur of plaats daarvan worden op verzoek
      van de meest gerede partij of de deurwaarder beslist door de voorzieningenrechter van de rechtbank, onverminderd
      de bevoegdheid van hen wier rechten bij de executie niet worden geëerbiedigd, zich daartegen overeenkomstig
      [artikel 438][ref1] te verzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel438
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel463a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '438'
  - number: 463b
    text: |-
      Tegen beschikkingen krachtens de [artikelen 462, tweede lid][ref1], [463, derde lid][ref2], en [463a][ref3] is geen
      hogere voorziening toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel462
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel463
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel463a
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel463b
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '462'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '463'
        afdeling: Eerste
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 463a
        afdeling: Eerste
  - number: '464.1'
    text: |-
      In de gemeente binnen welke de verkoop zal geschieden, zullen, ter plaatse daartoe bestemd, biljetten worden
      aangeslagen, houdende aanduiding van de plaats, de dag en het uur van de verkoop, alsmede van de aard van de zaken,
      doch zonder vermelding van nadere bijzonderheden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel464
  - number: '464.2'
    text: |-
      De biljetten worden in elk geval aangeslagen aan de plaats waar de zaken zich bevinden en aan die waar de verkoop
      zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel464
  - number: '465.1'
    text: |-
      Het aanslaan der biljetten moet geschieden na de in [artikel 449][ref1] bedoelde betekening en tenminste vier dagen
      vóór de verkoop, tenzij die termijn door de voorzieningenrechter van de rechtbank ten verzoeke van de meest gerede
      partij is verkort.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel449
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel465
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '449'
        afdeling: Eerste
  - number: '465.2'
    text: Tegen een beschikking krachtens het vorige lid is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel465
  - number: '466.1'
    text: |-
      De verkoop zal daarenboven worden bekend gemaakt in een dagblad van de plaats waar de verkoping zal geschieden, en
      bij gebreke van zodanig dagblad, in dat van een naburige plaats.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel466
  - number: '466.2'
    text: |-
      Deze bekendmaking wordt echter niet vereist, indien het bedrag der in beslag genomen zaken klaarblijkelijk minder
      dan € 180 bedraagt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel466
  - number: '467'
    text: |-
      De deurwaarder zal aan de voet van zijn proces-verbaal van beslag aantekening moeten doen van het aanslaan der
      biljetten en van de bekendmaking van de verkoop.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel467
  - number: '469.1'
    text: |-
      De verkoop wordt gehouden bij opbod of, ter keuze van de executant, bij opbod gevolgd door afmijning en de
      toewijzing zal geschieden aan de meestbiedende en tegen gerede betaling in handen van de deurwaarder.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel469
  - number: '469.2'
    text: |-
      De deurwaarder is bevoegd te vorderen, dat hem door elke bieder de geboden koopsom wordt ter hand gesteld en mag
      deze onder zich houden, totdat de zaak is toegewezen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel469
  - number: '469.3'
    text: |-
      Stelt een bieder, na de in het vorige lid bedoelde vordering, de geboden koopsom niet aan de deurwaarder ter hand,
      dan wordt zijn bod niet aangenomen en wordt hij gedurende de gehele verkoping niet meer als bieder toegelaten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel469
  - number: '469.4'
    text: |-
      Bij de toewijzing wordt geen rekening gehouden met biedingen die ingevolge het vorige lid niet mogen worden
      aangenomen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel469
  - number: '469.5'
    text: Bij gebreke van betaling zal de zaak terstond weer verkocht worden ten laste van hem wien zij toegewezen is.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel469
  - number: '470.1'
    text: |-
      Men zal met de verkoop der in beslag genomen zaken niet verder gaan dan nodig is om een opbrengst te verkrijgen,
      die voor betaling van de schulden en kosten voldoende is.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel470
  - number: '470.2'
    text: Te dien einde kan de geëxecuteerde de orde regelen, volgens welke de zaken zullen worden verkocht.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel470
  - number: '474'
    text: |-
      De deurwaarder is verantwoordelijk voor de verkregen opbrengst en voldoet daaruit onverwijld de kosten van de
      executie. Hij vermeldt in zijn proces-verbaal de namen en woonplaatsen der kopers.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474
  - number: 474a.1
    text: |-
      Het beslag op rechten aan toonder of order geschiedt door beslag op het papier. De eerste en tweede afdeling en de
      tweede afdeling B zijn, voor wat betreft het daar omtrent beslag op zaken bepaalde, van overeenkomstige toepassing,
      tenzij uit de betreffende bepaling in verband met de aard van het recht anders volgt. Indien het recht bestaat in
      een opeisbare vordering, kan de executant in plaats van tot verkoop overeenkomstig de eerste afdeling over te gaan,
      de executie ook voortzetten door beslag onder derden overeenkomstig de tweede afdeling.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474a
  - number: 474a.2
    text: |-
      Is ter voltooiing van de executie endossement vereist, dan kan dit door de deurwaarder die met de verkoop is
      belast, in zijn hoedanigheid van deurwaarder worden gesteld onder vermelding van "ter executie".
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474a
  - number: 474a.3
    text: |-
      Ingeval van verkoop moeten de voormelde rechten op de biljetten als bedoeld in [artikel 464][ref1] worden
      omschreven, met opgave van de naam van degene jegens wie het recht bestaat, van de aard van het recht, van het
      bedrag van de vordering waarin het recht bestaat en van de renten welke daarbij mochten zijn bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel464
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '464'
        afdeling: Eerste
  - number: 474aa.1
    text: |-
      De executie van andere aandelen op naam dan die bedoeld in de volgende afdelingen en van effecten op naam die geen
      aandelen zijn, geschiedt met overeenkomstige toepassing van die afdeling, tenzij uit de betreffende bepaling in
      verband met de aard van het aandeel of effect anders voortvloeit.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474aa
  - number: 474aa.2
    text: |-
      Lidmaatschapsrechten in verenigingen worden als effecten op naam aangemerkt, indien zij voor vervreemding vatbaar
      zijn.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474aa
  - number: 474b.1
    text: |-
      Nog niet aan de geëxecuteerde verantwoorde en afgedragen baten, die voortvloeien uit een recht aan toonder of
      order, een aandeel op naam of een effect op naam dat geen aandeel is, en die bestaan in geld of andere waarden,
      vallen mede onder het beslag en moeten aan de deurwaarder worden verantwoord en op zijn verlangen aan hem worden
      afgedragen, een en ander behoudens de rechten van derden die de executant moet eerbiedigen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474b
  - number: 474b.2
    text: |-
      Aan de schuldenaar die de in het eerste lid bedoelde baten heeft uitgekeerd aan hem die zich door middel van
      het toonder- of orderpapier als gerechtigd tot die baten heeft gelegitimeerd, kan evenwel dit beslag niet worden
      tegengeworpen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474b
  - number: 474b.3
    text: |-
      De [artikelen 475i][ref1] , [476][ref2] en [478][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475i
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel476
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel478
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474b
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475i
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '476'
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '478'
        afdeling: Tweede
  - number: 474ba
    text: |-
      Het stemrecht verbonden aan een in beslag genomen goed als bedoeld in het vorige artikel, en andere aan een
      zodanig goed verbonden bevoegdheden die niet onder het vorige artikel vallen, blijven gedurende het beslag bij
      de geëxecuteerde. Desgevraagd is de bewaarder of, als deze ontbreekt, de deurwaarder verplicht hem daartoe een
      bewijsstuk af te geven en verder het nodige te verrichten om hem in de gelegenheid te stellen tot het uitoefenen
      van deze rechten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474ba
  - number: 474bb.1
    text: |-
      Rechten waarvan de executie niet elders geregeld is, en niet opeisbare rechten waarop beslag onder derden mogelijk
      is, kunnen met overeenkomstige toepassing van de eerste afdeling worden geëxecuteerd, tenzij uit de wet of de aard
      van het recht anders volgt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474bb
  - number: 474bb.2
    text: |-
      De [artikelen 474b][ref1] en [474ba][ref2] zijn onder hetzelfde voorbehoud van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel474b
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel474ba
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474bb
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 474b
        afdeling: Eerste_A
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 474ba
        afdeling: Eerste_A
  - number: 474bb.3
    text: |-
      Gaat het om een recht dat jegens een derde moet worden uitgeoefend, dan is voor het beslag tevens betekening van
      het beslagexploit aan de derde vereist.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474bb
  - number: 474bb.4
    text: |-
      Indien door een zodanige executie van een niet opeisbaar recht waarop beslag onder derden mogelijk is, de
      geëxecuteerde of een andere belanghebbende onredelijk wordt benadeeld, beveelt de voorzieningenrechter op diens
      vordering dat de executie wordt gestaakt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474bb
  - number: 474c.1
    text: |-
      Onverminderd het bepaalde in het achtste lid van dit artikel geschiedt het beslag op aandelen op naam in een
      naamloze vennootschap of besloten vennootschap met beperkte aansprakelijkheid bij exploit van een deurwaarder dat,
      behalve de gewone formaliteiten, op straffe van nietigheid inhoudt:
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474c
  - number: 474c.1.a
    text: een aanzegging aan de vennootschap van de inbeslagneming;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474c
  - number: 474c.1.b
    text: de vermelding van de voornaam, naam en woonplaats van de executant en de naam en woonplaats van de geëxecuteerde;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474c
  - number: 474c.1.c
    text: de vermelding van de executoriale titel uit hoofde waarvan het beslag wordt gelegd;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474c
  - number: 474c.1.d
    text: een keuze van woonplaats ten kantore van de deurwaarder.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474c
  - number: 474c.2
    text: De deurwaarder vermeldt in zijn proces-verbaal zo mogelijk het getal en de nummers der in beslag genomen aandelen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474c
  - number: 474c.3
    text: |-
      Aan de vennootschap zal afschrift worden gelaten van het beslagexploit en van de executoriale titel uit hoofde
      waarvan het beslag wordt gelegd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474c
  - number: 474c.4
    text: |-
      In het register van aandeelhouders wordt terstond een namens de vennootschap ondertekende en door de deurwaarder
      mede-ondertekende aantekening geplaatst vermeldende de datum en het tijdstip van het gelegde beslag, de naam van de
      beslaglegger en het getal en zo mogelijk de nummers der in beslag genomen aandelen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474c
  - number: 474c.5
    text: |-
      De vennootschap en een ieder die toegang heeft tot de ruimte waar het register van aandeelhouders wordt bewaard,
      zijn verplicht hun medewerking aan de bepaling van het vorige lid te verlenen. Indien geen register bestaat,
      vermeldt de deurwaarder dit in zijn proces-verbaal.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474c
  - number: 474c.6
    text: |-
      Indien voor de in beslag genomen aandelen aandeelbewijzen zijn uitgegeven, is de vennootschap verplicht, op
      verlangen van de deurwaarder, hem daarvan bij het uitbrengen van het exploit mededeling te doen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474c
  - number: 474c.7
    text: |-
      Bij gebreke van enige medewerking als bedoeld in de drie voorafgaande leden is [artikel 444b][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel444b
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474c
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 444b
        afdeling: Eerste
  - number: 474c.8
    text: |-
      Indien het betreft aandelen op naam in vennootschappen als bedoeld in [artikel 86](onbekend), welker statuten
      voorschrijven, dat voor levering daarvan al dan niet onder bepaalde omstandigheden afgifte van het aandeelbewijs
      bij de vennootschap vereist is, geschiedt het beslag bij exploit van een deurwaarder met aanzegging als in het
      eerste lid vermeld na voorafgaande inbeslagneming van de desbetreffende aandeelbewijzen op de wijze als omschreven
      in de eerste afdeling. Deze inbeslagneming en de bewaargeving, bedoeld in [artikel 445][ref1], zullen onder
      verwijzing naar de akte of processen-verbaal, bedoeld in de [artikelen 440][ref2] en 443, in het exploit worden
      vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel445
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel440
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474c
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '445'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '440'
        afdeling: Eerste
  - number: 474d.1
    text: |-
      De deurwaarder zal van het gelegde beslag onverwijld, zo mogelijk op dezelfde dag, schriftelijk mededeling doen aan
      de geëxecuteerde.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474d
  - number: 474d.2
    text: |-
      Daarenboven moet, op straffe van verval van het beslag, een afschrift van het exploit binnen acht dagen na het
      beslag, aan de geëxecuteerde worden betekend.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474d
  - number: 474d.3
    text: |-
      Indien voor de in beslag genomen aandelen aandeelbewijzen zijn uitgegeven, is de geëxecuteerde verplicht aan de
      deurwaarder, zo mogelijk reeds bij de betekening van het exploit van beslag, de aandeelbewijzen met de eventueel
      daarbij behorende dividendbewijzen en talons ter hand te stellen of het nodige te verrichten opdat deze stukken
      hem ter hand gesteld worden. Indien voor die terhandstelling de medewerking van een derde vereist is, is die derde
      verplicht zijn medewerking tegen vergoeding der kosten te verlenen. Bij gebreke van medewerking van de derde is
      [artikel 444b][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel444b
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474d
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 444b
        afdeling: Eerste
  - number: 474d.4
    text: |-
      De deurwaarder zal, in afwachting van de executoriale verkoop, met die stukken handelen als bepaald in
      [artikel 445][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel445
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474d
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '445'
        afdeling: Eerste
  - number: 474e
    text: |-
      De in beslag genomen aandelen kunnen niet ten nadele van de beslaglegger worden vervreemd, bezwaard of onder bewind
      gesteld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474e
  - number: 474f
    text: |-
      Binnen acht dagen na het beslag zal de vennootschap aan de deurwaarder schriftelijk mededeling doen van rechten
      die vóór het exploit reeds op de in beslag genomen aandelen mochten zijn gevestigd, onder opgave van de namen en
      woonplaatsen der gerechtigden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474f
  - number: 474g.1
    text: |-
      Binnen één maand na het exploit van beslag zal de beslaglegger, op straffe van verval van het gelegde beslag, aan
      de rechtbank van het arrondissement waarin hij bij het beslagexploit woonplaats heeft gekozen, zo mogelijk onder
      overlegging van de mededeling bedoeld in het voorgaande artikel en de statuten der vennootschap, verzoeken bij
      beschikking te bepalen, dat en binnen welke termijn tot verkoop en overdracht van de in beslag genomen aandelen kan
      worden overgegaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474g
  - number: 474g.2
    text: |-
      De rechtbank gelast alvorens de gevraagde beschikking te geven de oproeping van de deurwaarder, de beslaglegger, de
      geëxecuteerde, de vennootschap, en, zo zij dit nodig acht, van verdere belanghebbenden, om op het verzoek te worden
      gehoord. Verzet tegen de verkoop door derden-rechthebbenden, kan uitsluitend geschieden door tijdige indiening van
      een daartoe strekkend verzoekschrift, waarvan afschrift wordt betekend aan de beslaglegger en aan de deurwaarder,
      die het beslag heeft gelegd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474g
  - number: 474g.3
    text: |-
      De rechtbank zal in haar beschikking bepalen op welke wijze en onder welke voorwaarden de verkoop en overdracht
      dienen te geschieden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474g
  - number: 474g.4
    text: |-
      De wettelijke en statutaire bepalingen ter zake van vervreemding van aandelen moeten worden in acht genomen,
      met dien verstande, dat alle ten aanzien van de vervreemding aan de aandeelhouder toekomende rechten en op hem
      drukkende verplichtingen worden uitgeoefend en nagekomen door de deurwaarder. Ook de beschikking der rechtbank
      zal ten aanzien van deze wettelijke en statutaire bepalingen geen afwijkingen mogen inhouden behoudens voor zover
      inachtneming van deze bepalingen de executoriale verkoop onmogelijk zou maken.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474g
  - number: 474h.1
    text: |-
      Van de verkoop wordt door de deurwaarder proces-verbaal opgemaakt. Tenzij
      [artikel 86c van boek 2 van het Burgerlijk Wetboek][ref1] van toepassing is, vermeldt het proces-verbaal de
      gegevens als bedoeld in [lid 2 van onderscheidenlijk artikel 86][ref2] en [artikel 196 van dat wetboek][ref3]. De
      koopprijs wordt de deurwaarder ter hand gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel86c
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel86
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel196
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474h
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 86c
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '86'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '196'
  - number: 474h.2
    text: |-
      Tenzij [artikel 86c van boek 2 van het Burgerlijk Wetboek][ref1] op de vennootschap van toepassing is, is
      voor de levering van het aandeel vereist dat het proces-verbaal in Nederland ter registratie is aangeboden.
      De [artikelen 86a][ref2] en [196a Boek 2][ref3] van dat wetboek zijn van overeenkomstige toepassing, met
      dien verstande dat de aan het aandeel verbonden rechten eerst kunnen worden uitgeoefend nadat een afschrift
      van het proces-verbaal dat ter registratie is aangeboden en de grosse van de door de rechtbank gegeven
      beschikking aan de vennootschap zijn betekend. Indien het aandelen betreft in vennootschappen als bedoeld in
      [artikel 86c van boek 2 van het Burgerlijk Wetboek][ref4] geschiedt de levering door betekening van de akte en
      grosse voormeld en inlevering van het aandeelbewijs bij de vennootschap.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel86c
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel86a
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel196a
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel86c
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474h
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 86c
      - id: ref2
        bwb_id: BWBR0003045
        artikel: 86a
      - id: ref3
        bwb_id: BWBR0003045
        artikel: 196a
      - id: ref4
        bwb_id: BWBR0003045
        artikel: 86c
  - number: 474h.3
    text: |-
      Indien ten aanzien van andere aandelen dan die bedoeld in de laatste zin van het tweede lid van dit artikel de
      verkrijger daarvan niet de beschikking heeft kunnen krijgen over de aandeelbewijzen met de eventueel daarbij
      behorende dividendbewijzen en talons op naam, zal de vennootschap hem daarvan desverlangd en op zijn kosten
      duplicaten afgeven. Door de uitgifte der duplicaten verliezen de oorspronkelijke stukken hun geldigheid. Indien
      de bedoelde verkrijger niet de beschikking heeft kunnen krijgen over de eventueel bij de aandeelbewijzen behorende
      dividendbewijzen en talons aan toonder, zal de vennootschap hem daarvan desverlangd en op zijn kosten slechts
      duplicaten afgeven na zekerheidstelling zijnerzijds voor de door de vennootschap tengevolge van de uitgifte der
      duplicaten op te lopen schade.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474h
  - number: 474i
    text: |-
      Bij executie van een executoriale titel tot levering van een aandeel zijn de leden 2-4 van het vorige artikel van
      overeenkomstige toepassing, met dien verstande dat in plaats van het proces-verbaal en de beschikking, bedoeld in
      het tweede lid, de te executeren titel aan de vennootschap wordt betekend.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel474i
  - number: '475.1'
    text: |-
      Het beslag op vorderingen die de geëxecuteerde op derden mocht hebben of uit een ten tijde van het beslag reeds
      bestaande rechtsverhouding rechtstreeks zal verkrijgen, en op hem toebehorende roerende zaken die onder derden
      mochten berusten en geen registergoederen zijn, geschiedt bij een exploit van een deurwaarder dat, behalve de
      gewone formaliteiten, op straffe van nietigheid inhoudt:
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475
  - number: 475.1.a
    text: |-
      een bevel aan de derde om het verschuldigde of de zaken onder zich te houden op straffe van onwaarde van elke in
      weerwil van het beslag gedane betaling of afgifte;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475
  - number: 475.1.b
    text: een vermelding van de naam, voornaam en woonplaats van de executant en de naam en woonplaats van de geëxecuteerde;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475
  - number: 475.1.c
    text: |-
      een vermelding van de titel uit hoofde waarvan het beslag wordt gelegd, en een opgave van hetgeen de geëxecuteerde
      krachtens deze titel aan de executant verschuldigd is;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475
  - number: 475.1.d
    text: een keuze van woonplaats ten kantore van de deurwaarder.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475
  - number: '475.2'
    text: |-
      De deurwaarder laat aan de derde-beslagene afschrift van het beslagexploit en van de executoriale titel uit hoofde
      waarvan het beslag wordt gelegd, alsmede een formulier in tweevoud volgens een bij algemene maatregel van bestuur
      vast te stellen model, waarop de verklaring bedoeld in [artikel 476b][ref1] kan worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel476b
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 476b
        afdeling: Tweede
  - number: 475a.1
    text: |-
      Het beslag strekt zich niet uit tot vorderingen of zaken die volgens de wet niet voor beslag vatbaar zijn, noch tot
      vorderingen die recht geven op een volgens de wet of naar haar aard niet voor beslag vatbare prestatie.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475a
  - number: 475a.2
    text: |-
      Het beslag is niet geldig op het gedeelte van een vordering dat daarop wordt ingehouden krachtens de wet,
      uit hoofde van een ziektekostenverzekering of van een pensioenspaarregeling dan wel uit hoofde van een
      ondernemingsspaarregeling voor een oudedagsverzorging.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475a
  - number: 475a.3
    text: |-
      Vorderingen die recht geven op iets anders dan betaling van een geldsom of dan levering van roerende zaken die geen
      registergoederen zijn, of van rechten aan toonder of order, vallen slechts onder het beslag, voor zover zij in het
      beslagexploit uitdrukkelijk zijn omschreven.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475a
  - number: 475b.1
    text: |-
      Beslag onder een derde op een of meer vorderingen van de schuldenaar tot periodieke betalingen waaraan een
      beslagvrije voet is verbonden, is slechts geldig voor zover een periodieke betaling de beslagvrije voet overtreft.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475b
  - number: 475b.2
    text: |-
      Ligt beslag onder verschillende derden op vorderingen van de schuldenaar tot periodieke betalingen waaraan een
      beslagvrije voet is verbonden, dan wordt de beslagvrije voet omgeslagen in verhouding tot de hoogte van deze
      periodieke betalingen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475b
  - number: 475b.3
    text: Beslag op nabetalingen is niet verder geldig dan indien de betaling gedurende het beslag tijdig was geschied.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475b
  - number: 475c
    text: 'Een beslagvrije voet is verbonden aan vorderingen tot periodieke betaling van:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475c
  - number: 475c.a
    text: loon,
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475c
  - number: 475c.b
    text: |-
      inkomstenbelasting begrepen in een voorlopige teruggaaf als bedoeld in
      [artikel 13, tweede lid, van de Algemene wet inzake rijksbelastingen][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel13
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475c
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '13'
  - number: 475c.c
    text: uitkeringen op grond van sociale zekerheidswetten, uitgezonderd kinderbijslag onder welke benaming ook,
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475c
  - number: 475c.d
    text: pensioen en lijfrente,
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475c
  - number: 475c.e
    text: uitkeringen uit levens-, invaliditeits-, ongevallen- of ziekengeldverzekering,
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475c
  - number: 475c.f
    text: |-
      uitkeringen tot levensonderhoud, verschuldigd krachtens [boek 1 van het Burgerlijk Wetboek][ref1], of tot
      vergoeding van schade door het derven van levensonderhoud,


      [ref1]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475c
    references:
      - id: ref1
        bwb_id: BWBR0002656
  - number: 475c.g
    text: |-
      uitkeringen of buitengewone pensioenen op grond van een wettelijke regeling voor oorlogsgetroffenen of voor degenen
      die hun vervangende dienstplicht vervullen,
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475c
  - number: 475c.i
    text: |-
      bezoldiging als bedoeld in [artikel 115 van de Ambtenarenwet][ref1] met uitzondering van die bedragen waarop de
      ambtenaar of gewezen ambtenaar niet periodiek aanspraak heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel115
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475c
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '115'
  - number: 475d.1
    text: 'De beslagvrije voet bedraagt voor schuldenaren die kunnen worden aangemerkt als:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475d
  - number: 475d.1.a
    text: |-
      echtgenoten of geregistreerde partners als bedoeld in [artikel 3 van Wet werk en bijstand][ref1] die beiden 21
      jaar of ouder zijn: negentig procent van de norm genoemd in [artikel 21, onderdeel c][ref2], respectievelijk
      [artikel 22, onderdeel c en d, van die wet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel22
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475d
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '21'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '22'
  - number: 475d.1.b
    text: |-
      een alleenstaande en een alleenstaande ouder als bedoeld in
      [artikel 4, onderdeel a en b, van de Wet werk en bijstand][ref1] die 21 jaar of ouder, doch jonger dan 65 jaar
      zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel4
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475d
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '4'
  - number: 475d.1.b.1°
    text: |-
      indien het periodieke inkomen bij de beslaglegger bekend is: 90 procent van dat inkomen
      inclusief de vakantie-aanspraak, doch ten minste 90 procent van de norm genoemd in
      [artikel 21, onderdeel a en b, van de Wet werk en bijstand][ref1] en ten hoogste 90 procent van die norm nadat deze
      eerst is verhoogd met het bedrag genoemd in [artikel 25, tweede lid, van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel25
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475d
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '25'
  - number: 475d.1.b.2°
    text: |-
      indien het periodieke inkomen niet bij de beslaglegger bekend is: 90 procent van de norm genoemd in
      [artikel 21, onderdeel a en b, van de Wet werk en bijstand][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel21
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475d
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '21'
  - number: 475d.1.c
    text: |-
      een alleenstaande van 65 jaar of ouder en een alleenstaande ouder van 65 jaar of ouder: negentig procent van de
      norm genoemd in [artikel 22, onderdeel a en b, van die wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel22
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475d
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '22'
  - number: 475d.2
    text: 'De beslagvrije voet bedraagt voor schuldenaren die kunnen worden aangemerkt als:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475d
  - number: 475d.2.a
    text: |-
      echtgenoten of geregistreerde partners zonder ten laste komende kinderen die beiden jonger zijn dan 21 jaar: 90
      procent van de norm genoemd in [artikel 20, eerste lid, onderdeel b, van de Wet werk en bijstand][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel20
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475d
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '20'
  - number: 475d.2.b
    text: |-
      echtgenoten of geregistreerde partners zonder ten laste komende kinderen waarvan een van hen jonger is dan 21 jaar:
      90 procent van de norm genoemd in [artikel 20, eerste lid, onderdeel c, van de Wet werk en bijstand][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel20
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475d
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '20'
  - number: 475d.2.c
    text: |-
      een alleenstaande jonger dan 21 jaar: 90 procent van de norm genoemd in
      [artikel 20, eerste lid, onderdeel a, van de Wet werk en bijstand][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel20
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475d
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '20'
  - number: 475d.2.d
    text: |-
      een alleenstaande ouder jonger dan 21 jaar: 90 procent van de norm genoemd in
      [artikel 20, tweede lid, onderdeel a, van de Wet werk en bijstand][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel20
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475d
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '20'
  - number: 475d.2.e
    text: |-
      echtgenoten of geregistreerde partners die beiden jonger zijn dan 21 jaar
      met een of meer ten laste komende kinderen: 90 procent van de norm genoemd in
      [artikel 20, tweede lid, onderdeel b, van de Wet werk en bijstand][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel20
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475d
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '20'
  - number: 475d.2.f
    text: |-
      echtgenoten of geregistreerde partners waarvan een van hen jonger is dan 21 jaar
      met een of meer ten laste komende kinderen: 90 procent van de norm genoemd in
      [artikel 20, tweede lid, onderdeel c, van de Wet werk en bijstand][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel20
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475d
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '20'
  - number: 475d.3
    text: |-
      Voor zover het echtgenoten of geregistreerde partners betreft, wordt de beslagvrije voet voor ten hoogste de helft
      verminderd met het eigen, niet onder beslag liggende periodieke inkomen inclusief vakantie-aanspraak van degene aan
      wie de bijstand samen met de schuldenaar zou kunnen toekomen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475d
  - number: 475d.4
    text: |-
      Indien de schuldenaar ter verzorging of verpleging in een daartoe bestemde inrichting is opgenomen bedraagt
      de beslagvrije voet de prijs die is verschuldigd voor verzorging dan wel verpleging. De beslagvrije voet wordt
      verhoogd met twee derden van de bijstandsnorm genoemd in [artikel 23 van de Wet werk en bijstand][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel23
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475d
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '23'
  - number: 475d.5
    text: 'De beslagvrije voet wordt verhoogd met:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475d
  - number: 475d.5.a
    text: |-
      de premie van een door de schuldenaar gesloten ziektekostenverzekering, telkens wanneer deze premie vervalt terwijl
      het beslag ligt;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475d
  - number: 475d.5.b
    text: |-
      de voor rekening van de schuldenaar komende woonkosten verminderd met ontvangen huursubsidie, een
      bijzondere bijdrage in de huurlasten op grond van [artikel 26b van de Huursubsidiewet][ref1], of
      woonkostentoeslag, voor zover de woonkosten, na deze vermindering, meer bedragen dan het bedrag, genoemd in
      [artikel 17, tweede lid, van de Huursubsidiewet][ref2], met dien verstande dat de verhoging van de beslagvrije voet
      niet meer bedraagt dan het huursubsidiebedrag waarop de schuldenaar, uitgaande van de laagste inkomenscategorie,
      krachtens [artikel 21 van de Huursubsidiewet][ref3] ten hoogste aanspraak heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel26b
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0008659#Artikel21
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475d
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: 26b
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '17'
      - id: ref3
        bwb_id: BWBR0008659
        artikel: '21'
  - number: 475d.6
    text: |-
      De beslagvrije voet wordt verminderd met de voor beslag vatbare periodieke inkomsten van de schuldenaar waarop
      geen beslag ligt, alsmede met het normbedrag voor de kosten van levensonderhoud en de toeslag voor een partner of
      eenoudergezin, begrepen in aan de schuldenaar toegekende studiefinanciering of tegemoetkoming in de studiekosten
      die niet vatbaar is voor beslag.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475d
  - number: 475d.7
    text: |-
      Met wijziging van omstandigheden die de beslagvrije voet verhogen, moet de beslaglegger onverwijld rekening houden.
      Hij is verplicht aan degene die de periodieke betaling moet verrichten, met het tijdstip van ingang, kennis van de
      verhoging te geven onmiddellijk nadat de reden daarvoor is aangetoond aan hem, zijn advocaat, zijn gemachtigde of
      de deurwaarder.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475d
  - number: 475d.8
    text: |-
      Tenzij alle betalingen wekelijks geschieden, worden zij, evenals inkomsten van degene aan wie samen met de
      schuldenaar gezinsbijstand zou kunnen toekomen, voor de toepassing van dit artikel berekend per maand.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475d
  - number: 475e
    text: |-
      Geen beslagvrije voet geldt voor vorderingen van een schuldenaar die niet in Nederland woont of vast verblijft.
      Indien hij evenwel aantoont dat hij buiten deze vorderingen onvoldoende middelen van bestaan heeft, kan de
      kantonrechter op zijn verzoek een beslagvrije voet vaststellen voor zijn vorderingen op schuldenaren die woonplaats
      hebben in Nederland.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475e
  - number: 475f
    text: |-
      Indien beslag is gelegd op een vordering tot weerkerende betalingen die niet in [artikel 475c][ref1] is
      omschreven en de schuldenaar onvoldoende andere middelen van bestaan heeft, kan hij de kantonrechter verzoeken de
      [artikelen 475b][ref2] en [475d][ref3] mede op die vordering van toepassing te verklaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475b
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475f
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475b
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 475d
        afdeling: Tweede
  - number: 475g.1
    text: |-
      Een schuldenaar is verplicht aan een deurwaarder die gerechtigd is tegen hem beslag te leggen, desgevraagd zijn
      bronnen van inkomsten op te geven. Een deurwaarder die beslag heeft gelegd, is verplicht hem op te geven hoeveel
      zijn beslagvrije voet bedraagt, berekend volgens [artikel 475d, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475g
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475d
        afdeling: Tweede
  - number: 475g.2
    text: |-
      Zo lang als de schuldenaar desgevraagd niet aan de beslaglegger of diens vertegenwoordiger opgeeft of en hoeveel
      inkomen toekomt aan degene aan wie samen met hem gezinsbijstand zou kunnen toekomen, wordt de beslagvrije voet
      gehalveerd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475g
  - number: 475g.3
    text: |-
      Een deurwaarder die gerechtigd is tegen een schuldenaar beslag te leggen, is bevoegd aan degene van wie hij
      vermoedt dat deze aan de schuldenaar periodieke betalingen verricht of schuldig is, te vragen of dat zo is. Ieder
      is verplicht hierop desgevraagd schriftelijk te antwoorden. Daarbij moeten de termijn van de betalingen en hun
      omvang na aftrek van de in [artikel 475a][ref1] genoemde inhoudingen worden opgegeven alsmede eventuele gelegde
      beslagen. De Staat en degenen die periodieke betalingen doen aan personen wier naam zij niet rechtstreeks uit hun
      administratie kunnen lichten, behoeven de vraag slechts te beantwoorden ten aanzien van in de vraag omschreven
      betalingen of aangeduide collectieve verzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475a
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475g
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475a
        afdeling: Tweede
  - number: 475g.4
    text: |-
      Met het oog op het inwinnen van de in het derde lid bedoelde gegevens is de deurwaarder bevoegd bij de
      gemeentelijke basisadministratie persoonsgegevens het sociaal-fiscaal nummer van de schuldenaar op te vragen. Met
      behulp van dit nummer kunnen gegevens worden opgevraagd bij personen of instanties, bedoeld in het derde lid, die
      zelf reeds gerechtigd zijn tot het gebruik van het nummer.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475g
  - number: 475g.5
    text: |-
      De deurwaarder gebruikt het sociaal-fiscaal nummer uitsluitend voor het opvragen van de in het derde lid bedoelde
      gegevens bij de in het derde lid bedoelde personen of instanties, die zelf reeds gerechtigd zijn tot het gebruik
      van het nummer.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475g
  - number: 475h.1
    text: |-
      Een vervreemding, bezwaring, afstand of onderbewindstelling van een door het beslag getroffen vordering, tot stand
      gekomen nadat het beslag is gelegd, kan niet tegen de beslaglegger worden ingeroepen. Hetzelfde geldt voor een
      in weerwil van het beslag gedane betaling of afgifte, tenzij de derde heeft gedaan wat redelijkerwijs van hem kon
      worden gevergd om de betaling of afgifte te voorkomen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475h
  - number: 475h.2
    text: |-
      Op door het beslag getroffen zaken is [artikel 453a][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel453a
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475h
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 453a
        afdeling: Eerste
  - number: 475i
    text: |-
      De executant is verplicht om binnen acht dagen na het leggen van het beslag het beslagexploit aan de geëxecuteerde
      te doen betekenen bij gebreke waarvan de voorzieningenrechter van de rechtbank het beslag op vordering van de
      geëxecuteerde kan opheffen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel475i
  - number: '476.1'
    text: |-
      Een schorsing van de executie werkt tegen de derde-beslagene pas, nadat deze schorsing hem met de grond waarop zij
      berust schriftelijk is medegedeeld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel476
  - number: '476.2'
    text: |-
      De executie wordt mede geschorst door betekening aan de derde-beslagene van een dagvaarding, waarbij de
      geëxecuteerde in kort geding schorsing van de executie of opheffing van het beslag vordert, indien deze dagvaarding
      niet later is uitgebracht dan veertien dagen na de in [artikel 475i][ref1] bedoelde betekening van het beslag aan
      de geëxecuteerde en in het exploit van betekening aan de derde tevens mededeling van deze schorsende werking wordt
      gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475i
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel476
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475i
        afdeling: Tweede
  - number: 476a.1
    text: |-
      Zodra vier weken zijn verstreken na het leggen van het beslag, is de derde verplicht verklaring te doen van
      de vorderingen en zaken die door het beslag zijn getroffen. Is de executie geschorst op grond van een tegen de
      executoriale titel gericht rechtsmiddel of een tegen de executie gericht verzet, dan loopt de termijn vanaf de
      betekening van de uitspraak, waarbij het rechtsmiddel is verworpen of het verzet is afgewezen, dan wel de schorsing
      is opgeheven of geweigerd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel476a
  - number: 476a.2
    text: 'De verklaring wordt door de derde-beslagene gedagtekend en ondertekend en bevat:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel476a
  - number: 476a.2.a
    text: |-
      de met redenen omklede opgave of hij al dan niet iets aan de geëxecuteerde verschuldigd is of uit een ten tijde van
      het beslag reeds bestaande rechtsverhouding zal worden, dan wel of hij al dan niet iets voor deze onder zich heeft;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel476a
  - number: 476a.2.b
    text: |-
      de aard en het beloop van de door het beslag getroffen vorderingen en eventueel de tijdsbepalingen of voorwaarden
      die daaraan zijn verbonden;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel476a
  - number: 476a.2.c
    text: een gespecificeerde opgave van de door het beslag getroffen zaken;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel476a
  - number: 476a.2.d
    text: |-
      een opgave van eventuele andere, onder de derde-beslagene ten laste van de geëxecuteerde liggende beslagen met
      vermelding van de deurwaarders die ze hebben gelegd en de tijdstippen waarop ze zijn gelegd;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel476a
  - number: 476a.2.e
    text: |-
      een opgave van de aan de derde-beslagene bekende pandrechten die op door het beslag getroffen goederen rusten, met
      vermelding van de pandhouders;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel476a
  - number: 476a.2.f
    text: de verdere gegevens die voor het vaststellen van de rechten van partijen dienstig mochten zijn.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel476a
  - number: 476b.1
    text: |-
      De verklaring wordt op een bij algemene maatregel van bestuur vast te stellen wijze gericht tot de deurwaarder die
      het beslag heeft gelegd of tot de advocaat die voor de beslaglegger optreedt, zo deze in het exploit is vermeld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel476b
  - number: 476b.2
    text: De verklaring gaat zo veel mogelijk vergezeld van afschrift van tot staving dienende bescheiden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel476b
  - number: 476b.3
    text: |-
      De deurwaarder of advocaat die een verklaring heeft ontvangen, zendt binnen drie dagen afschrift daarvan aan de
      geëxecuteerde.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel476b
  - number: '477.1'
    text: |-
      De derde-beslagene die overeenkomstig het vorige artikel verklaring heeft gedaan, is verplicht de volgens deze
      verklaring verschuldigde geldsommen aan de deurwaarder te voldoen en de verschuldigde goederen of af te geven zaken
      te zijner beschikking te stellen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel477
  - number: '477.2'
    text: |-
      Verschuldigde geldsommen worden uitbetaald tot het bedrag waarvoor het beslag is gelegd, verminderd met de kosten
      van de in [artikel 476][ref1], bedoelde afschriften en vermeerderd met de door de deurwaarder aan de derde-
      beslagene op te geven kosten van executie, die door de deurwaarder uit het betaalde worden voldaan. Verschuldigde
      goederen of af te geven zaken mogen onder de derde worden gelaten, totdat zij voor de verdere afwikkeling van de
      executie nodig blijken.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel476b
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel477
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 476b
        afdeling: Tweede
  - number: '477.3'
    text: |-
      Is een door het beslag getroffen vordering of een verplichting tot afgifte van een door het beslag getroffen zaak
      er een onder tijdsbepaling of voorwaarde, dan kan slechts betaling of afgifte na het verschijnen van het aangewezen
      tijdstip of de vervulling van de voorwaarde worden gevorderd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel477
  - number: '477.4'
    text: |-
      De beslaglegger is bevoegd tot opzegging, wanneer de vordering niet opeisbaar is, maar door opzegging opeisbaar
      gemaakt kan worden. Hij is jegens de geëxecuteerde gehouden niet onnodig van deze bevoegdheid gebruik te maken.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel477
  - number: '477.5'
    text: |-
      Hetgeen in handen van de deurwaarder is gesteld, wordt verder geëxecuteerd overeenkomstig de gewone regels, die
      voor de executie daarvan gelden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel477
  - number: 477a.1
    text: |-
      Indien de derde-beslagene in gebreke blijft verklaring te doen, wordt hij op vordering van de executant veroordeeld
      tot betaling van het bedrag waarvoor het beslag is gelegd als ware hij daarvan zelf schuldenaar, onverminderd zijn
      verplichting tot vergoeding van de schade, zo daartoe gronden zijn. De derde-beslagene tegen wie deze vordering
      wordt ingesteld, wordt toegelaten alsnog een gerechtelijke verklaring te doen. De kosten die in dat geval nodeloos
      zijn veroorzaakt, worden voor zijn rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel477a
  - number: 477a.2
    text: |-
      Indien de derde-beslagene wel een verklaring heeft afgelegd, is de executant bevoegd deze geheel of ten dele te
      betwisten dan wel aanvulling daarvan te eisen door de derde binnen twee maanden na zijn verklaring te dagvaarden
      tot het doen van gerechtelijke verklaring en tot betaling of afgifte van hetgeen volgens de vaststelling door de
      rechter aan de executant zal blijken toe te komen. Overschrijding van deze termijn doet deze bevoegdheid vervallen.
      De rechter kan op verlangen van de derde-beslagene, te uiten voor alle weren, bepalen dat de executant, op straffe
      van niet ontvankelijkheid, zekerheid moet stellen voor de proceskosten, waarin hij jegens de derde-beslagene kan
      worden veroordeeld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel477a
  - number: 477a.3
    text: |-
      De advocaat van de executant, die een gerechtelijke verklaring ontvangt, zendt binnen drie dagen afschrift daarvan
      aan de geëxecuteerde.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel477a
  - number: 477a.4
    text: |-
      Indien de derde-beslagene, die overeenkomstig [artikel 476b][ref1] verklaring heeft gedaan, zijn in
      [artikel 477][ref2] bedoelde verplichting tot betaling of afgifte niet nakomt, wordt hij op vordering van de
      executant veroordeeld tot nakoming van deze verplichting, alsmede tot de vervangende schadevergoeding, die hij in
      geval van niet-nakoming daarvan verschuldigd zal zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel476b
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel477
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel477a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 476b
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '477'
        afdeling: Tweede
  - number: 477a.5
    text: |-
      Tot kennisneming van de in dit artikel bedoelde vorderingen is de rechtbank bevoegd. Indien de executant bij zijn
      dagvaarding het beslag slechts vervolgt op vorderingen, waarvan de berechting ongeacht hun beloop of naar hun
      gezamenlijk beloop tot de bevoegdheid van de kantonrechter behoort, is slechts de kantonrechter bevoegd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel477a
  - number: 477b.1
    text: |-
      Betaling of afgifte door de derde-beslagene overeenkomstig zijn buitengerechtelijke verklaring of krachtens een
      veroordeling als bedoeld in [artikel 477a][ref1] geldt als betaling of afgifte aan de geëxecuteerde.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel477a
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel477b
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 477a
        afdeling: Tweede
  - number: 477b.2
    text: |-
      Levering uit hoofde van de executoriale verkoop van een goed dat de derde aan de geëxecuteerde verschuldigd was
      en ter beschikking van de deurwaarder heeft gesteld, geldt tevens als levering van dit goed door de derde aan de
      geëxecuteerde. Indien het niet gaat om een roerende zaak die geen registergoed is, of een recht aan toonder of
      order, dient de terbeschikkingstelling schriftelijk te zijn geschied.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel477b
  - number: 477b.3
    text: |-
      De derde-beslagene en de geëxecuteerde worden overigens niet gebonden door hetgeen in een vonnis ingevolge
      [artikel 477a][ref1] omtrent hun onderlinge rechtsverhouding is beslist, tenzij de derde-beslagene de geëxecuteerde
      tijdig in het geding heeft geroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel477a
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel477b
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 477a
        afdeling: Tweede
  - number: '478.1'
    text: |-
      Indien onder de derde-beslagene ten laste van de geëxecuteerde ook andere beslagen zijn gelegd en niet bij voorbaat
      vaststaat dat alle beslagleggers uit de door de derde-beslagene verschuldigde geldsommen zullen kunnen worden
      voldaan, int de deurwaarder die het oudste executoriale beslag heeft gelegd, voor de gezamenlijke beslagleggers
      hetgeen de derde-beslagene heeft te betalen of af te geven. Wordt de executie door de legger van dit beslag niet
      voortgezet, dan neemt de deurwaarder die het daaropvolgende executoriale beslag heeft gelegd, de inning over.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel478
  - number: '478.2'
    text: |-
      Een derde-beslagene die een betaling of afgifte heeft gedaan aan een deurwaarder die een der andere executoriale
      beslagen heeft gelegd, is niettemin bevrijd. De deurwaarder die de gelden of goederen heeft ontvangen, draagt deze
      onverwijld af aan de deurwaarder die ze had behoren te ontvangen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel478
  - number: '478.3'
    text: |-
      Ieder der deurwaarders die beslag hebben gelegd, is verplicht de anderen zodra mogelijk van het door hen gelegde
      beslag op de hoogte te brengen. De derde is verplicht ieder van hen desgevraagd in te lichten omtrent andere
      beslagen, de namen en gekozen woonplaatsen van de andere beslagleggers en het beloop van hun vorderingen.
      Deze verplichtingen gelden ook voor en jegens degene op wiens last beslag is gelegd op de grondslag van het
      [Wetboek van Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel478
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '478.4'
    text: |-
      Ieder der beslagleggers kan tussen komen in een procedure als bedoeld in [artikel 477a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel477a
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel478
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 477a
        afdeling: Tweede
  - number: '479.1'
    text: |-
      Derdenbeslag onder de staat of een openbaar lichaam is, onverminderd het in [artikel 436][ref1] bepaalde,
      toegelaten, echter slechts op bepaalde in het exploit of, in geval van het beslag als bedoeld in
      [artikel 479g][ref2], in de kennisgeving omschreven vorderingen of zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel436
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel479g
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel479
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '436'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 479g
        afdeling: Tweede_A
  - number: '479.2'
    text: |-
      Om redenen van openbaar belang kan de staat of het openbaar lichaam in kort geding voor de voorzieningenrechter van
      de rechtbank onmiddellijke opheffing van het derdenbeslag vorderen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel479
  - number: 479a.1
    text: |-
      Ingeval een schuldeiser voor een vordering verhaal zoekt op een schuldenaar, die om niet of tegen een onevenredig
      lage vergoeding geregeld werkzaamheden of diensten voor een derde verricht welker aard en omvang zodanig zijn,
      dat zij gewoonlijk slechts tegen betaling worden verricht, wordt ten behoeve van die schuldeiser aangenomen, dat
      daarvoor een redelijke vergoeding verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel479a
  - number: 479a.2
    text: |-
      Bij de beoordeling der vraag, of het in het vorige lid bedoelde geval zich voordoet, en, zo ja, welke vergoeding
      als redelijk aangenomen moet worden, worden alle omstandigheden van het geval in aanmerking genomen, in het
      bijzonder de aard van de verrichte werkzaamheden of diensten, de betrekkingen van verwantschap of van andere aard
      tussen de schuldenaar en de derde en de financiële draagkracht van deze laatste.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel479a
  - number: 479b
    text: |-
      Het beslag tot verhaal van een uitkering tot levensonderhoud, krachtens [Boek 1 van het Burgerlijk Wetboek][ref1]
      of bij wijze van voorlopige voorziening in verband met een geding tot echtscheiding, tot scheiding van tafel en
      bed, onderscheidenlijk tot ontbinding van een geregistreerd partnerschap verschuldigd, daaronder begrepen het
      verschuldigde voor verzorging en opvoeding van een minderjarige alsmede het beslag tot verhaal van een uitkering
      krachtens [artikel 85, tweede lid, van Boek 1 van het Burgerlijk Wetboek](onbekend) door de ene partner aan de
      andere partner verschuldigd, worden, indien de beslagen gelegd worden op loon of andere periodieke uitkeringen,
      welke de geëxecuteerde van een derde te vorderen mocht hebben, gelegd en vervolgd op de wijze en met de gevolgen in
      de vorige afdeling bepaald, voor zover daarvan in deze afdeling niet is afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel479b
    references:
      - id: ref1
        bwb_id: BWBR0002656
  - number: 479d
    text: |-
      De geëxecuteerde kan te allen tijde overeenkomstig [artikel 438][ref1] verzet instellen op grond dat de beslissing
      over de uitkering inmiddels is gewijzigd of ingetrokken of dat het recht op uitkering niet langer bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel438
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel479d
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '438'
  - number: 479e.1
    text: |-
      Van de dag van het beslag af is de derde-beslagene verplicht om, zolang de executant dit verlangt, naar gelang
      hij loon of andere periodieke uitkeringen aan de geëxecuteerde verschuldigd is het door de executant aangegeven
      achterstallig bedrag en de termijnen van de uitkering, tot welker verhaal het beslag is gelegd, aan de executant te
      betalen, tenzij onder hem beslag gelegd mocht worden wegens vorderingen van hogere of gelijke rang.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel479e
  - number: 479e.2
    text: |-
      Verzet tegen het beslag door de geëxecuteerde schorst de verplichting tot betaling, behoudens de bevoegdheid van de
      voorzieningenrechter de voorlopige voortzetting van de betaling te bevelen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel479e
  - number: 479e.3
    text: |-
      De derde die meer aan de executant heeft betaald dan waarop deze recht heeft, is jegens de geëxecuteerde bevrijd,
      voor zover dat voortvloeit uit [artikel 34 van Boek 6 van het Burgerlijk Wetboek](onbekend).
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel479e
  - number: 479f
    text: |-
      De executant vervolgt de derde-beslagene, die in gebreke blijft aan zijn verplichting ingevolge het voorgaand
      artikel te voldoen, voor de kantonrechter.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel479f
  - number: 479g.1
    text: |-
      Indien de raad voor de kinderbescherming executant is dan wel, indien ingevolge het bepaalde in [artikel 408,
      tweede lid, van Boek 1 van het Burgerlijk Wetboek](onbekend) het Landelijk Bureau Inning Onderhoudsbijdragen is
      belast met de invordering van onderhoudsgelden, kan hij dit beslag leggen hetzij op de gewone wijze, hetzij door
      van de beschikking in afschrift mededeling te doen aan de derde-beslagene. In het laatste geval zendt deze die
      schriftelijke kennisgeving voor "gezien" getekend aan de raad voor de kinderbescherming of het Landelijk Bureau
      Inning Onderhoudsbijdragen terug. Eerst door deze terugzending is het beslag voltooid.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel479g
  - number: 479g.2
    text: |-
      De raad voor de kinderbescherming en het Landelijk Bureau Inning Onderhoudsbijdragen kunnen beslag leggen op de
      dag, volgende op die waarop de uitkering moet geschieden, zonder voorafgaande betekening of bevel tot betaling.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel479g
  - number: 479g.3
    text: |-
      Toezending door de executant van een afschrift der kennisgeving bij aangetekende brief aan de geëxecuteerde binnen
      zeven dagen na de dag, waarop die kennisgeving, voor "gezien" getekend, door de executant van de derde-beslagene is
      terugontvangen, geldt als de betekening, bij [artikel 475][ref1] voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475i
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel479g
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475i
        afdeling: Tweede
  - number: 479h
    text: |-
      Een schuldeiser kan ook beslag leggen op de vorderingen die zijn schuldenaar op hem heeft of uit een ten tijde
      van het beslag reeds bestaande rechtsverhouding rechtstreeks zal verkrijgen, alsook op de aan zijn schuldenaar
      toebehorende roerende zaken die hij voor deze onder zich heeft en die geen registergoederen zijn.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel479h
  - number: 479i.1
    text: |-
      Het beslag wordt gelegd bij een exploit van een deurwaarder dat, behalve de gewone formaliteiten, op straffe van
      nietigheid inhoudt:
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel479i
  - number: 479i.1.a
    text: de voornaam, naam en woonplaats van de executant en de naam en woonplaats van de geëxecuteerde;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel479i
  - number: 479i.1.b
    text: een gespecificeerde opgave en omschrijving van de vorderingen en zaken waarop het beslag wordt gelegd;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel479i
  - number: 479i.1.c
    text: |-
      een vermelding van de titel waarvan de tenuitvoerlegging plaatsvindt, en een opgave van hetgeen de geëxecuteerde
      krachtens deze titel aan de executant verschuldigd is;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel479i
  - number: 479i.1.d
    text: een keuze van woonplaats ten kantore van de deurwaarder.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel479i
  - number: 479i.2
    text: |-
      De [artikelen 475][ref1], en [475][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475a
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475b
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel479i
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475a
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475b
        afdeling: Tweede
  - number: 479j.1
    text: |-
      Veertien dagen na het leggen van het beslag is de executant bevoegd de door hem aan de geëxecuteerde verschuldigde
      goederen of af te geven zaken over te geven aan de deurwaarder ter executie volgens de gewone regels voor zodanige
      goederen of zaken voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel479j
  - number: 479j.2
    text: |-
      Door de executoriale verkoop wordt de executant bevrijd van zijn verplichting tot levering van de goederen of
      afgifte van de zaken aan de geëxecuteerde.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel479j
  - number: 479k
    text: |-
      Indien andere schuldeisers ten laste van de schuldenaar beslag op de vordering of de zaak hebben gelegd, is
      [artikel 478][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel478
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel479k
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '478'
        afdeling: Tweede
  - number: 479l
    text: |-
      Het beslag op de rechten die voor de geëxecuteerde als verzekeringnemer
      voortvloeien uit een overeenkomst van levensverzekering als omschreven in
      [artikel 1, eerste lid, onder b, van de Wet toezicht verzekeringsbedrijf 1993][ref1], geschiedt uitsluitend op de
      wijze zoals in de tweede afdeling is bepaald, voor zover daarvan in deze afdeling niet wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel1
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel479l
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '1'
  - number: 479m.1
    text: |-
      Nadat de verzekeraar verklaring heeft gedaan als bedoeld in [artikel 476a][ref1], is de executant bevoegd tot het
      uitoefenen van:


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel476a
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel479m
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 476a
        afdeling: Tweede
  - number: 479m.1.a
    text: het recht op het doen afkopen van de levensverzekering;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel479m
  - number: 479m.1.b
    text: het recht om de begunstiging te wijzigen ten behoeve van de geëxecuteerde of diens nalatenschap.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel479m
  - number: 479m.2
    text: |-
      De geëxecuteerde is bevoegd op de bij de verzekeraar gebruikelijke voorwaarden de levensverzekering te belenen ter
      voldoening, voor zover mogelijk, van hetgeen aan de executant verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel479m
  - number: 479m.3
    text: |-
      Het door de verzekeraar ingevolge belening of uitkering van de levensverzekering aan de geëxecuteerde of diens
      nalatenschap verschuldigde bedrag, valt onder het beslag.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel479m
  - number: 479n.1
    text: |-
      De executant is verplicht bij deurwaardersexploit aan de geëxecuteerde mededeling te doen welke van de in
      [artikel 479m, eerste lid][ref1], bedoelde rechten hij wil uitoefenen. Hij doet een afschrift van het exploit
      toekomen aan de verzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel479m
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel479n
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 479m
        afdeling: Tweede_c
  - number: 479n.2
    text: |-
      Indien de executant de levensverzekering wil doen afkopen, houdt het exploit op straffe van nietigheid de
      vermelding in dat de geëxecuteerde binnen twee weken na de dag waarop het exploit is uitgebracht aan de executant
      en de verzekeraar bij aangetekende brief mededeling kan doen dat hij de levensverzekering overeenkomstig
      [artikel 479m, tweede lid][ref1], wil belenen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel479m
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel479n
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 479m
        afdeling: Tweede_c
  - number: 479n.3
    text: |-
      De executant kan de in [artikel 479m, eerste lid][ref1], bedoelde bevoegdheid uitoefenen zodra twee weken zijn
      verstreken na de dag waarop het exploit bedoeld in het eerste lid is uitgebracht. Heeft de geëxecuteerde een
      mededeling gedaan als bedoeld in het tweede lid, dan kan de executant de levensverzekering evenwel eerst doen
      afkopen zodra vier weken na die mededeling zijn verstreken en de belening niet heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel479m
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel479n
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 479m
        afdeling: Tweede_c
  - number: 479o.1
    text: |-
      Indien de executant de levensverzekering heeft doen afkopen of de geëxecuteerde deze overeenkomstig
      [artikel 479m, tweede lid][ref1], heeft beleend, vervalt het beslag met betrekking tot die verzekering zodra de
      verzekeraar het uit die afkoop of die belening verschuldigde bedrag aan de deurwaarder heeft voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel479m
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel479o
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 479m
        afdeling: Tweede_c
  - number: 479o.2
    text: |-
      Indien de executant met betrekking tot een levensverzekering de begunstiging heeft gewijzigd, vervalt die wijziging
      door de beëindiging van het beslag op die verzekering.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel479o
  - number: 479p.1
    text: |-
      Indien de geëxecuteerde of een begunstigde door een afkoop van de levensverzekering of een wijziging van de
      begunstiging onredelijk zou worden benadeeld, verbiedt de voorzieningenrechter op diens vordering geheel of ten
      dele die afkoop of wijziging. De in de vorige volzin bedoelde vordering kan slechts worden ingesteld binnen twee
      weken na de dag waarop het exploit bedoeld in [artikel 479n, eerste lid][ref1], is uitgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel479n
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel479p
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 479n
        afdeling: Tweede_c
  - number: 479p.2
    text: |-
      Zolang op een vordering als bedoeld in het eerste lid niet is beslist, kan de executant de levensverzekering niet
      doen afkopen of de begunstiging wijzigen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel479p
  - number: 479q
    text: |-
      Indien met betrekking tot een levensverzekering door verschillende schuldeisers beslag is gelegd, geschiedt de
      voortzetting van de executie door degene die het oudste executoriaal beslag heeft gelegd. Wordt de executie door
      de legger van dit beslag niet voortgezet, dan neemt degene die het daaropvolgende beslag heeft gelegd, de executie
      over.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel479q
  - number: '480.1'
    text: |-
      Indien er geen andere schuldeiser is, die op de goederen of de opbrengst van de executie beslag heeft gelegd,
      en evenmin een beperkt gerechtigde bekend is wiens recht door de executie is vervallen, keert de deurwaarder de
      netto-opbrengst aan de executant tot het beloop van diens vordering uit. Een eventueel overschot wordt aan de
      geëxecuteerde afgedragen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel480
  - number: '480.2'
    text: |-
      In geval er wel schuldeisers of beperkt gerechtigden zijn, als in het eerste lid bedoeld, stort de deurwaarder de
      netto-opbrengst onverwijld bij een bewaarder als bedoeld in [artikel 445][ref1]. Indien de voormelde schuldeisers
      en beperkt gerechtigden alsmede de geëxecuteerde en de executant, tot overeenstemming omtrent de verdeling van de
      netto-opbrengst komen, keert de deurwaarder of in zijn opdracht de bewaarder aan ieder het hem toekomende uit.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel445
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel480
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '445'
        afdeling: Eerste
  - number: '480.3'
    text: |-
      Voor zover de verplichtingen welke krachtens dit artikel op de deurwaarder rusten, niet worden nageleefd, is
      de Staat jegens belanghebbenden voor de daaruit voor hen voortvloeiende schade met de deurwaarder hoofdelijk
      aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel480
  - number: '481.1'
    text: |-
      Is na de inning van de opbrengst van de executie geen overeenstemming als bedoeld in het tweede lid van het
      vorige artikel tot stand gekomen, dan kan de meest gerede partij aan de voorzieningenrechter van de rechtbank
      binnen welker rechtsgebied de executie in hoofdzaak heeft plaats gehad, de benoeming van een rechter-commissaris
      verzoeken, te wiens overstaan de verdeling zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel481
  - number: '481.2'
    text: |-
      Bij het verzoekschrift is gevoegd een staat van alle in [artikel 480][ref1] bedoelde belanghebbenden met vermelding
      van hun woonplaatsen, op te maken door de deurwaarder.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel480
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel481
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '480'
        afdeling: Derde
  - number: '481.3'
    text: Tegen een benoeming krachtens het eerste lid is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel481
  - number: '482.1'
    text: |-
      De griffier doet onverwijld aan de voormelde belanghebbenden bij gewone brief mededeling van de benoeming van
      de rechter-commissaris, met vermelding van de termijn waarbinnen de in het tweede lid bedoelde aanmelding van de
      vorderingen moet plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel482
  - number: '482.2'
    text: |-
      De tot voormelde belanghebbenden behorende schuldeisers, onder wie begrepen de voormelde beperkt gerechtigden,
      dienen binnen veertien dagen na de in het eerste lid bedoelde mededeling hun vorderingen schriftelijk, zo veel
      mogelijk met overlegging van bewijsstukken, bij de rechter-commissaris aan te melden teneinde overeenkomstig de
      door hen daarbij aan te geven rang te worden gerangschikt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel482
  - number: '483'
    text: |-
      Na verloop der veertien dagen bij het voorgaande artikel bepaald, zal de rechter-commissaris, naar aanleiding van
      de overgelegde stukken, een staat van verdeling opmaken.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel483
  - number: 483a
    text: |-
      Vorderingen onder een ontbindende voorwaarde worden in de rangschikking begrepen voor het hele bedrag, onverminderd
      de werking van de voorwaarde, wanneer zij vervuld wordt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel483a
  - number: 483b
    text: |-
      Vorderingen onder een opschortende voorwaarde worden in de rangschikking begrepen, hetzij voor hun waarde ten
      tijde van het opmaken van de staat van verdeling, hetzij op verlangen van een der schuldeisers of de geëxecuteerde,
      voorwaardelijk voor het hele bedrag.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel483b
  - number: 483c.1
    text: |-
      Niet opeisbare vorderingen en vorderingen die recht geven op periodieke uitkeringen, worden in de rangschikking
      begrepen voor hun waarde ten tijde van het opmaken van de staat van verdeling.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel483c
  - number: 483c.2
    text: |-
      Bij de berekening wordt uitsluitend gelet op het tijdstip en de wijze van aflossing, het kansgenot, waar dit
      bestaat, en, indien de vordering rentedragend is, op de bedongen rentevoet.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel483c
  - number: 483d
    text: |-
      Vorderingen, waarvan de waarde onbepaald of onzeker is of niet in Nederlands geld uitgedrukt, worden in de
      rangschikking begrepen voor hun geschatte waarde in Nederlands geld ten tijde van het opmaken van de staat van
      verdeling.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel483d
  - number: 483e
    text: |-
      Indien een pand- of hypotheekrecht strekt tot zekerheid van vorderingen die de pand- of hypotheekhouder uit hoofde
      van een bestaande rechtsverhouding zal verkrijgen, kunnen deze in de rangregeling worden begrepen, hetzij voor het
      gehele op het tijdstip van het opmaken van de staat reeds verschuldigde bedrag, hetzij, op verlangen van de pand-
      of hypotheekhouder, voorwaardelijk voor het hele bedrag waarvoor het pand- of hypotheekrecht tot zekerheid strekt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel483e
  - number: 483f
    text: |-
      Vorderingen die betwist worden, kunnen door de rechter-commissaris voorwaardelijk worden opgenomen tot een door hem
      te bepalen bedrag. Wanneer de voorrang betwist wordt, kan deze door de rechter-commissaris voorwaardelijk worden
      erkend.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel483f
  - number: '484.1'
    text: |-
      De staat wordt door de rechter-commissaris ter griffie nedergelegd en van deze nederlegging wordt onverwijld
      door de griffier aan alle bovengenoemde belanghebbenden bij gewone brief kennis gegeven met vermelding van dag
      en uur, waarop alle partijen zich bij de rechter-commissaris zullen kunnen vervoegen tot het voorstellen hunner
      tegenspraak.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel484
  - number: '484.2'
    text: Indien de geëxecuteerde niet tevens de schuldenaar is, geschiedt de kennisgeving mede aan deze laatste.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel484
  - number: '485.1'
    text: |-
      Ingeval er geen tegenspraak gedaan wordt, zal de rechter-commissaris zijn proces-verbaal sluiten, en bij
      bevelschrift de houder van de netto-opbrengst gelasten daaruit de nog niet eerder voldane kosten te voldoen en
      aan de schuldeisers en de geëxecuteerde uit te betalen hetgeen hun, volgens de staat, toekomt. Het bedrag waarvoor
      een vordering of een daaraan verbonden voorrang voorwaardelijk is opgenomen of erkend, wordt gereserveerd tot de
      vordering of de voorrang vaststaat.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel485
  - number: '485.2'
    text: De bevelschriften worden in executoriale vorm uitgegeven.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel485
  - number: 485a.1
    text: De tegenspraak wordt gericht tot de rechter-commissaris en op diens proces-verbaal aangetekend.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel485a
  - number: 485a.2
    text: |-
      Heeft een schuldeiser als bedoeld in [artikel 482, tweede lid][ref1], de daar bedoelde termijn niet in acht genomen
      of niet op de in [artikel 484][ref2] bedoelde dag tegenspraak gedaan, dan zal hij slechts in zijn tegenspraak
      kunnen worden ontvangen, indien hij daarbij een redelijk belang heeft en hij de daardoor veroorzaakte kosten en
      schade voor zijn rekening neemt en deze tot een door de rechter-commissaris voorlopig te begroten bedrag onverwijld
      stort bij de bewaarder van de opbrengst.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel482
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel484
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel485a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '482'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '484'
        afdeling: Derde
  - number: '486.1'
    text: |-
      In geval van tegenspraak verwijst de rechter-commissaris de partijen, zo hij ze niet kan verenigen, en voor zover
      het geschil niet reeds aanhangig is, naar een door hem te bepalen terechtzitting van de rechtbank, zonder dat
      daartoe een dagvaarding is vereist.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel486
  - number: '486.2'
    text: De procureurs, die voor partijen optreden, verklaren dit bij het uitroepen ter terechtzitting.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel486
  - number: '486.3'
    text: |-
      Verschijnt de schuldeiser, wiens vordering is tegengesproken, op de bepaalde terechtzitting niet, dan wordt hij
      geacht de aanmelding van zijn vordering te hebben ingetrokken; verschijnt hij die de tegenspraak doet niet, dan
      wordt hij geacht zijn tegenspraak te hebben laten varen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel486
  - number: '486.4'
    text: Belanghebbenden die geen tegenspraak hebben gedaan, kunnen in het geding niet tussenkomen of zich voegen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel486
  - number: '489'
    text: |-
      Nadat op het geschil bij in kracht van gewijsde gegane uitspraak is beslist of het geschil krachtens
      [artikel 486, derde lid][ref1], is geëindigd, legt de meest gerede partij de uitspraak of een uittreksel uit het
      audiëntieblad waaruit van het niet verschijnen blijkt, aan de rechter-commissaris over. Deze sluit zijn proces-
      verbaal en beveelt de uitgifte van bevelschriften tot betaling overeenkomstig [artikel 485][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel486
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel485
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel489
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '486'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '485'
        afdeling: Derde
  - number: '490'
    text: |-
      Na het sluiten van het proces-verbaal van verdeling kan geen tegenspraak meer worden gedaan, hebben de
      belanghebbenden onderling geen recht meer op rente over hetgeen aan hen is toegedeeld, en kan geen beslag op de
      opbrengst van de executie meer worden gelegd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel490
  - number: 490a
    text: |-
      Het bedrag, uitgetrokken voor een voorwaardelijk opgenomen vordering of een voorwaardelijk erkende voorrang,
      wordt, zodra blijkt dat de schuldeiser niets of minder te vorderen heeft dan wel geen of een lagere voorrang heeft,
      overeenkomstig de opgemaakte staat onder de schuldeisers verdeeld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel490a
  - number: 490b.1
    text: |-
      Indien een pandhouder krachtens zijn pandrecht heeft geëxecuteerd en er beperkt gerechtigden of beslagleggers zijn
      als bedoeld in de [derde volzin van artikel 253 van Boek 3 van het Burgerlijk Wetboek](onbekend), wordt het daar
      bedoelde overschot dat van de netto-opbrengst na afhouding van het aan de pandhouder krachtens zijn rang toekomende
      is overgebleven, aan hen uitgekeerd overeenkomstig hetgeen zij en de pandgever omtrent de verdeling daarvan zijn
      overeengekomen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel490b
  - number: 490b.2
    text: |-
      Is op het tijdstip dat de pandhouder tot uitkering kan overgaan, nog geen overeenstemming omtrent de verdeling
      bereikt, dan stort de pandhouder de opbrengst tot tenminste het bedrag van het overschot onverwijld bij een
      bewaarder met overeenkomstige toepassing van [artikel 445][ref1] en kan de meest gerede partij, onder wie de
      pandhouder zelf, een rangregeling verzoeken overeenkomstig de voorgaande artikelen van deze afdeling. Indien de
      pandhouder zelf aan de eisen van [artikel 445][ref2] voldoet, kan hij zichzelf als bewaarder aanwijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel445
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel445
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel490b
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '445'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '445'
        afdeling: Eerste
  - number: 490b.3
    text: |-
      De rangregeling betreft het overeenkomstig het tweede lid in bewaring gegeven bedrag, mits de pandhouder binnen
      de in [artikel 482][ref1] bedoelde termijn aan de rechter-commissaris de stukken ter hand stelt, waaruit van de
      verantwoording van het gestorte bedrag blijkt en binnen de in [artikel 484][ref2] bedoelde termijn geen tegenspraak
      ter zake van het door de pandhouder afgehouden bedrag wordt gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel482
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel484
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel490b
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '482'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '484'
        afdeling: Derde
  - number: 490b.4
    text: |-
      Blijkt na tegenspraak de pandhouder volgens de definitief geworden staat te veel van de netto-opbrengst te hebben
      afgehouden, dan gelast de rechter-commissaris desverlangd bij een in executoriale vorm afgegeven bevelschrift, dat
      door ieder bij genoemde staat batig gerangschikte kan worden geëxecuteerd, de pandhouder het tekort tegen kwijting
      aan de in het tweede lid bedoelde bewaarder uit te keren.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel490b
  - number: 490b.5
    text: |-
      Heeft de pandhouder overeenkomstig [artikel 482][ref1] rangschikking van zijn vordering gevorderd of blijkt hij
      na tegenspraak overeenkomstig het vorige lid te veel te hebben afgehouden, dan draagt hij in de kosten van de
      rangregeling bij. In andere gevallen worden de kosten van de in de rangregeling betrokken pandhouder hem vergoed
      door degenen die zijn verantwoording betwist hebben. Desverlangd geeft de rechter-commissaris een desbetreffend
      bevelschrift in executoriale vorm uit.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel482
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel490b
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '482'
        afdeling: Derde
  - number: 490b.6
    text: |-
      Indien belanghebbenden voor het tot stand komen van een rangregeling alsnog over de verdeling overeenstemming
      bereiken en daarvan uit een onderhandse of authentieke akte doen blijken, keert de bewaarder ieder het hem volgens
      deze akte toekomende uit.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel490b
  - number: 490c.1
    text: |-
      Een executant die betaling heeft ontvangen, is verplicht desverlangd aan hem wiens goed is verkocht en aan de
      schuldenaar binnen één maand na de betaling rekening en verantwoording te doen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel490c
  - number: 490c.2
    text: |-
      Een schuldeiser die in de rangregeling is begrepen, kan binnen één maand na de sluiting daarvan een gelijke
      rekening en verantwoording vragen, indien hij daarbij een rechtstreeks belang heeft.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel490c
  - number: 490d
    text: Beschikkingen van de rechter-commissaris krachtens de onderhavige afdeling zijn niet vatbaar voor hoger beroep.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel490d
  - number: '491.1'
    text: |-
      De executie tot afgifte van een roerende zaak die geen registergoed is, vangt aan met een bevel als bedoeld in
      [artikel 439][ref1], dat van overeenkomstige toepassing is, behoudens dat de in het eerste lid van dat artikel
      bedoelde termijn niet behoeft te worden in acht genomen ter zake van de executie van vonnissen en beschikkingen,
      die uitvoerbaar bij voorraad zijn verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel439
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel491
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '439'
        afdeling: Eerste
  - number: '491.2'
    text: |-
      De executie geschiedt doordat de deurwaarder de zaak onder zich neemt en afgeeft aan degene die haar krachtens de
      executoriale titel moet ontvangen. Hij maakt van een en ander onverwijld proces-verbaal op.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel491
  - number: '491.3'
    text: |-
      De [artikelen 440][ref1] en [443-444b][ref2] zijn van overeenkomstige toepassing met dien verstande dat voor de
      toepassing van [artikel 444b][ref3] de waarde van de zaak in de plaats treedt van het bedrag van de vordering
      waarvoor beslag is gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel440
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel443
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel444b
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel491
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '440'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '443'
        afdeling: Eerste
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 444b
        afdeling: Eerste
  - number: '492.1'
    text: |-
      Ter inleiding van de toepassing van [artikel 491][ref1] kan de deurwaarder op de zaak beslag tot verkrijging van
      afgifte leggen. De in [artikel 439, eerste lid][ref2], bedoelde termijn behoeft daarbij niet in acht te worden
      genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel491
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel439
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel492
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '491'
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '439'
        afdeling: Eerste
  - number: '492.2'
    text: |-
      Indien de deurwaarder bevindt dat de zaak reeds in beslag is genomen, mist [artikel 491][ref1] toepassing, maar kan
      de deurwaarder daarop overeenkomstig het eerste lid eveneens beslag leggen. Hij is verplicht dit beslag onverwijld
      te betekenen aan de deurwaarder die het reeds liggende beslag heeft gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel491
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel492
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '491'
        afdeling: Vierde
  - number: '492.3'
    text: |-
      De [artikelen 440][ref1], [443-446][ref2], [451][ref3], [453a][ref4] en [455][ref5] zijn van overeenkomstige
      toepassing met inachtneming van de volgende bepalingen van deze afdeling. Voor de toepassing van
      [artikel 444b][ref6] treedt de waarde van de in beslag te nemen zaak in de plaats van het bedrag van de vordering
      waarvoor het beslag is gelegd. De [artikelen 445][ref7] en [446][ref8] worden niet toegepast, zolang de zaak zich
      reeds in gerechtelijke bewaring bevindt. [Artikel 455][ref9] is alleen van toepassing voor zover het recht op
      afgifte mede de daar bedoelde baten betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel440
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel443
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel451
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel453a
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel455
      [ref6]: https://wetten.overheid.nl/BWBR0001827#Artikel444b
      [ref7]: https://wetten.overheid.nl/BWBR0001827#Artikel445
      [ref8]: https://wetten.overheid.nl/BWBR0001827#Artikel446
      [ref9]: https://wetten.overheid.nl/BWBR0001827#Artikel455
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel492
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '440'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '443'
        afdeling: Eerste
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '451'
        afdeling: Eerste
      - id: ref4
        bwb_id: BWBR0001827
        artikel: 453a
        afdeling: Eerste
      - id: ref5
        bwb_id: BWBR0001827
        artikel: '455'
        afdeling: Eerste
      - id: ref6
        bwb_id: BWBR0001827
        artikel: 444b
        afdeling: Eerste
      - id: ref7
        bwb_id: BWBR0001827
        artikel: '445'
        afdeling: Eerste
      - id: ref8
        bwb_id: BWBR0001827
        artikel: '446'
        afdeling: Eerste
