  - number: '713'
    text: |-
      Wordt het beslag gelegd op een recht aan toonder of order, dan worden de in [artikel 474b][ref1] bedoelde baten
      geïnd door de bewaarder van het papier en zijn voorts dat artikel en [artikel 474ba][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel474b
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel474ba
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel713
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 474b
        afdeling: Eerste_A
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 474ba
        afdeling: Eerste_A
  - number: '714'
    text: |-
      De bepalingen van de [artikelen 474b, tweede lid][ref1], [474ba][ref2] en [711, eerste en tweede lid][ref3], zijn
      van overeenkomstige toepassing op het conservatoir beslag tot verhaal van een geldvordering op aandelen op naam en
      effecten op naam die geen aandelen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel474b
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel474ba
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel711
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel714
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 474b
        afdeling: Eerste_A
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 474ba
        afdeling: Eerste_A
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '711'
        afdeling: Tweede
  - number: '715.1'
    text: |-
      Conservatoir beslag op aandelen op naam in een naamloze vennootschap of besloten vennootschap met beperkte
      aansprakelijkheid wordt gelegd op de wijze en met de gevolgen als bepaald in de [artikelen 474c][ref1],
      [474d][ref2], [474e][ref3] en [474f][ref4], met dien verstande dat het verlof van de voorzieningenrechter van de
      rechtbank treedt in de plaats van de executoriale titel.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel474c
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel474d
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel474e
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel474f
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel715
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 474c
        afdeling: Eerste_B
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 474d
        afdeling: Eerste_B
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 474e
        afdeling: Eerste_B
      - id: ref4
        bwb_id: BWBR0001827
        artikel: 474f
        afdeling: Eerste_B
  - number: '715.2'
    text: |-
      Het beslagexploit houdt in waar de hoofdzaak aanhangig is of binnen welke termijn zij blijkens het verlof
      ingesteld moet worden. Is nog geen eis in de hoofdzaak ingesteld, dan is de beslaglegger verplicht binnen acht
      dagen na dit instellen een afschrift van de dagvaarding of, zo de eis op andere wijze is ingesteld, van het stuk
      waarbij dit geschiedde, aan de vennootschap te betekenen. De voorzieningenrechter kan deze termijn op verzoek
      van de beslaglegger verlengen, in dier voege dat de verlenging om haar werking te hebben binnen acht dagen na het
      verstrijken van de termijn schriftelijk aan de vennootschap moet zijn medegedeeld. Tegen de beschikking is geen
      hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel715
  - number: '715.3'
    text: |-
      De termijn, vermeld in [artikel 474g, eerste lid][ref1], eindigt eerst één maand na de dag, waarop de in kracht van
      gewijsde gegane executoriale titel aan de vennootschap is betekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel474g
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel715
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 474g
        afdeling: Eerste_B
  - number: '716'
    text: |-
      Ten aanzien van de baten uit in beslag genomen aandelen op naam voortvloeiende geldt het beslag als een beslag
      onder de vennootschap. Van deze baten doet de vennootschap verklaring aan de rechtbank alvorens deze de beschikking
      bedoeld in [artikel 474g][ref1] geeft. Bij deze beschikking wordt tevens beslist omtrent de deugdelijkheid van
      deze verklaring, en wordt de afgifte van de baten aan de deurwaarder gelast, mits alle kosten aan de zijde van de
      vennootschap ter zake van de deugdelijk bevonden verklaring worden vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel474g
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel716
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 474g
        afdeling: Eerste_B
  - number: '717.1'
    text: |-
      De bepalingen van de [artikelen 715][ref1] en [716][ref2] zijn voor zover mogelijk eveneens van toepassing op
      andere aandelen op naam dan in een naamloze vennootschap of besloten vennootschap met beperkte aansprakelijkheid en
      op effecten op naam die geen aandelen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel715
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel716
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel717
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '715'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '716'
        afdeling: Derde
  - number: '717.2'
    text: |-
      Lidmaatschapsrechten in verenigingen worden als effecten op naam aangemerkt, indien zij voor vervreemding vatbaar
      zijn.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel717
  - number: '718'
    text: |-
      Een schuldeiser kan onder derden conservatoir beslag leggen op de in [artikel 475][ref1] bedoelde goederen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel718
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '475'
        afdeling: Tweede
  - number: '719.1'
    text: |-
      Onverminderd hetgeen voortvloeit uit [artikel 702][ref1], moeten op straffe van nietigheid in het beslagexploit
      worden vermeld het bedrag waarvoor het in [artikel 700][ref2] bedoelde verlof werd verleend, alsmede waar de
      hoofdzaak aanhangig is of binnen welke termijn zij blijkens het verlof ingesteld moet worden.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel702
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel700
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel719
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '702'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '700'
        afdeling: Eerste
  - number: '719.2'
    text: |-
      Bij het beslagexploit wordt aan de derde tevens een afschrift betekend van het verlof van de voorzieningenrechter
      en van het verzoekschrift waarop het is gegeven.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel719
  - number: '720'
    text: |-
      De [artikelen 475a-475i][ref1], [476a][ref2] en [476b][ref3], [479][ref4] en [479a][ref5] zijn van overeenkomstige
      toepassing. In het geval van [artikel 475a, derde lid][ref6], moet de vordering waarop het beslag wordt gelegd
      in het verzoekschrift waarbij verlof van de voorzieningenrechter wordt gevraagd, uitdrukkelijk worden omschreven.
      Verlof tot het leggen van beslag op een vordering tot een in [artikel 475c][ref7] vermelde periodieke betaling kan
      slechts worden verleend, nadat de schuldenaar is gehoord of hij de gelegenheid te worden gehoord, ongebruikt heeft
      laten voorbijgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475a
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel476a
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel476b
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel479
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel479a
      [ref6]: https://wetten.overheid.nl/BWBR0001827#Artikel475a
      [ref7]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel720
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475a
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 476a
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 476b
        afdeling: Tweede
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '479'
        afdeling: Tweede
      - id: ref5
        bwb_id: BWBR0001827
        artikel: 479a
        afdeling: Tweede
      - id: ref6
        bwb_id: BWBR0001827
        artikel: 475a
        afdeling: Tweede
      - id: ref7
        bwb_id: BWBR0001827
        artikel: 475c
        afdeling: Tweede
  - number: '721'
    text: |-
      De beslaglegger is op straffe van nietigheid van het beslag verplicht om, zo de eis in de hoofdzaak na het beslag
      wordt ingesteld, binnen acht dagen na dit instellen een afschrift van de dagvaarding of, zo de eis op andere wijze
      is ingesteld, van het stuk waarbij het is geschied, aan de derde te betekenen. De voorzieningenrechter kan deze
      termijn op verzoek van de beslaglegger verlengen, in dier voege dat de verlenging om haar werking te hebben binnen
      acht dagen na het verstrijken van de termijn schriftelijk aan de derde moet zijn medegedeeld. Tegen de beschikking
      is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel721
  - number: '722'
    text: |-
      De betekening aan de derde, in [het eerste lid van artikel 704][ref1] voorgeschreven, dient te geschieden binnen
      één maand nadat ter zake van de hoofdvordering een executoriale titel is verkregen en deze voor tenuitvoerlegging
      vatbaar is geworden; blijft betekening binnen deze termijn uit, dan zullen de betalingen door de derde gedaan, van
      waarde zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel704
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel722
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '704'
        afdeling: Eerste
  - number: '723'
    text: |-
      De in [artikel 477][ref1] bedoelde verplichting van de derde en de in [477a][ref2] bedoelde bevoegdheden van de
      executant gaan niet in voordat vier weken sedert de in het vorige artikel bedoelde betekening zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel477
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel477a
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel723
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '477'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 477a
        afdeling: Tweede
  - number: '724.1'
    text: |-
      Een schuldeiser kan onder zichzelf beslag leggen op de in [artikel 479h][ref1] bedoelde goederen. Deze goederen
      moeten in het in [artikel 700, tweede lid][ref2], bedoelde verzoekschrift worden omschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel479h
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel700
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel724
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 479h
        afdeling: Tweede_B
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '700'
        afdeling: Eerste
  - number: '724.2'
    text: |-
      De [artikelen 475a, eerste en tweede lid][ref1], en [475b-475h][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475a
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475b
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel724
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475a
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475b
        afdeling: Tweede
  - number: '724.3'
    text: |-
      De termijn van [artikel 479j, eerste lid][ref1], begint te lopen vanaf de dag dat de schuldeiser een executoriale
      titel heeft verkregen en deze voor tenuitvoerlegging vatbaar is geworden en aan de schuldenaar is betekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel479j
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel724
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 479j
        afdeling: Tweede_B
  - number: '725'
    text: |-
      Indien is voldaan aan de eisen die in [artikel 711, eerste en tweede lid][ref1], voor het verlof worden gesteld,
      kan ook verlof verleend worden om beslag te leggen op een of meer bepaald aan te wijzen onroerende zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel711
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel725
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '711'
        afdeling: Tweede
  - number: '726.1'
    text: |-
      De [artikelen 504a, eerste lid][ref1], [505][ref2], [506][ref3], [507a][ref4] en [513a][ref5] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel504a
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel505
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel506
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel507a
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel513a
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel726
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 504a
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '505'
        afdeling: Eerste
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '506'
        afdeling: Eerste
      - id: ref4
        bwb_id: BWBR0001827
        artikel: 507a
        afdeling: Eerste
      - id: ref5
        bwb_id: BWBR0001827
        artikel: 513a
        afdeling: Eerste
  - number: '726.2'
    text: |-
      De termijn van [artikel 508][ref1] begint te lopen vanaf de dag dat de schuldeiser een executoriale titel heeft
      verkregen en deze voor tenuitvoerlegging vatbaar is geworden en aan de schuldenaar is betekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel508
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel726
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '508'
        afdeling: Eerste
  - number: '727'
    text: |-
      Indien de eis in de hoofdzaak niet binnen de overeenkomstig [artikel 700, derde lid][ref1], bepaalde termijn is
      ingesteld, is de beslaglegger verplicht de inschrijving van het beslag in de openbare registers onverwijld te doen
      doorhalen op straffe van schadevergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel700
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel727
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '700'
        afdeling: Eerste
  - number: '728.1'
    text: |-
      Tot het geven van verlof tot het leggen van conservatoir beslag op schepen is mede bevoegd de voorzieningenrechter
      van de rechtbank binnen welker rechtsgebied het schip wordt verwacht. [Artikel 711, eerste lid][ref1], is niet van
      toepassing. [Artikel 712][ref2] is evenmin van toepassing, tenzij het beslag is gelegd op een schip als bedoeld
      in [artikel 576][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel711
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel712
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel576
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel728
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '711'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '712'
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '576'
        afdeling: Eerste
  - number: '728.2'
    text: |-
      In het proces-verbaal van inbeslagneming kan woonplaats worden gekozen ten kantore van de deurwaarder in plaats van
      bij een notaris. Tevens kan woonplaats worden gekozen in Nederland ten kantore van een advocaat.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel728
  - number: 728a.1
    text: |-
      [Artikel 708, tweede lid][ref1], is niet van toepassing. De [artikelen 566][ref2], [567][ref3] en [513a][ref4] zijn
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel708
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel566
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel567
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel513a
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel728a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '708'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '566'
        afdeling: Eerste
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '567'
        afdeling: Eerste
      - id: ref4
        bwb_id: BWBR0001827
        artikel: 513a
        afdeling: Eerste
  - number: 728a.2
    text: |-
      De termijn van [artikel 508][ref1], in verbinding met [artikel 568][ref2], begint te lopen vanaf de dag dat
      de schuldeiser een executoriale titel heeft verkregen en deze voor tenuitvoerlegging vatbaar is geworden en is
      betekend aan de schuldenaar jegens wie deze titel luidt.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel508
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel568
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel728a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '508'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '568'
        afdeling: Eerste
  - number: 728b
    text: |-
      Indien het beslag is gelegd op een schip dat teboekstaat in het in [artikel 193 van Boek 8](onbekend) of [artikel
      783 van Boek 8 van het Burgerlijk Wetboek](onbekend) genoemd register en de eis in de hoofdzaak niet binnen de
      overeenkomstig [artikel 700, derde lid][ref1], bepaalde termijn is ingesteld, is de beslaglegger verplicht de
      inschrijving van het beslag in de openbare registers onverwijld te doen doorhalen op straffe van schadevergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel700
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel728b
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '700'
        afdeling: Eerste
  - number: '729.1'
    text: |-
      Deze afdeling geldt uitsluitend voor in het in [artikel 1302 van Boek 8 van het Burgerlijk Wetboek](onbekend)
      bedoelde register teboekstaande luchtvaartuigen en voor luchtvaartuigen van de nationaliteit van een vreemde
      staat, ten aanzien van welke het op 29 mei 1933 te Rome gesloten verdrag tot het vaststellen van enige eenvormige
      bepalingen inzake conservatoir beslag op luchtvaartuigen van kracht is.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel729
  - number: '729.2'
    text: |-
      De in [artikel 1300 van Boek 8 van het Burgerlijk Wetboek](onbekend) opgenomen begripsomschrijvingen gelden ook
      voor de onderhavige afdeling.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel729
  - number: 729a.1
    text: 'Voor beslag zijn niet vatbaar:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel729a
  - number: 729a.1.a
    text: |-
      luchtvaartuigen, welke bij uitsluiting zijn bestemd voor den dienst van een vreemde Staat, postvervoer daaronder
      begrepen, doch met uitsluiting van handelsvervoer;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel729a
  - number: 729a.1.b
    text: |-
      luchtvaartuigen, welke daadwerkelijk in dienst zijn gesteld op een geregelde luchtlijn van openbaar vervoer en de
      daarvoor onontbeerlijke reserveluchtvaartuigen;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel729a
  - number: 729a.1.c
    text: |-
      elk ander luchtvaartuig, dat dient voor het vervoer van personen of zaken tegen betaling, wanneer het gereed
      staat voor zulk een vervoer te vertrekken; behalve in geval het beslag wordt gelegd voor een schuld, aangegaan ten
      behoeve van de reis, welke het luchtvaartuig op het punt staat te ondernemen of voor een vordering, welke tijdens
      de reis is ontstaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel729a
  - number: 729a.2
    text: |-
      Het bepaalde in het vorige lid is niet van toepassing ten aanzien van beslag, hetwelk wordt gelegd ter zake van
      terugvordering van een ontvreemd luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel729a
  - number: 729b.1
    text: |-
      Onverminderd het bepaalde in [artikel 729a][ref1] mag geen beslag op een luchtvaartuig worden gelegd, indien ter
      voorkoming daarvan voldoende zekerheid is gesteld. Onmiddellijke opheffing van gelegd beslag zal worden gelast,
      wanneer voldoende zekerheid wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel729a
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel729b
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 729a
        afdeling: Zesde_B
  - number: 729b.2
    text: |-
      De zekerheid is voldoende, indien zij het bedrag van de schuldvordering en de kosten dekt en uitsluitend is bestemd
      voor de betaling van den schuldeischer, of indien zij de waarde van het luchtvaartuig dekt, ingeval deze geringer
      is dan het bedrag van de schuld en de kosten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel729b
  - number: 729b.3
    text: |-
      Wanneer bij het aanbieden van zekerheid ter voorkoming van beslag geschil ontstaat over het bedrag of den aard der
      te stellen zekerheid, beslist de voorzieningenrechter van de rechtbank, binnen welker gebied het luchtvaartuig zich
      bevindt, op verzoek van de meest gerede partij, na verhoor of behoorlijke oproeping.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel729b
  - number: 729c.1
    text: |-
      Wanneer in strijd met de overige artikelen van deze afdeling of zonder goede grond beslag op een luchtvaartuig is
      gelegd, is de beslaglegger gehouden de daardoor ontstane schade te vergoeden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel729c
  - number: 729c.2
    text: |-
      Het eerste lid is mede van toepassing, wanneer de schuldenaar zekerheid heeft moeten stellen om een beslag te
      voorkomen dat, ware het gelegd, in strijd met de vorige artikelen of zonder goede grond zijn geweest.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel729c
  - number: 729d.1
    text: |-
      Tot het geven van verlof tot het leggen van conservatoir beslag op luchtvaartuigen is mede bevoegd de
      voorzieningenrechter van de rechtbank binnen welker rechtsgebied het luchtvaartuig wordt verwacht. De
      [artikelen 711, eerste lid][ref1], en [712][ref2] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel711
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel712
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel729d
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '711'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '712'
        afdeling: Tweede
  - number: 729d.2
    text: |-
      [Artikel 708, tweede lid, tweede zin][ref1], is niet van toepassing. De [artikelen 584c-584e][ref2] en [513a][ref3]
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel708
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel584c
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel513a
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel729d
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '708'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 584c
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 513a
        afdeling: Eerste
  - number: 729d.3
    text: |-
      Indien het beslag is gelegd op een in het register teboekstaand luchtvaartuig en de eis in de hoofdzaak niet binnen
      de overeenkomstig [artikel 700, derde lid][ref1], bepaalde termijn is ingesteld, is de beslaglegger verplicht de
      inschrijving van het beslag in de openbare registers onverwijld te doen doorhalen op straffe van schadevergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel700
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel729d
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '700'
        afdeling: Eerste
  - number: 729e
    text: |-
      Indien terzake van de hoofdvordering een executoriale titel is verkregen en deze voor tenuitvoerlegging vatbaar is
      geworden, gaat de beslaglegger tot executie over overeenkomstig [artikel 584f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel584f
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel729e
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 584f
        afdeling: Tweede
  - number: '730'
    text: |-
      Ieder die recht heeft op afgifte van een roerende zaak of levering van een goed of die zodanig recht door een
      rechterlijke uitspraak tot vernietiging of ontbinding kan verkrijgen, kan deze zaak of dit goed ter bewaring van
      dit recht in beslag nemen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel730
  - number: '731'
    text: |-
      Betreft het recht op afgifte een of meer naar de soort bepaalde zaken, dan zal de deurwaarder een aan dat recht
      beantwoordende hoeveelheid zaken van die soort in beslag nemen, uit te kiezen door de deurwaarder, tenzij de
      beslagene tijdig een redelijke andere keuze doet.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel731
  - number: '732'
    text: |-
      Betreft het recht op afgifte te velde staande vruchten of beplantingen van een onroerende zaak, dan kan uit dien
      hoofde beslag worden gelegd overeenkomstig [artikel 494][ref1]. In dat geval worden de in [artikel 451][ref2] aan
      de kantonrechter toegekende bevoegdheden uitgeoefend door de voorzieningenrechter van de rechtbank, indien dit bij
      het in [artikel 700, tweede lid][ref3], bedoelde verzoekschrift wordt verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel494
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel451
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel700
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel732
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '494'
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '451'
        afdeling: Eerste
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '700'
        afdeling: Eerste
  - number: '733.1'
    text: |-
      Hij die verdeling van een gemeenschap kan vorderen, kan de daartoe behorende goederen in beslag nemen, voor zover
      zij in het bijzonder in aanmerking komen om aan hem of aan de deelgenoot voor wiens aandeel hij optreedt, te worden
      toegedeeld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel733
  - number: '733.2'
    text: Het beslag vervalt, naarmate de goederen aan een ander worden toegedeeld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel733
  - number: '734.1'
    text: |-
      Op een beslag als bedoeld in deze afdeling zijn de voorschriften betreffende conservatoir beslag tot verhaal van
      geldvorderingen van overeenkomstige toepassing, behoudens voor zover dit zou leiden tot toepasselijkheid van de
      [artikelen 447][ref1], [448][ref2] en [505, derde lid][ref3], en [541][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel447
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel448
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel505
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel541
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel734
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '447'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '448'
        afdeling: Eerste
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '505'
        afdeling: Eerste
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '541'
        afdeling: Derde
  - number: '734.2'
    text: |-
      In geval van overeenkomstige toepassing van [artikel 444b][ref1] treedt de waarde van het in beslag te nemen goed
      in de plaats van het bedrag van de vordering waarvoor beslag is gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel444b
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel734
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 444b
        afdeling: Eerste
  - number: '734.3'
    text: |-
      [Artikel 474b][ref1] is slechts van overeenkomstige toepassing ingeval uit hoofde van het recht waarvoor het beslag
      is gelegd, tevens recht op de in dat artikel bedoelde baten bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel474b
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel734
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 474b
        afdeling: Eerste_A
  - number: '734.4'
    text: |-
      In het in [artikel 700, tweede lid][ref1], bedoelde verzoekschrift wordt het in beslag te nemen goed omschreven.
      Vrees voor verduistering behoeft niet te worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel700
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel734
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '700'
        afdeling: Eerste
  - number: '735.1'
    text: |-
      Een beslag als bedoeld in de voorgaande artikelen, gelegd ter verkrijging van levering van een goed, blijft van
      kracht totdat hetzij de levering heeft plaatsgevonden, hetzij zes maanden zijn verstreken, nadat in de hoofdzaak
      een beslissing is verkregen die een executoriale titel oplevert en die in kracht van gewijsde is gegaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel735
  - number: '735.2'
    text: |-
      Een beslag als bedoeld in de voorgaande artikelen van deze afdeling op een roerende zaak die geen registergoed is,
      gaat krachtens [artikel 704, eerste lid][ref1], over in een executoriaal beslag als bedoeld in [artikel 492][ref2],
      indien de door de beslaglegger verkregen executoriale titel tot afgifte strekt.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel704
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel492
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel735
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '704'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '492'
        afdeling: Vierde
  - number: '736.1'
    text: |-
      Bij samenloop van een beslag als bedoeld in de onderhavige afdeling met een ander beslag, al of niet van dezelfde
      aard, kan de meest gerede partij zich tot de rechter wenden, al naar de aard van het andere beslag overeenkomstig
      [artikel 438][ref1] of overeenkomstig [artikel 705][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel438
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel705
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel736
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '438'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '705'
        afdeling: Eerste
  - number: '736.2'
    text: |-
      Wordt op een goed zowel beslag gelegd als bedoeld in de voorgaande artikelen van de onderhavige afdeling als tot
      verhaal van een geldvordering, dan geldt eerstgenoemd beslag zo nodig tevens als een conservatoir beslag, gelegd
      tot verhaal van de vordering tot vervangende schadevergoeding wegens uitblijven van afgifte of levering.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel736
  - number: '736.3'
    text: |-
      Een beslag tot verhaal van een vordering tot vervangende schadevergoeding wegens het uitblijven van afgifte of
      levering kan niet tegen de legger van een beslag tot verkrijging van afgifte of levering van dezelfde zaak of
      hetzelfde goed worden ingeroepen, indien deze andere goederen van de beslagene aanwijst die voor de vordering
      voldoende verhaal bieden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel736
  - number: '737.1'
    text: |-
      Een beslag als bedoeld in deze afdeling kan mede worden gelegd door een schuldeiser die door een rechterlijke
      uitspraak tot vernietiging op grond van [artikel 45 van Boek 3 van het Burgerlijk Wetboek][ref1] de bevoegdheid kan
      verkrijgen zich op het goed te verhalen.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel45
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel737
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '45'
  - number: '737.2'
    text: |-
      Is de vernietiging uitgesproken, dan gaat het beslag over in een conservatoir beslag op het goed tot verhaal
      van zijn vordering of, als te dier zake is voldaan aan de eisen van [artikel 704, eerste lid][ref1], in een
      overeenkomstig executoriaal beslag.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel704
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel737
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '704'
        afdeling: Eerste
  - number: '765'
    text: |-
      Indien de schuldenaar geen bekende woonplaats in Nederland heeft, kan in Nederland overeenkomstig de voorgaande
      afdelingen van deze titel beslag worden gelegd, zonder dat vrees voor verduistering behoeft te worden aangetoond.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel765
  - number: '766'
    text: |-
      De beslaglegger is van rechtswege bewaarder van de in beslag genomen zaken, in geval deze zich onder hem bevinden;
      zo niet, dan kan daarover naar de regels betreffende executoriaal beslag een gerechtelijke bewaarder worden
      aangesteld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel766
  - number: '767'
    text: |-
      Bij gebreke van een andere weg om een executoriale titel in Nederland te verkrijgen kan de eis in de hoofdzaak,
      de vordering ter zake van de beslagkosten daaronder begrepen, worden ingesteld voor de rechtbank waarvan de
      voorzieningenrechter het verlof tot het gelegde of het tegen zekerheidstelling voorkomen of opgeheven beslag heeft
      verleend. In geval van verlof tot beslag onder een derde geldt dit alleen indien het goed waarop beslag zal worden
      gelegd in het verzoekschrift uitdrukkelijk is omschreven.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel767
  - number: '768.1'
    text: |-
      Indien echtgenoten of gewezen echtgenoten dan wel geregistreerde partners of vroegere geregistreerde partners
      gehuwd onderscheidenlijk als partners geregistreerd zijn of waren in een gemeenschap van goederen, kan ieder van
      hen de voorzieningenrechter van de rechtbank verzoeken hem verlof te verlenen tot verzegeling, boedelbeschrijving
      en waardering van goederen der gemeenschap alsmede tot het leggen van conservatoir beslag op goederen der
      gemeenschap.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel768
  - number: '768.2'
    text: |-
      Indien nog geen verzoek tot opheffing van de gemeenschap, tot echtscheiding, tot scheiding van tafel en
      bed of tot ontbinding van het geregistreerd partnerschap is gedaan, is de in [artikel 700][ref1] aangewezen
      voorzieningenrechter bevoegd. Is een zodanig verzoek reeds gedaan, dan is bevoegd de voorzieningenrechter van de
      rechtbank waarbij dat verzoek aanhangig is of laatstelijk was.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel700
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel768
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '700'
        afdeling: Eerste
  - number: '768.3'
    text: |-
      Tot het leggen van conservatoir beslag verleent de voorzieningenrechter slechts verlof indien de verzoeker aantoont
      dat er gegronde vrees voor verduistering van de goederen der gemeenschap bestaat.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel768
  - number: '768.4'
    text: Tegen een verlof als bedoeld in het eerste lid is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel768
  - number: '769.1'
    text: |-
      Op het beslag zijn de bepalingen betreffende conservatoir beslag tot verhaal van een geldvordering van
      overeenkomstige toepassing met dien verstande dat geen vermelding van een bedrag wordt vereist en dat als hoofdzaak
      geldt het verzoek tot opheffing van de gemeenschap respectievelijk tot echtscheiding, tot scheiding van tafel
      en bed of tot ontbinding van het geregistreerd partnerschap, alles behoudens voor zover daarvan in de volgende
      artikelen niet wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel769
  - number: '769.2'
    text: |-
      Voor de overeenkomstige toepassing van [artikel 444b][ref1] treedt de waarde van het in beslag te nemen goed in de
      plaats van het bedrag van de vordering waarvoor het beslag wordt gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel444b
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel769
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 444b
        afdeling: Eerste
  - number: '770.1'
    text: |-
      Indien het beslag is gelegd onder een derde, is deze verplicht verklaring te doen van de vorderingen en zaken die
      door het beslag zijn getroffen. De [artikelen 475-477][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel770
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '475'
        afdeling: Tweede
  - number: '770.2'
    text: |-
      De derde voldoet op verlangen van de deurwaarder aan zijn verplichtingen tot voldoening, afgifte of
      terbeschikkingstelling van de uit te keren gelden, zaken of goederen, naar gelang dit voor de afwikkeling van de
      verdeling van de gemeenschap nodig is.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel770
  - number: 770a
    text: |-
      In geval van een beslag op een onroerende zaak is [artikel 505, derde lid][ref1], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel505
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel770a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '505'
        afdeling: Eerste
  - number: 770b.1
    text: |-
      Bij toewijzing van het verzoek tot opheffing van de gemeenschap respectievelijk tot echtscheiding, tot scheiding
      van tafel en bed of tot ontbinding van het geregistreerd partnerschap, vervalt het beslag zodra de goederen aan
      de andere echtgenoot of geregistreerde partner worden toegedeeld of krachtens de verdeling aan de beslaglegger
      geleverd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel770b
  - number: 770b.2
    text: Het beslag vervalt eveneens zodra een verzoek als bedoeld in lid 1 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel770b
  - number: 770b.3
    text: |-
      De [artikelen 704, eerste lid][ref1], [715, derde lid][ref2], [722][ref3], [723][ref4] en [724, derde lid][ref5],
      zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel704
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel715
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel722
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel723
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel724
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel770b
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '704'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '715'
        afdeling: Derde
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '722'
        afdeling: Vierde
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '723'
        afdeling: Vierde
      - id: ref5
        bwb_id: BWBR0001827
        artikel: '724'
        afdeling: Vijfde
  - number: 770c
    text: |-
      Een eventueel overschot van een executie wordt door de deurwaarder, notaris of pandhouder onverwijld gestort bij
      een bewaarder als bedoeld in [artikel 445][ref1] ten behoeve van de echtgenoot of geregistreerde partner aan wie
      dit overschot wordt toegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel445
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel770c
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '445'
        afdeling: Eerste
  - number: '771.1'
    text: |-
      Indien rekening en verantwoording moet worden gedaan aan belanghebbenden die allen of voor een deel onbekend of
      afwezig zijn, dagvaardt de rekenplichtige hen allen tot het opnemen en goedkeuren van de rekening op de wijze als
      vermeld in [artikel 54, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel54
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel771
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '54'
        afdeling: Zesde
  - number: '771.2'
    text: |-
      De bekende belanghebbenden worden bovendien gedagvaard op de wijze als voor ieder van hen is bepaald in de
      [zesde afdeling van de eerste titel van het Eerste Boek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#AfdelingZesde
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel771
    references:
      - id: ref1
        bwb_id: BWBR0001827
        afdeling: Zesde
  - number: '771.3'
    text: De termijn van dagvaarding is ten minste drie maanden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel771
  - number: '772'
    text: |-
      De rekenplichtige deponeert de rekening met de daarbij behorende bescheiden ter griffie, waar deze ter inzage van
      de belanghebbenden ligt. De rekenplichtige vermeldt dit depot in het exploot van dagvaarding.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel772
  - number: '773'
    text: |-
      [Artikel 140, eerste en tweede lid][ref1], is van toepassing, met dien verstande dat de rechter, indien tegen een
      of meer gedaagden verstek is verleend, ambtshalve de rechtmatigheid en de gegrondheid van de vordering onderzoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel140
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel773
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '140'
        afdeling: Zevende
  - number: '774.1'
    text: |-
      Wordt tegen alle belanghebbenden verstek verleend, dan onderzoekt de rechter ambtshalve de rechtmatigheid en de
      gegrondheid van de vordering. Indien dit onderzoek niet leidt tot afwijzing van de vordering, stelt de rechter het
      saldo aan de hand van de overgelegde bescheiden vast en sluit hij de rekening. Tegen dit vonnis staat geen verzet
      open.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel774
  - number: '774.2'
    text: |-
      De rechter geeft zodanige beslissing over de kosten van het geding als hij geraden acht. Een gedaagde tegen wie
      verstek is verleend, wordt niet verwezen in de kosten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel774
  - number: '775'
    text: |-
      De rekenplichtige kan zich van het onder hem berustende saldo bevrijden door storting in de consignatiekas. Deze
      storting kan ook op vordering van belanghebbenden worden bevolen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel775
  - number: '776'
    text: |-
      Wordt tussen de belanghebbenden over de verdeling van een batig saldo geen overeenstemming bereikt, dan kan de
      meest gerede partij rangregeling overeenkomstig de voorschriften van de derde afdeling van de tweede titel van het
      Tweede Boek verzoeken.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel776
  - number: '798.1'
    text: |-
      Voor de toepassing van deze afdeling wordt onder belanghebbende verstaan degene op wiens rechten of verplichtingen
      de zaak rechtstreeks betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel798
  - number: '798.2'
    text: |-
      In zaken van curatele, onderbewindstelling of mentorschap worden onder belanghebbenden bovendien verstaan de
      echtgenoot, de geregistreerde partner of andere levensgezel en de kinderen of, bij gebreke van dezen, de ouders,
      broers en zusters van degene wiens curatele, goederen of mentorschap het betreft.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel798
  - number: '799.1'
    text: |-
      Onverminderd het bepaalde in [artikel 278, eerste lid][ref1], bevat een verzoekschrift de namen en, voor zover
      bekend, de voornamen en de woonplaats van de belanghebbenden, alsmede van anderen wier verklaring in verband met de
      beoordeling van het verzoek van betekenis kan zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel278
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel799
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '278'
        afdeling: Vierde
  - number: '799.2'
    text: |-
      Bij de indiening van het verzoekschrift ter griffie worden, voor zover nodig, overgelegd de bescheiden die kunnen
      dienen tot bewijs van de gestelde feiten. Eveneens worden de nodige afschriften van het verzoekschrift en de
      bescheiden overgelegd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel799
  - number: '800.1'
    text: |-
      Tenzij de rechter aanstonds een beschikking geeft waarbij hij zich onbevoegd verklaart of het verzoek toewijst,
      wordt aan de belanghebbenden, voorzover hun woonplaats bekend is, een afschrift van het verzoekschrift en van
      de daarbij behorende bescheiden toegezonden en worden de belanghebbenden opgeroepen voor de behandeling. Is de
      woonplaats niet bekend, dan wordt bij de oproeping het verzoek kort aangeduid.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel800
  - number: '800.2'
    text: |-
      Voorts kan de rechter bevelen dat degenen wier verklaring in verband met de beoordeling van het verzoek van
      betekenis kan zijn, worden opgeroepen om ter terechtzitting te verschijnen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel800
  - number: '800.3'
    text: |-
      De beschikkingen tot voorlopige ondertoezichtstelling van een minderjarige en tot machtiging van de gezinsvoogdij-
      instelling om een minderjarige uit huis te plaatsen alsmede een beschikking met betrekking tot de voorlopige
      voogdij kunnen alleen dan aanstonds worden gegeven, indien de behandeling niet kan worden afgewacht zonder
      onmiddellijk en ernstig gevaar voor de minderjarige. Deze beschikkingen verliezen haar kracht na verloop van twee
      weken, tenzij de belanghebbenden binnen deze termijn in de gelegenheid zijn gesteld hun mening kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel800
  - number: '801.1'
    text: |-
      In zaken van levensonderhoud wordt in de oproeping van de belanghebbenden een termijn vermeld waarbinnen dezen
      een verweerschrift kunnen indienen. Indien binnen die termijn geen verweerschrift wordt ingediend, kan, tenzij
      [artikel 809][ref1] toepassing vindt, een behandeling ter terechtzitting achterwege blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel809
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel801
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '809'
        afdeling: Eerste
  - number: '801.2'
    text: |-
      De oproeping van de belanghebbende gaat in deze zaken vergezeld van de mededeling dat de rechter kan bepalen dat de
      behandeling achterwege kan blijven indien binnen de voor het indienen van een verweerschrift vastgestelde termijn
      geen verweerschrift wordt ingediend, alsmede van de mededeling dat de indiening slechts kan geschieden door een
      procureur.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel801
  - number: '802'
    text: |-
      Indien een verzoeker, een belanghebbende, of een ander wiens verklaring in verband met de beoordeling van het
      verzoek van betekenis kan zijn en die moet worden ondervraagd, in Nederland verblijft, doch buiten staat is zich
      naar het gerechtsgebouw te begeven, kan de ondervraging op diens verblijfplaats geschieden. Zou de rechter zich
      daartoe buiten zijn rechtsgebied moeten begeven, dan kan hij een rechter binnen wiens rechtsgebied de betrokkene
      verblijft, verzoeken de ondervraging te verrichten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel802
  - number: '803'
    text: De behandeling geschiedt met gesloten deuren.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel803
  - number: '804'
    text: |-
      Na afloop van de behandeling deelt de rechter aan de ter behandeling verschenen personen mede op welke
      terechtzitting de beschikking zal worden uitgesproken.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel804
  - number: '805.1'
    text: |-
      De griffier verstrekt of verzendt onverwijld een afschrift van de beschikking aan de verzoeker, de verschenen
      belanghebbenden en de niet verschenen belanghebbenden aan wie een afschrift van het verzoekschrift is verzonden.
      De griffier verstrekt of verzendt eveneens een afschrift van een beschikking die een minderjarige of de herroeping
      van een adoptie betreft, aan de raad voor de kinderbescherming, tenzij de beschikking het levensonderhoud van de
      minderjarige betreft.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel805
  - number: '805.2'
    text: De griffier vermeldt daarbij de termijn waarbinnen en de wijze waarop hoger beroep kan worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel805
  - number: '806.1'
    text: |-
      In afwijking van het bepaalde in [het tweede lid van artikel 358][ref1] kan van een beschikking hoger beroep worden
      ingesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel358
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel806
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '358'
        afdeling: Vierde
  - number: 806.1.a
    text: |-
      door de verzoeker en degenen aan wie een afschrift van de beschikking is verstrekt of verzonden, binnen drie
      maanden na de dag van de uitspraak;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel806
  - number: 806.1.b
    text: |-
      door andere belanghebbenden binnen drie maanden na de betekening daarvan of nadat de beschikking hun op andere
      wijze bekend is geworden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel806
  - number: '806.2'
    text: |-
      Op de procedure in hoger beroep zijn de [artikelen 799 tot en met 805, eerste lid][ref1], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel799
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel806
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '799'
        afdeling: Eerste
  - number: '807'
    text: Tegen beschikkingen ingevolge
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel807
  - number: 807.a
    text: |-
      de [artikelen 254, vierde lid][ref1], en [255](onbekend), alsmede de [artikelen 259][ref2] en [260][ref3],
      met uitzondering van beschikkingen ingevolge [artikel 263a, tweede lid, van Boek 1 van het Burgerlijk Wetboek]
      (onbekend);.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel254
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel259
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel260
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel807
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '254'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '259'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '260'
  - number: 807.b
    text: '[artikel 278, lid 2 van Boek 1 van het Burgerlijk Wetboek](onbekend);'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel807
  - number: 807.c
    text: |-
      [artikel 253][ref1] of [336](onbekend);


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253s
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel807
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253s
  - number: 807.d
    text: '[artikel 435, tweede lid, van Boek 1 van het Burgerlijk Wetboek](onbekend);'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel807
  - number: 807.e
    text: |-
      [artikel 452, tweede lid, van Boek 1 van het Burgerlijk Wetboek](onbekend) staat geen andere voorziening open dan
      cassatie in het belang der wet.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel807
  - number: '808'
    text: |-
      Zaken betreffende minderjarigen die bij de rechtbank aanhangig worden gemaakt, uitgezonderd die welke het
      levensonderhoud van een minderjarige betreffen, worden behandeld door de kinderrechter. Indien deze de zaak naar de
      meervoudige kamer verwijst, neemt de kinderrechter aan de behandeling deel.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel808
  - number: '809.1'
    text: |-
      In zaken betreffende minderjarigen, uitgezonderd die welke het levensonderhoud van een minderjarige betreffen die
      de leeftijd van zestien jaren nog niet heeft bereikt, beslist de rechter niet dan na de minderjarige van twaalf
      jaren of ouder in de gelegenheid te hebben gesteld hem zijn mening kenbaar te maken, tenzij het naar het oordeel
      van de rechter een zaak van kennelijk ondergeschikt belang betreft. De rechter kan minderjarigen die de leeftijd
      van twaalf jaren nog niet hebben bereikt, in de gelegenheid stellen hem hun mening kenbaar te maken op een door hem
      te bepalen wijze. Hetzelfde geldt in zaken betreffende het levensonderhoud van minderjarigen die de leeftijd van
      zestien jaren nog niet hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel809
  - number: '809.2'
    text: |-
      In zaken betreffende curatele, onderbewindstelling en mentorschap is de eerste volzin van het eerste lid van
      overeenkomstige toepassing ten aanzien van de onder curatele te stellen of gestelde persoon, ten aanzien van degene
      wiens goederen het betreft alsmede ten aanzien van de persoon ten behoeve van wie mentorschap is verzocht of is
      ingesteld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel809
  - number: '809.3'
    text: |-
      Indien de gelegenheid waarop de minderjarige zijn mening kenbaar kan maken niet kan worden afgewacht
      zonder onmiddellijk en ernstig gevaar voor de minderjarige, kan de rechter de beschikkingen tot voorlopige
      ondertoezichtstelling van een minderjarige en tot machtiging van de gezinsvoogdij-instelling om een minderjarige
      uit huis te plaatsen alsmede een beschikking met betrekking tot de voorlopige voogdij geven zonder toepassing van
      het eerste lid. Deze beschikkingen verliezen haar kracht na verloop van twee weken, tenzij de minderjarige binnen
      deze termijn in de gelegenheid is gesteld zijn mening kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel809
  - number: '809.4'
    text: |-
      Indien de minderjarige van de in het eerste en derde lid bedoelde gelegenheid geen gebruik heeft gemaakt, kan de
      rechter een nadere dag bepalen, waarop hij voor hem gebracht zal worden. Verschijnt de minderjarige alsdan wederom
      niet, dan kan de zaak zonder hem worden behandeld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel809
  - number: '810.1'
    text: |-
      De rechter kan in zaken betreffende minderjarigen, uitgezonderd die welke zijn levensonderhoud betreffen, indien
      hij dit met het oog op de beoordeling van de belangen van de minderjarige noodzakelijk acht, het advies van de raad
      voor de kinderbescherming inwinnen. Hij kan de raad daartoe in elke stand van de zaak oproepen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel810
  - number: '810.2'
    text: |-
      De raad voor de kinderbescherming kan in deze zaken eigener beweging zijn mening schriftelijk aan de rechter
      kenbaar maken of ter terechtzitting verschijnen, indien de raad dit met het oog op de beoordeling van de belangen
      van de minderjarige noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel810
  - number: '810.3'
    text: |-
      De raad voor de kinderbescherming ontvangt daartoe onverwijld een afschrift van het verzoekschrift, en wordt tijdig
      van het tijdstip van de terechtzitting op de hoogte gesteld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel810
  - number: '810.4'
    text: |-
      Indien de zaak evenwel de ondertoezichtstelling van een minderjarige betreft, de toepassing of overeenkomstige
      toepassing van de [artikelen 259](onbekend) en [260, van Boek 1 van het Burgerlijk Wetboek](onbekend) daaronder
      niet begrepen, dan wel de ontheffing of ontzetting van het ouderlijk gezag of van de voogdij, beslist de rechter
      niet dan na verhoor of behoorlijke oproeping daartoe van de raad voor de kinderbescherming.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel810
  - number: 810a.1
    text: |-
      In zaken betreffende minderjarigen, uitgezonderd zaken als bedoeld in het tweede lid alsmede die welke het
      levensonderhoud van een minderjarige betreffen, beslist de rechter pas nadat een ouder, indien deze daarom
      verzoekt, in de gelegenheid is gesteld een rapport van een niet door de rechter benoemde deskundige over te leggen,
      mits dat mede tot de beslissing van de zaak kan leiden en het belang van het kind zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel810a
  - number: 810a.2
    text: |-
      In zaken betreffende de ondertoezichtstelling van minderjarigen, de ontheffing en ontzetting van het ouderlijk
      gezag, of de ontzetting van de voogdij, benoemt de rechter op verzoek van een ouder en na overleg met die ouder
      een deskundige, mits dat mede tot de beslissing van de zaak kan leiden en het belang van het kind zich daartegen
      niet verzet.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel810a
  - number: 810a.3
    text: |-
      In de in het tweede lid genoemde zaken wordt het aan de in dat lid bedoelde deskundige toekomende bedrag
      overeenkomstig bij algemene maatregel van bestuur te stellen regels door de rechter vastgesteld en ten laste van ’s
      Rijks kas door de griffier aan de deskundige betaald. Van de ouder kan een bijdrage worden gevraagd overeenkomstig
      bij algemene maatregel van bestuur te stellen regels.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel810a
  - number: '811.1'
    text: |-
      In zaken betreffende minderjarigen worden als belanghebbenden bij het recht op inzage en afschrift, als bedoeld in
      [artikel 290][ref1], van door de raad voor de kinderbescherming of het openbaar ministerie overgelegde bescheiden
      alsmede van door een deskundige op verzoek van de rechter overgelegde bescheiden aangemerkt:


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel290
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel811
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '290'
        afdeling: Vierde
  - number: 811.1.a
    text: de verzoekers,
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel811
  - number: 811.1.b
    text: de ouders en voogden,
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel811
  - number: 811.1.c
    text: |-
      degenen die de minderjarige als behorende tot hun gezin verzorgen en opvoeden en die uit dien hoofde een nauwe
      persoonlijke betrekking met het kind hebben, en
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel811
  - number: 811.1.d
    text: |-
      de minderjarige van twaalf jaren of ouder, tenzij de rechter is gebleken dat hij niet in staat is tot een redelijke
      waardering van zijn belangen ter zake.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel811
  - number: '811.2'
    text: |-
      Inzage of afschrift kan evenwel worden geweigerd door de rechter aan wie de bescheiden zijn overgelegd, op een van
      de [onder ][ref1] genoemde gronden.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel811
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '811.3'
    text: Tegen de beschikking staat geen andere voorziening open dan cassatie in het belang der wet.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel811
  - number: '812.1'
    text: |-
      Iedere beschikking betreffende de gezagsuitoefening over minderjarigen, de beschikkingen ingevolge de [artikelen
      253s](onbekend), [261](onbekend), [326](onbekend) en [336](onbekend) daaronder begrepen, geeft degene aan wie deze
      minderjarigen ingevolge de beschikking tijdelijk of blijvend worden toevertrouwd, van rechtswege het recht tot het
      aan hem doen afgeven van deze minderjarigen, zonodig met behulp van de sterke arm.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel812
  - number: '813.1'
    text: 'Het openbaar ministerie verleent zo nodig zijn medewerking:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel813
  - number: 813.1.a
    text: tot de voorgeleiding van een minderjarige voor de rechter ingevolge artikel 809 van dit Wetboek;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel813
  - number: 813.1.b
    text: |-
      tot de overbrenging van een minderjarige naar een inrichting of naar een andere plaats ingevolge de [artikelen 261]
      (onbekend), en [326 van Boek 1 van het Burgerlijk Wetboek](onbekend);
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel813
  - number: 813.1.c
    text: |-
      tot de afgifte van minderjarigen, als bedoeld in [artikel 812][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel812
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel813
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '812'
        afdeling: Eerste
  - number: 813.1.d
    text: |-
      tot de tenuitvoerlegging der beschikkingen, bedoeld in [artikel 278, tweede lid, van Boek 1 van het Burgerlijk
      Wetboek](onbekend).
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel813
  - number: '813.2'
    text: |-
      De ambtenaar, aangesteld voor de uitvoering van de politietaak, die door het openbaar ministerie is aangewezen om
      de in lid 1 bedoelde medewerking te verlenen, heeft toegang tot elke plaats, voor zover dat redelijkerwijs voor de
      vervulling van zijn taak nodig is.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel813
  - number: '815.1'
    text: |-
      Onverminderd het in [artikel 278, eerste lid][ref1], bepaalde vermeldt het verzoekschrift:


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel278
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel815
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '278'
        afdeling: Vierde
  - number: 815.1.a
    text: |-
      de naam, de voornamen en voorzover bekend de woonplaats en de werkelijke verblijfplaats van de echtgenoot die niet
      de verzoeker is;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel815
  - number: 815.1.b
    text: voorzover bekend de naam van diens raadsman;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel815
  - number: 815.1.c
    text: |-
      de naam en de voornamen en voorzover bekend de woonplaats en de werkelijke verblijfplaats van ieder minderjarig
      kind van de echtgenoten te zamen of van een van hen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel815
  - number: '815.2'
    text: 'Bij de indiening van het verzoekschrift moeten worden overgelegd:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel815
  - number: 815.2.a
    text: een afschrift of uittreksel van de huwelijksakte;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel815
  - number: 815.2.b
    text: |-
      bescheiden betreffende de gronden waarop de rechter ingevolge [artikel 4][ref1] rechtsmacht heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel4
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel815
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '4'
        afdeling: Eerste
  - number: 815.2.c
    text: |-
      een afschrift of uittreksel van de akte van geboorte van ieder minderjarig kind van de echtgenoten te zamen of van
      een van hen;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel815
  - number: 815.2.d
    text: |-
      de processtukken die betrekking hebben op de voorlopige voorzieningen, bedoeld in de [artikelen 822][ref1] en
      [823][ref2], indien deze zijn gevraagd;


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel822
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel823
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel815
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '822'
        paragraaf: '2'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '823'
        paragraaf: '2'
        afdeling: Tweede
  - number: 815.2.e
    text: |-
      indien het een verzoek tot ontbinding van het huwelijk na scheiding van tafel en bed betreft: een authentiek
      afschrift van de rechterlijke uitspraak waarbij de scheiding van tafel en bed is uitgesproken.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel815
  - number: '815.3'
    text: |-
      Indien de stukken, bedoeld in het tweede lid, onderdelen *a* tot en met *c*, redelijkerwijs niet kunnen worden
      overgelegd, kan worden volstaan met overlegging van andere stukken of kan op andere wijze daarin worden voorzien,
      een en ander ter beoordeling van de rechter.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel815
  - number: '815.4'
    text: |-
      Indien ten behoeve van minderjarige kinderen voorzieningen moeten worden getroffen, zendt de griffier onverwijld
      een afschrift van het verzoekschrift aan de raad voor de kinderbescherming.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel815
  - number: '816.1'
    text: |-
      Betreft het een verzoek van één der echtgenoten, dan doet de verzoeker binnen veertien dagen na de indiening
      van het verzoekschrift een afschrift daarvan betekenen aan de andere echtgenoot. Uiterlijk op een in het exploit
      vermeld tijdstip kan de andere echtgenoot hetzij een verweerschrift indienen, hetzij om uitstel te dier zake
      verzoeken. Het exploit vermeldt dat een en ander slechts kan geschieden door een procureur. Het originele exploit
      moet ter griffie worden ingediend.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel816
  - number: '816.2'
    text: |-
      Het tijdstip dat ingevolge lid 1 in het exploit moet worden vermeld, wordt bepaald met inachtneming van een termijn
      van ten minste zes weken, te rekenen vanaf de dag van de betekening. Heeft de andere echtgenoot geen bekende
      woonplaats in Nederland, dan bedraagt deze termijn ten minste drie maanden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel816
  - number: '816.3'
    text: |-
      Indien het bepaalde in lid 1 of lid 2 niet in acht is genomen, of indien het exploit anderszins lijdt aan een
      gebrek, zijn de [artikelen 120][ref1] en [121][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel121
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel816
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '120'
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '121'
        afdeling: Vierde
  - number: '816.4'
    text: |-
      Indien de andere echtgenoot tijdig om uitstel heeft verzocht, alsmede indien een ingediend verweerschrift een
      zelfstandig verzoek bevat, bepaalt de rechter een termijn waarbinnen de andere echtgenoot respectievelijk de
      echtgenoot die het oorspronkelijke verzoekschrift heeft ingediend, een verweerschrift kan indienen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel816
  - number: '816.5'
    text: |-
      Op eensluidend verzoek van de echtgenoten verlengt de rechter de termijn bedoeld in lid 4, tenzij dit leidt tot
      onredelijke vertraging van het geding. Hij kan deze termijn ook verlengen op verzoek van een der echtgenoten of
      ambtshalve.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel816
  - number: '817.1'
    text: |-
      Betreft het een verzoek van een der echtgenoten, terwijl de andere echtgenoot op grond van een geestesstoornis
      verblijft in een ziekenhuis, verpleeghuis, verpleeginrichting of een psychiatrische inrichting als bedoeld in het
      derde lid, dan vermeldt het verzoekschrift het feit van dit verblijf.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel817
  - number: '817.2'
    text: |-
      In het geval bedoeld in het eerste lid beveelt de rechter het bureau rechtsbijstandvoorziening in het ressort
      waarbinnen deze echtgenoot verblijf houdt, indien deze nog geen advocaat heeft, aan hem een advocaat toe te
      voegen en bepaalt hij tevens een nieuwe termijn voor het indienen van een verweerschrift. Bij algemene maatregel
      van bestuur worden regels gesteld voor de vergoeding die de advocaat ontvangt voor de door hem verleende
      rechtsbijstand.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel817
  - number: '817.3'
    text: |-
      Onder een psychiatrische inrichting wordt verstaan een psychiatrisch ziekenhuis als bedoeld in
      [artikel 1, onder ][ref1] (*Stb.* 1992, 669).


      [ref1]: https://wetten.overheid.nl/BWBR0005700#Artikel1
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel817
    references:
      - id: ref1
        bwb_id: BWBR0005700
        artikel: '1'
  - number: '818.1'
    text: |-
      In afwijking van het bepaalde in [artikel 279, eerste lid][ref1], kan een behandeling ter terechtzitting achterwege
      blijven indien er geen minderjarige kinderen zijn die ingevolge [artikel 809][ref2] in de gelegenheid moeten worden
      gesteld hun mening kenbaar te maken en er, wanneer het een verzoek van een der echtgenoten betreft, niet tijdig
      verweer is gevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel279
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel809
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel818
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '279'
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '809'
        afdeling: Eerste
  - number: '818.2'
    text: |-
      Op een eensluidend mondeling of schriftelijk verzoek van de echtgenoten wordt de behandeling niet aangevangen of
      voortgezet voor het verstrijken van een door hen aangeduide termijn, tenzij dit leidt tot onredelijke vertraging
      van het geding.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel818
  - number: '818.3'
    text: |-
      Indien tijdig een verweerschrift is ingediend dat een zelfstandig verzoek bevat, vangt de behandeling niet aan
      voordat tegen dit verzoek een verweerschrift is ingediend dan wel de daarvoor geldende termijn ongebruikt is
      verstreken.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel818
  - number: '818.4'
    text: De behandeling geschiedt, indien mogelijk, in één zitting.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel818
  - number: '818.5'
    text: |-
      De [artikelen 802][ref1] en [803][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel802
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel803
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel818
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '802'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '803'
        afdeling: Eerste
  - number: '819'
    text: |-
      Betreft het een gemeenschappelijk verzoek, dan kan de rechter de getroffen onderlinge regelingen, daaronder
      begrepen afspraken omtrent uitkeringen tot levensonderhoud en omtrent de kosten van verzorging en opvoeding van een
      minderjarige, geheel of gedeeltelijk in de beschikking opnemen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel819
  - number: '820.1'
    text: |-
      In afwijking van het bepaalde van [artikel 358, tweede lid][ref1], kan een echtgenoot die in eerste aanleg niet
      in de procedure is verschenen, tegen een beschikking waarbij een verzoek tot echtscheiding, scheiding van tafel en
      bed of ontbinding van het huwelijk na scheiding van tafel en bed is toegewezen, hoger beroep instellen binnen drie
      maanden na de betekening van deze beschikking aan hem in persoon dan wel binnen drie maanden nadat zij op andere
      wijze is betekend en overeenkomstig het tweede lid openlijk bekend is gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel358
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel820
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '358'
        afdeling: Vierde
  - number: '820.2'
    text: |-
      De openlijke bekendmaking geschiedt door plaatsing van een uittreksel van de beschikking in de *Staatscourant*. Het
      uittreksel bevat de dagtekening van de beschikking en de aanduiding van de rechter die haar heeft gewezen, alsmede
      de naam, voornamen en woonplaats van ieder der echtgenoten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel820
  - number: '820.3'
    text: |-
      Indien hoger beroep of beroep in cassatie is ingesteld tegen een beschikking als bedoeld in het eerste lid, moet de
      griffier van het gerecht waarbij dit beroep is ingesteld, terstond het gerecht dat de bestreden beschikking heeft
      gegeven, daarvan op de hoogte stellen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel820
  - number: '820.4'
    text: |-
      Indien een echtgenoot slechts hoger beroep of beroep in cassatie heeft ingesteld tegen een beslissing omtrent
      nevenvoorzieningen, kan de andere echtgenoot na het verstrijken van de voor het instellen van het desbetreffende
      rechtsmiddel geldende termijn of na berusting geen beroep meer instellen tegen de uitspraak voorzover daarbij een
      verzoek tot echtscheiding, scheiding van tafel en bed of ontbinding van het huwelijk na scheiding van tafel en bed
      is toegewezen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel820
  - number: '820.5'
    text: |-
      In hoger beroep en in cassatie zijn de [artikelen 802][ref1], [803][ref2] en [817][ref3] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel802
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel803
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel817
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel820
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '802'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '803'
        afdeling: Eerste
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '817'
        paragraaf: '1'
        afdeling: Tweede
  - number: '821.1'
    text: |-
      In zaken van echtscheiding of scheiding van tafel en bed kan ieder der echtgenoten bij verzoekschrift voorlopige
      voorzieningen als bedoeld in de [artikelen 822][ref1] en [823][ref2] vragen. Een voorlopige voorziening kan worden
      gevraagd tot het tijdstip waarop een zodanige voorziening, indien gegeven, ingevolge [artikel 826][ref3] haar
      kracht verliest.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel822
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel823
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel826
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel821
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '822'
        paragraaf: '2'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '823'
        paragraaf: '2'
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '826'
        paragraaf: '2'
        afdeling: Tweede
  - number: '821.2'
    text: |-
      De behandeling ter terechtzitting vangt niet later aan dan in de derde week volgende op die waarin de voorziening
      is gevraagd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel821
  - number: '821.3'
    text: De rechter beslist zo spoedig mogelijk na de behandeling ter terechtzitting.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel821
  - number: '821.4'
    text: |-
      De beschikking houdende voorlopige voorzieningen, gegeven voordat een verzoek tot echtscheiding of tot scheiding
      van tafel en bed is gedaan, verliest haar kracht, indien niet binnen vier weken na haar dagtekening een verzoek tot
      echtscheiding of tot scheiding van tafel en bed is gedaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel821
  - number: '821.5'
    text: |-
      De [artikelen 810][ref1] en [812][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel810
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel812
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel821
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '810'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '812'
        afdeling: Eerste
  - number: '822.1'
    text: 'De rechter kan bij beschikking voor de duur van het geding:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel822
  - number: 822.1.a
    text: |-
      bepalen dat één der echtgenoten bij uitsluiting gerechtigd zal zijn tot het gebruik van de echtelijke woning met
      bevel dat de andere echtgenoot die woning dient te verlaten en deze verder niet mag betreden;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel822
  - number: 822.1.b
    text: |-
      bevelen dat ieder der echtgenoten aan de andere echtgenoot beschikbaar zal stellen de goederen tot diens dagelijks
      gebruik strekkend, alsmede de goederen strekkend tot het dagelijks gebruik van de kinderen;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel822
  - number: 822.1.c
    text: |-
      bepalen aan wie der echtgenoten ieder minderjarig kind van de echtgenoten te zamen zal worden toevertrouwd, waarbij
      tevens, indien het kind niet reeds in de macht van die echtgenoot mocht zijn, de afgifte van dat kind aan hem zal
      worden bevolen, en bovendien het bedrag bepalen dat de andere echtgenoot voor de verzorging en opvoeding van ieder
      der kinderen moet betalen;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel822
  - number: 822.1.d
    text: |-
      een regeling vaststellen inzake de omgang tussen het kind en de echtgenoot aan wie het kind niet is of zal worden
      toevertrouwd alsmede inzake het verschaffen van informatie over het kind aan dan wel de raadpleging van deze
      echtgenoot;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel822
  - number: 822.1.e
    text: het bedrag bepalen dat de ene echtgenoot moet betalen voor het levensonderhoud van de andere echtgenoot.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel822
  - number: '822.2'
    text: |-
      De voorzieningen, bedoeld in het eerste lid, vangen aan op de dag van de dagtekening der beschikking, tenzij de
      rechter een eerdere of latere aanvangsdag heeft vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel822
  - number: '823.1'
    text: |-
      De rechter is bevoegd op verzoek van een echtgenoot of van de raad voor de kinderbescherming een kind onder
      toezicht te stellen als bedoeld in [artikel 254 van Boek I van het Burgerlijk Wetboek](onbekend).
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel823
  - number: '823.2'
    text: |-
      [Artikel 826][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel826
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel823
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '826'
        paragraaf: '2'
        afdeling: Tweede
  - number: '824.1'
    text: |-
      Tegen de op grond van [artikel 822][ref1] gegeven beschikkingen en tegen de beschikkingen tot wijziging of
      intrekking daarvan staan geen hogere voorzieningen open, behoudens cassatie in het belang der wet.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel822
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel824
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '822'
        paragraaf: '2'
        afdeling: Tweede
  - number: '824.2'
    text: |-
      Op een verzoek van de echtgenoten of van één van hen kan een beschikking, als bedoeld in [artikel 822][ref1], door
      de rechtbank die of het gerechtshof dat de beschikking heeft gegeven, worden gewijzigd of ingetrokken, indien de
      omstandigheden na de dagtekening der beschikking in zodanige mate zijn gewijzigd of indien bij het geven van de
      beschikking in zodanige mate van onjuiste of onvolledige gegevens is uitgegaan, dat, alle betrokken belangen in
      aanmerking genomen, de voorziening niet in stand kan blijven. Artikel 821, tweede tot en met vijfde lid, is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel822
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel824
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '822'
        paragraaf: '2'
        afdeling: Tweede
  - number: '825'
    text: |-
      Als belanghebbenden bij het recht op inzage en afschrift, bedoeld in [artikel 290][ref1], van de bescheiden die
      betrekking hebben op de voorlopige voorzieningen, worden aangemerkt de echtgenoten met dien verstande dat in zaken
      betreffende minderjarigen [artikel 811][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel290
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel811
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel825
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '290'
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '811'
        afdeling: Eerste
  - number: '826.1'
    text: |-
      De voorlopige voorzieningen verliezen hun kracht zodra een beschikking waarbij de echtscheiding of de scheiding
      van tafel en bed is uitgesproken, wordt ingeschreven in de registers van de burgerlijke stand onderscheidenlijk
      het huwelijksgoederenregister, aangewezen in [artikel 116 van Boek 1 van het Burgerlijk Wetboek][ref1], of zodra de
      mogelijkheid daartoe vervalt, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel116
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel826
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '116'
  - number: 826.1.a
    text: |-
      de voorlopige voorziening bedoeld in [artikel 822, eerste lid, onderdeel a][ref1], haar kracht behoudt totdat de
      beslissing op een verzoek als bedoeld in [artikel 266 lid 5 van Boek 7 van het Burgerlijk Wetboek][ref2], indien
      dit verzoek is gedaan, in kracht van gewijsde gaat;


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel822
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel266
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel826
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '822'
        paragraaf: '2'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '266'
  - number: 826.1.b
    text: |-
      indien een verzoek tot voorziening in het gezag is gedaan of door de rechter ambtshalve in het gezag wordt
      voorzien, de voorlopige voorzieningen die op de kinderen betrekking hebben, hun kracht behouden totdat het gezag
      overeenkomstig [artikel 253p van Boek 1 van het Burgerlijk Wetboek][ref1] is begonnen;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253p
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel826
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253p
  - number: 826.1.c
    text: |-
      de voorlopige voorziening bedoeld in [artikel 822, eerste lid, onderdeel e][ref1], haar kracht behoudt totdat de
      beslissing op een verzoek als bedoeld in [artikel 157 van het Eerste Boek van het Burgerlijk Wetboek][ref2], indien
      dit verzoek is gedaan, bij toewijzing voor tenuitvoerlegging vatbaar wordt dan wel bij afwijzing in kracht van
      gewijsde gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel822
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel157
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel826
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '822'
        paragraaf: '2'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '157'
  - number: '826.2'
    text: |-
      De voorlopige voorzieningen verliezen eveneens hun kracht zodra een verzoek tot echtscheiding of tot scheiding
      van tafel en bed wordt ingetrokken, alsmede zodra een beschikking waarbij een verzoek tot echtscheiding of tot
      scheiding van tafel en bed wordt afgewezen, in kracht van gewijsde gaat.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel826
  - number: '827.1'
    text: |-
      Ingeval de echtscheiding, de scheiding van tafel en bed of de ontbinding van het huwelijk na scheiding van tafel en
      bed wordt uitgesproken, kan de rechter als nevenvoorziening de navolgende voorzieningen treffen:
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel827
  - number: 827.1.a
    text: toekenning van een uitkering tot levensonderhoud aan een echtgenoot ten laste van de andere echtgenoot;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel827
  - number: 827.1.b
    text: |-
      voorzieningen met betrekking tot de verdeling van de gemeenschap of bij huwelijkse voorwaarden overeengekomen
      verrekening van inkomsten of van vermogen;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel827
  - number: 827.1.c
    text: |-
      voorzieningen betreffende het gezag over, de omgang met, de informatie en raadpleging over en een bijdrage in de
      kosten van verzorging en opvoeding van minderjarige kinderen der echtgenoten; alsmede, ingeval de echtscheiding of
      de scheiding van tafel en bed wordt uitgesproken:
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel827
  - number: 827.1.d
    text: |-
      toepassing van [artikel 165, eerste lid][ref1], of van
      [artikel 175, eerste lid, van Boek 1 van het Burgerlijk Wetboek][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel165
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel175
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel827
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '165'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '175'
  - number: 827.1.e
    text: |-
      toepassing van [artikel 266 lid 5 van Boek 7 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel266
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel827
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '266'
  - number: 827.1.f
    text: |-
      een andere voorziening dan bedoeld in de onderdelen a tot en met e, mits deze voldoende samenhang vertoont met het
      verzoek tot echtscheiding, scheiding van tafel en bed of ontbinding van het huwelijk na scheiding van tafel en bed,
      en niet te verwachten is dat de behandeling daarvan tot onnodige vertraging van het geding zal leiden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel827
  - number: '827.2'
    text: |-
      Ten aanzien van nevenvoorzieningen als bedoeld in het eerste lid, onderdeel *c*, zijn de [artikelen 808][ref1],
      [809, eerste lid][ref2], [810][ref3], [810][ref4], [811][ref5] en [812][ref6] van toepassing, en komt, in afwijking
      van het bepaalde in [artikel 358][ref7], het recht van hoger beroep slechts toe aan de ouders, voorzover dezen tot
      het gezag bevoegd zijn, alsmede aan de raad voor de kinderbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel808
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel809
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel810
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel810a
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel811
      [ref6]: https://wetten.overheid.nl/BWBR0001827#Artikel812
      [ref7]: https://wetten.overheid.nl/BWBR0001827#Artikel358
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel827
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '808'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '809'
        afdeling: Eerste
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '810'
        afdeling: Eerste
      - id: ref4
        bwb_id: BWBR0001827
        artikel: 810a
        afdeling: Eerste
      - id: ref5
        bwb_id: BWBR0001827
        artikel: '811'
        afdeling: Eerste
      - id: ref6
        bwb_id: BWBR0001827
        artikel: '812'
        afdeling: Eerste
      - id: ref7
        bwb_id: BWBR0001827
        artikel: '358'
        afdeling: Vierde
  - number: '827.3'
    text: |-
      Indien aan de rechter blijkt dat een verzoek tot toekenning van een uitkering tot levensonderhoud aan een
      echtgenoot ten laste van de andere echtgenoot als voorwaarde is verbonden aan verlening van bijstand, stelt de
      rechter de gemeente die de voorwaarde heeft gesteld, in de gelegenheid schriftelijk of ter terechtzitting haar
      mening omtrent de vordering kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel827
  - number: '828'
    text: |-
      Op een ontbinding van een geregistreerd partnerschap zijn de bepalingen over de rechtspleging in scheidingszaken
      van overeenkomstige toepassing met uitzondering van [artikel 819][ref1] en de bepalingen verband houdende met
      minderjarige kinderen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel819
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel828
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '819'
        paragraaf: '1'
        afdeling: Tweede
  - number: '838.1'
    text: |-
      De griffiers en andere bewaarders van openbare registers moeten daarvan, zonder regterlijk bevel, tegen betaling
      der hun toekomende regten, afschrift of uittreksel afleveren aan alle degenen die zulks vorderen, op straffe
      van vergoeding van kosten, schaden en interessen. Niettemin zullen aan hen die geene partijen in de zaak zijn
      geweest geene uitgiften van arresten of vonnissen in strafzaken kunnen worden uitgereikt, zonder magtiging van den
      voorzieningenrechter van het gerechtshof of de rechtbank, welke dezelve geveld heeft, en het verzoek daartoe zal
      alleen worden toegestaan op het bewijs, dat de verzoeker daarbij belang heeft.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel838
  - number: '838.2'
    text: |-
      Het eerste lid geldt niet, voor zover [artikel 28][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel28
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel838
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '28'
        afdeling: Derde
  - number: 843a.1
    text: |-
      Hij die daarbij rechtmatig belang heeft, kan op zijn kosten inzage, afschrift of uittreksel vorderen van bepaalde
      bescheiden aangaande een rechtsbetrekking waarin hij of zijn rechtsvoorgangers partij zijn, van degene die deze
      bescheiden te zijner beschikking of onder zijn berusting heeft. Onder bescheiden worden mede verstaan: op een
      gegevensdrager aangebrachte gegevens.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel843a
  - number: 843a.2
    text: De rechter bepaalt zo nodig de wijze waarop inzage, afschrift of uittreksel zal worden verschaft.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel843a
  - number: 843a.3
    text: |-
      Hij die uit hoofde van zijn ambt, beroep of betrekking tot geheimhouding verplicht is, is niet gehouden aan deze
      vordering te voldoen, indien de bescheiden uitsluitend uit dien hoofde te zijner beschikking staan of onder zijn
      berusting zijn.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel843a
  - number: 843a.4
    text: |-
      Degene die de bescheiden te zijner beschikking of onder zijn berusting heeft, is niet gehouden aan deze vordering
      te voldoen, indien daarvoor gewichtige redenen zijn, alsmede indien redelijkerwijs aangenomen kan worden dat een
      behoorlijke rechtsbedeling ook zonder verschaffing van de gevraagde gegevens is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel843a
  - number: 843b.1
    text: |-
      Hij die een bewijsmiddel heeft verloren, kan van degene die de beschikking heeft over bescheiden die tot bewijs
      kunnen dienen van enig feit waarop het verloren bewijsmiddel betrekking had, of die zodanige bescheiden onder
      zijn berusting heeft, vorderen daarvan te zijnen behoeve op zijn kosten, voor zover nodig, inzage, afschrift, of
      uittreksel te verschaffen. Onder bescheiden worden mede verstaan: op een gegevensdrager aangebrachte gegevens.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel843b
  - number: 843b.2
    text: De rechter bepaalt zonodig de wijze waarop inzage, afschrift of uittreksel zal worden verschaft.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel843b
  - number: 843b.3
    text: |-
      Hij die uit hoofde van zijn ambt, beroep of betrekking tot geheimhouding verplicht is, is niet gehouden aan deze
      vordering te voldoen, indien de bescheiden uitsluitend uit dien hoofde te zijner beschikking staan of onder zijn
      berusting zijn.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel843b
  - number: '853'
    text: |-
      Behalve in de andere in de wet vermelde gevallen kan een zaak in gerechtelijke bewaring worden gesteld op een in
      kort geding gegeven bevel van de voorzieningenrechter van de rechtbank.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel853
  - number: '854'
    text: |-
      De rechter die de gerechtelijke bewaring van een bepaalde zaak beveelt, kan iedere daartoe geschikte persoon die
      bereid is deze benoeming te aanvaarden, als gerechtelijke bewaarder van die zaak aanwijzen. Hetzelfde geldt voor de
      deurwaarder die gebruik maakt van zijn bevoegdheid om een zaak in bewaring te stellen krachtens [artikel 446][ref1]
      en die ter plaatse geen voor zodanige zaken aangewezen gerechtelijke bewaarder tegen een redelijk loon tot de
      bewaring bereid vindt.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel446
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel854
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '446'
        afdeling: Eerste
  - number: '855.1'
    text: |-
      Degene die gerechtelijke bewaring verlangt van een roerende zaak die geen registergoed is, geeft bij de
      inbewaringgeving aan de bewaarder de wettelijke bepaling of het rechterlijk bevel op uit hoofde waarvan de bewaring
      zal geschieden. De bewaarder geeft hem een ontvangstbewijs waarop deze bepaling of dit bevel is vermeld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel855
  - number: '855.2'
    text: |-
      Degene die de zaak in bewaring heeft gegeven, is verplicht hiervan zo spoedig mogelijk schriftelijk mededeling
      te doen aan degenen tegen wie de bewaring zich richt en daarbij op te geven op welke grond de inbewaringstelling
      geschiedt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel855
  - number: '856.1'
    text: |-
      De gerechtelijke bewaring van een zaak geschiedt op de voorwaarden die door de bewaarder gewoonlijk voor zaken
      van dezelfde soort worden overeengekomen, of, bij gebreke daarvan, volgens de regels die krachtens het Burgerlijk
      Wetboek op de overeenkomst van toepassing zijn, telkens tenzij de rechter die de gerechtelijke bewaring beveelt,
      anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel856
  - number: '856.2'
    text: |-
      De inbewaringsteling kan aldus geschieden dat de bewaarder de zaak mag afgeven aan degene tegen wie de bewaring
      zich richt, mits deze tevoren aan zijn verplichtingen jegens de bewaargever heeft voldaan. Van een zodanig beding
      wordt melding gemaakt in de mededeling, bedoeld in [artikel 855, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel855
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel856
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '855'
        afdeling: Tweede
  - number: '856.3'
    text: |-
      De rechter die de gerechtelijke bewaring heeft bevolen, of anders de voorzieningenrechter van de rechtbank, kan
      op verzoek van de bewaarder of een belanghebbende de voorwaarden vaststellen of wijzigen of een gerechtelijke
      bewaarder aanwijzen die de gerechtelijke bewaring van de oorspronkelijke zal overnemen. De indiening van het
      verzoekschrift kan ook door een deurwaarder geschieden, voor zover de bewaring haar grond vindt in een beslag.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel856
  - number: '857.1'
    text: |-
      De kosten van de bewaring worden aan de bewaarder voldaan door degene die de zaak in bewaring heeft doen geven of
      het bevel tot bewaring heeft uitgelokt, onverminderd de rechten van hemzelf tegen degenen die jegens hem voor de
      kosten aansprakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel857
  - number: '857.2'
    text: |-
      De bewaarder heeft voor al hetgeen hem ter zake van de bewaring toekomt een retentierecht op de in bewaring
      gestelde zaken, dat hij kan uitoefenen tegen ieder die recht op afgifte van die zaken mocht hebben.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel857
  - number: '858.1'
    text: |-
      Wanneer de kosten van de bewaring niet op tijd aan de bewaarder worden voldaan, kan deze op een door de
      voorzieningenrechter van de rechtbank op zijn verzoek te bepalen wijze het in bewaring gestelde verkopen; de
      opbrengst treedt voor het in bewaring gestelde in de plaats en wordt, na aftrek van de kosten van bewaring en van
      de verkoop, ten behoeve van belanghebbenden in de consignatiekas gestort.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel858
  - number: '858.2'
    text: |-
      Ingeval de bewaring haar grond vindt in een beslag, wijst de voorzieningenrechter het verzoek niet toe dan nadat de
      beslagene is opgeroepen om te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel858
  - number: '858.3'
    text: Tegen een toewijzende beschikking krachtens dit artikel is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel858
  - number: '858.4'
    text: |-
      Van dit artikel kan niet bij de overeenkomst van bewaargeving worden afgeweken, tenzij de rechter krachtens
      [artikel 856][ref1] anders bepaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel856
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel858
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '856'
        afdeling: Tweede
  - number: '859'
    text: |-
      Indien degene die de zaak in bewaring heeft doen geven, in verband daarmee ten aanzien van de zaak een verzekering
      heeft gesloten, kan hij de door hem betaalde premies en kosten op dezelfde voet als de kosten van de bewaring
      terugvorderen van degenen die jegens hem voor die kosten aansprakelijk zijn, tenzij het niet redelijk was om de
      verzekering te sluiten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel859
  - number: '860.1'
    text: |-
      Een gerechtelijke bewaring kan op vordering van elke belanghebbende in kort geding, al of niet tegen
      zekerheidstelling, worden opgeheven door de voorzieningenrechter die de bewaring heeft bevolen of in het
      rechtsgebied van wiens rechtbank de zaken zich bevinden. De voorzieningenrechter bepaalt desverlangd aan wie de
      bewaarder de zaak dient af te geven.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel860
  - number: '860.2'
    text: |-
      Opheffing van het beslag waarin de gerechtelijke bewaring haar grond vindt, heeft van rechtswege tevens opheffing
      van de bewaring tot gevolg. De bewaarder is verplicht tot afgifte van de zaak aan de beslagene.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel860
  - number: '860.3'
    text: Opheffing van de bewaring doet niet af aan de rechten van de bewaarder tot het tijdstip van de afgifte.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel860
  - number: '861.1'
    text: |-
      In geval van een gerechtelijke bewaring die haar grond vindt in een beslag tot verhaal van een geldvordering, geeft
      de bewaarder het in bewaring gestelde op verzoek van de deurwaarder die met de executoriale verkoop is belast,
      tijdig aan deze af.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel861
  - number: '861.2'
    text: |-
      Is een zaak in bewaring gesteld in afwachting van de beslissing wie op afgifte daarvan recht heeft, dan geeft de
      bewaarder haar af aan degene aan wie zij krachtens een in kracht van gewijsde gegane of uitvoerbaar bij voorraad
      verklaarde beslissing toekomt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel861
  - number: '985'
    text: |-
      Wanneer een beslissing, gegeven door de rechter van een vreemde Staat, in Nederland uitvoerbaar is krachtens een
      verdrag of krachtens de wet, wordt zij niet ten uitvoer gelegd dan na daartoe verkregen rechterlijk verlof. De
      zaak zelf wordt niet aan een nieuw onderzoek onderworpen. Tot de kennisneming van het verzoek om verlening van het
      verlof zijn bevoegd de rechtbank van het arrondissement waar de wederpartij van de verzoeker woonplaats heeft en
      die van het arrondissement waar de tenuitvoerlegging wordt verlangd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel985
  - number: '986.1'
    text: |-
      Het verlof tot tenuitvoerlegging wordt gevraagd bij verzoekschrift. Het verzoekschrift wordt ingediend door een
      procureur en houdt tevens in de keuze van een woonplaats binnen het arrondissement van de rechtbank.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel986
  - number: '986.2'
    text: |-
      Bij het verzoekschrift wordt een authentiek afschrift van de beslissing overgelegd, benevens de stukken, waardoor
      kan worden vastgesteld dat zij uitvoerbaar is in het land, waar zij is gewezen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel986
  - number: '986.3'
    text: |-
      De rechtbank kan legalisatie van het afschrift van de beslissing en van de overige in het tweede lid bedoelde
      stukken verlangen. Zij kan tevens eisen, dat de beslissing en de overige overgelegde stukken worden vertaald in het
      Nederlands, en dat deze vertaling voor eensluidend wordt verklaard hetzij door een in Nederland toegelaten beëdigde
      vertaler, hetzij door een beëdigde vertaler, toegelaten in het land waar de beslissing is gegeven, hetzij door de
      diplomatieke of consulaire vertegenwoordiger van bedoeld land in Nederland.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel986
  - number: '986.4'
    text: Bij ongenoegzaamheid der overgelegde stukken wordt de verzoeker de gelegenheid tot aanvulling gegeven.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel986
  - number: '987.1'
    text: |-
      De rechtbank geeft haar beschikking met bekwame spoed, doch niet dan na verhoor, althans behoorlijke oproeping, van
      de partijen tegen wie de tenuitvoerlegging wordt verlangd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel987
  - number: '987.2'
    text: De rechtbank bepaalt dag en uur voor het verhoor, alsmede de termijn, bij de oproepingen in acht te nemen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel987
  - number: '987.3'
    text: |-
      De oproepingen geschieden vanwege de verzoeker bij deurwaardersexploot. De verzoeker legt de bewijzen van oproeping
      vóór of bij het verhoor aan de rechtbank over.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel987
  - number: '987.4'
    text: |-
      De rechtbank kan, indien een opgeroepene niet verschijnt, zijn nadere oproeping bevelen. Hetzelfde geldt, indien
      een partij ten onrechte niet is opgeroepen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel987
  - number: '987.5'
    text: De verzoeker en de andere partijen verschijnen bij procureur.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel987
  - number: '987.6'
    text: Na afloop van het verhoor deelt de rechter mede, wanneer de uitspraak zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel987
  - number: '988.1'
    text: De beschikking der rechtbank is met redenen omkleed en wordt in het openbaar uitgesproken.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel988
  - number: '988.2'
    text: De beschikking is uitvoerbaar bij voorraad zonder zekerheidstelling, voorzover de rechtbank niet anders beslist.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel988
  - number: '988.3'
    text: |-
      Ten aanzien van de proceskosten is het bepaalde in de [artikelen 237][ref1], [239][ref2] en [245][ref3] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel237
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel239
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel245
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel988
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '237'
        paragraaf: '2'
        afdeling: Twaalfde
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '239'
        paragraaf: '2'
        afdeling: Twaalfde
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '245'
        paragraaf: '2'
        afdeling: Twaalfde
  - number: '989.1'
    text: De beschikking der rechtbank is niet vatbaar voor verzet.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel989
  - number: '989.2'
    text: |-
      Partijen kunnen tegen de beschikking hoger beroep instellen binnen een maand na de dag van de uitspraak. Het wordt
      gebracht voor het gerechtshof.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel989
  - number: '989.3'
    text: |-
      In geval van hoger beroep vinden de [artikelen 986-988][ref1] en [989, eerste lid][ref2], overeenkomstige
      toepassing, met dien verstande dat ook de oorspronkelijke verzoeker wordt verhoord, althans behoorlijk opgeroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel986
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel989
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel989
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '986'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '989'
        afdeling: Eerste
  - number: '990'
    text: |-
      Partijen kunnen tegen de beschikking van het gerechtshof beroep in cassatie instellen binnen een maand na de dag
      waarop zij is gegeven. De [artikelen 988, eerste lid][ref1], en [989, eerste lid][ref2], vinden overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel988
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel989
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel990
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '988'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '989'
        afdeling: Eerste
  - number: '992'
    text: |-
      De bepalingen van deze titel zijn slechts van toepassing, voor zover een verdrag of een bijzondere wet geen
      afwijkende voorzieningen inhoudt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel992
  - number: '993.1'
    text: |-
      De bepalingen van de Eerste Afdeling van deze titel zijn van overeenkomstige toepassing, wanneer een in een vreemde
      Staat verleden authentieke akte in Nederland uitvoerbaar is krachtens verdrag of wet, met dien verstande dat de
      voorzieningenrechter der rechtbank treedt in de plaats van de rechtbank.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel993
  - number: '993.2'
    text: |-
      Wij behouden Ons voor bij algemene maatregel van bestuur te bepalen, dat onder dit artikel tevens zullen vallen
      niet eerder in deze titel bedoelde, in vreemde Staten tot stand gekomen executoriale titels, welke krachtens
      verdrag of wet in Nederland uitvoerbaar zijn.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel993
  - number: '994'
    text: De bepalingen van deze titel zijn niet van toepassing op uitspraken van internationale organen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel994
  - number: '995.1'
    text: |-
      In de zaken die ingevolge het bij of krachtens [Boek 2 van het Burgerlijk Wetboek][ref1] bepaalde met een
      verzoekschrift worden ingeleid, is, tenzij anders is bepaald, bevoegd de rechter van de woonplaats van de
      rechtspersoon. Nadat de rechtspersoon is opgehouden te bestaan blijft deze rechter bevoegd in zaken betreffende
      de vereffening, de benoeming van bewaarders van boeken en bescheiden en het verlenen van machtiging tot inzage in
      boeken en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel995
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: '995.2'
    text: |-
      Het verzoekschrift vermeldt, onverminderd het in [artikel 278][ref1] bepaalde, de naam en de woonplaats van de
      rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel278
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel995
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '278'
        afdeling: Vierde
  - number: '995.3'
    text: De rechter gelast in ieder geval de oproeping van de rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel995
  - number: '996'
    text: |-
      Hoger beroep moet worden ingesteld binnen drie maanden, te rekenen van de dag van de uitspraak van de
      eindbeschikking in zaken.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel996
  - number: 996.a
    text: |-
      tot ontbinding van een rechtspersoon of tot verkrijging van een verklaring dat en op welk tijdstip een
      rechtspersoon ingevolge haar statuten is ontbonden;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel996
  - number: 996.b
    text: tot verkrijging van een machtiging tot omzetting van een rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel996
  - number: 996.c
    text: |-
      tot doorhaling, aanvulling of wijziging van hetgeen is ingeschreven in het in [artikel 29 lid 1][ref1] of in
      [artikel 289 lid 1 van Boek 2 van het Burgerlijk Wetboek](onbekend) bedoelde register;


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel29
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel996
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '29'
        afdeling: Derde
  - number: 996.d
    text: tot wijziging van de statuten van een stichting;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel996
  - number: 996.e
    text: tot nietigverklaring van een wijziging van de statuten van een stichting, en
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel996
  - number: 996.f
    text: tot wijziging van of voorziening in het bestuur van een stichting.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel996
  - number: '997.1'
    text: |-
      Het verzet van een schuldeiser onderscheidenlijk een wederpartij overeenkomstig de [artikelen 100 lid 3][ref1],
      [209 lid 3](onbekend), [316 lid 2](onbekend), [334l](onbekend), of [404 lid 5 van boek 2 van het Burgerlijk
      Wetboek](onbekend) wordt door de rechter met de meeste spoed behandeld. Indien verschillende verzoekschriften zijn
      ingediend, wordt op alle tezamen beschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel100
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel997
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '100'
  - number: '997.2'
    text: |-
      Van de dag waarop de behandeling zal plaatsvinden, wordt door de griffier aankondiging gedaan in de *Nederlandse
      Staatscourant* en in een landelijk verspreid dagblad.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel997
  - number: '997.3'
    text: Voorts geeft de griffier kennis aan het kantoor van het handelsregister, waar de vennootschap is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel997
  - number: '997.4'
    text: De rechtbank hoort de schuldeisers onderscheidenlijk de wederpartijen die zijn verschenen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel997
  - number: '997.5'
    text: |-
      Hoger beroep moet binnen drie weken na de dagtekening van de eindbeschikking worden ingesteld bij de
      ondernemingskamer van het gerechtshof te Amsterdam. De voorgaande leden vinden in hoger beroep overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel997
  - number: 997a.1
    text: |-
      Een afschrift van het exploit van dagvaarding waarbij een vordering bij de rechtbank wordt ingesteld als bedoeld
      in de [artikelen 336](onbekend), [342](onbekend) en [343 van boek 2 van het Burgerlijk Wetboek](onbekend) wordt
      onverwijld door de eiser aan de vennootschap betekend.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel997a
  - number: 997a.2
    text: |-
      Binnen twee weken na de betekening stelt de vennootschap de niet gedagvaarde aandeelhouders schriftelijk in kennis
      van de inhoud van de dagvaarding.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel997a
  - number: 997a.3
    text: |-
      Van ieder vonnis wordt een afschrift door de griffier behalve aan partijen tevens aan de vennootschap toegezonden.
      Een afschrift van het onherroepelijk geworden vonnis als bedoeld in [artikel 340 lid 1 van boek 2 van het
      Burgerlijk Wetboek](onbekend) wordt onverwijld door de eiser aan de gedaagden en de vennootschap betekend.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel997a
  - number: 997a.4
    text: |-
      Tegen het vonnis is geen verzet van derden mogelijk als bedoeld in [artikel 376][ref1] van dit wetboek.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel376
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel997a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '376'
  - number: '999.1'
    text: |-
      Iedere belanghebbende die van oordeel is dat de jaarrekening, het jaarverslag of de daaraan toe te voegen
      overige gegevens van een rechtspersoon of een bank waarop [titel 9 van boek 2 van het Burgerlijk Wetboek][ref1]
      van toepassing is of een instelling of onderneming waarvoor de jaarrekening voorschriften van de
      [Wet toezicht beleggingsinstellingen][ref2] (*Stb.* 1990, 380) gelden, niet voldoen aan de daaromtrent bij of
      krachtens het Burgerlijk Wetboek of de [Wet toezicht beleggingsinstellingen][ref3] gestelde voorschriften, kan van
      deze rechtspersoon, bank of instelling of onderneming in rechte vorderen deze stukken in te richten overeenkomstig
      bij rechterlijk bevel te geven aanwijzingen. De vorige zin is niet van toepassing op de accountantsverklaring als
      bedoeld in a[rtikel 393, vijfde lid, van Boek 2 van het Burgerlijk Wetboek][ref4]. Dezelfde bevoegdheid heeft een
      belanghebbende ten aanzien van de jaarrekening, het jaarverslag of de daaraan toe te voegen overige gegevens van
      een commanditaire vennootschap of vennootschap onder firma als bedoeld in [artikel 360 lid 2 van boek 2 van het
      Burgerlijk Wetboek](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0004809
      [ref3]: https://wetten.overheid.nl/BWBR0004809
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel999
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0004809
      - id: ref3
        bwb_id: BWBR0004809
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '999.2'
    text: |-
      De advocaat-generaal bij het gerechtshof te Amsterdam is bevoegd tot instelling van de rechtsvordering in het
      openbaar belang.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel999
  - number: '1000'
    text: |-
      De ondernemingskamer van het gerechtshof te Amsterdam oordeelt in eerste en hoogste ressort over vorderingen, als
      bedoeld in het vorige artikel.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1000
  - number: '1001.1'
    text: |-
      De rechtsvordering moet worden ingesteld binnen twee maanden na de dag waarop de jaarrekening is vastgesteld dan
      wel, indien goedkeuring is vereist, na de dag waarop zij is goedgekeurd. Rechtsvorderingen omtrent stukken die
      ten kantore van het handelsregister of van de vennootschap ter inzage van een ieder moeten worden neergelegd,
      kunnen worden ingesteld tot twee maanden na de dag der nederlegging. Is de jaarrekening reeds voor de vaststelling
      of goedkeuring neergelegd, dan eindigt deze termijn twee maanden na de dag waarop uit een neergelegde mededeling
      of uit de neergelegde jaarrekening blijkt van haar vaststelling dan wel goedkeuring. Ter zake van tekortkomingen
      die niet uit de stukken blijken, eindigt de termijn twee maanden na de dag waarop de belanghebbende daarvan in
      redelijkheid niet meer onkundig kon zijn, maar uiterlijk twee jaar na verloop van de termijn ingevolge de vorige
      zinnen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1001
  - number: '1001.2'
    text: |-
      De dagvaarding vermeldt in welk opzicht de jaarrekening, het jaarverslag of de overige gegevens herziening
      behoeven.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1001
  - number: '1001.3'
    text: |-
      De zaak wordt overeenkomstig [artikel 113][ref1] ingeschreven op de rol van een enkelvoudige kamer en na het nemen
      van de conclusie van antwoord naar de ondernemingskamer verwezen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel113
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1001
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '113'
        afdeling: Vierde
  - number: '1001.4'
    text: De zaak zal met gesloten deuren worden behandeld; de uitspraak geschiedt echter in het openbaar.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1001
  - number: '1001.5'
    text: |-
      De ondernemingskamer beslist niet dan nadat zij de accountant die met het onderzoek van de jaarrekening is belast
      geweest, in de gelegenheid heeft gesteld te worden gehoord over de in de eis genoemde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1001
  - number: '1001.6'
    text: |-
      De ondernemingskamer geeft ten aanzien van een rechtspersoon waarop
      [artikel 72 van de Wet toezicht verzekeringsbedrijf 1993][ref1] van toepassing is, alsmede ten aanzien van een
      rechtspersoon waarop [artikel 33 van de Wet toezicht natura-uitvaartverzekeringsbedrijf][ref2] van toepassing is,
      geen beslissing zonder de Pensioen- & Verzekeringskamer in de gelegenheid te hebben gesteld ter zake te worden
      gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0007477#Artikel33
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1001
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '72'
      - id: ref2
        bwb_id: BWBR0007477
        artikel: '33'
  - number: '1001.7'
    text: |-
      De ondernemingskamer geeft ten aanzien van een kredietinstelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, van de Wet toezicht kredietwezen 1992][ref1] of een onderneming of instelling
      waarvoor de [Wet toezicht beleggingsinstellingen][ref2] (*Stb.* 1990, 380) geldt, geen beslissing zonder De
      Nederlandsche Bank N.V. in de gelegenheid te hebben gesteld te worden gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004809
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1001
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004809
  - number: '1002.1'
    text: |-
      Voor zover de ondernemingskamer de vordering toewijst, geeft zij aan de rechtspersoon, instelling of onderneming of
      bank een bevel omtrent de wijze waarop deze de jaarrekening, het jaarverslag of de overige gegevens moet inrichten;
      het bevel bevat daaromtrent nauwkeurige aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1002
  - number: '1002.2'
    text: |-
      De rechtspersoon, instelling of onderneming of bank is verplicht de jaarrekening, het jaarverslag of de overige
      gegevens met inachtneming van het bevel op te maken, en voor zover het de jaarrekening betreft, te besluiten
      omtrent de vaststelling en goedkeuring.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1002
  - number: '1002.3'
    text: |-
      De ondernemingskamer kan, ook ambtshalve, beslissen dat het bevel mede of uitsluitend een of meer toekomstige
      jaarrekeningen, jaarverslagen of daaraan toe te voegen overige gegevens betreft.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1002
  - number: '1002.4'
    text: |-
      Indien het bevel betrekking heeft op de jaarrekening die aan het geschil ten grondslag ligt, vernietigt dit bevel
      de vaststelling en de goedkeuring van die jaarrekening. De ondernemingskamer kan de gevolgen van de vernietiging
      beperken.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1002
  - number: '1002.5'
    text: |-
      Op verzoek van de rechtspersoon of de bank kan de ondernemingskamer wegens wijziging der omstandigheden haar bevel,
      voor zover dit betrekking heeft op toekomstige jaarrekeningen, jaarverslagen of daaraan toe te voegen overige
      gegevens intrekken. Zij beslist niet dan na degene op wiens vordering het bevel is gegeven, in de gelegenheid te
      hebben gesteld te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1002
  - number: '1003'
    text: |-
      Bij vorderingen als bedoeld in de [artikelen 240](onbekend) en [242 van Boek 6 van het Burgerlijk Wetboek]
      (onbekend) kan als volgt worden afgeweken van het bepaalde in [artikel 111, tweede lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel111
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1003
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '111'
        afdeling: Vierde
  - number: 1003.1°
    text: |-
      Een exploit dat bestemd is zowel voor een vereniging die ten doel heeft de behartiging van belangen van personen
      die een beroep of bedrijf uitoefenen, alsook voor de leden van deze vereniging, alsmede een exploit dat bestemd is
      voor de gewezen leden van een in eerste aanleg medegedagvaarde, doch inmiddels ontbonden vereniging als hiervoor
      bedoeld, behoeft de naam en de woonplaats van deze leden of gewezen leden niet afzonderlijk te vermelden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1003
  - number: 1003.2°
    text: |-
      Een exploit dat wordt uitgebracht zowel ten verzoeke van een vereniging die ten doel heeft de behartiging van
      belangen van personen die een beroep of bedrijf uitoefenen, alsook ten verzoeke van de leden van deze vereniging,
      alsmede een exploit dat wordt uitgebracht ten verzoeke van de gewezen leden van een in eerste aanleg mede-
      gedagvaarde, doch inmiddels ontbonden vereniging als hiervoor bedoeld, behoeft de voornaam, de naam en de
      woonplaats van deze leden of gewezen leden niet afzonderlijk te vermelden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1003
  - number: '1004'
    text: |-
      Een verzoekschrift als bedoeld in [artikel 242, tweede lid, van Boek 6 van het Burgerlijk Wetboek](onbekend), dat
      wordt ingediend namens of mede namens de leden van een vereniging die ten doel heeft de behartiging van belangen
      van personen die een beroep of bedrijf uitoefenen, dan wel namens of mede namens de gewezen leden van een in
      eerste aanleg mede-gedagvaarde, doch inmiddels ontbonden vereniging als hiervoor bedoeld, behoeft, in afwijking
      van het bepaalde in [artikel 278][ref1], de voornamen, de naam en de woonplaats of het werkelijk verblijf van deze
      verzoekers niet afzonderlijk te vermelden.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel278
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1004
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '278'
        afdeling: Vierde
  - number: '1005'
    text: |-
      In geval van een vordering als bedoeld in [artikel 240 van Boek 6 van het Burgerlijk Wetboek](onbekend) waarbij de
      in [artikel 1003 onder 1°][ref1] bedoelde gegevens niet in het exploot werden vermeld, kan het beroep in cassatie
      slechts worden ingesteld door degenen die in eerste aanleg verschenen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1003
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1005
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1003'
  - number: '1006'
    text: |-
      Bovendien gelden in geval van een vordering of verzoek als bedoeld in de [artikelen 240](onbekend) en [242 van Boek
      6 van het Burgerlijk Wetboek](onbekend), indien de in de [artikelen 1003][ref1] en [1004][ref2] bedoelde gegevens
      niet in het exploit of in het verzoekschrift werden vermeld, de navolgende bijzondere voorzieningen:


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1003
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel1004
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1006
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1003'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '1004'
  - number: 1006.1°
    text: |-
      De [artikelen 237][ref1], [239][ref2] en [289][ref3], worden toegepast als vormden de hiervoor bedoelde vereniging
      en haar leden, onderscheidenlijk de gewezen leden van een ontbonden vereniging, tezamen één partij. Niet verschenen
      of gewezen leden worden niet in de kosten van het geding verwezen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel237
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel239
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel289
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1006
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '237'
        paragraaf: '2'
        afdeling: Twaalfde
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '239'
        paragraaf: '2'
        afdeling: Twaalfde
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '289'
        afdeling: Vierde
  - number: 1006.2°
    text: |-
      Op vordering onderscheidenlijk verzoek van ieder der partijen kan de rechter, indien gerede twijfel bestaat of de
      wederpartij voor de proceskosten voldoende verhaal zal bieden, in elk stadium van de procedure bevelen dat terzake
      van de betaling der proceskosten zekerheid wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1006
  - number: '1008'
    text: |-
      Een lid-staat van de Europese Unie of een andere staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte kan voor de naar de regels van dit Wetboek bevoegde rechtbank een rechtsvordering tot
      teruggave van een roerende zaak die een cultuurgoed is in de zin van artikel 1, onder 1, van [richtlijn nr.
      93/7/EEG](31993L0007) van de Raad van de Europese Gemeenschappen van 15 maart 1993 betreffende de teruggave van
      cultuurgoederen die op onrechtmatige wijze buiten het grondgebied van een lid-staat zijn gebracht (*PbEG* L 74),
      instellen tegen de bezitter of, bij ontstentenis van een bezitter, tegen de houder van die zaak, mits de zaak na 31
      december 1992 op onrechtmatige wijze buiten zijn grondgebied is gebracht zonder dat deze onrechtmatigheid inmiddels
      is opgeheven, met dien verstande dat voor de Republiek Oostenrijk geldt dat de zaak na 30 juni 1994 buiten het
      grondgebied van deze staat dient te zijn gebracht, dat voor de Republiek Finland, de Republiek IJsland, het
      Koninkrijk Noorwegen en het Koninkrijk Zweden geldt dat de zaak na 31 december 1994 buiten het grondgebied van de
      desbetreffende staat dient te zijn gebracht en dat voor het Vorstendom Liechtenstein geldt dat de zaak na 30 april
      1995 buiten het grondgebied van deze staat dient te zijn gebracht.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1008
  - number: '1009'
    text: 'Op straffe van nietigheid dienen te zamen met de dagvaarding te worden betekend:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1009
  - number: 1009.a
    text: |-
      een document waarin de roerende zaak waarvan de teruggave wordt gevorderd, wordt beschreven, en waarin wordt
      verklaard dat deze zaak een beschermd cultuurgoed is in de zin van de richtlijn, bedoeld in [artikel 1008][ref1],
      en


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1008
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1009
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1008'
  - number: 1009.b
    text: |-
      een verklaring van de staat die de vordering heeft ingesteld, dat de roerende zaak waarop de vordering tot
      teruggave betrekking heeft, op onrechtmatige wijze buiten zijn grondgebied is gebracht.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1009
  - number: '1010'
    text: |-
      De centrale autoriteit, aangewezen krachtens artikel 3 van de richtlijn, bedoeld in [artikel 1008][ref1], kan ten
      behoeve van de lid-staat van de Europese Unie of ten behoeve van de andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte die aanspraak op teruggave van een cultuurgoed maakt, de nodige
      maatregelen nemen, zoals het doen leggen van conservatoir beslag, het in bewaring of onder bewind doen stellen van
      de zaak, en het vorderen van voorlopige voorzieningen in kort geding, zulks onverminderd de bevoegdheid te dier
      zake van de desbetreffende staat zelf.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1008
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1010
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1008'
  - number: '1011'
    text: |-
      De kosten die voortvloeien uit de uitvoering van een beslissing van een rechtbank tot teruggave van een roerende
      zaak ingevolge [artikel 1008][ref1], komen ten laste van de staat die rechtsvordering heeft ingesteld. Dit geldt
      ook voor de kosten inzake de maatregelen die door de centrale autoriteit, aangewezen krachtens artikel 3 van
      de richtlijn, zijn genomen voor het materiële behoud van het cultuurgoed, bedoeld in artikel 4, onder 4, van de
      richtlijn. Hieronder vallen tevens de kosten, bedoeld in [artikel 1010][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1008
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel1010
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1011
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1008'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '1010'
  - number: '1012'
    text: |-
      De eigendom van het cultuurgoed na de teruggave ervan wordt bepaald door het nationale recht van de staat die de
      rechtsvordering tot teruggave heeft ingesteld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1012
  - number: '1020.1'
    text: |-
      Partijen kunnen bij overeenkomst geschillen die tussen hen uit een bepaalde, al dan niet uit een overeenkomst
      voortvloeiende, rechtsbetrekking zijn ontstaan dan wel zouden kunnen ontstaan, aan arbitrage onderwerpen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1020
  - number: '1020.2'
    text: |-
      De overeenkomst tot arbitrage, bedoeld in het eerste lid, betreft zowel het compromis waarbij de partijen zich
      verbinden om een tussen hen bestaand geschil aan arbitrage te onderwerpen als het arbitraal beding waarbij de
      partijen zich verbinden om geschillen die tussen hen zouden kunnen ontstaan, aan arbitrage te onderwerpen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1020
  - number: '1020.3'
    text: |-
      De overeenkomst tot arbitrage mag niet leiden tot de vaststelling van rechtsgevolgen welke niet ter vrije bepaling
      van de partijen staan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1020
  - number: '1020.4'
    text: 'Bij overeenkomst kunnen tevens aan arbitrage worden onderworpen:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1020
  - number: 1020.4.a
    text: de enkele vaststelling van de hoedanigheid of van de toestand van zaken;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1020
  - number: 1020.4.b
    text: de enkele bepaling van de hoogte van een schadevergoeding of van een verschuldigde geldsom;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1020
  - number: 1020.4.c
    text: de aanvulling of wijziging van de rechtsbetrekking als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1020
  - number: '1020.5'
    text: |-
      Onder de overeenkomst tot arbitrage wordt mede begrepen een arbitraal beding dat is opgenomen in de partijen
      bindende statuten of reglementen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1020
  - number: '1020.6'
    text: |-
      Een arbitragereglement, waarnaar in een overeenkomst tot arbitrage wordt verwezen, wordt geacht deel van die
      overeenkomst uit te maken.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1020
  - number: '1021'
    text: |-
      De overeenkomst tot arbitrage wordt bewezen door een geschrift. Daarvoor is voldoende een geschrift dat in
      arbitrage voorziet of dat verwijst naar algemene voorwaarden welke in arbitrage voorzien en dat door of namens
      de wederpartij uitdrukkelijk of stilzwijgend is aanvaard. De overeenkomst tot arbitrage kan tevens worden bewezen
      door elektronische gegevens. [Artikel 227a, eerste lid, van Boek 6 van het Burgerlijk Wetboek][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel227a
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1021
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: 227a
  - number: '1022.1'
    text: |-
      De rechter, bij wie een geschil aanhangig is gemaakt waarover een overeenkomst tot arbitrage is gesloten, verklaart
      zich onbevoegd, indien een partij zich voor alle weren op het bestaan van deze overeenkomst beroept, tenzij de
      overeenkomst ongeldig is.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1022
  - number: '1022.2'
    text: |-
      Een overeenkomst tot arbitrage belet niet dat een partij de gewone rechter verzoekt om een maatregel tot
      bewaring van recht dan wel zich wendt tot de voorzieningenrechter van de rechtbank in kort geding overeenkomstig
      [artikel 254][ref1]; deze besluit in dit geval met inachtneming van het bepaalde in [artikel 1051][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel254
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel1051
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1022
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '254'
        afdeling: Veertiende
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '1051'
        afdeling: Derde
  - number: '1022.3'
    text: |-
      Een overeenkomst van arbitrage belet niet dat een partij de gewone rechter verzoekt een voorlopig getuigenverhoor,
      een voorlopig deskundigenbericht of een voorlopige plaatsopneming en bezichtiging te bevelen, tenzij ten tijde van
      dit verzoek arbiters zijn benoemd. [Artikel 187, eerste lid][ref1], vindt toepassing alsof geen overeenkomst tot
      arbitrage van kracht is.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel187
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1022
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '187'
        paragraaf: '5'
        afdeling: Negende
  - number: '1023'
    text: |-
      Iedere handelingsbekwame, natuurlijke persoon kan tot arbiter worden benoemd. Geen persoon is om reden van zijn
      nationaliteit van benoeming uitgesloten, tenzij de partijen anders zijn overeengekomen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1023
  - number: '1024.1'
    text: Het compromis bevat een aanduiding van hetgeen de partijen aan arbitrage wensen te onderwerpen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1024
  - number: '1024.2'
    text: |-
      Door het sluiten van een compromis is de zaak aanhangig, tenzij de partijen een andere wijze van aanhangig maken
      zijn overeengekomen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1024
  - number: '1024.3'
    text: |-
      Indien de partijen zijn overeengekomen dat de benoeming van de arbiter of arbiters, of een of meer hunner, door een
      derde zal geschieden, zendt de meest gerede partij een afschrift van het compromis aan die derde.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1024
  - number: '1025.1'
    text: |-
      Ingeval van een arbitraal beding is een zaak aanhangig op de dag van de ontvangst van een schriftelijke mededeling,
      waarbij een partij aan haar wederpartij bericht, tot arbitrage over te gaan. Die mededeling bevat een aanduiding
      van hetgeen de partij, die de zaak aanhangig maakt, aan arbitrage wenst te onderwerpen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1025
  - number: '1025.2'
    text: |-
      Indien de partijen zijn overeengekomen dat de benoeming van de arbiter of arbiters, of een of meer hunner, door een
      derde zal geschieden, zendt de partij die tot arbitrage overgaat een afschrift van de mededeling, bedoeld in het
      eerste lid, aan die derde.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1025
  - number: '1025.3'
    text: |-
      De partijen kunnen overeenkomen dat de zaak op een andere wijze aanhangig wordt gemaakt dan voorzien in dit
      artikel.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1025
  - number: '1026.1'
    text: Een scheidsgerecht heeft een oneven aantal arbiters. Het kan ook uit een arbiter bestaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1026
  - number: '1026.2'
    text: |-
      Ingeval de partijen het aantal arbiters niet zijn overeengekomen, of indien een overeengekomen wijze van bepaling
      van het aantal niet wordt uitgevoerd en de partijen niet alsnog tot overeenstemming komen over het aantal, wordt
      dat aantal op verzoek van de meest gerede partij bepaald door de voorzieningenrechter van de rechtbank.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1026
  - number: '1026.3'
    text: |-
      Indien de partijen een even aantal arbiters zijn overeengekomen, benoemen deze arbiters een aanvullend arbiter als
      voorzitter van het scheidsgerecht.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1026
  - number: '1026.4'
    text: |-
      Bij gebreke van overeenstemming tussen de arbiters wordt deze aanvullend arbiter, tenzij de partijen anders zijn
      overeengekomen, op verzoek van de meest gerede partij benoemd door de voorzieningenrechter van de rechtbank.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1026
  - number: '1027.1'
    text: |-
      De arbiter of arbiters worden benoemd op de wijze zoals de partijen zijn overeengekomen. De partijen kunnen de
      benoeming van de arbiter of arbiters, of van een of meer hunner, aan een derde opdragen. Indien geen wijze van
      benoeming is overeengekomen, worden de arbiter of arbiters door de partijen gezamenlijk benoemd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1027
  - number: '1027.2'
    text: |-
      De benoeming dient te geschieden binnen twee maanden nadat de zaak aanhangig is, tenzij de arbiter of arbiters
      reeds voordien zijn benoemd. Indien evenwel een der gevallen bedoeld in [artikel 1026, tweede lid][ref1], zich
      voordoet, vangt de termijn van twee maanden aan op de dag dat het aantal der arbiters is bepaald. Deze termijn is
      drie maanden indien ten minste een der partijen buiten Nederland woont of feitelijk verblijf houdt. De termijnen
      kunnen door de partijen bij overeenkomst worden bekort of verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1026
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1027
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1026'
        afdeling: Eerste
  - number: '1027.3'
    text: |-
      Vindt de benoeming van de arbiter of arbiters niet binnen de in het vorige lid bedoelde termijn plaats, dan worden
      deze, op verzoek van de meest gerede partij, benoemd door de voorzieningenrechter van de rechtbank. De wederpartij
      wordt in de gelegenheid gesteld, te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1027
  - number: '1027.4'
    text: |-
      De voorzieningenrechter of de derde benoemt de arbiter of arbiters ongeacht de vraag of de overeenkomst tot
      arbitrage geldig is. Door mede te werken aan de benoeming van de arbiter of arbiters verliezen de partijen niet
      het recht om een beroep te doen op de onbevoegdheid van het scheidsgerecht wegens het ontbreken van een geldige
      overeenkomst tot arbitrage.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1027
  - number: '1028'
    text: |-
      Indien in de overeenkomst tot arbitrage aan een der partijen een bevoorrechte positie bij de benoeming van de
      arbiter of arbiters is toegekend, kan de wederpartij, in afwijking van de in deze overeenkomst nedergelegde
      benoemingsregeling, binnen een maand nadat de zaak aanhangig is, de voorzieningenrechter van de rechtbank verzoeken
      de arbiter of arbiters te benoemen. De wederpartij van de verzoeker wordt in de gelegenheid gesteld, te worden
      gehoord.[ Artikel 1027, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1027
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1028
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1027'
        afdeling: Eerste
  - number: '1029.1'
    text: Een arbiter aanvaardt zijn opdracht schriftelijk.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1029
  - number: '1029.2'
    text: |-
      Een arbiter die zijn opdracht heeft aanvaard, kan op eigen verzoek daarvan worden ontheven hetzij met
      instemming van de partijen, hetzij door een door de partijen aangewezen derde of, bij gebreke daarvan, door de
      voorzieningenrechter van de rechtbank.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1029
  - number: '1029.3'
    text: Een arbiter die zijn opdracht heeft aanvaard, kan door de partijen gezamenlijk van zijn opdracht worden ontheven.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1029
  - number: '1029.4'
    text: |-
      Een arbiter die zijn opdracht heeft aanvaard, kan, indien hij rechtens of feitelijk niet meer in staat is, zijn
      opdracht te vervullen, op verzoek van een der partijen van zijn opdracht worden ontheven door een door de partijen
      aangewezen derde of, bij gebreke daarvan, door de voorzieningenrechter van de rechtbank.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1029
  - number: '1030.1'
    text: |-
      Een arbiter die ingevolge [artikel 1029, tweede, derde of vierde lid][ref1], van zijn opdracht is ontheven, wordt
      vervangen volgens de regelen die van toepassing waren op de oorspronkelijke benoeming, tenzij de partijen een
      andere wijze van vervanging zijn overeengekomen. Hetzelfde geldt ingeval van overlijden van een arbiter.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1029
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1030
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1029'
        afdeling: Eerste
  - number: '1030.2'
    text: |-
      Indien de partijen in de overeenkomst tot arbitrage de arbiter of arbiters met name hebben aangewezen, vindt
      vervanging in de in het eerste lid bedoelde gevallen eveneens plaats, tenzij de partijen zijn overeengekomen dat de
      overeenkomst tot arbitrage alsdan eindigt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1030
  - number: '1030.3'
    text: |-
      Ingeval van vervanging is het geding van rechtswege geschorst, tenzij de partijen anders zijn overeengekomen.
      Na de schorsing wordt het geding voortgezet in de stand waarin het zich bevindt, tenzij de partijen anders zijn
      overeengekomen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1030
  - number: '1031.1'
    text: De partijen kunnen gezamenlijk de opdracht van het scheidsgerecht beëindigen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1031
  - number: '1031.2'
    text: |-
      Op verzoek van de meest gerede partij kan een door de partijen aangewezen derde of, bij gebreke daarvan, de
      voorzieningenrechter van de rechtbank, de wederpartij en de arbiter of arbiters gehoord, de opdracht van het
      scheidsgerecht beëindigen, indien het, ondanks herhaalde aanmaning, zijn opdracht, alle omstandigheden in
      aanmerking genomen, op onaanvaardbaar trage wijze uitvoert. In dat geval herleeft de bevoegdheid van de gewone
      rechter, tenzij de partijen anders zijn overeengekomen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1031
  - number: '1032.1'
    text: |-
      Het overlijden van een partij doet de overeenkomst tot arbitrage noch de opdracht van het scheidsgerecht eindigen,
      tenzij de partijen anders zijn overeengekomen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1032
  - number: '1032.2'
    text: |-
      Het scheidsgerecht schorst het geding voor een door hem te bepalen termijn. Het scheidsgerecht kan, op verzoek van
      de rechtsopvolgers van een overleden partij, deze termijn verlengen. Het scheidsgerecht stelt de wederpartij in de
      gelegenheid, op het verzoek te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1032
  - number: '1032.3'
    text: |-
      Na de schorsing wordt het geding voortgezet in de stand waarin het zich bevindt, tenzij de partijen anders zijn
      overeengekomen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1032
  - number: '1033.1'
    text: |-
      Een arbiter kan worden gewraakt indien gerechtvaardigde twijfel bestaat aan zijn onpartijdigheid of
      onafhankelijkheid. Om dezelfde redenen kan een aan het scheidsgerecht toegevoegde secretaris worden gewraakt.
      [Artikel 1035][ref1] is in dit geval van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1035
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1033
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1035'
        afdeling: Eerste
  - number: '1033.2'
    text: |-
      Een door een partij benoemde arbiter kan door die partij slechts worden gewraakt om redenen welke haar na de
      benoeming bekend zijn geworden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1033
  - number: '1033.3'
    text: |-
      Een partij kan een door een derde of door de voorzieningenrechter van de rechtbank benoemde arbiter niet wraken,
      indien zij in diens benoeming heeft berust, tenzij de reden tot wraking haar eerst later bekend is geworden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1033
  - number: '1034.1'
    text: |-
      Een als arbiter of secretaris aangezochte persoon die het vermoeden heeft dat hij zou kunnen worden gewraakt, doet
      daarvan schriftelijk mededeling aan degene die hem heeft aangezocht, onder vermelding van de vermoedelijke redenen
      tot wraking.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1034
  - number: '1034.2'
    text: |-
      Een tot arbiter of secretaris benoemde persoon doet de in het eerste lid bedoelde mededeling aan de partijen zodra
      zijn benoeming heeft plaatsgevonden, tenzij zij deze mededeling reeds hebben ontvangen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1034
  - number: '1035.1'
    text: |-
      De wrakende partij brengt de wraking, onder opgave van redenen, schriftelijk ter kennis van de betrokken arbiter,
      het scheidsgerecht, haar wederpartij en tevens, indien een derde de gewraakte arbiter heeft benoemd, van die derde.
      Het geding kan door het scheidsgerecht worden geschorst vanaf de dag van de ontvangst van de kennisgeving.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1035
  - number: '1035.2'
    text: |-
      Trekt een gewraakte arbiter zich niet binnen twee weken na de dag van de ontvangst van die kennisgeving terug, dan
      wordt over de gegrondheid van de wraking op verzoek van de meest gerede partij door de voorzieningenrechter van de
      rechtbank beslist. Wordt dit verzoek niet binnen vier weken na de dag van de ontvangst van de kennisgeving gedaan,
      dan vervalt het recht tot wraking en wordt het geding, indien het geschorst was, hervat in de stand waarin het
      zich bevindt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1035
  - number: '1035.3'
    text: |-
      Trekt de gewraakte arbiter zich terug of wordt diens wraking door de voorzieningenrechter van de rechtbank gegrond
      bevonden, dan wordt hij vervangen volgens de regelen welke van toepassing waren op zijn oorspronkelijke benoeming,
      tenzij de partijen een andere wijze van vervanging zijn overeengekomen.[ Artikel 1030, tweede en derde lid][ref1],
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1030
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1035
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1030'
        afdeling: Eerste
  - number: '1035.4'
    text: |-
      Indien de betrokken arbiter, een der partijen of beide partijen buiten Nederland wonen of feitelijk verblijf
      houden, zijn de in het tweede lid vermelde termijnen zes onderscheidenlijk acht weken.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1035
  - number: '1036'
    text: |-
      Onverminderd het bepaalde in deze Titel wordt het arbitraal geding gevoerd op de wijze als door de partijen is
      overeengekomen of, voorzover de partijen daarin niet hebben voorzien, als door het scheidsgerecht bepaald.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1036
  - number: '1037.1'
    text: |-
      De plaats van arbitrage wordt door de partijen bij overeenkomst bepaald en bij gebreke daarvan door het
      scheidsgerecht. Door de bepaling van de plaats van arbitrage is tevens de plaats van de uitspraak vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1037
  - number: '1037.2'
    text: |-
      Indien de plaats van arbitrage noch door de partijen noch door het scheidsgerecht is bepaald, geldt de plaats van
      de uitspraak, door het scheidsgerecht in het vonnis vermeld, als plaats van arbitrage.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1037
  - number: '1037.3'
    text: |-
      Het scheidsgerecht kan zitting houden, beraadslagen, getuigen en deskundigen horen op elke andere plaats, in of
      buiten Nederland, die het daartoe geschikt acht.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1037
  - number: '1038.1'
    text: |-
      De partijen kunnen voor het scheidsgerecht in persoon verschijnen of zich doen vertegenwoordigen door een advocaat
      dan wel door een bijzonderlijk daartoe schriftelijk gevolmachtigde.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1038
  - number: '1038.2'
    text: De partijen kunnen zich in het geding door personen van keuze doen bijstaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1038
  - number: '1039.1'
    text: |-
      De partijen worden op voet van gelijkheid behandeld. Het scheidsgerecht geeft iedere partij de gelegenheid, voor
      haar rechten op te komen en haar stellingen voor te dragen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1039
  - number: '1039.2'
    text: |-
      Het scheidsgerecht geeft, op verzoek van een der partijen of uit eigen beweging, aan de partijen de gelegenheid tot
      het geven van een mondelinge toelichting.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1039
  - number: '1039.3'
    text: |-
      Het scheidsgerecht kan, op verzoek van een der partijen, een partij toestaan om getuigen of deskundigen voor te
      brengen. Het scheidsgerecht is bevoegd om een van zijn leden aan te wijzen om getuigen of deskundigen te horen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1039
  - number: '1039.4'
    text: Het scheidsgerecht is bevoegd, overlegging van stukken te bevelen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1039
  - number: '1039.5'
    text: |-
      Voor zover de partijen niet anders zijn overeengekomen, is het scheidsgerecht vrij ten aanzien van de toepassing
      van de regelen van bewijsrecht.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1039
  - number: '1040.1'
    text: |-
      Blijft de eiser, ofschoon daartoe behoorlijk in de gelegenheid gesteld, in gebreke zijn eis in te dienen of naar
      behoren toe te lichten, zonder daartoe gegronde redenen aan te voeren, dan kan het scheidsgerecht bij vonnis een
      einde maken aan het arbitraal geding.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1040
  - number: '1040.2'
    text: |-
      Blijft de verweerder, ofschoon daartoe behoorlijk in de gelegenheid gesteld, in gebreke verweer te voeren, zonder
      daartoe gegronde redenen aan te voeren, dan kan het scheidsgerecht aanstonds vonnis wijzen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1040
  - number: '1040.3'
    text: |-
      Bij het vonnis, bedoeld in het tweede lid, wordt de eis toegewezen, tenzij deze aan het scheidsgerecht onrechtmatig
      of ongegrond voorkomt. Het scheidsgerecht kan, alvorens vonnis te wijzen, van de eiser het bewijs van een of meer
      van zijn stellingen verlangen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1040
  - number: '1041.1'
    text: |-
      Indien een getuigenverhoor plaatsvindt, bepaalt het scheidsgerecht tijdstip en plaats van het verhoor en de wijze
      waarop het verhoor zal geschieden. Indien het scheidsgerecht het nodig oordeelt, hoort het de getuigen, nadat
      dezen op de bij de wet bepaalde wijze de eed hebben gezworen de gehele waarheid en niets dan de waarheid te zullen
      zeggen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1041
  - number: '1041.2'
    text: |-
      Indien een getuige niet vrijwillig verschijnt dan wel, verschenen zijnde, weigert een verklaring af te leggen, kan
      het scheidsgerecht aan de partij die dit verzoekt, toestaan om zich binnen een door het scheidsgerecht te bepalen
      termijn, te wenden tot de voorzieningenrechter van de rechtbank met verzoek een rechter-commissaris te benoemen
      voor wie het getuigenverhoor zal plaatsvinden. Het verhoor vindt plaats op dezelfde wijze als in gewone zaken, met
      dien verstande dat de arbiter of arbiters door de griffier van de rechtbank in de gelegenheid worden gesteld, bij
      het getuigenverhoor aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1041
  - number: '1041.3'
    text: |-
      De griffier van de rechtbank zendt ten spoedigste afschrift van het verslag van het verhoor aan het scheidsgerecht
      en aan de partijen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1041
  - number: '1041.4'
    text: |-
      Het scheidsgerecht kan het geding schorsen tot de dag dat het scheidsgerecht het verslag van het verhoor heeft
      ontvangen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1041
  - number: '1042.1'
    text: |-
      Het scheidsgerecht kan een of meer deskundigen benoemen tot het uitbrengen van een advies. Het scheidsgerecht zendt
      ten spoedigste afschrift van de benoeming en van de aan deskundigen gegeven opdracht aan de partijen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1042
  - number: '1042.2'
    text: |-
      Het scheidsgerecht kan van een partij verlangen, de deskundigen de vereiste inlichtingen te verschaffen en de
      benodigde medewerking te verlenen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1042
  - number: '1042.3'
    text: |-
      Na de ontvangst van het deskundigenbericht wordt dit in afschrift door het scheidsgerecht ten spoedigste aan de
      partijen toegezonden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1042
  - number: '1042.4'
    text: |-
      Op verzoek van een der partijen worden de deskundigen in een zitting van het scheidsgerecht gehoord. Indien
      een partij zulk een verzoek wenst te doen, deelt zij dit ten spoedigste mede aan het scheidsgerecht en aan de
      wederpartij.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1042
  - number: '1042.5'
    text: |-
      Het scheidsgerecht stelt de partijen in de gelegenheid, de deskundigen vragen te stellen en harerzijds deskundigen
      voor te brengen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1042
  - number: '1042.6'
    text: |-
      [Artikel 1041, eerste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1041
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1042
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1041'
        afdeling: Tweede
  - number: '1043'
    text: |-
      Het scheidsgerecht kan in elke stand van het geding de persoonlijke verschijning van de partijen bevelen voor het
      geven van inlichtingen dan wel teneinde een vergelijk te beproeven.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1043
  - number: '1044.1'
    text: |-
      Het scheidsgerecht kan door tussenkomst van de voorzieningenrechter van de rechtbank te 's-Gravenhage een verzoek
      om inlichtingen doen als bedoeld in artikel 3 van de op 7 juni 1968 te Londen gesloten Europese Overeenkomst
      nopens het verstrekken van inlichtingen over buitenlands recht (*Trb*. 1968, 142). De voorzieningenrechter zendt
      het verzoek, tenzij het hem nutteloos voorkomt, ten spoedigste aan het orgaan als bedoeld in artikel 2 van de
      Overeenkomst en deelt dit aan het scheidsgerecht mede.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1044
  - number: '1044.2'
    text: |-
      Het scheidsgerecht kan het geding schorsen tot de dag dat het scheidsgerecht het antwoord op het verzoek om
      inlichtingen heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1044
  - number: '1045.1'
    text: |-
      Op schriftelijk verzoek van een derde die enig belang heeft bij een arbitraal geding kan het scheidsgerecht hem
      toestaan om zich daarin te voegen of tussen te komen. Het scheidsgerecht zend ten spoedigste een afschrift van het
      verzoek aan de partijen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1045
  - number: '1045.2'
    text: |-
      Een partij kan een derde in vrijwaring oproepen. De oproep wordt ten spoedigste in afschrift gezonden aan het
      scheidsgerecht en aan de wederpartij.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1045
  - number: '1045.3'
    text: |-
      De voeging, tussenkomst of vrijwaring kan slechts door het scheidsgerecht, de partijen gehoord, worden toegelaten
      indien de derde bij schriftelijke overeenkomst met de partijen tot de overeenkomst tot arbitrage is toegetreden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1045
  - number: '1045.4'
    text: |-
      Door de toelating van de voeging, tussenkomst of vrijwaring wordt de derde in het arbitraal geding partij. Het
      scheidsgerecht regelt de verdere gang van het geding, tenzij de partijen daarin bij overeenkomst hebben voorzien.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1045
  - number: '1046.1'
    text: |-
      Indien voor een scheidsgerecht in Nederland een arbitraal geding aanhangig is, waarvan het onderwerp samenhangt
      met dat van een bij een ander scheidsgerecht in Nederland aanhangig geding, kan de meest gerede partij de
      voorzieningenrechter van de rechtbank te Amsterdam verzoeken, de samenvoeging van de gedingen te gelasten, tenzij
      de partijen anders zijn overeengekomen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1046
  - number: '1046.2'
    text: |-
      De voorzieningenrechter kan, nadat hij alle partijen en de arbiters in de gelegenheid heeft gesteld, hun mening
      kenbaar te maken, het verzoek geheel of gedeeltelijk toewijzen dan wel afwijzen. Zijn beslissing wordt aan alle
      partijen en de betrokken scheidsgerechten schriftelijk medegedeeld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1046
  - number: '1046.3'
    text: |-
      Indien de voorzieningenrechter algehele samenvoeging beveelt, benoemen de partijen in onderling overleg de arbiter
      of arbiters, in oneven getale, en bepalen zij, welke regelen op het samengevoegde geding van toepassing zullen
      zijn. Indien de partijen daarover binnen een door de voorzieningenrechter te stellen termijn geen overeenstemming
      kunnen bereiken, benoemt de voorzieningenrechter, op verzoek van de meest gerede partij, de arbiter of arbiters en
      bepaalt hij, zonodig, welke regelen op het samengevoegde geding van toepassing zullen zijn. De voorzieningenrechter
      bepaalt voor de arbiter of arbiters die als gevolg van de algehele samenvoeging van hun opdracht worden ontheven,
      de beloning voor de reeds door hen verrichte werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1046
  - number: '1046.4'
    text: |-
      Beveelt de voorzieningenrechter gedeeltelijke samenvoeging, dan beslist hij welke geschillen daaronder zijn
      begrepen. De voorzieningenrechter benoemt, op verzoek van de meest gerede partij, de arbiter of arbiters en bepaalt
      welke regelen op het samengevoegde geding van toepassing zijn, indien de partijen daaromtrent binnen een door de
      voorzieningenrechter te bepalen termijn geen overeenstemming bereiken. In dit geval schorsen de scheidsgerechten,
      waarbij de bij de gedeeltelijke samenvoeging betrokken zaken reeds aanhangig zijn, de behandeling dier zaken. Het
      vonnis van het voor de samengevoegde zaken benoemde scheidsgerecht wordt door dit gerecht aan de andere betrokken
      scheidsgerechten toegezonden. Na de ontvangst van dit vonnis zetten deze scheidsgerechten de bij hen aanhangige
      zaken voort en beslissen zij met inachtneming van het in het samengevoegde geding gewezen vonnis.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1046
  - number: '1046.5'
    text: |-
      In de gevallen, bedoeld in het derde of vierde lid, is [artikel 1027, vierde lid][ref1], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1027
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1046
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1027'
        afdeling: Eerste
  - number: '1046.6'
    text: |-
      Tegen een op voet van het derde of vierde lid gewezen vonnis staat arbitraal hoger beroep open, indien en voorzover
      alle bij het samengevoegde geding betrokken partijen bij een overeenkomst in zodanig hoger beroep hebben voorzien.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1046
  - number: '1047'
    text: |-
      Ingeval van arbitrage omtrent zaken als bedoeld in artikel 1020, vierde lid, onder a, blijft, behoudens artikel
      1037, het in deze afdeling bepaalde buiten toepassing. Het geding wordt alsdan gevoerd op de wijze als door de
      partijen is overeengekomen of, voor zover de partijen daarin niet hebben voorzien, als door het scheidsgerecht
      bepaald.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1047
  - number: '1048'
    text: De bepaling van het tijdstip, waarop het vonnis zal worden gewezen, is het scheidsgerecht voorbehouden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1048
  - number: '1049'
    text: Het scheidsgerecht kan een geheel of gedeeltelijk eindvonnis dan wel een tussenvonnis wijzen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1049
  - number: '1050.1'
    text: |-
      Arbitraal hoger beroep van een arbitraal vonnis is slechts mogelijk indien de partijen bij overeenkomst hebben
      voorzien.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1050
  - number: '1050.2'
    text: |-
      Arbitraal hoger beroep van een gedeeltelijk eindvonnis kan slechts tezamen met het hoger beroep van het laatste
      eindvonnis worden ingesteld, tenzij de partijen anders zijn overeengekomen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1050
  - number: '1050.3'
    text: |-
      Arbitraal hoger beroep van een tussenvonnis kan slechts worden ingesteld tezamen met het hoger beroep van een
      geheel of gedeeltelijk eindvonnis, tenzij de partijen anders zijn overeengekomen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1050
  - number: '1050.4'
    text: |-
      De termijn voor het instellen van het arbitraal hoger beroep beloopt drie maanden na de dag van nederlegging van
      het vonnis ter griffie van de rechtbank, tenzij de partijen anders zijn overeengekomen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1050
  - number: '1051.1'
    text: |-
      De partijen kunnen bij overeenkomst het scheidsgerecht dan wel de voorzitter daarvan, binnen de grenzen gesteld bij
      [artikel 254, eerste lid][ref1], de bevoegdheid verlenen om in kort geding vonnis te wijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel254
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1051
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '254'
        afdeling: Veertiende
  - number: '1051.2'
    text: |-
      Indien, niettegenstaande een zodanige overeenkomst, de zaak in kort geding bij de voorzieningenrechter is
      aangebracht, kan deze, indien een partij zich op het bestaan van deze overeenkomst beroept, alle omstandigheden
      in aanmerking nemende, zich onbevoegd verklaren door de zaak te verwijzen naar het overeengekomen arbitraal kort
      geding, tenzij de overeenkomst ongeldig is.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1051
  - number: '1051.3'
    text: |-
      Een uitspraak, gedaan in arbitraal kort geding, geldt als een arbitraal vonnis; daarop zijn de bepalingen van de
      derde tot en met de vijfde afdeling van deze Titel van toepassing.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1051
  - number: '1051.4'
    text: |-
      Ingeval van verwijzing naar het arbitraal kort geding, als bedoeld in het tweede lid, staat tegen de beslissing van
      de voorzieningenrechter van de rechtbank geen voorziening open.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1051
  - number: '1052.1'
    text: Het scheidsgerecht is gerechtigd, over zijn bevoegdheid te oordelen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1052
  - number: '1052.2'
    text: |-
      Een partij die in het arbitraal geding is verschenen, dient een beroep op de onbevoegdheid van het scheidsgerecht
      op de grond dat een geldige overeenkomst tot arbitrage ontbreekt, voor alle weren te doen, op straffe van verval
      van haar recht op dat ontbreken later, in het arbitraal geding of bij de gewone rechter, alsnog een beroep te doen,
      tenzij dit beroep wordt gedaan op de grond dat het geschil volgens [artikel 1020, derde lid][ref1], niet vatbaar is
      voor arbitrage.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1020
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1052
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1020'
        afdeling: Eerste
  - number: '1052.3'
    text: |-
      Een partij die aan de samenstelling van het scheidsgerecht heeft medegewerkt, kan in het arbitraal geding of bij
      de gewone rechter geen beroep doen op de onbevoegdheid van het scheidsgerecht op de grond dat het scheidsgerecht
      in strijd met de daarvoor geldende regelen is samengesteld. Een partij die in het arbitraal geding is verschenen
      en die niet aan de samenstelling van het scheidsgerecht heeft medegewerkt, dient het beroep op de onbevoegdheid van
      het scheidsgerecht op de grond dat het scheidsgerecht in strijd met de daarvoor geldende regelen is samengesteld,
      voor alle weren te doen, op straffe van verval van haar recht daarop later, in het arbitraal geding of bij de
      gewone rechter, alsnog een beroep te doen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1052
  - number: '1052.4'
    text: |-
      De beslissing, waarbij het scheidsgerecht zich bevoegd verklaart, kan slechts tegelijk met een daaropvolgend geheel
      of gedeeltelijk eindvonnis met de rechtsmiddelen, genoemd in [artikel 1064, eerste lid][ref1], worden bestreden.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1064
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1052
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1064'
        afdeling: Vijfde
  - number: '1052.5'
    text: |-
      Indien het scheidsgerecht zich onbevoegd verklaart, is de gewone rechter bevoegd van de zaak kennis te nemen,
      tenzij de partijen anders zijn overeengekomen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1052
  - number: '1052.6'
    text: |-
      Zowel ingeval van bevoegdverklaring als van onbevoegdverklaring door het scheidsgerecht, is arbitraal hoger
      beroep, indien overeengekomen, toegelaten. De gewone rechter is alsdan niet eerder bevoegd ingevolge het vierde of
      vijfde lid van dit artikel dan nadat in hoger beroep uitspraak is gedaan, of de voor dit beroep geldende termijn
      ongebruikt is verstreken dan wel eerder, indien schriftelijk van hoger beroep afstand is gedaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1052
  - number: '1053'
    text: |-
      De overeenkomst tot arbitrage dient als een afzonderlijke overeenkomst te worden beschouwd en beoordeeld. Het
      scheidsgerecht is bevoegd, te oordelen over de rechtsgeldigheid van de hoofdovereenkomst waarvan de overeenkomst
      tot arbitrage deel uitmaakt of waarop zij betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1053
  - number: '1054.1'
    text: Het scheidsgerecht beslist naar de regelen des rechts.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1054
  - number: '1054.2'
    text: |-
      Ingeval de partijen een rechtskeuze hebben gedaan, beslist het scheidsgerecht naar de door de partijen aangewezen
      regelen des rechts. Indien een dergelijke rechtskeuze niet heeft plaatsgevonden, beslist het scheidsgerecht volgens
      de regelen des rechts die het in aanmerking acht te komen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1054
  - number: '1054.3'
    text: |-
      Het scheidsgerecht beslist als goede mannen naar billijkheid, indien de partijen het daartoe bij overeenkomst
      opdracht hebben gegeven.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1054
  - number: '1054.4'
    text: In alle gevallen houdt het scheidsgerecht rekening met de toepasselijke handelsgebruiken.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1054
  - number: '1055'
    text: |-
      Staat van het vonnis arbitraal hoger beroep open, dan kan het scheidsgerecht zijn vonnis uitvoerbaar bij voorraad
      verklaren in de gevallen waarin de gewone rechter daartoe bevoegd is. Het scheidsgerecht kan bepalen dat zekerheid
      wordt gesteld alvorens het vonnis bij voorraad ten uitvoer kan worden gelegd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1055
  - number: '1056'
    text: |-
      In de gevallen waarin de gewone rechter een dwangsom kan opleggen, is een scheidsgerecht daartoe eveneens bevoegd.
      De [artikelen 611a tot en met 611i][ref1] zijn van overeenkomstige toepassing, met dien verstande dat in de
      gevallen bedoeld in [artikel 611d][ref2], de opheffing, de opschorting of de vermindering van de dwangsom bij
      verzoekschrift moet worden verzocht aan de voorzieningenrechter van de rechtbank, ter griffie waarvan het origineel
      van het vonnis ingevolge [artikel 1058, eerste lid][ref3], moet worden nedergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel611a
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel611d
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel1058
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1056
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 611a
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 611d
        afdeling: Derde
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '1058'
        afdeling: Derde
  - number: '1057.1'
    text: |-
      Het scheidsgerecht beslist, indien het uit meer arbiters bestaat, bij meerderheid van stemmen, tenzij de partijen
      anders zijn overeengekomen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1057
  - number: '1057.2'
    text: Het vonnis wordt op schrift gesteld en door de arbiter of arbiters ondertekend.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1057
  - number: '1057.3'
    text: |-
      Weigert een minderheid van de arbiters te ondertekenen, dan wordt daarvan door de andere arbiters onder het door
      hen ondertekende vonnis melding gemaakt. Deze melding wordt door hen ondertekend. Een overeenkomstige melding vindt
      plaats, indien een minderheid niet in staat is te ondertekenen en niet verwacht kan worden dat het beletsel daartoe
      binnen korte tijd zal zijn opgeheven.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1057
  - number: '1057.4'
    text: 'Het vonnis bevat, naast de beslissing, in elk geval:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1057
  - number: 1057.4.a
    text: de namen en woonplaatsen van de arbiter of arbiters;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1057
  - number: 1057.4.b
    text: de namen en woonplaatsen van de partijen;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1057
  - number: 1057.4.c
    text: de dagtekening van de uitspraak;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1057
  - number: 1057.4.d
    text: de plaats van de uitspraak;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1057
  - number: 1057.4.e
    text: |-
      de gronden voor de in het vonnis gegeven beslissing, tenzij het vonnis uitsluitend betreft de enkele vaststelling
      van de hoedanigheid of van de toestand van zaken, als bedoeld in [artikel 1020, vierde lid, onder a][ref1], dan wel
      de vastlegging van een vergelijk, als bedoeld in [artikel 1069][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1020
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel1069
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1057
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1020'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '1069'
        afdeling: Zesde
  - number: '1058.1'
    text: 'Het scheidsgerecht draagt er zorg voor dat ten spoedigste:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1058
  - number: 1058.1.a
    text: |-
      elk vonnis in afschrift, getekend door een arbiter of de secretaris van het scheidsgerecht, aan de partijen wordt
      gezonden;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1058
  - number: 1058.1.b
    text: |-
      het origineel van een geheel of gedeeltelijk eindvonnis wordt nedergelegd ter griffie van de rechtbank binnen
      welker arrondissement de plaats van de arbitrage is gelegen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1058
  - number: '1058.2'
    text: |-
      De opdracht van het scheidsgerecht eindigt door de nederlegging ter griffie van het laatste eindvonnis,
      onverminderd het bepaalde in de [artikelen 1060][ref1] en [1061][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1060
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel1061
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1058
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1060'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '1061'
        afdeling: Derde
  - number: '1059.1'
    text: |-
      Slechts een geheel of gedeeltelijk arbitraal eindvonnis kan gezag van gewijsde verkrijgen. Het heeft dit met ingang
      van de dag waarop het is gewezen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1059
  - number: '1059.2'
    text: |-
      Indien echter arbitraal hoger beroep is overeengekomen, verkrijgt een in eerste aanleg gewezen geheel of
      gedeeltelijk eindvonnis gezag van gewijsde met ingang van de dag waarop de voor dit beroep geldende termijn
      ongebruikt is verstreken dan wel met ingang van de dag waarop in hoger beroep uitspraak is gedaan, indien en
      voorzover het vonnis in eerste aanleg in dat hoger beroep is bevestigd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1059
  - number: '1060.1'
    text: |-
      Een partij kan tot dertig dagen na de dag van de nederlegging van het vonnis ter griffie van de rechtbank, het
      scheidsgerecht schriftelijk verzoeken, een kennelijke rekenfout of schrijffout in het vonnis te herstellen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1060
  - number: '1060.2'
    text: |-
      Indien de gegevens, genoemd in [artikel 1057, vierde lid, onder a tot en met d][ref1], onjuist zijn vermeld of
      geheel of gedeeltelijk in het vonnis ontbreken, kan een partij, tot dertig dagen na de dag van de nederlegging van
      het vonnis ter griffie van de rechtbank, het scheidsgerecht schriftelijk de verbetering van die gegevens verzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1057
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1060
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1057'
        afdeling: Derde
  - number: '1060.3'
    text: |-
      Een verzoek, bedoeld in het eerste of tweede lid, wordt door het scheidsgerecht in afschrift aan de wederpartij
      gezonden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1060
  - number: '1060.4'
    text: |-
      Het scheidsgerecht kan, tot dertig dagen na de dag van nederlegging van het vonnis ter griffie van de rechtbank,
      ook uit eigen beweging tot het herstel, als bedoeld in het eerste lid, of de verbetering, als bedoeld in het tweede
      lid, overgaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1060
  - number: '1060.5'
    text: |-
      Gaat het scheidsgerecht tot het herstel of de verbetering over, dan wordt deze door het scheidsgerecht op
      het origineel en op de afschriften van het vonnis aangebracht en ondertekend, dan wel in een apart door
      het scheidsgerecht ondertekend stuk vermeld, welk stuk geacht wordt deel uit te maken van het vonnis. De
      [artikelen 1057, eerste tot en met derde lid][ref1], en [1058, eerste lid][ref2], zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1057
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel1058
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1060
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1057'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '1058'
        afdeling: Derde
  - number: '1060.6'
    text: |-
      Wijst het scheidsgerecht het verzoek tot het herstel of de verbetering af, dan deelt het zulks schriftelijk aan de
      partijen mede.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1060
  - number: '1060.7'
    text: |-
      Het verzoek als bedoeld in dit artikel schort de mogelijkheid tot tenuitvoerlegging of vernietiging niet op, tenzij
      de voorzieningenrechter of de rechtbank gewichtige redenen aanwezig acht om die mogelijkheid wel op te schorten
      totdat over het verzoek is beslist.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1060
  - number: '1061.1'
    text: |-
      Heeft het scheidsgerecht nagelaten, te beslissen omtrent een of meer zaken welke aan zijn oordeel waren
      onderworpen, dan kan de meest gerede partij, tot dertig dagen na de dag van nederlegging van het vonnis ter griffie
      van de rechtbank, het scheidsgerecht verzoeken, een aanvullend vonnis te wijzen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1061
  - number: '1061.2'
    text: Het verzoek wordt door het scheidsgerecht in afschrift aan de wederpartij toegezonden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1061
  - number: '1061.3'
    text: Voordat het scheidsgerecht op het verzoek beslist, stelt het de partijen in de gelegenheid, te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1061
  - number: '1061.4'
    text: |-
      Een aanvullend vonnis geldt als een arbitraal vonnis; daarop zijn de bepalingen van de derde tot en met de vijfde
      afdeling van deze Titel van toepassing.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1061
  - number: '1061.5'
    text: |-
      Wijst het scheidsgrecht het verzoek tot een aanvullend vonnis af, dan deelt het zulks schriftelijk aan de partijen
      mede. Een afschrift van deze mededeling, getekend door een arbiter of de secretaris van het scheidsgerecht, wordt,
      overeenkomstig het bepaalde in [artikel 1058, eerste lid][ref1], ter griffie van de rechtbank nedergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1058
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1061
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1058'
        afdeling: Derde
  - number: '1061.6'
    text: |-
      Indien arbitraal hoger beroep is overeengekomen, kan het in eerste aanleg gewezen arbitraal vonnis slechts in hoger
      beroep worden aangevuld. Het verzoek daartoe moet binnen de voor het hoger beroep geldende termijn worden gedaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1061
  - number: '1062.1'
    text: |-
      De tenuitvoerlegging in Nederland van een geheel of gedeeltelijk arbitraal eindvonnis dat niet vatbaar is voor
      arbitraal hoger beroep dan wel uitvoerbaar bij voorraad is verklaard, of van een geheel of gedeeltelijk eindvonnis,
      gewezen in arbitraal hoger beroep, kan eerst plaatsvinden nadat de voorzieningenrechter van de rechtbank, ter
      griffie waarvan het origineel van het vonnis volgens [artikel 1058, eerste lid][ref1], moet worden nedergelegd,
      daartoe op verzoek van een der partijen verlof heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1058
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1062
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1058'
        afdeling: Derde
  - number: '1062.2'
    text: |-
      Het verlof wordt aangetekend op het origineel van het vonnis of, zo geen nederlegging heeft plaatsgevonden,
      opgenomen in een beschikking. De griffier zendt ten spoedigste aan de partijen een gewaarmerkt afschrift van het
      vonnis, met het daarop aangetekend verlof tot tenuitvoerlegging of een gewaarmerkt afschrift van de beschikking
      waarbij het verlof tot tenuitvoerlegging is verleend.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1062
  - number: '1062.3'
    text: |-
      Staat arbitraal hoger beroep open, dan kan het verlof tot tenuitvoerlegging van een in eerste aanleg gewezen
      arbitraal vonnis dat niet uitvoerbaar bij voorraad is verklaard, eerst worden gegeven nadat de voor dat arbitraal
      hoger beroep geldende termijn ongebruikt is verstreken, dan wel eerder, indien schriftelijk van hoger beroep
      afstand is gedaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1062
  - number: '1062.4'
    text: |-
      Verleent de voorzieningenrechter van de rechtbank het verlof tot tenuitvoerlegging, dan staan de wederpartij van de
      verzoeker slechts de rechtsmiddelen genoemd in [artikel 1064, eerste lid][ref1], open. Vernietiging of herroeping
      van het arbitraal vonnis brengt van rechtswege die van het verlof tot tenuitvoerlegging met zich mede.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1064
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1062
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1064'
        afdeling: Vijfde
  - number: '1063.1'
    text: |-
      De voorzieningenrechter van de rechtbank kan de tenuitvoerlegging van het arbitraal vonnis slechts weigeren,
      indien het vonnis, of de wijze waarop dit tot stand kwam, kennelijk in strijd is met de openbare orde of de
      goede zeden, dan wel indien in strijd met [artikel 1055][ref1] tenuitvoerlegging bij voorraad is bevolen of in
      strijd met [artikel 1056][ref2] een dwangsom is opgelegd. In dit laatste geval betreft de weigering alleen de
      tenuitvoerlegging van de dwangsom.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1055
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel1056
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1063
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1055'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '1056'
        afdeling: Derde
  - number: '1063.2'
    text: |-
      De griffier zendt ten spoedigste een gewaarmerkt afschrift van de beschikking van de voorzieningenrechter waarbij
      deze het verlof weigert, aan de partijen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1063
  - number: '1063.3'
    text: |-
      Van de weigering van het verlof tot tenuitvoerlegging kan de verzoeker hoger beroep bij het gerechtshof instellen
      binnen twee maanden na de dagtekening van de beschikking.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1063
  - number: '1063.4'
    text: |-
      Indien het verlof tot tenuitvoerlegging ook in hoger beroep niet verleend wordt, is de termijn voor beroep in
      cassatie twee maanden na de dagtekening van de beschikking in hoger beroep.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1063
  - number: '1063.5'
    text: |-
      Indien in hoger beroep of na beroep in cassatie, het verlof tot tenuitvoerlegging alsnog wordt verleend, is het
      bepaalde in [artikel 1062, vierde lid, eerste zin][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1062
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1063
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1062'
        afdeling: Vierde
  - number: '1064.1'
    text: |-
      Tegen een geheel of gedeeltelijk arbitraal eindvonnis dat niet vatbaar is voor arbitraal hoger beroep, of tegen
      een geheel of gedeeltelijk eindvonnis, gewezen in arbitraal hoger beroep, staan slechts de rechtsmiddelen van
      vernietiging en van herroeping op de voet van deze afdeling open.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1064
  - number: '1064.2'
    text: |-
      De vordering tot vernietiging wordt ingesteld bij de rechtbank ter griffie waarvan het origineel van het vonnis
      volgens [artikel 1058, eerste lid][ref1], moet worden nedergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1058
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1064
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1058'
        afdeling: Derde
  - number: '1064.3'
    text: |-
      Een partij kan de vordering tot vernietiging instellen zodra het vonnis gezag van gewijsde heeft verkregen. De
      bevoegdheid daartoe vervalt drie maanden na de dag van nederlegging van het vonnis ter griffie van de rechtbank.
      Wordt echter het vonnis, voorzien van een verlof tot tenuitvoerlegging, aan de wederpartij betekend, dan kan die
      partij, ongeacht het verstreken zijn van de termijn van drie maanden, genoemd in de vorige zin, alsnog binnen drie
      maanden na deze betekening de vordering tot vernietiging instellen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1064
  - number: '1064.4'
    text: |-
      Tegen een arbitraal tussenvonnis kan de vordering tot vernietiging slechts worden ingesteld te zamen met de
      vordering tot vernietiging van het geheel of gedeeltelijk arbitraal eindvonnis.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1064
  - number: '1064.5'
    text: |-
      Alle gronden tot vernietiging moeten, op straffe van verval van het recht daartoe in de dagvaarding worden
      voorgedragen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1064
  - number: '1065.1'
    text: 'Vernietiging kan slechts plaatsvinden op een of meer van de navolgende gronden:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1065
  - number: 1065.1.a
    text: een geldige overeenkomst tot arbitrage ontbreekt;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1065
  - number: 1065.1.b
    text: het scheidsgerecht is in strijd met de daarvoor geldende regelen samengesteld;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1065
  - number: 1065.1.c
    text: het scheidsgerecht heeft zich niet aan zijn opdracht gehouden;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1065
  - number: 1065.1.d
    text: |-
      het vonnis is niet overeenkomstig het in [artikel 1057][ref1] bepaalde ondertekend of niet met redenen omkleed;


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1057
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1065
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1057'
        afdeling: Derde
  - number: 1065.1.e
    text: het vonnis, of de wijze waarop dit tot stand kwam, strijdt met de openbare orde of de goede zeden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1065
  - number: '1065.2'
    text: |-
      De grond, bedoeld onder *a* van het eerste lid, kan niet tot vernietiging leiden in het geval genoemd in
      [artikel 1052, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1052
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1065
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1052'
        afdeling: Derde
  - number: '1065.3'
    text: |-
      De grond, bedoeld onder *b* van het eerste lid, kan niet tot vernietiging leiden in de gevallen genoemd in
      [artikel 1052, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1052
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1065
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1052'
        afdeling: Derde
  - number: '1065.4'
    text: |-
      De grond, bedoeld onder *c* van het eerste lid, kan niet tot vernietiging leiden indien de partij die deze aanvoert
      aan het geding heeft deelgenomen zonder daarop een beroep te doen, hoewel haar bekend was dat het scheidsgerecht
      zich niet aan zijn opdracht hield.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1065
  - number: '1065.5'
    text: |-
      Indien het scheidsgerecht meer of anders heeft toegewezen dan werd gevorderd, wordt het arbitraal vonnis
      gedeeltelijk vernietigd, voorzover het meer of anders toegewezene kan worden gescheiden van het overige gedeelte
      van het vonnis.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1065
  - number: '1065.6'
    text: |-
      Indien en voorzover het scheidsgerecht heeft nagelaten, uitspraak te doen omtrent een of meer zaken welke aan zijn
      oordeel waren onderworpen, kan de vordering tot vernietiging op de grond, bedoeld in het eerste lid, onder *c*,
      slechts worden ingesteld indien een aanvullend vonnis, bedoeld in [artikel 1061, eerste lid][ref1], is gewezen dan
      wel een verzoek tot aanvulling, bedoeld in [artikel 1061, eerste lid][ref2], geheel of ten dele is afgewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1061
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel1061
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1065
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1061'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '1061'
        afdeling: Derde
  - number: '1065.7'
    text: |-
      In afwijking van het bepaalde in [artikel 1064, derde lid, tweede zin][ref1], vervalt de termijn voor het instellen
      van de in het vorige lid bedoelde vordering tot vernietiging drie maanden na de dag van nederlegging ter griffie
      van de rechtbank van het aanvullend vonnis dan wel van het afschrift van de mededeling der afwijzing, als bedoeld
      in [artikel 1061, vijfde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1064
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel1061
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1065
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1064'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '1061'
        afdeling: Derde
  - number: '1066.1'
    text: De vordering tot vernietiging schorst de tenuitvoerlegging van het vonnis niet.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1066
  - number: '1066.2'
    text: |-
      De rechter die omtrent de vernietiging oordeelt, kan echter, indien daartoe gronden zijn, op verzoek van de meest
      gerede partij, de tenuitvoerlegging schorsen totdat over de vordering tot vernietiging onherroepelijk is beslist.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1066
  - number: '1066.3'
    text: |-
      Het verzoek tot schorsing wordt door de griffier van de rechtbank ten spoedigste aan de wederpartij in afschrift
      toegezonden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1066
  - number: '1066.4'
    text: |-
      De rechter beslist niet op het verzoek dan nadat de wederpartij in de gelegenheid is gesteld, zich daarover uit
      te laten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1066
  - number: '1066.5'
    text: |-
      Bij toewijzing van het verzoek kan de rechter bepalen dat door de verzoeker zekerheid wordt gesteld. Bij afwijzing
      van het verzoek kan de rechter bepalen dat de wederpartij zekerheid stelt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1066
  - number: '1066.6'
    text: |-
      In geval van schorsing van de tenuitvoerlegging kan de meest gerede partij de rechter verzoeken, de schorsing op te
      heffen. Het derde tot en met vijfde lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1066
  - number: '1067'
    text: |-
      Zodra het vonnis waarbij een arbitraal vonnis is vernietigd onherroepelijk is geworden, herleeft de bevoegdheid van
      de gewone rechter, tenzij de partijen anders zijn overeengekomen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1067
  - number: '1068.1'
    text: 'Herroeping kan slechts plaats vinden op een of meer van de navolgende gronden:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1068
  - number: 1068.1.a
    text: |-
      het vonnis berust geheel of ten dele op na de uitspraak ontdekt bedrog, door of met medeweten van de wederpartij in
      de arbitrale procedure gepleegd;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1068
  - number: 1068.1.b
    text: het vonnis berust geheel of ten dele op stukken die na de uitspraak blijken vals te zijn;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1068
  - number: 1068.1.c
    text: |-
      een partij heeft na de uitspraak stukken die op de beslissing van het scheidsgerecht van invloed zouden zijn
      geweest en door toedoen van de wederpartij zijn achtergehouden, in handen gekregen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1068
  - number: '1068.2'
    text: |-
      De vordering tot herroeping wordt met overeenkomstige toepassing van [artikel 1064, derde lid][ref1], of, indien
      dit een later tijdstip zal opleveren, binnen drie maanden nadat het bedrog of de valsheid bekend is geworden of
      een partij de nieuwe stukken in handen heeft gekregen, aangebracht voor het gerechtshof dat bevoegd zou zijn in
      hoger beroep te oordelen over de vordering tot vernietiging, bedoeld in [artikel 1064][ref2]. Indien de partij
      die gronden heeft de herroeping te vorderen binnen de in de eerste volzin bedoelde termijn is overleden, is
      [artikel 341][ref3] van overeenkomstige toepassing. De procedure wordt ingeleid met een dagvaarding die voldoet aan
      de eisen van [artikel 111][ref4] en wordt verder gevoerd op de wijze als in de tweede titel van het Eerste Boek is
      bepaald.[ Artikel 1066][ref5] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1064
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel1064
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel341
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel111
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel1066
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1068
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1064'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '1064'
        afdeling: Vijfde
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '341'
        afdeling: Tweede
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '111'
        afdeling: Vierde
      - id: ref5
        bwb_id: BWBR0001827
        artikel: '1066'
        afdeling: Vijfde
  - number: '1068.3'
    text: |-
      Indien de rechter de voor herroeping aangevoerde grond of gronden juist bevindt, vernietigt hij het vonnis geheel
      of gedeeltelijk. [Artikel 1067][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1067
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1068
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1067'
        afdeling: Vijfde
  - number: '1069.1'
    text: |-
      Indien de partijen gedurende een arbitraal geding tot een vergelijk komen, kan op gezamenlijk verzoek het
      scheidsgerecht de inhoud daarvan in een arbitraal vonnis vastleggen. Het scheidsgerecht kan het verzoek zonder
      opgave van redenen weigeren.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1069
  - number: '1069.2'
    text: |-
      Het arbitraal vonnis, houdende een vergelijk tussen de partijen, geldt als een arbitraal vonnis waarop de
      bepalingen van de derde tot en met de vijfde afdeling van deze Titel van toepassing zijn, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1069
  - number: 1069.2.a
    text: het vonnis slechts kan worden vernietigd op de grond dat het in strijd is met de openbare orde of de goede zeden;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1069
  - number: 1069.2.b
    text: |-
      het vonnis, in afwijking van het bepaalde in [artikel 1057][ref1], niet de gronden waarop het berust, behoeft te
      bevatten; en


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1057
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1069
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1057'
        afdeling: Derde
  - number: 1069.2.c
    text: het vonnis door de partijen wordt mede-ondertekend.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1069
  - number: '1070'
    text: |-
      Tegen beschikkingen van de voorzieningenrechter van de rechtbank, als bedoeld in de eerste tot en met de derde
      afdeling van deze Titel, staat geen voorziening open.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1070
  - number: '1071'
    text: |-
      In de gevallen bedoeld in de [ artikelen 1026, tweede en vierde lid][ref1], [1027, derde lid][ref2], [1028][ref3],
      [1044, eerste lid][ref4], en [1062, eerste lid][ref5], behoeven het verzoekschrift en, voorzover van toepassing,
      het verweerschrift niet door een procureur te worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1026
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel1027
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel1028
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel1044
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel1062
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1071
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1026'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '1027'
        afdeling: Eerste
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '1028'
        afdeling: Eerste
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '1044'
        afdeling: Tweede
      - id: ref5
        bwb_id: BWBR0001827
        artikel: '1062'
        afdeling: Vierde
  - number: '1072'
    text: |-
      De partijen kunnen bij overeenkomst de voorzieningenrechter van een bepaalde rechtbank als bevoegde
      voorzieningenrechter aanwijzen voor zaken als bedoeld in de [ artikelen 1026, tweede en vierde lid][ref1],
      [1027, derde lid][ref2], [1028][ref3], [1029, tweede en vierde lid][ref4], [1031, tweede lid][ref5],
      [1035, tweede lid][ref6], en [1041, tweede lid][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1026
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel1027
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel1028
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel1029
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel1031
      [ref6]: https://wetten.overheid.nl/BWBR0001827#Artikel1035
      [ref7]: https://wetten.overheid.nl/BWBR0001827#Artikel1041
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1072
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1026'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '1027'
        afdeling: Eerste
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '1028'
        afdeling: Eerste
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '1029'
        afdeling: Eerste
      - id: ref5
        bwb_id: BWBR0001827
        artikel: '1031'
        afdeling: Eerste
      - id: ref6
        bwb_id: BWBR0001827
        artikel: '1035'
        afdeling: Eerste
      - id: ref7
        bwb_id: BWBR0001827
        artikel: '1041'
        afdeling: Tweede
  - number: '1073.1'
    text: Het in deze Titel bepaalde is van toepassing indien de plaats van arbitrage in Nederland is gelegen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1073
  - number: '1073.2'
    text: |-
      Ingeval de partijen de plaats van arbitrage niet hebben bepaald, kan de benoeming of de wraking van de arbiter
      of arbiters of de aan het scheidsgerecht toegevoegde secretaris met toepassing van de voorzieningen in de eerste
      afdeling van deze Titel reeds plaatsvinden, indien ten minste een der partijen in Nederland woont dan wel feitelijk
      verblijf houdt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1073
  - number: '1074.1'
    text: |-
      De rechter in Nederland bij wie een geschil aanhangig is gemaakt waarover een overeenkomst tot arbitrage is
      gesloten waaruit voortvloeit dat arbitrage buiten Nederland moet plaatsvinden, verklaart zich onbevoegd, indien een
      partij zich voor alle weren op het bestaan van deze overeenkomst beroept, tenzij de overeenkomst ongeldig is onder
      het op die overeenkomst toepasselijke recht.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1074
  - number: '1074.2'
    text: |-
      De overeenkomst, bedoeld in het eerste lid, belet niet dat een partij de Nederlandse rechter verzoekt om een
      maatregel tot bewaring van recht dan wel zich wendt tot de voorzieningenrechter van de rechtbank in kort geding
      overeenkomstig [artikel 254][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel254
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1074
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '254'
        afdeling: Veertiende
  - number: '1075'
    text: |-
      Een in een vreemde Staat gewezen arbitraal vonnis waarop een erkennings- en tenuitvoerleggingsverdrag van
      toepassing is, kan in Nederland worden erkend en ten uitvoer gelegd. De [artikelen 985 tot en met 991][ref1] zijn
      van overeenkomstige toepassing voorzover het verdrag geen afwijkende voorzieningen inhoudt en met dien verstande
      dat de voorzieningenrechter van de rechtbank in de plaats treedt van de rechtbank en de termijn voor hoger beroep
      en beroep in cassatie twee maanden bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel985
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1075
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '985'
        afdeling: Eerste
  - number: '1076.1'
    text: |-
      Is geen erkennings- en tenuitvoerleggingsverdrag van toepassing of laat een toepasselijk verdrag toe, zich te
      beroepen op de wet van het land waar de erkenning of tenuitvoerlegging wordt verzocht, dan kan een in een vreemde
      Staat gewezen arbitraal vonnis in Nederland worden erkend en kan daarvan in Nederland de tenuitvoerlegging worden
      verzocht, tegen overlegging van het origineel of een gewaarmerkt afschrift, van de overeenkomst tot arbitrage en
      van het arbitraal vonnis, tenzij:
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1076
  - number: 1076.1.A
    text: 'de partij tegen wie de erkenning of tenuitvoerlegging wordt verzocht, stelt en bewijst dat:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1076
  - number: 1076.1.A.a
    text: een geldige overeenkomst tot arbitrage ontbreekt onder het op die overeenkomst toepasselijke recht;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1076
  - number: 1076.1.A.b
    text: het scheidsgerecht in strijd met de daarvoor geldende regelen is samengesteld;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1076
  - number: 1076.1.A.c
    text: het scheidsgerecht zich niet aan zijn opdracht heeft gehouden;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1076
  - number: 1076.1.A.d
    text: |-
      tegen het arbitraal vonnis hoger beroep bij arbiters of de rechter openstaat in het land waar het arbitraal vonnis
      is gewezen;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1076
  - number: 1076.1.A.e
    text: het arbitraal vonnis is vernietigd door een bevoegde autoriteit van het land waar dat vonnis is gewezen;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1076
  - number: 1076.1.B
    text: de rechter oordeelt dat de erkenning of tenuitvoerlegging strijdig is met de openbare orde.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1076
  - number: '1076.2'
    text: |-
      De grond onder A*a* van het eerste lid leidt niet tot weigering van erkenning of tenuitvoerlegging, indien de
      partij die zich daarop beroept, in het arbitraal geding is verschenen en heeft nagelaten voor alle weren een beroep
      te doen op de onbevoegdheid van het scheidsgerecht op grond dat een geldige overeenkomst tot arbitrage ontbreekt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1076
  - number: '1076.3'
    text: |-
      De grond onder A*b* van het eerste lid leidt niet tot weigering van erkenning of tenuitvoerlegging, indien de
      partij die zich daarop beroept, aan de samenstelling van het scheidsgerecht heeft medegewerkt of indien de partij
      die niet aan de samenstelling van het scheidsgerecht heeft medegewerkt, in het arbitraal geding is verschenen en
      heeft nagelaten voor alle weren een beroep te doen op de onbevoegdheid van het scheidsgerecht op de grond dat het
      scheidsgerecht in strijd met de daarvoor geldende regelen is samengesteld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1076
  - number: '1076.4'
    text: |-
      De grond [onder A][ref1][][ref2] leidt niet tot weigering van de erkenning of tenuitvoerlegging, indien de partij
      die deze aanvoert aan het geding heeft deelgenomen zonder daarop een beroep te doen, hoewel haar bekend was dat het
      scheidsgerecht zich niet aan zijn opdracht hield.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1076
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel1076
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1076
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1076'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '1076'
  - number: '1076.5'
    text: |-
      Is meer of anders toegewezen dan gevorderd, dan is het arbitraal vonnis voor gedeeltelijke erkenning of
      tenuitvoerlegging vatbaar voorzover het anders of meer toegewezene kan worden gescheiden van het overige gedeelte
      van het vonnis.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1076
  - number: '1076.6'
    text: |-
      De [artikelen 985 tot en met 991][ref1] zijn van overeenkomstige toepassing, met dien verstande dat de
      voorzieningenrechter van de rechtbank in de plaats treedt van de rechtbank, de termijn voor hoger beroep en beroep
      in cassatie twee maanden bedraagt en geen stukken behoeven te worden overlegd waaruit blijkt dat het arbitraal
      vonnis uitvoerbaar is in het land waar het is gewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel985
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1076
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '985'
        afdeling: Eerste
  - number: '1076.7'
    text: |-
      Indien de vernietiging van een in een vreemde Staat gewezen arbitraal vonnis is verzocht aan de bevoegde autoriteit
      van het land waar dat vonnis is gewezen, is, indien in Nederland de erkenning of tenuitvoerlegging wordt verzocht,
      [artikel 1066, tweede tot en met het zesde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1066
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1076
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1066'
        afdeling: Vijfde
  - number: '1077.1'
    text: |-
      De [Algemene termijnenwet][ref1] is niet van toepassing op de termijn gesteld in de
      [artikelen 443, eerste lid, eerste zin][ref2], en [479g, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002448
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel443
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel479g
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1077
    references:
      - id: ref1
        bwb_id: BWBR0002448
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '443'
        afdeling: Eerste
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 479g
        afdeling: Tweede_A
  - number: '1077.2'
    text: |-
      Voor de toepassing van de [Algemene termijnenwet][ref1] worden de termijnen, gesteld in de
      [artikelen 114 tot en met 116][ref2], als termijnen in de zin van [artikel 1, tweede lid, van die wet][ref3]
      aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel114
      [ref3]: https://wetten.overheid.nl/BWBR0002448#Artikel1
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1077
    references:
      - id: ref1
        bwb_id: BWBR0002448
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '114'
        afdeling: Vierde
      - id: ref3
        bwb_id: BWBR0002448
        artikel: '1'
  - number: '1077.3'
    text: |-
      Onder algemeen erkende feestdagen worden in dit wetboek verstaan de in
      [artikel 3 van de Algemene termijnenwet][ref1] als zodanig genoemde en de bij of krachtens dat artikel daarmede
      gelijkgestelde dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0002448#Artikel3
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1077
