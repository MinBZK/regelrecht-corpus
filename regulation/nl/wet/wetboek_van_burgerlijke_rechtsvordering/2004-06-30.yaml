articles:
  - number: '1'
    text: |-
      Onverminderd het omtrent rechtsmacht in verdragen en EG-verordeningen bepaalde wordt de rechtsmacht van de
      Nederlandse rechter beheerst door de volgende bepalingen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel1
  - number: '2'
    text: |-
      In zaken die bij dagvaarding moeten worden ingeleid, heeft de Nederlandse rechter rechtsmacht indien de gedaagde in
      Nederland zijn woonplaats of gewone verblijfplaats heeft.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel2
  - number: '3'
    text: 'In zaken die bij verzoekschrift moeten worden ingeleid, heeft de Nederlandse rechter rechtsmacht indien:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel3
  - number: 3.a
    text: |-
      hetzij de verzoeker of, indien er meer verzoekers zijn, een van hen, hetzij een van de in het verzoekschrift
      genoemde belanghebbenden in Nederland zijn woonplaats of gewone verblijfplaats heeft,
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel3
  - number: 3.b
    text: |-
      het verzoek betrekking heeft op een bij dagvaarding ingeleid of in te leiden geding ten aanzien waarvan de
      Nederlandse rechter rechtsmacht heeft, of
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel3
  - number: 3.c
    text: de zaak anderszins voldoende met de rechtssfeer van Nederland verbonden is.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel3
  - number: '4.1'
    text: |-
      Indien de [Verordening (EG) Nr. 1347/2000](32000R1347) van de Raad van 29 mei 2000 betreffende de bevoegdheid en
      de erkenning en tenuitvoerlegging van beslissingen in huwelijkszaken en inzake de ouderlijke verantwoordelijkheid
      voor gemeenschappelijke kinderen (PbEG L160/19) niet van toepassing is, wordt de rechtsmacht van de rechter met
      betrekking tot echtscheiding, scheiding van tafel en bed en ontbinding van het huwelijk na scheiding van tafel
      en bed, nietigverklaring, alsmede nietigheid en geldigheid van het huwelijk uitsluitend bepaald overeenkomstig de
      artikelen 2, 5 en 6 van deze verordening.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel4
  - number: '4.2'
    text: |-
      Heeft de Nederlandse rechter rechtsmacht met betrekking tot echtscheiding, scheiding van tafel en bed en ontbinding
      van het huwelijk na scheiding van tafel en bed, nietigheid, nietigverklaring of geldigheid van huwelijken, dan
      heeft hij, voorzover de in het eerste lid genoemde verordening daarop niet van toepassing is en onverminderd
      [artikel 1][ref1], tevens rechtsmacht tot het treffen van voorlopige en bewarende maatregelen voorzover die verband
      houden met echtscheiding, scheiding van tafel en bed en ontbinding van het huwelijk na scheiding van tafel en bed,
      nietigverklaring, alsmede nietigheid en geldigheid van huwelijken.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1'
        afdeling: Eerste
  - number: '4.3'
    text: |-
      Heeft de Nederlandse rechter rechtsmacht met betrekking tot echtscheiding, scheiding van tafel en bed en ontbinding
      van het huwelijk na scheiding van tafel en bed, nietigheid, nietigverklaring of geldigheid van huwelijken, dan
      heeft hij, voorzover de in het eerste lid genoemde verordening daarop niet van toepassing is en onverminderd
      [artikel 1][ref1], tevens rechtsmacht ter zake van daarmee verband houdende nevenvoorzieningen, met dien verstande


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1'
        afdeling: Eerste
  - number: 4.3.a
    text: |-
      dat met betrekking tot de voorzieningen als bedoeld in [artikel 827, eerste lid, onder d en e][ref1], de
      Nederlandse rechter uitsluitend rechtsmacht heeft als de woning in Nederland is gelegen, en


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel827
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '827'
        paragraaf: '3'
        afdeling: Tweede
  - number: 4.3.b
    text: |-
      dat met betrekking tot verzoeken tot regeling van het gezag en het omgangsrecht de Nederlandse rechter zich
      onbevoegd verklaart indien hij zich, wegens de geringe verbondenheid van de zaak met de rechtssfeer van Nederland,
      niet in staat acht het belang van het kind naar behoren te beoordelen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel4
  - number: '4.4'
    text: |-
      Met betrekking tot het geregistreerd partnerschap zijn het eerste tot en met het derde lid van overeenkomstige
      toepassing, met dien verstande dat de Nederlandse rechter steeds rechtsmacht heeft indien het geregistreerd
      partnerschap in Nederland is aangegaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel4
  - number: '5'
    text: |-
      De Nederlandse rechter heeft, onverminderd [artikel 1][ref1], in zaken betreffende ouderlijke verantwoordelijkheid
      en maatregelen ter bescherming van kinderen rechtsmacht indien het kind in Nederland zijn gewone verblijfplaats
      heeft, tenzij hij zich, in een uitzonderlijk geval, wegens onvoldoende verbondenheid van de zaak met de rechtssfeer
      van Nederland, niet in staat acht het belang van het kind naar behoren te beoordelen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1'
        afdeling: Eerste
  - number: '6'
    text: 'De Nederlandse rechter heeft eveneens rechtsmacht in zaken betreffende:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel6
  - number: 6.a
    text: |-
      verbintenissen uit overeenkomst, indien de verbintenis die aan de eis of het verzoek ten grondslag ligt, in
      Nederland is uitgevoerd of moet worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel6
  - number: 6.b
    text: |-
      een individuele arbeidsovereenkomst of een agentuurovereenkomst, indien de arbeid gewoonlijk in Nederland wordt
      verricht;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel6
  - number: 6.c
    text: |-
      een overeenkomst die wordt gesloten door een partij die handelt in de uitoefening van een beroep of bedrijf en een
      natuurlijke persoon die niet handelt in de uitoefening van een beroep of bedrijf, indien die natuurlijke persoon
      in Nederland zijn woonplaats of gewone verblijfplaats heeft, alsmede aldaar de voor de sluiting van de overeenkomst
      noodzakelijke handelingen heeft verricht;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel6
  - number: 6.d
    text: verbintenissen uit onrechtmatige daad, indien het schadebrengende feit zich in Nederland heeft voorgedaan;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel6
  - number: 6.e
    text: zakelijke rechten op, alsmede huur en verhuur, pacht en verpachting van in Nederland gelegen onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel6
  - number: 6.f
    text: nalatenschappen, indien de erflater zijn laatste woonplaats of gewone verblijfplaats in Nederland had;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel6
  - number: 6.g
    text: |-
      de geldigheid, de nietigheid of de ontbinding van in Nederland gevestigde vennootschappen of rechtspersonen;
      de geldigheid, nietigheid of rechtsgevolgen van hun besluiten of die van hun organen, dan wel de rechten en
      verplichtingen van hun leden of vennoten als zodanig;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel6
  - number: 6.h
    text: |-
      faillissement, surséance van betaling of schuldsaneringsregeling natuurlijke personen indien het faillissement, de
      surséance van betaling of de toepassing van de schuldsaneringsregeling in Nederland is uitgesproken of verleend.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel6
  - number: '7.1'
    text: |-
      Indien in zaken die bij dagvaarding moeten worden ingeleid de Nederlandse rechter ten aanzien van een van de
      gedaagden rechtsmacht heeft, komt hem deze ook toe ten aanzien van in hetzelfde geding betrokken andere gedaagden,
      mits tussen de vorderingen tegen de onderscheiden gedaagden een zodanige samenhang bestaat, dat redenen van
      doelmatigheid een gezamenlijke behandeling rechtvaardigen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel7
  - number: '7.2'
    text: |-
      Indien in zaken die bij dagvaarding moeten worden ingeleid de Nederlandse rechter rechtsmacht heeft, komt hem deze
      ook toe ten aanzien van een vordering in reconventie en ten aanzien van een vordering tot vrijwaring, voeging of
      tussenkomst, tenzij tussen deze vorderingen en de oorspronkelijke vordering onvoldoende samenhang bestaat.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel7
  - number: '8.1'
    text: |-
      De Nederlandse rechter heeft rechtsmacht indien partijen met betrekking tot een bepaalde rechtsbetrekking die tot
      hun vrije bepaling staat, bij overeenkomst een Nederlandse rechter of de Nederlandse rechter hebben aangewezen voor
      de kennisneming van geschillen welke naar aanleiding van die rechtsbetrekking zijn ontstaan of zullen ontstaan,
      tenzij daarvoor geen redelijk belang aanwezig is.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel8
  - number: '8.2'
    text: |-
      De Nederlandse rechter heeft geen rechtsmacht indien partijen met betrekking tot een bepaalde rechtsbetrekking
      die tot hun vrije bepaling staat, bij overeenkomst een rechter of de rechter van een vreemde staat bij uitsluiting
      hebben aangewezen voor de kennisneming van geschillen welke naar aanleiding van die rechtsbetrekking zijn ontstaan
      of zullen ontstaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel8
  - number: '8.3'
    text: 'Een overeenkomst als bedoeld in het tweede lid laat de rechtsmacht van de Nederlandse rechter onverlet, indien:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel8
  - number: 8.3.a
    text: |-
      die overeenkomst slechts is aangegaan ten behoeve van een van partijen en deze zich tot de Nederlandse rechter
      wendt, of
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel8
  - number: 8.3.b
    text: |-
      de zaak een individuele arbeidsovereenkomst betreft of een overeenkomst als bedoeld in [artikel 6, onder c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel6
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '6'
        afdeling: Eerste
  - number: '8.4'
    text: 'Het derde lid, aanhef en onder b, vindt geen toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel8
  - number: 8.4.a
    text: de in het tweede lid bedoelde overeenkomst is aangegaan na het ontstaan van het geschil, of
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel8
  - number: 8.4.b
    text: |-
      de werknemer, of de partij die niet handelt in de uitoefening van een beroep of bedrijf, zich op de overeenkomst
      beroept om zich tot de rechter van een vreemde staat te wenden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel8
  - number: '8.5'
    text: |-
      Een overeenkomst als bedoeld in het eerste of het tweede lid wordt bewezen door een geschrift. Daarvoor is
      voldoende een geschrift dat een dergelijk beding bevat of dat verwijst naar algemene voorwaarden die een dergelijk
      beding bevatten, mits dat geschrift door of namens de wederpartij uitdrukkelijk of stilzwijgend is aanvaard.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel8
  - number: '8.6'
    text: |-
      Een overeenkomst als bedoeld in het eerste of het tweede lid dient als een afzonderlijke overeenkomst te
      worden beschouwd en beoordeeld. De aangewezen rechter is bevoegd te oordelen over de rechtsgeldigheid van de
      hoofdovereenkomst waarvan een overeenkomst als bedoeld in het eerste of het tweede lid deel uitmaakt of waarop zij
      betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel8
  - number: '9'
    text: |-
      Komt de Nederlandse rechter niet op grond van de [artikelen 2 tot en met 8][ref1] rechtsmacht toe, dan heeft hij
      niettemin rechtsmacht indien:


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel2
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '2'
        afdeling: Eerste
  - number: 9.a
    text: |-
      het een rechtsbetrekking betreft die ter vrije bepaling van partijen staat en de gedaagde of belanghebbende in
      de procedure is verschenen niet uitsluitend of mede met het doel de rechtsmacht van de Nederlandse rechter te
      betwisten, tenzij voor rechtsmacht van de Nederlandse rechter geen redelijk belang aanwezig is,
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel9
  - number: 9.b
    text: een gerechtelijke procedure buiten Nederland onmogelijk blijkt, of
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel9
  - number: 9.c
    text: |-
      een zaak die bij dagvaarding moet worden ingeleid voldoende met de rechtssfeer van Nederland verbonden is en het
      onaanvaardbaar is van de eiser te vergen dat hij de zaak aan het oordeel van een rechter van een vreemde staat
      onderwerpt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel9
  - number: '10'
    text: |-
      De Nederlandse rechter heeft rechtsmacht in het geval, bedoeld in [artikel 767][ref1], alsmede indien dit
      voortvloeit uit andere wettelijke bepalingen tot aanwijzing van een bevoegde rechter dan die vervat in de derde
      afdeling van de tweede titel en de tweede afdeling van de derde titel.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel767
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '767'
        afdeling: Achtste
  - number: '11'
    text: |-
      Het verweer dat de Nederlandse rechter geen rechtsmacht heeft, wordt in zaken die bij dagvaarding moeten worden
      ingeleid op straffe van verval van het recht daartoe gevoerd vóór alle weren ten gronde.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel11
  - number: '12'
    text: |-
      Indien een zaak voor een rechter van een vreemde staat aanhangig is gemaakt en daarin een beslissing kan worden
      gegeven die voor erkenning en, in voorkomend geval, voor tenuitvoerlegging in Nederland vatbaar is, kan de
      Nederlandse rechter bij wie nadien een zaak tussen dezelfde partijen over hetzelfde onderwerp is aangebracht, de
      behandeling aanhouden totdat daarin door eerstbedoelde rechter is beslist. Indien die beslissing voor erkenning en,
      in voorkomend geval, voor tenuitvoerlegging in Nederland vatbaar blijkt te zijn, verklaart de Nederlandse rechter
      zich onbevoegd. Indien het een zaak betreft die bij dagvaarding moet worden ingeleid, is [artikel 11][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel11
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '11'
        afdeling: Eerste
  - number: '13'
    text: |-
      De bevoegdheid van de Nederlandse rechter tot het treffen van bewarende of voorlopige maatregelen kan niet worden
      betwist op de enkele grond dat hij met betrekking tot de zaak ten principale geen rechtsmacht heeft.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel13
  - number: '14'
    text: |-
      Voor de toepassing van de regels betreffende de rechtsmacht van de Nederlandse rechter wordt het Nederlandse
      gedeelte van het continentale plat gelijk gesteld met het grondgebied van Nederland.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel14
  - number: '15.1'
    text: |-
      Bij de rechtbank worden zaken, behoudens in de wet genoemde uitzonderingen, behandeld en beslist door een
      enkelvoudige kamer.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel15
  - number: '15.2'
    text: |-
      Indien de zaak naar het oordeel van de enkelvoudige kamer ongeschikt is voor behandeling en beslissing door één
      rechter, verwijst zij deze naar een meervoudige kamer, bestaande uit drie leden. De enkelvoudige kamer kan ook in
      andere gevallen een zaak naar een meervoudige kamer verwijzen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel15
  - number: '15.3'
    text: |-
      Verwijzing kan geschieden in elke stand van de procedure. De behandeling van een verwezen zaak wordt voortgezet in
      de stand waarin zij zich bevindt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel15
  - number: '15.4'
    text: |-
      De meervoudige kamer kan bepalen dat de behandeling geheel of gedeeltelijk zal geschieden door een uit haar
      midden aangewezen rechter-commissaris. De rechter-commissaris oefent daarbij de bevoegdheden uit, aan de rechtbank
      toegekend.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel15
  - number: '16.1'
    text: |-
      Bij het gerechtshof worden zaken, behoudens in de wet genoemde uitzonderingen, behandeld en beslist door een
      meervoudige kamer, bestaande uit drie raadsheren.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel16
  - number: '16.2'
    text: |-
      Tenzij de zaak in eerste aanleg door een meervoudige kamer is beslist, kan de meervoudige kamer naar
      een enkelvoudige kamer verwijzen de zaken die aanhangig zijn gemaakt ingevolge het bij of krachtens
      [Boek 1 van het Burgerlijk Wetboek][ref1] bepaalde en die naar haar oordeel daarvoor geschikt zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002656
  - number: '16.3'
    text: |-
      Indien de verwezen zaak naar het oordeel van de enkelvoudige kamer ongeschikt is voor behandeling en beslissing
      door één raadsheer, wijst zij deze terug naar de meervoudige kamer.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel16
  - number: '16.4'
    text: |-
      Verwijzing of terugwijzing kan geschieden in elke stand van de procedure. De behandeling van een verwezen of
      teruggewezen zaak wordt voortgezet in de stand waarin zij zich bevindt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel16
  - number: '16.5'
    text: |-
      De meervoudige kamer kan bepalen dat de behandeling geheel of gedeeltelijk zal geschieden door een uit haar midden
      aangewezen raadsheer-commissaris. De raadsheer-commissaris oefent daarbij de bevoegdheden uit, aan het gerechtshof
      toegekend.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel16
  - number: '17.1'
    text: |-
      Bij de Hoge Raad worden zaken, behoudens in de wet genoemde uitzonderingen, behandeld en beslist door vijf leden
      van de meervoudige kamer.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel17
  - number: '17.2'
    text: |-
      De voorzitter van de meervoudige kamer kan bepalen dat een zaak die daarvoor naar zijn oordeel geschikt is,
      wordt behandeld en beslist door drie leden van die kamer. Indien de zaak naar het oordeel van een van deze leden
      ongeschikt is voor behandeling en beslissing door drie leden, wordt de behandeling voortgezet door vijf leden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel17
  - number: '17.3'
    text: |-
      De leden kunnen bepalen dat de behandeling geheel of gedeeltelijk zal geschieden door een uit hun midden aangewezen
      raadsheer-commissaris. De raadsheer-commissaris oefent daarbij de bevoegdheden uit, aan de Hoge Raad toegekend.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel17
  - number: '18.1'
    text: |-
      De kamer bij welke een zaak in behandeling is, kan deze, met toestemming van het bestuur van het gerecht, verwijzen
      naar een andere kamer van gelijk getal. Tegen de verwijzing staat geen voorziening open.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel18
  - number: '18.2'
    text: |-
      Vonnissen, arresten en beschikkingen, gewezen onderscheidenlijk gegeven door een meervoudige kamer, kunnen worden
      uitgesproken door een enkelvoudige kamer.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel18
  - number: '19'
    text: |-
      De rechter stelt partijen over en weer in de gelegenheid hun standpunten naar voren te brengen en toe te lichten
      en zich uit te laten over elkaars standpunten en over alle bescheiden en andere gegevens die in de procedure ter
      kennis van de rechter zijn gebracht, een en ander tenzij uit de wet anders voortvloeit. Bij zijn beslissing baseert
      de rechter zijn oordeel, ten nadele van een der partijen, niet op bescheiden of andere gegevens waarover die partij
      zich niet voldoende heeft kunnen uitlaten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel19
  - number: '20.1'
    text: |-
      De rechter waakt tegen onredelijke vertraging van de procedure en treft, zo nodig, op verzoek van een partij of
      ambtshalve maatregelen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel20
  - number: '20.2'
    text: Partijen zijn tegenover elkaar verplicht onredelijke vertraging van de procedure te voorkomen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel20
  - number: '21'
    text: |-
      Partijen zijn verplicht de voor de beslissing van belang zijnde feiten volledig en naar waarheid aan te voeren.
      Wordt deze verplichting niet nageleefd, dan kan de rechter daaruit de gevolgtrekking maken die hij geraden acht.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel21
  - number: '22'
    text: |-
      De rechter kan in alle gevallen en in elke stand van de procedure partijen of een van hen bevelen bepaalde
      stellingen toe te lichten of bepaalde, op de zaak betrekking hebbende bescheiden over te leggen. Partijen kunnen
      dit weigeren indien daarvoor gewichtige redenen zijn. De rechter beslist of de weigering gerechtvaardigd is, bij
      gebreke waarvan hij daaruit de gevolgtrekking kan maken die hij geraden acht.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel22
  - number: '23'
    text: De rechter beslist over al hetgeen partijen hebben gevorderd of verzocht.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel23
  - number: '24'
    text: |-
      De rechter onderzoekt en beslist de zaak op de grondslag van hetgeen partijen aan hun vordering, verzoek of verweer
      ten gronde hebben gelegd, tenzij uit de wet anders voortvloeit.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel24
  - number: '25'
    text: De rechter vult ambtshalve de rechtsgronden aan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel25
  - number: '26'
    text: De rechter mag niet weigeren te beslissen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel26
  - number: '27.1'
    text: |-
      De terechtzitting is openbaar. De rechter kan evenwel gehele of gedeeltelijke behandeling met gesloten deuren of
      slechts met toelating van bepaalde personen bevelen:
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel27
  - number: 27.1.a
    text: in het belang van de openbare orde of de goede zeden,
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel27
  - number: 27.1.b
    text: in het belang van de veiligheid van de Staat,
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel27
  - number: 27.1.c
    text: indien de belangen van minderjarigen of de eerbiediging van de persoonlijke levenssfeer van partijen dit eisen, of
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel27
  - number: 27.1.d
    text: indien openbaarheid het belang van een goede rechtspleging ernstig zou schaden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel27
  - number: '27.2'
    text: Indien iemand op een terechtzitting de orde verstoort, kan de rechter hem laten verwijderen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel27
  - number: '28.1'
    text: De uitspraak geschiedt in het openbaar.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel28
  - number: '28.2'
    text: |-
      Onverminderd de [artikelen 231, eerste lid][ref1], en [290, derde lid][ref2], verstrekt de griffier aan een ieder
      die dat verlangt afschrift van vonnissen, arresten en beschikkingen, tenzij verstrekking naar het oordeel van de
      griffier ter bescherming van zwaarwegende belangen van anderen, waaronder die van partijen, geheel of gedeeltelijk
      dient te worden geweigerd. In het laatste geval kan de griffier volstaan met verstrekking van een geanonimiseerd
      afschrift of uittreksel van het vonnis, het arrest of de beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel231
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel290
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '231'
        paragraaf: '1'
        afdeling: Twaalfde
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '290'
        afdeling: Vierde
  - number: '28.3'
    text: |-
      Onder vonnissen, arresten en beschikkingen zijn begrepen stukken die aan de uitspraak zijn gehecht. Van andere tot
      een procesdossier behorende stukken wordt geen afschrift of uittreksel aan derden verstrekt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel28
  - number: '28.4'
    text: |-
      Van vonnissen, arresten en beschikkingen in zaken die met gesloten deuren zijn behandeld, wordt uitsluitend een
      geanonimiseerd afschrift of uittreksel verstrekt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel28
  - number: '28.5'
    text: |-
      Een verzoek om afschrift als bedoeld in het tweede lid dient te worden gericht tot de griffier van het gerecht dat
      de uitspraak heeft gedaan. Deze zal bij inwilliging van het verzoek een vergoeding in rekening brengen die wordt
      vastgesteld overeenkomstig [artikel 13, derde lid, van de Wet tarieven in burgerlijke zaken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001852#Artikel13
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001852
        artikel: '13'
  - number: '28.6'
    text: |-
      Gedurende twee weken na de dagtekening van een gehele of gedeeltelijke weigering om aan een verzoek om afschrift te
      voldoen, kan verzoeker daartegen schriftelijk in verzet komen bij de voorzieningenrechter.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel28
  - number: '28.7'
    text: Tegen de beslissing van de voorzieningenrechter staat geen voorziening open.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel28
  - number: '29.1'
    text: 'Het is aan partijen verboden aan derden mededelingen te doen omtrent:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel29
  - number: 29.1.a
    text: |-
      het verhandelde op een terechtzitting met gesloten deuren of een terechtzitting waarbij slechts bepaalde personen
      zijn toegelaten;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel29
  - number: 29.1.b
    text: andere gegevens uit een procedure, indien de rechter zulks heeft bepaald.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel29
  - number: '29.2'
    text: |-
      De rechter kan het verbod, bedoeld in het eerste lid, op verzoek van een der partijen geheel of gedeeltelijk
      opheffen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel29
  - number: '30'
    text: Vonnissen, arresten en beschikkingen houden de gronden in waarop zij rusten, tenzij uit de wet anders voortvloeit.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel30
  - number: '31.1'
    text: |-
      De rechter verbetert te allen tijde op verzoek van een partij of ambtshalve in zijn vonnis, arrest of beschikking
      een kennelijke rekenfout, schrijffout of andere kennelijke fout die zich voor eenvoudig herstel leent. De rechter
      gaat niet tot de verbetering over dan na partijen in de gelegenheid te hebben gesteld zich daarover uit te laten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel31
  - number: '31.2'
    text: |-
      De verbetering wordt op een door de rechter nader te bepalen dag uitgesproken en wordt met vermelding van deze
      dag en van de naleving van de tweede volzin van het eerste lid op de minuut van het vonnis, het arrest of de
      beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel31
  - number: '31.3'
    text: |-
      Van de verbeterde minuut verstrekt de griffier op de dag van de uitspraak aan de in de oorspronkelijke procedure
      verschenen partijen een afschrift, zo nodig opgemaakt in executoriale vorm. Een eerder verstrekt afschrift
      opgemaakt in executoriale vorm verliest hierdoor zijn kracht. De partij die in het bezit is van een afschrift
      als bedoeld in de vorige zin, geeft dit af aan de griffier. Was de executie reeds aangevangen, dan kan deze met
      inachtneming van de verbetering worden voortgezet op grond van een na de verbetering afgegeven afschrift opgemaakt
      in executoriale vorm.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel31
  - number: '31.4'
    text: Tegen de verbetering of de weigering daarvan staat geen voorziening open.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel31
  - number: '32.1'
    text: |-
      De rechter vult te allen tijde op verzoek van een partij zijn vonnis, arrest of beschikking aan indien hij heeft
      verzuimd te beslissen over een onderdeel van het gevorderde of verzochte. De rechter gaat niet tot de aanvulling
      over dan na partijen in de gelegenheid te hebben gesteld zich daarover uit te laten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel32
  - number: '32.2'
    text: |-
      [Artikel 31, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel31
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '31'
        afdeling: Derde
  - number: '32.3'
    text: Tegen de weigering van de aanvulling staat geen voorziening open.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel32
  - number: '33'
    text: |-
      Stukken die door middel van faxapparatuur vóór 24.00 uur van de laatste dag van een lopende termijn ter griffie
      zijn ontvangen, gelden als binnen de termijn ingediend.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel33
  - number: '34.1'
    text: |-
      Wanneer een procedure na verwijzing of na toepassing van een rechtsmiddel voor een andere rechter wordt voortgezet,
      is de aanlegger verplicht aan de rechter over te leggen:
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel34
  - number: 34.1.a
    text: |-
      een afschrift als bedoeld in [artikel 231][ref1] onderscheidenlijk [artikel 290][ref2] van het vonnis, het arrest
      of de beschikking waarbij de procedure is verwezen of waartegen het rechtsmiddel is aangewend;


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel231
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel290
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '231'
        paragraaf: '1'
        afdeling: Twaalfde
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '290'
        afdeling: Vierde
  - number: 34.1.b
    text: afschriften van de overige op de procedure betrekking hebbende stukken.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel34
  - number: '34.2'
    text: De rechter kan nadere aanwijzingen geven over het tijdstip van overlegging.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel34
  - number: '34.3'
    text: |-
      Wanneer een procedure na verwijzing of toepassing van een rechtsmiddel voor een andere rechter wordt voortgezet,
      zendt de griffier van het gerecht waar de procedure aanhangig was afschriften van de op de procedure betrekking
      hebbende stukken op diens verzoek aan de griffier van het gerecht waar de procedure wordt voortgezet. Desverzocht
      zendt de griffier de stukken in origineel.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel34
  - number: '35.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot door de rechter
      te stellen termijnen voor het verrichten van proceshandelingen en kunnen beperkingen worden gesteld aan de
      mogelijkheid om daarvoor uitstel te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel35
  - number: '35.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen ook andere nadere regels worden gesteld betreffende het verloop van de
      procedure, alsmede nadere regels ter bevordering van de eenheid van de wijze van rechtspleging bij de verschillende
      gerechten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel35
  - number: '36'
    text: |-
      Op verzoek van een partij kan elk van de rechters die een zaak behandelen, worden gewraakt op grond van feiten of
      omstandigheden waardoor de rechterlijke onpartijdigheid schade zou kunnen lijden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel36
  - number: '37.1'
    text: Het verzoek wordt gedaan zodra de feiten of omstandigheden aan de verzoeker bekend zijn geworden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel37
  - number: '37.2'
    text: |-
      Het verzoek geschiedt schriftelijk en is gemotiveerd. Na de aanvang van een terechtzitting kan het ook mondeling
      geschieden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel37
  - number: '37.3'
    text: Alle feiten of omstandigheden moeten tegelijk worden voorgedragen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel37
  - number: '37.4'
    text: |-
      Een volgend verzoek tot wraking van dezelfde rechter wordt niet in behandeling genomen, tenzij feiten of
      omstandigheden worden voorgedragen die pas na het eerdere verzoek aan de verzoeker bekend zijn geworden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel37
  - number: '37.5'
    text: Aanstonds na een verzoek tot wraking wordt de behandeling geschorst.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel37
  - number: '38'
    text: Een rechter van wie wraking is verzocht, kan in de wraking berusten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel38
  - number: '39.1'
    text: |-
      Het verzoek tot wraking wordt zo spoedig mogelijk ter terechtzitting behandeld door een meervoudige kamer waarin de
      rechter van wie wraking is verzocht, geen zitting heeft.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel39
  - number: '39.2'
    text: |-
      De verzoeker en de rechter van wie wraking is verzocht, worden in de gelegenheid gesteld te worden gehoord. De
      meervoudige kamer kan ambtshalve of op verzoek van de verzoeker of de rechter van wie wraking is verzocht, bepalen
      dat zij niet in elkaars aanwezigheid zullen worden gehoord.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel39
  - number: '39.3'
    text: |-
      De meervoudige kamer beslist zo spoedig mogelijk. De beslissing is gemotiveerd en wordt onverwijld in het openbaar
      uitgesproken en aan de verzoeker, de andere partijen en de rechter van wie wraking was verzocht, medegedeeld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel39
  - number: '39.4'
    text: |-
      In geval van misbruik kan de meervoudige kamer bepalen dat een volgend verzoek niet in behandeling wordt genomen.
      Hiervan wordt in de beslissing melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel39
  - number: '39.5'
    text: Tegen de beslissing staat geen voorziening open.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel39
  - number: '40.1'
    text: |-
      Op grond van feiten of omstandigheden als bedoeld in [artikel 36][ref1] kan elk van de rechters die een zaak
      behandelen, verzoeken zich te mogen verschonen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel36
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '36'
        afdeling: Vierde
  - number: '40.2'
    text: |-
      Het verzoek geschiedt schriftelijk en is gemotiveerd. Na de aanvang van een terechtzitting kan het ook mondeling
      geschieden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel40
  - number: '40.3'
    text: Aanstonds na een verzoek zich te mogen verschonen wordt de behandeling geschorst.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel40
  - number: '41.1'
    text: |-
      Het verzoek zich te mogen verschonen wordt zo spoedig mogelijk behandeld door een meervoudige kamer waarin de
      rechter die dat verzoek heeft gedaan, geen zitting heeft.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel41
  - number: '41.2'
    text: |-
      De meervoudige kamer beslist zo spoedig mogelijk. De beslissing is gemotiveerd en wordt onverwijld aan partijen en
      de rechter die het verzoek had gedaan, medegedeeld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel41
  - number: '41.3'
    text: Tegen de beslissing staat geen voorziening open.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel41
  - number: '42.1'
    text: |-
      Het openbaar ministerie is bevoegd alle op een zaak betrekking hebbende bescheiden in te zien en op elke
      terechtzitting tegenwoordig te zijn.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel42
  - number: '42.2'
    text: |-
      Het openbaar ministerie kan op verzoek van de rechter of een partij bescheiden waarover het beschikt, in de
      procedure brengen. Indien een zodanig verzoek niet wordt ingewilligd, wordt dit gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel42
  - number: '42.3'
    text: |-
      In zaken bij de Hoge Raad zijn het eerste en het tweede lid van toepassing, met dien verstande dat voor het
      openbaar ministerie wordt gelezen: de procureur-generaal bij de Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel42
  - number: '43.1'
    text: |-
      Wanneer het openbaar ministerie als partij optreedt, geschieden de inleiding en de behandeling van de zaak volgens
      de gewone regels, voor zover daarvan in dit artikel niet is afgeweken.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel43
  - number: '43.2'
    text: |-
      Het openbaar ministerie kan in rechte optreden zonder procureur. In cassatie is echter vertegenwoordiging door een
      advocaat vereist.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel43
  - number: '43.3'
    text: |-
      Hoger beroep en cassatie worden ingesteld door en tegen de ambtenaar van het openbaar ministerie bij het gerecht
      dat de beslissing waarvan beroep heeft genomen. Bij de verdere behandeling in hoger beroep treedt echter voor
      deze in de plaats de ambtenaar van het openbaar ministerie bij het college dat het hoger beroep behandelt. Bij de
      verdere behandeling in cassatie blijft als partij optreden de ambtenaar van het openbaar ministerie bij het gerecht
      dat de beslissing waarvan beroep heeft genomen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel43
  - number: '43.4'
    text: Een beslissing omtrent de kosten wordt ten aanzien van het openbaar ministerie genomen ten name van de Staat.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel43
  - number: '44.1'
    text: |-
      Wanneer het openbaar ministerie niet als partij optreedt, wordt het gehoord indien het, al dan niet op verzoek van
      de rechter, de wens daartoe te kennen heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel44
  - number: '44.2'
    text: In cassatieprocedures wordt de procureur-generaal bij de Hoge Raad steeds gehoord.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel44
  - number: '44.3'
    text: |-
      Na de conclusie van het openbaar ministerie, onderscheidenlijk de procureur-generaal bij de Hoge Raad, is geen
      plaats meer voor debat door partijen. Wel kunnen partijen binnen twee weken nadat de conclusie is genomen dan
      wel een afschrift daarvan aan partijen is verzonden, hun schriftelijk commentaar daarop, zo nodig in een brief
      vervat, aan de rechter, of, bij een meervoudige kamer, aan de voorzitter, of, bij de Hoge Raad, aan de President
      van de Hoge Raad doen toekomen, met afschrift aan de wederpartij en het openbaar ministerie, onderscheidenlijk de
      procureur-generaal.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel44
  - number: '45.1'
    text: Exploten worden door een daartoe bevoegde deurwaarder gedaan op de wijze in deze afdeling bepaald.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel45
  - number: '45.2'
    text: 'Het exploot vermeldt ten minste:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel45
  - number: 45.2.a
    text: de datum van de betekening;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel45
  - number: 45.2.b
    text: |-
      de naam, en in het geval van een natuurlijke persoon tevens de voornamen, en de woonplaats van degene op wiens
      verzoek de betekening geschiedt;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel45
  - number: 45.2.c
    text: de voornamen, de naam en het kantooradres van de deurwaarder;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel45
  - number: 45.2.d
    text: de naam en de woonplaats van degene voor wie het exploot is bestemd;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel45
  - number: 45.2.e
    text: degene aan wie afschrift van het exploot is gelaten, onder vermelding van diens hoedanigheid.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel45
  - number: '45.3'
    text: |-
      Indien het exploot een vordering tot ontruiming betreft van een gebouwde onroerende zaak of een gedeelte daarvan
      door anderen dan gebruikers of gewezen gebruikers krachtens een persoonlijk of zakelijk recht, van wie naam
      en woonplaats in redelijkheid niet kunnen worden achterhaald, behoeft het deze naam en deze woonplaats niet te
      vermelden, noch de persoon aan wie afschrift van het exploot is gelaten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel45
  - number: '45.4'
    text: Het exploot en de afschriften daarvan worden door de deurwaarder ondertekend.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel45
  - number: '46.1'
    text: |-
      De deurwaarder laat een afschrift van het exploot aan degene voor wie het is bestemd in persoon of aan de
      woonplaats aan een huisgenoot van deze of aan een andere persoon die zich daar bevindt en van wie aannemelijk is
      dat deze zal bevorderen dat het afschrift degene voor wie het exploot is bestemd, tijdig bereikt. Is het exploot
      voor meer personen bestemd, dan verstrekt hij voor ieder van hen een afschrift.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel46
  - number: '46.2'
    text: Voor degene voor wie het exploot is bestemd, geldt het afschrift als het oorspronkelijke exploot.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel46
  - number: '46.3'
    text: |-
      Indien degene voor wie het exploot is bestemd, weigert het afschrift in ontvangst te nemen, vermeldt de deurwaarder
      die weigering op het exploot en wordt degene voor wie het exploot is bestemd, geacht het afschrift in persoon
      te hebben ontvangen. Voorts laat de deurwaarder een afschrift in een gesloten envelop aan de woonplaats, dan wel
      verzendt hij een afschrift per post. Artikel 47, eerste lid, derde zin, en tweede lid, zijn van overeenkomstige
      toepassing..
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel46
  - number: '47.1'
    text: |-
      Indien de deurwaarder aan geen van de in [artikel 46, eerste lid][ref1], bedoelde personen afschrift kan laten,
      laat hij een afschrift aan de woonplaats achter in een gesloten envelop. Indien ook dat feitelijk onmogelijk is,
      bezorgt hij terstond een afschrift ter post. De deurwaarder maakt, zowel in het ene als het andere geval tevens
      onder vermelding van de reden van de feitelijke onmogelijkheid, van deze handelingen melding in het exploot.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel46
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '46'
        afdeling: Zesde
  - number: '47.2'
    text: |-
      Op de envelop waarin het afschrift ingevolge het eerste lid wordt achtergelaten of ter post wordt bezorgd, worden
      vermeld de naam en de woonplaats van degene voor wie het exploot is bestemd. De envelop vermeldt tevens de naam,
      de hoedanigheid, het kantooradres en het telefoonnummer van de deurwaarder, alsmede een aanduiding dat de inhoud de
      onmiddellijke aandacht behoeft.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel47
  - number: '48'
    text: |-
      Ten aanzien van de Koning, de vermoedelijke opvolger van de Koning, hun echtgenoten en de Regent, alsmede
      ten aanzien van de Staat, geschiedt de betekening aan het parket van de procureur-generaal bij de Hoge Raad.
      Indien afschrift van een voor de Staat bestemd exploot wordt gelaten aan een persoon ten parkette die daartoe
      is aangewezen, is het exploot gedaan aan de Staat in persoon. Indien mogelijk wordt in het exploot vermeld welk
      ministerie het betreft.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel48
  - number: '49'
    text: |-
      Ten aanzien van een rechtspersoon als bedoeld in [artikel 1 van Boek 2 van het Burgerlijk Wetboek](onbekend), met
      uitzondering van de Staat, geschiedt de betekening ter plaatse waar het bestuur zitting of kantoor houdt, of aan
      de persoon of de woonplaats van het hoofd van dat bestuur. Indien afschrift van het exploot wordt gelaten aan een
      bestuurder of aan een persoon die daartoe is aangewezen, is het exploot gedaan aan de rechtspersoon in persoon.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel49
  - number: '50'
    text: |-
      Ten aanzien van andere rechtspersonen geschiedt de betekening aan hun kantoor of aan de persoon of de woonplaats
      van een van de bestuurders. Na de ontbinding geschiedt zij aan het kantoor, de persoon of de woonplaats van een van
      de vereffenaars. Indien afschrift van het exploot wordt gelaten aan een bestuurder, of, na de ontbinding, aan een
      vereffenaar, is het exploot gedaan aan de rechtspersoon in persoon.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel50
  - number: '51.1'
    text: |-
      Ten aanzien van vennootschappen onder firma en commanditaire vennootschappen geschiedt de betekening aan hun
      kantoor of aan de persoon of de woonplaats van een van de beherende vennoten. Na de ontbinding geschiedt zij
      aan het kantoor, de persoon of de woonplaats van een van de vereffenaars. Indien afschrift van het exploot
      wordt gelaten aan een beherende vennoot, of, na de ontbinding, aan een vereffenaar, is het exploot gedaan aan de
      vennootschap in persoon.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel51
  - number: '51.2'
    text: Ten aanzien van maatschappen die een gemeenschappelijke naam voeren, geschiedt de betekening aan hun kantoor.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel51
  - number: '52'
    text: |-
      Ten aanzien van curatoren in een faillissement, bewindvoerders in een surséance van betaling dan wel in een
      schuldsaneringsregeling natuurlijke personen geschiedt de betekening aan het kantoor, de persoon of de woonplaats
      van een van hen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel52
  - number: '53'
    text: |-
      Bij een betekening ten aanzien van de gezamenlijke erfgenamen van een overledene kan vermelding van hun namen en
      woonplaatsen achterwege blijven indien deze geschiedt:
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel53
  - number: 53.a
    text: |-
      aan de laatste woonplaats van de overledene, mits aldaar nog de overlevende echtgenoot, geregistreerde partner of
      andere levensgezel, een broer, een zuster of een nabestaande in de rechte lijn woont,
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel53
  - number: 53.b
    text: |-
      aan de persoon of de woonplaats van een executeur of door de rechtbank benoemde vereffenaar van de nalatenschap,
      van een ten tijde van het overlijden fungerend curator of bewindvoerder, of, indien bij een dagvaarding verzet,
      hoger beroep of beroep in cassatie wordt ingesteld, aan het kantoor van de advocaat, procureur of deurwaarder bij
      wie de overledene laatstelijk woonplaats heeft gekozen, of
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel53
  - number: 53.c
    text: |-
      aan de persoon of de woonplaats van een van de erfgenamen, mits binnen een jaar na het overlijden, in welk geval
      het exploot tevens moet worden aangekondigd in een landelijk dagblad of een dagblad verschijnend in de streek waar
      de laatste woonplaats van de overledene was; een en ander onverminderd de mogelijkheid van betekening aan ieder van
      de erfgenamen afzonderlijk op de gewone wijze.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel53
  - number: '54.1'
    text: |-
      Ten aanzien van hen die geen bekende woonplaats in Nederland hebben, geschiedt de betekening ter plaatse van hun
      werkelijk verblijf.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel54
  - number: '54.2'
    text: |-
      Indien de woonplaats en het werkelijk verblijf onbekend zijn en het exploot een te voeren of aanhangige procedure
      betreft, alsmede indien in rechte worden opgeroepen houders van aandelen of andere effecten, welke niet op naam
      staan of waarvan de houders niet bij name bekend zijn, geschiedt de betekening aan het parket van de ambtenaar
      van het openbaar ministerie bij het gerecht waar de zaak moet dienen of dient. Indien de zaak dient of moet dienen
      bij de Hoge Raad, geschiedt de betekening aan het parket van de procureur-generaal bij de Hoge Raad. Voorts wordt
      een uittreksel van het exploot zo spoedig mogelijk bekend gemaakt in een landelijk dagblad of in een dagblad
      verschijnend in de streek waar voormeld gerecht zitting houdt onder vermelding van naam en kantooradres van de
      deurwaarder of van de advocaat van wie afschrift van het exploot kan worden verkregen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel54
  - number: '54.3'
    text: |-
      Gelijkelijk wordt gehandeld ten aanzien van rechtspersonen, bestaande of ontbonden, bij gebreke van kantoor,
      bestuurder of vereffenaar, of wanneer de bestuurder of vereffenaar geen bekend kantoor, bekende woonplaats of
      bekend werkelijk verblijf heeft.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel54
  - number: '54.4'
    text: |-
      Indien het exploot niet een te voeren of aanhangige procedure betreft, geschiedt de betekening aan het parket
      van de ambtenaar van het openbaar ministerie bij de rechtbank binnen het rechtsgebied waarvan de verzoeker zijn
      woonplaats of, bij gebreke daarvan, zijn werkelijk verblijf heeft, terwijl een uittreksel van het exploot voorts
      bekend wordt gemaakt in een landelijk dagblad of in een dagblad verschijnend in de streek waar de verzoeker
      woonplaats of werkelijk verblijf heeft, onder vermelding van naam en kantooradres van de deurwaarder of van
      de advocaat van wie afschrift van het exploot kan worden verkregen. Heeft de verzoeker geen bekende woonplaats
      of bekend werkelijk verblijf in Nederland, dan geschiedt de betekening aan het parket van de ambtenaar van het
      openbaar ministerie bij de rechtbank te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel54
  - number: '54.5'
    text: |-
      Indien het exploot ten verzoeke van de ene echtgenoot of geregistreerde partner aan de andere wordt gedaan, houdt
      het de naam van de raadsman van die andere echtgenoot of geregistreerde partner in, indien deze bekend is.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel54
  - number: '55.1'
    text: |-
      Ten aanzien van hen die geen bekende woonplaats of bekend werkelijk verblijf in Nederland hebben, maar van
      wie de woonplaats of het werkelijk verblijf buiten Nederland bekend is, geschiedt de betekening aan het
      parket van de ambtenaar van het openbaar ministerie, onderscheidenlijk de procureur-generaal, bedoeld in
      [artikel 54, tweede en vierde lid][ref1], die een afschrift van het exploot ten behoeve van degene voor wie het
      bestemd is, toezendt aan het Ministerie van Buitenlandse Zaken of, indien de woonplaats of het werkelijk verblijf
      van de betrokkene zich in de Nederlandse Antillen of op Aruba bevindt, aan het Kabinet van de Gevolmachtigd
      Minister van de Nederlandse Antillen respectievelijk van Aruba in Nederland. Een tweede afschrift wordt door
      de deurwaarder per aangetekende brief onverwijld toegezonden aan de woonplaats of het werkelijk verblijf van de
      betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel54
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '54'
        afdeling: Zesde
  - number: '55.2'
    text: |-
      Heeft degene voor wie het exploot bestemd is, een bekende woonplaats of een bekend werkelijk verblijf buiten
      Nederland in een Staat die partij is bij het op 15 november 1965 te 's-Gravenhage tot stand gekomen Verdrag inzake
      de betekening en de kennisgeving in het buitenland van gerechtelijke en buitengerechtelijke stukken in burgerlijke
      en in handelszaken (Trb. 1966, 91) en ontvangt deze het afschrift op een wijze die aldaar wordt aangemerkt als
      betekening in persoon, dan wordt het exploot geacht te zijn gedaan aan hem in persoon.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel55
  - number: '56.1'
    text: |-
      Voorzover nodig in afwijking van hetgeen elders in deze afdeling is bepaald, geschiedt de betekening ten aanzien
      van hen die geen bekende woonplaats of bekend werkelijk verblijf in Nederland hebben, maar wel een bekende
      woonplaats of bekend werkelijk verblijf hebben in een Staat waar de [verordening (EG) nr. 1348/2000](32000R1348)
      van de Raad van de Europese Unie van 29 mei 2000 inzake de betekening en de kennisgeving in de lidstaten van
      gerechtelijke en buitengerechtelijke stukken in burgerlijke of in handelszaken (PbEG L 160/37) van toepassing is,
      met inachtneming van het tweede tot en met vierde lid.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel56
  - number: '56.2'
    text: |-
      Een deurwaarder die is aangewezen als verzendende instantie als bedoeld in artikel 2, eerste lid, van de
      verordening, verzendt een afschrift van het te betekenen stuk aan een ontvangende instantie als bedoeld in artikel
      2, tweede lid, van de verordening ter betekening aan degene voor wie het stuk bestemd is. In plaats van een
      afschrift kan de deurwaarder ook een vertaling van het stuk verzenden in een taal als bedoeld in artikel 8, eerste
      lid onder a, van de verordening. De gerechtsdeurwaarder maakt in het stuk melding van de verzending, alsmede van de
      volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel56
  - number: 56.2.a
    text: de datum van verzending;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel56
  - number: 56.2.b
    text: de naam en het adres van de ontvangende instantie;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel56
  - number: 56.2.c
    text: de wijze van verzending;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel56
  - number: 56.2.d
    text: of een vertaling is verzonden en, zo ja, in welke taal;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel56
  - number: 56.2.e
    text: de taal waarin het formulier als bedoeld in artikel 4, derde lid, van de verordening is ingevuld;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel56
  - number: 56.2.f
    text: de gevraagde wijze van betekening.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel56
  - number: '56.3'
    text: |-
      Wanneer de betekening binnen een bepaalde termijn moet worden verricht, wordt ten aanzien van degene op wiens
      verzoek de betekening geschiedt, de datum van verzending overeenkomstig het tweede lid in aanmerking genomen als de
      datum van betekening. Wordt een dagvaarding overeenkomstig [artikel 63, eerste lid][ref1], betekend aan het kantoor
      van de advocaat, procureur of deurwaarder bij wie degene voor wie de dagvaarding is bestemd, laatstelijk woonplaats
      heeft gekozen, dan wordt ter bepaling of tijdig verzet, hoger beroep, onderscheidenlijk beroep in cassatie is
      ingesteld de datum van die betekening in aanmerking genomen, mits de deurwaarder tevens een afschrift van de
      dagvaarding, of een vertaling daarvan in een taal als bedoeld in artikel 8, eerste lid onder a, van de verordening,
      aan een ontvangende instantie als bedoeld in artikel 2, tweede lid, van de verordening zendt ter betekening aan
      de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel63
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '63'
        afdeling: Zesde
  - number: '56.4'
    text: |-
      Ontvangt degene voor wie het stuk bestemd is het afschrift of de vertaling op een wijze die in de desbetreffende
      Staat wordt aangemerkt als betekening in persoon, dan wordt het stuk geacht te zijn betekend aan hem in persoon.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel56
  - number: '57.1'
    text: |-
      Ten aanzien van hem die met degene ten verzoeke van wie het exploot wordt gedaan de woning deelt, geschiedt de
      betekening aan hem in persoon.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel57
  - number: '57.2'
    text: |-
      Indien betekening in persoon niet kan geschieden, handelt de deurwaarder overeenkomstig [artikel 47][ref1] en doet
      hij bovendien een afschrift van het exploot toekomen aan het parket van de ambtenaar van het openbaar ministerie
      bij het gerecht waarvoor de zaak moet dienen of dient, dan wel, indien het exploot niet een te voeren of aanhangige
      procedure betreft, bij de rechtbank binnen welker rechtsgebied de woning gelegen is. Indien de zaak dient of
      moet dienen bij de Hoge Raad, geschiedt de betekening aan het parket van de procureur-generaal bij de Hoge Raad.
      De ambtenaar van het openbaar ministerie, onderscheidenlijk de procureur-generaal, bevordert dat het exploot de
      betrokkene bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel47
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '47'
        afdeling: Zesde
  - number: '58'
    text: |-
      Ten aanzien van de eigenaar en ten aanzien van de leden dan wel de boekhouder van een rederij van een schip dat in
      het in [artikel 193](onbekend) of [artikel 783 van Boek 8 van het Burgerlijk Wetboek](onbekend) genoemde register
      teboekstaat, indien het exploot het schip dan wel een in of krachtens [Boek 8 van het Burgerlijk Wetboek][ref1]
      geregeld onderwerp betreft, geschiedt de betekening aan de in [artikel 194, zesde lid](onbekend), of [artikel 784,
      zevende lid, van Boek 8](onbekend) genoemde woonplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0005034
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0005034
  - number: '59'
    text: |-
      Ten aanzien van de opvarenden van een schip die geen bekende woonplaats in Nederland hebben en die noch aan boord
      van dat schip, noch elders worden aangetroffen, geschiedt de betekening, indien het exploot het schip of een in
      of krachtens [Boek 8 van het Burgerlijk Wetboek][ref1] geregeld onderwerp betreft, aan boord aan de kapitein of de
      schipper van dat schip.


      [ref1]: https://wetten.overheid.nl/BWBR0005034
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005034
  - number: '60'
    text: |-
      Ten aanzien van de eigenaar van een luchtvaartuig dat in het in [artikel 1302 van Boek 8 van het Burgerlijk
      Wetboek](onbekend) bedoelde register teboekstaat, geschiedt de betekening, indien het exploot het luchtvaartuig dan
      wel een in of krachtens [Boek 8 van het Burgerlijk Wetboek][ref1] geregeld onderwerp betreft, aan de in [artikel
      1303, zesde lid, van Boek 8 van het Burgerlijk Wetboek](onbekend) genoemde woonplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0005034
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005034
  - number: '61'
    text: |-
      Ten aanzien van hen die verblijven in een gebouwde onroerende zaak of een gedeelte daarvan, indien het exploot een
      vordering tot ontruiming daarvan door anderen dan gebruikers of gewezen gebruikers krachtens een persoonlijk of
      zakelijk recht betreft, zonder dat de naam en de woonplaats van degenen voor wie het exploot is bestemd, alsmede
      de persoon aan wie afschrift wordt gelaten, worden vermeld, geschiedt de betekening op de wijze als vermeld
      in [artikel 47][ref1], met dien verstande dat voor «aan de woonplaats» in het eerste lid van dat artikel wordt
      gelezen: ter plaatse, en dat degenen voor wie het exploot bestemd is, daarin en op de envelop waarin een afschrift
      wordt achtergelaten of ter post wordt bezorgd, worden aangeduid als: zij die verblijven in de desbetreffende
      onroerende zaak of een gedeelte daarvan. Voorts wordt een uittreksel van het exploot zo spoedig mogelijk bekend
      gemaakt in een landelijk dagblad of in een dagblad verschijnend in de streek waarin de onroerende zaak gelegen is,
      onder vermelding van naam en kantooradres van de deurwaarder of van de advocaat van wie afschrift van het exploot
      kan worden verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel47
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '47'
        afdeling: Zesde
  - number: '62'
    text: |-
      Ten aanzien van hen die algemene voorwaarden gebruiken waarin bedingen voorkomen waarvan gesteld wordt dat zij
      onredelijk bezwarend zijn, geschiedt, indien ingevolge [artikel 1003, onder 1°][ref1], hun naam en woonplaats niet
      afzonderlijk in het exploot worden vermeld, de betekening aan het parket van de procureur-generaal bij het gerecht
      waar de zaak aanhangig wordt gemaakt, is of laatstelijk was, terwijl een uittreksel van het exploot zo spoedig
      mogelijk bekend wordt gemaakt in een landelijk dagblad onder vermelding van naam en kantooradres van de deurwaarder
      of van de advocaat van wie afschrift van het exploot kan worden verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1003
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1003'
  - number: '63.1'
    text: |-
      Een exploot waarbij verzet wordt gedaan of waarbij hoger beroep of beroep in cassatie wordt ingesteld, kan ook
      worden gedaan aan het kantoor van de advocaat, procureur of deurwaarder bij wie degene voor wie het exploot is
      bestemd, laatstelijk ter zake woonplaats heeft gekozen. Deze advocaat, procureur of deurwaarder bevordert dat het
      exploot degene voor wie het is bestemd, tijdig bereikt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel63
  - number: '63.2'
    text: |-
      Aan een in verband met executie volgens wettelijk voorschrift gekozen woonplaats kunnen alle exploten worden
      gedaan, zelfs van verzet, hoger beroep en cassatie.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel63
  - number: '64.1'
    text: Geen exploot mag worden gedaan tussen acht uur 's avonds en zeven uur 's ochtends.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel64
  - number: '64.2'
    text: |-
      Evenmin mag een exploot worden gedaan op een zondag of een algemeen erkende feestdag. Indien de laatste dag van
      de termijn, waarbinnen het exploot kan worden gedaan, op een zondag of een algemeen erkende feestdag valt, kan het
      exploot de daarop volgende dag worden gedaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel64
  - number: '64.3'
    text: |-
      De voorzieningenrechter of, in kantonzaken, de kantonrechter van het gerecht, waarvoor bij dat exploot wordt
      gedagvaard of opgeroepen, en in alle andere gevallen de voorzieningenrechter van de rechtbank binnen het
      rechtsgebied waarvan het exploot wordt uitgebracht, kan, in afwijking van het eerste en tweede lid, verlof verlenen
      het exploot uit te brengen op alle dagen en uren.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel64
  - number: '65'
    text: |-
      Een exploot of akte van rechtspleging kan slechts nietig worden verklaard, indien dit exploot of deze akte lijdt
      aan een gebrek dat uitdrukkelijk met nietigheid is bedreigd of indien de nietigheid voortvloeit uit de aard van
      het gebrek.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel65
  - number: '66.1'
    text: |-
      De niet-naleving van hetgeen in deze afdeling is voorgeschreven, brengt slechts nietigheid mee voor zover
      aannemelijk is dat degene voor wie het exploot is bestemd, door het gebrek onredelijk is benadeeld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel66
  - number: '66.2'
    text: |-
      Een gebrek in een exploot dat nietigheid meebrengt, kan, tenzij uit de wet anders voortvloeit, bij exploot worden
      hersteld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel66
  - number: '67.1'
    text: |-
      Indien de rechter inlichtingen wil inwinnen overeenkomstig artikel 3 van de op 7 juni 1968 te Londen gesloten
      Europese Overeenkomst nopens het verstrekken van inlichtingen over buitenlands recht (Trb. 1968, 142), doet hij aan
      partijen schriftelijk opgave van de te stellen vragen en de te verzenden stukken.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel67
  - number: '67.2'
    text: |-
      Partijen kunnen binnen een door de rechter te bepalen termijn schriftelijk hun mening omtrent de te stellen vragen
      en de te verzenden stukken geven.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel67
  - number: '67.3'
    text: |-
      Met inachtneming van artikel 4 van de Overeenkomst stelt de rechter de inhoud van het verzoek om inlichtingen in
      een tussenbeslissing vast.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel67
  - number: '67.4'
    text: |-
      Tegen deze tussenbeslissing staat geen voorziening open, voor zover het de inhoud van de te stellen vragen en de te
      verzenden stukken betreft.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel67
  - number: '67.5'
    text: |-
      Indien aan de rechter op grond van artikel 13 van de Overeenkomst aanvullende inlichtingen worden gevraagd, stelt
      hij partijen in de gelegenheid binnen een door hem te bepalen termijn schriftelijk op dit verzoek te reageren.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel67
  - number: '68.1'
    text: |-
      De griffier zendt een afschrift van het antwoord op het verzoek om inlichtingen aan partijen. Alsdan bepaalt de
      rechter de dag waarop de procedure wordt voortgezet.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel68
  - number: '68.2'
    text: Partijen kunnen binnen een door de rechter te bepalen termijn hun beschouwingen over het antwoord geven.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel68
  - number: '69.1'
    text: |-
      Indien een procedure met een verzoekschrift is ingeleid in plaats van met een dagvaarding of met een dagvaarding in
      plaats van met een verzoekschrift, beveelt de rechter, zo nodig, de aanlegger binnen een door de rechter te bepalen
      termijn op kosten van de aanlegger het stuk waarmee de procedure is ingeleid, te verbeteren of aan te vullen. De
      procedure is aanhangig vanaf de oorspronkelijke dag van indiening of dagvaarding.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel69
  - number: '69.2'
    text: |-
      De rechter beveelt voorts, zo nodig met verwijzing naar een andere kamer, dat de procedure in de stand waarin
      zij zich bevindt wordt voortgezet volgens de regels die gelden voor de dagvaardingsprocedure respectievelijk de
      verzoekschriftprocedure.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel69
  - number: '69.3'
    text: |-
      Beveelt de rechter dat de procedure wordt voortgezet volgens de regels die gelden voor de dagvaardingsprocedure,
      dan bepaalt hij tevens een dag waarop de zaak op de rol zal komen. Heeft nog geen oproeping van de verweerder
      plaatsgevonden, dan beveelt hij dat deze dag door de aanlegger bij exploot aan de verweerder wordt aangezegd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel69
  - number: '69.4'
    text: |-
      De rechter stelt partijen, zo nodig, in de gelegenheid hun stellingen aan de dan toepasselijke procesregels aan
      te passen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel69
  - number: '69.5'
    text: Tegen een beslissing ingevolge het eerste, tweede, derde of vierde lid staat geen hogere voorziening open.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel69
  - number: '70.1'
    text: |-
      Voor zover de rechter de aanlegger in zijn vordering of verzoek niet-ontvankelijk verklaart omdat bezwaar kon
      worden gemaakt, administratief beroep kon worden ingesteld of beroep bij een administratieve rechter kon worden
      ingesteld, wordt dit in het vonnis, het arrest of de beschikking vermeld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel70
  - number: '70.2'
    text: |-
      Indien de niet-ontvankelijkheid voor de aanlegger onduidelijk kon zijn, vermeldt de rechter tevens in het vonnis,
      het arrest of de beschikking bij welk orgaan alsnog bezwaar kan worden gemaakt of alsnog beroep kan worden
      ingesteld. Het orgaan waarbij alsnog bezwaar kan worden gemaakt of alsnog beroep kan worden ingesteld, is aan die
      beslissing gebonden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel70
  - number: '70.3'
    text: |-
      De termijn voor het alsnog indienen van het bezwaar- of beroepschrift vangt aan met ingang van de dag na die waarop
      het vonnis, het arrest of de beschikking onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel70
  - number: '71.1'
    text: |-
      Moet een zaak, in behandeling bij de kantonrechter, verder worden behandeld en beslist door een kamer die niet
      tot de sector kanton behoort, dan wordt de zaak daartoe op verlangen van een der partijen of ambtshalve naar een
      zodanige kamer verwezen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel71
  - number: '71.2'
    text: |-
      Moet een zaak, in behandeling bij een kamer die niet tot de sector kanton behoort, verder worden behandeld en
      beslist door de kantonrechter, dan wordt de zaak daartoe op verlangen van een der partijen of ambtshalve verwezen
      naar een kamer die tot de sector kanton behoort.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel71
  - number: '71.3'
    text: |-
      De vraag of verwijzing nodig is beoordeelt de rechter, voor zover daarvoor het onderwerp van het geschil bepalend
      is, aan de hand van zijn voorlopig oordeel over het onderwerp van het geschil.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel71
  - number: '71.4'
    text: |-
      In de beslissing tot verwijzing vermeldt de rechter op welke wijze partijen in de procedure moeten verschijnen.
      In het geval van een dagvaardingsprocedure vermeldt de rechter tevens een nieuwe roldatum en beveelt hij, indien
      tegen de gedaagde verstek is verleend, dat deze door de eiser bij exploot aan de gedaagde wordt aangezegd onder
      betekening van de beslissing tot verwijzing.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel71
  - number: '71.5'
    text: |-
      Tegen een verwijzing en tegen het achterwege laten van verwijzing staat geen voorziening open. De rechter naar wie
      de zaak is verwezen, is aan de verwijzing gebonden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel71
  - number: '72'
    text: |-
      Indien een zaak niet behoort tot de absolute bevoegdheid van de rechter, verklaart deze zich, zo nodig ambtshalve,
      onbevoegd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel72
  - number: '73'
    text: |-
      Verklaart de rechter zich onbevoegd en is een andere gewone rechter wel bevoegd, dan verwijst hij de zaak naar
      deze rechter.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel73
  - number: '74.1'
    text: |-
      Betreft de verwijzing een zaak die bij dagvaarding moet worden ingeleid, dan heeft iedere partij het recht de
      overige partijen bij exploot op te roepen tegen de dag waarop zij de zaak ter rolle wil doen dienen. Voor deze
      oproeping moeten de voor dagvaarding voorgeschreven termijnen in acht worden genomen. Het exploot kan ook worden
      gedaan aan het kantoor van de advocaat, procureur of deurwaarder bij wie degene voor wie het exploot bestemd is,
      laatstelijk ter zake woonplaats heeft gekozen. Deze advocaat, procureur of deurwaarder bevordert dat het exploot
      degene voor wie het is bestemd, tijdig bereikt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel74
  - number: '74.2'
    text: |-
      Betreft de verwijzing een zaak die met een verzoekschrift moet worden ingeleid, dan zendt de griffier een afschrift
      van de beschikking aan de rechter naar wie de zaak is verwezen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel74
  - number: '74.3'
    text: |-
      De procedure wordt, in de stand waarin zij zich bij de verwijzing bevindt, voortgezet voor de rechter naar wie de
      zaak is verwezen. Een lagere rechter is aan de verwijzing gebonden, een hogere rechter niet.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel74
  - number: '75.1'
    text: |-
      Tegen een arrest of beschikking waarbij de rechter zich onbevoegd verklaart en de zaak verwijst naar een lagere
      rechter, kan beroep in cassatie slechts worden ingesteld binnen acht weken, te rekenen van de dag van de uitspraak
      van het arrest of de beschikking.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel75
  - number: '75.2'
    text: |-
      Tegen een vonnis of beschikking waarbij de rechter zich onbevoegd verklaart en de zaak verwijst naar een hogere
      rechter, is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel75
  - number: '76'
    text: |-
      Indien de rechter in hoger beroep een vonnis of beschikking van een lagere rechter, waarbij deze zich onbevoegd had
      verklaard, vernietigt, verwijst de rechter de zaak naar deze lagere rechter om op de hoofdzaak te worden beslist,
      tenzij partijen verklaren te verlangen dat de rechter in beroep de zaak aan zich houdt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel76
  - number: '77.1'
    text: |-
      In alle procedures waarin de Koning als eiser of als verzoeker optreedt, wordt de zaak ingeleid en voortgezet ten
      name van en door een door hem aan te wijzen gemachtigde.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel77
  - number: '77.2'
    text: |-
      Alle procedures tegen de Koning worden voortgezet ten name van een door hem aan te wijzen gemachtigde. Betreft het
      een zaak die bij dagvaarding moet worden ingeleid, dan wordt, indien de gemachtigde niet in het geding opkomt en
      indien daartoe gronden zijn, het verstek verleend en vonnis gewezen ten name van de procureur-generaal bij de Hoge
      Raad.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel77
  - number: '78.1'
    text: |-
      Deze titel is van toepassing op alle zaken waarop niet ingevolge [artikel 261][ref1] de derde titel van toepassing
      is, en voor zover daarop niet een andere, bijzondere wettelijke regeling van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel261
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '261'
        afdeling: Eerste
  - number: '78.2'
    text: |-
      De zaken, bedoeld in het eerste lid, worden elders in dit wetboek aangeduid als: zaken die bij dagvaarding moeten
      worden ingeleid.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel78
  - number: '79.1'
    text: Partijen kunnen in zaken voor de kantonrechter in persoon procederen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel79
  - number: '79.2'
    text: |-
      In alle overige zaken kunnen partijen niet in persoon procederen, maar slechts bij procureur. Zij worden geacht tot
      aan het eindvonnis bij de gestelde procureur woonplaats te hebben gekozen, tenzij zij hebben verklaard een andere
      woonplaats te hebben gekozen. Zij kunnen de door hen gestelde procureur niet herroepen zonder tevens een andere
      procureur te stellen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel79
  - number: '80.1'
    text: |-
      In zaken waarin partijen in persoon kunnen procederen, kunnen zij zich laten bijstaan of zich door een gemachtigde
      laten vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel80
  - number: '80.2'
    text: De kantonrechter kan van een gemachtigde overlegging van een schriftelijke volmacht verlangen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel80
  - number: '80.3'
    text: Het tweede lid is niet van toepassing op advocaten, procureurs en deurwaarders.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel80
  - number: '80.4'
    text: |-
      Partijen worden geacht tot aan het eindvonnis bij de gemachtigde woonplaats te hebben gekozen, tenzij zij hebben
      verklaard een andere woonplaats te hebben gekozen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel80
  - number: '81.1'
    text: |-
      De kantonrechter kan bij met redenen omklede beschikking bijstand of vertegenwoordiging door een persoon tegen wie
      ernstige bezwaren bestaan en die geen advocaat, procureur of deurwaarder is, weigeren. De weigering geldt voor een
      bepaalde zaak of voor een door de kantonrechter te bepalen tijd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel81
  - number: '81.2'
    text: |-
      De weigering wordt aan de desbetreffende partij en aan de in het eerste lid bedoelde persoon schriftelijk
      meegedeeld met vermelding van de reden van de weigering. Tevens stelt de kantonrechter de partij in de gelegenheid
      een andere persoon aan te wijzen. Daartoe houdt hij de zaak zo nodig aan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel81
  - number: '81.3'
    text: De kantonrechter kan bepalen dat een beschikking, op grond van het eerste lid gegeven, uitvoerbaar bij voorraad is.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel81
  - number: '81.4'
    text: |-
      De persoon die is geweigerd, kan binnen vier weken na de verzending van de beschikking in beroep komen bij het
      gerechtshof.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel81
  - number: '81.5'
    text: |-
      Het gerechtshof beslist na de betrokken kantonrechter te hebben uitgenodigd de nodige inlichtingen te verstrekken
      en na de appellant te hebben gehoord.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel81
  - number: '82.1'
    text: |-
      In zaken waarin partijen in persoon kunnen procederen, worden conclusies en akten genomen ter terechtzitting, dan
      wel door indiening ter griffie vóór de roldatum.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel82
  - number: '82.2'
    text: In deze zaken kunnen conclusies en akten ook mondeling ter terechtzitting worden genomen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel82
  - number: '82.3'
    text: |-
      In zaken waarin partijen niet in persoon kunnen procederen, worden, indien op de roldatum een terechtzitting
      plaatsvindt, conclusies en akten ter terechtzitting genomen. Indien niet een terechtzitting plaatsvindt, worden
      conclusies en akten op de roldatum genomen door indiening ter griffie vóór of op de roldatum.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel82
  - number: '83.1'
    text: |-
      In zaken waarin partijen in persoon kunnen procederen, worden de conclusies en akten, wanneer zij niet mondeling
      worden genomen, ondertekend door de partij van wie het stuk afkomstig is of door haar gemachtigde.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel83
  - number: '83.2'
    text: In zaken waarin partijen niet in persoon kunnen procederen, worden deze stukken ondertekend door de procureur.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel83
  - number: '84.1'
    text: Conclusies en akten worden, wanneer zij ter terechtzitting worden genomen, aan de griffier verstrekt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel84
  - number: '84.2'
    text: |-
      In zaken waarin partijen in persoon kunnen procederen, zendt de griffier zo spoedig mogelijk een afschrift van deze
      stukken aan de wederpartij, voor zover dit afschrift niet reeds aan haar of aan haar gemachtigde ter terechtzitting
      is overhandigd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel84
  - number: '84.3'
    text: |-
      Indien mondeling is geconcludeerd zonder dat de wederpartij of haar gemachtigde daarbij aanwezig was, zendt de
      griffier een weergave van de zakelijke inhoud van de conclusie aan de wederpartij of aan haar gemachtigde.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel84
  - number: '84.4'
    text: |-
      In zaken waarin partijen niet in persoon kunnen procederen, doet de procureur uiterlijk op de roldatum een
      afschrift van deze stukken aan de procureur van de wederpartij toekomen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel84
  - number: '85.1'
    text: |-
      Indien een partij zich bij dagvaarding, conclusie of akte op enig stuk beroept, is zij verplicht een afschrift van
      het stuk bij te voegen, tenzij een afschrift reeds bij een eerder processtuk in dezelfde zaak was gevoegd. De in de
      vorige volzin bedoelde verplichting vervalt indien de wederpartij verklaart geen afschrift te verlangen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel85
  - number: '85.2'
    text: |-
      Indien de wederpartij verklaart inzage in het stuk zelf te verlangen, is de partij die zich op het stuk beroept
      bovendien verplicht dit ter griffie te deponeren. In zaken waarin partijen niet in persoon kunnen procederen, kan
      in plaats daarvan het stuk aan de procureur van de wederpartij tegen ontvangstbewijs worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel85
  - number: '85.3'
    text: |-
      Indien een partij nog enig stuk in het geding wenst te brengen nadat de dag voor een verschijning van partijen ter
      terechtzitting of het houden van pleidooien is bepaald, zendt zij een afschrift aan de wederpartij. Tegelijkertijd
      verstrekt zij een afschrift van het stuk aan de griffier.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel85
  - number: '85.4'
    text: |-
      Indien ten aanzien van enig stuk aan enig voorschrift van dit artikel niet is voldaan, of dermate laat dat de
      wederpartij dientengevolge niet voldoende in staat is zich daarover uit te laten, kan zij zich daarop tot aan
      het eindvonnis beroepen. In dat geval of indien zodanig beroep niet wordt gedaan, terwijl de rechter reden heeft
      om te veronderstellen dat de wederpartij geen afschrift van het stuk heeft ontvangen, biedt hij de wederpartij
      de gelegenheid zich alsnog over het stuk uit te laten, dan wel houdt hij bij zijn beslissing ten nadele van de
      wederpartij met het stuk geen rekening.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel85
  - number: '86'
    text: |-
      De in [artikel 85, tweede lid][ref1], bedoelde stukken worden teruggegeven binnen een week na dagtekening van het
      ontvangstbewijs of, op verlangen van de partij die zich op de stukken beroept, binnen een week na de kennisgeving
      aan de wederpartij dat de stukken ter griffie zijn gedeponeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel85
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '85'
        afdeling: Eerste
  - number: '87.1'
    text: |-
      De rechter kan, op verzoek van partijen of van een van hen dan wel ambtshalve, in alle gevallen en in elke stand
      van het geding een verschijning van partijen ter terechtzitting bevelen teneinde een schikking te beproeven.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel87
  - number: '87.2'
    text: |-
      Partijen verschijnen ter terechtzitting in persoon of bij gemachtigde. In zaken waarin zij niet in persoon kunnen
      procederen, verschijnen zij in persoon of bij procureur. De rechter kan verschijning in persoon bevelen. Partijen
      die ter terechtzitting in persoon verschijnen, mogen zich laten bijstaan door hun raadsman. In zaken waarin
      partijen niet in persoon kunnen procederen, is de raadsman een advocaat of procureur.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel87
  - number: '87.3'
    text: |-
      Indien een schikking tot stand komt, wordt, wanneer een partij dat verlangt, een proces-verbaal opgemaakt, dat
      mede wordt ondertekend door partijen of hun tot dat doel bijzonderlijk gevolmachtigden en waarin de verbintenissen
      die partijen ten gevolge van die schikking op zich nemen, worden uitgedrukt. De uitgifte van dit proces-verbaal
      geschiedt in executoriale vorm.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel87
  - number: '87.4'
    text: Indien geen schikking tot stand komt, bepaalt de rechter de dag waarop de zaak weer op de rol zal komen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel87
  - number: '88.1'
    text: |-
      Een verschijning van partijen ter terechtzitting kan ook worden bevolen tot het geven van inlichtingen aan de
      rechter. [Artikel 87, tweede lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel87
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '87'
        afdeling: Eerste
  - number: '88.2'
    text: |-
      De rechter ondervraagt partijen. Partijen kunnen elkaar vragen stellen, behoudens de bevoegdheid van de rechter om
      te beletten dat aan een bepaalde vraag gevolg wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel88
  - number: '88.3'
    text: |-
      Van het verhandelde wordt een proces-verbaal opgemaakt dat na voorlezing door de rechter en door de griffier,
      alsmede door partijen wordt ondertekend. Indien geen inlichtingen zijn gegeven of de verschenen partijen daarmee
      instemmen, kan de rechter bepalen dat voorlezing en ondertekening door partijen achterwege blijven. Weigert een
      partij te ondertekenen of verklaart zij dit niet te kunnen, dan wordt die weigering of die verklaring inhoudende
      de oorzaak van verhindering, in het proces-verbaal vermeld. Eveneens vermeldt het proces-verbaal de door de rechter
      bepaalde dag waarop de zaak weer op de rol zal komen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel88
  - number: '88.4'
    text: |-
      Een verklaring omtrent door haar te bewijzen feiten kan in het voordeel van de partij die haar aflegde geen bewijs
      opleveren. Overigens kan de rechter uit de afgelegde verklaringen, uit een niet-verschijnen ter terechtzitting of
      uit een weigering om te antwoorden of het proces-verbaal te ondertekenen de gevolgtrekking maken die hij geraden
      acht, behoudens [artikel 154][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel154
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '154'
        paragraaf: '1'
        afdeling: Negende
  - number: '89'
    text: |-
      Indien met het oog op een verschijning ter terechtzitting als bedoeld in [artikel 87][ref1] of [artikel 88][ref2]
      een bevel als bedoeld in [artikel 22][ref3] wordt gegeven, moeten de bescheiden uiterlijk op een door de rechter te
      bepalen dag vóór de datum van de verschijning aan de rechter en in afschrift aan de wederpartij zijn overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel88
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel22
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '87'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '88'
        afdeling: Eerste
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '22'
        afdeling: Derde
  - number: '90.1'
    text: |-
      In alle gevallen waarin de rechter een dag bepaalt waarop de zaak weer op de rol zal komen, bepaalt hij tevens
      welke proceshandeling dan moet worden verricht.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel90
  - number: '90.2'
    text: |-
      Dient een zaak in enige stand van het geding wederom voor een proceshandeling ter rolle, dan geschiedt dit bij een
      enkelvoudige kamer.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel90
  - number: '91'
    text: |-
      De griffier verstrekt zo spoedig mogelijk een afschrift van processen-verbaal aan de eiser en aan de in het geding
      verschenen gedaagde.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel91
  - number: '92'
    text: |-
      Indien de griffier aan partijen stukken toezendt, geschiedt dit, tenzij de rechter anders bepaalt, bij gewone
      brief.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel92
  - number: '93'
    text: 'Door de kantonrechter worden behandeld en beslist:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel93
  - number: 93.a
    text: |-
      zaken betreffende vorderingen met een beloop van ten hoogste € 5000, de tot aan de dag van dagvaarding verschenen
      rente daarbij inbegrepen, tenzij de rechtstitel dat bedrag te boven gaat en die rechtstitel wordt betwist;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel93
  - number: 93.b
    text: |-
      zaken betreffende vorderingen van onbepaalde waarde, indien er duidelijke aanwijzingen bestaan dat de vordering
      geen hogere waarde vertegenwoordigt dan € 5000;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel93
  - number: 93.c
    text: |-
      zaken betreffende een arbeidsovereenkomst, een collectieve arbeidsovereenkomst, algemeen verbindend verklaarde
      bepalingen van een collectieve arbeidsovereenkomst, een vut-overeenkomst als bedoeld in de Wet kaderregeling
      vut overheidspersoneel, of een agentuur-, huur- of huurkoopovereenkomst, ongeacht het beloop of de waarde van de
      vordering;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel93
  - number: 93.d
    text: andere zaken ten aanzien waarvan de wet dit bepaalt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel93
  - number: '94.1'
    text: |-
      Indien een zaak meer dan één vordering als bedoeld in [artikel 93 onder a en b][ref1] betreft, is voor de
      toepassing van dat artikel beslissend het totale beloop of de totale waarde van deze vorderingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel93
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '93'
        afdeling: Tweede
  - number: '94.2'
    text: |-
      Indien een zaak meer vorderingen betreft en tenminste één daarvan een vordering is als bedoeld in
      [artikel 93 onder c of d][ref1], worden deze vorderingen alle door de kantonrechter behandeld en beslist, voor
      zover de samenhang tussen de vorderingen zich tegen afzonderlijke behandeling verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel93
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '93'
        afdeling: Tweede
  - number: '94.3'
    text: |-
      In het geval van zaken in conventie en in reconventie, waarvan er tenminste één een vordering betreft als bedoeld
      in [artikel 93 onder c of d][ref1], is het tweede lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel93
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '93'
        afdeling: Tweede
  - number: '94.4'
    text: |-
      In het geval van een hoofdzaak en een zaak in vrijwaring, waarvan er tenminste één een vordering betreft als
      bedoeld in [artikel 93 onder c of d][ref1], worden deze vorderingen alle door de kantonrechter behandeld en
      beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel93
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '93'
        afdeling: Tweede
  - number: '95'
    text: |-
      Voor de toepassing van de [artikelen 93][ref1] en [94][ref2] wordt mede gelet op een wijziging van de eis.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel94
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '93'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '94'
        afdeling: Tweede
  - number: '96'
    text: |-
      In alle zaken die slechts rechtsgevolgen betreffen die ter vrije bepaling van partijen staan, kunnen zij zich samen
      tot een kantonrechter van hun keuze wenden en zijn beslissing inroepen. Het geding wordt gevoerd op de wijze als
      door de kantonrechter bepaald.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel96
  - number: '97.1'
    text: |-
      Buiten de gevallen als bedoeld in [artikel 94, derde lid][ref1], wordt een zaak in reconventie ook in afwijking van
      de [artikelen 93 tot en met 96][ref2] behandeld en beslist door de rechter die de zaak in conventie behandelt en
      beslist, voor zover de samenhang tussen de vorderingen zich tegen afzonderlijke behandeling verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel93
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '94'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '93'
        afdeling: Tweede
  - number: '97.2'
    text: |-
      Buiten de gevallen als bedoeld in [artikel 94, vierde lid][ref1], wordt een zaak in vrijwaring ook in afwijking van
      de [artikelen 93 tot en met 96][ref2] behandeld en beslist door de rechter die de hoofdzaak behandelt en beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel93
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '94'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '93'
        afdeling: Tweede
  - number: '98'
    text: |-
      Indien de kantonrechter in de gevallen, bedoeld in de [ artikelen 94, tweede tot en met vierde lid][ref1], en
      [97, eerste lid][ref2], van oordeel is dat de zaak ongeschikt is voor behandeling en beslissing door één rechter,
      kan hij de zaak met toepassing van [artikel 15, tweede lid][ref3], verwijzen naar een meervoudige kamer van een
      andere sector dan de sector kanton.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel97
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel15
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '94'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '97'
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '15'
        afdeling: Tweede
  - number: '99.1'
    text: Tenzij de wet anders bepaalt, is bevoegd de rechter van de woonplaats van de gedaagde.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel99
  - number: '99.2'
    text: |-
      Bij gebreke van een bekende woonplaats van de gedaagde in Nederland is bevoegd de rechter van zijn werkelijk
      verblijf.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel99
  - number: '100'
    text: |-
      In zaken betreffende een arbeidsovereenkomst, een agentuurovereenkomst, een collectieve arbeidsovereenkomst of
      algemeen verbindend verklaarde bepalingen van een collectieve arbeidsovereenkomst is mede bevoegd de rechter van de
      plaats waar de arbeid gewoonlijk wordt verricht.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel100
  - number: '101'
    text: |-
      In zaken betreffende een overeenkomst die wordt gesloten door een partij die handelt in de uitoefening van een
      beroep of bedrijf en een natuurlijk persoon die niet handelt in de uitoefening van een beroep of bedrijf, is
      mede bevoegd de rechter van de woonplaats of, bij gebreke daarvan, van het werkelijk verblijf van die natuurlijke
      persoon.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel101
  - number: '102'
    text: |-
      In zaken betreffende verbintenissen uit onrechtmatige daad is mede bevoegd de rechter van de plaats waar het
      schadebrengende feit zich heeft voorgedaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel102
  - number: '103'
    text: |-
      In zaken betreffende onroerende zaken is mede bevoegd de rechter binnen wiens rechtsgebied de zaak of het grootste
      gedeelte daarvan is gelegen. In zaken betreffende huur van woonruimte of huur van bedrijfsruimte in de zin van
      [artikel 290 van Boek 7 van het Burgerlijk Wetboek][ref1] is echter uitsluitend bevoegd de rechter binnen wiens
      rechtsgebied het gehuurde of het grootste gedeelte daarvan is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel290
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '290'
  - number: '104.1'
    text: In zaken betreffende nalatenschappen is mede bevoegd de rechter van de laatste woonplaats van de overledene.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel104
  - number: '104.2'
    text: |-
      In zaken betreffende schuldvorderingen ten laste van de overledene is de in het eerste lid aangewezen rechter
      eveneens bevoegd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel104
  - number: '105'
    text: |-
      In zaken betreffende de geldigheid, de nietigheid of de ontbinding van vennootschappen of rechtspersonen,
      de geldigheid, nietigheid of rechtsgevolgen van hun besluiten of die van hun organen dan wel de rechten en
      verplichtingen van hun leden of vennoten als zodanig, is mede bevoegd de rechter van de woonplaats of de plaats van
      vestiging van de rechtspersoon of de vennootschap.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel105
  - number: '106'
    text: |-
      In zaken betreffende de toepassing van de wettelijke bepalingen inzake faillissement, surséance van betaling en
      schuldsaneringsregeling natuurlijke personen is mede bevoegd de rechtbank waaruit de rechter-commissaris is benoemd
      of, indien in geval van surséance geen rechter-commissaris is benoemd, de rechtbank die over het verzoek tot het
      verlenen van surséance heeft geoordeeld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel106
  - number: '107'
    text: |-
      Indien een rechter ten aanzien van een van de gezamenlijk in het geding betrokken gedaagden bevoegd is, is die
      rechter ook ten aanzien van de overige gedaagden bevoegd, mits tussen de vorderingen tegen de onderscheiden
      gedaagden een zodanige samenhang bestaat, dat redenen van doelmatigheid een gezamenlijke behandeling
      rechtvaardigen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel107
  - number: '108.1'
    text: |-
      Hebben partijen bij overeenkomst een rechter aangewezen voor de kennisneming van geschillen die zijn ontstaan of
      zullen ontstaan naar aanleiding van een bepaalde rechtsbetrekking die tot hun vrije bepaling staat, dan is die
      rechter bevoegd van de zaak kennis te nemen. Iedere andere rechter voor wie de zaak is gebracht, verklaart zich
      onbevoegd, mits de gedaagde zich overeenkomstig artikel 110 op de onbevoegdheid beroept.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel108
  - number: '108.2'
    text: |-
      Beloopt de vordering evenwel minder dan € 5000 of betreft het een individuele arbeidsovereenkomst dan wel een zaak
      als bedoeld in [artikel 101][ref1] of [artikel 103, tweede zin][ref2], dan heeft een overeenkomst als bedoeld in
      het eerste lid geen gevolg, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel103
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '101'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '103'
        afdeling: Derde
  - number: 108.2.a
    text: zij is aangegaan na het ontstaan van het geschil, of
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel108
  - number: 108.2.b
    text: |-
      de werknemer, de partij die niet handelt in de uitoefening van beroep of bedrijf dan wel de huurder zich tot de
      aangewezen rechter wendt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel108
  - number: '108.3'
    text: |-
      Een overeenkomst tot aanwijzing van een bevoegde rechter wordt bewezen door een geschrift. Daarvoor is voldoende
      een geschrift dat een dergelijk beding bevat of dat verwijst naar algemene voorwaarden die een dergelijk beding
      bevatten, mits dat geschrift door of namens de wederpartij uitdrukkelijk of stilzwijgend is aanvaard.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel108
  - number: '108.4'
    text: |-
      Een overeenkomst tot aanwijzing van een bevoegde rechter dient als een afzonderlijke overeenkomst te worden
      beschouwd en beoordeeld. De aangewezen rechter is bevoegd te oordelen over de rechtsgeldigheid van de
      hoofdovereenkomst waarvan een overeenkomst tot aanwijzing van een bevoegde rechter deel uitmaakt of waarop zij
      betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel108
  - number: '109'
    text: |-
      Wijzen de [artikelen 99 tot en met 108][ref1] geen bevoegde rechter aan, dan is bevoegd de rechter van de
      woonplaats van de eiser dan wel, indien er meer eisers zijn, elk van de eisers of, bij gebreke daarvan, de rechter
      te 's-Gravenhage.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel99
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '99'
        afdeling: Derde
  - number: '110.1'
    text: |-
      Het verweer dat de rechter niet relatief bevoegd is, wordt op straffe van verval van het recht daartoe gevoerd vóór
      alle weren ten gronde.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel110
  - number: '110.2'
    text: |-
      Indien de rechter beslist dat niet hij, maar een andere rechter relatief bevoegd is, verwijst hij de zaak naar deze
      rechter. [Artikel 74, eerste lid en derde lid, eerste zin][ref1], zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel74
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '74'
        afdeling: Achtste
  - number: '110.3'
    text: |-
      Tegen een vonnis waarbij een verweer als bedoeld in het eerste lid wordt verworpen of de zaak naar een andere
      rechter wordt verwezen, is geen hogere voorziening toegelaten. De rechter naar wie de zaak is verwezen, is aan die
      verwijzing gebonden. De vorige zin mist toepassing indien de rechter zich tevens absoluut onbevoegd verklaart en de
      zaak verwijst naar een hogere rechter.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel110
  - number: '111.1'
    text: Dagvaarding geschiedt bij exploot.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel111
  - number: '111.2'
    text: |-
      Naast de gegevens bedoeld in [artikel 45, tweede lid][ref1], vermeldt het exploot van dagvaarding:


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel45
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '45'
        afdeling: Zesde
  - number: 111.2.a
    text: de door eiser gekozen woonplaats in de gemeente waar de rechter zitting houdt;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel111
  - number: 111.2.b
    text: |-
      in zaken waarin partijen in persoon kunnen procederen, indien de eiser bij gemachtigde procedeert, de naam en het
      adres van de gemachtigde;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel111
  - number: 111.2.c
    text: |-
      in zaken waarin partijen niet in persoon kunnen procederen, de naam en het kantooradres van de procureur die door
      de eiser wordt gesteld;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel111
  - number: 111.2.d
    text: de eis en de gronden daarvan;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel111
  - number: 111.2.e
    text: |-
      de aanwijzing van de rechter die van de zaak kennisneemt, onder vermelding van het adres van het gerecht dan wel,
      indien de zaak moet worden behandeld op een nevenvestigingsplaats of nevenzittingsplaats van het gerecht, het
      adres van die nevenzittingsplaats of nevenvestigingsplaats alsmede, indien de zaak moet worden behandeld op een
      nevenzittingsplaats waar geen stukken kunnen worden ingediend, het adres waar stukken kunnen worden ingediend;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel111
  - number: 111.2.f
    text: de roldatum waartegen wordt gedagvaard en, indien alsdan een terechtzitting plaatsvindt, het uur daarvan;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel111
  - number: 111.2.g
    text: |-
      in zaken waarin partijen in persoon kunnen procederen: de wijze waarop de gedaagde in het geding moet verschijnen,
      te weten in persoon of vertegenwoordigd door een gemachtigde, de wijze waarop de gedaagde kan antwoorden, zoals
      bepaald in [artikel 82, eerste en tweede lid][ref1], en de rechtsgevolgen, door [artikel 139][ref2] aan het
      achterwege blijven van een antwoord verbonden;


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel139
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '82'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '139'
        afdeling: Zevende
  - number: 111.2.h
    text: |-
      in zaken waarin partijen niet in persoon kunnen procederen: de wijze waarop de gedaagde in het geding moet
      verschijnen, te weten vertegenwoordigd door een procureur;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel111
  - number: 111.2.i
    text: |-
      in alle zaken in eerste aanleg: de in [artikel 139][ref1] en, indien er meer gedaagden zijn, in
      [artikel 140, tweede lid][ref2], genoemde rechtsgevolgen die intreden indien de gedaagde niet op de voorgeschreven
      wijze in het geding verschijnt.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel139
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel140
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '139'
        afdeling: Zevende
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '140'
        afdeling: Zevende
  - number: '111.3'
    text: |-
      Het exploot van dagvaarding vermeldt de door gedaagde tegen de eis aangevoerde verweren en de gronden daarvoor.
      Verder vermeldt het exploot de bewijsmiddelen waarover eiser kan beschikken en de getuigen die hij kan doen horen
      ter staving van de aldus betwiste gronden van de eis.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel111
  - number: '112'
    text: |-
      Betreft het exploot van dagvaarding een kort geding voor de voorzieningenrechter, dan bevat dit tevens de
      mededeling dat bij verschijning een vast recht zal worden geheven, alsmede de hoogte daarvan. Hierbij wordt
      vermeld, dat aan on- en minvermogenden vermindering van dit vast recht kan worden verleend.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel112
  - number: '113.1'
    text: |-
      Het exploot wordt door de eiser ter griffie ingediend uiterlijk op de laatste dag waarop de griffie is geopend,
      voorafgaande aan de in de dagvaarding vermelde roldatum.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel113
  - number: '113.2'
    text: De griffier schrijft de zaak in op de rol van een enkelvoudige kamer.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel113
  - number: '114'
    text: De gewone termijn van dagvaarding is ten minste een week.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel114
  - number: '115.1'
    text: |-
      Indien de gedaagde een bekende woonplaats of een bekend werkelijk verblijf buiten Nederland heeft in een Staat
      waar de [verordening (EG) nr. 1348/2000](32000R1348) van de Raad van de Europese Unie van 29 mei 2000 inzake de
      betekening en de kennisgeving in de lidstaten van gerechtelijke en buitengerechtelijke stukken in burgerlijke of
      in handelszaken (PbEG L 160/37) van toepassing is, of in een Staat die in Europa is gelegen en die partij is bij
      het op 15 november 1965 te 's-Gravenhage tot stand gekomen Verdrag inzake de betekening en de kennisgeving in het
      buitenland van gerechtelijke en buitengerechtelijke stukken in burgerlijke en in handelszaken (Trb. 1966, 91), is
      de termijn van dagvaarding ten minste vier weken.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel115
  - number: '115.2'
    text: |-
      Indien de gedaagde noch in Nederland, noch in een Staat als bedoeld in het eerste lid, een bekende woonplaats of
      een bekend werkelijk verblijf heeft, is de termijn van dagvaarding ten minste drie maanden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel115
  - number: '115.3'
    text: |-
      Indien de gedaagde in Nederland geen bekende woonplaats of bekend werkelijk verblijf heeft, is de termijn van
      dagvaarding in afwijking van het eerste en tweede lid ten minste een week, indien het exploot in Nederland wordt
      gedaan aan de gedaagde in persoon, dan wel aan een door de gedaagde voor deze zaak gekozen woonplaats.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel115
  - number: '116.1'
    text: |-
      Indien in rechte worden opgeroepen houders van aandelen of andere effecten welke niet op naam staan of waarvan de
      houders niet bij name bekend zijn, is de termijn van dagvaarding ten minste vier weken.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel116
  - number: '116.2'
    text: |-
      Deze termijn geldt eveneens indien in rechte worden opgeroepen zij die algemene voorwaarden gebruiken waarin
      bedingen voorkomen waarvan gesteld wordt dat zij onredelijk bezwarend zijn, in het geval dat ingevolge
      [artikel 1003, onder 1°][ref1], hun naam en woonplaats niet afzonderlijk in het exploot worden vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1003
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1003'
  - number: '117'
    text: |-
      De in de [artikelen 114][ref1], [115][ref2] en [116][ref3] genoemde termijnen kunnen op mondeling of schriftelijk
      verzoek van de eiser door de voorzieningenrechter, of, in kantonzaken, de kantonrechter van de rechtbank, zo nodig
      onder het stellen van voorwaarden, worden verkort. De beschikking wordt vermeld aan het hoofd van het exploot van
      dagvaarding.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel114
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel115
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel116
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '114'
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '115'
        afdeling: Vierde
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '116'
        afdeling: Vierde
  - number: '118'
    text: |-
      Oproepingen van derden als partij in het geding geschieden met inachtneming van de voor dagvaarding
      geldende termijnen. Indien de oproeping niet geschiedt bij hetzelfde exploot waarmee de gedaagde
      is gedagvaard, wordt het exploot, waarmee de gedaagde is gedagvaard, met de oproeping aan de derde
      betekend.[ Artikel 111, tweede lid, aanhef en onderdelen g, h en i][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel111
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '111'
        afdeling: Vierde
  - number: '119.1'
    text: |-
      De termijn van dagvaarding vangt aan op de dag, volgend op die waarop het exploot is uitgebracht. Wordt de
      dagvaarding gedaan met toepassing van [artikel 56][ref1], dan vangt de termijn van dagvaarding aan op de dag,
      volgend op de datum van verzending als bedoeld in het tweede lid, onder a, van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel56
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '56'
        afdeling: Zesde
  - number: '119.2'
    text: Bij het bepalen van de termijn van dagvaarding wordt de roldatum niet meegerekend.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel119
  - number: '120.1'
    text: Al hetgeen in deze afdeling is voorgeschreven, wordt op straffe van nietigheid in acht genomen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel120
  - number: '120.2'
    text: |-
      Een gebrek in een exploot van dagvaarding dat nietigheid meebrengt, kan bij exploot, uitgebracht voor de roldatum,
      worden hersteld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel120
  - number: '120.3'
    text: |-
      Bij het uitbrengen van dat exploot moet de voor dagvaarding voorgeschreven termijn in acht worden genomen. Indien
      inachtneming van de termijn van dagvaarding meebrengt dat de roldatum niet kan worden gehandhaafd, moet een andere
      roldatum worden aangezegd, met vermelding van het uur indien alsdan een terechtzitting plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel120
  - number: '120.4'
    text: |-
      Het eerste lid is niet van toepassing op hetgeen is voorgeschreven in [artikel 111, derde lid][ref1]. De rechter
      kan eiser bevelen alsnog de ontbrekende gegevens te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel111
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '111'
        afdeling: Vierde
  - number: '121.1'
    text: |-
      Verschijnt de gedaagde niet in het geding dan wel verzuimt hij procureur te stellen hoewel hem dat bij dagvaarding
      was aangezegd, en blijkt aan de rechter dat het exploot van dagvaarding lijdt aan een gebrek dat nietigheid
      meebrengt, dan verleent de rechter geen verstek tegen hem.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel121
  - number: '121.2'
    text: |-
      In het geval bedoeld in het eerste lid bepaalt de rechter een nieuwe roldatum en beveelt hij dat deze door de eiser
      bij exploot aan de gedaagde wordt aangezegd met herstel van het gebrek op kosten van de eiser.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel121
  - number: '121.3'
    text: |-
      Is echter aannemelijk dat het exploot van dagvaarding de gedaagde als gevolg van het gebrek niet heeft bereikt, dan
      spreekt de rechter de nietigheid van het exploot uit.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel121
  - number: '122.1'
    text: |-
      Verschijnt de gedaagde in het geding, of komt hij, na bij verstek te zijn veroordeeld, in verzet, en beroept hij
      zich op de nietigheid van het exploot van dagvaarding, dan verwerpt de rechter dat beroep indien naar zijn oordeel
      het gebrek de gedaagde niet onredelijk in zijn belangen heeft geschaad.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel122
  - number: '122.2'
    text: |-
      De rechter kan echter in dit geval, zo daartoe gronden zijn, het herstel van het gebrek op kosten van de eiser
      bevelen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel122
  - number: '123.1'
    text: |-
      Indien echter de eiser ten onrechte geen procureur heeft gesteld, biedt de rechter hem en, indien in dit geval
      de gedaagde wel in het geding was verschenen maar eveneens ten onrechte geen procureur had gesteld, ook deze, de
      gelegenheid binnen een door hem te bepalen termijn alsnog procureur te stellen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel123
  - number: '123.2'
    text: |-
      Indien de eiser van de hem ingevolge het eerste lid geboden gelegenheid geen gebruik maakt, wordt de gedaagde van
      de instantie ontslagen, met veroordeling van de eiser in de kosten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel123
  - number: '123.3'
    text: |-
      Indien alleen de gedaagde van de aan partijen ingevolge het eerste lid geboden gelegenheid om alsnog procureur te
      stellen, geen gebruik maakt, zijn de [artikelen 139 tot en met 142][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel139
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '139'
        afdeling: Zevende
  - number: '123.4'
    text: |-
      Indien de eiser en de gedaagde alsnog procureur hebben gesteld, wordt het geding in de stand waarin het zich
      bevindt, voortgezet, met dien verstande dat de rechter, indien hij reeds de dag heeft bepaald waarop hij uitspraak
      zal doen, partijen alsnog de gelegenheid biedt zich binnen een door hem te bepalen termijn over de zaak uit te
      laten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel123
  - number: '123.5'
    text: Tegen een beslissing ingevolge het eerste, tweede of vierde lid staat geen hogere voorziening open.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel123
  - number: '124'
    text: |-
      Indien de eiser ten onrechte procureur heeft gesteld, wordt de zaak voortgezet met inachtneming van de
      voorschriften voor zaken waarin partijen in persoon kunnen procederen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel124
  - number: '125.1'
    text: Het geding is aanhangig vanaf de dag van dagvaarding.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel125
  - number: '125.2'
    text: |-
      De aanhangigheid vervalt indien het exploot niet uiterlijk op het in [artikel 113, eerste lid][ref1], vermelde
      tijdstip ter griffie is ingediend, tenzij binnen twee weken na de in de dagvaarding vermelde roldatum een geldig
      herstelexploot is uitgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel113
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '113'
        afdeling: Vierde
  - number: '126.1'
    text: |-
      De gedaagde kan de roldatum, vermeld in het exploot van dagvaarding, vervroegen door aan de eiser bij exploot een
      vroegere roldatum te doen aanzeggen, met vermelding van het uur indien alsdan een terechtzitting plaatsvindt. In
      zaken waarin partijen niet in persoon kunnen procederen, wordt hierbij tevens procureur gesteld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel126
  - number: '126.2'
    text: |-
      Die aanzegging geschiedt op straffe van nietigheid op een termijn van ten minste een week voor de aangezegde
      vroegere roldatum. De gedaagde dient het exploot van aanzegging uiterlijk op de laatste dag waarop de griffie is
      geopend, voorafgaande aan de vervroegde roldatum, in ter griffie.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel126
  - number: '126.3'
    text: |-
      Zijn er medegedaagden, dan wordt de aanzegging, voor zover zij niet mede van hen uitgaat, bij exploot ook aan
      hen op straffe van nietigheid gedaan met inachtneming van zodanige termijn tussen dat exploot en de vervroegde
      roldatum, als waarop ieder van hen, als gedaagde, volgens de wet aanspraak zou kunnen maken.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel126
  - number: '126.4'
    text: |-
      Wordt door meer dan één gedaagde van het recht de roldatum te vervroegen gebruik gemaakt, dan geldt de aanzegging
      van de vroegste roldatum.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel126
  - number: '127.1'
    text: |-
      Indien de in [artikel 113, eerste lid][ref1], bedoelde indiening ter griffie van het exploot van dagvaarding niet
      tijdig heeft plaats gehad, is de gedaagde bevoegd, onder overlegging van het exploot van dagvaarding, de zaak op de
      rol te laten inschrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel113
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '113'
        afdeling: Vierde
  - number: '127.2'
    text: |-
      Indien de gedaagde van zijn in het eerste lid bedoelde bevoegdheid gebruik maakt, is hij tevens bevoegd, te
      vorderen dat hij van de instantie wordt ontslagen met veroordeling van de eiser in de kosten. In dat geval
      biedt de rechter gedurende een door hem te bepalen termijn aan de eiser gelegenheid om hetzij op de voet van
      [artikel 123, eerste lid][ref1], procureur te stellen, hetzij bij akte te verklaren dat hij wenst voort te
      procederen. Indien de eiser van deze gelegenheid geen gebruik maakt, wordt de vordering toegewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel123
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '123'
        afdeling: Vierde
  - number: '127.3'
    text: |-
      Indien de gedaagde een vroegere roldatum heeft aangezegd en het exploot van aanzegging niet tijdig ter griffie
      heeft ingediend, blijft de oorspronkelijke, in het exploot van dagvaarding vermelde roldatum gehandhaafd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel127
  - number: '128.1'
    text: |-
      Indien de gedaagde bij gemachtigde of bij procureur procedeert, deelt hij op de eerste roldatum de naam en het
      adres van de gemachtigde of de naam en het kantooradres van de procureur mede.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel128
  - number: '128.2'
    text: |-
      De gedaagde neemt zijn met redenen omklede conclusie van antwoord op de eerste of op een door de rechter nader te
      bepalen roldatum.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel128
  - number: '128.3'
    text: |-
      De gedaagde brengt alle excepties en zijn antwoord ten principale tegelijk naar voren, op straffe van verval van de
      niet aangevoerde excepties en, indien niet ten principale is geantwoord, van het recht om dat alsnog te doen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel128
  - number: '128.4'
    text: |-
      In afwijking van het derde lid kunnen zij die beroep willen doen op de termijn van [artikel 104 van Boek 1][ref1]
      of van [artikel 185 van Boek 4 van het Burgerlijk Wetboek][ref2], hun verweer tot dit beroep beperken.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel104
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel185
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '104'
      - id: ref2
        bwb_id: BWBR0002761
        artikel: '185'
  - number: '128.5'
    text: |-
      De conclusie van antwoord vermeldt de bewijsmiddelen waarover gedaagde kan beschikken tot staving van de gronden
      van zijn verweer, alsmede de getuigen die hij daartoe kan doen horen. De rechter kan gedaagde bevelen alsnog de
      ontbrekende gegevens te verstrekken.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel128
  - number: '129'
    text: Zolang de rechter nog geen eindvonnis heeft gewezen, kan de eiser te allen tijde zijn eis verminderen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel129
  - number: '130.1'
    text: |-
      Zolang de rechter nog geen eindvonnis heeft gewezen, is de eiser bevoegd zijn eis of de gronden daarvan
      schriftelijk, bij conclusie of akte ter rolle, te veranderen of te vermeerderen. De gedaagde is bevoegd hiertegen
      bezwaar te maken, op grond dat de verandering of vermeerdering in strijd is met de eisen van een goede procesorde.
      De rechter beslist, partijen gehoord, zo spoedig mogelijk. De rechter kan op dezelfde grond ook ambtshalve een
      verandering of vermeerdering van eis buiten beschouwing laten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel130
  - number: '130.2'
    text: Tegen de beslissingen van de rechter, bedoeld in het eerste lid, staat geen hogere voorziening open.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel130
  - number: '130.3'
    text: |-
      Indien een partij niet in het geding is verschenen, is een verandering of vermeerdering van eis tegen die partij
      uitgesloten, tenzij de eiser de verandering of vermeerdering tijdig bij exploot aan haar kenbaar heeft gemaakt. In
      laatstgenoemd geval is [artikel 120, derde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel120
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '120'
        afdeling: Vierde
  - number: '131'
    text: |-
      Nadat de gedaagde voor antwoord heeft geconcludeerd, beveelt de rechter een verschijning van partijen ter
      terechtzitting als bedoeld in [artikel 87][ref1] of [artikel 88][ref2], tenzij hij oordeelt dat de zaak daarvoor
      niet geschikt is. Uiterlijk twee weken na het in de eerste volzin bedoelde tijdstip beslist de rechter hieromtrent.
      Tegen deze beslissing staat geen hogere voorziening open.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel88
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '87'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '88'
        afdeling: Eerste
  - number: '132.1'
    text: |-
      Indien geen verschijning van partijen ter terechtzitting op de voet van [artikel 131][ref1] is bevolen, geeft de
      rechter aan de eiser gelegenheid voor repliek te concluderen. Hierna kan de gedaagde voor dupliek concluderen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel131
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '131'
        afdeling: Vijfde
  - number: '132.2'
    text: |-
      Is wel een verschijning van partijen ter terechtzitting op de voet van [artikel 131][ref1] bevolen, dan wordt aan
      partijen slechts gelegenheid geboden voor repliek en dupliek, indien zulks met het oog op [artikel 19][ref2] of met
      het oog op een goede instructie van de zaak noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel131
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel19
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '131'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '19'
        afdeling: Derde
  - number: '132.3'
    text: |-
      De rechter staat het nemen van nog meer conclusies toe, indien zulks met het oog op artikel 19 of met het oog op
      een goede instructie van de zaak noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel132
  - number: '132.4'
    text: Tegen beslissingen over de toepassing van het tweede lid en het derde lid staat geen hogere voorziening open.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel132
  - number: '133.1'
    text: De rechter stelt de termijnen voor het nemen van de conclusies vast.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel133
  - number: '133.2'
    text: |-
      Partijen kunnen uitstel vragen voor het nemen van conclusies. De rechter volgt een daartoe strekkend, eenstemmig
      verzoek van partijen, tenzij dit zou leiden tot onredelijke vertraging van het geding.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel133
  - number: '133.3'
    text: |-
      Het eerste en het tweede lid zijn van overeenkomstige toepassing op de termijnen voor het verrichten van andere
      proceshandelingen dan conclusies en op de mogelijkheid om daarvoor uitstel te krijgen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel133
  - number: '133.4'
    text: |-
      Wanneer een proceshandeling niet is verricht binnen de daarvoor gestelde termijn en daarvoor geen uitstel kan
      worden verkregen, vervalt het recht om de desbetreffende proceshandeling te verrichten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel133
  - number: '134.1'
    text: |-
      Voordat de rechter over de zaak beslist, wordt aan partijen desverlangd gelegenheid geboden voor pleidooien. Indien
      partijen op een terechtzitting op de voet van [artikel 131][ref1] hun standpunt in voldoende mate mondeling hebben
      kunnen uiteenzetten, kan de rechter bepalen dat geen gelegenheid zal worden gegeven voor pleidooien.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel131
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '131'
        afdeling: Vijfde
  - number: '134.2'
    text: |-
      Indien de pleidooien op de bepaalde dag niet plaatsvinden, wordt, behoudens bijzondere omstandigheden, geen nieuwe
      dag voor pleidooien bepaald.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel134
  - number: '134.3'
    text: Partijen mogen hun eigen zaak bepleiten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel134
  - number: '134.4'
    text: De rechter kan bepalen dat partijen bij de pleidooien in persoon aanwezig moeten zijn.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel134
  - number: '135'
    text: |-
      In zaken waarin partijen in persoon kunnen procederen, stelt de griffier zo spoedig mogelijk de eiser en de in het
      geding verschenen gedaagde, voor zover zij niet in persoon of bij gemachtigde aanwezig waren op de terechtzitting,
      op de hoogte van het procesverloop.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel135
  - number: '136'
    text: |-
      De gedaagde is bevoegd een eis in reconventie in te stellen, tenzij de eiser in conventie is opgetreden in
      hoedanigheid en de reconventie hem persoonlijk zou betreffen of omgekeerd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel136
  - number: '137'
    text: |-
      De eis in reconventie moet dadelijk bij het antwoord worden ingesteld. [Artikel 111, derde lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel111
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '111'
        afdeling: Vierde
  - number: '138.1'
    text: |-
      De zaken in conventie en in reconventie worden tegelijk voldongen en bij een en hetzelfde eindvonnis beslist,
      tenzij de rechter van oordeel is dat de zaak in conventie of die in reconventie vroeger kan worden afgedaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel138
  - number: '138.2'
    text: |-
      De zaken worden gesplitst indien in één van beide zaken de rechter beveelt dat de procedure wordt voortgezet
      volgens de regels die gelden voor de verzoekschriftprocedure dan wel de rechter met toepassing van
      [artikel 71][ref1] verwijst of zich absoluut onbevoegd verklaart.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel71
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '71'
        afdeling: Achtste
  - number: '139'
    text: |-
      Indien de gedaagde niet op de eerste of op een door de rechter nader bepaalde roldatum in het geding verschijnt
      dan wel verzuimt procureur te stellen hoewel hem dat bij dagvaarding was aangezegd, en de voorgeschreven termijnen
      en formaliteiten in acht zijn genomen, verleent de rechter verstek tegen hem en wijst hij de vordering toe, tenzij
      deze hem onrechtmatig of ongegrond voorkomt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel139
  - number: '140.1'
    text: |-
      Zijn er meer gedaagden en is ten minste een van hen in het geding verschenen, dan wordt, indien ten aanzien van de
      niet verschenen gedaagden de voorgeschreven formaliteiten en termijnen in acht zijn genomen, tegen dezen verstek
      verleend en tussen de eiser en de verschenen gedaagden voortgeprocedeerd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel140
  - number: '140.2'
    text: Tussen alle partijen wordt één vonnis gewezen, dat als een vonnis op tegenspraak wordt beschouwd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel140
  - number: '140.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing in geval van oproeping van derden als partij in het
      geding als bedoeld in [artikel 118][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel118
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '118'
        afdeling: Vierde
  - number: '141'
    text: |-
      De kosten die een gevolg zijn van het feit dat een partij niet in het geding is verschenen, komen ten laste van die
      partij, tenzij verstek was verleend op een dagvaarding die nietig wordt verklaard.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel141
  - number: '142'
    text: |-
      De gedaagde tegen wie verstek is verleend, heeft, zolang het eindvonnis nog niet is gewezen, de bevoegdheid om
      alsnog in het geding te verschijnen, waardoor de gevolgen van het tegen hem verleende verstek vervallen, behalve
      ten aanzien van de daardoor veroorzaakte kosten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel142
  - number: '143.1'
    text: De gedaagde die bij verstek is veroordeeld, kan daartegen verzet doen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel143
  - number: '143.2'
    text: |-
      Het verzet moet worden gedaan bij exploot van dagvaarding binnen vier weken na de betekening van het vonnis
      of van enige uit kracht daarvan opgemaakte of ter uitvoering daarvan strekkende akte aan de veroordeelde
      in persoon, of na het plegen door deze van enige daad waaruit noodzakelijk voortvloeit dat het vonnis of de
      aangevangen tenuitvoerlegging aan hem bekend is. De in de eerste volzin bedoelde termijn is acht weken indien
      de gedaagde ten tijde van de in de eerste volzin bedoelde betekening of daad geen bekende woonplaats of bekend
      werkelijk verblijf in Nederland heeft, maar zijn woonplaats of werkelijk verblijf buiten Nederland bekend
      is.[ Artikel 111, tweede lid, onder i,][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel111
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '111'
        afdeling: Vierde
  - number: '143.3'
    text: |-
      Buiten de gevallen bedoeld in het tweede lid vangt de termijn waarbinnen het verzet moet worden gedaan, aan op de
      dag waarop het vonnis ten uitvoer is gelegd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel143
  - number: '143.4'
    text: De veroordeelde die in het vonnis heeft berust, kan daartegen niet meer in verzet komen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel143
  - number: '144'
    text: 'Het vonnis wordt geacht ten uitvoer te zijn gelegd:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel144
  - number: 144.a
    text: in geval van gerechtelijke verkoop van goederen, na de verkoop;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel144
  - number: 144.b
    text: |-
      in geval van derdenbeslag op een vordering, na de uitbetaling aan de beslaglegger, of, indien dit beslag wordt
      gelegd op een vordering tot periodieke betalingen, na de eerste uitbetaling;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel144
  - number: 144.c
    text: |-
      in geval van tenuitvoerlegging van een veroordeling tot levering of afgifte van goederen die geen registergoederen
      zijn, nadat de levering of afgifte heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel144
  - number: 144.d
    text: in geval van gedwongen ontruiming van onroerende zaken, nadat de ontruiming heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel144
  - number: '145'
    text: |-
      Het verzet, mits tijdig en op de voorgeschreven wijze gedaan, schorst de tenuitvoerlegging van het vonnis, tenzij
      dit uitvoerbaar bij voorraad was verklaard.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel145
  - number: '146.1'
    text: Het exploot vermeldt de gronden van het verzet. Artikel 128, vijfde lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel146
  - number: '146.2'
    text: |-
      Indien een eis in reconventie wordt ingesteld, vermeldt het exploot deze eis met de gronden daarvan.
      [Artikel 111, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel111
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '111'
        afdeling: Vierde
  - number: '146.3'
    text: |-
      De oorspronkelijke eiser kan overeenkomstig [artikel 126][ref1] de roldatum vervroegen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel126
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '126'
        afdeling: Vijfde
  - number: '147'
    text: |-
      Het geding verloopt als in de vijfde afdeling bepaald, met dien verstande dat het exploot van verzet als conclusie
      van antwoord geldt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel147
  - number: '148'
    text: Door verval van instantie na verzet vervalt ook het verstekvonnis.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel148
  - number: '149.1'
    text: |-
      Tenzij uit de wet anders voortvloeit, mag de rechter slechts die feiten of rechten aan zijn beslissing ten
      grondslag leggen, die in het geding aan hem ter kennis zijn gekomen of zijn gesteld en die overeenkomstig de
      voorschriften van deze afdeling zijn komen vast te staan. Feiten of rechten die door de ene partij zijn gesteld en
      door de wederpartij niet of niet voldoende zijn betwist, moet de rechter als vaststaand beschouwen, behoudens zijn
      bevoegdheid bewijs te verlangen, zo vaak aanvaarding van de stellingen zou leiden tot een rechtsgevolg dat niet ter
      vrije bepaling van partijen staat.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel149
  - number: '149.2'
    text: |-
      Feiten of omstandigheden van algemene bekendheid, alsmede algemene ervaringsregels mogen door de rechter aan zijn
      beslissing ten grondslag worden gelegd, ongeacht of zij zijn gesteld, en behoeven geen bewijs.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel149
  - number: '150'
    text: |-
      De partij die zich beroept op rechtsgevolgen van door haar gestelde feiten of rechten, draagt de bewijslast van
      die feiten of rechten, tenzij uit enige bijzondere regel of uit de eisen van redelijkheid en billijkheid een andere
      verdeling van de bewijslast voortvloeit.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel150
  - number: '151.1'
    text: |-
      Dwingend bewijs houdt in dat de rechter verplicht is de inhoud van bepaalde bewijsmiddelen als waar aan te nemen
      dan wel verplicht is de bewijskracht te erkennen die de wet aan bepaalde gegevens verbindt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel151
  - number: '151.2'
    text: Tegenbewijs, ook tegen dwingend bewijs, staat vrij, tenzij de wet het uitsluit.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel151
  - number: '152.1'
    text: Bewijs kan worden geleverd door alle middelen, tenzij de wet anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel152
  - number: '152.2'
    text: De waardering van het bewijs is aan het oordeel van de rechter overgelaten, tenzij de wet anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel152
  - number: '153'
    text: |-
      Overeenkomsten waarbij van het wettelijke bewijsrecht wordt afgeweken, blijven buiten toepassing, wanneer zij
      betrekking hebben op het bewijs van feiten waaraan het recht gevolgen verbindt, die niet ter vrije bepaling
      van partijen staan, zulks onverminderd de gronden waarop zij krachtens het Burgerlijk Wetboek buiten toepassing
      blijven.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel153
  - number: '154.1'
    text: |-
      Een gerechtelijke erkentenis is het in een aanhangig geding door een partij uitdrukkelijk erkennen van de waarheid
      van een of meer stellingen van de wederpartij.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel154
  - number: '154.2'
    text: |-
      Een gerechtelijke erkentenis kan slechts worden herroepen, indien aannemelijk is dat zij door een dwaling of niet
      in vrijheid is afgelegd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel154
  - number: '155.1'
    text: |-
      De rechter ten overstaan van wie in een zaak bewijs is bijgebracht, zal daarin zoveel als mogelijk het eindvonnis
      wijzen of medewijzen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel155
  - number: '155.2'
    text: |-
      Van een afwijking van deze regel en de oorzaak daarvan wordt in het vonnis melding gemaakt. Tegen de afwijking
      staat geen voorziening open.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel155
  - number: '156.1'
    text: Akten zijn ondertekende geschriften, bestemd om tot bewijs te dienen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel156
  - number: '156.2'
    text: |-
      Authentieke akten zijn akten in de vereiste vorm en bevoegdelijk opgemaakt door ambtenaren, aan wie bij of
      krachtens de wet is opgedragen op die wijze te doen blijken van door hen gedane waarnemingen of verrichtingen.
      Als authentieke akten worden tevens beschouwd de akten, waarvan het opmaken aan ambtenaren is voorbehouden, doch
      waarvan de wet het opmaken in bepaalde gevallen aan anderen dan ambtenaren opdraagt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel156
  - number: '156.3'
    text: Onderhandse akten zijn alle akten die niet authentieke akten zijn.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel156
  - number: '157.1'
    text: |-
      Authentieke akten leveren tegen een ieder dwingend bewijs op van hetgeen de ambtenaar binnen de kring van zijn
      bevoegdheid omtrent zijn waarnemingen en verrichtingen heeft verklaard.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel157
  - number: '157.2'
    text: |-
      Een authentieke of onderhandse akte levert ten aanzien van de verklaring van een partij omtrent hetgeen de akte
      bestemd is ten behoeve van de wederpartij te bewijzen, tussen partijen dwingend bewijs op van de waarheid van die
      verklaring, tenzij dit zou kunnen leiden tot een rechtsgevolg dat niet ter vrije bepaling van partijen staat. Onder
      partij wordt begrepen de rechtverkrijgende onder algemene of bijzondere titel, voor zover het desbetreffende recht
      is verkregen na het opmaken van de akte.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel157
  - number: '158.1'
    text: |-
      Op een onderhandse akte waarin verbintenissen van slechts één partij zijn aangegaan of vastgelegd, is, voor
      zover die verbintenissen strekken tot voldoening van een geldsom, [het tweede lid van artikel 157][ref1] niet van
      toepassing, tenzij deze partij de akte geheel met de hand heeft geschreven of heeft voorzien van een goedkeuring
      die de geldsom voluit in letters vermeldt.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel157
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '157'
        paragraaf: '2'
        afdeling: Negende
  - number: '158.2'
    text: |-
      Het eerste lid is niet van toepassing op aandelen in een obligatielening en op verbintenissen door de schuldenaar
      in de uitoefening van zijn beroep of bedrijf aangegaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel158
  - number: '159.1'
    text: |-
      Een geschrift dat het uiterlijk heeft van een authentieke akte, geldt als zodanig behoudens bewijs van het
      tegendeel.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel159
  - number: '159.2'
    text: |-
      Een onderhandse akte waarvan de ondertekening door de partij, tegen welke zij dwingend bewijs zou leveren, stellig
      wordt ontkend, levert geen bewijs op, zolang niet bewezen is van wie de ondertekening afkomstig is. Is degeen tegen
      wie de akte wordt ingeroepen een ander dan hij die haar ondertekend zou hebben, dan kan worden volstaan met de
      verklaring, dat men de echtheid van de ondertekening niet erkent.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel159
  - number: '160.1'
    text: De kracht van het schriftelijke bewijs is in de oorspronkelijke akte gelegen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel160
  - number: '160.2'
    text: |-
      Grossen en gehele afschriften van een authentieke akte die volgens wettelijk voorschrift moet worden bewaard,
      leveren, wanneer zij zijn afgegeven door een daartoe bevoegde ambtenaar, hetzelfde bewijs op als de oorspronkelijke
      akte.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel160
  - number: '161'
    text: |-
      Een in kracht van gewijsde gegaan, op tegenspraak gewezen vonnis waarbij de Nederlandse strafrechter bewezen heeft
      verklaard dat iemand een feit heeft begaan, levert dwingend bewijs op van dat feit.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel161
  - number: '162.1'
    text: |-
      De rechter kan in de loop van een geding, op verzoek of ambtshalve, aan partijen of aan een van hen de openlegging
      bevelen van de boeken, bescheiden en geschriften, die zij ingevolge de wet moeten houden, maken of bewaren.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel162
  - number: '162.2'
    text: Wordt aan dit bevel niet voldaan, dan kan de rechter daaruit de gevolgtrekking maken die hij geraden acht.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel162
  - number: '162.3'
    text: |-
      In een geding betreffende een jaarrekening kan de rechter ook ambtshalve de openlegging bevelen op straffe van
      een dwangsom.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel162
  - number: '163'
    text: |-
      Een getuigenverklaring kan slechts als bewijs dienen, voor zover zij betrekking heeft op aan de getuige uit eigen
      waarneming bekende feiten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel163
  - number: '164.1'
    text: Ook partijen kunnen als getuige optreden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel164
  - number: '164.2'
    text: |-
      Indien een partij als getuige is gehoord, kan haar verklaring omtrent door haar te bewijzen feiten geen bewijs in
      haar voordeel opleveren, tenzij de verklaring strekt ter aanvulling van onvolledig bewijs.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel164
  - number: '164.3'
    text: |-
      Indien een partij die gehouden is als getuige een verklaring af te leggen, niet ter terechtzitting verschijnt,
      niet antwoordt op de haar gestelde vragen of weigert haar verklaring te ondertekenen, kan de rechter daaruit de
      gevolgtrekking maken die hij geraden acht.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel164
  - number: '165.1'
    text: Een ieder, daartoe op wettige wijze opgeroepen, is verplicht getuigenis af te leggen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel165
  - number: '165.2'
    text: 'Van deze verplichting kunnen zich verschonen:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel165
  - number: 165.2.a
    text: |-
      de echtgenoot en de vroegere echtgenoot dan wel de geregistreerde partner en de vroegere geregistreerde partner van
      een partij, de bloed- of aanverwanten van een partij of van de echtgenoot of van de geregistreerde partner van een
      partij, tot de tweede graad ingesloten, een en ander tenzij de partij in hoedanigheid optreedt;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel165
  - number: 165.2.b
    text: |-
      zij die tot geheimhouding verplicht zijn uit hoofde van hun ambt, beroep of betrekking omtrent hetgeen hun in die
      hoedanigheid is toevertrouwd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel165
  - number: '165.3'
    text: |-
      De getuige kan zich verschonen van het beantwoorden van een hem gestelde vraag, indien hij daardoor of zichzelf,
      of een van zijn bloed- of aanverwanten in de rechte lijn of in de zijlijn in de tweede of derde graad, of zijn
      echtgenoot of vroegere echtgenoot onderscheidenlijk zijn geregistreerde partner of vroegere geregistreerde partner
      aan het gevaar van een strafrechtelijke veroordeling ter zake van een misdrijf zou blootstellen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel165
  - number: '166.1'
    text: |-
      Indien bewijs door getuigen bij de wet is toegelaten, beveelt de rechter een getuigenverhoor zo vaak een van de
      partijen het verzoekt en de door haar te bewijzen aangeboden feiten betwist zijn en tot de beslissing van de zaak
      kunnen leiden. Hij kan dit ook ambtshalve doen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel166
  - number: '166.2'
    text: |-
      Het vonnis vermeldt aan welke partij en omtrent welke feiten bewijs worden opgedragen alsmede de plaats waar, en
      de dag en het uur waarop de getuigen zullen worden gehoord. Plaats, dag en uur van het getuigenverhoor kunnen ook
      later door de rechter worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel166
  - number: '166.3'
    text: Het verhoor van getuigen geschiedt ter terechtzitting.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel166
  - number: '167'
    text: De rechter kan bepalen dat partijen bij de getuigenverhoren in persoon aanwezig moeten zijn.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel167
  - number: '168'
    text: |-
      Het verhoor van getuigen tot het leveren van tegenbewijs staat van rechtswege vrij en wordt gehouden op de plaats,
      de dag en het uur te bepalen dadelijk na afloop van het verhoor van de voor het bewijs gehoorde getuigen of op een
      later tijdstip, tenzij de rechter, na overleg met partijen, dit verhoor doet plaatsvinden in aansluiting op het
      verhoor van de voor het bewijs gehoorde getuigen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel168
  - number: '169'
    text: |-
      Indien een partij verkorting of verlenging van de termijnen, bedoeld in de [artikelen 166][ref1] en [168][ref2],
      verzoekt, wordt op dit verzoek na verhoor of behoorlijke oproeping van de wederpartij beslist. Tegen de beslissing
      staat geen hogere voorziening open.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel166
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel168
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel169
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '166'
        paragraaf: '4'
        afdeling: Negende
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '168'
        paragraaf: '4'
        afdeling: Negende
  - number: '170.1'
    text: |-
      De namen en woonplaatsen van de getuigen worden ten minste een week voor het verhoor aan de wederpartij en aan de
      griffier opgegeven. De belanghebbende partij roept de getuigen ten minste een week voor het verhoor bij exploot
      of bij aangetekende brief op. De dag van de oproeping en de dag van het verhoor worden niet meegerekend bij het
      bepalen van deze termijn. Indien een partij meer getuigen heeft voorgebracht dan redelijkerwijs noodzakelijk was,
      kan de rechter daarmee bij de veroordeling in de kosten rekening houden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel170
  - number: '170.2'
    text: |-
      De oproeping maakt melding van dag, uur en plaats van het verhoor, van de feiten waaromtrent bewijs moet worden
      geleverd en van de gevolgen, verbonden aan het niet verschijnen ter terechtzitting.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel170
  - number: '171'
    text: |-
      Indien een bij aangetekende brief opgeroepen getuige niet ter terechtzitting verschijnt, bepaalt de rechter op
      verzoek van de belanghebbende partij een dag waartegen de getuige bij exploot kan worden opgeroepen. Daarbij wordt
      de termijn, bedoeld in [artikel 170, eerste lid][ref1], in acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel170
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '170'
        paragraaf: '4'
        afdeling: Negende
  - number: '172'
    text: |-
      De rechter kan bevelen, dat de op een oproeping bij exploot niet ter terechtzitting verschenen getuige door de
      openbare macht voor hem wordt gebracht op een door hem te bepalen dag en uur om aan zijn verplichting te voldoen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel172
  - number: '173.1'
    text: |-
      Indien een getuige weigert zijn verklaring af te leggen, kan de rechter op verzoek van de belanghebbende partij
      bevelen, dat hij op kosten van die partij in gijzeling zal worden gesteld totdat hij aan zijn verplichting zal
      hebben voldaan, met dien verstande dat de gijzeling ten hoogste een jaar kan duren. Deze bepaling is niet van
      toepassing als het een partij betreft die als getuige wordt gehoord.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel173
  - number: '173.2'
    text: |-
      De rechter beveelt de gijzeling slechts indien naar zijn oordeel het belang van de waarheidsvinding toepassing van
      die maatregel rechtvaardigt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel173
  - number: '173.3'
    text: |-
      De rechter die de gijzeling heeft bevolen, beëindigt ambtshalve of op verzoek van de gegijzelde de gijzeling
      indien voortzetting ervan naar zijn oordeel niet meer door het belang dat met toepassing van de dwangmaatregel werd
      gediend, wordt gerechtvaardigd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel173
  - number: '174.1'
    text: |-
      Indien een getuige te ver verwijderd woont, kan de rechter het verhoor opdragen aan de rechter van gelijke rang van
      de woonplaats van de getuige.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel174
  - number: '174.2'
    text: Het eerste lid is niet van toepassing indien het een partij betreft die als getuige wordt gehoord.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel174
  - number: '175'
    text: |-
      Indien een getuige verhinderd is uit hoofde van ziekte of anderszins om naar het gerechtsgebouw te komen, kan de
      rechter zich bij hem vervoegen tot het ontvangen van zijn verklaring of de rechter, in [artikel 174][ref1] bedoeld,
      verzoeken hem te verhoren.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel174
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel175
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '174'
        paragraaf: '4'
        afdeling: Negende
  - number: '176.1'
    text: |-
      Voor zover bij verdrag of EG-verordening niet anders is bepaald, kan de rechter, indien een getuige in het
      buitenland woont, aan een door hem aan te wijzen autoriteit van het land waar de getuige zijn woonplaats heeft,
      verzoeken het verhoor, indien mogelijk onder ede, te houden, of dat verhoor opdragen aan de Nederlandse consulaire
      ambtenaar tot wiens ressort de woonplaats van die getuige behoort.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel176
  - number: '176.2'
    text: |-
      De rechter bepaalt dan tevens de termijn die in acht genomen moet worden bij het betekenen aan de wederpartij van
      de plaats, de dag en het uur waarop dit verhoor wordt gehouden en stelt mede de dag vast waarop de zaak weer op de
      rol zal komen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel176
  - number: '176.3'
    text: |-
      Het proces-verbaal van dit getuigenverhoor heeft gelijke kracht als dat van het door de Nederlandse rechter
      gehouden verhoor.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel176
  - number: '177.1'
    text: |-
      Op de bepaalde dag vraagt de rechter de getuigen hun naam, voornamen, leeftijd, beroep en woon- of verblijfplaats,
      of zij bloed- of aanverwant zijn van de partijen of van een van hen, en zo ja in welke graad, alsmede of zij in
      dienstverband staan tot partijen of een van hen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel177
  - number: '177.2'
    text: |-
      De getuigen zweren, alvorens hun getuigenis af te leggen, op de bij de wet bepaalde wijze de eed de gehele waarheid
      en niets dan de waarheid te zullen zeggen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel177
  - number: '177.3'
    text: |-
      Indien een getuige de betekenis van de eed niet voldoende kan beseffen of de leeftijd van zestien jaren nog niet
      heeft bereikt, wordt hij niet beëdigd, maar wordt hij aangemaand de gehele waarheid en niets dan de waarheid te
      zeggen. Indien het bewijs mede wordt aangenomen op de verklaring van een zodanige getuige, geeft het vonnis daarvan
      in het bijzonder reden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel177
  - number: '177.4'
    text: |-
      Overigens mag de rechter aan een onbeëdigde verklaring slechts bewijs ontlenen indien hij in het vonnis vermeldt
      dat de eed ten onrechte niet is afgenomen en dat het niet mogelijk is de getuige opnieuw te horen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel177
  - number: '178'
    text: |-
      De opgeroepen getuige die niet ter terechtzitting verschijnt of, verschenen zijnde, weigert de eed of zijn
      verklaring af te leggen, kan worden veroordeeld tot vergoeding van de vergeefs aangewende kosten, onverminderd zijn
      aansprakelijkheid tot schadevergoeding indien daartoe gronden zijn.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel178
  - number: '179.1'
    text: |-
      De rechter hoort ieder van de getuigen buiten tegenwoordigheid van de mede ter terechtzitting verschenen getuigen
      die nog niet zijn gehoord, voor zover deze laatste getuigen niet tevens partij zijn.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel179
  - number: '179.2'
    text: |-
      Partijen en hun raadslieden kunnen aan de getuigen vragen stellen, behoudens de bevoegdheid van de rechter om te
      beletten dat aan een bepaalde vraag gevolg wordt gegeven. De rechter kan ambtshalve of op verzoek van een partij
      getuigen tegenover elkaar of tegenover partijen of een van hen stellen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel179
  - number: '179.3'
    text: |-
      De rechter kan naar aanleiding van de getuigenverklaringen aan partijen vragen stellen. Indien het betreft het
      verhoor van een getuige die niet tevens partij is, kunnen ook partijen elkaar zelf of bij monde van hun raadslieden
      vragen stellen, behoudens de bevoegdheid van de rechter om te beletten dat aan een bepaalde vraag gevolg wordt
      gegeven.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel179
  - number: '179.4'
    text: |-
      Een verklaring omtrent door haar te bewijzen feiten kan in het voordeel van de partij die haar aflegde geen bewijs
      opleveren. Overigens kan de rechter uit de op de voet van het derde lid afgelegde verklaringen, uit het niet-
      verschijnen ter terechtzitting of uit een weigering om te antwoorden of het proces-verbaal te ondertekenen, de
      gevolgtrekking maken die hij geraden acht, behoudens hetgeen in [artikel 154][ref1] is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel154
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel179
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '154'
        paragraaf: '1'
        afdeling: Negende
  - number: '180.1'
    text: |-
      Van het getuigenverhoor wordt proces-verbaal opgemaakt, waarin achtereenvolgens aantekening geschiedt van de in
      acht genomen vormen en van al hetgeen met betrekking tot de zaak voorvalt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel180
  - number: '180.2'
    text: |-
      Dit proces-verbaal wordt aan iedere getuige voorgelezen voor het gedeelte dat hem betreft. Hij mag daarin zodanige
      veranderingen en bijvoegingen maken als hem goeddunkt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel180
  - number: '180.3'
    text: |-
      De getuige ondertekent zijn verklaring. Weigert hij te ondertekenen of verklaart hij dit niet te kunnen, dan wordt
      die weigering of die verklaring, inhoudende de oorzaak van verhindering, in het proces-verbaal vermeld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel180
  - number: '180.4'
    text: Op de door partijen afgelegde verklaringen zijn het eerste, tweede en derde lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel180
  - number: '180.5'
    text: |-
      Het proces-verbaal wordt ondertekend door de rechter voor wie het getuigenverhoor heeft plaatsgehad en door de
      griffier.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel180
  - number: '181.1'
    text: |-
      In afwijking van [artikel 180][ref1] behoeft in zaken die niet aan hoger beroep zijn onderworpen, geen proces-
      verbaal van het getuigenverhoor te worden opgemaakt. Het naar aanleiding van het getuigenverhoor te wijzen vonnis
      houdt, behalve de vermelding van de opgave, verklaringen en eedsaflegging bij [artikel 177][ref2] aangeduid, de
      summiere inhoud van de afgelegde getuigenverklaringen in.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel180
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel177
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel181
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '180'
        paragraaf: '4'
        afdeling: Negende
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '177'
        paragraaf: '4'
        afdeling: Negende
  - number: '181.2'
    text: Het eerste lid wordt niet toegepast in zaken die in eerste aanleg door een gerechtshof worden behandeld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel181
  - number: '182'
    text: |-
      Indien de getuige schadeloosstelling vordert, wordt deze door de rechter begroot. Daarvan wordt melding gemaakt in
      het proces-verbaal. De schadeloosstelling wordt voldaan door de partij die de getuige heeft voorgebracht.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel182
  - number: '183'
    text: |-
      In geval de getuigen niet op één dag kunnen worden gehoord, stelt de rechter het verdere horen tot een nadere dag
      uit en geschiedt er noch aan de ter terechtzitting verschenen getuigen noch aan de al dan niet aldaar verschenen
      partij enige nieuwe oproeping.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel183
  - number: '184'
    text: |-
      Het nalaten van een van de in deze paragraaf voorgeschreven formaliteiten heeft, met uitzondering van
      [artikel 177][ref1] omtrent het afleggen van de eed, alleen de nietigheid van het verhoor ten gevolge indien
      de belanghebbende partij daardoor in haar belangen is benadeeld en het verzuim niet kan worden hersteld; in het
      tegenovergestelde geval kan de rechter, zo daartoe gronden zijn, herstel van begane onregelmatigheden bevelen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel177
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel184
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '177'
        paragraaf: '4'
        afdeling: Negende
  - number: '185'
    text: |-
      Na afloop van het getuigenverhoor of indien dit achterwege blijft, bepaalt de rechter de dag waarop de zaak weer op
      de rol zal komen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel185
  - number: '186.1'
    text: |-
      In de gevallen waarin bij de wet het bewijs door getuigen is toegelaten, kan, voordat een zaak aanhangig is, op
      verzoek van de belanghebbende onverwijld een voorlopig getuigenverhoor worden bevolen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel186
  - number: '186.2'
    text: Tijdens een reeds aanhangig geding kan de rechter op verzoek van een partij een voorlopig getuigenverhoor bevelen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel186
  - number: '187.1'
    text: |-
      Het verzoek wordt gedaan aan de rechter die vermoedelijk bevoegd zal zijn van de zaak, indien deze aanhangig
      wordt gemaakt, kennis te nemen, of aan de rechter tot wiens absolute bevoegdheid de zaak behoort en binnen wiens
      rechtsgebied de personen die men als getuigen wil doen horen, of het grootste aantal van hen, woonachtig zijn of
      verblijven. Indien de zaak door de kantonrechter moet worden behandeld en beslist, wordt het verzoek gedaan aan
      de kantonrechter. De rechter beoordeelt summierlijk of hij absoluut bevoegd is en of de zaak door de kantonrechter
      moet worden behandeld en beslist.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel187
  - number: '187.2'
    text: Indien het geding reeds aanhangig is, wordt het verzoek gedaan aan de rechter waar het geding aanhangig is.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel187
  - number: '187.3'
    text: 'Het verzoekschrift houdt in:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel187
  - number: 187.3.a
    text: de aard en het beloop van de vordering;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel187
  - number: 187.3.b
    text: de feiten of rechten die men wil bewijzen;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel187
  - number: 187.3.c
    text: de namen en woonplaatsen van de personen die men als getuigen wil doen horen;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel187
  - number: 187.3.d
    text: de naam en de woonplaats van de wederpartij of de redenen waarom de wederpartij onbekend is.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel187
  - number: '187.4'
    text: |-
      Tenzij de wederpartij onbekend is en behoudens gevallen van onverwijlde spoed, wordt op het verzoekschrift niet
      eerder beschikt dan nadat een behandeling heeft plaatsgevonden, waartoe de verzoeker en de wederpartij worden
      opgeroepen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel187
  - number: '188.1'
    text: |-
      Indien de rechter het verzoek toestaat, bepaalt hij de plaats, de dag en het uur waarop het voorlopig
      getuigenverhoor zal plaatshebben en de dag waarop uiterlijk de verzoeker een afschrift van het verzoekschrift,
      indien dit nog niet is toegezonden, en van de beschikking aan de wederpartij, zo die bekend is, moet doen toekomen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel188
  - number: '188.2'
    text: Voor zover het verzoek wordt toegewezen, is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel188
  - number: '189'
    text: De bepalingen omtrent het getuigenverhoor zijn op het voorlopig getuigenverhoor van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel189
  - number: '190.1'
    text: |-
      Met inachtneming van de termijn die krachtens [artikel 188][ref1] door de rechter is bepaald, zendt de verzoeker,
      indien de wederpartij bekend is, haar bij aangetekende brief een afschrift van het verzoekschrift, indien dit nog
      niet is toegezonden, en van de beschikking van de rechter, of doet hij haar deze afschriften betekenen. Alvorens
      tot het houden van het voorlopig getuigenverhoor over te gaan, vergewist de rechter zich ervan dat aan dit
      voorschrift is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel188
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel190
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '188'
        paragraaf: '5'
        afdeling: Negende
  - number: '190.2'
    text: |-
      Verschijnt de wederpartij bij het verhoor ter terechtzitting, dan bepaalt de rechter na afloop daarvan op haar
      verzoek de plaats waar en het tijdstip waarop het voorlopig getuigenverhoor voor tegenbewijs kan plaatshebben.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel190
  - number: '191.1'
    text: |-
      De rechter kan, op verzoek van partijen of van een van hen dan wel ambtshalve, na afloop van het voorlopig
      getuigenverhoor of het voorlopig getuigenverhoor voor tegenbewijs een verschijning van partijen bevelen teneinde een
      schikking te beproeven of tot het geven van inlichtingen aan de rechter. [Artikel 87, tweede en derde lid][ref1],
      en [artikel 88, tweede lid, derde lid, eerste en tweede zin, en vierde lid][ref2], zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel88
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel191
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '87'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '88'
        afdeling: Eerste
  - number: '191.2'
    text: |-
      Bij een verschijning van partijen ter terechtzitting kan ook de verdere wijze van behandeling van geschillen over
      de vordering worden besproken. Afspraken dienaangaande worden, wanneer een partij dat verlangt, met overeenkomstige
      toepassing van [artikel 87, derde lid][ref1], in een proces-verbaal vastgelegd. Een beroep in rechte op deze
      afspraken kan niet worden gedaan, voor zover zij in strijd komen met een dwingende wetsbepaling, met fundamentele
      beginselen van behoorlijke rechtspleging of voor zover een beroep daarop in verband met onvoorziene omstandigheden
      redelijkerwijs niet kan worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel87
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel191
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '87'
        afdeling: Eerste
  - number: '192.1'
    text: |-
      Indien alle partijen bij het verhoor aanwezig of vertegenwoordigd zijn geweest, hebben de getuigenverklaringen in
      een voorlopig getuigenverhoor afgelegd, dezelfde bewijskracht als die, welke op de gewone wijze in een aanhangig
      geding zijn afgelegd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel192
  - number: '192.2'
    text: |-
      Zijn niet alle partijen bij het voorlopig getuigenverhoor aanwezig of vertegenwoordigd geweest, dan kan de rechter
      de daarin afgelegde verklaringen buiten beschouwing laten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel192
  - number: '193'
    text: |-
      Indien een getuige aannemelijk maakt dat de verzoeker met het voorlopig getuigenverhoor beoogt inlichtingen van hem
      te verkrijgen ten behoeve van een tegen hem in te stellen vordering, houdt de rechter het verhoor met inachtneming
      van de bepalingen die van toepassing zijn op het verhoor van de partij als getuige. Van een en ander wordt melding
      gemaakt in het proces-verbaal.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel193
  - number: '194.1'
    text: |-
      De rechter kan op verzoek van een partij of ambtshalve een bericht of een verhoor van deskundigen bevelen. Het
      vonnis vermeldt de punten waarover het oordeel van deskundigen wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel194
  - number: '194.2'
    text: |-
      De rechter benoemt bij vonnis of bij latere rolbeschikking een of meer deskundigen na overleg met partijen,
      met opdracht bij hem schriftelijk bericht in te leveren of aan hem mondeling verslag uit te brengen. Tegen deze
      benoeming staat geen hogere voorziening open.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel194
  - number: '194.3'
    text: De griffier zendt afschrift van deze benoeming aan de deskundigen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel194
  - number: '194.4'
    text: |-
      Indien een deskundige de benoeming niet aanneemt of zijn taak niet naar behoren zal kunnen volbrengen of
      weigerachtig is dit te doen, kan de rechter ambtshalve of op verzoek van de meest gerede partij, na overleg met
      partijen, een andere deskundige in zijn plaats benoemen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel194
  - number: '194.5'
    text: |-
      De rechter kan, op verzoek van een partij of ambtshalve, aan de deskundigen het geven van nadere mondelinge of
      schriftelijke toelichting of aanvulling bevelen, dan wel, na overleg met partijen, een of meer andere deskundigen
      benoemen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel194
  - number: '195'
    text: |-
      De rechter kan ambtshalve of op verzoek van een of meer partijen deskundigen vragen hun kosten te
      begroten. Door de eisende partij wordt een door de rechter te bepalen voorschot en, indien dit is
      bepaald, een nader voorschot, ter zake van die kosten ter griffie gedeponeerd, voor zover niet bij het
      vonnis, bedoeld in [artikel 194, eerste lid][ref1], in verband met de omstandigheden van het geding de
      wederpartij of beide partijen te zamen daartoe is of zijn aangewezen. Aan partijen aan wie ingevolge de
      [Wet op de rechtsbijstand][ref2] een toevoeging is verleend of ten aanzien van wie ingevolge [artikel 18][ref3]
      of [artikel 18a van de Wet tarieven in burgerlijke zaken][ref4] het vast recht gedeeltelijk in debet is
      gesteld, wordt geen voorschot opgelegd. Evenmin wordt een voorschot opgelegd aan partijen die geen griffierecht
      verschuldigd zijn en ten aanzien van wie de griffier verklaart dat zij, indien zij griffierecht verschuldigd
      waren, voor gedeeltelijke indebetstelling in aanmerking zouden komen. Weigert de griffier een verklaring
      als bedoeld in de vorige zin af te geven, dan staat daartegen verzet open op de wijze als voorzien in
      [artikel 25 van de Wet tarieven in burgerlijke zaken][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel194
      [ref2]: https://wetten.overheid.nl/BWBR0006368
      [ref3]: https://wetten.overheid.nl/BWBR0001852#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0001852#Artikel18a
      [ref5]: https://wetten.overheid.nl/BWBR0001852#Artikel25
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel195
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '194'
        paragraaf: '6'
        afdeling: Negende
      - id: ref2
        bwb_id: BWBR0006368
      - id: ref3
        bwb_id: BWBR0001852
        artikel: '18'
      - id: ref4
        bwb_id: BWBR0001852
        artikel: 18a
      - id: ref5
        bwb_id: BWBR0001852
        artikel: '25'
  - number: '196.1'
    text: |-
      De rechter kan, zo nodig ambtshalve, bij de bepaling van een voorschot als bedoeld in [artikel 195][ref1], of
      nadien, een termijn vaststellen voor de voldoening van het voorschot. Deze termijn kan een of meermalen worden
      verlengd. Tegen beslissingen ingevolge de eerste en tweede zin staat geen hogere voorziening open.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel195
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel196
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '195'
        paragraaf: '6'
        afdeling: Negende
  - number: '196.2'
    text: |-
      Wanneer een partij het voorschot niet binnen de daarvoor gestelde termijn voldoet, kan de rechter daaruit de
      gevolgtrekking maken die hij geraden acht.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel196
  - number: '197.1'
    text: |-
      Indien de deskundigen een onderzoek moeten verrichten, bepaalt de rechter bij hun benoeming of op een later
      tijdstip waar en wanneer zij tot het onderzoek zullen overgaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel197
  - number: '197.2'
    text: |-
      Bij de in het eerste lid bedoelde beslissing bepaalt de rechter tevens de termijn waarbinnen de deskundigen
      hun schriftelijke bericht ter griffie moeten inleveren of de terechtzitting waarop zij mondeling verslag moeten
      uitbrengen. In het eerste geval wordt mede de dag bepaald waarop de zaak weer op de rol zal komen. In het tweede
      geval wordt deze dag bepaald op de terechtzitting waarop het verslag is uitgebracht.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel197
  - number: '197.3'
    text: |-
      Wanneer op die dag het bericht van deskundigen nog niet mocht zijn ingekomen, kan de rechter op verzoek van
      partijen of van een van hen een nadere roldatum bepalen. Eveneens kan een nadere terechtzitting worden bepaald,
      wanneer op de daarvoor vastgestelde terechtzitting het mondelinge verslag niet wordt uitgebracht.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel197
  - number: '198.1'
    text: |-
      De deskundige die zijn benoeming heeft aanvaard, is verplicht de opdracht onpartijdig en naar beste weten te
      volbrengen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel198
  - number: '198.2'
    text: |-
      De deskundigen stellen hun onderzoek in, hetzij onder leiding van de rechter, hetzij zelfstandig. De deskundigen
      moeten bij hun onderzoek partijen in de gelegenheid stellen opmerkingen te maken en verzoeken te doen. Uit het
      schriftelijke bericht moet blijken of aan dit voorschrift is voldaan. Van de inhoud van de opmerkingen en verzoeken
      wordt in het schriftelijke bericht melding gemaakt. Indien een partij schriftelijke opmerkingen aan de deskundigen
      doet toekomen, verstrekt zij daarvan terstond afschrift aan de wederpartij.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel198
  - number: '198.3'
    text: |-
      Partijen zijn verplicht mee te werken aan een onderzoek door deskundigen. Wordt aan deze verplichting niet voldaan,
      dan kan de rechter daaruit de gevolgtrekking maken die hij geraden acht.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel198
  - number: '198.4'
    text: |-
      Het schriftelijke bericht is met redenen omkleed zonder dat het persoonlijke gevoelen van ieder van de deskundigen
      behoeft te blijken. Ieder van de deskundigen kan van zijn afwijkende mening doen blijken. Het schriftelijke bericht
      wordt door de deskundigen ondertekend. Indien een of meer deskundigen niet hebben ondertekend, wordt de oorzaak
      hiervan zo mogelijk op het schriftelijke bericht vermeld. Indien geen van de deskundigen zich in de gelegenheid
      bevindt te ondertekenen, wordt het bericht door de griffier ondertekend. De griffier zendt aan partijen afschrift
      van het schriftelijke bericht.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel198
  - number: '198.5'
    text: |-
      Het proces-verbaal van de slotsom van het mondelinge verslag wordt na voorlezing, behalve door de griffier,
      ondertekend door de rechter aan wie het verslag is uitgebracht en door de deskundigen. Verklaart een deskundige
      niet te kunnen ondertekenen, dan wordt die verklaring, inhoudende de oorzaak van verhindering, in het proces-
      verbaal vermeld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel198
  - number: '199.1'
    text: |-
      De deskundigen hebben aanspraak op schadeloosstelling en op loon, door de rechter te begroten onder de minuut van
      het schriftelijke bericht of onder het van het mondelinge verslag opgemaakte proces-verbaal.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel199
  - number: '199.2'
    text: |-
      De griffier betaalt het bedrag ten laste van het gestorte voorschot aan de deskundigen. Indien het vastgestelde
      voorschot niet toereikend is, wordt voor het resterende bedrag een bevelschrift van tenuitvoerlegging op de minuut
      van het schriftelijke bericht uitgegeven ten laste van de in [de tweede volzin van artikel 195][ref1] genoemde
      partij of partijen. In geval van mondeling verslag wordt dit bevelschrift gegeven op een in executoriale vorm
      uitgegeven uittreksel uit het proces-verbaal van dat verslag.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel195
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel199
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '195'
        paragraaf: '6'
        afdeling: Negende
  - number: '199.3'
    text: |-
      Voor zover ten gevolge van [artikel 195, derde tot en met vijfde volzin, het tweede lid][ref1] niet kan worden
      toegepast, betaalt de griffier het bedrag waarop de deskundigen aanspraak hebben ten laste van 's Rijks kas.
      Hangende het geding wordt het ten laste van 's Rijks kas betaalde bedrag voorlopig in debet gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel195
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel199
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '195'
        paragraaf: '6'
        afdeling: Negende
  - number: '200.1'
    text: De rechter kan een partij op haar verzoek toestaan deskundigen te doen horen die niet door de rechter zijn benoemd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel200
  - number: '200.2'
    text: |-
      De rechter ten overstaan van wie in een zaak bewijs wordt bijgebracht, kan aan partijen toestaan, bij die
      gelegenheid ook zodanige deskundigen te doen horen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel200
  - number: '200.3'
    text: |-
      Indien de rechter een verhoor van een zodanige deskundige heeft toegestaan, is ook de wederpartij bevoegd op
      dezelfde voet deskundigen te doen horen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel200
  - number: '200.4'
    text: |-
      De rechter kan, op verzoek van een partij of ambtshalve, aan een zodanige deskundige het geven van nadere,
      mondelinge of schriftelijke, toelichting bevelen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel200
  - number: '200.5'
    text: |-
      De [artikelen 166, derde lid][ref1], [167 tot en met 170][ref2], [174 tot en met 177, eerste lid][ref3],
      [179, tweede, derde en vierde lid][ref4], en [180 tot en met 185][ref5] omtrent het getuigenverhoor zijn van
      overeenkomstige toepassing op het verhoor van deze deskundigen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel166
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel167
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel174
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel179
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel180
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel200
