        bwb_id: BWBR0001827
        artikel: '180'
        paragraaf: '4'
        afdeling: Negende
  - number: '201.1'
    text: |-
      De rechter kan op verzoek van een partij of ambtshalve, vergezeld van de griffier, een plaatselijke gesteldheid
      opnemen of zaken bezichtigen die niet of bezwaarlijk ter terechtzitting kunnen worden overgebracht.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel201
  - number: '201.2'
    text: |-
      Het daartoe strekkende vonnis vermeldt de plaats of de zaak welke in ogenschouw moet worden genomen, bepaalt de
      tijd van de plaatsopneming, de tijd en de plaats van de bezichtiging, de termijn waarbinnen het van de verrichting
      op te maken proces-verbaal ter griffie moet zijn neergelegd, alsmede de dag waarop de zaak weer op de rol zal
      komen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel201
  - number: '201.3'
    text: |-
      De rechter heeft voor het doen van een plaatsopneming of een bezichtiging als bedoeld in het eerste lid,
      toegang tot elke plaats. Op het proces-verbaal als bedoeld in het tweede lid, zijn de [artikelen 10][ref1] en
      [11, tweede lid, van de Algemene wet op het binnentreden][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0006763#Artikel11
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel201
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0006763
        artikel: '11'
  - number: '201.4'
    text: |-
      Partijen worden in de gelegenheid gesteld opmerkingen te maken of verzoeken te doen. Uit het proces-verbaal moet
      blijken of aan dit voorschrift is voldaan. Van de inhoud van de opmerkingen of verzoeken wordt in het proces-
      verbaal melding gemaakt. Het proces-verbaal wordt door de rechter die de verrichting heeft gedaan, en door
      de griffier ondertekend. De rechter kan ter plaatse getuigen horen. De vierde paragraaf van deze afdeling is,
      behoudens [artikel 170][ref1], hierop van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel170
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel201
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '170'
        paragraaf: '4'
        afdeling: Negende
  - number: '201.5'
    text: |-
      De rechter kan zich tot de uitoefening van de in dit artikel toegekende bevoegdheden buiten zijn rechtsgebied
      begeven.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel201
  - number: '201.6'
    text: De reis- en verblijfkosten van de rechter en de griffier komen ten laste van de Staat.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel201
  - number: '202.1'
    text: |-
      Voordat een zaak aanhangig is, kan op verzoek van de belanghebbende een voorlopig bericht of verhoor van
      deskundigen of een voorlopige plaatsopneming en bezichtiging worden bevolen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel202
  - number: '202.2'
    text: Tijdens een reeds aanhangig geding kan dit op verzoek van een partij worden bevolen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel202
  - number: '203.1'
    text: |-
      Het verzoek wordt gedaan aan de rechter waar het geding aanhangig is of, indien het niet aanhangig is, aan de
      rechter die vermoedelijk bevoegd zal zijn daarvan kennis te nemen. Indien de zaak door de kantonrechter moet worden
      behandeld en beslist, wordt het verzoek gedaan aan de kantonrechter. De rechter beoordeelt summierlijk of hij
      absoluut bevoegd is en of de zaak door de kantonrechter moet worden behandeld en beslist.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel203
  - number: '203.2'
    text: 'Het verzoekschrift houdt in:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel203
  - number: 203.2.a
    text: de aard en het beloop van de vordering;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel203
  - number: 203.2.b
    text: |-
      de punten waarover het oordeel van de deskundigen wordt gevraagd of de plaats of de zaak die in ogenschouw moet
      worden genomen;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel203
  - number: 203.2.c
    text: de naam en de woonplaats van de wederpartij of de redenen waarom de wederpartij onbekend is.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel203
  - number: '203.3'
    text: |-
      Tenzij de wederpartij onbekend is en behoudens gevallen van onverwijlde spoed, wordt op het verzoekschrift niet
      eerder beschikt dan nadat een behandeling heeft plaatsgevonden, waartoe de verzoeker en de wederpartij worden
      opgeroepen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel203
  - number: '204.1'
    text: |-
      Indien de rechter het verzoek toestaat, bepaalt hij tevens de uiterste dag waarop de verzoeker een afschrift van
      het verzoekschrift, indien dit nog niet is toegezonden, en van de beschikking aan de wederpartij, zo die bekend is,
      moet doen toekomen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel204
  - number: '204.2'
    text: Voor zover het verzoek wordt toegewezen, is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel204
  - number: '205.1'
    text: |-
      De bepalingen betreffende deskundigen en betreffende plaatsopneming en bezichtiging zijn van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel205
  - number: '205.2'
    text: |-
      Indien ten aanzien van een partij, met toepassing van [het derde lid van artikel 199][ref1], het bedrag van de
      schadeloosstelling en het loon van deskundigen voorlopig in debet zijn gesteld, stelt de rechter op het moment
      van toezending van het schriftelijke bericht aan partijen of afgifte van het proces-verbaal van de slotsom van
      het mondelinge verslag, dan wel zo spoedig mogelijk daarna, vast welk deel van dit bedrag elk der partijen dient
      te dragen en veroordeelt hen dienovereenkomstig tot voldoening aan de griffier. Artikel 243, derde lid, is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel199
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel205
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '199'
        paragraaf: '6'
        afdeling: Negende
  - number: '205.3'
    text: |-
      Het tweede lid blijft buiten toepassing wanneer op het moment van de toezending aan de rechter is gebleken dat
      tussen partijen een geding aanhangig is over de vordering waarop het bericht of verhoor van deskundigen betrekking
      heeft.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel205
  - number: '206'
    text: |-
      Met inachtneming van de termijn, krachtens [artikel 204][ref1] bepaald, zendt de verzoeker een afschrift van het
      verzoekschrift, indien dit nog niet is toegezonden, en de beschikking van de rechter bij aangetekende brief aan de
      wederpartij, zo die bekend is, of doet hij deze afschriften bij exploot aan de wederpartij betekenen. Alvorens tot
      de verrichting over te gaan, vergewist de rechter zich ervan dat aan dit voorschrift is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel204
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel206
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '204'
        paragraaf: '8'
        afdeling: Negende
  - number: '207.1'
    text: |-
      Indien alle partijen bij de verrichting aanwezig zijn geweest, hebben de verklaringen van de deskundigen, de
      plaatsopneming en de bezichtiging dezelfde bewijskracht als die, welke op de gewone wijze in een aanhangig geding
      hebben plaatsgehad.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel207
  - number: '207.2'
    text: Zijn niet alle partijen aanwezig geweest, dan kan de rechter een en ander buiten beschouwing laten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel207
  - number: '208.1'
    text: |-
      Incidentele vorderingen worden ingesteld bij dagvaarding of bij met redenen omklede conclusie. De
      [artikelen 85][ref1], [86][ref2], [128][ref3], [133][ref4] en [134][ref5] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel86
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel128
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel133
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel134
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel208
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '85'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '86'
        afdeling: Eerste
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '128'
        afdeling: Vijfde
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '133'
        afdeling: Vijfde
      - id: ref5
        bwb_id: BWBR0001827
        artikel: '134'
        afdeling: Vijfde
  - number: '208.2'
    text: De rechter kan in bijzondere gevallen het nemen van conclusies van repliek en dupliek toestaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel208
  - number: '208.3'
    text: Incidentele vorderingen worden zoveel mogelijk tegelijk ingesteld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel208
  - number: '209'
    text: |-
      Op de incidentele vorderingen wordt, indien de zaak dat medebrengt, eerst en vooraf beslist. Voor zover de
      hoofdzaak niet gelijktijdig is afgedaan, bepaalt de rechter bij de beslissing op het incident tevens de dag waarop
      de zaak weer op de rol zal komen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel209
  - number: '210.1'
    text: |-
      Indien de gedaagde meent gronden te hebben om iemand in vrijwaring op te roepen en hij die oproeping niet heeft
      gedaan vóór de dag waarop de hoofdzaak moet dienen, neemt hij zijn daartoe strekkende, met redenen omklede
      conclusie vóór alle weren op de voor het nemen van de conclusie van antwoord bepaalde roldatum.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel210
  - number: '210.2'
    text: |-
      Indien de eiser meent gronden te hebben om iemand in vrijwaring op te roepen, neemt hij zijn daartoe strekkende,
      met redenen omklede conclusie uiterlijk op de roldatum, op zijn verzoek bepaald bij de verschijning van partijen
      ter terechtzitting op de voet van [artikel 131][ref1]. Vindt geen verschijning van partijen op de voet van
      [artikel 131][ref2] plaats, dan neemt de eiser zijn conclusie uiterlijk op de voor het nemen van de conclusie van
      repliek bepaalde datum.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel131
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel131
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel210
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '131'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '131'
        afdeling: Vijfde
  - number: '210.3'
    text: |-
      Indien de vordering wordt toegewezen, bepaalt de rechter de dag waarop zowel de hoofdzaak als de zaak in vrijwaring
      weer op de rol zullen komen. Betreft de zaak in vrijwaring een vordering die ongeacht het beloop of de waarde door
      de kantonrechter moet worden behandeld, dan verwijst de rechter beide zaken daarbij zo nodig, met overeenkomstige
      toepassing van [artikel 71][ref1], naar de kantonrechter.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel71
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel210
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '71'
        afdeling: Achtste
  - number: '210.4'
    text: |-
      Het vonnis waarbij de dagvaarding in vrijwaring is toegestaan, behoeft aan de waarborg niet betekend te worden.
      De dagvaarding moet de in het vonnis vermelde beslissing behelzen; bij die dagvaarding moet de dagvaarding in de
      hoofdzaak in afschrift worden betekend.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel210
  - number: '210.5'
    text: |-
      Indien de vordering wordt afgewezen, bepaalt de rechter bij die beslissing de dag waarop de zaak weer op de rol zal
      komen of beveelt hij een verschijning van partijen ter terechtzitting.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel210
  - number: '211'
    text: |-
      Indien de vordering tot oproeping in vrijwaring niet tijdig is gedaan, wordt zonder uitstel in de hoofdzaak
      voortgeprocedeerd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel211
  - number: '212'
    text: |-
      In geval van vrijwaring wegens uitwinning van een goed of wegens een recht waarmee het goed niet belast had mogen
      zijn, mag de waarborg de hoofdzaak van de gewaarborgde overnemen met dien verstande dat de gewaarborgde als partij
      in het geding blijft.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel212
  - number: '213.1'
    text: |-
      In het geval, bedoeld in [artikel 212][ref1], kan het tegen de waarborg gewezen vonnis tegen de gewaarborgde ten
      uitvoer worden gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel212
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel213
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '212'
        paragraaf: '2'
        afdeling: Tiende
  - number: '213.2'
    text: |-
      Wat de kosten en de vordering tot schadevergoeding betreft, kunnen de vereffening en de tenuitvoerlegging slechts
      tegen de waarborg geschieden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel213
  - number: '213.3'
    text: |-
      Indien echter de waarborg geen verhaal biedt, moet de gewaarborgde de kosten dragen en, zo daartoe gronden zijn,
      ook de schade vergoeden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel213
  - number: '214'
    text: |-
      In zaken van eenvoudige vrijwaring mag de waarborg zich in de hoofdzaak slechts voegen zonder de zaak van de
      gewaarborgde over te nemen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel214
  - number: '215'
    text: |-
      In geval de hoofdzaak en de zaak in vrijwaring tegelijk in staat van wijzen zijn, wordt daarin gelijktijdig
      beslist. Indien dit niet het geval is, wordt op vordering van de oorspronkelijke eiser of gedaagde de hoofdzaak
      afzonderlijk beslist.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel215
  - number: '216'
    text: |-
      Hij die ter zake van vrijwaring is gedagvaard, moet procederen voor de rechter waar de hoofdzaak aanhangig is,
      zelfs indien hij ontkent waarborg te zijn.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel216
  - number: '217'
    text: |-
      Ieder die een belang heeft bij een tussen andere partijen aanhangig geding, kan vorderen zich daarin te mogen
      voegen of daarin te mogen tussenkomen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel217
  - number: '218'
    text: |-
      Deze vordering wordt ingesteld bij incidentele conclusie vóór of op de roldatum waarop de laatste conclusie in het
      aanhangige geding wordt genomen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel218
  - number: '219.1'
    text: 'De conclusie vermeldt:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel219
  - number: 219.1.a
    text: de voornaam, de naam en de woonplaats van degene die de vordering instelt;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel219
  - number: 219.1.b
    text: de vordering en de gronden waarop zij berust;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel219
  - number: 219.1.c
    text: in zaken waarin partijen niet in persoon kunnen procederen, de naam van degene die als procureur wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel219
  - number: '219.2'
    text: |-
      De in het eerste lid aangeduide gegevens worden vermeld op straffe van nietigheid. Artikel 122 is van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel219
  - number: '220.1'
    text: |-
      In zaken die reeds eerder bij een andere gewone rechter van gelijke rang aanhangig zijn gemaakt tussen dezelfde
      partijen over hetzelfde onderwerp, of in geval de zaak verknocht is aan een zaak die reeds bij een andere gewone
      rechter van gelijke rang aanhangig is, kan de verwijzing naar die andere rechter worden gevorderd. Verwijzing is
      ook mogelijk indien één der zaken bij de kantonrechter in behandeling is en de andere niet.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel220
  - number: '220.2'
    text: |-
      Door de eiser kan deze vordering slechts worden ingesteld bij de inleidende dagvaarding of bij incidentele
      conclusie vóór het antwoord.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel220
  - number: '220.3'
    text: |-
      Door de gedaagde moet de vordering worden ingesteld bij met redenen omklede conclusie vóór alle weren op de voor
      het nemen van de conclusie van antwoord bepaalde roldatum.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel220
  - number: '220.4'
    text: |-
      In het geval van verwijzing naar een andere kamer van hetzelfde gerecht vermeldt de rechter in de beslissing
      tot verwijzing een nieuwe roldatum alsmede, indien daarin een wijziging optreedt, op welke wijze partijen in het
      geding moeten verschijnen. Indien tegen de gedaagde verstek is verleend, beveelt de rechter dat de nieuwe roldatum
      door de eiser bij exploot aan de gedaagde wordt aangezegd onder betekening van de beslissing tot verwijzing.
      [Artikel 221][ref1] is bij verwijzing naar een andere kamer van hetzelfde gerecht niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel221
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel220
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '221'
        paragraaf: '4'
        afdeling: Tiende
  - number: '220.5'
    text: |-
      Indien bij hetzelfde gerecht één der zaken in behandeling is bij de kantonrechter en deze een vordering betreft
      als bedoeld in [artikel 93 onder c of d][ref1], kan in de andere zaak verwijzing van die andere zaak naar de
      kantonrechter worden gevorderd, ook als die zaak reeds eerder aanhangig was.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel93
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel220
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '93'
        afdeling: Tweede
  - number: '221'
    text: |-
      Indien een zaak naar een andere rechter wordt verwezen, heeft iedere partij het recht de overige partijen bij
      exploot op te roepen tegen de dag waarop zij de zaak ter rolle wil doen dienen. Voor deze oproeping moeten de voor
      dagvaarding voorgeschreven termijnen in acht worden genomen. Is met het oog op het geding voor de eerste rechter
      woonplaats gekozen, dan kan het in dit artikel bedoelde exploot ook aan die woonplaats worden gedaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel221
  - number: '222.1'
    text: |-
      In geval voor dezelfde rechter tussen dezelfde partijen en over hetzelfde onderwerp tegelijk zaken aanhangig zijn,
      of voor dezelfde rechter verknochte zaken aanhangig zijn, kan daarvan de voeging worden gevorderd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel222
  - number: '222.2'
    text: |-
      [Artikel 220, tweede en derde lid][ref1], zijn op deze vordering van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel220
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel222
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '220'
        paragraaf: '4'
        afdeling: Tiende
  - number: '223.1'
    text: |-
      Tijdens een aanhangig geding kan iedere partij vorderen dat de rechter een voorlopige voorziening zal treffen voor
      de duur van het geding.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel223
  - number: '223.2'
    text: Deze vordering moet samenhangen met de hoofdvordering.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel223
  - number: '224.1'
    text: |-
      Allen zonder woonplaats of gewone verblijfplaats in Nederland die bij een Nederlandse rechter een vordering
      instellen of zich voegen of tussenkomen in een geding alhier, zijn verplicht op vordering van de wederpartij
      zekerheid te stellen voor de proceskosten en de schadevergoeding tot betaling waarvan zij veroordeeld zouden kunnen
      worden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel224
  - number: '224.2'
    text: 'Geen verplichting tot het stellen van zekerheid bestaat:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel224
  - number: 224.2.a
    text: indien dit voortvloeit uit een verdrag of uit een EG-verordening;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel224
  - number: 224.2.b
    text: |-
      indien een veroordeling tot betaling van proceskosten en schadevergoeding op grond van het Statuut voor het
      Koninkrijk der Nederlanden, een verdrag of een EG-verordening ten uitvoer zal kunnen worden gelegd ter plaatse waar
      degene van wie zekerheid gevorderd wordt, zijn woonplaats of gewone verblijfplaats heeft;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel224
  - number: 224.2.c
    text: |-
      indien redelijkerwijs aannemelijk is dat verhaal voor een veroordeling tot betaling van proceskosten en
      schadevergoeding in Nederland mogelijk zal zijn;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel224
  - number: 224.2.d
    text: |-
      indien daardoor voor degene van wie zekerheid wordt gevorderd de effectieve toegang tot de rechter zou worden
      belemmerd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel224
  - number: '224.3'
    text: De wederpartij is bevoegd de vordering, bedoeld in het eerste lid, in te stellen vóór alle weren.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel224
  - number: '224.4'
    text: |-
      De partij die het stellen van zekerheid vordert, wordt niet geacht daardoor de rechtsmacht van de rechter te hebben
      erkend.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel224
  - number: '224.5'
    text: |-
      Het vonnis waarbij het stellen van zekerheid wordt bevolen, drukt de som uit tot beloop waarvan de zekerheid moet
      worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel224
  - number: '225.1'
    text: 'Gronden voor schorsing van het geding zijn:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel225
  - number: 225.1.a
    text: de dood van een partij;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel225
  - number: 225.1.b
    text: verandering van de persoonlijke staat van een partij;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel225
  - number: 225.1.c
    text: |-
      het ophouden van de betrekkingen waarin een partij het geding voerde, hetzij ten gevolge van rechtsopvolging onder
      algemene titel op een ander, hetzij door een andere oorzaak.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel225
  - number: '225.2'
    text: |-
      Schorsing vindt plaats door betekening van de ingeroepen grond voor de schorsing aan de wederpartij dan wel door
      een daartoe strekkende akte ter rolle. Bij gebreke hiervan wordt het geding op naam van de oorspronkelijke partij
      voortgezet.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel225
  - number: '225.3'
    text: Alle proceshandelingen, verricht nadat de schorsing is ingetreden, zijn nietig.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel225
  - number: '225.4'
    text: Schorsing kan niet meer plaatsvinden nadat de dag is bepaald waarop het vonnis zal worden uitgesproken.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel225
  - number: '226.1'
    text: |-
      In zaken waarin partijen niet in persoon kunnen procederen, wordt het geding van rechtswege geschorst doordat de
      gestelde procureur overlijdt of doordat hij zijn hoedanigheid van procureur verliest.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel226
  - number: '226.2'
    text: |-
      [Artikel 225, derde en vierde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel225
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel226
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '225'
        afdeling: Elfde
  - number: '227.1'
    text: |-
      In de gevallen, bedoeld in [artikel 225, eerste lid][ref1], wordt het geding hervat in de stand waarin dit zich bij
      de schorsing bevond:


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel225
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel227
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '225'
        afdeling: Elfde
  - number: 227.1.a
    text: |-
      doordat de partij bij wie de grond voor de schorsing is opgekomen bij de betekening van de schorsingsgrond
      verklaart dat het geding wordt hervat;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel227
  - number: 227.1.b
    text: |-
      doordat een der partijen, met instemming van de andere partij, een daartoe strekkende akte ter rolle neemt, dan wel
      bij exploot verklaart dat het geding wordt hervat.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel227
  - number: '227.2'
    text: |-
      De partij die bij de in het eerste lid, onder a, bedoelde betekening of het in het eerste lid, onder b, bedoelde
      exploot verklaart dat het geding wordt hervat, roept daarbij de andere partij op tegen de dag waarop zij de zaak
      ter rolle wil doen dienen. Voor deze oproeping moeten de voor dagvaarding voorgeschreven termijnen in acht worden
      genomen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel227
  - number: '227.3'
    text: In zaken waarin partijen niet in persoon kunnen procederen, stellen zij opnieuw procureur.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel227
  - number: '228.1'
    text: |-
      In geval van schorsing wegens overlijden of verlies van de hoedanigheid van de gestelde procureur, wordt het geding
      hervat in de stand waarin dit zich bij de schorsing bevond doordat een der partijen, met instemming van de andere
      partij, een daartoe strekkende akte ter rolle neemt, dan wel bij exploot verklaart dat het geding wordt hervat.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel228
  - number: '228.2'
    text: |-
      [Artikel 227, tweede lid][ref1], is van overeenkomstige toepassing. Partijen stellen opnieuw procureur.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel227
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel228
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '227'
        afdeling: Elfde
  - number: '229'
    text: |-
      De rechter bepaalt de dag waarop hij uitspraak zal doen en deelt deze dag aan de eiser en aan de in het geding
      verschenen gedaagde mede. Op verlangen van de in het geding verschenen partijen stelt de rechter de uitspraak uit.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel229
  - number: '230.1'
    text: 'Het vonnis vermeldt:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel230
  - number: 230.1.a
    text: de namen en de woonplaats van de partijen, en de namen van hun gemachtigden of procureurs;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel230
  - number: 230.1.b
    text: het verloop van het geding;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel230
  - number: 230.1.c
    text: de slotsom van de dagvaarding en de conclusies van partijen;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel230
  - number: 230.1.d
    text: de slotsom van de conclusie van het openbaar ministerie in de gevallen waarin het is gehoord;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel230
  - number: 230.1.e
    text: de gronden van de beslissing, waaronder begrepen de feiten waarop de beslissing rust;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel230
  - number: 230.1.f
    text: de beslissing;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel230
  - number: 230.1.g
    text: de naam van de rechter of, bij een meervoudige kamer, de namen van de rechters door wie het vonnis is gewezen;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel230
  - number: 230.1.h
    text: de dag van de uitspraak.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel230
  - number: '230.2'
    text: |-
      Indien tegen de gedaagde of, bij meer gedaagden, tegen hen allen verstek is verleend en de vorderingen van de eiser
      geheel of gedeeltelijk worden toegewezen, kan ten aanzien van de ingevolge het eerste lid onder a, c, e en f te
      vermelden gegevens worden volstaan met verwijzing naar een door de griffier gewaarmerkt afschrift van het exploot
      van dagvaarding waarop het vonnis wordt gesteld of dat aan het vonnis wordt gehecht.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel230
  - number: '230.3'
    text: |-
      Het vonnis wordt door de rechter, of, bij een meervoudige kamer, door de voorzitter en de griffier ondertekend. Het
      vonnis kan ook worden ondertekend door de rechter die het uitspreekt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel230
  - number: '231.1'
    text: |-
      Van de vonnissen verstrekt de griffier op de dag van de uitspraak een afschrift aan de eiser en aan de gedaagde die
      in het geding is verschenen. Betreft het een eindvonnis, dan is het afschrift dat wordt verstrekt aan een partij
      die tot tenuitvoerlegging van dat vonnis kan overgaan, opgemaakt in executoriale vorm.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel231
  - number: '231.2'
    text: |-
      De griffier verstrekt desverlangd tweede of verdere in executoriale vorm opgemaakte afschriften van een vonnis aan
      de partij die tot tenuitvoerlegging van dat vonnis kan overgaan, dan wel aan de rechtverkrijgenden onder algemene
      titel van deze partij. [Artikel 28, vijfde en zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel28
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel231
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '28'
        afdeling: Derde
  - number: '231.3'
    text: Elk afschrift dat in executoriale vorm is opgemaakt, wordt gedagtekend.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel231
  - number: '232.1'
    text: De rechter kan, voordat hij definitief over de zaak beslist, een tussenvonnis wijzen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel232
  - number: '232.2'
    text: |-
      Van de [artikelen 230][ref1] en [231, eerste lid][ref2], kan, voor zover nodig, worden afgeweken:


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel230
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel231
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel232
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '230'
        paragraaf: '1'
        afdeling: Twaalfde
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '231'
        paragraaf: '1'
        afdeling: Twaalfde
  - number: 232.2.a
    text: |-
      indien een tussenvonnis wordt gewezen bij een verschijning van partijen ter terechtzitting als bedoeld in de
      [artikelen 87][ref1] en [88][ref2] en indien alle partijen aldaar zijn verschenen;


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel88
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel232
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '87'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '88'
        afdeling: Eerste
  - number: 232.2.b
    text: |-
      indien een tussenvonnis wordt gewezen ter beslissing op een incidentele vordering en de wederpartij te kennen geeft
      tegen toewijzing geen bezwaar te hebben.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel232
  - number: '233.1'
    text: |-
      Tenzij uit de wet of uit de aard van de zaak anders voortvloeit, kan de rechter, indien dit wordt gevorderd,
      verklaren dat zijn vonnis uitvoerbaar bij voorraad zal zijn niettegenstaande daartegen aan te wenden
      rechtsmiddelen. De rechter kan een vonnis waarbij op de voet van [artikel 195][ref1] wordt beslist omtrent een
      voorschot ter zake van de kosten van deskundigen, ook ambtshalve uitvoerbaar bij voorraad verklaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel195
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel233
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '195'
        paragraaf: '6'
        afdeling: Negende
  - number: '233.2'
    text: De uitvoerbaarverklaring bij voorraad kan het gehele vonnis betreffen of een gedeelte daarvan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel233
  - number: '233.3'
    text: |-
      De rechter kan aan de uitvoerbaarverklaring bij voorraad de voorwaarde verbinden dat tot een door hem te bepalen
      bedrag zekerheid wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel233
  - number: '234'
    text: |-
      Indien het vonnis niet uitvoerbaar bij voorraad is verklaard en tegen dat vonnis een rechtsmiddel is aangewend, kan
      alsnog een incidentele vordering tot uitvoerbaarverklaring bij voorraad van dat vonnis worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel234
  - number: '235'
    text: |-
      Indien het vonnis uitvoerbaar bij voorraad is verklaard, evenwel zonder dat daaraan de voorwaarde is verbonden
      dat zekerheid wordt gesteld, en indien tegen dat vonnis een rechtsmiddel is aangewend, kan alsnog een daartoe
      strekkende incidentele vordering worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel235
  - number: '236.1'
    text: |-
      Beslissingen die de rechtsbetrekking in geschil betreffen en zijn vervat in een in kracht van gewijsde gegaan
      vonnis, hebben in een ander geding tussen dezelfde partijen bindende kracht.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel236
  - number: '236.2'
    text: |-
      Onder partijen worden mede begrepen de rechtverkrijgenden onder algemene of bijzondere titel, tenzij uit de wet
      anders voortvloeit.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel236
  - number: '236.3'
    text: Het gezag van gewijsde wordt niet ambtshalve toegepast.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel236
  - number: '237.1'
    text: |-
      De partij die bij vonnis in het ongelijk wordt gesteld, wordt in de kosten veroordeeld. De kosten mogen echter
      geheel of gedeeltelijk worden gecompenseerd tussen echtgenoten of geregistreerde partners of andere levensgezellen,
      bloedverwanten in de rechte lijn, broers en zusters of aanverwanten in dezelfde graad, alsmede indien partijen over
      en weer op enkele punten in het ongelijk zijn gesteld. Ook kan de rechter de kosten die nodeloos werden aangewend
      of veroorzaakt, voor rekening laten van de partij die deze kosten aanwendde of veroorzaakte.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel237
  - number: '237.2'
    text: Bij een tussenvonnis kan de beslissing over de kosten tot het eindvonnis worden aangehouden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel237
  - number: '237.3'
    text: |-
      Het bedrag van de kosten waarin de verliezende partij wordt veroordeeld, wordt, voor zover die kosten vóór de
      uitspraak zijn gemaakt en niet aan haar zijde zijn gevallen, bij het vonnis vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel237
  - number: '237.4'
    text: |-
      De na de uitspraak ontstane kosten worden op verzoek van de partij in het voordeel van wie een kostenveroordeling
      is uitgesproken, begroot door de rechter die het vonnis heeft gewezen. Deze geeft daarvoor een bevelschrift af.
      Hiertegen is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel237
  - number: '238.1'
    text: |-
      In zaken waarin partijen in persoon kunnen procederen, wordt, indien de wederpartij van de in het ongelijk gestelde
      partij zonder gemachtigde procedeert, onder de kosten waarin laatstgenoemde partij wordt veroordeeld, opgenomen een
      door de rechter te bepalen bedrag voor noodzakelijke reis- en verblijfkosten van die wederpartij. De rechter kan
      onder de kosten waarin de in het ongelijk gestelde partij wordt veroordeeld, ook opnemen een door hem te bepalen
      bedrag voor noodzakelijke verletkosten van de wederpartij.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel238
  - number: '238.2'
    text: |-
      Procedeert de wederpartij van de in het ongelijk gestelde partij met een gemachtigde, dan wordt onder die kosten
      een door de rechter te bepalen bedrag opgenomen voor salaris en noodzakelijke verschotten van de gemachtigde,
      tenzij de rechter om in het vonnis te vermelden redenen anders beslist.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel238
  - number: '239'
    text: |-
      In zaken waarin partijen niet in persoon kunnen procederen, kunnen van de kosten van de wederpartij slechts de
      salarissen en verschotten van de procureur van die wederpartij ten laste van de in het ongelijk gestelde partij
      worden gebracht.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel239
  - number: '240'
    text: |-
      Kosten terzake van ambtshandelingen, verricht door gerechtsdeurwaarders, worden berekend overeenkomstig bij of
      krachtens algemene maatregel van bestuur vastgestelde tarieven.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel240
  - number: '241'
    text: |-
      Ter zake van verrichtingen waarvoor de in de [artikelen 237 tot en met 240][ref1] bedoelde kosten een vergoeding
      plegen in te sluiten, zoals die ter voorbereiding van gedingstukken en ter instructie van de zaak, kan jegens de
      wederpartij geen vergoeding op grond van [artikel 96, tweede lid, van Boek 6 van het Burgerlijk Wetboek](onbekend)
      worden toegekend, maar zijn alleen de regels betreffende proceskosten van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel237
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel241
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '237'
        paragraaf: '2'
        afdeling: Twaalfde
  - number: '242.1'
    text: |-
      De rechter kan bedragen die geacht kunnen worden te zijn bedongen ter vergoeding van proceskosten of van
      buitengerechtelijke kosten als bedoeld in [artikel 96, tweede lid, onder b en c, van Boek 6 van het Burgerlijk
      Wetboek](onbekend) ambtshalve matigen, doch niet tot onder het bedrag van de krachtens de wet te begroten
      proceskosten respectievelijk het bedrag van de buitengerechtelijke kosten die, gelet op de tarieven volgens welke
      zodanige kosten aan de opdrachtgevers gewoonlijk in rekening worden gebracht, jegens de wederpartij redelijk zijn.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel242
  - number: '242.2'
    text: Het eerste lid geldt niet voor overeenkomsten die strekken tot regeling van een reeds gerezen geschil.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel242
  - number: '243.1'
    text: |-
      Indien er termen zijn om de wederpartij van hem aan wie ter zake van het gevoerde geding krachtens de
      [Wet op de rechtsbijstand][ref1] een toevoeging is verleend, in de kosten te verwijzen, veroordeelt
      de rechter haar ambtshalve om aan de griffier te voldoen de ingevolge de [artikelen 17][ref2] en
      [18 van de Wet tarieven in burgerlijke zaken][ref3] in debet gestelde griffierechten, alsmede de onder deze kosten
      begrepen salarissen van advocaten, procureurs of deurwaarders, en verschotten.


      [ref1]: https://wetten.overheid.nl/BWBR0006368
      [ref2]: https://wetten.overheid.nl/BWBR0001852#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0001852#Artikel18
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel243
    references:
      - id: ref1
        bwb_id: BWBR0006368
      - id: ref2
        bwb_id: BWBR0001852
        artikel: '17'
      - id: ref3
        bwb_id: BWBR0001852
        artikel: '18'
  - number: '243.2'
    text: |-
      Uit het ingevolge het eerste lid ontvangen bedrag stelt de griffier degene aan wie een toevoeging is verleend,
      zoveel mogelijk schadeloos voor de door deze voldane eigen bijdrage. Het eventueel resterende bedrag voldoet de
      griffier, na aftrek van zijn verschotten, en de ingevolge [artikel 37 van de Wet op de rechtsbijstand][ref1] aan de
      advocaat, procureur of deurwaarder te betalen vergoeding, aan de advocaat, procureur of deurwaarder.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel37
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel243
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '37'
  - number: '243.3'
    text: |-
      Bij gebreke van de betaling geschiedt de invordering krachtens een door de griffier uit te vaardigen dwangbevel.
      [Artikel 22 van de Wet tarieven in burgerlijke zaken][ref1] is van overeenkomstige toepassing, met dien verstande
      dat de tenuitvoerlegging wordt opgeschort indien blijkt dat de veroordeling nog niet in kracht van gewijsde is
      gegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001852#Artikel22
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel243
    references:
      - id: ref1
        bwb_id: BWBR0001852
        artikel: '22'
  - number: '244.1'
    text: |-
      Indien ten aanzien van een partij, met toepassing van [het derde lid van artikel 199][ref1], het bedrag van de
      schadeloosstelling en het loon van deskundigen voorlopig in debet zijn gesteld, veroordeelt de rechter de partij
      die in de kosten van het geding wordt verwezen ambtshalve om dit bedrag aan de griffier te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel199
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel244
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '199'
        paragraaf: '6'
        afdeling: Negende
  - number: '244.2'
    text: |-
      Indien de kosten geheel of gedeeltelijk worden gecompenseerd, stelt de rechter vast welk deel van het in het eerste
      lid bedoelde bedrag elk der partijen dient te dragen en veroordeelt hen dienovereenkomstig tot voldoening aan de
      griffier.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel244
  - number: '244.3'
    text: |-
      [Artikel 243, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel243
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel244
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '243'
        paragraaf: '2'
        afdeling: Twaalfde
  - number: '245.1'
    text: |-
      Indien blijkt dat een partij niet bestaat, of dat zij niet rechtsgeldig in het geding is verschenen doordat een
      daartoe niet bevoegde voor haar is opgetreden of tot het voeren van een geding opdracht heeft gegeven, geschiedt
      een veroordeling in de kosten, wanneer daartoe aanleiding is, in plaats van ten laste van de partij in naam van
      wie in rechte is opgetreden, ten laste van de gemachtigde of procureur van die partij, of van degene die tot het
      voeren van het geding opdracht heeft gegeven, in het eerste geval onverminderd het verhaal van die procureur of
      gemachtigde op zijn opdrachtgever.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel245
  - number: '245.2'
    text: |-
      Alvorens aldus te beslissen, stelt de rechter de betrokkene in de gelegenheid zijn standpunt naar voren te brengen
      en toe te lichten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel245
  - number: '246.1'
    text: Op verlangen van partijen wordt de zaak op de rol doorgehaald.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel246
  - number: '246.2'
    text: |-
      De enkele doorhaling op de rol heeft geen rechtsgevolgen. Partijen kunnen de rechtsgevolgen bij overeenkomst
      bepalen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel246
  - number: '247'
    text: |-
      Indien geen van partijen er, na in de gelegenheid te zijn gesteld zich daarover uit te laten, blijk van geeft het
      geding te willen voortzetten, kan de zaak ook ambtshalve op de rol worden doorgehaald.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel247
  - number: '248'
    text: |-
      Indien ten aanzien van een partij, met toepassing van [het derde lid van artikel 199][ref1], het bedrag van
      de schadeloosstelling en het loon van deskundigen voorlopig in debet zijn gesteld, beslist de rechter met
      overeenkomstige toepassing van [artikel 244, tweede lid][ref2], welk deel van dit bedrag elk der partijen dient te
      dragen en veroordeelt hen dienovereenkomstig tot voldoening aan de griffier.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel199
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel244
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel248
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '199'
        paragraaf: '6'
        afdeling: Negende
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '244'
        paragraaf: '2'
        afdeling: Twaalfde
  - number: '249.1'
    text: Zolang de gedaagde niet voor antwoord heeft geconcludeerd, kan de eiser afstand doen van de instantie.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel249
  - number: '249.2'
    text: De eiser is verplicht de proceskosten van de gedaagde te betalen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel249
  - number: '249.3'
    text: |-
      [Artikel 248][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel248
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel249
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '248'
        paragraaf: '1'
        afdeling: Dertiende
  - number: '250.1'
    text: Afstand van instantie wordt gedaan bij akte ter rolle.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel250
  - number: '250.2'
    text: |-
      Indien de afstand door een procureur of een gemachtigde wordt gedaan, legt deze een hem daartoe door de eiser
      verstrekte bijzondere volmacht over.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel250
  - number: '250.3'
    text: |-
      Door afstand van instantie worden partijen van rechtswege hersteld in de toestand als ware het geding niet in deze
      instantie aanhangig geweest, onverminderd het bepaalde in [artikel 316, tweede lid, van Boek 3 van het Burgerlijk
      Wetboek](onbekend).
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel250
  - number: '250.4'
    text: |-
      Ter zake van de betaling van de kosten vaardigt de rechter op verlangen van de gedaagde een bevelschrift uit. Het
      bevelschrift is uitvoerbaar bij voorraad.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel250
  - number: '250.5'
    text: Nadat hij de kosten heeft betaald, kan de eiser de vordering opnieuw instellen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel250
  - number: '251.1'
    text: |-
      Indien de proceshandeling waarvoor de zaak staat, langer dan twaalf maanden niet is verricht, bepaalt de rechter
      op verlangen van de wederpartij van de partij die de proceshandeling moet verrichten, een roldatum waarop deze
      wederpartij verval van instantie kan vorderen, dan wel kan vragen om een laatste uitstel te verlenen aan de partij
      die de proceshandeling moet verrichten of om vonnis te wijzen. De rechter kan hiertoe, eveneens na verloop van
      twaalf maanden, ook ambtshalve een roldatum bepalen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel251
  - number: '251.2'
    text: De in het eerste lid bedoelde roldatum wordt in beide gevallen bepaald op een termijn van ten hoogste drie maanden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel251
  - number: '251.3'
    text: |-
      Verval van instantie kan op de bepaalde roldatum slechts worden gevorderd indien het voornemen daartoe ten minste
      twee weken vóór die roldatum aan de nalatige partij is aangezegd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel251
  - number: '251.4'
    text: De rechter wijst de vordering tot verval van instantie toe, tenzij voor of op die roldatum
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel251
  - number: 251.4.a
    text: de proceshandeling alsnog wordt verricht, of
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel251
  - number: 251.4.b
    text: |-
      de wederpartij van de partij die het verval vordert, aannemelijk maakt dat voor de vertraging van het geding een
      reden bestaat die deze in redelijkheid kan rechtvaardigen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel251
  - number: '251.5'
    text: |-
      Indien op de ingevolge het eerste lid bepaalde roldatum de proceshandeling waarvoor de zaak staat niet alsnog
      is of wordt verricht, en voorts de wederpartij van degene die de proceshandeling moet verrichten geen verval van
      instantie vordert noch zich anderszins uitlaat over de voortgang van het geding als bedoeld in het eerste lid,
      wordt de zaak op de rol doorgehaald.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel251
  - number: '252.1'
    text: |-
      De kosten van de vervallen instantie worden van rechtswege gecompenseerd. De rechter kan echter, indien hij daartoe
      gronden aanwezig acht, een partij geheel of gedeeltelijk in de kosten veroordelen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel252
  - number: '252.2'
    text: |-
      [Artikel 248, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel248
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel252
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '248'
        paragraaf: '1'
        afdeling: Dertiende
  - number: '253.1'
    text: |-
      Door verval van instantie worden partijen van rechtswege hersteld in de toestand als ware het geding niet in deze
      instantie aanhangig geweest, onverminderd het bepaalde in [artikel 316, tweede lid, van Boek 3 van het Burgerlijk
      Wetboek](onbekend).
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel253
  - number: '253.2'
    text: |-
      Wordt de vordering opnieuw ingesteld, dan kan wederom gebruik worden gemaakt van in de vervallen instantie gedane
      gerechtelijke erkentenissen en bijgebracht bewijs.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel253
  - number: '254.1'
    text: |-
      In alle spoedeisende zaken waarin, gelet op de belangen van partijen, een onmiddellijke voorziening bij voorraad
      wordt vereist, is de voorzieningenrechter bevoegd deze te geven.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel254
  - number: '254.2'
    text: |-
      Op aanvraag van de belanghebbende partij kan de voorzieningenrechter de dagvaarding bevelen tegen de dag en het
      uur, de zondag daarbij inbegrepen, voor elk geval te bepalen. Hij kan daarbij tevens bevelen dat de terechtzitting
      op een andere plaats dan in het gerechtsgebouw wordt gehouden. De voorzieningenrechter kan aan de dagbepaling
      voorwaarden verbinden, die door de eiser in acht moeten worden genomen. Deze voorwaarden moeten uit de dagvaarding
      blijken.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel254
  - number: '254.3'
    text: |-
      De zaak kan ook worden aangebracht op een terechtzitting, door de voorzieningenrechter te houden op de daartoe door
      hem te bepalen werkdagen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel254
  - number: '254.4'
    text: |-
      In zaken als bedoeld in [artikel 93][ref1] is ook de kantonrechter bevoegd tot het geven van een voorziening als
      in deze afdeling bedoeld. Daarbij is op de kantonrechter van toepassing hetgeen omtrent de voorzieningenrechter
      is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel93
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel254
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '93'
        afdeling: Tweede
  - number: '255.1'
    text: |-
      De gedaagde kan in de zaken, bedoeld in [artikel 79, tweede lid][ref1], behalve bij procureur ook in persoon
      procederen, maar niet vertegenwoordigd door een gemachtigde die geen procureur is.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel79
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel255
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '79'
        afdeling: Eerste
  - number: '255.2'
    text: |-
      Partijen kunnen ook vrijwillig ter terechtzitting van de voorzieningenrechter in kort geding verschijnen. Het
      eerste lid is van toepassing.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel255
  - number: '255.3'
    text: |-
      In andere korte gedingen niet ingeleid met een dagvaarding, is ook de eiser niet verplicht bij procureur te
      procederen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel255
  - number: '256'
    text: |-
      Indien de voorzieningenrechter oordeelt dat de zaak niet geschikt is om in kort geding te worden beslist, weigert
      hij de voorziening.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel256
  - number: '257'
    text: De beslissingen bij voorraad brengen geen nadeel toe aan de zaak ten principale.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel257
  - number: '258'
    text: De voorzieningenrechter kan zijn vonnis ook ambtshalve uitvoerbaar bij voorraad verklaren.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel258
  - number: '259'
    text: |-
      Het verzet moet worden gedaan bij de voorzieningenrechter. [Artikel 79][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel79
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel259
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '79'
        afdeling: Eerste
  - number: '260.1'
    text: |-
      In zaken betreffende vorderingen tot het gelasten van voorlopige maatregelen als bedoeld in artikel 50, eerste
      lid, van de Overeenkomst inzake de handelsaspecten van de intellectuele eigendom, als bijlage 1C gevoegd bij de
      Overeenkomst tot oprichting van de Wereldhandelsorganisatie (Trb. 1995, 130), bepaalt de voorzieningenrechter bij
      het treffen van een voorlopige voorziening een redelijke termijn voor het instellen van de eis in de hoofdzaak. De
      voorlopige voorziening verliest haar kracht wanneer een eis in de hoofdzaak niet binnen die termijn is ingesteld en
      de gedaagde een daartoe strekkende verklaring bij de griffie indient. Is de verklaring ingediend na het verstrijken
      van de gestelde termijn, dan verliest de voorlopige voorziening haar kracht met de indiening van de verklaring.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel260
  - number: '260.2'
    text: |-
      Heeft de voorzieningenrechter geen termijn als bedoeld in het eerste lid gesteld, dan verliest de voorlopige
      voorziening haar werking door een verklaring als bedoeld in het eerste lid, wanneer na tenminste 31 dagen, waarvan
      tenminste 20 werkdagen, geen eis in de hoofdzaak is ingesteld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel260
  - number: '260.3'
    text: |-
      Bij een verklaring als bedoeld in het eerste lid wordt een afschrift overgelegd van het vonnis. Is daartegen een
      rechtsmiddel ingesteld, dan wordt dit in de verklaring vermeld. De gedaagde zendt zo spoedig mogelijk een afschrift
      van zijn verklaring aan de eiser.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel260
  - number: '261.1'
    text: |-
      Voor zover uit de wet niet anders voortvloeit, is deze titel van toepassing op alle zaken die met een
      verzoekschrift moeten worden ingeleid, alsmede op zaken waarin de rechter ambtshalve een beschikking geeft.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel261
  - number: '261.2'
    text: Met een verzoekschrift worden ingeleid de zaken ten aanzien waarvan dit uit de wet voortvloeit.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel261
  - number: '262'
    text: 'Tenzij de wet anders bepaalt, is bevoegd:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel262
  - number: 262.a
    text: |-
      de rechter van de woonplaats van hetzij de verzoeker of één van de verzoekers, hetzij één van de in het
      verzoekschrift genoemde belanghebbenden dan wel, als zodanige woonplaats in Nederland niet bekend is, de rechter
      van het werkelijk verblijf van één van hen;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel262
  - number: 262.b
    text: |-
      indien het verzoek betrekking heeft op een bij dagvaarding ingeleid of in te leiden geding, de rechter die bevoegd
      is van dat geding kennis te nemen, tenzij het verzoek niet behoort tot diens absolute bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel262
  - number: '263'
    text: |-
      In zaken die uitsluitend betreffen de aanvulling van de registers van de burgerlijke stand of de inschrijving,
      doorhaling of wijziging van daarin in te schrijven of ingeschreven akten, is bevoegd de rechter binnen wiens
      rechtsgebied de akte is of moet worden ingeschreven.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel263
  - number: '264'
    text: |-
      In zaken betreffende huur van gebouwde onroerende zaken of een gedeelte daarvan is uitsluitend bevoegd de rechter
      binnen wiens rechtsgebied het gehuurde of het grootste gedeelte daarvan is gelegen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel264
  - number: '265'
    text: |-
      In zaken betreffende minderjarigen is bevoegd de rechter van de woonplaats of, bij gebreke van een woonplaats in
      Nederland, van het werkelijk verblijf van de minderjarige.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel265
  - number: '266'
    text: |-
      In zaken betreffende curatele, onderbewindstelling ter bescherming van meerderjarigen of mentorschap ten behoeve
      van meerderjarigen is bevoegd de rechter van de woonplaats of, bij gebreke van een woonplaats in Nederland, van het
      werkelijk verblijf van degene wiens curatele onderscheidenlijk goederen of mentorschap het betreft.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel266
  - number: '267'
    text: |-
      In zaken van afwezigheid of vermissing is bevoegd de rechter van de verlaten woonplaats van de afwezige of
      vermiste. Ten aanzien van de vaststelling van overlijden is bevoegd de rechter te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel267
  - number: '268'
    text: |-
      In zaken betreffende nalatenschappen is bevoegd de rechter van de laatste woonplaats van de overledene. In afwijking
      van de eerste zin is in zaken die volgens [afdeling 7 van titel 5 van Boek 4 van het Burgerlijk Wetboek][ref1] met
      een verzoekschrift moeten worden ingeleid, bevoegd de rechter van de woonplaats van de rechthebbende.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Afdeling7
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel268
    references:
      - id: ref1
        bwb_id: BWBR0002761
        afdeling: '7'
  - number: '269'
    text: |-
      Wijzen de [artikelen 262 tot en met 268][ref1] geen bevoegde rechter aan, dan is de rechter te 's-Gravenhage
      bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel262
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel269
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '262'
        afdeling: Tweede
  - number: '270.1'
    text: |-
      Indien een of meer opgeroepen belanghebbenden niet in de procedure zijn verschenen of een verschenen belanghebbende
      de bevoegdheid betwist en indien de rechter in het ene of in het andere geval beslist dat niet hij, maar een andere
      rechter van gelijke rang bevoegd is, verwijst hij de zaak in de stand waarin deze zich bevindt naar die andere
      rechter. De griffier zendt een afschrift van de beschikking aan de rechter naar wie de zaak is verwezen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel270
  - number: '270.2'
    text: |-
      In zaken met betrekking tot echtscheiding, scheiding van tafel en bed, ontbinding van het huwelijk na scheiding van
      tafel en bed en ontbinding van een geregistreerd partnerschap en daarmee verband houdende verzoeken tot het treffen
      van een voorlopige voorziening of een nevenvoorziening, vindt een verwijzing als bedoeld in het eerste lid slechts
      plaats indien de andere echtgenoot of geregistreerde partner de bevoegdheid betwist.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel270
  - number: '270.3'
    text: |-
      Tegen de beslissing waarbij een betwisting van bevoegdheid wordt verworpen of de zaak naar een andere rechter wordt
      verwezen, is geen hogere voorziening toegelaten. De rechter naar wie de zaak is verwezen, is aan die verwijzing
      gebonden. De vorige zin mist toepassing indien de rechter zich tevens absoluut onbevoegd verklaart en de zaak
      verwijst naar een hogere rechter.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel270
  - number: '271'
    text: |-
      De oproeping van verzoekers of van in de procedure verschenen belanghebbenden geschiedt door de griffier bij gewone
      brief, tenzij de rechter anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel271
  - number: '272'
    text: |-
      De oproeping van niet in de procedure verschenen belanghebbenden geschiedt door de griffier bij aangetekende brief,
      tenzij de rechter anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel272
  - number: '273'
    text: |-
      De oproeping van een rechterlijke autoriteit, het openbaar ministerie of de raad voor de kinderbescherming
      geschiedt door de griffier bij gewone brief.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel273
  - number: '274'
    text: |-
      Oproepingen die bij brief geschieden, vermelden de dag van de verzending. Deze vermelding geschiedt niet slechts op
      de envelop.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel274
  - number: '275'
    text: |-
      Indien de griffier een bij aangetekende brief verzonden oproeping terug ontvangt en hem blijkt dat de geadresseerde
      op de dag van verzending of uiterlijk een week nadien in de daartoe bestemde registers ingeschreven stond op het op
      de oproeping vermelde adres, verzendt hij de oproeping onverwijld bij gewone brief. In de overige gevallen waarin
      de griffier de oproeping terug ontvangt, verbetert de griffier, indien mogelijk, het op de oproeping vermelde adres
      en verzendt hij de oproeping opnieuw bij aangetekende brief, tenzij de rechter anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel275
  - number: '276'
    text: |-
      Oproepingen vermelden de plaats, de dag en het uur van de terechtzitting. Zij worden zo spoedig mogelijk en ten
      minste een week vóór die dag verzonden, tenzij de rechter anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel276
  - number: '277'
    text: |-
      De oproeping bij brief van verzoekers of belanghebbenden die geen bekende woonplaats of bekend werkelijk verblijf
      in Nederland hebben, maar wel een bekende woonplaats of bekend werkelijk verblijf in een staat waar de [verordening
      (EG) nr. 1348/2000](32000R1348) van de Raad van de Europese Unie van 29 mei 2000 inzake de betekening en de
      kennisgeving in de lidstaten van gerechtelijke en buitengerechtelijke stukken in burgerlijke of in handelszaken
      (PbEG L 160/37) van toepassing is, geschiedt met inachtneming van de in artikel 14, tweede lid, van de verordening
      bedoelde voorwaarden waaronder de desbetreffende staat kennisgeving van gerechtelijke stukken per post aanvaardt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel277
  - number: '278.1'
    text: |-
      Het verzoekschrift vermeldt de voornamen, naam en woonplaats of, bij gebreke van een woonplaats in Nederland,
      het werkelijk verblijf van de verzoeker, alsmede een duidelijke omschrijving van het verzoek en de gronden waarop
      het berust. In zaken betreffende een nalatenschap vermeldt het verzoekschrift tevens de laatste woonplaats van de
      overledene of de reden waarom deze vermelding niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel278
  - number: '278.2'
    text: |-
      Het verzoekschrift wordt ondertekend en ter griffie ingediend. Indien de voorzieningenrechter daarop moet
      beschikken, kan het aan deze ter hand worden gesteld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel278
  - number: '278.3'
    text: |-
      Tenzij indiening bij de kantonrechter plaatsvindt of ingevolge bijzondere wettelijke bepaling niet door een
      procureur behoeft te geschieden, wordt het verzoekschrift ondertekend door een procureur. Het kantoor van die
      procureur geldt als gekozen woonplaats van de verzoeker.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel278
  - number: '278.4'
    text: |-
      De griffier tekent de dag van indiening of de dag van terhandstelling aan de voorzieningenrechter op het
      verzoekschrift aan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel278
  - number: '279.1'
    text: |-
      De rechter bepaalt, tenzij hij zich aanstonds onbevoegd verklaart of het verzoek toewijst, onverwijld dag en uur
      waarop de behandeling aanvangt. Hij beveelt tevens oproeping van de verzoeker en voor zover nodig van de in het
      verzoekschrift genoemde belanghebbenden. Bovendien kan hij te allen tijde belanghebbenden, bekende of onbekende,
      doen oproepen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel279
  - number: '279.2'
    text: |-
      De oproepingen, behalve die van de verzoeker, gaan vergezeld van een afschrift van het verzoekschrift, tenzij een
      oproeping op andere wijze dan bij brief of exploot geschiedt, of de rechter anders bepaalt; in deze gevallen bevat
      de oproeping een korte omschrijving van het verzoek.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel279
  - number: '279.3'
    text: |-
      De opgeroepene verschijnt ter terechtzitting in persoon of bij een gemachtigde. In zaken waarin het verzoekschrift
      door een procureur moet worden ingediend, verschijnt de opgeroepene in persoon of bij procureur. De rechter kan
      verschijning in persoon bevelen. De opgeroepene die in persoon verschijnt, mag zich laten bijstaan door zijn
      raadsman. In zaken waarin het verzoekschrift door een procureur moet worden ingediend, is de raadsman een advocaat
      of procureur.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel279
  - number: '279.4'
    text: |-
      Van het verhandelde en van de zakelijke inhoud van de afgelegde verklaringen wordt een proces-verbaal opgemaakt,
      dat door de rechter voor wie de mondelinge behandeling heeft plaatsgevonden, en de griffier wordt ondertekend.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel279
  - number: '279.5'
    text: |-
      Indien de behandeling van een zaak wordt aangehouden, blijft een hernieuwde oproeping van diegenen, aan wie de dag
      en het uur reeds mondeling ter terechtzitting waren medegedeeld, achterwege.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel279
  - number: '280'
    text: |-
      In zaken waarin de indiening van het verzoekschrift niet door een procureur behoeft te geschieden, zijn de
      [artikelen 80][ref1] en [81][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel81
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel280
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '80'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '81'
        afdeling: Eerste
  - number: '281.1'
    text: |-
      Indien het verzoekschrift ten onrechte niet door een procureur is ingediend, biedt de rechter de verzoeker
      de gelegenheid binnen een door hem te bepalen termijn dit verzuim te herstellen. Maakt de verzoeker van deze
      gelegenheid geen gebruik, dan wordt hij in het verzoek niet ontvankelijk verklaard.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel281
  - number: '281.2'
    text: Tegen een beslissing ingevolge het eerste lid staat geen hogere voorziening open.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel281
  - number: '282.1'
    text: |-
      Iedere belanghebbende kan tot de aanvang van de behandeling of, indien de rechter dit toestaat, in de loop van de
      behandeling een verweerschrift indienen. [Artikel 278][ref1] is van overeenkomstige toepassing met dien verstande
      dat, indien de rechter dit bepaalt, indiening van een verweerschrift in de loop van de behandeling kan geschieden
      ter terechtzitting onder verstrekking van een afschrift aan de verzoeker en de andere opgeroepen belanghebbenden.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel278
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel282
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '278'
        afdeling: Vierde
  - number: '282.2'
    text: |-
      Het verweerschrift en de overgelegde bescheiden gaan vergezeld van de nodige afschriften. Tenzij de indiening
      overeenkomstig het eerste lid ter terechtzitting plaatsvindt, zendt de griffier onverwijld een afschrift toe aan de
      verzoeker en aan de andere opgeroepen belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel282
  - number: '282.3'
    text: |-
      De griffier roept, voor zover dat nog niet is geschied, hen die verweerschriften hebben ingediend op tegen de dag
      van de behandeling.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel282
  - number: '282.4'
    text: |-
      Het verweerschrift mag een zelfstandig verzoek bevatten, mits dit betrekking heeft op het onderwerp van het
      oorspronkelijke verzoek. De rechter kan aan de verzoeker en aan de overige belanghebbenden gelegenheid geven tegen
      dit zelfstandige verzoek een verweerschrift in te dienen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel282
  - number: '283'
    text: |-
      Zolang de rechter nog geen eindbeschikking heeft gegeven, is de verzoeker bevoegd het verzoek of de gronden
      daarvan te verminderen, dan wel schriftelijk te veranderen of te vermeerderen. In het geval van verandering of
      vermeerdering is [artikel 130][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel130
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel283
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '130'
        afdeling: Vijfde
  - number: '284.1'
    text: |-
      De negende afdeling van de tweede titel is van overeenkomstige toepassing, tenzij de aard van de zaak zich
      hiertegen verzet.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel284
  - number: '284.2'
    text: |-
      Indien de rechter een getuigenverhoor beveelt, kan hij ook door hem aangewezen personen als getuigen doen oproepen.
      In dit geval kan de oproeping door de griffier geschieden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel284
  - number: '284.3'
    text: |-
      Het verschoningsrecht komt aan de in [artikel 165, tweede lid, onder a][ref1], genoemde personen niet toe in
      procedures betreffende de toepassing van de bepalingen van [Boek 1 van het Burgerlijk Wetboek][ref2], vervat
      in de [titels 5][ref3], [5a][ref4] en [9 tot en met 20][ref5], of van die vervat in [titel 6][ref6] voor zover
      het betreft procedures tussen echtgenoten of geregistreerde partners. Evenwel kunnen ouders en kinderen van de
      echtgenoten of van de geregistreerde partners zich in procedures tot echtscheiding en tot scheiding van tafel en
      bed, onderscheidenlijk tot ontbinding van het geregistreerd partnerschap, verschonen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel165
      [ref2]: https://wetten.overheid.nl/BWBR0002656
      [ref3]: https://wetten.overheid.nl/BWBR0002656
      [ref4]: https://wetten.overheid.nl/BWBR0002656
      [ref5]: https://wetten.overheid.nl/BWBR0002656
      [ref6]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel284
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '165'
        paragraaf: '4'
        afdeling: Negende
      - id: ref2
        bwb_id: BWBR0002656
      - id: ref3
        bwb_id: BWBR0002656
      - id: ref4
        bwb_id: BWBR0002656
      - id: ref5
        bwb_id: BWBR0002656
      - id: ref6
        bwb_id: BWBR0002656
  - number: '284.4'
    text: |-
      De overeenkomstige toepassing van de [artikelen 195][ref1] en [199][ref2] vindt aldus plaats dat de daarin bedoelde
      voorschotheffing, tenuitvoerlegging of voorlopige indebetstelling geschiedt ten laste van de belanghebbende die
      het verzoekschrift heeft ingediend dan wel mede of uitsluitend ten laste van een of meer andere door de rechter
      aangewezen belanghebbenden.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel195
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel199
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel284
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '195'
        paragraaf: '6'
        afdeling: Negende
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '199'
        paragraaf: '6'
        afdeling: Negende
  - number: '285.1'
    text: |-
      De rechter kan, indien een verzoekschrift over hetzelfde of een verknocht onderwerp reeds bij een andere rechter is
      ingediend, de verwijzing naar die andere rechter bevelen. Een verzoek daartoe kan worden gedaan tot de aanvang van
      de behandeling. Een verschil tussen beide zaken ten aanzien van de mogelijkheid om in persoon te procederen staat
      aan verwijzing niet in de weg. Een zaak die behandeld moet worden door de kantonrechter en betrekking heeft op een
      overeenkomst als bedoeld in [artikel 93 onder c][ref1] wordt niet verwezen naar een kamer van een andere sector
      dan de sector kanton; wel kan de zaak die bij die kamer in behandeling is, worden verwezen naar de kantonrechter.De
      griffier zendt een afschrift van de beschikking aan de rechter naar wie is verwezen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel93
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel285
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '93'
        afdeling: Tweede
  - number: '285.2'
    text: |-
      Indien bij dezelfde rechter meer verzoekschriften over hetzelfde of een verknocht onderwerp zijn ingediend, kan de
      voeging daarvan worden bevolen. Een verzoek daartoe kan worden gedaan tot het einde van de behandeling.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel285
  - number: '286'
    text: |-
      De rechter bepaalt na afloop van de behandeling de dag waarop hij uitspraak zal doen en deelt deze dag aan
      de verzoeker en de in de procedure verschenen belanghebbenden mede. Op verlangen van de verzoeker en de in de
      procedure verschenen belanghebbenden kan de rechter de uitspraak uitstellen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel286
  - number: '287.1'
    text: |-
      Op een beschikking is [artikel 230, eerste en derde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel230
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel287
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '230'
        paragraaf: '1'
        afdeling: Twaalfde
  - number: '287.2'
    text: |-
      Indien het verzoekschrift rechtstreeks aan de voorzieningenrechter ter hand is gesteld en de voorzieningenrechter
      toewijzend op het verzoek beschikt, is ook [artikel 230, tweede lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel230
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel287
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '230'
        paragraaf: '1'
        afdeling: Twaalfde
  - number: '288'
    text: De rechter kan de eindbeschikking uitvoerbaar bij voorraad verklaren, met of zonder zekerheidstelling.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel288
  - number: '289'
    text: |-
      De eindbeschikking kan tevens een veroordeling in de proceskosten inhouden. De [artikelen 243][ref1] en [244][ref2]
      zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel243
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel244
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel289
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '243'
        paragraaf: '2'
        afdeling: Twaalfde
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '244'
        paragraaf: '2'
        afdeling: Twaalfde
  - number: '290.1'
    text: |-
      De verzoeker en iedere belanghebbende hebben recht op inzage en afschrift van het verzoekschrift, de
      verweerschriften, de op de zaak betrekking hebbende bescheiden en de processen-verbaal.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel290
  - number: '290.2'
    text: |-
      De griffier verstrekt zo spoedig mogelijk een afschrift van processen-verbaal aan de verzoeker en aan de in de
      procedure verschenen belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel290
  - number: '290.3'
    text: |-
      Van de beschikkingen verstrekt de griffier zo spoedig mogelijk een afschrift aan de verzoeker en aan de in de
      procedure verschenen belanghebbenden. Betreft het een eindbeschikking, dan is het afschrift dat wordt verstrekt aan
      degene die tot tenuitvoerlegging van de beschikking kan overgaan, opgemaakt in executoriale vorm.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel290
  - number: '290.4'
    text: |-
      De griffier verstrekt desverlangd tweede of verdere in executoriale vorm opgemaakte afschriften van een beschikking
      aan de belanghebbende die tot tenuitvoerlegging van die beschikking kan overgaan, dan wel aan de rechtverkrijgenden
      onder algemene titel van deze belanghebbende. [Artikel 28, vijfde en zesde lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel28
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel290
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '28'
        afdeling: Derde
  - number: '290.5'
    text: Elk afschrift dat in executoriale vorm is opgemaakt, wordt gedagtekend.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel290
  - number: '291'
    text: |-
      De verzending van processtukken en van mededelingen aan de verzoeker en belanghebbenden, geschiedt op de wijze als
      in de derde afdeling van deze titel voor oproepingen bepaald.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel291
  - number: '329'
    text: |-
      In alle voor hoger beroep bij het gerechtshof vatbare geschillen over zaken die ter vrije bepaling van de partijen
      staan, kunnen partijen overeenkomen die geschillen bij de aanvang van het geding dadelijk ter kennis te brengen van
      het gerechtshof dat in hoger beroep bevoegd zou zijn.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel329
  - number: '330'
    text: |-
      Voogden, curators of bewindvoerders zijn hiervan niet uitgesloten, mits daarbij in achtnemende de verpligtingen aan
      hen bij de wet opgelegd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel330
  - number: '331.1'
    text: |-
      Voor het geregtshof gelden, bij deze regtsgedingen, de voorschriften, ten aanzien van het regtsgeding in eersten
      aanleg.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel331
  - number: '331.2'
    text: Het gerechtshof doet uitspraak in eerste aanleg, tevens in hoogste ressort.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel331
  - number: '332.1'
    text: |-
      Partijen kunnen van een in eerste aanleg gewezen vonnis in hoger beroep komen, tenzij de vordering waarover
      de rechter in eerste aanleg had te beslissen niet meer beloopt dan € 1750 of, in geval van een vordering van
      onbepaalde waarde, er duidelijke aanwijzingen bestaan dat de vordering geen hogere waarde vertegenwoordigt dan €
      1750, een en ander tenzij de wet anders bepaalt. Voor de toepassing van de eerste zin wordt de tot aan de dag van
      dagvaarding in eerste aanleg verschenen rente bij de vordering inbegrepen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel332
  - number: '332.2'
    text: |-
      Indien de zaak meer dan één vordering tussen dezelfde partijen betreft, is voor de toepassing van het eerste lid
      beslissend het totale beloop of de totale waarde van deze vorderingen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel332
  - number: '332.3'
    text: |-
      Was in eerste aanleg een eis in reconventie ingesteld, dan is voor de toepassing van het eerste lid beslissend
      het totale beloop of de totale waarde van de vordering in conventie en van de vordering in reconventie, met dien
      verstande dat met betrekking tot de vordering in reconventie de rente wordt berekend tot aan de dag van instelling
      van de eis in reconventie. Indien echter de beide zaken zijn gesplitst en daarin afzonderlijk is beslist, zijn op
      elk van beide vonnissen de gewone regels voor de vatbaarheid voor hoger beroep van toepassing.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel332
  - number: '333'
    text: |-
      Geen hoger beroep staat open in zaken die slechts rechtsgevolgen betreffen die ter vrije bepaling van
      partijen staan en waarbij partijen zijn overeengekomen van hoger beroep af te zien. In zaken als bedoeld in
      [artikel 96][ref1] staat hoger beroep slechts open indien partijen zich dat beroep, binnen de grenzen van
      [artikel 332][ref2], hebben voorbehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel96
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel332
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel333
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '96'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '332'
        afdeling: Eerste
  - number: '334'
    text: |-
      Elke partij welke zal berust hebben in een vonnis, kan niet meer ontvankelijk zijn om daarvan te komen in hooger
      beroep.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel334
  - number: '335.1'
    text: |-
      Van veroordeelingen bij verstek valt geen hooger beroep, doch indien de oorspronkelijke eischer van het vonnis in
      hooger beroep komt, zal de gedaagde alle zijne verdedigingen insgelijks in het hooger beroep kunnen doen gelden,
      zelfs bij wege van incidenteel beroep, zonder van het middel van verzet in eersten aanleg meer te kunnen gebruik
      maken.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel335
  - number: '335.2'
    text: |-
      In afwijking van het eerste lid kan de niet verschenen gedaagde van een vonnis als bedoeld in
      [artikel 140, tweede lid][ref1], in hoger beroep komen, mits hij vooraf bij voorraad, tegen het stellen van
      zekerheid, aan het vonnis voldoet, zelfs wanneer dat vonnis niet uitvoerbaar bij voorraad was verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel140
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel335
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '140'
        afdeling: Zevende
  - number: '337.1'
    text: |-
      Van vonnissen waarbij een voorlopige voorziening wordt getroffen of geweigerd, kan hoger beroep worden ingesteld
      voordat het eindvonnis is gewezen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel337
  - number: '337.2'
    text: |-
      Van andere tussenvonnissen kan hoger beroep slechts tegelijk met dat van het eindvonnis worden ingesteld, tenzij de
      rechter anders heeft bepaald of [artikel 75, eerste lid][ref1], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel75
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel337
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '75'
        afdeling: Achtste
  - number: '339.1'
    text: De termijn van beroep is drie maanden, te rekenen van de dag van de uitspraak van het vonnis.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel339
  - number: '339.2'
    text: In afwijking van het eerste lid is de termijn van beroep van een vonnis in kort geding vier weken.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel339
  - number: '339.3'
    text: |-
      De gedaagde in hoger beroep kan incidenteel beroep instellen, zelfs na verloop van deze termijnen en na berusting
      in het vonnis. Het incidenteel beroep wordt, op straffe van verval, ingesteld bij de conclusie van antwoord.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel339
  - number: '339.4'
    text: De afstand van het principaal beroep doet het ingesteld incidenteel beroep niet vervallen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel339
  - number: '339.5'
    text: |-
      Indien in eerste aanleg een vordering tot vrijwaring geheel of gedeeltelijk is afgewezen op grond van de afwijzing
      van de vordering in de hoofdzaak, staat het hoger beroep daartegen open tot het moment dat in de hoofdzaak in hoger
      beroep de conclusie van antwoord wordt genomen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel339
  - number: '340'
    text: |-
      Indien tijdig beroep in cassatie van een vonnis is ingesteld, doch dit vonnis voor cassatie niet vatbaar wordt
      bevonden, vangt de termijn van beroep van dat vonnis opnieuw aan te rekenen van de dag der uitspraak in cassatie,
      mits het beroep in cassatie werd ingesteld binnen de termijn van beroep.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel340
  - number: '341'
    text: |-
      Bij overlijden van de in het ongelijk gestelde partij gedurende de loop van de termijn voor het hoger beroep, kan
      het beroep door haar erfgenamen of rechtverkrijgenden nog worden ingesteld binnen drie maanden na het overlijden,
      of binnen een maand na afloop van de termijn, bedoeld in [artikel 185 van Boek 4 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel185
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel341
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '185'
  - number: '343'
    text: |-
      Het hoger beroep wordt aangevangen door een dagvaarding in dezelfde vorm en met dezelfde vereisten als die in
      eerste aanleg, zonder dat zij de middelen waarop het hoger beroep gegrond is, behoeft uit te drukken.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel343
  - number: '344.1'
    text: |-
      Alle zaken die in hoger beroep bij de hogere rechter aanhangig worden gemaakt, worden ingeschreven ter rolle van
      een enkelvoudige kamer en door haar behandeld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel344
  - number: '344.2'
    text: |-
      De enkelvoudige kamer verwijst een zaak, ingevolge dit artikel bij haar aanhangig, naar een meervoudige kamer
      indien haar dit wenselijk toeschijnt, doch uiterlijk wanneer pleidooi wordt gevraagd of recht op de stukken wordt
      verzocht.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel344
  - number: 344b
    text: |-
      De voorschriften omtrent de behandeling in hoger beroep zijn zowel op de behandeling door de enkelvoudige als op
      die door de meervoudige kamer van toepassing, met dien verstande, dat degene die zitting heeft in een enkelvoudige
      kamer tevens de bevoegdheden bezit die aan de voorzitter van een meervoudige kamer toekomen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel344b
  - number: '347.1'
    text: In hoger beroep worden een conclusie van eis en een conclusie van antwoord genomen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel347
  - number: '347.3'
    text: |-
      Niettemin zal ingeval van incidenteel beroep of indien door den verweerder eene exceptie tegen het principaal
      beroep wordt aangevoerd, den appellant, op zijn verlangen, een termijn verleend worden om het incidenteel beroep of
      de voorgestelde exceptie bij conclusie te beantwoorden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel347
  - number: '348'
    text: |-
      De oorspronkelijke verweerder kan nieuwe weren van regten, eene verdediging ten principale opleverende, inbrengen,
      tenzij dezelve in het geding ter eerster instantie zijn gedekt, waaronder niet begrepen is het geval, dat het regt
      om ten principale te antwoorden ingevolge [artikel 128][ref1] vervallen is.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel128
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel348
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '128'
        afdeling: Vijfde
  - number: '349'
    text: |-
      Zoo wel in het principaal als in het incidenteel beroep, kunnen de nieuwe verweringen, waarvan in het voorgaande
      artikel is gesproken, gedaan worden bij met redenen omkleede conclusiën.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel349
  - number: '350.1'
    text: |-
      Het hooger beroep schorst de ten uitvoerlegging van het vonnis, indien daarbij niet is bepaald, dat hetzelve bij
      voorraad zal worden ten uitvoer gelegd in de gevallen waarin dit is toegelaten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel350
  - number: '350.2'
    text: |-
      Het hoger beroep, ingesteld met gebruikmaking van de nieuwe termijn ingevolge [artikel 340][ref1], schorst de
      tenuitvoerlegging niet.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel340
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel350
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '340'
        afdeling: Tweede
  - number: '351'
    text: |-
      Indien hoger beroep is ingesteld tegen een vonnis dat uitvoerbaar bij voorraad is verklaard, kan de hogere rechter
      op vordering van een partij alsnog de tenuitvoerlegging van het vonnis schorsen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel351
  - number: '353.1'
    text: |-
      Voor zover uit deze titel dan wel uit een andere wettelijke regeling niet anders voortvloeit, is de tweede titel
      in hoger beroep van overeenkomstige toepassing, met dien verstande dat partijen slechts bij procureur kunnen
      procederen, dat [artikel 131][ref1] niet van toepassing is en dat geen eis in reconventie kan worden ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel131
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel353
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '131'
        afdeling: Vijfde
  - number: '353.2'
    text: |-
      Niettemin is [artikel 224][ref1] niet anders van toepassing dan behoudens de navolgende bepalingen: De
      oorspronkelijke gedaagde, eischer wordende in hooger beroep, is niet gehouden tot de in dat artikel bedoelde
      zekerheidstelling. De gedaagde in hooger beroep is daartoe evenmin gehouden, zelfs niet bij het instellen van
      incidenteel beroep. De in eersten aanleg gestelde zekerheid blijft ook verbonden voor de kosten van hooger beroep.
      De zekerheidstelling wordt gevorderd vóór alle weren van regten.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel224
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel353
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '224'
        paragraaf: '6'
        afdeling: Tiende
  - number: '355'
    text: |-
      In geval van beroep van een tussenvonnis verwijst de rechter in beroep, wanneer hij het vonnis bekrachtigt, de
      zaak naar de rechter in eerste aanleg om op de hoofdzaak te worden beslist. Niettemin kan de rechter in beroep de
      hoofdzaak in het hoogste ressort zelf afdoen op eenstemmig verlangen van partijen of indien het geding in staat van
      wijzen is.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel355
  - number: '356'
    text: |-
      Wanneer de rechter in hoger beroep een tussenvonnis vernietigt, kan hij de zaak aan zich houden om in hoger beroep
      op de hoofdzaak te beslissen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel356
  - number: '358.1'
    text: |-
      Tegen eindbeschikkingen in zaken als bedoeld in [artikel 261][ref1] staat, behoudens berusting, hoger beroep open.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel261
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel358
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '261'
        afdeling: Eerste
  - number: '358.2'
    text: |-
      Door de verzoeker en door de in de procedure verschenen belanghebbenden moet het hoger beroep worden ingesteld
      binnen drie maanden, te rekenen van de dag van de uitspraak en door andere belanghebbenden binnen drie maanden
      na de betekening daarvan of nadat de beschikking hun op andere wijze bekend is geworden. De [artikelen 340][ref1]
      en [350, tweede lid][ref2], zijn van overeenkomstige toepassing, met dien verstande dat de nieuwe termijn van
      hoger beroep openstaat voor degene die beroep in cassatie heeft ingesteld. Bij het beroepschrift worden zoveel
      afschriften gevoegd als er anderen dan hij in eerste aanleg zijn opgeroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel340
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel350
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel358
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '340'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '350'
        afdeling: Derde
  - number: '358.3'
    text: |-
      De termijn loopt in zaken die volgens [afdeling 7 van titel 5 van Boek 4 van het Burgerlijk Wetboek][ref1] met
      een verzoekschrift moeten worden ingeleid, vanaf de dag van de uitspraak, behoudens voor zover het niet verschenen
      belanghebbenden betreft die, hoewel zij ten tijde van de indiening van het verzoekschrift bekend waren, niet
      bij name, en zo zij toen onbekend waren, in het geheel niet zijn opgeroepen. Voor de in de vorige zin bedoelde
      belanghebbenden loopt de termijn vanaf de betekening van de beschikking of het tijdstip waarop de beschikking
      hun op andere wijze bekend geworden is. Hetzelfde geldt in zaken betreffende executele en vereffening van een
      nalatenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Afdeling7
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel358
    references:
      - id: ref1
        bwb_id: BWBR0002761
        afdeling: '7'
  - number: '358.4'
    text: |-
      Van tussenbeschikkingen kan hoger beroep slechts tegelijk met dat van de eindbeschikking worden ingesteld, tenzij
      de rechter anders heeft bepaald of [artikel 75, eerste lid][ref1], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel75
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel358
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '75'
        afdeling: Achtste
  - number: '358.5'
    text: |-
      Indien hoger beroep is ingesteld, kan ondanks het verstrijken van de in de eerste zin van het tweede lid genoemde
      termijn en ondanks berusting ieder van de aldaar genoemde personen alsnog bij verweerschrift incidenteel hoger
      beroep instellen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel358
  - number: '359'
    text: |-
      Hoger beroep wordt ingesteld door indiening van een beroepschrift ter griffie van het gerechtshof. Het
      beroepschrift vermeldt, naast hetgeen ingevolge [artikel 278, eerste lid][ref1], in het verzoekschrift moet
      worden vermeld, naam en woonplaats van hen die in eerste aanleg in de procedure zijn verschenen of bij name zijn
      opgeroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel278
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel359
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '278'
        afdeling: Vierde
  - number: '360.1'
    text: Hoger beroep schorst de werking, tenzij de beschikking uitvoerbaar bij voorraad is verklaard.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel360
  - number: '360.2'
    text: |-
      Deze uitvoerbaarverklaring bij voorraad kan ook in hoger beroep geschieden. Niettegenstaande de
      uitvoerbaarverklaring bij voorraad in eerste aanleg kan de hogere rechter schorsing van de werking bevelen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel360
  - number: '361.1'
    text: |-
      De rechter bepaalt dag en uur waarop de behandeling aanvangt. Hij beveelt tevens oproeping van de appellant, van de
      verzoeker in eerste aanleg en van de in eerste aanleg in de procedure verschenen belanghebbenden. Bovendien kan hij
      te allen tijde belanghebbenden, bekende of onbekende, doen oproepen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel361
  - number: '361.2'
    text: Indien aangaande dezelfde beschikking meer beroepschriften zijn ingediend, kan voeging worden bevolen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel361
  - number: '361.3'
    text: |-
      Iedere belanghebbende kan een verweerschrift indienen. Door belanghebbenden die in hoger beroep zijn opgeroepen,
      moet het verweerschrift worden ingediend binnen vier weken na de toezending aan hen van een afschrift van het
      beroepschrift, tenzij de rechter anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel361
  - number: '361.4'
    text: |-
      Indien een belanghebbende incidenteel hoger beroep heeft ingesteld, kunnen de appellant en de in hoger beroep
      opgeroepen belanghebbenden daartegen binnen vier weken na de toezending aan hen van een afschrift van het
      verweerschrift waarbij dit incidentele hoger beroep is ingesteld, een verweerschrift indienen, tenzij de rechter
      anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel361
  - number: '362'
    text: |-
      Voor zover uit deze afdeling dan wel uit een andere wettelijke regeling niet anders voortvloeit, is de derde titel
      in hoger beroep van overeenkomstige toepassing, met dien verstande dat [artikel 285][ref1] niet van toepassing is
      en dat geen zelfstandig verzoek kan worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel285
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel362
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '285'
        afdeling: Vierde
  - number: '376'
    text: |-
      Derden zijn bevoegd zich te verzetten tegen een vonnis hetwelk hunne regten benadeelt, indien zij noch in persoon,
      noch wettiglijk vertegenwoordigd, of indien zij welke zij vertegenwoordigen, in het regtsgeding niet zijn geroepen,
      of door voeging of tusschenkomst geene partij zijn geweest.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel376
  - number: '377'
    text: |-
      Dit verzet wordt beoordeeld door den regter, bij wien zoodanig vonnis is gewezen. Het wordt aangebragt door eene
      dagvaarding tegen alle de partijen tusschen welke hetzelve is gevallen, en de algemeene voorschriften wegens de
      wijze van procederen zijn op dit verzet toepasselijk.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel377
  - number: '378'
    text: |-
      Indien zoodanig vonnis aan eenen derde is tegengeworpen in een regtsgeding, en het verzet daartegen is ingesteld
      op den voet van het vorige artikel, staat het vrij aan den regter voor wien dat regtsgeding aanhangig is, indien
      daartoe gronden bestaan, de schorsing van hetzelve toe te staan, tot dat het ingestelde verzet zal zijn uitgewezen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel378
  - number: '379'
    text: |-
      De regter die over een verzet van derden oordeelt, kan, indien daartoe gronden bestaan, de uitvoering van het
      aangevallen vonnis schorsen, tot dat het verzet zal zijn uitgewezen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel379
  - number: '380'
    text: |-
      Bij wettiging van het verzet wordt het vonnis, waartegen dit gerigt is geweest, alleen in zoo verre verbeterd
      als het de regten van derden heeft benadeeld, ten zij het onsplitsbare der gevallene uitspraak eene geheele
      vernietiging daarvan noodzakelijk mogt maken.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel380
  - number: '382'
    text: 'Een vonnis dat in kracht van gewijsde is gegaan, kan op vordering van een partij worden herroepen indien:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel382
  - number: 382.a
    text: het berust op bedrog door de wederpartij in het geding gepleegd,
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel382
  - number: 382.b
    text: het berust op stukken, waarvan de valsheid na het vonnis is erkend of bij gewijsde is vastgesteld, of
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel382
  - number: 382.c
    text: |-
      de partij na het vonnis stukken van beslissende aard in handen heeft gekregen die door toedoen van de wederpartij
      waren achtergehouden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel382
  - number: '383.1'
    text: |-
      Het rechtsmiddel moet worden aangewend binnen drie maanden nadat de grond voor de herroeping is ontstaan en de
      eiser daarmee bekend is geworden. De termijn vangt niet aan dan nadat het vonnis in kracht van gewijsde is gegaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel383
  - number: '383.2'
    text: |-
      Indien de partij die gronden heeft de herroeping te vorderen binnen die termijn is overleden, is
      [artikel 341][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel341
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel383
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '341'
        afdeling: Tweede
  - number: '384.1'
    text: |-
      De vordering tot herroeping wordt gebracht voor de rechter die in laatste feitelijke instantie over de zaak heeft
      geoordeeld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel384
  - number: '384.2'
    text: |-
      Indien de Hoge Raad na vernietiging ten principale recht heeft gedaan, wordt de vordering gebracht voor de rechter
      van wie het vonnis of het arrest door de Hoge Raad is vernietigd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel384
  - number: '384.3'
    text: |-
      Is in laatste feitelijke instantie beslist door de voorzieningenrechter in kort geding, dan wordt de vordering
      gebracht voor de rechtbank.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel384
  - number: '385'
    text: |-
      Het geding wordt ingeleid met een dagvaarding die voldoet aan de eisen van [artikel 111][ref1] en wordt verder
      gevoerd op de wijze als in de tweede titel is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel111
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel385
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '111'
        afdeling: Vierde
  - number: '386'
    text: |-
      De vordering tot herroeping schorst de tenuitvoerlegging van het vonnis niet. De rechter die over de herroeping
      oordeelt, kan evenwel, desgevorderd, bij voorlopige voorziening de tenuitvoerlegging schorsen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel386
  - number: '387'
    text: |-
      De rechter die de voor herroeping aangevoerde grond of gronden juist bevindt, heropent het geding geheel of
      gedeeltelijk. Hij geeft partijen gelegenheid hun stellingen en verweren te wijzigen en aan te vullen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel387
  - number: '388.1'
    text: Het vonnis waarbij het geding is heropend, schorst de tenuitvoerlegging van het bestreden vonnis in zoverre.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel388
  - number: '388.2'
    text: |-
      De beslissing inzake de heropening van het geding is niet vatbaar voor hoger beroep. Een vordering tot herroeping
      kan daartegen evenmin worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel388
  - number: '389'
    text: |-
      Indien de rechter met betrekking tot het geding voor zover het is heropend, tot een ander oordeel komt, doet hij
      daarin opnieuw uitspraak met herroeping in zoverre van het bestreden vonnis.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel389
  - number: '390'
    text: |-
      Een beschikking kan op verzoek van de oorspronkelijke verzoeker of van een belanghebbende worden herroepen op de
      gronden genoemd in [artikel 382][ref1], tenzij de aard van de beschikking zich daartegen verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel382
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel390
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '382'
        afdeling: Eerste
  - number: '391'
    text: |-
      De [artikelen 382 tot en met 384][ref1] en [386 tot en met 389][ref2] zijn van overeenkomstige toepassing.
      Overigens wordt het verzoek tot herroeping behandeld op de wijze als in de derde titel is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel382
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel386
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel391
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '382'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '386'
        afdeling: Eerste
  - number: '398'
    text: 'Partijen kunnen beroep in cassatie instellen:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel398
  - number: 398.1°
    text: tegen uitspraken, die hetzij in eerste en hoogste ressort hetzij in hoger beroep zijn gewezen;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel398
  - number: 398.2°
    text: |-
      tegen vonnissen die in eerste ressort op tegenspraak zijn gewezen, indien partijen nadien zijn overeengekomen het
      hoger beroep over te slaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel398
  - number: '399'
    text: |-
      Het beroep staat niet open voor hem die zijn bezwaren kan doen herstellen door dezelfde rechter bij wie de zaak
      heeft gediend.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel399
  - number: '400'
    text: Het beroep staat niet open voor hem, die in de uitspraak heeft berust.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel400
  - number: 401a.1
    text: |-
      Van uitspraken, waarbij een voorlopige voorziening wordt toegestaan of geweigerd, kan beroep in cassatie worden
      ingesteld voordat de einduitspraak is gewezen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel401a
  - number: 401a.2
    text: |-
      Van andere tussenvonnissen of tussenarresten kan beroep in cassatie slechts tegelijk met dat van het eindvonnis
      of eindarrest worden ingesteld, tenzij de rechter anders heeft bepaald of [artikel 75, eerste lid][ref1], van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel75
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel401a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '75'
        afdeling: Achtste
  - number: 401b.1
    text: Tegen een bij verstek gewezen uitspraak kan de niet-verschenen partij geen beroep in cassatie instellen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel401b
  - number: 401b.2
    text: |-
      Zij kan echter, indien een der andere partijen beroep in cassatie instelt, bij de Hoge Raad verweer voeren en zelfs
      incidenteel beroep instellen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel401b
  - number: 401c.1
    text: |-
      Indien het beroep tegen een bij verstek gewezen uitspraak wordt ingesteld, terwijl verzet nog open staat, kan de
      verweerder niet meer verzet doen, indien hij heeft gebruik gemaakt van de bevoegdheid, hem in [artikel 401][ref1],
      toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel401b
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel401c
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 401b
        afdeling: Eerste
  - number: 401c.2
    text: |-
      Ingeval van verzet vervalt het geding bij de Hoge Raad, onverminderd het recht van partijen om, na de uitspraak
      op het verzet, in cassatie op te komen tegen die uitspraak, zomede van de oorspronkelijke eiser om alsdan binnen
      dezelfde termijn in cassatie op te komen tegen de uitspraak bij verstek voor wat betreft de beslissingen, die door
      het verzet niet zijn getroffen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel401c
  - number: 401c.3
    text: |-
      Ingeval, voordat verzet is gedaan, het geding bij de Hoge Raad geëindigd is, belet dit niet het alsnog doen van
      verzet. Indien de Hoge Raad ten principale uitspraak deed, moet het verzet bij hem worden gedaan. In alle gevallen
      is de rechter gebonden aan hetgeen de Hoge Raad omtrent rechtspunten had beslist.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel401c
  - number: '402.1'
    text: |-
      Het beroep in cassatie moet - behoudens in de gevallen waarin de wet een kortere cassatietermijn voorschrijft -
      worden ingesteld binnen drie maanden, te rekenen van de dag van de uitspraak.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel402
  - number: '402.2'
    text: |-
      In de gevallen, waarin de wet voor het hoger beroep een kortere termijn heeft voorgeschreven, wordt ook de termijn
      voor het beroep in cassatie verkort en gesteld op het dubbele van de termijn in die gevallen voor het hoger beroep
      bepaald.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel402
  - number: '402.3'
    text: |-
      Indien in de vorige instantie een vordering tot vrijwaring geheel of gedeeltelijk is afgewezen op grond van de
      afwijzing van de vordering in de hoofdzaak, staat het beroep in cassatie daartegen open tot het moment dat in de
      hoofdzaak in cassatie de conclusie van antwoord wordt genomen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel402
  - number: '403.1'
    text: |-
      Bij overlijden van de in het ongelijk gestelde partij gedurende de loop van de cassatietermijn vangt voor de
      erfgenamen of rechtverkrijgenden een nieuwe termijn aan op de dag na die van het overlijden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel403
  - number: '403.2'
    text: |-
      In ieder geval kan het beroep nog worden ingesteld binnen vier weken na afloop van de termijn, bedoeld in
      [artikel 185 van Boek 4 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel185
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel403
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '185'
  - number: '404'
    text: |-
      Buiten de gevallen, waarin de rechter de voorlopige tenuitvoerlegging heeft toegestaan, heeft het beroep in
      cassatie schorsende kracht.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel404
  - number: '407.1'
    text: |-
      Het beroep in cassatie wordt ingesteld bij een dagvaarding in dezelfde vorm en met dezelfde vereisten als in eerste
      aanleg, behoudens de volgende wijzigingen:
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel407
  - number: '407.2'
    text: |-
      De dagvaarding behelst, in plaats van hetgeen in [artikel 111, tweede lid, onder d][ref1], is vermeld, de
      omschrijving van de middelen, waarop het beroep steunt.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel111
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel407
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '111'
        afdeling: Vierde
  - number: '407.3'
    text: |-
      De eiser is gehouden in het exploit van dagvaarding een advocaat bij de Hoge Raad aan te wijzen, die hem in het
      geding zal vertegenwoordigen, op straffe van nietigheid.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel407
  - number: '407.4'
    text: |-
      Hij wordt geacht woonplaats te hebben gekozen bij die advocaat, tenzij het exploit een andere binnen de gemeente
      's-Gravenhage gekozen woonplaats uitdrukt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel407
  - number: '408'
    text: |-
      De verweerder kan de termijn, waarop hij gedagvaard is, verkorten door bij een aan de gekozen woonplaats des eisers
      betekend exploit deze tegen een vroegere dan in het exploit van dagvaarding opgegeven rechtsdag op te roepen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel408
  - number: 408a.1
    text: Alle zaken worden ingeschreven ter rolle van de enkelvoudige kamer en door haar behandeld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel408a
  - number: 408a.2
    text: 'De enkelvoudige kamer verwijst de zaak naar de meervoudige kamer:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel408a
  - number: 408a.2.a
    text: wanneer pleidooi wordt gevraagd, tenzij volstaan zal worden met het overleggen van schriftelijke toelichtingen
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel408a
  - number: 408a.2.b
    text: wanneer recht op de stukken wordt verzocht
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel408a
  - number: 408a.2.c
    text: steeds wanneer zij verwijzing wenselijk acht.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel408a
  - number: 408a.3
    text: |-
      Is volstaan met het overleggen van schriftelijke toelichtingen, dan vindt verwijzing plaats wanneer arrest wordt
      gevraagd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel408a
  - number: 408a.5
    text: |-
      Voor de toepassing van de [artikelen 412, tweede lid][ref1], [417][ref2] en [418, eerste lid][ref3] geldt de
      schriftelijke toelichting als bedoeld in het tweede lid, onderdeel *a*, en in het derde lid als pleidooi.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel412
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel417
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel418
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel408a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '412'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '417'
        afdeling: Derde
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '418'
        afdeling: Derde
  - number: '409.1'
    text: |-
      De advocaat bij de Hoge Raad, die voor de verweerder optreedt, verklaart dit bij de oproeping der zaak ter
      terechtzitting.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel409
  - number: '409.2'
    text: Van deze verklaring geschiedt aantekening in het zittingblad.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel409
  - number: '409.3'
    text: |-
      De verweerder wordt geacht woonplaats te hebben gekozen bij zijn advocaat. Hij kan echter ook een andere woonplaats
      mits binnen de gemeente 's-Gravenhage, in het zittingblad opgeven.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel409
  - number: '410.1'
    text: |-
      De verweerder, van zijn zijde in cassatie wensend te komen, doet dit, op straffe van verval van het recht daartoe,
      bij zijn conclusie van antwoord, welke alsdan een omschrijving behelst van de middelen, waarop het beroep steunt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel410
  - number: '410.2'
    text: |-
      De verweerder is in dit incidentele beroep ontvankelijk ook na verloop van de in [artikel 402][ref1] gestelde
      termijnen en zelfs na berusting in de uitspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel402
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel410
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '402'
        afdeling: Tweede
  - number: '410.3'
    text: De afstand van het principale beroep doet het ingestelde incidentele beroep niet vervallen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel410
  - number: '411.1'
    text: |-
      Wanneer de verweerder niet reeds op de eerste rechtsdag zijn conclusie van antwoord neemt, wordt hem tot dat einde,
      op zijn verlangen, een termijn van ten hoogste vier weken verleend.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel411
  - number: '411.2'
    text: |-
      Hij is op straffe van verval van het recht exceptiën aan te voeren, gehouden deze met zijn antwoord ten principale
      te verenigen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel411
  - number: '411.3'
    text: |-
      Alleen de in [artikel 128, derde lid][ref1], bedoelde exceptie wordt op straffe van verval afzonderlijk voor alle
      weren van rechten voorgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel128
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel411
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '128'
        afdeling: Vijfde
  - number: '412.1'
    text: |-
      Ingeval van incidenteel beroep of indien door de verweerder een exceptie tegen het principale beroep wordt
      aangevoerd, wordt aan de eiser, op zijn verlangen, een termijn van ten hoogste vier weken verleend om het
      incidentele beroep of de voorgestelde exceptie bij conclusie te beantwoorden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel412
  - number: '412.2'
    text: |-
      Is het een noch het ander het geval, dan wordt onmiddellijk na het nemen der conclusie van antwoord de dag van
      pleidooi bepaald, tenzij partijen, onder overlegging der stukken, daarop recht vragen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel412
  - number: '413'
    text: |-
      Partijen zijn gehouden de bescheiden, waarop zij zich beroepen, elkander over en weer mede te delen in afschrift of
      door nederlegging van het oorspronkelijke ter griffie gedurende tenminste drie dagen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel413
  - number: '414.1'
    text: |-
      [Artikel 224][ref1] is van toepassing in cassatie.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel224
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel414
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '224'
        paragraaf: '6'
        afdeling: Tiende
  - number: '414.2'
    text: Niettemin is de oorspronkelijke verweerder, eiser zijnde in cassatie, niet gehouden tot zekerheidstelling.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel414
  - number: '414.3'
    text: De verweerder in cassatie is daartoe evenmin gehouden, zelfs niet bij het instellen van incidenteel beroep.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel414
  - number: '414.4'
    text: De in vroegere instantiën gestelde zekerheid blijft ook verbonden voor de kosten van cassatie.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel414
  - number: '414.5'
    text: De zekerheidstelling wordt gevorderd vóór alle weren van rechten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel414
  - number: '415.1'
    text: De vordering tot zekerheidstelling en alle andere incidentele vorderingen worden ingesteld bij conclusie ter rolle.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel415
  - number: '415.2'
    text: |-
      De verweerder op het incident neemt in dezelfde of in een nadere door de Hoge Raad te bepalen terechtzitting zijn
      conclusie van antwoord op het incident, dat door de Hoge Raad, na partijen, zo zij dit verlangen, en de procureur-
      generaal bij de Hoge Raad te hebben gehoord, afzonderlijk wordt beslist.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel415
  - number: '416'
    text: |-
      De aangewezen advocaat blijft de partij vertegenwoordigen totdat hetzij door haar een andere advocaat bij de Hoge
      Raad is aangewezen bij aan de wederpartij betekend exploit, hetzij de advocaat zelf aan deze laatste bij betekend
      exploit of ter terechtzitting heeft aangezegd, dat hij zich aan de verdere behandeling der zaak onttrekt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel416
  - number: '417'
    text: |-
      De pleidooien kunnen ook worden gehouden door andere dan de volgens de [artikelen 407][ref1] en [409][ref2]
      aangewezen advocaten, zonder dat de daaruit ontstaande vermeerdering van kosten in de uitspraak over de kosten
      begrepen is.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel407
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel409
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel417
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '407'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '409'
        afdeling: Derde
  - number: '418.1'
    text: |-
      Na de pleidooien, of nadat partijen recht op de stukken hebben verzocht, neemt de procureur-generaal bij de Hoge
      Raad conclusie, hetzij onmiddellijk, hetzij op een daartoe te bepalen dag.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel418
  - number: '418.2'
    text: Tenzij de Hoge Raad dadelijk uitspraak doet, bepaalt hij de dag, waarop dit zal geschieden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel418
  - number: 418a
    text: |-
      Voor zover uit deze titel niet anders voortvloeit, zijn van de tweede titel de [artikelen 87 tot en met 92][ref1],
      de [artikelen111 tot en met 120][ref2], [artikel 125][ref3], de zevende tot en met de negende afdeling, artikel 224
      alsmede de elfde tot en met de dertiende afdeling van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel111
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel125
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel418a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '87'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '111'
        afdeling: Vierde
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '125'
        afdeling: Vijfde
  - number: '419.1'
    text: De Hoge Raad bepaalt zich bij zijn onderzoek tot de middelen waarop het beroep steunt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel419
  - number: '419.2'
    text: |-
      De feitelijke grondslag der middelen kan alleen worden gevonden in de bestreden uitspraak en in de stukken van
      het geding.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel419
  - number: '419.3'
    text: De Hoge Raad is gebonden aan hetgeen in de bestreden uitspraak omtrent de feiten is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel419
  - number: '419.4'
    text: De Hoge Raad geeft omtrent de kosten van het geding zodanige uitspraak als hij vermeent te behoren.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel419
  - number: '420'
    text: |-
      Bij vernietiging van de bestreden uitspraak doet de Hoge Raad het geding zelf af, voor zover er niet op de voet van
      de navolgende bepalingen gronden zijn voor verwijzing.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel420
  - number: '421'
    text: |-
      Indien na de vernietiging dient te worden beslist over feiten, waaromtrent nog geen uitspraak is gedaan, verwijst
      de Hoge Raad het geding, tenzij het een punt van ondergeschikte aard betreft, waarover de Hoge Raad op grond van de
      stukken van het geding een beslissing kan geven.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel421
  - number: '422'
    text: |-
      Indien na de vernietiging dient te worden beslist over rechtspunten, waaromtrent nog geen uitspraak is gedaan, zal
      de Hoge Raad naar bevind van omstandigheden daaromtrent een beslissing geven dan wel daartoe het geding verwijzen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel422
  - number: 422a
    text: |-
      Het geding wordt verwezen naar de rechter, wiens uitspraak vernietigd is, tenzij er overeenkomstig het bepaalde bij
      de [artikelen 76, tweede lid][ref1], en [355][ref2] reden is tot verwijzing naar de rechter van eerste aanleg.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel355
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel422a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '76'
        afdeling: Achtste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '355'
        afdeling: Derde
  - number: '423'
    text: |-
      De Hoge Raad kan, in stede van het geding te verwijzen naar de rechter, wiens uitspraak vernietigd is, het
      verwijzen naar een andere rechter en wel:
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel423
  - number: 423.1°
    text: wanneer de vernietigde uitspraak was gewezen door een rechtbank, naar het gerechtshof van het ressort;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel423
  - number: 423.2°
    text: wanneer de vernietigde uitspraak was gewezen door een gerechtshof, naar een ander gerechtshof.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel423
  - number: '424'
    text: |-
      De rechter, naar wie het geding is verwezen, zet de behandeling daarvan voort en beslist met inachtneming van de
      uitspraak van de Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel424
  - number: '425'
    text: |-
      Er wordt geen verzet toegelaten tegen arresten door de Hoge Raad bij verstek in cassatie gewezen, dan alleen
      wanneer er gronden waren tot nietigverklaring van de dagvaarding of het beroep was ingesteld na verloop van de
      wettelijke termijn en mits het verzet geschiedde binnen veertien dagen na de betekening van het arrest.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel425
  - number: '426.1'
    text: |-
      Tegen beschikkingen op rekest kan beroep in cassatie worden ingesteld door degenen, die in een der vorige
      instantiën verschenen zijn, binnen drie maanden, te rekenen van de dag van de uitspraak.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel426
  - number: '426.2'
    text: |-
      In de gevallen, waarin de wet voor het hoger beroep een kortere termijn heeft voorgeschreven, wordt ook de termijn
      voor het beroep in cassatie verkort en gesteld op het dubbele van de termijn in die gevallen voor het hoger beroep
      bepaald.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel426
  - number: '426.3'
    text: |-
      In de gevallen, waarin de wet voor het hoger beroep een ander aanvangstijdstip heeft voorgeschreven dan de dag van
      de uitspraak, geldt dat andere aanvangstijdstip ook voor de termijn van het beroep in cassatie.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel426
  - number: '426.4'
    text: |-
      De [artikelen 399](onbekend), [400](onbekend), en [401a](onbekend) en de [artikelen 79][ref1] en
      [80 van de Wet op de rechterlijke organisatie][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel80
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel426
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '79'
      - id: ref2
        bwb_id: BWBR0001830
        artikel: '80'
  - number: 426a.1
    text: |-
      Het beroep in cassatie wordt aangebracht bij een verzoekschrift, dat wordt getekend door een advocaat bij de Hoge
      Raad en ingediend bij deszelfs griffie.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel426a
  - number: 426a.2
    text: Het verzoekschrift behelst de omschrijving van de middelen waarop het beroep steunt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel426a
  - number: 426b.1
    text: |-
      De verzoeker doet zijn verzoekschrift vergezeld gaan van zoveel afschriften als er anderen dan hij in de vorige
      instantie verschenen zijn.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel426b
  - number: 426b.2
    text: De griffier zendt onverwijld een afschrift aan ieder hunner toe.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel426b
  - number: 426b.3
    text: |-
      Binnen 3 weken na de toezending kunnen de verweerders een door een advocaat bij de Hoge Raad getekend
      verweerschrift ter griffie van de Hoge Raad indienen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel426b
  - number: 426b.4
    text: De Hoge Raad kan in een bepaald geval een andere termijn vaststellen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel426b
  - number: 426b.5
    text: De griffier vermeldt bij de toezending de termijn, binnen welke het verweerschrift moet worden ingediend.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel426b
  - number: '427.1'
    text: |-
      Bij het verweerschrift kan de verweerder, ondanks het verstrijken van de in [artikel 426][ref1] gestelde termijnen
      en ondanks berusting, van zijn zijde in cassatie komen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel426
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel427
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '426'
        afdeling: Vijfde
  - number: '427.2'
    text: |-
      [Artikel 426][ref1], en [artikel 410, derde lid][ref2], zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel426a
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel410
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel427
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 426a
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '410'
        afdeling: Derde
  - number: 427a.1
    text: |-
      Het verweerschrift gaat vergezeld van een afschrift, dat de griffier onverwijld aan de advocaat van de verzoeker
      tot cassatie toezendt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel427a
  - number: 427a.2
    text: |-
      In geval van incidenteel beroep of indien door de verweerder een exceptie tegen het principaal beroep wordt
      aangevoerd, kan de verzoeker tot cassatie binnen 3 weken na de toezending daarop bij door zijn advocaat getekend
      verweerschrift antwoorden. Het verweerschrift gaat vergezeld van een afschrift, hetwelk de griffier onverwijld aan
      de advocaat van de verweerder toezendt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel427a
  - number: 427a.3
    text: |-
      Het [vierde en vijfde lid van artikel 426b][ref1] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel426b
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel427a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 426b
        afdeling: Vijfde
  - number: '428.1'
    text: |-
      Indien het belang der zaak dit geraden doet voorkomen, kan de Hoge Raad, hetzij ambtshalve, hetzij op daartoe
      strekkend verzoek, een toelichting door de advocaten bevelen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel428
  - number: '428.2'
    text: |-
      Geschiedt de toelichting mondeling, dan vindt deze voor de meervoudige kamer plaats. Wordt de toelichting
      schriftelijk gegeven, dan geschiedt dit voor de enkelvoudige kamer.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel428
  - number: '428.3'
    text: |-
      De toelichting kan ook worden gegeven door andere advocaten, zonder dat de daaruit ontstaande vermeerdering van
      kosten in de uitspraak over de kosten begrepen is.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel428
  - number: 428a
    text: |-
      Voor zover uit deze afdeling niet anders voortvloeit, is [artikel 284][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel284
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel428a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '284'
        afdeling: Vierde
  - number: '429.1'
    text: |-
      Nadat de procureur-generaal bij de Hoge Raad binnen een door de Hoge Raad te bepalen termijn schriftelijk conclusie
      heeft genomen, geeft de Hoge Raad zijn beschikking.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel429
  - number: '429.2'
    text: |-
      De [artikelen 419-424][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel419
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel429
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '419'
        afdeling: Vierde
  - number: '429.3'
    text: |-
      De Hoge Raad geeft bij de beschikking zodanige uitspraak omtrent de kosten als hij vermeent te behoren. De griffier
      doet onverwijld mededeling van de gevallen beslissing aan de advocaten, die de schrifturen hebben ingediend.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel429
  - number: '430.1'
    text: |-
      De grossen van in Nederland gewezen vonnissen, van beschikkingen van de Nederlandse rechter en van in Nederland
      verleden authentieke akten alsmede van andere bij de wet als executoriale titel aangewezen stukken kunnen in geheel
      Nederland worden ten uitvoer gelegd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel430
  - number: '430.2'
    text: 'Zij moeten aan het hoofd voeren de woorden: In naam des Konings.'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel430
  - number: '430.3'
    text: Zij kunnen niet worden ten uitvoer gelegd dan na betekening aan de partij tegen wie de executie zich zal richten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel430
  - number: '431.1'
    text: |-
      Behoudens het bepaalde in de [artikelen 985-994][ref1], kunnen noch beslissingen, door vreemde rechters gegeven,
      noch buiten Nederland verleden authentieke akten binnen Nederland ten uitvoer worden gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel985
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel431
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '985'
        afdeling: Eerste
  - number: '431.2'
    text: De gedingen kunnen opnieuw bij de Nederlandse rechter worden behandeld en afgedaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel431
  - number: 431a
    text: |-
      Indien de bevoegdheid tot tenuitvoerlegging van een executoriale titel op een ander overgaat, kan de executie eerst
      worden aangevangen of voortgezet na betekening van deze overgang aan de geëxecuteerde.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel431a
  - number: '432'
    text: |-
      Geen vonnis waarvan de voorlopige tenuitvoerlegging niet is toegestaan kan tegen een derde worden ten uitvoer
      gelegd, noch kan daaraan door die derde worden voldaan, dan acht dagen na betekening daarvan aan de partij die
      in het ongelijk is gesteld, en met overlegging van een verklaring van de griffier dat er op zijn registers geen
      verzet, hoger beroep of cassatie daartegen is aangetekend.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel432
  - number: '433'
    text: |-
      De partij die verzet heeft gedaan, of hoger beroep of beroep in cassatie heeft ingesteld, heeft de bevoegdheid om
      daarvan ter griffie van het gerecht dat het bestreden vonnis heeft uitgesproken, in een daartoe bestemd register
      aantekening te doen houden, met vermelding van de namen van de partijen, de dagtekening van het vonnis en die van
      het verzet, het hoger beroep of het beroep in cassatie.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel433
  - number: '434'
    text: |-
      De overhandiging van de executoriale titel, waarvan men de uitvoering verlangt, aan de deurwaarder, machtigt hem
      in die zaak tot het doen van de gehele executie, uit die titel voortvloeiende, met uitzondering alleen van die bij
      lijfsdwang, waartoe een bijzondere volmacht vereist wordt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel434
  - number: 434a
    text: |-
      Kosten terzake van ambtshandelingen, verricht door gerechtsdeurwaarders, worden voor de bepaling van de kosten van
      tenuitvoerlegging in aanmerking genomen overeenkomstig bij of krachtens algemene maatregel van bestuur vastgestelde
      tarieven.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel434a
  - number: '435.1'
    text: |-
      Het staat aan de executant vrij te gelijker tijd beslag te leggen op alle voor beslag vatbare goederen, waartoe hij
      bevoegd is zijn vordering te verhalen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel435
  - number: '435.2'
    text: |-
      Hij is verplicht een beslag dat strekt tot verhaal op een goed dat aan een ander dan de schuldenaar toebehoort, en
      dat ten laste van die ander wordt gelegd, binnen acht dagen aan de schuldenaar te betekenen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel435
  - number: '435.3'
    text: |-
      Wordt een beslag van de in het vorige lid bedoelde strekking ten laste van de schuldenaar gelegd, dan is de
      beslaglegger verplicht het binnen acht dagen aan de ander te betekenen of, zo hij diens recht niet kent, onverwijld
      nadat hij van dat recht kennis heeft gekregen. Indien de ander, voordat acht dagen na deze betekening zijn
      verstreken, schriftelijk aan de deurwaarder mededeelt zich tegen het verhaal op zijn goed te verzetten, geldt het
      beslag jegens hem slechts als conservatoir en kan de executie jegens hem slechts plaatsvinden uit hoofde van een
      tegen hem verkregen executoriale titel om deze executie te dulden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel435
  - number: '436'
    text: Beslag mag niet worden gelegd op goederen, bestemd voor de openbare dienst.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel436
  - number: '437'
    text: |-
      Hetgeen omtrent de executie van een goed is bepaald, is van overeenkomstige toepassing op de executie van een
      beperkt recht op of een aandeel in een zodanig goed.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel437
  - number: '438.1'
    text: |-
      Geschillen die in verband met een executie rijzen, worden gebracht voor de rechtbank die naar de gewone regels
      bevoegd zou zijn, of in welker rechtsgebied de inbeslagneming plaatsvindt, zich een of meer van de betrokken zaken
      bevinden of de executie zal geschieden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel438
  - number: '438.2'
    text: |-
      Tot het verkrijgen van een voorziening bij voorraad kan het geschil ook worden gebracht in kort geding voor de
      voorzieningenrechter van de volgens het eerste lid bevoegde rechtbank. Onverminderd zijn overige bevoegdheden kan
      de voorzieningenrechter desgevorderd de executie schorsen voor een bepaalde tijd of totdat op het geschil zal zijn
      beslist, dan wel bepalen dat de executie slechts tegen zekerheidstelling mag plaatsvinden of worden voortgezet.
      Hij kan beslagen, al of niet tegen zekerheidstelling, opheffen. Hij kan gedurende de executie herstel bevelen van
      verzuimde formaliteiten met bepaling welke op het verzuim gevolgde formaliteiten opnieuw moeten worden verricht en
      te wiens laste de kosten daarvan zullen komen. Hij kan bepalen dat een in het geding geroepen derde de voortzetting
      van de executie moet gedogen dan wel zijn medewerking daaraan moet verlenen, al dan niet tegen zekerheidstelling
      door de executant.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel438
  - number: '438.3'
    text: |-
      Voor zover de zaak zich niet leent voor behandeling in kort geding, kan de voorzieningenrechter in plaats van de
      vordering af te wijzen de zaak op verlangen van de eiser verwijzen naar de rechtbank met bepaling van de dag waarop
      zij op de rol moet komen. Op verlangen van de eiser kan de voorzieningenrechter tevens bepalen dat voor het vervolg
      [artikel 145][ref1] van toepassing zal zijn. Tegen een gedaagde die op voormeld tijdstip niet verschijnt en ook
      voor de voorzieningenrechter niet bij procureur is verschenen, wordt slechts verstek verleend, zo hij tegen dit
      tijdstip bij exploit is opgeroepen met inachtneming van de voor dagvaarding voorgeschreven termijn, dan wel van de
      termijn die op verlangen van de eiser door de voorzieningenrechter bepaald is.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel145
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel438
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '145'
        afdeling: Achtste
  - number: '438.4'
    text: |-
      De deurwaarder die met de executie is belast en daarbij op een bezwaar stuit dat een onverwijlde voorziening nodig
      maakt, kan zich met een daarvan door hem opgemaakt proces-verbaal bij de voorzieningenrechter vervoegen ten einde
      deze in kort geding tussen de betrokken partijen te doen beslissen. De voorzieningenrechter zal de behandeling
      aanhouden tot de partijen zijn opgeroepen, tenzij hij, gelet op de aard van het bezwaar, een onmiddellijke
      beslissing geboden acht. De deurwaarder die zijn voormelde bevoegdheid zonder instemming van de executant
      uitoefent, kan persoonlijk in de kosten worden veroordeeld, indien deze uitoefening nodeloos was.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel438
  - number: '438.5'
    text: Verzet tegen de executie door een derde geschiedt door dagvaarding van zowel de executant als de geëxecuteerde.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel438
  - number: 438a.1
    text: |-
      In zaken betreffende een executie die volgens de tweede en de derde titel van dit Boek of
      [titel 9 van Boek 3 van het Burgerlijk Wetboek][ref1] worden ingeleid door een verzoekschrift aan de
      voorzieningenrechter van de rechtbank, is bevoegd de voorzieningenrechter in wiens rechtsgebied de te executeren
      zaken zich geheel of grotendeels bevinden of de executie zal geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0005291
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel438a
    references:
      - id: ref1
        bwb_id: BWBR0005291
  - number: 438a.2
    text: |-
      De indiening van verzoekschriften krachtens de [artikelen 459, derde lid][ref1], [461b][ref2],
      [462, tweede lid][ref3], [463, derde lid][ref4], [463a][ref5], [465][ref6], [481, eerste lid][ref7],
      [496, tweede lid][ref8], en [506, tweede lid][ref9], kan ook door een deurwaarder geschieden. Hetzelfde geldt voor
      een verzoekschrift krachtens [artikel 234, derde lid, van Boek 3 van het Burgerlijk Wetboek](onbekend), indien de
      executie door een pandhouder geschiedt, of krachtens [artikel 251 van dat Boek](onbekend). Indien een deurwaarder
      het verzoekschrift indient, geldt zijn kantoor als gekozen woonplaats van de verzoeker.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel459
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel461b
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel462
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel463
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel463a
      [ref6]: https://wetten.overheid.nl/BWBR0001827#Artikel465
      [ref7]: https://wetten.overheid.nl/BWBR0001827#Artikel481
      [ref8]: https://wetten.overheid.nl/BWBR0001827#Artikel496
      [ref9]: https://wetten.overheid.nl/BWBR0001827#Artikel506
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel438a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '459'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 461b
        afdeling: Eerste
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '462'
        afdeling: Eerste
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '463'
        afdeling: Eerste
      - id: ref5
        bwb_id: BWBR0001827
        artikel: 463a
        afdeling: Eerste
      - id: ref6
        bwb_id: BWBR0001827
        artikel: '465'
        afdeling: Eerste
      - id: ref7
        bwb_id: BWBR0001827
        artikel: '481'
        afdeling: Derde
      - id: ref8
        bwb_id: BWBR0001827
