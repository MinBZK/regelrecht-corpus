        artikel: 444b
        afdeling: Eerste
  - number: '585'
    text: 'De rechter kan op verlangen van de schuldeiser de tenuitvoerlegging bij lijfsdwang toestaan van:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel585
  - number: 585.a
    text: vonnissen en beschikkingen, voor zover zij een veroordeling tot iets anders dan het betalen van geld inhouden;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel585
  - number: 585.b
    text: |-
      vonnissen, beschikkingen en authentieke akten waarbij een uitkering tot levensonderhoud, krachtens
      [Boek 1 van het Burgerlijk Wetboek][ref1] verschuldigd, daaronder begrepen het verschuldigde voor verzorging
      en opvoeding van een minderjarige en voor levensonderhoud en studie van een meerderjarige die de leeftijd van
      een en twintig jaren niet heeft bereikt, is bevolen of toegezegd, alsmede beschikkingen waarbij een uitkering
      krachtens [artikel 85, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref2] door de ene echtgenoot of
      geregistreerde partner aan de andere verschuldigd, is bevolen, en beschikkingen tot verhaal op grond van de
      [Wet werk en bijstand][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002656
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel85
      [ref3]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel585
    references:
      - id: ref1
        bwb_id: BWBR0002656
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '85'
      - id: ref3
        bwb_id: BWBR0015703
  - number: '586'
    text: |-
      Tenzij de tenuitvoerlegging bij lijfsdwang reeds was toegestaan in het vonnis of de beschikking tot nakoming
      waarvan dit dwangmiddel strekt, wordt een vordering tot uitvoerbaarverklaring bij lijfsdwang ingesteld bij de
      voorzieningenrechter van de rechtbank. De vordering wordt ingesteld en behandeld als een kort geding.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel586
  - number: '587'
    text: |-
      De rechter verklaart een vonnis, beschikking of akte als bedoeld in [artikel 585][ref1] slechts uitvoerbaar bij
      lijfsdwang, indien aannemelijk is dat toepassing van een ander dwangmiddel onvoldoende uitkomst zal bieden en het
      belang van de schuldeiser toepassing daarvan rechtvaardigt.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel585
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel587
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '585'
        afdeling: Eerste
  - number: '588'
    text: |-
      Uitvoerbaarheid bij lijfsdwang wordt niet uitgesproken indien de schuldenaar buiten staat is aan de verplichting
      waarvoor tenuitvoerlegging bij lijfsdwang wordt verlangd, te voldoen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel588
  - number: '589.1'
    text: De tenuitvoerlegging van de lijfsdwang duurt ter zake van dezelfde verplichting ten hoogste een jaar.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel589
  - number: '589.2'
    text: |-
      Strekt de verplichting van de schuldenaar tot nalaten, dan bepaalt de rechter de termijn gedurende welke de
      lijfsdwang kan worden ten uitvoer gelegd. Bij andere verplichtingen kan de rechter een termijn bepalen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel589
  - number: '590'
    text: |-
      De rechter kan zijn beslissing over de uitvoerbaarheid bij lijfsdwang voor een door hem te bepalen termijn
      aanhouden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel590
  - number: '591.1'
    text: |-
      Behoudens verlof tot dadelijke tenuitvoerlegging, kan lijfsdwang niet worden ten uitvoer gelegd dan een dag na
      betekening van het vonnis of de beschikking waarin de uitvoerbaarheid bij lijfsdwang is toegestaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel591
  - number: '591.2'
    text: Het exploot houdt mede een bevel tot nakoming in.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel591
  - number: '592.1'
    text: |-
      De deurwaarder heeft voor de ingijzelingstelling van de schuldenaar toegang tot elke plaats, voor zover dat
      redelijkerwijs voor de vervulling van zijn taak nodig is. [Artikel 444, tweede lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel444
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel592
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '444'
        afdeling: Eerste
  - number: '592.2'
    text: |-
      De schuldenaar mag niet worden gegijzeld zolang een vrijgeleide duurt, waarvan de tijd moet worden bepaald door de
      rechter die het heeft gegeven teneinde de schuldenaar voor zich te laten verschijnen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel592
  - number: '593'
    text: De ingijzelingstelling kan op alle dagen en uren plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel593
  - number: '594'
    text: De deurwaarder kan zich door een of twee getuigen doen bijstaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel594
  - number: '595'
    text: De deurwaarder kan de sterke arm verzoeken bij de aanhouding bijstand te verlenen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel595
  - number: '596'
    text: De gegijzelde schuldenaar wordt overgebracht naar een huis van bewaring.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel596
  - number: '597.1'
    text: |-
      De schuldeiser schiet iedere dertig dagen een toereikende som tot onderhoud van de schuldenaar voor, volgens een
      bij algemene maatregel van bestuur vastgesteld tarief.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel597
  - number: '597.2'
    text: |-
      Indien de schuldeiser niet aan het eerste lid voldoet, is de directeur van het huis van bewaring bevoegd de
      schuldenaar uit de gijzeling te ontslaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel597
  - number: '598.1'
    text: Van de ingijzelingstelling en de insluiting in het huis van bewaring maakt de deurwaarder een akte op.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel598
  - number: '598.2'
    text: 'De akte vermeldt:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel598
  - number: 598.2.a
    text: het vonnis of de beschikking waarin de tenuitvoerlegging bij lijfsdwang is toegestaan;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel598
  - number: 598.2.b
    text: de datum van de betekening;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel598
  - number: 598.2.c
    text: de naam, de voornamen en de woonplaats van de schuldeiser;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel598
  - number: 598.2.d
    text: een door de schuldeiser gekozen woonplaats in de gemeente waarin de schuldenaar is ingesloten;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel598
  - number: 598.2.e
    text: de voornamen, de naam en het kantooradres van de deurwaarder;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel598
  - number: 598.2.f
    text: de naam en de woonplaats van de schuldenaar;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel598
  - number: 598.2.g
    text: |-
      plaats en tijdstip van de ingijzelingstelling en, indien daarbij getuigen aanwezig waren, hun namen en
      woonplaatsen;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel598
  - number: 598.2.h
    text: het voorschot van onderhoud voor ten minste dertig dagen;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel598
  - number: 598.2.i
    text: de vermelding dat de schuldenaar een afschrift van de akte heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel598
  - number: '598.3'
    text: |-
      Bij het binnentreden in een woning zonder toestemming van de bewoner zijn de [artikelen 10][ref1]
      en [11, tweede lid, van de Algemene wet op het binnentreden][ref2] op de akte, bedoeld in
      het eerste lid, van overeenkomstige toepassing. Is na het binnentreden de schuldenaar niet
      gegijzeld, dan maakt de deurwaarder, met overeenkomstige toepassing van de [artikelen 10][ref3] en
      [11, tweede lid, van de Algemene wet op het binnentreden][ref4] en van het tweede lid, onder a, b, c, e, f en g,
      eveneens een akte op.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0006763
      [ref3]: https://wetten.overheid.nl/BWBR0006763#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0006763#Artikel11
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel598
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0006763
      - id: ref3
        bwb_id: BWBR0006763
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0006763
        artikel: '11'
  - number: '599.1'
    text: |-
      De directeur van het huis van bewaring schrijft de gegevens bedoeld in
      [artikel 598, tweede lid, onder a tot en met h][ref1], in in zijn register.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel598
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel599
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '598'
        afdeling: Tweede
  - number: '599.2'
    text: |-
      De deurwaarder verstrekt de directeur afschriften van het vonnis of de beschikking waarin de tenuitvoerlegging
      bij lijfsdwang werd toegestaan en van de akte van insluiting. Deze afschriften worden bij het in het eerste lid
      bedoelde register gevoegd. Indien de deurwaarder de afschriften niet verstrekt, weigert de directeur de opname van
      de schuldenaar.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel599
  - number: '600'
    text: 'De schuldenaar wordt uit de gijzeling ontslagen indien:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel600
  - number: 600.a
    text: de schuldeiser daarin schriftelijk toestemt;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel600
  - number: 600.b
    text: |-
      de schuldenaar alsnog zijn schuld met de verschenen rente betaalt dan wel zich, in het geval zijn verplichting een
      andere is dan de betaling van geld, onder het stellen van voldoende waarborg bereid verklaart daaraan te voldoen,
      een en ander onder betaling van vereffende kosten, de kosten van de gijzeling en de voorgeschoten onderhoudskosten;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel600
  - number: 600.c
    text: |-
      de gijzeling een zodanig nadelige invloed op de gezondheid van de schuldenaar heeft dat zijn leven daardoor in
      gevaar komt;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel600
  - number: 600.d
    text: de schuldenaar buiten staat is te voldoen aan de prestatie waartoe hij verplicht is;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel600
  - number: 600.e
    text: het belang van de schuldeiser voortzetting van de gijzeling niet rechtvaardigt;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel600
  - number: 600.f
    text: toepassing van een ander dwangmiddel alsnog redelijkerwijs voldoende uitkomst kan bieden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel600
  - number: 611a.1
    text: |-
      De rechter kan op vordering van een der partijen de wederpartij veroordelen tot betaling van een geldsom, dwangsom
      genaamd, voor het geval dat aan de hoofdveroordeling niet wordt voldaan, onverminderd het recht op schadevergoeding
      indien daartoe gronden zijn. Een dwangsom kan echter niet worden opgelegd in geval van een veroordeling tot
      betaling van een geldsom.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel611a
  - number: 611a.2
    text: De dwangsom kan ook voor het eerst in verzet of in hoger beroep worden gevorderd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel611a
  - number: 611a.3
    text: De dwangsom kan niet worden verbeurd vóór de betekening van de uitspraak waarbij zij is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel611a
  - number: 611a.4
    text: De rechter kan bepalen dat de veroordeelde pas na verloop van een zekere termijn de dwangsom zal kunnen verbeuren.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel611a
  - number: 611b
    text: |-
      De rechter kan de dwangsom hetzij op een bedrag ineens, hetzij op een bedrag per tijdseenheid of per overtreding
      vaststellen. In de laatste twee gevallen kan de rechter eveneens een bedrag bepalen waarboven geen dwangsom meer
      verbeurd wordt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel611b
  - number: 611c
    text: |-
      De dwangsom, eenmaal verbeurd, komt ten volle toe aan de partij die de veroordeling heeft verkregen. Deze partij
      kan de dwangsom ten uitvoer leggen krachtens de titel waarbij zij is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel611c
  - number: 611d.1
    text: |-
      De rechter die een dwangsom heeft opgelegd, kan op vordering van de veroordeelde de dwangsom opheffen, de looptijd
      ervan opschorten gedurende de door hem te bepalen termijn of de dwangsom verminderen in geval van blijvende of
      tijdelijke, gehele of gedeeltelijke onmogelijkheid voor de veroordeelde om aan de hoofdveroordeling te voldoen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel611d
  - number: 611d.2
    text: |-
      Voor zover de dwangsom verbeurd was voordat de onmogelijkheid intrad, kan de rechter haar niet opheffen of
      verminderen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel611d
  - number: 611e.1
    text: De dwangsom kan gedurende het faillissement van de veroordeelde niet worden verbeurd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel611e
  - number: 611e.2
    text: |-
      Dwangsommen die vóór de faillietverklaring verbeurd zijn, worden in het passief van het faillissement niet
      toegelaten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel611e
  - number: 611e.3
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing in de schuldsaneringsregeling natuurlijke personen,
      met dien verstande dat dwangsommen tijdens de toepassing van de schuldsaneringsregeling kunnen worden opgelegd en
      verbeurd ter zake van vorderingen ten aanzien waarvan de schuldsaneringsregeling niet werkt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel611e
  - number: 611f.1
    text: |-
      Na overlijden van de veroordeelde wordt een dwangsom die op een bepaald bedrag per tijdseenheid is vastgesteld,
      niet verder verbeurd, maar de vóór het overlijden verbeurde dwangsommen blijven verschuldigd. De dwangsom wordt
      door erfgenamen van de veroordeelde pas opnieuw verbeurd nadat de rechter die haar heeft opgelegd, aldus heeft
      beslist. De rechter kan het bedrag en de voorwaarden ervan wijzigen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel611f
  - number: 611f.2
    text: |-
      Andere dwangsommen kunnen, op vordering van de erfgenamen, door de rechter die ze heeft opgelegd, worden opgeheven
      of verminderd, hetzij blijvend hetzij tijdelijk, en, in voorkomend geval, met ingang van de dag waarop de
      veroordeelde overleden is.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel611f
  - number: 611g.1
    text: Een dwangsom verjaart door verloop van zes maanden na de dag waarop zij verbeurd is.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel611g
  - number: 611g.2
    text: |-
      De verjaring wordt geschorst door faillissement, toepassing van de schuldsaneringsregeling natuurlijke personen en
      ieder ander wettelijk beletsel voor tenuitvoerlegging van de dwangsom.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel611g
  - number: 611g.3
    text: |-
      De verjaring wordt ook geschorst zolang degene die de veroordeling verkreeg met het verbeuren van de dwangsom
      redelijkerwijze niet bekend kon zijn.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel611g
  - number: 611h
    text: |-
      Voor de bepaling van de rechterlijke bevoegdheid en de vatbaarheid voor hoger beroep wordt geen rekening gehouden
      met de dwangsom.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel611h
  - number: 611i
    text: Onder rechter in deze afdeling worden mede scheidsmannen begrepen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel611i
  - number: '612'
    text: |-
      De rechter die een veroordeling tot schadevergoeding uitspreekt, begroot, voor zover hem dit mogelijk is, de
      schade in het vonnis. Indien begroting in het vonnis hem niet mogelijk is, spreekt hij een veroordeling uit tot
      schadevergoeding op te maken bij staat.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel612
  - number: '613.1'
    text: |-
      De tenuitvoerlegging van een veroordeling tot schadevergoeding op te maken bij staat, vangt aan met de betekening
      aan de wederpartij van een staat waarin het beloop van de schade waarvan de vereffening wordt gevorderd,
      gespecificeerd wordt opgegeven.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel613
  - number: '613.2'
    text: |-
      Het exploot vermeldt de roldatum en, indien dan een terechtzitting wordt gehouden, het uur daarvan. De bepalingen
      betreffende dagvaarding zijn van overeenkomstige toepassing. Bevoegd is de rechter die in eerste instantie over de
      hoofdzaak heeft geoordeeld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel613
  - number: '614'
    text: |-
      De schuldeiser kan in de schadestaat ook vereffening van de schade in andere vorm dan betaling van een geldsom
      vorderen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel614
  - number: '615'
    text: |-
      De schuldeiser kan, onverschillig of in de hoofdzaak reeds schadeposten waren gesteld, nieuwe posten in de
      schadestaat opnemen. Indien de wederpartij zich door de opneming in haar verdediging onredelijk bemoeilijkt acht,
      kan zij zich daartegen verzetten met overeenkomstige toepassing van [artikel 130, eerste en tweede lid][ref1]. Het
      verzet wordt in elk geval afgewezen, voor zover de schuldeiser ten tijde van de hoofdzaak niet met de schade bekend
      was.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel130
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel615
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '130'
        afdeling: Vijfde
  - number: 615a
    text: |-
      Voor de toepassing van de [artikelen 123][ref1], [127][ref2], [129][ref3], [130][ref4], [139 tot en met 147][ref5],
      [225 tot en met 228][ref6], [249 tot en met 253][ref7] worden hoofdzaak en schadestaatprocedure als afzonderlijke
      gedingen beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel123
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel127
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel129
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel130
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel139
      [ref6]: https://wetten.overheid.nl/BWBR0001827#Artikel225
      [ref7]: https://wetten.overheid.nl/BWBR0001827#Artikel249
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel615a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '123'
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '127'
        afdeling: Vijfde
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '129'
        afdeling: Vijfde
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '130'
        afdeling: Vijfde
      - id: ref5
        bwb_id: BWBR0001827
        artikel: '139'
        afdeling: Zevende
      - id: ref6
        bwb_id: BWBR0001827
        artikel: '225'
        afdeling: Elfde
      - id: ref7
        bwb_id: BWBR0001827
        artikel: '249'
        paragraaf: '2'
        afdeling: Dertiende
  - number: 615b
    text: |-
      De schuldenaar wordt veroordeeld de vastgestelde schade te voldoen. Op verlangen van de schuldeiser kan de rechter
      de schadeposten afzonderlijk toewijzen, zodra zij zijn komen vast te staan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel615b
  - number: '616.1'
    text: |-
      Ingeval van geschil over een krachtens vonnis of beschikking te stellen zekerheid wordt daarover op vordering van
      de meest gerede partij in kort geding beslist door de voorzieningenrechter van de rechtbank, door wie of door wiens
      college de zaak in eerste aanleg is behandeld, of, in geval van een arbitraal vonnis, van de rechtbank ter griffie
      waarvan dat vonnis is nedergelegd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel616
  - number: '616.2'
    text: |-
      Gaat het om een vonnis of beschikking van de kantonrechter, dan wordt de vordering voor deze ingesteld. Gaat het om
      een uitspraak van een gerechtshof in eerste aanleg, dan wordt de vordering ingesteld voor de voorzieningenrechter
      van de rechtbank die naar de gewone regels in eerste aanleg bevoegd zou zijn.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel616
  - number: '616.3'
    text: |-
      Zowel de rechter die het vonnis of de beschikking, bedoeld in de vorige leden, wijst als de rechter die over het
      geschil omtrent de te stellen zekerheid oordeelt, kan een termijn bepalen:
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel616
  - number: 616.3.a
    text: |-
      waarbinnen de zekerheid moet worden aangeboden of gesteld, op straffe van verval van de bevoegdheid met het oog op
      welker uitoefening de zekerheidstelling is bevolen;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel616
  - number: 616.3.b
    text: |-
      waarbinnen een aangeboden zekerheid door de wederpartij moet worden aanvaard of geweigerd, op straffe van verval
      van haar bevoegdheid zekerheidstelling te eisen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel616
  - number: '616.4'
    text: |-
      De rechter die de termijn heeft bepaald, kan deze op verzoek van de meest gerede partij, in te dienen voordat de
      termijn is verstreken, verlengen. Tegen een beschikking krachtens dit lid is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel616
  - number: '621'
    text: |-
      Bevoegd tot het kennisnemen van een betwisting, als bedoeld in
      [artikel 168 van Boek 8 van het Burgerlijk Wetboek][ref1], en van verzoeken tot verkoop als bedoeld in
      [afdeling 1 van titel 3 van Boek 8 van dat Wetboek][ref2] is de rechtbank van de woonplaats genoemd in
      [artikel 194 zesde lid][ref3] of [artikel 784 zevende lid van Boek 8 van het Burgerlijk Wetboek][ref4]. Verkoop van
      het schip geschiedt slechts na verhoor of behoorlijke oproeping van de leden der rederij en de boekhouder, zo er
      een boekhouder is.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel168
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Afdeling1
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel194
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel784
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel621
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '168'
      - id: ref2
        bwb_id: BWBR0005034
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '194'
      - id: ref4
        bwb_id: BWBR0005034
        artikel: '784'
  - number: '622.1'
    text: |-
      Indien binnen één maand, nadat de boekhouder aan de leden der rederij kennis heeft gegeven van zijn verlangen
      als bedoeld in [artikel 170 van Boek 8 van het Burgerlijk Wetboek][ref1], tussen hem en alle leden der
      rederij geen eenstemmigheid is verkregen omtrent de benoeming van de in dat artikel bedoelde deskundigen,
      zullen deze, in oneven getale, op verzoek van de boekhouder dan wel een lid der rederij, worden benoemd
      door de voorzieningenrechter van de rechtbank van de woonplaats genoemd in [artikel 194 zesde lid][ref2] of
      [artikel 784, zevende lid van Boek 8 van het Burgerlijk Wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel170
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel194
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel784
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel622
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '170'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '194'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '784'
  - number: '622.2'
    text: |-
      Indien binnen één maand, nadat een lid der rederij aan de andere leden daarvan kennis heeft gegeven van zijn
      verlangen als bedoeld in [artikel 174 van Boek 8 van het Burgerlijk Wetboek][ref1], tussen hem en die andere leden
      geen eenstemmigheid is verkregen omtrent de benoeming van de in dat artikel bedoelde deskundigen, zullen deze, in
      oneven getale, op verzoek van het eerstgenoemde lid der rederij, worden benoemd door de voorzieningenrechter van de
      in het eerste lid genoemde rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel174
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel622
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '174'
  - number: '623'
    text: |-
      Een vonnis verkregen tegen de rederij of tegen de boekhouder als zodanig kan op het gemeenschappelijke vermogen
      van de leden der rederij ten uitvoer worden gelegd en daarnaast voor ieders aandeel op het overige vermogen van die
      leden die ten dage dat de vordering, voor welke beslag wordt gelegd, is ontstaan, leden der rederij waren.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel623
  - number: '624.1'
    text: |-
      Bevoegd tot kennisneming van verzoeken tot goedkeuring als bedoeld in [artikel 1303, vierde lid, van Boek 8 van het
      Burgerlijk Wetboek](onbekend) en tot machtiging tot doorhaling als bedoeld in de [artikelen 195](onbekend), [786]
      (onbekend) of [1304 van Boek 8 van het Burgerlijk Wetboek](onbekend) zijn de rechtbank van de woonplaats, bedoeld
      in de [artikelen 194, zesde lid](onbekend), [784, zevende lid](onbekend), of [1303, zesde lid, van Boek 8 van het
      Burgerlijk Wetboek](onbekend), alsmede de rechtbank van de plaats waar het in de artikelen 193, 783 of [1302 van
      Boek 8 van dat Wetboek](onbekend) genoemde register wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel624
  - number: '624.2'
    text: |-
      Machtiging wordt slechts verleend na verhoor of behoorlijke oproeping van degenen van wier recht of beslag uit een
      inschrijving blijkt of te wier gunste voorlopige aantekeningen bestaan. Deze machtiging wordt door de griffier der
      rechtbank op het verzoekschrift aangetekend.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel624
  - number: '624.3'
    text: |-
      De tussenkomst van een procureur is niet vereist bij de verzoeken, bedoeld in de [artikelen 1303, vierde lid]
      (onbekend), of [1304, vierde lid, van Boek 8 van het Burgerlijk Wetboek](onbekend).
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel624
  - number: '625'
    text: |-
      Bevoegd tot kennisneming van verzoeken en vorderingen terzake van scheepshuurkoop is mede de rechtbank van de
      woonplaats als bedoeld in [artikel 784 zevende lid van Boek 8 van het Burgerlijk Wetboek](onbekend).
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel625
  - number: '626.1'
    text: |-
      Een vervoerder kan terzake van het hem verschuldgide conservatoir beslag leggen op onder de vervoerovereenkomst aan
      boord van een schip vervoerde zaken gedurende één maand na de aanvang van de dag, waarop zij niet meer aan boord
      van het schip zijn, zolang niet een derde te goeder trouw en anders dan om niet daarop enig recht heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel626
  - number: '626.2'
    text: |-
      Het beslag wordt gelegd met toepassing van de regels betreffende conservatoir beslag op roerende zaken in handen
      van de schuldenaar. De [artikelen 711, eerste lid][ref1], [461d][ref2] en [708, tweede lid][ref3], zijn op dit
      beslag niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel711
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel461d
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel708
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel626
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '711'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 461d
        afdeling: Eerste
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '708'
        afdeling: Eerste
  - number: '627'
    text: |-
      De aanwijzing van een derde, als bedoeld in [artikel 481 tweede lid][ref1] en
      [artikel 946 tweede lid van Boek 8 van het Burgerlijk Wetboek][ref2] of in enig desbetreffend partijbeding,
      geschiedt ten verzoeke van de meest gerede partij door de voorzieningenrechter van de rechtbank van de plaats, waar
      het daar bedoelde cognossement aan de vervoerder moet worden afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel481
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel946
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel627
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '481'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '946'
  - number: '628'
    text: |-
      Op een verzoek van de vervoerder tot toestemming ten vervoer ontvangen zaken op te slaan, onder zichzelf te houden
      of daarvoor andere maatregelen te treffen wordt beslist door de voorzieningenrechter van de rechtbank, binnen
      welker rechtsgebied de zaken zich bevinden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel628
  - number: '629.1'
    text: |-
      Bevoegd tot het kennis nemen van geschillen tussen een vervoerder en een ontvanger, die niet de afzender was,
      inzake overeenkomsten tot vervoer geheel of gedeeltelijk per schip van een buiten Nederland gelegen plaats naar
      een in Nederland gelegen plaats van eindbestemming is de rechter binnen wiens rechtsgebied die plaats in Nederland
      ligt. Onder ontvanger wordt mede begrepen, hij, die een vordering instelt terzake van niet afgeleverde zaken.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel629
  - number: '629.2'
    text: Nietig is ieder beding, waarbij van het eerste lid van dit artikel wordt afgeweken, tenzij zulk een beding
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel629
  - number: 629.2.a
    text: |-
      bevoegd verklaart een rechter van een met name genoemde plaats gelegen op het grondgebied van de staat waarin
      hetzij de vervoerder hetzij de ontvanger woonplaats heeft, dan wel
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel629
  - number: 629.2.b
    text: is neergelegd in een afzonderlijk, niet naar algemene voorwaarden verwijzend geschrift.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel629
  - number: '630'
    text: |-
      Tot het kennisnemen van geschillen als bedoeld in [artikel 31 van het Verdrag betreffende de overeenkomst tot
      internationaal vervoer van goederen over de weg](onbekend) is mede bevoegd de rechtbank van de plaats van in
      ontvangstneming der zaken of van de plaats bestemd voor de aflevering der zaken.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel630
  - number: '631'
    text: |-
      Geschillen naar aanleiding van het stellen, aanvullen of vervangen van zekerheid als bedoeld in de [artikelen
      30](onbekend), [69](onbekend), [489](onbekend), [954](onbekend) en [1131 van Boek 8 van het Burgerlijk Wetboek]
      (onbekend) worden ten verzoeke van de meest gerede partij beslist door de voorzieningenrechter van de rechtbank,
      binnen welker rechtsgebied de aflevering plaatsvindt of moet plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel631
  - number: '632.1'
    text: |-
      Op een verzoek tot machtiging ten vervoer ontvangen zaken te verkopen wordt beslist door de voorzieningenrechter
      van de rechtbank, binnen welker rechtsgebied de zaken zich bevinden. De verzoeker is verplicht bij zijn verzoek aan
      te geven op welke wijze of wijzen de zaken kunnen worden verkocht.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel632
  - number: '632.2'
    text: |-
      De voorzieningenrechter van de rechtbank zal op verzoek van de meest gerede partij in zijn beschikking bepalen dat,
      en zo ja, op welke wijze de opbrengst van het verkochte of een gedeelte daarvan zal strekken tot zekerheid voor nog
      niet vaststaande vorderingen van de vervoerder.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel632
  - number: '633.1'
    text: |-
      Op een verzoek tot gerechtelijk onderzoek als bedoeld in de [artikelen 494](onbekend), [495](onbekend), [959]
      (onbekend), [960](onbekend) en [1135 van Boek 8 van het Burgerlijk Wetboek](onbekend) wordt beslist door de
      voorzieningenrechter van de rechtbank binnen welker rechtsgebied de zaken zich bevinden. Deze wijst daarbij hetzij
      één, hetzij drie deskundigen aan en bepaalt op welke wijze dezen de wederpartij van de verzoeker zullen oproepen
      bij het onderzoek aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel633
  - number: '633.2'
    text: |-
      Op een verzoek van de in het eerste lid bedoelde aanvrager tot het geheel of gedeeltelijk ten laste van zijn
      wederpartij brengen van de kosten van het onderzoek of de begroting als daar bedoeld, dan wel van de door dat
      onderzoek geleden schade, wordt beslist door de in dat lid genoemde rechter.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel633
  - number: '635'
    text: |-
      In zaken van aanvaring of van een voorval als bedoeld in [artikel 541 van Boek 8 van het Burgerlijk Wetboek]
      (onbekend), is mede bevoegd de rechter van de plaats waar het schip van de verweerder in het in [artikel 193]
      (onbekend) of [artikel 783 van Boek 8 van het Burgerlijk Wetboek](onbekend) genoemde register te boek staat.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel635
  - number: '636.1'
    text: |-
      Een hulpverlener kan terzake van het hem uit hoofde van hulpverlening verschuldigde conservatoir beslag leggen op
      zaken, waaraan hulp is verleend doch die niet meer aan boord van het schip zijn, zolang niet een derde te goeder
      trouw en anders dan om niet daarop enig recht heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel636
  - number: '636.2'
    text: |-
      De in dit artikel bedoelde beslagen kunnen niet worden gelegd op zaken die zich onder beheer van de strandvonder
      bevinden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel636
  - number: '636.3'
    text: |-
      Tenzij het een schip betreft dat niet onder [artikel 573][ref1] valt, wordt het beslag gelegd met
      toepassing van de regels betreffende conservatoir beslag op roerende zaken in handen van de schuldenaar. De
      [artikelen 711, eerste lid][ref2], [461d][ref3] en [708, tweede lid][ref4], zijn op dit beslag niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel573
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel711
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel461d
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel708
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel636
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '573'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '711'
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 461d
        afdeling: Eerste
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '708'
        afdeling: Eerste
  - number: '637.1'
    text: |-
      In zaken van hulpverlening is [artikel 635][ref1] van overeenkomstige toepassing en is voorts mede bevoegd de
      rechter binnen het rechtsgebied van wie de hulp is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel635
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel637
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '635'
        afdeling: Eerste
  - number: '637.2'
    text: |-
      Betreft de zaak een verzoek als bedoeld in [afdeling 2 van titel 6 van Boek 8 van het Burgerlijk Wetboek][ref1]
      of een geschil met betrekking tot de zekerheid als bedoeld in [artikel 568 van dat Boek][ref2], dan is bevoegd de
      voorzieningenrechter van de bevoegde rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel568
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel637
    references:
      - id: ref1
        bwb_id: BWBR0005034
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '568'
  - number: '638.1'
    text: |-
      Indien zich naar zijn mening een geval van avarij-grosse voordeed, is de eigenaar van het schip en in geval van
      rompbevrachting de rompbevrachter, verplicht met inachtneming van het derde lid van dit artikel binnen redelijke
      termijn na het einde van de onderneming een persoon (dispacheur) aan te wijzen ter berekening van de avarij-grosse
      en ter vaststelling van hen die recht hebben op vergoedingen en van hen te wier laste de bijdragen in de avarij-
      grosse komen. Hij is verplicht van deze aanwijzing tijdig mededeling te doen aan hen die naar zijn mening in de
      avarij-grosse moeten bijdragen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel638
  - number: '638.2'
    text: |-
      Indien de in het eerste lid genoemde verplichting niet is nagekomen, is ieder die van mening is recht te
      hebben op een vergoeding in avarij-grosse danwel in een avarij-grosse te zullen moeten bijdragen, bevoegd de
      voorzieningenrechter van de rechtbank, binnen welker rechtsgebied de onderneming eindigde, te verzoeken de
      dispacheur te benoemen. Gelijke bevoegdheid komt toe aan ieder die zich niet kan verenigen met de ingevolge het
      eerste lid aangewezen dispacheur.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel638
  - number: '638.3'
    text: |-
      Tenzij de in het tweede lid bedoelde belanghebbenden anders overeenkomen, moet de dispacheur kantoorhouden in,
      danwel zo dicht mogelijk bij, de plaats waar de onderneming eindigde. Ligt deze plaats in Nederland dan moet de
      dispacheur in Nederland kantoor houden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel638
  - number: '639.1'
    text: |-
      De belanghebbenden bij de avarij-grosse zijn verplicht de dispacheur iedere inlichting en alle documenten, die hij
      ter opstelling van de dispache vraagt, te doen toekomen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel639
  - number: '639.2'
    text: |-
      Indien een partij niet aan de in het eerste lid omschreven verplichting voldoet, is de dispacheur gerechtigd zich
      de noodzakelijke inlichtingen of documenten te verschaffen en deze worden alsdan vermoed juist te zijn.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel639
  - number: '640'
    text: |-
      De dispacheur is bevoegd een door hem ondertekend exemplaar van de dispache ter griffie van de rechtbank te
      Rotterdam te deponeren en is alsdan verplicht, voor zover hem dit redelijkerwijs mogelijk is, alle belanghebbenden,
      onder toezending van een exemplaar der dispache of een uittreksel daarvan, bericht te zenden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel640
  - number: '641'
    text: |-
      Hij, die de hem toegezonden dan wel ter griffie van de rechtbank te Rotterdam gedeponeerde dispache wenst af te
      wikkelen, verzoekt deze rechtbank de dispache te homologeren. Zo dit nog niet is geschied, legt hij een exemplaar
      der dispache of een uittreksel daarvan ter griffie neer.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel641
  - number: 641a.1
    text: |-
      Ieder der in [artikel 638][ref1] bedoelde personen, die zich niet met de hem toegezonden, dan wel ter griffie van
      de rechtbank te Rotterdam gedeponeerde dispache kan verenigen, verzoekt deze rechtbank de dispache te herzien. Zo
      dit nog niet is geschied legt hij een exemplaar der dispache of een uittreksel daarvan ter griffie neer.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel638
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel641a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '638'
        afdeling: Eerste
  - number: 641a.2
    text: Wijst de rechter het in het vorige lid bedoelde verzoek af, dan homologeert hij de dispache.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel641a
  - number: 641b.1
    text: |-
      Gaat de rechter in het geval van [artikel 641][ref1] of [artikel 641a][ref2] niet tot homologatie over dan
      is de dispacheur of een mogelijkerwijs door de rechter aangewezen andere dispacheur verplicht de dispache in
      overeenstemming met de rechterlijke beslissing te wijzigen, dan wel haar in te trekken. In geval van intrekking
      wordt, tenzij de rechter anders beslist, de dispache desalniettemin wat betreft honorarium en kosten van de
      dispacheur gehomologeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel641
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel641a
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel641b
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '641'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 641a
        afdeling: Eerste
  - number: 641b.2
    text: |-
      Gaat de rechter in het geval van [artikel 641][ref1] of [artikel 641a][ref2] tot homologatie over, dan zijn zij die
      de dispache betwistten, hoofdelijk verplicht de belanghebbenden, die niet tot dergelijke betwisting overgingen, de
      tengevolge van de betwisting geleden schade te vergoeden.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel641
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel641a
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel641b
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '641'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 641a
        afdeling: Eerste
  - number: 641c
    text: |-
      Ieder die de dispache betwist, is op verzoek van ieder die dit niet deed, verplicht ten behoeve van deze laatste
      zekerheid te stellen voor de door deze laatste mogelijkerwijs geleden of te lijden schade. Geschillen naar
      aanleiding van het stellen, aanvullen of vervangen van deze zekerheid worden ten verzoeke van de meest gerede
      partij beslist door de voorzieningenrechter van de rechtbank.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel641c
  - number: 641d
    text: |-
      Na het in kracht van gewijsde gaan van een beschikking van homologatie levert de dispache een voor
      tenuitvoerlegging vatbare titel op.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel641d
  - number: '642'
    text: |-
      Tegen een beslissing van de voorzieningenrechter van de rechtbank, gegeven in de gevallen van de
      [artikelen 621 tot en met 641][ref1] staat geen andere voorziening open dan cassatie in het belang van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel621
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '621'
        afdeling: Eerste
  - number: 642a.1
    text: |-
      Wie op grond van [artikel 750](onbekend), [artikel 751](onbekend), [artikel 1060](onbekend) of [artikel 1061 van
      Boek 8 van het Burgerlijk Wetboek](onbekend) een beroep wil doen op beperking van zijn aansprakelijkheid, verzoekt
      de rechtbank van de plaats waar het schip in het in [artikel 193](onbekend) of [artikel 783 van Boek 8 van het
      Burgerlijk Wetboek](onbekend) bedoelde register teboekstaat, dan wel wanneer het schip niet in één dezer registers
      teboekstaat, de rechtbank te Rotterdam, het bedrag of de bedragen waartoe zijn aansprakelijkheid is beperkt (het
      bedrag van het fonds of van de fondsen), vast te stellen en te bevelen dat tot een procedure ter verdeling van een
      te stellen fonds zal worden overgegaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642a
  - number: 642a.2
    text: 'Het verzoek vermeldt:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642a
  - number: 642a.2.a
    text: de naam van het schip;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642a
  - number: 642a.2.b
    text: |-
      wanneer het een zeeschip betreft de nationaliteit daarvan en wanneer het een zeevissersschip of een binnenschip
      betreft zo mogelijk de plaats van het register waarin het teboekstaat;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642a
  - number: 642a.2.c
    text: de naam en de woonplaats van de verzoeker;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642a
  - number: 642a.2.d
    text: |-
      het bedrag dat naar het oordeel van de verzoeker het fonds of de fondsen belopen, en de gegevens noodzakelijk ter
      berekening hiervan;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642a
  - number: 642a.2.e
    text: |-
      de dag en de plaats van het voorval dat aanleiding gaf tot de vorderingen ten aanzien waarvan de verzoeker zijn
      aansprakelijkheid meent te kunnen beperken alsmede een omschrijving daarvan;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642a
  - number: 642a.2.f
    text: |-
      de naam en de woonplaats van de aan de verzoeker bekende personen tegenover wie hij meent zich op beperking van
      zijn aansprakelijkheid te kunnen beroepen met een schatting van het maximum-bedrag van ieders vordering.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642a
  - number: 642a.3
    text: Het indienen van een verzoek als in dit artikel bedoeld, vormt niet een erkenning van aansprakelijkheid.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642a
  - number: 642a.4
    text: |-
      De behandeling geschiedt op de dag en de tijd die door de griffier aan de in het tweede lid onder*f*bedoelde
      personen worden medegedeeld. Bovendien doet de griffier van het verzoek aankondiging in één of meer door de
      rechtbank mogelijkerwijs aan te wijzen nieuwsbladen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642a
  - number: 642b
    text: |-
      Wanneer naar aanleiding van hetzelfde voorval meer dan één op eenzelfde schip betrekking hebbend verzoek als
      bedoeld in [artikel 642a][ref1] is ingediend, beveelt de rechtbank alvorens op deze verzoeken te beslissen,
      tenzij een verzoeker zich daartegen verzet en dit verzet gegrond is bevonden, de voeging van de zaken op één fonds
      betrekking hebbend.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel642a
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642b
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 642a
        afdeling: Tweede
  - number: 642c.1
    text: |-
      Bij de behandeling van het in [artikel 642a][ref1] bedoelde verzoek kan geen beroep worden gedaan op
      [artikel 754][ref2] of artikel [1064 van Boek 8 van het Burgerlijk Wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel642a
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel754
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel1064
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642c
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 642a
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '754'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '1064'
  - number: 642c.2
    text: |-
      Bij toewijzing van het verzoek bepaalt de rechtbank met inachtneming van de [artikelen 755][ref1] en
      [756 van Boek 8 van het Burgerlijk Wetboek][ref2] dan wel de in [artikel 1065 van dat boek][ref3] bedoelde algemene
      maatregel van bestuur het in rekeneenheden uitgedrukte beloop van het fonds of de fondsen. Zij beveelt de verzoeker
      op een door haar te bepalen dag, die niet later kan liggen dan één maand na de dag der beschikking, fonds te
      stellen


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel755
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel756
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel1065
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642c
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '755'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '756'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '1065'
  - number: 642c.2.a
    text: |-
      hetzij door het bedrag van het fonds berekend met inachtneming van de [artikelen 755][ref1], [756][ref2] en
      [759 van Boek 8 van het Burgerlijk Wetboek][ref3] of van de in [artikel 1065 van dat boek][ref4] bedoelde algemene
      maatregel van bestuur, vermeerderd met de wettelijke rente ingevolge [artikel 757][ref5] of die algemene maatregel
      van bestuur alsmede vermeerderd met een bedrag ter bestrijding van de kosten der procedure in de consignatiekas
      te storten,


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel755
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel756
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel759
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel1065
      [ref5]: https://wetten.overheid.nl/BWBR0005034#Artikel757
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642c
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '755'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '756'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '759'
      - id: ref4
        bwb_id: BWBR0005034
        artikel: '1065'
      - id: ref5
        bwb_id: BWBR0005034
        artikel: '757'
  - number: 642c.2.b
    text: |-
      hetzij door op andere door haar bepaalde wijze zekerheid te stellen ten belope van het onder a genoemde bedrag,
      alsnog vermeerderd met de wettelijke rente daarover van de aanvang van de dag volgende op de dag van deze laatst
      bedoelde zekerheidsstelling tot de aanvang van de dag waarop de griffier de in [artikel 642v][ref1] bedoelde oproep
      doet uitgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel642v
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642c
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 642v
        afdeling: Tweede
  - number: 642c.3
    text: |-
      De rechtbank wijst een rechter-commissaris aan ter vaststelling van de staat van verdeling van het fonds of de
      fondsen en benoemt tevens een vereffenaar hiervan. Wanneer zij daartoe termen aanwezig acht, kan zij voor ieder
      fonds meer dan één vereffenaar benoemen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642c
  - number: 642c.4
    text: |-
      Het fonds wordt gesteld ten name van de benoemde rechter-commissaris en vereffenaar, die daarover met uitsluiting
      van de verzoeker, doch slechts gezamenlijk, kunnen beschikken.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642c
  - number: 642c.5
    text: |-
      De beschikking van de rechtbank is uitvoerbaar bij voorraad. De werking van de beschikking kan door de hogere
      rechter niet worden geschorst.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642c
  - number: 642c.6
    text: |-
      De verzoeker die aan het bevel der rechtbank heeft voldaan, richt zich onverwijld tot haar met het verzoek dit te
      verklaren. Indien de rechtbank deze verklaring weigert, kan zij de verzoeker een hernieuwd bevel tot het stellen
      van fonds geven op een door haar te bepalen dag die niet later kan liggen dan één maand na de dag der beschikking.
      De verzoeker die aan dit hernieuwde bevel der rechtbank heeft voldaan, richt zich wederom tot haar met het verzoek
      dit te verklaren. De tweede zin van dit lid is alsdan niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642c
  - number: 642c.7
    text: |-
      De verzoeker ten aanzien van wie de rechtbank geen verklaring als in het zesde lid bedoeld heeft gegeven, kan
      zijn aansprakelijkheid niet meer op grond van [artikel 750][ref1], [artikel 751][ref2], [artikel 1060][ref3] of
      [artikel 1061 van Boek 8 van het Burgerlijk Wetboek][ref4] beperken.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel750
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel751
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel1060
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel1061
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642c
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '750'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '751'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '1060'
      - id: ref4
        bwb_id: BWBR0005034
        artikel: '1061'
  - number: 642c.8
    text: |-
      Op de voldoening aan een bevel tot storting of andere zekerheidsstelling als bedoeld in dit
      artikel zijn de [artikelen 45 tot en met 48 van Boek 3 van het Burgerlijk Wetboek][ref1] en de
      [artikelen 42 tot en met 49 van de Faillissementswet][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel42
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642c
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '45'
      - id: ref2
        bwb_id: BWBR0001860
        artikel: '42'
  - number: 642d
    text: |-
      Indien terzake van één en hetzelfde voorval een fonds is gesteld door één der personen of zijn verzekeraar genoemd
      in
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642d
  - number: 642d.a
    text: |-
      [artikel 758, eerste lid, onder a][ref1], of
      [artikel 1066, eerste lid, onder a, van Boek 8 van het Burgerlijk Wetboek][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel758
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1066
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642d
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '758'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1066'
  - number: 642d.b
    text: |-
      [artikel 758, eerste lid, onder b][ref1], of
      [artikel 1066, eerste lid, onder b, van Boek 8 van het Burgerlijk Wetboek][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel758
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1066
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642d
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '758'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1066'
  - number: 642d.c
    text: |-
      [artikel 758, eerste lid, onder c][ref1], of
      [artikel 1066, eerste lid, onder c, van Boek 8 van het Burgerlijk Wetboek][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel758
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1066
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642d
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '758'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1066'
  - number: 642d.d
    text: |-
      [artikel 758, tweede lid][ref1], of [artikel 1066, tweede lid, van Boek 8 van het Burgerlijk Wetboek](onbekend),


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1066
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642d
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1066'
  - number: 642e.1
    text: |-
      Indien na toewijzing van een op [artikel 750][ref1] of [artikel 751 van Boek 8 van het Burgerlijk Wetboek][ref2]
      gegrond verzoek geen der schuldeisers binnen de in [artikel 642g][ref3] genoemde termijn betwist heeft, dat
      de schuldenaar zijn aansprakelijkheid kan beperken, dan wel omtrent een zodanige betwisting onherroepelijk
      afwijzend is beslist en een fonds is gesteld ten aanzien waarvan de rechtbank een verklaring als bedoeld in
      [het zesde lid van artikel 642c][ref4] heeft afgegeven en dat werkelijk ten bate van de schuldeiser beschikbaar is
      alsmede de schuldeiser zijn vordering op het fonds in rechte geldend kan maken, kan de rechter op verzoek van hem
      te wiens behoeve het fonds is gesteld de opheffing van beslagen die ter zake van de vorderingen waarvoor het fonds
      is gesteld, zijn gelegd, dan wel de teruggave van te dier zake gegeven zekerheid bevelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel750
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel751
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel642g
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel642c
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642e
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '750'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '751'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 642g
        afdeling: Tweede
      - id: ref4
        bwb_id: BWBR0001827
        artikel: 642c
        afdeling: Tweede
  - number: 642e.2
    text: |-
      Indien aan de in het eerste lid gestelde vereisten is voldaan, zal de rechter op een verzoek als in het eerste lid
      bedoeld een bevel als in dat lid bedoeld geven, wanneer het fonds is gesteld
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642e
  - number: 642e.2.a
    text: |-
      in de haven waar het ongeval waaruit aansprakelijkheid is voortgevloeid, plaats vond, of wanneer dit ongeval niet
      in een haven plaats vond, in de eerste haven welke het schip daarna aanliep, of
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642e
  - number: 642e.2.b
    text: |-
      in de haven van ontscheping van de betrokken persoon, indien de schade is voortgevloeid uit dood of letsel van
      personen, of
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642e
  - number: 642e.2.c
    text: met betrekking tot beschadigde lading in de haven van lossing, of
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642e
  - number: 642e.2.d
    text: in de Staat waarin het beslag is gelegd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642e
  - number: 642e.3
    text: |-
      Het eerste of tweede lid van dit artikel vindt slechts toepassing indien het fonds aan de schuldeiser, wat zijn
      vordering betreft, vrij kan worden overgemaakt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642e
  - number: 642e.4
    text: |-
      Indien ten aanzien van een op [artikel 1060][ref1] of [artikel 1061 van Boek 8 van het Burgerlijk Wetboek][ref2]
      gegrond verzoek aan de in het eerste lid gestelde vereisten is voldaan, geeft de rechtbank op een verzoek als in
      het eerste lid bedoeld een bevel als in dat lid bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1060
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1061
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642e
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1060'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1061'
  - number: 642f.1
    text: |-
      Indien aan de in [artikel 642][ref1] gestelde vereisten is voldaan, worden procedures terzake van vorderingen
      waarvoor het fonds is gesteld, geschorst door betekening overeenkomstig [artikel 256][ref2], ook al waren deze
      reeds in staat van wijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel642e
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel256
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642f
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 642e
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '256'
        afdeling: Veertiende
  - number: 642f.2
    text: |-
      Behoudens de gevallen bedoeld in het derde lid wordt na schorsing van een hangende procedure het geding op verzoek
      van de meest gerede partij van de rol afgevoerd, wanneer
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642f
  - number: 642f.2.a
    text: |-
      het verzoek van de schuldeiser tot verificatie als bedoeld in [artikel 642][ref1] is afgewezen of


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel642l
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642f
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 642l
        afdeling: Tweede
  - number: 642f.2.b
    text: |-
      de staat van verdeling bedoeld in [artikel 642][ref1]op de in dat artikel genoemde wijze is vastgesteld of


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel642v
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642f
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 642v
        afdeling: Tweede
  - number: 642f.2.c
    text: |-
      de vordering van de schuldeiser ingevolge [artikel 642][ref1] is tenietgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel642w
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642f
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 642w
        afdeling: Tweede
  - number: 642f.3
    text: Het geschorste geding wordt hervat, indien
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642f
  - number: 642f.3.a
    text: alsnog onherroepelijk wordt beslist dat de schuldenaar zijn aansprakelijkheid niet kan beperken of
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642f
  - number: 642f.3.b
    text: |-
      in een der in het tweede lid bedoelde gevallen de schuldenaar de veroordeling van de schuldeiser in de kosten van
      het geding vordert.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642f
  - number: 642f.4
    text: |-
      Blijft een beroep op schorsing als bedoeld in het eerste lid van dit artikel achterwege, dan verliest een
      schuldenaar de bevoegdheid jegens de betrokken schuldeiser beroep te doen op zijn beperkte aansprakelijkheid.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642f
  - number: 642f.5
    text: |-
      Op de schorsing en de hervatting van het geding zijn de [artikelen 255 tot en met 262][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel255
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642f
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '255'
        afdeling: Veertiende
  - number: 642g.1
    text: |-
      Nadat de in [artikel 642][ref1], bedoelde verklaring is afgegeven bepaalt de rechter-commissaris, de vereffenaar
      gehoord hebbend, zo spoedig mogelijk de dag waarop uiterlijk de vorderingen op de schuldenaar, alsmede de
      betwistingen van diens beroep op beperking van zijn aansprakelijkheid hetzij ten aanzien van alle, hetzij ten
      aanzien van één of meer der schuldeisers bij de vereffenaar moeten worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel642c
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642g
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 642c
        afdeling: Tweede
  - number: 642g.2
    text: |-
      De rechter-commissaris bepaalt, de vereffenaar gehoord hebbend, tevens de dag of de dagen met bepaling van tijd
      en plaats, waarop door hem zal worden overgegaan tot verificatie van de ingediende vorderingen en behandeling van
      betwistingen van het beroep op beperking van aansprakelijkheid. Deze dagen, tijden en plaatsen kunnen voor elk der
      fondsen alsmede voor één dezer fondsen verschillend zijn.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642g
  - number: 642g.3
    text: |-
      Tussen de in het eerste lid genoemde dag voor de indiening der vorderingen en het verrichten van betwistingen als
      in dat lid bedoeld en de dag der verificatiezitting of de zitting waarop deze betwistingen zullen worden behandeld,
      moeten tenminste acht weken verlopen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642g
  - number: 642h
    text: |-
      Indien een schuldenaar aantoont, dat hij op een later tijdstip niettegenstaande
      [het eerste lid van artikel 642f][ref1] gedwongen zou kunnen worden geheel of gedeeltelijk een bedrag te betalen
      waarvoor hij, als hij dit bedrag vóór de verdeling van het fonds had betaald, op grond van [artikel 642j][ref2] in
      de rechten van de schuldeiser zou zijn gesubrogeerd, kan de rechter-commissaris gelasten, dat voorlopig een bedrag
      zal worden terzijde gesteld, dat voldoende is om het de schuldenaar mogelijk te maken op dat latere tijdstip zijn
      rechten overeenkomstig [artikel 642j][ref3] geldend te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel642f
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel642j
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel642j
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642h
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 642f
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 642j
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 642j
        afdeling: Tweede
  - number: 642i
    text: |-
      De vereffenaar geeft van de beschikkingen genoemd in [artikel 642g][ref1] onverwijld bij aangetekende brief kennis
      aan de schuldenaar of de schuldenaren en de door dezen opgegeven schuldeisers. Bovendien doet hij, indien de
      rechter-commissaris zulks beveelt, van deze beschikkingen aankondiging in één of meer door de rechter-commissaris
      mogelijkerwijs aan te wijzen nieuwsbladen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel642g
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642i
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 642g
        afdeling: Tweede
  - number: 642j
    text: |-
      Een bedrag dat een schuldenaar of diens verzekeraar vóór de verdeling van een fonds heeft betaald, kan door hem
      niet geheel of gedeeltelijk worden teruggevorderd; hij wordt voor het betaalde bedrag van rechtswege gesubrogeerd
      in de rechten van de schuldeiser.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642j
  - number: 642k
    text: |-
      De schuldeiser die tegen het verzoek van een schuldenaar verweer voert, moet niettemin zijn vordering ter
      verificatie aanmelden. Hetzelfde geldt ten aanzien van een schuldeiser die twijfelt of de schuldenaar gezien de
      aard van de vordering met betrekking tot deze vordering jegens hem een beroep kan doen op de beperking van zijn
      aansprakelijkheid.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642k
  - number: 642l.1
    text: |-
      De indiening der schuldvorderingen geschiedt bij de vereffenaar door de overlegging van een rekening of andere
      schriftelijke verklaring aangevende de aard en het bedrag der vordering vergezeld van de bewijsstukken of een
      afschrift daarvan. De in de [tweede zin van artikel 642k][ref1] bedoelde schuldeiser legt bovendien over een
      schriftelijke verklaring bevattende de gronden van zijn daar bedoelde twijfel.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel642k
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642l
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 642k
        afdeling: Tweede
  - number: 642l.2
    text: |-
      Indiening van een vordering ter verificatie wordt ten aanzien van verjaring en verval aangemerkt als het in rechte
      instellen van deze vordering.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642l
  - number: 642l.3
    text: De schuldeisers zijn bevoegd van de vereffenaar een ontvangstbewijs te vorderen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642l
  - number: 642l.4
    text: |-
      De vereffenaar toetst de ingezonden rekeningen aan de administratie en opgaven van de schuldenaar, treedt, als hij
      tegen de toelating van een vordering bezwaar heeft, met de schuldeiser en de schuldenaar of schuldenaren in overleg
      en is bevoegd van dezen overlegging van ontbrekende stukken alsook raadpleging van hun administratie en van de
      oorspronkelijke bewijsstukken te vorderen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642l
  - number: 642l.5
    text: |-
      Voor ieder fonds brengt de vereffenaar de vorderingen die hij goedkeurt op een lijst van voorlopig erkende
      schuldvorderingen en de vorderingen die hij betwist, op een afzonderlijke lijst vermeldende de gronden der
      betwisting.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642l
  - number: 642l.6
    text: |-
      De door de vereffenaar opgestelde lijsten liggen gedurende ten minste 21 dagen vóór de dag, voor de verificatie
      bestemd, ter griffie ter kosteloze inzage voor ieder. De nederlegging geschiedt kosteloos.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642l
  - number: 642l.7
    text: |-
      De vereffenaar vermeldt de verweerschriften ingediend tegen het verzoek door een schuldenaar gedaan vermeldende de
      gronden der betwisting.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642l
  - number: 642m
    text: |-
      Van de krachtens [artikel 642l][ref1] gedane nederlegging der lijsten geeft de vereffenaar aan alle bekende
      schuldeisers en de schuldenaar of schuldenaren schriftelijk bericht, waarbij hij een nadere oproeping tot de
      verificatievergadering voegt.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel642l
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642m
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 642l
        afdeling: Tweede
  - number: 642n
    text: |-
      Op de ingevolge [artikel 642g][ref1] bepaalde dag of dagen houdt de rechter-commissaris in tegenwoordigheid van de
      vereffenaar één of meer zittingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel642g
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642n
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 642g
        afdeling: Tweede
  - number: 642o.1
    text: |-
      Vorderingen ingediend na afloop van de in [het eerste lid van artikel 642g][ref1] genoemde termijn kunnen op
      verzoek van de schuldeiser door de rechter-commissaris tot de verificatie worden toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel642g
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642o
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 642g
        afdeling: Tweede
  - number: 642o.2
    text: |-
      Een dergelijk verzoek moet worden toegestaan, indien de schuldeiser buiten Nederland woont en daardoor verhinderd
      was zich eerder te melden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642o
  - number: 642o.3
    text: |-
      In geval van geschil over het al dan niet aanwezig zijn der verhindering in het tweede lid bedoeld beslist de
      rechter-commissaris na de vergadering te hebben geraadpleegd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642o
  - number: 642p.1
    text: Alle schuldeisers en schuldenaren kunnen een vordering betwisten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642p
  - number: 642p.2
    text: Vorderingen die niet worden betwist, worden door de rechter-commissaris vastgesteld op het beweerde bedrag.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642p
  - number: 642p.3
    text: |-
      Van de vaststelling door de rechter-commissaris geschiedt aantekening in het proces-verbaal ter zitting en op de
      door de vereffenaar opgestelde lijst.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642p
  - number: 642q.1
    text: |-
      In geval van betwisting ter zitting van een vordering of van het beroep op beperking van aansprakelijkheid verwijst
      de rechter-commissaris partijen en de schuldenaar, indien hij hen niet kan verenigen, naar een of meer door hem te
      bepalen terechtzittingen van de rechtbank ter beslissing van het punt van geschil. De rechter-commissaris verwijst
      ook de in [de tweede zin van artikel 642k ][ref1]bedoelde schuldeiser wiens vordering overigens niet wordt betwist,
      naar de terechtzitting der rechtbank ter beslissing van de vraag of zijn vordering terecht ter verificatie werd
      ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel642k
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642q
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 642k
        afdeling: Tweede
  - number: 642q.2
    text: |-
      Indien een schuldeiser wiens vordering betwist wordt, of indien een schuldenaar niet ter zitting aanwezig is, geeft
      de vereffenaar hem onmiddellijk per aangetekende brief kennis van iedere verwijzing.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642q
  - number: 642r.1
    text: |-
      Verschijnt de schuldeiser die de verificatie vraagt, niet ter terechtzitting van de rechtbank, dan wordt hij geacht
      zijn vordering voor zover zij betwist is, te hebben ingetrokken.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642r
  - number: 642r.2
    text: |-
      Verschijnt hij die een betwisting van enige stelling van een schuldenaar of schuldeiser deed, niet, dan wordt hij
      geacht deze betwisting te hebben laten varen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642r
  - number: 642r.3
    text: |-
      De in [het tweede lid van artikel 642q][ref1] genoemde personen kunnen zich in het geding niet op het ontbreken van
      de daar bedoelde kennisgeving beroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel642q
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642r
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 642q
        afdeling: Tweede
  - number: 642r.4
    text: |-
      Schuldeisers die bij de indiening van hun vordering, noch ter vergadering, betwisting hebben gedaan, kunnen
      in het geding zich voegen noch tussenkomen; tussenkomst kan in geval van faillissement van een schuldenaar
      worden gevorderd door de curator in dat faillissement of, ingeval van toepassing van de schuldsaneringsregeling
      natuurlijke personen, door de bewindvoerder.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642r
  - number: 642r.5
    text: |-
      Een onherroepelijke beslissing inhoudende dat een schuldenaar zijn aansprakelijkheid ten opzichte van één of
      meer vorderingen niet kan beperken, heeft bindende kracht zowel jegens een schuldenaar als in geval van diens
      faillissement of toepassing ten aanzien van hem van de schuldsaneringsregeling natuurlijke personen jegens zijn
      schuldeisers.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642r
  - number: 642s.1
    text: |-
      Na afloop van de in [artikel 642n][ref1] bedoelde zittingen of, indien deze tot geschillen aanleiding hebben
      gegeven, nadat daarover onherroepelijk is beslist, wordt door de vereffenaar een staat van verdeling van het
      betrokken fonds opgemaakt en aan de goedkeuring van de rechter-commissaris onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel642n
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642s
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 642n
        afdeling: Tweede
  - number: 642s.2
    text: |-
      Indien onherroepelijk is beslist, dat de schuldenaar zijn aansprakelijkheid niet kan beperken, vervalt de gestelde
      zekerheid en wordt een gestort bedrag uitgekeerd aan hem die de storting verrichtte doch niet eerder dan één maand
      nadat het vonnis in kracht van gewijsde is gegaan en de vereffenaar op de in [artikel 642i][ref1] voorgeschreven
      wijze kennis heeft gegeven van de dag waarop deze uitkering zal plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel642i
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642s
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 642i
        afdeling: Tweede
  - number: 642t.1
    text: |-
      Vorderingen waarvan de waarde niet in Nederlands geld is uitgedrukt, worden geverifieerd voor hun geschatte waarde
      in Nederlands geld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642t
  - number: 642t.2
    text: |-
      Indien de schuldenaar gebruik maakte van de hem hetzij in [artikel 750][ref1] of [artikel 751][ref2] hetzij in
      [artikel 1060][ref3] of [artikel 1061 van Boek 8 van het Burgerlijk Wetboek][ref4] gegeven bevoegdheid zijn de
      volgende regels van toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel750
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel751
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel1060
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel1061
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642t
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '750'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '751'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '1060'
      - id: ref4
        bwb_id: BWBR0005034
        artikel: '1061'
  - number: 642t.2.a
    text: het personenfonds wordt aangewend ter voldoening van vorderingen betreffende personenschade;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642t
  - number: 642t.2.b
    text: het passagiersfonds wordt aangewend ter voldoening van vorderingen betreffende personenschade van reizigers;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642t
  - number: 642t.2.c
    text: |-
      het zakenfonds wordt aangewend ter voldoening van vorderingen betreffende zaakschade en van vorderingen betreffende
      personenschade voor zover deze nog onvoldaan mochten zijn na toepassing van de onder a genoemde regel;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642t
  - number: 642t.2.d
    text: |-
      het wrakkenfonds wordt aangewend ter voldoening van vorderingen als bedoeld in
      [artikel 752, eerste lid, onder d of e, van Boek 8 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel752
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642t
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '752'
  - number: 642t.2.e
    text: |-
      het waterverontreinigingsfonds wordt aangewend ter voldoening van vorderingen terzake van kosten en
      schadevergoedingen verschuldigd voor waterverontreiniging als bedoeld in de algemene maatregel van bestuur ter
      uitvoering van [artikel 1065 van Boek 8 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1065
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642t
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1065'
  - number: 642t.2.f
    text: |-
      indien een volgens de onder a tot en met e genoemde regels te verdelen bedrag niet voldoende is ter voldoening van
      de vorderingen waartoe het volgens deze regels wordt aangewend, worden deze vorderingen in evenredigheid gekort.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642t
  - number: 642t.3
    text: |-
      Voor de toepassing van het tweede lid wordt onder personenschade verstaan alle schade voortspruitende uit dood of
      letsel van personen en onder zaakschade alle schade, die niet is personenschade.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642t
  - number: 642t.4
    text: |-
      Onder voorbehoud van het in het tweede lid, onder *c*, bepaalde is ieder fonds uitsluitend bestemd voor de
      voldoening van de vorderingen met betrekking waartoe het is gesteld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642t
  - number: 642u.1
    text: |-
      Een door de rechter-commissaris goedgekeurde staat van verdeling van het beschikbare fonds ligt gedurende 14 dagen
      ter griffie van de rechtbank ter kosteloze inzage van de schuldeisers wier vorderingen zijn erkend, en van de
      schuldenaren. De nederlegging geschiedt kosteloos.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642u
  - number: 642u.2
    text: |-
      Van de nederlegging wordt door de vereffenaar aankondiging gedaan op de wijze voorgeschreven in
      [artikel 642i][ref1], terwijl daarvan bovendien bij aangetekende brief kennis wordt gegeven aan de schuldenaren
      en aan ieder der schuldeisers wier vorderingen zijn erkend met vermelding van het voor hen uitgetrokken bedrag;
      ieder van hen kan gedurende de genoemde termijn bij de rechtbank tegen de staat van verdeling in verzet komen door
      indiening van een met redenen omkleed bezwaarschrift ter griffie.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel642i
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642u
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 642i
        afdeling: Tweede
  - number: 642u.3
    text: |-
      Na afloop van de termijn geeft de rechtbank haar beschikking, nadat zij de schuldeisers en de schuldenaren heeft
      gehoord of behoorlijk doen oproepen. De oproeping geschiedt bij aangetekende brief door de vereffenaar.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642u
  - number: 642v.1
    text: |-
      Nadat een staat van verdeling door de rechter-commissaris of, indien tijdig verzet is gedaan, door de rechtbank
      is vastgesteld, roept de griffier bij aangetekende brief de schuldeisers op het hun toekomende bedrag in ontvangst
      te nemen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642v
  - number: 642v.2
    text: De staat ligt na de vaststelling ter griffie ter kosteloze inzage van belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642v
  - number: 642v.3
    text: |-
      Een nog bestaand batig saldo en uitkeringen waarover niet binnen één jaar is beschikt, worden uitgekeerd aan hem
      die de storting verrichtte. [Artikel 642][ref1], is daarbij van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel642s
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642v
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 642s
        afdeling: Tweede
  - number: 642w
    text: |-
      Behoudens [het vierde lid van artikel 642f ][ref1] gaan de vorderingen van schuldeisers die, hoewel daartoe
      behoorlijk opgeroepen zijnde, deze niet ter verificatie hebben aangemeld, door het in kracht van gewijsde gaan van
      de staat van verdeling teniet.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel642f
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642w
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 642f
        afdeling: Tweede
  - number: 642x.1
    text: |-
      De rechter-commissaris is bevoegd te allen tijde een voorlopige staat van verdeling vast te stellen. In dat geval
      zijn de [artikelen 642][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel642s
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642x
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 642s
        afdeling: Tweede
  - number: 642x.2
    text: |-
      De rechter-commissaris kan bevelen, dat door schuldeisers aan wie op grond van een voorlopige staat van verdeling
      een uitkering wordt gedaan, een door hem aan te wijzen vorm van zekerheid wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642x
  - number: 642y.1
    text: |-
      De beschikkingen van de rechter-commissaris alsmede die van de rechtbank krachtens [artikel 642][ref1], zijn niet
      vatbaar voor hoger beroep, noch voor beroep in cassatie.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel642u
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642y
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 642u
        afdeling: Tweede
  - number: 642y.2
    text: |-
      Tegen de andere uitspraken, waartoe de [artikelen 642][ref1] aanleiding geven, kan door de schuldenaar en door de
      verschenen schuldeisers binnen vier weken na de dag der uitspraak hoger beroep worden ingesteld, tenzij krachtens
      enige algemene regeling een kortere termijn van toepassing is. Dezelfde termijn geldt voor het beroep in cassatie.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel642a
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642y
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 642a
        afdeling: Tweede
  - number: 642y.3
    text: |-
      Indien een rechtsmiddel wordt ingesteld, moet daarvan bij exploit worden kennis gegeven aan de griffier der
      rechtbank.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642y
  - number: 642y.4
    text: |-
      De uitspraak op het rechtsmiddel wordt door de griffier van het betrokken rechtscollege onverwijld medegedeeld aan
      de griffier der rechtbank, die daarvan bij aangetekende brief aan schuldeisers en schuldenaren kennis geeft.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642y
  - number: 642z
    text: |-
      Behoudens de toepassing van de tweede paragraaf van de twaalfde afdeling van de tweede titel van het eerste boek
      komen de kosten voortvloeiende uit de toepassing van de [artikelen 642][ref1] ten laste van de schuldenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel642a
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel642z
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 642a
        afdeling: Tweede
  - number: '658.1'
    text: |-
      Zaken die tot een nalatenschap of een gemeenschap waarop
      [afdeling 2 van titel 7 van Boek 3 van het Burgerlijk Wetboek][ref1] van toepassing is behoren kunnen worden
      verzegeld met verlof van de kantonrechter in wiens rechtsgebied de verzegeling moet plaatsvinden. De verzegeling
      geschiedt door een bij dit verlof aan te wijzen notaris met diens zegel. Tegen het verlof is geen hogere
      voorziening toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel658
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: '658.2'
    text: De notaris kan een bewaarder van de gelegde zegels aanstellen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel658
  - number: '659'
    text: |-
      De [artikelen 444][ref1], [444a][ref2] en [444b, tweede en derde lid][ref3], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel444
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel444a
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel444b
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel659
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '444'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 444a
        afdeling: Eerste
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 444b
        afdeling: Eerste
  - number: '660.1'
    text: 'Verlof tot verzegeling kan worden verzocht:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel660
  - number: 660.1.1°
    text: |-
      door hem die de nalatenschap kan opeisen of als deelgenoot of beperkt gerechtigde op een aandeel van de gemeenschap
      verdeling daarvan kan vorderen;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel660
  - number: 660.1.2°
    text: |-
      zo zich onder 1° bedoelde personen onbekwamen bevinden, die geen wettelijke vertegenwoordiger hebben, of, indien
      deze afwezig is, door een bloed- of aanverwant van de onbekwame;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel660
  - number: 660.1.3°
    text: 'in geval van een nalatenschap:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel660
  - number: 660.1.3°.a
    text: |-
      mede door de overgebleven echtgenoot of de overgebleven partner bij een geregistreerd partnerschap of door een
      executeur van de nalatenschap;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel660
  - number: 660.1.3°.b
    text: |-
      zo noch de onder *a* bedoelde personen, noch een der erfgenamen aanwezig mocht zijn, door een dergenen die in
      dienst van de overledene waren of met hem samenwoonden;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel660
  - number: 660.1.3°.b
    text: 'zo de nalatenschap onder bewind staat: door de bewindvoerder;'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel660
  - number: 660.1.4°
    text: |-
      door een schuldeiser van de nalatenschap of gemeenschap, doch alleen indien hij zonder de verzegeling ernstig
      gevaar zou lopen zijn vordering niet te kunnen verhalen;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel660
  - number: 660.1.5°
    text: door een door de rechter benoemde vereffenaar van de nalatenschap of gemeenschap.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel660
  - number: '660.2'
    text: |-
      Het verlof wordt slechts gegeven, indien de verzoeker zijn recht of bevoegdheid en een voldoende ernstig belang bij
      de verzegeling summierlijk aannemelijk maakt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel660
  - number: '661'
    text: |-
      Indien in geval van een nalatenschap een der in [artikel 660, eerste lid onder 1°][ref1], bedoelde personen
      afwezig of onbekwaam is, en geen wettelijke vertegenwoordiger heeft of deze afwezig is, kan het verlof tot
      verzegeling ook door een notaris worden verzocht of door de kantonrechter ambtshalve worden bevolen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel660
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel661
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '660'
        afdeling: Eerste
  - number: '662'
    text: 'Van de verzegeling moet door een proces-verbaal blijken, dat zal inhouden:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel662
  - number: 662.1°
    text: dag en uur van de verzegeling;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel662
  - number: 662.2°
    text: |-
      naam, voornaam en woonplaats van hem op wiens verzoek de verzegeling is gedaan en een keuze van woonplaats ten
      kantore van de notaris die de verzegeling verricht;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel662
  - number: 662.3°
    text: de vermelding van het verlof tot verzegeling;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel662
  - number: 662.4°
    text: de verschijning van de partijen en hun verzoeken en beweringen;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel662
  - number: 662.5°
    text: |-
      de opgave van de plaatsen en de voorwerpen waarop het zegel is gezet en een korte beschrijving van de zaken die
      buiten verzegeling zijn gebleven;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel662
  - number: 662.6°
    text: |-
      naam, woonplaats en beroep van de bewaarder als bedoeld in [artikel 658, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel658
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel662
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '658'
        afdeling: Eerste
  - number: 662.7°
    text: |-
      de eed bij de sluiting der verzegeling die in handen van de notaris moet worden afgelegd door degenen die de zaken
      onder zich hadden of het huis bewonen, waar de verzegeling is gedaan, dat zij niets verduisterd hebben, noch gezien
      hebben noch weten dat iets verduisterd is.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel662
  - number: '663.1'
    text: |-
      Indien bij de verzegeling boeken of papieren worden gevonden, kunnen zij door de notaris worden geopend. Indien zij
      voor de nalatenschap of gemeenschap of de daartoe behorende goederen of schulden van belang kunnen zijn, worden zij
      overgebracht naar de griffie van het kantongerecht of naar een andere door de notaris aan te wijzen plaats, waar
      zij ter beschikking van de partijen blijven.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel663
  - number: '663.2'
    text: |-
      Zodra blijkt dat de overgebrachte boeken of papieren niet van belang zijn of aan een derde toebehoren, zorgt de
      notaris voor afgifte aan de rechthebbende.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel663
  - number: '664'
    text: |-
      De notaris kan op verlangen en op kosten van elk der partijen de voorwerpen, boeken en papieren, alsmede de plaats
      waar zij zijn aangetroffen, doen fotograferen of copiëren. Hij hecht de foto’s of copieën aan het proces-verbaal
      van verzegeling.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel664
  - number: '665.1'
    text: |-
      Indien geen tot de nalatenschap of gemeenschap behorende roerende zaken van voldoende belang worden aangetroffen,
      zal dit in het proces-verbaal worden vermeld en verzegeling achterwege kunnen blijven.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel665
  - number: '665.2'
    text: |-
      Zaken die niet voor beslag vatbaar zijn of niet zonder schade verzegeld kunnen worden, blijven buiten de
      verzegeling, maar worden overeenkomstig [artikel 662 onder 5°][ref1] in het proces-verbaal beschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel662
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel665
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '662'
        afdeling: Eerste
  - number: '666.1'
    text: |-
      De in [artikel 660 onder 1° en 3° onder a][ref1] bedoelde personen kunnen aan de kantonrechter die verlof tot de
      verzegeling gaf, verlof tot ontzegeling verzoeken. Tegen het verlof is geen hogere voorziening toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel660
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel666
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '660'
        afdeling: Eerste
  - number: '666.2'
    text: |-
      Ontzegeling heeft in elk geval plaats voor zover van de nalatenschap of gemeenschap van goederen een partijen
      bindende boedelbeschrijving wordt opgesteld of alle partijen hun toestemming tot de ontzegeling geven en het vrije
      beheer over hun goederen hebben.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel666
  - number: '667.1'
    text: |-
      De in [artikel 660 onder 1° en 3° onder a][ref1] bedoelde personen en degene die de verzegeling heeft uitgelokt
      worden opgeroepen om op het verzoekschrift te worden gehoord, indien zij het verlangen daartoe tijdig aan de
      notaris die de verzegeling heeft verricht, hebben medegedeeld met opgave van de redenen van dit verlangen en van
      hun woonplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel660
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel667
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '660'
        afdeling: Eerste
  - number: '667.2'
    text: |-
      Bij het verzoekschrift wordt een verklaring van de notaris overgelegd waaruit blijkt of en, zo ja, welke
      mededelingen zijn gedaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel667
  - number: '668'
    text: De ontzegeling geschiedt door de in het verlof tot ontzegeling aangewezen notaris.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel668
  - number: '669'
    text: |-
      De in [artikel 660 onder 1° en 3° onder a][ref1] bedoelde personen en degene die de verzegeling heeft uitgelokt
      worden door de notaris ten minste vierentwintig uur tevoren van het tijdstip van ontzegeling op de hoogte gesteld.
      Hetzelfde geldt voor de schuldeiser van de nalatenschap of gemeenschap die zijn verlangen daartoe tijdig aan de
      notaris heeft medegedeeld met opgave van zijn vordering en van zijn woonplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel660
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel669
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '660'
        afdeling: Eerste
  - number: '670'
    text: 'Het proces-verbaal van de ontzegeling moet bevatten:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel670
  - number: 670.1°
    text: dag en uur waarop zij gedaan wordt;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel670
  - number: 670.2°
    text: naam, voornaam en woonplaats of gekozen woonplaats van hem die de ontzegeling verzocht heeft;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel670
  - number: 670.3°
    text: vermelding van het verlof tot ontzegeling;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel670
  - number: 670.4°
    text: |-
      vermelding van de in [artikel 669][ref1] bedoelde mededelingen;


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel669
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel670
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '669'
        afdeling: Tweede
  - number: 670.5°
    text: de verschijning van partijen en hun opmerkingen;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel670
  - number: 670.6°
    text: |-
      de herkenning van de zegels en de bevinding daarvan als gaaf en ongeschonden, of indien zij dit niet mochten zijn,
      de vermelding van de toestand waarin zij worden bevonden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel670
  - number: '671'
    text: |-
      Indien alle partijen zich daarmee verenigen en het vrije beheer over hun goederen hebben, kan een voorgeschreven
      boedelbeschrijving plaatsvinden bij een onderhandse akte. In alle andere gevallen geschiedt zij bij notariële akte.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel671
  - number: '672.1'
    text: |-
      De kantonrechter in wiens rechtsgebied de boedel zich geheel of voor een groot deel bevindt, kan op verzoek van
      een der in [artikel 660 onder 1° en 3° onder a][ref1] bedoelde personen of van iemand die daarbij op andere grond
      voldoende belang heeft, een boedelbeschrijving bevelen door een bij dat bevel aan te wijzen notaris. Tegen het
      bevel is geen hogere voorziening toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel660
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel672
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '660'
        afdeling: Eerste
  - number: '672.2'
    text: Het verzoek kan worden gedaan tezamen met een verzoek strekkende tot verzegeling of tot ontzegeling.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel672
  - number: '672.3'
    text: Het bevel wordt slechts gegeven, indien de verzoeker zijn recht en belang summierlijk aannemelijk maakt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel672
  - number: '673'
    text: |-
      Indien de notaris nodig oordeelt de te beschrijven zaken zelf in ogenschouw te nemen, zijn de
      [artikelen 444][ref1], [444a][ref2] en [444b, tweede en derde lid][ref3], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel444
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel444a
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel444b
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel673
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '444'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 444a
        afdeling: Eerste
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 444b
        afdeling: Eerste
  - number: '674'
    text: 'De boedelbeschrijving zal bevatten:'
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel674
  - number: 674.1°
    text: naam, voornaam en woonplaats van de verschenen of opgeroepen partijen en van de aangewezen schatters;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel674
  - number: 674.2°
    text: |-
      een korte beschrijving van alle tot de boedel behorende goederen en schulden en, zo een der partijen zulks wenst,
      een schatting van de waarde van de roerende zaken door een of meer door partijen aan te wijzen schatters met hun
      beëdiging;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel674
  - number: 674.3°
    text: een opgave van de plaats waar de beschreven zaken zich bevinden, of waarheen zij zijn overgebracht;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel674
  - number: 674.4°
    text: een opgave van tot de boedel behorende geldsommen;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel674
  - number: 674.5°
    text: |-
      een opgave van de aangetroffen boeken en registers betreffende de boedel, die op de eerste en laatste bladzijden
      worden gewaarmerkt, ingeval van een notariële beschrijving door de notaris en ingeval van een onderhandse
      beschrijving door de partijen;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel674
  - number: 674.6°
    text: vermelding van de akten die op de goederen en de schulden van de boedel betrekking hebben;
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel674
  - number: 674.7°
    text: |-
      ingeval van een notariële beschrijving: vermelding van de eed, af te leggen in handen van de notaris, van hen die
      vóór de beschrijving de goederen in hun macht hadden of het huis waarin deze zich bevinden bewoond hebben, dat zij
      niets hebben verduisterd, noch gezien hebben, noch weten dat iets verduisterd is.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel674
  - number: '675'
    text: |-
      Indien partijen het niet eens worden over de aanwijzing van de schatters, worden deze benoemd door de notaris of in
      geval van een onderhandse boedelbeschrijving, door de in [artikel 672][ref1] bedoelde kantonrechter.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel672
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel675
