  - number: 676b
    text: |-
      Van de beschikkingen van de rechter-commissaris ingevolge
      [afdeling 3 van titel 6 van Boek 4 van het Burgerlijk Wetboek][ref1] is gedurende vijf dagen hoger beroep op de
      rechtbank toegelaten, behoudens voor zover het beschikkingen betreft waartegen, indien zij door de kantonrechter
      waren gegeven, geen hogere voorziening is toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Afdeling3
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel676b
    references:
      - id: ref1
        bwb_id: BWBR0002761
        afdeling: '3'
  - number: '677.1'
    text: |-
      Het vonnis waarbij een vordering tot verdeling van een gemeenschap wordt toegewezen zonder dat de rechter de
      vaststelling van de verdeling aan zich houdt, zal inhouden een bevel tot verdeling ten overstaan van een notaris,
      alsmede, zo partijen het over de keuze niet eens zijn, de benoeming van deze notaris. De rechter die een notaris
      benoemt, kan de zaak voor wat betreft hetgeen overigens ter zake van de verdeling is gevorderd, aanhouden tot is
      gebleken of de notaris partijen kan verenigen. De griffier van het gerecht dat de benoeming deed, zendt de notaris
      onverwijld een expeditie van de uitspraak.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel677
  - number: '677.2'
    text: |-
      Op verlangen van elk der partijen kan het vonnis tevens de benoeming inhouden van een onzijdig persoon als bedoeld
      in [artikel 181 van Boek 3 van het Burgerlijk Wetboek](onbekend).
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel677
  - number: '677.3'
    text: |-
      De notaris bepaalt dag en uur waarop partijen voor hem moeten verschijnen en roept hen tegen het vastgestelde
      tijdstip op. Indien zij niet allen verschijnen, kan hij partijen een of meer malen tegen een nieuwe dag oproepen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel677
  - number: '677.4'
    text: |-
      De bepalingen van deze afdeling zijn van overeenkomstige toepassing op verzoeken en beschikkingen betreffende de
      verdeling van een gemeenschap van goederen die door of tijdens een huwelijk of een geregistreerd partnerschap is
      ontstaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel677
  - number: '678.1'
    text: |-
      Indien de notaris partijen niet kan verenigen, constateert hij dit in een proces-verbaal, waarin hij desverlangd
      opgeeft op welke punten partijen reeds tot overeenstemming zijn gekomen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel678
  - number: '678.2'
    text: |-
      Zolang geen volledige overeenstemming is bereikt, kan de meest gerede partij vorderen dat de rechter de wijze
      van verdeling gelast of zelf de verdeling vaststelt, dan wel wat overigens ter zake van hetgeen partijen verdeeld
      houdt, nodig mocht zijn.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel678
  - number: '678.3'
    text: |-
      Zolang hem geen afschrift van het in het eerste lid bedoelde proces-verbaal wordt overgelegd, kan de rechter op
      verlangen van elk der partijen de zaak aanhouden ten einde de notaris opnieuw gelegenheid te geven tot toepassing
      van het derde lid van het vorige artikel.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel678
  - number: '679.1'
    text: |-
      Indien partijen het niet eens worden over de benoeming van een deskundige om de waarde van een of meer der te
      verdelen goederen te schatten, geschiedt de benoeming op verzoek van de meest gerede partij door de kantonrechter
      in wiens ambtsgebied de goederen zich bevinden. Bevinden zij zich in het buitenland, dan is de kantonrechter te
      Amsterdam bevoegd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel679
  - number: '679.2'
    text: |-
      Is met betrekking tot de verdeling een procedure aanhangig, dan kan de benoeming ook, op verlangen van een der
      partijen of ambtshalve, worden gedaan door de rechter voor wie de zaak in eerste aanleg of in hoger beroep dient of
      door de rechter voor wie een getuigenverhoor of verschijning van partijen is gelast.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel679
  - number: '680.1'
    text: |-
      Indien een vordering tot verdeling, tot gelasten van de wijze van verdeling of tot vaststelling van een verdeling
      niet de gehele voor verdeling vatbare gemeenschap betreft, kan ieder van de gedaagden overeenkomstig de hem in de
      [artikelen 179](onbekend) en [185 van Boek 3 van het Burgerlijk Wetboek](onbekend) toegekende bevoegdheden eisen
      dat de verdeling van de gehele voor verdeling vatbare gemeenschap wordt bevolen of door de rechter zelf wordt
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel680
  - number: '680.2'
    text: |-
      Indien de vordering strekt tot het verkrijgen van een bevel tot verdeling of tot de wijze van verdeling van de
      gehele voor verdeling vatbare gemeenschap, kan ieder van de gedaagden vaststelling van de verdeling door de rechter
      zelf vorderen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel680
  - number: '680.3'
    text: |-
      De in de vorige leden bedoelde eis moet worden gedaan voor alle weren die niet de bevoegdheid van de rechter of
      zekerheidstelling overeenkomstig [artikel 224][ref1] betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel224
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel680
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '224'
        paragraaf: '6'
        afdeling: Tiende
  - number: '680.4'
    text: |-
      Zijn een of meer partijen niet verschenen, dan doet degene die de eis heeft gedaan haar aan hem betekenen met
      inachtneming van de voor dagvaarding voorgeschreven termijnen en met oproeping tegen de dag waarop hij de zaak
      wederom ter rolle wil doen dienen. Deze dag zal niet later mogen worden gesteld dan drie maanden na de dag
      waartegen de op te roepen partij voor wie de langste termijn van dagvaarding geldt, op zijn vroegst gedagvaard zou
      mogen worden. De rechter kan, uiterlijk op de dag waartegen is opgeroepen, oproeping tegen een latere dag toestaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel680
  - number: '680.5'
    text: |-
      Zijn niet allen die aan de verdeling dienen mee te werken in het geding betrokken, dan kan ieder van de gedaagden
      hen met overeenkomstige toepassing van het vorige lid alsnog in het geding roepen, met betekening tevens van een
      afschrift van de aan hem zelf uitgebrachte dagvaarding.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel680
  - number: '700.1'
    text: |-
      Voor het leggen van conservatoir beslag is verlof vereist van de voorzieningenrechter van de rechtbank binnen
      welker rechtsgebied zich een of meer van de betrokken zaken bevinden, dan wel, indien het beslag niet op zaken
      betrekking heeft, de schuldenaar of degene of een dergenen onder wie het beslag gelegd wordt, woonplaats heeft.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel700
  - number: '700.2'
    text: |-
      Het verlof wordt verzocht bij een verzoekschrift waarin de aard van het te leggen beslag en van het door de
      verzoeker ingeroepen recht en, zo dit recht een geldvordering is, ook het bedrag of, zo dit nog niet vaststaat, het
      maximum bedrag daarvan, worden vermeld, onverminderd de bijzondere eisen door de wet gesteld voor een beslag van de
      soort waarom het gaat. De voorzieningenrechter beslist na summier onderzoek. In geval van een geldvordering stelt
      hij het bedrag vast waarvoor het verlof wordt verleend, met inbegrip van de kosten waarin de schuldenaar zal kunnen
      worden veroordeeld. Bij het verlof kan de voorzieningenrechter, onverminderd [artikel 64, derde lid][ref1], tevens
      verlof verlenen het beslag te leggen op alle dagen en uren. Tegen een krachtens dit lid gegeven verlof is geen
      hogere voorziening toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel64
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel700
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '64'
        afdeling: Zesde
  - number: '700.3'
    text: |-
      Tenzij op het tijdstip van het verlof reeds een eis in de hoofdzaak is ingesteld, wordt het verlof verleend onder
      voorwaarde dat het instellen daarvan geschiedt binnen een door de voorzieningenrechter daartoe te bepalen termijn
      van ten minste acht dagen na het beslag. De voorzieningenrechter kan de termijn verlengen, indien de beslaglegger
      dit voor het verstrijken van de termijn verzoekt. Tegen de beschikking is geen hogere voorziening toegelaten.
      In het geval van een beslag als bedoeld in [artikel 714][ref1] of [artikel 718][ref2] moet de verlenging, om
      haar werking te hebben, binnen acht dagen na het tijdstip waarop de termijn zonder verlenging zou verstrijken,
      schriftelijk zijn medegedeeld aan de in [artikel 715][ref3] bedoelde vennootschap, onderscheidenlijk de in
      [artikel 718][ref4] bedoelde derde. Overschrijding van de termijn voor het instellen van een eis in de hoofdzaak
      doet het beslag vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel714
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel718
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel715
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel718
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel700
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '714'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '718'
        afdeling: Vierde
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '715'
        afdeling: Derde
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '718'
        afdeling: Vierde
  - number: '701.1'
    text: |-
      De voorzieningenrechter kan het verlof verlenen onder voorwaarde dat tot een door hem te bepalen bedrag zekerheid
      wordt gesteld voor schade die door het beslag kan worden veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel701
  - number: '701.2'
    text: |-
      De zekerheid moet voor of bij de betekening van het beslagexploit aan de beslagene worden aangeboden. Voor het
      overige is [artikel 616][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel616
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel701
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '616'
  - number: '702.1'
    text: |-
      Tenzij de wet anders bepaalt, wordt een conservatoir beslag gelegd met overeenkomstige toepassing van de
      voorschriften, geldende voor het leggen van executoriaal beslag tot verhaal van een geldvordering op een goed
      van de soort als in beslag genomen wordt. In plaats van de executoriale titel wordt in het beslagexploit het in
      [artikel 700][ref1] bedoelde verlof van de voorzieningenrechter vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel700
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel702
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '700'
        afdeling: Eerste
  - number: '702.2'
    text: |-
      Dit verlof en het verzoekschrift waarop het is gegeven worden tezamen met het beslagexploit aan de beslagene
      betekend.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel702
  - number: '703'
    text: Het beslag mag niet worden gelegd op goederen bestemd voor de openbare dienst.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel703
  - number: '704.1'
    text: |-
      Zodra de beslaglegger in de hoofdzaak een executoriale titel heeft verkregen en deze voor tenuitvoerlegging vatbaar
      is geworden, gaat het conservatoir beslag over in een executoriaal beslag, mits de verkregen titel aan de beslagene
      en, zo het beslag onder een derde is gelegd, ook aan deze is betekend.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel704
  - number: '704.2'
    text: |-
      Wordt de eis in de hoofdzaak afgewezen, en is deze afwijzing in kracht van gewijsde gegaan, dan vervalt daardoor
      tevens van rechtswege het beslag. Hetzelfde geldt, indien voor de tenuitvoerlegging van de beslissing in de
      hoofdzaak een rechterlijk bevelschrift of verlof nodig is, en de beslissing waarbij dit door de rechter is
      geweigerd in kracht van gewijsde is gegaan.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel704
  - number: '705.1'
    text: |-
      De voorzieningenrechter die verlof tot het beslag heeft gegeven kan, rechtdoende in kort geding, het beslag op
      vordering van elke belanghebbende opheffen, onverminderd de bevoegdheid van de gewone rechter.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel705
  - number: '705.2'
    text: |-
      De opheffing wordt onder meer uitgesproken bij verzuim van op straffe van nietigheid voorgeschreven vormen, indien
      summierlijk van de ondeugdelijkheid van het door de beslaglegger ingeroepen recht of van het onnodige van het
      beslag blijkt, of, zo het beslag is gelegd voor een geldvordering, indien voor deze vordering voldoende zekerheid
      wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel705
  - number: '705.3'
    text: |-
      [Artikel 63, tweede lid][ref1], en [artikel 438, tweede lid, vierde zin, derde, vierde en vijfde lid][ref2], zijn
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel438
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel705
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '63'
        afdeling: Zesde
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '438'
  - number: '706'
    text: |-
      De kosten van het beslag kunnen, al of niet in de hoofdzaak, van de beslagene worden teruggevorderd, tenzij het
      beslag nietig, onnodig of onrechtmatig was.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel706
  - number: '707'
    text: |-
      Hetgeen is bepaald omtrent conservatoir beslag op een goed, is van overeenkomstige toepassing op conservatoir
      beslag op een beperkt recht op of een aandeel in een zodanig goed.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel707
  - number: '708.1'
    text: |-
      Hetgeen is bepaald omtrent conservatoir beslag op een goed van de schuldenaar is van overeenkomstige toepassing
      op conservatoir beslag op een goed waarop de schuldeiser zich kan verhalen en dat aan een ander dan de schuldenaar
      toebehoort. De beslaglegger is in dit geval verplicht het beslag binnen acht dagen aan de schuldenaar te betekenen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel708
  - number: '708.2'
    text: |-
      Wordt het beslag ten laste van de schuldenaar gelegd, dan is de beslaglegger verplicht het binnen acht dagen aan
      de ander te betekenen of, zo hij diens recht niet kent, onverwijld nadat hij van dat recht kennis heeft gekregen.
      Indien de ander, voordat acht dagen na deze betekening zijn verstreken, schriftelijk aan de deurwaarder mededeelt
      zich tegen het voorgenomen verhaal op zijn goed te verzetten, gaat het beslag jegens hem slechts over in een
      executoriaal beslag uit hoofde van een tegen hem verkregen executoriale titel om de executie te dulden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel708
  - number: '709.1'
    text: |-
      Op verzoek van degene die verlof vraagt tot het leggen van conservatoir beslag op roerende zaken die geen
      registergoederen zijn, of die op zodanige zaken reeds beslag heeft gelegd, kan de voorzieningenrechter die
      het verlof geeft of heeft gegeven of in het rechtsgebied van wiens rechtbank zich een of meer van de betrokken
      zaken bevinden, bevelen dat zij tevens ter gerechtelijke bewaring zullen worden afgegeven aan een door de
      voorzieningenrechter aan te wijzen bewaarder.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel709
  - number: '709.2'
    text: |-
      Een overeenkomstig verzoek kan worden gedaan door een pandhouder als bedoeld in artikel 237 van Boek 3 van het
      Burgerlijk Wetboek, wanneer op de verpande zaak conservatoir of executoriaal beslag is gelegd.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel709
  - number: '709.3'
    text: |-
      De voorzieningenrechter wijst het verzoek niet toe dan na de beslagene en eventuele andere belanghebbenden
      gelegenheid te hebben gegeven te worden gehoord, tenzij bijzondere omstandigheden eisen dat het bevel terstond
      wordt gegeven. Tegen het bevel is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel709
  - number: '709.4'
    text: |-
      [Artikel 701][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel701
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel709
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '701'
        afdeling: Eerste
  - number: '710.1'
    text: |-
      Indien over één of meer goederen geschil bestaat aan wie van twee of meer partijen zij toekomen, kunnen zij
      op vordering van elk der partijen in kort geding onder bewind worden gesteld door de voorzieningenrechter van
      de rechtbank in welker rechtsgebied zich een of meer van de betrokken zaken bevinden of waarvoor de hoofdzaak
      aanhangig is of die naar de gewone regels bevoegd zou zijn van de hoofdzaak kennis te nemen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel710
  - number: '710.2'
    text: |-
      Tenzij reeds een eis in de hoofdzaak is ingesteld, vindt onderbewindstelling slechts plaats onder voorwaarde
      dat deze eis binnen een door de voorzieningenrechter daartoe te bepalen termijn ingesteld wordt. De
      voorzieningenrechter kan de termijn verlengen, indien dit voor het verstrijken van de termijn door een der partijen
      of de bewindvoerder wordt verzocht. Tegen de beschikking is geen hogere voorziening toegelaten. Overschrijding van
      de termijn doet het bewind eindigen.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel710
  - number: '710.3'
    text: |-
      Door partijen op een of meer van de goederen gelegde beslagen beperken de bewindvoerder niet in de hem als zodanig
      toekomende bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel710
  - number: '710.4'
    text: |-
      De bewindvoerder doet de onder het bewind staande goederen toekomen aan degene die daarop krachtens een in kracht
      van gewijsde gegane of uitvoerbaar bij voorraad verklaarde uitspraak recht heeft, tenzij de voorzieningenrechter
      anders heeft bepaald.
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel710
  - number: '710.5'
    text: |-
      De voorzieningenrechter kan voor het bewind zodanige voorschriften geven als hij dienstig acht. Op het
      bewind zijn, voor zover deze voorschriften niet anders bepalen de [artikelen 433 lid 1][ref1], [435][ref2],
      [436 leden 1-3][ref3], [437][ref4], [438 lid 1][ref5], [439][ref6], [441 lid 1, eerste zin][ref7], en
      [442-448 van Boek 1 van het Burgerlijk Wetboek][ref8] van toepassing. Het kan door een gezamenlijk besluit van
      partijen of op verzoek van een hunner door de voorzieningenrechter worden opgeheven.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel433
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel435
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel436
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel437
      [ref5]: https://wetten.overheid.nl/BWBR0002656#Artikel438
      [ref6]: https://wetten.overheid.nl/BWBR0002656#Artikel439
      [ref7]: https://wetten.overheid.nl/BWBR0002656#Artikel441
      [ref8]: https://wetten.overheid.nl/BWBR0002656#Artikel422
    url: https://wetten.overheid.nl/BWBR0001827/2004-06-30#Artikel710
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '433'
      - id: ref2
        bwb_id: BWBR0002656
