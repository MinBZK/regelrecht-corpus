valid_from: '2010-10-10'
bwb_id: BWBR0028459
url: https://wetten.overheid.nl/BWBR0028459/2010-10-10
articles:
  - number: '1'
    text: |-
      Voor de toepassing van het bij of krachtens deze landsverordening bepaalde wordt verstaan onder: - *De Minister:*
      de Minister van Arbeid en Sociale Zaken;
        - *De Bank:* de Sociale Verzekeringsbank;
        - *Ingezetene:* hij die in de Nederlandse Antillen woont;
        - *De inspecteur:* a. ten aanzien van de werkgever, die hetzij zijn woonplaats, hetzij zijn vestigingsplaats of
      bij gebreke daarvan voor de winstbelasting, zijn vaste inrichting of vaste vertegenwoordiger heeft: 1. in het
      eilandgebied Bonaire: de Inspecteur der Belastingen op Bonaire 2. in het eilandgebied Curaçao: de Inspecteur der
      Belastingen op Curaçao 3. in één van de overige eilandgebieden: de Inspecteur der Belastingen op Sint Maarten;
      b. ten aanzien van de verzekerde, die bij het begin van het desbetreffende jaar of bij de aanvang van zijn
      premieplicht in de loop van het jaar, zijn woonplaats heeft: 1. in het eilandgebied Bonaire: de Inspecteur der
      Belastingen op Bonaire 2. in het eilandgebied Curaçao: de Inspecteur der Belastingen op Curaçao 3. in één van de
      overige eilandgebieden: de Inspecteur der Belastingen op Sint Maarten;
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel1
  - number: '2.1'
    text: Waar iemand woont, wordt naar de omstandigheden beoordeeld, voor zover in de volgende leden niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel2
  - number: '2.2'
    text: |-
      Degenen, die de Nederlandse Antillen metterwoon verlaten, maar binnen een jaar zich aldaar weder metterwoon
      vestigen, worden geacht ook tijdens hun afwezigheid in de Nederlandse Antillen te hebben gewoond, tenzij blijkt,
      dat zij tijdens hun afwezigheid op het grondgebied van Nederland of van een vreemde staat hebben gewoond.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel2
  - number: '2.3'
    text: |-
      Degenen, die tijdelijk binnen de Nederlandse Antillen verblijven en hetzij in Nederland wonen, hetzij aldaar geacht
      worden te wonen volgens de daar geldende wetgeving inzake de belasting naar het inkomen, worden als niet binnen de
      Nederlandse Antillen wonend beschouwd, indien hun verblijf niet langer dan een jaar duurt.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel2
  - number: '3.1'
    text: |-
      In de uitvoering van de in deze landsverordening geregelde verzekering wordt voorzien door de Bank, met dien
      verstande, dat de heffing van de premies geschiedt door de Inspecteur.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel3
  - number: '3.2'
    text: |-
      Voor zover de uitvoering van de in deze landsverordening geregelde verzekering geschiedt door de Bank, kan de
      Minister nadere regelen stellen met betrekking tot de te voeren administratie en de registratie der verzekerden.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel3
  - number: '4.1'
    text: |-
      Bij landsbesluit, houdende algemene maatregelen, kunnen bevoegdheden met betrekking tot de uitvoering van deze
      landsverordening worden toegekend aan instanties van het Land of van de eilandgebieden en kunnen aan die instanties
      aanwijzingen en voorschriften worden gegeven.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel4
  - number: '4.2'
    text: |-
      In de gevallen, waarin ingevolge het bepaalde in het vorige lid aan instanties van het Land of de eilandgebieden
      bevoegdheden zijn toegekend, zijn de bepalingen van deze landsverordening en van de tot haar uitvoering genomen
      besluiten van toepassing, met inachtneming van de wijzigingen, welke de aard van het onderwerp vordert.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel4
  - number: '5.1'
    text: |-
      Verzekerd overeenkomstig de bepalingen van deze landsverordening is degene, die de leeftijd van vijftien jaar, doch
      niet die van 60 jaar heeft bereikt, indien hij:
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel5
  - number: 5.1.a
    text: ingezetene is;
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel5
  - number: 5.1.b
    text: |-
      geen ingezetene is, doch in de inkomstenbelasting wordt aangeslagen als binnen de Nederlandse Antillen wonende
      belastingplichtige;
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel5
  - number: 5.1.c
    text: |-
      geen ingezetene is en evenmin geacht kan worden blijvend buiten de Nederlandse Antillen te wonen, doch terzake van
      buiten de Nederlandse Antillen verrichte arbeid wedde of loon geniet ten laste van de Nederlandse Antillen of van
      een der eilandgebieden, mits hij Nederlander is.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel5
  - number: '5.2'
    text: |-
      Niet verzekerd is de vreemdeling, die niet geacht kan worden blijvend binnen de Nederlandse Antillen te wonen
      en die terzake van binnen de Nederlandse Antillen verrichte arbeid wedde of loon geniet ten laste van een andere
      mogendheid.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel5
  - number: '5.3'
    text: |-
      Bij landsbesluit, houdende algemene maatregelen, kunnen personen, die niet ingevolge het eerste lid verzekerd zijn,
      als verzekerden in de zin van deze landsverordening worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel5
  - number: '5.4'
    text: 'Bij landsbesluit, houdende algemene maatregelen, kan van het bepaalde in het eerste lid worden afgeweken:'
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel5
  - number: 5.4.a
    text: ten aanzien van vreemdelingen;
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel5
  - number: 5.4.b
    text: |-
      ter voorkoming van samenloop van de verzekering ingevolge deze landsverordening met een overeenkomstige regeling
      buiten de Nederlandse Antillen;
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel5
  - number: 5.4.c
    text: in de gevallen van tijdelijk verblijf of tijdelijke werkzaamheden hier te lande;
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel5
  - number: 5.4.d
    text: |-
      ten aanzien van echtgenoten en overige gezinsleden van de in het tweede lid en van de in dit lid onder b. en c.
      bedoelde personen.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel5
  - number: '6'
    text: |-
      Degene, die verzekerd is geweest en de leeftijd van 60 jaar heeft bereikt, heeft overeenkomstig de bepalingen van
      deze landsverordening recht op ouderdomspensioen.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel6
  - number: '7.1'
    text: Het ouderdomspensioen bedraagt NAF. 764,– per maand.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel7
  - number: '7.2'
    text: |-
      Het pensioenbedrag, bedoeld in het eerste lid, wordt bij landsbesluit houdende algemene maatregelen, met
      inachtneming van het derde lid aangepast aan de ontwikkeling van de prijsindexcijfers van de gezinsconsumptie.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel7
  - number: '7.3'
    text: |-
      Aanpassing van het pensioenbedrag heeft plaats met ingang van de eerste dag van enig kalenderjaar op basis van de
      stijging welke het prijsindexcijfer van de gezinsconsumptie voor de maand augustus daaraan voorafgaande aangeeft
      ten opzichte van het prijsindexcijfer van de maand augustus van het voorafgaande jaar.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel7
  - number: 7a.1
    text: |-
      Degene aan wie een ouderdomspensioen is toegekend en die gehuwd is met iemand die jonger is dan 60 jaar heeft recht
      op een toeslag van ten hoogste NAF. 461,– per maand, voorzover het gezamenlijk inkomen niet meer dan NAF. 12.000,–
      per jaar bedraagt.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel7a
  - number: 7a.2
    text: |-
      De toeslag wordt door de Bank betaalbaar gesteld aan degene met wie degene aan wie het ouderdomspensioen is
      toegekend, gehuwd is. De betaling geschiedt als regel maandelijks.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel7a
  - number: 7a.3
    text: 'De toeslag eindigt:'
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel7a
  - number: 7a.3.a
    text: |-
      wanneer degene met wie degene aan wie het ouderdomspensioen is toegekend, gehuwd is, de leeftijd van 60 jaar heeft
      bereikt;
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel7a
  - number: 7a.3.b
    text: |-
      bij ontbinding van het huwelijk in de gevallen, genoemd in artikel 248 van het Burgerlijk Wetboek van de
      Nederlandse Antillen;
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel7a
  - number: 7a.3.c
    text: |-
      bij overlijden van degene aan wie het ouderdomspensioen is toegekend of van degene met wie degene aan wie het
      ouderdomspensioen is toegekend, gehuwd is;
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel7a
  - number: 7a.3.d
    text: bij intrekking van het pensioen of de toeslag;
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel7a
  - number: 7a.3.e
    text: wanneer het gezamenlijk inkomen, bedoeld in het eerste lid, meer dan NAF. 12.000,– per jaar bedraagt.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel7a
  - number: 7a.4
    text: |-
      Onder inkomen in het eerste en derde lid, onderdeel e, wordt verstaan het zuiver inkomen, bedoeld in
      de Landsverordening op de inkomstenbelasting 1943 (P.B. 1956, no. 9), verminderd met het ingevolge deze
      landsverordening uitgekeerde pensioen.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel7a
  - number: 7a.5
    text: |-
      De toeslag eindigt met ingang van de maand, volgende op die, waarin het feit of de omstandigheid, bedoeld in het
      derde lid, heeft plaats gehad onderscheidenlijk is ontstaan, die het einde ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel7a
  - number: 7a.6
    text: |-
      De [artikelen 12][ref1], [13, tweede tot en met vierde lid][ref2], [14][ref3], [15][ref4], [16][ref5], [18][ref6],
      [19][ref7], [22][ref8], [22a tot en met 22c][ref9], [23][ref10], [24, tweede lid][ref11], [34][ref12], [37][ref13],
      [38][ref14], [44, eerste lid][ref15], [47][ref16], [48][ref17] en [52][ref18] zijn van overeenkomstige toepassing
      op de toeslag.


