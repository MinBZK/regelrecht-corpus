  - number: 7a.7
    text: 'Op de toeslag wordt een korting toegepast van:'
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel7a
  - number: 7a.7.a
    text: |-
      2% voor elk kalenderjaar, gelegen vóór 1 januari 1975, van 2 1/8% voor elk kalenderjaar tussen 1975 en 31 december
      1990, en van 2 2/9% voor elk kalenderjaar na 31 december 1990, dat degene die gehuwd is met een persoon als bedoeld
      in het eerste lid, behoudens in bij landsbesluit, houdende algemene maatregelen, aan te wijzen gevallen, na het
      bereiken van de 15-jarige, doch vóór het bereiken van de 60-jarige leeftijd van degene met wie hij gehuwd is niet
      verzekerd is geweest;
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel7a
  - number: 7a.7.b
    text: |-
      3% voor elke jaarpremie ingevolge deze landsverordening, welke degene die gehuwd is met een persoon als bedoeld in
      het eerste lid, schuldig nalatig is geweest te betalen.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel7a
  - number: 7a.8
    text: |-
      [Artikel 20][ref1] is van overeenkomstige toepassing op de toeslag met dien verstande dat bij overlijden van
      degene, met wie degene aan wie het ouderdomspensioen is toegekend, is gehuwd, een bedrag van viermaal het
      ouderdomspensioen, genoemd in [artikel 7, eerste lid][ref2], wordt uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0028459#Artikel7
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '20'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0028459
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
  - number: 7a.9
    text: |-
      De bedragen, genoemd in [artikel 7a, eerste en derde lid, onderdeel e][ref1], kunnen ingeval van aanpassing van het
      pensioenbedrag als bedoeld in [artikel 7, tweede lid][ref2], op overeenkomstige wijze worden aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0028459#Artikel7
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: 7a
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028459
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
  - number: '8.1'
    text: |-
      Op het bedrag, bedoeld in [artikel 7, eerste lid][ref1], wordt een korting toegepast van 2% voor elk kalenderjaar,
      gelegen vóór 1 januari 1975, van 2 1/8% voor elk kalenderjaar tussen 1975 en 31 december 1990, en van 2 2/9% voor
      elk kalenderjaar na 31 december 1990, dat de pensioengerechtigde na het bereiken van de 15-jarige, doch vóór het
      bereiken van de 60-jarige leeftijd niet verzekerd is geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel7
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
  - number: '8.2'
    text: |-
      Op het bedrag, genoemd in [artikel 7, eerste lid][ref1], wordt een korting toegepast van 3% voor elke jaarpremie
      ingevolge deze landsverordening, welke de pensioengerechtigde schuldig nalatig is geweest te betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel7
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
  - number: '8.3'
    text: |-
      Bij landsbesluit, houdende algemene maatregelen, worden, gehoord de Bank, regels gesteld omtrent de herleiding
      van gedeelten van jaarpremies tot gehele jaarpremies en van gedeelten van kalenderjaren, bedoeld in het eerste en
      tweede lid, alsmede [artikel 7a][ref1], tot gehele kalenderjaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel7a
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: 7a
        hoofdstuk: III
        paragraaf: '1'
  - number: '8.4'
    text: Na de korting, bedoeld in het eerste en tweede lid, wordt het ouderdomspensioen afgerond op volle guldens.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel8
  - number: '9.1'
    text: Het ouderdomspensioen alsmede een verhoging van het ouderdomspensioen wordt op aanvraag toegekend door de Bank.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel9
  - number: '9.2'
    text: |-
      In afwijking van het bepaalde in het vorige lid is de Bank bevoegd het ouderdomspensioen alsmede een verhoging van
      het ouderdomspensioen ambtshalve toe te kennen.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel9
  - number: '10'
    text: |-
      De aanvraag om ouderdomspensioen alsmede een verhoging van het ouderdomspensioen wordt ingediend ter plaatse door
      de Minister aangewezen.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel10
  - number: '11.1'
    text: |-
      Het ouderdomspensioen gaat in op de eerste dag van de maand volgende op die, waarin de belanghebbende aan de
      voorwaarden voor het recht op ouderdomspensioen voldoet.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel11
  - number: '11.2'
    text: |-
      In afwijking van het bepaalde in het eerste lid kan een ouderdomspensioen niet eerder ingaan dan een jaar vóór de
      eerste dag der maand, volgende op die, waarin de aanvraag werd ingediend of waarin de ambtshalve toekenning plaats
      vond. De Bank kan voor bijzondere gevallen van het bepaalde in de vorige volzin afwijken.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel11
  - number: '12.1'
    text: |-
      Het ouderdomspensioen wordt door de Bank ingetrokken of herzien, wanneer degene aan wie het is toegekend, ingevolge
      het bij of krachtens deze landsverordening bepaalde, daarvoor niet of niet of niet meer in aanmerking komt,
      onderscheidenlijk voor een hoger of lager ouderdomspensioen in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel12
  - number: '12.2'
    text: |-
      De herziening van het ouderdomspensioen, welke voortvloeit uit een wijziging der omstandigheden en welke een
      verhoging van dit pensioen tot gevolg heeft, gaat in op de eerste dag der maand, volgende op die, waarin de
      wijziging dier omstandigheden heeft plaats gevonden. Het bepaalde in [artikel 11, tweede lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel11
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '11'
        hoofdstuk: III
        paragraaf: '2'
  - number: '12.3'
    text: |-
      De intrekking van het ouderdomspensioen of de herziening daarvan, welke een verlaging van dit pensioen tot
      gevolg heeft, gaat, behoudens in bij landsbesluit, houdende algemene maatregelen, aan te wijzen gevallen,
      in op de eerste dag der maand, volgende op die, waarin de dag der dagtekening van de kennisgeving ingevolge
      [artikel 37, eerste lid onder a][ref1] is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel37
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '37'
        hoofdstuk: VI
  - number: '12.4'
    text: |-
      De herziening van het ouderdomspensioen, welke verband houdt met het bepaalde in het laatste lid van
      [artikel 7][ref1], gaat, in afwijking van het bepaalde in het tweede en derde lid, in op de dag, met ingang waarvan
      op grond van het laatste lid van artikel 7, de in dat artikel genoemde bedragen zijn herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel7
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
  - number: '12.5'
    text: |-
      Ter uitvoering van het bepaalde in dit artikel kunnen bij landsbesluit, houdende algemene maatregelen, nadere
      voorschriften worden gegeven. Daarbij kunnen tevens regelen worden gesteld met betrekking tot schorsing en
      opschorting van de uitbetaling van het ouderdomspensioen.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel12
  - number: '13.1'
    text: Het ouderdomspensioen wordt betaalbaar gesteld door de Bank. De betaling geschiedt als regel maandelijks.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel13
  - number: '13.2'
    text: |-
      In geval het pensioen in het buitenland wordt uitbetaald, worden de daaraan verbonden kosten van overmaking op het
      pensioen in mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel13
  - number: '13.3'
    text: |-
      Wanneer een gepensioneerde een ander machtigt om het ouderdomspensioen in ontvangst te nemen, onderscheidenlijk een
      verleende machtiging intrekt, wordt daaraan gevolg gegeven met ingang van een betalingstermijn, aanvangende na de
      dag, waarop de machtiging wordt ingediend, onderscheidenlijk waarop van haar intrekking mededeling wordt gedaan,
      doch niet later dan de eerste dag van de tweede maand na de dag van indiening, onderscheidenlijk intrekking der
      machtiging.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel13
  - number: '13.4'
    text: |-
      Bij landsbesluit, houdende algemene maatregelen, kunnen regelen worden vastgesteld inzake de betaalbaarstelling
      van het ouderdomspensioen door organen, welke belast zijn met de uitbetaling van pensioen uit anderen hoofde dan
      ingevolge deze landsverordening.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel13
  - number: '14.1'
    text: |-
      Indien een krachtens deze landsverordening gepensioneerde in een gesticht of door of vanwege een instelling
      van weldadigheid, door het openbare gezag erkend, wordt verzorgd of verpleegd, en de kosten van verzorging of
      verpleging geheel of gedeeltelijk ten laste komen van een openbaar lichaam of een instelling van weldadigheid
      als vorenbedoeld, kan op verzoek van het desbetreffende orgaan het ouderdomspensioen over volle kalendermaanden,
      gelegen binnen de duur van de verzorging of verpleging, voor zover het over die maanden nog niet is uitbetaald, aan
      het desbetreffende orgaan worden uitbetaald, met dien verstande, dat aan dat orgaan niet meer wordt uitbetaald dan
      de te zijnen laste komende kosten van verzorging en verpleging bedragen.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel14
  - number: '14.2'
    text: |-
      Voorzover in verband met het bepaalde in dit artikel het ouderdomspensioen niet werd uitbetaald aan de
      gepensioneerde, wordt het na het overlijden van de gepensioneerde, voorzover nodig in afwijking van het in
      [artikel 17][ref1] bepaalde, tot en met de laatste dag der maand, waarin het overlijden plaats vond, uitbetaald aan
      het in het eerste lid van dit artikel bedoelde orgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel17
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '17'
        hoofdstuk: III
        paragraaf: '2'
  - number: '15'
    text: |-
      De termijnen van het ouderdomspensioen, welke niet zijn ingevorderd binnen twee jaar na de eerste dag waarop zij
      konden worden ingevorderd, worden niet meer uitbetaald.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel15
  - number: '16.1'
    text: |-
      Behoudens het bepaalde in het volgende lid zijn de eenmaal uitbetaalde termijnen van het ouderdomspensioen niet
      vatbaar voor terugvordering.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel16
  - number: '16.2'
    text: |-
      Indien het ouderdomspensioen krachtens het bepaalde in [artikel 12, derde lid][ref1] met terugwerkende kracht is
      herzien of ingetrokken, kan hetgeen aan pensioen te veel of ten onrechte is uitbetaald, geheel of gedeeltelijk
      worden teruggevorderd, dan wel op het later uit te betalen pensioen in mindering worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel12
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '12'
        hoofdstuk: III
        paragraaf: '2'
  - number: '17.1'
    text: 'Onverminderd het overigens in deze landsverordening bepaalde eindigt het ouderdomspensioen door:'
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel17
  - number: 17.1.1e
    text: overlijden;
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel17
  - number: 17.1.2e
    text: intrekking.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel17
  - number: '17.2'
    text: |-
      Het ouderdomspensioen eindigt, behoudens het overigens in deze landsverordening bepaalde, met ingang van de maand
      volgende op die, waarin het feit heeft plaats gehad of de omstandigheid is ontstaan, die het einde ten gevolge
      heeft
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel17
  - number: '18.1'
    text: 'Het ouderdomspensioen is:'
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel18
  - number: 18.1.a
    text: onvervreemdbaar;
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel18
  - number: 18.1.b
    text: niet vatbaar voor verpanding of belening;
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel18
  - number: 18.1.c
    text: |-
      behoudens voor zover dit dient tot verhaal van onderhoud, waartoe de gepensioneerde volgens wettelijke regeling is
      gehouden, niet vatbaar voor executoriaal of conservatoir beslag, noch voor faillissementsbeslag.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel18
  - number: '18.2'
    text: |-
      Voor zover op grond van het eerste lid, onder c beslag wordt gelegd, mag dit niet meer bedragen dan een derde
      gedeelte van het bedrag van het ouderdomspensioen.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel18
  - number: '18.3'
    text: |-
      Volmacht tot ontvangst van ouderdomspensioen, onder welke vorm of welke benaming ook, door de gepensioneerde
      verleend, is steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel18
  - number: '18.4'
    text: Elk beding, strijdig met enige bepaling van dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel18
  - number: 18a.1
    text: |-
      De Bank is bevoegd om op grond van verdragen, convenanten en andersoortige overeenkomsten met uitvoerders
      van instellingen van sociale voorzieningen, het ouderdomspensioen van een pensioengerechtigde te verminderen
      ter ontneming van een ten onrechte verkregen voordeel van de pensioengerechtigde op het gebied van sociale
      voorzieningen.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel18a
  - number: 18a.2
    text: |-
      De Bank is eveneens bevoegd om het ouderdomspensioen van een pensioengerechtigde te verminderen ter ontneming
      van een ten onrechte verkregen voordeel van de pensioengerechtigde op het gebied van de door de Bank uitgevoerde
      sociale verzekeringswetten.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel18a
  - number: 18a.3
    text: |-
      De in het eerste en tweede lid bedoelde vermindering kan ineens geschieden indien het ten onrechte genoten voordeel
      niet groter is dan een derde deel van het door de Bank verstrekte ouderdomspensioen. In alle andere gevallen kan de
      vermindering niet meer bedragen dan een derde deel van het ouderdomspensioen.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel18a
  - number: '19.1'
    text: |-
      Na het overlijden van degene, aan wie een ouderdomspensioen is toegekend, wordt het pensioen tot en met de laatste
      dag van de maand waarin het overlijden heeft plaats gehad, uitbetaald.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel19
  - number: '19.2'
    text: |-
      De uitbetaling, bedoeld in het eerste lid, geschiedt aan de persoon of personen, die daarvoor naar het oordeel
      van de Bank op billijkheidsoverwegingen in aanmerking komt onderscheidenlijk komen, mits deze daartoe binnen zes
      maanden na het overlijden een verzoek bij de Bank heeft, onderscheidenlijk hebben, ingediend.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel19
  - number: '20.1'
    text: |-
      Na het overlijden van degene, aan wie een ouderdomspensioen is toegekend, wordt een bedrag ineens, gelijk aan
      viermaal het ouderdomspensioen, genoemd in [artikel 7 eerste lid][ref1], uitbetaald aan de persoon of personen,
      die daarvoor naar het oordeel van de Bank op billijkheidsoverwegingen in aanmerking komt, onderscheidenlijk komen,
      mits deze daartoe binnen zes maanden na het overlijden een verzoek bij de Bank heeft, onderscheidenlijk hebben,
      ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel7
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
  - number: '20.2'
    text: |-
      De uitkering, bedoeld in het eerste lid, wordt betaalbaar gesteld in de maand volgende op die, waarin een verzoek
      als bedoeld in het eerste lid, bij de Bank is ingediend.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel20
  - number: '21.1'
    text: |-
      Aan de verzekerde, die de Nederlandse Antillen metterwoon verlaat, wordt door de Bank op diens verzoek
      een verklaring afgegeven, vermeldende het aantal jaren dat de verzekerde voor zijn rechten krachtens deze
      landsverordening kan doen gelden tot aan de dag van zijn vertrek uit de Nederlandse Antillen. Alvorens deze
      verklaring wordt afgegeven moet de verzekerde de door hem verschuldigde premie, tot aan de dag van zijn vertrek,
      voldoen.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel21
  - number: '21.2'
    text: |-
      Bij landsbesluit, houdende algemene maatregelen, worden, gehoord de Bank, regelen vastgesteld met betrekking tot de
      toekenning en betaalbaarstelling van ouderdomspensioenen, voor personen die buiten de Nederlandse Antillen wonen.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel21
  - number: '22'
    text: |-
      Het Land waarborgt zonder enig voorbehoud de betaling door de Bank van het ouderdomspensioen en het bedrag genoemd
      in [artikel 20][ref1], waarop krachtens deze landsverordening aanspraak bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel20
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '20'
        hoofdstuk: III
        paragraaf: '3'
  - number: 22a.1
    text: Degene, die recht heeft op ouderdomspensioen in de maand september, heeft recht op kerstuitkering.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel22a
  - number: 22a.2
    text: |-
      Voor de toepassing van deze paragraaf wordt onder degene, die recht heeft op ouderdomspensioen, mede verstaan
      degene, aan wie op grond van [artikel 19][ref1] ouderdomspensioen wordt uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel19
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '19'
        hoofdstuk: III
        paragraaf: '3'
  - number: 22b.1
    text: |-
      De kerstuitkering bedraagt 100 pct. van het bedrag aan ouderdomspensioen, waarop recht bestond in de maand
      september.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel22b
  - number: 22b.2
    text: |-
      De uitbetaling van de kerstuitkering vindt eenmaal per jaar ambtshalve plaats in de eerste helft van de maand
      december. De Minister kan terzake nadere regelen stellen.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel22b
  - number: 22b.3
    text: |-
      Het bedrag van de kerstuitkering, dat niet is ingevorderd binnen zes maanden na de eerste dag waarop het kon worden
      ingevorderd, wordt niet meer uitbetaald.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel22b
  - number: 22c
    text: |-
      Het bepaalde bij of krachtens de [artikelen 13][ref1], [14][ref2], [16][ref3], [18][ref4], [19][ref5], [22][ref6]
      en [34][ref7] vindt overeenkomstige toepassing ten aanzien van de kerstuitkering, voor zover bij of krachtens deze
      paragraaf niet anders is bepaald. De Minister kan met betrekking tot het bepaalde in deze paragraaf nadere regelen
      stellen. Daarbij kan worden afgeweken van het bepaalde in [artikel 22b][ref8], tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0028459#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0028459#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0028459#Artikel18
      [ref5]: https://wetten.overheid.nl/BWBR0028459#Artikel19
      [ref6]: https://wetten.overheid.nl/BWBR0028459#Artikel22
      [ref7]: https://wetten.overheid.nl/BWBR0028459#Artikel34
      [ref8]: https://wetten.overheid.nl/BWBR0028459#Artikel22b
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel22c
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '13'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028459
        artikel: '14'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0028459
        artikel: '16'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0028459
        artikel: '18'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0028459
        artikel: '19'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref6
        bwb_id: BWBR0028459
        artikel: '22'
        hoofdstuk: III
        paragraaf: '5'
      - id: ref7
        bwb_id: BWBR0028459
        artikel: '34'
        hoofdstuk: V
      - id: ref8
        bwb_id: BWBR0028459
        artikel: 22b
        hoofdstuk: III
        paragraaf: '6'
  - number: '23'
    text: |-
      De middelen tot dekking van de ingevolge deze landsverordening uit te keren pensioenen en uitkeringen als bedoeld
      in [artikel 20][ref1] en van de aan de uitvoering van deze landsverordening verbonden kosten, alsmede de middelen
      benodigd voor het vormen en in stand houden van een bij landsbesluit, houdende algemene maatregelen, te bepalen
      reserve, worden gevonden door het heffen van premies van de verzekerden en uit overige inkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel20
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '20'
        hoofdstuk: III
        paragraaf: '3'
  - number: '24.1'
    text: De premies worden gestort in een door de Bank te beheren Ouderdomsfonds.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel24
  - number: '24.2'
    text: |-
      De ingevolge deze landsverordening uit te keren pensioenen, de uitkeringen bedoeld in [artikel 20][ref1] alsmede de
      aan de uitvoering van deze landsverordening verbonden kosten komen ten laste van het Ouderdomsfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel20
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '20'
        hoofdstuk: III
        paragraaf: '3'
  - number: '25'
    text: |-
      Bij landsbesluit, houdende algemene maatregelen, worden voorschriften vastgesteld met betrekking tot de belegging
      van de gelden van het Ouderdomsfonds.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel25
  - number: '26.1'
    text: |-
      De premie wordt, met inachtneming van het bepaalde in de volgende leden, geheven naar de maatstaf van het door
      de verzekerde in een kalenderjaar genoten inkomen en vastgesteld in een percentage van dat inkomen. Ten aanzien
      van degene, die slechts een gedeelte van een kalenderjaar verzekerd is geweest, treedt dit gedeelte voor het
      kalenderjaar in de plaats.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel26
  - number: '26.2'
    text: |-
      Onder inkomen wordt verstaan: het zuiver inkomen in de zin van de Landsverordening op de inkomstenbelasting 1943
      (P.B. 1956, no. 9), vermeerderd met de krachtens laatstgenoemde landsverordening als persoonlijke last in aftrek
      toegelaten premies algemene ouderdomsverzekering en algemene weduwen- en wezenverzekering en verminderd met de
      ingevolge deze landsverordening en de Landsverordening Algemene Weduwen- en Wezenverzekering (P.B. 1965, no. 194)
      uitgekeerde pensioenen en gedane uitkeringen.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel26
  - number: '26.3'
    text: |-
      Indien het inkomen meer bedraagt dan NAF 49.745,83 per jaar, wordt over dat meerdere geen premie geheven. Het
      bedrag van NAF 49.745,83 wordt naar tijdsruimte evenredig verlaagd ten aanzien van degene, die niet het gehele jaar
      verzekerd is geweest.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel26
  - number: '26.4'
    text: |-
      Van verzekerden, die niet of niet het gehele kalenderjaar in dienstbetrekking werkzaam zijn en wier inkomen minder
      bedraagt dan NAF. 5.923,74 per jaar, wordt de premie, voor zover deze niet bij wijze van inhouding is geheven,
      niet geheven.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel26
  - number: '26.5'
    text: |-
      Van verzekerden die niet of niet het gehele kalenderjaar in dienstbetrekking werkzaam zijn en wier inkomen niet
      minder dan NAF. 5.923,74 doch wel minder dan NAF 46.086,11 per jaar bedraagt, wordt premie, bedoeld in het eerste
      lid, voor zover deze niet bij wijze van inhouding is geheven overeenkomstig bij landsbesluit, houdende algemene
      maatregelen te stellen regels slechts voor een deel geheven.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel26
  - number: '26.6'
    text: |-
      Bij landsbesluit, houdende algemene maatregelen, kunnen met betrekking tot het eerste tot en met vierde lid nadere
      regels worden vastgesteld en kunnen de bedragen, genoemd in het derde tot en met vijfde lid, ingeval van aanpassing
      van het pensioenbedrag als bedoeld in [artikel 7, tweede lid][ref1], op overeenkomstige wijze worden aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel7
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
  - number: '27.1'
    text: |-
      Het in [artikel 26, eerste lid][ref1], bedoelde premiepercentage bedraagt 13%, welk percentage kan worden aangepast
      bij landsbesluit, houdende algemene maatregelen, gehoord het bestuur van de Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel26
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '26'
        hoofdstuk: IV
  - number: '27.2'
    text: |-
      Als regel wordt het premiepercentage telkens voor een periode van vijf jaren vastgesteld, en wel zodanig, dat het
      totaal van de over de eerstvolgende periode te ontvangen premies voldoende zal zijn om daaruit de uitgaven van het
      Ouderdomsfonds over dat tijdvak te voldoen, alsmede om de in [artikel 23][ref1] bedoelde reserve te vormen en in
      stand te houden.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel23
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '23'
        hoofdstuk: IV
  - number: '28'
    text: |-
      De Minister van Financiën is bevoegd, met inachtneming van het vastgestelde premiepercentage, de ingevolge deze
      landsverordening verschuldigde premies te doen berekenen volgens tabellen. Bij het opstellen van deze tabellen en
      voor de toepassing daarvan bepaalt de Minister van Financiën de door hem nodig geachte afrondingen.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel28
  - number: '29.1'
    text: |-
      Tenzij bij of krachtens deze landsverordening anders is bepaald, geschiedt de heffing van de ingevolge deze
      landsverordening verschuldigde premie, onder verrekening van eventueel krachtens het tweede lid geheven premies,
      bij wege van aanslag en met overeenkomstige toepassing van de voor de heffing van de inkomstenbelasting geldende
      regelen, met dien verstande, dat aan de verzekerde, die niet wordt aangeslagen in de inkomstenbelasting, niettemin
      een aanslag wordt opgelegd voor de door hem verschuldigde premies.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel29
  - number: '29.2'
    text: |-
      De premie van de verzekerden, die in dienstbetrekking werkzaam zijn, wordt geheven bij wege van inhouding door de
      werkgever. Indien de ingevolge [artikel 26 lid 1][ref1] in totaal over een jaar verschuldigde premie door inhouding
      is geheven, blijft het bepaalde in het vorige lid buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel26
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '26'
        hoofdstuk: IV
  - number: '29.3'
    text: |-
      Het bepaalde in de artikelen 3, leden 2,3,4, en 5, 4, leden 2 en 4, 21, lid 1, 21a, 21b, 21c en 21d van
      de Landsverordening op de Loonbelasting 1976 (P.B. 1975, no. 254) is van overeenkomstige toepassing ten
      aanzien van de ingevolge deze landsverordening verschuldigde premies, met dien verstande dat in de plaats van
      «inhoudingsplichtige(n)« telkens gelezen wordt «werkgever(s)».
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel29
  - number: '29.4'
    text: |-
      Invordering van de premie, de administratieve boete en al hetgeen de Bank verder uit hoofde van deze
      landsverordening te vorderen heeft, heeft plaats volgens de regels, welke van toepassing zijn op de invordering van
      de directe belastingen, met dien verstande dat de Bank in plaats van de Ontvanger met de invordering is belast.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel29
  - number: '29.5'
    text: |-
      De Minister en de Minister van Financiën geven voorschriften inzake hetgeen nader geregeld moet worden met
      betrekking tot de heffing, de invordering en de afdracht van de premie ingevolge deze landsverordening.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel29
  - number: '29.6'
    text: |-
      Met betrekking tot het in dit artikel bepaalde kunnen bij landsbesluit, houdende algemene maatregelen, nadere
      regelen worden vastgesteld voor bepaalde personen of groepen van personen.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel29
  - number: 29a.1
    text: |-
      De werkgever is verplicht de premie, die hij over een tijdvak van een maand of korter heeft ingehouden of had
      moeten inhouden binnen 15 dagen na het einde van die maand, op aangifte af te dragen. Indien de inhouding over een
      tijdvak van langer dan een maand geschiedt, is de werkgever verplicht de premie, binnen vijftien dagen na het einde
      van dat tijdvak, op aangifte af te dragen.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel29a
  - number: 29a.2
    text: |-
      De aangifte wordt gelijktijdig met de afdracht gedaan bij de Bank. Indien evenwel krachtens [artikel 4][ref1] een
      instantie is aangewezen, geschiedt de aangifte bij die instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel4
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '4'
        hoofdstuk: I
  - number: 29a.3
    text: De inspecteur kan onder door hem te stellen voorwaarden uitstel van het indienen van de aangifte verlenen.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel29a
  - number: 29a.4
    text: |-
      De inspecteur kan van de werkgever die de premie over een tijdvak van langer dan een maand moet afdragen, vorderen
      dat hij binnen vijftien dagen na het einde van elke maand een gedeelte van de in te houden premie bij wijze van
      voorlopige betaling afdraagt.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel29a
  - number: 29a.5
    text: |-
      Ook in de gevallen, dat geen premie behoeft te worden ingehouden, moet aangifte op de in de vorige leden aangegeven
      tijden ingediend worden. Personen, die stellen geen werkgever te zijn, moeten niettemin de hen verstrekte aangifte-
      formulieren binnen vijftien dagen na het einde van de maand, waarin de aangifte-formulieren hen zijn verstrekt,
      indienen.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel29a
  - number: 29a.6
    text: |-
      De Inspecteur verstrekt de inhoudingsplichtige het benodigde aantal aangifte-formulieren, hetzij op diens verzoek,
      hetzij ambtshalve.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel29a
  - number: 29b.1
    text: |-
      Indien de premie geheel of gedeeltelijk niet binnen de voorgeschreven tijd is afgedragen kan de te weinig
      afgedragen premie door middel van een aanslag, op te leggen ten name van de werkgever, worden ingevorderd. De
      werkgever is gerechtigd het nageheven bedrag te verhalen op zijn werknemer voor zover het betrekking heeft op van
      de werknemer ten onrechte niet ingehouden premie.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel29b
  - number: 29b.2
    text: |-
      De in de aanslag te begrijpen premie kan bij wijze van boete verhoogd worden met ten hoogste honderd procent doch
      tenminste vijftien gulden. De werkgever is niet gerechtigd deze boete op zijn werknemers te verhalen.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel29b
  - number: 29b.3
    text: |-
      Indien aan de verplichting opgelegd in het vijfde lid van het vorige artikel niet wordt voldaan en ten gevolge
      daarvan de aanslag in zijn geheel moet worden verminderd, bedraagt de boete vijftien gulden.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel29b
  - number: '30.1'
    text: |-
      Indien bij het vaststellen van de premie-aanslag of bij controle van de door de werkgevers ingehouden premie blijkt
      dat teveel of te weinig is ingehouden dan wel teveel of te weinig is betaald op een voorlopige premie-aanslag,
      wordt het meerdere gerestitueerd en het mindere alsnog ingevorderd.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel30
  - number: '30.2'
    text: |-
      Geen restitutie of invordering als bedoeld in het vorige lid heeft plaats, indien het te restitueren of alsnog in
      te vorderen bedrag lager is dan f. 5,–.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel30
  - number: '30.3'
    text: In het geval als bedoel in het tweede lid blijft het opleggen van de definitieve premie-aanslag achterwege.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel30
  - number: '31.1'
    text: |-
      Indien een verzekerde nalatig is gebleven de over een bepaald jaar verschuldigde premie geheel of gedeeltelijk te
      betalen, houdt de Bank, indien zij besluit, dat van een schuldig nalaten sprake is, daarvan aantekening. Hiervan
      wordt de verzekerde in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel31
  - number: '31.2'
    text: |-
      In de gevallen, waarin aantekening is gesteld als bedoeld in het eerste lid, kunnen de verzekerden alsnog gedurende
      vijf jaren na de kennisgeving van de aantekening de verschuldigde premies geheel of gedeeltelijk betalen. Voor
      zover de verschuldigde premies alsnog zijn betaald, wordt de aantekening als bedoeld in het eerste lid doorgehaald
      en de verzekerde voor de betreffende periode niet geacht schuldig nalatig te zijn geweest.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel31
  - number: '31.3'
    text: |-
      Bij landsbesluit, houdende algemene maatregelen, kunnen terzake van het bepaalde in de vorige leden, nadere regelen
      worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel31
  - number: '32.1'
    text: |-
      Degene, op wie volgens de bepalingen van deze landsverordening de plicht rust premie te betalen, is verplicht
      aangifte te doen van zijn inkomen.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel32
  - number: '32.2'
    text: |-
      In de gevallen waarin geen aangifte is gedaan en als gevolg daarvan ten onrechte geen of onvoldoende premie is
      betaald, wordt de verzekerde geacht over het betreffende jaar schuldig nalatig te zijn geweest in de betaling der
      premie.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel32
  - number: '33.1'
    text: |-
      Verzekerden en gewezen verzekerden, beneden een bij landsbesluit, houdende algemene maatregelen, te bepalen
      leeftijd, welke niet hoger mag worden gesteld 60 jaar, zijn in de gevallen, onder de voorwaarden en overeenkomstig
      het tarief, bij landsbesluit, houdende algemene maatregelen, te bepalen, tot premiebetaling bevoegd over
      tijdvakken, gelegen na het bereiken van de leeftijd van vijftien jaar, waarover zij niet verzekerd zijn of geweest
      zijn.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel33
  - number: '33.2'
    text: |-
      Degene, die van zijn bevoegdheid bedoeld in het eerste lid gebruik maakt, wordt over de tijd, waarover de premie is
      betaald, als verzekerde beschouwd.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel33
  - number: '34'
    text: |-
      De gepensioneerde aan wie, alsmede het orgaan aan hetwelk het pensioen ingevolge het bepaalde in [artikel 14][ref1]
      geheel of gedeeltelijk wordt uitbetaald, zijn verplicht van elke verandering van feiten en omstandigheden, welke
      tot intrekking of verlaging van het pensioen aanleiding kan geven, schriftelijk mededeling te doen aan de Bank,
      binnen veertien dagen nadat genoemde feiten en omstandigheden zich voordoen.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel14
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '14'
        hoofdstuk: III
        paragraaf: '2'
  - number: '35.1'
    text: |-
      Een ieder is verplicht aan de Bank, aan een orgaan, belast met de uitvoering van enig deel van deze
      landsverordening of aan enig door of vanwege een dezer instanties aangewezen persoon de ten behoeve van de uit
      voering der landsverordening van hem gevraagde inlichtingen te geven.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel35
  - number: '35.2'
    text: |-
      De inlichtingen moeten, indien dit wordt verzocht, schriftelijk worden verstrekt binnen een door een in het eerste
      lid bedoelde instantie of persoon schriftelijk te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel35
  - number: '35.3'
    text: |-
      Een ieder is verplicht aan een in het vorige lid bedoelde instantie of aan een door of vanwege deze daartoe
      aangewezen persoon desgevraagd inzage te verlenen van boeken, bescheiden en andere informatiedragers voor zover dit
      nodig is ten behoeve van de uitvoering van deze landsverordening.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel35
  - number: '36.1'
    text: |-
      Publiekrechtelijke lichamen zijn verplicht op de door de Minister van Algemene Zaken aan te geven wijze
      kosteloos hun medewerking te verlenen tot het verkrijgen van de inlichtingen, benodigd voor de uitvoering dezer
      landsverordening.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel36
  - number: '36.2'
    text: |-
      De bestuurscolleges der onderscheidene eilandgebieden, zijn verplicht er zorg voor te dragen dat aan een der in het
      [eerste lid van artikel 35][ref1] bedoelde instanties de door deze gevraagde gegevens kosteloos worden toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel35
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '35'
        hoofdstuk: V
  - number: '37.1'
    text: Aan de belanghebbende wordt schriftelijk kennis gegeven van een beslissing ingevolge deze landsverordening, welke
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel37
  - number: 37.1.a
    text: verband houdt met het recht op en de uitbetaling van pensioen of uitkering of kerstuitkering, dan wel
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel37
  - number: 37.1.b
    text: |-
      betrekking heeft op een aantekening als bedoeld in het [eerste lid van artikel 31][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel31
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '31'
        hoofdstuk: IV
  - number: '37.2'
    text: |-
      Een kennisgeving als bedoeld in het eerste lid vermeldt de dagtekening van de beslissing, de gronden, waarop deze
      berust, alsmede bij wie beroep kan worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel37
  - number: '37.3'
    text: |-
      Het in het vorige leden bepaalde is ten aanzien van een beslissing inzake het recht op kerstuitkering slechts van
      toepassing, indien de belanghebbende zulks verzoekt.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel37
  - number: '38'
    text: |-
      Tegen een beschikking waarvan ingevolge [artikel 37][ref1] schriftelijk kennis is gegeven staat, behoudens indien
      het betreft een beslissing ingevolge [artikel 19, derde lid][ref2], voorzover de daar bedoelde uitkering op
      billijkheidsgronden is toegekend of een beslissing ingevolge [artikel 20, derde lid][ref3], dan wel een beslissing
      ingevolge [artikel 22c, eerste lid][ref4], juncto [artikel 13, tweede lid][ref5], of artikel 19, derde lid, voor
      belanghebbende binnen zes weken na de dag waarop deze is gegeven, beroep open bij het gerecht in eerste aanleg van
      de Nederlandse Antillen.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0028459#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0028459#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0028459#Artikel22c
      [ref5]: https://wetten.overheid.nl/BWBR0028459#Artikel13
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '37'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0028459
        artikel: '19'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0028459
        artikel: '20'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0028459
        artikel: 22c
        hoofdstuk: III
        paragraaf: '6'
      - id: ref5
        bwb_id: BWBR0028459
        artikel: '13'
        hoofdstuk: III
        paragraaf: '2'
  - number: '39.1'
    text: |-
      Voor zover bij of krachtens deze landsverordening niet anders is bepaald zijn, naar gelang de ingevolge deze
      landsverordening verschuldigde premies en boeten bij wege van aanslag, dan wel bij wijze van inhouding worden
      geheven, de voor de heffing van de inkomstenbelasting geldende regelen inzake de rechtsmiddelen van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel39
  - number: '39.2'
    text: |-
      De Inspecteur doet op een bezwaarschrift eerst uitspraak nadat is komen vast te staan, dat geen feiten en
      omstandigheden in geding zijn, welke tevens van belang zijn voor de heffing van inkomstenbelasting, dan wel
      voor zover zulks wel het geval is, de beslissing daaromtrent voor de heffing van die belasting onherroepelijk is
      geworden.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel39
  - number: '39.3'
    text: |-
      Met betrekking tot een navorderingsaanslag, welke geheel of gedeeltelijk berust op feiten, welke mede tot het
      opleggen van een navorderingsaanslag in de inkomstenbelasting ten laste van belanghebbende aanleiding hebben
      gegeven, neemt de termijn voor het instellen van beroep eerst een aanvang op de datum, waarop laatstbedoelde
      navorderingsaanslag onherroepelijk is komen vast te staan.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel39
  - number: '39.4'
    text: |-
      Tegen hetgeen omtrent de toepassing van [artikel 2][ref1] dezer Landsverordening, alsmede omtrent het zuiver
      inkomen in de zin van de landsverordening op de inkomstenbelasting 1943 (P.B. 1956, no. 9) voor de heffing van die
      belasting onherroepelijk is komen vast te staan, is beroep niet toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel2
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '2'
        hoofdstuk: I
  - number: '40.1'
    text: |-
      Degene, die voor het in werking treden van [artikel 5][ref1] de leeftijd van 15, doch nog niet die van
      65 jaar heeft bereikt, en die – al dan niet onafgebroken – gedurende zes jaren na de voleindiging van
      zijn 54ste levensjaar in de Nederlandse Antillen, Nederland, Suriname of Nederlands Nieuw-Guinea heeft
      gewoond, wordt voor wat betreft het tijdvak gelegen binnen het bereiken van de leeftijd van 15 jaar
      en het tijdstip van inwerking treden van deze landsverordening voor de toepassing van het bepaalde in
      [artikel 8, eerste lid, en tweede lid, onder 1°, sub a en b, onder 2°, sub a en b][ref2] geacht verzekerd te zijn
      geweest. Voor de toepassing van het bepaalde in de vorige volzin wordt de gehuwde vrouw, die jonger is dan haar
      man, onderscheidenlijk de echtgenoot van de gehuwde vrouw, bedoeld in [artikel 7, tweede lid][ref3], geacht het
      54ste levensjaar te hebben voleindigd op dezelfde dag als haar echtgenoot, onderscheidenlijk zijn echtgenote.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0028459#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0028459#Artikel7
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0028459
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0028459
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
  - number: '40.2'
    text: |-
      De gehuwde vrouw, die in tegenstelling tot haar echtgenoot voor of op de dag van het in werkingtreden
      van [artikel 5][ref1] de leeftijd van 65 heeft bereikt, doch overigens voldoet aan de voorwaarden,
      in de eerste volzin van het vorige lid gesteld, wordt voor de toepassing van het bepaalde
      in[ artikel 8, tweede lid, onder 1 sub b][ref2] gedurende het tijdvak, gelegen tussen de voleindiging van haar 15de
      en de voleindiging van haar 65ste levensjaar, geacht verzekerd te zijn geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0028459#Artikel8
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0028459
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
  - number: '40.3'
    text: |-
      Degene, die voldoet aan het bepaalde in de eerste volzin van het eerste lid, doch nimmer ingevolge deze
      landsverordening verzekerd is geweest, wordt nochtans voor de toepassing van [artikel 6][ref1] geacht verzekerd te
      zijn geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel6
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '6'
        hoofdstuk: III
        paragraaf: '1'
  - number: '41.1'
    text: |-
      Degene, die voor of op de dag van het in werking treden van [artikel 6][ref1] de leeftijd van 65 heeft bereikt en
      die – al dan niet onafgebroken – gedurende zes jaren na de voleindiging van zijn 54ste levensjaar in de Nederlandse
      Antillen, Nederland, Suriname of Nederlands Nieuw-Guinea heeft gewoond, heeft recht op ouderdomspensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel6
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '6'
        hoofdstuk: III
        paragraaf: '1'
  - number: '41.2'
    text: 'Het bepaalde in het vorige lid is niet van toepassing op de gehuwde vrouw, behoudens in het geval dat:'
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel41
  - number: 41.2.a
    text: haar echtgenoot de leeftijd van 65 jaar heeft bereikt en geen recht op ouderdomspensioen kan doen gelden; of
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel41
  - number: 41.2.b
    text: haar huwelijk plaatsvond nadat zowel zijzelf als haar echtgenoot recht op ouderdompensioen hadden verkregen; of
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel41
  - number: 41.2.c
    text: zij als kostwinster is aan te merken en haar echtgenoot de leeftijd van 65 jaar nog niet heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel41
  - number: '41.3'
    text: |-
      In afwijking van het bepaalde in [artikel 11, eerste lid][ref1], gaat het krachtens dit artikel toegekende pensioen
      in op de datum van inwerkingtreding van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel11
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '11'
        hoofdstuk: III
        paragraaf: '2'
  - number: '41.4'
    text: |-
      Ten aanzien van het bedrag van het krachtens dit artikel toegekende pensioen blijft [artikel 8][ref1] buiten
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel8
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
  - number: '41.5'
    text: |-
      Het bepaalde in de laatste volzin van [artikel 7][ref1], tweede lid is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel7
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
  - number: '42'
    text: |-
      De voordelen, voortvloeiende uit de [artikelen 40][ref1] en [41][ref2] komen uitsluitend toe aan degene, die


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0028459#Artikel41
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '40'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0028459
        artikel: '41'
        hoofdstuk: VII
  - number: 42.a
    text: Nederlander is, en
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel42
  - number: 42.b
    text: In de Nederlandse Antillen woont.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel42
  - number: '43'
    text: Bij landsbesluit, houdende algemene maatregelen, kan onder daarbij te stellen voorwaarden worden bepaald, dat
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel43
  - number: 43.a
    text: |-
      voor de toepassing van [artikel 42][ref1] niet-Nederlanders met Nederlanders worden gelijkgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel42
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '42'
        hoofdstuk: VII
  - number: 43.b
    text: |-
      voor de toepassing van de [artikelen 40][ref1], [41][ref2] en [42][ref3] het wonen buiten de Nederlandse Antillen
      wordt gelijkgesteld met het wonen in de Nederlandse Antillen.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0028459#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0028459#Artikel42
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '40'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0028459
        artikel: '41'
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0028459
        artikel: '42'
        hoofdstuk: VII
  - number: 43a.1
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze landsverordening bepaalde zijn belast de daartoe bij
      landsbesluit aangewezen personen. Een zodanige aanwijzing wordt bekend gemaakt in de Curaçaosche Courant.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel43a
  - number: 43a.2
    text: |-
      De krachtens het eerste lid aangewezen personen zijn, uitsluitend voor zover dat voor de vervulling van hun taak
      redelijkerwijze noodzakelijk is, bevoegd:
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel43a
  - number: 43a.2.a
    text: 'alle inlichtingen te vragen:'
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel43a
  - number: 43a.2.b
    text: |-
      inzage te verlangen van alle boeken, bescheiden en andere informatiedragers en daarvan afschrift te nemen of deze
      daartoe tijdelijk mee te nemen;
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel43a
  - number: 43a.2.c
    text: |-
      alle plaatsen, met uitzondering van woningen zonder de uitdrukkelijke toestemming van de bewoner, te betreden,
      vergezeld van door hen aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel43a
  - number: 43a.3
    text: |-
      Zo nodig, wordt de toegang tot een plaats als bedoeld in het tweede lid, onderdeel c, verschaft met behulp van de
      sterke arm.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel43a
  - number: 43a.4
    text: |-
      Bij landsbesluit, houdende algemene maatregelen, kunnen regels worden gesteld met betrekking tot de wijze van
      taakuitoefening van de krachtens het eerste lid aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel43a
  - number: 43a.5
    text: |-
      Een ieder is verplicht aan de krachtens het eerste lid aangewezen personen alle medewerking te verlenen die in het
      kader van de toezicht uitoefening op grond van het tweede lid wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel43a
  - number: '44.1'
    text: |-
      Hij, die niet voldoet aan de verplichting, opgelegd in de [artikel 34][ref1], wordt gestraft met hechtenis van ten
      hoogste zes maanden of geldboete van ten hoogste zes honderd gulden.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel34
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '34'
        hoofdstuk: V
  - number: '44.2'
    text: |-
      De werkgever die niet voldoet aan de verplichting, opgelegd in [artikel 58][ref1], wordt gestraft met een hechtenis
      van ten hoogste zes maanden of een geldboete van ten hoogste f 1.000. Deze straf kan worden opgelegd voor elk
      geval, waarin een werkgever voor een zijner werknemers de in dit lid bedoelde verplichting niet nakomt.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel58
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '58'
        hoofdstuk: IX
  - number: '44.3'
    text: |-
      Hij, die niet of niet volledig voldoet aan de verplichting hem opgelegd in [artikel 29A][ref1] wordt gestraft met
      gevangenisstraf van ten hoogste twee jaren of geldboete van ten hoogste tienduizend gulden.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel29a
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: 29a
        hoofdstuk: IV
  - number: '45'
    text: |-
      Hij, die op grond van bij of krachtens deze landsverordening vastgestelde bepalingen gehouden inlichtingen of
      gegevens te verstrekken, een aangifte of mededeling te doen of een verklaring af te leggen en daarbij opzettelijk
      een valse opgave doet dan wel opzettelijk in strijd met bedoelde gehoudenheid iets verzwijgt, wordt gestraft met
      gevangenisstraf van ten hoogste twee jaren.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel45
  - number: '46'
    text: |-
      Hij, die op andere wijze dan door het valselijk opmaken of vervalsen van een geschrift, dat bestemd is tot bewijs
      van enig feit te dienen, opzettelijk een opgave doet in strijd met de waarheid, zulks met het oogmerk om aldus een
      uitkering of een hogere uitkering ingevolge deze landsverordening te verkrijgen, wordt gestraft met gevangenisstraf
      van ten hoogste twee jaren.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel46
  - number: '47'
    text: |-
      Overtredingen van bepalingen van een krachtens deze landsverordening vastgesteld landsbesluit, houdende algemene
      maatregelen, voor zover uitdrukkelijk als strafbaar feit in de zin van dit artikel aangeduid, wordt gestraft met
      hechtenis van ten hoogste een maand of geldboete van ten hoogste honderd gulden.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel47
  - number: '48'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel48
  - number: '49.1'
    text: |-
      Met de opsporing van de bij deze landsverordening strafbaar gestelde feiten zijn, naast de in
      [artikel 184 van het Wetboek van Strafvordering][ref1] bedoelde personen, belast de daartoe bij landsbesluit
      aangewezen ambtenaren. Een zodanige aanwijzing wordt bekend gemaakt in De Curacaosche Courant.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel184
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '184'
  - number: '49.2'
    text: |-
      Bij landsbesluit, houdende algemene maatregelen, kunnen regels worden gesteld met betrekking tot de vereisten
      waaraan de krachtens het eerste lid aangewezen ambtenaren dienen te voldoen.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel49
  - number: '50'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel50
  - number: '51.1'
    text: |-
      De in [artikel 43a][ref1] bedoelde personen zijn verplicht tot geheimhouding van hetgeen hun bij het toezicht op
      de naleving der bij of krachtens deze landsverordening vastgestelde bepalingen is bekend geworden, voor zover die
      geheimhouding niet in strijd is met deze of een andere algemene verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel43a
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: 43a
        hoofdstuk: VIIA
  - number: '51.2'
    text: |-
      Hij, die de bij het vorige lid opgelegde geheimhouding opzettelijk schendt, wordt gestraft met gevangenisstraf van
      ten hoogste zes maanden of geldboete van ten hoogste zeshonderd gulden.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel51
  - number: '51.3'
    text: |-
      Hij, aan wiens schuld schending van die geheimhouding te wijten is, wordt gestraft met hechtenis van ten hoogste
      drie maanden of geldboete van ten hoogste driehonderd gulden.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel51
  - number: '51.4'
    text: Geen vervolging heeft plaats dan op klachte van hen, te wiens aanzien de geheimhouding is geschonden.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel51
  - number: '52'
    text: |-
      De in de [artikelen 44, derde lid][ref1], [45][ref2], [46][ref3] en [51][ref4] bedoelde strafbare feiten worden als
      misdrijven, de in de artikelen 44, eerste en tweede lid, en [47][ref5] bedoelde strafbare feiten als overtredingen
      beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0028459#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0028459#Artikel46
      [ref4]: https://wetten.overheid.nl/BWBR0028459#Artikel51
      [ref5]: https://wetten.overheid.nl/BWBR0028459#Artikel47
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '44'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0028459
        artikel: '45'
        hoofdstuk: VIII
      - id: ref3
        bwb_id: BWBR0028459
        artikel: '46'
        hoofdstuk: VIII
      - id: ref4
        bwb_id: BWBR0028459
        artikel: '51'
        hoofdstuk: VIII
      - id: ref5
        bwb_id: BWBR0028459
        artikel: '47'
        hoofdstuk: VIII
  - number: '53'
    text: |-
      Hetgeen overigens nog ter uitvoering van deze landsverordening nodig is, wordt bij landsbesluit, houdende algemene
      maatregelen, geregeld.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel53
  - number: '54'
    text: |-
      Indien in de pensioenregeling van een pensioenfonds of van een werkgever vóór het tijdstip van inwerkingtreding
      van [artikel 55][ref1] bepalingen zijn opgenomen, krachtens welke op het uit te keren pensioen een wettelijk
      ouderdomspensioen geheel of gedeeltelijk in mindering wordt gebracht, dient bij de toepassing van deze bepalingen
      in acht te worden genomen:


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel55
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '55'
        hoofdstuk: IX
  - number: '54.1'
    text: |-
      dat het uit te keren of reeds toegekende pensioen met niet meer wordt verminderd dan met het deel van het
      Ouderdomspensioen, dat evenredig is aan het gedeelte van.de ingevolge deze landsverordening verschuldigde premie,
      dat de werkgever of het pensioenfonds voor zijn rekening neemt.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel54
  - number: '54.2'
    text: |-
      dat, behoudens in door de minister aan te wijzen gevallen, een verhoging van het ouderdomspensioen ingevolge deze
      landsverordening, welke plaats vindt na de datum van beëindiging van de actieve deelneming aan de pensioenregeling,
      niet op het pensioen in mindering wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel54
  - number: '54.3'
    text: |-
      dat niet in mindering mag worden gebracht 2% van het ouderdomspensioen voor elk jaar, dat de pensioengerechtigde na
      zijn pensionering de volle premie voor eigen rekening heeft betaald.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel54
  - number: '54.4'
    text: |-
      dat niet in mindering mag worden gebracht 2% van het ouderdomspensioen van de weduwe van de pensioengerechtigde
      voor elk jaar, dat de pensioengerechtigde na zijn pensionering de volle premie voor eigen rekening heeft betaald.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel54
  - number: '54.5'
    text: |-
      dat het uit te keren reeds toegekende pensioen, indien dat wegens het niet-bereiken van het voor een volledig
      pensioen benodigde aantal dienst- of deelnemersjaren niet volledig is, met niet meer wordt verminderd dan met
      het deel van het voor vermindering in aanmerking komende gedeelte van het ouderdomspensioen ingevolge deze
      landsverordening, dat evenredig is aan het deel, dat het door de werkgever of het pensioenfonds uit te keren
      pensioen uitmaakt van het volledig pensioen.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel54
  - number: '54.6'
    text: |-
      dat indien een ouderdomspensioen uit meer dan één vervulde dienstbetrekking wordt genoten en op grond van het
      bepaalde in het eerste lid van dit artikel meerdere werkgevers en (of) meerdere pensioenfondsen een korting
      op het door hen uit te keren ouderdomspensioen kunnen toepassen, het totale voor vermindering in aanmerking
      komende gedeelte van het ingevolge deze landsverordening toegekende ouderdomspensioen over deze werkgevers en
      (of) pensioenfondsen dient te worden verdeeld in verhouding tot het aantal dienst of deelnemersjaren van de
      pensioengerechtigde bij elk dezer werkgevers en (of) pensioenfondsen.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel54
  - number: '54.7'
    text: |-
      dat niet in mindering mogen worden gebracht aanpassingen van de pensioenbedragen ingevolge het bepaalde in
      [artikel 7, lid 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel7
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
  - number: '55.1'
    text: 'Wijzigingen in de pensioenregeling van een pensioenfonds of werkgever, waarbij:'
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel55
  - number: 55.1.a
    text: |-
      bepalingen worden opgenomen krachtens welke het ouderdomspensioen ingevolge deze landsverordening geheel of
      gedeeltelijk in mindering wordt gebracht op het door het fonds of de werkgever in uitzicht gestelde of reeds
      toegekende pensioen dan wel
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel55
  - number: 55.1.b
    text: |-
      bepalingen, als bedoeld in [artikel 54][ref1], worden herzien dan wel hieraan een nadere inhoud wordt gegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel54
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '54'
        hoofdstuk: IX
  - number: 55.1.c
    text: |-
      de pensioenregeling, geldend voor de reeds in dienst zijnde werknemers, wordt aangepast aan de voorzieningen
      ingevolge deze landsverordening,
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel55
  - number: '55.2'
    text: |-
      Indien in een Pensioenregeling, bepalingen worden opgenomen als bedoeld in lid 1 onder a, dient bij de toepassing
      van deze bepalingen in acht te worden genomen, dat, behoudens in door de minister aan te wijzen gevallen, een
      verhoging van het ouderdomspensioen ingevolge deze landsverordening, welke plaats vindt na beëindiging van de
      actieve deelneming aan de Pensioenregeling niet op het pensioen in mindering wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel55
  - number: '56'
    text: |-
      Ter uitvoering van het bepaalde in de [artikelen 54][ref1] en [55][ref2] kunnen bij landsbesluit, houdende algemene
      maatregelen, nadere regelen worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0028459#Artikel55
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '54'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0028459
        artikel: '55'
        hoofdstuk: IX
  - number: '57'
    text: |-
      De wijzigingen, als bedoeld in [artikel 55][ref1], waarvoor de goedkeuring van de Minister is verkregen, zijn
      bindend voor al degenen, die onder de betreffende pensioenregeling zijn gepensioneerd, dan wel uitzicht hebben op
      een pensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel55
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '55'
        hoofdstuk: IX
  - number: '58'
    text: |-
      Werkgevers, die personen in dienst hebben, die krachtens deze landsverordening verzekerd zijn, betalen aan deze
      werknemers ter compensering van de door hem verschuldigde premie een toeslag op het loon. Deze toeslag bedraagt
      tenminste 7% van het loon waarover premie krachtens deze landsverordening verschuldigd is
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel58
  - number: '59'
    text: |-
      Wanneer het Ouderdomsfonds tijdelijk niet voldoende middelen heeft tot dekking van de uitkeringen en kosten, welke
      op grond van het [tweede lid van artikel 24][ref1] ten laste van dit fonds komen, verstrekt het Land renteloze
      voorschotten aan het fonds onder door de Minister en de Minister van Financiën te stellen voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel24
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '24'
        hoofdstuk: IV
  - number: '60'
    text: |-
      Alle ingevolge deze landsverordening opgemaakte en overgelegde stukken, verzoekschriften en beschikkingen zijn vrij
      van het recht van zegel en van de formaliteit van registratie.
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel60
  - number: '61'
    text: |-
      Deze landsverordening kan worden aangehaald als «Landsverordening Algemene Ouderdomsverzekering». De artikelen
      van deze landsverordening treden in werking op een bij landsbesluit te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen verschillend kan worden gesteld, met dien verstande, dat [artikel 55][ref1] in werking
      treedt met ingang van de dag na die der afkondiging van deze landsverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel55
    url: https://wetten.overheid.nl/BWBR0028459/2010-10-10#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '55'
        hoofdstuk: IX
