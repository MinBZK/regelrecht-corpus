  - number: '44'
    text: |-
      1 Hij, die niet voldoet aan de verplichting, opgelegd op grond van [artikel 34][ref1], wordt gestraft met hechtenis
      van ten hoogste zes maanden of geldboete van de eerste categorie.

      2 De werkgever die niet voldoet aan de verplichting, opgelegd in [artikel 58][ref2], wordt gestraft met een
      hechtenis van ten hoogste zes maanden of een geldboete van de eerste categorie. Deze straf kan worden opgelegd voor
      elk geval, waarin een werkgever voor een zijner werknemers de in dit lid bedoelde verplichting niet nakomt.

      3 Hij, die niet of niet volledig voldoet aan de verplichting hem opgelegd in [artikel 29a][ref3] wordt gestraft met
      gevangenisstraf van ten hoogste twee jaren of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0028459#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0028459#Artikel29a
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel44
