        artikel: '14'
  - number: '8'
    text: |-
      1 Op het bedrag, bedoeld in [artikel 7][ref1], wordt een korting toegepast van 2% voor elk kalenderjaar dat de
      pensioengerechtigde na het bereiken van de leeftijd van 15 jaar, doch voor het bereiken van de leeftijd van 65
      jaar, niet verzekerd is geweest.

      2 Bij ministeriële regeling kunnen regels worden gesteld over de herleiding van gedeelten van kalenderjaren,
      bedoeld in het eerste lid, en [artikel 7a][ref2], tot gehele kalenderjaren.

      3 Na de korting, bedoeld in het eerste lid, wordt het ouderdomspensioen afgerond op hele dollars.


