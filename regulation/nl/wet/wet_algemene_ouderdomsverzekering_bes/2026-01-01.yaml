      Op de persoon die op de dag voor de datum van inwerkingtreding van [artikel XIIIa, onderdeel A, van de Verzamelwet
      SZW 2017](onbekend) recht heeft op een partnertoeslag op grond van deze wet en toepassing van dat artikel tot geen
      of een lagere toeslag leidt, blijven [artikel 7a, eerste en derde lid][ref1], zoals deze luidden op de dag voor de
      datum van inwerkingtreding, van toepassing gedurende zes maanden na de dag van inwerkingtreding van artikel XIIIa,
      onderdeel A, van de Verzamelwet SZW 2017.


