  - number: '15'
    text: |-
      De termijnen van het ouderdomspensioen, die niet zijn ingevorderd binnen twee jaar na de eerste dag waarop zij
      konden worden ingevorderd, worden niet meer uitbetaald.
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel15
  - number: '16'
    text: |-
      1 Behoudens het bepaalde in het tweede lid zijn de eenmaal uitbetaalde termijnen van het ouderdomspensioen niet
      vatbaar voor terugvordering.

      2 Indien het ouderdomspensioen op grond van het bepaalde in [artikel 12, derde lid][ref1] met terugwerkende kracht
      is herzien of ingetrokken, kan hetgeen aan pensioen te veel of ten onrechte is uitbetaald, geheel of gedeeltelijk
      worden teruggevorderd, dan wel op het later uit te betalen pensioen in mindering worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel12
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel16
    references:
