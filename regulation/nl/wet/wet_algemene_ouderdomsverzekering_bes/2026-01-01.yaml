  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. *Onze Minister:* Onze Minister van Sociale Zaken en Werkgelegenheid;

      b. *ingezetene:* hij die in de openbare lichamen Bonaire, Sint Eustatius of Saba woont;

      c. *inspecteur:* de bij regeling van Onze Minister van Financiën als zodanig aangewezen functionaris;

      d. *ontvanger:* de bij regeling van Onze Minister van Financiën als zodanig aangewezen functionaris;

      e. *uitreiziger:* persoon ten aanzien van wie op grond van een melding van de opsporingsdiensten of
      inlichtingen- en veiligheidsdiensten, gericht aan Onze Minister, is gebleken dat het gegronde vermoeden
      bestaat dat deze persoon zich buiten de openbare lichamen Bonaire, Sint Eustatius en Saba bevindt met het
      doel om zich aan te sluiten bij een organisatie die is geplaatst op de lijst van organisaties, bedoeld in
      [artikel 14, vierde lid, van de Rijkswet op het Nederlanderschap][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel14
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel1
