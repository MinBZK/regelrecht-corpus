  - number: '53'
    text: Hetgeen overigens nog ter uitvoering van deze wet nodig is, wordt bij algemene maatregel van bestuur geregeld.
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel53
  - number: '54'
    text: |-
      1 Indien in de pensioenregeling van een pensioenfonds of van een werkgever vóór 28 mei 1960 bepalingen zijn
      opgenomen op grond waarvan op het uit te keren pensioen een wettelijk ouderdomspensioen geheel of gedeeltelijk in
      mindering wordt gebracht, dient bij de toepassing van deze bepalingen in acht te worden genomen:

      a. dat het uit te keren of reeds toegekende pensioen met niet meer wordt verminderd dan met het deel van het
      ouderdomspensioen, dat evenredig is aan het gedeelte van de op grond van deze wet verschuldigde premie, dat de
      werkgever of het pensioenfonds voor zijn rekening neemt;

      b. dat, behoudens in door Onze Minister aan te wijzen gevallen, een verhoging van het ouderdomspensioen op grond
      van deze wet, die plaats vindt na de datum van beëindiging van de actieve deelneming aan de pensioenregeling, niet
      op het pensioen in mindering wordt gebracht;

      c. dat niet in mindering mag worden gebracht 2% van het ouderdomspensioen voor elk jaar, dat de pensioengerechtigde
      na zijn pensionering de volle premie voor eigen rekening heeft betaald;

      d. dat niet in mindering mag worden gebracht 2% van het ouderdomspensioen van de weduwe van de pensioengerechtigde
      voor elk jaar, dat de pensioengerechtigde na zijn pensionering de volle premie voor eigen rekening heeft betaald;

      e. dat het uit te keren reeds toegekende pensioen, indien dat wegens het niet bereiken van het voor een volledig
      pensioen benodigde aantal dienst- of deelnemersjaren niet volledig is, met niet meer wordt verminderd dan met het
      deel van het voor vermindering in aanmerking komende gedeelte van het ouderdomspensioen op grond van deze wet, dat
      evenredig is aan het deel, dat het door de werkgever of het pensioenfonds uit te keren pensioen uitmaakt van het
      volledig pensioen;

      f. dat indien een ouderdomspensioen uit meer dan één vervulde dienstbetrekking wordt genoten en op grond van
      onderdeel a van dit artikel meerdere werkgevers of meerdere pensioenfondsen een korting op het door hen uit te
      keren ouderdomspensioen kunnen toepassen, het totale voor vermindering in aanmerking komende gedeelte van het op
      grond van deze wet toegekende ouderdomspensioen over deze werkgevers of pensioenfondsen dient te worden verdeeld
      in verhouding tot het aantal dienst- of deelnemersjaren van de pensioengerechtigde bij elk van deze werkgevers
      of pensioenfondsen;

      g. dat niet in mindering mogen worden gebracht aanpassingen van de pensioenbedragen op grond van
      [artikel 7, tweede lid][ref1].

      2 Indien in een pensioenregeling van een pensioenfonds of van een werkgever vóór 28 mei 1960 geen bepalingen zijn
      opgenomen als bedoeld in dit artikellid en op 1 september 1960 nog geen wijzigingen zijn aangebracht als bedoeld in
      [artikel 55][ref2], kan niettemin het ouderdomspensioen geheel of gedeeltelijk in mindering worden gebracht op het
      door het pensioenfonds of de werkgever uit te keren of reeds toegekende pensioen met inachtneming van de bepalingen
      van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0028459#Artikel55
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel54
    references:
