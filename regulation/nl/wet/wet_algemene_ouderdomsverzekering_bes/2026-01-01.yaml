  - number: 7b
    text: |-
      1 Bij ministeriële regeling kan worden bepaald dat degene, die woonachtig is in een van de openbare lichamen
      Bonaire, Sint Eustatius of Saba en die recht heeft op een ouderdomspensioen, tevens recht heeft op een
      tegemoetkoming die is gerelateerd aan het prijsniveau van het openbare lichaam waarin de pensioengerechtigde
      woonachtig is, indien het prijsniveau in het desbetreffende openbare lichaam hoger ligt dan het prijsniveau van het
      openbare lichaam met het laagste prijsniveau.

      2 De tegemoetkoming, bedoeld in het eerste lid, wordt niet beschouwd als ouderdomspensioen op grond van deze wet.

      3 De hoogte van de tegemoetkoming, die per openbaar lichaam kan verschillen, wordt bij ministeriële regeling
      vastgesteld.

      4 Bij ministeriële regeling kunnen regels worden gesteld over de wijze van betaling van de tegemoetkoming.
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel7b
  - number: 7c
    text: |-
      1 Geen recht op een ouderdomspensioen heeft de persoon die een uitreiziger is.

      2 Voor de persoon, bedoeld in het eerste lid, herleeft, onverminderd de bepalingen van deze wet, het recht op
      een ouderdomspensioen op de dag dat niet langer het gegronde vermoeden bestaat dat hij zich buiten de openbare
      lichamen Bonaire, Sint Eustatius en Saba bevindt met het doel zich aan te sluiten bij een organisatie als bedoeld
      in [artikel 14, vierde lid, van de Rijkswet op het Nederlanderschap][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel14
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel7c
