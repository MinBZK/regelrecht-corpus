        artikel: '55'
        hoofdstuk: IX
  - number: '55'
    text: |-
      1 Wijzigingen in de pensioenregeling van een pensioenfonds of werkgever, waarbij:

      a. bepalingen worden opgenomen op grond van welke het ouderdomspensioen op grond van deze wet geheel of
      gedeeltelijk in mindering wordt gebracht op het door het fonds of de werkgever in uitzicht gestelde of reeds
      toegekende pensioen dan wel

      b. bepalingen, als bedoeld in [artikel 54][ref1], worden herzien dan wel hieraan een nadere inhoud wordt gegeven;

      c. de pensioenregeling, geldend voor de reeds in dienst zijnde werknemers, wordt aangepast aan de voorzieningen op
      grond van deze wet,

      behoeven de goedkeuring van Onze Minister.

      2 Indien in een Pensioenregeling, bepalingen worden opgenomen als bedoeld in het eerste lid, onderdeel a, dient
      bij de toepassing van deze bepalingen in acht te worden genomen, dat, behoudens in door Onze Minister aan te wijzen
      gevallen, een verhoging van het ouderdomspensioen op grond van deze wet, die plaats vindt na beëindiging van de
      actieve deelneming aan de Pensioenregeling niet op het pensioen in mindering wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel54
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '54'
        hoofdstuk: IX
  - number: '56'
    text: |-
      Ter uitvoering van het bepaalde in de [artikelen 54][ref1] en [55][ref2] kunnen bij algemene maatregel van bestuur
      nadere regels worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0028459#Artikel55
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '54'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0028459
        artikel: '55'
        hoofdstuk: IX
  - number: '57'
    text: |-
      De wijzigingen, bedoeld in [artikel 55][ref1], waarvoor de goedkeuring van Onze Minister is verkregen, zijn bindend
      voor al degenen, die onder de desbetreffende pensioenregeling zijn gepensioneerd, dan wel recht krijgen op een
      pensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel55
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '55'
        hoofdstuk: IX
  - number: '60'
    text: |-
      Alle op grond van deze wet opgemaakte en overgelegde stukken, verzoekschriften en beschikkingen zijn vrij van het
      recht van zegel en van de formaliteit van registratie.
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel60
