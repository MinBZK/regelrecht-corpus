  - number: '30'
    text: |-
      Voor zover op grond van deze wet niet anders is bepaald is ten aanzien van de premieheffing op grond van
      [artikel 26][ref1] en de invordering daarvan [hoofdstuk VIII van de Belastingwet BES][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0029244#HoofdstukVIII
