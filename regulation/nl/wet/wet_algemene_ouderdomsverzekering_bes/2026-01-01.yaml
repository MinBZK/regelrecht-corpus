  - number: 8a
    text: |-
      1 Indien uit de door het Centraal Bureau voor de Statistiek vastgestelde consumentenprijsindexcijfers voor de
      openbare lichamen Bonaire, Sint Eustatius en Saba blijkt, dat het prijsindexcijfer voor het derde kwartaal van het
      lopende jaar, vergeleken met het prijsindexcijfer voor het derde kwartaal van het voorafgaande jaar is gestegen
      of gedaald, stelt Onze Minister bedragen vast, die met ingang van 1 januari van het komende jaar in de plaats
      treden van de in de [artikelen 7][ref1] en [7a, eerste en derde lid, onderdeel e][ref2], genoemde bedragen. Onze
      Minister bepaalt welke consumentenprijsindexcijfers voor de toepassing van de eerste zin worden gebruikt. De
      consumentenprijsindexcijfers kunnen voor de onderscheiden openbare lichamen en voor belanghebbenden die woonachtig
      zijn buiten de openbare lichamen, verschillend zijn.

      2 Indien er naar het oordeel van Onze Minister bijzondere omstandigheden zijn, kunnen de bedragen, bedoeld in het
      eerste lid, bij ministeriële regeling met ingang van een bij die regeling aan te geven datum worden gewijzigd.
      De bedragen, bedoeld in het eerste lid, kunnen door Onze Minister voor verschillende categorieën van huishoudens
      verschillend worden vastgesteld. Bij ministeriële regeling kunnen daartoe nadere regels worden vastgesteld. Onze
      Minister kan het bestuurscollege van het betrokken openbaar lichaam in dat verband om advies vragen.

      3 De overeenkomstig het eerste lid herziene dan wel overeenkomstig het tweede lid gewijzigde of
      vastgestelde bedragen treden in de plaats van de bedragen, genoemd in de [artikelen 7][ref3] en
      [7a, eerste en derde lid, onderdeel e][ref4].

      4 Indien een wijziging als bedoeld in het tweede lid samenvalt met een herziening als bedoeld in het eerste lid,
      wordt het bedrag voorafgaande aan de wijziging herzien en geschiedt de herziening bij de in het tweede lid bedoelde
      ministeriële regeling.


