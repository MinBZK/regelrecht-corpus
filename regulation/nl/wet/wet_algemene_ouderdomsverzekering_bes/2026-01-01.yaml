        artikel: '26'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0029244
        hoofdstuk: VIII
  - number: '34'
    text: |-
      1 De pensioengerechtigde, zijn echtgenoot en zijn wettelijke vertegenwoordiger of het orgaan waaraan op grond van
      [artikel 14][ref1] ouderdomspensioen wordt uitbetaald, zijn verplicht aan Onze Minister op zijn verzoek of uit
      eigen beweging alle feiten en omstandigheden mee te delen, waarvan hun redelijkerwijs duidelijk moet zijn dat zij
      van invloed kunnen zijn op het recht op pensioen, de hoogte van het pensioen of op het bedrag van het pensioen, dat
      wordt betaald.

      2 De verplichting, bedoeld in het eerste lid, geldt niet indien feiten en omstandigheden door Onze Minister kunnen
      worden vastgesteld op grond van bij wettelijk voorschrift als authentiek aangemerkte gegevens of door Onze Minister
      kunnen worden verkregen uit bij ministeriële regeling aan te wijzen administraties. Bij ministeriële regeling kan
      worden bepaald voor welke gegevens de vorige zin van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel14
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '14'
        hoofdstuk: III
        paragraaf: '2'
  - number: '35'
    text: |-
      1 Een ieder is verplicht aan Onze Minister door hem gevraagde inlichtingen te geven in het kader van
      deze wet. De door Onze Minister verlangde inlichtingen omvatten ten minste de naam en de voornamen
      van de persoon van wie de inlichtingen worden gevraagd en het identificatienummer dat hem op grond van
      [artikel 8.86, negende lid, van de Belastingwet BES][ref1] is toegekend dan wel van hem bekend is.

      2 De inlichtingen moeten desgevraagd schriftelijk worden verstrekt binnen een door Onze Minister schriftelijk te
      stellen termijn.

      3 Een ieder is verplicht om aan Onze Minister desgevraagd inzage te verlenen van boeken, bescheiden en andere
      informatiedragers, voor zover dit noodzakelijk is voor de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8.86
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8.86'
  - number: '36'
    text: |-
      1 Publiekrechtelijke lichamen zijn verplicht kosteloos hun medewerking te verlenen tot het verkrijgen van de
      inlichtingen, benodigd voor de uitvoering van deze wet.

      2 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel36
  - number: 36a
    text: |-
      1 Bij ministeriële regeling kunnen controlevoorschriften worden vastgesteld. Deze voorschriften gaan niet verder
      dan strikt noodzakelijk is voor een juiste uitvoering van deze wet.

      2 De pensioengerechtigde, zijn echtgenoot en zijn wettelijke vertegenwoordiger of het orgaan waaraan op grond van
      [artikel 14][ref1] ouderdomspensioen wordt uitbetaald, is verplicht de voorschriften op te volgen en anderszins aan
      Onze Minister desgevraagd de medewerking te verlenen die redelijkerwijs nodig is voor de uitvoering van deze wet.

      3 De pensioengerechtigde, zijn echtgenoot, dan wel zijn wettelijke vertegenwoordiger, onthouden zich van zeer
      ernstige misdragingen jegens de met de uitvoering van deze wet belaste personen en instanties tijdens het
      verrichten van hun werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel14
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel36a
