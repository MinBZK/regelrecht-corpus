  - number: '9'
    text: |-
      1 Het ouderdomspensioen alsmede een verhoging van het ouderdomspensioen wordt op aanvraag toegekend door Onze
      Minister.

      2 In afwijking van het bepaalde in het vorige lid is Onze Minister bevoegd het ouderdomspensioen alsmede een
      verhoging van het ouderdomspensioen ambtshalve toe te kennen.
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel9
  - number: '10'
    text: |-
      De aanvraag om ouderdomspensioen of om een verhoging van het ouderdomspensioen wordt ingediend bij Onze Minister
      door middel van een door Onze Minister beschikbaar gesteld aanvraagformulier.
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel10
  - number: '11'
    text: |-
      1 Het ouderdomspensioen gaat in op de eerste dag van de maand volgende op de maand, waarin de verzekerde aan de
      voorwaarden voor het recht op ouderdomspensioen voldoet.

      2 In afwijking van het bepaalde in het eerste lid kan een ouderdomspensioen niet eerder ingaan dan een jaar vóór de
      eerste dag van de maand, volgende op de maand, waarin de aanvraag werd ingediend of waarin de ambtshalve toekenning
      plaats vond. Onze Minister kan voor bijzondere gevallen van het bepaalde in de vorige zin afwijken.
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel11
  - number: '12'
    text: |-
      1 Het ouderdomspensioen wordt door Onze Minister ingetrokken of herzien, wanneer degene aan wie het is toegekend,
      ingevolge het op grond van deze wet bepaalde, daarvoor niet of niet of niet meer in aanmerking komt, dan wel voor
      een hoger of lager ouderdomspensioen in aanmerking komt.

      2 De herziening van het ouderdomspensioen, die voortvloeit uit een wijziging van de omstandigheden en die een
      verhoging van dit pensioen tot gevolg heeft, gaat in op de eerste dag van de maand, volgende op de maand waarin
      de wijziging van die omstandigheden heeft plaats gevonden. Het bepaalde in [artikel 11, tweede lid][ref1], is van
      overeenkomstige toepassing.

      3 De intrekking van het ouderdomspensioen of de herziening daarvan, die een verlaging van dit pensioen tot gevolg
      heeft, gaat, behoudens in bij algemene maatregel van bestuur aan te wijzen gevallen, in op de eerste dag van de
      maand, volgende op die, waarin de dag van de dagtekening van de beschikking is gelegen.

      4 De herziening van het ouderdomspensioen in verband met [artikel 8a, eerste en tweede lid][ref2], gaat, in
      afwijking van het bepaalde in het tweede en derde lid, in op de dag, met ingang waarvan op grond van artikel
      8a, eerste en tweede lid, de in de [artikelen 7][ref3], [7a, eerste en derde lid, onderdeel e][ref4], en
      [7b, eerste lid][ref5], genoemde bedragen van het ouderdomspensioen zijn herzien.

      5 Ter uitvoering van het bepaalde in dit artikel kunnen bij algemene maatregel van bestuur nadere voorschriften
      worden gegeven. Daarbij kunnen tevens nadere regels worden gesteld met betrekking tot schorsing en opschorting van
      de uitbetaling van het ouderdomspensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0028459#Artikel8a
