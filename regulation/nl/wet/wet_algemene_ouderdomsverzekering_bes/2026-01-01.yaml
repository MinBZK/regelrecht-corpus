  - number: '6'
    text: |-
      Degene, die verzekerd is geweest en de leeftijd van 65 jaar heeft bereikt, heeft overeenkomstig de bepalingen van
      deze wet recht op ouderdomspensioen.
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel6
  - number: '7'
    text: |-
      Het ouderdomspensioen bedraagt USD 365

      per maand.
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel7
  - number: 7a
    text: |-
      1 Degene aan wie een ouderdomspensioen is toegekend en die gehuwd is met iemand die jonger is dan 65 jaar heeft
      recht op een toeslag van ten hoogste USD 250

      per maand, voorzover het gezamenlijk inkomen niet meer dan USD 12.844  indien belanghebbende woonachtig is in het
      openbaar lichaam Bonaire, USD 14.521  indien belanghebbende woonachtig is in het openbaar lichaam Sint Eustatius,
      USD 14.677  indien belanghebbende woonachtig is in het openbaar lichaam Saba en USD 12.844  indien belanghebbende
      woonachtig is buiten de openbare lichamen Bonaire, Sint Eustatius en Saba per jaar bedraagt.

      2 De toeslag wordt door Onze Minister betaalbaar gesteld aan degene met wie degene aan wie het ouderdomspensioen is
      toegekend, gehuwd is. De betaling geschiedt per kalendermaand.

      3 De toeslag eindigt:

      a. wanneer degene met wie degene aan wie het ouderdomspensioen is toegekend, gehuwd is, de leeftijd van 65 jaar
      heeft bereikt;

      b. bij ontbinding van het huwelijk in de gevallen, genoemd in [artikel 149 van het Burgerlijk Wetboek BES][ref1];

      c. bij overlijden van degene aan wie het ouderdomspensioen is toegekend of van degene met wie degene aan wie het
      ouderdomspensioen is toegekend, gehuwd is;

      d. bij intrekking van het pensioen of de toeslag;

      e. wanneer het gezamenlijk inkomen, bedoeld in het eerste lid, meer dan USD 12.844  indien belanghebbende
      woonachtig is in het openbaar lichaam Bonaire, USD 14.521  indien belanghebbende woonachtig is in het openbaar
      lichaam Sint Eustatius, USD 14.677  indien belanghebbende woonachtig is in het openbaar lichaam Saba en USD 12.844
      indien belanghebbende woonachtig is buiten de openbare lichamen Bonaire, Sint Eustatius en Saba per jaar bedraagt;

      f. wanneer de partner van degene aan wie een ouderdomspensioen is toegekend een uitreiziger is.

      4 Onder inkomen als bedoeld in het eerste lid en het derde lid, onderdeel e, wordt verstaan het belastbaar inkomen,
      bedoeld in [artikel 3, tweede lid, van de Wet inkomstenbelasting BES][ref2].

      5 De toeslag eindigt met ingang van de maand, volgende op die, waarin het feit of de omstandigheid, bedoeld in het
      derde lid, heeft plaatsgevonden, dan wel is ontstaan, die het einde van de toeslag ten gevolge heeft.

      6 De [artikelen 12][ref3], [13, tweede tot en met vierde lid][ref4], [14][ref5], [15][ref6],
      [16][ref7], [18][ref8], [19][ref9], [22a tot en met 22c][ref10], [23][ref11], [34][ref12], [37][ref13],
      [44, eerste lid][ref14], [47][ref15] en [52][ref16] zijn van overeenkomstige toepassing op de toeslag.

      7 Op de toeslag wordt een korting toegepast van 2% voor elk kalenderjaar dat degene die gehuwd is met de
      pensioengerechtigde, behoudens in bij algemene maatregel van bestuur aan te wijzen gevallen, na het bereiken
      van zijn 15-jarige leeftijd, doch voor het bereiken van de leeftijd van 65 jaar van de pensioengerechtigde, niet
      verzekerd is geweest.

      8 [Artikel 20][ref17] is van overeenkomstige toepassing op de toeslag op grond van dit artikel met dien verstande
      dat bij overlijden van degene, met wie degene aan wie het ouderdomspensioen is toegekend, is gehuwd, een bedrag van
      viermaal het ouderdomspensioen, genoemd in [artikel 7, eerste lid][ref18], wordt uitbetaald.

      9 Voor de persoon, bedoeld in het derde lid, onderdeel f, herleeft, onverminderd de bepalingen van deze wet, het
      recht op een de toeslag, bedoeld in het eerste lid, op de dag dat niet langer het gegronde vermoeden bestaat dat
      hij zich buiten de openbare lichamen Bonaire, Sint Eustatius en Saba bevindt met het doel zich aan te sluiten bij
      een organisatie als bedoeld in [artikel 14, vierde lid, van de Rijkswet op het Nederlanderschap][ref19].


