        artikel: '14'
  - number: '2'
    text: |-
      1 Waar iemand woont, wordt naar de feitelijke omstandigheden beoordeeld, voor zover in de volgende leden niet
      anders is bepaald.

      2 Degenen, die de openbare lichamen Bonaire, Sint Eustatius of Saba als woonplaats verlaten, maar binnen een
      jaar zich daar opnieuw vestigen, worden geacht ook tijdens hun afwezigheid in de openbare lichamen Bonaire,
      Sint Eustatius of Saba te hebben gewoond, tenzij blijkt, dat zij tijdens hun afwezigheid op het grondgebied van
      Nederland, Aruba, Curaçao, Sint Maarten of van een andere Mogendheid hebben gewoond.

      3 Degenen, die tijdelijk binnen de openbare lichamen Bonaire, Sint Eustatius of Saba verblijven, maar hetzij
      Nederland, Aruba, Curaçao of Sint Maarten als woonplaats hebben, hetzij geacht worden daar te wonen op grond van
      de daar geldende wetgeving inzake de inkomstenbelasting, worden als niet binnen de openbare lichamen Bonaire, Sint
      Eustatius of Saba wonend beschouwd, indien hun verblijf minder dan één jaar duurt.
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel2
  - number: 2a
    text: |-
      Voor de toepassing van deze wet wordt onder echtgenoot mede verstaan de persoon met wie de verzekerde ongehuwd
      samenwoont of degene van wie de verzekerde het kind erkent. Er is sprake van ongehuwd samenwonen als twee ongehuwde
      meerderjarige personen een gezamenlijke huishouding voeren, tenzij er tussen deze personen bloedverwantschap
      bestaat in de eerste graad. Voor de toepassing van de tweede zin wordt mede als ongehuwd aangemerkt degene die
      duurzaam gescheiden leeft van de persoon met wie hij gehuwd is. Van een gezamenlijke huishouding als bedoeld in
      de tweede zin is sprake indien de betrokkenen hun hoofdverblijf hebben in dezelfde woning en blijk geven zorg te
      dragen voor elkaar door middel van het leveren van een bijdrage in de kosten van de huishouding dan wel op andere
      wijze in elkaars verzorging voorzien.
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel2a
  - number: '3'
    text: |-
      1 Onze Minister is belast met de uitvoering van deze wet, met dien verstande, dat de heffing van de premie
      geschiedt door de inspecteur en de invordering daarvan door de ontvanger.

      2 Voor zover de uitvoering van de in deze wet geregelde verzekering geschiedt door Onze Minister, kunnen bij
      algemene maatregel van bestuur nadere regels worden gesteld voor de te voeren administratie en de registratie van
      de verzekerden.
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel3
  - number: '4'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de uitvoering van deze
      wet.
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel4
  - number: '5'
    text: |-
      1 Verzekerd overeenkomstig de bepalingen van deze wet is degene, die de leeftijd van vijftien jaar, doch niet die
      van 65 jaar heeft bereikt, indien hij:

      a. ingezetene is;

      b. geen ingezetene is, maar wiens belastbare som als bedoeld in
      [artikel 24, eerste lid, van de Wet inkomstenbelasting BES][ref1] geheel of nagenoeg geheel binnen de openbare
      lichamen Bonaire, Sint Eustatius of Saba aan de heffing van inkomstenbelasting of loonbelasting is onderworpen;

      c. geen ingezetene is en evenmin geacht kan worden blijvend buiten de openbare lichamen Bonaire, Sint Eustatius of
      Saba te wonen, doch terzake van buiten de openbare lichamen Bonaire, Sint Eustatius of Saba verrichte arbeid wedde
      of loon geniet ten laste van de openbare lichamen Bonaire, Sint Eustatius of Saba, mits hij Nederlander is.

      2 Niet verzekerd is de vreemdeling, die niet geacht kan worden blijvend binnen de openbare lichamen Bonaire, Sint
      Eustatius of Saba te wonen en die terzake van binnen de openbare lichamen Bonaire, Sint Eustatius of Saba verrichte
      arbeid wedde of loon geniet ten laste van een andere Mogendheid.

      3 Bij of krachtens algemene maatregel van bestuur kunnen personen, die niet op grond van het eerste lid verzekerd
      zijn, als verzekerden op grond van deze wet worden aangemerkt.

      4 Bij algemene maatregel van bestuur kan worden bepaald dat het eerste lid niet van toepassing is:

      a. ten aanzien van vreemdelingen;

      b. ter voorkoming van samenloop van de verzekering op grond van deze wet met een overeenkomstige regeling buiten de
      openbare lichamen Bonaire, Sint Eustatius of Saba;

      c. in de gevallen van tijdelijk verblijf of tijdelijke werkzaamheden binnen de openbare lichamen Bonaire, Sint
      Eustatius of Saba;

      d. ten aanzien van echtgenoten en overige gezinsleden van de in het tweede lid en van de in dit lid onder b. en c.
      bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel24
