  - number: '41'
    text: |-
      1 Degene, die vóór of op 1 september 1960 de leeftijd van 15 heeft bereikt en die – al dan niet onafgebroken –
      gedurende zes jaren na de voleindiging van zijn 54ste levensjaar in Aruba, Curaçao, Sint Maarten, de openbare
      lichamen Bonaire, Sint Eustatius of Saba, Nederland, Suriname of Nederlands Nieuw-Guinea heeft gewoond, heeft recht
      op ouderdomspensioen.

      2 Het bepaalde in het vorige lid is niet van toepassing op de gehuwde vrouw, behoudens in het geval waarin:

      a. haar echtgenoot de leeftijd van 65 jaar heeft bereikt en geen recht op ouderdomspensioen kan doen gelden; of

      b. haar huwelijk plaatsvond nadat zowel zijzelf als haar echtgenoot recht op ouderdompensioen hadden verkregen; of

      c. zij als kostwinster is aan te merken en haar echtgenoot de leeftijd van 65 jaar nog niet heeft bereikt.

      3 In afwijking van het bepaalde in [artikel 11, eerste lid][ref1], gaat het op grond van dit artikel toegekende
      pensioen in op 1 september 1960.

      4 Ten aanzien van het bedrag van het op grond van dit artikel toegekende pensioen blijft [artikel 8][ref2] buiten
      toepassing.

      5 Het bepaalde in [artikel 8a, eerste en tweede lid][ref3] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0028459#Artikel8
