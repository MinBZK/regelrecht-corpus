      a. voor de toepassing van [artikel 42][ref1] niet-Nederlanders met Nederlanders worden gelijkgesteld;

      b. voor de toepassing van de [artikelen 40][ref2], [41][ref3] en [42][ref4] het wonen buiten de openbare lichamen
      Bonaire, Sint Eustatius of Saba wordt gelijkgesteld met het wonen in de openbare lichamen Bonaire, Sint Eustatius
      of Saba.


