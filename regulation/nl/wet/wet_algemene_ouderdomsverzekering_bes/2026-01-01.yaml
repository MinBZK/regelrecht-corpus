  - number: 22b
    text: |-
      1 De kerstuitkering bedraagt 100 procent van het bedrag aan ouderdomspensioen, waarop recht bestond in de maand
      september.

      2 De uitbetaling van de kerstuitkering vindt eenmaal per jaar ambtshalve plaats in de eerste helft van de maand
      december.

      3 Het bedrag van de kerstuitkering, dat niet is ingevorderd binnen zes maanden na de eerste dag waarop het kon
      worden ingevorderd, wordt niet meer uitbetaald.
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel22b
  - number: 22c
    text: |-
      1 Het bepaalde bij of krachtens de [artikelen 13][ref1], [14][ref2], [16][ref3], [18][ref4], [19][ref5] en
      [34][ref6] vindt overeenkomstige toepassing ten aanzien van de kerstuitkering, voor zover bij of krachtens deze
      paragraaf niet anders is bepaald.

      2 Onze Minister kan met betrekking tot het bepaalde in deze paragraaf nadere regels stellen. Daarbij kan worden
      afgeweken van het bepaalde in [artikel 22b][ref7], tweede lid.


