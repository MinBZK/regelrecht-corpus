  - number: '13'
    text: |-
      1 Het ouderdomspensioen wordt betaalbaar gesteld door Onze Minister. De betaling geschiedt maandelijks.

      2 In geval het pensioen in het buitenland wordt uitbetaald, kunnen de daaraan verbonden kosten van overmaking op
      het pensioen in mindering worden gebracht.

      3 Wanneer een gepensioneerde een ander machtigt om het ouderdomspensioen in ontvangst te nemen, dan wel een
      verleende machtiging intrekt, wordt daaraan gevolg gegeven met ingang van een betalingstermijn, aanvangend na de
      dag, waarop de machtiging wordt ingediend, dan wel waarop van haar intrekking mededeling wordt gedaan, doch niet
      later dan de eerste dag van de tweede maand na de dag van indiening, dan wel intrekking van de machtiging.

      4 Bij ministeriële regeling kunnen nadere regels worden vastgesteld ten aanzien van de betaalbaarstelling van het
      ouderdomspensioen door organen, die belast zijn met de uitbetaling van pensioen uit anderen hoofde dan op grond van
      deze wet.
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel13
  - number: '14'
    text: |-
      1 Indien een op grond van deze wet gepensioneerde in een inrichting voor verpleging van geesteszieken of
      van zwakzinnigen is opgenomen of in een instelling waar intramurale zorg wordt verleend als bedoeld in
      [artikel 2, onderdeel b tot en met g, van het Besluit zorg BES][ref1], wordt verzorgd of verpleegd, en de kosten
      van verzorging of verpleging geheel of gedeeltelijk ten laste komen van dat openbare lichaam of de eerdergenoemde
      instelling, kan op verzoek van het desbetreffende orgaan het ouderdomspensioen over volle kalendermaanden, gelegen
      binnen de duur van de verzorging of verpleging, voor zover het over die maanden nog niet is uitbetaald, aan het
      desbetreffende orgaan worden uitbetaald, met dien verstande, dat aan dat orgaan niet meer wordt uitbetaald dan
      de te zijnen laste komende kosten van verzorging en verpleging bedragen en dat een bij ministeriële regeling in
      overeenstemming met de Minister van Volksgezondheid, Welzijn en Sport te bepalen bedrag bij de betaling aan dat
      orgaan buiten beschouwing wordt gelaten ter voorziening in de voor rekening van de gepensioneerde blijvende kosten
      van bestaan.

      2 Voorzover in verband met het bepaalde in dit artikel het ouderdomspensioen niet werd uitbetaald aan de
      gepensioneerde, wordt het na het overlijden van de gepensioneerde, voorzover nodig in afwijking van het in
      [artikel 17][ref2] bepaalde, tot en met de laatste dag van de maand, waarin het overlijden plaats vond, uitbetaald
      aan het in het eerste lid van dit artikel bedoelde orgaan.

      3 Indien uit de door het Centraal Bureau voor de Statistiek vastgestelde consumentenprijsindexcijfers voor de
      openbare lichamen Bonaire, Sint Eustatius en Saba blijkt, dat het prijsindexcijfer voor het derde kwartaal van het
      lopende jaar, vergeleken met het prijsindexcijfer voor het derde kwartaal van het voorafgaande jaar is gestegen
      of gedaald, stelt Onze Minister een bedrag vast, dat met ingang van 1 januari van het komende jaar in de plaats
      treedt van het in het eerste lid bedoelde bedrag. Onze Minister bepaalt welke consumentenprijsindexcijfers voor de
      toepassing van de eerste zin worden gebruikt. De consumentenprijsindexcijfers kunnen voor de onderscheiden openbare
      lichamen en voor belanghebbenden die woonachtig zijn buiten de openbare lichamen, verschillend zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028628#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028459#Artikel17
