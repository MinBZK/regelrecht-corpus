      1 In afwijking van de [artikelen 5, eerste lid][ref1], [6][ref2],
      [7a, eerste lid, derde lid, onderdeel a, en zevende lid][ref3], en [8, eerste lid][ref4], wordt:

      a. voor degene die voor 1 januari 2013 de leeftijd van 60 jaar bereikt, in die artikelen in plaats van «65 jaar»
      gelezen: 60 jaar;

      b. voor degene die in 2013 de leeftijd van 60 jaar bereikt, in die artikelen in plaats van «65 jaar» gelezen: 62
      jaar;

      c. voor degene die in 2014 de leeftijd van 60 jaar bereikt, in die artikelen in plaats van «65 jaar» gelezen: 63
      jaar;

      d. voor degene die in 2015 de leeftijd van 60 jaar bereikt, in die artikelen in plaats van «65 jaar» gelezen: 64
      jaar.

      2 De [artikelen 7a, zevende lid, onderdeel a][ref5], en [8, eerste lid][ref6], zoals die luidden onmiddellijk
      voorafgaand aan inwerkingtreding van de [Aanpassingswet openbare lichamen Bonaire, Sint Eustatius en Saba][ref7],
      blijven van toepassing op de pensioengerechtigde die voor 1 januari 2013 de leeftijd van 60 jaar heeft bereikt.


