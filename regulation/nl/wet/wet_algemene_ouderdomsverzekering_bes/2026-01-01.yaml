  - number: '40'
    text: |-
      1 Degene, die voor 1 september 1960 de leeftijd van 15, doch nog niet die van 65 jaar heeft bereikt, en die – al
      dan niet onafgebroken – gedurende zes jaren na de voleindiging van zijn 54ste levensjaar in Aruba, Curaçao, Sint
      Maarten, de openbare lichamen Bonaire, Sint Eustatius of Saba, Nederland, Suriname of Nederlands Nieuw-Guinea
      heeft gewoond, wordt voor wat betreft het tijdvak gelegen binnen het bereiken van de leeftijd van 15 jaar en het
      tijdstip van inwerking treden van deze wet voor de toepassing van het bepaalde in [artikel 8, eerste lid][ref1],
      geacht verzekerd te zijn geweest. Voor de toepassing van het bepaalde in de vorige volzin wordt de gehuwde vrouw,
      die jonger is dan haar man, dan wel de echtgenoot van de gehuwde vrouw, bedoeld in [artikel 7a, tweede lid][ref2],
      geacht het 54ste levensjaar te hebben voleindigd op dezelfde dag als haar echtgenoot, dan wel zijn echtgenote.

      2 De gehuwde vrouw, die in tegenstelling tot haar echtgenoot voor of op de 1 september 1960 de leeftijd van 65
      heeft bereikt, maar overigens voldoet aan de voorwaarden, van de eerste zin van het eerste lid wordt voor de
      toepassing van het bepaalde in [artikel 8, eerste lid][ref3], gedurende het tijdvak, gelegen tussen de voleindiging
      van haar 15de en de voleindiging van haar 65ste levensjaar, geacht verzekerd te zijn geweest.

      3 Degene, die voldoet aan het bepaalde in de eerste volzin van het eerste lid, maar nooit op grond van deze wet
      verzekerd is geweest, wordt nochtans voor de toepassing van [artikel 6][ref4] geacht verzekerd te zijn geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel8
