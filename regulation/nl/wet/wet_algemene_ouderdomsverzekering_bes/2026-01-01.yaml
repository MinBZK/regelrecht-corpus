        paragraaf: '2'
  - number: '37'
    text: |-
      1 De bekendmaking van een beschikking die verband houdt met het recht op en de uitbetaling van pensioen of
      uitkering of kerstuitkering geschiedt door toezending of uitreiking aan de belanghebbende.

      2 Indien de bekendmaking van de beschikking niet kan geschieden op de wijze als voorzien in het eerste lid,
      geschiedt zij op een andere geschikte wijze.

      3 De beschikking vermeldt de dagtekening van de beslissing, de gronden waarop deze berust, alsmede waar beroep kan
      worden ingesteld.

      4 Het in de vorige leden bepaalde is ten aanzien van een beschikking inzake het recht op kerstuitkering slechts van
      toepassing, indien de belanghebbende zulks verzoekt.
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel37
  - number: '38'
    text: |-
      1 De belanghebbende kan tegen een beschikking op grond van deze wet beroep instellen bij het Gerecht, bedoeld in
      [artikel 1, eerste lid, onderdeel b, van de Wet administratieve rechtspraak BES][ref1].

      2 Bij een beroep tegen een beschikking op grond van de [artikelen 7a, derde lid, onderdeel f][ref2], en [7c][ref3]
      is [artikel 23, eerste lid, laatste zin, van de Wet administratieve rechtspraak BES][ref4] niet van toepassing.

      3 Bij een bestuurlijke heroverweging van een beschikking op grond
      van de [artikelen 7a, derde lid, onderdeel f][ref5], en [7c][ref6] is
      [artikel 24, eerste en tweede lid, van de Wet administratieve rechtspraak BES][ref7] van overeenkomstige
      toepassing.

      4 Met betrekking tot een beschikking op grond van de [artikelen 7a, derde lid, onderdeel f][ref8], en [7c][ref9],
      kan het Gerecht, bedoeld in [artikel 1, eerste lid, onderdeel b, van de Wet administratieve rechtspraak BES][ref10],
      indien het bestuursorgaan niet voldoet aan de verplichting, bedoeld in
      [artikel 23 van de Wet administratieve rechtspraak BES][ref11], daaruit de gevolgtrekking maken die hem geraden
      voorkomt.


