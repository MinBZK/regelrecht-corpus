  - number: '45'
    text: |-
      Hij, die op grond van bij of krachtens deze wet vastgestelde bepalingen gehouden is inlichtingen of gegevens
      te verstrekken, een aangifte of mededeling te doen of een verklaring af te leggen en daarbij opzettelijk een
      valse opgave doet dan wel opzettelijk in strijd met bedoelde gehoudenheid iets verzwijgt, wordt gestraft met
      gevangenisstraf van ten hoogste twee jaren.
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel45
  - number: '46'
    text: |-
      Hij, die op andere wijze dan door het valselijk opmaken of vervalsen van een geschrift, dat bestemd is tot bewijs
      van enig feit te dienen, opzettelijk een opgave doet in strijd met de waarheid, zulks met het oogmerk om aldus
      een uitkering of een hogere uitkering ingevolge deze wet te verkrijgen, wordt gestraft met gevangenisstraf van ten
      hoogste twee jaren.
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel46
  - number: '47'
    text: |-
      Overtredingen van bepalingen van een op grond van deze wet vastgesteld algemene maatregel van bestuur, voor zover
      uitdrukkelijk als strafbaar feit in de zin van dit artikel aangeduid, wordt gestraft met hechtenis van ten hoogste
      een maand of geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel47
  - number: '48'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel48
  - number: '49'
    text: |-
      1 Met de opsporing van de bij deze wet strafbaar gestelde feiten zijn, naast de in
      [artikel 184 van het Wetboek van Strafvordering BES][ref1] bedoelde functionarissen, belast de door Onze Minister
      van Justitie, in overeenstemming met Onze Minister, aangewezen ambtenaren.

      2 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de vereisten waaraan de
      op grond van het eerste lid aangewezen functionarissen dienen te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '184'
  - number: '50'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel50
  - number: '51'
    text: |-
      1 De in [artikel 43a][ref1] bedoelde personen zijn verplicht tot geheimhouding van hetgeen hun bij het toezicht
      op de naleving van de bij of krachtens deze wet vastgestelde bepalingen is bekend geworden, voor zover die
      geheimhouding niet in strijd is met deze of een andere wet.

      2 Hij, die de bij het vorige lid opgelegde geheimhouding opzettelijk schendt, wordt gestraft met gevangenisstraf
      van ten hoogste zes maanden of geldboete van de eerste categorie.

      3 Hij, aan wiens schuld schending van die geheimhouding te wijten is, wordt gestraft met hechtenis van ten hoogste
      drie maanden of geldboete van de eerste categorie.

      4 Geen vervolging heeft plaats dan op aangifte van degenen ten aanzien van wie de geheimhouding is geschonden.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel43a
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel51
    references:
