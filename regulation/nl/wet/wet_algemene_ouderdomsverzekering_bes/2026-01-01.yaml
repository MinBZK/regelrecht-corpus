      Onze Minister is bevoegd, met inachtneming van het vastgestelde premiepercentage, de op grond van deze wet
      verschuldigde premies te doen berekenen volgens tabellen. Bij het opstellen van deze tabellen en voor de toepassing
      daarvan bepaalt Onze Minister de door hem nodig geachte afrondingen.
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel28
  - number: 29a
    text: |-
      1 De werkgever is verplicht de premie, die hij over een tijdvak van een maand of korter heeft ingehouden of had
      moeten inhouden binnen vijftien dagen na het einde van die maand, op aangifte af te dragen. Indien de inhouding
      over een tijdvak van langer dan een maand geschiedt, is de werkgever verplicht de premie, binnen vijftien dagen na
      het einde van dat tijdvak, op aangifte af te dragen.

      2 De aangifte wordt gedaan bij de inspecteur onder gelijktijdige afdracht aan de ontvanger.

      3 Heffing en invordering van de premie geschiedt met overeenkomstige toepassing van
      [hoofdstuk VIII van de Belastingwet BES][ref1].

      4 De inspecteur kan van de werkgever die de premie over een tijdvak van langer dan een maand moet afdragen,
      vorderen dat hij binnen vijftien dagen na het einde van elke maand een gedeelte van de in te houden premie bij
      wijze van voorlopige betaling afdraagt.

      5 Ook in de gevallen, dat geen premie hoeft te worden ingehouden, moet aangifte op de in de vorige leden aangegeven
      tijden ingediend worden.

      6 Personen, die stellen geen werkgever te zijn, moeten niettemin de hen verstrekte aangifteformulieren binnen
      vijftien dagen na het einde van de maand, waarin de aangifteformulieren hen zijn verstrekt, indienen.

      7 De inspecteur verstrekt de werkgever, dan wel de verzekerde indien de verzekerde geen werkgever, het benodigde
      aantal aangifteformulieren, hetzij op diens verzoek, hetzij ambtshalve.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0029244
        hoofdstuk: VIII
  - number: 29b
    text: |-
      1 Indien de premie geheel of gedeeltelijk niet binnen de voorgeschreven tijd is afgedragen kan de te weinig
      afgedragen premie door middel van een aanslag, op te leggen ten name van de werkgever, worden ingevorderd met
      overeenkomstige toepassing van [hoofdstuk VIII, titel 5, van de Belastingwet BES][ref1]. De werkgever is gerechtigd
      het nageheven bedrag te verhalen op zijn werknemer voor zover het bedrag betrekking heeft op van de werknemer ten
      onrechte niet ingehouden premie.

      2 Zo nodig in afwijking van het bepaalde in het eerste lid kan de in de aanslag inbegrepen premie bij wijze van
      boete worden verhoogd met ten hoogste honderd procent, maar tenminste met USD 14. De werkgever is niet gerechtigd
      deze boete op zijn werknemers te verhalen.

      3 Indien aan de verplichting opgelegd in [artikel 29a, vijfde lid][ref2], niet wordt voldaan en ten gevolge daarvan
      de aanslag in zijn geheel moet worden verminderd, bedraagt de boete USD 14.


      [ref1]: https://wetten.overheid.nl/BWBR0029244
      [ref2]: https://wetten.overheid.nl/BWBR0028459#Artikel29a
