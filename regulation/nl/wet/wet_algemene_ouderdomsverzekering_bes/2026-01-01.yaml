        bwb_id: BWBR0028459
        artikel: '12'
        hoofdstuk: III
        paragraaf: '2'
  - number: '17'
    text: |-
      1 Behoudens in de gevallen bepaald in deze wet eindigt het ouderdomspensioen door overlijden van de
      pensioengerechtigde of door intrekking.

      2 Het ouderdomspensioen eindigt, behoudens het overigens in deze wet bepaalde, met ingang van de maand volgende op
      die, waarin het feit heeft plaats gehad of de omstandigheid is ontstaan, die het einde ten gevolge heeft
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel17
  - number: '18'
    text: |-
      1 Het ouderdomspensioen is:

      a. onvervreemdbaar;

      b. niet vatbaar voor verpanding of belening;

      c. behoudens voor zover dit dient tot verhaal van onderhoud, waartoe de gepensioneerde volgens wettelijke regeling
      is gehouden, niet vatbaar voor executoriaal of conservatoir beslag, noch voor faillissementsbeslag.

      2 Voor zover op grond van het eerste lid, onderdeel c beslag wordt gelegd, mag dit niet meer bedragen dan een derde
      gedeelte van het bedrag van het ouderdomspensioen.

      3 Volmacht tot ontvangst van ouderdomspensioen, onder welke vorm of welke benaming ook, door de gepensioneerde
      verleend, is steeds herroepelijk.

      4 Elk beding, strijdig met enige bepaling van dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel18
  - number: 18a
    text: |-
      1 Onze Minister is bevoegd om op grond van verdragen, convenanten en andersoortige overeenkomsten met uitvoerders
      van instellingen van sociale voorzieningen, het ouderdomspensioen van een pensioengerechtigde te verminderen
      ter ontneming van een ten onrechte verkregen voordeel van de pensioengerechtigde op het gebied van sociale
      voorzieningen.

      2 Onze Minister is eveneens bevoegd om het ouderdomspensioen van een pensioengerechtigde te verminderen ter
      ontneming van een ten onrechte verkregen voordeel van de pensioengerechtigde op het gebied van de door Onze
      Minister uitgevoerde sociale verzekeringswetten.

      3 De in het eerste en tweede lid bedoelde vermindering kan ineens geschieden indien het ten onrechte genoten
      voordeel niet groter is dan een derde deel van het door Onze Minister verstrekte ouderdomspensioen. In alle andere
      gevallen kan de vermindering niet meer bedragen dan een derde deel van het ouderdomspensioen.
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel18a
  - number: '19'
    text: |-
      1 Na het overlijden van degene, aan wie een ouderdomspensioen is toegekend, wordt het pensioen tot en met de
      laatste dag van de maand waarin het overlijden heeft plaats gehad, uitbetaald.

      2 De uitbetaling, bedoeld in het eerste lid, geschiedt aan de persoon of personen, die daarvoor naar het oordeel
      van Onze Minister op billijkheidsoverwegingen in aanmerking komt, dan wel komen, mits deze daartoe binnen zes
      maanden na het overlijden een verzoek bij Onze Minister heeft, dan wel hebben, ingediend.
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel19
  - number: '20'
    text: |-
      1 Na het overlijden van degene, aan wie een ouderdomspensioen is toegekend, wordt een bedrag ineens, gelijk aan
      viermaal het ouderdomspensioen, genoemd in [artikel 7 eerste lid][ref1], uitbetaald aan de persoon of personen,
      die daarvoor naar het oordeel van Onze Minister op billijkheidsoverwegingen in aanmerking komt, dan wel komen, mits
      deze daartoe binnen zes maanden na het overlijden een verzoek bij Onze Minister heeft, dan wel hebben, ingediend.

      2 De uitkering, bedoeld in het eerste lid, wordt betaalbaar gesteld in de maand volgende op die, waarin een verzoek
      als bedoeld in het eerste lid, bij Onze Minister is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel7
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel20
