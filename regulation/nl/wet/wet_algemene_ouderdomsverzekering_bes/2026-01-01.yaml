  - number: '21'
    text: |-
      1 Aan de verzekerde, die de openbare lichamen Bonaire, Sint Eustatius of Saba als woonplaats verlaat, wordt door
      Onze Minister op diens verzoek een verklaring afgegeven, vermeldende het aantal jaren dat de verzekerde voor zijn
      rechten op grond van deze wet kan doen gelden tot aan de dag van zijn vertrek uit de openbare lichamen Bonaire,
      Sint Eustatius of Saba. Alvorens deze verklaring wordt afgegeven moet de verzekerde de door hem verschuldigde
      premie, tot aan de dag van zijn vertrek, voldoen.

      2 Bij algemene maatregel van bestuur worden nadere regels vastgesteld voor de toekenning en betaalbaarstelling van
      ouderdomspensioenen, aan personen die buiten de openbare lichamen Bonaire, Sint Eustatius of Saba wonen.
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel21
  - number: 22a
    text: |-
      1 Degene, die recht heeft op ouderdomspensioen in de maand september, heeft recht op kerstuitkering.

      2 Voor de toepassing van deze paragraaf wordt onder degene, die recht heeft op ouderdomspensioen, mede verstaan
      degene, aan wie op grond van [artikel 19][ref1] ouderdomspensioen wordt uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel19
    url: https://wetten.overheid.nl/BWBR0028459/2026-01-01#Artikel22a
