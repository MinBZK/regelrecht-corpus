  - number: '52'
    text: |-
      De in de [artikelen 44, derde lid][ref1], [45][ref2], [46][ref3] en [51][ref4] bedoelde strafbare feiten worden als
      misdrijven, de in de artikelen 44, eerste en tweede lid, en [47][ref5] bedoelde strafbare feiten als overtredingen
      beschouwd.


