  - number: '39'
    text: |-
      1 Voor zover bij of krachtens deze wet niet anders is bepaald en in afwijking van [artikel 38][ref1] zijn ten
      aanzien van het bepaalde in [hoofdstuk 4][ref2] de voor de heffing van de inkomstenbelasting geldende bepalingen
      betreffende de rechtsmiddelen van overeenkomstige toepassing.

      2 De inspecteur doet op een bezwaarschrift eerst uitspraak nadat is komen vast te staan, dat geen feiten en
      omstandigheden in geding zijn, die tevens van belang zijn voor de heffing van inkomstenbelasting, dan wel voor
      zover dat het geval is, de beslissing daaromtrent voor de heffing van de inkomstenbelasting onherroepelijk is
      geworden.

      3 Met betrekking tot een naheffingsaanslag, die geheel of gedeeltelijk berust op feiten, die mede tot het opleggen
      van een naheffingsaanslag in de inkomstenbelasting ten laste van belanghebbende aanleiding hebben gegeven, neemt
      de termijn voor het instellen van beroep eerst een aanvang op de datum, waarop laatstbedoelde naheffingsaanslag
      onherroepelijk is geworden.

      4 Tegen hetgeen omtrent de toepassing van [artikel 2][ref3] van deze wet, alsmede omtrent het zuiver inkomen in de
      zin van de [Wet inkomstenbelasting BES][ref4] voor de heffing van de inkomstenbelasting onherroepelijk is geworden,
      is beroep op grond van deze wet niet toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0028459#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0028459#Artikel2
