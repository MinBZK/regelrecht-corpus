preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het ter uitvoering van richtlijn 1999/70/EG van de Raad van de
    Europese Unie van 28 juni 1999 betreffende de door het EVV, de UNICE en het CEEP gesloten raamovereenkomst inzake
    arbeidsovereenkomsten voor bepaalde tijd noodzakelijk is de Nederlandse wetgeving aan te passen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0014195/2026-01-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      1 Het maken van onderscheid tussen werknemers in de arbeidsvoorwaarden op grond van het al dan niet tijdelijke
      karakter van de arbeidsovereenkomst is verboden, tenzij een dergelijk onderscheid objectief gerechtvaardigd
      is. Dit geldt eveneens ter zake van de voorwaarden bij een ambtelijke aanstelling als bedoeld in de
      [Ambtenarenwet BES][ref1].

      2 Een beding in strijd met het eerste lid is nietig.

      3 Het bepaalde in de leden 1 en 2 is niet van toepassing op een uitzendovereenkomst als bedoeld in
      [artikel 690 van Boek 7 van het Burgerlijk Wetboek][ref2] en op het ter beschikking stellen van arbeidskrachten als
      bedoeld in [artikel 1 van de Wet op het ter beschikking stellen arbeidskrachten BES][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028215
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel690
      [ref3]: https://wetten.overheid.nl/BWBR0028435#Artikel1
    url: https://wetten.overheid.nl/BWBR0014195/2026-01-01#ArtikelII
