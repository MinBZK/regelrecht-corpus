  - number: 7a
    text: |-
      1 In afwijking van [artikel 7][ref1] geldt voor een verhuurder aan wie subsidie is verleend vóór 1 januari 2015,
      dat hij verplicht is per woning:

      a. een energie-index te realiseren van ten hoogste 1,80, voor zover hij op grond van de beschikking tot
      subsidieverlening voor die woning ten minste energieklasse C dient te realiseren;

      b. een energie-index te realiseren van ten hoogste 1,40, voor zover hij op grond van de beschikking tot
      subsidieverlening voor die woning ten minste energieklasse B dient te realiseren;

      c. een energie-index te realiseren van ten hoogste 1,20, voor zover hij op grond van de beschikking tot
      subsidieverlening voor die woning ten minste energieklasse A dient te realiseren; en

      d. uiterlijk 24 maanden na de datum van de beschikking tot subsidieverlening een energie-index bij de Rijksdienst
      voor Ondernemend Nederland te laten registreren.

      2 Voor zover subsidie is verleend vóór 1 januari 2015 wordt de beschikking tot subsidieverlening gewijzigd met
      inachtneming van het eerste lid.


