  - number: '8'
    text: |-
      1 Bij verstrekking van een subsidie op grond van deze regeling van minder dan € 25.000 wordt toepassing gegeven aan
      [artikel 16, tweede lid, onder b, van het Kaderbesluit][ref1].

      2 Bij verstrekking van een subsidie op grond van deze regeling van meer dan € 25.000 zijn de regels inzake
      een subsidie van minder dan € 25.000 van toepassing, met dien verstande dat toepassing wordt gegeven aan
      [artikel 16, tweede lid, onder b, van het Kaderbesluit][ref2].

      3 In afwijking van [artikel 23, tweede en derde lid, van het Kaderbesluit][ref3] worden geen voorschotten
      uitgekeerd.

      4 In de beschikking tot subsidieverlening wordt het jaar vermeld waarin de subsidie zal worden betaald.


