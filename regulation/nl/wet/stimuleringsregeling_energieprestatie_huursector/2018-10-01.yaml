articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *verhuurder:* een natuurlijke persoon of rechtspersoon die een of meer voor verhuur bestemde woningen in
      eigendom heeft;

      b. *woningcorporatie:* een toegelaten instelling als bedoeld in [artikel 19 van de Woningwet][ref1];

      c. *maximale huurgrens:* het bedrag, genoemd in
      [artikel 13, eerste lid, onderdeel a, van Wet op de huurtoeslag][ref2];

      d. *woning:* een woning als bedoeld in [artikel 1, onderdeel k, van de Wet op de huurtoeslag][ref3] met een
      huurprijs onder de maximale huurgrens, tenzij het een woning betreft waarin het een huurder niet is toegestaan om
      zijn hoofdverblijf te hebben en met uitzondering van een woning die onzelfstandige woonruimte is;

      e. energieklasse: een energieklasse als bedoeld in
      [artikel 2, vierde lid, van de Regeling energieprestatie gebouwen][ref4], zoals die vóór 1 januari 2015 luidde;

      f. energieprestatiecertificaat: een energieprestatiecertificaat als bedoeld in
      [artikel 1.1, eerste lid, van het Besluit energieprestatie gebouwen][ref5], zoals dat vóór 1 januari 2015 luidde;

      g. energie-index: het cijfer dat het energieverbruik aangeeft op basis van de verschillende behoeften die verband
      houden met een gestandaardiseerd gebruik van een woning en dat is vastgesteld en afgegeven door een bedrijf met een
      geldig NL-EPBD procescertificaat en volgens de voorschriften, bedoeld in BRL 9500, delen 00 en 01;

      h. *minister:* Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      i. *Kaderbesluit:* het [Kaderbesluit BZK-subsidies][ref6];

      j. *DAEB-Vrijstellingsbesluit:* het Besluit van de Commissie van de Europese Gemeenschappen van 20 december 2011,
      betreffende de toepassing van artikel 106, lid 2, van het Verdrag betreffende de werking van de Europese Unie op
      staatssteun in de vorm van compensatie voor de openbare dienst, verleend aan bepaalde, met beheer van diensten
      van algemeen economisch belang belaste ondernemingen (PbEU C 9380), dan wel later daarvoor in de plaats tredende
      Europese regelgeving;

      k. *BRL 9500:* Beoordelingsrichtlijn 9500, zoals vastgesteld op 31 augustus 2011, inclusief het wijzigingsblad,
      zoals vastgesteld op 5 juni 2014, en eventueel latere wijzigingen;

      l. *EPA-opnemer:* een persoon die voldoet aan de eisen aan de vakbekwaamheid van de ‘EPA-opnemer’ conform bijlage 3
      van BRL 9500, deel 01;

      m. *EPA-adviseur:* een persoon die voldoet aan de eisen aan de vakbekwaamheid van de ‘EPA-adviseur’ conform bijlage
      2 van BRL 9500, deel 01;

      n. *representativiteit:* representativiteit conform BRL 9500, deel 01;

      o. *opnamedatum:* de datum waarop een woning ter bepaling van de energie-index door een EPA-opnemer of een EPA-
      adviseur is bezichtigd en opgenomen.


