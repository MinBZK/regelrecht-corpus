  - number: '2'
    text: |-
      1 De minister verstrekt aan woningcorporaties en andere verhuurders subsidie ten behoeve van de verbetering van de
      energieprestatie van bestaande woningen.

      2 Geen subsidie wordt verstrekt, indien de woning in de vierentwintig maanden voor de datum van indiening van de
      subsidieaanvraag niet gedurende ten minste drie maanden als woning is verhuurd.
    url: https://wetten.overheid.nl/BWBR0035224/2018-10-01#Artikel2
  - number: '3'
    text: |-
      1 Voor subsidieverstrekking op grond van deze regeling geldt een subsidieplafond van € 395.000.000 voor de periode
      van 1 juli 2014 tot en met 31 december 2018.

      2 Het beschikbare bedrag wordt verdeeld in volgorde van binnenkomst van de aanvragen.

      3 Wanneer subsidie voor 31 december 2020 wordt vastgesteld op een lager bedrag dan waarvoor de subsidie is
      verleend, is het daarmee vrijvallende bedrag beschikbaar voor subsidieverstrekking op grond van deze regeling. Dit
      bedrag wordt verdeeld op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035224/2018-10-01#Artikel3
  - number: '4'
    text: |-
      1 Een andere verhuurder dan een woningcorporatie kan op grond van deze regeling in totaal ten hoogste een bedrag
      van € 10.000.000 aan subsidie ontvangen.

      2 Onverminderd [artikel 4, derde lid, van het Kaderbesluit][ref1] en in afwijking van
      [artikel 6, vierde lid, van het Kaderbesluit][ref2] kan op grond van deze regeling ook subsidie worden verstrekt,
      indien de activiteiten, bedoeld in [artikel 2][ref3], uit andere hoofde zijn of worden gesubsidieerd of
      gefinancierd.

      3 Per woning wordt op grond van deze regeling slechts eenmaal subsidie verleend.


