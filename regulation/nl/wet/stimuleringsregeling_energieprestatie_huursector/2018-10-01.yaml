  - number: '6'
    text: |-
      1 Wanneer door de verlening van een subsidie het subsidieplafond zou worden overschreden, wordt de aanvraag voor
      die subsidie op een wachtlijst geplaatst.

      2 Wanneer het subsidieplafond is bereikt of wanneer een aanvraag ingevolge het eerste lid op een wachtlijst is
      geplaatst, worden nieuwe aanvragen op volgorde van binnenkomst op de wachtlijst geplaatst.

      3 Van plaatsing op de wachtlijst wordt aan de aanvrager mededeling gedaan.

      4 De termijn, bedoeld in [artikel 22, eerste lid, van het Kaderbesluit][ref1] wordt voor de duur van de periode
      waarop de aanvraag op de wachtlijst is geplaatst opgeschort.

      5 De aanvraag of de aanvragen die bovenaan de wachtlijst staat of staan wordt of worden in behandeling genomen,
      zodra op grond van [artikel 3, derde lid][ref2], voldoende bedrag beschikbaar is om de subsidie te verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0033530#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0035224#Artikel3
    url: https://wetten.overheid.nl/BWBR0035224/2018-10-01#Artikel6
    references:
