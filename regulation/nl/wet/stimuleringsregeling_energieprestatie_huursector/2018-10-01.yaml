  - number: '9'
    text: |-
      1 De subsidie voor een woning wordt, behoudens in de situaties, genoemd in het tweede tot en met zesde lid, op
      € 0 vastgesteld, indien voor die woning niet is voldaan aan de verplichtingen, genoemd in [artikel 7][ref1] of
      [7a][ref2].

      2 Indien een woning ten tijde van de subsidieaanvraag een energie-index had van 2,71 of hoger, dan wel
      energieklasse G, wordt de subsidie voor een woning vastgesteld op:

      a. € 3.600, indien de verhuurder geen woningcorporaties is, in de beschikking tot subsidieverlening voor die woning
      een te realiseren energie-index van ten hoogste 1,40 of 1,20 is genoemd en een energie-index is gerealiseerd van
      ten hoogste 1,80;

      b. € 4.800, indien in de beschikking tot subsidieverlening voor die woning een te realiseren energie-index van ten
      hoogste 1,20 of 0,80 is genoemd en een energie-index is gerealiseerd van ten hoogste 1,40;

      c. € 6.200, indien in de beschikking tot subsidieverlening voor die woning een te realiseren energie-index van ten
      hoogste 0,80 of 0,60 is genoemd en een energie-index is gerealiseerd van ten hoogste 1,20;

      d. € 7.200, indien in de beschikking tot subsidieverlening voor die woning een te realiseren energie-index van ten
      hoogste 0,60 of 0,40 is genoemd en een energie-index is gerealiseerd van ten hoogste 0,80;

      e. € 8.300, indien in de beschikking tot subsidieverlening voor die woning een te realiseren energie-index van ten
      hoogste 0,40 is genoemd en een energie-index is gerealiseerd van ten hoogste 0,60.

      3 Indien een woning ten tijde van de subsidieaanvraag een energie-index had van 2,41 of hoger, maar niet hoger dan
      2,70, dan wel energieklasse F, wordt de subsidie voor een woning vastgesteld op:

      a. € 2.800, indien de verhuurder geen woningcorporatie is, in de beschikking tot subsidieverlening voor die woning
      een te realiseren energie-index van ten hoogste 1,40 of 1,20 is genoemd en een energie-index is gerealiseerd van
      ten hoogste 1,80;

      b. € 3.600, indien in de beschikking tot subsidieverlening voor die woning een te realiseren energie-index van ten
      hoogste 1,20 of 0,80 is genoemd en een energie-index is gerealiseerd van ten hoogste 1,40;

      c. € 4.800, indien in de beschikking tot subsidieverlening voor die woning een te realiseren energie-index van ten
      hoogste 0,80 of 0,60 is genoemd en een energie-index is gerealiseerd van ten hoogste 1,20;

      d. € 6.200, indien in de beschikking tot subsidieverlening voor die woning een te realiseren energie-index van ten
      hoogste 0,60 of 0,40 is genoemd en een energie-index is gerealiseerd van ten hoogste 0,80;

      e. € 7.200, indien in de beschikking tot subsidieverlening voor die woning een te realiseren energie-index van ten
      hoogste 0,40 is genoemd en een energie-index is gerealiseerd van ten hoogste 0,60.

      4 Indien een woning ten tijde van de subsidieaanvraag een energie-index had van 2,11 of hoger, maar niet hoger dan
      2,40, dan wel energieklasse E, wordt de subsidie voor een woning vastgesteld op:

      a. € 1.500, indien de verhuurder geen woningcorporatie is, in de beschikking tot subsidieverlening voor die woning
      een te realiseren energie-index van ten hoogste 1,40 of 1,20 is genoemd en een energie-index is gerealiseerd van
      ten hoogste 1,80;

      b. € 2.800, indien in de beschikking tot subsidieverlening voor die woning een te realiseren energie-index van ten
      hoogste 1,20 of 0,80 is genoemd en een energie-index is gerealiseerd van ten hoogste 1,40;

      c. € 3.600, indien in de beschikking tot subsidieverlening voor die woning een te realiseren energie-index van ten
      hoogste 0,80 of 0,60 is genoemd en een energie-index is gerealiseerd van ten hoogste 1,20;

      d. € 4.800, indien in de beschikking tot subsidieverlening voor die woning een te realiseren energie-index van ten
      hoogste 0,60 of 0,40 is genoemd en een energie-index is gerealiseerd van ten hoogste 0,80;

      e. € 6.200, indien in de beschikking tot subsidieverlening voor die woning een te realiseren energie-index van ten
      hoogste 0,40 is genoemd en een energie-index is gerealiseerd van ten hoogste 0,60.

      5 Indien een woning ten tijde van de subsidieaanvraag een energie-index had van 1,81 of hoger, maar niet hoger dan
      2,10, dan wel energieklasse D, wordt de subsidie voor een woning vastgesteld op:

      a. € 1.500, indien in de beschikking tot subsidieverlening voor die woning een te realiseren energie-index van ten
      hoogste 1,20 of 0,80 is genoemd en een energie-index is gerealiseerd van ten hoogste 1,40;

      b. € 2.800, indien in de beschikking tot subsidieverlening voor die woning een te realiseren energie-index van ten
      hoogste 0,80 of 0,60 is genoemd en een energie-index is gerealiseerd van ten hoogste 1,20;

      c. € 3.600, indien in de beschikking tot subsidieverlening voor die woning een te realiseren energie-index van ten
      hoogste 0,60 of 0,40 is genoemd en een energie-index is gerealiseerd van ten hoogste 0,80;

      d. € 4.800, indien in de beschikking tot subsidieverlening voor die woning een te realiseren energie-index van ten
      hoogste 0,40 is genoemd en een energie-index is gerealiseerd van ten hoogste 0,60.

      6 Indien een woning ten tijde van de subsidieaanvraag een energie-index had van 1,41 of hoger, maar niet hoger dan
      1,80, dan wel energieklasse C, wordt de subsidie voor een woning vastgesteld op:

      a. € 1.500, indien in de beschikking tot subsidieverlening voor die woning een te realiseren energie-index van ten
      hoogste 0,80 of 0,60 is genoemd en een energie-index is gerealiseerd van ten hoogste 1,20;

      b. € 2.800, indien in de beschikking tot subsidieverlening voor die woning een te realiseren energie-index van ten
      hoogste 0,60 of 0,40 is genoemd en een energie-index is gerealiseerd van ten hoogste 0,80;

      c. € 3.600, indien in de beschikking tot subsidieverlening voor die woning een te realiseren energie-index van ten
      hoogste 0,40 is genoemd en een energie-index is gerealiseerd van ten hoogste 0,60.


