        artikel: '22'
      - id: ref2
        bwb_id: BWBR0035224
        artikel: '3'
  - number: '7'
    text: |-
      1 De subsidieontvanger is verplicht:

      a. per woning in ieder geval de energie-index te realiseren, die in de beschikking tot subsidieverlening voor die
      woning is genoemd;

      b. uiterlijk 24 maanden na de datum van de beschikking tot subsidieverlening per woning zorg te dragen voor
      registratie van een nieuwe energie-index bij de Rijksdienst voor Ondernemend Nederland;

      c. voor zover ter bepaling van de nieuwe energie-index geen gebruik is gemaakt van representativiteit, desverlangd
      voor iedere woning het door een EPA-opnemer of EPA-adviseur ondertekende opnameformulier dan wel andere
      bewijsstukken omtrent de bezichtiging en opname van de woning aan de minister over te leggen;

      d. voor zover ter bepaling van de nieuwe energie-index gebruik is gemaakt van representativiteit, desverlangd voor
      iedere referentiewoning een afschrift van het door een EPA-opnemer of EPA-adviseur ondertekende opnameformulier of
      andere bewijsstukken omtrent de bezichtiging en opname van de referentiewoning alsmede de onderbouwing van de EPA-
      opnemer of EPA-adviseur om gebruik te maken van representativiteit aan de minister over te leggen; en

      e. desverlangd aan de minister een overzicht over te leggen van de energiebesparende voorzieningen aan de woningen
      waarvoor subsidie is verleend, die binnen 24 maanden na de datum van de beschikking tot verlening van de subsidie
      zijn getroffen.

      2 De woningcorporatie administreert de netto kosten, bedoeld in artikel 5 van het DAEB-vrijstellingsbesluit, die
      zijn verbonden met de activiteiten, bedoeld in [artikel 2][ref1] op een zodanige wijze dat inzicht kan worden
      verkregen in de hoogte van deze kosten, zulks afgescheiden van de reguliere bedrijfsvoering, in relatie tot de voor
      deze activiteiten verstrekte subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0035224#Artikel2
    url: https://wetten.overheid.nl/BWBR0035224/2018-10-01#Artikel7
