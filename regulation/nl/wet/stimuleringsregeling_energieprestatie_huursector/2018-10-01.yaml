  - number: 4c
    text: |-
      Subsidie op grond van deze regeling aan een onderneming, anders dan een woningcorporatie, wordt verstrekt met
      toepassing van de algemene groepsvrijstellingsverordening.
    url: https://wetten.overheid.nl/BWBR0035224/2018-10-01#Artikel4c
  - number: '5'
    text: |-
      1 Een aanvraag tot subsidieverlening wordt uiterlijk 31 december 2018 ingediend met gebruikmaking van een door de
      minister elektronisch beschikbaar gesteld formulier.

      2 In afwijking van [artikel 11, derde lid, van het Kaderbesluit][ref1] bevat de aanvraag in ieder geval de volgende
      gegevens en verklaringen:

      a. het adres, de postcode en het huisnummer en toevoeging van elke woning ten behoeve waarvan subsidie wordt
      aangevraagd;

      b. per woning de bij de Rijksdienst voor Ondernemend Nederland geregistreerde energie-index, waarvan de opnamedatum
      niet meer dan zes maanden ligt voor de datum van de aanvraag tot subsidieverlening, alsmede de opnamedatum van die
      energie-index;

      c. per woning de met de subsidie in ieder geval te realiseren energie-index;

      d. een verklaring waaruit blijkt dat iedere woning ten behoeve waarvan subsidie wordt aangevraagd in ieder geval
      tot de datum van subsidievaststelling een woning is als bedoeld in [artikel 1, onderdeel d][ref2];

      e. een verklaring waaruit blijkt dat voor geen van de woningen ten behoeve waarvan subsidie wordt aangevraagd reeds
      subsidie is verleend op grond van deze regeling;

      f. een verklaring waaruit blijkt dat de verhuurder van de woning of woningen ten behoeve waarvan subsidie wordt
      aangevraagd een woningcorporatie is of een andere verhuurder;

      g. indien de verhuurder van de woning of woningen ten behoeve waarvan subsidie wordt aangevraagd een andere
      verhuurder is dan een woningcorporatie, een verklaring waaruit blijkt dat niet meer subsidie is ontvangen of wordt
      aangevraagd dan op basis van de algemene groepsvrijstellingsverordening ten hoogste kan worden verstrekt;

      h. indien van toepassing, het L-nummer van de aanvrager;

      i. indien van toepassing, het inschrijfnummer van de aanvrager bij de Kamer van Koophandel en Fabrieken; en

      j. het bankrekeningnummer waarop het subsidiebedrag dient te worden overgemaakt;

      k. indien de aanvrager een natuurlijke persoon is, een verklaring dat de energie-index van elke woning ten behoeve
      waarvan subsidie wordt aangevraagd, is vastgesteld volgens de voorschriften, bedoeld in BRL 9500, deel 01, die
      betrekking hebben op de bezichtiging en opname van woningen;

      l. indien de aanvrager een rechtspersoon is, een schriftelijke bevestiging van de directeur of het bestuur van die
      rechtspersoon dat de energie-index van elke woning ten behoeve waarvan subsidie wordt aangevraagd, is vastgesteld
      volgens de voorschriften, bedoeld in BRL 9500, deel 01, die betrekking hebben op de bezichtiging en opname van
      woningen;

      m. een verklaring dat de aanvrager voor elke woning ten behoeve waarvan subsidie wordt aangevraagd, beschikt over
      een door een EPA-opnemer of EPA-adviseur ingevuld en ondertekend opnameformulier, waaruit blijkt dat de opnamedatum
      overeenkomt met de in de aanvraag vermelde opnamedatum, dan wel over andere bewijsstukken waaruit zulks blijkt;

      n. een overzicht van de voorgenomen energiebesparende voorzieningen aan de woningen waarvoor subsidie wordt
      aangevraagd;

      o. een verklaring dat elke woning ten behoeve waarvan subsidie wordt aangevraagd in de vierentwintig maanden voor
      de datum van indiening van de subsidieaanvraag gedurende ten minste drie maanden als woning is verhuurd.

      3 Een aanvraag kan betrekking hebben op meerdere woningen.

      4 Indien voor een woning een energieprestatiecertificaat beschikbaar is waarvan de opnamedatum niet meer
      dan zes maanden ligt voor de datum van de aanvraag tot subsidieverlening, kan de aanvraag in plaats van
      de gegevens, genoemd in het tweede lid, onderdeel b, voor die woning de energieklasse bevatten, die is
      opgenomen in het energieprestatiecertificaat. In dat geval bevat de aanvraag tevens de opnamedatum die op het
      energieprestatiecertificaat vermeld staat.

      5 Voor zover ter bepaling van de energie-index van een of meer woningen gebruik is gemaakt van representativiteit,
      ligt de opnamedatum van de referentiewoning niet meer dan zes maanden voor de datum van de aanvraag tot
      subsidieverlening en bevat de aanvraag:

      a. in afwijking van het tweede lid, onderdeel b, de bij de Rijksdienst voor Ondernemend Nederland geregistreerde
      energie-index, die is gebaseerd op de energie-index van de referentiewoning, alsmede de opnamedatum van de
      referentiewoning; en

      b. in afwijking van het tweede lid, onderdeel m, een verklaring dat de aanvrager voor elke referentiewoning
      beschikt over een door een EPA-opnemer of EPA-adviseur ingevuld en ondertekend opnameformulier, waaruit blijkt dat
      de opnamedatum overeenkomt met de in de aanvraag vermelde opnamedatum, dan wel over andere bewijsstukken waaruit
      zulks blijkt; en

      c. een verklaring dat de EPA-opnemer of EPA-adviseur heeft onderbouwd waarom gebruik is gemaakt van
      representativiteit.


