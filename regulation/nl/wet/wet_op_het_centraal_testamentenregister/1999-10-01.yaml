        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003080
        artikel: '1'
  - number: '3'
    text: |-
      De notaris door of ten overstaan van wie een akte als bedoeld in [artikel 1][ref1] is verleden, is verplicht
      uiterlijk op de eerste werkdag volgende op die waarop de akte is verleden aan het testamentenregister op een door
      Onze Minister van Justitie vast te stellen formulier opgaaf te doen van de in het vorige artikel bedoelde gegevens,
      alsmede van de woonplaats van de persoon die de akte deed verlijden of te verklaren dat en om welke reden deze
      gegevens niet kunnen worden opgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003080#Artikel1
    url: https://wetten.overheid.nl/BWBR0003080/1999-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003080
        artikel: '1'
  - number: '4'
    text: |-
      1 Ter dekking van de kosten van het testamentenregister wordt voor de inschrijving van een notariële akte een recht
      geheven. De hoogte van dit recht en de wijze van inning daarvan worden bij algemene maatregel van bestuur geregeld.
      Voor de betaling van het recht is de notaris aansprakelijk.

      2 Hetgeen verder nodig is ter uitvoering van deze wet, wordt geregeld bij regeling van Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0003080/1999-10-01#Artikel4
  - number: '5'
    text: |-
      Onze Minister van Justitie doet de in artikel 998, eerste lid, van het Burgerlijk Wetboek bedoelde akten onverwijld
      na de registratie tegen ontvangstbewijs overbrengen naar de algemene bewaarplaats der minuten, registers en
      repertoria als bedoeld in artikel 57 van de Wet op het notarisambt, te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0003080/1999-10-01#Artikel5
  - number: '6'
    text: |-
      1 Aan een ieder worden kosteloos inlichtingen gegeven uit de gegevens van het testamentenregister ten aanzien van
      personen die zijn overleden.

      2 Onze Minister van Justitie verstrekt aan de door Onze Minister van Financiën aan te wijzen inspecteurs van
      de rijksbelastingen de voor die dienst nodige gegevens omtrent overleden personen aan de hand van de door die
      inspecteurs in te zenden overlijdensopgaven.
    url: https://wetten.overheid.nl/BWBR0003080/1999-10-01#Artikel6
  - number: '7'
    text: |-
      1 De Wet op het testamentenregister wordt ingetrokken.

      2
    url: https://wetten.overheid.nl/BWBR0003080/1999-10-01#Artikel7
  - number: '8'
    text: |-
      1 Deze wet kan worden aangehaald als: Wet op het centraal testamentenregister.

      2 Deze wet treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0003080/1999-10-01#Artikel8
