preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de regelen betreffende de registratie van testamenten
    te herzien en aan te passen aan de behoeften van de praktijk;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003080/1999-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Er is een testamentenregister waarin worden opgenomen de in het volgende artikel vermelde gegevens van:

      a. openbare akten bevattende uiterste willen of herroeping van uiterste willen;

      b. akten van superscriptie;

      c. akten bevattende bewaargeving of teruggave van uiterste willen;

      d. akten van giften van de gehele of gedeeltelijke nalatenschap, de gift van een of meer goederen uit de
      nalatenschap daaronder begrepen;

      e. uiterste willen als bedoeld in artikel 997*a* van het Burgerlijk Wetboek;

      f. akten van benoeming ingaande bij overlijden.

      2 Onze Minister van Justitie draagt de zorg voor de inrichting en het bijhouden van het testamentenregister.
    url: https://wetten.overheid.nl/BWBR0003080/1999-10-01#Artikel1
  - number: '2'
    text: |-
      1 Voor zover daarvan uit de opgaven of uit de ingevolge artikel 998 van het Burgerlijk Wetboek ontvangen akten
      blijkt, worden van de akten opgenomen:

      a. de naam, de eerste drie voornamen en het aantal van de voornamen, de geboorteplaats en de geboortedatum van de
      persoon die de akte deed verlijden;

      b. de datum van de akte.

      2 Bovendien worden in het register opgenomen:

      a. indien de akte is verleden door of ten overstaan van een notaris of een consulaire ambtenaar, diens naam,
      voorletters en standplaats en het nummer waaronder de akte in het repertorium is vermeld; met betrekking tot de
      notaris wordt het nummer opgenomen dat door Onze Minister van Justitie aan zijn kantoor is toegekend;

      b. indien de akte is verleden door of ten overstaan van een persoon als bedoeld in de artikelen 993-997 van het
      Burgerlijk Wetboek, diens naam, voorletters en hoedanigheid;

      c. de soort van de akte naar de onderscheiding van [artikel 1][ref1];

      d. indien de akte behoort tot de categorie van [artikel 1, eerste lid, onder a][ref2], de mededeling of bij deze
      akte alle vorige uiterste willen al dan niet zijn herroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0003080#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003080#Artikel1
    url: https://wetten.overheid.nl/BWBR0003080/1999-10-01#Artikel2
    references:
      - id: ref1
