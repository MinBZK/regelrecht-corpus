  - number: '3'
    text: |-
      De notaris door of ten overstaan van wie een akte als bedoeld in [artikel 1][ref1] is verleden, is verplicht
      uiterlijk op de eerste werkdag volgende op die waarop de akte is verleden aan het testamentenregister op een door
      de Koninklijke Notariële Beroepsorganisatie, genoemd in [artikel 60 van de Wet op het notarisambt][ref2] vast
      te stellen formulier opgaaf te doen van de in het vorige artikel bedoelde gegevens, alsmede van de woonplaats
      van de persoon die de akte deed verlijden of te verklaren dat en om welke reden deze gegevens niet kunnen worden
      opgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003080#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel60
