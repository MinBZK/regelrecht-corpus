  - number: '6'
    text: |-
      1 Aan een ieder worden kosteloos inlichtingen gegeven uit de gegevens van het testamentenregister ten aanzien van
      personen die zijn overleden.

      2 De Koninklijke Notariële Beroepsorganisatie, genoemd in [artikel 60 van de Wet op het notarisambt][ref1]
      verstrekt aan de door Onze Minister van Financiën aan te wijzen inspecteurs van de rijksbelastingen de voor
      die dienst nodige gegevens omtrent overleden personen aan de hand van de door die inspecteurs in te zenden
      overlijdensopgaven.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel60
    url: https://wetten.overheid.nl/BWBR0003080/2014-07-01#Artikel6
