preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de regelen betreffende de registratie van testamenten
    te herzien en aan te passen aan de behoeften van de praktijk;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003080/2014-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Er is een testamentenregister waarin worden opgenomen de in het volgende artikel vermelde gegevens van:

      a. notariële akten bevattende uiterste willen of herroeping van uiterste willen;

      b. akten bevattende bewaargeving of teruggave van uiterste willen;

      c. uiterste willen als bedoeld in [artikel 105 van Boek 4 van het Burgerlijk Wetboek][ref1];

      d. akten van benoeming ingaande bij overlijden.

      e. notariële akten bevattende schenkingsovereenkomsten of andere giften met de strekking dat zij
      pas na het overlijden van de schenker of gever zullen worden uitgevoerd, bedingen als bedoeld in
      [artikel 126, tweede lid, onder a, van Boek 4 van het Burgerlijk Wetboek][ref2] en omzettingen als bedoeld in
      [artikel 126, tweede lid, onder c, van Boek 4 van het Burgerlijk Wetboek][ref3];

      f. akten als bedoeld in [artikel 19a, eerste lid, onder a tot en met e, van de Consulaire Wet][ref4] die
      overeenkomstig de voorschriften van het recht van Aruba, Curaçao of Sint Maarten zijn opgemaakt.

      2 In het register worden voorts opgenomen de in het volgende artikel vermelde gegevens van naar het in
      de openbare lichamen Bonaire, Sint Eustatius en Saba geldende recht opgemaakte akten, bevattende uiterste
      wilsbeschikkingen en schenkingen van de gehele of de gedeeltelijke nalatenschap van de schenker, alsmede
      akten waarbij uiterste wilsbeschikkingen worden herroepen of olografische testamenten worden teruggenomen.
      Onder akten, bevattende uiterste wilsbeschikkingen, worden verstaan: uiterste willen bij openbare akte,
      akten van bewaargeving van uiterste wil, akten van superscriptie, onderhandse stukken als bedoeld in
      [artikel 961 van Boek 4 van het Burgerlijk Wetboek BES][ref5], voor zover deze na het overlijden van de erflater
      aan een notaris zijn ter hand gesteld en akten van benoeming ingaande bij overlijden.

      3 De Koninklijke Notariële Beroepsorganisatie, genoemd in [artikel 60 van de Wet op het notarisambt][ref6], draagt
      zorg voor de inrichting en het bijhouden van het testamentenregister.


