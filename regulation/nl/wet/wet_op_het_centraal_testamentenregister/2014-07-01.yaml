  - number: '4'
    text: |-
      1 Ter dekking van de kosten van het testamentenregister wordt voor de inschrijving van een notariële akte een recht
      geheven. Voor de betaling van het recht is de notaris aansprakelijk.

      2 De hoogte en wijze van inning van het recht, bedoeld in het eerste lid, en hetgeen verder nodig is ter uitvoering
      van deze wet, wordt geregeld bij regeling van Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0003080/2014-07-01#Artikel4
  - number: '5'
    text: |-
      De Koninklijke Notariële Beroepsorganisatie, genoemd in [artikel 60 van de Wet op het notarisambt][ref1] doet
      de in [artikel 106, eerste lid, van Boek 4 van het Burgerlijk Wetboek][ref2] bedoelde akten onverwijld na de
      registratie tegen ontvangstbewijs overbrengen naar een algemene bewaarplaats van protocollen als bedoeld in
      [artikel 57 van de Wet op het notarisambt][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel106
      [ref3]: https://wetten.overheid.nl/BWBR0010388#Artikel57
    url: https://wetten.overheid.nl/BWBR0003080/2014-07-01#Artikel5
