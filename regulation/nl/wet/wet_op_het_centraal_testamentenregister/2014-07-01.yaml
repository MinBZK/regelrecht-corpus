  - number: '2'
    text: |-
      1 Voor zover daarvan uit de opgaven of uit de ingevolge [artikel 106 van Boek 4 van het Burgerlijk Wetboek][ref1]
      ontvangen akten blijkt, worden van de akten opgenomen:

      a. de naam, de eerste drie voornamen en het aantal van de voornamen, de geboorteplaats en de geboortedatum van de
      persoon die de akte deed verlijden;

      b. de datum van de akte.

      2 Bovendien worden in het register opgenomen:

      a. indien de akte is verleden door of ten overstaan van een notaris of een consulaire ambtenaar, diens naam,
      voorletters en standplaats en het nummer waaronder de akte in het repertorium is vermeld; met betrekking
      tot de notaris wordt het nummer opgenomen dat door de Koninklijke Notariële Beroepsorganisatie, genoemd in
      [artikel 60 van de Wet op het notarisambt][ref2] aan zijn kantoor is toegekend;

      b. indien de akte is verleden door of ten overstaan van een persoon als bedoeld in de
      [artikelen 98 tot en met 104 van Boek 4 van het Burgerlijk Wetboek][ref3], diens naam, voorletters en hoedanigheid;

      c. de soort van de akte naar de onderscheiding van [artikel 1, eerste lid][ref4];

      d. indien de akte behoort tot de categorie van [artikel 1, eerste lid, onder a][ref5], de mededeling of bij deze
      akte alle vorige uiterste willen al dan niet zijn herroepen.

      3 Met betrekking tot de in [artikel 1, tweede lid][ref6], bedoelde akten wordt, voor zover daarvan uit de opgaven
      blijkt, aantekening gehouden van de in het eerste en tweede lid bedoelde gegevens, met dien verstande dat:

      a. voor de toepassing van het tweede lid, onder b in plaats van «de
      [artikelen 98 tot en met 104 van Boek 4 van het Burgerlijk Wetboek][ref7]» wordt gelezen: de
      [artikelen 972 tot en met 974 van Boek 4 van het Burgerlijk Wetboek BES][ref8];

      b. voor de toepassing van het tweede lid, onder c, in plaats van «[artikel 1, eerste lid][ref9], wordt gelezen:
      artikel 1, tweede lid;

      c. de in het tweede lid, onder d, bedoelde mededeling wordt opgenomen indien het een notariële akte betreft die
      uiterste wilsbeschikkingen of de herroeping van uiterste wilsbeschikkingen bevat.


