---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_het_centraal_testamentenregister
regulatory_layer: WET
publication_date: '2014-06-12'
valid_from: '2003-01-01'
bwb_id: BWBR0003080
url: https://wetten.overheid.nl/BWBR0003080/2003-01-01
preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de regelen betreffende de registratie van testamenten
    te herzien en aan te passen aan de behoeften van de praktijk;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003080/2003-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Er is een testamentenregister waarin worden opgenomen de in het volgende artikel vermelde gegevens van:'
    url: https://wetten.overheid.nl/BWBR0003080/2003-01-01#Artikel1
  - number: 1.1.a
    text: notariële akten bevattende uiterste willen of herroeping van uiterste willen;
    url: https://wetten.overheid.nl/BWBR0003080/2003-01-01#Artikel1
  - number: 1.1.b
    text: akten bevattende bewaargeving of teruggave van uiterste willen;
    url: https://wetten.overheid.nl/BWBR0003080/2003-01-01#Artikel1
  - number: 1.1.c
    text: |-
      uiterste willen als bedoeld in [artikel 105 van Boek 4 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel105
    url: https://wetten.overheid.nl/BWBR0003080/2003-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '105'
  - number: 1.1.d
    text: akten van benoeming ingaande bij overlijden.
    url: https://wetten.overheid.nl/BWBR0003080/2003-01-01#Artikel1
  - number: 1.1.e
    text: |-
      notariële akten bevattende schenkingsovereenkomsten of andere giften met de strekking dat zij
      pas na het overlijden van de schenker of gever zullen worden uitgevoerd, bedingen als bedoeld in
      [artikel 126, tweede lid, onder a, van Boek 4 van het Burgerlijk Wetboek][ref1] en omzettingen als bedoeld in
      [artikel 126, tweede lid, onder c, van Boek 4 van het Burgerlijk Wetboek][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel126
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel126
    url: https://wetten.overheid.nl/BWBR0003080/2003-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '126'
      - id: ref2
        bwb_id: BWBR0002761
        artikel: '126'
  - number: 1.1.f
    text: |-
      akten als bedoeld in [artikel 19a, eerste lid, onder a tot en met e, van de Consulaire Wet][ref1] die
      overeenkomstig de voorschriften van het Nederlands-Antilliaanse of Arubaanse recht zijn opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0001847#Artikel19a
    url: https://wetten.overheid.nl/BWBR0003080/2003-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001847
        artikel: 19a
  - number: '1.2'
    text: Onze Minister van Justitie draagt de zorg voor de inrichting en het bijhouden van het testamentenregister.
    url: https://wetten.overheid.nl/BWBR0003080/2003-01-01#Artikel1
  - number: '2.1'
    text: |-
      Voor zover daarvan uit de opgaven of uit de ingevolge [artikel 106 van Boek 4 van het Burgerlijk Wetboek][ref1]
      ontvangen akten blijkt, worden van de akten opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel106
    url: https://wetten.overheid.nl/BWBR0003080/2003-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '106'
  - number: 2.1.a
    text: |-
      de naam, de eerste drie voornamen en het aantal van de voornamen, de geboorteplaats en de geboortedatum van de
      persoon die de akte deed verlijden;
    url: https://wetten.overheid.nl/BWBR0003080/2003-01-01#Artikel2
  - number: 2.1.b
    text: de datum van de akte.
    url: https://wetten.overheid.nl/BWBR0003080/2003-01-01#Artikel2
  - number: '2.2'
    text: 'Bovendien worden in het register opgenomen:'
    url: https://wetten.overheid.nl/BWBR0003080/2003-01-01#Artikel2
  - number: 2.2.a
    text: |-
      indien de akte is verleden door of ten overstaan van een notaris of een consulaire ambtenaar, diens naam,
      voorletters en standplaats en het nummer waaronder de akte in het repertorium is vermeld; met betrekking tot de
      notaris wordt het nummer opgenomen dat door Onze Minister van Justitie aan zijn kantoor is toegekend;
    url: https://wetten.overheid.nl/BWBR0003080/2003-01-01#Artikel2
  - number: 2.2.b
    text: |-
      indien de akte is verleden door of ten overstaan van een persoon als bedoeld in de
      [artikelen 98 tot en met 104 van Boek 4 van het Burgerlijk Wetboek][ref1], diens naam, voorletters en hoedanigheid;


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel98
    url: https://wetten.overheid.nl/BWBR0003080/2003-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '98'
  - number: 2.2.c
    text: |-
      de soort van de akte naar de onderscheiding van [artikel 1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003080#Artikel1
    url: https://wetten.overheid.nl/BWBR0003080/2003-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003080
        artikel: '1'
  - number: 2.2.d
    text: |-
      indien de akte behoort tot de categorie van [artikel 1, eerste lid, onder a][ref1], de mededeling of bij deze akte
      alle vorige uiterste willen al dan niet zijn herroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0003080#Artikel1
    url: https://wetten.overheid.nl/BWBR0003080/2003-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003080
        artikel: '1'
  - number: '3'
    text: |-
      De notaris door of ten overstaan van wie een akte als bedoeld in [artikel 1][ref1] is verleden, is verplicht
      uiterlijk op de eerste werkdag volgende op die waarop de akte is verleden aan het testamentenregister op een door
      Onze Minister van Justitie vast te stellen formulier opgaaf te doen van de in het vorige artikel bedoelde gegevens,
      alsmede van de woonplaats van de persoon die de akte deed verlijden of te verklaren dat en om welke reden deze
      gegevens niet kunnen worden opgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003080#Artikel1
    url: https://wetten.overheid.nl/BWBR0003080/2003-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003080
        artikel: '1'
  - number: '4.1'
    text: |-
      Ter dekking van de kosten van het testamentenregister wordt voor de inschrijving van een notariële akte een recht
      geheven. De hoogte van dit recht en de wijze van inning daarvan worden bij algemene maatregel van bestuur geregeld.
      Voor de betaling van het recht is de notaris aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0003080/2003-01-01#Artikel4
  - number: '4.2'
    text: Hetgeen verder nodig is ter uitvoering van deze wet, wordt geregeld bij regeling van Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0003080/2003-01-01#Artikel4
  - number: '5'
    text: |-
      Onze Minister van Justitie doet de in [artikel 106, eerste lid, van Boek 4 van het Burgerlijk Wetboek][ref1]
      bedoelde akten onverwijld na de registratie tegen ontvangstbewijs overbrengen naar de algemene bewaarplaats der
      minuten, registers en repertoria als bedoeld in [artikel 57 van de Wet op het notarisambt][ref2], te 's-Gravenhage.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel106
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel57
    url: https://wetten.overheid.nl/BWBR0003080/2003-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '106'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: '57'
  - number: '6.1'
    text: |-
      Aan een ieder worden kosteloos inlichtingen gegeven uit de gegevens van het testamentenregister ten aanzien van
      personen die zijn overleden.
    url: https://wetten.overheid.nl/BWBR0003080/2003-01-01#Artikel6
  - number: '6.2'
    text: |-
      Onze Minister van Justitie verstrekt aan de door Onze Minister van Financiën aan te wijzen inspecteurs van
      de rijksbelastingen de voor die dienst nodige gegevens omtrent overleden personen aan de hand van de door die
      inspecteurs in te zenden overlijdensopgaven.
    url: https://wetten.overheid.nl/BWBR0003080/2003-01-01#Artikel6
  - number: '7.1'
    text: De Wet op het testamentenregister wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003080/2003-01-01#Artikel7
  - number: '8.1'
    text: 'Deze wet kan worden aangehaald als: Wet op het centraal testamentenregister.'
    url: https://wetten.overheid.nl/BWBR0003080/2003-01-01#Artikel8
  - number: '8.2'
    text: Deze wet treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0003080/2003-01-01#Artikel8
