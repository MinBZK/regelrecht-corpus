  - number: '6'
    text: |-
      1 De Stichting Pensioenfonds ABP heeft tot doel om als bedrijfstakpensioenfonds als bedoeld in de
      [Pensioenwet][ref1] werkzaam te zijn ten behoeve van overheid, onderwijs en daarmee gelieerde privaatrechtelijke
      lichamen.

      2 In de statuten van de Stichting Pensioenfonds ABP kan worden bepaald dat de stichting een ruimere doelstelling
      heeft dan die, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020809
