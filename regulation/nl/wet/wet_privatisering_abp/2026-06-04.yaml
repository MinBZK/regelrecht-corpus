  - number: '21'
    text: |-
      1 De overheidswerknemers zijn verplicht deel te nemen in de Stichting Pensioenfonds ABP tot het bedrag dat op grond
      van [artikel 18ga, eerste lid, van de Wet op de loonbelasting 1964][ref1] tot het pensioengevend loon behoort.

      2 De Stichting Pensioenfonds ABP heeft tot taak op verzoek van:

      a. de sectorwerkgever, of

      b. de overheidswerkgever, die overheidswerknemers in dienst heeft als bedoeld in
      [artikel 2, eerste lid, onder f, en derde lid, onder b, en c][ref2], vrijstelling voor het nettopensioen te
      verlenen van de nettopensioenregeling van de Stichting Pensioenfonds ABP of de verleende vrijstelling in te
      trekken. De Stichting Pensioenfonds ABP stelt de voorwaarden waaronder de vrijstelling wordt verleend of wordt
      ingetrokken vast, met dien verstande dat de aanspraken op een niet bij de Stichting Pensioenfonds ABP afgesloten
      regeling voor het nettopensioen ten minste gelijkwaardig zijn aan die van de Stichting Pensioenfonds ABP.

      De onder a en b genoemde werkgevers zijn zonder vrijstelling verplicht de nettopensioenregeling van de Stichting
      Pensioenfonds ABP aan de overheidswerknemers aan te bieden.

      3 Op een bij koninklijk besluit, op voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid, nader te bepalen tijdstip is de
      [Wet verplichte deelneming in een bedrijfstakpensioenfonds 2000][ref3] van toepassing. De verplichte deelneming
      in de Stichting Pensioenfonds ABP ingevolge het eerste lid wordt met ingang van die datum aangemerkt als een
      verplichte deelneming ingevolge de in de eerste volzin genoemde wet, welke deelneming alsdan met inachtneming van
      de in [artikel 22, derde lid][ref4], geregelde voorwaarden of van [artikel 23, tweede lid][ref5], overeenkomstig
      laatstbedoelde wet en de op basis daarvan gestelde regels kan worden gewijzigd of ingetrokken.

      4 In afwijking van het derde lid zijn de [artikelen 5][ref6], [6][ref7], [7][ref8], [14][ref9] en de daarop
      berustende ministeriële regeling, [17][ref10], [18][ref11], [19][ref12], [20][ref13], [39, zesde lid][ref14] en
      [39a van de Wet verplichte deelneming in een bedrijfstakpensioenfonds 2000 ][ref15]van overeenkomstige toepassing
      met ingang van de datum waarop die wet in werking treedt tot het tijdstip bedoeld in het derde lid.


