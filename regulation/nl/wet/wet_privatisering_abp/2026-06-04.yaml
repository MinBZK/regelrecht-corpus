  - number: '4'
    text: |-
      1 De aanspraken van overheidswerknemers, gewezen overheidswerknemers en hun nagelaten betrekkingen ter zake van
      pensioenen, alsmede hun daarmee samenhangende verplichtingen, worden neergelegd in een overeenkomst naar burgerlijk
      recht.

      2 De meerderheid van de sectorwerkgevers en de meerderheid van de centrales van overheidspersoneel, verenigd in de
      Raad voor het Overheidspersoneelsbeleid, zijn na 1 januari 1997 bevoegd tot het wijzigen of vervangen van de in het
      eerste lid bedoelde overeenkomst.

      3 De overheidswerkgevers en overheidswerknemers zijn gebonden aan de overeenkomst, bedoeld in het eerste lid, en
      verplicht tot naleving van hetgeen te hunnen aanzien is bepaald in de statuten en reglementen van het pensioenfonds
      of in een uitvoeringsovereenkomst als bedoeld in de [Pensioenwet][ref1], gesloten met een verzekeraar.

      4 Van de overeenkomst, bedoeld in het eerste lid, alsmede van een wijziging of vervanging daarvan, bedoeld in
      het derde lid, wordt door Onze Minister in de Staatscourant mededeling gedaan. De overeenkomst, een wijziging en
      een vervanging daarvan treden niet eerder in werking dan met ingang van de tweede dag na de dagtekening van de
      Staatscourant waarin daarvan mededeling is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020809
