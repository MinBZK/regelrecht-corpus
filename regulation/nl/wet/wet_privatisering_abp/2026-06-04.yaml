  - number: '22'
    text: |-
      1 Tot het tijdstip, bedoeld in [artikel 21, derde lid][ref1], kan, op het gezamenlijk verzoek van het bestuur
      van een B 3-lichaam of een privaatrechtelijk lichaam dat ingevolge [artikel 2, derde lid, onderdeel b][ref2], is
      aangewezen als lichaam waarvan de werknemers deelnemen in de Stichting Pensioenfonds ABP, en het personeel van dat
      lichaam, die aanwijzing door Onze Minister worden ingetrokken.

      2 Het verzoek tot intrekking, bedoeld in het eerste lid, kan namens het personeel worden gedaan door de
      organisaties die het betrokken personeel vertegenwoordigen in het arbeidsvoorwaardenoverleg.

      3 Intrekking van de aanwijzing, bedoeld in [artikel 2, derde lid, onderdeel b][ref3], vindt slechts plaats indien
      de pensioenaanspraken van:

      a. de werknemers van het betrokken lichaam;

      b. de gewezen werknemers van het betrokken lichaam, voor zover zij na hun ontslag niet in dienst zijn getreden
      van een ander lichaam als bedoeld in [artikel 2][ref4] of van een lichaam dat op basis van vrijwilligheid is
      aangesloten bij de Stichting Pensioenfonds ABP, dan wel hun pensioenaanspraken tegenover het ABP of de Stichting
      Pensioenfonds ABP geheel teniet zijn gegaan ten gevolge van waarde-overdracht;

      c. de gepensioneerde, gewezen werknemers van het betrokken lichaam;

      d. de nabestaanden van de in de onderdelen *a*, *b* en *c* bedoelde werknemers;

      door middel van collectieve waardeoverdracht worden ondergebracht bij een andere pensioenuitvoerder als bedoeld in
      de [Pensioenwet][ref5], op zodanige wijze dat wordt voldaan aan de in die wet aan de collectieve waardeoverdracht
      gestelde eisen.


