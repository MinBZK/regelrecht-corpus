      1 Een aanwijzing op grond van artikel B 3 van de Abp-wet wordt aangemerkt als een aanwijzing ingevolge
      [artikel 2, derde lid, onderdeel b][ref1].

      2 Onze Minister kan, gehoord het bestuur van de Stichting Pensioenfonds ABP en de Nederlandsche Bank N.V.,
      een aanwijzing uiterlijk voor het tijdstip, bedoeld in [artikel 21, derde lid][ref2], intrekken indien
      het lichaam niet meer voldoet aan een of meer van de gestelde voorwaarden of aan de eisen als bedoeld in
      [artikel 2, derde lid, onder b, onderscheidenlijk c][ref3].

      3 Indien aan het vijfde lid toepassing wordt gegeven, is [artikel 22, derde lid][ref4], van overeenkomstige
      toepassing.


