      1 Op het gezamenlijke verzoek van de sectorwerkgever en de meerderheid van de binnen de desbetreffende sector
      representatieve verenigingen van overheidspersoneel of centrales van overheidspersoneel kan de verplichte
      deelneming van de desbetreffende sector in de Stichting Pensioenfonds ABP door Onze Minister van Sociale
      Zaken en Werkgelegenheid worden ingetrokken met ingang van een datum die niet voor het tijdstip, bedoeld in
      [artikel 21, derde lid][ref1], is gelegen.

      2 Het [derde lid van artikel 22][ref2] is van overeenkomstige toepassing.


