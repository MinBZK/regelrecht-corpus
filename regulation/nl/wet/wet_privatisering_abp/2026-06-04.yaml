      1 Overheidswerknemer in de zin van deze wet is degene die:

      a. bij een publiekrechtelijk lichaam is aangesteld of in dienst is genomen op arbeidsovereenkomst naar burgerlijk
      recht en die deswege bezoldigd of beloond wordt rechtstreeks ten laste van een publiekrechtelijk lichaam;

      b. in dienst is van een privaatrechtelijk lichaam dat zich het geven van onderwijs aan instellingen als bedoeld in
      dit onderdeel ten doel stelt, bezoldigd of beloond wordt rechtstreeks ten laste van dat lichaam en uit dien hoofde
      werkzaam is aan:

      1°. een Nederlandse bijzondere instelling van wetenschappelijk onderwijs, een bijzondere instelling voor
      hoger beroepsonderwijs, een school, cursus, opleiding of andere instelling voor bijzonder onderwijs, indien de
      personeelskosten hiervan voor ten minste 51 procent door de overheid worden vergoed ingevolge een regeling houdende
      voorwaarden voor bekostiging, toegepast of tot stand gekomen onder verantwoordelijkheid van Onze Minister onder
      wiens departement de instelling ressorteert;

      2°. een Nederlandse bijzondere instelling voor hoger beroepsonderwijs, een school, cursus, opleiding of andere
      instelling voor bijzonder onderwijs, die ingevolge wettelijke bepaling door Onze Minister van Onderwijs, Cultuur en
      Wetenschap zijn aangewezen als bevoegd om aan de studenten of leerlingen op grond van met gunstig gevolg afgelegde
      examens dezelfde diploma’s of getuigschriften uit te reiken als die uitgereikt worden door overeenkomstige door de
      overheid bekostigde instellingen;

      3°. een Nederlandse bijzondere basisschool of bijzondere speciale school voor basisonderwijs, een Nederlandse
      school voor bijzonder speciaal onderwijs of bijzonder voortgezet speciaal onderwijs, of een Nederlandse school
      of instelling voor bijzonder speciaal en voortgezet speciaal onderwijs - anders dan bedoeld onder 1° - waarvan
      het schoolwerkplan blijkens een door Onze Minister van Onderwijs, Cultuur en Wetenschap aan het privaatrechtelijk
      lichaam op verzoek afgegeven beschikking voldoet aan het bij of krachtens de [Wet op het primair onderwijs][ref1]
      of de [Wet op de expertisecentra][ref2] bepaalde omtrent onderwijsactiviteiten of vakken, en aantal lesuren, voor
      zo lang dat lichaam voldoet aan de in deze beschikking op te nemen voorwaarden en bedingen;

      c. in dienst is van een privaatrechtelijk lichaam dat zich het verlenen van ondersteuning van volwasseneneducatie
      ten doel stelt, bezoldigd of beloond wordt rechtstreeks ten laste van dat lichaam en uit dien hoofde werkzaam is
      aan een privaatrechtelijke ondersteuningsinstelling, waarvan de personeelskosten voor ten minste 51 procent door de
      overheid worden vergoed;

      d. in dienst is van een privaatrechtelijk lichaam als bedoeld in
      [artikel 68 van de Wet op het primair onderwijs][ref3], [artikel 69 van de Wet op de expertisecentra][ref4] en
      [artikel 3.34 van de Wet voortgezet onderwijs 2020][ref5], waarvan de personeelskosten voor ten minste 51 procent
      ten laste van de overheidskassen door de scholen worden bekostigd;

      e. in dienst van een samenwerkingsverband als bedoeld in artikel 1 van de Wet op het primair onderwijs en in dienst
      is van een samenwerkingsverband als bedoeld in [artikel 1.1 van de Wet voortgezet onderwijs 2020][ref6];

      f. in dienst is van een B 3-lichaam;

      g. die op 31 december 1995 ambtenaar in de zin van de Abp-wet is ingevolge artikel U 1 van die wet, dan wel op
      grond van artikel 65 van de Organisatiewet sociale verzekeringen, zoals dat artikel luidde op 31 december 1994, en
      wiens dienstverband op 1 januari 1996 niet is beëindigd.

      2 In afwijking van het eerste lid zijn geen overheidswerknemer:

      a. personen waarvan de dienstverhouding is ingegaan op of na het tijdstip waarop zij de pensioengerechtigde
      leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref7] hebben bereikt;

      b. ministers, staatssecretarissen, gedeputeerden, wethouders en de Rijksvertegenwoordiger voor de openbare lichamen
      Bonaire, Sint Eustatius en Saba;

      c. voorzitters en leden van besturen van waterschappen, tenzij de aan hun functie verbonden werkzaamheden een
      dagtaak vormen en zij deswege bezoldigd of beloond worden rechtstreeks ten laste van het waterschap;

      d. voorzitters en leden van besturen van andere publiekrechtelijke lichamen dan in onderdeel c genoemd, wier
      functie overwegend een vertegenwoordigend karakter draagt, tenzij de aan hun functie verbonden werkzaamheden een
      dagtaak vormen en zij deswege bezoldigd of beloond worden rechtstreeks ten laste van een publiekrechtelijk lichaam,
      niet zijnde een openbaar lichaam voor beroep en bedrijf als bedoeld in [artikel 134 van de Grondwet][ref8];

      e. de gouverneurs van Aruba, Curaçao en Sint Maarten;

      f.

      g. personen in dienst van de openbare lichamen voor beroep en bedrijf bedoeld in
      [artikel 134 van de Grondwet][ref9];

      h. personen in dienst van de Nederlandse Organisatie voor toegepast natuurwetenschappelijk onderzoek (T.N.O.);

      i. de Nationale ombudsman en substituut-ombudsmannen;

      j. de personen en groepen van personen die bij door Onze Minister te stellen regels, welke regels in
      overeenstemming met het bestuur van de Stichting Pensioenfonds ABP worden vastgesteld, op grond van hun bijzondere
      arbeidsvoorwaarden of de bijzondere aard van hun werkzaamheden zijn aangewezen;

      k. personen in dienst van een B 3-instelling ten aanzien van wie bij de aanwijzing, bedoeld in artikel B 3 van de
      Abp-wet, is bepaald dat zij geen ambtenaar in de zin van die wet zijn;

      l. personen in dienst van een B 3-instelling waarvan de aanwijzing op of na 1 januari 1996 is of wordt ingetrokken,
      met ingang van de datum van die intrekking.

      3 Tevens wordt als overheidswerknemer aangemerkt degene die in dienst is van:

      a. de Stichting Pensioenfonds ABP;

      b. een privaatrechtelijk lichaam dat tussen 31 december 1995 en het tijdstip van inwerkingtreding van de
      __REF000___________________________________________________________________________________________________________
      _________________________ (Stb. 2001, 537) door Onze Minister op grond van de doelstelling en financiële verhouding
      tot een of meer publiekrechtelijke lichamen is aangewezen als lichaam waarvan de werknemers deelnemen in de
      Stichting Pensioenfonds ABP of dat daartoe vóór het genoemde tijdstip van inwerkingtreding het verzoek had gedaan;

      c. een privaatrechtelijk lichaam, waarvan de arbeidsvoorwaarden van de werknemers van dat lichaam overeenkomen
      met de arbeidsvoorwaarden van het personeel dat werkzaam is in een van de sectoren genoemd in artikel 1, onder q,
      onderdeel 1 tot en met 8, dat tussen 16 november 2001 en het tijdstip van inwerkingtreding van de Wet tot wijziging
      van de Wet privatisering ABP in verband met het schrappen van de aanwijzingsbevoegdheid om een privaatrechtelijk
      lichaam als lichaam waarvan de werknemers deelnemen in de Stichting Pensioenfonds ABP (Stb. 2014, 143), door Onze
      Minister is aangewezen als lichaam waarvan de werknemers deelnemen in de Stichting Pensioenfonds ABP.

      4 Onze Minister kan in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid bij ministeriële
      regeling bepalen dat onderdelen van de arbeidsvoorwaarden van de werknemers en onderdelen van de arbeidsvoorwaarden
      van een sector, voor de vergelijking die volgt uit de toepassing van het derde lid, onder c, buiten beschouwing
      blijven.

      5 Voor de toepassing van de [paragrafen 4][ref11], [9][ref12] en [10][ref13],
      alsmede van [artikel 57][ref14] wordt tevens als overheidswerknemer aangemerkt
      degene die behoort tot het personeel van de Koninklijke Hofhouding, bedoeld in
      __REF004___________________________________________________________________________________________________________
      ____.


