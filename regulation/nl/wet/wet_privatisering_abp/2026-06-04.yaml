  - number: '5'
    text: |-
      1 Indien de sectorwerkgever en de meerderheid van de binnen de desbetreffende sector representatieve verenigingen
      van overheidspersoneel of centrales van overheidspersoneel gezamenlijk daartoe besluiten, kan, na intrekking
      van de verplichte deelneming overeenkomstig [artikel 21, derde lid][ref1], de overeenkomst, bedoeld in
      [artikel 4, eerste lid][ref2], voor zover deze de eigen sector betreft, worden gesloten door die sectorwerkgever en
      de meerderheid van die verenigingen van overheidspersoneel of centrales van overheidspersoneel.

      2 In overeenstemming met de desbetreffende sectorwerkgever en na het advies van de ROP hieromtrent te hebben
      ontvangen, bepaalt Onze Minister of een vereniging van overheidspersoneel die niet is aangesloten bij een centrale
      van overheidspersoneel, representatief is in een of meerdere sectoren.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de
      bevoegdheid met ingang van het tijdstip, bedoeld in [artikel 21, derde lid][ref3], tot het sluiten van de in
      [artikel 4, eerste lid][ref4], bedoelde overeenkomst ten aanzien van B 3-lichamen en privaatrechtelijke lichamen
      als bedoeld in [artikel 2, derde lid, onderdeel b][ref5], die met ingang van 1 januari 1996 of een latere datum tot
      de Stichting Pensioenfonds ABP zijn toegetreden.


