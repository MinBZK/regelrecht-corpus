preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het wenselijk is de verantwoordelijkheid voor de pensioenen
    van het overheidspersoneel in handen te leggen van de betrokken sociale partners en met het oog daarop het
    Algemeen burgerlijk pensioenfonds om te vormen tot een privaatrechtelijk pensioenfonds waarop de Pensioen- en
    spaarfondsenwet van toepassing is, alsmede dat in verband daarmee een voorziening dient te worden getroffen inzake
    de arbeidsongeschiktheidsverzekering van dat personeel;


    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007791/2026-06-04#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a.

      b. ABP: het Algemeen burgerlijk pensioenfonds, bedoeld in artikel L 1 van de Abp-wet;

      c. Abp-wet: de Algemene burgerlijke pensioenwet;

      d.

      e. ambtenaar: de ambtenaar, bedoeld in de artikelen B 1, B 2 en B 3 van de Abp-wet, alsmede degene die ambtenaar is
      ingevolge de krachtens artikel B 7, onderdeel b, van de Abp-wet gestelde regels, zoals deze luidden op 31 december
      1995;

      f. Amp-wet: de Algemene militaire pensioenwet;

      g. B 3-lichaam: een privaatrechtelijk lichaam dat op 31 december 1995, op grond van artikel B 3 van de Abp-wet,
      was aangewezen of op grond van artikel U 2 van de Abp-wet geacht werd te zijn aangewezen als lichaam waarvan het
      personeel geheel of ten dele ambtenaar in de zin van de Abp-wet is;

      h.

      i.

      j. nettopensioen: het nettopensioen, bedoeld in [artikel 1 van de Pensioenwet][ref1];

      k. Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      l. overheidspersoneel: de overheidswerknemers en de militairen, bedoeld in artikel A 1, eerste lid, van de Amp-
      wet, alsmede degenen die ingevolge het tweede lid van dat artikel daaronder worden begrepen, met inachtneming van
      artikel A 4 van die wet;

      m. overheidswerkgever: ieder gezag of bestuur dat bevoegd is tot aanstelling of indienstneming en ontslag van een
      overheidswerknemer en voor de toepassing van de [paragrafen 4][ref2], [9][ref3] en [10][ref4] de Stichting tot
      verzorging van de pensioenen van het personeel van de Koninklijke Hofhouding van het Huis van Oranje-Nassau;

      n. overheidswerknemer: de overheidswerknemer, bedoeld in [artikel 2][ref5];

      o.

      p. de ROP: de Raad voor het Overheidspersoneelsbeleid;

      q. sectorwerkgever:

      1°. van het personeel dat werkzaam is in de sector Rijk: Onze Minister;

      2°. van het personeel dat werkzaam is in de sector Defensie: Onze Minister van Defensie;

      3°. van het personeel dat werkzaam is in de sector Politie: Onze Minister van Justitie en Veiligheid;

      4°. van het personeel dat werkzaam is in de sector Rechterlijke Macht: Onze Minister van Justitie en Veiligheid;

      5°. van het personeel dat werkzaam is in de sector Gemeenten: de Vereniging van Nederlandse Gemeenten;

      6°. van het personeel dat werkzaam is in de sector Provincies: het Interprovinciaal Overleg;

      7°. van het personeel dat werkzaam is in de sector Waterschappen: de Vereniging werken voor waterschappen;

      8°. van personeel dat niet werkzaam is in een van de onder 1° tot en met 7° genoemde sectoren: *(a)*. de
      sectorwerkgever van de sector waartoe de instelling waarbij het desbetreffende personeel werkzaam is, wordt
      gerekend, gelet op de aard van de werkzaamheid van die instelling, de arbeidsvoorwaarden of de financiële
      verhouding met een of meer overheids- of onderwijsinstellingen, of *(b)*. de sectorwerkgever van de door Onze
      Minister aangewezen sector, of *(c)*. een door Onze Minister aangewezen, met de onder 1° tot en met 7° genoemde
      sectorwerkgevers gelijk te stellen, ander gezag of andere instantie.


