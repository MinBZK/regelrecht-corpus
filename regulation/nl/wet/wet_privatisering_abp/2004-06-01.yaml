        artikel: 53b
  - number: 2.1.f
    text: in dienst is van een B 3-lichaam;
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel2
  - number: 2.1.g
    text: |-
      die op 31 december 1995 ambtenaar in de zin van de Abp-wet is ingevolge artikel U 1 van die wet, dan wel op grond
      van artikel 65 van de Organisatiewet sociale verzekeringen, zoals dat artikel luidde op 31 december 1994, en wiens
      dienstverband op 1 januari 1996 niet is beëindigd.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel2
  - number: '2.2'
    text: 'In afwijking van het eerste lid zijn geen overheidswerknemer:'
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel2
  - number: 2.2.a
    text: |-
      personen waarvan de dienstverhouding is ingegaan op of na het tijdstip waarop zij de leeftijd van 65 jaar hebben
      bereikt;
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel2
  - number: 2.2.b
    text: ministers, staatssecretarissen, gedeputeerden, wethouders en voorzitters van deelgemeenteraden;
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel2
  - number: 2.2.c
    text: |-
      voorzitters en leden van besturen van waterschappen, tenzij de aan hun functie verbonden werkzaamheden een dagtaak
      vormen en zij deswege bezoldigd of beloond worden rechtstreeks ten laste van het waterschap;
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel2
  - number: 2.2.d
    text: |-
      voorzitters en leden van besturen van andere publiekrechtelijke lichamen dan in onderdeel c genoemd, wier functie
      overwegend een vertegenwoordigend karakter draagt, tenzij de aan hun functie verbonden werkzaamheden een dagtaak
      vormen en zij deswege bezoldigd of beloond worden rechtstreeks ten laste van een publiekrechtelijk lichaam, niet
      zijnde een openbaar lichaam voor beroep en bedrijf als bedoeld in [artikel 134 van de Grondwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel134
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '134'
  - number: 2.2.e
    text: de gouverneurs van de Nederlandse Antillen en van Aruba;
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel2
  - number: 2.2.g
    text: |-
      personen in dienst van de openbare lichamen voor beroep en bedrijf bedoeld in [artikel 134 van de Grondwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel134
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '134'
  - number: 2.2.h
    text: personen in dienst van de Nederlandse Organisatie voor toegepast natuurwetenschappelijk onderzoek (T.N.O.);
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel2
  - number: 2.2.i
    text: de Nationale ombudsman en substituut-ombudsmannen;
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel2
  - number: 2.2.j
    text: |-
      de personen en groepen van personen die bij door Onze Minister te stellen regels, welke regels in overeenstemming
      met het bestuur van de Stichting Pensioenfonds ABP worden vastgesteld, op grond van hun bijzondere
      arbeidsvoorwaarden of de bijzondere aard van hun werkzaamheden zijn aangewezen;
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel2
  - number: 2.2.k
    text: |-
      personen in dienst van een B 3-instelling ten aanzien van wie bij de aanwijzing, bedoeld in artikel B 3 van de Abp-
      wet, is bepaald dat zij geen ambtenaar in de zin van die wet zijn;
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel2
  - number: 2.2.l
    text: |-
      personen in dienst van een B 3-instelling waarvan de aanwijzing op of na 1 januari 1996 is of wordt ingetrokken,
      met ingang van de datum van die intrekking.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel2
  - number: '2.3'
    text: 'Tevens wordt als overheidswerknemer aangemerkt degene die in dienst is van:'
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel2
  - number: 2.3.a
    text: de Stichting Pensioenfonds ABP;
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel2
  - number: 2.3.b
    text: |-
      een privaatrechtelijk lichaam dat met ingang van een datum gelegen na 31 december 1995 ,door Onze Minister, op
      grond van de doelstelling en financiële verhouding tot een of meer publiekrechtelijke lichamen, is aangewezen als
      lichaam waarvan de werknemers deelnemen in de Stichting Pensioenfonds ABP;
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel2
  - number: 2.3.c
    text: |-
      een privaatrechtelijk lichaam, waarvan de arbeidsvoorwaarden van de werknemers van dat lichaam
      overeenkomen met de arbeidsvoorwaarden van het personeel dat werkzaam is in een van de sectoren
      genoemd in [artikel 1, onder q, onderdeel 1 tot en met 8][ref1], dat voor het tijdstip, bedoeld in
      [artikel 21, derde lid][ref2], door Onze Minister, met inachtneming van [artikel 3][ref3] is aangewezen als lichaam
      waarvan de werknemers deelnemen in de Stichting Pensioenfonds ABP.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007791#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0007791#Artikel3
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007791
        artikel: '21'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0007791
        artikel: '3'
        paragraaf: '1'
  - number: '2.4'
    text: 'De in het derde lid, onder c, bedoelde aanwijzing vindt uitsluitend plaats indien:'
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel2
  - number: 2.4.a
    text: |-
      werknemers in dienst van het aan te wijzen lichaam overheidswerknemer zijn op de dag voorafgaande aan het tijdstip
      waarop de beoogde deelneming op basis van die aanwijzing in werking zal treden, en
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel2
  - number: 2.4.b
    text: |-
      het verzoek om aanwijzing een gezamenlijk verzoek is van werkgever en werknemers die bevoegd zijn tot vaststelling
      van de arbeidsvoorwaarden voor de werknemers van dat lichaam, dan wel een verzoek is van hun vertegenwoordigers.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel2
  - number: '2.5'
    text: |-
      Onze Minister kan in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid bij ministeriële
      regeling bepalen dat onderdelen van de arbeidsvoorwaarden van de werknemers en onderdelen van de arbeidsvoorwaarden
      van een sector, voor de vergelijking die volgt uit de toepassing van het derde lid, onder c, buiten beschouwing
      blijven.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel2
  - number: '2.6'
    text: |-
      Voor de toepassing van de [paragrafen 4][ref1], [9][ref2] en [10][ref3], alsmede van [artikel 57][ref4] wordt tevens
      als overheidswerknemer aangemerkt degene die behoort tot het personeel van de Koninklijke Hofhouding, bedoeld in
      __REF004___________________________________________________________________________________________________________
      ___.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Paragraaf4
      [ref2]: https://wetten.overheid.nl/BWBR0007791#Paragraaf9
      [ref3]: https://wetten.overheid.nl/BWBR0007791#Paragraaf10
      [ref4]: https://wetten.overheid.nl/BWBR0007791#Artikel57
      [ref5]: https://wetten.overheid.nl/BWBR0008328#Artikel1
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007791
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0007791
        paragraaf: '9'
      - id: ref3
        bwb_id: BWBR0007791
        paragraaf: '10'
      - id: ref4
        bwb_id: BWBR0007791
        artikel: '57'
        paragraaf: '11'
      - id: ref5
        bwb_id: BWBR0008328
        artikel: '1'
  - number: '3.1'
    text: |-
      Een aanwijzing als bedoeld in [artikel 2, derde lid, onderdeel c][ref1], geschiedt door Onze Minister na
      overleg met Onze Minister van Sociale Zaken en Werkgelegenheid en op voordracht van het bestuur van de Stichting
      Pensioenfonds ABP.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel2
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '2'
        paragraaf: '1'
  - number: '3.2'
    text: Onze Minister kan aan een aanwijzing voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel3
  - number: '3.3'
    text: |-
      In de voordracht, bedoeld in het eerste lid, geeft het bestuur van de Stichting Pensioenfonds ABP aan of wordt
      voldaan aan de te stellen eis inzake de arbeidsvoorwaarden, bedoeld in [artikel 2, derde lid, onder c][ref1],
      alsmede of aan een aanwijzing voorwaarden dienen te worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel2
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '2'
        paragraaf: '1'
  - number: '3.4'
    text: |-
      Een aanwijzing op grond van artikel B 3 van de Abp-wet wordt aangemerkt als een aanwijzing ingevolge
      [artikel 2, derde lid, onderdeel ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel2
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '2'
        paragraaf: '1'
  - number: '3.5'
    text: |-
      Onze Minister kan, gehoord het bestuur van de Stichting Pensioenfonds ABP en de Pensioen- & Verzekeringskamer,
      een aanwijzing uiterlijk voor het tijdstip, bedoeld in [artikel 21, derde lid][ref1], intrekken indien
      het lichaam niet meer voldoet aan een of meer van de gestelde voorwaarden of aan de eisen als bedoeld in
      [artikel 2, derde lid, onder b, onderscheidenlijk c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0007791#Artikel2
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '21'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0007791
        artikel: '2'
        paragraaf: '1'
  - number: '3.6'
    text: |-
      Indien aan het vijfde lid toepassing wordt gegeven, is [artikel 22, derde lid][ref1], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel22
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '22'
        paragraaf: '5'
  - number: '4.1'
    text: |-
      De aanspraken van overheidswerknemers, gewezen overheidswerknemers en hun nagelaten betrekkingen ter zake van
      pensioenen, alsmede hun daarmee samenhangende verplichtingen, worden neergelegd in een overeenkomst naar burgerlijk
      recht.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel4
  - number: '4.2'
    text: |-
      Onze Minister en de meerderheid van de centrales van overheidspersoneel die in de Centrale Commissie
      vertegenwoordigd zijn, zijn bevoegd tot het sluiten van de overeenkomst, bedoeld in het eerste lid, die op 1
      januari 1996 in werking treedt.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel4
  - number: '4.3'
    text: |-
      De meerderheid van de sectorwerkgevers en de meerderheid van de centrales van overheidspersoneel, verenigd in de
      Raad voor het Overheidspersoneelsbeleid, zijn na 1 januari 1997 bevoegd tot het wijzigen of vervangen van de in het
      eerste lid bedoelde overeenkomst.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel4
  - number: '4.4'
    text: |-
      De in het tweede en derde lid bedoelde bevoegdheid geldt niet ten aanzien van het B 3-lichaam dat met ingang van 1
      januari 1996 of een latere datum niet langer deelneemt in de Stichting Pensioenfonds ABP.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel4
  - number: '4.5'
    text: |-
      De overheidswerkgevers en overheidswerknemers zijn gebonden aan de overeenkomst, bedoeld in het eerste lid, en
      verplicht tot naleving van hetgeen te hunnen aanzien is bepaald in de statuten en reglementen van het pensioenfonds
      of in een verzekeringsovereenkomst als bedoeld in artikel 2, vierde lid, van de PSW.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel4
  - number: '4.6'
    text: |-
      De overeenkomst, bedoeld in het eerste lid, alsmede een wijziging of vervanging daarvan, bedoeld in het derde lid,
      worden door Onze Minister in de *Staatscourant* geplaatst. De overeenkomst, een wijziging en een vervanging daarvan
      treden niet eerder in werking dan met ingang van de tweede dag na de dagtekening van de *Staatscourant* waarin deze
      worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel4
  - number: '5.1'
    text: |-
      Indien de sectorwerkgever en de meerderheid van de binnen de desbetreffende sector representatieve verenigingen
      van overheidspersoneel of centrales van overheidspersoneel gezamenlijk daartoe besluiten, kan, na intrekking
      van de verplichte deelneming overeenkomstig [artikel 21, derde lid][ref1], de overeenkomst, bedoeld in
      [artikel 4, eerste lid][ref2], voor zover deze de eigen sector betreft, worden gesloten door die sectorwerkgever en
      de meerderheid van die verenigingen van overheidspersoneel of centrales van overheidspersoneel.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0007791#Artikel4
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '21'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0007791
        artikel: '4'
        paragraaf: '2'
  - number: '5.2'
    text: |-
      In overeenstemming met de desbetreffende sectorwerkgever en na het advies van de ROP hieromtrent te hebben
      ontvangen, bepaalt Onze Minister of een vereniging van overheidspersoneel die niet is aangesloten bij een centrale
      van overheidspersoneel, representatief is in een of meerdere sectoren.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel5
  - number: '5.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de
      bevoegdheid met ingang van het tijdstip, bedoeld in [artikel 21, derde lid][ref1], tot het sluiten van de in
      [artikel 4, eerste lid][ref2], bedoelde overeenkomst ten aanzien van B 3-lichamen en privaatrechtelijke lichamen
      als bedoeld in [artikel 2, derde lid, onderdeel b][ref3], die met ingang van 1 januari 1996 of een latere datum tot
      de Stichting Pensioenfonds ABP zijn toegetreden.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0007791#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0007791#Artikel2
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '21'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0007791
        artikel: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0007791
        artikel: '2'
        paragraaf: '1'
  - number: '6.1'
    text: |-
      Onze Minister is gemachtigd om namens de Staat der Nederlanden deel te nemen aan de oprichting van de Stichting
      Pensioenfonds ABP.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel6
  - number: '6.2'
    text: |-
      De Stichting Pensioenfonds ABP heeft tot doel om als bedrijfstakpensioenfonds als bedoeld in artikel 1, eerste
      lid, onderdeel *b*, van de PSW werkzaam te zijn ten behoeve van overheid, onderwijs en daarmee gelieerde
      privaatrechtelijke lichamen.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel6
  - number: '6.3'
    text: |-
      In de statuten van de Stichting Pensioenfonds ABP kan worden bepaald dat de stichting een ruimere doelstelling
      heeft dan die, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel6
  - number: '7.1'
    text: |-
      De belanghebbende verkrijgt met ingang van 1 januari 1996 aanspraken op ouderdoms- en nabestaandenpensioen jegens
      de Stichting Pensioenfonds ABP die in totaliteit gelijkwaardig zijn aan het uitzicht of het recht dat hij op 31
      december 1995 ter zake ontleent aan de Abp-wet en de wijzigingswetten van die wet, met inachtneming van hetgeen ter
      zake in [paragraaf 3][ref1] is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Paragraaf3
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007791
        paragraaf: '3'
  - number: '7.2'
    text: |-
      De belanghebbende verkrijgt met inachtneming van [paragraaf 4][ref1] met ingang van 1 januari 1996 aanspraken op
      invaliditeitspensioen of herplaatsingstoelage jegens de Stichting Pensioenfonds ABP, die tezamen met de aanspraken
      jegens het FAOP op een WAO-conforme uitkering ingevolge [artikel 32, eerste lid][ref2], juncto [artikel 37][ref3]
      in totaliteit gelijkwaardig zijn aan de overeenkomstige aanspraken ingevolge de Abp-wet en de wijzigingswetten van
      die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Paragraaf4
      [ref2]: https://wetten.overheid.nl/BWBR0007791#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0007791#Artikel37
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007791
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0007791
        artikel: '32'
        paragraaf: '9'
      - id: ref3
        bwb_id: BWBR0007791
        artikel: '37'
        paragraaf: '9'
  - number: '7.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing ten aanzien van het personeelslid van het ABP waarop
      [artikel 27][ref1] van toepassing is, behoudens het vierde lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel27
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '27'
        paragraaf: '7'
  - number: '7.4'
    text: |-
      Het bestuur van de Stichting Pensioenfonds ABP verstrekt aan degene die op 31 december 1995 ambtenaar is of recht
      op invaliditeitspensioen heeft, alsmede voor zover mogelijk aan de gewezen ambtenaar aan wie nog geen pensioen
      is toegekend, een schriftelijke opgave van het uit hoofde van zijn dienstbetrekking opgebouwde uitzicht op
      pensioen ingevolge de Abp-wet. Deze opgave bevat ten minste de voor pensioen geldende diensttijd, alsmede de twee
      berekeningsgrondslagen die zouden zijn gehanteerd indien aan hem pensioen ingevolge de Abp-wet zou zijn verleend
      met ingang van 1 januari 1996.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel7
  - number: '7.5'
    text: |-
      De opgave, bedoeld in het vierde lid, wordt aangemerkt als een besluit als bedoeld in
      [artikel 1:3 van de Algemene wet bestuursrecht][ref1]. Ten aanzien van deze opgave is hoofdstuk S van de Abp-wet,
      zoals dat luidde op 31 december 1995, van overeenkomstige toepassing, met dien verstande dat wordt begrepen onder:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
  - number: 7.5.a
    text: 'bestuur: het bestuur van de Stichting Pensioenfonds ABP;'
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel7
  - number: 7.5.b
    text: 'directieraad: de directieraad van de Stichting Pensioenfonds ABP.'
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel7
  - number: '8.1'
    text: 'Voor de belanghebbende die op 31 december 1995 ingevolge:'
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel8
  - number: 8.1.a
    text: de artikelen D 1, tweede lid, en D 2 van de Abp-wet;
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel8
  - number: 8.1.b
    text: artikel T 4 of U 8*a* van de Abp-wet;
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel8
  - number: 8.1.c
    text: |-
      artikel V van de wet van 28 april 1976 tot wijziging van de Algemene burgerlijke pensioenwet en andere
      overheidspensioenwetten in verband met uittreding van Suriname uit het Koninkrijk (*Stb.* 323);
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel8
  - number: 8.1.d
    text: |-
      artikel IX, de onderdelen C en X, van de wet van 7 mei 1986 tot wijziging van de Algemene burgerlijke pensioenwet
      en andere overheidspensioenwetten (*Stb.* 303);
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel8
  - number: 8.1.e
    text: |-
      artikel III, onderdeel B, van de wet van 3 juli 1986 tot wijziging van de Algemene burgerlijke pensioenwet en
      de Spoorwegpensioenwet met betrekking tot deelgerechtigden die de leeftijd van 25 jaar nog niet hebben bereikt
      ( *Stb.* 393);
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel8
  - number: 8.1.f
    text: |-
      [artikel 33 van de Wet privatisering Spoorwegpensioenfonds][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006319#Artikel33
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006319
        artikel: '33'
  - number: 8.1.g
    text: artikel 76 van de Wet FVP/ABP;
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel8
  - number: '8.2'
    text: |-
      Ten aanzien van de in het eerste lid, onderdeel *a*, bedoelde externe diensttijd blijft artikel 75 van de Wet FVP/
      ABP, zoals dat artikel luidde op 31 december 1995, van toepassing.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel8
  - number: '8.3'
    text: |-
      Het bestuur van de Stichting Pensioenfonds ABP doet aan de belanghebbende opgave van de externe diensttijd, bedoeld
      in het eerste lid. Op deze opgave is [artikel 7, vijfde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel7
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '7'
        paragraaf: '2'
  - number: '8.4'
    text: |-
      Tenzij belanghebbende tijdig te kennen heeft gegeven geen overname van externe diensttijd te wensen, wordt
      door het bestuur van de Stichting Pensioenfonds ABP mededeling van de overname gedaan aan de betrokken
      pensioeninstantie, voor zover dit noodzakelijk is in verband met het voorkomen van een dubbele pensioentoekenning
      over de door de Stichting Pensioenfonds ABP overgenomen externe diensttijd dan wel de toepassing van
      [artikel 33 van de Wet privatisering Spoorwegpensioenfonds][ref1] of artikel 76 van de Wet FVP/ABP.


      [ref1]: https://wetten.overheid.nl/BWBR0006319#Artikel33
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006319
        artikel: '33'
  - number: '10.1'
    text: |-
      De op 31 december 1995 reeds ingegane pensioenen en reeds bestaande uitzichten op pensioen worden door het bestuur
      van de Stichting Pensioenfonds ABP aangepast aan algemene bezoldigingswijzigingen en eenmalige uitkeringen,
      overeenkomstig artikel A 8 van de Abp-wet, zoals dat artikel op genoemde datum luidde, tenzij de financiële
      positie van het pensioenfonds zich dwingend tegen die aanpassing verzet. In het pensioenreglement van de Stichting
      Pensioenfonds ABP wordt bepaald wanneer sprake is van de in de vorige volzin bedoelde financiële positie.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel10
  - number: '10.2'
    text: |-
      In het pensioenreglement van de Stichting Pensioenfonds ABP kan worden bepaald dat de in het eerste lid bedoelde
      aanpassing in beginsel op een of meer vaste tijdstippen in het jaar plaatsvindt en is gebaseerd op de algemene
      bezoldigingswijzigingen en eenmalige aanpassingen die zich gedurende een bepaalde periode voorafgaand aan de
      genoemde data hebben voorgedaan.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel10
  - number: '11.1'
    text: |-
      In het pensioenreglement van de Stichting Pensioenfonds ABP kan worden bepaald dat de op 31 december 1995
      bestaande pensioenaanspraken nader worden vastgesteld met inachtneming van de berekeningsgrondslag, bedoeld
      in artikel F 4 van de Abp-wet, voor het jaar 1995, onderscheidenlijk de op 31 december 1995 geldende middelsom
      of aangepaste middelsom, bedoeld in artikel F 6 van de Abp-wet, en de uniforme franchise, bedoeld in artikel
      F 7aa van de Abp-wet. Een en ander op zodanige wijze dat een correctiefactor wordt vastgesteld ten aanzien van
      de berekeningsgrondslag, onderscheidenlijk de franchise, met welke correctiefactoren de voor pensioen geldende
      diensttijd voor zover gelegen voor 1 januari 1996 wordt vermenigvuldigd.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel11
  - number: '11.2'
    text: |-
      Indien het pensioenreglement van de Stichting Pensioenfonds ABP bepalingen inhoudt overeenkomstig het eerste
      lid, wordt daarin tevens bepaald dat aan de belanghebbende mededeling wordt gedaan van de in dat lid bedoelde
      correctiefactoren, welke mededeling is voorzien van een toereikende toelichting.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel11
  - number: '12'
    text: |-
      In het pensioenreglement van de Stichting Pensioenfonds ABP kan worden bepaald dat het pensioen over diensttijd
      voor 1 januari 1996 van degene die na 31 december 1995 overheidswerknemer is in de zin van deze wet, wordt
      berekend op basis van het tot een jaarbedrag herleide inkomen dat de belanghebbende ontving in de maand januari
      van het kalenderjaar dat voorafgaat aan het kalenderjaar van ontslag en van de vaste toeslagen die behoren tot
      het ambtelijk inkomen in de zin van artikel C 1 van de Abp-wet, zoals dat luidde op 31 december 1995, welke
      belanghebbende ontving in het kalenderjaar voorafgaande aan vorenbedoelde maand januari.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel12
  - number: '13.1'
    text: |-
      In het pensioenreglement van de Stichting Pensioenfonds ABP kan ten aanzien van de inbouw van het pensioen
      ingevolge de [Algemene Ouderdomswet][ref1] in het pensioen dat wordt berekend over diensttijd voor 1 januari 1986,
      worden bepaald dat deze geschiedt met inachtneming van twee procent per dienstjaar van:


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 13.1.a
    text: |-
      het tot een jaarbedrag herleide bedrag aan pensioen ingevolge de [Algemene Ouderdomswet][ref1] waarop de
      belanghebbende die voor de toepassing van die wet als ongehuwd wordt aangemerkt, recht heeft dan wel recht
      zou hebben gehad indien hij op grond van die wet verzekerd zou zijn geweest, ten aanzien van de genoemde
      belanghebbende;


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 13.1.b
    text: |-
      twee maal het tot een jaarbedrag herleide bedrag aan pensioen ingevolge de [Algemene Ouderdomswet][ref1] waarop de
      belanghebbende die voor de toepassing van die wet als gehuwd wordt aangemerkt, recht heeft dan wel recht zou hebben
      gehad indien hij op grond van die wet verzekerd zou zijn geweest, ten aanzien van de genoemde belanghebbende.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: '13.2'
    text: |-
      Indien het pensioenreglement van de Stichting Pensioenfonds ABP bepalingen inhoudt overeenkomstig het eerste lid,
      wordt daarin tevens bepaald dat aan de belanghebbende een toeslag wordt verleend:
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel13
  - number: 13.2.a
    text: |-
      voor de tijd waarover de voor pensioen geldende diensttijd samenvalt met tijd gedurende welke de belanghebbende
      of diens echtgenoot dan wel degene die ingevolge de [Algemene Ouderdomswet][ref1] mede als echtgenoot wordt
      aangemerkt, niet verzekerd dan wel vrijwillig verzekerd is geweest ingevolge die wet;


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 13.2.b
    text: |-
      in het geval de echtgenoot van de belanghebbende dan wel degene die ingevolge de [Algemene Ouderdomswet][ref1] mede
      als echtgenoot wordt aangemerkt, de leeftijd van 65 jaar nog niet heeft bereikt en belanghebbende geen recht heeft
      op de volledige toeslag, bedoeld in [artikel 8][ref2] van genoemde wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel8
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '8'
  - number: '13.3'
    text: 'Het eerste en tweede lid zijn van overeenkomstige toepassing ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel13
  - number: 13.3.a
    text: een pensioen, een tijdelijke uitkering en een wezenpensioen als bedoeld in de Algemene Weduwen- en Wezenwet;
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel13
  - number: 13.3.b
    text: |-
      een pensioen of uitkering toegekend krachtens een wettelijke regeling van de Nederlandse Antillen, van Aruba
      of van een vreemde mogendheid voor zover naar aard en strekking overeenkomend met een pensioen ingevolge de
      [Algemene Ouderdomswet][ref1] dan wel een pensioen of uitkering ingevolge de Algemene Weduwen- en Wezenwet.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: '14.1'
    text: |-
      In het pensioenreglement van de Stichting Pensioenfonds ABP kan ten aanzien van de vermindering van de inbouw van
      het pensioen ingevolge de [Algemene Ouderdomswet][ref1] in het pensioen dat wordt berekend over diensttijd voor 1
      januari 1986, bedoeld in de artikelen J 14 en J 15 van de Abp-wet, zoals deze luidden op 31 december 1995, worden
      bepaald dat in plaats van die vermindering een toeslag wordt toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: '14.2'
    text: 'Het eerste lid is van overeenkomstige toepassing ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel14
  - number: 14.2.a
    text: een pensioen, een tijdelijke uitkering en een wezenpensioen als bedoeld in de Algemene Weduwen- en Wezenwet;
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel14
  - number: 14.2.b
    text: |-
      een pensioen of uitkering toegekend krachtens een wettelijke regeling van de Nederlandse Antillen, van Aruba
      of van een vreemde mogendheid voor zover naar aard en strekking overeenkomend met een pensioen ingevolge de
      [Algemene Ouderdomswet][ref1] dan wel een pensioen of uitkering ingevolge de Algemene Weduwen- en Wezenwet.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: '15'
    text: |-
      In het pensioenreglement van de Stichting Pensioenfonds ABP kan worden bepaald dat de aanspraken op bijzonder
      nabestaandenpensioen van de gewezen echtgenoot van degene die op 31 december 1995 ambtenaar is en na die datum
      overheidswerknemer in de zin van deze wet, wiens echtscheiding voor of uiterlijk op de genoemde datum tot stand is
      gekomen, worden vastgesteld met inachtneming van de berekeningsgrondslag, bedoeld in artikel F 4 van de Abp-wet,
      voor het jaar 1995.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel15
  - number: '17.1'
    text: |-
      De belanghebbende die op 31 december 1995 recht heeft op een of meer invaliditeitspensioenen of
      herplaatsingstoelagen ingevolge de Abp-wet waarvan de duur niet met ingang van 1 januari 1996 is verstreken,
      verkrijgt met ingang van laatstgenoemde datum jegens de Stichting Pensioenfonds ABP uitsluitend een aanspraak op
      een invaliditeitspensioen of een herplaatsingstoelage als bedoeld in [artikel 7, tweede lid][ref1], voor zover de
      op 31 december 1995 geldende aanspraak op invaliditeitspensioen, onderscheidenlijk herplaatsingstoelage wat hoogte
      en duur betreft, uitgaat boven de aanspraak op een WAO-conforme uitkering ingevolge [artikel 32, eerste lid][ref2],
      juncto [artikel 37][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007791#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0007791#Artikel37
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007791
        artikel: '32'
        paragraaf: '9'
      - id: ref3
        bwb_id: BWBR0007791
        artikel: '37'
        paragraaf: '9'
  - number: '17.2'
    text: |-
      Het bestuur van het FAOP maakt de vastgestelde aanspraak op een WAO-conforme uitkering kenbaar aan het bestuur van
      de Stichting Pensioenfonds ABP.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel17
  - number: '18'
    text: |-
      In het pensioenreglement van de Stichting Pensioenfonds ABP kan worden bepaald dat het invaliditeitspensioen of
      de herplaatsingstoelage, bedoeld in [artikel 17, eerste lid][ref1], waarop belanghebbende met ingang van 1 januari
      1996 aanspraak heeft, wordt aangepast overeenkomstig wijzigingen in het recht op de WAO-conforme uitkering, bedoeld
      in [artikel 32, eerste lid][ref2], juncto [artikel 37][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0007791#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0007791#Artikel37
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '17'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0007791
        artikel: '32'
        paragraaf: '9'
      - id: ref3
        bwb_id: BWBR0007791
        artikel: '37'
        paragraaf: '9'
  - number: '19.1'
    text: |-
      De in [artikel 17, eerste lid][ref1], bedoelde belanghebbende die op 1 januari 1996 de leeftijd van 65 jaar nog
      niet heeft bereikt, heeft tot de eerste dag van de maand waarin hij die leeftijd bereikt ten minste aanspraak op
      het diensttijdpensioen verminderd met de aanspraak op een WAO-conforme uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel17
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '17'
        paragraaf: '4'
  - number: '19.2'
    text: |-
      Het diensttijdpensioen, bedoeld in het eerste lid, is het uitsluitend naar de diensttijd ten tijde van het ontslag
      berekende ouderdomspensioen, zonder toepassing van de inbouw van algemeen pensioen of aftrek van een franchise.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel19
  - number: '19.3'
    text: |-
      Ten aanzien van het diensttijdpensioen is [artikel 11][ref1] van overeenkomstige toepassing, met dien
      verstande dat in het pensioenreglement van de Stichting Pensioenfonds ABP kan worden bepaald dat de aanspraak
      op diensttijdpensioen kan worden uitgedrukt in een percentage van de aangepaste middelsom, bedoeld in
      [artikel 11, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0007791#Artikel11
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '11'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0007791
        artikel: '11'
        paragraaf: '3'
  - number: '20'
    text: |-
      De [artikelen 17 tot en met 19][ref1] zijn van overeenkomstige toepassing op het invaliditeitspensioen van de
      betrokkene, bedoeld in [artikel 59, eerste lid][ref2], na het einde van het recht op diens naar aard en strekking
      met herplaatsingswachtgeld overeenkomende uitkering, dan wel diens herplaatsingswachtgeld, met dien verstande dat
      in [artikel 18, eerste lid][ref3], voor "[artikel 32, eerste lid][ref4], juncto [artikel 37][ref5]" dient te worden
      gelezen: [artikel 32, eerste lid][ref6], juncto [artikel 42][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0007791#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0007791#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0007791#Artikel32
      [ref5]: https://wetten.overheid.nl/BWBR0007791#Artikel37
      [ref6]: https://wetten.overheid.nl/BWBR0007791#Artikel32
      [ref7]: https://wetten.overheid.nl/BWBR0007791#Artikel42
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '17'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0007791
        artikel: '59'
        paragraaf: '11'
      - id: ref3
        bwb_id: BWBR0007791
        artikel: '18'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0007791
        artikel: '32'
        paragraaf: '9'
      - id: ref5
        bwb_id: BWBR0007791
        artikel: '37'
        paragraaf: '9'
      - id: ref6
        bwb_id: BWBR0007791
        artikel: '32'
        paragraaf: '9'
      - id: ref7
        bwb_id: BWBR0007791
        artikel: '42'
        paragraaf: '9'
  - number: '21.1'
    text: De overheidswerknemers zijn verplicht deel te nemen in de Stichting Pensioenfonds ABP.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel21
  - number: '21.3'
    text: |-
      Op een bij koninklijk besluit, op voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid, nader te bepalen tijdstip is de
      [Wet verplichte deelneming in een bedrijfstakpensioenfonds 2000][ref1] van toepassing. De verplichte deelneming
      in de Stichting Pensioenfonds ABP ingevolge het eerste lid wordt met ingang van die datum aangemerkt als een
      verplichte deelneming ingevolge de in de eerste volzin genoemde wet, welke deelneming alsdan met inachtneming van
      de in [artikel 22, derde lid][ref2], geregelde voorwaarden of van [artikel 23, tweede lid][ref3], overeenkomstig
      laatstbedoelde wet en de op basis daarvan gestelde regels kan worden gewijzigd of ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0012092
      [ref2]: https://wetten.overheid.nl/BWBR0007791#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0007791#Artikel23
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0012092
      - id: ref2
        bwb_id: BWBR0007791
        artikel: '22'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0007791
        artikel: '23'
        paragraaf: '5'
  - number: '21.4'
    text: |-
      In afwijking van het derde lid zijn de artikelen [5][ref1], [6][ref2], [7][ref3], [8][ref4],
      [14][ref5] en de daarop berustende ministeriële regeling, [17][ref6], [18][ref7], [19][ref8], [20][ref9] en
      [39, zesde en zevende lid, van de Wet verplichte deelneming in een bedrijfstakpensioenfonds 2000][ref10] van
      overeenkomstige toepassing met ingang van de datum waarop die wet in werking treedt tot het tijdstip bedoeld in het
      derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0012092#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0012092#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0012092#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0012092#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0012092#Artikel14
      [ref6]: https://wetten.overheid.nl/BWBR0012092#Artikel17
      [ref7]: https://wetten.overheid.nl/BWBR0012092#Artikel18
      [ref8]: https://wetten.overheid.nl/BWBR0012092#Artikel19
      [ref9]: https://wetten.overheid.nl/BWBR0012092#Artikel20
      [ref10]: https://wetten.overheid.nl/BWBR0012092#Artikel39
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0012092
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0012092
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0012092
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0012092
        artikel: '8'
      - id: ref5
        bwb_id: BWBR0012092
        artikel: '14'
      - id: ref6
        bwb_id: BWBR0012092
        artikel: '17'
      - id: ref7
        bwb_id: BWBR0012092
        artikel: '18'
      - id: ref8
        bwb_id: BWBR0012092
        artikel: '19'
      - id: ref9
        bwb_id: BWBR0012092
        artikel: '20'
      - id: ref10
        bwb_id: BWBR0012092
        artikel: '39'
  - number: '22.1'
    text: |-
      Tot het tijdstip, bedoeld in [artikel 21, derde lid][ref1], kan, op het gezamenlijk verzoek van het bestuur van een
      B 3-lichaam of een privaatrechtelijk lichaam dat ingevolge [artikel 2, derde lid, onderdeel ][ref2], is aangewezen
      als lichaam waarvan de werknemers deelnemen in de Stichting Pensioenfonds ABP, en het personeel van dat lichaam,
      die aanwijzing door Onze Minister worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0007791#Artikel2
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '21'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0007791
        artikel: '2'
        paragraaf: '1'
  - number: '22.2'
    text: |-
      Het verzoek tot intrekking, bedoeld in het eerste lid, kan namens het personeel worden gedaan door de organisaties
      die het betrokken personeel vertegenwoordigen in het arbeidsvoorwaardenoverleg.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel22
  - number: '22.3'
    text: |-
      Intrekking van de aanwijzing, bedoeld in [artikel 2, derde lid, onderdeel ][ref1], vindt slechts plaats indien de
      pensioenaanspraken van:


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel2
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '2'
        paragraaf: '1'
  - number: 22.3.a
    text: de werknemers van het betrokken lichaam;
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel22
  - number: 22.3.b
    text: |-
      de gewezen werknemers van het betrokken lichaam, voor zover zij na hun ontslag niet in dienst zijn getreden van een
      ander lichaam als bedoeld in [artikel 2][ref1] of van een lichaam dat op basis van vrijwilligheid is aangesloten
      bij de Stichting Pensioenfonds ABP, dan wel hun pensioenaanspraken tegenover het ABP of de Stichting Pensioenfonds
      ABP geheel teniet zijn gegaan ten gevolge van waarde-overdracht;


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel2
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '2'
        paragraaf: '1'
  - number: 22.3.c
    text: de gepensioneerde, gewezen werknemers van het betrokken lichaam;
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel22
  - number: 22.3.d
    text: de nabestaanden van de in de onderdelen *a*, *b* en *c* bedoelde werknemers;
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel22
  - number: '23.1'
    text: |-
      Op het gezamenlijke verzoek van de sectorwerkgever en de meerderheid van de binnen de desbetreffende sector
      representatieve verenigingen van overheidspersoneel of centrales van overheidspersoneel kan de verplichte
      deelneming van de desbetreffende sector in de Stichting Pensioenfonds ABP door Onze Minister van Sociale
      Zaken en Werkgelegenheid worden ingetrokken met ingang van een datum die niet voor het tijdstip, bedoeld in
      [artikel 21, derde lid][ref1], is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel21
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '21'
        paragraaf: '5'
  - number: '23.2'
    text: |-
      Het [derde lid van artikel 22][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel22
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '22'
        paragraaf: '5'
  - number: '24.1'
    text: |-
      Met inachtneming van het tweede lid en behoudens [artikel 76, tweede lid][ref1], gaan op 1 januari 1996 alle
      vermogensbestanddelen van het ABP onder algemene titel over op de Stichting Pensioenfonds ABP.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel76
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '76'
        paragraaf: '11'
  - number: '24.2'
    text: |-
      Ter zake van de overgang van vermogensbestanddelen, bedoeld in het eerste lid, blijft de heffing van
      overdrachtsbelasting achterwege.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel24
  - number: '24.3'
    text: |-
      Ten aanzien van de in het eerste lid bedoelde vermogensbestanddelen welke in openbare registers te boek zijn
      gesteld, zal verandering van de tenaamstelling in die registers plaatsvinden. De daartoe vereiste opgaven worden
      door het bestuur van de Stichting Pensioenfonds ABP aan de beheerders van de desbetreffende registers gedaan.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel24
  - number: '25.1'
    text: |-
      Het bestuur van het ABP doet van alle vermogensbestanddelen die ingevolge artikel 24 op de Stichting Pensioenfonds
      ABP overgaan, per 31 december 1995 een verklaring opstellen door de accountant, bedoeld in artikel L 10 van de
      Abp-wet, en de actuariële deskundige, bedoeld in artikel L 11 van die wet, in overleg met een door Onze Minister
      aangewezen registeraccountant.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel25
  - number: '25.2'
    text: |-
      De in het eerste lid bedoelde verklaring wordt door het bestuur van de Stichting Pensioenfonds ABP neergelegd ten
      kantore van het handelsregister waar hij volgens de statuten zijn zetel heeft.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel25
  - number: '25.3'
    text: |-
      De waardering van de in het eerste lid bedoelde vermogensbestanddelen geschiedt volgens de door het bestuur van het
      ABP vast te stellen regels, die de goedkeuring behoeven van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel25
  - number: '26.1'
    text: |-
      Ieder personeelslid van het ABP, wiens werkzaamheden liggen op het werkterrein van de Stichting Pensioenfonds ABP
      en ten aanzien van wie het bestuur van het ABP niet anders heeft beslist, gaat over in dienst van die stichting op
      een overeenkomst naar burgerlijk recht ingaande op 1 januari 1996.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel26
  - number: '26.2'
    text: |-
      De arbeidsovereenkomst geldt voor onbepaalde tijd, tenzij het personeelslid is aangesteld in tijdelijke dienst
      voor bepaalde tijd of werkzaam is op arbeidsovereenkomst voor bepaalde tijd. In de laatstgenoemde gevallen geldt de
      arbeidsovereenkomst voor de periode dat de aanstelling of arbeidsovereenkomst bij het ABP zou hebben voortgeduurd.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel26
  - number: '26.3'
    text: |-
      De arbeidsovereenkomst betreft een functie die zoveel mogelijk overeenkomt met de functie die het personeelslid
      laatstelijk vervult in dienst van het ABP dan wel passend voor hem is te achten.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel26
  - number: '26.4'
    text: |-
      De arbeidsvoorwaarden dienen in totaliteit gelijkwaardig te zijn aan die welke voor het personeelslid laatstelijk
      gelden uit hoofde van zijn dienstverhouding bij het ABP. Het bestuur van het ABP stelt nadere regels ter zake.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel26
  - number: '26.5'
    text: |-
      De inhoud van de arbeidsovereenkomst bedoeld in het eerste lid, wordt door het bestuur van het ABP uiterlijk 1
      september 1995 aan het personeelslid voorgelegd.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel26
  - number: '26.6'
    text: |-
      Binnen zes weken na de datum waarop het personeelslid redelijkerwijs kennis heeft kunnen nemen van de inhoud van
      de arbeidsovereenkomst, bedoeld in het eerste lid, kan hij het bestuur van het ABP mededelen dat hij bezwaren
      heeft tegen de overgang in dienst van de Stichting Pensioenfonds ABP. Door het bestuur van het ABP worden regels
      gesteld met betrekking tot het onderzoek van de bezwaren. Het bestuur van het ABP beslist voor 21 december 1995 op
      de bezwaren.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel26
  - number: '26.7'
    text: |-
      Indien het bestuur van het ABP de bezwaren geheel of gedeeltelijk gegrond verklaart, kan hij in afwijking van
      het eerste lid beslissen dat het personeelslid niet overgaat in dienst van de Stichting Pensioenfonds ABP dan
      wel het personeelslid een arbeidsovereenkomst met de Stichting Pensioenfonds ABP aanbieden waarvan de inhoud in
      overeenstemming is met zijn beslissing op de bezwaren.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel26
  - number: '26.8'
    text: |-
      Het personeelslid ten aanzien van wie het bestuur heeft beslist dat hij niet overgaat in dienst van de Stichting
      Pensioenfonds ABP, is met ingang van 1 januari 1996 van rechtswege eervol ontslagen uit de dienst van het
      ABP. Hij heeft met ingang van die datum gedurende drie maanden ten laste van de Stichting Pensioenfonds ABP
      aanspraak op doorbetaling van zijn laatstgenoten bezoldiging. Tevens is op hem met ingang van die datum de
      ontslag[uitkeringsregeling][ref1] van toepassing die op 31 december 1995 voor hem gold, met dien verstande dat de
      uitbetaling van de uitkering op grond van die regeling wordt opgeschort tot 1 april 1996 en voor de bepaling van de
      duur van die uitkering 1 april 1996 wordt aangemerkt als datum van ontslag.


      [ref1]: https://wetten.overheid.nl/BWBR0002537
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002537
  - number: '26.9'
    text: |-
      In afwijking van het eerste lid komt geen arbeidsovereenkomst tot stand met het personeelslid dat binnen een
      week na de beslissing van het bestuur van het ABP op de bezwaren kenbaar maakt dat de totstandkoming van de
      arbeidsovereenkomst tegen zijn wil is. Het in dit lid bedoelde personeelslid is met ingang van 1 januari 1996 van
      rechtswege eervol ontslagen. Hij heeft per die datum ten laste van de Stichting Pensioenfonds ABP aanspraak op een
      bedrag ter grootte van drie maal zijn laatstelijk genoten maandelijkse bezoldiging.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel26
  - number: '26.10'
    text: |-
      Door het tot stand komen van een arbeidsovereenkomst met de Stichting Pensioenfonds ABP is het personeelslid van
      rechtswege eervol ontslagen uit de dienst van het ABP. Aan een zodanig ontslag wordt geen recht ontleend op een
      ontslaguitkering.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel26
  - number: '55.1'
    text: |-
      Indien op 1 januari 1996 geen overeenkomst als bedoeld in de [artikelen 28][ref1] en [31, tweede lid][ref2], en
      geen algemene maatregel van bestuur als bedoeld in [artikel 31, eerste lid][ref3], tot stand zijn gebracht, treden
      de bepalingen, bedoeld in [artikel 77, de onderdelen b tot en met m][ref4], zoals deze luidden op 31 december
      1995, voor die overeenkomsten en algemene maatregel van bestuur in de plaats, tot het tijdstip waarop het in de
      [paragraaf 8][ref5] bedoelde stelsel in totaliteit in werking kan treden.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0007791#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0007791#Artikel31
      [ref4]: https://wetten.overheid.nl/BWBR0007791#Artikel77
      [ref5]: https://wetten.overheid.nl/BWBR0007791#Paragraaf8
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '28'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0007791
        artikel: '31'
        paragraaf: '8'
      - id: ref3
        bwb_id: BWBR0007791
        artikel: '31'
        paragraaf: '8'
      - id: ref4
        bwb_id: BWBR0007791
        artikel: '77'
        paragraaf: '11'
      - id: ref5
        bwb_id: BWBR0007791
        paragraaf: '8'
  - number: '55.2'
    text: |-
      Voor zolang toepassing wordt gegeven aan het eerste lid, treden het bestuur, onderscheidenlijk de directieraad van
      de Stichting Pensioenfonds ABP in de plaats van het bestuur, onderscheidenlijk de directieraad van het ABP.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel55
  - number: '56.1'
    text: Artikel 1, zesde lid, van de PSW is niet van toepassing ten aanzien van de Stichting Pensioenfonds ABP.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel56
  - number: '56.2'
    text: |-
      Voor de toepassing van [artikel 6, eerste lid, van de PSW ][ref1]wordt het Verbond Sectorwerkgevers Overheid
      aangemerkt als werkgeversvereniging.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel6
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: '6'
  - number: '58.1'
    text: |-
      Degene die op 31 december 1995 recht heeft op een wachtgeld als bedoeld in artikel A 1, onderdeel *i*, van de Abp-
      wet of een daarmee gelijkgestelde uitkering als bedoeld in artikel A 4 van die wet, en op grond daarvan ambtenaar
      was in de zin van die wet, is verplicht deel te nemen in de Stichting Pensioenfonds ABP zolang zijn recht op
      wachtgeld voortduurt.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel58
  - number: '58.2'
    text: |-
      Ten aanzien van de in het eerste lid bedoelde wachtgelder zijn de bepalingen in de statuten en reglementen van de
      Stichting Pensioenfonds ABP van toepassing die gelden ten aanzien van gewezen overheidswerknemers.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel58
  - number: '61.1'
    text: |-
      In afwijking van [artikel 77, onderdeel a][ref1], blijft hoofdstuk S van de Abp-wet van toepassing ten aanzien van
      besluiten als bedoeld in het genoemde hoofdstuk die voor 1 januari 1996 genomen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel77
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '77'
        paragraaf: '11'
  - number: '61.2'
    text: |-
      Ten aanzien van besluiten van het bestuur of de directieraad van de Stichting Pensioenfonds ABP die genomen
      zijn naar aanleiding van verzoeken of aanvragen die voor 1 januari 1996 op basis van de Abp-wet zijn gedaan, is
      hoofdstuk S van de Abp-wet van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel61
  - number: '61.3'
    text: 'Voor de toepassing van het eerste en tweede lid geldt dat met ingang van 1 januari 1996 wordt begrepen onder:'
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel61
  - number: 61.3.a
    text: 'bestuur: het bestuur van de Stichting Pensioenfonds ABP;'
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel61
  - number: 61.3.b
    text: 'directieraad: de directieraad van de Stichting Pensioenfonds ABP.'
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel61
  - number: '62'
    text: |-
      In afwijking van [artikel 77, de onderdelen b tot en met m][ref1], blijven de artikelen W 2 en W 3 van de Amp-wet
      van toepassing ten aanzien van besluiten die voor 1 januari 1996 zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel77
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '77'
        paragraaf: '11'
  - number: 66a.1
    text: |-
      Besluiten van het FAOP uit hoofde van zijn taak ingevolge [artikel 46, eerste lid][ref1], die genomen zijn voor 1
      januari 1996, worden tot de datum waarop het College van toezicht sociale verzekeringen, bedoeld in artikel 2 van
      de Organisatiewet sociale verzekeringen, deze zal hebben goedgekeurd, doch uiterlijk tot 1 januari 1997, aangemerkt
      als te zijn goedgekeurd door dat college, voor zover het betreft besluiten die:


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel46
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel66a
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '46'
        paragraaf: '10'
  - number: 66a.1.a
    text: |-
      betrekking hebben op het in artikel 49, tweede juncto eerste lid, van de Wet FVP/ABP bedoelde onderdeel van de
      begroting betreffende de in artikel 21*a* van die wet bedoelde uitvoeringskosten;
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel66a
  - number: 66a.1.b
    text: |-
      de goedkeuring behoeven van het vorengenoemde college op grond van artikel 15, eerste lid, van de Organisatiewet
      sociale verzekeringen; of
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel66a
  - number: 66a.1.c
    text: |-
      overeenkomstig artikel 18 van de Algemene Arbeidsongeschiktheidswet, zoals
      die wet luidde op de dag voorafgaande aan de datum van inwerkingtreding van
      [artikel II van de Invoeringswet nieuwe en gewijzigde arbeidsongeschiktheidsregelingen][ref1], en de
      [artikelen 27][ref2] en [28 van de Wet op de arbeidsongeschiktheidsverzekering][ref3] zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008658#ArtikelII
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel28
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel66a
    references:
      - id: ref1
        bwb_id: BWBR0008658
        artikel: II
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '27'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '28'
  - number: 66a.2
    text: |-
      Ingeval het college, bedoeld in het eerste lid, zijn goedkeuring onthoudt aan een besluit van het FAOP als bedoeld
      in het eerste lid, behoudt het bedoelde besluit zijn gelding gedurende de periode tot aan de datum van de bedoelde
      beslissing van het College.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel66a
  - number: '74.1'
    text: |-
      Het bestuur van de Stichting Pensioenfonds ABP verstrekt aan Onze Minister de statistische informatie die deze
      nodig heeft in verband met zijn bestuurlijke verantwoordelijkheid voor het overheidspersoneelsbeleid.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel74
  - number: '74.2'
    text: Over deze informatieverstrekking worden door Onze Minister en het bestuur nadere afspraken gemaakt.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel74
  - number: '75.1'
    text: |-
      De Stichting Pensioenfonds ABP heeft voor de kosten van de op 31 december 1995 reeds ingegane pensioenen ingevolge
      de Abp-wet, alsmede voor de kosten van de aanspraken bedoeld in [artikel 17][ref1], welke ten gevolge van een
      ongeval veroorzaakt zijn, verhaal op degene die, bij het ontbreken van die voorziening, in verband met het
      veroorzaken van het ongeval jegens een overheidswerknemer dan wel diens nagelaten betrekkingen naar burgerlijk
      recht aansprakelijk zou zijn voor de alsdan door dezen geleden schade.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel17
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '17'
        paragraaf: '4'
  - number: '75.2'
    text: |-
      Voor zover het bestuur van het ABP ingevolge artikel P 1 van de Amp-wet op 31 december 1995 belast was met de
      uitvoering van op die datum reeds ingegane pensioenen van nagelaten betrekkingen van militairen in de zin van die
      wet, is het eerste lid ten aanzien van de kosten van die pensioenen van overeenkomstige toepassing, indien die
      pensioenen zijn ondergebracht bij de Stichting Pensioenfonds ABP.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel75
  - number: '75.3'
    text: |-
      De Stichting Pensioenfonds ABP heeft voorts verhaal voor de kosten van de tussen 31 december 1995 en 1 januari 2001
      toegekende pensioenen die ten gevolge van een ongeval zijn toegekend aan een overheidswerknemer of zijn nagelaten
      betrekkingen, op degene die, bij het ontbreken van die voorziening, in verband met het veroorzaken van het ongeval
      jegens een overheidswerknemer dan wel diens nagelaten betrekkingen naar burgerlijk recht aansprakelijk zou zijn
      voor de alsdan door dezen geleden schade.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel75
  - number: '75.4'
    text: |-
      Het derde lid is van overeenkomstige toepassing ten aanzien van de kosten van de tussen 31 december 1995 en 1
      januari 2001 toegekende pensioenen van nagelaten betrekkingen van militairen in de zin van de Amp-wet, indien die
      pensioenen zijn ondergebracht bij de Stichting Pensioenfonds ABP.
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel75
  - number: '75.5'
    text: |-
      De [artikelen 2][ref1] en [3 van de Verhaalswet ongevallen ambtenaren][ref2] zijn ten aanzien van het verhaal,
      bedoeld in het eerste tot en met het vierde lid, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002500#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002500#Artikel3
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0002500
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002500
        artikel: '3'
  - number: '77'
    text: 'Ingetrokken worden:'
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel77
  - number: 77.a
    text: de Abp-wet;
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel77
  - number: 77.b
    text: de Hoofdstukken G en H van de Amp-wet;
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel77
  - number: 77.c
    text: de [Militaire Weduwenwet 1922](onbekend);
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel77
  - number: 77.d
    text: |-
      het [tweede hoofdstuk van de Pensioenwet voor de landmacht 1922](onbekend), alsmede artikel 76 van die wet, voor
      zover dat betrekking heeft op het pensioen voor nagelaten betrekkingen;
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel77
  - number: 77.e
    text: |-
      het [tweede hoofdstuk van de Pensioenwet voor de zeemacht 1922](onbekend), alsmede [artikel 77](onbekend) van die
      wet, voor zover dat betrekking heeft op het pensioen voor nagelaten betrekkingen;
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel77
  - number: 77.f
    text: |-
      het [tweede hoofdstuk van de Pensioenwet voor het reserve-personeel der landmacht 1923](onbekend), alsmede artikel
      55 van die wet, voor zover dat betrekking heeft op het pensioen voor nagelaten betrekkingen;
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel77
  - number: 77.g
    text: |-
      het [tweede hoofdstuk van de Pensioenwet voor het personeel der Koninklijke marine-reserve 1923](onbekend), alsmede
      artikel 55 van die wet, voor zover dat betrekking heeft op het pensioen voor nagelaten betrekkingen;
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel77
  - number: 77.h
    text: artikel 8 van de Bijzondere pensioenwet reserve-personeel landmacht (*Stb.* 1949, J 344);
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel77
  - number: 77.i
    text: artikel 4 van de Pensioenwet voor de vrijwilligers bij de landstorm 1925;
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel77
  - number: 77.j
    text: artikel 11 van de Wet buitengewoon pensioen 1914-1918 (*Stb.* 1948, I 496);
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel77
  - number: 77.k
    text: |-
      het tweede lid van artikel 2 van de Wet van 4 november 1950 tot nadere vaststelling van de regelingen op het gebied
      van militaire pensioenen, welke gedurende de vijandelijke bezetting zijn uitgevaardigd, zomede nadere wijziging van
      verschillende wetten, welke regelen geven inzake militair pensioen (*Stb.* 1950, K 479);
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel77
  - number: 77.l
    text: de artikelen 7 en 8 van de Pensioenwet bijzondere groepen reserve-personeel 1956;
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel77
  - number: 77.m
    text: |-
      artikel 5 van de wet van 22 december 1938, tot wijziging en aanvulling van de Pensioenwet voor officieren der
      Koninklijke marine-reserve, die zich - ter aanvulling van een bij de Koninklijke Marine bestaand tekort aan
      beroepsofficieren - krachtens een daartoe door hen gesloten vrijwillige verbintenis voor onbepaalde tijd in
      actieven dienst bevinden, alsmede voor hunne weduwen en weezen (*Stb.* 1938, 504).
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel77
  - number: '78.1'
    text: |-
      Deze wet treedt wat betreft de [artikelen 4, tweede en zesde lid][ref1], [6][ref2], [10 tot en met 16][ref3],
      [17, derde lid][ref4], [24, derde lid][ref5], [25 tot en met 31][ref6], [46][ref7], [48][ref8] en [53][ref9] in
      werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin zij wordt geplaatst en werkt wat
      deze artikelen betreft terug tot en met 1 augustus 1995.


