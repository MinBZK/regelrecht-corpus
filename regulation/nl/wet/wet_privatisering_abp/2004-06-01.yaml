      in dienst is van een privaatrechtelijk lichaam als bedoeld in
      [artikel 68 van de Wet op het primair onderwijs][ref1], [artikel 69 van de Wet op de expertisecentra][ref2] en
      [artikel 53b van de Wet op het voortgezet onderwijs][ref3], waarvan de personeelskosten voor ten minste 51 procent
      ten laste van de overheidskassen door de scholen worden bekostigd;


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel68
