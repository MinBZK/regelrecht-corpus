      beloond wordt rechtstreeks ten laste van dat lichaam;


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel113
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel113a
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel108a
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel108b
