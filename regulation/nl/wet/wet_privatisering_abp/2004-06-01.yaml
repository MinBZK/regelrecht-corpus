preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de verantwoordelijkheid voor de pensioenen
    van het overheidspersoneel in handen te leggen van de betrokken sociale partners en met het oog daarop het
    Algemeen burgerlijk pensioenfonds om te vormen tot een privaatrechtelijk pensioenfonds waarop de Pensioen- en
    spaarfondsenwet van toepassing is, alsmede dat in verband daarmee een voorziening dient te worden getroffen inzake
    de arbeidsongeschiktheidsverzekering van dat personeel;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#ArtikelAanhef
