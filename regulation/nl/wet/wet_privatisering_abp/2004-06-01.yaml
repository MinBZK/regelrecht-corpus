  - number: '2.1'
    text: 'Overheidswerknemer in de zin van deze wet is degene die:'
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel2
  - number: 2.1.a
    text: |-
      bij een publiekrechtelijk lichaam is aangesteld of in dienst is genomen op arbeidsovereenkomst naar burgerlijk
      recht en die deswege bezoldigd of beloond wordt rechtstreeks ten laste van een publiekrechtelijk lichaam;
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel2
  - number: 2.1.b
    text: |-
      in dienst is van een privaatrechtelijk lichaam dat zich het geven van onderwijs aan instellingen als bedoeld in
      dit onderdeel ten doel stelt, bezoldigd of beloond wordt rechtstreeks ten laste van dat lichaam en uit dien hoofde
      werkzaam is aan:
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel2
  - number: 2.1.b.1°
    text: |-
      een Nederlandse bijzondere instelling van wetenschappelijk onderwijs, een bijzondere instelling voor hoger
      beroepsonderwijs, een school, cursus, opleiding of andere instelling voor bijzonder onderwijs, indien de
      personeelskosten hiervan voor ten minste 51 procent door de overheid worden vergoed ingevolge een regeling houdende
      voorwaarden voor bekostiging, toegepast of tot stand gekomen onder verantwoordelijkheid van Onze Minister onder
      wiens departement de instelling ressorteert;
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel2
  - number: 2.1.b.2°
    text: |-
      een Nederlandse bijzondere instelling voor hoger beroepsonderwijs, een school, cursus, opleiding of andere
      instelling voor bijzonder onderwijs, die ingevolge wettelijke bepaling door Onze Minister van Onderwijs,
      Cultuur en Wetenschappen zijn aangewezen als bevoegd om aan de studenten of leerlingen op grond van met gunstig
      gevolg afgelegde examens dezelfde diploma’s of getuigschriften uit te reiken als die uitgereikt worden door
      overeenkomstige door de overheid bekostigde instellingen;
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel2
  - number: 2.1.b.3°
    text: |-
      een Nederlandse bijzondere basisschool of bijzondere speciale school voor basisonderwijs, een Nederlandse school
      voor bijzonder speciaal onderwijs of bijzonder voortgezet speciaal onderwijs, of een Nederlandse school of
      instelling voor bijzonder speciaal en voortgezet speciaal onderwijs - anders dan bedoeld onder 1° - waarvan het
      schoolwerkplan blijkens een door Onze Minister van Onderwijs, Cultuur en Wetenschappen aan het privaatrechtelijk
      lichaam op verzoek afgegeven beschikking voldoet aan het bij of krachtens de [Wet op het primair onderwijs][ref1]
      of de [Wet op de expertisecentra][ref2] bepaalde omtrent onderwijsactiviteiten of vakken, en aantal lesuren, voor
      zo lang dat lichaam voldoet aan de in deze beschikking op te nemen voorwaarden en bedingen;


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0007791/2004-06-01#Artikel2
    references:
