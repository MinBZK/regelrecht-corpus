    text: |-
      in dienst is van een privaatrechtelijk lichaam dat zich het verlenen van ondersteuning van volwasseneneducatie ten
      doel stelt, bezoldigd of beloond wordt rechtstreeks ten laste van dat lichaam en uit dien hoofde werkzaam is aan
      een privaatrechtelijke ondersteuningsinstelling, waarvan de personeelskosten voor ten minste 51 procent door de
