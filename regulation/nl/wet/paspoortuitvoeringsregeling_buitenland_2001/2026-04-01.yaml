---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: paspoortuitvoeringsregeling_buitenland_2001
regulatory_layer: WET
publication_date: '2012-06-25'
valid_from: '2026-04-01'
bwb_id: BWBR0012810
url: https://wetten.overheid.nl/BWBR0012810/2026-04-01
preamble:
  text: |-
    Gelet op de artikelen 2, eerste lid, onder g, tweede en derde lid, 3, eerste, derde, vierde en zevende lid, 16,
    tweede lid, 26, eerste lid, onder d en derde lid, 27, eerste lid, 30, eerste lid, 31, derde lid, 40, eerste lid,
    onder d en zesde lid, 43, 57 en 59 van de Paspoortwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel1
  - number: 1.1.a
    text: |-
      *de wet:* de [Paspoortwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005212
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005212
  - number: 1.1.b
    text: |-
      *aanvraag, weigering, verstrekking, uitreiking, houder, wijziging, inhouding, vervallen of vervallenverklaring en
      vermissing:* hetgeen ingevolge [artikel 1, eerste lid, van de wet][ref1] daaronder wordt verstaan;


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel1
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '1'
  - number: 1.1.c
    text: |-
      *aanvrager:* degene die een aanvraag als bedoeld in [artikel 1, onder a, van de wet][ref1] indient of op wie een
      dergelijke aanvraag betrekking heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel1
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '1'
  - number: 1.1.d
    text: |-
      *register paspoortsignaleringen:* het register, bedoeld in [artikel 25, derde lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel25
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '25'
  - number: 1.1.e
    text: |-
      *signalerende autoriteit:* de autoriteit, bedoeld in de [artikelen 18 tot en met 24 van de wet][ref1], die op grond
      van [artikel 25 van de wet][ref2] een verzoek tot weigering of vervallenverklaring heeft ingediend;


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel25
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0005212
        artikel: '25'
  - number: 1.1.f
    text: |-
      *basisadministratie:* de basisregistratie personen, dan wel een basisadministratie als bedoeld in
      [artikel 2 van de Wet basisadministraties persoonsgegevens BES][ref1], dan wel een bij Landsverordening van Aruba,
      Curaçao of Sint Maarten ingestelde bevolkingsadministratie;


      [ref1]: https://wetten.overheid.nl/BWBR0028208#Artikel2
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028208
        artikel: '2'
  - number: 1.1.g
    text: |-
      *basisregister reisdocumenten:* het register, bedoeld in [artikel 4c van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel4c
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: 4c
  - number: 1.1.h
    text: |-
      *aanvraagsysteem reisdocumenten:* het geheel van apparatuur, programmatuur, opslagmedia en overige materialen,
      waarvan door de bevoegde autoriteit gebruik wordt gemaakt bij de aanvraag, verstrekking, uitreiking en registratie
      van reisdocumenten;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel1
  - number: 1.1.i
    text: |-
      *reisdocumentenstation:* de door de leverancier beschikbaar gestelde apparatuur en programmatuur, waarin gegevens
      met betrekking tot aangevraagde en uitgereikte reisdocumenten worden verwerkt en gearchiveerd en waarmee de
      gegevensuitwisseling tussen de bevoegde autoriteit en de leverancier plaatsvindt (reisdocumentenaanvraag- en
      archiefstation);
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel1
  - number: 1.1.j
    text: |-
      *reisdocumentenadministratie:* de in het reisdocumentenstation en op andere wijze bij de bevoegde autoriteit
      opgeslagen gegevens met betrekking tot aangevraagde en uitgereikte reisdocumenten;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel1
  - number: 1.1.k
    text: |-
      *reisdocumentenmodule:* de apparatuur en programmatuur, waarmee de bevoegde autoriteit bij de aanvraag en
      uitreiking gegevens uitwisselt met het reisdocumentenstation en de basisadministratie;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel1
  - number: 1.1.l
    text: |-
      *standaardclausule:* een clausule, waarvan de tekst in [bijlage A van deze regeling][ref1] is opgenomen en die door
      de leverancier dan wel de bevoegde autoriteit in het reisdocument wordt aangebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0012810
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012810
  - number: 1.1.m
    text: |-
      *aanvraag-informatieformulier:* een door de Minister van Buitenlandse Zaken voorgeschreven formulier, dat bestemd
      is voor het opmaken van een aanvraag voor een reisdocument;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel1
  - number: 1.1.n
    text: '*openbaar lichaam:* openbaar lichaam Bonaire, Sint Eustatius of Saba;'
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel1
  - number: 1.1.o
    text: '*aanvraagnummer:* het nummer dat voorgedrukt is op het foto- en handtekeningformulier;'
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel1
  - number: 1.1.p
    text: |-
      *administratienummer:* het administratienummer, bedoeld in [artikel 4.9 van de Wet basisregistratie personen][ref1],
      dan wel in de [artikelen 10][ref2] en [11 van de Wet basisadministraties persoonsgegevens BES][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0028208#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0028208#Artikel11
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0028208
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0028208
        artikel: '11'
  - number: 1.1.s
    text: |-
      *identificatiekaart:* een document als bedoeld in [artikel 88][ref1], waarmee op elektronische wijze toegang kan
      worden verkregen tot het reisdocumentenstation en de daarin opgeslagen programmatuur en gegevens;


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel88
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '88'
        hoofdstuk: X
        paragraaf: '1'
  - number: 1.1.t
    text: |-
      *leverancier:* een bedrijf dat in opdracht van de Minister van Binnenlandse Zaken en Koninkrijksrelaties belast is
      met het verrichten van een of meerdere diensten die verband houden met de verstrekking van reisdocumenten;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel1
  - number: 1.1.u
    text: |-
      *distributeur:* het bedrijf dat zorg draagt voor de distributie van reisdocumenten, identificatiekaarten en overige
      materialen die door de leverancier worden geleverd;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel1
  - number: 1.1.v
    text: |-
      *uitgiftelocatie:* de locatie bij een bevoegde autoriteit waar de aanvragen aan de leverancier worden verzonden en
      de documenten en overige materialen door de distributeur worden afgeleverd;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel1
  - number: 1.1.x
    text: |-
      *verblijfsdocument:* een document waaruit het verblijfsrecht van de vreemdeling ingevolge de
      [Vreemdelingenwet 2000][ref1], de [Wet toelating en uitzetting BES][ref2] of de Landsverordening Toelating en
      Uitzetting van Aruba, Curaçao of Sint Maarten blijkt;


      [ref1]: https://wetten.overheid.nl/BWBR0011823
      [ref2]: https://wetten.overheid.nl/BWBR0028571
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011823
      - id: ref2
        bwb_id: BWBR0028571
  - number: 1.1.y
    text: |-
      *aanvraagstation:* de door de minister van Binnenlandse Zaken en Koninkrijksrelaties aangewezen apparatuur en
      programmatuur voor het ondersteunen van het aanvraag- en uitgifteproces van reisdocumenten;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel1
  - number: 1.1.z
    text: |-
      *foto- en handtekeningenformulier:* het daartoe door de leverancier beschikbaar gestelde formulier dat bestemd is
      voor het opnemen van de foto en de handtekening, bedoeld in [artikel 51, eerste en tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel51
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '51'
        hoofdstuk: III
        paragraaf: '3'
  - number: 1.1.aa
    text: |-
      *Aanvraagstationlocatie:* de locatie waar de bevoegde autoriteit met inachtneming van [artikel 91][ref1] één of
      meerdere aanvraagstations heeft geplaatst;


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel91
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '91'
        hoofdstuk: X
        paragraaf: '2'
  - number: 1.1.bb
    text: |-
      *mobiel vingerafdrukopname-apparaat:* de door de minister van Binnenlandse Zaken en Koninkrijksrelaties aangewezen
      mobiele apparatuur en bijbehorende programmatuur voor het opnemen van vingerafdrukken;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel1
  - number: 1.1.cc
    text: |-
      *ingezetene:* een ingezetene als bedoeld in [artikel 1.1, onderdeel f, van de Wet basisregistratie personen][ref1],
      dan wel [artikel 1, onderdeel h, van de Wet basisadministraties persoonsgegevens BES][ref2], dan wel de
      Landsverordening van Aruba, Curaçao of Sint Maarten waarbij de bevolkingsadministratie is ingesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028208#Artikel1
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0028208
        artikel: '1'
  - number: 1.1.dd
    text: |-
      *besluit:* [Paspoortbesluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0044308
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0044308
  - number: 1.1.ee
    text: |-
      *register vermiste of vervallen reisdocumenten:* het register, bedoeld in [artikel 4a van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel4a
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: 4a
  - number: '1.2'
    text: Deze regeling is van toepassing op de verstrekking van reisdocumenten door de Minister van Buitenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel1
  - number: '3.1'
    text: |-
      Met betrekking tot de in [artikel 2, eerste lid, onder b en c, van de wet][ref1] bedoelde reisdocumenten worden van
      de volgende documenten in deze regeling de navolgende modellen vastgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel2
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '2'
  - number: 3.1.a
    text: |-
      diplomatiek paspoort: model diplomatiek paspoort, dat is opgenomen in [bijlage M][ref1] bij deze regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0012810
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012810
  - number: 3.1.b
    text: |-
      dienstpaspoort: model dienstpaspoort en model nationaal paspoort voorzien van standaardclausule IX, dat is
      opgenomen in [bijlage N][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0012810
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012810
  - number: '3.2'
    text: |-
      Met betrekking tot het in [artikel 2, eerste lid, onder f, van de wet][ref1] bedoelde nooddocument wordt in deze
      regeling het model laissez-passer vastgesteld, dat is opgenomen in [bijlage O][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012810
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0012810
  - number: '3.3'
    text: |-
      In de modellen, genoemd in het eerste lid, is een machineleesbare strook en een door de Minister van Binnenlandse
      Zaken en Koninkrijksrelaties ondertekende chip opgenomen.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel3
  - number: 3aa
    text: 'Gegevens die betrekking hebben op de status van een reisdocument zijn:'
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel3aa
  - number: 3aa.a
    text: in aanvraag;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel3aa
  - number: 3aa.b
    text: geldig;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel3aa
  - number: 3aa.c
    text: ongeldig, met inbegrip van de reden van ongeldigheid;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel3aa
  - number: 3aa.d
    text: definitief aan het verkeer onttrokken.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel3aa
  - number: 3ab
    text: 'Gegevens die betrekking hebben op de status van het reisdocument als publiek identificatiemiddel zijn:'
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel3ab
  - number: 3ab.a
    text: uitgereikt;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel3ab
  - number: 3ab.b
    text: geactiveerd;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel3ab
  - number: 3ab.c
    text: geblokkeerd;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel3ab
  - number: 3ab.d
    text: ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel3ab
  - number: 3ac
    text: |-
      Degene die op grond van deze regeling gegevens verstrekt ten behoeve van de reisdocumentenadministratie, het
      register vermiste of vervallen reisdocumenten of de basisadministratie, verstrekt deze gegevens, met uitzondering
      van vingerafdrukken, gezichtsopname en handtekening, eveneens aan de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties ten behoeve van het basisregister reisdocumenten.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel3ac
  - number: 3ad.1
    text: |-
      Teneinde de veiligheid en betrouwbaarheid van het basisregister reisdocumenten te waarborgen, neemt de Minister van
      Binnenlandse Zaken en Koninkrijksrelaties passende maatregelen om inbreuken op en aantastingen van de beveiliging
      en de processen van het register te voorkomen. Hierbij wordt in ieder geval voldaan aan:
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel3ad
  - number: 3ad.1.a
    text: de open normen en standaarden op de ‘pas-toe-of-leg-uit-lijst’ van het Forum Standaardisatie;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel3ad
  - number: 3ad.1.b
    text: de Baseline Informatiebeveiliging Overheid; en
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel3ad
  - number: 3ad.1.c
    text: de Voorschriften Informatiebeveiliging Rijksdienst.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel3ad
  - number: 3ad.2
    text: |-
      De in het eerste lid bedoelde maatregelen worden getroffen en onderhouden op basis van daartoe na een risicoanalyse
      vastgestelde informatiebeveiligingsplannen.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel3ad
  - number: 3ad.3
    text: |-
      Teneinde maatregelen te kunnen aanpassen en doorontwikkeling mogelijk te maken, wordt voor het register of
      onderdelen daarvan onderhoud gepleegd. Hiertoe kunnen, na voorafgaande bekendmaking, het register of onderdelen
      daarvan tijdelijk buiten gebruik worden gesteld.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel3ad
  - number: '5.1'
    text: |-
      De tot verstrekking dan wel inhouding bevoegde autoriteiten dragen er zorg voor dat de administratie, bedoeld
      in [artikel 25, vierde en vijfde lid, van de wet][ref1], te allen tijde de naam, voornamen, geboortedatum
      en geboorteplaats bevat van de personen ten aanzien van wie zij op grond van [de wet][ref2] bevoegd zijn tot
      verstrekking dan wel inhouding.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0005212
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0005212
  - number: '5.2'
    text: |-
      De in het eerste lid bedoelde administratie is op naam toegankelijk en kan desgewenst worden gevoerd door het
      bewaren en raadplegen van de regelmatig toegezonden signaleringslijst en de tussentijdse aanvullingen daarop.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel5
  - number: '8'
    text: |-
      De Minister van Buitenlandse Zaken is ten aanzien van de aanvragen die hij in ontvangst neemt, bevoegd tot heffing
      van rechten, dan wel tot het verlenen van gehele of gedeeltelijke kwijtschelding van rechten als bedoeld in het
      [Besluit paspoortgelden][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005264
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005264
  - number: 8a
    text: |-
      Alle landen buiten de Europese Unie worden aangewezen als landen buiten de Europese Unie waar een daar woonachtige
      Nederlander binnen de grenzen van de wet recht heeft op de verstrekking van een Nederlandse identiteitskaart,
      bedoeld in [artikel 16a, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel16a
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: 16a
  - number: '11.1'
    text: |-
      Bij de aanvraag van een reisdocument voor vluchtelingen, dan wel een reisdocument voor vreemdelingen wordt gebruik
      gemaakt van het daartoe door de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde
      formulier.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel11
  - number: '11.2'
    text: |-
      Een in het eerste lid bedoeld formulier kan worden verstrekt nadat daartoe een verzoek is gedaan door de Minister
      van Buitenlandse Zaken, onder vermelding van de personalia van de aanvrager en de reden van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel11
  - number: '11.3'
    text: |-
      In het formulier worden naast de geslachtsnaam, voornamen, geboortedatum en geboorteplaats van de aanvrager de
      navolgende gegevens vermeld:
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel11
  - number: 11.3.I
    text: 'met betrekking tot de nationaliteit:'
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel11
  - number: 11.3.I.a
    text: welke nationaliteit de aanvrager bezit, dan wel
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel11
  - number: 11.3.I.b
    text: door welke oorzaak de aanvrager zonder of van onbekende nationaliteit is, dan wel
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel11
  - number: 11.3.I.c
    text: |-
      op grond van welke wettelijke regeling of administratieve beslissing de aanvrager zijn nationaliteit heeft
      verloren;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel11
  - number: 11.3.II
    text: |-
      met betrekking tot de (gewezen) echtgenoot, echtgenote of geregistreerd partner: de geslachtsnaam, voornamen,
      geboortedatum, geboorteplaats, nationaliteit en burgerlijke staat van de echtgenoot, echtgenote of geregistreerd
      partner, dan wel laatste gewezen echtgenoot, echtgenote of geregistreerd partner, alsmede het bezit van een
      verblijfsdocument met vermelding van het verblijfsrecht, het documentnummer en de geldigheidsduur van het document
      indien de betrokkene niet het Nederlanderschap bezit;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel11
  - number: 11.3.III
    text: 'met betrekking tot de binnenkomst in het Europese dan wel Caribische deel van Nederland:'
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel11
  - number: 11.3.III.a
    text: de datum van binnenkomst van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel11
  - number: 11.3.III.b
    text: |-
      het land van waar de aanvrager voor binnenkomst laatstelijk was vertrokken of het deel van Nederland, indien de
      aanvrager voor binnenkomst laatstelijk was vertrokken uit het Europese dan wel Caribische deel van Nederland;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel11
  - number: 11.3.III.c
    text: de gemeente dan wel het openbaar lichaam waarvan de aanvrager bij binnenkomst voor het eerst ingezetene werd;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel11
  - number: 11.3.III.d
    text: |-
      het documentnummer, de geldigheidsduur, alsmede de datum en autoriteit van vertrekking van het reisdocument
      waarover de aanvrager bij binnenkomst beschikte;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel11
  - number: 11.3.IV
    text: 'met betrekking tot het rechtmatig verblijf van de aanvrager in het Europese dan wel Caribische deel van Nederland:'
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel11
  - number: 11.3.IV.a
    text: de in de basisadministratie opgenomen gegevens over het verblijfsrecht van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel11
  - number: 11.3.IV.b
    text: |-
      het door de aanvrager ter inzage overgelegde verblijfsdocument met vermelding van het verblijfsrecht, het
      documentnummer en de geldigheidsduur van het document, dan wel de reden waarom geen geldig verblijfsdocument ter
      inzage kan worden overgelegd;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel11
  - number: 11.3.IV.c
    text: |-
      de datum van vertrek en de gemeente dan wel het openbaar lichaam waarvan betrokkene ingezetene is of laatstelijk
      ingezetene was;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel11
  - number: 11.3.IV.d
    text: |-
      de reden van het buitenlands verblijf of van het verblijf in het andere deel van Nederland, indien de aanvrager in
      het Europese dan wel het Caribische deel van Nederland verblijft.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel11
  - number: '11.4'
    text: |-
      De daartoe aangewezen ambtenaar voorziet het formulier op de bestemde plaats van zijn handtekening en zendt
      het, vergezeld van (foto)kopieën van de in het bezit van de aanvrager zijnde reisdocumenten, dan wel van
      de reisdocumenten waarin hij staat bijgeschreven (met alle bestempelde visumbladzijden), alsmede van het
      verblijfsdocument aan de Minister van Buitenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel11
  - number: '12.1'
    text: |-
      Het formulier en de eventuele overgelegde bewijsstukken worden door de Minister van Buitenlandse Zaken doorgezonden
      aan de Nederlandse Minister van Justitie in wiens vreemdelingenadministratie de aanvrager ten tijde van de aanvraag
      is opgenomen.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel12
  - number: '12.2'
    text: |-
      In het formulier worden de navolgende gegevens die over de aanvrager in de vreemdelingenadministratie zijn
      opgenomen, vermeld:
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel12
  - number: 12.2.a
    text: geslachtsnaam, voornamen, geboortedatum, geboorteplaats en nationaliteit;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel12
  - number: 12.2.b
    text: de datum sedert welke de aanvrager in de vreemdelingenadministratie is ingeschreven;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel12
  - number: 12.2.c
    text: het verblijfsrecht van de aanvrager met de datum waarop dit eindigt;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel12
  - number: 12.2.d
    text: |-
      het aan de aanvrager verstrekte verblijfsdocument met vermelding van het documentnummer en de geldigheidsduur, dan
      wel de reden waarom de aanvrager niet in aanmerking komt voor een verblijfsdocument.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel12
  - number: '12.3'
    text: |-
      In het formulier wordt tevens vermeld of en zo ja, op welke punten de ingevolge [artikel 11][ref1] vermelde
      gegevens afwijken van de gegevens die omtrent de aanvrager in de vreemdelingenadministratie zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel11
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
  - number: '12.4'
    text: |-
      Indien de aanvraag betrekking heeft op een reisdocument voor vreemdelingen als bedoeld in
      [artikel 14 van de wet][ref1] en tegen het verlenen daarvan op verblijfsrechtelijke gronden bedenkingen bestaan,
      vermeldt de Nederlandse Minister van Justitie als bedenkingen:


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel14
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '14'
  - number: 12.4.a
    text: |-
      de aanvrager dient in het bezit te zijn van een geldig reisdocument voor grensoverschrijding, verstrekt door de
      autoriteiten van een ander land, dan wel
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel12
  - number: 12.4.b
    text: de verblijfstitel van de aanvrager zal niet meer worden verlengd, dan wel
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel12
  - number: 12.4.c
    text: de verblijfstitel van de aanvrager is of zal vervallen, dan wel
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel12
  - number: 12.4.d
    text: andere bedenkingen.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel12
  - number: '12.5'
    text: De daartoe aangewezen ambtenaar voorziet het formulier op de bestemde plaats van zijn handtekening.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel12
  - number: '12.6'
    text: De Nederlandse Minister van Justitie zendt het formulier terug aan de Minister van Buitenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel12
  - number: '14.1'
    text: |-
      Indien de aanvraag betrekking heeft op een reisdocument als bedoeld in [artikel 14 van de wet][ref1] worden in het
      formulier naast de gegevens, bedoeld in [artikel 11][ref2], nog de navolgende gegevens vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0012810#Artikel11
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0012810
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
  - number: 14.1.a
    text: de reden waarom de aanvrager geen reisdocument van een ander land kan verkrijgen, dan wel
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel14
  - number: 14.1.b
    text: |-
      de reden waarom van de aanvrager niet kan worden gevergd, dat hij een reisdocument van een ander land aanvraagt,
      dan wel
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel14
  - number: 14.1.c
    text: |-
      indien de aanvrager een verzoek om naturalisatie tot Nederlander heeft ingediend, op welke datum dit is geschied,
      in welk stadium de procedure zich bevindt en wat het daarop betrekking hebbende behandelingsnummer van het
      ministerie van Justitie is.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel14
  - number: '14.2'
    text: |-
      De vaststelling van de aanspraak op een reisdocument voor vreemdelingen als bedoeld in
      [artikel 14 van de wet][ref1] geschiedt aan de hand van het door de aanvrager overgelegde verblijfsdocument,
      waaruit diens verblijfsrecht ingevolge [artikel 14][ref2] of [20 van de Vreemdelingenwet 2000][ref3], dan wel
      ingevolge de [Wet toelating en uitzetting BES][ref4], en diens nationaliteit blijkt, alsmede op grond van de
      gegevens die in het formulier zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0028571
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '20'
      - id: ref4
        bwb_id: BWBR0028571
  - number: '15.1'
    text: |-
      Indien de in de basisadministratie opgenomen gegevens afwijken van de gegevens die omtrent de aanvrager in zijn
      verblijfsdocument of in de vreemdelingenadministratie zijn opgenomen dan wel anderszins onzekerheid bestaat over
      deze gegevens, wordt daarnaar een gericht onderzoek ingesteld.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel15
  - number: '15.2'
    text: |-
      De Minister van Buitenlandse Zaken vermeldt in het formulier zijn beslissing met betrekking tot de aanspraak van de
      aanvrager op het aangevraagde reisdocument.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel15
  - number: '16.1'
    text: |-
      Indien de aanvraag betrekking heeft op een reisdocument als bedoeld in [artikel 12][ref1]
      of [15, tweede lid, van de wet][ref2] worden in het formulier naast de gegevens, bedoeld in
      [artikel 11, derde lid ][ref3]en [14, eerste lid][ref4], de navolgende gegevens vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0012810#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0012810#Artikel14
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0005212
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0012810
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0012810
        artikel: '14'
        hoofdstuk: II
        paragraaf: '2'
  - number: 16.1.a
    text: |-
      het door de aanvrager overgelegde document, waaruit diens verblijfsrecht ingevolge de
      [Vreemdelingenwet 2000][ref1], dan wel de [Wet toelating en uitzetting BES][ref2], en diens nationaliteit blijkt;


      [ref1]: https://wetten.overheid.nl/BWBR0011823
      [ref2]: https://wetten.overheid.nl/BWBR0028571
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011823
      - id: ref2
        bwb_id: BWBR0028571
  - number: 16.1.b
    text: het doel waarvoor de aanvrager het gevraagde reisdocument nodig heeft;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel16
  - number: 16.1.c
    text: |-
      het land van bestemming of het andere deel van Nederland indien de aanvrager zich naar het Europese dan wel het
      Caribische deel van Nederland wenst te begeven.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel16
  - number: '16.2'
    text: |-
      De [artikelen 11, vierde en vijfde lid][ref1], [12][ref2] en [15][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0012810#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0012810#Artikel15
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012810
        artikel: '12'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0012810
        artikel: '15'
        hoofdstuk: II
        paragraaf: '2'
  - number: '17.1'
    text: |-
      Bij de aanvraag van een reisdocument voor vluchtelingen, dan wel een reisdocument voor vreemdelingen wordt gebruik
      gemaakt van een daartoe bestemd informatieformulier. Dit kan een aanvraag-informatieformulier zijn als bedoeld
      in [artikel 35][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel35
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '35'
        hoofdstuk: III
        paragraaf: '1'
  - number: '17.2'
    text: |-
      Het invullen van het formulier, bedoeld in het eerste lid, geschiedt zoveel mogelijk overeenkomstig de
      [artikelen 11, derde lid][ref1], [14, eerste lid][ref2] en [16, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0012810#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0012810#Artikel16
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012810
        artikel: '14'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0012810
        artikel: '16'
        hoofdstuk: II
        paragraaf: '2'
  - number: '17.3'
    text: |-
      [Artikel 11, vierde en vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel11
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
  - number: '18.1'
    text: |-
      Het informatieformulier en de eventuele overgelegde bewijsstukken worden door tussenkomst van de Minister van
      Buitenlandse Zaken doorgezonden aan de Gouverneur van Aruba, Curaçao of Sint Maarten.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel18
  - number: '18.2'
    text: |-
      De Gouverneur vermeldt in het formulier of, en zo ja welke bedenkingen bestaan tegen verstrekking van het
      aangevraagde reisdocument.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel18
  - number: '18.3'
    text: |-
      Indien de aanvraag betrekking heeft op een reisdocument als bedoeld in [artikel 12][ref1] of [14 van de wet][ref2]
      gaat de Gouverneur niet over tot de in het tweede lid bedoelde vermelding in het formulier alvorens hij het advies
      van de Minister van Buitenlandse Zaken over de desbetreffende aanvraag heeft ingewonnen.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel14
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0005212
        artikel: '14'
  - number: '18.4'
    text: |-
      Behoudens het bepaalde in het vijfde lid zendt de Gouverneur het formulier aan het hoofd van de post waar de
      aanvraag is ingediend.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel18
  - number: '18.5'
    text: |-
      Indien de aanvraag betrekking heeft op een reisdocument voor vreemdelingen als bedoeld in
      [artikel 15, tweede lid, van de wet][ref1] zendt de Gouverneur het formulier aan de Minister van Buitenlandse
      Zaken die daarin vermeldt of en zo ja, welke bedenkingen hij heeft tegen de verstrekking van het aangevraagde
      reisdocument en het formulier doorstuurt aan het hoofd van de post waar de aanvraag is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel15
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '15'
  - number: '19.1'
    text: |-
      De vaststelling van een aanspraak op verstrekking van een laissez-passer ingevolge
      [artikel 15, tweede lid, van de wet][ref1] geschiedt met gebruikmaking van het door de aanvrager overgelegde
      verblijfsdocument waaruit diens rechtmatig verblijf in het Europese dan wel Caribische deel van Nederland, Aruba,
      Curaçao of Sint Maarten en diens nationaliteit blijkt, alsmede aan de hand van de door de aanvrager bij de aanvraag
      verstrekte gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel15
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '15'
  - number: '19.2'
    text: |-
      In geval van twijfel aan de gegevens die in het verblijfsdocument zijn vermeld dan wel door de aanvrager zijn
      verstrekt, vindt verificatie daarvan plaats in de vreemdelingenadministratie waarin de aanvrager is opgenomen.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel19
  - number: '25.1'
    text: |-
      Op het vaststellen van de aanspraak van een Nederlander dan wel een persoon die op grond van [de Wet][ref1]
      betreffende de positie van Molukkers als Nederlander wordt behandeld, op een nooddocument zijn de
      [artikelen 2.1][ref2] en [2.12 van het besluit][ref3] zoveel mogelijk van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005212
      [ref2]: https://wetten.overheid.nl/BWBR0044308#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0044308#Artikel2
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005212
      - id: ref2
        bwb_id: BWBR0044308
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0044308
        artikel: '2'
  - number: '25.2'
    text: |-
      Aan een in het eerste lid bedoelde persoon, die aanspraak heeft op verstrekking van een nooddocument, wordt een
      noodpaspoort verstrekt.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel25
  - number: '25.3'
    text: |-
      In afwijking van het tweede lid wordt aan een in het eerste lid bedoelde persoon een laissez-passer verstrekt,
      indien bij de verstrekking geen gebruik kan worden gemaakt van het reisdocumentenstation en de reis van de
      betrokken aanvrager geen uitstel gedoogt.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel25
  - number: '26.1'
    text: |-
      Op het vaststellen van de aanspraak van een vreemdeling op een nooddocument zijn
      [artikel 2.6 van het besluit][ref1] en [artikel 14, tweede lid][ref2], zoveel mogelijk van overeenkomstige
      toepassing. De Minister van Buitenlandse Zaken verifieert de in de aanvraag vermelde gegevens bij:


      [ref1]: https://wetten.overheid.nl/BWBR0044308#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012810#Artikel14
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0044308
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0012810
        artikel: '14'
        hoofdstuk: II
        paragraaf: '2'
  - number: 26.1.a
    text: de Minister van Justitie, indien de aanvrager tot het Europese of Caribische deel van Nederland is toegelaten;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel26
  - number: 26.1.b
    text: de Gouverneur, indien de aanvrager in Aruba, Curaçao of Sint Maarten is toegelaten.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel26
  - number: '26.2'
    text: |-
      Aan een in het eerste lid bedoelde persoon, die aanspraak heeft op verstrekking van een nooddocument, wordt een
      laissez-passer verstrekt.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel26
  - number: '28.1'
    text: |-
      In een nooddocument wordt de datum waarop het reisdocument uiterlijk moet worden ingeleverd en de autoriteit bij
      wie de inlevering dient plaats te vinden, vermeld.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel28
  - number: '28.2'
    text: De in het eerste lid bedoelde datum is de datum waarop de geldigheidsduur van het nooddocument eindigt.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel28
  - number: '28.3'
    text: 'De ingevolge het eerste lid te vermelden autoriteit is:'
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel28
  - number: 28.3.a
    text: |-
      de burgemeester van de gemeente of de gezaghebber van het openbaar lichaam waar de houder woont of verblijft, dan
      wel
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel28
  - number: 28.3.b
    text: |-
      de door de Gouverneur aangewezen autoriteit, indien de houder in Aruba, Curaçao of Sint Maarten woonachtig is,
      dan wel
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel28
  - number: 28.3.c
    text: |-
      de Gouverneur van Aruba, Curaçao of Sint Maarten, indien de houder het nieuwe reisdocument bij de Gouverneur zal
      aanvragen, dan wel
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel28
  - number: 28.3.d
    text: |-
      het hoofd van de Nederlandse consulaire post in het buitenland, waar de houder het nieuwe reisdocument zal
      aanvragen.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel28
  - number: '32.1'
    text: |-
      Tot de uitreiking van een diplomatiek paspoort of een dienstpaspoort wordt slechts overgegaan indien
      de aanvrager beschikt over een op de aanvrager betrekking hebbend geldig document als bedoeld in
      [artikel 1, eerste lid, onder 1°, van de Wet op de identificatieplicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '32.2'
    text: |-
      Indien bij de aanvraag van een diplomatiek paspoort of een dienstpaspoort blijkt dat de geldigheidsduur van het
      identiteitsbewijs als bedoeld in het vorige lid is verstreken, wordt de beslissing op de aanvraag pas genomen nadat
      het identiteitsbewijs is vervangen door een nieuw identiteitsbewijs.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel32
  - number: '32.3'
    text: |-
      De Minister van Buitenlandse Zaken kan een verstrekt diplomatiek paspoort of dienstpaspoort intrekken, indien de
      houder het diplomatiek paspoort of het dienstpaspoort in strijd met de voorwaarden waaronder het werd verstrekt
      heeft gebruikt.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel32
  - number: '33.1'
    text: |-
      De plaatsing van de dienstpaspoortclausule geschiedt met behulp van standaardclausule IX. In de clausule worden
      de datum waarop deze is aangebracht, de datum waarop de geldigheidsduur ervan eindigt en het bijbehorende
      administratienummer ingevuld.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel33
  - number: '33.2'
    text: |-
      De clausule wordt ondertekend door de Minister van Buitenlandse Zaken of de door hem daartoe aangewezen persoon en
      gewaarmerkt met het in [artikel 102, eerste lid][ref1], bedoeld dienststempel.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel102
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '102'
        hoofdstuk: X
        paragraaf: '5'
  - number: '33.3'
    text: De clausule wordt aangebracht op de bladzijde bestemd voor ambtelijke aantekeningen of op een visumbladzijde.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel33
  - number: '35.1'
    text: De foto, vingerafdrukken en handtekening van de aanvrager worden opgenomen met behulp van het aanvraagstation.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel35
  - number: '35.2'
    text: |-
      In de aanvraag wordt de in [artikel 91][ref1] bedoelde locatiecode, behorende bij de uitgiftelocatie, vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel91
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '91'
        hoofdstuk: X
        paragraaf: '2'
  - number: '35.3'
    text: In de aanvraag wordt aangegeven op welk model reisdocument deze betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel35
  - number: '35.4'
    text: In de aanvraag wordt het aanvraagnummer vermeld.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel35
  - number: '36.1'
    text: |-
      Ter uitvoering van [artikel 2.1, eerste lid, van het besluit][ref1] wordt voor de vaststelling van de identiteit
      geen gebruik gemaakt van de in de reisdocumentenadministratie opgenomen gegevens behorende bij een eerder aan
      betrokkene uitgereikte nooddocument.


      [ref1]: https://wetten.overheid.nl/BWBR0044308#Artikel2
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0044308
        artikel: '2'
  - number: '36.2'
    text: |-
      Indien de in [artikel 2.1, eerste lid, van het besluit][ref1] bedoelde gegevens berusten bij een andere
      autoriteit, dan wordt deze verzocht om kosteloze verstrekking van een afschrift van de gevraagde gegevens uit de
      reisdocumentenadministratie. In de aanvraag wordt vermeld bij welke autoriteit de gegevens zijn opgevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0044308#Artikel2
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0044308
        artikel: '2'
  - number: '36.3'
    text: |-
      Bij een gericht onderzoek als bedoeld in [artikel 2.1, tweede lid, van het besluit][ref1] worden tevens nadere
      identificerende vragen gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0044308#Artikel2
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0044308
        artikel: '2'
  - number: '36.4'
    text: |-
      De aanvrager aan wie niet eerder een Nederlands reisdocument is verstrekt, overlegt bij zijn aanvraag andere
      identiteitsdocumenten die voorzien zijn van zijn foto en handtekening. Indien hij dergelijke documenten niet kan
      overleggen, is [artikel 2.1, tweede lid, van het besluit][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0044308#Artikel2
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0044308
        artikel: '2'
  - number: '36.5'
    text: |-
      In de aanvraag wordt vermeld dat de identiteit van de aanvrager is vastgesteld en met welke documenten of andere
      bewijsstukken de identiteitsvaststelling heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel36
  - number: '37.1'
    text: 'In de aanvraag voor een reisdocument worden de volgende persoonsgegevens van de aanvrager vermeld:'
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel37
  - number: 37.1.a
    text: geslachtsnaam en voornamen;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel37
  - number: 37.1.b
    text: geboortedatum en geboorteplaats;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel37
  - number: 37.1.c
    text: adres en woonplaats;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel37
  - number: 37.1.d
    text: geslacht;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel37
  - number: 37.1.e
    text: nationaliteit;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel37
  - number: 37.1.f
    text: lengte.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel37
  - number: '37.2'
    text: |-
      De geslachtsnaam omvat tevens de voorvoegsels en adellijke titels, de voornaam omvat tevens de adellijke
      predikaten. Op verzoek van de aanvrager kan de vermelding van adellijke titels en predikaten achterwege blijven.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel37
  - number: '37.3'
    text: Indien alleen een naam, voornaam of een roepnaam bekend is, wordt deze als geslachtsnaam beschouwd.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel37
  - number: '37.4'
    text: |-
      Indien de naam van de geboorteplaats niet kan worden ontleend aan de basisadministratie waarin de aanvrager als
      ingezetene is ingeschreven, dient de naam te worden vermeld zoals deze is opgenomen in zijn geboorteakte. In alle
      andere gevallen wordt de naam gevolgd zoals deze luidde ten tijde van de geboorte van de aanvrager, waarbij zoveel
      mogelijk de Nederlandse schrijfwijze wordt gebruikt. Indien de geboorteplaats niet kan worden vastgesteld, blijft
      de vermelding daarvan in de aanvraag achterwege. Het vermelden van het land achter de geboorteplaats is slechts
      toegestaan op verzoek van de aanvrager die aantoont daarbij een zwaarwegend belang te hebben en voorzover het
      reisdocument daartoe voldoende ruimte bevat.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel37
  - number: '37.5'
    text: |-
      De geboortedatum omvat de dag, de maand en het jaar. Van vermelding van de dag, de maand en het jaar kan worden
      afgezien, voor zover deze niet bekend zijn.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel37
  - number: '37.6'
    text: |-
      In de aanvraag voor een nationaal paspoort, een zakenpaspoort, een tweede paspoort, een faciliteitenpaspoort een
      Nederlandse identiteitskaart of een vervangende Nederlandse identiteitskaart wordt tevens het burgerservicenummer
      van de aanvrager vermeld, tenzij aan de aanvrager geen burgerservicenummer is toegekend en indien de aanvrager
      een administratienummer heeft, het administratienummer vermeld, waaronder de aanvrager is ingeschreven in de
      basisadministratie.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel37
  - number: '38'
    text: |-
      In de aanvraag voor een reisdocument, niet zijnde een Nederlandse identiteitskaart of vervangende Nederlandse
      identiteitskaart of een nooddocument, kan op verzoek van de aanvrager die door middel van schriftelijke
      bewijsstukken aantoont in het maatschappelijk verkeer zakelijk of beroepshalve bekend te staan onder een andere
      naam, tevens deze andere naam worden vermeld ter opneming van dit gegeven in het reisdocument.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel38
  - number: '39.1'
    text: |-
      In de aanvraag voor een reisdocument, niet zijnde een nooddocument, worden tevens de geslachtsnaam van de
      huidige echtgenoot, echtgenote of geregistreerd partner, dan wel van de laatste gewezen echtgenoot, echtgenote of
      geregistreerd partner, alsmede de burgerlijke staat op het moment van de aanvraag vermeld, indien de aanvrager om
      opneming van deze gegevens in het aangevraagde reisdocument verzoekt.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel39
  - number: '39.2'
    text: |-
      Indien de aanvraag betrekking heeft op de Nederlandse identiteitskaart of vervangende Nederlandse identiteitskaart
      wordt aan het in het eerste lid bedoelde verzoek slechts gevolg gegeven voor zover het reisdocument voldoende
      ruimte bevat voor vermelding van deze gegevens.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel39
  - number: '40.1'
    text: |-
      Van de door de aanvrager overgelegde Nederlandse of buitenlandse reisdocumenten die op zijn naam zijn gesteld, dan
      wel van de buitenlandse reisdocumenten waarin hij staat vermeld, worden het soort reisdocument, het documentnummer,
      de datum waarop de geldigheid van het document eindigt en de autoriteit die het document heeft verstrekt, in de
      aanvraag vermeld.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel40
  - number: '40.2'
    text: |-
      Indien het overgelegde Nederlandse reisdocument bladzijden met een nog geldig visum of een geldige verblijfstitel
      bevat, wordt op verzoek van de aanvrager in de aanvraag vermeld, dat in het aangevraagde reisdocument
      standaardclausule XII met het documentnummer van het in te leveren reisdocument wordt opgenomen.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel40
  - number: '41.1'
    text: |-
      Indien zijn eerder uitgereikt reisdocument mogelijk voorwerp is van fraude, is vermist of op andere gronden dan
      ingevolge de [wet][ref1] door een daartoe bevoegde autoriteit is ingenomen, kan de aanvrager een aanvraag voor
      een reisdocument indienen, indien hij mogelijke fraude, vermissing, onderscheidenlijke inname, overeenkomstig
      [artikel 72][ref2] meldt of heeft gemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005212
      [ref2]: https://wetten.overheid.nl/BWBR0012810#Artikel72
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005212
      - id: ref2
        bwb_id: BWBR0012810
        artikel: '72'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '41.2'
    text: 'In de aanvraag worden vermeld:'
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel41
  - number: 41.2.a
    text: |-
      mogelijke fraude, de vermissing of inname op andere gronden dan ingevolge de [wet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005212
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005212
  - number: 41.2.b
    text: het nummer van het desbetreffende reisdocument en de autoriteit die het heeft verstrekt, en
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel41
  - number: 41.2.c
    text: |-
      de datum waarop de schriftelijke verklaring, bedoeld in [artikel 72, tweede lid][ref1], is afgelegd, dan wel de
      schriftelijke of elektronische verklaring, bedoeld in 72, derde en vierde lid, is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel72
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '72'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '41.3'
    text: |-
      Indien een gegeven als bedoeld in het tweede lid, onder b of c, niet voorhanden is, wordt hiernaar een gericht
      onderzoek ingesteld.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel41
  - number: '42.1'
    text: |-
      Bij het indienen van een aanvraag voor een reisdocument wordt een pasfoto overgelegd die een goedgelijkend beeld
      van de aanvrager geeft.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel42
  - number: '42.2'
    text: |-
      De overgelegde pasfoto voldoet aan de acceptatiecriteria van de in [bijlage L][ref1] bij deze regeling opgenomen
      fotomatrix.


      [ref1]: https://wetten.overheid.nl/BWBR0012810
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0012810
  - number: '42.3'
    text: |-
      In afwijking van het tweede lid kan een pasfoto worden geaccepteerd indien de aanvrager heeft aangetoond dat
      godsdienstige of levensbeschouwelijke redenen zich verzetten tegen het niet bedekken van het hoofd.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel42
  - number: '42.4'
    text: |-
      In afwijking van het tweede lid kan een pasfoto worden geaccepteerd indien op grond van objectief vast te stellen
      fysieke of medische redenen, door de aanvrager niet kan worden voldaan aan alle in de fotomatrix opgenomen
      acceptatiecriteria. Bij gerede twijfel aan de medische redenen kan van de aanvrager worden verlangd, dat deze
      daartoe een door een bevoegde arts of medische instelling ondertekende verklaring overlegt.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel42
  - number: '42.5'
    text: |-
      In afwijking van het tweede lid kan een pasfoto van een aanvrager die de leeftijd van zes jaar nog niet heeft
      bereikt worden geaccepteerd, indien de foto voldoet aan de in de fotomatrix voor die leeftijdscategorie opgenomen
      minimum vereisten.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel42
  - number: '42.6'
    text: |-
      Bij het indienen van een aanvraag voor een laissez-passer op een post waar geen reisdocumentenstation aanwezig
      is, dan wel waar de opneming van de in de aanvraag vermelde gegevens in het reisdocumentstation plaatsvindt na de
      uitreiking van het laissez-passer, worden in afwijking van het eerste lid twee gelijke pasfoto’s overgelegd.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel42
  - number: '42.7'
    text: |-
      In afwijking van het eerste tot en met het zesde lid kan in noodgevallen, indien de aanvrager niet over een pasfoto
      beschikt en er redelijkerwijs voor hem geen mogelijkheid bestaat om pasfoto’s te laten maken, bij de verstrekking
      van een laissez-passer worden afgezien van de overlegging van een pasfoto. Indien de houder beschikt over een ander
      reis- of identiteitsdocument, voorzien van een foto, wordt uitsluitend een laissez-passer verstrekt dat uitsluitend
      tezamen met het andere reis- of identiteitsdocument kan worden gebruikt. In het laissez-passer wordt aangetekend
      tezamen met welk ander reis- of identiteitsdocument het laissez-passer aldus bruikbaar is. Indien de houder niet
      beschikt over een ander reisdocument of identiteitsdocument, kan van deze verplichting worden afgezien.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel42
  - number: 42a.1
    text: |-
      Bij het indienen van een aanvraag voor een reisdocument worden de afdrukken van twee vingers van de aanvrager
      opgenomen. Voor de aanvraag van een vervangende Nederlandse identiteitskaart en een nooddocument worden geen
      vingerafdrukken opgenomen.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel42a
  - number: 42a.2
    text: |-
      Bij een aanvrager als bedoeld in de eerste zin van het eerste lid worden platte afdrukken van de linker- en rechter
      wijsvinger opgenomen voor opslag in het reisdocument. Indien de kwaliteit van de vingerafdrukken van de wijsvingers
      onvoldoende is, worden platte afdrukken van de middelvingers, ringvingers of duimen opgenomen.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel42a
  - number: 42a.3
    text: |-
      Indien van slechts één vinger de afdruk van voldoende kwaliteit kan worden opgenomen, wordt uitsluitend de afdruk
      van die vinger opgenomen.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel42a
  - number: 42a.4
    text: |-
      In afwijking van het eerste lid wordt van het opnemen van vingerafdrukken afgezien indien de aanvrager op het
      moment van het indienen van de aanvraag de leeftijd van twaalf jaar nog niet heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel42a
  - number: 42a.5
    text: |-
      Indien de daartoe aangewezen persoon van oordeel is dat het fysiek dan wel als gevolg van een tijdelijke
      verhindering onmogelijk is om van de aanvrager te verlangen dat bij hem op het moment van het indienen van de
      aanvraag twee vingerafdrukken worden opgenomen, wordt in ieder geval de afdruk opgenomen van de vinger waarbij dit
      volgens de daartoe aangewezen persoon wel mogelijk is. Bij gerede twijfel of het fysiek dan wel als gevolg van een
      tijdelijke verhindering onmogelijk is om twee vingerafdrukken op te nemen, kan van de aanvrager worden verlangd,
      dat deze daartoe een door een bevoegde arts of medische instelling ondertekende verklaring overlegt.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel42a
  - number: 42a.6
    text: |-
      Indien van de aanvrager geen vingerafdrukken worden opgenomen, wordt in de aanvraag de reden voor het niet opnemen
      vermeld.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel42a
  - number: '43'
    text: |-
      Indien de persoon aan wie het aangevraagde reisdocument moet worden verstrekt door leeftijd of een handicap niet in
      staat is zijn handtekening te plaatsen, wordt daarvan in de aanvraag melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel43
  - number: '44'
    text: |-
      Indien de aanvrager ingevolge [artikel 28, derde lid, van de wet][ref1] niet persoonlijk bij het indienen van de
      aanvraag is verschenen, wordt dit gegeven met de reden daarvan in de aanvraag vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel28
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '28'
  - number: '45.1'
    text: |-
      De verklaring van toestemming als bedoeld in de [artikelen 34 tot en met 37 van de wet][ref1] dient schriftelijk te
      worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel34
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '34'
  - number: '45.2'
    text: |-
      In de verklaring van toestemming worden tevens de naam en de handtekening vermeld van degene die de aanvraag ten
      behoeve van een handelingsonbekwame indient.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel45
  - number: '45.3'
    text: |-
      Indien gebruik wordt gemaakt van het aanvraag-informatieformulier, bedoeld in [artikel 35][ref1], kan voor het
      overleggen van de verklaring van toestemming worden volstaan met het (mede) ondertekenen van dat formulier door
      degenen die het gezag over de minderjarige uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel35
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '35'
        hoofdstuk: III
        paragraaf: '1'
  - number: '45.4'
    text: In de aanvraag wordt melding gemaakt van de overlegging van de betreffende verklaring van toestemming.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel45
  - number: '46.1'
    text: |-
      Op de procedure voor het verkrijgen van de nodige zekerheid over de identiteit van degene die het gezag over
      de minderjarige uitoefent of van de curator zijn [artikel 36][ref1] en [artikel 2.1 van het besluit][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0044308#Artikel2
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '36'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0044308
        artikel: '2'
  - number: '46.2'
    text: |-
      Indien degene die een verklaring van toestemming moet afgeven niet in persoon verschijnt, kan de aanvraag slechts
      in behandeling worden genomen indien uit de overgelegde schriftelijke verklaring van toestemming en eventuele
      andere overgelegde stukken met de nodige zekerheid kan worden afgeleid dat de verklaring van toestemming van de
      betreffende persoon afkomstig is.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel46
  - number: '46.3'
    text: |-
      Voor het verkrijgen van de nodige zekerheid over de bevoegdheid tot het afgeven van de verklaring van toestemming
      van degene die het gezag over de minderjarige uitoefent of van de curator wordt gebruik gemaakt van de door de
      betreffende persoon overgelegde stukken.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel46
  - number: '46.4'
    text: |-
      Indien onzekerheid bestaat over de bevoegdheid van degene die het gezag over de minderjarige uitoefent of van de
      curator wordt daarnaar een gericht onderzoek ingesteld.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel46
  - number: '51.1'
    text: |-
      De daartoe aangewezen persoon vergelijkt, behoudens in het [artikel 44][ref1] bedoelde geval, nauwkeurig de
      overgelegde foto van de aanvrager dan wel van degene ten behoeve van wie de aanvraag wordt ingediend met de persoon
      die voor hem staat en brengt deze foto op de bestemde plaats in het foto- en handtekeningformulier aan.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel44
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '44'
        hoofdstuk: III
        paragraaf: '1'
  - number: '51.2'
    text: |-
      De in het eerste lid bedoelde persoon ziet, behoudens in het in [artikel 43][ref1] bedoelde geval, er op toe dat
      in het foto- en handtekeningformulier op de bestemde plaats de duidelijk leesbare handtekening wordt geplaatst
      van de aanvrager dan wel van de persoon ten behoeve van wie de aanvraag van het reisdocument wordt gedaan. In de
      gevallen waarin gebruik wordt gemaakt van een aanvraag-informatieformulier, wordt dit formulier door de aanvrager
      ondertekend.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel43
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '43'
        hoofdstuk: III
        paragraaf: '1'
  - number: '51.3'
    text: |-
      Het foto- en handtekeningformulier wordt door de in het eerste lid bedoelde persoon met gebruikmaking van het
      aanvraagstation gedigitaliseerd.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel51
  - number: '51.4'
    text: |-
      Het opnemen van de vingerafdrukken als bedoeld in [artikel 42a][ref1], geschiedt met gebruikmaking van het
      aanvraagstation.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel42a
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: 42a
        hoofdstuk: III
        paragraaf: '1'
  - number: '51.5'
    text: |-
      Indien sprake is van bijzondere omstandigheden als genoemd in [artikel 28, derde lid, van de wet][ref1] worden de
      vingerafdrukken van de aanvrager opgenomen met behulp van het mobiel vingerafdrukopname-apparaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel28
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '28'
  - number: '51.6'
    text: |-
      Indien de aanvrager niet op de Nederlandse vertegenwoordiging zijn aanvraag indient, of bij de Nederlandse
      vertegenwoordiging waar het document wordt aangevraagd geen werkend aanvraagstation aanwezig is, kunnen zijn
      vingerafdrukken opgenomen worden met behulp van het mobiel vingerafdrukopname-apparaat.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel51
  - number: '52.1'
    text: |-
      Een aanvraag waarbij niet is voldaan aan het bepaalde in de [artikelen 2.1 tot en met 2.17 van het besluit][ref1]
      en de [artikelen 11 tot en met 51][ref2] wordt niet in behandeling genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0044308#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012810#Artikel11
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0044308
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0012810
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
  - number: '52.2'
    text: |-
      Indien de daartoe aangewezen ambtenaar, met inachtneming van het bij of krachtens de wet bepaalde, heeft
      beslist dat het aangevraagde reisdocument kan worden uitgereikt, worden in de aanvraag vermeld het feit van
      deze verstrekking, de datum van deze verstrekking en de datum waarop de geldigheidsduur van het uit te reiken
      reisdocument eindigt.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel52
  - number: '52.3'
    text: |-
      In de aanvraag voor een reisdocument waarbij sprake is van een weigering of vervallenverklaring wordt, afhankelijk
      van de genomen beslissing, vermeld voor welke landen het reisdocument geldig is.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel52
  - number: '52.4'
    text: |-
      In de aanvraag voor een reisdocument voor vluchtelingen dan wel een reisdocument voor vreemdelingen wordt,
      afhankelijk van de nationaliteit van de persoon aan wie het reisdocument wordt uitgereikt, aangegeven welk land van
      de territoriale geldigheid is uitgesloten.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel52
  - number: '52.5'
    text: |-
      In de aanvraag voor een reisdocument voor vreemdelingen, uit te reiken aan een staatloze, wordt aangegeven dat
      diens status van staatloze in het reisdocument moet worden vermeld.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel52
  - number: '52.6'
    text: De daartoe aangewezen persoon vermeldt in de aanvraag de verstrekkende autoriteit.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel52
  - number: '53.1'
    text: |-
      De daartoe aangewezen persoon draagt zorg dat de aanvraaggegevens, genoemd in de
      [artikelen 35 tot en met 41][ref1], [44 tot en met 50][ref2] en [52][ref3] in het reisdocumentenstation en de foto,
      vingerafdrukken en handtekening in het aanvraagstation worden vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0012810#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0012810#Artikel52
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '35'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0012810
        artikel: '44'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0012810
        artikel: '52'
        hoofdstuk: III
        paragraaf: '4'
  - number: '53.2'
    text: |-
      Indien bij de aanvraag voor het opnemen van de vingerafdrukken gebruik is gemaakt van het mobiel
      vingerafdrukopname-apparaat worden de gegevens uitsluitend verwerkt in een aanvraagstation dat zich op
      de uitgiftelocatie bevindt. Het mobiel vingerafdrukopname-apparaat wordt in het locale netwerk van de
      uitgiftelocatie aangesloten, waarna de daarin vastgelegde vingerafdrukken door het aanvraagstation uit het mobiel
      vingerafdrukopname-apparaat worden opgehaald en samengevoegd met de ingevolge [artikel 51, derde lid][ref1],
      gedigitaliseerde foto en handtekening.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel51
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '51'
        hoofdstuk: III
        paragraaf: '3'
  - number: '53.3'
    text: De in het aanvraagstation vastgelegde gegevens worden verwerkt en doorgezonden naar het reisdocumentenstation.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel53
  - number: '54.1'
    text: |-
      Op een post waar een reisdocumentenstation aanwezig is wordt het foto- en handtekeningformulier met betrekking tot
      een nooddocument op de in [artikel 51, derde lid][ref1], bedoelde wijze gedigitaliseerd en met de aanvraaggegevens,
      bedoeld in [artikel 53][ref2], samengevoegd tot een aanvraagbestand in het reisdocumentenstation.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0012810#Artikel53
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '51'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0012810
        artikel: '53'
        hoofdstuk: III
        paragraaf: '4'
  - number: '54.2'
    text: |-
      Bij de aanvraag van een nooddocument wordt tevens, overeenkomstig de gebruikershandleiding bij het
      reisdocumentenstation, bedoeld in [artikel 101][ref1], en met inachtneming van het bepaalde in [artikel 28][ref2],
      de datum waarop het desbetreffende reisdocument uiterlijk moet worden ingeleverd en de autoriteit bij wie de
      inlevering dient plaats te vinden, in het aanvraagbestand opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0012810#Artikel28
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '101'
        hoofdstuk: X
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0012810
        artikel: '28'
        hoofdstuk: II
        paragraaf: '5'
  - number: '54.3'
    text: |-
      De daartoe aangewezen persoon controleert het aanvraagbestand in het reisdocumentenstation op volledigheid en
      autoriseert het gebruik van dit bestand voor het personaliseren van het nooddocument.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel54
  - number: '54.4'
    text: |-
      Het personaliseren van een nooddocument geschiedt met behulp van het in het reisdocumentenstation opgenomen
      aanvraagbestand en met gebruikmaking van de daartoe bestemde reisdocumentenprinter, overeenkomstig de
      gebruikershandleiding bij het reisdocumentenstation, bedoeld in [artikel 101][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel101
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '101'
        hoofdstuk: X
        paragraaf: '5'
  - number: '54.5'
    text: Na het personaliseren van het nooddocument wordt het bijbehorende laminaat over de houderpagina aangebracht.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel54
  - number: '54.6'
    text: |-
      Het personaliseren van een laissez-passer geschiedt door de gegevens met de pen op onuitwisbare wijze in
      de daartoe bestemde rubrieken van het reisdocument in te vullen, overeenkomstig de in [bijlage J][ref1]
      opgenomen invulinstructie laissez-passer. Vervolgens wordt op de in de invulinstructie aangegeven wijze
      de autoriteit vermeld, die het document heeft verstrekt en het laissez-passer gewaarmerkt met het in
      [artikel 102, eerste lid][ref2], bedoelde dienststempel. Het scannen van het aanvraagformulier en de opneming van
      de gegevens in het reisdocumentenstation, bedoeld in het eerste en tweede lid, kan in afwijking van het derde lid
      ook na uitreiking van het laissez-passer plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0012810
      [ref2]: https://wetten.overheid.nl/BWBR0012810#Artikel102
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0012810
      - id: ref2
        bwb_id: BWBR0012810
        artikel: '102'
        hoofdstuk: X
        paragraaf: '5'
  - number: '55'
    text: |-
      De in het aanvraagstation vastgelegde foto, handtekening en vingerafdrukken worden met de aanvraaggegevens, bedoeld
      in [artikel 53][ref1], samengevoegd tot een aanvraagbestand in het reisdocumentenstation.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel53
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '53'
        hoofdstuk: III
        paragraaf: '4'
  - number: '56'
    text: |-
      De daartoe aangewezen persoon zendt nadat is vastgesteld dat het aangevraagde reisdocument kan worden uitgereikt,
      het aanvraagbestand met gebruikmaking van het reisdocumentenstation naar de leverancier van de reisdocumenten. Het
      te verzenden aanvraagbestand wordt met gebruikmaking van de aan hem toegekende identificatiekaart voorzien van een
      digitale handtekening.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel56
  - number: 56a
    text: |-
      De leverancier geeft uitvoering aan [artikel 1.6, eerste lid, van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044308#Artikel1
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel56a
    references:
      - id: ref1
        bwb_id: BWBR0044308
        artikel: '1'
  - number: '57.1'
    text: |-
      De gepersonaliseerde reisdocumenten en identificatiekaarten worden bij het ministerie van Buitenlandse Zaken in
      ontvangst genomen door een daartoe aangewezen persoon als bedoeld in[ artikel 89, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel89
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '89'
        hoofdstuk: X
        paragraaf: '1'
  - number: '57.2'
    text: |-
      De in het eerste lid genoemde persoon toont de in [artikel 89, tweede lid][ref1], bedoelde machtiging van de
      Minister van Buitenlandse Zaken tot ontvangstneming en legitimeert zich, op verzoek van de distributeur, met een
      identiteitsdocument als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel89
      [ref2]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '89'
        hoofdstuk: X
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '57.3'
    text: De aflevering van de zending bij het ministerie van Buitenlandse Zaken vindt plaats op de afgesproken tijdstippen.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel57
  - number: '57.4'
    text: |-
      Indien de persoon die de zending in ontvangst neemt zich desgevraagd niet of niet voldoende kan legitimeren dan
      wel onvoldoende zekerheid bestaat met betrekking tot zijn bevoegdheid om de zending in ontvangst te nemen, dan
      wel om enige andere reden door een handelen of nalaten van de bevoegde autoriteit een veilige aflevering op de
      uitgiftelocatie niet mogelijk is, draagt de distributeur de zending niet over.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel57
  - number: '58.1'
    text: |-
      De tot ontvangst bevoegde persoon bij het ministerie van Buitenlandse Zaken controleert, aan de hand van
      de voormelding van de leverancier, in het bijzijn van de distributeur of de zending voor het ministerie
      onderscheidenlijk de uitgiftelocaties in het buitenland bestemd is. Indien dit het geval is en het pakket is
      onbeschadigd, vindt de overdracht plaats.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel58
  - number: '58.2'
    text: |-
      Indien de zending niet voor het ministerie van Buitenlandse Zaken bestemd is, afwijkingen vertoont, beschadigd
      is dan wel documenten ontbreken, wordt gehandeld overeenkomstig [bijlage D][ref1]. Het in kennis stellen
      van de leverancier geschiedt met gebruikmaking van het daartoe door de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties beschikbaar gestelde formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0012810
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0012810
  - number: '58.3'
    text: |-
      De documenten die voor een andere autoriteit blijken te zijn bestemd, worden op de in [artikel 93][ref1] aangegeven
      wijze opgeslagen tot ze worden opgehaald door de leverancier. Het overdragen van de verkeerd geleverde documenten
      aan de leverancier geschiedt met gebruikmaking van het daartoe door de distributeur beschikbaar gestelde formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel93
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '93'
        hoofdstuk: X
        paragraaf: '3'
  - number: '58.4'
    text: |-
      Bij de constatering dat het pakket beschadigd is, wordt het pakket in het bijzijn van de distributeur in een voor
      het publiek afgesloten ruimte gecontroleerd. Ook in geval van beschadiging wordt het pakket in ontvangst genomen.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel58
  - number: '58.5'
    text: |-
      Indien de tot ontvangst bevoegde persoon vaststelt dat er documenten zijn beschadigd of ontbreken, wordt hiervan
      door de distributeur een proces-verbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel58
  - number: '58.6'
    text: Het afschrift van het proces-verbaal wordt door de autoriteit bewaard.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel58
  - number: '58.7'
    text: |-
      De Minister van Buitenlandse Zaken draagt er zorg voor dat de gepersonaliseerde reisdocumenten en
      identificatiekaarten op een beveiligde wijze op de daartoe bestemde locatie worden afgeleverd.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel58
  - number: '59.1'
    text: |-
      Indien documenten niet op het verwachte tijdstip bij het ministerie van Buitenlandse Zaken worden ontvangen, wordt
      op een speciaal daarvoor bestemd telefoonnummer bij de leverancier informatie ingewonnen over de te verwachten
      levertijd.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel59
  - number: '59.2'
    text: |-
      In het geval de zending zich nog onder de distributeur bevindt, draagt deze er zorg voor dat de zending alsnog de
      volgende dag wordt afgeleverd.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel59
  - number: '59.3'
    text: |-
      In het geval documenten op een verkeerde uitgiftelocatie in Nederland zijn afgeleverd, draagt de leverancier er
      zorg voor dat de desbetreffende documenten, zo mogelijk nog dezelfde dag, bij het ministerie van Buitenlandse Zaken
      worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel59
  - number: '59.4'
    text: |-
      Het in ontvangst nemen van documenten als bedoeld in het derde lid geschiedt overeenkomstig bijlage D, met
      gebruikmaking van het daartoe door de distributeur beschikbaar gestelde formulier.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel59
  - number: '60.1'
    text: |-
      De daartoe aangewezen persoon gaat na of de in de zending aanwezige documenten overeenkomen met de aanvraagnummers
      in het op de zending betrekking hebbende elektronische bericht in het reisdocumentenstation, dat door de
      leverancier is verzonden.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel60
  - number: '60.2'
    text: |-
      In het reisdocumentenstation wordt geregistreerd of een document overeenkomstig de opgave in het elektronisch
      bericht, bedoeld in het eerste lid, is ontvangen, al dan niet is beschadigd en op de juiste wijze is
      gepersonaliseerd en geproduceerd.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel60
  - number: '60.3'
    text: |-
      Indien de zending niet voor de uitgiftelocatie bestemd is, afwijkingen vertoont, beschadigd is dan wel documenten
      ontbreken wordt gehandeld overeenkomstig [bijlage D][ref1]. Het in kennis stellen van de leverancier geschiedt met
      gebruikmaking van het daartoe door de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde
      formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0012810
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0012810
  - number: '61.1'
    text: |-
      De documenten die na controle van de zending, bedoeld in [artikel 60][ref1], voor een andere locatie blijken te
      zijn bestemd, worden teruggezonden naar het ministerie en alsnog overeenkomstig [artikel 58, zesde lid][ref2],
      beschikbaar gesteld aan de tot uitreiking daarvan bevoegde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0012810#Artikel58
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '60'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0012810
        artikel: '58'
        hoofdstuk: IV
  - number: '61.2'
    text: |-
      De documenten die na de in het eerste lid bedoelde controle niet voor uitgifte door de minister van Buitenlandse
      Zaken blijken te zijn bestemd, worden bij de post vernietigd op de in [78, eerste lid][ref1], aangegeven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel78
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '78'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '62'
    text: |-
      Indien een reisdocument is beschadigd, onjuist is geproduceerd of gepersonaliseerd, dan wel niet is ontvangen en
      niet alsnog ingevolge [artikel 61, eerste lid][ref1], zal worden bezorgd, wordt het op het reisdocument betrekking
      hebbende aanvraagbestand opnieuw verzonden aan de leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel61
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '61'
        hoofdstuk: IV
  - number: '63'
    text: |-
      Reisdocumenten die bij de controle van de zending in het reisdocumentenstation dan wel bij de uitreiking onjuist
      blijken te zijn geproduceerd of gepersonaliseerd, dan wel blijken te zijn beschadigd, worden overeenkomstig
      [bijlage D][ref1], met gebruikmaking van het daartoe door de Minister van Binnenlandse Zaken en Koninkrijksrelaties
      beschikbaar gestelde formulier, teruggestuurd aan de leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0012810
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0012810
  - number: '65'
    text: |-
      Indien het bij de uitreiking van het aangevraagde reisdocument in te leveren reisdocument mogelijk voorwerp
      is van fraude, is vermist of op andere gronden dan ingevolge de [wet][ref1] door een daartoe bevoegde
      autoriteit is ingenomen, is [artikel 72][ref2] alsnog van toepassing en worden de gegevens, bedoeld in
      [artikel 41, tweede lid][ref3], alsnog in de aanvraag met betrekking tot het uit te reiken document opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005212
      [ref2]: https://wetten.overheid.nl/BWBR0012810#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0012810#Artikel41
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0005212
      - id: ref2
        bwb_id: BWBR0012810
        artikel: '72'
        hoofdstuk: VII
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0012810
        artikel: '41'
        hoofdstuk: III
        paragraaf: '1'
  - number: '67.1'
    text: |-
      Indien de aanvrager bij de aanvraag aannemelijk heeft gemaakt dat van hem redelijkerwijs niet kan worden gevergd
      dat hij in persoon verschijnt bij de uitreiking, wordt het reisdocument per aangetekende post dan wel op een andere
      veilige wijze aan hem toegezonden.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel67
  - number: '67.2'
    text: |-
      De inlevering van de Nederlandse reisdocumenten als bedoeld in [artikel 32 van de wet][ref1] geschiedt in dat geval
      door deze reisdocumenten toe te sturen op een door de Minister van Buitenlandse Zaken daartoe voorgeschreven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel32
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '32'
  - number: '67.3'
    text: |-
      Tot toezending van het uit te reiken reisdocument wordt niet overgegaan dan na ontvangst van de ingevolge het
      tweede lid toegestuurde reisdocumenten.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel67
  - number: '68.1'
    text: |-
      De daartoe aangewezen persoon registreert de uitreiking van een reisdocument, alsmede de inlevering van het vorige
      reisdocument, in het reisdocumentenstation.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel68
  - number: '68.2'
    text: |-
      Indien bij de uitreiking blijkt dat het reisdocument is beschadigd, onjuist is geproduceerd of gepersonaliseerd dan
      wel uit de opslag is verdwenen, wordt dit in het reisdocumentenstation geregistreerd.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel68
  - number: '68.3'
    text: |-
      Indien binnen drie maanden na ontvangst bij de uitgiftelocatie geen uitreiking van een geleverd reisdocument heeft
      plaatsgevonden, wordt dit geregistreerd in het reisdocumentenstation.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel68
  - number: 68a.1
    text: |-
      De Minister van Binnenlandse Zaken en Koninkrijksrelaties verzendt direct na uitreiking de persoonlijke PIN-code en
      de intrekkingscode aan de houder van de Nederlandse identiteitskaart.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel68a
  - number: 68a.2
    text: |-
      Indien de houder de toegezonden PIN-code met intrekkingscode heeft verloren, verstrekt de Minister van Binnenlandse
      Zaken en Koninkrijksrelaties op zijn verzoek:
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel68a
  - number: 68a.2.a
    text: |-
      dat binnen zes weken na uitreiking is gedaan, deze codes opnieuw, tenzij de houder tijdens het activeringsproces
      van het publiek identificatiemiddel de PIN-code heeft gewijzigd of de intrekkingscode heeft gebruikt;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel68a
  - number: 68a.2.b
    text: |-
      dat later dan zes weken na uitreiking is gedaan, nieuwe codes, tenzij de houder tijdens het activeringsproces van
      het publiek identificatiemiddel de PIN-code heeft gewijzigd of de intrekkingscode heeft gebruikt;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel68a
  - number: 68a.2.c
    text: |-
      dat een verzoek betreft in verband met een PIN-code die al tijdens het activeringsproces van het publieke middels
      is gewijzigd, na identificatie nieuwe codes, tenzij de houder de intrekkingscode heeft gebruikt.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel68a
  - number: '70.1'
    text: |-
      Indien de minister van Buitenlandse Zaken een aanvraag in behandeling neemt dan wel een ingehouden reisdocument
      ontvangt betreffende een persoon, die blijkens de in [artikel 5][ref1] bedoelde administratie, in het register
      paspoortsignaleringen is opgenomen, verzoekt hij terstond de minister van Binnenlandse Zaken en Koninkrijksrelaties
      hem mede te delen of de desbetreffende persoon nog steeds in het register paspoortsignaleringen is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel5
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '5'
        hoofdstuk: I
        paragraaf: '4'
  - number: '70.2'
    text: |-
      Indien de Minister van Buitenlandse Zaken ingevolge [artikel 44, derde lid, van de wet][ref1] de in het register
      paspoortsignaleringen opgenomen gegevens van een persoon wenst te ontvangen, doet hij daartoe een verzoek aan de
      Minister van Binnenlandse Zaken en Koninkrijksrelaties. Dit verzoek kan ook tegelijkertijd met het in het eerste
      lid bedoelde verzoek worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel44
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '44'
  - number: '71'
    text: |-
      De Minister van Buitenlandse Zaken geeft de Minister van Binnenlandse Zaken en Koninkrijksrelaties met
      gebruikmaking van het daartoe door de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde
      formulier kennis van zijn beslissing, bedoeld in [artikel 45, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel45
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '45'
  - number: '72.1'
    text: |-
      Indien een eerder uitgereikt reisdocument mogelijk voorwerp is van fraude, is vermist of op andere gronden
      dan ingevolge de [wet][ref1] door een daartoe bevoegde autoriteit is ingenomen, meldt de houder dit gegeven
      overeenkomstig het tweede, derde onderscheidenlijk vijfde lid, aan de Minister van Buitenlandse Zaken, of,
      overeenkomstig het vierde lid, aan de Minister van Binnenlandse Zaken en Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0005212
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0005212
  - number: '72.2'
    text: |-
      De melding van mogelijke fraude vindt plaats door middel van een door de houder ten overstaan van de daartoe door
      de Minister van Buitenlandse Zaken aangewezen persoon af te leggen schriftelijke verklaring, overeenkomstig het
      daartoe door de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde formulier. Bij de
      melding van mogelijke fraude levert de houder zijn reisdocument in. Indien het reisdocument is vermist wordt een
      melding van vermissing gedaan, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel72
  - number: '72.3'
    text: |-
      De melding van een vermissing vindt plaats door middel van een door de houder ten overstaan van de daartoe door
      de Minister van Buitenlandse Zaken aangewezen persoon af te leggen schriftelijke verklaring, overeenkomstig het
      daartoe door de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde formulier. Indien een
      proces-verbaal van de politie wordt overgelegd, wordt daarvan een kopie gemaakt die aan de schriftelijke verklaring
      omtrent de vermissing wordt toegevoegd. De melding van een vermissing kan tevens elektronisch geschieden,
      overeenkomstig het daartoe door de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde
      formulier, indien de Minister van Buitenlandse Zaken deze weg beschikbaar heeft gesteld. In het geval van een
      elektronische melding geschiedt de vaststelling van de juistheid van de identiteit van de houder door middel van
      Digid op basis van ten minste een twee-factoren-authenticatie, dan wel een ander en minstens even betrouwbare
      authenticatiemethode.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel72
  - number: '72.4'
    text: |-
      De melding van mogelijke fraude of van een vermissing kan tevens elektronisch geschieden overeenkomstig het daartoe
      door de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde formulier indien de houder
      op verzoek van de Minister van Buitenlandse Zaken heeft ingestemd met het doen van een elektronische melding en
      de houder bij de aanvraag van het in het eerste lid bedoelde document beschikte over een burgerservicenummer. De
      vaststelling van de juistheid van de identiteit van de houder geschiedt door middel van DigiD op basis van ten
      minste een twee-factoren-authenticatie, dan wel een andere en minstens even betrouwbare authenticatiemethode. Bij
      de melding van mogelijke fraude levert de houder zijn reisdocument in.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel72
  - number: '72.5'
    text: |-
      De melding van de inname van een uitgereikt reisdocument op andere gronden dan ingevolge de [wet][ref1] door een
      daartoe bevoegde autoriteit vindt plaats door middel van het overleggen van een door de desbetreffende autoriteit
      afgegeven schriftelijke verklaring omtrent de inname, aan de daartoe door de Minister van Buitenlandse Zaken
      aangewezen persoon. De daartoe aangewezen persoon maakt een kopie van deze verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0005212
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0005212
  - number: '72.6'
    text: |-
      De schriftelijke verklaring omtrent de mogelijke fraude, bedoeld in het tweede lid, de schriftelijke of
      elektronische verklaring omtrent fraude of vermissing bedoeld in het derde of vierde lid, dan wel de kopie van de
      overgelegde schriftelijke verklaring die omtrent de inname is overgelegd, bedoeld in het vijfde lid, wordt bewaard
      in de reisdocumentenadministratie.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel72
  - number: '73'
    text: |-
      Met het oog op vermelding daarvan in het register vermiste of vervallen reisdocumenten, wordt van mogelijke
      fraude of vermissing terstond melding gedaan aan de Minister van Binnenlandse Zaken en Koninkrijksrelaties met
      gebruikmaking van de daartoe door de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde
      dienst.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel73
  - number: '74.1'
    text: |-
      Indien de Minister van Buitenlandse Zaken een reisdocument heeft ingehouden, dan wel indien
      bij hem een reisdocument is ingeleverd van een houder, die in verband met het bepaalde in de
      [artikelen 18 tot en met 24 van de wet][ref1], in het register paspoortsignaleringen is opgenomen, houdt deze dit
      reisdocument onder zich totdat hij heeft beslist over de vervallenverklaring daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel18
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '18'
  - number: '74.2'
    text: |-
      Zodra is beslist dat het reisdocument niet vervallen moet worden verklaard, wordt dit aan de houder teruggegeven,
      dan wel op de meest beveiligde wijze naar het door de houder opgegeven adres gezonden.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel74
  - number: '74.3'
    text: |-
      Indien het reisdocument vervallen wordt verklaard, wordt dit hetzij ingevolge [artikel 75][ref1] doorgezonden,
      hetzij op de in [artikel 78][ref2] bepaalde wijze definitief aan het verkeer onttrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0012810#Artikel78
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '75'
        hoofdstuk: VII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012810
        artikel: '78'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '75'
    text: |-
      De Minister van Buitenlandse Zaken zendt indien hij niet bevoegd is een door hem ingehouden, bij hem ingeleverd,
      door hem ontvangen of aan hem toegezonden reisdocument definitief aan het verkeer te onttrekken, het desbetreffende
      reisdocument terstond door aan de autoriteit die daartoe wel bevoegd is.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel75
  - number: '76.1'
    text: |-
      De Minister van Buitenlandse Zaken deelt met het oog op een vermelding in het register paspoortsignaleringen op
      grond van [artikel 47, derde lid, van de wet][ref1] de Minister van Binnenlandse Zaken en Koninkrijksrelaties
      de gegevens mede van de houder van een reisdocument dat van rechtswege is vervallen, indien de houder weigert het
      reisdocument in te leveren dan wel de woon- of verblijfplaats van de houder niet kan worden achterhaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel47
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '47'
  - number: '76.2'
    text: |-
      De Minister van Buitenlandse Zaken deelt, met het oog op de verwijdering van de in het eerste lid bedoelde
      vermelding uit het register paspoortsignaleringen, de Minister van Binnenlandse Zaken en Koninkrijksrelaties
      terstond mede dat hij het in het eerste lid bedoelde reisdocument heeft ingehouden, dan wel het desbetreffende
      reisdocument bij hem is ingeleverd.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel76
  - number: '76.3'
    text: |-
      De in het eerste en tweede lid bedoelde mededeling geschiedt met gebruikmaking van het daartoe door de Minister van
      Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde formulier.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel76
  - number: '76.4'
    text: |-
      Van het van rechtswege vervallen van een reisdocument ingevolge
      [artikel 47, eerste lid, onder a, b, c, e, f of h van de wet][ref1] wordt, met het oog op de vermelding daarvan
      in het register vermiste of vervallen reisdocumenten, terstond melding gedaan aan de Minister van Binnenlandse
      Zaken en Koninkrijksrelaties met gebruikmaking van het daartoe door de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties beschikbaar gestelde formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel47
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '47'
  - number: '78.1'
    text: |-
      Het deugdelijk vernietigen van een reisdocument dat definitief aan het verkeer wordt onttrokken, geschiedt door
      het reisdocument op gecontroleerde wijze te verbranden of te versnipperen, zodat reconstructie van het reisdocument
      niet meer mogelijk is.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel78
  - number: '78.2'
    text: |-
      Op verzoek van de houder wordt diens nationaal paspoort, Nederlandse identiteitskaart, faciliteitenpaspoort, tweede
      paspoort, reisdocument voor vluchtelingen, reisdocument voor vreemdelingen, diplomatiek paspoort of dienstpaspoort
      na inlevering, definitief aan het verkeer onttrokken door het document onbruikbaar gemaakt aan hem terug te geven.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel78
  - number: '78.3'
    text: |-
      Het onbruikbaar maken geschiedt door het aanbrengen van drie ponsgaten (elk van tenminste 12 mm) door het gehele
      reisdocument op zodanige wijze dat elk in het reisdocument aangebrachte kinegram gedeeltelijk en de aangebrachte
      chip geheel onbruikbaar worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel78
  - number: '78.4'
    text: |-
      Indien het ingeleverde reisdocument bladzijden met een nog geldig visum of een geldige verblijfstitel bevat en
      in verband daarmee het verzoek is gedaan, bedoeld in [artikel 40, tweede lid][ref1], worden de desbetreffende
      bladzijden en het documentnummer intact gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel40
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '40'
        hoofdstuk: III
        paragraaf: '1'
  - number: '78.5'
    text: |-
      Een reisdocument, dat ingevolge artikel 7.1, eerste lid, onder c, van het besluit, ten gevolge van misdruk of
      verkeerde personalisatie is ingehouden of ingeleverd, wordt deugdelijk vernietigd overeenkomstig het eerste lid
      nadat het per aangetekende post, met gebruikmaking van het daartoe door de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties beschikbaar gesteld formulier, is teruggestuurd aan de leverancier.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel78
  - number: '78.6'
    text: |-
      De in [artikel 7.1, eerste lid, onder d, van het besluit][ref1], en in het tweede lid bedoelde
      teruggave van een reisdocument vindt niet plaats, indien het reisdocument op grond van
      [artikel 47, eerste lid, onder a, b, c, g, h of i, van de wet][ref2] van rechtswege is vervallen, op grond van
      [54, eerste lid, onder b, c en e, van de wet][ref3] is ingehouden, dan wel [artikel 110, tweede lid][ref4], of
      [artikel 111, eerste lid][ref5], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0044308#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0005212#Artikel54
      [ref4]: https://wetten.overheid.nl/BWBR0012810#Artikel110
      [ref5]: https://wetten.overheid.nl/BWBR0012810#Artikel111
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0044308
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005212
        artikel: '47'
      - id: ref3
        bwb_id: BWBR0005212
        artikel: '54'
      - id: ref4
        bwb_id: BWBR0012810
        artikel: '110'
        hoofdstuk: XII
      - id: ref5
        bwb_id: BWBR0012810
        artikel: '111'
        hoofdstuk: XII
  - number: '80.1'
    text: |-
      Van de definitieve onttrekking aan het verkeer van een reisdocument, niet zijnde een nooddocument of een gevonden
      reisdocument, en de uitreiking van een reisdocument, niet zijnde een nooddocument, wordt kennis gegeven aan:
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel80
  - number: 80.1.a
    text: de burgemeester van de gemeente of de gezaghebber van het openbaar lichaam waarvan de houder ingezetene is;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel80
  - number: 80.1.b
    text: |-
      de Minister van Binnenlandse Zaken en Koninkrijksrelaties indien de houder als niet-ingezetene is geregistreerd in
      de basisadministratie, of
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel80
  - number: 80.1.c
    text: |-
      de autoriteit in Aruba, Curaçao, of Sint Maarten, of de gezaghebber van het openbaar lichaam waarvan de houder
      ingezetene is, of laatstelijk ingezetene was.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel80
  - number: '80.2'
    text: |-
      In afwijking van het eerste lid wordt van de definitieve onttrekking aan het verkeer van een Nederlandse
      identiteitskaart en van de uitreiking van een Nederlandse identiteitskaart kennis gegeven aan de Minister van
      Binnenlandse Zaken en Koninkrijksrelaties, indien de houder in de basisadministratie van Aruba, Curaçao of Sint
      Maarten is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel80
  - number: '81'
    text: 'De Minister van Buitenlandse Zaken die:'
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel81
  - number: 81.a
    text: een door hem verstrekt reisdocument definitief aan het verkeer onttrekt, dan wel
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel81
  - number: 81.b
    text: |-
      door middel van de daartoe door de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar
      gestelde dienst in kennis wordt gesteld van de definitieve onttrekking aan het verkeer van een door hem
      verstrekt reisdocument en de uitreiking van een vervangend reisdocument, registreert deze feiten in de
      reisdocumentenadministratie, bedoeld in [artikel 82][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel82
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '82'
        hoofdstuk: IX
  - number: '82.1'
    text: Van elk verstrekt reisdocument wordt een administratie bijgehouden.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel82
  - number: '82.2'
    text: |-
      De in het eerste lid bedoelde reisdocumentenadministratie wordt bijgehouden in het reisdocumentenstation, voor
      zover het de daarin overeenkomstig de [artikelen 53][ref1], [54][ref2] en [68][ref3] opgenomen gegevens betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0012810#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0012810#Artikel68
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '53'
        hoofdstuk: III
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0012810
        artikel: '54'
        hoofdstuk: III
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0012810
        artikel: '68'
        hoofdstuk: V
  - number: '82.3'
    text: |-
      De overige gegevens met betrekking tot de aanvraag, verstrekking en uitreiking worden als afzonderlijke documenten
      in de reisdocumentenadministratie opgenomen op een wijze die raadpleging in samenhang met de in het tweede lid
      bedoelde gegevens mogelijk maakt.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel82
  - number: '82.4'
    text: |-
      De in de reisdocumentenadministratie opgenomen gegevens, met uitzondering van de gegevens, bedoeld in
      [artikel 3, negende lid, van de wet][ref1] worden na de datum van verstrekking bewaard gedurende een periode van:


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel3
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '3'
  - number: 82.4.a
    text: |-
      11 jaar indien de geldigheidsduur van het verstrekte document 5 jaar of korter is, of indien het verstrekte
      document niet wordt uitgereikt;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel82
  - number: 82.4.b
    text: 16 jaar indien de geldigheidsduur van het verstrekte document langer dan 5 jaar is.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel82
  - number: '83.1'
    text: |-
      In afwijking van het bepaalde in [artikel 82][ref1] wordt op een post waar geen reisdocumentenstation aanwezig is
      van elk verstrekt laissez-passer het originele aanvraag-informatieformulier, voorzien van de foto van de houder,
      met de bij de aanvraag overgelegde bewijsstukken en verklaringen als bijlagen in een administratie opgeborgen, die
      jaarlijks wordt afgesloten. De formulieren worden daarbij alfabetisch op de naam van de houder gerangschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel82
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '82'
        hoofdstuk: IX
  - number: '83.2'
    text: |-
      Van elk verstrekt laissez-passer wordt een kopie van het aanvraag-informatieformulier in de in [artikel 98][ref1]
      bedoelde nummeradministratie opgeborgen. De kopie-formulieren worden daarbij op het documentnummer van het
      verstrekte laissez-passer gerangschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel98
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '98'
        hoofdstuk: X
        paragraaf: '4'
  - number: '83.3'
    text: |-
      De administratie, bedoeld in het eerste lid, blijft gedurende twee jaren na afloop van het kalenderjaar waarin het
      laissez-passer is verstrekt, raadpleegbaar.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel83
  - number: '85'
    text: |-
      Onverminderd het bepaalde in [artikel 3, negende lid, van de wet][ref1], wordt de verstrekking van gegevens uit de
      in de [artikelen 82][ref2] en [83][ref3] bedoelde reisdocumentenadministratie uitsluitend toegestaan aan:


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012810#Artikel82
      [ref3]: https://wetten.overheid.nl/BWBR0012810#Artikel83
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0012810
        artikel: '82'
        hoofdstuk: IX
      - id: ref3
        bwb_id: BWBR0012810
        artikel: '83'
        hoofdstuk: IX
  - number: 85.a
    text: |-
      degenen die bij of krachtens [de wet][ref1] belast zijn met de uitvoering daarvan, voor zover die gegevens
      noodzakelijk zijn voor het verrichten van werkzaamheden met betrekking tot reisdocumenten;


      [ref1]: https://wetten.overheid.nl/BWBR0005212
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0005212
  - number: 85.b
    text: |-
      de ambtenaren, werkzaam bij het ministerie van Buitenlandse Zaken, een Nederlandse consulaire vertegenwoordiging in
      het buitenland onderscheidenlijk het Kabinet van de Gouverneur van Aruba, Curaçao of Sint Maarten, voor zover die
      gegevens noodzakelijk zijn voor consulaire handelingen waarbij de identiteit van de betrokken persoon moet worden
      vastgesteld;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel85
  - number: 85.c
    text: |-
      de opsporingsambtenaren bedoeld in [artikel 141][ref1] en [142 van het Wetboek van Strafvordering][ref2] en
      [artikel 184][ref3] en [185 van het Wetboek van Strafvordering BES][ref4], voor zover die gegevens noodzakelijk
      zijn voor de opsporing van strafbare feiten in het kader van het onderzoek waarbij zij zijn betrokken of voor zover
      die noodzakelijk zijn voor de identificatie van slachtoffers;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel142
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel184
      [ref4]: https://wetten.overheid.nl/BWBR0028681#Artikel185
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '142'
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '184'
      - id: ref4
        bwb_id: BWBR0028681
        artikel: '185'
  - number: 85.d
    text: |-
      de ambtenaren van het openbaar ministerie, voor zover die gegevens noodzakelijk zijn voor de uitoefening van de hun
      opgedragen werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel85
  - number: 85.e
    text: |-
      de ambtenaren werkzaam bij de autoriteiten, bedoeld in de [artikelen 18 tot en met 24 van de wet][ref1],
      voor zover die gegevens noodzakelijk zijn voor het verzoek tot weigering of vervallenverklaring en de
      daarmee verband houdende vermelding van deze gegevens in het register paspoortsignaleringen als bedoeld in
      [artikel 25, derde lid, van de wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel25
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0005212
        artikel: '25'
  - number: 85.f
    text: |-
      de ambtenaren werkzaam bij het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties, voor zover die
      gegevens noodzakelijk zijn voor de hun opgedragen werkzaamheden in verband met de verwerking van gegevens in
      het register vermiste of vervallen reisdocumenten, in verband met de uitoefening van hun taak als bedoeld in
      [artikel 58 van de wet][ref1], alsmede in verband met onderzoek naar onregelmatigheden met reisdocumenten;


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel58
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '58'
  - number: 85.g
    text: |-
      degene die in opdracht van de Minister van Buitenlandse Zaken belast is met de controle op de uitvoering van de
      bij of krachtens [de wet][ref1] gestelde regels, de toepassing van de beveiligingsmaatregelen of de werking van het
      aanvraagsysteem reisdocumenten, voor zover die gegevens, de rechtstreekse toegang daaronder begrepen, noodzakelijk
      zijn voor de hun opgedragen werkzaamheden;


      [ref1]: https://wetten.overheid.nl/BWBR0005212
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0005212
  - number: 85.h
    text: |-
      de houder, beheerder, bewerker en degene die belast is met de invoer, wijziging, of verwijdering van gegevens, voor
      zover die gegevens, de rechtstreekse toegang daaronder begrepen, noodzakelijk zijn voor de uitoefening van de hun
      in verband daarmee opgedragen werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel85
  - number: 85.i
    text: |-
      de ambtenaren werkzaam bij de Algemene Inlichtingen- en Veiligheidsdienst en de
      Militaire Inlichtingen- en veiligheidsdienst, voor zover die gegevens noodzakelijk
      zijn voor de uitvoering van hun taken als bedoeld in [artikel 8, tweede lid][ref1], en
      [artikel 10, tweede lid, van de Wet op de inlichtingen- en veiligheidsdiensten 2017][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel10
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '10'
  - number: '86.1'
    text: |-
      De Minister van Buitenlandse Zaken of de door hem daartoe aangewezen ambtenaar wijst de personen aan die bevoegd
      zijn tot het verrichten van de handelingen die bij of krachtens [de wet][ref1] zijn voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0005212
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0005212
  - number: '86.2'
    text: |-
      De in het eerste lid bedoelde aanwijzing van personen, alsmede de registratie van hun bevoegdheden geschiedt
      met inachtneming van de functionele beschrijvingen met betrekking tot het aanvraagsysteem reisdocumenten en
      overeenkomstig de beveiligingsprocedure, bedoeld in [artikel 107][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel107
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '107'
        hoofdstuk: XI
  - number: '87.1'
    text: |-
      De Minister van Buitenlandse Zaken onderscheidenlijk een door deze aangewezen ambtenaar wijst per
      uitgiftelocatie tenminste twee personen aan die binnen het aanvraagsysteem reisdocumenten zullen functioneren als
      autorisatiebevoegde reisdocumentenstation overeenkomstig de gebruikershandleiding bij het reisdocumentenstation,
      bedoeld in [artikel 101][ref1]. Tevens wijst de minister onderscheidenlijk een door deze aangewezen ambtenaar per
      aanvraagstationlocatie tenminste twee personen aan die zullen functioneren als autorisatiebevoegde aanvraagstation
      overeenkomstig de gebruikershandleiding bij het aanvraagstation, bedoeld in artikel 101.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel101
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '101'
        hoofdstuk: X
        paragraaf: '5'
  - number: '87.2'
    text: |-
      De Minister van Buitenlandse Zaken draagt er zorg voor, dat een autorisatiebevoegde in staat wordt gesteld alle
      handelingen te verrichten die uit zijn taak voortvloeien.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel87
  - number: '87.3'
    text: De autorisatiebevoegden zijn rechtstreeks verantwoording verschuldigd aan de Minister van Buitenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel87
  - number: '88.1'
    text: |-
      Per reisdocumentenstation worden ten minste 2 en ten hoogste 65 identificatiekaarten beschikbaar gesteld aan de
      autorisatiebevoegde reisdocumentenstation.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel88
  - number: '88.2'
    text: |-
      De autorisatiebevoegde reisdocumentenstation is, met inachtneming van de gebruikershandleiding bij het
      reisdocumentenstation, bedoeld in [artikel 101][ref1], verantwoordelijk voor het autorisatiebeheer, de bewaring
      van de identificatiekaarten en de registratie van de personen aan wie hij in een bepaald tijdvak een kaart
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel101
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '101'
        hoofdstuk: X
        paragraaf: '5'
  - number: '88.3'
    text: |-
      De autorisatiebevoegde reisdocumentenstation registreert in het reisdocumentenstation met inachtneming van de
      gebruikershandleiding de intrekking van identificatiekaarten indien deze na verlies, diefstal of defect verloren
      zijn gegaan of onbruikbaar zijn geworden of anderszins niet langer gebruikt mogen worden. De autorisatiebevoegde
      draagt zorg voor de vernietiging van ingetrokken identificatiekaarten voor zover deze in zijn bezit zijn en geen
      nader onderzoek daaraan hoeft plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel88
  - number: '88.4'
    text: De leverancier houdt een registratie bij van de uitgegeven en ingetrokken identificatiekaarten.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel88
  - number: 88a.1
    text: |-
      Per aanvraagstationlocatie worden door de leverancier twee opstartkaarten verstrekt, waarmee het aanvraagstation in
      werking kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel88a
  - number: 88a.2
    text: |-
      De autorisatiebevoegde aanvraagstation is, met inachtneming van de gebruikershandleiding bij het aanvraagstation,
      bedoeld in [artikel 101][ref1], verantwoordelijk voor de bewaring en het gebruik van de opstartkaart.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel101
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel88a
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '101'
        hoofdstuk: X
        paragraaf: '5'
  - number: 88a.3
    text: Bij defect of verlies van een opstartkaart wordt terstond contact opgenomen met de leverancier.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel88a
  - number: 88a.4
    text: Een defecte opstartkaart wordt terstond aan de leverancier toegestuurd.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel88a
  - number: 88a.5
    text: |-
      De leverancier houdt een registratie bij van de uitgegeven opstartkaarten. Tevens registreert hij welke
      opstartkaarten vermist zijn.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel88a
  - number: 88b.1
    text: |-
      De Minister van Buitenlandse Zaken of de door hem daartoe aangewezen ambtenaar wijst per uitgiftelocatie de
      personen aan die aanvragen in behandeling mogen nemen met behulp van het mobiel vingerafdrukopname-apparaat
      overeenkomstig de gebruikershandleiding bij het mobiel vingerafdrukopname-apparaat, bedoeld in [artikel 101][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel101
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel88b
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '101'
        hoofdstuk: X
        paragraaf: '5'
  - number: 88b.2
    text: |-
      De leverancier verstrekt aan de autorisatiebevoegde aanvraagstation een wachtwoord waarmee toegang tot het mobiel
      vingerafdrukopname-apparaat kan worden verkregen en een authenticatiekaart waarmee het mobiel vingerafdrukopname-
      apparaat in het locale netwerk van de uitgiftelocatie kan worden aangesloten.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel88b
  - number: 88b.3
    text: |-
      De autorisatiebevoegde aanvraagstation brengt het wachtwoord uitsluitend ter kennis aan de aangewezen personen
      bedoeld in het eerste lid en ziet er op toe dat het wachtwoord te allen tijde gescheiden van het mobiel
      vingerafdrukopname-apparaat wordt bewaard. Alle betrokkenen nemen alle daartoe noodzakelijke maatregelen om te
      voorkomen dat het wachtwoord bekend wordt. Indien het wachtwoord is zoekgeraakt of ter kennis is gekomen van een
      onbevoegde wordt terstond contact opgenomen met de leverancier.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel88b
  - number: 88b.4
    text: |-
      [Artikel 88a, tweede tot en met vijfde lid][ref1], is van overeenkomstige toepassing op de verstrekte
      authenticatiekaart.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel88a
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel88b
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: 88a
        hoofdstuk: X
        paragraaf: '1'
  - number: '89.1'
    text: |-
      De Minister van Buitenlandse Zaken of de door hem daartoe aangewezen ambtenaar wijst op zijn ministerie ten
      minste drie personen aan om zendingen van gepersonaliseerde documenten in ontvangst te nemen. Identificatiekaarten
      en daarop betrekking hebbende codes worden uitsluitend in ontvangst genomen door een autorisatiebevoegde
      reisdocumentenstation.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel89
  - number: '89.2'
    text: |-
      De aanmelding, registratie en vervanging van de tot ontvangst bevoegde personen, bedoeld in de eerste zin van
      het eerste lid, vindt plaats bij de distributeur met gebruikmaking van de door de Minister van Buitenlandse Zaken
      daartoe beschikbaar gestelde machtiging tot ontvangstneming.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel89
  - number: '89.3'
    text: |-
      De machtiging wordt gewaarmerkt met een afdruk van een dienststempel als bedoeld in
      [artikel 102, eerste lid][ref1], en de handtekening van de Minister van Buitenlandse Zaken of de door hem daartoe
      aangewezen persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel102
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '102'
        hoofdstuk: X
        paragraaf: '5'
  - number: '89.4'
    text: Een kopie van het in het derde lid genoemde formulier wordt op het ministerie bewaard.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel89
  - number: '90.1'
    text: |-
      De Minister van Buitenlandse Zaken houdt een administratie bij van de parafen van de personen die tot parafering
      van aanvraagformulieren bevoegd zijn.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel90
  - number: '90.2'
    text: |-
      Een paraaf als bedoeld in het eerste lid wordt in ieder geval net zo lang bewaard als de aanvragen waarin een
      paraaf van de desbetreffende persoon is opgenomen.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel90
  - number: '91.1'
    text: |-
      De Minister van Buitenlandse Zaken of de door hem daartoe aangewezen ambtenaar meldt met gebruikmaking van
      het daartoe door de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde formulier
      aan de Minister van Binnenlandse Zaken en Koninkrijksrelaties de aanvraagstationlocaties waar één of meerdere
      aanvraagstations zijn geplaatst alsmede de uitgiftelocatie waar de verzending van de aanvragen naar de leverancier
      geschiedt, alsmede de locatie in Nederland waar de aflevering van de zendingen door de distributeur plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel91
  - number: '91.2'
    text: |-
      Wijzigingen met betrekking tot aanvraagstationlocaties en uitgiftelocaties worden, met gebruikmaking van het
      daartoe door de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde formulier, tijdig
      gemeld aan de Minister van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel91
  - number: '91.3'
    text: |-
      De Minister van Binnenlandse Zaken en Koninkrijksrelaties houdt een registratie bij van de ingevolge het eerste en
      tweede lid aangemelde aanvraagstationlocaties en uitgiftelocaties en geeft deze gegevens door aan de leverancier.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel91
  - number: '91.4'
    text: |-
      De leverancier wijst aan elke uitgiftelocatie een unieke locatiecode toe en meldt deze terug aan de Minister van
      Binnenlandse Zaken en Koninkrijksrelaties en aan de Minister van Buitenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel91
  - number: '92'
    text: De vastlegging van de tijdstippen waarop een zending wordt afgeleverd, geschiedt in overleg met de distributeur.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel92
  - number: '93.1'
    text: |-
      De geleverde gepersonaliseerde reisdocumenten worden bij het ministerie van Buitenlandse Zaken, in een daartoe
      bestemde ruimte, bewaard op de in [artikel 105][ref1] voorgeschreven wijze tot het tijdstip, dat zij door
      de bevoegde afdeling beschikbaar worden gesteld aan de bij het ministerie tot uitreiking bevoegde personen
      of doorgezonden aan de daartoe bestemde locatie, dan wel worden opgehaald door de leverancier ingevolge
      [artikel 60][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel105
      [ref2]: https://wetten.overheid.nl/BWBR0012810#Artikel60
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '105'
        hoofdstuk: XI
      - id: ref2
        bwb_id: BWBR0012810
        artikel: '60'
        hoofdstuk: IV
  - number: '93.2'
    text: |-
      De ingevolge het eerste lid beschikbaar gestelde of doorgezonden reisdocumenten worden, bij de desbetreffende
      afdeling op het ministerie of op de desbetreffende locatie in het buitenland, bewaard op de in [artikel 105][ref1]
      voorgeschreven wijze tot het tijdstip, dat zij door de daartoe bevoegde persoon worden uitgereikt, dan wel worden
      geretourneerd aan de in het eerste lid bedoelde afdeling om te worden teruggestuurd aan de leverancier ingevolge
      [artikel 63][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel105
      [ref2]: https://wetten.overheid.nl/BWBR0012810#Artikel63
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '105'
        hoofdstuk: XI
      - id: ref2
        bwb_id: BWBR0012810
        artikel: '63'
        hoofdstuk: IV
  - number: '93.3'
    text: |-
      Aan de hand van de gegevens in het reisdocumentenstation wordt bij de desbetreffende afdeling op het
      ministerie of op de desbetreffende locatie in het buitenland nagegaan welke gepersonaliseerde reisdocumenten
      binnen drie maanden na de datum van ontvangst nog niet zijn uitgereikt, teneinde deze ingevolge
      [artikel 42, vierde lid, van de wet][ref1] definitief aan het verkeer te onttrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel42
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '42'
  - number: '94.1'
    text: |-
      Indien op enig moment een gepersonaliseerd reisdocument na aflevering en registratie daarvan in het
      reisdocumentenstation blijkt te ontbreken, wordt terstond een inventarisatie opgemaakt van de nog aanwezige
      reisdocumenten aan de hand van de gegevens in het reisdocumentenstation.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel94
  - number: '94.2'
    text: De ontbrekende reisdocumenten worden geregistreerd in het reisdocumentenstation.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel94
  - number: '94.3'
    text: Artikel 62 is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel94
  - number: '95.1'
    text: |-
      De Minister van Buitenlandse Zaken of de door hem daartoe aangewezen ambtenaar wijst op zijn ministerie ten
      minste drie personen aan om namens hem bestellingen te doen van blanco noodpaspoorten en laissez-passer's bij de
      leverancier en tevens drie personen om leveringen daarvan in ontvangst te nemen.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel95
  - number: '95.2'
    text: |-
      De aanmelding van de tot bestelling en van de tot ontvangst bevoegde personen, bedoeld in het eerste lid, alsmede
      wijzigingen in deze gegevens, vindt plaats bij de Minister van Binnenlandse Zaken en Koninkrijksrelaties, met
      gebruikmaking van de daartoe door de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde
      formulieren.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel95
  - number: '95.3'
    text: |-
      Het ingevulde registratieformulier wordt gewaarmerkt met een afdruk van een dienststempel als bedoeld in
      [artikel 102, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel102
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '102'
        hoofdstuk: X
        paragraaf: '5'
  - number: '95.4'
    text: |-
      De Minister van Binnenlandse Zaken en Koninkrijksrelaties houdt een registratie bij van de ingevolge het eerste lid
      aangemelde personen en geeft deze gegevens door aan de leverancier.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel95
  - number: '96.1'
    text: |-
      De nooddocumenten worden met gebruikmaking van het daartoe door de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties beschikbaar gestelde formulier door de daartoe aangewezen persoon maximaal vier maal binnen
      een jaar bij de leverancier besteld. De bestelopdracht wordt gesteld op briefpapier van het ministerie van
      Buitenlandse Zaken en, na ondertekening van de daartoe aangewezen persoon, gewaarmerkt met een afdruk van het in
      [artikel 102, eerste lid][ref1], bedoelde dienststempel.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel102
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '102'
        hoofdstuk: X
        paragraaf: '5'
  - number: '96.2'
    text: |-
      Het aantal blanco noodpaspoorten en laissez-passer's dat binnen een jaar kan worden besteld, wordt bepaald door
      de leverancier en is gebaseerd op het jaarlijkse aantal verstrekte documenten, in de periode tussen 1 oktober en
      30 september, vermeerderd met vijf procent. De leverancier maakt jaarlijks voor 1 november het aantal te bestellen
      nooddocumenten voor het daaropvolgende jaar bekend aan de Minister van Buitenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel96
  - number: '96.3'
    text: |-
      Indien tussen twee bestellingen blijkt dat de voorraad noodpaspoorten dan wel laissez-passer's ontoereikend zal
      zijn, kan een opdracht voor een spoedbestelling worden geplaatst. De opdracht voor een spoedbestelling kan slechts
      worden gedaan, nadat in overleg met de leverancier is vastgesteld dat het aflevertijdstip van de eerstvolgende
      bestelopdracht niet kan worden vervroegd. De omvang van de spoedbestelling is niet groter dan noodzakelijk om de
      periode tot de levering van de eerstvolgende bestelling te overbruggen.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel96
  - number: '96.4'
    text: |-
      Alvorens een bestelopdracht te plaatsen, wordt nagegaan of de in [artikel 95][ref1] bedoelde gegevens nog juist
      zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel95
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '95'
        hoofdstuk: X
        paragraaf: '4'
  - number: '96.5'
    text: |-
      Indien gegevens zijn gewijzigd, dient het nieuwe registratieformulier minstens vijf werkdagen voor het plaatsen van
      een nieuwe bestelopdracht in het bezit van de Minister van Binnenlandse Zaken en Koninkrijksrelaties te zijn.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel96
  - number: '96.6'
    text: |-
      De bestelling wordt door de leverancier bevestigd door toezending van een leveringsbevestiging aan de Minister van
      Buitenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel96
  - number: '96.7'
    text: |-
      De daadwerkelijke aflevering vindt gemiddeld maximaal vijf werkdagen na de op de leveringsbevestigingen vermelde
      dagtekening plaats door een waardetransporteur.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel96
  - number: '96.8'
    text: |-
      Bij aflevering door de leverancier ondertekent de tot ontvangst bevoegde persoon, bedoeld in
      [artikel 95, eerste lid][ref1], de strook die aan de leveringsbevestiging is gehecht.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel95
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '95'
        hoofdstuk: X
        paragraaf: '4'
  - number: '96.9'
    text: |-
      De tot ontvangst bevoegde persoon legitimeert zich, op verzoek van de waardetransporteur, met een
      identiteitsdocument als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1] of met een Nederlands
      rijbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '96.10'
    text: |-
      De aflevering van de zending vindt plaats in de kluisruimte. Indien aflevering in de kluisruimte niet mogelijk
      of niet doelmatig is, vindt aflevering plaats in een voor het publiek afgesloten ruimte zo dicht mogelijk bij de
      kluis.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel96
  - number: '96.11'
    text: |-
      De tot ontvangst bevoegde persoon controleert in het bijzijn van de waardetransporteur aan de hand van de
      leveringsbevestiging het aantal pakketten alsmede de verzegeling. Indien de zending niet voor het ministerie van
      Buitenlandse Zaken bestemd is, afwijkingen vertoont, beschadigd is dan wel documenten ontbreken, wordt hiervan
      aantekening gemaakt op de aan de leveringsbevestiging gehechte strook en de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties hiervan terstond in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel96
  - number: '96.12'
    text: De ingevulde en ondertekende strook wordt aan de waardetransporteur overhandigd.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel96
  - number: '96.13'
    text: |-
      Indien de persoon die de zending in ontvangst neemt zich desgevraagd niet of niet voldoende kan legitimeren dan wel
      onvoldoende zekerheid bestaat met betrekking tot zijn bevoegdheid om de zending in ontvangst te nemen, dan wel om
      enige andere reden door een handelen of nalaten van het ministerie van Buitenlandse Zaken een veilige aflevering
      niet mogelijk is, draagt de waardetransporteur de zending niet over.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel96
  - number: '97.1'
    text: |-
      Na ontvangst van de zending wordt deze terstond veilig gesteld. Indien de aflevering niet aan de kluis geschiedt,
      ziet de persoon die de zending in ontvangst heeft genomen erop toe, dat de zending terstond in de kluis wordt
      opgeslagen.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel97
  - number: '97.2'
    text: |-
      De bij de zending gevoegde ontvangstbevestiging wordt na vergelijking van de verpakkingseenheden van de zending
      met de opgave in de leveringsbevestiging binnen vijf werkdagen na aflevering van de zending, aan de leverancier
      geretourneerd.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel97
  - number: '97.3'
    text: |-
      De controle van de inhoud van de verpakkingseenheden als bedoeld in het tweede lid geschiedt door de tot ontvangst
      bevoegde persoon, en tenminste één andere persoon. Van de controle wordt een proces-verbaal opgemaakt, dat bij de
      in het vijfde lid bedoelde nummeradministratie wordt gearchiveerd.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel97
  - number: '97.4'
    text: |-
      Bij constatering van afwijkingen tussen de inhoud van de zending en de opgave in de leveringsbevestiging wordt
      terstond contact opgenomen met de leverancier. De geconstateerde afwijkingen worden schriftelijk medegedeeld aan de
      Minister van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel97
  - number: '97.5'
    text: |-
      De Minister van Buitenlandse Zaken houdt van de door hem ontvangen blanco nooddocumenten, uitgesplitst naar soort,
      een serienummeradministratie bij, waaruit aan de hand van de documentnummers te allen tijde dient te blijken welke
      documenten:
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel97
  - number: 97.5.a
    text: in de voorraad aanwezig zijn;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel97
  - number: 97.5.b
    text: aan de voorraad zijn toegevoegd;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel97
  - number: 97.5.c
    text: aan welke post beschikbaar zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel97
  - number: 97.5.d
    text: zijn gestolen, vermist of anderszins als onbruikbaar moeten worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel97
  - number: '97.6'
    text: |-
      De Minister van Buitenlandse Zaken verstrekt per kwartaal een opgave aan de leverancier van het voorraadverloop van
      de noodpaspoorten en laissez-passer's. Uit deze opgave blijkt tevens op welk tijdstip welke blanco nooddocumenten,
      uitgesplitst naar soort en onder vermelding van de documentnummers, naar welke uitgiftelocatie zijn verzonden.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel97
  - number: '97.7'
    text: |-
      De Minister van Buitenlandse Zaken draagt zorg voor het op beveiligde wijze beschikbaar stellen van de blanco
      nooddocumenten aan de tot uitreiking daarvan bevoegde personen op het ministerie en de daartoe bestemde locatie in
      het buitenland.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel97
  - number: '98.1'
    text: |-
      De Minister van Buitenlandse Zaken houdt per locatie een voorraadadministratie bij van de beschikbaar gestelde
      nooddocumenten, uitgesplitst naar soort nooddocument.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel98
  - number: '98.2'
    text: |-
      Eén maal per jaar wordt het aantal in voorraad zijnde blanco nooddocumenten met vermelding van soort en
      documentnummer vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel98
  - number: '98.3'
    text: 'Uit de voorraadadministratie dient te allen tijde te blijken hoeveel nooddocumenten:'
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel98
  - number: 98.3.a
    text: in de voorraad aanwezig zijn;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel98
  - number: 98.3.b
    text: aan de voorraad zijn toegevoegd;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel98
  - number: 98.3.c
    text: aan de voorraad zijn onttrokken in verband met uitreiking;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel98
  - number: 98.3.d
    text: zijn verschreven, gestolen, vermist of anderszins als onbruikbaar moeten worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel98
  - number: '98.4'
    text: |-
      Met betrekking tot de uitgereikte nooddocumenten wordt per opeenvolgend documentnummer apart geregistreerd aan wie
      uitreiking van het desbetreffende nooddocument heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel98
  - number: '98.5'
    text: |-
      Op de locaties waar een reisdocumentenstation aanwezig is, wordt de in het derde en vierde lid bedoelde
      voorraadadministratie bijgehouden in het desbetreffende reisdocumentenstation.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel98
  - number: '98.6'
    text: |-
      Indien vanaf een locatie, als bedoeld in het vijfde lid, laissez-passer’s beschikbaar worden gesteld ten
      behoeve van de uitgifte daarvan op een andere uitgiftelocatie, wordt de laissez-passer’s en de desbetreffende
      uitgiftelocatie in het reisdocumentenstation vermeld.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel98
  - number: '99.1'
    text: |-
      Indien op enig moment een omissie in de voorraad of in de administratie wordt geconstateerd, maken minimaal twee
      daartoe door de Minister van Buitenlandse Zaken aangewezen personen terstond een inventarisatie op van de aanwezige
      nooddocumenten.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel99
  - number: '99.2'
    text: |-
      Van de inventarisatie wordt een proces-verbaal opgemaakt, dat naar de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties wordt gezonden.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel99
  - number: '100.1'
    text: De blanco nooddocumenten worden in volgorde van de nummers verbruikt.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel100
  - number: '100.2'
    text: Nooddocumenten worden uitsluitend uitgegeven en verbruikt op de locatie waaraan deze ter beschikking zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel100
  - number: '101'
    text: |-
      De Minister van Buitenlandse Zaken maakt binnen het aanvraagsysteem reisdocumenten gebruik van het
      reisdocumentenstation, het aanvraagstation, het mobiel vingerafdrukopname-apparaat en de overige materialen,
      overeenkomstig het bepaalde in deze regeling en met inachtneming van de bijgeleverde gebruikershandleidingen.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel101
  - number: '102'
    text: |-
      De dienststempel is een stempel die voorzien is van het Rijkswapen dan wel het wapen van de tot verstrekking
      bevoegde autoriteit.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel102
  - number: '103.1'
    text: |-
      De in [artikel 51][ref1] bedoelde foto- en handtekeningformulieren worden vier maal binnen een jaar door de
      leverancier beschikbaar gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel51
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '51'
        hoofdstuk: III
        paragraaf: '3'
  - number: '103.2'
    text: |-
      Het aantal foto- en handtekeningformulieren dat jaarlijks beschikbaar wordt gesteld, wordt bepaald en bekendgemaakt
      door de leverancier op de in [artikel 96, tweede lid][ref1], aangegeven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel96
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '96'
        hoofdstuk: X
        paragraaf: '4'
  - number: '103.3'
    text: |-
      Indien tussen twee aflevertijdstippen blijkt dat de voorraad foto- en handtekeningformulieren ontoereikend zal
      zijn, kan een spoedbestelling worden gedaan. De opdracht voor een spoedbestelling kan echter slechts worden gedaan,
      nadat in overleg met de leverancier is vastgesteld dat het reguliere aflevertijdstip niet kan worden vervroegd. De
      omvang van de spoedbestelling is niet groter dan noodzakelijk om de periode tot het eerstvolgende aflevertijdstip
      te overbruggen.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel103
  - number: '103.4'
    text: |-
      De foto- en handtekeningformulieren worden door de leverancier binnen tien werkdagen na de spoedbestelling geleverd
      op de uitgiftelocatie waarvoor de bestelling is gedaan.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel103
  - number: '103.5'
    text: |-
      De overige standaardformulieren worden eenmalig door de leverancier ter beschikking gesteld en kunnen desgewenst
      worden nabesteld.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel103
  - number: '103.6'
    text: De foto- en handtekeningformulieren en andere standaardformulieren worden kosteloos verstrekt.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel103
  - number: '104'
    text: |-
      De met de uitvoering van de wet belaste autoriteiten treffen maatregelen om de onder hen berustende reisdocumenten,
      apparatuur, programmatuur, opslagmedia, documentatie en overige materialen te beveiligen tegen ontvreemding dan wel
      vernietiging ten gevolge van inbraak, diefstal, verduistering, overvallen, brand of anderszins.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel104
  - number: 104a
    text: |-
      De voorschriften voor de technische en organisatorische voorzieningen die noodzakelijk zijn voor de vervaardiging
      van het publiek identificatiemiddel zijn:
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel104a
  - number: 104a.a
    text: de Baseline Informatiebeveiliging Overheid; en
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel104a
  - number: 104a.b
    text: de Voorschriften Informatiebeveiliging Rijksdienst.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel104a
  - number: '105.1'
    text: |-
      Buiten de werkuren worden de van de leverancier ontvangen reisdocumenten, de ingehouden reisdocumenten, de
      opslagmedia, de documentatie en de overige materialen opgeslagen in een inbraakvertragende en brandwerende
      voorziening, zoals een gesloten inbraakwerende waardekast of kluis, die in passende verhouding staat tot de waarde
      van de inhoud. Deze voorziening is in een af te sluiten ruimte geplaatst.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel105
  - number: '105.2'
    text: |-
      De plaatsen waar de reisdocumenten, de documentatie en de overige materialen zijn opgeslagen, alsmede de ruimte
      waarin de apparatuur en de programmatuur zich bevinden, zijn uitgerust met een inbraakalarmeringssysteem.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel105
  - number: '105.3'
    text: |-
      De apparatuur en programmatuur, alsmede de tijdens de werkuren uit te reiken of ingehouden reisdocumenten, en de
      te gebruiken documentatie en overige materialen bevinden zich, onder voortdurend toezicht, op een voor onbevoegden
      onbereikbare en afsluitbare plaats.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel105
  - number: '105.4'
    text: |-
      In afwijking van het eerste lid blijft de authenticatiekaart ook tijdens de werkuren opgeslagen in de voorziening,
      bedoeld in het eerste lid. De authenticatiekaart mag zich uitsluitend buiten de desbetreffende voorziening
      bevinden op het moment dat deze nodig is om het mobiel vingerafdrukopname-apparaat in het locale netwerk van de
      uitgiftelocatie aan te sluiten.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel105
  - number: '105.5'
    text: |-
      In afwijking van het tweede en derde lid, staat een aanvraagstation of een mobiel vingerafdrukopname-apparaat
      gedurende de werkuren onder voortdurend toezicht van degene die bevoegd is tot het gebruik ervan en bevindt het
      zich buiten de werkuren in een voor onbevoegden onbereikbare, afsluitbare en bij voorkeur beveiligde ruimte.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel105
  - number: '106.1'
    text: |-
      Van de in de reisdocumentenmodule en de in het reisdocumentenstation opgeslagen gegevens wordt dagelijks een
      reservekopie gemaakt. Voor het reisdocumentenstation wordt daartoe gebruik gemaakt van de door de Minister
      van Binnenlandse Zaken en Koninkrijksrelaties te verstrekken opslagmedia. Per reisdocumentenstation worden 5
      opslagmedia verstrekt. Na het maken van de reservekopie wordt gecontroleerd of deze is geslaagd.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel106
  - number: '106.2'
    text: |-
      De bewaring van de reservekopieën geschiedt zodanig, dat de twee oudste reservekopieën op de locatie van het
      reisdocumentenarchiefstation worden bewaard, terwijl de drie meest recente reservekopieën elders worden bewaard, in
      een vergelijkbare voorziening als bedoeld in [artikel 105, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel105
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '105'
        hoofdstuk: XI
  - number: '106.3'
    text: |-
      De Minister van Buitenlandse Zaken beschikt per locatie over een op schrift gestelde procedure inzake back-up en
      herstel, die er in voorziet dat reconstructie van de gegevens mogelijk is.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel106
  - number: '107.1'
    text: |-
      De Minister van Buitenlandse Zaken beschikt per locatie over een op schrift gestelde beveiligingsprocedure. In deze
      beveiligingsprocedure worden in ieder geval maatregelen vastgelegd inzake:
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel107
  - number: 107.1.a
    text: |-
      de ontvangst, het transport, de bewaring en het beheer van de ontvangen reisdocumenten, de ingehouden
      reisdocumenten, de apparatuur, de programmatuur, de documentatie en de overige materialen;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel107
  - number: 107.1.b
    text: de verantwoordelijkheden van de beveiligingsfunctionaris als bedoeld in het derde lid;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel107
  - number: 107.1.c
    text: de functiescheiding tussen de bij het beheer en de uitreiking van de reisdocumenten betrokken functionarissen;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel107
  - number: 107.1.d
    text: |-
      de beveiliging van het aanvraagsysteem reisdocumenten, onder meer gericht op het voorkomen van onbevoegde toegang
      of gebruik van gegevens die in het systeem of tot het systeem behorende opslagmedia zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel107
  - number: '107.3'
    text: |-
      De Minister van Buitenlandse Zaken wijst per locatie een beveiligingsfunctionaris aan die belast is met het beheer
      van en het toezicht op de naleving van de beveiligingsprocedure.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel107
  - number: '107.5'
    text: |-
      De functie van beveiligingsfunctionaris is niet verenigbaar met het verrichten van andere handelingen ter
      uitvoering van de wet.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel107
  - number: '107.6'
    text: De taken en verantwoordelijkheden van de beveiligingsfunctionaris worden vastgelegd in een functieomschrijving.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel107
  - number: '107.7'
    text: |-
      De Minister van Buitenlandse Zaken draagt er zorg voor dat de beveiligingsfunctionaris in staat wordt gesteld alle
      handelingen te verrichten die uit zijn taak voortvloeien.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel107
  - number: '107.8'
    text: De beveiligingsfunctionaris is rechtstreeks verantwoording verschuldigd aan de Minister van Buitenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel107
  - number: '107.9'
    text: |-
      De maatregelen bedoeld in het eerste tot en met het achtste lid maken deel uit van de reguliere
      accountantscontrole.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel107
  - number: '107.10'
    text: |-
      De Minister van Buitenlandse Zaken draagt er zorg voor, dat de bij de uitvoering van de wet betrokken personen
      regelmatig worden geïnformeerd over ontvreemdingsrisico's en ten minste één maal per jaar worden geïnstrueerd met
      betrekking tot risicobeperkende afspraken en maatregelen terzake.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel107
  - number: '108.1'
    text: |-
      De Minister van Buitenlandse Zaken voert een keer per jaar een controle uit op de toepassing van de
      beveiligingsmaatregelen, genoemd in de artikelen 104 tot en met 107.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel108
  - number: '108.2'
    text: Indien de in het eerste lid bedoelde controle daartoe aanleiding geeft, wordt de beveiligingsprocedure aangepast.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel108
  - number: '109.1'
    text: |-
      In het geval van ontvreemding dan wel vernietiging van reisdocumenten, apparatuur, programmatuur, opslagmedia,
      documentatie en overige materialen ten gevolge van inbraak, diefstal, verduistering, overvallen, brand of
      anderszins dient de met de uitvoering van de wet belaste autoriteit daarvan terstond aangifte te doen bij de
      plaatselijke politie en tevens terstond de Minister van Binnenlandse Zaken en Koninkrijksrelaties daarvan in kennis
      te stellen.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel109
  - number: '109.2'
    text: |-
      De Minister van Buitenlandse Zaken zendt de Minister van Binnenlandse Zaken en Koninkrijksrelaties vervolgens
      binnen één werkdag een schriftelijke kennisgeving waarin de navolgende gegevens zijn opgenomen:
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel109
  - number: 109.2.a
    text: het tijdstip en de exacte toedracht van de ontvreemding of vernietiging;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel109
  - number: 109.2.b
    text: de nummers van de ontvreemde of vernietigde reisdocumenten, alsmede de daarin vermelde persoonsgegevens;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel109
  - number: 109.2.c
    text: |-
      de ontvreemde of vernietigde apparatuur, programmatuur, opslagmedia, documentatie en overige materialen met de
      eventueel daarop vermelde nummers.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel109
  - number: '109.3'
    text: |-
      Zodra het door de plaatselijke politie opgemaakte proces-verbaal beschikbaar is, wordt daarvan een afschrift
      gezonden aan de Minister van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel109
  - number: '110.1'
    text: |-
      De autoriteit die in verband met een handeling op grond van deze regeling enig Nederlands reis- of
      identiteitsdocument krijgt overgelegd, gaat aan de hand van de door de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties verstrekte lijst van toetsingspunten na of met het desbetreffende reisdocument enige
      onregelmatigheid is gepleegd.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel110
  - number: '110.2'
    text: |-
      De autoriteit die van mening is dat met het reisdocument onregelmatigheden zijn gepleegd die geen strafbare
      feiten opleveren, onttrekt dit document op de in [artikel 78, eerste lid][ref1], bedoelde wijze definitief aan
      het verkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel78
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '78'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '111.1'
    text: |-
      Indien het vermoeden bestaat dat de met het reisdocument gepleegde onregelmatigheden strafbare feiten opleveren,
      wordt het desbetreffende reisdocument per aangetekende post met gebruikmaking van het daartoe door de Minister van
      Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde formulier aan het Expertisecentrum Identiteitsfraude
      en Documenten van de Koninklijke Marechaussee gezonden.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel111
  - number: '111.2'
    text: |-
      De Commandant van het Expertisecentrum Identiteitsfraude en Documenten van de Koninklijke Marechaussee onttrekt
      het reisdocument bedoeld in het vorige lid definitief aan het verkeer door middel van vernietiging als bedoeld in
      [artikel 78, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel78
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '78'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '112.1'
    text: |-
      De Minister van Buitenlandse Zaken verstrekt, met gebruikmaking van het daartoe door de Minister van Binnenlandse
      Zaken en Koninkrijksrelaties beschikbaar gestelde formulier, per kwartaal een schriftelijke verantwoording van het
      totale voorraadverloop met betrekking tot nooddocumenten over het voorgaande kwartaal.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel112
  - number: '112.2'
    text: 'Deze verantwoording bevat, uitgesplitst naar noodpaspoorten en laissez-passer''s:'
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel112
  - number: 112.2.a
    text: de totale voorraad blanco nooddocumenten aan het begin van het kwartaal;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel112
  - number: 112.2.b
    text: de in de loop van het kwartaal aan de voorraad toegevoegde blanco nooddocumenten;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel112
  - number: 112.2.c
    text: de in de loop van het kwartaal aan de voorraad onttrokken nooddocumenten die zijn uitgereikt;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel112
  - number: 112.2.d
    text: |-
      de in de loop van het kwartaal aan de voorraad onttrokken nooddocumenten die niet zijn uitgereikt, omdat zij zijn
      verschreven, gestolen, vermist of anderszins als onbruikbaar moeten worden beschouwd;
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel112
  - number: 112.2.e
    text: de totale voorraad blanco nooddocumenten aan het einde van het kwartaal.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel112
  - number: '112.3'
    text: |-
      Nooddocumenten die onjuist blijken te zijn geproduceerd of beschadigd worden met het in het eerste lid bedoelde
      verantwoordingsformulier meegezonden aan de leverancier.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel112
  - number: '112.4'
    text: |-
      Nooddocumenten die als gevolg van verschrijvingen of anderszins onbruikbaar zijn geworden, worden definitief aan
      het verkeer onttrokken door ze deugdelijk te vernietigen op de in [artikel 78, eerste lid][ref1], aangegeven wijze.


