  - number: '112.5'
    text: |-
      Het in het eerste lid bedoelde verantwoordingsformulier wordt ondertekend door of namens de Minister van
      Buitenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel112
  - number: '113'
    text: |-
      De reisdocumenten die voor de inwerkingtreding van deze regeling zijn verstrekt, behouden de geldigheid die daarin
      is vermeld.
    url: https://wetten.overheid.nl/BWBR0012810/2026-04-01#Artikel113
