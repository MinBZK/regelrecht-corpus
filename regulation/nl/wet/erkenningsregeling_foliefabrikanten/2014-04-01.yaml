---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: erkenningsregeling_foliefabrikanten
regulatory_layer: WET
publication_date: '2025-10-28'
valid_from: '2014-04-01'
bwb_id: BWBR0011083
url: https://wetten.overheid.nl/BWBR0011083/2014-04-01
preamble:
  text: |-
    Gelet op de artikelen 40, derde lid, 70 a, derde lid, 70 b, tweede en zesde lid, 70 d, eerste en tweede lid, en 70
    e, derde lid, van de Wegenverkeerswet 1994;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0011083/2014-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0011083/2014-04-01#Artikel1
  - number: 1.a
    text: |-
      *erkenning:* erkenning als bedoeld in [artikel 70a, eerste lid, van de Wegenverkeerswet 1994][ref1] voor het
      produceren en afleveren van folie;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70a
    url: https://wetten.overheid.nl/BWBR0011083/2014-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 70a
  - number: 1.b
    text: |-
      *erkenninghouder:* houder van een erkenning als bedoeld in
      [artikel 70a, eerste lid, van de Wegenverkeerswet 1994][ref1] voor het produceren en afleveren van folie;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70a
    url: https://wetten.overheid.nl/BWBR0011083/2014-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 70a
  - number: 1.c
    text: |-
      *lamineerder:* houder van een erkenning als bedoeld in [artikel 70 a, eerste lid, van de wet][ref1] voor de
      productie en afgifte van blanco-kentekenplaten;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70a
    url: https://wetten.overheid.nl/BWBR0011083/2014-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 70a
  - number: 1.d
    text: '*blanco-kentekenplaat:* blanco-kentekenplaat, geschikt voor het produceren van een kentekenplaat;'
    url: https://wetten.overheid.nl/BWBR0011083/2014-04-01#Artikel1
  - number: 1.e
    text: '*folie:* folie, geschikt voor het produceren van:'
    url: https://wetten.overheid.nl/BWBR0011083/2014-04-01#Artikel1
  - number: 1.e.1°
    text: |-
      gele kentekenplaten volgens de modellen 1.1 tot en met 18.2E, 27.1A tot en met 27.2H, 27.10A tot en met 27.10E en
      30.1A tot en met 30.2D van de [bijlage bij de Regeling kentekens en kentekenplaten](onbekend);
    url: https://wetten.overheid.nl/BWBR0011083/2014-04-01#Artikel1
  - number: 1.e.2°
    text: |-
      lichtblauwe kentekenplaten volgens de modellen 18.2A tot en met 18.2E, 27.30A tot en met 27.31E en 30.3A tot en met
      30.4D van de [bijlage bij de Regeling kentekens en kentekenplaten](onbekend);
    url: https://wetten.overheid.nl/BWBR0011083/2014-04-01#Artikel1
  - number: 1.e.3°
    text: |-
      lichtgroene kentekenplaten volgens de modellen 27.11 tot en met 27.14, 30.5 en 30.6 van de [bijlage bij de Regeling
      kentekens en kentekenplaten](onbekend);
    url: https://wetten.overheid.nl/BWBR0011083/2014-04-01#Artikel1
  - number: 1.e.4°
    text: |-
      witte kentekenplaten volgens de modellen 27.15A tot en met 27.17E, 27.24A tot en met 27.26E, 30.7, 30.8 en 30.13
      tot en met 30.16 van de [bijlage bij de Regeling kentekens en kentekenplaten](onbekend);
    url: https://wetten.overheid.nl/BWBR0011083/2014-04-01#Artikel1
  - number: 1.f
    text: '*de Minister:* de Minister van Infrastructuur en Milieu;'
    url: https://wetten.overheid.nl/BWBR0011083/2014-04-01#Artikel1
  - number: 1.g
    text: |-
      *wet:* [Wegenverkeerswet 1994][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0011083/2014-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: '2'
    text: |-
      Een erkenning kan worden verleend aan een natuurlijk persoon of rechtspersoon die exploitant is van een
      productieplaats en die is gevestigd in de Europese Unie of in een staat die partij is bij het Verdrag inzake de
      Europese economische ruimte.
    url: https://wetten.overheid.nl/BWBR0011083/2014-04-01#Artikel2
  - number: '3'
    text: Voor de aanvraag van een erkenning wordt gebruik gemaakt van een door de Dienst Wegverkeer vastgesteld formulier.
    url: https://wetten.overheid.nl/BWBR0011083/2014-04-01#Artikel3
  - number: '4'
    text: 'De aanvrager van een erkenning legt bij de aanvraag de volgende bescheiden over:'
    url: https://wetten.overheid.nl/BWBR0011083/2014-04-01#Artikel4
  - number: 4.a
    text: |-
      een uittreksel uit het handelsregister als bedoeld in [artikel 22 van de Handelsregisterwet 2007][ref1], dan wel,
      bij vestiging buiten Nederland, een gelijkwaardig document afgegeven in het land van vestiging, waaruit blijkt dat
      de aanvrager folie fabriceert, welk bewijs niet ouder mag zijn dan een maand, en


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel22
    url: https://wetten.overheid.nl/BWBR0011083/2014-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '22'
  - number: 4.b
    text: |-
      een testrapport van een door de Dienst Wegverkeer aangewezen onderzoeksinstelling, waaruit blijkt, dat de aanvrager
      folie kan produceren, die geschikt is voor de productie van kentekenplaten die voldoen aan de eisen, gesteld in de
      [Regeling kentekens en kentekenplaten][ref1] en de [Regeling eisen goedkeuring kentekenplaten 2000][ref2]


      [ref1]: https://wetten.overheid.nl/BWBR0009071
      [ref2]: https://wetten.overheid.nl/BWBR0012172
    url: https://wetten.overheid.nl/BWBR0011083/2014-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009071
      - id: ref2
        bwb_id: BWBR0012172
  - number: '5.1'
    text: |-
      De erkenninghouder draagt zorg voor een zodanige behandelingvan de folie dat beschadiging of achteruitgang wordt
      voorkomen. De zorg strekt zich uit tot en met de aflevering van de folie op de plaats van bestemming.
    url: https://wetten.overheid.nl/BWBR0011083/2014-04-01#Artikel5
  - number: '5.2'
    text: |-
      In afwachting van aflevering maakt de erkenninghouder gebruik van aangewezen afsluitbare opslag- of voorraadruimten
      om beschadiging, diefstal of achteruitgang van de folie te voorkomen.
    url: https://wetten.overheid.nl/BWBR0011083/2014-04-01#Artikel5
  - number: '5.3'
    text: De erkenninghouder voorkomt onbedoeld gebruik van de folie.
    url: https://wetten.overheid.nl/BWBR0011083/2014-04-01#Artikel5
  - number: '6'
    text: |-
      De erkenninghouder verricht de productie van folie met inachtneming van de Regeling kentekens en kentekenplaten en
      de [Regeling eisen goedkeuring kentekenplaten 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012172
    url: https://wetten.overheid.nl/BWBR0011083/2014-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012172
  - number: '7'
    text: |-
      Alvorens de erkenninghouder overgaat tot aflevering van folie controleert hij of deze voldoet aan de in de Regeling
      kentekens en kentekenplaten en de [Regeling eisen goedkeuring kentekenplaten 2000][ref1] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0012172
    url: https://wetten.overheid.nl/BWBR0011083/2014-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0012172
  - number: '8.1'
    text: Folie wordt uitsluitend afgeleverd aan erkende lamineerders.
    url: https://wetten.overheid.nl/BWBR0011083/2014-04-01#Artikel8
  - number: '8.2'
    text: 'Bij de aflevering is de folie voorzien van een document, waarin in ieder geval zijn vermeld:'
    url: https://wetten.overheid.nl/BWBR0011083/2014-04-01#Artikel8
  - number: 8.2.a
    text: de hoeveelheid en de soort folie, onderverdeeld naar kleur en model;
    url: https://wetten.overheid.nl/BWBR0011083/2014-04-01#Artikel8
  - number: 8.2.b
    text: de datum van levering, en
    url: https://wetten.overheid.nl/BWBR0011083/2014-04-01#Artikel8
  - number: 8.2.c
    text: de naam en het adres van de afnemer.
    url: https://wetten.overheid.nl/BWBR0011083/2014-04-01#Artikel8
  - number: '8.3'
    text: Van het in het derde lid bedoelde document wordt gedurende twee jaren een afschrift bewaard.
    url: https://wetten.overheid.nl/BWBR0011083/2014-04-01#Artikel8
  - number: '8.4'
    text: |-
      Indien de lamineerder door hem afgekeurde folie retourneert aan de erkenninghouder, is deze verplicht desgevraagd
      een ontvangstbevestiging af te geven.
    url: https://wetten.overheid.nl/BWBR0011083/2014-04-01#Artikel8
  - number: '9'
    text: |-
      Op verzoek van de Dienst Wegverkeer legt de erkenninghouder een rapport over van een door de Dienst
      Wegverkeer aangewezen onderzoeksinstelling, waaruit blijkt dat een door de Dienst Wegverkeer bij een
      lamineerder geselecteerde, door de erkenninghouder geproduceerde, folie geschikt is voor de productie
      van kentekenplaten die voldoen aan de eisen, gesteld in de Regeling kentekens en kentekenplaten en de
      [Regeling eisen goedkeuring kentekenplaten 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012172
    url: https://wetten.overheid.nl/BWBR0011083/2014-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0012172
  - number: '10.1'
    text: |-
      Een op de dag vóór die van de inwerkingtreding van de Wet van 6 oktober 1999, houdende wijziging van de
      [Wegenverkeerswet 1994][ref1] met betrekking tot de afgifte en inname van kentekenplaten (Stb. 1999, 459) geldende
      goedkeuring of machtiging tot het aanbrengen van een waarmerk op folie en de daarop op die dag van toepassing
      zijnde voorschriften blijven tot 1 februari 2003 van kracht ten aanzien van folie bestemd voor kentekenplaten
      volgens de modellen 1.1 tot en met 26.1 van de bijlage bij de Regeling kentekens en kentekenplaten.


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0011083/2014-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: '10.2'
    text: |-
      Een goedkeuring of machtiging als bedoeld in het eerste lid vervalt met ingang van de dag waarop aan degene, aan
      wie de goedkeuring of machtiging is afgegeven, een erkenning wordt verleend.
    url: https://wetten.overheid.nl/BWBR0011083/2014-04-01#Artikel10
  - number: '11'
    text: |-
      Deze regeling treedt in werking met ingang van de dag waarop de Wet van 6 oktober 1999 houdende wijziging van de
      [Wegenverkeerswet 1994][ref1] met betrekking tot de afgifte en inname van kentekenplaten (Staatsblad 1999, 459) in
      werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0011083/2014-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: '12'
    text: 'Deze regeling wordt aangehaald als: Erkenningsregeling foliefabrikanten.'
    url: https://wetten.overheid.nl/BWBR0011083/2014-04-01#Artikel12
