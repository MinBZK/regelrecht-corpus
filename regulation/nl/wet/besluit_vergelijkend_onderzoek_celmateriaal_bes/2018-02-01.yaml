  - number: '11'
    text: |-
      Na opdracht van de rechter-commissaris tot een vergelijkend onderzoek zendt het politiekorps, bedoeld in
      [artikel 3, eerste lid][ref1], of de door Onze Minister in overeenstemming met Onze Minister van Volksgezondheid,
      Welzijn en Sport aangewezen rechtspersoon die tot taak heeft laboratoriumonderzoeken te verrichten ten behoeve
      van de volksgezondheid en justitie de te onderzoeken monsters, vergezeld van alle voor het vergelijkend onderzoek
      noodzakelijke gegevens, onverwijld en op de snelst mogelijke wijze naar het laboratorium waar het onderzoek zal
      worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0028458#Artikel3
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028458
        artikel: '3'
        hoofdstuk: '2'
  - number: '12.1'
    text: |-
      Het vergelijkend onderzoek wordt verricht in opdracht van de rechter-commissaris. Deze opdracht kan worden verleend
      aan een deskundige verbonden aan een bij ministeriële regeling aangewezen laboratorium. Bij ministeriële regeling
      kan een formulier worden vastgesteld voor het geven van de opdracht tot een vergelijkend onderzoek.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel12
  - number: '12.2'
    text: |-
      Een laboratorium als bedoeld in het eerste lid, dient te zijn gecertificeerd door een nationaal of internationaal
      erkende instantie voor de accreditatie van laboratoria. Het certificaat mag niet ouder zijn dan twee jaar.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel12
  - number: '13.1'
    text: |-
      Van de krachtens [artikel 11][ref1] ontvangen monsters houdt het laboratorium een registratie.


      [ref1]: https://wetten.overheid.nl/BWBR0028458#Artikel11
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028458
        artikel: '11'
        hoofdstuk: '4'
  - number: '13.2'
    text: 'Het laboratorium registreert:'
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel13
  - number: 13.2.a
    text: de datum van ontvangst van het monster;
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel13
  - number: 13.2.b
    text: |-
      de gegevens op het bij het monster horend identiteitszegel, alsmede of het monster sporen- dan wel
      referentiemateriaal bevat;
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel13
  - number: 13.2.c
    text: de uitkomst van een onderzoek naar de staat van het sluitzegel;
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel13
  - number: 13.2.d
    text: de naam en de standplaats van de rechter-commissaris die opdracht tot het vergelijkend onderzoek heeft verleend;
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel13
  - number: 13.2.e
    text: |-
      de datum van verzending van het verslag, bedoeld in [artikel 14, derde lid][ref1], en het bericht, bedoeld in
      [artikel 15, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0028458#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0028458#Artikel15
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel13
    references:
      - id: ref1
