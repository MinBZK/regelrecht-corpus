  - number: '1.1'
    text: |-
      In dit besluit wordt verstaan onder: - *het wetboek:* het [Wetboek van Strafvordering BES][ref1];
        - *Onze Minister:* Onze Minister van Justitie;
        - *vergelijkend onderzoek:* het onderzoek, bedoeld in [artikel 79, eerste lid, van het wetboek][ref2];
        - *tegenonderzoek:* het vergelijkend onderzoek, bedoeld in [artikel 79b, eerste lid, van het wetboek][ref3];
        - *referentie-materiaal:* celmateriaal waarvan bij de monsterneming bekend is van wie het afkomstig is;
        - *sporenmateriaal:* met het oog op het vergelijkend onderzoek verzameld celmateriaal, niet zijnde
      referentiemateriaal;
        - *bloedafname:* het afnemen van een hoeveelheid bloed ten behoeve van het vergelijkend onderzoek;
        - *afname van wangslijmvlies:* het afnemen van een hoeveelheid wangslijmvlies ten behoeve van het vergelijkend
      onderzoek;
        - *afname van haarwortels:* het afnemen van een hoeveelheid haarwortels ten behoeve van het vergelijkend onderzoek;
        - *opsporingsambtenaar:* een opsporingsambtenaar als bedoeld in [artikel 184 van het wetboek][ref4];
        - *profiel:* de gecodeerd weergegeven uitkomst van een onderzoek naar kenmerken van celmateriaal.


      [ref1]: https://wetten.overheid.nl/BWBR0028681
