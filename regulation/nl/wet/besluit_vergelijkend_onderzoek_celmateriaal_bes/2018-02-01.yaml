  - number: '14.1'
    text: |-
      Het vergelijkend onderzoek vindt niet plaats, dan nadat is onderzocht, of voldoende celmateriaal beschikbaar is
      voor een tegenonderzoek.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel14
  - number: '14.2'
    text: |-
      Het onderzoek, of voldoende celmateriaal beschikbaar is, wordt verricht door de deskundige, bedoeld in
      [artikel 12, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028458#Artikel12
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028458
        artikel: '12'
        hoofdstuk: '4'
  - number: '14.3'
    text: |-
      De rechter-commissaris die de opdracht tot het vergelijkend onderzoek heeft verleend, ontvangt een verslag van de
      uitkomst van het onderzoek, bedoeld in het tweede lid. In het verslag wordt vermeld, voor zover mogelijk, voor welk
      aantal malen celmateriaal voor vergelijkend onderzoek beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel14
  - number: '14.4'
    text: |-
      Indien onvoldoende celmateriaal beschikbaar is voor een tegenonderzoek, geeft de rechter-commissaris hiervan de
      verdachte, indien deze bekend is, zo spoedig mogelijk kennis.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel14
  - number: '15.1'
    text: |-
      De rechter-commissaris die de opdracht tot het vergelijkend onderzoek heeft verleend, ontvangt bericht wanneer dat
      onderzoek kan aanvangen en wanneer de uitslag daarvan kan zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel15
  - number: '15.2'
    text: |-
      Indien onvoldoende celmateriaal beschikbaar is voor een tegenonderzoek, ligt tussen de opdracht tot een
      vergelijkend onderzoek en de aanvang daarmee een tijdvak van tenminste eenentwintig dagen of zoveel minder als door
      de rechter-commissaris zal zijn bepaald.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel15
  - number: '15.3'
    text: Voor een vergelijkend onderzoek wordt zo min mogelijk celmateriaal gebruikt.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel15
  - number: '16.1'
    text: |-
      Het vergelijkend onderzoek wordt op zodanige wijze verricht, dat is gewaarborgd dat de uitkomsten van het onderzoek
      onderling vergelijkbaar zijn.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel16
  - number: '16.2'
    text: |-
      De behandeling van het celmateriaal waarop het vergelijkend onderzoek wordt verricht, evenals de uitvoering van dat
      onderzoek, vinden plaats volgens de gangbare normen van gerechtelijk natuurwetenschappelijk onderzoek.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel16
  - number: '16.3'
    text: Met betrekking tot het onderzoek in laboratoria kunnen bij ministeriële regeling nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel16
  - number: '17.1'
    text: |-
      Van het vergelijkend onderzoek wordt een verslag van bevindingen opgesteld. Uit het verslag blijkt dat het bij of
      krachtens de [artikelen 12 tot en met 16][ref1] bepaalde is nageleefd. Het verslag bevat de naam van de deskundige
      aan wie het onderzoek werd opgedragen, en wordt door deze gedateerd en ondertekend.


      [ref1]: https://wetten.overheid.nl/BWBR0028458#Artikel12
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028458
        artikel: '12'
        hoofdstuk: '4'
  - number: '17.2'
    text: Het laboratorium waaraan de deskundige is verbonden, behoudt een afschrift van het verslag.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel17
  - number: '17.3'
    text: |-
      Het verslag wordt toegezonden aan de rechter-commissaris die de opdracht tot het vergelijkend onderzoek heeft
      verleend.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel17
  - number: '18.1'
    text: |-
      Onmiddellijk na afsluiting van het vergelijkend onderzoek wordt het overblijvende sporen- en referentiemateriaal
      door het laboratorium verpakt, verzegeld en deugdelijk bewaard tot de verzending.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel18
  - number: '18.2'
    text: |-
      Indien een tegenonderzoek is gelast, zendt het laboratorium het sporen- en referentiemateriaal onverwijld naar het
      laboratorium waar het tegenonderzoek zal worden verricht.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel18
  - number: '19.1'
    text: |-
      Op het tegenonderzoek zijn de [artikelen 12][ref1], [13, eerste en tweede lid, onderdelen a tot en met d en g][ref2],
      [15, eerste lid][ref3], en [16][ref4], [17][ref5] en [18, eerste lid][ref6], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028458#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0028458#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0028458#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0028458#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0028458#Artikel17
      [ref6]: https://wetten.overheid.nl/BWBR0028458#Artikel18
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028458
        artikel: '12'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0028458
        artikel: '13'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0028458
        artikel: '15'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0028458
        artikel: '16'
        hoofdstuk: '4'
      - id: ref5
        bwb_id: BWBR0028458
        artikel: '17'
        hoofdstuk: '4'
      - id: ref6
        bwb_id: BWBR0028458
        artikel: '18'
        hoofdstuk: '4'
  - number: '19.2'
    text: |-
      Na afsluiting van het tegenonderzoek wordt het resterende sporen- en referentiemateriaal onverwijld teruggezonden
      naar het laboratorium, dat het vergelijkend onderzoek heeft verricht.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel19
  - number: '19.3'
    text: |-
      Behalve de gegevens, bedoeld in [artikel 13, tweede lid, onderdelen a tot en met d en g][ref1], registreert het
      laboratorium dat het tegenonderzoek verricht:


      [ref1]: https://wetten.overheid.nl/BWBR0028458#Artikel13
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028458
        artikel: '13'
        hoofdstuk: '4'
  - number: 19.3.a
    text: |-
      de datum van verzending van het verslag, bedoeld in [artikel 15, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028458#Artikel15
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028458
        artikel: '15'
        hoofdstuk: '4'
  - number: 19.3.b
    text: de datum en het adres van verzending van de resterende monsters op grond van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel19
  - number: '19.4'
    text: |-
      Het laboratorium waar het tegenonderzoek heeft plaatsgevonden, zendt een afschrift van het verslag van bevindingen
      aan het laboratorium dat het vergelijkend onderzoek heeft verricht.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel19
  - number: '19.5'
    text: |-
      De in [artikel 79b, tweede lid, van het wetboek][ref1] bedoelde bijdrage aan de kosten van het tegenonderzoek
      worden bij ministeriële regeling vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel79b
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: 79b
  - number: '20.1'
    text: |-
      De dienst, bedoeld in [artikel 3, eerste lid][ref1], of de door Onze Minister in overeenstemming met Onze Minister
      van Volksgezondheid, Welzijn en Sport aangewezen rechtspersoon die tot taak heeft laboratoriumonderzoeken te
      verrichten ten behoeve van de volksgezondheid en justitie, die het celmateriaal ingevolge [artikel 11][ref2]
      heeft verzonden, ontvangt het na het vergelijkend onderzoek overgebleven celmateriaal in opdracht van de rechter-
      commissaris terug:


      [ref1]: https://wetten.overheid.nl/BWBR0028458#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028458#Artikel11
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028458
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0028458
        artikel: '11'
        hoofdstuk: '4'
  - number: 20.1.a
    text: |-
      na ommekomst van de termijn, bedoeld in [artikel 79b, eerste lid, van het wetboek][ref1], indien de verdachte het
      daar bedoelde verzoek niet heeft gedaan of dit verzoek niet is ingewilligd;


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel79b
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: 79b
  - number: 20.1.b
    text: |-
      nadat de uitslag van het onderzoek, bedoeld in [artikel 79b, eerste lid, van het wetboek][ref1] ter kennis is
      gekomen van de rechter-commissaris.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel79b
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: 79b
  - number: '20.2'
    text: |-
      Na ontvangst van het celmateriaal geeft de in het eerste lid bedoelde instantie hiervan kennis aan de rechter-
      commissaris die de opdracht tot het onderzoek heeft verleend.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel20
  - number: '20.3'
    text: |-
      Van de ontvangst wordt aantekening gedaan in de registratie, gevoerd op grond van de [artikelen 3][ref1] en
      [10, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028458#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028458#Artikel10
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028458
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0028458
        artikel: '10'
        hoofdstuk: '3'
  - number: '21'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel21
  - number: '22.1'
    text: |-
      Uiterlijk achttien jaar na het verzamelen ervan, gelast de rechter-commissaris dat het sporenmateriaal wordt
      vernietigd in aanwezigheid van een opsporingsambtenaar.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel22
  - number: '22.2'
    text: De opsporingsambtenaar, bedoeld in het eerste lid, maakt van de vernietiging proces-verbaal op.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel22
  - number: '22.3'
    text: Het proces-verbaal van vernietiging wordt onverwijld aan de rechter-commissaris toegezonden.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel22
  - number: '22.4'
    text: |-
      Van de vernietiging wordt aantekening gedaan in de registraties, gehouden op grond van
      [artikel 10, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028458#Artikel10
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0028458
        artikel: '10'
        hoofdstuk: '3'
  - number: '23.1'
    text: In een bij ministeriële regeling aangewezen laboratorium wordt een centrale registratie van profielen gehouden.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel23
  - number: '23.2'
    text: 'De registratie, bedoeld in het eerste lid, dient uitsluitend voor:'
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel23
  - number: 23.2.a
    text: toekomstig strafvorderlijk onderzoek;
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel23
  - number: 23.2.b
    text: |-
      de vaststelling van de identiteit van overleden personen of van personen die niet in staat zijn inlichtingen
      omtrent hun identiteit te verschaffen;
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel23
  - number: 23.2.c
    text: |-
      het verschaffen van statistische informatie, betreffende de frequentie van een profiel, benodigd voor
      wetenschappelijke toetsing van het identificatieproces.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel23
  - number: '23.3'
    text: 'De registratie bevat:'
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel23
  - number: 23.3.a
    text: |-
      profielen, verkregen door het onderzoek van sporenmateriaal, alsmede de gegevens van het bij dat materiaal
      behorende identiteitszegel;
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel23
  - number: 23.3.b
    text: |-
      profielen, verkregen door het onderzoek van referentiemateriaal, afgenomen van de verdachte, alsmede de gegevens
      van het bij dat materiaal behorende identiteitszegel.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel23
  - number: '23.4'
    text: |-
      De registratie van profielen behoeft toestemming van de rechter-commissaris die opdracht tot het vergelijkend
      onderzoek heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel23
  - number: '23.5'
    text: 'Rechtstreekse toegang tot de registratie hebben:'
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel23
  - number: 23.5.a
    text: |-
      de directeur van het laboratorium, bedoeld in het eerste lid, voor zover hij deze nodig heeft ten behoeve van
      het voeren van het beheer over de registratie van profielen of het verrichten van een onderzoek als bedoeld in
      [artikel 79, eerste lid, van het Wetboek van Strafvordering BES][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel79
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '79'
  - number: 23.5.b
    text: |-
      de directeur, bedoeld in [artikel 15, eerste lid, onder a, van het Besluit DNA-onderzoek in strafzaken][ref1],
      voor zover hij deze nodig heeft ten behoeve van het verrichten van een DNA-onderzoek in het kader van een
      opsporingsonderzoek of een uit hoofde van de [artikelen 181][ref2] of [182 van de wet][ref3] ingesteld onderzoek,


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel181
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel182
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0012791
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '181'
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '182'
  - number: 23.5.c
    text: |-
      de directeur van het laboratorium, bedoeld in artikel 23, eerste lid, van het Landsbesluit vergelijkend onderzoek
      celmateriaal (AB 1997, 49), voor zover hij deze nodig heeft ten behoeve van het verrichten van een onderzoek als
      bedoeld in artikel 79, eerste lid, van het Wetboek van Strafvordering van Aruba (AB 1996, 75),
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel23
  - number: 23.5.d
    text: |-
      de directeur van het laboratorium, bedoeld in artikel 23, eerste lid, van het Landsbesluit vergelijkend onderzoek
      celmateriaal (P.B. 1997, 245), voor zover hij deze nodig heeft ten behoeve van het verrichten van een onderzoek als
      bedoeld in artikel 79, eerste lid, van het Wetboek van Strafvordering (P.B. 1996, 164), en
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel23
  - number: 23.5.e
    text: |-
      de directeur van het laboratorium, bedoeld in artikel 23, eerste lid, van het Landsbesluit vergelijkend onderzoek
      celmateriaal (AB 2013, 169 ), voor zover hij deze nodig heeft ten behoeve van het verrichten van een onderzoek als
      bedoeld in artikel 79, eerste lid, van het Wetboek van Strafvordering (P.B. 1996, 164).
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel23
  - number: '24.1'
    text: |-
      De directeur van het laboratorium, bedoeld in [artikel 23, eerste lid][ref1], kan de profielen onderling
      vergelijken met het oog op het doel, bedoeld in [artikel 23, tweede lid][ref2], en leden van het openbaar
      ministerie en met rechtspraak belaste leden van de rechterlijke macht van de resultaten daarvan in kennis stellen.
      Tevens kunnen de leden van het openbaar ministerie en met rechtspraak belaste leden van de rechterlijke macht in
      het Europese deel van Nederland daarvan in kennis worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028458#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0028458#Artikel23
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028458
        artikel: '23'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028458
        artikel: '23'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '24.2'
    text: |-
      Tot een persoon herleidbare gegevens worden door de rechter-commissaris uitsluitend verstrekt aan de verzoeker,
      bedoeld in [artikel 28][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028458#Artikel28
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028458
        artikel: '28'
        hoofdstuk: '7'
  - number: '25'
    text: |-
      Profielen, verkregen door het onderzoek van sporenmateriaal in zaken waarin geen verdachte bekend is, kunnen,
      na toestemming van de rechter-commissaris, opgenomen worden in de registratie, bedoeld in [artikel 23][ref1]. De
      [artikelen 23][ref2] en [24][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028458#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0028458#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0028458#Artikel24
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0028458
        artikel: '23'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028458
        artikel: '23'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0028458
        artikel: '24'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '26.1'
    text: |-
      De rechter-commissaris beveelt dat een profiel, verkregen door het onderzoek van referentiemateriaal, alsmede
      de gegevens, opgenomen in de registratie van de rechter-commissaris op grond van [artikel 10, vierde lid][ref1],
      terstond worden vernietigd, indien blijkt dat het afkomstig is van een verdachte die ter zake van het feit in
      verband waarmee onderzoek is verricht, ten onrechte als verdachte is aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0028458#Artikel10
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0028458
        artikel: '10'
        hoofdstuk: '3'
  - number: '26.2'
    text: |-
      Zodra het belang van het onderzoek dit toelaat beveelt de rechter-commissaris dat een profiel, verkregen door het
      onderzoek van sporenmateriaal, wordt vernietigd.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel26
  - number: '26.3'
    text: De rechter-commissaris ontvangt onverwijld een kennisgeving van de vernietiging van een profiel.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel26
  - number: '27.1'
    text: |-
      Buiten het geval van [artikel 26][ref1] beveelt de rechter-commissaris:


      [ref1]: https://wetten.overheid.nl/BWBR0028458#Artikel26
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0028458
        artikel: '26'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: 27.1.a
    text: |-
      na achttien jaar na de opneming in de registratie, bedoeld in [artikel 23, eerste lid][ref1], de vernietiging van
      het profiel, verkregen door het onderzoek van sporenmateriaal;


      [ref1]: https://wetten.overheid.nl/BWBR0028458#Artikel23
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0028458
        artikel: '23'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 27.1.b
    text: |-
      na dertig jaar na de opneming in de registratie, bedoeld in [artikel 23, eerste lid][ref1], de vernietiging van
      het profiel, verkregen door het onderzoek van referentiemateriaal, alsmede de daarop betrekking hebbende gegevens,
      geregistreerd door de rechter-commissaris op grond van [artikel 10, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028458#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0028458#Artikel10
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0028458
        artikel: '23'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028458
        artikel: '10'
        hoofdstuk: '3'
  - number: '27.2'
    text: De rechter-commissaris ontvangt onverwijld een kennisgeving van de vernietiging van een profiel.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel27
  - number: '28.1'
    text: |-
      De rechter-commissaris deelt een ieder op diens verzoek schriftelijk binnen vier weken mee, of in de registraties,
      gevoerd op grond van de [artikelen 4][ref1], [10, vierde lid][ref2] en [23, eerste lid][ref3], tot hem herleidbare
      gegevens zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028458#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0028458#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0028458#Artikel23
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0028458
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0028458
        artikel: '10'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0028458
        artikel: '23'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '28.2'
    text: |-
      Indien zodanige gegevens zijn opgenomen, stelt de rechter-commissaris desverlangd binnen vier weken een volledig
      overzicht daarvan met inlichtingen over de herkomst ter beschikking.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel28
  - number: '28.3'
    text: |-
      Indien een gewichtig belang van de verzoeker dat naar het oordeel van de rechter-commissaris eist, voldoet deze aan
      een verzoek als bedoeld in het eerste lid, in een andere dan schriftelijke vorm, die aan dat belang is aangepast.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel28
  - number: '28.4'
    text: |-
      De rechter-commissaris draagt, alvorens mededeling omtrent een register te doen, zorg voor een deugdelijke
      vaststelling van de identiteit van de verzoeker.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel28
  - number: '28.5'
    text: |-
      De verzoeken, bedoeld in het eerste en tweede lid, worden ten aanzien van personen die minderjarig zijn en de
      leeftijd van eenentwintig jaren nog niet hebben bereikt, en van onder curatele gestelden gedaan door hun wettelijke
      vertegenwoordigers. De betrokken mededeling geschiedt eveneens aan de wettelijke vertegenwoordigers.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel28
  - number: '29'
    text: |-
      De rechter-commissaris kan weigeren aan een in [artikel 28, eerste of tweede lid][ref1], bedoeld verzoek te
      voldoen, indien dit noodzakelijk is in het belang van:


      [ref1]: https://wetten.overheid.nl/BWBR0028458#Artikel28
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0028458
        artikel: '28'
        hoofdstuk: '7'
  - number: 29.a
    text: de opsporing en vervolging van strafbare feiten;
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel29
  - number: 29.b
    text: gewichtige belangen van anderen dan de verzoeker.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel29
  - number: '30.1'
    text: |-
      Degene aan wie op grond van [artikel 28][ref1] kennis is gegeven van tot hem herleidbare gegevens, kan de rechter-
      commissaris schriftelijk verzoeken deze te verbeteren, aan te vullen, te verwijderen of te doen vernietigen, indien
      zij:


      [ref1]: https://wetten.overheid.nl/BWBR0028458#Artikel28
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0028458
        artikel: '28'
        hoofdstuk: '7'
  - number: 30.1.a
    text: feitelijk onjuist zijn;
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel30
  - number: 30.1.b
    text: voor het doel van de registraties onvolledig of niet ter zake dienend zijn;
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel30
  - number: 30.1.c
    text: in strijd met enig wettelijk voorschrift in de registraties voorkomen.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel30
  - number: '30.2'
    text: |-
      De rechter-commissaris bericht de verzoeker binnen acht weken na ontvangst van het verzoek, of en in hoeverre hij
      daaraan voldoet. [Artikel 28, derde, vierde en vijfde lid][ref1], is van overeenkomstige toepassing. Een weigering
      is met redenen omkleed.


      [ref1]: https://wetten.overheid.nl/BWBR0028458#Artikel28
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0028458
        artikel: '28'
        hoofdstuk: '7'
  - number: '30.3'
    text: |-
      De rechter-commissaris draagt zorg dat een beslissing tot verbetering, aanvulling of verwijdering zo spoedig
      mogelijk wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel30
  - number: '31.1'
    text: |-
      Indien de rechter-commissaris niet heeft voldaan aan een verzoek als bedoeld in de [artikelen 28][ref1]
      en [30][ref2], dan wel niet in schriftelijke vorm daaraan heeft voldaan, kan de verzoeker zich tot het
      Gemeenschappelijk Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint Eustatius en Saba wenden
      met het schriftelijk verzoek de rechter-commissaris te bevelen alsnog aan dat verzoek te voldoen, dan wel in
      schriftelijke vorm daaraan te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0028458#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0028458#Artikel30
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0028458
        artikel: '28'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0028458
        artikel: '30'
        hoofdstuk: '7'
  - number: '31.2'
    text: |-
      Een verzoek als bedoeld in het eerste lid, wordt binnen acht weken na ontvangst van het antwoord van de rechter-
      commissaris ingediend. Indien de rechter-commissaris niet heeft geantwoord binnen de gestelde termijn, wordt het
      verzoek binnen acht weken na afloop van die termijn ingediend.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel31
  - number: '31.3'
    text: |-
      Het Gemeenschappelijk Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint Eustatius en Saba
      wijst het verzoek toe, voor zover het dit gegrond acht.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel31
  - number: '32.1'
    text: |-
      Met betrekking tot het verzamelen, afnemen, verpakken, bewaren, registreren, verzenden en vernietigen van
      celmateriaal kunnen bij ministeriële regeling nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel32
  - number: '32.2'
    text: De vorm van identiteits- en sluitzegels wordt bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel32
  - number: 32a.1
    text: |-
      Het celmateriaal dat voor inwerkingtreding van dit besluit is verzameld, afgenomen, verpakt, bewaard, geregistreerd
      of verzonden en nog niet is vernietigd wordt geacht te zijn verzameld, afgenomen, verpakt, bewaard, geregistreerd
      of verzonden op grond van dit besluit.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel32a
  - number: 32a.2
    text: |-
      Profielen die voor inwerkingtreding van dit besluit zijn geregistreerd worden geacht te zijn geregistreerd op grond
      van dit besluit.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel32a
  - number: '33'
    text: 'Dit besluit wordt aangehaald als: Besluit vergelijkend onderzoek celmateriaal BES.'
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel33
