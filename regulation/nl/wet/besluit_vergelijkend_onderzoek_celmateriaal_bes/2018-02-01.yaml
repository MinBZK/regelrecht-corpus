        artikel: '20'
        hoofdstuk: '4'
  - number: 13.2.g
    text: |-
      de datum van de verslaglegging en de verzending daarvan, bedoeld in [artikel 17][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028458#Artikel17
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028458
        artikel: '17'
        hoofdstuk: '4'
  - number: 13.2.h
    text: |-
      de vernietiging van het profiel krachtens de [artikelen 26][ref1] en [27][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028458#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0028458#Artikel27
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel13
