        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0028458
        artikel: '15'
        hoofdstuk: '4'
  - number: 13.2.f
    text: |-
      de datum en het adres van verzending van het monster op grond van de [artikelen 18, tweede lid][ref1] en
      [20, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0028458#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0028458#Artikel20
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028458
        artikel: '18'
