  - number: '2.1'
    text: Van het verzamelen van sporenmateriaal wordt door de opsporingsambtenaar proces-verbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel2
  - number: '2.2'
    text: |-
      De opsporingsambtenaar voorziet het sporenmateriaal van een genummerd identiteitszegel en brengt eenzelfde
      identiteitszegel alsmede een sluitzegel op de verpakking van het sporenmateriaal aan. Een corresponderend
      identiteitszegel wordt aangebracht op het proces-verbaal, bedoeld in het eerste lid, alsmede op een afschrift
      daarvan, dat onverwijld aan de rechter-commissaris wordt gezonden.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel2
  - number: '2.3'
    text: 'Het proces-verbaal bevat:'
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel2
  - number: 2.3.a
    text: de datum waarop het monster is genomen;
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel2
  - number: 2.3.b
    text: de gegevens, betreffende het opsporingsonderzoek in het kader waarvan het sporenmateriaal is verzameld;
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel2
  - number: 2.3.c
    text: de datum waarop het sporenmateriaal wordt verzonden, alsmede de plaats waar het wordt bewaard.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel2
  - number: '3.1'
    text: |-
      De bewaring van monsters, bevattende sporenmateriaal, geschiedt door het politiekorps voor Bonaire, Sint Eustatius
      en Saba.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel3
  - number: '3.2'
    text: 'De in het eerste lid genoemde politiekorps registreert:'
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel3
  - number: 3.2.a
    text: de datum van ontvangst van het monster;
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel3
  - number: 3.2.b
    text: de datum waarop het monster is genomen;
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel3
  - number: 3.2.c
    text: de gegevens op het identiteitszegel;
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel3
  - number: 3.2.d
    text: de uitkomst van een onderzoek naar de staat van het sluitzegel.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel3
  - number: '3.3'
    text: |-
      Aan de registratie, bedoeld in het tweede lid, worden, nadat de rechter-commissaris de opdracht tot het
      vergelijkend onderzoek heeft verleend, toegevoegd:
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel3
  - number: 3.3.a
    text: de naam en de standplaats van de rechter-commissaris;
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel3
  - number: 3.3.b
    text: de naam van het laboratorium waar het vergelijkend onderzoek zal worden verricht;
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel3
  - number: 3.3.c
    text: de datum waarop het monster naar dat laboratorium is verzonden.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel3
  - number: '3.4'
    text: |-
      Indien de in het eerste lid genoemde politiekorps onvoldoende toegerust is om het sporenmateriaal te bewaren,
      geschiedt de bewaring bij een door Onze Minister in overeenstemming met Onze Minister van Volksgezondheid, Welzijn
      en Sport aangewezen rechtspersoon die tot taak heeft laboratoriumonderzoeken te verrichten ten behoeve van de
      volksgezondheid en justitie. Het tweede en derde lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel3
  - number: '4.1'
    text: |-
      De rechter-commissaris draagt zorg voor de registratie van ieder op grond van [artikel 2, tweede lid][ref1], aan
      hem toegezonden proces-verbaal, alsmede van de gegevens op het identiteitszegel dat daarop is aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0028458#Artikel2
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028458
        artikel: '2'
        hoofdstuk: '2'
  - number: '4.2'
    text: |-
      Aan de registratie, bedoeld in het eerste lid, worden, nadat de rechter-commissaris de opdracht tot het
      vergelijkend onderzoek heeft verleend, toegevoegd:
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel4
  - number: 4.2.a
    text: de naam en de standplaats van de rechter-commissaris;
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel4
  - number: 4.2.b
    text: de datum waarop de opdracht tot het vergelijkend onderzoek is verleend;
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel4
  - number: 4.2.c
    text: de naam van het laboratorium waar het onderzoek op het monster wordt verricht.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel4
  - number: '5'
    text: |-
      Nadat de registratie, bedoeld in [artikel 4, eerste lid][ref1], heeft plaatsgevonden, wordt bij alle verdere
      handelingen met het sporenmateriaal ter aanduiding daarvan uitsluitend gebruik gemaakt van het nummer van het
      identiteitszegel, bedoeld in [artikel 2, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028458#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0028458#Artikel2
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028458
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0028458
        artikel: '2'
        hoofdstuk: '2'
  - number: '6.1'
    text: Bloedafname geschiedt door middel van een door een arts te verrichten venapunctie.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel6
  - number: '6.2'
    text: Afgenomen wordt een hoeveelheid bloed van ten hoogste tien milliliter.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel6
  - number: '7'
    text: |-
      Indien bloedafname naar het oordeel van de arts om bijzondere geneeskundige redenen onwenselijk is, doet de
      opsporingsambtenaar, bedoeld in [artikel 10, eerste lid][ref1], van het achterwege blijven daarvan onverwijld
      mededeling aan de rechter-commissaris, die het bevel tot bloedafname heeft gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0028458#Artikel10
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028458
        artikel: '10'
        hoofdstuk: '3'
  - number: '8'
    text: |-
      De afname van wangslijmvlies geschiedt door een arts, die daartoe de binnenzijde van ieder der beide wangen door
      middel van drie wattenstokjes met enige kracht bemonstert.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel8
  - number: '9'
    text: De afname van haarwortels geschiedt door een arts die daartoe ten minste tien haren uittrekt.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel9
  - number: '10.1'
    text: |-
      De bloedafname, de afname van wangslijmvlies en de afname van haarwortels hebben plaats in de aanwezigheid van een
      opsporingsambtenaar, die daarvan proces-verbaal opmaakt.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel10
  - number: '10.2'
    text: |-
      [Artikel 2, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028458#Artikel2
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028458
        artikel: '2'
        hoofdstuk: '2'
  - number: '10.3'
    text: 'Het proces-verbaal bevat:'
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel10
  - number: 10.3.a
    text: de datum waarop het monster is genomen;
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel10
  - number: 10.3.b
    text: de gegevens, betreffende het opsporingsonderzoek in het kader waarvan het referentiemateriaal is verkregen;
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel10
  - number: 10.3.c
    text: |-
      de volledige naam en geboortedatum van de persoon waarvan het monster is afgenomen, dan wel de andere gegevens die
      voor de bepaling van zijn identiteit zijn gebruikt;
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel10
  - number: 10.3.d
    text: |-
      de naam en de standplaats van de rechter-commissaris die het bevel, bedoeld in [artikel 79a van het wetboek][ref1],
      heeft gegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel79a
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: 79a
  - number: 10.3.e
    text: de datum waarop het referentiemateriaal wordt verzonden, alsmede de plaats waar het wordt bewaard.
    url: https://wetten.overheid.nl/BWBR0028458/2018-02-01#Artikel10
  - number: '10.4'
    text: |-
      De [artikelen 3][ref1], [4, eerste en tweede lid][ref2] en [5][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028458#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028458#Artikel4
