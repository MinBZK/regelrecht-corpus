---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_wederzijdse_erkenning_en_tenuitvoerlegging_geldelijke_sancties_en_beslissingen_tot_confiscatie
regulatory_layer: WET
publication_date: '2025-11-10'
valid_from: '2007-12-01'
bwb_id: BWBR0022604
url: https://wetten.overheid.nl/BWBR0022604/2007-12-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de implementatie van het kaderbesluit nr. 2005/214/JBZ van de Raad van
    de Europese Unie van 24 februari 2005 inzake de toepassing van het beginsel van wederzijdse erkenning op geldelijke
    sancties (PbEG L 76) noodzaakt tot het stellen van regels voor de wederzijdse erkenning en tenuitvoerlegging
    van geldelijke sancties en voorts dat het wenselijk is een algemeen kader op te stellen waarin toekomstige
    kaderbesluiten inzake de wederzijdse erkenning van einduitspraken kunnen worden geïmplementeerd;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel1
  - number: 1.a
    text: 'rechterlijke uitspraak: een onherroepelijke beslissing van een rechter wegens een strafbaar feit;'
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel1
  - number: 1.b
    text: |-
      beschikking: een onherroepelijke beslissing van een bestuurlijke autoriteit wegens een strafbaar feit of een feit
      dat wordt bestraft als vergrijp tegen de voorschriften betreffende de orde, voor zover tegen de beslissing beroep
      op een met name in strafzaken bevoegde rechter is opengesteld;
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel1
  - number: 1.c
    text: 'uitvaardigende lidstaat: lidstaat van de Europese Unie waarin een rechterlijke uitspraak of beschikking is gewezen;'
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel1
  - number: 1.d
    text: |-
      uitvoerende lidstaat: lidstaat van de Europese Unie waaraan een rechterlijke uitspraak of beschikking met het oog
      op tenuitvoerlegging is of wordt toegezonden;
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel1
  - number: 1.e
    text: 'sanctie: een bij rechterlijke uitspraak of beschikking opgelegde straf of maatregel;'
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel1
  - number: 1.f
    text: 'geldelijke sanctie: sanctie houdende de verplichting tot betaling van:'
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel1
  - number: 1.f.1°
    text: een geldboete;
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel1
  - number: 1.f.2°
    text: |-
      een geldbedrag ten behoeve van het slachtoffer van het strafbare feit, voor zover deze verplichting is opgelegd
      door de strafrechter;
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel1
  - number: 1.f.3°
    text: |-
      een geldbedrag voor een schadefonds of instelling ten behoeve van slachtoffers van strafbare feiten voor zover deze
      verplichting is opgelegd bij rechterlijke uitspraak of beschikking;
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel1
  - number: 1.f.4°
    text: proceskosten;
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel1
  - number: 1.g
    text: 'veroordeelde: degene aan wie een sanctie is opgelegd;'
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel1
  - number: 1.h
    text: |-
      officier van justitie: de ingevolge de [artikelen 4][ref1] en [5][ref2] bevoegde officier van justitie, tenzij in
      deze wet uitdrukkelijk anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0022604#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022604#Artikel5
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0022604
        artikel: '4'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0022604
        artikel: '5'
        hoofdstuk: I
  - number: '2'
    text: |-
      Rechterlijke uitspraken en beschikkingen gewezen in een andere lidstaat van de Europese Unie en aan Nederland
      gezonden worden overeenkomstig de bepalingen van deze wet in Nederland erkend en ten uitvoer gelegd.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel2
  - number: '3'
    text: |-
      In Nederland gewezen rechterlijke uitspraken en beschikkingen kunnen overeenkomstig de bepalingen van deze wet
      worden gezonden aan een andere lidstaat van de Europese Unie met het oog op de tenuitvoerlegging aldaar.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel3
  - number: '4'
    text: |-
      Bevoegd tot erkenning en tenuitvoerlegging van een in een andere lidstaat van de Europese Unie opgelegde
      beslissing, houdende een geldelijke sanctie, is de officier van justitie bij het arrondissementsparket te
      Leeuwarden.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel4
  - number: '5'
    text: |-
      Bevoegd tot het verzenden van een in Nederland opgelegde beslissing, houdende een geldelijke sanctie, aan een
      andere lidstaat van de Europese Unie met het oog op de tenuitvoerlegging aldaar is de officier van justitie bij het
      arrondissementsparket te Leeuwarden.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel5
  - number: '6.1'
    text: |-
      Vatbaar voor erkenning en tenuitvoerlegging in Nederland zijn geldelijke sancties opgelegd in een andere lidstaat
      van de Europese Unie:
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel6
  - number: 6.1.a
    text: bij rechterlijke uitspraak;
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel6
  - number: 6.1.b
    text: bij beschikking;
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel6
  - number: 6.1.c
    text: bij onherroepelijke rechterlijke beslissing, genomen in beroep tegen een beschikking.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel6
  - number: '6.2'
    text: |-
      Het eerste lid is van toepassing in het geval de veroordeelde een natuurlijke persoon is, voor zover deze inkomsten
      of vermogen of zijn vaste woon- of verblijfplaats in Nederland heeft dan wel in het geval de veroordeelde een
      rechtspersoon is, voor zover deze inkomsten of vermogen of zijn statutaire zetel in Nederland heeft.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel6
  - number: '7.1'
    text: |-
      De beslissing, houdende de geldelijke sanctie, en het bijbehorende ingevulde certificaat worden door de officier
      van justitie in behandeling genomen. Zo deze documenten niet aan hem zijn gezonden, worden ze door de geadresseerde
      onverwijld aan hem doorgezonden. De geadresseerde stelt de bevoegde autoriteit van de uitvaardigende lidstaat
      hiervan onverwijld schriftelijk in kennis.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel7
  - number: '7.2'
    text: |-
      Indien het certificaat ontbreekt, onvolledig is of kennelijk niet in overeenstemming is met de beslissing, verzoekt
      de officier van justitie de bevoegde autoriteit in de uitvaardigende lidstaat het certificaat alsnog over te
      leggen, aan te vullen of te verbeteren.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel7
  - number: '7.3'
    text: |-
      De officier van justitie kan de bevoegde autoriteit in de uitvaardigende lidstaat verzoeken een gewaarmerkt
      afschrift van de beslissing of het origineel van het certificaat te overleggen.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel7
  - number: '8.1'
    text: |-
      Een voor erkenning vatbare beslissing, houdende een geldelijke sanctie, wordt erkend en ten uitvoer gelegd
      overeenkomstig het bepaalde in de [artikelen 561][ref1] en [572][ref2], [573, eerste en tweede lid][ref3],
      [574 tot en met 576 van het Wetboek van Strafvordering][ref4], tenzij in deze wet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel561
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel572
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel573
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel574
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '561'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '572'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '573'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '574'
  - number: '8.2'
    text: |-
      Behoudens de in [artikel 9][ref1] genoemde gevallen blijft de hoogte van de opgelegde geldelijke sanctie
      ongewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0022604#Artikel9
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0022604
        artikel: '9'
        hoofdstuk: II
        afdeling: '1'
  - number: '8.3'
    text: |-
      Indien de geldelijke sanctie is uitgedrukt in vreemde valuta, bepaalt de officier van justitie de hoogte van het
      bedrag in euro's volgens de wisselkoers die gold op het tijdstip waarop de geldelijke sanctie werd opgelegd.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel8
  - number: '8.4'
    text: |-
      De officier van justitie kan de tenuitvoerlegging opschorten gedurende de periode die nodig is om de ten uitvoer te
      leggen beslissing te laten vertalen in de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel8
  - number: '8.5'
    text: |-
      Zodra de tenuitvoerlegging van de beslissing is voltooid, stelt de officier van justitie de bevoegde autoriteit van
      de uitvaardigende lidstaat hiervan in kennis.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel8
  - number: '9.1'
    text: |-
      Ingeval de beslissing, houdende de geldelijke sanctie, strekt tot betaling van een geldboete die hoger is dan het
      wettelijke strafmaximum waarmee het desbetreffende feit naar Nederlands recht is bedreigd, verlaagt de officier van
      justitie de hoogte van het bedrag tot dat strafmaximum, indien het desbetreffende feit buiten het grondgebied van
      de uitvaardigende lidstaat is gepleegd en daarover naar Nederlands recht rechtsmacht kon worden uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel9
  - number: '9.2'
    text: |-
      Indien de veroordeelde aannemelijk maakt dat reeds betalingen zijn verricht ter voldoening van de geldelijke
      sanctie, raadpleegt de officier van justitie de bevoegde autoriteit van de uitvaardigende lidstaat hierover.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel9
  - number: '9.3'
    text: Reeds geïnde bedragen worden geheel in mindering gebracht op het verschuldigde bedrag.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel9
  - number: '9.4'
    text: |-
      Past de officier van justitie de hoogte van het verschuldigde bedrag aan op grond van het eerste of derde lid, dan
      stelt hij de bevoegde autoriteit van de uitvaardigende lidstaat hiervan onverwijld schriftelijk in kennis.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel9
  - number: '10.1'
    text: |-
      De officier van justitie weigert de erkenning en tenuitvoerlegging van de beslissing, houdende een geldelijke
      sanctie, indien:
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel10
  - number: 10.1.a
    text: |-
      de geldelijke sanctie is opgelegd naar aanleiding van een feit waarover ten aanzien van degene aan wie de
      geldelijke sanctie is opgelegd:
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel10
  - number: 10.1.a.1°
    text: door de Nederlandse rechter reeds onherroepelijk is beslist;
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel10
  - number: 10.1.a.2°
    text: door een andere rechter reeds een straf is opgelegd welke ten uitvoer is gelegd;
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel10
  - number: 10.1.b
    text: |-
      behoudens het bepaalde in het tweede lid, het feit waarvoor de geldelijke sanctie is opgelegd, indien het in
      Nederland was begaan, naar Nederlands recht niet strafbaar zou zijn;
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel10
  - number: 10.1.c
    text: |-
      over het feit waarvoor de geldelijke sanctie is opgelegd naar Nederlands recht rechtsmacht kon worden uitgeoefend
      en het recht tot uitvoering van de geldelijke sanctie naar Nederlands recht zou zijn verjaard;
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel10
  - number: 10.1.d
    text: |-
      de tenuitvoerlegging van de beslissing, houdende de geldelijke sanctie, onverenigbaar is met een naar Nederlands
      recht geldende immuniteit;
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel10
  - number: 10.1.e
    text: de veroordeelde ten tijde van het begaan van het feit de leeftijd van twaalf jaren nog niet had bereikt;
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel10
  - number: 10.1.f
    text: |-
      de geldelijke sanctie is opgelegd bij beschikking en uit het certificaat blijkt dat de veroordeelde noch
      persoonlijk, noch door tussenkomst van zijn vertegenwoordiger op de door het nationale recht van de uitvaardigende
      lidstaat voorgeschreven wijze in kennis is gesteld van de mogelijkheid een rechtsmiddel in te stellen en van de
      daarvoor geldende termijn;
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel10
  - number: 10.1.g
    text: |-
      de geldelijke sanctie is opgelegd bij rechterlijke uitspraak en uit het certificaat blijkt dat de veroordeelde niet
      bij behandeling van de zaak ter terechtzitting aanwezig was, tenzij hij persoonlijk of door tussenkomst van zijn
      vertegenwoordiger op de door het nationale recht van de uitvaardigende lidstaat voorgeschreven wijze is opgeroepen
      voor de terechtzitting dan wel te kennen heeft gegeven afstand te doen van het recht zich te verdedigen of te laten
      verdedigen;
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel10
  - number: 10.1.h
    text: |-
      het certificaat niet is overgelegd, onvolledig is of kennelijk niet in overeenstemming is met de beslissing en niet
      aan het verzoek, bedoeld in [artikel 7, tweede lid][ref1], is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0022604#Artikel7
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0022604
        artikel: '7'
        hoofdstuk: II
        afdeling: '1'
  - number: '10.2'
    text: |-
      De tenuitvoerlegging van een beslissing wordt niet geweigerd op grond van het eerste lid, onderdeel b, indien het
      feit waarvoor de geldelijke sanctie is opgelegd, is vermeld op of valt onder de bij algemene maatregel van bestuur
      vastgestelde lijst met feiten en soorten van feiten.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel10
  - number: '10.3'
    text: |-
      De tenuitvoerlegging van de beslissing houdende een geldelijke sanctie wordt niet geweigerd op grond van het eerste
      lid, onderdelen c, f en g, dan nadat de bevoegde autoriteit van de uitvaardigende lidstaat in de gelegenheid is
      gesteld hieromtrent inlichtingen te verschaffen.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel10
  - number: '10.4'
    text: |-
      Indien de officier van justitie op grond van het eerste lid de erkenning en tenuitvoerlegging van de geldelijke
      sanctie weigert, stelt hij de bevoegde autoriteit van de uitvaardigende lidstaat hiervan onverwijld schriftelijk en
      met redenen omkleed in kennis.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel10
  - number: '11.1'
    text: |-
      De officier van justitie kan de erkenning en tenuitvoerlegging van een beslissing, houdende een geldelijke sanctie,
      weigeren indien:
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel11
  - number: 11.1.a
    text: 'het feit waarvoor de geldelijke sanctie is opgelegd:'
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel11
  - number: 11.1.a.1°
    text: |-
      geacht wordt geheel of gedeeltelijk op Nederlands grondgebied of buiten Nederland aan boord van een Nederlands
      vaartuig of luchtvaartuig te zijn gepleegd; of
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel11
  - number: 11.1.a.2°
    text: |-
      buiten het grondgebied van de uitvaardigende lidstaat is gepleegd, terwijl naar Nederlands recht geen vervolging
      zou kunnen worden ingesteld indien het feit buiten Nederland zou zijn gepleegd;
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel11
  - number: 11.1.b
    text: de hoogte van de geldelijke sanctie 70 euro of minder bedraagt.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel11
  - number: '11.2'
    text: |-
      Indien de officier van justitie op grond van het eerste lid de tenuitvoerlegging van de geldelijke sanctie weigert,
      stelt hij de bevoegde autoriteit van de uitvaardigende lidstaat hiervan onverwijld schriftelijk en met redenen
      omkleed in kennis.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel11
  - number: '12.1'
    text: |-
      De veroordeelde kan zich tegen het nemen van verhaal verzetten.
      [Artikel 575, derde lid, van het Wetboek van Strafvordering][ref1] is van toepassing, met dien verstande dat het
      bezwaarschrift wordt ingediend bij de arrondissementsrechtbank te Leeuwarden.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel575
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '575'
  - number: '12.2'
    text: |-
      Ten aanzien van derden die geheel of gedeeltelijk recht menen te hebben op voorwerpen waarop verhaal wordt genomen,
      zijn de bepalingen van het [Wetboek van Burgerlijke Rechtsvordering][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '13.1'
    text: |-
      Indien de geldelijke sanctie is opgelegd bij rechterlijke uitspraak waarbij tevens een tot vervangende
      hechtenis strekkende sanctie is opgelegd, kan de rechter op vordering van de officier van justitie verlof
      tot tenuitvoerlegging van die vervangende hechtenis verlenen. De vordering wordt slechts ingesteld indien de
      veroordeelde niet aan de verplichting tot betaling van de geldelijke sanctie voldoet, volledig verhaal op grond
      van de [artikelen 574 tot en met 576 van het Wetboek van Strafvordering][ref1] op diens inkomsten of vermogen niet
      mogelijk is gebleken en de bevoegde autoriteit van de uitvaardigende lidstaat met de tenuitvoerlegging van die
      vervangende hechtenis heeft ingestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel574
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '574'
  - number: '13.2'
    text: De vordering wordt ingesteld bij en behandeld door de raadkamer van de arrondissementsrechtbank te Leeuwarden.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel13
  - number: '13.3'
    text: |-
      De officier van justitie roept de veroordeelde op voor de behandeling van de vordering. De behandeling vindt plaats
      in het openbaar.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel13
  - number: '13.4'
    text: |-
      De vordering wordt niet toegewezen indien het feit waarvoor de sanctie is opgelegd, indien het in Nederland was
      begaan, naar Nederlands recht niet strafbaar zou zijn.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel13
  - number: '13.5'
    text: |-
      Bij de beoordeling van de vordering houdt de raadkamer rekening met gedeeltelijke
      betalingen die door de veroordeelde zijn verricht en het verhaal dat reeds ingevolge de
      [artikelen 574 tot en met 576 van het Wetboek van Strafvordering][ref1] is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel574
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '574'
  - number: '13.6'
    text: |-
      Bij toewijzing van de vordering bepaalt de raadkamer de duur van de vervangende hechtenis.
      [Artikel 24c, tweede tot en met vijfde lid, van het Wetboek van Strafrecht][ref1] is van toepassing. De duur wordt
      niet hoger bepaald dan het maximum dat door de bevoegde autoriteit van de uitvaardigende lidstaat is aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel24c
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 24c
  - number: '13.7'
    text: |-
      De beslissing van de raadkamer wordt aan de veroordeelde betekend.
      [Artikel 564 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel564
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '564'
  - number: '13.8'
    text: |-
      De tot vervangende hechtenis strekkende sanctie kan te allen tijde worden beëindigd door de officier van justitie.
      De hechtenis eindigt indien de veroordeelde alsnog volledig voldoet aan de verplichting tot betaling van de
      geldboete.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel13
  - number: '13.9'
    text: |-
      Indien de vordering wordt toegewezen en de tot vervangende hechtenis strekkende sanctie ten uitvoer wordt
      gelegd, stelt de officier van justitie de bevoegde autoriteit van de uitvaardigende lidstaat hiervan onverwijld
      schriftelijk in kennis.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel13
  - number: '14'
    text: |-
      De tenuitvoerlegging van de geldelijke sanctie wordt gestaakt, zodra een daartoe strekkende kennisgeving van de
      bevoegde autoriteit van de uitvaardigende lidstaat is ontvangen.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel14
  - number: '15'
    text: 'Vatbaar voor erkenning en tenuitvoerlegging in een andere lidstaat van de Europese Unie zijn:'
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel15
  - number: 15.a
    text: een in Nederland bij rechterlijke uitspraak opgelegde geldboete;
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel15
  - number: 15.b
    text: |-
      een in Nederland bij rechterlijke uitspraak opgelegde verplichting tot betaling aan de staat van een geldsom ten
      behoeve van het slachtoffer;
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel15
  - number: 15.c
    text: |-
      een in Nederland door de bevoegde autoriteiten bij beschikking opgelegde administratieve sanctie als bedoeld in
      [artikel 2 van de Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel2
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: '2'
  - number: '16'
    text: |-
      De officier van justitie kan een beslissing als bedoeld in [artikel 15][ref1] aan een andere lidstaat van de
      Europese Unie zenden met het oog op de tenuitvoerlegging aldaar, indien de veroordeelde in die andere lidstaat
      inkomsten of vermogen of zijn vaste woon- of verblijfplaats heeft dan wel, in het geval de veroordeelde een
      rechtspersoon is, deze aldaar inkomsten of vermogen of zijn statutaire zetel heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0022604#Artikel15
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0022604
        artikel: '15'
        hoofdstuk: II
        afdeling: '2'
  - number: '17.1'
    text: |-
      De officier van justitie zendt de beslissing vergezeld van een ingevuld certificaat dat is opgesteld overeenkomstig
      het bij algemene maatregel van bestuur vastgestelde model, rechtstreeks aan de autoriteiten van de uitvoerende
      lidstaat die bevoegd zijn de beslissing te erkennen en ten uitvoer te leggen.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel17
  - number: '17.2'
    text: |-
      Indien niet bekend is welke autoriteiten in de uitvoerende lidstaat bevoegd zijn tot erkenning en
      tenuitvoerlegging, verzoekt de officier van justitie hieromtrent om inlichtingen.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel17
  - number: '17.3'
    text: De beslissing wordt niet aan twee of meer lidstaten tegelijkertijd toegezonden.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel17
  - number: '17.4'
    text: |-
      De toezending kan plaatsvinden per gewone post, telefax of elektronische post, mits de echtheid van de toegezonden
      documenten door de bevoegde autoriteit van de uitvoerende lidstaat kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel17
  - number: '17.5'
    text: |-
      Op verzoek van de bevoegde autoriteit van de uitvoerende lidstaat, stuurt de officier van justitie deze een
      gewaarmerkt afschrift van de rechterlijke uitspraak of beschikking dan wel het origineel van het certificaat toe.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel17
  - number: '18.1'
    text: |-
      Het recht van tenuitvoerlegging in Nederland van de aan de uitvoerende lidstaat toegezonden beslissing, wordt
      opgeschort gedurende de periode dat de beslissing ten uitvoer wordt gelegd in die andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel18
  - number: '18.2'
    text: 'Tot tenuitvoerlegging kan worden overgegaan zodra:'
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel18
  - number: 18.2.a
    text: |-
      van de bevoegde autoriteit van de uitvoerende lidstaat bericht is ontvangen dat de beslissing geheel of
      gedeeltelijk niet ten uitvoer is gelegd; of
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel18
  - number: 18.2.b
    text: |-
      een kennisgeving als bedoeld in [artikel 21][ref1] is verzonden.


      [ref1]: https://wetten.overheid.nl/BWBR0022604#Artikel21
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0022604
        artikel: '21'
        hoofdstuk: II
        afdeling: '2'
  - number: '19'
    text: |-
      Indien na toezending van een beslissing aan de uitvoerende lidstaat een geldsom is ontvangen ter voldoening van het
      verschuldigde bedrag, wordt de bevoegde autoriteit van de uitvoerende lidstaat hiervan door of vanwege de officier
      van justitie onverwijld in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel19
  - number: '20'
    text: |-
      Ingeval de aan de uitvoerende lidstaat toegezonden beslissing strekt tot betaling aan de staat van een geldsom ten
      behoeve van het slachtoffer, keert de staat, zodra van de uitvoerende lidstaat een kennisgeving is ontvangen dat
      een bedrag is ontvangen, dat bedrag uit aan het slachtoffer.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel20
  - number: '21'
    text: |-
      Indien de officier van justitie beslist dat de tenuitvoerlegging van de beslissing in de uitvoerende lidstaat moet
      worden gestaakt, wordt de bevoegde autoriteit in de uitvoerende lidstaat hiervan onverwijld schriftelijk in kennis
      gesteld.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel21
  - number: '22'
    text: |-
      Alle kosten van tenuitvoerlegging van een rechterlijke uitspraak of beschikking in Nederland overeenkomstig de
      bepalingen van deze wet, komen ten laste van de staat.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel22
  - number: '23.1'
    text: |-
      Al hetgeen wordt verkregen door tenuitvoerlegging in Nederland van een rechterlijke uitspraak of beschikking
      overeenkomstig [Hoofdstuk II, Afdeling 1][ref1], van deze wet, komt ten bate van de staat.


      [ref1]: https://wetten.overheid.nl/BWBR0022604#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0022604
        hoofdstuk: II
        afdeling: '1'
  - number: '23.2'
    text: |-
      De Minister van Justitie kan met de uitvaardigende lidstaat overeenkomen dat de verkregen baten geheel of
      gedeeltelijk worden verstrekt aan de uitvaardigende lidstaat.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel23
  - number: '24'
    text: |-
      Op betekeningen, kennisgevingen en oproepingen gedaan krachtens deze wet, zijn de
      [artikelen 585 tot en met 590 van het Wetboek van Strafvordering][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel585
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '585'
  - number: '25'
    text: |-
      Indien met toepassing van [artikel 558, tweede lid, van het Wetboek van Strafvordering][ref1] gratie is verleend
      van een sanctie die met toepassing van de bepalingen van deze wet in Nederland is erkend en ten uitvoer wordt
      gelegd, wordt de bevoegde autoriteit van de uitvaardigende lidstaat hiervan onverwijld schriftelijk in kennis
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel558
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '558'
  - number: '28'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel28
  - number: '29'
    text: 'Deze wet wordt aangehaald als: Wet wederzijdse erkenning en tenuitvoerlegging strafrechtelijke sancties.'
    url: https://wetten.overheid.nl/BWBR0022604/2007-12-01#Artikel29
