  - number: '11.2'
    text: |-
      Indien de ten uitvoer te leggen beslissing is opgelegd bij beschikking en betrekking heeft
      op gedragingen in strijd met de verkeersregels, met inbegrip van overtredingen van de rij- en
      rusttijdenwetgeving en van de wetgeving inzake gevaarlijke goederen zijn, in voorkomend geval, de
      [artikelen 28 tot en met 30 van de Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref1] van
      overeenkomstige toepassing, met dien verstande dat de kantonrechter van de rechtbank van het arrondissement
      Noord-Nederland bevoegd is de vordering tot het verlenen van de machtiging tot het toepassen van het dwangmiddel
      gijzeling te behandelen.


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel28
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: '28'
  - number: '11.3'
    text: |-
      De officier van justitie en Onze Minister kunnen de tenuitvoerlegging opschorten gedurende de periode die nodig is
      om de ten uitvoer te leggen beslissing te laten vertalen.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel11
  - number: '11.4'
    text: |-
      Behoudens de in [artikel 12][ref1] genoemde gevallen blijft de hoogte van de opgelegde geldelijke sanctie
      ongewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0022604#Artikel12
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0022604
        artikel: '12'
        hoofdstuk: II
        afdeling: '1'
  - number: '12.1'
    text: |-
      Ingeval de beslissing, houdende de geldelijke sanctie, strekt tot betaling van een geldboete die hoger is dan het
      wettelijke strafmaximum waarmee het desbetreffende feit naar Nederlands recht is bedreigd, verlaagt de officier van
      justitie de hoogte van het bedrag tot dat strafmaximum, indien het desbetreffende feit buiten het grondgebied van
      de uitvaardigende lidstaat is gepleegd en daarover naar Nederlands recht rechtsmacht kon worden uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel12
  - number: '12.2'
    text: |-
      Indien de veroordeelde aannemelijk maakt dat reeds betalingen zijn verricht ter voldoening van de geldelijke
      sanctie, raadpleegt Onze Minister de bevoegde autoriteit van de uitvaardigende lidstaat hierover.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel12
  - number: '12.3'
    text: Reeds geïnde bedragen worden geheel in mindering gebracht op het verschuldigde bedrag.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel12
  - number: '12.4'
    text: |-
      Wordt de hoogte van het verschuldigde bedrag op grond van het eerste of derde lid aangepast, dan stelt de officier
      van justitie respectievelijk Onze Minister de bevoegde autoriteit van de uitvaardigende lidstaat hiervan onverwijld
      schriftelijk in kennis.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel12
  - number: '13.1'
    text: |-
      De officier van justitie weigert de erkenning en tenuitvoerlegging van de beslissing, houdende een geldelijke
      sanctie, indien:
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel13
  - number: 13.1.a
    text: |-
      de geldelijke sanctie is opgelegd naar aanleiding van een feit waarover ten aanzien van degene aan wie de
      geldelijke sanctie is opgelegd:
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel13
  - number: 13.1.a.1°
    text: door de Nederlandse rechter reeds onherroepelijk is beslist;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel13
  - number: 13.1.a.2°
    text: door een andere rechter reeds een straf is opgelegd welke ten uitvoer is gelegd;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel13
  - number: 13.1.b
    text: |-
      behoudens het bepaalde in het tweede lid, het feit waarvoor de geldelijke sanctie is opgelegd, indien het in
      Nederland was begaan, naar Nederlands recht niet strafbaar zou zijn;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel13
  - number: 13.1.c
    text: |-
      over het feit waarvoor de geldelijke sanctie is opgelegd naar Nederlands recht rechtsmacht kon worden uitgeoefend
      en het recht tot uitvoering van de geldelijke sanctie naar Nederlands recht zou zijn verjaard;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel13
  - number: 13.1.d
    text: |-
      de tenuitvoerlegging van de beslissing, houdende de geldelijke sanctie, onverenigbaar is met een naar Nederlands
      recht geldende immuniteit;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel13
  - number: 13.1.e
    text: de veroordeelde ten tijde van het begaan van het feit de leeftijd van twaalf jaren nog niet had bereikt;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel13
  - number: 13.1.f
    text: |-
      het certificaat niet is overgelegd, onvolledig is of kennelijk niet in overeenstemming is met de beslissing en niet
      aan het verzoek, bedoeld in [artikel 7, tweede lid][ref1], is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0022604#Artikel7
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0022604
        artikel: '7'
        hoofdstuk: I
  - number: '13.2'
    text: |-
      De tenuitvoerlegging van een beslissing wordt niet geweigerd op grond van het eerste lid, onderdeel b, indien het
      feit waarvoor de geldelijke sanctie is opgelegd, is vermeld op of valt onder de bij algemene maatregel van bestuur
      vastgestelde lijst met feiten en soorten van feiten.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel13
  - number: '13.3'
    text: |-
      De tenuitvoerlegging van de beslissing houdende een geldelijke sanctie wordt niet geweigerd op grond van het eerste
      lid, onderdeel c, dan nadat de bevoegde autoriteit van de uitvaardigende lidstaat in de gelegenheid is gesteld
      hieromtrent inlichtingen te verschaffen.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel13
  - number: 13a.1
    text: |-
      De officier van justitie weigert de erkenning en tenuitvoerlegging van de beslissing houdende een geldelijke
      sanctie, indien uit het certificaat blijkt, dat
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel13a
  - number: 13a.1.a
    text: |-
      de veroordeelde, indien de geldsanctie bij beschikking is opgelegd, niet in overeenstemming met het recht van de
      uitvaardigende lidstaat in persoon of via een naar het nationale recht bevoegde vertegenwoordiger in kennis is
      gesteld van zijn recht om de zaak te betwisten, alsmede van de termijnen waarbinnen dat rechtsmiddel moet worden
      aangewend; of
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel13a
  - number: 13a.1.b
    text: |-
      de veroordeelde niet in persoon is verschenen bij de behandeling ter terechtzitting die tot de beslissing, houdende
      een geldelijke sanctie heeft geleid, tenzij in het certificaat is vermeld dat de veroordeelde, overeenkomstig de
      procedurevoorschriften van de uitvaardigende lidstaat:
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel13a
  - number: 13a.1.b.1°
    text: |-
      tijdig en in persoon is gedagvaard en daarbij op de hoogte is gebracht van de datum en de plaats van de behandeling
      ter terechtzitting die tot de beslissing, houdende een geldelijke sanctie heeft geleid of anderszins daadwerkelijk
      officieel in kennis is gesteld van de datum en de plaats van de behandeling ter terechtzitting, zodat op
      ondubbelzinnige wijze vaststaat dat hij op de hoogte was van de voorgenomen terechtzitting en ervan in kennis is
      gesteld dat een beslissing kan worden genomen wanneer hij niet ter terechtzitting verschijnt; of
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel13a
  - number: 13a.1.b.2°
    text: |-
      op de hoogte was van de voorgenomen behandeling ter terechtzitting en een door hem gekozen of een hem
      van overheidswege toegewezen advocaat heeft gemachtigd zijn verdediging te voeren en dat die advocaat ter
      terechtzitting zijn verdediging heeft gevoerd; of
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel13a
  - number: 13a.1.b.3°
    text: |-
      nadat de beslissing, houdende een geldelijke sanctie aan hem was betekend en hij uitdrukkelijk was geïnformeerd
      over zijn recht op een verzetprocedure of een procedure in hoger beroep waarbij hij het recht heeft aanwezig te
      zijn en tijdens welke de zaak opnieuw ten gronde wordt behandeld en nieuw bewijsmateriaal wordt toegelaten, en
      die kan leiden tot herziening van de oorspronkelijke beslissing, uitdrukkelijk te kennen heeft gegeven dat hij de
      beslissing niet betwist of niet binnen de voorgeschreven termijn verzet of hoger beroep heeft aangetekend; of
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel13a
  - number: 13a.1.c
    text: |-
      de veroordeelde niet in persoon is verschenen, tenzij in het certificaat is vermeld dat de veroordeelde, na
      uitdrukkelijk te zijn geïnformeerd over de behandeling ter terechtzitting en over de mogelijkheid om in persoon
      ter terechtzitting aanwezig te zijn, uitdrukkelijk heeft verklaard afstand te doen van zijn recht op een mondelinge
      behandeling en uitdrukkelijk te kennen heeft gegeven dat hij de zaak niet betwist.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel13a
  - number: 13a.2
    text: |-
      De tenuitvoerlegging van de beslissing, houdende een geldelijke sanctie wordt niet op grond van het eerste lid
      geweigerd dan nadat de bevoegde autoriteit van de uitvaardigende lidstaat in de gelegenheid is gesteld hieromtrent
      inlichtingen te verschaffen.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel13a
  - number: '14'
    text: |-
      De officier van justitie kan de erkenning en tenuitvoerlegging van een beslissing, houdende een geldelijke sanctie,
      weigeren indien:
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel14
  - number: 14.a
    text: 'het feit waarvoor de geldelijke sanctie is opgelegd:'
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel14
  - number: 14.a.1°
    text: |-
      geacht wordt geheel of gedeeltelijk op Nederlands grondgebied of buiten Nederland aan boord van een Nederlands
      vaartuig of luchtvaartuig te zijn gepleegd; of
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel14
  - number: 14.a.2°
    text: |-
      buiten het grondgebied van de uitvaardigende lidstaat is gepleegd, terwijl naar Nederlands recht geen vervolging
      zou kunnen worden ingesteld indien het feit buiten Nederland zou zijn gepleegd;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel14
  - number: 14.b
    text: de hoogte van de geldelijke sanctie 70 euro of minder bedraagt.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel14
  - number: 14a
    text: |-
      Indien de officier van justitie op grond van een van de in de [artikelen 13][ref1], [13a][ref2] en [14][ref3]
      genoemde gronden de tenuitvoerlegging van de geldelijke sanctie weigert, stelt hij de bevoegde autoriteit van de
      uitvaardigende lidstaat daarvan onverwijld, schriftelijk en met redenen omkleed in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0022604#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0022604#Artikel13a
      [ref3]: https://wetten.overheid.nl/BWBR0022604#Artikel14
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0022604
        artikel: '13'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0022604
        artikel: 13a
        hoofdstuk: II
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0022604
        artikel: '14'
        hoofdstuk: II
        afdeling: '1'
  - number: '15.1'
    text: |-
      De veroordeelde kan zich tegen het nemen van verhaal verzetten.
      [Artikel 6:4:5, derde lid, van het Wetboek van Strafvordering][ref1] is van toepassing, met dien verstande dat het
      bezwaarschrift wordt ingediend bij de rechtbank Noord-Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
  - number: '15.2'
    text: |-
      Ten aanzien van derden die geheel of gedeeltelijk recht menen te hebben op voorwerpen waarop verhaal wordt genomen,
      zijn de bepalingen van het [Wetboek van Burgerlijke Rechtsvordering][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '16.1'
    text: |-
      Indien de geldelijke sanctie is opgelegd bij rechterlijke uitspraak waarbij tevens een tot vervangende
      hechtenis strekkende sanctie is opgelegd, kan de rechter op vordering van de officier van justitie verlof
      tot tenuitvoerlegging van die vervangende hechtenis verlenen. De vordering wordt slechts ingesteld indien de
      veroordeelde niet aan de verplichting tot betaling van de geldelijke sanctie voldoet, volledig verhaal op grond
      van de [artikelen 6:4:4 tot en met 6:4:6 van het Wetboek van Strafvordering][ref1] op diens inkomsten of vermogen
      niet mogelijk is gebleken en de bevoegde autoriteit van de uitvaardigende lidstaat met de tenuitvoerlegging van die
      vervangende hechtenis heeft ingestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
  - number: '16.2'
    text: De vordering wordt ingesteld bij en behandeld door de raadkamer van de rechtbank Noord-Nederland.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel16
  - number: '16.3'
    text: |-
      De officier van justitie roept de veroordeelde op voor de behandeling van de vordering. De behandeling vindt plaats
      in het openbaar.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel16
  - number: '16.4'
    text: |-
      De vordering wordt niet toegewezen indien het feit waarvoor de sanctie is opgelegd, indien het in Nederland was
      begaan, naar Nederlands recht niet strafbaar zou zijn.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel16
  - number: '16.5'
    text: |-
      Bij de beoordeling van de vordering houdt de raadkamer rekening met gedeeltelijke
      betalingen die door de veroordeelde zijn verricht en het verhaal dat reeds ingevolge de
      [artikelen 6:4:4 tot en met 6:4:6 van het Wetboek van Strafvordering][ref1] is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
  - number: '16.6'
    text: |-
      Bij toewijzing van de vordering bepaalt de raadkamer de duur van de vervangende
      hechtenis. [Artikel 24c, tweede en derde lid, van het Wetboek van Strafrecht][ref1] en
      [artikel 6:4:7 van het Wetboek van Strafvordering][ref2] is van toepassing. De duur wordt niet hoger bepaald dan
      het maximum dat door de bevoegde autoriteit van de uitvaardigende lidstaat is aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel24c
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 24c
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '6'
  - number: '16.7'
    text: |-
      De beslissing van de raadkamer wordt aan de veroordeelde betekend. De [artikelen 6:1:6][ref1] en
      [6:1:15 van het Wetboek van Strafvordering][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '6'
  - number: '16.8'
    text: |-
      De tot vervangende hechtenis strekkende sanctie kan te allen tijde worden beëindigd door de officier van justitie.
      De hechtenis eindigt indien de veroordeelde alsnog volledig voldoet aan de verplichting tot betaling van de
      geldboete.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel16
  - number: '16.9'
    text: |-
      Indien de vordering wordt toegewezen en de tot vervangende hechtenis strekkende sanctie ten uitvoer wordt gelegd,
      stelt Onze Minister de bevoegde autoriteit van de uitvaardigende lidstaat hiervan onverwijld schriftelijk in
      kennis.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel16
  - number: '17.1'
    text: |-
      Onze Minister zendt de beslissing vergezeld van een ingevuld certificaat dat is opgesteld overeenkomstig het bij
      algemene maatregel van bestuur vastgestelde model, rechtstreeks aan de autoriteiten van de uitvoerende lidstaat die
      bevoegd zijn de beslissing te erkennen en ten uitvoer te leggen.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel17
  - number: '17.2'
    text: |-
      Indien niet bekend is welke autoriteiten in de uitvoerende lidstaat bevoegd zijn tot erkenning en
      tenuitvoerlegging, verzoekt Onze Minister hieromtrent om inlichtingen.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel17
  - number: '17.3'
    text: De beslissing wordt niet aan twee of meer lidstaten tegelijkertijd toegezonden.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel17
  - number: '17.4'
    text: |-
      De toezending kan plaatsvinden per gewone post, telefax of elektronische post, mits de echtheid van de toegezonden
      documenten door de bevoegde autoriteit van de uitvoerende lidstaat kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel17
  - number: '17.5'
    text: |-
      Op verzoek van de bevoegde autoriteit van de uitvoerende lidstaat, stuurt Onze Minister deze een gewaarmerkt
      afschrift van de rechterlijke uitspraak of beschikking dan wel het origineel van het certificaat toe.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel17
  - number: '18.1'
    text: |-
      Het recht van tenuitvoerlegging in Nederland van de aan de uitvoerende lidstaat toegezonden beslissing, wordt
      opgeschort gedurende de periode dat de beslissing ten uitvoer wordt gelegd in die andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel18
  - number: '18.2'
    text: 'Tot tenuitvoerlegging kan worden overgegaan zodra:'
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel18
  - number: 18.2.a
    text: |-
      van de bevoegde autoriteit van de uitvoerende lidstaat bericht is ontvangen dat de beslissing geheel of
      gedeeltelijk niet ten uitvoer is gelegd; of
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel18
  - number: 18.2.b
    text: |-
      een kennisgeving als bedoeld in [artikel 21][ref1] is verzonden.


      [ref1]: https://wetten.overheid.nl/BWBR0022604#Artikel21
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0022604
        artikel: '21'
        hoofdstuk: II
        afdeling: '2'
  - number: '19'
    text: |-
      Indien na toezending van een beslissing aan de uitvoerende lidstaat een geldsom is ontvangen ter voldoening van
      het verschuldigde bedrag, wordt de bevoegde autoriteit van de uitvoerende lidstaat hiervan door of vanwege Onze
      Minister onverwijld in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel19
  - number: '20'
    text: |-
      Ingeval de aan de uitvoerende lidstaat toegezonden beslissing strekt tot betaling aan de staat van een geldsom ten
      behoeve van het slachtoffer, keert de staat, zodra van de uitvoerende lidstaat een kennisgeving is ontvangen dat
      een bedrag is ontvangen, dat bedrag uit aan het slachtoffer.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel20
  - number: '21'
    text: |-
      Indien de officier van justitie of Onze Minister beslist dat de tenuitvoerlegging van de beslissing in de
      uitvoerende lidstaat moet worden gestaakt, wordt de bevoegde autoriteit in de uitvoerende lidstaat hiervan
      onverwijld schriftelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel21
  - number: '22.1'
    text: |-
      Deze afdeling is van toepassing op een beslissing tot confiscatie van een andere lidstaat van de Europese Unie die
      niet is gebonden door [Verordening 2018/1805](33705R2018).
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel22
  - number: '22.2'
    text: |-
      Een voor erkenning vatbare beslissing tot confiscatie wordt erkend en ten uitvoer gelegd volgens Nederlands recht.
      Voor zover de beslissing tot confiscatie:
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel22
  - number: 22.2.a
    text: |-
      strekt tot betaling van een geldbedrag aan de staat ter ontneming van wederrechtelijk verkregen voordeel,
      wordt de beslissing ten uitvoer gelegd overeenkomstig de [artikelen 6:1:9][ref1], [6:4:9, eerste lid][ref2],
      en [6:6:25 van het Wetboek van Strafvordering][ref3], met dien verstande dat de rechtbank Noord-
      Nederland bevoegd is de vordering te behandelen tot het toepassen van het dwangmiddel gijzeling en daarbij
      [artikel 36e, elfde lid, van het Wetboek van Strafrecht][ref4] van overeenkomstige toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel36e
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: 36e
  - number: 22.2.b
    text: |-
      betrekking heeft op een specifiek voorwerp, wordt de beslissing overeenkomstig
      [artikel 6:5:1 van het Wetboek van Strafvordering][ref1] ten uitvoer gelegd, tenzij in deze wet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
  - number: '22.3'
    text: |-
      Indien de beslissing tot confiscatie betrekking heeft op een specifiek voorwerp, kan de officier van
      justitie met de bevoegde autoriteit van de uitvaardigende lidstaat overeenkomen, dat de tenuitvoerlegging
      geschiedt in de vorm van een verplichting tot betaling van een bepaald geldbedrag aan de staat. In voorkomend
      geval zijn de [artikelen 6:1:1][ref1], [6:1:2][ref2], [6:1:9][ref3], [6:4:1 tot en met 6:4:6][ref4] en
      [6:4:8 van het Wetboek van Strafvordering][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '6'
      - id: ref5
        bwb_id: BWBR0001903
        artikel: '6'
  - number: '22.4'
    text: |-
      Een vervangende straf of maatregel wordt slechts ten uitvoer gelegd nadat de bevoegde autoriteit in de
      uitvaardigende lidstaat daartoe toestemming heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel22
  - number: '23.1'
    text: |-
      In geval van samenloop van beslissingen als bedoeld in [artikel 6, eerste lid, onderdeel B][ref1] beslist de
      officier van justitie aan welke beslissing tot confiscatie voorrang zal worden gegeven, daarbij rekening houdend
      met alle feiten en omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0022604#Artikel6
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0022604
        artikel: '6'
        hoofdstuk: I
  - number: '23.2'
    text: |-
      Indien de betrokkene bewijs levert van gehele of gedeeltelijke confiscatie in een andere staat, raadpleegt Onze
      Minister de bevoegde autoriteit van de uitvaardigende lidstaat. In geval van confiscatie van opbrengsten worden
      de delen van het bedrag die naar aanleiding van de beslissing tot confiscatie reeds in een andere staat zijn
      geconfisqueerd, volledig in mindering gebracht op het in Nederland te confisqueren geldbedrag.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel23
  - number: '24.1'
    text: 'De officier van justitie weigert de erkenning en tenuitvoerlegging van de beslissing tot confiscatie, indien:'
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel24
  - number: 24.1.a
    text: |-
      de beslissing tot confiscatie is genomen naar aanleiding van een feit waarover ten aanzien van degene aan wie die
      beslissing is opgelegd:
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel24
  - number: 24.1.a.1°
    text: door de Nederlandse rechter reeds onherroepelijk is beslist;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel24
  - number: 24.1.a.2°
    text: door een andere rechter reeds een straf of maatregel is opgelegd welke ten uitvoer is gelegd;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel24
  - number: 24.1.b
    text: |-
      behoudens het bepaalde in het tweede lid, het feit dat ten grondslag ligt aan de strafzaak in verband waarmee de
      beslissing tot confiscatie is opgelegd, indien het in Nederland was begaan, naar Nederlands recht niet strafbaar
      zou zijn;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel24
  - number: 24.1.c
    text: |-
      over het feit dat ten grondslag ligt aan de strafzaak in verband waarmee de beslissing tot confiscatie is genomen,
      naar Nederlands recht rechtsmacht kon worden uitgeoefend en het recht tot tenuitvoerlegging van de beslissing tot
      confiscatie naar Nederlands recht zou zijn verjaard;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel24
  - number: 24.1.d
    text: |-
      de tenuitvoerlegging van de beslissing tot confiscatie onverenigbaar is met een naar Nederlands recht geldende
      immuniteit;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel24
  - number: 24.1.e
    text: de rechten van belanghebbenden de tenuitvoerlegging van die beslissing tot confiscatie onmogelijk maken;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel24
  - number: 24.1.f
    text: |-
      het certificaat niet is overgelegd, onvolledig is of kennelijk niet in overeenstemming is met de beslissing en niet
      aan het verzoek, bedoeld in [artikel 7, tweede lid][ref1], is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0022604#Artikel7
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0022604
        artikel: '7'
        hoofdstuk: I
  - number: '24.2'
    text: |-
      De tenuitvoerlegging van een beslissing wordt niet geweigerd op grond van het eerste lid, onderdeel b, indien het
      feit waarvoor de beslissing tot confiscatie is opgelegd, is vermeld op of valt onder de bij algemene maatregel
      van bestuur vastgestelde lijst met feiten en soorten van feiten en het feit in de uitvaardigende lidstaat wordt
      bedreigd met een maximale vrijheidsstraf van ten minste drie jaren.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel24
  - number: '24.3'
    text: |-
      De erkenning en tenuitvoerlegging van de beslissing tot confiscatie worden niet geweigerd op grond van het
      onderdeel a, dan nadat de bevoegde autoriteit van de uitvaardigende lidstaat in de gelegenheid is gesteld
      hieromtrent inlichtingen te verschaffen. Hetzelfde geldt voor een weigering op grond van onderdeel e van het eerste
      lid, indien er geen rechtsmiddel als bedoeld in [artikel 27][ref1] is ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0022604#Artikel27
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0022604
        artikel: '27'
        hoofdstuk: III
        afdeling: '1'
  - number: 24a.1
    text: |-
      De officier van justitie weigert de erkenning en tenuitvoerlegging van de beslissing tot confiscatie, indien uit
      het certificaat blijkt, dat de veroordeelde niet in persoon is verschenen bij de behandeling ter terechtzitting
      die tot de beslissing tot confiscatie heeft geleid, tenzij in het certificaat is vermeld dat de veroordeelde,
      overeenkomstig de procedurevoorschriften van de uitvaardigende lidstaat:
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel24a
  - number: 24a.1.1°
    text: |-
      tijdig en in persoon is gedagvaard en daarbij op de hoogte is gebracht van de datum en de plaats van de behandeling
      ter terechtzitting die tot de beslissing tot confiscatie heeft geleid of anderszins daadwerkelijk officieel
      in kennis is gesteld van de datum en de plaats van de behandeling ter terechtzitting, zodat op ondubbelzinnige
      wijze vaststaat dat hij op de hoogte was van de voorgenomen terechtzitting en ervan in kennis is gesteld dat een
      beslissing kan worden genomen wanneer hij niet ter terechtzitting verschijnt; of
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel24a
  - number: 24a.1.2°
    text: |-
      op de hoogte was van de voorgenomen behandeling ter terechtzitting en een door hem gekozen of een hem
      van overheidswege toegewezen advocaat heeft gemachtigd zijn verdediging te voeren en dat die advocaat ter
      terechtzitting zijn verdediging heeft gevoerd; of
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel24a
  - number: 24a.1.3°
    text: |-
      nadat de beslissing tot confiscatie aan hem was betekend en hij uitdrukkelijk was geïnformeerd over zijn recht op
      een verzetprocedure of een procedure in hoger beroep, waarbij hij het recht heeft aanwezig te zijn en tijdens welke
      de zaak opnieuw ten gronde wordt behandeld en nieuw bewijsmateriaal wordt toegelaten, die kan leiden tot herziening
      van de oorspronkelijke beslissing, uitdrukkelijk te kennen heeft gegeven dat hij de beslissing niet betwist of niet
      binnen de voorgeschreven termijn verzet of hoger beroep heeft aangetekend.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel24a
  - number: 24a.2
    text: |-
      De tenuitvoerlegging van de beslissing tot confiscatie wordt niet op grond van het eerste lid geweigerd dan nadat
      de bevoegde autoriteit van de uitvaardigende lidstaat in de gelegenheid is gesteld hieromtrent inlichtingen te
      verschaffen.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel24a
  - number: '25.1'
    text: |-
      De officier van justitie kan de erkenning en tenuitvoerlegging van een beslissing tot confiscatie weigeren indien
      het feit waarvoor de beslissing tot confiscatie is opgelegd:
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel25
  - number: 25.1.1°
    text: |-
      geacht wordt geheel of gedeeltelijk op Nederlands grondgebied of buiten Nederland aan boord van een Nederlands
      vaartuig of luchtvaartuig te zijn gepleegd; of
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel25
  - number: 25.1.2°
    text: |-
      buiten het grondgebied van de uitvaardigende lidstaat is gepleegd, terwijl naar Nederlands recht geen vervolging
      zou kunnen worden ingesteld indien het feit buiten Nederland zou zijn gepleegd.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel25
  - number: '25.2'
    text: |-
      Tevens kan de officier van justitie de erkenning en tenuitvoerlegging van een beslissing tot confiscatie weigeren
      indien hij van oordeel is dat die beslissing is gegeven met toepassing van verruimde confiscatiebevoegdheden zoals
      bedoeld in [artikel 1, onderdeel g, onder 4°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022604#Artikel1
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0022604
        artikel: '1'
        hoofdstuk: I
  - number: '25.3'
    text: |-
      De erkenning en tenuitvoerlegging van de beslissing tot confiscatie worden niet geweigerd op grond van dit
      artikel, dan nadat de bevoegde autoriteit van de uitvaardigende lidstaat in de gelegenheid is gesteld hieromtrent
      inlichtingen te verschaffen.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel25
  - number: '26.1'
    text: 'De tenuitvoerlegging van een beslissing tot confiscatie kan worden opgeschort indien:'
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel26
  - number: 26.1.a
    text: |-
      de beslissing tot confiscatie een geldsom betreft die tevens aan een of meer andere lidstaten is gezonden met het
      oog op de tenuitvoerlegging aldaar en Onze Minister van oordeel is dat het risico bestaat dat de totale opbrengst
      van de tenuitvoerlegging hoger is dan het in de beslissing tot confiscatie bepaalde bedrag;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel26
  - number: 26.1.b
    text: het belang van een lopend strafrechtelijk onderzoek zich verzet tegen de tenuitvoerlegging van de beslissing;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel26
  - number: 26.1.c
    text: vertaling van de beslissing tot confiscatie nodig wordt geacht;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel26
  - number: 26.1.d
    text: |-
      de beslissing tot confiscatie betrekking heeft op een specifiek voorwerp en met betrekking tot dit voorwerp reeds
      een procedure tot confiscatie loopt.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel26
  - number: '26.2'
    text: |-
      Onze Minister geeft de autoriteiten van de uitvaardigende lidstaat onverwijld schriftelijk kennis van de
      opschorting van de tenuitvoerlegging. In de gevallen, bedoeld in het eerste lid, onderdelen b tot en met e, doet
      hij dit onder vermelding van de gronden en zo mogelijk van de verwachte duur van de opschorting.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel26
  - number: '26.3'
    text: |-
      Zodra de gronden voor opschorting zijn vervallen, wordt de beslissing ten uitvoer gelegd. De autoriteiten van de
      uitvaardigende lidstaat worden hiervan onverwijld schriftelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel26
  - number: '27.1'
    text: |-
      De veroordeelde, alsmede belanghebbenden, kunnen tegen de erkenning en tenuitvoerlegging van een beslissing tot
      confiscatie beroep instellen bij de rechtbank Noord-Nederland. Het beroep wordt ingesteld uiterlijk binnen zeven
      dagen, te rekenen van de dag dat de veroordeelde of belanghebbende kennis heeft gekregen van de beslissing tot
      erkenning en tenuitvoerlegging. De [artikelen 21 tot en met 25 van het Wetboek van Strafvordering][ref1] zijn van
      toepassing. Een ingesteld beroep heeft schorsende werking.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel21
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '21'
  - number: '27.2'
    text: |-
      Ten aanzien van belanghebbenden die geheel of gedeeltelijk recht menen te hebben op voorwerpen die op grond van
      deze wet in beslag zijn genomen, zijn de bepalingen van het [Wetboek van Burgerlijke Rechtsvordering][ref1] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '27.3'
    text: |-
      Indien een rechtsmiddel wordt ingesteld tegen de erkenning en tenuitvoerlegging van een beslissing tot confiscatie,
      wordt de bevoegde autoriteit van de uitvaardigende lidstaat hiervan in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel27
  - number: '27.4'
    text: |-
      [Artikel 15][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022604#Artikel15
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0022604
        artikel: '15'
        hoofdstuk: II
        afdeling: '1'
  - number: '28.1'
    text: |-
      Indien het geldbedrag dat uit de tenuitvoerlegging van de beslissing tot confiscatie wordt verkregen, hoger is
      dan € 10 000,–, wordt van de totale opbrengst de helft aan de uitvaardigende lidstaat overgedragen. Indien het
      geldbedrag dat uit de tenuitvoerlegging van de beslissing tot confiscatie wordt verkregen, lager is dan of gelijk
      is aan € 10 000,–, valt de gehele opbrengst toe aan de Staat. Bij of krachtens algemene maatregel van bestuur
      worden voorschriften gegeven met betrekking tot de wijze waarop deze verdeling plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel28
  - number: '28.2'
    text: |-
      Onze Minister kan beslissen dat specifieke voorwerpen, verkregen door de tenuitvoerlegging van een beslissing tot
      confiscatie:
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel28
  - number: 28.2.a
    text: worden verkocht, waarna de opbrengst van de verkoop overeenkomstig het eerste lid wordt verdeeld;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel28
  - number: 28.2.b
    text: aan de uitvaardigende lidstaat worden overgedragen;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel28
  - number: 28.2.c
    text: worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel28
  - number: '28.3'
    text: |-
      De voorwerpen worden niet verkocht of teruggegeven, indien het cultuurgoederen zijn die deel uitmaken van het
      Nederlandse culturele erfgoed.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel28
  - number: '28.4'
    text: |-
      Indien de voorwerpen met toepassing van [artikel 6:4:3, eerste lid, van het Wetboek van Strafvordering][ref1] zijn
      verkregen, worden deze niet aan de uitvaardigende lidstaat overgedragen, dan nadat deze daarvoor toestemming heeft
      gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
  - number: '28.5'
    text: |-
      Onze Minister kan met de uitvaardigende lidstaat overeenkomen dat de geconfisqueerde voorwerpen anders worden
      verdeeld dan volgens het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel28
  - number: '29.1'
    text: |-
      Indien de officier van justitie op grond van de [artikelen 24, eerste lid][ref1], [24a, eerste lid][ref2],
      of [25, eerste lid][ref3], de erkenning en tenuitvoerlegging van de beslissing tot confiscatie weigert, stelt
      hij de bevoegde autoriteit van de uitvaardigende lidstaat hiervan onverwijld schriftelijk en met redenen omkleed
      in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0022604#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0022604#Artikel24a
      [ref3]: https://wetten.overheid.nl/BWBR0022604#Artikel25
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0022604
        artikel: '24'
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0022604
        artikel: 24a
        hoofdstuk: III
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0022604
        artikel: '25'
        hoofdstuk: III
        afdeling: '1'
  - number: '29.2'
    text: |-
      Indien de tenuitvoerlegging van de beslissing tot confiscatie niet, of niet geheel slaagt, stelt de officier van
      justitie de bevoegde autoriteit van de uitvaardigende lidstaat hiervan onverwijld met redenen omkleed in kennis.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel29
  - number: '29.3'
    text: |-
      Van de toepassing van een vervangende straf of maatregel stelt de officier van justitie de bevoegde autoriteit van
      de uitvaardigende lidstaat onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel29
  - number: '29.4'
    text: |-
      Indien tenuitvoerlegging van de beslissing tot confiscatie onmogelijk blijkt, zulks nadat de bevoegde autoriteit
      van de uitvaardigende lidstaat door de bevoegde autoriteit van de uitvoerende lidstaat in de gelegenheid is
      gesteld nadere gegevens met betrekking tot het voorwerp waarop de beslissing tot confiscatie betrekking heeft te
      verstrekken, wordt de bevoegde autoriteit van de uitvaardigende lidstaat daarvan onverwijld schriftelijk in kennis
      gesteld.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel29
  - number: '30.1'
    text: |-
      Voorwerpen ten aanzien waarvan de uitvaardigende lidstaat een beslissing tot confiscatie aan Nederland heeft
      gezonden met het oog op erkenning en tenuitvoerlegging, alsmede voorwerpen die kunnen dienen om het recht tot
      verhaal te bewaren, kunnen door de officier van justitie in beslag worden genomen.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel30
  - number: '30.2'
    text: |-
      Inbeslagneming overeenkomstig het eerste lid vindt slechts plaats in gevallen waarin gegronde redenen bestaan voor
      de verwachting dat de beslissing tot confiscatie op korte termijn in Nederland ten uitvoer zal worden gelegd.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel30
  - number: '31.1'
    text: |-
      Deze afdeling is van toepassing op een beslissing tot confiscatie van een andere lidstaat van de Europese Unie die
      niet is gebonden door [Verordening 2018/1805](33705R2018).
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel31
  - number: '31.2'
    text: |-
      Onze Minister zendt een gewaarmerkt afschrift van de beslissing tot confiscatie, vergezeld van een ingevuld
      certificaat dat is opgesteld overeenkomstig het bij algemene maatregel van bestuur vastgestelde model rechtstreeks
      aan de autoriteit van de uitvoerende lidstaat die bevoegd is de beslissing te erkennen en ten uitvoer te leggen,
      op een wijze die de mogelijkheid biedt een schriftelijk document voort te brengen op grond waarvan de echtheid kan
      worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel31
  - number: '31.3'
    text: |-
      Op verzoek van de uitvoerende lidstaat worden een voor eensluidend gewaarmerkt afschrift van de beslissing tot
      confiscatie en het originele exemplaar van het certificaat aan de uitvoerende lidstaat toegezonden.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel31
  - number: '31.4'
    text: |-
      Indien niet bekend is welke autoriteiten in de uitvoerende lidstaat bevoegd zijn tot erkenning en
      tenuitvoerlegging, verzoekt Onze Minister hieromtrent om inlichtingen onder andere bij het Europees Justitieel
      Netwerk.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel31
  - number: '31.5'
    text: |-
      Behoudens de gevallen, bedoeld in het zesde en zevende lid, wordt de beslissing niet aan twee of meer lidstaten
      tegelijkertijd toegezonden.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel31
  - number: '31.6'
    text: |-
      Onze Minister kan een in Nederland genomen beslissing tot confiscatie die betrekking heeft op een geldbedrag
      slechts aan meer dan een lidstaat tegelijkertijd toezenden, indien hij van oordeel is dat alleen door meervoudige
      toezending de volledige tenuitvoerlegging van de beslissing tot confiscatie kan worden bereikt. Onze Minister
      draagt er zorg voor dat de totale opbrengst van de tenuitvoerlegging niet meer bedraagt dan het in de beslissing
      tot confiscatie bepaalde maximumbedrag.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel31
  - number: '31.7'
    text: |-
      Onze Minister kan een in Nederland genomen beslissing tot confiscatie die betrekking heeft op een of meer
      specifieke voorwerpen slechts aan meer dan een lidstaat tegelijkertijd toezenden, indien:
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel31
  - number: 31.7.a
    text: |-
      hij redelijke vermoedens heeft dat verschillende voorwerpen waarop de beslissing betrekking heeft, zich in
      verschillende lidstaten bevinden;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel31
  - number: 31.7.b
    text: |-
      de confiscatie van dat specifieke voorwerp waarop die beslissing betrekking heeft, noodzaakt tot optreden in meer
      dan een lidstaat;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel31
  - number: 31.7.c
    text: |-
      hij redelijke vermoedens heeft dat een specifiek voorwerp waarop de beslissing betrekking heeft, zich in een van
      twee of meer lidstaten bevindt.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel31
  - number: '32'
    text: |-
      Het recht van tenuitvoerlegging in Nederland van de aan de uitvoerende lidstaat toegezonden beslissing blijft
      bestaan, onverminderd de toepassing van de bepalingen in [artikel 31][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022604#Artikel31
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0022604
        artikel: '31'
        hoofdstuk: III
        afdeling: '2'
  - number: '33.1'
    text: |-
      Indien Onze Minister beslist dat de tenuitvoerlegging van de beslissing tot confiscatie in de uitvoerende lidstaat
      moet worden gestaakt, stelt hij de bevoegde autoriteit hiervan onverwijld schriftelijk in kennis.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel33
  - number: '33.2'
    text: |-
      In geval van toepassing van [artikel 31, zesde en zevende lid][ref1], stelt Onze Minister onmiddellijk de bevoegde
      autoriteiten in alle uitvoerende lidstaten in kennis, indien


      [ref1]: https://wetten.overheid.nl/BWBR0022604#Artikel31
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0022604
        artikel: '31'
        hoofdstuk: III
        afdeling: '2'
  - number: 33.2.a
    text: |-
      hij van oordeel is dat het risico bestaat dat het in de beslissing tot confiscatie bepaalde maximumbedrag zal
      worden overschreden;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel33
  - number: 33.2.b
    text: |-
      de beslissing tot confiscatie geheel of ten dele ten uitvoer is gelegd in Nederland of een van de andere
      uitvoerende staten; indien van toepassing wordt het nog ten uitvoer te leggen bedrag gespecificeerd;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel33
  - number: 33.2.c
    text: |-
      Onze Minister een geldsom ontvangt die de veroordeelde vrijwillig heeft betaald in het kader van de beslissing tot
      confiscatie, na de toezending van die beslissing tot confiscatie naar een andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel33
  - number: '34'
    text: |-
      Deze afdeling is van toepassing op een confiscatiebevel van een andere lidstaat van de Europese Unie die is
      gebonden door [Verordening 2018/1805](33705R2018).
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel34
  - number: '35.1'
    text: |-
      Een confiscatiebevel wordt erkend overeenkomstig [Verordening 2018/1805](33705R2018). Voor zover het bevel
      betrekking heeft op de confiscatie van:
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel35
  - number: 35.1.a
    text: |-
      een geldsom, wordt het bevel ten uitvoer gelegd overeenkomstig de [artikelen 6:1:1 tot en met 6:1:5][ref1],
      [6:1:9][ref2] en [6:6:25 van het Wetboek van Strafvordering][ref3], de
      [tweede titel van het vierde hoofdstuk van het Zesde Boek van het Wetboek van Strafvordering][ref4]
      en de regels die bij of krachtens algemene maatregel van bestuur op grond van
      [artikel 6:4:19 van het Wetboek van Strafvordering][ref5] zijn gesteld, met dien verstande dat de vordering tot de
      toepassing van het dwangmiddel gijzeling en het verzetschrift tegen de tenuitvoerlegging van een dwangbevel worden
      ingediend bij de rechtbank Noord-Nederland;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0001903
      [ref5]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0001903
      - id: ref5
        bwb_id: BWBR0001903
        artikel: '6'
  - number: 35.1.b
    text: |-
      een voorwerp, wordt het bevel ten uitvoer gelegd overeenkomstig de
      [artikelen 6:1:2 tot en met 6:1:5][ref1] en [6:1:9 van het Wetboek van Strafvordering][ref2], het
      [vijfde hoofdstuk van het Zesde Boek van het Wetboek van Strafvordering][ref3] en de regels die bij of krachtens
      algemene maatregel van bestuur op grond van [artikel 6:5:3 van het Wetboek van Strafvordering][ref4] zijn gesteld,
      met dien verstande dat het verzetschrift tegen de tenuitvoerlegging van een dwangbevel wordt ingediend bij de
      rechtbank Noord-Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Hoofdstuk5
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0001903
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '6'
  - number: '35.2'
    text: |-
      Indien de uitvaardigende autoriteit heeft besloten tot teruggave van een voorwerp, dan wel een overeenkomstige
      geldsom, aan het slachtoffer, of tot overdracht van een geldsom ter compensatie van het slachtoffer, wordt de
      tenuitvoerlegging van het bevel voltooid overeenkomstig artikel 30, eerste tot en met vierde lid, van [Verordening
      2018/1805](33705R2018).
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel35
  - number: '35.3'
    text: 'Indien het confiscatiebevel strekt tot:'
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel35
  - number: 35.3.a
    text: |-
      overdracht van een voorwerp, dan wel een voorwerp in plaats van een geldsom, aan de uitvaardigende staat, wordt
      de tenuitvoerlegging van het bevel voltooid overeenkomstig artikel 30, zesde lid, onderdeel b, van [Verordening
      2018/1805](33705R2018);
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel35
  - number: 35.3.b
    text: |-
      overdracht van een geldsom aan de uitvaardigende staat, wordt de tenuitvoerlegging van het bevel voltooid
      overeenkomstig artikel 30, zevende lid, van [Verordening 2018/1805](33705R2018).
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel35
  - number: '36'
    text: |-
      De officier van justitie of Onze Minister kan de erkenning onderscheidenlijk de tenuitvoerlegging van een
      confiscatiebevel weigeren als één van de gronden, bedoeld in artikel 19, eerste lid, van [Verordening 2018/1805]
      (33705R2018), van toepassing is.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel36
  - number: '37'
    text: |-
      Indien de officier van justitie twee of meer bevelen tot confiscatie of bevriezing uit verschillende lidstaten
      ontvangt die zijn uitgevaardigd tegen dezelfde persoon of betrekking hebben op hetzelfde voorwerp, beslist de
      officier van justitie welk van de bevelen ten uitvoer moet worden gelegd, overeenkomstig het bepaalde in artikel 26
      van [Verordening 2018/1805](33705R2018).
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel37
  - number: '38.1'
    text: |-
      Voorafgaand aan de beslissing tot erkenning van een confiscatiebevel kunnen voorwerpen in beslag worden genomen
      overeenkomstig de derde afdeling van [titel IV van het Eerste Boek van het Wetboek van Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '38.2'
    text: |-
      De [artikelen 552a][ref1], [552c tot en met 552d, eerste lid][ref2] en
      [552e, eerste lid, van het Wetboek van Strafvordering][ref3] zijn van overeenkomstige toepassing, met dien
      verstande dat de rechter niet treedt in een onderzoek naar de grondslag van het confiscatiebevel.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel552a
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel552c
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel552e
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 552a
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 552c
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 552e
  - number: '39.1'
    text: |-
      De veroordeelde, alsmede belanghebbenden, kunnen tegen de beslissing van de officier van justitie tot erkenning
      en tenuitvoerlegging van een confiscatiebevel beroep instellen bij de rechtbank Noord-Nederland. Het beroep
      wordt ingesteld uiterlijk binnen zeven dagen, te rekenen van de dag dat de veroordeelde of belanghebbende
      kennis heeft gekregen van de beslissing tot erkenning en tenuitvoerlegging van het confiscatiebevel. De
      [artikelen 21 tot en met 25 van het Wetboek van Strafvordering][ref1] zijn van toepassing. Het beroep heeft geen
      schorsende werking.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel21
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '21'
  - number: '39.2'
    text: |-
      Ten aanzien van derden die geheel of gedeeltelijk recht menen te hebben op voorwerpen waarop verhaal wordt genomen,
      zijn de bepalingen van het [Wetboek van Burgerlijke Rechtsvordering][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '40.1'
    text: |-
      Alle kosten van tenuitvoerlegging van een rechterlijke uitspraak, beslissing tot confiscatie, confiscatiebevel of
      beschikking in Nederland overeenkomstig de bepalingen van deze wet, komen ten laste van de staat.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel40
  - number: '40.2'
    text: |-
      Onze Minister kan de bevoegde autoriteit van de uitvaardigende lidstaat voorstellen de kosten van de
      tenuitvoerlegging te delen, indien het de tenuitvoerlegging van een rechterlijke uitspraak overeenkomstig
      [Hoofdstuk III, afdeling 1][ref1], of de tenuitvoerlegging van een confiscatiebevel overeenkomstig
      [Hoofdstuk III, afdeling 3][ref2], betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0022604#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0022604#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0022604
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0022604
        hoofdstuk: III
        afdeling: '3'
  - number: '40.3'
    text: |-
      Wanneer op grond van [artikel 31, tweede lid][ref1], of op grond van [Verordening 2018/1805](33705R2018), een
      lidstaat is verzocht een Nederlandse beslissing tot confiscatie te erkennen en ten uitvoer te leggen, kan Onze
      Minister instemmen met het verzoek van de tenuitvoerleggingsstaat om de kosten van de tenuitvoerlegging te
      delen. Onze Minister verleent slechts instemming indien hij op basis van door de uitvoerende lidstaat verstrekte
      gedetailleerde gegevens van oordeel is dat die kosten hoog of uitzonderlijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0022604#Artikel31
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0022604
        artikel: '31'
        hoofdstuk: III
        afdeling: '2'
  - number: '41.1'
    text: |-
      Al hetgeen wordt verkregen door tenuitvoerlegging in Nederland van een rechterlijke uitspraak of beschikking
      overeenkomstig [Hoofdstuk II, Afdeling 1][ref1], van deze wet, komt ten bate van de staat.


      [ref1]: https://wetten.overheid.nl/BWBR0022604#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0022604
        hoofdstuk: II
        afdeling: '1'
  - number: '41.2'
    text: |-
      Onze Minister kan met de uitvaardigende lidstaat overeenkomen dat de verkregen baten als bedoeld in het eerste lid
      geheel of gedeeltelijk worden verstrekt aan de uitvaardigende lidstaat.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel41
  - number: '41.3'
    text: |-
      Al hetgeen wordt verkregen door tenuitvoerlegging in Nederland van een rechterlijke uitspraak overeenkomstig
      [Hoofdstuk III, Afdeling 1][ref1], van deze wet, wordt overeenkomstig de bepalingen van [artikel 28][ref2]
      verdeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0022604#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0022604#Artikel28
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0022604
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0022604
        artikel: '28'
        hoofdstuk: III
        afdeling: '1'
  - number: '42'
    text: |-
      Op betekeningen, kennisgevingen en oproepingen gedaan krachtens deze wet, zijn de
      [artikelen 36b tot en met 36e][ref1], [36g][ref2], [36h][ref3] en [36n van het Wetboek van Strafvordering][ref4]
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel36b
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel36g
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel36g
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel36n
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 36b
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 36g
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 36g
      - id: ref4
        bwb_id: BWBR0001903
        artikel: 36n
  - number: '43'
    text: |-
      Indien met toepassing van [artikel 6:7:1, tweede lid, van het Wetboek van Strafvordering][ref1] gratie is verleend
      van een sanctie die met toepassing van de bepalingen van deze wet in Nederland is erkend en ten uitvoer wordt
      gelegd, wordt de bevoegde autoriteit van de uitvaardigende lidstaat hiervan onverwijld schriftelijk in kennis
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
  - number: '44'
    text: |-
      Deze wet wordt aangehaald als: Wet wederzijdse erkenning en tenuitvoerlegging geldelijke sancties en beslissingen
      tot confiscatie.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel44
