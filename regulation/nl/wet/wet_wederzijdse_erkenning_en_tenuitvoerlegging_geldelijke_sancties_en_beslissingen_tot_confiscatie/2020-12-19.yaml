---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_wederzijdse_erkenning_en_tenuitvoerlegging_geldelijke_sancties_en_beslissingen_tot_confiscatie
regulatory_layer: WET
publication_date: '2025-11-10'
valid_from: '2020-12-19'
bwb_id: BWBR0022604
url: https://wetten.overheid.nl/BWBR0022604/2020-12-19
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de implementatie van het kaderbesluit nr. 2005/214/JBZ van de Raad van
    de Europese Unie van 24 februari 2005 inzake de toepassing van het beginsel van wederzijdse erkenning op geldelijke
    sancties (PbEG L 76) noodzaakt tot het stellen van regels voor de wederzijdse erkenning en tenuitvoerlegging
    van geldelijke sancties en voorts dat het wenselijk is een algemeen kader op te stellen waarin toekomstige
    kaderbesluiten inzake de wederzijdse erkenning van einduitspraken kunnen worden geïmplementeerd;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel1
  - number: 1.a
    text: 'rechterlijke uitspraak: een onherroepelijke beslissing van een rechter wegens een strafbaar feit;'
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel1
  - number: 1.b
    text: |-
      beschikking: een onherroepelijke beslissing van een bestuurlijke autoriteit wegens een strafbaar feit of een feit
      dat wordt bestraft als vergrijp tegen de voorschriften betreffende de orde, voor zover tegen de beslissing beroep
      op een met name in strafzaken bevoegde rechter is opengesteld;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel1
  - number: 1.c
    text: 'uitvaardigende lidstaat: lidstaat van de Europese Unie waarin een rechterlijke uitspraak of beschikking is gewezen;'
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel1
  - number: 1.d
    text: |-
      uitvoerende lidstaat: lidstaat van de Europese Unie waaraan een rechterlijke uitspraak of beschikking met het oog
      op tenuitvoerlegging is of wordt toegezonden;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel1
  - number: 1.e
    text: 'sanctie: een bij rechterlijke uitspraak of beschikking opgelegde straf of maatregel;'
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel1
  - number: 1.f
    text: 'geldelijke sanctie: sanctie houdende de verplichting tot betaling van:'
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel1
  - number: 1.f.1°
    text: een geldboete;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel1
  - number: 1.f.2°
    text: |-
      een geldbedrag ten behoeve van het slachtoffer van het strafbare feit, voor zover deze verplichting is opgelegd
      door de strafrechter;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel1
  - number: 1.f.3°
    text: |-
      een geldbedrag voor een schadefonds of instelling ten behoeve van slachtoffers van strafbare feiten voor zover deze
      verplichting is opgelegd bij rechterlijke uitspraak of beschikking;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel1
  - number: 1.f.4°
    text: proceskosten.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel1
  - number: 1.g
    text: |-
      voorwerpen: alle zaken en alle vermogensrechten ten aanzien waarvan de rechter van de uitvaardigende lidstaat heeft
      beslist dat zij:
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel1
  - number: 1.g.1°
    text: |-
      de opbrengst zijn van een strafbaar feit dan wel met de gehele of gedeeltelijke waarde van die opbrengst
      overeenstemmen, of
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel1
  - number: 1.g.2°
    text: een hulpmiddel voor dat strafbaar feit vormen, of
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel1
  - number: 1.g.3°
    text: |-
      vatbaar zijn voor confiscatie door de toepassing, in de uitvaardigende lidstaat, van een van de verruimde
      confiscatiebevoegdheden in de zin van artikel 3, eerste en tweede lid, van het Kaderbesluit 2005/212/JBZ van de
      Raad van 24 februari 2005 inzake de confiscatie van opbrengsten van misdrijven, alsmede van de daarbij gebruikte
      hulpmiddelen en de door middel daarvan verkregen voorwerpen (PbEU L 68 van 15 maart 2005), of
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel1
  - number: 1.g.4°
    text: |-
      vatbaar zijn voor confiscatie op grond van andere rechtsvoorschriften van de uitvaardigende lidstaat betreffende
      verruimde confiscatiebevoegdheden;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel1
  - number: 1.h
    text: 'opbrengst: elk economisch voordeel dat uit strafbare feiten is verkregen. Dit kunnen alle voorwerpen zijn;'
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel1
  - number: 1.i
    text: |-
      hulpmiddelen: alle voorwerpen die op enigerlei wijze, geheel of gedeeltelijk, zijn gebruikt of bestemd om te worden
      gebruikt om één of meer strafbare feiten te begaan;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel1
  - number: 1.j
    text: |-
      cultuurgoederen: cultuurgoederen als bedoeld in [artikel 3:86a, eerste lid, BW][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel86a
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 86a
  - number: 1.k
    text: |-
      beslissing, houdende een geldelijke sanctie: een rechterlijke uitspraak of een beschikking, waarbij een geldelijke
      sanctie als bedoeld in onderdeel f van dit artikel is opgelegd;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel1
  - number: 1.l
    text: 'beslissing tot confiscatie: een rechterlijke uitspraak die leidt tot het blijvend ontnemen van een voorwerp;'
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel1
  - number: 1.m
    text: 'veroordeelde: degene aan wie een sanctie is opgelegd;'
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel1
  - number: 1.n
    text: |-
      officier van justitie: de ingevolge de [artikelen 4][ref1] en [5][ref2] bevoegde officier van justitie;


      [ref1]: https://wetten.overheid.nl/BWBR0022604#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022604#Artikel5
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0022604
        artikel: '4'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0022604
        artikel: '5'
        hoofdstuk: I
  - number: 1.o
    text: 'Onze Minister: Onze Minister van Justitie en Veiligheid;'
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel1
  - number: 1.p
    text: |-
      Verordening 2018/1805: Verordening (EU) nr. 2018/1805 van het Europees Parlement en de Raad van 14 november 2018
      inzake de wederzijdse erkenning van bevriezingsbevelen en confiscatiebevelen (PbEU 2018, L 303/1);
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel1
  - number: 1.q
    text: 'confiscatiebevel: bevel als bedoeld in artikel 2, onderdeel 2, van [Verordening 2018/1805](33705R2018);'
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel1
  - number: 1.r
    text: |-
      uitvaardigende autoriteit: autoriteit, bedoeld in artikel 2, onderdeel 8, subonderdeel b, van [Verordening
      2018/1805](33705R2018);
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel1
  - number: 1.s
    text: 'uitvoerende autoriteit: autoriteit, bedoeld in artikel 2, onderdeel 9, van [Verordening 2018/1805](33705R2018).'
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel1
  - number: '2'
    text: |-
      Rechterlijke uitspraken en beschikkingen gewezen in een andere lidstaat van de Europese Unie en aan Nederland
      gezonden worden overeenkomstig de bepalingen van deze wet in Nederland erkend en ten uitvoer gelegd.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel2
  - number: '3'
    text: |-
      In Nederland gewezen rechterlijke uitspraken en beschikkingen kunnen overeenkomstig de bepalingen van deze wet
      worden gezonden aan een andere lidstaat van de Europese Unie met het oog op de tenuitvoerlegging aldaar.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel3
  - number: '4.1'
    text: |-
      De officier van justitie bij het arrondissement Noord-Nederland is bevoegd tot erkenning van een in een andere
      lidstaat van de Europese Unie opgelegde beslissing houdende:
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel4
  - number: 4.1.a
    text: een geldelijke sanctie;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel4
  - number: 4.1.b
    text: een beslissing tot confiscatie;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel4
  - number: 4.1.c
    text: een confiscatiebevel.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel4
  - number: '4.2'
    text: Onze Minister is bevoegd tot tenuitvoerlegging van de beslissing of het bevel.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel4
  - number: '5'
    text: |-
      Onze Minister is bevoegd tot het verzenden van een in Nederland opgelegde beslissing, houdende een geldelijke
      sanctie, een beslissing tot confiscatie of een confiscatiebevel, aan een andere lidstaat van de Europese Unie met
      het oog op de tenuitvoerlegging aldaar.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel5
  - number: '6.1'
    text: 'Vatbaar voor erkenning en tenuitvoerlegging in Nederland zijn:'
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel6
  - number: 6.1.A
    text: 'beslissingen, houdende een geldelijke sanctie genomen in een andere lidstaat van de Europese Unie:'
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel6
  - number: 6.1.A.1°
    text: bij rechterlijke uitspraak;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel6
  - number: 6.1.A.2°
    text: bij beschikking;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel6
  - number: 6.1.A.3°
    text: bij onherroepelijke rechterlijke beslissing genomen in beroep tegen een beschikking.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel6
  - number: 6.1.B
    text: 'beslissingen tot confiscatie genomen in een andere lidstaat van de Europese Unie en strekkende tot:'
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel6
  - number: 6.1.B.1°
    text: betaling van een geldbedrag aan de staat ter ontneming van wederrechtelijk verkregen voordeel;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel6
  - number: 6.1.B.2°
    text: |-
      verbeurdverklaring, waarbij de rechter heeft bepaald op welke voorwerpen deze sanctie ten uitvoer moet worden
      gelegd.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel6
  - number: 6.1.C
    text: confiscatiebevelen.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel6
  - number: '6.2'
    text: |-
      Het eerste lid is van toepassing in het geval de veroordeelde een natuurlijke persoon is, voor zover deze inkomsten
      of vermogen of zijn vaste woon- of verblijfplaats in Nederland heeft dan wel in het geval de veroordeelde een
      rechtspersoon is, voor zover deze inkomsten of vermogen of zijn statutaire zetel in Nederland heeft, dan wel indien
      het specifieke voorwerp waarop de beslissing tot confiscatie of het confiscatiebevel betrekking heeft zich op
      Nederlands grondgebied bevindt.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel6
  - number: '7.1'
    text: |-
      De beslissingen, bedoeld in [artikel 6, eerste lid][ref1], en het ingevulde certificaat, dat is opgesteld
      overeenkomstig het bij algemene maatregel van bestuur vastgestelde model, worden door de officier van justitie in
      behandeling genomen. Wanneer deze documenten niet aan hem zijn gezonden, worden ze door de geadresseerde onverwijld
      aan hem doorgezonden. De geadresseerde stelt de bevoegde autoriteit van de uitvaardigende lidstaat hiervan
      onverwijld schriftelijk in kennis. De officier van justitie bevestigt de ontvangst van een aan hem doorgezonden
      verzoek aan de bevoegde autoriteit van de uitvaardigende lidstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0022604#Artikel6
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0022604
        artikel: '6'
        hoofdstuk: I
  - number: '7.2'
    text: |-
      Indien het certificaat ontbreekt, onvolledig is of kennelijk niet in overeenstemming is met de beslissing, bedoeld
      in [artikel 6, eerste lid][ref1], verzoekt de officier van justitie de bevoegde autoriteit in de uitvaardigende
      lidstaat het certificaat alsnog over te leggen, aan te vullen of te verbeteren.


      [ref1]: https://wetten.overheid.nl/BWBR0022604#Artikel6
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0022604
        artikel: '6'
        hoofdstuk: I
  - number: '7.3'
    text: |-
      De officier van justitie kan de bevoegde autoriteit in de uitvaardigende lidstaat verzoeken een gewaarmerkt
      afschrift van de beslissing of het origineel van het certificaat over te leggen.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel7
  - number: '8'
    text: |-
      Indien een beslissing als bedoeld in [artikel 6, eerste lid][ref1], is uitgedrukt in vreemde valuta, bepaalt de
      officier van justitie de hoogte van het bedrag in euro’s volgens de wisselkoers die gold op het tijdstip waarop de
      beslissing werd genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0022604#Artikel6
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0022604
        artikel: '6'
        hoofdstuk: I
  - number: '9.1'
    text: |-
      De tenuitvoerlegging van de beslissing als bedoeld in [artikel 6, eerste lid][ref1], wordt gestaakt, zodra een
      daartoe strekkende kennisgeving van de bevoegde autoriteit van de uitvaardigende lidstaat is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0022604#Artikel6
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0022604
        artikel: '6'
        hoofdstuk: I
  - number: '9.2'
    text: |-
      Zodra de tenuitvoerlegging van de beslissing als bedoeld in [artikel 6, eerste lid][ref1], is voltooid, stelt Onze
      Minister de bevoegde autoriteit van de uitvaardigende lidstaat hiervan onverwijld in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0022604#Artikel6
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0022604
        artikel: '6'
        hoofdstuk: I
  - number: '10.1'
    text: |-
      Vatbaar voor erkenning en tenuitvoerlegging in een andere lidstaat van de Europese Unie zijn beslissingen, houdende
      een in Nederland:
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel10
  - number: 10.1.a
    text: bij rechterlijke uitspraak of beschikking opgelegde geldboete;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel10
  - number: 10.1.b
    text: |-
      bij rechterlijke uitspraak of beschikking opgelegde verplichting tot betaling aan de staat van een geldsom ten
      behoeve van het slachtoffer;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel10
  - number: 10.1.c
    text: |-
      door de bevoegde autoriteiten bij beschikking opgelegde administratieve sanctie als bedoeld in
      [artikel 2 van de Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel2
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: '2'
  - number: 10.1.d
    text: genomen beslissing tot confiscatie, betreffende een geldbedrag;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel10
  - number: 10.1.e
    text: genomen beslissing tot confiscatie, betreffende een specifiek voorwerp;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel10
  - number: 10.1.f
    text: uitgevaardigd confiscatiebevel;
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel10
  - number: 10.1.g
    text: |-
      door de bevoegde autoriteiten bij beschikking opgelegde bestuurlijke boete als bedoeld
      in [artikel 10:5 van de Arbeidstijdenwet][ref1] voor zover het overtredingen betreft van
      [hoofdstuk 2 van het Arbeidstijdenbesluit vervoer][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009386#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0009386
        hoofdstuk: '2'
  - number: 10.1.g
    text: |-
      door de bevoegde autoriteiten bij beschikking opgelegde bestuurlijke boete als bedoeld in [artikel 174a][ref1],
      [174b][ref2] of [174c van de Wegenverkeerswet 1994][ref3] voor zover het overtredingen betreft van de
      [artikelen 20b][ref4], de krachtens [artikel 29][ref5] genoemde artikelen en [artikel 30][ref6] van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel174a
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel174b
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel174c
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel20b
      [ref5]: https://wetten.overheid.nl/BWBR0006622#Artikel29
      [ref6]: https://wetten.overheid.nl/BWBR0006622#Artikel30
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 174a
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 174b
      - id: ref3
        bwb_id: BWBR0006622
        artikel: 174c
      - id: ref4
        bwb_id: BWBR0006622
        artikel: 20b
      - id: ref5
        bwb_id: BWBR0006622
        artikel: '29'
      - id: ref6
        bwb_id: BWBR0006622
        artikel: '30'
  - number: '10.2'
    text: |-
      Onze Minister kan een beslissing als bedoeld in het eerste lid aan een andere lidstaat van de Europese Unie zenden
      met het oog op de tenuitvoerlegging aldaar, indien de veroordeelde in die andere lidstaat inkomsten of vermogen of
      zijn vaste woon- of verblijfplaats heeft dan wel, in het geval de veroordeelde een rechtspersoon is, deze aldaar
      inkomsten of vermogen of zijn statutaire zetel heeft.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel10
  - number: '10.3'
    text: |-
      Onverminderd de bepaling van het tweede lid, kan Onze Minister een beslissing als bedoeld in onderdeel e van het
      eerste lid met het oog op de erkenning en tenuitvoerlegging aan de lidstaat zenden, waarvan hij het redelijke
      vermoeden heeft dat dat voorwerp zich op het grondgebied van die lidstaat bevindt.
    url: https://wetten.overheid.nl/BWBR0022604/2020-12-19#Artikel10
  - number: '11.1'
    text: |-
      Een voor erkenning vatbare beslissing, houdende een geldelijke sanctie, wordt erkend en ten uitvoer gelegd
      overeenkomstig het bepaalde in de [artikelen 6:1:1][ref1], [6:1:2][ref2], [6:1:9][ref3], [6:4:1][ref4],
      [6:4:3][ref5], [6:4:4][ref6], [6:4:5][ref7], [6:4:6][ref8] en [6:4:8 van het Wetboek van Strafvordering][ref9],
      tenzij in deze wet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel6
