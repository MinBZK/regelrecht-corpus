---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: alcoholwet
regulatory_layer: WET
publication_date: '2021-01-28'
valid_from: '2009-07-01'
bwb_id: BWBR0002458
url: https://wetten.overheid.nl/BWBR0002458/2009-07-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Drankwet (Stb. 1931, 476) en de voor de
    horecabedrijven en het slijtersbedrijf geldende vestigingsregelingen te vervangen door een nieuwe wet, welke ten
    aanzien van het verstrekken van alcoholhoudende drank zowel uit sociaal-hygiënisch als uit sociaal-economisch
    oogpunt regelen stelt;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder: – Onze Minister: Onze
      Minister van Volksgezondheid, Welzijn en Sport; – horecabedrijf: de activiteit in ieder geval bestaande uit
      het bedrijfsmatig of anders dan om niet verstrekken van alcoholhoudende drank voor gebruik ter plaatse; –
      slijtersbedrijf: de activiteit bestaande uit het bedrijfsmatig of anders dan om niet aan particulieren verstrekken
      van sterke drank voor gebruik elders dan ter plaatse, al dan niet gepaard gaande met het bedrijfsmatig of anders
      dan om niet aan particulieren verstrekken van zwak-alcoholhoudende en alcoholvrije drank voor gebruik elders
      dan ter plaatse of met het bedrijfsmatig verrichten van bij algemene maatregel van bestuur aangewezen andere
      handelingen; – lokaliteit: een besloten ruimte, onderdeel uitmakend van een inrichting; – horecalokaliteit: een
      van een afsluitbare toegang voorziene lokaliteit, onderdeel uitmakend van een inrichting waarin het horecabedrijf
      wordt uitgeoefend, in ieder geval bestemd voor het verstrekken van alcoholhoudende drank voor gebruik ter plaatse;
      – slijtlokaliteit: een van een afsluitbare toegang voorziene lokaliteit, onderdeel uitmakend van of samenvallend
      met een inrichting waarin het slijtersbedrijf wordt uitgeoefend, in ieder geval bestemd voor het verstrekken van
      sterke drank voor gebruik elders dan ter plaatse; – inrichting: de lokaliteiten waarin het slijtersbedrijf of het
      horecabedrijf wordt uitgeoefend, met de daarbij behorende terrassen voor zover die terrassen in ieder geval bestemd
      zijn voor het verstrekken van alcoholhoudende drank voor gebruik ter plaatse, welke lokaliteiten al dan niet
      onderdeel uitmaken van een andere besloten ruimte; – leidinggevende:
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel1
  - number: 1.1.1°
    text: |-
      de natuurlijke persoon of de bestuurders van een rechtspersoon of hun gevolmachtigden, voor wiens rekening en
      risico het horecabedrijf of het slijtersbedrijf wordt uitgeoefend, met uitzondering van bestuurders van een
      rechtspersoon als bedoeld in [artikel 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel4
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '4'
        paragraaf: '2'
  - number: 1.1.2°
    text: |-
      de natuurlijke persoon, die algemene leiding geeft aan een onderneming, waarin het horecabedrijf of het
      slijtersbedrijf wordt uitgeoefend in een of meer inrichtingen;
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel1
  - number: 1.1.3°
    text: de natuurlijke persoon, die onmiddellijke leiding geeft aan de uitoefening van zodanig bedrijf in een inrichting;
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel1
  - number: '1.2'
    text: Onder een inrichting wordt niet verstaan een vervoermiddel voor het rondtrekkend uitoefenen van een bedrijf.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel1
  - number: '1.3'
    text: |-
      Deze wet is, met uitzondering van de [artikelen 20, eerste, tweede, vierde, zesde en zevende lid][ref1], [21][ref2]
      en [24, tweede lid][ref3], niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0002458#Artikel24
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '20'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002458
        artikel: '21'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0002458
        artikel: '24'
        paragraaf: '3'
  - number: 1.3.a
    text: vervoermiddelen die bestemd zijn voor het vervoer van personen, tijdens hun gebruik als zodanig;
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel1
  - number: 1.3.b
    text: |-
      legerplaatsen en lokaliteiten, aan het militair gezag onderworpen, gedurende de tijd dat deze uitsluitend voor
      militaire doeleinden worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel1
  - number: '2.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen in het belang van de volksgezondheid regels worden gesteld met betrekking
      tot de inhoud van reclame voor alcoholhoudende drank, de doelgroepen waarop zodanige reclame is gericht, alsmede
      de tijd en wijze waarop en de plaats waar reclame wordt gemaakt. Deze regels kunnen verboden, beperkingen van en
      voorschriften ten aanzien van reclameuitingen bevatten. In de maatregel wordt een overgangsregeling getroffen ten
      aanzien van reclameuitingen die reeds waren geopenbaard op het tijdstip van inwerkingtreding van die maatregel.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel2
  - number: '2.2'
    text: |-
      Het is verboden voor alcoholhoudende drank reclame te maken, welke niet voldoet aan de krachtens het eerste lid
      gestelde regels.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel2
  - number: '2.3'
    text: |-
      Het in het tweede lid genoemde verbod geldt niet ten aanzien van reclameuitingen voor alcoholhoudende drank, waarin
      met betrekking tot die drank slechts aanduidingen voorkomen betreffende merk, soort en prijs alsmede de plaats waar
      die drank wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel2
  - number: '2.4'
    text: |-
      Een krachtens het eerste lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan acht
      weken na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel2
  - number: '3'
    text: |-
      Het is verboden zonder daartoe strekkende vergunning van burgemeester en wethouders het horecabedrijf of
      slijtersbedrijf uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel3
  - number: '4.1'
    text: |-
      Aan een vergunning, die op grond van [artikel 3][ref1] voor het horecabedrijf wordt verleend aan een rechtspersoon
      niet zijnde een naamloze vennootschap of besloten vennootschap met beperkte aansprakelijkheid, die zich richt op
      activiteiten van recreatieve, sportieve, sociaal-culturele, educatieve, levensbeschouwelijke of godsdienstige aard,
      verbinden burgemeester en wethouders een of meer voorschriften of beperkingen die, gelet op de plaatselijke of
      regionale omstandigheden, nodig zijn ter voorkoming van mededinging door het verstrekken van alcoholhoudende drank,
      die uit een oogpunt van ordelijk economisch verkeer als onwenselijk moet worden beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel3
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '3'
        paragraaf: '2'
  - number: '4.2'
    text: 'De in het eerste lid bedoelde voorschriften of beperkingen kunnen op geen andere onderwerpen betrekking hebben dan:'
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel4
  - number: 4.2.a
    text: in de inrichting te houden bijeenkomsten van persoonlijke aard, zoals bruiloften en partijen;
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel4
  - number: 4.2.b
    text: het openlijk aanprijzen van de mogelijkheid tot het houden van bijeenkomsten als bedoeld onder a;
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel4
  - number: 4.2.c
    text: de tijden gedurende welke in de betrokken inrichting alcoholhoudende drank wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel4
  - number: '4.3'
    text: |-
      Bij gemeentelijke verordening kunnen nadere regels worden gesteld met betrekking tot de in het eerste lid bedoelde
      voorschriften of beperkingen.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel4
  - number: '4.4'
    text: |-
      Door burgemeester en wethouders worden, indien dit in verband met een wijziging in de plaatselijke of regionale
      omstandigheden nodig is, aan een reeds verleende vergunning als bedoeld in het eerste lid voorschriften of
      beperkingen als in dat lid bedoeld verbonden of aan een zodanige vergunning verbonden voorschriften of beperkingen
      gewijzigd of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel4
  - number: '4.5'
    text: |-
      Burgemeester en wethouders kunnen met het oog op bijzondere gelegenheden van zeer tijdelijke aard ontheffing
      verlenen van de aan een vergunning verbonden voorschriften of beperkingen als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel4
  - number: '5.1'
    text: |-
      [Artikel 4][ref1] is niet van toepassing, indien de betrokken rechtspersoon gehouden is uitvoering te geven aan
      een regeling, betrekking hebbend op een of meer van de in [artikel 4, tweede lid][ref2], bedoelde onderwerpen,
      die door die rechtspersoon of een organisatie waarbij deze is aangesloten, schriftelijk is overeengekomen met het
      Bedrijfschap Horeca en Catering.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel4
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002458
        artikel: '4'
        paragraaf: '2'
  - number: '5.2'
    text: |-
      Burgemeester en wethouders trekken aan een vergunning verbonden voorschriften en beperkingen als bedoeld in
      [artikel 4][ref1] op verzoek van de vergunninghouder in, indien voor deze een verplichting is ontstaan als bedoeld
      in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel4
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '4'
        paragraaf: '2'
  - number: '5.3'
    text: |-
      Ten aanzien van een reeds verleende vergunning is, indien een verplichting als bedoeld in het eerste lid eindigt,
      [artikel 4, eerste lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel4
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '4'
        paragraaf: '2'
  - number: '6'
    text: |-
      Op de voorbereiding van een beslissing tot verlening van een vergunning op grond van [artikel 3][ref1] voor het
      horecabedrijf aan een rechtspersoon als bedoeld in [artikel 4, eerste lid][ref2], en op de voorbereiding van
      een beslissing op grond van [artikel 4, eerste of vierde lid](onbekend), of [artikel 5, derde lid](onbekend), is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002458
        artikel: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '7.1'
    text: Een vergunning is vereist voor iedere inrichting.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel7
  - number: '7.2'
    text: |-
      Geen vergunning wordt verleend voor het uitoefenen van het horecabedrijf of slijtersbedrijf anders dan in een
      inrichting.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel7
  - number: '7.3'
    text: |-
      Indien een terras onderdeel is van een inrichting, die onderdeel uitmaakt van een winkel wordt slechts een
      vergunning ten aanzien van het terras verleend, indien dit onmiddellijk aansluit aan een horecalokaliteit.
      Voor de overige terrassen wordt slechts vergunning verleend, indien zij in de onmiddellijke nabijheid van een
      horecalokaliteit zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel7
  - number: '8.1'
    text: Voor het verkrijgen van een vergunning moet worden voldaan aan het bij en krachtens de volgende leden bepaalde.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel8
  - number: '8.2'
    text: 'Leidinggevenden dienen aan de volgende eisen te voldoen:'
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel8
  - number: 8.2.a
    text: zij mogen niet onder curatele staan dan wel uit het ouderlijk gezag of voogdij ontzet zijn;
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel8
  - number: 8.2.b
    text: zij mogen niet in enig opzicht van slecht levensgedrag zijn;
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel8
  - number: 8.2.c
    text: zij moeten de leeftijd van eenentwintig jaar hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel8
  - number: '8.3'
    text: |-
      Bij algemene maatregel van bestuur worden naast de in het tweede lid gestelde eisen andere eisen ten aanzien
      van het zedelijk gedrag van leidinggevenden gesteld en kan de in dat lid, onder b, gestelde eis nader worden
      omschreven.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel8
  - number: '8.4'
    text: |-
      Leidinggevenden, bij rechtspersonen als bedoeld in [artikel 4][ref1] is zulks beperkt tot 2 leidinggevenden per
      rechtspersoon, dienen tevens te beschikken over voldoende kennis en inzicht met betrekking tot sociale hygiëne,
      overeenkomstig bij algemene maatregel van bestuur te stellen eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel4
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '4'
        paragraaf: '2'
  - number: '8.5'
    text: |-
      Bij regeling van Onze Minister van Volksgezondheid, Welzijn en Sport worden de bewijsstukken aangewezen waaruit het
      voldoen aan de eisen, bedoeld in het vierde lid, moet blijken.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel8
  - number: '9.1'
    text: |-
      Het bestuur van een rechtspersoon als bedoeld in [artikel 4][ref1] dient voor het verkrijgen van een vergunning een
      reglement vast te stellen dat waarborgt dat de verstrekking van alcoholhoudende drank in de inrichting gedurende de
      openingstijden vanuit het oogpunt van sociale hygiëne te allen tijde geschiedt door op dit gebied gekwalificeerde
      personen. De kwalificatienormen hiervoor worden eveneens in het in dit artikel genoemde reglement vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel4
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '4'
        paragraaf: '2'
  - number: '9.2'
    text: |-
      Het reglement geeft in ieder geval aan op welke dagen en tijdstippen bedrijfsmatig of anders dan om niet
      alcoholhoudende drank wordt verstrekt. Deze dagen en tijdstippen worden duidelijk zichtbaar in de horecalokaliteit
      aangegeven.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel9
  - number: '9.3'
    text: Het reglement voorziet in de wijze waarop wordt toegezien op de naleving.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel9
  - number: '9.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de inhoud
      van het reglement.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel9
  - number: '10'
    text: |-
      De inrichting dient te voldoen aan bij algemene maatregel van bestuur in het belang van de sociale hygiëne te
      stellen eisen.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel10
  - number: '11'
    text: |-
      Een krachtens [artikel 3][ref1] verleende vergunning geldt ten aanzien van het verstrekken van alcoholhoudende
      drank niet voor andere gedeelten van de openbare weg dan die, waar dat verstrekken door burgemeester en wethouders
      uitdrukkelijk is toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel3
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '3'
        paragraaf: '2'
  - number: '12.1'
    text: |-
      Het is verboden alcoholhoudende drank te verstrekken voor gebruik ter plaatse anders dan in een in de vergunning
      vermelde horecalokaliteit of anders dan op een in de vergunning vermeld terras, tenzij het betreft het vanuit
      zodanige lokaliteit afleveren van alcoholhoudende drank op bestelling in hotelkamers ingericht voor nachtverblijf
      of het verstrekken van alcoholhoudende drank door het in dergelijke hotelkamers beschikbaar te stellen.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel12
  - number: '12.2'
    text: |-
      Het is verboden sterke drank te verstrekken voor gebruik elders dan ter plaatse anders dan in een slijtlokaliteit
      die in de vergunning is vermeld.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel12
  - number: '13.1'
    text: |-
      Het is verboden in een horecalokaliteit of op een terras alcoholhoudende drank te verstrekken voor gebruik elders
      dan ter plaatse.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel13
  - number: '13.2'
    text: |-
      Het is verboden in een slijtlokaliteit alcoholhoudende drank te verstrekken voor gebruik ter plaatse of toe te
      laten dat daar alcoholhoudende drank wordt genuttigd.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel13
  - number: '14.1'
    text: |-
      Het is verboden een slijtlokaliteit gelijktijdig in gebruik te hebben voor het verrichten van andere
      bedrijfsactiviteiten dan die welke tot het slijtersbedrijf behoren dan wel toe te laten dat daarin zodanige
      activiteiten worden uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel14
  - number: '14.2'
    text: |-
      Het is verboden een horecalokaliteit of een terras tevens in gebruik te hebben voor het uitoefenen van de
      kleinhandel of zelfbedieningsgroothandel of het uitoefenen van een van de in het derde lid genoemde activiteiten,
      dan wel toe te laten dat daarin zodanige handel wordt of zodanige activiteiten worden uitgeoefend, tenzij het
      betreft de verkoop van etenswaren die voor consumptie gereed zijn.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel14
  - number: '14.3'
    text: 'De in het tweede lid bedoelde activiteiten zijn:'
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel14
  - number: 14.3.a
    text: |-
      het bedrijfsmatig aan particulieren verkopen van goederen in het kader van een openbare verkoping, als bedoeld in
      [artikel 1 van de Wet ambtelijk toezicht bij openbare verkopingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002798#Artikel1
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002798
        artikel: '1'
  - number: 14.3.b
    text: het bedrijfsmatig aanbieden van diensten;
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel14
  - number: 14.3.c
    text: het bedrijfsmatig verhuren van goederen;
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel14
  - number: 14.3.d
    text: het in het openbaar bedrijfsmatig opkopen van goederen.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel14
  - number: '15.1'
    text: |-
      Het is verboden de kleinhandel, met uitzondering van de kleinhandel in condooms en damesverband, of de
      zelfbedieningsgroothandel of een in [artikel 14, derde lid][ref1], genoemde activiteit, uit te oefenen in een
      lokaliteit behorende tot een inrichting waarin het horecabedrijf wordt uitgeoefend, tenzij het publiek slechts
      toegang heeft tot die lokaliteit zonder een lokaliteit te betreden waar alcoholhoudende drank aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel14
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '14'
        paragraaf: '3'
  - number: '15.2'
    text: |-
      Het is verboden dat een slijtlokaliteit rechtstreeks in verbinding staat met een ruimte waarin de kleinhandel of
      zelfbedieningsgroothandel of enige in [artikel 14, derde lid][ref1], genoemde activiteit wordt uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel14
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '14'
        paragraaf: '3'
  - number: '16'
    text: |-
      Het is degene, die bedrijfsmatig of anders dan om niet alcoholhoudende drank verstrekt, verboden daartoe automaten,
      waaruit de afnemers zelfstandig zodanige drank kunnen betrekken aanwezig te hebben, tenzij deze zich bevinden
      in hotelkamers, ingericht voor nachtverblijf, welke deel uitmaken van een inrichting waarin het horecabedrijf
      rechtmatig wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel16
  - number: '17'
    text: |-
      Het is verboden bedrijfsmatig of anders dan om niet alcoholhoudende drank voor gebruik elders dan ter plaatse
      aan particulieren te verstrekken of af te leveren anders dan in een gesloten verpakking, die niet zonder kenbare
      beschadiging kan worden geopend.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel17
  - number: '18.1'
    text: |-
      Het is verboden in de uitoefening van een ander bedrijf dan het slijtersbedrijf zwak-alcoholhoudende drank voor
      gebruik elders dan ter plaatse aan particulieren te verstrekken.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel18
  - number: '18.2'
    text: 'Het in het eerste lid vervatte verbod geldt niet ten aanzien van het verstrekken in:'
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel18
  - number: 18.2.a
    text: |-
      een winkel waarin in overwegende mate levensmiddelen of tabak en aanverwante artikelen of uitsluitend zwak-
      alcoholhoudende dranken al dan niet tezamen met alcoholvrije dranken worden verkocht;
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel18
  - number: 18.2.b
    text: een winkel waarin een gevarieerd assortiment aan levensmiddelen of tabak en aanverwante artikelen wordt verkocht;
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel18
  - number: 18.2.c
    text: |-
      een voor het publiek toegankelijke besloten ruimte waarin hoofdzakelijk gerede eetwaren voor gebruik ter plaatse en
      elders dan ter plaatse plegen te worden verkocht, niet zijnde een horecalokaliteit.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel18
  - number: '18.3'
    text: |-
      Zwak-alcoholhoudende dranken zijn in de gevallen bedoeld in het tweede lid, zodanig in de besloten ruimte
      geplaatst, dat deze dranken voor het publiek duidelijk te onderscheiden zijn van alcoholvrije dranken.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel18
  - number: '19.1'
    text: |-
      Het is verboden, anders dan in de rechtmatige uitoefening van het slijtersbedrijf of van het partijen-
      cateringbedrijf gelegenheid te bieden tot het doen van bestellingen voor sterke drank en sterke drank op bestelling
      af te leveren of te doen afleveren aan huizen van particulieren. Onder partijen-catering wordt verstaan het,
      gepaard gaande met dienstverlening, bedrijfsmatig verstrekken van gerechten en dranken voor gebruik bij besloten
      partijen op een door een opdrachtgever te bepalen plaats, die slechts incidenteel beschikbaar is voor dergelijke
      partijen.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel19
  - number: '19.2'
    text: |-
      Het is verboden gelegenheid te bieden tot het doen van bestellingen voor zwak-alcoholhoudende drank en zwak-
      alcoholhoudende drank op bestelling af te leveren of te doen afleveren aan huizen van particulieren, anders dan
      vanuit:
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel19
  - number: 19.2.a
    text: |-
      een niet voor publiek toegankelijke besloten ruimte, waarin overeenkomstige bestellingen plegen te worden aanvaard,
      niet zijnde een horecalokaliteit;
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel19
  - number: 19.2.b
    text: |-
      een ruimte als bedoeld in [artikel 18, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel18
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '18'
        paragraaf: '3'
  - number: 19.2.c
    text: een inrichting waarin het slijtersbedrijf wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel19
  - number: '20.1'
    text: |-
      Het is verboden bedrijfsmatig of anders dan om niet alcoholhoudende drank te verstrekken aan een persoon van wie
      niet is vastgesteld dat deze de leeftijd van 16 jaar heeft bereikt. Onder verstrekken als bedoeld in de eerste
      volzin wordt eveneens begrepen het verstrekken van alcoholhoudende drank aan een persoon van wie is vastgesteld dat
      deze de leeftijd van 16 jaar heeft bereikt, welke drank echter kennelijk bestemd is voor een persoon van wie niet
      is vastgesteld dat deze de leeftijd van 16 jaar heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel20
  - number: '20.2'
    text: |-
      Het is verboden bedrijfsmatig of anders dan om niet sterke drank te verstrekken aan een persoon van wie niet is
      vastgesteld dat deze de leeftijd van 18 jaar heeft bereikt. Onder verstrekken als bedoeld in de eerste volzin wordt
      eveneens begrepen het verstrekken van sterke drank aan een persoon van wie is vastgesteld dat deze de leeftijd van
      18 jaar heeft bereikt, welke drank echter kennelijk bestemd is voor een persoon van wie niet is vastgesteld dat
      deze de leeftijd van 18 jaar heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel20
  - number: '20.3'
    text: |-
      Het is verboden in een slijtlokaliteit de aanwezigheid toe te laten van een persoon van wie niet is vastgesteld dat
      deze de leeftijd van 16 jaar heeft bereikt, anders dan onder toezicht van een persoon van 21 jaar of ouder.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel20
  - number: '20.4'
    text: |-
      De vaststelling, bedoeld in het eerste tot en met derde lid, blijft achterwege, indien het een persoon betreft die
      onmiskenbaar de vereiste leeftijd heeft bereikt. De vaststelling geschiedt aan de hand van een document als bedoeld
      in [artikel 1, eerste lid, van de Wet op de identificatieplicht][ref1], dan wel een bij of krachtens algemene
      maatregel van bestuur aangewezen document.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '20.5'
    text: |-
      Bij gemeentelijke verordening kan worden verboden dat in de gemeente of een bij de verordening aangewezen deel
      daarvan, in een horecalokaliteit van een bij de verordening aangewezen aard de aanwezigheid wordt toegelaten van
      personen beneden een bij die verordening te bepalen leeftijd welke echter niet hoger mag zijn dan 21 jaar.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel20
  - number: '20.6'
    text: |-
      Op plaatsen waar bedrijfsmatig of anders dan om niet alcoholhoudende drank wordt verstrekt, alsmede bij de toegang
      tot een slijtlokaliteit, dient duidelijk zichtbaar en goed leesbaar te worden aangegeven welke leeftijdsgrens of
      leeftijdsgrenzen gelden. Onze Minister kan daaromtrent nadere regels stellen en modellen voorschrijven.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel20
  - number: '20.7'
    text: |-
      Het is verboden in een slijtlokaliteit of horecalokaliteit of op een terras de aanwezigheid toe te laten van
      een persoon die in kennelijke staat van dronkenschap of kennelijk onder invloed van andere psychotrope stoffen
      verkeert.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel20
  - number: '21'
    text: |-
      Het is verboden bedrijfsmatig of anders dan om niet alcoholhoudende drank te verstrekken, indien redelijkerwijs
      moet worden vermoed, dat dit tot verstoring van de openbare orde, veiligheid of zedelijkheid zal leiden.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel21
  - number: '22.1'
    text: 'Het is verboden bedrijfsmatig of anders dan om niet alcoholhoudende drank te verstrekken:'
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel22
  - number: 22.1.a
    text: |-
      op plaatsen waar brandstof voor middelen van vervoer aan particulieren wordt verstrekt en in winkels die aan een
      benzinestation zijn verbonden;
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel22
  - number: 22.1.b
    text: |-
      in winkels die verbonden zijn aan een inrichting waarin het horecabedrijf wordt uitgeoefend gelegen langs een
      krachtens de [Wegenverkeerswet 1994](onbekend) als autoweg aangeduide weg;
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel22
  - number: 22.1.c
    text: |-
      in ruimten gelegen langs een krachtens de [Wegenverkeerswet 1994](onbekend) als autosnelweg aangeduide weg, tenzij
      het betreft het verstrekken van alcoholhoudende drank voor gebruik ter plaatse in een horecalokaliteit of op een
      in de onmiddellijke nabijheid van een horecalokaliteit gelegen terras, en in die inrichting hoofdzakelijk warme
      maaltijden voor directe consumptie ter plaatse worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel22
  - number: '22.2'
    text: |-
      Bij algemene maatregel van bestuur kan het bedrijfsmatig of anders dan om niet verstrekken van alcoholhoudende
      drank worden verboden:
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel22
  - number: 22.2.a
    text: |-
      in stadions of bij die maatregel aangewezen delen daarvan, in gebruik bij organisaties van betaald voetbal,
      gedurende de tijd dat zij in verband met wedstrijden van betaald voetbal voor het publiek geopend zijn;
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel22
  - number: 22.2.b
    text: |-
      in gebouwen of in die maatregel aangewezen delen daarvan, die in gebruik zijn bij instellingen op het terrein van
      de gezondheidszorg en het onderwijs en in zwembaden.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel22
  - number: '22.3'
    text: |-
      Een krachtens het tweede lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan acht
      weken na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel22
  - number: '23.1'
    text: |-
      Bij gemeentelijke verordening kan, de inspecteur gehoord, het bedrijfsmatig of anders dan om niet verstrekken van
      alcoholhoudende drank worden verboden, met dien verstande dat een verbod dat betrekking heeft op het verstrekken
      van zwak-alcoholhoudende drank anders dan in een inrichting slechts betrekking heeft op een beperkte tijdsruimte.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel23
  - number: '23.2'
    text: |-
      Bij zodanige verordening kan worden bepaald, dat het verbod slechts geldt voor inrichtingen van een bij de
      verordening aangewezen aard, in bij de verordening aangewezen delen van de gemeente of voor een bij of krachtens
      die verordening aangewezen tijdsruimte.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel23
  - number: '23.3'
    text: |-
      Bij een verordening als bedoeld in het eerste lid kunnen regels worden gesteld omtrent de voorschriften die aan een
      vergunning als bedoeld in [artikel 3][ref1] kunnen worden verbonden en omtrent het beperken van een vergunning tot
      het verstrekken van zwak-alcoholhoudende drank.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel3
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '3'
        paragraaf: '2'
  - number: '23.4'
    text: De inspecteur zendt van zijn oordeel over de ontwerpverordening een afschrift aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel23
  - number: '23.5'
    text: Een verordening wordt in afschrift gezonden aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel23
  - number: '24.1'
    text: |-
      Het is verboden een horecalokaliteit of slijtlokaliteit voor het publiek geopend te houden, met uitzondering van
      een lokaliteit in beheer bij een rechtspersoon als bedoeld in [artikel 4][ref1], indien in de inrichting geen
      leidinggevende aanwezig is die vermeld staat op een vergunning met betrekking tot die inrichting of een andere
      vergunning van dezelfde vergunninghouder. Met betrekking tot rechtspersonen als bedoeld in [artikel 4][ref2] geldt,
      dat aanwezig is ofwel de leidinggevende die vermeld staat op een vergunning met betrekking tot die inrichting
      of een andere vergunning van dezelfde vergunninghouder, ofwel een andere op dit gebied gekwalificeerde persoon
      als bedoeld in [artikel 9, eerste lid][ref3]. Voor deze laatste categorie rechtspersonen geldt deze aangepaste
      voorwaarde slechts op momenten dat alcoholhoudende drank wordt geschonken.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0002458#Artikel9
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002458
        artikel: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002458
        artikel: '9'
        paragraaf: '2'
  - number: '24.2'
    text: |-
      Het is verboden in een slijtlokaliteit of horecalokaliteit, gedurende de tijd dat daarin dranken worden verstrekt,
      personen jonger dan 16 jaar dienst te laten doen.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel24
  - number: '24.3'
    text: |-
      Indien dit voor de naleving van [artikel 20, eerste tot en met vierde lid][ref1], noodzakelijk is, kan bij algemene
      maatregel van bestuur de leeftijd, genoemd in het tweede lid, op 18 jaar worden gesteld, met dien verstande dat
      zulks alsdan niet geldt voor personen die alcoholhoudende drank verstrekken in het kader van een in de maatregel
      aan te geven beroepsopleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel20
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '20'
        paragraaf: '3'
  - number: '25.1'
    text: |-
      Het is degene die, anders dan in de rechtmatige uitoefening van het slijtersbedrijf of horecabedrijf, een ruimte
      voor het publiek geopend houdt, verboden:
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel25
  - number: 25.1.a
    text: |-
      in die ruimte alcoholhoudende drank aanwezig te hebben, tenzij dit geschiedt ten dienste van het rechtmatig
      in die ruimte bedrijfsmatig of anders dan om niet aan particulieren verstrekken van zwak-alcoholhoudende drank
      voor gebruik elders dan ter plaatse, mits deze drank zich bevindt in een verpakking die voldoet aan de bij
      [artikel 17][ref1] gestelde eis;


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel17
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '17'
        paragraaf: '3'
  - number: 25.1.b
    text: |-
      in de voor het publiek niet toegankelijke delen van die ruimte alcoholhoudende drank in voorraad te hebben, tenzij
      het betreft:
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel25
  - number: 25.1.b.1°
    text: |-
      het in voorraad hebben van zwak-alcoholhoudende drank ten dienste van het in de rechtmatige uitoefening van een
      ander bedrijf dan het slijtersbedrijf bedrijfsmatig aan particulieren verstrekken van deze drank voor gebruik
      elders dan ter plaatse, mits deze drank zich bevindt in een verpakking die voldoet aan de bij [artikel 17][ref1]
      gestelde eis;


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel17
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '17'
        paragraaf: '3'
  - number: 25.1.b.2°
    text: |-
      het in voorraad hebben van alcoholhoudende drank ten dienste van het uitoefenen van een bedrijf, waarin waren uit
      onder meer alcoholhoudende drank plegen te worden vervaardigd.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel25
  - number: '25.2'
    text: |-
      Het is degene die, anders dan in de rechtmatige uitoefening van het horecabedrijf, een ruimte voor publiek geopend
      houdt, verboden toe te laten dat in die ruimte alcoholhoudende drank wordt genuttigd.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel25
  - number: '25.3'
    text: |-
      Het is degene die een vervoermiddel gebruikt voor het rondtrekkend uitoefenen van de kleinhandel verboden daarin,
      daarop of daaraan alcoholhoudende drank aanwezig te hebben, tenzij het betreft een vervoermiddel dat wordt gebruikt
      voor:
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel25
  - number: 25.3.a
    text: het rechtmatig aan particulieren afleveren van alcoholhoudende drank op bestelling;
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel25
  - number: 25.3.b
    text: |-
      het binnen het vervoermiddel verstrekken van zwak-alcoholhoudende drank in het kader van het rondtrekkend
      uitoefenen van de kleinhandel overwegend bestaand uit de handel in een gevarieerd assortiment levensmiddelen en
      kruideniersartikelen.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel25
  - number: '26.1'
    text: |-
      Onze Minister bepaalt welke gegevens een aanvrage om een vergunning als bedoeld in [artikel 3][ref1] dient te
      bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel3
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '3'
        paragraaf: '2'
  - number: '26.2'
    text: |-
      Bij gemeentelijke verordening kan worden bepaald welke gegevens een aanvraag voor een vergunning eveneens dient te
      bevatten in verband met krachtens [artikel 23, derde lid][ref1], gestelde voorschriften en beperkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel23
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '23'
        paragraaf: '3'
  - number: '26.3'
    text: Op de aanvraag wordt beslist binnen drie maanden na ontvangst daarvan.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel26
  - number: '27.1'
    text: 'Een vergunning wordt geweigerd indien:'
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel27
  - number: 27.1.a
    text: |-
      niet wordt voldaan aan de ingevolge de [artikelen 8 tot en met 10][ref1] geldende eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel8
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '8'
        paragraaf: '2'
  - number: 27.1.b
    text: |-
      redelijkerwijs moet worden aangenomen, dat de feitelijke toestand niet met het in de aanvrage vermelde in
      overeenstemming zal zijn;
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel27
  - number: 27.1.c
    text: |-
      [artikel 7, tweede lid][ref1], of [artikel 31, derde lid][ref2], zich tegen de verlening van de gevraagde
      vergunning verzet;


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel31
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002458
        artikel: '31'
        paragraaf: '4'
  - number: 27.1.d
    text: |-
      redelijkerwijs moet worden aangenomen dat een of meer van de bij of krachtens de [artikelen 2][ref1] en
      [13 tot en met 24][ref2] gestelde verboden zal worden overtreden of dat in strijd zal worden gehandeld met aan de
      vergunning verbonden beperkingen of voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel13
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002458
        artikel: '13'
        paragraaf: '3'
  - number: '27.2'
    text: |-
      Een vergunning ten aanzien van een inrichting, waarvan de vergunning op grond van
      [artikel 31, eerste lid, onder d][ref1], is ingetrokken, kan gedurende een bij die intrekking vastgestelde termijn
      van ten hoogste vijf jaar worden geweigerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel31
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '31'
        paragraaf: '4'
  - number: '27.3'
    text: |-
      Een vergunning kan worden geweigerd in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: '27.4'
    text: |-
      Voordat toepassing wordt gegeven aan het derde lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: '28.1'
    text: |-
      Een vergunning wordt verleend, indien geen der in [artikel 27][ref1] bedoelde weigeringsgronden aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel27
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '27'
        paragraaf: '4'
  - number: '28.2'
    text: De beschikking tot verlening, wijziging of intrekking van de vergunning wordt mede aan de inspecteur toegezonden.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel28
  - number: '29.1'
    text: 'In een vergunning worden vermeld:'
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel29
  - number: 29.1.a
    text: de natuurlijke of rechtspersoon of -personen aan wie de vergunning is verleend;
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel29
  - number: 29.1.b
    text: de leidinggevenden;
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel29
  - number: 29.1.c
    text: tot welke bedrijfsuitoefening de vergunning strekt;
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel29
  - number: 29.1.d
    text: de plaats waar de inrichting zich bevindt;
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel29
  - number: 29.1.e
    text: de situering en de oppervlakten van de horeca- of slijtlokaliteiten en terrassen;
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel29
  - number: 29.1.f
    text: de voorschriften of beperkingen welke aan de vergunning zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel29
  - number: '29.2'
    text: De vergunning of een afschrift daarvan is in de inrichting aanwezig.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel29
  - number: '29.3'
    text: De vergunning wordt gesteld op een formulier, waarvan het model door Onze Minister wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel29
  - number: '30'
    text: |-
      Indien een inrichting een zodanige verandering ondergaat dat zij niet langer in overeenstemming is met de in
      de vergunning gegeven omschrijving, is de vergunninghouder verplicht bedoelde wijziging binnen één maand bij
      burgemeester en wethouders te melden. Burgemeester en wethouders verstrekken, indien nog aan de ten aanzien van de
      inrichting gestelde eisen wordt voldaan, een gewijzigde vergunning, waarin de ingevolge [artikel 29][ref1] vereiste
      omschrijving is aangepast aan de nieuwe situatie.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel29
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '29'
        paragraaf: '4'
  - number: '31.1'
    text: 'Een vergunning wordt ingetrokken, indien:'
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel31
  - number: 31.1.a
    text: |-
      de te harer verkrijging verstrekte gegevens zodanig onjuist of onvolledig blijken, dat op de aanvrage een andere
      beslissing zou zijn genomen, als bij de beoordeling daarvan de juiste omstandigheden volledig bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel31
  - number: 31.1.b
    text: |-
      niet langer wordt voldaan aan de ingevolge de [artikelen 8][ref1] en [10][ref2] geldende eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel10
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '8'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002458
        artikel: '10'
        paragraaf: '2'
  - number: 31.1.c
    text: |-
      een niet daarin vermelde persoon leidinggevende is geworden met betrekking tot de inrichting, waarop de vergunning
      betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel31
  - number: 31.1.d
    text: |-
      zich in de betrokken inrichting feiten hebben voorgedaan, die de vrees wettigen, dat het van kracht blijven der
      vergunning gevaar zou opleveren voor de openbare orde, veiligheid of zedelijkheid;
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel31
  - number: 31.1.e
    text: |-
      de vergunninghouder in het in [artikel 30][ref1] bedoelde geval geen melding als in dat artikel bedoeld heeft
      gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel30
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '30'
        paragraaf: '4'
  - number: '31.2'
    text: 'Een vergunning kan voorts worden ingetrokken indien:'
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel31
  - number: 31.2.a
    text: |-
      is gehandeld in strijd met de aan de vergunning verbonden voorschriften of beperkingen, bedoeld in
      [artikel 4][ref1] of [artikel 23, derde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel23
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002458
        artikel: '23'
        paragraaf: '3'
  - number: 31.2.b
    text: |-
      een bij of krachtens de [artikelen 2][ref1], [13 tot en met 17][ref2], [19 tot en met 21][ref3],
      [22, eerste lid, onder b, tot en met 23, tweede lid][ref4], of [24][ref5] gesteld verbod of het bij
      [artikel 29, tweede lid][ref6], gesteld gebod wordt overtreden;


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0002458#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0002458#Artikel22
      [ref5]: https://wetten.overheid.nl/BWBR0002458#Artikel24
      [ref6]: https://wetten.overheid.nl/BWBR0002458#Artikel29
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002458
        artikel: '13'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0002458
        artikel: '19'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0002458
        artikel: '22'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0002458
        artikel: '24'
        paragraaf: '3'
      - id: ref6
        bwb_id: BWBR0002458
        artikel: '29'
        paragraaf: '4'
  - number: 31.2.c
    text: |-
      het reglement bedoeld in [artikel 9, eerste lid][ref1], niet wordt nageleefd, of niet wordt voldaan aan het gebod,
      bedoeld in [artikel 9, tweede lid][ref2], dat de dagen en tijdstippen waarop bedrijfsmatig of anders dan om niet
      alcoholhoudende drank wordt verstrekt duidelijk zichtbaar in de horecalokaliteit zijn aangegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel9
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002458
        artikel: '9'
        paragraaf: '2'
  - number: 31.2.d
    text: |-
      er sprake is van het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: '31.3'
    text: |-
      Indien een vergunning op grond van het tweede lid, onder a, is ingetrokken, wordt de bevoegdheid om aan de
      betrokken rechtspersoon een nieuwe vergunning te verlenen, opgeschort tot een jaar nadat het besluit tot intrekking
      onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel31
  - number: '31.4'
    text: |-
      De intrekking van een vergunning krachtens het eerste lid, onder b, c of e, of het tweede lid, kan, voor zover
      de grond tot intrekking niet de persoon van de vergunninghouder betreft, eerst geschieden een maand nadat van het
      voornemen daartoe aan de vergunninghouder schriftelijk mededeling is gedaan.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel31
  - number: '31.5'
    text: |-
      Voordat toepassing wordt gegeven aan het tweede lid, aanhef en onder d, kan het
      Bureau bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: '32.1'
    text: |-
      Indien de burgemeester of de inspecteur van oordeel is, dat een vergunning op een der in [artikel 31][ref1]
      genoemde gronden moet worden ingetrokken, doet hij daartoe onder opgave van redenen aan burgemeester en wethouders
      een voorstel.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel31
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '31'
        paragraaf: '4'
  - number: '32.2'
    text: |-
      Binnen drie maanden na ontvangst van zodanig voorstel nemen burgemeester en wethouders daaromtrent een besluit. Zij
      doen daarvan schriftelijk mededeling aan de inspecteur, indien deze het voorstel heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel32
  - number: '33'
    text: 'Een vergunning vervalt, wanneer:'
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel33
  - number: 33.a
    text: |-
      sedert haar verlening onherroepelijk is geworden, zes maanden zijn verlopen, zonder dat handelingen zijn verricht
      met gebruikmaking van de vergunning;
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel33
  - number: 33.b
    text: gedurende een jaar anders dan wegens overmacht geen handelingen zijn verricht met gebruikmaking van de vergunning;
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel33
  - number: 33.c
    text: de verlening van een vergunning, strekkende tot vervanging van eerstbedoelde vergunning, van kracht is geworden.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel33
  - number: '34'
    text: |-
      Een faillissement of toepassing van de schuldsaneringsregeling natuurlijke personen heeft ten aanzien van het
      krachtens [artikel 31, eerste lid, onder c][ref1], of [33, onder b][ref2], intrekken of vervallen van de vergunning
      een opschortende werking tot het tijdstip waarop het faillissement onderscheidenlijk de toepassing van de
      schuldsaneringsregeling eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel33
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '31'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002458
        artikel: '33'
        paragraaf: '4'
  - number: '35.1'
    text: |-
      De burgemeester kan ten aanzien van het verstrekken van zwak-alcoholhoudende drank op aanvraag ontheffing
      verlenen van het in [artikel 3][ref1] voor de uitoefening van het horecabedrijf gestelde verbod, bij een in de
      beschikking aangewezen bijzondere gelegenheid van zeer tijdelijke aard voor een aaneengesloten periode van ten
      hoogste twaalf dagen, mits de verstrekking geschiedt onder onmiddellijke leiding van een persoon die voldoet aan
      [artikel 8, tweede en vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel8
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002458
        artikel: '8'
        paragraaf: '2'
  - number: '35.2'
    text: Een ontheffing kan onder beperkingen worden verleend; aan een ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel35
  - number: '35.3'
    text: |-
      Ten aanzien van een ontheffing is [artikel 31, eerste lid, onder a en d][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel31
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '31'
        paragraaf: '4'
  - number: '35.4'
    text: Besluiten tot verlening, wijziging of intrekking van een ontheffing worden in afschrift aan de inspecteur gezonden.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel35
  - number: '36'
    text: |-
      Burgemeester en wethouders zijn bevoegd aan andere personen dan hen, die wonen in de ruimte, waarin in strijd met
      deze wet alcoholhoudende drank wordt verstrekt, de toegang tot die ruimte te ontzeggen.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel36
  - number: '37'
    text: 'In gevallen, waarin het betreft de uitoefening van het horecabedrijf of slijtersbedrijf door een gemeente:'
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel37
  - number: 37.a
    text: |-
      treden voor de toepassing van de [artikelen 3][ref1] en [32][ref2] gedeputeerde staten in de plaats van
      burgemeester en wethouders;


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel32
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002458
        artikel: '32'
        paragraaf: '4'
  - number: 37.b
    text: |-
      treedt voor de toepassing van [artikel 32][ref1] Onze commissaris in de provincie in de plaats van de burgemeester.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel32
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '32'
        paragraaf: '4'
  - number: '38'
    text: |-
      Het is verboden ter zake van een aanvraag om een vergunning of een ontheffing onjuiste of onvolledige gegevens
      te verstrekken.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel38
  - number: '39'
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van deze wet nadere regeling
      behoeven, kan deze geschieden bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel39
  - number: '40'
    text: |-
      Voor zover in deze wet niet anders is bepaald, kunnen ten aanzien van de onderwerpen, waarin zij voorziet, geen
      provinciale of gemeentelijke verordeningen worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel40
  - number: '41'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren van het Staatstoezicht op de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel41
  - number: '42'
    text: |-
      De in [artikel 41][ref1] bedoelde ambtenaren zijn bevoegd, met medeneming van de benodigde apparatuur, een woning
      binnen te treden zonder toestemming van de bewoner, waar bedrijfsmatig of anders dan om niet alcoholhoudende drank
      aan particulieren wordt verstrekt of waar naar hun redelijk vermoeden zodanige verstrekking plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel41
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '41'
        paragraaf: '7'
  - number: '43'
    text: |-
      Van een besluit als bedoeld in [artikel 41][ref1] wordt mededeling gedaan door plaatsing in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel41
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '41'
        paragraaf: '7'
  - number: '44'
    text: |-
      Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van de bij
      [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1] gestelde verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 44a.1
    text: |-
      Onze Minister kan een bestuurlijke boete opleggen ter zake van overtreding van het bepaalde bij of
      krachtens de [artikelen 2][ref1], [3][ref2], [9, tweede lid][ref3], [12 tot en met 20, vierde lid][ref4],
      [20, zesde lid][ref5], [22][ref6], [24][ref7], [25][ref8] of [29, tweede lid][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002458#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0002458#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0002458#Artikel20
      [ref6]: https://wetten.overheid.nl/BWBR0002458#Artikel22
      [ref7]: https://wetten.overheid.nl/BWBR0002458#Artikel24
      [ref8]: https://wetten.overheid.nl/BWBR0002458#Artikel25
      [ref9]: https://wetten.overheid.nl/BWBR0002458#Artikel29
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002458
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002458
        artikel: '9'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0002458
        artikel: '12'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0002458
        artikel: '20'
        paragraaf: '3'
      - id: ref6
        bwb_id: BWBR0002458
        artikel: '22'
        paragraaf: '3'
      - id: ref7
        bwb_id: BWBR0002458
        artikel: '24'
        paragraaf: '3'
      - id: ref8
        bwb_id: BWBR0002458
        artikel: '25'
        paragraaf: '3'
      - id: ref9
        bwb_id: BWBR0002458
        artikel: '29'
        paragraaf: '4'
  - number: 44a.2
    text: |-
      De hoogte van de bestuurlijke boete wordt bepaald op de wijze als voorzien in de bijlage, met dien verstande dat de
      wegens een afzonderlijke overtreding te betalen geldsom ten hoogste € 100 000 bedraagt.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel44a
  - number: 44a.3
    text: |-
      Overtredingen, met uitzondering van overtreding van [artikel 9, tweede lid][ref1], of
      [artikel 29, tweede lid][ref2], kunnen, in afwijking van het eerste lid, niet met een bestuurlijke boete worden
      afgedaan, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel29
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002458
        artikel: '29'
        paragraaf: '4'
  - number: 44a.3.a
    text: de overtreding een direct gevaar voor de gezondheid of veiligheid van de mens tot gevolg heeft; of
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel44a
  - number: 44a.3.b
    text: |-
      de in de bijlage ter zake van de overtreding voorziene bestuurlijke boete aanmerkelijk wordt overschreden door het
      met de overtreding behaalde economisch voordeel.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel44a
  - number: 44a.4
    text: |-
      De bevoegdheid tot het opleggen van een bestuurlijke boete vervalt, indien ter zake van de overtreding
      op grond waarvan de bestuurlijke boete kan worden opgelegd door burgemeester en wethouders aan de
      vergunninghouder schriftelijk mededeling is gedaan van het voornemen de vergunning in te trekken, overeenkomstig
      [artikel 31, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel31
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '31'
        paragraaf: '4'
  - number: 44b.1
    text: |-
      Bij algemene maatregel van bestuur wordt een bijlage vastgesteld, die bij elke daarin omschreven overtreding het
      bedrag van de deswege op te leggen bestuurlijke boete bepaalt.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel44b
  - number: 44b.2
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel44b
  - number: 44b.3
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het eerste lid wordt vastgesteld op voordracht van Onze Minister,
      in overeenstemming met Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel44b
  - number: '46.1'
    text: |-
      Indien de tot een inrichting behorende lokaliteiten die op 30 september 1967 in gebruik waren voor de verstrekking
      van alcoholhoudende drank in de uitoefening van het horecabedrijf of slijtersbedrijf, toen wel voldeden
      aan de ingevolge de Drankwet (Stb. 1931, 476) met betrekking tot hun afmetingen geldende eisen maar niet in
      overeenstemming zijn met de eisen, ter zake van de afmetingen van lokaliteiten voor die uitoefening gesteld
      krachtens [artikel 10 van de onderhavige wet][ref1], worden zij nochtans geacht aan de ingevolge dat artikel voor
      de uitoefening van dat bedrijf geldende afmetingseisen te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel10
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '10'
        paragraaf: '2'
  - number: '46.2'
    text: 'Het eerste lid geldt niet:'
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel46
  - number: 46.2.a
    text: |-
      indien één of meer der in dat lid bedoelde lokaliteiten van de inrichting inmiddels in enig opzicht zijn verkleind
      of een verandering in hun bestemming hebben ondergaan;
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel46
  - number: 46.2.b
    text: |-
      indien de uitoefening van het betrokken bedrijf in de inrichting na 30 september 1967 gedurende een jaar anders dan
      wegens overmacht ononderbroken gestaakt is geweest.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel46
  - number: '46.3'
    text: 'Het tweede lid, onder a, is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel46
  - number: 46.3.a
    text: |-
      met betrekking tot verkleiningen, strekkende tot aanpassing van de inrichting aan ingevolge [artikel 10][ref1]
      geldende, andere dan de in het eerste lid bedoelde eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel10
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '10'
        paragraaf: '2'
  - number: 46.3.b
    text: |-
      met betrekking tot wijzigingen ten aanzien waarvan Onze Minister, van oordeel zijnde dat daartegen uit het oogpunt
      van sociale hygiëne geen overwegende bezwaren bestaan, op aanvrage van de ondernemer die bepaling buiten toepassing
      heeft verklaard.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel46
  - number: '46.4'
    text: |-
      In een met toepassing van het eerste lid verleende vergunning wordt mede vermeld op welke lokaliteiten die
      toepassing betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel46
  - number: '47.1'
    text: |-
      Het in [artikel 13][ref1] gestelde verbod geldt tot een door Ons te bepalen tijdstip niet voor degene, die op 30
      september 1967 feitelijk alcoholhoudende drank voor gebruik ter plaatse en sterke drank voor gebruik elders dan ter
      plaatse verstrekte in een lokaliteit, waarvoor een op grond van de Drankwet (Stb. 1931, 476) verleende volledige
      vergunning gold, voor zover het die lokaliteit betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel13
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '13'
        paragraaf: '3'
  - number: '47.2'
    text: |-
      Het in [artikel 13][ref1] gestelde verbod geldt tot een door Ons te bepalen tijdstip voorts niet voor degene,
      die in een lokaliteit, waarvoor een op grond van de Drankwet (Stb. 1931, 476) verleende vergunning of verleend
      verlof A gold, op 30 september 1967 feitelijk alcoholhoudende drank voor gebruik ter plaatse verstrekte en tevens
      bedrijfsmatig aan particulieren zwak-alcoholhoudende drank voor gebruik elders dan ter plaatse verstrekte, voor
      zover het betreft het gelijktijdig in gebruik hebben van die lokaliteit voor het bedrijfsmatig verstrekken van
      alcoholhoudende drank voor gebruik ter plaatse en voor het bedrijfsmatig aan particulieren verstrekken van zwak-
      alcoholhoudende drank voor gebruik elders dan ter plaatse.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel13
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '13'
        paragraaf: '3'
  - number: '48'
    text: |-
      [Artikel 47][ref1] is van overeenkomstige toepassing voor degene, die op 1 november 1967 feitelijk een
      horecabedrijf of slijtersbedrijf uitoefende:


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel47
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '47'
        paragraaf: '9'
  - number: 48.a
    text: |-
      met gebruikmaking van een op hem krachtens artikel 29, eerste lid, van de Drankwet (Stb. 1931, 476) overgeschreven
      vergunning of verlof A van een persoon, die dat bedrijf feitelijk uitoefende op 30 september 1967, of
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel48
  - number: 48.b
    text: |-
      als rechtverkrijgende van een persoon als onder a bedoeld diens bedrijf voortzettend krachtens de wet van 14 april
      1960 (Stb. 155).
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel48
  - number: '49'
    text: 'Deze wet kan worden aangehaald als: Drank- en Horecawet.'
    url: https://wetten.overheid.nl/BWBR0002458/2009-07-01#Artikel49
