  - number: '24.6'
    text: |-
      Het eerste lid, onder c, is niet van toepassing op een horecalokaliteit of slijtlokaliteit behorend bij een
      horecabedrijf of slijtersbedrijf aangewezen krachtens artikel 30b.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel24
  - number: '25.1'
    text: |-
      Het is degene die, anders dan in de rechtmatige uitoefening van het slijtersbedrijf of horecabedrijf, een ruimte
      voor het publiek geopend houdt, verboden:
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel25
  - number: 25.1.a
    text: |-
      in die ruimte alcoholhoudende drank aanwezig te hebben, tenzij dit geschiedt ten dienste van het rechtmatig
      in die ruimte bedrijfsmatig of anders dan om niet aan particulieren verstrekken van zwak-alcoholhoudende drank
      voor gebruik elders dan ter plaatse, mits deze drank zich bevindt in een verpakking die voldoet aan de bij
      [artikel 17][ref1] gestelde eis;


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel17
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '17'
        paragraaf: '3'
  - number: 25.1.b
    text: |-
      in de voor het publiek niet toegankelijke delen van die ruimte alcoholhoudende drank in voorraad te hebben, tenzij
      het betreft:
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel25
  - number: 25.1.b.1°
    text: |-
      het in voorraad hebben van zwak-alcoholhoudende drank ten dienste van het in de rechtmatige uitoefening van een
      ander bedrijf dan het slijtersbedrijf bedrijfsmatig aan particulieren verstrekken van deze drank voor gebruik
      elders dan ter plaatse, mits deze drank zich bevindt in een verpakking die voldoet aan de bij [artikel 17][ref1]
      gestelde eis;


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel17
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '17'
        paragraaf: '3'
  - number: 25.1.b.2°
    text: |-
      het in voorraad hebben van alcoholhoudende drank ten dienste van het uitoefenen van een bedrijf, waarin waren uit
      onder meer alcoholhoudende drank plegen te worden vervaardigd;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel25
  - number: 25.1.b.3°
    text: |-
      het in voorraad hebben van alcoholhoudende drank ten dienste van het uitoefenen van een distributiepunt bedoeld
      voor verkoop op afstand.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel25
  - number: '25.2'
    text: |-
      Het is degene die, anders dan in de rechtmatige uitoefening van het horecabedrijf, een ruimte voor publiek geopend
      houdt, verboden toe te laten dat in die ruimte alcoholhoudende drank wordt genuttigd. Dit verbod geldt niet,
      indien er sprake is van een uitzondering als bedoeld in de [artikelen 13, tweede lid][ref1], of [25e][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel25e
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '13'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002458
        artikel: 25e
        paragraaf: 3a
  - number: '25.3'
    text: |-
      Het is degene die een vervoermiddel gebruikt voor het rondtrekkend uitoefenen van de kleinhandel verboden daarin,
      daarop of daaraan alcoholhoudende drank aanwezig te hebben, tenzij het betreft een vervoermiddel dat wordt gebruikt
      voor:
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel25
  - number: 25.3.a
    text: het rechtmatig aan particulieren afleveren van alcoholhoudende drank op bestelling;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel25
  - number: 25.3.b
    text: |-
      het binnen het vervoermiddel verstrekken van zwak-alcoholhoudende drank in het kader van het rondtrekkend
      uitoefenen van de kleinhandel overwegend bestaand uit de handel in een gevarieerd assortiment levensmiddelen en
      kruideniersartikelen.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel25
  - number: 25a.1
    text: |-
      Bij gemeentelijke verordening kan het bedrijfsmatig of anders dan om niet verstrekken van alcoholhoudende drank in
      inrichtingen worden verboden of aan beperkingen worden onderworpen.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel25a
  - number: 25a.2
    text: 'Bij zodanige verordening kan worden bepaald dat:'
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel25a
  - number: 25a.2.a
    text: |-
      het verbod slechts geldt voor inrichtingen van een bij die verordening aangewezen aard, in bij die verordening
      aangewezen delen van de gemeente of voor een bij die verordening aangewezen tijdsruimte;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel25a
  - number: 25a.2.b
    text: |-
      de burgemeester volgens bij die verordening te stellen regels voorschriften aan een vergunning als bedoeld in
      [artikel 3][ref1] kan verbinden en de vergunning kan beperken tot het verstrekken van zwak-alcoholhoudende drank.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel3
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '3'
        paragraaf: '2'
  - number: 25a.3
    text: |-
      Onverminderd [artikel 10, tweede en derde lid][ref1], kunnen bij gemeentelijke verordening als bedoeld in het eerste
      lid, aanvullend aan hetgeen is geregeld bij of krachtens [artikel 4.3, eerste lid, van de Omgevingswet][ref2] eisen
      worden gesteld aan de minimumvloeroppervlakte van een slijtlokaliteit of horecalokaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel4
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '10'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '4'
  - number: 25b.1
    text: |-
      Bij gemeentelijke verordening kan worden verboden dat in horecalokaliteiten en op terrassen bezoekers worden
      toegelaten beneden een bij die verordening te bepalen leeftijd welke echter niet hoger mag zijn dan 21 jaar.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel25b
  - number: 25b.2
    text: 'Bij zodanige verordening kan worden bepaald dat:'
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel25b
  - number: 25b.2.a
    text: |-
      het verbod slechts geldt voor horecalokaliteiten en terrassen van een bij die verordening aangewezen aard, in bij
      die verordening aangewezen delen van de gemeente of voor een bij die verordening aangewezen tijdsruimte;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel25b
  - number: 25b.2.b
    text: |-
      de leeftijd van degene die wenst te worden toegelaten, wordt vastgesteld op de in [artikel 20, tweede lid][ref1],
      bedoelde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel20
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '20'
        paragraaf: '3'
  - number: 25c.1
    text: |-
      Bij gemeentelijke verordening kan het bedrijfsmatig of anders dan om niet verstrekken van zwak-
      alcoholhoudende drank in of vanuit locaties als bedoeld in [artikel 18, tweede lid][ref1], of
      [artikel 19, tweede lid, onder a][ref2], worden verboden of aan beperkingen worden onderworpen. Een dergelijk
      verbod of beperking heeft slechts betrekking op een beperkte tijdsruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel19
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel25c
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '18'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002458
        artikel: '19'
        paragraaf: '3'
  - number: 25c.2
    text: |-
      Bij zodanige verordening kan worden bepaald dat het verbod slechts geldt in bij die verordening aangewezen delen
      van de gemeente.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel25c
  - number: 25d.1
    text: |-
      Bij gemeentelijke verordening kan ter bescherming van de volksgezondheid of in het belang van de openbare orde
      worden verboden bedrijfsmatig of anders dan om niet alcoholhoudende dranken te verstrekken voor gebruik ter plaatse
      tegen een prijs die voor een periode van 24 uur of korter lager is dan 60% van de prijs die in de betreffende
      horecalokaliteit of op het betreffende terras gewoonlijk wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel25d
  - number: 25d.2
    text: |-
      Bij zodanige verordening kan worden bepaald dat het verbod slechts geldt voor aanbiedingen en verstrekkingen van
      een bij die verordening aangewezen aard of in bij die verordening aangewezen delen van de gemeente.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel25d
  - number: 25e
    text: |-
      Bij gemeentelijke verordening kan met inachtneming van [artikel 3, eerste lid, van de Winkeltijdenwet][ref1]
      vrijstelling worden verleend van het in [artikel 3, eerste lid][ref2], ten aanzien van het horecabedrijf vervatte
      verbod en het in [artikel 14, eerste lid][ref3], vervatte verbod ten behoeve van proeverijen in slijtlokaliteiten
      buiten de dagen en tijden dat de slijtlokaliteiten regulier zijn opengesteld. Bij algemene maatregel van bestuur
      worden regels gesteld waaraan een proeverij moet voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0007952#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002458#Artikel14
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel25e
    references:
      - id: ref1
        bwb_id: BWBR0007952
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002458
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002458
        artikel: '14'
        paragraaf: '3'
  - number: 25f.1
    text: |-
      Bij gemeentelijke verordening kan, in geval van ernstige aantasting van de openbare orde, de leefomgeving of de
      volksgezondheid, een gebied worden aangewezen als alcoholoverlastgebied.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel25f
  - number: 25f.2
    text: 'Bij zodanige verordening kan worden bepaald dat in dit aangewezen alcoholoverlastgebied:'
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel25f
  - number: 25f.2.a
    text: |-
      het bedrijfsmatig of anders dan om niet verstrekken van zwak-alcoholhoudende drank in of vanuit locaties als
      bedoeld in [artikel 18, tweede lid][ref1], of [artikel 19, tweede lid, onder a][ref2], wordt verboden of aan
      beperkingen worden onderworpen;


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel19
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel25f
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '18'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002458
        artikel: '19'
        paragraaf: '3'
  - number: 25f.2.b
    text: |-
      in aanvulling op [artikel 27][ref1], gronden gelden waarop de burgemeester een vergunning, als bedoeld in
      [artikel 3][ref2], kan weigeren; of


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel3
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel25f
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '27'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002458
        artikel: '3'
        paragraaf: '2'
  - number: 25f.2.c
    text: |-
      verboden of beperkingen kunnen worden opgelegd als bedoeld in de [artikelen 25a][ref1], [25b][ref2], en
      [25d][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel25a
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel25b
      [ref3]: https://wetten.overheid.nl/BWBR0002458#Artikel25d
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel25f
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: 25a
        paragraaf: 3a
      - id: ref2
        bwb_id: BWBR0002458
        artikel: 25b
        paragraaf: 3a
      - id: ref3
        bwb_id: BWBR0002458
        artikel: 25d
        paragraaf: 3a
  - number: 25g.1
    text: |-
      Bij gemeentelijke verordening kan worden bepaald dat op vervoermiddelen die bestemd zijn voor het vervoer van
      personen waar bedrijfsmatig of anders dan om niet alcoholhoudende drank wordt verstrekt, een medewerker aanwezig is
      die voldoet aan de eis gesteld in [artikel 8, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel8
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel25g
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '8'
        paragraaf: '2'
  - number: 25g.2
    text: |-
      Bij zodanige verordening kan worden bepaald dat deze verplichting slechts geldt voor vervoermiddelen van bij
      die verordening aangewezen aard, in bij die verordening aangewezen delen van de gemeente of voor een bij die
      verordening aangewezen tijdsruimte.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel25g
  - number: 25g.3
    text: De burgemeester doet een melding aan Onze Minister als een zodanige verordening is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel25g
  - number: '26.1'
    text: |-
      Een aanvraag om een vergunning als bedoeld in [artikel 3][ref1] wordt gesteld op een formulier of een elektronische
      informatiedrager, die bij regeling van Onze Minister worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel3
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '3'
        paragraaf: '2'
  - number: '26.2'
    text: |-
      De gemeenteraad kan bij verordening een formulier vaststellen met aanvullende vragen, voor zover hij gebruik maakt
      van zijn bevoegdheid om:
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel26
  - number: 26.2.a
    text: |-
      in een verordening op grond van [artikel 4][ref1] rekening te houden met de aard van de paracommerciële
      rechtspersoon;


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel4
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '4'
        paragraaf: '2'
  - number: 26.2.b
    text: aan een vergunning voorschriften of beperkingen te verbinden op grond van artikel 25a;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel26
  - number: 26.2.c
    text: in een verordening op grond van artikel 25b rekening te houden met de aard van de horecalokaliteiten of terrassen.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel26
  - number: '26.3'
    text: |-
      Bij regeling van Onze Minister kunnen ten aanzien van het formulier, bedoeld in het tweede lid, nadere regels
      worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel26
  - number: '27.1'
    text: 'Een vergunning wordt geweigerd indien:'
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel27
  - number: 27.1.a
    text: |-
      niet wordt voldaan aan de ingevolge de [artikelen 8 tot en met 10][ref1] geldende eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel8
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '8'
        paragraaf: '2'
  - number: 27.1.b
    text: |-
      redelijkerwijs moet worden aangenomen, dat de feitelijke toestand niet met het in de aanvrage vermelde in
      overeenstemming zal zijn;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel27
  - number: 27.1.c
    text: |-
      [artikel 7, tweede lid][ref1], [artikel 31, vierde lid][ref2], en [artikel 32, tweede lid][ref3], zich tegen de
      verlening van de gevraagde vergunning verzet;


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0002458#Artikel32
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002458
        artikel: '31'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0002458
        artikel: '32'
        paragraaf: '4'
  - number: 27.1.d
    text: |-
      redelijkerwijs moet worden aangenomen dat een of meer van de bij of krachtens de [artikelen 2][ref1] en
      [13 tot en met 24][ref2] gestelde verboden zal worden overtreden of dat in strijd zal worden gehandeld met aan de
      vergunning verbonden beperkingen of voorschriften;


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel13
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002458
        artikel: '13'
        paragraaf: '3'
  - number: 27.1.e
    text: |-
      niet wordt voldaan aan het bepaalde krachtens [artikel 25a, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel25a
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: 25a
        paragraaf: 3a
  - number: '27.2'
    text: |-
      Een vergunning ten aanzien van een inrichting, waarvan de vergunning op grond van
      [artikel 31, eerste lid, onder c][ref1], is ingetrokken, kan gedurende een bij die intrekking vastgestelde termijn
      van ten hoogste vijf jaar worden geweigerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel31
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '31'
        paragraaf: '4'
  - number: '27.3'
    text: |-
      Een vergunning kan worden geweigerd in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: '27.4'
    text: |-
      Voordat toepassing wordt gegeven aan het derde lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: '28'
    text: |-
      Een vergunning wordt verleend, indien geen der in [artikel 27][ref1] bedoelde weigeringsgronden aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel27
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '27'
        paragraaf: '4'
  - number: '29.1'
    text: 'De burgemeester vermeldt in een vergunning:'
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel29
  - number: 29.1.a
    text: de vergunninghouder;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel29
  - number: 29.1.b
    text: tot welke bedrijfsuitoefening de vergunning strekt;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel29
  - number: 29.1.c
    text: de plaats waar de inrichting zich bevindt;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel29
  - number: 29.1.d
    text: de situering en de oppervlakten van de horeca- of slijtlokaliteiten en terrassen;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel29
  - number: 29.1.e
    text: de voorschriften of beperkingen welke aan de vergunning zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel29
  - number: '29.2'
    text: |-
      De burgemeester vermeldt in een aanhangsel bij de vergunning de leidinggevenden en indien van toepassing de
      personen aangewezen krachtens [artikel 30b][ref1]. Ten aanzien van een leidinggevende bij wie sprake is van een
      situatie als bedoeld in [artikel 8, vierde lid][ref2], maakt de burgemeester daaromtrent een aantekening.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel30b
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel8
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: 30b
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002458
        artikel: '8'
        paragraaf: '2'
  - number: '29.3'
    text: |-
      De vergunning en het daarbij behorende aanhangsel, of afschriften daarvan, en in voorkomende gevallen een afschrift
      van de aanvraag, bedoeld in [artikel 30a, eerste lid][ref1], en de ontvangstbevestiging, bedoeld in artikel 30a,
      vierde lid, of een afschrift daarvan, zijn in de inrichting aanwezig.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel30a
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: 30a
        paragraaf: '4'
  - number: '29.4'
    text: |-
      De vergunning en het aanhangsel worden gesteld op een formulier dat bij regeling van Onze Minister wordt
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel29
  - number: '30'
    text: |-
      Indien een inrichting een zodanige verandering ondergaat dat zij niet langer in overeenstemming is met de in
      de vergunning gegeven omschrijving, is de vergunninghouder verplicht bedoelde wijziging binnen één maand bij de
      burgemeester te melden. De burgemeester verstrekt, indien nog aan de ten aanzien van de inrichting gestelde eisen
      wordt voldaan, een gewijzigde vergunning, waarin de ingevolge [artikel 29][ref1] vereiste omschrijving is aangepast
      aan de nieuwe situatie.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel29
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '29'
        paragraaf: '4'
  - number: 30a.1
    text: 'Een vergunninghouder meldt aan de burgemeester zijn wens:'
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel30a
  - number: 30a.1.a
    text: een persoon als leidinggevende te laten bijschrijven;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel30a
  - number: 30a.1.b
    text: |-
      de aantekening door te laten halen dat een leidinggevende geen bemoeienis heeft met de bedrijfsvoering of de
      exploitatie van het horecabedrijf of slijtersbedrijf.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel30a
  - number: 30a.2
    text: Deze melding geldt als aanvraag tot wijziging van het aanhangsel.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel30a
  - number: 30a.3
    text: |-
      De aanvraag wordt gesteld op een formulier of een elektronische informatiedrager, die bij regeling van Onze
      Minister worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel30a
  - number: 30a.4
    text: De burgemeester bevestigt onverwijld schriftelijk of elektronisch de ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel30a
  - number: 30a.5
    text: 'De burgemeester weigert de wijziging van het aanhangsel:'
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel30a
  - number: 30a.5.a
    text: |-
      indien de persoon bedoeld in het eerste lid, niet voldoet aan de bij of krachtens
      [artikel 8, eerste tot en met vijfde lid][ref1] gestelde eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel8
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '8'
        paragraaf: '2'
  - number: 30a.5.b
    text: |-
      in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: 30a.6
    text: |-
      Alvorens te beslissen op een aanvraag tot wijziging van het aanhangsel kan het Bureau bevordering
      integriteitsbeoordelingen, bedoeld in [artikel 8 van de Wet bevordering integriteitsbeoordelingen][ref1], door het
      openbaar bestuur om een advies als bedoeld in [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: 30b.1
    text: |-
      [Artikel 30a][ref1] is van overeenkomstige toepassing op een bij algemene maatregel van bestuur aan te wijzen
      categorie van personen die werkzaam zijn in bij algemene maatregel van bestuur aan te wijzen categorieën van
      horecabedrijven of slijtersbedrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel30a
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel30b
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: 30a
        paragraaf: '4'
  - number: 30b.2
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel30b
  - number: '31.1'
    text: 'Een vergunning wordt door de burgemeester ingetrokken, indien:'
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel31
  - number: 31.1.a
    text: |-
      de te harer verkrijging verstrekte gegevens zodanig onjuist of onvolledig blijken, dat op de aanvrage een andere
      beslissing zou zijn genomen, als bij de beoordeling daarvan de juiste omstandigheden volledig bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel31
  - number: 31.1.b
    text: |-
      niet langer wordt voldaan aan de bij of krachtens [artikelen 8][ref1] en [10][ref2] geldende eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel10
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '8'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002458
        artikel: '10'
        paragraaf: '2'
  - number: 31.1.c
    text: |-
      zich in de betrokken inrichting feiten hebben voorgedaan, die de vrees wettigen, dat het van kracht blijven der
      vergunning gevaar zou opleveren voor de openbare orde, veiligheid of zedelijkheid;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel31
  - number: 31.1.d
    text: |-
      de vergunninghouder in de in de [artikelen 30][ref1] en [30a][ref2], eerste lid, bedoelde gevallen geen melding als
      in die artikelen bedoeld heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel30a
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '30'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002458
        artikel: 30a
        paragraaf: '4'
  - number: '31.2'
    text: |-
      Een vergunning kan door de burgemeester worden ingetrokken indien de vergunninghouder de bij of krachtens deze wet
      gestelde regels, dan wel de aan een vergunning of ontheffing verbonden voorschriften en beperkingen, niet nakomt.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel31
  - number: '31.3'
    text: 'Een vergunning kan voorts door de burgemeester worden ingetrokken, indien:'
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel31
  - number: 31.3.a
    text: |-
      er sprake is van het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1]. Voordat daaraan
      toepassing wordt gegeven, kan het Bureau bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld
      in [artikel 8 van voornoemde wet][ref2], om een advies als bedoeld in [artikel 9 van die wet][ref3] worden
      gevraagd;


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0013798
        artikel: '9'
  - number: 31.3.b
    text: |-
      een vergunninghouder in een periode van twee jaar ten minste drie maal op grond van
      [artikel 30a, eerste lid][ref1], om bijschrijving van een persoon op het aanhangsel bij de vergunning heeft
      verzocht en de burgemeester die wijziging van het aanhangsel ten minste driemaal heeft geweigerd op grond van
      artikel 30a, vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel30a
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: 30a
        paragraaf: '4'
  - number: '31.4'
    text: |-
      Indien een vergunning is ingetrokken omdat is gehandeld in strijd met de voorschriften en beperkingen verbonden
      aan de vergunning, bedoeld in [artikel 4][ref1] of 25a, wordt de bevoegdheid om aan de betrokken rechtspersoon een
      nieuwe vergunning te verlenen opgeschort tot een jaar nadat het besluit tot intrekking onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel4
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '4'
        paragraaf: '2'
  - number: '32.1'
    text: |-
      Een vergunning kan in de gevallen bedoeld in [artikel 31, tweede en derde lid][ref1], door de burgemeester worden
      geschorst voor een periode van ten hoogste 12 weken.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel31
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '31'
        paragraaf: '4'
  - number: '32.2'
    text: |-
      Tijdens de schorsing verleent de burgemeester de vergunninghouder geen nieuwe vergunning op grond van
      [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel3
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '3'
        paragraaf: '2'
  - number: '33'
    text: 'Een vergunning vervalt, wanneer:'
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel33
  - number: 33.a
    text: |-
      sedert haar verlening onherroepelijk is geworden, zes maanden zijn verlopen, zonder dat handelingen zijn verricht
      met gebruikmaking van de vergunning;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel33
  - number: 33.b
    text: gedurende een jaar anders dan wegens overmacht geen handelingen zijn verricht met gebruikmaking van de vergunning;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel33
  - number: 33.c
    text: de verlening van een vergunning, strekkende tot vervanging van eerstbedoelde vergunning, van kracht is geworden.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel33
  - number: '34'
    text: |-
      Een faillissement of toepassing van de schuldsaneringsregeling natuurlijke personen heeft ten aanzien van het
      krachtens [artikel 31, eerste lid, onder d][ref1], of [33, onder b][ref2], intrekken of vervallen van de vergunning
      een opschortende werking tot het tijdstip waarop het faillissement onderscheidenlijk de toepassing van de
      schuldsaneringsregeling eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel33
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '31'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002458
        artikel: '33'
        paragraaf: '4'
  - number: '35.1'
    text: |-
      De burgemeester kan ten aanzien van het verstrekken van zwak-alcoholhoudende drank op aanvraag ontheffing verlenen
      van het in [artikel 3][ref1] voor de uitoefening van het horecabedrijf gestelde verbod, bij een in de beschikking
      aangewezen bijzondere gelegenheid van zeer tijdelijke aard voor een aaneengesloten periode van ten hoogste twaalf
      dagen, mits de verstrekking geschiedt onder onmiddellijke leiding van een persoon die:


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel3
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '3'
        paragraaf: '2'
  - number: 35.1.a
    text: de leeftijd van eenentwintig jaar heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel35
  - number: 35.1.b
    text: niet in enig opzicht van slecht levensgedrag is.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel35
  - number: '35.2'
    text: Een ontheffing kan onder beperkingen worden verleend; aan een ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel35
  - number: '35.3'
    text: |-
      Ten aanzien van een ontheffing is [artikel 31, eerste lid, onder a en c][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel31
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '31'
        paragraaf: '4'
  - number: '35.4'
    text: De ontheffing, of een afschrift daarvan, is ter plaatse aanwezig.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel35
  - number: '35.5'
    text: |-
      Een burgemeester kan naar aanleiding van een aanvraag voor ontheffingen als bedoeld in dit artikel, voor jaarlijks
      terugkerende identieke bijzondere gelegenheden van zeer tijdelijke aard, besluiten één ontheffing te verlenen,
      mits de verstrekking van zwak-alcoholhoudende drank telkenmale geschiedt onder onmiddellijke leiding van dezelfde
      persoon.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel35
  - number: '35.6'
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op de aanvraag om een ontheffing
      als bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '35.7'
    text: |-
      Een aanvraag voor een ontheffing wordt gesteld op een formulier of een elektronische informatiedrager, die bij
      regeling van Onze Minister worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel35
  - number: '36'
    text: |-
      De burgemeester is bevoegd aan andere personen dan hen, die wonen in de ruimte, waarin in strijd met deze wet
      alcoholhoudende drank wordt verstrekt, de toegang tot die ruimte te ontzeggen.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel36
  - number: '38'
    text: |-
      Het is verboden ter zake van een aanvraag om een vergunning of een ontheffing onjuiste of onvolledige gegevens
      te verstrekken.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel38
  - number: '39'
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van deze wet nadere regeling
      behoeven, kan deze geschieden bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel39
  - number: '40'
    text: |-
      Voor zover in deze wet niet anders is bepaald, kunnen ten aanzien van de onderwerpen, waarin zij voorziet, geen
      provinciale of gemeentelijke verordeningen worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel40
  - number: '41.1'
    text: 'Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast:'
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel41
  - number: 41.1.a
    text: 'in geheel Nederland: de bij besluit van Onze Minister aangewezen ambtenaren of andere personen.'
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel41
  - number: 41.1.b
    text: 'in een gemeente: de door de burgemeester van die gemeente aangewezen ambtenaren.'
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel41
  - number: '41.2'
    text: 'Bij regeling van Onze Minister, in overeenstemming met Onze Minister van Justitie en Veiligheid:'
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel41
  - number: 41.2.a
    text: |-
      wordt de taakverdeling tussen de ambtenaren of andere personen, behorende tot de onderscheidene in het eerste lid
      bedoelde categorieën geregeld;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel41
  - number: 41.2.b
    text: kunnen aanstellings- en opleidingseisen voor die ambtenaren of andere personen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel41
  - number: '41.3'
    text: |-
      In afwijking van het eerste lid zijn met het toezicht op naleving van het verbod, bedoeld in de
      [artikelen 14, tweede lid][ref1], en [15, eerste lid][ref2], voor zover het tabaksproducten en aanverwante
      producten in de zin van de [Tabaks- en rookwarenwet][ref3] betreft, de op grond van [artikel 13][ref4] van die Wet
      aangewezen ambtenaren of andere personen belast.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0004302
      [ref4]: https://wetten.overheid.nl/BWBR0004302#Artikel13
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '14'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002458
        artikel: '15'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0004302
      - id: ref4
        bwb_id: BWBR0004302
        artikel: '13'
  - number: '42'
    text: |-
      De in [artikel 41][ref1] bedoelde ambtenaren zijn bevoegd, met medeneming van de benodigde apparatuur, een woning
      binnen te treden zonder toestemming van de bewoner, waar bedrijfsmatig of anders dan om niet alcoholhoudende drank
      aan particulieren wordt verstrekt of waar naar hun redelijk vermoeden zodanige verstrekking plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel41
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '41'
        paragraaf: '7'
  - number: 42a.1
    text: |-
      De in [artikel 41, eerste lid, onder a][ref1], bedoelde ambtenaren zijn bevoegd tot het sluiten van een
      verkoopovereenkomst als bedoeld in [artikel 20a, vierde lid][ref2], onder verstrekking van onjuiste of
      onvolledige gegevens met betrekking tot hun naam, adres en leeftijd, voor zover dat voor de vervulling van
      hun taken dringend noodzakelijk is. Zij brengen degene die alcoholhoudende drank te koop aanbiedt of verkoopt
      in het kader van verkoop op afstand niet tot andere overtredingen dan waarop diens opzet reeds was gericht.
      [Artikel 5:12, tweede lid, van de Algemene wet bestuursrecht][ref3] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel20a
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '41'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0002458
        artikel: 20a
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 42a.2
    text: |-
      De ambtenaar die gebruik heeft gemaakt van de bevoegdheid, bedoeld in het eerste lid, maakt daarvan op zijn
      ambtseed of -belofte een schriftelijk verslag op waarin hij vermeldt:
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel42a
  - number: 42a.2.a
    text: zijn naam of nummer en zijn hoedanigheid;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel42a
  - number: 42a.2.b
    text: de motivering van de dringende noodzaak, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel42a
  - number: 42a.2.c
    text: |-
      het adres, waaronder indien van toepassing het elektronische adres, en, voor zover bekend, de omschrijving van de
      desbetreffende aanbieder of verkoper van alcoholhoudende drank op afstand;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel42a
  - number: 42a.2.d
    text: de onjuiste of onvolledige gegevens die bij het verrichten van de handelingen zijn verstrekt;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel42a
  - number: 42a.2.e
    text: de wijze waarop en het tijdvak waarin de handelingen hebben plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel42a
  - number: 42a.2.f
    text: hetgeen tijdens het onderzoek is verricht, gebleken en overigens is voorgevallen.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel42a
  - number: '43'
    text: |-
      Van een besluit als bedoeld in [artikel 41, eerste lid, onderdelen a en b][ref1], wordt mededeling gedaan door
      plaatsing in de Staatscourant onderscheidenlijk het gemeenteblad.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel41
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '41'
        paragraaf: '7'
  - number: 43a.1
    text: |-
      De gemeenteraad stelt uiterlijk zes maanden na inwerkingtreding van dit artikel voor de eerste maal een preventie-
      en handhavingsplan alcohol vast. Vervolgens wordt dit plan elke vier jaar gelijktijdig met de vaststelling van de
      nota gemeentelijk gezondheidsbeleid, bedoeld in [artikel 13, tweede lid, van de Wet publieke gezondheid][ref1],
      vastgesteld. Het plan kan tussentijds worden gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel13
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '13'
  - number: 43a.2
    text: |-
      Het plan bevat de hoofdzaken van het beleid betreffende de preventie van alcoholgebruik, met name onder jongeren,
      en de handhaving van de wet.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel43a
  - number: 43a.3
    text: 'In het plan wordt in ieder geval aangegeven:'
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel43a
  - number: 43a.3.a
    text: wat de doelstellingen zijn van het preventie- en handhavingsbeleid alcohol;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel43a
  - number: 43a.3.b
    text: |-
      welke acties worden ondernomen om alcoholgebruik, met name onder jongeren, te
      voorkomen, al dan niet in samenhang met andere preventieprogramma’s als bedoeld in
      [artikel 2, tweede lid, onderdeel d, van de Wet Publieke Gezondheid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel2
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '2'
  - number: 43a.3.c
    text: |-
      de wijze waarop het handhavingsbeleid wordt uitgevoerd en welke handhavingsacties in de door het plan bestreken
      periode worden ondernomen;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel43a
  - number: 43a.3.d
    text: welke resultaten in de door het plan bestreken periode minimaal behaald dienen te worden.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel43a
  - number: 43b
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder dwangsom ter handhaving van
      [artikel 2a, eerste en tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel43b
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: 2a
        paragraaf: '2'
  - number: '44.1'
    text: |-
      De burgemeester kan de natuurlijke persoon of de rechtspersoon die een bedrijf exploiteert als bedoeld in
      [artikel 18, tweede lid][ref1], de bevoegdheid ontzeggen zwak-alcoholhoudende drank te verkopen vanaf de locatie
      waar in een periode van 12 maanden driemaal [artikel 20, eerste lid][ref2], is overtreden.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel20
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '18'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002458
        artikel: '20'
        paragraaf: '3'
  - number: '44.2'
    text: |-
      Onze Minister kan de natuurlijke persoon of de rechtspersoon die een slijtersbedrijf exploiteert of bedrijf
      exploiteert als bedoeld in [artikel 19, tweede lid, onder a][ref1], en die in een periode van 12 maanden driemaal
      [artikel 20a, derde of vierde lid][ref2], heeft overtreden, de bevoegdheid ontzeggen ten aanzien van zwak-
      alcoholhoudende drank of sterke drank een verkoopovereenkomst te sluiten in het kader van een georganiseerd systeem
      voor verkoop op afstand.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel20a
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel44
    references:
