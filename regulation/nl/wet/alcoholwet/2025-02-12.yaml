        bwb_id: BWBR0002458
        artikel: 20a
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0002458
        artikel: '25'
        paragraaf: '3'
  - number: 44aa.1.b
    text: |-
      de [artikelen 20, eerste tot en met derde lid][ref1], en [24, derde lid][ref2], gepleegd in of op de in
      [artikel 1, derde lid, onder a, b en c][ref3], genoemde vervoermiddelen, legerplaatsen en lokaliteiten, die aan het
      militair gezag onderworpen zijn, en op luchtvaartterreinen gelegen winkels.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0002458#Artikel1
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel44aa
    references:
