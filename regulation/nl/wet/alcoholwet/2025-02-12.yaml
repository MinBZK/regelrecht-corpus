  - number: 24.5.g
    text: |-
      [artikel 2.107l van de Wet voortgezet onderwijs 2020][ref1] in samenhang met
      artikel [2.26, tweede lid, onderdelen, f, h, i, en j, van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2
