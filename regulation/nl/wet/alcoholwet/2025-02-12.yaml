  - number: 1.3.a
    text: vervoermiddelen die bestemd zijn voor het vervoer van personen, tijdens hun gebruik als zodanig;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel1
  - number: 1.3.b
    text: |-
      legerplaatsen en lokaliteiten, aan het militair gezag onderworpen, gedurende de tijd dat deze uitsluitend voor
      militaire doeleinden worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel1
  - number: 1.3.c
    text: |-
      op luchtvaartterreinen opengesteld voor verkeer van en naar landen buiten de Europese Unie gelegen winkels in het
      gebied dat uitsluitend toegankelijk is voor personen die in het bezit zijn van een geldig reisbiljet of een daartoe
      afgegeven persoonsgebonden kaart.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel1
  - number: '2.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen in het belang van de volksgezondheid regels worden gesteld met betrekking
      tot de inhoud van reclame voor alcoholhoudende drank, de doelgroepen waarop zodanige reclame is gericht, alsmede
      de tijd en wijze waarop en de plaats waar reclame wordt gemaakt. Deze regels kunnen verboden, beperkingen van en
      voorschriften ten aanzien van reclameuitingen bevatten. In de maatregel wordt een overgangsregeling getroffen ten
      aanzien van reclameuitingen die reeds waren geopenbaard op het tijdstip van inwerkingtreding van die maatregel.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel2
  - number: '2.2'
    text: |-
      Het is verboden voor alcoholhoudende drank reclame te maken, welke niet voldoet aan de krachtens het eerste lid
      gestelde regels.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel2
  - number: '2.3'
    text: |-
      Het in het tweede lid genoemde verbod geldt niet ten aanzien van reclameuitingen voor alcoholhoudende drank, waarin
      met betrekking tot die drank slechts aanduidingen voorkomen betreffende merk, soort en prijs alsmede de plaats waar
      die drank wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel2
  - number: '2.4'
    text: |-
      Een krachtens het eerste lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan acht
      weken na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel2
  - number: 2a.1
    text: |-
      Het is verboden om bedrijfsmatig of anders dan om niet alcoholhoudende drank aan te bieden of te verstrekken voor
      gebruik elders dan ter plaatse tegen een prijs die voor een periode van een maand of korter lager is dan 75% van de
      prijs die in het betreffende verkooppunt gewoonlijk wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel2a
  - number: 2a.2
    text: |-
      Het is verboden om bedrijfsmatig of anders dan om niet alcoholhoudende drank aan te bieden of te verstrekken
      voor gebruik elders dan ter plaatse waarbij de indruk wordt gewekt dat de prijs lager is dan 75% van de prijs die
      gewoonlijk wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel2a
  - number: '3.1'
    text: |-
      Het is verboden zonder daartoe strekkende vergunning van de burgemeester het horecabedrijf of slijtersbedrijf uit
      te oefenen.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel3
  - number: '3.2'
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op de aanvraag van een vergunning
      als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '4.1'
    text: |-
      Bij gemeentelijke verordening worden ter voorkoming van oneerlijke mededinging regels gesteld waaraan
      paracommerciële rechtspersonen zich te houden hebben bij de verstrekking van alcoholhoudende drank.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel4
  - number: '4.2'
    text: |-
      Bij zodanige verordening is het de gemeente toegestaan rekening te houden met de aard van de paracommerciële
      rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel4
  - number: '4.3'
    text: 'De in het eerste lid bedoelde regels hebben in elk geval betrekking op de volgende onderwerpen:'
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel4
  - number: 4.3.a
    text: de tijden gedurende welke in de betrokken inrichting alcoholhoudende drank mag worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel4
  - number: 4.3.b
    text: in de inrichting te houden bijeenkomsten van persoonlijke aard, zoals bruiloften en partijen;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel4
  - number: 4.3.c
    text: |-
      in de inrichting te houden bijeenkomsten die gericht zijn op personen die niet of niet rechtstreeks bij de
      activiteiten van de betreffende rechtspersoon betrokken zijn.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel4
  - number: '4.4'
    text: |-
      De burgemeester kan met het oog op bijzondere gelegenheden van zeer tijdelijke aard voor een aaneengesloten periode
      van ten hoogste twaalf dagen ontheffing verlenen van de bij of krachtens dit artikel gestelde regels.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel4
  - number: '4.5'
    text: De ontheffing, of een afschrift daarvan, is in de inrichting aanwezig.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel4
  - number: '4.6'
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op een aanvraag om een ontheffing
      als bedoeld in het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '6'
    text: |-
      Op de voorbereiding van een beslissing tot verlening van een vergunning op grond van artikel 3 voor het
      horecabedrijf aan een paracommerciële rechtspersoon is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '7.1'
    text: Een vergunning is vereist voor iedere inrichting.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel7
  - number: '7.2'
    text: |-
      Geen vergunning wordt verleend voor het uitoefenen van het horecabedrijf of slijtersbedrijf anders dan in een
      inrichting.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel7
  - number: '7.3'
    text: |-
      Indien een terras onderdeel is van een inrichting, die onderdeel uitmaakt van een winkel wordt slechts een
      vergunning ten aanzien van het terras verleend, indien dit onmiddellijk aansluit aan een horecalokaliteit.
      Voor de overige terrassen wordt slechts vergunning verleend, indien zij in de onmiddellijke nabijheid van een
      horecalokaliteit zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel7
  - number: '8.1'
    text: 'Leidinggevenden van het horecabedrijf en het slijtersbedrijf voldoen aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel8
  - number: 8.1.a
    text: zij hebben de leeftijd van eenentwintig jaar bereikt;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel8
  - number: 8.1.b
    text: zij zijn niet in enig opzicht van slecht levensgedrag;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel8
  - number: 8.1.c
    text: zij mogen niet onder curatele staan.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel8
  - number: '8.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden naast de in het eerste lid gestelde eisen andere eisen
      ten aanzien van het zedelijk gedrag van leidinggevenden gesteld en kan de in dat lid, onder b, gestelde eis nader
      worden omschreven.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel8
  - number: '8.3'
    text: |-
      Leidinggevenden beschikken tevens over voldoende kennis en inzicht met betrekking tot sociale hygiëne en zijn
      ingeschreven in het Register sociale hygiëne, genoemd in [artikel 11c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel11c
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: 11c
        paragraaf: 2a
  - number: '8.4'
    text: |-
      De in het derde lid gestelde eis geldt niet voor leidinggevenden voor wier rekening en risico het horecabedrijf of
      het slijtersbedrijf wordt uitgeoefend, indien die leidinggevenden geen bemoeienis hebben met de bedrijfsvoering of
      de exploitatie van het horecabedrijf of het slijtersbedrijf waarvoor vergunning wordt gevraagd of is verkregen en
      de vergunninghouder dit in een schriftelijke verklaring bevestigt.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel8
  - number: '8.5'
    text: |-
      Indien een paracommerciële rechtspersoon het horecabedrijf uitoefent, voldoen ten minste twee leidinggevenden aan
      de bij of krachtens dit artikel gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel8
  - number: '8.6'
    text: |-
      Het eerste lid, onderdeel a, en het derde lid zijn tevens van toepassing op personen die onmiddellijk leidinggeven
      aan een horecabedrijf of slijtersbedrijf.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel8
  - number: '9.1'
    text: |-
      Het bestuur van een paracommerciële rechtspersoon stelt voor het verkrijgen van een vergunning tot uitoefening van
      het horecabedrijf een reglement vast dat waarborgt dat de verstrekking van alcoholhoudende drank in de inrichting
      vanuit het oogpunt van sociale hygiëne op verantwoorde wijze geschiedt.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel9
  - number: '9.2'
    text: 'In het reglement wordt vastgelegd:'
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel9
  - number: 9.2.a
    text: |-
      welke kwalificatienormen worden gesteld aan de voorlichtingsinstructie op het gebied van sociale hygiëne die
      barvrijwilligers krijgen om te kunnen voldoen aan de eis gesteld in [artikel 24, tweede lid onder c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel24
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '24'
        paragraaf: '3'
  - number: 9.2.b
    text: de wijze waarop door of namens het bestuur wordt toegezien op de naleving van het reglement.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel9
  - number: '9.3'
    text: |-
      De paracommerciële rechtspersoon houdt een registratie bij van de barvrijwilligers die de in het tweede lid
      bedoelde voorlichtingsinstructie hebben gekregen. Deze registratie of een afschrift daarvan is in de inrichting
      aanwezig.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel9
  - number: '9.4'
    text: Het reglement of een afschrift daarvan, is in de inrichting aanwezig.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel9
  - number: '9.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de inhoud
      van het reglement.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel9
  - number: '10.1'
    text: Een slijtlokaliteit staat niet rechtstreeks in verbinding met een neringruimte.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel10
  - number: '10.2'
    text: |-
      Een inrichting waarin het horecabedrijf wordt uitgeoefend, heeft ten minste één horecalokaliteit met
      een vloeroppervlakte van ten minste 35 m2. De burgemeester kan besluiten af te wijken van de eerste
      zin, indien er sprake is van een lokaliteit die is gevestigd in een rijksmonument als bedoeld in
      [artikel 1.1 van de Erfgoedwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel1
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '1'
  - number: '10.3'
    text: |-
      Een inrichting waarin het slijtersbedrijf wordt uitgeoefend heeft ten minste één slijtlokaliteit met een
      vloeroppervlakte van ten minste 15 m2.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel10
  - number: '10.4'
    text: |-
      Bij ministeriële regeling worden eisen gesteld aan de minimale verbindingsruimte tussen een slijtlokaliteit en
      een neringruimte.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel10
  - number: '10.5'
    text: |-
      De bij of krachtens dit artikel gestelde eisen gelden in aanvulling op hetgeen is geregeld bij of krachtens
      [artikel 4.3, eerste lid, van de Omgevingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel4
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '4'
  - number: '11'
    text: |-
      Een krachtens [artikel 3][ref1] verleende vergunning geldt ten aanzien van het verstrekken van alcoholhoudende
      drank niet voor andere gedeelten van de openbare weg dan die, waar dat verstrekken door de burgemeester
      uitdrukkelijk is toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel3
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '3'
        paragraaf: '2'
  - number: 11a.1
    text: Er is een Landelijke commissie sociale hygiëne.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel11a
  - number: 11a.2
    text: De Landelijke commissie sociale hygiëne is gevestigd in een door Onze Minister aangewezen plaats.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel11a
  - number: 11b.1
    text: De Landelijke commissie sociale hygiëne bestaat uit ten minste drie en ten hoogste vijf leden.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel11b
  - number: 11b.2
    text: |-
      De leden worden benoemd voor een periode van vier jaar. Herbenoeming kan eenmaal plaatsvinden voor een periode van
      vier jaar.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel11b
  - number: 11b.3
    text: De Landelijke commissie sociale hygiëne stelt een bestuursreglement vast en maakt deze openbaar.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel11b
  - number: 11c.1
    text: 'De Landelijke commissie sociale hygiëne heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel11c
  - number: 11c.1.a
    text: het erkennen van diploma’s op grond van de bijbehorende eindtermen als bewijsstuk;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel11c
  - number: 11c.1.b
    text: |-
      het inschrijven van personen in het Register sociale hygiëne en het afgeven van de Verklaring kennis en inzicht
      sociale hygiëne aan die personen;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel11c
  - number: 11c.1.c
    text: |-
      het voor eenieder raadpleegbaar maken van het Register sociale hygiëne op basis van achternaam, voorletters en
      geboortedatum.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel11c
  - number: 11c.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen extra taken aan de Landelijke commissie sociale hygiëne
      worden opgedragen voor zover die noodzakelijk zijn voor het waarborgen van voldoende kennis en inzicht met
      betrekking tot sociale hygiëne bij leidinggevenden.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel11c
  - number: 11c.3
    text: |-
      De Landelijke commissie sociale hygiëne is bevoegd tot het verwerken van persoonsgegevens waaronder het
      burgerservicenummer, bedoeld in [artikel 1, onder b, van de Wet algemene bepalingen burgerservicenummer][ref1],
      voor zover dit voor de uitvoering van haar taken noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel1
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel11c
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '1'
  - number: 11d.1
    text: |-
      Een diploma wordt slechts erkend als bewijsstuk indien de onderwijsinstelling die het diploma afgeeft, waarborgt
      dat degene die het diploma ontvangt, beschikt over voldoende kennis en inzicht met betrekking tot sociale hygiëne.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel11d
  - number: 11d.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald wat in elk geval onder sociale hygiëne wordt verstaan
      en kunnen andere voorwaarden worden gesteld aan de erkenning van diploma’s als bewijsstuk.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel11d
  - number: 11d.3
    text: Een erkenning van een diploma als bewijsstuk geldt voor een periode van vijf jaar.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel11d
  - number: 11d.4
    text: |-
      Indien de onderwijsinstelling die het diploma afgeeft niet langer voldoet aan het bepaalde bij of krachtens het
      eerste en tweede lid, kan de erkenning van het diploma als bewijsstuk worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel11d
  - number: 11e.1
    text: 'Inschrijving in het Register sociale hygiëne vindt slechts plaats indien de in te schrijven persoon:'
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel11e
  - number: 11e.1.a
    text: beschikt over een diploma welke door de Landelijke commissie sociale hygiëne als bewijsstuk is erkend;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel11e
  - number: 11e.1.b
    text: |-
      beschikt over een bewijsstuk dat is verkregen in een andere lidstaat van de Europese Unie dan wel een staat, niet
      zijnde een lidstaat van de Europese Unie, die partij is bij een daartoe strekkend of mede daartoe strekkend verdrag
      dat Nederland bindt, welk bewijsstuk een beroepsniveau waarborgt dat ten minste gelijkwaardig is aan het niveau dat
      met de erkende diploma’s bedoeld in [artikel 11c, onder a][ref1], wordt nagestreefd; of


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel11c
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel11e
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: 11c
        paragraaf: 2a
  - number: 11e.1.c
    text: |-
      voldoet aan artikel 19 van [Richtlijn 2005/36/EG](32005L0036) van het Europees Parlement en de Raad van 7 september
      2005 betreffende de erkenning van beroepskwalificaties (PbEU 2005, L 255).
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel11e
  - number: 11e.2
    text: Op zijn verzoek wordt een ingeschreven persoon uit het Register sociale hygiëne uitgeschreven.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel11e
  - number: 11f.1
    text: |-
      De Landelijke commissie sociale hygiëne brengt de kosten die samenhangen met het erkennen van een diploma als
      bewijsstuk, het inschrijven in het Register sociale hygiëne en het afgeven van een Verklaring kennis en inzicht
      sociale hygiëne ten laste van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel11f
  - number: 11f.2
    text: De bedragen ter vergoeding van de kosten worden bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel11f
  - number: '12.1'
    text: |-
      Het is verboden alcoholhoudende drank te verstrekken voor gebruik ter plaatse anders dan in een in de vergunning
      vermelde horecalokaliteit of anders dan op een in de vergunning vermeld terras, tenzij het betreft het vanuit
      zodanige lokaliteit afleveren van alcoholhoudende drank op bestelling in hotelkamers ingericht voor nachtverblijf
      of het verstrekken van alcoholhoudende drank door het in dergelijke hotelkamers beschikbaar te stellen.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel12
  - number: '12.2'
    text: |-
      Het is verboden sterke drank te verstrekken voor gebruik elders dan ter plaatse anders dan in een slijtlokaliteit
      die in de vergunning is vermeld.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel12
  - number: '13.1'
    text: |-
      Het is verboden in een horecalokaliteit of op een terras alcoholhoudende drank te verstrekken voor gebruik elders
      dan ter plaatse.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel13
  - number: '13.2'
    text: |-
      Het is verboden in een slijtlokaliteit alcoholhoudende drank te verstrekken voor gebruik ter plaatse, tenzij het
      betreft verstrekking om niet door een persoon die in die slijtlokaliteit dienst pleegt te doen en die verstrekking
      tot doel heeft een klant die daarom verzoekt een alcoholhoudende drank die in dat slijtersbedrijf verkrijgbaar is
      te laten proeven.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel13
  - number: '14.1'
    text: |-
      Het is verboden een slijtlokaliteit gelijktijdig in gebruik te hebben voor het verrichten van andere
      bedrijfsactiviteiten dan die welke tot het slijtersbedrijf behoren dan wel toe te laten dat daarin zodanige
      activiteiten worden uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel14
  - number: '14.2'
    text: |-
      Het is verboden een horecalokaliteit of een terras tevens in gebruik te hebben voor het uitoefenen van de
      kleinhandel of zelfbedieningsgroothandel of het uitoefenen van een van de in het derde lid genoemde activiteiten,
      dan wel toe te laten dat daarin zodanige handel wordt of zodanige activiteiten worden uitgeoefend, tenzij het
      betreft:
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel14
  - number: 14.2.a
    text: de verkoop van etenswaren die voor consumptie gereed zijn; of
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel14
  - number: 14.2.b
    text: oorpluggen, -dopjes of -stopjes die in de gehoorgang kunnen worden geplaatst ter bescherming van het gehoor.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel14
  - number: '14.3'
    text: 'De in het tweede lid bedoelde activiteiten zijn:'
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel14
  - number: 14.3.a
    text: |-
      het bedrijfsmatig aan particulieren verkopen van goederen in het kader van een openbare verkoping, als bedoeld in
      [artikel 1 van de Wet ambtelijk toezicht bij openbare verkopingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002798#Artikel1
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002798
        artikel: '1'
  - number: 14.3.b
    text: het bedrijfsmatig aanbieden van diensten, uitgezonderd diensten van recreatieve en culturele aard;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel14
  - number: 14.3.c
    text: het bedrijfsmatig verhuren van goederen;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel14
  - number: 14.3.d
    text: het in het openbaar bedrijfsmatig opkopen van goederen.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel14
  - number: '14.4'
    text: |-
      Onder diensten van recreatieve aard als bedoeld in het derde lid, onder b, wordt niet verstaan
      het aanbieden van kansspelen, met uitzondering van dit aanbod in inrichtingen als bedoeld in
      [artikel 27g, tweede lid, van de Wet op de kansspelen][ref1] en het aanwezig hebben van speelautomaten als bedoeld
      in [Titel Va van de Wet op de kansspelen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel27g
      [ref2]: https://wetten.overheid.nl/BWBR0002469
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 27g
      - id: ref2
        bwb_id: BWBR0002469
  - number: 14a
    text: |-
      Het is verboden om bij het aanbieden en verstrekken van sterke drank in het kader van verkoop op afstand in de
      rechtmatige uitoefening van het slijtersbedrijf, gelijktijdig andere bedrijfsactiviteiten dan die welke tot het
      slijtersbedrijf behoren uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel14a
  - number: '15.1'
    text: |-
      Het is verboden de kleinhandel of de zelfbedieningsgroothandel of een in [artikel 14, derde lid][ref1], genoemde
      activiteit, uit te oefenen in een lokaliteit behorende tot een inrichting waarin het horecabedrijf wordt
      uitgeoefend, indien het publiek uitsluitend toegang heeft tot die lokaliteit door een lokaliteit te betreden waar
      alcoholhoudende drank aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel14
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '14'
        paragraaf: '3'
  - number: '15.2'
    text: |-
      Het in het eerste lid bedoelde verbod op de uitoefening van de kleinhandel is niet van toepassing op de kleinhandel
      in:
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel15
  - number: 15.2.a
    text: condooms en damesverband;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel15
  - number: 15.2.b
    text: oorpluggen, -dopjes of -stopjes die in de gehoorgang kunnen worden geplaatst ter bescherming van het gehoor.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel15
  - number: '16'
    text: |-
      Het is degene, die bedrijfsmatig of anders dan om niet alcoholhoudende drank verstrekt, verboden daartoe automaten,
      waaruit de afnemers zelfstandig zodanige drank kunnen betrekken aanwezig te hebben, tenzij deze zich bevinden
      in hotelkamers, ingericht voor nachtverblijf, welke deel uitmaken van een inrichting waarin het horecabedrijf
      rechtmatig wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel16
  - number: '17'
    text: |-
      Het is verboden bedrijfsmatig of anders dan om niet alcoholhoudende drank voor gebruik elders dan ter plaatse
      aan particulieren te verstrekken of af te leveren anders dan in een gesloten verpakking, die niet zonder kenbare
      beschadiging kan worden geopend.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel17
  - number: '18.1'
    text: |-
      Het is verboden in de uitoefening van een ander bedrijf dan het slijtersbedrijf zwak-alcoholhoudende drank voor
      gebruik elders dan ter plaatse aan particulieren te verstrekken.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel18
  - number: '18.2'
    text: 'Het in het eerste lid vervatte verbod geldt niet ten aanzien van het verstrekken in:'
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel18
  - number: 18.2.a
    text: |-
      een winkel waarin in overwegende mate levensmiddelen of tabak en aanverwante artikelen of uitsluitend zwak-
      alcoholhoudende dranken al dan niet tezamen met alcoholvrije dranken worden verkocht;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel18
  - number: 18.2.b
    text: |-
      een warenhuis met een levensmiddelenafdeling met een vloeroppervlakte van ten minste 15 m² waarop een gevarieerd
      assortiment aan verpakte en onverpakte eetwaren wordt verkocht;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel18
  - number: 18.2.c
    text: |-
      een voor het publiek toegankelijke besloten ruimte waarin hoofdzakelijk gerede eetwaren voor gebruik ter plaatse en
      elders dan ter plaatse plegen te worden verkocht, niet zijnde een horecalokaliteit.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel18
  - number: '18.3'
    text: |-
      Zwak-alcoholhoudende dranken zijn in de gevallen bedoeld in het tweede lid, zodanig in de besloten ruimte
      geplaatst, dat deze dranken voor het publiek duidelijk te onderscheiden zijn van alcoholvrije dranken. Alcoholvrije
      alternatieven voor bier en wijn behoeven niet te worden onderscheiden van zwak-alcoholhoudende dranken.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel18
  - number: '19.1'
    text: |-
      Het is verboden, anders dan in de rechtmatige uitoefening van verkoop op afstand door een slijtersbedrijf of in de
      uitoefening van het partijen-cateringbedrijf gelegenheid te bieden tot het doen van bestellingen voor sterke drank
      en sterke drank op bestelling af te leveren of te doen afleveren aan huizen van particulieren.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel19
  - number: '19.2'
    text: |-
      Het is verboden gelegenheid te bieden tot het doen van bestellingen voor zwak-alcoholhoudende drank en zwak-
      alcoholhoudende drank op bestelling af te leveren of te doen afleveren aan huizen van particulieren:
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel19
  - number: 19.2.a
    text: 'anders dan in het kader van de rechtmatige uitoefening van verkoop op afstand vanuit:'
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel19
  - number: 19.2.a.1
    text: |-
      een niet voor publiek toegankelijke besloten ruimte, waarin overeenkomstige bestellingen plegen te worden aanvaard,
      niet zijnde een horecalokaliteit;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel19
  - number: 19.2.a.2
    text: |-
      een ruimte als bedoeld in [artikel 18, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel18
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '18'
        paragraaf: '3'
  - number: 19.2.a.3
    text: een inrichting waarin het slijtersbedrijf wordt uitgeoefend;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel19
  - number: 19.2.b
    text: |-
      anders dan in de uitoefening van het partijen-cateringbedrijf vanuit een niet voor publiek toegankelijke besloten
      ruimte waar vanuit het partijen-cateringbedrijf wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel19
  - number: '20.1'
    text: |-
      Het is verboden bedrijfsmatig of anders dan om niet alcoholhoudende drank te verstrekken aan een persoon van wie
      niet is vastgesteld dat deze de leeftijd van 18 jaar heeft bereikt. Onder verstrekken als bedoeld in de eerste
      volzin wordt eveneens begrepen het verstrekken van alcoholhoudende drank aan een persoon van wie is vastgesteld dat
      deze de leeftijd van 18 jaar heeft bereikt, welke drank echter kennelijk bestemd is voor een persoon van wie niet
      is vastgesteld dat deze de leeftijd van 18 jaar heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel20
  - number: '20.2'
    text: 'De vaststelling, bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel20
  - number: 20.2.a
    text: |-
      geschiedt aan de hand van een document als bedoeld in
      [artikel 1, eerste lid, van de Wet op de identificatieplicht][ref1], dan wel op een bij of krachtens algemene
      maatregel van bestuur aangewezen andere wijze;


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 20.2.b
    text: blijft achterwege, indien het een persoon betreft die onmiskenbaar de vereiste leeftijd heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel20
  - number: '20.3'
    text: |-
      Bij de voor het publiek bestemde toegang tot een horecalokaliteit, een slijtlokaliteit, een ruimte als bedoeld in
      [artikel 18, tweede lid][ref1], of een vervoermiddel waarin bedrijfsmatig of anders dan om niet alcoholhoudende
      drank wordt verstrekt, dient duidelijk zichtbaar en goed leesbaar te worden aangegeven welke leeftijdsgrens of
      leeftijdsgrenzen gelden. Bij regeling van Onze Minister kunnen daaromtrent nadere regels worden gesteld of modellen
      worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel18
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '18'
        paragraaf: '3'
  - number: '20.4'
    text: |-
      Het is verboden in een slijtlokaliteit of horecalokaliteit of op een terras de aanwezigheid toe te laten van
      een persoon die in kennelijke staat van dronkenschap of kennelijk onder invloed van andere psychotrope stoffen
      verkeert.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel20
  - number: '20.5'
    text: |-
      Het is verboden in kennelijke staat van dronkenschap of kennelijk onder invloed van andere psychotrope stoffen
      dienst te doen in een slijtlokaliteit of horecalokaliteit.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel20
  - number: 20a.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden eisen gesteld aan verkoop op afstand van alcoholhoudende
      drank. Deze eisen hebben in elk geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel20a
  - number: 20a.1.a
    text: het hanteren van een leeftijdsverificatiesysteem op het moment van aankoop;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel20a
  - number: 20a.1.b
    text: |-
      het beschikken over en hanteren van een werkwijze waarmee wordt gewaarborgd dat de alcoholhoudende drank slechts
      wordt afgeleverd op het adres van de geadresseerde of bij een distributiepunt en dat de leeftijd van de persoon aan
      wie de alcoholhoudende drank wordt afgeleverd, wordt vastgesteld overeenkomstig [artikel 20, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel20
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '20'
        paragraaf: '3'
  - number: 20a.2
    text: |-
      Bij algemene maatregel van bestuur kan het ketenpartijen worden verboden om te handelen in strijd met de
      geborgde werkwijze van de verkoper van alcoholhoudende drank waarvoor zij in het kader van verkoop op afstand
      alcoholhoudende drank vervoeren en afleveren.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel20a
  - number: 20a.3
    text: |-
      Het is verboden alcoholhoudende drank te koop aan te bieden of te verstrekken in het kader van verkoop op afstand
      indien niet is voldaan aan het bepaalde krachtens het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel20a
  - number: 20a.4
    text: |-
      Het is verboden om in het kader van verkoop op afstand van alcoholhoudende drank een verkoopovereenkomst te sluiten
      met een persoon van wie door middel van het leeftijdsverificatiesysteem als bedoeld in het eerste lid, onderdeel a,
      is vastgesteld dat deze de leeftijd van 18 jaar nog niet heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel20a
  - number: 20a.5
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel20a
  - number: 20a.6
    text: |-
      De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel20a
  - number: '21'
    text: |-
      Het is verboden bedrijfsmatig of anders dan om niet alcoholhoudende drank te verstrekken, indien redelijkerwijs
      moet worden vermoed, dat dit tot verstoring van de openbare orde, veiligheid of zedelijkheid zal leiden.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel21
  - number: '22.1'
    text: 'Het is verboden bedrijfsmatig of anders dan om niet alcoholhoudende drank te verstrekken:'
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel22
  - number: 22.1.a
    text: |-
      op plaatsen waar brandstof voor middelen van vervoer aan particulieren wordt verstrekt en in winkels die aan een
      benzinestation zijn verbonden;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel22
  - number: 22.1.b
    text: |-
      in winkels die verbonden zijn aan een inrichting waarin het horecabedrijf wordt uitgeoefend gelegen langs een
      krachtens de [Wegenverkeerswet 1994](onbekend) als autoweg aangeduide weg;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel22
  - number: 22.1.c
    text: |-
      in ruimten gelegen langs een krachtens de [Wegenverkeerswet 1994](onbekend) als autosnelweg aangeduide weg, tenzij
      het betreft het verstrekken van alcoholhoudende drank voor gebruik ter plaatse in een horecalokaliteit of op een
      in de onmiddellijke nabijheid van een horecalokaliteit gelegen terras, en in die inrichting hoofdzakelijk warme
      maaltijden voor directe consumptie ter plaatse worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel22
  - number: '22.2'
    text: |-
      Bij algemene maatregel van bestuur kan het bedrijfsmatig of anders dan om niet verstrekken van alcoholhoudende
      drank worden verboden:
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel22
  - number: 22.2.a
    text: |-
      in stadions of bij die maatregel aangewezen delen daarvan, in gebruik bij organisaties van betaald voetbal,
      gedurende de tijd dat zij in verband met wedstrijden van betaald voetbal voor het publiek geopend zijn;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel22
  - number: 22.2.b
    text: |-
      in gebouwen of in die maatregel aangewezen delen daarvan, die in gebruik zijn bij instellingen op het terrein van
      de gezondheidszorg en het onderwijs en in zwembaden.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel22
  - number: '22.3'
    text: |-
      Een krachtens het tweede lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan acht
      weken na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel22
  - number: '24.1'
    text: |-
      Het is verboden een horecalokaliteit of een slijtlokaliteit voor het publiek geopend te houden indien in de
      inrichting niet aanwezig is:
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel24
  - number: 24.1.a
    text: |-
      een leidinggevende of een persoon aangewezen krachtens [artikel 30b][ref1] die vermeld staat op het aanhangsel
      bij de vergunning, bedoeld in [artikel 29, tweede lid][ref2], met betrekking tot die inrichting of een andere
      vergunning van dezelfde vergunninghouder of


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel30b
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel29
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: 30b
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002458
        artikel: '29'
        paragraaf: '4'
  - number: 24.1.b
    text: |-
      een persoon wiens bijschrijving op grond van [artikel 30a, eerste lid][ref1], is gevraagd, mits de ontvangst van
      die aanvraag is bevestigd, zolang nog niet op die aanvraag is beslist of


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel30a
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: 30a
        paragraaf: '4'
  - number: 24.1.c
    text: |-
      een onmiddellijk leidinggevende als bedoeld in [artikel 8, zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel8
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '8'
        paragraaf: '2'
  - number: '24.2'
    text: |-
      In afwijking van het eerste lid is het een paracommerciële rechtspersoon verboden een horecalokaliteit, gedurende
      de tijd dat daar alcoholhoudende drank wordt verstrekt, geopend te houden, indien in de inrichting niet aanwezig
      is:
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel24
  - number: 24.2.a
    text: |-
      een leidinggevende die vermeld staat op het aanhangsel bij de vergunning, bedoeld in
      [artikel 29, tweede lid][ref1], met betrekking tot die inrichting of een andere vergunning van dezelfde
      vergunninghouder of


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel29
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '29'
        paragraaf: '4'
  - number: 24.2.b
    text: |-
      een persoon wiens bijschrijving op grond van [artikel 30a, eerste lid][ref1], is gevraagd, mits de ontvangst van
      die aanvraag is bevestigd, zolang nog niet op die aanvraag is beslist of


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel30a
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: 30a
        paragraaf: '4'
  - number: 24.2.c
    text: |-
      een barvrijwilliger die een voorlichtingsinstructie als bedoeld in [artikel 9, tweede lid][ref1], heeft gekregen.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel9
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '9'
        paragraaf: '2'
  - number: '24.3'
    text: |-
      Het is verboden in een slijtlokaliteit of horecalokaliteit, gedurende de tijd dat daarin dranken worden verstrekt,
      personen jonger dan 16 jaar dienst te laten doen.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel24
  - number: '24.4'
    text: |-
      Indien dit voor de naleving van [artikel 20, eerste en tweede lid][ref1], noodzakelijk is, kan bij algemene
      maatregel van bestuur de leeftijd, genoemd in het derde lid, op 18 jaar worden gesteld, met dien verstande dat
      zulks alsdan niet geldt voor personen die alcoholhoudende drank verstrekken in het kader van een in de maatregel
      aan te geven beroepsopleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel20
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '20'
        paragraaf: '3'
  - number: '24.5'
    text: |-
      Het derde lid en, indien van toepassing de algemene maatregel van bestuur krachtens het vierde lid, zijn niet van
      toepassing op personen die de in die leden genoemde leeftijd nog niet hebben bereikt en die alcoholhoudende drank
      verstrekken in het kader van onderwijs als bedoeld in:
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel24
  - number: 24.5.a
    text: |-
      [artikel 2.26, tweede lid, onderdelen f, h, i en j, van de Wet voortgezet onderwijs 2020][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 24.5.b
    text: |-
      [artikel 2.27, tweede lid, onderdelen f, h, i en j, van de Wet voortgezet onderwijs 2020][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel24
    references:
