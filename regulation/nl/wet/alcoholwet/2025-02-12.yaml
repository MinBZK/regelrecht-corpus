        artikel: '19'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002458
        artikel: 20a
        paragraaf: '3'
  - number: '44.3'
    text: De ontzegging bedoeld in de voorgaande leden wordt opgelegd voor ten minste een week en ten hoogste 12 weken.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel44
  - number: '44.4'
    text: |-
      De burgemeester en Onze Minister zijn bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van een
      krachtens dit artikel opgelegde ontzegging.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel44
  - number: 44a.1
    text: |-
      De burgemeester kan een bestuurlijke boete opleggen ter zake van overtreding binnen zijn gemeente
      van het bij of krachtens de [artikelen 3][ref1], [4][ref2], [9, derde, vierde en vijfde lid][ref3],
      [12 tot en met 19][ref4], [20, eerste tot en met derde lid][ref5], [22, eerste en tweede lid][ref6],
      [24][ref7], [25, behoudens het derde lid][ref8], [25a, eerste en tweede lid][ref9], [25b tot en met 25e][ref10],
      [25f, tweede lid, onder a en c][ref11], [29, derde lid][ref12], [35, tweede en vierde lid][ref13], of [38][ref14]
      gestelde.


