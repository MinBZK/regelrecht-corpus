preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Drankwet (Stb. 1931, 476) en de voor de
    horecabedrijven en het slijtersbedrijf geldende vestigingsregelingen te vervangen door een nieuwe wet, welke ten
    aanzien van het verstrekken van alcoholhoudende drank zowel uit sociaal-hygiënisch als uit sociaal-economisch
    oogpunt regelen stelt;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder: – Onze Minister: Onze
      Minister van Volksgezondheid, Welzijn en Sport; – horecabedrijf: de activiteit in ieder geval bestaande uit
      het bedrijfsmatig of anders dan om niet verstrekken van alcoholhoudende drank voor gebruik ter plaatse; –
      slijtersbedrijf: de activiteit bestaande uit het bedrijfsmatig of anders dan om niet aan particulieren verstrekken
      van sterke drank voor gebruik elders dan ter plaatse, al dan niet gepaard gaande met het bedrijfsmatig of anders
      dan om niet aan particulieren verstrekken van zwak-alcoholhoudende en alcoholvrije drank voor gebruik elders
      dan ter plaatse of met het bedrijfsmatig verrichten van bij algemene maatregel van bestuur aangewezen andere
      handelingen; – lokaliteit: een besloten ruimte, onderdeel uitmakend van een inrichting; – horecalokaliteit: een
      van een afsluitbare toegang voorziene lokaliteit, onderdeel uitmakend van een inrichting waarin het horecabedrijf
      wordt uitgeoefend, in ieder geval bestemd voor het verstrekken van alcoholhoudende drank voor gebruik ter
      plaatse; – slijtlokaliteit: een van een afsluitbare toegang voorziene lokaliteit, onderdeel uitmakend van
      of samenvallend met een inrichting waarin het slijtersbedrijf wordt uitgeoefend, in ieder geval bestemd voor
      het verstrekken van sterke drank voor gebruik elders dan ter plaatse; – inrichting: de lokaliteiten waarin
      het slijtersbedrijf of het horecabedrijf wordt uitgeoefend, met de daarbij behorende terrassen voor zover die
      terrassen in ieder geval bestemd zijn voor het verstrekken van alcoholhoudende drank voor gebruik ter plaatse,
      welke lokaliteiten al dan niet onderdeel uitmaken van een andere besloten ruimte; – leidinggevende: 1°. de
      natuurlijke persoon of de bestuurders van een rechtspersoon of hun gevolmachtigden, voor wiens rekening en
      risico het horecabedrijf of het slijtersbedrijf wordt uitgeoefend; 2°. de natuurlijke persoon, die algemene
      leiding geeft aan een onderneming, waarin het horecabedrijf of het slijtersbedrijf wordt uitgeoefend in een of
      meer inrichtingen; – wijn: de categorieën alcoholhoudende dranken als opgesomd in Bijlage IV van Verordening
      (EG) 479/2008; – sterke drank: de drank, die bij een temperatuur van twintig graden Celsius voor vijftien of
      meer volumenprocenten uit alcohol bestaat, met uitzondering van wijn; – alcoholhoudende drank: de drank die bij
      een temperatuur van twintig graden Celsius voor meer dan een half volumeprocent uit alcohol bestaat; – zwak-
      alcoholhoudende drank: alcoholhoudende drank, met uitzondering van sterke drank; – paracommerciële rechtspersoon:
      een rechtspersoon niet zijnde een naamloze vennootschap of besloten vennootschap met beperkte aansprakelijkheid,
      die zich naast activiteiten van recreatieve, sportieve, sociaal-culturele, educatieve, levensbeschouwelijke
      of godsdienstige aard richt op de exploitatie in eigen beheer van een horecabedrijf; – barvrijwilliger: de
      natuurlijke persoon die, niet in dienstverband, alcoholhoudende drank verstrekt in een horecalokaliteit in beheer
      bij een paracommerciële rechtspersoon; – bezoeker: een ieder die zich in een inrichting bevindt, met uitzondering
      van: 1°. leidinggevenden; 2°. personen die dienst doen in de inrichting; 3°. personen wier aanwezigheid in
      de inrichting wegens dringende redenen noodzakelijk is; – vergunninghouder: de natuurlijke persoon of de
      rechtspersoon aan wie de vergunning, bedoeld in [artikel 3][ref1], is verleend; – bijlage: bijlage bedoeld in
      [artikel 44b, eerste lid][ref2]; – partijen-cateringbedrijf: de activiteit bestaande uit het met dienstverlening
      gepaard gaande bedrijfsmatig verstrekken van gerechten en dranken voor gebruik bij besloten partijen op een door
      een opdrachtgever te bepalen plaats, die slechts incidenteel beschikbaar is voor dergelijke partijen; – verkoop
      op afstand: een verkoopovereenkomst: a. tussen degene die bedrijfsmatig of anders dan om niet alcoholhoudende
      drank verkoopt en een particulier; b. die zich beiden in Nederland bevinden; c. die wordt gesloten in het kader
      van een georganiseerd systeem voor verkoop op afstand zonder gelijktijdige persoonlijke aanwezigheid van degene
      die bedrijfsmatig of anders dan om niet alcoholhoudende drank verkoopt en de particulier tot en met het moment van
      het sluiten van de verkoopovereenkomst; d. waarbij tot en met het moment van sluiten van de verkoopovereenkomst
      uitsluitend gebruik wordt gemaakt van een of meer middelen voor communicatie op afstand; en e. waarbij geen
      sprake is van de uitoefening van het partijen-cateringbedrijf; – neringruimte: ruimte binnen een gebouw welke
      ruimte in gebruik is voor een van de hierna te noemen activiteiten: 1°. het uitoefenen van de kleinhandel of
      de zelfbedieningsgroothandel; 2°. het bedrijfsmatig aan particulieren verkopen van goederen in het kader van
      een openbare verkoping, als bedoeld in artikel 1 van de Wet ambtelijk toezicht bij openbare verkopingen; 3°.
      het bedrijfsmatig aanbieden van diensten; 4°. het bedrijfsmatig verhuren van goederen; 5°. het in het openbaar
      bedrijfsmatig opkopen van goederen; – besloten ruimte: een ruimte die omsloten is door scheidingsconstructies; –
      ketenpartijen: de partijen, met uitzondering van de verkoper, die in het kader van verkoop op afstand bedrijfsmatig
      alcoholhoudende drank onder zich hebben en een bijdrage leveren aan de aflevering van die alcoholhoudende drank.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel44b
