  - number: 44a.2
    text: |-
      In afwijking van [artikel 44aa][ref1], eerste lid, onder b, kan de burgemeester een bestuurlijke boete opleggen ter
      zake van een overtreding van het bepaalde bij of krachtens de [artikelen 20, eerste tot en met derde lid][ref2],
      [24, derde lid][ref3], en [25g, eerste lid][ref4], gepleegd op een vervoermiddel binnen zijn gemeente
      indien vervoermiddelen van die aard zijn aangewezen bij gemeentelijke verordening vastgesteld krachtens
      [artikel 25g][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel44aa
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0002458#Artikel24
