        artikel: '1'
        paragraaf: '1'
  - number: 44aa.2
    text: |-
      [Artikel 44a, derde en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel44a
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel44aa
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: 44a
        paragraaf: '7'
  - number: 44aa.3
    text: De boete komt toe aan de staat.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel44aa
  - number: 44b.1
    text: |-
      Bij algemene maatregel van bestuur wordt een bijlage vastgesteld, die bij elke daarin omschreven overtreding het
      bedrag van de deswege op te leggen bestuurlijke boete bepaalt.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel44b
  - number: 44b.2
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel44b
  - number: 44b.3
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat bij ministeriële regeling elke twee jaar het bedrag
      van de op te leggen boete wordt gewijzigd aan de hand van een bij algemene maatregel van bestuur aan te wijzen
      prijsindex. Bij algemene maatregel van bestuur kunnen nadere regels ten aanzien van de indexering worden
      vastgesteld. Aan de eerste volzin wordt geen gevolg gegeven indien het in [artikel 44a, tweede lid][ref1], genoemde
      bedrag daarbij zou worden overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel44a
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel44b
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: 44a
        paragraaf: '7'
  - number: '45.1'
    text: |-
      Het is personen die de leeftijd van 18 jaar nog niet hebben bereikt, verboden op voor publiek toegankelijke
      plaatsen alcoholhoudende drank aanwezig te hebben of voor consumptie gereed te hebben, met uitzondering van
      plaatsen waar bedrijfsmatig of anders dan om niet alcoholhoudende drank voor gebruik elders dan ter plaatse wordt
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel45
  - number: '45.2'
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel45
  - number: 45.2.a
    text: |-
      personen van 16 of 17 jaar die dienst doen in een inrichting waarin het horecabedrijf wordt uitgeoefend, waaronder
      begrepen het zijn van barvrijwilliger in een inrichting in beheer bij een paracommerciële rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel45
  - number: 45.2.b
    text: |-
      personen van 16 of 17 jaar die handelen in opdracht van een toezichthouder als bedoeld in [artikel 41][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel41
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '41'
        paragraaf: '7'
  - number: 45.2.c
    text: |-
      personen als bedoeld in [artikel 24, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel24
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '24'
        paragraaf: '3'
  - number: '45.3'
    text: |-
      Overtreding van het eerste lid wordt gestraft met een geldboete van de eerste categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '45.4'
    text: De in dit artikel strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel45
  - number: 45a.1
    text: |-
      Onverminderd [artikel 20, eerste lid][ref1], is het personen die de leeftijd van 18 jaar hebben bereikt, verboden
      op voor publiek toegankelijke plaatsen anders dan bedrijfsmatig alcoholhoudende drank te verstrekken aan een
      persoon die de leeftijd van 18 jaar nog niet heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel20
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '20'
        paragraaf: '3'
  - number: 45a.2
    text: |-
      Overtreding van het eerste lid wordt gestraft met een geldboete van de eerste categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 45a.3
    text: De in dit artikel strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel45a
  - number: '46'
    text: |-
      Een wijziging van [Richtlijn 2005/36/EG](32005L0036) van het Europees Parlement en de Raad van 7 september 2005
      betreffende de erkenning van beroepskwalificaties (PbEU 2005, L 255) gaat voor de toepassing van deze wet gelden
      met ingang van de dag waarop aan de betrokken wijziging uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel46
  - number: '47.1'
    text: |-
      Het in [artikel 13][ref1] gestelde verbod geldt tot een door Ons te bepalen tijdstip niet voor degene, die op 30
      september 1967 feitelijk alcoholhoudende drank voor gebruik ter plaatse en sterke drank voor gebruik elders dan ter
      plaatse verstrekte in een lokaliteit, waarvoor een op grond van de Drankwet (Stb. 1931, 476) verleende volledige
      vergunning gold, voor zover het die lokaliteit betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel13
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '13'
        paragraaf: '3'
  - number: '47.2'
    text: |-
      Het in [artikel 13][ref1] gestelde verbod geldt tot een door Ons te bepalen tijdstip voorts niet voor degene,
      die in een lokaliteit, waarvoor een op grond van de Drankwet (Stb. 1931, 476) verleende vergunning of verleend
      verlof A gold, op 30 september 1967 feitelijk alcoholhoudende drank voor gebruik ter plaatse verstrekte en tevens
      bedrijfsmatig aan particulieren zwak-alcoholhoudende drank voor gebruik elders dan ter plaatse verstrekte, voor
      zover het betreft het gelijktijdig in gebruik hebben van die lokaliteit voor het bedrijfsmatig verstrekken van
      alcoholhoudende drank voor gebruik ter plaatse en voor het bedrijfsmatig aan particulieren verstrekken van zwak-
      alcoholhoudende drank voor gebruik elders dan ter plaatse.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel13
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '13'
        paragraaf: '3'
  - number: '48'
    text: |-
      [Artikel 47][ref1] is van overeenkomstige toepassing voor degene, die op 1 november 1967 feitelijk een
      horecabedrijf of slijtersbedrijf uitoefende:


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel47
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '47'
        paragraaf: '9'
  - number: 48.a
    text: |-
      met gebruikmaking van een op hem krachtens artikel 29, eerste lid, van de Drankwet (Stb. 1931, 476) overgeschreven
      vergunning of verlof A van een persoon, die dat bedrijf feitelijk uitoefende op 30 september 1967, of
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel48
  - number: 48.b
    text: |-
      als rechtverkrijgende van een persoon als onder a bedoeld diens bedrijf voortzettend krachtens de wet van 14 april
      1960 (Stb. 155).
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel48
  - number: 48a
    text: |-
      Op besluiten van Onze Minister die genomen zijn vòòr 1 januari 2013 blijft het recht zoals dat gold tot die datum
      van toepassing.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel48a
  - number: 48b.1
    text: |-
      Vergunningen en ontheffingen die zijn verleend op grond van de Drank- en Horecawet zoals deze luidde voor
      inwerkingtreding van dit artikel, berusten na inwerkingtreding van dit artikel op het van toepassing zijnde artikel
      van de Alcoholwet.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel48b
  - number: 48b.2
    text: |-
      Diploma’s die op het moment direct voorafgaand aan inwerkingtreding van dit artikel recht gaven op een SVH Diploma
      Sociale Hygiëne, worden erkend als bewijsstuk als bedoeld in [artikel 11d][ref1] gedurende de voor dat diploma
      afgesproken termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel11d
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel48b
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: 11d
        paragraaf: 2a
  - number: 48b.3
    text: |-
      Personen die waren ingeschreven in het register op grond van [artikel 8, vijfde lid][ref1], zoals dat luidde voor
      inwerkingtreding van dit artikel, worden na inwerkingtreding van dit artikel ingeschreven in het Register sociale
      hygiëne.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel8
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel48b
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '8'
        paragraaf: '2'
  - number: 48c.1
    text: |-
      Ten aanzien van degene die rechtmatig het horecabedrijf of slijtersbedrijf uitoefent in een inrichting waarvoor
      een op grond van de artikelen 40, 43 of 44 van de Drank- en Horecawet zoals deze luidde voor 26 mei 2000 verleende
      ontheffing geldt, blijft de ontheffing gelden. Voornoemde ontheffing geldt ook voor degene die de uitoefening
      van het bedrijf in die inrichting rechtsgeldig voortzet. Het in de eerste volzin bepaalde geldt niet als er een
      onderbreking van de bedrijfsuitoefening is geweest gedurende een periode van langer dan een jaar. Ten aanzien van
      ontheffingen verleend voor een bepaalde tijd vervallen de aan die ontheffing verbonden tijdsbeperkingen. Dit lid
      vervalt op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende volzinnen verschillend kan
      worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel48c
  - number: 48c.2
    text: |-
      [Artikel 9][ref1] geldt niet ten aanzien van inrichtingen zolang daarvoor een vergunning geldt die is verstrekt
      vóór 26 mei 2000.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel9
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel48c
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '9'
        paragraaf: '2'
  - number: 48c.3
    text: |-
      [Artikel 29][ref1] is niet van toepassing op de op 26 mei 2000 geldende vergunningen.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel29
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel48c
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '29'
        paragraaf: '4'
  - number: 48d.1
    text: |-
      De eisen gesteld bij of krachtens [artikel 8, derde lid][ref1], en [11d, tweede lid][ref2], ten aanzien van sociale
      hygiëne gelden niet ten aanzien van personen die op 1 januari 1996 als bedrijfsleider of beheerder stonden vermeld
      op een krachtens de Drank- en Horecawet geldende vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel11d
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel48d
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '8'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002458
        artikel: 11d
        paragraaf: 2a
  - number: 48d.2
    text: |-
      De eisen gesteld bij of krachtens [artikel 8, derde lid][ref1], en [11d, tweede lid][ref2], ten aanzien van
      sociale hygiëne gelden voorts niet ten aanzien van personen die op 1 januari 1996 voldeden aan de krachtens
      artikel 7 van de Drank- en Horecawet zoals die luidde voor 1 januari 1996, gestelde eisen van handelskennis of
      beschikten over een ontheffing van die eisen of van de eisen van vakbekwaamheid als bedoeld in artikel 42 van de
      Drank- en Horecawet zoals die luidde voor 1 januari 1996, en die binnen een jaar na dat tijdstip een aanvraag om
      een vergunning als bedoeld in artikel 3 van de Drank- en Horecawet zoals die luidde voor 1 januari 1996 hebben
      ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel11d
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel48d
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '8'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002458
        artikel: 11d
        paragraaf: 2a
  - number: 48e.1
    text: |-
      Indien de tot een inrichting behorende lokaliteiten die op 30 september 1967 in gebruik waren voor de verstrekking
      van alcoholhoudende drank in de uitoefening van het horecabedrijf of slijtersbedrijf, toen wel voldeden
      aan de ingevolge de Drankwet (Stb. 1931, 476) met betrekking tot hun afmetingen geldende eisen maar niet in
      overeenstemming zijn met de eisen, ter zake van de afmetingen van lokaliteiten voor die uitoefening gesteld
      krachtens [artikel 10][ref1] van de onderhavige wet, worden zij nochtans geacht aan de ingevolge dat artikel voor
      de uitoefening van dat bedrijf geldende afmetingseisen te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel10
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel48e
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '10'
        paragraaf: '2'
  - number: 48e.2
    text: 'Het eerste lid geldt niet:'
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel48e
  - number: 48e.2.a
    text: |-
      indien één of meer van de in dat lid bedoelde lokaliteiten van de inrichting inmiddels in enig opzicht zijn
      verkleind of een verandering in hun bestemming hebben ondergaan;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel48e
  - number: 48e.2.b
    text: |-
      indien de uitoefening van het betrokken bedrijf in de inrichting na 30 september 1967 gedurende een jaar anders dan
      wegens overmacht ononderbroken gestaakt is geweest.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel48e
  - number: 48e.3
    text: 'Het tweede lid, onder a, is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel48e
  - number: 48e.3.a
    text: |-
      met betrekking tot verkleiningen, strekkende tot aanpassing van de inrichting aan ingevolge [artikel 10][ref1]
      geldende, andere dan de in het eerste lid bedoelde eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel10
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel48e
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '10'
        paragraaf: '2'
  - number: 48e.3.b
    text: |-
      met betrekking tot wijzigingen ten aanzien waarvan Onze Minister, van oordeel zijnde dat daartegen uit het oogpunt
      van sociale hygiëne geen overwegende bezwaren bestaan, op aanvraag van de ondernemer die bepaling buiten toepassing
      heeft verklaard.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel48e
  - number: 48e.4
    text: |-
      In een met toepassing van het eerste lid verleende vergunning wordt mede vermeld op welke lokaliteiten die
      toepassing betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel48e
  - number: '49'
    text: 'Deze wet wordt aangehaald als: Alcoholwet.'
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel49
