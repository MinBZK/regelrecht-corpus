  - number: 24.5.e
    text: |-
      [artikel 2.103 van de Wet voortgezet onderwijs 2020][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel24
    references:
