  - number: '1.2'
    text: Onder een inrichting wordt niet verstaan een vervoermiddel voor het rondtrekkend uitoefenen van een bedrijf.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel1
  - number: '1.3'
    text: |-
      Deze wet is, met uitzondering van de [artikelen 20][ref1], [21][ref2], [24, derde lid][ref3], [45][ref4] en
      [45a][ref5] niet van toepassing op:


