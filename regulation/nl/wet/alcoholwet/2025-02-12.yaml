      [artikel 2.107a van de Wet voortgezet onderwijs 2020][ref1], in samenhang
      met de [artikelen 2.26, tweede lid, onderdelen, f, h, i, en j][ref2], en
      [2.27, tweede lid, onderdelen f, h, i, en j, van die wet][ref3];


