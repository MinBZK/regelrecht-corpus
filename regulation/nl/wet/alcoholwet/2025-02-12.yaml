  - number: 44a.3
    text: |-
      De hoogte van de bestuurlijke boete wordt bepaald op de wijze als voorzien in de bijlage, met dien verstande dat de
      wegens een afzonderlijke overtreding te betalen geldsom ten hoogste € 100 000 bedraagt.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel44a
  - number: 44a.4
    text: 'Overtredingen kunnen, in afwijking van het eerste lid, niet met een bestuurlijke boete worden afgedaan, indien:'
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel44a
  - number: 44a.4.a
    text: de overtreding een direct gevaar voor de gezondheid of veiligheid van de mens tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel44a
  - number: 44a.4.b
    text: |-
      de in de bijlage ter zake van de overtreding voorziene bestuurlijke boete aanmerkelijk wordt overschreden door het
      met de overtreding behaalde economisch voordeel; of
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel44a
  - number: 44a.4.c
    text: |-
      door de burgemeester toepassing is gegeven aan [artikel 44, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel44
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '44'
        paragraaf: '7'
  - number: 44a.5
    text: |-
      De bevoegdheid tot het opleggen van een bestuurlijke boete vervalt, indien ter zake van de overtreding op grond
      waarvan de bestuurlijke boete kan worden opgelegd door de burgemeester aan de vergunninghouder schriftelijk
      mededeling is gedaan van het voornemen de vergunning in te trekken.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel44a
  - number: 44a.6
    text: De boete komt toe aan de gemeente, waar de overtreding heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel44a
  - number: 44aa.1
    text: 'Onze Minister kan een bestuurlijke boete opleggen ter zake van overtreding van het gestelde bij of krachtens:'
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel44aa
  - number: 44aa.1.a
    text: |-
      de [artikelen 2][ref1], [2a][ref2], [14a][ref3], [20a, tweede tot en met vierde lid][ref4], en
      [25, derde lid][ref5], waar ook te lande gepleegd;


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel2a
      [ref3]: https://wetten.overheid.nl/BWBR0002458#Artikel14a
      [ref4]: https://wetten.overheid.nl/BWBR0002458#Artikel20a
      [ref5]: https://wetten.overheid.nl/BWBR0002458#Artikel25
    url: https://wetten.overheid.nl/BWBR0002458/2025-02-12#Artikel44aa
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '2'
        paragraaf: '2'
      - id: ref2
