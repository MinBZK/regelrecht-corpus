  - number: 44b
    text: |-
      1 Bij algemene maatregel van bestuur wordt een bijlage vastgesteld, die bij elke daarin omschreven overtreding het
      bedrag van de deswege op te leggen boete bepaalt.

      2 De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.

      3 Een algemene maatregel van bestuur als bedoeld in het eerste lid wordt vastgesteld op voordracht van Onze
      Minister, in overeenstemming met Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0002458/2005-09-14#Artikel44b
  - number: 44c
    text: |-
      Degene jegens wie een handeling is verricht waaraan hij in redelijkheid de gevolgtrekking kan verbinden dat hem
      wegens een overtreding een boete zal worden opgelegd, is niet verplicht ter zake daarvan enige verklaring af te
      leggen. Hij wordt hiervan in kennis gesteld alvorens hem mondeling om informatie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0002458/2005-09-14#Artikel44c
  - number: 44d
    text: |-
      1 Indien Onze Minister voornemens is een boete op te leggen, geeft hij de persoon bedoeld in
      [artikel 44a, eerste lid][ref1], daarvan kennis onder vermelding van de gronden waarop het voornemen berust.

      2 Onze Minister stelt de persoon in de gelegenheid om binnen een redelijke termijn naar keuze schriftelijk of
      mondeling zijn zienswijze naar voren te brengen voordat de boete wordt opgelegd.

      3 Indien de persoon zijn zienswijze mondeling naar voren wil brengen en de Nederlandse taal onvoldoende begrijpt,
      draagt Onze Minister op zijn verzoek zorg voor benoeming van een tolk die hem kan bijstaan, tenzij redelijkerwijs
      kan worden aangenomen dat daaraan geen behoefte bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel44a
    url: https://wetten.overheid.nl/BWBR0002458/2005-09-14#Artikel44d
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: 44a
        paragraaf: 7a
  - number: 44e
    text: |-
      1 Indien een krachtens [artikel 41][ref1] aangewezen ambtenaar vaststelt dat een in de bijlage omschreven
      overtreding is begaan, maakt hij daarvan een rapport op.

      2 Het rapport vermeldt in ieder geval:

      a. de overtreding, onder verwijzing naar het desbetreffende wettelijke voorschrift en de omschrijving in de
      bijlage;

      b. een aanduiding van de plaats waar en het tijdstip waarop de overtreding is begaan;

      c. de feiten en omstandigheden op grond waarvan is vastgesteld dat een overtreding is begaan;

      d. de verklaring van degene bedoeld in [artikel 44c][ref2], indien afgelegd.

      3 Het rapport wordt toegezonden aan Onze Minister.

      4 Een afschrift van het rapport wordt toegezonden of uitgereikt aan de in [artikel 44a, eerste lid][ref3], bedoelde
      natuurlijke persoon of rechtspersoon.

      5 Op verzoek van de persoon, bedoeld in [artikel 44a, eerste lid][ref4], die het rapport wegens zijn gebrekkige
      kennis van de Nederlandse taal onvoldoende begrijpt, draagt Onze Minister er zoveel mogelijk zorg voor dat de
      inhoud van het rapport aan die persoon wordt medegedeeld in een voor hem begrijpelijke taal.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel44c
      [ref3]: https://wetten.overheid.nl/BWBR0002458#Artikel44a
      [ref4]: https://wetten.overheid.nl/BWBR0002458#Artikel44a
    url: https://wetten.overheid.nl/BWBR0002458/2005-09-14#Artikel44e
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '41'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0002458
        artikel: 44c
        paragraaf: 7a
      - id: ref3
        bwb_id: BWBR0002458
        artikel: 44a
        paragraaf: 7a
      - id: ref4
        bwb_id: BWBR0002458
        artikel: 44a
        paragraaf: 7a
  - number: 44f
    text: |-
      1 Onze Minister legt de boete op bij beschikking.

      2 De beschikking vermeldt in ieder geval:

      a. de hoogte van de boete en de termijn waarbinnen ze moet worden betaald;

      b. de overtreding ter zake waarvan zij is gegeven, onder verwijzing naar het desbetreffende wettelijke voorschrift
      en de omschrijving in de bijlage;

      c. de in [artikel 44e, tweede lid, onderdelen b en c][ref1], bedoelde gegevens.

      3 Op verzoek van de persoon, bedoeld in [artikel 44a, eerste lid][ref2], die de beschikking wegens zijn gebrekkige
      kennis van de Nederlandse taal onvoldoende begrijpt, draagt Onze Minister er zoveel mogelijk zorg voor dat de
      inhoud van de beschikking aan die persoon wordt medegedeeld in een voor hem begrijpelijke taal.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel44e
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel44a
    url: https://wetten.overheid.nl/BWBR0002458/2005-09-14#Artikel44f
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: 44e
        paragraaf: 7a
      - id: ref2
        bwb_id: BWBR0002458
        artikel: 44a
        paragraaf: 7a
  - number: 44g
    text: |-
      De werking van een beschikking als bedoeld in [artikel 44f][ref1] wordt opgeschort totdat de beroepstermijn is
      verstreken of, indien beroep is ingesteld, op het beroep is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel44f
    url: https://wetten.overheid.nl/BWBR0002458/2005-09-14#Artikel44g
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: 44f
        paragraaf: 7a
  - number: 44h
    text: |-
      1 De bevoegdheid een boete op te leggen vervalt na verloop van twee jaren na de dag waarop de overtreding is
      begaan.

      2 Een beschikking tot oplegging van een boete stuit de in het eerste lid genoemde termijn.
    url: https://wetten.overheid.nl/BWBR0002458/2005-09-14#Artikel44h
  - number: 44i
    text: |-
      1 Een boete wordt betaald binnen zes weken na inwerkingtreding van de beschikking waarbij de boete is opgelegd.

      2 De boete wordt vermeerderd met de wettelijke rente, te rekenen vanaf de dag waarop sedert de bekendmaking van de
      beschikking zes weken zijn verstreken.

      3 Indien niet is betaald binnen de in het eerste lid genoemde termijn, wordt degene aan wie de boete is opgelegd
      schriftelijk bevolen binnen twee weken alsnog het bedrag van de boete, verhoogd met de kosten van de aanmaning,
      te betalen.

      4 Bij gebreke van betaling binnen de in het derde lid genoemde termijn kan Onze Minister de verschuldigde boete,
      verhoogd met de op de aanmaning en invordering betrekking hebbende kosten, bij dwangbevel invorderen.

      5 Het dwangbevel wordt op kosten van degene die de boete verschuldigd is, bij deurwaardersexploot betekend en levert
      een executoriale titel op in de zin van het [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1].

      6 Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van de
      Staat.

      7 Het verzet schorst de tenuitvoerlegging niet, tenzij de voorzieningenrechter van de rechtbank in kort geding
      desgevraagd anders beslist.

      8 Het verzet kan niet worden gegrond op de stelling dat de boete ten onrechte of voor een te hoog bedrag is
      vastgesteld.

      9 De bevoegdheid tot invordering vervalt twee jaar nadat de beschikking inzake oplegging van de boete
      onherroepelijk is geworden.

      10 De opbrengst van de boete en de wettelijke rente komt toe aan Onze Minister.


