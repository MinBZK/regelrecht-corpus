        bwb_id: BWBR0005537
        artikel: 5:20
  - number: 44a
    text: |-
      1 Ter zake van de in de bijlage omschreven overtredingen kan Onze Minister een boete opleggen aan de natuurlijke of
      rechtspersoon aan wie de overtreding kan worden toegerekend.

      2 De hoogte van de boete wordt bepaald op de wijze als voorzien in de bijlage, met dien verstande dat de wegens een
      afzonderlijke overtreding te betalen geldsom ten hoogste € 100 000 bedraagt.

      3 Overtredingen, met uitzondering van overtreding van [artikel 9, tweede lid][ref1], of
      [artikel 29, tweede lid][ref2], kunnen, in afwijking van het eerste lid, niet met een boete worden afgedaan,
      indien:

      a. de overtreding een direct gevaar voor de gezondheid of veiligheid van de mens tot gevolg heeft; of

      b. de in de bijlage ter zake van de overtreding voorziene boete aanmerkelijk wordt overschreden door het met de
      overtreding behaalde economisch voordeel.

      4 Onze Minister kan de boete lager stellen dan in de bijlage is bepaald, ingeval het bedrag van de boete op grond
      van bijzondere omstandigheden onevenredig hoog moet worden geacht.

      5 De werkzaamheden in verband met de uitvoering van het eerste lid worden verricht door personen die niet betrokken
      zijn geweest bij de opstelling van het in [artikel 44e][ref3] bedoelde rapport en het daaraan voorafgaande
      onderzoek.

      6 De bevoegdheid tot het opleggen van een boete vervalt, indien ter zake van de overtreding op grond waarvan de
      boete kan worden opgelegd:

      a. tegen de overtreder een strafvervolging is ingesteld en het onderzoek ter terechtzitting een aanvang
      heeft genomen, dan wel het recht tot strafvervolging is vervallen ingevolge [artikel 74][ref4] of
      [74c van het Wetboek van Strafrecht][ref5];

      b. door burgemeester en wethouders aan de vergunninghouder schriftelijk mededeling is gedaan van het voornemen de
      vergunning in te trekken, overeenkomstig [artikel 31, vierde lid][ref6].

      7 Het recht tot strafvervolging vervalt indien Onze Minister reeds een boete heeft opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0002458#Artikel44e
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel74
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel74c
      [ref6]: https://wetten.overheid.nl/BWBR0002458#Artikel31
    url: https://wetten.overheid.nl/BWBR0002458/2005-09-14#Artikel44a
