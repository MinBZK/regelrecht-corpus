      1 Een vergunning wordt verleend, indien geen der in [artikel 27][ref1] bedoelde weigeringsgronden aanwezig is.

      2 De beschikking tot verlening, wijziging of intrekking van de vergunning wordt mede aan de inspecteur toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel27
    url: https://wetten.overheid.nl/BWBR0002458/2005-09-14#Artikel28
