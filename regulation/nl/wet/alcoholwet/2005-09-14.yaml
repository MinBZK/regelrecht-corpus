  - number: '16'
    text: |-
      Het is degene, die bedrijfsmatig of anders dan om niet alcoholhoudende drank verstrekt, verboden daartoe automaten,
      waaruit de afnemers zelfstandig zodanige drank kunnen betrekken aanwezig te hebben, tenzij deze zich bevinden
      in hotelkamers, ingericht voor nachtverblijf, welke deel uitmaken van een inrichting waarin het horecabedrijf
      rechtmatig wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0002458/2005-09-14#Artikel16
  - number: '17'
    text: |-
      Het is verboden bedrijfsmatig of anders dan om niet alcoholhoudende drank voor gebruik elders dan ter plaatse
      aan particulieren te verstrekken of af te leveren anders dan in een gesloten verpakking, die niet zonder kenbare
      beschadiging kan worden geopend.
    url: https://wetten.overheid.nl/BWBR0002458/2005-09-14#Artikel17
  - number: '18'
    text: |-
      1 Het is verboden in de uitoefening van een ander bedrijf dan het slijtersbedrijf zwak-alcoholhoudende drank voor
      gebruik elders dan ter plaatse aan particulieren te verstrekken.

      2 Het in het eerste lid vervatte verbod geldt niet ten aanzien van het verstrekken in:

      a. een winkel waarin in overwegende mate levensmiddelen of tabak en aanverwante artikelen of uitsluitend zwak-
      alcoholhoudende dranken al dan niet tezamen met alcoholvrije dranken worden verkocht;

      b. een winkel waarin een gevarieerd assortiment aan levensmiddelen of tabak en aanverwante artikelen wordt
      verkocht;

      c. een voor het publiek toegankelijke besloten ruimte waarin hoofdzakelijk gerede eetwaren voor gebruik ter plaatse
      en elders dan ter plaatse plegen te worden verkocht, niet zijnde een horecalokaliteit.

      3 Zwak-alcoholhoudende dranken zijn in de gevallen bedoeld in het tweede lid, zodanig in de besloten ruimte
      geplaatst, dat deze dranken voor het publiek duidelijk te onderscheiden zijn van alcoholvrije dranken.
    url: https://wetten.overheid.nl/BWBR0002458/2005-09-14#Artikel18
  - number: '19'
    text: |-
      1 Het is verboden, anders dan in de rechtmatige uitoefening van het slijtersbedrijf of van het partijen-
      cateringbedrijf gelegenheid te bieden tot het doen van bestellingen voor sterke drank en sterke drank op bestelling
      af te leveren of te doen afleveren aan huizen van particulieren. Onder partijen-catering wordt verstaan het,
      gepaard gaande met dienstverlening, bedrijfsmatig verstrekken van gerechten en dranken voor gebruik bij besloten
      partijen op een door een opdrachtgever te bepalen plaats, die slechts incidenteel beschikbaar is voor dergelijke
      partijen.

      2 Het is verboden gelegenheid te bieden tot het doen van bestellingen voor zwak-alcoholhoudende drank en zwak-
      alcoholhoudende drank op bestelling af te leveren of te doen afleveren aan huizen van particulieren, anders dan
      vanuit:

      a. een niet voor publiek toegankelijke besloten ruimte, waarin overeenkomstige bestellingen plegen te worden
      aanvaard, niet zijnde een horecalokaliteit;

      b. een ruimte als bedoeld in [artikel 18, tweede lid][ref1];

      c. een inrichting waarin het slijtersbedrijf wordt uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel18
    url: https://wetten.overheid.nl/BWBR0002458/2005-09-14#Artikel19
