      1 Het is degene die, anders dan in de rechtmatige uitoefening van het slijtersbedrijf of horecabedrijf, een ruimte
      voor het publiek geopend houdt, verboden:

      a. in die ruimte alcoholhoudende drank aanwezig te hebben, tenzij dit geschiedt ten dienste van het rechtmatig
      in die ruimte bedrijfsmatig of anders dan om niet aan particulieren verstrekken van zwak-alcoholhoudende drank
      voor gebruik elders dan ter plaatse, mits deze drank zich bevindt in een verpakking die voldoet aan de bij
      [artikel 17][ref1] gestelde eis;

      b. in de voor het publiek niet toegankelijke delen van die ruimte alcoholhoudende drank in voorraad te hebben,
      tenzij het betreft:

      1°. het in voorraad hebben van zwak-alcoholhoudende drank ten dienste van het in de rechtmatige uitoefening van
      een ander bedrijf dan het slijtersbedrijf bedrijfsmatig aan particulieren verstrekken van deze drank voor gebruik
      elders dan ter plaatse, mits deze drank zich bevindt in een verpakking die voldoet aan de bij [artikel 17][ref2]
      gestelde eis;

      2°. het in voorraad hebben van alcoholhoudende drank ten dienste van het uitoefenen van een bedrijf, waarin waren
      uit onder meer alcoholhoudende drank plegen te worden vervaardigd.

      2 Het is degene die, anders dan in de rechtmatige uitoefening van het horecabedrijf, een ruimte voor publiek
      geopend houdt, verboden toe te laten dat in die ruimte alcoholhoudende drank wordt genuttigd.

      3 Het is degene die een vervoermiddel gebruikt voor het rondtrekkend uitoefenen van de kleinhandel verboden daarin,
      daarop of daaraan alcoholhoudende drank aanwezig te hebben, tenzij het betreft een vervoermiddel dat wordt gebruikt
      voor:

      a. het rechtmatig aan particulieren afleveren van alcoholhoudende drank op bestelling;

      b. het binnen het vervoermiddel verstrekken van zwak-alcoholhoudende drank in het kader van het rondtrekkend
      uitoefenen van de kleinhandel overwegend bestaand uit de handel in een gevarieerd assortiment levensmiddelen en
      kruideniersartikelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel17
