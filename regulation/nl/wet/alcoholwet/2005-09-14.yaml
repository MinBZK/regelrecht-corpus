  - number: '5'
    text: |-
      1 [Artikel 4][ref1] is niet van toepassing, indien de betrokken rechtspersoon gehouden is uitvoering te geven aan
      een regeling, betrekking hebbend op een of meer van de in [artikel 4, tweede lid][ref2], bedoelde onderwerpen,
      die door die rechtspersoon of een organisatie waarbij deze is aangesloten, schriftelijk is overeengekomen met het
      Bedrijfschap Horeca en Catering.

      2 Burgemeester en wethouders trekken aan een vergunning verbonden voorschriften en beperkingen als bedoeld in
      [artikel 4][ref3] op verzoek van de vergunninghouder in, indien voor deze een verplichting is ontstaan als bedoeld
      in het eerste lid.

      3 Ten aanzien van een reeds verleende vergunning is, indien een verplichting als bedoeld in het eerste lid eindigt,
      [artikel 4, eerste lid][ref4], van overeenkomstige toepassing.


