  - number: '27'
    text: |-
      1 Een vergunning wordt geweigerd indien:

      a. niet wordt voldaan aan de ingevolge de [artikelen 8 tot en met 10][ref1] geldende eisen;

      b. redelijkerwijs moet worden aangenomen, dat de feitelijke toestand niet met het in de aanvrage vermelde in
      overeenstemming zal zijn;

      c. [artikel 7, tweede lid][ref2], of [artikel 31, derde lid][ref3], zich tegen de verlening van de gevraagde
      vergunning verzet;

      d. redelijkerwijs moet worden aangenomen dat een of meer van de bij of krachtens de [artikelen 2][ref4] en
      [13 tot en met 24][ref5] gestelde verboden zal worden overtreden of dat in strijd zal worden gehandeld met aan de
      vergunning verbonden beperkingen of voorschriften.

      2 Een vergunning ten aanzien van een inrichting, waarvan de vergunning op grond van
      [artikel 31, eerste lid, onder d][ref6], is ingetrokken, kan gedurende een bij die intrekking vastgestelde termijn
      van ten hoogste vijf jaar worden geweigerd.

      3 Een vergunning kan worden geweigerd in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref7].

      4 Voordat toepassing wordt gegeven aan het derde lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref8], om een advies als
      bedoeld in [artikel 9 van die wet][ref9] worden gevraagd.


