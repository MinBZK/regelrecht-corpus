  - number: '48'
    text: |-
      [Artikel 47][ref1] is van overeenkomstige toepassing voor degene, die op 1 november 1967 feitelijk een
      horecabedrijf of slijtersbedrijf uitoefende:

      a. met gebruikmaking van een op hem krachtens artikel 29, eerste lid, van de Drankwet (Stb. 1931, 476)
      overgeschreven vergunning of verlof A van een persoon, die dat bedrijf feitelijk uitoefende op 30 september 1967,
      of

      b. als rechtverkrijgende van een persoon als onder a bedoeld diens bedrijf voortzettend krachtens de wet van 14
      april 1960 (Stb. 155).


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel47
