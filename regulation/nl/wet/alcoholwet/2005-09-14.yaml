        artikel: '18'
        paragraaf: '3'
  - number: '20'
    text: |-
      1 Het is verboden bedrijfsmatig of anders dan om niet alcoholhoudende drank te verstrekken aan een persoon van
      wie niet is vastgesteld dat deze de leeftijd van 16 jaar heeft bereikt. Onder verstrekken als bedoeld in de eerste
      volzin wordt eveneens begrepen het verstrekken van alcoholhoudende drank aan een persoon van wie is vastgesteld dat
      deze de leeftijd van 16 jaar heeft bereikt, welke drank echter kennelijk bestemd is voor een persoon van wie niet
      is vastgesteld dat deze de leeftijd van 16 jaar heeft bereikt.

      2 Het is verboden bedrijfsmatig of anders dan om niet sterke drank te verstrekken aan een persoon van wie niet is
      vastgesteld dat deze de leeftijd van 18 jaar heeft bereikt. Onder verstrekken als bedoeld in de eerste volzin wordt
      eveneens begrepen het verstrekken van sterke drank aan een persoon van wie is vastgesteld dat deze de leeftijd van
      18 jaar heeft bereikt, welke drank echter kennelijk bestemd is voor een persoon van wie niet is vastgesteld dat
      deze de leeftijd van 18 jaar heeft bereikt.

      3 Het is verboden in een slijtlokaliteit de aanwezigheid toe te laten van een persoon van wie niet is vastgesteld
      dat deze de leeftijd van 16 jaar heeft bereikt, anders dan onder toezicht van een persoon van 21 jaar of ouder.

      4 De vaststelling, bedoeld in het eerste tot en met derde lid, blijft achterwege, indien het een persoon betreft
      die onmiskenbaar de vereiste leeftijd heeft bereikt. De vaststelling geschiedt aan de hand van een document als
      bedoeld in [artikel 1, eerste lid, van de Wet op de identificatieplicht][ref1], dan wel een bij of krachtens
      algemene maatregel van bestuur aangewezen document.

      5 Bij gemeentelijke verordening kan worden verboden dat in de gemeente of een bij de verordening aangewezen deel
      daarvan, in een horecalokaliteit van een bij de verordening aangewezen aard de aanwezigheid wordt toegelaten van
      personen beneden een bij die verordening te bepalen leeftijd welke echter niet hoger mag zijn dan 21 jaar.

      6 Op plaatsen waar bedrijfsmatig of anders dan om niet alcoholhoudende drank wordt verstrekt, alsmede bij
      de toegang tot een slijtlokaliteit, dient duidelijk zichtbaar en goed leesbaar te worden aangegeven welke
      leeftijdsgrens of leeftijdsgrenzen gelden. Onze Minister kan daaromtrent nadere regels stellen en modellen
      voorschrijven.

      7 Het is verboden in een slijtlokaliteit of horecalokaliteit of op een terras de aanwezigheid toe te laten van
      een persoon die in kennelijke staat van dronkenschap of kennelijk onder invloed van andere psychotrope stoffen
      verkeert.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
