  - number: '46'
    text: |-
      1 Indien de tot een inrichting behorende lokaliteiten die op 30 september 1967 in gebruik waren voor de
      verstrekking van alcoholhoudende drank in de uitoefening van het horecabedrijf of slijtersbedrijf, toen wel
      voldeden aan de ingevolge de Drankwet (Stb. 1931, 476) met betrekking tot hun afmetingen geldende eisen maar niet
      in overeenstemming zijn met de eisen, ter zake van de afmetingen van lokaliteiten voor die uitoefening gesteld
      krachtens [artikel 10 van de onderhavige wet][ref1], worden zij nochtans geacht aan de ingevolge dat artikel voor
      de uitoefening van dat bedrijf geldende afmetingseisen te voldoen.

      2 Het eerste lid geldt niet:

      a. indien één of meer der in dat lid bedoelde lokaliteiten van de inrichting inmiddels in enig opzicht zijn
      verkleind of een verandering in hun bestemming hebben ondergaan;

      b. indien de uitoefening van het betrokken bedrijf in de inrichting na 30 september 1967 gedurende een jaar anders
      dan wegens overmacht ononderbroken gestaakt is geweest.

      3 Het tweede lid, onder a, is niet van toepassing:

      a. met betrekking tot verkleiningen, strekkende tot aanpassing van de inrichting aan ingevolge [artikel 10][ref2]
      geldende, andere dan de in het eerste lid bedoelde eisen;

      b. met betrekking tot wijzigingen ten aanzien waarvan Onze Minister, van oordeel zijnde dat daartegen uit het
      oogpunt van sociale hygiëne geen overwegende bezwaren bestaan, op aanvrage van de ondernemer die bepaling buiten
      toepassing heeft verklaard.

      4 In een met toepassing van het eerste lid verleende vergunning wordt mede vermeld op welke lokaliteiten die
      toepassing betrekking heeft.


