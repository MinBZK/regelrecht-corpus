  - number: '7'
    text: |-
      1 Een vergunning is vereist voor iedere inrichting.

      2 Geen vergunning wordt verleend voor het uitoefenen van het horecabedrijf of slijtersbedrijf anders dan in een
      inrichting.

      3 Indien een terras onderdeel is van een inrichting, die onderdeel uitmaakt van een winkel wordt slechts een
      vergunning ten aanzien van het terras verleend, indien dit onmiddellijk aansluit aan een horecalokaliteit.
      Voor de overige terrassen wordt slechts vergunning verleend, indien zij in de onmiddellijke nabijheid van een
      horecalokaliteit zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0002458/2005-09-14#Artikel7
  - number: '8'
    text: |-
      1 Voor het verkrijgen van een vergunning moet worden voldaan aan het bij en krachtens de volgende leden bepaalde.

      2 Leidinggevenden dienen aan de volgende eisen te voldoen:

      a. zij mogen niet onder curatele staan dan wel uit het ouderlijk gezag of voogdij ontzet zijn;

      b. zij mogen niet in enig opzicht van slecht levensgedrag zijn;

      c. zij moeten de leeftijd van eenentwintig jaar hebben bereikt.

      3 Bij algemene maatregel van bestuur worden naast de in het tweede lid gestelde eisen andere eisen ten aanzien
      van het zedelijk gedrag van leidinggevenden gesteld en kan de in dat lid, onder b, gestelde eis nader worden
      omschreven.

      4 Leidinggevenden, bij rechtspersonen als bedoeld in [artikel 4][ref1] is zulks beperkt tot 2 leidinggevenden per
      rechtspersoon, dienen tevens te beschikken over voldoende kennis en inzicht met betrekking tot sociale hygiëne,
      overeenkomstig bij algemene maatregel van bestuur te stellen eisen.

      5 Bij regeling van Onze Minister van Volksgezondheid, Welzijn en Sport worden de bewijsstukken aangewezen waaruit
      het voldoen aan de eisen, bedoeld in het vierde lid, moet blijken.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel4
    url: https://wetten.overheid.nl/BWBR0002458/2005-09-14#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '4'
        paragraaf: '2'
  - number: '9'
    text: |-
      1 Het bestuur van een rechtspersoon als bedoeld in [artikel 4][ref1] dient voor het verkrijgen van een vergunning
      een reglement vast te stellen dat waarborgt dat de verstrekking van alcoholhoudende drank in de inrichting
      gedurende de openingstijden vanuit het oogpunt van sociale hygiëne te allen tijde geschiedt door op dit gebied
      gekwalificeerde personen. De kwalificatienormen hiervoor worden eveneens in het in dit artikel genoemde reglement
      vastgesteld.

      2 Het reglement geeft in ieder geval aan op welke dagen en tijdstippen bedrijfsmatig of anders dan om niet
      alcoholhoudende drank wordt verstrekt. Deze dagen en tijdstippen worden duidelijk zichtbaar in de horecalokaliteit
      aangegeven.

      3 Het reglement voorziet in de wijze waarop wordt toegezien op de naleving.

      4 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de inhoud
      van het reglement.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel4
    url: https://wetten.overheid.nl/BWBR0002458/2005-09-14#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '4'
        paragraaf: '2'
  - number: '10'
    text: |-
      De inrichting dient te voldoen aan bij algemene maatregel van bestuur in het belang van de sociale hygiëne te
      stellen eisen.
    url: https://wetten.overheid.nl/BWBR0002458/2005-09-14#Artikel10
  - number: '11'
    text: |-
      Een krachtens [artikel 3][ref1] verleende vergunning geldt ten aanzien van het verstrekken van alcoholhoudende
      drank niet voor andere gedeelten van de openbare weg dan die, waar dat verstrekken door burgemeester en wethouders
      uitdrukkelijk is toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel3
    url: https://wetten.overheid.nl/BWBR0002458/2005-09-14#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '3'
        paragraaf: '2'
  - number: '12'
    text: |-
      1 Het is verboden alcoholhoudende drank te verstrekken voor gebruik ter plaatse anders dan in een in de vergunning
      vermelde horecalokaliteit of anders dan op een in de vergunning vermeld terras, tenzij het betreft het vanuit
      zodanige lokaliteit afleveren van alcoholhoudende drank op bestelling in hotelkamers ingericht voor nachtverblijf
      of het verstrekken van alcoholhoudende drank door het in dergelijke hotelkamers beschikbaar te stellen.

      2 Het is verboden sterke drank te verstrekken voor gebruik elders dan ter plaatse anders dan in een slijtlokaliteit
      die in de vergunning is vermeld.
    url: https://wetten.overheid.nl/BWBR0002458/2005-09-14#Artikel12
  - number: '13'
    text: |-
      1 Het is verboden in een horecalokaliteit of op een terras alcoholhoudende drank te verstrekken voor gebruik elders
      dan ter plaatse.

      2 Het is verboden in een slijtlokaliteit alcoholhoudende drank te verstrekken voor gebruik ter plaatse of toe te
      laten dat daar alcoholhoudende drank wordt genuttigd.
    url: https://wetten.overheid.nl/BWBR0002458/2005-09-14#Artikel13
  - number: '14'
    text: |-
      1 Het is verboden een slijtlokaliteit gelijktijdig in gebruik te hebben voor het verrichten van andere
      bedrijfsactiviteiten dan die welke tot het slijtersbedrijf behoren dan wel toe te laten dat daarin zodanige
      activiteiten worden uitgeoefend.

      2 Het is verboden een horecalokaliteit of een terras tevens in gebruik te hebben voor het uitoefenen van de
      kleinhandel of zelfbedieningsgroothandel of het uitoefenen van een van de in het derde lid genoemde activiteiten,
      dan wel toe te laten dat daarin zodanige handel wordt of zodanige activiteiten worden uitgeoefend, tenzij het
      betreft de verkoop van etenswaren die voor consumptie gereed zijn.

      3 De in het tweede lid bedoelde activiteiten zijn:

      a. het bedrijfsmatig aan particulieren verkopen van goederen in het kader van een openbare verkoping, als bedoeld
      in [artikel 1 van de Wet ambtelijk toezicht bij openbare verkopingen][ref1];

      b. het bedrijfsmatig aanbieden van diensten;

      c. het bedrijfsmatig verhuren van goederen;

      d. het in het openbaar bedrijfsmatig opkopen van goederen.


      [ref1]: https://wetten.overheid.nl/BWBR0002798#Artikel1
    url: https://wetten.overheid.nl/BWBR0002458/2005-09-14#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002798
        artikel: '1'
  - number: '15'
    text: |-
      1 Het is verboden de kleinhandel, met uitzondering van de kleinhandel in condooms en damesverband, of de
      zelfbedieningsgroothandel of een in [artikel 14, derde lid][ref1], genoemde activiteit, uit te oefenen in een
      lokaliteit behorende tot een inrichting waarin het horecabedrijf wordt uitgeoefend, tenzij het publiek slechts
      toegang heeft tot die lokaliteit zonder een lokaliteit te betreden waar alcoholhoudende drank aanwezig is.

      2 Het is verboden dat een slijtlokaliteit rechtstreeks in verbinding staat met een ruimte waarin de kleinhandel of
      zelfbedieningsgroothandel of enige in [artikel 14, derde lid][ref2], genoemde activiteit wordt uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel14
    url: https://wetten.overheid.nl/BWBR0002458/2005-09-14#Artikel15
