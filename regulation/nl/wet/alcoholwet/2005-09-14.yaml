  - number: '24'
    text: |-
      1 Het is verboden een horecalokaliteit of slijtlokaliteit voor het publiek geopend te houden, met uitzondering
      van een lokaliteit in beheer bij een rechtspersoon als bedoeld in [artikel 4][ref1], indien in de inrichting geen
      leidinggevende aanwezig is die vermeld staat op een vergunning met betrekking tot die inrichting of een andere
      vergunning van dezelfde vergunninghouder. Met betrekking tot rechtspersonen als bedoeld in [artikel 4][ref2] geldt,
      dat aanwezig is ofwel de leidinggevende die vermeld staat op een vergunning met betrekking tot die inrichting
      of een andere vergunning van dezelfde vergunninghouder, ofwel een andere op dit gebied gekwalificeerde persoon
      als bedoeld in [artikel 9, eerste lid][ref3]. Voor deze laatste categorie rechtspersonen geldt deze aangepaste
      voorwaarde slechts op momenten dat alcoholhoudende drank wordt geschonken.

      2 Het is verboden in een slijtlokaliteit of horecalokaliteit, gedurende de tijd dat daarin dranken worden
      verstrekt, personen jonger dan 16 jaar dienst te laten doen.

      3 Indien dit voor de naleving van [artikel 20, eerste tot en met vierde lid][ref4], noodzakelijk is, kan bij
      algemene maatregel van bestuur de leeftijd, genoemd in het tweede lid, op 18 jaar worden gesteld, met dien
      verstande dat zulks alsdan niet geldt voor personen die alcoholhoudende drank verstrekken in het kader van een in
      de maatregel aan te geven beroepsopleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel4
