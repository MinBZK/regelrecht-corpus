  - number: '32'
    text: |-
      1 Indien de burgemeester of de inspecteur van oordeel is, dat een vergunning op een der in [artikel 31][ref1]
      genoemde gronden moet worden ingetrokken, doet hij daartoe onder opgave van redenen aan burgemeester en wethouders
      een voorstel.

      2 Binnen drie maanden na ontvangst van zodanig voorstel nemen burgemeester en wethouders daaromtrent een besluit.
      Zij doen daarvan schriftelijk mededeling aan de inspecteur, indien deze het voorstel heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel31
    url: https://wetten.overheid.nl/BWBR0002458/2005-09-14#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '31'
        paragraaf: '4'
  - number: '33'
    text: |-
      Een vergunning vervalt, wanneer:

      a. sedert haar verlening onherroepelijk is geworden, zes maanden zijn verlopen, zonder dat handelingen zijn
      verricht met gebruikmaking van de vergunning;

      b. gedurende een jaar anders dan wegens overmacht geen handelingen zijn verricht met gebruikmaking van de
      vergunning;

      c. de verlening van een vergunning, strekkende tot vervanging van eerstbedoelde vergunning, van kracht is geworden.
    url: https://wetten.overheid.nl/BWBR0002458/2005-09-14#Artikel33
  - number: '34'
    text: |-
      Een faillissement of toepassing van de schuldsaneringsregeling natuurlijke personen heeft ten aanzien van het
      krachtens [artikel 31, eerste lid, onder c][ref1], of [33, onder b][ref2], intrekken of vervallen van de vergunning
      een opschortende werking tot het tijdstip waarop het faillissement onderscheidenlijk de toepassing van de
      schuldsaneringsregeling eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel33
    url: https://wetten.overheid.nl/BWBR0002458/2005-09-14#Artikel34
    references:
