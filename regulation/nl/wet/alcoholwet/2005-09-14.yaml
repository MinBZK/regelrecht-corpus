  - number: '2'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen in het belang van de volksgezondheid regels worden gesteld met
      betrekking tot de inhoud van reclame voor alcoholhoudende drank, de doelgroepen waarop zodanige reclame is gericht,
      alsmede de tijd en wijze waarop en de plaats waar reclame wordt gemaakt. Deze regels kunnen verboden, beperkingen
      van en voorschriften ten aanzien van reclameuitingen bevatten. In de maatregel wordt een overgangsregeling
      getroffen ten aanzien van reclameuitingen die reeds waren geopenbaard op het tijdstip van inwerkingtreding van
      die maatregel.

      2 Het is verboden voor alcoholhoudende drank reclame te maken, welke niet voldoet aan de krachtens het eerste lid
      gestelde regels.

      3 Het in het tweede lid genoemde verbod geldt niet ten aanzien van reclameuitingen voor alcoholhoudende drank,
      waarin met betrekking tot die drank slechts aanduidingen voorkomen betreffende merk, soort en prijs alsmede de
      plaats waar die drank wordt verstrekt.

      4 Een krachtens het eerste lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan
      acht weken na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0002458/2005-09-14#Artikel2
  - number: '3'
    text: |-
      Het is verboden zonder daartoe strekkende vergunning van burgemeester en wethouders het horecabedrijf of
      slijtersbedrijf uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0002458/2005-09-14#Artikel3
  - number: '4'
    text: |-
      1 Aan een vergunning, die op grond van [artikel 3][ref1] voor het horecabedrijf wordt verleend aan een
      rechtspersoon niet zijnde een naamloze vennootschap of besloten vennootschap met beperkte aansprakelijkheid, die
      zich richt op activiteiten van recreatieve, sportieve, sociaal-culturele, educatieve, levensbeschouwelijke of
      godsdienstige aard, verbinden burgemeester en wethouders een of meer voorschriften of beperkingen die, gelet op
      de plaatselijke of regionale omstandigheden, nodig zijn ter voorkoming van mededinging door het verstrekken van
      alcoholhoudende drank, die uit een oogpunt van ordelijk economisch verkeer als onwenselijk moet worden beschouwd.

      2 De in het eerste lid bedoelde voorschriften of beperkingen kunnen op geen andere onderwerpen betrekking hebben
      dan:

      a. in de inrichting te houden bijeenkomsten van persoonlijke aard, zoals bruiloften en partijen;

      b. het openlijk aanprijzen van de mogelijkheid tot het houden van bijeenkomsten als bedoeld onder a;

      c. de tijden gedurende welke in de betrokken inrichting alcoholhoudende drank wordt verstrekt.

      3 Bij gemeentelijke verordening kunnen nadere regels worden gesteld met betrekking tot de in het eerste lid
      bedoelde voorschriften of beperkingen.

      4 Door burgemeester en wethouders worden, indien dit in verband met een wijziging in de plaatselijke of regionale
      omstandigheden nodig is, aan een reeds verleende vergunning als bedoeld in het eerste lid voorschriften of
      beperkingen als in dat lid bedoeld verbonden of aan een zodanige vergunning verbonden voorschriften of beperkingen
      gewijzigd of ingetrokken.

      5 Burgemeester en wethouders kunnen met het oog op bijzondere gelegenheden van zeer tijdelijke aard ontheffing
      verlenen van de aan een vergunning verbonden voorschriften of beperkingen als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel3
    url: https://wetten.overheid.nl/BWBR0002458/2005-09-14#Artikel4
