  - number: '29'
    text: |-
      1 In een vergunning worden vermeld:

      a. de natuurlijke of rechtspersoon of -personen aan wie de vergunning is verleend;

      b. de leidinggevenden;

      c. tot welke bedrijfsuitoefening de vergunning strekt;

      d. de plaats waar de inrichting zich bevindt;

      e. de situering en de oppervlakten van de horeca- of slijtlokaliteiten en terrassen;

      f. de voorschriften of beperkingen welke aan de vergunning zijn verbonden.

      2 De vergunning of een afschrift daarvan is in de inrichting aanwezig.

      3 De vergunning wordt gesteld op een formulier, waarvan het model door Onze Minister wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002458/2005-09-14#Artikel29
  - number: '30'
    text: |-
      Indien een inrichting een zodanige verandering ondergaat dat zij niet langer in overeenstemming is met de in
      de vergunning gegeven omschrijving, is de vergunninghouder verplicht bedoelde wijziging binnen één maand bij
      burgemeester en wethouders te melden. Burgemeester en wethouders verstrekken, indien nog aan de ten aanzien van de
      inrichting gestelde eisen wordt voldaan, een gewijzigde vergunning, waarin de ingevolge [artikel 29][ref1] vereiste
      omschrijving is aangepast aan de nieuwe situatie.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel29
    url: https://wetten.overheid.nl/BWBR0002458/2005-09-14#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '29'
        paragraaf: '4'
  - number: '31'
    text: |-
      1 Een vergunning wordt ingetrokken, indien:

      a. de te harer verkrijging verstrekte gegevens zodanig onjuist of onvolledig blijken, dat op de aanvrage een andere
      beslissing zou zijn genomen, als bij de beoordeling daarvan de juiste omstandigheden volledig bekend waren geweest;

      b. niet langer wordt voldaan aan de ingevolge de [artikelen 8][ref1] en [10][ref2] geldende eisen;

      c. een niet daarin vermelde persoon leidinggevende is geworden met betrekking tot de inrichting, waarop de
      vergunning betrekking heeft;

      d. zich in de betrokken inrichting feiten hebben voorgedaan, die de vrees wettigen, dat het van kracht blijven der
      vergunning gevaar zou opleveren voor de openbare orde, veiligheid of zedelijkheid;

      e. de vergunninghouder in het in [artikel 30][ref3] bedoelde geval geen melding als in dat artikel bedoeld heeft
      gedaan.

      2 Een vergunning kan voorts worden ingetrokken indien:

      a. is gehandeld in strijd met de aan de vergunning verbonden voorschriften of beperkingen, bedoeld in
      [artikel 4][ref4] of [artikel 23, derde lid][ref5];

      b. een bij of krachtens de [artikelen 2][ref6], [13 tot en met 17][ref7], [19 tot en met 21][ref8],
      [22, eerste lid, onder b, tot en met 23, tweede lid][ref9], of [24][ref10] gesteld verbod of het bij
      [artikel 29, tweede lid][ref11], gesteld gebod wordt overtreden;

      c. het reglement bedoeld in [artikel 9, eerste lid][ref12], niet wordt nageleefd, of niet wordt voldaan aan het
      gebod, bedoeld in [artikel 9, tweede lid][ref13], dat de dagen en tijdstippen waarop bedrijfsmatig of anders dan om
      niet alcoholhoudende drank wordt verstrekt duidelijk zichtbaar in de horecalokaliteit zijn aangegeven;

      d. er sprake is van het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref14].

      3 Indien een vergunning op grond van het tweede lid, onder a, is ingetrokken, wordt de bevoegdheid om aan de
      betrokken rechtspersoon een nieuwe vergunning te verlenen, opgeschort tot een jaar nadat het besluit tot intrekking
      onherroepelijk is geworden.

      4 De intrekking van een vergunning krachtens het eerste lid, onder b, c of e, of het tweede lid, kan, voor zover
      de grond tot intrekking niet de persoon van de vergunninghouder betreft, eerst geschieden een maand nadat van het
      voornemen daartoe aan de vergunninghouder schriftelijk mededeling is gedaan.

      5 Voordat toepassing wordt gegeven aan het tweede lid, aanhef en onder d, kan het
      Bureau bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref15], om een advies als
      bedoeld in [artikel 9 van die wet][ref16] worden gevraagd.


