      1 Onze Minister bepaalt welke gegevens een aanvrage om een vergunning als bedoeld in [artikel 3][ref1] dient te
      bevatten.

      2 Bij gemeentelijke verordening kan worden bepaald welke gegevens een aanvraag voor een vergunning eveneens dient
      te bevatten in verband met krachtens [artikel 23, derde lid][ref2], gestelde voorschriften en beperkingen.

      3 Op de aanvraag wordt beslist binnen drie maanden na ontvangst daarvan.


