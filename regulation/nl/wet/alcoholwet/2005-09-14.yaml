  - number: '36'
    text: |-
      Burgemeester en wethouders zijn bevoegd aan andere personen dan hen, die wonen in de ruimte, waarin in strijd met
      deze wet alcoholhoudende drank wordt verstrekt, de toegang tot die ruimte te ontzeggen.
    url: https://wetten.overheid.nl/BWBR0002458/2005-09-14#Artikel36
  - number: '37'
    text: |-
      In gevallen, waarin het betreft de uitoefening van het horecabedrijf of slijtersbedrijf door een gemeente:

      a. treden voor de toepassing van de [artikelen 3][ref1] en [32][ref2] gedeputeerde staten in de plaats van
      burgemeester en wethouders;

      b. treedt voor de toepassing van [artikel 32][ref3] Onze commissaris in de provincie in de plaats van de
      burgemeester.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0002458#Artikel32
    url: https://wetten.overheid.nl/BWBR0002458/2005-09-14#Artikel37
    references:
      - id: ref1
