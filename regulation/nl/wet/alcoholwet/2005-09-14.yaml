  - number: '21'
    text: |-
      Het is verboden bedrijfsmatig of anders dan om niet alcoholhoudende drank te verstrekken, indien redelijkerwijs
      moet worden vermoed, dat dit tot verstoring van de openbare orde, veiligheid of zedelijkheid zal leiden.
    url: https://wetten.overheid.nl/BWBR0002458/2005-09-14#Artikel21
  - number: '22'
    text: |-
      1 Het is verboden bedrijfsmatig of anders dan om niet alcoholhoudende drank te verstrekken:

      a. op plaatsen waar brandstof voor middelen van vervoer aan particulieren wordt verstrekt en in winkels die aan een
      benzinestation zijn verbonden;

      b. in winkels die verbonden zijn aan een inrichting waarin het horecabedrijf wordt uitgeoefend gelegen langs een
      krachtens de [Wegenverkeerswet 1994](onbekend) als autoweg aangeduide weg;

      c. in ruimten gelegen langs een krachtens de [Wegenverkeerswet 1994](onbekend) als autosnelweg aangeduide weg,
      tenzij het betreft het verstrekken van alcoholhoudende drank voor gebruik ter plaatse in een horecalokaliteit of op
      een in de onmiddellijke nabijheid van een horecalokaliteit gelegen terras, en in die inrichting hoofdzakelijk warme
      maaltijden voor directe consumptie ter plaatse worden verstrekt.

      2 Bij algemene maatregel van bestuur kan het bedrijfsmatig of anders dan om niet verstrekken van alcoholhoudende
      drank worden verboden:

      a. in stadions of bij die maatregel aangewezen delen daarvan, in gebruik bij organisaties van betaald voetbal,
      gedurende de tijd dat zij in verband met wedstrijden van betaald voetbal voor het publiek geopend zijn;

      b. in gebouwen of in die maatregel aangewezen delen daarvan, die in gebruik zijn bij instellingen op het terrein
      van de gezondheidszorg en het onderwijs en in zwembaden.

      3 Een krachtens het tweede lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan
      acht weken na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0002458/2005-09-14#Artikel22
  - number: '23'
    text: |-
      1 Bij gemeentelijke verordening kan, de inspecteur gehoord, het bedrijfsmatig of anders dan om niet verstrekken van
      alcoholhoudende drank worden verboden, met dien verstande dat een verbod dat betrekking heeft op het verstrekken
      van zwak-alcoholhoudende drank anders dan in een inrichting slechts betrekking heeft op een beperkte tijdsruimte.

      2 Bij zodanige verordening kan worden bepaald, dat het verbod slechts geldt voor inrichtingen van een bij de
      verordening aangewezen aard, in bij de verordening aangewezen delen van de gemeente of voor een bij of krachtens
      die verordening aangewezen tijdsruimte.

      3 Bij een verordening als bedoeld in het eerste lid kunnen regels worden gesteld omtrent de voorschriften die aan
      een vergunning als bedoeld in [artikel 3][ref1] kunnen worden verbonden en omtrent het beperken van een vergunning
      tot het verstrekken van zwak-alcoholhoudende drank.

      4 De inspecteur zendt van zijn oordeel over de ontwerpverordening een afschrift aan gedeputeerde staten.

      5 Een verordening wordt in afschrift gezonden aan gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel3
    url: https://wetten.overheid.nl/BWBR0002458/2005-09-14#Artikel23
