preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Drankwet (Stb. 1931, 476) en de voor de
    horecabedrijven en het slijtersbedrijf geldende vestigingsregelingen te vervangen door een nieuwe wet, welke ten
    aanzien van het verstrekken van alcoholhoudende drank zowel uit sociaal-hygiënisch als uit sociaal-economisch
    oogpunt regelen stelt;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002458/2005-09-14#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:

      – Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;

      – horecabedrijf: de activiteit in ieder geval bestaande uit het bedrijfsmatig of anders dan om niet verstrekken van
      alcoholhoudende drank voor gebruik ter plaatse;

      – slijtersbedrijf: de activiteit bestaande uit het bedrijfsmatig of anders dan om niet aan particulieren
      verstrekken van sterke drank voor gebruik elders dan ter plaatse, al dan niet gepaard gaande met het bedrijfsmatig
      of anders dan om niet aan particulieren verstrekken van zwak-alcoholhoudende en alcoholvrije drank voor gebruik
      elders dan ter plaatse of met het bedrijfsmatig verrichten van bij algemene maatregel van bestuur aangewezen andere
      handelingen;

      – lokaliteit: een besloten ruimte, onderdeel uitmakend van een inrichting;

      – horecalokaliteit: een van een afsluitbare toegang voorziene lokaliteit, onderdeel uitmakend van een inrichting
      waarin het horecabedrijf wordt uitgeoefend, in ieder geval bestemd voor het verstrekken van alcoholhoudende drank
      voor gebruik ter plaatse;

      – slijtlokaliteit: een van een afsluitbare toegang voorziene lokaliteit, onderdeel uitmakend van of samenvallend
      met een inrichting waarin het slijtersbedrijf wordt uitgeoefend, in ieder geval bestemd voor het verstrekken van
      sterke drank voor gebruik elders dan ter plaatse;

      – inrichting: de lokaliteiten waarin het slijtersbedrijf of het horecabedrijf wordt uitgeoefend, met de daarbij
      behorende terrassen voor zover die terrassen in ieder geval bestemd zijn voor het verstrekken van alcoholhoudende
      drank voor gebruik ter plaatse, welke lokaliteiten al dan niet onderdeel uitmaken van een andere besloten ruimte;

      – leidinggevende:

      1°. de natuurlijke persoon of de bestuurders van een rechtspersoon of hun gevolmachtigden, voor wiens rekening
      en risico het horecabedrijf of het slijtersbedrijf wordt uitgeoefend, met uitzondering van bestuurders van een
      rechtspersoon als bedoeld in [artikel 4][ref1];

      2°. de natuurlijke persoon, die algemene leiding geeft aan een onderneming, waarin het horecabedrijf of het
      slijtersbedrijf wordt uitgeoefend in een of meer inrichtingen;

      3°. de natuurlijke persoon, die onmiddellijke leiding geeft aan de uitoefening van zodanig bedrijf in een
      inrichting;

      – inspecteur: de bevoegde inspecteur van het Staatstoezicht op de volksgezondheid;

      – wijn: de drank, die door alcoholische gisting is verkregen uit en geen andere bestanddelen bevat dan die,
      afkomstig van het sap van druiven – vruchten van Vitis Vinifera L. – alsmede de drank, die met toepassing van
      bijzondere technische bewerkingen of met toevoeging van andere bestanddelen is verkregen uit bovenbedoeld sap,
      voor zover deze toepassing of toevoeging in het land van oorsprong van zodanige drank bij de bereiding daarvan
      gebruikelijk is;

      – sterke drank: de drank, die bij een temperatuur van twintig graden Celsius voor vijftien of meer volumenprocenten
      uit alcohol bestaat, met uitzondering van wijn;

      – alcoholhoudende drank: de drank die bij een temperatuur van twintig graden Celsius voor meer dan een half
      volumeprocent uit alcohol bestaat;

      – zwak-alcoholhoudende drank: alcoholhoudende drank, met uitzondering van sterke drank;

      – bedrijfslichaam: een openbaar lichaam als bedoeld in [artikel 66 van de Wet op de Bedrijfsorganisatie][ref2]
      (Stb. 1950, K 22);

      – bijlage: bijlage bedoeld in [artikel 44b, eerste lid][ref3];

      – overtreding: handeling als omschreven in de bijlage, welke in strijd is met het bepaalde bij of
      krachtens de [artikelen 2][ref4], [3][ref5], [9, tweede lid][ref6], [12 tot en met 20, vierde lid][ref7],
      [20, zesde lid][ref8], [22][ref9], [24][ref10], [25][ref11] of [29, tweede lid][ref12];

      – boete: bestuurlijke sanctie bestaande in de verplichting aan de staat een bepaalde geldsom te betalen.

      2 Onder een inrichting wordt niet verstaan een vervoermiddel voor het rondtrekkend uitoefenen van een bedrijf.

      3 Deze wet is, met uitzondering van de [artikelen 20, eerste, tweede, vierde, zesde en zevende lid][ref13],
      [21][ref14] en [24, tweede lid][ref15], niet van toepassing op:

      a. vervoermiddelen die bestemd zijn voor het vervoer van personen, tijdens hun gebruik als zodanig;

      b. legerplaatsen en lokaliteiten, aan het militair gezag onderworpen, gedurende de tijd dat deze uitsluitend voor
      militaire doeleinden worden gebruikt.


