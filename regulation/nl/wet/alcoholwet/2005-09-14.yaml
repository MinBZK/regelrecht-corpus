        bwb_id: BWBR0002458
        artikel: '33'
        paragraaf: '4'
  - number: '35'
    text: |-
      1 De burgemeester kan ten aanzien van het verstrekken van zwak-alcoholhoudende drank op aanvraag ontheffing
      verlenen van het in [artikel 3][ref1] voor de uitoefening van het horecabedrijf gestelde verbod, bij een in de
      beschikking aangewezen bijzondere gelegenheid van zeer tijdelijke aard voor een aaneengesloten periode van ten
      hoogste twaalf dagen, mits de verstrekking geschiedt onder onmiddellijke leiding van een persoon die voldoet aan
      [artikel 8, tweede en vierde lid][ref2].

      2 Een ontheffing kan onder beperkingen worden verleend; aan een ontheffing kunnen voorschriften worden verbonden.

      3 Ten aanzien van een ontheffing is [artikel 31, eerste lid, onder a en d][ref3], van overeenkomstige toepassing.

      4 Besluiten tot verlening, wijziging of intrekking van een ontheffing worden in afschrift aan de inspecteur
      gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002458#Artikel31
    url: https://wetten.overheid.nl/BWBR0002458/2005-09-14#Artikel35
