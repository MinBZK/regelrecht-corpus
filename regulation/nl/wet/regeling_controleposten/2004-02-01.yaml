preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Verkeer en Waterstaat;

    Gelet op Verordening (EG) Nr. 1255/97 van de Raad van de Europese Unie van 25 juni 1997 betreffende de
    communautaire criteria voor halteplaatsen en tot aanpassing van het in richtlijn 91/628/EEG bedoelde reisschema
    (PbEG L 174) alsmede op artikel 7, vijfde lid, Besluit dierenvervoer 1994;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0010527/2004-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
             verordening:

              [Verordening (EG) Nr. 1255/97](31997R1255) van de Raad van de Europese Unie van 25 juni 1997 betreffende de
      communautaire criteria voor halteplaatsen en tot aanpassing van het in [richtlijn 91/628/EEG](31991L0628) bedoelde
      reisschema (PbEG L 174);



            b
             minister:

              Minister van Landbouw, Natuur en Voedselkwaliteit;



            c
             beschikking 2003/483/EG:

              beschikking van de Commissie van de Europese Gemeenschappen van 30 juni 2003 houdende vaststelling van
      overgangsmaatregelen voor de controle van de verplaatsingen van dieren van voor mond- en klauwzeer gevoelige
      soorten (PbEU L162).
    url: https://wetten.overheid.nl/BWBR0010527/2004-02-01#Artikel1
  - number: '2'
    text: |-
      Het is verboden dieren tijdens het vervoer uit te laden op een halteplaats die niet is erkend ingevolge artikel 3
      van de verordening.
    url: https://wetten.overheid.nl/BWBR0010527/2004-02-01#Artikel2
  - number: '3'
    text: |-
      1 Erkenning van een halteplaats wordt op aanvraag van de natuurlijke of rechtspersoon die verantwoordelijk is voor
      het beheer van de halteplaats, verleend door de minister.

      2 Erkenning wordt slechts verleend indien de halteplaats voldoet aan de artikelen 3, tweede lid, 4, eerste en
      derde lid, en 5, van de verordening alsmede, indien het een gebouw van een verzamelcentrum of een verzamelcentrum
      als bedoeld in artikel 2, punt o, van [richtlijn 64/432/EEG](31964L0432) van de Raad van de Europese Gemeenschap
      van 26 juni 1964 inzake veterinairrechtelijke vraagstukken op het gebied van het intracommunautair handelsverkeer
      in runderen en varkens (PbEG L 121) betreft, aan artikel 4, tweede lid, van de verordening en artikel 9 van
      beschikking 2003/483/EG.

      3 De minister kan de erkenning schorsen of intrekken in de gevallen bedoeld in artikel 3, vierde lid, van de
      verordening of indien niet wordt voldaan aan artikel 9 van beschikking 2003/483/EG.
    url: https://wetten.overheid.nl/BWBR0010527/2004-02-01#Artikel3
  - number: '4'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0010527/2004-02-01#Artikel4
  - number: '5'
    text: 'Deze regeling wordt aangehaald als: Regeling halteplaatsen.'
    url: https://wetten.overheid.nl/BWBR0010527/2004-02-01#Artikel5
