preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de taak van de netbeheerder van het landelijk
    hoogspanningsnet tot verstrekking van subsidie ten behoeve van de stimulering van de milieukwaliteit van de
    elektriciteitsproductie alsmede ter bevordering van een doelmatig gebruik van warmte, te beëindigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0023925/2009-01-01#ArtikelAanhef
articles:
  - number: II.1
    text: |-
      Op aanvragen om subsidie die vóór 1 januari 2007 zijn ingediend en op subsidies die vóór 1 januari 2007
      zijn verstrekt, blijft het bepaalde bij of krachtens de [Elektriciteitswet 1998][ref1] van toepassing
      zoals die onmiddellijk voor dat tijdstip luidde, met dien verstande dat in het bepaalde bij of krachtens
      [hoofdstuk 5, paragraaf 2, van de Elektriciteitswet 1998][ref2] voor de netbeheerder van het landelijk
      hoogspanningsnet wordt gelezen Onze Minister van Economische Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0009755
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0023925/2009-01-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0009755
      - id: ref2
        bwb_id: BWBR0009755
        paragraaf: '2'
  - number: II.2
    text: |-
      Op aanvragen om subsidie die vanaf 1 januari 2007 zijn ingediend en op subsidies die vanaf 1 januari 2007
      zijn verstrekt, blijft het bepaalde bij of krachtens de [Elektriciteitswet 1998][ref1] van toepassing
      zoals die met ingang van dat tijdstip luidde, met dien verstande dat in het bepaalde bij of krachtens
      [hoofdstuk 5, paragraaf 2, van de Elektriciteitswet 1998][ref2] voor de netbeheerder van het landelijk
      hoogspanningsnet wordt gelezen Onze Minister van Economische Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0009755
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0023925/2009-01-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0009755
      - id: ref2
        bwb_id: BWBR0009755
        paragraaf: '2'
  - number: III
    text: |-
      De behandeling van bezwaar- en beroepschriften in het kader van de verstrekking van subsidie als bedoeld in
      [Hoofdstuk 5, paragraaf 2.2, van de Elektriciteitswet 1998][ref1] zoals dat voor en met ingang van 1 januari 2007
      luidde, wordt, in de staat waarin zij zich bevinden, met ingang van de datum waarop dit artikel in werking treedt
      overgedragen aan Onze Minister van Economische Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Paragraaf2.2
    url: https://wetten.overheid.nl/BWBR0023925/2009-01-01#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0009755
        paragraaf: '2.2'
  - number: IV.1
    text: |-
      De netbeheerder van het landelijk hoogspanningsnet stelt over 2008 een jaarverslag op overeenkomstig
      [artikel 70 van de Elektriciteitswet 1998][ref1] zoals dat onmiddellijk luidde voor het moment van inwerkingtreding
      van [artikel IV][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0023925#ArtikelIV
    url: https://wetten.overheid.nl/BWBR0023925/2009-01-01#ArtikelIV
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '70'
      - id: ref2
        bwb_id: BWBR0023925
        artikel: IV
  - number: IV.2
    text: |-
      De netbeheerder van het landelijk hoogspanningsnet stelt over 2008 een jaarrekening op overeenkomstig
      [artikel 72i van de Elektriciteitswet 1998][ref1] zoals dat onmiddellijk luidde voor het moment van
      inwerkingtreding van [artikel IV][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel72i
      [ref2]: https://wetten.overheid.nl/BWBR0023925#ArtikelIV
    url: https://wetten.overheid.nl/BWBR0023925/2009-01-01#ArtikelIV
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 72i
      - id: ref2
        bwb_id: BWBR0023925
        artikel: IV
  - number: IV.3
    text: |-
      Het besluit tot vaststelling van de jaarrekening over 2008 behoeft de goedkeuring van Onze Minister van
      Economische Zaken. De goedkeuring kan worden onthouden wegens strijd met het recht of het algemeen belang.
      [Artikel 72k van de Elektriciteitswet 1998][ref1] zoals dat onmiddellijk luidde voor het moment van
      inwerkingtreding van [artikel IV][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel72k
      [ref2]: https://wetten.overheid.nl/BWBR0023925#ArtikelIV
    url: https://wetten.overheid.nl/BWBR0023925/2009-01-01#ArtikelIV
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 72k
      - id: ref2
        bwb_id: BWBR0023925
        artikel: IV
  - number: V.1
    text: |-
      Archiefbescheiden van de netbeheerder van het landelijk hoogspanningsnet met betrekking
      tot de verlening, bevoorschotting en vaststelling van subsidie als bedoeld in
      [Hoofdstuk 5, paragraaf 2.2, van de Elektriciteitswet 1998][ref1] zoals die luidde onmiddellijk voor 1 januari 2007
      en met ingang van 1 januari 2007, gaan met ingang van de datum van inwerkingtreding van dit artikel over naar Onze
      Minister van Economische Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Paragraaf2.2
    url: https://wetten.overheid.nl/BWBR0023925/2009-01-01#ArtikelV
    references:
      - id: ref1
        bwb_id: BWBR0009755
        paragraaf: '2.2'
  - number: V.2
    text: |-
      Voor zover na het tijdstip van inwerkingtreding van dit artikel door de netbeheerder van het
      landelijk hoogspanningsnet voor het vaststellen van het jaarverslag of de jaarrekening, bedoeld in
      [artikel IV, eerste en tweede lid][ref1], gebruik moet worden gemaakt van archiefbescheiden als bedoeld in het
      eerste lid, stelt Onze Minister van Economische Zaken deze ter beschikking aan de netbeheerder van het landelijk
      hoogspanningsnet.


      [ref1]: https://wetten.overheid.nl/BWBR0023925#ArtikelIV
    url: https://wetten.overheid.nl/BWBR0023925/2009-01-01#ArtikelV
    references:
      - id: ref1
        bwb_id: BWBR0023925
        artikel: IV
  - number: VI
    text: |-
      De netbeheerder van het landelijk hoogspanningsnet stelt op verzoek van Onze Minister van Economische Zaken
      gegevens beschikbaar met betrekking tot de verlening, bevoorschotting en vaststelling van subsidie als bedoeld in
      [Hoofdstuk 5, paragraaf 2.2, van de Elektriciteitswet 1998][ref1] zoals dat luidde onmiddellijk voor 1 januari 2007
      en met ingang van 1 januari 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Paragraaf2.2
    url: https://wetten.overheid.nl/BWBR0023925/2009-01-01#ArtikelVI
    references:
      - id: ref1
        bwb_id: BWBR0009755
        paragraaf: '2.2'
  - number: VII.1
    text: |-
      Door de netbeheerder van het landelijk hoogspanningsnet gemaakte kosten van de afbouw en overdracht van de
      opgedragen taak tot subsidieverstrekking, bedoeld in [artikel 69 van de Elektriciteitswet 1998][ref1] zoals dat
      luidde onmiddellijk voor het moment van inwerkingtreding van [artikel VII][ref2], komen vanaf het moment van
      inwerkingtreding ten laste van de egalisatiereserve, bedoeld in [artikel 72h van de Elektriciteitswet 1998][ref3]
      zoals dat onmiddellijk luidde voor het moment van inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0023925#ArtikelVII
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel72h
    url: https://wetten.overheid.nl/BWBR0023925/2009-01-01#ArtikelVII
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '69'
      - id: ref2
        bwb_id: BWBR0023925
        artikel: VII
      - id: ref3
        bwb_id: BWBR0009755
        artikel: 72h
  - number: VII.2
    text: |-
      Twaalf maanden na het moment van inwerkingtreding van dit artikel heft de netbeheerder van het landelijk
      hoogspanningsnet de egalisatiereserve op, waarbij vereffening van het saldo plaatsvindt met Onze Minister van
      Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0023925/2009-01-01#ArtikelVII
  - number: IX.1
    text: |-
      Deze wet treedt met uitzondering van [artikel VI][ref1] in werking op een bij koninklijk besluit te bepalen
      tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0023925#ArtikelVI
