  - number: '2.13'
    text: |-
      Indien de werkzaamheden ten behoeve van de afgifte van documenten als bedoeld in deze paragraaf, buiten toedoen van
      de ambtenaren van de Inspectie Leefomgeving en Transport, niet leiden tot afgifte van dat document, is het volgende
      tarief verschuldigd:
    url: https://wetten.overheid.nl/BWBR0017739/2019-01-01#Artikel2.13
  - number: 2.13.a
    text: indien de werkzaamheden niet volledig zijn uitgevoerd € 123 per manuur;
    url: https://wetten.overheid.nl/BWBR0017739/2019-01-01#Artikel2.13
  - number: 2.13.b
    text: |-
      indien de werkzaamheden volledig zijn uitgevoerd, het tarief dat is vastgesteld voor werkzaamheden ten behoeve van
      de afgifte van het document.
    url: https://wetten.overheid.nl/BWBR0017739/2019-01-01#Artikel2.13
  - number: '2.14'
    text: |-
      Voor werkzaamheden voortvloeiende uit het bepaalde bij of krachtens de
      [Wet nationaliteit zeeschepen in rompbevrachting][ref1], de [Zeebrievenwet][ref2] of de
      [Maatregel teboekgestelde schepen 1992][ref3], en waarvoor niet op grond van een van de overige artikelen van deze
      paragraaf een tarief is vastgesteld, is een tarief verschuldigd van € 123 per manuur.


      [ref1]: https://wetten.overheid.nl/BWBR0005681
      [ref2]: https://wetten.overheid.nl/BWBR0001933
      [ref3]: https://wetten.overheid.nl/BWBR0005260
