      [ref1]: https://wetten.overheid.nl/BWBR0016318
    url: https://wetten.overheid.nl/BWBR0017739/2019-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0016318
  - number: 5.3.1
    text: |-
      Indien het bij koninklijke boodschap van 3 juli 2003 ingediende voorstel van wet tot wijziging van de Wet
      voorkoming verontreiniging door schepen, de Wet verontreiniging zeewater en de Scheepvaartverkeerswet in verband
      met de instelling van de Nederlandse exclusieve economische zone en enkele andere onderwerpen (28 984) tot wet is
      verheven en artikel I, onderdeel U, van die wet in werking treedt:
    url: https://wetten.overheid.nl/BWBR0017739/2019-01-01#Artikel5.3
  - number: 5.3.1.a
    text: |-
      berust deze regeling na die inwerkingtreding mede op
      [artikel 40, tweede lid, van de Wet voorkoming verontreiniging door schepen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel40
    url: https://wetten.overheid.nl/BWBR0017739/2019-01-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '40'
  - number: 5.3.2
    text: |-
      Indien de [Wet laden en lossen zeeschepen][ref1] in werking is getreden, berust deze regeling na die
      inwerkintreding mede op [artikel 23, tweede lid, van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017718
      [ref2]: https://wetten.overheid.nl/BWBR0017718#Artikel23
    url: https://wetten.overheid.nl/BWBR0017739/2019-01-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0017718
      - id: ref2
        bwb_id: BWBR0017718
        artikel: '23'
  - number: '5.4'
    text: |-
      Deze regeling treedt in werking met ingang van 1 januari 2005, met uitzondering van [artikel 3.2][ref1]. dat
      inwerking treedt op het tijdstip waarop de [Wet laden en lossen zeeschepen][ref2] in werking treedt.


