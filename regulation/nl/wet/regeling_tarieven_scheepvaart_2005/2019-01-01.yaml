      Voor het verlengen van de geldigheidsduur van een verklaring van deskundigheid
      aangaande het gebruik van vloeibaar aardgas als brandstof, als bedoeld in
      [artikel 4a.04 van het Reglement betreffende het scheepvaartpersoneel op de Rijn][ref1], is een tarief
      verschuldigd dat is vastgesteld door het CBR overeenkomstig [artikel 4am van de Wegenverkeerswet 1994][ref2] en
      [artikel 17, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref3].


