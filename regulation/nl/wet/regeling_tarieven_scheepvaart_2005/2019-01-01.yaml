      Nederland, komen voor rekening van de aanvrager. Deze kosten worden afzonderlijk in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0017739/2019-01-01#Artikel4.3
  - number: 4.3.4
    text: |-
