      [ref2]: https://wetten.overheid.nl/BWBR0001933#Artikel6a
      [ref3]: https://wetten.overheid.nl/BWBR0001933#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0001933#Artikel4a
