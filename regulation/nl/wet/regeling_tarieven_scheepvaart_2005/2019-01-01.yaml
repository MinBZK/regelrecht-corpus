  - number: 2.10.1
    text: |-
      Voor de werkzaamheden ten behoeve van de inschrijving van een zeeschip in het rompbevrachtingsregister, bedoeld
      in [artikel 2, eerste lid, van de Wet nationaliteit zeeschepen in rompbevrachting][ref1], is de rompbevrachter een
      tarief verschuldigd van € 1.551.


