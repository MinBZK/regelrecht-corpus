        bwb_id: BWBR0005681
        artikel: '2'
  - number: 2.10.2
    text: |-
      Voor het aanbrengen van een wijziging in de in het eerste lid bedoelde inschrijving, is de rompbevrachter een
      tarief verschuldigd van € 167.
    url: https://wetten.overheid.nl/BWBR0017739/2019-01-01#Artikel2.10
  - number: 2.10.3
    text: |-
      Voor de werkzaamheden ten behoeve van de afgifte van een gewaarmerkt uittreksel uit het rompbevrachtingsregister,
      bedoeld in het eerste lid, is de rompbevrachter een tarief verschuldigd van € 138.
    url: https://wetten.overheid.nl/BWBR0017739/2019-01-01#Artikel2.10
  - number: 2.10.4
    text: |-
      In afwijking van het tweede lid is de rompbevrachter voor het aanbrengen van een wijziging die betrekking heeft op
      de dagtekening of de tijdsduur van de rompbevrachtingsovereenkomst een tarief verschuldigd van € 476.
    url: https://wetten.overheid.nl/BWBR0017739/2019-01-01#Artikel2.10
  - number: 2.10.5
    text: |-
      Voor een bareboat-outverklaring, houdende de instemming van de Minister van Infrastructuur en Waterstaat met de
      inschrijving in een buitenlands rompbevrachtingsregister, is een vergoeding verschuldigd van € 159.
    url: https://wetten.overheid.nl/BWBR0017739/2019-01-01#Artikel2.10
  - number: '2.11'
    text: |-
      Voor de werkzaamheden ten behoeve van de afgifte van een verklaring als
      bedoeld in [artikel 311a, eerste lid, van het Wetboek van Koophandel][ref1] of
      [artikel 37, eerste lid, van de Maatregel teboekgestelde schepen 1992][ref2], is de aanvrager het volgende tarief
      verschuldigd:


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel311a
      [ref2]: https://wetten.overheid.nl/BWBR0005260#Artikel37
