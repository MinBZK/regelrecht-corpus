      specialist waaruit blijkt dat een bemanningslid voldoet aan de medische eisen, bedoeld in
      [artikel 106, eerste lid, van het Besluit zeevarenden handelsvaart en zeilvaart][ref1], onderscheidenlijk
      [artikel 62, eerste lid, van het Besluit zeevisvaartbemanning][ref2], dan wel houdende een bericht van afkeuring.


