        artikel: '17'
  - number: 2.1.1
    text: |-
      In deze paragraaf zijn de begripsbepalingen van [artikel 1 van de Meetbrievenwet 1981][ref1] en
      [artikel 1 van de Regeling metingsvoorschriften][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003378#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017739/2019-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0003378
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006017
        artikel: '1'
  - number: 2.1.2
    text: 'In deze paragraaf wordt voorts verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0017739/2019-01-01#Artikel2.1
  - number: 2.1.2.a
    text: 'meting: werkzaamheden ten behoeve van de afgifte van:'
    url: https://wetten.overheid.nl/BWBR0017739/2019-01-01#Artikel2.1
  - number: 2.1.2.a.1°
    text: een Internationale Meetbrief (1969);
    url: https://wetten.overheid.nl/BWBR0017739/2019-01-01#Artikel2.1
  - number: 2.1.2.a.2°
    text: |-
      een bijzondere meetbrief voor een schip, waarvoor niet eerder een Internationale Meetbrief (1969) of bijzondere
      meetbrief is afgegeven;
    url: https://wetten.overheid.nl/BWBR0017739/2019-01-01#Artikel2.1
  - number: 2.1.2.b
    text: 'hermeting: werkzaamheden ten behoeve van de afgifte van:'
    url: https://wetten.overheid.nl/BWBR0017739/2019-01-01#Artikel2.1
  - number: 2.1.2.b.1°
    text: |-
      een Internationale Meetbrief (1969) voor een schip, waarvoor reeds eerder een Internationale Meetbrief (1969),
      bijzondere meetbrief of een meetbrief als bedoeld in het Verdrag van Oslo 1947, is afgegeven;
    url: https://wetten.overheid.nl/BWBR0017739/2019-01-01#Artikel2.1
  - number: 2.1.2.b.2°
    text: |-
      een bijzondere meetbrief voor een schip, waarvoor reeds eerder een Internationale Meetbrief (1969), bijzondere
      meetbrief of een meetbrief als bedoeld in het Verdrag van Oslo 1947, is afgegeven;
    url: https://wetten.overheid.nl/BWBR0017739/2019-01-01#Artikel2.1
  - number: 2.1.2.c
    text: 'ponton: blokvormig schip zonder mogelijkheid om benedendeks lading te vervoeren;'
    url: https://wetten.overheid.nl/BWBR0017739/2019-01-01#Artikel2.1
  - number: 2.1.2.d
    text: 'zusterschepen: schepen die volgens dezelfde bouwtekening zijn gebouwd'
    url: https://wetten.overheid.nl/BWBR0017739/2019-01-01#Artikel2.1
  - number: 2.2.1
    text: |-
      Voor de meting van een schip ten behoeve van de afgifte van een internationale Meetbrief (1969) is een tarief
      verschuldigd van € 156 per uur.
    url: https://wetten.overheid.nl/BWBR0017739/2019-01-01#Artikel2.2
  - number: 2.2.2
    text: 'In afwijking van het eerste lid is voor de meting van:'
    url: https://wetten.overheid.nl/BWBR0017739/2019-01-01#Artikel2.2
  - number: 2.2.2.a
    text: een vissersvaartuig met een lengte in zijn totaliteit van minder dan 15 meter een tarief verschuldigd van € 330;
    url: https://wetten.overheid.nl/BWBR0017739/2019-01-01#Artikel2.2
  - number: 2.2.2.b
    text: een pleziervaartuig met een lengte van minder dan 24 meter een tarief verschuldigd van € 287.
    url: https://wetten.overheid.nl/BWBR0017739/2019-01-01#Artikel2.2
  - number: '2.3'
    text: |-
      Voor de meting van een schip, ten behoeve van de afgifte van een bijzondere meetbrief, speciaal ingericht voor
      gebruik bij de vaart door het Suezkanaal, is een tarief verschuldigd van € 156 per uur.
    url: https://wetten.overheid.nl/BWBR0017739/2019-01-01#Artikel2.3
  - number: '2.4'
    text: |-
      Voor onderzoek ten behoeve van de afgifte van een inhoudsverklaring voor gebruik bij de vaart door het Panamakanaal
      (*PC/UMS Documentation of Total Volume*) is een tarief verschuldigd van € 440.
    url: https://wetten.overheid.nl/BWBR0017739/2019-01-01#Artikel2.4
  - number: '2.5'
    text: |-
      Voor controlewerkzaamheden ten behoeve van de afgifte van een Internationale Meetbrief (1969) of een bijzondere
      meetbrief is, indien bij het omvlaggen van een schip de buitenlandse meetgegevens worden overgenomen of indien een
      schip door een daartoe bevoegde buitenlandse autoriteit ingevolge [artikel 8 van de Meetbrievenwet 1981][ref1] of
      de [Regeling metingsvoorschriften][ref2] is gemeten of hermeten, een tarief verschuldigd van € 1.123.


      [ref1]: https://wetten.overheid.nl/BWBR0003378#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006017
    url: https://wetten.overheid.nl/BWBR0017739/2019-01-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0003378
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0006017
  - number: 2.6.1
    text: Voor de afgifte van een meetbrief of een bijzondere meetbrief is een het tarief verschuldigd van € 159.
    url: https://wetten.overheid.nl/BWBR0017739/2019-01-01#Artikel2.6
  - number: 2.6.2
    text: |-
      Voor het aanbrengen van een wijziging in een Internationale Meetbrief (1969), een bijzondere meetbrief of een
      inhoudsverklaring als bedoeld in [artikel 2.4][ref1], zonder dat hiervoor een meting of hermeting plaatsvindt, is
      een tarief verschuldigd van € 55.


      [ref1]: https://wetten.overheid.nl/BWBR0017739#Artikel2
    url: https://wetten.overheid.nl/BWBR0017739/2019-01-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0017739
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '2.7'
    text: |-
      Indien de eigenaar een verzoek indient voor de meting of hermeting van twee of meer van zijn schepen, niet zijnde
      zusterschepen, en deze metingen gelijktijdig op één locatie kunnen worden uitgevoerd voor één rekening, is voor het
      eerste schip een tarief als bedoeld in de deze paragraaf verschuldigd en voor de volgende schepen een tarief van €
      123 per manuur verschuldigd.
    url: https://wetten.overheid.nl/BWBR0017739/2019-01-01#Artikel2.7
  - number: '2.8'
    text: |-
      Indien de werkzaamheden ten behoeve van de afgifte van documenten als bedoeld in deze paragraaf, buiten toedoen van
      de ambtenaren van de Inspectie Leefomgeving en Transport, niet leiden tot afgifte van dat document, is het volgende
      tarief verschuldigd:
    url: https://wetten.overheid.nl/BWBR0017739/2019-01-01#Artikel2.8
  - number: 2.8.a
    text: indien de werkzaamheden niet volledig zijn uitgevoerd € 123 per manuur;
    url: https://wetten.overheid.nl/BWBR0017739/2019-01-01#Artikel2.8
  - number: 2.8.b
    text: |-
      indien de werkzaamheden volledig zijn uitgevoerd, het tarief dat is vastgesteld voor werkzaamheden of meting ten
      behoeve van de afgifte van het document.
    url: https://wetten.overheid.nl/BWBR0017739/2019-01-01#Artikel2.8
  - number: '2.9'
    text: |-
      Voor werkzaamheden voortvloeiende uit het bepaalde bij of krachtens de [Meetbrievenwet 1981][ref1], en waarvoor
      niet op grond van een van de overige artikelen van deze paragraaf een tarief is vastgesteld, is een tarief
      verschuldigd van € 123 per manuur.


      [ref1]: https://wetten.overheid.nl/BWBR0003378
    url: https://wetten.overheid.nl/BWBR0017739/2019-01-01#Artikel2.9
