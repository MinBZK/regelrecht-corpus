  - number: 4.3.4
    text: |-
      In afwijking van het eerste lid, is voor onderzoeken bedoeld in [§ 1.2][ref1] een aanvullende tarief niet
      verschuldigd, indien het onderzoek plaatsvindt in België of Duitsland, binnen een afstand van 50 km van de
      Nederlands-Belgische grens of Nederlands-Duitse grens.


      [ref1]: https://wetten.overheid.nl/BWBR0017739#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0017739
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 4.3.5
    text: |-
      Indien onderzoek ten behoeve van de afgifte van een certificaat, vergunning, verklaring of document als bedoeld in
      deze regeling, buiten toedoen van de ambtenaren van de Inspectie Verkeer en Waterstaat niet volledig is uitgevoerd
      en niet leidt tot de afgifte van dat document, is het geldende uurtarief verschuldigd.
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel4.3
  - number: '5.1'
    text: |-
