    text: een vissersvaartuig met een lengte in zijn totaliteit van minder dan 15 meter een tarief verschuldigd van € 293;
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel2.2
  - number: 2.2.2.b
    text: een pleziervaartuig met een lengte van minder dan 24 meter een tarief verschuldigd van € 254.
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel2.2
  - number: '2.3'
    text: |-
      Voor de meting van een schip, ten behoeve van de afgifte van een bijzondere meetbrief, speciaal ingericht voor
      gebruik bij de vaart door het Suezkanaal, is een tarief verschuldigd van € 139 per uur.
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel2.3
  - number: '2.4'
    text: |-
      Voor onderzoek ten behoeve van de afgifte van een inhoudsverklaring voor gebruik bij de vaart door het Panamakanaal
      (*PC/UMS Documentation of Total Volume*) is een tarief verschuldigd van € 391.
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel2.4
  - number: '2.5'
    text: |-
      Voor controlewerkzaamheden ten behoeve van de afgifte van een Internationale Meetbrief (1969) of een bijzondere
      meetbrief is, indien bij het omvlaggen van een schip de buitenlandse meetgegevens worden overgenomen of indien een
      schip door een daartoe bevoegde buitenlandse autoriteit ingevolge [artikel 8 van de Meetbrievenwet 1981][ref1] of
      de [Regeling metingsvoorschriften][ref2] is gemeten of hermeten, een tarief verschuldigd van € 997.


      [ref1]: https://wetten.overheid.nl/BWBR0003378#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006017
