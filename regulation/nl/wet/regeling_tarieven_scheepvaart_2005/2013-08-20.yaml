  - number: 2.6.2
    text: |-
      Voor het aanbrengen van een wijziging in een Internationale Meetbrief (1969), een bijzondere meetbrief of een
      inhoudsverklaring als bedoeld in [artikel 2.4][ref1], zonder dat hiervoor een meting of hermeting plaatsvindt, is
      een tarief verschuldigd van € 49.


      [ref1]: https://wetten.overheid.nl/BWBR0017739#Artikel2
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel2.6
