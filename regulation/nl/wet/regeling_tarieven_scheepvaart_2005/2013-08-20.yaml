preamble:
  text: |-
    Gelet op artikel 16, eerste en tweede lid, van richtlijn nr. 95/21/EG van de Raad van de Europese Unie van 19
    juni 1995, betreffende havenstaatcontrole (PbEG L 157), de artikelen 12, derde lid, 12a, tweede lid, 12b, eerste
    lid, 12c, derde lid, 26, derde lid, en 26a, tweede lid, van de Binnenschepenwet, artikel 5, derde lid, van de
    Loodsenwet, de artikelen 4, tweede lid, 17, eerste lid, en 21, eerste lid, van de Meetbrievenwet 1981, artikel
    14, derde lid, van de Wet havenstaatcontrole, de artikelen 2, derde lid, en 10 van de Wet nationaliteit zeeschepen
    in rompbevrachting, artikel 9 van de Wet vaartijden en bemanningssterkte binnenvaart, artikel 311a, vierde lid,
    van het Wetboek van Koophandel, artikel 56 van de Wet vervoer binnenvaart, artikel 49, tweede lid, van de Wet
    vervoer gevaarlijke stoffen, de artikelen 6, derde lid, en 6a, derde lid, van de Zeebrievenwet, artikel 37,
    derde lid, van de Maatregel teboekgestelde schepen 1992, artikel 62, aanhef en onderdelen c, d, h en j, van de
    Zeevaartbemanningswet, artikel 3 van het Besluit aangroeiwerende verfsystemen zeeschepen, de artikelen 15 en 18
    van het Binnenschepenbesluit, artikel 2 van het besluit van 28 februari 1976, ter uitvoering van artikel 29 van de
    Wet aansprakelijkheid olietankschepen (Stb. 137), de artikelen 4, tweede lid, en 5, tweede tot en met zesde lid,
    van het Besluit voorkoming olieverontreiniging door schepen, artikel 11, derde lid, van het Besluit voorkoming
    verontreiniging door met schepen in bulk vervoerde schadelijke vloeistoffen en artikel 3.07 van het Reglement
    Rijnpatenten 1998;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#ArtikelAanhef
articles:
  - number: 1.1.1
    text: |-
      In deze paragraaf zijn de begripsbepalingen van [artikel 1 van het Metingsbesluit Binnenvaartuigen 1978][ref1]
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003246#Artikel1
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0003246
        artikel: '1'
  - number: 1.1.2
    text: 'In deze paragraaf wordt voorts verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.1
  - number: 1.1.2.a
    text: |-
      meting: werkzaamheden ten behoeve van de afgifte van een meetbrief voor een schip, waarvoor niet eerder een
      Nederlandse meetbrief is afgegeven;
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.1
  - number: 1.1.2.b
    text: |-
      hermeting: werkzaamheden ten behoeve van de afgifte van een meetbrief voor een schip dat een verbouwing heeft
      ondergaan die van invloed is geweest op de ledige diepgang van het schip, en waarvoor eerder een Nederlandse
      meetbrief is afgegeven;
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.1
  - number: 1.1.2.c
    text: |-
      controlemeting: werkzaamheden ten behoeve van de verlenging van de geldigheidsduur van een meetbrief voor een schip
      dat sedert de afgifte van de meetbrief geen verbouwing heeft ondergaan die van invloed is geweest op de ledige
      diepgang van het schip;
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.1
  - number: 1.1.2.d
    text: 'ponton: blokvormig schip zonder mogelijkheid om benedendeks lading te vervoeren;'
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.1
  - number: 1.1.2.e
    text: 'zusterschepen: schepen die volgens dezelfde bouwtekening zijn gebouwd.'
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.1
  - number: 1.2.1
    text: |-
      Voor de meting of de hermeting van een schip of een ponton ten behoeve van de afgifte van een meetbrief, hieronder
      begrepen het aanbrengen van ijkmerken of ijkplaten, is een tarief verschuldigd, van € 1.374.
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.2
  - number: 1.2.2
    text: |-
      In afwijking van het eerste lid is voor de meting of de hermeting van een schip dat niet bestemd is voor het
      vervoer van goederen een tarief verschuldigd van € 871.
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.2
  - number: 1.2.3
    text: Voor de controlemeting is een tarief verschuldigd van € 390.
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.2
  - number: 1.5.1
    text: |-
      Voor de afgifte van een meetbrief, zonder dat hiervoor een meting of hermeting plaatsvindt, is een tarief
      verschuldigd van € 148 en voor een verlenging van de meetbrief een tarief van € 148.
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.5
  - number: 1.5.2
    text: |-
      Voor het aanbrengen van een wijziging in een meetbrief, zonder dat hiervoor een meting of hermeting plaatsvindt, is
      een tarief verschuldigd van € 148.
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.5
  - number: '1.7'
    text: |-
      Indien de werkzaamheden ten behoeve van de afgifte van een meetbrief buiten toedoen van de Minister van
      Infrastructuur en Milieu of de daartoe door hem aangewezen natuurlijke personen of rechtspersonen, niet leiden tot
      afgifte van het desbetreffende document is een tarief verschuldigd van € 109 per manuur, indien de werkzaamheden
      niet volledig zijn uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.7
  - number: '1.8'
    text: |-
      Voor werkzaamheden voortvloeiende uit het bepaalde bij of krachtens de [Binnenvaartwet][ref1], en waarvoor niet op
      grond van een van de overige artikelen van deze paragraaf een tarief is vastgesteld, is een tarief verschuldigd van
      € 109 per manuur.


      [ref1]: https://wetten.overheid.nl/BWBR0023009
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.8
    references:
      - id: ref1
        bwb_id: BWBR0023009
  - number: '1.9'
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.9
  - number: 1.9.a
    text: |-
      certificaat van onderzoek: certificaat, bedoeld in [artikel 9 van de Binnenvaartwet][ref1] en in
      [artikel 1.03 van het Reglement onderzoek schepen op de Rijn 1995][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0007858#Artikel1
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.9
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0007858
        artikel: '1'
  - number: 1.9.b
    text: |-
      certificaat van goedkeuring: certificaat, bedoeld in [bijlage 1, B1, Rn. 10.282][ref1] en
      [bijlage 1, B2, Rn. 210.282, van de Regeling vervoer over de binnenwateren van gevaarlijke stoffen][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0010115
      [ref2]: https://wetten.overheid.nl/BWBR0010115
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.9
    references:
      - id: ref1
        bwb_id: BWBR0010115
      - id: ref2
        bwb_id: BWBR0010115
  - number: 1.9.c
    text: |-
      communautair certificaat: certificaat, bedoeld in [artikel 8, van het Binnenvaartbesluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025631#Artikel8
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.9
    references:
      - id: ref1
        bwb_id: BWBR0025631
        artikel: '8'
  - number: 1.9.d
    text: |-
      communautair aanvullend certificaat: certificaat, bedoeld in
      [artikel 9, eerste lid, van het Binnenvaartbesluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025631#Artikel9
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.9
    references:
      - id: ref1
        bwb_id: BWBR0025631
        artikel: '9'
  - number: 1.9.e
    text: |-
      uitgebreide proefvaart: beproeving tijdens de vaart teneinde aan te tonen dat wordt voldaan aan de gestelde eisen
      die niet bij een stilliggend schip zijn vast te stellen;
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.9
  - number: 1.9.f
    text: |-
      beperkte proefvaart: beproeving tijdens een kortdurende vaart teneinde aan te tonen dat wordt voldaan aan eisen die
      worden gesteld aan een stuurinrichting, dan wel aan de maximaal toelaatbare geluidsniveaus;
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.9
  - number: 1.9.g
    text: |-
      verklaring minimumbemanning: verklaring, bedoeld in
      [artikel 23.09, tweede lid, van het Reglement onderzoek schepen op de Rijn 1995][ref1] en in
      [artikel 5.7, tweede lid, van de Binnenvaartregeling][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0025958#Artikel5
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.9
    references:
      - id: ref1
        bwb_id: BWBR0007858
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0025958
        artikel: '5'
  - number: 1.10.1
    text: |-
      Voor de afgifte of wijziging van in deze paragraaf genoemde certificaten of verklaringen is een tarief verschuldigd
      van € 96.
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.10
  - number: 1.10.2
    text: |-
      Voor de afgifte van een ontheffing als bedoeld in de [artikelen 13, tweede lid][ref1], en
      [22, vijfde lid, van de Binnenvaartwet][ref2], waarbij geen inspectie plaatsvindt, is een tarief verschuldigd van
      € 96, per certificaat, bijlage bij een certificaat of verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0023009#Artikel22
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.10
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0023009
        artikel: '22'
  - number: 1.10.3
    text: |-
      Voor de afgifte van een verklaring minimumbemanning is een tarief verschuldigd van € 96. Dit tarief wordt niet in
      rekening gebracht indien gelijktijdig een inspectie aan boord van het schip plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.10
  - number: '1.11'
    text: |-
      Voor de afgifte van een duplicaat, uittreksel, of gewaarmerkt afschrift van een certificaat van onderzoek, een
      certificaat van goedkeuring, een communautair certificaat, een communautair aanvullend certificaat of een bijlage
      bij een certificaat of verklaring is een tarief verschuldigd van € 115.
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.11
  - number: '1.12'
    text: |-
      Aan degene die ingevolge [artikel 14, eerste lid, van de Binnenvaartwet][ref1] is aangewezen het onderzoek ten
      behoeve van de certificering van binnenschepen, bedoeld in [artikel 9, eerste lid, van de Binnenvaartwet][ref2],
      te verrichten, is een vergoeding verschuldigd op basis van een tarief waarvan hijzelf de hoogte en de wijze van
      betalen vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0023009#Artikel9
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.12
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0023009
        artikel: '9'
  - number: 1.13.1
    text: |-
      Voor het onderzoek nodig voor de eerste of hernieuwde afgifte van een certificaat van onderzoek, een communautair
      certificaat, een communautair aanvullend certificaat of een certificaat van goedkeuring ten behoeve van bestaande
      schepen, dan wel voor het wijzigen van die certificaten ten behoeve van deze schepen is een tarief verschuldigd dat
      wordt berekend aan de hand van het aantal inspecties aan boord van het schip.
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.13
  - number: 1.13.2
    text: 'Voor de inspecties aan boord van het schip zijn de volgende tarieven verschuldigd:'
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.13
  - number: 1.13.2.a
    text: voor de eerste afgifte of vernieuwing van de geldigheidsduur van een certificaat € 565;
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.13
  - number: 1.13.2.b
    text: voor nieuw gebouwde schepen € 565;
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.13
  - number: 1.13.2.c
    text: voor open rondvaartboten, geldt in afwijking van onderdeel a, een tarief van € 282.
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.13
  - number: 1.13.3
    text: |-
      Indien bij de inspecties aan boord van het schip gelijktijdig een elektrotechnisch onderzoek en een
      scheepsbouwkundig onderzoek plaatsvindt, worden deze onderzoeken als afzonderlijke inspecties aangemerkt.
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.13
  - number: 1.13.4
    text: |-
      Indien een inspectie aan boord van een schip tevens een proefvaart omvat, wordt het verschuldigde tarief voor die
      inspectie, ongeacht het aantal gelijktijdig uitgevoerde onderzoeken, bedoeld in het derde lid, verhoogd met € 565
      voor bestaande schepen en € 723 voor nieuw gebouwde schepen.
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.13
  - number: 1.13.5
    text: |-
      Voor het afstempelen plaatjes, het opnieuw verzegelen van lensafsluiters en andere werkzaamheden op verzoek is een
      tarief verschuldigd van € 109 per manuur.
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.13
  - number: 1.13.6
    text: |-
      Indien een inspectie aan boord van het schip niet kan plaatsvinden op de geplande tijd en plaats, doordat het schip
      of de eigenaar van het schip of zijn vertegenwoordiger niet aanwezig is, is, indien de inspectie geheel vervalt,
      een tarief van € 245 verschuldigd.
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.13
  - number: 1.14.1
    text: |-
      Voor een onderzoek voor keuring van onderdelen of uitrustingsstukken waarvoor de goedkeuring van de Minister
      van Infrastructuur en Milieu of de Commissie van Deskundigen voor de Rijnvaart is voorgeschreven, is een tarief
      verschuldigd van € 375.
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.14
  - number: 1.14.2
    text: |-
      Voor het aanwijzen van bedrijven om namens de Minister van Infrastructuur en Milieu installaties en onderdelen van
      objecten te mogen keuren is een tarief verschuldigd van € 110.
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.14
  - number: '1.15'
    text: |-
      Voor het keuren van een tekening, een stabiliteitsberekening of een lekberekening is een tarief verschuldigd van
      € 282.
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.15
  - number: '1.16'
    text: |-
      Alvorens een onderzoek of keuring als bedoeld in deze paragraaf wordt aangevangen, dient vooruitbetaling van het
      verschuldigde tarief plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.16
  - number: '1.17'
    text: |-
      Voor de behandeling van een aanvraag van een ontheffing van de verplichting tot het voorzien zijn van een geldig
      vaarbewijs, als bedoeld in [artikel 31, tweede lid, van de Binnenvaartwet][ref1], is een tarief verschuldigd van
      € 194.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel31
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.17
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '31'
  - number: '1.18'
    text: |-
      Voor de controle op de inbouw en het functioneren van een radarinstallatie
      of een bochtaanwijzer, alsmede voor de afgifte van de verklaring, bedoeld in
      [artikel 9 in bijlage 3 van het Besluit radar- en bochtaanwijzerapparatuur][ref1], is een tarief verschuldigd van:


      [ref1]: https://wetten.overheid.nl/BWBR0004653
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.18
    references:
      - id: ref1
        bwb_id: BWBR0004653
  - number: 1.18.a
    text: € 194 voor periodieke inspectie en afgifte van een verklaring;
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.18
  - number: 1.18.b
    text: € 141 voor herinspectie als gevolg van geconstateerde gebreken.
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.18
  - number: 1.19.1
    text: Voor de afgifte van een Rijnpatent is een tarief verschuldigd van € 49,75.
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.19
  - number: 1.19.2
    text: Voor uitbreiden, vervangen of omruilen van een Rijnpatent is een tarief verschuldigd van € 24,90.
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.19
  - number: 1.20.1
    text: |-
      Voor het examen voor het Schippersdiploma Rijnvaart ter verkrijging van het Rijnpatent is een tarief verschuldigd
      van € 81,00 per onderdeel voor de schriftelijke examens en € 114,10 per onderdeel voor de mondelinge examens.
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.20
  - number: 1.20.2
    text: Voor het herexamen voor het diploma, bedoeld in het eerste lid, is het eerste lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.20
  - number: 1.20.3
    text: |-
      Voor het afnemen van het mondelinge examen ter verkrijging van het Sportpatent bedoeld in
      [artikel 7.03, tweede lid, onderdeel c, van het Reglement betreffende het scheepvaartpersoneel op de Rijn][ref1] is
      aan de exameninstantie een tarief verschuldigd van € 114,10.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel7
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.20
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '7'
  - number: 1.21.1
    text: |-
      Voor de afgifte van een dienstboekje als bedoeld in [artikel 5.11, eerste lid, van de Binnenvaartregeling][ref1] en
      [artikel 3.06, eerste lid, van het Rsp][ref2] is een tarief verschuldigd van € 42,60.


      [ref1]: https://wetten.overheid.nl/BWBR0025958#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel3
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.21
    references:
      - id: ref1
        bwb_id: BWBR0025958
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0030215
        artikel: '3'
  - number: 1.21.2
    text: |-
      Voor het jaarlijks afstempelen van een dienstboekje of een verklaring van vaartijdtelling uit het dienstboekje is
      een tarief verschuldigd van € 16,04.
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.21
  - number: 1.22.1
    text: |-
      Voor de afgifte van een vaartijdenboek als bedoeld in [artikel 5.12, eerste lid, van de Binnenvaartregeling][ref1]
      en [artikel 23.08, eerste lid, van het Reglement onderzoek schepen op de Rijn 1995][ref2], is een tarief
      verschuldigd van € 47,95.


      [ref1]: https://wetten.overheid.nl/BWBR0025958#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007858#Artikel23
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.22
    references:
      - id: ref1
        bwb_id: BWBR0025958
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0007858
        artikel: '23'
  - number: 1.22.2
    text: |-
      Voor de afgifte van een verklaring bij het vaartijdenboek als bedoeld
      in [artikel 5.12, tweede lid, van de Binnenvaartregeling][ref1] en
      [artikel 23.08, vierde lid, van het Reglement onderzoek schepen op de Rijn 1995][ref2], is een tarief verschuldigd
      van € 16,04.


      [ref1]: https://wetten.overheid.nl/BWBR0025958#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007858#Artikel23
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel1.22
    references:
      - id: ref1
