      - id: ref2
        bwb_id: BWBR0017718
        artikel: '23'
  - number: '5.4'
    text: |-
      Deze regeling treedt in werking met ingang van 1 januari 2005, met uitzondering van [artikel 3.2][ref1]. dat
      inwerking treedt op het tijdstip waarop de [Wet laden en lossen zeeschepen][ref2] in werking treedt.


