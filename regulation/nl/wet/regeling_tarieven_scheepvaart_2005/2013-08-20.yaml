        bwb_id: BWBR0017739
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '2.7'
    text: |-
      Indien de eigenaar een verzoek indient voor de meting of hermeting van twee of meer van zijn schepen, niet zijnde
      zusterschepen, en deze metingen gelijktijdig op één locatie kunnen worden uitgevoerd voor één rekening, is voor het
      eerste schip een tarief als bedoeld in de deze paragraaf verschuldigd en voor de volgende schepen een tarief van
      € 109 per manuur verschuldigd.
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel2.7
  - number: '2.8'
    text: |-
      Indien de werkzaamheden ten behoeve van de afgifte van documenten als bedoeld in deze paragraaf, buiten toedoen
      van de ambtenaren van de Inspectie Verkeer en Waterstaat, niet leiden tot afgifte van dat document, is het volgende
      tarief verschuldigd:
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel2.8
  - number: 2.8.a
    text: indien de werkzaamheden niet volledig zijn uitgevoerd € 109 per manuur;
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel2.8
  - number: 2.8.b
    text: |-
      indien de werkzaamheden volledig zijn uitgevoerd, het tarief dat is vastgesteld voor werkzaamheden of meting ten
      behoeve van de afgifte van het document.
    url: https://wetten.overheid.nl/BWBR0017739/2013-08-20#Artikel2.8
  - number: '2.9'
    text: |-
      Voor werkzaamheden voortvloeiende uit het bepaalde bij of krachtens de [Meetbrievenwet 1981][ref1], en waarvoor
      niet op grond van een van de overige artikelen van deze paragraaf een tarief is vastgesteld, is een tarief
      verschuldigd van € 109 per manuur.


