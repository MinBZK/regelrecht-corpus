      vaarbevoegdheidsbewijs, bedoeld in [artikel 25 van de Wet zeevarenden][ref4], is een tarief verschuldigd van € 166.

      3 Voor de afgifte van een erkenning van een vaarbevoegdheidsbewijs of bekwaamheidsbewijs als bedoeld in artikel 9a,
      eerste lid, van het Besluit zeevarenden handelsvaart en zeevaart is een tarief verschuldigd van € 125.


