        bwb_id: BWBR0023009
  - number: '1.9'
    text: |-
      In deze paragraaf wordt verstaan onder:

      a. certificaat van onderzoek: certificaat, bedoeld in [artikel 9 van de Binnenvaartwet][ref1] en in
      [artikel 1.03 van het Reglement onderzoek schepen op de Rijn 1995][ref2];

      b. certificaat van goedkeuring: certificaat, bedoeld in [bijlage 1, B1, Rn. 10.282][ref3] en
      [bijlage 1, B2, Rn. 210.282, van de Regeling vervoer over de binnenwateren van gevaarlijke stoffen][ref4];

      c. communautair certificaat: certificaat, bedoeld in [artikel 8, van het Binnenvaartbesluit][ref5];

      d. communautair aanvullend certificaat: certificaat, bedoeld in
      [artikel 9, eerste lid, van het Binnenvaartbesluit][ref6];

      e. proefvaart voor nieuw gebouwde schepen: beproeving tijdens de vaart teneinde aan te tonen dat wordt voldaan aan
      de gestelde eisen die niet bij een stilliggend schip zijn vast te stellen;

      f. proefvaart voor bestaande schepen: beproeving tijdens een kortdurende vaart teneinde aan te tonen dat wordt
      voldaan aan eisen die worden gesteld aan een stuurinrichting, dan wel aan de maximaal toelaatbare geluidsniveaus;

      g. verklaring minimumbemanning: in
      [artikel 3.14, tweede lid, van het Reglement betreffende het scheepvaartpersoneel][ref7] op de Rijn bedoelde
      vermelding alsmede de in [artikel 5.7, tweede lid, van de Binnenvaartregeling][ref8] bedoelde verklaring.


