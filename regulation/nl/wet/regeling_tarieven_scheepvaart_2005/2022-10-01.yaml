      1 Indien onderzoeken geheel of gedeeltelijk buiten Nederland worden uitgevoerd, is voor de reistijd buiten
      Nederland en voor de eventuele wachttijd tijdens het verblijf buiten Nederland een aanvullend tarief per manuur
      verschuldigd van € 154 voor onderzoeken bedoeld in [§ 2.3][ref1] en [§ 2.4][ref2].

      2 Bij de berekening van de reistijd buiten Nederland als bedoeld in het eerste lid en eventuele wachttijd geldt een
      maximum van acht uren per etmaal.

      3 De reis- en verblijfkosten van de ambtenaar, ten behoeve van de in het eerste lid bedoelde onderzoeken buiten
      Nederland, komen voor rekening van de aanvrager. Deze kosten worden afzonderlijk in rekening gebracht.

      4 In afwijking van het eerste lid, is voor onderzoeken bedoeld in [§ 1.2][ref3] een aanvullende tarief niet
      verschuldigd, indien het onderzoek plaatsvindt in België of Duitsland, binnen een afstand van 50 km van de
      Nederlands-Belgische grens of Nederlands-Duitse grens.

      5 Indien onderzoek ten behoeve van de afgifte van een certificaat, vergunning, verklaring of document als bedoeld
      in deze regeling, buiten toedoen van de ambtenaren van de Inspectie Leefomgeving en Transport niet volledig is
      uitgevoerd en niet leidt tot de afgifte van dat document, is het geldende uurtarief verschuldigd.


