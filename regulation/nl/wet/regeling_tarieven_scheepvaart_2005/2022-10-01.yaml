      [artikel 16, eerste lid, onderdeel c, van het Besluit voorkoming verontreiniging van door schepen][ref1] is een
      tarief verschuldigd van € 187. Dit tarief is ook van toepassing op schepen < 400 GT die een verklaring als bedoeld
      in [artikel 12a van de Regeling voorkoming verontreiniging door schepen][ref2] hebben aangevraagd.

      2 Voor de afgifte of tussentijdse vervanging van een Internationaal certificaat van voorkoming van verontreiniging
      door sanitair afval, als bedoeld in voorschrift 5 van Bijlage IV van het MARPOL-verdrag is een tarief verschuldigd
      van € 267. Dit tarief is ook van toepassing in het geval van de afgifte of tussentijdse vervanging van een
      vrijwillige verklaring.


