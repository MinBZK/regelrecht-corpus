      1 Voor het onderzoek aan boord nodig voor de afgifte of tussentijdse aanpassing van een AFS-certificaat als bedoeld
      in artikel 2, zevende lid, van verordening (EG) nr. 782/2003 van het Europees Parlement en de Raad van de Europese
      Unie van 14 april 2003 houdende een verbod op organische tinverbindingen op schepen (PbEU L115), is een tarief
      verschuldigd van € 195.

      2 Voor de afgifte of tussentijdse vervanging van een AFS-certificaat is een tarief verschuldigd van € 267.
    url: https://wetten.overheid.nl/BWBR0017739/2022-10-01#Artikel2.20
  - number: '2.21'
