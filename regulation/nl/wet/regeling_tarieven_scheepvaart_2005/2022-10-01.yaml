      1 Voor de afgifte van een vaarbevoegdheidsbewijs als bedoeld in
      [artikel 18, eerste lid, van de Wet zeevarenden][ref1], zijn de volgende tarieven verschuldigd:

      a. € 121 voor elk vaarbevoegdheidsbewijs of een duplicaat vaarbevoegdheidsbewijs, waarop ten minste één van de
      volgende functies voorkomt:

      1°. kapitein;

      2°. eerste stuurman;

      3°. wachtstuurman;

      4°. hoofdwerktuigkundige;

      5°. tweede werktuigkundige;

      6°. wachtwerktuigkundige;

      7°. eerste maritiem officier;

      8°. maritiem officier;

      9°. officier elektrotechniek;

      10°. schipper zeevisvaart;

      11°. plaatsvervangend schipper zeevisvaart;

      12°. stuurman-werktuigkundige zeevisvaart; of

      13°. radio-operator;

      b. € 81 voor elk vaarbevoegdheidsbewijs of duplicaat van een vaarbevoegdheidsbewijs waarop de in onderdeel a
      genoemde functies niet voorkomen.

