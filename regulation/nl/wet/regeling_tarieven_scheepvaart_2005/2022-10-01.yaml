      Voor werkzaamheden voortvloeiende uit het bepaalde bij of krachtens de
      [Wet nationaliteit zeeschepen in rompbevrachting][ref1], de [Zeebrievenwet][ref2] of de
      [Maatregel teboekgestelde schepen 1992][ref3], en waarvoor niet op grond van een van de overige artikelen van deze
      paragraaf een tarief is vastgesteld, is een tarief verschuldigd van € 132 per manuur.


      [ref1]: https://wetten.overheid.nl/BWBR0005681
      [ref2]: https://wetten.overheid.nl/BWBR0001933
      [ref3]: https://wetten.overheid.nl/BWBR0005260
