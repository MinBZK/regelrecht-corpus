      1 Voor het erkennen van een opleidingsinstituut als bevoegd tot het geven
      van cursussen en opfriscursussen en het afnemen van examens, als bedoeld in
      [artikel 4a.05 van het Reglement betreffende het scheepvaartpersoneel op de Rijn][ref1], is aan het Centraal
      Bureau Rijvaardigheidsbewijzen een door haar, overeenkomstig [artikel 4am van de Wegenverkeerswet 1994][ref2] en
      [artikel 17, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref3], vastgesteld tarief verschuldigd.

      2 Voor het registreren van een door een erkend opleidingsinstituut aangemelde cursist is aan het CBR een tarief
      verschuldigd dat is vastgesteld door het CBR overeenkomstig [artikel 4am van de Wegenverkeerswet 1994][ref4] en
      [artikel 17, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref5].

      3 Voor het afgeven van een verklaring van deskundigheid aangaande het gebruik van vloeibaar aardgas als brandstof
      als bedoeld in [artikel 4a.02 van het Reglement betreffende het scheepvaartpersoneel op de Rijn][ref6] is een
      tarief verschuldigd dat is vastgesteld door het CBR overeenkomstig [artikel 4am van de Wegenverkeerswet 1994][ref7]
      en [artikel 17, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref8].

      4 Voor het verlengen van de geldigheidsduur van een verklaring van deskundigheid
      aangaande het gebruik van vloeibaar aardgas als brandstof, als bedoeld in
      [artikel 4a.04 van het Reglement betreffende het scheepvaartpersoneel op de Rijn][ref9], is een tarief
      verschuldigd dat is vastgesteld door het CBR overeenkomstig [artikel 4am van de Wegenverkeerswet 1994][ref10] en
      [artikel 17, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref11].


