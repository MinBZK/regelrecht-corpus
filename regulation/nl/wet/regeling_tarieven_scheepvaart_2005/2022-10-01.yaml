  - number: '1.10'
    text: |-
      1 Voor de afgifte of wijziging van in deze paragraaf genoemde certificaten of verklaringen is een tarief
      verschuldigd van € 117.

      2 Voor de afgifte van een ontheffing als bedoeld in de [artikelen 13, tweede lid][ref1], en
      [22, vijfde lid, van de Binnenvaartwet][ref2], waarbij geen inspectie plaatsvindt, is een tarief verschuldigd van
      € 117, per certificaat, bijlage bij een certificaat of verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0023009#Artikel22
