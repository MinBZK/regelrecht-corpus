      Voor de afgifte, tussentijdse controle of verlenging van het internationaal certificaat van voorkoming van
      verontreiniging voor vervoer van schadelijke vloeistoffen in bulk, als bedoeld in voorschrift 9 van Bijlage II van
      het MARPOL-verdrag is een tarief verschuldigd van € 267.
