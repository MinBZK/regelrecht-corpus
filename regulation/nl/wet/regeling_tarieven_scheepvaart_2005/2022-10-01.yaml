      1 In deze paragraaf zijn de begripsbepalingen van [artikel 1 van de Meetbrievenwet 1981][ref1] en
      [artikel 1 van de Regeling metingsvoorschriften][ref2] van toepassing.

      2 In deze paragraaf wordt voorts verstaan onder:

      a. meting: werkzaamheden ten behoeve van de afgifte van:

      1°. een Internationale Meetbrief (1969);

      2°. een bijzondere meetbrief voor een schip, waarvoor niet eerder een Internationale Meetbrief (1969) of bijzondere
      meetbrief is afgegeven;

      b. hermeting: werkzaamheden ten behoeve van de afgifte van:

      1°. een Internationale Meetbrief (1969) voor een schip, waarvoor reeds eerder een Internationale Meetbrief (1969),
      bijzondere meetbrief of een meetbrief als bedoeld in het Verdrag van Oslo 1947, is afgegeven;

      2°. een bijzondere meetbrief voor een schip, waarvoor reeds eerder een Internationale Meetbrief (1969), bijzondere
      meetbrief of een meetbrief als bedoeld in het Verdrag van Oslo 1947, is afgegeven;

      c. ponton: blokvormig schip zonder mogelijkheid om benedendeks lading te vervoeren;

      d. zusterschepen: schepen die volgens dezelfde bouwtekening zijn gebouwd


      [ref1]: https://wetten.overheid.nl/BWBR0003378#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017739/2022-10-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0003378
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006017
        artikel: '1'
  - number: '2.2'
    text: |-
      1 Voor de meting van een schip ten behoeve van de afgifte van een internationale Meetbrief (1969) is een tarief
      verschuldigd van € 167 per uur.

      2 In afwijking van het eerste lid is voor de meting van:

      a. een vissersvaartuig met een lengte in zijn totaliteit van minder dan 15 meter een tarief verschuldigd van € 353;

      b. een pleziervaartuig met een lengte van minder dan 24 meter een tarief verschuldigd van € 307.
    url: https://wetten.overheid.nl/BWBR0017739/2022-10-01#Artikel2.2
  - number: '2.3'
    text: |-
      Voor de meting van een schip, ten behoeve van de afgifte van een bijzondere meetbrief, speciaal ingericht voor
      gebruik bij de vaart door het Suezkanaal, is een tarief verschuldigd van € 167 per uur.
    url: https://wetten.overheid.nl/BWBR0017739/2022-10-01#Artikel2.3
  - number: '2.4'
    text: |-
      Voor onderzoek ten behoeve van de afgifte van een inhoudsverklaring voor gebruik bij de vaart door het Panamakanaal
      (*PC/UMS Documentation of Total Volume*) is een tarief verschuldigd van € 472.
    url: https://wetten.overheid.nl/BWBR0017739/2022-10-01#Artikel2.4
  - number: '2.5'
    text: |-
      Voor controlewerkzaamheden ten behoeve van de afgifte van een Internationale Meetbrief (1969) of een bijzondere
      meetbrief is, indien bij het omvlaggen van een schip de buitenlandse meetgegevens worden overgenomen of indien een
      schip door een daartoe bevoegde buitenlandse autoriteit ingevolge [artikel 8 van de Meetbrievenwet 1981][ref1] of
      de [Regeling metingsvoorschriften][ref2] is gemeten of hermeten, een tarief verschuldigd van € 1.203.


      [ref1]: https://wetten.overheid.nl/BWBR0003378#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006017
    url: https://wetten.overheid.nl/BWBR0017739/2022-10-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0003378
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0006017
  - number: '2.6'
    text: |-
      1 Voor de afgifte van een meetbrief of een bijzondere meetbrief is een het tarief verschuldigd van € 171.

      2 Voor het aanbrengen van een wijziging in een Internationale Meetbrief (1969), een bijzondere meetbrief of een
      inhoudsverklaring als bedoeld in [artikel 2.4][ref1], zonder dat hiervoor een meting of hermeting plaatsvindt, is
      een tarief verschuldigd van € 59.


      [ref1]: https://wetten.overheid.nl/BWBR0017739#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0017739/2022-10-01#Artikel2.6
    references:
