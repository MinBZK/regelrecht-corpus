        bwb_id: BWBR0017739
        artikel: '2.4'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '2.7'
    text: |-
      Indien de eigenaar een verzoek indient voor de meting of hermeting van twee of meer van zijn schepen, niet zijnde
      zusterschepen, en deze metingen gelijktijdig op één locatie kunnen worden uitgevoerd voor één rekening, is voor het
      eerste schip een tarief als bedoeld in de deze paragraaf verschuldigd en voor de volgende schepen een tarief van
      € 132 per manuur verschuldigd.
    url: https://wetten.overheid.nl/BWBR0017739/2022-10-01#Artikel2.7
  - number: '2.8'
    text: |-
      Indien de werkzaamheden ten behoeve van de afgifte van documenten als bedoeld in deze paragraaf, buiten toedoen van
      de ambtenaren van de Inspectie Leefomgeving en Transport, niet leiden tot afgifte van dat document, is het volgende
      tarief verschuldigd:

      a. indien de werkzaamheden niet volledig zijn uitgevoerd € 132 per manuur;

      b. indien de werkzaamheden volledig zijn uitgevoerd, het tarief dat is vastgesteld voor werkzaamheden of meting ten
      behoeve van de afgifte van het document.
    url: https://wetten.overheid.nl/BWBR0017739/2022-10-01#Artikel2.8
  - number: '2.9'
    text: |-
      Voor werkzaamheden voortvloeiende uit het bepaalde bij of krachtens de [Meetbrievenwet 1981][ref1], en waarvoor
      niet op grond van een van de overige artikelen van deze paragraaf een tarief is vastgesteld, is een tarief
      verschuldigd van € 132 per manuur.


      [ref1]: https://wetten.overheid.nl/BWBR0003378
    url: https://wetten.overheid.nl/BWBR0017739/2022-10-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0003378
  - number: '2.10'
    text: |-
      1 Voor de werkzaamheden ten behoeve van de inschrijving van een zeeschip in het rompbevrachtingsregister, bedoeld
      in [artikel 2, eerste lid, van de Wet nationaliteit zeeschepen in rompbevrachting][ref1], is de rompbevrachter een
      tarief verschuldigd van € 1.661.

      2 Voor het aanbrengen van een wijziging in de in het eerste lid bedoelde inschrijving, is de rompbevrachter een
      tarief verschuldigd van € 179.

      3 Voor de werkzaamheden ten behoeve van de afgifte van een gewaarmerkt uittreksel uit het rompbevrachtingsregister,
      bedoeld in het eerste lid, is de rompbevrachter een tarief verschuldigd van € 147.

      4 In afwijking van het tweede lid is de rompbevrachter voor het aanbrengen van een wijziging die betrekking heeft
      op de dagtekening of de tijdsduur van de rompbevrachtingsovereenkomst een tarief verschuldigd van € 510.

      5 Voor een bareboat-outverklaring, houdende de instemming van de Minister van Infrastructuur en Waterstaat met de
      inschrijving in een buitenlands rompbevrachtingsregister, is een vergoeding verschuldigd van € 171.


      [ref1]: https://wetten.overheid.nl/BWBR0005681#Artikel2
    url: https://wetten.overheid.nl/BWBR0017739/2022-10-01#Artikel2.10
    references:
