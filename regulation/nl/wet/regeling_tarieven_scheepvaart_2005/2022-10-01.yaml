      Een tarief is verschuldigd van:

      a. € 123 voor documenten van toelating als bedoeld in [artikel 5, tweede lid, van de Binnenvaartwet][ref1];

      b. € 464 voor de behandeling van een aanvraag van een bewijs van vakbekwaamheid als bedoeld in
      [artikel 6, eerste lid, van de Binnenvaartwet][ref2];

      c. € 198 voor de behandeling van een aanvraag van ontheffing van de eis van vakbekwaamheid als bedoeld in
      [artikel 6, vijfde lid, van de Binnenvaartwet][ref3];

      d. € 48 voor de behandeling van een aanvraag van een gewaarmerkt afschrift van documenten als bedoeld in de
      onderdelen a, b en c;

      e. een bedrag dat is vastgesteld door het CBR overeenkomstig [artikel 4am van de Wegenverkeerswet 1994][ref4]
      en [artikel 17, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref5] voor het afnemen van
      het schriftelijk examen ter verkrijging van het diploma ‘Ondernemer in de binnenvaart’, bedoeld in
      [artikel 2.2, onderdeel a, onder 1°, van de Binnenvaartregeling][ref6].


