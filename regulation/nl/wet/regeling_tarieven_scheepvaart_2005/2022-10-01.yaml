                    € 85





                    Viseren certificaten



                    € 85




                    Onderzoek hernieuwde afgifte


                    € 167





                    Onderzoek hernieuwde afgifte



                    € 167






      2 Voor het onderzoek van niet-geklasseerde schepen, nodig voor het viseren of de hernieuwde afgifte van een
      certificaat of een verklaring, is een tarief verschuldigd van € 412.

      3 Voor het onderzoek van niet-geklasseerde vissersvaartuigen nodig voor de eerste afgifte van een certificaat of
      een verklaring, is het tarief verschuldigd van: € 616 voor vissersvaartuigen kleiner dan 400 GT.
    url: https://wetten.overheid.nl/BWBR0017739/2022-10-01#Artikel2.17
