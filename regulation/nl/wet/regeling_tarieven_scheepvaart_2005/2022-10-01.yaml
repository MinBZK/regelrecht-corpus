articles:
  - number: '1.1'
    text: |-
      1 In deze paragraaf zijn de begripsbepalingen van [artikel 1 van het Metingsbesluit Binnenvaartuigen 1978][ref1]
      van toepassing.

      2 In deze paragraaf wordt voorts verstaan onder:

      a. meting: werkzaamheden ten behoeve van de afgifte van een meetbrief voor een schip, waarvoor niet eerder een
      Nederlandse meetbrief is afgegeven;

      b. hermeting: werkzaamheden ten behoeve van de afgifte van een meetbrief voor een schip dat een verbouwing heeft
      ondergaan die van invloed is geweest op de ledige diepgang van het schip, en waarvoor eerder een Nederlandse
      meetbrief is afgegeven;

      c. controlemeting: werkzaamheden ten behoeve van de verlenging van de geldigheidsduur van een meetbrief voor een
      schip dat sedert de afgifte van de meetbrief geen verbouwing heeft ondergaan die van invloed is geweest op de
      ledige diepgang van het schip;

      d. ponton: blokvormig schip zonder mogelijkheid om benedendeks lading te vervoeren;

      e. zusterschepen: schepen die volgens dezelfde bouwtekening zijn gebouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0003246#Artikel1
    url: https://wetten.overheid.nl/BWBR0017739/2022-10-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0003246
        artikel: '1'
  - number: 1.1a
    text: |-
      Deze regeling is mede gebaseerd op [artikel 34 van de Wet bestrijding maritieme ongevallen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037162#Artikel34
    url: https://wetten.overheid.nl/BWBR0017739/2022-10-01#Artikel1.1a
    references:
      - id: ref1
        bwb_id: BWBR0037162
        artikel: '34'
  - number: 1.1b
    text: |-
      1 De tarieven, bedoeld in deze regeling, zijn verschuldigd voor het verrichten van werkzaamheden door ambtenaren
      van de Inspectie Leefomgeving en Transport in Nederland of een andere verstrekker.

      2 In geval van een vast tarief wordt het bedrag binnen 30 kalenderdagen na verzending van het betalingsverzoek
      voldaan. Een aanvraag bij een andere verstrekker dan de ILT wordt pas in behandeling genomen wanneer het
      verschuldigde tarief is voldaan.

      3 In geval van een uurtarief worden de werkzaamheden periodiek gefactureerd op basis van het werkelijk aantal
      bestede uren. De te betalen vergoeding wordt achteraf vastgesteld door het aantal bestede uren te vermenigvuldigen
      met het uurtarief. De aanvrager voldoet elke ontvangen factuur binnen 30 kalenderdagen na verzending van het
      betalingsverzoek.
    url: https://wetten.overheid.nl/BWBR0017739/2022-10-01#Artikel1.1b
  - number: '1.2'
    text: |-
      1 Voor de meting of de hermeting van een schip of een ponton ten behoeve van de afgifte van een meetbrief,
      hieronder begrepen het aanbrengen van ijkmerken of ijkplaten, is een tarief verschuldigd, van € 1.659.

      2 In afwijking van het eerste lid is voor de meting of de hermeting van een schip dat niet bestemd is voor het
      vervoer van goederen een tarief verschuldigd van € 1.051.

      3 Voor de controlemeting is een tarief verschuldigd van € 471.
    url: https://wetten.overheid.nl/BWBR0017739/2022-10-01#Artikel1.2
  - number: '1.5'
    text: |-
      1 Voor de afgifte van een meetbrief, zonder dat hiervoor een meting of hermeting plaatsvindt, is een tarief
      verschuldigd van € 181 en voor een verlenging van de meetbrief een tarief van € 181.

      2 Voor het aanbrengen van een wijziging in een meetbrief, zonder dat hiervoor een meting of hermeting plaatsvindt,
      is een tarief verschuldigd van € 181.
    url: https://wetten.overheid.nl/BWBR0017739/2022-10-01#Artikel1.5
  - number: '1.7'
    text: |-
      Indien de werkzaamheden ten behoeve van de afgifte van een meetbrief buiten toedoen van de Minister van
      Infrastructuur en Waterstaat of de daartoe door hem aangewezen natuurlijke personen of rechtspersonen, niet
      leiden tot afgifte van het desbetreffende document is een tarief verschuldigd van € 132 per manuur, indien de
      werkzaamheden niet volledig zijn uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0017739/2022-10-01#Artikel1.7
  - number: '1.8'
    text: |-
      Voor werkzaamheden voortvloeiende uit het bepaalde bij of krachtens de [Binnenvaartwet][ref1], en waarvoor niet op
      grond van een van de overige artikelen van deze paragraaf een tarief is vastgesteld, is een tarief verschuldigd van
      € 132 per manuur.


      [ref1]: https://wetten.overheid.nl/BWBR0023009
    url: https://wetten.overheid.nl/BWBR0017739/2022-10-01#Artikel1.8
    references:
