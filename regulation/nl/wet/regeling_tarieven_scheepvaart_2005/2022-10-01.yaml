      De kosten van het geneeskundig onderzoek van de individuele aanvrager van een vaarbewijs, bedoeld in
      [artikel 28, eerste en derde lid, van de Binnenvaartwet][ref1], of van de individuele aanvrager van een
      rijnpatent, bedoeld in de [artikelen 7.01, derde lid, onderdeel a][ref2], [7.02, derde lid, onderdeel a][ref3],
      [7.03, tweede lid, onderdeel a][ref4], en [artikel 7.17, eerste lid, van het Rsp][ref5], bedragen:

      a. van de arts: ten hoogste € 154, exclusief BTW;

      b. van de deskundige: ten hoogste € 154, exclusief BTW, indien een fysiek onderzoek plaatsvindt en ten hoogste
      € 101, exclusief BTW bij een schriftelijke beoordeling.


