  - number: '2.15'
    text: |-
      In deze paragraaf wordt verstaan onder:

      a. MARPOL-verdrag: het op 2 november 1973 te Londen tot stand gekomen Internationaal Verdrag te voorkoming van
      verontreiniging door schepen, met Protocollen en Bijlagen met Aanhangsels (Trb. 1978, 188);

      b. verklaring: de verklaring als bedoeld in
      [artikel 15, tweede lid, van het Besluit voorkoming verontreiniging door schepen][ref1];

      c. certificaat: Internationaal certificaat van voorkoming van verontreiniging door olie, als bedoeld in voorschrift
      7 van bijlage I van het MARPOL-verdrag;

      d. Ballastwaterverdrag: het op 13 februari 2004 te Londen tot stand gekomen Internationaal Verdrag voor de controle
      en het beheer van ballastwater en sedimenten van schepen (Trb. 2005, 44).


      [ref1]: https://wetten.overheid.nl/BWBR0020762#Artikel15
    url: https://wetten.overheid.nl/BWBR0017739/2022-10-01#Artikel2.15
