        artikel: '9'
  - number: '1.13'
    text: |-
      1 Voor het onderzoek nodig voor de eerste of hernieuwde afgifte van een certificaat van onderzoek, een communautair
      certificaat, een communautair aanvullend certificaat of een certificaat van goedkeuring ten behoeve van bestaande
      schepen, dan wel voor het wijzigen van die certificaten ten behoeve van deze schepen is een tarief verschuldigd dat
      wordt berekend aan de hand van het aantal inspecties aan boord van het schip.

      2 Indien bij de inspecties aan boord van het schip gelijktijdig een elektrotechnisch onderzoek en een
      scheepsbouwkundig onderzoek plaatsvindt, worden deze onderzoeken als afzonderlijke inspecties aangemerkt.

      3 Voor het afstempelen plaatjes, het opnieuw verzegelen van lensafsluiters en andere werkzaamheden op verzoek is
      een tarief verschuldigd van € 132 per manuur.

      4 Indien een inspectie aan boord van het schip niet kan plaatsvinden op de geplande tijd en plaats, doordat het
      schip of de eigenaar van het schip of zijn vertegenwoordiger niet aanwezig is, is, indien de inspectie geheel
      vervalt, een tarief van € 297 verschuldigd.
    url: https://wetten.overheid.nl/BWBR0017739/2022-10-01#Artikel1.13
  - number: '1.14'
    text: |-
      1 Voor een onderzoek voor keuring van onderdelen of uitrustingsstukken waarvoor de goedkeuring van de Minister van
      Infrastructuur en Waterstaat of de Commissie van Deskundigen voor de Rijnvaart is voorgeschreven, is een tarief
      verschuldigd van € 452.

      2 Voor het aanwijzen van bedrijven om namens de Minister van Infrastructuur en Waterstaat installaties en
      onderdelen van objecten te mogen keuren is een tarief verschuldigd van € 133.
    url: https://wetten.overheid.nl/BWBR0017739/2022-10-01#Artikel1.14
