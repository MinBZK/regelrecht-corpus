preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is regels te stellen ter uitvoering van de Verordening
    (EU) nr. 211/2011 van het Europees Parlement en de Raad van 16 februari 2011 over het burgerinitiatief (PbEU 2011,
    L 65);

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0033716/2013-11-09#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder: - *Onze Minister:* Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - *Verordening:* Verordening (EU) nr. 211/2011 van het Europees Parlement en de Raad van 16 februari 2011 over het
      burgerinitiatief (PbEU 2011, L 65).
    url: https://wetten.overheid.nl/BWBR0033716/2013-11-09#Artikel1
  - number: '2'
    text: 'Onze Minister is bevoegd:'
    url: https://wetten.overheid.nl/BWBR0033716/2013-11-09#Artikel2
  - number: 2.a
    text: certificaten als bedoeld in artikel 6, derde lid, van de Verordening af te geven;
    url: https://wetten.overheid.nl/BWBR0033716/2013-11-09#Artikel2
  - number: 2.b
    text: de verificatie van de steunbetuigingen, bedoeld in artikel 8, tweede lid, van de Verordening, te coördineren;
    url: https://wetten.overheid.nl/BWBR0033716/2013-11-09#Artikel2
  - number: 2.c
    text: certificaten als bedoeld in artikel 8, tweede lid, van de Verordening af te geven.
    url: https://wetten.overheid.nl/BWBR0033716/2013-11-09#Artikel2
  - number: '3'
    text: |-
      Bij ministeriële regeling wordt bepaald welke gegevens en bescheiden in ieder geval bij een aanvraag voor een
      certificaat als bedoeld in artikel 6, derde lid, van de Verordening worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0033716/2013-11-09#Artikel3
  - number: '4.1'
    text: |-
      De aanvrager draagt er zorg voor dat door Onze Minister aangewezen ambtenaren ten behoeve van het beoordelen van
      de aanvraag voor een certificaat als bedoeld in artikel 6, derde lid, van de Verordening, met medeneming van de
      benodigde apparatuur, de plaats kunnen betreden waar het onlinesysteem, bedoeld in artikel 6 van de Verordening,
      zich bevindt en ter plaatse inzage kunnen krijgen in het onlinesysteem.
    url: https://wetten.overheid.nl/BWBR0033716/2013-11-09#Artikel4
  - number: '4.2'
    text: |-
      De ambtenaren, bedoeld in het eerste lid, kunnen zich laten vergezellen door personen die daartoe door hen zijn
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0033716/2013-11-09#Artikel4
  - number: '4.3'
    text: |-
      Indien de plaats en het onlinesysteem, bedoeld in het eerste lid, niet overeenkomstig dit artikel kunnen worden
      betreden respectievelijk ingezien, kan de aanvraag worden afgewezen.
    url: https://wetten.overheid.nl/BWBR0033716/2013-11-09#Artikel4
  - number: '5.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de wijze waarop de steekproeven, bedoeld
      in artikel 8, tweede lid, van de Verordening, worden uitgevoerd en over de vaststelling van het totaal aantal
      geldige steunbetuigingen op basis van de uitkomst van de steekproeven.
    url: https://wetten.overheid.nl/BWBR0033716/2013-11-09#Artikel5
  - number: '5.2'
    text: 'Deze regels hebben in ieder geval betrekking op:'
    url: https://wetten.overheid.nl/BWBR0033716/2013-11-09#Artikel5
  - number: 5.2.a
    text: de omvang van de steekproeven;
    url: https://wetten.overheid.nl/BWBR0033716/2013-11-09#Artikel5
  - number: 5.2.b
    text: de wijze waarop de selectie voor de steekproeven wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0033716/2013-11-09#Artikel5
  - number: '6.1'
    text: |-
      [Titel 8.3 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op een beschikking op grond van
      [artikel 2, aanhef en onder c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0033716#Artikel2
    url: https://wetten.overheid.nl/BWBR0033716/2013-11-09#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0033716
        artikel: '2'
  - number: '6.2'
    text: |-
      In afwijking van [artikel 8:41, vijfde lid, van de Algemene wet bestuursrecht][ref1] bedraagt de termijn binnen
      welke de bijschrijving of storting van het verschuldigde bedrag dient plaats te vinden, twee weken. De voorzitter
      van de Afdeling bestuursrechtspraak van de Raad van State kan een kortere termijn stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0033716/2013-11-09#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '6.3'
    text: |-
      De Afdeling bestuursrechtspraak van de Raad van State behandelt de zaak met toepassing van
      [afdeling 8.2.3 van de Algemene wet bestuursrecht][ref1]. [Afdeling 8.2.4][ref2] blijft buiten toepassing. Aan Onze
      Minister wordt terstond een afschrift van het beroepschrift gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling8.2.3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling8.2.4
    url: https://wetten.overheid.nl/BWBR0033716/2013-11-09#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 8.2.3
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: 8.2.4
  - number: '8'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0033716/2013-11-09#Artikel8
  - number: '9'
    text: 'Deze wet wordt aangehaald als: Uitvoeringswet verordening Europees burgerinitiatief.'
    url: https://wetten.overheid.nl/BWBR0033716/2013-11-09#Artikel9
