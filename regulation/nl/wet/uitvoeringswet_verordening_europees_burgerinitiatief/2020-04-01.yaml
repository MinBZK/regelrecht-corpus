preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is regels te stellen ter uitvoering van de Verordening
    (EU) nr. 211/2011 van het Europees Parlement en de Raad van 16 februari 2011 over het burgerinitiatief (PbEU 2011,
    L 65);

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0033716/2020-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

        - *Onze Minister:* Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - *Verordening:* Verordening (EU) nr. 2019/788 van het Europees Parlement en de Raad van 17 april 2019 over het
      burgerinitiatief (PB L 130/55 van 17.5.2019).
    url: https://wetten.overheid.nl/BWBR0033716/2020-04-01#Artikel1
  - number: '2'
    text: |-
      Onze Minister is bevoegd:

      a. certificaten als bedoeld in artikel 11, derde lid, van de Verordening af te geven;

      b. de verificatie van de steunbetuigingen, bedoeld in artikel 12, vierde lid, van de Verordening, te coördineren;

      c. certificaten als bedoeld in artikel 12, vijfde lid, van de Verordening af te geven.
    url: https://wetten.overheid.nl/BWBR0033716/2020-04-01#Artikel2
  - number: '3'
    text: |-
      Bij ministeriële regeling wordt bepaald welke gegevens en bescheiden in ieder geval bij een aanvraag voor een
      certificaat als bedoeld in artikel 11, derde lid, van de Verordening worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0033716/2020-04-01#Artikel3
  - number: '4'
    text: |-
      1 De aanvrager draagt er zorg voor dat door Onze Minister aangewezen ambtenaren ten behoeve van het beoordelen van
      de aanvraag voor een certificaat als bedoeld in artikel 11, derde lid van de Verordening, met medeneming van de
      benodigde apparatuur, de plaats kunnen betreden waar het onlinesysteem, bedoeld in artikel 11 van de Verordening,
      zich bevindt en ter plaatse inzage kunnen krijgen in het onlinesysteem.

      2 De ambtenaren, bedoeld in het eerste lid, kunnen zich laten vergezellen door personen die daartoe door hen zijn
      aangewezen.

      3 Indien de plaats en het onlinesysteem, bedoeld in het eerste lid, niet overeenkomstig dit artikel kunnen worden
      betreden respectievelijk ingezien, kan de aanvraag worden afgewezen.
    url: https://wetten.overheid.nl/BWBR0033716/2020-04-01#Artikel4
  - number: '5'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de wijze waarop de steekproeven,
      bedoeld in artikel 12, vierde lid, van de Verordening, worden uitgevoerd en over de vaststelling van het totaal
      aantal geldige steunbetuigingen op basis van de uitkomst van de steekproeven.

      2 Deze regels hebben in ieder geval betrekking op:

      a. de omvang van de steekproeven;

      b. de wijze waarop de selectie voor de steekproeven wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0033716/2020-04-01#Artikel5
  - number: '6'
    text: |-
      1 [Titel 8.3 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op een beschikking op grond van
      [artikel 2, aanhef en onder c][ref2].

      2 In afwijking van [artikel 8:41, vijfde lid, van de Algemene wet bestuursrecht][ref3] bedraagt de termijn binnen
      welke de bijschrijving of storting van het verschuldigde bedrag dient plaats te vinden, twee weken. De voorzitter
      van de Afdeling bestuursrechtspraak van de Raad van State kan een kortere termijn stellen.

      3 De Afdeling bestuursrechtspraak van de Raad van State behandelt de zaak met toepassing van
      [afdeling 8.2.3 van de Algemene wet bestuursrecht][ref4]. [Afdeling 8.2.4][ref5] blijft buiten toepassing. Aan Onze
      Minister wordt terstond een afschrift van het beroepschrift gezonden.


