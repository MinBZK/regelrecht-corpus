$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_overgangsregeling_ziektewet
regulatory_layer: WET
publication_date: '2006-05-09'
valid_from: '2002-01-01'
bwb_id: BWBR0002552
url: https://wetten.overheid.nl/BWBR0002552/2002-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen vast te stellen inzake overgangsrecht met
    betrekking tot de aanpassing van de Ziektewet aan de Wet op de arbeidsongeschiktheidsverzekering;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Voor de toepassing van deze wet en van de tot haar uitvoering genomen besluiten wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Sociale Zaken en Volksgezondheid;'
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel1
  - number: 1.b
    text: |-
      Wijzigingswet: de wet van 18 februari 1966 (*Stb.* 85) tot wijziging van de [Ziektewet][ref1] (Aanpassing aan de
      [Wet op de arbeidsongeschiktheidsverzekering][ref2]);


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0002524
  - number: 1.c
    text: |-
      Ongevallenwet 1921, Land- en Tuinbouwongevallenwet 1922 en Zeeongevallenwet 1919: de Ongevallenwet 1921, de Land-
      en Tuinbouwongevallenwet 1922, onderscheidenlijk de Zeeongevallenwet 1919, zoals deze wetten luidden op de dag,
      voorafgaande aan die, waarop zij werden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel1
  - number: '2'
    text: |-
      De beslissingen en verstrekkingen ingevolge deze wet worden voor de toepassing van wettelijke voorschriften geacht
      beslissingen en verstrekkingen te zijn ingevolge de [Ziektewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '3.1'
    text: |-
      De bepalingen van de [Ziektewet][ref1] en van haar uitvoeringsbesluiten, zoals deze luidden op de dag, voorafgaande
      aan die, waarop de Wijzigingswet in werking is getreden, blijven, onverminderd het overigens bij of krachtens deze
      wet bepaalde, van toepassing ten aanzien van de op het ogenblik van inwerkingtreding der Wijzigingswet lopende
      ziektegevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '3.2'
    text: |-
      Het dagloon, dat in gevallen als in het vorige lid bedoeld aan de ziekengelduitkering ten grondslag is
      gelegd, wordt - indien dit dagloon is vastgesteld op het bedrag, bepaald krachtens het eerste lid van
      [artikel 9 van de Coördinatiewet Sociale Verzekering][ref1], zoals dat artikel luidde op de dag, voorafgaande aan
      die, waarop de Wijzigingswet in werking is getreden - opnieuw vastgesteld met inachtneming van het in het vorige
      lid bepaalde en van het in het eerste lid van [artikel 9 van de Coördinatiewet Sociale Verzekering][ref2] bedoelde
      maximum dagloon, eventueel verhoogd of verlaagd krachtens artikel 9*a* van die wet. In gevallen als bedoeld in het
      vorige lid komt bij de berekening van de ziekengelduitkering, welke is toegekend zonder toepassing van het bepaalde
      bij of krachtens [artikel 87, derde lid, van de Ziektewet][ref3], zoals dat artikel luidde op de dag, voorafgaande
      aan die, waarop de Wijzigingswet in werking is getreden, het dagloon, hetwelk meer bedraagt dan 5/6 van het in de
      vorige volzin bedoelde maximum dagloon, voor dat meerdere niet in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0002126#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002126#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel87
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002126
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002126
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: '87'
  - number: '3.3'
    text: |-
      Ten aanzien van gevallen als bedoeld in het eerste lid alsmede ten aanzien van de aan de [artikelen 5][ref1] en
      [6][ref2] ontleende uitkeringen vindt het bepaalde bij of krachtens de [artikelen 8][ref3], [32][ref4], [33][ref5]
      en [34 van de Ziektewet][ref6] toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002552#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002552#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel32
      [ref5]: https://wetten.overheid.nl/BWBR0001888#Artikel33
      [ref6]: https://wetten.overheid.nl/BWBR0001888#Artikel34
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002552
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0002552
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0001888
        artikel: '32'
      - id: ref5
        bwb_id: BWBR0001888
        artikel: '33'
      - id: ref6
        bwb_id: BWBR0001888
        artikel: '34'
  - number: '4'
    text: Voor de toepassing van deze wet wordt onder ziekte mede verstaan zwangerschap en bevalling.
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel4
  - number: '5.1'
    text: |-
      Degene, die in het jaar, voorafgaande aan de dag, waarop de Wijzigingswet in werking treedt, ongeschikt is geworden
      tot het verrichten van zijn arbeid wegens ziekte, heeft, mits de ongeschiktheid op die dag nog voortduurt, recht op
      ziekengeld, indien hij ter zake van die ongeschiktheid aanspraak op ziekengeld krachtens de verplichte verzekering
      van de [Ziektewet][ref1] zou hebben gehad, indien de Wijzigingswet in werking zou zijn getreden drie maanden vóór
      het intreden van bedoelde ongeschiktheid tot werken.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '5.2'
    text: |-
      Ten aanzien van het recht op ziekengeld als bedoeld in het vorige lid zijn de bepalingen van de [Ziektewet][ref1]
      en van haar uitvoeringsbesluiten, zoals deze luidden op de dag, voorafgaande aan die, waarop de Wijzigingswet in
      werking is getreden, met inachtneming van de wijzigingen, welke de aard van het onderwerp vordert, en voor zover
      deze wet en haar uitvoeringsbesluiten daarvan niet afwijken, van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '5.3'
    text: |-
      Het bepaalde in het eerste lid is niet van toepassing ten aanzien van degene, die bij het intreden van de in dat
      lid bedoelde ongeschiktheid tot werken verplicht verzekerd was ingevolge de [Ziektewet][ref1], dan wel ter zake van
      die ongeschiktheid aanspraak had op ziekengeld alsof hij verzekerd was gebleven.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '5.4'
    text: |-
      Het ziekengeld, ontleend aan het bepaalde in het eerste lid, wordt uitgekeerd zolang de ongeschiktheid tot werken
      wegens ziekte voortduurt, doch uiterlijk tot de dag, welke is gelegen 52 weken na de dag, waarop de in dat lid
      bedoelde ongeschiktheid is ingetreden.
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel5
  - number: '6.1'
    text: |-
      Degene, die op de dag, voorafgaande aan die, waarop de Wijzigingswet in werking treedt, ongeschikt is tot het
      verrichten van zijn arbeid wegens ziekte en op eerstbedoelde dag geen recht heeft op ziekengeld uitsluitend in
      verband met het bepaalde in [artikel 31 van de Ziektewet][ref1], zoals dat artikel op die dag luidde, heeft,
      onverminderd het overigens bij of krachtens deze wet bepaalde, recht op ziekengeld overeenkomstig de bepalingen
      van de [Ziektewet][ref2], zoals deze luidden op de dag, voorafgaande aan die, waarop de Wijzigingswet in werking is
      getreden, indien en voor zolang hij dat recht zou hebben gehad, indien die bepalingen op hem van toepassing zouden
      zijn gebleven, met dien verstande, dat het tijdvak van 18 maanden, bedoeld in het tweede lid van voornoemd artikel,
      waarin opnieuw ziekengeld kan worden uitgekeerd, geacht wordt aan te vangen op laatstbedoelde dag.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0001888
  - number: '6.2'
    text: |-
      Bij de toekenning van ziekengelduitkering op grond van het bepaalde bij of krachtens dit of het voorgaande artikel,
      zonder toepassing van het bepaalde bij of krachtens [artikel 87, derde lid, van de Ziektewet][ref1], zoals dat
      artikel luidde op de dag, voorafgaande aan die, waarop de Wijzigingswet in werking is getreden, komt bij de
      berekening van het dagloon, dat aan die uitkering ten grondslag wordt gelegd, het dagloon, hetwelk meer bedraagt
      dan 5/6 van het in het eerste lid van [artikel 9 van de Coördinatiewet Sociale Verzekering][ref2] bedoelde maximum
      dagloon, eventueel verhoogd of verlaagd krachtens artikel 9*a* van die wet, voor dat meerdere niet in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0002126#Artikel9
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '87'
      - id: ref2
        bwb_id: BWBR0002126
        artikel: '9'
  - number: '6.3'
    text: Onze Minister kan met betrekking tot het bepaalde in het voorgaande artikel regelen stellen.
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel6
  - number: '7.1'
    text: 'Geen recht op ziekengeld bestaat:'
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel7
  - number: 7.1.a
    text: |-
      wegens ongeschiktheid tot werken, ingetreden vóór de dag, waarop de Wijzigingswet in werking treedt, alsmede
      wegens toeneming van die ongeschiktheid, ter zake waarvan krachtens de [Liquidatiewet ongevallenwetten][ref1] recht
      bestaat op een uitkering als bedoeld in [artikel 15][ref2] of 16 van de Ongevallenwet 1921, artikel 36 of 37 van
      de Land- en Tuinbouwongevallenwet 1922 of artikel 2, eerste lid, onder *a*, van de Zeeongevallenwet 1919, dan wel
      uitsluitend op grond van de in die wetten geregelde wachtdagen geen recht bestaat op een uitkering als bedoeld in
      die artikelen;


      [ref1]: https://wetten.overheid.nl/BWBR0002553
      [ref2]: https://wetten.overheid.nl/BWBR0002552#Artikel15
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002553
      - id: ref2
        bwb_id: BWBR0002552
        artikel: '15'
  - number: 7.1.b
    text: |-
      wegens ongeschiktheid tot werken, ingetreden vóór de dag, waarop de Wijzigingswet in werking treedt, ter
      zake waarvan op de dag, voorafgaande aan vorenbedoelde dag, recht bestaat op een uitkering als bedoeld in
      [artikel 15][ref1] of 16 van de Ongevallenwet 1921, artikel 36 of 37 van de Land- en Tuinbouwongevallenwet
      1922 of artikel 2, eerste lid, onder *a*, van de Zeeongevallenwet 1919, dan wel uitsluitend op grond van
      de in die wetten geregelde wachtdagen geen recht bestaat op een uitkering als bedoeld in die artikelen,
      indien op grond van die ongeschiktheid recht bestaat op een arbeidsongeschiktheidsuitkering krachtens de
      [Wet overgangsregeling arbeidsongeschiktheidsverzekering][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002552#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002551
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002552
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002551
  - number: 7.1.c
    text: |-
      wegens ongeschiktheid tot werken, ter zake waarvan recht bestaat op een afkoopsom als bedoeld in [artikel 17][ref1]
      of [18 van de Liquidatiewet ongevallenwetten][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002553#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002553#Artikel18
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002553
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0002553
        artikel: '18'
  - number: '7.2'
    text: Degene, die
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel7
  - number: 7.2.a
    text: |-
      krachtens de [Liquidatiewet ongevallenwetten][ref1] recht heeft op een uitkering als bedoeld in artikel 15 van
      de Ongevallenwet 1921 of artikel 36 van de Land- en Tuinbouwongevallenwet 1922, wegens ongeschiktheid tot het
      verrichten van zijn werk, ingetreden vóór de dag, waarop de Wijzigingswet in werking treedt of


      [ref1]: https://wetten.overheid.nl/BWBR0002553
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002553
  - number: 7.2.b
    text: |-
      krachtens de [Liquidatiewet ongevallenwetten][ref1] recht heeft op een voorlopig toegekende uitkering als bedoeld
      in artikel 16 van de Ongevallenwet 1921 of artikel 37 van de Land- en Tuinbouwongevallenwet 1922, wegens gehele
      ongeschiktheid tot werken, ingetreden vóór de dag, waarop de Wijzigingswet in werking treedt,


      [ref1]: https://wetten.overheid.nl/BWBR0002553
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002553
  - number: '8.1'
    text: |-
      Het bepaalde in artikel 26, eerste lid, aanhef en onder *c, d* en *e*, van de [Ziektewet][ref1], zoals dat artikel
      luidde op de dag, voorafgaande aan die, waarop de Wijzigingswet in werking is getreden, blijft van toepassing ten
      aanzien van degene, die vóór de dag, waarop de Wijzigingswet in werking treedt, ongeschikt is geworden tot werken
      en wiens ongeschiktheid op laatstbedoelde dag nog voortduurt, indien en voor zolang die bepalingen op hem van
      toepassing zouden zijn geweest, indien de Ongevallenwet 1921 en de Land- en Tuinbouwongevallenwet 1922 niet zouden
      zijn ingetrokken en de Wijzigingswet niet in werking zou zijn getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '8.2'
    text: |-
      Degene, op wie het bepaalde in het vorige lid niet van toepassing is, en die in het jaar, voorafgaande aan de dag,
      waarop de Wijzigingswet in werking treedt, ongeschikt is geworden tot werken, is verplicht verzekerd ingevolge de
      [Ziektewet][ref1] over de tijd, waarover ter zake van bedoelde ongeschiktheid:


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 8.2.a
    text: |-
      krachtens de [Liquidatiewet ongevallenwetten][ref1] een uitkering als bedoeld in artikel 15 van de Ongevallenwet
      1921 of artikel 36 van de Land- en Tuinbouwongevallenwet 1922 wordt verleend, dan wel uitsluitend op grond van de
      in die wetten geregelde wachtdagen geen uitkering als bedoeld in die artikelen wordt verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0002553
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002553
  - number: 8.2.b
    text: |-
      krachtens de [Liquidatiewet ongevallenwetten][ref1] een uitkering als bedoeld in artikel 16 van de Ongevallenwet
      1921, artikel 37 van de Land- en Tuinbouwongevallenwet 1922 of artikel 2, eerste lid, onder *a*, van de
      Zeeongevallenwet 1919 wordt verleend, berekend naar een ongeschiktheid tot werken van 50 pct. of meer, zolang
      de uitkering, afgezien van het bepaalde in artikel 17 van de Ongevallenwet 1921, artikel 38 van de Land-
      en Tuinbouwongevallenwet 1922 en artikel 2, eerste lid, onder *c*, van de Zeeongevallenwet 1919, bij gehele
      ongeschiktheid tot werken naar 80 procent van het dagloon en bij gedeeltelijke ongeschiktheid tot werken naar een
      deel van dat percentage wordt berekend;


      [ref1]: https://wetten.overheid.nl/BWBR0002553
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002553
  - number: 8.2.c
    text: |-
      krachtens de [Wet overgangsregeling arbeidsongeschiktheidsverzekering][ref1] een arbeidsongeschiktheidsuitkering
      wordt verleend, berekend naar een arbeidsongeschiktheid van 45 pct. of meer, doch uiterlijk tot de dag, welke is
      gelegen 52 weken na de dag, waarop de ongeschiktheid tot werken is ingetreden, mits op de dag, voorafgaande aan
      die, waarop de Wijzigingswet in werking treedt, recht bestaat op een uitkering als bedoeld in artikel 15 van de
      Ongevallenwet 1921 of artikel 36 van de Land- en Tuinbouwongevallenwet 1922, dan wel op een uitkering als bedoeld
      in artikel 16 van de Ongevallenwet 1921, artikel 37 van de Land- en Tuinbouwongevallenwet 1922 of artikel 2, eerste
      lid, onder *a*, van de Zeeongevallenwet 1919, berekend naar een ongeschiktheid tot werken van 50 pct. of meer, dan
      wel uitsluitend op grond van de in die wetten geregelde wachtdagen geen recht bestaat op die uitkering;


      [ref1]: https://wetten.overheid.nl/BWBR0002551
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002551
  - number: '9.1'
    text: |-
      Bij samentelling van perioden als bedoeld in [artikel 29, vijfde lid, van de Ziektewet][ref1] wordt buiten
      aanmerking gelaten een periode, waarover ziekengeld wordt uitgekeerd ter zake van ongeschiktheid tot werken, welke
      is ingetreden vóór de dag, waarop de Wijzigingswet in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '29'
  - number: '9.2'
    text: |-
      Ten aanzien van degene, op wie het bepaalde in het vorige lid van toepassing is, blijft het bepaalde in
      [artikel 29, derde lid, van de Ziektewet][ref1] buiten toepassing voor wat betreft de eerste ongeschiktheid tot
      werken, welke intreedt op of na de in het vorige lid bedoelde dag.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '29'
  - number: '10'
    text: |-
      Het bepaalde bij of krachtens de [artikelen 32][ref1], [33][ref2], [34][ref3] en [35 van de Ziektewet][ref4], zoals
      deze artikelen luidden op de dag, voorafgaande aan die, waarop de Wijzigingswet in werking is getreden, is, met
      inachtneming van de wijzigingen welke de aard van het onderwerp vordert, van toepassing ten aanzien van degene, die
      wegens ongeschiktheid tot werken uitkering ontleent aan de [Liquidatiewet ongevallenwetten][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel35
      [ref5]: https://wetten.overheid.nl/BWBR0002553
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '32'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '33'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: '34'
      - id: ref4
        bwb_id: BWBR0001888
        artikel: '35'
      - id: ref5
        bwb_id: BWBR0002553
  - number: '11.1'
    text: |-
      Degene, die op of na de dag, waarop de Wijzigingswet in werking treedt op grond van het bepaalde bij of krachtens
      [artikel 5][ref1] of 6, dan wel krachtens de verplichte verzekering ingevolge de [Ziektewet][ref2], zoals deze wet
      luidde op de dag, voorafgaande aan vorenbedoelde dag, recht heeft op ziekengeld en die gedurende de ongeschiktheid
      tot werken:


      [ref1]: https://wetten.overheid.nl/BWBR0002552#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002552
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0001888
  - number: 11.1.a
    text: loon ontvangt;
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel11
  - number: 11.1.b
    text: |-
      ter zake van een andere verzekering dan krachtens een wettelijke verzekering, met uitzondering van een vrijwillige
      verzekering ingevolge de [Ziektewet][ref1], recht heeft op enige geldelijke vergoeding of uitkering bij ziekte;


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 11.1.c
    text: |-
      krachtens de [Liquidatiewet ongevallenwetten][ref1] recht heeft op een uitkering als bedoeld in artikel 15 van de
      Ongevallenwet 1921 of artikel 36 van de Land- en Tuinbouwongevallenwet 1922, dan wel op een voorlopig toegekende
      uitkering als bedoeld in artikel 16 van de Ongevallenwet 1921 of artikel 37 van de Land- en Tuinbouwongevallenwet
      1922;


      [ref1]: https://wetten.overheid.nl/BWBR0002553
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002553
  - number: 11.1.d
    text: |-
      in aansluiting op een uitkering als bedoeld onder *c* recht heeft op een arbeidsongeschiktheidsuitkering krachtens
      de [Wet overgangsregeling arbeidsongeschiktheidsverzekering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002551
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002551
  - number: 11.1.e
    text: |-
      in aansluiting op een voorlopig toegekende uitkering als bedoeld in artikel 16 van de Ongevallenwet
      1921 of artikel 37 van de Land- en Tuinbouwongevallenwet 1922, dan wel in aansluiting op een uitkering
      als bedoeld onder *c* of *d*, recht heeft op een afkoopsom als bedoeld in [artikel 17][ref1] of
      [18 van de Liquidatiewet ongevallenwetten][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002553#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002553#Artikel18
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002553
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0002553
        artikel: '18'
  - number: '11.2'
    text: |-
      Onverminderd het bepaalde bij [artikel 7 en de volgende leden][ref1] ontvangt de betrokkene:


      [ref1]: https://wetten.overheid.nl/BWBR0002552#Artikel7
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002552
        artikel: '7'
  - number: 11.2.a
    text: |-
      voor zover hij loon ontvangt of een zodanige vergoeding, uitkering of afkoopsom geniet, aan ziekengeld niet
      meer dan het bedrag, waarmede zijn dagloon overtreft het gezamenlijk bedrag van het door hem ontvangen loon,
      die vergoeding, uitkering of, ingeval van een afkoopsom, de uitkering, welke hij zou hebben gehad, indien de
      Ongevallenwet 1921 en de Land- en Tuinbouwongevallenwet 1922 niet zouden zijn ingetrokken;
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel11
  - number: 11.2.b
    text: |-
      voor zover hij ziekengeld krachtens een vrijwillige verzekering ingevolge de [Ziektewet][ref1] ontvangt, aan
      ziekengeld ingevolge deze wet niet meer dan het bedrag, waarmede het product van het uitkeringspercentage, waarnaar
      het ziekengeld krachtens de vrijwillige verzekering is berekend, en het aan het ziekengeld ingevolge deze wet ten
      gronslag liggende dagloon overtreft het bedrag van het ziekengeld krachtens de vrijwillige verzekering.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '11.3'
    text: |-
      Voor de toepassing van het bepaalde in het eerste lid, onder *b*, en het tweede lid, komen vergoedingen van kosten
      van ziekenhuisbehandeling niet in aanmerking.
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel11
  - number: '11.4'
    text: |-
      Onze Minister kan met betrekking tot gevallen van samenloop van ziekengeld ingevolge de [Ziektewet][ref1] met
      uitkering wegens ongeschiktheid tot werken ingevolge de [Liquidatiewet ongevallenwetten][ref2] regelen stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0002553
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0002553
  - number: '12'
    text: |-
      Degene, die op grond van het bepaalde bij of krachtens [artikel 5][ref1] of 6 recht heeft op ziekengeld is
      verplicht te zorgen dat zo spoedig mogelijk, in elk geval binnen 2 * 24 uur na het in werking treden van de
      Wijzigingswet, mededeling ("ziekmelding") wordt gedaan aan het orgaan dat met de uitvoering is belast, dan wel,
      indien dat orgaan de werkgever heeft verplicht tot het aangeven van ziektegevallen, aan de werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0002552#Artikel5
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002552
        artikel: '5'
  - number: '13.1'
    text: |-
      Het bepaalde in artikel 44, eerste lid, onder *a*, sub 2°, van de [Ziektewet][ref1] blijft buiten toepassing ten
      aanzien van degene, wiens ongeschiktheid tot werken is ingetreden binnen een half jaar na het in werking treden
      van de Wijzigingswet, indien hij gedurende het halve jaar, onmiddellijk voorafgaande aan het intreden van die
      ongeschiktheid, onafgebroken krachtens de [Ziektewet][ref2] verzekerd zou zijn geweest, indien de Wijzigingswet
      toen reeds in werking zou zijn geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0001888
  - number: '13.2'
    text: |-
      Het bepaalde in [artikel 44, eerste lid, onder ][ref1] blijft buiten toepassing ten aanzien van degene, die
      uitsluitend ten gevolge van het in werking treden van de Wijzigingswet op de dag der inwerkingtreding van die wet
      ingevolge de [Ziektewet][ref2] verzekerd wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0001888
  - number: '14.1'
    text: |-
      Ten aanzien van degene, die ongeschikt tot werken wordt binnen drie maanden na het in werking treden van de
      Wijzigingswet, doch binnen een maand na het tijdstip, waarop zijn verzekering ingevolge de [Ziektewet][ref1] is
      geëindigd, wordt voor de toepassing van [artikel 46 van de Ziektewet][ref2] de Wijzigingswet geacht in werking
      te zijn getreden op de dag, welke is gelegen drie maanden vóór de dag, waarop de ongeschiktheid tot werken is
      ingetreden.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel46
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '46'
  - number: '14.2'
    text: |-
      Ten aanzien van degene, die ongeschikt tot werken wordt op of na de dag, waarop de Wijzigingswet in werking treedt,
      doch binnen een maand na het vóór die dag gelegen tijdstip, waarop zijn verzekering ingevolge de [Ziektewet][ref1]
      is geëindigd of zou zijn geëindigd, indien de Wijzigingswet toen reeds in werking zou zijn geweest, wordt voor de
      toepassing van [artikel 46 van de Ziektewet][ref2] de Wijzigingswet geacht in werking te zijn getreden op de dag,
      welke is gelegen drie maanden vóór de dag, waarop de ongeschiktheid tot werken is ingetreden.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel46
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '46'
  - number: '14.3'
    text: |-
      Op de termijnen, gesteld in de vorige leden, is de [Algemene termijnenwet][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: '15'
    text: |-
      Degene, die op grond van het bepaalde in [artikel 5][ref1] of 14, tweede lid, recht heeft op
      ziekengeld of op grond van het bepaalde in [artikel 8, tweede lid][ref2], verzekerd wordt ingevolge
      de [Ziektewet][ref3], is verzekerd bij het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref4], waarbij de werkgever in wiens
      dienst hij was op het tijdstip, waarop de in die artikelen bedoelde ongeschiktheid tot werken is ingetreden, of,
      indien hij op dat tijdstip geen werkgever had, zijn laatste werkgever vóór het intreden van die ongeschiktheid,
      te zijnen aanzien voor de ziekengeldverzekering aangesloten zou zijn geweest, indien de Wijzigingswet toen reeds
      in werking zou zijn geweest. Voor de bepaling van het orgaan, dat in de gevallen, bedoeld in de vorige volzin, het
      risico draagt, wordt de betrokkene geacht in dienst te zijn van de in die volzin bedoelde werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0002552#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002552#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0001888
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002552
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0002552
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0001888
      - id: ref4
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: '16.1'
    text: |-
      De vrijwillige verzekeringen ingevolge [artikel 64][ref1], eerste lid, en [artikel 65 van de Ziektewet][ref2],
      zoals deze artikelen luidden op de dag, voorafgaande aan die, waarop de Wijzigingswet in werking is getreden,
      blijven in stand, tenzij de betrokkene met ingang van de dag, waarop de Wijzigingswet in werking treedt, verplicht
      verzekerd wordt ingevolge de [Ziektewet][ref3], dan wel vóór laatstbedoelde dag aan het Uitvoeringsinstituut
      werknemersverzekeringen, genoemd in [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref4]
      te kennen heeft gegeven, dat hij zijn vrijwillige verzekering met ingang van die dag wenst te beëindigen.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel65
      [ref3]: https://wetten.overheid.nl/BWBR0001888
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '64'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '65'
      - id: ref3
        bwb_id: BWBR0001888
      - id: ref4
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: '16.2'
    text: |-
      Op de ingevolge het bepaalde in het vorige lid in stand gebleven vrijwillige verzekeringen is het bepaalde bij of
      krachtens de [Ziektewet][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '17'
    text: |-
      Voor zover de termijn van drie jaren, genoemd in [artikel 64, eerste lid, onder c en d, van de Ziektewet][ref1],
      is gelegen vóór het in werking treden van de Wijzigingswet, wordt in genoemde bepalingen in plaats van
      "onafgebroken, al dan niet hier te lande, ingevolge het bepaalde bij of krachtens een wettelijke regeling een
      voorziening tegen geldelijke gevolgen van ziekte op hem van toepassing is geweest" gelezen: onafgebroken de
      verzekering ingevolge deze wet op hem van toepassing is geweest, dan wel op hem van toepassing zou zijn geweest
      of in verband met het bepaalde in [artikel 6, eerste lid, onder a of b][ref2], niet op hem van toepassing zou zijn
      geweest, indien de wet van 18 februari 1966 (*Stb.* 85) tot wijziging van de [Ziektewet][ref3] (Aanpassing aan
      de [Wet op de arbeidsongeschiktheidsverzekering][ref4]) toen reeds in werking was geweest, of buiten het Rijk,
      ingevolge het bepaalde bij of krachtens een wettelijke regeling, een voorziening tegen geldelijke gevolgen van
      ziekte op hem van toepassing is geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0002552#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0001888
      [ref4]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '64'
      - id: ref2
        bwb_id: BWBR0002552
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0001888
      - id: ref4
        bwb_id: BWBR0002524
  - number: '18'
    text: |-
      In afwijking van het bepaalde in het eerste lid van [artikel 65 van de Ziektewet][ref1] wordt de in artikel 64,
      eerste lid, onder *c* en *d*, van die wet genoemde termijn van drie jaren, voor zover gelegen vóór het in werking
      treden van de Wijzigingswet, geacht niet te zijn onderbroken:


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel65
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '65'
  - number: 18.a
    text: |-
      indien de betrokkene niet verzekerd is geweest of, zo de Wijzigingswet toen reeds in werking zou zijn geweest, niet
      verzekerd zou zijn geweest gedurende niet meer dan zestig dagen, verminderd met het aantal dagen, gedurende welke
      hij na het in werking treden van de Wijzigingswet niet verzekerd is geweest;
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel18
  - number: 18.b
    text: |-
      gedurende het tijdvak, dat de betrokkene wegens ziekte of gebreken ongeschikt is geweest tot het verrichten van
      zijn arbeid;
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel18
  - number: 18.c
    text: gedurende het tijdvak, dat de betrokkene ten minste 45 pct. arbeidsongeschikt is geweest.
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel18
  - number: '19.1'
    text: |-
      De aanmelding voor de vrijwillige verzekering kan na de in [artikel 66 van de Ziektewet][ref1] bedoelde termijn
      nog, onverminderd het bepaalde in het volgende lid, geschieden binnen zes maanden na het in werking treden van
      de Wijzigingswet door de personen, wier aanmelding voor de vrijwillige verzekering ingevolge het bepaalde bij of
      krachtens [artikel 66 van de Ziektewet][ref2] zou dienen te geschieden vóór een dag, gelegen binnen zes maanden na
      het in werking treden van de Wijzigingswet.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel66
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '66'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '66'
  - number: '19.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], is bevoegd de toelating tot de
      vrijwillige verzekering na aanmelding met toepassing van het vorige lid te weigeren, indien ongeschiktheid tot
      werken is ingetreden na de in het vorige lid bedoelde dag, doch vóór het tijdstip, waarop de betrokkene zich
      aanmeldt voor de vrijwillige verzekering.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: '20.1'
    text: |-
      Een overeenkomst met betrekking tot de verzekering van geldelijke gevolgen van ongeschiktheid tot werken wegens
      ziekte, gesloten door degene, die met ingang van de dag, waarop de Wijzigingswet in werking treedt, anders dan op
      grond van het bepaalde in [artikel 64, vierde lid, van de Ziektewet][ref1] tot de vrijwillige verzekering ingevolge
      de [Ziektewet][ref2] wordt toegelaten, vervalt met ingang van de dag, waarop de verzekeraar van de verzekerde
      mededeling van de toelating ontvangt, voor zover aan de overeenkomst rechten kunnen worden ontleend, gelijkwaardig
      aan die, welke uit de in de [Ziektewet][ref3] geregelde vrijwillige verzekering voortvloeien. Bereikt deze
      mededeling de verzekeraar vóór de dag, waarop de betrokkene vrijwillig verzekerd wordt, dan vervalt de overeenkomst
      met ingang van die dag.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '64'
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0001888
  - number: '20.2'
    text: |-
      [Artikel 88, tweede lid, van de Ziektewet][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel88
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '88'
  - number: '22'
    text: Hetgeen nog ter uitvoering van deze wet nodig is wordt door Onze Minister geregeld.
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel22
  - number: '24'
    text: Deze wet kan worden aangehaald onder de titel "Wet overgangsregeling Ziektewet".
    url: https://wetten.overheid.nl/BWBR0002552/2002-01-01#Artikel24
  - number: '25'
    text: |-
      De artikelen van deze wet treden in werking met ingang van een door Ons te bepalen tijdstip, dat voor de
      onderscheidene artikelen of onderdelen daarvan verschillend kan worden gesteld.
