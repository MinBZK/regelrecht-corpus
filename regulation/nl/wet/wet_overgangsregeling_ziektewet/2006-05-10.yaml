  - number: '16'
    text: |-
      1 De vrijwillige verzekeringen ingevolge [artikel 64][ref1], eerste lid, en [artikel 65 van de Ziektewet][ref2],
      zoals deze artikelen luidden op de dag, voorafgaande aan die, waarop de Wijzigingswet in werking is getreden,
      blijven in stand, tenzij de betrokkene met ingang van de dag, waarop de Wijzigingswet in werking treedt, verplicht
      verzekerd wordt ingevolge de [Ziektewet][ref3], dan wel vóór laatstbedoelde dag aan het Uitvoeringsinstituut
      werknemersverzekeringen, genoemd in [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref4]
      te kennen heeft gegeven, dat hij zijn vrijwillige verzekering met ingang van die dag wenst te beëindigen.

      2 Op de ingevolge het bepaalde in het vorige lid in stand gebleven vrijwillige verzekeringen is het bepaalde bij of
      krachtens de [Ziektewet][ref5] van toepassing.


