      - id: ref10
        bwb_id: BWBR0024394
  - number: 1.j
    text: |-
      *alleenstaande minderjarige ontheemde:* ontheemde die de leeftijd van 18 jaar nog niet heeft bereikt en die zonder
      begeleiding of verzorging van een ouder of voogd in Nederland verblijft;
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel1
  - number: 1.k
    text: |-
      *begeleider:* meerderjarige begeleider van een alleenstaande minderjarige ontheemde, niet zijnde de ouder of voogd,
      die met de alleenstaande minderjarige ontheemde in dezelfde gemeentelijke of particuliere opvanglocatie verblijft.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel1
  - number: '2.1'
    text: |-
      Het college van burgemeester en wethouders draagt zorg voor de opvang van ontheemden. De in de eerste volzin
      bedoelde taak is niet van toepassing op alleenstaande minderjarige ontheemden.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel2
  - number: '2.2'
    text: |-
      Het college van burgemeester en wethouders verstrekt aan de ontheemde die wordt opgevangen in een gemeentelijke
      opvangvoorziening of een particuliere opvangvoorziening, binnen een redelijke termijn, maar ten hoogste vijftien
      dagen na de aanvang van de opvang in een gemeentelijke of particuliere opvangvoorziening informatie over:
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel2
  - number: 2.2.a
    text: |-
      de geldende verstrekkingen alsook over de verplichtingen die de ontheemde moet nakomen in verband met de
      opvangvoorzieningen, waaronder de verplichting om aan het college van burgemeester en wethouders informatie te
      verstrekken over zijn inkomsten en gezinssamenstelling;
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel2
  - number: 2.2.b
    text: organisaties of groepen van personen die specifieke rechtsbijstand verlenen;
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel2
  - number: 2.2.c
    text: de opvangvoorzieningen, waaronder medische zorg;
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel2
  - number: 2.2.d
    text: de geldende verplichtingen over inschrijving in de Basisregistratie Personen en uitschrijving bij verhuizing.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel2
  - number: '2.3'
    text: |-
      Het college van burgemeester en wethouders zorgt ervoor dat de in het tweede lid bedoelde informatie schriftelijk
      wordt verstrekt in een taal die de ontheemde begrijpt of waarvan redelijkerwijs kan worden aangenomen dat hij deze
      begrijpt. In voorkomende gevallen kan deze informatie tevens mondeling verstrekt worden zonder begeleider.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel2
  - number: 2a
    text: |-
      De ontheemde is verplicht om onverwijld uit eigen beweging dan wel uiterlijk binnen twee weken nadat het college
      van burgemeester en wethouders daarom heeft verzocht mededeling te doen over zijn inkomsten en gezinssamenstelling.
      De ontheemde is tevens verplicht om in geval van verandering in inkomsten of gezinssamenstelling het college van
      burgemeester en wethouders daarvan onverwijld mededeling te doen.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel2a
  - number: 2b.1
    text: |-
      Toepassing van de [artikelen 7, tweede en vierde lid][ref1], [8][ref2] en [13, tweede lid][ref3], blijft
      achterwege als de ontheemde of een gezinslid daardoor onevenredig zwaar zou worden getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0046503#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0046503#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0046503#Artikel13
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0046503
        artikel: '7'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0046503
        artikel: '8'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0046503
        artikel: '13'
        hoofdstuk: V
  - number: 2b.2
    text: |-
      Toepassing van de [artikelen 7, tweede lid][ref1], en [13, tweede lid][ref2], blijft in elk geval achterwege als
      de inkomsten als bedoeld in artikel 7, tweede lid aanhef en onder a en b, na toepassing daarvan minder bedragen dan
      115% van het bedrag, bedoeld in [artikel 6, eerste lid, aanhef en onder b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0046503#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0046503#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0046503#Artikel6
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0046503
        artikel: '7'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0046503
        artikel: '13'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0046503
        artikel: '6'
        hoofdstuk: IV
  - number: 2b.3
    text: |-
      Toepassing van de [artikelen 7, vierde lid][ref1], en [8, eerste lid][ref2], blijft in elk geval achterwege
      als de inkomsten als bedoeld in artikel 8, eerste lid aanhef en onder a en b, na toepassing daarvan minder
      bedragen dan 115% van het bedrag, bedoeld in [artikel 6, eerste lid aanhef en onder b][ref3], vermeerderd
      met het bedrag, bedoeld in artikel 8, tweede lid. Indien de ontheemde verblijft in een opvangvoorziening als
      bedoeld in artikel 7, vierde lid, worden de inkomsten geacht te zijn vermeerderd met het bedrag genoemd in
      [artikel 10, tweede lid aanhef en onder a][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0046503#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0046503#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0046503#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0046503#Artikel10
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0046503
        artikel: '7'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0046503
        artikel: '8'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0046503
        artikel: '6'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0046503
        artikel: '10'
        hoofdstuk: IV
  - number: '3'
    text: |-
      Het college van burgemeester en wethouders kan een tijdelijke alternatieve opvangvoorziening beschikbaar stellen
      die voldoet aan de minimumnormen zoals opgenomen in deze regeling indien:
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel3
  - number: 3.a
    text: er geen opvangvoorziening meer beschikbaar is; of
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel3
  - number: 3.b
    text: de specifieke situatie en bijzondere opvangbehoeften van een kwetsbare ontheemde andersoortige opvang vereist.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel3
  - number: '4.1'
    text: |-
      Het college van burgemeester en wethouders kan een ontheemde uitsluiten van de opvang, bedoeld in het
      [artikel 2, eerste lid][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0046503#Artikel2
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0046503
        artikel: '2'
        hoofdstuk: I
  - number: 4.1.a
    text: de ontheemde rechtens van zijn vrijheid is ontnomen;
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel4
  - number: 4.1.b
    text: |-
      door de Minister belast met de uitvoering van de [Vreemdelingenwet 2000][ref1] is geoordeeld dat betrokkene
      tijdelijke bescherming wordt geweigerd vanwege het bepaalde in artikel 28 van de Richtlijn;


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 4.1.c
    text: de ontheemde tevens de Nederlandse nationaliteit bezit.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel4
  - number: '4.2'
    text: |-
      Het recht op opvang van een ontheemde wiens asielaanvraag die recht op opvang heeft gegeven is
      afgewezen, eindigt indien de tijdelijke bescherming is geëindigd en de vertrektermijn als bedoeld in
      [artikel 62 van de Vreemdelingenwet 2000][ref1] is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '62'
  - number: '5.1'
    text: |-
      De opvangvoorziening voldoet aan een toereikend huisvestingsniveau, waaronder ten minste wordt begrepen de
      aanwezigheid van een adequate bescherming tegen weersinvloeden, van verwarming, sanitaire voorzieningen en zit-
      en slaapgelegenheid.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel5
  - number: '5.2'
    text: Indien mogelijk wordt voorzien in de gelegenheid tot het bereiden van maaltijden.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel5
  - number: '5.3'
    text: Van de in het eerste lid genoemde criteria kan worden afgeweken gedurende de eerste acute opvang.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel5
  - number: '6.1'
    text: 'De opvang omvat in elk geval de volgende verstrekkingen:'
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel6
  - number: 6.1.a
    text: onderdak in opvangvoorzieningen die een toereikend huisvestingsniveau bieden;
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel6
  - number: 6.1.b
    text: |-
      een maandelijkse financiële toelage ten behoeve van voedsel, kleding en andere persoonlijke uitgaven, tenzij de
      ontheemde inkomsten uit arbeid heeft;
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel6
  - number: 6.1.c
    text: recreatieve en educatieve activiteiten;
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel6
  - number: 6.1.d
    text: een verzekering tegen de financiële gevolgen van wettelijke aansprakelijkheid; en
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel6
  - number: 6.1.e
    text: betaling van buitengewone kosten.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel6
  - number: '6.2'
    text: 'Het college van burgemeester en wethouders draagt er zorg voor dat tijdens de opvang:'
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel6
  - number: 6.2.a
    text: de ontheemde bescherming van zijn gezinsleven geniet;
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel6
  - number: 6.2.b
    text: |-
      de ontheemde de mogelijkheid heeft om te communiceren met familieleden, juridisch adviseurs of raadslieden
      en vertegenwoordigers van de Hoge Commissaris der Verenigde Naties voor Vluchtelingen en andere relevante,
      internationale en niet-gouvernementele organisaties en instanties;
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel6
  - number: 6.2.c
    text: aan de ontheemde in de leerplichtige leeftijd onderwijs wordt geboden.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel6
  - number: '6.3'
    text: |-
      Het college van burgemeester en wethouders stelt voor elke opvangvoorziening een huishoudelijk reglement op waarin
      tenminste passende maatregelen zijn opgenomen om geweldpleging en gendergerelateerd geweld, met inbegrip van
      aanranding en seksuele intimidatie, te voorkomen en de verplichting van de ontheemde om:
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel6
  - number: 6.3.a
    text: de huisregels na te leven die zijn neergelegd in het reglement van de desbetreffende opvangvoorziening;
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel6
  - number: 6.3.b
    text: gevolg te geven aan de aanwijzingen van het personeel van de desbetreffende opvangvoorziening;
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel6
  - number: 6.3.c
    text: schoonmaakwerkzaamheden te verrichten in en rond de woonruimte; en
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel6
  - number: 6.3.d
    text: |-
      toegang te verlenen aan het personeel van de opvangvoorziening tot zijn woonruimte indien een redelijk vermoeden
      bestaat dat de ontheemde de huisregels overtreedt of indien dit voor het beheer van de opvangvoorziening
      redelijkerwijs noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel6
  - number: '7.1'
    text: |-
      Het college van burgemeester en wethouders kan de verstrekkingen, bedoeld in [artikel 6, eerste lid][ref1],
      beperken of intrekken indien:


      [ref1]: https://wetten.overheid.nl/BWBR0046503#Artikel6
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0046503
        artikel: '6'
        hoofdstuk: IV
  - number: 7.1.a
    text: de opvang van de ontheemde beëindigd wordt omdat opvang (of onderdak) elders is voorzien;
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel7
  - number: 7.1.b
    text: |-
      de ontheemde de opvang definitief verlaat of langer dan 28 dagen per kalenderjaar niet in de opvang is verschenen
      zonder het college van burgemeester en wethouders hiervan op de hoogte te stellen;
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel7
  - number: 7.1.c
    text: |-
      de ontheemde ernstig inbreuk maakt op de verplichtingen, genoemd in [artikel 6, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0046503#Artikel6
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0046503
        artikel: '6'
        hoofdstuk: IV
  - number: 7.1.d
    text: |-
      de ontheemde een ernstige vorm van geweld pleegt jegens medebewoners die in dezelfde opvangvoorziening verblijven,
      aan personen die werkzaam zijn in de voorziening, of aan anderen.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel7
  - number: '7.2'
    text: |-
      Het college van burgemeester en wethouders trekt, met ingang van de eerstvolgende maand, de verstrekkingen, bedoeld
      in [artikel 6, eerste lid, aanhef en onder b][ref1], geheel of ten dele in, indien de meerderjarige ontheemde of
      een meerderjarig gezinslid:


      [ref1]: https://wetten.overheid.nl/BWBR0046503#Artikel6
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0046503
        artikel: '6'
        hoofdstuk: IV
  - number: 7.2.a
    text: |-
      inkomsten uit arbeid in Nederland of in een ander land heeft en zulks blijkt uit de door de ontheemde opgegeven of
      van het Uitvoeringsinstituut Werknemersverzekeringen ontvangen informatie over zijn inkomsten uit arbeid;
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel7
  - number: 7.2.b
    text: een loondervingsuitkering of een toeslag op grond van de Toeslagenwet ontvangt;
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel7
  - number: 7.2.c
    text: |-
      gedurende twee weken niet heeft voldaan aan verzoeken van het college van burgemeester en wethouders om informatie
      te verstrekken over zijn inkomsten en gezinssamenstelling, of
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel7
  - number: 7.2.d
    text: inkomsten verborgen heeft gehouden en daardoor ten onrechte van de verstrekkingen gebruik heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel7
  - number: '7.3'
    text: De intrekking bedraagt niet meer dan er is verstrekt.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel7
  - number: '7.4'
    text: |-
      Het college van burgemeester en wethouders brengt, met ingang van de eerstvolgende maand, in de opvangvoorziening
      waarin de ontheemden niet zelf het eigen eten verzorgen, een bedrag ter hoogte van de financiële toelage
      als bedoeld in [artikel 10, tweede lid, onderdeel a][ref1], geheel of gedeeltelijk in rekening indien de
      meerderjarige ontheemde of een meerderjarig gezinslid:


      [ref1]: https://wetten.overheid.nl/BWBR0046503#Artikel10
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0046503
        artikel: '10'
        hoofdstuk: IV
  - number: 7.4.a
    text: |-
      inkomsten uit arbeid in Nederland of in een ander land heeft en zulks blijkt uit de door de ontheemde opgegeven of
      van het Uitvoeringsinstituut Werknemersverzekeringen ontvangen informatie over zijn inkomsten uit arbeid;
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel7
  - number: 7.4.b
    text: |-
      een loondervingsuitkering of een toeslag op grond van de [Toeslagenwet][ref1] ontvangt;


      [ref1]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004043
  - number: 7.4.c
    text: |-
      gedurende twee weken niet heeft voldaan aan verzoeken van het college van burgemeester en wethouders om informatie
      te verstrekken over zijn inkomsten en gezinssamenstelling, of
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel7
  - number: 7.4.d
    text: inkomsten verborgen heeft gehouden en daardoor ten onrechte van de verstrekkingen gebruik heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel7
  - number: '7.5'
    text: |-
      In geval van een gezin met meerdere meerderjarige gezinsleden wordt bij toepassing van het vierde lid een maximum
      gesteld van twee keer de financiële toelage als bedoeld in [artikel 10, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0046503#Artikel10
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0046503
        artikel: '10'
        hoofdstuk: IV
  - number: '7.6'
    text: |-
      Het college van burgemeester en wethouders kan de verstrekkingen, bedoeld in
      [artikel 6, eerste lid, onder b][ref1], terugvorderen indien deze ten onrechte of tot een te hoog bedrag zijn
      verstrekt. Het college van burgemeester en wethouders vordert niet meer terug dan er is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0046503#Artikel6
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0046503
        artikel: '6'
        hoofdstuk: IV
  - number: '8.1'
    text: |-
      Het college van burgemeester en wethouders brengt, met ingang van de eerstvolgende maand, een vergoeding in de
      kosten van de opvang van de meerderjarige ontheemde alsmede de opvang van diens meerderjarige gezinslid geheel of
      gedeeltelijk in rekening, indien de meerderjarige ontheemde of een meerderjarig gezinslid:
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel8
  - number: 8.1.a
    text: |-
      inkomsten uit arbeid in Nederland of in een ander land heeft en zulks blijkt uit de door de ontheemde opgegeven of
      van het Uitvoeringsinstituut Werknemersverzekeringen ontvangen informatie over zijn inkomsten uit arbeid;
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel8
  - number: 8.1.b
    text: |-
      een loondervingsuitkering of een toeslag op grond van de [Toeslagenwet][ref1] ontvangt;


      [ref1]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004043
  - number: 8.1.c
    text: |-
      gedurende twee weken niet heeft voldaan aan verzoeken van het college van burgemeester en wethouders om informatie
      te verstrekken over zijn inkomsten en gezinssamenstelling, of
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel8
  - number: 8.1.d
    text: inkomsten verborgen heeft gehouden en daardoor ten onrechte van de verstrekkingen gebruik heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel8
  - number: '8.2'
    text: |-
      De vergoeding bedraagt € 244,22 per maand per meerderjarige ontheemde en diens meerderjarige gezinslid tot een
      maximum van € 488,44.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel8
  - number: '9.1'
    text: |-
      Het college van burgemeester en wethouders bepaalt in welke opvangvoorziening binnen de gemeente een ontheemde
      wordt geplaatst en is bevoegd een ontheemde naar een andere voorziening binnen de gemeente over te plaatsen.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel9
  - number: '9.2'
    text: |-
      Bij de uitoefening van de bevoegdheid, bedoeld in het eerste lid, zorgt het college van burgemeester en wethouders
      ervoor dat de eenheid van het gezin in de mate van het mogelijke en met instemming van de betrokken gezinsleden
      bewaard wordt.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel9
  - number: '10.1'
    text: |-
      De door de ontheemde te ontvangen financiële toelage, bedoeld in [artikel 6, eerste lid, aanhef en onder b][ref1],
      van deze regeling, bestaat uit een bedrag ten behoeve van voedsel en een bedrag ten behoeve van kleding en andere
      persoonlijke uitgaven conform de Bekostigingsregeling opvang ontheemden Oekraïne.


      [ref1]: https://wetten.overheid.nl/BWBR0046503#Artikel6
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0046503
        artikel: '6'
        hoofdstuk: IV
  - number: '10.2'
    text: |-
      De hoogte van het bedrag ten behoeve van voedsel, bedoeld in het eerste lid, in de opvangvoorziening waarin de
      ontheemden volledig zelf het eigen eten verzorgen, wordt berekend aan de hand van de volgende bedragen per persoon,
      per maand:
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel10
  - number: 10.2.a
    text: |-
      bij een éénpersoonshuishouden of een huishouden bestaande uit twee gezinsleden: € 252,18 per volwassene of
      alleenstaande minderjarige ontheemde, en € 210,05 per andere minderjarige;
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel10
  - number: 10.2.b
    text: 'bij een huishouden bestaande uit drie gezinsleden: € 214,29 per volwassene, en € 178,53 per minderjarige;'
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel10
  - number: 10.2.c
    text: 'bij een huishouden bestaande uit vier of meer gezinsleden: € 189,13 per volwassene, en € 157,61 per minderjarige.'
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel10
  - number: '10.3'
    text: |-
      De hoogte van het bedrag voor kleding en andere persoonlijke uitgaven, bedoeld in het eerste lid, is: € 62,66 per
      persoon, per maand.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel10
  - number: '10.4'
    text: |-
      De financiële toelage wordt maandelijks op de eerste van de maand en op een door het college van burgemeester en
      wethouders vastgestelde plaats aan de ontheemde beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel10
  - number: '10.5'
    text: |-
      Het college van burgemeester en wethouders kan ten aanzien van de uitkering van de financiële toelage deze,
      of enkel de toelage voor voedsel dan wel de toelage voor kleding en andere persoonlijke uitgaven, in natura
      verstrekken.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel10
  - number: '10.6'
    text: |-
      De financiële toelage voor een ontheemde jonger dan 18 jaar, die een kind is van, onder voogdij staat van, of
      begeleid wordt door, een of meer in de desbetreffende opvangvoorziening verblijvende ontheemden wordt uitbetaald
      aan één van die ontheemden.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel10
  - number: '10.7'
    text: |-
      Aan een ontheemde die overeenkomstig de Regeling Medische zorg Asielzoekers, verblijft in een instelling voor
      langdurige zorg die niet een gemeentelijke opvang is, verstrekt het college van burgemeester en wethouders het
      bedrag voor kleding en andere persoonlijke uitgaven, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel10
  - number: '10.8'
    text: |-
      Het college van burgemeester en wethouders draagt zorg voor de maaltijden in de gemeentelijke opvangvoorziening
      waarin de bewoners niet in de gelegenheid zijn deze zelf te verzorgen.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel10
  - number: '11.1'
    text: |-
      Een ontheemde kan een vergoeding ontvangen voor buitengewone kosten, als bedoeld in
      [artikel 6, eerste lid, onderdeel e][ref1], die hij heeft gemaakt. Voor toepassing van dit artikel wordt onder
      buitengewone kosten mede verstaan kosten die de ontheemde heeft moeten maken die verband houden met het verblijf in
      een instelling voor langdurige zorg, als bedoeld in [artikel 10, zevende lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0046503#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0046503#Artikel10
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0046503
        artikel: '6'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0046503
        artikel: '10'
        hoofdstuk: IV
  - number: '11.2'
    text: |-
      Buitengewone kosten zijn noodzakelijke kosten die vanwege hun aard of hoogte in redelijkheid niet geacht worden
      door de ontheemde zelf te worden betaald.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel11
  - number: '11.3'
    text: |-
      Buitengewone kosten worden slechts betaald indien vooraf door het college van burgemeester en wethouders aan de
      ontheemde toestemming is verleend voor het maken van deze kosten, met uitzondering van kosten die voortvloeien uit
      noodsituaties waarin geen mogelijkheid bestond tot het verzoeken om toestemming.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel11
  - number: '11.4'
    text: |-
      De toestemming, bedoeld in het derde lid, wordt uitsluitend verleend indien de kosten noodzakelijk zijn en niet op
      andere wijze in de betaling kan worden voorzien.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel11
  - number: '11.5'
    text: |-
      Kosten die samenhangen met een door de ontheemde gepleegde onrechtmatige daad, gepleegd misdrijf of begane
      overtreding zijn in ieder geval geen buitengewone kosten, als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel11
  - number: 11a.1
    text: |-
      Een ontheemde kan door het college van burgemeester en wethouders nader aan te wijzen werkzaamheden verrichten in
      en rondom de gemeentelijke opvangvoorziening, voor de uitvoering waarvan een vergoeding kan worden gegeven.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel11a
  - number: 11a.2
    text: |-
      Het college van burgemeester en wethouders zorgt voor een evenredige verdeling van het aanbod van werkzaamheden
      als bedoeld in het eerste lid, over de in de opvangvoorziening verblijvende ontheemden die daarvoor in aanmerking
      wensen te komen.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel11a
  - number: 11a.3
    text: |-
      De vergoeding die een ontheemde ontvangt voor het verrichten van werkzaamheden als bedoeld in het eerste lid,
      bedraagt niet meer dan € 14,– per week.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel11a
  - number: 11a.4
    text: |-
      [Artikel 7, tweede lid][ref1], is niet van toepassing op de situatie, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0046503#Artikel7
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0046503
        artikel: '7'
        hoofdstuk: IV
  - number: '12.1'
    text: |-
      Het college van burgemeester en wethouders verstrekt maandelijks een financiële toelage aan ontheemden die in
      een particuliere opvangvoorziening verblijven binnen de gemeentegrens en zijn ingeschreven in de Basisregistratie
      Personen.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel12
  - number: '12.2'
    text: |-
      De door de ontheemde in particuliere opvangvoorzieningen te ontvangen financiële toelage, bestaat uit een bedrag
      ten behoeve van voedsel, kleding en andere persoonlijke uitgaven en uit een wooncomponent.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel12
  - number: '12.3'
    text: |-
      De hoogte van het bedrag ten behoeve van voedsel, bedoeld in het tweede lid, wordt berekend aan de hand van de
      volgende bedragen per persoon, per maand:
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel12
  - number: 12.3.a
    text: |-
      bij een éénpersoonshuishouden of een huishouden bestaande twee gezinsleden: € 252,18 per volwassenen of
      alleenstaande minderjarige ontheemden, en € 210,05 per kind tot 18 jaar;
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel12
  - number: 12.3.b
    text: 'bij een huishouden bestaande uit drie gezinsleden: € 214,29 per volwassene, en € 178,53 per kind tot 18 jaar;'
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel12
  - number: 12.3.c
    text: 'bij een huishouden bestaande uit vier of meer gezinsleden: € 189,13 per volwassene, en € 157,61 kind tot 18 jaar.'
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel12
  - number: '12.4'
    text: |-
      De hoogte van het bedrag voor kleding en andere persoonlijke uitgaven, bedoeld in het tweede lid, is: € 62,66 per
      persoon, per maand.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel12
  - number: '12.5'
    text: De hoogte van de wooncomponent, bedoeld in het tweede lid, bedraagt per persoon € 77,16 per maand.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel12
  - number: '12.6'
    text: |-
      De financiële toelage wordt maandelijks op de eerste dag van de maand en op een door het college van burgemeester
      en wethouders vastgestelde plaats aan de ontheemde beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel12
  - number: '12.7'
    text: |-
      De financiële toelage voor een ontheemde jonger dan 18 jaar, die een kind is van, onder voogdij staat van, of
      begeleid wordt door, een of meer in de desbetreffende opvangvoorziening verblijvende ontheemden wordt uitbetaald
      aan één van die ontheemden.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel12
  - number: '12.8'
    text: |-
      Het college van burgemeester en wethouders draagt zorg voor een verzekering ten behoeve van de ontheemde tegen de
      financiële gevolgen van wettelijke aansprakelijkheid van de ontheemde jegens een derde.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel12
  - number: '12.9'
    text: Het college van burgemeester en wethouders draagt zorg voor de betaling van buitengewone kosten.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel12
  - number: '12.10'
    text: |-
      Aan een ontheemde die overeenkomstig de regeling medische zorg asielzoekers, verblijft in een instelling voor
      langdurige zorg die niet een particuliere opvanglocatie is en die zorg draagt voor de maaltijden, verstrekt het
      college van burgemeester en wethouders het bedrag voor kleding en andere persoonlijke uitgaven, bedoeld in het
      vierde lid.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel12
  - number: '13.1'
    text: |-
      Het college van burgemeester en wethouders kan de verstrekkingen, bedoeld in [artikel 12, eerste lid][ref1],
      beperken of intrekken indien:


      [ref1]: https://wetten.overheid.nl/BWBR0046503#Artikel12
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0046503
        artikel: '12'
        hoofdstuk: V
  - number: 13.1.a
    text: de particuliere opvang van de ontheemde beëindigd wordt omdat opvang (of onderdak) elders is voorzien;
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel13
  - number: 13.1.b
    text: |-
      de ontheemde de particuliere opvang definitief verlaat of langer dan 28 dagen per kalenderjaar niet in de
      particuliere opvang is verschenen.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel13
  - number: '13.2'
    text: |-
      Het college van burgemeester en wethouders trekt, met ingang van de eerstvolgende maand, de verstrekkingen, bedoeld
      in [artikel 12, eerste lid][ref1], geheel of ten dele in, indien de meerderjarige ontheemde of een meerderjarig
      gezinslid:


      [ref1]: https://wetten.overheid.nl/BWBR0046503#Artikel12
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0046503
        artikel: '12'
        hoofdstuk: V
  - number: 13.2.a
    text: |-
      inkomsten uit arbeid in Nederland of in een ander land heeft en zulks blijkt uit de door de ontheemde opgegeven of
      van het Uitvoeringsinstituut Werknemersverzekeringen ontvangen informatie over zijn inkomsten uit arbeid;
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel13
  - number: 13.2.b
    text: |-
      een loondervingsuitkering of een toeslag op grond van de [Toeslagenwet][ref1] ontvangt;


      [ref1]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004043
  - number: 13.2.c
    text: |-
      gedurende twee weken niet heeft voldaan aan verzoeken van het college van burgemeester en wethouders om informatie
      te verstrekken over zijn inkomsten en gezinssamenstelling, of
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel13
  - number: 13.2.d
    text: inkomsten verborgen heeft gehouden en daardoor ten onrechte van de verstrekkingen gebruik heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel13
  - number: '13.3'
    text: |-
      Het college van burgemeester en wethouders kan de verstrekkingen, bedoeld in [artikel 12, eerste lid][ref1],
      terugvorderen indien deze ten onrechte of tot een te hoog bedrag zijn verstrekt. Het college van burgemeester en
      wethouders vordert niet meer terug dan er is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0046503#Artikel12
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0046503
        artikel: '12'
        hoofdstuk: V
  - number: '15.1'
    text: |-
      Het college van burgemeester en wethouders houdt bij uitvoering van deze regeling rekening met de specifieke
      situatie van kwetsbare ontheemden zoals minderjarigen, personen met een handicap, ouderen, zwangere vrouwen,
      alleenstaande ouders met minderjarige kinderen, personen met ernstige ziekten en personen met mentale stoornissen.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel15
  - number: '15.2'
    text: |-
      Ten uitvoering van het eerste lid bepaalt het college van burgemeester en wethouders of de ontheemde bijzondere
      opvangbehoeften heeft.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel15
  - number: '15.3'
    text: |-
      Indien de ontheemde overeenkomstig het tweede lid bijzondere opvangbehoefte heeft, wordt naast verstrekkingen,
      bedoeld in [artikel 6, eerste lid][ref1] en [artikel 12][ref2], specifieke steun en begeleiding geboden.


      [ref1]: https://wetten.overheid.nl/BWBR0046503#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0046503#Artikel12
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0046503
        artikel: '6'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0046503
        artikel: '12'
        hoofdstuk: V
  - number: '16'
    text: |-
      Bij de uitoefening van de bevoegdheid, bedoeld in [artikel 9, eerste lid][ref1], zorgt het college van burgemeester
      en wethouders ervoor dat:


      [ref1]: https://wetten.overheid.nl/BWBR0017959
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0017959
  - number: 16.a
    text: |-
      minderjarige kinderen van ontheemden of minderjarige ontheemden worden gehuisvest bij hun ouders, bij hun
      ongehuwde broers of zussen of bij de volwassene die krachtens het recht of de praktijk van Nederland voor hen
      verantwoordelijk is, mits het in het belang van de betrokken minderjarige is;
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel16
  - number: 16.b
    text: |-
      afhankelijke meerderjarige ontheemden met bijzondere opvangbehoeften worden ondergebracht bij meerderjarige nauwe
      verwanten die zich reeds in Nederland bevinden en die volgens het recht of de praktijk voor hen verantwoordelijk
      zijn.
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel16
  - number: '17'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop het koninklijk besluit van 31 maart 2022, houdende
      inwerkingstelling van de [artikelen 2c][ref1] en [4 van de Wet verplaatsing bevolking][ref2] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0002097#Artikel2c
      [ref2]: https://wetten.overheid.nl/BWBR0002097#Artikel4
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002097
        artikel: 2c
      - id: ref2
        bwb_id: BWBR0002097
        artikel: '4'
  - number: '18'
    text: 'Deze regeling wordt aangehaald als: Regeling opvang ontheemden Oekraïne.'
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel18
