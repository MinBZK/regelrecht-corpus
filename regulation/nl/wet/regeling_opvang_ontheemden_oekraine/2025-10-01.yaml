---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_opvang_ontheemden_oekraine
regulatory_layer: WET
publication_date: '2025-09-03'
valid_from: '2025-10-01'
bwb_id: BWBR0046503
url: https://wetten.overheid.nl/BWBR0046503/2025-10-01
preamble:
  text: |-
    Gelet op artikel 4, tweede lid, van de Wet verplaatsing bevolking;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Voor de toepassing van deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel1
  - number: 1.a
    text: |-
      *college van burgemeester en wethouders:* het college van burgemeester en wethouders van de gemeente waarin de
      opvangvoorziening gelegen is;
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel1
  - number: 1.b
    text: '*opvangvoorziening:* een accommodatie waarin onderdak wordt geboden aan ontheemden;'
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel1
  - number: 1.c
    text: |-
      *ontheemde:* de vreemdeling die tijdelijke bescherming geniet als bedoeld in
      [artikel 1 van de Vreemdelingenwet 2000][ref1], omdat hij onder de reikwijdte valt van het Uitvoeringsbesluit van
      4 maart 2022 van de [richtlijn 2001/55/EG](32001L0055) of een verlenging daarvan;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel1
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '1'
  - number: 1.d
    text: |-
      *richtlijn:* [richtlijn 2001/55/EG](32001L0055) van de raad van 20 juli 2001 betreffende minimumnormen voor het
      verlenen van tijdelijke bescherming in geval van massale toestroom van ontheemden en maatregelen ter bevordering
      van een evenwicht tussen de inspanning van de lidstaten voor de opvang en het dragen van de consequenties van de
      opvang van deze personen (PbEU L 212/12);
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel1
  - number: 1.e
    text: |-
      *uitvoeringsbesluit:* uitvoeringsbesluit (EU) 2022/382 van de Raad van 4 maart 2022 tot vaststelling van het
      bestaan van een massale toestroom van ontheemden uit Oekraïne in de zin van artikel 5 van [Richtlijn 2001/55/EG]
      (32001L0055), en tot invoering van tijdelijke bescherming naar aanleiding daarvan (PbEU 2022, L 71);
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel1
  - number: 1.f
    text: |-
      *gezinsleden:* de volgende leden van het gezin van de ontheemde die in verband met de tijdelijke bescherming in
      Nederland aanwezig zijn:
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel1
  - number: 1.f.1°
    text: echtgenoten of aan gehuwden gelijkgestelde partners;
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel1
  - number: 1.f.2°
    text: hun minderjarige kinderen, mits zij ongehuwd en van hun afhankelijk zijn;
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel1
  - number: 1.f.3°
    text: |-
      de vader, moeder, of een andere volwassene die volgens het recht of de praktijk in Nederland verantwoordelijk is
      voor de minderjarige en ongehuwde ontheemde;
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel1
  - number: 1.g
    text: |-
      *gemeentelijke opvangvoorziening:* door of vanwege het college van burgemeester en wethouders aangeboden of
      beschikbaar gestelde opvangvoorziening voor ontheemden;
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel1
  - number: 1.h
    text: '*particuliere opvangvoorziening:* opvangvoorziening voor ontheemden, anders dan:'
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel1
  - number: 1.h.1°
    text: een gemeentelijke opvangvoorziening; of
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel1
  - number: 1.h.2°
    text: een woning van de ontheemde of van een gezinslid van de ontheemde;
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel1
  - number: 1.i
    text: |-
      *loondervingsuitkering:* een uitkering krachtens de verplichte verzekering op grond van de
      [Werkloosheidswet][ref1], de [Ziektewet][ref2], de [Wet werk en inkomen naar arbeidsvermogen][ref3],
      de [Wet op de arbeidsongeschiktheidsverzekering][ref4] en de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref5], alsmede een uitkering of
      inkomensvoorziening op grond van de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref6],
      op grond van [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref7] aan de
      werknemer of de gelijkgestelde, bedoeld in [artikel 3:6, eerste lid, van die wet][ref8], de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref9] en de [Wet inkomensvoorziening oudere werklozen][ref10];


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0019057
      [ref4]: https://wetten.overheid.nl/BWBR0002524
      [ref5]: https://wetten.overheid.nl/BWBR0008656
      [ref6]: https://wetten.overheid.nl/BWBR0008657
      [ref7]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
      [ref8]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref9]: https://wetten.overheid.nl/BWBR0002822
      [ref10]: https://wetten.overheid.nl/BWBR0024394
    url: https://wetten.overheid.nl/BWBR0046503/2025-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0019057
      - id: ref4
        bwb_id: BWBR0002524
      - id: ref5
        bwb_id: BWBR0008656
      - id: ref6
