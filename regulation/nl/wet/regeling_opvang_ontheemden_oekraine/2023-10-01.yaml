---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_opvang_ontheemden_oekraine
regulatory_layer: WET
publication_date: '2025-09-03'
valid_from: '2023-10-01'
bwb_id: BWBR0046503
url: https://wetten.overheid.nl/BWBR0046503/2023-10-01
preamble:
  text: |-
    Gelet op artikel 4, tweede lid, van de Wet verplaatsing bevolking;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Voor de toepassing van deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel1
  - number: 1.a
    text: '*burgemeester:* de burgemeester van de gemeente waarin de opvangvoorziening gelegen is;'
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel1
  - number: 1.b
    text: '*opvangvoorziening:* een accommodatie waarin onderdak wordt geboden aan ontheemden;'
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel1
  - number: 1.c
    text: |-
      *ontheemde:* de vreemdeling die tijdelijke bescherming geniet als bedoeld in
      [artikel 1 van de Vreemdelingenwet 2000][ref1], omdat hij onder de reikwijdte valt van het Uitvoeringsbesluit van
      4 maart 2022 van de [richtlijn 2001/55/EG](32001L0055) of een verlenging daarvan;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel1
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '1'
  - number: 1.d
    text: |-
      *richtlijn:* [richtlijn 2001/55/EG](32001L0055) van de raad van 20 juli 2001 betreffende minimumnormen voor het
      verlenen van tijdelijke bescherming in geval van massale toestroom van ontheemden en maatregelen ter bevordering
      van een evenwicht tussen de inspanning van de lidstaten voor de opvang en het dragen van de consequenties van de
      opvang van deze personen (PbEU L 212/12);
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel1
  - number: 1.e
    text: |-
      *uitvoeringsbesluit:* uitvoeringsbesluit (EU) 2022/382 van de Raad van 4 maart 2022 tot vaststelling van het
      bestaan van een massale toestroom van ontheemden uit Oekraïne in de zin van artikel 5 van [Richtlijn 2001/55/EG]
      (32001L0055), en tot invoering van tijdelijke bescherming naar aanleiding daarvan (PbEU 2022, L 71);
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel1
  - number: 1.f
    text: '*Minister:* de Minister van Justitie en Veiligheid;'
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel1
  - number: 1.g
    text: |-
      *gezinsleden:* de volgende leden van het gezin van de ontheemde die in verband met de tijdelijke bescherming in
      Nederland aanwezig zijn:
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel1
  - number: 1.g.1°
    text: echtgenoten of aan gehuwden gelijkgestelde partners;
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel1
  - number: 1.g.2°
    text: hun minderjarige kinderen, mits zij ongehuwd en van hun afhankelijk zijn;
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel1
  - number: 1.g.3°
    text: |-
      de vader, moeder, of een andere volwassene die volgens het recht of de praktijk in Nederland verantwoordelijk is
      voor de minderjarige en ongehuwde ontheemde;
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel1
  - number: 1.h
    text: |-
      *gemeentelijke opvangvoorziening:* door of vanwege de burgemeester aangeboden of beschikbaar gestelde
      opvangvoorziening voor ontheemden;
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel1
  - number: 1.i
    text: '*particuliere opvangvoorziening:* opvangvoorziening voor ontheemden, anders dan:'
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel1
  - number: 1.i.1°
    text: een gemeentelijke opvangvoorziening; of
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel1
  - number: 1.i.2°
    text: een woning van de ontheemde of van een gezinslid van de ontheemde;
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel1
  - number: 1.j
    text: |-
      *loondervingsuitkering:* een uitkering krachtens de verplichte verzekering op grond van de
      [Werkloosheidswet][ref1], de [Ziektewet][ref2], de [Wet werk en inkomen naar arbeidsvermogen][ref3],
      de [Wet op de arbeidsongeschiktheidsverzekering][ref4] en de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref5], alsmede een uitkering of
      inkomensvoorziening op grond van de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref6],
      op grond van [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref7] aan de
      werknemer of de gelijkgestelde, bedoeld in [artikel 3:6, eerste lid, van die wet][ref8], de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref9] en de [Wet inkomensvoorziening oudere werklozen][ref10];


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0019057
      [ref4]: https://wetten.overheid.nl/BWBR0002524
      [ref5]: https://wetten.overheid.nl/BWBR0008656
      [ref6]: https://wetten.overheid.nl/BWBR0008657
      [ref7]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
      [ref8]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref9]: https://wetten.overheid.nl/BWBR0002822
      [ref10]: https://wetten.overheid.nl/BWBR0024394
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0019057
      - id: ref4
        bwb_id: BWBR0002524
      - id: ref5
        bwb_id: BWBR0008656
      - id: ref6
        bwb_id: BWBR0008657
      - id: ref7
        bwb_id: BWBR0013008
        paragraaf: '1'
      - id: ref8
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref9
        bwb_id: BWBR0002822
      - id: ref10
        bwb_id: BWBR0024394
  - number: 1.k
    text: |-
      *alleenstaande minderjarige ontheemde:* ontheemde die de leeftijd van 18 jaar nog niet heeft bereikt en die zonder
      begeleiding of verzorging van een ouder of voogd in Nederland verblijft;
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel1
  - number: 1.l
    text: |-
      *begeleider:* meerderjarige begeleider van een alleenstaande minderjarige ontheemde, niet zijnde de ouder of voogd,
      die met de alleenstaande minderjarige ontheemde in dezelfde gemeentelijke of particuliere opvanglocatie verblijft.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel1
  - number: '2.1'
    text: |-
      De burgemeester draagt zorg voor de opvang van ontheemden. De in de eerste volzin bedoelde taak is niet van
      toepassing op alleenstaande minderjarige ontheemden.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel2
  - number: '2.2'
    text: |-
      De burgemeester verstrekt aan de ontheemde die wordt opgevangen in een gemeentelijke opvangvoorziening of een
      particuliere opvangvoorziening, binnen een redelijke termijn, maar ten hoogste vijftien dagen na de aanvang van de
      opvang in een gemeentelijke of particuliere opvangvoorziening informatie over:
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel2
  - number: 2.2.a
    text: |-
      de geldende verstrekkingen alsook over de verplichtingen die de ontheemde moet nakomen in verband met de
      opvangvoorzieningen;
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel2
  - number: 2.2.b
    text: organisaties of groepen van personen die specifieke rechtsbijstand verlenen;
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel2
  - number: 2.2.c
    text: de opvangvoorzieningen, waaronder medische zorg;
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel2
  - number: 2.2.d
    text: de geldende verplichtingen over inschrijving in de Basisregistratie Personen en uitschrijving bij verhuizing.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel2
  - number: '2.3'
    text: |-
      De burgemeester zorgt ervoor dat de in het tweede lid bedoelde informatie schriftelijk wordt verstrekt in een taal
      die de ontheemde begrijpt of waarvan redelijkerwijs kan worden aangenomen dat hij deze begrijpt. In voorkomende
      gevallen kan deze informatie tevens mondeling verstrekt worden zonder begeleider.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel2
  - number: '3'
    text: |-
      De burgemeester kan een tijdelijke alternatieve opvangvoorziening beschikbaar stellen die voldoet aan de
      minimumnormen zoals opgenomen in deze regeling indien:
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel3
  - number: 3.a
    text: er geen opvangvoorziening meer beschikbaar is; of
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel3
  - number: 3.b
    text: de specifieke situatie en bijzondere opvangbehoeften van een kwetsbare ontheemde andersoortige opvang vereist.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel3
  - number: '4.1'
    text: |-
      De burgemeester kan een ontheemde uitsluiten van de opvang, bedoeld in het [artikel 2, eerste lid][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0046503#Artikel2
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0046503
        artikel: '2'
        hoofdstuk: I
  - number: 4.1.a
    text: de ontheemde rechtens van zijn vrijheid is ontnomen;
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel4
  - number: 4.1.b
    text: |-
      door de Minister belast met de uitvoering van de [Vreemdelingenwet 2000][ref1] is geoordeeld dat betrokkene
      tijdelijke bescherming wordt geweigerd vanwege het bepaalde in artikel 28 van de Richtlijn;


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 4.1.c
    text: de ontheemde tevens de Nederlandse nationaliteit bezit.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel4
  - number: '4.2'
    text: |-
      Het recht op opvang van een ontheemde wiens asielaanvraag die recht op opvang heeft gegeven is
      afgewezen, eindigt indien de tijdelijke bescherming is geëindigd en de vertrektermijn als bedoeld in
      [artikel 62 van de Vreemdelingenwet 2000][ref1] is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '62'
  - number: '5.1'
    text: |-
      De opvangvoorziening voldoet aan een toereikend huisvestingsniveau, waaronder ten minste wordt begrepen de
      aanwezigheid van een adequate bescherming tegen weersinvloeden, van verwarming, sanitaire voorzieningen en zit-
      en slaapgelegenheid.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel5
  - number: '5.2'
    text: Indien mogelijk wordt voorzien in de gelegenheid tot het bereiden van maaltijden.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel5
  - number: '5.3'
    text: Van de in het eerste lid genoemde criteria kan worden afgeweken gedurende de eerste acute opvang.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel5
  - number: '6.1'
    text: 'De opvang omvat in elk geval de volgende verstrekkingen:'
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel6
  - number: 6.1.a
    text: onderdak in opvangvoorzieningen die een toereikend huisvestingsniveau bieden;
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel6
  - number: 6.1.b
    text: |-
      een maandelijkse financiële toelage ten behoeve van voedsel, kleding en andere persoonlijke uitgaven, tenzij de
      ontheemde inkomsten uit arbeid heeft;
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel6
  - number: 6.1.c
    text: recreatieve en educatieve activiteiten;
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel6
  - number: 6.1.d
    text: een verzekering tegen de financiële gevolgen van wettelijke aansprakelijkheid; en
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel6
  - number: 6.1.e
    text: betaling van buitengewone kosten.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel6
  - number: '6.2'
    text: 'De burgemeester draagt er zorg voor dat tijdens de opvang:'
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel6
  - number: 6.2.a
    text: de ontheemde bescherming van zijn gezinsleven geniet;
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel6
  - number: 6.2.b
    text: |-
      de ontheemde de mogelijkheid heeft om te communiceren met familieleden, juridisch adviseurs of raadslieden
      en vertegenwoordigers van de Hoge Commissaris der Verenigde Naties voor Vluchtelingen en andere relevante,
      internationale en niet-gouvernementele organisaties en instanties;
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel6
  - number: 6.2.c
    text: aan de ontheemde in de leerplichtige leeftijd onderwijs wordt geboden.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel6
  - number: '6.3'
    text: |-
      De burgemeester stelt voor elke opvangvoorziening een huishoudelijk reglement op waarin tenminste passende
      maatregelen zijn opgenomen om geweldpleging en gendergerelateerd geweld, met inbegrip van aanranding en seksuele
      intimidatie, te voorkomen en de verplichting van de ontheemde om:
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel6
  - number: 6.3.a
    text: de huisregels na te leven die zijn neergelegd in het reglement van de desbetreffende opvangvoorziening;
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel6
  - number: 6.3.b
    text: gevolg te geven aan de aanwijzingen van het personeel van de desbetreffende opvangvoorziening;
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel6
  - number: 6.3.c
    text: schoonmaakwerkzaamheden te verrichten in en rond de woonruimte; en
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel6
  - number: 6.3.d
    text: |-
      toegang te verlenen aan het personeel van de opvangvoorziening tot zijn woonruimte indien een redelijk vermoeden
      bestaat dat de ontheemde de huisregels overtreedt of indien dit voor het beheer van de opvangvoorziening
      redelijkerwijs noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel6
  - number: '7.1'
    text: |-
      De burgemeester kan de verstrekkingen, bedoeld in [artikel 6, eerste lid][ref1], beperken of intrekken indien:


      [ref1]: https://wetten.overheid.nl/BWBR0046503#Artikel6
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0046503
        artikel: '6'
        hoofdstuk: IV
  - number: 7.1.a
    text: de opvang van de ontheemde beëindigd wordt omdat opvang (of onderdak) elders is voorzien;
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel7
  - number: 7.1.b
    text: |-
      de ontheemde de opvang definitief verlaat of gedurende een periode van 28 dagen niet in de opvang is verschenen
      zonder de burgemeester hiervan op de hoogte te stellen;
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel7
  - number: 7.1.c
    text: |-
      de ontheemde ernstig inbreuk maakt op de verplichtingen, genoemd in [artikel 6, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0046503#Artikel6
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0046503
        artikel: '6'
        hoofdstuk: IV
  - number: 7.1.d
    text: |-
      de ontheemde een ernstige vorm van geweld pleegt jegens medebewoners die in dezelfde opvangvoorziening verblijven,
      aan personen die werkzaam zijn in de voorziening, of aan anderen.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel7
  - number: '7.2'
    text: |-
      De burgemeester kan de verstrekkingen, bedoeld in [artikel 6, eerste lid, aanhef en onder b][ref1], geheel of
      ten dele intrekken indien de ontheemde of een meerderjarig gezinslid inkomsten uit arbeid in Nederland of in een
      ander land heeft en zulks blijkt uit de door de ontheemde opgegeven informatie over zijn inkomsten uit arbeid
      of indien de ontheemde of een meerderjarig gezinslid een loonderveringsuitkering of een toeslag op grond van de
      [Toeslagenwet][ref2] ontvangt. Hierbij geldt de eerste dag van de daaropvolgende maand als peildatum.


      [ref1]: https://wetten.overheid.nl/BWBR0046503#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0046503
        artikel: '6'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004043
  - number: '8.1'
    text: |-
      De burgemeester kan de verstrekkingen, bedoeld in [artikel 6, eerste lid, onder b][ref1], terugvorderen indien de
      verstrekkingen ten onrechte of tot een te hoog bedrag zijn verstrekt aan de ontheemde.


      [ref1]: https://wetten.overheid.nl/BWBR0046503#Artikel6
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0046503
        artikel: '6'
        hoofdstuk: IV
  - number: '8.2'
    text: De burgemeester vordert niet meer terug dan er is verstrekt.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel8
  - number: '9.1'
    text: |-
      De burgemeester bepaalt in welke opvangvoorziening binnen de gemeente een ontheemde wordt geplaatst en is bevoegd
      een ontheemde naar een andere voorziening binnen de gemeente over te plaatsen indien dit in het belang van de
      openbare orde of de veiligheid van andere ontheemden noodzakelijk wordt geacht.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel9
  - number: '9.2'
    text: |-
      Bij de uitoefening van de bevoegdheid, bedoeld in het eerste lid, zorgt de burgemeester ervoor dat de eenheid van
      het gezin in de mate van het mogelijke en met instemming van de betrokken gezinsleden bewaard wordt.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel9
  - number: '10.1'
    text: |-
      De door de ontheemde te ontvangen financiële toelage, bedoeld in [artikel 6, eerste lid, aanhef en onder b][ref1],
      van deze regeling, bestaat uit een bedrag ten behoeve van voedsel en een bedrag ten behoeve van kleding en andere
      persoonlijke uitgaven conform de Bekostigingsregeling opvang ontheemden Oekraïne.


      [ref1]: https://wetten.overheid.nl/BWBR0046503#Artikel6
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0046503
        artikel: '6'
        hoofdstuk: IV
  - number: '10.2'
    text: |-
      De hoogte van het bedrag ten behoeve van voedsel, bedoeld in het eerste lid, in de opvangvoorziening waarin de
      ontheemden volledig zelf het eigen eten verzorgen, wordt berekend aan de hand van de volgende bedragen per persoon,
      per maand:
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel10
  - number: 10.2.a
    text: |-
      bij een éénpersoonshuishouden of een huishouden bestaande uit twee gezinsleden: € 242,48 per volwassene of
      alleenstaande minderjarige ontheemde, en € 200,65 per andere minderjarige;
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel10
  - number: 10.2.b
    text: 'bij een huishouden bestaande uit drie gezinsleden: € 193,98 per volwassene, en € 160,64 per minderjarige;'
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel10
  - number: 10.2.c
    text: 'bij een huishouden bestaande uit vier of meer gezinsleden: € 169,74 per volwassene, en € 140,34 per minderjarige.'
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel10
  - number: '10.3'
    text: |-
      De hoogte van het bedrag voor kleding en andere persoonlijke uitgaven, bedoeld in het eerste lid, is: € 60,71 per
      persoon, per maand.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel10
  - number: '10.4'
    text: |-
      De financiële toelage wordt maandelijks op de eerste van de maand en op een door de burgemeester vastgestelde
      plaats aan de ontheemde beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel10
  - number: '10.5'
    text: |-
      De burgemeester kan ten aanzien van de uitkering van de financiële toelage deze, of enkel de toelage voor voedsel
      dan wel de toelage voor kleding en andere persoonlijke uitgaven, in natura verstrekken.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel10
  - number: '10.6'
    text: |-
      De financiële toelage voor een ontheemde jonger dan 18 jaar, die een kind is van, onder voogdij staat van, of
      begeleid wordt door, een of meer in de desbetreffende opvangvoorziening verblijvende ontheemden wordt uitbetaald
      aan één van die ontheemden.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel10
  - number: '10.7'
    text: |-
      Aan een ontheemde die overeenkomstig de Regeling Medische zorg Asielzoekers, verblijft in een instelling voor
      langdurige zorg die niet een gemeentelijke opvang is, verstrekt de burgemeester het bedrag voor kleding en andere
      persoonlijke uitgaven, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel10
  - number: '10.8'
    text: |-
      De burgemeester draagt zorg voor de maaltijden in de gemeentelijke opvangvoorziening waarin de bewoners niet in de
      gelegenheid zijn deze zelf te verzorgen.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel10
  - number: '11.1'
    text: |-
      Een ontheemde kan een vergoeding ontvangen voor buitengewone kosten, als bedoeld in
      [artikel 6, eerste lid, onderdeel e][ref1], die hij heeft gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0046503#Artikel6
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0046503
        artikel: '6'
        hoofdstuk: IV
  - number: '11.2'
    text: |-
      Buitengewone kosten zijn noodzakelijke kosten die vanwege hun aard of hoogte in redelijkheid niet geacht worden
      door de ontheemde zelf te worden betaald.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel11
  - number: '11.3'
    text: |-
      Buitengewone kosten worden slechts betaald indien vooraf door de burgemeester aan de ontheemde toestemming is
      verleend voor het maken van deze kosten, met uitzondering van kosten die voortvloeien uit noodsituaties waarin geen
      mogelijkheid bestond tot het verzoeken om toestemming.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel11
  - number: '11.4'
    text: |-
      De toestemming, bedoeld in het derde lid, wordt uitsluitend verleend indien de kosten noodzakelijk zijn en niet op
      andere wijze in de betaling kan worden voorzien.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel11
  - number: '11.5'
    text: |-
      Kosten die samenhangen met een door de ontheemde gepleegde onrechtmatige daad, gepleegd misdrijf of begane
      overtreding zijn in ieder geval geen buitengewone kosten, als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel11
  - number: 11a.1
    text: |-
      Een ontheemde kan door de burgemeester nader aan te wijzen werkzaamheden verrichten in en rondom de gemeentelijke
      opvangvoorziening, voor de uitvoering waarvan een vergoeding kan worden gegeven.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel11a
  - number: 11a.2
    text: |-
      De burgemeester zorgt voor een evenredige verdeling van het aanbod van werkzaamheden als bedoeld in het eerste lid,
      over de in de opvangvoorziening verblijvende ontheemden die daarvoor in aanmerking wensen te komen.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel11a
  - number: 11a.3
    text: |-
      De vergoeding die een ontheemde ontvangt voor het verrichten van werkzaamheden als bedoeld in het eerste lid,
      bedraagt niet meer dan € 14,– per week.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel11a
  - number: 11a.4
    text: |-
      [Artikel 7, tweede lid][ref1], is niet van toepassing op de situatie, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0046503#Artikel7
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0046503
        artikel: '7'
        hoofdstuk: IV
  - number: '12.1'
    text: |-
      De burgemeester verstrekt maandelijks een financiële toelage aan ontheemden die in een particuliere
      opvangvoorziening verblijven binnen de gemeentegrens en zijn ingeschreven in de Basisregistratie Personen.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel12
  - number: '12.2'
    text: |-
      De door de ontheemde in particuliere opvangvoorzieningen te ontvangen financiële toelage, bestaat uit een bedrag
      ten behoeve van voedsel, kleding en andere persoonlijke uitgaven en uit een wooncomponent.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel12
  - number: '12.3'
    text: |-
      De hoogte van het bedrag ten behoeve van voedsel, bedoeld in het tweede lid, wordt berekend aan de hand van de
      volgende bedragen per persoon, per maand:
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel12
  - number: 12.3.a
    text: |-
      bij een éénpersoonshuishouden of een huishouden bestaande twee gezinsleden: € 242,48 per volwassenen of
      alleenstaande minderjarige ontheemden, en € 200,65 per kind tot 18 jaar;
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel12
  - number: 12.3.b
    text: 'bij een huishouden bestaande uit drie gezinsleden: € 193,98 per volwassene, en € 160,64 per kind tot 18 jaar;'
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel12
  - number: 12.3.c
    text: 'bij een huishouden bestaande uit vier of meer gezinsleden: € 169,74 per volwassene, en € 140,34 kind tot 18 jaar.'
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel12
  - number: '12.4'
    text: |-
      De hoogte van het bedrag voor kleding en andere persoonlijke uitgaven, bedoeld in het tweede lid, is: € 60,71 per
      persoon, per maand.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel12
  - number: '12.5'
    text: De hoogte van de wooncomponent, bedoeld in het tweede lid, bedraagt per persoon € 80,91 per maand.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel12
  - number: '12.6'
    text: |-
      De financiële toelage wordt maandelijks op de eerste dag van de maand en op een door de burgemeester vastgestelde
      plaats aan de ontheemde beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel12
  - number: '12.7'
    text: |-
      De financiële toelage voor een ontheemde jonger dan 18 jaar, die een kind is van, onder voogdij staat van, of
      begeleid wordt door, een of meer in de desbetreffende opvangvoorziening verblijvende ontheemden wordt uitbetaald
      aan één van die ontheemden.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel12
  - number: '12.8'
    text: |-
      De burgemeester draagt zorg voor een verzekering ten behoeve van de ontheemde tegen de financiële gevolgen van
      wettelijke aansprakelijkheid van de ontheemde jegens een derde.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel12
  - number: '12.9'
    text: De burgemeester draagt zorg voor de betaling van buitengewone kosten.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel12
  - number: '12.10'
    text: |-
      Aan een ontheemde die overeenkomstig de regeling medische zorg asielzoekers, verblijft in een instelling voor
      langdurige zorg die niet een particuliere opvanglocatie is en die zorg draagt voor de maaltijden, verstrekt de
      burgemeester het bedrag voor kleding en andere persoonlijke uitgaven, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel12
  - number: '13.1'
    text: |-
      De burgemeester kan de verstrekkingen, bedoeld in [artikel 12, eerste lid][ref1], beperken of intrekken indien:


      [ref1]: https://wetten.overheid.nl/BWBR0046503#Artikel12
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0046503
        artikel: '12'
        hoofdstuk: V
  - number: 13.1.a
    text: de particuliere opvang van de ontheemde beëindigd wordt omdat opvang (of onderdak) elders is voorzien;
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel13
  - number: 13.1.b
    text: |-
      de ontheemde de particuliere opvang definitief verlaat of gedurene een periode van 28 dagen niet in de particuliere
      opvang is verschenen.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel13
  - number: '13.2'
    text: |-
      De burgemeester kan de verstrekkingen, bedoeld in [artikel 12, eerste lid][ref1], geheel of ten dele
      intrekken indien de ontheemde of een meerderjarig lid van zijn gezin inkomsten uit arbeid in Nederland of
      in een ander land heeft en zulks blijkt uit de door de ontheemde opgegeven informatie over zijn inkomsten
      uit arbeid of indien de ontheemde of een meederjarig gezinslid een loonderveringsuitkering als bedoeld in
      [artikel 1, eerste lid, onderdeel d, van de Toeslagenwet][ref2] ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0046503#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0004043#Artikel1
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0046503
        artikel: '12'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004043
        artikel: '1'
  - number: '14.1'
    text: |-
      De burgemeester kan de verstrekkingen, bedoeld in [artikel 12, eerste lid][ref1], terugvorderen voor zover de
      verstrekkingen:


      [ref1]: https://wetten.overheid.nl/BWBR0046503#Artikel12
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0046503
        artikel: '12'
        hoofdstuk: V
  - number: 14.1.a
    text: ten onrechte of tot een te hoog bedrag zijn verstrekt aan de ontheemde.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel14
  - number: '14.2'
    text: De burgemeester vordert niet meer terug dan er is verstrekt.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel14
  - number: '15.1'
    text: |-
      De burgemeester houdt bij uitvoering van deze regeling rekening met de specifieke situatie van kwetsbare ontheemden
      zoals minderjarigen, personen met een handicap, ouderen, zwangere vrouwen, alleenstaande ouders met minderjarige
      kinderen, personen met ernstige ziekten en personen met mentale stoornissen.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel15
  - number: '15.2'
    text: Ten uitvoering van het eerste lid bepaalt de burgemeester of de ontheemde bijzondere opvangbehoeften heeft.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel15
  - number: '15.3'
    text: |-
      Indien de ontheemde overeenkomstig het tweede lid bijzondere opvangbehoefte heeft, wordt naast verstrekkingen,
      bedoeld in [artikel 6, eerste lid][ref1] en [artikel 12][ref2], specifieke steun en begeleiding geboden.


      [ref1]: https://wetten.overheid.nl/BWBR0046503#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0046503#Artikel12
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0046503
        artikel: '6'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0046503
        artikel: '12'
        hoofdstuk: V
  - number: '16'
    text: |-
      Bij de uitoefening van de bevoegdheid, bedoeld in [artikel 9, eerste lid](onbekend), zorgt de burgemeester ervoor
      dat:
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel16
  - number: 16.a
    text: |-
      minderjarige kinderen van ontheemden of minderjarige ontheemden worden gehuisvest bij hun ouders, bij hun
      ongehuwde broers of zussen of bij de volwassene die krachtens het recht of de praktijk van Nederland voor hen
      verantwoordelijk is, mits het in het belang van de betrokken minderjarige is;
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel16
  - number: 16.b
    text: |-
      afhankelijke meerderjarige ontheemden met bijzondere opvangbehoeften worden ondergebracht bij meerderjarige nauwe
      verwanten die zich reeds in Nederland bevinden en die volgens het recht of de praktijk voor hen verantwoordelijk
      zijn.
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel16
  - number: '17'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop het koninklijk besluit van 31 maart 2022, houdende
      inwerkingstelling van de [artikelen 2c][ref1] en [4 van de Wet verplaatsing bevolking][ref2] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0002097#Artikel2c
      [ref2]: https://wetten.overheid.nl/BWBR0002097#Artikel4
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002097
        artikel: 2c
      - id: ref2
        bwb_id: BWBR0002097
        artikel: '4'
  - number: '18'
    text: 'Deze regeling wordt aangehaald als: Regeling opvang ontheemden Oekraïne.'
    url: https://wetten.overheid.nl/BWBR0046503/2023-10-01#Artikel18
