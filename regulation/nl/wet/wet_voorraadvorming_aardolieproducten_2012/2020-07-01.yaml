preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Wet voorraadvorming aardolieproducten 2001 integraal
    te herzien ter implementatie van Richtlijn 2009/119/EG van de Raad van 14 september 2009, houdende verplichting
    voor de lidstaten om minimumvoorraden ruwe aardolie en/of aardolieproducten in opslag te houden (PbEU 2009, L 265);

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *bilateraal akkoord:* tussen Nederland
      en een andere staat geldend verdrag als bedoeld in artikel 3 van de bijlage bij de Overeenkomst inzake een
      Internationaal Energieprogramma (Trb. 1975, 47);
        - *binnenlands verbruik:* het overeenkomstig bijlage II van [richtlijn 2009/119/EG](32009L0119) berekende totaal
      van de in Nederland geleverde hoeveelheden aardolieproducten voor energie- en niet-energiedoeleinden, met dien
      verstande dat dit totaal bestaat uit de leveringen aan de omzettingssector, de industrie, de vervoersector,
      de huishoudens en andere sectoren met het oog op eindverbruik; dit totaal omvat mede het eigen gebruik van de
      energiesector zelf (met uitzondering van het verbruik van raffinaderijbrandstof);
        - *biobrandstof:* voor vervoer bestemde vloeibare of gasvormige brandstof gemaakt uit biomassa, waarbij onder
      «biomassa» wordt verstaan het biologisch afbreekbare deel van producten, afvalstoffen en residuen van de landbouw
      (met inbegrip van plantaardige en dierlijke stoffen), de bosbouw en aanverwante bedrijfstakken, alsmede het
      biologisch afbreekbare deel van industrieel en huishoudelijk afval;
        - *bunkervoorraden van de internationale zeescheepvaart:* totaal dat is gedefinieerd in bijlage A, punt 2.1,
      van [Verordening (EG) nr. 1099/2008](32008R1099) van het Europees Parlement en de Raad van de Europese Unie van
      22 oktober 2008 (PbEU 2008, L 304) betreffende energiestatistieken;
        - *centrale entiteit:* instelling of dienst als bedoeld in artikel 7 van [richtlijn 2009/119/EG](32009L0119)
      waaraan de bevoegdheid is gegeven om te handelen met het oog op het kopen, in stand houden en verkopen van
      olievoorraden, met inbegrip van veiligheidsvoorraden en speciale voorraden;
        - *COVA:* Stichting Centraal Orgaan Voorraadvorming Aardolieproducten, zijnde voor Nederland de centrale entiteit;
        - *internationale verplichtingen:* verplichtingen tot het aanhouden van een voorraad aardolieproducten,
      voortvloeiend uit de Overeenkomst inzake een Internationaal Energieprogramma (Trb. 1975, 47) en uit [richtlijn
      2009/119/EG](32009L0119);
        - *marktdeelnemer:* vergunninghouder als bedoeld in [artikel 4, eerste lid, onder a][ref1];
        - *olievoorraden:* voorraden ruwe aardolie of andere aardolieproducten, gedefinieerd in bijlage C, punt 3.1, van
      [Verordening (EG) nr. 1099/2008](32008R1099) van het Europees Parlement en de Raad van 22 oktober 2008 betreffende
      energiestatistieken (PbEG 2008, L 304);
        - *Onze Minister:* Onze Minister van Economische Zaken en Klimaat;
        - *referentiejaar:* kalenderjaar dat voorafgaat aan het voorraadjaar;
        - *richtlijn 2009/119/EG:* [Richtlijn 2009/119/EG](32009L0119) van de Raad van 14 september 2009 houdende
      verplichting voor de lidstaten om minimumvoorraden ruwe aardolie en/of aardolieproducten in opslag te houden (PbEU
      2009, L 265);
        - *speciale voorraad:* olievoorraad die voldoet aan de in artikel 9, eerste tot en met vierde lid, van [richtlijn
      2009/119/EG](32009L0119) genoemde voorwaarden;
        - *toevoegingen:* andere stoffen dan koolwaterstoffen die aan een product worden toegevoegd of erdoor worden
      gemengd om de eigenschappen ervan te veranderen;
        - *uitslag:* uitslag tot verbruik als bedoeld in [artikel 2 van de Wet op de accijns][ref2], met uitzondering van
      afleveringen met bestemming internationale zeevaart;
        - *veiligheidsvoorraden:* olievoorraden die elke lidstaat van de Europese Unie op grond van artikel 3 van
      [richtlijn 2009/119/EG](32009L0119) verplicht is aan te houden;
        - *voorraadjaar:* tijdvak van 12 maanden dat begint op 1 april van enig jaar;
        - *voorraadplichtige:* degene die op grond van deze wet een voorraad aardolieproducten moet aanhouden;
        - *wettelijke voorraad:* voorraad aardolieproducten waarmee wordt beoogd aan de voor Nederland geldende
      internationale verplichtingen te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0032775#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel2
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0032775
        artikel: '4'
