        artikel: '2'
  - number: '2'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde worden aardolieproducten, zoals die nader worden
      omschreven in bijlage B, punt 4.1, van [Verordening (EG) nr. 1099/2008](32008R1099) van het Europees Parlement
      en de Raad van 22 oktober 2008 betreffende energiestatistieken (PbEG 2008, L 304), verdeeld in de volgende
      categorieën:
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel2
  - number: 2.a
    text: ruwe aardolie en aardgascondensaat,
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel2
  - number: 2.b
    text: motorbenzine,
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel2
  - number: 2.c
    text: vliegtuigbenzine,
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel2
  - number: 2.d
    text: lichte reactiemotorbrandstof (van het naftatype of JP4),
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel2
  - number: 2.e
    text: reactiemotorbrandstof van het kerosinetype,
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel2
  - number: 2.f
    text: andere dan de onder e bedoelde kerosine,
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel2
  - number: 2.g
    text: gasolie/dieselolie (aardoliedistillaat),
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel2
  - number: 2.h
    text: stookolie (met hoog en laag zwavelgehalte),
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel2
  - number: 2.i
    text: raffinagegrondstoffen van de onder b tot en met h genoemde producten en
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel2
  - number: 2.j
    text: |-
      overige producten: ethaan, LPG, white spirit en speciale benzinesoorten, smeermiddelen, bitumen, paraffine en
      petroleumcoke.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel2
  - number: '3'
    text: |-
      De wettelijke voorraad is ten minste gelijk aan de grootste van de twee volgende hoeveelheden: 90 maal het
      daggemiddelde van de netto invoer van aardolieproducten of 61 maal het daggemiddelde van het binnenlands verbruik,
      berekend overeenkomstig artikel 3 van [richtlijn 2009/119/EG](32009L0119).
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel3
  - number: '4.1'
    text: |-
      Onze Minister stelt jaarlijks uiterlijk 31 maart voor het daarop volgende voorraadjaar de omvang en samenstelling
      van de in voorraad aan te houden aardolieproducten vast:
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel4
  - number: 4.1.a
    text: |-
      voor elke vergunninghouder voor een of meer accijnsgoederenplaatsen voor minerale oliën als bedoeld in
      [artikel 39 van de Wet op de accijns][ref1], die in het referentiejaar een hoeveelheid aardolieproducten
      heeft uitgeslagen dan wel een hoeveelheid reactiemotorbrandstof van het kerosinetype voor de voortstuwing van
      luchtvaartuigen heeft geleverd, die in totaal ligt boven de in het tweede lid bedoelde drempel, en


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel39
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '39'
  - number: 4.1.b
    text: voor COVA.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel4
  - number: '4.2'
    text: De hoogte van de drempel wordt bepaald bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel4
  - number: '4.3'
    text: Het eerste lid, onder a, is niet van toepassing op de Nederlandse krijgsmacht.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel4
  - number: '4.4'
    text: Marktdeelnemers en COVA houden de krachtens het eerste lid vastgestelde voorraad aardolieproducten aan.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel4
  - number: '4.5'
    text: |-
      Indien een marktdeelnemer deel uitmaakt van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1], rust de verplichting bij de rechtspersoon of
      vennootschap die aan het hoofd staat van de groep.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: '4.6'
    text: |-
      De relatieve omvang van de verplichting voor marktdeelnemers wordt berekend naar de aangiften, bedoeld
      in [artikel 53 van de Wet op de accijns][ref1], over het referentiejaar, alsmede naar de hoeveelheid
      reactiemotorbrandstof van het kerosinetype die voor de voorstuwing van luchtvaartuigen is geleverd over het
      referentiejaar. De berekening wordt gedaan op een bij ministeriële regeling te bepalen wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel53
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '53'
  - number: '5.1'
    text: |-
      De vaststelling, bedoeld in [artikel 4, eerste lid][ref1], geschiedt overeenkomstig de artikelen 4 en 9, vijfde
      lid, van [richtlijn 2009/119/EG](32009L0119) en wel zodanig dat:


      [ref1]: https://wetten.overheid.nl/BWBR0032775#Artikel4
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0032775
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 5.1.a
    text: |-
      ten minste 1/3 van de wettelijke voorraad wordt aangehouden in de vorm van de volgende aardolieproducten:
      motorbenzine, gasolie/dieselolie (aardoliedistillaat) en reactiemotorbrandstof van het kerosinetype;
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel5
  - number: 5.1.b
    text: |-
      de hoeveelheid reactiemotorbrandstof van het kerosinetype beperkt blijft tot 15 verbruiksdagen naar het gemiddeld
      binnenlands verbruik daarvan in het referentiejaar en
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel5
  - number: 5.1.c
    text: |-
      de hoeveelheid van de overige aardolieproducten wordt bepaald naar rato van het binnenlands verbruik daarvan in
      het referentiejaar.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel5
  - number: '5.2'
    text: 'De hoeveelheid aardolieproducten die wordt aangehouden door een marktdeelnemer wordt bepaald door:'
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel5
  - number: 5.2.a
    text: |-
      de drempel, bedoeld in [artikel 4, tweede lid][ref1], te verdelen over de diverse categorieën aardolieproducten
      naar rato van de uitslag van elke categorie in het referentiejaar;


      [ref1]: https://wetten.overheid.nl/BWBR0032775#Artikel4
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0032775
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 5.2.b
    text: |-
      per categorie aardolieproducten de in het referentiejaar uitgeslagen hoeveelheid te verminderen met de hoeveelheid
      die is berekend met toepassing van onderdeel a en
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel5
  - number: 5.2.c
    text: |-
      de met toepassing van onderdeel b berekende hoeveelheid te vermenigvuldigen met een bij algemene maatregel van
      bestuur vast te stellen percentage.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel5
  - number: '5.3'
    text: |-
      Ten minste de helft van de aldus voor een marktdeelnemer vastgestelde verplicht aan te houden voorraad wordt
      aangehouden in de vorm van aardolieproducten, bedoeld in [artikel 2, onderdelen b, e of g][ref1]. Het overige deel
      mag worden aangehouden met de aardolieproducten, bedoeld in artikel 2, onderdelen a tot en met i.


      [ref1]: https://wetten.overheid.nl/BWBR0032775#Artikel2
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0032775
        artikel: '2'
        hoofdstuk: '1'
  - number: '5.4'
    text: |-
      De totale hoeveelheid aardolieproducten die COVA moet aanhouden, wordt bepaald door de wettelijke voorraad te
      verminderen met de totale hoeveelheid aardolieproducten die marktdeelnemers aan moeten houden. Voor zover met
      de voorraadplicht van de marktdeelnemers tezamen niet wordt voldaan aan het eerste lid, onderdeel a, wordt het
      resterende deel van de bedoelde aardolieproducten door COVA aangehouden.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel5
  - number: '6'
    text: |-
      Onze Minister kan met het oog op een dreigende oliecrisis bepalen dat het voor COVA vastgestelde gedeelte van de
      wettelijke voorraad met een door hem te bepalen hoeveelheid wordt verhoogd.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel6
  - number: '7.1'
    text: 'Onze Minister kan met het oog op een oliecrisis dan wel een dreigende oliecrisis bepalen dat:'
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel7
  - number: 7.1.a
    text: |-
      het voor COVA dan wel voor een marktdeelnemer vastgestelde gedeelte van de wettelijke voorraad, met een door hem te
      bepalen gedeelte tijdelijk mag worden verminderd;
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel7
  - number: 7.1.b
    text: |-
      aardolieproducten die door COVA of een marktdeelnemer worden aangehouden als onderdeel van de wettelijke voorraad
      en die zich niet in Nederland bevinden, binnen een door hem te bepalen termijn naar Nederland worden overgebracht.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel7
  - number: '7.2'
    text: |-
      Een krachtens het eerste lid, onder a, vastgesteld besluit kan beperkingen inhouden, waaronder een beperking van de
      categorieën aardolieproducten waarmee de voorraad mag worden verminderd.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel7
  - number: '8.1'
    text: |-
      Een product wordt slechts tot de wettelijke voorraad gerekend, indien het zich bevindt in een lidstaat van de
      Europese Unie.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel8
  - number: '8.2'
    text: |-
      Als het product zich niet in Nederland bevindt, wordt het slechts tot de wettelijke voorraad gerekend indien is
      voldaan aan het gestelde bij of krachtens de [artikelen 10][ref1], [12][ref2], [14][ref3] en [15][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0032775#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0032775#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0032775#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0032775#Artikel15
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0032775
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0032775
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0032775
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0032775
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '9'
    text: 'Biobrandstoffen en toevoegingen worden slechts tot de wettelijke voorraad gerekend indien deze:'
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel9
  - number: 9.a
    text: vermengd zijn met aardolieproducten die behoren tot de wettelijke voorraad, of
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel9
  - number: 9.b
    text: |-
      opgeslagen zijn op het grondgebied van Nederland en - bestemd zijn om te worden gemengd met aardolieproducten die
      behoren tot de wettelijke voorraad, en
        - bestemd zijn om bij vervoer te worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel9
  - number: '10.1'
    text: 'Tot de wettelijke voorraad worden niet gerekend producten:'
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel10
  - number: 10.1.a
    text: die zich bevinden in pijpleidingen of verwerkingsinstallaties van een raffinaderij,
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel10
  - number: 10.1.b
    text: die zich bevinden in pijpleidingen, tankauto's of tankwagons,
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel10
  - number: 10.1.c
    text: die, al dan niet uitsluitend, voorhanden zijn voor rechtstreekse aflevering ten behoeve van wegverkeer,
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel10
  - number: 10.1.d
    text: die behoren tot de bunkervoorraden van de internationale zeescheepvaart,
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel10
  - number: 10.1.e
    text: |-
      die worden gehouden ter naleving van internationale verplichtingen van een andere staat dan Nederland dan wel van
      een onderdaan van die staat, ten aanzien waarvan is gewaarborgd dat Nederland de overbrenging naar die andere staat
      niet zal belemmeren of
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel10
  - number: 10.1.f
    text: |-
      die ingevolge de uitvoering van [richtlijn 2009/119/EG](32009L0119) ten behoeve van een voorraadplichtige uit een
      andere lidstaat in Nederland worden gehouden.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel10
  - number: '10.2'
    text: |-
      Voorts wordt niet tot de wettelijke voorraad gerekend stookolie (met hoog en laag zwavelgehalte) en ruwe aardolie
      die zich bevindt in installaties die gebruikt worden voor de winning van ruwe aardolie.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel10
  - number: '11.1'
    text: |-
      COVA kan taken betreffende het beheer van het voor haar vastgestelde gedeelte van de wettelijke voorraad voor een
      bepaalde termijn overdragen aan uitsluitend:
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel11
  - number: 11.1.a
    text: een lidstaat van de Europese Unie, op het grondgebied waarvan de voorraad zich bevindt,
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel11
  - number: 11.1.b
    text: |-
      een door een lidstaat van de Europese Unie, op het grondgebied waarvan de voorraad zich bevindt, ingestelde
      centrale entiteit, dan wel
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel11
  - number: 11.1.c
    text: een bedrijf dat een voorraad aardolieproducten aanhoudt in een lidstaat van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel11
  - number: '11.2'
    text: De beheerstaken mogen niet verder worden overgedragen.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel11
  - number: '11.3'
    text: |-
      De beheerstaken behoeven wat betreft de overdracht en wijziging daarvan aan een bedrijf dat een voorraad
      aardolieproducten aanhoudt in een andere lidstaat van de Europese Unie, de voorafgaande instemming van Onze
      Minister en van die lidstaat.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel11
  - number: '11.4'
    text: De overdracht aan een bedrijf in Nederland en wijziging daarvan wordt vooraf gemeld aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel11
  - number: '12.1'
    text: |-
      Een product wordt slechts tot de wettelijke voorraad gerekend, indien het op elk moment daadwerkelijk ter
      beschikking staat van de voorraadplichtige.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel12
  - number: '12.2'
    text: |-
      Als de voorraadplichtige niet enig rechthebbende is op een product dat op het grondgebied van Nederland
      wordt aangehouden, wordt het slechts tot de wettelijke voorraad gerekend indien hij ten aanzien daarvan een
      beschikkingsrecht heeft:
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel12
  - number: 12.2.a
    text: dat is ingegaan per de eerste van een maand en
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel12
  - number: 12.2.b
    text: een geldingsduur heeft van een maand of veelvoud daarvan.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel12
  - number: '12.3'
    text: |-
      Als de voorraadplichtige niet enig rechthebbende is op een product dat op het grondgebied van een andere lidstaat
      van de Europese Unie wordt aangehouden, wordt het slechts tot de wettelijke voorraad gerekend indien hij ten
      aanzien daarvan een beschikkingsrecht heeft:
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel12
  - number: 12.3.a
    text: dat is ingegaan per de eerste van een kwartaal, en
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel12
  - number: 12.3.b
    text: een geldingsduur heeft van een kwartaal of veelvoud daarvan.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel12
  - number: '12.4'
    text: |-
      Onze Minister kan bepalen dat een marktdeelnemer enig rechthebbende dient te zijn op ten minste een door hem te
      bepalen gedeelte van de wettelijke voorraad, indien is gebleken dat in het verleden door deze marktdeelnemer of ten
      opzichte van deze marktdeelnemer, niet werd voldaan aan het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel12
  - number: '13.1'
    text: |-
      COVA aanvaardt voor een marktdeelnemer tegen kostprijs de overdracht van de verplichting om een voorraad
      aardolieproducten aan te houden als onderdeel van de wettelijke voorraad.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel13
  - number: '13.2'
    text: COVA aanvaardt een dergelijke overdracht onder objectieve, transparante en niet-discriminerende voorwaarden.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel13
  - number: '13.3'
    text: |-
      COVA kan aan een dergelijke overdracht de voorwaarde verbinden dat de marktdeelnemer een garantie of andere
      zekerheid stelt.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel13
  - number: '14.1'
    text: |-
      Een marktdeelnemer kan de verplichting om een voorraad aardolieproducten aan te houden als onderdeel van de
      wettelijke voorraad ten minste gedeeltelijk overdragen aan uitsluitend:
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel14
  - number: 14.1.a
    text: |-
      COVA, mits de overdracht plaatsvindt ten minste 170 dagen voorafgaande aan de termijn waarop de verplichting
      betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel14
  - number: 14.1.b
    text: |-
      een door een andere lidstaat van de Europese Unie ingestelde centrale entiteit, mits de overdracht plaatsvindt ten
      minste 170 dagen voorafgaande aan de termijn waarop de verplichting betrekking heeft en die entiteit, Onze Minister
      en de lidstaat, op het grondgebied waarvan de voorraad zal worden aangehouden, daarmee vooraf hebben ingestemd,
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel14
  - number: 14.1.c
    text: |-
      een bedrijf op het grondgebied van een andere lidstaat van de Europese Unie, mits Onze Minister en de lidstaat, op
      het grondgebied waarvan de voorraad zal worden aangehouden, daarmee vooraf hebben ingestemd, dan wel
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel14
  - number: 14.1.d
    text: een bedrijf in Nederland, mits de overdracht vooraf aan Onze Minister is gemeld.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel14
  - number: '14.2'
    text: |-
      Wijziging of verlenging van een overdracht als bedoeld in het eerste lid, onder b en c, gaat pas in nadat daarmee
      is ingestemd door Onze Minister en de betrokken lidstaat.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel14
  - number: '14.3'
    text: Een overgedragen verplichting als bedoeld in het eerste lid, onder c en d, mag niet verder worden overgedragen.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel14
  - number: '14.4'
    text: |-
      Onze Minister kan aan een overdracht als bedoeld in het eerste lid, onder d, voorschriften en beperkingen
      verbinden.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel14
  - number: '14.5'
    text: |-
      Wijziging of uitbreiding van een overdracht als bedoeld in het eerste lid, onder d, wordt beschouwd als een nieuwe
      overdracht.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel14
  - number: '15.2'
    text: |-
      Onze Minister kan nadere regels stellen met betrekking tot de melding van overdrachten als bedoeld in de
      [artikelen 11, vierde lid][ref1], en [14, eerste lid, onder d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032775#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0032775#Artikel14
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0032775
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0032775
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '16.1'
    text: |-
      Onze Minister houdt, onder verwijzing naar de categorieën genoemd in [artikel 2][ref1], een register in stand van
      de wettelijke voorraad. Dit register bevat de in het tweede en derde lid bedoelde informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0032775#Artikel2
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0032775
        artikel: '2'
        hoofdstuk: '1'
  - number: '16.2'
    text: |-
      De voorraadplichtige verstrekt aan Onze Minister gegevens omtrent de omvang en samenstelling van de in voorraad
      aangehouden aardolieproducten, de plaats waar deze producten worden aangehouden, zijn rechtsbetrekking daartoe,
      alsmede, indien er sprake is van overdracht van de verplichting om voorraden aardolieproducten aan te houden,
      omtrent de in dit verband gehanteerde financiële vergoeding, als bij ministeriële regeling bepaald.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel16
  - number: '16.3'
    text: |-
      Het tweede lid is van overeenkomstige toepassing op degene die, zelf niet voorraadplichtig, ten behoeve van een
      voorraadplichtige een voorraad aardolieproducten beheert.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel16
  - number: '16.4'
    text: |-
      De regeling, bedoeld in het tweede lid, heeft betrekking op de inhoud van de gevraagde gegevens, de wijze waarop
      zij worden verstrekt, en de tijdstippen waarop zij worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel16
  - number: '16.5'
    text: |-
      Een voorraadplichtige meldt aan Onze Minister zodra hij in staat van surseance van betaling dan wel van
      faillissement is komen te verkeren, alsmede indien op het voor hem vastgestelde gedeelte van de wettelijke voorraad
      beslag is gelegd dan wel ten aanzien van hem andere executiemaatregelen zijn getroffen.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel16
  - number: '17.1'
    text: 'COVA houdt een openbaar register in stand van:'
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel17
  - number: 17.1.a
    text: |-
      alle gegevens over de hoeveelheid aardolieproducten waarover COVA per productcategorie beschikt om een voorraad
      aardolieproducten aan te houden ten behoeve van marktdeelnemers of van centrale entiteiten van andere lidstaten;
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel17
  - number: 17.1.b
    text: de voorwaarden waaronder zij bereid is voor marktdeelnemers een voorraad aardolieproducten aan te houden.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel17
  - number: '17.2'
    text: |-
      De in het eerste lid, onder b, bedoelde voorwaarden worden ten minste zeven maanden voorafgaand aan de overdracht
      van de verplichting om een voorraad aardolieproducten aan te houden, bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel17
  - number: '18'
    text: |-
      De voorraadplichtige bewaart gegevens, overzichten en bescheiden met betrekking tot een wettelijke voorraad
      gedurende ten minste vijf jaar.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel18
  - number: '19.1'
    text: |-
      Onze Minister kan op verzoek van een voorraadplichtige ontheffing verlenen van de
      [artikelen 4, eerste lid, onder a][ref1], en [16, tweede lid][ref2], indien de voorraadplicht voor de
      voorraadplichtige leidt tot een onevenredig zware financiële belasting doordat hij


      [ref1]: https://wetten.overheid.nl/BWBR0032775#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032775#Artikel16
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0032775
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032775
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 19.1.a
    text: |-
      niet of slechts voor een zeer gering deel de in voorraad te houden aardolieproducten in eigendom heeft en niet of
      slechts in geringe mate beschikt over opslagcapaciteit voor de aardolieproducten of
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel19
  - number: 19.1.b
    text: |-
      in omstandigheden als bedoeld in [artikel 16, vijfde lid][ref1], verkeert of dreigt te gaan verkeren of getroffen
      wordt of dreigt te worden getroffen door de daar bedoelde maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0032775#Artikel16
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0032775
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '19.2'
    text: De ontheffing kan betrekking hebben op een deel van de verplichting of een bepaalde categorie aardolieproducten.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel19
  - number: '19.3'
    text: |-
      Geen ontheffing wordt verleend indien de voorraadplichtige in dezelfde periode tegen betaling voorraden van
      dezelfde categorie aardolieproduct voor derden aanhoudt.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel19
  - number: '19.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de voorwaarden waaronder een
      ontheffing wordt verleend.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel19
  - number: '19.5'
    text: Een ontheffing kan onder beperkingen worden verleend en aan een ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel19
  - number: '19.6'
    text: Een voorraadplichtige is verplicht zich te houden aan de opgelegde beperkingen en voorschriften.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel19
  - number: '19.7'
    text: Een ontheffing kan worden gewijzigd of ingetrokken
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel19
  - number: 19.7.a
    text: op verzoek van de houder van de ontheffing,
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel19
  - number: 19.7.b
    text: indien niet voldaan wordt aan de opgelegde beperkingen of voorschriften,
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel19
  - number: 19.7.c
    text: |-
      indien gedurende de looptijd blijkt dat de voorraadplichtige tegen betaling voorraden van dezelfde categorie
      aardolieproduct voor derden aanhoudt of
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel19
  - number: 19.7.d
    text: ambtshalve, indien dit naar het oordeel van Onze Minister om gewichtige redenen noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel19
  - number: '20.1'
    text: Onze Minister draagt er zorg voor dat er een Stichting Centraal Orgaan Voorraadvorming Aardolieproducten is.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel20
  - number: '20.2'
    text: |-
      COVA heeft tot taak om, met inachtneming van de vereiste zekerheid van voorziening van aardolieproducten, haar
      gedeelte van de wettelijke voorraad tegen zo laag mogelijke kosten aan te houden en te doen al hetgeen daarvoor
      bevorderlijk kan zijn.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel20
  - number: '21.1'
    text: Het bestuur van COVA bestaat uit ten minste drie en ten hoogste vijf leden.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel21
  - number: '21.2'
    text: Onze Minister benoemt en ontslaat de voorzitter en de overige leden van het bestuur.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel21
  - number: '22.1'
    text: Slechts Onze Minister kan de statuten van COVA wijzigen.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel22
  - number: '22.2'
    text: |-
      Onze Minister kan, het bestuur van COVA gehoord, COVA bindende aanwijzingen geven, die hij voor een goede
      taakvervulling van COVA noodzakelijk acht. Deze aanwijzingen kunnen onder meer betrekking hebben op de categorieën
      van producten die COVA dient aan te houden, op de wijze en plaats van opslag daarvan en op de aanwending van de
      voorraden van COVA bij een oliecrisis of dreigende oliecrisis.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel22
  - number: '22.3'
    text: |-
      COVA verstrekt desgevraagd aan Onze Minister de voor de uitoefening van zijn taak benodigde inlichtingen. Onze
      Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van zijn taak
      redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel22
  - number: '23.1'
    text: |-
      De begroting van inkomsten en uitgaven en de jaarrekening van COVA behoeven, na door het bestuur van COVA te zijn
      vastgesteld, de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel23
  - number: '23.2'
    text: |-
      Het bestuur van COVA biedt jaarlijks vóór 1 februari aan Onze Minister ter goedkeuring de begroting voor het
      betreffende kalenderjaar aan, vergezeld van de nodige toelichting en bescheiden. Indien de begroting niet vóór de
      aanvang van het kalenderjaar waarvoor zij moet dienen, is goedgekeurd, kan Onze Minister COVA machtigen bepaalde
      uitgaven te doen.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel23
  - number: '23.3'
    text: |-
      Het bestuur van COVA biedt Onze Minister jaarlijks vóór 1 juli aan de rekening van inkomsten en uitgaven over het
      afgelopen kalenderjaar, alsmede een overzicht van de grootte en samenstelling van het vermogen aan het einde van
      dat jaar en een bijbehorende toelichting. De overgelegde stukken behoeven een verklaring van een accountant als
      bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1], die door het bestuur van COVA
      is aangewezen. Zij gaan verder vergezeld van een verslag van de accountant, bevattende opmerkingen waartoe diens
      onderzoek aanleiding geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '23.4'
    text: |-
      De goedkeuring van de jaarrekening strekt, voor zover het de daarbij goedgekeurde inkomsten en uitgaven
      betreft, tot decharge van het bestuur, behoudens in geval van later gebleken valsheid in bewijsstukken of andere
      onregelmatigheden.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel23
  - number: '24.1'
    text: |-
      Indien COVA naar het oordeel van Onze Minister haar taak ernstig verwaarloost, kan Onze Minister de noodzakelijke
      voorzieningen treffen, zo nodig met afwijking van de statuten van COVA.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel24
  - number: '24.2'
    text: |-
      De voorzieningen worden, spoedeisende gevallen uitgezonderd, niet eerder getroffen dan nadat COVA in de gelegenheid
      is gesteld om binnen een door Onze Minister gestelde termijn alsnog haar taak naar behoren uit te voeren.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel24
  - number: '25'
    text: De staat is aansprakelijk voor schulden van COVA, die mochten overblijven na haar liquidatie als rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel25
  - number: '26.1'
    text: |-
      Onder de naam voorraadheffing wordt een heffing geheven van de in [artikel 27][ref1] bedoelde producten. De
      voorraadheffing strekt tot financiering van de exploitatiekosten van COVA.


      [ref1]: https://wetten.overheid.nl/BWBR0032775#Artikel27
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0032775
        artikel: '27'
        hoofdstuk: '2'
  - number: '26.2'
    text: |-
      De voorraadheffing wordt vanwege Onze Minister van Financiën door de rijksbelastingdienst geheven en ingevorderd
      als ware het accijns.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel26
  - number: '26.3'
    text: |-
      Onze Minister van Financiën keert de opbrengst van de voorraadheffing uit aan COVA, of, na liquidatie van COVA als
      rechtspersoon, aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel26
  - number: '27.1'
    text: 'De heffing bedraagt voor:'
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel27
  - number: 27.1.a
    text: 'lichte olie, per 1 000 liter bij een temperatuur van 15 graden Celsius: € 8,00;'
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel27
  - number: 27.1.b
    text: 'halfzware olie, per 1 000 liter bij een temperatuur van 15 graden Celsius: € 8,00;'
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel27
  - number: 27.1.c
    text: 'gasolie, per 1 000 liter bij een temperatuur van 15 graden Celsius: € 8,00;'
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel27
  - number: 27.1.d
    text: 'vloeibaar gemaakt petroleumgas, per 1 000 kilogram: € 8,00.'
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel27
  - number: '27.2'
    text: |-
      Onder de in het eerste lid genoemde producten wordt verstaan hetgeen daaronder wordt verstaan ingevolge de
      [artikelen 26][ref1] en [28 van de Wet op de accijns][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel28
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '28'
  - number: '28.1'
    text: |-
      Het in Nederland aanhouden van een voorraad aardolieproducten ter naleving van internationale verplichtingen van
      een andere staat dan Nederland dan wel van een onderdaan van die staat, behoeft de voorafgaande instemming van
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel28
  - number: '28.2'
    text: 'Onze Minister kan een aanvraag tot het mogen aanhouden van voorraad slechts weigeren indien:'
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel28
  - number: 28.2.a
    text: |-
      instemming naar zijn oordeel zou kunnen leiden tot een situatie die in strijd zou zijn met [richtlijn 2009/119/EG]
      (32009L0119) onderscheidenlijk met de krachtens [artikel 30][ref1] gestelde regels of


      [ref1]: https://wetten.overheid.nl/BWBR0032775#Artikel30
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0032775
        artikel: '30'
        hoofdstuk: '3'
  - number: 28.2.b
    text: |-
      weigering naar zijn oordeel anderszins noodzakelijk is met het oog op de naleving van voor Nederland geldende
      internationale verplichtingen.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel28
  - number: '29'
    text: |-
      De [artikelen 16][ref1] en [18 ][ref2]zijn van overeenkomstige toepassing op degene die in Nederland een voorraad
      aardolieproducten aanhoudt ter naleving van internationale verplichtingen van een andere staat dan Nederland dan
      wel van een onderdaan van die staat.


      [ref1]: https://wetten.overheid.nl/BWBR0032775#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0032775#Artikel18
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0032775
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0032775
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '30'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere voorschriften en beperkingen worden gesteld aan het in Nederland
      aanhouden van een voorraad aardolieproducten ter naleving van internationale verplichtingen van een andere staat
      dan Nederland dan wel van een onderdaan van die staat.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel30
  - number: '31'
    text: |-
      De voor het uitoefenen van toezicht aangewezen ambtenaren zijn belast met het verlenen van bijstand aan inspecties
      op grond van richtlijn 2009/119/EG door personen die de Europese Commissie daartoe heeft gemachtigd. Op deze
      inspecties is [afdeling 5.2 van de Algemene wet bestuursrecht][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.2
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '5.2'
  - number: '34'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet, en vervolgens telkens na vijf jaar,
      aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk en over de
      doeltreffendheid en doelmatigheid van het functioneren van COVA.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel34
  - number: '36.1'
    text: |-
      De [Wet voorraadvorming aardolieproducten 2001][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0012373
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0012373
  - number: '36.2'
    text: |-
      De bepalingen van de [Wet voorraadvorming aardolieproducten 2001][ref1] blijven van toepassing met betrekking tot
      feiten die leiden tot de verschuldigdheid van voorraadheffing of tot de voldoening van voorraadheffing, die hebben
      plaatsgevonden voor 1 april 2013 en met betrekking tot strafbare feiten die hebben plaatsgevonden voor die datum.


      [ref1]: https://wetten.overheid.nl/BWBR0012373
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0012373
  - number: '36.3'
    text: |-
      In afwijking van [artikel 4, eerste lid][ref1], stelt Onze Minister met betrekking tot een periode liggende
      tussen 31 december 2012 tot en met 31 maart 2013 de omvang en samenstelling van de in voorraad aan te houden
      aardolieproducten vast overeenkomstig artikel 3, derde lid, van [richtlijn 2009/119/EG](32009L0119).


      [ref1]: https://wetten.overheid.nl/BWBR0032775#Artikel4
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0032775
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '37'
    text: |-
      De artikelen van deze wet treden in werking met ingang van een bij koninklijk besluit te bepalen tijdstip, dat voor
      de verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel37
  - number: '38'
    text: 'Deze wet wordt aangehaald als: Wet voorraadvorming aardolieproducten 2012.'
    url: https://wetten.overheid.nl/BWBR0032775/2020-07-01#Artikel38
