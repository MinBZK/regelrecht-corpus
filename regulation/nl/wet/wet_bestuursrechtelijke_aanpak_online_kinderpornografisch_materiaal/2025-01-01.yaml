  - number: '4'
    text: |-
      1 In afwijking van de [artikelen 2:14, eerste lid][ref1], en
      [2:15, eerste lid, van de Algemene wet bestuursrecht][ref2] wordt in het verkeer tussen de Autoriteit en een
      aanbieder van hostingdiensten een bericht uitsluitend elektronisch verzonden.

      2 Bij regeling van Onze Minister kunnen regels worden gesteld over de wijze waarop het elektronisch
      berichtenverkeer plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel214
