  - number: '5'
    text: |-
      1 Over de uitoefening van zijn taken en bevoegdheden overlegt de Autoriteit met de politie en het openbaar
      ministerie.

      2 De Autoriteit kan persoonsgegevens of inlichtingen, verkregen bij de uitvoering van de aan hem krachtens deze
      wet opgedragen taken, aan de politie verstrekken voor zover deze persoonsgegevens of inlichtingen noodzakelijk zijn
      voor de uitoefening van diens wettelijke taak, bedoeld in [artikel 3 van de Politiewet 2012][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel3
    url: https://wetten.overheid.nl/BWBR0049813/2025-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '3'
  - number: '6'
    text: |-
      1 De Autoriteit kan een aanbieder van hostingdiensten die online kinderpornografisch materiaal heeft opgeslagen een
      bevel geven alle redelijkerwijs te nemen maatregelen te treffen om dit materiaal ontoegankelijk te maken.

      2 Indien het bevel niet kan worden gericht tot een aanbieder van hostingdiensten, kan dit worden gericht tot een
      aanbieder van een communicatiedienst.

      3 De aanbieder tot wie het bevel is gericht handelt overeenkomstig dat bevel.

      4 Het bevel is schriftelijk en vermeldt:

      a. de feiten en omstandigheden waar, naar het oordeel van de Autoriteit, uit blijkt dat sprake is van online
      kinderpornografisch materiaal;

      b. welke gegevens ontoegankelijk moeten worden gemaakt;

      c. de termijn waarbinnen dat moet gebeuren, met dien verstande dat die termijn ten hoogste twaalf uren bedraagt.
    url: https://wetten.overheid.nl/BWBR0049813/2025-01-01#Artikel6
  - number: '7'
    text: |-
      De Autoriteit is bevoegd tot oplegging van een last onder dwangsom ter handhaving van de in
      [artikel 6, derde lid][ref1], opgenomen verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0049813#Artikel6
    url: https://wetten.overheid.nl/BWBR0049813/2025-01-01#Artikel7
