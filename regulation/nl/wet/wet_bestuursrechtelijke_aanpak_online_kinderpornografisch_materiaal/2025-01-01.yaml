  - number: '3'
    text: |-
      [Artikel 252 van het Wetboek van Strafrecht][ref1] is niet van toepassing op de Autoriteit en de onder de
      Autoriteit werkzame personen, voor zover deze handelingen verrichten ter uitvoering van de bij deze wet aan de
      Autoriteit opgedragen taken en bevoegdheden.


