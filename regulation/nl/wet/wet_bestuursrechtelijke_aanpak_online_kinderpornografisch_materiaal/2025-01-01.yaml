  - number: '10'
    text: |-
      1 Gelet op artikel 9, aanhef en tweede lid, onderdeel g, van de Algemene verordening
      gegevensbescherming, is het verbod om bijzondere categorieën van persoonsgegevens, als bedoeld in
      [artikel 1 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1], te verwerken niet van toepassing
      indien de verwerking geschiedt door de Autoriteit voor zover de verwerking van deze gegevens noodzakelijk is voor
      de uitoefening van zijn bevoegdheden op grond van deze wet.

      2 Gelet op artikel 10 van de Algemene verordening gegevensbescherming mag
      de Autoriteit persoonsgegevens van strafrechtelijke aard, als bedoeld in
      [artikel 1 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2], verwerken voor zover de
      verwerking noodzakelijk is voor de uitoefening van zijn bevoegdheden op grond van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Artikel1
    url: https://wetten.overheid.nl/BWBR0049813/2025-01-01#Artikel10
