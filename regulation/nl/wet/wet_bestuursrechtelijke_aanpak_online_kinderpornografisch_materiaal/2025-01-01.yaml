  - number: '2'
    text: |-
      1 De Autoriteit, bedoeld in
      [artikel 2, eerste lid, van de Uitvoeringswet verordening terroristische online-inhoud][ref1], heeft mede tot taak:

      a. de ontoegankelijkmaking van online kinderpornografisch materiaal af te dwingen, en

      b. onderzoek te doen naar, en informatie te verstrekken over, de aanwezigheid van online kinderpornografisch
      materiaal teneinde de verspreiding daarvan onder het publiek te beperken, waar mogelijk in samenwerking met private
      en publieke partijen.

      2 De leden van de Autoriteit en de bij besluit van de Autoriteit aangewezen ambtenaren zijn belast met het toezicht
      op de naleving van het bepaalde bij of krachtens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0048064#Artikel2
    url: https://wetten.overheid.nl/BWBR0049813/2025-01-01#Artikel2
