  - number: '11'
    text: |-
      1 De verplichtingen en rechten als bedoeld in artikel 23, eerste lid, van de Algemene verordening
      gegevensbescherming, kunnen worden beperkt indien dit noodzakelijk en evenredig is ter waarborging van een in
      artikel 23, eerste lid, onderdelen a, c, d, of i van de Algemene verordening gegevensbescherming genoemd belang.

      2 Indien de Autoriteit gebruik maakt van de in het eerste lid bedoelde bevoegdheid, deelt hij dit voorzien van een
      dragende onderbouwing schriftelijk mee aan de betrokkene wiens rechten worden beperkt.

      3 In afwijking van het tweede lid, wordt geen mededeling gedaan aan de betrokkene indien dit afbreuk doet aan het
      doel van de beperking.
    url: https://wetten.overheid.nl/BWBR0049813/2025-01-01#Artikel11
