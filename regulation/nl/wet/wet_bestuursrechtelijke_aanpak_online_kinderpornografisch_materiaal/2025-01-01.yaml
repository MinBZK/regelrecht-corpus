preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is bestuursrechtelijk op te treden tegen de opslag en
    doorgifte van online kinderpornografisch materiaal;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0049813/2025-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *aanbieder van een communicatiedienst:* de aanbieder van een communicatiedienst als bedoeld in
      [artikel 138g van het Wetboek van Strafvordering][ref1];
        - *aanbieder van hostingdiensten:* de aanbieder van een communicatiedienst bestaande in de opslag van gegevens die
      van een ander afkomstig zijn;
        - *Autoriteit:* de Autoriteit, genoemd in [artikel 2][ref2];
        - *geautomatiseerd werk:* een geautomatiseerd werk als bedoeld in
      [artikel 80sexies van het Wetboek van Strafrecht][ref3];
        - *kinderpornografisch materiaal:* visuele weergaven als bedoeld in
      [artikel 252 van het Wetboek van Strafrecht][ref4];
        - *ontoegankelijk maken:* het treffen van maatregelen ter voorkoming dat van online kinderpornografisch materiaal
      wordt kennisgenomen, alsmede ter voorkoming van de verdere verspreiding van dit materiaal, dan wel het verwijderen
      van het materiaal uit het geautomatiseerde werk, met behoud van de gegevens ten behoeve van de strafvordering en de
      bestuursrechtelijke procedure;
        - *Onze Minister:* Onze Minister van Justitie en Veiligheid.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel138g
      [ref2]: https://wetten.overheid.nl/BWBR0049813#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel80sexies
