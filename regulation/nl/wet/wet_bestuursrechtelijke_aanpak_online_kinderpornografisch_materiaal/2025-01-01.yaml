  - number: '8'
    text: |-
      1 De Autoriteit is bevoegd tot oplegging van een bestuurlijke boete bij overtreding van
      [artikel 6, derde lid][ref1]. De op te leggen bestuurlijke boete bedraagt ten hoogste het bedrag dat is vastgesteld
      voor de tweede categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2].

      2 Indien de overtreding bestaat uit het systematisch of aanhoudend overtreden van [artikel 6, derde lid][ref3],
      bedraagt de bestuurlijke boete ten hoogste het bedrag dat is vastgesteld voor de zesde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref4] of, indien die boetecategorie geen passende
      bestraffing toelaat, ten hoogste 10% van de omzet van de onderneming, onderscheidenlijk, indien de overtreding
      door een ondernemersvereniging is begaan, van de gezamenlijke omzet van de ondernemingen die van de vereniging deel
      uitmaken, in het boekjaar voorafgaande aan de beschikking waarin de bestuurlijke boete wordt opgelegd.


