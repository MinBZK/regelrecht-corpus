  - number: '6'
    text: |-
      In afwijking van [artikel 5, onderdeel a][ref1], wordt de aanvraag van een tolk of vertaler die niet voldoet aan de
      daar bedoelde eisen, niet afgewezen indien:

      a. aan hem ten aanzien van het betrokken beroep een erkenning van beroepskwalificaties is verleend als bedoeld in
      de [Algemene wet erkenning EU-beroepskwalificaties][ref2];

      b. hij in het buitenland een door Onze Minister aangewezen getuigschrift heeft verkregen dat geldt als bewijs
      van een verworven vakbekwaamheid die geacht kan worden gelijkwaardig te zijn aan de vakbekwaamheid welke uit het
      voldoen aan de in [artikel 3][ref3] bedoelde eisen mag worden afgeleid, of

      c. Onze Minister, gelet op een door de betrokkene in het buitenland verkregen getuigschrift, hem op aanvraag een
      verklaring heeft afgegeven, inhoudende dat tegen zijn inschrijving in het register voor wat zijn vakbekwaamheid
      betreft geen bedenkingen bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0022704#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0023066
      [ref3]: https://wetten.overheid.nl/BWBR0022704#Artikel3
