  - number: '7'
    text: |-
      1 De beëdigde tolk of vertaler die is ingeschreven in het register ontvangt een bewijs van inschrijving.

      2 Het bewijs van inschrijving vermeldt de bron- of doeltaal dan wel bron- of doeltalen waarin de tolk of vertaler
      zijn werkzaamheden verricht.
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel7
  - number: '8'
    text: |-
      1 De inschrijving geschiedt voor een periode van vijf jaar. De inschrijving kan op aanvraag van de beëdigde tolk of
      vertaler telkens met vijf jaar worden verlengd.

      2 Op de aanvraag tot verlenging van de inschrijving is [artikel 4, eerste tot en met vijfde lid][ref1], van
      overeenkomstige toepassing, met dien verstande dat de in die artikelleden bedoelde verklaringen niet ouder zijn dan
      drie maanden, te rekenen vanaf de dag waarop de aanvraag tot verlenging wordt ingediend.

      3 Op de aanvraag tot verlenging van de inschrijving is [artikel 5, onderdelen b tot en met d][ref2], van
      overeenkomstige toepassing.

      4 De aanvraag tot verlenging van de inschrijving wordt afgewezen indien de aanvrager, naar regelen te stellen bij
      of krachtens algemene maatregel van bestuur, niet kan aantonen dat hij de noodzakelijke kennis heeft bijgehouden en
      in de afgelopen periode voldoende werkervaring als beëdigde tolk of vertaler heeft opgedaan.

      5 De beslissing op de aanvraag tot verlenging van de inschrijving wordt binnen vier weken genomen.

      6 Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref3] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref4] niet van toepassing op een verzoek tot verlenging van
      de inschrijving als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022704#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022704#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel8
