  - number: '38'
    text: |-
      De [wet van 6 mei 1878, houdende bepalingen omtrent de beëedigde vertalers][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0001849
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel38
    references:
      - id: ref1
