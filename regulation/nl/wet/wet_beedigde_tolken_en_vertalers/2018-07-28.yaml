  - number: '9'
    text: |-
      1 De inschrijving in het register kan worden doorgehaald indien Onze Minister is gebleken van ernstige feiten of
      omstandigheden, de integriteit of de vakbekwaamheid van de beëdigde tolk of vertaler betreffende.

      2 Bij de beschikking tot doorhaling van de inschrijving wordt bepaald binnen welke periode geen nieuw verzoek tot
      inschrijving in het register kan worden gedaan. Deze periode bedraagt ten hoogste tien jaren.

      3 Hangende het onderzoek of er reden is tot doorhaling over te gaan, kan de inschrijving van een beëdigde tolk of
      vertaler tijdelijk worden doorgehaald.

      4 Indien een beëdigde tolk of vertaler niet binnen twee maanden na inschrijving is beëdigd, kan Onze Minister
      besluiten de inschrijving in het register door te halen.

      5 De inschrijving in het register wordt in elk geval doorgehaald bij overlijden van de ingeschrevene en op
      schriftelijk verzoek van de ingeschrevene.
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel9
  - number: '10'
    text: |-
      Indien een beëdigde tolk of vertaler voor meer dan één bron- of doeltaal in het register is ingeschreven, kan de
      doorhaling ook worden beperkt tot één of meer van deze bron- of doeltalen.
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel10
  - number: '11'
    text: |-
      1 Van een beschikking tot doorhaling wordt mededeling gedaan in de Staatscourant.

      2 Van een beschikking tot tijdelijke doorhaling en tot beëindiging van de tijdelijke doorhaling wordt mededeling
      gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel11
  - number: '12'
    text: |-
      1 De beëdigde tolk of vertaler legt binnen twee maanden na inschrijving in het register de in [artikelen 13][ref1]
      en [14][ref2] bedoelde eed of belofte af ten overstaan van de rechtbank van het arrondissement waarbinnen zijn
      woonplaats is gelegen.

      2 Indien de woonplaats buiten Nederland is gelegen wordt de eed of belofte afgelegd ten overstaan van de rechtbank
      Den Haag.

      3 Om te kunnen worden beëdigd dient de beëdigde tolk of vertaler een bewijs van inschrijving in het register over
      te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0022704#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0022704#Artikel14
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel12
    references:
      - id: ref1
