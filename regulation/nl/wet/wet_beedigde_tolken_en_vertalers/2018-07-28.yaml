  - number: '42'
    text: 'Deze wet wordt aangehaald als: Wet beëdigde tolken en vertalers.'
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel42
  - number: '43'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld, en werken wat betreft de
      [artikelen 41a tot en met 41c][ref1] terug tot en met 1 juli 2006.


      [ref1]: https://wetten.overheid.nl/BWBR0022704#Artikel41a
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0022704
        artikel: 41a
        hoofdstuk: VIII
