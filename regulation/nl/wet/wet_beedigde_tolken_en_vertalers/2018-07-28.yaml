        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0022704
        artikel: '14'
        hoofdstuk: III
  - number: '13'
    text: |-
      1 De beëdigde tolk legt ter zitting van de rechtbank de navolgende eed of belofte af:

      «Ik zweer/beloof dat ik mijn werk als beëdigde tolk eerlijk, nauwgezet en onpartijdig zal uitvoeren en mij bij het
      uitoefenen van de tolkwerkzaamheden zal gedragen zoals een beëdigde tolk betaamt».

      «Ik zweer/beloof dat ik geheimhouding zal betrachten ten aanzien van vertrouwelijke informatie waarvan ik door mijn
      werk kennis neem».

      2 Wanneer de eed of belofte, bedoeld in het eerste lid, in de Friese taal wordt afgelegd, luidt de tekst van de eed
      of belofte als volgt:

      «Ik swar/ûnthjit dat ik myn wurk as beëdige tolk earlik, sekuer en ûnpartidich útfiere sil en my by it útoefenjen
      fan myn wurk as tolk hâlde en drage sil sa’t dat in beëdige tolk foeget».

      «Ik swar/ûnthjit dat ik geheimhâlding betrachtsje sil oangeande fertroulike ynformaasje dêr’t ik troch myn wurk
      kunde oan krij».

      3 Na het afleggen van de eed of belofte wordt aan de beëdigde tolk een akte van beëdiging uitgereikt.
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel13
  - number: '14'
    text: |-
      1 De beëdigde vertaler legt ter zitting van de rechtbank de navolgende eed of belofte af:

      «Ik zweer/beloof dat ik mijn werk als beëdigde vertaler eerlijk, nauwgezet en onpartijdig zal uitvoeren en mij bij
      de uitoefening van mijn vertaalwerkzaamheden zal gedragen zoals een beëdigde vertaler betaamt».

      «Ik zweer/beloof dat ik geheimhouding zal betrachten ten aanzien van vertrouwelijke informatie waarvan ik door mijn
      werk kennis neem».

      2 Wanneer de eed of belofte, bedoeld in het eerste lid, in de Friese taal wordt afgelegd, luidt de tekst van de eed
      of belofte als volgt:

      «Ik swar/ûnthjit dat ik myn wurk as beëdige oersetter earlik, sekuer en ûnpartidich útfiere sil en my by it
      útoefenjen fan myn wurk as oersetter hâlde en drage sil sa’t dat in beëdige oersetter foeget».

      «Ik swar/ûnthjit dat ik geheimhâlding betrachtsje sil oangeande fertroulike ynformaasje dêr’t ik troch myn wurk
      kunde oan krij».

      3 Na het afleggen van de eed of belofte deponeert de beëdigde vertaler zijn handtekening ter griffie van de
      rechtbank, bedoeld in [artikel 12, eerste lid of tweede lid][ref1].

      4 Na het afleggen van de eed of belofte en het neerleggen van de handtekening wordt aan de beëdigde vertaler een
      akte van beëdiging uitgereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0022704#Artikel12
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0022704
        artikel: '12'
        hoofdstuk: III
  - number: '15'
    text: |-
      1 Na overlegging van de akte van beëdiging ontvangt de betrokkene een legitimatiebewijs.

      2 Onze Minister stelt regels ten aanzien van het legitimatiebewijs.
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel15
  - number: '16'
    text: |-
      1 Eenieder kan een klacht indienen bij Onze Minister inzake de wijze waarop een beëdigde tolk of vertaler zich in
      een bepaalde aangelegenheid jegens hem of een ander heeft gedragen.

      2 Onze Minister stelt een klachtencommissie in ter behandeling van en de advisering over klachten ten aanzien van
      beëdigde tolken en vertalers.

      3 Het klaagschrift wordt ondertekend en bevat ten minste:

      a. de naam en het adres van de indiener;

      b. de dagtekening;

      c. een omschrijving van de gedraging waartegen de klacht gericht is;

      d. de naam van de beëdigde tolk of vertaler op wiens gedraging de klacht betrekking heeft.

      4 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de samenstelling en de werkwijze van
      de klachtencommissie, waaronder in elk geval regels betreffende de onafhankelijkheid van de klachtencommissie.
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel16
  - number: '17'
    text: |-
      Indien de beëdigde tolk of vertaler naar tevredenheid van de klager aan diens klacht tegemoet is gekomen, ziet Onze
      Minister af van verdere behandeling van de klacht.
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel17
  - number: '18'
    text: |-
      1 Onze Minister bevestigt de ontvangst van het klaagschrift schriftelijk.

      2 Bij het bericht van ontvangst wordt vermeld dat, indien de klacht wordt behandeld, de klachtencommissie daarover
      zal adviseren.

      3 Het horen geschiedt door de in [artikel 16][ref1] bedoelde klachtencommissie. De klachtencommissie kan het horen
      opdragen aan de voorzitter of een lid van de commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0022704#Artikel16
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0022704
        artikel: '16'
        hoofdstuk: IV
  - number: '19'
    text: |-
      1 Onze Minister is niet verplicht de klacht te behandelen indien zij betrekking heeft op een gedraging:

      a. waarover reeds eerder een klacht is ingediend die met inachtneming van de [artikelen 16][ref1] en volgende is
      behandeld;

      b. die langer dan een jaar voor indiening van de klacht heeft plaatsgevonden;

      c. zolang ter zake daarvan een opsporingsonderzoek op bevel van de officier van justitie of een vervolging gaande
      is, dan wel indien de gedraging deel uitmaakt van de opsporing of vervolging van een strafbaar feit en terzake van
      dat feit een opsporingsonderzoek op bevel van de officier van justitie of een vervolging gaande is.

      2 Onze Minister is niet verplicht een klacht te behandelen indien het belang van de klager dan wel het gewicht van
      de gedraging kennelijk onvoldoende is.

      3 Van het niet in behandeling nemen van de klacht wordt de klager zo spoedig mogelijk doch uiterlijk binnen vier
      weken na ontvangst van het klaagschrift schriftelijk in kennis gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0022704#Artikel16
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0022704
        artikel: '16'
        hoofdstuk: IV
  - number: '20'
    text: |-
      Aan degene op wiens gedraging een klacht betrekking heeft, wordt een afschrift van het klaagschrift alsmede van de
      daarbij meegezonden stukken gezonden.
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel20
  - number: '21'
    text: |-
      Indien de klacht gericht is op het handelen van een lid van de klachtencommissie, wordt dit lid vervangen door een
      door de voorzitter aan te wijzen ander lid.
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel21
  - number: '22'
    text: |-
      1 De klachtencommissie stelt de klager en degene op wiens gedraging de klacht betrekking heeft, in de gelegenheid
      te worden gehoord.

      2 Van het horen van de klager kan worden afgezien indien de klacht kennelijk ongegrond is dan wel indien de klager
      heeft verklaard geen gebruik te willen maken van het recht te worden gehoord.

      3 Van het horen wordt een verslag gemaakt.
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel22
  - number: '23'
    text: |-
      1 De klachtencommissie behandelt de klacht binnen zes weken na ontvangst van het klaagschrift.

      2 De klachtencommissie kan de behandeling voor ten hoogste vier weken verdagen. Van de verdaging wordt schriftelijk
      mededeling gedaan aan de klager en aan degene op wiens gedraging de klacht betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel23
  - number: '24'
    text: |-
      1 De klachtencommissie zendt een rapport van bevindingen, vergezeld van een advies en eventuele aanbevelingen aan
      Onze Minister. Het rapport bevat een verslag van het horen.

      2 De klachtencommissie kan bij het advies tot het gegrond verklaren van een klacht de aanbeveling doen aan Onze
      Minister dat een beëdigde tolk of vertaler gezien zijn gedraging in aanmerking komt voor een tijdelijke doorhaling
      dan wel doorhaling in het register.
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel24
  - number: '25'
    text: |-
      1 Onze Minister handelt de klacht af binnen tien weken na ontvangst van het klaagschrift.

      2 Onze Minister kan de behandeling van het klaagschrift voor ten hoogste vier weken verdagen. Van de verdaging
      wordt schriftelijk mededeling gedaan aan de klager en degene op wiens gedraging de klacht betrekking heeft.

      3 Onze Minister stelt de klager en degene op wie de klacht betrekking heeft schriftelijk en gemotiveerd in kennis
      van de bevindingen van het onderzoek naar de klacht alsmede van de conclusie die hij hieraan verbindt.

      4 Indien de conclusie van Onze Minister afwijkt van het advies, wordt in de conclusie de reden voor die afwijking
      vermeld.
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel25
  - number: '26'
    text: |-
      Onze Minister draagt zorg voor de registratie van de bij hem ingediende klachten. De geregistreerde klachten worden
      jaarlijks gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel26
  - number: '27'
    text: |-
      Tegen een besluit inzake de behandeling van een klacht als bedoeld in [artikel 16, eerste lid][ref1], kan geen
      beroep worden ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0022704#Artikel16
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0022704
        artikel: '16'
        hoofdstuk: IV
  - number: '28'
    text: |-
      1 De volgende diensten en instanties maken in het kader van het strafrecht en het vreemdelingenrecht uitsluitend
      gebruik van beëdigde tolken of vertalers:

      a. de Afdeling bestuursrechtspraak van de Raad van State;

      b. de tot de rechterlijke macht behorende gerechten;

      c. het Openbaar Ministerie;

      d. de Immigratie- en Naturalisatiedienst;

      e. de politie;

      f. de Koninklijke Marechaussee.

      2 Onze Minister kan bij ministeriële regeling instanties en organen aanwijzen die in het kader van het strafrecht
      en het vreemdelingenrecht ook gehouden zijn gebruik te maken van beëdigde tolken en vertalers.

      3 In afwijking van het eerste en tweede lid kan gebruik worden gemaakt van een tolk die geen beëdigde tolk is of
      van een vertaler die geen beëdigde vertaler is indien wegens de vereiste spoed een ingeschrevene in het register
      niet tijdig beschikbaar is of indien het register voor de desbetreffende bron- of doeltaal dan wel bron- of
      doeltalen geen ingeschrevene bevat.

      4 Indien van het eerste of tweede lid wordt afgeweken wordt dit met redenen omkleed schriftelijk vastgelegd.
      Ingeval geen sprake is van spoedeisende inzet van een tolk of vertaler, dient deze voorafgaand aan zijn inzet
      een recente verklaring omtrent het gedrag dan wel een integriteitsverklaring over te leggen. Indien het vanwege
      de spoedeisendheid niet mogelijk is voorafgaand aan de inzet een verklaring omtrent het gedrag over te leggen
      geschiedt dit na de inzet. De [artikelen 29][ref1] en [32][ref2] zijn van overeenkomstige toepassing op een tolk of
      vertaler als bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022704#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0022704#Artikel32
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0022704
        artikel: '29'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0022704
        artikel: '32'
        hoofdstuk: VII
  - number: '29'
    text: |-
      De beëdigde tolk is verplicht tot geheimhouding van de gegevens waarover hij bij de uitoefening van zijn
      werkzaamheden de beschikking krijgt en waarvan hij het vertrouwelijke karakter kent of redelijkerwijs moet
      vermoeden, behoudens voorzover enig wettelijk voorschrift hem tot mededeling verplicht of uit zijn werkzaamheden de
      noodzaak tot mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel29
  - number: '30'
    text: |-
      Bij het verrichten van zijn werkzaamheden is de beëdigde tolk verplicht het legitimatiebewijs, bedoeld in
      [artikel 15][ref1], op verzoek te tonen.


      [ref1]: https://wetten.overheid.nl/BWBR0022704#Artikel15
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0022704
        artikel: '15'
        hoofdstuk: III
  - number: '31'
    text: |-
      1 Een dienst of instantie als bedoeld in [artikel 28, eerste en tweede lid][ref1], kan indien de bijzondere aard
      van de werkzaamheden dit vereist van een beëdigde tolk verlangen dat deze voorafgaande aan zijn inzet een recente
      verklaring omtrent het gedrag overlegt.

      2 De kosten die samenhangen met de aanvraag van de verklaring omtrent het gedrag komen voor rekening van de
      verzoekende dienst of instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0022704#Artikel28
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0022704
        artikel: '28'
        hoofdstuk: V
  - number: '32'
    text: |-
      De beëdigde vertaler is verplicht tot geheimhouding van de gegevens waarover hij bij de uitoefening van zijn
      werkzaamheden de beschikking krijgt en waarvan hij het vertrouwelijk karakter kent of redelijkerwijs moet
      vermoeden, behoudens voorzover enig wettelijk voorschrift hem tot mededeling verplicht of uit zijn werkzaamheden de
      noodzaak tot mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel32
  - number: '33'
    text: |-
      1 Een dienst of instantie als bedoeld in [artikel 28, eerste en tweede lid][ref1], kan indien de bijzondere aard
      van de werkzaamheden dit vereist, van een beëdigde vertaler verlangen dat deze voorafgaand aan zijn inzet een
      recente verklaring omtrent het gedrag overlegt.

      2 De kosten die samenhangen met de aanvraag van de verklaring omtrent het gedrag komen voor rekening van de
      verzoekende dienst of instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0022704#Artikel28
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0022704
        artikel: '28'
        hoofdstuk: V
  - number: '34'
    text: |-
      Onze Minister kan regels stellen waaraan de wijze van vertalen en de administratie van de beëdigde vertaler dienen
      te voldoen.
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel34
  - number: '35'
    text: |-
      1 Indien stukken of opgaven die krachtens wettelijk voorschrift in openbare registers moeten worden ingeschreven,
      in een vreemde taal zijn gesteld, wordt van deze stukken een getrouwe vertaling in het Nederlands bijgevoegd,
      vervaardigd en voor overeenstemmend verklaard door een voor die brontaal beëdigde vertaler.

      2 De vertalingen worden ingeschreven in plaats van de in de vreemde taal gestelde stukken of opgaven die aan het
      register blijven gehecht.

      3 Bij de wet kan worden bepaald dat het eerste en tweede lid niet van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel35
  - number: '36'
    text: |-
      Ingeval een beëdigde vertaler werkzaamheden verricht bij een dienst of een instantie als bedoeld in
      [artikel 28, eerste of tweede lid][ref1], is hij verplicht het door Onze Minister afgegeven legitimatiebewijs,
      bedoeld in [artikel 15][ref2], op verzoek te tonen.


      [ref1]: https://wetten.overheid.nl/BWBR0022704#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0022704#Artikel15
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0022704
        artikel: '28'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0022704
        artikel: '15'
        hoofdstuk: III
  - number: '37'
    text: |-
      De [artikelen 3][ref1] en [5, onderdeel a][ref2], zijn gedurende een periode van twee jaar na inwerkingtreding van
      deze wet niet van toepassing op de inschrijving in het register van degenen die op het moment van inwerkingtreding
      van deze wet:

      a. werkzaam zijn als beëdigde vertaler in de zin van de
      [wet van 6 mei 1878, houdende bepalingen omtrent de beëdigde vertalers][ref3]; of

      b. definitief zijn ingeschreven in het landelijk kwaliteitsregister tolken en vertalers, bedoeld in de
      __REF000___________________________________________________________________________________________________________
      __________________________________________________________________________ (Stcrt. 2003, 94).


      [ref1]: https://wetten.overheid.nl/BWBR0022704#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022704#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0001849
      [ref4]: https://wetten.overheid.nl/BWBR0015070
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel37
    references:
