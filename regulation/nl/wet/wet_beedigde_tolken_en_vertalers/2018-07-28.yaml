preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een wet tot stand te brengen waarin regels worden
    gesteld inzake de beëdiging van tolken en vertalers en de kwaliteit en integriteit van beëdigde tolken en
    vertalers, waarin de wet van 6 mei 1878, houdende bepalingen omtrent de beëedigde vertalers opgaat;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:

      a. Onze Minister: Onze Minister van Justitie;

      b. register: het register bedoeld in [artikel 2][ref1];

      c. beëdigde tolk: degene die als zodanig is ingeschreven in het register;

      d. beëdigde vertaler: degene die als zodanig is ingeschreven in het register.


      [ref1]: https://wetten.overheid.nl/BWBR0022704#Artikel2
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0022704
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '2'
    text: |-
      1 Er is een register voor beëdigde tolken en vertalers. Het register bevat ten aanzien van iedere ingeschreven tolk
      of vertaler in elk geval de volgende gegevens:

      a. de personalia;

      b. de aanduiding of betrokkene tolk of vertaler is;

      c. de bron- of doeltaal dan wel bron- of doeltalen waarin de tolk of vertaler zijn werkzaamheden verricht; en

      d. de overige specifieke bekwaamheden waarvan de tolk of vertaler vermelding in het register wenselijk acht.

      2 Onze Minister is verwerkingsverantwoordelijk voor het register. Onze Minister kan een verwerker aanwijzen.

      3 Onze Minister kan een lijst houden waarop de gegevens worden bijgehouden van tolken en vertalers die beschikken
      over een recente verklaring omtrent het gedrag en die wegens het ontbreken van opleidingen of het ontbreken van
      onafhankelijke deskundigen die de kennis kunnen toetsen, niet kunnen aantonen te beschikken over de vereiste
      competenties taalvaardigheid in de bron- of de doeltaal of kennis van de cultuur van het land of gebied van de
      bron- of doeltaal. Onze Minister kan een instelling aanwijzen die deze lijst bijhoudt.

      4 Aan een ieder die dit verzoekt, wordt, met inachtneming van de bij of krachtens algemene maatregel van bestuur te
      stellen regels inzake de bescherming van de persoonlijke levenssfeer van de betrokkenen, informatie verstrekt uit
      het register en uit de in het derde lid bedoelde lijst.

      5 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het bepaalde in het
      eerste tot en met vierde lid.
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel2
  - number: '3'
    text: |-
      Om voor inschrijving in het register in aanmerking te komen dient de tolk dan wel de vertaler te voldoen aan de bij
      of krachtens algemene maatregel van bestuur te stellen eisen ten aanzien van de volgende competenties:

        - attitude van een tolk voor de tolk;
        - attitude van een vertaler voor de vertaler;
        - integriteit;
        - taalvaardigheid in de brontaal;
        - taalvaardigheid in de doeltaal;
        - kennis van de cultuur van het land of gebied van de brontaal;
        - kennis van de cultuur van het land of gebied van de doeltaal;
        - tolkvaardigheid voor de tolk;
        - vertaalvaardigheid voor de vertaler.
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel3
  - number: '4'
    text: |-
      1 Een aanvraag tot inschrijving geschiedt bij Onze Minister.

      2 Bij de aanvraag tot inschrijving, bedoeld in het eerste lid, legt de tolk of vertaler een verklaring omtrent het
      gedrag over, als bedoeld in de [Wet justitiële en strafvorderlijke gegevens][ref1].

      3 De tolk of vertaler die minder dan vijf jaar in Nederland woonachtig is, legt naast de verklaring omtrent het
      gedrag tevens een integriteitsverklaring over die is afgegeven door een daartoe bevoegde instantie in het land van
      herkomst. Onze Minister weigert inschrijving van betrokkene in het register indien hij niet overtuigd is dat de
      overgelegde integriteitsverklaring voldoende waarborg biedt inzake de integriteit.

      4 In afwijking van het tweede lid legt een tolk of vertaler die niet in Nederland woonachtig is een
      integriteitsverklaring over die is afgegeven door een daartoe bevoegde instantie in het land van herkomst. Onze
      Minister weigert inschrijving van betrokkene in het register indien hij niet overtuigd is dat de overgelegde
      integriteitsverklaring voldoende waarborg biedt inzake de integriteit.

      5 Bij of krachtens algemene maatregel van bestuur worden regels gesteld inzake:

      a. de bij de aanvraag over te leggen gegevens of bescheiden die nodig zijn voor de beoordeling van de aanvraag;

      b. de wijze van indiening van de aanvraag;

      c. het bedrag dat bij behandeling van de aanvraag verschuldigd is.

      6 Onze Minister neemt binnen zes weken een beslissing op de aanvraag tot inschrijving.

      7 Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref2] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref3] niet van toepassing op een verzoek tot inschrijving
      als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0014194
      [ref2]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel4
