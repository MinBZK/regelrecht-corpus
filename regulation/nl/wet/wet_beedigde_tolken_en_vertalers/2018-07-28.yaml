  - number: '5'
    text: |-
      De aanvraag tot inschrijving wordt afgewezen indien:

      a. de aanvrager niet voldoet aan de in [artikel 3][ref1] bedoelde eisen;

      b. de aanvrager vreemdeling is en geen rechtmatig verblijf heeft in Nederland in de zin van
      [artikel 8, aanhef en onder a tot en met e, dan wel l, van de Vreemdelingenwet 2000][ref2], of niet gerechtigd is
      in Nederland arbeid te verrichten;

      c. de aanvrager ingevolge een in kracht van gewijsde gegane rechterlijke uitspraak onder curatele is gesteld wegens
      zijn lichamelijke of geestelijke toestand; of

      d. een op grond van deze wet jegens de aanvrager genomen maatregel van doorhaling van de inschrijving zich
      daartegen verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0022704#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0022704/2018-07-28#Artikel5
