  - number: '3.1'
    text: Met inachtneming van dit hoofdstuk heeft de werkloze persoon recht op een uitkering.
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel3
  - number: '3.2'
    text: |-
      De werkloze persoon heeft geen recht op een uitkering voor zover hij ter zake van de toepassing,
      bedoeld in [artikel 2, eerste, tweede of derde lid][ref1], recht heeft op een uitkering op grond van de
      [Werkloosheidswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007891#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007891
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0004045
  - number: '3.3'
    text: |-
      Voor zover in deze wet niet anders wordt bepaald, zijn de [Werkloosheidswet][ref1] en de daarop berustende
      bepalingen van overeenkomstige toepassing op de werkloze persoon die recht heeft op een uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '3.4'
    text: |-
      Voor de toepassing van andere wetten en de daarop berustende bepalingen, wordt een uitkering op grond van deze wet
      aangemerkt als uitkering op grond van de verplichte verzekering ingevolge de [Werkloosheidswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '4.1'
    text: |-
      De uitkering gaat in op de eerste dag nadat als gevolg van de toepassing, bedoeld in
      [artikel 2, eerste, tweede of derde lid][ref1], het einde van de duur van een daarop betrekking hebbende uitkering
      op grond van de [Werkloosheidswet][ref2] is bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0007891#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007891
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0004045
  - number: '4.2'
    text: |-
      Voor de werkloze persoon die, nadat hij als gevolg van de toepassing, bedoeld in
      [artikel 2, eerste, tweede of derde lid][ref1], zijn recht op een arbeidsongeschiktheidsuitkering verliest dan wel
      voor een lagere arbeidsongeschiktheidsuitkering in aanmerking komt, geen recht op een daarop betrekking hebbende
      uitkering op grond van de [Werkloosheidswet][ref2] heeft, gaat de uitkering in op de eerste dag van werkloosheid.


      [ref1]: https://wetten.overheid.nl/BWBR0007891#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007891
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0004045
  - number: '4.3'
    text: |-
      Indien het recht op de uitkering geheel of gedeeltelijk is geëindigd of niet ingegaan wegens het verrichten van
      arbeid als werknemer en ter zake van die arbeid recht op een uitkering op grond van de [Werkloosheidswet][ref1] is
      ontstaan, herleeft het recht op de uitkering geheel of gedeeltelijk respectievelijk gaat het recht op de uitkering
      in op de eerste dag nadat het einde van de duur van die uitkering op grond van de [Werkloosheidswet][ref2] is
      bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
  - number: '4.4'
    text: |-
      Indien het recht op de uitkering geheel of gedeeltelijk is geëindigd of niet ingegaan wegens het
      verrichten van arbeid als werknemer en ter zake van die arbeid geen recht op een uitkering op grond van de
      [Werkloosheidswet][ref1] is ontstaan, herleeft het recht op de uitkering geheel of gedeeltelijk respectievelijk
      gaat het recht op de uitkering in op de eerste dag van werkloosheid.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '4.5'
    text: |-
      In afwijking van het eerste en derde lid gaat de uitkering niet in indien zich onmiddellijk aansluitend aan het
      einde van de duur van een uitkering op grond van de [Werkloosheidswet][ref1] een omstandigheid voordoet als bedoeld
      in [artikel 19, eerste lid, onderdeel e, g of j, van die wet][ref2] of indien de werkloze persoon niet voldoet
      aan de voorwaarde, bedoeld in [artikel 16, eerste lid, onderdeel b, van die wet][ref3] anders dan wegens ziekte
      of arbeidsongeschiktheid, of indien zich een combinatie van de hier bedoelde omstandigheden voordoet en deze
      omstandigheid of omstandigheden aaneensluitend langer dan zes maanden hebben geduurd. Indien deze omstandigheid of
      omstandigheden niet langer dan zes maanden aaneensluitend hebben geduurd, gaat de uitkering in op de eerste dag dat
      deze omstandigheden zich niet meer voordoen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '19'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '16'
  - number: '4.6'
    text: |-
      In afwijking van het tweede en vierde lid gaat de uitkering niet in indien tussen het moment waarop
      de werkloze persoon zijn recht op een arbeidsongeschiktheidsuitkering verliest dan wel voor een lagere
      arbeidsongeschiktheidsuitkering in aanmerking komt respectievelijk ophoudt arbeid als werknemer te verrichten en
      de eerste dag van werkloosheid, een periode van meer dan 13 weken ligt. Bij het bepalen van deze periode worden
      perioden van ziekte en arbeidsongeschiktheid niet meegeteld.
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel4
  - number: '5.1'
    text: |-
      Het recht op uitkering wordt op grond van [hoofdstuk II van de Werkloosheidswet][ref1] vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: II
  - number: '5.2'
    text: |-
      Bij het vaststellen van het recht op uitkering zijn de [artikelen 17][ref1], [17a][ref2],
      [42][ref3] en [42a van de Werkloosheidswet][ref4] niet van toepassing. Het tijdvak, bedoeld in
      [artikel 8, tweede lid, van de Werkloosheidswet][ref5] wordt verlengd tot drie jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel17a
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel42
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel42a
      [ref5]: https://wetten.overheid.nl/BWBR0004045#Artikel8
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 17a
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '42'
      - id: ref4
        bwb_id: BWBR0004045
        artikel: 42a
      - id: ref5
        bwb_id: BWBR0004045
        artikel: '8'
  - number: '5.3'
    text: |-
      Aan de werkloze persoon wordt vakantiebijslag in de maand mei over de aan die maand voorafgaande maanden
      uitbetaald, of indien het recht op uitkering eerder dan in de maand mei geheel eindigt, in de desbetreffende maand.
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel5
  - number: 5a.1
    text: De uitkering bedraagt per dag 70% van het minimumloon.
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel5a
  - number: 5a.2
    text: |-
      Voor de werknemer die bij het ontstaan van zijn recht op uitkering zijn arbeidsuren, bedoeld in
      [artikel 16 van de Werkloosheidswet][ref1], uit de dienstbetrekking waaruit hij werkloos werd niet volledig
      heeft verloren of wiens verlies van arbeidsuren tijdens de duur van de uitkering wijziging ondergaat, bedraagt
      de uitkering 70% van het minimumloon, vermenigvuldigd met het aantal uren werkloosheid per kalenderweek, gedeeld
      door het aantal arbeidsuren voorafgaande aan het intreden van het verlies van arbeidsuren waarnaar zijn recht is
      berekend. Het aantal arbeidsuren voorafgaande aan het verlies van arbeidsuren wordt bepaald met toepassing van
      [artikel 16 van de Werkloosheidswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '16'
  - number: 5a.3
    text: |-
      Voor de werknemer, die naast een uitkering op grond van deze wet een uitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2]
      of de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref3] ontvangt, bedraagt de uitkering per dag 70%
      van een percentage van het minimumloon. Dat percentage is gelijk aan het verschil tussen 100 en het midden van de
      arbeidsongeschiktheidsklasse, waarin de werknemer is ingedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0008656
      [ref3]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0008656
      - id: ref3
        bwb_id: BWBR0008657
  - number: 5a.4
    text: |-
      Op de herziening van de uitkering als gevolg van een wijziging van het minimumloon zijn de [artikelen 3:41][ref1]
      en [3:45 van de Algemene wet bestuursrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 5a.5
    text: |-
      De hoogte van de uitkering, bedoeld in [artikel 4, derde en vierde lid][ref1], wordt niet anders vastgesteld
      dan dat deze na de eerste toepassing, bedoeld in [artikel 2, eerste, tweede of derde lid][ref2], is vastgesteld
      of zou zijn vastgesteld indien de werkloze persoon geen arbeid had verricht, tenzij de werkloze persoon als
      gevolg van een volgende toepassing als bedoeld in [artikel 2, eerste, tweede, of derde lid][ref3], in een andere
      arbeidsongeschiktheidsklasse wordt ingedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0007891#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007891#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007891#Artikel2
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0007891
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007891
        artikel: '2'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0007891
        artikel: '2'
        hoofdstuk: '1'
  - number: 5b.1
    text: |-
      Indien de uitkering op grond van [hoofdstuk II van de Werkloosheidswet][ref1] berekend was naar een dagloon lager
      dan het minimumloon, bedraagt de uitkering per dag 70% van het dagloon.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: II
  - number: 5b.2
    text: |-
      De [artikelen 45][ref1] en [46 van de Werkloosheidswet][ref2] en de daarop berustende bepalingen zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel46
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '45'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '46'
  - number: 5b.3
    text: |-
      [Artikel 5a, tweede lid][ref1], is van toepassing, met dien verstande dat in plaats van het minimumloon het dagloon
      in aanmerking wordt genomen. De eerste zin vindt geen toepassing voorzover bij de vaststelling respectievelijk
      herziening van het dagloon met de omstandigheden, bedoeld in [artikel 5a, tweede lid][ref2], rekening is gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0007891#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0007891#Artikel5a
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0007891
        artikel: 5a
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007891
        artikel: 5a
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '6'
    text: |-
      De uitkering eindigt met ingang van de dag waarop de werkloze persoon de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: '7'
    text: |-
      Deze paragraaf is van toepassing op de werkloze persoon, op wie [artikel 4, tweede lid][ref1], toepassing vindt of
      toepassing zou vinden indien [artikel 4, derde, vierde of vijfde lid][ref2] niet op hem van toepassing zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007891#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007891#Artikel4
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel7
