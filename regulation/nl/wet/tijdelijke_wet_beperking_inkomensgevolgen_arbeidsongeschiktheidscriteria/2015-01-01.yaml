  - number: 2.2.b
    text: |-
      wiens recht op pensioen door toepassing van artikel E 6 van de Algemene militaire pensioenwet zoals dat artikel
      luidde op de dag voorafgaande aan de intrekking daarvan of door toepassing van de daarmee overeenkomende bepalingen
      op basis van de [Kaderwet militaire pensioenen][ref1] en de daarop berustende bepalingen met betrekking tot het
      arbeidsongeschiktheidscriterium op een lagere mate van arbeidsongeschiktheid wordt gebaseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0011955
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011955
  - number: '2.3'
    text: |-
      Deze wet en de daarop berustende bepalingen zijn mede van toepassing op de persoon die op 1 augustus 1993
      de leeftijd van 45 jaar had bereikt en die op 31 juli 1993 recht had op een arbeidsongeschiktheidsuitkering
      op grond van de Algemene Arbeidsongeschiktheidswet, de [Wet op de arbeidsongeschiktheidsverzekering][ref1]
      of de [Wet arbeidsongeschiktheidsvoorziening militairen][ref2] of een herplaatsingstoelage,
      herplaatsingswachtgeld of invaliditeitspensioen op grond van de Spoorwegpensioenwet en die vanaf
      1 augustus 1993 door de toepassing van artikel 5 van de Algemene Arbeidsongeschiktheidswet of
      [artikel 18 van de Wet op de arbeidsongeschiktheidsverzekering][ref3] zoals deze artikelen voor deze persoon na
      de inwerkingtreding van de [Wet terugdringing beroep op de arbeidsongeschiktheidsregelingen][ref4] zijn blijven
      luiden, zijn recht op een arbeidsongeschiktheidsuitkering verliest of heeft verloren dan wel voor een lagere
      arbeidsongeschiktheidsuitkering in aanmerking komt of is gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0002822
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0006072
