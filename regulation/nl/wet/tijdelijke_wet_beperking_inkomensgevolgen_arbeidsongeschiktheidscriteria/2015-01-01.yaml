        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '8.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen stelt zo veel mogelijk overeenkomstig
      [artikel 16 van de Werkloosheidswet][ref1] en de daarop berustende bepalingen het aantal arbeidsuren, alsmede het
      aantal verloren arbeidsuren per kalenderweek vast.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '16'
  - number: '8.2'
    text: |-
      De werkloze persoon wordt voor het aantal verloren arbeidsuren de hoedanigheid van werknemer in de zin van de
      [Werkloosheidswet][ref1] toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '8.3'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen stelt regels omtrent het aantal arbeidsuren en het aantal verloren
      arbeidsuren, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel8
  - number: '9.1'
    text: |-
      Het dagloon dat ten grondslag ligt aan de uitkering van de werkloze persoon aan wie op de dag voor
      de toepassing, bedoeld in [artikel 2, eerste of derde lid][ref1], een uitkering op grond van de
      Algemene Arbeidsongeschiktheidswet wordt uitbetaald of, indien artikel 16, 19 of 21 van die wet op
      hem niet van toepassing was, zou worden uitbetaald, is gelijk aan de grondslag, berekend volgens de
      bij en krachtens die wet vastgestelde bepalingen. De eerste zin is van overeenkomstige toepassing
      op uitkeringen die als gevolg van de toepassing van [artikel XIII, vijfde en zesde lid][ref2], of
