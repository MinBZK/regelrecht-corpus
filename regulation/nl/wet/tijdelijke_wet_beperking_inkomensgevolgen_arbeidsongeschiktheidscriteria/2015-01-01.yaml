      [Werkloosheidswet][ref1], die tevens persoon is als bedoeld in artikel XX, XXI, XXIV of XXV van de
      [Wet terugdringing beroep op de arbeidsongeschiktheidsregelingen][ref2] en die op 31 december 1986 de leeftijd van
      35 jaar had bereikt en


