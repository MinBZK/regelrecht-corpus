      - id: ref2
        bwb_id: BWBR0006072
  - number: 2.2.a
    text: |-
      die door de conforme toepassing van [artikel 18 van de Wet op de arbeidsongeschiktheidsverzekering][ref1] zijn
      recht op een WAO-conforme uitkering verliest, dan wel voor een lagere WAO-conforme uitkering in aanmerking komt; of


