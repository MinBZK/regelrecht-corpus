  - number: '9.8'
    text: |-
      Het dagloon dat ten grondslag ligt aan de uitkering van de werkloze persoon aan wie op de dag voor de
      toepassing, bedoeld in [artikel 2, tweede lid][ref1], pensioen wordt uitbetaald uit hoofde van ziekte of
      gebreken op grond van de Algemene militaire pensioenwet, zoals deze op die dag luidde is gelijk aan de
      door 261 gedeelde uitkeringsgrondslag of vervolguitkeringsgrondslag waarnaar dat invaliditeitspensioen was
      berekend. Indien op het in de eerste volzin bedoelde pensioen ingevolge artikel F 7a van de Algemene militaire
      pensioenwet, zoals dat artikel met betrekking tot de uitbetaling van dat pensioen luidde een toeslag was
      verleend, wordt voor de vaststelling van het dagloon het bedrag van de grondslag verhoogd met die toeslag.
      [Artikel 15 van de Wet op de arbeidsongeschiktheidsverzekering][ref2] is van toepassing op het dagloon, bedoeld in
      dit lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007891#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel15
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007891
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '15'
  - number: '10.1'
    text: |-
      De hoogte van de uitkering van de werkloze persoon die op de dag voor de toepassing, bedoeld in
      [artikel 2, eerste, tweede of derde lid][ref1], 80% of meer arbeidsongeschikt was, wordt op grond van de
      [artikelen 5a][ref2] en [5b][ref3] vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007891#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007891#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0007891#Artikel5b
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007891
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0007891
        artikel: 5a
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007891
        artikel: 5b
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '10.2'
    text: |-
      In afwijking van de [artikelen 5a][ref1] en [5b][ref2] wordt de hoogte van de uitkering van de werkloze persoon die
      voor de toepassing, bedoeld in [artikel 2, eerste, tweede of derde lid][ref3], minder dan 80% arbeidsongeschiktheid
      was, overeenkomstig de leden 3 tot en met 6 vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007891#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0007891#Artikel5b
      [ref3]: https://wetten.overheid.nl/BWBR0007891#Artikel2
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007891
        artikel: 5a
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007891
        artikel: 5b
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007891
        artikel: '2'
        hoofdstuk: '1'
  - number: '10.3'
    text: |-
      De uitkering bedraagt per dag 70% van een percentage van het minimumloon. Indien de werkloze
      persoon na de toepassing, bedoeld in [artikel 2, eerste, tweede of derde lid][ref1], zijn recht
      op een arbeidsongeschiktheidsuitkering verliest, is dit percentage gelijk aan het midden van de
      arbeidsongeschiktheidsklasse waarin de werkloze persoon is ingedeeld voor die toepassing. Indien de
      werkloze persoon na de toepassing, bedoeld in [artikel 2, eerste, tweede of derde lid][ref2], voor een
      arbeidsongeschiktheidsuitkering in aanmerking blijft komen, is dit percentage gelijk aan het verschil tussen het
      midden van de arbeidsongeschiktheidsklasse waarin de werkloze persoon is ingedeeld op de dag voor de toepassing,
      bedoeld in [artikel 2, eerste, tweede of derde lid][ref3], en het midden van de arbeidsongeschiktheidsklasse waarin
      de werkloze persoon is ingedeeld na die toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007891#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007891#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007891#Artikel2
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007891
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0007891
        artikel: '2'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0007891
        artikel: '2'
        hoofdstuk: '1'
  - number: '10.4'
    text: |-
      Indien de werkloze persoon op een tijdstip na de toepassing van het derde lid, wederom als gevolg van
      de toepassing, bedoeld in [artikel 2, eerste, tweede of derde lid][ref1], wordt ingedeeld in een andere
      arbeidsongeschiktheidsklasse, is het in de eerste volzin van het derde lid bedoelde percentage gelijk aan het
      verschil tussen het midden van de arbeidsongeschiktheidsklasse waarin de werkloze persoon is ingedeeld op de dag
      voor de toepassing, bedoeld in het derde lid, en het midden van de nieuwe arbeidsongeschiktheidsklasse, waarin de
      werkloze persoon is ingedeeld na de hernieuwde toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007891#Artikel2
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007891
        artikel: '2'
        hoofdstuk: '1'
  - number: '10.5'
    text: |-
      Indien het dagloon, bedoeld in [artikel 9][ref1], lager is dan het minimumloon wordt voor de toepassing van het
      derde en vierde lid het dagloon voor het minimumloon in de plaats gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007891#Artikel9
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007891
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '10.6'
    text: |-
      In afwijking van het derde tot en met vijfde lid, wordt de uitkering voor de werkloze persoon die,
      voorafgaand aan de toepassing, bedoeld in [artikel 2, eerste, tweede of derde lid][ref1], recht op een
      arbeidsongeschiktheidsuitkering per dag van 70% of meer van het minimumloon had en als gevolg van die toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0007891#Artikel2
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007891
        artikel: '2'
        hoofdstuk: '1'
  - number: 10.6.a
    text: |-
      zijn recht op een arbeidsongeschiktheidsuitkering verliest en recht krijgt op een uitkering per dag van minder dan
      70% van het minimumloon, vastgesteld op 70% van het minimumloon;
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel10
  - number: 10.6.b
    text: |-
      recht krijgt op een uitkering en een arbeidsongeschiktheidsuitkering die tezamen per dag minder dan 70% van het
      minimumloon bedragen, zodanig vastgesteld dat deze uitkeringen per dag tezamen 70% van het minimumloon bedragen.
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel10
  - number: '11'
    text: |-
      De werkloze persoon, die recht heeft of heeft gehad op een arbeidsongeschiktheidsuitkering en recht krijgt op een
      uitkering, is verzekerd bij het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel11
  - number: '12.1'
    text: |-
      De op grond van deze wet te betalen uitkeringen en de aan de uitvoering van deze wet verbonden kosten worden ten
      laste van het Toeslagenfonds, bedoeld in [artikel 31 van de Toeslagenwet][ref1], gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel31
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '31'
  - number: '12.2'
    text: |-
      Het Rijk voorziet het Toeslagenfonds van de middelen tot dekking van de uitkeringen en kosten, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel12
  - number: '12.3'
    text: |-
      De regels die op grond van [artikel 122 van de Wet financiering sociale verzekeringen][ref1] zijn gesteld over
      de wijze waarop en de voorwaarden waaronder de afdracht van gelden door het Rijk aan het Uitvoeringsinstituut
      werknemersverzekeringen ten gunste van het Toeslagenfonds plaatsvindt, zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel122
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '122'
  - number: '12.4'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen beheert en administreert afzonderlijk de middelen tot dekking van
      de uitgaven, bedoeld in het eerste lid, in de vorm van een onderdeel van het Toeslagenfonds.
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel12
  - number: '14'
    text: |-
      Deze wet treedt in werking met ingang van 1 januari 1996. Indien het *Staatsblad* waarin deze wet wordt geplaatst
      wordt uitgegeven na 1 januari 1996, treedt zij in werking met ingang van de dag na de datum van uitgifte van het
      *Staatsblad* waarin zij wordt geplaatst, en werkt zij terug tot en met 1 januari 1996. Deze wet vervalt met ingang
      van 31 juli 2017.
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel14
  - number: '15'
    text: 'Deze wet wordt aangehaald als: Tijdelijke wet beperking inkomensgevolgen arbeidsongeschiktheidscriteria.'
    url: https://wetten.overheid.nl/BWBR0007891/2015-01-01#Artikel15
