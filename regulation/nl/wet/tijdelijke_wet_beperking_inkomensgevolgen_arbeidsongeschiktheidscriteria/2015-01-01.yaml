      grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref2] wordt uitbetaald of indien [artikel 25][ref3],
      [28][ref4], [30][ref5] of [33 van die wet][ref6] niet op hem van overeenkomstige toepassing was, zou worden
      uitbetaald, is gelijk aan het dagloon berekend volgens de bij of krachtens de [Wet privatisering ABP][ref7]
