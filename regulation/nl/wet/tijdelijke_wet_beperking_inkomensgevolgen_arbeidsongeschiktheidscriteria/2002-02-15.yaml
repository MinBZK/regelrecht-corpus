  - number: '14'
    text: |-
      Deze wet treedt in werking met ingang van 1 januari 1996.

      Indien het *Staatsblad* waarin deze wet wordt geplaatst wordt uitgegeven na 1 januari 1996, treedt zij in werking
      met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin zij wordt geplaatst, en werkt zij terug
      tot en met 1 januari 1996. Deze wet vervalt met ingang van 1 december 2016.
    url: https://wetten.overheid.nl/BWBR0007891/2002-02-15#Artikel14
