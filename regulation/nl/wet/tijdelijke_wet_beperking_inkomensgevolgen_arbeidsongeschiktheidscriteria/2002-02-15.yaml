  - number: '10'
    text: |-
      1 De hoogte van de uitkering van de werkloze persoon die op de dag voor de toepassing, bedoeld in artikel
      2, eerste, tweede of derde lid, 80% of meer arbeidsongeschikt was, wordt op grond van artikel 5, vierde lid
      vastgesteld.

      2 In afwijking van artikel 5, vierde lid wordt de hoogte van de uitkering van de werkloze persoon die voor
      de toepassing, bedoeld in artikel 2, eerste, tweede of derde lid, minder dan 80% arbeidsongeschiktheid was,
      overeenkomstig de leden 3 tot en met 6 vastgesteld.

      3 De uitkering bedraagt per dag 70% van een percentage van het minimumloon. Indien de werkloze persoon na de
      toepassing, bedoeld in artikel 2, eerste, tweede of derde lid, zijn recht op een arbeidsongeschiktheidsuitkering
      verliest, is dit percentage gelijk aan het midden van de arbeidsongeschiktheidsklasse waarin de werkloze persoon
      is ingedeeld voor die toepassing. Indien de werkloze persoon na de toepassing, bedoeld in artikel 2, eerste,
      tweede of derde lid, voor een arbeidsongeschiktheidsuitkering in aanmerking blijft komen, is dit percentage
      gelijk aan het verschil tussen het midden van de arbeidsongeschiktheidsklasse waarin de werkloze persoon is
      ingedeeld op de dag voor de toepassing, bedoeld in artikel 2, eerste, tweede of derde lid, en het midden van de
      arbeidsongeschiktheidsklasse waarin de werkloze persoon is ingedeeld na die toepassing.

      4 Indien de werkloze persoon op een tijdstip na de toepassing van het derde lid, wederom als gevolg
      van de toepassing, bedoeld in artikel 2, eerste, tweede of derde lid, wordt ingedeeld in een andere
      arbeidsongeschiktheidsklasse, is het in de eerste volzin van het derde lid bedoelde percentage gelijk aan het
      verschil tussen het midden van de arbeidsongeschiktheidsklasse waarin de werkloze persoon is ingedeeld op de dag
      voor de toepassing, bedoeld in het derde lid, en het midden van de nieuwe arbeidsongeschiktheidsklasse, waarin de
      werkloze persoon is ingedeeld na de hernieuwde toepassing.

      5 Indien het dagloon, bedoeld in artikel 9, lager is dan het minimumloon wordt voor de toepassing van het derde en
      vierde lid het dagloon voor het minimumloon in de plaats gesteld.

      6 In afwijking van het derde tot en met vijfde lid, wordt de uitkering voor de werkloze persoon die, voorafgaand
      aan de toepassing, bedoeld in artikel 2, eerste, tweede of derde lid, recht op een arbeidsongeschiktheidsuitkering
      per dag van 70% of meer van het minimumloon had en als gevolg van die toepassing:

      a. zijn recht op een arbeidsongeschiktheidsuitkering verliest en recht krijgt op een uitkering per dag van minder
      dan 70% van het minimumloon, vastgesteld op 70% van het minimumloon;

      b. recht krijgt op een uitkering en een arbeidsongeschiktheidsuitkering die tezamen per dag minder dan 70% van het
      minimumloon bedragen, zodanig vastgesteld dat deze uitkeringen per dag tezamen 70% van het minimumloon bedragen.
    url: https://wetten.overheid.nl/BWBR0007891/2002-02-15#Artikel10
  - number: '11'
    text: |-
      De werkloze persoon, die recht heeft of heeft gehad op een arbeidsongeschiktheidsuitkering en recht krijgt op een
      uitkering, is verzekerd bij het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0007891/2002-02-15#Artikel11
  - number: '12'
    text: |-
      1 De op grond van deze wet te betalen uitkeringen en de aan de uitvoering van deze wet verbonden kosten worden ten
      laste van het Toeslagenfonds, bedoeld in [artikel 31 van de Toeslagenwet][ref1], gebracht.

      2 Het Rijk voorziet het Toeslagenfonds van de middelen tot dekking van de uitkeringen en kosten, bedoeld in het
      eerste lid.

      3 De regels, die op grond van [artikel 52 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2]
      door Onze Minister van Sociale Zaken en Werkgelegenheid en Onze Minister van Financiën zijn gesteld over de
      wijze waarop en de voorwaarden waaronder de afdracht van gelden door het Rijk aan het Uitvoeringsinstituut
      werknemersverzekeringen ten gunste van het Toeslagenfonds plaatsvindt zijn van overeenkomstige toepassing.

      4 Het Uitvoeringsinstituut werknemersverzekeringen beheert en administreert afzonderlijk de middelen tot dekking
      van de uitgaven, bedoeld in het eerste lid, in de vorm van een onderdeel van het Toeslagenfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel52
