  - number: '2'
    text: |-
      1 Deze wet en de daarop berustende bepalingen zijn van toepassing op de persoon
      die door de toepassing van artikel 5 van de Algemene Arbeidsongeschiktheidswet of
      [artikel 18 van de Wet op de arbeidsongeschiktheidsverzekering][ref1], zoals die artikelen luiden na wijziging als
      gevolg van de inwerkingtreding van de [Wet terugdringing beroep op de arbeidsongeschiktheidsregelingen][ref2], zijn
      recht op een arbeidsongeschiktheidsuitkering verliest, dan wel voor een lagere arbeidsongeschiktheidsuitkering in
      aanmerking komt en die:

      a. op 31 december 1986 de leeftijd van 35 jaar had bereikt en op die dag, alsmede op 31 juli 1993 recht had op een
      arbeidsongeschiktheidsuitkering op grond van de Algemene Arbeidsongeschiktheidswet;

      b. op 31 december 1986 de leeftijd van 35 jaar had bereikt en op die dag, alsmede op 31 juli 1993 recht had op
      een arbeidsongeschiktheidsuitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref3] of de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref4]; of

      c. op 31 december 1986 de leeftijd van 35 jaar had bereikt en die op 31 juli 1993 recht had op een
      herplaatsingstoelage, herplaatsingswachtgeld of een invaliditeitspensioen op grond van de Spoorwegpensioenwet.

      2 Deze wet en de daarop berustende bepalingen zijn mede van toepassing op de werknemer bedoeld in de
      [Werkloosheidswet][ref5], die tevens persoon is als bedoeld in artikel XX, XXI, XXIV of XXV van de
      [Wet terugdringing beroep op de arbeidsongeschiktheidsregelingen][ref6] en die op 31 december 1986 de leeftijd van
      35 jaar had bereikt en

      a. die door de conforme toepassing van [artikel 18 van de Wet op de arbeidsongeschiktheidsverzekering][ref7] zijn
      recht op een WAO-conforme uitkering verliest, dan wel voor een lagere WAO-conforme uitkering in aanmerking komt; of

      b. wiens recht op pensioen door toepassing van artikel E 6 van de Algemene militaire pensioenwet zoals dat artikel
      luidde op de dag voorafgaande aan de intrekking daarvan of door toepassing van de daarmee overeenkomende bepalingen
      op basis van de [Kaderwet militaire pensioenen][ref8] en de daarop berustende bepalingen met betrekking tot het
      arbeidsongeschiktheidscriterium op een lagere mate van arbeidsongeschiktheid wordt gebaseerd.

      3 Deze wet en de daarop berustende bepalingen zijn mede van toepassing op de persoon die op 1 augustus 1993
      de leeftijd van 45 jaar had bereikt en die op 31 juli 1993 recht had op een arbeidsongeschiktheidsuitkering
      op grond van de Algemene Arbeidsongeschiktheidswet, de [Wet op de arbeidsongeschiktheidsverzekering][ref9]
      of de [Wet arbeidsongeschiktheidsvoorziening militairen][ref10] of een herplaatsingstoelage,
      herplaatsingswachtgeld of invaliditeitspensioen op grond van de Spoorwegpensioenwet en die vanaf
      1 augustus 1993 door de toepassing van artikel 5 van de Algemene Arbeidsongeschiktheidswet of
      [artikel 18 van de Wet op de arbeidsongeschiktheidsverzekering][ref11] zoals deze artikelen voor deze persoon na
      de inwerkingtreding van de [Wet terugdringing beroep op de arbeidsongeschiktheidsregelingen][ref12] zijn blijven
      luiden, zijn recht op een arbeidsongeschiktheidsuitkering verliest of heeft verloren dan wel voor een lagere
      arbeidsongeschiktheidsuitkering in aanmerking komt of is gekomen.


