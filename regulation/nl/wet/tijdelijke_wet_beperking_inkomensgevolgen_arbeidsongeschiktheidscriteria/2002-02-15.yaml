  - number: '9'
    text: |-
      1 Het dagloon dat ten grondslag ligt aan de uitkering van de werkloze persoon aan wie op de dag
      voor de toepassing, bedoeld in [artikel 2, eerste of derde lid][ref1], een uitkering op grond van
      de Algemene Arbeidsongeschiktheidswet wordt uitbetaald of, indien artikel 16, 19 of 21 van die
      wet op hem niet van toepassing was, zou worden uitbetaald, is gelijk aan de grondslag, berekend
      volgens de bij en krachtens die wet vastgestelde bepalingen. De eerste zin is van overeenkomstige
      toepassing op uitkeringen die als gevolg van de toepassing van artikel XIII, vijfde en zesde lid, of
      __REF001___________________________________________________________________________________________________________
      __ worden aangemerkt als een uitkering op grond van de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3]
      of de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref4].

      2 Het dagloon dat ten grondslag ligt aan de uitkering van de werkloze persoon aan wie op de dag voor de
      toepassing, bedoeld in [artikel 2, eerste of derde lid][ref5], een loondervingsuitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref6] wordt uitbetaald of, indien [artikel 25][ref7], [28][ref8],
      [30][ref9] of [33 van die wet][ref10] op hem niet van toepassing was, zou worden uitbetaald, is gelijk aan het
      dagloon, berekend volgens de bij of krachtens die wet vastgestelde bepalingen.

      3 Het dagloon dat ten grondslag ligt aan de uitkering van de werkloze persoon aan wie op de dag voor
      de toepassing, bedoeld in [artikel 2, eerste of derde lid][ref11], een vervolguitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref12] wordt uitbetaald of, indien [artikel 25][ref13], [28][ref14],
      [30][ref15] of [33 van die wet][ref16] op hem niet van toepassing was, zou worden uitbetaald, is gelijk aan het
      vervolgdagloon, berekend volgens de bij of krachtens die wet vastgestelde bepalingen.

      4 Het dagloon dat ten grondslag ligt aan de uitkering van de werkloze persoon aan wie op de dag voor de
      toepassing, bedoeld in [artikel 2, eerste of derde lid][ref17], een loondervingsuitkering op grond van de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref18] wordt uitbetaald of, indien [artikel 25][ref19],
      [28][ref20], [30][ref21] of [33 van Wet op de arbeidsongeschiktheidsverzekering][ref22] op hem niet van
      overeenkomstige toepassing was, zou worden uitbetaald, is gelijk aan het dagloon, berekend volgens de bij of
      krachtens de [Wet arbeidsongeschiktheidsvoorziening militairen][ref23] vastgestelde bepalingen.

      5 Het dagloon dat ten grondslag ligt aan de uitkering van de werkloze persoon aan wie op de dag voor
      de toepassing, bedoeld in [artikel 2, eerste of derde lid][ref24], een vervolguitkering op grond van de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref25] wordt uitbetaald of, indien [artikel 25][ref26],
      [28][ref27], [30][ref28] of [33 van Wet op de arbeidsongeschiktheidsverzekering][ref29] op hem niet van
      overeenkomstige toepassing was, zou worden uitbetaald, is gelijk aan het vervolgdagloon, berekend volgens de bij of
      krachtens de [Wet arbeidsongeschiktheidsvoorziening militairen][ref30] vastgestelde bepalingen.

      6 Het dagloon dat ten grondslag ligt aan de uitkering van de werkloze persoon aan wie op de dag voor de toepassing,
      bedoeld in [artikel 2, tweede lid][ref31], een WAO-conforme uitkering overeenkomstig de loondervingsuitkering op
      grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref32] wordt uitbetaald of indien [artikel 25][ref33],
      [28][ref34], [30][ref35] of [33 van die wet][ref36] niet op hem van overeenkomstige toepassing was, zou worden
      uitbetaald, is gelijk aan het dagloon berekend volgens de bij of krachtens de [Wet privatisering ABP][ref37]
      vastgestelde bepalingen.

      7 Het dagloon dat ten grondslag ligt aan de uitkering van de werkloze persoon aan wie op de dag voor de toepassing,
      bedoeld in [artikel 2, tweede lid][ref38], een WAO-conforme uitkering overeenkomstig de vervolguitkering op
      grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref39] wordt uitbetaald of indien [artikel 25][ref40],
      [28][ref41], [30][ref42] of [33 van die wet][ref43] niet op hem van overeenkomstige toepassing was, zou worden
      uitbetaald, is gelijk aan het dagloon berekend volgens de bij of krachtens de [Wet privatisering ABP][ref44]
      vastgestelde bepalingen.

      8 Het dagloon dat ten grondslag ligt aan de uitkering van de werkloze persoon aan wie op de dag voor de toepassing,
      bedoeld in [artikel 2, tweede lid][ref45], pensioen wordt uitbetaald uit hoofde van ziekte of gebreken op
      grond van de Algemene militaire pensioenwet, zoals deze op die dag luidde is gelijk aan de door 261 gedeelde
      uitkeringsgrondslag of vervolguitkeringsgrondslag waarnaar dat invaliditeitspensioen was berekend. Indien
      op het in de eerste volzin bedoelde pensioen ingevolge [artikel F 7a van de Algemene militaire pensioenwet]
      (onbekend), zoals dat artikel met betrekking tot de uitbetaling van dat pensioen luidde een toeslag was
      verleend, wordt voor de vaststelling van het dagloon het bedrag van de grondslag verhoogd met die toeslag.
      [Artikel 15 van de Wet op de arbeidsongeschiktheidsverzekering][ref46] is van toepassing op het dagloon, bedoeld in
      dit lid.

      9 Onze Minister kan, in afwijking van het eerste tot en met vijfde lid, regels stellen ter bepaling van het dagloon
      dat ten grondslag ligt aan de uitkering van de werkloze persoon wiens arbeidsongeschiktheidsuitkering voor de
      toepassing, bedoeld in [artikel 2, eerste, tweede of derde lid][ref47], werd uitbetaald:

      a. op grond van [artikel 46a van de Wet op de arbeidsongeschiktheidsverzekering][ref48] of artikel 36a, tweede
      of derde lid, van de Algemene Arbeidsongeschiktheidswet zoals die artikelen luidden op de dag voorafgaand aan de
      inwerkingtreding van de [Wet premiedifferentiatie en marktwerking bij arbeidsongeschiktheidsverzekeringen][ref49];

      b. met toepassing van op grond van [artikel 65c, eerste lid, van de Wet op de arbeidsongeschiktheidsverzekering]
      (onbekend) gestelde regels;

      c. op grond van [artikel 59 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref50]; of

      d. op grond van [artikel 51 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref51].


