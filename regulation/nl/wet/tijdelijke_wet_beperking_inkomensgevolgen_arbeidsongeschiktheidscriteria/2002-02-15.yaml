  - number: '5'
    text: |-
      1 Het recht op uitkering wordt op grond van [hoofdstuk II](onbekend) vastgesteld.

      2 Bij het vaststellen van het recht op uitkering zijn de [artikelen 17][ref1], [17][ref2], en [17][ref3] niet van
      toepassing. Het tijdvak, bedoeld in [artikel 8, tweede lid, van de Werkloosheidswet][ref4] wordt verlengd tot drie
      jaar.

      3 Aan de werkloze persoon wordt vakantiebijslag in de maand mei over de aan die maand voorafgaande 12 maanden
      uitbetaald, of indien het recht op uitkering eerder dan in de maand mei geheel eindigt, in de desbetreffende maand.

      4 De hoogte van de uitkering wordt op grond van [hoofdstuk II](onbekend), [afdeling III, paragraaf 2 van de
      Werkloosheidswet](onbekend) vastgesteld.

      5 De hoogte van de uitkering, bedoeld in artikel 4, derde en vierde lid, wordt niet anders vastgesteld dan dat deze
      na de eerste toepassing, bedoeld in artikel 2, eerste, tweede of derde lid, is vastgesteld of zou zijn vastgesteld
      indien de werkloze persoon geen arbeid had verricht, tenzij de werkloze persoon als gevolg van een volgende
      toepassing als bedoeld in artikel 2, eerste, tweede, of derde lid, in een andere arbeidsongeschiktheidsklasse wordt
      ingedeeld.


