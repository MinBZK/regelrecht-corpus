  - number: '8'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen stelt zo veel mogelijk overeenkomstig
      [artikel 16 van de Werkloosheidswet][ref1] en de daarop berustende bepalingen het aantal arbeidsuren, alsmede het
      aantal verloren arbeidsuren per kalenderweek vast.

      2 De werkloze persoon wordt voor het aantal verloren arbeidsuren de hoedanigheid van werknemer in de zin van de
      [Werkloosheidswet][ref2] toegekend.

      3 Het Uitvoeringsinstituut werknemersverzekeringen stelt regels omtrent het aantal arbeidsuren en het aantal
      verloren arbeidsuren, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
