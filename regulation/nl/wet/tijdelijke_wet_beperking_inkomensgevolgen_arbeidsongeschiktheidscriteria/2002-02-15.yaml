preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is voor personen in bepaalde leeftijdscategorieën die
    langdurig recht op een arbeidsongeschiktheidsuitkering hebben gehad en door wijziging van een aantal wetten
    als gevolg van de inwerkingtreding van de Wet terugdringing beroep arbeidsongeschiktheidsregelingen hun recht
    op een arbeidsongeschiktheidsuitkering verliezen dan wel voor een lagere arbeidsongeschiktheidsuitkering
    in aanmerking komen en voor personen die op het moment van inwerkingtreding van die wet 50 jaar of ouder
    waren en op grond van het arbeidsongeschiktheidscriterium zoals dat voor deze personen is gehandhaafd,
    hun recht op een arbeidsongeschiktheidsuitkering verliezen of hebben verloren dan wel voor een lagere
    arbeidsongeschiktheidsuitkering in aanmerking komen of zijn gekomen, de inkomensgevolgen te beperken en in verband
    hiermee een tijdelijke regeling te treffen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007891/2002-02-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. arbeidsongeschiktheidsuitkering: de arbeidsongeschiktheidsuitkering, bedoeld in de Algemene
      Arbeidsongeschiktheidswet, zoals die wet luidde op de dag voorafgaand aan de inwerkingtreding
      van de [Invoeringswet nieuwe en gewijzigde arbeidsongeschiktheidsregelingen][ref1], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref2], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3],
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref4] of de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref5], WAO-conforme uitkering, bedoeld in
      de [Wet privatisering ABP][ref6] of pensioen ter zake van ziekte of gebreken, bedoeld in de
      Algemene militaire pensioenwet dan wel pensioen ter zake van ziekte of gebreken, bedoeld in de op
      [artikel 2, vijfde lid, van de Kaderwet militaire pensioenen][ref7] berustende bepalingen;

      b. werkloze persoon: de persoon, bedoeld in [artikel 2, eerste en derde lid][ref8] en de werknemer, bedoeld in
      [artikel 2, tweede lid][ref9];

      c. Uitvoeringsinstituut werknemersverzekeringen: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref10].


