  - number: '3'
    text: |-
      1 Met inachtneming van dit hoofdstuk heeft de werkloze persoon recht op een uitkering.

      2 De werkloze persoon heeft geen recht op een uitkering voor zover hij ter zake van de toepassing, bedoeld in
      artikel 2, eerste, tweede of derde lid, recht heeft op een uitkering op grond van de [Werkloosheidswet][ref1].

      3 Voor zover in deze wet niet anders wordt bepaald, zijn de [Werkloosheidswet][ref2] en de daarop berustende
      bepalingen van overeenkomstige toepassing op de werkloze persoon die recht heeft op een uitkering.

      4 Voor de toepassing van andere wetten en de daarop berustende bepalingen, wordt een uitkering op grond van deze
      wet aangemerkt als vervolguitkering op grond van de verplichte verzekering ingevolge de [Werkloosheidswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0004045
