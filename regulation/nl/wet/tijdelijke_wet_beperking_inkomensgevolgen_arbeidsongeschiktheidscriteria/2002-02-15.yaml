  - number: '4'
    text: |-
      1 De uitkering gaat in op de eerste dag nadat als gevolg van de toepassing, bedoeld in
      [artikel 2, eerste, tweede of derde lid][ref1], het einde van de duur van een daarop betrekking hebbende uitkering
      op grond van de [Werkloosheidswet][ref2] is bereikt.

      2 Voor de werkloze persoon die, nadat hij als gevolg van de toepassing, bedoeld in
      [artikel 2, eerste, tweede of derde lid][ref3], zijn recht op een arbeidsongeschiktheidsuitkering verliest dan wel
      voor een lagere arbeidsongeschiktheidsuitkering in aanmerking komt, geen recht op een daarop betrekking hebbende
      uitkering op grond van de [Werkloosheidswet][ref4] heeft, gaat de uitkering in op de eerste dag van werkloosheid.

      3 Indien het recht op de uitkering geheel of gedeeltelijk is geëindigd of niet ingegaan wegens het verrichten van
      arbeid als werknemer en ter zake van die arbeid recht op een uitkering op grond van de [Werkloosheidswet][ref5] is
      ontstaan, herleeft het recht op de uitkering geheel of gedeeltelijk respectievelijk gaat het recht op de uitkering
      in op de eerste dag nadat het einde van de duur van die uitkering op grond van de [Werkloosheidswet][ref6] is
      bereikt.

      4 Indien het recht op de uitkering geheel of gedeeltelijk is geëindigd of niet ingegaan wegens het
      verrichten van arbeid als werknemer en ter zake van die arbeid geen recht op een uitkering op grond van de
      [Werkloosheidswet][ref7] is ontstaan, herleeft het recht op de uitkering geheel of gedeeltelijk respectievelijk
      gaat het recht op de uitkering in op de eerste dag van werkloosheid.

      5 In afwijking van het eerste en derde lid gaat de uitkering niet in indien zich onmiddellijk aansluitend aan het
      einde van de duur van een uitkering op grond van de [Werkloosheidswet][ref8] een omstandigheid voordoet als bedoeld
      in [artikel 19, eerste lid, onderdeel ][ref9] of indien de werkloze persoon niet voldoet aan de voorwaarde, bedoeld
      in [artikel 16, eerste lid, onderdeel ][ref10] anders dan wegens ziekte of arbeidsongeschiktheid, of indien zich
      een combinatie van de hier bedoelde omstandigheden voordoet en deze omstandigheid of omstandigheden aaneensluitend
      langer dan zes maanden hebben geduurd.

      Indien deze omstandigheid of omstandigheden niet langer dan zes maanden aaneensluitend hebben geduurd, gaat de
      uitkering in op de eerste dag dat deze omstandigheden zich niet meer voordoen.

      6 In afwijking van het tweede en vierde lid gaat de uitkering niet in indien tussen het moment waarop
      de werkloze persoon zijn recht op een arbeidsongeschiktheidsuitkering verliest dan wel voor een lagere
      arbeidsongeschiktheidsuitkering in aanmerking komt respectievelijk ophoudt arbeid als werknemer te verrichten en
      de eerste dag van werkloosheid, een periode van meer dan 13 weken ligt. Bij het bepalen van deze periode worden
      perioden van ziekte en arbeidsongeschiktheid niet meegeteld.


