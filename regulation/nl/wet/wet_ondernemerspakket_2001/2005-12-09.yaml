  - number: XIVd
    text: |-
      1 Voor de toepassing van [artikel 20a, eerste lid, van de Wet op de vennootschapsbelasting 1969][ref1] blijft een
      wijziging van het uiteindelijke belang in de belastingplichtige die voor 27 juni 2000 heeft plaatsgevonden buiten
      aanmerking, mits

      a. indien deze wet niet tot wet zou zijn verheven en in werking zou zijn getreden,
      [artikel 20, vijfde lid, van de Wet op de vennootschapsbelasting 1969][ref2] niet van toepassing zou zijn, en

      b. de belastingplichtige direct voorafgaande aan de wijziging een onderneming dreef.

      2 Het eerste lid is slechts van toepassing met betrekking tot jaren waarin is voldaan aan de voorwaarde, bedoeld in
