  - number: XIVc
    text: |-
      Voor de toepassing van [artikel 15e van de Wet op de vennootschapsbelasting 1969][ref1] worden, indien het
      uiteindelijke belang in de belastingplichtige op of na 18 oktober 2000 en vóór 1 januari 2001 in belangrijke
      mate is gewijzigd, het tijdstip van deze wijziging en het direct daaraan voorafgaande tijdstip op 1 januari 2001
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15e
