  - number: XIVa
    text: |-
      1 In afwijking in zoverre van het bepaalde krachtens [artikel 25, eerste lid, van de Invorderingswet 1990][ref1]
      verleent de ontvanger de belastingschuldige die in het kader van de Regeling beëindiging veehouderijtakken (Stcrt.
      2000, 55) zijn onderneming staakt na 19 maart 2000 en voor 1 januari 2001 op diens schriftelijk verzoek uitstel
      van betaling voor de duur van ten hoogste tien jaar, mits voldoende zekerheid is gesteld, voor belastingaanslagen
      voorzover daarin is begrepen inkomstenbelasting die bij staking van die onderneming is verschuldigd en kan worden
      toegerekend aan het verschil tussen de boekwaarde en de waarde in het economische verkeer van een eigen woning,
      daaronder begrepen de niet onafhankelijk van die woning te verkopen aanhorigheden en de ondergrond van zodanige
      woning en aanhorigheden, die ten tijde van de staking tot het ondernemingsvermogen behoort. De belasting op het in
      de eerste volzin bedoelde verschil wordt zoveel mogelijk bepaald naar het tarief van artikel 57, tweede lid, van de
      Wet op de inkomstenbelasting 1964.

      2 Het uitstel wordt slechts verleend voorzover de belastingschuldige geacht wordt over onvoldoende middelen –
      andere dan de eigen woning – te beschikken om zonder uitstel de belasting te voldoen en aannemelijk maakt dat de
      belasting binnen de periode waarvoor uitstel wordt verleend, kan worden voldaan.

      3 Het uitstel wordt beëindigd:

      a. in geval van faillissement van de belastingschuldige;

      b. ingeval de schuldsaneringsregeling natuurlijke personen ten aanzien van de belastingschuldige van toepassing is;

      c. in geval van overlijden van de belastingschuldige, tenzij de partner, met wie de belastingschuldige duurzaam een
      gezamenlijke huishouding heeft gevoerd en die ten tijde van het overlijden van de belastingschuldige als ingezetene
      op het gezamenlijke woonadres is ingeschreven in de basisadministratie persoonsgegevens, aannemelijk maakt dat
      voldoening van de belasting gedurende de periode waarvoor uitstel is verleend mogelijk is en zich verbindt de
      resterende belastingschuld binnen die periode te voldoen;

      d. ingeval de woning wordt vervreemd of indien de woning anderszins het karakter van eigen woning verliest.

      4 Met betrekking tot het bedrag waarvoor op de voet van het eerste lid uitstel is verleend, is gedurende het
      uitstel verrekening niet mogelijk, tenzij de belastingschuldige dit verzoekt.

      5 Voor de toepassing van het eerste lid wordt de heffingsrente voorzover deze samenhangt met de inkomstenbelasting
      waarvoor op de voet van dat lid uitstel is verleend, gelijkgesteld met die belasting.


