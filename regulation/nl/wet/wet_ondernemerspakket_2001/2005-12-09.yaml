  - number: XV
    text: |-
      1 Deze wet treedt in werking met ingang van 1 januari 2001, met uitzondering van
      [artikel XI, onderdelen A en B][ref1], dat in werking treedt op 31 december 2000.

      2 [Artikel 20a van de Wet op de vennootschapsbelasting 1969][ref2] is voor het eerst van toepassing met ingang van
      boekjaren die op of na 18 oktober 2000 aanvangen.

      3 [Artikel 3.65 van de Wet inkomstenbelasting 2001][ref3] is van toepassing op omzettingen als bedoeld in dat
      artikel waarbij de oprichting van de naamloze of besloten vennootschap of de inbreng van de onderneming in de
      vennootschap op of na 1 januari 2001 plaatsvindt. In afwijking van de eerste volzin is artikel 18 van de Wet
      op de inkomstenbelasting 1964, zoals die bepaling luidde op 31 december 2000, nog van toepassing indien het
      voornemen tot de omzetting voor 1 januari 2001 is vastgelegd en geregistreerd en de overgang van de heffing van
      inkomstenbelasting naar de heffing van vennootschapsbelasting eveneens voor 1 januari 2001 plaatsvindt.

      4 De in [artikel IV][ref4] opgenomen wijzigingen werken terug tot en met 1 januari 2000.

      5 [Artikel VII, onderdeel E][ref5], vindt eerst toepassing met betrekking tot vervreemdingen die
      hebben plaatsgevonden na 31 december 2000. Voor vervreemdingen van voor 1 januari 2001 blijft
      [artikel 40 van de Invorderingswet 1990][ref6] gelden zoals dat luidde op 31 december 2000.

      6 [Artikel XII][ref7] werkt terug tot en met 27 juni 2000.


