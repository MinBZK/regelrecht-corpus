  - number: XIV
    text: |-
      Met betrekking tot de aansprakelijkheidstelling voor 1 januari 2001 op de voet van
      [artikel 40 van de Invorderingswet 1990][ref1], zoals dit luidde op 31 december 2000, is
      [artikel 50, tweede lid, van die wet][ref2] van toepassing indien, ware laatstgenoemd artikellid reeds van
      toepassing voor 1 januari 2001, de termijn voor het instellen van bezwaar nog niet is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel50
