        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007414
        artikel: '2'
  - number: IV
    text: |-
      Op verzoekschriften, die voor het tijdstip van inwerkingtreding van deze wet op grond van
      [artikel 3 van de Wet klachtrecht cliënten zorgsector][ref1] bij de kantonrechter zijn ingediend, blijft dat
      artikel van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007414#Artikel3
    url: https://wetten.overheid.nl/BWBR0018178/2005-06-17#ArtikelIV
    references:
