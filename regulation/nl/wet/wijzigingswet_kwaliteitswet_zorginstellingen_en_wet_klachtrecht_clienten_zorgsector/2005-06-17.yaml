preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter bevordering van de kwaliteit van de zorg wenselijk is in de
    Kwaliteitswet zorginstellingen de verplichting voor de zorgaanbieder neer te leggen tot het melden van calamiteiten
    en seksueel misbruik, in de Wet klachtrecht cliënten zorgsector regels te stellen omtrent het toezicht op de
    naleving van die wet, en in beide wetten verdere eisen te stellen aan de verslaglegging;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0018178/2005-06-17#ArtikelAanhef
articles:
  - number: III
    text: |-
      In afwijking van [artikel 2, zevende lid, van de Wet klachtrecht cliënten zorgsector][ref1] kan in het
      openbaar verslag over het kalenderjaar, voorafgaande aan het jaar waarin deze wet in werking treedt,
      worden volstaan met het aangeven van het aantal en de aard van de door de klachtencommissie, bedoeld in
      [artikel 2, tweede lid, onder a, van de Wet klachtrecht cliënten zorgsector][ref2] behandelde klachten.


      [ref1]: https://wetten.overheid.nl/BWBR0007414#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007414#Artikel2
    url: https://wetten.overheid.nl/BWBR0018178/2005-06-17#ArtikelIII
    references:
      - id: ref1
