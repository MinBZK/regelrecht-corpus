regulatory_layer: WET
publication_date: '2024-12-02'
valid_from: '2025-01-01'
bwb_id: BWBR0050495
url: https://wetten.overheid.nl/BWBR0050495/2025-01-01
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is om de Meststoffenwet aan te passen ter regeling van
    de productieplafonds voor dierlijke meststoffen gelet op het Uitvoeringsbesluit (EU) 2022/2069 van de Commissie van
    30 september 2022 tot verlening van een door Nederland gevraagde derogatie op grond van Richtlijn 91/676/EEG van de
    Raad inzake de bescherming van water tegen verontreiniging door nitraten uit agrarische bronnen (PbEU 2022, L 277)
    en ter voorkoming van het overschrijden van die plafonds;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0050495/2025-01-01#ArtikelAanhef
articles:
  - number: III
    text: 'Deze wet wordt aangehaald als: Wet wijziging Meststoffenwet in verband met de maximale mestproductie.'
    url: https://wetten.overheid.nl/BWBR0050495/2025-01-01#ArtikelIII
  - number: IV
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld, met uitzondering van artikel I, onderdeel A, dat in
      werking treedt met ingang van 1 januari 2025.
    url: https://wetten.overheid.nl/BWBR0050495/2025-01-01#ArtikelIV
