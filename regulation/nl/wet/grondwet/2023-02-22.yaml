  - number: XIX
    text: |-
      Het formulier van afkondiging, vastgesteld bij artikel 81 en de formulieren van verzending en kennisgeving,
      vastgesteld bij de artikelen 123, 124, 127, 128 en 130 van de Grondwet naar de tekst van 1972, blijven van kracht
      totdat daarvoor een regeling is getroffen.

      Artikel **81**

      Het formulier van afkondiging der wetten is het volgende:

      "Wij" enz. "Koning der Nederlanden", enz.

      "Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

      "Alzo Wij in overweging genomen hebben, dat" enz.

      (De beweegredenen der wet).

      "Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
      verstaan, gelijk Wij goedvinden en verstaan bij deze" enz.

      (De inhoud der wet).

      "Gegeven". enz.

      Ingeval een Koningin regeert of het Koninklijk gezag door een Regent of door de Raad van State wordt waargenomen,
      wordt de daardoor nodige wijziging in dit formulier gebracht.

      Artikel **130**

      De Koning doet de Staten-Generaal zo spoedig mogelijk kennis dragen, of hij een voorstel van wet, door hen
      aangenomen, al dan niet goedkeurt. Die kennisgeving geschiedt met een der volgende formulieren:

      "De Koning bewilligt in het voorstel."

      of:

      "De Koning houdt het voorstel in overweging."
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#ArtikelXIX
