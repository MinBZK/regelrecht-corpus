  - number: '24'
    text: Het koningschap wordt erfelijk vervuld door de wettige opvolgers van Koning Willem I, Prins van Oranje-Nassau.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel24
  - number: '25'
    text: |-
      Het koningschap gaat bij overlijden van de Koning krachtens erfopvolging over op zijn wettige nakomelingen, waarbij
      het oudste kind voorrang heeft, met plaatsvervulling volgens dezelfde regel. Bij gebreke van eigen nakomelingen
      gaat het koningschap op gelijke wijze over op de wettige nakomelingen eerst van zijn ouder, dan van zijn
      grootouder, in de lijn van erfopvolging, voor zover de overleden Koning niet verder bestaand dan in de derde graad
      van bloedverwantschap.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel25
  - number: '26'
    text: |-
      Het kind, waarvan een vrouw zwanger is op het ogenblik van het overlijden van de Koning, wordt voor de erfopvolging
      als reeds geboren aangemerkt. Komt het dood ter wereld, dan wordt het geacht nooit te hebben bestaan.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel26
  - number: '27'
    text: |-
      Afstand van het koningschap leidt tot erfopvolging overeenkomstig de regels in de voorgaande artikelen gesteld. Na
      de afstand geboren kinderen en hun nakomelingen zijn van de erfopvolging uitgesloten.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel27
  - number: '28'
    text: |-
      1 De Koning, een huwelijk aangaande buiten bij de wet verleende toestemming, doet daardoor afstand van het
      koningschap.

      2 Gaat iemand die het koningschap van de Koning kan beërven een zodanig huwelijk aan, dan is hij met de uit dit
      huwelijk geboren kinderen en hun nakomelingen van de erfopvolging uitgesloten.

      3 De Staten-Generaal beraadslagen en besluiten ter zake van een voorstel van wet, strekkende tot het verlenen van
      toestemming, in verenigde vergadering.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel28
  - number: '29'
    text: |-
      1 Wanneer uitzonderlijke omstandigheden daartoe nopen, kunnen bij een wet een of meer personen van de erfopvolging
      worden uitgesloten.

      2 Het voorstel daartoe wordt door of vanwege de Koning ingediend. De Staten-Generaal beraadslagen en besluiten ter
      zake in verenigde vergadering. Zij kunnen het voorstel alleen aannemen met ten minste twee derden van het aantal
      uitgebrachte stemmen.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel29
  - number: '30'
    text: |-
      1 Wanneer vooruitzicht bestaat dat een opvolger zal ontbreken, kan deze worden benoemd bij een wet. Het voorstel
      wordt door of vanwege de Koning ingediend. Na de indiening van het voorstel worden de kamers ontbonden. De nieuwe
      kamers beraadslagen en besluiten ter zake in verenigde vergadering. Zij kunnen het voorstel alleen aannemen met ten
      minste twee derden van het aantal uitgebrachte stemmen.

      2 Indien bij overlijden van de Koning of bij afstand van het koningschap een opvolger ontbreekt, worden de kamers
      ontbonden. De nieuwe kamers komen binnen vier maanden na het overlijden of de afstand in verenigde vergadering
      bijeen ten einde te besluiten omtrent de benoeming van een Koning. Zij kunnen een opvolger alleen benoemen met ten
      minste twee derden van het aantal uitgebrachte stemmen.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel30
  - number: '31'
    text: |-
      1 Een benoemde Koning kan krachtens erfopvolging alleen worden opgevolgd door zijn wettige nakomelingen.

      2 De bepalingen omtrent de erfopvolging en het eerste lid van dit artikel zijn van overeenkomstige toepassing op
      een benoemde opvolger, zolang deze nog geen Koning is.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel31
  - number: '32'
    text: |-
      Nadat de Koning de uitoefening van het koninklijk gezag heeft aangevangen, wordt hij zodra mogelijk beëdigd en
      ingehuldigd in de hoofdstad Amsterdam in een openbare verenigde vergadering van de Staten-Generaal. Hij zweert of
      belooft trouw aan de Grondwet en een getrouwe vervulling van zijn ambt. De wet stelt nadere regels vast.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel32
  - number: '33'
    text: De Koning oefent het koninklijk gezag eerst uit, nadat hij de leeftijd van achttien jaar heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel33
  - number: '34'
    text: |-
      De wet regelt het ouderlijk gezag en de voogdij over de minderjarige Koning en het toezicht daarop. De Staten-
      Generaal beraadslagen en besluiten ter zake in verenigde vergadering.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel34
  - number: '35'
    text: |-
      1 Wanneer de ministerraad van oordeel is dat de Koning buiten staat is het koninklijk gezag uit te oefenen, bericht
      hij dit onder overlegging van het daartoe gevraagde advies van de Raad van State aan de Staten-Generaal, die daarop
      in verenigde vergadering bijeenkomen.

      2 Delen de Staten-Generaal dit oordeel, dan verklaren zij dat de Koning buiten staat is het koninklijk gezag uit
      te oefenen. Deze verklaring wordt bekend gemaakt op last van de voorzitter der vergadering en treedt terstond in
      werking.

      3 Zodra de Koning weer in staat is het koninklijk gezag uit te oefenen, wordt dit bij de wet verklaard. De Staten-
      Generaal beraadslagen en besluiten ter zake in verenigde vergadering. Terstond na de bekendmaking van deze wet
      hervat de Koning de uitoefening van het koninklijk gezag.

      4 De wet regelt zo nodig het toezicht over de persoon van de Koning indien hij buiten staat is verklaard het
      koninklijk gezag uit te oefenen. De Staten-Generaal beraadslagen en besluiten ter zake in verenigde vergadering.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel35
  - number: '36'
    text: |-
      De Koning kan de uitoefening van het koninklijk gezag tijdelijk neerleggen en die uitoefening hervatten krachtens
      een wet, waarvan het voorstel door of vanwege hem wordt ingediend. De Staten-Generaal beraadslagen en besluiten ter
      zake in verenigde vergadering.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel36
  - number: '37'
    text: |-
      1 Het koninklijk gezag wordt uitgeoefend door een regent:

      a. zolang de Koning de leeftijd van achttien jaar niet heeft bereikt;

      b. indien een nog niet geboren kind tot het koningschap geroepen kan zijn;

      c. indien de Koning buiten staat is verklaard het koninklijk gezag uit te oefenen;

      d. indien de Koning de uitoefening van het koninklijk gezag tijdelijk heeft neergelegd;

      e. zolang na het overlijden van de Koning of na diens afstand van het koningschap een opvolger ontbreekt.

      2 De regent wordt benoemd bij de wet. De Staten-Generaal beraadslagen en besluiten ter zake in verenigde
      vergadering.

      3 In de gevallen, genoemd in het eerste lid onder c en d, is de nakomeling van de Koning die zijn vermoedelijke
      opvolger is, van rechtswege regent indien hij de leeftijd van achttien jaar heeft bereikt.

      4 De regent zweert of belooft trouw aan de Grondwet en een getrouwe vervulling van zijn ambt, in een verenigde
      vergadering van de Staten-Generaal. De wet geeft nadere regels omtrent het regentschap en kan voorzien in de
      opvolging en de vervanging daarin. De Staten-Generaal beraadslagen en besluiten ter zake in verenigde vergadering.

      5 Op de regent zijn de [artikelen 35][ref1] en [36][ref2] van overeenkomstige toepassing.


