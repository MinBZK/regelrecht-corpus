  - number: '104'
    text: |-
      Belastingen van het Rijk worden geheven uit kracht van een wet. Andere heffingen van het Rijk worden bij de wet
      geregeld.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel104
  - number: '105'
    text: |-
      1 De begroting van de ontvangsten en de uitgaven van het Rijk wordt bij de wet vastgesteld.

      2 Jaarlijks worden voorstellen van algemene begrotingswetten door of vanwege de Koning ingediend op het in
      [artikel 65][ref1] bedoelde tijdstip.

      3 De verantwoording van de ontvangsten en de uitgaven van het Rijk wordt aan de Staten-Generaal gedaan
      overeenkomstig de bepalingen van de wet. De door de Algemene Rekenkamer goedgekeurde rekening wordt aan de Staten-
      Generaal overgelegd.

      4 De wet stelt regels omtrent het beheer van de financiën van het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel65
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '65'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '106'
    text: De wet regelt het geldstelsel.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel106
  - number: '107'
    text: |-
      1 De wet regelt het burgerlijk recht, het strafrecht en het burgerlijk en strafprocesrecht in algemene wetboeken,
      behoudens de bevoegdheid tot regeling van bepaalde onderwerpen in afzonderlijke wetten.

      2 De wet stelt algemene regels van bestuursrecht vast.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel107
  - number: '109'
    text: |-
      De wet regelt de rechtspositie van de ambtenaren. Zij stelt tevens regels omtrent hun bescherming bij de arbeid en
      omtrent medezeggenschap.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel109
  - number: '110'
    text: De overheid betracht bij de uitvoering van haar taak openbaarheid volgens regels bij de wet te stellen.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel110
  - number: '111'
    text: Ridderorden worden bij de wet ingesteld.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel111
  - number: '112'
    text: |-
      1 Aan de rechterlijke macht is opgedragen de berechting van geschillen over burgerlijke rechten en over
      schuldvorderingen.

      2 De wet kan de berechting van geschillen die niet uit burgerlijke rechtsbetrekkingen zijn ontstaan, opdragen
      hetzij aan de rechterlijke macht, hetzij aan gerechten die niet tot de rechterlijke macht behoren. De wet regelt de
      wijze van behandeling en de gevolgen van de beslissingen.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel112
  - number: '113'
    text: |-
      1 Aan de rechterlijke macht is voorts opgedragen de berechting van strafbare feiten.

      2 Tuchtrechtspraak door de overheid ingesteld wordt bij de wet geregeld.

      3 Een straf van vrijheidsontneming kan uitsluitend door de rechterlijke macht worden opgelegd.

      4 Voor berechting buiten Nederland en voor het oorlogsstrafrecht kan de wet afwijkende regels stellen.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel113
  - number: '114'
    text: De doodstraf kan niet worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel114
  - number: '115'
    text: |-
      Ten aanzien van de in [artikel 112, tweede lid][ref1], bedoelde geschillen kan administratief beroep worden
      opengesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel112
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '112'
        hoofdstuk: '6'
  - number: '116'
    text: |-
      1 De wet wijst de gerechten aan die behoren tot de rechterlijke macht.

      2 De wet regelt de inrichting, samenstelling en bevoegdheid van de rechterlijke macht.

      3 De wet kan bepalen, dat aan rechtspraak door de rechterlijke macht mede wordt deelgenomen door personen die niet
      daartoe behoren.

      4 De wet regelt het toezicht door leden van de rechterlijke macht met rechtspraak belast uit te oefenen op de
      ambtsvervulling door zodanige leden en door de personen bedoeld in het vorige lid.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel116
  - number: '117'
    text: |-
      1 De leden van de rechterlijke macht met rechtspraak belast en de procureur-generaal bij de Hoge Raad worden bij
      koninklijk besluit voor het leven benoemd.

      2 Op eigen verzoek en wegens het bereiken van een bij de wet te bepalen leeftijd worden zij ontslagen.

      3 In de gevallen bij de wet bepaald kunnen zij door een bij de wet aangewezen, tot de rechterlijke macht behorend
      gerecht worden geschorst of ontslagen.

      4 De wet regelt overigens hun rechtspositie.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel117
  - number: '118'
    text: |-
      1 De leden van de Hoge Raad der Nederlanden worden benoemd uit een voordracht van drie personen, opgemaakt door de
      Tweede Kamer der Staten-Generaal.

      2 De Hoge Raad is in de gevallen en binnen de grenzen bij de wet bepaald, belast met de cassatie van rechterlijke
      uitspraken wegens schending van het recht.

      3 Bij de wet kunnen aan de Hoge Raad ook andere taken worden opgedragen.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel118
  - number: '119'
    text: |-
      De leden van de Staten-Generaal, de ministers en de staatssecretarissen staan wegens ambtsmisdrijven in die
      betrekkingen gepleegd, ook na hun aftreden terecht voor de Hoge Raad. De opdracht tot vervolging wordt gegeven bij
      koninklijk besluit of bij een besluit van de Tweede Kamer.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel119
  - number: '120'
    text: De rechter treedt niet in de beoordeling van de grondwettigheid van wetten en verdragen.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel120
  - number: '121'
    text: |-
      Met uitzondering van de gevallen bij de wet bepaald vinden de terechtzittingen in het openbaar plaats en houden de
      vonnissen de gronden in waarop zij rusten. De uitspraak geschiedt in het openbaar.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel121
  - number: '122'
    text: |-
      1 Gratie wordt verleend bij koninklijk besluit na advies van een bij de wet aangewezen gerecht en met inachtneming
      van bij of krachtens de wet te stellen voorschriften.

      2 Amnestie wordt bij of krachtens de wet verleend.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel122
  - number: '123'
    text: |-
      1 Bij de wet kunnen provincies en gemeenten worden opgeheven en nieuwe ingesteld.

      2 De wet regelt de wijziging van provinciale en gemeentelijke grenzen.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel123
  - number: '124'
    text: |-
      1 Voor provincies en gemeenten wordt de bevoegdheid tot regeling en bestuur inzake hun huishouding aan hun besturen
      overgelaten.

      2 Regeling en bestuur kunnen van de besturen van provincies en gemeenten worden gevorderd bij of krachtens de wet.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel124
  - number: '125'
    text: |-
      1 Aan het hoofd van de provincie en de gemeente staan provinciale staten onderscheidenlijk de gemeenteraad. Hun
      vergaderingen zijn openbaar, behoudens bij de wet te regelen uitzonderingen.

      2 Van het bestuur van de provincie maken ook deel uit gedeputeerde staten en de commissaris van de Koning, van het
      bestuur van de gemeente het college van burgemeester en wethouders en de burgemeester.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel125
  - number: '126'
    text: |-
      Bij de wet kan worden bepaald, dat de commissaris van de Koning wordt belast met de uitvoering van een door de
      regering te geven ambtsinstructie.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel126
  - number: '127'
    text: |-
      Provinciale staten en de gemeenteraad stellen, behoudens bij de wet of door hen krachtens de wet te bepalen
      uitzonderingen, de provinciale onderscheidenlijk de gemeentelijke verordeningen vast.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel127
  - number: '128'
    text: |-
      Behoudens in de gevallen bedoeld in [artikel 123][ref1], kan de toekenning van bevoegdheden, als bedoeld
      in [artikel 124, eerste lid][ref2], aan andere organen dan die, genoemd in [artikel 125][ref3], alleen door
      provinciale staten onderscheidenlijk de gemeenteraad geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel123
      [ref2]: https://wetten.overheid.nl/BWBR0001840#Artikel124
      [ref3]: https://wetten.overheid.nl/BWBR0001840#Artikel125
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '123'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0001840
        artikel: '124'
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0001840
        artikel: '125'
        hoofdstuk: '7'
  - number: '129'
    text: |-
      1 De leden van provinciale staten en van de gemeenteraad worden rechtstreeks gekozen door de Nederlanders, tevens
      ingezetenen van de provincie onderscheidenlijk de gemeente, die voldoen aan de vereisten die gelden voor de
      verkiezing van de Tweede Kamer der Staten-Generaal. Voor het lidmaatschap gelden dezelfde vereisten.

      2 De leden worden gekozen op de grondslag van evenredige vertegenwoordiging binnen door de wet te stellen grenzen.

      3 De [artikelen 53, tweede lid][ref1], en [59][ref2] zijn van toepassing. [Artikel 57a][ref3] is van
      overeenkomstige toepassing.

      4 De zittingsduur van provinciale staten en de gemeenteraad is vier jaren, behoudens bij de wet te bepalen
      uitzonderingen.

      5 De wet bepaalt welke betrekkingen niet gelijktijdig met het lidmaatschap kunnen worden uitgeoefend. De wet kan
      bepalen, dat beletselen voor het lidmaatschap voortvloeien uit verwantschap of huwelijk en dat het verrichten van
      bij de wet aangewezen handelingen tot het verlies van het lidmaatschap kan leiden.

      6 De leden stemmen zonder last.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0001840#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0001840#Artikel57a
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '53'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0001840
        artikel: '59'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0001840
        artikel: 57a
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '130'
    text: |-
      De wet kan het recht de leden van de gemeenteraad te kiezen en het recht lid van de gemeenteraad te zijn toekennen
      aan ingezetenen, die geen Nederlander zijn, mits zij tenminste voldoen aan de vereisten die gelden voor ingezetenen
      die tevens Nederlander zijn.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel130
  - number: '131'
    text: |-
      De commissaris van de Koning en de burgemeester worden aangesteld, geschorst en ontslagen op een bij de wet te
      bepalen wijze. Krachtens de wet kunnen nadere regels worden gesteld over de daarbij te volgen procedures.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel131
  - number: '132'
    text: |-
      1 De wet regelt de inrichting van provincies en gemeenten, alsmede de samenstelling en bevoegdheid van hun
      besturen.

      2 De wet regelt het toezicht op deze besturen.

      3 Besluiten van deze besturen kunnen slechts aan voorafgaand toezicht worden onderworpen in bij of krachtens de wet
      te bepalen gevallen.

      4 Vernietiging van besluiten van deze besturen kan alleen geschieden bij koninklijk besluit wegens strijd met het
      recht of het algemeen belang.

      5 De wet regelt de voorzieningen bij in gebreke blijven ten aanzien van regeling en bestuur, gevorderd krachtens
      [artikel 124, tweede lid][ref1]. Bij de wet kunnen met afwijking van de [artikelen 125][ref2] en [127][ref3]
      voorzieningen worden getroffen voor het geval het bestuur van een provincie of een gemeente zijn taken grovelijk
      verwaarloost.

      6 De wet bepaalt welke belastingen door de besturen van provincies en gemeenten kunnen worden geheven en regelt hun
      financiële verhouding tot het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel124
      [ref2]: https://wetten.overheid.nl/BWBR0001840#Artikel125
      [ref3]: https://wetten.overheid.nl/BWBR0001840#Artikel127
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '124'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0001840
        artikel: '125'
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0001840
        artikel: '127'
        hoofdstuk: '7'
  - number: 132a
    text: |-
      1 Bij de wet kunnen in het Caribische deel van Nederland andere territoriale openbare lichamen dan provincies en
      gemeenten worden ingesteld en opgeheven.

      2 De [artikelen 124][ref1], [125][ref2] en [127 tot en met 132][ref3] zijn ten aanzien van deze openbare lichamen
      van overeenkomstige toepassing.

      3 In deze openbare lichamen worden verkiezingen gehouden voor een kiescollege voor de Eerste Kamer.
      [Artikel 129][ref4] is van overeenkomstige toepassing.

      4 Voor deze openbare lichamen kunnen regels worden gesteld en andere specifieke maatregelen worden getroffen met
      het oog op bijzondere omstandigheden waardoor deze openbare lichamen zich wezenlijk onderscheiden van het Europese
      deel van Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel124
      [ref2]: https://wetten.overheid.nl/BWBR0001840#Artikel125
      [ref3]: https://wetten.overheid.nl/BWBR0001840#Artikel127
      [ref4]: https://wetten.overheid.nl/BWBR0001840#Artikel129
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel132a
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '124'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0001840
        artikel: '125'
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0001840
        artikel: '127'
        hoofdstuk: '7'
      - id: ref4
        bwb_id: BWBR0001840
        artikel: '129'
        hoofdstuk: '7'
  - number: '133'
    text: |-
      1 De opheffing en instelling van waterschappen, de regeling van hun taken en inrichting, alsmede de samenstelling
      van hun besturen, geschieden volgens bij de wet te stellen regels bij provinciale verordening, voor zover bij of
      krachtens de wet niet anders is bepaald.

      2 De wet regelt de verordenende en andere bevoegdheden van de besturen van de waterschappen, alsmede de
      openbaarheid van hun vergaderingen.

      3 De wet regelt het provinciale en overige toezicht op deze besturen. Vernietiging van besluiten van deze besturen
      kan alleen geschieden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel133
  - number: '134'
    text: |-
      1 Bij of krachtens de wet kunnen openbare lichamen voor beroep en bedrijf en andere openbare lichamen worden
      ingesteld en opgeheven.

      2 De wet regelt de taken en de inrichting van deze openbare lichamen, de samenstelling en bevoegdheid van hun
      besturen, alsmede de openbaarheid van hun vergaderingen. Bij of krachtens de wet kan aan hun besturen verordenende
      bevoegdheid worden verleend.

      3 De wet regelt het toezicht op deze besturen. Vernietiging van besluiten van deze besturen kan alleen geschieden
      wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel134
  - number: '135'
    text: |-
      De wet geeft regels ter voorziening in zaken waarbij twee of meer openbare lichamen zijn betrokken.
      Daarbij kan in de instelling van een nieuw openbaar lichaam worden voorzien, in welk geval
      [artikel 134, tweede en derde lid][ref1], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel134
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '134'
        hoofdstuk: '7'
  - number: '136'
    text: |-
      De geschillen tussen openbare lichamen worden bij koninklijk besluit beslist, tenzij deze behoren tot de
      kennisneming van de rechterlijke macht of hun beslissing bij de wet aan anderen is opgedragen.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel136
  - number: '137'
    text: |-
      1 De wet verklaart, dat een verandering in de Grondwet, zoals zij die voorstelt, in overweging zal worden genomen.

      2 De Tweede Kamer kan, al dan niet op een daartoe door of vanwege de Koning ingediend voorstel, een voorstel voor
      zodanige wet splitsen.

      3 De Tweede Kamer die wordt gekozen na de bekendmaking van de wet, bedoeld in het eerste lid, overweegt in tweede
      lezing het voorstel tot verandering, bedoeld in het eerste lid. Indien deze Tweede Kamer geen besluit neemt over
      het voorstel, vervalt dit van rechtswege. Zodra zij het voorstel heeft aangenomen, overweegt de Eerste Kamer dit in
      tweede lezing. De beide kamers kunnen het voorstel tot verandering alleen aannemen met ten minste twee derden van
      het aantal uitgebrachte stemmen.

      4 De Tweede Kamer kan, al dan niet op een daartoe door of vanwege de Koning ingediend voorstel, met ten minste twee
      derden van het aantal uitgebrachte stemmen een voorstel tot verandering splitsen.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel137
  - number: '138'
    text: |-
      1 Voordat de in tweede lezing aangenomen voorstellen tot verandering in de Grondwet door de Koning worden
      bekrachtigd, kunnen bij de wet:

      a. de aangenomen voorstellen en de ongewijzigd gebleven bepalingen van de Grondwet voor zoveel nodig aan elkaar
      worden aangepast;

      b. de indeling in en de plaats van hoofdstukken, paragrafen en artikelen, alsmede de opschriften worden gewijzigd.

      2 Een voorstel van wet, houdende voorzieningen als bedoeld in het eerste lid onder a, kunnen de kamers alleen
      aannemen met ten minste twee derden van het aantal uitgebrachte stemmen.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel138
  - number: '139'
    text: |-
      De veranderingen in de Grondwet, door de Staten-Generaal aangenomen en door de Koning bekrachtigd, treden terstond
      in werking, nadat zij zijn bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel139
  - number: '140'
    text: |-
      Bestaande wetten en andere regelingen en besluiten die in strijd zijn met een verandering in de Grondwet, blijven
      gehandhaafd, totdat daarvoor overeenkomstig de Grondwet een voorziening is getroffen.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel140
  - number: '141'
    text: |-
      De tekst van de herziene Grondwet wordt bij koninklijk besluit bekendgemaakt, waarbij hoofdstukken, paragrafen en
      artikelen kunnen worden vernummerd en verwijzingen dienovereenkomstig kunnen worden veranderd.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel141
  - number: '142'
    text: |-
      De Grondwet kan bij de wet met het [Statuut voor het Koninkrijk der Nederlanden][ref1] in overeenstemming worden
      gebracht. De [artikelen 139][ref2], [140][ref3] en [141][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002154
      [ref2]: https://wetten.overheid.nl/BWBR0001840#Artikel139
      [ref3]: https://wetten.overheid.nl/BWBR0001840#Artikel140
      [ref4]: https://wetten.overheid.nl/BWBR0001840#Artikel141
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel142
