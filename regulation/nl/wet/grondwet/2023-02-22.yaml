  - number: '38'
    text: Zolang niet in de uitoefening van het koninklijk gezag is voorzien, wordt dit uitgeoefend door de Raad van State.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel38
  - number: '39'
    text: De wet regelt, wie lid is van het koninklijk huis.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel39
  - number: '40'
    text: |-
      1 De Koning ontvangt jaarlijks ten laste van het Rijk uitkeringen naar regels bij de wet te stellen. Deze wet
      bepaalt aan welke andere leden van het koninklijk huis uitkeringen ten laste van het Rijk worden toegekend en
      regelt deze uitkeringen.

      2 De door hen ontvangen uitkeringen ten laste van het Rijk, alsmede de vermogensbestanddelen welke dienstbaar zijn
      aan de uitoefening van hun functie, zijn vrij van persoonlijke belastingen. Voorts is hetgeen de Koning of zijn
      vermoedelijke opvolger krachtens erfrecht of door schenking verkrijgt van een lid van het koninklijk huis vrij van
      de rechten van successie, overgang en schenking. Verdere vrijdom van belasting kan bij de wet worden verleend.

      3 De kamers der Staten-Generaal kunnen voorstellen van in de vorige leden bedoelde wetten alleen aannemen met ten
      minste twee derden van het aantal uitgebrachte stemmen.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel40
  - number: '41'
    text: De Koning richt, met inachtneming van het openbaar belang, zijn Huis in.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel41
  - number: '42'
    text: |-
      1 De regering wordt gevormd door de Koning en de ministers.

      2 De Koning is onschendbaar; de ministers zijn verantwoordelijk.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel42
  - number: '43'
    text: De minister-president en de overige ministers worden bij koninklijk besluit benoemd en ontslagen.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel43
  - number: '44'
    text: |-
      1 Bij koninklijk besluit worden ministeries ingesteld. Zij staan onder leiding van een minister.

      2 Ook kunnen ministers worden benoemd die niet belast zijn met de leiding van een ministerie.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel44
  - number: '45'
    text: |-
      1 De ministers vormen te zamen de ministerraad.

      2 De minister-president is voorzitter van de ministerraad.

      3 De ministerraad beraadslaagt en besluit over het algemeen regeringsbeleid en bevordert de eenheid van dat beleid.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel45
  - number: '46'
    text: |-
      1 Bij koninklijk besluit kunnen staatssecretarissen worden benoemd en ontslagen.

      2 Een staatssecretaris treedt in de gevallen waarin de minister het nodig acht en met inachtneming van diens
      aanwijzingen, in zijn plaats als minister op. De staatssecretaris is uit dien hoofde verantwoordelijk, onverminderd
      de verantwoordelijkheid van de minister.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel46
  - number: '47'
    text: |-
      Alle wetten en koninklijke besluiten worden door de Koning en door een of meer ministers of staatssecretarissen
      ondertekend.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel47
  - number: '48'
    text: |-
      Het koninklijk besluit waarbij de minister-president wordt benoemd, wordt mede door hem ondertekend. De koninklijke
      besluiten waarbij de overige ministers en de staatssecretarissen worden benoemd of ontslagen, worden mede door de
      minister-president ondertekend.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel48
  - number: '49'
    text: |-
      Op de wijze bij de wet voorgeschreven leggen de ministers en de staatssecretarissen bij de aanvaarding van hun ambt
      ten overstaan van de Koning een eed, dan wel verklaring en belofte, van zuivering af en zweren of beloven zij trouw
      aan de Grondwet en een getrouwe vervulling van hun ambt.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel49
  - number: '50'
    text: De Staten-Generaal vertegenwoordigen het gehele Nederlandse volk.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel50
  - number: '51'
    text: |-
      1 De Staten-Generaal bestaan uit de Tweede Kamer en de Eerste Kamer.

      2 De Tweede Kamer bestaat uit honderdvijftig leden.

      3 De Eerste Kamer bestaat uit vijfenzeventig leden.

      4 Bij een verenigde vergadering worden de kamers als één beschouwd.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel51
  - number: '52'
    text: |-
      1 De zittingsduur van beide kamers is vier jaren.

      2 Indien voor de provinciale staten bij de wet een andere zittingsduur dan vier jaren wordt vastgesteld, wordt
      daarbij de zittingsduur van de Eerste Kamer in overeenkomstige zin gewijzigd.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel52
  - number: '53'
    text: |-
      1 De leden van beide kamers worden gekozen op de grondslag van evenredige vertegenwoordiging binnen door de wet te
      stellen grenzen.

      2 De verkiezingen worden gehouden bij geheime stemming.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel53
  - number: '54'
    text: |-
      1 De leden van de Tweede Kamer worden rechtstreeks gekozen door de Nederlanders die de leeftijd van achttien jaar
      hebben bereikt, behoudens bij de wet te bepalen uitzonderingen ten aanzien van Nederlanders die geen ingezetenen
      zijn.

      2 Van het kiesrecht is uitgesloten hij die wegens het begaan van een daartoe bij de wet aangewezen delict bij
      onherroepelijke rechterlijke uitspraak is veroordeeld tot een vrijheidsstraf van ten minste een jaar en hierbij
      tevens is ontzet van het kiesrecht.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel54
  - number: '55'
    text: |-
      1 De leden van de Eerste Kamer worden gekozen door de leden van provinciale staten en de leden van de kiescolleges,
      bedoeld in het tweede lid en [artikel 132a, derde lid][ref1]. De verkiezing wordt, behoudens in geval van
      ontbinding der kamer, gehouden binnen drie maanden na de verkiezing van de leden van provinciale staten.

      2 Ten behoeve van Nederlanders die geen ingezetenen zijn en die voldoen aan de vereisten die gelden voor de
      verkiezing van de Tweede Kamer der Staten-Generaal, worden verkiezingen gehouden voor een kiescollege voor
      de Eerste Kamer. De leden van dit kiescollege worden rechtstreeks gekozen door deze Nederlanders. Voor het
      lidmaatschap gelden dezelfde vereisten. [Artikel 129, tweede tot en met zesde lid][ref2], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel132a
      [ref2]: https://wetten.overheid.nl/BWBR0001840#Artikel129
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: 132a
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0001840
        artikel: '129'
        hoofdstuk: '7'
  - number: '56'
    text: |-
      Om lid van de Staten-Generaal te kunnen zijn is vereist dat men Nederlander is, de leeftijd van achttien jaar heeft
      bereikt en niet is uitgesloten van het kiesrecht.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel56
  - number: '57'
    text: |-
      1 Niemand kan lid van beide kamers zijn.

      2 Een lid van de Staten-Generaal kan niet tevens zijn minister, staatssecretaris, lid van de Raad van State,
      lid van de Algemene Rekenkamer, Nationale ombudsman of substituut-ombudsman, of lid van of procureur-generaal of
      advocaat-generaal bij de Hoge Raad.

      3 Niettemin kan een minister of staatssecretaris, die zijn ambt ter beschikking heeft gesteld, dit ambt verenigen
      met het lidmaatschap van de Staten-Generaal, totdat omtrent die beschikbaarstelling is beslist.

      4 De wet kan ten aanzien van andere openbare betrekkingen bepalen dat zij niet gelijktijdig met het lidmaatschap
      van de Staten-Generaal of van een der kamers kunnen worden uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel57
  - number: 57a
    text: |-
      De wet regelt de tijdelijke vervanging van een lid van de Staten-Generaal wegens zwangerschap en bevalling, alsmede
      wegens ziekte.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel57a
  - number: '58'
    text: |-
      Elke kamer onderzoekt de geloofsbrieven van haar nieuwbenoemde leden en beslist met inachtneming van bij de wet te
      stellen regels de geschillen welke met betrekking tot de geloofsbrieven of de verkiezing zelf rijzen.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel58
  - number: '59'
    text: Alles, wat verder het kiesrecht en de verkiezingen betreft, wordt bij de wet geregeld.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel59
  - number: '60'
    text: |-
      Op de wijze bij de wet voorgeschreven leggen de leden van de kamers bij de aanvaarding van hun ambt in de
      vergadering een eed, dan wel verklaring en belofte, van zuivering af en zweren of beloven zij trouw aan de Grondwet
      en een getrouwe vervulling van hun ambt.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel60
  - number: '61'
    text: |-
      1 Elk der kamers benoemt uit de leden een voorzitter.

      2 Elk der kamers benoemt een griffier. Deze en de overige ambtenaren van de kamers kunnen niet tevens lid van de
      Staten-Generaal zijn.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel61
  - number: '62'
    text: De voorzitter van de Eerste Kamer heeft de leiding van de verenigde vergadering.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel62
  - number: '63'
    text: |-
      Geldelijke voorzieningen ten behoeve van leden en gewezen leden van de Staten-Generaal en van hun nabestaanden
      worden bij de wet geregeld. De kamers kunnen een voorstel van wet ter zake alleen aannemen met ten minste twee
      derden van het aantal uitgebrachte stemmen.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel63
  - number: '64'
    text: |-
      1 Elk der kamers kan bij koninklijk besluit worden ontbonden.

      2 Het besluit tot ontbinding houdt tevens de last in tot een nieuwe verkiezing voor de ontbonden kamer en tot het
      samenkomen van de nieuw gekozen kamer binnen drie maanden.

      3 De ontbinding gaat in op de dag waarop de nieuw gekozen kamer samenkomt.

      4 De wet stelt de zittingsduur van een na ontbinding optredende Tweede Kamer vast; de termijn mag niet langer zijn
      dan vijf jaren. De zittingsduur van een na ontbinding optredende Eerste Kamer eindigt op het tijdstip waarop de
      zittingsduur van de ontbonden kamer zou zijn geëindigd.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel64
  - number: '65'
    text: |-
      Jaarlijks op de derde dinsdag van september of op een bij de wet te bepalen eerder tijdstip wordt door of namens
      de Koning in een verenigde vergadering van de Staten-Generaal een uiteenzetting van het door de regering te voeren
      beleid gegeven.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel65
  - number: '66'
    text: |-
      1 De vergaderingen van de Staten-Generaal zijn openbaar.

      2 De deuren worden gesloten, wanneer een tiende deel van het aantal aanwezige leden het vordert of de voorzitter
      het nodig oordeelt.

      3 Door de kamer, onderscheidenlijk de kamers in verenigde vergadering, wordt vervolgens beslist of met gesloten
      deuren zal worden beraadslaagd en besloten.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel66
  - number: '67'
    text: |-
      1 De kamers mogen elk afzonderlijk en in verenigde vergadering alleen beraadslagen of besluiten, indien meer dan de
      helft van het aantal zitting hebbende leden ter vergadering aanwezig is.

      2 Besluiten worden genomen bij meerderheid van stemmen.

      3 De leden stemmen zonder last.

      4 Over zaken wordt mondeling en bij hoofdelijke oproeping gestemd, wanneer één lid dit verlangt.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel67
  - number: '68'
    text: |-
      De ministers en de staatssecretarissen geven de kamers elk afzonderlijk en in verenigde vergadering mondeling of
      schriftelijk de door een of meer leden verlangde inlichtingen waarvan het verstrekken niet in strijd is met het
      belang van de staat.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel68
  - number: '69'
    text: |-
      1 De ministers en de staatssecretarissen hebben toegang tot de vergaderingen en kunnen aan de beraadslaging
      deelnemen.

      2 Zij kunnen door de kamers elk afzonderlijk en in verenigde vergadering worden uitgenodigd om ter vergadering
      aanwezig te zijn.

      3 Zij kunnen zich in de vergaderingen doen bijstaan door de personen, daartoe door hen aangewezen.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel69
  - number: '70'
    text: |-
      Beide kamers hebben, zowel ieder afzonderlijk als in verenigde vergadering, het recht van onderzoek (enquête), te
      regelen bij de wet.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel70
  - number: '71'
    text: |-
      De leden van de Staten-Generaal, de ministers, de staatssecretarissen en andere personen die deelnemen aan de
      beraadslaging, kunnen niet in rechte worden vervolgd of aangesproken voor hetgeen zij in de vergaderingen van de
      Staten-Generaal of van commissies daaruit hebben gezegd of aan deze schriftelijk hebben overgelegd.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel71
  - number: '72'
    text: De kamers stellen elk afzonderlijk en in verenigde vergadering een reglement van orde vast.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel72
  - number: '73'
    text: |-
      1 De Raad van State of een afdeling van de Raad wordt gehoord over voorstellen van wet en ontwerpen van algemene
      maatregelen van bestuur, alsmede over voorstellen tot goedkeuring van verdragen door de Staten-Generaal. In bij de
      wet te bepalen gevallen kan het horen achterwege blijven.

      2 De Raad of een afdeling van de Raad is belast met het onderzoek van de geschillen van bestuur die bij koninklijk
      besluit worden beslist en draagt de uitspraak voor.

      3 De wet kan aan de Raad of een afdeling van de Raad de uitspraak in geschillen van bestuur opdragen.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel73
  - number: '74'
    text: |-
      1 De Koning is voorzitter van de Raad van State. De vermoedelijke opvolger van de Koning heeft na het bereiken van
      de leeftijd van achttien jaar van rechtswege zitting in de Raad. Bij of krachtens de wet kan aan andere leden van
      het koninklijk huis zitting in de Raad worden verleend.

      2 De leden van de Raad worden bij koninklijk besluit voor het leven benoemd.

      3 Op eigen verzoek en wegens het bereiken van een bij de wet te bepalen leeftijd worden zij ontslagen.

      4 In de gevallen bij de wet aangewezen kunnen zij door de Raad worden geschorst of ontslagen.

      5 De wet regelt overigens hun rechtspositie.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel74
  - number: '75'
    text: |-
      1 De wet regelt de inrichting, samenstelling en bevoegdheid van de Raad van State.

      2 Bij de wet kunnen aan de Raad of een afdeling van de Raad ook andere taken worden opgedragen.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel75
  - number: '76'
    text: De Algemene Rekenkamer is belast met het onderzoek van de ontvangsten en uitgaven van het Rijk.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel76
  - number: '77'
    text: |-
      1 De leden van de Algemene Rekenkamer worden bij koninklijk besluit voor het leven benoemd uit een voordracht van
      drie personen, opgemaakt door de Tweede Kamer der Staten-Generaal.

      2 Op eigen verzoek en wegens het bereiken van een bij de wet te bepalen leeftijd worden zij ontslagen.

      3 In de gevallen bij de wet aangewezen kunnen zij door de Hoge Raad worden geschorst of ontslagen.

      4 De wet regelt overigens hun rechtspositie.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel77
  - number: '78'
    text: |-
      1 De wet regelt de inrichting, samenstelling en bevoegdheid van de Algemene Rekenkamer.

      2 Bij de wet kunnen aan de Algemene Rekenkamer ook andere taken worden opgedragen.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel78
  - number: 78a
    text: |-
      1 De Nationale ombudsman verricht op verzoek of uit eigen beweging onderzoek naar gedragingen van bestuursorganen
      van het Rijk en van andere bij of krachtens de wet aangewezen bestuursorganen.

      2 De Nationale ombudsman en een substituut-ombudsman worden voor een bij de wet te bepalen termijn benoemd door de
      Tweede Kamer der Staten-Generaal. Op eigen verzoek en wegens het bereiken van een bij de wet te bepalen leeftijd
      worden zij ontslagen. In de gevallen bij de wet aangewezen kunnen zij door de Tweede Kamer der Staten-Generaal
      worden geschorst of ontslagen. De wet regelt overigens hun rechtspositie.

      3 De wet regelt de bevoegdheid en werkwijze van de Nationale ombudsman.

      4 Bij of krachtens de wet kunnen aan de Nationale ombudsman ook andere taken worden opgedragen.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel78a
  - number: '79'
    text: |-
      1 Vaste colleges van advies in zaken van wetgeving en bestuur van het Rijk worden ingesteld bij of krachtens de
      wet.

      2 De wet regelt de inrichting, samenstelling en bevoegdheid van deze colleges.

      3 Bij of krachtens de wet kunnen aan deze colleges ook andere dan adviserende taken worden opgedragen.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel79
  - number: '80'
    text: |-
      1 De adviezen van de in dit hoofdstuk bedoelde colleges worden openbaar gemaakt volgens regels bij de wet te
      stellen.

      2 Adviezen, uitgebracht ter zake van voorstellen van wet die door of vanwege de Koning worden ingediend, worden,
      behoudens bij de wet te bepalen uitzonderingen, aan de Staten-Generaal overgelegd.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel80
  - number: '81'
    text: De vaststelling van wetten geschiedt door de regering en de Staten-Generaal gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel81
  - number: '82'
    text: |-
      1 Voorstellen van wet kunnen worden ingediend door of vanwege de Koning en door de Tweede Kamer der Staten-
      Generaal.

      2 Voorstellen van wet waarvoor behandeling door de Staten-Generaal in verenigde vergadering is voorgeschreven,
      kunnen worden ingediend door of vanwege de Koning en, voor zover de betreffende artikelen van [hoofdstuk 2][ref1]
      dit toelaten, door de verenigde vergadering.

      3 Voorstellen van wet, in te dienen door de Tweede Kamer onderscheidenlijk de verenigde vergadering, worden bij
      haar door een of meer leden aanhangig gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0001840
        hoofdstuk: '2'
  - number: '83'
    text: |-
      Voorstellen van wet, ingediend door of vanwege de Koning, worden gezonden aan de Tweede Kamer of, indien daarvoor
      behandeling door de Staten-Generaal in verenigde vergadering is voorgeschreven, aan deze vergadering.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel83
  - number: '84'
    text: |-
      1 Zolang een voorstel van wet, ingediend door of vanwege de Koning, niet door de Tweede Kamer onderscheidenlijk de
      verenigde vergadering is aangenomen, kan het door haar, op voorstel van een of meer leden, en vanwege de regering
      worden gewijzigd.

      2 Zolang de Tweede Kamer onderscheidenlijk de verenigde vergadering een door haar in te dienen voorstel van wet
      niet heeft aangenomen, kan het door haar, op voorstel van een of meer leden, en door het lid of de leden door wie
      het aanhangig is gemaakt, worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel84
  - number: '85'
    text: |-
      Zodra de Tweede Kamer een voorstel van wet heeft aangenomen of tot indiening van een voorstel heeft besloten,
      zendt zij het aan de Eerste Kamer, die het voorstel overweegt zoals het door de Tweede Kamer aan haar is gezonden.
      De Tweede Kamer kan een of meer van haar leden opdragen een door haar ingediend voorstel in de Eerste Kamer te
      verdedigen.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel85
  - number: '86'
    text: |-
      1 Zolang een voorstel van wet niet door de Staten-Generaal is aangenomen, kan het door of vanwege de indiener
      worden ingetrokken.

      2 Zolang de Tweede Kamer onderscheidenlijk de verenigde vergadering een door haar in te dienen voorstel van wet
      niet heeft aangenomen, kan het door het lid of de leden door wie het aanhangig is gemaakt, worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel86
  - number: '87'
    text: |-
      1 Een voorstel wordt wet, zodra het door de Staten-Generaal is aangenomen en door de Koning is bekrachtigd.

      2 De Koning en de Staten-Generaal geven elkaar kennis van hun besluit omtrent enig voorstel van wet.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel87
  - number: '88'
    text: |-
      De wet regelt de bekendmaking en de inwerkingtreding van de wetten. Zij treden niet in werking voordat zij zijn
      bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel88
  - number: '89'
    text: |-
      1 Algemene maatregelen van bestuur worden bij koninklijk besluit vastgesteld.

      2 Voorschriften, door straffen te handhaven, worden daarin alleen gegeven krachtens de wet. De wet bepaalt de op te
      leggen straffen.

      3 De wet regelt de bekendmaking en de inwerkingtreding van de algemene maatregelen van bestuur. Zij treden niet in
      werking voordat zij zijn bekendgemaakt.

      4 Het tweede en derde lid zijn van overeenkomstige toepassing op andere vanwege het Rijk vastgestelde algemeen
      verbindende voorschriften.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel89
  - number: '90'
    text: De regering bevordert de ontwikkeling van de internationale rechtsorde.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel90
  - number: '91'
    text: |-
      1 Het Koninkrijk wordt niet aan verdragen gebonden en deze worden niet opgezegd zonder voorafgaande goedkeuring van
      de Staten-Generaal. De wet bepaalt de gevallen waarin geen goedkeuring is vereist.

      2 De wet bepaalt de wijze waarop de goedkeuring wordt verleend en kan voorzien in stilzwijgende goedkeuring.

      3 Indien een verdrag bepalingen bevat welke afwijken van de Grondwet dan wel tot zodanig afwijken noodzaken, kunnen
      de kamers de goedkeuring alleen verlenen met ten minste twee derden van het aantal uitgebrachte stemmen.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel91
  - number: '92'
    text: |-
      Met inachtneming, zo nodig, van het bepaalde in [artikel 91, derde lid][ref1], kunnen bij of krachtens verdrag aan
      volkenrechtelijke organisaties bevoegdheden tot wetgeving, bestuur en rechtspraak worden opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel91
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '91'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '93'
    text: |-
      Bepalingen van verdragen en van besluiten van volkenrechtelijke organisaties, die naar haar inhoud een ieder kunnen
      verbinden, hebben verbindende kracht nadat zij zijn bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel93
  - number: '94'
    text: |-
      Binnen het Koninkrijk geldende wettelijke voorschriften vinden geen toepassing, indien deze toepassing niet
      verenigbaar is met een ieder verbindende bepalingen van verdragen en van besluiten van volkenrechtelijke
      organisaties.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel94
  - number: '95'
    text: De wet geeft regels omtrent de bekendmaking van verdragen en besluiten van volkenrechtelijke organisaties.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel95
  - number: '96'
    text: |-
      1 Het Koninkrijk wordt niet in oorlog verklaard dan na voorafgaande toestemming van de Staten-Generaal.

      2 De toestemming is niet vereist, wanneer het overleg met de Staten-Generaal ten gevolge van een feitelijk
      bestaande oorlogstoestand niet mogelijk is gebleken.

      3 De Staten-Generaal beraadslagen en besluiten ter zake in verenigde vergadering.

      4 Het bepaalde in het eerste en het derde lid is van overeenkomstige toepassing voor een verklaring dat een oorlog
      beëindigd is.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel96
  - number: '97'
    text: |-
      1 Ten behoeve van de verdediging en ter bescherming van de belangen van het Koninkrijk, alsmede ten behoeve van de
      handhaving en de bevordering van de internationale rechtsorde, is er een krijgsmacht.

      2 De regering heeft het oppergezag over de krijgsmacht.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel97
  - number: '98'
    text: |-
      1 De krijgsmacht bestaat uit vrijwillig dienenden en kan mede bestaan uit dienstplichtigen.

      2 De wet regelt de verplichte militaire dienst en de bevoegdheid tot opschorting van de oproeping in werkelijke
      dienst.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel98
  - number: '99'
    text: De wet regelt vrijstelling van militaire dienst wegens ernstige gewetensbezwaren.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel99
  - number: 99a
    text: Volgens bij de wet te stellen regels kunnen plichten worden opgelegd ten behoeve van de civiele verdediging.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel99a
  - number: '100'
    text: |-
      1 De regering verstrekt de Staten-Generaal vooraf inlichtingen over de inzet of het ter beschikking stellen van
      de krijgsmacht ter handhaving of bevordering van de internationale rechtsorde. Daaronder is begrepen het vooraf
      verstrekken van inlichtingen over de inzet of het ter beschikking stellen van de krijgsmacht voor humanitaire
      hulpverlening in geval van gewapend conflict.

      2 Het eerste lid geldt niet, indien dwingende redenen het vooraf verstrekken van inlichtingen verhinderen. In dat
      geval worden inlichtingen zo spoedig mogelijk verstrekt.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel100
  - number: '103'
    text: |-
      1 De wet bepaalt in welke gevallen ter handhaving van de uit- of inwendige veiligheid bij koninklijk besluit een
      door de wet als zodanig aan te wijzen uitzonderingstoestand kan worden afgekondigd; zij regelt de gevolgen.

      2 Daarbij kan worden afgeweken van de grondwetsbepalingen inzake de bevoegdheden van de besturen van provincies,
      gemeenten, openbare lichamen als bedoeld in [artikel 132a][ref1] en waterschappen, van de grondrechten geregeld
      in de [artikelen 6][ref2], voor zover dit de uitoefening buiten gebouwen en besloten plaatsen van het in dit
      artikel omschreven recht betreft, 7, 8, [9][ref3], [12, tweede en derde lid][ref4], en [13][ref5], alsmede van
      [artikel 113, eerste en derde lid][ref6].

      3 Terstond na de afkondiging van een uitzonderingstoestand en voorts, zolang deze niet bij koninklijk besluit is
      opgeheven, telkens wanneer zij zulks nodig oordelen beslissen de Staten-Generaal omtrent het voortduren daarvan;
      zij beraadslagen en besluiten ter zake in verenigde vergadering.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel132a
      [ref2]: https://wetten.overheid.nl/BWBR0001840#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0001840#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0001840#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0001840#Artikel13
      [ref6]: https://wetten.overheid.nl/BWBR0001840#Artikel113
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel103
