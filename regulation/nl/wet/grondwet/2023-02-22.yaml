  - number: V
    text: |-
      1 [Artikel 137 van de Grondwet][ref1] zoals dat luidde voor de inwerkingtreding van dit artikel, blijft van kracht
      ten aanzien van een voorstel tot verandering in de Grondwet waarvan de wet die verklaart dat zij in overweging zal
      worden genomen, is bekendgemaakt vóór de datum waarop de Tweede Kamer is gekozen die zitting heeft op de datum van
      inwerkingtreding van dit artikel.

      2 Indien een wijziging van [artikel 137 van de Grondwet][ref2] in werking is getreden die ertoe strekt dat de
      Staten-Generaal in verenigde vergadering een voorstel tot verandering in de Grondwet in tweede lezing overwegen,
      komt het derde lid van [artikel 137 van de Grondwet][ref3] te luiden:

      3. Nadat de Tweede Kamer die wordt gekozen na de bekendmaking van de wet, bedoeld in het eerste lid, is
      samengekomen, overwegen de Staten-Generaal in verenigde vergadering in tweede lezing het voorstel tot verandering,
      bedoeld in het eerste lid. Zij kunnen dit alleen aannemen met ten minste twee derden van het aantal uitgebrachte
      stemmen. Indien zij gedurende de zittingsduur van de in de eerste volzin bedoelde Tweede Kamer geen besluit nemen
      over het voorstel, vervalt dit van rechtswege.

      3 Dit additionele artikel vervalt op een bij wet te bepalen tijdstip, nadat de behandeling van voorstellen tot
      verandering in de Grondwet als bedoeld in het eerste en het tweede lid is afgerond.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel137
      [ref2]: https://wetten.overheid.nl/BWBR0001840#Artikel137
      [ref3]: https://wetten.overheid.nl/BWBR0001840#Artikel137
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#ArtikelV
