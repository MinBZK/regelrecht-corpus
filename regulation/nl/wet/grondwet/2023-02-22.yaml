articles:
  - number: '1'
    text: |-
      Allen die zich in Nederland bevinden, worden in gelijke gevallen gelijk behandeld. Discriminatie wegens godsdienst,
      levensovertuiging, politieke gezindheid, ras, geslacht, handicap, seksuele gerichtheid of op welke grond dan ook,
      is niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel1
  - number: '2'
    text: |-
      1 De wet regelt wie Nederlander is.

      2 De wet regelt de toelating en de uitzetting van vreemdelingen.

      3 Uitlevering kan slechts geschieden krachtens verdrag. Verdere voorschriften omtrent uitlevering worden bij de
      wet gegeven.

      4 Ieder heeft het recht het land te verlaten, behoudens in de gevallen, bij de wet bepaald.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel2
  - number: '3'
    text: Alle Nederlanders zijn op gelijke voet in openbare dienst benoembaar.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel3
  - number: '4'
    text: |-
      Iedere Nederlander heeft gelijkelijk recht de leden van algemeen vertegenwoordigende organen te verkiezen alsmede
      tot lid van deze organen te worden verkozen, behoudens bij de wet gestelde beperkingen en uitzonderingen.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel4
  - number: '5'
    text: Ieder heeft het recht verzoeken schriftelijk bij het bevoegd gezag in te dienen.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel5
  - number: '6'
    text: |-
      1 Ieder heeft het recht zijn godsdienst of levensovertuiging, individueel of in gemeenschap met anderen, vrij te
      belijden, behoudens ieders verantwoordelijkheid volgens de wet.

      2 De wet kan ter zake van de uitoefening van dit recht buiten gebouwen en besloten plaatsen regels stellen ter
      bescherming van de gezondheid, in het belang van het verkeer en ter bestrijding of voorkoming van wanordelijkheden.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel6
  - number: '7'
    text: |-
      1 Niemand heeft voorafgaand verlof nodig om door de drukpers gedachten of gevoelens te openbaren, behoudens ieders
      verantwoordelijkheid volgens de wet.

      2 De wet stelt regels omtrent radio en televisie. Er is geen voorafgaand toezicht op de inhoud van een radio- of
      televisieuitzending.

      3 Voor het openbaren van gedachten of gevoelens door andere dan in de voorgaande leden genoemde middelen heeft
      niemand voorafgaand verlof nodig wegens de inhoud daarvan, behoudens ieders verantwoordelijkheid volgens de wet. De
      wet kan het geven van vertoningen toegankelijk voor personen jonger dan zestien jaar regelen ter bescherming van de
      goede zeden.

      4 De voorgaande leden zijn niet van toepassing op het maken van handelsreclame.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel7
  - number: '8'
    text: Het recht tot vereniging wordt erkend. Bij de wet kan dit recht worden beperkt in het belang van de openbare orde.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel8
  - number: '9'
    text: |-
      1 Het recht tot vergadering en betoging wordt erkend, behoudens ieders verantwoordelijkheid volgens de wet.

      2 De wet kan regels stellen ter bescherming van de gezondheid, in het belang van het verkeer en ter bestrijding of
      voorkoming van wanordelijkheden.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel9
  - number: '10'
    text: |-
      1 Ieder heeft, behoudens bij of krachtens de wet te stellen beperkingen, recht op eerbiediging van zijn
      persoonlijke levenssfeer.

      2 De wet stelt regels ter bescherming van de persoonlijke levenssfeer in verband met het vastleggen en verstrekken
      van persoonsgegevens.

      3 De wet stelt regels inzake de aanspraken van personen op kennisneming van over hen vastgelegde gegevens en van
      het gebruik dat daarvan wordt gemaakt, alsmede op verbetering van zodanige gegevens.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel10
  - number: '11'
    text: Ieder heeft, behoudens bij of krachtens de wet te stellen beperkingen, recht op onaantastbaarheid van zijn lichaam.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel11
  - number: '12'
    text: |-
      1 Het binnentreden in een woning zonder toestemming van de bewoner is alleen geoorloofd in de gevallen bij of
      krachtens de wet bepaald, door hen die daartoe bij of krachtens de wet zijn aangewezen.

      2 Voor het binnentreden overeenkomstig het eerste lid zijn voorafgaande legitimatie en mededeling van het doel van
      het binnentreden vereist, behoudens bij de wet gestelde uitzonderingen.

      3 Aan de bewoner wordt zo spoedig mogelijk een schriftelijk verslag van het binnentreden verstrekt. Indien het
      binnentreden in het belang van de nationale veiligheid of dat van de strafvordering heeft plaatsgevonden, kan
      volgens bij de wet te stellen regels de verstrekking van het verslag worden uitgesteld. In de bij de wet te bepalen
      gevallen kan de verstrekking achterwege worden gelaten, indien het belang van de nationale veiligheid zich tegen
      verstrekking blijvend verzet.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel12
  - number: '13'
    text: |-
      1 Ieder heeft recht op eerbiediging van zijn brief- en telecommunicatiegeheim.

      2 Beperking van dit recht is mogelijk in de gevallen bij de wet bepaald met machtiging van de rechter of, in het
      belang van de nationale veiligheid, door of met machtiging van hen die daartoe bij de wet zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel13
  - number: '14'
    text: |-
      1 Onteigening kan alleen geschieden in het algemeen belang en tegen vooraf verzekerde schadeloosstelling, een en
      ander naar bij of krachtens de wet te stellen voorschriften.

      2 De schadeloosstelling behoeft niet vooraf verzekerd te zijn, wanneer in geval van nood onverwijld onteigening
      geboden is.

      3 In de gevallen bij of krachtens de wet bepaald bestaat recht op schadeloosstelling of tegemoetkoming in de
      schade, indien in het algemeen belang eigendom door het bevoegd gezag wordt vernietigd of onbruikbaar gemaakt of de
      uitoefening van het eigendomsrecht wordt beperkt.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel14
  - number: '15'
    text: |-
      1 Buiten de gevallen bij of krachtens de wet bepaald mag niemand zijn vrijheid worden ontnomen.

      2 Hij aan wie anders dan op rechterlijk bevel zijn vrijheid is ontnomen, kan aan de rechter zijn invrijheidstelling
      verzoeken. Hij wordt in dat geval door de rechter gehoord binnen een bij de wet te bepalen termijn. De rechter
      gelast de onmiddellijke invrijheidstelling, indien hij de vrijheidsontneming onrechtmatig oordeelt.

      3 De berechting van hem aan wie met het oog daarop zijn vrijheid is ontnomen, vindt binnen een redelijke termijn
      plaats.

      4 Hij aan wie rechtmatig zijn vrijheid is ontnomen, kan worden beperkt in de uitoefening van grondrechten voor
      zover deze zich niet met de vrijheidsontneming verdraagt.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel15
  - number: '16'
    text: Geen feit is strafbaar dan uit kracht van een daaraan voorafgegane wettelijke strafbepaling.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel16
  - number: '17'
    text: |-
      1 Ieder heeft bij het vaststellen van zijn rechten en verplichtingen of bij het bepalen van de gegrondheid van een
      tegen hem ingestelde vervolging recht op een eerlijk proces binnen een redelijke termijn voor een onafhankelijke en
      onpartijdige rechter.

      2 Niemand kan tegen zijn wil worden afgehouden van de rechter die de wet hem toekent.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel17
  - number: '18'
    text: |-
      1 Ieder kan zich in rechte en in administratief beroep doen bijstaan.

      2 De wet stelt regels omtrent het verlenen van rechtsbijstand aan minder draagkrachtigen.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel18
  - number: '19'
    text: |-
      1 Bevordering van voldoende werkgelegenheid is voorwerp van zorg der overheid.

      2 De wet stelt regels omtrent de rechtspositie van hen die arbeid verrichten en omtrent hun bescherming daarbij,
      alsmede omtrent medezeggenschap.

      3 Het recht van iedere Nederlander op vrije keuze van arbeid wordt erkend, behoudens de beperkingen bij of
      krachtens de wet gesteld.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel19
  - number: '20'
    text: |-
      1 De bestaanszekerheid der bevolking en spreiding van welvaart zijn voorwerp van zorg der overheid.

      2 De wet stelt regels omtrent de aanspraken op sociale zekerheid.

      3 Nederlanders hier te lande, die niet in het bestaan kunnen voorzien, hebben een bij de wet te regelen recht op
      bijstand van overheidswege.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel20
  - number: '21'
    text: |-
      De zorg van de overheid is gericht op de bewoonbaarheid van het land en de bescherming en verbetering van het
      leefmilieu.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel21
  - number: '22'
    text: |-
      1 De overheid treft maatregelen ter bevordering van de volksgezondheid.

      2 Bevordering van voldoende woongelegenheid is voorwerp van zorg der overheid.

      3 Zij schept voorwaarden voor maatschappelijke en culturele ontplooiing en voor vrijetijdsbesteding.
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22#Artikel22
  - number: '23'
    text: |-
      1 Het onderwijs is een voorwerp van de aanhoudende zorg der regering.

      2 Het geven van onderwijs is vrij, behoudens het toezicht van de overheid en, voor wat bij de wet aangewezen vormen
      van onderwijs betreft, het onderzoek naar de bekwaamheid en de zedelijkheid van hen die onderwijs geven, een en
      ander bij de wet te regelen.

      3 Het openbaar onderwijs wordt, met eerbiediging van ieders godsdienst of levensovertuiging, bij de wet geregeld.

      4 In elke gemeente en in elk van de openbare lichamen, bedoeld in [artikel 132a][ref1], wordt van overheidswege
      voldoend openbaar algemeen vormend lager onderwijs gegeven in een genoegzaam aantal openbare scholen. Volgens bij
      de wet te stellen regels kan afwijking van deze bepaling worden toegelaten, mits tot het ontvangen van zodanig
      onderwijs gelegenheid wordt gegeven, al dan niet in een openbare school.

      5 De eisen van deugdelijkheid, aan het geheel of ten dele uit de openbare kas te bekostigen onderwijs te stellen,
      worden bij de wet geregeld, met inachtneming, voor zover het bijzonder onderwijs betreft, van de vrijheid van
      richting.

      6 Deze eisen worden voor het algemeen vormend lager onderwijs zodanig geregeld, dat de deugdelijkheid van het
      geheel uit de openbare kas bekostigd bijzonder onderwijs en van het openbaar onderwijs even afdoende wordt
      gewaarborgd. Bij die regeling wordt met name de vrijheid van het bijzonder onderwijs betreffende de keuze der
      leermiddelen en de aanstelling der onderwijzers geëerbiedigd.

      7 Het bijzonder algemeen vormend lager onderwijs, dat aan de bij de wet te stellen voorwaarden voldoet, wordt
      naar dezelfde maatstaf als het openbaar onderwijs uit de openbare kas bekostigd. De wet stelt de voorwaarden vast,
      waarop voor het bijzonder algemeen vormend middelbaar en voorbereidend hoger onderwijs bijdragen uit de openbare
      kas worden verleend.

      8 De regering doet jaarlijks van de staat van het onderwijs verslag aan de Staten-Generaal.


