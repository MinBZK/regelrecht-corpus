preamble:
  text: |-
    Gezien het advies van de Voorlopige Commissie Nationale Parken van 6 juli 1998;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0011242/2000-03-25#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            minister:

              Minister van Landbouw, Natuurbeheer en Visserij;



            b
            overlegorgaan:

              overlegorgaan als bedoeld in [artikel 3][ref1];



            c
            nationaal park:

              gebied zoals omschreven in het Structuurschema Groene Ruimte (kamerstukken II 1992/93, 22880, nr. 5, blz.
      9).


      [ref1]: https://wetten.overheid.nl/BWBR0011242#Artikel3
    url: https://wetten.overheid.nl/BWBR0011242/2000-03-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011242
        artikel: '3'
  - number: '2'
    text: |-
      Als nationaal park in oprichting wordt aangewezen het natuurgebied De Alde Feanen, zoals aangegeven op de als
      bijlage bij deze regeling behorende kaart.
    url: https://wetten.overheid.nl/BWBR0011242/2000-03-25#Artikel2
  - number: '3'
    text: Er is een overlegorgaan nationaal park in oprichting De Alde Feanen.
    url: https://wetten.overheid.nl/BWBR0011242/2000-03-25#Artikel3
  - number: '4'
    text: |-
      1 Het overlegorgaan heeft tot taak, vooruitlopend op de aanwijzing van het natuurgebied De Alde Feanen, bedoeld
      in [artikel 2][ref1], als nationaal park, de inrichting, het beheer en functioneren van het nationaal park in
      oprichting De Alde Feanen overeenkomstig de doelstellingen van een nationaal park te bevorderen.

      2 Tot die taak behoort onder meer:

      a. het opstellen van een beheers- en inrichtingsplan, dat als basis kan dienen om het natuurgebied De Alde Feanen
      aan te wijzen als nationaal park;

      b. de onderlinge afstemming van alle voor de inrichting en beheer van belang zijnde activiteiten;

      c. het doen van voorstellen aan de minister voor de besteding en toekenning van de voor het nationaal park in
      oprichting De Alde Feanen beschikbare middelen, onder meer in de vorm van een voortschrijdend meerjarenprogramma en
      een jaarlijks in te dienen bestedingenplan;

      d. bevordering en coördinatie van voorlichting en educatie met betrekking tot het nationaal park in oprichting De
      Alde Feanen.


      [ref1]: https://wetten.overheid.nl/BWBR0011242#Artikel2
    url: https://wetten.overheid.nl/BWBR0011242/2000-03-25#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011242
        artikel: '2'
  - number: '5'
    text: |-
      Het overlegorgaan neemt bij de uitvoering van zijn taak als uitgangspunt het advies van de Voorlopige Commissie
      Nationale Parken van 6 juli 1998 als ook de brief van 18 februari 1999 met kenmerk DN. 199910 inhoudende het
      beleidsstandpunt van de Minister van Landbouw, Natuurbeheer en Visserij daaromtrent.
    url: https://wetten.overheid.nl/BWBR0011242/2000-03-25#Artikel5
  - number: '6'
    text: |-
      In het overlegorgaan hebben zitting:

      a. een door de minister te benoemen lid, tevens voorzitter;

      b. door de minister te benoemen leden, als vertegenwoordiger en op voordracht van respectievelijk:

      1. de provincie Fryslân;

      2. de gemeente Smallingerland;

      3. de gemeente Boarnsterhim;

      4. de gemeente Tytsjerksteradiel;

      5. het wetterskip Fryslân;

      6. het wetterskip Lauwerswâlden;

      7. de verenigingen voor Dorpsbelang van Warten, en van Grou en Wergea;

      8. de verenigingen voor Dorpsbelang van Earnewâld, van Oudega en van De Veenhoop;

      9. Provinciale vereniging voor natuurbescherming It Fryske Gea;

      10. de Friese Milieufederatie;

      11. de Noordelijke Land- en Tuinbouworganisatie (NLTO);

      12. de Noord-Nederlandse Watersportbond (NNWB);

      13. de VVV’s rond De Alde Feanen;

      14. het recreatieschap De Marrekrite;

      15. de Vereniging van Friese Rondvaartondernemers;

      16. de HISWA- vereniging en de RECRON;

      17. de Vereniging De Princenhof en Eigenaren Recreatievestigingen Friesland;

      c. een vertegenwoordiger van de Directie LNV Regio Noord van het Ministerie van Landbouw, Natuurbeheer en Visserij.
    url: https://wetten.overheid.nl/BWBR0011242/2000-03-25#Artikel6
  - number: '7'
    text: |-
      1 Het secretariaat van het overlegorgaan berust bij een door de provincie Fryslân te benoemen ambtenaar in dienst
      bij deze provincie.

      2 Het overlegorgaan regelt de openbaarheid en de plaats van zijn vergadering, alsmede de overige aspecten van zijn
      inrichting en werkwijze.

      3 Het overlegorgaan brengt jaarlijks van zijn werkzaamheden en de daarmee samenhangende ontwikkelingen in het
      nationale park De Alde Feanen verslag uit aan de minister.
    url: https://wetten.overheid.nl/BWBR0011242/2000-03-25#Artikel7
  - number: '8'
    text: |-
      Indien in het overlegorgaan belangrijke verschillen van inzicht blijken te bestaan, doet de voorzitter van het
      overlegorgaan daarvan mededeling aan de minister, die daarop de naar zijn oordeel nodige stappen onderneemt.
    url: https://wetten.overheid.nl/BWBR0011242/2000-03-25#Artikel8
  - number: '9'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      geplaatst is en werkt terug tot en met 16 februari 2000.
    url: https://wetten.overheid.nl/BWBR0011242/2000-03-25#Artikel9
  - number: '10'
    text: 'Deze regeling wordt aangehaald als: Regeling aanwijzing nationaal park in oprichting De Alde Feanen.'
    url: https://wetten.overheid.nl/BWBR0011242/2000-03-25#Artikel10
