  - number: '15'
    text: |-
      1 Op overtreding van het bepaalde bij of krachtens deze verordening worden tuchtrechtelijke maatregelen gesteld.

      2 De tuchtrechtelijke maatregelen zijn:

      a. een berisping;

      b. een geldboete van ten hoogste € 4.500;

      c. openbaarmaking van de uitspraak op kosten van de betrokkene;

      d. het onder verscherpte controle stellen van het bedrijf van de betrokkene op zijn kosten voor ten hoogste twee
      jaren.
    url: https://wetten.overheid.nl/BWBR0017209/2010-02-20#Artikel15
  - number: '16'
    text: |-
      1 Het bestuur van het productschap kan ontheffing verlenen van het in deze verordening bepaalde

      2 Het bestuur kan aan een ontheffing als bedoeld in lid 1 voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0017209/2010-02-20#Artikel16
  - number: '17'
    text: |-
      De [Zuivelverordening 2000, Uitbetaling van boerderijmelk naar kwaliteit, samenstelling en gewicht][ref1] en de
      Zuivelverordening 2003, Vaststelling frequentie en beoordeling resultaten kwaliteitsonderzoek worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0010719
    url: https://wetten.overheid.nl/BWBR0017209/2010-02-20#Artikel17
