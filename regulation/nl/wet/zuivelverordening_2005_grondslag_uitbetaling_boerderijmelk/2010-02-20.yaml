preamble:
  text: |-
    Gelet op de artikelen 93, 95, 102 en 104 van de Wet op de bedrijfsorganisatie alsmede op de artikelen 5 en 6 van
    het Instellingsbesluit Productschap Zuivel;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017209/2010-02-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze verordening wordt verstaan onder:

      a. rauwe melk: het product dat wordt afgescheiden door de melkklier van één of meer koeien en dat niet verwarmd is
      tot boven 40°C en dat evenmin een behandeling met een gelijkwaardig effect heeft ondergaan;

      b. boerderijmelk: rauwe melk die door een melkveehouder kennelijk bestemd is voor aflevering anders dan aan
      consumenten;

      c. ontvanger van boerderijmelk: de natuurlijke of rechtspersoon die op jaarbasis 500.000 kg of meer boerderijmelk
      bedrijfsmatig ontvangt van één of meer in Nederland gevestigde melkveehouders en terzake betalingen aan de
      desbetreffende melkveehouders verricht, met uitzondering van boerderijzuivelbereiders;

      d. melkkoeltank: een tank die voldoet aan norm NEN-ISO 5708 en die is voorzien van een installatie waarmee melk tot
      4°C of lager kan worden gekoeld, alsmede van een automatisch werkend roerapparaat;

      e. tankmelk: boerderijmelk die door melkveehouders wordt bewaard in een melkkoeltank;

      f. leverantie van boerderijmelk: de transactie waarbij een melkveehouder boerderijmelk ter beschikking van de
      ontvanger van boerderijmelk stelt en deze de betreffende melk in ontvangst neemt met het kennelijke doel deze te
      bewerken, te verwerken of te verhandelen;

      g. rijdende melkontvangst: een mobiele installatie die wordt gebruikt voor het ophalen van boerderijmelk;

      h. kwaliteitsonderzoek: onderzoek naar de kwaliteit van boerderijmelk ten behoeve van de uitbetaling naar gelang
      van de kwaliteit van deze melk;

      i. samenstellingsonderzoek: onderzoek naar de samenstelling van boerderijmelk ten behoeve van de uitbetaling van
      deze melk;

      j. melkcontrolestation: een laboratorium dat onderzoek uitvoert met betrekking tot de kwaliteit en samenstelling
      van boerderijmelk;

      k. COKZ: de Stichting Centraal Orgaan voor Kwaliteitsaangelegenheden in de Zuivel;

      l. productschap: het Productschap Zuivel;

      m. bestuur: het bestuur van het productschap;

      n. voorzitter: de voorzitter van het productschap;

      o. melkveehouder: de ondernemer die melkkoeien houdt;

      p. wet: de [Wet op de bedrijfsorganisatie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002058
    url: https://wetten.overheid.nl/BWBR0017209/2010-02-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002058
  - number: '2'
    text: |-
      1 Indien de ontvanger van boerderijmelk de aan hem geleverde boerderijmelk betaalt op basis van de hoeveelheid, de
      samenstelling en/of de kwaliteit, dan worden de bij of krachtens deze verordening van toepassing zijnde bepalingen
      in acht genomen.

      2 De ontvanger van boerderijmelk meldt zich ter registratie aan bij het productschap.
    url: https://wetten.overheid.nl/BWBR0017209/2010-02-20#Artikel2
  - number: '3'
    text: De ontvanger van boerderijmelk ontvangt alleen boerderijmelk die in een melkkoeltank is bewaard.
    url: https://wetten.overheid.nl/BWBR0017209/2010-02-20#Artikel3
  - number: '4'
    text: |-
      1 De ontvanger van boerderijmelk zorgt ervoor dat van elke leverantie boerderijmelk een representatief monster
      wordt genomen met inachtneming van het bepaalde bij of krachtens deze verordening.

      2 De ontvanger van boerderijmelk zorgt ervoor dat de chauffeur-monsternemer die wordt belast met de bemonstering
      van boerderijmelk ter zake kundig is.
    url: https://wetten.overheid.nl/BWBR0017209/2010-02-20#Artikel4
  - number: '5'
    text: De melkveehouder verleent alle medewerking aan de bemonstering van de boerderijmelk.
    url: https://wetten.overheid.nl/BWBR0017209/2010-02-20#Artikel5
  - number: '6'
    text: |-
      1 De ontvanger van boerderijmelk neemt ten aanzien van het nemen, transporteren en bewaren van monsters
      boerderijmelk de nader door het bestuur vastgestelde bepalingen in acht.

      2 De ontvanger van boerderijmelk beschikt over een kwaliteitssysteem waarmee hij aantoonbaar het gestelde in lid 1
      realiseert, beheerst en borgt. Dit kwaliteitssysteem is door de ontvanger van boerderijmelk op een overzichtelijke
      wijze beschreven en vastgelegd.

      3 De voorzitter kan, gehoord het COKZ, ontheffing verlenen van het bepaalde in lid 1. Aan deze ontheffing kunnen
      voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0017209/2010-02-20#Artikel6
  - number: '7'
    text: |-
      1 De hoeveelheid geleverde boerderijmelk wordt vastgesteld overeenkomstig nader door het bestuur vastgestelde
      werkwijzen.

      2 De voorzitter kan, gehoord het COKZ, ontheffing verlenen van het bepaalde in lid 1, mits tot zijn genoegen wordt
      aangetoond dat de vaststelling van de hoeveelheid op andere wijze nauwkeurig plaatsvindt. Aan de ontheffing kunnen
      voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0017209/2010-02-20#Artikel7
  - number: '8'
    text: |-
      1 Indien de uitbetaling van boerderijmelk plaatsvindt op basis van één of meer van de hiernavolgende onderdelen:

      a. het vetgehalte;

      b. het eiwitgehalte;

      c. de aanwezigheid van melkvreemde bacteriegroeiremmende stoffen;

      d. het kiemgetal;

      e. de verontreinigingsgraad;

      f. het celgetal;

      g. de aanwezigheid van sporen van boterzuurbacteriën;

      h. de zuurtegraad van het vet;

      i. het vriespunt;

      j. het chloroformgehalte;

      dan worden de desbetreffende nader door het bestuur vastgestelde bepalingen in acht genomen.

      2 Indien de uitbetaling van boerderijmelk plaatsvindt op basis van het vetgehalte of het eiwitgehalte, dan worden
      deze per leverantie bepaald.

      3 De ontvanger van boerderijmelk legt het systeem van uitbetaling zoals bedoeld in deze verordening vast. Dit
      systeem van uitbetaling wordt aan de betrokken melkveehouders bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0017209/2010-02-20#Artikel8
  - number: '9'
    text: |-
      Het kwaliteitsonderzoek wordt verricht met inachtneming van de bepalingen van Verordening (EG) nr. 853/2004 van
      het Europees Parlement en de Raad van 29 april 2004 hudende vaststelling van specifieke hygiënevoorschriften voor
      levensmiddelen van dierlijke oorsprong (PbEG L226) zoals deze is of zal worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0017209/2010-02-20#Artikel9
  - number: '10'
    text: |-
      De hoeveelheid, de samenstelling en de kwaliteit van de ontvangen boerderijmelk worden, voor zover van belang voor
      de uitbetaling, aan de melkveehouder bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0017209/2010-02-20#Artikel10
  - number: '11'
    text: |-
      1 De ontvanger van boerderijmelk voert een administratie of laat deze voeren waaruit per melkveehouder de volgende
      gegevens worden vastgelegd voor zover deze relevant zijn voor de uitbetaling van boerderijmelk:

      a. de hoeveelheid ontvangen boerderijmelk,

      b. de samenstelling en/of de kwaliteit van de ontvangen boerderijmelk.

      2 De in lid 1 bedoelde gegevens worden op overzichtelijke wijze geadministreerd en worden gedurende ten minste één
      jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0017209/2010-02-20#Artikel11
  - number: '12'
    text: |-
      Indien de uitbetaling van boerderijmelk plaatsvindt op grond van samenstelling en/of kwaliteit, dan draagt de
      ontvanger van boerderijmelk er zorg voor dat de betrokken onderzoeken worden verricht door een melkcontrolestation
      dat beschikt over een terzake deskundige leiding, over een voor het te verrichten onderzoek voldoende outillage,
      alsmede over een gedocumenteerd en adequaat functionerend kwaliteitssysteem en dat voor alle in dit kader relevante
      onderzoekmethoden geaccrediteerd is volgens NEN-EN-ISO/IEC 17025. Het bestuur kan nadere eisen stellen aan een
      melkcontrolestation.
    url: https://wetten.overheid.nl/BWBR0017209/2010-02-20#Artikel12
  - number: '13'
    text: |-
      De uitslagen van het onderzoek worden vastgelegd op een toegankelijke en overzichtelijke wijze. De uitslagen worden
      gedurende ten minste een jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0017209/2010-02-20#Artikel13
  - number: '14'
    text: |-
      Het bij of krachtens deze verordening bepaalde is bindend voor de in [artikel 102, lid 1, van de wet][ref1]
      bedoelde natuurlijke en rechtspersonen alsmede voor de in [artikel 102, lid 2 van de wet][ref2] bedoelde
      natuurlijke en rechtspersonen, voor zover deze handelingen verrichten die bedrijfsmatig plegen te worden verricht
      in de ondernemingen, bedoeld in [artikel 102, lid 1, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel102
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel102
      [ref3]: https://wetten.overheid.nl/BWBR0002058#Artikel102
    url: https://wetten.overheid.nl/BWBR0017209/2010-02-20#Artikel14
