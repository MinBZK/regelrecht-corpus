        artikel: '1'
  - number: '2'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel2
  - number: '3'
    text: |-
      Het bij of krachtens deze wet bepaalde is niet van toepassing op oorlogsschepen, schepen in gebruik als
      marinehulpschepen of andere schepen in eigendom van of in beheer bij een staat ten tijde dat zij uitsluitend worden
      gebruikt in dienst van de overheid voor andere dan handelsdoeleinden.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel3
  - number: '4'
    text: |-
      Bij algemene maatregel van bestuur kunnen categorieën van schepen geheel of gedeeltelijk van een of meer bij of
      krachtens deze wet gegeven regels en voorschriften worden uitgezonderd.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel4
  - number: '5.1'
    text: |-
      Een verplichting die ingevolge deze wet rust op de eigenaar van een schip, rust tevens op de rompbevrachter van
      dat schip.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel5
  - number: '5.2'
    text: |-
      De rompbevrachter is de partij bij een overeenkomst tot exploitatie van een schip, de rompbevrachtingsovereenkomst,
      jegens wie de wederpartij, de rompvervrachter, zich verbindt een zeeschip zonder bemanning voor een bepaalde tijd
      ter beschikking te stellen, zonder daarover nog enige zeggenschap te houden.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel5
  - number: '6.1'
    text: |-
      Het is verboden vanaf een buitenlands schip een schadelijke stof in zee of in de binnenwateren te lozen behoudens
      in de gevallen en op de wijze vastgesteld in het Marpol-verdrag en het Milieuprotocol bij het Antarcticaverdrag.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel6
  - number: '6.2'
    text: |-
      Het is verboden vanaf een buitenlands schip opzettelijk stoffen die de ozonlaag aantasten als bedoeld in Bijlage VI
      van het MARPOL-verdrag uit te stoten, behoudens in de gevallen en op de wijze vastgesteld in die Bijlage.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel6
  - number: '6.3'
    text: |-
      Het is verboden aan boord van een buitenlands schip brandstofolie te gebruiken die niet voldoet aan de eisen die
      daaraan in Bijlage VI van het MARPOL-verdrag worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel6
  - number: '6.4'
    text: |-
      Het is verboden om afval en andere stoffen als bedoeld in voorschrift 16 van Bijlage VI van het MARPOL-verdrag aan
      boord van een buitenlands schip te verbranden, behoudens in de gevallen en op de wijze vastgesteld in die Bijlage.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel6
  - number: '6.5'
    text: |-
      Het is verboden met een buitenlands schip ballastwater of sediment uit ballastwater in te nemen of te lozen op een
      andere wijze dan zoals voorgeschreven in de bijlage bij het Ballastwaterverdrag.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel6
  - number: '6.6'
    text: |-
      Het is verboden met een schip ballastwater te lozen gedurende een nader onderzoek als bedoeld in
      [artikel 20, tweede lid][ref1], of voor zolang het schip op grond van [artikel 23][ref2] is aangehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0028453#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0028453#Artikel23
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028453
        artikel: '20'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028453
        artikel: '23'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '6.7'
    text: 'De in dit artikel genoemde verboden gelden slechts ten aanzien van buitenlandse schepen:'
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel6
  - number: 6.7.a
    text: |-
      in de binnenwateren, de territoriale zee of, voor zover de in deze leden bedoelde verboden betrekking hebben op de
      voorschriften van het MARPOL-verdrag of voor zover met deze verboden toepassing wordt gegeven aan artikel 220 van
      het VN-Zeerechtverdrag, in de exclusieve economische zone, en
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel6
  - number: 6.7.b
    text: |-
      in de territoriale zee of de exclusieve economische zone van een vreemde staat dan wel op volle zee, voor zover de
      in deze leden bedoelde verboden betrekking hebben op de voorschriften van het MARPOL-verdrag of voor zover met deze
      verboden toepassing wordt gegeven aan artikel 218 van het VN-Zeerechtverdrag.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel6
  - number: '7.1'
    text: |-
      De beheerders, of indien geen beheerder is aangewezen de eigenaar, van bij of krachtens algemene maatregel van
      bestuur aan te wijzen havens zijn verplicht zorg te dragen voor voldoende voorzieningen, geschikt voor het in
      ontvangst nemen van schadelijke stoffen dan wel restanten van schadelijke stoffen afkomstig van schepen dan wel
      schadelijke stoffen of uitrusting die deze schadelijke stoffen bevat en die van schepen worden verwijderd, zodanig
      dat onnodig oponthoud aan deze schepen wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel7
  - number: '7.2'
    text: |-
      De beheerders, of indien geen beheerder is aangewezen de eigenaar, van de havens zijn ter uitvoering van de hun in
      het eerste lid opgelegde verplichting bevoegd regels te geven krachtens welke de beheerders van bepaalde los- en
      laadplaatsen en scheepsreparatiewerven in hun havens worden verplicht zorg te dragen voor de voorzieningen, bedoeld
      in het eerste lid, voor zover schepen gebruik maken van die los- en laadplaatsen of scheepsreparatiewerven.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel7
  - number: '7.3'
    text: |-
      De kosten verbonden aan het in ontvangst nemen, opslaan en verwerken van restanten van schadelijke stoffen,
      afgegeven door schepen als bedoeld in het eerste lid, worden verhaald op degenen die deze restanten afgeven.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel7
  - number: '7.4'
    text: |-
      Bij of krachtens de in het eerste lid bedoelde maatregel, worden nadere regels gegeven ter uitvoering van dit
      artikel. De afgifte bedoeld in het eerste lid mag niet anders geschieden dan op een wijze aangegeven bij of
      krachtens die maatregel.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel7
  - number: '13.1'
    text: |-
      De kapitein van een buitenlands schip dat zich in een haven in de openbare lichamen Bonaire, Sint Eustatius of Saba
      bevindt en waarop ingevolge de verdragen een journaal dient te worden bijgehouden, is verplicht de autoriteiten,
      bedoeld in [artikel 16][ref1], op hun verzoek inzage in het journaal te verlenen en dient hen toe te staan van
      elke in het journaal geplaatste aantekening een eensluidend afschrift te maken. Desgevraagd dient de kapitein het
      afschrift voor eensluidend te waarmerken.


      [ref1]: https://wetten.overheid.nl/BWBR0028453#Artikel16
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028453
        artikel: '16'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '13.2'
    text: |-
      Elk aldus vervaardigd en voor eensluidend gewaarmerkt afschrift van een aantekening in het journaal zal in een
      gerechtelijke procedure als bewijs van de feiten, vermeld in de aantekening, worden toegelaten.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel13
  - number: '14.1'
    text: |-
      De kapitein van een buitenlands schip is verplicht een voorval dat plaatsvindt in de territoriale zee of in
      de exclusieve economische zone in de gevallen waarin het MARPOL-verdrag voorziet, onverwijld te melden aan de
      autoriteiten, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel14
  - number: '14.2'
    text: |-
      De kapitein is verplicht een voorval als bedoeld in het eerste lid te melden op de wijze, voorgeschreven in
      Protocol I bij het MARPOL-verdrag.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel14
  - number: '14.3'
    text: Onze Minister wijst de autoriteiten aan, aan wie een voorval als bedoeld in het eerste lid moet worden gemeld.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel14
  - number: '14.4'
    text: |-
      De autoriteiten aan wie krachtens het derde lid een voorval wordt gemeld, stellen de Inspectie Verkeer en
      Waterstaat en de door Onze Minister aangewezen instanties in de openbare lichamen Bonaire, Sint Eustatius of Saba
      onverwijld op de hoogte.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel14
  - number: '15'
    text: |-
      Het is verboden met een buitenlands schip dat ingevolge een of meer van de verdragen voorzien moet zijn van een
      geldig certificaat, een haven in de openbare lichamen Bonaire, Sint Eustatius of Saba te verlaten, zonder dat
      bedoeld certificaat aan boord is.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel15
  - number: '16.1'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de ambtenaren van de
      Inspectie Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel16
  - number: '16.2'
    text: |-
      Bij besluit van Onze Minister kunnen voor bepaalde daarin te vermelden taken verband houdende met het toezicht,
      bedoeld in het eerste lid, andere ambtenaren en personen worden aangewezen en ter beschikking gesteld van de
      Inspectie Verkeer en Waterstaat. Een zodanige aanwijzing en terbeschikkingstelling wordt bekendgemaakt in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel16
  - number: '16.3'
    text: |-
      De ambtenaren van de Inspectie Verkeer en Waterstaat alsmede de krachtens het tweede lid aangewezen andere
      ambtenaren en personen zijn, uitsluitend voor zover dat voor de vervulling van hun taak redelijkerwijze
      noodzakelijk is, bevoegd:
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel16
  - number: 16.3.a
    text: alle inlichtingen te vragen;
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel16
  - number: 16.3.b
    text: |-
      inzage te verlangen van alle boeken, bescheiden en andere informatiedragers die betrekking hebben op de fabricage,
      het vervoer, de opslag, de lozing of de emissie van schadelijke stoffen, en daarvan afschrift te nemen of deze
      daartoe tijdelijk mee te nemen;
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel16
  - number: 16.3.c
    text: |-
      schepen en andere plaatsen, met uitzondering van woningen of tot woning bestemde gedeelten van schepen zonder de
      uitdrukkelijke toestemming van de bewoner, te betreden, vergezeld van schepen zonder de uitdrukkelijke toestemming
      van de bewoner, te betreden, vergezeld van door hen aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel16
  - number: 16.3.d
    text: |-
      woningen of tot woning bestemde gedeelten van schepen zonder de uitdrukkelijke toestemming van de bewoner binnen
      te treden.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel16
  - number: 16.3.e
    text: |-
      stoffen die zij aantreffen op plaatsen waar zij toegang hebben aan onderzoek te onderwerpen, deze daartoe tijdelijk
      mee te nemen en daarvan monsters te nemen;
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel16
  - number: '16.4'
    text: |-
      Zo nodig, wordt de toegang tot een plaats als bedoeld in het derde lid, onderdeel c, verschaft met behulp van de
      sterke arm.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel16
  - number: '16.5'
    text: |-
      Op het binnentreden van woningen of van tot woning bestemde gedeelten van schepen als bedoeld in het
      derde lid, onderdeel d, is [Titel X van het Derde Boek van het Wetboek van Strafvordering BES][ref1] van
      overeenkomstige toepassing, met uitzondering van de [artikelen 155, vierde lid][ref2], [156, tweede lid][ref3],
      [157, tweede en derde lid][ref4], [158, eerste lid, laatste zinsnede][ref5], en [160, eerste lid][ref6], en met
      dien verstande dat de machtiging wordt verleend door de procureur-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0028681
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel155
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel156
      [ref4]: https://wetten.overheid.nl/BWBR0028681#Artikel157
      [ref5]: https://wetten.overheid.nl/BWBR0028681#Artikel158
      [ref6]: https://wetten.overheid.nl/BWBR0028681#Artikel160
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028681
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '155'
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '156'
      - id: ref4
        bwb_id: BWBR0028681
        artikel: '157'
      - id: ref5
        bwb_id: BWBR0028681
        artikel: '158'
      - id: ref6
        bwb_id: BWBR0028681
        artikel: '160'
  - number: '16.6'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot de wijze van taakuitoefening van de
      krachtens het tweede lid aangewezen andere ambtenaren en personen.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel16
  - number: '16.7'
    text: |-
      Een iedere is verplicht aan de ambtenaren van de Inspectie Verkeer en Waterstaat en de krachtens het tweede
      lid aangewezen andere ambtenaren en personen alle medewerking te verlenen die op grond van het derde lid wordt
      gevorderd.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel16
  - number: '17'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel17
  - number: '18'
    text: |-
      De kapitein is verplicht de ambtenaren van de Inspectie Verkeer en Waterstaat en de andere ambtenaren en personen,
      bedoeld in [artikel 16 tweede lid][ref1] desgevraagd behoorlijke en veilige toegang tot het schip en zijn ruimten
      te verschaffen. Voorts stelt de kapitein op een daartoe strekkend verzoek van een zodanige ambtenaar, alle
      personele middelen en hulpmiddelen ter beschikking, welke naar het oordeel van de ambtenaar redelijkerwijs nodig
      zijn voor de uitvoering van het onderzoek aan boord.


      [ref1]: https://wetten.overheid.nl/BWBR0028453#Artikel16
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028453
        artikel: '16'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '19.1'
    text: |-
      Het bepaalde in de [artikelen 16][ref1] en [18][ref2] geldt slechts ten aanzien van een buitenlands schip dat zich
      bevindtin de binnenwateren, de territoriale zee of de exclusieve economische zone.


      [ref1]: https://wetten.overheid.nl/BWBR0028453#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0028453#Artikel18
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028453
        artikel: '16'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028453
        artikel: '18'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '19.2'
    text: |-
      De toezichthouder neemt bij het toezicht op de naleving van [artikel 6][ref1], de artikelen 218 en 220 en afdeling
      7 van Deel XII van het VN-Zeerechtverdrag in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0028453#Artikel6
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028453
        artikel: '6'
        hoofdstuk: III
        paragraaf: '1'
  - number: '20.1'
    text: |-
      Een buitenlands schip dat ingevolge een of meer van de verdragen een certificaat behoeft kan in een haven in
      de openbare lichamen Bonaire, Sint Eustatius of Saba worden onderworpen aan controle door een ambtenaar van
      de Inspectie Verkeer en Waterstaat, teneinde na te gaan of het schip is voorzien van een geldig ingevolge het
      betreffende verdrag vereist certificaat.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel20
  - number: '20.2'
    text: |-
      Indien een in het eerste lid bedoeld schip niet is voorzien van een geldig ingevolge een of meer van de verdragen
      vereist certificaat of indien er gegronde redenen zijn om aan te nemen dat de bouw, inrichting of uitrusting van
      het schip niet in overeenstemming is met de gegevens van het desbetreffende certificaat, kan het schip worden
      onderworpen aan een nader onderzoek.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel20
  - number: '20.3'
    text: |-
      Een buitenlands schip dat ingevolge een of meer van de verdragen geen certificaat behoeft of een buitenlands
      schip dat de vlag voert van een Staat die geen partij is bij een of meer van de verdragen, kan in een haven in de
      openbare lichamen Bonaire, Sint Eustatius of Saba worden onderworpen aan een controle door een ambtenaar van de
      Inspectie Verkeer en Waterstaat teneinde na te gaan of het schip zonder gevaar voor verontreiniging van het milieu
      naar zee kan vertrekken.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel20
  - number: '20.4'
    text: |-
      Een buitenlands schip kan in een haven in de openbare lichamen Bonaire, Sint Eustatius of Saba worden onderworpen
      aan een controle door een ambtenaar als bedoeld in [artikel 16][ref1] teneinde na te gaan of wordt voldaan aan de
      voorschriften die in de verdragen zijn gegeven met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0028453#Artikel16
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028453
        artikel: '16'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 20.4.a
    text: de aanwezigheid van instructies, gebruiksaanwijzingen en waarschuwingen;
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel20
  - number: 20.4.b
    text: |-
      de stuwage, de wijze van verpakking en de etikettering van schadelijke stoffen alsmede de daarop betrekking
      hebbende ladingdocumenten;
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel20
  - number: 20.4.c
    text: de aanwezigheid en hoedanigheid van meet- en registratieapparatuur, alsmede het gebruik daarvan; en
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel20
  - number: 20.4.d
    text: |-
      het verrichten van handelingen met betrekking tot schadelijke stoffen en restanten daarvan alsmede de daarmee
      verband houdende bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel20
  - number: '21'
    text: |-
      Een buitenlands schip kan in een haven in de openbare lichamen Bonaire, Sint Eustatius of Saba worden onderworpen
      aan een onderzoek door een ambtenaar van de Inspectie Verkeer en Waterstaat, teneinde na te gaan of in strijd met
      een of meer van de verdragen schadelijke stoffen zijn geloosd in zee of in de binnenwateren of uitgestoten in de
      lucht.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel21
  - number: '22'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel22
  - number: '23.1'
    text: |-
      Een ambtenaar van de Inspectie Verkeer en Waterstaat is bevoegd een buitenlands schip, dat zich in een haven in de
      openbare lichamen Bonaire, Sint Eustatius of Saba bevindt en dat de vlag voert van een Staat die partij is bij een
      of meer van de verdragen, aan te houden:
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel23
  - number: 23.1.a
    text: indien het schip niet is voorzien van een geldig ingevolge een of meer van de verdragen vereist certificaat;
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel23
  - number: 23.1.b
    text: |-
      indien het schip in belangrijke mate niet voldoet aan de eisen, gesteld ter verkrijging van het desbetreffende
      vereiste certificaat;
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel23
  - number: 23.1.c
    text: |-
      waar het een schip betreft dat ingevolge een of meer van de verdragen geen certificaat behoeft, indien het schip
      zodanig is gebouwd, ingericht of uitgerust, dat het een gevaar vormt voor verontreiniging van het milieu;
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel23
  - number: 23.1.d
    text: |-
      indien een ambtenaar als bedoeld in [artikel 16][ref1] wordt belemmerd in de uitoefening van zijn taak; of


      [ref1]: https://wetten.overheid.nl/BWBR0028453#Artikel16
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028453
        artikel: '16'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 23.1.e
    text: |-
      indien daartoe een verzoek wordt gedaan door de bevoegde autoriteiten van de vlagge-staat van dit schip wegens een
      overtreding van de in die staat ter uitvoering van een of meer van de verdragen gestelde wettelijke regelen.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel23
  - number: '23.2'
    text: |-
      Een ambtenaar van de Inspectie Verkeer en Waterstaat is bevoegd een buitenlands schip, dat zich in een haven in de
      openbare lichamen Bonaire, Sint Eustatius of Saba bevindt en dat de vlag voert van een Staat die geen partij is bij
      een of meer van de verdragen, aan te houden:
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel23
  - number: 23.2.a
    text: |-
      indien het schip zodanig is gebouwd, ingericht of uitgerust, dat het een gevaar vormt voor verontreiniging van het
      milieu; of
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel23
  - number: 23.2.b
    text: |-
      indien een ambtenaar als bedoeld in [artikel 16][ref1] wordt belemmerd in de uitoefening van zijn taak.


      [ref1]: https://wetten.overheid.nl/BWBR0028453#Artikel16
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028453
        artikel: '16'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '23.3'
    text: |-
      Een ambtenaar van de Inspectie Verkeer en Waterstaat is bevoegd een buitenlands schip dat zich in een haven
      in de openbare lichamen Bonaire, Sint Eustatius of Saba bevindt aan te houden, indien met betrekking tot
      het schip niet wordt voldaan aan de voorschriften die in de Verdragen zijn gegeven met betrekking tot de in
      [artikel 20, vierde lid][ref1], genoemde onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0028453#Artikel20
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028453
        artikel: '20'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '24.1'
    text: |-
      De aanhouding geschiedt door een ambtenaar van de Inspectie Verkeer en Waterstaat door middel van overhandiging
      aan de kapitein van een ondertekende en gedagtekende kennisgeving, waarin de reden van de aanhouding staat vermeld.
      Wanneer naar het oordeel van die ambtenaar overhandiging niet mogelijk is, geschiedt de aanhouding mondeling
      door een kennisgeving aan de naar zijn oordeel daarvoor meest gerede persoon, zo spoedig mogelijk gevolgd door
      overhandiging van de schriftelijke kennisgeving aan de kapitein.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel24
  - number: '24.2'
    text: |-
      De havenbeheerder, of indien geen beheerder is aangewezen de eigenaar van de haven, alsmede de naar het oordeel
      van de in het eerste lid bedoelde ambtenaar in aanmerking komende diensten, worden onverwijld van het bevel tot
      aanhouding in kennis gesteld. Indien de aanhouding geschiedt omdat er gevaar bestaat dat het schip het mariene
      milieu verontreinigt, worden de door Onze Minister aangewezen instanties in de openbare lichamen Bonaire, Sint
      Eustatius of Saba.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel24
  - number: '25.1'
    text: |-
      De kapitein van een op grond van de [Wet voorkoming verontreiniging door schepen][ref1] aangehouden Nederlands
      schip is verplicht zijn schip na de aanhouding ligplaats te doen nemen op de door een ambtenaar van de Inspectie
      Verkeer en Waterstaat in overeenstemming met de havenbeheerder, of indien geen beheerder is aangewezen de eigenaar
      van de haven, aan te wijzen plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0003642
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003642
  - number: '25.2'
    text: |-
      Zolang de aanhouding voortduurt, is het de kapitein verboden het schip te doen verplaatsen zonder voorafgaande
      toestemming van een ambtenaar van de Inspectie Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel25
  - number: '25.3'
    text: |-
      Zonder deze toestemming weigeren alle betrokken ambtenaren hun medewerking bij het verplaatsen en het uitklaren van
      het schip.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel25
  - number: '25.4'
    text: |-
      Het eerste, tweede en derde lid zijn van overeenkomstige toepassing op een buitenlands schip dat zich in een haven
      in de openbare lichamen Bonaire, Sint Eustatius of Saba bevindt.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel25
  - number: '26'
    text: |-
      De ambtenaren van de Inspectie Verkeer en Waterstaat, zijn bevoegd ter uitvoering en handhaving van de aanhouding
      de nodige maatregelen te nemen en de nodige aanwijzingen te geven.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel26
  - number: '27.1'
    text: |-
      Zodra er geen reden is de aanhouding langer te laten voortduren en de mogelijk op grond van [artikel 41][ref1]
      verschuldigde kosten zijn voldaan of de voldoening daarvan voldoende zeker is gesteld, heft de ambtenaar van de
      Inspectie Verkeer en Waterstaat, de aanhouding op.


      [ref1]: https://wetten.overheid.nl/BWBR0028453#Artikel41
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0028453
        artikel: '41'
        hoofdstuk: VII
  - number: '27.2'
    text: Opheffing geschiedt door overhandiging aan de kapitein van een ondertekende en gedagtekende kennisgeving.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel27
  - number: '27.3'
    text: |-
      Op deze opheffing en kennisgeving is [artikel 24][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028453#Artikel24
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0028453
        artikel: '24'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '28'
    text: |-
      Van de aanhouding, bedoeld in de [artikelen 24][ref1] en [26][ref2], en de opheffing daarvan, bedoeld in
      [artikel 27][ref3], wordt tevens de consul of de diplomatieke vertegenwoordiger en, bij diens afwezigheid, de
      regering van de Staat waarvan het schip de vlag voert, onverwijld op de hoogte gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028453#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0028453#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0028453#Artikel27
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0028453
        artikel: '24'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028453
        artikel: '26'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0028453
        artikel: '27'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '29.1'
    text: |-
      Degene die rechtstreeks in zijn belang is getroffen door een beslissing genomen krachtens deze wet, met
      uitzondering van het bepaalde in de [artikelen 16][ref1] en [18][ref2], kan daartegen een bezwaarschrift indienen
      bij Onze Minister binnen 30 dagen na de dag waarop die beslissing is verzonden of uitgereikt aan degene tot wie zij
      is gericht.


      [ref1]: https://wetten.overheid.nl/BWBR0028453#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0028453#Artikel18
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0028453
        artikel: '16'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028453
        artikel: '18'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '29.2'
    text: Het bezwaarschrift moet gemotiveerd zijn en gesteld in de Nederlandse of Engelse taal.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel29
  - number: '29.3'
    text: Het bezwaarschrift wordt schriftelijk, telegrafisch, per telex of per telefax ingediend.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel29
  - number: '29.4'
    text: Het indienen van een bezwaarschrift schorst de werking van de beslissing niet, tenzij Onze Minister anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel29
  - number: '30.1'
    text: |-
      Onze Minister beslist binnen zestig dagen na ontvangst van het bezwaarschrift. Alvorens hij een beslissing neemt,
      kan hij advies inwinnen bij de Commissie van Onderzoek, bedoeld in [artikel 26bis van de Schepenwet][ref1] (Stb.
      1909, 219). Wat betreft de samenstelling, de bevoegdheden en de werkwijze van de Commissie bij de uitvoering van
      deze taak, alsmede de schadeloosstelling van door de Commissie gehoorde getuigen en deskundigen en van leden van de
      Commissie zelve, zijn de desbetreffende bepalingen van de [Schepenwet][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel26bis
      [ref2]: https://wetten.overheid.nl/BWBR0001876
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: 26bis
      - id: ref2
        bwb_id: BWBR0001876
  - number: '30.2'
    text: |-
      Degene die het bezwaarschrift heeft ingediend kan de Commissie verzoeken te worden gehoord alvorens het advies
      wordt uitgebracht.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel30
  - number: '30.3'
    text: |-
      Onze Minister kan zijn beslissing voor ten hoogste zestig dagen verdagen indien de Commissie van Onderzoek om
      advies is verzocht.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel30
  - number: '30.4'
    text: Een beslissing van Onze Minister wordt schriftelijk aan betrokkene bekendgemaakt en is met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel30
  - number: '32.1'
    text: |-
      Onze Minister kan organisaties of personen machtigen bepaalde door hem aangewezen werkzaamheden ter uitvoering van
      het bepaalde in deze wet te verrichten.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel32
  - number: '32.2'
    text: Een krachtens het eerste lid vastgesteld besluit wordt in de Staatscourant bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel32
  - number: '33'
    text: |-
      Een ieder die betrokken is bij de fabricage, de invoer, de opslag, het vervoer, het lozen of de uitstoot van
      schadelijke stoffen is verplicht aan de ambtenaren, bedoeld in [artikel 16][ref1], alle medewerking te verlenen en
      inlichtingen te verstrekken die zij bij de uitvoering van de hun op grond van deze wet opgedragen taak behoeven.


      [ref1]: https://wetten.overheid.nl/BWBR0028453#Artikel16
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0028453
        artikel: '16'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '34'
    text: |-
      Zij die uit hoofde van hun stand, beroep of ambt tot geheimhouding verplicht zijn kunnen zich verschonen van
      het verschaffen van inlichtingen, doch uitsluitend voorzover het betreft hetgeen hun in hun hoedanigheid is
      toevertrouwd. Zij kunnen voorts het verlenen van medewerking weigeren, voor zover hun plicht tot geheimhouding zich
      daartoe uitstrekt.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel34
  - number: '35'
    text: |-
      Een ieder die betrokken is bij de uitvoering van deze wet en daarbij de beschikking krijgt over gegevens waarvan
      hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden en voor wie niet reeds uit hoofde van
      ambt, beroep of wettelijk voorschrift terzake van die gegevens een geheimhoudingsplicht geldt, is verplicht tot
      geheimhouding daarvan, behoudens voor zover enig wettelijk voorschrift hem tot bekendmaking verplicht of uit zijn
      taak bij de uitvoering van deze wet de noodzaak tot bekendmaking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel35
  - number: 37a.1
    text: |-
      De strafwet van de openbare lichamen Bonaire, Sint Eustatius en Saba is, met inachtneming van de artikelen 218
      en 220 en afdeling 7 van Deel XII van het VN-Zeerechtverdrag en onverminderd het recht van andere staten om
      overeenkomstig het VN-Zeerechtverdrag of een van de verdragen tot rechtsvervolging over te gaan, toepasselijk
      op ieder die zich buiten Bonaire, Sint Eustatius of Saba schuldig maakt aan overtreding van het bepaalde in
      [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028453#Artikel6
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0028453
        artikel: '6'
        hoofdstuk: III
        paragraaf: '1'
  - number: 37a.2
    text: |-
      De strafwet van de openbare lichamen Bonaire, Sint Eustatius en Saba is van toepassing op ieder die zich in de
      exclusieve economische zone schuldig maakt aan overtreding van de bij of krachtens [artikel 14][ref1] gestelde
      regels.


      [ref1]: https://wetten.overheid.nl/BWBR0028453#Artikel14
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0028453
        artikel: '14'
        hoofdstuk: III
        paragraaf: '3'
  - number: '38.1'
    text: |-
      Overtreding van de voorschriften gesteld bij of krachtens de [artikelen 6][ref1], [14, eerste en tweede lid][ref2]
      en [25, eerste, tweede en vierde lid][ref3], worden voor zover zij opzettelijk zijn begaan, gestraft met
      gevangenisstraf van ten hoogste vier jaren of geldboete van ten hoogste de zesde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028453#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0028453#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0028453#Artikel25
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0028453
        artikel: '6'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028453
        artikel: '14'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0028453
        artikel: '25'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '38.2'
    text: |-
      Overtreding van de voorschriften gesteld bij of krachtens de [artikelen 6][ref1], [7, vierde lid][ref2],
      [13, eerste lid][ref3], [14, eerste en tweede lid][ref4], [15][ref5], [18][ref6], [19][ref7],
      [25, eerste, tweede en vierde lid][ref8] en [33][ref9], worden gestraft met hechtenis van ten hoogste een jaar of
      een geldboete van ten hoogste de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028453#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0028453#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0028453#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0028453#Artikel14
      [ref5]: https://wetten.overheid.nl/BWBR0028453#Artikel15
      [ref6]: https://wetten.overheid.nl/BWBR0028453#Artikel18
      [ref7]: https://wetten.overheid.nl/BWBR0028453#Artikel19
      [ref8]: https://wetten.overheid.nl/BWBR0028453#Artikel25
      [ref9]: https://wetten.overheid.nl/BWBR0028453#Artikel33
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0028453
        artikel: '6'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028453
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0028453
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0028453
        artikel: '14'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0028453
        artikel: '15'
        hoofdstuk: III
        paragraaf: '4'
      - id: ref6
        bwb_id: BWBR0028453
        artikel: '18'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref7
        bwb_id: BWBR0028453
        artikel: '19'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref8
        bwb_id: BWBR0028453
        artikel: '25'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref9
        bwb_id: BWBR0028453
        artikel: '33'
        hoofdstuk: V
        paragraaf: '3'
  - number: '38.3'
    text: |-
      De in het eerste lid strafbaar gestelde gedragingen zijn misdrijven en de in het tweede lid strafbaar gestelde
      gedragingen zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel38
  - number: '39.1'
    text: |-
      Bij vermoeden van overtreding van de voorschriften, bedoeld in de [artikelen 6][ref1], [7, vierde lid][ref2],
      [13, eerste lid][ref3],[14, eerste en tweede lid][ref4], [15][ref5], [18][ref6], [19][ref7],
      [25, eerste, tweede en vierde lid][ref8] en [33][ref9], kan aan de kapitein bevel worden gegeven dat het schip
      een haven in de openbare lichamen Bonaire, Sint Eustatius of Saba of binnenwater niet zal verlaten dan nadat op
      een bij dat bevel aan te wijzen plaats een daarbij te bepalen geldsom is gestort, waarop terzake van die strafbare
      gedraging op te leggen geldboete zal kunnen worden verhaald. Het bevel wordt zonodig met behulp van de sterke arm
      ten uitvoer gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028453#Artikel6
