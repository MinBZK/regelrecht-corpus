  - number: '39.2'
    text: |-
      Het in het eerste lid bedoelde bevel wordt op vordering van de Officier van Justitie gegeven door de rechter voor
      wie de zaak wordt of zal worden vervolgd. De kapitein wordt vooraf gehoord, althans daartoe behoorlijk opgeroepen.
      Het bevel is dadelijk uitvoerbaar en wordt onverwijld aan de kapitein betekend.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel39
  - number: '39.3'
    text: |-
      Van het bevel of de beschikking tot afwijzing van de vordering kan de verdachte binnen drie dagen na de betekening
      en het Openbaar Ministerie binnen drie dagen nadat het bevel of de beschikking is genomen, in beroep komen bij het
      Gemeenschappelijk Hof van Justitie van Aruba, Curaçao en Sint Maarten en van Bonaire, Sint Eustatius en Saba. Het
      Hof beslist zo spoedig mogelijk.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel39
  - number: '39.4'
    text: |-
      Zodra het in de strafzaak gewezen vonnis onherroepelijk is geworden, wordt de gestorte geldsom wederom ter
      beschikking van de rechthebbende gesteld, nadat daarop een bij dat vonnis opgelegde geldboete in mindering is
      gebracht. Tot dat tijdstip en te rekenen van de dag dat de geldsom werd gestort, wordt over die som de wettelijke
      rente vergoed.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel39
  - number: '40'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel40
  - number: '41'
    text: |-
      Bij regeling van Onze Minister kunnen de vergoedingen worden geregeld, verschuldigd door degenen, ten behoeve van
      wie:
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel41
  - number: 41.a
    text: werkzaamheden of diensten door de openbare lichamen Bonaire, Sint Eustatius of Saba zijn verricht;
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel41
  - number: 41.b
    text: |-
      werkzaamheden of diensten zijn verricht door andere personen, aan wie op grond van deze wet die werkzaamheden of
      diensten zijn overgedragen.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel41
  - number: '42'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel42
  - number: '43'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel43
  - number: '44'
    text: 'Deze wet wordt aangehaald als: Wet voorkoming van verontreiniging door schepen BES.'
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel44
