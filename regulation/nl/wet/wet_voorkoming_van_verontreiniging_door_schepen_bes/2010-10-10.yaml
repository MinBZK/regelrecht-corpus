articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *MARPOL-verdrag:* het op 2 november 1973 te
      Londen tot stand gekomen Internationaal Verdrag ter voorkoming van verontreiniging door schepen, met Protocollen
      en Bijlagen met Aanhangsels (Trb. 1975, 147 en 1978, 187), gewijzigd en aangevuld bij het op 17 februari 1978 te
      Londen tot stand gekomen Protocol bij dat Verdrag met Bijlage en Aanhangsels (Trb, 1978, 188);
        - *AFS-verdrag:* het op 5 oktober 2001 te Londen tot stand gekomen Internationaal Verdrag inzake de beperking van
      schadelijke aangroeiwerende verfsystemen op schepen (Trb. 2004, 44);
        - *Ballastwaterverdrag:* het op 13 februari 2004 te Londen tot stand gekomen Internationaal Verdrag voor de
      controle en het beheer van ballastwater en sedimenten van schepen, met Bijlage, Aanhangsels, en Resoluties (Trb.
      2004, 256);
        - *de verdragen:* de in dit lid genoemde verdragen.
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel1
  - number: '1.2'
    text: |-
      In deze wet en de daarop rustende bepalingen wordt voorts verstaan onder: - *Onze Minister:* Onze Minister van
      Verkeer en Waterstaat;
        - *VN-Zeerechtverdrag:* het op 10 december 1982 te Montego-Bay tot stand gekomen Verdrag van de Verenigde Naties
      inzake het recht van de zee (Trb. 1983, 83);
        - *Milieuprotocol bij het Antarcticaverdrag:* het op 4 oktober 1991 te Madrid tot stand gekomen Protocol
      betreffende milieubescherming bij het Verdrag inzake Antarctica, met Bijlagen (Trb. 1992, 110);
        - *territoriale zee:* de territoriale zee rond Bonaire, Sint Eustatius en Saba, vastgesteld bij of krachtens
      [artikel 1 van de Rijkswet uitbreiding territoriale zee van het Koninkrijk][ref1];
        - *binnenwateren:* de wateren van Bonaire, Sint Eustatius en Saba gelegen landinwaarts vanaf de basislijn, bedoeld
      in het [Uitvoeringsbesluit ex artikel 1 Rijkswet uitbreiding territoriale zee van het Koninkrijk][ref2];
        - *schip:* elk vaartuig, van welk type ook, waaronder begrepen draagvleugelboten, luchtkussenvoertuigen, afzinkbare
      vaartuigen en drijvend materieel, alsmede installaties gedurende de tijd dat zij drijven, of wanneer het schip
      als hierboven bedoeld boven de zeebodem is geplaatst voor het instellen van een onderzoek naar de aanwezigheid van
      delfstoffen of voor het winnen daarvan;
        - *Nederlands schip:* een schip dat op grond van Nederlandse rechtsregels gerechtigd is de vlag van het Koninkrijk
      te voeren;
        - *buitenlands schip:* een schip, niet zijnde een Nederlands schip;
        - *schadelijke stof:* een stof die, indien zij in zee of in de lucht terechtkomt, gevaar kan opleveren voor
      de gezondheid van de mens, schade kan toebrengen aan het milieu, de recreatiemogelijkheden die de zee biedt
      kan schaden of storend kan werken op enig ander rechtmatig gebruik van de zee en die vermeld is in een van de
      verdragen;
        - *lozen:* elk vrijkomen van stoffen van een schip, hoe ook veroorzaakt, waaronder begrepen ontsnappen, over boord
      zetten, wegvloeien, weglekken, pompen of ledigen;
        - *uitstoot:* emissie als bedoeld in voorschrift 2 van Bijlage VI van het MARPOL-verdrag;
        - *voorval:* een gebeurtenis die er daadwerkelijk toe leidt of er vermoedelijk toe zal leiden dat een schadelijke
      stof in zee wordt geloosd;
        - *haven:* een rede, pier, steiger en in het algemeen iedere plaats, al of niet in zee, waar schepen ligplaats
      kunnen hebben of waar opvarenden en zaken ingescheept of ontscheept kunnen worden;
        - *eigenaar:* degene aan wie het schip in eigendom toebehoort of, met betrekking tot een teboekgesteld schip,
      degene die in het register als eigenaar van het schip staat ingeschreven;
        - *exclusieve economische zone:* de door het Koninkrijk ingestelde exclusieve economische zone, voor zover deze
      betrekking heeft op Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0003749#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003869#Artikel1
    url: https://wetten.overheid.nl/BWBR0028453/2010-10-10#Artikel1
    references:
