---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: tijdelijke_stimuleringsregeling_advies_en_steunpunten_huiselijk_geweld
regulatory_layer: WET
publication_date: '2004-07-20'
valid_from: '2006-03-02'
bwb_id: BWBR0017020
url: https://wetten.overheid.nl/BWBR0017020/2006-03-02
preamble:
  text: |-
    Gelet op de artikelen 5, 42, tweede lid, 49a, 50a en 56 van het Bekostigingsbesluit welzijnsbeleid;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017020/2006-03-02#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0017020/2006-03-02#Artikel1
  - number: 1.1.a
    text: |-
      huiselijk geweld: elke vorm van bedreigende of gewelddadige interactie van fysieke, psychische of
      seksuele aard in de privé-situatie, waardoor schade wordt berokkend of dreigt te worden berokkend aan
      het slachtoffer in de vorm van fysiek of psychisch letsel, anders dan kindermishandeling als bedoeld in
      [artikel 1, onderdeel m, van de Wet op de jeugdzorg][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel1
    url: https://wetten.overheid.nl/BWBR0017020/2006-03-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '1'
  - number: 1.1.b
    text: |-
      advies- en steunpunt: een loket dat telefonisch bereikbaar is voor deskundige adviezen, eerste gesprekken en
      doorverwijzing ingeval van huiselijk geweld;
    url: https://wetten.overheid.nl/BWBR0017020/2006-03-02#Artikel1
  - number: 1.1.c
    text: |-
      centrumgemeente: een gemeente genoemd in [bijlage 3][ref1] bij deze regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0017020
    url: https://wetten.overheid.nl/BWBR0017020/2006-03-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0017020
  - number: 1.1.d
    text: |-
      GSB-gemeente: de gemeente Alkmaar, Amersfoort, Amsterdam, Arnhem, Breda, ’s-Gravenhage, Dordrecht, Eindhoven,
      Emmen, Enschede, Groningen, Haarlem, Heerlen, Helmond, ’s-⁠Hertogenbosch, Leeuwarden, Leiden, Maastricht, Nijmegen,
      Rotterdam, Tilburg, Utrecht, Venlo, Zaanstad en Zwolle.
    url: https://wetten.overheid.nl/BWBR0017020/2006-03-02#Artikel1
  - number: '1.2'
    text: |-
      Op centrumgemeenten is [artikel 12, eerste lid, van de Welzijnswet 1994][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006705#Artikel12
    url: https://wetten.overheid.nl/BWBR0017020/2006-03-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006705
        artikel: '12'
  - number: '2.1'
    text: |-
      De minister kan voor de periode 1 januari 2005 tot en met 31 december 2007 aan een centrumgemeente eenmalig een
      meerjarige uitkering verlenen ten behoeve van:
    url: https://wetten.overheid.nl/BWBR0017020/2006-03-02#Artikel2
  - number: 2.1.a
    text: |-
      de oprichting van een of meer advies- en steunpunten en de activiteiten die een advies- en steunpunt na oprichting
      verricht, en
    url: https://wetten.overheid.nl/BWBR0017020/2006-03-02#Artikel2
  - number: 2.1.b
    text: |-
      de uitbreiding van een of meer advies- en steunpunten en de activiteiten die een advies- en steunpunt na
      uitbreiding verricht.
    url: https://wetten.overheid.nl/BWBR0017020/2006-03-02#Artikel2
  - number: '2.2'
    text: |-
      De aanvraag voor een meerjarige uitkering, bedoeld in het eerste lid, wordt overeenkomstig [bijlage 1][ref1]
      ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0017020
    url: https://wetten.overheid.nl/BWBR0017020/2006-03-02#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017020
  - number: '2.3'
    text: |-
      Vóór 1 mei 2005 legt de centrumgemeente de gegevens over waarmee inzicht wordt geboden of een advies- en steunpunt
      na oprichting of uitbreiding voldoet aan de voorwaarden van [artikel 3][ref1]. Deze gegevens worden overeenkomstig
      het model in [bijlage 2][ref2] ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0017020#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0017020
    url: https://wetten.overheid.nl/BWBR0017020/2006-03-02#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017020
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0017020
  - number: '3.1'
    text: 'Een advies- en steunpunt voldoet na oprichting of uitbreiding aan de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0017020/2006-03-02#Artikel3
  - number: 3.1.a
    text: het staat open voor iedere persoon die in aanraking komt met huiselijk geweld;
    url: https://wetten.overheid.nl/BWBR0017020/2006-03-02#Artikel3
  - number: 3.1.b
    text: het is gericht op de gehele bij de centrumgemeente behorende regio;
    url: https://wetten.overheid.nl/BWBR0017020/2006-03-02#Artikel3
  - number: 3.1.c
    text: |-
      het heeft op schrift vastgelegde samenwerkings- en doorverwijsafspraken met relevante organisaties
      en instellingen, met dien verstande dat in geval van kindermishandeling, als bedoeld in
      [artikel 1, onderdeel m, van de Wet op de jeugdzorg][ref1], wordt doorverwezen naar het advies- en meldpunt
      kindermishandeling van het bureau jeugdzorg in de desbetreffende provincie of regio;


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel1
    url: https://wetten.overheid.nl/BWBR0017020/2006-03-02#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '1'
  - number: 3.1.d
    text: het voorziet in een registratie van contacten en doorverwijzingen.
    url: https://wetten.overheid.nl/BWBR0017020/2006-03-02#Artikel3
  - number: '3.2'
    text: |-
      De oprichting en uitbreiding van de advies- en steunpunten, bedoeld in
      [artikel 2, eerste lid, onderdelen a en b][ref1], zijn vóór 1 januari 2006 voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0017020#Artikel2
    url: https://wetten.overheid.nl/BWBR0017020/2006-03-02#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0017020
        artikel: '2'
  - number: '4.1'
    text: |-
      De meerjarige uitkering bedraagt 60% van de werkelijk gemaakte kosten die voor de oprichting of uitbreiding en aan
      de activiteiten van advies- en steunpunten in de periode 1 oktober 2004 tot 31 december 2007 worden besteed, doch
      niet meer dan het bedrag vermeld in [kolom V van bijlage 3][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0017020
    url: https://wetten.overheid.nl/BWBR0017020/2006-03-02#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0017020
  - number: '4.2'
    text: |-
      Van de meerjarige uitkering, bedoeld in het eerste lid, wordt vóór 1 januari 2006 maximaal de som van de bedragen
      van [kolom I en II van bijlage 3][ref1] aangewend voor kosten van oprichting en uitbreiding.


      [ref1]: https://wetten.overheid.nl/BWBR0017020
    url: https://wetten.overheid.nl/BWBR0017020/2006-03-02#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0017020
  - number: '5.1'
    text: |-
      De centrumgemeente doet binnen drie maanden na afloop van een kalenderjaar verslag van de voortgang en wel voor de
      eerste maal vóór 1 mei 2005.
    url: https://wetten.overheid.nl/BWBR0017020/2006-03-02#Artikel5
  - number: '5.2'
    text: |-
      Het verslag wordt overeenkomstig het model voor de desbetreffende periode in [bijlage 4][ref1] ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0017020
    url: https://wetten.overheid.nl/BWBR0017020/2006-03-02#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0017020
  - number: '6'
    text: |-
      Een GSB-gemeente legt vóór 16 juli van het jaar na afloop van het laatste kalenderjaar waarvoor een uitkering is
      verstrekt, voor die uitkering een verantwoording en een schriftelijk verslag over tezamen met de verantwoording
      over de andere daartoe aangewezen uitkeringen.
    url: https://wetten.overheid.nl/BWBR0017020/2006-03-02#Artikel6
  - number: '7'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin zij
      wordt geplaatst en vervalt met ingang van 1 januari 2008, met dien verstande dat zij van toepassing blijft op de
      financiële verantwoording en vaststelling van op grond van de regeling verleende uitkeringen.
    url: https://wetten.overheid.nl/BWBR0017020/2006-03-02#Artikel7
  - number: '8'
    text: 'Deze regeling wordt aangehaald als: Tijdelijke stimuleringsregeling advies- en steunpunten huiselijk geweld.'
    url: https://wetten.overheid.nl/BWBR0017020/2006-03-02#Artikel8
