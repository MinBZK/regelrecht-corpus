articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      1 a. huiselijk geweld: elke vorm van bedreigende of gewelddadige interactie van fysieke, psychische of
      seksuele aard in de privé-situatie, waardoor schade wordt berokkend of dreigt te worden berokkend aan
      het slachtoffer in de vorm van fysiek of psychisch letsel, anders dan kindermishandeling als bedoeld in
      [artikel 1, onderdeel m, van de Wet op de jeugdzorg][ref1];

      b. advies- en steunpunt: een loket dat telefonisch bereikbaar is voor deskundige adviezen, eerste gesprekken en
      doorverwijzing ingeval van huiselijk geweld;

      c. centrumgemeente: een gemeente genoemd in [bijlage 3][ref2] bij deze regeling;

      d. GSB-gemeente: de gemeente Alkmaar, Amersfoort, Amsterdam, Arnhem, Breda, ’s-Gravenhage, Dordrecht, Eindhoven,
      Emmen, Enschede, Groningen, Haarlem, Heerlen, Helmond, ’s-⁠Hertogenbosch, Leeuwarden, Leiden, Maastricht, Nijmegen,
      Rotterdam, Tilburg, Utrecht, Venlo, Zaanstad en Zwolle.

      2 De door centrumgemeenten bekostigde advies- of steunpunten zijn toegankelijk voor iedereen die in Nederland
      woont.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017020
    url: https://wetten.overheid.nl/BWBR0017020/2007-12-23#Artikel1
