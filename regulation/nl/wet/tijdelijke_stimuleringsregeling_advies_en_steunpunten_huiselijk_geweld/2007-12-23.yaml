  - number: '2'
    text: |-
      1 De minister kan voor de periode 1 januari 2005 tot en met 31 december 2007 aan een centrumgemeente eenmalig een
      meerjarige uitkering verlenen ten behoeve van:

      a. de oprichting van een of meer advies- en steunpunten en de activiteiten die een advies- en steunpunt na
      oprichting verricht, en

      b. de uitbreiding van een of meer advies- en steunpunten en de activiteiten die een advies- en steunpunt na
      uitbreiding verricht.

      2 De aanvraag voor een meerjarige uitkering, bedoeld in het eerste lid, wordt overeenkomstig [bijlage 1][ref1]
      ingediend.

      3 Vóór 1 mei 2005 legt het college van burgemeester en wethouders van een centrumgemeente de gegevens over waarmee
      inzicht wordt geboden of een advies- en steunpunt na oprichting of uitbreiding voldoet aan de voorwaarden van
      [artikel 3][ref2]. Deze gegevens worden overeenkomstig het model in [bijlage 2][ref3] ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0017020
      [ref2]: https://wetten.overheid.nl/BWBR0017020#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0017020
    url: https://wetten.overheid.nl/BWBR0017020/2007-12-23#Artikel2
