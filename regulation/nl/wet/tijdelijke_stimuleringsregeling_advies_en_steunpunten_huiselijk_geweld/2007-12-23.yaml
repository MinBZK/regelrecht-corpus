  - number: '3'
    text: |-
      1 Een advies- en steunpunt voldoet na oprichting of uitbreiding aan de volgende voorwaarden:

      a. het staat open voor iedere persoon die in aanraking komt met huiselijk geweld;

      b. het is gericht op de gehele bij de centrumgemeente behorende regio;

      c. het heeft op schrift vastgelegde samenwerkings- en doorverwijsafspraken met relevante
      organisaties en instellingen, met dien verstande dat in geval van kindermishandeling, als bedoeld in
      [artikel 1, onderdeel m, van de Wet op de jeugdzorg][ref1], wordt doorverwezen naar het advies- en meldpunt
      kindermishandeling van het bureau jeugdzorg in de desbetreffende provincie of regio;

      d. het voorziet in een registratie van contacten en doorverwijzingen.

      2 De oprichting en uitbreiding van de advies- en steunpunten, bedoeld in
      [artikel 2, eerste lid, onderdelen a en b][ref2], zijn vóór 1 januari 2006 voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017020#Artikel2
    url: https://wetten.overheid.nl/BWBR0017020/2007-12-23#Artikel3
