  - number: '5'
    text: |-
      1 Het college van burgemeester en wethouders van een centrumgemeente doet vóór 1 mei 2005, vóór 1 april 2006 en
      vóór 1 april 2007 verslag van de voortgang overeenkomstig het model in [bijlage 4][ref1] voor de desbetreffende
      periode.

      2 Het college van burgemeester en wethouders van een centrumgemeente vraagt de vaststelling van de
      uitkering aan door verantwoordingsinformatie aan de minister te verstrekken op de wijze bedoeld in
      [artikel 27 van het Besluit financiële verhouding 2001][ref2].

      3 [Artikel 58a van het Besluit begroting en verantwoording provincies en gemeenten][ref3] is van overeenkomstige
      toepassing op de verantwoordingsinformatie, bedoeld in het tweede lid.


