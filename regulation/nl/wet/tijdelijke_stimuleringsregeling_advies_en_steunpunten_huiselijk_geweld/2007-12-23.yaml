  - number: '4'
    text: |-
      1 De meerjarige uitkering bedraagt 60% van de werkelijk gemaakte kosten die voor de oprichting of uitbreiding en
      aan de activiteiten van advies- en steunpunten in de periode 1 oktober 2004 tot 31 december 2007 worden besteed,
      doch niet meer dan het bedrag vermeld in [kolom V van bijlage 3][ref1] bij deze regeling.

      2 Van de meerjarige uitkering, bedoeld in het eerste lid, wordt vóór 1 januari 2006 maximaal de som van de bedragen
      van [kolom I en II van bijlage 3][ref2] aangewend voor kosten van oprichting en uitbreiding.


      [ref1]: https://wetten.overheid.nl/BWBR0017020
      [ref2]: https://wetten.overheid.nl/BWBR0017020
    url: https://wetten.overheid.nl/BWBR0017020/2007-12-23#Artikel4
