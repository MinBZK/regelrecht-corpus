  text: |-
    Gehoord de Bestuurskamer;

    Gelet op artikel 74, eerste lid, van de Wet op de bedrijfsorganisatie;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0011641/2001-01-28#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Het in deze verordening bepaalde vindt toepassing bij het voorbereiden en nemen van besluiten door de Sociaal-
      Economische Raad en zijn commissies, houdende aanwijzing van organisaties van ondernemers en van werknemers die
      gerechtigd zijn tot het benoemen van de leden, onder bepaling van het aantal leden dat per organisatie benoemd kan
      worden, in:

        - de besturen van de bedrijfslichamen, bedoeld in
      [artikel 66, vierde lid, van de Wet op de bedrijfsorganisatie][ref1],
        - de organen van bedrijfslichamen, bedoeld in [artikel 88a van de Wet op de bedrijfsorganisatie][ref2],
        - alsmede in de overige gevallen waarin de Sociaal-Economische Raad wordt gevraagd zijn oordeel te geven over
      de samenstelling van publiekrechtelijke colleges waarin, al dan niet uitsluitend, het bedrijfsleven wordt
      vertegenwoordigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel88a
    url: https://wetten.overheid.nl/BWBR0011641/2001-01-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '66'
      - id: ref2
        bwb_id: BWBR0002058
        artikel: 88a
  - number: '2'
    text: |-
      Voor aanwijzing als gerechtigd tot het benoemen van leden van de in [artikel 1][ref1] bedoelde publiekrechtelijke
      colleges komen slechts in aanmerking organisaties die:

      a. krachtens hun statutaire doelstelling hun werkzaamheid kunnen uitstrekken tot ten minste een belangrijk gedeelte
      van het terrein waarop het desbetreffende college een taak heeft te vervullen, en

      b. voldoen aan het bepaalde in de [artikelen 3 tot en met 9][ref2], hetzij met betrekking tot de ondernemers
      onderscheidenlijk de werknemers in het te vertegenwoordigen bedrijfsleven of gedeelte van het bedrijfsleven in het
      algemeen, hetzij met betrekking tot een bepaalde groep van die ondernemers of van die werknemers.


      [ref1]: https://wetten.overheid.nl/BWBR0011641#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011641#Artikel3
    url: https://wetten.overheid.nl/BWBR0011641/2001-01-28#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011641
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0011641
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '3'
    text: |-
      De organisatie dient de rechtsvorm te hebben van een vereniging met volledige rechtsbevoegdheid. De besturende,
      beleidsbepalende en controlerende organen van de vereniging dienen hetzij bij directe, hetzij bij getrapte
      verkiezing door de leden te worden gekozen en aan dezen periodiek verantwoording af te leggen.
    url: https://wetten.overheid.nl/BWBR0011641/2001-01-28#Artikel3
  - number: '4'
    text: |-
      De organisatie dient gedurende ten minste twee jaren over de in [artikel 3][ref1] genoemde rechtsbevoegdheid te
      beschikken. De periode gedurende welke een rechtsvoorganger in het bezit was van deze rechtsbevoegdheid, wordt
      meegeteld. Indien een organisatie de relevante werkzaamheden van een of meer andere organisaties voortzet, kan de
      periode gedurende welke die organisatie of organisaties volledige rechtsbevoegdheid had respectievelijk hadden,
      mede in aanmerking worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011641#Artikel3
    url: https://wetten.overheid.nl/BWBR0011641/2001-01-28#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011641
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '5'
    text: |-
      De statutaire doelstelling van de organisatie moet behelzen de behartiging van sociale en economische belangen van
      de bij haar, of de bij haar aangesloten verenigingen, aangesloten ondernemers onderscheidenlijk werknemers.
    url: https://wetten.overheid.nl/BWBR0011641/2001-01-28#Artikel5
  - number: '6'
    text: |-
      De organisatie dient in haar beleidsbepaling onafhankelijk te zijn van enige andere organisatie, niet zijnde een
      vereniging van organisaties van ondernemers onderscheidenlijk werknemers.
    url: https://wetten.overheid.nl/BWBR0011641/2001-01-28#Artikel6
  - number: '7'
    text: |-
      De inrichting en de financiële draagkracht van de organisatie dienen zodanig te zijn dat een geregelde voortzetting
      van de werkzaamheden gewaarborgd is.
    url: https://wetten.overheid.nl/BWBR0011641/2001-01-28#Artikel7
  - number: '8'
    text: |-
      Een organisatie van werknemers kan slechts representatief zijn voor een bepaalde groep van werknemers die zij
      beoogt te organiseren, indien zij een niet onbetekenend aantal leden heeft die tot die groep behoren.
    url: https://wetten.overheid.nl/BWBR0011641/2001-01-28#Artikel8
  - number: '9'
    text: |-
      Een organisatie van ondernemers kan slechts representatief zijn voor een bepaalde groep van ondernemers die zij
      beoogt te organiseren, indien haar leden tezamen een niet onbetekenend sociaal- economisch gewicht binnen die
      groep hebben en derhalve de organisatie qua sociaal-economische grootte niet onbetekenend is. Voor de bepaling
      van de sociaal-economische grootte van een organisatie van ondernemers komen als maatstaf in aanmerking: het
      aantal ondernemers dat lid is van de organisatie, de omzet van ondernemingen van de leden en het totale aantal
      personen werkzaam in deze ondernemingen. Zo nodig kunnen voorts als maatstaf in aanmerking worden genomen: het
      aantal zelfstandige ondernemingen of vestigingspunten van de leden, de betaalde lonen of de door de leden verwerkte
      hoeveelheid grondstof.
    url: https://wetten.overheid.nl/BWBR0011641/2001-01-28#Artikel9
  - number: '10'
    text: |-
      1 Als centrale organisatie wordt beschouwd de organisatie die een bundeling beoogt van ondernemers of organisaties
      van ondernemers, onderscheidenlijk van werknemers of organisaties van werknemers, in nagenoeg het gehele
      bedrijfsleven.

      Om als representatief op het niveau van het gehele bedrijfsleven te kunnen worden aangemerkt, moeten leden van de
      centrale organisatie voldoende zijn gespreid over het gehele land en over de bedrijfstakken van het bedrijfsleven.

      2 Als bedrijfstakorganisatie wordt beschouwd de organisatie, niet zijnde een centrale organisatie, die beoogt
      ondernemers of organisaties van ondernemers onderscheidenlijk werknemers of organisaties van werknemers in een of
      meer bedrijfstakken te organiseren.

      Om als representatief op het niveau van een bedrijfstak te kunnen worden aangemerkt, moeten de leden van
      de bedrijfstakorganisatie voldoende zijn gespreid over het gehele land en over de betrokken bedrijfstak of
      bedrijfstakken.

      3 Als regionale organisatie wordt beschouwd de organisatie die beoogt de ondernemers onderscheidenlijk de
      werknemers in een bepaalde regio, zoals een provincie, een gewest, een gemeente of een gebied van een kamer van
      koophandel en fabrieken, te organiseren.

      Om als representatief te worden aangemerkt, moeten de leden van de regionale organisatie voldoende zijn gespreid in
      de betrokken regio.
    url: https://wetten.overheid.nl/BWBR0011641/2001-01-28#Artikel10
  - number: '11'
    text: |-
      Voor het benoemen van leden van een college waarvan de taak betrekking heeft op sociaal- economische vraagstukken
      op centraal-nationaal niveau, komen representatieve centrale organisaties van ondernemers onderscheidenlijk van
      werknemers in aanmerking.
    url: https://wetten.overheid.nl/BWBR0011641/2001-01-28#Artikel11
  - number: '12'
    text: |-
      Indien door de aanwijzing van representatieve centrale organisaties van ondernemers onderscheidenlijk van
      werknemers niet een voldoende, alsmede een voldoende gespreide, vertegenwoordiging kan worden verkregen over
      de ondernemers en over de werknemers in het gehele bedrijfsleven, kunnen in afwijking van [artikel 11][ref1] en
      voorzover de wet zich daartegen niet verzet, ook representatieve bedrijfstakorganisaties worden aangewezen die niet
      bij een centrale organisatie zijn aangesloten. Als voorwaarde daarbij geldt dat deze bedrijfstakorganisaties mede
      zijn toegerust om zich een oordeel te vormen over sociaal-economische vraagstukken op nationaal niveau.


      [ref1]: https://wetten.overheid.nl/BWBR0011641#Artikel11
    url: https://wetten.overheid.nl/BWBR0011641/2001-01-28#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011641
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '13'
    text: |-
      Voor het benoemen van leden van een college waarvan de taak betrekking heeft op sociaal- economische vraagstukken
      op het niveau van een bedrijfstak, komen representatieve bedrijfstakorganisaties van ondernemers onderscheidenlijk
      van werknemers in aanmerking, alsmede representatieve centrale organisaties die blijkens hun statuten een of meer
      afdelingen of aangesloten organisaties voor die bedrijfstak hebben.

      Laatstgenoemde afdelingen of aangesloten organisaties dienen in dat geval te voldoen aan de kwantitatieve
      representativiteitsvereisten, bedoeld in de [artikelen 8][ref1] en [9][ref2], alsmede aan de in
      [artikel 10, tweede lid, tweede volzin][ref3], bedoelde eis. Bedoelde afdelingen of aangesloten organisaties moeten
      bovendien voldoen aan de voorwaarde dat zij mede zijn toegerust voor het beoordelen van vraagstukken waarvoor het
      college is ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011641#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011641#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0011641#Artikel10
    url: https://wetten.overheid.nl/BWBR0011641/2001-01-28#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011641
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0011641
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0011641
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '14'
    text: |-
      Indien door de aanwijzing van organisaties als bedoeld in [artikel 13][ref1], niet een voldoende, alsmede een
      voldoende gespreide, vertegenwoordiging kan worden verkregen over de ondernemers en over de werknemers in de gehele
      bedrijfstak, kunnen ook organisaties worden aangewezen die zich beperken tot bepaalde onderdelen van de bedrijfstak
      en daarvoor representatief moeten worden geacht. Deze organisaties moeten voldoen aan de voorwaarde dat zij mede
      zijn toegerust voor het beoordelen van vraagstukken waarvoor het college is ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011641#Artikel13
    url: https://wetten.overheid.nl/BWBR0011641/2001-01-28#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0011641
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '15'
    text: |-
      Voor het benoemen van leden van een college waarvan de taak betrekking heeft op sociaal- economische vraagstukken
      op regionaal niveau, komen in aanmerking representatieve organisaties van ondernemers onderscheidenlijk van
      werknemers voor de desbetreffende regio, alsmede representatieve centrale organisaties die blijkens hun statuten
      een of meer afdelingen of aangesloten organisaties voor die regio hebben. Laatstgenoemde afdelingen of aangesloten
      organisaties dienen in dat geval te voldoen aan de kwantitatieve representativiteitsvereisten bedoeld in de
      [artikelen 8][ref1] en [9][ref2], alsmede aan de in [artikel 10, lid 3, tweede volzin][ref3], bedoelde eis. Deze
      afdelingen of organisaties moeten bovendien

      voldoen aan de voorwaarde dat zij mede zijn toegerust voor het beoordelen van vraagstukken waarvoor het college
      is ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011641#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011641#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0011641#Artikel10
    url: https://wetten.overheid.nl/BWBR0011641/2001-01-28#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0011641
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0011641
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0011641
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '16'
    text: |-
      Indien voor de bestuurssamenstelling van het regionale college onvoldoende regionale organisaties en
      centrale organisaties als bedoeld in [artikel 15][ref1] kunnen worden aangewezen, kunnen ook representatieve
      bedrijfstakorganisaties of andere representatieve centrale organisaties dan de in [artikel 15][ref2] bedoelde
      worden aangewezen, mits zij mede toegerust zijn voor het beoordelen van vraagstukken waarvoor het college is
      ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011641#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0011641#Artikel15
    url: https://wetten.overheid.nl/BWBR0011641/2001-01-28#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011641
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0011641
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '17'
    text: |-
      Voorafgaand aan de toewijzing van zetels aan individuele representatieve organisaties, kan een verdeling van de
      beschikbare zetels plaatsvinden over groepen van ondernemers onderscheidenlijk van werknemers, in welk geval de
      toewijzing van zetels aan representatieve organisaties per groep geschiedt.
    url: https://wetten.overheid.nl/BWBR0011641/2001-01-28#Artikel17
  - number: '18'
    text: |-
      Voorwaarden voor verdeling van zetels over groepen zijn:

      a. dat een of meer groepen een bijzondere, van die van andere groepen verschillende, sociaal- economische positie
      met specifieke belangen inneemt, respectievelijk innemen,

      b. dat zulks zich manifesteert in het bestaan van daarop gerichte, afzonderlijke organisaties, en

      c. dat het desbetreffende college hetzij ten aanzien van die specifieke belangen rechtstreeks een taak heeft,
      hetzij zich veelvuldig moet uitspreken over aangelegenheden waarbij de specifieke positie van de desbetreffende
      groep aan de orde is, dan wel aanzienlijke belangen die deze niet gemeen hebben met andere groepen welke worden
      vertegenwoordigd, in het geding zijn.
    url: https://wetten.overheid.nl/BWBR0011641/2001-01-28#Artikel18
  - number: '19'
    text: |-
      Ingeval alle representatieve organisaties van ondernemers onderscheidenlijk van werknemers die zich voor aanwijzing
      van bestuursleden hebben aangemeld, ingevolge [hoofdstuk 3][ref1] in aanmerking komen voor de benoeming van een of
      meer leden in een college in onderling overleg volledige overeenstemming bereiken over de zetelverdeling, geschiedt
      de toewijzing van zetels dienovereen- komstig.


      [ref1]: https://wetten.overheid.nl/BWBR0011641#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0011641/2001-01-28#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011641
        hoofdstuk: '3'
  - number: '20'
    text: |-
      Indien blijkt dat de zetelverdeling van een college niet overeenkomstig [artikel 19][ref1] kan plaatsvinden,
      worden de voor ondernemers onderscheidenlijk werknemers beschikbare zetels in het betrokken college tussen de
      aanwezige representatieve organisaties verdeeld overeenkomstig de verhouding tussen deze organisaties wat hun
      sociaal-economische grootte betreft; bij de organisaties van werknemers wordt daarbij hun ledental of dat van de
      aangesloten organisaties in het ressort van het desbetreffende college als maatstaf genomen; ten aanzien van de
      organisaties van ondernemers wordt het bepaalde in de tweede en derde zin van [artikel 9][ref2] overeenkomstig
      toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0011641#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0011641#Artikel9
    url: https://wetten.overheid.nl/BWBR0011641/2001-01-28#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0011641
        artikel: '19'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011641
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '21'
    text: |-
      De toewijzing van zetels aan organisaties van ondernemers onderscheidenlijk werknemers geschiedt met inachtneming
      van de volgende regels:

      a. eerst wordt het quotiënt bepaald van de sociaal-economische grootte, bedoeld in [artikel 20][ref1], van alle
      organisaties tezamen en het aantal zetels dat voor de vertegenwoordiging van de groep in het college beschikbaar
      is;

      b. vervolgens worden aan ieder van de organisaties zoveel zetels toegekend als het aantal malen (in hele getallen)
      dat dit quotiënt is begrepen in het getal dat de sociaal-economische grootte van de organisatie aangeeft.


      [ref1]: https://wetten.overheid.nl/BWBR0011641#Artikel20
    url: https://wetten.overheid.nl/BWBR0011641/2001-01-28#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0011641
        artikel: '20'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '22'
    text: |-
      De toewijzing van eventuele restzetels geschiedt met inachtneming van de volgende regels:

      a. voor de toewijzing van de na toepassing van [artikel 21][ref1] resterende zetels komen in beginsel ook
      organisaties in aanmerking waaraan op grond van dat artikel nog geen zetel is toegedeeld;

      b. voor de toedeling van restzetels wordt toegepast het stelsel van de grootste overschotten: voor iedere
      organisatie wordt het verschil bepaald tussen het getal dat zijn sociaal-economische grootte aangeeft en het
      product van het aantal in de eerste fase aan die organisatie toegewezen zetels en het in [artikel 21][ref2]
      bedoelde quotiënt;

      c. de restzetels worden vervolgens toegewezen aan de organisatie voor wie dit overschot het grootst is en zo
      vervolgens tot alle restzetels zijn toegewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0011641#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0011641#Artikel21
    url: https://wetten.overheid.nl/BWBR0011641/2001-01-28#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0011641
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011641
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '23'
    text: |-
      Representatieve organisaties van ondernemers onderscheidenlijk van werknemers kunnen verzoeken gezamenlijk te
      worden aangewezen voor het benoemen van een of meer leden. Daarbij worden zij voor de toepassing van de in de
      [artikelen 20 tot en met 22][ref1] opgenomen regels voor de zetelverdeling over organisaties behandeld als waren
      zij één organisatie, met dien verstande dat, indien en voorzover dit mogelijk is, bij de bepaling van de sociaal-
      economische grootte dubbeltellingen als gevolg van het feit dat bepaalde ondernemers of werknemers bij meer dan een
      van de organisaties zijn aangesloten, worden voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011641#Artikel20
    url: https://wetten.overheid.nl/BWBR0011641/2001-01-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0011641
        artikel: '20'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '24'
    text: Het SER-besluit Richtlijnen representativiteit organisaties wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011641/2001-01-28#Artikel24
  - number: '25'
    text: |-
      Deze verordening treedt in werking met ingang van de tweede dag na publicatie in het Verordeningenblad
      Bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0011641/2001-01-28#Artikel25
  - number: '26'
    text: 'Deze verordening wordt aangehaald als: Verordening representativiteit organisaties.'
    url: https://wetten.overheid.nl/BWBR0011641/2001-01-28#Artikel26
