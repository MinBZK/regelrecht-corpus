    text: |-
      Deze wet treedt in werking met ingang van 12 september 2025. Indien het Staatsblad waarin deze wet wordt geplaatst,
      wordt uitgegeven na 11 september 2025, treedt zij in werking met ingang van de dag na de datum van uitgifte van het
      Staatsblad waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0051796/2025-11-21#Artikel13
