preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is regels te stellen ter uitvoering van Verordening
    (EU) 2023/2854 van het Europees Parlement en de Raad van 13 december 2023 betreffende geharmoniseerde regels inzake
    eerlijke toegang tot en eerlijk gebruik van data en tot wijziging van Verordening (EU) 2017/2394 en Richtlijn (EU)
    2020/1828 (Dataverordening);

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0051796/2025-11-21#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *Autoriteit Consument en Markt:* Autoriteit Consument en Markt als bedoeld in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1];
        - *Autoriteit persoonsgegevens:* Autoriteit persoonsgegevens als bedoeld in
      [artikel 6, eerste lid, van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2];
        - *dataverordening:* [Verordening (EU) 2023/2854](32023R2854) van het Europees Parlement en de Raad van 13 december
      2023 betreffende geharmoniseerde regels inzake eerlijke toegang tot en eerlijk gebruik van data en tot wijziging
      van [Verordening (EU) 2017/2394](32017R2394) en [Richtlijn (EU) 2020/1828](32020L1828) (Dataverordening).


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Artikel6
    url: https://wetten.overheid.nl/BWBR0051796/2025-11-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0040940
        artikel: '6'
  - number: '2'
    text: |-
      1 De Autoriteit Consument en Markt certificeert op een verzoek als bedoeld in artikel 10, vijfde lid, van de
      dataverordening een orgaan als geschillenbeslechtingsorgaan voor ten hoogste vijf jaar.

      2 De Autoriteit Consument en Markt geeft uitvoering aan artikel 10, zesde lid, van de dataverordening.

      3 De Autoriteit Consument en Markt kan een beschikking tot certificering tot geschillenbeslechtingsorgaan intrekken
      indien het orgaan:

      a. niet langer voldoet aan de voorwaarden, bedoeld in artikel 10, vijfde lid, van de dataverordening; of

      b. niet voldoet aan artikel 10, tweede, vierde, zevende, achtste, negende of tiende lid, van de dataverordening.
    url: https://wetten.overheid.nl/BWBR0051796/2025-11-21#Artikel2
  - number: '3'
    text: |-
      1 De Autoriteit Consument en Markt is de bevoegde autoriteit, bedoeld in artikel 37, eerste lid, van de
      dataverordening voor de hoofdstukken II, met uitzondering van de artikelen 4, twaalfde lid, 5, zevende en achtste
      lid, en 6, tweede lid, onderdeel b, III, IV, artikel 20, hoofdstukken VI tot en met VIII, en artikel 37, elfde en
      twaalfde lid, van de dataverordening.

      2 Als bevoegde autoriteit heeft de Autoriteit Consument en Markt de taken en bevoegdheden, bedoeld in artikel 37,
      vijfde lid, onderdelen a tot en met i, van de dataverordening.

      3 De Autoriteit persoonsgegevens is de bevoegde autoriteit, bedoeld in artikel 37, eerste lid, van de
      dataverordening voor de artikelen 4, twaalfde lid, 5, zevende en achtste lid, en 6, tweede lid, onderdeel b, en
      hoofdstuk V, met uitzondering van artikel 20, van de dataverordening.

      4 Als bevoegde autoriteit heeft de Autoriteit persoonsgegevens de taken en bevoegdheden, bedoeld in artikel 37,
      vijfde lid, onderdelen a tot en met g en j, van de dataverordening. In afwijking in zoverre van de eerste volzin,
      is [artikel 14, eerste, vierde en vijfde lid van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1]
      van overeenkomstige toepassing voor zover het de verwerking van persoonsgegevens betreft.

      5 In afwijking van het eerste lid is de Autoriteit persoonsgegevens de bevoegde autoriteit, bedoeld in artikel 37,
      eerste lid, van de dataverordening voor artikel 6, eerste lid, van de dataverordening voor zover het de verwerking
      van persoonsgegevens betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Artikel14
    url: https://wetten.overheid.nl/BWBR0051796/2025-11-21#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0040940
        artikel: '14'
  - number: '4'
    text: De Autoriteit Consument en Markt is de datacoördinator, bedoeld in artikel 37, tweede lid, van de dataverordening.
    url: https://wetten.overheid.nl/BWBR0051796/2025-11-21#Artikel4
  - number: '5'
    text: |-
      1 Met het toezicht op de naleving van de hoofdstukken II, met uitzondering van de artikelen 4, twaalfde lid, 5,
      zevende en achtste lid, en 6, tweede lid, onderdeel b, III, IV, artikel 20, en hoofdstukken VI tot en met VIII, en
      artikel 37, elfde en twaalfde lid, van de dataverordening is belast de Autoriteit Consument en Markt.

      2 Met het toezicht op de naleving van de artikelen 4, twaalfde lid, 5, zevende en achtste lid, 6, tweede lid,
      onderdeel b, en hoofdstuk V, met uitzondering van artikel 20, van de dataverordening zijn belast de leden en
      buitengewone leden van de Autoriteit persoonsgegevens, de ambtenaren van het secretariaat van de Autoriteit
      persoonsgegevens, alsmede de bij besluit van de Autoriteit persoonsgegevens aangewezen personen.

      3 In afwijking van het eerste lid zijn met het toezicht op de naleving van artikel 6, eerste lid, van de
      dataverordening voor zover het de verwerking van persoonsgegevens betreft belast de leden en buitengewone leden van
      de Autoriteit persoonsgegevens, de ambtenaren van het secretariaat van de Autoriteit persoonsgegevens, alsmede de
      bij besluit van de Autoriteit persoonsgegevens aangewezen personen.

      4 Het eerste lid is niet van toepassing op inbreuken of inbreuken binnen de Unie als bedoeld in
      [artikel 1 van de Wet handhaving consumentenbescherming][ref1] ten aanzien van de bepalingen van de dataverordening
      genoemd in onderdeel a van de [bijlage bij die wet](onbekend).

      5 Het eerste en tweede lid zijn niet van toepassing ten aanzien van gedragingen van de Europese Commissie, de
      Europese Centrale Bank of organen van de Unie als bedoeld in artikel 2, onderdeel 27, van de dataverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0020586#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0051796/2025-11-21#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020586
        artikel: '1.1'
  - number: '6'
    text: |-
      1 De Autoriteit Consument en Markt en de Autoriteit persoonsgegevens zijn bevoegd om in het belang van een
      efficiënt en effectief toezicht op de dataverordening afspraken te maken en daartoe samenwerkingsprotocollen vast
      te stellen. Een samenwerkingsprotocol wordt bekendgemaakt in de Staatscourant.

      2 Onverminderd [artikel 19, tweede lid, van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1] en
      [artikel 7, derde lid, onderdeel a, van de Instellingswet Autoriteit Consument en Markt][ref2] zijn de Autoriteit
      Consument en Markt en de Autoriteit persoonsgegevens bevoegd uit eigen beweging en desgevraagd verplicht aan elkaar
      de gegevens te verstrekken die noodzakelijk zijn voor de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0033043#Artikel7
    url: https://wetten.overheid.nl/BWBR0051796/2025-11-21#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0040940
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0033043
        artikel: '7'
  - number: '7'
    text: |-
      1 De Autoriteit Consument en Markt is bevoegd om in het belang van een efficiënt en effectief toezicht op
      de dataverordening afspraken te maken met andere bevoegde autoriteiten als bedoeld in artikel 37, vijfde
      lid, onderdelen g en h, van de dataverordening en daartoe gezamenlijk met deze bevoegde autoriteiten
      samenwerkingsprotocollen vast te stellen. Een samenwerkingsprotocol wordt bekendgemaakt in de Staatscourant.

      2 Bij ministeriële regeling kunnen regels worden gesteld over het verstrekken van gegevens tussen de Autoriteit
      Consument en Markt en de bevoegde autoriteiten, bedoeld in het eerste lid, die noodzakelijk zijn voor de uitvoering
      van deze wet.
    url: https://wetten.overheid.nl/BWBR0051796/2025-11-21#Artikel7
  - number: '8'
    text: |-
      1 De Autoriteit Consument en Markt is ter handhaving van de artikelen 3, 4, eerste, tweede, vierde, vijfde, zesde,
      zevende, achtste, negende, tiende, elfde, dertiende en veertiende lid, 5, eerste, derde, vierde, vijfde, zesde,
      negende, tiende en elfde lid, 6, eerste lid, voor zover het niet de verwerking van persoonsgegevens betreft, en
      tweede lid, onderdelen a, c, d, e, f, g en h, 8, eerste, derde en vierde lid, 9, eerste, tweede, vierde en zevende
      lid, 10, derde lid, 11, eerste, tweede en vijfde lid, 20, eerste en tweede lid, 23, 25, eerste lid, tweede volzin,
      en vierde lid, 26, 27, 28, 29, eerste, tweede, derde, vierde, vijfde en zesde lid, 30, eerste, tweede, derde,
      vierde en vijfde lid, 31, derde lid, 32, eerste, derde, vierde en vijfde lid, 33, eerste lid, 34, tweede lid, 36,
      eerste en tweede lid, en 37, twaalfde lid, bevoegd tot oplegging van:

      a. een last onder bestuursdwang; of

      b. een bestuurlijke boete van ten hoogste het bedrag dat is vastgesteld voor de zesde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1] of, indien dat meer is, 10% van de jaaromzet van de
      overtreder in het voorgaande boekjaar in de Europese Unie.

      2 De Autoriteit persoonsgegevens is ter handhaving van de artikelen 4, twaalfde lid, 5, zevende en achtste lid, 6,
      eerste lid, voor zover het de verwerking van persoonsgegevens betreft, en tweede lid, onderdeel b, 14, 17, tweede
      lid, derde lid, eerste volzin, en vierde lid, laatste twee volzinnen, 18, eerste en vierde lid, 19, 21, tweede,
      derde, vierde en vijfde lid, en 22, tweede lid, bevoegd tot oplegging van:

      a. een last onder bestuursdwang; of

      b. een bestuurlijke boete van ten hoogste het bedrag, genoemd in artikel 40, vierde lid, van de dataverordening.

      3 De te betalen geldsom van een verbeurde dwangsom krachtens het tweede lid, onderdeel a, en de bestuurlijke boete,
      bedoeld in het tweede lid, onderdeel b, komt toe aan de Staat.

      4 Het eerste lid is niet van toepassing op inbreuken of inbreuken binnen de Unie als bedoeld in
      [artikel 1 van de Wet handhaving consumentenbescherming][ref2] ten aanzien van de bepalingen van de dataverordening
      genoemd in onderdeel a van de [bijlage bij die wet](onbekend).

      5 Het eerste en tweede lid zijn niet van toepassing ten aanzien van gedragingen van de Europese Commissie, de
      Europese Centrale Bank of organen van de Unie als bedoeld in artikel 2, onderdeel 27, van de dataverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0020586#Artikel1.1
