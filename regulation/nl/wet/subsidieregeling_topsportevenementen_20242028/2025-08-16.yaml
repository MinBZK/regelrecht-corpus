        artikel: '2'
  - number: '2'
    text: |-
      1 De Minister kan aan een nationale sportbond of een evenementenorganisator subsidie verstrekken voor de
      organisatie van een topsportevenement.

      2 Een nationale sportbond is een landelijke sportorganisatie die:

      a. de belangen van de aangesloten sporters of sportverenigingen behartigt;

      b. zich bezighoudt met het opleiden van trainers en coaches, talentontwikkeling, het organiseren van de nationale
      competities en wedstrijden, deelname aan internationale wedstrijden, en – voor zover van toepassing – uitzendingen
      naar multisportevenementen; en

      c. is erkend als vertegenwoordiger van zijn tak van sport en is aangesloten bij NOC*NSF en de Internationale
      Federatie van de betreffende tak van sport, tenzij het een nieuwe tak van sport betreft, waarvan de sportbond nog
      niet is aangesloten bij NOC*NSF

      3 De Minister verstrekt per tak van sport subsidie voor een topsportevenement met als deelnemers:

      a. mannen in de categorie senioren zonder handicap;

      b. vrouwen in de categorie senioren zonder handicap;

      c. mannen in de categorie talenten zonder handicap;

      d. vrouwen in de categorie talenten zonder handicap;

      e. mannen in de categorie senioren met een handicap;

      f. vrouwen in de categorie senioren met een handicap;

      g. mannen in de categorie talenten met een handicap;

      h. vrouwen in de categorie talenten met een handicap.

      4 In afwijking van het derde lid kan de Minister vaker dan eens per drie jaar subsidie verstrekken voor een
      Olympisch dan wel een Paralympisch kwalificatietoernooi waarbij deelnemers zich direct kunnen kwalificeren voor
      Olympische Spelen.

      5 De activiteit, bedoeld in het eerste lid, wordt aangemerkt als dienst van algemeen economisch belang.
    url: https://wetten.overheid.nl/BWBR0049525/2025-08-16#Artikel2
  - number: '3'
    text: |-
      Een topsportevenement is een evenement dat:

      a. internationaal van aard is;

      b. hoofdzakelijk in Nederland georganiseerd wordt;

      c. niet jaarlijks in Nederland georganiseerd wordt;

      d. gericht is op:

      1°. talenten: sporters met of zonder handicap die behoren tot de oudste leeftijdscategorie waarvoor
      een internationaal jeugd topsportevenement wordt georganiseerd, zoals een Europees kampioenschap of
      wereldkampioenschap; of

      2°. senioren: sporters met of zonder handicap die op dat moment Nederland op Europees of mondiaal topniveau
      vertegenwoordigen;

      e. gericht is op:

      1°. een tak van sport die is opgenomen in de lijst indeling topsportdisciplines 2025–2028 gehanteerd door NOC*NSF;
      of

      2°. het leveren van een bijdrage aan de ontwikkeling van een nieuwe tak van sport of nieuwe vormen van een
      bestaande tak van sport;

      f. maatschappelijke meerwaarde heeft die is gelegen in:

      1°. het bieden van optimale omstandigheden voor deelnemers zodat zij kunnen inspireren door eerlijk, integer en
      zichtbaar te presteren;

      2°. het efficiënt en effectief organiseren;

      3°. het vergroten van het bereik voor diverse doelgroepen;

      4°. zo duurzaam en klimaatneutraal mogelijk organiseren;

      5°. inclusief en toegankelijk zijn; en

      6°. het aandacht hebben voor de gezondheid en veiligheid van deelnemers, medewerkers en toeschouwers;

      g. wordt georganiseerd in afstemming en samenhang met in ieder geval de desbetreffende nationale sportbond en een
      of meer gemeenten of provincies; en

      h. is aangemeld bij de topsportevenementenmonitor op de website van het CIT en op de evenementenkalender van het
      CIT is geplaatst.
    url: https://wetten.overheid.nl/BWBR0049525/2025-08-16#Artikel3
  - number: '4'
    text: |-
      1 De subsidieverlening wordt geweigerd indien het gaat om een topsportevenement:

      a. dat deel uitmaakt van een jaarlijkse reeks;

      b. waarvan de eigendomsrechten niet liggen bij een internationale sportfederatie die erkend is door het
      Internationaal Olympisch Comité of het Internationaal Paralympisch Comité;

      c. waarbij op voorhand vaststaat dat er geen Nederlands team of Nederlandse individuele deelnemers in actie komen;

      d. dat aanvangt voordat drie jaar zijn verstreken gerekend vanaf de startdatum van het voorgaande evenement voor
      dezelfde categorie deelnemers in dezelfde tak van sport, genoemd in artikel 2, derde lid, onder a tot en met h; of

      e. dat niet past binnen het topsportbeleid van de betreffende nationale sportbond.

      2 In afwijking van het eerste lid, onderdeel d, kan de Minister op verzoek van de subsidieontvanger toestemming
      verlenen om tot 31 dagen voor het verstrijken van de genoemde termijn met het evenement te starten.

      3 De subsidie wordt uitsluitend verstrekt als de aanvrager met de Staat een overeenkomst sluit waarbij de Staat
      de aanvrager belast met en de aanvrager zich verplicht tot het verrichten van de dienst van algemeen economisch
      belang.
    url: https://wetten.overheid.nl/BWBR0049525/2025-08-16#Artikel4
  - number: '5'
    text: |-
      1 Het subsidieplafond bestaat uit het bedrag van de subsidies gezamenlijk dat ten laste van enig kalenderjaar wordt
      of zal worden uitbetaald op basis van een verlening of vaststelling van een subsidie en wordt in aanmerking genomen
      voor alle jaren waarop de uitbetaling van een te verstrekken subsidie betrekking heeft.

      2 Het subsidieplafond bedraagt voor het kalenderjaar 2024 € 4,7 miljoen.

      3 Het subsidieplafond bedraagt:

      a. voor de kalenderjaren 2025 en 2026: jaarlijks € 10,5 miljoen;

      b. voor het kalenderjaar 2027: € 11 miljoen; en

      c. voor het kalenderjaar 2028: € 10,3 miljoen.

      4 De Minister verdeelt het ingevolge het subsidieplafond beschikbare bedrag op volgorde
      van binnenkomst van de aanvragen, met dien verstande dat wanneer de aanvrager krachtens
      [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad de aanvraag aan te vullen, de dag
      waarop de aanvraag is aangevuld, met betrekking tot de verdeling, als datum van ontvangst geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0049525/2025-08-16#Artikel5
