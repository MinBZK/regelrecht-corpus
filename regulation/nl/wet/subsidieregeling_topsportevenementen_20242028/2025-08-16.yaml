  - number: '6'
    text: |-
      De volgende kosten komen niet voor subsidie in aanmerking:

      a. start- en prijzengeld;

      b. kosten voor sponsoring;

      c. kosten voor hospitality.
    url: https://wetten.overheid.nl/BWBR0049525/2025-08-16#Artikel6
  - number: '7'
    text: |-
      De subsidie bedraagt voor de organisatie van een topsportevenement met als categorie deelnemers:

      a. talenten zonder handicap: ten hoogste 50% van de totale subsidiabele kosten, tot ten hoogste € 2 miljoen;

      b. senioren zonder handicap: ten hoogste 25% van de totale subsidiabele kosten, tot ten hoogste € 2,5 miljoen;

      c. talenten met een handicap: ten hoogste 50% van de totale subsidiabele kosten, tot ten hoogste € 2,5 miljoen;

      d. senioren met een handicap: ten hoogste 50% van de totale subsidiabele kosten, tot ten hoogste € 3 miljoen;

      e. een combinatie van talenten zonder handicap met talenten met een handicap: ten hoogste 50% van de totale
      subsidiabele kosten, tot ten hoogste € 2,5 miljoen;

      f. een combinatie van senioren zonder handicap met talenten: ten hoogste 25% van de subsidiabele kosten voor het
      deel voor senioren zonder handicap en ten hoogste 50% van de subsidiabele kosten voor het deel voor talenten, tot
      ten hoogste € 2,5 miljoen;

      g. een combinatie anders dan de in de onderdelen e en f genoemde: ten hoogste 25% van de subsidiabele kosten
      voor het deel voor senioren zonder een handicap en ten hoogste 50% van de subsidiabele kosten voor het deel voor
      senioren met een handicap en talenten, tot ten hoogste € 3 miljoen.
    url: https://wetten.overheid.nl/BWBR0049525/2025-08-16#Artikel7
  - number: '8'
    text: |-
      1 Een aanvraag wordt maximaal zesendertig maanden vóór de aanvang van het topsportevenement ontvangen.

      2 Een aanvraag wordt minimaal zes maanden vóór de aanvang van het topsportevenement ontvangen.

      3 Het tweede lid is niet van toepassing op een aanvraag voor een Olympisch of Paralympisch kwalificatietoernooi.
    url: https://wetten.overheid.nl/BWBR0049525/2025-08-16#Artikel8
  - number: '9'
    text: |-
      1 Voor de aanvraag wordt een door de Minister vastgesteld formulier gebruikt.

      2 In aanvulling op [artikel 3.3 van de Kaderregeling subsidies OCW, SZW en VWS][ref1] gaat de aanvraag vergezeld
      van een plan van aanpak, waarin wordt ingegaan op:

      a. de organisatorische haalbaarheid van het topsportevenement op een zo maatschappelijk verantwoord mogelijke
      wijze, waarbij in elk geval wordt toegelicht:

      1°. doelstellingen van het evenement;

      2°. doelstellingen van stakeholders en draagvlak;

      3°. locatie- en datakeuze;

      4°. het evenement, meer specifiek: organisatievorm, rechtspersoon, opzet toernooi en wedstrijdschema, verwachte
      bezoekersaantallen, benodigde logistieke inzet voor het aanpassen of bouwen van accommodatie, en benodigd eigen of
      ingehuurd personeel;

      5°. weergave van de organisatiestructuur;

      6°. analyse van verwachte media-aandacht en bereik; en

      7°. kritische succesfactoren.

      b. de financiële haalbaarheid van het topsportevenement, waarbij wordt vermeld en toegelicht welke acties de
      aanvrager heeft ondernomen om de kosten voor de organisatie van het topsportevenement te dekken vanuit een eigen
      bijdrage of een bijdrage van derden;

      c. de maatschappelijke waarde, met een beschrijving van de relatie met de Nationale Topsportevenementen
      Strategie 2021–2030 en de manier waarop het topsportevenement gebruikt wordt voor maatschappelijke of economische
      vraagstukken, en een toelichting op de onderdelen, bedoeld in [artikel 3, onder f][ref2]; en

      d. hoe het evenement past in het strategisch kader topsport 2032;

      e. hoe het evenement past in het topsportbeleid van de nationale sportbond, onderbouwd met actuele documentatie van
      de sportbond.

      3 In aanvulling op [artikel 3.3 van de Kaderregeling subsidies OCW, SZW en VWS][ref3] gaat de aanvraag vergezeld
      van een door de aanvrager ondertekende overeenkomst als bedoeld in artikel 4, tweede lid.

      4 In aanvulling op [artikel 3.5 van de Kaderregeling subsidies OCW, SZW en VWS][ref4] wordt voor de begroting een
      door de Minister vastgesteld model gebruikt en gaat deze vergezeld van:

      a. een risicoanalyse; en

      b. een steunverklaring van de bij het evenement betrokken partijen, waaronder de gemeente of provincie en de
      nationale sportbond.


