  - number: '10'
    text: |-
      1 De subsidieontvanger geeft twee maanden voor de start van het topsportevenement schriftelijk inzage in de
      begroting van dat moment.

      2 De subsidieontvanger is bij de organisatie van een topsportevenement waarvoor subsidie wordt verleend
      verantwoordelijk voor:

      a. het naleven van de World Anti Doping Code en het Nationaal Doping Reglement en het mogelijk maken van het
      houden van dopingcontroles, waaronder in ieder geval het realiseren van de toegang voor dopingcontroleurs, een
      dopingcontrolestation en voldoende chaperonnes voor toezicht op de deelnemers;

      b. adequate, acute medische zorg voor deelnemers, medewerkers en toeschouwers;

      c. de toegang van de accommodaties van het topsportevenement voor mensen met een lichamelijke of visuele handicap,
      doven en slechthorenden; en

      d. het aanleveren van de door de Minister gevraagde gegevens over het topsportevenement voor de monitor
      topsportevenementen van het CIT.
    url: https://wetten.overheid.nl/BWBR0049525/2025-08-16#Artikel10
  - number: '11'
    text: |-
      De Minister kan een of meer bepalingen van deze regeling buiten toepassing laten of daarvan afwijken voor
      zover toepassing gelet op het belang dat de desbetreffende bepaling beoogt te beschermen, zal leiden tot een
      onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0049525/2025-08-16#Artikel11
  - number: '13'
    text: |-
      1 Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst.

      2 Deze regeling vervalt met ingang van 1 januari 2029, met dien verstande dat deze van toepassing blijft op
      subsidies die voor die datum zijn verleend of vastgesteld.
    url: https://wetten.overheid.nl/BWBR0049525/2025-08-16#Artikel13
