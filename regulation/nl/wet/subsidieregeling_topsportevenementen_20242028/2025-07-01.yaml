---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: subsidieregeling_topsportevenementen_20242028
regulatory_layer: WET
publication_date: '2024-04-03'
valid_from: '2025-07-01'
bwb_id: BWBR0049525
url: https://wetten.overheid.nl/BWBR0049525/2025-07-01
preamble:
  text: |-
    Gelet op de artikelen 3 en 5 van de Kaderwet VWS-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *CIT:* Coördinatie- en Informatiepunt Topsportevenementen;
        - *dienst van algemeen economisch belang:* dienst als bedoeld in artikel 106, tweede lid, van het Verdrag
      betreffende de werking van de Europese Unie;
        - *evenementenorganisator:* privaatrechtelijke rechtspersoon die verantwoordelijk is voor het organiseren van
      topsportevenementen;
        - *minister:* Minister van Volksgezondheid, Welzijn en Sport;
        - *nationale sportbond:* organisatie die voldoet aan de voorwaarden van [artikel 2, tweede lid][ref1];
        - *Nationale Topsportevenementen Strategie 2021–2030:* gezamenlijke evenementenstrategie, ontwikkeld door de
      Minister, NOC*NSF en Vereniging Sport en Gemeenten;
        - *strategisch kader topsport 2032:* gezamenlijke topsportstrategie, ontwikkeld door de Minister, NOC*NSF en
      Vereniging Sport en Gemeenten;
        - *topsportevenement:* samenhangend geheel van wedstrijden in een bepaalde periode in een tak of takken van sport
      die kan of kunnen bijdragen aan het nationale topsportbeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0049525#Artikel2
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0049525
        artikel: '2'
  - number: '2.1'
    text: |-
      De Minister kan aan een nationale sportbond of een evenementenorganisator subsidie verstrekken voor de organisatie
      van een topsportevenement.
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel2
  - number: '2.2'
    text: 'Een nationale sportbond is een landelijke sportorganisatie die:'
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel2
  - number: 2.2.a
    text: de belangen van de aangesloten sporters of sportverenigingen behartigt;
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel2
  - number: 2.2.b
    text: |-
      zich bezighoudt met het opleiden van trainers en coaches, talentontwikkeling, het organiseren van de nationale
      competities en wedstrijden, deelname aan internationale wedstrijden, en – voor zover van toepassing – uitzendingen
      naar multisportevenementen; en
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel2
  - number: 2.2.c
    text: |-
      is erkend als vertegenwoordiger van zijn tak van sport en is aangesloten bij NOC*NSF en de Internationale Federatie
      van de betreffende tak van sport, tenzij het een nieuwe tak van sport betreft, waarvan de sportbond nog niet is
      aangesloten bij NOC*NSF
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel2
  - number: '2.3'
    text: |-
      De Minister verstrekt per tak van sport hoogstens eens per drie jaar subsidie voor een topsportevenement met als
      deelnemers:
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel2
  - number: 2.3.a
    text: mannen in de categorie senioren zonder handicap;
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel2
  - number: 2.3.b
    text: vrouwen in de categorie senioren zonder handicap;
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel2
  - number: 2.3.c
    text: mannen in de categorie talenten zonder handicap;
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel2
  - number: 2.3.d
    text: vrouwen in de categorie talenten zonder handicap;
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel2
  - number: 2.3.e
    text: mannen in de categorie senioren met een handicap;
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel2
  - number: 2.3.f
    text: vrouwen in de categorie senioren met een handicap;
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel2
  - number: 2.3.g
    text: mannen in de categorie talenten met een handicap;
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel2
  - number: 2.3.h
    text: vrouwen in de categorie talenten met een handicap.
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel2
  - number: '2.4'
    text: |-
      In afwijking van het derde lid kan de Minister vaker dan eens per drie jaar subsidie verstrekken voor een Olympisch
      dan wel een Paralympisch kwalificatietoernooi waarbij deelnemers zich direct kunnen kwalificeren voor Olympische
      Spelen.
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel2
  - number: '2.5'
    text: De activiteit, bedoeld in het eerste lid, wordt aangemerkt als dienst van algemeen economisch belang.
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel2
  - number: '3'
    text: 'Een topsportevenement is een evenement dat:'
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel3
  - number: 3.a
    text: internationaal van aard is;
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel3
  - number: 3.b
    text: hoofdzakelijk in Nederland georganiseerd wordt;
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel3
  - number: 3.c
    text: niet jaarlijks in Nederland georganiseerd wordt;
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel3
  - number: 3.d
    text: 'gericht is op:'
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel3
  - number: 3.d.1°
    text: |-
      talenten: sporters met of zonder handicap die behoren tot de oudste leeftijdscategorie waarvoor een internationaal
      jeugd topsportevenement wordt georganiseerd, zoals een Europees kampioenschap of wereldkampioenschap; of
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel3
  - number: 3.d.2°
    text: |-
      senioren: sporters met of zonder handicap die op dat moment Nederland op Europees of mondiaal topniveau
      vertegenwoordigen;
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel3
  - number: 3.e
    text: 'gericht is op:'
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel3
  - number: 3.e.1°
    text: |-
      een tak van sport die is opgenomen in de lijst topsport- en internationale wedstrijdsportdisciplines gehanteerd
      door NOC*NSF; of
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel3
  - number: 3.e.2°
    text: |-
      het leveren van een bijdrage aan de ontwikkeling van een nieuwe tak van sport of nieuwe vormen van een bestaande
      tak van sport;
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel3
  - number: 3.f
    text: 'maatschappelijke meerwaarde heeft die is gelegen in:'
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel3
  - number: 3.f.1°
    text: |-
      het bieden van optimale omstandigheden voor deelnemers zodat zij kunnen inspireren door eerlijk, integer en
      zichtbaar te presteren;
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel3
  - number: 3.f.2°
    text: het efficiënt en effectief organiseren;
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel3
  - number: 3.f.3°
    text: het vergroten van het bereik voor diverse doelgroepen;
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel3
  - number: 3.f.4°
    text: zo duurzaam en klimaatneutraal mogelijk organiseren;
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel3
  - number: 3.f.5°
    text: inclusief en toegankelijk zijn; en
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel3
  - number: 3.f.6°
    text: het aandacht hebben voor de gezondheid en veiligheid van deelnemers, medewerkers en toeschouwers;
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel3
  - number: 3.g
    text: |-
      wordt georganiseerd in afstemming en samenhang met in ieder geval de desbetreffende nationale sportbond en een of
      meer gemeenten of provincies; en
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel3
  - number: 3.h
    text: |-
      is aangemeld bij de topsportevenementenmonitor op de website van het CIT en op de evenementenkalender van het CIT
      is geplaatst.
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel3
  - number: '4.1'
    text: 'De subsidieverlening wordt geweigerd indien het gaat om een topsportevenement:'
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel4
  - number: 4.1.a
    text: dat deel uitmaakt van een jaarlijkse reeks;
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel4
  - number: 4.1.b
    text: |-
      waarvan de eigendomsrechten niet liggen bij een internationale sportfederatie die erkend is door het Internationaal
      Olympisch Comité of het Internationaal Paralympisch Comité; of
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel4
  - number: 4.1.c
    text: waarbij op voorhand vaststaat dat er geen Nederlands team of Nederlandse individuele deelnemers in actie komen.
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel4
  - number: '4.2'
    text: |-
      De subsidie wordt uitsluitend verstrekt als de aanvrager met de Staat een overeenkomst sluit waarbij de Staat
      de aanvrager belast met en de aanvrager zich verplicht tot het verrichten van de dienst van algemeen economisch
      belang.
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel4
  - number: '5.1'
    text: |-
      Het subsidieplafond bestaat uit het bedrag van de subsidies gezamenlijk dat ten laste van enig kalenderjaar wordt
      of zal worden uitbetaald op basis van een verlening of vaststelling van een subsidie en wordt in aanmerking genomen
      voor alle jaren waarop de uitbetaling van een te verstrekken subsidie betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel5
  - number: '5.2'
    text: Het subsidieplafond bedraagt voor het kalenderjaar 2024 € 4,7 miljoen.
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel5
  - number: '5.3'
    text: Het subsidieplafond bedraagt voor de kalenderjaren 2025 tot en met 2028 jaarlijks € 9,1 miljoen.
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel5
  - number: '5.4'
    text: |-
      De Minister verdeelt het ingevolge het subsidieplafond beschikbare bedrag op volgorde
      van binnenkomst van de aanvragen, met dien verstande dat wanneer de aanvrager krachtens
      [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad de aanvraag aan te vullen, de dag
      waarop de aanvraag is aangevuld, met betrekking tot de verdeling, als datum van ontvangst geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '6'
    text: 'De volgende kosten komen niet voor subsidie in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel6
  - number: 6.a
    text: start- en prijzengeld;
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel6
  - number: 6.b
    text: kosten voor sponsoring;
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel6
  - number: 6.c
    text: kosten voor hospitality.
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel6
  - number: '7'
    text: 'De subsidie bedraagt voor de organisatie van een topsportevenement met als deelnemers:'
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel7
  - number: 7.a
    text: 'senioren zonder handicap: ten hoogste 25% van de totale subsidiabele kosten, tot ten hoogste € 2,5 miljoen;'
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel7
  - number: 7.b
    text: 'talenten zonder handicap: ten hoogste 50% van de totale subsidiabele kosten, tot ten hoogste € 2 miljoen;'
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel7
  - number: 7.c
    text: |-
      talenten of senioren met een handicap: ten hoogste 50% van de totale subsidiabele kosten, tot ten hoogste € 3
      miljoen;
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel7
  - number: 7.d
    text: |-
      zowel talenten met een handicap als talenten zonder een handicap: ten hoogste 50% van de totale subsidiabele
      kosten, tot ten hoogste € 2,5 miljoen; of
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel7
  - number: 7.e
    text: |-
      zowel senioren met een handicap als senioren zonder een handicap: ten hoogste 50% van de subsidiabele kosten voor
      het deel voor senioren met een handicap en ten hoogste 25% van de subsidiabele kosten voor het deel voor senioren
      zonder een handicap, tot ten hoogste € 3 miljoen.
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel7
  - number: '8.1'
    text: Een aanvraag wordt maximaal zesendertig maanden vóór de aanvang van het topsportevenement ontvangen.
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel8
  - number: '8.2'
    text: Een aanvraag wordt minimaal zes maanden vóór de aanvang van het topsportevenement ontvangen.
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel8
  - number: '8.3'
    text: Het tweede lid is niet van toepassing op een aanvraag voor een Olympisch of Paralympisch kwalificatietoernooi.
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel8
  - number: '9.1'
    text: Voor de aanvraag wordt een door de Minister vastgesteld formulier gebruikt.
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel9
  - number: '9.2'
    text: |-
      In aanvulling op [artikel 3.3 van de Kaderregeling subsidies OCW, SZW en VWS][ref1] gaat de aanvraag vergezeld van
      een plan van aanpak, waarin wordt ingegaan op:


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel3
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0037603
        artikel: '3'
  - number: 9.2.a
    text: |-
      de organisatorische haalbaarheid van het topsportevenement op een zo maatschappelijk verantwoord mogelijke wijze,
      waarbij in elk geval wordt toegelicht:
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel9
  - number: 9.2.a.1°
    text: doelstellingen van het evenement;
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel9
  - number: 9.2.a.2°
    text: doelstellingen van stakeholders en draagvlak;
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel9
  - number: 9.2.a.3°
    text: locatie- en datakeuze;
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel9
  - number: 9.2.a.4°
    text: |-
      het evenement, meer specifiek: organisatievorm, rechtspersoon, opzet toernooi en wedstrijdschema, verwachte
      bezoekersaantallen, benodigde logistieke inzet voor het aanpassen of bouwen van accommodatie, en benodigd eigen of
      ingehuurd personeel;
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel9
  - number: 9.2.a.5°
    text: weergave van de organisatiestructuur;
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel9
  - number: 9.2.a.6°
    text: analyse van verwachte media-aandacht en bereik; en
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel9
  - number: 9.2.a.7°
    text: kritische succesfactoren.
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel9
  - number: 9.2.b
    text: |-
      de financiële haalbaarheid van het topsportevenement, waarbij wordt vermeld en toegelicht welke acties de aanvrager
      heeft ondernomen om de kosten voor de organisatie van het topsportevenement te dekken vanuit een eigen bijdrage of
      een bijdrage van derden;
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel9
  - number: 9.2.c
    text: |-
      de maatschappelijke waarde, met een beschrijving van de relatie met de Nationale Topsportevenementen Strategie
      2021–2030 en de manier waarop het topsportevenement gebruikt wordt voor maatschappelijke of economische
      vraagstukken, en een toelichting op de onderdelen, bedoeld in [artikel 3, onder f][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0049525#Artikel3
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0049525
        artikel: '3'
  - number: 9.2.d
    text: hoe het evenement past in het strategisch kader topsport 2032 en in het topsportbeleid van de nationale sportbond.
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel9
  - number: '9.3'
    text: |-
      In aanvulling op [artikel 3.3 van de Kaderregeling subsidies OCW, SZW en VWS][ref1] gaat de aanvraag vergezeld van
      een door de aanvrager ondertekende overeenkomst als bedoeld in artikel 4, tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel3
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0037603
        artikel: '3'
  - number: '9.4'
    text: |-
      In aanvulling op [artikel 3.5 van de Kaderregeling subsidies OCW, SZW en VWS][ref1] wordt voor de begroting een
      door de Minister vastgesteld model gebruikt en gaat deze vergezeld van:


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel3
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0037603
        artikel: '3'
  - number: 9.4.a
    text: een risicoanalyse; en
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel9
  - number: 9.4.b
    text: |-
      een steunverklaring van de bij het evenement betrokken partijen, waaronder de gemeente of provincie en de nationale
      sportbond.
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel9
  - number: '10.1'
    text: |-
      De subsidieontvanger geeft twee maanden voor de start van het topsportevenement schriftelijk inzage in de begroting
      van dat moment.
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel10
  - number: '10.2'
    text: |-
      De subsidieontvanger is bij de organisatie van een topsportevenement waarvoor subsidie wordt verleend
      verantwoordelijk voor:
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel10
  - number: 10.2.a
    text: |-
      het naleven van de World Anti Doping Code en het Nationaal Doping Reglement en het mogelijk maken van het
      houden van dopingcontroles, waaronder in ieder geval het realiseren van de toegang voor dopingcontroleurs, een
      dopingcontrolestation en voldoende chaperonnes voor toezicht op de deelnemers;
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel10
  - number: 10.2.b
    text: adequate, acute medische zorg voor deelnemers, medewerkers en toeschouwers;
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel10
  - number: 10.2.c
    text: |-
      de toegang van de accommodaties van het topsportevenement voor mensen met een lichamelijke of visuele handicap,
      doven en slechthorenden; en
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel10
  - number: 10.2.d
    text: |-
      het aanleveren van de door de Minister gevraagde gegevens over het topsportevenement voor de monitor
      topsportevenementen van het CIT.
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel10
  - number: '11'
    text: |-
      De Minister kan een of meer bepalingen van deze regeling buiten toepassing laten of daarvan afwijken voor
      zover toepassing gelet op het belang dat de desbetreffende bepaling beoogt te beschermen, zal leiden tot een
      onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel11
  - number: '13.1'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel13
  - number: '13.2'
    text: |-
      Deze regeling vervalt met ingang van 1 januari 2029, met dien verstande dat deze van toepassing blijft op subsidies
      die voor die datum zijn verleend of vastgesteld.
    url: https://wetten.overheid.nl/BWBR0049525/2025-07-01#Artikel13
  - number: 13a
    text: |-
      Op aanvragen tot subsidieverlening die zijn ingediend voor 1 januari 2024, blijft de
      [Subsidieregeling topsportevenementen 2021–2023][ref1] van toepassing.


