  - number: '2'
    text: Er is een Adviescollege Deskundigheid Financiële Dienstverlening.
    url: https://wetten.overheid.nl/BWBR0018902/2005-10-26#Artikel2
  - number: '3'
    text: |-
      1 Het College heeft tot taak de minister op verzoek of ambtshalve te adviseren over:

      a. de vaststelling van de toetstermen voor de examens die leiden tot een diploma waarmee een financiële
      dienstverlener kan aantonen dat de werknemers die zich onder zijn verantwoordelijkheid rechtstreeks bezighouden
      met financiële dienstverlening voldoende deskundig zijn en dat de feitelijk leidinggevenden over voldoende
      vakbekwaamheid beschikken in de zin van [artikel 27, tweede lid, van de Wfd][ref1];

      b. de vaststelling van de toetstermen voor permanente educatie, waaraan de houders van een diploma moeten blijven
      voldoen en de wijze waarop dat kan worden aangetoond;

      c. de toewijzing of afwijzing van een aanvraag van een exameninstituut voor erkenning om diploma’s als bedoeld
      onder a te mogen afgeven of de intrekking van een dergelijke erkenning;

      d. de aanwijzing van certificaten, verklaringen van vakbekwaamheid en diploma’s die niet door een
      erkend exameninstituut als bedoeld onder b zijn afgegeven en die op grond van het bij of krachtens de
      [Wfd ][ref2]vastgestelde overgangsrecht de onder a bedoelde werking hebben.

      2 Op verzoek van de minister of de toezichthouder, bedoeld in [artikel 1, onderdeel cc, van de Wfd][ref3]
      adviseert het College over nader te specificeren onderwerpen die verband houden met de in het eerste lid genoemde
      adviestaken.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0018329
      [ref3]: https://wetten.overheid.nl/BWBR0018329#Artikel1
    url: https://wetten.overheid.nl/BWBR0018902/2005-10-26#Artikel3
