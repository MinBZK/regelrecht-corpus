    text: |-
      In dit besluit wordt verstaan onder:

      a. College: het Adviescollege Deskundigheid Financiële Dienstverlening, bedoeld in [artikel 2][ref1];

      b. minister: de Minister van Financiën;

      c. Wfd: de [Wet financiële dienstverlening][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018902#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018329
