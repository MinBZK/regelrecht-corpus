  - number: '4'
    text: |-
      1 Het College bestaat uit een voorzitter en maximaal vier leden.

      2 Het College wordt bij de uitvoering van zijn taken ondersteund door een secretariaat en een aantal door het
      College te bepalen werkgroepen.

      3 De minister benoemt, na voordracht van het College, de voorzitter en leden van het College.
    url: https://wetten.overheid.nl/BWBR0018902/2005-10-26#Artikel4
  - number: '5'
    text: |-
      De leden van het College worden benoemd voor een termijn van drie jaar en zijn eenmalig herbenoembaar voor een
      nieuwe termijn van drie jaar.
    url: https://wetten.overheid.nl/BWBR0018902/2005-10-26#Artikel5
  - number: '6'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0018902/2005-10-26#Artikel6
