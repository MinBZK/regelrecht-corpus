  - number: V
    text: |-
      1 De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.

      2 [Artikel I, onderdeel A][ref1], werkt terug tot en met 6 juli 2001.

      3 De [artikelen I, onderdelen B, O, Q, S, U, W en X][ref2], [II, onderdelen A en B][ref3], en [IV][ref4] werken
      terug tot en met 1 januari 2003.

      4 [Artikel I, onderdeel V][ref5], werkt terug tot en met 1 januari 1998, met uitzondering van de hoeveelheid
      fosfaat, onderscheidenlijk stikstof die voor de diercategorie pasgeboren biggen is opgenomen in de tabel, genoemd
      in onderdeel a, onderscheidenlijk onderdeel b.

      5 [Artikel II, onderdelen I en J][ref6], werkt terug tot en met 1 januari 2000.


