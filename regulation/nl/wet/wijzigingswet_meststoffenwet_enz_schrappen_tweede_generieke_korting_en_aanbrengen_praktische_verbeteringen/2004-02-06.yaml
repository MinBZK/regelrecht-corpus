preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om in de Meststoffenwet enkele praktische verbeteringen
    aan te brengen, om de belemmeringen in die wet en de Wet herstructurering varkenshouderij voor samenvoegen van
    bedrijven weg te nemen en om in de Wet herstructurering varkenshouderij de tweede generieke korting te schrappen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0016059/2004-02-06#ArtikelAanhef
articles:
  - number: III
    text: |-
      1 Indien toepassing van [artikel I, onderdeel V][ref1], voor de jaren 1998 tot en met 2002 leidt tot een lagere
      belastbare hoeveelheid fosfaat, onderscheidenlijk stikstof, kan de aangifte of de naheffingsaanslag door de
      inspecteur worden herzien bij voor bezwaar vatbare beschikking.

      2 De in het eerste lid bedoelde herziening kan worden bepaald op basis van het gemiddelde aantal in het
      desbetreffende kalenderjaar op het bedrijf gehouden varkens van de onderscheiden diercategorieën, genoemd
      in [bijlage A bij de Meststoffenwet][ref2], en op basis van bij ministeriële regeling vast te stellen
      correctiefactoren, uitgedrukt in kilogrammen fosfaat, onderscheidenlijk stikstof.


      [ref1]: https://wetten.overheid.nl/BWBR0016059#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0004054
