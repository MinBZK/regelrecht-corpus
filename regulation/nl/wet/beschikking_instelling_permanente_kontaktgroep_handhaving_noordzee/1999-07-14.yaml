$id: beschikking_instelling_permanente_kontaktgroep_handhaving_noordzee
regulatory_layer: WET
publication_date: '2006-11-23'
valid_from: '1999-07-14'
bwb_id: BWBR0008401
url: https://wetten.overheid.nl/BWBR0008401/1999-07-14
preamble:
  text: |-
    handelende in overeenstemming met de Ministers van Binnenlandse Zaken, Defensie, Financiën, Justitie, en van
    Landbouw, Natuurbeheer en Visserij;

    Overwegende dat een geïntegreerde beleidsmatige aansturing van de Kustwacht, voor wat betreft de handhaving
    van wettelijke voorschriften op de Noordzee, het best kan geschieden door een in omvang beperkt orgaan dat is
    samengesteld uit vertegenwoordigers van de gezamenlijk voor de Kustwacht verantwoordelijke Ministers;

    Gezien artikel 16, eerste lid, van de Overeenkomst Voor De Kustwacht 1995, d.d. 1 juni 1995.

    Besluit:
  url: https://wetten.overheid.nl/BWBR0008401/1999-07-14#ArtikelAanhef
articles:
  - number: '1'
    text: 'Er is een ’Permanente Kontaktgroep Handhaving Noordzee’, hierna te noemen: de PKHN.'
    url: https://wetten.overheid.nl/BWBR0008401/1999-07-14#Artikel1
  - number: '2'
    text: |-
      1 De PKHN heeft tot taak: de beleidsmatige aansturing van de Kustwacht voor wat betreft de handhaving
      van wettelijke voorschriften op de Noordzee, inclusief daarop gebaseerde besluiten met betrekking tot de
      resultaatsgebieden aangegeven in [artikel 15, vijfde lid][ref1], van de Overeenkomst Voor de Kustwacht 1995, d.d. 1
      juni 1995, verder te noemen: de Overeenkomst.

      2 De PKHN verricht alle werkzaamheden die nodig zijn voor het ontwikkelen, vaststellen en evalueren van het
      maritieme handhavingsbeleid met betrekking tot de in het eerste lid bedoelde resultaatsgebieden.


      [ref1]: https://wetten.overheid.nl/BWBR0008401#Artikel15
    url: https://wetten.overheid.nl/BWBR0008401/1999-07-14#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008401
        artikel: '15'
  - number: '3'
    text: De PKHN wordt gevormd door een voorzitter, een secretaris en 9 leden of hun respectieve plaatsvervangers.
    url: https://wetten.overheid.nl/BWBR0008401/1999-07-14#Artikel3
  - number: '4'
    text: |-
      1 De PKHN kan met gewone meerderheid van stemmen waarnemers tot haar vergaderingen toelaten.

      2 De directeur Kustwacht kan als adviseur de vergaderingen van de PKHN bijwonen.
    url: https://wetten.overheid.nl/BWBR0008401/1999-07-14#Artikel4
  - number: '5'
    text: |-
      1 De voorzitter, de secretaris, en hun respectieve plaatsvervangers, worden op unanieme voordracht van de leden van
      de PKHN benoemd door de Minister van Verkeer en Waterstaat.

      2 De leden van de PKHN en hun plaatsvervangers worden aangewezen door de als partij bij de overeenkomst betrokken
      ministers:

      één lid wordt aangewezen door de Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      twee leden worden aangewezen door de Minister van Defensie;

      één lid wordt aangewezen door de Minister van Financiën;

      twee leden worden aangewezen door de Minister van Justitie;

      één lid wordt aangewezen door de Minister van Landbouw, Natuurbeheer en Visserij;

      twee leden worden aangewezen door de Minister van Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0008401/1999-07-14#Artikel5
  - number: '6'
    text: |-
      De voorzitter en de secretaris van de PKHN en hun plaatsvervangers worden benoemd, en de leden van de PKHN en
      hun plaatsvervangers worden aangewezen voor een termijn van ten hoogste vier jaar. Na afloop van een termijn kan
      herbenoeming, onderscheidenlijk heraanwijzing plaatsvinden. De voorzitter kan één maal worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0008401/1999-07-14#Artikel6
  - number: '7'
    text: |-
      Van de benoeming van de voorzitter, de secretaris, en de aanwijzing van de leden van de PKHN, en de benoeming en
      aanwijzing van hun respectieve plaatsvervangers, wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0008401/1999-07-14#Artikel7
  - number: '8'
    text: |-
      1 De PKHN vergadert tenminste 2 keer per jaar en verder zo dikwijls indien tenminste 4 leden of de voorzitter de
      wens daartoe kenbaar maken.

      2 Besluiten worden, met gewone meerderheid van stemmen, genomen in een vergadering waarin ten minste de voorzitter
      en vijf leden aanwezig zijn. De voorzitter en de secretaris hebben geen stemrecht.

      Indien een lid een afwijkende mening heeft, kan op zijn verzoek daarvan melding worden gemaakt in de notulen;
      desgewenst kan een minderheidsnota bij de notulen worden gevoegd.

      3 De oproep voor vergaderingen geschiedt schriftelijk door of namens de voorzitter.

      4 Van vergaderingen worden notulen gemaakt die in de eerstvolgende vergadering worden vastgesteld.

      5 Een vergadering kan, op verzoek van de voorzitter, of van één der leden, worden bijgewoond door één of meer
      deskundigen.

      6 De waarnemers en de adviseur, bedoeld in [artikel 4][ref1], hebben geen stemrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0008401#Artikel4
    url: https://wetten.overheid.nl/BWBR0008401/1999-07-14#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008401
        artikel: '4'
  - number: '9'
    text: |-
      Het beleidsplan voor handhavingstaken, bedoeld in artikel 16, derde lid, van de Overeenkomst, wordt pas door de
      PKHN vastgesteld wanneer dat door alle leden van de PKHN of, bij afwezigheid, door hun plaatsvervangers wordt
      onderschreven.
    url: https://wetten.overheid.nl/BWBR0008401/1999-07-14#Artikel9
  - number: '10'
    text: |-
      1 De PKHN stelt een werkgroep Beleidsplan Handhaving Noordzee in, hierna te noemen de BHN. De PKHN kan voor
      tijdelijke werkzaamheden andere werkgroepen instellen.

      2 De BHN wordt gevormd door een vertegenwoordiging, bestaande uit een afgevaardigde van de ministeries
      van: Financiën, Justitie, Landbouw, Natuurbeheer en Visserij en Verkeer en Waterstaat, of hun respectieve
      plaatsvervangers, en een secretaris, zijnde de secretaris van de PKHN.

      3 De BHN wordt bij toerbeurt voor een periode van twee jaar voorgezeten door een in het tweede lid bedoelde
      afgevaardigde, te beginnen met de afgevaardigde van het Ministerie van Landbouw, Natuurbeheer en Visserij.

      4 De in het eerste lid bedoelde werkgroepen, verrichten hun werkzaamheden onder verantwoordelijkheid van de PKHN,
      die richtlijnen omtrent de werkwijze van de werkgroepen kan geven.

      5 De directeur Kustwacht of diens plaatsvervanger kan de vergaderingen van de in het eerste lid bedoelde
      werkgroepen als adviseur bijwonen.
    url: https://wetten.overheid.nl/BWBR0008401/1999-07-14#Artikel10
  - number: '13'
    text: |-
      De PKHN zendt binnen 2 jaar na de inwerkingtreding van deze beschikking en vervolgens iedere vier jaar, een
      verslag van de werkzaamheden aan de Minister van Verkeer en Waterstaat als coördinerend minister voor Noordzee-
      aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0008401/1999-07-14#Artikel13
  - number: '14'
    text: |-
      Deze beschikking treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0008401/1999-07-14#Artikel14
  - number: '15'
    text: 'Deze beschikking kan worden aangehaald als: Beschikking instelling Permanente Kontaktgroep Handhaving Noordzee.'
    url: https://wetten.overheid.nl/BWBR0008401/1999-07-14#Artikel15
