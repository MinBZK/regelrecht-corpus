  - number: XXVII
    text: |-
      1 De Wet op het ouderschapsverlof wordt ingetrokken.

      2 In afwijking van [hoofdstuk 6 van de Wet arbeid en zorg][ref1] blijft op een verzoek van de werknemer om
      ouderschapsverlof, dat is ingediend voor de datum van inwerkingtreding van de [Wet arbeid en zorg][ref2], de Wet op
      het ouderschapsverlof, zoals deze luidde op de dag voor die datum, van toepassing.


