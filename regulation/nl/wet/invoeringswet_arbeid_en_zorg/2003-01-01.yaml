  - number: XXVIII
    text: |-
      1 De wet van 6 juni 1991, houdende regels betreffende de aanspraak op zwangerschaps- en bevallingsverlof van
      overheidspersoneel (Stb. 347) wordt ingetrokken.

      2 In afwijking van [hoofdstuk 3, afdeling 1][ref1] en [afdeling 2, paragraaf 1, van de Wet arbeid en zorg]
      (onbekend), blijft op de vrouw, die op de dag voor de datum van inwerkingtreding van die wet zwangerschaps-
      of bevallingsverlof geniet op grond van de wet van 6 juni 1991, houdende regels betreffende de aanspraak op
      zwangerschaps- en bevallingsverlof van overheidspersoneel (Stb. 347), laatstbedoelde wet, zoals deze luidde op die
      dag, van toepassing tot het bevallingsverlof op grond van die wet is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Afdeling1
    url: https://wetten.overheid.nl/BWBR0013009/2003-01-01#ArtikelXXVIII
