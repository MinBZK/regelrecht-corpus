  - number: XXIX
    text: |-
      1 De Wet financiering loopbaanonderbreking wordt ingetrokken.

      2 In afwijking van [hoofdstuk 7 van de Wet arbeid en zorg][ref1] blijft op een aanvraag van de verlofganger om een
      financiële tegemoetkoming die is ingediend voor de datum van inwerkingtreding van de [Wet arbeid en zorg][ref2], de
      Wet financiering loopbaanonderbreking, zoals deze luidde op de dag voor die datum van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0013009/2003-01-01#ArtikelXXIX
