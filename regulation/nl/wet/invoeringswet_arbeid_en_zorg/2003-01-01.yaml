  - number: XXXV
    text: |-
      1 [Artikel 19a van de Ziektewet](onbekend) is niet van overeenkomstige toepassing op het recht op uitkering in
      verband met zwangerschap en bevalling, bedoeld in [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg]
      (onbekend), van de persoon, die op 31 december 1999 op grond van [artikel 19 van de Ziektewet][ref1] recht had op
      ziekengeld en die op die datum niet in Nederland woonde.

      2 De [artikelen 7a][ref2], [19a][ref3] en [21a van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref4]
      zijn in de jaren 2000 tot en met 2002 niet van overeenkomstige toepassing op het recht op uitkering
      in verband met zwangerschap en bevalling, bedoeld in [hoofdstuk 3, afdeling 2, paragraaf 2,
      van de Wet arbeid en zorg](onbekend), van de persoon, die op 31 december 1999 op grond van
      [artikel 18 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref5] recht had op
      arbeidsongeschiktheidsuitkering en die op die datum niet in Nederland woonde.


