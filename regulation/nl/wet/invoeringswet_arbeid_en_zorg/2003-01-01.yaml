preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te stellen van overgangs- en invoeringsrecht in
    verband met de inwerkingtreding van de Wet arbeid en zorg alsmede in verband hiermee enige wetten aan te passen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013009/2003-01-01#ArtikelAanhef
articles:
  - number: I
    text: |-
      1 In afwijking van [hoofdstuk 3, afdeling 1][ref1] en [afdeling 2, paragraaf 1, van de Wet arbeid en zorg]
      (onbekend), is op de vrouw die op de dag voor de datum van inwerkingtreding van die wet ziekengeld in verband
      met haar bevalling ontvangt op grond van [artikel 29a, tweede of vijfde lid, van de Ziektewet][ref2], de
      [Ziektewet][ref3], zoals deze luidde op die dag, van toepassing tot het recht op dat ziekengeld is geëindigd.

      2 Voor de toepassing van [artikel 29a van de Ziektewet][ref4] wordt onder uitkering op grond van
      [artikel 3:7, eerste lid][ref5], [3:8, tweede lid][ref6], of [3:10, eerste lid, van de Wet arbeid en zorg][ref7]
      mede verstaan ziekengeld in verband met bevalling op grond van [artikel 29a van de Ziektewet][ref8], zoals dat
      artikel luidde op de dag voor de datum van inwerkingtreding van deze wet.

      3 Voor de toepassing van [artikel 71a van de Wet op de arbeidsongeschiktheidsverzekering][ref9] wordt onder het
      recht op uitkering bedoeld in [artikel 3:7, eerste lid][ref10], of [artikel 3:8 van de Wet arbeid en zorg][ref11]
      mede verstaan het recht op ziekengeld in verband met bevalling op grond van [artikel 29a van de Ziektewet][ref12].

      4 [Artikel 43, tweede lid, van de Werkloosheidswet][ref13] blijft buiten toepassing voorzover de uitkering
      als bedoeld in [artikel 19, eerste lid, onderdeel a, van die wet][ref14] wordt ontvangen op grond van
      [artikel 29a, eerste lid, van de Ziektewet][ref15], zoals dat artikel luidde op de dag voor de datum van
      inwerkingtreding van de [Wet arbeid en zorg][ref16].

      5 Bij de toepassing van [artikel 43, derde lid, van de Werkloosheidswet][ref17] vormt het ontvangen van
      ziekengeld op grond van [artikel 29a, eerste lid, van de Ziektewet][ref18], zoals dat luidde op de dag voor de
      datum van inwerkingtreding van de [Wet arbeid en zorg][ref19], geen onderbreking van de periode waarover de in
      [artikel 19, eerste lid, onderdeel a, van de Werkloosheidswet][ref20] bedoelde uitkeringen worden ontvangen.


