        artikel: 29a
  - number: I.4
    text: |-
      [Artikel 43, tweede lid, van de Werkloosheidswet][ref1] blijft buiten toepassing voorzover de uitkering
      als bedoeld in [artikel 19, eerste lid, onderdeel a, van die wet][ref2] wordt ontvangen op grond van
      [artikel 29a, eerste lid, van de Ziektewet][ref3], zoals dat artikel luidde op de dag voor de datum van
      inwerkingtreding van de [Wet arbeid en zorg][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel29a
      [ref4]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0013009/2003-01-01#ArtikelI
