  - number: II.1
    text: |-
      In afwijking van [hoofdstuk 3, afdeling 1][ref1] en [afdeling 2, paragraaf 2, van de Wet arbeid en zorg](onbekend),
      blijft op de vrouw die op de dag voor de datum van inwerkingtreding van die wet uitkering in verband met haar
      bevalling ontvangt op grond van [hoofdstuk 3, afdeling 1, paragraaf 2, van de Wet arbeidsongeschiktheidsverzekering
      zelfstandigen](onbekend), die wet, zoals deze luidde op die dag, van toepassing tot het recht op die uitkering
      is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Afdeling1
    url: https://wetten.overheid.nl/BWBR0013009/2003-01-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0013008
        afdeling: '1'
  - number: II.2
    text: |-
      Voor de toepassing van de artikelen 37, tweede lid, onderdeel a, en 46, dertiende lid, onderdeel a, van de Wet op
      de inkomstenbelasting 1964, [artikel 17, tweede lid, onderdeel a, van de Wet op de loonbelasting 1964][ref1] en
      [artikel 1, tweede lid, van de Wet vermindering afdracht loonbelasting en premie voor de volksverzekeringen][ref2],
      wordt onder de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3] verstaan de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref4], behoudens [hoofdstuk 3, afdeling 1, paragraaf 2, van
      die wet](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0007746#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0008656
      [ref4]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0013009/2003-01-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '17'
