  - number: I.3
    text: |-
      Voor de toepassing van [artikel 71a van de Wet op de arbeidsongeschiktheidsverzekering][ref1] wordt onder het recht
      op uitkering bedoeld in [artikel 3:7, eerste lid][ref2], of [artikel 3:8 van de Wet arbeid en zorg][ref3] mede
      verstaan het recht op ziekengeld in verband met bevalling op grond van [artikel 29a van de Ziektewet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
