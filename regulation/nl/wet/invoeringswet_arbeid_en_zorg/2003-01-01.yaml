        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
  - number: XXVII.1
    text: De Wet op het ouderschapsverlof wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0013009/2003-01-01#ArtikelXXVII
  - number: XXVII.2
    text: |-
      In afwijking van [hoofdstuk 6 van de Wet arbeid en zorg][ref1] blijft op een verzoek van de werknemer om
      ouderschapsverlof, dat is ingediend voor de datum van inwerkingtreding van de [Wet arbeid en zorg][ref2], de Wet op
      het ouderschapsverlof, zoals deze luidde op de dag voor die datum, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0013009/2003-01-01#ArtikelXXVII
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0013008
  - number: XXVIII.1
    text: |-
      De wet van 6 juni 1991, houdende regels betreffende de aanspraak op zwangerschaps- en bevallingsverlof van
      overheidspersoneel (Stb. 347) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0013009/2003-01-01#ArtikelXXVIII
  - number: XXVIII.2
    text: |-
      In afwijking van [hoofdstuk 3, afdeling 1][ref1] en [afdeling 2, paragraaf 1, van de Wet arbeid en zorg](onbekend),
      blijft op de vrouw, die op de dag voor de datum van inwerkingtreding van die wet zwangerschaps- of bevallingsverlof
      geniet op grond van de wet van 6 juni 1991, houdende regels betreffende de aanspraak op zwangerschaps- en
      bevallingsverlof van overheidspersoneel (Stb. 347), laatstbedoelde wet, zoals deze luidde op die dag, van
      toepassing tot het bevallingsverlof op grond van die wet is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Afdeling1
    url: https://wetten.overheid.nl/BWBR0013009/2003-01-01#ArtikelXXVIII
    references:
      - id: ref1
        bwb_id: BWBR0013008
        afdeling: '1'
  - number: XXIX.1
    text: De Wet financiering loopbaanonderbreking wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0013009/2003-01-01#ArtikelXXIX
  - number: XXIX.2
    text: |-
      In afwijking van [hoofdstuk 7 van de Wet arbeid en zorg][ref1] blijft op een aanvraag van de verlofganger om een
      financiële tegemoetkoming die is ingediend voor de datum van inwerkingtreding van de [Wet arbeid en zorg][ref2], de
      Wet financiering loopbaanonderbreking, zoals deze luidde op de dag voor die datum van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0013009/2003-01-01#ArtikelXXIX
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0013008
  - number: XXXV.1
    text: |-
      [Artikel 19a van de Ziektewet](onbekend) is niet van overeenkomstige toepassing op het recht op uitkering in
      verband met zwangerschap en bevalling, bedoeld in [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg]
      (onbekend), van de persoon, die op 31 december 1999 op grond van [artikel 19 van de Ziektewet][ref1] recht had op
      ziekengeld en die op die datum niet in Nederland woonde.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel19
    url: https://wetten.overheid.nl/BWBR0013009/2003-01-01#ArtikelXXXV
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '19'
  - number: XXXV.2
    text: |-
      De [artikelen 7a][ref1], [19a][ref2] en [21a van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3]
      zijn in de jaren 2000 tot en met 2002 niet van overeenkomstige toepassing op het recht op uitkering
      in verband met zwangerschap en bevalling, bedoeld in [hoofdstuk 3, afdeling 2, paragraaf 2,
      van de Wet arbeid en zorg](onbekend), van de persoon, die op 31 december 1999 op grond van
      [artikel 18 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref4] recht had op
      arbeidsongeschiktheidsuitkering en die op die datum niet in Nederland woonde.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel19a
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel21a
      [ref4]: https://wetten.overheid.nl/BWBR0008656#Artikel18
    url: https://wetten.overheid.nl/BWBR0013009/2003-01-01#ArtikelXXXV
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0008656
        artikel: 19a
      - id: ref3
        bwb_id: BWBR0008656
        artikel: 21a
      - id: ref4
        bwb_id: BWBR0008656
        artikel: '18'
  - number: XXXVI
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende artikelen of
      onderdelen verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013009/2003-01-01#ArtikelXXXVI
  - number: XXXVII
    text: 'Deze wet wordt aangehaald als: Invoeringswet arbeid en zorg.'
    url: https://wetten.overheid.nl/BWBR0013009/2003-01-01#ArtikelXXXVII
