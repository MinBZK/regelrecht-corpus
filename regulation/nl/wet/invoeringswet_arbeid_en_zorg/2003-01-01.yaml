  - number: II
    text: |-
      1 In afwijking van [hoofdstuk 3, afdeling 1][ref1] en [afdeling 2, paragraaf 2, van de Wet arbeid en zorg]
      (onbekend), blijft op de vrouw die op de dag voor de datum van inwerkingtreding van die wet uitkering
      in verband met haar bevalling ontvangt op grond van [hoofdstuk 3, afdeling 1, paragraaf 2, van de Wet
      arbeidsongeschiktheidsverzekering zelfstandigen](onbekend), die wet, zoals deze luidde op die dag, van toepassing
      tot het recht op die uitkering is geëindigd.

      2 Voor de toepassing van de artikelen 37, tweede lid, onderdeel a, en 46, dertiende lid, onderdeel a, van de Wet
      op de inkomstenbelasting 1964, [artikel 17, tweede lid, onderdeel a, van de Wet op de loonbelasting 1964][ref2] en
      [artikel 1, tweede lid, van de Wet vermindering afdracht loonbelasting en premie voor de volksverzekeringen][ref3],
      wordt onder de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref4] verstaan de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref5], behoudens [hoofdstuk 3, afdeling 1, paragraaf 2, van
      die wet](onbekend).


