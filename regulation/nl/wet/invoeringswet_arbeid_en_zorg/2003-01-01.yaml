preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te stellen van overgangs- en invoeringsrecht in
    verband met de inwerkingtreding van de Wet arbeid en zorg alsmede in verband hiermee enige wetten aan te passen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013009/2003-01-01#ArtikelAanhef
articles:
  - number: I.1
    text: |-
      In afwijking van [hoofdstuk 3, afdeling 1][ref1] en [afdeling 2, paragraaf 1, van de Wet arbeid en zorg](onbekend),
      is op de vrouw die op de dag voor de datum van inwerkingtreding van die wet ziekengeld in verband met haar
      bevalling ontvangt op grond van [artikel 29a, tweede of vijfde lid, van de Ziektewet][ref2], de [Ziektewet][ref3],
      zoals deze luidde op die dag, van toepassing tot het recht op dat ziekengeld is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Afdeling1
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel29a
      [ref3]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0013009/2003-01-01#ArtikelI
    references:
      - id: ref1
        bwb_id: BWBR0013008
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 29a
      - id: ref3
        bwb_id: BWBR0001888
  - number: I.2
    text: |-
      Voor de toepassing van [artikel 29a van de Ziektewet][ref1] wordt onder uitkering op grond van
      [artikel 3:7, eerste lid][ref2], [3:8, tweede lid][ref3], of [3:10, eerste lid, van de Wet arbeid en zorg][ref4]
      mede verstaan ziekengeld in verband met bevalling op grond van [artikel 29a van de Ziektewet][ref5], zoals dat
      artikel luidde op de dag voor de datum van inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29a
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Artikel3
