      - id: ref4
        bwb_id: BWBR0008656
  - number: III.1
    text: |-
      Indien de datum van ingang van het verlof in verband met adoptie, bedoeld in
      [artikel 3:2, tweede lid, van de Wet arbeid en zorg][ref1] is gelegen in het tijdvak van drie
      weken vanaf het tijdstip van inwerkingtreding van die wet, meldt de werknemer, in afwijking van
      [artikel 3:3, tweede lid, van die wet][ref2], het verlof binnen dat tijdvak van drie weken.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0013009/2003-01-01#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
  - number: III.2
    text: |-
      Indien de datum van ingang van het verlof respectievelijk de gewenste datum van ingang van
      de uitkering, bedoeld in de [artikelen 3:11, tweede lid][ref1], [3:12, tweede lid][ref2], en
      [3:22, tweede lid, van de Wet arbeid en zorg][ref3], gelegen is in het tijdvak van twee weken vanaf het tijdstip
      van inwerkingtreding van die wet, doet de werknemer, in afwijking van die artikelen, de aanvraag binnen dat tijdvak
      van twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0013009/2003-01-01#ArtikelIII
    references:
