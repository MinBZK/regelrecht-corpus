  - number: I.5
    text: |-
      Bij de toepassing van [artikel 43, derde lid, van de Werkloosheidswet][ref1] vormt het ontvangen van ziekengeld
      op grond van [artikel 29a, eerste lid, van de Ziektewet][ref2], zoals dat luidde op de dag voor de datum
      van inwerkingtreding van de [Wet arbeid en zorg][ref3], geen onderbreking van de periode waarover de in
      [artikel 19, eerste lid, onderdeel a, van de Werkloosheidswet][ref4] bedoelde uitkeringen worden ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel29a
      [ref3]: https://wetten.overheid.nl/BWBR0013008
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel19
    url: https://wetten.overheid.nl/BWBR0013009/2003-01-01#ArtikelI
