  - number: '13'
    text: |-
      1 De dienstbetrekking met de langdurig werkloze van 23 jaar of ouder wordt aangegaan voor de duur van twee jaar.

      2 Na afloop van de dienstbetrekking, bedoeld in het eerste lid, kan de gemeente slechts
      een nieuwe dienstbetrekking met een langdurig werkloze aangaan met een op grond van
      [artikel 26, derde of vijfde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] gegeven
      positief advies van de Centrale organisatie werk en inkomen.


