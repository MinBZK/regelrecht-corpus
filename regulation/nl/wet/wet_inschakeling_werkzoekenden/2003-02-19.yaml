  - number: '24'
    text: |-
      1 De arbeidsovereenkomst met de banenpool, bedoeld in de Rijksbijdrageregeling banenpools, zoals deze regeling
      luidde tot de datum van inwerkingtreding van deze wet, die op de dag voorafgaande aan de datum van inwerkingtreding
      van deze wet bestaat en na die datum voortbestaat, wordt met ingang van de datum van inwerkingtreding van deze wet
      aangemerkt als dienstbetrekking op grond van deze wet met een wekelijkse arbeidsduur, die gelijk is aan die met de
      banenpool was overeengekomen, met dien verstande, dat

      a. artikel 13 niet van toepassing is;

      b. gedurende de eerste twee jaar van de dienstbetrekking, gerekend vanaf de datum van aanvang van de
      arbeidsovereenkomst met de banenpool [artikel 15, tweede lid][ref1], van toepassing is en bij een dienstbetrekking
      met een duur van meer dan twee jaar, gerekend vanaf de datum van aanvang van de arbeidsovereenkomst met de
      banenpool, [artikel 15, derde lid][ref2], van toepassing is;

      c. deze dienstbetrekking niet in aanmerking wordt genomen bij de toepassing van
      [artikel 6, eerste lid, onderdeel a][ref3].

      2 Indien de werknemer in het kader van de arbeidsovereenkomst met de banenpool, bedoeld in het eerste lid, scholing
      volgt, worden alle scholingsuren, in afwijking van [artikel 4, vierde lid][ref4], voor de duur van de scholing
      beschouwd als arbeidsuren.

      3 Indien voor de werknemer, bedoeld in het eerste lid, tot de datum van inwerkingtreding van deze wet, op grond van
      __REF000___________________________________________________________________________________________________________
      _________, zoals deze artikelen luidden tot de datum van inwerkingtreding van deze wet, een recht op
      premievrijstelling bestond, wordt vanaf de datum van inwerkingtreding van deze wet, het voor de werknemer geldende
      loon verhoogd met een bedrag, zodat de werknemer onder aftrek van de op het loon in te houden loonbelasting en
      premies ingevolge de sociale verzekeringswetten, een nettoloon ontvangt, dat gelijk is aan het nettoloon, dat
      aan de werknemer in de arbeidsovereenkomst met de banenpool werd betaald. Deze toeslag wordt betaald tot het
      tijdstip waarop het loon zonder toeslag leidt tot genoemd nettoloon en wordt uitsluitend voor de toepassing
      van [artikel 31, tweede lid, onder c, van de Wet op de loonbelasting 1964][ref6] aangemerkt als uitkering
      van publiekrechtelijke aard en blijft buiten beschouwing bij op het inkomen van de werknemer afgestemde
      publiekrechtelijke uitkeringen of verstrekkingen.

      4 Indien in aansluiting op een arbeidsovereenkomst met de banenpool of een dienstbetrekking als bedoeld in het
      eerste lid een arbeidsovereenkomst wordt aangegaan of een ambtelijke aanstelling wordt verkregen, waarvoor op grond
      van een algemeen verbindend voorschrift is bepaald, dat het aanvangsloon het voor de werknemer geldende minimumloon
      is, en het loon in die arbeidsverhouding wordt verhoogd met een bedrag, dat onder aftrek van de op het loon in te
      houden loonbelasting en premies ingevolge de sociale verzekeringswetten, leidt tot het nettoloon, dat gelijk is aan
      het loon, dat voor de datum van inwerkingtreding van deze wet aan een werknemer in de arbeidsovereenkomst met de
      banenpool werd betaald, is de tweede volzin van het derde lid van overeenkomstige toepassing.


