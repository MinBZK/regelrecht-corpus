  - number: '3'
    text: |-
      1 De gemeente kan ter uitvoering van [artikel 2][ref1] aan of ten behoeve van een persoon als bedoeld in dat
      artikel, een subsidie verstrekken dan wel dienstverlening inkopen, waardoor deze persoon in staat wordt gesteld of
      gestimuleerd wordt:

      a. deel te nemen aan activiteiten die bijdragen tot sociale activering, inschakeling in de arbeid en scholing, of

      b. een overeenkomst tot het verrichten van arbeid te sluiten of werkzaamheden als zelfstandige te gaan verrichten.

      2 Het gemeentebestuur stelt voor het verstrekken van subsidie aan de persoon, bedoeld in het eerste lid, bij
      verordening regels vast.

      3 De gemeente kan ten behoeve van personen als bedoeld in [artikel 2][ref2], voor zover deze alleenstaande ouder
      zijn, kinderopvang realiseren.

      4 Onder kinderopvang wordt verstaan: het in georganiseerd verband tegen vergoeding verzorgen en opvoeden van
      kinderen in de leeftijd van 0 tot en met de leeftijd van einde basisschool, door anderen dan de eigen ouder, pleeg-
      of stiefouder op uren dat deze ouder zelf hiervoor niet beschikbaar is wegens het deelnemen aan activiteiten en
      werkzaamheden als bedoeld in dit hoofdstuk.

      5 Bij algemene maatregel van bestuur kunnen regels worden gesteld voor de voorzieningen op grond van dit artikel
      met betrekking tot:

      a. de relatie tot het recht op een uitkering;

      b. de verhouding tot andere vergelijkbare voorzieningen;

      c. de voorwaarden waaronder deze worden verstrekt;

      d. beperking van de doelgroep.

      6 Een krachtens het vijfde lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan
      acht weken na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0009083#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009083#Artikel2
