  - number: '12'
    text: |-
      1 Slechts met een op grond van
      [artikel 26, derde of vijfde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] gegeven
      positief advies van de Centrale organisatie werk en inkomen komen langdurig werklozen van 23 jaar en ouder in
      aanmerking voor de voorzieningen, bedoeld in [de artikelen 4][ref2] of [5][ref3].

      2 De werknemer, bedoeld in de [Wet sociale werkvoorziening][ref4], die op grond van een herindicatiebeschikking als
      bedoeld in die wet niet langer tot de doelgroep van die wet behoort, kan zonder advies van de Centrale organisatie
      werk en inkomen in aanmerking komen voor de voorzieningen bedoeld in het eerste lid.


