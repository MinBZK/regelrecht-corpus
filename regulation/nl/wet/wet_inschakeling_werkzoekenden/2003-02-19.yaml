      1 De gemeente kan ter uitvoering van [artikel 2][ref1] subsidie verstrekken aan werkgevers die met langdurig
      werklozen of jongeren een arbeidsovereenkomst sluiten om hen in de gelegenheid te stellen werkervaring op te doen.

      2 De gemeente schakelt derden in bij het bemiddelen naar arbeidsovereenkomsten als bedoeld in het eerste lid.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor de hoogte van het
      subsidiebedrag en de duur van en de voorwaarden voor de subsidieverstrekking.


