  - number: '15'
    text: |-
      1 Voor de subsidieverstrekking bedraagt de arbeidsduur van de dienstbetrekking 32 uur per week, tenzij op grond van
      bij de werknemer gelegen factoren een langere of kortere arbeidsduur dan 32 uur gerechtvaardigd is.

      2 Om de dienstbetrekking voor subsidie in aanmerking te laten komen wordt in de dienstbetrekking bij
      de toepassing van [de artikelen 9][ref1] en [13, eerste lid][ref2], aan de werknemer, met uitzondering
      van die bedoeld in [artikel 12, tweede lid][ref3], voorzover die ouder dan 23 jaar is niet meer loon
      betaald dan het bedrag dat gezien de leeftijd van de werknemer en de overeengekomen arbeidsduur, in de
      [Wet minimumloon en minimumvakantiebijslag][ref4], voor hem als minimumloon geldt, tenzij daarvan op grond van bij
      ministeriële regeling te bepalen omstandigheden kan worden afgeweken.

      3 Bij algemene maatregel van bestuur worden regels gesteld voor het loon dat bij de toepassing van
      [artikel 13, tweede lid][ref5], aan de werknemer wordt betaald om de dienstbetrekking voor subsidie in aanmerking
      te laten komen.

      4 Niet voor subsidie komt in aanmerking de dienstbetrekking waarin in een aaneengesloten periode van drie maanden
      of langer geen arbeid wordt verricht, omdat geen werkzaamheden beschikbaar zijn gesteld, tenzij de gemeente kan
      aantonen, dat de werknemer door ziekte of arbeidsongeschiktheid in die periode verhinderd was arbeid te verrichten,
      en in verband daarmee een reïntegratieverslag is opgesteld voor herintreding van de werknemer in het arbeidsproces.


      [ref1]: https://wetten.overheid.nl/BWBR0009083#Artikel9
