  - number: '11'
    text: |-
      Onverminderd de bepalingen van titel 10 van Boek 7 van het Burgerlijk Wetboek, en [artikel 4, zevende lid][ref1],
      wordt de dienstbetrekking, bedoeld in [artikel 9][ref2], opgezegd, indien de jongere:

      a. de leeftijd van 23 jaar bereikt;

      b. weigert deel te nemen aan de op grond van [artikel 9][ref3] vastgestelde activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0009083#Artikel4
