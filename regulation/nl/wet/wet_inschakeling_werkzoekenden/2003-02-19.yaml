  - number: '8'
    text: |-
      1 Het gemeentebestuur kan een rechtspersoon aanwijzen voor de uitvoering van de taken in verband
      met dienstbetrekkingen, in verband met de toekenning van subsidies of voorzieningen als bedoeld in
      [de artikelen 3][ref1], 3a en [5][ref2] van de wet of het vaststellen van een traject als bedoeld in
      [artikel 9, eerste lid][ref3].

      2 Het gemeentebestuur laat de werkzaamheden waarmee de in het eerste lid bedoelde taak wordt uitgevoerd, met
      uitzondering van werkzaamheden in verband met dienstbetrekkingen, zo veel mogelijk verrichten door een natuurlijk
      persoon dan wel een rechtspersoon, die in het kader van de uitoefening van beroep of bedrijf de inschakeling van
      personen in de arbeid bevordert. Het gemeentebestuur legt in het verslag over de uitvoering van de wet, bedoeld in
      [artikel 20, vierde lid][ref4], de wijze vast waarop uitvoering wordt gegeven aan dit artikel.

      3 Het gemeentebestuur verstrekt aan de in het tweede lid bedoelde natuurlijke persoon of rechtspersoon gegevens
      voorzover deze noodzakelijk zijn voor de uitvoering van de in het tweede lid bedoelde werkzaamheden, alsmede het
      sociaal-fiscaalnummer, bedoeld in artikel 22, vijfde lid, van de persoon wiens inschakeling in de arbeid door die
      natuurlijke persoon of rechtspersoon wordt bevorderd. Deze natuurlijke persoon of rechtspersoon verwerkt de in dit
      lid bedoelde gegevens slechts voorzover dat noodzakelijk is voor de werkzaamheden, bedoeld in het tweede lid, en
      gebruikt slechts met dat doel het sociaal-fiscaalnummer bij die verwerking.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de uitvoering van dit
      artikel, waarbij in ieder geval regels kunnen worden gesteld voor de inhoud van de overeenkomst met de in
      het tweede lid bedoelde natuurlijke of rechtspersoon, het verstrekken en verwerken van gegevens en de soort
      werkzaamheden.

      5 De voordracht voor een krachtens het vierde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0009083#Artikel3
