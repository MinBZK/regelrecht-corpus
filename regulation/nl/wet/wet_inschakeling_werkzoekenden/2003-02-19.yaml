  - number: '9'
    text: |-
      1 De gemeente stelt voor iedere jongere, van wie een aanvraag voor een door de gemeente te verstrekken uitkering
      in behandeling is genomen of die is ingeschreven als werkloos werkzoekende en geen uitkering ontvangt van het
      Uitvoeringsinstituut werknemersverzekeringen, een plan gericht op de inschakeling in het arbeidsproces op of laat
      dit opstellen. Artikel 2, zevende lid, is van toepassing.

      2 De gemeente biedt ter uitvoering van het in het eerste lid bedoelde plan uiterlijk binnen een jaar na de datum
      van ingang van de uitkering of na de datum van inschrijving als werkloos werkzoekende een dienstbetrekking aan,
      tenzij andere voorzieningen gericht op het vergroten van de mogelijkheden tot inschakeling in het arbeidsproces
      meer aangewezen zijn en deze andere voorzieningen ten minste 19 uur per week in beslag nemen.

      3 De periode van een jaar, bedoeld in het tweede lid, wordt vastgesteld overeenkomstig de periode van inschrijving
      als werkloos werkzoekende, bedoeld in [artikel 1][ref1].

      4 Het tweede lid is niet van toepassing, indien de jongere arbeid verricht, anders dan in een dienstbetrekking, met
      een arbeidsduur van ten minste 19 uur per week.


      [ref1]: https://wetten.overheid.nl/BWBR0009083#Artikel1
    url: https://wetten.overheid.nl/BWBR0009083/2003-02-19#Artikel9
    references:
