  - number: '17'
    text: |-
      1 Onze Minister verleent vóór 1 oktober van ieder jaar de subsidie, bedoeld in
      [artikel 14, tweede lid, onderdelen b en c][ref1], waarop de gemeente het daarop volgende jaar recht heeft.

      2 Bij algemene maatregel van bestuur worden regels gesteld voor de criteria op basis waarvan de totale subsidie
      over de gemeenten wordt verdeeld en voor de wijze, waarop rekening wordt gehouden met de vastgestelde subsidie over
      voorafgaande jaren.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor de betaling van de subsidie.

      4 Een wijziging van de krachtens het tweede lid vastgestelde algemene maatregel van bestuur treedt niet eerder in
      werking dan acht weken na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt
      onverwijld mededeling gedaan aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0009083#Artikel14
    url: https://wetten.overheid.nl/BWBR0009083/2003-02-19#Artikel17
