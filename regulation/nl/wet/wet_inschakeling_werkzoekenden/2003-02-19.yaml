        hoofdstuk: '1'
  - number: '10'
    text: |-
      1 [Artikel 9][ref1] is niet van toepassing, indien de jongere op grond van de [Wet sociale werkvoorziening][ref2]
      is geïndiceerd voor het verrichten van arbeid onder aangepaste omstandigheden.

      2 In dat geval biedt de gemeente een dienstbetrekking aan, waarbij arbeid wordt verricht onder aangepaste
      omstandigheden als bedoeld in de [Wet sociale werkvoorziening][ref3]. Artikel 6, eerste lid, is dan niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009083#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0008903
