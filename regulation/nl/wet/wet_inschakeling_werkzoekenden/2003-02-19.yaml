        artikel: '14'
        hoofdstuk: '3'
  - number: '18'
    text: |-
      1 Na afloop van het jaar stelt Onze Minister de subsidie vast, mede op basis van het aantal gerealiseerde
      dienstbetrekkingen en arbeidsovereenkomsten als bedoeld in [artikel 5][ref1].

      2 De vastgestelde subsidie kan van de verleende subsidie afwijken,

      a. voor zover de arbeidsduur van de dienstbetrekkingen, waarmee bij de subsidieverlening rekening is gehouden, niet
      gerechtvaardigd afwijkt van 32 uur per week;

      b. indien het loon in de dienstbetrekkingen niet voldoet aan de vereisten van
      [artikel 15, tweede en derde lid][ref2];

      c. indien [artikel 15, vierde lid][ref3], van toepassing is;

      d. indien het gemeentebestuur niet heeft voldaan aan de bij of krachtens deze wet gestelde verplichtingen;

      e. indien de besteding van de subsidie anderszins heeft plaatsgevonden in strijd met deze wet.

      3 Verlies van het ingezetenschap in de gemeente heeft geen invloed op de toepassing van het eerste lid, zolang de
      dienstbetrekking voortduurt.

      4 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld voor de subsidievaststelling
      en de gevolgen daarvan voor de subsidieverlening voor de komende jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0009083#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009083#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0009083#Artikel15
