  - number: '37'
    text: |-
      Onze Minister zendt na drie jaar na inwerkingtreding van deze wet en vervolgens telkens na vier jaar aan de Staten-
      Generaal een verslag van de doeltreffendheid en doelmatigheid van deze wet.
    url: https://wetten.overheid.nl/BWBR0009083/2003-02-19#Artikel37
  - number: '38'
    text: |-
      De Jeugdwerkgarantiewet, de Rijksbijdrageregeling banenpools en de tijdelijke subsidieregeling bevordering
      uitstroom banenpools en Jeugdwerkgarantiewet worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009083/2003-02-19#Artikel38
  - number: '39'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009083/2003-02-19#Artikel39
  - number: '40'
    text: 'Deze wet wordt aangehaald als: Wet inschakeling werkzoekenden.'
