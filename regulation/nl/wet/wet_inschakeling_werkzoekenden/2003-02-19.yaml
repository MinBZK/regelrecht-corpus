  - number: '6'
    text: |-
      1 De gemeente stelt de werknemer slechts ter beschikking om arbeid te verrichten, indien:

      a. blijkens een schriftelijke verklaring van de inlener het aantal werknemers, dat een dienstbetrekking heeft als
      bedoeld in [artikel 4][ref1], werkzaam in de onderneming van de inlener niet meer bedraagt dan een bij algemene
      maatregel van bestuur te bepalen percentage van het totaal aantal in die onderneming werkzame personen, met dien
      verstande dat in de onderneming in ieder geval één werknemer is toegelaten;

      b. bij de onderneming van de inlener in de periode van zes maanden voorafgaand aan de datum van de aanvang van de
      terbeschikkingstelling niet één of meer overeenkomsten of aanstellingen tot het verrichten van vergelijkbare arbeid
      zijn beëindigd op grond van bedrijfseconomische redenen, voor zover nodig na verkregen toestemming van de Centrale
      organisatie werk en inkomen, dan wel een aanvraag voor een ontslagvergunning om bedrijfs-economische redenen in
      behandeling is;

      c. in de onderneming van de inlener de ondernemer met de ondernemingsraad, bedoeld in de
      [Wet op de ondernemingsraden][ref2], dan wel met een bij of krachtens andere wetten geregelde of in de onderneming
      functionerende personeelsvertegenwoordiging is overeengekomen, dat werknemers als bedoeld in deze wet worden
      ingeleend.

      2 De gemeente bedingt voor de door de werknemer te verrichten arbeid een zodanige vergoeding, dat de
      concurrentieverhoudingen niet onverantwoord worden beïnvloed.

      3 Voor ten gevolge van de arbeid van de werknemer of van de persoon, bedoeld in [artikel 5][ref3], geleverde
      goederen en diensten worden vergoedingen bedongen, die de concurrentieverhoudingen niet onverantwoord beïnvloeden.

      4 Het gemeentebestuur stelt na overleg met vertegenwoordigers van representatieve organisaties van werkgevers
      en van werknemers in de regio, waarin de gemeente gelegen is, regels vast voor de beoordeling van klachten over
      overtreding van het tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009083#Artikel4
