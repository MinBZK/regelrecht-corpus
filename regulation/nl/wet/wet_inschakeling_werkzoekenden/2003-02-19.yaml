  - number: '16'
    text: |-
      1 Onze Minister verleent de gemeente per kalenderkwartaal de basisbedragen, bedoeld in
      [artikel 14, tweede lid, onderdeel a][ref1], aan de hand van een opgave van de gemeente.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor de verlening van basisbedragen,
      de wijze en het tijdstip van declareren, alsmede voor de door het gemeentebestuur te verstrekken gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0009083#Artikel14
