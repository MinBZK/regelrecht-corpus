      1 De gemeente werkt samen met de Centrale organisatie werk en inkomen, het Uitvoeringsinstituut
      werknemersverzekeringen en de Sociale verzekeringsbank om de voorzieningen bedoeld in deze wet af te stemmen op
      reïntegratiemaatregelen en taken die op grond van wetten worden uitgevoerd door de Centrale organisatie werk en
      inkomen, het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de in het eerste lid
      bedoelde samenwerking.
