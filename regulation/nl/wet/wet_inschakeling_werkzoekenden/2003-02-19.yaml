preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is dat personen, die reeds langdurig werkloos zijn en
    daarbij meestal aangewezen zijn op een uitkering gestimuleerd worden aan activiteiten deel te nemen, waardoor
    toetreding tot het arbeidsproces wordt bevorderd en sociale uitsluiting wordt voorkomen, dat op gemeentelijk niveau
    de zorg daarvoor vorm kan krijgen via een gemeentelijk werkfonds, waardoor het aanbieden van werk en het traject
    van de toeleiding daartoe kan worden gecombineerd en dat jongeren bijzondere aandacht en begeleiding verdienen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009083/2003-02-19#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;

      b. Centrale organisatie werk en inkomen: de Centrale organisatie werk en inkomen, genoemd in
      [hoofdstuk 4 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];

      c. Uitvoeringsinstituut werknemersverzekeringen: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2];

      d. uitkeringsgerechtigde: de persoon, die een uitkering ontvangt op grond van de [Algemene bijstandswet][ref3],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref4],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref5],
      de [Werkloosheidswet][ref6], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref7],
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref8], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref9], de [Toeslagenwet][ref10], de
      [Tijdelijke wet beperking inkomensgevolgen arbeidsongeschiktheidscriteria][ref11], de
      [Algemene nabestaandenwet][ref12] of op grond van een regeling, die met deze wetten naar aard en strekking
      overeenstemt;

      e. langdurig werkloze: de persoon die langer dan 12 maanden zonder onderbreking als werkloos werkzoekende staat
      ingeschreven bij de Centrale organisatie werk en inkomen;

      f. jongere: de persoon, jonger dan 23 jaar, die recht heeft op een uitkering op grond van de
      [Algemene bijstandswet][ref13] of op een andere vergelijkbare inkomensvoorziening, dan wel als werkloos
      werkzoekende staat ingeschreven bij de Centrale organisatie werk en inkomen;

      g. dienstbetrekking: een dienstbetrekking met de gemeente als bedoeld in [artikel 4][ref14];

      h. werknemer: degene die een dienstbetrekking heeft;

      i. onderneming: de onderneming, bedoeld in [artikel 1, onderdeel c, van de Wet op de ondernemingsraden][ref15];

      j. de in de onderneming werkzame personen: degenen, die daaronder in
      [artikel 1, tweede en derde lid, van de Wet op de ondernemingsraden][ref16] worden verstaan.

      2 In afwijking van het eerste lid, onderdelen e en f, wordt niet als langdurig werkloze of jongere aangemerkt de
      persoon die onderwijs of een beroepsopleiding volgt als bedoeld in de [Wet studiefinanciering 2000][ref17] of in
      [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref18] dan wel een kind is als bedoeld in
      artikel 7, tweede lid, aanhef en onderdeel a, van de [Algemene Kinderbijslagwet][ref19].

      3 Bij ministeriële regeling worden regels gesteld voor de gelijkstelling van personen met langdurig werklozen en
      voor de vaststelling van de periode van inschrijving als werkloos werkzoekende.


