  - number: '14'
    text: |-
      1 Het Rijk verstrekt aan de gemeente overeenkomstig dit hoofdstuk een subsidie voor de uitvoering van
      [hoofdstuk 2][ref1].

      2 De hoogte van de subsidie wordt bepaald door:

      a. het basisbedrag per persoon die in aanmerking komt voor de voorzieningen, bedoeld in [de artikelen 4][ref2]
      en [5][ref3];

      b. een vast bedrag voor te realiseren dienstbetrekkingen voor aanvullende financiering, rekening houdend met de
      afstand tot de arbeidsmarkt, uitvoeringskosten, loonontwikkelingen en loonkosten;

      c. een vast bedrag voor de voorzieningen, bedoeld in [artikel 3][ref4] en 3a, en de uit die artikelen
      voortvloeiende activiteiten van de gemeenten ten behoeve van de inschakeling in het arbeidsproces.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de opbouw van het subsidiebedrag, een
      subsidieplafond, en de besteding van de subsidie, die op onderdelen beperkt kan worden tot bepaalde gemeenten of
      tot een bepaald bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0009083#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0009083#Artikel4
