      1 De gemeente draagt zorg voor voorzieningen voor in de gemeente woonachtige langdurig werklozen,
      uitkeringsgerechtigden en jongeren, die kunnen leiden tot inschakeling in het arbeidsproces dan wel die sociale
      activering en een zelfstandige bestaansvoorziening bevorderen. De eerste zin is van overeenkomstige toepassing
      voor de persoon die als werkzoekende is geregistreerd bij de Centrale organisatie werk en inkomen en die geen
      uitkeringsgerechtigde of langdurig werkloze is.

      2 Het eerste lid is niet van toepassing op de uitkeringsgerechtigde waaraan het Uitvoeringsinstituut
      werknemersverzekeringen een uitkering verstrekt.

      3 In afwijking van het tweede lid, is het eerste lid van toepassing, indien de gemeente na overleg met het
      Uitvoeringsinstituut werknemersverzekeringen heeft vastgesteld, dat ten behoeve van de uitkeringsgerechtigde,
      bedoeld in het tweede lid, geen plan wordt opgesteld, gericht op het vergroten van de mogelijkheden tot
      inschakeling in de arbeid, als bedoeld in [artikel 13 van de Wet op de (re)integratie arbeidsgehandicapten][ref1]
      of [artikel 29, derde lid, van de Werkloosheidswet][ref2].

      4 Op verzoek van het Uitvoeringsinstituut werknemersverzekeringen draagt de gemeente er
      zorg voor dat genoemd instituut, voor in de gemeente woonachtige uitkeringsgerechtigden
      aan wie dat instituut een uitkering verstrekt, uitvoering kan geven aan zijn taak,
      bedoeld in [artikel 10a van de Wet op de (re)integratie arbeidsgehandicapten][ref3] en
      [artikel 73 van de Werkloosheidswet][ref4].

      5 Bij algemene maatregel van bestuur kan onder in die algemene maatregel van bestuur vastgestelde voorwaarden
      worden bepaald, dat het tweede lid op verzoek van een gemeente die aan een persoon als bedoeld in het eerste lid
      een uitkering verstrekt, niet van toepassing is op in die algemene maatregel van bestuur aangewezen categorieën
      van uitkeringsgerechtigden.

      6 De gemeente draagt zorg voor doeltreffende voorlichting in de gemeente aangaande de voorzieningen van deze wet,
      alsmede voor de realisatie en vormgeving van cliëntenparticipatie bij de uitvoering van deze wet.

      7 Indien de gemeente ter uitvoering van de taak bedoeld in deze wet ten aanzien
      van een persoon een plan heeft opgesteld of heeft laten opstellen, gericht op het
      vergroten van de mogelijkheden tot inschakeling in het arbeidsproces, wordt, indien die
      verplichting niet reeds voortvloeit uit [artikel 70 van de Algemene bijstandswet][ref5],
      [artikel 18 van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref6] of
      [artikel 18 van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref7],
      een exemplaar daarvan door die persoon voor gezien getekend en aan het gemeentebestuur verstrekt. Het plan wordt
      tevens getekend door het gemeentebestuur.


