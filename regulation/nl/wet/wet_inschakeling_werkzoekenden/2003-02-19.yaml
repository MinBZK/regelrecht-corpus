  - number: '23'
    text: |-
      1 De dienstbetrekking met de jongere, die op de dag voorafgaande aan de datum van inwerkingtreding van deze wet,
      bestaat krachtens hoofdstuk V van de Jeugdwerkgarantiewet, zoals die luidde tot die datum, en die na die datum
      voortbestaat, wordt met ingang van de datum van inwerkingtreding van deze wet aangemerkt als de dienstbetrekking,
      bedoeld in artikel 9 van deze wet, met een wekelijkse arbeidsduur, gelijk aan die welke krachtens die
      Jeugdwerkgarantiewet was overeengekomen, met dien verstande dat:

      a. in afwijking van [artikel 11][ref1], de dienstbetrekking van de jongere die op de datum van inwerkingtreding van
      deze wet 21 jaar of ouder is, wordt opgezegd tegen de dag gelegen twee jaar na de datum van inwerkingtreding van
      deze wet, tenzij hij eerder de leeftijd van 27 jaar bereikt, in welk geval de dienstbetrekking wordt opgezegd tegen
      de dag waarop hij die leeftijd bereikt;

      b. deze dienstbetrekking niet in aanmerking wordt genomen bij de toepassing van
      [artikel 6, eerste lid, onderdeel a][ref2].

      2 Indien de jongere in het kader van de dienstbetrekking op grond van de Jeugdwerkgarantiewet, zoals die luidde tot
      de datum van inwerkingtreding van deze wet, scholing volgt, worden, in afwijking van [artikel 4, vierde lid][ref3],
      alle scholingsuren voor de duur van de scholing beschouwd als arbeidsuren.

      3 De voorbereidingsovereenkomsten met de jongere, die op de dag voorafgaande aan de datum van inwerkingtreding
      van deze wet bestaan krachtens hoofdstuk Va van de Jeugdwerkgarantiewet, zoals die luidde tot die datum, eindigen
      met ingang van de datum van inwerkingtreding van deze wet, met dien verstande dat de jongere die op de datum van
      inwerkingtreding van deze wet jonger is dan 18 jaar, tot aan de dag, dat hij de leeftijd van 18 jaar bereikt, een
      vergoeding ontvangt als bedoeld in artikel 16d van de Jeugdwerkgarantiewet, zoals dat artikel luidde tot de datum
      van inwerkingtreding van deze wet.

      4 Voor de jongere van 21 jaar of ouder, die op de datum van inwerkingtreding van deze wet als werkloos werkzoekende
      staat ingeschreven bij de Arbeidsvoorzieningsorganisatie en die geen dienstbetrekking heeft krachtens hoofdstuk
      V van de Jeugdwerkgarantiewet, zoals die luidde tot die datum, dan wel met wie geen voorbereidingsovereenkomst is
      aangegaan krachtens hoofdstuk Va van die Jeugdwerkgarantiewet, is [artikel 9][ref4] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009083#Artikel11
