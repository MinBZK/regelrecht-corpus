  - number: '25'
    text: |-
      Het recht, zoals dat voorafgaande aan de datum van inwerkingtreding van deze wet gold, blijft van toepassing:

      a. voor de vergoedingen van het Rijk aan de gemeenten over tijdvakken voorafgaande aan de datum van
      inwerkingtreding van deze wet op grond van de Jeugdwerkgarantiewet, zoals die luidde tot de datum van
      inwerkingtreding van deze wet, de Rijksbijdrageregeling banenpools en andere regelingen betreffende subsidies aan
      gemeenten, zoals deze regelingen luidden tot de datum van inwerkingtreding van deze wet en die zijn ingetrokken in
      verband met de inwerkingtreding van deze wet;

      b. ten aanzien van de mogelijkheid om bezwaar te maken of beroep in te stellen tegen een besluit, dat is genomen op
      grond van de bij onderdeel a genoemde wet of regelingen;

      c. voor de behandeling van het bezwaar en beroep, dat voor de datum van de inwerkingtreding van deze wet is
      gemaakt respectievelijk ingesteld tegen een besluit dat is genomen op grond van de bij onderdeel a genoemde wet
      of regelingen.
    url: https://wetten.overheid.nl/BWBR0009083/2003-02-19#Artikel25
