      1 Het gemeentebestuur en de krachtens [artikel 8, eerste lid][ref1], aangewezen rechtspersoon verstrekken
      desgevraagd aan Onze Minister kosteloos alle inlichtingen, die hij nodig heeft voor de informatievoorziening en de
      beleidsvorming met betrekking tot deze wet.

      2 Bij ministeriële regeling kunnen regels worden gesteld voor de inhoud, de wijze van verstrekken en het tijdstip
      van het verstrekken van de inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009083#Artikel8
