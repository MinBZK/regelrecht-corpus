  - number: '4'
    text: |-
      1 De gemeente kan ter uitvoering van [artikel 2][ref1] aan langdurig werklozen en jongeren een dienstbetrekking
      aanbieden krachtens arbeidsovereenkomst als bedoeld in artikel 610, eerste lid, van Boek 7 van het Burgerlijk
      Wetboek. Op deze arbeidsovereenkomst zijn de bepalingen van titel 10 van Boek 7 van het Burgerlijk Wetboek van
      toepassing.

      2 De gemeente stelt de werknemer voor het verrichten van arbeid ter beschikking aan een onderneming. De ter
      beschikkingstelling wordt vastgelegd in een schriftelijke overeenkomst, waarin in ieder geval de aard en
      duur van de door de werknemer te verrichten werkzaamheden, de plaats waar de werkzaamheden worden verricht,
      een voorrangspositie bij werving en selectie ten opzichte van niet in de onderneming werkzame personen en de
      begeleiding van de werknemer worden geregeld.

      3 Ter uitvoering van [artikel 2][ref2] voorziet de gemeente mede in activiteiten die voorbereiden tot de
      dienstbetrekking en bijdragen aan het vergroten van de gewenste kwalificaties voor die dienstbetrekking.

      4 De werknemer kan in het kader van de dienstbetrekking in plaats van arbeid te verrichten deelnemen aan
      scholing die bijdraagt aan het vergroten van de kans op arbeid anders dan op grond van deze wet, voor zover in de
      dienstbetrekking ten minste 19 uur per week arbeid wordt verricht.

      5 Bij ministeriële regeling wordt in overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschappen
      bepaald onder welke voorwaarden de werknemer bij een werkgever de beroepspraktijkvorming van de beroepsbegeleidende
      leerweg op grond van de [Wet educatie en beroepsonderwijs][ref3] kan volgen in combinatie met de dienstbetrekking.

      6 Indien het aan de werknemer is te wijten, dat de aangeboden werkzaamheden niet worden verricht, is de gemeente
      geheel of gedeeltelijk geen loon verschuldigd.

      7 Onverminderd de bepalingen van titel 10 van Boek 7 van het Burgerlijk Wetboek, wordt de dienstbetrekking
      opgezegd, indien de werknemer:

      a. een aanbod tot passende arbeid in een arbeidsverhouding anders dan een dienstbetrekking heeft geweigerd te
      aanvaarden;

      b. onderwijs of een beroepsopleiding gaat volgen als bedoeld in de[ Wet studiefinanciering 2000][ref4] of in
      [hoofdstuk 3][ref5] of [4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref6].


