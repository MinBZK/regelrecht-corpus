  - number: '19'
    text: |-
      1 Het gemeentebestuur voert ten behoeve van een getrouwe weergave van de uitvoering van deze wet en een effectief
      uitvoeringsproces een zodanige administratie, dat een juiste, volledige en tijdige vastlegging is gewaarborgd van
      de besluiten inzake de uitvoering van hoofdstuk 2 en van de hierop betrekking hebbende bescheiden.

      2 De administratie van de gemeente wordt zodanig ingericht en gevoerd dat alle van belang zijnde vastleggingen
      en bewijsstukken ten behoeve van het besluitvormings-, uitvoerings-, controle- en verantwoordingsproces zichtbaar
      en controleerbaar zijn vastgelegd, de samenhang tussen de vastleggingen en bescheiden daaruit blijkt en de
      specificatie per persoon, voor zover nodig voor de vaststelling van de subsidie, kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009083/2003-02-19#Artikel19
  - number: '20'
    text: |-
      1 Onze Minister is verantwoordelijk voor het toezicht op de uitvoering van deze wet door het gemeentebestuur.

      2 Dit toezicht wordt onder gezag van Onze Minister uitgeoefend door de Inspectie Werk en Inkomen,
      genoemd in [hoofdstuk 7 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1],
      onder leiding van het hoofd van die inspectie. De [artikelen 37][ref2], [38][ref3], [42][ref4] en
      [44 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5] zijn van overeenkomstige toepassing.

      3 Onze Minister kan een gemeentebestuur aanwijzingen geven met betrekking tot de uitvoering van deze wet door dat
      gemeentebestuur. Hij treedt daarbij niet in individuele gevallen.

      4 Ten behoeve van het toezicht, bedoeld in het eerste lid, dient het gemeentebestuur jaarlijks bij Onze
      Minister een verslag in over de uitvoering van deze wet. Het verslag omvat mede een kostenopgave ten behoeve
      van de subsidievaststelling. Het verslag is voorzien van een verklaring van de accountant, belast met de in
      [artikel 213 van de Gemeentewet][ref6] voorgeschreven controle omtrent de juistheid en volledigheid van verstrekte
      gegevens. Het verslag wordt kosteloos verstrekt.

      5 Het gemeentebestuur en de krachtens [artikel 8, eerste lid][ref7], aangewezen rechtspersonen, verstrekken ten
      behoeve van het toezicht desgevraagd aan Onze Minister kosteloos nadere of andere informatie en verlenen hem inzage
      in de administratie.

      6 Bij ministeriële regeling worden regels gesteld inzake het verslag en over de verklaring en het onderzoek dat
      resulteert in deze verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk7
