articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *aanhoudings- en ondersteuningsteams:* teams als bedoeld in
      [artikel 11, onder a, van het Besluit beheer politie][ref1];
        - *bijzondere bijstandseenheid:* de bijzondere bijstandseenheid, bedoeld in [artikel 2, eerste lid][ref2];
        - *Dienst speciale interventies:* de dienst, bedoeld in [artikel 11 van het Besluit beheer politie][ref3].


