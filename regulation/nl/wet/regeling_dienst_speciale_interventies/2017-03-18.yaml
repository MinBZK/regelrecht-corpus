  - number: '2'
    text: |-
      1 Er is een bijzondere bijstandseenheid die in het kader van de strafrechtelijke handhaving van de rechtsorde de
      volgende taken heeft:

      a. het bestrijden van alle vormen van ernstig geweld dan wel terrorisme over het gehele geweldsspectrum;

      b. de beveiliging van personen en objecten in bijzondere situaties, waaronder het beveiligen van ambtenaren van de
      Algemene inlichtingen- en veiligheidsdienst bij operaties van die dienst;

      c. het uitvoeren van andere door de Ministers van Veiligheid en Justitie en van Defensie opgedragen bijzondere
      onderdelen van de politietaak.

      2 De bijzondere bijstandseenheid bestaat uit de volgende onderdelen:

      a. de Afdeling interventies;

      b. de Afdeling expertise en operationele ondersteuning en

      c. de Unit interventie mariniers.

      3 De Dienst speciale interventies houdt de onderdelen, genoemd in het tweede lid, onder a en b, in stand. Het
      beheer van het onderdeel genoemd in het tweede lid, onder c, berust bij de Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0026381/2017-03-18#Artikel2
  - number: '3'
    text: |-
      De Afdeling expertise en operationele ondersteuning is belast met het geven van technische en operationele
      ondersteuning, waaronder het geven van langeafstandsprecisievuur, aan de aanhoudings- en ondersteuningsteams,
      de eenheden van de Koninklijke marechaussee die zijn belast met dezelfde taken als deze teams, de Afdeling
      interventies en de Unit interventie mariniers.
    url: https://wetten.overheid.nl/BWBR0026381/2017-03-18#Artikel3
  - number: '4'
    text: |-
      De Dienst speciale interventies wordt geleid door het hoofd van de Dienst speciale interventies. Het hoofd kan
      worden vervangen door het plaatsvervangend hoofd.
    url: https://wetten.overheid.nl/BWBR0026381/2017-03-18#Artikel4
  - number: '6'
    text: |-
      1 De voorzitter van het College van procureurs-generaal is bevoegd in naam van de Minister van Veiligheid en
      Justitie te beslissen op een verzoek tot bijstand van de bijzondere bijstandseenheid, tenzij het een situatie
      betreft:

      a. waarvoor geen standaard inzetscenario als bedoeld in [artikel 8, eerste lid][ref1], voorhanden is; of

      b. waarin zich meerdere incidenten op verschillende locaties tegelijkertijd voordoen, waartussen vermoedelijk een
      verband bestaat; of

      c. waarin op enige andere wijze een groot nationaal belang in het geding is.

      2 De voorzitter van het College van procureurs-generaal brengt de Minister van Veiligheid en Justitie onmiddellijk
      in kennis van zijn beslissing tot bijstandverlening door de bijzondere bijstandseenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0026381#Artikel8
    url: https://wetten.overheid.nl/BWBR0026381/2017-03-18#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0026381
        artikel: '8'
  - number: '7'
    text: |-
      1 Alvorens overgegaan wordt tot de inzet van de bijzondere bijstandseenheid stelt het hoofd van de Dienst speciale
      interventies een operationeel plan van inzet op.

      2 In het operationeel plan wordt opgenomen welk onderdeel van de bijzondere bijstandseenheid, of combinatie
      daarvan, wordt ingezet en op welke wijze dit plaatsvindt. Dit voorstel wordt gebaseerd op:

      a. de mate van het te verwachten geweld, en

      b. de situatie van de dreiging.

      3 Het operationeel plan van inzet behoeft goedkeuring van de Minister van Veiligheid en Justitie, dan wel van
      de voorzitter van het College van procureurs-generaal indien hij bevoegd is te beslissen over een verzoek tot
      bijstand.
    url: https://wetten.overheid.nl/BWBR0026381/2017-03-18#Artikel7
  - number: '8'
    text: |-
      1 De Ministers van Veiligheid en Justitie en van Defensie stellen gezamenlijk standaard inzetscenario’s vast ten
      behoeve van de inzet van de bijzondere bijstandseenheid.

      2 Het hoofd van de Dienst speciale interventies neemt bij het opstellen van het operationeel plan de
      standaardscenario’s in acht.

      3 Indien er voor de inzet van de bijzondere bijstandseenheid geen standaard inzetscenario voorhanden is, raadpleegt
      de Minister van Veiligheid en Justitie, indien mogelijk, de Minister van Defensie voorafgaand aan de goedkeuring
      van het operationeel plan van inzet.
    url: https://wetten.overheid.nl/BWBR0026381/2017-03-18#Artikel8
  - number: '9'
    text: |-
      1 Het hoofd van de Dienst speciale interventies is belast met de algehele leiding tijdens de inzet van de
      bijzondere bijstandseenheid alsmede over de onderdelen van de politie of van de krijgsmacht die ter ondersteuning
      van de bijzondere bijstandseenheid worden ingezet.

      2 De commandant van het betrokken onderdeel van de bijzondere bijstandseenheid is belast met de operationele
      leiding ter plaatse en staat onder direct bevel van het hoofd van de Dienst speciale interventies. Indien meerdere
      onderdelen worden ingezet wijst het hoofd van de Dienst speciale interventies een operationeel commandant aan.

      3 Wanneer de Afdeling expertise en operationele ondersteuning wordt ingezet tezamen met een aanhoudings- en
      ondersteuningsteam of een eenheid van de Koninklijke marechaussee die is belast met dezelfde taken als dit team
      kan, in afwijking van het tweede lid, het hoofd van de Dienst speciale interventies de chef van dit team of deze
      eenheid belasten met de operationele leiding.

      4 Het hoofd van de Dienst speciale interventies draagt in samenwerking met de operationeel commandant zorg voor de
      chronologische verslaglegging van het feitelijke optreden.
    url: https://wetten.overheid.nl/BWBR0026381/2017-03-18#Artikel9
