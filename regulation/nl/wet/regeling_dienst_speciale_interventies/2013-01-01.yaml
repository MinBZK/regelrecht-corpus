articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *aanhoudings- en ondersteuningseenheden:* eenheden als bedoeld in
      [artikel 18 van de Regeling beheer politie][ref1] en eenheden van de Koninklijke marechaussee die met dezelfde
      taken zijn belast.


      [ref1]: https://wetten.overheid.nl/BWBR0032673#Artikel18
    url: https://wetten.overheid.nl/BWBR0026381/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0032673
        artikel: '18'
  - number: '2'
    text: |-
      1 Er is een Dienst speciale interventies die in het kader van de strafrechtelijke handhaving van de rechtsorde de
      volgende taken heeft:

      a. het bestrijden van alle vormen van ernstig geweld dan wel terrorisme over het gehele geweldsspectrum;

      b. de beveiliging van personen en objecten in bijzondere situaties, waaronder het beveiligen van ambtenaren van de
      Algemene inlichtingen- en veiligheidsdienst bij operaties van die dienst;

      c. het uitvoeren van andere door de Ministers van Veiligheid en Justitie en van Defensie opgedragen bijzondere
      onderdelen van de politietaak.

      2 De Dienst speciale interventies bestaat uit de volgende eenheden:

      a. de Unit interventie;

      b. de Unit expertise & operationele ondersteuning;

      c. de Unit interventie mariniers.

      3 De Dienst speciale interventies wordt geleid door het hoofd van de Dienst speciale interventies. Het hoofd kan
      worden vervangen door het plaatsvervangend hoofd.

      4 De Dienst speciale interventies is een bijstandseenheid als bedoeld in
      [artikel 59, eerste lid, van de Politiewet 2012][ref1] en bestaat uit ambtenaren van de krijgsmacht en ambtenaren
      van politie.

      5 Het beheer van de Dienst speciale interventies berust bij de Landelijke eenheid politiediensten, met uitzondering
      van de Unit interventie mariniers waarvan het beheer berust bij de Minister van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel59
    url: https://wetten.overheid.nl/BWBR0026381/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '59'
  - number: '3'
    text: |-
      De Unit expertise & operationele ondersteuning is belast met het geven van technische en operationele
      ondersteuning, waaronder het geven van langeafstandsprecisievuur, aan de Unit interventie, de Unit interventie
      mariniers en de aanhoudings- en ondersteuningseenheden.
    url: https://wetten.overheid.nl/BWBR0026381/2013-01-01#Artikel3
  - number: '6'
    text: |-
      1 De voorzitter van het College van procureurs-generaal is bevoegd in naam van de Minister van Veiligheid en
      Justitie te beslissen op een verzoek tot bijstand van de Dienst speciale interventies, tenzij het een situatie
      betreft:

      a. waarvoor geen standaard inzetscenario als bedoeld in [artikel 8, eerste lid][ref1], voorhanden is; of

      b. waarin zich meerdere incidenten op verschillende locaties tegelijkertijd voordoen, waartussen vermoedelijk een
      verband bestaat; of

      c. waarin op enige andere wijze een groot nationaal belang in het geding is.

      2 De voorzitter van het College van procureurs-generaal brengt de Minister van Veiligheid en Justitie onmiddellijk
      in kennis van zijn beslissing tot bijstandverlening door de Dienst Speciale Interventies.


      [ref1]: https://wetten.overheid.nl/BWBR0026381#Artikel8
    url: https://wetten.overheid.nl/BWBR0026381/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0026381
        artikel: '8'
  - number: '7'
    text: |-
      1 Alvorens overgegaan wordt tot de inzet van de DSI stelt het hoofd van de Dienst speciale interventies een
      operationeel plan van inzet op.

      2 In het operationeel plan wordt opgenomen welke eenheid van de Dienst speciale interventies, of combinatie
      daarvan, wordt ingezet en op welke wijze dit plaatsvindt. Dit voorstel wordt gebaseerd op:

      a. de mate van het te verwachten geweld, en

      b. de situatie van de dreiging.

      3 Het operationeel plan van inzet behoeft goedkeuring van de Minister van Veiligheid en Justitie, dan wel van
      de voorzitter van het College van procureurs-generaal indien hij bevoegd is te beslissen over een verzoek tot
      bijstand.
    url: https://wetten.overheid.nl/BWBR0026381/2013-01-01#Artikel7
  - number: '8'
    text: |-
      1 De Ministers van Veiligheid en Justitie en van Defensie stellen gezamenlijk standaard inzetscenario’s vast ten
      behoeve van de inzet van de Dienst speciale interventies.

      2 Het hoofd van de Dienst speciale interventies neemt bij het opstellen van het operationeel plan de
      standaardscenario’s in acht.

      3 Indien er voor de inzet van de Dienst speciale interventies geen standaard inzetscenario voorhanden is,
      raadpleegt de Minister van Veiligheid en Justitie, indien mogelijk, de Minister van Defensie voorafgaand aan de
      goedkeuring van het operationeel plan van inzet.
    url: https://wetten.overheid.nl/BWBR0026381/2013-01-01#Artikel8
  - number: '9'
    text: |-
      1 Het hoofd van de Dienst speciale interventies is belast met de algehele leiding tijdens de inzet van de Dienst
      speciale interventies alsmede over de eenheden die ter ondersteuning van de Dienst speciale interventies worden
      ingezet.

      2 De commandant van de betrokken eenheid van de Dienst speciale interventies is belast met de operationele leiding
      ter plaatse en staat onder direct bevel van het hoofd van de Dienst speciale interventies. Indien meerdere eenheden
      worden ingezet wijst het hoofd van de Dienst speciale interventies een operationeel commandant aan.

      3 Wanneer de Unit expertise & operationele ondersteuning wordt ingezet tezamen met een aanhoudings- en
      ondersteuningseenheid kan, in afwijking van het tweede lid, het hoofd van de Dienst speciale interventies de chef
      van de aanhoudings- en ondersteuningseenheid belasten met de operationele leiding.

      4 Het hoofd van de Dienst speciale interventies draagt in samenwerking met de operationeel commandant zorg voor de
      chronologische verslaglegging van het feitelijke optreden.
    url: https://wetten.overheid.nl/BWBR0026381/2013-01-01#Artikel9
