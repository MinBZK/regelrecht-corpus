  text: |-
    Gelet op de artikelen 48a, eerste lid, 49, 59, tweede lid, en 60 van de Politiewet 1993, artikel 10:3 van de
    Algemene wet bestuursrecht en artikel 3a van de Wet wapens en munitie;

