preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een wettelijk kader te scheppen voor de financiële
    verstrekkingen ten laste van de begroting van het Ministerie van Financiën;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007886/2015-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:

      a. Onze Minister: Onze Minister van Financiën;

      b. ondernemer:

      1°. een natuurlijk persoon die belastbare winst uit onderneming in de zin van de
      [Wet inkomstenbelasting 2001][ref1] geniet;

      2°. een belastingplichtige in de zin van de [Wet op de vennootschapsbelasting 1969][ref2];

      c. verstrekking van financiële middelen: de terbeschikkingstelling van financiële middelen, anders dan als betaling
      voor zaken of diensten of ter voldoening aan een verplichting tot schadevergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
      [ref2]: https://wetten.overheid.nl/BWBR0002672
    url: https://wetten.overheid.nl/BWBR0007886/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011353
      - id: ref2
        bwb_id: BWBR0002672
  - number: '2'
    text: |-
      In overeenstemming met Onze Minister van Economische Zaken kan Onze Minister subsidies in de vorm van garanties
      verlenen in verband met aan ondernemers te verstrekken financiële middelen door financiële ondernemingen
      met zetel in Nederland die een vergunning hebben voor het uitoefenen van het bedrijf van bank ingevolge de
      [Wet op het financieel toezicht][ref1] en die voldoen aan nader door Onze Minister te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0007886/2015-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '3'
    text: |-
      1 In overeenstemming met Onze Minister voor Buitenlandse Handel en Ontwikkelingssamenwerking kan Onze Minister
      verzekeringen afsluiten en garanties afgeven ter dekking van risico’s verbonden aan het handels- en dienstenverkeer
      van ondernemers met landen buiten Nederland.

      2 In overeenstemming met Onze Minister voor Buitenlandse Handel en Ontwikkelingssamenwerking kan Onze Minister
      verzekeringen afsluiten met ondernemers ter dekking van niet-commerciële risico’s verbonden aan investeringen van
      die ondernemers in een land buiten Nederland.

      3 In overeenstemming met Onze Minister voor Buitenlandse Handel en Ontwikkelingssamenwerking kan Onze Minister
      verzekeringen en garanties zowel geheel als gedeeltelijk in herverzekering nemen voor zover deze verzekeringen en
      garanties zijn afgesloten ter dekking van risico’s verbonden aan het handels- en dienstenverkeer van ondernemers
      met landen buiten Nederland, mits die verzekeringen en garanties zijn afgesloten door:

      a. de Multilateral Investment Guarantee Agency van de Wereldbank;

      b. een buitenlandse staat of een instantie, door of vanwege een buitenlandse staat belast met het afsluiten
      van verzekeringen of het afgeven van garanties ter dekking van risico’s die verbonden zijn aan het handels- en
      dienstenverkeer met andere landen dan die buitenlandse staat.

      4 Onze Minister draagt, in overeenstemming met Onze Minister voor Buitenlandse Handel en Ontwikkelingssamenwerking,
      zorg voor een optimaal beheer en goede spreiding van de financiële risico’s die voor de Staat voortvloeien uit het
      in verzekering nemen of garanderen van risico’s als bedoeld in het eerste lid. Onze Minister zal daarbij slechts
      instrumenten inzetten op een wijze die de financiële risico’s voor de Staat beoogt te beperken. Onze Minister
      rapporteert de Tweede Kamer der Staten-Generaal in het Financieel Jaarverslag over de ingezette instrumenten.

      5 Ter uitvoering van dit artikel kunnen bij regeling van Onze Minister van Financiën nadere regels gesteld worden.

      6 Ter uitvoering van dit artikel kan Onze Minister van Financiën bijzondere volmacht verlenen aan één of meer
      rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0007886/2015-01-01#Artikel3
  - number: '4'
    text: |-
      Onze Minister kan aan een naamloze of besloten vennootschap waarvan de Staat in het aandelenkapitaal deelneemt, een
      subsidie in de vorm van een garantie verlenen, mits de begroting van zijn ministerie, dan wel de daarbij behorende
      toelichting de naam van de betrokken vennootschap vermeldt.
    url: https://wetten.overheid.nl/BWBR0007886/2015-01-01#Artikel4
  - number: '7'
    text: |-
      1 De Wet herverzekering investeringen wordt ingetrokken.

      2 De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007886/2015-01-01#Artikel7
  - number: '8'
    text: 'Deze wet kan worden aangehaald als: Kaderwet financiële verstrekkingen Financiën.'
    url: https://wetten.overheid.nl/BWBR0007886/2015-01-01#Artikel8
