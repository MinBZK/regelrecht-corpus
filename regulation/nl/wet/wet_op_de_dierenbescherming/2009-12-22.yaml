  - number: '5'
    text: |-
      De bij of krachtens [dit hoofdstuk][ref1] strafbaar gestelde feiten zijn overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002351#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0002351/2009-12-22#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002351
        hoofdstuk: I
  - number: '6'
    text: |-
      1 De opsporingsambtenaren zijn bevoegd tot het opsporen van de bij of krachtens dit hoofdstuk strafbaar gestelde
      feiten elke plaats te betreden, waar redelijkerwijs vermoed kan worden, dat een zodanig strafbaar feit wordt
      begaan.

      2 Zij zijn te allen tijde bevoegd ter inbeslagneming de uitlevering te vorderen van alle voor inbeslagneming
      vatbare voorwerpen.
    url: https://wetten.overheid.nl/BWBR0002351/2009-12-22#Artikel6
  - number: '11'
    text: De Trekhondenwet wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002351/2009-12-22#Artikel11
  - number: '12'
    text: Deze wet kan worden aangehaald als "Wet op de dierenbescherming".
    url: https://wetten.overheid.nl/BWBR0002351/2009-12-22#Artikel12
  - number: '13'
    text: |-
      [De artikelen 2][ref1] en [3][ref2], het bepaalde [onder ][ref3] van
      [artikel 455 van het Wetboek van Strafrecht][ref4], zoals dit ingevolge [artikel 8][ref5] luidt, en
      [artikel 11][ref6] treden in werking op door Ons te bepalen tijdstippen.


