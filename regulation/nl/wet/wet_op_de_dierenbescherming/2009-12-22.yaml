preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de artikelen 254 en 455 van het Wetboek van Strafrecht
    te wijzigen en enige andere voorzieningen op het gebied der dierenbescherming te treffen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002351/2009-12-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Wij stellen bij algemene maatregel van bestuur regelen nopens het houden van een waak- of heemhond en nopens het
      houden van mestkalveren.

      2 Overtreding van deze regelen wordt gestraft met hechtenis van ten hoogste een maand of geldboete van de tweede
      categorie.
    url: https://wetten.overheid.nl/BWBR0002351/2009-12-22#Artikel1
  - number: '2'
    text: |-
      1 Het is verboden zonder vergunning van burgemeester en wethouders als bedrijf uit te oefenen het kopen, ten
      verkoop voorradig hebben, verkopen, in bewaring nemen, africhten of doden van honden of katten. Aan de vergunning
      kunnen voorschriften worden verbonden.

      2 Een belanghebbende kan tegen een beschikking als bedoeld in het eerste lid beroep instellen bij gedeputeerde
      staten.

      3 Wij stellen terzake bij algemene maatregel van bestuur nadere regelen.

      4 Overtreding van het in het eerste lid gestelde verbod of van een krachtens dat lid gegeven voorschrift wordt
      gestraft met hechtenis van ten hoogste veertien dagen of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0002351/2009-12-22#Artikel2
  - number: '3'
    text: |-
      1 Het is verboden zonder vergunning van of vanwege Onze Minister van Onderwijs, Kunsten en Wetenschappen een
      inrichting te houden, waar dieren van bij algemene maatregel van bestuur aangewezen soorten of groepen van soorten
      worden tentoongesteld of vertoond, afgericht, dan wel ten verkoop voorradig worden gehouden. Aangewezen worden
      slechts in Nederland niet in het wild levende soorten, met uitzondering van honden, katten en soorten van dieren,
      welke in Nederland plegen te worden gehouden met het oog op een door het dier te leveren of daarvan afkomstig goed
      of in verband met de trekkracht van het dier.

      2 Wij kunnen bij algemene maatregel van bestuur ten aanzien van bepaalde groepen van inrichtingen al dan niet voor
      bepaalde soorten van dieren ontheffing verlenen van het in het vorige lid gestelde verbod.

      3 Aan de vergunning kunnen voorschriften worden verbonden teneinde een behoorlijke verzorging en behandeling van de
      dieren te verzekeren.

      4 Ten aanzien van bij algemene maatregel van bestuur aangewezen zeldzame diersoorten kunnen de voorschriften ook
      strekken tot bevordering van de instandhouding van de soort.

      5 Een vergunning kan slechts worden geweigerd, indien de in het derde en vierde lid bedoelde oogmerken niet in
      voldoende mate door het geven van voorschriften kunnen worden verwezenlijkt.

      6 Een vergunning wordt verleend voor bepaalde of onbepaalde tijd; zij kan te allen tijde worden ingetrokken, indien
      de daaraan verbonden voorschriften niet zijn nageleefd of op grond van omstandigheden, die, waren zij ten tijde van
      het verlenen van de vergunning bekend geweest, tot een andere beslissing zouden hebben geleid.

      7 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent het indienen van een
      aanvraag tot verlening of wijziging van een vergunning en omtrent de behandeling daarvan.

      8 Overtreding van het in het eerste lid gestelde verbod of van een krachtens het derde of vierde lid gegeven
      voorschrift wordt gestraft met hechtenis van ten hoogste veertien dagen of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0002351/2009-12-22#Artikel3
  - number: '4'
    text: |-
      1 De bezoldigde ambtenaren van de rijks- en gemeentepolitie, alsmede de daartoe door Onze Minister van Justitie
      aangewezen onbezoldigde ambtenaren van de rijks- en gemeentepolitie, zijn bevoegd:

      a. honden en katten op te vangen, die tussen zonsondergang en zonsopgang elders dan op het erf van de eigenaar of
      houder zonder toezicht worden aangetroffen;

      b. honden en katten, die zich zonder toezicht bevinden op erven of in het veld als bedoeld in
      [artikel 1 van de Jachtwet][ref1], en welke een onmiddellijk gevaar vormen voor zich op het erf of in het veld
      bevindende dieren, waarvan de instandhouding gewenst is, te vangen en, als geen ander middel tot afwering van het
      gevaar ten dienste staat, te doden.

      2 Het hoofd van de plaatselijke politie van de gemeente waar de hond of de kat is gevangen of gedood, geeft van
      dit vangen of doden bericht aan de eigenaar of houder van het dier indien deze bekend is. De eigenaar of houder
      is verplicht het dier, indien dit nog in leven is, binnen twee weken na de datum van het bericht op te halen of te
      doen ophalen.

      3 Niet nakoming van de in lid 2 gestelde plicht wordt gestraft met geldboete van de eerste categorie.

      4 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het in de
      voorgaande leden bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0002155#Artikel1
    url: https://wetten.overheid.nl/BWBR0002351/2009-12-22#Artikel4
