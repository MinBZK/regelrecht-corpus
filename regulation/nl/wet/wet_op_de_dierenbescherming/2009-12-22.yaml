  - number: '14'
    text: |-
      De bevoegdheid aan de Provinciale Staten krachtens artikel 140, eerste lid, der provinciale wet, en aan de
      gemeenteraad krachtens [artikel 168 der gemeentewet][ref1] toekomende, blijft ten aanzien van het onderwerp, waarin
      deze wet voorziet, gehandhaafd, voor zover de door deze colleges te maken verordeningen niet met deze wet of de
      daarop steunende voorschriften in strijd zijn.


