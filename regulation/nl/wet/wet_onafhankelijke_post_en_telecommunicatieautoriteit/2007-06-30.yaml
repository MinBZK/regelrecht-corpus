regulatory_layer: WET
publication_date: '2004-01-27'
valid_from: '2007-06-30'
bwb_id: BWBR0008807
url: https://wetten.overheid.nl/BWBR0008807/2007-06-30
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, teneinde de onafhankelijkheid van de uitvoering van
    bepaalde overheidstaken op het gebied van post en telecommunicatie te waarborgen, deze taken op te dragen aan een
    bij wet in te stellen zelfstandig bestuursorgaan;

    dat de uitoefening van deze taken geschiedt in het belang van de doelmatige verzorging van post en telecommunicatie
    en de daartoe tot stand te brengen mededinging in de post- en telecommunicatiesector;

    dat deze taken met name betreffen het houden van toezicht op de naleving van specifieke bepalingen van de Postwet,
    de Wet op de telecommunicatievoorzieningen en de Vergunningenwet kabelgebonden telecommunicatie-infrastructuur
    alsmede het geven van specifieke beschikkingen op grond van die wetten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008807/2007-06-30#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Verkeer en Waterstaat;

      b. college: het in [artikel 2][ref1] bedoelde college.


      [ref1]: https://wetten.overheid.nl/BWBR0008807#Artikel2
    url: https://wetten.overheid.nl/BWBR0008807/2007-06-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008807
        artikel: '2'
        hoofdstuk: '2'
  - number: '2'
    text: |-
      1 Er is een college voor de post- en telecommunicatiemarkt, in het maatschappelijk verkeer aangeduid als
      Onafhankelijke Post en Telecommunicatie Autoriteit (OPTA).

      2 Het college bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0008807/2007-06-30#Artikel2
  - number: '3'
    text: |-
      1 Het college bestaat uit ten minste drie en ten hoogste vijf vaste leden, de voorzitter daaronder begrepen.

      2 Onze Minister benoemt, schorst en ontslaat de vaste leden van het college.

      3 Onze Minister benoemt een van de vaste leden van het college tot voorzitter en een tot plaatsvervangend
      voorzitter.

      4 De vaste leden van het college worden benoemd voor een periode van vier jaar.

      5 Een vast lid kan worden herbenoemd.

      6 De vaste leden van het college hebben op persoonlijke titel zitting in het college en oefenen hun functie uit
      zonder last.

      7 De vaste leden van het college kunnen tussentijds, op eigen verzoek, dan wel om zwaarwichtige redenen
      worden ontslagen. Als zwaarwichtige redenen gelden in elk geval ongeschiktheid voor de functie, alsmede de
      onverenigbaarheden van functies of belangen, genoemd in [artikel 4][ref1].

      8 De persoon die tussentijds tot lid wordt benoemd treedt af op het tijdstip waarop de reeds benoemde vaste leden
      aftreden.

      9 Zolang in een vacature van het college niet is voorzien, vormen de overblijvende vaste leden het college, met de
      bevoegdheden van het voltallige college.


      [ref1]: https://wetten.overheid.nl/BWBR0008807#Artikel4
    url: https://wetten.overheid.nl/BWBR0008807/2007-06-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008807
        artikel: '4'
        hoofdstuk: '2'
  - number: '4'
    text: |-
      1 Met het lidmaatschap van het college zijn onverenigbaar:

      a. het werkzaam zijn bij een ministerie of bij een instelling, een dienst of een bedrijf, ressorterende onder de
      verantwoordelijkheid van een minister;

      b. het zitting hebben in een der Kamers der Staten-Generaal, in een provinciaal bestuur of in een gemeentebestuur;

      c. het hebben van financiële of andere belangen bij instellingen of bedrijven, waardoor de onpartijdigheid van het
      betrokken lid in het geding kan zijn.

      2 De vaste leden leggen ten aanzien van het gestelde in het eerste lid, onder c, aan Onze Minister een verklaring
      af.
    url: https://wetten.overheid.nl/BWBR0008807/2007-06-30#Artikel4
  - number: '5'
    text: Bij ministeriële regeling wordt de rechtspositie van de vaste leden van het college vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008807/2007-06-30#Artikel5
  - number: '6'
    text: |-
      1 De voorzitter, of bij diens afwezigheid de plaatsvervangend voorzitter, van het college vertegenwoordigt de
      rechtspersoon Onafhankelijke Post en Telecommunicatie Autoriteit in en buiten rechte.

      2 De voorzitter kan de in het eerste lid bedoelde vertegenwoordiging opdragen aan een door hem aan te wijzen
      persoon.
    url: https://wetten.overheid.nl/BWBR0008807/2007-06-30#Artikel6
  - number: '7'
    text: |-
      1 Het college kan geassocieerde leden benoemen die op één of meer taakgebieden van het college een bijzondere
      deskundigheid bezitten.

      2 Geassocieerde leden nemen op uitnodiging van het college deel aan de vergaderingen van het college. Zij kunnen
      door het college worden betrokken bij de behandeling van aangelegenheden op de taakgebieden ten aanzien waarvan zij
      bijzondere deskundigheid bezitten. De geassocieerde leden hebben een adviserende stem.

      3 [Artikel 4][ref1] is van overeenkomstige toepassing op de geassocieerde leden van het college.

      4 In afwijking van het derde lid, kunnen geassocieerde leden worden benoemd die beperkte belangen hebben bij
      instellingen of bedrijven in de post- of telecommunicatiemarkt. In dit geval ziet het college erop toe dat deze
      leden niet worden betrokken bij de behandeling van aangelegenheden ten aanzien waarvan belangenverstrengeling zou
      kunnen optreden.

      5 Het college kent aan de geassocieerde leden een vergoeding toe voor de door hen verrichte werkzaamheden.
      Deze vergoeding behoeft de instemming van Onze Minister. De geassocieerde leden hebben aanspraak op
      vergoeding van de door hen in de uitoefening van hun functie gemaakte reis- en verblijfkosten. De
      [artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008807#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel1028
    url: https://wetten.overheid.nl/BWBR0008807/2007-06-30#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008807
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 10:28
  - number: '8'
    text: |-
      Het college stelt een reglement vast. Het reglement behoeft de instemming van Onze Minister. De
      [artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1028
    url: https://wetten.overheid.nl/BWBR0008807/2007-06-30#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 10:28
  - number: '9'
    text: |-
      De inkomsten van het college bestaan uit:

      a. opbrengsten uit door belanghebbenden verschuldigde vergoedingen;

      b. een vergoeding door Onze Minister ten laste van de begroting van het Ministerie van Verkeer en Waterstaat;

      c. andere baten.
    url: https://wetten.overheid.nl/BWBR0008807/2007-06-30#Artikel9
  - number: '10'
    text: |-
      1 Het college stelt voor 1 november een begroting vast voor het volgende kalenderjaar. De begroting behoeft de
      instemming van Onze Minister. De [artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref1] zijn
      van overeenkomstige toepassing.

      2 Het college stelt voor 1 november de meerjarenraming vast voor de komende vijf
      kalenderjaren. De meerjarenraming behoeft de instemming van Onze Minister. De
      [artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1028
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel1028
    url: https://wetten.overheid.nl/BWBR0008807/2007-06-30#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 10:28
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 10:28
  - number: '11'
    text: |-
      De vergaderingen van het college waarin de begroting, de meerjarenraming en het financiële verslag worden
      vastgesteld zijn openbaar.
    url: https://wetten.overheid.nl/BWBR0008807/2007-06-30#Artikel11
  - number: '12'
    text: |-
      1 Het college heeft een secretaris.

      2 De secretaris is geen lid van het college. Hij heeft evenwel in de vergaderingen van het college een adviserende
      stem.

      3 [Artikel 4][ref1] is van overeenkomstige toepassing op de secretaris van het college.


      [ref1]: https://wetten.overheid.nl/BWBR0008807#Artikel4
    url: https://wetten.overheid.nl/BWBR0008807/2007-06-30#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008807
        artikel: '4'
        hoofdstuk: '2'
  - number: '13'
    text: |-
      1 De rechtspositie van het personeel van het college is in overeenstemming met de regels die gelden voor ambtenaren
      die zijn aangesteld bij ministeries, met dien verstande dat waar in deze regels een bevoegdheid is toegekend aan
      een andere minister dan Onze Minister van Binnenlandse Zaken, deze bevoegdheid wordt uitgeoefend door het college.

      2 Bij algemene maatregel van bestuur kan worden afgeweken van de in het eerste lid bedoelde regels.
    url: https://wetten.overheid.nl/BWBR0008807/2007-06-30#Artikel13
  - number: '14'
    text: |-
      Het Besluit voorschrift informatiebeveiliging rijksdienst 1994 is van overeenkomstige toepassing op het college,
      zijn secretaris en zijn personeel.
    url: https://wetten.overheid.nl/BWBR0008807/2007-06-30#Artikel14
  - number: '15'
    text: |-
      Het college heeft tot taak:

      a. het houden van toezicht op de naleving van de bepalingen van:

      1°. de [Postwet][ref1], voorzover deze taak bij [artikel 14b van die wet][ref2] aan het college is toebedeeld;

      2°. de [Telecommunicatiewet][ref3], voorzover deze taak bij
      [artikel 15.1, derde lid, van de Telecommunicatiewet][ref4] aan het college is toebedeeld;

      3°. [verordening (EG) nr. 2887/2000](32000R2887) van het Europees Parlement en de Raad van de Europese Unie van
      18 december 2000 inzake ontbundelde toegang tot het aansluitnetwerk (PbEG L 336/4).

      b. het verrichten van de taken en het uitoefenen van de bevoegdheden die in de [Telecommunicatiewet][ref5] aan het
      college zijn opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0004423
      [ref2]: https://wetten.overheid.nl/BWBR0004423#Artikel14b
      [ref3]: https://wetten.overheid.nl/BWBR0009950
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel15.1
      [ref5]: https://wetten.overheid.nl/BWBR0009950
    url: https://wetten.overheid.nl/BWBR0008807/2007-06-30#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004423
      - id: ref2
        bwb_id: BWBR0004423
        artikel: 14b
      - id: ref3
        bwb_id: BWBR0009950
      - id: ref4
        bwb_id: BWBR0009950
        artikel: '15.1'
      - id: ref5
        bwb_id: BWBR0009950
  - number: '17'
    text: |-
      1 Het college stelt jaarlijks voor 1 april een verslag op van de werkzaamheden, het gevoerde beleid in het algemeen
      en de doelmatigheid en doeltreffendheid van zijn werkzaamheden in het bijzonder in het afgelopen kalenderjaar. Het
      verslag wordt aan Onze Minister toegezonden en algemeen verkrijgbaar gesteld.

      2 Het in het eerste lid bedoelde verslag omvat tevens, met ingang van het tweede verslagjaar, een globale
      beschrijving van de ontwikkeling van de markt in de post- en telecommunicatiesector.
    url: https://wetten.overheid.nl/BWBR0008807/2007-06-30#Artikel17
  - number: '18'
    text: |-
      1 Het college verstrekt desgevraagd aan Onze Minister de voor de uitoefening van zijn taak benodigde inlichtingen.
      Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van zijn
      taak redelijkerwijs nodig is.

      2 Onze Minister verstrekt het college de inlichtingen die het voor zijn taakuitoefening redelijkerwijs nodig heeft.

      3 Onze Minister stelt een informatiestatuut vast. Het informatiestatuut bevat inhoudelijke en procedurele
      voorschriften met betrekking tot gegevensstromen tussen Onze Minister en het college, die voor een goede uitvoering
      van deze wet noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0008807/2007-06-30#Artikel18
  - number: '19'
    text: |-
      1 Onze Minister kan, na overleg met het college, beleidsregels vaststellen met betrekking tot de door het college
      uit te oefenen taken. Indien de beleidsregels betrekking hebben op het opleggen van boetes geeft Onze Minister deze
      in overeenstemming met Onze Minister van Justitie.

      2 De in het eerste lid bedoelde beleidsregels worden bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0008807/2007-06-30#Artikel19
  - number: '20'
    text: |-
      1 Het college brengt jaarlijks aan Onze Minister voor 1 april een financieel verslag uit, dat vergezeld gaat van
      een verklaring omtrent de getrouwheid en de rechtmatigheid, afgegeven door een accountant als bedoeld in artikel
      393 van Boek 2 van het Burgerlijk Wetboek.

      2 Het college stelt de in het eerste lid bedoelde stukken algemeen verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0008807/2007-06-30#Artikel20
  - number: '21'
    text: |-
      Onze Minister kan regels stellen over de inrichting van de begroting, het financieel verslag en aandachtspunten
      voor de accountantscontrole.
    url: https://wetten.overheid.nl/BWBR0008807/2007-06-30#Artikel21
  - number: '22'
    text: |-
      1 De volgende handelingen van het college behoeven de instemming van Onze Minister:

      a. het sluiten van overeenkomsten die een door Onze Minister vast te stellen bedrag te boven gaan;

      b. het handelen in registerzaken;

      c. investeringen die een door Onze Minister vast te stellen bedrag te boven gaan.

      De [artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref1] zijn van overeenkomstige toepassing.

      2 Het is het college verboden:

      a.

      b. rechtspersonen of vennootschappen op te richten of mede op te richten, dan wel daarin deel te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1028
    url: https://wetten.overheid.nl/BWBR0008807/2007-06-30#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 10:28
  - number: '23'
    text: |-
      1 Indien naar het oordeel van Onze Minister het college de uitoefening van zijn taken ernstig verwaarloost, kan
      Onze Minister bepalen dat de bevoegdheden die met die taken verband houden niet langer aan het college toekomen. De
      betrokken taken en bevoegdheden gaan in dat geval over op Onze Minister.

      2 Onze Minister doet binnen drie maanden een voordracht voor een algemene maatregel van bestuur, waarbij wordt
      vastgesteld dat het college zijn taken niet langer naar behoren verrichtte.
    url: https://wetten.overheid.nl/BWBR0008807/2007-06-30#Artikel23
  - number: '24'
    text: |-
      1 Gegevens of inlichtingen omtrent een onderneming, welke in verband met enige werkzaamheid ten behoeve van de
      uitvoering van de taken, genoemd in [artikel 15][ref1], zijn verkregen, mogen uitsluitend voor de uitvoering van
      die taken worden gebruikt.

      2 In afwijking van het eerste lid is het college bevoegd de in dat lid bedoelde gegevens of inlichtingen te
      verstrekken aan een instantie die op grond van bepalingen in andere wetten is belast met de uitvoering van
      toezichthoudende taken, voor zover die gegevens of inlichtingen noodzakelijk zijn voor de uitoefening van de taken
      van die instellingen, mits

      a. de geheimhouding van de gegevens of inlichtingen in voldoende mate is gewaarborgd, en

      b. voldoende is gewaarborgd dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor deze worden verstrekt.

      3 Indien de in het tweede lid bedoelde instantie de bedoelde gegevens of inlichtingen ontvangt, onderzoekt zij of
      er in het onderhavige geval sprake is van een overtreding van de betreffende wettelijke regels.


      [ref1]: https://wetten.overheid.nl/BWBR0008807#Artikel15
    url: https://wetten.overheid.nl/BWBR0008807/2007-06-30#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0008807
        artikel: '15'
        hoofdstuk: '3'
  - number: '25'
    text: |-
      Onze Minister zendt binnen vier jaar na de inwerkingtreding van de wet en vervolgens na iedere vier jaar aan de
      Staten-Generaal een verslag over de doeltreffendheid en doelmatigheid van het functioneren van het college. Dit
      verslag omvat mede een rapportage betreffende de wenselijkheid van het al dan niet voortzetten van het college. Het
      college is gehouden aan deze evaluatie medewerking te verlenen.
    url: https://wetten.overheid.nl/BWBR0008807/2007-06-30#Artikel25
  - number: '30'
    text: |-
      1 Met ingang van de datum van inwerkingtreding van deze wet zijn de personeelsleden van de Directie Toezicht
      Netwerken en Diensten, van wie naam en functie zijn vermeld op een door Onze Minister vastgestelde lijst, van
      rechtswege ontslagen en aangesteld als ambtenaar in dienst van het college.

      2 De overgang van de in het eerste lid bedoelde personeelsleden vindt plaats met een rechtspositie die als geheel
      ten minste gelijkwaardig is aan die welke voor elk van hen gold bij de Directie Toezicht Netwerken en Diensten.

      3 De personen die op het tijdstip van inwerkingtreding van deze wet krachtens een arbeidsovereenkomst naar
      burgerlijk recht behoren tot het personeel van de Directie Toezicht Netwerken en Diensten, waarvan naam en
      functie zijn vermeld op een door Onze Minister vastgestelde lijst, zijn met ingang van dat tijdstip van rechtswege
      ontslagen en aangesteld in dienst van het college met een rechtspositie die in totaliteit ten minste gelijkwaardig
      is aan die welke voor elk van hen gold bij de Directie Toezicht Netwerken en Diensten.
    url: https://wetten.overheid.nl/BWBR0008807/2007-06-30#Artikel30
  - number: '31'
    text: |-
      1 Onze Minister bepaalt in overeenstemming met Onze Minister van Financiën welke vermogensbestanddelen van de Staat
      die aan de Directie Toezicht Netwerken en Diensten worden toegerekend, worden toebedeeld aan het college.

      2 De in het eerste lid bedoelde vermogensbestanddelen gaan met ingang van de datum van inwerkingtreding van deze
      wet onder algemene titel over op het college tegen een door Onze Minister in overeenstemming met Onze Minister van
      Financiën te bepalen waarde.

      3 Ingeval krachtens het eerste en tweede lid registergoederen overgaan, zal verandering in de tenaamstelling
      in de openbare registers, bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1]
      plaatsvinden. De daartoe nodige opgaven worden door de zorg van Onze Minister van Financiën aan de bewaarders van
      de desbetreffende registers gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0008807/2007-06-30#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: '32'
    text: |-
      Archiefbescheiden van de Directie Toezicht Netwerken en Diensten gaan met ingang van de datum van inwerktreding
      van deze wet over naar het college, voor zover zij niet overeenkomstig de [Archiefwet 1995][ref1] zijn overgebracht
      naar een archiefbewaarplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0008807/2007-06-30#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: '33'
    text: |-
      1 In wettelijke procedures en rechtsgedingen, waarbij de Directie Toezicht Netwerken en Diensten is betrokken,
      treedt met ingang van de datum van inwerkingtreding van deze wet het college in de plaats van de Staat dan wel
      Onze Minister.

      2 In zaken waarin voor het tijdstip van inwerkingtreding van deze wet op grond van
      [artikel 12 van de Wet Nationale ombudsman][ref1] aan de Nationale ombudsman is verzocht een onderzoek te doen,
      dan wel de Nationale ombudsman op grond van artikel 15 van die wet een onderzoek heeft ingesteld naar een gedraging
      die kan worden toegerekend aan de Directie Toezicht Netwerken en Diensten, treedt het college op dat tijdstip als
      bestuursorgaan in de zin van de [Wet Nationale Ombudsman][ref2] in de plaats van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003372
    url: https://wetten.overheid.nl/BWBR0008807/2007-06-30#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0003372
  - number: '34'
    text: |-
      1 Uitvoeringstaken, bedoeld in [artikel 15, onder b 1°, 2° en 4°, en onder c][ref1], ook indien deze inhouden de
      behandeling van op de datum van inwerkingtreding van deze wet bij Onze Minister in behandeling zijnde aanvragen en
      verzoeken terzake, worden vanaf die datum verricht door het college.

      2 De door Onze Minister voor de datum van inwerkingtreding van deze wet gegeven beschikkingen, bedoeld in
      [artikel 15, onder b 1°, 2° en 4°, en onder c][ref2], blijven na de datum van inwerkingtreding van deze wet
      van kracht, met dien verstande dat het college vanaf die datum met betrekking tot die beschikkingen en de daaraan
      verbonden voorschriften en beperkingen bevoegd is, zijn taken uit te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0008807#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0008807#Artikel15
    url: https://wetten.overheid.nl/BWBR0008807/2007-06-30#Artikel34
    references:
