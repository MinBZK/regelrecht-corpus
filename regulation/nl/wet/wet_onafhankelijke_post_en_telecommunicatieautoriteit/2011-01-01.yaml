---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_onafhankelijke_post_en_telecommunicatieautoriteit
regulatory_layer: WET
publication_date: '2004-01-27'
valid_from: '2011-01-01'
bwb_id: BWBR0008807
url: https://wetten.overheid.nl/BWBR0008807/2011-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, teneinde de onafhankelijkheid van de uitvoering van
    bepaalde overheidstaken op het gebied van post en telecommunicatie te waarborgen, deze taken op te dragen aan een
    bij wet in te stellen zelfstandig bestuursorgaan;

    dat de uitoefening van deze taken geschiedt in het belang van de doelmatige verzorging van post en telecommunicatie
    en de daartoe tot stand te brengen mededinging in de post- en telecommunicatiesector;

    dat deze taken met name betreffen het houden van toezicht op de naleving van specifieke bepalingen van de Postwet,
    de Wet op de telecommunicatievoorzieningen en de Vergunningenwet kabelgebonden telecommunicatie-infrastructuur
    alsmede het geven van specifieke beschikkingen op grond van die wetten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Economische Zaken;'
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel1
  - number: 1.b
    text: |-
      college: het in [artikel 2][ref1] bedoelde college.


      [ref1]: https://wetten.overheid.nl/BWBR0008807#Artikel2
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008807
        artikel: '2'
        hoofdstuk: '2'
  - number: '2.1'
    text: |-
      Er is een college voor de post- en telecommunicatiemarkt, in het maatschappelijk verkeer aangeduid als
      Onafhankelijke Post en Telecommunicatie Autoriteit (OPTA).
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel2
  - number: '2.2'
    text: Het college bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel2
  - number: '2.3'
    text: |-
      De [Kaderwet zelfstandige bestuursorganen][ref1] is van toepassing, met uitzondering van
      [artikel 22 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020495
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel22
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020495
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '22'
  - number: '3.1'
    text: Het college bestaat uit ten minste drie en ten hoogste vijf vaste leden, de voorzitter daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel3
  - number: '3.2'
    text: Onze Minister benoemt een van de vaste leden van het college tot voorzitter en een tot plaatsvervangend voorzitter.
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel3
  - number: '3.3'
    text: De vaste leden van het college worden benoemd voor een periode van vier jaar.
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel3
  - number: '3.4'
    text: Een vast lid kan worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel3
  - number: '3.5'
    text: |-
      De vaste leden van het college hebben op persoonlijke titel zitting in het college en oefenen hun functie uit
      zonder last.
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel3
  - number: '3.6'
    text: |-
      De persoon die tussentijds tot lid wordt benoemd treedt af op het tijdstip waarop de reeds benoemde vaste leden
      aftreden.
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel3
  - number: '3.7'
    text: |-
      Zolang in een vacature van het college niet is voorzien, vormen de overblijvende vaste leden het college, met de
      bevoegdheden van het voltallige college.
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel3
  - number: '4'
    text: |-
      Onverminderd [artikel 13, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1] is het lidmaatschap van
      het college onverenigbaar met het hebben van financiële of andere belangen bij instellingen of bedrijven, waardoor
      de onpartijdigheid van het betrokken lid in het geding kan zijn. De vaste leden leggen hierover een verklaring af
      aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel13
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '13'
  - number: '6.1'
    text: |-
      De voorzitter, of bij diens afwezigheid de plaatsvervangend voorzitter, van het college vertegenwoordigt de
      rechtspersoon Onafhankelijke Post en Telecommunicatie Autoriteit in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel6
  - number: '6.2'
    text: De voorzitter kan de in het eerste lid bedoelde vertegenwoordiging opdragen aan een door hem aan te wijzen persoon.
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel6
  - number: '7.1'
    text: |-
      Op voordracht van het college kan Onze Minister geassocieerde leden benoemen die op één of meer taakgebieden
      van het college een bijzondere deskundigheid bezitten. Onze Minister schorst en ontslaat geassocieerde leden.
      [Artikel 12, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel12
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '12'
  - number: '7.2'
    text: |-
      Geassocieerde leden nemen op uitnodiging van het college deel aan de vergaderingen van het college. Zij kunnen
      door het college worden betrokken bij de behandeling van aangelegenheden op de taakgebieden ten aanzien waarvan zij
      bijzondere deskundigheid bezitten. De geassocieerde leden hebben een adviserende stem.
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel7
  - number: '7.3'
    text: |-
      [Artikel 13 van de Kaderwet zelfstandige bestuursorganen][ref1] en [artikel 4][ref2] zijn van overeenkomstige
      toepassing op de geassocieerde leden van het college.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0008807#Artikel4
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0008807
        artikel: '4'
        hoofdstuk: '2'
  - number: '7.4'
    text: |-
      In afwijking van [artikel 4][ref1] kunnen geassocieerde leden worden benoemd die beperkte belangen hebben bij
      instellingen of bedrijven in de post- of telecommunicatiemarkt. In dit geval ziet het college erop toe dat deze
      leden niet worden betrokken bij de behandeling van aangelegenheden ten aanzien waarvan belangenverstrengeling zou
      kunnen optreden.


      [ref1]: https://wetten.overheid.nl/BWBR0008807#Artikel4
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008807
        artikel: '4'
        hoofdstuk: '2'
  - number: '7.5'
    text: |-
      [Artikel 14 van de Kaderwet zelfstandige bestuursorganen][ref1] is van overeenkomstige toepassing op de
      geassocieerde leden van het college.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel14
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '14'
  - number: '8'
    text: Het college stelt een bestuursreglement vast.
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel8
  - number: '9'
    text: 'De inkomsten van het college bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel9
  - number: 9.a
    text: opbrengsten uit door belanghebbenden verschuldigde vergoedingen;
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel9
  - number: 9.b
    text: een vergoeding door Onze Minister ten laste van de begroting van het Ministerie van Economische Zaken;
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel9
  - number: 9.c
    text: andere baten.
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel9
  - number: '10'
    text: |-
      Het college stelt voor 1 november de meerjarenraming vast voor de komende vijf kalenderjaren. De meerjarenraming
      behoeft de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel10
  - number: '12.1'
    text: Het college heeft een secretaris.
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel12
  - number: '12.2'
    text: |-
      De secretaris is geen lid van het college. Hij heeft evenwel in de vergaderingen van het college een adviserende
      stem.
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel12
  - number: '12.3'
    text: |-
      [Artikel 13 van de Kaderwet zelfstandige bestuursorganen][ref1] en [artikel 4][ref2] zijn van overeenkomstige
      toepassing op de secretaris van het college.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0008807#Artikel4
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0008807
        artikel: '4'
        hoofdstuk: '2'
  - number: '15'
    text: 'Het college heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel15
  - number: 15.a
    text: 'het houden van toezicht op de naleving van de bepalingen van:'
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel15
  - number: 15.a.1°
    text: |-
      de [Postwet 2009][ref1], voor zover deze taak aan het college is toebedeeld;


      [ref1]: https://wetten.overheid.nl/BWBR0025572
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0025572
  - number: 15.a.2°
    text: |-
      de [Telecommunicatiewet][ref1], voorzover deze taak bij [artikel 15.1, derde lid, van de Telecommunicatiewet][ref2]
      aan het college is toebedeeld;


      [ref1]: https://wetten.overheid.nl/BWBR0009950
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel15
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009950
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '15'
  - number: 15.a.3°
    text: |-
      [verordening (EG) nr. 2887/2000](32000R2887) van het Europees Parlement en de Raad van de Europese Unie van
      18 december 2000 inzake ontbundelde toegang tot het aansluitnetwerk (PbEG L 336/4);
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel15
  - number: 15.a.4°
    text: |-
      verordening nr. 717/2007 van het Europees Parlement en de Raad van de Europese Unie van 27 juni 2007 betreffende
      roaming op openbare mobiele telefoonnetwerken binnen de Gemeenschap en tot wijziging van Richtlijn 2002/21/EG
      inzake een gemeenschappelijk regelgevingskader voor elektronische-communicatienetwerken en -diensten (PbEU L 171).
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel15
  - number: 15.b
    text: |-
      het verrichten van de taken en het uitoefenen van de bevoegdheden die in de [Telecommunicatiewet][ref1] en
      [Postwet 2009][ref2] aan het college zijn opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950
      [ref2]: https://wetten.overheid.nl/BWBR0025572
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009950
      - id: ref2
        bwb_id: BWBR0025572
  - number: 15.c
    text: |-
      het verrichten van de taken en het uitoefenen van de bevoegdheden die bij of krachtens de Wet
      telecommunicatievoorzieningen BES en de Wet post BES aan het college zijn toegekend.
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel15
  - number: '17'
    text: |-
      Het jaarverslag, bedoeld in [artikel 18 van de Kaderwet zelfstandige bestuursorganen][ref1], omvat tevens een
      globale beschrijving van de ontwikkeling van de markt in de post- en telecommunicatiesector.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '18'
  - number: '18.1'
    text: Onze Minister verstrekt het college de inlichtingen die het voor zijn taakuitoefening redelijkerwijs nodig heeft.
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel18
  - number: '18.2'
    text: |-
      Onze Minister stelt een informatiestatuut vast. Het informatiestatuut bevat inhoudelijke en procedurele
      voorschriften met betrekking tot gegevensstromen tussen Onze Minister en het college, die voor een goede uitvoering
      van deze wet noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel18
  - number: '21'
    text: |-
      Onze Minister kan regels stellen over de inrichting van de begroting, het financieel verslag en aandachtspunten
      voor de accountantscontrole.
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel21
  - number: '22'
    text: |-
      Het sluiten van overeenkomsten of het doen van investeringen door het college die een door Onze Minister vast te
      stellen bedrag te boven gaan, behoeven zijn voorafgaande instemming.
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel22
  - number: '24.1'
    text: |-
      Gegevens of inlichtingen omtrent een onderneming, welke in verband met enige werkzaamheid ten behoeve van de
      uitvoering van de taken, genoemd in [artikel 15][ref1], zijn verkregen, mogen uitsluitend voor de uitvoering van
      die taken worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0008807#Artikel15
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0008807
        artikel: '15'
        hoofdstuk: '3'
  - number: '24.2'
    text: |-
      In afwijking van het eerste lid is het college bevoegd de in dat lid bedoelde gegevens of inlichtingen te
      verstrekken aan een instantie die op grond van bepalingen in andere wetten is belast met de uitvoering van
      toezichthoudende taken, voor zover die gegevens of inlichtingen noodzakelijk zijn voor de uitoefening van de taken
      van die instellingen, mits
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel24
  - number: 24.2.a
    text: de geheimhouding van de gegevens of inlichtingen in voldoende mate is gewaarborgd, en
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel24
  - number: 24.2.b
    text: |-
      voldoende is gewaarborgd dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel24
  - number: '24.3'
    text: |-
      Indien de in het tweede lid bedoelde instantie de bedoelde gegevens of inlichtingen ontvangt, onderzoekt zij of er
      in het onderhavige geval sprake is van een overtreding van de betreffende wettelijke regels.
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel24
  - number: '25'
    text: |-
      In afwijking van [artikel 39, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1] zendt Onze
      Minister elke vier jaar een verslag aan de beide kamers der Staten-Generaal ten behoeve van de beoordeling van
      de doelmatigheid en doeltreffendheid van het functioneren van het college. Dit verslag omvat mede een rapportage
      betreffende de wenselijkheid van het al dan niet voortzetten van het college. Het college is gehouden aan deze
      evaluatie medewerking te verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel39
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '39'
  - number: '30.1'
    text: |-
      Met ingang van de datum van inwerkingtreding van deze wet zijn de personeelsleden van de Directie Toezicht
      Netwerken en Diensten, van wie naam en functie zijn vermeld op een door Onze Minister vastgestelde lijst, van
      rechtswege ontslagen en aangesteld als ambtenaar in dienst van het college.
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel30
  - number: '30.2'
    text: |-
      De overgang van de in het eerste lid bedoelde personeelsleden vindt plaats met een rechtspositie die als geheel ten
      minste gelijkwaardig is aan die welke voor elk van hen gold bij de Directie Toezicht Netwerken en Diensten.
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel30
  - number: '30.3'
    text: |-
      De personen die op het tijdstip van inwerkingtreding van deze wet krachtens een arbeidsovereenkomst naar burgerlijk
      recht behoren tot het personeel van de Directie Toezicht Netwerken en Diensten, waarvan naam en functie zijn
      vermeld op een door Onze Minister vastgestelde lijst, zijn met ingang van dat tijdstip van rechtswege ontslagen en
      aangesteld in dienst van het college met een rechtspositie die in totaliteit ten minste gelijkwaardig is aan die
      welke voor elk van hen gold bij de Directie Toezicht Netwerken en Diensten.
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel30
  - number: '31.1'
    text: |-
      Onze Minister bepaalt in overeenstemming met Onze Minister van Financiën welke vermogensbestanddelen van de Staat
      die aan de Directie Toezicht Netwerken en Diensten worden toegerekend, worden toebedeeld aan het college.
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel31
  - number: '31.2'
    text: |-
      De in het eerste lid bedoelde vermogensbestanddelen gaan met ingang van de datum van inwerkingtreding van deze
      wet onder algemene titel over op het college tegen een door Onze Minister in overeenstemming met Onze Minister van
      Financiën te bepalen waarde.
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel31
  - number: '31.3'
    text: |-
      Ingeval krachtens het eerste en tweede lid registergoederen overgaan, zal verandering in de tenaamstelling in de
      openbare registers, bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1] plaatsvinden.
      De daartoe nodige opgaven worden door de zorg van Onze Minister van Financiën aan de bewaarders van de
      desbetreffende registers gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: '32'
    text: |-
      Archiefbescheiden van de Directie Toezicht Netwerken en Diensten gaan met ingang van de datum van inwerktreding
      van deze wet over naar het college, voor zover zij niet overeenkomstig de [Archiefwet 1995][ref1] zijn overgebracht
      naar een archiefbewaarplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: '33.1'
    text: |-
      In wettelijke procedures en rechtsgedingen, waarbij de Directie Toezicht Netwerken en Diensten is betrokken,
      treedt met ingang van de datum van inwerkingtreding van deze wet het college in de plaats van de Staat dan wel
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel33
  - number: '33.2'
    text: |-
      In zaken waarin voor het tijdstip van inwerkingtreding van deze wet op grond van
      [artikel 12 van de Wet Nationale ombudsman][ref1] aan de Nationale ombudsman is verzocht een onderzoek te doen,
      dan wel de Nationale ombudsman op grond van artikel 15 van die wet een onderzoek heeft ingesteld naar een gedraging
      die kan worden toegerekend aan de Directie Toezicht Netwerken en Diensten, treedt het college op dat tijdstip als
      bestuursorgaan in de zin van de [Wet Nationale Ombudsman][ref2] in de plaats van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003372
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0003372
  - number: '34.1'
    text: |-
      Uitvoeringstaken, bedoeld in [artikel 15, onder b 1°, 2° en 4°, en onder c][ref1], ook indien deze inhouden de
      behandeling van op de datum van inwerkingtreding van deze wet bij Onze Minister in behandeling zijnde aanvragen en
      verzoeken terzake, worden vanaf die datum verricht door het college.


      [ref1]: https://wetten.overheid.nl/BWBR0008807#Artikel15
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0008807
        artikel: '15'
        hoofdstuk: '3'
  - number: '34.2'
    text: |-
      De door Onze Minister voor de datum van inwerkingtreding van deze wet gegeven beschikkingen, bedoeld in
      [artikel 15, onder b 1°, 2° en 4°, en onder c][ref1], blijven na de datum van inwerkingtreding van deze wet
      van kracht, met dien verstande dat het college vanaf die datum met betrekking tot die beschikkingen en de daaraan
      verbonden voorschriften en beperkingen bevoegd is, zijn taken uit te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0008807#Artikel15
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0008807
        artikel: '15'
        hoofdstuk: '3'
  - number: '36'
    text: |-
      Artikel 62, achtste lid, van de Wet op de telecommunicatievoorzieningen is niet van toepassing op een wijziging van
      de in artikel 8 van die wet bedoelde richtlijnen welke voortvloeit uit het bepaalde in [artikel 15 onder ][ref1]
      van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0008807#Artikel15
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0008807
        artikel: '15'
        hoofdstuk: '3'
  - number: '38'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel38
  - number: '39'
    text: 'Deze wet wordt aangehaald als: Wet Onafhankelijke post- en telecommunicatieautoriteit.'
    url: https://wetten.overheid.nl/BWBR0008807/2011-01-01#Artikel39
