preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Justitie;

    Gelet op artikel artikel 49, tweede lid, van de Politiewet 1993, artikel 56, eerste lid, van het Besluit algemene
    rechtspositie politie;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0006553/2014-06-06#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *uniform:* het samenstel van de in [bijlage 1][ref1] genoemde kledingstukken en de in [bijlage 2][ref2] genoemde
      uitmonstering;

      b. *dienstkleding:* de door de beheerder aan de ambtenaar verstrekte kleding, niet zijnde het uniform;

      c. *beheerder:* de korpschef;

      d. *ambtenaar:* de ambtenaren, genoemd in
      [artikel 56, eerste lid, van het Besluit algemene rechtspositie politie][ref3] en de vrijwillige ambtenaren van
      politie, bedoeld in [artikel 15 van het Besluit rechtspositie vrijwillige politie][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006553
      [ref2]: https://wetten.overheid.nl/BWBR0006553
      [ref3]: https://wetten.overheid.nl/BWBR0006516#Artikel56
      [ref4]: https://wetten.overheid.nl/BWBR0007321#Artikel15
    url: https://wetten.overheid.nl/BWBR0006553/2014-06-06#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006553
      - id: ref2
        bwb_id: BWBR0006553
      - id: ref3
        bwb_id: BWBR0006516
        artikel: '56'
      - id: ref4
        bwb_id: BWBR0007321
        artikel: '15'
  - number: '2'
    text: |-
      1 De beheerder draagt er zorg voor dat het uniform en de dienstkleding bestaan uit de in [bijlage 1][ref1] genoemde
      kledingstukken voor de basistaken en de door de beheerder toegewezen bijzondere taken.

      2 De ambtenaar is verantwoordelijk voor de reiniging van overhemden/blouses, poloshirts, sokken en onderkleding. De
      aan de reiniging verbonden kosten zijn voor rekening van de ambtenaar.

      3 De beheerder draagt er zorg voor dat onder de omstandigheden waarin het nodig is dat de aanwezigheid van de
      ambtenaar zichtbaar is, deze ambtenaar een zichtbaarheidsvest, blouson, parka, regenkleding of regencape als
      bedoeld in [bijlage 1][ref2] draagt.


      [ref1]: https://wetten.overheid.nl/BWBR0006553
      [ref2]: https://wetten.overheid.nl/BWBR0006553
    url: https://wetten.overheid.nl/BWBR0006553/2014-06-06#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006553
      - id: ref2
        bwb_id: BWBR0006553
  - number: '3'
    text: |-
      De beheerder geeft in een reglement aan:

      a. welke in [bijlage 1][ref1] genoemde kledingstukken en in [bijlage 2][ref2] genoemde uitmonstering verstrekt
      worden;

      b. de wijze van verstrekking van het uniform;

      c. op welke wijze het uniform wordt gedragen met dien verstande dat het witte overhemd in combinatie met de tuniek
      wordt gedragen en het blauwe overhemd in combinatie met de blouson wordt gedragen;

      d. op welke wijze het uniform wordt onderhouden.


      [ref1]: https://wetten.overheid.nl/BWBR0006553
      [ref2]: https://wetten.overheid.nl/BWBR0006553
    url: https://wetten.overheid.nl/BWBR0006553/2014-06-06#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006553
      - id: ref2
        bwb_id: BWBR0006553
  - number: '4'
    text: |-
      1 Het uniform is eigendom van de politie.

      2 De ambtenaar is verantwoordelijk voor het hem verstrekte uniform.
    url: https://wetten.overheid.nl/BWBR0006553/2014-06-06#Artikel4
  - number: '5'
    text: |-
      Het uniform dat aan de ambtenaar is verstrekt, wordt door de beheerder ingenomen bij:

      a. de vervanging van het uniform,

      b. het overlijden van de ambtenaar, of

      c. het ontslag van de ambtenaar uit de politiedienst.
    url: https://wetten.overheid.nl/BWBR0006553/2014-06-06#Artikel5
  - number: '6'
    text: De beheerder draagt er zorg voor dat het uniform niet in handen van onbevoegden terecht komt.
    url: https://wetten.overheid.nl/BWBR0006553/2014-06-06#Artikel6
  - number: '7'
    text: Deze regeling treedt in werking met ingang van 1 april 1994.
    url: https://wetten.overheid.nl/BWBR0006553/2014-06-06#Artikel7
  - number: 7a
    text: |-
      Deze regeling berust op [artikel 25, eerste lid, van het Besluit bewapening en uitrusting politie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel25
    url: https://wetten.overheid.nl/BWBR0006553/2014-06-06#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0032136
        artikel: '25'
  - number: '8'
    text: |-
      Deze regeling wordt aangehaald als: Kledingregeling voor de politie.

      Deze regeling zal in de Staatscourant en het Algemeen Politieblad worden geplaatst met uitzondering van de bijlage
      3, die op het ministerie van Binnenlandse Zaken ter inzage wordt gelegd.
    url: https://wetten.overheid.nl/BWBR0006553/2014-06-06#Artikel8
