  - number: '10'
    text: |-
      Aan de gezagvoerders van militaire vliegtuigen en helikopters, behorende tot of in gebruik bij de
      Nederlandse strijdkrachten, en van door de Minister van Defensie aan te wijzen vliegtuigen en helikopters,
      behorende tot of in gebruik bij bondgenootschappelijke strijdkrachten, wordt vrijstelling verleend van
      [artikel 18, eerste lid, van het Besluit luchtverkeer 2014][ref1] onder de volgende beperkingen:

      a. het overvliegen van bebouwing, met name ziekenhuizen en sanatoria, wordt zoveel mogelijk vermeden;

      b. de vluchten worden uitgevoerd met inachtneming van de zichtweersomstandigheden en minimum vlieghoogten, vermeld
      in de [artikelen 11][ref2] en [12][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0035899#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0035356#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0035356#Artikel12
    url: https://wetten.overheid.nl/BWBR0035356/2014-12-12#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0035899
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0035356
        artikel: '11'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0035356
        artikel: '12'
        paragraaf: '2'
  - number: '11'
    text: |-
      1 De vrijstelling, bedoeld in [artikel 10][ref1], wordt verleend, indien de volgende zichtweersomstandigheden in
      acht worden genomen:

      a. het vliegzicht is gelijk aan of groter dan 5 kilometer;

      b. de horizontale afstand van het militaire vliegtuig of de helikopter tot de wolken is gelijk aan of groter dan
      600 meter;

      c. de verticale afstand van het militaire vliegtuig of de helikopter tot de wolken is gelijk aan of groter dan 150
      meter (500 voet).

      2 In afwijking van het eerste lid wordt voor vluchten met militaire helikopters aan gezagvoerders de vrijstelling,
      genoemd in [artikel 10][ref2], verleend, indien de volgende zichtweersomstandigheden in acht worden genomen:

      a. binnen plaatselijke luchtverkeersleidingsgebieden van militaire luchthavens:

      1°. het vliegzicht is gelijk aan of groter dan 3 kilometer; voor vluchten die zich beperken tot het
      luchtverkeerscircuit, is het vliegzicht gelijk aan of groter dan 2 kilometer;

      2°. de wolkenbasis bevindt zich op ten minste 300 meter (1.000 voet) respectievelijk voor vluchten in het
      luchtverkeerscircuit op ten minste 250 meter (800 voet);

      3°. de helikopter is vrij van wolken met zicht op grond of water;

      b. buiten plaatselijke luchtverkeersleidingsgebieden van militaire luchthavens:

      1°. het vliegzicht is gelijk aan of groter dan 5 kilometer voor vluchten met militaire helikopters die niet voldoen
      aan de eisen voor het uitoefenen van IFR-vluchten; voor vluchten met militaire helikopters die voldoen aan de eisen
      voor het uitoefenen van IFR-vluchten, is het vliegzicht minimaal 3 kilometer;

      2°. de wolkenbasis bevindt zich op ten minste 300 meter (1.000 voet); voor patiëntenvervoer van en naar de
      Waddeneilanden, alsmede voor de hiervoor benodigde trainingsvluchten, met militaire helikopters die voldoen aan de
      eisen voor het uitoefenen van IFR-vluchten, bevindt de wolkenbasis zich op ten minste 210 meter (700 voet);

      3°. de helikopter is vrij van wolken met zicht op grond of water;

      c. in afwijking van de onderdelen a en b is ten behoeve van trainingsvluchten voor en daadwerkelijke inzet bij
      Search and Rescue boven zee en onderzeebootbestrijding het volgende van toepassing:

      1°. het vliegzicht is gelijk aan of groter dan 2 kilometer; voor vluchten vanaf schepen is het vliegzicht gelijk
      aan of groter dan 1.000 meter;

      2°. de wolkenbasis bevindt zich op ten minste 150 meter (500 voet); voor vluchten vanaf schepen bevindt de
      wolkenbasis zich op ten minste 60 meter (200 voet).

      3 Voor vluchten met militaire helikopters waarbij gebruik wordt gemaakt van nachtzichtapparatuur, wordt aan
      gezagvoerders de vrijstelling, genoemd in [artikel 10][ref3], verleend, indien het vliegzicht gelijk is aan of
      groter is dan 1.500 meter met zicht op grond of water.


      [ref1]: https://wetten.overheid.nl/BWBR0035356#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0035356#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0035356#Artikel10
    url: https://wetten.overheid.nl/BWBR0035356/2014-12-12#Artikel11
