preamble:
  text: |-
    Handelende in overeenstemming met de Staatssecretaris van Infrastructuur en Milieu;

    Gelet op de artikelen 44, 45 en 56 van het Luchtverkeersreglement;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0035356/2014-12-12#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De minimum vlieghoogte, bedoeld in paragraaf SERA.5005, onderdeel f, onder 2, van verordening (EU) nr. 923/2012,
      bedraagt voor militaire vliegtuigen, met uitzondering van voor opleidingsdoeleinden bestemde propellervliegtuigen,
      300 meter (1.000 voet).

      2 In afwijking van het eerste lid bedraagt de minimum vlieghoogte, bedoeld in paragraaf SERA.5005, onderdeel f,
      onder 2, van verordening (EU) nr. 923/2012:

      a. 365 meter (1.200 voet) voor militaire straalvliegtuigen in het luchtverkeersdienstverleningsgebied met klasse G;

      b. 450 meter (1.500 voet) voor militaire vliegtuigen boven de Waddenzee, met uitzondering van vluchten in de
      naderingsgebieden van de schietrange Vliehors.
    url: https://wetten.overheid.nl/BWBR0035356/2014-12-12#Artikel1
  - number: '2'
    text: |-
      1 [Artikel 1][ref1] is van maandag tot en met donderdag niet van toepassing op gezagvoerders van Nederlandse
      en bondgenootschappelijke militaire straalvliegtuigen en op gezagvoerders van militaire transportvliegtuigen,
      behorende tot of in gebruik bij de Nederlandse en de bondgenootschappelijke strijdkrachten, indien zij een VFR-
      vlucht uitvoeren langs de routes, vermeld in [bijlage A][ref2].

      2 Tijdens de vluchten, genoemd in het eerste lid, gelden de volgende voorwaarden:

      a. de minimum vlieghoogte bedraagt 75 meter (250 voet) boven hindernissen of zoveel lager als voor het doel van de
      vlucht noodzakelijk is;

      b. met betrekking tot het vliegzicht en de wolkenbasis zijn de eisen voor VFR-vluchten van toepassing, genoemd in
      paragraaf SERA.5001 van verordening (EU) 923/2012, tenzij het doel van de vlucht het noodzakelijk maakt van deze
      eisen af te wijken;

      c. de gezagvoerder die meer dan 1.852 meter (1 NM) van de route is afgeraakt, klimt eerst naar de aldaar geldende
      minimum vlieghoogte en zet de vliegoefening pas voort als het vliegtuig op de route is teruggekeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0035356#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0035356
    url: https://wetten.overheid.nl/BWBR0035356/2014-12-12#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0035356
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0035356
  - number: '3'
    text: |-
      Aan gezagvoerders van militaire vliegtuigen en helikopters wordt onder de in de [artikelen 4 tot en met 8][ref1]
      voor de betrokken gezagvoerder gestelde beperkingen vrijstelling verleend van het verbod om een VFR-vlucht uit
      te voeren beneden de bij of krachtens paragraaf SERA.5005, onderdeel f, van verordening (EU) nr. 923/2012 en
      [artikel 1][ref2] van deze regeling vastgestelde minimum vlieghoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0035356#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0035356#Artikel1
    url: https://wetten.overheid.nl/BWBR0035356/2014-12-12#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0035356
        artikel: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0035356
        artikel: '1'
        paragraaf: '1'
  - number: '4'
    text: |-
      Het vliegen met militaire helikopters, behorende tot of in gebruik bij de Nederlandse of bondgenootschappelijke
      strijdkrachten, geschiedt onder de volgende beperkingen:

      a. boven gebieden met aaneengesloten bebouwing, industrie- en havengebieden daaronder begrepen dan wel boven
      mensenverzamelingen bedraagt de minimum vlieghoogte 210 meter (700 voet) boven de hoogste hindernis gelegen binnen
      een afstand van 600 meter van de helikopter;

      b. elders dan onder a aangegeven bedraagt de minimum vlieghoogte 45 meter (150 voet) boven grond of water.
    url: https://wetten.overheid.nl/BWBR0035356/2014-12-12#Artikel4
  - number: '5'
    text: |-
      Het vliegen met militaire vliegtuigen en militaire helikopters boven de Noordzee en met militaire helikopters boven
      de Waddenzee binnen het plaatselijk luchtverkeersleidingsgebied van luchthaven De Kooy geschiedt onder de volgende
      beperkingen:

      a. de minimum vlieghoogte bedraagt 30 meter (100 voet), of zoveel lager als voor het doel van de vlucht
      noodzakelijk is, en

      b. de vlucht boven de Noordzee wordt ten minste 1.852 meter (1 NM) uit de Noordzeekustlijn uitgevoerd, met
      uitzondering van een Search and Rescue-(trainings)vlucht.
    url: https://wetten.overheid.nl/BWBR0035356/2014-12-12#Artikel5
  - number: '6'
    text: |-
      1 Het vliegen met militaire straalvliegtuigen, behorende tot of in gebruik bij de Nederlandse of
      bondgenootschappelijke strijdkrachten, geschiedt, indien zij oefenen in het kader van operaties met niet-vliegende
      eenheden en binnen de grenzen van militaire oefenterreinen en militaire oefengebieden of tijdelijke gebieden met
      beperkingen VFR-vluchten uitvoeren, onder de volgende beperkingen:

      a. slechts indien het doel van de vlucht daartoe noodzaakt, is afwijken van de minimum vlieghoogte toegestaan tot
      een minimum vlieghoogte van 75 meter (250 voet) boven hindernissen;

      b. met betrekking tot het vliegzicht en de wolkenbasis zijn de eisen voor VFR-vluchten van toepassing, genoemd in
      paragraaf SERA.5001 van verordening (EU) 923/2012;

      c. voor vluchten binnen een plaatselijk luchtverkeersleidingsgebied, een tijdelijk gebied met beperkingen
      of in de omgeving van een burgerluchtvaartterrein is vooraf toestemming vereist van de betrokken
      luchtverkeersleidingsdienst;

      d. voor vluchten binnen een van de gebieden of de route, bedoeld in [artikel 9, eerste lid][ref1], is vooraf
      toestemming vereist van de Commandant van het Defensie Helikopter Commando van het Commando Luchtstrijdkrachten;

      e. het overvliegen van bebouwing, met name ziekenhuizen en sanatoria, wordt zoveel mogelijk vermeden.

      2 Ten aanzien van gezagvoerders van straalvliegtuigen van bondgenootschappelijke strijdkrachten die
      deelnemen aan een oefening, met uitzondering van gezamenlijke oefeningen met Nederlandse eenheden, is
      [artikel 19, derde lid, van het Besluit luchtverkeer 2014][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0035356#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0035899#Artikel19
    url: https://wetten.overheid.nl/BWBR0035356/2014-12-12#Artikel6
