        artikel: '9'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0035356
        artikel: '9'
        paragraaf: '1'
  - number: '13'
    text: |-
      Voor vluchten met militaire helikopters waarbij gebruik wordt gemaakt van nachtzichtapparatuur, mag alleen van
      de gebieden of route, bedoeld in [artikel 9, eerste lid][ref1], gebruik worden gemaakt, indien aan de volgende
      voorwaarden is voldaan:

      a. de vluchten worden met ontstoken navigatielichten uitgevoerd; indien de intensiteit van de navigatielichten de
      taakuitvoering van de vlieger nadelig beïnvloedt, is het toegestaan de navigatielichten te dimmen of te doven;

      b. indien mogelijk wordt radiocontact onderhouden met het AOCS NM;

      c. er wordt te allen tijde voor ander luchtverkeer uitgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0035356#Artikel9
