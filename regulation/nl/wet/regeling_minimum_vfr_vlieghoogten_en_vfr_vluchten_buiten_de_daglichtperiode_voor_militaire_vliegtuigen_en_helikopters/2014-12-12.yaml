  - number: '12'
    text: |-
      Voor VFR-vluchten buiten de daglichtperiode worden de volgende minimum vlieghoogten in acht genomen:

      a. boven gebieden met aaneengesloten bebouwing, industrie- en havengebieden daaronder begrepen, dan wel
      mensenverzamelingen: voor militaire vliegtuigen ten minste 300 meter (1.000 voet) en voor militaire helikopters
      210 meter (700 voet) boven de hoogste hindernis gelegen binnen een afstand van 600 meter van het vliegtuig
      respectievelijk de helikopter;

      b. elders dan onder a aangegeven:

      1°. voor militaire vliegtuigen: ten minste 300 meter4 (1.000 voet) boven grond of water;

      2°. voor militaire helikopters:

      (a) ten minste 30 meter (100 voet) boven grond of water of zoveel lager als voor het doel van de vlucht
      noodzakelijk is binnen de gebieden of route, bedoeld in [artikel 9, eerste lid][ref1];

      (b) ten minste 45 meter (150 voet) boven hindernissen gelegen binnen een afstand van 250 meter van de helikopter op
      routes voor vluchten van en naar de gebieden of route, bedoeld in [artikel 9, eerste lid][ref2];

      (c) ten minste 100 meter (300 voet) boven grond of water of zoveel lager als voor het doel van de vlucht
      noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0035356#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0035356#Artikel9
    url: https://wetten.overheid.nl/BWBR0035356/2014-12-12#Artikel12
    references:
      - id: ref1
