        artikel: '19'
  - number: '7'
    text: |-
      Het vliegen met militaire helikopters, behorende tot of in gebruik bij de Nederlandse en bondgenootschappelijke
      strijdkrachten geschiedt, indien zij oefenen in het kader van operaties met niet-vliegende eenheden en binnen de
      grenzen van militaire oefenterreinen en militaire oefengebieden of tijdelijke gebieden met beperkingen VFR-vluchten
      uitvoeren, onder de volgende beperkingen:

      a. de minimum vlieghoogte bedraagt 30 meter (100 voet) boven hindernissen of zoveel lager als voor het doel van de
      vlucht noodzakelijk is;

      b. voor vluchten binnen een plaatselijk luchtverkeersleidingsgebied, een tijdelijk gebied met beperkingen
      of in de omgeving van een burgerluchtvaartterrein is vooraf toestemming vereist van de betrokken
      luchtverkeersleidingsdienst;

      c. voor vluchten binnen een van de gebieden of route, bedoeld in [artikel 9, eerste lid][ref1], is vooraf
      toestemming vereist van de Commandant van het Defensie Helikopter Commando van het Commando Luchtstrijdkrachten;

      d. het overvliegen van bebouwing, met name ziekenhuizen en sanatoria, wordt zoveel mogelijk vermeden.


      [ref1]: https://wetten.overheid.nl/BWBR0035356#Artikel9
    url: https://wetten.overheid.nl/BWBR0035356/2014-12-12#Artikel7
    references:
