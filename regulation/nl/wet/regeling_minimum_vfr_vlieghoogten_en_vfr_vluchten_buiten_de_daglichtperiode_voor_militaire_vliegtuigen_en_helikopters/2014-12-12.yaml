        artikel: '9'
        paragraaf: '1'
  - number: '8'
    text: |-
      Het vliegen met militaire propellervliegtuigen, bestemd voor opleidingsdoeleinden, behorende tot of
      in gebruik bij de Nederlandse of bondgenootschappelijke strijdkrachten, binnen de route VO, vermeld in
      [bijlage B, onder 16][ref1], geschiedt onder de volgende beperkingen:

      a. de gebruikstijden zijn: van maandag tot en met vrijdag dagelijks van 08.00 uur plaatselijke tijd tot en met
      16.45 uur plaatselijke tijd;

      b. de minimum vlieghoogte bedraagt 75 meter (250 voet) boven hindernissen;

      c. het overvliegen van bebouwing, met name ziekenhuizen en sanatoria, wordt zoveel mogelijk vermeden;

      d. de gezagvoerder die meer dan 926 meter (½ NM) van de route is afgeraakt, begeeft zich eerst naar de aldaar
      geldende minimum vlieghoogte en zet de vliegoefening pas voort als het vliegtuig op de route is teruggekeerd;

      e. voor de vluchten is vooraf toestemming vereist van de Commandant van het Defensie Helikopter Commando van het
      Commando Luchtstrijdkrachten.


      [ref1]: https://wetten.overheid.nl/BWBR0035356
    url: https://wetten.overheid.nl/BWBR0035356/2014-12-12#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0035356
  - number: '9'
    text: |-
      1 [Artikel 4, onderdeel b][ref1], is niet van toepassing op gezagvoerders van militaire helikopters, behorende
      tot of in gebruik bij de Nederlandse of bondgenootschappelijke strijdkrachten, indien zij met inachtneming van de
      regels en binnen de tijden, gesteld in het tweede lid, VFR-vluchten uitvoeren binnen de gebieden en binnen de route
      VO, vermeld in [bijlage B][ref2].

      2 Voor de gebieden en de route VO, vermeld in [bijlage B][ref3], zijn de gebruikstijden als volgt:

      a. voor de gebieden onder 1 tot en met 12: van maandag 08.00 uur plaatselijke tijd tot en met vrijdag 17.00 uur
      plaatselijke tijd;

      b. voor de gebieden onder 13 tot en met 15: van maandag tot en met donderdag dagelijks van aanvang daglichtperiode
      tot en met einde daglichtperiode en vrijdag van aanvang daglichtperiode tot 17.00 uur plaatselijke tijd;

      c. voor de route VO onder 16: van maandag tot en met vrijdag dagelijks van 08.00 uur plaatselijke tijd tot en met
      16.45 uur plaatselijke tijd.

      3 Tijdens de vluchten, genoemd in het eerste lid, zijn de volgende beperkingen van toepassing:

      a. de minimum vlieghoogte bedraagt 30 meter (100 voet) boven hindernissen of zoveel lager als voor het doel van de
      vlucht noodzakelijk is;

      b. het overvliegen van bebouwing, met name ziekenhuizen en sanatoria, wordt zoveel mogelijk vermeden;

      c. de gezagvoerder die buiten het gebied is gekomen of meer dan 926 meter (½ NM) van de route is afgeraakt, begeeft
      zich eerst naar de aldaar geldende minimum vlieghoogte en zet de vliegoefening pas voort als de helikopter binnen
      het gebied of op de route is teruggekeerd;

      d. de gebieden EHR 3 (Oldebroek) en EHR 9 (Harskamp) worden vermeden, behoudens in geval van toestemming van de
      betrokken terreinbeheerder;

      e. voor vluchten binnen een van de gebieden of binnen de route, bedoeld in het eerste lid, is vooraf toestemming
      vereist van de Commandant van het Defensie Helikopter Commando van het Commando Luchtstrijdkrachten.

      4 Ten aanzien van gezagvoerders van helikopters van de bondgenootschappelijke strijdkrachten die
      deelnemen aan een oefening, met uitzondering van gezamenlijke oefeningen met Nederlandse eenheden, is
      [artikel 19, derde lid, van het Besluit luchtverkeer 2014][ref4] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0035356#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0035356
      [ref3]: https://wetten.overheid.nl/BWBR0035356
      [ref4]: https://wetten.overheid.nl/BWBR0035899#Artikel19
