preamble:
  text: |-
    Gelet op artikel 6, tweede en derde lid, van de Wet op bijzondere medische verrichtingen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009846/1998-08-29#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze regeling heeft betrekking op de vergunning, bedoeld in
      [artikel 2 van de Wet op bijzondere medische verrichtingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008974#Artikel2
    url: https://wetten.overheid.nl/BWBR0009846/1998-08-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008974
        artikel: '2'
  - number: '2'
    text: |-
      1 Op de aanvraag om een vergunning beslist de Minister binnen dertien weken na ontvangst van de aanvraag, behoudens
      het tweede en derde lid.

      2 Indien de Minister advisering over de aanvraag noodzakelijk acht, vraagt hij advies binnen vier weken na
      ontvangst van de aanvraag. Hij stelt de aanvrager hiervan in kennis en beslist binnen dertien weken na ontvangst
      van de laatste der gevraagde adviezen.

      3 De Minister houdt de beslissing op een aanvraag om een vergunning tevens aan, indien er geen grond is
      om de vergunning te weigeren en voor het uitvoeren van de verrichting een bouwvergunning als bedoeld in
      [artikel 6 van de Wet ziekenhuisvoorzieningen][ref1] vereist is. De Minister neemt in dat geval omtrent beide
      vergunningen in samenhang een beslissing, daarbij gelden bovendien de termijnen zoals gesteld in de [WZV][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002753
    url: https://wetten.overheid.nl/BWBR0009846/1998-08-29#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0002753
  - number: '3'
    text: |-
      De aanvrager van een vergunning legt bij de aanvraag de in [bijlage 1][ref1] bedoelde gegevens over.


      [ref1]: https://wetten.overheid.nl/BWBR0009846
    url: https://wetten.overheid.nl/BWBR0009846/1998-08-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009846
  - number: '4'
    text: |-
      De houder van een vergunning dient jaarlijks bij de Minister de in [bijlage 2][ref1] bedoelde gegevens in.


      [ref1]: https://wetten.overheid.nl/BWBR0009846
    url: https://wetten.overheid.nl/BWBR0009846/1998-08-29#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009846
  - number: '5'
    text: |-
      Het Besluit procedures voor bijzondere functies [Wet ziekenhuisvoorzieningen][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002753
    url: https://wetten.overheid.nl/BWBR0009846/1998-08-29#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002753
  - number: '6'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0009846/1998-08-29#Artikel6
  - number: '7'
    text: |-
      Deze regeling wordt aangehaald als: [Regeling vergunningprocedure bijzondere medische verrichtingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009846
    url: https://wetten.overheid.nl/BWBR0009846/1998-08-29#Artikel7
