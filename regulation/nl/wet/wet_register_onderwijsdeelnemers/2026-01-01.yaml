  - number: '10'
    text: |-
      1 De basisgegevens omvatten, naast de identificerende gegevens, bedoeld in [artikel 9][ref1], in elk geval gegevens
      met betrekking tot:

      a. de onderwijsinstelling waar de onderwijsdeelnemer is of was ingeschreven;

      b. de datum van in- en uitschrijving bij de desbetreffende onderwijsinstelling.

      2 De vrijstellingsgegevens omvatten, naast de identificerende gegevens, bedoeld in [artikel 9][ref2], in elk geval
      gegevens met betrekking tot:

      a. het feit dat het een vrijstelling van de leerplicht dan wel een vervangende leerplicht betreft;

      b. de begin- en einddatum van de vrijstelling of vervangende leerplicht.

      3 De verzuimgegevens omvatten, naast de identificerende gegevens, bedoeld in [artikel 9][ref3], in elk geval
      gegevens met betrekking tot:

      a. het soort verzuim;

      b. de begin- en einddatum van het verzuim.

      4 De diplomagegevens omvatten, naast de identificerende gegevens, bedoeld in [artikel 9][ref4], in elk geval
      gegevens met betrekking tot:

      a. het soort waardedocument;

      b. de organisatie die het waardedocument heeft uitgereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel9
