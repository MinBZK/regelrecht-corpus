        artikel: '28'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '13'
    text: |-
      Onze Minister neemt het persoonsgebonden nummer en de andere gegevens die zijn geleverd op grond van
      [artikel 12][ref1] op in het register onderwijsdeelnemers, met dien verstande dat hij de identificerende gegevens
      die zijn geleverd op grond van dat artikel slechts opneemt voor zover deze niet kunnen worden verkregen uit de
      basisregistratie personen.


      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel12
    url: https://wetten.overheid.nl/BWBR0042012/2026-01-01#Artikel13
