$id: wet_register_onderwijsdeelnemers
regulatory_layer: WET
publication_date: '2020-03-04'
valid_from: '2026-01-01'
bwb_id: BWBR0042012
url: https://wetten.overheid.nl/BWBR0042012/2026-01-01
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de wetgeving over de registers met betrekking tot
    onderwijsdeelnemers doorzichtiger en toegankelijker te maken en ook overigens te moderniseren, en deze daartoe te
    bundelen in een nieuwe Wet register onderwijsdeelnemers, onder wijziging van diverse onderwijswetten;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0042012/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt, voor zover niet anders is bepaald, verstaan onder:

        - *basisgegevens:* gegevens over onderwijsdeelnemers die noodzakelijk zijn voor de doelen, bedoeld in
      [artikel 5, tweede lid][ref1];
        - *basisregistratie personen:* de basisregistratie personen, bedoeld in
      [artikel 1.2 van de Wet basisregistratie personen][ref2];
        - *bestuur:* instellingsbestuur als bedoeld in de [WHW][ref3] of bevoegd gezag als bedoeld in de
      overige onderwijswetten van een onderwijsinstelling, met dien verstande dat daaronder wordt verstaan:
      a. voor zover het betreft basisgegevens: 1°. bevoegd gezag of instellingsbestuur van een door het
      Rijk bekostigde school of instelling als bedoeld in de [WPO][ref4], [WEC][ref5], [WVO 2020][ref6],
      [WEB][ref7], [WHW][ref8], [WPO BES][ref9] of [WEB BES][ref10]; 2°. bevoegd gezag van een niet door het
      Rijk bekostigde school of instelling als bedoeld in [artikel 56 van de WVO][ref11], [artikel 1.4.1][ref12]
      of [1.4a.1 van de WEB][ref13], [artikel 1, onderdeel b, subonderdeel 3 of 4, van de LPW][ref14], of
      [artikel 1, onderdeel b, subonderdeel 3 of 4, van de Leerplichtwet BES][ref15]; of 3°. instellingsbestuur van een
      rechtspersoon voor hoger onderwijs als bedoeld in [artikel 1.1, onderdeel aa, van de WHW][ref16]; b. voor zover het
      betreft verzuimgegevens: 1°. bevoegd gezag van een door het Rijk bekostigde school of instelling als bedoeld in de
      [WEC][ref17], [WVO 2020][ref18] of [WEB][ref19]; of 2°. bevoegd gezag van een niet door het Rijk bekostigde school
      of instelling als bedoeld in [artikel 56 van de WVO][ref20], [artikel 1.4.1][ref21] of [1.4a.1 van de WEB][ref22],
      [artikel 1, onderdeel b, subonderdeel 3 of 4, van de LPW][ref23]; c. voor zover het betreft diplomagegevens:
      1°. bevoegd gezag of instellingsbestuur van een door het Rijk bekostigde school of instelling als bedoeld in
      de [WEC][ref24], [WVO 2020][ref25], [WEB][ref26] of [WHW][ref27]; 2°. bevoegd gezag van een niet door het Rijk
      bekostigde school of instelling als bedoeld in [artikel 2.66 WVO 2020][ref28] of de [artikelen 1.4.1][ref29] en
      [1.4a.1 van de WEB][ref30]; of 3°. instellingsbestuur van een rechtspersoon voor hoger onderwijs als bedoeld in
      [artikel 1.1, onderdeel aa, van de WHW][ref31].
        - *CBS:* het Centraal bureau voor de statistiek, bedoeld in
      [artikel 2 van de Wet op het Centraal bureau voor de statistiek][ref32];
        - *College voor toetsen en examens:* het College voor toetsen en examens, bedoeld in
      [artikel 2 van de Wet College voor toetsen en examens][ref33];
        - *derde:* derde als bedoeld in artikel 4 van de Algemene verordening gegevensbescherming;
        - *diplomagegevens:* gegevens over onderwijsdeelnemers die noodzakelijk zijn voor het doel, bedoeld in
      [artikel 5, vijfde lid][ref34];
        - *gegevensset:* basisgegevens, vrijstellingsgegevens, verzuimgegevens of diplomagegevens;
        - *hoofd:* hoofd als bedoeld in de [LPW][ref35]: a. van een door het Rijk bekostigde school of instelling als
      bedoeld in de [WPO][ref36], [WEC][ref37], [WVO 2020][ref38] of de [WEB][ref39]; of b. van een niet door het Rijk
      bekostigde school of instelling als bedoeld in [artikel 56 van de WVO][ref40], [artikel 1.4.1 van de WEB][ref41] of
      [artikel 1, onderdeel b, subonderdeel 3 of 4, van de LPW][ref42];
        - *identificerende gegevens:* gegevens als bedoeld in [artikel 9][ref43];
        - *inspectie:* de Inspectie van het onderwijs, bedoeld in [artikel 1 van de WOT][ref44];
        - *LPW:* [Leerplichtwet 1969][ref45];
        - *onderwijsdeelnemer:* leerling, deelnemer, student of extraneus als bedoeld in een onderwijswet van
      een onderwijsinstelling, met dien verstande dat daaronder wordt verstaan: a. voor zover het betreft
      basisgegevens: leerling, vavo-student, deelnemer, mbo-student, ho-student of extraneus van een school,
      instelling of rechtspersoon voor hoger onderwijs als bedoeld in onderdeel a van de begripsomschrijving van
      bestuur in dit artikel; b. voor zover het betreft verzuimgegevens: leerling, vavo-student, deelnemer of mbo-
      student van een school of instelling als bedoeld in onderdeel b van de begripsomschrijving van bestuur in
      dit artikel; c. voor zover het betreft diplomagegevens: 1°. leerling, vavo-student, deelnemer, mbo-student,
      ho-student of extraneus van een school, instelling of rechtspersoon voor hoger onderwijs als bedoeld in
      onderdeel c van de begripsomschrijving van bestuur in dit artikel; of 2°. degene die een staatsexamen als
      bedoeld in [artikel 2.72, eerste of derde lid, WVO 2020][ref46] of een inburgeringsexamen als bedoeld in
      [artikel 7 van de Wet inburgering 2021][ref47] heeft afgelegd; d. voor zover het betreft vrijstellingsgegevens:
      jongere als bedoeld in de [artikelen 5][ref48], [5a][ref49] en [15 van de LPW][ref50];
        - *onderwijsinstelling:* school, instelling of rechtspersoon voor hoger onderwijs als bedoeld in een onderwijswet,
      met dien verstande dat daaronder wordt verstaan: a. voor zover het betreft basisgegevens: school, instelling
      of rechtspersoon voor hoger onderwijs als bedoeld in onderdeel a van de begripsomschrijving van bestuur in
      dit artikel; b. voor zover het betreft verzuimgegevens: school of instelling als bedoeld in onderdeel b van de
      begripsomschrijving van bestuur in dit artikel; c. voor zover het betreft diplomagegevens: school, instelling
      of rechtspersoon voor hoger onderwijs als bedoeld in onderdeel c van de begripsomschrijving van bestuur in dit
      artikel;
        - *onderwijswet:* [WPO][ref51], [WEC][ref52], [WVO 2020][ref53], [WEB][ref54], [WHW][ref55], [WPO BES][ref56] of
      [WEB BES][ref57];
        - *Onze Minister:* Onze Minister van Onderwijs, Cultuur en Wetenschap;
        - *persoonsgebonden nummer:* burgerservicenummer als bedoeld in
      [artikel 1 van de Wet algemene bepalingen burgerservicenummer][ref58] of, bij ontbreken daarvan, door Onze Minister
      uitgegeven onderwijsnummer;
        - *register onderwijsdeelnemers:* het register onderwijsdeelnemers, bedoeld in [artikel 4][ref59];
        - *samenwerkingsverband:* samenwerkingsverband als bedoeld in [artikel 1 van de WPO][ref60] of
      [artikel 1.1 van de WVO 2020][ref61];
        - *vervangende leerplicht:* vervangende leerplicht als bedoeld in de [artikelen 3a][ref62] of
      [3b van de LPW][ref63];
        - *verzuim:* a. verzuim als bedoeld in [artikel 21a van de LPW][ref64]; of b. het zonder geldige reden niet meer
      volgen van het onderwijs, bedoeld in [artikel 47b van de WEC][ref65] of [artikel 8.20 WVO 2020][ref66], of van het
      onderwijs of het voortgezet algemeen volwassenenonderwijs, bedoeld in [artikel 9.2.2 van de WEB][ref67];
        - *verzuimgegevens:* gegevens over onderwijsdeelnemers die noodzakelijk zijn voor de doelen, bedoeld in
      [artikel 5, vierde lid][ref68];
        - *vrijstelling:* vrijstelling als bedoeld in de [artikelen 5][ref69], [5a][ref70] of [15 van de LPW][ref71];
        - *vrijstellingsgegevens:* gegevens over onderwijsdeelnemers die noodzakelijk zijn voor de doelen, bedoeld in
      [artikel 5, derde lid][ref72];
        - *waardedocument:* diploma, getuigschrift, cijferlijst of certificaat;
        - *WEB:* [Wet educatie en beroepsonderwijs][ref73];
        - *WEB BES:* [Wet educatie en beroepsonderwijs BES][ref74];
        - *WEC:* [Wet op de expertisecentra][ref75];
        - *WHW:* [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref76];
        - *WOT:* [Wet op het onderwijstoezicht][ref77];
        - *WPO:* [Wet op het primair onderwijs][ref78];
        - *WPO BES:* [Wet primair onderwijs BES][ref79];
        - *WVO 2020:* [Wet voortgezet onderwijs 2020][ref80].


