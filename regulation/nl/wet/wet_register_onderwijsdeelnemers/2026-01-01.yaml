  - number: '53'
    text: |-
      1 Indien het bestuur in strijd handelt met het bepaalde bij of krachtens deze wet, kan Onze Minister, onverminderd
      het bepaalde in de [Algemene wet bestuursrecht][ref1], de bekostiging, voorschotten daaronder begrepen, geheel of
      gedeeltelijk opschorten of inhouden.

      2 Onze Minister kent de bekostiging opnieuw toe indien de reden voor de toepassing van het eerste lid is vervallen.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing, indien het bestuur of het personeel van een
      onderwijsinstelling in strijd handelt met [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
