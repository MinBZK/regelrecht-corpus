  - number: '28'
    text: |-
      1 De levering van gegevens aan het register onderwijsdeelnemers en de verstrekking van gegevens uit het register
      onderwijsdeelnemers gebeurt langs elektronische weg.

      2 Op diens verzoek gebeurt de verstrekking van gegevens uit het register onderwijsdeelnemers aan betrokkene op
      papier.
    url: https://wetten.overheid.nl/BWBR0042012/2026-01-01#Artikel28
  - number: '29'
    text: |-
      1 De verstrekking van gegevens uit het register onderwijsdeelnemers langs elektronische weg is kosteloos.

      2 Onze Minister kan voor de verstrekking van gegevens uit het register onderwijsdeelnemers op papier een bij
      ministeriële regeling te bepalen vergoeding vragen.
    url: https://wetten.overheid.nl/BWBR0042012/2026-01-01#Artikel29
  - number: '30'
    text: |-
      1 Basisgegevens en het persoonsgebonden nummer worden in het register onderwijsdeelnemers bewaard in een vorm
      die het mogelijk maakt de onderwijsdeelnemer te identificeren, tot vijf jaar na beëindiging van diens laatste
      inschrijving bij een onderwijsinstelling.

      2 In afwijking van het eerste lid worden het persoonsgebonden nummer en de volgende basisgegevens van de
      onderwijsdeelnemer die niet langer is ingeschreven aan een onderwijsinstelling voor hoger onderwijs in het register
      onderwijsdeelnemers bewaard tot vijftig jaar na beëindiging van diens laatste inschrijving:

      a. de geslachtsnaam;

      b. de voornamen;

      c. de geboortedatum;

      d. de onderwijsinstelling voor hoger onderwijs waar een opleiding is gevolgd;

      e. de opleiding of opleidingen dan wel, voor zover het de Open Universiteit of een rechtspersoon van hoger
      onderwijs betreft, de onderwijseenheid of onderwijseenheden;

      f. voor zover van toepassing, de datum van het waardedocument; en

      g. het aantal jaren gevolgd hoger onderwijs.

      3 Het persoonsgebonden nummer en de basisgegevens, bedoeld in het tweede lid, worden uitsluitend bewaard ten
      behoeve van de vaststelling van de bekostiging van onderwijsinstellingen voor hoger onderwijs en de bepaling door
      die onderwijsinstellingen van het collegegeld dat studenten verschuldigd zijn.

      4 Vrijstellingsgegevens en het persoonsgebonden nummer worden in het register onderwijsdeelnemers bewaard tot een
      jaar na de datum waarop de vrijstelling of de vervangende leerplicht afloopt.

      5 Verzuimgegevens en het persoonsgebonden nummer worden in het register onderwijsdeelnemers bewaard gedurende het
      schooljaar waarin zij in het register onderwijsdeelnemers zijn opgenomen en het daaropvolgende schooljaar.

      6 Diplomagegevens en het persoonsgebonden nummer worden in het register onderwijsdeelnemers bewaard in een vorm die
      het mogelijk maakt de onderwijsdeelnemer te identificeren tot zestig jaar na de maand van afgifte van het laatst
      behaalde waardedocument of, indien dat eerder is, tot het overlijden van de onderwijsdeelnemer.
    url: https://wetten.overheid.nl/BWBR0042012/2026-01-01#Artikel30
  - number: '31'
    text: |-
      Uit het register onderwijsdeelnemers wordt desgevraagd aan de betrokkene een elektronisch document met
      diplomagegevens verstrekt dat is beveiligd tegen wijzigingen en waarvan kan worden vastgesteld dat het is afgegeven
      door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0042012/2026-01-01#Artikel31
  - number: '32'
    text: |-
      1 De betrokkene kan Onze Minister elektronisch verzoeken de diplomagegevens over hem te
      verbeteren voor zover deze afwijken van de gegevens in het desbetreffende waardedocument.
      [Artikel 2:7, tweede lid, van de Algemene wet bestuursrecht][ref1] is niet van toepassing.

      2 Onze Minister verzoekt de instantie die de diplomagegevens heeft geleverd, bedoeld in
      [artikel 12, vierde lid][ref2], om hem elektronisch de juiste gegevens te verstrekken.

      3 Voor zover die instantie constateert dat:

      a. de diplomagegevens van de betrokkene niet overeenkomen met de gegevens waarover zij beschikt, verzoekt zij Onze
      Minister om deze gegevens te verbeteren.

      b. de diplomagegevens van de betrokkene overeenkomen met de gegevens waarover zij beschikt, deelt zij dit
      elektronisch mee aan Onze Minister en geeft Onze Minister dit elektronisch door aan de betrokkene.

      c. zij niet meer over dergelijke gegevens van de betrokkene beschikt, deelt zij dit elektronisch mee aan Onze
      Minister en geeft Onze Minister dit elektronisch door aan de betrokkene. Deze kan in dat geval op vertoon van het
      desbetreffende waardedocument aan Onze Minister verzoeken de diplomagegevens over hem te verbeteren.

      4 Het eerste tot en met derde lid zijn niet van toepassing op de identificerende gegevens die zijn ontleend aan de
      basisregistratie personen.

      5 De [artikelen 2:7, tweede lid][ref3], en [2:8 van de Algemene wet bestuursrecht][ref4] zijn niet van toepassing
      op het tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0042012#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel28
    url: https://wetten.overheid.nl/BWBR0042012/2026-01-01#Artikel32
