  - number: '6'
    text: |-
      Onze Minister is voor de verwerking van persoonsgegevens in het kader van het register onderwijsdeelnemers de
      verwerkingsverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0042012/2026-01-01#Artikel6
  - number: '7'
    text: |-
      Bij ministeriële regeling worden regels gesteld over de autorisatie van degenen die onder het gezag van Onze
      Minister vallen voor verwerking van persoonsgegevens in het kader van het register onderwijsdeelnemers.
    url: https://wetten.overheid.nl/BWBR0042012/2026-01-01#Artikel7
  - number: '8'
    text: |-
      1 Het register onderwijsdeelnemers bevat voor elke daarin opgenomen onderwijsdeelnemer:

      a. het persoonsgebonden nummer; en

      b. voor zover van toepassing de basisgegevens, vrijstellingsgegevens, verzuimgegevens en diplomagegevens over de
      onderwijsdeelnemer.

      2 De gegevens, bedoeld in het eerste lid, onderdeel b, zijn gekoppeld aan het persoonsgebonden nummer van de
      desbetreffende onderwijsdeelnemer.

      3 Basisgegevens kunnen tevens deel uitmaken van een andere gegevensset over de desbetreffende onderwijsdeelnemer.

      4 Onverminderd de [artikelen 9][ref1], [10][ref2] en [11][ref3] worden bij algemene maatregel van bestuur de
      gegevens, bedoeld in het eerste lid, onderdeel b, per gegevensset vastgesteld en kan bij ministeriële regeling
      nadere specificatie van de gegevens plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0042012#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0042012#Artikel11
    url: https://wetten.overheid.nl/BWBR0042012/2026-01-01#Artikel8
