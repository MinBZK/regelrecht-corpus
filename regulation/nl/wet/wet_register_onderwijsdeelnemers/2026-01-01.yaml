  - number: '19'
    text: |-
      1 De basisgegevens worden verstrekt aan de inspectie voor zover dit noodzakelijk is voor het toezicht op het
      onderwijs door de inspectie.

      2 Bij de verstrekking, bedoeld in het eerste lid, kunnen persoonsgegevens worden verwerkt, indien dat noodzakelijk
      is voor het in het eerste lid genoemde doel, onverminderd de verplichting voor de verwerkingsverantwoordelijke
      om passende technische en organisatorische maatregelen te treffen als bedoeld in artikel 25 van de Algemene
      verordening gegevensbescherming. Gegevens over de geslachtsnaam, de voornamen, het adres en de geboortedatum
      van onderwijsdeelnemers worden niet verstrekt. In afwijking van de vorige volzin kunnen gegevens over de
      geslachtsnaam, de voornamen en het adres van onderwijsdeelnemers worden verstrekt voor zover dit noodzakelijk is om
      onderwijsdeelnemers uit te nodigen voor deelname aan onderzoeken in het kader van het toezicht op het onderwijs.

      3 Bij algemene maatregel van bestuur worden regels gesteld ter uitvoering van het eerste en tweede lid, waarbij in
      ieder geval de te verstrekken gegevens worden vastgesteld. Bij ministeriële regeling worden nadere regels gesteld
      over de inhoud en samenstelling van de gegevens en worden regels gesteld over de tijdstippen van de verstrekking en
      de perioden waarop de gegevens betrekking hebben en, onverminderd [artikel 28][ref1], de wijze van de verstrekking.

      4 Desgevraagd worden de diplomagegevens met het persoonsgebonden nummer verstrekt aan de inspectie voor zover dit
      noodzakelijk is voor het toezicht op het onderwijs door de inspectie.


      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel28
    url: https://wetten.overheid.nl/BWBR0042012/2026-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0042012
        artikel: '28'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '20'
    text: |-
      1 De basisgegevens kunnen met het persoonsgebonden nummer worden verstrekt aan het bestuur.

      2 De verzuimgegevens worden met het persoonsgebonden nummer verstrekt aan het hoofd of het bestuur voor zover dit
      noodzakelijk is voor de uitvoering van wettelijke taken door het hoofd of het bestuur inzake verzuim.

      3 Desgevraagd worden de diplomagegevens met het persoonsgebonden nummer verstrekt aan het bestuur.

      4 De verstrekking, bedoeld in het eerste lid, gebeurt uitsluitend aan:

      a. het bestuur van de onderwijsinstelling waar de betrokkene als onderwijsdeelnemer is of was ingeschreven en voor
      zover de gegevens op die periode van inschrijving betrekking hebben;

      b. het bestuur van de onderwijsinstelling waar de betrokken onderwijsdeelnemer is ingeschreven, voor zover de
      gegevens betrekking hebben op de periode waarin deze aan een andere onderwijsinstelling was ingeschreven;

      c. het bestuur van de onderwijsinstelling, bedoeld in de [WPO][ref1], de [WEC][ref2] en de [WPO BES][ref3], waar
      de betrokkene als onderwijsdeelnemer was ingeschreven, voor zover de gegevens betrekking hebben op de periode
      waarin hij is of was ingeschreven in een van de eerste drie leerjaren aan een onderwijsinstelling voor voortgezet
      onderwijs als bedoeld in de [WVO 2020][ref4] of voor voortgezet speciaal onderwijs als bedoeld in de [WEC][ref5];
      of

      d. het bestuur van onderwijsinstellingen, voor zover de gegevens noodzakelijk zijn voor de
      uitvoering van aanmeldings-, toelatings-, inschrijvings- en uitschrijvingsprocedures, bedoeld in
      [artikel 5, tweede lid, onderdeel g][ref6].

      5 De verstrekking, bedoeld in het tweede lid, gebeurt uitsluitend aan het hoofd of het bestuur van de
      onderwijsinstelling waar de betrokken onderwijsdeelnemer is ingeschreven.

      6 De verstrekking, bedoeld in het derde lid, gebeurt uitsluitend aan het bestuur van de onderwijsinstelling waar
      het desbetreffende waardedocument is behaald of voor de aanmelding, inschrijving of examinering van de betrokkene.

      7 Bij algemene maatregel van bestuur kunnen regels worden gesteld ter uitvoering van het eerste tot en met derde
      lid, worden de te verstrekken gegevens vastgesteld en wordt bepaald voor welke wettelijke taken inzake verzuim de
      verstrekking van verzuimgegevens op grond van het tweede lid gebeurt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0030280
      [ref4]: https://wetten.overheid.nl/BWBR0044212
      [ref5]: https://wetten.overheid.nl/BWBR0003549
      [ref6]: https://wetten.overheid.nl/BWBR0042012#Artikel5
