  - number: '21'
    text: |-
      1 De basisgegevens worden met het persoonsgebonden nummer verstrekt aan het college van burgemeester en wethouders
      voor zover dit noodzakelijk is voor de uitvoering van een wettelijke taak door het college van burgemeester en
      wethouders.

      2 De vrijstellingsgegevens worden met het persoonsgebonden nummer verstrekt aan het college van burgemeester en
      wethouders voor zover dit noodzakelijk is voor het toezicht op de naleving op grond van de [LPW][ref1] door het
      college van burgemeester en wethouders.

      3 De verzuimgegevens worden met het persoonsgebonden nummer verstrekt aan het college van burgemeester en
      wethouders voor zover dit noodzakelijk is voor de uitvoering van wettelijke taken door het college van burgemeester
      en wethouders inzake verzuim.

      4 Desgevraagd worden de diplomagegevens met het persoonsgebonden nummer verstrekt aan het college van burgemeester
      en wethouders voor de uitvoering van een wettelijke taak door het college van burgemeester en wethouders.

      5 Bij algemene maatregel van bestuur kunnen regels worden gesteld ter uitvoering van het eerste tot en met vierde
      lid, worden de te verstrekken gegevens vastgesteld, wordt ter uitvoering van het eerste, derde en vierde lid
      bepaald voor welke wettelijke taken verstrekking gebeurt, en wordt ter uitvoering van het derde lid de termijn voor
      de verstrekking bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0042012/2026-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002628
  - number: '22'
    text: |-
      1 De basisgegevens en de diplomagegevens worden met het persoonsgebonden nummer verstrekt aan het CBS voor zover
      dit noodzakelijk is voor de gegevensverstrekking door het CBS aan:

      a. Onze Minister voor de beleidsvoorbereiding door Onze Minister; of

      b. het college van burgemeester en wethouders voor de begrotings- en beleidsvoorbereiding inzake de gemeentelijke
      taken op het gebied van het onderwijs.

      2 Het CBS kan de gegevens die het op grond van het eerste lid heeft ontvangen, alsmede de daaraan door het
      CBS gekoppelde gegevens van belang voor statistische doeleinden op het gebied van arbeid als bedoeld in
      [artikel 33, tweede lid, onderdeel e, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], openbaar
      maken in de vorm van overzichten die betrekking hebben op afzonderlijke onderwijsinstellingen of opleidingen, voor
      zover deze overzichten geen gegevens bevatten waardoor een afzonderlijke persoon of een afzonderlijk huishouden
      wordt geïdentificeerd of identificeerbaar is.

      3 Bij algemene maatregel van bestuur kunnen regels worden gesteld ter uitvoering van het eerste lid en worden de te
      verstrekken gegevens vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel33
    url: https://wetten.overheid.nl/BWBR0042012/2026-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '33'
  - number: '23'
    text: |-
      1 Basisgegevens kunnen, voor zover dit noodzakelijk is voor onderzoeksactiviteiten naar de kwaliteit,
      toegankelijkheid of doelmatigheid van het primair onderwijs, voortgezet onderwijs, beroepsonderwijs, voortgezet
      algemeen volwassenenonderwijs of hoger onderwijs, worden verstrekt aan:

      a. instellingen als bedoeld in [artikel 1.2 van de WHW][ref1];

      b. de rechtspersoon, bedoeld in [artikel 7.15a van de WHW][ref2];

      c. Stichting Nuffic, bedoeld in
      [artikel 3a van de Wet subsidiëring landelijke onderwijsondersteunende activiteiten 2013][ref3];

      d. de stichting Kences, Kenniscentrum Studentenhuisvesting te Utrecht, en

      e. bij algemene maatregel van bestuur aan te wijzen organisaties.

      2 Voor een aanwijzing bij algemene maatregel van bestuur als bedoeld in het eerste lid, onderdeel e, komt slechts
      een organisatie in aanmerking die:

      a. een rechtspersoon met volledige rechtsbevoegdheid en zonder winstoogmerk is;

      b. een landelijke organisatie is van onderwijsdeelnemers, ouders van onderwijsdeelnemers, onderwijspersoneel of
      besturen van onderwijsinstellingen, en

      c. voldoende aannemelijk maakt dat basisgegevens noodzakelijk zijn voor onderzoeksactiviteiten naar de kwaliteit,
      toegankelijkheid of doelmatigheid van het primair onderwijs, voortgezet onderwijs, beroepsonderwijs, voortgezet
      algemeen volwassenenonderwijs of hoger onderwijs.

      3 Basisgegevens kunnen, voor zover dit noodzakelijk is voor de ondersteuning van onderwijsinstellingen en
      samenwerkingsverbanden bij hun verantwoording omtrent de kwaliteit, toegankelijkheid of doelmatigheid van het
      onderwijs, worden verstrekt aan:

      a. de Vereniging PO-Raad te Utrecht;

      b. de vereniging VO-raad te Utrecht;

      c. de vereniging MBO Raad te Woerden;

      d. de Vereniging Hogescholen te Den Haag, en

      e. Vereniging Universiteiten van Nederland te Den Haag.

      4 Bij de verstrekking, bedoeld in het eerste en derde lid, kunnen persoonsgegevens worden verwerkt, indien
      dat noodzakelijk is voor de in het eerste en derde lid genoemde doelen, onverminderd de verplichting voor de
      verwerkingsverantwoordelijke om passende technische en organisatorische maatregelen te treffen als bedoeld in
      artikel 25 van de Algemene verordening gegevensbescherming. Gegevens over de geslachtsnaam, de voornamen, het adres
      en de geboortedatum van onderwijsdeelnemers worden niet verstrekt.

      5 De verstrekking van basisgegevens vindt plaats voor zover dit is bepaald bij besluit van Onze Minister.

      6 Onze Minister neemt het besluit op verzoek van de instelling of organisatie als bedoeld in het eerste en derde
      lid. Het verzoek bevat de doelen voor de verstrekking en de gegevens waarop het verzoek betrekking heeft.

      7 Onze Minister neemt een besluit tot gegevensverstrekking als bedoeld in het vijfde lid, slechts voor zover de
      instelling of organisatie aantoont dat de in het verzoek vermelde gegevens noodzakelijk zijn voor het beoogde doel.

      8 Bij het besluit wordt in ieder geval bepaald voor welke doeleinden gegevens worden verstrekt, welke gegevens het
      betreft en welke bewaartermijn voor de gegevens moet worden gehanteerd.

      9 Aan het besluit worden voorschriften en beperkingen verbonden in het belang van een zorgvuldige en doelmatige
      gegevensverwerking.

      10 Onze Minister kan het besluit in ieder geval intrekken indien:

      a. de gegevens waarop het besluit betrekking heeft voor andere doeleinden worden verwerkt dan de doeleinden die in
      het besluit zijn genoemd, of

      b. niet wordt voldaan aan de voorschriften en beperkingen die aan het besluit zijn verbonden.

      11 Onverminderd [artikel 3:41 van de Algemene wet bestuursrecht][ref4] wordt van de besluiten, bedoeld in het
      vijfde en tiende lid, mededeling gedaan in de Staatscourant.

      12 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld ter uitvoering van dit
      artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1.2
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7.15a
      [ref3]: https://wetten.overheid.nl/BWBR0034162#Artikel3a
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel341
