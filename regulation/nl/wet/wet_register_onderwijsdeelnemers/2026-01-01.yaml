        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '14'
    text: |-
      1 Onze Minister neemt het persoonsgebonden nummer en de basisgegevens op in het register onderwijsdeelnemers na
      toetsing op juistheid en volledigheid. Onze Minister verstrekt de gegevens, zoals hij voornemens is die gegevens
      in het register onderwijsdeelnemers op te nemen, aan het bestuur. Onze Minister kan de door het bestuur verstrekte
      gegevens uitsluitend met instemming van het bestuur wijzigen.

      2 Het bestuur verstrekt Onze Minister alle inlichtingen die hij nodig acht voor de uitvoering van de in het eerste
      lid bedoelde taak. Het bestuur werkt eraan mee dat de in het register onderwijsdeelnemers opgenomen basisgegevens
      juist en volledig zijn.

      3 Indien Onze Minister naar aanleiding van de toetsing, bedoeld in het eerste lid, redenen heeft om aan te
      nemen dat een bestuur in strijd handelt of heeft gehandeld met het bepaalde bij of krachtens deze wet of een
      onderwijswet, en een onderzoek daarnaar door de inspectie nodig acht, verstrekt Onze Minister ten behoeve van dit
      onderzoek de gegevens, bedoeld in het eerste lid, van de desbetreffende onderwijsdeelnemers aan de inspectie. De
      inspectie meldt de uitkomst van het onderzoek aan Onze Minister.

      4 Voor zover de in het eerste lid bedoelde gegevens naar het oordeel van Onze Minister onjuist of onvolledig zijn,
      kan Onze Minister ten behoeve van de vaststelling van de bekostiging van deze gegevens afwijken. In dat geval
      neemt Onze Minister de door hem vastgestelde gewijzigde gegevens op in het register onderwijsdeelnemers nadat het
      desbetreffende besluit tot vaststelling van de bekostiging onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0042012/2026-01-01#Artikel14
  - number: '15'
    text: |-
      1 De basisgegevens worden verstrekt aan Onze Minister voor zover dit noodzakelijk is voor de bekostiging
      van onderwijsinstellingen, de planning van onderwijsinstellingen voor hoger onderwijs, de begrotings- en
      beleidsvoorbereiding en het toezicht op de naleving van de Wet normering topinkomens.

      2 Bij de verstrekking, bedoeld in het eerste lid, kunnen persoonsgegevens worden verwerkt, indien dat noodzakelijk
      is voor de in het eerste lid genoemde doelen, onverminderd de verplichting voor de verwerkingsverantwoordelijke
      om passende technische en organisatorische maatregelen te treffen als bedoeld in artikel 25 van de Algemene
      verordening gegevensbescherming. Gegevens over de geslachtsnaam, de voornamen, het adres en de geboortedatum
      van onderwijsdeelnemers worden niet verstrekt. In afwijking van de vorige volzin kunnen gegevens over de
      geslachtsnaam, de voornamen en het adres van onderwijsdeelnemers worden verstrekt voor zover dit noodzakelijk
      is om onderwijsdeelnemers uit te nodigen voor deelname aan onderzoeken in het kader van de begrotings- en
      beleidsvoorbereiding.

      3 De basisgegevens kunnen met het persoonsgebonden nummer worden verstrekt aan Onze Minister voor zover dat
      noodzakelijk is voor het verkeer met het bestuur over de vaststelling van de bekostiging.

      4 De basisgegevens kunnen met het persoonsgebonden nummer worden verstrekt aan Onze Minister voor zover dit
      noodzakelijk is voor de uitvoering van overige wettelijke taken door Onze Minister, waaronder wordt verstaan de
      uitvoering van taken met betrekking tot:

      a. de verstrekking van studiefinanciering, vouchers, tegemoetkomingen en langstudeerderskrediet bij of krachtens de
      [Wet studiefinanciering 2000][ref1];

      b. de verstrekking van studiefinanciering BES en opstarttoelages bij of krachtens de Wet studiefinanciering BES;

      c. de verstrekking van tegemoetkomingen in de onderwijsbijdrage en in de schoolkosten bij of krachtens de
      [Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref2];

      d. de heffing van les- en cursusgeld bij of krachtens de [Les- en cursusgeldwet][ref3];

      e. de verstrekking van subsidie bij of krachtens de Wet overige OCW-subsidies;

      f. de toepassing van [artikel 45a van de WPO][ref4], [artikel 48a van de WEC][ref5] en
      [artikel 2.96 WVO 2020][ref6];

      g. de toepassing van [artikel 51 van de WPO BES][ref7] en [artikel 11.28 WVO 2020][ref8]; en

      h. het legaliseren van bewijzen van inschrijving van een onderwijsinstelling.

      5 Bij algemene maatregel van bestuur worden regels gesteld ter uitvoering van het eerste tot en met vijfde lid,
      waarbij in ieder geval de te verstrekken gegevens worden vastgesteld. Bij ministeriële regeling worden nadere
      regels gesteld over de inhoud en samenstelling van de gegevens en worden regels gesteld over de tijdstippen van de
      verstrekking en de perioden waarop de gegevens betrekking hebben en, onverminderd [artikel 28][ref9], de wijze van
      de verstrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0012438
