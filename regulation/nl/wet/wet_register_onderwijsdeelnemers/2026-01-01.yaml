  - number: '9'
    text: |-
      1 De basisgegevens, vrijstellingsgegevens, verzuimgegevens en diplomagegevens over de onderwijsdeelnemer omvatten
      mede identificerende gegevens.

      2 De identificerende gegevens kunnen voor elke onderwijsdeelnemer niet meer omvatten dan gegevens over:

      a. de geslachtsnaam;

      b. de voornamen;

      c. het geslacht;

      d. het adres;

      e. de postcode;

      f. de geboortedatum;

      g. de overlijdensdatum;

      h. de geboorteplaats;

      i. het geboorteland;

      j. het geboorteland van elk van de ouders;

      k. de nationaliteit, waaronder begrepen gegevens waaruit blijkt of de onderwijsdeelnemer op grond van
      [artikel 2.2 van de Wet studiefinanciering 2000][ref1] met een Nederlander wordt gelijkgesteld;

      l. het verblijf in en het vertrek uit Nederland; of

      m. het verblijfsrecht van de vreemdeling.

      3 De identificerende gegevens worden verkregen uit de basisregistratie personen.

      4 Indien identificerende gegevens niet voorkomen in de basisregistratie personen, worden zij in het register
      onderwijsdeelnemers opgenomen voor zover zij deel uitmaken van de levering op grond van [artikel 12][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel2.2
      [ref2]: https://wetten.overheid.nl/BWBR0042012#Artikel12
