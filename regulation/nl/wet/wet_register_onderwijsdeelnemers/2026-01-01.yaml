  - number: '16'
    text: |-
      1 De vrijstellingsgegevens worden verstrekt aan Onze Minister voor zover dit noodzakelijk is voor de
      beleidsvoorbereiding door Onze Minister over vrijstellingen en vervangende leerplicht.

      2 De verstrekking, bedoeld in het eerste lid, gebeurt in geaggregeerde vorm en betreft uitsluitend zodanige
      gegevens dat de betrokken onderwijsdeelnemers niet worden geïdentificeerd of identificeerbaar zijn.

      3 Bij algemene maatregel van bestuur worden de te verstrekken gegevens vastgesteld.

      4 Aan Onze Minister worden de persoonsgebonden nummers verstrekt van de onderwijsdeelnemers van wie
      vrijstellingsgegevens zijn opgenomen in het register onderwijsdeelnemers vanwege vrijstelling van de leerplicht op
      grond van de [artikelen 5][ref1], [5a][ref2] of [15 van de LPW][ref3].

      5 Onze Minister gebruikt de gegevens, bedoeld in het vierde lid, uitsluitend ten behoeve van:

      a. de bijstelling van het aantal voortijdig schoolverlaters dat blijkt uit het register onderwijsdeelnemers;

      b. de controle aan de hand van het register onderwijsdeelnemers of de onderwijsdeelnemer is ingeschreven bij een
      onderwijsinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel15
