      1 De basisgegevens worden verstrekt aan door Onze Minister aangewezen onderzoeksinstellingen voor zover dit
      noodzakelijk is voor onderzoeksactiviteiten naar de kwaliteit en toegankelijkheid van het beroepsonderwijs, het
      voortgezet algemeen volwassenenonderwijs en het hoger onderwijs.

      2 Bij algemene maatregel van bestuur kunnen regels worden gesteld ter uitvoering van het eerste lid.
