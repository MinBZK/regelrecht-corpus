  - number: '3'
    text: |-
      Voor zover de bij of krachtens deze wet gegeven voorschriften de onderwijsinstellingen betreffen, zijn zij regels
      voor het openbaar onderwijs en voorwaarden voor bekostiging van het bijzonder onderwijs.
    url: https://wetten.overheid.nl/BWBR0042012/2021-07-01#Artikel3
  - number: '4'
    text: |-
      1 Er is een register onderwijsdeelnemers, waarin basisgegevens, vrijstellingsgegevens, verzuimgegevens,
      diplomagegevens en persoonsgebonden nummers van onderwijsdeelnemers zijn opgenomen.

      2 Onze Minister draagt zorg voor het beheer van het register onderwijsdeelnemers.
    url: https://wetten.overheid.nl/BWBR0042012/2021-07-01#Artikel4
  - number: '5'
    text: |-
      1 Het register onderwijsdeelnemers heeft tot doel gegevens over onderwijsdeelnemers te verstrekken voor de doelen,
      bedoeld in de volgende leden.

      2 Basisgegevens worden verstrekt ten behoeve van:

      a. de bekostiging van onderwijsinstellingen door Onze Minister;

      b. de planning van onderwijsinstellingen voor hoger onderwijs door Onze Minister;

      c. de begrotings- en beleidsvoorbereiding door Onze Minister;

      d. de uitvoering van overige wettelijke taken door Onze Minister;

      e. het toezicht op het onderwijs door de inspectie;

      f. de gegevensverstrekking door het CBS aan:

      1°. Onze Minister voor de beleidsvoorbereiding door Onze Minister; of

      2°. het college van burgemeester en wethouders voor de begrotings- en beleidsvoorbereiding inzake de gemeentelijke
      taken op het gebied van het onderwijs;

      g. de uitvoering van aanmeldings-, toelatings- en inschrijvingsprocedures door onderwijsinstellingen als bedoeld
      in de [WEB][ref1], de [WHW][ref2] en de [WEB BES][ref3] en van aanmeldings-, toelatings-, inschrijvings- en
      uitschrijvingsprocedures door onderwijsinstellingen als bedoeld in de [WPO][ref4], de [WEC][ref5], de [WVO][ref6],
      de [WPO BES][ref7] en de [WVO BES][ref8]; of

      h. de verstrekking van waardedocumenten door onderwijsinstellingen.

      3 Vrijstellingsgegevens worden verstrekt ten behoeve van:

      a. de bekostiging van onderwijsinstellingen en de begrotings- en beleidsvoorbereiding door Onze Minister in verband
      met het aantal voortijdig schoolverlaters;

      b. de beleidsvoorbereiding door Onze Minister over vrijstellingen en vervangende leerplicht; of

      c. het toezicht op de naleving op grond van de [LPW][ref9] door het college van burgemeester en wethouders.

      4 Verzuimgegevens worden verstrekt ten behoeve van:

      a. de uitvoering van wettelijke taken inzake verzuim door het hoofd, het bestuur en het college van burgemeester en
      wethouders; of

      b. de beleidsvoorbereiding over verzuim door Onze Minister.

      5 Diplomagegevens worden verstrekt ten behoeve van het beschikbaar maken van betrouwbare diploma-informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0005682
