$id: wet_register_onderwijsdeelnemers
regulatory_layer: WET
publication_date: '2020-03-04'
valid_from: '2021-07-01'
bwb_id: BWBR0042012
url: https://wetten.overheid.nl/BWBR0042012/2021-07-01
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de wetgeving over de registers met betrekking tot
    onderwijsdeelnemers doorzichtiger en toegankelijker te maken en ook overigens te moderniseren, en deze daartoe te
    bundelen in een nieuwe Wet register onderwijsdeelnemers, onder wijziging van diverse onderwijswetten;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0042012/2021-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt, voor zover niet anders is bepaald, verstaan onder:

        - *basisgegevens:* gegevens over onderwijsdeelnemers die noodzakelijk zijn voor de doelen, bedoeld in
      [artikel 5, tweede lid][ref1];
        - *basisregistratie personen:* de basisregistratie personen, bedoeld in
      [artikel 1.2 van de Wet basisregistratie personen][ref2];
        - *bestuur:* instellingsbestuur als bedoeld in de [WHW][ref3] of bevoegd gezag als bedoeld in de overige
      onderwijswetten van een onderwijsinstelling, met dien verstande dat daaronder wordt verstaan: a. voor
      zover het betreft basisgegevens: 1°. bevoegd gezag of instellingsbestuur van een door het Rijk bekostigde
      school of instelling als bedoeld in de [WPO][ref4], [WEC][ref5], [WVO][ref6], [WEB][ref7], [WHW][ref8],
      [WPO BES][ref9], [WVO BES][ref10] of [WEB BES][ref11]; 2°. bevoegd gezag van een niet door het Rijk bekostigde
      school of instelling als bedoeld in [artikel 56 van de WVO][ref12] of de [artikelen 1.4.1][ref13] en
      [1.4a.1 van de WEB][ref14]; of 3°. instellingsbestuur van een rechtspersoon voor hoger onderwijs als bedoeld
      in [artikel 1.1, onderdeel aa, van de WHW][ref15]; b. voor zover het betreft verzuimgegevens: 1°. bevoegd
      gezag van een door het Rijk bekostigde school of instelling als bedoeld in de [WEC][ref16], [WVO][ref17] of
      [WEB][ref18]; of 2°. bevoegd gezag van een niet door het Rijk bekostigde school of instelling als bedoeld in
      [artikel 56 van de WVO][ref19] of de [artikelen 1.4.1][ref20] en [1.4a.1 van de WEB][ref21]; c. voor zover
      het betreft diplomagegevens: 1°. bevoegd gezag of instellingsbestuur van een door het Rijk bekostigde school
      of instelling als bedoeld in de [WEC][ref22], [WVO][ref23], [WEB][ref24] of [WHW][ref25]; 2°. bevoegd gezag
      van een niet door het Rijk bekostigde school of instelling als bedoeld in [artikel 56 van de WVO][ref26] of de
      [artikelen 1.4.1][ref27] en [1.4a.1 van de WEB][ref28]; of 3°. instellingsbestuur van een rechtspersoon voor hoger
      onderwijs als bedoeld in [artikel 1.1, onderdeel aa, van de WHW][ref29].
        - *CBS:* het Centraal bureau voor de statistiek, bedoeld in
      [artikel 2 van de Wet op het Centraal bureau voor de statistiek][ref30];
        - *College voor toetsen en examens:* het College voor toetsen en examens, bedoeld in
      [artikel 2 van de Wet College voor toetsen en examens][ref31];
        - *derde:* derde als bedoeld in artikel 4 van de Algemene verordening gegevensbescherming;
        - *diplomagegevens:* gegevens over onderwijsdeelnemers die noodzakelijk zijn voor het doel, bedoeld in
      [artikel 5, vijfde lid][ref32];
        - *gegevensset:* basisgegevens, vrijstellingsgegevens, verzuimgegevens of diplomagegevens;
        - *hoofd:* hoofd als bedoeld in de [LPW][ref33]: a. van een door het Rijk bekostigde school of instelling als
      bedoeld in de [WPO][ref34], [WEC][ref35], [WVO][ref36] of de [WEB][ref37]; of b. van een niet door het Rijk
      bekostigde school of instelling als bedoeld in [artikel 56 van de WVO][ref38] of [artikel 1.4.1 van de WEB][ref39];
        - *identificerende gegevens:* gegevens als bedoeld in [artikel 9][ref40];
        - *inspectie:* de Inspectie van het onderwijs, bedoeld in [artikel 1 van de WOT][ref41];
        - *LPW:* [Leerplichtwet 1969][ref42];
        - *onderwijsdeelnemer:* leerling, deelnemer, student of extraneus als bedoeld in een onderwijswet van een
      onderwijsinstelling, met dien verstande dat daaronder wordt verstaan: a. voor zover het betreft basisgegevens:
      leerling, vavo-student, deelnemer, mbo-student, ho-student of extraneus van een school, instelling of rechtspersoon
      voor hoger onderwijs als bedoeld in onderdeel a van de begripsomschrijving van bestuur in dit artikel; b. voor
      zover het betreft verzuimgegevens: leerling, vavo-student, deelnemer of mbo-student van een school of instelling
      als bedoeld in onderdeel b van de begripsomschrijving van bestuur in dit artikel; c. voor zover het betreft
      diplomagegevens: 1°. leerling, deelnemer, student of extraneus van een school, instelling of rechtspersoon voor
      hoger onderwijs als bedoeld in onderdeel c van de begripsomschrijving van bestuur in dit artikel; of 2°. degene
      die een staatsexamen als bedoeld in [artikel 60, eerste of tweede lid, van de WVO][ref43] of een inburgeringsexamen
      als bedoeld in [artikel 7 van de Wet inburgering][ref44] heeft afgelegd; d. voor zover het betreft
      vrijstellingsgegevens: jongere als bedoeld in de [artikelen 5][ref45], [5a][ref46] en [15 van de LPW][ref47];
        - *onderwijsinstelling:* school, instelling of rechtspersoon voor hoger onderwijs als bedoeld in een onderwijswet,
      met dien verstande dat daaronder wordt verstaan: a. voor zover het betreft basisgegevens: school, instelling
      of rechtspersoon voor hoger onderwijs als bedoeld in onderdeel a van de begripsomschrijving van bestuur in
      dit artikel; b. voor zover het betreft verzuimgegevens: school of instelling als bedoeld in onderdeel b van de
      begripsomschrijving van bestuur in dit artikel; c. voor zover het betreft diplomagegevens: school, instelling
      of rechtspersoon voor hoger onderwijs als bedoeld in onderdeel c van de begripsomschrijving van bestuur in dit
      artikel;
        - *onderwijswet:* [WPO][ref48], [WEC][ref49], [WVO][ref50], [WEB][ref51], [WHW][ref52], [WPO BES][ref53],
      [WVO BES][ref54] of [WEB BES][ref55];
        - *Onze Minister:* Onze Minister van Onderwijs, Cultuur en Wetenschap;
        - *persoonsgebonden nummer:* burgerservicenummer als bedoeld in
      [artikel 1 van de Wet algemene bepalingen burgerservicenummer][ref56] of, bij ontbreken daarvan, door Onze Minister
      uitgegeven onderwijsnummer;
        - *register onderwijsdeelnemers:* het register onderwijsdeelnemers, bedoeld in [artikel 4][ref57];
        - *vervangende leerplicht:* vervangende leerplicht als bedoeld in de [artikelen 3a][ref58] of
      [3b van de LPW][ref59];
        - *verzuim:* a. verzuim als bedoeld in [artikel 21a van de LPW][ref60]; of b. het zonder geldige reden niet meer
      volgen van het onderwijs, bedoeld in [artikel 47b van de WEC][ref61] of [artikel 28a van de WVO][ref62], of van het
      onderwijs of het voortgezet algemeen volwassenenonderwijs, bedoeld in [artikel 8.1.8a van de WEB][ref63];
        - *verzuimgegevens:* gegevens over onderwijsdeelnemers die noodzakelijk zijn voor de doelen, bedoeld in
      [artikel 5, vierde lid][ref64];
        - *vrijstelling:* vrijstelling als bedoeld in de [artikelen 5][ref65], [5a][ref66] of [15 van de LPW][ref67];
        - *vrijstellingsgegevens:* gegevens over onderwijsdeelnemers die noodzakelijk zijn voor de doelen, bedoeld in
      [artikel 5, derde lid][ref68];
        - *waardedocument:* diploma, getuigschrift, cijferlijst of certificaat;
        - *WEB:* [Wet educatie en beroepsonderwijs][ref69];
        - *WEB BES:* [Wet educatie en beroepsonderwijs BES][ref70];
        - *WEC:* [Wet op de expertisecentra][ref71];
        - *WHW:* [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref72];
        - *WOT:* [Wet op het onderwijstoezicht][ref73];
        - *WPO:* [Wet op het primair onderwijs][ref74];
        - *WPO BES:* [Wet primair onderwijs BES][ref75];
        - *WVO:* [Wet op het voortgezet onderwijs][ref76];
        - *WVO BES:* [Wet voortgezet onderwijs BES][ref77].


