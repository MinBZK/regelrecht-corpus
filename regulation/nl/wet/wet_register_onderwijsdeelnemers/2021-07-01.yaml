  - number: '11'
    text: |-
      1 Gegevens over gezondheid als bedoeld in
      [artikel 30 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1] kunnen deel uitmaken van de
      basisgegevens. Deze gegevens worden uitsluitend verstrekt aan:

      a. de betrokkene;

      b. Onze Minister ten behoeve van de bekostiging van onderwijsinstellingen of de begrotings- en
      beleidsvoorbereiding, onverminderd [artikel 15, tweede en derde lid][ref2];

      c. de inspectie ten behoeve van het toezicht op het onderwijs, onverminderd [artikel 19, tweede lid][ref3];

      d. het college van burgemeester en wethouders ten behoeve van de uitvoering van de taak, bedoeld in
      [artikel 5 van de Wet publieke gezondheid][ref4];

      e. het CBS ten behoeve van de gegevensverstrekking, bedoeld in [artikel 5, tweede lid, onderdeel f][ref5];

      f. het bestuur, bedoeld in [artikel 20, vierde lid][ref6].

      2 Persoonsgegevens waaruit religieuze of levensbeschouwelijke overtuigingen blijken, gegevens over gezondheid
      en persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref7] onderscheidenlijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref8] kunnen deel uitmaken van de
      verzuimgegevens. Deze gegevens worden uitsluitend verstrekt aan:

      a. de betrokkene;

      b. Onze Minister ten behoeve van de beleidsvoorbereiding over verzuim, onverminderd [artikel 17, tweede lid][ref9];

      c. het hoofd, het bestuur en het college van burgemeester en wethouders ten behoeve van de uitvoering van
      wettelijke taken inzake verzuim.


