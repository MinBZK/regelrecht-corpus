  - number: '12'
    text: |-
      1 Het bestuur levert Onze Minister de basisgegevens.

      2 Het college van burgemeester en wethouders levert Onze Minister de vrijstellingsgegevens.

      3 Het hoofd, het bestuur en het college van burgemeester en wethouders leveren Onze Minister de verzuimgegevens
      voor zover deze niet ook basisgegevens zijn.

      4 Het bestuur, het College voor toetsen en examens en de Minister van Sociale Zaken en Werkgelegenheid leveren Onze
      Minister de diplomagegevens voor zover deze niet ook basisgegevens zijn.

      5 De gegevens, bedoeld in het eerste tot en met vierde lid, worden geleverd met het persoonsgebonden nummer van
      de onderwijsdeelnemer.

      6 Bij algemene maatregel van bestuur worden de gegevens die worden geleverd op grond van dit artikel per
      gegevensset vastgesteld. Bij ministeriële regeling kunnen de gegevens nader worden gespecificeerd.

      7 Bij algemene maatregel van bestuur wordt bepaald onder welke voorwaarden en in welke gevallen de levering,
      bedoeld in het tweede tot en met vijfde lid, gebeurt en wordt bepaald hoe de levering van verzuimgegevens en
      diplomagegevens is verdeeld tussen de leverende instanties, bedoeld in het derde en vierde lid.

      8 Bij ministeriële regeling kunnen regels worden gesteld over de termijnen voor de levering, de tijdstippen en,
      onverminderd [artikel 28][ref1], de wijze van de levering, bedoeld in het eerste tot en met vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel28
    url: https://wetten.overheid.nl/BWBR0042012/2021-07-01#Artikel12
