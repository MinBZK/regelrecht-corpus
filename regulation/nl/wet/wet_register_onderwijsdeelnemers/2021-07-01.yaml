      1 Onze Minister verstrekt uit het register onderwijsdeelnemers niet het persoonsgebonden nummer van
      onderwijsdeelnemers ter uitvoering van [artikel 107, zevende lid, van de Vreemdelingenwet 2000][ref1], tenzij
      verstrekking noodzakelijk is voor de nakoming van een verplichting als referent als bedoeld in die wet of voor het
      toezicht op de naleving van de wettelijke voorschriften over een dergelijke referent.

      2 Onze Minister en de inspectie verstrekken ter uitvoering van
      [artikel 107, zevende lid, van de Vreemdelingenwet 2000][ref2] geen gegevens die zij hebben ontvangen op grond
      van [artikel 14, derde lid][ref3], tenzij deze gegevens noodzakelijk zijn voor de nakoming van een verplichting
      als referent als bedoeld in de [Vreemdelingenwet 2000][ref4] of voor het toezicht op de naleving van de wettelijke
      voorschriften over een dergelijke referent.


