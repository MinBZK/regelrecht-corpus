    text: |-
      1

      2
    url: https://wetten.overheid.nl/BWBR0042012/2021-07-01#Artikel51
  - number: '53'
    text: |-
      1 Indien het bestuur in strijd handelt met het bepaalde bij of krachtens deze wet, kan Onze Minister, onverminderd
      het bepaalde in de [Algemene wet bestuursrecht][ref1], de bekostiging, voorschotten daaronder begrepen, geheel of
      gedeeltelijk opschorten of inhouden.

      2 Onze Minister kent de bekostiging opnieuw toe indien de reden voor de toepassing van het eerste lid is vervallen.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing, indien het bestuur of het personeel van een
      onderwijsinstelling in strijd handelt met [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel520
    url: https://wetten.overheid.nl/BWBR0042012/2021-07-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 5:20
  - number: '54'
    text: |-
      Onze Minister zendt binnen vijf jaar nadat deze wet in werking is getreden aan de Staten-Generaal een verslag over
      de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0042012/2021-07-01#Artikel54
  - number: '55'
    text: |-
      Onze Minister neemt de gegevens in het basisregister onderwijs, bedoeld in [artikel 24b van de WOT][ref1], het
      meldingsregister relatief verzuim, bedoeld in [artikel 24h van die wet][ref2], het diplomaregister, bedoeld
      in [artikel 24m van die wet][ref3] en het register vrijstellingen en vervangende leerplicht, bedoeld in
      [artikel 24k2 van die wet][ref4], zoals deze artikelen luidden voor de inwerkingtreding van deze wet, op in het
      register onderwijsdeelnemers, voor zover deze gegevens overeenkomen met de gegevens die bij of krachtens deze wet
      in het register onderwijsdeelnemers worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24b
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel24h
