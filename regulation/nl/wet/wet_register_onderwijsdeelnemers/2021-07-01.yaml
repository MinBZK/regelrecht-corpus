  - number: '21'
    text: |-
      1 De basisgegevens worden met het persoonsgebonden nummer verstrekt aan het college van burgemeester en wethouders
      voor zover dit noodzakelijk is voor de uitvoering van een wettelijke taak door het college van burgemeester en
      wethouders.

      2 De vrijstellingsgegevens worden met het persoonsgebonden nummer verstrekt aan het college van burgemeester en
      wethouders voor zover dit noodzakelijk is voor het toezicht op de naleving op grond van de [LPW][ref1] door het
      college van burgemeester en wethouders.

      3 De verzuimgegevens worden met het persoonsgebonden nummer verstrekt aan het college van burgemeester en
      wethouders voor zover dit noodzakelijk is voor de uitvoering van wettelijke taken door het college van burgemeester
      en wethouders inzake verzuim.

      4 Bij algemene maatregel van bestuur kunnen regels worden gesteld ter uitvoering van het eerste tot en met derde
      lid, worden de te verstrekken gegevens vastgesteld, wordt ter uitvoering van het eerste en derde lid bepaald
      voor welke wettelijke taken verstrekking gebeurt, en wordt ter uitvoering van het derde lid de termijn voor de
      verstrekking bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0042012/2021-07-01#Artikel21
