  - number: '22'
    text: |-
      1 De basisgegevens en de diplomagegevens worden met het persoonsgebonden nummer verstrekt aan het CBS voor zover
      dit noodzakelijk is voor de gegevensverstrekking door het CBS aan:

      a. Onze Minister voor de beleidsvoorbereiding door Onze Minister; of

      b. het college van burgemeester en wethouders voor de begrotings- en beleidsvoorbereiding inzake de gemeentelijke
      taken op het gebied van het onderwijs.

      2 Het CBS kan de gegevens die het op grond van het eerste lid heeft ontvangen, alsmede de daaraan door het
      CBS gekoppelde gegevens van belang voor statistische doeleinden op het gebied van arbeid als bedoeld in
      [artikel 33, tweede lid, onderdeel e, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], openbaar
      maken in de vorm van overzichten die betrekking hebben op afzonderlijke onderwijsinstellingen of opleidingen, voor
      zover deze overzichten geen gegevens bevatten waardoor een afzonderlijke persoon of een afzonderlijk huishouden
      wordt geïdentificeerd of identificeerbaar is.

      3 Bij algemene maatregel van bestuur kunnen regels worden gesteld ter uitvoering van het eerste lid en worden de te
      verstrekken gegevens vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel33
