      1 Onverminderd het bepaalde bij of krachtens andere wetten, worden het persoonsgebonden nummer en de gegevens,
      bedoeld in [artikel 8, eerste lid, onderdeel b][ref1], verstrekt aan een bestuursorgaan dat niet is genoemd in de
      [artikelen 15 tot en met 22][ref2], voor zover dit noodzakelijk is voor de uitvoering van een wettelijke taak door
      dat bestuursorgaan.

      2 Bij algemene maatregel van bestuur kunnen regels worden gesteld ter uitvoering van het eerste lid, wordt bepaald
      welke bestuursorganen voor verstrekking in aanmerking komen en voor welke wettelijke taken als bedoeld in het
      eerste lid die verstrekking gebeurt, en worden de te verstrekken gegevens vastgesteld.


