  - number: '56'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende artikelen of
      onderdelen daarvan, voor de verschillende onderwijssectoren en voor het Europese deel van Nederland en de openbare
      lichamen Bonaire, Sint Eustatius en Saba verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0042012/2021-07-01#Artikel56
