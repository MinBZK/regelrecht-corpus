articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. Barp: het [Besluit algemene rechtspositie politie][ref1];

      b. Bbp: het [Besluit bezoldiging politie][ref2];

      c. ambtenaar: de ambtenaar, bedoeld in [artikel 1, eerste lid, onderdeel i, van het Barp][ref3];

      d. bevoegd gezag: het bevoegd gezag, bedoeld in [artikel 1, eerste lid, onderdeel l, van het Barp][ref4];

      e. bron: een van de bronnen, genoemd in [artikel 3, eerste lid, van deze regeling][ref5];

      f. instelling: de Coöperatieve Centrale Raiffeisen-Boerenleenbank B.A. en Robeco Institutional Asset Management
      B.V.;

      g. verlofspaarrekening: een geblokkeerde rekening op naam van de ambtenaar bij de instelling;

      h. verlofspaarloon: de op een rekening bij de instelling gestorte inhoudingen, vermeerderd met de daarop gekweekte
      inkomsten.


