  - number: '8'
    text: |-
      1 De ambtenaar dient uiterlijk zes maanden voor de gewenste aanvang van het verlof een aanvraag in tot het opnemen
      van het gespaarde verlof.

      2 In zijn aanvraag meldt de ambtenaar:

      a. de begin- en einddatum van de gewenste verlofperiode;

      b. wanneer de stortingen op de verlofspaarrekening moeten worden beëindigd;

      c. of het verlofspaarloon geheel of gedeeltelijk moet worden aangewend tijdens de verlofperiode; en

      d. zijn toestemming dat het bevoegd gezag bij een voor de ambtenaar positieve beslissing op de aanvraag mede
      namens hem aan de instelling kan verzoeken maandelijks een deel van het verlofspaarloon dat overeenkomt met het in
      [artikel 10, eerste lid][ref1], bedoelde bedrag aan het bevoegd gezag beschikbaar te stellen.

      3 Het bevoegd gezag kan nadere regels stellen met betrekking tot de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0015806#Artikel10
    url: https://wetten.overheid.nl/BWBR0015806/2006-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015806
        artikel: '10'
  - number: '9'
    text: |-
      1 Het bevoegd gezag kent de aanvraag tot het opnemen van het gespaarde verlof toe, tenzij:

      a. de verlofperiode is gelegen binnen twaalf maanden voorafgaande aan het ontslag op grond van
      [artikel 94, eerste lid, onderdeel g van het Barp][ref1], dan wel is gelegen binnen twaalf maanden voorafgaande
      aan zijn periode van non-activiteit zoals bedoeld in [artikel 13b van het Barp][ref2], danwel de aanvraag
      tot het opnemen van het gespaarde verlof wordt gedaan door een ambtenaar bedoeld in [artikel 88][ref3] of
      [88a van het Barp][ref4] en binnen twaalf maanden voorafgaande aan de voor hem geldende ontslagdatum;

      b. ernstige bezwaren voor de bedrijfsvoering voortvloeien uit toekenning van het verzoek;

      c. in de drie jaren voorafgaande aan het moment waarop de gewenste verlofperiode aanvangt aan de ambtenaar reeds
      eerder een verlofperiode op grond van deze regeling is toegekend door hetzelfde bevoegd gezag; of

      d. het verlofspaarloon op de spaarrekening ontoereikend is om het op de ambtenaar te verhalen gedeelte van de
      pensioenbijdrage, GVP-bijdrage, contributies en loonheffing te voldoen.

      2 In afwijking van het eerste lid kan de aanvraag tot het opnemen van het gespaarde verlof van
      een ambtenaar bedoeld in [artikel 88][ref5] wel worden toegekend binnen een jaar voorafgaande aan
      de voor hem geldende ontslagdatum indien de ambtenaar heeft verzocht tot uitstel van het ontslag
      op zestigjarige leeftijd en met toepassing van [artikel 49a][ref6] dan wel met toepassing van
      [artikel 50, eerste lid, onderdeel g, van het Barp][ref7] is vastgesteld dat hiertegen geen bezwaar bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel94
