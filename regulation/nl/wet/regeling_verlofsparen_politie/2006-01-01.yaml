  - number: '10'
    text: |-
      1 Tijdens de periode waarin het gespaarde verlof wordt genoten verstrekt het bevoegd gezag de ambtenaar maandelijks
      een gelijk bedrag dat niet hoger is dan de bezoldiging in de maand voorafgaande aan de verlofperiode.

      2 Op het in het eerste lid bedoelde bedrag wordt ingehouden:

      a. het op de ambtenaar te verhalen gedeelte van de pensioenbijdrage;

      b. de GVP-bijdrage;

      c. de loonheffing; en

      d. de contributies waarmee de ambtenaar heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0015806/2006-01-01#Artikel10
  - number: '11'
    text: |-
      1 Indien de ambtenaar tijdens de periode waarin het gespaarde verlof wordt genoten ongeschikt is tot het verrichten
      van zijn arbeid wegens ziekte, is hij verplicht daarvan terstond mededeling te doen aan het bevoegd gezag. De
      ambtenaar is tevens verplicht zijn herstel terstond te melden.

      2 Indien de ambtenaar tijdens de verlofperiode in totaliteit meer dan 28 dagen ziek is wordt, als de periode waarin
      het gespaarde verlof wordt genoten is vastgesteld op een volledig kalenderjaar, de verlofperiode beëindigd. Als de
      periode waarin het gespaarde verlof wordt genoten korter is dan een volledig kalenderjaar wordt het aantal dagen,
      bedoeld in de eerste volzin, vastgesteld naar rato van die kortere periode.

      3 Zodra de in het tweede lid bedoelde ambtenaar is hersteld maakt hij samen met het bevoegd gezag een afspraak over
      het resterende spaarverlof.

      4 Voor de toepassing van [artikel 42 Bbp][ref1] wordt de periode waarin het gespaarde verlof wordt genoten gelijk
      gesteld aan buitengewoon verlof zonder behoud van bezoldiging.

      5 Indien het zwangerschaps- en bevallingsverlof bedoeld in [artikel 55 van het Barp][ref2] geheel of gedeeltelijk
      in de periode valt waarin het gespaarde verlof wordt genoten wordt de resterende verlofperiode gedurende het
      zwangerschaps- en bevallingsverlof opgeschort en vervolgens aansluitend aan het bevallingsverlof genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel55
    url: https://wetten.overheid.nl/BWBR0015806/2006-01-01#Artikel11
