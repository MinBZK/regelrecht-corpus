  - number: '12'
    text: |-
      1 De instelling verstrekt de ambtenaar uiterlijk voor 1 februari van enig kalenderjaar een overzicht van het
      opgebouwde verlofspaarloon per 31 december van het voorgaande kalenderjaar.

      2 Bij beëindiging van de dienstbetrekking door ontslag verkrijgt de ambtenaar, indien hij te kennen heeft gegeven
      het verlofspaarloon te willen inbrengen in een regeling voor verlofsparen bij de nieuwe werkgever, uiterlijk drie
      maanden na het ontslag een overzicht van het opgebouwde verlofspaarloon.

      3 Een aanvraag van de ambtenaar bij het bevoegd gezag om het spaartegoed uit een eerdere dienstbetrekking over te
      hevelen naar de verlofspaarrekening wordt toegekend.
    url: https://wetten.overheid.nl/BWBR0015806/2006-01-01#Artikel12
  - number: '13'
    text: |-
      1 Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 1 januari 2003.

      2 Een periode van onbezoldigd verlof, bedoeld in de eerste volzin, kan vanaf 1 januari 2005 worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0015806/2006-01-01#Artikel13
