  - number: '2'
    text: |-
      De ambtenaar kan door middel van het inzetten van bronnen een geldelijke voorziening sparen ten behoeve van het
      opnemen van een periode van onbezoldigd verlof van in beginsel minimaal twee maanden tot maximaal twaalf maanden.
    url: https://wetten.overheid.nl/BWBR0015806/2006-01-01#Artikel2
  - number: '3'
    text: |-
      1 Met inachtneming van deze regeling kan de ambtenaar jaarlijks maximaal twee van de volgende aanspraken als
      bronnen inzetten:

      a. zijn salaris, vastgesteld aan de hand van één van de bijlagen van het [Bbp][ref1];

      b. zijn vakantie-uitkering;

      c. zijn vakantie-uren met inachtneming van het bepaalde in [artikel 22, tweede lid, van het Barp][ref2];

      d. zijn uitkering, bedoeld in [artikel 25a][ref3] en [25b, van het Bbp][ref4];

      e. zijn vergoeding, bedoeld in [artikel 27, dertiende lid, van het Bbp][ref5];

      f. zijn vergoeding, bedoeld in [artikel 28a, van het Barp][ref6].

      2 Indien van toepassing, wordt de waarde van de bron vastgesteld op de waarde op de dag waarop het bedrag wordt
      gestort op de verlofspaarrekening.

      3 Het bedrag dat maximaal per kalenderjaar op de verlofspaarregeling kan worden gestort wordt vastgesteld met
      toepassing van [artikel 14, eerste lid, van de Uitvoeringsregeling loonbelasting 2001][ref7]. Indien aan het
      einde van een kalenderjaar wordt vastgesteld dat dit maximum is overschreden wordt het meerdere uitbetaald aan
      de ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006517
