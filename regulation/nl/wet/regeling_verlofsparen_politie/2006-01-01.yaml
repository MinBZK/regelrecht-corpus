  - number: '4'
    text: |-
      1 De ambtenaar kan bij het bevoegd gezag jaarlijks een aanvraag tot verlofsparen indienen.

      2 In zijn aanvraag meldt de ambtenaar:

      a. uit welke bronnen moet worden gespaard en tot welk bedrag;

      b. of de met het sparen gemoeide inhouding maandelijks of eenmalig geschiedt; en

      c. bij eerste aanvraag of hij in een eerdere betrekking een spaartegoed heeft opgebouwd.

      3 De eerste aanvraag gaat vergezeld van:

      a. een schriftelijke verklaring waarin de ambtenaar ermee instemt dat het bevoegd gezag op naam van de ambtenaar
      een verlofspaarrekening opent bij de instelling;

      b. een schriftelijke verklaring waarin de ambtenaar instemming verleent dat de instelling het bevoegd gezag
      jaarlijks informatie verstrekt over de omvang van het verlofspaarloon; en

      c. indien de ambtenaar reeds een spaartegoed in een eerdere betrekking heeft opgebouwd, een schriftelijke
      verklaring daarvan met daarbij gevoegd een verklaring van de instelling waaruit de omvang van dat spaartegoed
      blijkt.

      4 De ambtenaar dient de aanvraag in voor 1 januari van het kalenderjaar waarop de aanvraag betrekking heeft.

      5 Het bevoegd gezag kan nadere regels stellen met betrekking tot de aanvraag.
    url: https://wetten.overheid.nl/BWBR0015806/2006-01-01#Artikel4
  - number: '5'
    text: |-
      1 Het bevoegd gezag beslist binnen zes weken na ontvangst van de aanvraag tot verlofsparen.

      2 Het bevoegd gezag wijst de aanvraag af indien aan het begin van het kalenderjaar sprake is van de situatie
      bedoeld in [artikel 14, eerste lid, onderdeel b, van de Uitvoeringsregeling loonbelasting 2001][ref1].

      3 De aanvraag kan door het bevoegd gezag worden afgewezen indien:

      a. de aanvraag niet tijdig is ingediend; of

      b. niet alle met de aanvraag gemoeide bescheiden zijn overlegd.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel14
    url: https://wetten.overheid.nl/BWBR0015806/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '14'
  - number: '6'
    text: |-
      1 Uiterlijk de tweede betaalperiode volgend op de betaalperiode waarin het bevoegd gezag de aanvraag tot
      verlofsparen heeft toegekend wordt aangevangen met het storten van maandelijks ingezette bronnen.

      2 Het storten van eenmalig ingezette bronnen vindt plaats in de maand dat deze bron aan de ambtenaar zou worden
      uitbetaald.

      3 Stortingen van bronnen waaraan geen inhouding is verbonden vinden uiterlijk plaats in december van het
      kalenderjaar waarop de aanvraag betrekking heeft.

      4 Indien het bevoegd gezag een aanvraag tot het genieten van het gespaarde verlof heeft toegekend worden de
      stortingen op de verlofspaarrekening uiterlijk een maand voorafgaand aan de periode waarin het verlof zal worden
      genoten, of zoveel eerder als de ambtenaar dat wenst, gestaakt.
    url: https://wetten.overheid.nl/BWBR0015806/2006-01-01#Artikel6
  - number: '7'
    text: |-
      1 Over het verlofspaarloon wordt alleen beschikt:

      a. ten behoeve van het uitbetalen van een inkomen tijdens de verlofperiode aan de ambtenaar; of

      b. op verzoek van de ambtenaar ten behoeve van omzetting van het verlofspaarloon in een aanspraak ingevolge artikel
      16.6 van het pensioenreglement van de Stichting pensioenfonds ABP.

      2 In geval van overlijden van de ambtenaar wordt het verlofspaarloon zo spoedig mogelijk na het overlijden
      uitgekeerd aan de erfgenamen van de ambtenaar.

      3 In geval van ontslag van de ambtenaar wordt het verlofspaarloon uiterlijk een maand na de datum van het ontslag
      uitgekeerd aan de ambtenaar tenzij:

      a. het ontslag van de ambtenaar binnen een maand wordt gevolgd door een nieuwe aanstelling op grond van het
      [Barp][ref1]; of

      b. de ambtenaar te kennen geeft het verlofspaarloon te willen inbrengen in een regeling voor verlofsparen bij de
      nieuwe werkgever.

      4 Het verlofspaarloon wordt op geen enkele wijze afgekocht, vervreemd, prijsgegeven dan wel formeel of feitelijk
      als voorwerp van zekerheid aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0006516
    url: https://wetten.overheid.nl/BWBR0015806/2006-01-01#Artikel7
    references:
