preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Spoorwegwet en de Wet personenvervoer 2000 aan
    te passen in verband met de uitvoering van het kabinetsstandpunt «Spoor in beweging», onder andere teneinde het
    vergunningenregime ter bescherming van de hoofdspoorweg te vereenvoudigingen, regels te stellen over bijzonder
    spoor en over het verblijfsverbod, alsmede teneinde diverse technische wijzigingen aan te brengen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0036166/2016-10-01#ArtikelAanhef
articles:
  - number: VI.1
    text: |-
      De op het tijdstip van inwerkingtreding van deze wet aanhangige bezwaar- en beroepschriften tegen besluiten op
      grond van [artikelen 19 tot en met 21 van de Spoorwegwet][ref1] zoals die luidden tot de inwerkingtreding van
      [artikel I, onderdelen K tot en met N][ref2], van deze wet worden afgehandeld overeenkomstig het recht zoals dat
      gold voor het tijdstip van inwerkingtreding van deze wet.


