$id: bankwet_1998
regulatory_layer: WET
publication_date: '2024-08-30'
valid_from: '2021-07-01'
bwb_id: BWBR0009508
url: https://wetten.overheid.nl/BWBR0009508/2021-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is de doelstellingen, taken en werkzaamheden van De
    Nederlandsche Bank N.V. opnieuw te regelen in verband met het Verdrag tot oprichting van de Europese Gemeenschap en
    de in dat Verdrag voorziene oprichting van een Europees Stelsel van Centrale Banken waarvan De Nederlandsche Bank
    N.V. met betrekking tot de taken en plichten die bij het Verdrag aan dat Stelsel zijn opgedragen een integrerend
    onderdeel vormt;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel1
  - number: 1.1.a
    text: 'de Bank: De Nederlandsche Bank N.V.;'
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel1
  - number: 1.1.b
    text: 'Onze Minister: Onze Minister van Financiën;'
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel1
  - number: 1.1.c
    text: 'het Verdrag: het Verdrag betreffende de werking van de Europese Unie;'
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel1
  - number: 1.1.d
    text: |-
      de Europese Centrale Bank: de Europese Centrale Bank, bedoeld in artikel 13 van het Verdrag betreffende de Europese
      Unie;
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel1
  - number: 1.1.e
    text: |-
      het Europees Stelsel van Centrale Banken: het Europees Stelsel van Centrale Banken, bedoeld in artikel 282, eerste
      lid, van het Verdrag;
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel1
  - number: 1.1.f
    text: |-
      de statuten van het Europees Stelsel van Centrale Banken: de statuten van het Europees Stelsel van Centrale Banken
      en van de Europese Centrale Bank, bedoeld in artikel 129, tweede lid, van het Verdrag;
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel1
  - number: 1.1.g
    text: |-
      verordening valsemunterij: verordening (EG) nr. 1338/2001 van de Raad van de Europese Unie van 28 juni 2001 tot
      vaststelling van maatregelen die noodzakelijk zijn voor de bescherming van de euro tegen valsemunterij (PbEG 2001,
      L 181);
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel1
  - number: 1.1.h
    text: |-
      verordening gemeenschappelijk afwikkelingsmechanisme: verordening (EU) nr. 806/2014 van het Europees parlement
      en de Raad van 15 juli 2014 tot vaststelling van eenvormige regels en een eenvormige procedure voor de
      afwikkeling van kredietinstellingen en bepaalde beleggingsondernemingen in het kader van een gemeenschappelijk
      afwikkelingsmechanisme en een gemeenschappelijk bankenafwikkelingsfonds en tot wijziging van Verordening (EU)
      nr. 1093/2010 van het Europees parlement en de Raad (PbEU 2014, L 225).
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel1
  - number: '1.2'
    text: |-
      De Bank vormt een integrerend onderdeel van het Europees Stelsel van Centrale Banken met betrekking tot de taken en
      plichten die het Verdrag aan dat Stelsel opdraagt.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel1
  - number: '2.1'
    text: Ter uitvoering van het Verdrag heeft de Bank als doelstelling het handhaven van prijsstabiliteit.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel2
  - number: '2.2'
    text: |-
      Ter uitvoering van het Verdrag ondersteunt de Bank, onverminderd het doel van prijsstabiliteit, het algemene
      economische beleid in de Europese Unie teneinde bij te dragen tot de verwezenlijking van de in artikel 3 van het
      Verdrag betreffende de Europese Unie omschreven doelstellingen van de Unie.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel2
  - number: '2.3'
    text: |-
      De Bank handelt in overeenstemming met het beginsel van een open markteconomie met vrije mededinging, waarbij een
      doelmatige allocatie van middelen wordt bevorderd, en met inachtneming van de beginselen die zijn neergelegd in
      artikel 119 van het Verdrag.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel2
  - number: '2.4'
    text: |-
      De Bank heeft voorts als doelstelling het uitvoeren van taken, anders dan die bedoeld in [artikel 3][ref1],
      voorzover deze haar bij of krachtens de wet zijn opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0009508#Artikel3
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009508
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '3.1'
    text: |-
      Ter uitvoering van het Verdrag draagt de Bank in het kader van het Europees Stelsel van Centrale Banken bij aan de
      vervulling van de volgende taken
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel3
  - number: 3.1.a
    text: het bepalen van het monetaire beleid en het ten uitvoer leggen van dat beleid;
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel3
  - number: 3.1.b
    text: het verrichten van valutamarktoperaties in overeenstemming met artikel 219 van het Verdrag;
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel3
  - number: 3.1.c
    text: het aanhouden en beheren van de officiële externe reserves;
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel3
  - number: 3.1.d
    text: het verzorgen van de geldsomloop voorzover deze uit bankbiljetten bestaat;
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel3
  - number: 3.1.e
    text: het bevorderen van de goede werking van het betalingsverkeer.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel3
  - number: '3.2'
    text: |-
      Ter uitvoering van het Verdrag draagt de Bank in het kader van het Europees Stelsel van Centrale Banken bij tot een
      goede beleidsvoering van de bevoegde autoriteiten ten aanzien van het bedrijfseconomisch toezicht op banken en de
      stabiliteit van het financiële stelsel.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel3
  - number: '3.3'
    text: |-
      Ter uitvoering van het Verdrag is het de Bank toegestaan bij de uitoefening van haar taken en plichten ingevolge
      het eerste en tweede lid instructies te vragen aan en te aanvaarden van uitsluitend de Europese Centrale Bank.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel3
  - number: '4.1'
    text: 'De Bank heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel4
  - number: 4.1.a
    text: het uitoefenen van toezicht op financiële instellingen op de voet van de daarvoor geldende wettelijke regelingen;
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel4
  - number: 4.1.b
    text: het bevorderen van de goede werking van het betalingsverkeer;
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel4
  - number: 4.1.c
    text: het bevorderen van de stabiliteit van het financiële stelsel;
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel4
  - number: 4.1.d
    text: |-
      het verzamelen van statistische gegevens en het vervaardigen van statistieken op de voet van de daarvoor geldende
      wettelijke regelingen;
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel4
  - number: 4.1.e
    text: |-
      het uitoefenen van afwikkelingstaken met betrekking tot bepaalde financiële ondernemingen op voet van de daarvoor
      geldende wettelijke regelingen.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel4
  - number: '4.2'
    text: |-
      De Bank kan de in het eerste lid genoemde taken mede uitvoeren in de openbare lichamen Bonaire, Sint Eustatius en
      Saba, op de voet van de daarvoor geldende wettelijke regelingen.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel4
  - number: '4.3'
    text: |-
      De Bank kan, na toestemming bij koninklijk besluit, in het algemeen belang zowel in het Europese deel van Nederland
      als in de openbare lichamen Bonaire, Sint Eustatius en Saba andere taken uitvoeren dan de in deze wet genoemde.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel4
  - number: 4a
    text: |-
      De Bank neemt bij de uitoefening van haar taak, bedoeld in [artikel 4, eerste lid, onderdeel e][ref1],
      tot uitgangspunt dat een beroep op de publieke middelen wordt vermeden. Indien met het oog op de
      afwikkelingsdoelstellingen, bedoeld in artikel 14 van de verordening gemeenschappelijk afwikkelingsmechanisme,
      een beroep op buitengewone openbare financiële steun onvermijdelijk is, wordt dat beroep beperkt tot hetgeen
      noodzakelijk is ter verwezenlijking van die doelstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009508#Artikel4
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0009508
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: '5'
    text: |-
      De Bank is bevoegd die werkzaamheden te verrichten die nodig zijn ter uitvoering van de in [artikel 3][ref1] en
      [artikel 4][ref2] genoemde taken, waaronder met name de werkzaamheden die in deze paragraaf zijn genoemd. De Bank
      verricht deze werkzaamheden in overeenstemming met het Verdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0009508#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009508#Artikel4
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009508
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009508
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: '6'
    text: De Bank is bevoegd tot het uitgeven van bankbiljetten.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel6
  - number: '7'
    text: |-
      De Bank is bevoegd de Europese Centrale Bank bij te staan bij het verzamelen van gegevens op de voet van artikel 5
      van de Statuten van het Europees Stelsel van Centrale Banken.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel7
  - number: '8.1'
    text: |-
      De Bank is bevoegd tot het verrichten van transacties in de financiële markten, daaronder het ontvangen van gelden
      in rekening-courant van rekeninghouders, het in bewaring nemen van effecten en andere voorwerpen van waarde en het
      verrichten van krediettransacties voorzover deze gedekt zijn door toereikend onderpand.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel8
  - number: '8.2'
    text: |-
      Rechtshandelingen in verband met transacties, als bedoeld in het eerste lid, zijn niet vernietigbaar
      op grond van [artikel 45 van Boek 3 van het Burgerlijk Wetboek][ref1] of de [artikelen 42][ref2] en
      [47 van de Faillissementswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0001860#Artikel47
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '45'
      - id: ref2
        bwb_id: BWBR0001860
        artikel: '42'
      - id: ref3
        bwb_id: BWBR0001860
        artikel: '47'
  - number: '8.3'
    text: |-
      Op verzoek van Onze Minister verricht de Bank de in het eerste lid bedoelde werkzaamheden ten behoeve van de Staat
      en ten behoeve van instellingen die bij wet of bij koninklijk besluit in het leven zijn geroepen.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel8
  - number: '8.4'
    text: |-
      Op verzoek van Onze Minister en in afwijking van het eerste lid verstrekt de Bank aan de Staat, telkens wanneer
      Onze Minister dit nodig acht voor de ordelijke afwikkeling van betalingen ten laste van de Staat, kredieten in
      rekening-courant, zonder onderpand en tegen een, tussen Onze Minister en de Bank overeen te komen rentevergoeding.
      De Staat is verplicht deze kredieten af te lossen op de dag waarop zij zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel8
  - number: '9'
    text: 'De Bank kan na toestemming bij koninklijk besluit:'
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel9
  - number: 9.a
    text: |-
      deelnemingen houden in het kapitaal van rechtspersonen, van instellingen en van organisaties waarin haar deelname
      in het kapitaal bij of krachtens het Verdrag of bij wet niet reeds is geregeld;
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel9
  - number: 9.b
    text: |-
      deelnemen aan de werkzaamheden van rechtspersonen, van instellingen en van organisaties waarin haar deelname in de
      werkzaamheden bij of krachtens het Verdrag of bij wet niet reeds is geregeld;
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel9
  - number: 9.c
    text: in het algemeen belang andere werkzaamheden verrichten dan bedoeld in deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel9
  - number: 9a.1
    text: |-
      Kredietinstellingen, betalingsdienstverleners en economische operatoren als bedoeld in artikel 6, eerste lid,
      van de verordening valsemunterij controleren alle ontvangen eurobankbiljetten op hun geschiktheid voor circulatie
      alvorens deze biljetten weer in omloop te brengen.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel9a
  - number: 9a.2
    text: |-
      De geschiktheidscontrole van eurobankbiljetten wordt uitgevoerd volgens de daartoe door de Europese Centrale Bank
      vastgestelde procedures.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel9a
  - number: 9a.3
    text: |-
      Eurobankbiljetten die ongeschikt zijn voor circulatie, worden door de in het eerste lid bedoelde instellingen
      ingeleverd bij de Bank.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel9a
  - number: 9a.4
    text: De Bank vergoedt de nominale waarde van de op grond van het derde lid ingeleverde eurobankbiljetten.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel9a
  - number: 9b.1
    text: |-
      Met het toezicht op de naleving van [artikel 9a, eerste tot en met derde lid][ref1], en, voor zover dat artikel
      betrekking heeft op eurobankbiljetten, artikel 6, eerste lid, van de verordening valsemunterij zijn belast de bij
      besluit van de Bank aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0009508#Artikel9a
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0009508
        artikel: 9a
        hoofdstuk: IIa
  - number: 9b.2
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel9b
  - number: 9c.1
    text: 'De Bank is bevoegd tot oplegging van een last onder dwangsom ter handhaving van:'
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel9c
  - number: 9c.1.a
    text: |-
      [artikel 9a, eerste tot en met derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009508#Artikel9a
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0009508
        artikel: 9a
        hoofdstuk: IIa
  - number: 9c.1.b
    text: |-
      artikel 6, eerste lid, van de verordening valsemunterij, voor zover dat artikel betrekking heeft op
      eurobankbiljetten.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel9c
  - number: 9c.2
    text: |-
      De Bank is tevens bevoegd tot oplegging van een bestuurlijke boete ter zake van overtreding van de in het eerste
      lid genoemde artikelen en [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 9c.3
    text: |-
      Bij algemene maatregel van bestuur wordt bij de daarin omschreven overtredingen het bedrag van de op te leggen
      bestuurlijke boete bepaald, met diende verstande dat de bestuurlijke boete voor een afzonderlijke overtreding ten
      hoogste € 50.000 bedraagt. Indien tijdens het plegen van de overtreding nog geen vijf jaren zijn verlopen sedert
      het opleggen van een bestuurlijke boete aan de overtreder ter zake van eenzelfde overtreding, wordt het bedrag van
      de bestuurlijke boete, bedoeld in de eerste volzin, voor een afzonderlijke overtreding verdubbeld.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel9c
  - number: 9c.4
    text: |-
      Indien tegen een besluit tot oplegging van een bestuurlijke boete bezwaar of beroep wordt aangetekend, schorst dit
      de verplichting tot betaling van de boete totdat de beroepstermijn is verstreken of, indien beroep is ingesteld, op
      het beroep is beslist. De schorsing van de verplichting tot betaling schorst niet de berekening van de wettelijke
      rente.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel9c
  - number: 9d.1
    text: |-
      De Bank is bevoegd ten behoeve van de in [artikel 4, eerste lid, onderdelen c en d][ref1], bedoelde taken of ter
      voldoening aan informatieverzoeken van bij algemene maatregel van bestuur aangewezen internationale organisaties
      gebruik te maken van gegevens, niet zijnde persoonsgegevens als bedoeld in artikel 4 van de Algemene verordening
      gegevensbescherming, uit registraties die:


      [ref1]: https://wetten.overheid.nl/BWBR0009508#Artikel4
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel9d
    references:
      - id: ref1
        bwb_id: BWBR0009508
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: 9d.1.a
    text: |-
      in verband met de uitvoering van een wettelijke taak worden bijgehouden bij instellingen en diensten van het Rijk
      of bij zelfstandige bestuursorganen op het niveau van de centrale overheid;
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel9d
  - number: 9d.1.b
    text: |-
      worden bijgehouden door bij algemene maatregel van bestuur aangewezen rechtspersonen die een bij of krachtens de
      wet geregelde taak uitoefenen of geheel of gedeeltelijk, direct of indirect, worden bekostigd uit middelen van de
      Staat of uit de opbrengst van bij of krachtens de wet ingestelde heffingen.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel9d
  - number: 9d.2
    text: |-
      Voor zover de in het eerste lid bedoelde verwerving niet de benodigde gegevens oplevert, is de Bank bevoegd om
      bij algemene maatregel van bestuur te bepalen gegevens, niet zijnde persoonsgegevens als bedoeld in artikel 4
      van de Algemene verordening gegevensbescherming, op te vragen bij in die maatregel aangewezen categorieën van
      ondernemingen, vrije beroepsbeoefenaren, instellingen en rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel9d
  - number: 9d.3
    text: |-
      De in het eerste lid, onderdeel a, bedoelde instellingen, diensten en zelfstandige bestuursorganen, de
      in onderdeel b van dat lid bedoelde rechtspersonen en de in het tweede lid bedoelde ondernemingen, vrije
      beroepsbeoefenaren, instellingen en rechtspersonen verstrekken de in die leden bedoelde gegevens op verzoek van
      de Bank binnen een bij algemene maatregel van bestuur te bepalen termijn. Daarbij kan geen beroep worden gedaan op
      geheimhoudingsverplichtingen, tenzij deze verplichtingen gebaseerd zijn op internationale regelgeving.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel9d
  - number: 9d.4
    text: |-
      De in het derde lid bedoelde verstrekking van gegevens geschiedt kosteloos, tenzij bij algemene maatregel van
      bestuur anders wordt bepaald. Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met
      betrekking tot de soort kosten en de hoogte van de kosten die bij de Bank in rekening mogen worden gebracht.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel9d
  - number: 9e.1
    text: |-
      De door de Bank op grond van [artikel 9d][ref1] ontvangen gegevens worden, behoudens het tweede lid, uitsluitend
      gebruikt voor statistische doeleinden en economische analyses.


      [ref1]: https://wetten.overheid.nl/BWBR0009508#Artikel9d
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel9e
    references:
      - id: ref1
        bwb_id: BWBR0009508
        artikel: 9d
        hoofdstuk: IIb
  - number: 9e.2
    text: |-
      Het organisatieonderdeel van de Bank dat is belast met de in [artikel 4, eerste lid, onderdeel c of d][ref1],
      bedoelde taak kan de in het eerste lid bedoelde gegevens verstrekken aan organisatieonderdelen van de Bank die
      belast zijn met een andere taak, voor zover die gegevens, al dan niet rechtstreeks, afkomstig zijn van financiële
      instellingen waarop de Bank toezicht uitoefent op de voet van de daarvoor geldende wettelijke regelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009508#Artikel4
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel9e
    references:
      - id: ref1
        bwb_id: BWBR0009508
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: 9e.3
    text: |-
      De in het eerste lid bedoelde gegevens worden slechts zodanig openbaar gemaakt dat daaraan geen herkenbare gegevens
      over een afzonderlijke onderneming, vrije beroepsbeoefenaar, instelling of rechtspersoon kunnen worden ontleend.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel9e
  - number: 9f
    text: |-
      In afwijking van [artikel 9e][ref1] verstrekt de Bank gegevens aan de in [artikel 9d, eerste lid][ref2],
      bedoelde internationale organisaties ter voldoening aan hun informatieverzoeken, met inachtneming van het
      geheimhoudingsregime dat ingevolge bindende EU-rechtshandelingen op de desbetreffende gegevens van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0009508#Artikel9e
      [ref2]: https://wetten.overheid.nl/BWBR0009508#Artikel9d
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel9f
    references:
      - id: ref1
        bwb_id: BWBR0009508
        artikel: 9e
        hoofdstuk: IIb
      - id: ref2
        bwb_id: BWBR0009508
        artikel: 9d
        hoofdstuk: IIb
  - number: 9g.1
    text: |-
      De Bank is bevoegd tot oplegging van een last onder dwangsom ter handhaving van [artikel 9d, derde lid][ref1],
      indien de in het eerste lid, onderdeel b, van dat artikel bedoelde rechtspersonen en de in het tweede lid van dat
      artikel bedoelde ondernemingen, vrije beroepsbeoefenaren, instellingen en rechtspersonen de in die artikelleden
      bedoelde gegevens niet, niet tijdig of niet volledig verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0009508#Artikel9d
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel9g
    references:
      - id: ref1
        bwb_id: BWBR0009508
        artikel: 9d
        hoofdstuk: IIb
  - number: 9g.2
    text: |-
      De Bank is tevens bevoegd tot oplegging van een bestuurlijke boete ter zake van overtreding van
      [artikel 9d, derde lid][ref1]. [Artikel 9c, derde en vierde lid][ref2], is van overeenkomstige toepassing, met dien
      verstande dat de bestuurlijke boete voor een afzonderlijke overtreding ten hoogste € 10.000 bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0009508#Artikel9d
      [ref2]: https://wetten.overheid.nl/BWBR0009508#Artikel9c
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel9g
    references:
      - id: ref1
        bwb_id: BWBR0009508
        artikel: 9d
        hoofdstuk: IIb
      - id: ref2
        bwb_id: BWBR0009508
        artikel: 9c
        hoofdstuk: IIa
  - number: '10'
    text: |-
      [Artikel 153 van boek 2 van het Burgerlijk Wetboek][ref1] is niet van toepassing op de Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel153
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '153'
  - number: '11'
    text: |-
      Bepalingen van [boek 2 van het Burgerlijk Wetboek][ref1] die bij toepassing op de Bank strijdigheid opleveren met
      het Verdrag of de Statuten van het Europees Stelsel van Centrale Banken zijn niet van toepassing op de Bank. Met
      het oog op de uitvoering van artikel 131 van het Verdrag worden deze bepalingen bij algemene maatregel van bestuur
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: '12.1'
    text: |-
      De directie van de Bank is belast met het besturen van de Bank. De directie bestaat uit een president en tenminste
      drie en ten hoogste vijf directeuren.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel12
  - number: '12.2'
    text: |-
      De president en de directeuren worden voor een periode van zeven jaren bij koninklijk besluit benoemd. Herbenoeming
      in dezelfde functie kan eenmaal plaatsvinden. Voor elke benoeming wordt door de raad van commissarissen, de
      directie gehoord, een aanbevelingslijst van drie personen opgemaakt.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel12
  - number: '12.3'
    text: |-
      Voorafgaand aan het opmaken van de aanbevelingslijst stelt de raad van commissarissen, de directie gehoord, een
      functieprofiel op.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel12
  - number: '12.4'
    text: |-
      De president en de directeuren kunnen slechts indien zij niet meer voldoen aan de eisen voor de uitoefening van
      hun functie of indien zij op ernstige wijze zijn tekortgeschoten bij koninklijk besluit worden geschorst of uit hun
      functie worden ontheven. Ontheffing uit de functie vindt voorts plaats op eigen verzoek.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel12
  - number: '12.5'
    text: |-
      Onze Minister draagt zorg voor de mededeling in de Staatscourant van de in dit artikel bedoelde koninklijke
      besluiten.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel12
  - number: '12.6'
    text: |-
      Met betrekking tot de taken en werkzaamheden ter verwezenlijking van de doelstelling, bedoeld in
      [artikel 2, eerste lid][ref1], neemt de directie de hoedanigheid van de president als lid van de Raad van bestuur
      alsmede van de Algemene Raad van de Europese Centrale Bank in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0009508#Artikel2
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009508
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '12.7'
    text: |-
      De salarissen en de toezeggingen omtrent het pensioen alsmede regelingen omtrent vergoeding van onkosten van de
      president en de directeuren worden vastgesteld door de raad van commissarissen en goedgekeurd door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel12
  - number: 12a.1
    text: |-
      Bij of krachtens de statuten kan worden bepaald dat taken van de directie die voortvloeien uit
      [artikel 4, eerste lid, onderdeel a][ref1], worden toebedeeld aan één of meer directeuren en dat zij hieromtrent
      rechtsgeldig namens de Bank kunnen besluiten. Bepaling krachtens de statuten als bedoeld in de eerste volzin
      geschiedt schriftelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0009508#Artikel4
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0009508
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: 12a.2
    text: |-
      De directeur of directeuren aan wie de taken, bedoeld in het eerste lid, zijn toebedeeld, kunnen door de directie
      worden gemachtigd tot uitoefening van de bevoegdheden die nodig zijn voor het vervullen van deze taken, tenzij de
      regeling waarop de bevoegdheid steunt zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel12a
  - number: 12a.3
    text: |-
      Onverminderd het bepaalde in de [artikelen 4:81][ref1] en [10:6 van de Algemene wet bestuursrecht][ref2] omvat de
      machtiging, bedoeld in het tweede lid, tevens de bevoegdheid om beleid te bepalen ten aanzien van de taken, bedoeld
      in het tweede lid, tenzij dit in een mandaatbesluit is uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '10'
  - number: 12b.1
    text: |-
      Eén van de directeuren is belast met de uitvoering van de taak, bedoeld in
      [artikel 4, eerste lid, onderdeel e][ref1]. Deze directeur is niet tevens belast met de uitoefening van de taken,
      bedoeld in de [artikelen 3][ref2] en 4, eerste lid, onderdeel a, voor zover het betreft het toezicht op banken en
      verzekeraars, en onderdeel c.


      [ref1]: https://wetten.overheid.nl/BWBR0009508#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009508#Artikel3
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0009508
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009508
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: 12b.2
    text: |-
      Ter zake van besluitvorming in de directie waarbij de taak, bedoeld in [artikel 4, eerste lid, onderdeel e][ref1],
      wordt uitgeoefend, worden aan de directeur, bedoeld in het eerste lid, evenveel stemmen toegekend als aan de
      overige leden van de directie tezamen. Bij staking van de stemmen, beslist de stem van de directeur, bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009508#Artikel4
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0009508
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: 12b.3
    text: |-
      Het tweede lid is niet van toepassing op besluitvorming waarbij toepassing wordt gegeven aan de
      [artikelen 3A:9 tot en met 3A:11][ref1] en [3A:81 tot en met 3A:83 van de Wet op het financieel toezicht][ref2] en
      aan de artikelen 8 tot en met 11 van de verordening gemeenschappelijk afwikkelingsmechanisme.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3a
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 3a
      - id: ref2
        bwb_id: BWBR0020368
        artikel: 3a
  - number: '13.1'
    text: De raad van commissarissen bestaat uit ten minste zeven en ten hoogste tien leden.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel13
  - number: '13.2'
    text: Eén lid van de raad van commissarissen wordt van overheidswege benoemd, telkens voor een periode van vier jaar.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel13
  - number: '13.3'
    text: |-
      De voorzitter alsmede de andere leden van de raad van commissarissen worden telkens voor een periode van vier jaar
      benoemd door de aandeelhouders uit een voordracht van drie personen voor elke te vervullen plaats, opgemaakt door
      de raad van commissarissen. Voorafgaand aan het opmaken van de voordracht stelt de raad van commissarissen een
      functieprofiel op.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel13
  - number: '13.4'
    text: |-
      Bij afwezigheid van de voorzitter wordt het voorzitterschap bekleed door een daartoe door de vergadering aangewezen
      ander lid.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel13
  - number: '13.5'
    text: |-
      De leden van de raad van commissarissen kunnen door de aandeelhouders worden geschorst of uit hun functie worden
      ontheven indien zij niet meer voldoen aan de eisen voor de uitoefening van hun functie of op ernstige wijze zijn
      tekortgeschoten. Ontheffing uit de functie vindt voorts plaats op eigen verzoek.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel13
  - number: '13.6'
    text: |-
      Met inachtneming van het bepaalde in het Verdrag en de statuten van het Europees Stelsel van Centrale Banken, houdt
      de raad van commissarissen toezicht op de algemene gang van zaken binnen de Bank en het beleid van de directie
      ter uitvoering van [artikel 4][ref1]. De raad van commissarissen staat de directie met raad terzijde en stelt de
      jaarrekening vast. De vastgestelde jaarrekening behoeft de goedkeuring van de aandeelhouders.


      [ref1]: https://wetten.overheid.nl/BWBR0009508#Artikel4
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009508
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: '14.1'
    text: |-
      Ten behoeve van Onze Minister kan degene die ingevolge artikel 13, tweede lid, tot lid van de raad van
      commissarissen is benoemd op verzoek van Onze Minister of uit eigen beweging en met inachtneming van artikel 130
      van het Verdrag bij de directie van de Bank gegevens en inlichtingen inwinnen over de wijze waarop de Bank haar
      taken uitvoert. Hij kan op verzoek van Onze Minister of uit eigen beweging en met inachtneming van artikel 130 van
      het Verdrag zijn bevindingen aan Onze Minister kenbaar maken.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel14
  - number: '14.2'
    text: |-
      De directie van de Bank is gehouden de in het eerste lid bedoelde persoon telkens op diens aanvraag al die gegevens
      en inlichtingen te verstrekken, welke hij tot behoorlijke uitoefening van zijn taak als bedoeld in het eerste lid,
      nodig acht, met uitzondering van gegevens en inlichtingen die ingevolge het Verdrag of de in [artikel 4][ref1]
      bedoelde wettelijke regelingen geheim zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009508#Artikel4
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009508
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: '15.1'
    text: 'Er is een bankraad, bestaande uit tenminste elf en ten hoogste dertien leden, te weten:'
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel15
  - number: 15.1.a
    text: |-
      het in het [tweede lid van artikel 13][ref1] bedoelde lid van de raad van commissarissen;


      [ref1]: https://wetten.overheid.nl/BWBR0009508#Artikel13
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009508
        artikel: '13'
        hoofdstuk: III
  - number: 15.1.b
    text: één door de raad van commissarissen uit hun midden aan te wijzen lid;
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel15
  - number: 15.1.c
    text: ten minste negen en ten hoogste elf leden die steeds voor vier jaar worden benoemd door de bankraad.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel15
  - number: '15.2'
    text: |-
      De benoeming van leden, bedoeld in het eerste lid onder c, geschiedt uit een aanbevelingslijst van tenminste twee
      personen voor elke te vervullen plaats, op te maken door de directie van de Bank, waarbij wordt gestreefd naar
      representatie van de verschillende maatschappelijke geledingen.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel15
  - number: '15.3'
    text: |-
      De bankraad benoemt uit zijn midden een voorzitter. Bij afwezigheid van de voorzitter wordt het voorzitterschap
      bekleed door een daartoe door de vergadering aangewezen lid. Het secretariaat wordt vervuld door de Bank.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel15
  - number: '15.4'
    text: |-
      De directie van de Bank en de thesaurier-generaal of zijn plaatsvervanger wonen de vergaderingen van de bankraad
      bij en kunnen deelnemen aan de beraadslagingen.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel15
  - number: '15.5'
    text: |-
      De president van de Bank brengt aan de bankraad verslag uit over de algemene economische en financiële ontwikkeling
      en bespreekt met de bankraad de door de Bank gevoerde politiek. Daarnaast wordt beraadslaagd over de onderwerpen,
      welke door één of meer leden ter tafel worden gebracht in verband met de doelstellingen, taken en werkzaamheden van
      de Bank.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel15
  - number: '16.1'
    text: |-
      De Bank stelt, met inachtneming van het Verdrag en na overleg met Onze Minister, interne richtlijnen vast voor
      het beheer van effecten, geldswaardige papieren en de goud- en deviezenvoorraad die niet is overgedragen aan de
      Europese Centrale Bank overeenkomstig artikel 30 van de Statuten van het Europees Stelsel van Centrale Banken,
      daarbij op gepaste wijze rekening houdend met de belangen van de Staat.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel16
  - number: '16.2'
    text: |-
      De Bank is bevoegd, met toestemming van Onze Minister, reserves na winstvaststelling te vormen. Stortingen in en
      onttrekkingen aan deze reserves behoeven de toestemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel16
  - number: '17.1'
    text: |-
      De [artikelen 2:363, zesde lid](onbekend), [2:380](onbekend), [2:383, tweede lid, tweede zin]
      (onbekend), met uitzondering van de openstaande bedragen, alsmede de [afdelingen 3][ref1] en
      [4 van titel 9 van Boek 2 van het Burgerlijk Wetboek][ref2] zijn niet van toepassing op de Bank. De Bank
      mag, mede ter bepaling van het resultaat, de waardering van de beleggingen, effecten en valuta doen berusten
      op grondslagen die afwijken van het bepaalde in [artikel 2:384, eerste lid, tweede zin, of tweede lid,
      tweede zin, van het Burgerlijk Wetboek](onbekend), voorzover dit in overeenstemming is met hetgeen in
      [afdeling 14 van titel 9 van Boek 2 van het Burgerlijk Wetboek][ref3] daaromtrent is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Afdeling3
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Afdeling4
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Afdeling14
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003045
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003045
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0003045
        afdeling: '14'
  - number: '17.2'
    text: |-
      Van de bepalingen van [titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1] wijkt de Bank bovendien af, voorzover
      die afwijking naar het oordeel van de raad van commissarissen noodzakelijk is voor de verwezenlijking van de in
      [artikel 2][ref2] bedoelde doelstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0009508#Artikel2
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0009508
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '17.3'
    text: |-
      Van de bepalingen van [titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1] wijkt de Bank bovendien af
      voor zover die afwijking noodzakelijk is om uitvoering te kunnen geven aan instructies, als bedoeld in
      [artikel 3, derde lid][ref2]. De Bank stelt de raad van commissarissen onverwijld van de afwijking in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0009508#Artikel3
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0009508
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '18.1'
    text: |-
      Onze Minister is, met inachtneming van artikel 130 van het Verdrag, bevoegd de Bank met betrekking tot de taken
      en werkzaamheden ter verwezenlijking van de in [artikel 2, eerste lid][ref1], bedoelde doelstelling, gegevens of
      inlichtingen te vragen die naar zijn oordeel nodig zijn ter bepaling van het financieel-economisch beleid van de
      regering.


      [ref1]: https://wetten.overheid.nl/BWBR0009508#Artikel2
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009508
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '18.2'
    text: |-
      De Bank is, met inachtneming van artikel 10.4 en artikel 37 van de Statuten van het Europees Stelsel van Centrale
      Banken, verplicht aan Onze Minister de in het eerste lid bedoelde gegevens en inlichtingen te verstrekken.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel18
  - number: '19'
    text: |-
      Met betrekking tot de taken en werkzaamheden ter verwezenlijking van de doelstelling, bedoeld in
      [artikel 2, eerste lid][ref1], kan de president van de Bank, met inachtneming van artikel 130 van het Verdrag en
      van artikel 10.4 en artikel 37 van de Statuten van het Europees Stelsel van Centrale Banken, door elk der beide
      kamers der Staten-Generaal op hun verzoek worden gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0009508#Artikel2
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009508
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '20'
    text: |-
      Voor zover deze wet strekt ter uitvoering van de handelingen ter verwezenlijking van de in
      [artikel 2, eerste lid][ref1], bedoelde doelstelling, is het aan een ieder die uit hoofde van de toepassing van
      deze wet of van krachtens deze wet genomen besluiten enige taak vervult, verboden van gegevens of inlichtingen die
      hij bij die taakuitvoering heeft verkregen verder of anders gebruik te maken of daaraan verder of anders bekendheid
      te geven dan voor de uitoefening van zijn taak of door deze wet wordt geëist.


      [ref1]: https://wetten.overheid.nl/BWBR0009508#Artikel2
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0009508
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '27.2'
    text: |-
      De [artikelen 229i-k van het Wetboek van Koophandel][ref1]zijn niet van toepassing op bankbiljetten.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel229i
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: 229i
  - number: '27.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de verwisseling,
      intrekking en aftekening van bankbiljetten door de Bank, en de door de Bank aan het publiek te verstrekken
      informatie hieromtrent.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel27
  - number: '27.4'
    text: Dit artikel of een onderdeel ervan vervalt op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel27
  - number: '28'
    text: |-
      Na inwerkingtreding van [artikel 12][ref1] van deze wet berusten de koninklijk besluiten die op grond van artikel
      23, leden 1 en 2, van de Bankwet 1948 van kracht zijn, op [artikel 12, lid 2][ref2], van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0009508#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0009508#Artikel12
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0009508
        artikel: '12'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0009508
        artikel: '12'
        hoofdstuk: III
  - number: '29.1'
    text: |-
      De benoeming voor de eerste maal van de leden van de raad van commissarissen, bedoeld in
      [artikel 13, derde lid][ref1], geschiedt door de aandeelhouders binnen 8 weken na inwerkingtreding van deze wet. Op
      dat tijdstip treden de commissarissen, benoemd overeenkomstig artikel 27 van de Bankwet 1948, af.


      [ref1]: https://wetten.overheid.nl/BWBR0009508#Artikel13
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0009508
        artikel: '13'
        hoofdstuk: III
  - number: '29.2'
    text: |-
      De voor de eerste maal benoemde leden van de raad van commissarissen, bedoeld in [artikel 13, derde lid][ref1],
      hebben, in afwijking van [artikel 13, derde lid][ref2], zitting voor de tijd van één tot vier jaren volgens een
      door de raad van commissarissen op te stellen rooster.


      [ref1]: https://wetten.overheid.nl/BWBR0009508#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0009508#Artikel13
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0009508
        artikel: '13'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0009508
        artikel: '13'
        hoofdstuk: III
  - number: '30.1'
    text: |-
      De benoeming voor de eerste maal van de leden van de bankraad, bedoeld in [artikel 15, eerste lid, onder c][ref1],
      geschiedt door de Bank binnen 8 weken na inwerkingtreding van deze wet. Op dat tijdstip treden de leden van de
      bankraad, benoemd overeenkomstig artikel 32 van de Bankwet 1948, af.


      [ref1]: https://wetten.overheid.nl/BWBR0009508#Artikel15
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0009508
        artikel: '15'
        hoofdstuk: III
  - number: '30.2'
    text: |-
      De overeenkomstig het eerste lid benoemde leden hebben zitting voor de tijd van één tot vier jaren, volgens een
      door de bankraad op te stellen rooster.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel30
  - number: '31'
    text: |-
      Na de inwerkingtreding van [artikel 9][ref1] van deze Wet berusten de koninklijke besluiten die op grond van
      artikel 21 van de Bankwet 1948 van kracht zijn, op [artikel 9][ref2] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0009508#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009508#Artikel9
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009508
        artikel: '9'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009508
        artikel: '9'
        hoofdstuk: II
        paragraaf: '2'
  - number: '32'
    text: De Bankwet 1948 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel32
  - number: '33'
    text: |-
      De wet van 11 januari 1956 houdende bepalingen ter uitvoering van artikel 17 van de Bankwet 1948, wordt
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel33
  - number: '34'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel34
  - number: '35'
    text: 'Deze wet wordt aangehaald als: Bankwet 1998.'
    url: https://wetten.overheid.nl/BWBR0009508/2021-07-01#Artikel35
