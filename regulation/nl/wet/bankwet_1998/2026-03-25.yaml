  - number: '13'
    text: |-
      1 De raad van commissarissen bestaat uit ten minste zeven en ten hoogste tien leden.

      2 Eén lid van de raad van commissarissen wordt van overheidswege benoemd voor een periode van vier jaar.
      Herbenoeming kan plaatsvinden overeenkomstig de statuten van de Bank.

      3 De voorzitter alsmede de andere leden van de raad van commissarissen worden voor een periode van vier jaar
      benoemd door de aandeelhouders uit een voordracht van in beginsel drie personen voor elke te vervullen plaats,
      opgemaakt door de raad van commissarissen. Voorafgaand aan het opmaken van de voordracht stelt de raad van
      commissarissen een functieprofiel op. Herbenoeming kan plaatsvinden overeenkomstig de statuten van de Bank.

      4 Bij afwezigheid van de voorzitter wordt het voorzitterschap bekleed door een daartoe door de vergadering
      aangewezen ander lid.

      5 De leden van de raad van commissarissen kunnen door degene die hen heeft benoemd worden geschorst of uit hun
      functie worden ontheven indien zij niet meer voldoen aan de eisen voor de uitoefening van hun functie of op
      ernstige wijze zijn tekortgeschoten. Ontheffing uit de functie vindt voorts plaats op eigen verzoek.

      6 Met inachtneming van het bepaalde in het Verdrag en de statuten van het Europees Stelsel van Centrale Banken,
      houdt de raad van commissarissen toezicht op de algemene gang van zaken binnen de Bank en het beleid van de
      directie ter uitvoering van [artikel 4][ref1]. De raad van commissarissen staat de directie met raad terzijde en
      stelt de jaarrekening vast. De vastgestelde jaarrekening behoeft de goedkeuring van de aandeelhouders.


      [ref1]: https://wetten.overheid.nl/BWBR0009508#Artikel4
    url: https://wetten.overheid.nl/BWBR0009508/2026-03-25#Artikel13
