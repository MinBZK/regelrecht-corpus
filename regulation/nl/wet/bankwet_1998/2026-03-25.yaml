  - number: '9'
    text: |-
      De Bank kan na toestemming bij koninklijk besluit:

      a. deelnemingen houden in het kapitaal van rechtspersonen, van instellingen en van organisaties waarin haar
      deelname in het kapitaal bij of krachtens het Verdrag of bij wet niet reeds is geregeld;

      b. deelnemen aan de werkzaamheden van rechtspersonen, van instellingen en van organisaties waarin haar deelname in
      de werkzaamheden bij of krachtens het Verdrag of bij wet niet reeds is geregeld;

      c. in het algemeen belang andere werkzaamheden verrichten dan bedoeld in deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0009508/2026-03-25#Artikel9
  - number: 9a
    text: |-
      1 Kredietinstellingen, betalingsdienstverleners en economische operatoren als bedoeld in artikel 6, eerste lid,
      van de verordening valsemunterij controleren alle ontvangen eurobankbiljetten op hun geschiktheid voor circulatie
      alvorens deze biljetten weer in omloop te brengen.

      2 De geschiktheidscontrole van eurobankbiljetten wordt uitgevoerd volgens de daartoe door de Europese Centrale Bank
      vastgestelde procedures.

      3 Eurobankbiljetten die ongeschikt zijn voor circulatie, worden door de in het eerste lid bedoelde instellingen
      ingeleverd bij de Bank.

      4 De Bank vergoedt de nominale waarde van de op grond van het derde lid ingeleverde eurobankbiljetten.
    url: https://wetten.overheid.nl/BWBR0009508/2026-03-25#Artikel9a
  - number: 9b
    text: |-
      1 Met het toezicht op de naleving van [artikel 9a, eerste tot en met derde lid][ref1], en, voor zover dat artikel
      betrekking heeft op eurobankbiljetten, artikel 6, eerste lid, van de verordening valsemunterij zijn belast de bij
      besluit van de Bank aangewezen personen.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0009508#Artikel9a
    url: https://wetten.overheid.nl/BWBR0009508/2026-03-25#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0009508
        artikel: 9a
        hoofdstuk: IIa
  - number: 9c
    text: |-
      1 De Bank is bevoegd tot oplegging van een last onder dwangsom ter handhaving van:

      a. [artikel 9a, eerste tot en met derde lid][ref1];

      b. artikel 6, eerste lid, van de verordening valsemunterij, voor zover dat artikel betrekking heeft op
      eurobankbiljetten.

      2 De Bank is tevens bevoegd tot oplegging van een bestuurlijke boete ter zake van overtreding van de in het eerste
      lid genoemde artikelen en [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref2].

      3 Bij algemene maatregel van bestuur wordt bij de daarin omschreven overtredingen het bedrag van de op te leggen
      bestuurlijke boete bepaald, met diende verstande dat de bestuurlijke boete voor een afzonderlijke overtreding ten
      hoogste € 50.000 bedraagt. Indien tijdens het plegen van de overtreding nog geen vijf jaren zijn verlopen sedert
      het opleggen van een bestuurlijke boete aan de overtreder ter zake van eenzelfde overtreding, wordt het bedrag van
      de bestuurlijke boete, bedoeld in de eerste volzin, voor een afzonderlijke overtreding verdubbeld.

      4 Indien tegen een besluit tot oplegging van een bestuurlijke boete bezwaar of beroep wordt aangetekend, schorst
      dit de verplichting tot betaling van de boete totdat de beroepstermijn is verstreken of, indien beroep is
      ingesteld, op het beroep is beslist. De schorsing van de verplichting tot betaling schorst niet de berekening van
      de wettelijke rente.


      [ref1]: https://wetten.overheid.nl/BWBR0009508#Artikel9a
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel520
    url: https://wetten.overheid.nl/BWBR0009508/2026-03-25#Artikel9c
