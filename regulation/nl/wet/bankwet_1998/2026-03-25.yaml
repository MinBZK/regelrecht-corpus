    text: |-
      Bepalingen van [boek 2 van het Burgerlijk Wetboek][ref1] die bij toepassing op de Bank strijdigheid opleveren met
      het Verdrag of de statuten van het Europees Stelsel van Centrale Banken zijn niet van toepassing op de Bank. Met
      het oog op de uitvoering van artikel 131 van het Verdrag worden deze bepalingen bij algemene maatregel van bestuur
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0009508/2026-03-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: '12'
    text: |-
      1 De directie van de Bank is belast met het besturen van de Bank. De directie bestaat uit een president en ten
      minste drie en ten hoogste vijf directeuren.

      2 De president en de directeuren worden voor een periode van zeven jaren bij koninklijk besluit benoemd.
      Herbenoeming in dezelfde functie kan eenmaal plaatsvinden. Voor elke benoeming wordt door de raad van
      commissarissen, de directie gehoord, een aanbevelingslijst van in beginsel drie personen opgemaakt.

      3 Voorafgaand aan het opmaken van de aanbevelingslijst stelt de raad van commissarissen, de directie gehoord, een
      functieprofiel op.

      4 De president en de directeuren kunnen slechts indien zij niet meer voldoen aan de eisen voor de uitoefening van
      hun functie of indien zij op ernstige wijze zijn tekortgeschoten bij koninklijk besluit worden geschorst of uit hun
      functie worden ontheven. Ontheffing uit de functie vindt voorts plaats op eigen verzoek.

      5 Onze Minister draagt zorg voor de mededeling in de Staatscourant van de in dit artikel bedoelde koninklijke
      besluiten.

      6 Met betrekking tot de taken en werkzaamheden ter verwezenlijking van de doelstelling, bedoeld in
      [artikel 2, eerste lid][ref1], neemt de directie de hoedanigheid van de president als lid van de Raad van bestuur
      alsmede van de Algemene Raad van de Europese Centrale Bank in acht.

      7 De salarissen en de toezeggingen omtrent het pensioen alsmede regelingen omtrent vergoeding van onkosten van de
      president en de directeuren worden vastgesteld door de raad van commissarissen en goedgekeurd door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0009508#Artikel2
    url: https://wetten.overheid.nl/BWBR0009508/2026-03-25#Artikel12
    references:
      - id: ref1
