  - number: '14'
    text: |-
      1 Ten behoeve van Onze Minister kan degene die ingevolge artikel 13, tweede lid, tot lid van de raad van
      commissarissen is benoemd op verzoek van Onze Minister of uit eigen beweging en met inachtneming van artikel 130
      van het Verdrag bij de directie van de Bank gegevens en inlichtingen inwinnen over de wijze waarop de Bank haar
      taken uitvoert. Hij kan op verzoek van Onze Minister of uit eigen beweging en met inachtneming van artikel 130 van
      het Verdrag zijn bevindingen aan Onze Minister kenbaar maken.

      2 De directie van de Bank is gehouden de in het eerste lid bedoelde persoon telkens op diens aanvraag al die
      gegevens en inlichtingen te verstrekken, welke hij tot behoorlijke uitoefening van zijn taak als bedoeld in
      het eerste lid, nodig acht, met uitzondering van gegevens en inlichtingen die ingevolge het Verdrag of de in
      [artikel 4][ref1] bedoelde wettelijke regelingen geheim zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009508#Artikel4
    url: https://wetten.overheid.nl/BWBR0009508/2026-03-25#Artikel14
