  - number: 12b
    text: |-
      1 Eén van de directeuren is belast met de uitvoering van de taak, bedoeld in
      [artikel 4, eerste lid, onderdeel e][ref1]. Deze directeur is niet tevens belast met de uitoefening van de taken,
      bedoeld in de [artikelen 3][ref2] en 4, eerste lid, onderdeel a, voor zover het betreft het toezicht op bepaalde
      financiële ondernemingen als bedoeld in artikel 4, eerste lid, onderdeel e, en onderdeel c.

      2 Ter zake van besluitvorming in de directie waarbij de taak, bedoeld in
      [artikel 4, eerste lid, onderdeel e][ref3], wordt uitgeoefend, worden aan de directeur, bedoeld in het eerste lid,
      evenveel stemmen toegekend als aan de overige leden van de directie tezamen. Bij staking van de stemmen, beslist de
      stem van de directeur, bedoeld in het eerste lid.

      3 Het tweede lid is niet van toepassing op besluitvorming waarbij toepassing wordt gegeven aan de
      [artikelen 3A:9 tot en met 3A:11a][ref4] en [3A:81 tot en met 3A:83 van de Wet op het financieel toezicht][ref5]
      en aan de artikelen 8 tot en met 11 van de verordening gemeenschappelijk afwikkelingsmechanisme en aan de
      artikelen 12, 15 en 16 van de verordening herstel en afwikkeling centrale tegenpartijen.


