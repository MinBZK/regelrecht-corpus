  - number: 9h
    text: |-
      1 De Bank voert, onder de naam Financieel Stabiliteitscomité, periodiek overleg met vertegenwoordigers van de
      Stichting Autoriteit Financiële Markten en Onze Minister over macro-economische en financiële ontwikkelingen met
      als doel om risico’s voor de stabiliteit van het financiële stelsel te signaleren en mogelijke oplossingsrichtingen
      ter mitigatie van die risico’s aan te dragen. De Bank kan, in overeenstemming met de Stichting Autoriteit
      Financiële Markten, dienaangaande aanbevelingen doen.

      2 De deelnemers komen ten minste tweemaal per jaar bijeen onder voorzitterschap van de president van de Bank.
      De Bank brengt van deze bijeenkomsten en van aanbevelingen verslag uit aan Onze Minister. Onze Minister zendt
      afschriften van deze verslagen aan de beide kamers der Staten-Generaal.

      3 Het Centraal Planbureau woont als externe deskundige de bijeenkomsten van het overleg bij.

      4 De deelnemers regelen de verdere werkwijze van het overleg.
    url: https://wetten.overheid.nl/BWBR0009508/2026-03-25#Artikel9h
