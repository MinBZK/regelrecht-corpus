        artikel: '13'
        hoofdstuk: III
  - number: '16'
    text: |-
      1 De Bank stelt, met inachtneming van het Verdrag en na overleg met Onze Minister, interne richtlijnen vast voor
      het beheer van effecten, geldswaardige papieren en de goud- en deviezenvoorraad die niet is overgedragen aan de
      Europese Centrale Bank overeenkomstig artikel 30 van de statuten van het Europees Stelsel van Centrale Banken,
      daarbij op gepaste wijze rekening houdend met de belangen van de Staat.

      2 De Bank is bevoegd, met toestemming van Onze Minister, reserves na winstvaststelling te vormen. Stortingen in en
      onttrekkingen aan deze reserves behoeven de toestemming van Onze Minister.
