  - number: '6'
    text: De Bank is bevoegd tot het uitgeven van bankbiljetten.
    url: https://wetten.overheid.nl/BWBR0009508/2026-03-25#Artikel6
  - number: '7'
    text: |-
      De Bank is bevoegd de Europese Centrale Bank bij te staan bij het verzamelen van gegevens op de voet van artikel 5
      van de statuten van het Europees Stelsel van Centrale Banken.
    url: https://wetten.overheid.nl/BWBR0009508/2026-03-25#Artikel7
  - number: '8'
    text: |-
      1 De Bank is bevoegd tot het verrichten van transacties in de financiële markten, daaronder het ontvangen van
      gelden in rekening-courant van rekeninghouders, het in bewaring nemen van effecten en andere voorwerpen van waarde
      en het verrichten van krediettransacties voorzover deze gedekt zijn door toereikend onderpand.

      2 Rechtshandelingen in verband met transacties, als bedoeld in het eerste lid, zijn niet vernietigbaar
      op grond van [artikel 45 van Boek 3 van het Burgerlijk Wetboek][ref1] of de [artikelen 42][ref2] en
      [47 van de Faillissementswet][ref3].

      3 Op verzoek van Onze Minister verricht de Bank de in het eerste lid bedoelde werkzaamheden ten behoeve van de
      Staat en ten behoeve van instellingen die bij wet of bij koninklijk besluit in het leven zijn geroepen.

      4 Op verzoek van Onze Minister en in afwijking van het eerste lid verstrekt de Bank aan de Staat, telkens wanneer
      Onze Minister dit nodig acht voor de ordelijke afwikkeling van betalingen ten laste van de Staat, kredieten in
      rekening-courant, zonder onderpand en tegen een, tussen Onze Minister en de Bank overeen te komen rentevergoeding.
      De Staat is verplicht deze kredieten af te lossen op de dag waarop zij zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0001860#Artikel47
    url: https://wetten.overheid.nl/BWBR0009508/2026-03-25#Artikel8
