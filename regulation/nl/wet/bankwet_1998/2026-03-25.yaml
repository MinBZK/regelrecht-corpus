  - number: '15'
    text: |-
      1 Er is een bankraad, bestaande uit ten minste elf en ten hoogste dertien leden, te weten:

      a. het in het [tweede lid van artikel 13][ref1] bedoelde lid van de raad van commissarissen;

      b. één door de raad van commissarissen uit hun midden aan te wijzen lid;

      c. ten minste negen en ten hoogste elf leden die steeds voor vier jaar worden benoemd door de bankraad.

      2 De benoeming van leden, bedoeld in het eerste lid onder c, geschiedt uit een aanbevelingslijst van in beginsel
      twee personen voor elke te vervullen plaats, op te maken door de directie van de Bank, waarbij wordt gestreefd naar
      representatie van de verschillende maatschappelijke geledingen.

      3 De bankraad benoemt uit zijn midden een voorzitter. Bij afwezigheid van de voorzitter wordt het voorzitterschap
      bekleed door een daartoe door de vergadering aangewezen lid. Het secretariaat wordt vervuld door de Bank.

      4 De directie van de Bank en de thesaurier-generaal of zijn plaatsvervanger wonen de vergaderingen van de bankraad
      bij en kunnen deelnemen aan de beraadslagingen.

      5 De president van de Bank brengt aan de bankraad verslag uit over de algemene economische en financiële
      ontwikkeling en bespreekt met de bankraad de door de Bank gevoerde politiek. Daarnaast wordt beraadslaagd over
      de onderwerpen, welke door één of meer leden ter tafel worden gebracht in verband met de doelstellingen, taken en
      werkzaamheden van de Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0009508#Artikel13
    url: https://wetten.overheid.nl/BWBR0009508/2026-03-25#Artikel15
