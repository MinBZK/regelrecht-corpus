  - number: 9d
    text: |-
      1 De Bank is bevoegd ten behoeve van de in [artikel 4, eerste lid, onderdelen c en d][ref1], bedoelde taken of ter
      voldoening aan informatieverzoeken van bij algemene maatregel van bestuur aangewezen internationale organisaties
      gebruik te maken van gegevens, niet zijnde persoonsgegevens als bedoeld in artikel 4 van de Algemene verordening
      gegevensbescherming, uit registraties die:

      a. in verband met de uitvoering van een wettelijke taak worden bijgehouden bij instellingen en diensten van het
      Rijk of bij zelfstandige bestuursorganen op het niveau van de centrale overheid;

      b. worden bijgehouden door bij algemene maatregel van bestuur aangewezen rechtspersonen die een bij of krachtens de
      wet geregelde taak uitoefenen of geheel of gedeeltelijk, direct of indirect, worden bekostigd uit middelen van de
      Staat of uit de opbrengst van bij of krachtens de wet ingestelde heffingen.

      2 Voor zover de in het eerste lid bedoelde verwerving niet de benodigde gegevens oplevert, is de Bank bevoegd
      om bij algemene maatregel van bestuur te bepalen gegevens, niet zijnde persoonsgegevens als bedoeld in artikel
      4 van de Algemene verordening gegevensbescherming, op te vragen bij in die maatregel aangewezen categorieën van
      ondernemingen, vrije beroepsbeoefenaren, instellingen en rechtspersonen.

      3 De in het eerste lid, onderdeel a, bedoelde instellingen, diensten en zelfstandige bestuursorganen, de
      in onderdeel b van dat lid bedoelde rechtspersonen en de in het tweede lid bedoelde ondernemingen, vrije
      beroepsbeoefenaren, instellingen en rechtspersonen verstrekken de in die leden bedoelde gegevens op verzoek van
      de Bank binnen een bij algemene maatregel van bestuur te bepalen termijn. Daarbij kan geen beroep worden gedaan op
      geheimhoudingsverplichtingen, tenzij deze verplichtingen gebaseerd zijn op internationale regelgeving.

      4 De in het derde lid bedoelde verstrekking van gegevens geschiedt kosteloos, tenzij bij algemene maatregel van
      bestuur anders wordt bepaald. Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met
      betrekking tot de soort kosten en de hoogte van de kosten die bij de Bank in rekening mogen worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0009508#Artikel4
