        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: 12a
    text: |-
      1 Bij of krachtens de statuten kan worden bepaald dat taken van de directie die voortvloeien uit
      [artikel 4, eerste lid, onderdeel a][ref1], worden toebedeeld aan één of meer directeuren en dat zij hieromtrent
      rechtsgeldig namens de Bank kunnen besluiten. Bepaling krachtens de statuten als bedoeld in de eerste volzin
      geschiedt schriftelijk.

      2 De directeur of directeuren aan wie de taken, bedoeld in het eerste lid, zijn toebedeeld, kunnen door de directie
      worden gemachtigd tot uitoefening van de bevoegdheden die nodig zijn voor het vervullen van deze taken, tenzij de
      regeling waarop de bevoegdheid steunt zich daartegen verzet.

      3 Onverminderd het bepaalde in de [artikelen 4:81][ref2] en [10:6 van de Algemene wet bestuursrecht][ref3] omvat de
      machtiging, bedoeld in het tweede lid, tevens de bevoegdheid om beleid te bepalen ten aanzien van de taken, bedoeld
      in het tweede lid, tenzij dit in een mandaatbesluit is uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0009508#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel481
