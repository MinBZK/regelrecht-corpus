      Voor zover deze wet strekt ter uitvoering van de handelingen ter verwezenlijking
      van de in de [artikelen 2, eerste, tweede en derde lid][ref1], [3][ref2],
      [4, eerste lid, onderdelen b en c, tweede en derde lid][ref3], en [9, onderdeel c][ref4], bedoelde doelstellingen
      en taken, is het aan een ieder die uit hoofde van de toepassing van deze wet of van krachtens deze wet genomen
      besluiten enige taak vervult, verboden van gegevens of inlichtingen die hij bij die taakuitvoering heeft verkregen
      verder of anders gebruik te maken of daaraan verder of anders bekendheid te geven dan voor de uitoefening van zijn
      taak of door deze wet wordt geëist.


