      1 De benoeming voor de eerste maal van de leden van de bankraad, bedoeld in
      [artikel 15, eerste lid, onder c][ref1], geschiedt door de Bank binnen 8 weken na inwerkingtreding van deze wet. Op
      dat tijdstip treden de leden van de bankraad, benoemd overeenkomstig artikel 32 van de Bankwet 1948, af.

      2 De overeenkomstig het eerste lid benoemde leden hebben zitting voor de tijd van één tot vier jaren, volgens een
      door de bankraad op te stellen rooster.


