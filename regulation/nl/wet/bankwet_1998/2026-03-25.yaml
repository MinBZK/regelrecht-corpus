preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is de doelstellingen, taken en werkzaamheden van De
    Nederlandsche Bank N.V. opnieuw te regelen in verband met het Verdrag tot oprichting van de Europese Gemeenschap en
    de in dat Verdrag voorziene oprichting van een Europees Stelsel van Centrale Banken waarvan De Nederlandsche Bank
    N.V. met betrekking tot de taken en plichten die bij het Verdrag aan dat Stelsel zijn opgedragen een integrerend
    onderdeel vormt;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009508/2026-03-25#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. de Bank: De Nederlandsche Bank N.V.;

      b. Onze Minister: Onze Minister van Financiën;

      c. het Verdrag: het Verdrag betreffende de werking van de Europese Unie;

      d. de Europese Centrale Bank: de Europese Centrale Bank, bedoeld in artikel 13 van het Verdrag betreffende de
      Europese Unie;

      e. het Europees Stelsel van Centrale Banken: het Europees Stelsel van Centrale Banken, bedoeld in artikel 282,
      eerste lid, van het Verdrag;

      f. de statuten van het Europees Stelsel van Centrale Banken: de statuten van het Europees Stelsel van Centrale
      Banken en van de Europese Centrale Bank, bedoeld in artikel 129, tweede lid, van het Verdrag;

      g. verordening valsemunterij: verordening (EG) nr. 1338/2001 van de Raad van de Europese Unie van 28 juni 2001 tot
      vaststelling van maatregelen die noodzakelijk zijn voor de bescherming van de euro tegen valsemunterij (PbEG 2001,
      L 181);

      h. verordening gemeenschappelijk afwikkelingsmechanisme: verordening (EU) nr. 806/2014 van het Europees
      parlement en de Raad van 15 juli 2014 tot vaststelling van eenvormige regels en een eenvormige procedure voor de
      afwikkeling van kredietinstellingen en bepaalde beleggingsondernemingen in het kader van een gemeenschappelijk
      afwikkelingsmechanisme en een gemeenschappelijk bankenafwikkelingsfonds en tot wijziging van Verordening (EU)
      nr. 1093/2010 van het Europees parlement en de Raad (PbEU 2014, L 225);

      i. verordening herstel en afwikkeling centrale tegenpartijen: [Verordening (EU) 2021/23](31923R2021) van het
      Europees Parlement en de Raad van 16 december 2020 betreffende een kader voor het herstel en de afwikkeling van
      centrale tegenpartijen en tot wijziging van de [Verordeningen (EU) nr. 1095/2010](32010R1095), [(EU) nr. 648/2012]
      (32012R0648), [(EU) nr. 600/2014](32014R0600), [(EU) nr. 806/2014](32014R0806) en [(EU) 2015/2365](32365R2015), en
      de [Richtlijnen 2002/47/EG](32002L0047), [2004/25/EG](32004L0025), [2007/36/EG](32007L0036), [2014/59](32014L0059)/
      EU en (EU) [2017/1132](32017L1132) (PbEU 2021, L 22).

      2 De Bank vormt een integrerend onderdeel van het Europees Stelsel van Centrale Banken met betrekking tot de taken
      en plichten die het Verdrag aan dat Stelsel opdraagt.
    url: https://wetten.overheid.nl/BWBR0009508/2026-03-25#Artikel1
  - number: '2'
    text: |-
      1 Ter uitvoering van het Verdrag heeft de Bank als doelstelling het handhaven van prijsstabiliteit.

      2 Ter uitvoering van het Verdrag ondersteunt de Bank, onverminderd het doel van prijsstabiliteit, het algemene
      economische beleid in de Europese Unie teneinde bij te dragen tot de verwezenlijking van de in artikel 3 van het
      Verdrag betreffende de Europese Unie omschreven doelstellingen van de Unie.

      3 De Bank handelt in overeenstemming met het beginsel van een open markteconomie met vrije mededinging, waarbij
      een doelmatige allocatie van middelen wordt bevorderd, en met inachtneming van de beginselen die zijn neergelegd in
      artikel 119 van het Verdrag.

      4 De Bank heeft voorts als doelstelling het uitvoeren van taken, anders dan die bedoeld in [artikel 3][ref1],
      voorzover deze haar bij of krachtens de wet zijn opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0009508#Artikel3
    url: https://wetten.overheid.nl/BWBR0009508/2026-03-25#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009508
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '3'
    text: |-
      1 Ter uitvoering van het Verdrag draagt de Bank in het kader van het Europees Stelsel van Centrale Banken bij aan
      de vervulling van de volgende taken

      a. het bepalen van het monetaire beleid en het ten uitvoer leggen van dat beleid;

      b. het verrichten van valutamarktoperaties in overeenstemming met artikel 219 van het Verdrag;

      c. het aanhouden en beheren van de officiële externe reserves;

      d. het verzorgen van de geldsomloop voorzover deze uit bankbiljetten bestaat;

      e. het bevorderen van de goede werking van het betalingsverkeer.

      2 Ter uitvoering van het Verdrag draagt de Bank in het kader van het Europees Stelsel van Centrale Banken bij tot
      een goede beleidsvoering van de bevoegde autoriteiten ten aanzien van het bedrijfseconomisch toezicht op banken en
      de stabiliteit van het financiële stelsel.

      3 Ter uitvoering van het Verdrag is het de Bank toegestaan bij de uitoefening van haar taken en plichten ingevolge
      het eerste en tweede lid instructies te vragen aan en te aanvaarden van uitsluitend de Europese Centrale Bank.
    url: https://wetten.overheid.nl/BWBR0009508/2026-03-25#Artikel3
  - number: '4'
    text: |-
      1 De Bank heeft tot taak:

      a. het uitoefenen van toezicht op financiële instellingen op de voet van de daarvoor geldende wettelijke
      regelingen;

      b. het bevorderen van de goede werking van het betalingsverkeer;

      c. het bevorderen van de stabiliteit van het financiële stelsel;

      d. het verzamelen van statistische gegevens en het vervaardigen van statistieken op de voet van de daarvoor
      geldende wettelijke regelingen;

      e. het uitoefenen van afwikkelingstaken met betrekking tot bepaalde financiële ondernemingen op de voet van de
      daarvoor geldende wettelijke regelingen.

      2 De Bank kan de in het eerste lid genoemde taken mede uitvoeren in de openbare lichamen Bonaire, Sint Eustatius en
      Saba, op de voet van de daarvoor geldende wettelijke regelingen.

      3 De Bank kan, na toestemming bij koninklijk besluit, in het algemeen belang zowel in het Europese deel van
      Nederland als in de openbare lichamen Bonaire, Sint Eustatius en Saba andere taken uitvoeren dan de in deze wet
      genoemde.
    url: https://wetten.overheid.nl/BWBR0009508/2026-03-25#Artikel4
  - number: 4a
    text: |-
      De Bank neemt bij de uitoefening van haar taak, bedoeld in [artikel 4, eerste lid, onderdeel e][ref1],
      tot uitgangspunt dat een beroep op de publieke middelen wordt vermeden. Indien met het oog op de
      afwikkelingsdoelstellingen, bedoeld in artikel 14 van de verordening gemeenschappelijk afwikkelingsmechanisme of
      artikel 21 van de verordening herstel en afwikkeling centrale tegenpartijen, een beroep op buitengewone openbare
      financiële steun onvermijdelijk is, wordt dat beroep beperkt tot hetgeen noodzakelijk is ter verwezenlijking van
      die doelstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009508#Artikel4
    url: https://wetten.overheid.nl/BWBR0009508/2026-03-25#Artikel4a
