  - number: '2'
    text: |-
      Deze wet is niet van toepassing op scheepsuitrusting, bestemd voor plaatsing aan boord van oorlogsschepen,
      marinehulpschepen en andere schepen die in gebruik zijn voor de uitvoering van een militaire taak.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel2
  - number: '3.1'
    text: |-
      Scheepsuitrusting die op of na de dag van inwerkingtreding van deze wet aan boord van een EU-schip wordt
      geplaatst, voldoet aan de vereisten betreffende het ontwerp, de constructie en de prestaties die zijn vastgelegd in
      internationale instrumenten die op de scheepsuitrusting van toepassing zijn op het moment waarop die uitrusting aan
      boord wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel3
  - number: '3.2'
    text: |-
      Overeenstemming van scheepsuitrusting met de vereisten, bedoeld in het eerste lid, wordt uitsluitend aangetoond aan
      de hand van de beproevingsnormen en de conformiteitsbeoordelingsprocedures.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel3
  - number: '4'
    text: |-
      De eigenaar draagt er zorg voor dat scheepsuitrusting die aan boord van een Nederlands schip is geplaatst, voldoet
      aan aan de vereisten opgenomen in de internationale instrumenten zoals deze vereisten luidden op het moment van
      plaatsing van die scheepsuitrusting. Indien vereisten die op een later moment zijn vastgesteld, van toepassing zijn
      verklaard op de scheepsuitrusting die al aan boord is geplaatst, draagt de eigenaar zorg voor tijdige vervanging
      van de scheepsuitrusting.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel4
  - number: '5.1'
    text: |-
      Alvorens een schip, niet zijnde een EU-schip, wordt ingeschreven als Nederlands schip, zorgt de eigenaar ervoor dat
      de scheepsuitrusting wordt vervangen, tenzij:
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel5
  - number: 5.1.a
    text: |-
      de scheepsuitrusting voldoet aan de vereisten gesteld bij of krachtens deze wet en is voorzien van een
      stuurwielmarkering, of
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel5
  - number: 5.1.b
    text: kan worden aangetoond dat de uitrusting als gelijkwaardig kan worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel5
  - number: '5.2'
    text: |-
      Indien niet kan worden vastgesteld op welke datum de scheepsuitrusting is geplaatst aan boord van een schip
      wordt de scheepsuitrusting vervangen, tenzij kan worden aangetoond dat de uitrusting als gelijkwaardig kan worden
      beschouwd.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel5
  - number: '5.3'
    text: |-
      Voor scheepsuitrusting die als gelijkwaardig wordt beschouwd, wordt een certificaat van gelijkwaardigheid
      afgegeven, die te allen tijde bij de scheepsuitrusting wordt bewaard. Met het certificaat wordt toestemming gegeven
      om de scheepsuitrusting aan boord van het schip te houden.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel5
  - number: '5.4'
    text: |-
      In het certificaat van gelijkwaardigheid kunnen beperkingen of voorschriften betreffende het gebruik van de
      scheepsuitrusting worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel5
  - number: '5.5'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot het tweede tot en met vierde
      lid.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel5
  - number: '6.1'
    text: |-
      Indien een product in overeenstemming is met de vereisten, bedoeld in [artikel 3, eerste lid][ref1], stelt de
      fabrikant de EU-conformiteitsverklaring op en brengt hij de stuurwielmarkering op het product aan. In de EU-
      conformiteitsverklaring wordt vermeld dat aangetoond is dat aan de op het product van toepassing zijnde vereisten,
      bedoeld in artikel 3, eerste lid, is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0038498#Artikel3
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0038498
        artikel: '3'
        paragraaf: '2'
  - number: '6.2'
    text: |-
      Het gebruik van de stuurwielmarkering is onderhevig aan de algemene beginselen, bedoeld in artikel 30, eerste en
      derde tot en met zesde lid, van de verordening, waarbij elke verwijzing naar de CE-markering als verwijzing naar de
      stuurwielmarkering wordt beschouwd.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel6
  - number: '6.3'
    text: |-
      Fabrikanten kunnen binnen een bij regeling van Onze Minister vast te stellen termijn de stuurwielmarkering
      aanvullen met of vervangen door een elektronisch label, indien voor de betreffende scheepsuitrusting passende
      criteria door de Commissie krachtens artikel 11, vierde lid, van de richtlijn zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel6
  - number: '6.4'
    text: |-
      Met het aanbrengen van de stuurwielmarkering en het opstellen van de EU-conformiteitsverklaring accepteert
      de fabrikant de verantwoordelijkheid om te waarborgen dat de scheepsuitrusting is ontworpen en vervaardigd
      overeenkomstig [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0038498#Artikel3
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0038498
        artikel: '3'
        paragraaf: '2'
  - number: '6.5'
    text: Bij regeling van Onze Minister worden nadere regels gesteld met betrekking tot de verplichtingen van de fabrikant.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel6
  - number: '6.6'
    text: Bij regeling van Onze Minister worden nadere regels gesteld met betrekking tot de stuurwielmarkering.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel6
  - number: '7.1'
    text: |-
      Een fabrikant die van mening is of redenen heeft om aan te nemen dat een product waarop hij de stuurwielmarkering
      heeft aangebracht niet in overeenstemming is met de vereisten, bedoeld in [artikel 3, eerste lid][ref1], neemt
      onmiddellijk de nodige corrigerende maatregelen om het product, of in voorkomend geval de betrokken producten, in
      overeenstemming te brengen. Indien nodig, neemt de fabrikant het product uit de handel of roept hij het product
      terug.


      [ref1]: https://wetten.overheid.nl/BWBR0038498#Artikel3
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0038498
        artikel: '3'
        paragraaf: '2'
  - number: '7.2'
    text: |-
      Indien een product als bedoeld in het eerste lid een risico vertoont, brengt de fabrikant de
      markttoezichtautoriteit hiervan onmiddellijk op de hoogte, waarbij hij in het bijzonder de non-conformiteit en alle
      genomen corrigerende maatregelen beschrijft.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel7
  - number: '8.1'
    text: |-
      Een importeur of distributeur wordt voor de toepassing van deze wet en de onderliggende regelgeving als
      fabrikant beschouwd en voldoet aan de verplichtingen van de fabrikant wanneer de importeur of distributeur de
      scheepsuitrusting onder eigen naam of merknaam in de handel brengt, dan wel aan boord van een EU-schip plaatst of
      reeds in de handel gebrachte scheepsuitrusting zodanig wijzigt dat de conformiteit met de vereisten, bedoeld in
      [artikel 3, eerste lid][ref1], in het gedrang kan komen.


      [ref1]: https://wetten.overheid.nl/BWBR0038498#Artikel3
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0038498
        artikel: '3'
        paragraaf: '2'
  - number: '8.2'
    text: |-
      Bij regeling van Onze Minister worden de verplichtingen van de vertegenwoordiger, importeur en distributeur
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel8
  - number: '9.1'
    text: |-
      De fabrikant laat voorafgaand aan het in de handel brengen een conformiteitsbeoordeling uitvoeren van de
      scheepsuitrusting.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel9
  - number: '9.2'
    text: |-
      Voor de uitvoering van een conformiteitsbeoordeling kiest de fabrikant een door een Europese lidstaat aangemelde
      instantie die bevoegd is de beoordeling uit te voeren.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel9
  - number: '9.3'
    text: |-
      De fabrikant verleent de aangemelde instantie alle medewerking voor zover dat noodzakelijk is voor de uitvoering
      van de conformiteitsbeoordeling en de uitoefening van andere bij of krachtens deze wet bedoelde taken.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel9
  - number: '9.4'
    text: De aangemelde instantie voert conformiteitsbeoordeling uit volgens de conformiteitsbeoordelingsprocedures.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel9
  - number: '9.5'
    text: Bij regeling van Onze Minister worden nadere regels gesteld met betrekking tot de conformiteitsbeoordeling.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel9
  - number: '10.1'
    text: |-
      Scheepsuitrusting gaat vergezeld van een exemplaar van de EU-conformiteitsverklaring die van toepassing is op
      de betrokken uitrusting. De verklaring wordt aan boord bewaard totdat de genoemde uitrusting van het schip wordt
      verwijderd.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel10
  - number: '10.2'
    text: Bij regeling van Onze Minister worden nadere regels gesteld met betrekking tot de EU-conformiteitsverklaring.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel10
  - number: '11.1'
    text: |-
      Onze Minister kan één of meerdere conformiteitsbeoordelingsinstanties aanwijzen die bevoegd zijn tot het verrichten
      van conformiteitsbeoordelingen.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel11
  - number: '11.2'
    text: |-
      Een conformiteitsbeoordelingsinstantie die wenst te worden aangewezen dient daartoe een verzoek tot aanwijzing in
      bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel11
  - number: '11.3'
    text: |-
      Bij regeling van Onze Minister worden nadere regels gesteld met betrekking tot de vereisten die worden gesteld aan
      de instantie en het door de instantie in te dienen verzoek tot aanwijzing.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel11
  - number: '12.1'
    text: |-
      Onze Minister meldt de op grond van [artikel 11, eerste lid][ref1], aangewezen instanties aan bij de Europese
      Commissie en de andere lidstaten van de Europese Unie, overeenkomstig bijlage IV, onder 2, bij de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0038498#Artikel11
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0038498
        artikel: '11'
        paragraaf: '6'
  - number: '12.2'
    text: |-
      De aangemelde instantie gaat pas over tot het verrichten van conformiteitsbeoordelingsprocedures na mededeling van
      Onze Minister dat de Europese Commissie en de andere lidstaten geen bezwaren als bedoeld in bijlage IV, onder 2.5,
      bij de richtlijn hebben ingediend tegen de aanmelding, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel12
  - number: '13.1'
    text: |-
      Onze Minister ziet toe op de rechtmatige en doeltreffende uitvoering door de aangemelde instantie van het bij of
      krachtens deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel13
  - number: '13.2'
    text: De aangemelde instanties worden ten minste om de twee jaar door Onze Minister gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel13
  - number: '13.3'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot het op de aangemelde instantie
      uit te oefenen toezicht en de door de aangemelde instantie voor de uitoefening van dat toezicht verschuldigde
      vergoeding.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel13
  - number: '14.1'
    text: |-
      Indien is gebleken dat de aangemelde instantie niet langer voldoet aan de aan haar gestelde vereisten, of haar
      verplichtingen niet nakomt, kan Onze Minister de aanwijzing beperken, opschorten of intrekken, afhankelijk van de
      ernst van het niet voldoen aan die vereisten of het niet-nakomen van die verplichtingen.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel14
  - number: '14.2'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld met betrekking tot de verplichtingen van de aangemelde
      instantie.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel14
  - number: '15.1'
    text: |-
      Indien de aanwijzing van de aangemelde instantie wordt ingetrokken, behouden de door deze instantie afgegeven
      documenten hun geldigheid.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel15
  - number: '15.2'
    text: |-
      In afwijking van het eerste lid, kan Onze Minister verklaren dat een of meer documenten hun geldigheid hebben
      verloren, indien er een dreigend of rechtstreeks gevaar is voor de maritieme veiligheid, de gezondheid of het
      milieu.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel15
  - number: '16'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de bij regeling van Onze
      Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel16
  - number: '17.1'
    text: |-
      Wanneer een aangemelde instantie bij het toezicht op de conformiteit na verlening van een conformiteitscertificaat
      aan de fabrikant vaststelt dat een product niet langer in overeenstemming is met het bij of krachtens deze wet
      bepaalde, verlangt zij van de fabrikant dat hij onverwijld passende corrigerende maatregelen neemt. Indien nodig,
      schort de aangemelde instantie het conformiteitscertificaat op of trekt zij dit in.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel17
  - number: '17.2'
    text: |-
      Wanneer geen corrigerende maatregelen als bedoeld in het eerste lid worden genomen of de genomen maatregelen niet
      het vereiste effect hebben, wordt het conformiteitscertificaat door de aangemelde instantie naar gelang het geval
      beperkt, opgeschort of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel17
  - number: '18.1'
    text: |-
      Indien de markttoezichtautoriteit vaststelt dat scheepsuitrusting een risico vormt voor de maritieme veiligheid, de
      gezondheid of het milieu, neemt de verantwoordelijke marktdeelnemer:
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel18
  - number: 18.1.a
    text: |-
      alle passende corrigerende maatregelen om de betrokken scheepsuitrusting in overeenstemming te brengen met het bij
      of krachtens deze wet bepaalde, of
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel18
  - number: 18.1.b
    text: |-
      binnen een door de markttoezichtautoriteit vastgestelde redelijke termijn, die evenredig is met de aard van het
      risico, de betrokken scheepsuitrusting uit de handel of roept hij deze terug.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel18
  - number: '18.2'
    text: |-
      De verantwoordelijke marktdeelnemer zorgt ervoor dat alle maatregelen, bedoeld in het eerste lid, onderdeel
      a, worden toegepast op alle betrokken producten die hij in de Europese Unie op de markt heeft aangeboden, of,
      afhankelijk van het geval, aan boord van Europese schepen heeft geplaatst of voor dergelijke plaatsing heeft
      geleverd.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel18
  - number: '18.3'
    text: |-
      De markttoezichtautoriteit brengt de aangemelde instantie op de hoogte van de door de marktdeelnemer genomen
      maatregelen.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel18
  - number: '18.4'
    text: |-
      Indien de verantwoordelijke marktdeelnemer niet of niet tijdig binnen de door de markttoezichtautoriteit gestelde
      termijn, bedoeld in het eerste lid, onderdeel b, doeltreffende corrigerende maatregelen neemt of op andere wijze
      verzuimt aan de verplichtingen gesteld bij of krachtens deze wet te voldoen, neemt de markttoezichtautoriteit alle
      passende voorlopige maatregelen om het aanbieden op de Nederlandse markt of het plaatsen aan boord van Nederlandse
      schepen van de betrokken scheepsuitrusting te verbieden of te beperken, dan wel de scheepsuitrusting uit de handel
      te nemen of terug te roepen.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel18
  - number: '19.1'
    text: |-
      Indien de markttoezichtautoriteit vaststelt dat scheepsuitrusting die voldoet aan het bij of krachtens deze wet
      bepaalde, desalniettemin een risico vormt voor de maritieme veiligheid, de gezondheid of het milieu, neemt de
      verantwoordelijke marktdeelnemer:
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel19
  - number: 19.1.a
    text: |-
      alle passende maatregelen om ervoor te zorgen dat de scheepsuitrusting geen risico meer vormt wanneer deze in de
      handel wordt gebracht, of
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel19
  - number: 19.1.b
    text: |-
      binnen een door de markttoezichtautoriteit vastgestelde redelijke termijn, die evenredig is met de aard van het
      risico, de betrokken scheepsuitrusting uit de handel of roept hij deze terug.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel19
  - number: '19.2'
    text: |-
      De verantwoordelijke marktdeelnemer zorgt ervoor dat de door hem genomen corrigerende maatregelen worden toegepast
      op alle betrokken producten die hij in de Europese Unie op de markt heeft aangeboden of aan boord van Europese
      schepen heeft geplaatst.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel19
  - number: '20.1'
    text: |-
      De verantwoordelijke marktdeelnemer is verplicht om scheepsuitrusting in overeenstemming te brengen met het bij of
      krachtens deze wet bepaalde, indien de markttoezichtautoriteit vaststelt dat:
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel20
  - number: 20.1.a
    text: de stuurwielmarkering niet of ten onrechte is aangebracht;
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel20
  - number: 20.1.b
    text: de EU-conformiteitsverklaring niet of incorrect is opgesteld;
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel20
  - number: 20.1.c
    text: de technische documentatie niet beschikbaar of onvolledig is, of
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel20
  - number: 20.1.d
    text: de EU-conformiteitsverklaring niet naar het schip is gestuurd.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel20
  - number: '20.2'
    text: |-
      Indien de verantwoordelijke marktdeelnemer de opgedragen handelingen niet of niet tijdig uitvoert, neemt de
      markttoezichtautoriteit alle passende maatregelen om het aanbieden van de betreffende scheepsuitrusting te beperken
      of te verbieden, dan wel de scheepsuitrusting uit de handel te nemen of terug te roepen.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel20
  - number: '21.1'
    text: 'Bij regeling van Onze Minister worden regels gesteld betreffende het gebruik van scheepsuitrusting:'
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel21
  - number: 21.1.a
    text: in uitzonderlijke gevallen van technische innovatie;
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel21
  - number: 21.1.b
    text: ten behoeve van beproeving of ter beoordeling van de scheepsuitrusting;
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel21
  - number: 21.1.c
    text: |-
      in uitzonderlijke omstandigheden indien scheepsuitrusting wordt vervangen aan boord van een schip dat zich in een
      haven buiten de Europese Unie bevindt en het vanuit het oogpunt van tijd en kosten redelijkerwijs niet uitvoerbaar
      is om scheepsuitrusting die is voorzien van een stuurwielmarkering aan boord te plaatsten, en
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel21
  - number: 21.1.d
    text: |-
      in uitzonderlijke omstandigheden indien het aantoonbaar is dat specifieke scheepsuitrusting die is voorzien van een
      stuurwielmarkering niet in de handel verkrijgbaar is.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel21
  - number: '21.2'
    text: |-
      In afwijking van [artikel 3][ref1] behoeft scheepsuitrusting, bedoeld in het eerste lid, niet te voldoen aan de
      vereisten, bedoeld in artikel 3, eerste lid, en mag die uitrusting zonder stuurwielmarkering in de handel worden
      gebracht, mits die uitrusting voldoet aan de eisen opgenomen krachtens het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0038498#Artikel3
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0038498
        artikel: '3'
        paragraaf: '2'
  - number: '22.1'
    text: |-
      Het is verboden scheepsuitrusting aan boord te plaatsen of scheepsuitrusting die is bestemd voor plaatsing aan
      boord van een EU-schip in de handel te brengen, indien die uitrusting:
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel22
  - number: 22.1.a
    text: niet op deugdelijke wijze is voorzien van een stuurwielmarkering;
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel22
  - number: 22.1.b
    text: |-
      niet vergezeld gaat van een certificaat van gelijkwaardigheid als bedoeld in [artikel 5, derde lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0038498#Artikel5
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0038498
        artikel: '5'
        paragraaf: '3'
  - number: 22.1.c
    text: |-
      niet vergezeld gaat van een verklaring waarin wordt aangegeven dat de scheepsuitrusting op grond van
      [artikel 21, tweede lid][ref1], is vrijgesteld van het hebben van een stuurwielmarkering.


      [ref1]: https://wetten.overheid.nl/BWBR0038498#Artikel21
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0038498
        artikel: '21'
        paragraaf: '8'
  - number: '22.2'
    text: |-
      Het is verboden de stuurwielmarkering aan te brengen op producten waarbij niet overeenkomstig de desbetreffende
      conformiteitsbeoordelingsprocedure is aangetoond dat deze voldoet aan de vereisten gesteld bij of krachtens deze
      wet.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel22
  - number: '22.3'
    text: |-
      Het is verboden een EU-conformiteitsverklaring af te geven voor producten waarbij niet overeenkomstig de
      desbetreffende conformiteitsbeoordelingsprocedure is aangetoond dat deze voldoet aan de vereisten gesteld bij of
      krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel22
  - number: '22.4'
    text: |-
      Het is verboden op scheepsuitrusting een andere aanduiding dan de stuurwielmarkering aan te brengen, die verwarring
      zou kunnen stichten met betrekking tot de betekenis of de grafische vormgeving van de stuurwielmarkering, of die de
      zichtbaarheid of de leesbaarheid van de stuurwielmarkering verminderen.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel22
  - number: '22.5'
    text: 'Het is verboden te handelen in strijd met een verplichting, gebod of verbod, opgenomen in:'
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel22
  - number: 22.5.a
    text: |-
      [artikel 10, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0038498#Artikel10
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0038498
        artikel: '10'
        paragraaf: '5'
  - number: 22.5.b
    text: |-
      [artikelen 6, eerste lid][ref1], [8, eerste lid][ref2], [9, eerste en derde lid][ref3], en [20, eerste lid][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0038498#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0038498#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0038498#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0038498#Artikel20
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0038498
        artikel: '6'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0038498
        artikel: '8'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0038498
        artikel: '9'
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0038498
        artikel: '20'
        paragraaf: '7'
  - number: 22.5.c
    text: |-
      [artikelen 7, eerste lid][ref1], [18, eerste en tweede lid][ref2], en [19][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0038498#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0038498#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0038498#Artikel19
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0038498
        artikel: '7'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0038498
        artikel: '18'
        paragraaf: '7'
      - id: ref3
        bwb_id: BWBR0038498
        artikel: '19'
        paragraaf: '7'
  - number: '23.1'
    text: |-
      Onze Minister kan aan degene die handelt in strijd met de in [artikel 22][ref1] gestelde verboden een bestuurlijke
      boete opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0038498#Artikel22
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0038498
        artikel: '22'
        paragraaf: '9'
  - number: '23.2'
    text: |-
      De bestuurlijke boete die voor een overtreding van [artikel 22, eerste lid en vijfde lid, onderdeel a][ref1],
      ten hoogste kan worden opgelegd komt overeen met de boete van de derde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0038498#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0038498
        artikel: '22'
        paragraaf: '9'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '23.3'
    text: |-
      De bestuurlijke boete die voor een overtreding van
      [artikel 22, tweede tot en met vierde lid en vijfde lid, onderdeel b][ref1], kan worden opgelegd komt overeen met
      de boete van de vierde categorie, bedoeld in [artikel 23, vierde lid van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0038498#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0038498
        artikel: '22'
        paragraaf: '9'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '23.4'
    text: |-
      De bestuurlijke boete die voor een overtreding van [artikel 22, vijfde lid, onderdeel c][ref1],
      kan worden opgelegd komt overeen met de boete van de vijfde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0038498#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0038498
        artikel: '22'
        paragraaf: '9'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '23.5'
    text: |-
      De op te leggen bestuurlijke boete kan met ten hoogste 50 procent worden verhoogd, indien binnen een periode van 48
      maanden tweemaal voor een zelfde feit, elk afzonderlijk in een periode van ten hoogste 24 maanden voorafgaand aan
      dat feit, een boete is opgelegd en onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel23
  - number: '24'
    text: |-
      Onze Minister is bevoegd tot toepassing van een last onder bestuursdwang ter handhaving van de verplichtingen
      gesteld bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel24
  - number: '25.1'
    text: |-
      De vereisten en beproevingsnormen voor scheepsuitrusting die op grond van de [Wet scheepsuitrusting][ref1] van
      toepassing waren voor de dag van inwerkingtreding van deze wet, blijven van toepassing totdat op grond van deze wet
      de voor die betreffende scheepsuitrusting geldende vereisten, bedoeld in [artikel 3, eerste lid][ref2], in werking
      treden.


      [ref1]: https://wetten.overheid.nl/BWBR0011301
      [ref2]: https://wetten.overheid.nl/BWBR0038498#Artikel3
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011301
      - id: ref2
        bwb_id: BWBR0038498
        artikel: '3'
        paragraaf: '2'
  - number: '25.2'
    text: |-
      Op scheepsuitrusting die op de markt is aangeboden of is geplaatst aan boord van een Nederlands schip
      na 18 oktober 2000 en voor de dag van inwerkingtreding van deze wet, blijven de [artikelen 3][ref1],
      [7 tot en met 15][ref2] en [20 tot en met 26 van de Wet scheepsuitrusting][ref3] alsmede
      [artikel 1, onderdeel 4, van de Wet op de economische delicten][ref4] van toepassing, zoals die luidden op de dag
      voorafgaand aan die van de inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011301#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011301#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0011301#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0002063#Artikel4
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011301
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011301
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0011301
        artikel: '20'
      - id: ref4
        bwb_id: BWBR0002063
        artikel: '4'
  - number: '25.3'
    text: |-
      Certificaten en verklaringen die voorafgaand aan de dag van inwerkingtreding van deze wet zijn afgegeven op basis
      van de [Wet scheepsuitrusting][ref1], behouden hun geldigheid gedurende de in het certificaat of de verklaring
      opgenomen geldigheidsduur.


      [ref1]: https://wetten.overheid.nl/BWBR0011301
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011301
  - number: '25.4'
    text: |-
      In afwijking van het derde lid, kan Onze Minister verklaren dat een of meer certificaten, of verklaringen hun
      geldigheid hebben verloren indien niet meer wordt voldaan aan de vereisten op basis waarvan het certificaat of de
      verklaring is afgegeven.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel25
  - number: '25.5'
    text: |-
      Bij ministeriële regeling kunnen, voor zover nodig ter uitvoering van een handeling van de Europese Commissie,
      aanvullende regels van overgangsrecht worden gesteld.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel25
  - number: '26'
    text: |-
      Voor zover op grond van de Overeenkomst betreffende de Europese Economische Ruimte de richtlijn ook verbindend is
      voor een staat, niet zijnde een lidstaat van de Europese Unie, wordt deze staat voor de toepassing van deze wet
      gelijkgesteld met een lidstaat van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel26
  - number: '27.1'
    text: |-
      Een wijziging van de bijlagen bij de richtlijn gaat voor de toepassing van deze wet en de daarop berustende
      bepalingen gelden met ingang van de dag waarop aan de betrokken wijziging uitvoering moet zijn gegeven, tenzij bij
      ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel27
  - number: '27.2'
    text: |-
      Een wijziging van de verdragen gaat voor de toepassing van deze wet en de daarop berustende bepalingen gelden met
      ingang van de dag waarop die wijziging internationaal in werking treedt, tenzij bij ministerieel besluit, dat in de
      Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel27
  - number: '31'
    text: |-
      De [Wet scheepsuitrusting][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0011301
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0011301
  - number: '32'
    text: |-
      Deze wet treedt in werking met ingang van 18 september 2016. Indien het Staatsblad waarin deze wet wordt geplaatst
      wordt uitgegeven na 17 september 2016, treedt deze wet in werking met ingang van de dag, volgende op die van
      plaatsing van deze wet in het Staatsblad.
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel32
  - number: '33'
    text: 'Deze wet wordt aangehaald als: Wet scheepsuitrusting 2016'
    url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#Artikel33
