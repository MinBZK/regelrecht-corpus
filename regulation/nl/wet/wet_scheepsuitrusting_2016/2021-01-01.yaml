preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het, gelet op richtlijn 2014/90/EU van het Europees Parlement en de
    Raad van de Europese Unie van 23 juli 2014 inzake uitrusting van zeeschepen en tot intrekking van richtlijn
    96/98/EG van de Raad (PbEU L 257), noodzakelijk is regels te stellen met betrekking tot de productie, de
    conformiteitsbeoordeling en het plaatsen aan boord van scheepsuitrusting;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0038498/2021-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *aangemelde instantie:* instantie die
      door Onze Minister is aangewezen overeenkomstig [artikel 11, eerste lid][ref1], en is aangemeld bij de Europese
      Commissie en de andere lidstaten van de Europese Unie overeenkomstig [artikel 12, eerste lid][ref2];
        - *beproevingsnormen:* beproevingsnormen, genoemd in artikel 2, onder 4, van de richtlijn;
        - *conformiteitsbeoordeling:* proces dat wordt uitgevoerd overeenkomstig de conformiteitsbeoordelingsprocedures van
      bijlage II bij de richtlijn, waarmee wordt aangetoond of scheepsuitrusting voldoet aan de vereisten gesteld bij of
      krachtens deze wet;
        - *conformiteitsbeoordelingsinstantie:* instantie die activiteiten in het kader van een conformiteitsbeoordeling
      verricht, zoals ijken, testen, certificeren en inspecteren;
        - *conformiteitscertificaat:* certificaat dat wordt afgegeven door een aangemelde instantie aan de fabrikant indien
      hij aan de vereisten met betrekking tot de certificering gesteld bij of krachtens deze wet heeft voldaan;
        - *distributeur:* natuurlijke of rechtspersoon in de toeleveringsketen, niet zijnde de fabrikant of importeur, die
      scheepsuitrusting op de markt aanbiedt;
        - *eigenaar:* persoon die het beheer over het schip heeft, hetzij hij eigenaar of boekhouder van de rederij van het
      schip is, hetzij hem het schip in gebruik is gegeven;
        - *EU-conformiteitsverklaring:* verklaring die wordt afgegeven door de fabrikant en waarmee wordt aangetoond dat is
      voldaan aan de vereisten, bedoeld in [artikel 3, eerste lid][ref3];
        - *EU-schip:* Nederlands schip of schip dat onder de vlag van een andere lidstaat van de Europese Unie vaart, en
      waarop de verdragen van toepassing zijn;
        - *fabrikant:* natuurlijke of rechtspersoon die scheepsuitrusting vervaardigt of laat ontwerpen of vervaardigen, en
      deze onder zijn naam of handelsmerk verhandelt;
        - *importeur:* in de Europese Unie gevestigde natuurlijke of rechtspersoon die scheepsuitrusting uit een derde land
      in de Europese Unie in de handel brengt;
        - *in de handel brengen:* het voor het eerst in de Europese Unie op de markt aanbieden van scheepsuitrusting;
        - *internationale instrumenten:* een of meer van toepassing zijnde verdragen, met inbegrip van de resoluties en
      circulaires van de Internationale Maritieme Organisatie die uitvoering geven aan de geactualiseerde versie van deze
      verdragen, alsmede beproevingsnormen;
        - *marktdeelnemers:* fabrikant, vertegenwoordiger, importeur en distributeur;
        - *markttoezicht:* activiteiten en maatregelen van overheidsinstanties om ervoor te zorgen dat scheepsuitrusting
      voldoet aan de toepasselijke eisen die zijn opgenomen in harmonisatiewetgeving van de Europese Unie en bij of
      krachtens deze wet, en geen gevaar oplevert voor de gezondheid en maritieme veiligheid of andere aspecten van de
      bescherming van het openbaar belang;
        - *markttoezichtautoriteit:* ambtenaren als bedoeld in [artikel 16][ref4];
        - *Nederlands schip:* schip dat op grond van de voor Nederland geldende rechtsregels gerechtigd is de vlag van
      het Koninkrijk te voeren en waarvoor de verdragen voorschrijven dat de aan boord te plaatsen scheepsuitrusting
      overeenkomstig de verdragen is goedgekeurd;
        - *Onze Minister:* Onze Minister van Infrastructuur en Milieu;
        - *op de markt aanbieden:* het in het kader van een handelsactiviteit, al dan niet tegen betaling, verstrekken van
      scheepsuitrusting op de markt van de Europese Unie;
        - *product:* uitrustingsonderdeel van zeeschepen;
        - *richtlijn:* [richtlijn nr. 2014/90](32014L0090)/EU van het Europees Parlement en de Raad van de Europese Unie
      inzake uitrusting van zeeschepen en tot intrekking van [richtlijn 96/98/EG](31996L0098) van de Raad (PbEU L 257);
        - *scheepsuitrusting:* scheepsuitrusting die is geplaatst of die bestemd is voor plaatsing aan boord van een EU-
      schip en waarvoor de goedkeuring van de bevoegde instantie van de vlaggenstaat op grond van de internationale
      instrumenten is vereist, ongeacht of het schip zich in de Europese Unie bevindt op het moment waarop de
      scheepsuitrusting aan boord wordt geplaatst;
        - *stuurwielmarkering:* symbool dat is weergegeven in bijlage I bij de richtlijn, of indien van toepassing, het
      elektronisch label, bedoeld in [artikel 6, derde lid][ref5];
        - *terugroepen:* maatregel waarmee wordt beoogd scheepsuitrusting die al aan boord van een EU-schip is geplaatst of
      is aangekocht met de bedoeling deze aan boord van een EU-schip te plaatsen, te doen terugkeren;
        - *uit de handel nemen:* maatregel waarmee wordt beoogd te voorkomen dat scheepsuitrusting die zich in de
      toeleveringsketen bevindt, op de markt wordt aangeboden;
        - *verdragen:* internationale verdragen, genoemd in artikel 2, onder 3, van de richtlijn;
        - *verordening:* [verordening (EG) nr. 765/2008](32008R0765) van het Europees Parlement en de Raad van de Europese
      Unie van 9 juli 2008 tot vaststelling van de eisen inzake accreditatie en markttoezicht betreffende het verhandelen
      van producten en tot intrekking van Verordening (EEG) nr. 339/93 (PbEU L 218);
        - *vertegenwoordiger:* in de Europese Unie gevestigde natuurlijke of rechtspersoon die bij schriftelijke
      overeenkomst door een fabrikant is aangesteld om namens hem specifieke taken te vervullen;
        - *Wet scheepsuitrusting:*
