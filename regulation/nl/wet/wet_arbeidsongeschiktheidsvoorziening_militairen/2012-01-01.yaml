  - number: 8a
    text: |-
      De [artikelen 8][ref1] en [8a van de Ziektewet][ref2] en [7a ][ref3] en
      [16, onderdeel c van de Wet op de arbeidsongeschiktheidsverzekering][ref4] zijn op degene, die een uitkering
      ingevolge deze wet ontvangt, niet van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel8a
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel7a
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel16
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 8a
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 7a
      - id: ref4
        bwb_id: BWBR0002524
        artikel: '16'
  - number: '9'
    text: |-
      [Artikel 33][ref1] is van overeenkomstige toepassing met betrekking tot uitkeringen anders dan bedoeld in dat
      artikel, die worden ontleend aan een andere wettelijke regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 33a
  - number: '10'
    text: Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van het dagloon.
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel10
  - number: '11'
    text: |-
      De uitgaven en de kosten verbonden aan de uitvoering van deze wet alsmede de ingevolge enige wet over de
      uitkeringen krachtens deze wet door het uitvoeringsorgaan verschuldigde premies, die niet op deze uitkeringen in
      mindering kunnen worden gebracht, komen ten laste van het Rijk.
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel11
  - number: '12'
    text: |-
      De bepalingen van deze wet zijn met uitzondering van [hoofdstuk II][ref1] mede van toepassing ten aanzien van
      degene die arbeidsongeschikt is geworden op een tijdstip gelegen vóór 1 juli 1966 en wiens arbeidsongeschiktheid
      sedertdien onafgebroken heeft voortgeduurd, indien hij:


      [ref1]: https://wetten.overheid.nl/BWBR0002822#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002822
        hoofdstuk: II
  - number: 12.a
    text: ter zake van zijn arbeidsongeschiktheid geen aanspraken krachtens een andere wettelijke regeling kan doen gelden,
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel12
  - number: 12.b
    text: aan deze wet aanspraken zou hebben kunnen ontlenen, wanneer deze wet op dat tijdstip reeds in werking was getreden,
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel12
  - number: 12a
    text: |-
      Artikel 10 en de daarop berustende bepalingen, zoals die luidden op de dag voorafgaand aan de inwerkingtreding van
      artikel XXI van de Wet administratieve lastenverlichting en vereenvoudiging in socialeverzekeringswetten, blijven
      van toepassing op de persoon wiens recht op uitkering is ontstaan voor de datum van inwerkingtreding van dat
      artikel, met betrekking tot die uitkering.
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel12a
  - number: '13.1'
    text: De Militaire Ziekengeldregeling (*Stcrt.* 1966, 157) vervalt.
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel13
  - number: '13.2'
    text: |-
      De Militaire Ziekengeldregeling en haar uitvoeringsbesluiten, zoals deze luidden op de dag, voorafgaande aan die,
      waarop deze wet in werking treedt, blijven van toepassing ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel13
  - number: 13.2.a
    text: |-
      rechten, bevoegdheden en verplichtingen, betrekking hebbende op tijdvakken, gelegen vóór de dag van
      inwerkingtreding van deze wet;
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel13
  - number: 13.2.b
    text: |-
      op de dag van inwerkingtreding van deze wet lopende ziektegevallen, met dien verstande dat ten aanzien van deze
      gevallen van bedoelde dag af artikel 4, eerste lid, tweede volzin, van de Militaire Ziekengeldregeling buiten
      toepassing blijft.
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel13
  - number: '14'
    text: |-
      Indien een belanghebbende in aansluiting op de maximumuitkeringstermijn, bedoeld in artikel 4, eerste lid, eerste
      volzin, van de Militaire Ziekengeldregeling, zoals dat artikel luidde op de dag voorafgaande aan die, waarop deze
      wet in werking treedt, een uitkering ten laste van het Ministerie van Defensie heeft genoten en hij over datzelfde
      tijdvak of een gedeelte daarvan tevens recht heeft op een arbeidsongeschiktheidsuitkering krachtens deze wet, wordt
      deze arbeidsongeschiktheidsuitkering slechts uitbetaald, voor zoveel zij eerstbedoelde uitkering over dat tijdvak
      of dat gedeelte daarvan overtreft, evenwel voor zover Onze Minister van Defensie niet anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel14
  - number: '15'
    text: |-
      De [Algemene termijnenwet][ref1] is niet van toepassing op de in de [artikelen 3][ref2] en [5][ref3] gestelde
      termijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
      [ref2]: https://wetten.overheid.nl/BWBR0002822#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002822#Artikel5
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002448
      - id: ref2
