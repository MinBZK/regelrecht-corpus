  - number: '18'
    text: |-
      Onze Ministers van Defensie en van Sociale Zaken en Werkgelegenheid kunnen nadere regelen stellen ter uitvoering
      van deze wet.
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel18
  - number: '19'
    text: Deze wet kan worden aangehaald als "Wet arbeidsongeschiktheidsvoorziening militairen".
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel19
  - number: '20'
    text: |-
      Deze wet treedt in werking met ingang van de tweede kalendermaand na de datum van uitgifte van het *Staatsblad*,
      waarin zij wordt geplaatst en werkt terug voor wat betreft:
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel20
  - number: 20.a
    text: |-
      de [artikelen 1][ref1], [2][ref2], [5 tot en met 15][ref3], [18][ref4] en [19][ref5] tot 1 juli 1966;


