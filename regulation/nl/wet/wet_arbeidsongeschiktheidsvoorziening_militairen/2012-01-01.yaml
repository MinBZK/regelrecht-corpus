$id: wet_arbeidsongeschiktheidsvoorziening_militairen
regulatory_layer: WET
publication_date: '2014-07-15'
valid_from: '2012-01-01'
bwb_id: BWBR0002822
url: https://wetten.overheid.nl/BWBR0002822/2012-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is ten behoeve van dienstplichtige militairen en
    daarmede gelijkgestelden regelen vast te stellen met betrekking tot voorzieningen tegen geldelijke gevolgen van
    arbeidsongeschiktheid;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Voor de toepassing van hetgeen bij of krachtens deze wet is bepaald wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel1
  - number: 1.1.a
    text: 'belanghebbende:'
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel1
  - number: 1.1.a.1°
    text: |-
      hij, die dienstplichtige is in de zin van de Dienstplichtwet of krachtens die wet als dienstplichtige wordt
      beschouwd dan wel hij die dienstplichtige is in de zin van de [Kaderwet dienstplicht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008589
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008589
  - number: 1.1.a.2°
    text: hij, die verplicht tot het reserve-personeel der krijgsmacht behoort;
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel1
  - number: 1.1.a.3°
    text: |-
      hij, die is aangesteld bij het reserve-personeel der krijgsmacht om bij het Korps Nationale Reserve, als bedoeld in
      het Besluit Nationale Reserve (koninklijk besluit van 14 oktober 1982, nummer 48), militaire dienst te verrichten;
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel1
  - number: 1.1.a.4°
    text: |-
      hij, die krachtens [artikel 51 van de Oorlogswet voor Nederland][ref1] wordt aangemerkt als militair;


      [ref1]: https://wetten.overheid.nl/BWBR0007983#Artikel51
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007983
        artikel: '51'
  - number: 1.1.b
    text: 'dag, waarop het verblijf in werkelijke dienst eindigt: de dag van ingang van:'
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel1
  - number: 1.1.b.1°
    text: klein verlof in afwachting van groot verlof;
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel1
  - number: 1.1.b.2°
    text: groot verlof, indien dit niet is vooraf gegaan door klein verlof in afwachting van groot verlof;
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel1
  - number: 1.1.b.3°
    text: ontslag, indien dit niet is vooraf gegaan door een verlof genoemd onder 1° of 2°;
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel1
  - number: 1.1.c
    text: 'arbeidsongeschiktheid:'
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel1
  - number: 1.1.c.1°
    text: |-
      voor de toepassing van [hoofdstuk II][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0002822#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002822
        hoofdstuk: II
  - number: 1.1.c.1°.a
    text: |-
      ongeschiktheid tot het verrichten van arbeid als bedoeld in [artikel 46, zesde lid, van de Ziektewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel46
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '46'
  - number: 1.1.c.1°.b
    text: |-
      indien de in [artikel 46, zesde lid, van de Ziektewet][ref1] bedoelde arbeid niet aanwijsbaar is, de
      arbeidsongeschiktheid als bedoeld in de [Wet op de arbeidsongeschiktheidsverzekering][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '46'
      - id: ref2
        bwb_id: BWBR0002524
  - number: 1.1.c.2°
    text: |-
      voor de toepassing van [hoofdstuk III][ref1]: arbeidsongeschiktheid als bedoeld in de
      [Wet op de arbeidsongeschiktheidsverzekering][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002822#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002822
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002524
  - number: 1.1.d
    text: |-
      uitvoeringsorgaan: het in [artikel 7][ref1] genoemde orgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002822#Artikel7
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002822
        artikel: '7'
        hoofdstuk: V
  - number: '1.2'
    text: 'Voor de toepassing van hetgeen bij of krachtens deze wet is bepaald wordt begrepen onder:'
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel1
  - number: 1.2.a
    text: 'belanghebbende:'
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel1
  - number: 1.2.a.1°
    text: |-
      hij, die is aangesteld in burgerlijke openbare dienst om in de krijgsmacht als geestelijke verzorger niet
      doorlopend werkzaam te zijn;
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel1
  - number: 1.2.a.2°
    text: |-
      hij, die ingevolge de [Wet gewetensbezwaren militaire dienst][ref1] is verplicht tot vervangende dienst;


      [ref1]: https://wetten.overheid.nl/BWBR0002386
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002386
  - number: 1.2.b
    text: |-
      dag, waarop het verblijf in werkelijke dienst eindigt: de dag, met ingang waarvan ingevolge een desbetreffende
      beschikking de werkzaamheid als geestelijke verzorger, bedoeld onder *a*, 1°, in de krijgsmacht eindigt dan wel de
      dag, met ingang waarvan de vervangende dienst, bedoeld onder *a*, 2°, door groot verlof of door ontslag, indien dat
      ontslag niet is voorafgegaan door groot verlof, eindigt.
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel1
  - number: '1.3'
    text: |-
      De belanghebbende, die als gevolg van een ontslag uit de militaire dienst, onderscheidenlijk de burgerlijke
      openbare dienst, bedoeld in het tweede lid, onder *a*, 1°, of de vervangende dienst, bedoeld in dat lid, onder *a*,
      2°, niet of niet langer voldoet aan de omschrijving van belanghebbende in het eerste of tweede lid, blijft voor de
      toepassing van deze wet nochtans als belanghebbende aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel1
  - number: '1.4'
    text: Geen belanghebbende in de zin van deze wet is de persoon die op of na 29 december 2005 arbeidsongeschikt wordt.
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel1
  - number: '2.1'
    text: |-
      Waar in deze wet of in de tot haar uitvoering genomen besluiten, wordt gesproken van "aanspraken krachtens een
      andere wettelijke regeling",
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel2
  - number: 2.1.a
    text: 'worden daaronder begrepen:'
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel2
  - number: 2.1.a.1°
    text: |-
      voorschriften inzake de doorbetaling van loon bij ziekte aan werknemers van bij de Stichting Pensioenfonds ABP
      aangesloten privaatrechtelijke lichamen;
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel2
  - number: 2.1.a.2°
    text: |-
      aanspraken krachtens een andere wettelijke regeling, indien deze door toedoen van de belanghebbende of in verband
      met het doormaken van wachtdagen niet kunnen worden geldend gemaakt;
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel2
  - number: 2.1.b
    text: 'worden daaronder niet begrepen:'
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel2
  - number: 2.1.b.1°
    text: |-
      aanspraken op een bijzondere invaliditeitsverhoging volgens de daarover bij of krachtens de
      [Kaderwet militaire pensioenen][ref1] vastgestelde bepalingen;


      [ref1]: https://wetten.overheid.nl/BWBR0011955
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011955
  - number: 2.1.b.2°
    text: |-
      aanspraken krachtens de [Wet werk en bijstand][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015703
  - number: '2.2'
    text: |-
      Een invaliditeitspensioen en een invaliditeitsverhoging waarop aanspraak bestaat volgens de daarover bij of
      krachtens de [Kaderwet militaire pensioenen][ref1] vastgestelde bepalingen wordt aangemerkt als te zijn verleend
      ter zake van arbeidsongeschiktheid in de zin van deze wet, tenzij de aanspraak op dat pensioen of die verhoging
      bestaat ter zake van ziekten of gebreken welke door duidelijk andere oorzaken zijn bepaald dan die welke bepalend
      zijn voor de mate van arbeidsongeschiktheid ter zake waarvan recht op uitkering krachtens deze wet bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0011955
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011955
  - number: '2.3'
    text: |-
      Arbeidsongeschiktheid, die bestaat op de dag, waarop het verblijf in werkelijke dienst eindigt, wordt geacht op die
      dag te zijn aangevangen.
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel2
  - number: '2.4'
    text: |-
      Het tweede lid is niet van toepassing indien het recht op pensioen of de verhoging wordt ontleend aan een
      periode van werkelijke dienst die is geëindigd met ingang van een op of na 1 januari 1998 gelegen datum, waarop
      de gebeurtenis heeft plaatsgevonden op grond waarvan de aanspraak op het invaliditeitspensioen, dan wel de
      invaliditeitsverhoging, is ontstaan.
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel2
  - number: '3.1'
    text: |-
      De belanghebbende, die op de dag, waarop zijn verblijf in werkelijke dienst eindigt, arbeidsongeschikt is of binnen
      een maand na die dag arbeidsongeschikt wordt, heeft, overeenkomstig hetgeen bij of krachtens deze wet is bepaald,
      met betrekking tot zijn arbeidsongeschiktheid recht op dezelfde ziekengelduitkering als die, waarop krachtens
      de [Ziektewet][ref1] aanspraak zou bestaan, indien hij onmiddellijk voorafgaande aan zijn arbeidsongeschiktheid
      verzekerde in de zin van die wet zou zijn geweest, evenwel slechts indien en voor zover hij ter zake van die
      arbeidsongeschiktheid geen aanspraken krachtens een andere wettelijke regeling kan doen gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '3.2'
    text: |-
      Het in het vorige lid omschreven recht heeft eveneens de belanghebbende, die arbeidsongeschikt wordt nadat sedert
      de dag, waarop zijn verblijf in werkelijke dienst eindigde, meer dan een maand is verstreken, evenwel slechts
      indien en voor zover hij ter zake van die arbeidsongeschiktheid geen aanspraken krachtens een andere wettelijke
      regeling kan doen gelden en dit, naar het oordeel van Onze Minister van Defensie, zijn oorzaak vindt in het
      verblijf in werkelijke dienst.
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel3
  - number: '4'
    text: De ziekengelduitkering gaat in op de dag, waarop de arbeidsongeschiktheid is aangevangen.
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel4
  - number: '5.1'
    text: |-
      De belanghebbende, die op de dag, waarop zijn verblijf in werkelijke dienst eindigt, arbeidsongeschikt is of binnen
      een maand na die dag arbeidsongeschikt wordt, heeft, overeenkomstig hetgeen bij of krachtens deze wet is bepaald,
      met betrekking tot zijn arbeidsongeschiktheid of de toeneming van de arbeidsongeschiktheid recht op dezelfde
      uitkeringen als die, waarop krachtens de [Wet op de arbeidsongeschiktheidsverzekering][ref1] aanspraak zou bestaan,
      indien hij onmiddellijk voorafgaande aan zijn arbeidsongeschiktheid verzekerde in de zin van die wet zou zijn
      geweest, evenwel slechts indien en voor zover hij ter zake van die arbeidsongeschiktheid onderscheidenlijk die
      toeneming van de arbeidsongeschiktheid geen aanspraken krachtens een andere wettelijke regeling kan doen gelden.
      [Hoofdstuk IIA van de Wet op de arbeidsongeschiktheidsverzekering][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0002524#HoofdstukIIA
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0002524
        hoofdstuk: IIA
  - number: '5.2'
    text: |-
      Het in het vorige lid omschreven recht heeft eveneens de belanghebbende, die arbeidsongeschikt wordt nadat sedert
      de dag, waarop zijn verblijf in werkelijke dienst eindigde, meer dan een maand is verstreken, evenwel slechts
      indien en voor zover hij ter zake van zijn arbeidsongeschiktheid of de toeneming van zijn arbeidsongeschiktheid
      geen aanspraken krachtens een andere wettelijke regeling kan doen gelden en dit, naar het oordeel van Onze Minister
      van Defensie, zijn oorzaak vindt in het verblijf in werkelijke dienst.
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel5
  - number: 5a.1
    text: |-
      De [artikelen 21][ref1], [22][ref2], [40][ref3], [48][ref4], [53][ref5] en [59][ref6], zoals die artikelen luidden
      op de dag voorafgaande aan die waarop de [Wet terugdringing beroep op de arbeidsongeschiktheidsregelingen][ref7] in
      werking is getreden, blijven van toepassing op de belanghebbende, bedoeld in [artikel 5][ref8]. De artikelen 21 en
      21 zijn niet van toepassing op de in [artikel 5][ref9] bedoelde belanghebbende.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel40
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel48
      [ref5]: https://wetten.overheid.nl/BWBR0002524#Artikel53
      [ref6]: https://wetten.overheid.nl/BWBR0002524#Artikel59b
      [ref7]: https://wetten.overheid.nl/BWBR0006072
      [ref8]: https://wetten.overheid.nl/BWBR0002822#Artikel5
      [ref9]: https://wetten.overheid.nl/BWBR0002822#Artikel5
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '22'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '40'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: '48'
      - id: ref5
        bwb_id: BWBR0002524
        artikel: '53'
      - id: ref6
        bwb_id: BWBR0002524
        artikel: 59b
      - id: ref7
        bwb_id: BWBR0006072
      - id: ref8
        bwb_id: BWBR0002822
        artikel: '5'
        hoofdstuk: III
      - id: ref9
        bwb_id: BWBR0002822
        artikel: '5'
        hoofdstuk: III
  - number: 5a.2
    text: |-
      In afwijking van het eerste lid is
      [artikel 21, vierde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1], zoals dat artikel luidt na de
      inwerkingtreding van de [Wet terugdringing beroep op de arbeidsongeschiktheidsregelingen][ref2], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0006072
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0006072
  - number: '6.1'
    text: |-
      Het uitvoeringsorgaan houdt op de uitkering ingevolge deze wet en de toeslag op deze uitkering ingevolge de
      [Toeslagenwet][ref1] een bedrag in, dat gelijk is aan het bedrag van de premie die een werkgever op grond van
      [afdeling 2 van hoofdstuk 3 van de Wet financiering sociale verzekeringen][ref2], op het overeenkomstige loon van
      een werknemer die verzekerd is op grond van de [Werkloosheidswet][ref3], inhoudt.


      [ref1]: https://wetten.overheid.nl/BWBR0004043
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Afdeling2
      [ref3]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004043
      - id: ref2
        bwb_id: BWBR0017745
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0004045
  - number: '6.2'
    text: |-
      Indien ingevolge de [Wet financiering sociale verzekeringen][ref1] een premie wordt ingehouden waarvan het
      percentage per bedrijfstak verschilt, wordt met inachtneming van bij algemene maatregel van bestuur te stellen
      regels bij ministeriële regeling voor de toepassing van het eerste lid een gemiddeld percentage vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0017745
  - number: '6.3'
    text: De op grond van het eerste lid in te houden bedragen komen ten bate van ’s Rijks kas.
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel6
  - number: '7'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], is belast met de uitvoering van
      deze wet, voorzover die uitvoering niet krachtens deze wet aan anderen is opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0002822/2012-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: '8'
    text: |-
      De bepalingen betreffende de verplichte verzekering ingevolge de [Ziektewet][ref1]
      en de [Wet op de arbeidsongeschiktheidsverzekering][ref2], de bepalingen van de
      [Wet structuur uitvoeringsorganisatie werk en inkomen][ref3] en van de [Wet financiering sociale verzekeringen][ref4]
      alsmede van de [afdelingen II][ref5] en [III][ref6] van [hoofdstuk III][ref7] en van
      [afdeling II van hoofdstuk IV van de Invoeringswet stelselherziening sociale zekerheid][ref8] en de
      uitvoeringsbesluiten van genoemde wetten zijn, met inachtneming van de wijzigingen, die de aard van het onderwerp
      vordert, voor zoveel nodig van overeenkomstige toepassing, voor zover daarvan in hetgeen bij of krachtens deze wet
      is bepaald, niet is afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0013060
      [ref4]: https://wetten.overheid.nl/BWBR0017745
      [ref5]: https://wetten.overheid.nl/BWBR0004046#AfdelingII
      [ref6]: https://wetten.overheid.nl/BWBR0004046#AfdelingIII
      [ref7]: https://wetten.overheid.nl/BWBR0004046#HoofdstukIII
      [ref8]: https://wetten.overheid.nl/BWBR0004046#AfdelingII
