$id: wet_op_de_parlementaire_enquete_2008
regulatory_layer: WET
publication_date: '2016-07-21'
valid_from: '2020-05-21'
bwb_id: BWBR0023825
url: https://wetten.overheid.nl/BWBR0023825/2020-05-21
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, mede gelet op artikel 70 van de Grondwet, wenselijk is de huidige
    Wet op de Parlementaire Enquête te moderniseren en te vervangen door een nieuwe Wet op de parlementaire enquête,
    onder meer met het oog op de uitbreiding en verduidelijking van de bevoegdheden van de enquêtecommissie en met
    het oog op de verbetering en verduidelijking van de positie van personen die verplicht zijn tot medewerking
    aan een parlementaire enquête, de samenloop met ander onderzoek en de regeling van de openbaarheid dan wel
    vertrouwelijkheid bij een parlementaire enquête;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel1
  - number: 1.1.a
    text: 'Kamer: Eerste Kamer, Tweede Kamer of de verenigde vergadering der Staten-Generaal;'
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel1
  - number: 1.1.b
    text: |-
      commissie: commissie als bedoeld in [artikel 2, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023825#Artikel2
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0023825
        artikel: '2'
        hoofdstuk: '2'
  - number: 1.1.c
    text: 'document: schriftelijk stuk of ander materiaal dat gegevens bevat.'
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel1
  - number: '1.2'
    text: |-
      In deze wet wordt mede verstaan onder ambtenaar: de ambtenaar als bedoeld in
      [artikel 1, eerste lid, onderdeel a, van de Wet ambtenaren defensie][ref1] en de dienstplichtige als bedoeld in
      [artikel 1, eerste lid, onderdeel b, van de Kaderwet dienstplicht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008589#Artikel1
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001952
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0008589
        artikel: '1'
  - number: '2.1'
    text: De Kamer kan op voorstel van één of meer leden besluiten een parlementaire enquête te houden.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel2
  - number: '2.2'
    text: Een parlementaire enquête wordt uitgevoerd door een commissie van de Kamer.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel2
  - number: '2.3'
    text: |-
      Het besluit tot het houden van een parlementaire enquête bevat een omschrijving van het onderwerp waarop de
      parlementaire enquête betrekking zal hebben. De Kamer kan, al dan niet op voorstel van de commissie die de
      parlementaire enquête verricht, de omschrijving wijzigen.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel2
  - number: '2.4'
    text: |-
      De Kamer benoemt de leden van de commissie uit haar midden. De Kamer kan een lid van de commissie, al dan niet op
      zijn verzoek, in zijn hoedanigheid van lid van de commissie ontslaan.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel2
  - number: '2.5'
    text: De voorzitter van de Kamer doet van de besluiten, bedoeld in dit artikel, mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel2
  - number: '3.1'
    text: |-
      De Kamer stelt de raming op van de uitgaven, uitgesplitst naar begrotingsjaren, die naar haar oordeel voor
      een parlementaire enquête nodig zijn, en brengt deze ter kennis van Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel3
  - number: '3.2'
    text: |-
      De uitgaven worden verwerkt in de begroting van de Staten-Generaal, bedoeld in
      [artikel 4.5 van de Comptabiliteitswet 2016][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel4
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '4'
  - number: '4.1'
    text: |-
      De commissie kan de haar bij deze wet verleende bevoegdheden uitoefenen met ingang van de dag na de dagtekening van
      de Staatscourant waarin het besluit tot het houden van een parlementaire enquête bekend is gemaakt tot de dag met
      ingang waarvan de enquête door de Kamer wordt beëindigd.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel4
  - number: '4.2'
    text: |-
      De commissie oefent de haar bij deze wet verleende bevoegdheden slechts uit voor zover dat naar het redelijk
      oordeel van de commissie voor de vervulling van haar taak nodig is.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel4
  - number: '4.3'
    text: |-
      De bevoegdheden en werkzaamheden van de commissie worden niet beëindigd door het verstrijken van de zittingsduur of
      de ontbinding van de Kamer.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel4
  - number: '4.4'
    text: |-
      De commissie kan persoonsgegevens, waaronder tevens worden begrepen gegevens betreffende de gezondheid en
      justitiële en strafvorderlijke gegevens, verwerken.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel4
  - number: '5.1'
    text: De commissie kan schriftelijke inlichtingen vorderen.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel5
  - number: '5.2'
    text: De commissie kan de wijze waarop de schriftelijke inlichtingen worden verstrekt bepalen.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel5
  - number: '6.1'
    text: De commissie kan afschrift van, inzage in of kennisneming van documenten vorderen.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel6
  - number: '6.2'
    text: |-
      De commissie kan bepalen op welke wijze afschriften worden verstrekt, inzage wordt gegeven onderscheidenlijk
      kennisneming wordt verleend.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel6
  - number: '7.1'
    text: |-
      De commissie kan, zonder toestemming van de rechthebbende, met de door haar aangewezen personen elke plaats in
      Nederland, daaronder begrepen de openbare lichamen Bonaire, Sint Eustatius en Saba, betreden.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel7
  - number: '7.2'
    text: |-
      In afwijking van het eerste lid is voor het betreden van woningen toestemming van de bewoner of een
      machtiging vereist. In afwijking van [artikel 3 van de Algemene wet op het binnentreden][ref1] is
      de voorzieningenrechter van de rechtbank Den Haag bevoegd tot het verlenen van de machtiging. De
      [artikelen 25, eerste lid, tweede volzin, tot en met 27][ref2] zijn van toepassing op de verlening van de
      machtiging.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0023825#Artikel25
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0023825
        artikel: '25'
        hoofdstuk: '5'
  - number: '7.3'
    text: |-
      De commissie geeft, voor zover dit niet in strijd is met het belang van de parlementaire enquête, schriftelijk
      kennis aan de rechthebbende van een plaats van een voornemen een plaats te betreden. Indien sprake is van verhuur,
      dan wordt de kennisgeving gegeven aan de huurder.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel7
  - number: '7.4'
    text: |-
      De leden van de commissie en de door haar aangewezen personen dragen bij het betreden van de plaats een
      legitimatiebewijs bij zich, dat is uitgegeven door de voorzitter van de Kamer. Zij tonen het legitimatiebewijs
      desgevraagd aanstonds.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel7
  - number: '7.5'
    text: De commissie maakt een schriftelijk verslag op van het betreden van een plaats.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel7
  - number: '7.6'
    text: |-
      Voor de toepassing van dit artikel is de [Algemene wet op het binnentreden][ref1] tevens van toepassing in de
      openbare lichamen Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0006763
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006763
  - number: '8.1'
    text: De commissie kan een besloten voorgesprek houden met personen die zij mogelijk als getuige of deskundige zal horen.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel8
  - number: '8.2'
    text: |-
      Niemand is verplicht om medewerking te verlenen aan een voorgesprek. [Artikel 14][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023825#Artikel14
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0023825
        artikel: '14'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '8.3'
    text: De leden van de commissie bewaren geheimhouding over hetgeen hun tijdens het voorgesprek ter kennis komt.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel8
  - number: '8.4'
    text: |-
      Hetgeen een persoon met wie de commissie een voorgesprek heeft gehouden of zijn bijstandsverlener, tijdens het
      voorgesprek ter kennis komt, wordt niet openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel8
  - number: '8.5'
    text: Van het voorgesprek worden een vertrouwelijke geluidsregistratie en een vertrouwelijk verslag gemaakt.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel8
  - number: '9.1'
    text: De commissie kan personen als getuige of deskundige horen.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel9
  - number: '9.2'
    text: De commissie kan een getuige of deskundige uitsluitend horen, indien ten minste drie leden aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel9
  - number: 9a.1
    text: |-
      De commissie kan bij het college van burgemeester en wethouders van de gemeente ’s-Gravenhage dan wel, indien het
      niet-ingezetenen betreft, bij de Minister van Binnenlandse Zaken en Koninkrijksrelaties een verzoek indienen tot
      het verstrekken van adresgegevens van:
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel9a
  - number: 9a.1.a
    text: personen met wie zij een voorgesprek wenst;
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel9a
  - number: 9a.1.b
    text: getuigen, of
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel9a
  - number: 9a.1.c
    text: deskundigen.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel9a
  - number: 9a.2
    text: |-
      [Artikel 3.5, eerste en tweede lid, van de Wet basisregistratie personen][ref1] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
  - number: '10.1'
    text: |-
      De voorzitter van de commissie roept een persoon die zij als getuige of deskundige wil horen bij aangetekende
      brief op, hetzij in persoon, hetzij op de woonplaats, hetzij op het werkadres van de persoon. De voorzitter kan de
      oproeping bij deurwaardersexploot doen betekenen.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel10
  - number: '10.2'
    text: Het verhoor vindt niet eerder plaats dan op de achtste dag na de ontvangst van de oproeping.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel10
  - number: '10.3'
    text: |-
      De oproeping maakt melding van dag, uur en plaats van het verhoor, van de feiten waaromtrent informatie wordt
      verlangd en van de gevolgen, verbonden aan het niet verschijnen op het verhoor.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel10
  - number: '10.4'
    text: |-
      In afwijking van het tweede lid kan de commissie bepalen dat het verhoor eerder plaats vindt dan op de achtste dag
      na ontvangst van de oproeping, indien:
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel10
  - number: 10.4.a
    text: |-
      naar het redelijk oordeel van de commissie in het belang van de parlementaire enquête een verhoor op een kortere
      termijn nodig is, of
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel10
  - number: 10.4.b
    text: de betrokken getuige of deskundige met een kortere termijn instemt.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel10
  - number: '11.1'
    text: Een getuige of deskundige wordt in een openbare zitting van de commissie gehoord.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel11
  - number: '11.2'
    text: |-
      De commissie kan, al dan niet op verzoek van de getuige of deskundige, om gewichtige redenen besluiten dat van een
      openbare zitting geen beeld- of geluidsregistraties door derden mogen worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel11
  - number: '11.3'
    text: Van een openbare zitting worden een geluidsregistratie en een openbaar verslag gemaakt.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel11
  - number: '12.1'
    text: |-
      De commissie kan, al dan niet op verzoek van de getuige of deskundige, om gewichtige redenen besluiten een verhoor
      of een gedeelte daarvan in een besloten zitting van de commissie af te nemen.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel12
  - number: '12.2'
    text: De leden van de commissie bewaren geheimhouding over hetgeen hun tijdens de besloten zitting ter kennis komt.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel12
  - number: '12.3'
    text: Van een besloten zitting worden een vertrouwelijke geluidsregistratie en een vertrouwelijk verslag gemaakt.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel12
  - number: '13.1'
    text: |-
      Voorafgaande aan het verhoor legt een getuige, mits deze de leeftijd van zestien jaar heeft bereikt, in handen van
      de voorzitter de eed of de belofte af dat hij de gehele waarheid en niets dan de waarheid zal zeggen, tenzij de
      commissie besluit het verhoor zonder voorafgaande eed of belofte te doen plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel13
  - number: '13.2'
    text: |-
      Voorafgaand aan het verhoor legt een deskundige in handen van de voorzitter de eed of de belofte af dat hij zijn
      verslag onpartijdig en naar beste weten zal uitbrengen.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel13
  - number: '14.1'
    text: |-
      Elke Nederlander, elke ingezetene van Nederland, elke natuurlijke persoon die in Nederland verblijf houdt,
      elke rechtspersoon die in Nederland is gevestigd en elke rechtspersoon die haar bedrijfsactiviteiten geheel
      of gedeeltelijk in Nederland uitoefent, is verplicht de commissie binnen de door haar gestelde termijn alle
      medewerking te verlenen die deze vordert bij de uitoefening van de haar bij deze wet verleende bevoegdheden,
      behoudens de mogelijkheid van verschoning overeenkomstig de [artikelen 19 tot en met 24][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023825#Artikel19
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0023825
        artikel: '19'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '14.2'
    text: 'In dit artikel worden onder Nederland mede begrepen: de openbare lichamen Bonaire, Sint Eustatius en Saba.'
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel14
  - number: '14.3'
    text: |-
      Voor de toepassing van het eerste lid worden zij die als ingezetene zijn ingeschreven in de basisregistratie
      personen of in de basisadministratie persoonsgegevens van een van de openbare lichamen Bonaire, Sint Eustatius of
      Saba, geacht ingezetene van Nederland te zijn.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel14
  - number: '15.1'
    text: |-
      De verplichting tot medewerking geldt eveneens voor degene voor wie een verplichting tot geheimhouding geldt,
      ook indien deze verplichting bij wet is opgelegd, behoudens de mogelijkheid van verschoning overeenkomstig de
      [artikelen 19 tot en met 24][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023825#Artikel19
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0023825
        artikel: '19'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '15.2'
    text: |-
      Degene die bij wet verplicht is tot geheimhouding en ten behoeve van een ander werkzaam is of is geweest, is
      slechts verplicht tot medewerking voor zover de persoon ten behoeve van wie hij werkzaam is of is geweest, hem op
      vordering van de commissie schriftelijk van de verplichting tot geheimhouding heeft ontheven. Indien de commissie
      ontheffing van de geheimhoudingsverplichting vordert, is de persoon ten behoeve van wie hij werkzaam is of is
      geweest, verplicht deze ontheffing te verlenen, behoudens de mogelijkheid van verschoning overeenkomstig de
      [artikelen 19 tot en met 24][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023825#Artikel19
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0023825
        artikel: '19'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '16.1'
    text: |-
      Een gewezen minister of gewezen staatssecretaris verleent ten aanzien van informatie die betrekking heeft op
      de periode van zijn ambtsvervulling uitsluitend door tussenkomst van Onze Minister-President medewerking aan
      vorderingen van de commissie als bedoeld in [artikel 5][ref1] of [6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023825#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0023825#Artikel6
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0023825
        artikel: '5'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0023825
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '16.2'
    text: |-
      Een ambtenaar die ten behoeve van een minister werkzaam is of is geweest, verleent ten aanzien van informatie die
      betrekking heeft op de periode van zijn ambtsvervulling uitsluitend door tussenkomst van Onze Minister wie het
      aangaat medewerking aan een vordering van de commissie als bedoeld in [artikel 5][ref1] of [6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023825#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0023825#Artikel6
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0023825
        artikel: '5'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0023825
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '17.1'
    text: Een ieder kan zich in het verkeer met de commissie doen bijstaan.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel17
  - number: '17.2'
    text: |-
      De commissie kan om gewichtige redenen besluiten dat iemand zich tijdens een voorgesprek of een verhoor niet mag
      laten bijstaan.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel17
  - number: '17.3'
    text: De commissie stelt de betrokkene onverwijld van een weigering in kennis.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel17
  - number: '18'
    text: |-
      Voor een vergoeding van de commissie overeenkomstig het krachtens
      [artikel 26 van de Wet griffierechten burgerlijke zaken][ref1] bepaalde komen in aanmerking:


      [ref1]: https://wetten.overheid.nl/BWBR0028899#Artikel26
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028899
        artikel: '26'
  - number: 18.a
    text: personen met wie de commissie een voorgesprek heeft gehouden, en
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel18
  - number: 18.b
    text: personen die de commissie heeft gehoord.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel18
  - number: '19.1'
    text: |-
      Een minister, een gewezen minister, een staatssecretaris, een gewezen staatssecretaris, een lid of bestuurder
      van een tot de staat behorend orgaan, een gewezen lid of bestuurder van een tot de staat behorend orgaan en een
      ambtenaar, werkzaam of werkzaam geweest ten behoeve van een tot de staat behorend orgaan, zijn niet verplicht
      informatie aan de commissie te verstrekken, voor zover deze verstrekking in strijd met het belang van de staat is.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel19
  - number: '19.2'
    text: |-
      Indien een staatssecretaris, een lid of bestuurder van een tot de staat behorend orgaan, een gewezen lid of
      bestuurder van een tot de staat behorend orgaan of een ambtenaar, werkzaam of werkzaam geweest ten behoeve van
      een tot de staat behorend orgaan, zich beroept op het belang van de staat, kan de commissie verlangen dat de
      gegrondheid van zijn beroep op verschoning wordt bevestigd door Onze Minister wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel19
  - number: '19.3'
    text: |-
      Indien een gewezen minister of gewezen staatssecretaris zich beroept op het belang van de staat ten aanzien
      van informatie die betrekking heeft op de periode van zijn ambtsvervulling, kan de commissie verlangen dat de
      gegrondheid van zijn beroep op verschoning wordt bevestigd door Onze Minister-President.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel19
  - number: '20.1'
    text: |-
      Een minister, een gewezen minister, een staatssecretaris, een gewezen staatssecretaris en een ambtenaar die ten
      behoeve van een minister werkzaam is of is geweest, zijn niet verplicht informatie aan de commissie te verstrekken
      over de beraadslagingen in een vergadering van de ministerraad. Een ambtenaar die ten behoeve van een minister
      werkzaam is of is geweest, is evenmin verplicht informatie aan de commissie te verstrekken over de in een
      vergadering van de ministerraad genomen beslissingen en de gronden waarop zij berusten.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel20
  - number: '20.2'
    text: |-
      Onverminderd [artikel 19][ref1], verstrekt een minister, een gewezen minister, een staatssecretaris of een gewezen
      staatssecretaris aan de commissie op haar vordering informatie over de in die vergadering genomen beslissingen en
      de gronden waarop zij berusten. Voor zover deze informatie schriftelijk wordt verlangd, geschiedt dit door Onze
      Minister-President.


      [ref1]: https://wetten.overheid.nl/BWBR0023825#Artikel19
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0023825
        artikel: '19'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '21.1'
    text: |-
      Niemand is verplicht informatie aan de commissie te verstrekken, voor zover het informatie betreft over de
      beraadslagingen in een vergadering van een college en bij wet een verplichting tot geheimhouding over die
      beraadslagingen is opgelegd.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel21
  - number: '21.2'
    text: |-
      Het college dat het betreft kan op verzoek van de commissie besluiten ontheffing te verlenen van de
      geheimhoudingsverplichting.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel21
  - number: '21.3'
    text: |-
      Het tweede lid is niet van toepassing ten aanzien van een gerechtelijke raadkamer of de Afdeling
      bestuursrechtspraak van de Raad van State.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel21
  - number: '22'
    text: |-
      Niemand is verplicht informatie aan de commissie te verstrekken, voor zover deze informatie geheime bedrijfs- en
      fabricagegegevens of anderszins bedrijfsvertrouwelijke en concurrentiegevoelige informatie van een onderneming
      betreft en het belang van informatieverkrijging door de commissie niet opweegt tegen het belang van de
      vertrouwelijkheid van deze informatie.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel22
  - number: '23'
    text: |-
      Niemand is verplicht informatie aan de commissie te verstrekken, voor zover deze informatie de persoonlijke
      levenssfeer betreft en het belang van informatieverkrijging door de commissie niet opweegt tegen het belang van de
      bescherming van de persoonlijke levenssfeer.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel23
  - number: '24'
    text: |-
      Niemand is verplicht informatie aan de commissie te verstrekken, voor zover hij uit hoofde van zijn ambt of beroep
      tot geheimhouding verplicht is en het informatie betreft die aan hem in die hoedanigheid is toevertrouwd.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel24
  - number: 24a
    text: |-
      Indien een persoon van wie informatie wordt gevorderd zich genoodzaakt ziet de gevorderde informatie te weigeren op
      grond van een van de verschoningsgronden genoemd in de [artikelen 19 tot en met 24][ref1], verstrekt hij bij zijn
      weigering een deugdelijke motivering.


      [ref1]: https://wetten.overheid.nl/BWBR0023825#Artikel19
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0023825
        artikel: '19'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '25.1'
    text: |-
      De voorzieningenrechter van de rechtbank Den Haag kan op verzoek van de commissie een persoon die weigert haar
      medewerking te verlenen bij de uitoefening van de haar bij deze wet verleende bevoegdheden bevelen deze medewerking
      alsnog te verlenen. Het verzoek wordt ingeleid bij verzoekschrift.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel25
  - number: '25.2'
    text: Het verzoek van de commissie vermeldt welke medewerking van de betrokken persoon wordt verlangd.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel25
  - number: '25.3'
    text: |-
      De voorzieningenrechter doet uitspraak uiterlijk op de zevende dag nadat hij het verzoek heeft ontvangen, tenzij de
      commissie hem heeft verzocht onverwijld uitspraak te doen.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel25
  - number: '25.4'
    text: 'De voorzieningenrechter wijst het verzoek toe, tenzij:'
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel25
  - number: 25.4.a
    text: het verzoek niet berust op de wet;
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel25
  - number: 25.4.b
    text: de betrokken persoon een wettelijke grond tot weigering heeft, of
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel25
  - number: 25.4.c
    text: |-
      de commissie in redelijkheid niet tot haar oordeel kan komen dat de verlangde medewerking nodig is voor de
      vervulling van haar taak.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel25
  - number: '25.6'
    text: De uitspraak van de voorzieningenrechter is uitvoerbaar bij voorraad.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel25
  - number: '26'
    text: |-
      De voorzieningenrechter kan op verzoek van de commissie aan een bevel als bedoeld
      in [artikel 25, eerste lid][ref1], een dwangsom verbinden. De derde afdeling van de
      [vijfde titel van Boek 2 van het Wetboek van Burgerlijke Rechtsvordering][ref2] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023825#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0023825
        artikel: '25'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0001827
  - number: '27'
    text: |-
      De voorzieningenrechter kan op verzoek van de commissie bepalen, dat een bevel als bedoeld in
      [artikel 25, eerste lid][ref1], met ondersteuning van de openbare macht ten uitvoer kan worden gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0023825#Artikel25
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0023825
        artikel: '25'
        hoofdstuk: '5'
  - number: '28.1'
    text: |-
      Indien een getuige of deskundige voor de commissie is verschenen, maar zonder wettelijke grond weigert zijn
      verklaring af te leggen, kan de voorzieningenrechter van de rechtbank Den Haag op verzoek van de commissie bevelen
      dat hij op kosten van de staat in gijzeling zal worden gesteld totdat hij aan zijn verplichting zal hebben voldaan.
      Het verzoek wordt ingeleid bij verzoekschrift.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel28
  - number: '28.2'
    text: De commissie kan het verzoek indienen zonder de bijstand van een advocaat.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel28
  - number: '28.3'
    text: |-
      De commissie kan de getuige of deskundige in bewaring houden totdat de voorzieningenrechter uitspraak heeft gedaan.
      Zij kan daarbij de ondersteuning van de openbare macht inroepen.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel28
  - number: '28.4'
    text: De voorzieningenrechter doet onverwijld, doch uiterlijk binnen drie dagen na ontvangst van het verzoek uitspraak.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel28
  - number: '28.5'
    text: 'De voorzieningenrechter wijst een verzoek als bedoeld in dit artikel toe, tenzij:'
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel28
  - number: 28.5.a
    text: de getuige of deskundige een wettelijke grond tot weigering heeft of
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel28
  - number: 28.5.b
    text: |-
      de commissie in redelijkheid niet tot haar oordeel kan komen dat de gijzeling nodig is voor de vervulling van haar
      taak.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel28
  - number: '28.6'
    text: De uitspraak van de voorzieningenrechter is uitvoerbaar bij voorraad.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel28
  - number: '28.7'
    text: |-
      Gedurende de bewaring en de gijzeling kan de getuige of deskundige zich beraden met een advocaat. De advocaat
      heeft vrije toegang tot de getuige of deskundige, kan hem alleen spreken en met hem brieven wisselen zonder dat
      van de inhoud door anderen wordt kennisgenomen, een en ander onder het vereiste toezicht en met inachtneming van de
      huishoudelijke reglementen.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel28
  - number: '28.8'
    text: |-
      De gijzeling kan ten hoogste dertig dagen duren. De voorzieningenrechter beëindigt ambtshalve, op verzoek van de
      commissie of op verzoek van de getuige of deskundige de gijzeling indien voortzetting ervan naar zijn oordeel niet
      meer door het belang dat met de toepassing van de gijzeling werd gediend, wordt gerechtvaardigd, of hem blijkt dat
      de getuige of deskundige een wettige grond tot weigering heeft.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel28
  - number: '29'
    text: Dit hoofdstuk is niet van toepassing op een lid van de Kamer, een minister of een staatssecretaris.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel29
  - number: '30'
    text: |-
      In een civielrechtelijke, strafrechtelijke, bestuursrechtelijke of tuchtrechtelijke procedure kunnen verklaringen
      en documenten die op vordering van de commissie zijn afgelegd onderscheidenlijk verstrekt, niet als bewijs worden
      gebruikt behoudens de uitzonderingen, bedoeld in [artikel 32, eerste lid][ref1]. Evenmin kan op zulke verklaringen
      en documenten een disciplinaire maatregel, een bestuurlijke sanctie of een bestuurlijke maatregel worden gebaseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0023825#Artikel32
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0023825
        artikel: '32'
        hoofdstuk: '6'
  - number: '31.1'
    text: |-
      De commissie verstrekt geen informatie aan andere personen of organen ten behoeve van een strafrechtelijk,
      tuchtrechtelijke of civielrechtelijke procedure of een procedure tot oplegging van een disciplinaire maatregel,
      een bestuurlijke sanctie of een bestuurlijke maatregel, ook niet indien de commissie of het lid op grond van een
      wettelijk voorschrift tot het verstrekken van informatie is verplicht.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel31
  - number: '31.2'
    text: |-
      In afwijking van het eerste lid verstrekt de commissie informatie aan andere personen of organen indien degene die
      de informatie heeft verstrekt en degene op wie de informatie betrekking heeft, daarvoor schriftelijk toestemming
      hebben verleend.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel31
  - number: '32.1'
    text: |-
      In afwijking van [artikel 30][ref1] kunnen verklaringen en documenten die in het kader van een parlementaire
      enquête zijn afgelegd onderscheidenlijk verstrekt als bewijs worden gebruikt in een strafrechtelijke procedure naar
      meineed, naar omkoping van een getuige of deskundige bij een parlementaire enquête of naar de delicten, bedoeld
      in de [artikelen 192 tot en met 192c van het Wetboek van Strafrecht][ref2], dan wel de delicten, bedoeld in de
      artikelen 198 tot en met 198c van het Wetboek van Strafrecht BES.


      [ref1]: https://wetten.overheid.nl/BWBR0023825#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel192
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0023825
        artikel: '30'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '192'
  - number: '32.2'
    text: |-
      In afwijking van [artikel 31][ref1] verstrekt de commissie aan het openbaar ministerie ten behoeve van een
      strafrechtelijk onderzoek naar meineed, naar omkoping van een getuige of deskundige bij een parlementaire enquête
      of naar de delicten, bedoeld in de [artikelen 192 tot en met 192c van het Wetboek van Strafrecht][ref2] dan wel
      de delicten, bedoeld in de artikelen 198 tot en met 198c van het Wetboek van Strafrecht BES, de informatie die
      redelijkerwijs hiervoor nodig is, ook indien het informatie betreft ten aanzien waarvan voor de leden van de
      commissie op grond van deze wet een geheimhoudingsverplichting geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0023825#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel192
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0023825
        artikel: '31'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '192'
  - number: '33'
    text: De commissie legt haar bevindingen vast in een openbaar rapport dat zij aan de Kamer aanbiedt.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel33
  - number: '34.1'
    text: |-
      Nadat de commissie aan de Kamer verantwoording over haar werkzaamheden heeft afgelegd, beëindigt de Kamer de
      enquête.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel34
  - number: '34.2'
    text: De Kamer kan besluiten een parlementaire enquête voortijdig te beëindigen.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel34
  - number: '34.3'
    text: De voorzitter van de Kamer doet van het besluit tot beëindiging van de enquête mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel34
  - number: '35'
    text: 'Met ingang van de dag dat de Kamer de enquête beëindigt, gaan van rechtswege over op de Kamer:'
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel35
  - number: 35.a
    text: de documenten die op vordering aan de commissie zijn verstrekt;
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel35
  - number: 35.b
    text: |-
      de geluidsregistraties, bedoeld in de [artikelen 8][ref1], [11][ref2] en [12][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0023825#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0023825#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0023825#Artikel12
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0023825
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0023825
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0023825
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 35.c
    text: de documenten die zijn opgesteld ten behoeve van intern beraad, en
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel35
  - number: 35.d
    text: andere documenten die de commissie van belang acht.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel35
  - number: '36'
    text: 'Het lidmaatschap van de commissie eindigt op de dag met ingang waarvan:'
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel36
  - number: 36.a
    text: |-
      het lidmaatschap van de Kamer van het betrokken commissielid eindigt en dit lidmaatschap niet terstond opnieuw
      aanvangt;
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel36
  - number: 36.b
    text: het lid van de commissie door de commissie als getuige of deskundige wordt gehoord;
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel36
  - number: 36.c
    text: de enquête door de Kamer wordt beëindigd of
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel36
  - number: 36.d
    text: |-
      het lid van de commissie, al dan niet op zijn verzoek, door de Kamer in zijn hoedanigheid van lid van de commissie
      wordt ontslagen.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel36
  - number: '37.1'
    text: |-
      Onverminderd [artikel 11, derde lid][ref1], heeft niemand tot op de dag waarop de commissie haar rapport aanbiedt
      aan de Kamer recht op inzage in documenten die onder de commissie berusten.


      [ref1]: https://wetten.overheid.nl/BWBR0023825#Artikel11
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0023825
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '37.2'
    text: |-
      De commissie kan getuigen, deskundigen en personen die in opdracht van de commissie werkzaamheden verrichten inzage
      verlenen in documenten die op haar vordering aan de commissie zijn verstrekt. Degenen die de documenten inzien
      bewaren geheimhouding over de inhoud van deze documenten.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel37
  - number: '38.1'
    text: |-
      Met ingang van de dag na de dag waarop de commissie haar rapport aan de Kamer aanbiedt
      kan elk lid van de Kamer de documenten die op vordering van de commissie aan haar
      zijn verstrekt, inzien, behoudens de afschriften die zijn verstrekt op basis van
      [artikel 1:93f van de Wet op het financieel toezicht][ref1], de [artikelen 22a, eerste lid, onderdeel c][ref2]
      en [22b, eerste lid onderdeel d, van de Wet ter voorkoming van witwassen en terrorismefinanciering][ref3] en
      [artikel 58a, eerste lid, onderdeel c, van de Wet toezicht trustkantoren 2018][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel22a
      [ref3]: https://wetten.overheid.nl/BWBR0024282#Artikel22b
      [ref4]: https://wetten.overheid.nl/BWBR0041583#Artikel58a
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: 22a
      - id: ref3
        bwb_id: BWBR0024282
        artikel: 22b
      - id: ref4
        bwb_id: BWBR0041583
        artikel: 58a
  - number: '38.2'
    text: |-
      De leden van de Kamer bewaren geheimhouding over de inhoud van documenten waarin hen inzage is verleend, voor zover
      de commissie op grond van [artikel 40][ref1] beperkingen heeft gesteld aan de openbaarheid.


      [ref1]: https://wetten.overheid.nl/BWBR0023825#Artikel40
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0023825
        artikel: '40'
        hoofdstuk: '8'
  - number: '38.3'
    text: |-
      Met ingang van de dag na de dag waarop de commissie haar rapport aan de Kamer aanbiedt, kan elk lid van de Kamer
      een vertrouwelijk verslag van een besloten verhoor inzien. De leden van de Kamer bewaren geheimhouding over de
      inhoud van het verslag.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel38
  - number: '39.1'
    text: |-
      Een ieder heeft behoudens de beperkingen die de commissie op grond van [artikel 40][ref1] aan de openbaarheid heeft
      gesteld, met ingang van de dag na de dag waarop de commissie haar rapport aanbiedt aan de Kamer recht op inzage
      in de documenten, bedoeld in [artikel 35][ref2]. Dit inzagerecht geldt zolang deze documenten onder de commissie
      onderscheidenlijk de Kamer berusten.


      [ref1]: https://wetten.overheid.nl/BWBR0023825#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0023825#Artikel35
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0023825
        artikel: '40'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0023825
        artikel: '35'
        hoofdstuk: '7'
  - number: '39.2'
    text: |-
      De Kamer kan besluiten een op grond van [artikel 40][ref1] aan de openbaarheid gestelde beperking op te heffen, dan
      wel ten aanzien van een verzoeker, die bij kennisneming een bijzonder belang heeft, buiten toepassing te laten. De
      Kamer kan een verzoeker geheimhouding opleggen over de inhoud van documenten waarin hem inzage is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0023825#Artikel40
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0023825
        artikel: '40'
        hoofdstuk: '8'
  - number: '39.3'
    text: |-
      Het tweede lid is niet van toepassing op vertrouwelijke verslagen en geluidsregistraties van besloten
      voorgesprekken als bedoeld in [artikel 8, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023825#Artikel8
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0023825
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '40.1'
    text: |-
      De commissie kan voor de periode na de dag waarop zij haar rapport aanbiedt aan de Kamer beperkingen stellen
      aan de openbaarheid van documenten die onder de commissie berusten of, nadat deze documenten op grond van
      [artikel 35][ref1] zijn overgegaan op de Kamer, hebben berust. Deze beperkingen gelden zolang de documenten onder
      de commissie onderscheidenlijk de Kamer berusten.


      [ref1]: https://wetten.overheid.nl/BWBR0023825#Artikel35
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0023825
        artikel: '35'
        hoofdstuk: '7'
  - number: '40.2'
    text: 'De commissie stelt beperkingen aan de openbaarheid voor zover:'
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel40
  - number: 40.2.a
    text: de openbaarmaking van het document de eenheid van de Kroon in gevaar zou kunnen brengen;
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel40
  - number: 40.2.b
    text: de openbaarmaking van het document de veiligheid van de staat zou kunnen schaden;
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel40
  - number: 40.2.c
    text: |-
      het document bedrijfs- en fabricagegegevens bevat, die door natuurlijke personen of rechtspersonen vertrouwelijk
      aan de overheid zijn meegedeeld;
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel40
  - number: 40.2.d
    text: |-
      het document persoonsgegevens bevat als bedoeld in de artikelen 9, 10 en 87 van de Algemene verordening
      gegevensbescherming tenzij de openbaarmaking kennelijk geen inbreuk op de persoonlijke levenssfeer maakt of de
      persoon op wie de gegevens betrekking hebben schriftelijk heeft ingestemd met de openbaarmaking;
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel40
  - number: 40.2.e
    text: het document een verslag van een voorgesprek of een besloten verhoor betreft.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel40
  - number: '40.3'
    text: |-
      De commissie kan eveneens beperkingen aan de openbaarheid stellen voor zover het belang van openbaarheid van het
      document niet opweegt tegen de volgende belangen:
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel40
  - number: 40.3.a
    text: de betrekkingen van Nederland met andere staten en met internationale organisaties;
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel40
  - number: 40.3.b
    text: de economische of financiële belangen van de staat;
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel40
  - number: 40.3.c
    text: de opsporing en vervolging van strafbare feiten;
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel40
  - number: 40.3.d
    text: inspectie, controle en toezicht door bestuursorganen;
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel40
  - number: 40.3.e
    text: de eerbiediging van de persoonlijke levenssfeer;
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel40
  - number: 40.3.f
    text: |-
      het voorkomen van onevenredige bevoordeling of benadeling van bij de aangelegenheid betrokken natuurlijke personen
      of rechtspersonen dan wel van derden.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel40
  - number: '40.4'
    text: |-
      De beperkingen aan de openbaarheid kunnen eveneens worden gesteld voor zover het document is opgesteld ten behoeve
      van intern beraad van de commissie.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel40
  - number: '40.5'
    text: |-
      De leden van de commissie bewaren geheimhouding over de inhoud van documenten, voor zover de commissie beperkingen
      heeft gesteld aan de openbaarheid.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel40
  - number: '45'
    text: |-
      Indien op het tijdstip van inwerkingtreding van deze wet de Kamer op grond van de
      [Wet op de Parlementaire Enquête][ref1] een enquête heeft ingesteld, blijft [die wet][ref2] op die enquête van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001841
      [ref2]: https://wetten.overheid.nl/BWBR0001841
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0001841
      - id: ref2
        bwb_id: BWBR0001841
  - number: '46'
    text: |-
      De [Wet op de Parlementaire Enquête][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0001841
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0001841
  - number: '47'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel47
  - number: '48'
    text: |-
      Deze wet wordt aangehaald als: Wet op de parlementaire enquête, met vermelding van het jaartal van het Staatsblad
      waarin zij zal worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0023825/2020-05-21#Artikel48
