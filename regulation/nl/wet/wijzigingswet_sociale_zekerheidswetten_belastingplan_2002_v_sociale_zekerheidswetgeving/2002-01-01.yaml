preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het in het kader van de met het fiscale beleid samenhangende
    wijzigingen in het sociale zekerheidsbeleid voor het jaar 2002 wenselijk is maatregelen te treffen in de sociale
    zekerheidswetgeving;


    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013190/2002-01-01#ArtikelAanhef
articles:
  - number: VIII
    text: Deze wet treedt in werking met ingang van 1 januari 2002.
    url: https://wetten.overheid.nl/BWBR0013190/2002-01-01#ArtikelVIII
