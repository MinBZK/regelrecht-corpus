  text: |-
    Gelet op artikel 8, vierde lid, van het Reïntegratie-instrumentenbesluit Wet REA;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009854/2005-07-07#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:



              a

                *de Wet:*


                [Wet op de (re)integratie arbeidsgehandicapten][ref1];



              b

                *het besluit:*


                het [Reïntegratie-instrumentenbesluit Wet REA][ref2].




      2 Voor de toepassing van deze regeling wordt gelijkgesteld met:



              a
              echtgenoot:

                de geregistreerde partner alsmede de ongehuwde meerderjarige die met een andere ongehuwde meerderjarige
      een gezamenlijke huishouding voert als bedoeld in [artikel 1, vierde en vijfde lid, van de Toeslagenwet][ref3],
      tenzij het betreft een bloedverwant in de eerste graad;



              b
               ongehuwd:

                de persoon die duurzaam gescheiden leeft van de persoon met wie hij gehuwd is.


      [ref1]: https://wetten.overheid.nl/BWBR0009565
      [ref2]: https://wetten.overheid.nl/BWBR0009609
