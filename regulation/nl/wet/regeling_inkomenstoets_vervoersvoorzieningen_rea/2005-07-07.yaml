  - number: '12'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin zij wordt
      geplaatst en werkt terug tot en met 1 juli 1998.
    url: https://wetten.overheid.nl/BWBR0009854/2005-07-07#Artikel12
