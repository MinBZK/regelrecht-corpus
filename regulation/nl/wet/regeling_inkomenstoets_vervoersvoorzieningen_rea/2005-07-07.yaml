    text: |-
      1 Voor de toepassing van [artikel 8, eerste lid][ref1], van het besluit wordt onder inkomen verstaan:

      a. loon in de zin van de [Coördinatiewet Sociale Verzekering][ref2] uit een dienstbetrekking als bedoeld in
      [artikel 3a, eerste lid, van die wet][ref3];

      b. winst uit onderneming als bedoeld in [paragraaf 3.2.1 van de Wet inkomstenbelasting 2001][ref4], vermeerderd
      met de ondernemersaftrek, bedoeld in [paragraaf 3.2.4 van die wet][ref5], alsmede belastbare winst uit Nederlandse
      onderneming als bedoeld in [artikel 7.2 van de Wet inkomstenbelasting 2001][ref6], met uitzondering van de
      bestanddelen van de winst, bedoeld in [artikel 3.78, derde lid, onderdelen a, b en c, van die wet][ref7];

      c. al hetgeen anders dan uit dienstbetrekking in de zin van de [Coördinatiewet Sociale Verzekering][ref8] wordt
      genoten als belastbaar loon uit tegenwoordige arbeid of belastbaar resultaat uit overige werkzaamheden, bedoeld
      in [hoofdstuk 3][ref9] en [7 van de Wet inkomstenbelasting 2001][ref10], behoudens voorzover het een werkzaamheid
      betreft als bedoeld in de [artikelen 3.91, eerste lid, onderdelen a en b][ref11], en [3.92 van die wet][ref12];

      d. een uitkering op grond van de [ZW][ref13], de [WW][ref14], de [WAO][ref15], de [WAZ][ref16],
      de [WAJONG][ref17], de [Toeslagenwet][ref18], de [Wet werk en bijstand][ref19], de
      [Wet inkomensvoorziening oudere en gedeeltelijke arbeidsongeschikte werkloze werknemers][ref20], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref21],
      de [Wet werk en inkomen kunstenaars][ref22], de [Algemene nabestaandenwet][ref23] of de
      [Algemene ouderdomswet][ref24], alsmede een uitkering die naar aard en strekking daarmee overeenkomt;

      2 Voor de toepassing van [artikel 8, eerste lid, van het besluit][ref25] wordt, voorzover het ingevolge het eerste
      lid niet reeds als inkomen wordt aangemerkt, mede onder inkomen verstaan:

      a. een uitkering, toelage, loon- of inkomenssuppletie op grond van de [Wet][ref26];

      b. een uitkering op grond van een pensioenregeling als bedoeld in de [Wet op de loonbelasting 1964][ref27] of
      een uitkering op grond van een regeling die op grond van [artikel 19d van de Wet op de loonbelasting 1964][ref28]
      daarmee is gelijkgesteld;

      c. een herplaatsingstoelage op grond van een pensioenregeling voor overheidswerknemers in de zin van
      [artikel 1, onderdeel l, van de Wet][ref29] overheidspersoneel onder de werknemers-verzekeringen, alsmede een
      uitkering die naar aard en strekking daarmee overeenkomt;

      d. een uitkering op grond van een regeling voor vervroegde uittreding als bedoeld in de
      [Wet op de loonbelasting 1964][ref30] of een uitkering op grond van een regeling die op grond van
      [artikel 19d van de Wet op de loonbelasting 1964][ref31] daarmee is gelijkgesteld;

      e. een periodieke uitkering op grond van een particuliere ziekte- of ongevallenverzekering;

      f. een uitkering op grond van een pensioenregeling waaraan deelneming is verplicht gesteld op grond van de
      [Wet betreffende verplichte deelneming in een beroepspensioenregeling][ref32];

      g. termijnen van lijfrenten, aan een meerderjarige verstrekt door een lichaam dat een levensverzekeringsbedrijf
      uitoefent;

      h. uitkeringen op grond van de Ongevallenwet 1921, de Land- en Tuinbouwongevallenwet 1922 en de Zeeongevallenwet
      1919 in verbinding met de [Liquidatiewet ongevallenwetten][ref33];

      i. uitkeringen op grond van de [Wet buitengewoon pensioen 1940-1945][ref34] en op grond van de
      [Wet buitengewoon pensioen zeeliedenoorlogsslachtoffers][ref35];

      j. uitkeringen op grond van de Algemene Oorlogsongevallenregeling en de beschikking van de Luitenant-Gouverneur-
      Generaal van Nederlandsch-Indië van 5 november 1946, nr. 6, alsmede op deze uitkeringen betrekking hebbende toe-
      en bijslagen;

      k. uitkeringen uit de Stichting 1940-1945, de Stichting Friesland 1940-1945 en de Stichting Hulp voor nagelaten
      betrekkingen voor illegale strijders (Stichting Sneek 1940-1945);

      l. uitkeringen op grond van de [Wet uitkeringen vervolgingsslachtoffers 1940-1945][ref36] en de
      [Wet Uitkeringen Burger-Oorlogsslachtoffers 1940-1945][ref37].


