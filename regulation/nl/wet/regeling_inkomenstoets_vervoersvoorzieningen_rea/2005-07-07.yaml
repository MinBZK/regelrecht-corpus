  - number: '3'
    text: |-
      Bij de vaststelling van het inkomen van de persoon die de vervoersvoorziening aanvraagt of aan wie de
      vervoersvoorziening is toegekend, wordt mede in aanmerking genomen het inkomen van zijn echtgenoot.
    url: https://wetten.overheid.nl/BWBR0009854/2005-07-07#Artikel3
  - number: '4'
    text: |-
      Op het inkomen worden in mindering gebracht kosten ter zake van ziekte of arbeids-ongeschiktheid van de persoon
      die de vervoersvoorziening aanvraagt of aan wie de vervoersvoorziening is toegekend, alsmede van zijn echtgenoot
      of van zijn gezinsleden indien zij voor hun levensonderhoud mede afhankelijk zijn van zijn inkomen, voorzover
      die kosten niet uit andere hoofde kunnen worden vergoed en naar het oordeel van het Uitvoeringsinstituut
      werknemersverzekeringen als buitengewone lasten zijn aan te merken.
    url: https://wetten.overheid.nl/BWBR0009854/2005-07-07#Artikel4
  - number: '5'
    text: |-
      Bij het vaststellen van het inkomen blijven buiten beschouwing:

      a. het bedrag waarmee de uitkering op grond van de [WAO][ref1], de [WAZ][ref2] of de WAJONG, of een combinatie
      van deze uitkeringen is verhoogd, op grond van [artikel 22 van de WAO, artikel 10 van de WAZ][ref3], of
      [artikel 9][ref4] van de WAJONG, of een combinatie van deze artikelen;

      b. de overhevelingstoeslag zoals bedoeld in artikel 1, eerste lid, van de Wet overhevelingstoeslag opslagpremies;

      c. het deel van de uitkering op grond van de [Algemene Ouderdomswet][ref5] en het deel van de uitkering op grond
      van de [Algemene nabestaandenwet][ref6], dat onderscheidelijk op grond van artikel 81, derde lid, en artikel 81,
      vierde lid, van de Wet aanpassing uitkeringsregelingen overheveling opslagpremies als overhevelingstoeslag wordt
      beschouwd;

      d. het deel van de uitkering op grond de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref7]
      en het deel van de uitkering op grond van de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref8] dat overeenkomstig
      artikel 76 van de Wet aanpassing uitkeringsregelingen overheveling opslagpremies gelijk is aan de premie op grond
      van de [Algemene Wet Bijzondere Ziektekosten][ref9].


