  - number: '9'
    text: |-
      Voor de persoon die een vervoersvoorziening aanvraagt of aan wie een vervoersvoorziening is toegekend en van wie de
      echtgenoot of een ander gezinslid aanspraak op een vervoersvoorziening heeft, of van wie de echtgenoot of een ander
      gezinslid om een andere reden dan ziekte of gebrek is aangewezen op het gebruik van een van een vervoermiddel,
      wordt het percentage, bedoeld in [artikel 8, eerste lid, van het besluit][ref1], vastgesteld op 105.


      [ref1]: https://wetten.overheid.nl/BWBR0009609#Artikel8
    url: https://wetten.overheid.nl/BWBR0009854/2005-07-07#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009609
        artikel: '8'
  - number: '10'
    text: |-
      [Artikel 8, eerste lid][ref1], van het besluit is niet van toepassing:

      a. bij de toekenning van een vervoersvoorziening aan personen aan wie een vervoersvoorziening was toegekend
      op grond van de Ongevallenwet, de Land- en Tuinbouwongevallenwet 1922 en de Zeeongevallenwet 1919 en van
      wie die voorziening zonder tussentijdse onderbreking is voortgezet tot het moment van de toekenning van een
      vervoersvoorziening op grond van de [Wet][ref2];

      b. bij de toekenning van een vervoersvoorziening die betreft:

      1º. een vergoeding van de kosten van aanpassing van een vervoermiddel of een vergoeding van een in een
      vervoermiddel aangebrachte faciliteit, voorzover de aanpassing of de faciliteit noodzakelijk is in verband met
      ziekte of gebrek;

      2º. een vergoeding voor de aanschaf, of een verstrekking, van een vervoermiddel voor het vervoer buitenshuis dat is
      bestemd voor het gebruik door een persoon met een ziekte of gebrek;

      3º. een vergoeding van de meerkosten van de aanschaf en het gebruik van een bijzonder type auto die samenhangt met
      ziekte of gebrek, voorzover deze meerkosten niet meer bedragen dan het verschil tussen de kosten van de aanschaf
      en het gebruik van een auto die door het Uitvoeringsinstituut werknemersverzekeringen wordt beschouwd als een
      referentie-auto en de kosten van de aanschaf en het gebruik van een auto die door het Landelijke instituut sociale
      verzekeringen zou zijn toegekend indien er sprake zou zijn geweest van een bruikleensituatie, dan wel het een
      vergoeding van dienovereenkomstige meerkosten betreft;

      4º. de vergoeding van het gebruik van een rolstoeltaxi en die vergoeding niet meer bedraagt dan het verschil tussen
      het door het Lisv vastgestelde normbedrag voor de vergoeding van het gebruik van een rolstoeltaxi en het door het
      Lisv vastgestelde normbedrag voor de vergoeding van het gebruik van een taxi;

      5º. de vergoeding van het gebruik van een taxi om de werkplek te kunnen bereiken en die vergoeding niet meer
      bedraagt het verschil tussen de kosten van het gebruik van een taxi en het door het Lisv vastgestelde normbedrag
      voor het gebruik van een eigen auto.

      6º. een vergoeding van de kosten die iemand moet maken voor het kunnen volgen van rijlessen in een aangepaste auto
      en die vergoeding niet meer bedraagt dan het verschil tussen de kosten van het volgen van autorijlessen in een niet
      aangepaste auto en het volgen van autorijlessen in een aangepaste auto;

      7º. een vergoeding van vervoerskosten in verband met het volgen van scholing.


