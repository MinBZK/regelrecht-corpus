  - number: 3:6
    text: |-
      1 De directie Constitutionele Zaken en Wetgeving staat onder leiding van een directeur en een plaatsvervangend
      directeur.

      2 De directie heeft de volgende taken:

      a. het in samenwerking met verantwoordelijke beleidsonderdelen voorbereiden en beheren van alle wet- en regelgeving
      op het terrein van Binnenlandse Zaken en Koninkrijksrelaties;

      b. het behandelen van constitutionele vraagstukken en het voorbereiden van en adviseren over het constitutionele
      beleid;

      c. het toetsen van regelgeving en verdragen alsmede overige beleidsvoornemens van andere ministeries aan het
      [Statuut][ref1], de [Grondwet][ref2], en verdragsbepalingen met constitutionele inslag;

      d. het namens de minister bijdragen aan de ontwikkeling van het wetgevingskwaliteitsbeleid;

      e. het behandelen van bijzondere opdrachten van de departementsleiding, civielrechtelijke kwesties en andere
      juridische aangelegenheden.

      3 De directie kan daarnaast worden belast met de zorg voor daartoe aangewezen projecten in het kader van
      bestuurlijke en democratische vernieuwing.


      [ref1]: https://wetten.overheid.nl/BWBR0002154
      [ref2]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0017563/2006-02-03#Artikel36
