  - number: 3:3
    text: |-
      1 Het Bureau Secretaris-Generaal staat onder leiding van een hoofd.

      2 Het bureau heeft de volgende taken:

      a. het beheers- en beleidsmatig ondersteunen en adviseren van de bewindspersonen, de secretaris-generaal en de
      plaatsvervangend secretaris-generaal;

      b. het voeren van het secretariaat van ministeriebrede overleggen;

      c. het coördineren van aangelegenheden met betrekking tot het parlement of de ministerraad;

      d. het ondersteunen van de secretaris-generaal in diens taken en verantwoordelijkheden met betrekking tot de
      beveiliging van het ministerie;

      e. het coördineren en bevorderen van strategische kennisontwikkeling.
    url: https://wetten.overheid.nl/BWBR0017563/2006-02-03#Artikel33
  - number: 3:4
    text: |-
      1 De dienst Financieel-economische Zaken en Control staat onder leiding van een directeur.

      2 De dienst heeft de volgende taken:

      a. het uitvoeren van taken die voortvloeien uit [artikel 21 van de Comptabiliteitswet][ref1];

      b. het uitvoeren van taken die voortvloeien uit het [Besluit taak FEZ][ref2];

      c. taken die voortvloeien uit [artikel 3, zevende lid, van het Beheersbesluit KABGNA/KABGA 1998][ref3].

      d. het stellen van kaders voor de bedrijfsvoering van het ministerie;

      e. het uitoefenen van de integrale control van het ministerie;

      f. het vanuit de integrale control verantwoordelijkheid strategisch adviseren van de Algemene Leiding en de
      ministers.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0005333
      [ref3]: https://wetten.overheid.nl/BWBR0009743#Artikel3
    url: https://wetten.overheid.nl/BWBR0017563/2006-02-03#Artikel34
