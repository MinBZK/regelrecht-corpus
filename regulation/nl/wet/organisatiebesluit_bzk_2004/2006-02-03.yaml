  - number: 3:2
    text: |-
      1 De Concernstaven staan beheersmatig onder leiding van de plaatsvervangend secretaris-generaal.
      Voor de inhoudelijke aansturing van de onderdelen van de Concernstaven is het gestelde onder
      [artikel 3:1, lid 1, en lid 3 sub f][ref1] van toepassing.

      2 De Concernstaven hebben tot taak het ondersteunen van de Algemene Leiding bij het aansturen en het coördineren
      van het ministerie.

      3 De Concernstaven bestaan uit de volgende organisatieonderdelen:

      a. het Bureau Secretaris-Generaal (BSG);

      b. de dienst Financieel-economische Zaken en Control (FEZC);

      c. de Auditdienst (AD);

      d. de directie Constitutionele Zaken en Wetgeving (CZW);

      e. de projectdirectie Nieuwbouw Justitie & BZK (PNJB);

      f. het gemeenschappelijke secretariaat van de Raad voor het openbaar bestuur en de Raad voor de financiële
      verhoudingen (SRob/Rfv).


      [ref1]: https://wetten.overheid.nl/BWBR0017563#Artikel31
    url: https://wetten.overheid.nl/BWBR0017563/2006-02-03#Artikel32
