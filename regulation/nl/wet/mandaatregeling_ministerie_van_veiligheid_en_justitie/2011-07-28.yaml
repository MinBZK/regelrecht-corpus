---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: mandaatregeling_ministerie_van_veiligheid_en_justitie
regulatory_layer: WET
publication_date: '2011-12-19'
valid_from: '2011-07-28'
bwb_id: BWBR0029452
url: https://wetten.overheid.nl/BWBR0029452/2011-07-28
preamble:
  text: |-
    Gelet op de artikelen 10:3, 10:9, eerste lid, en 10:12 van de Algemene wet bestuursrecht, artikel 32, vierde lid,
    van de Comptabiliteitswet 2001 en artikel 4, eerste lid, onderdeel b, van het Algemeen Rijksambtenarenreglement;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel1
  - number: 1.a
    text: '*bewindspersoon:* de Minister van Veiligheid en Justitie of de Staatssecretaris van Veiligheid en Justitie;'
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel1
  - number: 1.b
    text: '*mandaat:* de bevoegdheid om in naam van de bewindspersoon besluiten te nemen;'
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel1
  - number: 1.c
    text: |-
      *ministerie:* de dienstonderdelen, genoemd in de [Organisatieregeling Ministerie van Veiligheid en Justitie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029453
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0029453
  - number: '2'
    text: |-
      Aan de secretaris-generaal wordt mandaat verleend ten aanzien van de tot de verantwoordelijkheid van de
      bewindspersoon behorende aangelegenheden, met uitzondering van de bevoegdheid tot het nemen van besluiten die zijn
      neergelegd in een document, gericht tot:
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel2
  - number: 2.a
    text: de Koningin;
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel2
  - number: 2.b
    text: de raad van ministers van het Koninkrijk, de ministerraad of een daaruit gevormde onderraad of commissie;
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel2
  - number: 2.c
    text: de voorzitter van de Eerste of Tweede Kamer der Staten-Generaal of van een uit die Kamer gevormde commissie;
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel2
  - number: 2.d
    text: de vice-president van de Raad van State van het Koninkrijk of de vice-president van de Raad van State;
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel2
  - number: 2.e
    text: de president van de Algemene Rekenkamer; of
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel2
  - number: 2.f
    text: |-
      de Nationale ombudsman, indien de strekking daarvan is dat aan een aanbeveling van de Nationale ombudsman geen
      gevolg wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel2
  - number: '3.1'
    text: 'De secretaris-generaal wordt toegestaan ondermandaat te verlenen aan:'
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel3
  - number: 3.1.a
    text: een directeur-generaal;
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel3
  - number: 3.1.b
    text: de plaatsvervangend secretaris-generaal;
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel3
  - number: 3.1.c
    text: de Nationaal Coördinator Terrorismebestrijding;
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel3
  - number: 3.1.d
    text: het hoofd van de Inspectie Openbare Orde en Veiligheid;
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel3
  - number: 3.1.e
    text: andere bij het ministerie werkzame ambtenaren, voor zover zij niet ressorteren onder een directeur-generaal.
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel3
  - number: '3.2'
    text: Verleend ondermandaat kan steeds één hiërarchisch niveau verder worden doorgegeven.
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel3
  - number: '4'
    text: |-
      De secretaris-generaal wordt aangewezen als hoofd van dienst in de zin van
      [artikel 4, eerste lid, onderdeel b, van het Algemeen Rijksambtenarenreglement][ref1] ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel4
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '4'
  - number: 4.a
    text: de directeuren-generaal;
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel4
  - number: 4.b
    text: de plaatsvervangend secretaris-generaal;
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel4
  - number: 4.c
    text: de Nationaal Coördinator Terrorismebestrijding;
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel4
  - number: 4.d
    text: het hoofd van de Inspectie Openbare Orde en Veiligheid;
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel4
  - number: 4.e
    text: |-
      de hoofden en directeuren van de in
      [artikel 2, onderdeel a, van de Organisatieregeling Ministerie van Veiligheid en Justitie][ref1] genoemde
      dienstonderdelen die rechtstreeks ressorteren onder de secretaris-generaal, met uitzondering van de directeuren,
      bedoeld in artikel 2 van het Taak- en bevoegdheidsbesluit pSG Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0029453
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0029453
  - number: '5'
    text: |-
      Bij verhindering van de secretaris-generaal is de plaatsvervangend secretaris-generaal bevoegd. Indien ook deze
      verhinderd is, is de directeur Wetgeving bevoegd. Indien ook deze verhinderd is, is een van de directeuren-generaal
      bevoegd, in volgorde van de datum van benoeming.
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel5
  - number: '6.1'
    text: |-
      De directeuren-generaal, de Nationaal Coördinator Terrorismebestrijding en het hoofd van de Inspectie Openbare
      Orde en Veiligheid dragen zorg voor het bijhouden van openbare registers betreffende mandaten die zijn verleend aan
      ambtenaren, werkzaam bij de onder hen ressorterende dienstonderdelen.
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel6
  - number: '6.2'
    text: |-
      De directeur Personeel en Organisatie draagt zorg voor een openbaar register betreffende mandaten die zijn verleend
      aan ambtenaren, werkzaam bij de rechtstreeks onder de secretaris-generaal ressorterende dienstonderdelen.
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel6
  - number: '6.3'
    text: In de registers worden de functies vermeld van de desbetreffende ambtenaren.
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel6
  - number: '7.1'
    text: |-
      Voor de toepassing van deze regeling en de daarop berustende bepalingen worden met mandaat gelijkgesteld de
      verlening van:
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel7
  - number: 7.1.a
    text: volmacht om in naam van de bewindspersoon privaatrechtelijke rechtshandelingen te verrichten;
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel7
  - number: 7.1.b
    text: |-
      machtiging om in naam van de bewindspersoon handelingen te verrichten die noch een besluit, noch een
      privaatrechtelijke rechtshandeling zijn.
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel7
  - number: '7.2'
    text: |-
      Voor de toepassing van [artikel 3][ref1] geldt dat het doorgeven van een volmacht om privaatrechtelijke
      rechtshandelingen te verrichten slechts is toegestaan voor zover het regelmatig voorkomende rechtshandelingen
      betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0029452#Artikel3
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0029452
        artikel: '3'
  - number: '8'
    text: |-
      Vóór het tijdstip van inwerkingtreding van deze regeling van kracht zijnde mandaten, ondermandaten, volmachten
      en machtigingen op het terrein van het Ministerie van Veiligheid en Justitie waarin op het tijdstip van
      inwerkingtreding van deze regeling niet is voorzien, blijven van kracht totdat op grond van deze regeling is
      voorzien in mandaat, ondermandaat, volmacht of machtiging dan wel is voorzien in intrekking daarvan.
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel8
  - number: '9'
    text: |-
      Door of namens de Minister van Binnenlandse Zaken en Koninkrijksrelaties verleende mandaten en ondermandaten op het
      terrein van veiligheid behoudens de Algemene Inlichtingen- en Veiligheidsdienst, die op 13 oktober 2010 van kracht
      waren, worden aangemerkt als mandaten die met ingang van 14 oktober 2010 zijn verleend door of namens de Minister
      van Veiligheid en Justitie, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel9
  - number: 9.a
    text: |-
      mandaten aan de secretaris-generaal van het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties worden
      aangemerkt als mandaten aan de secretaris-generaal van het Ministerie van Veiligheid en Justitie;
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel9
  - number: 9.b
    text: |-
      mandaten die rechtstreeks zijn verleend aan functionarissen die ressorteren onder het directoraat-generaal
      Veiligheid of de Inspectie Openbare Orde en Veiligheid worden aangemerkt als ondermandaten die overeenkomstig deze
      regeling zijn verleend.
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel9
  - number: '10'
    text: |-
      De [Mandaatregeling Ministerie van Justitie 2005][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0018330
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0018330
  - number: '11'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 14 oktober 2010.
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel11
  - number: '12'
    text: 'Deze regeling wordt aangehaald als: Mandaatregeling Ministerie van Veiligheid en Justitie.'
    url: https://wetten.overheid.nl/BWBR0029452/2011-07-28#Artikel12
