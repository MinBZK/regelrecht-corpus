articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *minister:* minister van Economische Zaken;

      b. *open teelten:* open teelten van de sectoren akkerbouw, vollegrondsgroententeelt, bollenteelt, sierteelt,
      fruitteelt en boomkwekerij;

      c. *premie:* premie, bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1];

      d. *schade-expert:* deskundige die de gedragscode van expertiseorganisaties van het Verbond van Verzekeraars of een
      daarmee gelijk te stellen gedragscode in acht neemt;

      e. *verzekeraar:* verzekeraar, bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref2];

      f. *verzekering:* verzekering als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref3];

      g. *verzekeringspolis:* bewijs van verzekering tussen landbouwer en verzekeraar;

      h. *landbouwer:* actieve landbouwer als bedoeld in artikel 36, tweede lid, van verordening (EU) nr. 1305/2013;

      i. *betaalorgaan:* betaalorgaan als bedoeld in artikel 7, eerste lid, van verordening (EU) nr. 1306/2013;

      j. *verordening (EU) nr. 1305/2013:* verordening (EU) nr. 1305/2013 van het Europees Parlement en de Raad van
      17 december 2013 inzake steun voor plattelandsontwikkeling (ELFPO) en tot intrekking van [Verordening (EG) nr.
      1698/2005](32005R1698) van de Raad (PbEU L 347/487);

      k. *verordening (EU) nr. 1306/2013:* verordening (EU) nr. 1306/2013 van het Europees Parlement en de Raad van
      17 december 2013 inzake de financiering, het beheer en de monitoring van het gemeenschappelijk landbouwbeleid en
      tot intrekking van [Verordeningen (EEG) nr. 352/78](31978R0352), [(EG) nr. 165/94](31994R0165), [(EG) nr. 2799/98]
      (31998R2799), [(EG) nr. 814/2000](32000R0814), [(EG) nr. 1290/2005](32005R1290) en [(EG) nr. 485/2008](32008R0485)
      van de Raad (PbEU L 347);

      l. *verordening (EU) nr. 809/2014:* verordening (EU) nr. 809/2014 van de Commissie van 17 juli 2014 tot
      vaststelling van uitvoeringsbepalingen voor Verordening (EU) nr. 1306/2013 van het Europees Parlement en de Raad
      wat betreft het geïntegreerd beheers- en controlesysteem, plattelandsontwikkelingsmaatregelen en de randvoorwaarden
      (PbEU L 227/69).


