  - number: '13'
    text: |-
      1 De goedkeuring, bedoeld in [artikel 12, eerste lid][ref1], kan op verzoek van de verzekeraar steeds voor een
      periode van een jaar worden verlengd.

      2 De minister stemt in met het verzoek tot verlenging van de goedkeuring indien de verzekeringsvoorwaarden
      ongewijzigd blijven dan wel sprake is van niet-essentiële wijzigingen.

      3 De verzekeraar dient vóór 1 december een verzoek tot verlenging van de goedkeuring in bij de minister en meldt
      daarbij de eventuele wijzigingen van de verzekeringsvoorwaarden.

      4 De minister beslist binnen 6 weken op het verzoek, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0036188#Artikel12
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel13
    references:
