---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_subsidiering_brede_weersverzekering
regulatory_layer: WET
publication_date: '2015-06-30'
valid_from: '2015-01-24'
bwb_id: BWBR0036188
url: https://wetten.overheid.nl/BWBR0036188/2015-01-24
preamble:
  text: |-
    Gelet op:

    Verordening (EU) nr. 1303/2013 van het Europees Parlement en de Raad van 17 december 2013 houdende
    gemeenschappelijke bepalingen inzake het Europees Fonds voor regionale ontwikkeling, het Europees Sociaal Fonds,
    het Cohesiefonds, het Europees Landbouwfonds voor plattelandsontwikkeling en het Europees Fonds voor maritieme
    zaken en visserij en algemene bepalingen inzake het Europees Fonds voor regionale ontwikkeling, het Europees
    Sociaal Fonds, het Cohesiefonds en het Europees Fonds voor maritieme zaken en visserij, en tot intrekking van
    Verordening (EG) nr. 1083/2006 van de Raad (PbEU L347/320);

    Verordening (EU) nr. 1305/2013 van het Europees Parlement en de Raad van 17 december 2013 inzake steun voor
    plattelandsontwikkeling (ELFPO) en tot intrekking van Verordening (EG) nr. 1698/2005 van de Raad (PbEU L 347/487);

    Verordening (EU) nr. 1306/2013 van het Europees Parlement en de Raad van 17 december 2013 inzake de financiering,
    het beheer en de monitoring van het gemeenschappelijk landbouwbeleid en tot intrekking van Verordeningen (EEG) nr.
    352/78, (EG) nr. 165/94, (EG) nr. 2799/98, (EG) nr. 814/2000, (EG) nr. 1290/2005 en (EG) nr. 485/2008 van de Raad
    (PbEU L 347);

    Verordening (EU) nr. 640/2014 van de Commissie van 11 maart 2014 tot aanvulling van Verordening (EU) nr. 1306/2013
    van het Europees Parlement en de Raad wat betreft het geïntegreerd beheers- en controlesysteem en de voorwaarden
    voor weigering of intrekking van betalingen en voor administratieve sancties in het kader van rechtstreekse
    betalingen, plattelandsontwikkelingsbijstand en de randvoorwaarden (PbEU L181/48);

    Verordening (EU) nr. 809/2014 van de Commissie van 17 juli 2014 tot vaststelling van uitvoeringsbepalingen voor
    Verordening (EU) nr. 1306/2013 van het Europees Parlement en de Raad wat betreft het geïntegreerd beheers- en
    controlesysteem, plattelandsontwikkelingsmaatregelen en de randvoorwaarden;

    en de artikelen 15, 19 en 27 van de Landbouwwet, de artikelen 2 en 3 van de Kaderwet EZ-subsidies, en artikel 4:89,
    vierde lid, van de Algemene wet bestuursrecht;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel1
  - number: 1.a
    text: '*minister:* minister van Economische Zaken;'
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel1
  - number: 1.b
    text: |-
      *open teelten:* open teelten van de sectoren akkerbouw, vollegrondsgroententeelt, bollenteelt, sierteelt,
      fruitteelt en boomkwekerij;
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel1
  - number: 1.c
    text: |-
      *premie:* premie, bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 1.d
    text: |-
      *schade-expert:* deskundige die de gedragscode van expertiseorganisaties van het Verbond van Verzekeraars of een
      daarmee gelijk te stellen gedragscode in acht neemt;
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel1
  - number: 1.e
    text: |-
      *verzekeraar:* verzekeraar, bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 1.f
    text: |-
      *verzekering:* verzekering als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 1.g
    text: '*verzekeringspolis:* bewijs van verzekering tussen landbouwer en verzekeraar;'
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel1
  - number: 1.h
    text: '*landbouwer:* actieve landbouwer als bedoeld in artikel 36, tweede lid, van verordening (EU) nr. 1305/2013;'
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel1
  - number: 1.i
    text: '*betaalorgaan:* betaalorgaan als bedoeld in artikel 7, eerste lid, van verordening (EU) nr. 1306/2013;'
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel1
  - number: 1.j
    text: |-
      *verordening (EU) nr. 1305/2013:* verordening (EU) nr. 1305/2013 van het Europees Parlement en de Raad van
      17 december 2013 inzake steun voor plattelandsontwikkeling (ELFPO) en tot intrekking van [Verordening (EG) nr.
      1698/2005](32005R1698) van de Raad (PbEU L 347/487);
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel1
  - number: 1.k
    text: |-
      *verordening (EU) nr. 1306/2013:* verordening (EU) nr. 1306/2013 van het Europees Parlement en de Raad van
      17 december 2013 inzake de financiering, het beheer en de monitoring van het gemeenschappelijk landbouwbeleid en
      tot intrekking van [Verordeningen (EEG) nr. 352/78](31978R0352), [(EG) nr. 165/94](31994R0165), [(EG) nr. 2799/98]
      (31998R2799), [(EG) nr. 814/2000](32000R0814), [(EG) nr. 1290/2005](32005R1290) en [(EG) nr. 485/2008](32008R0485)
      van de Raad (PbEU L 347);
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel1
  - number: 1.l
    text: |-
      *verordening (EU) nr. 809/2014:* verordening (EU) nr. 809/2014 van de Commissie van 17 juli 2014 tot vaststelling
      van uitvoeringsbepalingen voor Verordening (EU) nr. 1306/2013 van het Europees Parlement en de Raad wat betreft
      het geïntegreerd beheers- en controlesysteem, plattelandsontwikkelingsmaatregelen en de randvoorwaarden (PbEU
      L 227/69).
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel1
  - number: '2.1'
    text: |-
      De minister verstrekt subsidie aan een landbouwer in de vorm van een financiële bijdrage voor de premie ten
      behoeve van een verzekering tegen de financiële gevolgen van ongunstige weersomstandigheden, die overeenkomstig
      [artikel 12][ref1] is goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0036188#Artikel12
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0036188
        artikel: '12'
        hoofdstuk: '3'
  - number: '2.2'
    text: |-
      De subsidie wordt verstrekt onder voorbehoud dat de Europese Commissie goedkeuring verleent aan het programma,
      bedoeld in artikel 10 van verordening (EU) nr. 1305/2013.
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel2
  - number: '2.3'
    text: |-
      De landbouwer die in aanmerking wil komen voor de subsidie, bedoeld in het
      eerste lid, maakt voor de aanvraag gebruik van de verzamelaanvraag, bedoeld in
      [artikel 4.2 van de Uitvoeringsregeling rechtstreekse betalingen GLB][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035925#Artikel4
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0035925
        artikel: '4'
  - number: '2.4'
    text: |-
      De landbouwer legt vóór 1 november van het jaar waarin hij de aanvraag, bedoeld in het derde lid, indient de in
      [artikel 9][ref1] genoemde gegevens over. De bewijsstukken worden schriftelijk overgelegd voor zover deze niet
      elektronisch overgelegd kunnen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0036188#Artikel9
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0036188
        artikel: '9'
        hoofdstuk: '2'
  - number: '2.5'
    text: |-
      De aanvrager is van de verplichting, bedoeld in het vierde lid, vrijgesteld voor zover de bewijsstukken vóór het
      verstrijken van de in dat lid genoemde termijn door de verzekeraar worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel2
  - number: '2.6'
    text: |-
      [Artikel 2.3, tweede lid, van de Uitvoeringsregeling rechtstreekse betalingen GLB][ref1] is van overeenkomstige
      toepassing op een landbouwer als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0035925#Artikel2
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0035925
        artikel: '2'
  - number: '3.1'
    text: |-
      Geen subsidie wordt verstrekt voor zover de landbouwer van overheidswege een andere bijdrage ontvangt voor de
      premie, bedoeld in [artikel 2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036188#Artikel2
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0036188
        artikel: '2'
        hoofdstuk: '2'
  - number: '3.2'
    text: |-
      Geen subsidie wordt verstrekt indien de landbouwer zijn teelt niet tegen alle ongunstige weersomstandigheden,
      genoemd in [artikel 14][ref1], heeft verzekerd.


      [ref1]: https://wetten.overheid.nl/BWBR0036188#Artikel14
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0036188
        artikel: '14'
        hoofdstuk: '3'
  - number: '3.3'
    text: |-
      Geen subsidie wordt verstrekt ten behoeve van de premie die wordt betaald voor de verzekering van de open teelt op
      landbouwgrond die is gelegen buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel3
  - number: '4.1'
    text: De subsidie bedraagt 65% van de verzekeringspremie, exclusief belastingen.
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel4
  - number: '4.2'
    text: |-
      De subsidie betreft enkel de oppervlakte van de verzekerde percelen die via de verzamelaanvraag als zodanig zijn
      opgegeven.
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel4
  - number: '5.1'
    text: |-
      Op een aanvraag om subsidie als bedoeld in [artikel 2, derde lid][ref1], is
      [artikel 4.2, tweede en derde lid, van de Uitvoeringsregeling rechtstreekse betalingen GLB][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0036188#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035925#Artikel2
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0036188
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0035925
        artikel: '2'
  - number: '5.2'
    text: Het subsidieplafond voor het jaar 2015 bedraagt € 9.000.000,–.
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel5
  - number: '6'
    text: |-
      Indien meer subsidie wordt aangevraagd dan het bedrag in [artikel 5, tweede lid][ref1], wordt het percentage,
      bedoeld in [artikel 4, eerste lid][ref2], evenredig verlaagd.


      [ref1]: https://wetten.overheid.nl/BWBR0036188#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0036188#Artikel4
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0036188
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0036188
        artikel: '4'
        hoofdstuk: '2'
  - number: '7.1'
    text: 'De minister beslist afwijzend op een aanvraag om subsidie indien:'
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel7
  - number: 7.1.a
    text: |-
      de aanvrager niet voldoet aan [artikel 2, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0036188#Artikel2
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0036188
        artikel: '2'
        hoofdstuk: '2'
  - number: 7.1.b
    text: |-
      de aanvrager ofwel in het geval hij een volmacht heeft verleend als bedoeld in [artikel 10][ref1], het deel van
      de verzekeringspremie dat overeenkomt met de gehele verzekeringspremie verminderd met de aangevraagde subsidie
      op grond van deze regeling, ofwel indien de aanvrager geen volmacht heeft verleend als bedoeld in artikel 10, de
      volledige verzekeringspremie, niet vóór 1 november van het jaar van de aanvraag heeft betaald, of


      [ref1]: https://wetten.overheid.nl/BWBR0036188#Artikel10
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0036188
        artikel: '10'
        hoofdstuk: '2'
  - number: 7.1.c
    text: |-
      geen toestemming als bedoeld in [artikel 9, eerste lid, onder d en e][ref1], is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0036188#Artikel9
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0036188
        artikel: '9'
        hoofdstuk: '2'
  - number: '7.2'
    text: |-
      Indien de verstrekte subsidie lager is dan de aangevraagde subsidie als gevolg van een bij besluit van de minister
      vastgestelde verlaging van de subsidie, dient de landbouwer de met dit verschil overeenkomende premie vóór 1 juli
      volgend op het jaar van de aanvraag aan de verzekeraar te voldoen.
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel7
  - number: '8'
    text: De minister beslist op een aanvraag om subsidie uiterlijk 15 mei van het jaar volgend op het jaar van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel8
  - number: '9'
    text: 'De aanvrager verstrekt de volgende gegevens aan de minister:'
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel9
  - number: 9.a
    text: het polisnummer van de verzekering;
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel9
  - number: 9.b
    text: een kopie van de verzekeringspolis;
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel9
  - number: 9.c
    text: |-
      een bewijs van betaling van het deel van de verzekeringspremie, bedoeld in
      [artikel 7, eerste lid, onderdeel b, en tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0036188#Artikel7
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0036188
        artikel: '7'
        hoofdstuk: '2'
  - number: 9.d
    text: |-
      toestemming aan de minister om persoonsgegevens te verwerken ten behoeve van de controle op de naleving van deze
      regeling;
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel9
  - number: 9.e
    text: |-
      toestemming aan de minister om perceelsgegevens uit te wisselen met de verzekeraar ten behoeve van de controle op
      de naleving van deze regeling;
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel9
  - number: 9.f
    text: een verklaring dat hij zich bewust is van alle voorwaarden voor verkrijging van deze subsidie;
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel9
  - number: 9.g
    text: de naam van de verzekeraar met wie de verzekering is afgesloten, en
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel9
  - number: 9.h
    text: een verklaring dat hij zich niet meer dan één keer verzekert voor dezelfde schade.
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel9
  - number: '10.1'
    text: |-
      De betaling van de subsidie, bedoeld in [artikel 2][ref1], geschiedt overeenkomstig
      [artikel 4:89, vierde lid, van de Algemene wet bestuursrecht][ref2] en overeenkomstig een door de aanvrager daartoe
      verstrekte volmacht als bedoeld in [titel 3 van Boek 3 van het Burgerlijk Wetboek][ref3], aan de verzekeraar met
      wie de landbouwer de verzekering heeft gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0036188#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005291
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0036188
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005291
  - number: '10.2'
    text: |-
      Bij gebreke van een volmacht als bedoeld in het eerste lid vindt betaling plaats door bijschrijving op een door de
      aanvrager opgegeven bankrekening.
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel10
  - number: '11.1'
    text: |-
      Een verzekeraar dient vóór 1 februari een aanvraag in bij de minister voor goedkeuring van de voorwaarden van een
      verzekering.
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel11
  - number: '11.2'
    text: 'De aanvraag, bedoeld in het eerste lid, gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel11
  - number: 11.2.a
    text: een onderbouwing van de premie;
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel11
  - number: 11.2.b
    text: |-
      een verklaring van de verzekeraar dat hij zijn administratie die betrekking heeft op de verzekeringsvoorwaarden,
      ten minste vier kalenderjaren na afloop van de verzekering ter beschikking houdt van de minister;
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel11
  - number: 11.2.c
    text: het standaardmodel van de verzekeringspolis, en
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel11
  - number: 11.2.d
    text: |-
      documenten waarin de verzekeraar ten genoegen van de minister aantoont dat de verzekeringsvoorwaarden voldoen aan
      het bepaalde in deze regeling.
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel11
  - number: '11.3'
    text: De minister beslist binnen een termijn van 22 weken op de aanvraag, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel11
  - number: '12.1'
    text: 'De minister verleent uitsluitend goedkeuring aan de verzekeringsvoorwaarden indien:'
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel12
  - number: 12.1.a
    text: 'het financieel verlies van de landbouwer wordt gedekt:'
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel12
  - number: 12.1.a.1°
    text: |-
      voor zover dat meer is dan 30% van de gemiddelde jaarproductie in de laatste drie jaar of van de gemiddelde
      productie van drie van de laatste vijf jaar waarbij de hoogste en laagste productie van deze vijf jaar niet wordt
      meegerekend,
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel12
  - number: 12.1.a.2°
    text: dat het gevolg is van een lagere opbrengst in kwantiteit of kwaliteit,
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel12
  - number: 12.1.a.3°
    text: dat optreedt op een aaneengesloten stuk grond waarop één enkel gewas wordt geteeld, en
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel12
  - number: 12.1.a.4°
    text: |-
      dat redelijkerwijs is toe te rekenen aan ongunstige weersomstandigheden als bedoeld in [artikel 14][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0036188#Artikel14
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0036188
        artikel: '14'
        hoofdstuk: '3'
  - number: 12.1.b
    text: alle open teelten verzekerd kunnen worden;
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel12
  - number: 12.1.c
    text: geen eisen worden gesteld aan de aard of hoeveelheid van de toekomstige productie door de verzekerde;
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel12
  - number: 12.1.d
    text: de voorwaarde wordt gesteld dat de schade wordt vastgesteld door een schade-expert;
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel12
  - number: 12.1.e
    text: |-
      de verzekeraar niet tot uitkering overgaat voor zover de landbouwer van overheidswege een tegemoetkoming in de
      schade ontvangt die ertoe leidt dat hij meer compensatie ontvangt dan hij schade heeft geleden;
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel12
  - number: 12.1.f
    text: slechts één keer tot uitkering wordt gekomen voor dezelfde gebeurtenis bij dezelfde teelt;
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel12
  - number: 12.1.g
    text: de verzekering wordt aangegaan voor een periode van twaalf maanden;
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel12
  - number: 12.1.h
    text: 'de verzekering geen dekking biedt voor:'
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel12
  - number: 12.1.h.1°
    text: genomen preventiemaatregelen, en
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel12
  - number: 12.1.h.2°
    text: |-
      bereddingsmaatregelen die genomen zijn op grond van de verzekeringspolis of [artikel 7:957 BW][ref1], maar waarbij
      geen verlies als bedoeld in onderdeel a is opgetreden;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel957
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '957'
  - number: 12.1.i
    text: |-
      de verzekeraar toestemming wordt verleend door de verzekerde om diens persoonsgegevens te verwerken ten behoeve van
      de controle op de naleving van deze regeling;
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel12
  - number: 12.1.j
    text: de verzekeraar verklaart dat hij niet meer dan een keer dezelfde schade van de landbouwer verzekert;
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel12
  - number: 12.1.k
    text: |-
      de verzekeraar verklaart dat hij alle ontvangen subsidiebedragen aanwendt om de premienota van de betreffende
      landbouwer overeenkomstig de voorwaarden van deze regeling te voldoen, en
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel12
  - number: 12.1.l
    text: |-
      de verzekeraar verklaart dat de minister in kennis wordt gesteld van eventuele aanpassingen in de administratie
      van de verzekeraar, voor zover deze aanpassingen negatieve gevolgen hebben voor de betrouwbaarheid van de daarin
      verwerkte gegevens.
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel12
  - number: '12.2'
    text: |-
      De minister verleent de goedkeuring voor een periode van een jaar, en kan aan de goedkeuring nadere voorschriften
      verbinden.
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel12
  - number: '13.1'
    text: |-
      De goedkeuring, bedoeld in [artikel 12, eerste lid][ref1], kan op verzoek van de verzekeraar steeds voor een
      periode van een jaar worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0036188#Artikel12
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0036188
        artikel: '12'
        hoofdstuk: '3'
  - number: '13.2'
    text: |-
      De minister stemt in met het verzoek tot verlenging van de goedkeuring indien de verzekeringsvoorwaarden
      ongewijzigd blijven dan wel sprake is van niet-essentiële wijzigingen.
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel13
  - number: '13.3'
    text: |-
      De verzekeraar dient vóór 1 december een verzoek tot verlenging van de goedkeuring in bij de minister en meldt
      daarbij de eventuele wijzigingen van de verzekeringsvoorwaarden.
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel13
  - number: '13.4'
    text: De minister beslist binnen 6 weken op het verzoek, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel13
  - number: '14.1'
    text: 'Onder ongunstige weersomstandigheden worden in elk geval begrepen:'
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel14
  - number: 14.1.a
    text: |-
      weersomstandigheden die volgens een schade-expert of het Koninklijk Nederlands Meteorologisch Instituut met een
      natuurramp kunnen worden gelijkgesteld, en
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel14
  - number: 14.1.b
    text: 'elk van de volgende weersomstandigheden:'
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel14
  - number: 14.1.b.1°
    text: regenval;
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel14
  - number: 14.1.b.2°
    text: droogte;
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel14
  - number: 14.1.b.3°
    text: (nacht)vorst;
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel14
  - number: 14.1.b.4°
    text: sneeuw;
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel14
  - number: 14.1.b.5°
    text: ijzel;
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel14
  - number: 14.1.b.6°
    text: storm;
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel14
  - number: 14.1.b.7°
    text: hagel, of
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel14
  - number: 14.1.b.8°
    text: brand door blikseminslag.
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel14
  - number: '14.2'
    text: |-
      De weersomstandigheden, bedoeld in het eerste lid, worden geacht vooraf te zijn erkend door de minister als bedoeld
      in artikel 37, tweede lid, van verordening (EU) nr. 1305/2013. De minister kan in aanvulling daarop, na overleg met
      de brancheorganisatie van verzekeraars, ook andere ongunstige weersomstandigheden erkennen.
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel14
  - number: '15.1'
    text: |-
      In afwijking van [artikel 12, eerste lid, onderdeel a, onder 1°][ref1], mag een verzekering ook tot uitkering
      komen bij een financieel verlies van 30% of minder, mits de verzekeraar ten genoegen van de minister onderscheidt
      welk deel van de premie betrekking heeft op vergoeding van het financieel verlies van de landbouwer van
      30% of minder. In dat geval heeft de steun slechts betrekking op het gedeelte van de premie dat ziet op
      verzekeringsvoorwaarden die in overeenstemming zijn met de bepalingen van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0036188#Artikel12
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0036188
        artikel: '12'
        hoofdstuk: '3'
  - number: '15.2'
    text: Het onderscheid, bedoeld in het eerste lid, moet helder zijn omschreven in de verzekeringsvoorwaarden.
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel15
  - number: '15.3'
    text: |-
      In afwijking van [artikel 12, eerste lid, onderdeel g][ref1], mag een verzekering voor langer dan twaalf maanden
      worden aangegaan, mits de premie jaarlijks wordt betaald en de jaarlijkse premie betrekking heeft op de productie
      van een periode van twaalf maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0036188#Artikel12
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0036188
        artikel: '12'
        hoofdstuk: '3'
  - number: '15.4'
    text: |-
      De minister publiceert een lijst van de goedgekeurde verzekeringen op de website van de Rijksdienst van Ondernemend
      Nederland.
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel15
  - number: '16.1'
    text: |-
      In afwijking van [artikel 12, eerste lid, onderdeel d][ref1], mag de schade worden vastgesteld op basis van een
      rekenmodel.


      [ref1]: https://wetten.overheid.nl/BWBR0036188#Artikel12
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0036188
        artikel: '12'
        hoofdstuk: '3'
  - number: '16.2'
    text: Het rekenmodel wordt tezamen met de verzekeringsvoorwaarden goedgekeurd door de minister.
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel16
  - number: '16.3'
    text: |-
      De minister keurt het rekenmodel uitsluitend goed indien de verzekeraar aantoont dat de uitkomsten van het
      rekenmodel vergelijkbaar zijn met een schadebeoordeling door een schade-expert. Het rekenmodel bevat daartoe
      tenminste de noodzakelijke gegevens om de schade vast te kunnen stellen aan de hand van bedrijfsspecifieke gegevens
      van het landbouwbedrijf zoals het gewas en de grondsoort op perceelsniveau en de feitelijke weersomstandigheid die
      de schade veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel16
  - number: '16.4'
    text: |-
      De verzekeraar onderzoekt elk gebruik van het rekenmodel met behulp van een steekproef. De resultaten worden ter
      beschikking gehouden van de minister.
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel16
  - number: '17'
    text: |-
      De minister geeft in voorkomende gevallen uitvoering aan artikel 54, eerste en derde lid, en artikel 56 van
      verordening (EU) nr. 1306/2013.
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel17
  - number: '18'
    text: De minister verricht de controles, bedoeld in artikel 59 van Verordening (EU) nr. 1306/2013.
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel18
  - number: '19.1'
    text: |-
      De minister besluit tot het niet betalen dan wel de gehele of gedeeltelijke intrekking van de subsidie
      overeenkomstig artikel 63, eerste lid, van Verordening (EU) nr. 1306/2013.
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel19
  - number: '19.2'
    text: |-
      De minister stelt de sancties, bedoeld in artikel 63, tweede lid, van Verordening (EU) nr. 1306/2013, vast met
      inachtneming van artikel 64 van Verordening (EU) nr. 1306/2013.
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel19
  - number: '19.3'
    text: |-
      De minister geeft bij de uitvoering van de bevoegdheden, genoemd in het eerste en tweede lid, toepassing aan
      artikel 63 van verordening (EU) nr. 809/2014.
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel19
  - number: '20'
    text: |-
      Het rentetarief dat overeenkomstig artikel 7, tweede lid, van Verordening (EU) nr. 809/2014 wordt toegepast,
      betreft de wettelijke rente, bedoeld in [artikel 6:120, eerste lid, van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel120
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '120'
  - number: '21'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel21
  - number: '22'
    text: 'Deze regeling wordt aangehaald als: Regeling Subsidiëring brede weersverzekering.'
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel22
