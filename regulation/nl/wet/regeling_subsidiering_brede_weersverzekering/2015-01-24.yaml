  - number: '4'
    text: |-
      1 De subsidie bedraagt 65% van de verzekeringspremie, exclusief belastingen.

      2 De subsidie betreft enkel de oppervlakte van de verzekerde percelen die via de verzamelaanvraag als zodanig zijn
      opgegeven.
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel4
  - number: '5'
    text: |-
      1 Op een aanvraag om subsidie als bedoeld in [artikel 2, derde lid][ref1], is
      [artikel 4.2, tweede en derde lid, van de Uitvoeringsregeling rechtstreekse betalingen GLB][ref2] van
      overeenkomstige toepassing.

      2 Het subsidieplafond voor het jaar 2015 bedraagt € 9.000.000,–.


      [ref1]: https://wetten.overheid.nl/BWBR0036188#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035925#Artikel2.3
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel5
