        bwb_id: BWBR0036188
        artikel: '12'
        hoofdstuk: '3'
  - number: '14'
    text: |-
      1 Onder ongunstige weersomstandigheden worden in elk geval begrepen:

      a. weersomstandigheden die volgens een schade-expert of het Koninklijk Nederlands Meteorologisch Instituut met een
      natuurramp kunnen worden gelijkgesteld, en

      b. elk van de volgende weersomstandigheden:

      1°. regenval;

      2°. droogte;

      3°. (nacht)vorst;

      4°. sneeuw;

      5°. ijzel;

      6°. storm;

      7°. hagel, of

      8°. brand door blikseminslag.

      2 De weersomstandigheden, bedoeld in het eerste lid, worden geacht vooraf te zijn erkend door de minister als
      bedoeld in artikel 37, tweede lid, van verordening (EU) nr. 1305/2013. De minister kan in aanvulling daarop, na
      overleg met de brancheorganisatie van verzekeraars, ook andere ongunstige weersomstandigheden erkennen.
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel14
  - number: '15'
    text: |-
      1 In afwijking van [artikel 12, eerste lid, onderdeel a, onder 1°][ref1], mag een verzekering ook tot
      uitkering komen bij een financieel verlies van 30% of minder, mits de verzekeraar ten genoegen van de minister
      onderscheidt welk deel van de premie betrekking heeft op vergoeding van het financieel verlies van de landbouwer
      van 30% of minder. In dat geval heeft de steun slechts betrekking op het gedeelte van de premie dat ziet op
      verzekeringsvoorwaarden die in overeenstemming zijn met de bepalingen van deze regeling.

      2 Het onderscheid, bedoeld in het eerste lid, moet helder zijn omschreven in de verzekeringsvoorwaarden.

      3 In afwijking van [artikel 12, eerste lid, onderdeel g][ref2], mag een verzekering voor langer dan twaalf maanden
      worden aangegaan, mits de premie jaarlijks wordt betaald en de jaarlijkse premie betrekking heeft op de productie
      van een periode van twaalf maanden.

      4 De minister publiceert een lijst van de goedgekeurde verzekeringen op de website van de Rijksdienst van
      Ondernemend Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0036188#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0036188#Artikel12
