  - number: '11'
    text: |-
      1 Een verzekeraar dient vóór 1 februari een aanvraag in bij de minister voor goedkeuring van de voorwaarden van
      een verzekering.

      2 De aanvraag, bedoeld in het eerste lid, gaat vergezeld van:

      a. een onderbouwing van de premie;

      b. een verklaring van de verzekeraar dat hij zijn administratie die betrekking heeft op de verzekeringsvoorwaarden,
      ten minste vier kalenderjaren na afloop van de verzekering ter beschikking houdt van de minister;

      c. het standaardmodel van de verzekeringspolis, en

      d. documenten waarin de verzekeraar ten genoegen van de minister aantoont dat de verzekeringsvoorwaarden voldoen
      aan het bepaalde in deze regeling.

      3 De minister beslist binnen een termijn van 22 weken op de aanvraag, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel11
  - number: '12'
    text: |-
      1 De minister verleent uitsluitend goedkeuring aan de verzekeringsvoorwaarden indien:

      a. het financieel verlies van de landbouwer wordt gedekt:

      1°. voor zover dat meer is dan 30% van de gemiddelde jaarproductie in de laatste drie jaar of van de gemiddelde
      productie van drie van de laatste vijf jaar waarbij de hoogste en laagste productie van deze vijf jaar niet wordt
      meegerekend,

      2°. dat het gevolg is van een lagere opbrengst in kwantiteit of kwaliteit,

      3°. dat optreedt op een aaneengesloten stuk grond waarop één enkel gewas wordt geteeld, en

      4°. dat redelijkerwijs is toe te rekenen aan ongunstige weersomstandigheden als bedoeld in [artikel 14][ref1];

      b. alle open teelten verzekerd kunnen worden;

      c. geen eisen worden gesteld aan de aard of hoeveelheid van de toekomstige productie door de verzekerde;

      d. de voorwaarde wordt gesteld dat de schade wordt vastgesteld door een schade-expert;

      e. de verzekeraar niet tot uitkering overgaat voor zover de landbouwer van overheidswege een tegemoetkoming in de
      schade ontvangt die ertoe leidt dat hij meer compensatie ontvangt dan hij schade heeft geleden;

      f. slechts één keer tot uitkering wordt gekomen voor dezelfde gebeurtenis bij dezelfde teelt;

      g. de verzekering wordt aangegaan voor een periode van twaalf maanden;

      h. de verzekering geen dekking biedt voor:

      1°. genomen preventiemaatregelen, en

      2°. bereddingsmaatregelen die genomen zijn op grond van de verzekeringspolis of [artikel 7:957 BW][ref2], maar
      waarbij geen verlies als bedoeld in onderdeel a is opgetreden;

      i. de verzekeraar toestemming wordt verleend door de verzekerde om diens persoonsgegevens te verwerken ten behoeve
      van de controle op de naleving van deze regeling;

      j. de verzekeraar verklaart dat hij niet meer dan een keer dezelfde schade van de landbouwer verzekert;

      k. de verzekeraar verklaart dat hij alle ontvangen subsidiebedragen aanwendt om de premienota van de betreffende
      landbouwer overeenkomstig de voorwaarden van deze regeling te voldoen, en

      l. de verzekeraar verklaart dat de minister in kennis wordt gesteld van eventuele aanpassingen in de administratie
      van de verzekeraar, voor zover deze aanpassingen negatieve gevolgen hebben voor de betrouwbaarheid van de daarin
      verwerkte gegevens.

      2 De minister verleent de goedkeuring voor een periode van een jaar, en kan aan de goedkeuring nadere voorschriften
      verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0036188#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel957
