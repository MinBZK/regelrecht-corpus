  - number: '2'
    text: |-
      1 De minister verstrekt subsidie aan een landbouwer in de vorm van een financiële bijdrage voor de premie ten
      behoeve van een verzekering tegen de financiële gevolgen van ongunstige weersomstandigheden, die overeenkomstig
      [artikel 12][ref1] is goedgekeurd.

      2 De subsidie wordt verstrekt onder voorbehoud dat de Europese Commissie goedkeuring verleent aan het programma,
      bedoeld in artikel 10 van verordening (EU) nr. 1305/2013.

      3 De landbouwer die in aanmerking wil komen voor de subsidie, bedoeld in het
      eerste lid, maakt voor de aanvraag gebruik van de verzamelaanvraag, bedoeld in
      [artikel 4.2 van de Uitvoeringsregeling rechtstreekse betalingen GLB][ref2].

      4 De landbouwer legt vóór 1 november van het jaar waarin hij de aanvraag, bedoeld in het derde lid, indient de
      in [artikel 9][ref3] genoemde gegevens over. De bewijsstukken worden schriftelijk overgelegd voor zover deze niet
      elektronisch overgelegd kunnen worden.

      5 De aanvrager is van de verplichting, bedoeld in het vierde lid, vrijgesteld voor zover de bewijsstukken vóór het
      verstrijken van de in dat lid genoemde termijn door de verzekeraar worden verstrekt.

      6 [Artikel 2.3, tweede lid, van de Uitvoeringsregeling rechtstreekse betalingen GLB][ref4] is van overeenkomstige
      toepassing op een landbouwer als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0036188#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0035925#Artikel4.2
      [ref3]: https://wetten.overheid.nl/BWBR0036188#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0035925#Artikel2.3
