  - number: '3'
    text: |-
      1 Geen subsidie wordt verstrekt voor zover de landbouwer van overheidswege een andere bijdrage ontvangt voor de
      premie, bedoeld in [artikel 2, eerste lid][ref1].

      2 Geen subsidie wordt verstrekt indien de landbouwer zijn teelt niet tegen alle ongunstige weersomstandigheden,
      genoemd in [artikel 14][ref2], heeft verzekerd.

      3 Geen subsidie wordt verstrekt ten behoeve van de premie die wordt betaald voor de verzekering van de open teelt
      op landbouwgrond die is gelegen buiten Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0036188#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0036188#Artikel14
    url: https://wetten.overheid.nl/BWBR0036188/2015-01-24#Artikel3
