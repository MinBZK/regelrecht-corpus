preamble:
  text: |-
    Gelet op artikel 10, eerste lid, van Richtlijn 90/425/EEG van de Raad van de Europese Gemeenschappen van 26 juni
    1990 inzake veterinaire en zoötechnische controles in het intracommunautaire handelsverkeer in bepaalde levende
    dieren en produkten in het vooruitzicht van de totstandbrenging van de interne markt (PbEG L 224) en op artikel 11
    van Richtlijn 64/432/EEG van de Raad van de Europese Gemeenschappen van 26 juni 1964 inzake veterinairrechtelijke
    vraagstukken op het gebied van het intracommunautaire handelsverkeer in runderen en varkens (PbEG L 121);

    Gelet op de artikelen 18, eerste en tweede lid, 30, eerste en vierde lid, en 31 van de Gezondheids- en welzijnswet
    voor dieren;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012542/2001-11-01#ArtikelAanhef
articles:
  - number: IV
    text: |-
      1 Een erkenning die op grond van artikel 3.16 van de Regeling handel levende dieren en levende producten door
      de Minister is verleend, geldt als een door de Minister op grond van artikel 9b van de Regeling betreffende het
      bijeenbrengen van dieren 2000 verleende erkenning.

      2 Een runderverzamelcentrum dat door de Minister is erkend op grond van artikel 3.16 van de Regeling handel levende
      dieren en levende producten voldoet met ingang van 1 november 2001 aan de eis, bedoeld in artikel 9c, onderdeel s.

      3 Van de afstandseis als bedoeld in artikel 9c, onderdeel b, van de Regeling betreffende het bijeenbrengen van
      dieren 2000 zijn vrijgesteld de runderverzamelcentra die op grond van artikel 3.16 van de Regeling handel levende
      en levende producten erkend zijn.
    url: https://wetten.overheid.nl/BWBR0012542/2001-11-01#ArtikelIV
  - number: V
    text: |-
      1 Deze regeling wordt op 8 juni 2001 om 19.00 uur bekendgemaakt aan de media en treedt met uitzondering van artikel
      9c, onderdelen e, q, r en s, onmiddellijk daarna in werking.

      2 Artikel 9c, onderdelen e, q, r en s, treedt in werking met ingang van 1 november 2001, met dien verstande dat
      indien een runderverzamelcentrum op 1 november 2001 niet voldoet aan de eisen, bedoeld in artikel 9c, onderdelen e,
      q, r en s, de door de Minister verleende erkenning van rechtswege komt te vervallen.
    url: https://wetten.overheid.nl/BWBR0012542/2001-11-01#ArtikelV
