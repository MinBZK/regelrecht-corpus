  - number: XI.3
    text: |-
      Voor de periode van 1 augustus tot en met 31 december volgend op de inwerkingtreding van deze wet
      wordt de aanspraak op personele bekostiging berekend op grond van het bepaalde bij of krachtens
      de [artikelen 120][ref1], [129][ref2] en [132 van de Wet op het primair onderwijs][ref3], de
      [artikelen 117][ref4] en [124 van de Wet op de expertisecentra][ref5], de [artikelen 101][ref6] en
      [110 van de Wet primair onderwijs BES][ref7], en [artikel 85d van de Wet op het voortgezet onderwijs][ref8], zoals
      die bepalingen luidden op de dag voor inwerkingtreding van deze wet.


