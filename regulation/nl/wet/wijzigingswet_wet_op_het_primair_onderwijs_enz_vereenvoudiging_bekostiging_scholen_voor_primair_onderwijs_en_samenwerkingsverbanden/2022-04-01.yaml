preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de grondslagen van bekostiging voor personeels- en
    exploitatiekosten van de scholen voor primair onderwijs en samenwerkingsverbanden eenvoudiger en transparanter te
    maken, daarbij rekening houdend met belangrijke kostenbepalende factoren;

    dat in verband daarmee onder meer de Wet op het primair onderwijs, de Wet op de expertisecentra, de Wet primair
    onderwijs BES, de Wet op het voortgezet onderwijs en enkele andere wetten moeten worden gewijzigd;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0045030/2022-04-01#ArtikelAanhef
articles:
  - number: XI.1
    text: |-
      De aanspraak op bekostiging voor materiële instandhouding op grond van
      [Hoofdstuk I, Titel IV, Afdeling 4, van de Wet op het primair onderwijs][ref1],
      [Hoofdstuk I, Titel III, Afdeling 4, van de Wet op de expertisecentra](onbekend) en
      [Hoofdstuk I, Titel III, Afdeling 4, van de Wet primair onderwijs BES][ref2], zoals die luidden op de dag voor
      inwerkingtreding van deze wet, blijft van kracht tot en met 31 december van het jaar van inwerkingtreding van deze
      wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Afdeling4
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Afdeling4
    url: https://wetten.overheid.nl/BWBR0045030/2022-04-01#ArtikelXI
