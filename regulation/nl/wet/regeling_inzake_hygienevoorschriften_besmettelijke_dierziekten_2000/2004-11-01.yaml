      [ref5]: https://wetten.overheid.nl/BWBR0012010#Artikel15
      [ref6]: https://wetten.overheid.nl/BWBR0012010#Artikel18
      [ref7]: https://wetten.overheid.nl/BWBR0012010#Artikel19
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel2
