  - number: '2.2'
    text: |-
      In het eerste lid wordt onder het vervoeren met een vervoermiddel mede verstaan het aanwezig zijn van een
      vervoermiddel waarmee kennelijk evenhoevigen zijn of zullen worden vervoerd, op of in de nabijheid van plaatsen
      waar kennelijk evenhoevigen zijn gelost of geladen, dan wel waar gewoonlijk evenhoevigen worden gelost of geladen,
      met inbegrip van de daarbij behorende parkeerplaatsen.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel2
  - number: 2a
    text: |-
      Indien een vervoerder van evenhoevigen het bepaalde in deze regeling bij herhaling overtreedt, kan de minister de
      erkenning, bedoeld in [artikel 8, tweede lid, van het Besluit dierenvervoer 1994][ref1], schorsen of intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0006990#Artikel8
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0006990
        artikel: '8'
  - number: '3'
    text: |-
      Het is verboden een of meer evenhoevigen te vervoeren met een vervoermiddel waaruit uitwerpselen, strooisel of
      voeder kunnen lopen of vallen.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel3
  - number: '5.1'
    text: |-
      Het is verboden een of meer evenhoevigen te ontvangen op een houderij van evenhoevigen of slachtplaats met
      geringe capaciteit, tenzij op dat bedrijf of die plaats een voorziening voor de reiniging en ontsmetting van
      vervoermiddelen voor evenhoevigen aanwezig is die voldoet aan [bijlage I, deel A][ref1], bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0012010
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012010
  - number: '5.2'
    text: |-
      Het is verboden een of meer evenhoevigen of vervoermiddelen voor evenhoevigen te vervoeren naar, dan wel een of
      meer evenhoevigen, af te leveren, te ontvangen of te houden op een slachtplaats, niet zijnde een slachtplaats
      met geringe capaciteit, verzamelcentrum voor evenhoevigen of een andere, voor de reiniging en ontsmetting van
      vervoermiddelen bestemde of gebruikte plaats, tenzij die plaats beschikt over een reinigings- en ontsmettingsplaats
      voor vervoermiddelen die is geregistreerd overeenkomstig [artikel 23, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012010#Artikel23
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012010
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '5.3'
    text: |-
      Het is verboden een of meer evenhoevigen te ontvangen op een houderij van evenhoevigen of een slachtplaats met
      geringe capaciteit, bij een temperatuur van 0° C of lager, tenzij
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel5
  - number: 5.3.a
    text: |-
      dat bedrijf of die plaats beschikt over een reinigings- en ontsmettingsplaats voor vervoermiddelen die is
      geregistreerd overeenkomstig [artikel 23, eerste lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0012010#Artikel23
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012010
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 5.3.b
    text: |-
      de voorziening, bedoeld in het eerste lid, zodanig is ingericht dat een deugdelijke en efficiënte reiniging en
      ontsmetting van vervoermiddelen onder alle klimatologische omstandigheden ongehinderd, met voldoende capaciteit in
      relatie tot de werkzaamheden op het bedrijf en ongeacht het type vervoermiddel kan plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel5
  - number: 5a
    text: |-
      De voorziening, bedoeld in [artikel 5, eerste lid][ref1], wordt uitsluitend gebruikt voor het reinigen en
      ontsmetten van vervoermiddelen voor evenhoevigen.


      [ref1]: https://wetten.overheid.nl/BWBR0012010#Artikel5
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0012010
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 5b.1
    text: |-
      Een aanvraag om een vergunning als bedoeld in artikel 5, vierde lid, wordt ingediend bij de VWA met gebruikmaking
      van een daartoe bestemd aanvraagformulier.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel5b
  - number: 5b.2
    text: |-
      Een vergunning als bedoeld in artikel 5, vierde lid, wordt slechts verleend indien de eigenaar of exploitant van
      de slachtplaats met geringe capaciteit ten genoegen van de minister aan de hand van schriftelijke stukken aantoont
      dat:
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel5b
  - number: 5b.2.a
    text: uitsluitend andere evenhoevigen dan varkens op de slachtplaats worden geslacht;
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel5b
  - number: 5b.2.b
    text: de op de slachtplaats geslachte dieren worden geslacht ten behoeve van de eigen verkoop aan consumenten;
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel5b
  - number: 5b.2.c
    text: |-
      voor de duur van de vergunning een schriftelijke overeenkomst is gesloten met de eigenaar of exploitant van een in
      de vergunning te noemen in de directe nabijheid gelegen reinigings- en ontsmettingsplaats voor vervoermiddelen, die
      is geregistreerd overeenkomstig artikel 23, eerste lid, waaruit blijkt dat vervoermiddelen die op de slachtplaats
      dieren hebben afgeleverd op deze reinigings- en ontsmettingsplaats worden gereinigd en ontsmet.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel5b
  - number: 5b.3
    text: |-
      De eigenaar of exploitant van de slachtplaats met geringe capaciteit, die beschikt over een vergunning als bedoeld
      in artikel 5, vierde lid:
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel5b
  - number: 5b.3.a
    text: houdt op het bedrijf een register als bedoeld in artikel 22 bij;
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel5b
  - number: 5b.3.b
    text: |-
      toont aan dat direct na lossing van dieren op de slachtplaats de vervoermiddelen steeds zijn gereinigd en ontsmet
      op de in de vergunning genoemde reinigings- en ontsmettingsplaats en bewaart daartoe in elk geval afschriften van
      het bewijs, bedoeld in artikel 21, derde lid;
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel5b
  - number: 5b.3.c
    text: |-
      vermeldt in het geschrift, bedoeld in artikel 17, eerste lid, de datum, het tijdstip en de plaats van lossing van
      de evenhoevigen, alsmede het nummer van de vergunning en de naam van de in de vergunning genoemde reinigings- en
      ontsmettingsplaats.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel5b
  - number: 5b.4
    text: De vergunning wordt verleend voor één jaar en kan jaarlijks op aanvraag worden verlengd.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel5b
  - number: 5b.5
    text: |-
      De in het vierde lid bedoelde aanvraag tot verlenging wordt tenminste 8 weken vóór afloop van de vergunning bij de
      VWA ingediend.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel5b
  - number: 5c.1
    text: |-
      Indien naar het oordeel van de minister niet wordt voldaan aan één of meer onderdelen van
      [artikel 5b, tweede of derde lid][ref1], wordt de eigenaar of exploitant hiervan op de hoogte gebracht en in de
      gelegenheid gesteld binnen een bepaalde termijn alsnog aan deze eisen te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0012010#Artikel5b
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel5c
    references:
      - id: ref1
        bwb_id: BWBR0012010
        artikel: 5b
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 5c.2
    text: |-
      De minister kan de vergunning, bedoeld in [artikel 5, vierde lid][ref1], schorsen voor een bepaalde termijn indien
      de termijn, bedoeld in het eerste lid, is verstreken en de eigenaar of exploitant nog steeds niet voldoet aan één
      of meer onderdelen van [artikel 5b, tweede of derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012010#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0012010#Artikel5b
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel5c
    references:
      - id: ref1
        bwb_id: BWBR0012010
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0012010
        artikel: 5b
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 5c.3
    text: |-
      Het is verboden een of meer evenhoevigen te ontvangen op een slachtplaats met geringe capaciteit in geval van
      schorsing van de vergunning, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel5c
  - number: 5c.4
    text: |-
      De minister kan de vergunning, bedoeld in [artikel 5, vierde lid][ref1], intrekken indien:


      [ref1]: https://wetten.overheid.nl/BWBR0012010#Artikel5
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel5c
    references:
      - id: ref1
        bwb_id: BWBR0012010
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 5c.4.a
    text: de eigenaar of exploitant van de slachtplaats met geringe capaciteit niet voldoet aan het derde lid;
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel5c
  - number: 5c.4.b
    text: |-
      na afloop van de schorsing, bedoeld in het tweede lid, blijkt dat de eigenaar of exploitant nog steeds niet voldoet
      aan één of meer onderdelen van [artikel 5b, tweede of derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012010#Artikel5b
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel5c
    references:
      - id: ref1
        bwb_id: BWBR0012010
        artikel: 5b
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '6.1'
    text: |-
      De vervoerder is verplicht een vervoermiddel, de daarbij behorende voorwerpen daaronder begrepen, waarmee een of
      meer evenhoevigen worden vervoerd terstond na lossing op de plaats van lossing te reinigen en te ontsmetten en
      daarvan aantekening te maken in het in [artikel 17, eerste lid][ref1], bedoelde geschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0012010#Artikel17
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012010
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '6.2'
    text: |-
      Het eerste lid is niet van toepassing op het vervoer van evenhoevigen, niet zijnde varkens, die uitsluitend
      rechtstreeks van de stal of de weide naar een andere weide en terug worden vervoerd met een vervoermiddel, mits het
      vervoermiddel zo spoedig mogelijk na dit vervoer wordt gereinigd en ontsmet en daarvan aantekening wordt gemaakt in
      het in [artikel 17, eerste lid][ref1], bedoelde geschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0012010#Artikel17
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012010
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '6.3'
    text: |-
      Het eerste lid is niet van toepassing indien de vervoerder evenhoevigen, niet zijnde varkens, heeft gelost bij een
      slachtplaats met geringe capaciteit, waarvan de eigenaar of exploitant beschikt over een vergunning als bedoeld in
      [artikel 5, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012010#Artikel5
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012010
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '7.1'
    text: |-
      Een ongeladen vervoermiddel waarmee een of meer evenhoevigen zijn vervoerd, wordt niet op de openbare weg dan
      wel op een houderij van evenhoevigen, slachtplaats, verzamelcentrum voor evenhoevigen, of andere plaats waar
      evenhoevigen verblijven gebracht, tenzij het vervoermiddel is gereinigd en ontsmet en die reiniging en ontsmetting
      is vermeld in het in [artikel 17, eerste lid][ref1], bedoelde geschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0012010#Artikel17
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0012010
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '7.2'
    text: |-
      Het eerste lid is niet van toepassing op het vervoer van evenhoevigen als bedoeld in [artikel 6, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012010#Artikel6
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0012010
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 7a
    text: |-
      Artikel 7, eerste lid, is niet van toepassing op het vervoer van een vervoermiddel over de openbare weg vanaf een
      slachtplaats met geringe capaciteit, waarvan de eigenaar of exploitant beschikt over een vergunning als bedoeld in
      artikel 5, vierde lid, mits:
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel7a
  - number: 7a.1
    text: voldaan is aan artikel 5b, derde lid, onder c en
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel7a
  - number: 7a.2
    text: |-
      het vervoermiddel direct na lossing op de slachtplaats rechtstreeks, langs de kortste weg naar de in de vergunning
      aangewezen reinigings- en ontsmettingsplaats rijdt om aldaar gereinigd en ontsmet te worden.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel7a
  - number: '8.1'
    text: Met een vervoermiddel worden niet tegelijkertijd verschillende diersoorten vervoerd.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel8
  - number: '8.2'
    text: |-
      De vervoerder van schapen en geiten voldoet aan artikel 8 quater, derde lid, van [richtlijn nr. 91/68/EEG]
      (31991L0068).
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel8
  - number: '10.1'
    text: |-
      Een vervoermiddel waarmee een of meer evenhoevigen worden vervoerd, wordt na aankomst op de plaats van aflevering
      geheel gelost.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel10
  - number: '10.2'
    text: |-
      De eigenaar of exploitant, dan wel diens vertegenwoordiger, van de plaats waar evenhoevigen worden gelost, verleent
      alle medewerking aan de reiniging en ontsmetting van het vervoermiddel waarmee de evenhoevigen zijn vervoerd.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel10
  - number: 10a.1
    text: |-
      Indien voor het vervoer van varkens naar een lidstaat of een derde land, nadat deze reeds van een
      varkenshouderijbedrijf zijn afgevoerd, ingevolge artikel 59, tweede lid, onderdeel e, van de wet in samenhang met
      artikel 6, eerste lid, van het Besluit dierenvervoer 1994 geen certificaat wordt afgegeven, is het in zoverre in
      afwijking van artikel 10, eerste lid, toegestaan het vervoermiddel waarmee deze varkens vervoerd zijn, na aankomst
      op het varkenshouderijbedrijf van herkomst, gedeeltelijk te lossen.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel10a
  - number: 10a.2
    text: |-
      De vervoerder draagt er in zoverre in afwijking van artikel 6, eerste lid, van deze regeling, artikel 2, eerste
      lid, van de regeling van 1 maart 2001 betreffende de uitbreiding van de reinigings- en ontsmettingsmaatregelen voor
      vervoermiddelen bestemd voor het vervoer van evenhoevigen en artikel 2.11 van de Regeling handel levende dieren
      en levende producten, zorg voor dat de wielen en de wielkasten van een vervoermiddel als bedoeld in het eerste
      lid na aankomst op het varkenshouderijbedrijf van herkomst, zo spoedig mogelijk na de lossing, maar voordat het
      vervoermiddel dit bedrijf weer verlaat, op de plaats van lossing worden gereinigd en ontsmet.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel10a
  - number: 10a.3
    text: |-
      De reiniging en ontsmetting als bedoeld in het tweede lid heeft plaats door middel van een installatie die water
      levert van voldoende druk voor een deugdelijke en efficiënte reiniging en ontsmetting.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel10a
  - number: '12.1'
    text: |-
      Een vervoermiddel dat kennelijk is gebruikt voor het vervoeren van een of meer evenhoevigen in een
      lidstaat dan wel in een derde land en leeg vanuit die lidstaat, onderscheidenlijk dat derde land, anders
      dan in doorvoer in Nederland wordt gebracht, wordt onmiddellijk gereinigd en ontsmet op een op grond van
      [artikel 23, eerste lid][ref1], geregistreerde reinigings- en ontsmettingsplaats voor vervoermiddelen. De
      vervoerder toont binnen 24 uur na binnenkomst aan de VWA het bewijs, bedoeld in [artikel 21, derde lid][ref2],.


      [ref1]: https://wetten.overheid.nl/BWBR0012010#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0012010#Artikel21
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0012010
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0012010
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '12.2'
    text: |-
      Het eerste lid is niet van toepassing op een vervoermiddel waarvan de vervoerder binnen 24 uur na binnenkomst
      in Nederland aan de VWA een bewijs zendt dat het vervoermiddel is gereinigd en ontsmet op een reinigings- en
      ontsmettingsplaats in de lidstaat, bedoeld in het eerste lid, welke plaats is erkend in de zin van artikel 12,
      eerste lid, onderdeel b, van [Richtlijn 64/432/EEG](31964L0432) van de Raad van de Europese Gemeenschappen.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel12
  - number: '12.3'
    text: |-
      Het tweede lid is niet van toepassing op een vervoermiddel dat kennelijk is gebruikt voor het anders dan in
      doorvoer vervoeren van één of meer evenhoevigen in Italië of in Slowakije en ongeladen vanuit één van deze gebieden
      in Nederland wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel12
  - number: '13.1'
    text: |-
      Een vervoermiddel waarmee een of meer evenhoevigen in Nederland worden gebracht, afkomstig uit een lidstaat of een
      derde land, en dat wordt gelost, wordt op de plaats van lossing zo spoedig mogelijk na de lossing, tezamen met de
      bij het vervoermiddel behorende voorwerpen gereinigd en ontsmet. De vervoerder toont binnen 24 uur na binnenkomst
      aan de VWA het bewijs, bedoeld in [artikel 21, derde lid][ref1], dat de reiniging en ontsmetting is geschied.


      [ref1]: https://wetten.overheid.nl/BWBR0012010#Artikel21
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012010
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '13.2'
    text: |-
      Een vervoermiddel waarmee een of meer evenhoevigen in Nederland worden gebracht, afkomstig uit een lidstaat of
      een derde land, en dat wordt gelost op een plaats die niet beschikt over een reinigings- en ontsmettingsplaats als
      bedoeld in [artikel 23, eerste lid][ref1], wordt na reiniging en ontsmetting op de plaats van lossing onmiddellijk
      vervoerd naar een reinigings- en ontsmettingsplaats als bedoeld in [artikel 23, eerste lid][ref2], om aldaar te
      worden gereinigd en ontsmet.


      [ref1]: https://wetten.overheid.nl/BWBR0012010#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0012010#Artikel23
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012010
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0012010
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '14.1'
    text: |-
      De vervoerder van een vervoermiddel dat in een lidstaat dan wel in een derde land is gebruikt om een of meer
      evenhoevigen te vervoeren en leeg vanuit die lidstaat, onderscheidenlijk dat derde land, in Nederland wordt
      gebracht en welk vervoermiddel niet voldoet aan artikel 12, tweede lid en derde lid, brengt dit vervoermiddel niet
      op enige plaats, tenzij om te voldoen aan artikel 12, eerste lid.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel14
  - number: '14.2'
    text: |-
      De vervoerder van een vervoermiddel dat is geladen met een of meer evenhoevigen uit een lidstaat dan wel uit een
      derde land dat anders dan in doorvoer in Nederland wordt gebracht, brengt dit vervoermiddel voorafgaand aan lossen
      niet op een andere plaats dan de plaats van aflevering opgenomen in het gezondheidscertificaat, bedoeld in artikel
      5 van [richtlijn nr. 64/432/EEG](31964L0432) van de Raad van de Europese Gemeenschappen van 26 juni 1964 inzake
      veterinairrechtelijke vraagstukken op het gebied van het intracommunautaire handelsverkeer in runderen en varkens
      (PbEG L 121), artikel 9 van [richtlijn nr. 91/68/EEG](31991L0068) van de Raad van de Europese Gemeenschappen
      van 28 januari 1991 inzake veterinairrechtelijke voorschriften voor het intracommunautaire handelsverkeer in
      schapen en geiten (PbEG L 46), artikel 11 van [richtlijn nr. 72/462/EEG](31972L0462) van de Raad van de Europese
      Gemeenschappen van 12 december 1972 inzake gezondheidsvraagstukken en veterinairrechtelijke vraagstukken bij de
      invoer van runderen, varkens, schapen, geiten, van vers vlees of van vleesproducten uit derde landen (PbEG L 302),
      onderscheidenlijk artikel 6 van [richtlijn nr. 92/65/EEG](31992L0065) van de Raad van de Europese Gemeenschappen
      van 13 juli 1992 tot vaststelling van de veterinairrechtelijke voorschriften voor het handelsverkeer en de invoer
      in de Gemeenschap van dieren, sperma, eicellen en embryo's waarvoor ten aanzien van de veterinairrechtelijke
      voorschriften geen specifieke communautaire regelgeving als bedoeld in bijlage A, onder I, van [Richtlijn 90/425/
      EEG](31990L0425) geldt (PbEG L 268).
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel14
  - number: '15'
    text: |-
      Een ongeladen vervoermiddel waarmee een of meer evenhoevigen zijn of kunnen worden vervoerd, wordt niet
      toegelaten op een houderij van evenhoevigen, tenzij de eigenaar of exploitant van deze houderij dan wel diens
      vertegenwoordiger:
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel15
  - number: '15.1'
    text: vaststelt dat het vervoermiddel is gereinigd en ontsmet;
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel15
  - number: '15.2'
    text: |-
      vaststelt dat in het in [artikel 17, eerste lid][ref1], bedoelde, bij het betrokken vervoermiddel behorende
      geschrift van de reiniging en ontsmetting melding is gemaakt, dan wel dat door de vervoerder, indien het een
      vervoermiddel betreft waarin of waarbij ingevolge deze regeling een dergelijk geschrift niet aanwezig behoeft te
      zijn, de reiniging en ontsmetting op andere wijze kan worden aangetoond, en


      [ref1]: https://wetten.overheid.nl/BWBR0012010#Artikel17
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0012010
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '15.3'
    text: |-
      voldoet aan [artikel 22][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012010#Artikel22
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0012010
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '16'
    text: |-
      De reiniging en ontsmetting, bedoeld in de [artikelen 6][ref1], [7][ref2], [12][ref3] en [13][ref4] geschieden
      overeenkomstig de in [bijlage II][ref5] bij deze regeling opgenomen voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0012010#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0012010#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0012010#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0012010#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0012010
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0012010
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0012010
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0012010
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0012010
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0012010
  - number: '17.1'
    text: |-
      De vervoerder van een vervoermiddel waarmee evenhoevigen worden vervoerd, vermeldt in het daartoe door de Minister,
      per vervoerseenheid verstrekte geschrift elke datum en elk tijdstip waarop, alsmede het adres van elke plaats waar
      reiniging en ontsmetting van dat vervoermiddel heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel17
  - number: '17.2'
    text: |-
      In aanvulling op het eerste lid houdt de vervoerder van een vervoermiddel waarmee schapen of geiten worden vervoerd
      een register bij dat voldoet aan artikel 8 quater, tweede lid, van [richtlijn nr. 91/68/EEG](31991L0068).
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel17
  - number: '17.3'
    text: |-
      De vervoerder van een vervoermiddel waarmee schapen of geiten worden vervoerd, overlegt aan de VWA een
      schriftelijke verklaring als bedoeld in artikel 8 quater, vierde lid, van [richtlijn nr. 91/68/EEG](31991L0068).
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel17
  - number: '17.4'
    text: |-
      Indien de reiniging en ontsmetting plaatsvindt op een reinigings- en ontsmettingsplaats als bedoeld in
      [artikel 23][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0012010#Artikel23
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0012010
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 17.4.a
    text: |-
      wordt de vermelding van de reiniging en ontsmetting in het geschrift, bedoeld in het eerste lid, voorzien van het
      stempel van de eigenaar of exploitant, dan wel diens vertegenwoordiger, van de reinigings- en ontsmettingsplaats,
      waarin de naam en het adres van die plaats is te lezen, alsmede van de handtekening van de persoon die namens de
      eigenaar of exploitant de reiniging of ontsmetting heeft verricht of daarop toezicht heeft gehouden, en
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel17
  - number: 17.4.b
    text: |-
      worden de datum en het tijdstip waarop de reiniging en ontsmetting heeft plaatsgevonden, door de eigenaar
      of exploitant, dan wel diens vertegenwoordiger, van de reinigings- en ontsmettingsplaats, bijgehouden in een
      daartoe bestemd register, onder vermelding van de naam van de persoon die en in voorkomend geval het bedrijf
      dat of de organisatie die namens de eigenaar of exploitant de reiniging of ontsmetting heeft verricht of daarop
      toezicht heeft gehouden, alsmede van het kenteken van ieder vervoermiddel en het nummer dat is vermeld op het
      goedkeuringsbewijs, bedoeld in [artikel 9, eerste lid, van de Regeling dierenvervoer][ref1], dat bij het betrokken
      vervoermiddel behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0007482#Artikel9
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007482
        artikel: '9'
  - number: '17.5'
    text: |-
      Het register, bedoeld in het tweede lid, onderdeel b, wordt op de reinigings- en ontsmettingsplaats, bedoeld in het
      tweede lid, bewaard, voorzover het register vermeldingen bevat van reinigingen en ontsmettingen die korter dan drie
      jaren geleden hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel17
  - number: '17.6'
    text: |-
      De eigenaar of exploitant, dan wel diens vertegenwoordiger van de reinigings- en ontsmettingsplaats, bedoeld in
      [artikel 23][ref1], verstrekt de VWA:


      [ref1]: https://wetten.overheid.nl/BWBR0012010#Artikel23
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0012010
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 17.6.a
    text: de namen van de personen en het bedrijf of de organisatie, bedoeld in het tweede lid, onderdeel b, en
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel17
  - number: 17.6.b
    text: |-
      een afschrift van een overeenkomstig de aanwijzingen van de Minister opgesteld geschrift, waarin is vastgelegd op
      welke wijze het proces van reiniging en ontsmetting van vervoermiddelen op die reinigings- en ontsmettingsplaats
      wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel17
  - number: '17.7'
    text: |-
      Indien de reiniging en ontsmetting plaatsvindt op een houderij van evenhoevigen wordt de vermelding van de
      reiniging en ontsmetting in het geschrift, bedoeld in het eerste lid, voorzien van de handtekening van de
      eigenaar of exploitant, dan wel diens vertegenwoordiger, van dat bedrijf, nadat deze de reiniging en ontsmetting
      van het vervoermiddel heeft gecontroleerd en heeft vastgesteld dat deze overeenkomstig [bijlage II][ref1] heeft
      plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0012010
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0012010
  - number: '17.8'
    text: |-
      Het geschrift, bedoeld in het eerste lid, is in of bij het betreffende vervoermiddel aanwezig, zolang dat geschrift
      vermeldingen bevat van reinigingen en ontsmettingen die korter dan twee maanden geleden hebben plaatsgevonden. De
      vervoerder bewaart het geschrift vervolgens gedurende drie jaren na de datum waarop de laatste in het geschrift
      vermelde reiniging of ontsmetting heeft plaatsgevonden, op zijn bedrijf of onderneming.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel17
  - number: '17.9'
    text: |-
      De vervoerder draagt er zorg voor dat in of bij de tot zijn bedrijf of onderneming behorende vervoermiddelen tijdig
      en voldoende geschriften als bedoeld in het eerste lid aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel17
  - number: '17.10'
    text: |-
      In of bij een vervoermiddel waarmee een of meer runderen of varkens zijn vervoerd, is gedurende ten minste
      tien dagen na het betreffende vervoer tevens een afschrift aanwezig van het vervoersdocument, bedoeld in de
      [Regeling identificatie en registratie van dieren 2003][ref1], en van het gezondheidscertificaat, bedoeld
      in [Richtlijn 64/432/EEG](31964L0432) van de Raad van de Europese Gemeenschappen van 26 juni 1964 inzake
      veterinairrechtelijke vraagstukken op het gebied van het intracommunautaire handelsverkeer in runderen en varkens
      (PbEG L 121), dan wel [Richtlijn 72/462/EEG](31972L0462) van de Raad van de Europese Gemeenschappen van 12 december
      1972 inzake gezondheidsvraagstukken en veterinairrechtelijke vraagstukken bij de invoer van runderen, varkens,
      schapen en geiten, van vers vlees of van vleesproducten uit derde landen (PbEG L 302), die de partij runderen of
      varkens hebben vergezeld, een en ander voorzover dit document, onderscheidenlijk certificaat, voor de betreffende
      runderen of varkens is voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0014538
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0014538
  - number: '17.11'
    text: |-
      De vervoerder bewaart de in het achtste lid bedoelde afschriften op zijn bedrijf of onderneming gedurende drie
      jaren, gerekend vanaf het tijdstip waarop de afschriften op het bedrijf of de onderneming aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel17
  - number: '17.12'
    text: |-
      De chauffeur van een vervoermiddel waarmee een of meer runderen of varkens worden vervoerd, draagt er zorg voor
      dat, alvorens het vervoermiddel het Nederlands grondgebied verlaat vóór het verstrijken van de termijn, bedoeld
      in het achtste lid, de in het vervoermiddel aanwezige afschriften, bedoeld in dat lid, op het bedrijf of de
      onderneming waartoe het vervoermiddel behoort, aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel17
  - number: '17.13'
    text: Het geschrift, bedoeld in het eerste lid, is te allen tijde in het vervoermiddel aanwezig.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel17
  - number: '19'
    text: |-
      Artikel 17 is van overeenkomstige toepassing op een vervoermiddel waarmee een of meer runderen of varkens zijn
      vervoerd, dat blijkens zijn kenteken in het buitenland thuishoort, met dien verstande dat waar in dat artikel
      sprake is van de vermelding van gegevens in het door de Minister verstrekte geschrift, de bedoelde gegevens ook op
      andere wijze mogen worden vastgelegd, mits dit geschiedt op een wijze die voor een ambtenaar als bedoeld in artikel
      114, eerste lid, van de wet, controleerbaar is.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel19
  - number: '21.1'
    text: |-
      Bij een vermelding als bedoeld in artikel 17, tweede lid, wordt aangetekend dat de reiniging en ontsmetting
      betrekking heeft op een reiniging en ontsmetting als bedoeld in artikel 12, onderscheidenlijk 13, is verricht.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel21
  - number: '21.2'
    text: |-
      Indien het vervoermiddel blijkens zijn kenteken in het buitenland thuishoort, wordt door de eigenaar of de
      exploitant van de reinigings- en ontsmettingsplaats dan wel diens vertegenwoordiger, bedoeld in artikel 17, tweede
      lid, onderdeel b, aan de vervoerder van dat vervoermiddel een reinigings- en ontsmettingsverklaring afgegeven die
      in het vervoermiddel wordt bewaard.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel21
  - number: '21.3'
    text: |-
      De eigenaar of de exploitant van de reinigings- en ontsmettingsplaats dan wel diens vertegenwoordiger, bedoeld
      in artikel 17, tweede lid, onderdeel b, verstrekt na afloop van de reiniging en ontsmetting aan de vervoerder
      een bewijs, overeenkomstig het in bijlage III bij deze regeling gevoegde model, dat de reiniging en ontsmetting
      is geschied.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel21
  - number: '22'
    text: |-
      De eigenaar of exploitant van een houderij van evenhoevigen, verzamelcentrum voor evenhoevigen, of slachtplaats,
      dan wel diens vertegenwoordiger, vermeldt in een op het bedrijf aanwezig register de datum van de aanwezigheid, het
      tijdstip van de laatste reiniging en ontsmetting, alsmede het kenteken en het nummer van het in artikel 17, tweede
      lid, onderdeel b, bedoelde goedkeuringsbewijs van elk vervoermiddel waarmee een of meer evenhoevigen zijn of worden
      vervoerd, waarbij:
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel22
  - number: 22.a
    text: |-
      indien het een Nederlands vervoermiddel betreft, het tijdstip van de laatste reiniging en ontsmetting van het
      betrokken vervoermiddel wordt overgenomen uit het geschrift, bedoeld in artikel 17;
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel22
  - number: 22.b
    text: |-
      indien het een leeg vervoermiddel als bedoeld in artikel 12, eerste lid, betreft dat blijkens het kenteken in het
      buitenland thuishoort, het tijdstip van de laatste reiniging en ontsmetting wordt overgenomen uit de verklaring,
      bedoeld in artikel 21;
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel22
  - number: 22.c
    text: |-
      indien het een geladen vervoermiddel als bedoeld in artikel 13, eerste lid, betreft dat blijkens het kenteken in
      het buitenland thuishoort, als datum van de laatste reiniging en ontsmetting wordt overgenomen de
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel22
  - number: '23.1'
    text: 'Registratie van een reinigings- en ontsmettingsplaats vindt slechts plaats, indien:'
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel23
  - number: 23.1.a
    text: |-
      de plaats voldoet aan de eisen, opgenomen in [bijlage I, deel B][ref1], bij deze regeling, en


      [ref1]: https://wetten.overheid.nl/BWBR0012010
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0012010
  - number: 23.1.b
    text: |-
      de eigenaar of exploitant, dan wel diens vertegenwoordiger, van de plaats door middel van een daartoe opgesteld
      document ten genoegen van de minister garandeert dat de reiniging en ontsmetting van vervoermiddelen voor
      evenhoevigen die op zijn bedrijf worden gebracht, op adequate wijze en in overeenstemming met deze regeling
      geschieden.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel23
  - number: '23.2'
    text: De registratie geschiedt door de minister nadat is gebleken dat aan het eerste lid is voldaan.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel23
  - number: '23.3'
    text: De aanvraag voor een registratie wordt schriftelijk ingediend bij de VWA.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel23
  - number: '23.4'
    text: Aan een reinigings- en ontsmettingsplaats die is geregistreerd, wordt een registratienummer toegekend.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel23
  - number: '23.5'
    text: 'De registratie kan door de minister worden ingetrokken, indien:'
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel23
  - number: 23.5.a
    text: niet langer wordt voldaan aan de voorwaarden voor registratie;
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel23
  - number: 23.5.b
    text: |-
      de eigenaar of exploitant van de reinigings- en ontsmettingsplaats dan wel diens vertegenwoordiger, waaronder
      mede begrepen degene die op grond van [artikel 17, tweede lid, onderdeel b][ref1], de reiniging verricht of daarop
      toezicht houdt, bij aankomst van een leeg vervoermiddel dat niet of onvoldoende is gereinigd, niet terstond meldt
      bij de Algemene Inspectiedienst;


      [ref1]: https://wetten.overheid.nl/BWBR0012010#Artikel17
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0012010
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 23.5.c
    text: niet wordt gehandeld overeenkomstig hetgeen in het eerste lid, onderdeel b bedoelde document is gegarandeerd, of
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel23
  - number: 23.5.d
    text: |-
      de eigenaar of exploitant van de reinigings- en ontsmettingsplaats dan wel diens vertegenwoordiger, waaronder
      mede begrepen degene die op grond van [artikel 17, tweede lid, onderdeel b][ref1], de reiniging verricht of
      daarop toezicht houdt, enig ander van toepassing zijnd voorschrift van deze regeling op de reinigings- en
      ontsmettingsplaats niet naleeft.


      [ref1]: https://wetten.overheid.nl/BWBR0012010#Artikel17
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0012010
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '23.6'
    text: |-
      De Minister houdt een register bij van geregistreerde reinigings- en ontsmettingsplaatsen dat ter inzage ligt bij
      de VWA.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel23
  - number: '24'
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel24
  - number: 24.a
    text: een of meer varkens te ontvangen op een varkenshouderijbedrijf;
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel24
  - number: 24.b
    text: een of meer varkens op een varkenshouderijbedrijf te houden, dan wel
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel24
  - number: 24.c
    text: 'een of meer varkens die zich op een varkenshouderijbedrijf bevinden, ten vervoer af te staan, tenzij:'
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel24
  - number: 24.c.1
    text: |-
      op het bedrijf een zodanige (erf)afsluiting aanwezig is rondom de gebouwen waar dieren worden gehouden en het
      bedrijfsterrein, dat een directe toegang tot deze gebouwen en dat terrein onmogelijk is;
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel24
  - number: 24.c.2
    text: |-
      in het bedrijf de ruimten van gebouwen, voorzover in die ruimten een of meer varkens worden gehouden, door een slot
      afgesloten kunnen worden en bij afwezigheid van de houder afgesloten zijn;
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel24
  - number: 24.c.3
    text: |-
      op het bedrijf in de ruimten van gebouwen, voorzover in die ruimten een of meer evenhoevigen worden gehouden, geen
      andere landbouwhuisdieren aanwezig zijn of kunnen komen;
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel24
  - number: 24.c.4
    text: |-
      op het bedrijf in de gebouwen waar een of meer varkens worden gehouden, deugdelijke ongediertebestrijding
      plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel24
  - number: 24.c.5
    text: op het bedrijf aanwezige, lege vervoermiddelen zijn gereinigd en ontsmet;
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel24
  - number: 24.c.6
    text: |-
      op het bedrijf aanwezige producten en voorwerpen die van buiten het bedrijf afkomstig zijn, zijn gereinigd en
      ontsmet, voorzover de aard van die producten en voorwerpen zich niet verzet tegen reiniging en ontsmetting;
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel24
  - number: 24.c.7
    text: op het bedrijf aanwezige personen gekleed zijn in bedrijfskleding en laarzen van het bedrijf;
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel24
  - number: 24.c.8
    text: |-
      de kadaverplaatsen waarop kadavers ter destructie worden aangeboden, voldoen aan de in [bijlage V][ref1] bij deze
      regeling opgenomen inrichtings- en gebruikseisen;


      [ref1]: https://wetten.overheid.nl/BWBR0012010
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0012010
  - number: 24.c.9
    text: |-
      op het bedrijf tot het bedrijf behorende drijfschotten voor het verplaatsen van varkens en merktangen of slaghamers
      voor het aanbrengen van identificatiemerken aanwezig zijn;
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel24
  - number: 24.c.10
    text: |-
      de eigenaar of exploitant van het bedrijf, dan wel diens vertegenwoordiger, dan wel degene die op dat bedrijf
      een of meer varkens houdt, al datgene heeft gedaan wat in redelijkheid in zijn vermogen ligt om het optreden van
      besmettelijke dierziekten op het bedrijf te voorkomen;
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel24
  - number: 24.c.11
    text: |-
      in geval de eigenaar of exploitant van het bedrijf, dan wel diens vertegenwoordiger, dan wel degene die op dat
      bedrijf een of meer varkens houdt, varkens die verschijnselen van een besmettelijke dierziekte vertonen, behandelt
      of laat behandelen, binnen 24 uur nadat die behandeling is ingesteld, bloed is afgenomen en is ingestuurd ten
      behoeve van onderzoek op de aanwezigheid van een besmettelijke dierziekte;
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel24
  - number: 24.c.12
    text: |-
      de eigenaar of exploitant van het bedrijf, dan wel diens vertegenwoordiger, dan wel degene die op dat bedrijf een
      of meer varkens houdt, voorzover op dat bedrijf varkens mogelijk ten gevolge van een besmettelijke dierziekte zijn
      gestorven, een representatief aantal van die dieren ter sectie heeft ingestuurd ten behoeve van onderzoek op de
      aanwezigheid van klassieke varkenspest, of
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel24
  - number: 24.c.13
    text: |-
      de eigenaar of exploitant, dan wel diens vertegenwoordiger, van het bedrijf eenmaal per twaalf maanden door
      een geaccrediteerde keuringsinstantie overeenkomstig [bijlage V][ref1] een bedrijfsrapport laat opstellen
      waaruit blijkt in hoeverre op het bedrijf wordt voldaan aan de in deze regeling gestelde voorschriften en
      welke voorzieningen eventueel zouden moeten worden getroffen, indien het bedrijf niet of niet volledig aan
      die voorschriften voldoet en de eigenaar of exploitant, dan wel diens vertegenwoordiger, een exemplaar van dat
      bedrijfsrapport op het bedrijf bewaart.


      [ref1]: https://wetten.overheid.nl/BWBR0012010
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0012010
  - number: '25.1'
    text: |-
      Degene die ingevolge deze regeling gegevens moet bijhouden of vermelden op daartoe bestemde bescheiden, doet dit
      volledig, juist en naar waarheid.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel25
  - number: '25.2'
    text: |-
      Het bijhouden of vermelden van de in het eerste lid bedoelde gegevens geschiedt onverwijld nadat de gegevens bekend
      zijn bij degene die zij ingevolge deze regeling moet bijhouden of vermelden.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel25
  - number: '25.3'
    text: De gegevens, bedoeld in het eerste lid, worden gedurende een jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel25
  - number: '26.1'
    text: De Regeling inzake hygiëne-voorschriften besmettelijke dierziekten wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel26
  - number: '26.2'
    text: |-
      Geschriften die ingevolge [artikel 17, eerste lid][ref1], van de in het eerste lid genoemde regeling dan wel
      ingevolge de [artikelen 6, eerste lid][ref2], of 6a, eerste lid, van de Beschikking ontsmetting motorrijtuigen en
      aanhangwagens 1976 zijn verstrekt ten behoeve van het houden van aantekening van de reiniging en ontsmetting van
      vervoermiddelen, zijn geschriften als bedoeld in [artikel 17, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0012010#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0012010#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0012010#Artikel17
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0012010
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0012010
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0012010
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '26.3'
    text: |-
      In afwijking van het eerste lid blijft de regeling, bedoeld in het eerste lid, van toepassing voorzover dat voor de
      strafrechtelijke handhaving van de daarin opgenomen bepalingen noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel26
  - number: '26.4'
    text: |-
      De krachtens artikel 23 van de Regeling inzake hygiënevoorschriften besmettelijke dierziekten verleende
      registraties worden geacht te zijn verleend op grond van artikel 23 van deze regeling.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel26
  - number: '27'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel27
  - number: '28'
    text: |-
      Deze regeling wordt aangehaald als: [Regeling inzake hygiënevoorschriften besmettelijke dierziekten 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012010
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0012010
  - number: BI:A.1
    text: Het bedrijf is voorzien van een verharde plaats waar de reiniging en ontsmetting van vervoermiddelen geschiedt.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelA
  - number: BI:A.2
    text: |-
      De verharde plaats heeft opstaande randen, dan wel is zodanig aangelegd dat water en eventueel andere vloeistoffen
      niet in het grond- of oppervlaktewater terecht kunnen komen. De plaats is voorzien van een zodanige afvoer dat
      water en eventueel andere vloeistoffen die bij de reiniging en ontsmetting worden gebruikt, niet in het grond- of
      oppervlaktewater terecht kunnen komen.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelA
  - number: BI:A.3
    text: |-
      Het bedrijf kan voldoende water leveren voor de reiniging en ontsmetting van de vervoermiddelen die een of meer
      evenhoevigen op dat bedrijf lossen.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelA
  - number: BI:A.4
    text: |-
      De verharde plaats kan op zodanige wijze worden verlicht dat de reiniging en ontsmetting van vervoermiddelen te
      allen tijde onbelemmerd en naar behoren kan plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelA
  - number: BI:A.5
    text: Op het bedrijf zijn voorzieningen aanwezig waarmee ontsmettingsmiddelen kunnen worden toegepast.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelA
  - number: BI:A.6
    text: |-
      Op het bedrijf zijn reinigingsmiddelen aanwezig, alsmede ontsmettingsmiddelen die voor dat doel op grond van de
      [Bestrijdingsmiddelenwet 1962][ref1] zijn toegelaten, in voldoende mate om te kunnen voorzien in de reiniging en
      ontsmetting van de vervoermiddelen die op dat bedrijf een of meer evenhoevigen lossen.


      [ref1]: https://wetten.overheid.nl/BWBR0002380
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelA
    references:
      - id: ref1
        bwb_id: BWBR0002380
  - number: BI:A.7
    text: |-
      Op het bedrijf is een voorziening aanwezig waar de chauffeurs van de vervoermiddelen die varkens op het bedrijf
      lossen hun handen kunnen wassen met warm water en zeep.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelA
  - number: BI:I.1
    text: De wasplaats is goed bereikbaar voor vervoermiddelen via verharde wegen.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelI
  - number: BI:I.2
    text: |-
      De wasplaats is zodanig ingericht dat een deugdelijke en efficiënte reiniging en ontsmetting van vervoermiddelen
      onder alle klimatologische omstandigheden ongehinderd, met voldoende capaciteit in relatie tot de werkzaamheden op
      het bedrijf en ongeacht het type vervoermiddel kan plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelI
  - number: BI:I.3
    text: |-
      Het vloeroppervlak van de wasplaats bestaat uit voor water ondoordringbaar of niet-poreus materiaal, zodat al
      het gebruikte water rechtstreeks via de afvoer van de wasplaats op zodanige wijze kan afvloeien naar de daarvoor
      bestemde opvangvoorzieningen dat de wasplaats te allen tijde schoon en hygiënisch is.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelI
  - number: BI:I.4
    text: Vloeren van de wasplaats zijn dicht en goed reinigbaar en wanden van de wasplaats zijn glad en afwasbaar.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelI
  - number: BI:I.5
    text: Het vloeroppervlak waar de reiniging plaatsvindt heeft een helling van ten minste 3%.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelI
  - number: BI:I.6
    text: |-
      Indien meerdere vervoermiddelen tegelijkertijd worden gereinigd en ontsmet, beschikt de wasplaats over reinigbare
      en ontsmetbare afscheidingsmogelijkheden waarmee de vervoermiddelen tijdens het reinigen en het ontsmetten kunnen
      worden gescheiden, zodat tijdens het reinigen en ontsmetten de vervoermiddelen elkaar niet kunnen bezoedelen. De
      afstand tussen de afscheidingen is zodanig breed dat zich tussen de afscheidingen en de vervoermiddelen genoeg
      ruimte bevindt om ongehinderd de buitenkant van de vervoermiddelen te reinigen en te ontsmetten.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelI
  - number: BI:I.7
    text: |-
      De verlichting voldoet aan de wettelijke eisen voor verlichting op vergelijkbare werkplekken en is ten minste van
      zodanig niveau dat een effectieve reiniging en ontsmetting niet wordt belemmerd en een gedegen controle van de
      reiniging en ontsmetting kan plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelI
  - number: BI:I.8
    text: |-
      Op of in de directe nabijheid van de wasplaats is een vorstvrije ruimte aanwezig voor de opslag van reinigings-
      en ontsmettingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelI
  - number: BI:I.9
    text: |-
      Bij de wasplaats bevindt zich een overdekte ruimte waarin gebruikers en bezoekers van de wasplaats zich kunnen
      omkleden in door de eigenaar van de wasplaats in voldoende hoeveelheid beschikbaar gestelde beschermende kleding en
      laarzen en waarin zij de handen kunnen wassen met warm water en zeep. Indien het een wasplaats betreft die op een
      slachtplaats is gelegen, is deze ruimte niet verbonden met de reine zone van de slachtlijn.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelI
  - number: BI:I.10
    text: |-
      De wasplaats is voorzien van een reinigingsinstallatie waarmee adequaat reinigen mogelijk is. De
      reinigingsinstallatie voldoet in ieder geval aan de volgende eisen:
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelI
  - number: BI:I.10.a
    text: |-
      ten behoeve van de reiniging en ontsmetting is, bij gelijktijdig gebruik van alle aanwezige slangen, levering
      mogelijk van voldoende koud water met voldoende druk om een adequate reiniging en ontsmetting te waarborgen;
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelI
  - number: BI:I.10.b
    text: |-
      ten behoeve van de reiniging en ontsmetting is levering mogelijk van warm water met een temperatuur van ten minste
      70o graden Celsius;
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelI
  - number: BI:I.10.c
    text: per wasplaats is de druk van ten minste één slang registreerbaar.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelI
  - number: BI:I.11
    text: De waterkwaliteit is zodanig dat goed reinigen en ontsmetten mogelijk is.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelI
  - number: BI:I.12
    text: Op de wasplaats zijn voldoende reinigings- en ontsmettingsmiddelen beschikbaar.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelI
  - number: BI:I.13
    text: |-
      De wasplaats is voorzien van een adequate ontsmettingsinstallatie waarmee ontsmetting overeenkomstig deze regeling
      mogelijk is en waarmee door verneveling of op andere wijze ontsmettingsmiddel op het gereinigde oppervlak kan
      worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelI
  - number: BI:I.14
    text: De spuitlans van de ontsmettingsinstallatie is aan en uit te zetten.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelI
  - number: BI:I.15
    text: Bij elke ontsmettingsinstallatie is een voor iedereen zichtbare en toegankelijke oogspoelfles aanwezig.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelI
  - number: BI:I.16
    text: Op de wasplaats zijn voorzieningen aanwezig om de slangen na gebruik op te hangen.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelI
  - number: BI:I.17
    text: |-
      Elke wasplaats is voorzien van ten minste één adequaat werkend laarzenreinigings- of laarzenborstelapparaat,
      waarmee tevens schoeisel kan worden ontsmet.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelI
  - number: BI:I.18
    text: |-
      De wasplaats is voorzien van watervaste voorlichtings- en instructieborden de van voldoende formaat, die betrekking
      hebben op de veiligheid en het gebruik van de reinigings- en ontsmettingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelI
  - number: BI:II.1
    text: |-
      De wasplaats is tijdens de openingstijden te allen tijde functioneel en hygiënisch. Mest, strooisel en voerresten
      worden zo snel mogelijk van de wasplaats verwijderd.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelII
  - number: BI:II.2
    text: |-
      Indien de hygiëne van de wasplaats daartoe aanleiding geeft, maar in ieder geval aan het einde van de werkdag,
      worden de wasplaats en de reinigings- en ontsmettingsvoorzieningen zelf gereinigd en ontsmet.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelII
  - number: BI:II.3
    text: |-
      Tijdens reinigings- en ontsmettingswerkzaamheden zijn de aanwezigen op de wasplaats gekleed in door het bedrijf
      waarvan de wasplaats deel uitmaakt, verstrekte kleding en laarzen.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelII
  - number: BI:II.4
    text: |-
      Tijdens het reinigen en vóór het ontsmetten is het vervoermiddel zodanig opgesteld dat de laadvloer van het
      vervoermiddel in de lengte gemeten een hellingshoek van ten minste 3% heeft.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelII
  - number: BI:II.5
    text: |-
      Vervoermiddelen worden in ieder geval overeenkomstig de aanwijzingen van de met het toezicht op de naleving van
      deze regeling belaste ambtenaren gereinigd met behulp van de op de wasplaats beschikbare reinigingsmiddelen of met
      warm water, indien:
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelII
  - number: BI:II.5.a
    text: |-
      de toestand van dat vervoermiddel daartoe - in ieder geval naar het oordeel van de met de toezicht op de naleving
      op deze regeling belaste ambtenaar - aanleiding geeft, dan wel
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelII
  - number: BI:II.5.b
    text: |-
      de veterinaire situatie in Nederland of in delen van Nederland daartoe naar het oordeel van de Minister aanleiding
      geeft en deze de reiniging van vervoermiddelen heeft gelast.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelII
  - number: BI:II.6
    text: |-
      Na reiniging mag zich geen ophoping van water op het vervoermiddel bevinden. Gedurende periodes met vorst wordt na
      voltooiing van de reinigings- en ontsmettingswerkzaamheden zoveel water verwijderd, dat dieren bij het oplopen zich
      niet kunnen bezeren door uitglijden over bevroren delen van het vervoermiddel.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelII
  - number: BI:II.7
    text: |-
      Indien meerdere vervoermiddelen tegelijkertijd worden gereinigd en ontsmet, worden deze met de aanwezige
      afscheidingsmogelijkheden zodanig van elkaar afgescheiden dat de vervoermiddelen elkaar tijdens het reinigen en
      ontsmetten niet kunnen bezoedelen.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelII
  - number: BI:II.8
    text: |-
      Gereinigde en ontsmette vervoermiddelen worden zodanig opgesteld dat zij op de wasplaats niet opnieuw kunnen worden
      bezoedeld.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelII
  - number: BI:II.9
    text: De afscheidingen worden na gebruik gereinigd en ontsmet.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelII
  - number: BI:II.10
    text: De reinigings- en ontsmettingsmiddelen zijn vóór en na gebruik opgeslagen in een vorstvrije ruimte.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelII
  - number: BI:II.11
    text: Aan de ontsmettingsoplossing zijn geen andere stoffen toegevoegd.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelII
  - number: BI:II.12
    text: |-
      Indien vervoermiddelen het terrein waarop de wasplaats zich bevindt, verlaten worden de wielen en de wielkassen
      bij het verlaten van het terrein gereinigd en ontsmet, tenzij de gereinigde en ontsmette vervoermiddelen vanaf de
      wasplaats niet meer over delen van het terrein rijden waarover ook vervoermiddelen plegen te rijden die nog niet
      gereinigd en ontsmet zijn.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelII
  - number: BI:II.13
    text: De openingstijd van de wasplaats is ten minste gelijk aan de lostijden voor vee.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelII
  - number: BII:A.1
    text: |-
      De reiniging vindt systematisch plaats in een logische volgorde van handelingen, waarbij van boven naar beneden en
      van binnen naar buiten wordt gewerkt.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelA
  - number: BII:A.2
    text: De reiniging geschiedt op adequate wijze. Hieraan wordt voldoende tijd besteed.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelA
  - number: BII:B.1
    text: 'Een adequate reiniging bestaat opeenvolgend uit de volgende handelingen:'
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelB
  - number: BII:B.1.a
    text: verwijdering van aanwezig grof vuil, zoals mest, strooisel en eventuele voerresten;
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelB
  - number: BII:B.1.b
    text: |-
      losweking van aanwezig fijner vuil of vet, bij voorkeur door het aanbrengen van een reinigingsmiddel op alle
      oppervlakken;
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelB
  - number: BII:B.1.c
    text: |-
      verwijdering van de losgeweekte vuil- en vetdeeltjes en het reinigingsmiddel door middel van afspoeling van alle
      oppervlakken, bij voorkeur met water met een temperatuur van ten minste 70o C.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelB
  - number: BII:B.2
    text: |-
      Indien de reiniging plaatsvindt op een slachtplaats is het gebruikte water van drinkwaterkwaliteit overeenkomstig
      [richtlijn 80/778/EEG](31980L0778) van de Raad van de Europese Gemeenschappen van 15 juli 1980 betreffende de
      kwaliteit van voor menselijke consumptie bestemd water (PbEG L 229).
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelB
  - number: BII:B.3
    text: Alle verwijderbare voorwerpen die bij het vervoermiddel behoren, worden verwijderd en apart gereinigd.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelB
  - number: BII:B.4
    text: |-
      Alle losse gebruiksvoorwerpen die bij het vervoermiddel behoren, alsmede eventuele matten in de cabine voor de
      chauffeur en eventuele bijrijders worden apart gereinigd.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelB
  - number: BII:B.5
    text: |-
      De cabine wordt gereinigd, met inbegrip van de pedalen, de cabinevloer en de bedieningsinstrumenten die in contact
      komen met de chauffeur of eventuele bijrijders.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelB
  - number: BII:A.1
    text: |-
      De ontsmetting vindt pas plaats, nadat de reiniging op adequate wijze is geschied en alle vuil- of vetresten
      verwijderd zijn.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelA
  - number: BII:A.2
    text: Vóór het aanbrengen van het ontsmettingsmiddel wordt overtollig water zoveel mogelijk verwijderd.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelA
  - number: BII:A.3
    text: |-
      De ontsmetting geschiedt met voor dat doel op grond van de [Bestrijdingsmiddelenwet 1962][ref1] toegelaten
      ontsmettingsmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002380
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelA
    references:
      - id: ref1
        bwb_id: BWBR0002380
  - number: BII:A.4
    text: Ieder ontsmettingsmiddel dat wordt gebruikt, wordt gebruikt overeenkomstig de gebruiksaanwijzing.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelA
  - number: BII:A.5
    text: De persoonlijke bescherming van bij de ontsmetting aanwezige personen wordt strikt in acht genomen.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelA
  - number: BII:A.6
    text: |-
      De ontsmetting vindt systematisch plaats in een logische volgorde van handelingen, waarbij van boven naar beneden
      en van binnen naar buiten wordt gewerkt.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelA
  - number: BII:B.1
    text: |-
      Indien de ontsmetting plaatsvindt op een slachtplaats moet het gebruikte water van drinkwaterkwaliteit zijn
      overeenkomstig [richtlijn 80/778/EEG](31980L0778) van de Raad van de Europese Gemeenschappen van 15 juli 1980
      betreffende de kwaliteit van voor menselijke consumptie bestemd water (PbEG L 229).
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelB
  - number: BII:B.2
    text: |-
      De ontsmettingsoplossing wordt op de te ontsmetten oppervlakken aangebracht met lage druk en grove druppel, op
      zodanige wijze dat alle oppervlakken van het vervoermiddel worden bevochtigd.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelB
  - number: BII:B.3
    text: Alle verwijderbare voorwerpen die bij het vervoermiddel behoren, worden verwijderd en apart ontsmet.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelB
  - number: BII:B.4
    text: |-
      Alle losse gebruiksvoorwerpen die bij het vervoermiddel behoren, alsmede eventuele matten in de cabine voor de
      chauffeur en eventuele bijrijders worden apart ontsmet.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelB
  - number: BII:B.5
    text: |-
      Na de benodigde inwerktijd worden, voorzover de gebruiksvoorschriften bij het toegepaste ontsmettingsmiddel zulks
      in verband met de veiligheid van mens of dier voorschrijft, de oppervlakken afgespoten met water, op zodanige
      wijze dat geen ontsmettingsmiddel achterblijft op oppervlakken waarmee dieren in aanraking kunnen komen of op
      oppervlakken van waar mogelijk achterblijvend ontsmettingsmiddel terecht kan komen op oppervlakken waarmee dieren
      in aanraking kunnen komen.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelB
