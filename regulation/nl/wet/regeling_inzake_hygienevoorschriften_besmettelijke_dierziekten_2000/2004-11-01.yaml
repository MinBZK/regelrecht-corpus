  - number: '1.2'
    text: |-
      In deze regeling wordt onder het vervoeren van een vervoermiddel verstaan het voortbewegen of doen voortbewegen van
      een vervoermiddel.
    url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#Artikel1
  - number: '2.1'
    text: |-
      Het is verboden evenhoevigen te vervoeren met een vervoermiddel, tenzij is voldaan aan de [artikelen 6][ref1],
      [7][ref2], [8][ref3], [10][ref4], [15][ref5] tot en met [18][ref6] en [19][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0012010#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0012010#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0012010#Artikel8
