preamble:
  text: |-
    Gelet op de artikelen 10, eerste en tweede lid, onderdeel b, 11, eerste lid, 17, 18, en 30 van de Gezondheids- en
    welzijnswet voor dieren;

    Gelet op de artikelen 4, tweede en derde lid, en 12 van Richtlijn nr. 64/432/EEG van de Raad van de Europese
    Gemeenschappen van 26 juni 1964 inzake veterinairrechtelijke vraagstukken op het gebied van het intracommunautaire
    handelsverkeer in runderen en varkens (PbEG L 121) en, voorzover het betreft artikel 12, derde lid, op artikel
    10, eerste lid, van Richtlijn nr. 90/425/EEG van de Raad van de Europese Gemeenschappen van 26 juni 1990 inzake
    veterinaire en zoötechnische controles in het intracommunautaire handelsverkeer in bepaalde levende dieren en
    produkten in het vooruitzicht van de totstandbrenging van de interne markt (PbEG L 224);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012010/2004-11-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

              a

                *vervoermiddel:*


                voertuig in de zin van het [Voertuigreglement][ref1], daaronder mede begrepen een samenstel van
      voertuigen in de zin van het [Voertuigreglement][ref2], alsmede containers en opleggers;



              b

                *lidstaat:*


                lidstaat van de Europese Unie, niet zijnde Nederland;



              c

                *derde land:*


                land, niet zijnde Nederland en niet zijnde een lidstaat;



              d

                *verzamelcentrum voor varkens:*


                verzamelcentrum dat op grond van
      [artikel 4, eerste lid, van de Regeling betreffende het bijeenbrengen van dieren 2000][ref3] is erkend;



              e

                *verzamelcentrum voor runderen:*


                verzamelcentrum dat op grond van
      [artikel 2.63, tweede lid, van de Regeling handel levende dieren en levende producten][ref4] is erkend;



              f

                *minister:*


                Minister van Landbouw, Natuurbeheer en Visserij;



              g
              VWA:

                de Voedsel en Waren Autoriteit, ingesteld bij besluit van de Minister van Volksgezondheid, Welzijn en
      Sport van 8 juli 2002 (Stcrt. 127);



              h

                *reinigings- en ontsmettingsplaats voor vervoermiddelen:*


                geheel aan installaties en voorzieningen nodig voor het reinigen en ontsmetten van vervoermiddelen;



              i

                *varkenshouderijbedrijf:*


                locatie, al dan niet behorend bij een landbouwbedrijf, waar vijf of meer evenhoevigen worden gehouden dan
      wel een locatie die voor het zodanig houden bestemd is, met uitzondering van percelen weiland zonder bebouwing;



              j

                *rundveehouderijbedrijf:*


                locatie, al dan niet behorend bij een landbouwbedrijf, waar vijf of meer evenhoevigen worden gehouden dan
      wel een locatie die voor het zodanig houden bestemd is, met uitzondering van percelen weiland zonder bebouwing;



              k

                *evenhoevigen:*


                varkens, runderen, schapen, geiten of herten;



              l

                *slachtplaats met geringe capaciteit:*


                slachthuis dat op grond van [artikel 10 van het Besluit produktie en handel vers vlees][ref5] is erkend
      voor het slachten van vee;



              m

                *wet:*


                [Gezondheids- en welzijnswet voor dieren][ref6];



              n

                *geaccrediteerde keuringsinstantie:*


                keuringsinstantie, waarvan
                door de Nederlandse Raad voor Accreditatie of een gelijkwaardige buitenlandse instantie is verklaard dat
      de keuringsinstantie voldoet aan de criteria van EN 45004 en ISO 17020 en de relevante criteria van ISO 9001/9002,
      voorzover deze verklaring betrekking heeft op het opstellen van het in [artikel 24, onderdeel 13][ref7], genoemde
      bedrijfsrapport, dan wel,
      door de Nederlandse Raad voor Accreditatie of een gelijkwaardige buitenlandse instantie is verklaard dat de
      keuringsinstantie voldoet aan de criteria van EN 45004 en ISO 17020 en de relevante criteria van ISO 9001/9002,
      voorzover deze verklaring betrekking heeft op verrichtingen in de veehouderij, en de keuringsinstantie aan de
      Nederlandse Raad voor Accreditatie of een gelijkwaardige buitenlandse instantie heeft verzocht te verklaren dat
      de keuringsinstantie aan genoemde criteria voldoet met betrekking tot het in [artikel 24, onderdeel 13][ref8],
      genoemde bedrijfsrapport en dit verzoek niet is afgewezen;



              o

                *houderij van evenhoevigen:*


                locatie, al dan niet behorend bij een landbouwbedrijf, waar vijf of meer evenhoevigen worden gehouden dan
      wel een locatie die voor het zodanig houden bestemd is, met uitzondering van percelen weiland zonder bebouwing;



              p

                *verzamelcentrum voor evenhoevigen:*


                verzamelcentrum dat op grond van [artikel 4][ref9], [artikel 9b][ref10] of
      [artikel 9l, van de Regeling betreffende het bijeenbrengen van dieren 2000][ref11] is erkend;



              q

                [richtlijn nr. 91/68/EEG](31991L0068):

                [richtlijn nr. 91/68/EEG](31991L0068) van de Raad van de Europese Gemeenschappen van 28 januari 1991
      inzake veterinairrechtelijke voorschriften voor het intracommunautaire handelsverkeer in schapen en geiten (PbEG
      L46).


      [ref1]: https://wetten.overheid.nl/BWBR0006746
