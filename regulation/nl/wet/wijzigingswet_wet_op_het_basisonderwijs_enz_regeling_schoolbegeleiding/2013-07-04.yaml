preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is wettelijke regels te stellen betreffende
    de verantwoordelijkheid van gemeentebesturen voor schoolbegeleiding en voor de instandhouding van
    schoolbegeleidingsdiensten;

    Dat het tevens wenselijk is daartoe tijdelijk een wettelijke basis te bieden voor een specifieke uitkering voor de
    subsidiëring van schoolbegeleidingsactiviteiten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008685/2013-07-04#ArtikelAanhef
articles:
  - number: VII
    text: Deze wet treedt in werking met ingang van 1 augustus 1997.
    url: https://wetten.overheid.nl/BWBR0008685/2013-07-04#ArtikelVII
