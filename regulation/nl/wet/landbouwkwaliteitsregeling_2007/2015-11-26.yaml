        artikel: '17'
        hoofdstuk: '4'
  - number: '28'
    text: |-
      De volgende regelingen worden ingetrokken:

      a. [Landbouwkwaliteitsregeling aanwijzing groenten en fruit][ref1];

      b. [Landbouwkwaliteitsregeling biologische productiemethode 1996][ref2];

      c. [Landbouwkwaliteitsregeling controle groenten en fruit 1993][ref3]

      d. [Landbouwkwaliteitsregeling delegatie bevoegdheden eieren][ref4];

      e. [Landbouwkwaliteitsregeling etikettering rundvlees][ref5];

      f. [Landbouwkwaliteitsregeling geografische aanduidingen, oorsprongsbenamingen en specificiteitscertificeringen][ref6]
      ;

      g. [Landbouwkwaliteitsbeschikking vrijstellingen, ontheffingen en nadere voorschriften groenten en fruit][ref7];

      h. [Landbouwkwaliteitsregeling zuigelingenvoeding 1994][ref8];

      i. [Vrijstellingsregeling grootverpakkingen zuigelingenvoeding][ref9];

      j. [Besluit aanwijzing toezichthouders Landbouwkwaliteitswet][ref10];

      k. De
