  - number: '30'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop het [Landbouwkwaliteitsbesluit 2007][ref1] in werking
      treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0022535
