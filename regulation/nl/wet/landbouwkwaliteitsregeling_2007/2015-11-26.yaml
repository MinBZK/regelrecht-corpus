        artikel: '11'
  - number: '27'
    text: |-
      De op het tijdstip van inwerkingtreding van dit artikel bij het Hoofdproductschap Akkerbouw aanhangige aanvragen
      en verzoeken, bedoeld in [artikel 17, eerste lid][ref1], worden met ingang van 1 januari 2014 overeenkomstig deze
      regeling behandeld door de daartoe bevoegde autoriteit met inachtneming van de termijn die op dat tijdstip is
      verstreken sinds het tijdstip van indiening van de aanvraag of het verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0022543#Artikel17
    url: https://wetten.overheid.nl/BWBR0022543/2015-11-26#Artikel27
