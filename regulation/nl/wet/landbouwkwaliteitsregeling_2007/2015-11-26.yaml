  - number: 26c
    text: |-
      Een controle-instelling maakt de tarieven, bedoeld in [artikel 11, eerste lid, van de wet][ref1], bekend op haar
      website.


      [ref1]: https://wetten.overheid.nl/BWBR0002755#Artikel11
