preamble:
  text: |-
    Gelet op de Europese verordeningen en richtlijnen met betrekking tot het in de handel brengen van verschillende
    landbouwproducten, alsmede gelet op artikel 10 van het Landbouwkwaliteitsbesluit 2007;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0022543/2023-10-14#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *exploitant:* de persoon als bedoeld in artikel 3, onderdeel 13, van [verordening (EU) 2018/848](32748R2018);
        - *minister:* Minister van Landbouw, Natuur en Voedselkwaliteit;
        - *verordening (EG) 1580/2007:* Verordening (EG) nr. 1580/2007 van de Commissie van 21 december 2007 tot
      vaststelling van bepalingen voor de uitvoering van de Verordeningen (EG) nr. 2200/96, (EG) nr. 2201/96 en (EG) nr.
      1182/2007 van de Raad in de sector groenten en fruit (PbEU 2007, L 350);
        - *verordening (EU) 2020/464:* [Uitvoeringsverordening 2020/464](32364R2020) van de Commissie van 26 maart
      2020 tot vaststelling van een aantal uitvoeringsbepalingen voor [Verordening (EU) 2018/848](32748R2018) van het
      Europees Parlement en de Raad wat betreft de documenten die nodig zijn voor de erkenning met terugwerkende kracht
      van perioden in het kader van de omschakeling, de productie van biologische producten en de door de lidstaten te
      verstrekken informatie (PbEU 2020, L 98);
        - *verordening (EU) 2021/279:* [Uitvoeringsverordening (EU) 2021/279](32179R2021) van de Commissie van 22 februari
      2021 tot vaststelling van bepalingen ter uitvoering van [Verordening (EU) 2018/848](32748R2018) van het Europees
      Parlement en de Raad wat betreft controles en andere maatregelen ter waarborging van de traceerbaarheid en naleving
      in de biologische productie en de etikettering van biologische producten (PbEU 2021, L 62);
        - *verordening (EU) 2021/2305:* Gedelegeerde [Verordening (EU) 2021/2305](32305R2021) van de Commissie van
      21 oktober 2021 tot aanvulling van [Verordening (EU) 2017/625](32525R2017) van het Europees Parlement en de Raad
      met regels inzake de gevallen waarin en de voorwaarden waaronder biologische producten en omschakelingsproducten
      zijn vrijgesteld van officiële controles aan grenscontroleposten en inzake de plaats van officiële controles voor
      dergelijke producten, en tot wijziging van de Gedelegeerde [Verordeningen (EU) 2019/2123](32123R2019) en [(EU)
      2019/2124](32124R2019) van de Commissie (PbEU 2021, L 461);
        - *verordening (EU) 2021/2306:* Gedelegeerde [Verordening (EU) 2021/2306](32306R2021) van de Commissie van
      21 oktober 2021 tot aanvulling van [Verordening (EU) 2018/848](32748R2018) van het Europees Parlement en de Raad
      met regels betreffende de officiële controles van zendingen biologische producten en omschakelingsproducten die
      bestemd zijn voor invoer in de Unie en betreffende het inspectiecertificaat (PbEU 2021, L 461);
        - *verordening (EU) 2021/2307:* [Uitvoeringsverordening (EU) 2021/2307](32307R2021) van de Commissie van 21 oktober
      2021 tot vaststelling van regels betreffende documenten en kennisgevingen die vereist zijn voor biologische en
      omschakelingsproducten die bestemd zijn voor invoer in de Unie (PbEU 2021, L 461).
    url: https://wetten.overheid.nl/BWBR0022543/2023-10-14#Artikel1
  - number: '2'
    text: |-
      1 Exploitanten en groepen exploitanten, als bedoeld in artikel 36 van [verordening (EU) 2018/848](32748R2018),
      melden zich overeenkomstig artikel 15, aanhef en onderdeel b, van het Landbouwkwaliteitsbesluit 2007 bij de
      Stichting Skal overeenkomstig artikel 34, eerste lid, van [verordening (EU) 2018/848](32748R2018).

      2 Exploitanten die onverpakte biologische producten, met uitzondering van diervoeders, direct aan de eindconsument
      of eindgebruiker verkopen zijn vrijgesteld van de toepassing van artikel 34, eerste lid, van [verordening (EU)
      2018/848](32748R2018), mits ze voldoen aan artikel 35, achtste lid, van [verordening (EU) 2018/848](32748R2018).
    url: https://wetten.overheid.nl/BWBR0022543/2023-10-14#Artikel2
  - number: '3'
    text: |-
      Indien de Stichting Skal constateert dat de bij of krachtens [verordening (EU) 2018/848](32748R2018) gestelde
      voorschriften niet worden nageleefd met betrekking tot een product waarvoor overeenkomstig die verordeningen
      aanduidingen worden gebezigd, kan zij de betreffende marktdeelnemers de verplichting opleggen om de aanduidingen
      van de desbetreffende producten te verwijderen of te doen verwijderen overeenkomstig artikel 42 van [verordening
      (EU) 2018/848](32748R2018).
    url: https://wetten.overheid.nl/BWBR0022543/2023-10-14#Artikel3
  - number: '4'
    text: |-
      De Stichting Skal wordt aangewezen als bevoegde autoriteit met betrekking tot biologische productie en etikettering
      van biologische producten, bedoeld in artikel 1, tweede lid, aanhef en onderdeel i, van [verordening (EU) 2017/625]
      (32525R2017), voor zover het betreft:

      a. het beoordelen van een verzoek tot erkenning met terugwerkende kracht van perioden in het kader van de
      omschakeling als bedoeld artikel 1, eerste en tweede lid van [verordening 2020/464](32364R2020);

      b. het verlengen van de omschakelingsperiode als bedoeld in bijlage II, deel I, punt 1.7.2 van [verordening (EU)
      2018/848](32748R2018);

      c. het opleggen van een nieuwe omschakelingsperiode als bedoeld in bijlage II, deel I, punt 1.7.3.
    url: https://wetten.overheid.nl/BWBR0022543/2023-10-14#Artikel4
  - number: '6'
    text: |-
      1 De Stichting Skal kan op aanvraag een vrijstelling verlenen voor het gebruik in Nederland van niet volgens de
      biologische productiemethode verkregen ingrediënten van agrarische oorsprong, als bedoeld in artikel 25, eerste en
      derde lid, van [verordening (EU) 2018/848](32748R2018).

      2 Overeenkomstig [artikel 16, eerste lid, van het Landbouwkwaliteitsbesluit 2007][ref1] kan de minister een
      gebeurtenis formeel als rampzalige gebeurtenis overeenkomstig artikel 22 van [verordening (EU) 2018/848]
      (32748R2018) jo. artikel 1 van [verordening (EU) 2020/2146](32146R2020) erkennen en dan door middel van een
      vrijstelling of ontheffing toestemming verlenen om gedurende een beperkte periode, tot de biologische productie
      kan worden hervat, af te wijken van de biologische productievoorschriften onder de bij of krachtens artikel 22
      [verordening (EU) 2018/848](32748R2018) gestelde voorwaarden.

      3 De Stichting Skal kan op aanvraag ontheffing verlenen voor het gebruik van plantaardig niet overeenkomstig de
      biologische productiemethode verkregen teeltmateriaal overeenkomstig bijlage II, deel I, punten 1.8.5.1 en 1.8.6,
      van [verordening (EU) 2018/848](32748R2018).


      [ref1]: https://wetten.overheid.nl/BWBR0022535#Artikel16
    url: https://wetten.overheid.nl/BWBR0022543/2023-10-14#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0022535
        artikel: '16'
  - number: 8a
    text: |-
      1 Voor het reinigen en ontsmetten van gebouwen en installaties voor de plantaardige productie, inclusief opslag
      in een landbouwbedrijf, en van verwerkings- en opslagfaciliteiten mag overeenkomstig artikel 5, vierde lid, van
      [verordening (EU) 2021/1165](33065R2021), slechts gebruik worden gemaakt van de in [bijlage III][ref1] genoemde
      producten onder de daarbij genoemde beperkingen.

      2 Om gebouwen en andere installaties voor de plantaardige productie te ontdoen van insecten en andere parasieten,
      mag gebruik worden gemaakt van rodenticiden en de in bijlage I van [verordening (EU) 2021/1165](33065R2021)
      opgenomen producten. Rodenticiden worden uitsluitend gebruikt in vallen.


      [ref1]: https://wetten.overheid.nl/BWBR0022543
    url: https://wetten.overheid.nl/BWBR0022543/2023-10-14#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0022543
  - number: 8b
    text: |-
      1 De Stichting Skal informeert de Commissie over:

      a. vrijstellingen verleend op grond van artikel 6, eerste lid, overeenkomstig artikel 25, tweede lid, van
      [verordening (EU) 2018/848](32748R2018);

      b. gevallen van verontreiniging met niet-toegelaten producten of stoffen als bedoeld in artikel 29, negende lid,
      van [verordening (EU) 2018/848](32748R2018);

      c. waar officiële controles worden uitgevoerd op grond van artikel 4, eerste lid, van [verordening (EU) 2021/2305]
      (32305R2021).

      2 Stichting Skal informeert de Commissie en andere lidstaten middels het systeem, bedoeld in artikel 9, eerste lid,
      van [verordening (EU) 2021/279](32179R2021), over:

      a. een vermoeden van niet-naleving als bedoeld in artikel 43, eerste lid, van [verordening (EU) 2018/848]
      (32748R2018);

      b. een vermoede of vastgestelde niet-naleving als bedoeld in artikel 7 van [verordening (EU) 2021/2307]
      (32307R2021).

      3 Stichting Skal informeert de Commissie en andere lidstaten over de afwijkingen, bedoeld in artikel 4, eerste lid,
      van [verordening (EU) 2020/2146](32146R2020).
    url: https://wetten.overheid.nl/BWBR0022543/2023-10-14#Artikel8b
  - number: '9'
    text: |-
      Marktdeelnemers als bedoeld in artikel 10, tweede lid, van verordening (EU) 543/2011 verstrekken de in het vijfde
      en zesde lid van dat artikel bedoelde gegevens aan de Stichting KCB ten behoeve van de gegevensbank, bedoeld in het
      eerste lid van dat artikel, die wordt beheerd door deze Stichting.
    url: https://wetten.overheid.nl/BWBR0022543/2023-10-14#Artikel9
  - number: '10'
    text: |-
      Marktdeelnemers die bananen in de handel brengen, die op grond van artikel 7, eerste lid, van [verordening (EG)
      2898/95](31995R2898) worden vrijgesteld van de controle, registreren zich bij de Stichting KCB overeenkomstig
      artikel 7, tweede lid, van deze verordening.
    url: https://wetten.overheid.nl/BWBR0022543/2023-10-14#Artikel10
  - number: '11'
    text: |-
      De Minister is de coördinerende autoriteit, bedoeld in artikel 9, eerste lid, onderdeel a, van verordening (EU)
      543/2011.
    url: https://wetten.overheid.nl/BWBR0022543/2023-10-14#Artikel11
  - number: '12'
    text: |-
      De Stichting KCB is belast met:

      a. het verlenen van de in artikel 12, eerste lid, van verordening (EU) 543/2011 bedoelde toestemming;

      b. de vaststelling van het minimum percentage, bedoeld in artikel 11, tweede lid, onderdeel b, van verordening
      (EU) 543/2011;

      c. het verlenen van vrijstellingen en de afgifte van vrijstellingscertificaten, bedoeld in artikel 7, eerste lid,
      van [verordening (EG) 2898/95](31995R2898).
    url: https://wetten.overheid.nl/BWBR0022543/2023-10-14#Artikel12
  - number: '13'
    text: |-
      1 De controle van groenten en fruit door de Stichting KCB geschiedt overeenkomstig de artikelen 11 en 17 en bijlage
      V van verordening (EU) 543/2011 en artikel 113 bis, vierde lid en de krachtens artikel 194 van verordening (EG)
      1234/2007 vastgestelde voorschriften bij de normcontroles op de interne markt.

      2 De keuring en controle van bananen door de Stichting KCB geschiedt overeenkomstig de artikelen 2 tot en met 7 van
      [verordening (EG) 2898/95](31995R2898).
    url: https://wetten.overheid.nl/BWBR0022543/2023-10-14#Artikel13
  - number: '14'
    text: |-
      1 Indien door de Stichting KCB bij een normcontrole wordt vastgesteld dat een partij groenten of fruit, die zich
      in het vrije verkeer binnen de Europese Unie bevindt, niet voldoet aan de in de verordening (EU) 543/2011 en de bij
      of krachtens verordening (EU) 1308/2013 gestelde eisen, wordt een verklaring van niet-conformiteit opgesteld als
      bedoeld in artikel 17, derde lid, van verordening (EU) 543/2011.

      2 Een partij groenten of fruit, waarvoor de Stichting KCB een verklaring van niet-conformiteit heeft afgegeven, mag
      niet worden vervoerd, verplaatst, verhandeld of vernietigd zonder toestemming van de Stichting KCB overeenkomstig
      artikel 17, derde lid, van verordening (EU) 543/2011.

      3 Voor de toestemming, bedoeld in het tweede lid kan als voorwaarde worden gesteld dat aan door de Stichting KCB
      gestelde eisen wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0022543/2023-10-14#Artikel14
  - number: '17'
    text: |-
      1 Bij de Minister worden ingediend:

      a. een aanvraag tot registratie als bedoeld in artikel 49 van verordening (EU) 1151/2012;

      b. een verzoek tot wijziging van een productdossier als bedoeld in artikel 53 van verordening (EU) 1151/2012;

      c. een verzoek tot annulering van een registratie als bedoeld in artikel 54 van verordening (EU) 1151/2012.

      2 De Minister geeft kennis van een aanvraag tot registratie en een verzoek tot niet-minimale wijziging van een
      productdossier als bedoeld in artikel 49 dan wel 53 van verordening (EU) 1151/2012 in de Staatscourant.

      3 Binnen vier weken na de kennisgeving, bedoeld in het tweede lid, kan een belanghebbende als bedoeld in artikel
      49, derde lid, van verordening (EU) 1151/2012 bedenkingen tegen de aanvraag of het verzoek kenbaar maken bij de
      Minister.

      4 Indien de aanvraag tot registratie of het verzoek tot wijziging of annulering aan de voorschriften van
      verordening (EU) 1151/2012 voldoet, zendt de minister deze door naar de Europese Commissie.

      5 Indien de Minister besluit tot doorzending van een aanvraag tot registratie of van een verzoek tot niet-minimale
      wijziging van een productdossier, wordt dit besluit tezamen met de versie van het productdossier waarop het besluit
      betrekking heeft, gepubliceerd in de Staatscourant.

      6 De Minister voorziet in de openbaarmaking, bedoeld in artikel 49, vierde lid, laatste alinea, van verordening
      (EU) 1151/2012.
    url: https://wetten.overheid.nl/BWBR0022543/2023-10-14#Artikel17
  - number: '18'
    text: |-
      1 De Minister geeft kennis van een door de Europese Commissie voorgenomen of ingeschreven registratie, wijziging
      van een productdossier of annulering van een registratie onmiddellijk na publicatie daarvan in het Publicatieblad
      van de Europese Unie in de Staatscourant.

      2 Binnen 8 weken na de datum van publicatie in het Publicatieblad van de Europese Unie kan een belanghebbende
      als bedoeld in artikel 51, eerste lid, tweede alinea, van verordening (EU) 1151/2012 bedenkingen tegen een
      voorgenomen registratie als bedoeld in artikel 49 van verordening (EU) 1151/2012 of niet-minimale wijziging van een
      productdossier als bedoeld in artikel 53 van verordening (EU) 1151/2012 kenbaar maken door middel van toezending
      van een gemotiveerde verklaring aan de Minister.

      3 De minister betrekt de verklaring, bedoeld in het tweede lid, bij de overweging omtrent het instellen van bezwaar
      tegen een registratie of niet-minimale wijziging van een productdossier bij de Europese Commissie als bedoeld in
      artikel 51 van verordening (EU) 1151/2012.
    url: https://wetten.overheid.nl/BWBR0022543/2023-10-14#Artikel18
  - number: '23'
    text: |-
      Onder bloembollen wordt verstaan: bollen, knollen, wortelstokken en andere voor vermeerdering of bloemproductie
      bestemde plantendelen van de in de [bijlage II][ref1] bij deze regeling onder I genoemde gewassen, voor zover zij
      behoren tot de daarachter onder II vermelde botanische families, geslachten of soorten.


      [ref1]: https://wetten.overheid.nl/BWBR0022543
    url: https://wetten.overheid.nl/BWBR0022543/2023-10-14#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0022543
  - number: '24'
    text: |-
      Leveranciers van teeltmateriaal van bloembollen registreren zich overeenkomstig artikel 6 van [richtlijn 98/56/EG]
      (31998L0056) voor de activiteiten die zij uit hoofde van deze richtlijn uitoefenen bij de Stichting BKD.
    url: https://wetten.overheid.nl/BWBR0022543/2023-10-14#Artikel24
  - number: '25'
    text: |-
      De aanvraag tot registratie vindt plaats door inzending van een volledig ingevuld, door de Stichting BKD te
      verstrekken aanvraagformulier dat vergezeld gaat van de volgende bescheiden:

      a. een kopie van een geldig legitimatiebewijs van de aanvrager;

      b. een bewijs van inschrijving in het handelsregister, dat door de bevoegde instantie niet langer dan twee maanden
      vóór de datum van aanvraag tot registratie is afgegeven.
    url: https://wetten.overheid.nl/BWBR0022543/2023-10-14#Artikel25
  - number: '26'
    text: |-
      Als personen belast met het toezicht op de naleving als bedoeld in
      [artikel 15, eerste lid, van de Landbouwkwaliteitswet][ref1] worden aangewezen:

      a. de daartoe gekwalificeerde medewerkers van de Stichting BKD;

      b. de daartoe gekwalificeerde medewerkers van de Stichting KCB;

      c. de inspecteurs van de Stichting Skal;

      d. de ambtenaren van de Nederlandse Voedsel- en Warenautoriteit te ’s-Gravenhage;


      [ref1]: https://wetten.overheid.nl/BWBR0002755#Artikel15
    url: https://wetten.overheid.nl/BWBR0022543/2023-10-14#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002755
        artikel: '15'
  - number: 26a
    text: |-
      In dit hoofdstuk wordt verstaan onder marktdeelnemer: iedere natuurlijke persoon of rechtspersoon die bedrijfsmatig
      betrokken is bij het in de handel brengen van producten.
    url: https://wetten.overheid.nl/BWBR0022543/2023-10-14#Artikel26a
  - number: 26b
    text: |-
      1 Een controle-instelling kan de tarieven, bedoeld in [artikel 11, eerste lid, van de Landbouwkwaliteitswet][ref1],
      in rekening brengen bij aan haar toezicht of keuring onderworpen marktdeelnemers.

      2 De controle-instelling kan de tarieven, bedoeld in het eerste lid, in rekening brengen ter dekking van
      de kosten die verband houden met de activiteiten ten behoeve van het toezicht of de keuring waarmee deze op
      grond van de [artikelen 11 tot en met 16][ref2] en [18 van het Landbouwkwaliteitsbesluit 2007][ref3] of de
      [artikelen 2.10][ref4] en [2.11 van het Besluit dierlijke producten][ref5] is belast. De tarieven kunnen in
      rekening worden gebracht in de vorm van:

      a. een retributie op basis van de activiteiten die worden verricht door of in opdracht van de controle-instelling
      ten behoeve van het toezicht of de keuring bij de desbetreffende marktdeelnemer, of

      b. een heffing op basis van het verrichten van activiteiten door marktdeelnemers als gevolg waarvan zij onderworpen
      zijn aan het toezicht of de keuring door de controle-instelling.

      3 Een retributie, bedoeld in het tweede lid, onderdeel a, kan worden gerelateerd aan:

      1°. de tijd besteed aan de activiteiten;

      2°. het aantal of het gewicht van de producten of partijen producten waarop de activiteiten betrekking hebben;

      3°. de oppervlakte van het areaal waarop de activiteiten betrekking hebben, of

      4°. documenten die zijn verstrekt.

      4 Een heffing, bedoeld in het tweede lid, onderdeel b, kan worden gerelateerd aan:

      1°. de omzet van de marktdeelnemer, behaald met de activiteiten die aan het toezicht of de keuring door de
      controle-instelling zijn onderworpen;

      2°. het aantal locaties ten behoeve van de aan het toezicht of de keuring onderworpen activiteiten van de
      marktdeelnemer;

      3°. het aantal producten waarop de aan het toezicht of de keuring onderworpen activiteiten van de marktdeelnemer
      betrekking hebben, of

      4°. de omvang van het risico op niet-naleving van het bij of krachtens de wet bepaalde door de desbetreffende
      marktdeelnemer.


