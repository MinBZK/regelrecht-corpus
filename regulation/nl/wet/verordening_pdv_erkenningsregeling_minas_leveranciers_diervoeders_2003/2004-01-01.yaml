      - id: ref5
        bwb_id: BWBR0014701
        artikel: '8'
        paragraaf: '2'
  - number: '3.1'
    text: |-
      De aanvraag, bedoeld in [artikel 2, tweede lid][ref1], geschiedt door indiening bij het productschap van
      een door de secretaris vastgesteld aanvraagformulier, vergezeld van een concept van het voerleverantie- en
      voerjaaroverzicht. De erkenning geldt voor onbepaalde tijd met ingang van de datum waarop de erkenning wordt
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0014701#Artikel2
    url: https://wetten.overheid.nl/BWBR0014701/2004-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014701
        artikel: '2'
        paragraaf: '2'
  - number: '3.2'
    text: |-
      Bij wijziging van de naam, het adres of de plaats van vestiging van de onderneming of bij opheffing van de
      onderneming is de deelnemer verplicht het productschap daarvan binnen één maand schriftelijk in kennis te stellen.
    url: https://wetten.overheid.nl/BWBR0014701/2004-01-01#Artikel3
  - number: '3.3'
    text: |-
      De namen, adressen en vestigingsplaatsen van de deelnemers met de bijbehorende erkenningsnummers, worden vastgelegd
      in een openbaar register.
    url: https://wetten.overheid.nl/BWBR0014701/2004-01-01#Artikel3
  - number: '3.4'
    text: |-
      De schorsing en intrekking van een erkenning, als bedoeld in [artikel 2, derde en vierde lid][ref1], worden met
      bijbehorende termijn bekend gemaakt in het openbare register van deelnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0014701#Artikel2
    url: https://wetten.overheid.nl/BWBR0014701/2004-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014701
        artikel: '2'
        paragraaf: '2'
  - number: '3.5'
    text: |-
      De secretaris kan aan de ondernemer die een aanvraag voor een erkenning indient en aan een deelnemer de kosten
      in verband met de beoordeling, de herbeoordeling, de erkenningsprocedure en het toezicht in rekening brengen,
      overeenkomstig [Verordening PDV retributies diervoeders jaar 2003](onbekend).
    url: https://wetten.overheid.nl/BWBR0014701/2004-01-01#Artikel3
  - number: '4.1'
    text: |-
      De deelnemer dient bij aflevering van diervoeders aan een afnemer op het etiket, begeleidend document of
      afleveringsbewijs (vrachtbrief, factuur) te vermelden: - het gehalte aan ruw eiwit en fosfor in het product;
      voor diervoeder met minstens 14% vocht, het gehalte aan ruw eiwit en fosfor in de droge stof van het betreffende
      diervoeder;
        - voor mengvoeder de diersoort waarvoor het diervoeder is bestemd;
        - de datum van levering;
        - de naam van de betreffende afnemer;
        - de naam van de leverancier;
        - de hoeveelheid diervoeder in kg;
        - voor diervoeder met meer dan 14% vocht, het droge stof danwel vochtgehalte.
    url: https://wetten.overheid.nl/BWBR0014701/2004-01-01#Artikel4
  - number: '4.2'
    text: |-
      De deelnemer dient per afnemer en indien hij met meerdere bedrijven deelneemt ook per bedrijf eenmaal per jaar
      schriftelijk of electronisch het voerleverantieoverzicht te verstrekken, uiterlijk dertig dagen na afloop van het
      betreffende jaar. Dit betreft zowel het diervoeder voor de aangewezen als niet-aangewezen diersoorten als bedoeld
      in de [Meststoffenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0014701/2004-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: '4.3'
    text: |-
      De deelnemer verzendt het voerjaaroverzicht, electronisch vóór 1 april van het jaar volgend op het desbetreffende
      jaar aan Bureau Heffingen van het Ministerie van Landbouw, Natuurbeheer en Visserij te Assen.
    url: https://wetten.overheid.nl/BWBR0014701/2004-01-01#Artikel4
  - number: '5.1'
    text: |-
      De deelnemer dient ervoor zorg te dragen dat het op het etiket, begeleidend document of afleveringsbewijs
      gedeclareerde gehalte aan ruw eiwit, fosfor en droge stof- dan wel vochtgehalte bedoeld in
      [artikel 4, eerste lid][ref1], het werkelijk gehalte weergeeft. De mate van nauwkeurigheid bij vermelding van het
      gehalte is voor fosfor tienden gr/kg en voor ruw eiwit gr/kg, danwel voor fosfor honderdsten % en voor ruw eiwit
      tienden %.


      [ref1]: https://wetten.overheid.nl/BWBR0014701#Artikel4
    url: https://wetten.overheid.nl/BWBR0014701/2004-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0014701
        artikel: '4'
        paragraaf: '2'
  - number: '5.2'
    text: |-
      De deelnemer dient het gedeclareerde gehalte aan ruw eiwit en fosfor en indien van toepassing droge stof dan
      wel vocht te baseren op: - resultaten van uitgevoerde bemonstering en analyse van de betreffende enkelvoudige
      diervoeders, mengvoeders en/of de daarin verwerkte voedermiddelen;
        - berekeningen uitgaande van bekende gehalten van de betreffende nutriënten in de voedermiddelen waaruit het
      mengvoeder is bereid, rekening houdend met het functioneren van het productieproces;
    url: https://wetten.overheid.nl/BWBR0014701/2004-01-01#Artikel5
  - number: '5.3'
    text: |-
      De voorzitter kan namens het bestuur bij besluit richtlijnen omtrent de aard en frequentie van bemonstering en
      analyse, als bedoeld in het tweede lid, vaststellen.
    url: https://wetten.overheid.nl/BWBR0014701/2004-01-01#Artikel5
  - number: '5.4'
    text: |-
      De uitslagen van de analyses dienen periodiek volgens een nader door de secretaris namens het bestuur aan te geven
      wijze aan het productschap te worden gerapporteerd.
    url: https://wetten.overheid.nl/BWBR0014701/2004-01-01#Artikel5
  - number: '5.5'
    text: |-
      Analyses als bedoeld in het tweede lid vinden plaats in een door het productschap erkend laboratorium. De procedure
      en voorwaarden voor erkenning worden door de voorzitter namens het bestuur bij besluit vastgesteld. De namen,
      adressen en vestigingsplaatsen van erkende laboratoria worden vastgelegd in een openbaar register.
    url: https://wetten.overheid.nl/BWBR0014701/2004-01-01#Artikel5
  - number: '5.6'
    text: |-
      De deelnemer dient in een procedure vast te leggen op welke wijze de te declareren of gedeclareerde gehalten
      worden vastgesteld. De gegevens op basis waarvan de gehalten zijn bepaald worden zodanig vastgelegd in de in
      [artikel 6][ref1] bedoelde administratie, dat aantoonbaar is dat aan dit artikel wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0014701#Artikel6
    url: https://wetten.overheid.nl/BWBR0014701/2004-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0014701
        artikel: '6'
        paragraaf: '2'
  - number: '5.7'
    text: |-
      De voorzitter kan namens het bestuur bij besluit richtlijnen voorschrijven omtrent het vaststellen van te
      declareren gehalten.
    url: https://wetten.overheid.nl/BWBR0014701/2004-01-01#Artikel5
  - number: '5.8'
    text: |-
      Indien de controle-instantie constateert dat het werkelijke gehalte afwijkt van het door de deelnemer op het etiket
      gedeclareerde gehalte, kan de secretaris gelasten dat de deelnemer alsnog het werkelijk gehalte bekend maakt aan de
      betreffende afnemers.
    url: https://wetten.overheid.nl/BWBR0014701/2004-01-01#Artikel5
  - number: '6.1'
    text: |-
      De deelnemer dient een administratie bij te houden van: - de resultaten van de uitgevoerde bemonsteringen en
      analyses als bedoeld in [artikel 5][ref1];
        - de afgeleverde hoeveelheden van de betrokken diervoeders per afnemer (per bedrijf);
        - de gedeclareerde gehalten aan droge stof dan wel vocht, ruw eiwit en fosfor van de afgeleverde diervoeders;
        - ingeval hij ruwvoer, bedoeld in tabel I van bijlage D bij de Meststoffenwet, betrekt van een teler die jegens hem
      kenbaar heeft gemaakt dat ten aanzien van zijn bedrijf verfijnde mineralenheffingen worden geheven; de afgenomen
      hoeveelheden en gehaltes van ruwvoer, ruw eiwit, fosfor en vocht (bij minstens 14% vocht) danwel droge stof.


      [ref1]: https://wetten.overheid.nl/BWBR0014701#Artikel5
    url: https://wetten.overheid.nl/BWBR0014701/2004-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0014701
        artikel: '5'
        paragraaf: '2'
  - number: '6.2'
    text: |-
      De deelnemer dient alle in [artikel 5][ref1] en [6][ref2] bedoelde gegevens en documenten per bedrijf ten minste
      zeven jaar zodanig te bewaren, dat verificatie achteraf mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0014701#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0014701#Artikel6
    url: https://wetten.overheid.nl/BWBR0014701/2004-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0014701
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0014701
        artikel: '6'
        paragraaf: '2'
  - number: '7'
    text: |-
      De deelnemer is verplicht alle medewerking te verlenen aan het toezicht op de naleving van de voorwaarden en
      voorschriften bij of krachtens deze verordening gesteld.
    url: https://wetten.overheid.nl/BWBR0014701/2004-01-01#Artikel7
  - number: '8'
    text: |-
      Het is een ondernemer verboden de aanduiding "MINAS-leverancier" of "MINAS diervoeder" of woorden van gelijke
      strekking te gebruiken, indien hij niet overeenkomstig deze verordening door het productschap is erkend.
    url: https://wetten.overheid.nl/BWBR0014701/2004-01-01#Artikel8
  - number: '9'
    text: |-
      De bepalingen bij of krachtens deze verordening gelden mede voor andere natuurlijke en rechtspersonen, voor zover
      deze handelingen verricht, die bedrijfsmatig in de ondernemingen waarvoor het productschap is ingesteld, plegen te
      worden verricht.
    url: https://wetten.overheid.nl/BWBR0014701/2004-01-01#Artikel9
  - number: '10'
    text: |-
      Overtredingen van het bepaalde in de [artikelen 5][ref1] en [8][ref2] worden aangemerkt als strafbare feiten.


      [ref1]: https://wetten.overheid.nl/BWBR0014701#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0014701#Artikel8
    url: https://wetten.overheid.nl/BWBR0014701/2004-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0014701
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0014701
        artikel: '8'
        paragraaf: '2'
  - number: '11.1'
    text: |-
      Toezicht op de naleving van het bepaalde bij of krachtens deze verordening vindt plaats overeenkomstig een door het
      bestuur vast te stellen verordening.
    url: https://wetten.overheid.nl/BWBR0014701/2004-01-01#Artikel11
  - number: '11.2'
    text: |-
      Het College van Deskundigen Diervoedersector kan in voorkomend geval gevraagd of ongevraagd advies uitbrengen over
      het bepaalde bij of krachtens deze verordening.
    url: https://wetten.overheid.nl/BWBR0014701/2004-01-01#Artikel11
  - number: '11.3'
    text: |-
      Het bepaalde in deze verordening geldt onverminderd het bepaalde in: - [Verordening Vvr gemedicineerd voeder 2003]
      (onbekend)
        - [Verordening PDV diervoeders 2003](onbekend)
    url: https://wetten.overheid.nl/BWBR0014701/2004-01-01#Artikel11
  - number: '12'
    text: |-
      Deze verordening treedt in werking met ingang van de tweede dag na dagtekening van het Verordeningenblad
      Bedrijfsorganisatie waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0014701/2004-01-01#Artikel12
  - number: '13'
    text: De Verordening Vvr erkenningsregeling MINAS leveranciers diervoeders 1997 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0014701/2004-01-01#Artikel13
  - number: '14'
    text: 'Deze verordening wordt aangehaald als: Verordening PDV erkenningsregeling MINAS leveranciers diervoeders 2003.'
    url: https://wetten.overheid.nl/BWBR0014701/2004-01-01#Artikel14
