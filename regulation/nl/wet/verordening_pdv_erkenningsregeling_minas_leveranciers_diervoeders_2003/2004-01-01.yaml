url: https://wetten.overheid.nl/BWBR0014701/2004-01-01
preamble:
  text: |-
    Gelet op de artikelen 93, 96 en 104, tweede lid van de Wet op de bedrijfsorganisatie, op de artikelen 2 en 3 van de
    Instellingsverordening akkerbouwproductschappen 1997 en op artikel 3 van de Regeling diervoeders Meststoffenwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014701/2004-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Voor de toepassing van deze verordening gelden voor zover nodig de begripsbepalingen, bedoeld in [artikel 1 van de
      Verordening PDV diervoeders 2003](onbekend).
    url: https://wetten.overheid.nl/BWBR0014701/2004-01-01#Artikel1
  - number: '1.2'
    text: 'Voorts wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014701/2004-01-01#Artikel1
  - number: 1.2.2
    text: |-
      Deze verordening is van toepassing op diervoederleveranciers die: - voer leveren aan een afnemer die heeft
      verklaard een of meer van zijn bedrijven te hebben aangemeld met het oog op de verfijnde mineralenheffingen;
        - ruwvoer betrekken van een teler die jegens hen kenbaar heeft gemaakt dat ten aanzien van zijn bedrijf verfijnde
      mineralenheffingen in de zin van de [Meststoffenwet][ref1] worden geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0014701/2004-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: '2.1'
    text: De leverancier van diervoeders kan bij het productschap een erkenning aanvragen.
    url: https://wetten.overheid.nl/BWBR0014701/2004-01-01#Artikel2
  - number: '2.2'
    text: |-
      De secretaris verleent namens het bestuur op aanvraag aan de leverancier een erkenning indien ten genoegen van
      het productschap aannemelijk wordt gemaakt dat de leverancier voldoet aan het bepaalde bij of krachtens deze
      verordening en de regeling.
    url: https://wetten.overheid.nl/BWBR0014701/2004-01-01#Artikel2
  - number: '2.3'
    text: |-
      De secretaris kan de erkenning namens het bestuur met onmiddellijke ingang schorsen voor een bepaalde termijn
      indien naar het oordeel van de secretaris niet wordt voldaan aan de eisen, bedoeld in de [artikelen 4][ref1],
      [5][ref2], [6][ref3], [7][ref4] of [8][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0014701#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0014701#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0014701#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0014701#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0014701#Artikel8
    url: https://wetten.overheid.nl/BWBR0014701/2004-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0014701
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0014701
        artikel: '5'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0014701
        artikel: '6'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0014701
        artikel: '7'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0014701
        artikel: '8'
        paragraaf: '2'
  - number: '2.4'
    text: |-
      De secretaris kan de erkenning namens het bestuur intrekken, indien: - na afloop van de schorsing, bedoeld
      in het derde lid, naar het oordeel van de Secretaris blijkt dat nog steeds niet aan de eisen, bedoeld in de
      [artikelen 4][ref1], [5][ref2], [6][ref3], [7][ref4] of [8][ref5] wordt voldaan, dan wel;
        - naar het oordeel van de secretaris blijkt dat de deelnemer zodanig nalatig is bij het naleven van deze
      verordening dat directe intrekking gerechtvaardigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0014701#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0014701#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0014701#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0014701#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0014701#Artikel8
    url: https://wetten.overheid.nl/BWBR0014701/2004-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0014701
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0014701
        artikel: '5'
        paragraaf: '2'
      - id: ref3
