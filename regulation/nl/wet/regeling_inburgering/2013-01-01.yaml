  - number: 1.1.f
    text: |-
      inburgeringscursus: een door een cursusinstelling aangeboden cursus welke een inburgeringsplichtige in staat
      stelt mondelinge en schriftelijke vaardigheden in de Nederlandse taal en kennis van de Nederlandse samenleving te
      verwerven, teneinde het inburgeringsexamen te behalen.
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel1.1
  - number: '1.2'
    text: |-
      Het keurmerk, bedoeld in [artikel 4.1a, vijfde lid, van het besluit][ref1] is het Keurmerk Inburgeren, dat wordt
      toegekend en beheerd door de Stichting Blik op Werk.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
  - number: 1.3.1
    text: |-
      Als geestelijke bedienaar wordt in ieder geval aangemerkt de vreemdeling die houder is van een verblijfsvergunning
      voor bepaalde tijd als bedoeld in [artikel 14 van de Vreemdelingenwet 2000][ref1], die is verleend onder een
      beperking verband houdend met het verrichten van arbeid als geestelijke voorganger of godsdienstleraar.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 1.3.2
    text: |-
      Onder kerkgenootschap of een ander genootschap op geestelijke of levensbeschouwelijke grondslag als bedoeld
      in [artikel 1, eerste lid, onderdeel e, van de wet][ref1] wordt tevens verstaan een onderdeel daarvan of een
      rechtspersoon waarin twee of meer van deze genootschappen samenwerken.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel1
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '1'
  - number: 1.3.3
    text: |-
      Van werkzaamheden van overwegend godsdienstige, geestelijke of levensbeschouwelijke aard als bedoeld in
      [artikel 1, eerste lid, onderdeel e, van de wet][ref1] is in ieder geval sprake in geval van werkzaamheden als
      voorganger, godsdienstleraar, zendeling, leraar levensbeschouwelijk onderwijs, vertrouwenspersoon of pastoraal
      werker binnen een godsdienstige of levensbeschouwelijke gemeenschap, dan wel op het terrein van het uitdragen en
      verklaren van een bepaalde geloofsleer of levensbeschouwelijke opvattingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel1
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '1'
  - number: 1.3.4
    text: |-
      Als geestelijke bedienaar wordt niet aangemerkt degene die op louter incidentele basis werkzaamheden als bedoeld in
      het derde lid, verricht.
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel1.3
  - number: '2.1'
    text: |-
      De beperkingen, bedoeld in [artikel 2.1, eerste lid, van het besluit][ref1], zijn opgenomen in [bijlage 1][ref2]
      bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020657
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020657
  - number: '2.2'
    text: |-
      De diploma’s, certificaten en andere documenten, behaald in het Nederlandstalig onderwijs in de
      openbare lichamen Bonaire, Sint Eustatius of Saba, of in Aruba, Curaçao of Sint Maarten, bedoeld in
      [artikel 2.3, eerste lid, onderdeel f, van het besluit][ref1], zijn opgenomen in [bijlage 2][ref2] bij deze
      regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020657
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020657
  - number: 2.2a.1
    text: |-
      Van de verplichting om mondelinge en schriftelijke vaardigheden in de Nederlandse taal te verwerven en de
      onderdelen van het inburgeringsexamen, bedoeld in artikel 3.9, eerste lid, onderdelen a tot en met d, van het
      besluit te behalen, is vrijgesteld de inburgeringsplichtige die beschikt over een originele verklaring van het
      regionaal opleidingencentrum die is afgegeven op basis van de resultaten van een voor 1 januari 2007 afgelegde
      toets ter afronding van een NT2-taaltraject, indien uit de verklaring blijkt dat voor het onderdeel Nederlands
      als tweede taal ten minste de volgende niveaus van de eindtermen Referentiekader Nederlands als Tweede Taal, dan
      wel Europees Raamwerk voor Moderne Vreemde Talen, zijn behaald: - niveau 2, respectievelijk niveau A2, voor de
      onderdelen Luisteren en Spreken, en niveau 2, respectievelijk niveau A2 voor de onderdelen Lezen en Schrijven.
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel2.2a
  - number: 2.2a.2
    text: 'Om tot vrijstelling te kunnen leiden, dient de verklaring de volgende gegevens te bevatten:'
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel2.2a
  - number: 2.2a.2.a
    text: de naam van het document;
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel2.2a
  - number: 2.2a.2.b
    text: de naam en handtekening van de verantwoordelijke van het regionaal opleidingencentrum;
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel2.2a
  - number: 2.2a.2.c
    text: de echtheidskenmerken van het regionaal opleidingencentrum;
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel2.2a
  - number: 2.2a.2.d
    text: |-
      de naam en geboortedatum van de deelnemer aan het NT2-taaltraject die overeenkomen met de naam en geboortedatum
      zoals vermeld op zijn identiteitsdocument;
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel2.2a
  - number: 2.2a.2.e
    text: de behaalde taalniveaus uitgesplitst naar de vier taalvaardigheden Lezen, Schrijven, Luisteren en Spreken;
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel2.2a
  - number: 2.2a.2.f
    text: de datum waarop de toetsresultaten zijn behaald.
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel2.2a
  - number: 2.2b
    text: |-
      Van de verplichting om mondelinge vaardigheden in de Nederlandse taal te verwerven en het betreffende onderdeel
      van het inburgeringsexamen, bedoeld in [artikel 3.9, eerste lid, onderdeel d, van het besluit][ref1] te behalen,
      is vrijgesteld de inburgeringsplichtige die voor het onderdeel spreekvaardigheid van het basisexamen inburgering,
      bedoeld in [artikel 3.98a, derde lid, onderdeel c, van het Vreemdelingenbesluit 2000][ref2] ten minste 37 punten
      heeft behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel2.2b
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 2.2c
    text: |-
      Van de verplichting om mondelinge en schriftelijke vaardigheden in de Nederlandse taal te verwerven en de onderdelen
      van het inburgeringsexamen, bedoeld in [artikel 3.9, eerste lid, onderdelen a tot en met d, van het besluit][ref1]
      te behalen, is vrijgesteld de inburgeringsplichtige die beschikt over de volgende certificaten van het Certificaat
      Nederlands als Vreemde Taal:


