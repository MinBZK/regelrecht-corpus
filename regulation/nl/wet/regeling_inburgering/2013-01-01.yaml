    text: Certificaat Profiel Professionele Taalvaardigheid (ERK-niveau B2);
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel2.2c
  - number: 2.2c.e
    text: Certificaat Profiel Taalvaardigheid Hoger Onderwijs (ERK-niveau B2);
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel2.2c
  - number: 2.2c.f
    text: Certificaat Profiel Academische Taalvaardigheid (ERK-niveau C1).
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel2.2c
  - number: 2.2d
    text: |-
      Van de verplichting om mondelinge en schriftelijke vaardigheden in de Nederlandse
      taal te verwerven en het betreffende onderdeel van het inburgeringsexamen, bedoeld in
      [artikel 3.9, eerste lid, onderdeel a, b, c of d][ref1], te behalen is vrijgesteld de inburgeringsplichtige die
      beschikt over een certificaat dat is afgegeven ter afronding van het examenonderdeel lezen, schrijven, luisteren
      respectievelijk spreken van het staatsexamen Nederlands als tweede taal.


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel2.2d
    references:
