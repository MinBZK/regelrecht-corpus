        artikel: '3'
  - number: 3.8.2
    text: 'De examinator kan deelnemen aan de training indien hij:'
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel3.8
  - number: 3.8.2.a
    text: over het certificaat bekwaam docent Nederlands als tweede taal beschikt;
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel3.8
  - number: 3.8.2.b
    text: |-
      een opleiding van het hoger beroepsonderwijs of het wetenschappelijk onderwijs heeft afgerond en gedurende de twee
      jaar voorafgaand aan de inschrijving voor de training gemiddeld twee dagdelen per week leservaring heeft opgedaan,
      of als docent Nederlands als tweede taal, of
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel3.8
  - number: 3.8.2.c
    text: 'een van de volgende opleidingen heeft afgerond:'
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel3.8
  - number: 3.8.2.c.1°
    text: urgentieopleiding basiseducatie;
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel3.8
  - number: 3.8.2.c.2°
    text: post-hoger beroepsonderwijs basiseducatie;
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel3.8
  - number: 3.8.2.c.3°
    text: post-hoger beroepsonderwijs Nederlands als tweede taal;
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel3.8
  - number: 3.8.2.c.4°
    text: toegepaste taalwetenschap met specialisatie Nederlands als tweede taal;
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel3.8
  - number: 3.8.2.c.5°
    text: algemene taalwetenschap met specialisatie Nederlands als tweede taal;
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel3.8
  - number: 3.8.2.c.6°
    text: opleiding Nederlands als tweede taal – expert, of
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel3.8
  - number: 3.8.2.c.7°
    text: duale masteropleiding Nederlands als tweede taal
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel3.8
  - number: 3.8.3
    text: De training wordt tot 1 januari 2015 gegeven door CINOP.
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel3.8
  - number: 3.8.4
    text: |-
      CINOP reikt op aanvraag een certificaat uit, waaruit blijkt dat de deelnemer de training met goed gevolg heeft
      afgelegd en het aansluitende examen heeft behaald.
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel3.8
  - number: 3.8.5
    text: |-
      Het model van het certificaat, bedoeld in het vierde lid, is opgenomen in [bijlage 17][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020657
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0020657
  - number: 3.10.1
    text: De minister stelt een examenreglement vast.
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel3.10
  - number: 3.10.2
    text: |-
      Een ieder die zich overeenkomstig de daartoe gestelde regels heeft aangemeld, het verschuldigde examengeld heeft
      voldaan en zich overeenkomstig [artikel 3.4 van het besluit][ref1] heeft geïdentificeerd, wordt toegelaten tot de
      tot het inburgeringsexamen behorende onderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.10.3
    text: 'De kwaliteit van de examinering wordt gewaarborgd door:'
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel3.10
  - number: 3.10.3.a
    text: transparantie van de taken, bevoegdheden en verantwoordelijkheden bij de examinering;
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel3.10
  - number: 3.10.3.b
    text: |-
      het treffen van passende technische en organisatorische maatregelen om de examen- en persoonsgegevens te beveiligen
      tegen verlies of onrechtmatige verwerking;
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel3.10
  - number: 3.10.3.c
    text: |-
      het beschrijven van de procedure van verwerking van examenresultaten en de gegevensverstrekking ten behoeve van
      opneming in het Informatiesysteem Inburgering;
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel3.10
  - number: 3.10.3.d
    text: de naleving van het examenreglement, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel3.10
  - number: 3.10.3.e
    text: |-
      het treffen van passende technische en organisatorische maatregelen om de kwaliteit van de processen rondom de
      afname en de beoordeling van examens te waarborgen.
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel3.10
  - number: 3.13.1
    text: |-
      In het examenreglement, bedoeld in [artikel 3.10, eerste lid][ref1], wordt in ieder geval vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 3.13.1.a
    text: de procedure van aanmelding en identificatie van de inburgeringsplichtige;
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel3.13
  - number: 3.13.1.b
    text: de wijze waarop het examengeld wordt geïnd;
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel3.13
  - number: 3.13.1.c
    text: de wijze van bekendmaking van de uitslagen van de onderdelen van het inburgeringsexamen;
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel3.13
  - number: 3.13.1.d
    text: de procedure en sancties bij fraude, en
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel3.13
  - number: 3.13.1.e
    text: de procedure voor de afhandeling van klachten.
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel3.13
  - number: 4.1.1
    text: |-
      Van het bedrag van de lening, bedoeld in [artikel 4.1a, eerste lid, van het besluit][ref1] wordt twee maal
      de vastgestelde draagkracht, als vastgesteld op grond van [artikel 4.9, tweede tot en met vijfde lid][ref2],
      afgetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020657#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020657
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.1.2
    text: Indien het bedrag van de lening minder dan €180’ bedraagt, wordt dit op nul gesteld.
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.1
  - number: 4.2.1
    text: |-
      Ten behoeve van de betaling van de lening verstrekt de inburgeringsplichtige originele facturen aan de minister
      van:
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.2
  - number: 4.2.1.a
    text: |-
      de door hem te volgen of gevolgde inburgeringscursus en het door hem af te leggen of afgelegde onderdelen van het
      inburgeringsexamen;
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.2
  - number: 4.2.1.b
    text: |-
      de door hem te volgen of gevolgde cursus die opleidt tot het staatsexamen Nederlands als tweede taal en het door
      hem af te leggen of afgelegde examen, of
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.2
  - number: 4.2.1.c
    text: |-
      de door hem te volgen of gevolgde alfabetiseringscursus, indien hij op grond van
      [artikel 4.1a, derde lid, onderdeel a of b, van het besluit][ref1] in aanmerking komt voor een lening ten behoeve
      van het volgen van een alfabetiseringscursus.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
  - number: 4.2.2
    text: 'De factuur vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.2
  - number: 4.2.2.a
    text: het burgerservicenummer van de kandidaat;
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.2
  - number: 4.2.2.b
    text: de naam- en adresgegevens van de kandidaat;
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.2
  - number: 4.2.2.c
    text: de naam- en adresgegevens van de instelling;
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.2
  - number: 4.2.2.d
    text: de handtekening van de kandidaat;
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.2
  - number: 4.2.2.e
    text: de datum, en
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.2
  - number: 4.2.2.f
    text: de specificatie van het factuurbedrag.
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.2
  - number: 4.2.3
    text: |-
      De betaling van de factuur, bedoeld in het eerste lid, geschiedt binnen vier weken na ontvangst door de minister
      van die factuur.
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.2
  - number: 4.2.4
    text: |-
      De eerste betaling vindt plaats binnen een jaar na de beschikking, bedoeld in
      [artikel 4.4, eerste lid, van het besluit][ref1], waarbij het recht op de lening is vastgesteld. Indien binnen deze
      periode geen betaling heeft plaatsgevonden, vervalt de beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
  - number: '4.3'
    text: |-
      Het rentepercentage, genoemd in [artikel 4.5, eerste lid, van het besluit][ref1], bedraagt voor het jaar 2013:
      0,60 procent.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
  - number: 4.4.1
    text: |-
      De rente over de door de inburgeringsplichtige opgenomen lening wordt maandelijks berekend op basis van
      samengestelde interest.
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.4
  - number: 4.4.2
    text: |-
      Voor de berekening van de rente op de voet van het eerste lid wordt een maand gesteld op 30 dagen en een jaar
      gesteld op 360 dagen.
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.4
  - number: 4.5.1
    text: |-
      Gedurende de aanloopfase, bedoeld in [artikel 17, eerste lid, van de wet][ref1], en de eerste vijf jaren van de de
      terugbetalingsperiode, bedoeld in [artikel 4.6, eerste lid, van het besluit][ref2], wordt hetzelfde rentepercentage
      gehanteerd, vastgesteld overeenkomstig [artikel 4.5, eerste lid, van het besluit][ref3]. Het bij aanvang van de
      aanloopfase geldende rentepercentage wordt gehanteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0020674#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0020674
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0020674
        artikel: '4'
  - number: 4.5.2
    text: |-
      Voor de resterende terugbetalingsperiode na het verstrijken van de in het eerste lid genoemde termijn wordt het
      rentepercentage opnieuw vastgesteld overeenkomstig [artikel 4.5, eerste lid, van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
  - number: 4.6.1
    text: |-
      De hoogte van de maandelijkse termijn wordt berekend op basis van het bedrag aan opgebouwde schuld vermeerderd met
      de over dat bedrag verschuldigde rente, berekend overeenkomstig [artikel 4.4][ref1] en gedeeld door het aantal te
      betalen termijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.6.2
    text: |-
      De hoogte van de maandelijkse termijn bedraagt ten minste € 15. Indien de draagkracht overeenkomstig
      [artikel 4.9][ref1] is vastgesteld op minder dan € 180’ per jaar, wordt het maandelijkse termijnbedrag op nul
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.7.1
    text: |-
      In afwijking van [artikel 4.7, eerste lid, van het besluit][ref1] vervallen de rente en aflossing van de lening
      van een debiteur, die niet binnenlands belastingplichtig is in de zin van de [Wet inkomstenbelasting 2001][ref2],
      gedurende de aflosfase in jaarlijkse termijnen. [Artikel 4.4][ref3] is in dat geval van overeenkomstige toepassing.
      Indien de debiteur zich voor het einde van een jaartermijn metterwoon in Nederland vestigt, wordt hij tot het einde
      van die jaartermijn behandeld als een debiteur die niet binnenlands belastingplichtig is. Op aanvraag van de in de
      eerste volzin bedoelde debiteur kan de minister besluiten dat de rente en aflossing van de lening niet vervallen in
      jaarlijkse termijnen maar in maandelijkse termijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353
      [ref3]: https://wetten.overheid.nl/BWBR0020657#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011353
      - id: ref3
        bwb_id: BWBR0020657
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.7.2
    text: |-
      De hoogte van de jaarlijkse dan wel de maandelijkse termijn, bedoeld in het eerste lid, laatste volzin, wordt
      berekend overeenkomstig [artikel 4.6][ref1], tenzij de debiteur, bedoeld in het eerste lid, bij de minister een
      aanvraag indient tot vaststelling van zijn draagkracht voor de resterende aflosfase. In dat geval levert hij aan de
      minister de door de minister gevraagde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.7.3
    text: 'De betaling van de maandelijkse termijn, bedoeld in het eerste lid, laatste volzin, geschiedt door middel van:'
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.7
  - number: 4.7.3.a
    text: |-
      een daartoe door de debiteur verleende doorlopende machtiging om het verschuldigde bedrag maandelijks te doen
      afschrijven van een door de debiteur aangewezen bank- of girorekening in Nederland of
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.7
  - number: 4.7.3.b
    text: een door de minister aan de debiteur gezonden acceptgirokaart.
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.7
  - number: 4.7a
    text: |-
      De inburgeringsplichtige kan in afwijking van [artikel 4.7, eerste lid, van het besluit][ref1] de lening in een
      keer terugbetalen. De terugbetaling omvat het bedrag van de opgebouwde schuld vermeerderd met de over dat bedrag
      verschuldigde rente, berekend overeenkomstig [artikel 4.4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020657#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.7a
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020657
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.9.1
    text: |-
      De draagkracht die wordt vastgesteld overeenkomstig dit artikel, gaat in op de eerste dag van de maand volgend op
      de maand waarin de aanvraag, bedoeld in [artikel 4.9 van het besluit][ref1], is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
  - number: 4.9.2
    text: |-
      Maatstaf voor de vaststelling van de draagkracht de debiteur is het totaal van het toetsingsinkomen van de debiteur
      en zijn partner in het tweede jaar voorafgaande aan het jaar waarvoor de draagkracht wordt vastgesteld. Het aldus
      bepaalde inkomen is het draagkrachtinkomen.
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.9
  - number: 4.9.3
    text: 'Op het draagkrachtinkomen wordt in mindering gebracht de draagkrachtvrije voet. Deze voet is gelijk aan:'
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.9
  - number: 4.9.3.a
    text: 120% van het belastbaar minimumloon voor een debiteur met partner, of
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.9
  - number: 4.9.3.b
    text: |-
      120% van het belastbaar minimumloon voor een debiteur op wie de alleenstaande ouderkorting, bedoeld in
      [artikel 8.9 van de Wet inkomstenbelasting 2001][ref1], van toepassing is, of


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
  - number: 4.9.3.c
    text: 84% van het belastbaar minimumloon voor overige debiteuren zonder partner.
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.9
  - number: 4.9.4
    text: De draagkracht de debiteur is 12% van het inkomen boven de draagkrachtvrije voet.
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.9
  - number: 4.9.5
    text: |-
      Voor de toepassing van dit artikel wordt indien het toetsingsinkomen of het belastbaar loon in het tweede jaar
      voorafgaande aan het jaar waarvoor de draagkracht wordt vastgesteld, nog niet bekend is, door de minister daarvoor
      in de plaats gesteld een bedrag dat het vast te stellen toetsingsinkomen of het belastbaar loon benadert.
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.9
  - number: 4.10.1
    text: |-
      Op aanvraag van de debiteur wordt bij de toepassing van [artikel 4.9][ref1] uitgegaan van het inkomen van een ander
      jaar dan het inkomen over het tweede jaar voorafgaande aan het jaar waarvoor de draagkracht wordt vastgesteld,
      indien sprake is van terugval in inkomen:


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.10.1.a
    text: |-
      over het jaar voorafgaande aan het jaar waarvoor de draagkracht wordt vastgesteld, in welk geval wordt uitgegaan
      van het jaar voorafgaande aan het jaar waarvoor de draagkracht wordt vastgesteld, of
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.10
  - number: 4.10.1.b
    text: |-
      over het jaar waarvoor de draagkracht wordt vastgesteld, in welk geval wordt uitgegaan van het jaar waarvoor de
      draagkracht wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.10
  - number: 4.10.2
    text: |-
      Voor de toepassing van het eerste lid wordt onder een terugval in inkomen verstaan een vermindering van het
      toetsingsinkomen van de debiteur van ten minste 15% ten opzichte van het tweede jaar voorafgaande aan het jaar
      waarvoor de draagkracht wordt vastgesteld, met dien verstande dat de vermindering niet kan worden gerekend tot
      inkomensschommelingen die in het algemeen normaal kunnen worden geacht bij de gekozen wijze van inkomensverwerving.
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.10
  - number: 4.10.3
    text: |-
      Voor de toepassing van het eerste lid wordt zolang het belastbaar inkomen over het tweede jaar voorafgaande aan het
      jaar waarvoor de draagkracht wordt vastgesteld, het jaar voorafgaande aan het jaar waarvoor de draagkracht wordt
      vastgesteld, of het jaar waarvoor de draagkracht wordt vastgesteld nog niet definitief bekend is, daarvoor in de
      plaats gesteld het bedrag dat naar het oordeel van de minister het uiteindelijke belastbaar loon benadert.
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.10
  - number: '4.11'
    text: |-
      Indien de partner van de debiteur ook een debiteur is die een beschikking tot terugbetaling als bedoeld in
      [artikel 4.8, eerste lid, van het besluit][ref1] heeft ontvangen, wordt:


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
  - number: 4.11.a
    text: |-
      [artikel 4.9, tweede en vierde lid][ref1], slechts eenmaal toegepast op het totaal van het toetsingsinkomen, en


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.11.b
    text: |-
      bij toepassing van [artikel 4.10 van het besluit][ref1] de te betalen maandelijkse termijn per debiteur vastgesteld
      op basis van de verhouding tussen de hoogte van het toetsingsinkomen van beide debiteuren afzonderlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
  - number: '4.12'
    text: |-
      De debiteur is in verzuim indien binnen twee weken na de vervaldatum van een vordering het bedrag van de verplichte
      terugbetaling niet is ontvangen.
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.12
  - number: '4.16'
    text: |-
      Bij uitvaardiging van het dwangbevel, bedoeld in artikel 17, tweede lid, van de wet kunnen de achterstallige
      termijnen worden overgedragen aan een gerechtsdeurwaarder mits:
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.16
  - number: 4.16.a
    text: het achterstallige deel minimaal € 180 bedraagt, of
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.16
  - number: 4.16.b
    text: het deel dat zes maanden of langer achterstallig is, minimaal € 15 bedraagt.
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.16
  - number: 4.17.1
    text: |-
      De minister kan de achterstallige termijnen alsmede het resterende verschuldigde bedrag van de debiteur die direct
      voorafgaande aan de beëindiging van de inburgeringsplicht houder is geweest van een verblijfsvergunning voor
      bepaalde tijd als bedoeld in [artikel 28 van de Vreemdelingenwet 2000][ref1], op verzoek geheel kwijtschelden,
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.17
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
  - number: 4.17.1.a
    text: |-
      uit de gegevens in de gemeentelijke basisadministratie persoonsgegevens blijkt dat de debiteur geen verblijfsrecht
      meer heeft, en
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.17
  - number: 4.17.1.b
    text: |-
      de Immigratie- en Naturalisatiedienst kan bevestigen dat de debiteur niet langer inburgeringsplichtig is omdat de
      verblijfsvergunning, bedoeld in [artikel 29 van de Vreemdelingenwet 2000][ref1], is ingetrokken aangezien de grond
      voor verlening daarvan is komen te vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.17
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
  - number: 4.17.2
    text: |-
      Als tijdstip van indiening van het verzoek wordt aangemerkt het moment dat de minister op grond van de gegevens
      in de gemeentelijke basisadministratie persoonsgegevens heeft geconstateerd dat er geen sprake meer is van een
      verblijfsrecht.
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel4.17
  - number: '6.1'
    text: |-
      De bijzondere persoonsgegevens, bedoeld in [artikel 50, eerste lid, van de wet][ref1] zijn gegevens waaruit blijkt
      dat een inburgeringsplichtige:


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel50
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '50'
  - number: 6.1.a
    text: een geestelijke bedienaar is;
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel6.1
  - number: 6.1.b
    text: |-
      is ontheven van de inburgeringsplicht op grond van [artikel 6, eerste lid, onderdeel a of b, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel6
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '6'
  - number: 6.1.c
    text: |-
      een bestuurlijke boete als bedoeld in [artikel 31][ref1] of [33 van de wet][ref2] is opgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel33
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '33'
  - number: 6.1.d
    text: |-
      het inburgeringsexamen dan wel een deel daarvan slechts kan afleggen op een wijze die is aangepast aan zijn
      mogelijkheden.
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel6.1
  - number: 6.2.1
    text: |-
      De verwerking van bijzondere persoonsgegevens, bedoeld in [artikel 6.1, onderdeel a][ref1], is in ieder
      geval noodzakelijk voor de beoordeling van de inburgeringsplicht van een geestelijke bedienaar overeenkomstig
      [artikel 3, eerste lid, onderdeel b, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '3'
  - number: 6.2.2
    text: |-
      De verwerking van bijzondere persoonsgegevens als bedoeld in [artikel 6.1, onderdeel b][ref1], is in ieder geval
      noodzakelijk voor de beoordeling van de inburgeringsplicht overeenkomstig [artikel 3 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '3'
  - number: 6.2.3
    text: |-
      De verwerking van bijzondere persoonsgegevens als bedoeld in [artikel 6.1, onderdeel c][ref1], is in ieder geval
      noodzakelijk voor de beoordeling of een inburgeringsplichtige gehandeld heeft in strijd met de [artikelen 7][ref2]
      of [32 van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel32
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0020611
        artikel: '32'
  - number: 6.2.4
    text: |-
      De verwerking van bijzondere persoonsgegevens als bedoeld in [artikel 6.1, onderdeel d][ref1], is in ieder geval
      noodzakelijk om de kandidaat met een psychische of lichamelijk belemmering, dan wel een verstandelijke handicap,
      op diens verzoek in de gelegenheid te stellen het inburgeringsexamen dan wel een deel daarvan af te leggen op een
      wijze die is aangepast aan zijn mogelijkheden.


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel6
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.2.5
    text: |-
      De bijzondere persoonsgegevens worden ten behoeve van de in het eerste lid bedoelde doeleinden verstrekt aan het
      Informatiesysteem Inburgering.
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel6.2
  - number: 6.3.1
    text: |-
      Voorzover de bijzondere persoonsgegevens zijn opgeslagen in het Informatiesysteem Inburgering, wordt dit bestand
      beveiligd tegen ongeautoriseerd gebruik door:
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel6.3
  - number: 6.3.1.a
    text: |-
      het toekennen van autorisaties aan alleen die personen, die voor het uitoefenen van hun taak toegang tot de
      opgeslagen informatie moeten hebben;
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel6.3
  - number: 6.3.1.b
    text: het bewaren van een reservebestand op een voor niet-geautoriseerde personen ontoegankelijke plaats.
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel6.3
  - number: 6.3.2
    text: |-
      De minister, stelt richtlijnen op voor het verwerken van bijzondere persoonsgegevens in het Informatiesysteem
      Inburgering.
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel6.3
  - number: '6.4'
    text: |-
      De onverenigbare verwerking van bijzondere persoonsgegevens door de minister wordt op de volgende wijze
      tegengegaan:
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel6.4
  - number: 6.4.a
    text: |-
      de toegang tot de gegevens in het Informatiesysteem Inburgering is voorbehouden aan die personen, die voor het
      uitoefenen van hun taak, bedoeld in [artikel 6.2][ref1], toegang tot de informatie moeten hebben;


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel6
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.4.b
    text: |-
      de minister, stelt een functionaris voor de gegevensbescherming aan, die toeziet op de naleving van de
      [Wet bescherming persoonsgegevens][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: 6.4.c
    text: |-
      de minister, verricht integriteits- en kwaliteitsaudits ten aanzien van de verwerking van de persoonsgegevens en
      rapporteert deze aan de functionaris voor de gegevensbescherming.
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel6.4
  - number: '9.2'
    text: |-
      In afwijking van [artikel 5.1][ref1], wordt een in dat artikel genoemde vaststelling gedaan voor 26 februari 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel5
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '5'
        hoofdstuk: '5'
  - number: '9.4'
    text: |-
      Het aanbieden van inburgeringsprogramma’s, bedoeld in [artikel 65 van de wet][ref1], geschiedt overeenkomstig
      de [Regeling inburgering oudkomers G25 2006][ref2], de [Regeling inburgering oudkomers G30 2006][ref3] en de
      [Regeling inburgering oudkomers niet-G56 2006][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0019119
      [ref3]: https://wetten.overheid.nl/BWBR0019824
      [ref4]: https://wetten.overheid.nl/BWBR0019120
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '65'
      - id: ref2
        bwb_id: BWBR0019119
      - id: ref3
        bwb_id: BWBR0019824
      - id: ref4
        bwb_id: BWBR0019120
  - number: 9.6.1
    text: Deze regeling treedt in werking met ingang van 1 januari 2007.
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel9.6
  - number: 9.6.2
    text: |-
      [Artikel 9.4][ref1] werkt terug tot en met 1 januari 2006.


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel9
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel9.6
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '9'
        hoofdstuk: '9'
  - number: '9.7'
    text: 'Deze regeling wordt aangehaald als: Regeling inburgering.'
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel9.7
