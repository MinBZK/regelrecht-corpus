        bwb_id: BWBR0020657
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 2.4.2
    text: |-
      De arts, bedoeld in [artikel 2.8, eerste lid, van het besluit][ref1], adviseert tot ontheffing van de
      inburgeringsplicht, indien de inburgeringsplichtige:


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '2'
  - number: 2.4.2.a
    text: niet in staat is zich met lichte aanpassingen binnen vijf jaar voor te bereiden op het inburgeringsexamen, of
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel2.4
  - number: 2.4.2.b
    text: |-
      bijzondere examenomstandigheden nodig heeft om het inburgeringsexamen te kunnen behalen en de bijzondere
      examenomstandigheden, bedoeld in [artikel 3.2][ref1], hiertoe niet toereikend zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 2.4.3
    text: |-
      De arts, bedoeld in [artikel 2.8, eerste lid, van het besluit][ref1], stelt het advies op conform het protocol dat
      is opgenomen in [bijlage 4][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020657
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel2.4
