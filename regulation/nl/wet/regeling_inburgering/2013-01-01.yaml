  - number: 2.4.1
    text: |-
      Het advies, bedoeld in [artikel 2.8, eerste lid, van het besluit][ref1], bevat in ieder geval een oordeel met
      betrekking tot het verlenen dan wel het weigeren van de ontheffing van de inburgeringsplicht en, indien van
      toepassing, noodzakelijke bijzondere examenomstandigheden als bedoeld in [artikel 3.2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020657#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2013-01-01#Artikel2.4
