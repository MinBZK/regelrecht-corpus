        artikel: '3'
  - number: 3.1.2
    text: |-
      Voor inburgeringsplichtigen met een verblijfsvergunning regulier voor bepaalde tijd bedraagt het examengeld voor
      het examenonderdeel participatieverklaringstraject, bedoeld in [artikel 3.9, eerste lid, van het besluit][ref1],
      € 150,00.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel3.1
    references:
