    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.1.1.a
    text: |-
      € 50,00 voor elk van de onderdelen van het inburgeringsexamen, bedoeld in
      [artikel 3.9, tweede lid, onderdelen a tot en met c, van het besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel3.1
    references:
      - id: ref1
