  - number: 1.1.c
    text: |-
      belastbaar loon: het belastbaar loon, bedoeld in [artikel 9 van de Wet op de loonbelasting 1964][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel9
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel1.1
    references:
