  - number: 3.3.1
    text: |-
      Het model van het inburgeringsdiploma is opgenomen in [bijlage 6][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020657
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0020657
  - number: 3.3.2
    text: |-
      De tekst van de participatieverklaring, bedoeld in [artikel 8, tweede lid, van de wet][ref1], is opgenomen in
      [bijlage 7][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0020657
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0020657
  - number: '3.4'
    text: |-
      De Staat der Nederlanden (Ministerie van Sociale Zaken en Werkgelegenheid) maakt een voorbehoud als bedoeld in
      [artikel 15b van de Auteurswet][ref1] met betrekking tot de inhoud van het inburgeringsexamen.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel15b
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 15b
  - number: 3.5.1
    text: |-
      Het praktijkexamen oriëntatie op de Nederlandse arbeidsmarkt, bedoeld in
      [artikel 3.9a, vierde lid, van het besluit][ref1], bestaat uit het ter beoordeling voorleggen van een portfolio als
      bedoeld in [bijlage 5A][ref2] en het voeren van een eindgesprek.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020657
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020657
  - number: 3.5.2
    text: |-
      In afwijking van het eerste lid bestaat het praktijkexamen, voor degene die hierom verzoekt en daarbij aantoont
      ten minste 64 uur te hebben deelgenomen aan het cursusonderdeel oriëntatie op de Nederlandse arbeidsmarkt bij een
      cursusinstelling met het Blik op werk keurmerk, uit het ter beoordeling voorleggen van een portfolio als bedoeld in
      [bijlage 5A][ref1]. Het portfolio kan in dit geval slechts digitaal worden ingediend op de wijze zoals beschreven
      op www.mijninburgering.nl


      [ref1]: https://wetten.overheid.nl/BWBR0020657
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0020657
  - number: '3.6'
    text: |-
      Van de resultaten van het onderdeel spreekvaardigheid worden de antwoorden op meerkeuzevragen beoordeeld door het
      geautomatiseerde systeem, bedoeld in [artikel 3.9b, tweede lid, van het besluit][ref1] en de antwoorden op de open
      vragen door beoordelaars.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.8.1
    text: |-
      De deskundigheid van de beoordelaars, bedoeld in [artikel 3.13, onderdeel c, van het besluit][ref1], blijkt uit een
      afgeronde door de minister vast te stellen Examentraining schrijfvaardigheid of spreekvaardigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.8.2
    text: De Examentraining wordt gegeven door een door de Minister aan te wijzen instelling.
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel3.8
  - number: 3.8.3
    text: |-
      De in het tweede lid genoemde instelling reikt een certificaat uit, waaruit blijkt dat de deelnemer de training met
      goed gevolg heeft afgelegd en het aansluitende examen heeft behaald.
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel3.8
  - number: 3.9.1
    text: |-
      De deskundigheid van de examinatoren, bedoeld in [artikel 3.13, onderdeel c, van het besluit][ref1] blijkt uit een
      afgeronde door de minister vast te stellen Examentraining Arbeidsmarktmodule.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.9.2
    text: De Examentraining wordt gegeven door een door de Minister aan te wijzen instelling.
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel3.9
  - number: 3.9.3
    text: |-
      De in het tweede lid genoemde instelling reikt een certificaat uit, waaruit blijkt dat de deelnemer de training met
      goed gevolg heeft afgelegd en het aansluitende examen heeft behaald.
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel3.9
  - number: 3.10.1
    text: |-
      De minister stelt voor de examenonderdelen, bedoeld in [artikel 7, tweede lid, onderdelen b en c, van de wet][ref1]
      een examenreglement vast.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '7'
  - number: 3.10.2
    text: |-
      Een ieder die zich overeenkomstig de daartoe gestelde regels heeft aangemeld, het verschuldigde examengeld heeft
      voldaan en zich overeenkomstig [artikel 3.4 van het besluit][ref1] heeft geïdentificeerd, wordt toegelaten tot de
      tot het inburgeringsexamen behorende onderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.10.3
    text: 'De kwaliteit van de examinering wordt gewaarborgd door:'
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel3.10
  - number: 3.10.3.a
    text: transparantie van de taken, bevoegdheden en verantwoordelijkheden bij de examinering;
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel3.10
  - number: 3.10.3.b
    text: |-
      het treffen van passende technische en organisatorische maatregelen om de examen- en persoonsgegevens te beveiligen
      tegen verlies of onrechtmatige verwerking;
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel3.10
  - number: 3.10.3.c
    text: |-
      het beschrijven van de procedure van verwerking van examenresultaten en de gegevensverstrekking ten behoeve van
      opneming in het Informatiesysteem Inburgering;
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel3.10
  - number: 3.10.3.d
    text: de naleving van het examenreglement, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel3.10
  - number: 3.10.3.e
    text: |-
      het treffen van passende technische en organisatorische maatregelen om de kwaliteit van de processen rondom de
      afname en de beoordeling van examens te waarborgen.
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel3.10
  - number: 3.10.4
    text: |-
      Om tot het inburgeringsexamen te worden toegelaten is de kandidaat verplicht in te stemmen met de in
      [bijlage 18][ref1] opgenomen geheimhoudingsverklaring ten aanzien van de inhoud van het examen.


      [ref1]: https://wetten.overheid.nl/BWBR0020657
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0020657
  - number: '3.13'
    text: |-
      In het examenreglement, bedoeld in [artikel 3.10, eerste lid][ref1], wordt in ieder geval vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel3.13
    references:
