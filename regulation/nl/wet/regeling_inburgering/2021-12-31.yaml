  - number: 1.1.a
    text: |-
      besluit: het [Besluit inburgering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020674
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0020674
  - number: 1.1.b
    text: 'de minister: de Minister van Sociale Zaken en Werkgelegenheid;'
