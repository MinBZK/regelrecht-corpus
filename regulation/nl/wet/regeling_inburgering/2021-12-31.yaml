        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.4d.4
    text: |-
      Onder de inburgeringsplichtige, bedoeld in het eerste lid, wordt mede verstaan de inburgeringsplichtige, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ________________________________________________________________________________________________
      (Stb. 2012, 430), die een ontheffing aanvraagt op grond van de regels gesteld bij of krachtens
      [artikel 6, eerste lid, van de wet][ref2], zoals dit luidde op 31 december 2012.


      [ref1]: https://wetten.overheid.nl/BWBR0032031#ArtikelX
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel6
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.4d
    references:
      - id: ref1
        bwb_id: BWBR0032031
        artikel: X
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '6'
  - number: 2.4d.5
    text: |-
      Het bedrag, bedoeld in het eerste lid, wordt aan de inburgeringsplichtige terugbetaald indien in het advies,
      bedoeld in [artikel 2.4, eerste lid][ref1], wordt geadviseerd de gevraagde ontheffing van de inburgeringsplicht
      te verlenen dan wel deze niet te verlenen, en tevens wordt geadviseerd de inburgeringsplichtige de examens onder
      aangepaste examenomstandigheden af te laten leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel2
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.4d
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '2.5'
    text: |-
      De eindtermen van het in [artikel 2.10, eerste lid, van het besluit][ref1] bedoelde onderdeel kennis van de
      Nederlandse samenleving zijn voor wat betreft het onderdeel kennis van de Nederlandse maatschappij opgenomen in
      [bijlage 5][ref2] en voor wat betreft de het onderdeel oriëntatie op de Nederlandse arbeidsmarkt opgenomen in
      [bijlage 5A][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020657
      [ref3]: https://wetten.overheid.nl/BWBR0020657
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.5
