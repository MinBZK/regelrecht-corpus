  - number: 1.1.d
    text: |-
      toetsingsinkomen: het toetsingsinkomen, bedoeld in
      [artikel 8 van de Algemene wet inkomensafhankelijke regelingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel8
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '8'
  - number: 1.1.e
    text: |-
      staatsexamen Nederlands als tweede taal: staatsexamen Nederlands als tweede taal I of II als bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel c, van de Wet educatie en beroepsonderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 1.1.f
    text: |-
      inburgeringscursus: door een cursusinstelling aangeboden cursus die een inburgeringsplichtige in staat stelt
      mondelinge en schriftelijke vaardigheden in de Nederlandse taal en kennis van de Nederlandse samenleving te
      verwerven, teneinde het inburgeringsexamen te behalen;
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel1.1
  - number: 1.1.g
    text: |-
      cursus Nederlands als tweede taal: door een cursusinstelling aangeboden cursus die een inburgeringsplichtige in
      staat stelt mondelinge en schriftelijke vaardigheden in de Nederlandse taal te verwerven, teneinde het staatsexamen
      Nederlands als tweede taal te behalen.
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel1.1
  - number: '1.2'
    text: |-
      Het keurmerk, bedoeld in [artikel 4.1a, vierde lid, van het besluit][ref1] is het Keurmerk Inburgeren, dat wordt
      toegekend en beheerd door de Stichting Blik op Werk.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
  - number: 1.3.1
    text: |-
      Als geestelijke bedienaar wordt in ieder geval aangemerkt de vreemdeling die houder is van een verblijfsvergunning
      voor bepaalde tijd als bedoeld in [artikel 14 van de Vreemdelingenwet 2000][ref1], die is verleend onder een
      beperking verband houdend met het verrichten van arbeid als geestelijke voorganger of godsdienstleraar.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 1.3.2
    text: |-
      Onder kerkgenootschap of een ander genootschap op geestelijke of levensbeschouwelijke grondslag als bedoeld
      in [artikel 1, eerste lid, onderdeel e, van de wet][ref1] wordt tevens verstaan een onderdeel daarvan of een
      rechtspersoon waarin twee of meer van deze genootschappen samenwerken.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel1
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '1'
  - number: 1.3.3
    text: |-
      Van werkzaamheden van overwegend godsdienstige, geestelijke of levensbeschouwelijke aard als bedoeld in
      [artikel 1, eerste lid, onderdeel e, van de wet][ref1] is in ieder geval sprake in geval van werkzaamheden als
      voorganger, godsdienstleraar, zendeling, leraar levensbeschouwelijk onderwijs, vertrouwenspersoon of pastoraal
      werker binnen een godsdienstige of levensbeschouwelijke gemeenschap, dan wel op het terrein van het uitdragen en
      verklaren van een bepaalde geloofsleer of levensbeschouwelijke opvattingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel1
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '1'
  - number: 1.3.4
    text: |-
      Als geestelijke bedienaar wordt niet aangemerkt degene die op louter incidentele basis werkzaamheden als bedoeld in
      het derde lid, verricht.
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel1.3
  - number: '2.1'
    text: |-
      De beperkingen, bedoeld in [artikel 2.1, eerste en tweede lid, van het besluit][ref1], zijn opgenomen in
      [bijlage 1][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020657
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020657
  - number: '2.2'
    text: |-
      De diploma’s, certificaten en andere documenten, behaald in het Nederlandstalig onderwijs in de
      openbare lichamen Bonaire, Sint Eustatius of Saba, of in Aruba, Curaçao of Sint Maarten, bedoeld in
      [artikel 2.3, eerste lid, onderdeel e, van het besluit][ref1], zijn opgenomen in [bijlage 2][ref2] bij deze
      regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020657
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020657
  - number: 2.2a.1
    text: |-
      Van de verplichting om mondelinge en schriftelijke vaardigheden in de Nederlandse taal te verwerven en de onderdelen
      van het inburgeringsexamen, bedoeld in [artikel 3.9, tweede lid, onderdelen a tot en met d, van het besluit][ref1]
      te behalen, is vrijgesteld de inburgeringsplichtige die beschikt over een originele verklaring van het regionaal
      opleidingencentrum die is afgegeven op basis van de resultaten van een voor 1 januari 2007 afgelegde toets ter
      afronding van een NT2-taaltraject, indien uit de verklaring blijkt dat voor het onderdeel Nederlands als tweede
      taal ten minste de volgende niveaus van de eindtermen Referentiekader Nederlands als Tweede Taal, dan wel Europees
      Raamwerk voor Moderne Vreemde Talen, zijn behaald: - niveau 2, respectievelijk niveau A2, voor de onderdelen
      Luisteren en Spreken, en niveau 2, respectievelijk niveau A2 voor de onderdelen Lezen en Schrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.2a
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 2.2a.2
    text: 'Om tot vrijstelling te kunnen leiden, dient de verklaring de volgende gegevens te bevatten:'
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.2a
  - number: 2.2a.2.a
    text: de naam van het document;
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.2a
  - number: 2.2a.2.b
    text: de naam en handtekening van de verantwoordelijke van het regionaal opleidingencentrum;
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.2a
  - number: 2.2a.2.c
    text: de echtheidskenmerken van het regionaal opleidingencentrum;
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.2a
  - number: 2.2a.2.d
    text: |-
      de naam en geboortedatum van de deelnemer aan het NT2-taaltraject die overeenkomen met de naam en geboortedatum
      zoals vermeld op zijn identiteitsdocument;
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.2a
  - number: 2.2a.2.e
    text: de behaalde taalniveaus uitgesplitst naar de vier taalvaardigheden Lezen, Schrijven, Luisteren en Spreken;
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.2a
  - number: 2.2a.2.f
    text: de datum waarop de toetsresultaten zijn behaald.
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.2a
  - number: 2.2c
    text: |-
      Van de verplichting om mondelinge en schriftelijke vaardigheden in de Nederlandse taal te verwerven en de onderdelen
      van het inburgeringsexamen, bedoeld in [artikel 3.9, tweede lid, onderdelen a tot en met d, van het besluit][ref1]
      te behalen, is vrijgesteld de inburgeringsplichtige die beschikt over de volgende certificaten van het Certificaat
      Nederlands als Vreemde Taal:


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.2c
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 2.2c.a
    text: Certificaat Profiel Toeristische en Informele Taalvaardigheid (ERK-niveau A2);
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.2c
  - number: 2.2c.b
    text: Certificaat Profiel Taalvaardigheid Praktische Beroepen (ERK-niveau A2);
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.2c
  - number: 2.2c.c
    text: Certificaat Profiel Maatschappelijke Taalvaardigheid (ERK-niveau B1);
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.2c
  - number: 2.2c.d
    text: Certificaat Profiel Professionele Taalvaardigheid (ERK-niveau B2);
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.2c
  - number: 2.2c.e
    text: Certificaat Profiel Taalvaardigheid Hoger Onderwijs (ERK-niveau B2);
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.2c
  - number: 2.2c.f
    text: Certificaat Profiel Academische Taalvaardigheid (ERK-niveau C1).
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.2c
  - number: 2.2d
    text: |-
      Van de verplichting om voor een of meerdere onderdelen van de mondelinge en schriftelijke vaardigheden in de
      Nederlandse taal op ten minste het niveau A2 het examen te behalen, is vrijgesteld de inburgeringsplichtige die
      beschikt over een van de volgende bewijsstukken, waaruit blijkt dat een voldoende resultaat is behaald voor het vak
      Nederlandse taal:
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.2d
  - number: 2.2d.a
    text: |-
      een certificaat dat is afgegeven ter afronding van het examenonderdeel lezen, schrijven, luisteren respectievelijk
      spreken van het Staatsexamen Nederlands als tweede taal, alsmede degene die beschikt over het diploma van het
      Staatsexamen Nederlands als tweede taal;
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.2d
  - number: 2.2d.b
    text: |-
      een cijferlijst als bedoeld in [artikel 52 van het Eindexamenbesluit VO][ref1] of een certificaat als bedoeld in
      [artikel 53 van het Eindexamenbesluit VO][ref2] dan wel [artikel 31 van het Staatsexamenbesluit VO][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel53
      [ref3]: https://wetten.overheid.nl/BWBR0011538#Artikel31
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.2d
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '52'
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '53'
      - id: ref3
        bwb_id: BWBR0011538
        artikel: '31'
  - number: 2.2d.c
    text: |-
      een buitenlands diploma, getuigschrift of certificaat dat is behaald bij een door de overheid van het land waar
      de opleiding is gevolgd erkende instelling, waaruit blijkt dat de inburgeringsplichtige een of meerdere van de
      schriftelijke en mondelinge vaardigheden in de Nederlandse taal op ten minste het niveau A2 beheerst.
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.2d
  - number: 2.2e
    text: |-
      Van de verplichting om het onderdeel Oriëntatie op de Nederlandse arbeidsmarkt van het inburgeringsexamen,
      bedoeld in [artikel 2.10, eerste lid, onderdeel b, van het besluit][ref1], te behalen is vrijgesteld degene die de
      entreeopleiding, bedoeld in [artikel 7.2.2, eerste lid, onderdeel a, van de Wet educatie en beroepsonderwijs][ref2],
      heeft afgerond.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.2e
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
  - number: '2.3'
    text: |-
      Als organisaties als bedoeld in [artikel 2.5b van het besluit][ref1], worden aangewezen de Stichting Nuffic en de
      Stichting Samenwerking Beroepsonderwijs Bedrijfsleven.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '2'
  - number: 2.4.1
    text: |-
      Het advies, bedoeld in [artikel 2.8, eerste lid, van het besluit][ref1], bevat in ieder geval een oordeel met
      betrekking tot het verlenen dan wel het weigeren van de ontheffing van de inburgeringsplicht en, indien van
      toepassing, noodzakelijke bijzondere examenomstandigheden als bedoeld in [artikel 3.2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020657#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020657
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 2.4.2
    text: |-
      De arts, bedoeld in [artikel 2.8, eerste lid, van het besluit][ref1], adviseert tot ontheffing van de
      inburgeringsplicht, indien de inburgeringsplichtige:


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '2'
  - number: 2.4.2.a
    text: niet in staat is zich met lichte aanpassingen binnen vijf jaar voor te bereiden op het inburgeringsexamen, of
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.4
  - number: 2.4.2.b
    text: |-
      bijzondere examenomstandigheden nodig heeft om het inburgeringsexamen te kunnen behalen en de bijzondere
      examenomstandigheden, bedoeld in [artikel 3.2][ref1], hiertoe niet toereikend zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 2.4.3
    text: |-
      De arts, bedoeld in [artikel 2.8, eerste lid, van het besluit][ref1], stelt het advies op conform het protocol dat
      is opgenomen in [bijlage 4][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020657
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020657
  - number: 2.4a
    text: |-
      De minister verleent de ontheffing, bedoeld in [artikel 2.8a van het besluit][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.4a
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '2'
  - number: 2.4a.a
    text: |-
      de inburgeringsplichtige volgens de basisregistratie personen ten minste 10 jaar onafgebroken als ingezetene
      ingeschreven is geweest;
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.4a
  - number: 2.4a.b
    text: |-
      de inburgeringsplichtige naar het oordeel van de minister aantoonbaar gedurende ten minste 5 jaar betaald werk of
      vrijwilligerswerk heeft verricht in Nederland; en
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.4a
  - number: 2.4a.c
    text: |-
      in een gesprek is vastgesteld dat de inburgeringsplichtige de vaardigheden in de Nederlandse taal, bedoeld in
      [artikel 2.9, onderdelen a en b, van het besluit][ref1], beheerst op het in dat artikel bedoelde niveau.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.4a
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '2'
  - number: 2.4b
    text: |-
      De minister verleent de ontheffing, bedoeld in [artikel 2.8b van het besluit][ref1], in ieder geval indien de
      inburgeringsplichtige:


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.4b
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '2'
  - number: 2.4b.a
    text: |-
      ten minste viermaal heeft deelgenomen aan de niet behaalde onderdelen van het inburgeringsexamen, waarvan ten
      hoogste twee van de examenpogingen de overeenkomstige onderdelen van het staatsexamen Nederlands als tweede taal
      betreffen, en ten minste 600 uur bij een cursusinstelling met het Blik op Werk-keurmerk heeft deelgenomen aan:
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.4b
  - number: 2.4b.a.1°
    text: een inburgeringscursus;
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.4b
  - number: 2.4b.a.2°
    text: |-
      een combinatie van een alfabetiseringscursus en een inburgeringscursus, waarbij ten minste 200 uur besteed is aan
      de inburgeringscursus;
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.4b
  - number: 2.4b.a.3°
    text: een cursus Nederlands als tweede taal; of
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.4b
  - number: 2.4b.a.4°
    text: een combinatie van een inburgeringscursus en een cursus Nederlands als tweede taal;
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.4b
  - number: 2.4b.b
    text: |-
      ten minste 600 uur heeft deelgenomen aan een alfabetiseringscursus bij een cursusinstelling met het Blik op Werk
      keurmerk en uit een door de minister afgenomen toets blijkt dat de inburgeringsplichtige niet het leervermogen
      heeft om het inburgeringsexamen te halen; of
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.4b
  - number: 2.4b.c
    text: |-
      ten minste 600 uur heeft deelgenomen aan een combinatie van een alfabetiseringscursus en een inburgeringscursus,
      beide aan een cursusinstelling met het Blik op werk keurmerk, waarvan ten minste 300 uur besteed is aan de
      alfabetiseringscursus, en uit een door de Minister afgenomen toets blijkt dat de inburgeringsplichtige niet het
      leervermogen heeft om het inburgeringsexamen te halen.
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.4b
  - number: 2.4c.1
    text: |-
      De Minister verleent verlenging van de voor de inburgeringsplichtige geldende termijn op grond van
      [artikel 7b, derde lid, onderdeel a, van de wet][ref1] in ieder geval indien de inburgeringsplichtige ten
      minste 300 uur heeft deelgenomen aan een inburgeringscursus of een cursus Nederlands als tweede taal bij een
      cursusinstelling met het Blik op Werk keurmerk en ten minste twee maal heeft deelgenomen aan de niet behaalde
      onderdelen van het inburgeringsexamen of staatsexamen Nederlands als tweede taal.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7b
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.4c
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: 7b
  - number: 2.4c.2
    text: |-
      De Minister verleent verlenging van de voor de inburgeringsplichtige geldende termijn, bedoeld in
      [artikel 7b, eerste lid, van de wet][ref1], ook als de inburgeringsplichtige een opleiding volgt of heeft gevolgd
      waarvan de opleiding leidt tot uitreiking van een in [artikel 2.3, eerste lid, onderdeel b, van het besluit][ref2],
      opgesomd diploma of getuigschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7b
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel2
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.4c
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: 7b
      - id: ref2
        bwb_id: BWBR0020674
        artikel: '2'
  - number: 2.4c.3
    text: |-
      De inburgeringsplichtige verstrekt bij de aanvraag om verlenging op grond van het eerste lid een verklaring
      cursusdeelname en bij de aanvraag om verlenging op grond van het tweede lid een bewijs van inschrijving.
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.4c
  - number: 2.4c.4
    text: |-
      De verlenging, bedoeld in het eerste lid, wordt voor ten hoogste twee jaar verleend. De verlenging, bedoeld in het
      tweede lid, kan telkens voor ten hoogste twee jaar worden verleend.
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.4c
  - number: 2.4d.1
    text: |-
      Voor het onderzoek ten behoeve van een advies als bedoeld in [artikel 2.4, eerste lid][ref1], is door de
      inburgeringsplichtige een bedrag verschuldigd van € 225,00.


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel2
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.4d
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.4d.2
    text: |-
      Voor het in behandeling nemen van een aanvraag voor een ontheffing als bedoeld in [artikel 2.4a][ref1] is door de
      inburgeringsplichtige een bedrag verschuldigd van € 90,00.


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel2
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.4d
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.4d.3
    text: |-
      Voor het in behandeling nemen van een aanvraag voor een ontheffing als bedoeld in
      [artikel 2.4b, aanhef en onderdelen b en c][ref1], is door de inburgeringsplichtige een bedrag verschuldigd van
      € 150,00.


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel2
    url: https://wetten.overheid.nl/BWBR0020657/2021-12-31#Artikel2.4d
    references:
