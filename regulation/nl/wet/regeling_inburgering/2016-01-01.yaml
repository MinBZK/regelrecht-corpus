  - number: 2.4a
    text: |-
      De minister verleent de ontheffing, bedoeld in [artikel 2.8a van het besluit][ref1], indien:

      a. de inburgeringsplichtige volgens de basisregistratie personen ten minste 10 jaar onafgebroken als ingezetene
      ingeschreven is geweest; én

      b. de inburgeringsplichtige naar het oordeel van de minister aantoonbaar gedurende ten minste 5 jaar betaald werk
      of vrijwilligerswerk heeft verricht in Nederland; *én*

      c. in een gesprek is vastgesteld dat de inburgeringsplichtige de vaardigheden in de Nederlandse taal, bedoeld in
      [artikel 2.9, onderdelen a en b, van het besluit][ref2], beheerst op het in dat artikel bedoelde niveau.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2.8a
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel2.9
    url: https://wetten.overheid.nl/BWBR0020657/2016-01-01#Artikel2.4a
