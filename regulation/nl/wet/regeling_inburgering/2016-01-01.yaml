  - number: '9.4'
    text: |-
      Het aanbieden van inburgeringsprogramma’s, bedoeld in [artikel 65 van de wet][ref1], geschiedt overeenkomstig
      de [Regeling inburgering oudkomers G25 2006][ref2], de [Regeling inburgering oudkomers G30 2006][ref3] en de
      [Regeling inburgering oudkomers niet-G56 2006][ref4].


