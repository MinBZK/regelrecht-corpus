  - number: 2.4b
    text: |-
      De minister verleent de ontheffing, bedoeld in [artikel 2.8b van het besluit][ref1], indien de
      inburgeringsplichtige:

      a. ten minste 600 uur heeft deelgenomen aan een inburgeringscursus bij een instelling met het Blik op werk keurmerk
      en ten minste vier maal heeft deelgenomen aan de niet behaalde onderdelen van het inburgeringsexamen; of

      b. ten minste 600 uur heeft deelgenomen aan een alfabetiseringscursus bij een instelling met het Blik op Werk
      keurmerk en uit een door de minister afgenomen toets blijkt dat de inburgeringsplichtige niet het leervermogen
      heeft om het inburgeringsexamen te halen.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2.8b
    url: https://wetten.overheid.nl/BWBR0020657/2016-01-01#Artikel2.4b
