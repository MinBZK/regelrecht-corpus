  - number: '4.7'
    text: |-
      1 In afwijking van [artikel 4.7, eerste lid, van het besluit][ref1] vervallen de rente en aflossing van de lening
      van een debiteur, die niet binnenlands belastingplichtig is in de zin van de [Wet inkomstenbelasting 2001][ref2],
      gedurende de aflosfase in jaarlijkse termijnen. [Artikel 4.4][ref3] is in dat geval van overeenkomstige toepassing.
      Indien de debiteur zich voor het einde van een jaartermijn metterwoon in Nederland vestigt, wordt hij tot het einde
      van die jaartermijn behandeld als een debiteur die niet binnenlands belastingplichtig is. Op aanvraag van de in de
      eerste volzin bedoelde debiteur kan de minister besluiten dat de rente en aflossing van de lening niet vervallen in
      jaarlijkse termijnen maar in maandelijkse termijnen.

      2 De hoogte van de jaarlijkse dan wel de maandelijkse termijn, bedoeld in het eerste lid, laatste volzin, wordt
      berekend overeenkomstig [artikel 4.6][ref4], tenzij de debiteur, bedoeld in het eerste lid, bij de minister een
      aanvraag indient tot vaststelling van zijn draagkracht voor de resterende aflosfase. In dat geval levert hij aan de
      minister de door de minister gevraagde gegevens.

      3 De betaling van de maandelijkse termijn, bedoeld in het eerste lid, laatste volzin, geschiedt door middel van:

      a. een daartoe door de debiteur verleende doorlopende machtiging om het verschuldigde bedrag maandelijks te doen
      afschrijven van een door de debiteur aangewezen bank- of girorekening in Nederland of

      b. een door de minister aan de debiteur gezonden acceptgirokaart.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4.7
      [ref2]: https://wetten.overheid.nl/BWBR0011353
      [ref3]: https://wetten.overheid.nl/BWBR0020657#Artikel4.4
      [ref4]: https://wetten.overheid.nl/BWBR0020657#Artikel4.6
