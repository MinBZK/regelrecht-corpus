  - number: '4.4'
    text: |-
      1 De rente over de door de inburgeringsplichtige opgenomen lening wordt maandelijks berekend op basis van
      samengestelde interest.

      2 Voor de berekening van de rente op de voet van het eerste lid wordt een maand gesteld op 30 dagen en een jaar
      gesteld op 360 dagen.
    url: https://wetten.overheid.nl/BWBR0020657/2016-01-01#Artikel4.4
  - number: '4.5'
    text: |-
      1 Gedurende de aanloopfase, bedoeld in [artikel 17, eerste lid, van de wet][ref1], en de eerste vijf jaren
      van de de terugbetalingsperiode, bedoeld in [artikel 4.6, eerste lid, van het besluit][ref2], wordt hetzelfde
      rentepercentage gehanteerd, vastgesteld overeenkomstig [artikel 4.5, eerste lid, van het besluit][ref3]. Het bij
      aanvang van de aanloopfase geldende rentepercentage wordt gehanteerd.

      2 Voor de resterende terugbetalingsperiode na het verstrijken van de in het eerste lid genoemde termijn wordt het
      rentepercentage opnieuw vastgesteld overeenkomstig [artikel 4.5, eerste lid, van het besluit][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel17
