        artikel: '3.9'
  - number: '2.4'
    text: |-
      1 Het advies, bedoeld in [artikel 2.8, eerste lid, van het besluit][ref1], bevat in ieder geval een oordeel
      met betrekking tot het verlenen dan wel het weigeren van de ontheffing van de inburgeringsplicht en, indien van
      toepassing, noodzakelijke bijzondere examenomstandigheden als bedoeld in [artikel 3.2][ref2].

      2 De arts, bedoeld in [artikel 2.8, eerste lid, van het besluit][ref3], adviseert tot ontheffing van de
      inburgeringsplicht, indien de inburgeringsplichtige:

      a. niet in staat is zich met lichte aanpassingen binnen vijf jaar voor te bereiden op het inburgeringsexamen, of

      b. bijzondere examenomstandigheden nodig heeft om het inburgeringsexamen te kunnen behalen en de bijzondere
      examenomstandigheden, bedoeld in [artikel 3.2][ref4], hiertoe niet toereikend zijn.

      3 De arts, bedoeld in [artikel 2.8, eerste lid, van het besluit][ref5], stelt het advies op conform het protocol
      dat is opgenomen in [bijlage 4][ref6] bij deze regeling.


