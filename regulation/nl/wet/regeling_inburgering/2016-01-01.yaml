        bwb_id: BWBR0020657
        artikel: '4.9'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '4.2'
    text: |-
      1 Ten behoeve van de betaling van de lening verstrekt de inburgeringsplichtige originele facturen aan de minister
      van:

      a. de door hem te volgen of gevolgde inburgeringscursus en het door hem af te leggen of afgelegde onderdelen van
      het inburgeringsexamen;

      b. de door hem te volgen of gevolgde cursus die opleidt tot het staatsexamen Nederlands als tweede taal en het door
      hem af te leggen of afgelegde examen, of

      c. de door hem te volgen of gevolgde alfabetiseringscursus, indien hij op grond van
      [artikel 4.1a, derde lid, onderdeel a of b, van het besluit][ref1] in aanmerking komt voor een lening ten behoeve
      van het volgen van een alfabetiseringscursus.

      2 De factuur vermeldt in ieder geval:

      a. het burgerservicenummer van de kandidaat;

      b. de naam- en adresgegevens van de kandidaat;

      c. de naam- en adresgegevens van de instelling;

      d. de handtekening van de kandidaat;

      e. de datum, en

      f. de specificatie van het factuurbedrag.

      3 De betaling van de factuur, bedoeld in het eerste lid, geschiedt binnen vier weken na ontvangst door de minister
      van die factuur.

      4 De minister betaalt per kwartaal de bedragen van de lening aan de hand van de facturen met een maximum
      van € 1.250,–. Indien het bedrag van de facturen, bedoeld in het eerste lid, hoger is dan € 1.250,– wordt de
      inburgeringsplichtige verzocht nieuwe facturen te overleggen van nog verschuldigde bedragen voor gevolgde cursussen
      of voor examens als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4.1a
    url: https://wetten.overheid.nl/BWBR0020657/2016-01-01#Artikel4.2
