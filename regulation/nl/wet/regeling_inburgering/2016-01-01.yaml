        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0020674
        artikel: '4.10'
  - number: '4.12'
    text: |-
      De debiteur is in verzuim indien binnen twee weken na de vervaldatum van een vordering het bedrag van de verplichte
      terugbetaling niet is ontvangen.
    url: https://wetten.overheid.nl/BWBR0020657/2016-01-01#Artikel4.12
  - number: '4.16'
    text: |-
      Bij uitvaardiging van het dwangbevel, bedoeld in artikel 17, tweede lid, van de wet kunnen de achterstallige
      termijnen worden overgedragen aan een gerechtsdeurwaarder mits:

      a. het achterstallige deel minimaal € 180 bedraagt, of

      b. het deel dat zes maanden of langer achterstallig is, minimaal € 15 bedraagt.
    url: https://wetten.overheid.nl/BWBR0020657/2016-01-01#Artikel4.16
  - number: '4.17'
    text: |-
      1 De minister kan de achterstallige termijnen alsmede het resterende verschuldigde bedrag van de debiteur die
      direct voorafgaande aan de beëindiging van de inburgeringsplicht houder is geweest van een verblijfsvergunning
      voor bepaalde tijd als bedoeld in [artikel 28 van de Vreemdelingenwet 2000][ref1], op verzoek geheel kwijtschelden,
      indien:

      a. uit de gegevens in de basisregistratie personen blijkt dat de debiteur geen verblijfsrecht meer heeft, en

      b. de Immigratie- en Naturalisatiedienst kan bevestigen dat de debiteur niet langer inburgeringsplichtig is omdat
      de verblijfsvergunning, bedoeld in [artikel 29 van de Vreemdelingenwet 2000][ref2], is ingetrokken aangezien de
      grond voor verlening daarvan is komen te vervallen.

      2 Als tijdstip van indiening van het verzoek wordt aangemerkt het moment dat de minister op grond van de gegevens
      in de basisregistratie personen heeft geconstateerd dat er geen sprake meer is van een verblijfsrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0020657/2016-01-01#Artikel4.17
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '29'
  - number: '6.1'
    text: |-
      De bijzondere persoonsgegevens, bedoeld in [artikel 50, eerste lid, van de wet][ref1] zijn gegevens waaruit blijkt
      dat een inburgeringsplichtige:

      a. een geestelijke bedienaar is;

      b. is ontheven van de inburgeringsplicht op grond van [artikel 6, eerste lid, onderdeel a of b, van de wet][ref2];

      c. een bestuurlijke boete als bedoeld in [artikel 31][ref3] of [33 van de wet][ref4] is opgelegd;

      d. het inburgeringsexamen dan wel een deel daarvan slechts kan afleggen op een wijze die is aangepast aan zijn
      mogelijkheden.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel31
      [ref4]: https://wetten.overheid.nl/BWBR0020611#Artikel33
    url: https://wetten.overheid.nl/BWBR0020657/2016-01-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '50'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0020611
        artikel: '31'
      - id: ref4
        bwb_id: BWBR0020611
        artikel: '33'
  - number: '6.2'
    text: |-
      1 De verwerking van bijzondere persoonsgegevens, bedoeld in [artikel 6.1, onderdeel a][ref1], is in ieder
      geval noodzakelijk voor de beoordeling van de inburgeringsplicht van een geestelijke bedienaar overeenkomstig
      [artikel 3, eerste lid, onderdeel b, van de wet][ref2].

      2 De verwerking van bijzondere persoonsgegevens als bedoeld in [artikel 6.1, onderdeel b][ref3], is in ieder geval
      noodzakelijk voor de beoordeling van de inburgeringsplicht overeenkomstig [artikel 3 van de wet][ref4].

      3 De verwerking van bijzondere persoonsgegevens als bedoeld in [artikel 6.1, onderdeel c][ref5], is in ieder geval
      noodzakelijk voor de beoordeling of een inburgeringsplichtige gehandeld heeft in strijd met de [artikelen 7][ref6]
      of [32 van de wet][ref7].

      4 De verwerking van bijzondere persoonsgegevens als bedoeld in [artikel 6.1, onderdeel d][ref8], is in ieder geval
      noodzakelijk om de kandidaat met een psychische of lichamelijk belemmering, dan wel een verstandelijke handicap,
      op diens verzoek in de gelegenheid te stellen het inburgeringsexamen dan wel een deel daarvan af te leggen op een
      wijze die is aangepast aan zijn mogelijkheden.

      5 De bijzondere persoonsgegevens worden ten behoeve van de in het eerste lid bedoelde doeleinden verstrekt aan het
      Informatiesysteem Inburgering.


