        artikel: '6.2'
  - number: '4.1'
    text: |-
      1 Van het bedrag van de lening, bedoeld in [artikel 4.1a, eerste lid, van het besluit][ref1] wordt twee maal
      de vastgestelde draagkracht, als vastgesteld op grond van [artikel 4.9, tweede tot en met vijfde lid][ref2],
      afgetrokken.

      2 Indien het bedrag van de lening minder dan €180’ bedraagt, wordt dit op nul gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4.1a
      [ref2]: https://wetten.overheid.nl/BWBR0020657#Artikel4.9
    url: https://wetten.overheid.nl/BWBR0020657/2016-01-01#Artikel4.1
