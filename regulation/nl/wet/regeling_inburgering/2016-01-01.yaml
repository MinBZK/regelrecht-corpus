articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. besluit: het [Besluit inburgering][ref1];

      b. de minister: de Minister van Sociale Zaken en Werkgelegenheid;

      c. belastbaar loon: het belastbaar loon, bedoeld in [artikel 9 van de Wet op de loonbelasting 1964][ref2];

      d. toetsingsinkomen: het toetsingsinkomen, bedoeld in
      [artikel 8 van de Algemene wet inkomensafhankelijke regelingen][ref3];

      e. staatsexamen Nederlands als tweede taal: staatsexamen Nederlands als tweede taal I of II als bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel c, van de Wet educatie en beroepsonderwijs][ref4];

      f. inburgeringscursus: een door een cursusinstelling aangeboden cursus welke een inburgeringsplichtige in staat
      stelt mondelinge en schriftelijke vaardigheden in de Nederlandse taal en kennis van de Nederlandse samenleving te
      verwerven, teneinde het inburgeringsexamen te behalen.


      [ref1]: https://wetten.overheid.nl/BWBR0020674
