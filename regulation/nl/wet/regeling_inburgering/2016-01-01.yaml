  - number: '9.1'
    text: |-
      Van de verplichting om mondelinge vaardigheden in de Nederlandse taal te verwerven en het betreffende onderdeel,
      bedoeld in [artikel 3.9, eerste lid, onderdeel d, van het besluit][ref1] te behalen, is vrijgesteld de
      inburgeringsplichtige die:

      a. voor 1 november 2014 voor het laatst afgelegde onderdeel spreekvaardigheid van het basisexamen inburgering,
      bedoeld in [artikel 3.98a, derde lid, onderdeel c, van het Vreemdelingenbesluit 2000][ref2], ten minste 37 punten
      heeft behaald;

      b. na 1 november 2014 niet nogmaals het eerdergenoemde onderdeel spreekvaardigheid heeft afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3.9
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3.98a
    url: https://wetten.overheid.nl/BWBR0020657/2016-01-01#Artikel9.1
