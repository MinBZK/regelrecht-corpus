        artikel: 2.8b
  - number: 2.4c
    text: |-
      1 De minister verleent verlenging van de voor de inburgeringsplichtige geldende termijn op grond van
      [artikel 7, derde lid, onder a, van de wet][ref1], indien de inburgeringsplichtige ten minste 300 uur heeft
      deelgenomen aan een inburgeringscursus bij een instelling met het Blik op Werk keurmerk en ten minste twee maal
      heeft deelgenomen aan de niet behaalde onderdelen van het inburgeringsexamen.

      2 De verlenging, bedoeld in het eerste lid, wordt voor ten hoogste twee jaar verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
