  - number: '3.1'
    text: |-
      Het examengeld, bedoeld in [artikel 3.3, eerste lid, van het besluit][ref1], bedraagt:

      a. € 50,– voor elk van de onderdelen van het inburgeringsexamen, bedoeld in
      [artikel 3.9, eerste lid, onderdelen a tot en met c, van het besluit][ref2];

      b. € 60’ voor het onderdeel van het inburgeringsexamen, bedoeld in
      [artikel 3.9, eerste lid, onderdeel d, van het besluit][ref3];

      c. € 40 voor het onderdeel van het inburgeringsexamen, bedoeld in
      [artikel 3.9, tweede lid, onderdeel a, van het besluit][ref4];

      d. € 100 voor het onderdeel van het inburgeringsexamen, bedoeld in
      [artikel 3.9, tweede lid, onderdeel b, van het besluit][ref5].


