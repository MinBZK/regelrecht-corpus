  - number: '3.15'
    text: |-
      Als organisaties, bedoeld in [artikel 6.2, eerste lid, onderdeel h, van het besluit][ref1] worden aangewezen de
      Stichting Nuffic en de Stichting Samenwerking Beroepsonderwijs Bedrijfsleven.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel6.2
    url: https://wetten.overheid.nl/BWBR0020657/2016-01-01#Artikel3.15
