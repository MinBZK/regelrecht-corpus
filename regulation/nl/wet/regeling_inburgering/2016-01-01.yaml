  - number: 2.2a
    text: |-
      1 Van de verplichting om mondelinge en schriftelijke vaardigheden in de Nederlandse taal te verwerven en de
      onderdelen van het inburgeringsexamen, bedoeld in artikel 3.9, eerste lid, onderdelen a tot en met d, van het
      besluit te behalen, is vrijgesteld de inburgeringsplichtige die beschikt over een originele verklaring van het
      regionaal opleidingencentrum die is afgegeven op basis van de resultaten van een voor 1 januari 2007 afgelegde
      toets ter afronding van een NT2-taaltraject, indien uit de verklaring blijkt dat voor het onderdeel Nederlands als
      tweede taal ten minste de volgende niveaus van de eindtermen Referentiekader Nederlands als Tweede Taal, dan wel
      Europees Raamwerk voor Moderne Vreemde Talen, zijn behaald:

        - niveau 2, respectievelijk niveau A2, voor de onderdelen Luisteren en Spreken, en niveau 2, respectievelijk niveau
      A2 voor de onderdelen Lezen en Schrijven.

      2 Om tot vrijstelling te kunnen leiden, dient de verklaring de volgende gegevens te bevatten:

      a. de naam van het document;

      b. de naam en handtekening van de verantwoordelijke van het regionaal opleidingencentrum;

      c. de echtheidskenmerken van het regionaal opleidingencentrum;

      d. de naam en geboortedatum van de deelnemer aan het NT2-taaltraject die overeenkomen met de naam en geboortedatum
      zoals vermeld op zijn identiteitsdocument;

      e. de behaalde taalniveaus uitgesplitst naar de vier taalvaardigheden Lezen, Schrijven, Luisteren en Spreken;

      f. de datum waarop de toetsresultaten zijn behaald.
    url: https://wetten.overheid.nl/BWBR0020657/2016-01-01#Artikel2.2a
  - number: 2.2c
    text: |-
      Van de verplichting om mondelinge en schriftelijke vaardigheden in de Nederlandse taal te verwerven en de onderdelen
      van het inburgeringsexamen, bedoeld in [artikel 3.9, eerste lid, onderdelen a tot en met d, van het besluit][ref1]
      te behalen, is vrijgesteld de inburgeringsplichtige die beschikt over de volgende certificaten van het Certificaat
      Nederlands als Vreemde Taal:

      a. Certificaat Profiel Toeristische en Informele Taalvaardigheid (ERK-niveau A2);

      b. Certificaat Profiel Taalvaardigheid Praktische Beroepen (ERK-niveau A2);

      c. Certificaat Profiel Maatschappelijke Taalvaardigheid (ERK-niveau B1);

      d. Certificaat Profiel Professionele Taalvaardigheid (ERK-niveau B2);

      e. Certificaat Profiel Taalvaardigheid Hoger Onderwijs (ERK-niveau B2);

      f. Certificaat Profiel Academische Taalvaardigheid (ERK-niveau C1).


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3.9
    url: https://wetten.overheid.nl/BWBR0020657/2016-01-01#Artikel2.2c
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3.9'
  - number: 2.2d
    text: |-
      Van de verplichting om mondelinge en schriftelijke vaardigheden in de Nederlandse
      taal te verwerven en het betreffende onderdeel van het inburgeringsexamen, bedoeld in
      [artikel 3.9, eerste lid, onderdelen a, b, c of d, van het besluit][ref1] te behalen is vrijgesteld de degene die
      beschikt over een certificaat dat is afgegeven ter afronding van het examenonderdeel lezen, schrijven, luisteren
      respectievelijk spreken van het staatsexamen Nederlands als tweede taal, alsmede degene die beschikt over een
      diploma van het examen Nederlands als tweede taal.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3.9
    url: https://wetten.overheid.nl/BWBR0020657/2016-01-01#Artikel2.2d
