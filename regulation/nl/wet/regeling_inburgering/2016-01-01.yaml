      De bijzondere examenomstandigheden, bedoeld in [artikel 3.5, eerste lid, van het besluit][ref1], betreffen:

      a. examen in aangepaste locatie;

      b. verlenging examentijd;

      c. onderbroken examenafname;

      d. aangepaste inroostering;

      e. examenhulp;

      f. grootbeeld;

      g. grootschrift;

