      Het praktijkexamen oriëntatie op de Nederlandse arbeidsmarkt, bedoeld in
      [artikel 3.9a, derde lid, van het besluit][ref1], bestaat uit het ter beoordeling voorleggen van een portfolio als
      bedoeld in [bijlage 5A][ref2] en het voeren van een eindgesprek.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3.9a
