  - number: 4.7a
    text: |-
      De inburgeringsplichtige kan in afwijking van [artikel 4.7, eerste lid, van het besluit][ref1] de lening in een
      keer terugbetalen. De terugbetaling omvat het bedrag van de opgebouwde schuld vermeerderd met de over dat bedrag
      verschuldigde rente, berekend overeenkomstig [artikel 4.4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4.7
      [ref2]: https://wetten.overheid.nl/BWBR0020657#Artikel4.4
    url: https://wetten.overheid.nl/BWBR0020657/2016-01-01#Artikel4.7a
