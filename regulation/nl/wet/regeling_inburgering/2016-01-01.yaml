        artikel: 3.9a
      - id: ref2
        bwb_id: BWBR0020657
  - number: '3.6'
    text: |-
      Van de resultaten van het onderdeel spreekvaardigheid worden de antwoorden op meerkeuzevragen beoordeeld door het
      geautomatiseerde systeem, bedoeld in [artikel 3.9b, eerste lid, van het besluit][ref1] en de antwoorden op de open
      vragen door beoordelaars.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3.9b
    url: https://wetten.overheid.nl/BWBR0020657/2016-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: 3.9b
  - number: '3.8'
    text: |-
      1 De deskundigheid van de beoordelaars, bedoeld in [artikel 3.13, onderdeel c, van het besluit][ref1], blijkt uit
      een afgeronde door de minister vast te stellen Examentraining schrijfvaardigheid of spreekvaardigheid.

      2 De Examentraining wordt gegeven door een door de Minister aan te wijzen instelling.

      3 De in het tweede lid genoemde instelling reikt een certificaat uit, waaruit blijkt dat de deelnemer de training
      met goed gevolg heeft afgelegd en het aansluitende examen heeft behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3.13
    url: https://wetten.overheid.nl/BWBR0020657/2016-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3.13'
  - number: '3.9'
    text: |-
      1 De deskundigheid van de examinatoren, bedoeld in [artikel 3.13, onderdeel c, van het besluit][ref1] blijkt uit
      een afgeronde door de minister vast te stellen Examentraining Arbeidsmarktmodule.

      2 De Examentraining wordt gegeven door een door de Minister aan te wijzen instelling.

      3 De in het tweede lid genoemde instelling reikt een certificaat uit, waaruit blijkt dat de deelnemer de training
      met goed gevolg heeft afgelegd en het aansluitende examen heeft behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3.13
    url: https://wetten.overheid.nl/BWBR0020657/2016-01-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3.13'
  - number: '3.10'
    text: |-
      1 De minister stelt een examenreglement vast.

      2 Een ieder die zich overeenkomstig de daartoe gestelde regels heeft aangemeld, het verschuldigde examengeld heeft
      voldaan en zich overeenkomstig [artikel 3.4 van het besluit][ref1] heeft geïdentificeerd, wordt toegelaten tot de
      tot het inburgeringsexamen behorende onderdelen.

      3 De kwaliteit van de examinering wordt gewaarborgd door:

      a. transparantie van de taken, bevoegdheden en verantwoordelijkheden bij de examinering;

      b. het treffen van passende technische en organisatorische maatregelen om de examen- en persoonsgegevens te
      beveiligen tegen verlies of onrechtmatige verwerking;

      c. het beschrijven van de procedure van verwerking van examenresultaten en de gegevensverstrekking ten behoeve van
      opneming in het Informatiesysteem Inburgering;

      d. de naleving van het examenreglement, bedoeld in het eerste lid;

      e. het treffen van passende technische en organisatorische maatregelen om de kwaliteit van de processen rondom de
      afname en de beoordeling van examens te waarborgen.

      4 Om tot het inburgeringsexamen te worden toegelaten is de kandidaat verplicht in te stemmen met de in
      [bijlage 18][ref2] opgenomen geheimhoudingsverklaring ten aanzien van de inhoud van het examen.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3.4
      [ref2]: https://wetten.overheid.nl/BWBR0020657
    url: https://wetten.overheid.nl/BWBR0020657/2016-01-01#Artikel3.10
    references:
