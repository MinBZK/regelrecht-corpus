        bwb_id: BWBR0020657
  - number: '2.2'
    text: |-
      De diploma’s, certificaten en andere documenten, behaald in het Nederlandstalig onderwijs in de Nederlandse
      Antillen of Aruba, bedoeld in [artikel 2.3, eerste lid, onderdeel f, van het besluit][ref1], zijn opgenomen in
      [bijlage 2][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020657
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel2.2
