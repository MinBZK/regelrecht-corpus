  - number: 1.1.f
    text: |-
      inburgeringscursus: een door een cursusinstelling aangeboden cursus welke een inburgeringsplichtige in staat
      stelt mondelinge en schriftelijke vaardigheden in de Nederlandse taal en kennis van de Nederlandse samenleving te
      verwerven, teneinde het inburgeringsexamen te behalen.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel1.1
  - number: '1.2'
    text: |-
      Het keurmerk, bedoeld in [artikel 1, eerste lid, onderdeel j, van de wet][ref1] is het Keurmerk Inburgeren, dat
      wordt toegekend en beheerd door de Stichting Blik op Werk.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel1
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '1'
  - number: 1.3.1
    text: |-
      Als geestelijke bedienaar wordt in ieder geval aangemerkt de vreemdeling die houder is van een verblijfsvergunning
      voor bepaalde tijd als bedoeld in [artikel 14 van de Vreemdelingenwet 2000][ref1], die is verleend onder een
      beperking verband houdend met het verrichten van arbeid als geestelijke bedienaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 1.3.2
    text: |-
      Onder kerkgenootschap of een ander genootschap op geestelijke of levensbeschouwelijke grondslag als bedoeld
      in [artikel 1, eerste lid, onderdeel g, van de wet][ref1] wordt tevens verstaan een onderdeel daarvan of een
      rechtspersoon waarin twee of meer van deze genootschappen samenwerken.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel1
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '1'
  - number: 1.3.3
    text: |-
      Van werkzaamheden van overwegend godsdienstige, geestelijke of levensbeschouwelijke aard als bedoeld in
      [artikel 1, eerste lid, onderdeel g, van de wet][ref1] is in ieder geval sprake in geval van werkzaamheden als
      voorganger, godsdienstleraar, zendeling, leraar levensbeschouwelijk onderwijs, vertrouwenspersoon of pastoraal
      werker binnen een godsdienstige of levensbeschouwelijke gemeenschap, dan wel op het terrein van het uitdragen en
      verklaren van een bepaalde geloofsleer of levensbeschouwelijke opvattingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel1
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '1'
  - number: 1.3.4
    text: |-
      Als geestelijke bedienaar wordt niet aangemerkt degene die op louter incidentele basis werkzaamheden als bedoeld in
      het derde lid, verricht.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel1.3
  - number: '2.1'
    text: |-
      De beperkingen, bedoeld in [artikel 2.1, eerste lid, van het besluit][ref1], zijn opgenomen in [bijlage 1][ref2]
      bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020657
