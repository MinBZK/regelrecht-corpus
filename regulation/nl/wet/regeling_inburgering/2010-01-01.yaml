  - number: 2.2a.1
    text: |-
      Van de verplichting om mondelinge en schriftelijke vaardigheden in de Nederlandse taal te verwerven en het
      betreffende deel van het inburgeringsexamen te behalen, is vrijgesteld de inburgeringsplichtige die beschikt over
      een originele verklaring van het regionaal opleidingencentrum die is afgegeven op basis van de resultaten van een
      voor 1 januari 2007 afgelegde toets ter afronding van een NT2-taaltraject, indien uit de verklaring blijkt dat
      voor het onderdeel Nederlands als tweede taal ten minste de volgende niveaus van de eindtermen Referentiekader
      Nederlands als Tweede Taal, dan wel Europees Raamwerk voor Moderne Vreemde Talen, zijn behaald:
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel2.2a
  - number: 2.2a.1.a
    text: |-
      niveau 2, respectievelijk niveau A2, voor de onderdelen Luisteren en Spreken, en niveau 2, respectievelijk
      niveau A2 voor de onderdelen Lezen en Schrijven indien de inburgeringsplichtige geen oudkomer is in de zin van
      [artikel 1, eerste lid, onderdeel c, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel1
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel2.2a
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '1'
  - number: 2.2a.1.b
    text: |-
      niveau 2, respectievelijk niveau A2, voor de onderdelen Luisteren en Spreken, en niveau 1, respectievelijk
      niveau A1, voor de onderdelen Lezen en Schrijven indien de inburgeringsplichtige oudkomer is in de zin van
      [artikel 1, eerste lid, onderdeel c, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel1
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel2.2a
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '1'
  - number: 2.2a.2
    text: 'Om tot vrijstelling te kunnen leiden, dient de verklaring de volgende gegevens te bevatten:'
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel2.2a
  - number: 2.2a.2.a
    text: de naam van het document;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel2.2a
  - number: 2.2a.2.b
    text: de naam en handtekening van de verantwoordelijke van het regionaal opleidingencentrum;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel2.2a
  - number: 2.2a.2.c
    text: de echtheidskenmerken van het regionaal opleidingencentrum;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel2.2a
  - number: 2.2a.2.d
    text: |-
      de naam en geboortedatum van de deelnemer aan het NT2-taaltraject die overeenkomen met de naam en geboortedatum
      zoals vermeld op zijn identiteitsdocument;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel2.2a
  - number: 2.2a.2.e
    text: de behaalde taalniveaus uitgesplitst naar de vier taalvaardigheden Lezen, Schrijven, Luisteren en Spreken;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel2.2a
  - number: 2.2a.2.f
    text: de datum waarop de toetsresultaten zijn behaald.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel2.2a
  - number: 2.2b
    text: |-
      Van de verplichting om mondelinge vaardigheden in de Nederlandse taal te verwerven en het betreffende deel van het
      inburgeringsexamen te behalen, is vrijgesteld de inburgeringsplichtige die beschikt over de beschikking van het
      basisexamen inburgering in het buitenland, indien uit die beschikking blijkt dat voor het onderdeel luister- en
      spreekvaardigheid ten minste 37 punten is behaald.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel2.2b
  - number: 2.2c
    text: |-
      Van de verplichting om mondelinge en schriftelijke vaardigheden in de Nederlandse taal te verwerven en het
      betreffende deel van het inburgeringsexamen te behalen, is vrijgesteld de inburgeringsplichtige die beschikt over
      de volgende certificaten van het Certificaat Nederlands als Vreemde Taal:
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel2.2c
  - number: 2.2c.a
    text: Certificaat Profiel Maatschappelijke Taalvaardigheid (ERK-niveau B1);
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel2.2c
  - number: 2.2c.b
    text: Certificaat Profiel Professionele Taalvaardigheid (ERK-niveau B2);
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel2.2c
  - number: 2.2c.c
    text: Certificaat Profiel Taalvaardigheid Hoger Onderwijs (ERK-niveau B2);
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel2.2c
  - number: 2.2c.d
    text: Certificaat Profiel Academische Taalvaardigheid (ERK-niveau C1).
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel2.2c
  - number: 2.3.1
    text: |-
