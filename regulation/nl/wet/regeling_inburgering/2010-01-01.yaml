    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020674
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020657
  - number: 3.5.1
    text: |-
      Het portfolio, bedoeld in [artikel 3.7, tweede lid, van het besluit][ref1], wordt samengesteld overeenkomstig de
      modellen, die zijn opgenomen in [bijlage 8][ref2] bij deze regeling en goedgekeurd overeenkomstig de handleiding
      die is opgenomen in [bijlage 11][ref3] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020657
      [ref3]: https://wetten.overheid.nl/BWBR0020657
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020657
      - id: ref3
        bwb_id: BWBR0020657
  - number: 3.5.2
    text: |-
      Het assessment, bedoeld in [artikel 3.7, tweede lid, van het besluit][ref1], wordt afgenomen overeenkomstig de
      handleiding, die is opgenomen in [bijlage 9][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020657
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020657
  - number: 3.6.1
    text: |-
      De kandidaat heeft het praktijkdeel van het inburgeringsexamen, bedoeld in [artikel 3.7 van het besluit][ref1],
      behaald, indien hij:


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.6.1.a
    text: 30 portfolio-opdrachten,
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.6
  - number: 3.6.1.b
    text: 6 assessmentopdrachten, of
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.6
  - number: 3.6.1.c
    text: een combinatie van 15 portfolio-opdrachten en 3 assessmentopdrachten
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.6
  - number: 3.6.2
    text: |-
      De oudkomer die het inburgeringsexamen heeft behaald op de niveaus, bedoeld in de
      [artikelen 2.9, tweede lid][ref1], en [2.10 van het besluit][ref2], heeft het inburgeringsexamen op het niveau,
      bedoeld in [artikel 2.9, eerste lid, van het besluit][ref3], behaald, indien hij:


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0020674#Artikel2
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020674
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0020674
        artikel: '2'
  - number: 3.6.2.a
    text: 15 portfolio-opdrachten of 3 assessmentopdrachten, en
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.6
  - number: 3.6.2.b
    text: |-
      het elektronisch praktijkexamen, bedoeld in [artikel 3.9, eerste lid, onderdeel a, van het besluit][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.6.2.c
    text: met goed gevolg heeft afgelegd.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.6
  - number: 3.6.3
    text: |-
      De portfolio-opdrachten, bedoeld in het eerste lid, onderdeel a, en het tweede lid, onderdeel a, worden beoordeeld
      in een panelgesprek, gehouden door twee examinatoren.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.6
  - number: 3.6.4
    text: |-
      De assessmentopdrachten, bedoeld in het eerste lid, onderdeel b, en het tweede lid, onderdeel a, en de combinatie
      van assessmentopdrachten en portfolio-opdrachten, bedoeld in het eerste lid, onderdeel c, worden afgenomen met
      een assessment.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.6
  - number: 3.6.5
    text: |-
      Het panelgesprek, bedoeld in het derde lid, wordt gevoerd overeenkomstig de handleiding die is opgenomen in
      [bijlage 12][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020657
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0020657
  - number: 3.7.1
    text: |-
      De kandidaat die geestelijke bedienaar is, heeft het aanvullend praktijkdeel, bedoeld in
      [artikel 3.8, eerste lid, van het besluit][ref1], behaald, indien hij 6 portfolio-opdrachten met goed gevolg heeft
      afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.7.2
    text: |-
      Indien de kandidaat geestelijke bedienaar is, bestaat het bijzonder praktijkdeel, bedoeld in
      [artikel 3.8, tweede lid, van het besluit][ref1] uit 30 portfolio-opdrachten en 3 assessmentopdrachten.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.7.3
    text: |-
      Voor kandidaten die geestelijke bedienaar zijn, gelden eindtermen van het aanvullend en bijzonder praktijkexamen
      als bedoeld in [artikel 3.8, eerste en tweede lid, van het besluit][ref1], zoals opgenomen in [bijlage 10][ref2]
      bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020657
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020657
  - number: 3.7.4
    text: |-
      Het aanvullend praktijkdeel, bedoeld in [artikel 3.8, eerste lid, van het besluit][ref1], wordt:


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.7.4.a
    text: |-
      samengesteld overeenkomstig het model dat is opgenomen in [bijlage 13][ref1] bij deze regeling, en


      [ref1]: https://wetten.overheid.nl/BWBR0020657
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0020657
  - number: 3.7.4.b
    text: |-
      afgenomen overeenkomstig de handleiding die is opgenomen in [bijlage 14][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020657
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0020657
  - number: 3.7.5
    text: |-
      Het bijzonder praktijkdeel, bedoeld in [artikel 3.8, tweede lid, van het besluit][ref1], wordt samengesteld
      overeenkomstig het model dat is opgenomen in [bijlage 15][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020657
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020657
  - number: 3.7.6
    text: |-
      De assessmentopdrachten, bedoeld in het tweede lid, worden afgenomen overeenkomstig de handleiding die is opgenomen
      in [bijlage 16][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020657
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0020657
  - number: 3.8.1
    text: |-
      De training, bedoeld in [artikel 3.11, vierde lid, van het besluit][ref1], is de Examentraining voor examinatoren
      inburgering.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.8.2
    text: 'De examinator kan deelnemen aan de training indien hij:'
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.8
  - number: 3.8.2.a
    text: over het certificaat bekwaam docent Nederlands als tweede taal beschikt;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.8
  - number: 3.8.2.b
    text: |-
      een opleiding van het hoger beroepsonderwijs of het wetenschappelijk onderwijs heeft afgerond en ten minste twee
      jaar leservaring heeft als docent Nederlands als tweede taal, of
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.8
  - number: 3.8.2.c
    text: 'een van de volgende opleidingen heeft afgerond:'
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.8
  - number: 3.8.2.c.1°
    text: urgentieopleiding basiseducatie;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.8
  - number: 3.8.2.c.2°
    text: post-hoger beroepsonderwijs basiseducatie;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.8
  - number: 3.8.2.c.3°
    text: post-hoger beroepsonderwijs Nederlands als tweede taal;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.8
  - number: 3.8.2.c.4°
    text: toegepaste taalwetenschap met specialisatie Nederlands als tweede taal;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.8
  - number: 3.8.2.c.5°
    text: algemene taalwetenschap met specialisatie Nederlands als tweede taal;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.8
  - number: 3.8.2.c.6°
    text: opleiding Nederlands als tweede taal – expert, of
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.8
  - number: 3.8.2.c.7°
    text: duale masteropleiding Nederlands als tweede taal.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.8
  - number: 3.8.3
    text: |-
      De trainer van de Examentraining voor examinatoren inburgering, bedoeld in het eerste lid, dient de Examentraining
      voor examinatoren inburgering, bedoeld in het eerste lid, en de Trainersopleiding voor de Examentraining voor
      examinatoren inburgering met goed gevolg te hebben afgerond.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.8
  - number: 3.9.1
    text: |-
      De voorzitter, de plaatsvervangend voorzitter en de overige leden en plaatsvervangende leden van de commissie van
      beroep, bedoeld in [artikel 3.12, derde lid, van het besluit][ref1], worden door het bevoegd gezag benoemd voor een
      termijn van ten minste drie en ten hoogste vijf jaar. Zij zijn opnieuw benoembaar.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.9.2
    text: |-
      Op eigen verzoek wordt aan de leden en plaatsvervangende leden van de commissie van beroep voor de examens ontslag
      verleend door het bevoegd gezag. Bij het bereiken van de leeftijd van zeventig jaar wordt hun ontslag verleend
      met ingang van de eerstvolgende maand. Zij worden ontslagen indien zij uit hoofde van ziekte of gebreken niet in
      staat zijn hun functie te vervullen alsmede indien zij bij onherroepelijk geworden rechterlijke uitspraak wegens
      misdrijf zijn veroordeeld. Alvorens het ontslag op grond van het in de derde volzin bepaalde wordt verleend, wordt
      de betrokkene van het voornemen tot ontslag in kennis gesteld en wordt hem de gelegenheid geboden zich ter zake te
      doen horen.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.9
  - number: 3.10.1
    text: |-
      Bij de afname en de beoordeling van de tot het praktijkdeel van het inburgeringsexamen behorende examens
      en het vaststellen van de uitslag, handelen de exameninstellingen overeenkomstig de portfolio’s, bedoeld in
      [artikel 3.5, eerste lid][ref1], en de handleiding assessments, bedoeld in [artikel 3.5, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020657#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0020657
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.10.2
    text: |-
      De exameninstellingen laten een ieder die zich daarvoor overeenkomstig de daartoe gestelde regels heeft aangemeld,
      het verschuldigde examengeld heeft voldaan en zich overeenkomstig [artikel 3.4 van het besluit][ref1], heeft
      geïdentificeerd, toe tot de tot het inburgeringsexamen behorende examens.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.10.3
    text: 'De exameninstellingen waarborgen de kwaliteit van de examinering door:'
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.10
  - number: 3.10.3.a
    text: |-
      transparantie van de organisatiestructuur van de instelling en van de taken, bevoegdheden en verantwoordelijkheden
      bij de examinering;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.10
  - number: 3.10.3.b
    text: |-
      het treffen van passende technische en organisatorische maatregelen om de examen- en persoonsgegevens te beveiligen
      tegen verlies of onrechtmatige verwerking;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.10
  - number: 3.10.3.c
    text: |-
      het beschrijven van de procedure van verwerking van examenresultaten en de gegevensverstrekking ten behoeve van
      opneming in het Informatiesysteem Inburgering;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.10
  - number: 3.10.3.d
    text: |-
      de naleving van het examenreglement, bedoeld in [artikel 3.14, eerste lid, onderdeel c, van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.11.1
    text: De minister wijst de exameninstellingen aan en kan deze aanwijzing schorsen of intrekken.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.11
  - number: 3.11.2
    text: |-
      Een afschrift van de beschikking op de aanvraag tot aanwijzing als exameninstelling wordt gezonden aan het
      Kwaliteitscentrum examinering inburgering.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.11
  - number: 3.12.1
    text: |-
      Bij het verzoek om een onderzoek als bedoeld in [artikel 3.17, tweede lid, onderdeel a, van het besluit][ref1] legt
      de instelling over:


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.12.1.a
    text: een bewijs van inschrijving in het handelsregister, dat niet ouder is dan zes maanden;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.12
  - number: 3.12.1.b
    text: |-
      een vastgesteld examenreglement als bedoeld in [artikel 3.14, eerste lid, onderdeel c, van het besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.12.1.c
    text: |-
      bewijs dat ten minste twee aan de instelling verbonden examinatoren met goed gevolg de Examentraining voor
      examinatoren inburgering als bedoeld in [artikel 3.8][ref1] hebben afgerond;


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.12.1.d
    text: |-
      gegevens en bescheiden waaruit blijkt dat de instelling voldoet aan de eisen, bedoeld in
      [artikel 3.10, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 3.12.2
    text: |-
      Het rapport, bedoeld in [artikel 3.15, derde lid, van het besluit][ref1], van het Kwaliteitscentrum examinering
      inburgering, bevat een positief advies, indien de instelling voldoet aan de bij en krachtens de wet gestelde eisen.
      In de overige gevallen bevat het een negatief advies.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.12.3
    text: |-
      Het rapport wordt aan de instelling toegezonden. Indien het rapport een negatief advies bevat, kan de instelling
      een zienswijze bij het rapport voegen.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.12
  - number: 3.13.1
    text: |-
      In het examenreglement, bedoeld in [artikel 3.14, eerste lid, onderdeel c, van het besluit][ref1], wordt in ieder
      geval vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.13.1.a
    text: de procedure van aanmelding en identificatie van de inburgeringsplichtige;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.13
  - number: 3.13.1.b
    text: de financiële aspecten van het praktijkdeel van het inburgeringsexamen;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.13
  - number: 3.13.1.c
    text: de wijze van bekendmaking van de uitslagen van het praktijkdeel van het inburgeringsexamen;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.13
  - number: 3.13.1.d
    text: |-
      dat de instelling beschikt over een examencommissie, bedoeld in [artikel 3.11 van het besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.13.1.e
    text: |-
      dat de instelling beschikt over een commissie van beroep, bedoeld in [artikel 3.12 van het besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.13.1.f
    text: de procedure en sancties bij fraude, en
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.13
  - number: 3.13.1.g
    text: de procedure voor de afhandeling van klachten.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.13
  - number: 3.13.2
    text: |-
      In het examenreglement verklaart de exameninstelling dat de tot het praktijkdeel van het inburgeringsexamen
      behorende examens en de beoordeling van examens worden afgenomen overeenkomstig de portfolio’s, bedoeld in
      [artikel 3.5, eerste lid][ref1], en de handleiding assessments, bedoeld in [artikel 3.5, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020657#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0020657
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '3.14'
    text: |-
      Ter zake van het onderzoek, bedoeld in [artikel 3.17, tweede lid, onderdeel a, van het besluit][ref1], is de
      instelling € 210 verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: '3.15'
    text: Als Kwaliteitscentrum examinering inburgering wordt aangewezen het KwaliteitsCentrum Examinering te Amersfoort.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.15
  - number: 3.15a.1
    text: |-
      In aanvulling op [artikel 3.18, tweede lid, van het besluit][ref1] beschrijft het jaarverslag ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.15a
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.15a.1.a
    text: |-
      de wijze waarop de beoordeling van de kwaliteit van de taakuitoefening, bedoeld in
      [artikel 3.18, eerste lid, van het besluit][ref1] heeft plaatsgevonden, alsmede de bevindingen welke voortvloeien
      uit die beoordeling;


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.15a
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.15a.1.b
    text: |-
      de wijze waarop de exameninstellingen zijn betrokken bij de vaststelling van de wijze van uitvoering van het op hen
      uit te oefenen toezicht;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.15a
  - number: 3.15a.1.c
    text: |-
      de wijze waarop de deskundigheid van de personen die zijn belast met het uitoefenen van taken voor het
      Kwaliteitscentrum examinering inburgering is geborgd, en;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.15a
  - number: 3.15a.1.d
    text: |-
      de aantallen op basis van de klachtenregeling, bedoeld in [artikel 3.24 van het besluit][ref1], ingediende
      klachten, alsmede de aard van die klachten.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.15a
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.15a.2
    text: |-
      In aanvulling op [artikel 3.18, tweede lid, van het besluit][ref1] bevat het jaarverslag ten minste een opsomming
      van:


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.15a
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.15a.2.a
    text: het aantal onderzochte exameninstellingen, alsmede het aantal bestede uren per exameninstelling;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.15a
  - number: 3.15a.2.b
    text: per exameninstelling, het aantal onderzochte examenlocaties, alsmede het aantal bestede uren per examenlocatie, en;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.15a
  - number: 3.15a.2.c
    text: per toezichtsproces, het gemiddeld aantal bestede uren.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.15a
  - number: 3.15b.1
    text: |-
      De jaarrekening, bedoeld in [artikel 3.19, tweede lid, van het besluit][ref1] bevat ten minste een verantwoording
      van de geïnde vergoedingen, bedoeld in [artikel 3.21, derde lid, van het besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.15b
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.15b.2
    text: |-
      De aandachtspunten voor de accountantscontrole, bedoeld in [artikel 3.19, derde lid, van het besluit][ref1]
      betreffen ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.15b
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.15b.2.a
    text: het aantal bestede uren per exameninstelling en per examenlocatie, en;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.15b
  - number: 3.15b.2.b
    text: het aantal bestede uren per toezichtsproces.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.15b
  - number: 3.16.1
    text: |-
      Het Kwaliteitscentrum examinering inburgering wordt jaarlijks subsidie verleend voor de taken, bedoeld in
      [artikel 3.17, tweede lid, van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.16.2
    text: 'De subsidie wordt verleend onder de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.16
  - number: 3.16.2.a
    text: |-
      Het Kwaliteitscentrum examinering inburgering legt in februari 2008 en in juni 2008 een voortgangsrapportage
      over, die in ieder geval gegevens bevat over het aantal uitgevoerde onderzoeken als bedoeld in
      [artikel 3.17, tweede lid, onderdeel a, van het besluit][ref1] en de tijdsbesteding door het Kwaliteitscentrum
      examinering inburgering per onderzoek;


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.16.2.b
    text: |-
      Het Kwaliteitscentrum examinering inburgering brengt een deugdelijke scheiding aan in zijn administratie en zijn
      financiële beheer voor de activiteiten, bedoeld in [artikel 3.17, tweede lid, onderdeel a, van het besluit][ref1],
      [artikel 3.17, tweede lid, onderdeel b, van het besluit][ref2], en de overige activiteiten van het
      Kwaliteitscentrum examinering inburgering;


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.16.2.c
    text: Het Kwaliteitscentrum examinering inburgering voert op regelmatige basis overleg met de minister;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.16
  - number: 3.16.2.d
    text: |-
      De minister heeft recht op het gebruik van de door het Kwaliteitscentrum examinering inburgering ontwikkelde
      instrumenten en producten.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.16
  - number: 3.16.3
    text: |-
      Het Kwaliteitscentrum examinering inburgering dient een aanvraag om verlening van de subsidie in tezamen met de
      begroting, bedoeld in [artikel 3.19, eerste lid, van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.16.4
    text: |-
      Het Kwaliteitscentrum examinering inburgering dient een aanvraag tot vaststelling van de subsidie in tezamen met de
      jaarrekening, bedoeld in [artikel 3.19, tweede lid, van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.16.5
    text: |-
      De subsidie wordt verleend per kalenderjaar. [Afdeling 4.2.8 van de Algemene wet bestuursrecht][ref1] is van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.2.8
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.2.8
  - number: 3.16.6
    text: |-
      Het Kwaliteitscentrum examinering inburgering vormt een egalisatiereserve als bedoeld in
      [artikel 4:72 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '3.17'
    text: |-
      Ter zake van het onderzoek, bedoeld in [artikel 3.17, tweede lid, onderdeel b, van het besluit][ref1] is de
      exameninstelling voor het jaar 2008 € 500 per examenlocatie van de instelling verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: '3.18'
    text: |-
      Het tarief, bedoeld in [artikel 3.23. tweede lid, van het besluit][ref1], voor een afschrift van een verklaring als
      bedoeld in [artikel 3.22, vijfde lid, van het besluit][ref2] bedraagt € 3,50.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.19.1
    text: |-
      Het verslag, bedoeld in [artikel 3.26 van het besluit][ref1], bevat ten minste gegevens ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.19.1.a
    text: het aantal deelnemers in totaal;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.19
  - number: 3.19.1.b
    text: |-
      het aantal deelnemers per assessment, portfolio dan wel een combinatie daarvan als bedoeld in
      [artikel 3.7, tweede lid, van het besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.19.1.c
    text: |-
      het aantal deelnemers, per assessment, portfolio dan wel een combinatie daarvan, als bedoeld in
      [artikel 3.7, tweede lid, van het besluit][ref1], dat is gezakt dan wel is geslaagd;


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.19.1.d
    text: |-
      het aantal afgedane en in behandeling zijnde beroepen, bedoeld in [artikel 3.12 van het besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.19.1.e
    text: |-
      het aantal afgedane en in behandeling zijnde klachten, bedoeld in [artikel 3.13, eerste lid, onderdeel g][ref1],
      en;


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.19.1.f
    text: |-
      het aantal en de aard van geconstateerde onregelmatigheden terzake van de identificatie, bedoeld in
      [artikel 3.4 van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '3'
  - number: 3.19.2
    text: Het verslag wordt op aanvraag aan eenieder ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel3.19
  - number: '4.1'
    text: Het bedrag van de lening bedraagt ten hoogste € 5000.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.1
  - number: 4.2.1
    text: |-
      Ten behoeve van de betaling van de lening verstrekt de inburgeringsplichtige originele facturen aan de minister
      van:
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.2
  - number: 4.2.1.a
    text: de door hem te volgen of gevolgde inburgeringscursus en het door hem af te leggen of afgelegde inburgeringsexamen;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.2
  - number: 4.2.1.b
    text: de door hem te volgen of gevolgde cursus die opleidt tot het staatsexamen Nederlands als tweede taal, of
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.2
  - number: 4.2.1.c
    text: |-
      de door een inburgeringsplichtige oudkomer te volgen of gevolgde cursus die opleidt tot, alsmede het
      afleggen van het inburgeringsexamen op de niveaus, bedoeld in de [artikelen 2.9, eerste lid][ref1], en
      [2.10 van het besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel2
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020674
        artikel: '2'
  - number: 4.2.2
    text: 'De factuur vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.2
  - number: 4.2.2.a
    text: het burgerservicenummer van de kandidaat;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.2
  - number: 4.2.2.b
    text: de naam- en adresgegevens van de kandidaat;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.2
  - number: 4.2.2.c
    text: de naam- en adresgegevens van de instelling;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.2
  - number: 4.2.2.d
    text: |-
      de code WI-CU als het een inburgeringscursus betreft, de code NT2-CU als het een cursus betreft die opleidt tot het
      staatsexamen Nederlands als tweede taal dan wel de code WI-EX als het het inburgeringsexamen betreft;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.2
  - number: 4.2.2.e
    text: |-
      de code WI-OA indien de aanmelding van de kandidaat voor het inburgeringsexamen via het Online Aanmeldsysteem
      Examens is verlopen;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.2
  - number: 4.2.2.f
    text: de handtekening van de kandidaat;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.2
  - number: 4.2.2.g
    text: de datum, en
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.2
  - number: 4.2.2.h
    text: de specificatie van het factuurbedrag.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.2
  - number: 4.2.3
    text: |-
      De betaling van de factuur, bedoeld in het eerste lid, geschiedt binnen vier weken na ontvangst door de minister
      van die factuur.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.2
  - number: 4.2.4
    text: |-
      De eerste betaling vindt plaats binnen een jaar na de beschikking, bedoeld in
      [artikel 4.4, eerste lid, van het besluit][ref1], waarbij het recht op de lening is vastgesteld. Indien binnen deze
      periode geen betaling heeft plaatsgevonden, vervalt de beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
  - number: '4.3'
    text: |-
      Het rentepercentage, genoemd in [artikel 4.5, eerste lid, van het besluit][ref1], bedraagt voor het jaar 2010:
      3,54 procent.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
  - number: 4.4.1
    text: |-
      De rente over de door de inburgeringsplichtige opgenomen lening wordt maandelijks berekend op basis van
      samengestelde interest.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.4
  - number: 4.4.2
    text: |-
      Voor de berekening van de rente op de voet van het eerste lid wordt een maand gesteld op 30 dagen en een jaar
      gesteld op 360 dagen.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.4
  - number: '4.5'
    text: |-
      Gedurende de aanloopfase, bedoeld in [artikel 17, eerste lid, van de wet][ref1], en de terugbetalingsperiode,
      bedoeld in [artikel 4.6, eerste lid, van het besluit][ref2], wordt hetzelfde rentepercentage gehanteerd,
      vastgesteld overeenkomstig [artikel 4.5, eerste lid, van het besluit][ref3]. Het bij aanvang van de aanloopfase
      geldende rentepercentage wordt gehanteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0020674#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0020674
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0020674
        artikel: '4'
  - number: 4.6.1
    text: |-
      De hoogte van de maandelijkse termijn wordt berekend op basis van het bedrag aan opgebouwde schuld vermeerderd met
      de over dat bedrag verschuldigde rente, berekend overeenkomstig [artikel 4.4][ref1] en gedeeld door het aantal te
      betalen termijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.6.2
    text: De hoogte van de maandelijkse termijn bedraagt ten minste € 15.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.6
  - number: 4.7.1
    text: |-
      In afwijking van [artikel 4.7, eerste lid, van het besluit][ref1] vervallen de rente en aflossing van de lening
      van een debiteur, die niet binnenlands belastingplichtig is in de zin van de [Wet inkomstenbelasting 2001][ref2],
      gedurende de aflosfase in jaarlijkse termijnen. [Artikel 4.4][ref3] is in dat geval van overeenkomstige toepassing.
      Indien de debiteur zich voor het einde van een jaartermijn metterwoon in Nederland vestigt, wordt hij tot het einde
      van die jaartermijn behandeld als een debiteur die niet binnenlands belastingplichtig is. Op aanvraag van de in de
      eerste volzin bedoelde debiteur kan de minister besluiten dat de rente en aflossing van de lening niet vervallen in
      jaarlijkse termijnen maar in maandelijkse termijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353
      [ref3]: https://wetten.overheid.nl/BWBR0020657#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011353
      - id: ref3
        bwb_id: BWBR0020657
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.7.2
    text: |-
      De hoogte van de jaarlijkse dan wel de maandelijkse termijn, bedoeld in het eerste lid, laatste volzin, wordt
      berekend overeenkomstig [artikel 4.6][ref1], tenzij de debiteur, bedoeld in het eerste lid, bij de minister een
      aanvraag indient tot vaststelling van zijn draagkracht voor de resterende aflosfase. In dat geval levert hij aan de
      minister de door de minister gevraagde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.7.3
    text: 'De betaling van de maandelijkse termijn, bedoeld in het eerste lid, laatste volzin, geschiedt door middel van:'
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.7
  - number: 4.7.3.a
    text: |-
      een daartoe door de debiteur verleende doorlopende machtiging om het verschuldigde bedrag maandelijks te doen
      afschrijven van een door de debiteur aangewezen bank- of girorekening in Nederland of
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.7
  - number: 4.7.3.b
    text: een door de minister aan de debiteur gezonden acceptgirokaart.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.7
  - number: 4.7a
    text: |-
      De inburgeringsplichtige kan in afwijking van [artikel 4.7, eerste lid, van het besluit][ref1] de lening in een
      keer terugbetalen. De terugbetaling omvat het bedrag van de opgebouwde schuld vermeerderd met de over dat bedrag
      verschuldigde rente, berekend overeenkomstig [artikel 4.4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020657#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.7a
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020657
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.8.1
    text: |-
      De terugbetalingsperiode van de debiteur die algemene bijstand ontvangt en een aanvraag indient om zijn draagkracht
      vast te stellen, beslaat ten hoogste drie jaren vanaf de maand volgend op de maand waarin hij de minister kenbaar
      heeft gemaakt dat hij algemene bijstand ontvangt. De volledige terugbetalingsperiode beslaat ten hoogste 7 jaren.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.8
  - number: 4.8.2
    text: |-
      De maandelijkse termijn van de debiteur die algemene bijstand ontvangt en een draagkrachtmeting aanvraagt, wordt
      berekend overeenkomstig [artikel 4.6][ref1]. De [artikelen 4.9 tot en met 4.11 van het besluit][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0020674
        artikel: '4'
  - number: 4.8.3
    text: |-
      De duur van de terugbetalingsperiode, bedoeld in het eerste lid, en de hoogte van de maandelijkse termijn, bedoeld
      in het tweede lid, worden niet gewijzigd ingeval de algemene bijstand wordt beëindigd.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.8
  - number: 4.9.1
    text: |-
      De draagkracht die wordt vastgesteld overeenkomstig dit artikel, gaat in op de eerste dag van de maand volgend op
      de maand waarin de aanvraag, bedoeld in [artikel 4.9 van het besluit][ref1], is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
  - number: 4.9.2
    text: |-
      Maatstaf voor de vaststelling van de draagkracht van de debiteur uit inkomen is het totaal van het toetsingsinkomen
      van de debiteur en zijn partner in het tweede jaar voorafgaande aan het jaar waarvoor de draagkracht wordt
      vastgesteld. Het aldus bepaalde inkomen is het draagkrachtinkomen.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.9
  - number: 4.9.3
    text: 'Op het draagkrachtinkomen wordt in mindering gebracht de draagkrachtvrije voet. Deze voet is gelijk aan:'
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.9
  - number: 4.9.3.a
    text: 120% van het belastbaar minimumloon voor een debiteur met partner, of
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.9
  - number: 4.9.3.b
    text: |-
      120% van het belastbaar minimumloon voor een debiteur op wie de alleenstaande ouderkorting, bedoeld in
      [artikel 8.9 van de Wet inkomstenbelasting 2001][ref1], van toepassing is, of


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
  - number: 4.9.3.c
    text: 84% van het belastbaar minimumloon voor overige debiteuren zonder partner.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.9
  - number: 4.9.4
    text: De draagkracht van de debiteur uit inkomen is 8% van het inkomen boven de draagkrachtvrije voet.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.9
  - number: 4.9.5
    text: |-
      Voor de toepassing van dit artikel wordt indien het toetsingsinkomen of het belastbaar loon in het tweede jaar
      voorafgaande aan het jaar waarvoor de draagkracht wordt vastgesteld, nog niet bekend is, door de minister daarvoor
      in de plaats gesteld een bedrag dat het vast te stellen toetsingsinkomen of het belastbaar loon benadert.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.9
  - number: 4.10.1
    text: |-
      Op aanvraag van de debiteur wordt bij de toepassing van [artikel 4.9][ref1] uitgegaan van het inkomen van een ander
      jaar dan het inkomen over het tweede jaar voorafgaande aan het jaar waarvoor de draagkracht wordt vastgesteld,
      indien sprake is van terugval in inkomen:


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.10.1.a
    text: |-
      over het jaar voorafgaande aan het jaar waarvoor de draagkracht wordt vastgesteld, in welk geval wordt uitgegaan
      van het jaar voorafgaande aan het jaar waarvoor de draagkracht wordt vastgesteld, of
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.10
  - number: 4.10.1.b
    text: |-
      over het jaar waarvoor de draagkracht wordt vastgesteld, in welk geval wordt uitgegaan van het jaar waarvoor de
      draagkracht wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.10
  - number: 4.10.2
    text: |-
      Voor de toepassing van het eerste lid wordt onder een terugval in inkomen verstaan een vermindering van het
      toetsingsinkomen van de debiteur van ten minste 15% ten opzichte van het tweede jaar voorafgaande aan het jaar
      waarvoor de draagkracht wordt vastgesteld, met dien verstande dat de vermindering niet kan worden gerekend tot
      inkomensschommelingen die in het algemeen normaal kunnen worden geacht bij de gekozen wijze van inkomensverwerving.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.10
  - number: 4.10.3
    text: |-
      Voor de toepassing van het eerste lid wordt zolang het belastbaar inkomen over het tweede jaar voorafgaande aan het
      jaar waarvoor de draagkracht wordt vastgesteld, het jaar voorafgaande aan het jaar waarvoor de draagkracht wordt
      vastgesteld, of het jaar waarvoor de draagkracht wordt vastgesteld nog niet definitief bekend is, daarvoor in de
      plaats gesteld het bedrag dat naar het oordeel van de minister het uiteindelijke belastbaar loon benadert.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.10
  - number: '4.11'
    text: |-
      Indien de partner van de debiteur ook een debiteur is die een beschikking tot terugbetaling als bedoeld in
      [artikel 4.8, eerste lid, van het besluit][ref1] heeft ontvangen, wordt:


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
  - number: 4.11.a
    text: |-
      [artikel 4.9, tweede en vierde lid][ref1], slechts eenmaal toegepast op het totaal van het toetsingsinkomen, en


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.11.b
    text: |-
      bij toepassing van [artikel 4.10 van het besluit][ref1] de te betalen maandelijkse termijn per debiteur vastgesteld
      op basis van de verhouding tussen de hoogte van het toetsingsinkomen van beide debiteuren afzonderlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
  - number: '4.12'
    text: |-
      De debiteur is in verzuim indien binnen twee weken na de vervaldatum van een vordering het bedrag van de verplichte
      terugbetaling niet is ontvangen.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.12
  - number: '4.16'
    text: |-
      Bij uitvaardiging van het dwangbevel, bedoeld in artikel 17, tweede lid, van de wet kunnen de achterstallige
      termijnen worden overgedragen aan een gerechtsdeurwaarder mits:
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.16
  - number: 4.16.a
    text: het achterstallige deel minimaal € 180 bedraagt, of
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.16
  - number: 4.16.b
    text: het deel dat zes maanden of langer achterstallig is, minimaal € 15 bedraagt.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.16
  - number: 4.17.1
    text: |-
      De minister kan de achterstallige termijnen alsmede het resterende verschuldigde bedrag van de debiteur die direct
      voorafgaande aan de beëindiging van de inburgeringsplicht houder is geweest van een verblijfsvergunning voor
      bepaalde tijd als bedoeld in [artikel 28 van de Vreemdelingenwet 2000][ref1], op verzoek geheel kwijtschelden,
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.17
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
  - number: 4.17.1.a
    text: |-
      uit de gegevens in de gemeentelijke basisadministratie persoonsgegevens blijkt dat de debiteur geen verblijfsrecht
      meer heeft, en
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.17
  - number: 4.17.1.b
    text: |-
      de Immigratie- en Naturalisatiedienst kan bevestigen dat de debiteur niet langer inburgeringsplichtig is omdat de
      verblijfsvergunning, bedoeld in [artikel 29 van de Vreemdelingenwet 2000][ref1], is ingetrokken aangezien de grond
      voor verlening daarvan is komen te vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.17
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
  - number: 4.17.2
    text: |-
      Als tijdstip van indiening van het verzoek wordt aangemerkt het moment dat de minister op grond van de gegevens
      in de gemeentelijke basisadministratie persoonsgegevens heeft geconstateerd dat er geen sprake meer is van een
      verblijfsrecht.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.17
  - number: '4.18'
    text: |-
      De vergoeding, bedoeld in [artikel 4.17, eerste lid, onderdeel a, en tweede lid, onderdeel a, van het besluit][ref1],
      bedraagt € 650.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.18
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
  - number: '4.19'
    text: |-
      De vergoeding, bedoeld in [artikel 4.17, derde lid, van het besluit][ref1], bedraagt € 270.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.19
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
  - number: 4.20.1
    text: |-
      De vergoeding, bedoeld in [artikel 4.17, eerste lid, onderdeel b, en tweede lid, onderdeel b, van het besluit][ref1],
      bedraagt 70% van de kosten die door de gewezen inburgeringsplichtige zijn gemaakt ten behoeve van het volgen van
      een inburgeringscursus en het afleggen van het inburgeringsexamen of het volgen van een cursus ten behoeve van het
      behalen van het staatsexamen Nederlands als tweede taal.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
  - number: 4.20.2
    text: De vergoeding, bedoeld in het eerste lid, bedraagt ten hoogste € 3000.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.20
  - number: 4.21.1
    text: |-
      De aanvraag van de vergoeding dan wel van het resterende deel van de vergoeding, bedoeld in
      [artikel 4.17, eerste lid, onderdeel b, en tweede lid, onderdeel b, van het besluit][ref1], wordt ingediend binnen
      zes maanden nadat:


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
  - number: 4.21.1.a
    text: |-
      de gewezen inburgeringsplichtige het inburgeringsexamen of het staatsexamen Nederlands als tweede taal, heeft
      behaald, of
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.21
  - number: 4.21.1.b
    text: |-
      indien de gewezen inburgeringsplichtige een oudkomer was, het inburgeringsexamen op de niveaus, bedoeld in
      [artikelen 2.9, eerste lid][ref1], en [2.10 van het besluit][ref2], heeft behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel2
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020674
        artikel: '2'
  - number: 4.21.2
    text: 'De gewezen inburgeringsplichtige overlegt ten behoeve van de aanvraag de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.21
  - number: 4.21.2.a
    text: |-
      de originele facturen die zijn voldaan ten behoeve van de door hem gevolgde inburgeringscursus en het door hem
      afgelegde inburgeringsexamen of ten behoeve van de door hem gevolgde cursus die opleidt tot het staatsexamen
      Nederlands als tweede taal, tenzij de minister de originele facturen reeds in bezit heeft ten behoeve van de
      lening;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.21
  - number: 4.21.2.b
    text: |-
      het originele bewijs van betaling van de facturen, bedoeld in het onderdeel a, tenzij de facturen reeds door de
      minister zijn betaald overeenkomstig [artikel 4.2][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.21.2.c
    text: zijn burgerservicenummer.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.21
  - number: 4.21.3
    text: 'De facturen, bedoeld in het tweede lid, onderdeel a, vermelden in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.21
  - number: 4.21.3.a
    text: het burgerservicenummer van de kandidaat;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.21
  - number: 4.21.3.b
    text: de naam- en adresgegevens van de kandidaat;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.21
  - number: 4.21.3.c
    text: de naam- en adresgegevens van de instelling;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.21
  - number: 4.21.3.d
    text: |-
      de code WI-CU als het een inburgeringscursus betreft, de code NT2-CU als het een cursus betreft die opleidt tot het
      staatsexamen Nederlands als tweede taal, dan wel de code WI-EX als het het inburgeringsexamen betreft;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.21
  - number: 4.21.3.e
    text: |-
      de code WI-OA indien de aanmelding van de kandidaat voor het inburgeringsexamen via het Online Aanmeldsysteem
      Examens is verlopen;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.21
  - number: 4.21.3.f
    text: de handtekening van de kandidaat;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.21
  - number: 4.21.3.g
    text: de datum, en
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.21
  - number: 4.21.3.h
    text: de specificatie van het factuurbedrag.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.21
  - number: 4.24.1
    text: |-
      De minister neemt binnen acht weken nadat de inburgeringsplichtige het inburgeringsexamen heeft behaald, dan wel
      binnen acht weken na ontvangst van de aanvraag, bedoeld in [artikel 4.21, eerste lid][ref1], een beschikking,
      waarbij de omvang van het bedrag van de verrekening, bedoeld in [artikel 4.22, eerste lid, van het besluit][ref2],
      wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.24
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0020674
        artikel: '4'
  - number: 4.24.2
    text: |-
      Indien de vergoeding hoger is dan het bedrag dat de gewezen inburgeringsplichtige moet terugbetalen, wordt het
      resterende bedrag uitbetaald aan de gewezen inburgeringsplichtige.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.24
  - number: 4.25.1
    text: |-
      De cursus, bedoeld in [artikel 4.24, eerste lid, van het besluit][ref1], bestaat uit de volgende drie fasen:


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.25
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4'
  - number: 4.25.1.a
    text: 'fase 1: een intensieve taalcursus;'
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.25
  - number: 4.25.1.b
    text: 'fase 2: praktijkopdrachten in de eigen regio, en'
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.25
  - number: 4.25.1.c
    text: |-
      fase 3: centrale, thematische bijeenkomsten gericht op het verwerven van algemene en specifieke kennis van de
      Nederlandse samenleving.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.25
  - number: 4.25.2
    text: De cursus, bedoeld in het eerste lid, wordt gegeven door de combinatie Cinop-Kontakt der Kontinenten.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel4.25
  - number: '5.1'
    text: |-
      De minister stelt het aantal oudkomers aan wie het college in een door de minister vast te stellen tijdvak een
      handhavingsbeschikking bekendmaakt drie maanden voor aanvang van dat tijdvak vast.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel5.1
  - number: 6.1.1
    text: |-
      De bijzondere persoonsgegevens, bedoeld in [artikel 50, eerste lid, van de wet][ref1] zijn gegevens waaruit blijkt
      dat een inburgeringsplichtige:


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel50
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '50'
  - number: 6.1.1.a
    text: een geestelijke bedienaar is;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel6.1
  - number: 6.1.1.b
    text: |-
      is ontheven van de inburgeringsplicht op grond van [artikel 6 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel6
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '6'
  - number: 6.1.1.c
    text: |-
      een bestuurlijke boete als bedoeld in de [artikelen 29][ref1], [30][ref2], [31][ref3], of [33 van de wet][ref4]
      is opgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel31
      [ref4]: https://wetten.overheid.nl/BWBR0020611#Artikel33
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '30'
      - id: ref3
        bwb_id: BWBR0020611
        artikel: '31'
      - id: ref4
        bwb_id: BWBR0020611
        artikel: '33'
  - number: 6.1.1.d
    text: |-
      het inburgeringsexamen dan wel een deel daarvan slechts kan afleggen op een wijze die is aangepast aan zijn
      mogelijkheden.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel6.1
  - number: 6.1.2
    text: Het eerste lid, aanhef, onderdelen a en d, zijn van overeenkomstige toepassing op een vrijwillige inburgeraar.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel6.1
  - number: 6.2.1
    text: |-
      De verwerking van bijzondere persoonsgegevens als bedoeld in [artikel 6.1, onderdeel a][ref1], is in ieder geval
      noodzakelijk:


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel6
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.2.1.a
    text: |-
      voor de beoordeling van de inburgeringsplicht van een geestelijke bedienaar overeenkomstig
      [artikel 3, eerste lid, onderdeel b, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '3'
  - number: 6.2.1.b
    text: |-
      voor de toepassing van [artikel 52 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel52
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '52'
  - number: 6.2.2
    text: |-
      De verwerking van bijzondere persoonsgegevens als bedoeld in [artikel 6.1, onderdeel b][ref1], is in ieder geval
      noodzakelijk voor de beoordeling van de inburgeringsplicht overeenkomstig [artikel 3 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '3'
  - number: 6.2.3
    text: |-
      De verwerking van bijzondere persoonsgegevens als bedoeld in [artikel 6.1, onderdeel c][ref1], is in
      ieder geval noodzakelijk voor de beoordeling of een inburgeringsplichtige gehandeld heeft in strijd met
      de [artikelen 7, eerste lid][ref2], [7, tweede lid, aanhef en onderdeel a][ref3], [23, eerste lid][ref4],
      [23, derde lid][ref5], [25, vierde lid][ref6], of [32 van de wet][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0020611#Artikel23
      [ref5]: https://wetten.overheid.nl/BWBR0020611#Artikel23
      [ref6]: https://wetten.overheid.nl/BWBR0020611#Artikel25
      [ref7]: https://wetten.overheid.nl/BWBR0020611#Artikel32
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0020611
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0020611
        artikel: '23'
      - id: ref5
        bwb_id: BWBR0020611
        artikel: '23'
      - id: ref6
        bwb_id: BWBR0020611
        artikel: '25'
      - id: ref7
        bwb_id: BWBR0020611
        artikel: '32'
  - number: 6.2.4
    text: |-
      De verwerking van bijzondere persoonsgegevens als bedoeld in [artikel 6.1, onderdeel d][ref1], is in ieder geval
      noodzakelijk om de kandidaat met een psychische of lichamelijk belemmering, dan wel een verstandelijke handicap,
      op diens verzoek in de gelegenheid te stellen het inburgeringsexamen dan wel een deel daarvan af te leggen op een
      wijze die is aangepast aan zijn mogelijkheden.


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel6
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.2.5
    text: |-
      De documenten waaruit bijzondere persoonsgegevens als bedoeld in [artikel 6.1][ref1] blijken, worden neergelegd in
      een persoonsgebonden dossier. De bijzondere persoonsgegevens worden ten behoeve van de in het eerste lid bedoelde
      doeleinden verstrekt aan het Informatiesysteem Inburgering.


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel6
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.3.1
    text: |-
      Voorzover de bijzondere persoonsgegevens zijn opgeslagen in het Informatiesysteem Inburgering, wordt dit bestand
      beveiligd tegen ongeautoriseerd gebruik door:
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel6.3
  - number: 6.3.1.a
    text: |-
      het toekennen van autorisaties aan alleen die personen, die voor het uitoefenen van hun taak toegang tot de
      opgeslagen informatie moeten hebben;
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel6.3
  - number: 6.3.1.b
    text: het bewaren van een reservebestand op een voor niet-geautoriseerde personen ontoegankelijke plaats.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel6.3
  - number: 6.3.2
    text: |-
      De verantwoordelijke, bedoeld in [artikel 6.8 van het besluit][ref1], stelt richtlijnen op voor het verwerken van
      bijzondere persoonsgegevens in het Informatiesysteem Inburgering.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel6
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '6'
  - number: '6.4'
    text: |-
      De onverenigbare verwerking van bijzondere persoonsgegevens door de minister wordt op de volgende wijze
      tegengegaan:
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel6.4
  - number: 6.4.a
    text: |-
      de toegang tot de gegevens in het persoonsgebonden dossier en het Informatiesysteem Inburgering is voorbehouden
      aan die personen, die voor het uitoefenen van hun taak, bedoeld in [artikel 6.2][ref1], toegang tot de informatie
      moeten hebben;


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel6
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.4.b
    text: |-
      de verantwoordelijke, bedoeld in [artikel 6.8 van het besluit][ref1], stelt een functionaris voor de
      gegevensbescherming aan, die toeziet op de naleving van de [Wet bescherming persoonsgegevens][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0011468
  - number: 6.4.c
    text: |-
      de verantwoordelijke, bedoeld in [artikel 6.8 van het besluit][ref1], verricht integriteits- en kwaliteitsaudits
      ten aanzien van de verwerking van de persoonsgegevens en rapporteert deze aan de functionaris voor de
      gegevensbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel6
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '6'
  - number: '6.5'
    text: |-
      Voor zover de verwerking van bijzondere persoonsgegevens door de Immigratie- en Naturalisatiedienst, het college,
      de cursusinstellingen en de exameninstellingen niet geregeld is in een andere regeling, zijn de artikelen van dit
      hoofdstuk van overeenkomstige toepassing op de verwerking van bijzondere persoonsgegevens door deze instanties.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel6.5
  - number: 9.1.1
    text: |-
      De Examentraining voor examinatoren inburgering, bedoeld in [artikel 3.8, eerste lid][ref1], wordt tot 1 oktober
      2010 gegeven door het Consortium onder leiding van bureau ICE.


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel3
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 9.1.2
    text: |-
      Het Consortium onder leiding van bureau ICE reikt op aanvraag een certificaat uit, waaruit blijkt dat de aanvrager
      de Examentraining voor examinatoren inburgering met goed gevolg heeft afgelegd en het afsluitende examen heeft
      behaald.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel9.1
  - number: 9.1.3
    text: |-
      Het model van het certificaat, bedoeld in het tweede lid, is opgenomen in [bijlage 17][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020657
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0020657
  - number: '9.2'
    text: |-
      In afwijking van [artikel 5.1][ref1], wordt een in dat artikel genoemde vaststelling gedaan voor 26 februari 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel5
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '5'
        hoofdstuk: '5'
  - number: '9.4'
    text: |-
      Het aanbieden van inburgeringsprogramma’s, bedoeld in [artikel 65 van de wet][ref1], geschiedt overeenkomstig
      de [Regeling inburgering oudkomers G25 2006][ref2], de [Regeling inburgering oudkomers G30 2006][ref3] en de
      [Regeling inburgering oudkomers niet-G56 2006][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0019119
      [ref3]: https://wetten.overheid.nl/BWBR0019824
      [ref4]: https://wetten.overheid.nl/BWBR0019120
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '65'
      - id: ref2
        bwb_id: BWBR0019119
      - id: ref3
        bwb_id: BWBR0019824
      - id: ref4
        bwb_id: BWBR0019120
  - number: 9.6.1
    text: Deze regeling treedt in werking met ingang van 1 januari 2007.
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel9.6
  - number: 9.6.2
    text: |-
      [Artikel 9.4][ref1] werkt terug tot en met 1 januari 2006.


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel9
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel9.6
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '9'
        hoofdstuk: '9'
  - number: '9.7'
    text: 'Deze regeling wordt aangehaald als: Regeling inburgering.'
    url: https://wetten.overheid.nl/BWBR0020657/2010-01-01#Artikel9.7
