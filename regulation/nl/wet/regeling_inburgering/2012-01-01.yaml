  - number: 4.7a
    text: |-
      De inburgeringsplichtige kan in afwijking van [artikel 4.7, eerste lid, van het besluit][ref1] de lening in een
      keer terugbetalen. De terugbetaling omvat het bedrag van de opgebouwde schuld vermeerderd met de over dat bedrag
      verschuldigde rente, berekend overeenkomstig [artikel 4.4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4.7
      [ref2]: https://wetten.overheid.nl/BWBR0020657#Artikel4.4
    url: https://wetten.overheid.nl/BWBR0020657/2012-01-01#Artikel4.7a
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4.7'
      - id: ref2
        bwb_id: BWBR0020657
        artikel: '4.4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '4.8'
    text: |-
      1 De terugbetalingsperiode van de debiteur die algemene bijstand ontvangt en een aanvraag indient om zijn
      draagkracht vast te stellen, beslaat ten hoogste drie jaren vanaf de maand volgend op de maand waarin hij de
      minister kenbaar heeft gemaakt dat hij algemene bijstand ontvangt. De volledige terugbetalingsperiode beslaat ten
      hoogste 7 jaren.

      2 De maandelijkse termijn van de debiteur die algemene bijstand ontvangt en een draagkrachtmeting aanvraagt, wordt
      berekend overeenkomstig [artikel 4.6][ref1]. De [artikelen 4.9 tot en met 4.11 van het besluit][ref2] zijn van
      overeenkomstige toepassing.

      3 De duur van de terugbetalingsperiode, bedoeld in het eerste lid, en de hoogte van de maandelijkse termijn,
      bedoeld in het tweede lid, worden niet gewijzigd ingeval de algemene bijstand wordt beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel4.6
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel4.10
    url: https://wetten.overheid.nl/BWBR0020657/2012-01-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '4.6'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0020674
        artikel: '4.10'
  - number: '4.9'
    text: |-
      1 De draagkracht die wordt vastgesteld overeenkomstig dit artikel, gaat in op de eerste dag van de maand volgend op
      de maand waarin de aanvraag, bedoeld in [artikel 4.9 van het besluit][ref1], is ingediend.

      2 Maatstaf voor de vaststelling van de draagkracht van de debiteur uit inkomen is het totaal van het
      toetsingsinkomen van de debiteur en zijn partner in het tweede jaar voorafgaande aan het jaar waarvoor de
      draagkracht wordt vastgesteld. Het aldus bepaalde inkomen is het draagkrachtinkomen.

      3 Op het draagkrachtinkomen wordt in mindering gebracht de draagkrachtvrije voet. Deze voet is gelijk aan:

      a. 120% van het belastbaar minimumloon voor een debiteur met partner, of

      b. 120% van het belastbaar minimumloon voor een debiteur op wie de alleenstaande ouderkorting, bedoeld in
      [artikel 8.9 van de Wet inkomstenbelasting 2001][ref2], van toepassing is, of

      c. 84% van het belastbaar minimumloon voor overige debiteuren zonder partner.

      4 De draagkracht van de debiteur uit inkomen is 8% van het inkomen boven de draagkrachtvrije voet.

      5 Voor de toepassing van dit artikel wordt indien het toetsingsinkomen of het belastbaar loon in het tweede jaar
      voorafgaande aan het jaar waarvoor de draagkracht wordt vastgesteld, nog niet bekend is, door de minister daarvoor
      in de plaats gesteld een bedrag dat het vast te stellen toetsingsinkomen of het belastbaar loon benadert.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4.9
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel8.9
    url: https://wetten.overheid.nl/BWBR0020657/2012-01-01#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4.9'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '8.9'
  - number: '4.10'
    text: |-
      1 Op aanvraag van de debiteur wordt bij de toepassing van [artikel 4.9][ref1] uitgegaan van het inkomen van
      een ander jaar dan het inkomen over het tweede jaar voorafgaande aan het jaar waarvoor de draagkracht wordt
      vastgesteld, indien sprake is van terugval in inkomen:

      a. over het jaar voorafgaande aan het jaar waarvoor de draagkracht wordt vastgesteld, in welk geval wordt uitgegaan
      van het jaar voorafgaande aan het jaar waarvoor de draagkracht wordt vastgesteld, of

      b. over het jaar waarvoor de draagkracht wordt vastgesteld, in welk geval wordt uitgegaan van het jaar waarvoor de
      draagkracht wordt vastgesteld.

      2 Voor de toepassing van het eerste lid wordt onder een terugval in inkomen verstaan een vermindering van het
      toetsingsinkomen van de debiteur van ten minste 15% ten opzichte van het tweede jaar voorafgaande aan het jaar
      waarvoor de draagkracht wordt vastgesteld, met dien verstande dat de vermindering niet kan worden gerekend tot
      inkomensschommelingen die in het algemeen normaal kunnen worden geacht bij de gekozen wijze van inkomensverwerving.

      3 Voor de toepassing van het eerste lid wordt zolang het belastbaar inkomen over het tweede jaar voorafgaande aan
      het jaar waarvoor de draagkracht wordt vastgesteld, het jaar voorafgaande aan het jaar waarvoor de draagkracht
      wordt vastgesteld, of het jaar waarvoor de draagkracht wordt vastgesteld nog niet definitief bekend is, daarvoor in
      de plaats gesteld het bedrag dat naar het oordeel van de minister het uiteindelijke belastbaar loon benadert.


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel4.9
    url: https://wetten.overheid.nl/BWBR0020657/2012-01-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '4.9'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '4.11'
    text: |-
      Indien de partner van de debiteur ook een debiteur is die een beschikking tot terugbetaling als bedoeld in
      [artikel 4.8, eerste lid, van het besluit][ref1] heeft ontvangen, wordt:

      a. [artikel 4.9, tweede en vierde lid][ref2], slechts eenmaal toegepast op het totaal van het toetsingsinkomen, en

      b. bij toepassing van [artikel 4.10 van het besluit][ref3] de te betalen maandelijkse termijn per debiteur
      vastgesteld op basis van de verhouding tussen de hoogte van het toetsingsinkomen van beide debiteuren afzonderlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4.8
      [ref2]: https://wetten.overheid.nl/BWBR0020657#Artikel4.9
      [ref3]: https://wetten.overheid.nl/BWBR0020674#Artikel4.10
    url: https://wetten.overheid.nl/BWBR0020657/2012-01-01#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4.8'
      - id: ref2
        bwb_id: BWBR0020657
        artikel: '4.9'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0020674
        artikel: '4.10'
  - number: '4.12'
    text: |-
      De debiteur is in verzuim indien binnen twee weken na de vervaldatum van een vordering het bedrag van de verplichte
      terugbetaling niet is ontvangen.
    url: https://wetten.overheid.nl/BWBR0020657/2012-01-01#Artikel4.12
  - number: '4.16'
    text: |-
      Bij uitvaardiging van het dwangbevel, bedoeld in artikel 17, tweede lid, van de wet kunnen de achterstallige
      termijnen worden overgedragen aan een gerechtsdeurwaarder mits:

      a. het achterstallige deel minimaal € 180 bedraagt, of

      b. het deel dat zes maanden of langer achterstallig is, minimaal € 15 bedraagt.
    url: https://wetten.overheid.nl/BWBR0020657/2012-01-01#Artikel4.16
  - number: '4.17'
    text: |-
      1 De minister kan de achterstallige termijnen alsmede het resterende verschuldigde bedrag van de debiteur die
      direct voorafgaande aan de beëindiging van de inburgeringsplicht houder is geweest van een verblijfsvergunning
      voor bepaalde tijd als bedoeld in [artikel 28 van de Vreemdelingenwet 2000][ref1], op verzoek geheel kwijtschelden,
      indien:

      a. uit de gegevens in de gemeentelijke basisadministratie persoonsgegevens blijkt dat de debiteur geen
      verblijfsrecht meer heeft, en

      b. de Immigratie- en Naturalisatiedienst kan bevestigen dat de debiteur niet langer inburgeringsplichtig is omdat
      de verblijfsvergunning, bedoeld in [artikel 29 van de Vreemdelingenwet 2000][ref2], is ingetrokken aangezien de
      grond voor verlening daarvan is komen te vervallen.

      2 Als tijdstip van indiening van het verzoek wordt aangemerkt het moment dat de minister op grond van de gegevens
      in de gemeentelijke basisadministratie persoonsgegevens heeft geconstateerd dat er geen sprake meer is van een
      verblijfsrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0020657/2012-01-01#Artikel4.17
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '29'
  - number: '4.18'
    text: |-
      De vergoeding, bedoeld in [artikel 4.17, eerste lid, onderdeel a, en tweede lid, onderdeel a, van het besluit][ref1],
      bedraagt € 650.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4.17
    url: https://wetten.overheid.nl/BWBR0020657/2012-01-01#Artikel4.18
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4.17'
  - number: '4.19'
    text: |-
      De vergoeding, bedoeld in [artikel 4.17, derde lid, van het besluit][ref1], bedraagt € 270.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4.17
    url: https://wetten.overheid.nl/BWBR0020657/2012-01-01#Artikel4.19
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4.17'
  - number: '4.20'
    text: |-
      1 De vergoeding, bedoeld in
      [artikel 4.17, eerste lid, onderdeel b, en tweede lid, onderdeel b, van het besluit][ref1], bedraagt 70% van de
      kosten die door de gewezen inburgeringsplichtige zijn gemaakt ten behoeve van het volgen van een inburgeringscursus
      en het afleggen van het inburgeringsexamen of het volgen van een cursus ten behoeve van het behalen van het
      staatsexamen Nederlands als tweede taal.

      2 De vergoeding, bedoeld in het eerste lid, bedraagt ten hoogste € 3000.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4.17
    url: https://wetten.overheid.nl/BWBR0020657/2012-01-01#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4.17'
  - number: '4.21'
    text: |-
      1 De aanvraag van de vergoeding dan wel van het resterende deel van de vergoeding, bedoeld in
      [artikel 4.17, eerste lid, onderdeel b, en tweede lid, onderdeel b, van het besluit][ref1], wordt ingediend binnen
      zes maanden nadat:

      a. de gewezen inburgeringsplichtige het inburgeringsexamen of het staatsexamen Nederlands als tweede taal, heeft
      behaald, of

      b. indien de gewezen inburgeringsplichtige een oudkomer was, het inburgeringsexamen op de niveaus, bedoeld in
      [artikelen 2.9, eerste lid][ref2], en [2.10 van het besluit][ref3], heeft behaald.

      2 De gewezen inburgeringsplichtige overlegt ten behoeve van de aanvraag de volgende gegevens:

      a. de originele facturen die zijn voldaan ten behoeve van de door hem gevolgde inburgeringscursus en het door
      hem afgelegde inburgeringsexamen of ten behoeve van de door hem gevolgde cursus die opleidt tot het staatsexamen
      Nederlands als tweede taal, tenzij de minister de originele facturen reeds in bezit heeft ten behoeve van de
      lening;

      b. het originele bewijs van betaling van de facturen, bedoeld in het onderdeel a, tenzij de facturen reeds door de
      minister zijn betaald overeenkomstig [artikel 4.2][ref4], en

      c. zijn burgerservicenummer.

      3 De facturen, bedoeld in het tweede lid, onderdeel a, vermelden in ieder geval:

      a. het burgerservicenummer van de kandidaat;

      b. de naam- en adresgegevens van de kandidaat;

      c. de naam- en adresgegevens van de instelling;

      d. de code WI-CU als het een inburgeringscursus betreft, de code NT2-CU als het een cursus betreft die opleidt tot
      het staatsexamen Nederlands als tweede taal, dan wel de code WI-EX als het het inburgeringsexamen betreft;

      e. de code WI-OA indien de aanmelding van de kandidaat voor het inburgeringsexamen via het Online Aanmeldsysteem
      Examens is verlopen;

      f. de handtekening van de kandidaat;

      g. de datum, en

      h. de specificatie van het factuurbedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4.17
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel2.9
      [ref3]: https://wetten.overheid.nl/BWBR0020674#Artikel2.10
      [ref4]: https://wetten.overheid.nl/BWBR0020657#Artikel4.2
    url: https://wetten.overheid.nl/BWBR0020657/2012-01-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4.17'
      - id: ref2
        bwb_id: BWBR0020674
        artikel: '2.9'
      - id: ref3
        bwb_id: BWBR0020674
        artikel: '2.10'
      - id: ref4
        bwb_id: BWBR0020657
        artikel: '4.2'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '4.24'
    text: |-
      1 De minister neemt binnen acht weken nadat de inburgeringsplichtige het inburgeringsexamen heeft behaald, dan
      wel binnen acht weken na ontvangst van de aanvraag, bedoeld in [artikel 4.21, eerste lid][ref1], een beschikking,
      waarbij de omvang van het bedrag van de verrekening, bedoeld in [artikel 4.22, eerste lid, van het besluit][ref2],
      wordt vastgesteld.

      2 Indien de vergoeding hoger is dan het bedrag dat de gewezen inburgeringsplichtige moet terugbetalen, wordt het
      resterende bedrag uitbetaald aan de gewezen inburgeringsplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel4.21
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel4.22
