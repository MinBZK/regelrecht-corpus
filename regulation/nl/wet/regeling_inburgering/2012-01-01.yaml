  - number: 3.15a
    text: |-
      1 In aanvulling op [artikel 3.18, tweede lid, van het besluit][ref1] beschrijft het jaarverslag ten minste:

      a. de wijze waarop de beoordeling van de kwaliteit van de taakuitoefening, bedoeld in
      [artikel 3.18, eerste lid, van het besluit][ref2] heeft plaatsgevonden, alsmede de bevindingen welke voortvloeien
      uit die beoordeling;

      b. de wijze waarop de exameninstellingen zijn betrokken bij de vaststelling van de wijze van uitvoering van het op
      hen uit te oefenen toezicht;

      c. de wijze waarop de deskundigheid van de personen die zijn belast met het uitoefenen van taken voor het
      Kwaliteitscentrum examinering inburgering is geborgd, en;

      d. de aantallen op basis van de klachtenregeling, bedoeld in [artikel 3.24 van het besluit][ref3], ingediende
      klachten, alsmede de aard van die klachten.

      2 In aanvulling op [artikel 3.18, tweede lid, van het besluit][ref4] bevat het jaarverslag ten minste een opsomming
      van:

      a. het aantal onderzochte exameninstellingen, alsmede het aantal bestede uren per exameninstelling;

      b. per exameninstelling, het aantal onderzochte examenlocaties, alsmede het aantal bestede uren per examenlocatie,
      en;

      c. per toezichtsproces, het gemiddeld aantal bestede uren.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3.18
