  - number: '5.1'
    text: |-
      De minister stelt het aantal oudkomers aan wie het college in een door de minister vast te stellen tijdvak een
      handhavingsbeschikking bekendmaakt drie maanden voor aanvang van dat tijdvak vast.
    url: https://wetten.overheid.nl/BWBR0020657/2012-01-01#Artikel5.1
  - number: '6.1'
    text: |-
      1 De bijzondere persoonsgegevens, bedoeld in [artikel 50, eerste lid, van de wet][ref1] zijn gegevens waaruit
      blijkt dat een inburgeringsplichtige:

      a. een geestelijke bedienaar is;

      b. is ontheven van de inburgeringsplicht op grond van [artikel 6 van de wet][ref2];

      c. een bestuurlijke boete als bedoeld in de [artikelen 29][ref3], [30][ref4], [31][ref5], of [33 van de wet][ref6]
      is opgelegd;

      d. het inburgeringsexamen dan wel een deel daarvan slechts kan afleggen op een wijze die is aangepast aan zijn
      mogelijkheden.

      2 Het eerste lid, aanhef, onderdelen a en d, zijn van overeenkomstige toepassing op een vrijwillige inburgeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel29
