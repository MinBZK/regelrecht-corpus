        bwb_id: BWBR0020674
        artikel: '3.12'
  - number: '3.10'
    text: |-
      1 Bij de afname en de beoordeling van de tot het praktijkdeel van het inburgeringsexamen behorende examens
      en het vaststellen van de uitslag, handelen de exameninstellingen overeenkomstig de portfolio’s, bedoeld in
      [artikel 3.5, eerste lid][ref1], en de handleiding assessments, bedoeld in [artikel 3.5, tweede lid][ref2].

      2 De exameninstellingen laten een ieder die zich daarvoor overeenkomstig de daartoe gestelde regels heeft
      aangemeld, het verschuldigde examengeld heeft voldaan en zich overeenkomstig [artikel 3.4 van het besluit][ref3],
      heeft geïdentificeerd, toe tot de tot het inburgeringsexamen behorende examens.

      3 De exameninstellingen waarborgen de kwaliteit van de examinering door:

      a. transparantie van de organisatiestructuur van de instelling en van de taken, bevoegdheden en
      verantwoordelijkheden bij de examinering;

      b. het treffen van passende technische en organisatorische maatregelen om de examen- en persoonsgegevens te
      beveiligen tegen verlies of onrechtmatige verwerking;

      c. het beschrijven van de procedure van verwerking van examenresultaten en de gegevensverstrekking ten behoeve van
      opneming in het Informatiesysteem Inburgering;

      d. de naleving van het examenreglement, bedoeld in [artikel 3.14, eerste lid, onderdeel c, van het besluit][ref4];

      e. het treffen van passende technische en organisatorische maatregelen om de kwaliteit van de processen rondom de
      afname en de beoordeling van examens te waarborgen.


