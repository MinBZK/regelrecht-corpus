  - number: '3.13'
    text: |-
      1 In het examenreglement, bedoeld in [artikel 3.14, eerste lid, onderdeel c, van het besluit][ref1], wordt in ieder
      geval vermeld:

      a. de procedure van aanmelding en identificatie van de inburgeringsplichtige;

      b. de financiële aspecten van het praktijkdeel van het inburgeringsexamen;

      c. de wijze van bekendmaking van de uitslagen van het praktijkdeel van het inburgeringsexamen;

      d. dat de instelling beschikt over een examencommissie, bedoeld in [artikel 3.11 van het besluit][ref2];

      e. dat de instelling beschikt over een commissie van beroep, bedoeld in [artikel 3.12 van het besluit][ref3];

      f. de procedure en sancties bij fraude, en

      g. de procedure voor de afhandeling van klachten.

      2 In het examenreglement verklaart de exameninstelling dat de tot het praktijkdeel van het inburgeringsexamen
      behorende examens en de beoordeling van examens worden afgenomen overeenkomstig de portfolio’s, bedoeld in
      [artikel 3.5, eerste lid][ref4], en de handleiding assessments, bedoeld in [artikel 3.5, tweede lid][ref5].


