  - number: 2.2b
    text: |-
      Van de verplichting om mondelinge vaardigheden in de Nederlandse taal te verwerven en het betreffende deel van het
      inburgeringsexamen te behalen, is vrijgesteld de inburgeringsplichtige die beschikt over de beschikking van het
      basisexamen inburgering in het buitenland, indien uit die beschikking blijkt dat voor het onderdeel luister- en
      spreekvaardigheid ten minste 37 punten is behaald.
    url: https://wetten.overheid.nl/BWBR0020657/2012-01-01#Artikel2.2b
  - number: 2.2c
    text: |-
      Van de verplichting om mondelinge en schriftelijke vaardigheden in de Nederlandse taal te verwerven en het
      betreffende deel van het inburgeringsexamen te behalen, is vrijgesteld de inburgeringsplichtige die beschikt over
      de volgende certificaten van het Certificaat Nederlands als Vreemde Taal:

      a. Certificaat Profiel Toeristische en Informele Taalvaardigheid (ERK-niveau A2);

      b. Certificaat Profiel Taalvaardigheid Praktische Beroepen (ERK-niveau A2);

      c. Certificaat Profiel Maatschappelijke Taalvaardigheid (ERK-niveau B1);

      d. Certificaat Profiel Professionele Taalvaardigheid (ERK-niveau B2);

      e. Certificaat Profiel Taalvaardigheid Hoger Onderwijs (ERK-niveau B2);

      f. Certificaat Profiel Academische Taalvaardigheid (ERK-niveau C1).
    url: https://wetten.overheid.nl/BWBR0020657/2012-01-01#Artikel2.2c
  - number: '2.3'
    text: |-
      1 De kosten voor de deelname aan de toets, bedoeld in [artikel 2.7, vijfde lid, van het besluit][ref1], bedragen
      € 81.

