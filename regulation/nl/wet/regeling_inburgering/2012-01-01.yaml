  - number: '3.11'
    text: |-
      1 De minister wijst de exameninstellingen aan en kan deze aanwijzing schorsen of intrekken.

      2 Een afschrift van de beschikking op de aanvraag tot aanwijzing als exameninstelling wordt gezonden aan het
      Kwaliteitscentrum examinering inburgering.
    url: https://wetten.overheid.nl/BWBR0020657/2012-01-01#Artikel3.11
  - number: '3.12'
    text: |-
      1 Bij het verzoek om een onderzoek als bedoeld in [artikel 3.17, tweede lid, onderdeel a, van het besluit][ref1]
      legt de instelling over:

      a. een bewijs van inschrijving in het handelsregister, dat niet ouder is dan zes maanden;

      b. een vastgesteld examenreglement als bedoeld in [artikel 3.14, eerste lid, onderdeel c, van het besluit][ref2];

      c. bewijs dat ten minste twee aan de instelling verbonden examinatoren met goed gevolg de Examentraining voor
      examinatoren inburgering als bedoeld in [artikel 3.8][ref3] hebben afgerond;

      d. gegevens en bescheiden waaruit blijkt dat de instelling voldoet aan de eisen, bedoeld in
      [artikel 3.10, derde lid][ref4].

      2 Het rapport, bedoeld in [artikel 3.15, derde lid, van het besluit][ref5], van het Kwaliteitscentrum examinering
      inburgering, bevat een positief advies, indien de instelling voldoet aan de bij en krachtens de wet gestelde eisen.
      In de overige gevallen bevat het een negatief advies.

      3 Het rapport wordt aan de instelling toegezonden. Indien het rapport een negatief advies bevat, kan de instelling
      een zienswijze bij het rapport voegen.


