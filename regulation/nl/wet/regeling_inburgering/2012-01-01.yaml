  - number: '3.16'
    text: |-
      1 Het Kwaliteitscentrum examinering inburgering wordt jaarlijks subsidie verleend voor de taken, bedoeld in
      [artikel 3.17, tweede lid, van het besluit][ref1].

      2 De subsidie wordt verleend onder de volgende voorwaarden:

      a. Het Kwaliteitscentrum examinering inburgering legt in februari en juni van elk jaar een voortgangsrapportage
      over, die in ieder geval gegevens bevat over het aantal uitgevoerde onderzoeken als bedoeld in
      [artikel 3.17, tweede lid, onderdeel a, van het besluit][ref2] en de tijdsbesteding door het Kwaliteitscentrum
      examinering inburgering per onderzoek;

      b. Het Kwaliteitscentrum examinering inburgering brengt een deugdelijke scheiding aan in zijn administratie en zijn
      financiële beheer voor de activiteiten, bedoeld in [artikel 3.17, tweede lid, onderdeel a, van het besluit][ref3],
      [artikel 3.17, tweede lid, onderdeel b, van het besluit][ref4], en de overige activiteiten van het
      Kwaliteitscentrum examinering inburgering;

      c. Het Kwaliteitscentrum examinering inburgering voert op regelmatige basis overleg met de minister;

      d. De minister heeft recht op het gebruik van de door het Kwaliteitscentrum examinering inburgering ontwikkelde
      instrumenten en producten.

      3 Het Kwaliteitscentrum examinering inburgering dient een aanvraag om verlening van de subsidie in tezamen met de
      begroting, bedoeld in [artikel 3.19, eerste lid, van het besluit][ref5].

      4 Het Kwaliteitscentrum examinering inburgering dient een aanvraag tot vaststelling van de subsidie in tezamen met
      de jaarrekening, bedoeld in [artikel 3.19, tweede lid, van het besluit][ref6].

      5 De subsidie wordt verleend per kalenderjaar. [Afdeling 4.2.8 van de Algemene wet bestuursrecht][ref7] is van
      toepassing.

      6 Het Kwaliteitscentrum examinering inburgering vormt een egalisatiereserve als bedoeld in
      [artikel 4:72 van de Algemene wet bestuursrecht][ref8].


