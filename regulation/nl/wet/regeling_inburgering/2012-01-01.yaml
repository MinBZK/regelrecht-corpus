  - number: '6.3'
    text: |-
      1 Voorzover de bijzondere persoonsgegevens zijn opgeslagen in het Informatiesysteem Inburgering, wordt dit bestand
      beveiligd tegen ongeautoriseerd gebruik door:

      a. het toekennen van autorisaties aan alleen die personen, die voor het uitoefenen van hun taak toegang tot de
      opgeslagen informatie moeten hebben;

      b. het bewaren van een reservebestand op een voor niet-geautoriseerde personen ontoegankelijke plaats.

      2 De verantwoordelijke, bedoeld in [artikel 6.8 van het besluit][ref1], stelt richtlijnen op voor het verwerken van
      bijzondere persoonsgegevens in het Informatiesysteem Inburgering.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel6.8
    url: https://wetten.overheid.nl/BWBR0020657/2012-01-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '6.8'
  - number: '6.4'
    text: |-
      De onverenigbare verwerking van bijzondere persoonsgegevens door de minister wordt op de volgende wijze
      tegengegaan:

      a. de toegang tot de gegevens in het persoonsgebonden dossier en het Informatiesysteem Inburgering is voorbehouden
      aan die personen, die voor het uitoefenen van hun taak, bedoeld in [artikel 6.2][ref1], toegang tot de informatie
      moeten hebben;

      b. de verantwoordelijke, bedoeld in [artikel 6.8 van het besluit][ref2], stelt een functionaris voor de
      gegevensbescherming aan, die toeziet op de naleving van de [Wet bescherming persoonsgegevens][ref3];

      c. de verantwoordelijke, bedoeld in [artikel 6.8 van het besluit][ref4], verricht integriteits- en kwaliteitsaudits
      ten aanzien van de verwerking van de persoonsgegevens en rapporteert deze aan de functionaris voor de
      gegevensbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel6.2
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel6.8
      [ref3]: https://wetten.overheid.nl/BWBR0011468
      [ref4]: https://wetten.overheid.nl/BWBR0020674#Artikel6.8
    url: https://wetten.overheid.nl/BWBR0020657/2012-01-01#Artikel6.4
    references:
