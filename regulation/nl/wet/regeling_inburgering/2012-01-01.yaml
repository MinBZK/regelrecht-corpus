  - number: '3.8'
    text: |-
      1 De training, bedoeld in [artikel 3.11, vierde lid, van het besluit][ref1], is de Examentraining voor examinatoren
      inburgering.

      2 De examinator kan deelnemen aan de training indien hij:

      a. over het certificaat bekwaam docent Nederlands als tweede taal beschikt;

      b. een opleiding van het hoger beroepsonderwijs of het wetenschappelijk onderwijs heeft afgerond en gedurende
      de twee jaar voorafgaand aan de inschrijving voor de training gemiddeld twee dagdelen per week leservaring heeft
      opgedaan, of als docent Nederlands als tweede taal, of

      c. een van de volgende opleidingen heeft afgerond:

      1°. urgentieopleiding basiseducatie;

      2°. post-hoger beroepsonderwijs basiseducatie;

      3°. post-hoger beroepsonderwijs Nederlands als tweede taal;

      4°. toegepaste taalwetenschap met specialisatie Nederlands als tweede taal;

      5°. algemene taalwetenschap met specialisatie Nederlands als tweede taal;

      6°. opleiding Nederlands als tweede taal – expert, of

      7°. duale masteropleiding Nederlands als tweede taal

      , en gedurende het jaar voorafgaand aan de inschrijving voor de training gemiddeld twee dagdelen per week
      leservaring als docent Nederlands als tweede taal heeft opgedaan.

      3 De training wordt tot 1 januari 2013 gegeven door CINOP.

      4 CINOP reikt op aanvraag een certificaat uit, waaruit blijkt dat de deelnemer de training met goed gevolg heeft
      afgelegd en het aansluitende examen heeft behaald.

      5 Het model van het certificaat, bedoeld in het tweede lid, is opgenomen in [bijlage 17][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3.11
      [ref2]: https://wetten.overheid.nl/BWBR0020657
