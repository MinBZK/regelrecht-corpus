  - number: '4.3'
    text: |-
      Het rentepercentage, genoemd in [artikel 4.5, eerste lid, van het besluit][ref1], bedraagt voor het jaar 2012:
      2,46 procent.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4.5
    url: https://wetten.overheid.nl/BWBR0020657/2012-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '4.5'
  - number: '4.4'
    text: |-
      1 De rente over de door de inburgeringsplichtige opgenomen lening wordt maandelijks berekend op basis van
      samengestelde interest.

      2 Voor de berekening van de rente op de voet van het eerste lid wordt een maand gesteld op 30 dagen en een jaar
      gesteld op 360 dagen.
    url: https://wetten.overheid.nl/BWBR0020657/2012-01-01#Artikel4.4
  - number: '4.5'
    text: |-
      Gedurende de aanloopfase, bedoeld in [artikel 17, eerste lid, van de wet][ref1], en de terugbetalingsperiode,
      bedoeld in [artikel 4.6, eerste lid, van het besluit][ref2], wordt hetzelfde rentepercentage gehanteerd,
      vastgesteld overeenkomstig [artikel 4.5, eerste lid, van het besluit][ref3]. Het bij aanvang van de aanloopfase
      geldende rentepercentage wordt gehanteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel4.6
      [ref3]: https://wetten.overheid.nl/BWBR0020674#Artikel4.5
    url: https://wetten.overheid.nl/BWBR0020657/2012-01-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0020674
        artikel: '4.6'
      - id: ref3
        bwb_id: BWBR0020674
        artikel: '4.5'
  - number: '4.6'
    text: |-
      1 De hoogte van de maandelijkse termijn wordt berekend op basis van het bedrag aan opgebouwde schuld vermeerderd
      met de over dat bedrag verschuldigde rente, berekend overeenkomstig [artikel 4.4][ref1] en gedeeld door het aantal
      te betalen termijnen.

      2 De hoogte van de maandelijkse termijn bedraagt ten minste € 15.


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel4.4
    url: https://wetten.overheid.nl/BWBR0020657/2012-01-01#Artikel4.6
    references:
