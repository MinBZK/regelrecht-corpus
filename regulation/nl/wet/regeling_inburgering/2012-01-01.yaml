  - number: '1.3'
    text: |-
      1 Als geestelijke bedienaar wordt in ieder geval aangemerkt de vreemdeling die houder is van een
      verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14 van de Vreemdelingenwet 2000][ref1], die is
      verleend onder een beperking verband houdend met het verrichten van arbeid als geestelijke bedienaar.

      2 Onder kerkgenootschap of een ander genootschap op geestelijke of levensbeschouwelijke grondslag als bedoeld
      in [artikel 1, eerste lid, onderdeel g, van de wet][ref2] wordt tevens verstaan een onderdeel daarvan of een
      rechtspersoon waarin twee of meer van deze genootschappen samenwerken.

      3 Van werkzaamheden van overwegend godsdienstige, geestelijke of levensbeschouwelijke aard als bedoeld in
      [artikel 1, eerste lid, onderdeel g, van de wet][ref3] is in ieder geval sprake in geval van werkzaamheden als
      voorganger, godsdienstleraar, zendeling, leraar levensbeschouwelijk onderwijs, vertrouwenspersoon of pastoraal
      werker binnen een godsdienstige of levensbeschouwelijke gemeenschap, dan wel op het terrein van het uitdragen en
      verklaren van een bepaalde geloofsleer of levensbeschouwelijke opvattingen.

      4 Als geestelijke bedienaar wordt niet aangemerkt degene die op louter incidentele basis werkzaamheden als bedoeld
      in het derde lid, verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel1
