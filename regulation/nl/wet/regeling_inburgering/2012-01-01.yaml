  - number: '6.2'
    text: |-
      1 De verwerking van bijzondere persoonsgegevens als bedoeld in [artikel 6.1, onderdeel a][ref1], is in ieder geval
      noodzakelijk:

      a. voor de beoordeling van de inburgeringsplicht van een geestelijke bedienaar overeenkomstig
      [artikel 3, eerste lid, onderdeel b, van de wet][ref2];

      b. voor de toepassing van [artikel 52 van de wet][ref3].

      2 De verwerking van bijzondere persoonsgegevens als bedoeld in [artikel 6.1, onderdeel b][ref4], is in ieder geval
      noodzakelijk voor de beoordeling van de inburgeringsplicht overeenkomstig [artikel 3 van de wet][ref5].

      3 De verwerking van bijzondere persoonsgegevens als bedoeld in [artikel 6.1, onderdeel c][ref6], is in
      ieder geval noodzakelijk voor de beoordeling of een inburgeringsplichtige gehandeld heeft in strijd met
      de [artikelen 7, eerste lid][ref7], [7, tweede lid, aanhef en onderdeel a][ref8], [23, eerste lid][ref9],
      [23, derde lid][ref10], [25, vierde lid][ref11], of [32 van de wet][ref12].

      4 De verwerking van bijzondere persoonsgegevens als bedoeld in [artikel 6.1, onderdeel d][ref13], is in ieder geval
      noodzakelijk om de kandidaat met een psychische of lichamelijk belemmering, dan wel een verstandelijke handicap,
      op diens verzoek in de gelegenheid te stellen het inburgeringsexamen dan wel een deel daarvan af te leggen op een
      wijze die is aangepast aan zijn mogelijkheden.

      5 De documenten waaruit bijzondere persoonsgegevens als bedoeld in [artikel 6.1][ref14] blijken, worden neergelegd
      in een persoonsgebonden dossier. De bijzondere persoonsgegevens worden ten behoeve van de in het eerste lid
      bedoelde doeleinden verstrekt aan het Informatiesysteem Inburgering.


