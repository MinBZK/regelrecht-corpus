      1 Het verslag, bedoeld in [artikel 3.26 van het besluit][ref1], bevat ten minste gegevens ten aanzien van:

      a. het aantal deelnemers in totaal;

      b. het aantal deelnemers per assessment, portfolio dan wel een combinatie daarvan als bedoeld in
      [artikel 3.7, tweede lid, van het besluit][ref2];

      c. het aantal deelnemers, per assessment, portfolio dan wel een combinatie daarvan, als bedoeld in
