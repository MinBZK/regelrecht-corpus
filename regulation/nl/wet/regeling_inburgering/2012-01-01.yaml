  - number: '3.6'
    text: |-
      1 De kandidaat heeft het praktijkdeel van het inburgeringsexamen, bedoeld in [artikel 3.7 van het besluit][ref1],
      behaald, indien hij:

      a. 20 portfolio-opdrachten,

      b. 4 assessmentopdrachten, of

      c. een combinatie van 10 portfolio-opdrachten en 2 assessmentopdrachten met goed gevolg heeft afgelegd.

      2 De oudkomer die het inburgeringsexamen heeft behaald op de niveaus, bedoeld in de
      [artikelen 2.9, tweede lid][ref2], en [2.10 van het besluit][ref3], heeft het inburgeringsexamen op het niveau,
      bedoeld in [artikel 2.9, eerste lid, van het besluit][ref4], behaald indien hij:

      a. 10 portfolio-opdrachten of 2 assessmentopdrachten, en

      b. het elektronisch praktijkexamen, bedoeld in [artikel 3.9, eerste lid, onderdeel a, van het besluit][ref5] met
      goed gevolg heeft afgelegd.

      3 De portfolio-opdrachten, bedoeld in het eerste lid, onderdeel a, en het tweede lid, onderdeel a, worden
      beoordeeld in een panelgesprek, gehouden door twee examinatoren.

      4 De assessmentopdrachten, bedoeld in het eerste lid, onderdeel b, en het tweede lid, onderdeel a, en de combinatie
      van assessmentopdrachten en portfolio-opdrachten, bedoeld in het eerste lid, onderdeel c, worden afgenomen met
      een assessment.

      5 Het panelgesprek, bedoeld in het derde lid, wordt gevoerd overeenkomstig de handleiding die is opgenomen in
      [bijlage 12][ref6] bij deze regeling.


