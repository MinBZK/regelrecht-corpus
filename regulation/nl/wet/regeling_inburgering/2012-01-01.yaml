  - number: '3.7'
    text: |-
      1 De kandidaat die geestelijke bedienaar is, heeft het aanvullend praktijkdeel, bedoeld in
      [artikel 3.8, eerste lid, van het besluit][ref1], behaald, indien hij 6 portfolio-opdrachten met goed gevolg heeft
      afgelegd.

      2 Indien de kandidaat geestelijke bedienaar is, bestaat het bijzonder praktijkdeel, bedoeld in
      [artikel 3.8, tweede lid, van het besluit][ref2] uit 20 portfolio-opdrachten en 2 assessmentopdrachten.

      3 Voor kandidaten die geestelijke bedienaar zijn, gelden eindtermen van het aanvullend en bijzonder praktijkexamen
      als bedoeld in [artikel 3.8, eerste en tweede lid, van het besluit][ref3], zoals opgenomen in [bijlage 10][ref4]
      bij deze regeling.

      4 Het aanvullend praktijkdeel, bedoeld in [artikel 3.8, eerste lid, van het besluit][ref5], wordt:

      a. samengesteld overeenkomstig het model dat is opgenomen in [bijlage 13][ref6] bij deze regeling, en

      b. afgenomen overeenkomstig de handleiding die is opgenomen in [bijlage 14][ref7] bij deze regeling.

      5 Het bijzonder praktijkdeel, bedoeld in [artikel 3.8, tweede lid, van het besluit][ref8], wordt samengesteld
      overeenkomstig het model dat is opgenomen in [bijlage 15][ref9] bij deze regeling.

      6 De assessmentopdrachten, bedoeld in het tweede lid, worden afgenomen overeenkomstig de handleiding die is
      opgenomen in [bijlage 16][ref10] bij deze regeling.


