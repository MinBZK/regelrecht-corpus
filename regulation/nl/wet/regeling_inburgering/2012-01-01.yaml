  - number: '3.9'
    text: |-
      1 De voorzitter, de plaatsvervangend voorzitter en de overige leden en plaatsvervangende leden van de commissie van
      beroep, bedoeld in [artikel 3.12, derde lid, van het besluit][ref1], worden door het bevoegd gezag benoemd voor een
      termijn van ten minste drie en ten hoogste vijf jaar. Zij zijn opnieuw benoembaar.

      2 Op eigen verzoek wordt aan de leden en plaatsvervangende leden van de commissie van beroep voor de examens
      ontslag verleend door het bevoegd gezag. Bij het bereiken van de leeftijd van zeventig jaar wordt hun ontslag
      verleend met ingang van de eerstvolgende maand. Zij worden ontslagen indien zij uit hoofde van ziekte of gebreken
      niet in staat zijn hun functie te vervullen alsmede indien zij bij onherroepelijk geworden rechterlijke uitspraak
      wegens misdrijf zijn veroordeeld. Alvorens het ontslag op grond van het in de derde volzin bepaalde wordt verleend,
      wordt de betrokkene van het voornemen tot ontslag in kennis gesteld en wordt hem de gelegenheid geboden zich ter
      zake te doen horen.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel3.12
    url: https://wetten.overheid.nl/BWBR0020657/2012-01-01#Artikel3.9
    references:
