  - number: '4.1'
    text: Het bedrag van de lening bedraagt ten hoogste € 5000.
    url: https://wetten.overheid.nl/BWBR0020657/2012-01-01#Artikel4.1
  - number: '4.2'
    text: |-
      1 Ten behoeve van de betaling van de lening verstrekt de inburgeringsplichtige originele facturen aan de minister
      van:

      a. de door hem te volgen of gevolgde inburgeringscursus en het door hem af te leggen of afgelegde
      inburgeringsexamen;

      b. de door hem te volgen of gevolgde cursus die opleidt tot het staatsexamen Nederlands als tweede taal, of

      c. de door een inburgeringsplichtige oudkomer te volgen of gevolgde cursus die opleidt tot, alsmede het
      afleggen van het inburgeringsexamen op de niveaus, bedoeld in de [artikelen 2.9, eerste lid][ref1], en
      [2.10 van het besluit][ref2].

      2 De factuur vermeldt in ieder geval:

      a. het burgerservicenummer van de kandidaat;

      b. de naam- en adresgegevens van de kandidaat;

      c. de naam- en adresgegevens van de instelling;

      d. de code WI-CU als het een inburgeringscursus betreft, de code NT2-CU als het een cursus betreft die opleidt tot
      het staatsexamen Nederlands als tweede taal dan wel de code WI-EX als het het inburgeringsexamen betreft;

      e. de code WI-OA indien de aanmelding van de kandidaat voor het inburgeringsexamen via het Online Aanmeldsysteem
      Examens is verlopen;

      f. de handtekening van de kandidaat;

      g. de datum, en

      h. de specificatie van het factuurbedrag.

      3 De betaling van de factuur, bedoeld in het eerste lid, geschiedt binnen vier weken na ontvangst door de minister
      van die factuur.

      4 De eerste betaling vindt plaats binnen een jaar na de beschikking, bedoeld in
      [artikel 4.4, eerste lid, van het besluit][ref3], waarbij het recht op de lening is vastgesteld. Indien binnen deze
      periode geen betaling heeft plaatsgevonden, vervalt de beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2.9
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel2.10
      [ref3]: https://wetten.overheid.nl/BWBR0020674#Artikel4.4
    url: https://wetten.overheid.nl/BWBR0020657/2012-01-01#Artikel4.2
    references:
