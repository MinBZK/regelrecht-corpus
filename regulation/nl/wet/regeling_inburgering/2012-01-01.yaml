        artikel: '6.8'
  - number: '6.5'
    text: |-
      Voor zover de verwerking van bijzondere persoonsgegevens door de Immigratie- en Naturalisatiedienst, het college,
      de cursusinstellingen en de exameninstellingen niet geregeld is in een andere regeling, zijn de artikelen van dit
      hoofdstuk van overeenkomstige toepassing op de verwerking van bijzondere persoonsgegevens door deze instanties.
    url: https://wetten.overheid.nl/BWBR0020657/2012-01-01#Artikel6.5
  - number: '9.2'
    text: |-
      In afwijking van [artikel 5.1][ref1], wordt een in dat artikel genoemde vaststelling gedaan voor 26 februari 2007.


