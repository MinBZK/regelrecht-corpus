    text: |-
      Het keurmerk, bedoeld in [artikel 1, eerste lid, onderdeel i, van de wet][ref1] is het Keurmerk Inburgeren, dat
      wordt toegekend en beheerd door de Stichting Blik op Werk.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel1
    url: https://wetten.overheid.nl/BWBR0020657/2012-01-01#Artikel1.2
