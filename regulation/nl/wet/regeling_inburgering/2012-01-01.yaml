  - number: '4.25'
    text: |-
      1 De cursus, bedoeld in [artikel 4.24, eerste lid, van het besluit][ref1], bestaat uit de volgende drie fasen:

      a. fase 1: een intensieve taalcursus;

      b. fase 2: praktijkopdrachten in de eigen regio, en

      c. fase 3: centrale, thematische bijeenkomsten gericht op het verwerven van algemene en specifieke kennis van de
      Nederlandse samenleving.

      2 De cursus, bedoeld in het eerste lid, wordt gegeven door CINOP.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel4.24
    url: https://wetten.overheid.nl/BWBR0020657/2012-01-01#Artikel4.25
