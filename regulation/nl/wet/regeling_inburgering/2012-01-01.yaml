  - number: 2.2a
    text: |-
      1 Van de verplichting om mondelinge en schriftelijke vaardigheden in de Nederlandse taal te verwerven en het
      betreffende deel van het inburgeringsexamen te behalen, is vrijgesteld de inburgeringsplichtige die beschikt over
      een originele verklaring van het regionaal opleidingencentrum die is afgegeven op basis van de resultaten van een
      voor 1 januari 2007 afgelegde toets ter afronding van een NT2-taaltraject, indien uit de verklaring blijkt dat
      voor het onderdeel Nederlands als tweede taal ten minste de volgende niveaus van de eindtermen Referentiekader
      Nederlands als Tweede Taal, dan wel Europees Raamwerk voor Moderne Vreemde Talen, zijn behaald:

      a. niveau 2, respectievelijk niveau A2, voor de onderdelen Luisteren en Spreken, en niveau 2, respectievelijk
      niveau A2 voor de onderdelen Lezen en Schrijven indien de inburgeringsplichtige geen oudkomer is in de zin van
      [artikel 1, eerste lid, onderdeel c, van de wet][ref1];

      b. niveau 2, respectievelijk niveau A2, voor de onderdelen Luisteren en Spreken, en niveau 1, respectievelijk
      niveau A1, voor de onderdelen Lezen en Schrijven indien de inburgeringsplichtige oudkomer is in de zin van
      [artikel 1, eerste lid, onderdeel c, van de wet][ref2].

      2 Om tot vrijstelling te kunnen leiden, dient de verklaring de volgende gegevens te bevatten:

      a. de naam van het document;

      b. de naam en handtekening van de verantwoordelijke van het regionaal opleidingencentrum;

      c. de echtheidskenmerken van het regionaal opleidingencentrum;

      d. de naam en geboortedatum van de deelnemer aan het NT2-taaltraject die overeenkomen met de naam en geboortedatum
      zoals vermeld op zijn identiteitsdocument;

      e. de behaalde taalniveaus uitgesplitst naar de vier taalvaardigheden Lezen, Schrijven, Luisteren en Spreken;

      f. de datum waarop de toetsresultaten zijn behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel1
    url: https://wetten.overheid.nl/BWBR0020657/2012-01-01#Artikel2.2a
