  - number: '12'
    text: |-
      1 Onze Minister zendt binnen twee jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over
      de effecten van deze wet in de praktijk.

      2 Onze Minister zendt binnen vier jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over
      de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0049307/2024-01-31#Artikel12
  - number: '13'
    text: |-
      1 Op het tijdstip van inwerkingtreding van de [artikelen 1 tot en met 11][ref1] van deze wet, maakt Onze Minister
      bekend aan hoeveel opvangplaatsen voor asielzoekers in de daarop volgende twee jaren naar verwachting behoefte
      zal zijn.

      2 Met toepassing van [artikel 3][ref2] wordt een indicatieve verdeling naar het benodigde aantal opvangplaatsen per
      gemeente bepaald.

      3 Onze Minister verstrekt uiterlijk vier maanden na inwerkingtreding van de [artikelen 1 tot en met 11][ref3] van
      deze wet de gemeente een specifieke uitkering voor iedere duurzaam ter beschikking gestelde opvangplaats waarmee
      het met toepassing van het tweede lid bepaalde aantal wordt overschreden. De gemeente kan de uitkering besteden aan
      een ander doel dan de bij of krachtens deze wet gevorderde uitvoering.

      4 Bij regeling van Onze Minister kunnen regels worden gesteld over de in het derde lid bedoelde uitkeringen aan
      gemeenten.


      [ref1]: https://wetten.overheid.nl/BWBR0049307#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0049307#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0049307#Artikel1
