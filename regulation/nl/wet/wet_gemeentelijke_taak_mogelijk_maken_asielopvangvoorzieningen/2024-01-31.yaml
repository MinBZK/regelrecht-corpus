preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om regels te stellen een wettelijke taak van gemeenten
    om opvangvoorzieningen voor asielzoekers mogelijk te maken ten behoeve van een stabiel en wendbaar stelsel van
    asielopvang om daarmee aan internationaalrechtelijke verplichtingen te voldoen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0049307/2024-01-31#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder verstaan onder:

        - *asielzoeker:* een vreemdeling wiens vrijheid niet rechtens is ontnomen en door wie of ten behoeve van wie een
      asielaanvraag is ingediend;
        - *COA:* Centraal Orgaan opvang asielzoekers, bedoeld in
      [artikel 2 van de Wet Centraal Orgaan opvang asielzoekers][ref1];
        - *college:* college van burgemeester en wethouders;
        - *Onze Minister:* Onze Minister van Justitie en Veiligheid;
        - *opvang:* de materiele en immateriële opvang van asielzoekers, bedoeld in
      [artikel 3, eerste lid, onderdeel a, van de Wet Centraal Orgaan opvang asielzoekers][ref2];
        - *opvangplaats:* een plaats bestemd voor de opvang van één asielzoeker in een opvangvoorziening;
        - *opvangvoorziening:* een accommodatie waarin door of onder verantwoordelijkheid van het COA onderscheidenlijk
      door of onder verantwoordelijkheid van het college opvang wordt geboden aan asielzoekers.


      [ref1]: https://wetten.overheid.nl/BWBR0006685#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006685#Artikel3
    url: https://wetten.overheid.nl/BWBR0049307/2024-01-31#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006685
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006685
        artikel: '3'
  - number: '2'
    text: |-
      1 Onze Minister maakt eens in de twee jaren voor 1 februari van het kalenderjaar bekend aan hoeveel opvangplaatsen
      voor asielzoekers in de daarop volgende twee jaren naar verwachting behoefte zal zijn. Deze raming komt tot stand
      op een bij of krachtens algemene maatregel van bestuur te bepalen wijze.

      2 De raming, bedoeld in het eerste lid, kan tussentijds worden gewijzigd.

      3 Het aantal opvangplaatsen dat beschikbaar moet worden gesteld wordt voor 1 februari bekendgemaakt. Het benodigd
      aantal opvangplaatsen wordt onderdeel van de in [artikel 3][ref1] bedoelde provinciale opvangopgave. Op het aantal
      opvangplaatsen dat in een provincie beschikbaar moet worden gesteld wordt het aantal plaatsen dat voor vijf jaar
      of langer beschikbaar is of in de daaropvolgende twaalf maanden voor die periode beschikbaar zal komen in mindering
      gebracht. Daarbij wordt uitgegaan van locaties of accommodaties van een bij of krachtens algemene maatregel van
      bestuur te bepalen minimale omvang.


      [ref1]: https://wetten.overheid.nl/BWBR0049307#Artikel3
    url: https://wetten.overheid.nl/BWBR0049307/2024-01-31#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0049307
        artikel: '3'
        hoofdstuk: '2'
  - number: '3'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur wordt vastgesteld hoe de verdeling van het benodigd aantal
      opvangplaatsen over alle provincies wordt bepaald en hoe een indicatieve verdeling naar het benodigde aantal
      opvangplaatsen per gemeente wordt bepaald. De verdeling is gebaseerd op het aantal inwoners van de betreffende
      gemeente en op de Sociaaleconomische status – Welvaart, Opleiding en Arbeidsscore (SES-WOA-score) op
      gemeenteniveau, waarbij deze score wordt bepaald aan de hand van de meest recente «SES-WOA-score per gemeente» van
      het CBS. Bij de verdeling kan worden bepaald dat een gedeelte van de opvangplaatsen van bijzondere aard moet zijn.

      2 Onze Minister maakt eens in de twee jaren voor 1 februari van het kalenderjaar de verdeling over alle provincies
      bekend alsmede de indicatieve verdeling per gemeente.
    url: https://wetten.overheid.nl/BWBR0049307/2024-01-31#Artikel3
  - number: '4'
    text: |-
      1 Colleges, gedeputeerde staten en het COA werken samen bij de uitvoering van taken op grond van deze wet en
      overleggen over de verdeling van opvangplaatsen als bedoeld in [artikel 3][ref1] voor de daarop volgende twee
      jaren. Het overleg vindt plaats onder voorzitterschap van de commissaris van de Koning.

      2 De commissaris van de Koning brengt eens in de twee jaren voor 1 november van het kalenderjaar aan Onze Minister
      een verslag uit van het overleg.

      3 De commissaris van de Koning verricht de werkzaamheden, genoemd in het eerste en tweede lid, volgens een door de
      regering gegeven ambtsinstructie.


      [ref1]: https://wetten.overheid.nl/BWBR0049307#Artikel3
    url: https://wetten.overheid.nl/BWBR0049307/2024-01-31#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0049307
        artikel: '3'
        hoofdstuk: '2'
  - number: '5'
    text: |-
      1 Onze Minister neemt eens in de twee jaren voor 31 december van het kalenderjaar een verdeelbesluit, per
      provincie, waarin de benodigde opvangplaatsen per provincie, bedoeld in [artikel 3][ref1], voor de duur van twee
      daarop volgende kalenderjaren voor asielzoekers over de in het besluit aangewezen gemeenten worden verdeeld.

      2 Bij het verdeelbesluit slaat Onze Minister acht op het verslag, bedoeld in [artikel 4, tweede lid][ref2], en
      streeft hij naar een zo evenwichtig mogelijke verdeling over het grondgebied van Nederland. Hij houdt bij die
      verdeling zo veel mogelijk rekening met de Sociaaleconomische status – Welvaart, Opleiding en Arbeidsscore (SES-
      WOA-score) op gemeenteniveau, waarbij deze score wordt bepaald aan de hand van de meest recente «SES-WOA-score per
      gemeente» van het CBS.

      3 Het verdeelbesluit kan bij bijzondere omstandigheden tussentijds worden gewijzigd. Bij een ingrijpende wijziging
      zijn de [artikelen 3][ref3] en [4][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0049307#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0049307#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0049307#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0049307#Artikel4
    url: https://wetten.overheid.nl/BWBR0049307/2024-01-31#Artikel5
