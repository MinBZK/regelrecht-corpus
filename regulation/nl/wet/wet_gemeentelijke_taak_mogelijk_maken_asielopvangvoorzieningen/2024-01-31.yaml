  - number: '6'
    text: |-
      1 Het college van een aangewezen gemeente draagt binnen de termijn van twee jaar, bedoeld in
      [artikel 5, eerste lid][ref1], zorg voor het mogelijk maken van opvangvoorzieningen voor asielzoekers in de
      gemeente overeenkomstig het verdeelbesluit.

      2 Opvangvoorzieningen voldoen op het tijdstip van ingebruikneming aan de krachtens de [Wet COA][ref2] gestelde
      wettelijke vereisten voor een opvangvoorziening en overige wettelijke vereisten voor een gebouw met een
      woonfunctie.


      [ref1]: https://wetten.overheid.nl/BWBR0049307#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006685
    url: https://wetten.overheid.nl/BWBR0049307/2024-01-31#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0049307
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0006685
  - number: '7'
    text: |-
      1 Het college van een aangewezen gemeente draagt zorg voor:

      a. ter beschikkingstelling aan het COA van een locatie of accommodatie binnen zes maanden na bekendmaking van het
      verdeelbesluit of de in het verdeelbesluit opgenomen langere termijn;

      b. verlening van de voor ingebruikneming van de opvangvoorziening noodzakelijke gemeentelijke vergunningen door
      het college.

      2 De raad van een aangewezen gemeente draagt zorg voor aanpassing van het bestemmingsplan of de beheersverordening
      indien dit noodzakelijk is voor ingebruikneming van de opvangvoorziening.
    url: https://wetten.overheid.nl/BWBR0049307/2024-01-31#Artikel7
  - number: '8'
    text: |-
      Indien zich feiten of omstandigheden voordoen die maken dat de terbeschikkingstelling, bedoeld in
      [artikel 7, eerste lid, onder a][ref1], of vergunningverlening, bedoeld in artikel 7, eerste lid, onder b, naar
      verwachting niet tijdig kan worden gerealiseerd, maakt het college hier onverwijld melding van aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0049307#Artikel7
    url: https://wetten.overheid.nl/BWBR0049307/2024-01-31#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0049307
        artikel: '7'
        hoofdstuk: '3'
  - number: '9'
    text: |-
      1 Onze Minister kan een specifieke uitkering aan gemeenten verstrekken ter bekostiging van de kosten die
      voortvloeien uit de uitvoering van deze wet.

      2 Bij regeling van Onze Minister kan een specifieke uitkering worden verstrekt voor:

      a. opvangplaatsen van bijzondere aard, en

      b. op verzoek van een gemeente voor iedere opvangplaats waarmee een bij of krachtens algemene maatregel van bestuur
      bepaald aantal opvangplaatsen binnen een bepaalde periode wordt overschreden, uitgaande van een bepaald minimaal
      aantal opvangplaatsen en een minimale beschikbaarheid in tijd van deze opvangplaatsen.

      De gemeente kan de uitkering besteden aan een ander doel dan de bij of krachtens deze wet gevorderde uitvoering.

      3 Na ommekomst van de in [artikel 2][ref1] bedoelde periode van twee jaar verstrekt Onze Minister de provincie en
      gemeenten een specifieke uitkering voor iedere opvangplaats waarmee 75% van het in [artikel 3, eerste lid][ref2],
      bedoelde aantal opvangplaatsen in de provincie is overschreden. De opvangplaatsen waarvoor met toepassing van
      het tweede lid op verzoek van een gemeente een specifieke uitkering is verstrekt, zijn daarvan uitgesloten. De
      uitkering wordt verdeeld tussen de provincie en, naar rato van het aantal geboden plaatsen, de gemeenten die
      opvangplaatsen hebben geboden en hebben voldaan aan de in [artikel 5, eerste lid][ref3], bedoelde taak. Provincie
      en gemeente kunnen de uitkering besteden aan een ander doel dan de bij of krachtens deze wet gevorderde uitvoering.

      4 Bij regeling van Onze Minister kunnen regels worden gesteld over de in het eerste en derde lid bedoelde
      uitkeringen aan provincies en gemeenten.


      [ref1]: https://wetten.overheid.nl/BWBR0049307#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0049307#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0049307#Artikel5
