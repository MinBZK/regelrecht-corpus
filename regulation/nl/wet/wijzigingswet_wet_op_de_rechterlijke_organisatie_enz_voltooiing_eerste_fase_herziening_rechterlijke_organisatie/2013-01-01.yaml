    text: |-
      Tegen een op of na de datum van inwerkingtreding van deze wet bekendgemaakte beslissing in een geschil dat aan de
      beslissing van de Kroon is onderworpen, kan geen beroep worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0006328/2013-01-01#ArtikelIA
  - number: IB.1
    text: |-
      Tegen een op of na de datum van inwerkingtreding van deze wet bekendgemaakte beslissing
      van gedeputeerde staten op grond van de [artikelen 41 van de Algemene Bijstandswet][ref1],
      [44 van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2] en
      [44 van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3] zoals
      deze luidden voor dat tijdstip, kan beroep worden ingesteld bij de Centrale Raad van Beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0004163#Artikel44
