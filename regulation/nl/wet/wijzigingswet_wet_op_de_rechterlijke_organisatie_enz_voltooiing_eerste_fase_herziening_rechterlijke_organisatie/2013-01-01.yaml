preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is ter voltooiing van de eerste fase van de herziening
    van de rechterlijke organisatie bij de arrondissementsrechtbanken enkelvoudige en meervoudige kamers voor het
    behandelen en beslissen van bestuursrechtelijke zaken in eerste aanleg in te stellen, bestuursrechtspraak in
    twee instanties in te voeren voor een groot aantal bestuursrechtelijke zaken die thans nog in één instantie
    worden behandeld en beslist, definitieve voorzieningen in kroongeschillen te treffen, een algemene regeling
    van het bestuursprocesrecht in de Algemene wet bestuursrecht op te nemen, en dat het wenselijk is met het
    oog op de invoering van de eerste tranche van de Algemene wet bestuursrecht een aantal wetten daaraan aan te
    passen, en dat het derhalve nodig is een groot aantal wetten te wijzigen en de Wet administratieve rechtspraak
    overheidsbeschikkingen in te trekken;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006328/2013-01-01#ArtikelAanhef
articles:
  - number: I.1
    text: |-
      Ten aanzien van het nemen van besluiten die zijn aangevraagd voor de datum van inwerkingtreding van deze wet en
      ambtshalve te nemen besluiten die binnen dertien weken na dat tijdstip zijn bekendgemaakt, blijft het recht zoals
      het gold voor dat tijdstip van toepassing.
    url: https://wetten.overheid.nl/BWBR0006328/2013-01-01#ArtikelI
  - number: I.2
    text: |-
      Ten aanzien van de mogelijkheid om bezwaar te maken of beroep in te stellen tegen een besluit dat voor de datum van
      inwerkingtreding van deze wet is bekendgemaakt, blijft het recht zoals het gold voor dat tijdstip van toepassing,
      met dien verstande dat de Afdeling bestuursrechtspraak in de plaats treedt van de Afdeling voor de geschillen van
      bestuur of de Afdeling rechtspraak van de Raad van State. De eerste volzin is van overeenkomstige toepassing ten
      aanzien van de mogelijkheid om hoger beroep of beroep in cassatie in te stellen.
    url: https://wetten.overheid.nl/BWBR0006328/2013-01-01#ArtikelI
  - number: I.3
    text: |-
      Ten aanzien van de behandeling van bezwaar of beroep dat voor de datum van inwerkingtreding van deze wet is
      gemaakt onderscheidenlijk is ingesteld, blijft behoudens het zesde en zevende lid het recht zoals het gold voor
      dat tijdstip van toepassing, met dien verstande dat de Afdeling bestuursrechtspraak in de plaats treedt van de
      Afdeling voor de geschillen van bestuur of de Afdeling rechtspraak van de Raad van State. De eerste volzin is van
      overeenkomstige toepassing ten aanzien van de behandeling van hoger beroep of beroep in cassatie.
    url: https://wetten.overheid.nl/BWBR0006328/2013-01-01#ArtikelI
  - number: I.4
    text: |-
      Ten aanzien van de behandeling van een geschil dat aan de beslissing van de Kroon is onderworpen en dat op of
      na het tijdstip van inwerkingtreding van deze wet aanhangig is gemaakt, blijft het recht zoals het gold voor dat
      tijdstip van toepassing.
    url: https://wetten.overheid.nl/BWBR0006328/2013-01-01#ArtikelI
  - number: I.5
    text: |-
      Ten aanzien van de behandeling van bezwaar of beroep dat op of na de datum van inwerkingtreding van deze wet is
      gemaakt onderscheidenlijk is ingesteld en dat is gericht tegen een besluit waartegen voor dat tijdstip eveneens
      bezwaar is gemaakt onderscheidenlijk beroep is ingesteld, blijft behoudens het zesde en zevende lid het recht zoals
      het gold voor dat tijdstip van toepassing. De eerste volzin is van overeenkomstige toepassing ten aanzien van de
      behandeling van hoger beroep of beroep in cassatie.
    url: https://wetten.overheid.nl/BWBR0006328/2013-01-01#ArtikelI
  - number: I.6
    text: |-
      Ten aanzien van de verdere behandeling van beroep dat voor de datum van inwerkingtreding van deze wet is ingesteld
      bij de rechtbank, is het recht zoals het geldt vanaf dat tijdstip van toepassing, met dien verstande dat ten
      aanzien van de heffing van griffierecht en de mogelijkheid van een verzoek om een voorlopige voorziening het
      recht zoals het gold voor dat tijdstip van toepassing is. Indien op de datum van inwerkingtreding van deze wet
      partijen zijn uitgenodigd om op een zitting van de rechtbank te verschijnen, partijen schriftelijk toestemming
      hebben gegeven voor het achterwege blijven van het onderzoek ter zitting dan wel het beroep bij beschikking wordt
      afgedaan, blijft behoudens het zevende lid het recht zoals het gold voor dat tijdstip van toepassing.
    url: https://wetten.overheid.nl/BWBR0006328/2013-01-01#ArtikelI
  - number: I.7
    text: |-
      De [artikelen 8:75][ref1] en [8:75a van de Algemene wet bestuursrecht][ref2],
      [39a van de Wet op de Raad van State][ref3], [21a van de Beroepswet][ref4], 5a, 5aa en 25a van de Wet
      administratieve rechtspraak belastingzaken en 11b en 11c van de Tariefcommissiewet zijn van toepassing ten aanzien
      van de behandeling van beroep, hoger beroep of beroep in cassatie dat voor de datum van inwerkingtreding van deze
      wet is ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002367#Artikel39a
      [ref4]: https://wetten.overheid.nl/BWBR0002170#Artikel21a
    url: https://wetten.overheid.nl/BWBR0006328/2013-01-01#ArtikelI
