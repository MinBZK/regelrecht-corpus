  - number: II
    text: |-
      De bezoldiging van de staatsraden die op de datum voor de inwerkingtreding van deze wet het ambt van voorzitter
      van de Afdeling voor de geschillen van bestuur onderscheidenlijk voorzitter van de Afdeling rechtspraak van de
      Raad van State vervulden, wordt bepaald op hetzelfde bedrag als de bezoldiging van de voorzitter van de Afdeling
      bestuursrechtspraak.
    url: https://wetten.overheid.nl/BWBR0006328/2013-01-01#ArtikelII
