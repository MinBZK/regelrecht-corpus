---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: tijdelijke_subsidieregeling_stimuleren_leeftijdsbewust_beleid
regulatory_layer: WET
publication_date: '2004-11-02'
valid_from: '2008-01-01'
bwb_id: BWBR0017328
url: https://wetten.overheid.nl/BWBR0017328/2008-01-01
preamble:
  text: |-
    Gelet op de artikelen 3, eerste lid, en 5, van de Kaderwet SZW-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel1
  - number: 1.a
    text: 'de minister: de minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel1
  - number: 1.b
    text: 'werknemer: de natuurlijke persoon, die in privaatrechtelijke of in publiekrechtelijke dienstbetrekking staat;'
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel1
  - number: 1.c
    text: 'werkgever: de natuurlijke persoon of rechtspersoon waarbij werknemers in dienstbetrekking werkzaam zijn;'
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel1
  - number: 1.d
    text: 'aanvrager: de aanvrager van projectsubsidie;'
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel1
  - number: 1.e
    text: |-
      aanvraagtijdvak: een door de minister vastgesteld tijdvak als bedoeld in [artikel 4][ref1] waarbinnen aanvragen om
      projectsubsidie kunnen worden ingediend;


      [ref1]: https://wetten.overheid.nl/BWBR0017328#Artikel4
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0017328
        artikel: '4'
  - number: 1.f
    text: |-
      brancheorganisatie: een organisatie, die rechtspersoonlijkheid bezit, die belangen behartigt van ondernemers in een
      zelfde bedrijfstak of samenhangend gedeelte daarvan;
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel1
  - number: 1.g
    text: |-
      bedrijfstakorganisatie: een voor een bedrijfstak representatieve organisatie van werkgevers of werknemers, die
      rechtspersoonlijkheid bezit en in een collectieve arbeidsovereenkomst is opgenomen;
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel1
  - number: 1.h
    text: |-
      leeftijdsbewust beleid: beleid bij werkgevers waarin projecten ontwikkeld of uitgevoerd worden die tot doel hebben
      te voorkomen dat werknemers vanwege hun leeftijd voortijdig het arbeidsproces verlaten;
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel1
  - number: 1.i
    text: |-
      Opleidings- en Ontwikkelingsfonds voor een bedrijfstak: door werkgevers en werknemers in het leven geroepen, dan
      wel beheerd, samenwerkingsverband per bedrijfstak, dat is opgenomen in een collectieve arbeidsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel1
  - number: '2.1'
    text: |-
      De Minister verleent op aanvraag aan de volgende aanvragers subsidie voor de kosten van projecten die gericht zijn
      op het bevorderen van leeftijdsbewust beleid:
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel2
  - number: 2.1.a
    text: een brancheorganisatie;
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel2
  - number: 2.1.b
    text: een bedrijfstakorganisatie;
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel2
  - number: 2.1.c
    text: 'een Opleidings- en Ontwikkelingsfonds voor een bedrijfstak, indien:'
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel2
  - number: 2.1.c.1°
    text: |-
      het in [artikel 1, onderdeel i][ref1], bedoelde samenwerkingsverband een stichting als bedoeld in
      [artikel 285, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2] is;


      [ref1]: https://wetten.overheid.nl/BWBR0017328#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel285
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017328
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '285'
  - number: 2.1.c.2°
    text: |-
      het bestuur van deze stichting bevoegd is te besluiten tot het aangaan van overeenkomsten tot verkrijging,
      vervreemding en bezwaring van registergoederen, en tot het aangaan van overeenkomsten waarbij de stichting zich als
      borg of hoofdelijk medeschuldenaar verbindt, zich voor een derde sterk maakt of zich tot zekerheidstelling voor een
      schuld van een ander verbindt;
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel2
  - number: 2.1.c.3°
    text: |-
      het doel van het Opleidings- en Ontwikkelingsfonds voor een bedrijfstak helder afgebakend is en blijkens de
      statuten in ieder geval bestaat uit het vertegenwoordigen van personeelsbelangen;
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel2
  - number: 2.1.c.4°
    text: |-
      het aannemelijk is dat het Opleidings- en Ontwikkelingsfonds voor een bedrijfstak niet in betalingsonmacht
      verkeert.
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel2
  - number: '2.2'
    text: De subsidie wordt verstrekt aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel2
  - number: '3'
    text: |-
      De subsidie, bedoeld in [artikel 2, eerste lid][ref1], wordt slechts verstrekt voor projecten die zich
      richten op het verspreiden of verder bevorderen van leeftijdsbewust beleid bij bedrijven wier belangen door
      de aanvragende brancheorganisatie worden behartigd dan wel bedrijven die zijn aangesloten bij de aanvragende
      bedrijfstakorganisatie of het aanvragende Opleidings- en Ontwikkelingsfonds voor een bedrijfstak, en waarvan de
      effecten nog tenminste tot twee jaar na afloop van het project merkbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0017328#Artikel2
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0017328
        artikel: '2'
  - number: '4.1'
    text: |-
      De mogelijkheid tot het indienen van aanvragen voor projectsubsidie bestaat slechts gedurende door de Minister
      vastgestelde aanvraagtijdvakken, gelegen in de periode 2004 tot en met 2008.
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel4
  - number: '4.2'
    text: 'Aanvragen voor projecten voor de aanvraagronde 2007–2008 kunnen worden ingediend in de volgende aanvraagtijdvakken:'
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel4
  - number: 4.2.a
    text: het eerste aanvraagtijdvak loopt van 1 maart 2007 tot en met 1 mei 2007;
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel4
  - number: 4.2.b
    text: het tweede aanvraagtijdvak loopt van 3 maart 2008 tot en met 29 april 2008.
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel4
  - number: '4.3'
    text: |-
      Subsidie wordt voor het eerste aanvraagtijdvak van aanvraagronde 2007–2008 slechts eenmaal aan dezelfde aanvrager
      verleend en voor het tweede aanvraagtijdvak van aanvraagronde 2007–2008 ten hoogste driemaal aan dezelfde aanvrager
      verleend.
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel4
  - number: '4.4'
    text: Subsidie wordt slechts verleend voor projecten met een duur van maximaal 12 maanden.
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel4
  - number: '5.1'
    text: Een aanvraag heeft steeds betrekking op één project.
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel5
  - number: '5.2'
    text: De aanvraag, bedoeld in het eerste lid, gaat vergezeld van een begroting.
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel5
  - number: '5.3'
    text: |-
      De aanvrager maakt bij de indiening gebruik van het daarvoor door de minister verstrekte formulier dat is ingericht
      overeenkomstig het model van [bijlage 1][ref1] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0017328
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0017328
  - number: '5.4'
    text: |-
      Met betrekking tot de projecten voor het tweede aanvraagtijdvak van aanvraagronde 2007–2008 geldt dat deze
      projecten betrekking hebben op het verspreiden of verder bevorderen van beleidsinstrumenten op het gebied van
      het verhogen van de duurzame inzetbaarheid van werknemers en in het bijzonder gericht zijn op een van de volgende
      thema’s:
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel5
  - number: 5.4.a
    text: |-
      Communicatie en voorlichting: het anders dan door ontwikkeling van beleidsinstrumenten vergroten van bewustwording
      van leeftijdsbewust personeelsbeleid of het uitwisselen van ervaring, kennis en informatie over leeftijdsbewust
      personeelsbeleid;
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel5
  - number: 5.4.b
    text: |-
      Verantwoordelijkheid werknemer: stimuleren van de discussie over de inhoud van de eigen verantwoordelijkheid van de
      werknemer bij leeftijdsbewust beleid in verhouding tot de verantwoordelijkheid van de werkgever;
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel5
  - number: 5.4.c
    text: |-
      Ontziemaatregelen: onderzoeken van problemen die kunnen ontstaan wanneer ontziemaatregelen worden vervangen door
      preventiemaatregelen en het formuleren van verbeteringen op dit terrein;
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel5
  - number: 5.4.d
    text: |-
      Taak- en functieroulatie: stimuleren van mobiliteit door het gebruikmaken en ontwikkelen van taak- en
      functieroulatie;
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel5
  - number: 5.4.e
    text: |-
      Blijven ontwikkelen: ondersteunen van het opzetten door bedrijven van activiteiten die bijdragen aan permanente
      ontwikkeling van lager opgeleide oudere werknemers; of
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel5
  - number: 5.4.f
    text: |-
      Instrumenten voor kleine bedrijven: aanbieden van faciliteiten en hulp aan kleinere bedrijven om leeftijdsbewust
      personeelsbeleid te bevorderen.
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel5
  - number: '5.5'
    text: Op een aanvraag wordt uiterlijk 12 weken na het sluiten van een aanvraagtijdvak beslist.
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel5
  - number: '6.1'
    text: 'Een projectaanvraag wordt afgewezen, indien:'
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel6
  - number: 6.1.a
    text: de aanvraag of het voor subsidie aangemelde project niet voldoet aan de in deze regeling gestelde eisen;
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel6
  - number: 6.1.b
    text: |-
      de ontwikkeling of uitvoering van het project onvoldoende met de in [bijlage 1][ref1] van deze regeling vermelde
      bewijsstukken wordt aangetoond;


      [ref1]: https://wetten.overheid.nl/BWBR0017328
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0017328
  - number: 6.1.c
    text: |-
      het een project als bedoeld in [artikel 5, vierde lid, aanhef en onderdeel b][ref1], betreft en dat project niet
      resulteert in een overzicht van voorwaarden waaraan werknemers en werkgevers dienen te voldoen om te zorgen dat de
      werknemer zijn verantwoordelijkheid neemt;


      [ref1]: https://wetten.overheid.nl/BWBR0017328#Artikel5
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0017328
        artikel: '5'
  - number: 6.1.d
    text: |-
      het een project als bedoeld in [artikel 5, vierde lid, aanhef en onderdeel c of d][ref1], betreft waarbij geen
      implementatieplan is inbegrepen waarin beschreven staat hoe men verbeteringen tot stand kan brengen; of


      [ref1]: https://wetten.overheid.nl/BWBR0017328#Artikel5
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0017328
        artikel: '5'
  - number: 6.1.e
    text: |-
      het een project als bedoeld in [artikel 5, vierde lid, aanhef en onderdeel e][ref1], betreft en de subsidie
      gebruikt wordt voor het verzorgen van scholing.


      [ref1]: https://wetten.overheid.nl/BWBR0017328#Artikel5
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0017328
        artikel: '5'
  - number: '6.2'
    text: |-
      Alle projectaanvragen die door dezelfde aanvrager zijn ingediend in het tweede aanvraagtijdvak, bedoeld in
      [artikel 4, eerste lid, onderdeel b][ref1], worden afgewezen, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0017328#Artikel4
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0017328
        artikel: '4'
  - number: 6.2.a
    text: door deze aanvrager meer dan drie aanvragen worden ingediend in dat tweede aanvraagtijdvak; of
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel6
  - number: 6.2.b
    text: |-
      door deze aanvrager twee of meer aanvragen in dat tweede aanvraagtijdvak worden ingediend met betrekking tot
      hetzelfde thema.
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel6
  - number: '7.1'
    text: Voor projecten is in de aanvraagronde 2007–2008 in totaal een budget beschikbaar van € 6,45 miljoen.
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel7
  - number: '7.2'
    text: 'Voor de verdeling van het beschikbare budget wordt de volgende verdeelsleutel gehanteerd:'
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel7
  - number: 7.2.a
    text: voor het eerste aanvraagtijdvak bedraagt het subsidieplafond € 3,15 miljoen;
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel7
  - number: 7.2.b
    text: voor het tweede aanvraagtijdvak bedraagt het subsidieplafond € 3,3 miljoen.
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel7
  - number: '7.3'
    text: |-
      Voor het bepalen van het bereiken van het subsidieplafond in een aanvraagtijdvak worden aanvragen in volgorde
      van datum van binnenkomst behandeld, waarbij alleen volledige aanvragen in behandeling worden genomen. Van een
      volledige aanvraag is sprake indien wordt voldaan aan [artikel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017328#Artikel5
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017328
        artikel: '5'
  - number: '7.4'
    text: |-
      Wanneer een onvolledige aanvraag wordt geretourneerd geldt als datum van binnenkomst de datum van ontvangst van de
      volledige aanvraag.
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel7
  - number: '7.5'
    text: |-
      Indien toekenning van aanvragen die op dezelfde datum zijn binnengekomen leidt tot overschrijding van het
      subsidieplafond, wordt, in afwijking van het derde lid, met betrekking tot die aanvragen de volgorde door loting
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel7
  - number: 7a.1
    text: |-
      Indien 25% van het voor het tweede aanvraagtijdvak, bedoeld in [artikel 4, eerste lid, onderdeel b][ref1],
      vastgestelde subsidieplafond is aangevraagd ten behoeve van eenzelfde thema, laat de Minister daarna binnengekomen
      aanvragen ten behoeve van eenzelfde thema tot uiterlijk twaalf weken na het sluiten van het aanvraagtijdvak buiten
      behandeling.


      [ref1]: https://wetten.overheid.nl/BWBR0017328#Artikel4
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0017328
        artikel: '4'
  - number: 7a.2
    text: |-
      Het besluit om een aanvraag tijdelijk buiten behandeling te laten wordt aan de aanvrager bekendgemaakt uiterlijk
      vier weken na sluiting van het aanvraagtijdvak.
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel7a
  - number: 7a.3
    text: |-
      Uiterlijk vier weken na afloop van de periode waarin een aanvraag buiten behandeling is gelaten, wordt op die
      aanvraag beslist. Daarbij worden de aanvragen die buiten behandeling zijn gelaten behandeld in volgorde van
      binnenkomst, onmiddellijk volgend op de laatste volledige aanvraag in de volgorde van binnenkomst van de aanvragen
      die niet buiten behandeling zijn gelaten.
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel7a
  - number: '8.1'
    text: |-
      Uitsluitend begrote kosten die verband houden met de realisatie van activiteiten en die voor de ontwikkeling of
      uitvoering van het project als noodzakelijk en ten laste van de aanvrager te blijven kosten zijn aan te merken,
      komen voor subsidiëring in aanmerking.
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel8
  - number: '8.2'
    text: 'Kosten voor het verspreiden van resultaten komen voor subsidie in aanmerking tot een maximum van:'
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel8
  - number: 8.2.a
    text: |-
      100% van de in de beschikking tot subsidieverlening opgenomen, voor subsidie in aanmerking komende kosten, voor
      zover het gaat om een project als bedoeld in [artikel 5, vierde lid, aanhef en onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017328#Artikel5
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0017328
        artikel: '5'
  - number: 8.2.b
    text: |-
      10% van de in de beschikking tot subsidieverlening opgenomen, voor subsidie in aanmerking komende kosten, voor
      zover het gaat om een project als bedoeld in [artikel 5, vierde lid, aanhef en onderdeel b, c, d, e of f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017328#Artikel5
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0017328
        artikel: '5'
  - number: '8.3'
    text: |-
      Geen subsidie wordt verleend voor begrote kosten van projecten die voor de datum van subsidieverlening ten behoeve
      van het project zijn ontwikkeld of uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel8
  - number: '9'
    text: |-
      De aan de aanvrager te verlenen voorlopige en maximale subsidie wordt gebaseerd op de in de projectbegroting
      opgenomen kosten die gemoeid zijn met de realisatie van het project. De Minister verleent een lagere subsidie
      dan de in de projectbegroting opgenomen, indien de projectbegroting hem niet realistisch voorkomt. De subsidie
      wordt door de minister vastgesteld aan de hand van de mate van realisatie van het in de aanvraag, bedoeld in
      [artikel 5][ref1], genoemde project. De subsidie bedraagt maximaal € 40.000,– per project.


      [ref1]: https://wetten.overheid.nl/BWBR0017328#Artikel5
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0017328
        artikel: '5'
  - number: '10'
    text: |-
      Aan de aanvrager wordt een voorschot op de projectsubsidie verleend. Het voorschot bedraagt 80% van het in de
      beschikking tot subsidieverlening vermelde bedrag.
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel10
  - number: '11'
    text: |-
      In afwijking van [artikel 14 van de Algemene Regeling SZW-subsidies][ref1] wordt een verantwoording ingediend onder
      gebruikmaking van een formulier overeenkomstig het model van [bijlage 2][ref2] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009211#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0017328
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009211
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0017328
  - number: '12.1'
    text: |-
      De aanvrager verleent in overleg met de minister medewerking aan door de minister georganiseerde publicitaire en
      voorlichtingsactiviteiten gericht op de media, potentiële deelnemers, relevante organisaties en het grote publiek.
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel12
  - number: '12.2'
    text: |-
      De aanvrager verleent medewerking aan de opstelling van evaluatierapporten met betrekking tot deze
      subsidieregeling, en zal, indien het gesubsidieerde project niet in eigen beheer wordt uitgevoerd, zorgdragen dat
      de feitelijke uitvoerder van het project deze medewerking verleent.
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel12
  - number: '13.1'
    text: Deze regeling treedt in werking met ingang van 1 december 2004 en vervalt met ingang van 1 januari 2012.
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel13
  - number: '13.2'
    text: |-
      De regeling, zoals die onmiddellijk voor de datum waarop deze vervalt geldt, blijft van toepassing op de financiële
      afwikkeling van de subsidie.
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel13
  - number: '13.3'
    text: |-
      Deze regeling, zoals die luidde op 19 december 2006, blijft van toepassing op subsidies verleend voorafgaande aan
      20 december 2006.
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel13
  - number: '13.4'
    text: |-
      Deze regeling, zoals die luidde op 31 december 2007, blijft van toepassing op subsidies aangevraagd in het eerste
      aanvraagtijdvak van aanvraagronde 2007–2008.
    url: https://wetten.overheid.nl/BWBR0017328/2008-01-01#Artikel13
