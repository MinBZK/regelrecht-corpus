preamble:
  text: |-
    Gelet op de artikelen 3, eerste lid, en 5, van de Kaderwet SZW-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017328/2004-12-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. de minister: de minister van Sociale Zaken en Werkgelegenheid;

      b. werknemer: de natuurlijke persoon, die in privaatrechtelijke of in publiekrechtelijke dienstbetrekking staat;

      c. werkgever: de natuurlijke persoon of rechtspersoon waarbij werknemers in dienstbetrekking werkzaam zijn;

      d. aanvrager: de aanvrager van projectsubsidie;

      e. aanvraagtijdvak: een door de minister vastgesteld tijdvak als bedoeld in [artikel 4][ref1] waarbinnen aanvragen
      om projectsubsidie kunnen worden ingediend;

      f. brancheorganisatie: een organisatie, die rechtspersoonlijkheid bezit, die belangen behartigt van ondernemers in
      een zelfde bedrijfstak of samenhangend gedeelte daarvan;

      g. bedrijfstakorganisatie: een voor een bedrijfstak representatieve organisatie van werkgevers of werknemers, die
      rechtspersoonlijkheid bezit en in een collectieve arbeidsovereenkomst is opgenomen;

      h. leeftijdsbewust beleid: beleid bij werkgevers waarin projecten ontwikkeld of uitgevoerd worden die tot doel
      hebben te voorkomen dat werknemers vanwege hun leeftijd voortijdig het arbeidsproces verlaten.


      [ref1]: https://wetten.overheid.nl/BWBR0017328#Artikel4
    url: https://wetten.overheid.nl/BWBR0017328/2004-12-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0017328
        artikel: '4'
  - number: '2'
    text: |-
      1 De minister kan op aanvraag aan de volgende aanvragers subsidie verlenen voor de kosten van projecten die gericht
      zijn op het bevorderen van leeftijdsbewust beleid:

      a. een werkgever met ten minste 30 werknemers in dienstbetrekking;

      b. een brancheorganisatie die een aanvraag indient voor een of meer werkgevers met minder dan 30 werknemers in
      dienstbetrekking;

      c. een bedrijfstakorganisatie die een aanvraag indient voor een of meer werkgevers met minder dan 30 werknemers
      in dienstbetrekking.

      2 De subsidie wordt verstrekt aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0017328/2004-12-01#Artikel2
  - number: '3'
    text: |-
      De subsidie, bedoeld in [artikel 2, eerste lid][ref1], wordt slechts verstrekt voor projecten die tot doel
      hebben om werknemers ook op oudere leeftijd in staat te stellen door te blijven werken en daarmee een bijdrage te
      leveren aan het verhogen van arbeidsparticipatie en te voorkomen dat werknemers vanwege hun leeftijd voortijdig
      het arbeidsproces verlaten. De projecten in dit kader zijn gericht op verbetering van de positie van werknemers,
      waarbij rekening wordt gehouden met de specifieke omstandigheden en behoeften van werknemers in de verschillende
      fasen van hun loopbaan.


      [ref1]: https://wetten.overheid.nl/BWBR0017328#Artikel2
    url: https://wetten.overheid.nl/BWBR0017328/2004-12-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0017328
        artikel: '2'
  - number: '4'
    text: |-
      1 De mogelijkheid tot het indienen van aanvragen voor projectsubsidie bestaat slechts gedurende door de minister
      vastgestelde aanvraagtijdvakken, gelegen in de periode 2004 tot en met 2007.

      2 Aanvragen voor projecten voor de aanvraagronde 2004–2005 kunnen worden ingediend in de volgende
      aanvraagtijdvakken:

      a. het eerste aanvraagtijdvak loopt van 1 december 2004 tot en met 31 januari 2005;

      b. het tweede aanvraagtijdvak loopt van 1 juni 2005 tot en met 31 juli 2005.

      3 Een aanvrager kan per aanvraagtijdvak één aanvraag om projectsubsidie verleend krijgen.

      4 Subsidie wordt slechts verleend voor projecten met een duur van maximaal 12 maanden.
    url: https://wetten.overheid.nl/BWBR0017328/2004-12-01#Artikel4
  - number: '5'
    text: |-
      1 Een aanvraag heeft steeds betrekking op één project.

      2 De aanvraag, bedoeld in het eerste lid, gaat vergezeld van een begroting.

      3 De aanvrager maakt bij de indiening gebruik van het daarvoor door de minister verstrekte formulier dat is
      ingericht overeenkomstig het model van [bijlage 1][ref1] van deze regeling.

      4 Met betrekking tot de projecten voor de aanvraagronde 2004–2005 geldt dat deze projecten gericht zijn op:

      a. beeldvorming, bewustwording, agendasetting en voorlichting aan werkgevers, waaronder het management, en
      werknemers;

      b. het aanpassen, ontwikkelen of implementeren van beleidsinstrumenten, gericht op personeelsbeleid en verbetering
      van de positie van werknemers teneinde hen ook op oudere leeftijd in staat te stellen door te werken;

      5 Op een aanvraag wordt uiterlijk 12 weken na het sluiten van een aanvraagtijdvak beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0017328
    url: https://wetten.overheid.nl/BWBR0017328/2004-12-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0017328
  - number: '6'
    text: |-
      Een projectaanvraag wordt afgewezen:

      a. indien de aanvraag of het voor subsidie aangemelde project niet voldoet aan de in deze regeling gestelde eisen;

      b. indien de ontwikkeling of uitvoering van het project onvoldoende met de in [bijlage 1][ref1] van deze regeling
      vermelde bewijsstukken wordt aangetoond.


      [ref1]: https://wetten.overheid.nl/BWBR0017328
    url: https://wetten.overheid.nl/BWBR0017328/2004-12-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0017328
  - number: '7'
    text: |-
      1 Voor projecten is in de aanvraagronde 2004–2005 in totaal een budget beschikbaar van € 4,4 miljoen.

      2 Voor de verdeling van het beschikbare budget wordt de volgende verdeelsleutel gehanteerd:

      a. voor het eerste aanvraagtijdvak bedraagt het subsidieplafond € 1,76 miljoen;

      b. voor het tweede aanvraagtijdvak bedraagt het subsidieplafond € 2,64 miljoen.

      3 Voor de verdeling van het subsidieplafond in het tweede lid, onderdelen a en b, wordt de volgende verdeelsleutel
      gehanteerd:

      a. voor het eerste aanvraagtijdvak met betrekking tot de projecten, bedoeld
      in [artikel 5, vierde lid, onderdeel a][ref1], 75% en de projecten, bedoeld in
      [artikel 5, vierde lid, onderdeel b][ref2], 25%;

      b. voor het tweede aanvraagtijdvak met betrekking tot de projecten, bedoeld
      in [artikel 5, vierde lid, onderdeel a][ref3], 50% en de projecten, bedoeld in
      [artikel 5, vierde lid, onderdeel b][ref4], 50%.

      4 Voor de bepaling van het bereiken van het subsidieplafond, bedoeld in het tweede lid en de verdeling van het
      subsidieplafond, bedoeld in het derde lid, worden aanvragen op volgorde van binnenkomst behandeld, waarbij alleen
      volledige aanvragen in behandeling worden genomen. Van een volledige aanvraag is sprake indien wordt voldaan aan
      [artikel 5][ref5].

      5 Wanneer een onvolledige aanvraag wordt geretourneerd, geldt de datum van ontvangst van de volledige aanvraag voor
      de toepassing van het tweede of derde lid.

      6 De minister kan bij de verlening van de subsidie afwijken van de verdeelsleutels, bedoeld in het derde lid,
      onderdelen a of b, indien na afloop van een aanvraagtijdvak blijkt dat voor categorieën van projecten minder
      subsidie is aangevraagd dan daarvoor beschikbaar is, terwijl voor andere categorieën van projecten meer subsidie is
      aangevraagd dan daarvoor beschikbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0017328#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0017328#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0017328#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0017328#Artikel5
