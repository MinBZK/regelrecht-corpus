        artikel: '5'
  - number: '8'
    text: |-
      1 Uitsluitend begrote kosten die verband houden met de realisatie van activiteiten en die voor de ontwikkeling of
      uitvoering van het project als noodzakelijk en ten laste van de aanvrager te blijven kosten zijn aan te merken,
      komen voor subsidiëring in aanmerking.

      2 Geen subsidie wordt verleend voor begrote kosten van projecten die voor de datum van subsidieverlening ten
      behoeve van het project zijn ontwikkeld of uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0017328/2004-12-01#Artikel8
  - number: '9'
    text: |-
      De aan de aanvrager te verlenen voorlopige en maximale subsidie wordt gebaseerd op de in de projectbegroting
      opgenomen kosten die gemoeid zijn met de realisatie van het project. De minister kan een lagere subsidie verlenen
      dan de in de projectbegroting opgenomen, indien de projectbegroting hem niet realistisch voorkomt. De subsidie
      wordt door de minister vastgesteld aan de hand van de mate van realisatie van het in de aanvraag, bedoeld in
      [artikel 5][ref1], genoemde project. De subsidie bedraagt maximaal € 40.000,– per project.


      [ref1]: https://wetten.overheid.nl/BWBR0017328#Artikel5
    url: https://wetten.overheid.nl/BWBR0017328/2004-12-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0017328
        artikel: '5'
  - number: '10'
    text: |-
      Aan de aanvrager wordt een voorschot op de projectsubsidie verleend. Het voorschot bedraagt 80% van het in de
      beschikking tot subsidieverlening vermelde bedrag.
    url: https://wetten.overheid.nl/BWBR0017328/2004-12-01#Artikel10
  - number: '11'
    text: |-
      In afwijking van [artikel 14 van de Algemene Regeling SZW-subsidies][ref1] wordt een verantwoording ingediend onder
      gebruikmaking van een formulier overeenkomstig het model van [bijlage 2][ref2] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009211#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0017328
    url: https://wetten.overheid.nl/BWBR0017328/2004-12-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009211
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0017328
  - number: '12'
    text: |-
      1 De aanvrager verleent in overleg met de minister medewerking aan door de minister georganiseerde publicitaire en
      voorlichtingsactiviteiten gericht op de media, potentiële deelnemers, relevante organisaties en het grote publiek.

      2 De aanvrager verleent medewerking aan de opstelling van evaluatierapporten met betrekking tot deze
      subsidieregeling, en zal, indien het gesubsidieerde project niet in eigen beheer wordt uitgevoerd, zorgdragen dat
      de feitelijke uitvoerder van het project deze medewerking verleent.
    url: https://wetten.overheid.nl/BWBR0017328/2004-12-01#Artikel12
  - number: '13'
    text: |-
      1 Deze regeling treedt in werking met ingang van 1 december 2004 en vervalt met ingang van 1 januari 2010.

      2 De regeling, zoals die onmiddellijk voor de datum waarop deze vervalt geldt, blijft van toepassing op de
      financiële afwikkeling van de subsidie.
    url: https://wetten.overheid.nl/BWBR0017328/2004-12-01#Artikel13
