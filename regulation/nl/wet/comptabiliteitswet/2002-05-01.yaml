  - number: '5'
    text: |-
      1 De ramingen van de verplichtingen en de uitgaven enerzijds en die van de ontvangsten anderzijds worden opgenomen
      in afzonderlijke begrotingsartikelen.

      2 Een begrotingsartikel is de kleinste eenheid in een begroting. Het bevat mede een kernachtige omschrijving van
      het onderwerp waarop het betrekking heeft.

      3 Per begroting worden de begrotingsartikelen gegroepeerd naar hoofdbeleidsterreinen, zodanig dat elk
      hoofdbeleidsterrein een helder beeld geeft van de onderwerpen van beleid. Voor zover bepaalde begrotingsartikelen
      niet zinvol bij een hoofdbeleidsterrein kunnen worden ondergebracht, worden deze opgenomen in het
      hoofdbeleidsterrein "algemeen".

      4 Het bepaalde in het eerste lid is niet van toepassing op de ramingen van de uitgaven en de ontvangsten die op
      grond van het bepaalde in [artikel 23, vierde lid][ref1], in mindering zullen worden gebracht op ontvangsten,
      onderscheidenlijk op uitgaven.

      5 Een begroting kan, met toestemming van Onze Minister van Financiën, een of meer begrotingsartikelen bevatten ten
      laste waarvan een begrotingsreserve kan worden aangehouden. De toelichting bij zo'n begrotingsartikel vermeldt de
      motieven voor het aanhouden van een reserve en geeft inzicht in de omvang van de reserve, alsmede zo mogelijk in de
      toevoeging en of onttrekking aan de reserve die in het begrotingsjaar worden verwacht.

      6 Een begroting kan een begrotingsartikel "onvoorzien" en een begrotingsartikel "geheim" bevatten.

      7 Een begroting kan administratieve begrotingsartikelen bevatten. De ramingen van deze begrotingsartikelen kunnen
      zowel negatief als positief zijn. De toelichting bij een dergelijk begrotingsartikel vermeldt het karakter ervan.

      8 De ramingen van de verplichtingen en de uitgaven, opgenomen in administratieve begrotingsartikelen,
      worden met toepassing van [artikel 10][ref2] zodanig aangepast, dat deze bedragen in de rekening, bedoeld in
      [artikel 65][ref3], op nihil uitkomen.

      9 Ten behoeve van de verwerking van de gevolgen van de loon- en van de prijsontwikkeling bevat een begroting een
      administratief begrotingsartikel "loonbijstelling" en een administratief begrotingsartikel "prijsbijstelling".


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0003075#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003075#Artikel65
