  - number: '68'
    text: |-
      1 De Algemene Rekenkamer zendt de rapporten, bedoeld in [artikel 67, tweede lid][ref1], en de verklaring van
      goedkeuring, bedoeld in [artikel 67, derde lid][ref2], uiterlijk op 1 september van het jaar volgend op het
      begrotingsjaar aan de Staten-Generaal, alsmede aan Onze betrokken ministers. Indien de Rekenkamer haar onderzoek
      van een financiële verantwoording op uiterlijk 1 september nog niet heeft afgesloten, zendt zij op die datum
      in plaats van een rapport een mededeling omtrent de stand van haar onderzoek. In dat geval wordt het betrokken
      rapport, alsmede de verklaring van goedkeuring zo spoedig mogelijk nagezonden.

      2 Ter verlening van decharge aan Onze betrokken ministers over het gevoerde financiële beheer met betrekking
      tot een begrotingsjaar zendt Onze Minister van Financiën uiterlijk op 1 september van het jaar volgend op het
      begrotingsjaar aan de Staten-Generaal:

      a. de financiële verantwoordingen, bedoeld in [artikel 65, eerste lid][ref3], in voorkomende gevallen voorzien van
      een aanvullende toelichting als bedoeld in [artikel 56, vierde lid][ref4];

      b. de financiële verantwoording, bedoeld in [artikel 66, eerste lid][ref5].

      3 Gelijktijdig met de stukken, bedoeld in het tweede lid, zendt Onze Minister van Financiën aan de Staten-Generaal:

      a. een uiteenzetting over het in het afgelopen jaar gevoerde financiële beheer en over de resultaten van de
      accountantscontrole bij het Rijk;

      b. in voorkomende gevallen een overzicht van de financiële verantwoordingen die, in afwijking van het bepaalde
      in dit artikel, tweede lid, niet uiterlijk op 1 september aan de Staten-Generaal zijn of worden gezonden, met een
      verklaring van de reden daarvan;

      c. in voorkomende gevallen een overzicht van de voorstellen van een slotwet die in afwijking van het bepaalde in
      [artikel 10, tweede lid, aanhef en onder ][ref6], niet uiterlijk op 1 september bij de Tweede Kamer zijn of worden
      ingediend, met een verklaring van de reden daarvan;

      d. in voorkomende gevallen een overzicht van de voorstellen van een indemniteitswet, bedoeld in [artikel 56][ref7],
      die op 1 september nog niet zijn ingediend, met een verklaring van de reden daarvan.


