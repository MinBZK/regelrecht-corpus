  - number: '23'
    text: |-
      1 Elke verplichting en uitgaaf enerzijds en elke ontvangst anderzijds wordt op een begrotingsartikel onder de
      verplichtingen en de uitgaven, onderscheidenlijk de ontvangsten geboekt.

      2 Onze Minister van Financiën kan categorieën verplichtingen, uitgaven en ontvangsten aanwijzen, die op een
      rekening buiten het begrotingsverband kunnen worden geboekt, indien deze met een ander onderdeel van het Rijk dan
      wel met een derde worden verrekend.

      3 Verplichtingen, uitgaven en ontvangsten geboekt op rekeningen buiten het begrotingsverband worden, indien
      verrekening achterwege blijft, geboekt ten laste dan wel ten gunste van begrotingsartikelen van het jaar, waarin
      blijkt dat geen verrekening zal plaatsvinden.

      4 In afwijking van het bepaalde in het eerste lid:

      a. kunnen terugbetalingen aan het Rijk op eerder in hetzelfde jaar gedane uitgaven ten gunste worden geboekt van de
      betrokken uitgavenartikelen;

      b. kunnen terugbetalingen door het Rijk van ontvangsten ten laste worden geboekt van de betrokken
      ontvangstenartikelen;

      c. kan, in geval een geldlening geheel of gedeeltelijk wordt aangegaan ter conversie van uitstaande schuld, het
      bedrag van de afgeloste schuld in vergelijking worden gebracht met de opbrengst van de nieuwe geldlening; een
      daarbij blijkend verschil wordt alsdan ten bate of ten laste van de begroting geboekt.

      5 De boeking van de verplichtingen en de uitgaven geschiedt ten laste van een begrotingsartikel in elk geval
      zodanig, dat aan de bijgehouden administraties onder meer kunnen worden ontleend:

      a. het deel van de raming van de aan te gane verplichtingen dat daadwerkelijk is aangegaan;

      b. het deel van de raming van de uitgaven dat daadwerkelijk tot uitgaven heeft geleid;

      c. per individueel aangegane verplichting het deel dat nog niet tot uitgaven heeft geleid;

      d. het deel van de raming van de uitgaven waarvoor nog geen verplichtingen zijn aangegaan.

      6 Onze Minister van Financiën doet aan de Algemene Rekenkamer schriftelijk mededeling van de aangewezen
      categorieën, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel23
  - number: '24'
    text: |-
      1 Ter bepaling van het jaar ten laste of ten gunste waarvan een verplichting of een uitgaaf, onderscheidenlijk
      een ontvangst moet worden geboekt, is het bepaalde in [artikel 4, vierde tot en met zesde lid][ref1], van
      overeenkomstige toepassing.

      2 In een jaar aangegane verplichtingen, die eerst na het sluiten van de boeken van dat jaar blijken, worden geboekt
      op het overeenkomstige begrotingsartikel in het dan lopende jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel4
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel24
