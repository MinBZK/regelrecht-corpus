  - number: '11'
    text: |-
      Overbrenging, geheel of gedeeltelijk, van begrotingsartikelen van een begroting naar een andere begroting in
      verband met een wijziging van de taakverdeling tussen ministeries geschiedt bij wet.
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel11
  - number: '12'
    text: |-
      1 Onze Minister van Financiën biedt uiterlijk op 1 juni van elk jaar aan de Staten-Generaal de voorjaarsnota
      aan, waarin een overzicht wordt gegeven van de wijzigingen die noodzakelijk worden geacht in de ramingen van de
      uitgaven en de ontvangsten, die in de voorstellen van wet tot vaststelling van de begroting waren opgenomen. Daarin
      wordt tevens aangegeven in hoeverre deze wijzigingen leiden tot wijziging van de meerjarenramingen, bedoeld in
      [artikel 7, aanhef en onder e][ref1].

      2 Onze Minister van Financiën biedt op de derde dinsdag van september van elk jaar aan de Staten-Generaal een
      overzicht aan van de wijzigingen in de ramingen, die in aansluiting op de wijzigingen, bedoeld in de eerste volzin
      van het eerste lid, nader in dat jaar noodzakelijk worden geacht.

      3 Onze Minister van Financiën biedt uiterlijk op 1 december van elk jaar aan de Staten-Generaal de najaarsnota aan,
      waarin in aansluiting op de wijzigingen, bedoeld in het tweede lid, een overzicht wordt gegeven van de wijzigingen
      in de ramingen die nader in dat jaar noodzakelijk worden geacht.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel7
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel12
