  - number: '66'
    text: |-
      1 Onze Minister van Financiën stelt over elk jaar de financiële verantwoording van het Rijk samen.

      2 De financiële verantwoording van het Rijk bevat:

      a. de rekening van uitgaven en ontvangsten van het Rijk, zo nodig voorzien van een toelichting;

      b. de op deze rekening aansluitende saldibalans van het Rijk per 31 december, zo nodig voorzien van een
      toelichting.
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel66
  - number: '67'
    text: |-
      1 Onze Minister van Financiën zendt uiterlijk op 15 mei van het jaar volgend op het begrotingsjaar aan de Algemene
      Rekenkamer:

      a. de financiële verantwoordingen, bedoeld in [artikel 65, eerste lid][ref1];

      b. de samenvattende rapporten, bedoeld in [artikel 22, vijfde lid][ref2];

      c. de opmerkingen waartoe de onder *a* bedoelde stukken hem eventueel aanleiding geven;

      d. de financiële verantwoording van het Rijk, bedoeld in [artikel 66, eerste lid][ref3].

      Van zijn opmerkingen doet hij tevens mededeling aan Onze betrokken ministers.

      2 De Rekenkamer stelt met betrekking tot elke financiële verantwoording, bedoeld in [artikel 65, eerste lid][ref4],
      een rapport op van het door haar verrichte onderzoek, bedoeld in [artikel 51][ref5].

      3 De Rekenkamer stelt met betrekking tot de financiële verantwoording van het Rijk, bedoeld in
      [artikel 66, eerste lid][ref6], een verklaring van goedkeuring op.

      4 De verklaring van goedkeuring wordt gegeven onder voorbehoud van de vaststelling van de slotwetten, bedoeld in
      [artikel 10, tweede lid, aanhef en onder ][ref7], en in voorkomende gevallen onder voorbehoud van de vaststelling
      van een indemniteitswet, bedoeld in [artikel 56][ref8].


