        bwb_id: BWBR0003075
        artikel: '53'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003075
        artikel: '54'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '58'
    text: |-
      Op verzoek van elk van de beide kamers van de Staten-Generaal kan de Algemene Rekenkamer bepaalde onderzoeken
      instellen.
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel58
  - number: '59'
    text: |-
      1 Onverminderd het anders bij wet bepaalde heeft de Algemene Rekenkamer de in de volgende leden vermelde
      bevoegdheden ten aanzien van:

      a. naamloze vennootschappen en besloten vennootschappen met beperkte aansprakelijkheid, waarvan de Staat het gehele
      of nagenoeg het gehele geplaatste aandelenkapitaal houdt;

      b. naamloze vennootschappen en besloten vennootschappen met beperkte aansprakelijkheid, andere dan onder a bedoeld,
      waarvan de Staat tenminste 5% van het geplaatste aandelenkapitaal houdt, indien daarmede een groter financieel
      belang is gemoeid dan een door Onze Minister van Financiën vast te stellen bedrag;

      c. rechtspersonen, commanditaire vennootschappen en vennootschappen onder firma waaraan de Staat of een derde voor
      rekening of risico van de Staat rechtstreeks of middellijk een subsidie, lening of garantie heeft verleend;

      d. rechtspersonen voor zover die een bij of krachtens de wet geregelde taak uitoefenen en daartoe geheel of
      gedeeltelijk worden bekostigd uit de opbrengst van bij of krachtens de wet ingestelde heffingen;

      2 Aan de hand van dossiers, aanwezig bij Onze minister wie het aangaat dan wel bij de instelling, bedoeld in het
      achtste lid, kan de Rekenkamer kennis nemen van jaarrekeningen, daarop betrekking hebbende rapporten van hen die
      deze jaarrekeningen hebben gecontroleerd en overige bescheiden, en kan zij bij Onze minister dan wel die instelling
      daarover nadere inlichtingen inwinnen.

      3 Indien de bescheiden, bedoeld in het tweede lid, haar daartoe aanleiding geven, of een of meer bescheiden
      ontbreken, is de Rekenkamer bevoegd bij de betrokken rechtspersonen of bij de betrokken commanditaire
      vennootschappen of vennootschappen onder firma daarover nadere inlichtingen in te winnen dan wel van hen het
      overleggen van die bescheiden te vorderen, alsmede, behalve indien het de vennootschappen betreft, bedoeld in
      het eerste lid, onder *b*, of De Nederlandsche Bank NV, mede aan de hand van de administratie van de betrokken
      rechtspersoon of vennootschap dan wel bij de derde die de administratie in opdracht van de rechtspersoon of
      vennootschap voert, een onderzoek in te stellen. Onze minister wie het aangaat wordt door de Rekenkamer van haar
      voornemen een dergelijk onderzoek in te stellen in kennis gesteld. Artikel 54, eerste lid, is van overeenkomstige
      toepassing.

      4 Indien het vennootschappen betreft, bedoeld in het eerste lid, onder *b*, dan wel De Nederlandsche Bank
      NV, geschiedt het vorderen van bescheiden en inwinnen van nadere inlichtingen, bedoeld in het derde lid, door
      tussenkomst van Onze minister en heeft het vorderen van bescheiden uitsluitend betrekking op de jaarrekeningen en
      rapporten, bedoeld in het tweede lid.

      5 Onverminderd het bepaalde in het tweede lid en onverminderd haar bevoegdheid tot eigen onderzoek maakt de
      Rekenkamer zoveel mogelijk gebruik van de resultaten van door anderen verrichte controles. Het bepaalde in
      [artikel 53, tweede lid][ref1], is van overeenkomstige toepassing.

      6 De Rekenkamer kan haar bevoegdheden uitoefenen zolang als en over de jaren dat de Staat daarbij belang heeft
      dan wel, voor zover het betreft rechtspersonen of commanditaire vennootschappen of vennootschappen onder firma als
      bedoeld onder *d* en *e* van het eerste lid, zolang als en over de jaren dat het algemeen belang dit vordert.

      7 De Rekenkamer is in het kader van een onderzoek als bedoeld in het derde lid bevoegd tot het betreden van alle
      plaatsen, niet zijnde woningen, waarvan betreding naar haar oordeel voor de vervulling van haar taak met betrekking
      tot deze wet nodig is.

      Zonodig verschaft zij zich toegang met behulp van de sterke arm.

      8 Een instelling die bij of krachtens de wet is belast met het uitoefenen van controle op een rechtspersoon als
      bedoeld in het eerste lid, onder *d*, licht de Rekenkamer op door deze aan te geven wijze volledig in omtrent de
      controlebevindingen en stelt op aanvraag haar controleprogramma aan de Rekenkamer ter beschikking.

      9 Op aanvraag van Onze minister wie het aangaat verstrekt een rechtspersoon, een commanditaire vennootschap of
      vennootschap onder firma of een instelling als bedoeld in het achtste lid zo spoedig mogelijk aan hem afschriften
      van brieven aan de Rekenkamer.

      10 De Rekenkamer doet Onze minister wie het aangaat afschrift toekomen van de brieven die zij toezendt aan een
      rechtspersoon, aan een commanditaire vennootschap of vennootschap onder firma of aan een instelling als bedoeld in
      het achtste lid.

      11 De Rekenkamer deelt aan Onze minister wie het aangaat, aan de betrokken rechtspersoon of de betrokken
      commanditaire vennootschap of vennootschap onder firma en aan de betrokken instelling als bedoeld in het achtste
      lid de opmerkingen en bedenkingen mee die zij naar aanleiding van haar bevindingen van belang acht. Aan Onze
      minister kan zij ter zake voorstellen doen.

      12 De Rekenkamer verstrekt aan Onze Minister van Financiën, Onze minister wie het aangaat en aan de Staten-Generaal
      zodanige mededelingen als zij in het algemeen belang nodig oordeelt.

      13 In geval de Rekenkamer dit in het algemeen belang geboden acht, maakt zij van haar bevindingen melding in een
      rapport of het verslag, bedoeld in [artikel 62, eerste onderscheidenlijk tweede lid][ref2].

      14 Van gegevens en bevindingen die naar hun aard vertrouwelijk zijn, maakt de Rekenkamer in afwijking
      van het bepaalde in het dertiende lid geen melding in een rapport of het verslag, bedoeld in
      [artikel 62, eerste onderscheidenlijk tweede lid][ref3]. Mededelingen aan de Staten-Generaal als bedoeld in het
      twaalfde lid die zodanige gegevens of bevindingen bevatten, verstrekt zij ter vertrouwelijke kennisneming.

      15 Voor de toepassing van dit artikel wordt onder de rechtspersonen, commanditaire vennootschappen
      en vennootschappen onder firma, bedoeld in het eerste lid, onder *c*, niet verstaan de ingevolge
      [artikel 52, tweede lid, onder ][ref4] (*Stb.* 1992, 722) geregistreerde kredietinstellingen.

      16 Dit artikel is niet van toepassing op provincies, gemeenten, rechtspersoonlijkheid bezittende lichamen, bedoeld
      in [artikel 8, eerste lid, van de Wet gemeenschappelijke regelingen][ref5] (*Stb.* 1984, 669), voor zover deze
      niet bij de wet zijn ingesteld, op waterschappen, op openbare lichamen voor beroep en bedrijf en op de Kamers van
      Koophandel en Fabrieken.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0003075#Artikel62
      [ref3]: https://wetten.overheid.nl/BWBR0003075#Artikel62
      [ref4]: https://wetten.overheid.nl/BWBR0005792#Artikel52
      [ref5]: https://wetten.overheid.nl/BWBR0003740#Artikel8
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel59
