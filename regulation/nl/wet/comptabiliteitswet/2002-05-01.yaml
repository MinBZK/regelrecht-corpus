  - number: '64'
    text: |-
      Onze Minister van Financiën biedt uiterlijk op 1 maart na afloop van elk jaar aan de Staten-Generaal de voorlopige
      rekening aan, waarin een overzicht wordt gegeven van de voorlopige stand van de gerealiseerde bedragen aan uitgaven
      en ontvangsten.
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel64
  - number: '65'
    text: |-
      1 Onze ministers, ieder met betrekking tot de begroting waarover hij het beheer voert, maken over elk jaar de
      financiële verantwoording op.

      2 De financiële verantwoording bevat:

      a. de rekening van verplichtingen, uitgaven en ontvangsten, voorzien van een toelichting;

      b. de op deze rekening aansluitende saldibalans per 31 december, voorzien van een toelichting.

      3 De rekening van verplichtingen, uitgaven en ontvangsten wijst, indien wenselijk in afgeronde bedragen, per
      begrotingsartikel in elk geval aan:

      a. de aanvankelijke raming, bedoeld in [artikel 4, tweede lid][ref1];

      b. de onderscheiden wijzigingen in de raming aangebracht bij wet;

      c. het gerealiseerde bedrag.

      4 De toelichting bij de rekening vermeldt met betrekking tot elk begrotingsartikel in elk geval:

      a. een uiteenzetting over het gerealiseerde beleid, waarbij met name aandacht wordt besteed aan afwijkingen en
      aanpassingen ten opzichte van het voorgenomen beleid;

      b. een uiteenzetting over de gerealiseerde activiteiten, prestaties en effecten, indien deze in belangrijke mate
      afwijken van de gegevens met betrekking tot de beoogde activiteiten, prestaties en effecten, vermeld in de memorie
      van toelichting bij het voorstel van wet tot vaststelling van de begroting;

      c. in aansluiting op de splitsing van de begrotingsartikelen, bedoeld in [artikel 7, aanhef en onder ][ref2],
      de uitkomsten met betrekking tot de betrokken artikelonderdelen, waarbij deze uitkomsten worden gesteld naast de
      ramingen voor het betrokken jaar;

      d. andere cijfermatige gegevens die het inzicht in het gerealiseerde beleid kunnen bevorderen, waaronder in
      elk geval een overzicht van de verdeling van de bedragen voor loonbijstelling en prijsbijstelling vanuit de
      administratieve begrotingsartikelen, bedoeld in [artikel 5, negende lid][ref3].

      5 Onze ministers zenden de financiële verantwoording, te zamen met de samenvattende rapporten, bedoeld in
      [artikel 22, vijfde lid][ref4], uiterlijk op 23 april van het jaar volgend op het begrotingsjaar aan Onze Minister
      van Financiën.


