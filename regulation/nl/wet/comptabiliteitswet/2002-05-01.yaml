  - number: '69'
    text: |-
      Onze Minister van Financiën kan regels stellen met betrekking tot de totstandkoming en de inrichting van de
      financiële verantwoording, bedoeld in [artikel 65][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel65
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '65'
        hoofdstuk: V
  - number: '70'
    text: |-
      1 Indien voor een dienstonderdeel van een ministerie een afwijkend beheer wenselijk is, kunnen Onze betrokken
      minister en Onze Minister van Financiën, in afwijking van [artikel 4, tweede lid][ref1], besluiten aan dat
      dienstonderdeel toe te staan onder bepaalde voorwaarden de begroting en de financiële verantwoording in te richten
      op basis van een stelsel van baten en lasten. Een zodanig besluit wordt genomen in overeenstemming met het oordeel
      van de ministerraad.

      2 Een zodanig besluit wordt niet eerder genomen dan 30 dagen nadat het voornemen daartoe schriftelijk ter kennis
      is gebracht van de Tweede Kamer van de Staten-Generaal. Indien binnen deze termijn door of namens de Kamer of
      door tenminste een vijfde van het grondwettelijk aantal leden van de Kamer de wens te kennen wordt gegeven nadere
      inlichtingen te ontvangen over het voorgenomen besluit, wordt het besluit niet eerder genomen dan nadat deze
      inlichtingen zijn verstrekt. Indien de Kamer binnen 30 dagen na ontvangst van de kennisgeving, bedoeld in de eerste
      volzin, of binnen 14 dagen na het verstrekken van de in de tweede volzin bedoelde inlichtingen zich uitspreekt
      tegen het voorgenomen besluit, wordt het besluit niet genomen.

      3 Aan de schriftelijke kennisgeving, bedoeld in het tweede lid, kan worden ontleend in hoeverre aan de voorwaarden,
      bedoeld in het eerste lid, is voldaan.

      4 Onze betrokken minister doet van een zodanig besluit afschrift toekomen aan de Algemene Rekenkamer.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel4
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel70
