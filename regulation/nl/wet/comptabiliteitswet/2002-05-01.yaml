  - number: '44'
    text: |-
      1 De president, de overige leden in gewone dienst, de leden in buitengewone dienst en de secretaris leggen,
      alvorens hun ambt te aanvaarden, in Onze handen de volgende eed (verklaring en belofte) af:

      "Ik zweer (verklaar) dat ik, tot het verkrijgen van mijn aanstelling, middellijk noch onmiddellijk, onder welke
      naam of welk voorwendsel ook, aan iemand iets heb gegeven of beloofd.

      Ik zweer (verklaar en beloof) dat ik om iets in dit ambt te doen of te laten, van niemand enig geschenk of enige
      belofte heb aangenomen of zal aannemen, middellijk of onmiddellijk.

      Ik zweer (beloof) trouw aan de Koning, dat ik de [Grondwet][ref1] steeds zal helpen onderhouden en mijn ambt met
      eerlijkheid, nauwgezetheid en onpartijdigheid zal vervullen.

      Zo waarlijk helpe mij God almachtig! (Dat verklaar en beloof ik!)".

      2 Daartoe door Ons gemachtigd kan ook de president in een vergadering van het college deze eed of de verklaring en
      belofte afnemen van de overige leden in gewone dienst, de leden in buitengewone dienst en de secretaris.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '45'
    text: |-
      De Algemene Rekenkamer stelt voor haar werkzaamheden een reglement van orde vast. Dit reglement wordt door
      plaatsing in de *Staatscourant* bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel45
  - number: '46'
    text: |-
      1 De president oefent het toezicht uit op de werkzaamheden van de Algemene Rekenkamer en op de juiste toepassing
      van het bij of krachtens dit hoofdstuk bepaalde en van het in het vorige artikel bedoelde reglement van orde.

      2 De president brengt alle stukken, welke aan de Rekenkamer of aan hem in zijn hoedanigheid worden toegezonden,
      voor zover zij niet bij het reglement van orde zijn uitgezonderd, ter behandeling in de vergadering van het
      college.

      3 De taken en bevoegdheden van de president worden bij diens afwezigheid of ontstentenis waargenomen door het
      aanwezige lid in gewone dienst, dat het oudste is naar rang van benoeming.
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel46
  - number: '47'
    text: |-
      Geen besluiten zullen in de vergadering van het college kunnen worden genomen, indien niet tenminste de meerderheid
      der leden van het college tegenwoordig is. Besluiten worden genomen bij meerderheid van stemmen; wanneer de stemmen
      staken, beslist de stem van de president.
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel47
  - number: '48'
    text: |-
      1 De leden en de secretaris mogen niet aanwezig zijn bij de beraadslagingen en het nemen van beslissingen over
      enige zaak, die hen, hun echtgenoten, hun geregistreerde partners, degenen met wie zij duurzaam samenleven of hun
      naastbestaanden tot in de derde graad van bloedverwantschap of aanverwantschap betreffen.

      2 Zij mogen niet deelnemen aan het onderzoek van en de beslissing over rekeningen en verantwoordingen die door hen
      worden afgelegd.
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel48
  - number: '49'
    text: |-
      1 Het krachtens de [Ambtenarenwet][ref1] bepaalde ten aanzien van de aanstelling en het ontslag van ambtenaren
      van het Rijk is van overeenkomstige toepassing op de ambtenaren van de Algemene Rekenkamer, met dien verstande
      dat voorzover de aanstelling of het ontslag geschiedt bij koninklijk besluit, de Rekenkamer daartoe een voordracht
      doet en in de overige gevallen de Rekenkamer haar ambtenaren aanstelt of ontslaat. Schorsing geschiedt door de
      Rekenkamer.

      2 De Rekenkamer kan het aanstellen, schorsen en ontslaan van ambtenaren opdragen aan de secretaris.


      [ref1]: https://wetten.overheid.nl/BWBR0001947
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0001947
  - number: '50'
    text: |-
      1 De Algemene Rekenkamer stelt instructies vast voor de secretaris en voor de overige ambtenaren en voor het
      personeel dat bij de Rekenkamer in dienst is op grond van een arbeidsovereenkomst naar burgerlijk recht.

      2 Van de ambtenaren wordt door de president hetzij de eed, hetzij de verklaring en belofte afgenomen. Ook voor het
      personeel bedoeld in het vorige lid kan de Rekenkamer voorschrijven dat daarvan hetzij de eed, hetzij de verklaring
      en belofte wordt afgenomen.
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel50
  - number: '51'
    text: |-
      1 De Algemene Rekenkamer onderzoekt:

      a. het door Onze ministers gevoerde financiële beheer en de jaarlijkse financiële verantwoordingen daarover;

      b. de administraties die ten behoeve van dat beheer en die verantwoordingen worden gevoerd;

      c. het gevoerde materieelbeheer en de daarvan bijgehouden administraties.

      2 Ten aanzien van het gevoerde financiële beheer onderzoekt de Rekenkamer of de verplichtingen, de uitgaven en de
      ontvangsten tot stand zijn gekomen in overeenstemming met de begrotingswetten en met andere wettelijke regelingen
      en of ook overigens zorggedragen is voor een ordelijk en controleerbaar financieel beheer.

      3 Ten aanzien van de financiële verantwoordingen onderzoekt de Rekenkamer of deze het gevoerde financiële beheer
      deugdelijk weergeven en overeenkomstig de daarvoor gegeven voorschriften zijn opgesteld.

      4 De Rekenkamer legt haar bevindingen en haar oordeel over het gevoerde financiële beheer en de verantwoordingen
      daarover vast in de rapporten, bedoeld in [artikel 67, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel67
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '67'
        hoofdstuk: V
  - number: '52'
    text: |-
      Ten aanzien van de financiële verantwoording van het Rijk onderzoekt de Algemene Rekenkamer of deze verantwoording
      aansluit op de financiële verantwoordingen, bedoeld in [artikel 51, eerste lid][ref1], en overeenkomstig de
      daarvoor gegeven voorschriften is opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel51
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '51'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '53'
    text: |-
      1 Bij het uitoefenen van haar taak kan de Algemene Rekenkamer gebruik maken van de resultaten van door anderen
      verrichte controles, onverminderd haar bevoegdheid tot eigen onderzoek.

      2 Onze ministers verstrekken desgevraagd aan de Rekenkamer de controleprogramma’s van hen die met de controle
      belast zijn en lichten haar volledig in omtrent de resultaten van de controle door overlegging van rapporten of op
      andere door de Rekenkamer aan te geven wijze.
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel53
  - number: '54'
    text: |-
      1 De Algemene Rekenkamer is bevoegd, voor zover zij een en ander nodig acht voor het uitoefenen van haar taak, bij
      alle dienstonderdelen van het Rijk alle goederen, administraties, documenten en andere informatiedragers op door
      haar aan te geven wijze te onderzoeken.

      2 Onze ministers zijn gehouden desgevraagd de inlichtingen te verstrekken die de Rekenkamer voor haar taak nodig
      acht.

      3 Het bepaalde in het eerste en tweede lid wordt met betrekking tot de begrotingsartikelen "geheim" verricht
      door of verstrekt aan de president van de Rekenkamer in persoon. Artikel 46, tweede en derde lid, zijn niet van
      toepassing.

      4 De president van de Rekenkamer is ten aanzien van de gegevens die hem ter beschikking worden gesteld met
      betrekking tot de begrotingsartikelen "geheim" verplicht tot geheimhouding. Voor zover hij dat van belang acht,
      deelt hij Onze minister wie het aangaat in persoon de resultaten mee van zijn bevindingen.
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel54
  - number: '55'
    text: |-
      1 Heeft de Algemene Rekenkamer op grond van haar onderzoek, bedoeld in [artikel 51][ref1], bezwaar met betrekking
      tot het gevoerde financiële beheer of de verantwoording daarover dan deelt zij dit bezwaar mede aan Onze daarbij
      betrokken minister.

      2 Binnen een maand na ontvangst van deze mededeling stelt Onze betrokken minister de Rekenkamer in kennis van
      hetgeen tot opheffing van haar bezwaar kan leiden.

      3 Na afloop van deze termijn neemt de Rekenkamer haar eindbeslissing, waarvan zij mededeling doet aan Onze
      betrokken minister. Indien zij haar bezwaar handhaaft doet zij hiervan tevens mededeling aan Onze Minister van
      Financiën.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel51
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '51'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '56'
    text: |-
      1 Handhaaft de Algemene Rekenkamer bij haar eindbeslissing haar bezwaar en houdt dit bezwaar in dat bepaalde
      verplichtingen, uitgaven of ontvangsten niet in overeenstemming met de begrotingswet of met andere wettelijke
      regelingen tot stand zijn gekomen, dan wordt binnen twee maanden aan de Tweede Kamer een voorstel tot vaststelling
      van een indemniteitswet gezonden.

      2 Als de Rekenkamer na afloop van de in het eerste lid bedoelde termijn niet van een zodanige indiening is
      gebleken, doet zij daarvan mededeling aan de Tweede Kamer.

      3 Handhaaft de Rekenkamer bij haar eindbeslissing haar bezwaar en betreft dit een ander bezwaar dan bedoeld in het
      eerste lid, dan maakt zij daarvan melding in het rapport, bedoeld in [artikel 67, tweede lid][ref1]. Tevens kan zij
      daaromtrent een aantekening plaatsen bij de financiële verantwoording van het Rijk.

      4 Onze betrokken minister maakt in een aanvullende toelichting bij de financiële verantwoording zijn standpunt
      inzake het in het derde lid bedoelde bezwaar kenbaar aan de Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel67
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '67'
        hoofdstuk: V
  - number: '57'
    text: |-
      1 De Algemene Rekenkamer wijdt aandacht aan de doelmatigheid van het beheer, de organisatie en het gevoerde beleid
      van het Rijk.

      2 Onze ministers stellen de Rekenkamer tijdig op de hoogte van de doelmatigheidsonderzoeken, die zij doen instellen
      en van de resultaten daarvan.

      3 De [artikelen 53][ref1] en [54][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0003075#Artikel54
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel57
    references:
