  - number: '32'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot:

      a. de taak van de centrale directies financieel-economische zaken;

      b. de plaats en de taak van de accountantsdiensten;

      c. het kasbeheer;

      d. het materieelbeheer.
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel32
  - number: '33'
    text: |-
      1 Onze Minister van Financiën stelt regels met betrekking tot de verschillende onderdelen van het financiële
      beheer.

      2 Onze Minister van Financiën kan regels stellen met betrekking tot:

      a. de taak, bedoeld in [artikel 17, eerste lid, tweede volzin][ref1];

      b. de uitoefening van de bevoegdheid, bedoeld in [artikel 17, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0003075#Artikel17
