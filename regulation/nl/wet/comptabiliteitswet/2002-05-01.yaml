        bwb_id: BWBR0003075
        artikel: '5'
        hoofdstuk: I
        paragraaf: '2'
  - number: '16'
    text: |-
      1 Onze Minister van Algemene Zaken voert het beheer over de begroting van het koninklijk huis.

      2 Onze Minister van Binnenlandse Zaken voert het beheer over de begroting van de hoge colleges van staat en het
      Kabinet van de Koning.

      Over de aan dit beheer te geven inhoud maakt Onze Minister van Binnenlandse Zaken afspraken met de onderscheiden
      hoge colleges van staat en het Kabinet van de Koning, waarin recht wordt gedaan aan hun staatsrechtelijke positie.

      3 Onze Minister van Financiën voert het beheer over de begroting van nationale schuld.

      4 Onze ministers, ieder met betrekking tot het ministerie met de leiding waarvan hij is belast, voeren het beheer
      over de begrotingen van de desbetreffende ministeries.
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel16
  - number: '17'
    text: |-
      1 Onze ministers, ieder met betrekking tot de begrotingen waarover hij het beheer voert, dragen zorg voor een
      rechtmatig financieel beheer. Zij dragen tevens zorg voor de doelmatigheid van het beheer, van de organisatie en
      van het beleid dat aan de begroting van het betrokken ministerie ten grondslag ligt, alsmede voor het periodiek
      onderzoeken van die doelmatigheid.

      2 Onze ministers, ieder met betrekking tot de begrotingen waarover hij het beheer voert, beschikken met
      inachtneming van het bepaalde in [artikel 36, tweede lid][ref1], over de bedragen die voor het aangaan van
      verplichtingen en voor het verrichten van uitgaven in die begrotingen zijn toegestaan.

      3 Over het bedrag toegestaan bij een begrotingsartikel "onvoorzien" kunnen Onze ministers slechts beschikken,
      voor zover dit bedrag met toepassing van het bepaalde in [artikel 10][ref2] aan de ramingen van andere
      begrotingsartikelen is toegevoegd.

      4 Onze ministers wijzen aan wie namens hen kunnen beschikken over de toegestane bedragen en trekken een zodanige
      aanwijzing in.

      5 In afwijking van het vierde lid wijzen de voorzitters van de beide Kamers der Staten-Generaal, de vice-president
      van de Raad van State, de president van de Algemene Rekenkamer, de Nationale ombudsman, de Kanselier van de
      Kanselarij der Nederlandse Orden en de directeur van het Kabinet van de Koning, ieder met betrekking tot het
      betrokken onderdeel van de begroting van de hoge colleges van staat en het Kabinet van de Koning, aan wie kunnen
      beschikken over de toegestane bedragen en trekken een zodanige aanwijzing in.

      6 Onze ministers doen aan de Algemene Rekenkamer schriftelijk mededeling van een aanwijzing en een intrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0003075#Artikel10
