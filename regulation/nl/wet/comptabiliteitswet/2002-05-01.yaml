        paragraaf: '2'
  - number: 22a
    text: |-
      1 Onverminderd het anders bij wet bepaalde, heeft Onze Minister wie het aangaat de in de volgende leden vermelde
      bevoegdheden ten aanzien van rechtspersonen, commanditaire vennootschappen, vennootschappen onder firma en
      natuurlijke personen die een beroep of bedrijf uitoefenen aan wie door de Raad van de Europese Unie, het Europees
      Parlement en de Raad gezamenlijk of de Commissie van de Europese Gemeenschappen op grond van een vastgesteld
      programma rechtstreeks of middellijk een subsidie wordt verstrekt.

      2 Onze Minister wie het aangaat kan kennis nemen van jaarrekeningen en daarop betrekking hebbende rapporten van hen
      die deze jaarrekeningen hebben gecontroleerd.

      3 Indien de bescheiden, bedoeld in het tweede lid, Onze Minister wie het aangaat daartoe aanleiding geven,
      of een of meer bescheiden ontbreken, is Onze Minister wie het aangaat bevoegd bij de betrokken rechtspersoon,
      commanditaire vennootschap, vennootschap onder firma of natuurlijke persoon die een beroep of bedrijf uitoefent
      daarover nadere inlichtingen in te winnen dan wel inzage in documenten en andere informatiedragers te vorderen,
      alsmede, mede aan de hand van de administratie van de betrokken rechtspersoon, vennootschap of natuurlijke persoon
      dan wel bij de derde die de administratie in opdracht van de rechtspersoon, vennootschap of natuurlijke persoon
      voert, een onderzoek in te stellen.[ Artikel 54, eerste lid][ref1], is van overeenkomstige toepassing.

      4 De in de voorgaande leden vermelde bevoegdheden zijn gericht op nakoming van de bij of krachtens de
      oprichtingsverdragen van de Europese Gemeenschappen aan de lidstaat opgelegde verplichtingen aangaande beheer,
      controle of toezicht ten aanzien van de rechtmatige en doelmatige besteding van subsidies als bedoeld in het eerste
      lid.

      5 Onze Minister wie het aangaat kan de in dit artikel vermelde bevoegdheden uitoefenen zolang als en over de jaren
      dat de Staat daarbij belang heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel54
