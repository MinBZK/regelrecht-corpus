  - number: 59a
    text: |-
      1 Onverminderd het anders bij wet bepaalde, heeft de Algemene Rekenkamer de in de volgende leden vermelde
      bevoegdheden ten aanzien van rechtspersonen, commanditaire vennootschappen, vennootschappen onder firma en
      natuurlijke personen die een beroep of bedrijf uitoefenen aan wie door de Raad van de Europese Unie, het Europees
      Parlement en de Raad gezamenlijk of de Commissie van de Europese Gemeenschappen op grond van een vastgesteld
      programma rechtstreeks of middellijk een subsidie wordt verstrekt.

      2 Aan de hand van dossiers aanwezig bij Onze Minister wie het aangaat kan de Rekenkamer kennis nemen van
      jaarrekeningen, daarop betrekking hebbende rapporten van hen die deze jaarrekeningen hebben gecontroleerd en
      overige bescheiden, en kan zij bij Onze Minister daarover nadere inlichtingen inwinnen.

      3 Indien de bescheiden, bedoeld in het tweede lid, haar daartoe aanleiding geven, of een of meer bescheiden
      ontbreken, is de Rekenkamer bevoegd bij de betrokken rechtspersoon, commanditaire vennootschap, vennootschap onder
      firma of natuurlijke persoon die een beroep of bedrijf uitoefent daarover nadere inlichtingen in te winnen dan wel
      inzage in documenten en andere informatiedragers te vorderen, alsmede, mede aan de hand van de administratie van de
      betrokken rechtspersoon, vennootschap of natuurlijke persoon dan wel bij de derde die de administratie in opdracht
      van de rechtspersoon, vennootschap of natuurlijke persoon voert, een onderzoek in te stellen. Onze Minister wie
      het aangaat wordt door de Rekenkamer van haar voornemen een dergelijk onderzoek in te stellen in kennis gesteld.
      Artikel 54, eerste lid, is van overeenkomstige toepassing.

      4 De in de voorgaande leden vermelde bevoegdheden zijn gericht op oordeelsvorming over het door Onze Minister
      gevoerde beleid ter nakoming van de bij of krachtens de oprichtingsverdragen van de Europese Gemeenschappen aan
      de lidstaat opgelegde verplichtingen aangaande beheer, controle of toezicht ten aanzien van de rechtmatige en
      doelmatige besteding van subsidies als bedoeld in het eerste lid.

      5 De Rekenkamer kan de in dit artikel vermelde bevoegdheden uitoefenen zolang als en over de jaren dat de Staat
      daarbij belang heeft.

      6 [Artikel 59, vierde, vijfde, elfde, twaalfde, dertiende, veertiende en vijftiende lid][ref1], is van
      overeenkomstige toepassing.

      7 De Rekenkamer voert overleg met de Europese Rekenkamer teneinde te komen tot afspraken over de te hanteren normen
      en criteria bij het in dit artikel bedoelde onderzoek en over de wijze van samenwerking met de Europese Rekenkamer.

      8 De [artikelen 5:12][ref2], [5:13][ref3], [5:15][ref4] en [5:17 van de Algemene wet bestuursrecht][ref5] zijn van
      overeenkomstige toepassing ten aanzien van het gebruik van de bevoegdheid vermeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel59
