        paragraaf: '2'
  - number: '9'
    text: |-
      Onze Minister van Financiën biedt op de in [artikel 8, vierde lid][ref1], genoemde dag aan de Staten-Generaal de
      miljoenennota aan. Daarin worden in elk geval opgenomen:

      a. beschouwingen over de budgettaire betekenis van het voorgenomen beleid voor het Rijk;

      b. beschouwingen over de betekenis van het voorgenomen beleid voor de volkshuishouding;

      c. de meerjarenramingen, bedoeld in [artikel 7, aanhef en onder ][ref2], volgens een door hem te bepalen mate van
      samenvoeging;

      d. het overzicht, bedoeld in [artikel 12, tweede lid][ref3];

      e. een overzicht van de totalen van de uitgaven, ontvangsten en saldi over de laatste tien jaren;

      f. een balans van de bezittingen, vorderingen en schulden van de Staat naar de toestand per 31 december van het
      laatst verstreken jaar met een toelichting, waaruit onder meer blijkt naar welke grondslagen deze zijn gewaardeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003075#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003075#Artikel12
