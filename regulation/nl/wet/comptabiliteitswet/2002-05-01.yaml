        hoofdstuk: III
  - number: '39'
    text: |-
      1 De Algemene Rekenkamer bestaat uit drie leden in gewone dienst die te zamen het college vormen, alsmede uit ten
      hoogste drie leden in buitengewone dienst. De president wordt uit de leden in gewone dienst bij koninklijk besluit
      benoemd.

      2 Van een vacature onder de leden geeft de Rekenkamer zo spoedig mogelijk kennis aan Ons en aan de Tweede Kamer.

      3 Met de kennisgeving aan de Tweede Kamer wordt meegezonden een door de leden van het college van de Rekenkamer met
      meerderheid van stemmen opgemaakte aanbevelingslijst van zes kandidaten, waarop de Tweede Kamer bij haar voordracht
      zodanig acht zal slaan als haar dienstig voorkomt.
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel39
  - number: '40'
    text: |-
      1 De leden in buitengewone dienst kunnen door de president worden opgeroepen om deel te nemen aan bepaalde
      werkzaamheden en hebben alsdan ter zake dezelfde bevoegdheden als de leden in gewone dienst; zij maken dan tevens
      deel uit van het college.

      2 De leden in buitengewone dienst vervangen bovendien de leden in gewone dienst bij voorziene afwezigheid of
      ontstentenis.
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel40
  - number: '41'
    text: |-
      Aan de Algemene Rekenkamer wordt toegevoegd een secretaris die op voordracht van de Rekenkamer bij koninklijk
      besluit wordt benoemd en ontslagen. Schorsing geschiedt door de Rekenkamer.
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel41
  - number: '42'
    text: |-
      1 Om tot lid te kunnen worden benoemd, moet men Nederlander zijn en de leeftijd van dertig jaren hebben bereikt.

      2 De leden en de secretaris mogen geen andere openbare betrekkingen vervullen, aan welke een vaste beloning of
      toelage is verbonden, noch lid zijn van een publiekrechtelijk college, waarvoor de keuze geschiedt bij of krachtens
      wettelijk voorschrift uitgeschreven verkiezingen.

      Behoudens indien de onverenigbaarheid ook uit een ander wettelijk voorschrift voortvloeit kan hiervan bij
      koninklijk besluit, de Algemene Rekenkamer gehoord, ontheffing worden verleend.

      3 De leden en de secretaris vervullen overigens geen betrekkingen die ongewenst zijn met het oog op een goede
      vervulling van hun ambt of handhaving van hun onpartijdigheid en onafhankelijkheid of van het vertrouwen daarin.

      4 De betrekkingen die de leden en de secretaris buiten hun ambt vervullen, worden door de president openbaar
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel42
  - number: '43'
    text: |-
      1 Een lid wordt ontslag verleend op eigen verzoek en bij het bereiken van de leeftijd van zeventig jaar. Het
      ontslag gaat in op de eerste dag van de volgende maand.

      2 De leden kunnen door de Hoge Raad der Nederlanden worden ontslagen of geschorst.
      [Hoofdstuk 6A van de Wet rechtspositie rechterlijke ambtenaren][ref1], met uitzondering van
      de [artikelen 46b][ref2], [46c, eerste lid, onder b, tweede en derde lid][ref3], [46d][ref4],
      [46i, eerste lid, onder c][ref5], [46k][ref6] en [46q][ref7], is daarbij van overeenkomstige toepassing, met dien
      verstande dat:

        - de disciplinaire maatregel van schriftelijke waarschuwing wordt opgelegd door de president van de Algemene
      Rekenkamer;
        - in [artikel 46e][ref8] voor «de rechterlijk ambtenaar, tevens zijnde president van het gerechtshof of de
      rechtbank, de president van de Hoge Raad onderscheidenlijk procureur-generaal bij de Hoge Raad,» wordt gelezen« de
      president van de Rekenkamer»;
        - de president van de Rekenkamer als functionele autoriteit wordt aangemerkt;
        - voor «Onze Minister» wordt gelezen «de Minister van Binnenlandse Zaken en Koninkrijksrelaties»;
        - de voordracht bedoeld in de [artikelen 46i, derde lid][ref9], en [46l, tweede lid][ref10], wordt gedaan door
      de Rekenkamer;
        - in [artikel 46p, vijfde en zesde lid][ref11], in plaats van «het betrokken gerecht onderscheidenlijk het parket
      bij de Hoge Raad» wordt gelezen «de Rekenkamer».

      3 Grond voor ontslag is voorts dat het lid handelt in strijd met [artikel 42, derde lid][ref12].


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Hoofdstuk6A
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46b
