        paragraaf: '1'
  - number: '2'
    text: |-
      1 Ten behoeve van een afzonderlijk beheer van ontvangsten en uitgaven van het Rijk kan een begrotingsfonds worden
      ingesteld.

      2 De instelling van een begrotingsfonds geschiedt bij de wet.

      3 De wet tot instelling van een begrotingsfonds bepaalt de aard van de uitgaven en van de ontvangsten van het
      betrokken fonds, de bestemming van een batig dan wel de aanvulling van een nadelig jaarsaldo van het fonds, alsmede
      wie van Onze ministers het beheer voert over de begroting van het fonds.

      4 De bepalingen van deze wet zijn op een begrotingsfonds van toepassing, voor zover bij de wet tot instelling van
      het fonds daarvan niet wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel2
  - number: '4'
    text: |-
      1 Het begrotingsjaar is het kalenderjaar.

      2 De begrotingen bevatten de ramingen van de verplichtingen, de uitgaven en de ontvangsten, voor zover de daarmee
      gemoeide gelden niet toebehoren aan derden. De ramingen van de verplichtingen en van de uitgaven hebben het
      karakter van een maximum.

      3 In afwijking van het bepaalde in het tweede lid, eerste volzin, bevatten de begrotingen geen ramingen van de
      verplichtingen, de uitgaven en de ontvangsten die op grond van het bepaalde in [artikel 23, tweede lid][ref1],
      buiten het begrotingsverband (zullen) worden gehouden.

      4 Onder uitgaven en ontvangsten van een jaar worden verstaan:

      a. de geldelijke betalingen en ontvangsten in dat jaar;

      b. de niet-geldelijke betalingen en ontvangsten in dat jaar, bedoeld in [artikel 25, eerste lid][ref2];

      c. de verrekeningen, bedoeld in [artikel 26, eerste lid][ref3], die in dat jaar plaatsvinden;

      d. de toevoegingen en onttrekkingen aan een reserve als bedoeld in [artikel 5, vijfde lid][ref4].

      5 Als verplichting van een jaar wordt geraamd het bedrag van de verplichting die in dat jaar rechtstreeks ontstaat
      op grond van een verdrag, een wet, een koninklijk besluit, een ministeriële regeling, een beschikking, een
      verbintenis of een op een controleerbare wijze vastgelegde afspraak tussen dienstonderdelen en die in dat jaar dan
      wel in een later jaar tot uitgaven leidt of kan leiden.

      6 In afwijking van het vijfde lid kan als verplichting van een jaar worden opgenomen het bedrag dat in dat jaar als
      uitgave wordt geraamd met betrekking tot:

      a. salarissen, wachtgelden en soortgelijke periodieke verplichtingen;

      b. rente van de vaste en van de vlottende schuld;

      c. aflossing van de vaste schuld;

      d. huren, pachten en soortgelijke periodieke verplichtingen;

      e. andere door Onze Minister van Financiën aan te wijzen categorieën verplichtingen.

      7 Onze Minister van Financiën doet aan de Algemene Rekenkamer schriftelijk mededeling van de aangewezen
      categorieën.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel23
