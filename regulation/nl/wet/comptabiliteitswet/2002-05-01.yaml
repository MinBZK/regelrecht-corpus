  - number: '15'
    text: |-
      Onze Minister van Financiën stelt regels met betrekking tot:

      a. de voorbereiding, de wijziging en de inrichting van de begrotingen met inbegrip van de daarbij behorende
      toelichtingen en bijlagen, alsmede met betrekking tot de wijze waarop de begrotingsramingen tot stand komen;

      b. de inrichting van het afzonderlijk onderdeel van de toelichting bij de voorstellen, voornemens en toezeggingen,
      bedoeld in [artikel 14][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel14
