  - number: '72'
    text: |-
      De financiële verantwoording, bedoeld in [artikel 65, eerste lid][ref1], bevat per dienst die een baten-
      lastenstelsel voert een onderdeel omtrent de financiële verantwoording van die dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel65
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel72
