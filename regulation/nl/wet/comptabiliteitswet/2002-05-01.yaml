        artikel: '4'
        hoofdstuk: I
        paragraaf: '2'
  - number: '71'
    text: |-
      1 De betalingen van het betrokken ministerie aan een dienst die een baten-lastenstelsel voert, hierna te noemen:
      een baten-lastendienst, evenals de betalingen van een baten-lastendienst aan het betrokken ministerie, worden door
      het ministerie ten laste onderscheidenlijk ten gunste van een of meer begrotingsartikelen van het desbetreffende
      hoofdbeleidsterrein gebracht.

      2 De begroting van een ministerie bevat voor elke baten-lastendienst dat onder het betrokken ministerie ressorteert
      tevens het totaal van de geraamde baten, van de geraamde lasten, het saldo van baten en lasten, het totaal van de
      geraamde kapitaaluitgaven en van de geraamde kapitaalontvangsten.

      3 Tot de uitgaven en ontvangsten in een jaar van een baten-lastendienst en van het ministerie waaronder het
      ressorteert worden, behalve die bedoeld in [artikel 4, vierde lid][ref1], ook gerekend de verrekeningen tussen de
      baten-lastendienst en dat ministerie.

      4 In afwijking van het bepaalde in [artikel 10, tweede lid][ref2], mogen alle wijzigingen in de bedragen,
      bedoeld in het derde lid van dit artikel, worden opgenomen in de voorstellen van een slotwet, bedoeld in
      [artikel 10, tweede lid, aanhef en onder ][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel4
