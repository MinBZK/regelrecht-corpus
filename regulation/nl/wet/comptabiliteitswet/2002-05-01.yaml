  - number: '25'
    text: |-
      1 Onze Minister van Financiën kan categorieën niet-geldelijke betalingen en ontvangsten aanwijzen die als
      geldelijke betalingen onderscheidenlijk ontvangsten worden geboekt.

      2 Onze Minister van Financiën doet aan de Algemene Rekenkamer schriftelijk mededeling van de aangewezen
      categorieën.
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel25
  - number: '26'
    text: |-
      1 Verrekeningen tussen onderdelen van het Rijk, waarvan de begrotingsartikelen niet tot eenzelfde begroting
      behoren, worden geboekt als geldelijke betalingen en ontvangsten.

      2 Het eerste lid kan tevens worden toegepast bij verrekeningen tussen dienstonderdelen waarvan de
      begrotingsartikelen tot eenzelfde begroting behoren, indien het aantoonbaar administratief doelmatig is deze
      verrekeningen als geldelijke betalingen en ontvangsten te boeken.
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel26
  - number: '27'
    text: |-
      1 Onze ministers, ieder met betrekking tot de begrotingen waarover hij het beheer voert, verrichten namens de Staat
      de privaatrechtelijke rechtshandelingen die uit het te voeren beheer voortvloeien, tenzij bij of krachtens de wet
      is bepaald dat een van Onze andere ministers de rechtshandeling verricht.

      2 Onze Minister van Financiën is belast met het privaatrechtelijke beheer ten aanzien van roerende en onroerende
      zaken die aan de Staat toebehoren dan wel zijn toevertrouwd, een en ander voor zover dat beheer niet bij of
      krachtens de wet aan een of meer van Onze andere ministers is opgedragen.

      3 In afwijking van het bepaalde in het eerste lid kunnen de privaatrechtelijke rechtshandelingen, voor zover
      die voortvloeien uit het door Onze Minister van Binnenlandse Zaken op grond van [artikel 16, tweede lid][ref1],
      te voeren beheer over de begroting van de hoge colleges van staat en het Kabinet van de Koning, worden verricht
      door de voorzitters van de beide Kamers der Staten-Generaal, door de vice-president van de Raad van State,
      door de president van de Algemene Rekenkamer, door de Nationale ombudsman, door de kanselier van de Kanselarij
      der Nederlandse Orden en door de directeur van het Kabinet van de Koning, ieder met betrekking tot het
      betrokken onderdeel van die begroting, tenzij bij of krachtens de wet is bepaald dat een van Onze ministers de
      rechtshandeling verricht.

      4 Privaatrechtelijke rechtshandelingen kunnen namens Onze ministers dan wel namens degenen genoemd in het derde
      lid, worden verricht, indien zij daartoe een algemene of bijzondere volmacht hebben verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel16
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel27
