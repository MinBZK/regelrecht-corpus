        artikel: '28'
        hoofdstuk: II
        paragraaf: '5'
  - number: '35'
    text: |-
      1 Onze Minister van Financiën is belast met het toezicht op de uitvoering van de begrotingen.

      2 Dit toezicht omvat mede de toetsing aan het algemene financiële beleid.
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel35
  - number: '36'
    text: |-
      1 Onze Minister van Financiën bepaalt welke gegevens hem ten behoeve van het toezicht, bedoeld in
      [artikel 35][ref1], worden verstrekt.

      2 In het kader van het toezicht, bedoeld in [artikel 35][ref2], kan Onze Minister van Financiën begrotingsartikelen
      aanwijzen ten laste waarvan geen verplichtingen mogen worden aangegaan, voordat hij daarmee heeft ingestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0003075#Artikel35
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '35'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003075
        artikel: '35'
        hoofdstuk: III
  - number: '37'
    text: |-
      1 Onze Minister van Financiën is belast met het toezicht op de inrichting van de administraties, bedoeld in
      [artikel 20, eerste lid][ref1], en op de wijze waarop deze worden bijgehouden.

      2 Onze Minister van Financiën is belast met het toezicht op de inrichting van de controle die plaatsvindt in het
      kader van de uitvoering van de begrotingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel20
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '20'
        hoofdstuk: II
        paragraaf: '3'
  - number: '38'
    text: |-
      1 Onze ministers zijn gehouden desgevraagd de inlichtingen te verstrekken die Onze Minister van Financiën voor de
      uitoefening van het toezicht, bedoeld in de [artikelen 35][ref1] en [37][ref2], nodig heeft.

      2 Onze ministers verlenen Onze Minister van Financiën te allen tijde toegang tot dan wel inzage in alle goederen,
      administraties, documenten en andere informatiedragers.

      3 Onze Minister van Financiën wijst de ambtenaren aan die namens hem zijn belast met de uitoefening van de
      bevoegdheden, bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0003075#Artikel37
