  - number: '18'
    text: |-
      1 Wanneer een wet tot vaststelling van een begroting niet vóór 1 januari van het jaar waarop deze betrekking heeft
      in werking is getreden, kan Onze minister die het beheer voert over die begroting in het belang van het Rijk:

      a. voor het aangaan van verplichtingen beschikken over ten hoogste vier twaalfde gedeelten van de bedragen die bij
      de overeenkomstige begrotingsartikelen van het voorafgaande jaar zijn toegestaan;

      b. voor het verrichten van uitgaven beschikken over de bedragen die in het voorstel van de wet tot vaststelling van
      die begroting daarvoor zijn geraamd.

      2 In het belang van het Rijk kan Onze minister in overeenstemming met Onze Minister van Financiën met betrekking
      tot een of meer begrotingsartikelen van het bepaalde in het eerste lid, aanhef en onder *a,* afwijken.

      3 Onze Minister van Financiën doet aan de Staten-Generaal en aan de Algemene Rekenkamer schriftelijk mededeling van
      een toepassing van het bepaalde in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel18
  - number: '19'
    text: |-
      1 De aan het Rijk toebehorende en toevertrouwde gelden en geldswaardige papieren worden in 's Rijks schatkist
      gedeponeerd.

      2 Onze Minister van Financiën is belast met het beheer van de centrale kassen van 's Rijks schatkist, alsmede met
      de coördinatie van en het toezicht op het door Onze ministers gevoerde beheer van de departementale kassen.

      3 Onze ministers zijn belast met het beheer van de departementale kassen, ieder voor zover dit beheer voortvloeit
      uit het beheer van de begrotingen en de rekeningen buiten begrotingsverband waarmee hij is belast.

      4 In afwijking van het derde lid kan Onze Minister van Financiën bepalen dat bepaalde uitgaven en ontvangsten niet
      ten laste of ten gunste van de departementale kassen plaatsvinden, maar ten laste of ten gunste van de centrale
      kassen worden verricht.

      5 Onze Minister van Financiën houdt per begroting één of meer rekeningen-courant aan tussen het Ministerie van
      Financiën en het ministerie van Onze minister die de betrokken begroting beheert.

      6 Onze Minister van Financiën kan ten behoeve van een doelmatig en risico-arm kasbeheer aan derden voor zover
      deze collectieve middelen beheren, toestaan deze middelen in rekening-courant aan te houden bij het Ministerie
      van Financiën.

      7 Over een debet- en een creditstand van een rekening-courant kan door Onze Minister van Financiën een
      rentevergoeding worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel19
  - number: 19a
    text: |-
      1 Onze ministers, ieder met betrekking tot de begrotingen waarover hij het beheer voert, dragen zorg voor een
      rechtmatig en doelmatig materieelbeheer, een en ander voor zover het materieelbeheer niet bij of krachtens de wet
      aan een of meer van Onze andere ministers is opgedragen.

      2 Het materieelbeheer van het Rijk omvat de zorg voor het materieel dat aan het Rijk toebehoort dan wel is
      toevertrouwd.

      3 Onze Minister van Financiën is verantwoordelijk voor het beheer van het overtollige materieel bij het Rijk.
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel19a
  - number: '20'
    text: |-
      1 Onze ministers houden administraties bij die inzicht bieden in het gevoerde beheer en die voldoen aan eisen van
      doelmatigheid en controle.

      2 Onze Minister van Financiën voert de centrale administratie van ’s Rijks schatkist.
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel20
  - number: '21'
    text: |-
      1 Onze ministers, ieder met betrekking tot de begrotingen waarover hij het beheer voert, dragen aan de centrale
      directie financieel-economische zaken van hun ministerie de zorg op voor de begrotingszaken en de daarmee
      samenhangende administraties. De zorg voor de begrotingszaken omvat mede het beoordelen van de aan Onze betrokken
      minister voor te leggen voorstellen betreffende de begrotingen en de meerjarenramingen alsmede het uitoefenen van
      toezicht op de uitvoering van de begrotingen.

      2 In overeenstemming met Onze Minister van Financiën kan op een andere wijze in de zorg voor de begrotingszaken en
      de daarmee samenhangende administraties worden voorzien.

      3 In overeenstemming met Onze Minister van Financiën wijzen Onze ministers het hoofd aan van de centrale directie,
      bedoeld in het eerste lid, en trekken zij een zodanige aanwijzing in.

      4 Onze ministers doen schriftelijk mededeling aan de Algemene Rekenkamer van:

      a. een toepassing van het bepaalde in het tweede lid;

      b. een aanwijzing en een intrekking, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel21
  - number: '22'
    text: |-
      1 Onze ministers, ieder met betrekking tot de begrotingen waarover hij het beheer voert, dragen aan de
      accountantsdienst van hun ministerie de controle op van:

      a. het gevoerde financieel beheer en de jaarlijkse financiële verantwoordingen daarover; het bepaalde in
      [artikel 51, tweede en derde lid][ref1], is van overeenkomstige toepassing;

      b. de administraties die ten behoeve van dat beheer en die verantwoordingen worden gevoerd;

      c. het gevoerde materieelbeheer en de daarvan bijgehouden administraties.

      Onze Minister van Financiën draagt zorg voor de accountantscontrole van de centrale administratie van 's Rijks
      schatkist. Artikel 52, is van overeenkomstige toepassing.

      2 In overeenstemming met Onze Minister van Financiën en na overleg met de Algemene Rekenkamer kunnen Onze ministers
      op een andere wijze in de controle voorzien.

      3 In overeenstemming met Onze Minister van Financiën wijzen Onze ministers het hoofd aan van de accountantsdienst
      van hun ministerie en trekken zij een zodanige aanwijzing in.

      4 Onze ministers doen schriftelijk mededeling aan de Rekenkamer van een aanwijzing en een intrekking.

      5 De resultaten van de controle worden jaarlijks vastgelegd in rapporten die zijn gericht aan Onze betrokken
      minister. Het samenvattende rapport bevat, behalve de belangrijkste bevindingen van de controle, een verklaring
      omtrent de financiële verantwoording.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel51
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel22
