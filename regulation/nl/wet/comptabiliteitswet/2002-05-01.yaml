preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Comptabiliteitswet 1927 (Stb. 259) te vervangen door
    nieuwe wettelijke bepalingen, mede ter uitvoering van de artikelen 136 en 193 van de Grondwet, voor het beheer van
    ’s Rijks financiën;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Tot de begroting van het Rijk behoren:

      a. de begroting van het koninklijk huis;

      b. de begroting van de hoge colleges van staat en het Kabinet van de Koning;

      c. de begroting van nationale schuld;

      d. de begrotingen van de onderscheiden ministeries;

      e. de begrotingen van de onderscheiden begrotingsfondsen, bedoeld in [artikel 2][ref1];

      2 Toevoeging aan de begroting van het Rijk van andere begrotingen, alsmede de intrekking van een zodanige
      toevoeging geschiedt bij koninklijk besluit. Het besluit tot toevoeging bepaalt wie van Onze ministers het beheer
      voert over die begroting.

      3 De begrotingen worden elk afzonderlijk bij de wet vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel2
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel1
