  - number: '10'
    text: |-
      1 Onze ministers, ieder met betrekking tot de begrotingen waarover hij het beheer voert, zenden ontwerp-
      begrotingswijzigingen aan Onze Minister van Financiën. [Artikel 8, tweede, derde en vijfde lid][ref1], zijn van
      overeenkomstige toepassing.

      2 Voorstellen van wet tot wijziging van de begroting worden in elk geval ingediend met betrekking tot:

      a. de wijzigingen, samenhangend met die bedoeld in [artikel 12, eerste lid][ref2], en wel gelijktijdig met de
      betrokken voorjaarsnota;

      b. nadere wijzigingen, tenzij boekhoudkundig van aard of voortvloeiend uit controlebevindingen, waaronder in elk
      geval begrepen de wijzigingen, samenhangend met die bedoeld in [artikel 12, tweede en derde lid][ref3], en wel
      gelijktijdig met de betrokken najaarsnota.

      c. de slotwetwijzigingen, zijnde per begrotingsartikel de wijziging die leidt tot opheffing van het resterende
      verschil tussen de begrotingsraming, inclusief eerdere wijzigingen daarin aangebracht, en het gerealiseerde bedrag
      en wel uiterlijk op 1 september van het jaar volgend op het begrotingsjaar.

      3 De memorie van toelichting bij een voorstel van wet, bedoeld in het tweede lid, aanhef en onder *a* of *b,* sluit
      aan bij de toelichting die op grond van [artikel 7][ref4] is gegeven bij het desbetreffende voorstel van wet tot
      vaststelling van de begroting.

      4 In voorkomende gevallen zendt Onze Minister van Financiën uiterlijk op 1 juni en uiterlijk op 1 december aan de
      Tweede Kamer een overzicht van de voorstellen van wet, bedoeld in het tweede lid, aanhef en onder *a* en *b,* die
      niet voor of op de datum van 1 juni, onderscheidenlijk 1 december aan de Tweede Kamer zijn gezonden. Dit overzicht
      kan zonodig worden verwerkt in de voorjaarsnota, bedoeld in [artikel 12, eerste lid][ref5], respectievelijk in de
      najaarsnota, bedoeld in [artikel 12, derde lid][ref6].


