  - number: '13'
    text: |-
      1 Voorstellen, andere dan voorstellen van wet tot vaststelling of wijziging van een begroting, alsmede voornemens
      en toezeggingen met financiële gevolgen voor het Rijk worden niet aan de ministerraad of aan de Staten-Generaal
      aangeboden, kenbaar gemaakt dan wel gedaan, voordat Onze Minister van Financiën daarover zijn oordeel heeft
      gegeven. [Artikel 8, tweede lid][ref1], is ten aanzien van deze voorstellen, voornemens en toezeggingen van
      overeenkomstige toepassing.

      2 Het eerste lid, eerste zin, is eveneens van toepassing op voorstellen, voornemens en toezeggingen met gevolgen
      voor de regels die bij of krachtens deze wet zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel8
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel13
    references:
