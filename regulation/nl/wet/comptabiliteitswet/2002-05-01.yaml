  - number: '6'
    text: |-
      1 De begroting van het koninklijk huis bevat de uitkeringen aan de leden van dat huis.

      2 De begroting van nationale schuld bevat in afzonderlijke begrotingsartikelen ramingen met betrekking tot:

      a. de rente en de kosten van de vaste schuld;

      b. de rente en de kosten van de vlottende schuld;

      c. de uitgaven wegens aflossing van de vaste schuld;

      d. de ontvangsten wegens uitgifte van vaste schuld.

      3 In afwijking van het tweede lid neemt Onze Minister van Financiën de vergoedingen en de kosten die voortvloeien
      uit vermogens- of financieringstransacties, andere dan transacties met betrekking tot de vaste of de vlottende
      schuld, als raming op in de begrotingsartikelen inzake de rente en de kosten van de vaste of de vlottende schuld.
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel6
  - number: '7'
    text: |-
      De memorie van toelichting bij een voorstel van wet tot vaststelling van een begroting vermeldt met betrekking tot
      elk begrotingsartikel de volgende gegevens:

      a. een uiteenzetting over het te voeren beleid;

      b. de eventuele regeling(en) op grond waarvan het beleid wordt gevoerd;

      c. de factoren die aan de ramingen ten grondslag liggen, alsmede voor zover mogelijk gegevens omtrent de omvang van
      de activiteiten, prestaties en effecten die worden beoogd, waarbij deze gegevens in elk geval worden gesteld naast
      die van het lopende jaar en naast de uitkomsten van het aan het lopende jaar voorafgaande jaar;

      d. voor zover zinvol een nadere splitsing van de begrotingsartikelen en van de daarbij behorende ramingen, waarbij
      deze ramingen worden gesteld naast de ramingen van het lopende jaar en naast de uitkomsten van het aan het lopende
      jaar voorafgaande jaar;

      e. meerjarenramingen, dat wil zeggen de ramingen met betrekking tot de vier op het betrokken jaar volgende jaren;

      f. eventuele andere cijfermatige gegevens die het inzicht in het te voeren beleid kunnen bevorderen, waartoe in
      voorkomende gevallen zijn te rekenen afzonderlijke gegevens over garantieverplichtingen en over grote projecten;

      g. de economische en de functionele code, overeenkomstig de door Onze Minister van Financiën vast te stellen
      classificaties.
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel7
  - number: '8'
    text: |-
      1 Onze ministers, ieder met betrekking tot de begrotingen waarover hij het beheer voert, zenden jaarlijks aan
      Onze Minister van Financiën uiterlijk op een door hem te bepalen datum de ontwerp-begroting voor het komende jaar,
      alsmede de daarbij behorende ontwerp-meerjarenramingen, bedoeld in [artikel 7, aanhef en onder e][ref1].

      2 Onze Minister van Financiën maakt tegen een ontwerp-begroting of tegen de ontwerp-meerjarenramingen bezwaar,
      voor zover deze hem met het oog op het algemene financiële beleid of het doelmatige beheer van 's Rijks gelden niet
      toelaatbaar voorkomen.

      3 Indien Onze Minister van Financiën tegen een ontwerp-begroting en de daarbij behorende ontwerp-meerjarenramingen
      geen bezwaar heeft, dan biedt hij Ons het daarop gebaseerde voorstel van wet tot vaststelling van de begroting ter
      indiening bij de Tweede Kamer aan.

      4 Wij zenden de voorstellen van wet op de derde dinsdag van september van het jaar voorafgaande aan het jaar waarop
      deze voorstellen betrekking hebben, gelijktijdig aan de Tweede Kamer.

      5 In afwijking van het bepaalde in het vierde lid kunnen Wij Onze Minister van Financiën machtigen de voorstellen
      van wet aan de Tweede Kamer aan te bieden.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel7
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel8
