  - number: '61'
    text: |-
      1 De Algemene Rekenkamer deelt Onze ministers wie het aangaan de opmerkingen en bedenkingen mee die zij naar
      aanleiding van haar werkzaamheden van belang acht. Zij kan daarbij ter zake voorstellen doen.

      2 De Rekenkamer verstrekt aan Onze betrokken ministers, Onze Minister van Financiën en aan de Staten-Generaal
      zodanige mededelingen als zij nodig oordeelt. Zij kan naar aanleiding daarvan met hen nader overleg plegen.
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel61
  - number: '62'
    text: |-
      1 De Algemene Rekenkamer brengt de rapporten die zij vaststelt over haar onderzoek ter kennis aan Ons en aan de
      Staten-Generaal.

      2 De Rekenkamer biedt Ons en de Staten-Generaal voor 1 april van elk jaar een verslag aan van haar werkzaamheden in
      het daaraan voorafgaande jaar.
    url: https://wetten.overheid.nl/BWBR0003075/2002-05-01#Artikel62
  - number: '63'
    text: |-
      1 Onze minister wie het aangaat, voert overleg met Onze Minister van Financiën en met de Algemene Rekenkamer,
      over de bij of krachtens de wet te stellen regels die betrekking hebben op de taken en of bevoegdheden van de
      Rekenkamer.

      2 Het eerste lid is van overeenkomstige toepassing, indien bij de oprichting van een rechtspersoon als bedoeld
      in [artikel 29, eerste lid][ref1], ten aanzien van deze rechtspersoon taken en of bevoegdheden ontstaan voor de
      Rekenkamer.

      3 Onze Minister van Financiën voert overleg met de Rekenkamer inzake de bij of krachtens deze wet te stellen
      regels, met uitzondering van de regels, bedoeld in de [artikelen 15][ref2] en [69][ref3].

      4 Van de gestelde regels wordt door Onze betrokken minister mededeling gedaan aan de Rekenkamer.


