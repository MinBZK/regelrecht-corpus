---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: comptabiliteitswet
regulatory_layer: WET
publication_date: '2002-08-20'
valid_from: '2002-01-01'
bwb_id: BWBR0003075
url: https://wetten.overheid.nl/BWBR0003075/2002-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Comptabiliteitswet 1927 (Stb. 259) te vervangen door
    nieuwe wettelijke bepalingen, mede ter uitvoering van de artikelen 136 en 193 van de Grondwet, voor het beheer van
    ’s Rijks financiën;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Tot de begroting van het Rijk behoren:'
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel1
  - number: 1.1.a
    text: de begroting van het koninklijk huis;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel1
  - number: 1.1.b
    text: de begroting van de hoge colleges van staat en het Kabinet van de Koning;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel1
  - number: 1.1.c
    text: de begroting van nationale schuld;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel1
  - number: 1.1.d
    text: de begrotingen van de onderscheiden ministeries;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel1
  - number: 1.1.e
    text: |-
      de begrotingen van de onderscheiden begrotingsfondsen, bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel2
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '2'
        hoofdstuk: I
        paragraaf: '1'
  - number: '1.2'
    text: |-
      Toevoeging aan de begroting van het Rijk van andere begrotingen, alsmede de intrekking van een zodanige toevoeging
      geschiedt bij koninklijk besluit. Het besluit tot toevoeging bepaalt wie van Onze ministers het beheer voert over
      die begroting.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel1
  - number: '1.3'
    text: De begrotingen worden elk afzonderlijk bij de wet vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel1
  - number: '2.1'
    text: |-
      Ten behoeve van een afzonderlijk beheer van ontvangsten en uitgaven van het Rijk kan een begrotingsfonds worden
      ingesteld.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel2
  - number: '2.2'
    text: De instelling van een begrotingsfonds geschiedt bij de wet.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel2
  - number: '2.3'
    text: |-
      De wet tot instelling van een begrotingsfonds bepaalt de aard van de uitgaven en van de ontvangsten van het
      betrokken fonds, de bestemming van een batig dan wel de aanvulling van een nadelig jaarsaldo van het fonds, alsmede
      wie van Onze ministers het beheer voert over de begroting van het fonds.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel2
  - number: '2.4'
    text: |-
      De bepalingen van deze wet zijn op een begrotingsfonds van toepassing, voor zover bij de wet tot instelling van het
      fonds daarvan niet wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel2
  - number: '4.1'
    text: Het begrotingsjaar is het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel4
  - number: '4.2'
    text: |-
      De begrotingen bevatten de ramingen van de verplichtingen, de uitgaven en de ontvangsten, voor zover de daarmee
      gemoeide gelden niet toebehoren aan derden. De ramingen van de verplichtingen en van de uitgaven hebben het
      karakter van een maximum.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel4
  - number: '4.3'
    text: |-
      In afwijking van het bepaalde in het tweede lid, eerste volzin, bevatten de begrotingen geen ramingen van de
      verplichtingen, de uitgaven en de ontvangsten die op grond van het bepaalde in [artikel 23, tweede lid][ref1],
      buiten het begrotingsverband (zullen) worden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel23
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '23'
        hoofdstuk: II
        paragraaf: '4'
  - number: '4.4'
    text: 'Onder uitgaven en ontvangsten van een jaar worden verstaan:'
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel4
  - number: 4.4.a
    text: de geldelijke betalingen en ontvangsten in dat jaar;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel4
  - number: 4.4.b
    text: |-
      de niet-geldelijke betalingen en ontvangsten in dat jaar, bedoeld in [artikel 25, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel25
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '25'
        hoofdstuk: II
        paragraaf: '4'
  - number: 4.4.c
    text: |-
      de verrekeningen, bedoeld in [artikel 26, eerste lid][ref1], die in dat jaar plaatsvinden;


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel26
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '26'
        hoofdstuk: II
        paragraaf: '4'
  - number: 4.4.d
    text: |-
      de toevoegingen en onttrekkingen aan een reserve als bedoeld in [artikel 5, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel5
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '5'
        hoofdstuk: I
        paragraaf: '2'
  - number: '4.5'
    text: |-
      Als verplichting van een jaar wordt geraamd het bedrag van de verplichting die in dat jaar rechtstreeks ontstaat op
      grond van een verdrag, een wet, een koninklijk besluit, een ministeriële regeling, een beschikking, een verbintenis
      of een op een controleerbare wijze vastgelegde afspraak tussen dienstonderdelen en die in dat jaar dan wel in een
      later jaar tot uitgaven leidt of kan leiden.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel4
  - number: '4.6'
    text: |-
      In afwijking van het vijfde lid kan als verplichting van een jaar worden opgenomen het bedrag dat in dat jaar als
      uitgave wordt geraamd met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel4
  - number: 4.6.a
    text: salarissen, wachtgelden en soortgelijke periodieke verplichtingen;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel4
  - number: 4.6.b
    text: rente van de vaste en van de vlottende schuld;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel4
  - number: 4.6.c
    text: aflossing van de vaste schuld;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel4
  - number: 4.6.d
    text: huren, pachten en soortgelijke periodieke verplichtingen;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel4
  - number: 4.6.e
    text: andere door Onze Minister van Financiën aan te wijzen categorieën verplichtingen.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel4
  - number: '4.7'
    text: Onze Minister van Financiën doet aan de Algemene Rekenkamer schriftelijk mededeling van de aangewezen categorieën.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel4
  - number: '5.1'
    text: |-
      De ramingen van de verplichtingen en de uitgaven enerzijds en die van de ontvangsten anderzijds worden opgenomen in
      afzonderlijke begrotingsartikelen.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel5
  - number: '5.2'
    text: |-
      Een begrotingsartikel is de kleinste eenheid in een begroting. Het bevat mede een kernachtige omschrijving van het
      onderwerp waarop het betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel5
  - number: '5.3'
    text: |-
      Per begroting worden de begrotingsartikelen gegroepeerd naar hoofdbeleidsterreinen, zodanig dat elk
      hoofdbeleidsterrein een helder beeld geeft van de onderwerpen van beleid. Voor zover bepaalde begrotingsartikelen
      niet zinvol bij een hoofdbeleidsterrein kunnen worden ondergebracht, worden deze opgenomen in het
      hoofdbeleidsterrein "algemeen".
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel5
  - number: '5.4'
    text: |-
      Het bepaalde in het eerste lid is niet van toepassing op de ramingen van de uitgaven en de ontvangsten die op
      grond van het bepaalde in [artikel 23, vierde lid][ref1], in mindering zullen worden gebracht op ontvangsten,
      onderscheidenlijk op uitgaven.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel23
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '23'
        hoofdstuk: II
        paragraaf: '4'
  - number: '5.5'
    text: |-
      Een begroting kan, met toestemming van Onze Minister van Financiën, een of meer begrotingsartikelen bevatten ten
      laste waarvan een begrotingsreserve kan worden aangehouden. De toelichting bij zo'n begrotingsartikel vermeldt de
      motieven voor het aanhouden van een reserve en geeft inzicht in de omvang van de reserve, alsmede zo mogelijk in de
      toevoeging en of onttrekking aan de reserve die in het begrotingsjaar worden verwacht.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel5
  - number: '5.6'
    text: Een begroting kan een begrotingsartikel "onvoorzien" en een begrotingsartikel "geheim" bevatten.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel5
  - number: '5.7'
    text: |-
      Een begroting kan administratieve begrotingsartikelen bevatten. De ramingen van deze begrotingsartikelen kunnen
      zowel negatief als positief zijn. De toelichting bij een dergelijk begrotingsartikel vermeldt het karakter ervan.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel5
  - number: '5.8'
    text: |-
      De ramingen van de verplichtingen en de uitgaven, opgenomen in administratieve begrotingsartikelen, worden
      met toepassing van [artikel 10][ref1] zodanig aangepast, dat deze bedragen in de rekening, bedoeld in
      [artikel 65][ref2], op nihil uitkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003075#Artikel65
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '10'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003075
        artikel: '65'
        hoofdstuk: V
  - number: '5.9'
    text: |-
      Ten behoeve van de verwerking van de gevolgen van de loon- en van de prijsontwikkeling bevat een begroting een
      administratief begrotingsartikel "loonbijstelling" en een administratief begrotingsartikel "prijsbijstelling".
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel5
  - number: '6.1'
    text: De begroting van het koninklijk huis bevat de uitkeringen aan de leden van dat huis.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel6
  - number: '6.2'
    text: 'De begroting van nationale schuld bevat in afzonderlijke begrotingsartikelen ramingen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel6
  - number: 6.2.a
    text: de rente en de kosten van de vaste schuld;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel6
  - number: 6.2.b
    text: de rente en de kosten van de vlottende schuld;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel6
  - number: 6.2.c
    text: de uitgaven wegens aflossing van de vaste schuld;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel6
  - number: 6.2.d
    text: de ontvangsten wegens uitgifte van vaste schuld.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel6
  - number: '6.3'
    text: |-
      In afwijking van het tweede lid neemt Onze Minister van Financiën de vergoedingen en de kosten die voortvloeien uit
      vermogens- of financieringstransacties, andere dan transacties met betrekking tot de vaste of de vlottende schuld,
      als raming op in de begrotingsartikelen inzake de rente en de kosten van de vaste of de vlottende schuld.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel6
  - number: '7'
    text: |-
      De memorie van toelichting bij een voorstel van wet tot vaststelling van een begroting vermeldt met betrekking tot
      elk begrotingsartikel de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel7
  - number: 7.a
    text: een uiteenzetting over het te voeren beleid;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel7
  - number: 7.b
    text: de eventuele regeling(en) op grond waarvan het beleid wordt gevoerd;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel7
  - number: 7.c
    text: |-
      de factoren die aan de ramingen ten grondslag liggen, alsmede voor zover mogelijk gegevens omtrent de omvang van de
      activiteiten, prestaties en effecten die worden beoogd, waarbij deze gegevens in elk geval worden gesteld naast die
      van het lopende jaar en naast de uitkomsten van het aan het lopende jaar voorafgaande jaar;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel7
  - number: 7.d
    text: |-
      voor zover zinvol een nadere splitsing van de begrotingsartikelen en van de daarbij behorende ramingen, waarbij
      deze ramingen worden gesteld naast de ramingen van het lopende jaar en naast de uitkomsten van het aan het lopende
      jaar voorafgaande jaar;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel7
  - number: 7.e
    text: meerjarenramingen, dat wil zeggen de ramingen met betrekking tot de vier op het betrokken jaar volgende jaren;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel7
  - number: 7.f
    text: |-
      eventuele andere cijfermatige gegevens die het inzicht in het te voeren beleid kunnen bevorderen, waartoe in
      voorkomende gevallen zijn te rekenen afzonderlijke gegevens over garantieverplichtingen en over grote projecten;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel7
  - number: 7.g
    text: |-
      de economische en de functionele code, overeenkomstig de door Onze Minister van Financiën vast te stellen
      classificaties.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel7
  - number: '8.1'
    text: |-
      Onze ministers, ieder met betrekking tot de begrotingen waarover hij het beheer voert, zenden jaarlijks aan Onze
      Minister van Financiën uiterlijk op een door hem te bepalen datum de ontwerp-begroting voor het komende jaar,
      alsmede de daarbij behorende ontwerp-meerjarenramingen, bedoeld in [artikel 7, aanhef en onder e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel7
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '7'
        hoofdstuk: I
        paragraaf: '2'
  - number: '8.2'
    text: |-
      Onze Minister van Financiën maakt tegen een ontwerp-begroting of tegen de ontwerp-meerjarenramingen bezwaar, voor
      zover deze hem met het oog op het algemene financiële beleid of het doelmatige beheer van 's Rijks gelden niet
      toelaatbaar voorkomen.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel8
  - number: '8.3'
    text: |-
      Indien Onze Minister van Financiën tegen een ontwerp-begroting en de daarbij behorende ontwerp-meerjarenramingen
      geen bezwaar heeft, dan biedt hij Ons het daarop gebaseerde voorstel van wet tot vaststelling van de begroting ter
      indiening bij de Tweede Kamer aan.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel8
  - number: '8.4'
    text: |-
      Wij zenden de voorstellen van wet op de derde dinsdag van september van het jaar voorafgaande aan het jaar waarop
      deze voorstellen betrekking hebben, gelijktijdig aan de Tweede Kamer.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel8
  - number: '8.5'
    text: |-
      In afwijking van het bepaalde in het vierde lid kunnen Wij Onze Minister van Financiën machtigen de voorstellen van
      wet aan de Tweede Kamer aan te bieden.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel8
  - number: '9'
    text: |-
      Onze Minister van Financiën biedt op de in [artikel 8, vierde lid][ref1], genoemde dag aan de Staten-Generaal de
      miljoenennota aan. Daarin worden in elk geval opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel8
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '8'
        hoofdstuk: I
        paragraaf: '2'
  - number: 9.a
    text: beschouwingen over de budgettaire betekenis van het voorgenomen beleid voor het Rijk;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel9
  - number: 9.b
    text: beschouwingen over de betekenis van het voorgenomen beleid voor de volkshuishouding;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel9
  - number: 9.c
    text: |-
      de meerjarenramingen, bedoeld in [artikel 7, aanhef en onder ][ref1], volgens een door hem te bepalen mate van
      samenvoeging;


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel7
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '7'
        hoofdstuk: I
        paragraaf: '2'
  - number: 9.d
    text: |-
      het overzicht, bedoeld in [artikel 12, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel12
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '12'
        hoofdstuk: I
        paragraaf: '2'
  - number: 9.e
    text: een overzicht van de totalen van de uitgaven, ontvangsten en saldi over de laatste tien jaren;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel9
  - number: 9.f
    text: |-
      een balans van de bezittingen, vorderingen en schulden van de Staat naar de toestand per 31 december van het laatst
      verstreken jaar met een toelichting, waaruit onder meer blijkt naar welke grondslagen deze zijn gewaardeerd.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel9
  - number: '10.1'
    text: |-
      Onze ministers, ieder met betrekking tot de begrotingen waarover hij het beheer voert, zenden ontwerp-
      begrotingswijzigingen aan Onze Minister van Financiën. [Artikel 8, tweede, derde en vijfde lid][ref1], zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel8
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '8'
        hoofdstuk: I
        paragraaf: '2'
  - number: '10.2'
    text: 'Voorstellen van wet tot wijziging van de begroting worden in elk geval ingediend met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel10
  - number: 10.2.a
    text: |-
      de wijzigingen, samenhangend met die bedoeld in [artikel 12, eerste lid][ref1], en wel gelijktijdig met de
      betrokken voorjaarsnota;


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel12
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '12'
        hoofdstuk: I
        paragraaf: '2'
  - number: 10.2.b
    text: |-
      nadere wijzigingen, tenzij boekhoudkundig van aard of voortvloeiend uit controlebevindingen, waaronder in elk
      geval begrepen de wijzigingen, samenhangend met die bedoeld in [artikel 12, tweede en derde lid][ref1], en wel
      gelijktijdig met de betrokken najaarsnota.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel12
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '12'
        hoofdstuk: I
        paragraaf: '2'
  - number: 10.2.c
    text: |-
      de slotwetwijzigingen, zijnde per begrotingsartikel de wijziging die leidt tot opheffing van het resterende
      verschil tussen de begrotingsraming, inclusief eerdere wijzigingen daarin aangebracht, en het gerealiseerde bedrag
      en wel uiterlijk op 1 september van het jaar volgend op het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel10
  - number: '10.3'
    text: |-
      De memorie van toelichting bij een voorstel van wet, bedoeld in het tweede lid, aanhef en onder *a* of *b,* sluit
      aan bij de toelichting die op grond van [artikel 7][ref1] is gegeven bij het desbetreffende voorstel van wet tot
      vaststelling van de begroting.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel7
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '7'
        hoofdstuk: I
        paragraaf: '2'
  - number: '10.4'
    text: |-
      In voorkomende gevallen zendt Onze Minister van Financiën uiterlijk op 1 juni en uiterlijk op 1 december aan de
      Tweede Kamer een overzicht van de voorstellen van wet, bedoeld in het tweede lid, aanhef en onder *a* en *b,* die
      niet voor of op de datum van 1 juni, onderscheidenlijk 1 december aan de Tweede Kamer zijn gezonden. Dit overzicht
      kan zonodig worden verwerkt in de voorjaarsnota, bedoeld in [artikel 12, eerste lid][ref1], respectievelijk in de
      najaarsnota, bedoeld in [artikel 12, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003075#Artikel12
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '12'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003075
        artikel: '12'
        hoofdstuk: I
        paragraaf: '2'
  - number: '11'
    text: |-
      Overbrenging, geheel of gedeeltelijk, van begrotingsartikelen van een begroting naar een andere begroting in
      verband met een wijziging van de taakverdeling tussen ministeries geschiedt bij wet.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel11
  - number: '12.1'
    text: |-
      Onze Minister van Financiën biedt uiterlijk op 1 juni van elk jaar aan de Staten-Generaal de voorjaarsnota
      aan, waarin een overzicht wordt gegeven van de wijzigingen die noodzakelijk worden geacht in de ramingen van de
      uitgaven en de ontvangsten, die in de voorstellen van wet tot vaststelling van de begroting waren opgenomen. Daarin
      wordt tevens aangegeven in hoeverre deze wijzigingen leiden tot wijziging van de meerjarenramingen, bedoeld in
      [artikel 7, aanhef en onder e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel7
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '7'
        hoofdstuk: I
        paragraaf: '2'
  - number: '12.2'
    text: |-
      Onze Minister van Financiën biedt op de derde dinsdag van september van elk jaar aan de Staten-Generaal een
      overzicht aan van de wijzigingen in de ramingen, die in aansluiting op de wijzigingen, bedoeld in de eerste volzin
      van het eerste lid, nader in dat jaar noodzakelijk worden geacht.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel12
  - number: '12.3'
    text: |-
      Onze Minister van Financiën biedt uiterlijk op 1 december van elk jaar aan de Staten-Generaal de najaarsnota aan,
      waarin in aansluiting op de wijzigingen, bedoeld in het tweede lid, een overzicht wordt gegeven van de wijzigingen
      in de ramingen die nader in dat jaar noodzakelijk worden geacht.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel12
  - number: '13.1'
    text: |-
      Voorstellen, andere dan voorstellen van wet tot vaststelling of wijziging van een begroting, alsmede voornemens
      en toezeggingen met financiële gevolgen voor het Rijk worden niet aan de ministerraad of aan de Staten-Generaal
      aangeboden, kenbaar gemaakt dan wel gedaan, voordat Onze Minister van Financiën daarover zijn oordeel heeft
      gegeven. [Artikel 8, tweede lid][ref1], is ten aanzien van deze voorstellen, voornemens en toezeggingen van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel8
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '8'
        hoofdstuk: I
        paragraaf: '2'
  - number: '13.2'
    text: |-
      Het eerste lid, eerste zin, is eveneens van toepassing op voorstellen, voornemens en toezeggingen met gevolgen voor
      de regels die bij of krachtens deze wet zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel13
  - number: '14'
    text: |-
      Schriftelijke voorstellen, voornemens en toezeggingen als bedoeld in [artikel 13, eerste lid][ref1], bevatten in
      de toelichting daarbij een afzonderlijk onderdeel, waarin alle financiële gevolgen voor het Rijk en, waar mogelijk,
      de financiële gevolgen voor andere maatschappelijke sectoren worden vermeld. Daarbij wordt tevens aangegeven in
      hoeverre de financiële gevolgen voor het Rijk zijn begrepen in de laatste bij de Tweede Kamer ingediende begroting
      en in de meerjarenramingen, bedoeld in [artikel 7, aanhef en onder e][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003075#Artikel7
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '13'
        hoofdstuk: I
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003075
        artikel: '7'
        hoofdstuk: I
        paragraaf: '2'
  - number: '15'
    text: 'Onze Minister van Financiën stelt regels met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel15
  - number: 15.a
    text: |-
      de voorbereiding, de wijziging en de inrichting van de begrotingen met inbegrip van de daarbij behorende
      toelichtingen en bijlagen, alsmede met betrekking tot de wijze waarop de begrotingsramingen tot stand komen;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel15
  - number: 15.b
    text: |-
      de inrichting van het afzonderlijk onderdeel van de toelichting bij de voorstellen, voornemens en toezeggingen,
      bedoeld in [artikel 14][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel14
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '14'
        hoofdstuk: I
        paragraaf: '3'
  - number: 15a
    text: |-
      Onze Minister van Financiën bepaalt de criteria die gehanteerd worden voor het instellen van een begrotingsreserve
      als bedoeld in [artikel 5, vijfde lid][ref1], en stelt de voorwaarden vast voor de toevoeging en de onttrekking van
      gelden aan de reserve.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel5
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '5'
        hoofdstuk: I
        paragraaf: '2'
  - number: '16.1'
    text: Onze Minister van Algemene Zaken voert het beheer over de begroting van het koninklijk huis.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel16
  - number: '16.2'
    text: |-
      Onze Minister van Binnenlandse Zaken voert het beheer over de begroting van de hoge colleges van staat en het
      Kabinet van de Koning. Over de aan dit beheer te geven inhoud maakt Onze Minister van Binnenlandse Zaken afspraken
      met de onderscheiden hoge colleges van staat en het Kabinet van de Koning, waarin recht wordt gedaan aan hun
      staatsrechtelijke positie.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel16
  - number: '16.3'
    text: Onze Minister van Financiën voert het beheer over de begroting van nationale schuld.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel16
  - number: '16.4'
    text: |-
      Onze ministers, ieder met betrekking tot het ministerie met de leiding waarvan hij is belast, voeren het beheer
      over de begrotingen van de desbetreffende ministeries.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel16
  - number: '17.1'
    text: |-
      Onze ministers, ieder met betrekking tot de begrotingen waarover hij het beheer voert, dragen zorg voor een
      rechtmatig financieel beheer. Zij dragen tevens zorg voor de doelmatigheid van het beheer, van de organisatie en
      van het beleid dat aan de begroting van het betrokken ministerie ten grondslag ligt, alsmede voor het periodiek
      onderzoeken van die doelmatigheid.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel17
  - number: '17.2'
    text: |-
      Onze ministers, ieder met betrekking tot de begrotingen waarover hij het beheer voert, beschikken met inachtneming
      van het bepaalde in [artikel 36, tweede lid][ref1], over de bedragen die voor het aangaan van verplichtingen en
      voor het verrichten van uitgaven in die begrotingen zijn toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel36
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '36'
        hoofdstuk: III
  - number: '17.3'
    text: |-
      Over het bedrag toegestaan bij een begrotingsartikel "onvoorzien" kunnen Onze ministers slechts beschikken,
      voor zover dit bedrag met toepassing van het bepaalde in [artikel 10][ref1] aan de ramingen van andere
      begrotingsartikelen is toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel10
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '10'
        hoofdstuk: I
        paragraaf: '2'
  - number: '17.4'
    text: |-
      Onze ministers wijzen aan wie namens hen kunnen beschikken over de toegestane bedragen en trekken een zodanige
      aanwijzing in.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel17
  - number: '17.5'
    text: |-
      In afwijking van het vierde lid wijzen de voorzitters van de beide Kamers der Staten-Generaal, de vice-president
      van de Raad van State, de president van de Algemene Rekenkamer, de Nationale ombudsman, de Kanselier van de
      Kanselarij der Nederlandse Orden en de directeur van het Kabinet van de Koning, ieder met betrekking tot het
      betrokken onderdeel van de begroting van de hoge colleges van staat en het Kabinet van de Koning, aan wie kunnen
      beschikken over de toegestane bedragen en trekken een zodanige aanwijzing in.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel17
  - number: '17.6'
    text: Onze ministers doen aan de Algemene Rekenkamer schriftelijk mededeling van een aanwijzing en een intrekking.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel17
  - number: '18.1'
    text: |-
      Wanneer een wet tot vaststelling van een begroting niet vóór 1 januari van het jaar waarop deze betrekking heeft in
      werking is getreden, kan Onze minister die het beheer voert over die begroting in het belang van het Rijk:
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel18
  - number: 18.1.a
    text: |-
      voor het aangaan van verplichtingen beschikken over ten hoogste vier twaalfde gedeelten van de bedragen die bij de
      overeenkomstige begrotingsartikelen van het voorafgaande jaar zijn toegestaan;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel18
  - number: 18.1.b
    text: |-
      voor het verrichten van uitgaven beschikken over de bedragen die in het voorstel van de wet tot vaststelling van
      die begroting daarvoor zijn geraamd.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel18
  - number: '18.2'
    text: |-
      In het belang van het Rijk kan Onze minister in overeenstemming met Onze Minister van Financiën met betrekking tot
      een of meer begrotingsartikelen van het bepaalde in het eerste lid, aanhef en onder *a,* afwijken.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel18
  - number: '18.3'
    text: |-
      Onze Minister van Financiën doet aan de Staten-Generaal en aan de Algemene Rekenkamer schriftelijk mededeling van
      een toepassing van het bepaalde in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel18
  - number: '19.1'
    text: |-
      De aan het Rijk toebehorende en toevertrouwde gelden en geldswaardige papieren worden in 's Rijks schatkist
      gedeponeerd.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel19
  - number: '19.2'
    text: |-
      Onze Minister van Financiën is belast met het beheer van de centrale kassen van 's Rijks schatkist, alsmede met de
      coördinatie van en het toezicht op het door Onze ministers gevoerde beheer van de departementale kassen.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel19
  - number: '19.3'
    text: |-
      Onze ministers zijn belast met het beheer van de departementale kassen, ieder voor zover dit beheer voortvloeit uit
      het beheer van de begrotingen en de rekeningen buiten begrotingsverband waarmee hij is belast.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel19
  - number: '19.4'
    text: |-
      In afwijking van het derde lid kan Onze Minister van Financiën bepalen dat bepaalde uitgaven en ontvangsten niet
      ten laste of ten gunste van de departementale kassen plaatsvinden, maar ten laste of ten gunste van de centrale
      kassen worden verricht.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel19
  - number: '19.5'
    text: |-
      Onze Minister van Financiën houdt per begroting één of meer rekeningen-courant aan tussen het Ministerie van
      Financiën en het ministerie van Onze minister die de betrokken begroting beheert.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel19
  - number: '19.6'
    text: |-
      Onze Minister van Financiën kan ten behoeve van een doelmatig en risico-arm kasbeheer aan derden voor zover deze
      collectieve middelen beheren, toestaan deze middelen in rekening-courant aan te houden bij het Ministerie van
      Financiën.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel19
  - number: '19.7'
    text: |-
      Over een debet- en een creditstand van een rekening-courant kan door Onze Minister van Financiën een
      rentevergoeding worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel19
  - number: 19a.1
    text: |-
      Onze ministers, ieder met betrekking tot de begrotingen waarover hij het beheer voert, dragen zorg voor een
      rechtmatig en doelmatig materieelbeheer, een en ander voor zover het materieelbeheer niet bij of krachtens de wet
      aan een of meer van Onze andere ministers is opgedragen.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel19a
  - number: 19a.2
    text: |-
      Het materieelbeheer van het Rijk omvat de zorg voor het materieel dat aan het Rijk toebehoort dan wel is
      toevertrouwd.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel19a
  - number: 19a.3
    text: Onze Minister van Financiën is verantwoordelijk voor het beheer van het overtollige materieel bij het Rijk.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel19a
  - number: '20.1'
    text: |-
      Onze ministers houden administraties bij die inzicht bieden in het gevoerde beheer en die voldoen aan eisen van
      doelmatigheid en controle.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel20
  - number: '20.2'
    text: Onze Minister van Financiën voert de centrale administratie van ’s Rijks schatkist.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel20
  - number: '21.1'
    text: |-
      Onze ministers, ieder met betrekking tot de begrotingen waarover hij het beheer voert, dragen aan de centrale
      directie financieel-economische zaken van hun ministerie de zorg op voor de begrotingszaken en de daarmee
      samenhangende administraties. De zorg voor de begrotingszaken omvat mede het beoordelen van de aan Onze betrokken
      minister voor te leggen voorstellen betreffende de begrotingen en de meerjarenramingen alsmede het uitoefenen van
      toezicht op de uitvoering van de begrotingen.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel21
  - number: '21.2'
    text: |-
      In overeenstemming met Onze Minister van Financiën kan op een andere wijze in de zorg voor de begrotingszaken en de
      daarmee samenhangende administraties worden voorzien.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel21
  - number: '21.3'
    text: |-
      In overeenstemming met Onze Minister van Financiën wijzen Onze ministers het hoofd aan van de centrale directie,
      bedoeld in het eerste lid, en trekken zij een zodanige aanwijzing in.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel21
  - number: '21.4'
    text: 'Onze ministers doen schriftelijk mededeling aan de Algemene Rekenkamer van:'
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel21
  - number: 21.4.a
    text: een toepassing van het bepaalde in het tweede lid;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel21
  - number: 21.4.b
    text: een aanwijzing en een intrekking, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel21
  - number: '22.1'
    text: |-
      Onze ministers, ieder met betrekking tot de begrotingen waarover hij het beheer voert, dragen aan de
      accountantsdienst van hun ministerie de controle op van:
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel22
  - number: 22.1.a
    text: |-
      het gevoerde financieel beheer en de jaarlijkse financiële verantwoordingen daarover; het bepaalde in
      [artikel 51, tweede en derde lid][ref1], is van overeenkomstige toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel51
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '51'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 22.1.b
    text: de administraties die ten behoeve van dat beheer en die verantwoordingen worden gevoerd;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel22
  - number: 22.1.c
    text: het gevoerde materieelbeheer en de daarvan bijgehouden administraties.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel22
  - number: '22.2'
    text: |-
      In overeenstemming met Onze Minister van Financiën en na overleg met de Algemene Rekenkamer kunnen Onze ministers
      op een andere wijze in de controle voorzien.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel22
  - number: '22.3'
    text: |-
      In overeenstemming met Onze Minister van Financiën wijzen Onze ministers het hoofd aan van de accountantsdienst van
      hun ministerie en trekken zij een zodanige aanwijzing in.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel22
  - number: '22.4'
    text: Onze ministers doen schriftelijk mededeling aan de Rekenkamer van een aanwijzing en een intrekking.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel22
  - number: '22.5'
    text: |-
      De resultaten van de controle worden jaarlijks vastgelegd in rapporten die zijn gericht aan Onze betrokken
      minister. Het samenvattende rapport bevat, behalve de belangrijkste bevindingen van de controle, een verklaring
      omtrent de financiële verantwoording.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel22
  - number: '23.1'
    text: |-
      Elke verplichting en uitgaaf enerzijds en elke ontvangst anderzijds wordt op een begrotingsartikel onder de
      verplichtingen en de uitgaven, onderscheidenlijk de ontvangsten geboekt.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel23
  - number: '23.2'
    text: |-
      Onze Minister van Financiën kan categorieën verplichtingen, uitgaven en ontvangsten aanwijzen, die op een rekening
      buiten het begrotingsverband kunnen worden geboekt, indien deze met een ander onderdeel van het Rijk dan wel met
      een derde worden verrekend.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel23
  - number: '23.3'
    text: |-
      Verplichtingen, uitgaven en ontvangsten geboekt op rekeningen buiten het begrotingsverband worden, indien
      verrekening achterwege blijft, geboekt ten laste dan wel ten gunste van begrotingsartikelen van het jaar, waarin
      blijkt dat geen verrekening zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel23
  - number: '23.4'
    text: 'In afwijking van het bepaalde in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel23
  - number: 23.4.a
    text: |-
      kunnen terugbetalingen aan het Rijk op eerder in hetzelfde jaar gedane uitgaven ten gunste worden geboekt van de
      betrokken uitgavenartikelen;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel23
  - number: 23.4.b
    text: |-
      kunnen terugbetalingen door het Rijk van ontvangsten ten laste worden geboekt van de betrokken
      ontvangstenartikelen;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel23
  - number: 23.4.c
    text: |-
      kan, in geval een geldlening geheel of gedeeltelijk wordt aangegaan ter conversie van uitstaande schuld, het bedrag
      van de afgeloste schuld in vergelijking worden gebracht met de opbrengst van de nieuwe geldlening; een daarbij
      blijkend verschil wordt alsdan ten bate of ten laste van de begroting geboekt.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel23
  - number: '23.5'
    text: |-
      De boeking van de verplichtingen en de uitgaven geschiedt ten laste van een begrotingsartikel in elk geval zodanig,
      dat aan de bijgehouden administraties onder meer kunnen worden ontleend:
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel23
  - number: 23.5.a
    text: het deel van de raming van de aan te gane verplichtingen dat daadwerkelijk is aangegaan;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel23
  - number: 23.5.b
    text: het deel van de raming van de uitgaven dat daadwerkelijk tot uitgaven heeft geleid;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel23
  - number: 23.5.c
    text: per individueel aangegane verplichting het deel dat nog niet tot uitgaven heeft geleid;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel23
  - number: 23.5.d
    text: het deel van de raming van de uitgaven waarvoor nog geen verplichtingen zijn aangegaan.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel23
  - number: '23.6'
    text: |-
      Onze Minister van Financiën doet aan de Algemene Rekenkamer schriftelijk mededeling van de aangewezen categorieën,
      bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel23
  - number: '24.1'
    text: |-
      Ter bepaling van het jaar ten laste of ten gunste waarvan een verplichting of een uitgaaf, onderscheidenlijk
      een ontvangst moet worden geboekt, is het bepaalde in [artikel 4, vierde tot en met zesde lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel4
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '4'
        hoofdstuk: I
        paragraaf: '2'
  - number: '24.2'
    text: |-
      In een jaar aangegane verplichtingen, die eerst na het sluiten van de boeken van dat jaar blijken, worden geboekt
      op het overeenkomstige begrotingsartikel in het dan lopende jaar.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel24
  - number: '25.1'
    text: |-
      Onze Minister van Financiën kan categorieën niet-geldelijke betalingen en ontvangsten aanwijzen die als geldelijke
      betalingen onderscheidenlijk ontvangsten worden geboekt.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel25
  - number: '25.2'
    text: Onze Minister van Financiën doet aan de Algemene Rekenkamer schriftelijk mededeling van de aangewezen categorieën.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel25
  - number: '26.1'
    text: |-
      Verrekeningen tussen onderdelen van het Rijk, waarvan de begrotingsartikelen niet tot eenzelfde begroting behoren,
      worden geboekt als geldelijke betalingen en ontvangsten.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel26
  - number: '26.2'
    text: |-
      Het eerste lid kan tevens worden toegepast bij verrekeningen tussen dienstonderdelen waarvan de begrotingsartikelen
      tot eenzelfde begroting behoren, indien het aantoonbaar administratief doelmatig is deze verrekeningen als
      geldelijke betalingen en ontvangsten te boeken.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel26
  - number: '27.1'
    text: |-
      Onze ministers, ieder met betrekking tot de begrotingen waarover hij het beheer voert, verrichten namens de Staat
      de privaatrechtelijke rechtshandelingen die uit het te voeren beheer voortvloeien, tenzij bij of krachtens de wet
      is bepaald dat een van Onze andere ministers de rechtshandeling verricht.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel27
  - number: '27.2'
    text: |-
      Onze Minister van Financiën is belast met het privaatrechtelijke beheer ten aanzien van roerende en onroerende
      zaken die aan de Staat toebehoren dan wel zijn toevertrouwd, een en ander voor zover dat beheer niet bij of
      krachtens de wet aan een of meer van Onze andere ministers is opgedragen.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel27
  - number: '27.3'
    text: |-
      In afwijking van het bepaalde in het eerste lid kunnen de privaatrechtelijke rechtshandelingen, voor zover die
      voortvloeien uit het door Onze Minister van Binnenlandse Zaken op grond van [artikel 16, tweede lid][ref1], te
      voeren beheer over de begroting van de hoge colleges van staat en het Kabinet van de Koning, worden verricht
      door de voorzitters van de beide Kamers der Staten-Generaal, door de vice-president van de Raad van State,
      door de president van de Algemene Rekenkamer, door de Nationale ombudsman, door de kanselier van de Kanselarij
      der Nederlandse Orden en door de directeur van het Kabinet van de Koning, ieder met betrekking tot het
      betrokken onderdeel van die begroting, tenzij bij of krachtens de wet is bepaald dat een van Onze ministers de
      rechtshandeling verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel16
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '16'
        hoofdstuk: II
        paragraaf: '1'
  - number: '27.4'
    text: |-
      Privaatrechtelijke rechtshandelingen kunnen namens Onze ministers dan wel namens degenen genoemd in het derde lid,
      worden verricht, indien zij daartoe een algemene of bijzondere volmacht hebben verleend.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel27
  - number: '28'
    text: |-
      Onze Minister van Financiën sluit overeenkomsten tot het aangaan van geldleningen door de Staat, nadat hij daartoe
      machtiging bij de wet heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel28
  - number: '29.1'
    text: |-
      Het oprichten of mede-oprichten, dan wel het doen oprichten van een privaatrechtelijke rechtspersoon door de
      Staat zal niet eerder plaatsvinden dan 30 dagen nadat van het voornemen daartoe door Onze betrokken minister, in
      overeenstemming met het oordeel van de ministerraad, schriftelijk mededeling is gedaan aan beide Kamers van de
      Staten-Generaal. Het oordeel van de ministerraad wordt door Onze betrokken minister niet gevraagd, dan nadat hij
      met de Algemene Rekenkamer overleg heeft gevoerd over de voorgenomen rechtshandeling.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel29
  - number: '29.2'
    text: |-
      Indien binnen de in het eerste lid genoemde termijn door of namens een der Kamers van de Staten-Generaal of door
      ten minste een vijfde van het grondwettelijk aantal leden van een der Kamers de wens te kennen wordt gegeven nadere
      inlichtingen te ontvangen over de voorgenomen rechtshandeling, zal deze niet eerder plaatsvinden dan nadat deze
      inlichtingen zijn verstrekt. Indien een van beide Kamers binnen 30 dagen na de mededeling, bedoeld in het eerste
      lid, of binnen 14 dagen na het verstrekken van de in dit lid bedoelde inlichtingen, als haar oordeel uitspreekt
      dat de voorgenomen rechtshandeling een voorafgaande machtiging bij de wet behoeft, zal de rechtshandeling eerst
      plaatsvinden nadat die machtiging is verleend.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel29
  - number: '29.3'
    text: |-
      Deelneming door de Staat in een naamloze vennootschap of een besloten vennootschap met beperkte aansprakelijkheid,
      waarvan de Staat ten minste 5% van het geplaatste aandelenkapitaal houdt dan wel door die deelneming zal
      verkrijgen, zal, indien daarmede een groter financieel belang is gemoeid dan een door Onze Minister van Financiën
      vast te stellen bedrag, niet eerder plaatsvinden dan 30 dagen nadat van het voornemen daartoe aan beide Kamers
      van de Staten-Generaal schriftelijk mededeling is gedaan. Het bepaalde in het tweede lid is van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel29
  - number: '29.4'
    text: |-
      Het bepaalde in het derde lid is tevens van toepassing op verstrekking van in aandelen converteerbare leningen
      door de Staat aan een naamloze vennootschap of een besloten vennootschap met beperkte aansprakelijkheid, waarvan de
      Staat ten minste 5% van het geplaatste aandelenkapitaal heeft dan wel door die verstrekking zou verkrijgen in geval
      onmiddellijk conversie zou plaatsvinden, indien met die verstrekking een groter financieel belang is gemoeid dan
      een door Onze Minister van Financiën vast te stellen bedrag.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel29
  - number: '29.5'
    text: |-
      Het bepaalde in het derde en vierde lid is niet van toepassing, indien de Staat met een deelneming of een
      verstrekking niet beoogt zijn relatieve belang in een in die leden bedoelde vennootschap alsdan of in de toekomst
      een verhoging te laten ondergaan.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel29
  - number: '29.6'
    text: |-
      Van andere dan in het derde lid bedoelde deelnemingen, van andere dan in het vierde lid bedoelde verstrekkingen,
      van in het vijfde lid bedoelde deelnemingen en verstrekkingen alsmede van het geheel of gedeeltelijk vervreemden
      van deelnemingen en van in aandelen converteerbare leningen door de Staat doet Onze desbetreffende minister na het
      verrichten van de rechtshandeling schriftelijk mededeling aan beide Kamers van de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel29
  - number: '30'
    text: |-
      Het verrichten namens de Staat van een privaatrechtelijke rechtshandeling met een geldelijk belang geschiedt op een
      wijze die:
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel30
  - number: 30.a
    text: voor de Staat voldoende duidelijk de plichten en rechten van de betrokken partijen bewijsbaar vastlegt;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel30
  - number: 30.b
    text: controleerbaar is;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel30
  - number: 30.c
    text: in het maatschappelijk verkeer wordt geaccepteerd.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel30
  - number: '31'
    text: |-
      De geldigheid van privaatrechtelijke rechtshandelingen wordt niet aangetast indien de bij of krachtens deze wet
      gestelde regels niet worden nageleefd, tenzij het betreft het niet naleven van de regels omtrent de bevoegdheid van
      de handelende personen, gesteld bij of krachtens het bepaalde in de [artikelen 27][ref1] en [28][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0003075#Artikel28
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '27'
        hoofdstuk: II
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0003075
        artikel: '28'
        hoofdstuk: II
        paragraaf: '5'
  - number: '32'
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel32
  - number: 32.a
    text: de taak van de centrale directies financieel-economische zaken;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel32
  - number: 32.b
    text: de plaats en de taak van de accountantsdiensten;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel32
  - number: 32.c
    text: het kasbeheer;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel32
  - number: 32.d
    text: het materieelbeheer.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel32
  - number: '33.1'
    text: Onze Minister van Financiën stelt regels met betrekking tot de verschillende onderdelen van het financiële beheer.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel33
  - number: '33.2'
    text: 'Onze Minister van Financiën kan regels stellen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel33
  - number: 33.2.a
    text: |-
      de taak, bedoeld in [artikel 17, eerste lid, tweede volzin][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel17
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '17'
        hoofdstuk: II
        paragraaf: '1'
  - number: 33.2.b
    text: |-
      de uitoefening van de bevoegdheid, bedoeld in [artikel 17, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel17
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '17'
        hoofdstuk: II
        paragraaf: '1'
  - number: '34'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven met betrekking tot het
      verrichten van privaatrechtelijke rechtshandelingen en kan worden voorgeschreven dat bepaalde privaatrechtelijke
      rechtshandelingen worden verricht in afwijking van het bepaalde in [artikel 27][ref1] en [28][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0003075#Artikel28
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '27'
        hoofdstuk: II
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0003075
        artikel: '28'
        hoofdstuk: II
        paragraaf: '5'
  - number: '35.1'
    text: Onze Minister van Financiën is belast met het toezicht op de uitvoering van de begrotingen.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel35
  - number: '35.2'
    text: Dit toezicht omvat mede de toetsing aan het algemene financiële beleid.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel35
  - number: '36.1'
    text: |-
      Onze Minister van Financiën bepaalt welke gegevens hem ten behoeve van het toezicht, bedoeld in [artikel 35][ref1],
      worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel35
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '35'
        hoofdstuk: III
  - number: '36.2'
    text: |-
      In het kader van het toezicht, bedoeld in [artikel 35][ref1], kan Onze Minister van Financiën begrotingsartikelen
      aanwijzen ten laste waarvan geen verplichtingen mogen worden aangegaan, voordat hij daarmee heeft ingestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel35
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '35'
        hoofdstuk: III
  - number: '37.1'
    text: |-
      Onze Minister van Financiën is belast met het toezicht op de inrichting van de administraties, bedoeld in
      [artikel 20, eerste lid][ref1], en op de wijze waarop deze worden bijgehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel20
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '20'
        hoofdstuk: II
        paragraaf: '3'
  - number: '37.2'
    text: |-
      Onze Minister van Financiën is belast met het toezicht op de inrichting van de controle die plaatsvindt in het
      kader van de uitvoering van de begrotingen.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel37
  - number: '38.1'
    text: |-
      Onze ministers zijn gehouden desgevraagd de inlichtingen te verstrekken die Onze Minister van Financiën voor de
      uitoefening van het toezicht, bedoeld in de [artikelen 35][ref1] en [37][ref2], nodig heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0003075#Artikel37
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '35'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003075
        artikel: '37'
        hoofdstuk: III
  - number: '38.2'
    text: |-
      Onze ministers verlenen Onze Minister van Financiën te allen tijde toegang tot dan wel inzage in alle goederen,
      administraties, documenten en andere informatiedragers.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel38
  - number: '38.3'
    text: |-
      Onze Minister van Financiën wijst de ambtenaren aan die namens hem zijn belast met de uitoefening van de
      bevoegdheden, bedoeld in dit artikel.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel38
  - number: '39.1'
    text: |-
      De Algemene Rekenkamer bestaat uit drie leden in gewone dienst die te zamen het college vormen, alsmede uit ten
      hoogste drie leden in buitengewone dienst. De president wordt uit de leden in gewone dienst bij koninklijk besluit
      benoemd.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel39
  - number: '39.2'
    text: Van een vacature onder de leden geeft de Rekenkamer zo spoedig mogelijk kennis aan Ons en aan de Tweede Kamer.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel39
  - number: '39.3'
    text: |-
      Met de kennisgeving aan de Tweede Kamer wordt meegezonden een door de leden van het college van de Rekenkamer met
      meerderheid van stemmen opgemaakte aanbevelingslijst van zes kandidaten, waarop de Tweede Kamer bij haar voordracht
      zodanig acht zal slaan als haar dienstig voorkomt.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel39
  - number: '40.1'
    text: |-
      De leden in buitengewone dienst kunnen door de president worden opgeroepen om deel te nemen aan bepaalde
      werkzaamheden en hebben alsdan ter zake dezelfde bevoegdheden als de leden in gewone dienst; zij maken dan tevens
      deel uit van het college.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel40
  - number: '40.2'
    text: |-
      De leden in buitengewone dienst vervangen bovendien de leden in gewone dienst bij voorziene afwezigheid of
      ontstentenis.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel40
  - number: '41'
    text: |-
      Aan de Algemene Rekenkamer wordt toegevoegd een secretaris die op voordracht van de Rekenkamer bij koninklijk
      besluit wordt benoemd en ontslagen. Schorsing geschiedt door de Rekenkamer.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel41
  - number: '42.1'
    text: Om tot lid te kunnen worden benoemd, moet men Nederlander zijn en de leeftijd van dertig jaren hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel42
  - number: '42.2'
    text: |-
      De leden en de secretaris mogen geen andere openbare betrekkingen vervullen, aan welke een vaste beloning of
      toelage is verbonden, noch lid zijn van een publiekrechtelijk college, waarvoor de keuze geschiedt bij of krachtens
      wettelijk voorschrift uitgeschreven verkiezingen. Behoudens indien de onverenigbaarheid ook uit een ander wettelijk
      voorschrift voortvloeit kan hiervan bij koninklijk besluit, de Algemene Rekenkamer gehoord, ontheffing worden
      verleend.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel42
  - number: '42.3'
    text: |-
      De leden en de secretaris vervullen overigens geen betrekkingen die ongewenst zijn met het oog op een goede
      vervulling van hun ambt of handhaving van hun onpartijdigheid en onafhankelijkheid of van het vertrouwen daarin.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel42
  - number: '42.4'
    text: De betrekkingen die de leden en de secretaris buiten hun ambt vervullen, worden door de president openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel42
  - number: '43.1'
    text: |-
      Een lid wordt ontslag verleend op eigen verzoek en bij het bereiken van de leeftijd van zeventig jaar. Het ontslag
      gaat in op de eerste dag van de volgende maand.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel43
  - number: '43.2'
    text: |-
      De leden kunnen door de Hoge Raad der Nederlanden worden ontslagen of geschorst.
      [Hoofdstuk 6A van de Wet rechtspositie rechterlijke ambtenaren][ref1], met uitzondering van
      de [artikelen 46b][ref2], [46c, eerste lid, onder b, tweede en derde lid][ref3], [46d][ref4],
      [46i, eerste lid, onder c][ref5], [46k][ref6] en [46q][ref7], is daarbij van overeenkomstige toepassing, met dien
      verstande dat: - de disciplinaire maatregel van schriftelijke waarschuwing wordt opgelegd door de president van de
      Algemene Rekenkamer;
        - in [artikel 46e][ref8] voor «de rechterlijk ambtenaar, tevens zijnde president van het gerechtshof of de
      rechtbank, de president van de Hoge Raad onderscheidenlijk procureur-generaal bij de Hoge Raad,» wordt gelezen« de
      president van de Rekenkamer»;
        - de president van de Rekenkamer als functionele autoriteit wordt aangemerkt;
        - voor «Onze Minister» wordt gelezen «de Minister van Binnenlandse Zaken en Koninkrijksrelaties»;
        - de voordracht bedoeld in de [artikelen 46i, derde lid][ref9], en [46l, tweede lid][ref10], wordt gedaan door
      de Rekenkamer;
        - in [artikel 46p, vijfde en zesde lid][ref11], in plaats van «het betrokken gerecht onderscheidenlijk het parket
      bij de Hoge Raad» wordt gelezen «de Rekenkamer».


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Hoofdstuk6A
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46b
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
      [ref4]: https://wetten.overheid.nl/BWBR0008365#Artikel46d
      [ref5]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref6]: https://wetten.overheid.nl/BWBR0008365#Artikel46k
      [ref7]: https://wetten.overheid.nl/BWBR0008365#Artikel46q
      [ref8]: https://wetten.overheid.nl/BWBR0008365#Artikel46e
      [ref9]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref10]: https://wetten.overheid.nl/BWBR0008365#Artikel46l
      [ref11]: https://wetten.overheid.nl/BWBR0008365#Artikel46p
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0008365
        hoofdstuk: 6A
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46b
      - id: ref3
        bwb_id: BWBR0008365
        artikel: 46c
      - id: ref4
        bwb_id: BWBR0008365
        artikel: 46d
      - id: ref5
        bwb_id: BWBR0008365
        artikel: 46i
      - id: ref6
        bwb_id: BWBR0008365
        artikel: 46k
      - id: ref7
        bwb_id: BWBR0008365
        artikel: 46q
      - id: ref8
        bwb_id: BWBR0008365
        artikel: 46e
      - id: ref9
        bwb_id: BWBR0008365
        artikel: 46i
      - id: ref10
        bwb_id: BWBR0008365
        artikel: 46l
      - id: ref11
        bwb_id: BWBR0008365
        artikel: 46p
  - number: '43.3'
    text: |-
      Grond voor ontslag is voorts dat het lid handelt in strijd met [artikel 42, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel42
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '42'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '44.1'
    text: |-
      De president, de overige leden in gewone dienst, de leden in buitengewone dienst en de secretaris leggen, alvorens
      hun ambt te aanvaarden, in Onze handen de volgende eed (verklaring en belofte) af: "Ik zweer (verklaar) dat ik,
      tot het verkrijgen van mijn aanstelling, middellijk noch onmiddellijk, onder welke naam of welk voorwendsel ook,
      aan iemand iets heb gegeven of beloofd. Ik zweer (verklaar en beloof) dat ik om iets in dit ambt te doen of te
      laten, van niemand enig geschenk of enige belofte heb aangenomen of zal aannemen, middellijk of onmiddellijk.
      Ik zweer (beloof) trouw aan de Koning, dat ik de [Grondwet][ref1] steeds zal helpen onderhouden en mijn ambt met
      eerlijkheid, nauwgezetheid en onpartijdigheid zal vervullen. Zo waarlijk helpe mij God almachtig! (Dat verklaar en
      beloof ik!)".


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '44.2'
    text: |-
      Daartoe door Ons gemachtigd kan ook de president in een vergadering van het college deze eed of de verklaring en
      belofte afnemen van de overige leden in gewone dienst, de leden in buitengewone dienst en de secretaris.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel44
  - number: '45'
    text: |-
      De Algemene Rekenkamer stelt voor haar werkzaamheden een reglement van orde vast. Dit reglement wordt door
      plaatsing in de *Staatscourant* bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel45
  - number: '46.1'
    text: |-
      De president oefent het toezicht uit op de werkzaamheden van de Algemene Rekenkamer en op de juiste toepassing van
      het bij of krachtens dit hoofdstuk bepaalde en van het in het vorige artikel bedoelde reglement van orde.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel46
  - number: '46.2'
    text: |-
      De president brengt alle stukken, welke aan de Rekenkamer of aan hem in zijn hoedanigheid worden toegezonden, voor
      zover zij niet bij het reglement van orde zijn uitgezonderd, ter behandeling in de vergadering van het college.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel46
  - number: '46.3'
    text: |-
      De taken en bevoegdheden van de president worden bij diens afwezigheid of ontstentenis waargenomen door het
      aanwezige lid in gewone dienst, dat het oudste is naar rang van benoeming.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel46
  - number: '47'
    text: |-
      Geen besluiten zullen in de vergadering van het college kunnen worden genomen, indien niet tenminste de meerderheid
      der leden van het college tegenwoordig is. Besluiten worden genomen bij meerderheid van stemmen; wanneer de stemmen
      staken, beslist de stem van de president.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel47
  - number: '48.1'
    text: |-
      De leden en de secretaris mogen niet aanwezig zijn bij de beraadslagingen en het nemen van beslissingen over
      enige zaak, die hen, hun echtgenoten, hun geregistreerde partners, degenen met wie zij duurzaam samenleven of hun
      naastbestaanden tot in de derde graad van bloedverwantschap of aanverwantschap betreffen.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel48
  - number: '48.2'
    text: |-
      Zij mogen niet deelnemen aan het onderzoek van en de beslissing over rekeningen en verantwoordingen die door hen
      worden afgelegd.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel48
  - number: '49.1'
    text: |-
      Het krachtens de [Ambtenarenwet][ref1] bepaalde ten aanzien van de aanstelling en het ontslag van ambtenaren van
      het Rijk is van overeenkomstige toepassing op de ambtenaren van de Algemene Rekenkamer, met dien verstande dat
      voorzover de aanstelling of het ontslag geschiedt bij koninklijk besluit, de Rekenkamer daartoe een voordracht
      doet en in de overige gevallen de Rekenkamer haar ambtenaren aanstelt of ontslaat. Schorsing geschiedt door de
      Rekenkamer.


      [ref1]: https://wetten.overheid.nl/BWBR0001947
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0001947
  - number: '49.2'
    text: De Rekenkamer kan het aanstellen, schorsen en ontslaan van ambtenaren opdragen aan de secretaris.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel49
  - number: '50.1'
    text: |-
      De Algemene Rekenkamer stelt instructies vast voor de secretaris en voor de overige ambtenaren en voor het
      personeel dat bij de Rekenkamer in dienst is op grond van een arbeidsovereenkomst naar burgerlijk recht.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel50
  - number: '50.2'
    text: |-
      Van de ambtenaren wordt door de president hetzij de eed, hetzij de verklaring en belofte afgenomen. Ook voor het
      personeel bedoeld in het vorige lid kan de Rekenkamer voorschrijven dat daarvan hetzij de eed, hetzij de verklaring
      en belofte wordt afgenomen.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel50
  - number: '51.1'
    text: 'De Algemene Rekenkamer onderzoekt:'
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel51
  - number: 51.1.a
    text: het door Onze ministers gevoerde financiële beheer en de jaarlijkse financiële verantwoordingen daarover;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel51
  - number: 51.1.b
    text: de administraties die ten behoeve van dat beheer en die verantwoordingen worden gevoerd;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel51
  - number: 51.1.c
    text: het gevoerde materieelbeheer en de daarvan bijgehouden administraties.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel51
  - number: '51.2'
    text: |-
      Ten aanzien van het gevoerde financiële beheer onderzoekt de Rekenkamer of de verplichtingen, de uitgaven en de
      ontvangsten tot stand zijn gekomen in overeenstemming met de begrotingswetten en met andere wettelijke regelingen
      en of ook overigens zorggedragen is voor een ordelijk en controleerbaar financieel beheer.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel51
  - number: '51.3'
    text: |-
      Ten aanzien van de financiële verantwoordingen onderzoekt de Rekenkamer of deze het gevoerde financiële beheer
      deugdelijk weergeven en overeenkomstig de daarvoor gegeven voorschriften zijn opgesteld.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel51
  - number: '51.4'
    text: |-
      De Rekenkamer legt haar bevindingen en haar oordeel over het gevoerde financiële beheer en de verantwoordingen
      daarover vast in de rapporten, bedoeld in [artikel 67, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel67
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '67'
        hoofdstuk: V
  - number: '52'
    text: |-
      Ten aanzien van de financiële verantwoording van het Rijk onderzoekt de Algemene Rekenkamer of deze verantwoording
      aansluit op de financiële verantwoordingen, bedoeld in [artikel 51, eerste lid][ref1], en overeenkomstig de
      daarvoor gegeven voorschriften is opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel51
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '51'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '53.1'
    text: |-
      Bij het uitoefenen van haar taak kan de Algemene Rekenkamer gebruik maken van de resultaten van door anderen
      verrichte controles, onverminderd haar bevoegdheid tot eigen onderzoek.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel53
  - number: '53.2'
    text: |-
      Onze ministers verstrekken desgevraagd aan de Rekenkamer de controleprogramma’s van hen die met de controle belast
      zijn en lichten haar volledig in omtrent de resultaten van de controle door overlegging van rapporten of op andere
      door de Rekenkamer aan te geven wijze.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel53
  - number: '54.1'
    text: |-
      De Algemene Rekenkamer is bevoegd, voor zover zij een en ander nodig acht voor het uitoefenen van haar taak, bij
      alle dienstonderdelen van het Rijk alle goederen, administraties, documenten en andere informatiedragers op door
      haar aan te geven wijze te onderzoeken.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel54
  - number: '54.2'
    text: |-
      Onze ministers zijn gehouden desgevraagd de inlichtingen te verstrekken die de Rekenkamer voor haar taak nodig
      acht.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel54
  - number: '54.3'
    text: |-
      Het bepaalde in het eerste en tweede lid wordt met betrekking tot de begrotingsartikelen "geheim" verricht door of
      verstrekt aan de president van de Rekenkamer in persoon. Artikel 46, tweede en derde lid, zijn niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel54
  - number: '54.4'
    text: |-
      De president van de Rekenkamer is ten aanzien van de gegevens die hem ter beschikking worden gesteld met betrekking
      tot de begrotingsartikelen "geheim" verplicht tot geheimhouding. Voor zover hij dat van belang acht, deelt hij Onze
      minister wie het aangaat in persoon de resultaten mee van zijn bevindingen.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel54
  - number: '55.1'
    text: |-
      Heeft de Algemene Rekenkamer op grond van haar onderzoek, bedoeld in [artikel 51][ref1], bezwaar met betrekking
      tot het gevoerde financiële beheer of de verantwoording daarover dan deelt zij dit bezwaar mede aan Onze daarbij
      betrokken minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel51
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '51'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '55.2'
    text: |-
      Binnen een maand na ontvangst van deze mededeling stelt Onze betrokken minister de Rekenkamer in kennis van hetgeen
      tot opheffing van haar bezwaar kan leiden.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel55
  - number: '55.3'
    text: |-
      Na afloop van deze termijn neemt de Rekenkamer haar eindbeslissing, waarvan zij mededeling doet aan Onze betrokken
      minister. Indien zij haar bezwaar handhaaft doet zij hiervan tevens mededeling aan Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel55
  - number: '56.1'
    text: |-
      Handhaaft de Algemene Rekenkamer bij haar eindbeslissing haar bezwaar en houdt dit bezwaar in dat bepaalde
      verplichtingen, uitgaven of ontvangsten niet in overeenstemming met de begrotingswet of met andere wettelijke
      regelingen tot stand zijn gekomen, dan wordt binnen twee maanden aan de Tweede Kamer een voorstel tot vaststelling
      van een indemniteitswet gezonden.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel56
  - number: '56.2'
    text: |-
      Als de Rekenkamer na afloop van de in het eerste lid bedoelde termijn niet van een zodanige indiening is gebleken,
      doet zij daarvan mededeling aan de Tweede Kamer.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel56
  - number: '56.3'
    text: |-
      Handhaaft de Rekenkamer bij haar eindbeslissing haar bezwaar en betreft dit een ander bezwaar dan bedoeld in het
      eerste lid, dan maakt zij daarvan melding in het rapport, bedoeld in [artikel 67, tweede lid][ref1]. Tevens kan zij
      daaromtrent een aantekening plaatsen bij de financiële verantwoording van het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel67
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '67'
        hoofdstuk: V
  - number: '56.4'
    text: |-
      Onze betrokken minister maakt in een aanvullende toelichting bij de financiële verantwoording zijn standpunt inzake
      het in het derde lid bedoelde bezwaar kenbaar aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel56
  - number: '57.1'
    text: |-
      De Algemene Rekenkamer wijdt aandacht aan de doelmatigheid van het beheer, de organisatie en het gevoerde beleid
      van het Rijk.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel57
  - number: '57.2'
    text: |-
      Onze ministers stellen de Rekenkamer tijdig op de hoogte van de doelmatigheidsonderzoeken, die zij doen instellen
      en van de resultaten daarvan.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel57
  - number: '57.3'
    text: |-
      De [artikelen 53][ref1] en [54][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0003075#Artikel54
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '53'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003075
        artikel: '54'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '58'
    text: |-
      Op verzoek van elk van de beide kamers van de Staten-Generaal kan de Algemene Rekenkamer bepaalde onderzoeken
      instellen.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel58
  - number: '59.1'
    text: |-
      Onverminderd het anders bij wet bepaalde heeft de Algemene Rekenkamer de in de volgende leden vermelde bevoegdheden
      ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel59
  - number: 59.1.a
    text: |-
      naamloze vennootschappen en besloten vennootschappen met beperkte aansprakelijkheid, waarvan de Staat het gehele of
      nagenoeg het gehele geplaatste aandelenkapitaal houdt;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel59
  - number: 59.1.b
    text: |-
      naamloze vennootschappen en besloten vennootschappen met beperkte aansprakelijkheid, andere dan onder a bedoeld,
      waarvan de Staat tenminste 5% van het geplaatste aandelenkapitaal houdt, indien daarmede een groter financieel
      belang is gemoeid dan een door Onze Minister van Financiën vast te stellen bedrag;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel59
  - number: 59.1.c
    text: |-
      rechtspersonen, commanditaire vennootschappen en vennootschappen onder firma waaraan de Staat of een derde voor
      rekening of risico van de Staat rechtstreeks of middellijk een subsidie, lening of garantie heeft verleend;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel59
  - number: 59.1.d
    text: |-
      rechtspersonen voor zover die een bij of krachtens de wet geregelde taak uitoefenen en daartoe geheel of
      gedeeltelijk worden bekostigd uit de opbrengst van bij of krachtens de wet ingestelde heffingen;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel59
  - number: '59.2'
    text: |-
      Aan de hand van dossiers, aanwezig bij Onze minister wie het aangaat dan wel bij de instelling, bedoeld in het
      achtste lid, kan de Rekenkamer kennis nemen van jaarrekeningen, daarop betrekking hebbende rapporten van hen die
      deze jaarrekeningen hebben gecontroleerd en overige bescheiden, en kan zij bij Onze minister dan wel die instelling
      daarover nadere inlichtingen inwinnen.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel59
  - number: '59.3'
    text: |-
      Indien de bescheiden, bedoeld in het tweede lid, haar daartoe aanleiding geven, of een of meer bescheiden
      ontbreken, is de Rekenkamer bevoegd bij de betrokken rechtspersonen of bij de betrokken commanditaire
      vennootschappen of vennootschappen onder firma daarover nadere inlichtingen in te winnen dan wel van hen het
      overleggen van die bescheiden te vorderen, alsmede, behalve indien het de vennootschappen betreft, bedoeld in
      het eerste lid, onder *b*, of De Nederlandsche Bank NV, mede aan de hand van de administratie van de betrokken
      rechtspersoon of vennootschap dan wel bij de derde die de administratie in opdracht van de rechtspersoon of
      vennootschap voert, een onderzoek in te stellen. Onze minister wie het aangaat wordt door de Rekenkamer van haar
      voornemen een dergelijk onderzoek in te stellen in kennis gesteld. Artikel 54, eerste lid, is van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel59
  - number: '59.4'
    text: |-
      Indien het vennootschappen betreft, bedoeld in het eerste lid, onder *b*, dan wel De Nederlandsche Bank NV,
      geschiedt het vorderen van bescheiden en inwinnen van nadere inlichtingen, bedoeld in het derde lid, door
      tussenkomst van Onze minister en heeft het vorderen van bescheiden uitsluitend betrekking op de jaarrekeningen en
      rapporten, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel59
  - number: '59.5'
    text: |-
      Onverminderd het bepaalde in het tweede lid en onverminderd haar bevoegdheid tot eigen onderzoek maakt de
      Rekenkamer zoveel mogelijk gebruik van de resultaten van door anderen verrichte controles. Het bepaalde in
      [artikel 53, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel53
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '53'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '59.6'
    text: |-
      De Rekenkamer kan haar bevoegdheden uitoefenen zolang als en over de jaren dat de Staat daarbij belang heeft dan
      wel, voor zover het betreft rechtspersonen of commanditaire vennootschappen of vennootschappen onder firma als
      bedoeld onder *d* en *e* van het eerste lid, zolang als en over de jaren dat het algemeen belang dit vordert.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel59
  - number: '59.7'
    text: |-
      De Rekenkamer is in het kader van een onderzoek als bedoeld in het derde lid bevoegd tot het betreden van alle
      plaatsen, niet zijnde woningen, waarvan betreding naar haar oordeel voor de vervulling van haar taak met betrekking
      tot deze wet nodig is. Zonodig verschaft zij zich toegang met behulp van de sterke arm.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel59
  - number: '59.8'
    text: |-
      Een instelling die bij of krachtens de wet is belast met het uitoefenen van controle op een rechtspersoon als
      bedoeld in het eerste lid, onder *d*, licht de Rekenkamer op door deze aan te geven wijze volledig in omtrent de
      controlebevindingen en stelt op aanvraag haar controleprogramma aan de Rekenkamer ter beschikking.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel59
  - number: '59.9'
    text: |-
      Op aanvraag van Onze minister wie het aangaat verstrekt een rechtspersoon, een commanditaire vennootschap of
      vennootschap onder firma of een instelling als bedoeld in het achtste lid zo spoedig mogelijk aan hem afschriften
      van brieven aan de Rekenkamer.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel59
  - number: '59.10'
    text: |-
      De Rekenkamer doet Onze minister wie het aangaat afschrift toekomen van de brieven die zij toezendt aan een
      rechtspersoon, aan een commanditaire vennootschap of vennootschap onder firma of aan een instelling als bedoeld in
      het achtste lid.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel59
  - number: '59.11'
    text: |-
      De Rekenkamer deelt aan Onze minister wie het aangaat, aan de betrokken rechtspersoon of de betrokken commanditaire
      vennootschap of vennootschap onder firma en aan de betrokken instelling als bedoeld in het achtste lid de
      opmerkingen en bedenkingen mee die zij naar aanleiding van haar bevindingen van belang acht. Aan Onze minister kan
      zij ter zake voorstellen doen.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel59
  - number: '59.12'
    text: |-
      De Rekenkamer verstrekt aan Onze Minister van Financiën, Onze minister wie het aangaat en aan de Staten-Generaal
      zodanige mededelingen als zij in het algemeen belang nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel59
  - number: '59.13'
    text: |-
      In geval de Rekenkamer dit in het algemeen belang geboden acht, maakt zij van haar bevindingen melding in een
      rapport of het verslag, bedoeld in [artikel 62, eerste onderscheidenlijk tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel62
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '59.14'
    text: |-
      Van gegevens en bevindingen die naar hun aard vertrouwelijk zijn, maakt de Rekenkamer in afwijking
      van het bepaalde in het dertiende lid geen melding in een rapport of het verslag, bedoeld in
      [artikel 62, eerste onderscheidenlijk tweede lid][ref1]. Mededelingen aan de Staten-Generaal als bedoeld in het
      twaalfde lid die zodanige gegevens of bevindingen bevatten, verstrekt zij ter vertrouwelijke kennisneming.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel62
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '59.15'
    text: |-
      Voor de toepassing van dit artikel wordt onder de rechtspersonen, commanditaire vennootschappen
      en vennootschappen onder firma, bedoeld in het eerste lid, onder *c*, niet verstaan de ingevolge
      [artikel 52, tweede lid, onder ][ref1] (*Stb.* 1992, 722) geregistreerde kredietinstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel52
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '52'
  - number: '59.16'
    text: |-
      Dit artikel is niet van toepassing op provincies, gemeenten, rechtspersoonlijkheid bezittende lichamen, bedoeld
      in [artikel 8, eerste lid, van de Wet gemeenschappelijke regelingen][ref1] (*Stb.* 1984, 669), voor zover deze
      niet bij de wet zijn ingesteld, op waterschappen, op openbare lichamen voor beroep en bedrijf en op de Kamers van
      Koophandel en Fabrieken.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '8'
  - number: '60'
    text: |-
      Indien de zorg voor een administratie aan een derde wordt uitbesteed, dan is de Algemene Rekenkamer bevoegd
      mede aan de hand van de administratie van de betrokken derde dan wel bij degene die de administratie in opdracht
      van die derde voert een onderzoek in te stellen, waarbij het bepaalde in [artikel 54, eerste lid][ref1], van
      overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel54
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '54'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '61.1'
    text: |-
      De Algemene Rekenkamer deelt Onze ministers wie het aangaan de opmerkingen en bedenkingen mee die zij naar
      aanleiding van haar werkzaamheden van belang acht. Zij kan daarbij ter zake voorstellen doen.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel61
  - number: '61.2'
    text: |-
      De Rekenkamer verstrekt aan Onze betrokken ministers, Onze Minister van Financiën en aan de Staten-Generaal
      zodanige mededelingen als zij nodig oordeelt. Zij kan naar aanleiding daarvan met hen nader overleg plegen.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel61
  - number: '62.1'
    text: |-
      De Algemene Rekenkamer brengt de rapporten die zij vaststelt over haar onderzoek ter kennis aan Ons en aan de
      Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel62
  - number: '62.2'
    text: |-
      De Rekenkamer biedt Ons en de Staten-Generaal voor 1 april van elk jaar een verslag aan van haar werkzaamheden in
      het daaraan voorafgaande jaar.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel62
  - number: '63.1'
    text: |-
      Onze minister wie het aangaat, voert overleg met Onze Minister van Financiën en met de Algemene Rekenkamer, over de
      bij of krachtens de wet te stellen regels die betrekking hebben op de taken en of bevoegdheden van de Rekenkamer.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel63
  - number: '63.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing, indien bij de oprichting van een rechtspersoon als bedoeld
      in [artikel 29, eerste lid][ref1], ten aanzien van deze rechtspersoon taken en of bevoegdheden ontstaan voor de
      Rekenkamer.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel29
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '29'
        hoofdstuk: II
        paragraaf: '5'
  - number: '63.3'
    text: |-
      Onze Minister van Financiën voert overleg met de Rekenkamer inzake de bij of krachtens deze wet te stellen regels,
      met uitzondering van de regels, bedoeld in de [artikelen 15][ref1] en [69][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003075#Artikel69
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '15'
        hoofdstuk: I
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0003075
        artikel: '69'
        hoofdstuk: V
  - number: '63.4'
    text: Van de gestelde regels wordt door Onze betrokken minister mededeling gedaan aan de Rekenkamer.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel63
  - number: '64'
    text: |-
      Onze Minister van Financiën biedt uiterlijk op 1 maart na afloop van elk jaar aan de Staten-Generaal de voorlopige
      rekening aan, waarin een overzicht wordt gegeven van de voorlopige stand van de gerealiseerde bedragen aan uitgaven
      en ontvangsten.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel64
  - number: '65.1'
    text: |-
      Onze ministers, ieder met betrekking tot de begroting waarover hij het beheer voert, maken over elk jaar de
      financiële verantwoording op.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel65
  - number: '65.2'
    text: 'De financiële verantwoording bevat:'
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel65
  - number: 65.2.a
    text: de rekening van verplichtingen, uitgaven en ontvangsten, voorzien van een toelichting;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel65
  - number: 65.2.b
    text: de op deze rekening aansluitende saldibalans per 31 december, voorzien van een toelichting.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel65
  - number: '65.3'
    text: |-
      De rekening van verplichtingen, uitgaven en ontvangsten wijst, indien wenselijk in afgeronde bedragen, per
      begrotingsartikel in elk geval aan:
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel65
  - number: 65.3.a
    text: |-
      de aanvankelijke raming, bedoeld in [artikel 4, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel4
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '4'
        hoofdstuk: I
        paragraaf: '2'
  - number: 65.3.b
    text: de onderscheiden wijzigingen in de raming aangebracht bij wet;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel65
  - number: 65.3.c
    text: het gerealiseerde bedrag.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel65
  - number: '65.4'
    text: 'De toelichting bij de rekening vermeldt met betrekking tot elk begrotingsartikel in elk geval:'
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel65
  - number: 65.4.a
    text: |-
      een uiteenzetting over het gerealiseerde beleid, waarbij met name aandacht wordt besteed aan afwijkingen en
      aanpassingen ten opzichte van het voorgenomen beleid;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel65
  - number: 65.4.b
    text: |-
      een uiteenzetting over de gerealiseerde activiteiten, prestaties en effecten, indien deze in belangrijke mate
      afwijken van de gegevens met betrekking tot de beoogde activiteiten, prestaties en effecten, vermeld in de memorie
      van toelichting bij het voorstel van wet tot vaststelling van de begroting;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel65
  - number: 65.4.c
    text: |-
      in aansluiting op de splitsing van de begrotingsartikelen, bedoeld in [artikel 7, aanhef en onder ][ref1], de
      uitkomsten met betrekking tot de betrokken artikelonderdelen, waarbij deze uitkomsten worden gesteld naast de
      ramingen voor het betrokken jaar;


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel7
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '7'
        hoofdstuk: I
        paragraaf: '2'
  - number: 65.4.d
    text: |-
      andere cijfermatige gegevens die het inzicht in het gerealiseerde beleid kunnen bevorderen, waaronder in elk geval
      een overzicht van de verdeling van de bedragen voor loonbijstelling en prijsbijstelling vanuit de administratieve
      begrotingsartikelen, bedoeld in [artikel 5, negende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel5
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '5'
        hoofdstuk: I
        paragraaf: '2'
  - number: '65.5'
    text: |-
      Onze ministers zenden de financiële verantwoording, te zamen met de samenvattende rapporten, bedoeld in
      [artikel 22, vijfde lid][ref1], uiterlijk op 23 april van het jaar volgend op het begrotingsjaar aan Onze Minister
      van Financiën.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel22
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '22'
        hoofdstuk: II
        paragraaf: '3'
  - number: '66.1'
    text: Onze Minister van Financiën stelt over elk jaar de financiële verantwoording van het Rijk samen.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel66
  - number: '66.2'
    text: 'De financiële verantwoording van het Rijk bevat:'
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel66
  - number: 66.2.a
    text: de rekening van uitgaven en ontvangsten van het Rijk, zo nodig voorzien van een toelichting;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel66
  - number: 66.2.b
    text: de op deze rekening aansluitende saldibalans van het Rijk per 31 december, zo nodig voorzien van een toelichting.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel66
  - number: '67.1'
    text: |-
      Onze Minister van Financiën zendt uiterlijk op 15 mei van het jaar volgend op het begrotingsjaar aan de Algemene
      Rekenkamer:
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel67
  - number: 67.1.a
    text: |-
      de financiële verantwoordingen, bedoeld in [artikel 65, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel65
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '65'
        hoofdstuk: V
  - number: 67.1.b
    text: |-
      de samenvattende rapporten, bedoeld in [artikel 22, vijfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel22
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '22'
        hoofdstuk: II
        paragraaf: '3'
  - number: 67.1.c
    text: de opmerkingen waartoe de onder *a* bedoelde stukken hem eventueel aanleiding geven;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel67
  - number: 67.1.d
    text: |-
      de financiële verantwoording van het Rijk, bedoeld in [artikel 66, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel66
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '66'
        hoofdstuk: V
  - number: '67.2'
    text: |-
      De Rekenkamer stelt met betrekking tot elke financiële verantwoording, bedoeld in [artikel 65, eerste lid][ref1],
      een rapport op van het door haar verrichte onderzoek, bedoeld in [artikel 51][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0003075#Artikel51
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '65'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0003075
        artikel: '51'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '67.3'
    text: |-
      De Rekenkamer stelt met betrekking tot de financiële verantwoording van het Rijk, bedoeld in
      [artikel 66, eerste lid][ref1], een verklaring van goedkeuring op.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel66
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '66'
        hoofdstuk: V
  - number: '67.4'
    text: |-
      De verklaring van goedkeuring wordt gegeven onder voorbehoud van de vaststelling van de slotwetten, bedoeld in
      [artikel 10, tweede lid, aanhef en onder ][ref1], en in voorkomende gevallen onder voorbehoud van de vaststelling
      van een indemniteitswet, bedoeld in [artikel 56][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003075#Artikel56
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '10'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003075
        artikel: '56'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '68.1'
    text: |-
      De Algemene Rekenkamer zendt de rapporten, bedoeld in [artikel 67, tweede lid][ref1], en de verklaring van
      goedkeuring, bedoeld in [artikel 67, derde lid][ref2], uiterlijk op 1 september van het jaar volgend op het
      begrotingsjaar aan de Staten-Generaal, alsmede aan Onze betrokken ministers. Indien de Rekenkamer haar onderzoek
      van een financiële verantwoording op uiterlijk 1 september nog niet heeft afgesloten, zendt zij op die datum
      in plaats van een rapport een mededeling omtrent de stand van haar onderzoek. In dat geval wordt het betrokken
      rapport, alsmede de verklaring van goedkeuring zo spoedig mogelijk nagezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0003075#Artikel67
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '67'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0003075
        artikel: '67'
        hoofdstuk: V
  - number: '68.2'
    text: |-
      Ter verlening van decharge aan Onze betrokken ministers over het gevoerde financiële beheer met betrekking
      tot een begrotingsjaar zendt Onze Minister van Financiën uiterlijk op 1 september van het jaar volgend op het
      begrotingsjaar aan de Staten-Generaal:
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel68
  - number: 68.2.a
    text: |-
      de financiële verantwoordingen, bedoeld in [artikel 65, eerste lid][ref1], in voorkomende gevallen voorzien van een
      aanvullende toelichting als bedoeld in [artikel 56, vierde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0003075#Artikel56
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '65'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0003075
        artikel: '56'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 68.2.b
    text: |-
      de financiële verantwoording, bedoeld in [artikel 66, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel66
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '66'
        hoofdstuk: V
  - number: '68.3'
    text: 'Gelijktijdig met de stukken, bedoeld in het tweede lid, zendt Onze Minister van Financiën aan de Staten-Generaal:'
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel68
  - number: 68.3.a
    text: |-
      een uiteenzetting over het in het afgelopen jaar gevoerde financiële beheer en over de resultaten van de
      accountantscontrole bij het Rijk;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel68
  - number: 68.3.b
    text: |-
      in voorkomende gevallen een overzicht van de financiële verantwoordingen die, in afwijking van het bepaalde in
      dit artikel, tweede lid, niet uiterlijk op 1 september aan de Staten-Generaal zijn of worden gezonden, met een
      verklaring van de reden daarvan;
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel68
  - number: 68.3.c
    text: |-
      in voorkomende gevallen een overzicht van de voorstellen van een slotwet die in afwijking van het bepaalde in
      [artikel 10, tweede lid, aanhef en onder ][ref1], niet uiterlijk op 1 september bij de Tweede Kamer zijn of worden
      ingediend, met een verklaring van de reden daarvan;


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel10
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '10'
        hoofdstuk: I
        paragraaf: '2'
  - number: 68.3.d
    text: |-
      in voorkomende gevallen een overzicht van de voorstellen van een indemniteitswet, bedoeld in [artikel 56][ref1],
      die op 1 september nog niet zijn ingediend, met een verklaring van de reden daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel56
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '56'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '69'
    text: |-
      Onze Minister van Financiën kan regels stellen met betrekking tot de totstandkoming en de inrichting van de
      financiële verantwoording, bedoeld in [artikel 65][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel65
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '65'
        hoofdstuk: V
  - number: '70.1'
    text: |-
      Indien voor een dienstonderdeel van een ministerie een afwijkend beheer wenselijk is, kunnen Onze betrokken
      minister en Onze Minister van Financiën, in afwijking van [artikel 4, tweede lid][ref1], besluiten aan dat
      dienstonderdeel toe te staan onder bepaalde voorwaarden de begroting en de financiële verantwoording in te richten
      op basis van een stelsel van baten en lasten. Een zodanig besluit wordt genomen in overeenstemming met het oordeel
      van de ministerraad.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel4
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '4'
        hoofdstuk: I
        paragraaf: '2'
  - number: '70.2'
    text: |-
      Een zodanig besluit wordt niet eerder genomen dan 30 dagen nadat het voornemen daartoe schriftelijk ter kennis
      is gebracht van de Tweede Kamer van de Staten-Generaal. Indien binnen deze termijn door of namens de Kamer of
      door tenminste een vijfde van het grondwettelijk aantal leden van de Kamer de wens te kennen wordt gegeven nadere
      inlichtingen te ontvangen over het voorgenomen besluit, wordt het besluit niet eerder genomen dan nadat deze
      inlichtingen zijn verstrekt. Indien de Kamer binnen 30 dagen na ontvangst van de kennisgeving, bedoeld in de eerste
      volzin, of binnen 14 dagen na het verstrekken van de in de tweede volzin bedoelde inlichtingen zich uitspreekt
      tegen het voorgenomen besluit, wordt het besluit niet genomen.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel70
  - number: '70.3'
    text: |-
      Aan de schriftelijke kennisgeving, bedoeld in het tweede lid, kan worden ontleend in hoeverre aan de voorwaarden,
      bedoeld in het eerste lid, is voldaan.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel70
  - number: '70.4'
    text: Onze betrokken minister doet van een zodanig besluit afschrift toekomen aan de Algemene Rekenkamer.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel70
  - number: '71.1'
    text: |-
      De betalingen van het betrokken ministerie aan een dienst die een baten-lastenstelsel voert, hierna te noemen:
      een baten-lastendienst, evenals de betalingen van een baten-lastendienst aan het betrokken ministerie, worden door
      het ministerie ten laste onderscheidenlijk ten gunste van een of meer begrotingsartikelen van het desbetreffende
      hoofdbeleidsterrein gebracht.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel71
  - number: '71.2'
    text: |-
      De begroting van een ministerie bevat voor elke baten-lastendienst dat onder het betrokken ministerie ressorteert
      tevens het totaal van de geraamde baten, van de geraamde lasten, het saldo van baten en lasten, het totaal van de
      geraamde kapitaaluitgaven en van de geraamde kapitaalontvangsten.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel71
  - number: '71.3'
    text: |-
      Tot de uitgaven en ontvangsten in een jaar van een baten-lastendienst en van het ministerie waaronder het
      ressorteert worden, behalve die bedoeld in [artikel 4, vierde lid][ref1], ook gerekend de verrekeningen tussen de
      baten-lastendienst en dat ministerie.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel4
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '4'
        hoofdstuk: I
        paragraaf: '2'
  - number: '71.4'
    text: |-
      In afwijking van het bepaalde in [artikel 10, tweede lid][ref1], mogen alle wijzigingen in de bedragen,
      bedoeld in het derde lid van dit artikel, worden opgenomen in de voorstellen van een slotwet, bedoeld in
      [artikel 10, tweede lid, aanhef en onder ][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003075#Artikel10
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '10'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003075
        artikel: '10'
        hoofdstuk: I
        paragraaf: '2'
  - number: '72'
    text: |-
      De financiële verantwoording, bedoeld in [artikel 65, eerste lid][ref1], bevat per dienst die een baten-
      lastenstelsel voert een onderdeel omtrent de financiële verantwoording van die dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel65
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '65'
        hoofdstuk: V
  - number: '73'
    text: |-
      Onze Minister van Financiën stelt zo nodig nadere regels met betrekking tot diensten die een baten-lastenstelsel
      voeren in het algemeen, dan wel één of enkele agentschappen in het bijzonder.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel73
  - number: '74.1'
    text: |-
      Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kan, ingeval buitengewone omstandigheden
      dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President, [artikel 74][ref3] in
      werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003075#Artikel74a
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0003075
        artikel: 74a
        hoofdstuk: VII
  - number: '74.2'
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepaling.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel74
  - number: '74.3'
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan wordt bij koninklijk besluit, op voordracht van
      Onze Minister-President, de bepaling die ingevolge het eerste lid in werking is gesteld, onverwijld buiten werking
      gesteld.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel74
  - number: '74.4'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, wordt de bepaling die ingevolge het eerste lid
      in werking is gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel74
  - number: '74.5'
    text: |-
      Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel74
  - number: '74.6'
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel74
  - number: 74a
    text: |-
      Onze Minister van Financiën kan regels stellen in afwijking van het bepaalde in deze wet en in de wetten, bedoeld
      in [artikel 2, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel2
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel74a
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '2'
        hoofdstuk: I
        paragraaf: '1'
  - number: '75'
    text: 'Deze wet kan worden aangehaald onder de titel: Comptabiliteitswet.'
    url: https://wetten.overheid.nl/BWBR0003075/2002-01-01#Artikel75
