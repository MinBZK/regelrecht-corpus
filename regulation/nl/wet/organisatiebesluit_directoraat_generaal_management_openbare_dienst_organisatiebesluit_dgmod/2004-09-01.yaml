preamble:
  text: |-
    Gelet op artikel 4:2 van het Organisatiebesluit BZK 2003;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0015585/2004-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

        - het Ministerie: het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties;
        - minister: de Minister van Binnenlandse Zaken en Koninkrijksrelaties of de Minister voor Bestuurlijke Vernieuwing
      en Koninkrijksrelaties.
        - de directeur-generaal: de directeur-generaal Management Openbare Dienst.
    url: https://wetten.overheid.nl/BWBR0015585/2004-09-01#Artikel1
  - number: '2'
    text: |-
      Dit besluit heeft betrekking op het directoraat-generaal Management Openbare Dienst, genoemd in het
      [Organisatiebesluit BZK 2003][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015590
    url: https://wetten.overheid.nl/BWBR0015585/2004-09-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015590
  - number: 3:1
    text: |-
      De stafafdeling Management en Personeelsbeleid bestaat uit de volgende onderdelen:

        - de sector Coördinatie Logistiek en Administratie (CLA);
        - de sector Financiën Planning en Control (FPC);
        - de sector Personeel en Organisatie (PO);
        - de sector Informatievoorziening Automatisering en Documentbeheer (IAD).
    url: https://wetten.overheid.nl/BWBR0015585/2004-09-01#Artikel31
  - number: 3:2
    text: |-
      1 De sector Coördinatie Logistiek en Administratie staat onder leiding van een hoofd, tevens hoofd van de
      stafafdeling.

      2 De sector heeft, met inachtneming van [artikel 3:15, tweede lid, van het Organisatiebesluit BZK 2003][ref1], de
      volgende taken:

      a) coördinatie van beheersaangelegenheden en besluitvormingsprocedures;

      b) coördinatie van beleidsinhoudelijke cycli, voor zover dit de diensteenheden te boven gaat;

      c) procesbewaking;

      d) managementondersteuning;

      e) aanschaffingsbeleid en huisvestingszaken;

      f) het voeren van het secretariaat van de ondernemingsraad en het overleg met de bestuurder.


      [ref1]: https://wetten.overheid.nl/BWBR0015590#Artikel315
    url: https://wetten.overheid.nl/BWBR0015585/2004-09-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0015590
        artikel: 3:15
  - number: 3:3
    text: |-
      1 De sector Financiën Planning en Control staat onder leiding van een hoofd en een plaatsvervangend hoofd.

      2 De sector heeft, met inachtneming van [artikel 3:15, tweede lid, van het Organisatiebesluit BZK 2003][ref1], de
      volgende taken:

      a) het aangeven van de financiële en bedrijfseconomische consequenties van de algemene en specifieke beleidsplannen
      in relatie tot de beschikbaar gestelde financiële middelen door middel van advies, onderbouwing, onderzoek en
      evaluatie;

      b) het bewaken van de inzet van de middelen en het verzorgen van periodieke managementrapportages daarover;

      c) het mede opstellen, integreren, beoordelen en adviseren over de begrotingsvoorstellen, de nadere toelichting
      daarop en de onderbouwing daarvan in het kader van de jaarlijkse begroting, alsmede de verdeling van de financiële
      middelen en de algemene controle op de uitvoering ervan;

      d) het zorgdragen voor het uitvoeren van het financieel-administratief beheer over de ter beschikking gestelde
      financiële middelen;

      e) het adviseren over financieel-economische aangelegenheden aan de leiding;

      f) het zorgdragen voor een goede uitvoering, implementatie van en beheer over de administratieve organisatie en de
      interne controle hierop.

      g) vertegenwoordiging in de (inter-)departementale samenwerkingsverbanden en overlegstructuren op het gebied van
      de sector.


      [ref1]: https://wetten.overheid.nl/BWBR0015590#Artikel315
    url: https://wetten.overheid.nl/BWBR0015585/2004-09-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0015590
        artikel: 3:15
  - number: 3:4
    text: |-
      1 De sector Personeel en Organisatie staat onder leiding van een hoofd.

      2 De sector heeft, met inachtneming van [artikel 3:15, tweede lid, van het Organisatiebesluit BZK 2003][ref1], de
      volgende taken:

      a) het adviseren van de leiding inzake het personeels- en organisatiebeleid;

      b) het ontwikkelen, implementeren en evalueren van het personeelsbeleid, inhoud geven aan wensen van de leiding;

      c) het verrichten van ondersteunende, coördinerende en controlerende werkzaamheden met betrekking tot het formatie-
      en begrotingsbeheer;

      d) het ondersteunen van diensthoofden bij het opstellen van formatievoorstellen en het afhandelen van bezwaren in
      het kader van de bezwarenregeling functiewaardering;

      e) het opstellen en uitvoeren van personeelsmutaties en de controle hierop;

      f) het beheren van de personeelsinformatie en het verzorgen van de managementrapportages;

      g) vertegenwoordiging in de (inter-)departementale samenwerkingsverbanden en overlegstructuren op het gebied van
      de sector.


      [ref1]: https://wetten.overheid.nl/BWBR0015590#Artikel315
    url: https://wetten.overheid.nl/BWBR0015585/2004-09-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0015590
        artikel: 3:15
  - number: 3:5
    text: |-
      1 De sector Informatievoorziening Automatisering en Documentbeheer staat onder leiding van een hoofd.

      2 De sector heeft, met inachtneming van [artikel 3:15, tweede lid, van het Organisatiebesluit BZK 2003][ref1], de
      volgende taken:

      a) de informatievoorziening;

      b) documentbeheer, postafhandeling en ordening;

      c) beleidsontwikkeling en formulering op bovengenoemde terreinen;

      d) vertegenwoordiging in de (inter-)departementale samenwerkingsverbanden en overlegstructuren op het gebied van
      de sector.


      [ref1]: https://wetten.overheid.nl/BWBR0015590#Artikel315
    url: https://wetten.overheid.nl/BWBR0015585/2004-09-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0015590
        artikel: 3:15
  - number: 4:1
    text: |-
      De directie Arbeidszaken Overheid bestaat uit de volgende onderdelen:

        - de afdeling secretariaat Verbond Sectorwerkgevers Overheid (S);
        - de afdeling Arbeidsverhoudingen en Juridische Zaken (J);
        - de afdeling Uitkeringen en Pensioenen (U);
        - de afdeling Internationale Zaken (I);
        - de afdeling Arbeidsvoorwaarden en arbeidsmarktbeleid (A);
        - de afdeling Economische en Bestuurlijke politiek (EB).
    url: https://wetten.overheid.nl/BWBR0015585/2004-09-01#Artikel41
  - number: 4:2
    text: |-
      1 Het secretariaat Verbond Sectorwerkgevers Overheid staat onder leiding van een hoofd en een plaatsvervangend
      hoofd.

      2 Het secretariaat heeft tot taak:

      a) het verlenen van inhoudelijke en administratieve ondersteuning ten behoeve van het Verbond Sectorwerkgevers
      Overheid (VSO);

      b) het verlenen van inhoudelijke en administratieve ondersteuning ten behoeve van de Adviescommissie
      Overheidspersoneelsbeleid (AOP) en het adjunct-secretariaat van de Raad voor de Rijksdienst en
      Inkomensaangelegenheden (RRDIA).
    url: https://wetten.overheid.nl/BWBR0015585/2004-09-01#Artikel42
  - number: 4:3
    text: |-
      1 De afdeling Arbeidsverhoudingen en Juridische Zaken staat onder leiding van een hoofd en een plaatsvervangend
      hoofd.

      2 De afdeling heeft de volgende taken:

      a) het ontwikkelen van beleid en regelgeving en advisering met betrekking tot de arbeidsverhoudingen, de
      arbeidsomstandigheden en alle zaken die de overheid als wetgever (mede) voor het overheidspersoneel wil regelen;

      b) het ontwikkelen van beleid en regelgeving en advisering met betrekking tot de pensioenen van gewezen politieke
      functionarissen en hun nagelaten betrekkingen;

      c) het ontwikkelen van beleid en regelgeving en advisering met betrekking tot de rechtspositie en pensioenen van
      gewezen burgerlijke en militair personeel van de voormalige gebiedsdelen alsmede de Nederlandse Antillen en Aruba
      en van hun nagelaten betrekkingen;

      d) het bewaken van de juridische functie binnen de directie en binnen het directoraat-generaal.
    url: https://wetten.overheid.nl/BWBR0015585/2004-09-01#Artikel43
  - number: 4:4
    text: |-
      1 De afdeling Uitkeringen en Pensioenen staat onder leiding van een hoofd en een plaatsvervangend hoofd.

      2 De afdeling heeft de volgende taken:

      a) het ontwikkelen van beleid en regelgeving en advisering ten behoeve van de coördinerend minister voor het
      overheidspersoneelsbeleid met betrekking tot de pensioen van gewezen burgerlijk overheidspersoneel en hun nagelaten
      betrekkingen;

      b) het ontwikkelen van beleid en advisering ten behoeve van de coördinerend minister voor het
      overheidspersoneelsbeleid met betrekking tot de sociale zekerheid;

      c) het bouwen en onderhouden van een kenniscentrum sociale zekerheid en pensioenen.
    url: https://wetten.overheid.nl/BWBR0015585/2004-09-01#Artikel44
  - number: 4:5
    text: |-
      1 De afdeling Internationale Zaken staat onder leiding van een hoofd en een plaatsvervangend hoofd.

      2 De afdeling heeft de volgende taken:

      a) het behartigen van de Nederlandse inbreng bij het personeelsbeleid en arbeidsvoorwaarden van de internationale
      organisaties waarvan Nederland lid is;

      b) het leveren van een bijdrage aan de bevordering van de instroom van Nederlanders in Internationale Organisaties
      met als doel het aandeel Nederlanders bij deze organisaties op peil te houden;

      c) het coördineren van internationale aangelegenheden van het directoraat-generaal, waaronder de informele DG-
      conferentie van de directoraten-generaal van de lidstaten en de EU die verantwoordelijk zijn voor de openbare
      dienst.
    url: https://wetten.overheid.nl/BWBR0015585/2004-09-01#Artikel45
  - number: 4:6
    text: |-
      1 De afdeling Arbeidsvoorwaarden en Arbeidsmarktbeleid staat onder leiding van een hoofd en beleidsveldmanagers.

      2 De afdeling heeft de volgende taken:

      a) zorgdragen voor coördinatie inzake de arbeidsvoorwaarden van overheidspersoneel en de waarborging van de
      personeelsvoorziening van overheidsorganisaties;

      b) verantwoording dragen voor de beleidsontwikkeling ten aanzien van de financiering van de arbeidsvoorwaarden van
      overheidswerknemers en het beleid inzake de overheidsarbeidsmarkt;

      c) namens de minister optreden als vertegenwoordiger bij de CAO-onderhandelingen van de kabinetssectoren (Rijk,
      Rechtelijke Macht, Defensie, Onderwijs en Politie);

      d) in het kader van de vertegenwoordiging van het ministerie bij de CAO-onderhandelingen zorg dragen voor een
      strategisch kennismanagement en het ontwikkelen en onderhouden van een kennisinfrastructuur.
    url: https://wetten.overheid.nl/BWBR0015585/2004-09-01#Artikel46
  - number: 4:7
    text: |-
      1 De afdeling Economische en Bestuurlijke Politiek staat onder leiding van een hoofd en een plaatsvervangend hoofd.

      2 De afdeling heeft de volgende taken:

      a) het adviseren en bijdragen aan het kabinetsbeleid op het terrein van algemene macro-economische, inkomens-,
      werkgelegenheids- en financiële vraagstukken;

      b) het coördineren van de macro-economische advisering binnen het ministerie;

      c) het onderhouden van het sectorenmodel (het stelsel van arbeidsvoorwaardenoverleg bij de overheid) en
      structureren van de daarbij behorende informatievoorziening;

      d) het adviseren over en onderzoeken naar sturingsmodellen m.b.t. de bekostiging van de factor arbeid bij
      overheidsinstellingen en de daaraan gerelateerde efficiency- en kwaliteitsvragen;

      e) het coördineren van het tot stand komen van de jaarlijkse Trendnota Arbeidszaken Overheid.
    url: https://wetten.overheid.nl/BWBR0015585/2004-09-01#Artikel47
  - number: 5:1
    text: |-
      De directie Informatiebeleid Openbare Sector bestaat uit de volgende onderdelen:

        - de afdeling Infrastructuur en Continuïteit (I&C);
        - de afdeling Dienstverlening en Toegankelijkheid (D&T);
        - de afdeling Informatierelaties en Strategisch Beleid (ISB).
    url: https://wetten.overheid.nl/BWBR0015585/2004-09-01#Artikel51
  - number: 5:2
    text: |-
      1 De afdeling Infrastructuur en Continuïteit staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a) het ontwikkelen van beleid en het coördineren van de elektronische infrastructuur;

      b) het bevorderen van informatiebeveiliging;

      c) het ontwikkelen van digitale duurzaamheid.
    url: https://wetten.overheid.nl/BWBR0015585/2004-09-01#Artikel52
  - number: 5:3
    text: |-
      1 De afdeling Dienstverlening en Toegankelijkheid staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a) het verbeteren van elektronische publieke toegankelijkheid van overheidsinformatie voor burger, overheid en
      bedrijfsleven en het bevorderen van interactieve beleidsvorming;

      b) het verbeteren van de elektronische publieke dienstverlening aan burger en bedrijfsleven;

      c) het coördineren van de realisatie van het Actieprogramma Elektronische Overheid.
    url: https://wetten.overheid.nl/BWBR0015585/2004-09-01#Artikel53
  - number: 5:4
    text: |-
      1 De afdeling Informatierelaties en Strategisch Beleid staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a) het ontwikkelen van strategisch ICT-beleid;

      b) het verzamelen van (inter)nationale kennis op gebied van ICT;

      c) het initiëren en begeleiden van wetenschappelijk onderzoek.
    url: https://wetten.overheid.nl/BWBR0015585/2004-09-01#Artikel54
  - number: 6:1
    text: |-
      De directie Personeelsmanagement Rijksdienst bestaat uit de volgende onderdelen:

        - de afdeling Arbeidsmarktbeleid en Beroepskwaliteit (AB);
        - de afdeling Financiën en Informatie (F&I);
        - de afdeling Arbeidsvoorwaarden (AV);
        - de afdeling Pensioenen, Sociale Zekerheid en Zorg (PSZ);
        - de afdeling Formatiemanagement Rijksdienst (FMR).
    url: https://wetten.overheid.nl/BWBR0015585/2004-09-01#Artikel61
  - number: 6:2
    text: |-
      1 De afdeling Arbeidsmarktbeleid en Beroepskwaliteit staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a) het opbouwen van kennis en het onderzoek en van de arbeidsmarktpositie van de sector Rijk;

      b) het ontwikkelen van beleidsvoorstellen ter versterking van de arbeidsmarktpositie van de sector Rijk, in het
      bijzonder de voorbereiding en uitvoering van een arbeidsmarkt communicatiestrategie;

      c) het zorgdragen voor het behoud en versterken van de diversiteit in het personeelsbestand door de bevordering
      van arbeidsmarktparticipatie;

      d) het scheppen van voorwaarden ter versterking van de ambtelijke professie binnen de sector Rijk;

      e) bijdrage leveren aan de bevordering van interdepartementale mobiliteit;

      f) toezicht houden en ondersteuning verlenen aan de ontwikkeling van het personeels- en lijnmanagement binnen de
      sector Rijk.
    url: https://wetten.overheid.nl/BWBR0015585/2004-09-01#Artikel62
  - number: 6:3
    text: |-
      1 De afdeling Financiën en Informatie staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a) het scheppen van transparantie in de financiële aspecten van het personeelsmanagement van de rijksdienst en het
      voeren van de control;

      b) het ontwikkelen en bouwen van analyse- en rekenmodellen ten behoeve van de ondersteuning van het beleid bij
      de directie;

      c) het coördineren van het directiebrede informatiebeleid aangaande kwantitatieve informatie;

      d) het inrichten van een technische informatie-infrastructuur.
    url: https://wetten.overheid.nl/BWBR0015585/2004-09-01#Artikel63
  - number: 6:4
    text: |-
      1 De afdeling Arbeidsvoorwaarden staat onder leiding van een hoofd, tevens plaatsvervangend directeur.

      2 De afdeling heeft de volgende taken:

      a) de coördinatie van de Arbeidsvoorwaardenovereenkomst van de sector Rijk en de regelgeving die daaruit
      voortvloeit;

      b) de organisatie en het functioneren van de arbeidsvoorwaarden;

      c) het behartigen van de arbeidsvoorwaardendossiers die direct verband houden met de individuele rechtspositie en
      het ‘loonstrookje’;

      d) het adviseren en voorlichten van de ministeries met betrekking tot de onder haar verantwoording vallende
      regelgeving.
    url: https://wetten.overheid.nl/BWBR0015585/2004-09-01#Artikel64
  - number: 6:5
    text: |-
      1 De afdeling Pensioenen, Sociale Zekerheid en Zorg staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a) de zorg voor het ouderdomspensioen, het nabestaande pensioen, het invaliditeitspensioen, de regeling
      aanmerkelijk substantieel bezwarende functie en de regeling flexibel pensioen en uittreden ten behoeve van
      ambtenaren en oud-ambtenaren in de sector Rijk;

      b) als sectorwerkgever adviseren over kabinetsbeleid ten aanzien van wettelijke regelingen sociale zekerheid,
      pensioenen en ziektekosten;

      c) het beleid en regeling voor bovenwettelijke regelingen, sociale zekerheid, preventie- en reïntegratiebeleid;

      d) opdrachtgeverrol ten aanzien van de bovenwettelijke sociale zekerheid, en reïntegratie van werkloze en
      arbeidsongeschikte personen;

      e) het ziektekostenbeleid en de zorg voor de ziektenkostenregelingen in de sector Rijk;

      f) het bevorderen van de participatie van ouderen in de sector Rijk.
    url: https://wetten.overheid.nl/BWBR0015585/2004-09-01#Artikel65
  - number: 6:6
    text: |-
      1 De afdeling Formatiemanagement Rijksdienst staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a) signaleren, adviseren en ontwikkeling op het terrein van de inrichting en het functioneren van organisaties
      binnen de rijksdienst;

      b) adviseren van de Commissie Rijksdienst over de rijkswaarderingsverhoudingen en het decentrale formatiebeheer;

      c) adviseren van de commissie Rijksdienst over topfuncties en topformaties;

      d) het voeren van het systeemhouderschap rijkswaarderingen;

      e) het bieden van transparante en beleidsmatige advisering op het gebied van variabele beloning.
    url: https://wetten.overheid.nl/BWBR0015585/2004-09-01#Artikel66
  - number: 7:1
    text: |-
      Het Agentschap Informatievoorziening Overheidspersoneel bestaat uit de volgende afdelingen:

        - de stafafdeling;
        - de afdeling Salarisinformatie;
        - de afdeling Personeelsinformatie.
    url: https://wetten.overheid.nl/BWBR0015585/2004-09-01#Artikel71
  - number: 7:2
    text: |-
      De stafafdeling draagt zorg voor ondersteuning van de directie en lijnafdelingen. Zij is belast met activiteiten
      op het gebied van personeelszaken, financiën, automatisering, facilitaire bedrijfsvoering, secretariële- en
      administratieve ondersteuning, communicatie en quality assurance.
    url: https://wetten.overheid.nl/BWBR0015585/2004-09-01#Artikel72
  - number: 7:3
    text: |-
      De afdeling Salarisinformatie draagt zorg voor ontwerp, ontwikkeling, bouw en het in bedrijf houden van
      hoogwaardige informatiesystemen op het gebied van de salarisadministratie.
    url: https://wetten.overheid.nl/BWBR0015585/2004-09-01#Artikel73
  - number: 7:4
    text: |-
      De afdeling Personeelsinformatie draagt zorg voor ontwerp, ontwikkeling, bouw en het in bedrijf houden van
      hoogwaardige informatiesystemen op het gebied van de financiële personeelsadministratie.
    url: https://wetten.overheid.nl/BWBR0015585/2004-09-01#Artikel74
  - number: '8'
    text: |-
      [Artikel 3:20 van het Organisatiebesluit BZK 2003][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015590#Artikel320
    url: https://wetten.overheid.nl/BWBR0015585/2004-09-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015590
        artikel: 3:20
  - number: '9'
    text: |-
      De afdeling heeft tot taak beleid te ontwikkelen op rijksniveau met als doel het borgen van het publiek
      belang. Het beleid betreft de inrichting en de werkwijze van de rijksdienst. Specifieke aandachtspunten zijn
      de uitvoeringsmodaliteiten, onder andere externe verzelfstandiging, de relatie met de omgeving, zoals het
      adviesstelsel, en binnen de rijksdienst te gebruiken borgingsmechanismen, onder andere de organisatie van het
      toezicht en instrumenten voor kwaliteitszorg.
    url: https://wetten.overheid.nl/BWBR0015585/2004-09-01#Artikel9
  - number: '10'
    text: |-
      Tot de taak van de dit besluit genoemde dienstonderdelen behoort voorts de uitvoering van andere taken dan vermeld,
      in opdracht van de minister, de secretaris-generaal of de directeur-generaal, voor zover hogere wet- en regelgeving
      zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0015585/2004-09-01#Artikel10
  - number: 11:1
    text: |-
      1 De directeur-generaal is verantwoordelijk voor het beheer en de terinzagelegging van dit besluit.

      2 Het beheer geschiedt met inachtneming van de desbetreffende (richtlijnen inzake) administratieve
      organisatiebeschrijvingen.
    url: https://wetten.overheid.nl/BWBR0015585/2004-09-01#Artikel111
  - number: 11:2
    text: |-
      Wijziging van dit besluit is voorbehouden aan de secretaris-generaal en geschiedt op voordracht van de directeur-
      generaal, na advisering door de directeur Personeel en Organisatie.
    url: https://wetten.overheid.nl/BWBR0015585/2004-09-01#Artikel112
  - number: 12:1
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na plaatsing van dit besluit in de Staatscourant en
      werkt terug tot en met 1 september 2003.
    url: https://wetten.overheid.nl/BWBR0015585/2004-09-01#Artikel121
  - number: 12:2
    text: |-
      Dit besluit wordt aangehaald als: Organisatiebesluit directoraat-generaal Management Openbare Dienst
