      1 Het college legt een bestuurlijke boete op aan de inburgeringsplichtige als deze niet is verschenen binnen de in
      [artikel 14, eerste lid, tweede zin][ref1], bedoelde termijn of als deze onvoldoende meewerkt aan de brede intake,
      waaronder het afleggen van de leerbaarheidstoets, bedoeld in artikel 14, derde lid, onderdeel a.

      2 Het college stelt in de boetebeschikking een nieuwe termijn van ten hoogste twee maanden waarbinnen de
      inburgeringsplichtige na het bekendmaken van de boetebeschikking alsnog geacht wordt te verschijnen of medewerking
      te verlenen.

      3 Het college legt een bestuurlijke boete op aan de inburgeringsplichtige als deze niet is verschenen of
      onvoldoende meewerkt binnen de op grond van het tweede lid vastgestelde termijn.


