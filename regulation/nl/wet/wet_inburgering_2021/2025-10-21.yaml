  - number: '15'
    text: |-
      1 Het college stelt op basis van de brede intake vast:

      a. de door de inburgeringsplichtige te volgen leerroute;

      b. de daarvoor nodige ondersteuning en begeleiding;

      c. de intensiteit van het participatieverklaringstraject en de module Arbeidsmarkt en Participatie; en

      d. voor zover van toepassing, welke afspraken er zijn gemaakt met de inburgeringsplichtige over het deelnemen
      van diens kind aan de voorschoolse educatie, bedoeld in [artikel 1.1 van de Wet kinderopvang][ref1], of de
      vroegschoolse educatie, bedoeld in [artikel 1 van de Wet op het primair onderwijs][ref2].

      2 Het college stelt voor een inburgeringsplichtige als bedoeld in [artikel 13, eerste lid][ref3], de intensiteit
      van de leerroute vast.

      3 Voor zover van toepassing voegt het college bij de beschikking, bedoeld in het eerste lid en tweede lid,
      beschikkingen op grond van de [Participatiewet][ref4] waarin rechten zijn toegekend of plichten zijn opgelegd met
      het oog op de bevordering van participatie en waarin de verplichting, bedoeld in [artikel 56a van die wet][ref5],
      is vastgesteld, wat tezamen het persoonlijk plan inburgering en participatie vormt.

      4 Als de inburgeringsplichtige, voor wie de leerroute is vastgesteld, zijn woonplaats
      verplaatst naar een andere gemeente, stelt het college van de andere gemeente in afwijking van
      [artikel 14, derde lid, tweede zin, aanhef en onderdelen a en b][ref6] de leerroute vast conform de eerder
      vastgestelde leerroute.

      5 Bij of krachtens algemene maatregel van bestuur wordt bepaald binnen welke termijn het persoonlijk plan
      inburgering en participatie wordt opgesteld.

      6 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het vaststellen door het
      college en het persoonlijk plan inburgering en participatie.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1.1
