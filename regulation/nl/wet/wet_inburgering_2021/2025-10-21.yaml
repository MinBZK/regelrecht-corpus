      Dit hoofdstuk is van toepassing op de inburgeringsplichtige die verblijf heeft op grond van een
      verblijfsvergunning regulier voor bepaalde tijd, met uitzondering van een inburgeringsplichtige als bedoeld in
      [artikel 13, eerste lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel13
