  - number: '32'
    text: |-
      1 Zolang op grond van [artikel 29][ref1] geen regels zijn gesteld over de afgifte van een certificaat
      verleent Onze Minister, of een door Onze Minister aangewezen instelling, een keurmerk als bedoeld in
      [artikel 2.78a van de Aanbestedingswet 2012][ref2] aan cursusinstellingen.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over:

      a. de aanwijzing van een instelling;

      b. de verlening van een keurmerk aan cursusinstellingen;

      c. de invulling van de eisen van het keurmerk, bedoeld in
      [artikel 2.78a, eerste lid, onderdeel b, van de Aanbestedingswet 2012][ref3];

      d. de vergoeding die is verschuldigd in verband met de afgifte en het beheer van het keurmerk, en het toezien of
      wordt voldaan aan de eisen van het keurmerk.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2.78a
      [ref3]: https://wetten.overheid.nl/BWBR0032203#Artikel2.78a
