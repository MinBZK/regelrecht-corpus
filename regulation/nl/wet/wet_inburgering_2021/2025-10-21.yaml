  - number: '9'
    text: |-
      1 De inburgeringsplichtige die naar het oordeel van het college redelijkerwijs niet in staat
      is het inburgeringsexamen of het taalschakeltraject te behalen binnen de termijn, bedoeld in
      [artikel 11, eerste lid][ref1], volgt een intensief traject dat aansluit bij de persoonlijke capaciteiten van de
      inburgeringsplichtige, gericht op het verwerven van mondelinge en schriftelijke vaardigheden in de Nederlandse
      taal, zelfredzaamheid, activering en participatie in de Nederlandse maatschappij.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de inhoud en vormgeving van het
      traject.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel11
