  - number: '25'
    text: |-
      1 Onze Minister legt een bestuurlijke boete op aan de inburgeringsplichtige die de op grond van [artikel 15][ref1]
      vastgestelde leerroute niet heeft behaald binnen de in [artikel 11, eerste lid][ref2], bedoelde termijn, of de op
      grond van [artikel 12][ref3] verlengde termijn.

      2 [Artikel 24, tweede, derde en vierde lid][ref4], is van overeenkomstige toepassing.

      3 In afwijking van het eerste lid, legt Onze Minister geen boete op als bij of krachtens
      [artikel 18 van de Vreemdelingenwet 2000][ref5] de aanvraag tot het verlengen van de geldigheidsduur van de
      verblijfsvergunning voor bepaalde tijd wordt afgewezen of bij of krachtens [artikel 19 van die wet][ref6] de
