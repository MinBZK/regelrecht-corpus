        artikel: '40'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0044770
        artikel: '40'
        hoofdstuk: '10'
  - number: '41'
    text: |-
      1 Het totale bedrag, bedoeld in [artikel 40, tweede lid][ref1], voor de uitkering, bedoeld in artikel 40, eerste
      lid, wordt na afloop van het jaar waarop het bedrag betrekking heeft bij of krachtens de wet bijgesteld op basis
      van het werkelijke volume van inburgeringsplichtigen in Nederland in het uitvoeringsjaar.

      2 De verdeling van de uitkering aan gemeenten wordt tegelijk met de bijstelling van het totale bedrag, bedoeld in
      het eerste lid, herzien op basis van geactualiseerde gegevens.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de herziening bedoeld in het tweede
      lid.

      4 De herziening van de uitkering wordt uiterlijk zes maanden na afloop van het uitvoeringsjaar aan gemeenten bekend
      gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel40
    url: https://wetten.overheid.nl/BWBR0044770/2025-10-21#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '40'
        hoofdstuk: '10'
  - number: '42'
    text: |-
      1 Het college legt verantwoording af aan Onze Minister over de uitvoering van deze wet, op de wijze, bedoeld in
      [artikel 17a van de Financiële-verhoudingswet][ref1].

      2 Indien uit de verantwoordingsinformatie, bedoeld in
      [artikel 17a, eerste lid, van de Financiële-verhoudingswet][ref2], blijkt dat de uitkering,
      bedoeld in [artikel 40][ref3], niet volledig is besteed, wordt het niet bestede deel van de
      uitkering door Onze Minister teruggevorderd. Indien uit het verslag van bevindingen, bedoeld in
      [artikel 213, vierde lid, van de Gemeentewet][ref4], dat deel uit maakt van de informatie, bedoeld in artikel 17a,
      eerste lid, van de Financiële-verhoudingswet, blijkt dat de besteding van de uitkering fout of onzeker is, wordt de
      uitkering voor het deel dat de besteding fout of onzeker is, door Onze Minister teruggevorderd. Onze Minister doet
      binnen een jaar na ontvangst van de verantwoordingsinformatie mededeling van de terugvordering aan het college.

      3 Indien de verantwoordingsinformatie, bedoeld in het tweede lid, niet volledig door Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties is ontvangen binnen achttien maanden na het kalenderjaar waarop zij betrekking heeft,
      wordt de uitkering teruggevorderd. Als volledige terugvordering naar het oordeel van Onze Minister leidt tot een
      onbillijkheid van overwegende aard, stelt Onze Minister de terugvordering op een lager bedrag vast. Onze Minister
      doet binnen drie maanden na afloop van de achttien maanden mededeling van terugvordering aan het college.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de terugvordering. Daarbij kan
      worden bepaald dat een gedeelte van het niet bestede deel van de uitkering niet wordt teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
      [ref2]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
      [ref3]: https://wetten.overheid.nl/BWBR0044770#Artikel40
      [ref4]: https://wetten.overheid.nl/BWBR0005416#Artikel213
    url: https://wetten.overheid.nl/BWBR0044770/2025-10-21#Artikel42
