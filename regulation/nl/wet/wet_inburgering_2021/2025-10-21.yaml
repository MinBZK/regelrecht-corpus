  - number: '5'
    text: |-
      1 Onze Minister ontheft de inburgeringsplichtige geheel of gedeeltelijk van de inburgeringsplicht als diegene heeft
      aangetoond door een psychische of lichamelijke belemmering, of een verstandelijke beperking, blijvend niet in staat
      te zijn aan de inburgeringsplicht, of een gedeelte daarvan, te voldoen.

      2 Onze Minister ontheft de inburgeringsplichtige voorts van de inburgeringsplicht als het de inburgeringsplichtige,
      gelet op bijzondere individuele omstandigheden die hem niet kunnen worden verweten, onmogelijk of uiterst moeilijk
      is om te voldoen aan de inburgeringsplicht.

      3 Voor het in behandeling nemen van een aanvraag voor een ontheffing of voor een deskundigenverklaring voor de
      ontheffing, kunnen bij ministeriële regeling te bepalen bedragen worden vastgesteld die zijn verschuldigd.

      4 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de toepassing van het eerste
      lid, waarbij in ieder geval regels worden gesteld met betrekking tot de wijze waarop de belemmering kan worden
      aangetoond en de omstandigheden waaronder daarvoor gemaakte kosten vergoed worden.

      5 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de toepassing van het tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0044770/2025-10-21#Artikel5
  - number: '6'
    text: |-
      1 De inburgeringsplicht bestaat uit:

      a. het afronden van het participatieverklaringstraject;

      b. het afronden van de module Arbeidsmarkt en Participatie; en

      c. het behalen van het inburgeringsexamen, de onderwijsroute of de zelfredzaamheidsroute.

      2 De inburgeringsplichtige die voldaan heeft aan de inburgeringsplicht ontvangt een diploma indien deze het
      inburgeringsexamen dan wel de onderwijsroute heeft behaald, en een certificaat indien deze de zelfredzaamheidsroute
      heeft behaald.

      3 Het college biedt het participatieverklaringstraject en de module Arbeidsmarkt en Participatie aan.

      4 Het participatieverklaringstraject behelst een inleiding in de kernwaarden van de Nederlandse samenleving en
      wordt afgesloten met het ondertekenen van de participatieverklaring.

      5 Deze verklaring bevat de volgende slotformule: Ik verklaar dat ik kennis heb genomen van de waarden en spelregels
      van de Nederlandse samenleving en dat ik deze respecteer, en dat ik de universele mensenrechten eerbiedig en niet
      daarmee in strijd zal handelen. Ik verklaar dat ik actief een bijdrage wil leveren aan de Nederlandse samenleving
      en reken erop dat ik daarvoor ook de ruimte krijg van mijn medeburgers.

      6 De module Arbeidsmarkt en Participatie behelst in ieder geval een kennismaking met en voorbereiding op de
      Nederlandse arbeidsmarkt.

      7 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over het diploma en certificaat, bedoeld
      in het tweede lid, en de inhoud en vormgeving van het participatieverklaringstraject en de module Arbeidsmarkt
      en Participatie.

      8 Onverminderd het vijfde lid wordt de tekst van de participatieverklaring bij algemene maatregel van bestuur
      vastgesteld. De voordracht voor deze algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat
      het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0044770/2025-10-21#Artikel6
  - number: '7'
    text: |-
      1 Het inburgeringsexamen bestaat uit:

      a. de examinering van mondelinge en schriftelijke vaardigheden in de Nederlandse taal op ten minste het niveau B1
      van het Gemeenschappelijk Europees Referentiekader voor Moderne Vreemde Talen; en

      b. de examinering van de kennis van de Nederlandse maatschappij.

      2 Onze Minister of Onze Minister van Onderwijs, Cultuur en Wetenschap biedt het inburgeringsexamen aan.

      3 De inburgeringsplichtige die beschikt over een bij ministeriële regeling aangewezen diploma, certificaat of ander
      document waaruit blijkt dat diegene beschikt over een deel van de vaardigheden en kennis, bedoeld in het eerste
      lid, is vrijgesteld van de verplichting om dat deel van die kennis of vaardigheden te verwerven.

      4 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:

      a. de inhoud en vormgeving van het inburgeringsexamen;

      b. het afnemen en beoordelen van het inburgeringsexamen;

      c. de ter zake van het inburgeringsexamen verschuldigde kosten;

      d. de identificatie van de persoon die aan het inburgeringsexamen deel neemt.

      5 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0044770/2025-10-21#Artikel7
  - number: '8'
    text: |-
      1 De inburgeringsplichtige die tijdens de brede intake aangeeft een opleiding in het beroeps- of hoger onderwijs te
      willen volgen, volgt het taalschakeltraject indien naar het oordeel van het college een grote kans bestaat dat deze
      na het volgen van dat traject in staat is om in het genoemde onderwijs een diploma te behalen.

      2 Onder het taalschakeltraject wordt verstaan een opleiding educatie als bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel f, van de Wet educatie en beroepsonderwijs][ref1] aan een instelling met
      diploma-erkenning als bedoeld in [artikel 1.4a.1 van de Wet educatie en beroepsonderwijs][ref2], welke opleiding is
      gericht op het begeleiden van anderstaligen richting het beroeps- of hoger onderwijs.

      3 De verplichting om de module Arbeidsmarkt en Participatie af te ronden is niet van toepassing op de
      inburgeringsplichtige die het taalschakeltraject volgt of heeft afgerond.

      4 Indien de inburgeringsplichtige de onderwijsroute niet heeft behaald, heeft deze het inburgeringsexamen behaald,
      indien hij heeft voldaan aan de examenonderdelen:

      a. mondelinge en schriftelijke vaardigheden in de Nederlandse taal op ten minste het niveau B1 van het
      Gemeenschappelijk Europees Referentiekader voor Moderne Vreemde Talen; en

      b. kennis van de Nederlandse maatschappij.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1.4a.1
    url: https://wetten.overheid.nl/BWBR0044770/2025-10-21#Artikel8
