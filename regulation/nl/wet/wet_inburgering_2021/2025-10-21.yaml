        artikel: '1'
  - number: '54'
    text: |-
      1 De [Wet inburgering][ref1] wordt ingetrokken, met dien verstande dat zij van toepassing blijft op de personen op
      wie deze wet van toepassing was op de dag voorafgaand aan de inwerkingtreding van deze wet.

      2 De [artikelen 18b, tweede lid, onderdeel b][ref2], [64, eerste lid, onderdeel p][ref3],
      en [67, eerste lid, onderdeel h, van de Participatiewet][ref4],
      [artikel 7.3.1, vierde lid, van de Wet educatie en beroepsonderwijs][ref5], de
      [artikelen 16, eerste lid, onderdeel h][ref6], en [18, eerste lid, onderdeel i, van de Vreemdelingenwet 2000][ref7],
      de [artikelen 45, eerste lid, onderdeel o][ref8], en
      __REF007___________________________________________________________________________________________________________
      ________________, de [artikelen 45, eerste lid, onderdeel n][ref10], en
      __REF009___________________________________________________________________________________________________________
      ______________,
      __REF010___________________________________________________________________________________________________________
      ________, [artikel 54, derde lid, onderdeel m, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref13]
      en artikel 2 van [bijlage 3 van de Algemene wet bestuursrecht][ref14], zoals die artikelen luidden op de dag
      voorafgaand aan de inwerkingtreding van deze wet, blijven van toepassing op de personen, bedoeld in het eerste lid.

      3 Een vrijstelling op grond van het bepaalde bij of krachtens
      [artikel 5, eerste lid, onderdeel e, van de Wet inburgering][ref15], wordt beschouwd als een vrijstelling als
      bedoeld in [artikel 4, eerste lid, onderdeel d][ref16], van deze wet.

      4 Bij of krachtens algemene maatregel van bestuur kunnen, in afwijking van de bij of krachtens algemene maatregel
      van bestuur op grond van de [artikelen 6, derde lid][ref17], [8, eerste lid, aanhef en onderdeel a][ref18], en
      [16, vijfde lid, van de Wet inburgering][ref19] gestelde regels, ter begunstiging regels worden gesteld:

      a. omtrent de voorwaarden waaronder en de termijn waarbinnen een ontheffing kan worden afgegeven;

      b. omtrent de voorwaarden waaronder de termijnen op grond van de [artikelen 7a, derde lid][ref20], en
      [7b, derde lid, van de Wet inburgering][ref21] kunnen worden verlengd;

      c. waarmee de verplichting om de lening terug te betalen wanneer sprake is van overschrijding van de termijnen,
      genoemd in de [artikelen 7a][ref22] en [7b, van de Wet inburgering][ref23], wordt beperkt of tenietgedaan, en
      omtrent het vaststellen van de draagkracht ten behoeve van de terugbetaling van de lening.

      5 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over het aanbieden van begeleiding aan de
      inburgeringsplichtige op wie de [Wet inburgering][ref24] van toepassing is ter bespoediging van de afronding van de
      inburgeringsplicht, bedoeld in die wet.

      6 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot een goede
      uitvoering van het eerste lid.

      7 [Artikel 32, tweede lid, onderdeel d][ref25], en de daarop berustende bepalingen, zijn van overeenkomstige
      toepassing op het keurmerk, bedoeld in [artikel 12a van de Wet inburgering][ref26].


