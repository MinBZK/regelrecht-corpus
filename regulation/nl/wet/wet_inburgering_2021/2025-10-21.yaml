  - number: '28'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor de afgifte van een certificaat
      aan een rechtspersoon of een natuurlijk persoon die in het kader van de uitoefening van beroep of bedrijf
      werkzaamheden verricht gericht op het toeleiden van inburgeringsplichtigen naar het inburgeringsexamen of de
      zelfredzaamheidsroute.

      2 Onze Minister of een door Onze Minister op grond van [artikel 29][ref1] aangewezen instelling beslist op aanvraag
      over de afgifte van het certificaat en is bevoegd een afgegeven certificaat in te trekken.

      3 Een certificaat wordt afgegeven voor een beperkte tijdsduur. Aan een certificaat kunnen voorschriften worden
      verbonden.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over:

      a. de aanvraag en de gegevens die daarbij van de aanvrager worden verlangd;

      b. de gronden waarop en de gevallen waarin de afgifte van een certificaat kan worden geweigerd of een afgegeven
      certificaat kan worden verlengd of ingetrokken;

      c. de vergoeding die verschuldigd is in verband met de afgifte van een certificaat en de betaling daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel29
    url: https://wetten.overheid.nl/BWBR0044770/2025-10-21#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0044770
        artikel: '29'
        hoofdstuk: '8'
  - number: '29'
    text: |-
      1 Onze Minister kan op aanvraag een instelling aanwijzen die de bevoegdheden, bedoeld in
      [artikel 28, tweede lid][ref1], uitoefent.

      2 Aan een aanwijzing krachtens het eerste lid kunnen voorschriften worden verbonden.

      3 De aangewezen instelling verstrekt op verzoek kosteloos aan Onze Minister de voor de uitoefening van zijn taak
      benodigde inlichtingen. Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor
      de vervulling van zijn taak redelijkerwijs nodig is.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over:

      a. de gronden waarop de in het eerste lid bedoelde aanwijzing kan worden gegeven, ingetrokken of gewijzigd;

      b. het opstellen van een verslag van werkzaamheden voor Onze Minister;

      c. het toezicht op de aangewezen instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel28
    url: https://wetten.overheid.nl/BWBR0044770/2025-10-21#Artikel29
