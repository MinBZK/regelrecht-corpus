    text: |-
      1 De bestuurlijke boetes, bedoeld in de [artikelen 22][ref1], [23][ref2], [24][ref3] en [25][ref4], zijn niet hoger
      dan:

      a. € 250 voor de boetes, bedoeld in [artikel 22][ref5];

      b. € 340 voor de boete, bedoeld in [artikel 24][ref6];

      c. € 800 voor de boetes, bedoeld in [artikel 23][ref7];

      d. € 1 000 voor de boete, bedoeld in [artikel 25][ref8].

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de hoogte van de bestuurlijke boetes
      en de omstandigheden waaronder deze worden opgelegd. De voordracht voor deze algemene maatregel van bestuur wordt
      niet eerder gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.


