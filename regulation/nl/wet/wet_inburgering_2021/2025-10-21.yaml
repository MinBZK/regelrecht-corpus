preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het huidige stelsel van inburgering in de Nederlandse
    samenleving te herzien opdat inburgeringsplichtigen, de gemeenten en de rijksoverheid optimaal in positie worden
    gebracht met als doel dat inburgeringsplichtigen zo snel mogelijk de Nederlandse taal leren op het voor hen hoogst
    haalbare niveau en volwaardig aan de Nederlandse samenleving gaan deelnemen, bij voorkeur door middel van betaald
    werk;

    Zo is het dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-Generaal,
    hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0044770/2025-10-21#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *brede intake:* brede intake, bedoeld in [artikel 14][ref1];
        - *college:* college van burgemeester en wethouders van de gemeente waar de inburgeringsplichtige woonplaats heeft
      als bedoeld in de [artikelen 10, eerste lid][ref2], en [11 van Boek 1 van het Burgerlijk Wetboek][ref3], met dien
      verstande dat als de inburgeringsplichtige rechtmatig verblijf heeft op grond van een verblijfsvergunning asiel
      voor bepaalde tijd, het gaat om de gemeente waar hij op grond van [artikel 28 van de Huisvestingswet 2014][ref4]
      gehuisvest is;
        - *cursusinstelling:* de aanbieder van onderwijs, gericht op het voldoen aan de inburgeringsplicht;
        - *geestelijke bedienaar:* persoon die een geestelijk, godsdienstig of levensbeschouwelijk ambt bekleedt,
      werkzaamheden verricht als geestelijk voorganger, godsdienstleraar of zendeling, of voor een kerkgenootschap of
      ander genootschap op geestelijke of levensbeschouwelijke grondslag werkzaamheden van overwegend godsdienstige,
      geestelijke of levensbeschouwelijke aard verricht;
        - *inburgeringsexamen:* examen, bedoeld in [artikel 7, eerste lid][ref5];
        - *inburgeringsplicht:* inburgeringsplicht, bedoeld in [artikel 6, eerste lid][ref6];
        - *inburgeringsplichtige:* persoon die op grond van [artikel 3][ref7] inburgeringsplichtig is;
        - *leerroute:* route, bedoeld in [artikel 7][ref8], [8][ref9] of [9][ref10];
        - *module Arbeidsmarkt en Participatie:* module, bedoeld in [artikel 6, eerste lid, onderdeel b][ref11];
        - *onderwijsroute:* route, bedoeld in [artikel 8][ref12];
        - *Onze Minister:* Onze Minister van Sociale Zaken en Werkgelegenheid;
        - *participatieverklaringstraject:* participatieverklaringstraject, bedoeld in
      [artikel 6, eerste lid, onderdeel a][ref13];
        - *taalschakeltraject:* taalschakeltraject, bedoeld in [artikel 8, tweede lid][ref14];
        - *verblijfsvergunning asiel voor bepaalde tijd:* verblijfsvergunning, bedoeld in
      [artikel 28, van de Vreemdelingenwet 2000][ref15];
        - *verblijfsvergunning regulier voor bepaalde tijd:* verblijfsvergunning, bedoeld in
      [artikel 14, van de Vreemdelingenwet 2000][ref16];
        - *Wet inburgering:* de [Wet inburgering][ref17], zoals die wet luidde de dag voorafgaand aan de inwerkingtreding
      van deze wet;
        - *zelfredzaamheidsroute:* traject, bedoeld in [artikel 9, eerste lid][ref18].

      2 Bij ministeriële regeling kan de geestelijke bedienaar, bedoeld in het eerste lid, nader worden omschreven.


