  - number: '31'
    text: |-
      1 Als de op grond van [artikel 29][ref1] aangewezen instelling zijn taak naar het oordeel van Onze Minister ernstig
      verwaarloost, kan Onze Minister de noodzakelijke voorzieningen treffen.

      2 De voorzieningen worden, spoedeisende gevallen uitgezonderd, niet eerder getroffen dan nadat de krachtens
      [artikel 29][ref2] aangewezen instelling in de gelegenheid is gesteld om binnen een door Onze Minister te stellen
      termijn alsnog haar taak naar behoren uit te voeren.

      3 Onze Minister stelt beide kamers der Staten-Generaal onverwijld in kennis van de door hem getrokken
      voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0044770#Artikel29
