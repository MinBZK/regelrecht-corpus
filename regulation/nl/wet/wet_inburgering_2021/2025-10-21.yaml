        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0044770
        artikel: '37'
        hoofdstuk: '9'
  - number: '39'
    text: |-
      1 Het college en een of meer bij of krachtens algemene maatregel van bestuur aan te wijzen instanties verstrekken
      kosteloos, uit eigen beweging of op verzoek, aan Onze Minister gegevens en inlichtingen die voor de statistiek,
      monitoring en evaluatie van bestaand beleid en de voorbereiding van toekomstig beleid met betrekking tot deze wet
      nodig zijn.

      2 Bij ministeriële regeling kunnen regels worden gesteld over de soort informatie die het college of de instantie
      verstrekt en de wijze waarop het college of instantie de gegevens en inlichtingen verzamelt en verstrekt, waarbij
      kan worden bepaald, dat categorieën van gemeenten of instanties bepaalde inlichtingen niet hoeven te verstrekken.
    url: https://wetten.overheid.nl/BWBR0044770/2025-10-21#Artikel39
  - number: '40'
    text: |-
      1 Onze Minister verstrekt jaarlijks ten laste van ’s Rijks kas aan het college een uitkering voor de kosten van
      voorzieningen, niet zijnde uitvoeringskosten, die bijdragen aan het voldoen aan de inburgeringsplicht.

      2 Bij wet wordt het totale bedrag dat beschikbaar is voor de uitkering, bedoeld in het eerste lid, vastgesteld.

      3 De uitkering aan het college wordt ten minste drie maanden voorafgaand aan het kalenderjaar waarop zij betrekking
      heeft bekend gemaakt door Onze Minister.

      4 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de verdeling van de uitkering onder de
      gemeenten en het verzamelen van gegevens die noodzakelijk zijn voor het vaststellen van deze verdeling.

      5 Het college verstrekt de gegevens voor de verdeling van de uitkering als onderdeel van de
      verantwoordingsinformatie, bedoeld in [artikel 17a van de Financiële-verhoudingswet][ref1].

      6 Bij ministeriële regeling kunnen regels worden gesteld over de betaling van de uitkering als het college de
      gegevens niet, niet volledig of niet tijdig verstrekt of als de kwaliteit van die gegevens tekort schiet.

      7 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de betaalbaarstelling van de
      uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0044770/2025-10-21#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
  - number: 40a
    text: |-
      1 Het totale bedrag, bedoeld in [artikel 40, tweede lid][ref1], voor de uitkering, bedoeld in artikel 40, eerste
      lid, wordt in het jaar waarop het bedrag betrekking heeft, eenmalig bij wet herzien op basis van bij algemene
      maatregel van bestuur te bepalen geactualiseerde gegevens.

      2 Bij herziening van het totale bedrag, wordt het bedrag waarmee de uitkering, bedoeld in
      [artikel 40, eerste lid][ref2], wordt aangepast, binnen een periode van vier weken na de herziening door Onze
      Minister bekendgemaakt.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de herziening, bedoeld in het tweede
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0044770#Artikel40
    url: https://wetten.overheid.nl/BWBR0044770/2025-10-21#Artikel40a
    references:
      - id: ref1
