        artikel: '28'
        hoofdstuk: '8'
  - number: '30'
    text: |-
      1 Onze Minister kan de krachtens [artikel 29][ref1] aangewezen instelling aanwijzingen geven over de uitoefening
      van haar taken. Onze Minister treedt daarbij niet in individuele gevallen.

      2 De krachtens [artikel 29][ref2] aangewezen instelling is gehouden overeenkomstig de aanwijzing te handelen.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0044770#Artikel29
