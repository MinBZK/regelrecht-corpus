  - number: '14'
    text: |-
      1 Het college roept de inburgeringsplichtige op voor de afname van de brede intake en stelt daarbij een termijn.
      Indien de inburgeringsplichtige binnen deze termijn niet verschijnt of onvoldoende meewerkt, geeft het college een
      schriftelijke waarschuwing, doet het college een herhaalde oproep en stelt daarbij een nieuwe termijn.

      2 Indien de inburgeringsplichtige na drie oproepen niet verschijnt of onvoldoende meewerkt, voltooit het college de
      brede intake in afwezigheid van de inburgeringsplichtige.

      3 De brede intake is een onderzoek naar de mogelijkheden die de inburgeringsplichtige heeft om aan de
      inburgeringsplicht te voldoen. De brede intake bestaat in ieder geval uit:

      a. een leerbaarheidstoets, waarmee inzicht wordt gegeven in het te behalen niveau van de Nederlandse taal
      van het Gemeenschappelijk Europees Referentiekader voor Moderne Vreemde talen binnen de termijn, bedoeld in
      [artikel 11, eerste lid][ref1];

      b. een onderzoek omtrent gevolgd onderwijs en werkervaring in het land van herkomst;

      c. een verkenning naar de persoonlijke omstandigheden, waaronder mede verstaan wordt de fysieke en mentale
      gezondheid, met het oog op het bieden van maatwerk tijdens het inburgeringstraject; en

      d. voor zover van toepassing, een verkenning van de mogelijkheden om het kind van de inburgeringsplichtige
      deel te laten nemen aan de voorschoolse educatie, bedoeld in [artikel 1.1 van de Wet kinderopvang][ref2], of de
      vroegschoolse educatie, bedoeld in [artikel 1 van de Wet op het primair onderwijs][ref3].

      4 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de inhoud en verslaglegging van de
      brede intake.

      5 De leerbaarheidstoets wordt afgenomen door een of meer bij ministeriële regeling aangewezen instanties, waaronder
      mede kan worden verstaan het college. Indien een andere instantie dan het college wordt aangewezen, adviseren deze
      instantie of instanties het college over de vaststelling, bedoeld in [artikel 15, eerste lid, onderdeel a][ref4].

      6 Het college verleent de inburgeringsplichtige ontheffing van het afleggen van de leerbaarheidstoets, bedoeld in
      het derde lid, onderdeel a, indien de inburgeringsplichtige:

      a. een visuele beperking heeft;

      b. een auditieve beperking heeft, en niet in staat wordt geacht de leerbaarheidstoets af te leggen.

      7 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het zesde
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1.1
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0044770#Artikel15
