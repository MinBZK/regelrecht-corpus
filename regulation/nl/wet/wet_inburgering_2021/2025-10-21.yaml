  - number: '37'
    text: |-
      1 Gelet op artikel 9, tweede lid, onderdeel g, van de Algemene verordening gegevensbescherming is het verbod om
      persoonsgegevens te verwerken waaruit religieuze of levensbeschouwelijke overtuigingen blijken, niet van toepassing
      als de verwerking geschiedt door Onze Minister of het college en voor zover de verwerking noodzakelijk is voor de
      vaststelling of de vreemdeling geestelijke bedienaar is.

      2 Gelet op artikel 9, tweede lid, onderdeel g, van de Algemene verordening gegevensbescherming, is het verbod om
      gegevens over gezondheid te verwerken niet van toepassing als de verwerking geschiedt door Onze Minister of het
      college en voor zover de verwerking noodzakelijk is voor:

      a. de beoordeling van de gehele of gedeeltelijke ontheffing van de inburgeringsplicht, bedoeld in
      [artikel 5, eerste lid, of het tweede lid][ref1], en de verlenging van de termijn, bedoeld in [artikel 12][ref2];
      of

      b. de afname van de brede intake, de vaststelling van het persoonlijk plan inburgering en participatie, bedoeld in
      [artikel 15, derde lid][ref3], en de ondersteuning en begeleiding, bedoeld in [artikel 17, eerste lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0044770#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0044770#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0044770#Artikel17
