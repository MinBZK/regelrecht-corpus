  - number: '17'
    text: |-
      1 De vaststelling van de ondersteuning en begeleiding, bedoeld in [artikel 15, eerste lid, onderdeel b][ref1],
      is zodanig dat het college voldoende zicht heeft op de voortgang van het voldoen aan de inburgeringsplicht door
      de inburgeringsplichtige.

      2 Wanneer het college van oordeel is dat er sprake is van onvoldoende voortgang of een grotere voortgang dan op
      grond van het persoonlijke plan inburgering en participatie, bedoeld in [artikel 15][ref2], was te verwachten, kan
      het college op een bij algemene maatregel van bestuur te bepalen termijn de door de inburgeringsplichtige te volgen
      leerroute opnieuw vaststellen.

      3 Wanneer, na aanzienlijke inspanningen van de inburgeringsplichtige die de leerroute, bedoeld in [artikel 7][ref3]
      volgt, uit de relevante feiten en omstandigheden blijkt dat deze inburgeringsplichtige niet in staat is het niveau
      B1 van het Gemeenschappelijk Europees Referentiekader voor Moderne Vreemde Talen te behalen binnen de termijn,
      bedoeld in [artikel 11, eerste lid][ref4], de op grond van [artikel 12][ref5] verlengde termijn, of de op grond
      van [artikel 25, tweede lid][ref6], vastgestelde nieuwe termijn, kan het college bepalen dat de mondelinge en
      schriftelijke vaardigheden in de Nederlandse taal, in afwijking van artikel 7, eerste lid, onderdeel a, geheel of
      gedeeltelijk op het niveau A2 worden geëxamineerd.

      4 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over het derde lid waarbij in ieder geval
      regels worden gesteld over de aanzienlijke inspanningen.


