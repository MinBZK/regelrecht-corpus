  - number: '24'
    text: |-
      1 Onze Minister legt een bestuurlijke boete op aan de inburgeringsplichtige die het participatieverklaringstraject
      of de module Arbeidsmarkt en Participatie niet heeft afgerond binnen de in [artikel 11, eerste lid][ref1], bedoelde
      termijn, of de op grond van [artikel 12][ref2] verlengde termijn.

      2 Onze Minister stelt in de boetebeschikking een nieuwe termijn van ten hoogste twee jaar waarbinnen de
      inburgeringsplichtige na het bekendmaken van de boetebeschikking alsnog het participatieverklaringstraject of de
      module Arbeidsmarkt en Participatie afrondt. [Artikel 12, eerste lid, onderdeel a][ref3], is van overeenkomstige
      toepassing ten aanzien van de nieuwe termijn. Bij ministeriële regeling worden nadere regels gesteld met betrekking
      tot de nieuwe termijn.

      3 Onze Minister legt de inburgeringsplichtige die niet binnen de op grond van het tweede lid vastgestelde
      termijn, of de op grond van [artikel 12][ref4] verlengde termijn, het participatieverklaringstraject of de module
      Arbeidsmarkt en Participatie heeft afgerond een bestuurlijke boete op. Het tweede lid is van overeenkomstige
      toepassing.

      4 Zolang de inburgeringsplichtige na het verstrijken van de op grond van het derde lid gestelde termijn het
      participatieverklaringstraject of de module Arbeidsmarkt en Participatie niet afrondt, legt Onze Minister iedere
      twee jaar een bestuurlijke boete op.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0044770#Artikel12
