  - number: '4'
    text: |-
      1 Onze Minister verleent vrijstelling van de inburgeringsplicht aan degene die:

      a. ten minste acht jaar leerplichtig of kwalificatieplichtig is geweest op grond van de [Leerplichtwet 1969][ref1];

      b. beschikt over een bij ministeriële regeling aangewezen diploma, certificaat of ander document waaruit blijkt dat
      diegene beschikt over de vaardigheden en kennis, bedoeld in [artikel 7, eerste lid][ref2];

      c. leerplichtig of kwalificatieplichtig is op grond van de [Leerplichtwet 1969][ref3];

      d. een opleiding volgt waarvan de afronding leidt tot uitreiking van een bij ministeriële regeling aangewezen
      diploma, certificaat of ander document waaruit blijkt dat diegene beschikt over de vaardigheden en kennis, bedoeld
      in [artikel 7, eerste lid][ref4]; of

      e. heeft aangetoond al voldoende te zijn ingeburgerd.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de toepassing van het eerste lid en
      kunnen regels worden gesteld omtrent verdere gehele of gedeeltelijke vrijstelling van de inburgeringsplicht.

      3 Voor het in behandeling nemen van een aanvraag voor de vrijstelling, gebaseerd op het eerste lid, aanhef en
      onderdeel e, kan een bij ministeriële regeling te bepalen bedrag worden vastgesteld dat is verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002628
      [ref2]: https://wetten.overheid.nl/BWBR0044770#Artikel7
