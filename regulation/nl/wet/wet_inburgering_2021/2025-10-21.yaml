        artikel: '15'
        hoofdstuk: '5'
  - number: '12'
    text: |-
      1 Onze Minister verlengt telkens de termijn, bedoeld in [artikel 11, eerste lid][ref1], als de
      inburgeringsplichtige aannemelijk maakt dat:

      a. het overschrijden van die termijn hem niet te verwijten valt; of

      b. na aanzienlijke inspanningen van de inburgeringsplichtige, verlenging leidt tot het voldoen aan de
      inburgeringsplicht conform de op grond van [artikel 15][ref2] vastgestelde leerroute.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over:

      a. de toepassing van het eerste lid; en

      b. de verdere verlenging van de termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0044770#Artikel15
