    text: |-
      1 Het college legt een boete op aan de inburgeringsplichtige als die niet of onvoldoende meewerkt aan de geboden
      ondersteuning en begeleiding, bedoeld in [artikel 15, eerste lid, onderdeel b][ref1], of niet voldoet aan hetgeen
      op grond van de vastgestelde intensiteit van het participatieverklaringstraject en de module Arbeidsmarkt en
      Participatie, bedoeld in artikel 15, eerste lid, onderdeel c, of de vastgestelde intensiteit van de leerroute,
      bedoeld in artikel 15, tweede lid, van hem verwacht wordt.

      2 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de omstandigheden waaronder en de
      frequentie waarmee een boete als bedoeld in het eerste lid wordt opgelegd.


