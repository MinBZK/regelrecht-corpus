  - number: '33'
    text: |-
      Onze Minister verstrekt, uit eigen beweging of op verzoek, aan:

      a. het college de gegevens die noodzakelijk zijn voor de uitvoering van de taken die het college op grond van deze
      wet heeft ten aanzien van de voorbereiding, ondersteuning en begeleiding, en handhaving van de inburgeringsplicht;

      b. Onze Minister van Justitie en Veiligheid de gegevens die noodzakelijk zijn voor de beoordeling van een
      verzoek tot verkrijging van het Nederlanderschap op grond van de [Rijkswet op het Nederlanderschap][ref1] en die
      noodzakelijk zijn voor de uitvoering van de [artikelen 16a][ref2], [18][ref3], [19][ref4], [21][ref5], [34][ref6]
      en [45b van de Vreemdelingenwet 2000][ref7];

      c. Onze Minister van Onderwijs, Cultuur en Wetenschap de diplomagegevens, bedoeld in
      [artikel 12, vierde lid van de Wet register onderwijsdeelnemers][ref8], ten behoeve van het register
      onderwijsdeelnemers, bedoeld in [artikel 4 van die wet][ref9];

      d. de instantie die belast is met de voorbereiding op de inburgering, bedoeld in [artikel 10][ref10], de gegevens
      die noodzakelijk zijn voor de uitvoering van die taak;

      e. cursusinstellingen de gegevens die noodzakelijk zijn voor het zicht op de voortgang van de inburgeringsplicht;

      f. de door Onze Minister aangewezen organisaties die belast zijn met de uitvoering van een internationale
      diplomawaardering, de gegevens die noodzakelijk zijn in verband met die diplomawaardering.


      [ref1]: https://wetten.overheid.nl/BWBR0003738
