    text: |-
      Een minderjarige is bekwaam de rechtshandelingen te verrichten die noodzakelijk zijn voor de uitoefening en de
      nakoming van de voor hem uit deze wet en de daarop berustende bepalingen voortvloeiende rechten en verplichtingen.
    url: https://wetten.overheid.nl/BWBR0044770/2025-10-21#Artikel2
  - number: '3'
    text: |-
      1 Inburgeringsplichtig is de vreemdeling, die rechtmatig verblijf verkrijgt in de zin van
      [artikel 8, onderdelen a en c, van de Vreemdelingenwet 2000][ref1], die 16 jaar of ouder is en de
      pensioengerechtigde leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref2], nog niet
      heeft bereikt, en:

      a. anders dan voor een tijdelijk doel in Nederland verblijft; of

      b. geestelijke bedienaar is.

      2 In afwijking van het eerste lid is niet inburgeringsplichtig:

      a. de persoon die onderdaan is van een lidstaat van de Europese Unie, een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland;

      b. het familielid van de persoon, bedoeld in onderdeel a, dat onderdaan is van een derde staat en dat uit
      hoofde van [richtlijn 2004/38/EG](32004L0038), de Overeenkomst betreffende de Europese Economische Ruimte of
      de Overeenkomst tussen de Europese Gemeenschappen en haar lidstaten, enerzijds, en de Zwitserse Bondsstaat,
      anderzijds, over het vrije verkeer van personen, gerechtigd is Nederland binnen te komen en er te verblijven;

      c. de vreemdeling die ingevolge de wetgeving van een lidstaat van de Europese Unie of een andere Staat die partij
      is bij de Overeenkomst betreffende de Europese Economische Ruimte heeft voldaan aan een inburgeringsvereiste om de
      status van langdurig ingezetene in de zin van [richtlijn 2003/109/EG](32003L0109) van 25 november 2003 betreffende
      de status van langdurig ingezeten onderdanen van derde landen (PbEU L 16), gewijzigd door [richtlijn 2011/51]
      (32011L0051)/EU van het Europees Parlement en de Raad teneinde haar werkingssfeer uit te breiden tot personen die
      internationale bescherming genieten (PbEU 2011, L 132) te verkrijgen;

      d. de persoon die anderszins op grond van bepalingen van verdragen of besluiten van volkenrechtelijke organisaties
      geen inburgeringsplicht kan worden opgelegd.

      3 De inburgeringsplicht ontstaat niet met terugwerkende kracht.

      4 Bij algemene maatregel van bestuur worden regels gesteld over het voortduren van de inburgeringsplicht in geval
      van tijdelijke beëindiging van de in het eerste lid bedoelde omstandigheden.

      5 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over het tijdelijke doel, bedoeld in het
      eerste lid, onderdeel a, waarbij zo veel mogelijk wordt aangesloten bij het verblijfsrecht van tijdelijke aard,
      bedoeld in [artikel 21, eerste lid, onderdeel f, van de Vreemdelingenwet 2000][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel21
