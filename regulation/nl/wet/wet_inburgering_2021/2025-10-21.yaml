  - number: '13'
    text: |-
      1 Het college voorziet in de maatschappelijke begeleiding van de inburgeringsplichtige die rechtmatig verblijf
      heeft op grond van een:

      a. verblijfsvergunning asiel voor bepaalde tijd; of

      b. verblijfsvergunning regulier voor bepaalde tijd, verleend onder een beperking verband houdend met verblijf als
      familie- of gezinslid, voor verblijf bij een houder van een:

      1°. verblijfsvergunning asiel voor bepaalde tijd;

      2°. verblijfsvergunning asiel voor onbepaalde tijd als bedoeld in [artikel 33 van de Vreemdelingenwet 2000][ref1];
      of

      3°. EU-verblijfsvergunning voor langdurig ingezetene die is verleend met een aantekening internationale bescherming
      als bedoeld in [artikel 45c, eerste lid, van de Vreemdelingenwet 2000][ref2].

      2 De maatschappelijke begeleiding bevat in ieder geval de volgende componenten:

      a. praktische hulp bij het regelen van basisvoorzieningen; en

      b. voorlichting over basisvoorzieningen in de Nederlandse samenleving.

      3 De maatschappelijke begeleiding vangt aan op de dag dat de inburgeringsplichtige in de basisregistratie
      personen is ingeschreven, met dien verstande dat als hij rechtmatig verblijf heeft op grond van een
      verblijfsvergunning asiel voor bepaalde tijd, het gaat om de inschrijving in de gemeente waar hij op grond van
      [artikel 28 van de Huisvestingswet 2014][ref3] is gehuisvest.

      4 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de inhoud en vormgeving van de
      maatschappelijke begeleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel45c
      [ref3]: https://wetten.overheid.nl/BWBR0035303#Artikel28
