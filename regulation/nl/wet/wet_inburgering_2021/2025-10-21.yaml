  - number: '20'
    text: |-
      1 Onze Minister verstrekt op aanvraag aan de inburgeringsplichtige die voldoet aan de bij of krachtens algemene
      maatregel van bestuur gestelde voorwaarden een lening voor de kosten van de cursus, de opleiding of het examen
      waarmee de inburgeringsplichtige aan de op grond van [artikel 15][ref1] vastgestelde leerroute kan voldoen.

      2 Aanspraak op een lening bestaat niet of niet langer voor:

      a. de inburgeringsplichtige die niet aan de inburgeringsplicht heeft voldaan binnen zes jaar na het verstrijken van
      de in [artikel 11, eerste lid][ref2], bedoelde termijn, of de op grond van [artikel 12][ref3] verlengde termijn;

      b. de persoon die niet langer inburgeringsplichtig is.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over het verstrekken van een lening aan
      anderen dan inburgeringsplichtigen.

      4 De hoogte van de lening wordt overeenkomstig bij of krachtens algemene maatregel van
      bestuur gestelde regels vastgesteld aan de hand van de hoogte van het overeenkomstig
      [artikel 8, eerste, tweede, derde en vijfde lid, van de Algemene wet inkomensafhankelijke regelingen][ref4]
      te berekenen toetsingsinkomen van de inburgeringsplichtige en diens partner als bedoeld in
      [artikel 3 van die wet][ref5].

      5 Het bedrag van de lening wordt overeenkomstig bij of krachtens algemene maatregel van bestuur gestelde regels
      betaald aan de door de inburgeringsplichtige aangewezen cursusinstelling of exameninstelling.

      6 De voordracht voor een krachtens het derde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel15
