  - number: '10'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over een aanbod tot voorbereiding
      op de inburgering voor de inburgeringsplichtige die nog niet is ingeschreven in de gemeente waar hij op grond van
      [artikel 28 van de Huisvestingswet 2014][ref1] wordt gehuisvest, alsmede over de financiering van dat aanbod. Bij
      ministeriële regeling kan een instelling worden aangewezen die belast is met de voorbereiding op de inburgering.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel28
    url: https://wetten.overheid.nl/BWBR0044770/2025-10-21#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '28'
  - number: '11'
    text: |-
      1 De inburgeringsplichtige voldoet binnen drie jaar aan de inburgeringsplicht.

      2 De termijn vangt aan op de dag na die van dagtekening van het persoonlijk plan inburgering en participatie,
      bedoeld in [artikel 15, derde lid][ref1].

      3 Het moment van aanvang wijzigt niet, indien het persoonlijk plan inburgering en participatie:

      a. al dan niet gedeeltelijk herroepen of vernietigd wordt, en er in de plaats daarvan een gewijzigd plan wordt
      vastgesteld; of

      b. opnieuw wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel15
    url: https://wetten.overheid.nl/BWBR0044770/2025-10-21#Artikel11
    references:
