  - number: '34'
    text: |-
      1 Het college verstrekt, uit eigen beweging of op verzoek, aan Onze Minister de gegevens die noodzakelijk zijn voor
      de uitvoering van de taken die Onze Minister op grond van deze wet heeft ten aanzien van de vaststelling van de
      inburgeringsplicht, de examinering, het verlengen van de termijn, het verstrekken van leningen en de handhaving in
      het kader van de inburgeringsplicht.

      2 De rijksbelastingdienst verstrekt op verzoek aan Onze Minister de inkomensgegevens die noodzakelijk zijn voor de
      uitvoering van de [artikelen 20][ref1] en [21][ref2].

      3 Cursusinstellingen verstrekken, uit eigen beweging of op verzoek, aan Onze Minister de gegevens die noodzakelijk
      zijn voor de handhaving van de inburgeringsplicht en de verlenging van de inburgeringstermijn, en de aangewezen
      cursusinstelling, bedoeld in [artikel 20, vijfde lid][ref3], verstrekt op verzoek aan Onze Minister, de gegevens
      die noodzakelijk zijn in verband met de verstrekte lening aan de inburgeringsplichtige.

      4 De door Onze Minister aangewezen organisaties die belast zijn met de uitvoering van een internationale
      diplomawaardering verstrekken, uit eigen beweging of op verzoek, aan Onze Minister de gegevens die noodzakelijk
      zijn in verband met die diplomawaardering.

      5 Onze Minister van Onderwijs, Cultuur en Wetenschap en het College voor toetsen en examens, genoemd in
      [artikel 2 van de Wet College voor toetsen en examens][ref4] verstrekken, uit eigen beweging of op verzoek, aan
      Onze Minister de gegevens die noodzakelijk zijn voor de handhaving van de inburgeringsplicht en de examinering.

      6 Het Centraal Orgaan opvang asielzoekers, bedoeld in
      [artikel 2 van de Wet Centraal Orgaan opvang asielzoekers][ref5], verstrekt Onze Minister gegevens over de
      verblijfsplaats van de inburgeringsplichtige, waaronder de verblijfsplaats waar de inburgeringsplichtige op grond
      van [artikel 28 van de Huisvestingswet][ref6] zal worden gehuisvest.


