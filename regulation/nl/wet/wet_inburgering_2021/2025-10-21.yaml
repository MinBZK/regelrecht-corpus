  - number: '38'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de gegevens die worden verstrekt
      op grond van de [artikelen 33 tot en met 35][ref1] en de wijze waarop deze gegevensverstrekkingen plaatsvinden,
      alsmede over de [artikelen 36][ref2] en [37][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0044770#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0044770#Artikel37
    url: https://wetten.overheid.nl/BWBR0044770/2025-10-21#Artikel38
