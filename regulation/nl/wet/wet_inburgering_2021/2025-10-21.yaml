  - number: 42a
    text: |-
      1 Onze Minister verstrekt een specifieke uitkering aan het college ten behoeve van het realiseren van aanbod
      voor de onderwijsroute en voor voorzieningen die, totdat dat aanbod is gerealiseerd, voor de doelgroep van
      de onderwijsroute worden getroffen vanwege de vertraging die als gevolg van het ontbreken van aanbod van de
      onderwijsroute is ontstaan.

      2 Bij ministeriële regeling worden nadere regels gesteld ter uitwerking van de specifieke uitkering, bedoeld in het
      eerste lid, waaronder in ieder geval over de bestedingseisen van de uitkering, de bevoorschotting, de hoogte van de
      uitkering, de verdeling onder de gemeenten en de verantwoording door het college.

      3 Onze Minister kan de uitkering geheel of gedeeltelijk terugvorderen indien niet uit de informatie die is
      verstrekt op grond van [artikel 17a van de Financiële-verhoudingswet][ref1] blijkt dat de uitkering is besteed in
      overeenstemming met het eerste lid.

      4 Dit artikel vervalt op een bij koninklijk besluit te bepalen tijdstip, met dien verstande dat het van toepassing
      blijft op geschillen die op dat tijdstip in bezwaar, beroep of hoger beroep aanhangig zijn met betrekking tot
      besluiten van Onze Minister die op grond van dit artikel zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0044770/2025-10-21#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
  - number: '53'
    text: |-
      Onze Minister zendt binnen vijf jaar na inwerkingtreding van deze wet, en vervolgens telkens na vijf jaar, aan
      de Staten-Generaal een verslag over de doeltreffendheid en de effecten in de praktijk. Daarbij wordt in het
      bijzonder aandacht besteed aan de mate waarin en de wijze waarop afspraken over het deelnemen aan voorschoolse
      educatie, bedoeld in [artikel 1.1 van de Wet kinderopvang][ref1], of de vroegschoolse educatie, bedoeld in
      [artikel 1 van de Wet op het primair onderwijs][ref2], bijdragen aan het deelnemen aan voor- en vroegschoolse
      educatie bij deze groep.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel1
    url: https://wetten.overheid.nl/BWBR0044770/2025-10-21#Artikel53
