  - number: '21'
    text: |-
      1 De inburgeringsplichtige, de voormalige inburgeringsplichtige of de persoon, bedoeld in
      [artikel 20, derde lid][ref1], betaalt de lening vermeerderd met een volgens bij of krachtens algemene maatregel
      van bestuur te stellen regels berekende rente terug.

      2 Onze Minister stelt een termijnbedrag vast dat de debiteur in maandelijkse termijnen moet
      terugbetalen. Het termijnbedrag kan worden vastgesteld aan de hand van de hoogte van het overeenkomstig
      [artikel 8, eerste, tweede, derde en vijfde lid, van de Algemene wet inkomensafhankelijke regelingen][ref2]
      te berekenen toetsingsinkomen van de inburgeringsplichtige en diens partner als bedoeld in
      [artikel 3 van die wet][ref3].

      3 De terugbetalingsperiode start zes maanden na:

      a. het voldoen aan de inburgeringsplicht; of

      b. het vervallen van de aanspraak op een lening, op grond van [artikel 20, tweede lid][ref4].

      4 Onze Minister kan het terug te betalen bedrag invorderen bij dwangbevel.

      5 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over kwijtschelding van de lening.
      Als de lening wordt kwijtgescholden gaat de over het kwijtgescholden bedrag opgebouwde rente op het tijdstip van
      kwijtschelding teniet.


