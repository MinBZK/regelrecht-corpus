  - number: '16'
    text: |-
      1 Het college biedt de inburgeringsplichtige als bedoeld in [artikel 13, eerste lid][ref1], tijdig een cursus of
      opleiding aan waarmee die inburgeringsplichtige aan de op grond van [artikel 15][ref2] vastgestelde leerroute kan
      voldoen.

      2 Het college waarborgt een goede verhouding tussen de prijs voor de levering van en de eisen die worden gesteld
      aan de kwaliteit van het aanbod, bedoeld in het eerste lid. Het college draagt zorg voor de continuïteit van het
      aanbod.

      3 De cursusinstelling die de cursus, bedoeld in het eerste lid, gericht op het behalen van het
      inburgeringsexamen of de zelfredzaamheidsroute aanbiedt, is in het bezit van een certificaat als bedoeld in
      [artikel 28, eerste lid][ref3], of een keurmerk als bedoeld in [artikel 32][ref4], onverminderd het bepaalde in
      [artikel 2.78a, derde en vierde lid, van de Aanbestedingswet 2012][ref5].

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de eisen in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0044770#Artikel13
