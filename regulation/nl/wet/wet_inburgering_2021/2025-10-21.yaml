  - number: '35'
    text: |-
      1 De instantie, bedoeld in [artikel 14, vijfde lid][ref1], verstrekt de uitkomsten van de leerbaarheidstoets aan
      het college voor het afnemen van de brede intake en de uitvoering van [artikel 22][ref2].

      2 De instantie die belast is met de voorbereiding op de inburgering, bedoeld in [artikel 10, tweede zin][ref3],
      verstrekt aan het college de gegevens die zij voor de uitvoering van die taak hebben verkregen, voor het afnemen
      van de brede intake.

      3 Het college verstrekt de gegevens aan cursusinstellingen en de instelling, bedoeld in
      [artikel 8, tweede lid][ref4], die noodzakelijk zijn voor de uitvoering van hun taak, en cursusinstellingen of
      de instelling, bedoeld in artikel 8, tweede lid, verstrekken de gegevens over de door de inburgeringsplichtige
      geleverde inspanningen aan het college voor de uitvoering van de [artikelen 17][ref5] en [23][ref6].

      4 Indien de inburgeringsplichtige zijn woonplaats verplaatst, verstrekt het college het persoonlijk plan
      inburgering en participatie, bedoeld in [artikel 15, derde lid][ref7], evenals gegevens over de voortgang van de
      inburgeringsplicht en opgelegde boetes, op verzoek aan het college van de andere gemeente, bedoeld in artikel 15,
      vierde lid.

      5 Het college is bevoegd de gegevens die zij heeft verkregen voor de uitvoering van de taken die bij of krachtens
      de [Participatiewet][ref8] aan het college zijn opgedragen, ook te verwerken voor zover dat noodzakelijk is voor de
      uitvoering van deze wet.


