    text: De in het eerste lid voorgeschreven minimum-bemanning (schepen voor dagtochten)
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel23.12
  - number: 23.12.6.a)
    text: in de groep 2, exploitatiewijze A1, Standaard S2, en
