                            –


                            B 15




                            Voorraadruimten








                            –




                   6 Scheidingsvlakken tussen controleposten en binnen het schip gelegen verzamelruimten moeten voldoen
      aan type A0, in het geval van buiten gelegen verzamelruimten echter aan type B15. 7 Scheidingsvlakken tussen
      verblijfsruimten en binnen het schip gelegen verzamelruimten moeten voldoen aan type A30, in het geval van buiten
      gelegen verzamelruimten echter aan type B15. 8 Wanden tussen hutten, wanden tussen hutten en gangen en verticale
      scheidingsvlakken van passagiersverblijven, bedoeld in het tiende lid, moeten voldoen aan type B15 en ruimten met
      sprinklerinstallaties aan type B0. 9 Scheidingsvlakken tussen machinekamers, bedoeld in de [artikelen 15.07][ref2]
      en [15.10, zesde lid][ref3], moeten voldoen aan type A60, en overigens aan type A0.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0025973#Artikel15
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0025973
