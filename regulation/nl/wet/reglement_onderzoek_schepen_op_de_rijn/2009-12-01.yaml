        hoofdstuk: '15'
  - number: 24.06.3
    text: |-
      Deze vaartuigen moeten aan de voorschriften, die na de eerste afgifte van hun certificaat van onderzoek van kracht
      zijn geworden, volgens de in de onderstaande tabel vermelde overgangsbepalingen worden aangepast.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel24.06
