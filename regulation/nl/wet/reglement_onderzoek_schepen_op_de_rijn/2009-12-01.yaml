      [Artikel 15.11, derde lid, eerste volzin en zesde lid][ref1], is op schepen voor dagtochten, waarvan de kiel is
      gelegd op 1 april 1976 of daarvóór, tot aan de eerste verlenging van het certificaat van onderzoek ná 1.1.2045
      slechts met dien verstande van toepassing dat slechts de verven, lakken en andere behandelingsmiddelen voor
      interieurs, gebruikt voor de naar de vluchtwegen toegekeerde oppervlakken, moeilijk ontvlambaar moeten zijn en rook
      en andere giftige gassen niet in gevaarlijke mate kunnen ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel15
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel24.03
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '15'
        hoofdstuk: '15'
  - number: 24.03.3
    text: |-
      [Artikel 15.11, twaalfde lid][ref1], is op schepen voor dagtochten, waarvan de kiel is gelegd op 1 april 1976 of
      daarvóór, tot aan de eerste verlenging van het certificaat van onderzoek ná 1.1.2045 slechts met dien verstande van
      toepassing dat het voldoende is wanneer, in plaats van de dragende constructie vervaardigd van staal van trappen
      die als vluchtweg dienen, deze trappen zo zijn uitgevoerd dat zij in geval van brand ongeveer even lang bruikbaar
      blijven als trappen met een dragende constructie van staal.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel15
