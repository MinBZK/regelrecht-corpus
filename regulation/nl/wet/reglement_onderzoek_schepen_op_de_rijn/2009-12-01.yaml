                    n < 343 min–1 = 11,0


                    0,2
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.02
  - number: 8a.02.3
    text: |-
      Het voldoen aan de voorschriften, bedoeld in het tweede lid, wordt voor een motortype, een motorfamilie of
      een motorgroep vastgesteld door middel van een typegoedkeuring. De typegoedkeuring wordt vastgelegd in een
      certificaat van typegoedkeuring. De eigenaar of zijn gevolmachtigde moet een kopie van het certificaat van
      typegoedkeuring voegen bij de aanvraag van het onderzoek, bedoeld in artikel 2.02. Een kopie van het certificaat
      van typegoedkeuring en een kopie van het proces-verbaal van de motorkenmerken moeten zich aan boord bevinden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.02
  - number: 8a.02.4.a
    text: |-
      Na de inbouw van de motor aan boord, maar voor zijn ingebruikstelling, moet een inbouwkeuring worden uitgevoerd.
      Deze keuring, die deel uitmaakt van het eerste onderzoek van het vaartuig of van een bijzonder onderzoek naar
      aanleiding van de inbouw van de betreffende motor, leidt ofwel tot het inschrijven van de motor in het eerste af te
      geven certificaat van onderzoek ofwel tot een wijziging van het bestaande certificaat van onderzoek.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.02
  - number: 8a.02.4.b
    text: |-
      De Commissie van Deskundigen kan van een inbouwkeuring, bedoeld in onderdeel a, afzien indien een motor waarvan
      het nominale vermogen PN minder dan 130 kW bedraagt, wordt vervangen door eenmotor met een zelfde typegoedkeuring.
      Voorwaarde hiervoor is dat de scheepseigenaar of zijn gevolmachtigde het vervangen van de motor meedeelt aan de
      Commissie van Deskundigen, waarbij een kopie van het certificaat van typegoedkeuring moet worden gevoegd en het
      identificatienummer van de nieuw ingebouwde motor moet worden vermeld. Tengevolge hiervan wordt nummer 52 van het
      certificaat van onderzoek gewijzigd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.02
  - number: 8a.02.5
    text: |-
      Tussentijdse keuringen van de motor moeten worden uitgevoerd in het kader van het aanvullend onderzoek, bedoeld in
      artikel 2.09.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.02
  - number: 8a.02.6
    text: |-
      Na elke belangrijke wijziging van een motor, die een invloed heeft op de uitstoot van schadelijke gassen en
      luchtverontreinigende deeltjes, moet altijd een bijzondere keuring plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.02
  - number: 8a.02.7
    text: |-
      De nummers van de typegoedkeuringen en de identificatienummers van alle aan boord van een vaartuig geïnstalleerde
      motoren, die onder de bepalingen van dit hoofdstuk vallen, moeten door de Commissie van Deskundigen worden
      ingeschreven onder punt 52 van het certificaat van onderzoek.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.02
  - number: 8a.02.8
    text: |-
      De bevoegde autoriteit kan zich voor de vervulling van taken, bedoeld in dit hoofdstuk, doen bijstaan door een
      technische dienst.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.02
  - number: 8a.03.1
    text: |-
      Een aanvraag van een typegoedkeuring van een motortype, een motorfamilie of een motorgroep moet door de fabrikant
      bij de bevoegde autoriteit worden ingediend. Bij de aanvraag moet een informatiedossier, het ontwerp van een
      proces-verbaal van de motorkenmerken en het ontwerp van een inlichtingenformulier van de fabrikant ter controle
      van de componenten betrekking hebbend op de uitlaatgassen en de motorkenmerkenworden gevoegd. De fabrikant moet
      voor de typekeuringen een motor, die voldoet aan de essentiële kenmerken vermeld in bijlage J, deel II, aanhangsel
      1, demonstreren.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.03
  - number: 8a.03.2
    text: |-
      Indien de bevoegde autoriteit, in het geval van een aanvraag van een typegoedkeuring van een motorfamilie of van
      een motorgroep, vaststelt dat de ingediende aanvraag met betrekking tot de geselecteerde basismotor voor de in
      bijlage J, deel II, aanhangsel 2, beschreven motorfamilie of motorgroep niet representatief is, moet een andere, en
      eventueel een extra, basismotor, die door de bevoegde autoriteit wordt aangewezen, ten behoeve van de goedkeuring,
      bedoeld in het eerste lid, ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.03
  - number: 8a.03.3
    text: |-
      Een aanvraag van een typegoedkeuring voor een motortype, een motorfamilie of een motorgroep mag bij niet meer dan
      één bevoegde autoriteit worden ingediend. Voor ieder goed te keuren motortype, motorfamilie of motorgroep moet een
      afzonderlijke aanvraag worden ingediend.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.03
  - number: 8a.04.1
    text: |-
      De bevoegde autoriteit, waarbij de aanvraag wordt ingediend, verleent de typegoedkeuring voor alle motortypes,
      motorfamilies of motorgroepen die overeenstemmen met de gegevens van de informatiedossiers en aan de voorschriften
      van dit hoofdstuk voldoen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.04
  - number: 8a.04.2
    text: |-
      De bevoegde autoriteit vult voor ieder motortype en iedere motorfamilie of motorgroep waarvoor zij goedkeuring
      verleent alle desbetreffende onderdelen van het certificaat van typegoedkeuring in, waarvan het model is opgenomen
      in bijlage J, deel III; zij stelt de inhoudsopgave van het informatiepakket op of verifieert deze. De certificaten
      van typegoedkeuring moeten worden genummerd volgens het systeem aangegeven in bijlage J, deel IV. Het ingevulde
      certificaat van typegoedkeuring en de daarbij behorende bijlagen worden aan de aanvrager toegezonden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.04
  - number: 8a.04.3
    text: |-
      Indien de goed te keuren motor zijn functie slechts vervult of bijzondere kenmerken slechts vertoont in combinatie
      met andere onderdelen van het vaartuig waarin hij zal worden ingebouwd, en om die reden de naleving van één of
      meer eisen slechts kan worden geverifieerd wanneer de goed te keuren motor in combinatie met andere echte of
      gesimuleerde onderdelen van het vaartuig functioneert, moet de geldigheid van de typegoedkeuring van deze motor
      (motoren) dienovereenkomstig worden beperkt. In dergelijke gevallen moeten in het certificaat van typegoedkeuring
      van een motortype, van een motorfamilie of van een motorgroep de eventuele beperkingen in het gebruik alsmede
      eventuele voorwaarden waaraan bij montage moet worden voldaan, worden vermeld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.04
  - number: 8a.04.4
    text: 'Elke bevoegde autoriteit zendt:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.04
  - number: 8a.04.4.a
    text: |-
      bij iedere wijziging aan de andere bevoegde autoriteiten een lijst, die de in bijlage J, deel V, vermelde gegevens
      bevat, van de goedkeuringen van de motortypes, de motorfamilies en de motorgroepen die zij in de betrokken periode
      heeft verleend, geweigerd of ingetrokken;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.04
  - number: 8a.04.4.b
    text: |-
      op verzoek van een andere bevoegde autoriteit een kopie van het certificaat van typegoedkeuring van het motortype,
      de motorfamilie of de motorgroep al dan niet met het informatiepakket van ieder motortype en iedere motorfamilie of
      motorgroep waarvoor zij goedkeuring heeft verleend, geweigerd of ingetrokken, en zo nodig de lijst van de motoren
      die zijn geproduceerd in overeenstemming met de verleende typegoedkeuringen, omschreven in artikel 8a.06, derde
      lid, met de gegevens, bedoeld in bijlage J, deel VI.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.04
  - number: 8a.04.5
    text: |-
      Elke bevoegde autoriteit zendt jaarlijks en bovendien bij ontvangst van een daartoe strekkend verzoek aan het
      secretariaat van de Centrale Commissie voor de Rijnvaart een kopie van het in bijlage J, deel VII, bedoelde
      technische gegevensformulier betreffende de motortypes, motorfamilies en motorgroepen die sinds de laatste
      kennisgeving zijn goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.04
  - number: 8a.05.1
    text: |-
      De bevoegde autoriteit, die de typegoedkeuring heeft verleend, moet de nodige maatregelen nemen om ervoor te zorgen
      dat zij in kennis wordt gesteld van iedere wijziging van de gegevens in het informatiepakket.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.05
  - number: 8a.05.2
    text: |-
      De aanvraag om wijziging of uitbreiding van een typegoedkeuring wordt uitsluitend ingediend bij de bevoegde
      autoriteit die de oorspronkelijke typegoedkeuring heeft verleend.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.05
  - number: 8a.05.3
    text: 'Indien in het informatiepakket vermelde gegevens worden gewijzigd, verstrekt de bevoegde autoriteit:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.05
  - number: 8a.05.3.a
    text: |-
      indien nodig, de herziene bladzijden van het informatiepakket; op iedere herziene bladzijde moeten duidelijk de
      aard van de wijziging en de datum van de herziene versie zijn vermeld; bij iedere heruitgave van bladzijden moet
      ook de inhoudsopgave van het informatiepakket (dat bij het certificaat van typegoedkeuring is gevoegd) worden
      gewijzigd om deze in overeenstemming te brengen met de laatste stand van zaken;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.05
  - number: 8a.05.3.b
    text: |-
      een herzien certificaat van typegoedkeuring (met een uitbreidingsnummer) indien de daarin voorkomende gegevens (met
      uitzondering van de bijlagen) zijn gewijzigd of indien de minimum eisen van dit hoofdstuk sinds de oorspronkelijke
      datum van de goedkeuring zijn veranderd; in dit herziene certificaat moeten duidelijk de reden voor de herziening
      en de datum van afgifte van de herziene versie worden vermeld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.05
  - number: 8a.06.1
    text: |-
      De fabrikant brengt op iedere eenheid die conform de typegoedkeuring is geproduceerd de in bijlage J, deel I,
      onderdeel 1, vastgestelde merktekens aan met inbegrip van het typegoedkeuringsnummer.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.06
  - number: 8a.06.2
    text: |-
      Indien de typegoedkeuring overeenkomstig artikel 8a.04, derde lid, beperkingen aan het gebruik bevat, moeten door
      de fabrikant bij iedere gefabriceerde eenheid gedetailleerde gegevens over deze beperkingen alsmede de volledige
      inbouwvoorschriften worden bijgeleverd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.06
  - number: 8a.06.3
    text: |-
      De fabrikant zendt op verzoek van de autoriteit die de typegoedkeuring heeft verleend binnen 45 dagen na het
      einde van ieder kalenderjaar, en onmiddellijk na ieder verder tijdstip dat door de autoriteit is vastgesteld,
      een lijst met de identificatienummers (serienummers) van alle motoren die conform de eisen van dit hoofdstuk zijn
      geproduceerd sinds de laatste lijst werd ingediend of sinds de datum waarop deze voorschriften voor het eerst van
      kracht werden. Indien het codesysteem van de motor daarover geen uitsluitsel geeft, moet deze lijst het verband
      aangeven tussen de identificatienummers en de daarbij behorende motortypes, de motorfamilies of de motorgroepen en
      de typegoedkeuringsnummers. Bovendien moet de lijst bijzondere gegevens bevatten indien de fabrikant niet langer
      een goedgekeurd motortype, een goedgekeurde motorfamilie of motorgroep produceert. Indien de bevoegde autoriteit
      niet verlangt dat deze lijst haar regelmatig wordt toegezonden, moet de fabrikant de geregistreerde gegevens
      gedurende ten minste 40 jaren bewaren.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.06
  - number: 8a.07.1
    text: |-
      Met gebruikmaking van de navolgende tabel gelden typegoedkeuringen overeenkomstig de Richtlijnen van de Europese
      Gemeenschap als gelijkwaardig aan de typegoedkeuringen overeenkomstig de voorwaarden en de bepalingen van dit
      hoofdstuk:







                    Doel van de motor


                    Richtlijn


                    Motorcategorie






                    Hoofdaandrijving van het schip


                    2004/26/EG


                    V




                    Hulpmotor met constant toerental


                    2004/26/EG


                    V




                    H, I, J, K




                    97/68/EG


                    D, E, F, G,




                    Hulpmotor met variabel toerental en variabele belasting


                    2004/26/EG


                    V




                    H, I, J, K
                    L, M, N, P
                    Q, R
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.07
  - number: 8a.07.2
    text: |-
      De Centrale Commissie voor de Rijnvaart kan de gelijkwaardigheid erkennen van overeenstemmende normen vastgelegd in
      internationale regelingen, dan wel in voorschriften van de Rijnoeverstaten of België of van een derde land met de
      voorwaarden en de bepalingen van dit hoofdstuk inzake de typegoedkeuring van motoren.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.07
  - number: 8a.08.1
    text: |-
      De bevoegde autoriteit die een typegoedkeuring verleent, zorgt ervoor dat de identificatienummers van de motoren
      die overeenkomstig de voorschriften van dit hoofdstuk zijn geproduceerd, zo nodig in samenwerking met de andere
      bevoegde autoriteiten, worden geregistreerd en gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.08
  - number: 8a.08.2
    text: |-
      Een bijkomende controle van de identificatienummers kan plaats vinden bij gelegenheid van de controle van de
      conformiteit van de produktie, bedoeld in artikel 8a.09.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.08
  - number: 8a.08.3
    text: |-
      Met betrekking tot de controle van de identificatienummers verstrekken de fabrikant of zijn in de Rijnoeverstaten
      en België gevestigde agenten op verzoek van de bevoegde autoriteit onverwijld alle benodigde gegevens betreffende
      de cliënten alsook de identificatienummers van de motoren, waarvan is medegedeeld dat zij conform artikel 8a.06,
      derde lid, zijn geproduceerd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.08
  - number: 8a.08.4
    text: |-
      Indien een fabrikant, na een verzoek daartoe van de bevoegde autoriteit, niet in staat is de in artikel
      8a.06 bedoelde voorschriften na te komen, kan de goedkeuring voor het betreffende motortype of de betreffende
      motorfamilie of motorgroep worden ingetrokken. Daarvan wordt kennis gegeven volgens de procedure overeenkomstig
      artikel 8a.10, vierde lid.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.08
  - number: 8a.09.1
    text: |-
      De bevoegde autoriteit, die een typegoedkeuring verleent, vergewist er zich van tevoren van, zo nodig in
      samenwerking met de andere bevoegde autoriteiten, dat de met betrekking tot bijlage J, deel I, onderdeel 4,
      passende voorzorgsmaatregelen zijn getroffen om een doeltreffende controle van de conformiteit van de produktie
      te waarborgen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.09
  - number: 8a.09.2
    text: |-
      De bevoegde autoriteit, die een typegoedkeuring heeft verleend, vergewist er zich van, zo nodig in samenwerking
      met de andere bevoegde autoriteiten, dat de in het eerste lid bedoelde voorzorgsmaatregelen nog steeds afdoende
      zijn en elke geproduceerde motor die krachtens dit hoofdstuk van een typegoedkeuringsnummer is voorzien nog steeds
      beantwoordt aan de beschrijving die in het certificaat van typegoedkeuring, en de daarbij behorende bijlagen inzake
      het goedgekeurde motortype, de goedgekeurde motorfamilie of motorgroep is gegeven.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.09
  - number: 8a.10.1
    text: |-
      Er is sprake van non-conformiteit met het goedgekeurde motortype, de goedgekeurde motorfamilie of de goedgekeurde
      motorgroep, indien er afwijkingen worden vastgesteld van de kenmerken in het certificaat van typegoedkeuring of
      eventueel in het informatiepakket, indien deze afwijkingen niet door de bevoegde autoriteit die de typegoedkeuring
      heeft verleend zijn toegestaan op grond van artikel 8a.05, derde lid.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.10
  - number: 8a.10.2
    text: |-
      Indien de bevoegde autoriteit, die een typegoedkeuring heeft verleend, vaststelt dat motoren, die van een
      certificaat van conformiteit of van een goedkeuringsmerk zijn voorzien, niet conform zijn met het motortype, de
      motorfamilie of de motorgroep waaraan zij de goedkeuring heeft verleend, neemt zij de nodige maatregelen om ervoor
      te zorgen dat de in produktie zijnde motoren opnieuw in overeenstemming worden gebracht met het goedgekeurde
      motortype, de goedgekeurde motorfamilie of motorgroep. De bevoegde autoriteit, die de non-conformiteit heeft
      vastgesteld, stelt de andere bevoegde autoriteiten en het secretariaat van de Centrale Commissie voor de Rijnvaart
      in kennis van de genomen maatregelen, die kunnen leiden tot de intrekking van de typegoedkeuring.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.10
  - number: 8a.10.3
    text: |-
      Indien een bevoegde autoriteit kan aantonen dat motoren die van een typegoedkeuringsnummer zijn voorzien niet
      conform zijn met het goedgekeurde motortype, de goedgekeurde motorfamilie of motorgroep, kan zij de bevoegde
      autoriteit die de typegoedkeuring heeft verleend verzoeken te controleren of de in produktie zijnde motoren conform
      zijn met het goedgekeurde motortype, de goedgekeurde motorfamilie of motorgroep. De hiertoe vereiste maatregelen
      moeten binnen zes maanden na de datum van het verzoek worden genomen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.10
  - number: 8a.10.4
    text: |-
      De bevoegde autoriteiten stellen elkaar in kennis van en informeren het secretariaat van de Centrale Commissie voor
      de Rijnvaart binnen één maand over de intrekking van een typegoedkeuring en van de redenen daarvoor.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.10
  - number: 8a.11.1
    text: |-
      Bij gelegenheid van de inbouwkeuring, bedoeld in artikel 8a.02, vierde lid, van de tussentijdse keuring, bedoeld
      in artikel 8a.02, vijfde lid, en van de bijzondere keuring, bedoeld in artikel 8a. 02, zesde lid, verifieert
      de bevoegde autoriteit de feitelijke toestand van de motor met betrekking tot de onderdelen, de ijking en
      de afstellingen van de parameters zoals die in het proces-verbaal van de motorkenmerken zijn gespecificeerd.
      Indien een bevoegde autoriteit vaststelt, dat een motor niet conform is met het goedgekeurde motortype, de
      goedgekeurde motorfamilie of motorgroep, kan zij eisen dat de conformiteit van de motor wordt hersteld, dat de
      typegoedkeuring, bedoeld in artikel 8a.05, dienovereenkomstig wordt gewijzigd of dat metingen van de werkelijke
      uitstoot worden uitgevoerd. Indien de conformiteit van de motor niet wordt hersteld of indien de typegoedkeuring
      niet dienovereenkomstig wordt aangepast of indien de uitgevoerde metingen aantonen dat de uitstoot niet in
      overeenstemming is met de toegelaten grenswaarden, bedoeld in artikel 8a.02, tweede lid, weigert de bevoegde
      autoriteit de afgifte van een certificaat van onderzoek of trekt zij een eerder afgegeven certificaat van onderzoek
      in.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.11
  - number: 8a.11.2
    text: |-
      Bij motoren die uitgerust zijn met een systeem voor nabehandeling van de uitlaatgassen moet de werking van het
      bedoelde systeem ter gelegenheid van de inbouwkeuring, de tussentijdse keuring of de bijzondere keuring worden
      getest.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.11
  - number: 8a.11.3
    text: |-
      Die keuringen als bedoeld in het eerste lid geschieden aan de hand van het inlichtingenformulier van de fabrikant
      ter controle van de componenten betrekking hebbend op de uitlaatgassen en de motorkenmerken. In dit formulier, dat
      door de fabrikant wordt opgesteld en dat door een bevoegde autoriteit moet worden goedgekeurd, worden de onderdelen
      die betrekking hebben op de uitlaatgassen alsmede de instellingen en kenmerken gespecificeerd, bij toepassing
      waarvan kan worden uitgegaan van een onafgebroken inachtneming van de grenswaarden van het uitlaatgas. Daarin wordt
      tenminste vermeld:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.11
  - number: 8a.11.3.a
    text: |-
      Vermelding van het motortype, van de motorfamilie of van de motorgroep daarbij het nominale vermogen en het
      nominale toerental specificerend;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.11
  - number: 8a.11.3.b
    text: Een lijst van componenten betrekking hebbend op de uitlaatgassen en de motor kenmerken;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.11
  - number: 8a.11.3.c
    text: |-
      Niet te verwarren merktekens om de toegelaten componenten betrekking hebbend op de uitlaatgassen te identificeren
      (bijv. nummers van onderdelen die zich op de componenten bevinden);
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.11
  - number: 8a.11.3.d
    text: |-
      Vermelding van de motorkenmerken die betrekking hebben op de uitlaatgassen zoals instellingsmogelijkheden van het
      injectiemoment, van de toegelaten temperatuur van het koelwater en van de maximale tegendruk van het uitlaatgas.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.11
  - number: 8a.12.1
    text: |-
      De Oeverstaten en België delen aan de Centrale Commissie voor de Rijnvaart de namen en de adressen van de bevoegde
      autoriteiten en technische diensten mede, die verantwoordelijk zijn voor de uitvoering van dit hoofdstuk. De
      technische diensten moeten voldoen aan de geharmoniseerde normen voor het functioneren van testlaboratoria (EN ISO/
      IEC 17 025: 2000) en voldoen aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.12
  - number: 8a.12.1.a
    text: de fabrikanten van motoren kunnen niet als technische dienst worden erkend;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.12
  - number: 8a.12.1.b
    text: |-
      voor de toepassing van dit hoofdstuk mag een technische dienst met toestemming van de bevoegde autoriteit gebruik
      maken van inrichtingen buiten zijn eigen testinstelling.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.12
  - number: 8a.12.2
    text: |-
      Technische diensten niet gelegen in de lidstaten van de Centrale Commissie voor de Rijnvaart kunnen slechts op
      aanbeveling van de Centrale Commissie voor de Rijnvaart worden erkend.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel8a.12
  - number: 9.01.1
    text: |-
      Indien voor bepaalde onderdelen van een installatie bijzondere voorschriften ontbreken, wordt de veiligheidsgraad
      als voldoende beschouwd wanneer die onderdelen zijn vervaardigd volgens een geldende Europese norm of volgens de
      voorschriften van een erkend classificatiebureau. De benodigde bescheiden moeten worden voorgelegd aan de Commissie
      van Deskundigen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.01
  - number: 9.01.2
    text: 'Aan boord moeten de volgende, door de Commissie van Deskundigen gewaarmerkte, bescheiden aanwezig zijn:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.01
  - number: 9.01.2.a
    text: overzichtschema’s van de gehele elektrische installatie;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.01
  - number: 9.01.2.b
    text: |-
      schema’s van het hoofdschakelbord, het noodschakelbord en de verdeelkasten waarop de belangrijkste technische
      gegevens zoals de nominale stroomsterkte van zekeringen en schakelapparatuur zijn aangegeven;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.01
  - number: 9.01.2.c
    text: gegevens betreffende de vermogens van elektrische apparaten;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.01
  - number: 9.01.2.d
    text: soort en doorsnede van de kabels.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.01
  - number: 9.01.3
    text: |-
      De installaties moeten voor een permanente slagzij van het schip tot 15° en een omgevingstemperatuur, bij plaatsing
      binnen in het schip, van 0 °C tot + 40 °C en, bij plaatsing aan dek, van –20 °C tot + 40 °C zijn uitgevoerd en
      moeten tot deze grenzen onberispelijk functioneren.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.01
  - number: 9.01.4
    text: Elektrische en elektronische installaties en apparaten moeten goed toegankelijk en onderhoudsvriendelijk zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.01
  - number: 9.02.1
    text: |-
      Aan boord van vaartuigen die zijn voorzien van een elektrische installatie moeten ten behoeve van de
      energieverzorging in principe twee energiebronnen aanwezig zijn, zodat bij het uitvallen van één energiebron
      de resterende energiebron in staat is om de verbruikers, die voor de veilige vaart noodzakelijk zijn, gedurende
      tenminste 30 minuten te voeden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.02
  - number: 9.02.2
    text: |-
      Het voldoende bemeten zijn van de energieverzorging moet worden aangetoond aan de hand van een vermogensbalans.
      Hierbij kan een passende gelijktijdigheidsfactor in aanmerking worden genomen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.02
  - number: 9.02.3
    text: |-
      Onverminderd het eerste lid is voor de energiebron van stuurinrichtingen (roerinstallaties) [artikel 6.04][ref1]
      van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel6
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel9.02
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '6'
        hoofdstuk: '6'
  - number: '9.03'
    text: |-
      De minimum beschermingsgraad van de permanent geïnstalleerde delen van de installaties moet in overeenstemming zijn
      met de plaats van opstelling, zoals aangegeven in de onderstaande tabel:











