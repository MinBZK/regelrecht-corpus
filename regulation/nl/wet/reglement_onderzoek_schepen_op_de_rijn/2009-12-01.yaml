  - number: 24.08.1
    text: |-
      Officiële scheepsnummers die vóór 1 april 2007 zijn toegekend, worden per 1 april 2007 door het cijfer ‘0’
      voorafgaand daaraan toe te voegen, omgezet in unieke Europese scheepsidentificatienummers.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel24.08
  - number: 24.08.2
    text: |-
      Het uniek Europees scheepsidentificatienummer wordt uiterlijk bij het vernieuwen van het certificaat van onderzoek
      na 31 maart 2007 in het certificaat van onderzoek en in het register overeenkomstig bijlage C ingevuld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel24.08
