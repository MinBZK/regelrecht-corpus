        hoofdstuk: '15'
      - id: ref3
        bwb_id: BWBR0025973
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.11.2.b
    text: 'Scheidingsvlakken van het type ‘A’ zijn schotten, wanden en dekken, die aan de volgende eisen voldoen:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.2.b.aa
    text: Ze zijn vervaardigd van staal of een ander gelijkwaardig materiaal.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.2.b.bb
    text: Ze zijn op een geschikte wijze versterkt.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.2.b.cc
    text: |-
      Ze zijn zodanig geïsoleerd met een toegelaten onbrandbaar materiaal, dat de gemiddelde temperatuur aan de van de
      brand afgekeerde zijde niet meer dan 140 °C boven de begintemperatuur stijgt en op geen enkele plaats met inbegrip
      van de verbindingen een temperatuurverhoging van meer dan 180 °C boven de begintemperatuur plaatsvindt binnen de
      hierna aangegeven tijdsduur: type ‘A 60’ 60 minuten type ‘A 30’ 30 minuten type ‘A 0’ 0 minuten.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.2.b.dd
    text: |-
      Ze zijn zodanig gebouwd, dat ze de doorvoer van rook en vuur verhinderen tot aan het einde van de standaard
      brandtest van één uur.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.2.c
    text: |-
      Scheidingsvlakken van het type ‘B’ zijn schotten, wanden, dekken, dekens of bekledingen, die aan de volgende eisen
      voldoen:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.2.c.aa
    text: |-
      Ze bestaan uit een toegelaten onbrandbaar materiaal, en alle materialen die voor de constructie en het installeren
      van de scheidingsvlakken worden toegepast zijn onbrandbaar met uitzondering van oppervlaktemateriaal dat tenminste
      moeilijk ontvlambaar moet zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.2.c.bb
    text: |-
      Ze hebben een zodanige isolatiewaarde, dat de gemiddelde temperatuur aan de van de brand afgekeerde zijde niet
      meer dan 140 °C boven de begintemperatuur stijgt en op geen enkele plaats met inbegrip van de verbindingen
      een temperatuurverhoging van meer dan 225 °C boven de begintemperatuur plaatsvindt binnen de hierna aangegeven
      tijdsduur: type ‘B 15’ 15 minuten type ‘B 0’ 0 minuten.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.2.c.cc
    text: |-
      Ze zijn zodanig gebouwd dat ze de doorvoer van vuur verhinderen tot aan het eind van het eerste half uur van de
      standaard brandtest.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.3
    text: |-
      In ruimten, met uitzondering van machinekamers en voorraadruimten, toegepaste verf, lak en andere producten
      voor het behandelen van oppervlakken, alsmede bedekking van dekken moeten moeilijk ontvlambaar zijn. Vaste
      vloerbedekking, stoffen, gordijnen en andere hangende materialen van textiel, alsmede gestoffeerde meubels en
      beddengoed, moeten moeilijk ontvlambaar zijn voorzover de ruimten waarin ze zich bevinden niet beschikken over een
      automatisch werkende sprinklerinstallatie als bedoeld in [artikel 10.03a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel10
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '10'
        hoofdstuk: '10'
  - number: 15.11.4
    text: |-
      De in ruimten voor passagiers aangebrachte plafonds en stofferingen van wanden met inbegrip van de constructies
      daaronder moeten, voorzover die ruimten niet over een automatisch werkende sprinklerinstallatie beschikken als
      bedoeld in [artikel 10.03a][ref1], van onbrandbaar materiaal zijn vervaardigd met uitzondering van de oppervlakken
      ervan die tenminste moeilijk ontvlambaar moeten zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel10
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '10'
        hoofdstuk: '10'
  - number: 15.11.5
    text: |-
      Meubels en constructies in verblijfsruimten, waarin zich verzamelruimten bevinden, moeten, voorzover die ruimten
      niet beschikken over een automatisch werkende sprinklerinstallatie als bedoeld in [artikel 10.03a][ref1], van
      onbrandbaar materiaal zijn vervaardigd.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel10
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '10'
        hoofdstuk: '10'
  - number: 15.11.6
    text: |-
      Verf, lak en andere stoffen, die worden toegepast op onbeschermde oppervlakken aan de binnenkant, mogen bij brand
      niet meer dan normale hoeveelheden rook en giftige stoffen ontwikkelen. Dit moet worden aangetoond met toetsing aan
      de code voor brandtestmethoden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.7
    text: |-
      Isolatiemateriaal in verblijfsruimten moet onbrandbaar zijn. Dit geldt niet voor isolaties van leidingen voor
      koelvloeistof. De oppervlakken van de isolatie van deze leidingen moeten tenminste moeilijk ontvlambaar zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.8
    text: 'Deuren in scheidingsvlakken als bedoeld in het tweede lid moeten aan de volgende eisen voldoen:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.8.a
    text: Ze moeten aan dezelfde eisen, bedoeld in het tweede lid, voldoen als de scheidingsvlakken zelf.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.8.b
    text: |-
      Ze moeten, voorzover het deuren in scheidingsvlakken, bedoeld in het tiende lid, dan wel deuren in wanden die
      machinekamers omsluiten, keukens en trappen betreft, automatisch sluitend zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.8.c
    text: |-
      Automatisch sluitende deuren, die bij een normale situatie open staan, moeten ter plaatse en vanuit een permanent
      door de bemanning en het boordpersoneel bezette plaats kunnen worden gesloten. Na sluiting op afstand moet de deur
      ter plaatse opnieuw geopend en veilig gesloten kunnen worden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.8.d
    text: |-
      Waterdichte deuren als bedoeld in [artikel 15.02][ref1] behoeven niet te worden geïsoleerd.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel15
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.11.9
    text: |-
      Wanden als bedoeld in het tweede lid moeten van dek tot dek opgetrokken zijn, dan wel eindigen bij doorlopende
      plafonds die aan dezelfde eisen, bedoeld in het tweede lid, voldoen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.10
    text: |-
      De volgende passagiersruimten moeten zijn onderverdeeld met verticale scheidingsvlakken als bedoeld in het tweede
      lid:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.10.a
    text: Passagiersruimten met een totale oppervlakte van meer dan 800 m2;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.10.b
    text: Passagiersruimten, waarin zich hutten bevinden, met tussenruimten van ten hoogste 40 m.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.11
    text: |-
      Holle ruimten boven de plafonds, onder vloeren en achter wandbekleding moeten met tussenruimten van ten hoogste 14
      m door niet brandbare, ook bij brand goed afsluitende, tochtkleppen gescheiden zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.12
    text: Trappen moeten van staal of een ander gelijkwaardig onbrandbaar materiaal zijn vervaardigd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.13
    text: |-
      Inwendig gelegen trappen en liften moeten op alle niveaus door wanden als bedoeld in het tweede lid zijn omgeven.
      De volgende uitzonderingen kunnen worden toegestaan:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.13.a
    text: |-
      Een trap die slechts tussen twee dekken ligt behoeft niet in een schacht te liggen, wanneer de trap op één dek door
      wanden als bedoeld in het tweede lid is omgeven.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.13.b
    text: |-
      In een verblijfsruimte behoeven trappen niet in een schacht te liggen, wanneer ze volledig binnen deze ruimte
      liggen en
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.13.b.aa
    text: wanneer deze ruimte niet meer dan 2 dekken omvat dan wel
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.13.b.bb
    text: |-
      indien in deze ruimte op alle dekken een automatisch werkende sprinklerinstallatie als bedoeld in artikel 10.03a
      is geïnstalleerd, deze ruimte beschikt over een installatie voor het afzuigen van rook als bedoeld in het zestiende
      lid en deze ruimte op alle dekken een toegang tot een trappenschacht heeft.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.14
    text: 'Ventilatie- en airconditioningsystemen moeten aan de volgende eisen voldoen:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.14.a
    text: Ze moeten zodanig zijn uitgevoerd dat vuur en rook zich niet via deze systemen kunnen verspreiden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.14.b
    text: Openingen voor toe- en afvoer van lucht en airconditioningsystemen moeten kunnen worden afgesloten.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.14.c
    text: |-
      Ventilatiekanalen moeten van staal of een gelijkwaardig onbrandbaar materiaal zijn vervaardigd en op een veilige
      wijze met elkaar en met de scheepsconstructie verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.14.d
    text: |-
      Indien ventilatiekanalen met een doorsnede van meer dan 0,02 m2 door scheidingsvlakken van type A als bedoeld
      in het tweede lid of door scheidingsvlakken als bedoeld in het tiende lid lopen, moeten ze zijn uitgerust met
      automatische brandkleppen die vanaf een permanent door het boordpersoneel of leden van de bemanning bezette plaats
      kunnen worden bediend.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.14.e
    text: |-
      Ventilatiesystemen voor keuken en machinekamers moeten zijn gescheiden van ventilatiesystemen die voor andere
      ruimten werken.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.14.f
    text: |-
      Ontluchtingskanalen moeten voorzien zijn van afsluitbare openingen ten behoeve van controle en reiniging. De
      betreffende openingen moeten in de nabijheid van de brandkleppen zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.14.g
    text: Ingebouwde ventilatoren moeten kunnen worden uitgeschakeld vanaf een centrale plaats buiten de machinekamer.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.15
    text: |-
      Keukens moeten voorzien zijn van een ventilatiesysteem en keukenfornuizen met een afzuiging. De ontluchtingskanalen
      van de afzuigingen moeten voldoen aan de eisen als bedoeld in het veertiende lid en bovendien zijn voorzien van
      handbediende brandkleppen aan de ingangsopeningen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.16
    text: |-
      Controleposten, trappenschachten en binnen het schip gelegen verzamelruimten moeten zijn voorzien van inrichtingen
      voor het afzuigen van rook via een natuurlijke of machinale weg. Inrichtingen voor het afzuigen van rook moeten aan
      de volgende eisen voldoen:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.16.a
    text: Ze moeten voldoende capaciteit hebben en betrouwbaar zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.16.b
    text: Ze moeten passen bij de bedrijfsomstandigheden van het passagiersschip.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.16.c
    text: |-
      Indien inrichtingen voor het afzuigen van rook ook dienen voor de algemene ventilatie van de ruimten mag daardoor
      hun functie als inrichting voor het afzuigen van rook in geval van brand niet worden gehinderd.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.16.d
    text: Inrichtingen voor het afzuigen van rook moeten voorzien zijn van een handmatige inschakeling.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.16.e
    text: |-
      Machinale inrichtingen voor het afzuigen van rook moeten bovendien vanaf een permanent door boordpersoneel of leden
      van de bemanning bezette plaats kunnen worden bediend.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.16.f
    text: |-
      Inrichtingen voor afzuiging van rook via natuurlijke weg moeten zijn voorzien van een handmatig te bedienen
      openingsmechanisme of met een energiebron binnen deze inrichtingen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.16.g
    text: |-
      Handmatig te bedienen inschakelinrichtingen en openingsmechanismen moeten van binnen en van buiten de te beschermen
      ruimte bereikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.11.17
    text: |-
      Verblijfsruimten waarop niet permanent door boordpersoneel en leden van de bemanning wordt gelet, keukens,
      machinekamers en andere bedreigde ruimten moeten op een doelmatige brandmeldinstallatie zijn aangesloten. De
      aanwezigheid van een brand alsmede de plaats daarvan moeten automatisch worden gemeld op een permanent door
      boordpersoneel of leden van de bemanning bezette plaats.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.11
  - number: 15.12.1
    text: |-
      Behalve de draagbare blustoestellen als bedoeld in [artikel 10.03][ref1] moeten tenminste de volgende draagbare
      blustoestellen aanwezig zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel10
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.12
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '10'
        hoofdstuk: '10'
  - number: 15.12.1.a
    text: één draagbaar blustoestel voor elke 120 m2 bruto vloeroppervlak van de verblijfsruimten voor passagiers;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.12
  - number: 15.12.1.b
    text: één draagbaar blustoestel per tien hutten of deel daarvan;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.12
  - number: 15.12.1.c
    text: |-
      één draagbaar blustoestel in iedere keuken en in de nabijheid van iedere ruimte waarin brandbare vloeistoffen
      worden opgeslagen of gebruikt. In keukens moet het blusmiddel tevens geschikt zijn voor het blussen van branden
      met vet.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.12
  - number: 15.12.2
    text: 'Passagiersschepen moeten zijn voorzien van een blusinstallatie, die bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.12
  - number: 15.12.2.a
    text: |-
      twee bluspompen waarvan er één vast is opgesteld, die door een motor worden aangedreven en voldoende capaciteit
      hebben;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.12
  - number: 15.12.2.b
    text: |-
      een brandblusleiding met een voldoend aantal brandkranen, met daaraan vast aangesloten tenminste 20 m lange
      brandslangen met straalpijp, die geschikt is om zowel een sproeinevel als een waterstraal voort te brengen en die
      van een afsluitmogelijkheid is voorzien.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.12
  - number: 15.12.3
    text: 'Blusinstallaties moeten zodanig zijn uitgevoerd en een zodanige capaciteit hebben dat:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.12
  - number: 15.12.3.a
    text: |-
      elke willekeurige plaats van het schip door tenminste twee stralen water, niet afkomstig van dezelfde brandkraan en
      met voor elk slechts een slanglengte van ten hoogste 20 m, kan worden bestreken;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.12
  - number: 15.12.3.b
    text: de druk bij de brandkranen tenminste 300 kPa bedraagt; en
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.12
  - number: 15.12.3.c
    text: op alle dekken een lengte van de waterstralen van tenminste 6 m kan worden bereikt.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.12
  - number: 15.12.4
    text: |-
      Aansluitingen van blusinstallaties met schroefdraad of kraan moeten zo zijn afgesteld dat elk van de brandslangen
      bij draaiende bluspompen afgekoppeld en verwijderd kan worden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.12
  - number: 15.12.5
    text: Brandslangen binnen in het schip moeten zijn opgerold op een axiaal aangebrachte haspel.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.12
  - number: 15.12.6
    text: |-
      Materialen voor inrichtingen voor brandbestrijding moeten ofwel hittebestendig ofwel voldoende zijn beschermd tegen
      uitvallen bij hitte.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.12
  - number: 15.12.7
    text: Pijpleidingen en blusinstallaties moeten zodanig zijn aangebracht dat de kans op bevriezen wordt vermeden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.12
  - number: 15.12.8
    text: 'De twee bluspompen moeten:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.12
  - number: 15.12.8.a
    text: niet in dezelfde ruimte zijn opgesteld of geplaatst worden;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.12
  - number: 15.12.8.b
    text: onafhankelijk van elkaar kunnen functioneren;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.12
  - number: 15.12.8.c
    text: |-
      ieder op zich op alle dekken in staat zijn om de noodzakelijke druk op de blusinstallatie te houden en de vereiste
      lengte van de waterstraal te bereiken;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.12
  - number: 15.12.8.d
    text: voor het hekschot zijn opgesteld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.12
  - number: 15.12.9
    text: |-
      Machinekamers moeten zijn uitgerust met een vast ingebouwde brandblusinstallatie als bedoeld in
      [artikel 10.03b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel10
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.12
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '10'
        hoofdstuk: '10'
  - number: 15.12.10
    text: 'Op hotelschepen moeten beschikbaar zijn:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.12
  - number: 15.12.10.a
    text: |-
      twee ademhalingsapparaten die onafhankelijk van de omgevingslucht werken en voldoen aan de Europese norm EN 137 :
      1993, met volledig masker overeenkomstig de Europese norm EN 136 : 1998;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.12
  - number: 15.12.10.b
    text: |-
      twee uitrustingspakketten die tenminste bestaan uit veiligheidskleding, helm, laarzen, handschoenen, bijl, koevoet,
      zaklamp en geleidingslijn;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.12
  - number: 15.12.10.c
    text: vier vluchtmaskers.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.12
  - number: 15.13.1
    text: |-
      Op ieder passagiersschip moet een veiligheidsrol aanwezig zijn. Hierin worden de instructies voor de bemanning en
      het boordpersoneel voor de volgende gevallen omschreven:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.13.1.a
    text: averij van het schip,
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.13.1.b
    text: brand aan boord,
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.13.1.c
    text: evacuatie van de passagiers,
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.13.1.d
    text: man-over-boord.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.13.2
    text: |-
      Bij de veiligheidsrol behoort een veiligheidsplan van het schip, waarop duidelijk en overzichtelijk tenminste zijn
      aangegeven:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.13.2.a
    text: ruimten die zijn bestemd voor gebruik door personen met beperkte mobiliteit;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.13.2.b
    text: vluchtwegen, nooduitgangen, verzamel- en evacuatieruimten;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.13.2.c
    text: reddingsmiddelen en bijboten;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.13.2.d
    text: blustoestellen, brandblusinstallaties en automatisch werkende sprinklerinstallaties;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.13.2.e
    text: overige veiligheidsuitrusting;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.13.2.f
    text: |-
      alarminstallatie, bedoeld in [artikel 15.08, derde lid, onder a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel15
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.13.2.g
    text: |-
      alarminstallatie, bedoeld in [artikel 15.08, derde lid, onder b en c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel15
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.13.2.h
    text: |-
      deuren in schotten, bedoeld in [artikel 15.02, vijfde lid][ref1], en de plaatsen van waaruit deze worden
      bediend, alsook overige openingen, bedoeld in [artikel 15.02, negende, tiende en dertiende lid][ref2], en
      [artikel 15.03, twaalfde lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0025973#Artikel15
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '15'
        hoofdstuk: '15'
      - id: ref2
        bwb_id: BWBR0025973
        artikel: '15'
        hoofdstuk: '15'
      - id: ref3
        bwb_id: BWBR0025973
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.13.2.i
    text: |-
      deuren, bedoeld in [artikel 15.11, achtste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel15
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.13.2.j
    text: brandkleppen;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.13.2.k
    text: brandmeldsysteem;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.13.2.l
    text: noodstroominstallatie;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.13.2.m
    text: schakelaars van ventilatiesystemen;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.13.2.n
    text: walaansluitingen;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.13.2.o
    text: afsluiters van brandstofleidingen;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.13.2.p
    text: vloeibaargasinstallaties;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.13.2.q
    text: luidsprekerinstallaties;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.13.2.r
    text: marifooninstallaties;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.13.2.s
    text: verbandtrommels.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.13.3
    text: 'De veiligheidsrol, bedoeld in het eerste lid, en het veiligheidsplan, bedoeld in het tweede lid, moeten:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.13.3.a
    text: door de Commissie van Deskundigen zijn gewaarmerkt en
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.13.3.b
    text: op ieder dek op geschikte plaatsen duidelijk zichtbaar zijn opgehangen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.13.4
    text: |-
      In elke hut moeten de nodige instructies aanwezig zijn voor het gedrag van de passagiers alsmede een verkort
      veiligheidsplan waarin alleen de indicaties, bedoeld in het tweede lid, onder a tot en met f, zijn opgenomen. Deze
      instructies moeten tenminste bevatten:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.13.4.a
    text: 'Aangeven van noodsituaties:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.13.4.a.aa
    text: brand;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.13.4.a.bb
    text: lek raken van het schip;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.13.4.a.cc
    text: algemeen gevaar.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.13.4.b
    text: Beschrijving van de verschillende noodsignalen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.13.4.c
    text: 'Aanwijzingen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.13.4.c.aa
    text: vluchtweg;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.13.4.c.bb
    text: gedrag;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.13.4.c.cc
    text: bewaren van kalmte.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.13.4.d
    text: 'Aanwijzingen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.13.4.d.aa
    text: roken;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.13.4.d.bb
    text: gebruik van vuur en open licht;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.13.4.d.cc
    text: openen van vensters;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.13.4.d.dd
    text: gebruik van bepaalde inrichtingen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.13
  - number: 15.14.1
    text: |-
      Passagiersschepen moeten ofwel van verzameltanks voor afvalwater ofwel van geschikte zuiveringsinstallaties zijn
      voorzien.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.14
  - number: 15.14.2
    text: |-
      Tanks voor het verzamelen van afvalwater moeten voldoende capaciteit hebben. De tanks moeten zijn voorzien van een
      inrichting waarmee het niveau kan worden vastgesteld, dan wel hoever de tank gevuld is. Om de tanks leeg te maken
      moeten aan boord pompen en leidingen aanwezig zijn, waarmee het afvalwater op aanlegplaatsen aan beide zijden van
      het schip kan worden afgegeven. Doorvoer van afvalwater van andere schepen moet mogelijk zijn. De leidingen moeten
      zijn voorzien van een aansluiting voor afgifte overeenkomstig de Europese norm EN 1306 : 1996.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.14
  - number: 15.15.1
    text: |-
      Een passagiersschip dat voor het vervoer van minder dan 50 passagiers is toegelaten en waarvan L
      niet groter is dan 25 m, moet of het rekenkundig bewijs van voldoende lekstabiliteit als bedoeld in
      [artikel 15.03, zevende tot en met dertiende lid][ref1] aantonen, of bewijzen dat het schip in symmetrische
      leksituaties aan de volgende criteria voldoet:


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel15
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.15
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.15.1.a
    text: het schip mag maximaal tot aan de indompelingsgrenslijn inzinken, en
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.15
  - number: 15.15.1.b
    text: de resterende metacentrische hoogte gm mag niet kleiner zijn dan 0,10 m.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.15
  - number: 15.15.2
    text: |-
      De Commissie van Deskundigen kan bij passagiersschepen als bedoeld in het eerste lid kleine afwijkingen toelaten
      van de bij [artikel 15.06, derde lid, onder c, en vijfde lid, onder b][ref1], vereiste vrije hoogte. De afwijking
      mag niet meer zijn dan 5%. Ingeval van afwijkingen moeten de betreffende plaatsen in het schip met verf worden
      gemarkeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel15
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.15
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.15.3
    text: |-
      In afwijking van [artikel 15.03, negende lid][ref1], behoeven passagiersschepen die voor het vervoer van ten
      hoogste 250 passagiers zijn toegelaten en waarvan de lengte niet groter is dan 45 m niet te voldoen aan de 2
      compartimenten status.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel15
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.15
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.15.4
    text: (vervallen)
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.15
  - number: 15.15.5
    text: |-
      De Commissie van Deskundigen kan bij passagiersschepen, die zijn toegelaten voor het vervoer van ten hoogste
      250 passagiers en waarvan L niet meer is dan 25 m, afzien van het moeten voldoen aan artikel 10.04, indien het
      passagiersschip is uitgerust met een van twee kanten bereikbaar platform vlak boven de waterlijn, die het mogelijk
      maakt personen uit het water te redden.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.15
  - number: 15.15.5.a
    text: voor de bediening van de inrichting één persoon volstaat;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.15
  - number: 15.15.5.b
    text: mobiele inrichtingen toegestaan zijn;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.15
  - number: 15.15.5.c
    text: de inrichting zich buiten de gevarenzone van de middelen tot voortbeweging bevinden moet, en
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.15
  - number: 15.15.5.d
    text: een effectieve communicatie tussen de schipper en de persoon die de inrichting bedient mogelijk moet zijn.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.15
  - number: 15.15.6
    text: |-
      De Commissie van Deskundigen kan bij passagiersschepen, die zijn toegelaten voor het vervoer van ten hoogste 600
      passagiers en waarvan de lengte niet meer bedraagt dan 45 m, afzien van het moeten voldoen aan artikel 10.04,
      indien het passagiersschip is uitgerust met een platform overeenkomstig het vijfde lid, eerste zin, dan wel
      met een vergelijkbare inrichting als een platform als bedoeld in het vijfde lid, tweede zin. Bovendien moet het
      passagiersschip beschikken over:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.15
  - number: 15.15.6.a
    text: als hoofdaandrijving een roerpropeller, een cycloïdaalschroef of een waterstraalaandrijving, of
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.15
  - number: 15.15.6.b
    text: een hoofdaandrijving met 2 voortstuwingsorganen, of
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.15
  - number: 15.15.6.c
    text: een hoofdaandrijving en een boegschroefinstallatie.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.15
  - number: 15.15.7
    text: |-
      In afwijking van [artikel 15.02, negende lid][ref1], mag op passagiersschepen, waarvan de lengte niet meer
      bedraagt dan 45 m en waarvan het ten hoogste toegelaten aantal passagiers overeenkomt met de lengte van het
      schip in meters, een handbediende deur, die niet op afstand kan worden bediend, in een schot als bedoeld in
      [artikel 15.02, vijfde lid][ref2], in de verblijfsruimte voor passagiers aanwezig zijn, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Artikel15
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.15
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '15'
        hoofdstuk: '15'
      - id: ref2
        bwb_id: BWBR0025973
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.15.7.a
    text: het schip slechts één dek heeft;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.15
  - number: 15.15.7.b
    text: deze deur vanaf het dek direct te bereiken is en niet meer dan 10 m van de toegang tot het dek verwijderd is;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.15
  - number: 15.15.7.c
    text: |-
      de onderkant van de deuropening tenminste 30 cm boven de bodem van de verblijfsruimte voor passagiers is gelegen,
      en
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.15
  - number: 15.15.7.d
    text: de beide afdelingen die door de deur worden gescheiden zijn uitgerust met een bilge alarm.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.15
  - number: 15.15.8
    text: |-
      In afwijking van [artikel 15.06, zesde lid, onder c][ref1], mag op passagiersschepen als bedoeld in het zevende lid
      een vluchtweg door een keuken leiden, indien een tweede vluchtweg beschikbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel15
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.15
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.15.9
    text: |-
      Voor passagiersschepen, waarvan de lengte niet meer bedraagt dan 45 m, geldt
      [artikel 15.01, tweede lid, onder e][ref1], niet, wanneer de vloeibaargasinstallaties met geschikte
      alarminstallaties voor gezondheidsbedreigende concentraties van CO alsmede voor explosieve gasmengsels zijn
      uitgerust.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel15
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.15
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.15.10
    text: 'De volgende voorschriften gelden niet voor passagiersschepen waarvan de L niet meer bedraagt dan 25 m:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.15
  - number: 15.15.10.a
    text: |-
      [artikel 15.04, eerste lid, laatste zin][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel15
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.15
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.15.10.b
    text: |-
      [artikel 15.06, zesde lid, onder c][ref1], voor zover het keukens betreft, indien een tweede vluchtweg beschikbaar
      is;


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel15
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.15
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.15.10.c
    text: |-
      [artikel 15.07][ref1].

      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel15
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.15
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.15.11
    text: |-
      Op hotelschepen, waarvan de lengte niet meer bedraagt dan 45 m, is [artikel 15.12, tiende lid][ref1], niet van
      toepassing voorzover in iedere hut vluchtmaskers, in een aantal dat overeenkomt met de zich in die hut bevindende
      bedden, direct bereikbaar aanwezig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel15
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel15.15
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '15'
        hoofdstuk: '15'
  - number: 16.01.1
    text: |-
      Vaartuigen die bestemd zijn om te duwen moeten zijn voorzien van een geschikte duwinrichting. Zij moeten zo zijn
      gebouwd en uitgerust dat:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel16.01
  - number: 16.01.1.a
    text: |-
      voor het personeel de passage naar het geduwde vaartuig ook met de koppelingsmiddelen gemakkelijk en zonder gevaar
      mogelijk is;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel16.01
  - number: 16.01.1.b
    text: zij een vaste positie kunnen innemen ten opzichte van het gekoppelde vaartuig of de gekoppelde vaartuigen, en
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel16.01
  - number: 16.01.1.c
    text: ten opzichte van elkaar verschuiven van de vaartuigen wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel16.01
  - number: 16.01.2
    text: |-
      Indien bij het koppelen kabels worden gebruikt, moeten op het voor het duwen geschikte vaartuig ten minste twee
      speciale lieren of gelijkwaardige inrichtingen voor het spannen van de kabels zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel16.01
  - number: 16.01.3
    text: |-
      De koppelingsinrichting moet een hechte verbinding met het geduwde vaartuig of de geduwde vaartuigen mogelijk
      maken. Bij duwstellen die bestaan uit één duwend en slechts één geduwd vaartuig mogen de koppelingsinrichtingen
      echter ook een gestuurd knikken mogelijk maken. De daartoe vereiste aandrijvingen moeten de over te brengen
      krachten probleemloos kunnen opvangen en zij moeten gemakkelijk en zonder gevaar kunnen worden bediend. Voor deze
      aandrijvingen zijn de [artikelen 6.03 tot en met 6.05][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel6
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel16.01
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '6'
        hoofdstuk: '6'
  - number: 16.01.4
    text: |-
      Bij duwboten is een aanvaringsschot als bedoeld in [artikel 3.03, eerste lid onder a][ref1], niet vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel3
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel16.01
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '3'
        hoofdstuk: '3'
  - number: 16.02.1
    text: 'Voor duwbakken zonder stuurinrichting, verblijven, machinekamers of ketelruimen zijn niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel16.02
  - number: 16.02.1.a
    text: |-
      de [hoofdstukken 5][ref1], [6][ref2], [7][ref3] en [12][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0025973#Hoofdstuk7
      [ref4]: https://wetten.overheid.nl/BWBR0025973#Hoofdstuk12
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel16.02
    references:
      - id: ref1
        bwb_id: BWBR0025973
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0025973
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0025973
        hoofdstuk: '7'
      - id: ref4
        bwb_id: BWBR0025973
        hoofdstuk: '12'
  - number: 16.02.1.b
    text: |-
      de [artikelen 8.08, tweede tot en met achtste lid][ref1], [10.02][ref2] en [10.05, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0025973#Artikel10
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel16.02
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0025973
        artikel: '10'
        hoofdstuk: '10'
      - id: ref3
        bwb_id: BWBR0025973
        artikel: '10'
        hoofdstuk: '10'
  - number: 16.02.2
    text: 'Voor zeeschipbakken met een lengte L van ten hoogste 40 m geldt bovendien:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel16.02
  - number: 16.02.2.a
    text: |-
      Waterdichte schotten als bedoeld in [artikel 3.03, eerste lid][ref1], zijn niet vereist, wanneer de frontale
      gedeelten van de bak zodanig zijn versterkt dat zij een belasting kunnen opnemen die ten minste 2,5 maal zo groot
      is als die van het aanvaringsschot van een binnenschip met een overeenkomstige diepgang dat is gebouwd volgens de
      voorschriften van een door alle Oeverstaten en België erkend classificatiebureau;


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel3
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel16.02
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '3'
        hoofdstuk: '3'
  - number: 16.02.2.b
    text: |-
      In afwijking van [artikel 8.08, eerste lid][ref1], behoeven moeilijk toegankelijke afdelingen van een dubbele
      bodem slechts gelenst te kunnen worden, wanneer hun inhoud meer bedraagt dan 5% van de waterverplaatsing van de
      zeeschipbak bij de grootste toegelaten inzinking.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel8
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel16.02
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '8'
        hoofdstuk: '8'
  - number: 16.02.3
    text: |-
      Vaartuigen die geduwd moeten worden moeten zijn voorzien van koppelingsinrichtingen die een veilige verbinding met
      andere vaartuigen waarborgen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel16.02
  - number: '16.03'
    text: |-
      Op vaartuigen die bestemd zijn om een gekoppeld samenstel voort te bewegen moeten bolders of gelijkwaardige
      inrichtingen aanwezig zijn die het door hun aantal en opstelling mogelijk maken een afdoende verbinding tot stand
      te brengen tussen de gekoppelde vaartuigen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel16.03
  - number: '16.04'
    text: |-
      Vaartuigen die bestemd zijn om te worden voortbewogen in een samenstel moeten zijn voorzien van hiervoor geschikte
      koppelingsinrichtingen, bolders of gelijkwaardige inrichtingen die door hun aantal en opstelling een afdoende
      verbinding met het andere vaartuig of de andere vaartuigen van het samenstel waarborgen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel16.04
  - number: 16.05.1
    text: 'Vaartuigen die moeten kunnen worden gebruikt om te slepen moeten aan de volgende eisen voldoen:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel16.05
  - number: 16.05.1.a
    text: |-
      De sleepinrichtingen moeten zo zijn aangebracht dat door het gebruik daarvan de veiligheid van het schip, de
      bemanning of de lading niet in gevaar komt;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel16.05
  - number: 16.05.1.b
    text: |-
      Assisterende en slepende schepen moeten zijn uitgerust met een vanuit het stuurhuis veilig te bedienen sleephaak;
      dit geldt niet wanneer op grond van de bouwwijze of door andere voorzieningen kenteren niet mogelijk is;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel16.05
  - number: 16.05.1.c
    text: |-
      Als sleepinrichting moeten sleeplieren of een sleephaak aanwezig zijn. De sleepinrichtingen moeten vóór de
      schroeven zijn aangebracht. Dit geldt niet voor sleepboten die met het aandrijforgaan worden gestuurd, zoals een
      roerpropeller of cycloïdaalschroef;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel16.05
  - number: 16.05.1.d
    text: |-
      In afwijking van c is bij schepen die uitsluitend worden gebruikt voor het slepen van motorschepen in de zin
      van het [Rijnvaartpolitiereglement][ref1] ook een sleepinrichting zoals bolders of gelijkwaardige inrichtingen
      voldoende. Het onder b gestelde is van overeenkomstige toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0006923
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel16.05
    references:
      - id: ref1
        bwb_id: BWBR0006923
  - number: 16.05.1.e
    text: |-
      Wanneer de sleeptrossen op een achterschip zouden kunnen blijven haken dienen daar sleepbogen met draadvangers te
      zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel16.05
  - number: 16.05.2
    text: Schepen met een lengte L van meer dan 86 m mogen niet worden toegelaten om afvarend te slepen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel16.05
  - number: 16.06.1
    text: |-
      Met het oog op de toelating als duwboot of motorschip voor het voortbewegen van vaartuigen in een hecht samenstel
      en met het oog op het plaatsen van een desbetreffende aantekening in het certificaat van onderzoek bepaalt de
      Commissie van Deskundigen welke formaties haar voor onderzoek moeten worden getoond en laat zij proefvaarten
      als bedoeld in [artikel 5.02][ref1] uitvoeren met het samenstel in de verzochte formatie(s) die haar het meest
      ongunstig voorkomen. Daarbij moet dit samenstel aan de [artikelen 5.02 tot en met 5.10][ref2] voldoen. De Commissie
      van Deskundigen vergewist zich ervan of een hechte verbinding van alle vaartuigen van het samenstel bij de volgens
      [hoofdstuk 5][ref3] voorgeschreven manoeuvres verzekerd is.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0025973#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel16.06
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0025973
        artikel: '5'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0025973
        hoofdstuk: '5'
  - number: 16.06.2
    text: |-
      Indien tijdens de in het eerste lid bedoelde proefvaarten bijzondere inrichtingen op de in het samenstel
      voortbewogen vaartuigen (zoals de stuurinrichting, de aandrijf- of manoeuvreerinrichtingen of de
      scharnierkoppelingen) worden gebruikt om te voldoen aan de [artikelen 5.02 tot en met 5.10][ref1], moet in
      het certificaat van onderzoek van het vaartuig dat het samenstel voortbeweegt worden vermeld: de formatie, de
      positie, de naam en het officiële scheepsnummer van de toegelaten vaartuigen die over deze bijzondere inrichtingen
      beschikken.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel5
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel16.06
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '5'
        hoofdstuk: '5'
  - number: 16.07.1
    text: |-
      Indien een vaartuig een samenstel moet voortbewegen of daarin moet worden voortbewogen, moet in het certificaat van
      onderzoek zijn aangetekend dat het daarvoor geschikt is overeenkomstig de [artikelen 16.01 tot en met 16.06][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel16
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel16.07
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '16'
        hoofdstuk: '16'
  - number: 16.07.2
    text: 'In het certificaat van onderzoek van het vaartuig dat voor de voortbeweging zorgdraagt moet worden aangetekend:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel16.07
  - number: 16.07.2.a
    text: de toegelaten samenstellen en formaties;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel16.07
  - number: 16.07.2.b
    text: het soort koppelingen;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel16.07
  - number: 16.07.2.c
    text: de vastgestelde grootste koppelingskrachten, en
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel16.07
  - number: 16.07.2.d
    text: |-
      eventueel de minimum breeksterkte van de koppelingskabels van de langsverbindingen, alsmede het aantal windingen
      van de koppelingskabels.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel16.07
  - number: '17.01'
    text: |-
      Voor drijvende werktuigen zijn voor wat betreft bouw en uitrusting de [hoofdstukken 3][ref1],
      [7 tot en met 14][ref2] en [16][ref3] van toepassing. Drijvende werktuigen met mechanische middelen tot
      voortbeweging moeten ook voldoen aan de [hoofdstukken 5][ref4] en [6][ref5]. Aandrijvingen die slechts een geringe
      verplaatsing mogelijk maken worden niet beschouwd als mechanische middelen tot voortbeweging.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Hoofdstuk7
      [ref3]: https://wetten.overheid.nl/BWBR0025973#Hoofdstuk16
      [ref4]: https://wetten.overheid.nl/BWBR0025973#Hoofdstuk5
      [ref5]: https://wetten.overheid.nl/BWBR0025973#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.01
    references:
      - id: ref1
        bwb_id: BWBR0025973
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0025973
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0025973
        hoofdstuk: '16'
      - id: ref4
        bwb_id: BWBR0025973
        hoofdstuk: '5'
      - id: ref5
        bwb_id: BWBR0025973
        hoofdstuk: '6'
  - number: 17.02.1
    text: De Commissie van Deskundigen kan toestaan dat van de volgende bepalingen wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.02
  - number: 17.02.1.a
    text: |-
      [Artikel 3.03, eerste en tweede lid][ref1], is van overeenkomstige toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel3
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.02
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '3'
        hoofdstuk: '3'
  - number: 17.02.1.b
    text: |-
      [Artikel 7.02][ref1] is van overeenkomstige toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel7
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.02
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '7'
        hoofdstuk: '7'
  - number: 17.02.1.c
    text: |-
      De ten hoogste toegelaten niveaus van de geluidsdruk als bedoeld in
      [artikel 12.02, vijfde lid, tweede alinea][ref1], mogen worden overschreden wanneer de werkinrichtingen in bedrijf
      zijn en voor zover er dan niet aan boord wordt overnacht;


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel12
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.02
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '12'
        hoofdstuk: '12'
  - number: 17.02.1.d
    text: |-
      Van de overige bepalingen met betrekking tot bouw, inrichting en uitrusting, voor zover voor elk geval dezelfde
      veiligheid is aangetoond.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.02
  - number: 17.02.2
    text: 'De Commissie van Deskundigen kan afzien van de toepassing van de volgende bepalingen:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.02
  - number: 17.02.2.a
    text: |-
      [Artikel 10.01, eerste lid][ref1], wanneer het drijvende werktuig veilig kan worden verankerd terwijl de
      werkinrichtingen in bedrijf zijn, bij voorbeeld door middel van werkankers of palen. Een drijvend werktuig
      met eigen mechanische middelen tot voortbeweging moet echter ten minste één anker hebben als bedoeld in
      [artikel 10.01, eerste lid][ref2], waarbij de coëfficiënt k = 45 en voor T de kleinste hoogte in de zijde moet
      worden aangenomen;


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Artikel10
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.02
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0025973
        artikel: '10'
        hoofdstuk: '10'
  - number: 17.02.2.b
    text: |-
      [Artikel 12.02, eerste lid, tweede gedeelte van de zin][ref1], wanneer de ruimten voldoende elektrisch kunnen
      worden verlicht.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel12
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.02
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '12'
        hoofdstuk: '12'
  - number: 17.02.3
    text: 'Bovendien geldt:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.02
  - number: 17.02.3.a
    text: |-
      in afwijking van [artikel 8.08, tweede lid, tweede volzin][ref1]: De lenspomp moet mechanisch worden aangedreven;


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel8
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.02
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '8'
        hoofdstuk: '8'
  - number: 17.02.3.b
    text: |-
      in afwijking van [artikel 8.10, derde lid][ref1]: Bij stilliggende drijvende werktuigen mag het geluid wanneer de
      werkinrichtingen in bedrijf zijn op 25 m afstand zijdelings van de scheepshuid meer bedragen dan 65 dB(A);


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel8
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.02
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '8'
        hoofdstuk: '8'
  - number: 17.02.3.c
    text: |-
      in afwijking van [artikel 10.03, eerste lid][ref1]: Bij vrij op het dek staande werktuigen moet ten minste één
      extra draagbaar blustoestel aanwezig zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel10
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.02
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '10'
        hoofdstuk: '10'
  - number: 17.02.3.d
    text: |-
      in afwijking van [artikel 14.02, tweede lid][ref1]: Naast vloeibaargasinstallaties voor huishoudelijk gebruik
      mogen ook andere vloeibaargasinstallaties aanwezig zijn. Deze installaties met toebehoren moeten voldoen aan de
      voorschriften van één van de Oeverstaten of van België.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel14
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.02
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '14'
        hoofdstuk: '14'
  - number: 17.03.1
    text: |-
      Op drijvende werktuigen waarop tijdens het werk personen aanwezig zijn is de aanwezigheid van een algemene
      alarminstallatie vereist. Het alarmsignaal moet zich duidelijk onderscheiden van andere signalen en in alle
      verblijven en op alle werkplekken een geluidsdrukniveau doen ontstaan dat ten minste 5 dB(A) hoger is dan het ter
      plaatse overheersende maximale geluidsniveau. De alarminstallatie moet in het stuurhuis en op de belangrijkste
      bedieningspunten in werking kunnen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.03
  - number: 17.03.2
    text: |-
      Werkinrichtingen moeten voor hun belasting voldoende sterkte hebben en zij moeten voldoen aan de nationale
      voorschriften van één van de Oeverstaten of van België.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.03
  - number: 17.03.3
    text: |-
      De kantelingsstabiliteit en de sterkte van de werkinrichtningen en eventueel de bevestiging daarvan moeten zodanig
      zijn dat zij bestand zijn tegen belastingen door te verwachten slagzij, trim en bewegingen van het drijvend
      werktuig.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.03
  - number: 17.03.4
    text: |-
      Indien lasten met heftoestellen omhoog worden gebracht, dient de uit stabiliteit en sterkte resulterende maximaal
      toelaatbare last duidelijk te worden aangegeven op een bord aan dek en op de bedieningspunten. Indien het
      hefvermogen door het aankoppelen van extra drijvende voorwerpen kan woren vergroot, moeten de waarden met en zonder
      extra drijvende voorwerpen zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.03
  - number: 17.03.5
    text: |-
      Bij drijvende werktuigen die zijn toegelaten om te worden gebruikt aan de kust of op zee wordt het certificaat
      van onderzoek volgens [bijlage B][ref1], indien zij dat niet hebben, vervangen door een certificaat
      volgens [bijlage G][ref2]. Daarbij dient te zijn voldaan aan [hoofdstuk 20][ref3] met inachtneming van
      [hoofdstuk 17][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0025973
      [ref2]: https://wetten.overheid.nl/BWBR0025973
      [ref3]: https://wetten.overheid.nl/BWBR0025973#Hoofdstuk20
      [ref4]: https://wetten.overheid.nl/BWBR0025973#Hoofdstuk17
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.03
    references:
      - id: ref1
        bwb_id: BWBR0025973
      - id: ref2
        bwb_id: BWBR0025973
      - id: ref3
        bwb_id: BWBR0025973
        hoofdstuk: '20'
      - id: ref4
        bwb_id: BWBR0025973
        hoofdstuk: '17'
  - number: 17.04.1
    text: |-
      Voor de toepassing van dit hoofdstuk en in afwijking van [artikel 1.01][ref1] is de resterende veiligheidsafstand
      de kleinste verticale afstand tussen de gladde waterspiegel en het laagste punt waarboven het drijvend werktuig
      niet meer waterdicht is, waarbij rekening wordt gehouden met trim en slagzij die optreden onder invloed van de
      momenten als bedoeld in [artikel 17.07, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Artikel17
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.04
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0025973
        artikel: '17'
        hoofdstuk: '17'
  - number: 17.04.2
    text: |-
      Een resterende veiligheidsafstand bij spatwater- en regendicht afsluitbare openingen is voldoende in de zin van
      [artikel 17.07, eerste lid][ref1], wanneer deze 300 mm bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel17
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.04
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '17'
        hoofdstuk: '17'
  - number: 17.04.3
    text: |-
      De resterende veiligheidsafstand bij niet spatwater- en regendicht afsluitbare openingen moet tenminste 400 mm
      bedragen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.04
  - number: 17.05.1
    text: |-
      Voor de toepassing van dit hoofdstuk en in afwijking van resterende vrijboord is de kleinste verticale afstand
      tussen de gladde waterspiegel en de zijkant van het dek, waarbij rekening wordt gehouden met trim en slagzij, die
      optreden onder invloed van de momenten als bedoeld in [artikel 17.07, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel17
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.05
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '17'
        hoofdstuk: '17'
  - number: 17.05.2
    text: |-
      Het resterend vrijboord als bedoeld in [artikel 17.07, eerste lid][ref1], is voldoende indien het 300 mm bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel17
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.05
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '17'
        hoofdstuk: '17'
  - number: 17.05.3
    text: |-
      Het resterend vrijboord mag worden verminderd wanneer wordt aangetoond dat [artikel 17.08][ref1] in acht is
      genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel17
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.05
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '17'
        hoofdstuk: '17'
  - number: 17.05.4
    text: |-
      Indien de vorm van het drijvend voorwerp in belangrijke mate afwijkt van de vorm van een ponton, zoals bij
      cylindrische drijvende voorwerpen of bij een drijvend voorwerp waarvan de dwarsdoorsnede meer bedraagt dan vier
      zijden, kan de Commissie van Deskundigen een resterend vrijboord eisen of toelaten dat afwijkt van het tweede lid.
      Dit geldt ook voor een drijvend werktuig met verscheidene drijvende voorwerpen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.05
  - number: 17.06.1
    text: |-
      Het bewijs van stabiliteit als bedoeld in de [artikelen 17.07][ref1] en [17.08][ref2] moet worden geleverd op basis
      van een volgens goed scheepsbouwgebruik uitgevoerde hellingproef.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Artikel17
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.06
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '17'
        hoofdstuk: '17'
      - id: ref2
        bwb_id: BWBR0025973
        artikel: '17'
        hoofdstuk: '17'
  - number: 17.06.2
    text: |-
      Indien bij de hellingproef geen voldoende hellingshoek kan worden bereikt, of indien de uitvoering van de
      hellingproef onoverkomelijke technische problemen met zich meebrengt, kan in plaats daarvan een berekening
      van het gewicht en het zwaartepunt worden gemaakt. Het resultaat van de berekening van het gewicht moet worden
      gecontroleerd met behulp van metingen van de diepgang, waarbij het verschil niet meer dan ± 5% mag bedragen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.06
  - number: 17.07.1
    text: |-
      Bewezen dient te worden dat bij de tijdens het in bedrijf zijn van de installaties en tijdens de vaart optredende
      belastingen voldoende resterende veiligheidsafstand en voldoende resterend vrijboord aanwezig zijn. Daarbij mag de
      som van de hoeken tussen slagzij en trim niet meer dan 10° bedragen en mag de bodem van de scheepsromp niet boven
      het water uitkomen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.07
  - number: 17.07.2
    text: 'Het bewijs van stabiliteit moet de volgende gegevens en bescheiden bevatten:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.07
  - number: 17.07.2.a
    text: |-
      tekeningen op schaal van de drijvende voorwerpen en de werkinrichtingen alsmede de voor het bewijs van stabiliteit
      vereiste gedetailleerde gegevens, zoals de inhoud van tanks en openingen die naar het binnenste van het schip
      voeren;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.07
  - number: 17.07.2.b
    text: hydrostatische gegevens of krommen;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.07
  - number: 17.07.2.c
    text: |-
      krommen van de armen van statische stabiliteit, voor zover vereist ingevolge het vijfde lid of
      [artikel 17.08][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel17
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.07
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '17'
        hoofdstuk: '17'
  - number: 17.07.2.d
    text: |-
      beschrijving van de bedrijfstoestanden met de dienovereenkomstige gegevens inzake gewicht en zwaartepunt met
      inbegrip van de onbeladen toestand en de toestand van het werktuig bij verplaatsing;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.07
  - number: 17.07.2.e
    text: |-
      berekening van het kenterende, trimmende en oprichtende moment met vermelding van de optredende hellings- en
      trimhoeken, resterende veiligheidsafstanden en resterende vrijboorden;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.07
  - number: 17.07.2.f
    text: overzicht van de uitkomsten van de berekeningen met vermelding van de grenzen van gebruik en belasting.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.07
  - number: 17.07.3
    text: 'Het bewijs van stabiliteit moet ten minste zijn gebaseerd op de volgende veronderstelde belading:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.07
  - number: 17.07.3.a
    text: |-
      dichtheid van de baggerspecie bij baggermolens: - zand en grind 1,5 ton/m3;
        - zeer nat zand 2,0 ton/m3;
        - grond gemiddeld 1,8 ton/m3;
        - mengsel uit zand en water in buisleidingen 1,3 ton/m3;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.07
  - number: 17.07.3.b
    text: bij baggerwerktuigen met grijptanden moeten de waarden onder a met 15% worden verhoogd;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.07
  - number: 17.07.3.c
    text: bij hydraulische baggerwerktuigen moet worden uitgegaan van het maximale hefvermogen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.07
  - number: 17.07.4.1
    text: 'In het bewijs van de stabiliteit moet rekening worden gehouden met de momenten resulterend uit:'
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.07
  - number: 17.07.4.1.a
    text: de belading;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.07
  - number: 17.07.4.1.b
    text: bouwkundige asymetrieën;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.07
  - number: 17.07.4.1.c
    text: de winddruk;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.07
  - number: 17.07.4.1.d
    text: de draaibeweging bij werktuigen met eigen aandrijvingskracht;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.07
  - number: 17.07.4.1.e
    text: dwarsstroming voor zover vereist;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.07
  - number: 17.07.4.1.f
    text: ballast en voorraden;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.07
  - number: 17.07.4.1.g
    text: deklasten en eventueel lading;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.07
  - number: 17.07.4.1.h
    text: vrije oppervlakken van vloeistof;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.07
  - number: 17.07.4.1.i
    text: dynamische traagheidskrachten;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.07
  - number: 17.07.4.1.k
    text: andere mechanische inrichtingen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.07
  - number: 17.07.4.2
    text: |-
      Het moment tengevolge van de winddruk dient te worden berekend volgens de volgende formule: In deze formule
      betekent: c de vormafhankelijke weerstandscoëfficiënt; Voor vakwerk moet worden uitgegaan van c = 1,2 en voor
      gesloten constructies van c = 1,6, waarbij rekening is gehouden met de invloed van windstoten. Het windvangend
      oppervlak is de omhullende oppervlakte van het vakwerk. p de specifieke winddruk; deze moet uniform op 0,25 kN/
      m2 worden gesteld; A het zijdelings oppervlak boven het vlak van de grootste inzinking in m2; I de afstand van het
      zwaartepunt van het zijdelings oppervlak A tot het vlak van de grootste inzinking in m.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.07
  - number: 17.07.4.3
    text: |-
      Voor de vaststelling van de momenten bij de draaibeweging als bedoeld in lid 4.1, onder d, dient bij drijvende
      werktuigen met mechanische middelen tot voortbeweging de formule van [artikel 15.03, zesde lid][ref1], te worden
      gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel15
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.07
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '15'
        hoofdstuk: '15'
  - number: 17.07.4.4
    text: |-
      Het door dwarsstroming als bedoeld in lid 4.1, onder e, veroorzaakte moment hoeft alleen te worden meegerekend bij
      drijvende werktuigen die gedurende het werk in stromend water dwarsliggend met ankers of kabels zijn vastgemaakt.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.07
  - number: 17.07.4.5
    text: |-
      Bij de berekening van de momenten resulterend uit vloeibare ballast en vloeibare voorraden als bedoeld in lid 4.1,
      onder f, dient de voor de stabiliteit meest ongunstige vullingsgraad van de tanks te worden vastgesteld en het
      dienovereenkomstige moment in de berekening te worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.07
  - number: 17.07.4.6
    text: |-
      Met het uit dynamische traagheidskrachten resulterende moment als bedoeld in lid 4.1, onder i, moet op passende
      wijze rekening worden gehouden, wanneer door bewegingen van de lading en van de werkinrichtingen een beïnvloeding
      van de stabiliteit te verwachten is.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.07
  - number: 17.07.5
    text: |-
      De oprichtende momenten kunnen bij drijvende voorwerpen met loodrechte zijwanden worden berekend volgens de
      formule: 'In deze formule betekent: de metacentrumhoogte in m; φ de hellingshoek in °. Deze formule is van'
      toepassing tot hellingshoeken van ten hoogste 10° of tot een hellingshoek waarbij de zijde van het dek wordt
      ingedompeld of de bodem boven water uitkomt. Daarbij is de kleinste hoek doorslaggevend. Bij schuin lopende
      zijwanden is de formule van toepassing tot hellingshoeken van ten hoogste 5°; voor het overige zijn de criteria
      als bedoeld in het derde lid en in de leden 4.1 tot en met 4.6, van toepassing. Wanneer de bijzondere vorm van het
      drijvend voorwerp of de drijvende voorwerpen dit niet toelaat, zijn stabiliteitskrommen als bedoeld in het tweede
      lid, onder c, vereist.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.07
  - number: 17.08.1
    text: |-
      Indien gebruik wordt gemaakt van een verminderd resterend vrijboord als bedoeld in
      [artikel 17.04, derde lid][ref1], moet voor alle bedrijfsomstandigheden zijn aangetoond dat


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel17
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.08
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '17'
        hoofdstuk: '17'
  - number: 17.08.1.a
    text: na correctie voor vrije vloeistofoppervlakken de metacentrumhoogte niet minder dan 0,15 m bedraagt;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.08
  - number: 17.08.1.b
    text: |-
      binnen een slagzij van 0° tot en met 30° een oprichtende arm van ten minste *h* = 0,30 – 0,28 ·φ [m] aanwezig is.
      Daarbij isφ de hellingshoek, waar vandaan de stabiliteitskromme negatief wordt (stabiliteitsomvang). Hij mag niet
      kleiner zijn dan 20° of 0,35 rad en moet in de formule op ten hoogste 30° of 0,52 rad worden gesteld, waarbij voorφ
      de eenheid radiaal (rad) moet worden gebruikt (1° = 0,01745 rad);
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.08
  - number: 17.08.1.c
    text: de som van de hoeken resulterend uit slagzij en trim niet meer dan 10° bedraagt;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.08
  - number: 17.08.1.d
    text: |-
      een resterende veiligheidsafstand als bedoeld in [artikel 17.04][ref1] aanwezig is;


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel17
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.08
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '17'
        hoofdstuk: '17'
  - number: 17.08.1.e
    text: een resterend vrijboord van ten minste 0,05 m aanwezig is;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.08
  - number: 17.08.1.f
    text: |-
      binnen een slagzij van 0° tot en met 30° een resterende arm van ten minste *h* = 0,20 – 0,23 · φ[m] aanwezig is.
      Daarbij is j de hellingshoek, waar vandaan de stabiliteitskromme negatief wordt; deze moet in de formule op ten
      hoogste 30° of 0,52 rad worden gesteld. Onder resterende arm moet worden verstaan het tussen 0° en 30° hellingshoek
      aanwezige grootste verschil tussen de kromme van de oprichtende armen en de kromme van de kenterende armen. Indien
      een opening naar het inwendige van het schip in het water terecht komt bij een hellingshoek die kleiner is dan
      de hellingshoek die bij het grootste verschil hoort, is de eis inzake de resterende arm van toepassing op deze
      hellingshoek.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.08
  - number: '17.09'
    text: |-
      Inzinkingsmerken als bedoeld in [artikel 4.04][ref1] en diepgangsschalen als bedoeld in [artikel 4.06][ref2] moeten
      zijn aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Artikel4
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.09
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0025973
        artikel: '4'
        hoofdstuk: '4'
  - number: 17.10.1
    text: Bij een drijvend werktuig
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.10
  - number: 17.10.1.a
    text: door de werkinrichting waarvan geen enkele wijziging van de slagzij of de trim kan worden veroorzaakt, en
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.10
  - number: 17.10.1.b
    text: |-
      waarbij een verschuiving van het gewichtszwaartepunt verregaand kan worden uitgesloten, kan worden afgezien van
      toepassing van de [artikelen 17.04 tot en met 17.08][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel17
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.10
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '17'
        hoofdstuk: '17'
  - number: 17.10.2
    text: Echter moet
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.10
  - number: 17.10.2.a
    text: bij maximale belading de veiligheidsafstand 300 mm en het vrijboord 150 mm bedragen;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.10
  - number: 17.10.2.b
    text: de veiligheidsafstand voor niet spatwater- en regendicht afsluitbare openingen 500 mm bedragen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel17.10
  - number: '18.01'
    text: |-
      Schepen bestemd voor bouwwerkzaamheden, die als zodanig in het certificaat van onderzoek overeenkomstig
      [bijlage B][ref1] zijn aangeduid, mogen buiten werkterreinen slechts onbeladen varen. Deze voorwaarde dient
      in het certificaat van onderzoek te worden vermeld. Hiertoe moeten deze schepen bestemd voor bouwwerkzaamheden
      beschikken over een verklaring van de bevoegde autoriteit over de duur van de werkzaamheden en de begrenzing van
      het werkterrein waarop het schip mag worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel18.01
    references:
      - id: ref1
        bwb_id: BWBR0025973
  - number: '18.02'
    text: |-
      Voor zover in dit hoofdstuk niets anders is bepaald, zijn met betrekking tot de bouw en de uitrusting van schepen
      bestemd voor bouwwerkzaamheden de [hoofdstukken 3 tot en met 14][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel18.02
    references:
      - id: ref1
        bwb_id: BWBR0025973
        hoofdstuk: '3'
  - number: 18.03.1.a
    text: |-
      [Artikel 3.03, eerste lid][ref1], is van overeenkomstige toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel3
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel18.03
    references:
      - id: ref1
        bwb_id: BWBR0025973
        artikel: '3'
        hoofdstuk: '3'
  - number: 18.03.1.b
    text: |-
      De [hoofdstukken 5][ref1] en [6][ref2] zijn van overeenkomstige toepassing, indien het schip is voorzien van eigen
      mechanische middelen tot voortbeweging;


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel18.03
    references:
