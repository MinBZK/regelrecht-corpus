  - number: 24.05.1
    text: |-
      Een op 31 december 2001 in de binnenvaart werkzame deksman kan de bevoegdheid als matroos verkrijgen, nadat hij
      zijn 19e levensjaar heeft beëindigd en een vaartijd als lid van de dekbemanning van ten minste drie jaar heeft
      aangetoond; daarvan moeten ten minste een jaar in de binnenvaart en twee jaar in de binnenvaart of in de zee- of
      kustvaart of visserij vervuld zijn. Deze matroos kan de bevoegdheid als:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel24.05
  - number: 24.05.1.a
    text: volmatroos verkrijgen, wanneer hij een vaartijd in de Rijnvaart van ten minste een jaar als matroos kan aantonen,
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel24.05
  - number: 24.05.1.b
    text: stuurman verkrijgen, wanneer hij een vaartijd in de Rijnvaart van ten minste twee jaar als matroos kan aantonen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel24.05
  - number: 24.05.2
    text: |-
      Een op 31 december 2001 in de binnenvaart werkzame matroos kan de bevoegdheid als volmatroos verkrijgen, wanneer
      hij een vaartijd in de Rijnvaart van ten minste een jaar als matroos kan aantonen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel24.05
  - number: 24.05.3
    text: |-
      Een op 31 december 2001 in de binnenvaart werkzame matroos kan de bevoegdheid als stuurman verkrijgen, wanneer hij
      een vaartijd in de Rijnvaart van ten minste twee jaar als matroos kan aantonen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel24.05
  - number: 24.05.4
    text: |-
      Een op 31 december 2001 in de Rijnvaart werkzame volmatroos kan de bevoegdheid als stuurman verkrijgen, wanneer hij
      een vaartijd in de Rijnvaart van ten minste een jaar als volmatroos kan aantonen.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel24.05
  - number: 24.05.5
    text: |-
