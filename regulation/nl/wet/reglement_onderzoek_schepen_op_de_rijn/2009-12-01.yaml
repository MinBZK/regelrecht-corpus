    text: |-
      Indien de toepassing van de in dit hoofdstuk genoemde bepalingen na afloop van de overgangsbepalingen in de
      praktijk moeilijk uitvoerbaar is of onevenredig hoge kosten met zich brengt, kan de Commissie van Deskundigen op
      grond van aanbevelingen van de Centrale Commissie voor de Rijnvaart afwijkingen van deze voorschriften toestaan.
      Deze afwijkingen moeten in het certificaat van onderzoek worden aangetekend.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel24.04
  - number: 24.04.5
    text: |-
      Indien dit voorschrift bij de vereisten aan de hoedanigheid van uitrustingsstukken verwijst naar een Europese of
      internationale norm, mogen na een nieuwe formulering of bewerking van die norm de betreffende uitrustingsstukken
      nog 20 jaar na de nieuwe formulering of bewerking van de norm verder worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel24.04
