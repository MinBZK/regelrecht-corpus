      voorzien zijn van een deugdelijke stuurinrichting, die voldoende vaar- en manoeuvreereigenschappen mogelijk maakt;


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0025973#Artikel6
