    text: |-
      [Hoofdstuk 22][ref1]: Aan [hoofdstuk 22][ref2] is voldaan indien de stabiliteit voldoet aan de van kracht zijnde
      resoluties van de Internationale Maritieme Organisatie (IMO) en de betreffende stabiliteitsberekeningen door de
      bevoegde autoriteit gekeurd zijn en de containers op een voor de zeevaart gebruikelijke wijze zijn vastgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Hoofdstuk22
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Hoofdstuk22
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel20.01
