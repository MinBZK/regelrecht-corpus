  - number: 24.06.6
    text: |-
      Bij nieuwbouw van schepen met een lengte van meer dan 110 m, waarvan de kiel is gelegd vóór 1 oktober 2001, kan
      het voldoen aan [artikel 22a.05, tweede lid, onder d][ref1], achterwege blijven voor de vaart tussen Mannheim en
      Karlsruhe. Deze vaartbeperking moet in het certificaat van onderzoek worden aangetekend onder punt 10.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel22a
