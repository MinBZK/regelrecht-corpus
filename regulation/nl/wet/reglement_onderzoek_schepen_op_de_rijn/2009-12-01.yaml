  - number: 24.01.1
    text: |-
      De artikelen [24.02 tot en met 24.04][ref1] zijn slechts van toepassing op vaartuigen, die bij de inwerkingtreding
      van dit reglement voorzien zijn van een geldig certificaat van onderzoek overeenkomstig het op 31 december 1994
      geldende Reglement onderzoek schepen op de Rijn of op 31 december 1994 in aanbouw zijn dan wel verbouwd worden.


