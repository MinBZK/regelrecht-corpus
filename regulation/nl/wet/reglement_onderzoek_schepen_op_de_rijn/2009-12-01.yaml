  - number: 19.02.5
    text: |-
      Kanaalspitsen moeten op het voorschip met een anker met een massa van ten minste 250 kg zijn uitgerust, dat
      is voorzien van een ketting van ten minste 50 m lengte, waarvan de minimum breeksterkte in kN een derde van
      de werkelijke ankermassa in kg bedraagt. De ketting mag door een kabel van gelijke minimum breeksterkte worden
      vervangen. De volgende uitrustingsstukken moeten aan boord zijn:
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel19.02
  - number: 19.02.5.a
    text: twee deugdelijke lenspompen;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel19.02
  - number: 19.02.5.b
    text: |-
      trossen voor het meren: - een tros van ten minste 100 m lengte en een diameter van 18 mm;
        - twee trossen van ten minste 60 m lengte en een diameter van 16 tot 18 mm;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel19.02
  - number: 19.02.5.c
    text: een werplijn;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel19.02
  - number: 19.02.5.d
    text: een drinkwaterreservoir;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel19.02
  - number: 19.02.5.e
    text: |-
      apparaten en installaties die nodig zijn voor het voeren en tonen van de optische tekens en het geven van de
      geluidsseinen, voorgeschreven in het Rijnvaartpolitiereglement;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel19.02
  - number: 19.02.5.f
    text: |-
      een loopplank, ten minste 0,40 m breed en ten minste 4 m lang, waarvan de zijkanten door een witte streep zijn
      gemarkeerd; deze loopplank moet voorzien zijn van een leuning;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel19.02
  - number: 19.02.5.g
    text: een bootshaak;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel19.02
  - number: 19.02.5.h
    text: een verbandtrommel;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel19.02
  - number: 19.02.5.i
    text: een verrekijker 7 × 50 of een grotere lensdiameter;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel19.02
  - number: 19.02.5.j
    text: een bord met aanwijzingen betreffende het redden en bijbrengen van drenkelingen;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel19.02
  - number: 19.02.5.k
    text: een als zodanig gekenmerkt brandbestendig reservoir met deksel voor het bewaren van oliehoudende poetslappen;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel19.02
  - number: 19.02.5.l
    text: |-
      een als zodanig gekenmerkt brandbestendig reservoir voor het verzamelen van vast klein chemisch afval en een als
      zodanig gekenmerkt brandbestendig reservoir met deksel voor het verzamelen van vloeibaar klein chemisch afval;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel19.02
  - number: 19.02.5.m
    text: een als zodanig gekenmerkt brandbestendig reservoir voor slops;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel19.02
  - number: 19.02.5.n
    text: |-
      aan boord van schepen waarvan de hoogte van het boord boven de waterlijn bij ledig schip meer dan 1,50 m bedraagt
      een buitenboordtrap of -ladder;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel19.02
  - number: 19.02.5.o
    text: 2 draagbare blustoestellen;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel19.02
  - number: 19.02.5.p
    text: |-
      een bijboot met - een stel roeiriemen,
        - een meertouw,
        - een hoosvat;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel19.02
  - number: 19.02.5.q
    text: twee reddingsboeien en twee zwemvesten;
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel19.02
  - number: 19.02.6
    text: |-
      [artikel 13.01][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0025973#Artikel13
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel19.02
