  - number: 24.06.1
    text: |-
      Op vaartuigen waarvoor vanaf 1 januari 1995 voor het eerst een certificaat van onderzoek als bedoeld in dit
      reglement is afgegeven zijn de volgende bepalingen van toepassing, tenzij zij op 31 december 1994 in aanbouw of in
      ombouw waren.
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel24.06
  - number: 24.06.2
    text: |-
      Deze vaartuigen moeten voldoen aan de versie van het Reglement onderzoek schepen op de Rijn die van kracht is op
      de dag waarop het certificaat van onderzoek is afgegeven. In afwijking hiervan mogen passagiersschepen, waaraan met
      ingang van 1 januari 2006 en vóór 1 januari 2007 voor het eerst een certificaat van onderzoek overeenkomstig dit
      reglement wordt afgegeven, voldoen aan de op 31 december 2005 geldende voorschriften van [hoofdstuk 15][ref1] van
      dit reglement.


      [ref1]: https://wetten.overheid.nl/BWBR0025973#Hoofdstuk15
    url: https://wetten.overheid.nl/BWBR0025973/2009-12-01#Artikel24.06
    references:
